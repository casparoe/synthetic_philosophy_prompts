  # Diagnostic Decision Tree: The Metaphysics of Persistence

  **Starting Commitment:** You accept that a single entity can be present at more than one moment (e.g., the person who begins reading this handout is the same entity as the person who finishes it).

  **Node 1: Substantive vs. Verbal**
  Is there a substantive metaphysical fact about *how* objects persist, distinct from linguistic conventions about how we choose to count and describe entities relative to our interests?
  *   **No:** There is no fact of the matter beyond our descriptive practices.
      *   → **Leaf: Deflationism / Verbalism**
  *   **Yes:** There is a mind-independent structure to persistence.
      *   → **Go to Node 2**

  **Node 2: Ontology of Time**
  Does your account of persistence inevitably presuppose that past, present, and future moments exist ontologically on par with one another (Eternalism), or can it be settled independently of this (compatible with Presentism)?
  *   **Compatible with Presentism:** The account does not require the existence of non-present moments.
      *   → **Go to Node 3A**
  *   **Presupposes Eternalism:** The account requires the existence of past and future entities.
      *   → **Go to Node 3B**

  **Node 3A: Mechanism of Persistence (Presentism-Compatible)**
  To explain how an object changes properties over time (e.g., being bent then straight), must we posit that it has distinct parts located at different times, or that it is wholly present at each time (perhaps relativizing properties to times)?
  *   **Distinct Parts:** It has distinct parts at different times.
      *   → **Leaf: [Incoherent Combination]** (See Notes)
  *   **Wholly Present:** It is wholly present at each time it exists.
      *   → **Go to Node 4A**

  **Node 4A: Nature of Diachronic Sameness (Wholly Present)**
  Is the relation holding between the entity at time *t1* and the entity at time *t2* strict numerical identity, or is it a relation of similarity/causation between numerically distinct entities?
  *   **Relation between Distinct Entities:** They are distinct but related.
      *   → **Leaf: [Unoccupied/Transientism]** (See Notes)
  *   **Strict Numerical Identity:** It is the very same entity.
      *   → **Leaf: Endurantism**

  **Node 3B: Mechanism of Persistence (Eternalism-Required)**
  To explain persistence through change, must the object have distinct parts located at different times (temporal parts), such that it is not wholly present at any single moment?
  *   **No:** It is wholly present at each moment despite Eternalism.
      *   → **Leaf: [Unattractive/Eternalist Endurance]** (See Notes)
  *   **Yes:** It is extended in time like space, composed of temporal parts.
      *   → **Go to Node 4B**

  **Node 4B: Reference of Ordinary Terms (Temporal Parts)**
  When we name and count ordinary objects (you, this desk, the seminar), do we refer to the temporally extended whole composed of these parts, or to the instantaneous temporal parts themselves?
  *   **The Instantaneous Parts:** We refer to the momentary stages; talk of "persistence" is talk of related stages.
      *   → **Leaf: Stage Theory**
  *   **The Temporally Extended Whole:** We refer to the sum of stages across time; the object is a "spacetime worm."
      *   → **Leaf: Perdurantism (Worm Theory)**

  ***

  # Diagnostic Notes

  ### 1. Unoccupied and Incoherent Combinations
  *   **[Incoherent Combination] (Node 3A → Distinct Parts):** Asserting that objects have distinct temporal parts while maintaining compatibility with Presentism is generally regarded as incoherent. Temporal parts located at non-present times require those times to exist. If a student selects this path, they likely misunderstand the commitment of "temporal parts" or hold a highly unconventional view of Presentism (e.g., that past parts exist now).
  *   **[Unoccupied/Transientism] (Node 4A → Relation between Distinct Entities):** This position denies temporal parts (wholly present) but also denies strict identity across time. While logically possible, this space is largely unoccupied. Most philosophers who deny trans-temporal identity posit temporal parts (Stage Theory) to avoid the contradiction of an entity being wholly present yet numerically distinct from itself. This combination is often deemed unstable: if the entity is wholly present at *t1* and wholly present at *t2*, but not identical, what grounds the unity of the "persisting" object without parts?
  *   **[Unattractive/Eternalist Endurance] (Node 3B → No Temporal Parts):** This position accepts Eternalism but denies temporal parts (often called "Eternalist Endurantism" or "Adverbialism"). It is not incoherent, but it is often flagged as unattractive or motivated by a desire to salvage Endurance within an Eternalist framework without adopting the machinery of Perdurantism. It occupies a distinct logical space but collapses into Endurantism on the core metaphysical question of parts.

  ### 2. Inseparable Pairs
  *   **None:** The tree successfully separates the four required leaves (Deflationism, Endurantism, Worm Theory, Stage Theory) based on substantive commitments rather than labels. However, note that **Worm Theory** and **Stage Theory** are often grouped under the umbrella of **Perdurantism**. If the seminar treats "Perdurantism" as a single leaf, these two branches merge at Node 3B. The tree separates them only at the level of semantic reference (Node 4B).

  ### 3. Application to Non-Standard Cases
  The following diagnoses indicate how well each leaf extends to entities that are neither persons nor middle-sized dry goods (e.g., waves, species, symphonies, corporations).

  *   **Endurantism:**
      *   *Extends Cleanly:* To corporations and perhaps species (treated as abstract types or collective agents that are wholly present).
      *   *Classifies Badly:* Processes and events (e.g., a symphony, a wave). It is unintuitive to say a symphony is "wholly present" at any single moment; it seems essentially extended. Endurantism struggles to account for the mereology of events without ad hoc modifications.
      *   *Cannot Place:* Highly diffuse entities without clear boundaries (e.g., a cloud or a turbulence pattern) where "wholly present" lacks clear truth conditions.

  *   **Perdurantism (Worm Theory):**
      *   *Extends Cleanly:* To events, processes, and waves. A symphony is naturally viewed as a temporally extended whole composed of temporal parts (movements, notes).
      *   *Classifies Badly:* To entities where momentary existence seems insufficient for the kind of thing it is (e.g., a person or a corporation). While logically consistent, it conflicts with the intuition that "I" am the whole life, not just a stage.
      *   *Cannot Place:* None significantly; Worm Theory is highly generalizable due to its mereological flexibility.

  *   **Stage Theory:**
      *   *Extends Cleanly:* To instantaneous states or snapshots of reality.
      *   *Classifies Badly:* To entities requiring long-term continuity for their definition (e.g., a species or a corporation). A single stage of a corporation may not instantiate the functional properties that make it a corporation. It risks eliminating the persisting entity entirely in favor of a series.
      *   *Cannot Place:* Entities defined by their history (e.g., a specific wave generated by a specific event). If the stage is instantaneous, the historical property must be relational, which complicates the intrinsic nature of the stage.

  *   **Deflationism / Verbalism:**
      *   *Extends Cleanly:* To all cases, uniformly. It dissolves the metaphysical problem by attributing persistence conditions to linguistic convention.
      *   *Classifies Badly:* To cases where scientific discovery seems to track mind-independent persistence conditions (e.g., biological species). If persistence is merely verbal, it is unclear why some descriptions track causal structures better than others.
      *   *Cannot Place:* None; its universality is its defining feature, though this may be seen as a failure to engage with the ontology of the cases.
