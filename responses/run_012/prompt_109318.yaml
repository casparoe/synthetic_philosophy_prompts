answer: |-
  Here is the specification list for a theory of properties, built around the cases you provided. I have distinguished between constraints demanded by a naturalistic metaphysics (Genuine) and those that reflect specific metaphysical preferences (Taste).

  ### The Adequacy Requirements

  **1. The Discrimination Constraint**
  *   **The Case:** Co-extensive properties (e.g., *having a heart* vs. *having a kidneys*). As a matter of fact, every creature with one has the other.
  *   **The Requirement:** The theory must allow for distinct properties even if their extensions (the set of things that have them) are identical in the actual world, and potentially even across all possible worlds (if one accepts necessary co-extension).
  *   **Status:** **Genuine Desideratum.** Natural science distinguishes properties by causal role, not just by which objects happen to have them. If a theory identifies properties solely with classes of objects, it cannot account for distinct laws of nature governing co-extensive traits.

  **2. The Unity Constraint**
  *   **The Case:** The Imperfect Community. A group where every pair resembles each other (A matches B, B matches C, C matches A), but there is no single respect in which *all* three match.
  *   **The Requirement:** The theory must explain what binds the instances of a property together such that they form a genuine class, not just a web of pairwise similarities. There must be a "common respect" that is not reducible to mere resemblance.
  *   **Status:** **Genuine Desideratum.** Without this, classification is arbitrary. Science assumes that when we group electrons, it is because they share a nature, not just because they pairwise resemble one another in a shifting circle.

  **3. The Sparsity Constraint**
  *   **The Case:** Disjunctive/Negative Properties. Nothing is wholly red and wholly blue, yet plenty of things are *red-or-blue*.
  *   **The Requirement:** The theory must distinguish between "natural" properties that carve nature at its joints and "gerrymandered" properties (like *red-or-blue*) that are merely linguistic or logical constructs. Not every predicate corresponds to a property.
  *   **Status:** **Genuine Desideratum.** This is non-negotiable for naturalism. Causal powers reside in sparse properties (mass, charge), not in disjunctive ones. A theory that admits *red-or-blue* as a genuine property fails to track causal relevance.

  **4. The Purity Constraint**
  *   **The Case:** Impure Properties (e.g., *being Napoleon's sibling*, *being the capital of France*). These properties drag in specific individuals.
  *   **The Requirement:** The theory must take a stance on whether properties can contain particular individuals as constituents.
  *   **Status:** **Taste/Partisan.** This is a metaphysical preference. Quinean nominalists reject these as illegitimate; Haecceitists embrace them. Science generally prefers purely qualitative properties, but historical/geological sciences sometimes rely on indexical ones. A theory can be adequate either by admitting them or by reducing them to qualitative relations.

  **5. The Independence Constraint**
  *   **The Case:** Uninstantiated Properties (e.g., a specific shade of blue no object has ever had, or properties of merely possible particles).
  *   **The Requirement:** The theory must decide whether properties can exist without instances.
  *   **Status:** **Taste/Partisan.** This divides Immanent Realists (properties exist only *in* things) from Transcendent Realists (properties exist in a "heaven" of forms). Natural science is agnostic; it deals with what is instantiated. Demanding independence risks "spookiness"; denying it risks modal rigidity.

  **6. The Integration Constraint**
  *   **The Case:** The Regress of Instantiation (Bradley's Regress). If an object *a* has property *F*, what ties *a* to *F*? If it's a relation *R*, what ties *a*, *F*, and *R*?
  *   **The Requirement:** The theory must explain how properties attach to objects without generating an infinite regress of further relations. The property must be "in" the object in a way that stops the buck.
  *   **Status:** **Genuine Desideratum.** If you cannot solve this, you haven't explained predication; you've just postponed it. An ontology where objects and properties float free of one another is incoherent.

  ---

  ### The Trade-Offs: Where the Constraints Clash

  You asked if any requirements are jointly unsatisfiable. There is one tension that forces a hard choice, and one that forces a "bullet bite."

  **1. The Hard Trade-Off: Sparsity vs. Discrimination**
  These two are in direct tension within a naturalistic framework.
  *   **The Conflict:** Science wants **Sparsity** (only fundamental physical properties are "real" to avoid occult qualities). But science also wants **Discrimination** (biology and psychology need distinct properties like *being a gene* or *being in pain*, even if these turn out to be co-extensive with complex physical states).
  *   **The Choice:** You cannot maximize both.
      *   If you prioritize **Sparsity**, you risk eliminativism about the special sciences (there are no biological properties, only physical ones).
      *   If you prioritize **Discrimination**, you risk bloat (admitting every functional role as a property violates Sparsity).
  *   **The Cost:** A naturalistic metaphysics must either accept non-reductive physicalism (admitting higher-level properties despite Sparsity concerns) or accept reductionism (sacrificing the distinctness of special science properties). You cannot have a sparse ontology that fully validates the distinct causal powers of every special science kind without a complex account of realization.

  **2. The Unsatisfiable Pair: Integration vs. The "No Spooky Primitives" Rule**
  While not two items on the list above, this is the structural impossibility hidden in your "Purpose" clause.
  *   **The Conflict:** To satisfy the **Integration Constraint** (stop Bradley's Regress), you *must* posit a primitive fact of instantiation. You cannot analyze "instantiation" in terms of something else without restarting the regress.
  *   **The Violation:** This violates your naturalistic purpose ("nothing gets to be spooky or primitive unless it's earning its keep"). A primitive instantiation tie *is* a spooky primitive.
  *   **The Cost:** You must give up the hope of a fully analyzed ontology. Every adequate theory must accept one brute fact: either that instantiation is unanalyzable (Realism), or that objects are just bundles of properties with no tie (Bundle Theory), or that only particulars exist (Nominalism). You cannot satisfy Integration *and* have a fully reductive, non-primitive explanation.

  ### The "Killer" Requirement

  If you are filtering theories for a naturalistic metaphysics, the single requirement that does the most work is **The Sparsity Constraint**.

  *   **Why:** It is the easiest constraint to state but the hardest to satisfy without controversy. It immediately rules out Class Nominalism (classes are too abundant), Predicate Nominalism (predicates are too abundant), and Plenitude Realism (all possible properties exist). It forces the theory to explain *why* some similarities are objective and others are not. This is the gatekeeper for any metaphysics that wants to speak to physics.

  ### Brief Scoring of Contenders

  *   **Transcendent Realism (Platonic Universals):** Fails **Integration** (how do transcendent forms tie to physical objects?) and risks violating **Naturalism** (spooky existence). Passes **Discrimination** and **Independence**.
  *   **Immanent Realism (Aristotelian Universals):** Passes **Integration** (properties are in things) and **Sparsity**. Fails **Independence** (no uninstantiated properties). Struggles with **Discrimination** if co-extension is necessary.
  *   **Trope Theory:** Passes **Integration** (properties are particularized) and **Independence** (can posit unexemplified tropes). Struggles with **Unity** (requires a primitive resemblance relation to group tropes into kinds).
  *   **Class/Predicate Nominalism:** Fails **Sparsity** and **Discrimination** immediately. Ruled out for naturalistic purposes.
  *   **Structuralism/Power Ontologies:** Attempts to bypass the **Integration** problem by making objects nodes in a causal web. High promise for science, but risks failing **Discrimination** if structure is all there is.
