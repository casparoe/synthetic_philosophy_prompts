      *   *Issue:* Word count. Need to expand the sensory details of Vardan and the internal monologue to ensure length.

  10. **Final Polish:** Check idioms. Ensure the "Long Night" threat is clear (death outside walls). Ensure the 9-hour walk constraint is clear.

  *(Self-Correction on Word Count)*: I need to be careful not to write too little. I will expand on the atmosphere of the customs house and the specific textures of the debate.

