prompt: |-
  Write a short story of roughly 1,200 to 1,700 words, set in the walled city of Vardan on the eve of the Long Night.

  For two centuries Vardan has kept an institution known simply as the Ledger. Once a year, at dusk on the eve of the Long Night, the Ledger posts on the door of the customs house a single line for every citizen: the name of the settlement in which that citizen will die. By the city's own accounting the Ledger has been wrong about one time in ten. Its method is not public. The clerks who compose the entries are raised in the Ledger's own house, are forbidden to discuss their work with outsiders, and have never been known to answer a direct question about it.

  Your protagonist is a woman who has just come from the customs house, where this year's lines were posted, and who has read her own. It names Vardan, the city she is standing in. She knows that the only other settlement within reach is Ossen, nine hours away on foot across the salt flats, and that anyone still outside a wall at nightfall will not live to see morning. She has until dusk to decide whether to remain in Vardan or to walk to Ossen.

  Two further features of this world should carry their full weight in the story.

  First, the clerks describe their procedure in a way that citizens find either mystical or fraudulent. They say that composing an entry means working through, in full and in order, the deliberation of the person named — not that person's past behaviour, but the process by which she will arrive at a decision, including whatever she thinks and feels upon reading her own entry. On the clerks' account, an entry is therefore a forecast of what a particular way of deciding will issue in, and the deliberation of a person now reasoning about the Ledger has already been folded into the entry she is reading.

  Second, the city's records of overturned entries are incomplete and are read in incompatible ways. One school holds that the overturned tenth are simply the Ledger's honest error, and that the clustering of such cases among citizens who settle matters by lot, or by some other procedure that leaves the outcome open, is an artefact of how the records were kept. Another school holds that the clustering is real, and that it shows that only a decision made from outside the clerk's working-through — by coin, by lot, by something no rehearsal could contain — can escape the entry. Nobody has settled the question, and the story should not settle it either.

  The scenario belongs to the family of predictor problems in decision theory, in which an agent's choice and a reliable forecast of that choice are already correlated before the agent acts. The story should dramatize three ways of responding to the entry, each embodied in a character who is a person rather than a mouthpiece:

  - someone who treats the entry as evidence — a sign or symptom of what she is about to do — and who reasons that because she has read Vardan, her walking to Ossen is already discounted in what she read, so that the entry gives her no reason to walk anywhere;
  - someone who treats the entry as causally inert with respect to her own limbs, who insists that a forecast cannot decide for her, that her legs will carry her where she tells them to, and that the overturned tenth are best explained as the Ledger's honest error;
  - someone who holds that the real question is not which city but which method of deciding, and who argues that any method chosen at this late hour — a coin included — is a method whose results the clerk would have worked through in advance, so that the escape the second school describes is an illusion, and the only genuine decision available was made long before the lines were posted.

  The story should also include at least one passage in which the protagonist's deliberation unfolds step by step on the page, with her reasoning visible as she moves through it, rather than summarized as her weighing her options; and at least one scene in which a character proposes settling the matter by lot while the others disagree about whether that is an evasion or the only real decision left to them. Let the prose stay concrete and the metaphysics stay open. The narrator should never use the vocabulary of decision theory — no expected value, no evidential, no causal — and the story must show the three lines of reasoning rather than name them. Do not tell the reader where she dies. Invent the city's own idiom, proverbs, and house glosses as needed; do not borrow from real scripture, philosophy, or literature, and do not name real works or thinkers.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Word Count:** 1,200 to 1,700 words.
      *   **Setting:** Walled city of Vardan, eve of the Long Night.
      *   **Core Mechanic:** The Ledger posts where every citizen will die once a year. 90% accuracy. Clerks claim to work through the person's deliberation (including reading the entry) to compose the entry.
      *   **Protagonist:** A woman who just read her entry: "Vardan". She is currently in Vardan.
      *   **Conflict:** Stay in Vardan (matches entry) or walk to Ossen (9 hours away, must be inside walls by nightfall). If outside at nightfall, death is certain (Long Night dangers).
      *   **World Features:**
          1.  Clerks' method: Forecasting the deliberation process, including the reaction to the forecast itself (Newcomb-like/Predictor problem).
          2.  The 10% Error Rate: Disputed. School A: Honest error, clustering by lot is artefact. School B: Only decisions outside the clerk's working-through (lot/coin) escape the entry.
      *   **Characters (embodiment of reasoning styles):**
          1.  *Evidence/Sign:* Treats entry as fixed evidence. If it says Vardan, walking to Ossen is already ruled out by the logic that produced the entry. (Evidential Decision Theory-ish).
          2.  *Causal/Free Will:* Treats entry as inert prediction. Legs move where told. 10% are just mistakes. (Causal Decision Theory-ish).
          3.  *Method/Meta-Decision:* Focuses on *how* to decide. Argues even choosing a coin now is part of the deliberation the clerk foresaw. Only past disposition matters. (Functional/Timeless-ish).
      *   **Requirements:**
          *   Step-by-step deliberation passage for the protagonist.
          *   Scene proposing settling by lot (coin/lot) with disagreement.
          *   Concrete prose, open metaphysics.
          *   No decision theory vocabulary (no "expected value," "evidential," "causal," etc.).
          *   Invent idioms/proverbs (no real-world borrowing).
          *   Do not reveal where she dies.

  2.  **Character Development:**
      *   **Protagonist:** Elara. Needs to be thoughtful, perhaps a craftsman or scholar, someone used to weighing things.
      *   **Character 1 (Evidence):** Kaelen. Stoic, fatalistic but rational. Believes the Ledger is a mirror, not a command.
      *   **Character 2 (Causal/Free Will):** Torin. Impulsive, physical, believes in agency.
      *   **Character 3 (Method/Meta):** Isoline. Older, perhaps former clerk or deeply studied in Ledger lore. Philosophical.

  3.  **Plot Outline:**
      *   **Opening:** Elara at the customs house door. Reading the line. The atmosphere of the eve.
      *   **Meeting:** She meets her friends (Kaelen, Torin, Isoline) nearby. They discuss their entries.
      *   **Conflict:** Elara's entry is Vardan. Torin's is Ossen (or vice versa? No, Elara's is Vardan). Torin argues she should run. Kaelen argues it's futile.
      *   **Deliberation Passage:** Elara thinks through the logic step-by-step.
      *   **The Lot Scene:** Torin suggests a coin flip to beat the Ledger. Isoline counters. Kaelen weighs in.
      *   **Ending:** Dusk approaches. Elara makes a move (or stands still). Ambiguous ending regarding survival/death, focusing on the choice itself.

  4.  **Drafting - Section by Section:**

      *   *Setting the Scene:* The customs house door. The chalk lines. The crowd. The tension. Elara reads "Vardan".
      *   *The Group:* Meet in a tavern or square. Let's say a square near the West Gate (gateway to Ossen).
      *   *The Debate:*
          *   Torin: "Walk. Legs work. Ledger wrong sometimes."
          *   Kaelen: "If you walk, the Ledger would have said Ossen. It says Vardan. So you stay."
          *   Isoline: "The choice isn't the step, it's the mind that steps."
      *   *Elara's Internal Monologue:* Needs to be granular. "If I go... then the line was wrong. But if the line was wrong, why trust it? But if I stay..."
      *   *The Coin:* Torin pulls a coin. "Chance breaks the chain." Isoline says "The clerk counted the coin flip in your head."
      *   *Conclusion:* The bell tolls. She moves. Where? Don't say.

  5.  **Refining the Logic (The Predictor Problem):**
      *   *Kaelen (Evidential):* If I choose to go to Ossen, then the Ledger would have predicted that. Since it predicted Vardan, I am not the kind of person who goes to Ossen. Choosing to go won't change the prediction that already exists. Therefore, staying is consistent with the evidence.
      *   *Torin (Causal):* The ink is dry. It can't stop my legs. If I walk, I arrive. The 10% error proves they aren't gods.
      *   *Isoline (Meta/Timeless):* The clerk simulated *this* conversation. If I decide to flip a coin now, the clerk knew I would flip a coin now. The only thing that matters is who I was before I came to the door.

  6.  **Writing - Focus on Tone and Idiom:**
      *   Avoid "decision theory." Use terms like "the threading," "the counting," "the shadow-line."
      *   Proverbs: "The map is not the walk," "Ink dries before the foot lifts."
      *   Ensure word count is within range (1200-1700).

  7.  **Drafting - Step-by-Step:**
      *   *Start:* Elara at the door. The chalk dust. The name "Elara of the Lower Ward: Vardan."
      *   *Move:* She walks to the Three Pillars. Meets Torin, Kaelen, Isoline.
      *   *Dialogue:* Torin wants to run. Kaelen says it's foolish.
      *   *Internal:* Elara's reasoning block.
      *   *Coin:* Torin offers the coin. Isoline shuts it down logically.
      *   *End:* The sun dips. The gate closes soon. She steps.

  8.  **Checking Constraints:**
      *   Word count check during drafting.
      *   No real philosophy names.
      *   No revelation of death.
      *   Concrete details (salt flats, walls, chalk, coin).

  9.  **Self-Correction during drafting:**
      *   *Issue:* Making sure the "Evidence" character doesn't sound like a fatalist who does nothing. They reason that the *act* of leaving is evidence against the prediction, but since the prediction is fixed, the act is unlikely. Actually, the prompt says: "reasons that because she has read Vardan, her walking to Ossen is already discounted in what she read, so that the entry gives her no reason to walk anywhere." This means: The entry *is* the evidence. If I walk, the entry would be different. Since it isn't, I won't walk.
