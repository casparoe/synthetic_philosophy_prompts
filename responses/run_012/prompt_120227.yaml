answer: |-
  The chalk dust still hung in the air around the customs house door, a grey mist settling on the shoulders of the crowd. Elara stood apart, her back against the cool stone of the alley wall, staring at the inside of her own wrist as if the pulse there might contradict what she had just read.

  *Elara of the Silk Ward: Vardan.*

  Nine hours to walk the salt flats to Ossen. Nine hours to be inside a wall before the sun touched the horizon. The Long Night did not forgive those caught in the open. But the line said Vardan. She was already in Vardan. To stay was to agree with the Ledger. To leave was to claim the clerks had failed.

  She pushed off the wall and walked toward the Three Pillars, where the shadows were lengthening into the square. Torin and Isoline were waiting. Torin paced the cobblestones, his boots clicking sharply. Isoline sat on the base of the central pillar, polishing a spectacles case with a slow, rhythmic cloth.

  "Well?" Torin asked, stopping his pace.

  "Vardan," Elara said. Her voice sounded thin in the cooling air.

  Torin spat on the stones. "Then you walk. Now. The flats are hard this time of year. You can make Ossen by the Seventh Bell if you don't stop for water."

  "And if the Ledger is right?" Isoline asked, not looking up from her polishing.

  "The Ledger is wrong one time in ten," Torin said. "I've seen men walk away from their own lines. They breathe. They eat. They die old in beds far from the chalk."

  "They are the artefact," Isoline said softly. "The records are messy. We don't know if they escaped or if the clerks simply missed a variable."

  Torin kicked at a loose stone. "I don't care about the clerks' variables. I care about my legs. Ink doesn't have muscles. If I tell my feet to go to Ossen, they go. The forecast is a ghost. It can't trip me."

  Elara listened, feeling the pull of his certainty. It was seductive, the idea that the body was a machine separate from the prophecy. But she shook her head. "If you walk to Ossen, Torin, then the line should have said Ossen. The clerks don't guess. They work through the thinking. They know I am standing here, talking to you, wondering if I should run. If I run, then the line I read was a lie. But the line isn't a lie. It's a mirror."

  "A mirror shows what is," Torin snapped. "It doesn't tell you where to stand."

  "The mirror shows what will be," Elara countered. "If I leave, I prove the mirror broken. But the mirror is rarely broken. So I must be the one who stays."

  Isoline finally looked up, her eyes milky with cataracts that saw too much. "You are both arguing about the step. The question is not the foot, but the mind that moves it. The clerk sat in a quiet room and thought your thoughts. They felt your fear. They weighed this very conversation. If you decide to run now, the clerk knew you would decide to run now. The line would have said Ossen."

  "Then what is the point?" Torin demanded. "Are we puppets?"

  "No," Isoline said. "But the string was cut long ago. The only way to beat the Ledger is to decide in a way the clerk could not follow. To introduce a chaos they could not simulate."

  "Like this," Torin said. He pulled a silver coin from his pouch, flashing it in the dusk light. "Heads, she walks. Tails, she stays. The clerk can't count the spin of a coin before it happens."

  Elara looked at the coin. It was a bright, hard circle of chance.

  "Can't they?" Isoline asked. "Did you decide to bring the coin today? Did you decide to suggest the flip? The clerk walked that path too. They saw you reach for the pouch. They saw the thumb flick. If you flip, it was always going to be part of the entry."

  Torin gripped the coin tight. "Then nothing matters."

  "Only what matters," Isoline said.

  Elara turned away from them. She needed to think. The sun was dipping below the western wall, turning the sky the color of a bruised plum. The gate to the salt flats would close in an hour. She closed her eyes and let the logic unfold, step by step, feeling the weight of each proposition.

  *If I stay,* she thought, *I am safe from the Night. I agree with the Ledger. But if the Ledger is a trap, I am walking into a cage.*

  *If I go, I risk the Night. But if I survive, I prove the Ledger wrong. But can I survive? If the Ledger says Vardan, it means my decision-making process leads to Vardan. If I choose to go, I am changing my process. But the Ledger already accounted for my attempt to change.*

  *So, if I try to change, the Ledger knew I would try. Therefore, trying to change leads to Vardan.*

  *Unless the change is not mine. Unless it is the coin.*

  *But Isoline says the coin is mine too. I chose to listen to Torin. I chose to hope for chance.*

  *So every path I think of is already a path the clerk walked.*

  *Then why do I feel my legs twitching? Why do I feel the road calling?*

  *Because I am alive. The ink is dead.*

  *But if I walk and die on the flats, the Ledger was right. If I stay and die in Vardan, the Ledger was right.*

  *The only way the Ledger is wrong is if I walk and live. But if I walk and live, the Ledger should have said Ossen.*

  *So the Ledger cannot be wrong about me unless I am not the person the Ledger described.*

  *Am I that person?*

  She opened her eyes. Torin was holding the coin out to her. The metal was warm from his hand.

  "Flip it," Torin said. "Let the silver decide. Break the thread."

  "It's a trick," Isoline said. "You are handing your will to a metal disc. That is still a will."

  "It's noise," Torin insisted. "It's static. The clerk can't hear static."

  Elara looked at the coin, then at the gate. The guards were lighting the torches along the ramparts. The shadows were merging into a single dark pool across the square. She thought of the clerks in their high tower, quills scratching, eyes closed, walking through her mind in the dark. Did they feel her hesitation? Did they feel the heat of the coin?

  "If I flip it," Elara said, her voice steady, "and it says go, I go. If it says stay, I stay."

  "And if it lands on the edge?" Isoline asked.

  "Then I know," Elara said.

  She took the coin. It was heavy, stamped with the profile of the First Warden. She placed it on her thumb. The square was silent now; even the wind seemed to hold its breath waiting for the Ninth Bell. Torin leaned forward. Isoline sat back, her hands folded in her lap.

  Elara thought: *This is the only moment that is mine. Not the result, but the throw.*

  She flicked her thumb.

  The coin spun, catching the torchlight, a blur of silver against the darkening stone. It rose higher than she intended, a small moon escaping the earth. For a second, it hung at the apex of its arc, suspended between the wall of Vardan and the road to Ossen. In that suspension, there was no Ledger, no clerks, no chalk. There was only the physics of the spin and the beating of her own heart.

  It began to fall.

  Elara did not watch it land. She turned her head toward the gate. The portcullis was halfway down, the iron teeth gleaming. The guards were shouting, signaling the final minutes.

  She heard the clatter of silver on cobblestone. She heard Torin's intake of breath. She heard Isoline's soft exhale.

  Elara did not look down. She tightened the straps of her pack. She felt the weight of her boots on the ground, solid and real. The logic was done. The coin was cast. The clerk's simulation ended where the metal struck the stone. What happened next was not a calculation. It was a step.

  She moved.

  The direction did not matter to the story, only the motion. She walked into the twilight, leaving the sound of the coin behind her, walking toward the gate or away from it, into the night or into the city, carrying the uncertainty like a lantern in the dark.
