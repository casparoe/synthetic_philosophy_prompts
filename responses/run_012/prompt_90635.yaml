answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION ON OMISSION CAUSATION

  **Signatories:**
  **The Process-Relatum Group** (hereinafter "PRG")
  **The Difference-Making Group** (hereinafter "DMG")

  **Date:** October 26, 2023
  **Subject:** Framework for Resolving the Dispute Regarding Causal Omissions

  ## 1. AGREED CLAIMS

  Both parties affirm the following propositions. Acceptance of these claims is a condition of this collaboration and represents substantive commitment, not mere diplomatic hedging.

  1.  **Ordinary Usage:** In ordinary language, speakers freely and confidently assert that omissions (failures, absences, non-occurrences) are causes of outcomes (e.g., "The lack of rain caused the drought," "His failure to signal caused the crash"). Any adequate theory of causation must account for the robustness of this linguistic practice.
  2.  **Counterfactual Symmetry in Standard Pairs:** In the standard paired cases—specifically (i) the neighbour who forgot to water the plant versus the stranger who was never going to, and (ii) the inspector who overslept versus the firm whose policy is never to inspect—the omission in the first member of the pair and the omission in the second member stand in identical counterfactual relations to the outcome. If the neighbour had watered, the plant would have lived; if the stranger had watered, the plant would have lived.
  3.  **Normative Asymmetry in Standard Pairs:** In the standard paired cases described above, the two omissions differ sharply in their normative status. The neighbour breaches a duty; the stranger does not. The inspector breaches a duty; the firm does not.
  4.  **Explanatory Burden:** Both sides owe an account of why ordinary causal talk tracks the normative difference described in Claim 3 despite the counterfactual symmetry described in Claim 2.
      *   **PRG** must explain why we treat normatively charged omissions as causes if causation is strictly a relation between positive existents.
      *   **DMG** must explain why we treat normatively neutral omissions as non-causes (or lesser causes) if causation is strictly a matter of counterfactual dependence.
  5.  **Verbal Component:** Both sides agree that a portion of the dispute is verbal, turning on the definition of the word "cause" and the ontological commitments required to use it. However, both sides agree that a substantive metaphysical disagreement remains after terminological clarification.
  6.  **Theory Answerability:** A theory of causation is answerable not only to metaphysical intuition but also to the utility of causal claims in explanation, prediction, and intervention. A theory that renders standard causal claims in science, law, and daily life systematically false bears a high burden of proof.

  ## 2. DISAGREEMENTS TABLE

  The following table enumerates the residual disagreements. The wording in each cell is formulated such that the respective party can endorse it as an accurate statement of their position.

  | Issue | Process-Relatum Group (PRG) Position | Difference-Making Group (DMG) Position |
  | :--- | :--- | :--- |
  | **Ontological Status of Omissions** | "Omission" does not name a kind of causal relatum. Causal relations hold only between events, states, or processes that obtain. Talk of omission-causation is a *façon de parler* that picks out positive facts (e.g., the agent's state, the normative context) via negative description. | "Omission" names a genuine kind of causal relatum. Absences and non-occurrences are ontologically sufficient to stand in causal relations. To deny this is to misdescribe the dependency structure of the world. |
  | **Role of Norms** | Norms (duties, expectations, functions) enter the **truth conditions** of causal claims involving omissions. Without a normative backdrop, a claim like "X caused Y by failing to Z" is strictly false. | Norms enter only the **pragmatics** of causal claims (salience, explanation, blame). The truth of "X caused Y" is invariant to norms; norms merely select which true causes are worth mentioning. |
  | **Metaphysics of Absences** | The dispute over omissions is a special case of the general metaphysical problem of non-being. To admit omissions as causes is to admit "nothing" as a constituent of reality, which is untenable. | The dispute over omissions is specific to causal modeling and dependency. It does not require a general metaphysics of "negative objects," only an acknowledgment that dependency relations can be anchored in non-occurrence. |
  | **Causal Structure vs. Description** | The impression that omissions are causes is an artefact of how we select and describe causes, not a feature of the causal structure of the world. | If an outcome counterfactually depends on a non-occurrence, that non-occurrence is a feature of the causal structure of the world, regardless of how it is described. |

  ## 3. CRUXES AND PREDICTIONS

  We identify the following sub-questions as cruxes. Settling these empirically or argumentatively would compel at least one side to revise their position. For each crux, we specify a case and record each side's prediction regarding ordinary judgment and its evidentiary value.

  ### Crux A: The Norm-Free Omission (The Firebreak Case)
  **Case:** Two adjacent hillside plots.
  *   **Plot 1:** The owner has mowed a firebreak every August for years, with everyone's knowledge. This year he is in hospital and does not. A spark from a passing train burns the plot.
  *   **Plot 2:** No one has ever mowed a firebreak, no duty attaches to it, and no one expects it. The same spark burns it in the same year.
  *   **Fact:** Both omissions have the same counterfactual relation to the burning (if mowed, the fire stops).

  **Question:** Is the first a cause and the second not? On exactly what does the difference rest? Do ordinary speakers judge these differently *before* any explicit norm is introduced?

  | Party | Prediction on Ordinary Judgment | Evidentiary Value |
  | :--- | :--- | :--- |
  | **PRG** | Speakers will judge the Plot 1 omission as a cause and the Plot 2 omission as **not a cause**. This divergence will occur even if the norm is implicit (based on past practice). | This confirms that normative expectations are constitutive of omission-causation. If speakers distinguish them, the causal relation is not purely counterfactual. |
  | **DMG** | Speakers will judge both as causes, or if they distinguish them, they will attribute the distinction to **blame/relevance**, not causality. If speakers deny Plot 2 is a cause, they are committing a performance error or conflating causation with responsibility. | If speakers distinguish them, it demonstrates a pragmatic bias, not a metaphysical truth. The counterfactual structure remains identical; therefore, the causal status must be identical. |

  ### Crux B: The Designed Omission (The Dam Gate Case)
  **Case:** A dam's spillway gate is controlled by a sensor specified to open the gate above a certain river level. It does not open; the valley floods.
  *   **Variation 1 (Lightning):** The sensor failed because it was struck by lightning.
  *   **Variation 2 (Calibration):** The sensor failed because it was mis-calibrated in the factory.
  *   **Variation 3 (Programming):** The sensor failed because a programmer set the threshold too high (the gate is *meant* to stay shut at this level).

  **Question:** Is the gate's not opening a cause of the flood, over and above the rainfall? Does it matter that the omission was the realisation of a specification rather than a departure from one? Which variations change the causal verdict?

  | Party | Prediction on Causal Verdict | Rationale |
  | :--- | :--- | :--- |
  | **PRG** | The verdict **changes** across variations. Variation 1 & 2 are causes (departure from function). Variation 3 is **not a cause** (realisation of design). | Causation requires a deviation from a normal or expected course. In Variation 3, the system behaved exactly as designed; the "omission" is merely the system functioning, not a causal intervention. |
  | **DMG** | The verdict **remains stable** across variations. In all three, the flood counterfactually depends on the gate not opening. | The physical mechanism of the failure (lightning vs. code) is irrelevant to the dependency relation. The gate's silence is a difference-maker in all three scenarios. |

  ## 4. VERBAL DISAGREEMENTS AND TRANSLATION MANUAL

  Both sides agree that the following disagreements are verbal. They arise from differing conventions for using the term "cause." Below is the translation manual.

  | PRG Vocabulary | DMG Vocabulary | Shared Content |
  | :--- | :--- | :--- |
  | "The omission was not a cause; it was merely a relevant condition selected by normative context." | "The omission was a cause; it was merely a non-salient one in the second paired case." | There is a counterfactual dependence between the non-occurrence and the outcome. There is a normative difference that affects our willingness to assert the causal claim. |
  | "Causation is a relation between existents." | "Causation is a relation between difference-makers." | We are tracking the same dependency structures in the world; we disagree on whether the label "causation" applies to negative nodes in that structure. |

  **Residual Disagreement Surviving Translation:**
  Even after translating "cause" to "salient difference-maker" (DMG) or "positive relatum" (PRG), a metaphysical disagreement remains regarding **ontological parsimony**.
  *   **PRG** maintains that admitting omissions as relata inflates ontology without explanatory gain, as all work can be done by positive facts + norms.
  *   **DMG** maintains that excluding omissions from relata distorts the topology of dependency, forcing complex paraphrases of simple negative dependencies.

  This residual disagreement is not verbal. It concerns whether the fundamental structure of reality is best modeled as a network of positive events or a network of dependencies that include absences.

  ***

  **Signed,**

  _________________________
  *Lead Representative, Process-Relatum Group*

  _________________________
  *Lead Representative, Difference-Making Group*
