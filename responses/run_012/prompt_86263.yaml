      *   *Body:* Defenders of the common good are not seditious (analogy: self-defense isn't quarreling).
      *   *Reply to Obj 1:* Fighting for common good is lawful. Sedition counters common good. Therefore sedition is always mortal sin.
      *   *Reply to Obj 3 (partial):* Tyrannical government is not just (private good vs. common good).

  3.  **Address Question 1: Definitional vs. Substantive?**
      *   *The User's Worry:* Is it circular? "Sedition is bad. We are good. Therefore we aren't seditious."
      *   *Aquinas's Logic:* Aquinas operates within a natural law framework. The "common good" isn't just a label people slap on things; it has an objective ontological status derived from the purpose of political community.
      *   *The Move:* It's *both*, but not in a viciously circular way.
          *   *Definitional:* Sedition is *defined* by its opposition to the unity/common good of the multitude.
          *   *Substantive:* Tyranny is *objectively* opposed to the common good (citing Aristotle).
      *   *The Crucial Distinction:* Aquinas distinguishes between the *act* of disturbance and the *moral species* of the act. Disturbing the peace *can* be good if the peace is unjust (tyrannical). But "sedition" isn't just "disturbance"; it's "disturbance *against* the true common good."
      *   *Is it Circular?* No, because the criterion isn't "who wins." The criterion is conformity to justice/common good. If the tyrant is ruling for private gain, he is already attacking the unity of the state. The "sedition" charge usually falls on the *tyrant* in a sense (though Aquinas doesn't call the tyrant seditious, he calls the regime unjust). Actually, Aquinas says the *tyrant* fosters sedition by prioritizing private good.
      *   *Refinement:* The "dodge" isn't a dodge. It's a classification based on the *end* of the action. If the end is the common good, it falls under the genus of "just defense/war." If the end is private factionalism, it falls under "sedition."
      *   *Key Textual Support:* The analogy in the *Body*: "neither is a man to be called quarrelsome because he defends himself." Quarreling implies unjust aggression. Self-defense implies just protection. Same physical act, different moral species based on justice.

  4.  **Address Question 2: The Definition of Sedition (Parts vs. Ruler)**
      *   *Definition:* "between mutually dissentient parts of one people."
      *   *Objection 3:* Assumes the split happens *because* of the attempt to remove the tyrant (Part A: Keep Tyrant, Part B: Dethrone).
      *   *Aquinas's View:* The tyrant places himself *outside* the true unity of the people because he seeks private good. However, technically, sedition is people vs. people.
      *   *Nuance:* If the whole people rises, is it sedition? Aquinas implies that if the ruler is a tyrant, he is not a true part of the political unity in the moral sense. But strictly, sedition is factionalism.
      *   *Resolution:* The Objection raises the scenario where the *people are divided*. Aquinas's reply sidesteps the division issue and focuses on the *justice of the cause*. Even if there is division, the side seeking the common good is not seditious. The division itself is a symptom of the tyranny, not necessarily a sin on the part of the liberators.
      *   *Wait, check the text:* Aquinas says sedition is "one part... against another part." If the uprising is against the *ruler*, is that sedition? Usually, yes, unless the ruler is a tyrant. But if the people split (Obj 3), that fits the definition. Aquinas's point is: The split doesn't make the anti-tyrant side seditious. The pro-tyrant side might be, or the tyrant is the source of the division.
      *   *Correction:* Aquinas actually argues that the *tyrant* is the one guilty of sedition (in a sense), or at least that the disturbance caused by removing him is not *sedition* properly speaking because it restores unity.
      *   *Actually, looking at standard commentary:* Aquinas distinguishes between *sedition* (sinful factionalism) and *just resistance*. The definition "part against part" is the *phenomenological* description. The *moral* description is "against common good." So, a uprising against a tyrant might look like sedition (part vs. part), but isn't sedition morally (common good vs. private good).

  5.  **Synthesize the "Machinery":**
      *   **The Genus/Species distinction:** Sedition is a species of sin. To identify a sin, you need the object, end, and circumstance. The "end" of sedition is private factional interest against the common good. The "end" of tyrannicide (in this specific justified case) is the common good. Therefore, they are different moral species, even if the physical action (violence, disturbance) looks similar.
