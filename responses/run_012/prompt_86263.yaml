      *   **Specific Confusion:**
          1.  Is Aquinas making a *definitional* move (sedition = bad, so good resistance isn't sedition) or a *substantive* move (resisting tyranny is objectively good)?
          2.  Is the argument circular (whoever claims "common good" wins)?
          3.  Does the definition of sedition (dissension between *parts* of the people) require a split in the populace, or is uprising against a ruler enough?
