answer: |-
  This is a classic sticking point in Aquinas scholarship, and you are right to sense that the machinery here is doing heavy lifting. The confusion stems from mixing up the **physical description** of an act (disturbing the peace, raising a faction) with the **moral species** of an act (sedition vs. just defense).

  Here is a breakdown of the machinery, how to explain it to your group, and a strong objection to raise.

  ### 1. What is the Reply actually claiming? (Definitional vs. Substantive)

  It is **not** a mere definitional dodge, nor is it purely substantive. It is a claim about the **moral specification of human acts**.

  In Scholastic moral theology, an act is defined by its *object*, *end*, and *circumstances*. Two acts that look physically identical (e.g., stabbing someone, or raising an armed mob) can be different moral species entirely based on the *end* (purpose) and the *justice* of the cause.

  *   **The Objection's Logic:** Physical disturbance + Factional split = Sedition. (Therefore, if tyrannicide causes disturbance, it is sedition).
  *   **Aquinas's Logic:** Sedition = Disturbance **against the common good**. Therefore, Disturbance **for the common good** $\neq$ Sedition.

  Aquinas is arguing that "sedition" is not a neutral term for "civil unrest." It is a morally loaded term that *already includes* the judgment that the unrest is unjust.

  **The Textual Proof:**
  Look at the **Body of the Article**, not just the Reply. Aquinas writes:
  > *"neither is a man to be called quarrelsome because he defends himself"*

  This is the key to the whole question.
  *   **Physical Act:** Two men fighting.
  *   **Moral Species A:** Quarreling (aggressor).
  *   **Moral Species B:** Self-defense (defender).

  Aquinas is applying this same logic to politics.
  *   **Physical Act:** A group rises up against the current order.
  *   **Moral Species A:** Sedition (faction seeking private good against the common good).
  *   **Moral Species B:** Just Resistance (multitude seeking common good against a private usurper).

  So, to answer your specific worry: It is not circular. He is not saying "We won, therefore we were the common good." He is saying "If you are objectively defending the common good, you are not, by definition, committing the sin of sedition, just as a man defending his life is not committing the sin of assault."

  ### 2. Is it Circular? (The "Winner Writes History" Problem)

  Your worry is: *Who decides what the common good is? If the rebels win, do they just claim they were defending the common good?*

  Aquinas would say **no**, because he is working within an **Objective Natural Law** framework, not a positivist one.
  *   For Aquinas, the "common good" is not whatever the majority votes for or whatever the victor claims. It is an ontological reality based on justice and the purpose of the political community (derived from Aristotle, as cited in the Reply to Obj 3).
  *   A tyrant, by definition (*Polit.* iii, 5), rules for his *private good*. This is an objective fact about the regime, not a subjective claim by the rebels.
  *   Therefore, the "test" for sedition is not "did you win?" but "was the regime you opposed actually tyrannical (private good) vs. just (common good)?"

  **However,** this opens Aquinas to a different vulnerability (see the Objection below).

  ### 3. The Definition Problem (Parts of the People vs. The Ruler)

  You asked: *Does a unilateral uprising against a ruler fit the definition of sedition (part vs. part)?*

  *   **The Objection (Obj 3)** tries to trap Aquinas here. It argues: "To kill a tyrant, you need a faction. If you have a faction (those who want him gone) vs. another faction (those who keep him), that fits your definition of sedition ('one part... against another part')."
  *   **Aquinas's Counter:** He concedes the physical division but denies the moral guilt attaches to the anti-tyrant party.
      *   Crucially, Aquinas implies that the **tyrant** is the one who has already broken the unity of the people. By ruling for private good, the tyrant has placed himself outside the true "common good" of the multitude.
      *   Therefore, the "dissension" is not an unjust fracturing of a healthy body (sedition), but the excision of a disease from a body.
      *   The Reply to Obj 3 (the part you have) establishes that the tyrannical government *lacks justice*. If the government lacks justice, it does not truly represent the "unity of the people" in the moral sense. Therefore, rising against it is not rising against the *people* (which would be sedition), but against a *private aggressor*.

  ### 4. A Good Objection for Your Group

  If you want to press the text, do not attack the circularity (Aquinas has an answer for that via Natural Law). Attack the **Epistemic Problem**.

  **The Objection:**
  "Aquinas relies on the objective distinction between a 'just ruler' and a 'tyrant' to determine if resistance is sedition. But in the moment of crisis, there is no supreme judge to adjudicate this.
  *   If the criterion for 'not sedition' is 'defending the common good,' every rebel group will claim they are defending the common good.
  *   Aquinas's distinction works in metaphysics, but fails in praxis. By removing the label of 'sedition' from tyrannicide, he provides a rhetorical weapon for *any* faction to claim they are the 'defenders of the common good' while accusing the state of tyranny.
  *   Therefore, even if Aquinas is theoretically correct that *just* resistance isn't sedition, practically, defining it this way encourages sedition by making the moral classification dependent on a contested judgment that only becomes clear after the violence is done."

  **Why this works:**
  It accepts Aquinas's moral logic (that just resistance isn't sinful) but challenges the **political utility** of his definition. It forces the group to discuss whether political theory should prioritize **moral precision** (Aquinas's goal) or **civil stability** (the potential consequence of his view).

  ### Summary for your leading notes:
  1.  **The Move:** It's a distinction of **moral species**, not just semantics. (Analogy: Self-defense vs. Assault).
  2.  **The Text:** The "quarrelsome" analogy in the *Body* proves he knows the physical act is the same, but the moral act differs.
  3.  **The Circularity:** Avoided via Objective Natural Law (Tyranny is objectively private good), but vulnerable to the **Epistemic Problem** (Who judges the tyranny in real-time?).
  4.  **The Definition:** The tyrant breaks the moral unity first; the resistance restores it. The physical "split" (Obj 3) is a symptom of the tyranny, not the sin of the liberators.

  This should give your group enough friction to have a lively discussion without getting bogged down in general Aquinas 101.
