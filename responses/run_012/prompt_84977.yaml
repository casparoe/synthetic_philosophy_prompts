  ### Taxonomy of Weakness of Will

  **Root:** An agent performs an action they previously stated they would not perform, under no external compulsion.

  **Node 1:** Immediately after acting, does the agent wish they had done otherwise?
  *   **No** → Go to Node 2.
  *   **Yes** → Go to Node 4.

  **Node 2:** Is this choice part of a consistent, predictable pattern (e.g., always preferring smaller-sooner rewards)?
  *   **No** → **Leaf 1: Framing Artefact** (The observed pattern of preference reversal is an artefact of the way the delays were described and carved into intervals).
  *   **Yes** → Go to Node 3.

  **Node 3:** Does the agent feel they are the same 'person' now as the one who made the original plan?
  *   **No** → **Leaf 2: Multiple Selves** (The view that treats the agent as a coalition of successive selves bargaining over one body).
  *   **Yes** → **Leaf 3: Economic Deflation** (The deflationary economic view on which the phenomenon is redescribed as impatience and ceases to count as a failure of rationality).

  **Node 4:** At the moment of action, was the agent's mind clear about the better option?
  *   **No (Clouded)** → Go to Node 5.
  *   **Yes (Clear)** → Go to Node 6.

  **Node 5:** Did the better thought vanish due to strong emotion or due to simple ignorance?
  *   **Emotion** → **Leaf 4: Judgment Failure** (The view that it is possible but always amounts to a failure of practical judgement rather than of will).
  *   **Ignorance** → **Leaf 5: Socratic Impossibility** (The view that clear-eyed weakness of will is impossible).

  **Node 6:** Is the failure located in a single moment of choice, a lapse over time, or a failure to bind oneself?
  *   **Single Moment** → **Leaf 6: Motive Conflict** (The view that it is a genuine conflict of motives with judgement left intact).
  *   **Lapse Over Time** → **Leaf 7: Diachronic Failure** (The view that the real failure is diachronic — a lapse in executing a plan one still endorses).
  *   **Failure to Bind** → **Leaf 8: Resolute Choice** (The view that rationality requires binding oneself to a plan; failure is a lack of resolution).

  ***

  ### Meta-Commentary

  **Inseparable Leaves:**
  *   **Leaf 4 (Judgment Failure) and Leaf 5 (Socratic Impossibility):** These cannot be empirically separated by an external observer. Both posit that the agent's evaluation changed (the "good" vanished from view); the Socratic claims this change is *necessary* (you can't choose what you deem worse), while the Aristotelian claims it is a *fault* (passion clouded the intellect). Without access to the agent's internal necessity, the positions look identical from the outside.

  **Unoccupied Combinations:**
  *   **No Regret + Consistent Pattern + Same Self + Mind Clouded:** This combination is **incoherent**. If the agent feels they are the same self and the pattern is consistent (Economic view), they should not experience the action as "clouded" or regrettable; they should view it as a valid preference satisfaction.
  *   **Regret + Mind Clear + Single Moment + Failure to Bind:** This is **undefended**. "Binding" is inherently a diachronic strategy (pre-commitment over time); it makes no sense to locate a failure of binding in a single synchronic moment of choice.

  **Hardest to Swallow:**
  *   **Leaf 1 (Framing Artefact):** "The conflict you feel is not about time or will, but merely about how the question was asked."
  *   **Leaf 2 (Multiple Selves):** "You are not one person changing your mind, but different people fighting for control of a body."
  *   **Leaf 3 (Economic Deflation):** "Choosing the smaller-sooner reward is not a mistake; it is simply what you value more right now."
  *   **Leaf 4 (Judgment Failure):** "You didn't lack willpower; you literally forgot, for a moment, why the diet was important."
  *   **Leaf 5 (Socratic Impossibility):** "If you really knew smoking was bad, you wouldn't have smoked; therefore, you didn't really know."
  *   **Leaf 6 (Motive Conflict):** "You knew exactly what was best and could have done it, but you just didn't want to enough."
  *   **Leaf 7 (Diachronic Failure):** "The mistake wasn't eating the cake, it was failing to maintain the policy of not eating cake over the week."
  *   **Leaf 8 (Resolute Choice):** "You are irrational not because you chose the cake, but because you didn't lock the fridge yesterday."

  **Least Confident Branch:**
  *   **Node 6 (Moment vs. Time vs. Binding):** I have the least confidence in the distinction between a "Single Moment" failure (Motive Conflict) and a "Lapse Over Time" (Diachronic Failure).
  *   **Reason for Redraw:** Neuroscientific evidence showing that "moments" of choice are actually extended processes of deliberation (e.g., readiness potentials building over seconds) would collapse the distinction between Leaf 6 and Leaf 7. If the "moment" is temporally extended, then all synchronic conflicts are arguably diachronic failures of maintenance, forcing me to merge Leaf 6 into Leaf 7 and split Leaf 8 (Resolute Choice) into **Internal Binding** (willpower) vs. **External Binding** (pre-commitment).
