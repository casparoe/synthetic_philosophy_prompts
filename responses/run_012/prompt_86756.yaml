answer: |-
  1. You argue that we can permute reference across the board—swapping rabbits for rabbit stages—without changing truth values, provided we reshuffle the predicates accordingly. But surely not *any* permutation is admissible. If I map 'rabbit' to 'number 7', the sentence structure breaks. What constraints govern which proxy functions are allowed, and if you admit constraints, haven't you reintroduced a fact of the matter about which mapping fits best?

  **Follow-up:** *He will likely say constraints are internal to the theory or pragmatic.* If he says that, press: "If the constraints are merely pragmatic or internal, doesn't that make indeterminacy a feature of our *description* rather than an ontological lack of fact? You'd be saying 'we can't decide' rather than 'there is nothing to decide.'"

  2. Quine traditionally separated the indeterminacy of translation from the inscrutability of reference. You seem to argue that inscrutability drives the whole show, even between two English speakers. Does indeterminacy of translation follow automatically from inscrutability of reference, or do you need extra premises to get from 'reference is loose' to 'translation is indeterminate'?

  **Follow-up:** *He will likely say they collapse into one another.* If he says that, press: "If they collapse, then whenever I successfully refer to a cup, I'm only seemingly referring. How do you account for the phenomenological certainty of reference without dismissing it as mass illusion?"

  3. Critics often say this is just underdetermination of theory by evidence, which applies to physics too. But physicists assume there's a fact of the matter even if we can't find it. You're saying there *is* no fact of the matter. What stops this from being a special plea against semantics specifically?

  **Follow-up:** *He will likely say semantics is different because it's about use.* If he says that, press: "But you just granted the linguist a magic scanner reading every internal state and disposition. If use and internal state don't fix reference there, what kind of 'fact' are you saying is missing that physics supposedly has?"

  4. I want to press on the self-application. If there is no fact of the matter about reference, then there is no fact of the matter about what your own book refers to. Are you committed to saying your own arguments lack determinate content, and if so, how can we assess their truth without assuming the determinacy you deny?

  **Follow-up:** *He will likely bite the bullet and say yes, it's indeterminate but useful.* If he says that, press: "If your book's content is indeterminate, then the claim 'reference is indeterminate' is itself indeterminate. Doesn't that dissolve the argument into a pragmatic recommendation rather than a truth-apt thesis?"

  5. Some critics suggest this argument doesn't show meaning is indeterminate, but that 'meaning' is the wrong category entirely—a deflationary result. Are you making a metaphysical discovery about meaning, or are you recommending we stop talking about it as if it were a robust property?

  **Follow-up:** *He will likely say he's clarifying the concept.* If he says that, press: "If you're clarifying it, you must assume there's a correct way to use the term. But if usage doesn't fix reference, what grounds your clarification? Aren't you using the tool you're dismantling to dismantle it?"

  6. You mentioned the behaviorism is a red herring, but is the thesis itself empirical? What would the world have to look like for translation to be fully determinate? If you can't describe a world where determinacy holds, isn't the claim analytic or conceptual rather than factual?

  **Follow-up:** *He will likely say it's a philosophical thesis grounded in empirical linguistics.* If he says that, press: "If it's grounded in empirical linguistics, then better linguistics could overturn it. Are you open to empirical evidence proving determinacy, or is the thesis insulated from falsification?"

  7. Field linguists and translators seem to succeed without paralysis. They write dictionaries; people buy them. If indeterminacy is real, what are these practitioners actually achieving? Are they merely constructing useful fictions, or are they tracking something real that your argument misses?

  **Follow-up:** *He will likely say they are constructing useful fictions.* If he says that, press: "If translation is fiction, then cross-cultural understanding is fiction. Are you comfortable saying that when we agree on a treaty or a trade deal, we're only agreeing on a shared fiction rather than shared content?"

  8. This looks remarkably like Kripke's Wittgenstein on rule-following—that any past usage is compatible with multiple future rules. Is your indeterminacy thesis just a semantic version of rule-following skepticism, and if so, does it inherit the same vulnerabilities to skeptical solutions?

  **Follow-up:** *He will likely say yes, it's compatible.* If he says that, press: "Kripke's skeptic needs a community to fix meaning. You argue even home-language reference is indeterminate. Without the community crutch, what stops your skepticism from consuming the logic you use to formulate it?"

  9. Your argument relies on logical quantification to show truth values are preserved across permutations. But if the quantifiers themselves are subject to indeterminacy, doesn't the argument undermine the logic used to formulate it? How do you secure the logic needed to prove indeterminacy without assuming determinate logical constants?

  **Follow-up:** *He will likely say logic is exempt or purely syntactic.* If he says that, press: "If logic is exempt, you've admitted a domain of determinate meaning. Why stop there? If logical constants can be determinate, why can't 'rabbit' be?"

  10. Quine said 'to be is to be the value of a variable.' If reference is indeterminate, are ontological commitments also indeterminate? Does it matter whether we say there are rabbits or rabbit stages, if both are equally valid?

  **Follow-up:** *He will likely say it doesn't matter ontologically.* If he says that, press: "If ontology doesn't matter, why do philosophy? You're arguing for a position on what exists. If existence is indeterminate, isn't your own project vacuous?"
