answer: |-
  You are carrying too much alone. Strawson's insight is correct: resentment is a demand for goodwill. If you stop demanding, you stop seeing them as a peer. Here is a four-step filter to decide which stance to take before you walk into the room.

  **The Procedure (Run this alone)**

  1.  **Awareness:** Did they know this behavior hurt the group?
      *   *Yes:* Proceed.
      *   *No:* Inform them. Stop here. No vote needed yet.
  2.  **Capacity:** Could they have chosen differently in that moment? (Were they physically/mentally able?)
      *   *Yes:* Proceed.
      *   *No:* **Stop.** Do not treat this as a moral failure. This is the "weather" zone. Move to accommodation or role change. No blame.
  3.  **Willingness:** Are they willing to repair the harm or change the behavior?
      *   *Yes:* Proceed to Step 4.
      *   *No:* **Handoff.** This is no longer about facts; it's about values. The group must vote on whether this lack of goodwill is compatible with membership.
  4.  **Tolerance:** Can the shop survive while they try to change?
      *   *Yes:* Support plan.
      *   *No:* **Handoff.** Vote on removal for viability, not punishment.

  **Case 1: The Depressed Shift-No-Show**
  1.  *Awareness:* Yes, he knows shifts matter.
  2.  *Capacity:* **No.** Depression often removes the ability to execute intent, even if the intent is good.
  3.  *Result:* Stop the blame. You hoped to "leave him alone," and you are right about the anger, but wrong about the outcome. If he cannot do the job, he cannot stay in the role, but he shouldn't be shamed.
  4.  *Action:* Propose a reduced role or medical leave. If the shop needs nine full shifts to pay rent, the group votes on exit based on *capacity*, not character. You manage the weather, but you still build shelter.

  **Case 2: The Snide Meeting Member**
  1.  *Awareness:* Yes. Silence from others is a loud signal.
  2.  *Capacity:* Yes. Being kind is within his control.
  3.  *Willingness:* **No.** He keeps doing it.
  4.  *Result:* This is a moral breach. He is treating the group as an audience, not peers.
  5.  *Action:* This hands off to the group values. You must say: "He knows it hurts, he can stop, and he won't. Is this who we want to be?" Do not dodge this. If you manage him like weather, you teach the group that silence is acceptable.

  **Where This Procedure Misfires**

  Be straight with yourself about the limits.

  1.  **Diagnosis:** You are not a doctor. You cannot verify depression. If someone claims incapacity, you must decide whether to trust them. If you trust wrongly, the shop suffers. If you distrust wrongly, you crush a peer. The procedure flags the *claim*, it doesn't verify the *truth*.
  2.  **Values:** Step 3 and 4 hand off to the group. This procedure cannot tell you if a snide person is "worth it" because of their mechanical skills, or if a depressed person is "worth" the financial risk. That is a political decision, not a factual one.
  3.  **Safety:** If behavior is abusive or dangerous, skip the procedure. Remove first, ask later.
  4.  **Your Burnout:** This filter requires you to care enough to run it. If you are too tired, you will default to "weather" for everyone. That kills co-ops slowly. If you are exhausted, the procedure says you need support, not that you need to decide alone.

  **The Script for the Meeting**
  Don't use the steps above. Say this:
  *"For [Name]: We know this impacts the shop. We need to know if this is something they can change, or if we need to find a different way for them to be involved. If it's the latter, we need to decide if we can afford that change."*

  For the snide one:
  *"This behavior stops people from speaking. They know it. They haven't stopped. We have to decide if we accept that."*

  You are not the judge. You are the mechanic checking the engine. Tell the group what you found, then let them drive.
