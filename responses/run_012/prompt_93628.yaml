      Let's write.

      *Wait, one check on Strawson:* Strawson says if we take the objective attitude, we don't *resent* them. We treat them as objects. In a co-op, this means accommodation or removal, not moral condemnation. If we take the participant attitude, we demand goodwill.
      So, if depression removes control -> Objective -> Accommodate or Release (no blame).
      If snide is control -> Participant -> Demand Repair or Remove (blame/consequence).

