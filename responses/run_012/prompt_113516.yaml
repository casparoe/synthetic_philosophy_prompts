      *   *The Meteorologist:* Storm predicted. Storm veers off. Did the model fail? Or was the initial condition uncertain?
      *   *The Best Fit:* **The Canaries in the Coal Mine.** They pass out/die. If they don't, maybe the air is fine, or maybe the ventilation improved. But if you keep killing canaries and no gas is found, you stop buying canaries.
      *   *Actually, the best fit for "repeatedly delayed":* **The Y2K Bug.** Massive effort prevented the crash. Was it a scam? Or a successful mitigation? Malthusians argue their warnings *caused* the innovations (Green Revolution) that proved them "wrong."

  6.  **Synthesizing and Refining the Argument:**

