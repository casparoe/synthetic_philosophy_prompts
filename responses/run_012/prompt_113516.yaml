          3.  "Early not Wrong" (Lakatos, Auxiliary Hypotheses).
          4.  Better Analogies (Y2K, Bridge, Doctor).
      *   *Key Insight to Highlight:* The friend's use of the fable assumes the wolf *will* come (validating Malthus) or that Malthus is *lying* (invalidating the fable's premise). The fable is about *credibility*, Malthus is about *physics/economics*.
      *   *Refining the "Boy Cried Wolf" critique:* The fable punishes the boy for lying. Malthus isn't lying. The fable punishes the villagers for ignoring a *true* threat. The friend uses it to ignore the threat. If the threat is real, the friend is the villager. If the threat is fake, Malthus is the boy. The fable doesn't help decide *which* is true.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Mapping:* Keep it tight.
      *   *The Break:* Focus on the *existence* of the wolf. In the fable, the wolf is objective fact. In Malthus, the wolf is a theoretical construct.
      *   *Early not Wrong:* Distinguish between "timing error" and "mechanism error." Malthus got the mechanism (population pressure) right but underestimated human ingenuity (tech). That's a parameter error, not necessarily a structural one. But if the mechanism itself (geometric growth) is broken by demographic transition, then he is wrong.
      *   *Better Analogy:* Y2K is strong because it addresses the "self-defeating prophecy" aspect. The warning caused the fix. Also, the "Bridge" analogy works for structural limits.

  8.  **Final Polish:** Check against the prompt's specific questions.
      *   *Correspondence first?* Yes.
      *   *Where mapping breaks?* Yes (Intent, Ontology).
      *   *Does fable support "stop listening"?* No, it supports "verify the wolf."
