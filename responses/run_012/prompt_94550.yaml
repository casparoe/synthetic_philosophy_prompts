answer: |-
  Here is the plain truth: **Your friend's argument is a mess.**

  It is a philosophically tidy mess, but a mess nonetheless. It sounds rigorous because it uses a *reductio ad absurdum* (if everything is political, nothing is), but it relies on a sleight of hand in **Step 2** and a fundamental misunderstanding of material reality in **Step 5**.

  If you want to keep the core intuition (that infrastructure encodes power) without cheating, you do not need to abandon the thesis. You need to reject your friend's definition of "political" as too flat.

  Here is where the joints come loose.

  ### 1. The Damage is in Step 2 (The Flattening)
  Your friend argues: *A door that swings inward* is the same category of object as *a bridge that blocks buses.*

  This is the equivocation. They are sliding between two meanings of "political":
  *   **Meaning A (Micro/Coordination):** A design choice that requires coordination or imposes a minor constraint (the door, the spoon, the chair).
  *   **Meaning B (Macro/Power):** A design choice that enforces hierarchy, exclusion, or resource distribution (the bridge, the union-busting machine).

  Yes, both involve "choices." But a door swinging inward doesn't systematically disenfranchise a class of people. A bridge blocking buses does. By treating these as identical because they both "settle a question," your friend drains the word "political" of its actual meaning (power dynamics) and replaces it with "has a design specification."

  **The Cost of Giving Up Step 2:**
  If you reject Step 2, you admit that **not everything is equally political.** A soup spoon is rarely political. A voting machine is always political. This doesn't break the thesis; it saves it. It allows your engineer to distinguish between *technical constraints* (physics, budget) and *political settlements* (who gets to ride the bus).

  ### 2. The Fatal Flaw is in Step 5 (The Backstory)
  Your friend claims the bridge example only works because we know the *backstory* (Robert Moses hated poor people), not because of the *object*.

  This is objectively wrong, and it is dangerous for a novelist to believe it.

  If Robert Moses had a change of heart but built the exact same bridge, the buses *still* couldn't pass. The politics are in the **consequence**, not the **intent**. The artifact *itself* enforces the exclusion regardless of the builder's soul. This is the whole point of "artifacts have politics." The technology *becomes* the law.

  Your friend is arguing that politics lives only in human heads (intent). The thesis you are exploring argues that politics lives in concrete and steel (consequence). If you accept Step 5, you cannot write the book you want to write, because you are forced to say the bridge is innocent until a historian proves Moses was racist. But the bus riders don't care about Moses; they care about the bridge.

  ### 3. Step 4 is a Red Herring (The "Triviality" Trap)
  Your friend argues: *If everything is political, the term is useless.*

  This is a logical trap. "Causal" is a property of almost everything. Does that make the concept of causality useless? No. It just means you have to be specific about *which* causes matter.

  Gravity affects everything, but that doesn't mean a falling apple and a collapsing bank are the same event. Similarly, just because design involves choices doesn't mean every choice is a power struggle. The term "political" remains useful if you use it to describe **design choices that have asymmetric impacts on human agency.**

  ### How to Save the Thesis (For Your Novel)
  You don't need to cheat. You just need to tighten the definition so your friend's *reductio* doesn't stick.

  **Don't say:** "All technology is political."
  **Do say:** "Infrastructure creates *latent* power structures that outlast the people who built them."

  This allows your engineer character to have a specific realization:
  1.  **Neutrality is a mask.** A curb cut looks like a concrete detail. To a wheelchair user, it is the difference between citizenship and house arrest.
  2.  **Intent vs. Effect.** The engineer might not *mean* to exclude anyone (rejecting Step 5's focus on backstory), but if the design excludes, the politics are real.
  3.  **The "Loose Joint" is the leverage point.** The engineer's drama comes from realizing that Step 2 is false. They aren't just pouring concrete; they are choosing between Meaning A (coordination) and Meaning B (power).

  ### The Verdict
  Your friend has confused **ontology** (what an object is) with **sociology** (what an object does).

  *   **Step 2** is the lie: It pretends a hinge and a highway are the same kind of choice.
  *   **Step 5** is the blindness: It pretends the physical world doesn't enforce rules independent of human intent.

  If you tell your friend, "I'm not interested in whether a spoon is political; I'm interested in when a design choice hardens into a power dynamic," their argument evaporates. They are attacking a straw man (strong determinism) rather than the actual claim (technological somnambulism / latent politics).

  **For the book:** Keep the bridge. Keep the engineer's anxiety. The friend's argument is a philosophical parlor trick that falls apart the moment you try to actually drive a bus under the overpass. The concrete doesn't care about the philosophy; it just blocks the bus. That is the politics.
