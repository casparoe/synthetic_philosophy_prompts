  7.  **Final Polish of the Plan:**
      *   Ensure the whiteboard instructions are visual.
      *   Ensure the timing is realistic.
      *   Check the tone: Respectful of their intelligence, but firm on metaphysical distinctions.
      *   Make sure the "Dependency Structure" is clear at the start.

  8.  **Self-Correction during drafting:**
