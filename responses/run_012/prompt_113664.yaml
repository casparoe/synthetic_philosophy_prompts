          *   *Unanticipated:* "PII is required for logic/substitution." (Leibniz's Law confusion). "PII is falsified by Quantum Mechanics." (Bosons). I need to refuse the QM dive.

      *   *Refusals:* Quantum Mechanics (too technical/distracting), Leibniz's Law (Indiscernibility of Identicals) confusion (keep directionality clear), Theology (Leibniz's God).

