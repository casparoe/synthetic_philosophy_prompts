prompt: |-
  You are an expert in metaphysics and in teaching abstract material to audiences with no philosophical training. Think carefully before writing, and begin by working out the dependency structure and the misconception map rather than drafting prose.

  Next month I am leading a single ninety-minute session on the identity of indiscernibles for a reading group of working scientists and lawyers. They have all met the slogan that no two things can be exactly alike and take it to be obviously true; a few have heard of the two-spheres case and assume it settles the matter. Do not explain the principle to me -- plan how I should explain it. In particular: the order in which the components must arrive and why each is load-bearing, i.e. what has to be in place before the spheres case can function as a counterexample rather than as a curiosity; the single case that should carry the session, whether that is the stock two-spheres setup or a modification of it, and if you modify it, what you change and why the audience can then no longer coast on recognition, together with what the case must have and must lack for the point to land; the misconceptions this audience will bring or form, each matched to the precise moment in the sequence where it should be headed off -- I expect at least "the spheres are one object counted twice" and "the principle is safe because only intrinsic properties count," but give me the ones I have not anticipated, including how to absorb the move someone will make about the difference between this sphere and that one; the single closing question that would reveal whether the idea landed rather than whether they can recite the slogan; and what I should refuse to take up at this level, announced as a refusal. Make the plan concrete enough that I can follow it at a whiteboard.
reasoning: |-
