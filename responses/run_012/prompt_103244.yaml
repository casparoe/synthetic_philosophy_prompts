      *   **Problem:** The phrase "democracy is more than elections" is used ambiguously, sometimes as a genuine criterion, sometimes as a partisan label.
      *   **Task:** Disambiguate the phrase. Do *not* give a verdict on specific countries. Provide a "menu" of distinct precise claims the sentence could be making.
      *   **Requirements for each reading:**
          *   Specify what the "more" is (procedural, contestation, substantive, popular sovereignty, civic culture, etc.).
          *   State what it entails.
          *   State what rival views it rules out.
          *   Assess its status (trivial, substantive/defensible, false, self-serving).
          *   Apply it to the four cases (Hungary/Orbán, Poland/previous gov, Turkey, US).
          *   Assess if it collapses into partisan labeling (is the standard fixed independently?).
          *   Identify which reading the "decisive" participant likely meant vs. which wouldn't support their conclusion.
          *   Identify which reading frequent users probably intend.
          *   Note if a reading makes the slogan tautological or empty.
      *   **Final Section:** Address *who* is entitled to apply the criterion and by *what procedure* to avoid factionalism.
      *   **Format:** Present as a list.

  2.  **Deconstruct "Democracy is More Than Elections":**
      What are the standard political science interpretations of this phrase?
      *   *Liberal Democracy:* Needs rule of law, rights, constraints on power.
      *   *Electoral Integrity:* Elections must be free and fair (not just held).
      *   *Substantive Democracy:* Outcomes matter (equality, welfare).
      *   *Participatory/Deliberative:* Engagement between elections.
      *   *Illiberal Democracy:* The tension between majority rule and minority rights.

  3.  **Drafting the Readings (The Menu):**

      *   *Reading 1: The Liberal-Institutional Reading.* "More" = Constitutional safeguards (rule of law, independent courts, free press).
          *   *Entailment:* Elections alone aren't enough if the playing field is tilted or rights aren't protected.
          *   *Rules out:* "Electoralism" (Schumpeterian minimalism).
          *   *Status:* Substantive/Defensible (standard poli-sci view).
          *   *Application:* Hungary/Turkey often fail here. US/Poland vary.
          *   *Risk:* Can be partisan if "independence" is defined loosely.

      *   *Reading 2: The Contestation-Integrity Reading.* "More" = The *quality* of the election (incumbent can actually lose).
          *   *Entailment:* If the incumbent uses state resources to prevent loss, it's not a democracy, even if voting occurs.
          *   *Rules out:* Regimes where elections are rituals.
          *   *Status:* Substantive/Defensible.
          *   *Application:* Turkey/Hungary (tilted playing field). US (gerrymandering concerns).
          *   *Risk:* Requires empirical assessment of fairness, not just outcome.

      *   *Reading 3: The Substantive-Outcomes Reading.* "More" = Policy responsiveness, welfare, equality.
          *   *Entailment:* If elections don't produce good outcomes for the people, the democracy is deficient.
          *   *Rules out:* Proceduralism.
          *   *Status:* Controversial/Often considered category error (confusing democracy with good governance).
          *   *Application:* US (inequality), Poland/Hungary (welfare populism).
          *   *Risk:* Highly subjective, easily partisan.

      *   *Reading 4: The Civic-Culture Reading.* "More" = Norms, tolerance, civil society health.
          *   *Entailment:* Democracy dies in the hearts of men; requires active citizenry, not just voting.
          *   *Rules out:* Institutional fetishism.
          *   *Status:* Substantive/Defensible but hard to measure.
          *   *Application:* US (polarization), Hungary (civil society restrictions).
          *   *Risk:* Elitist, hard to quantify.

      *   *Reading 5: The Tautological/Partisan Reading.* "More" = Whatever I say is missing.
          *   *Entailment:* If I dislike the outcome, democracy is absent.
          *   *Rules out:* Nothing (it's a move, not a theory).
          *   *Status:* Self-serving/Empty.
          *   *Application:* Used to delegitimize opponents.
          *   *Risk:* Collapses entirely into labeling.

  4.  **Analyzing the Implications (The "Decisive" Participant):**
      *   To conclude "not a democracy at all" based *solely* on that phrase, they likely mean Reading 1 (Liberal) or Reading 2 (Contestation). Reading 3 (Outcomes) usually leads to "flawed democracy," not "not a democracy." Reading 5 is the cynical view.
      *   Frequent users probably mix Reading 1 and Reading 5.

  5.  **Addressing the "Who Decides?" Question:**
      *   Need to distinguish between *definition* and *adjudication*.
      *   Courts (Constitutional), International Monitors (Venice Commission, Freedom House), Electorates (retrospective voting), Theorists (academic classification).
      *   Procedure needs to be transparent and metric-based to avoid factionalism.

  6.  **Refining and Polishing:**
      *   *Tone:* Analytical, neutral, precise (as requested).
      *   *Structure:* Follow the prompt's requirements strictly.
