answer: |-
  Here is a disambiguation of the claim "democracy is more than elections," presented as a menu of distinct theoretical readings. Each reading specifies the content of the "more," its logical entailments, its application to the cases you mentioned (Hungary, Poland, Turkey, United States), and an assessment of its susceptibility to partisan manipulation.

  ### 1. The Liberal-Constitutional Reading
  *   **What the "More" Is:** A set of procedural constraints on state power independent of the ballot box. This includes the rule of law, independent courts, constitutional protections for minority rights, and a free press not dominated by the state or oligarchs allied with the state.
  *   **Entailments:** A regime is not a democracy if the majority can use electoral victory to dismantle the mechanisms that allow them to be removed later. Elections are necessary but insufficient; they must occur within a liberal constitutional framework.
  *   **Rules Out:** "Electoralism" or Schumpeterian minimalism (the view that democracy is *only* competitive elections). It rules out the legitimacy of "illiberal democracy."
  *   **Status:** **Substantive but defensible.** This is the dominant view in contemporary comparative politics (e.g., Freedom House, Varieties of Democracy). It is not trivial, as it distinguishes between "democratic" and "liberal democratic."
  *   **Implications for Cases:**
      *   *Hungary/Turkey:* Often classified as "hybrid regimes" or "electoral autocracies" under this reading due to judicial capture and media control, even if elections are held.
      *   *Poland (previous gov):* Would be scrutinized for conflicts between government policy and judicial independence.
      *   *US:* Anxieties focus on court-packing threats or norms of judicial independence.
  *   **Fixed Standard?** **Mostly.** Indices exist (e.g., V-Dem, World Justice Project) that measure judicial independence and media freedom independently of election outcomes. However, accusations of "judicial activism" vs. "judicial independence" can be weaponized.
  *   **Participant Intent:** To conclude a regime is **not a democracy at all**, the participant likely relies on this reading. It provides the binary switch: if liberal safeguards are gone, the democracy is dead, regardless of voting.
  *   **Frequent Users:** This is the standard intended by most policy analysts and NGOs when using the phrase seriously.

  ### 2. The Contestation-Integrity Reading
  *   **What the "More" Is:** Conditions ensuring the *uncertainty* of the electoral outcome. This includes equal access to media, absence of voter intimidation, non-partisan election administration, and the absence of gerrymandering or legal harassment of opposition candidates.
  *   **Entailments:** An election where the incumbent cannot realistically lose is not a democratic election. The "more" is the *fairness* of the contest, not just the *existence* of the contest.
  *   **Rules Out:** Hegemonic party systems where elections are rituals. It rules out the claim that "votes were counted accurately" is sufficient for democracy.
  *   **Status:** **Substantive and defensible.** It focuses on the input side of democracy rather than the output.
  *   **Implications for Cases:**
      *   *Hungary/Turkey:* Criticized for tilted playing fields (media access, campaign finance) rather than just ballot stuffing.
      *   *Poland (previous gov):* Debates over public media usage during campaigns.
      *   *US:* Anxieties focus on gerrymandering, voter ID laws, and the administration of elections.
  *   **Fixed Standard?** **Yes.** International monitors (OSCE, Carter Center) have specific checklists for electoral integrity that can be applied prior to knowing the winner.
  *   **Participant Intent:** This supports the "not a democracy" conclusion if the playing field is deemed so uneven that the election is a sham.
  *   **Frequent Users:** Common among election observers and legal scholars.

  ### 3. The Substantive-Outcomes Reading
  *   **What the "More" Is:** Responsiveness and material welfare. This reading holds that democracy requires the government to respond to the preferences of the median voter and ensure a baseline of social equality or welfare.
  *   **Entailments:** If elections produce no change in policy, or if policy consistently favors elites over the majority, the system is democratically deficient.
  *   **Rules Out:** Purely procedural definitions. It implies a regime can be procedurally perfect but substantively undemocratic (e.g., a "low-intensity democracy").
  *   **Status:** **Controversial / Category Error.** Many theorists argue this conflates *democracy* (a method of choosing leaders) with *good governance* or *social justice*. It risks making "democracy" synonymous with "policies I like."
  *   **Implications for Cases:**
      *   *Hungary/Poland:* Could be argued as *more* democratic under this reading if their welfare populism reflects majority will better than technocratic alternatives.
      *   *US:* Often criticized under this reading due to the influence of money in politics and policy stagnation despite public opinion.
      *   *Turkey:* Economic outcomes often weigh heavily in this assessment.
  *   **Fixed Standard?** **No.** This is highly susceptible to collapsing into a label for regimes the speaker approves of. "Responsiveness" is subjective; one faction's "responsive welfare" is another's "clientelism."
  *   **Participant Intent:** This reading **would not support** the conclusion "not a democracy at all" easily; it usually leads to "flawed democracy." It is rarely the basis for the decisive "no" in your group, unless the speaker equates democracy with justice.
  *   **Frequent Users:** Often used by populist leaders (to claim they are the "true" democracy) or by left-wing critics of neoliberal democracies.

  ### 4. The Civic-Culture Reading
  *   **What the "More" Is:** The health of civil society and democratic norms outside the state. This includes tolerance, willingness to accept defeat, trust in institutions, and vibrant associational life.
  *   **Entailments:** Democracy is a culture, not just a machine. If citizens or elites lose the "guardrails" (e.g., refusing to concede, dehumanizing opponents), democracy is eroding even if institutions stand.
  *   **Rules Out:** Institutional fetishism (the idea that keeping the buildings open is enough).
  *   **Status:** **Substantive but hard to measure.** It is defensible (democracies do collapse culturally before institutionally) but vague.
  *   **Implications for Cases:**
      *   *US:* The primary locus of "anxiety" here (polarization, norm-breaking).
      *   *Hungary/Turkey:* Civil society restrictions (NGO laws) are cited as evidence of erosion.
      *   *Poland:* Deep societal polarization is the key metric.
  *   **Fixed Standard?** **Weakly.** Cultural metrics are subjective. It is easy to label the other side's passion as "undemocratic intolerance" while framing one's own as "righteous engagement."
  *   **Participant Intent:** This supports a warning of "backsliding" rather than a binary "not a democracy." It is too gradualist for a decisive verdict.
  *   **Frequent Users:** Political theorists, sociologists, and pundits focusing on polarization.

  ### 5. The Stipulative-Partisan Reading
  *   **What the "More" Is:** Undefined. The "more" is simply whatever condition the current ruling party fails to meet, or whatever condition the speaker's preferred party meets.
  *   **Entailments:** "Democracy" becomes a synonym for "legitimate regime." If I dislike the government, it is not a democracy. If I like it, it is.
  *   **Rules Out:** Nothing. It is a rhetorical move, not a theoretical claim.
  *   **Status:** **Self-serving / Empty.** It makes the slogan true by definition (tautological) because the definition shifts to fit the conclusion.
  *   **Implications for Cases:**
      *   *All Cases:* Applied inconsistently. A regime is "autocratic" when the opposition wins (illegitimate) or "democratic" when the ally wins (legitimate), regardless of institutional changes.
  *   **Fixed Standard?** **No.** It collapses entirely into a label for regimes the speaker approves of.
  *   **Participant Intent:** If the participant offered no criteria for *what* the "more" was, only that it was missing, they likely mean this. It allows for the decisive "no" without the burden of proof.
  *   **Frequent Users:** Partisan activists and polarized media personalities.

  ---

  ### Analysis of Intent and Usage

  **Which reading allows the "Decisive" Conclusion?**
  To move from "elections are held" to "this is not a democracy at all," the participant must be using **Reading 1 (Liberal-Constitutional)** or **Reading 2 (Contestation-Integrity)**.
  *   **Reading 1** allows the claim that without independent courts/media, the election is meaningless, thus the regime is an autocracy.
  *   **Reading 2** allows the claim that if the incumbent cannot lose, the election is a sham, thus the regime is an autocracy.
  *   **Readings 3 and 4** generally imply a spectrum (more or less democratic) rather than a binary (democracy vs. non-democracy).
  *   **Reading 5** allows the conclusion but lacks intellectual honesty.

  **Which reading do frequent users probably intend?**
  *   **Academics/NGOs:** Usually mean **Reading 1**, sometimes **Reading 2**. They rely on fixed indices.
  *   **Pundits/Activists:** Often slide between **Reading 1** and **Reading 5**. They begin with liberal criteria but often abandon consistency when their "side" is in power.
  *   **Populist Leaders:** Often invoke **Reading 3** (Substantive) to argue *they* are the true democrats because they deliver outcomes, accusing critics of being "elitists" who care only about procedures.

  **Which readings are trivial or empty?**
  *   **Reading 5** is empty. It empties the word "democracy" of descriptive content, making it purely evaluative (good/bad).
  *   **Reading 1** risks triviality if one defines "Democracy" *as* "Liberal Democracy" by fiat. If the definition is stipulated rather than argued, the statement "Democracy is more than elections" becomes a tautology ("Liberal Democracy is more than Elections"). It is only substantive if one acknowledges "Electoral Democracy" as a coherent category that is being critiqued.

  ---

  ### The Question of Authority and Procedure

  Once a reading is fixed (preferably Reading 1 or 2 to avoid partisan collapse), the question remains: **Who applies the label, and how?** If every faction applies the label, the term loses utility.

  **1. International Monitors (The External Procedure)**
  *   **Who:** Organizations like the Venice Commission, OSCE/ODIHR, or V-Dem Institute.
  *   **Procedure:** They utilize checklists based on **Reading 1 and 2**. They assess media laws, judicial appointment processes, and election administration *before* and *during* elections.
  *   **Advantage:** They are (theoretically) insulated from domestic partisan outcomes.
  *   **Risk:** Accusations of foreign interference or Western bias.

  **2. Constitutional Courts (The Internal Legal Procedure)**
  *   **Who:** The domestic judiciary.
  *   **Procedure:** Adjudicating specific laws against the constitution.
  *   **Advantage:** Legally binding.
  *   **Risk:** If the court itself is captured (a key feature of Reading 1 backsliding), it cannot be the arbiter.

  **3. The Electorate (The Political Procedure)**
  *   **Who:** The voters.
  *   **Procedure:** Retrospective voting. If voters believe democracy is eroding, they vote the incumbent out.
  *   **Advantage:** Ultimately, democracy is self-enforcing.
  *   **Risk:** If the "Contestation-Integrity" (Reading 2) is compromised, the electorate cannot fix the problem via the ballot.

  **4. Theorists/Citizens (The Discursive Procedure)**
  *   **Who:** The public sphere (your discussion group).
  *   **Procedure:** Argumentation based on public evidence.
  *   **Requirement:** To avoid the charge of factionalism, participants must agree to **Reading 1 or 2** and apply them **consistently**.
  *   **Test of Consistency:** If a participant claims a regime is "not a democracy" due to judicial interference, they must be willing to apply the same criterion to a regime led by their preferred party. If they cannot, they are operating under **Reading 5**.

  **Recommendation for the Group:**
  To prevent the phrase from becoming a mere weapon, propose that the group adopt **Reading 1 (Liberal-Constitutional)** as the working definition, but require that any claim of "non-democracy" be accompanied by specific evidence of institutional degradation (e.g., specific laws curtailing press freedom, specific instances of judicial purging) rather than general anxieties or policy disagreements. This shifts the burden from *labeling* to *documenting*.
