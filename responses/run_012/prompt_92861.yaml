answer: |-
  The arrival gate hummed, a sound Elias knew as well as his own heartbeat. He stepped through the shimmer, the taste of ozone and recycled Martian dust still coating his tongue. He was Elias-7, the traveler, the copy. He carried three months of red-dust sunsets and the specific ache of low-gravity muscle atrophy.

  Back in the apartment, the stasis pod hissed. The seal broke.

  Elias-0 sat up. He was pale, his muscles atrophied from the ninety-day wait, but his eyes were sharp. He had spent three months in the dark, aware but unable to move, a conscious statue waiting for his own return. He remembered the waiting. Elias-7 remembered the Mars.

  "Welcome back," Elias-0 said. His voice was raspy from disuse.

  "Welcome to the present," Elias-7 replied. It was the standard greeting mandated by the Continuity Act.

  Sarah stood between them, her hands clasped so tightly her knuckles were white. She looked from one to the other. To the world, to the courts, to the bank, they were both Elias Vance. They shared the same biometric hash, the same tax ID, the same marital contract. The philosophy was clear: Identity is not a further fact. What matters is Psychological Connectedness. They both held Relation C to the man who had entered the booth ninety days ago. They were both entitled to the life.

  "We have the counseling session at noon," Sarah said, her voice tight. "Dr. Aris says we need to establish the rotation."

  "Rotation," Elias-0 repeated. He touched his own face, checking the stubble. "I remember the day I went in. I remember kissing you goodbye. I remember the fear."

  "I remember the fear too," Elias-7 said gently. "I remember stepping into the scanner. I remember the flash. Then I woke up on Mars."

  "But I waited," Elias-0 said. There was no accusation in his tone, only a statement of data. "I was there for the ninety days. You were... elsewhere."

  "I was living," Elias-7 said.

  "And I was enduring."

  They sat at the dining table, a triangle that felt like a line. The counselor, a soft-voiced woman named Lin, projected the holographic contract onto the table.

  "The State recognizes that divergence creates distinct psychological profiles," Lin said, her eyes moving between the two men. "However, for social stability, the Unit must remain intact. You share the income. You share the residence. You share the spouse."

  Sarah flinched. Elias-7 saw it.

  "Relation C is sufficient for moral concern," Elias-7 recited. He had taught this in his ethics seminars before the transfer. "We are not two souls fighting for one slot. We are one stream that branched. The water is the same."

  "The water is in different cups," Elias-0 said. He looked at Sarah. "Do you remember our anniversary? The one before I went into the pod?"

  "June 14th," Sarah said.

  "I was thinking about that dinner while I was in the dark," Elias-0 said. "It was the only memory I could hold onto without moving. I rehearsed it. I tasted the wine in my mind."

  Elias-7 felt a cold prickle on his neck. He remembered the dinner too. But he also remembered the bar on Phobos Station, the woman with the laugh like breaking glass, the conversation about terraforming that had felt like flirting. He hadn't acted on it. Technically, he hadn't violated the contract. But the memory was there, a new branch on the tree that Elias-0 did not possess.

  "We can handle it," Elias-7 said, more to convince himself than the room. "We are rational agents. We optimize for the household's welfare."

  The first month was a lesson in logistics. There was one salary, but two bodies to feed, two sets of clothes to buy. The bank accepted the biometric signature from either, but the system glitched when both tried to access the account simultaneously. They had to schedule their existence.

  Elias-0 took the mornings. Elias-7 took the evenings.

  They shared the bed on alternating nights. Sarah slept in the middle, a buffer zone of cold sheets.

  One Tuesday, Elias-7 came home early. He found Elias-0 in the kitchen, making coffee. Elias-0 was wearing Elias-7's favorite sweater, the grey wool one.

  "I found it in the drawer," Elias-0 said. "It fits us both."

  "It smells like me," Elias-7 said. "Like the station."

  "It smells like home," Elias-0 corrected. He turned, holding the mug. "Sarah cried last night."

  Elias-7 stiffened. "Why?"

  "Because I reached for her hand while we watched the feed. And she didn't pull away. But she didn't squeeze back." Elias-0 took a sip. "She looks at me and sees the man who suffered for her. She looks at you and sees the man who left her."

  "I didn't leave. I traveled. For the promotion. For the bonus."

  "You ceased to be here," Elias-0 said. "I remained. In the dark. I am the continuity of location. You are the continuity of experience."

  "The philosophy says location doesn't matter," Elias-7 said, feeling the doctrine slip in his hands like wet soap. "Only psychological connectedness."

  "Does it?" Elias-0 set the mug down. "When you kiss her, do you think of me? Do you wonder if I am listening? If I am waiting in the other room, remembering the way her skin feels, because I am you?"

  Elias-7 didn't answer. He had thought of it. Every time he touched her, he felt the ghost of his other self watching, a silent shareholder in the intimacy. The theory said they were equal claimants. The feeling was of adultery.

  The crisis came on a rainy Thursday. A letter from the Credit Union. *Default Notice.*

  The system had flagged the account. Two biological entities drawing against one income stream was categorized as "Resource Duplication." They needed to designate a Primary for tax purposes. Only one could sign the loan modification.

  They sat at the table again. Sarah was in the bedroom, the door closed.

  "I should sign," Elias-0 said. "I never left. My credit history is unbroken."

  "I earned the bonus that paid the down payment," Elias-7 countered. "My psychological continuity includes the labor that generated the capital."

  "We are the same laborer," Elias-0 said.

  "Are we?" Elias-7 stood up. He walked to the window. He saw his reflection, and behind it, the reflection of the man sitting at the table. "I have memories you don't. I have scars you don't. I know the taste of recycled water on Mars. You know the texture of the stasis gel."

  "I know the fear of never waking up," Elias-0 said softly. "You don't know that. You think you survived. I know I survived."

  Elias-7 turned around. He looked at his other self. He believed the doctrine. He truly did. He knew that personal identity was a fiction, a convenient narrative construct. He knew that what mattered was the overlap of memory and character. They had ninety percent overlap. That should be enough.

  But he looked at Elias-0 and felt a surge of possessiveness that had no philosophical justification. He wanted to be the one who signed the paper. He wanted to be the one who walked into the bedroom and comforted Sarah. He wanted to be the *only* one.

  "It doesn't matter who signs," Elias-7 said, reciting the lesson. "The debt belongs to the Pattern, not the substrate."

  "Then you sign," Elias-0 said. He pushed the tablet across the table.

  Elias-7 picked up the stylus. His hand hovered. If he signed, he was asserting priority. If he asserted priority, he was admitting that identity *did* matter, that one version was more valid than the other.

  But if he didn't sign, the house would be lost.

  He signed *Elias Vance*.

  Later that night, the bedroom was quiet. Sarah was asleep. Elias-7 sat on the edge of the bed. Elias-0 stood in the doorway.

  "The bank accepted it," Elias-0 said.

  "Good."

  "Dr. Lin says we need to make a permanent arrangement. The divergence is increasing. It's causing... instability."

  Elias-7 looked at Sarah's breathing. "She can't love a plural noun."

  "No," Elias-0 agreed.

  "The theory says we should both stay. We both deserve concern."

  "Yes."

  "But we can't."

  "No."

  Elias-0 stepped into the room. He didn't look angry. He looked tired. "I remember the stasis. It was cold. But it was quiet. I can go back."

  Elias-7 felt a wave of nausea. It wasn't relief. It was guilt. If Elias-0 went back into the pod, he would be the one waiting again. The one paused. The one suspended while Elias-7 lived. The philosophy said it didn't matter. It was just a pause. But Elias-7 knew that for the man in the box, time still passed.

  "If you go," Elias-7 said, "I am the only one left."

  "You are the one who went to Mars," Elias-0 said. "You are the one who came back. You have the momentum."

  "We are equal."

  "Are we?" Elias-0 looked at Sarah. "She sleeps when you are in the room. When I am in the room, she rests, but she doesn't sleep. She is waiting for you to come back."

  Elias-7 closed his eyes. He wanted to argue. He wanted to cite the textbooks, the court rulings, the ethical frameworks that declared the self a bundle of relations, not a jewel of permanence. He wanted to say that Elias-0 was just as real, just as valid.

  But he knew that if Elias-0 left, he would not feel whole. He would feel like a man who had sent a part of himself into exile. And if he stayed, and Elias-0 stayed, they would destroy the woman in the bed.

  "What will you do?" Elias-7 asked.

  "There is a colony on Luna," Elias-0 said. "They need administrators. They accept branched citizens. I can start a new file there. A new name."

  "That's... that's a severance."

  "It's a practicality." Elias-0 turned to the door. "You believe the theory, Elias. But you live in the world."

  "I do believe it."

  "I know," Elias-0 said. "But belief doesn't stop the jealousy. It doesn't stop the hunger. It doesn't stop her from reaching for the hand that remembers the Mars dust, instead of the hand that remembers the dark."

  Elias-0 left the room. Elias-7 heard the front door open and close.

  He lay down next to Sarah. She stirred, her arm reaching out instinctively. She touched his chest.

  "Did he go?" she whispered, eyes still closed.

  "Yes."

  "Is it over?"

  Elias-7 looked at the ceiling. The metaphysics were unresolved. He was still Elias. The man on the shuttle to Luna was still Elias. The connection remained. The Relation C held. By the laws of the State and the logic of the schools, nothing had been lost. A copy had moved location. The Pattern persisted.

  But the house was quieter. The bank account was simpler. The bed was wide enough for two.

  "Yes," Elias-7 said into the dark. "It's over."

  He held his wife, and he waited for the morning, knowing that somewhere above the atmosphere, another man was looking down at the earth, remembering a life that was still being lived, wondering if he was the ghost or the body. Elias-7 closed his eyes, and for the first time since the transport, he did not dream of branching paths. He dreamed only of the silence.
