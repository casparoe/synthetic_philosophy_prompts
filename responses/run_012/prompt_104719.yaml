answer: |-
  The debate over AI alignment standards centers on the rigor of safety claims. One camp argues for worst-case security, demanding that a system remain safe against every conceivable input. The opposing camp argues for probabilistic safety, accepting that systems need only function correctly under expected conditions. To analyze this dispute precisely, we adopt specific terminology. A guarantee is **distribution-free** if it holds for every input in the system's declared input space. A guarantee is **distribution-bound** if it holds with probability at least $1 - \epsilon$ over a specified deployment distribution $D$. A **distribution-bound** guarantee is **shadowed** if there exists a plausible distribution shift under which the system's failure probability exceeds a threshold $\tau$. The pair consisting of the input space and $D$ is the **guarantee frame**.

  Consider a lab training a language model to refuse harmful requests. The lab reports a **distribution-bound** guarantee: on its evaluation distribution, the refusal rate exceeds 99.9%. A critic argues this guarantee is **shadowed** because an adversary can construct inputs outside the evaluation distribution that elicit harmful completions. The lab retorts that **distribution-free** guarantees are impossible for large input spaces, rendering the critic's standard vacuous. This exchange encapsulates the core tension between theoretical safety and engineering practicality.

  The first point of contention is the vacuity objection. The lab claims **distribution-free** guarantees are vacuous because an adversary can always find a failing input. This objection is decisive only if one assumes the input space is unconstrained and the model is inherently brittle. However, **distribution-free** guarantees are not inherently vacuous; they are merely difficult. If the **guarantee frame** restricts the input space to a structured API or limits the system's capabilities to a verifiable subset, a **distribution-free** guarantee becomes meaningful. For example, a system designed to only output integers within a specific range can be formally verified to never output text, regardless of the input. The lab's objection conflates the difficulty of aligning current large language models with a fundamental impossibility theorem. If alignment research succeeds, it should presumably produce systems where **distribution-free** safety is achievable on relevant inputs. To declare it vacuous is to preemptively surrender the goal of robust alignment.

  Conversely, can **distribution-bound** guarantees be made robust enough to be trustworthy? The critic's concern about shadowing is potent. Any empirical distribution $D$ is a model of reality, not reality itself. If the **guarantee frame** relies on a $D$ that does not capture adversarial intent, the guarantee is **shadowed**. Proponents argue that $D$ can be expanded to include adversarial perturbations, effectively hardening the guarantee. Yet, this creates an arms race: as defenses improve, the adversary's search space shifts. Unless one can prove a bound on the rate of failure under *any* plausible distribution shift, the guarantee remains **shadowed** by definition. While expanding $D$ reduces the shadow, it rarely eliminates it. Trusting a **distribution-bound** guarantee requires faith that the unmodeled tail of the distribution contains no catastrophic failures, a faith that is unwarranted in high-stakes domains.

  This leads to the third consideration: is this choice technical or value-laden? It is fundamentally value-laden. The selection of a **guarantee frame** reflects a moral judgment about what kind of safety we owe to whom. If the system controls a recommendation algorithm, a **distribution-bound** guarantee is ethically sufficient; the cost of a rare failure is low. However, if the system controls autonomous weaponry or nuclear infrastructure, the asymmetry of risk changes the ethical calculus. In high-stakes contexts, imposing a **distribution-bound** guarantee transfers the risk of the "epsilon" failure to the public. Therefore, the demand for **distribution-free** guarantees is not merely a technical preference but a moral imperative proportional to the potential harm.

  Is there a coherent third option? A promising middle ground is guarantees that are **distribution-free** relative to a restricted but well-defined threat model. This approach narrows the input space within the **guarantee frame** to exclude inputs that are physically impossible or outside the system's operational design. For instance, a system might have a **distribution-free** guarantee against all inputs that do not attempt to exploit specific known vulnerabilities. This avoids the vacuity of unconstrained worst-case analysis while avoiding the shadowing of naive **distribution-bound** claims. However, this is ultimately a variation of the **distribution-free** approach, merely applied to a constrained domain. It acknowledges that while we cannot guarantee safety against *everything*, we must guarantee safety against *everything within the realm of possibility*.

  Weighing these arguments, the lab's reliance on the vacuity objection is a deflection. While strict **distribution-free** guarantees over all possible bitstrings are impractical, they are not vacuous over the space of *plausible* interactions defined by a rigorous threat model. The critic is correct that **distribution-bound** guarantees are inherently **shadowed** by the inevitability of distribution shift. In safety-critical AI alignment, relying on **distribution-bound** guarantees is negligent because the "epsilon" risk often represents existential catastrophe. We cannot accept a **guarantee frame** that permits failure simply because it is rare, if the failure is terminal.

  The deciding principle is risk-proportionate rigor. For capabilities that pose catastrophic risks, the standard must approach **distribution-free** safety within a well-defined operational envelope. We cannot rely on the probability of safety when the cost of failure is infinite.

  Verdict: The severity of potential harm dictates the required guarantee strictness.
