  Case one: A heavy, perfectly spherical ball bearing is dropped into a perfectly hemispherical bowl with uniform surface roughness. The ball is launched with sufficient kinetic energy to tumble chaotically before settling, and the outcome is the final resting position of a marked point on the ball's surface relative to the bowl's rim. The hardware possesses exact rotational symmetry ($SO(3)$): rotating the entire apparatus by any angle leaves the physical setup indistinguishable from its original state. Because the bowl is finite and the ball must rest somewhere, the outcome space is compact. The symmetry forces the probability distribution to be invariant under all rotations, and there is exactly one such normalized distribution: the uniform measure over the surface area.

  Case two: An idealized elastic rod of infinite length is clamped at one end ($x=0$) and subjected to increasing tension until it fractures. The material is manufactured by a fractal process such that the statistical distribution of micro-flaws is scale-invariant: zooming in on any segment $[a, 2a]$ reveals a flaw structure statistically identical to that of $[2a, 4a]$. The outcome is the distance $X$ from the clamp where the break occurs. The hardware possesses exact scale symmetry: the transformation $x \to kx$ maps the physical setup onto a proper part of itself without altering the fracture mechanics. There is no characteristic length scale in the material or the loading mechanism, meaning the physics is invariant under the multiplicative group of positive reals.

  **Analysis**

  In Case one, the refinement test confirms the stability of the indifference verdict. If we partition the sphere into Northern and Southern Hemispheres, symmetry dictates $P(\text{North}) = 0.5$. If we instead partition the sphere into latitude strips of equal angular width, the strips near the poles have less surface area than those at the equator; summing the probabilities of the strips comprising the North still yields 0.5 because the unique rotation-invariant measure weights area, not angle. If we partition by equal-area strips, the sum is trivially 0.5. The probability of the fixed event "North" does not move because the symmetry group is compact; the total mass of the invariant measure is finite, allowing unique normalization. The symmetry doesn't just suggest a distribution; the geometry of the hardware forbids any other.

  In Case two, consider the question: "Is the break point $X$ in the interval $[1, 2]$?" Three natural indifference schemes arise from parameterization choices: (1) Uniform on distance $X$ (density constant); (2) Uniform on log-distance $\ln X$ (density $\propto 1/X$); (3) Uniform on inverse distance $1/X$ (density $\propto 1/X^2$). The physical self-similarity suggests Scheme 2, as it is the only one invariant under scaling $X \to kX$. However, this scheme fails to yield a verdict. Partition the outcome space $(0, \infty)$ into the countable set of intervals $I_n = [2^n, 2^{n+1})$ for all integers $n$. Scale symmetry requires $P(I_n) = P(I_{n+1})$ for all $n$. Let this probability be $p$. If $p > 0$, the total probability $\sum p$ diverges to infinity. If $p = 0$, the total probability is zero. Neither sums to 1. The only consistent measure respecting the symmetry is $d\mu = dx/x$, which has infinite total mass. To get a number, one must impose a cutoff (e.g., the rod is actually finite, length $L$). Under Scheme 1 with cutoff $L$, $P([1, 2]) \approx 1/L \to 0$. Under Scheme 2 with cutoff $L$, $P([1, 2]) = \ln(2)/\ln(L) \to 0$ but at a different rate. Under Scheme 3, it concentrates near 0. The answers do not converge; they depend entirely on the arbitrary cutoff and the chosen parameterization.

  **What the pair shows**
  The pair demonstrates that the Principle of Indifference is not incoherent per se, but it is structurally conditional. It yields objective facts only when the symmetry group acting on the outcome space is **compact**. In Case one, the rotation group is compact, guaranteeing a unique, finite invariant measure (Haar measure). In Case two, the scale group is non-compact, admitting no finite invariant measure. This is a mathematical fact about the groups, not a preference for one language over another. Indifference is a rule for translating symmetry into probability; if the symmetry cannot support a probability measure (mass 1), the principle has no purchase.

  **The standard rescue**
  The claim that "specifying the experiment dissolves the problem" fails in Case two. Even with the physical process fully specified (fractal rod, scale-invariant tension), the physics *itself* lacks a scale. There is no fact of the matter about the probability of breaking in $[1, 2]$ because the physical setup does not distinguish $[1, 2]$ from $[2, 4]$. To pin down an answer, one must add physical information that breaks the symmetry (e.g., a minimum atomic spacing or a maximum rod length). The ambiguity is not in the description; it is in the idealized physics.

  **De-idealisation**
  The ambiguity in Case two is an artifact of the limit, but a persistent one. No real rod is infinitely long or perfectly fractal; there is always a minimum grain size $\epsilon$ and a maximum length $L$. This breaks the scale symmetry and renders the measure finite, technically solving the paradox. However, the resulting probability depends on the ratio $L/\epsilon$. As the gadget approaches the ideal (ratio $\to \infty$), the probability of any fixed finite interval tends to zero, but the *rate* depends on how the limit is taken (the parameterization). For any realistic but large ratio, the "answer" remains highly sensitive to the choice of measure (Linear vs. Log), meaning the ambiguity survives as a practical instability even if the theoretical contradiction vanishes.

  **Strategic use**
  Use Case two against the Principle of Indifference to show that it cannot be a universal logical rule; applied to non-compact symmetries, it generates contradictions or arbitrary cutoffs. Use Case one against the critics (who claim indifference is always subjective) to show that when symmetries are compact, the probability verdict is forced by the hardware, leaving no room for subjective choice. The best reply to the critics is that PoI is not a principle of ignorance, but a principle of **symmetry translation**: it is valid if and only if the symmetry group admits a unique normalized invariant measure.
