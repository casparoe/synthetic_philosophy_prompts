prompt: |-
  I need a matched pair of thought experiments built to order, both about the principle of indifference. Don't reach for the classic circle-and-chord thing — I've read that one a hundred times and it'll just make you recite. I want gadgets.

  Case one: indifference that's actually forced. Give me a physical randomising device with a symmetry — a real symmetry of the hardware, not of a formula — such that exactly one probability distribution is consistent with it and that distribution has total mass 1. So the indifference answer isn't a choice anyone makes; it's the only thing that fits. Then run a refinement test on it: cut the outcome space a different way, ideally a way a reasonable person might have chosen instead, and show that the probability of a fixed event doesn't move. Explain what stops it moving.

  Case two: indifference that provably has no verdict. Give me a device that is exactly self-similar in the following sense: there's an operation on the gadget (a zoom, a stretch, a scale-down) that carries the whole setup onto a proper part of itself, and it's a symmetry of the physical process, not just of your coordinates. Then:

  - state one yes/no question about a physical outcome of running the device;
  - give at least three natural ways of being indifferent about it, at least two of which give different numbers;
  - include the scheme the self-similarity itself suggests, and show it can't work: the symmetry forces the parts to have equal probability, and a countable partition into equal-probability parts has no consistent assignment. Spell out why;
  - show that what survives is only a symmetry-respecting measure with infinite total mass, that every finite answer needs a cutoff, and that different natural cutoffs give different answers which don't converge. If a ring-shaped gadget is the obvious route here, take it only if you do the numbers; otherwise I'd rather see a different geometry with the same structure.

  Constraints on both: no infinite coin flips, no picking a uniformly random real as a primitive, no measure-theory deus ex machina. All the randomness has to come out of a mechanism you can describe in a sentence or two (a spinner, a ball, a spring, a moving part), though you're allowed to take an idealised limit of such a mechanism. One paragraph per gadget, then the analysis.

  Then the parts I actually care about:

  - say what the pair shows: is the principle of indifference incoherent, or is it fine provided the symmetry group is the right kind of thing? Name the structural property that seperates case one from case two and say why it's a fact rather than a preference;
  - the standard rescue: someone says the whole problem is people forgetting to specify the experiment, and that once the physical process is fixed there's a fact of the matter. Does that dissolve case two? Be honest about whether the fully specified process there pins down an answer;
  - de-idealisation: nothing real is exactly self-similar. Does the ambiguity in case two survive when the gadget is only approximatly self-similar, or is it an artefact of the limit? If the answer depends on how close to self-similar you get, say how;
  - which of the two cases you'd use against the principle and which against its critics, and the best reply to each.

  For context, this is for a session on whether indifference failures are about sloppy language or about symmetry groups, so I'll be checking whether the verdicts fall out of the setups or were smuggled in. A case that stipulates its probabilities instead of generating them is no use to me. And don't cite anyone — I don't want reading lists, I want the cases and the reasoning.
