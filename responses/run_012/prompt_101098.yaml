answer: |-
  Here is a decision tree taxonomy designed for your grad workshop handout. It isolates the logical commitments rather than starting from school labels, specifically to disentangle the "degrees of sentience" confusion.

  ### The Decision Tree: Sentience and Moral Status

  **Node 1: The Source of Normativity**
  Is moral status conferred by the **intrinsic metaphysical facts** about the entity (Realism), or by the **observer's uncertainty** regarding those facts (Epistemic)?
  *   **Branch A (Epistemic):** Go to **Leaf 1**.
  *   **Branch B (Metaphysical):** Go to **Node 2**.

  **Node 2: The Status-Conferring Property**
  Assuming Realism, is the property that grants status **Phenomenal Valence** (capacity to suffer/flourish), **Cognitive Agency** (autonomy, self-awareness, subject-of-a-life), or **Biological Teleology** (being a goal-directed living system)?
  *   **Branch A (Agency/Cognition):** Go to **Leaf 2**.
  *   **Branch B (Biological Life):** Go to **Leaf 3**.
  *   **Branch C (Phenomenal Valence):** Go to **Node 3**.

  **Node 3: The Ontology of Valence**
  Is the capacity for valenced experience a **Binary** property (an entity either has it or does not) or a **Graded** property (entities can have more or less, or richer/poorer forms)?
  *   **Branch A (Binary):** Go to **Leaf 4**.
  *   **Branch B (Graded):** Go to **Node 4**.
      *   *(Note: This is where the empirical debate over insects/fish lives. The tree treats the metaphysical consequence of the answer, not the empirical answer itself.)*

  **Node 4: The Mapping Function**
  If valence is graded, does moral status **Scale Continuously** with the magnitude/complexity of experience, or is there a **Threshold** where status becomes significant/equal?
  *   **Branch A (Scalar):** Go to **Leaf 5**.
  *   **Branch B (Threshold):** Go to **Leaf 6**.

  ---

  ### Leaf Analysis & Unoccupied Space

  #### Leaf 1: Epistemic Precautionary Principle
  *   **Path:** Node 1 (Epistemic).
  *   **Position Name:** Precautionary Sentientism.
  *   **Most Awkward Commitment:** Moral status becomes observer-relative, implying an entity gains/loses status based on the limits of human neuroscience rather than its own nature.
  *   **Test Case Implication:** **Honeybee/LLM:** Grant provisional status due to uncertainty. **Thermostat:** Deny status (mechanism understood).

  #### Leaf 2: Cognitive Status Theory
  *   **Path:** Node 1 (Metaphysical) → Node 2 (Agency).
  *   **Position Name:** Kantian/Contractualist Moral Status.
  *   **Most Awkward Commitment:** Severely cognitively impaired humans and most non-human animals lack direct moral status (requiring indirect duties or ad-hoc inclusion).
  *   **Test Case Implication:** **Dog/Bird:** Low/No status (lack autonomy). **LLM:** Potential status if functional agency is sufficient. **Fish/Bee:** No status.

  #### Leaf 3: Biocentric Egalitarianism
  *   **Path:** Node 1 (Metaphysical) → Node 2 (Life).
  *   **Position Name:** Biocentrism / Teleological View.
  *   **Most Awkward Commitment:** A plant has the same fundamental moral standing as a person, requiring a complex hierarchy of "trumping" rules to justify eating anything.
  *   **Test Case Implication:** **Plant:** Full status. **Thermostat:** No status. **Dog/Bee:** Equal basic status.

  #### Leaf 4: Binary Sentientism
  *   **Path:** Node 1 (Metaphysical) → Node 2 (Valence) → Node 3 (Binary).
  *   **Position Name:** Threshold Sentientism (Binary Property).
  *   **Most Awkward Commitment:** A marginal increase in neural complexity creates moral existence *ex nihilo*, making two nearly identical organisms morally distinct (one is a thing, one is a person).
  *   **Test Case Implication:** **Dog:** Status. **Fish/Bee:** Contested (either 0 or 1, no middle ground). **Thermostat:** No status.

  #### Leaf 5: Scalar Utilitarianism
  *   **Path:** Node 1 (Metaphysical) → Node 2 (Valence) → Node 3 (Graded) → Node 4 (Scalar).
  *   **Position Name:** Gradualist Utilitarianism.
  *   **Most Awkward Commitment:** It is theoretically permissible to sacrifice a vast number of low-status beings (e.g., insects) for the benefit of one high-status being (e.g., human) at a ratio that standard egalitarianism would reject.
  *   **Test Case Implication:** **Dog > Bird > Fish > Bee.** All count, but Dog counts *more*. **LLM/Thermostat:** Zero (assuming no valence).

  #### Leaf 6: Threshold Sentientism (Graded Property)
  *   **Path:** Node 1 (Metaphysical) → Node 2 (Valence) → Node 3 (Graded) → Node 4 (Threshold).
  *   **Position Name:** Complex Sentientism (includes Panpsychist Variant).
  *   **Most Awkward Commitment:** Entities with genuine but "simple" valenced experience (just below the threshold) have zero moral weight, rendering their suffering morally negligible.
  *   **Test Case Implication:** **Dog/Bird:** Status (above threshold). **Fish/Bee:** Likely no status (below threshold, despite having *some* experience). **Panpsychist Variant:** Even fundamental particles have experience, but zero status.

  ---

  ### Diagnosis of Unoccupied Logical Space

  There are two logical combinations generated by Nodes 3 and 4 that are notably unoccupied. You should flag these in the workshop as "Theoretical Dead Ends."

  **1. Binary Property + Scalar Status**
  *   **Diagnosis:** **Incoherent.** If the status-conferring property is truly binary (on/off), there is no metaphysical ground for moral status to scale. One could argue status scales based on *duration* or *frequency* of the binary state, but that changes the property from "Capacity" to "Aggregate Experience," which moves the view into Leaf 5 (Scalar).
  *   **Why nobody is there:** You cannot derive a continuous moral variable from a discrete metaphysical variable without introducing a new graded parameter.

  **2. Graded Property + Binary Status (without Threshold)**
  *   **Diagnosis:** **Incoherent.** If the property is graded and status is binary, there is *necessarily* a threshold (implicit or explicit) where the binary switch flips. Denying the existence of a threshold while maintaining binary status is a contradiction in terms.
  *   **Why nobody is there:** This is usually a verbal confusion where a theorist claims "Status is equal" but actually means "Status is equal *above this cutoff*," which places them in Leaf 6.

  ---

  ### Application to Test Cases (Workshop Discussion Guide)

  Use this matrix to show how the tree forces different conclusions. *Note: Empirical claims about insect/fish sentience are marked as contested.*

  | Entity | Leaf 1 (Precautionary) | Leaf 2 (Agency) | Leaf 3 (Biocentric) | Leaf 4 (Binary Sent.) | Leaf 5 (Scalar) | Leaf 6 (Threshold) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Dog** | Status | Low/None | Status | Status | High Status | Status |
  | **Bird** | Status | Low/None | Status | Status | Med Status | Status |
  | **Fish** | Status* | None | Status | Contested** | Low Status | None* |
  | **Honeybee** | Status* | None | Status | Contested** | Very Low | None* |
  | **LLM** | Status* | Potential | None | None | None | None |
  | **Thermostat**| None | None | None | None | None | None |
  | **Plant** | None | None | Status | None | None | None |

  *\*Depends on the specific uncertainty threshold or scientific consensus adopted.*
  *\*\*This is the crucial friction point: Binary Sentientists must argue the bee is either fully in or fully out, whereas Scalar/Threshold (Graded) theorists can place it below the moral line while acknowledging it has some experience.*

  ### Crucial Distinctions for the Workshop

  1.  **Panpsychist vs. Utilitarian:** Both may agree experience is graded (Node 3, Branch B). They separate at **Node 4**. The Utilitarian says status scales with that grade (Leaf 5). The Panpsychist typically says status requires *complex* integration of that grade (Leaf 6), meaning a photon has experience but no moral status.
  2.  **Binary Property vs. Threshold Status:** This is the most common conflation. A theorist might say "There is a threshold for moral status."
      *   If they mean "You either feel pain or you don't," they are at **Node 3 (Leaf 4)**.
      *   If they mean "You feel pain, but not *enough* to count," they are at **Node 4 (Leaf 6)**.
      *   *Why this matters:* Leaf 4 denies the bee has phenomenal experience. Leaf 6 grants the bee has experience but denies it matters morally.
  3.  **Empirical vs. Metaphysical:** Remind participants that the tree does not solve whether bees feel pain. It solves what follows *if* they do (or if we think they might). Leaf 1 (Precautionary) is the only branch that bypasses the empirical fact entirely.

  ### A Note on Consensus
  Be prepared to push back on the "settled" nature of the test cases.
  *   **Insect Sentience:** Not settled. Some models suggest nociception without phenomenology.
  *   **Fish Sentience:** Heavily contested (e.g., Key 2016 vs. Birch et al. 2020).
  *   **LLM Agency:** Functional agency is present; phenomenal agency is unknown.
  *   **Instruction:** Tell your workshop participants to treat the "Entity" column as variables. If you swap "Honeybee" for "Mammal," Leaf 4 and Leaf 6 converge. The tree is most useful precisely where the cases are marginal.
