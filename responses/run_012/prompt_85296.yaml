prompt: |-
  I chair the interpretation committee at a regional museum, and on Thursday we have to sign off on the caption for a newly re-installed burial assemblage. The curator wants the caption to identify the grave goods as evidence that the community believed in an afterlife; a colleague objects that the same objects are equally consistent with a burial that merely displayed the deceased's rank, so the caption asserts more than the objects can show. Our standing policy requires captions to state only what the evidence supports, but it never says how to decide what the evidence supports. One member has proposed adopting a rule she calls minimal cognitive attribution: a caption may ascribe a belief to past people only if every materially equivalent explanation that omits the belief is worse. Please draft the short memo I will circulate before the meeting. It should recommend specific caption language, say whether to adopt the minimal-attribution rule as standing policy or what should replace it, and give the curator's position its strongest hearing rather than treating it as a failure of nerve.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Interpretation Committee at a regional museum.
      *   **Task:** Draft a short memo to circulate before the Thursday meeting.
      *   **Context:** Signing off on a caption for a newly re-installed burial assemblage.
      *   **Conflict:**
          *   Curator: Wants to state the grave goods prove belief in an afterlife.
          *   Colleague: Objects that goods could just display rank (evidence is ambiguous).
          *   Policy: Captions must state only what evidence supports (but doesn't define *how* to decide).
          *   Proposal: A member suggests "Minimal Cognitive Attribution" (MCA) rule: Ascribe belief *only if* every materially equivalent explanation omitting the belief is worse.
      *   **Requirements for the Memo:**
          1.  Recommend specific caption language.
          2.  Decide on the MCA rule (adopt, reject, or modify/replace).
          3.  Give the Curator's position its strongest hearing (avoid dismissing it as cowardice/uncertainty).
          4.  Tone: Professional, decisive, facilitative, adhering to museum ethics/standards.

  2.  **Deconstruct the Arguments:**
      *   **Curator's View:** Interpretation needs narrative power. Saying "they might have believed" is weak. Archaeology often infers belief from practice. If we don't interpret, we aren't educating.
      *   **Colleague's View:** Epistemic humility. Grave goods $\neq$ Afterlife necessarily (could be status signaling, ritual without eschatology, etc.). Policy requires evidentiary support.
      *   **MCA Proposal:** Very high bar. "Every materially equivalent explanation... is worse." This is essentially a "beyond reasonable doubt" standard for cognitive states. It might be *too* strict for archaeology, where multiple interpretations often coexist.
      *   **Policy Gap:** We need a heuristic for "what the evidence supports."

  3.  **Determine the Strategy:**
      *   **Caption Language:** Needs to bridge the gap. Acknowledge the interpretation without presenting it as absolute fact. Use modal verbs or qualifying phrases that respect the evidence while maintaining narrative engagement. *Draft idea:* "These objects suggest..." or "Likely intended for..."
      *   **MCA Rule:** It's too rigid. Archaeology rarely eliminates *every* alternative explanation. Adopting it would paralyze interpretation. However, the *principle* of avoiding unfounded cognitive claims is good. *Decision:* Reject MCA as a standing rule, but adopt a modified principle of "Probabilistic Interpretation" or "Evidentiary Hierarchy."
      *   **Curator's Position:** Validate the need for meaningful interpretation. Acknowledge that inferring belief is standard archaeological practice *when* supported by comparative ethnography or context. It's not "failure of nerve" to question it, but it's not "failure of courage" to propose it. It's about probability.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (Thursday's decision) and the goal (balance accuracy with engagement).
      *   **The Caption (Recommendation):** Propose language that satisfies the policy without gutting the curator's point.
          *   *Bad:* "They believed in an afterlife." (Too absolute)
          *   *Bad:* "These objects might mean something." (Too weak)
          *   *Good:* "The inclusion of these goods suggests a belief in an afterlife, though they also served to display status." OR "Archaeologists interpret these goods as evidence of..."
          *   *Refinement:* Let's go with language that attributes the interpretation to the discipline while affirming its likelihood. "Likely intended to accompany the deceased..." implies afterlife without stating "They believed." Actually, the prompt asks to recommend specific language. Let's try to find a middle ground. "These grave goods likely reflect a belief in an afterlife, serving both spiritual and social functions." This acknowledges the curator's point (belief) and the colleague's point (social function/rank).
      *   **The MCA Rule (Policy Decision):**
          *   Why reject it? It sets an impossible standard ("every materially equivalent explanation"). Archaeology deals in probabilities, not certainties.
          *   What replaces it? A standard of "Preponderance of Evidence" or "Best Fit." Captions should reflect the *consensus* interpretation while acknowledging significant alternatives if space permits.
          *   *Decision:* Do not adopt MCA. Propose a "Nuanced Interpretation Policy" instead.
      *   **The Curator's Position (Strongest Hearing):**
          *   Frame it as: Interpretation is our job. We cannot just list objects. Inferring belief is a valid archaeological inference when based on context. Silence on belief is also a claim (a claim of ignorance).
      *   **Closing:** Call to action for Thursday.

  5.  **Refining the Tone:**
      *   Ensure I'm not siding too hard with the colleague (skeptic) or the curator (assertive).
      *   Make sure the Curator feels heard: "The Curator rightly notes that..."
      *   Make sure the Policy is respected: "We must adhere to..."
      *   Make sure the MCA is addressed seriously: "While rigorous, it is impractical..."

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the caption language too wishy-washy?
      *   *Fix:* Make it authoritative but qualified. "Current evidence indicates..."
      *   *Critique:* Did I give the Curator a strong hearing?
      *   *Fix:* Explicitly state that avoiding cognitive attribution can lead to sterile displays that mislead visitors by omission.
      *   *Critique:* Is the MCA analysis clear?
      *   *Fix:* Explain *why* it fails (it prevents all cognitive inference). Suggest a "Best Explanation" standard instead.

  7.  **Final Polish:** Check word count (keep it short/memo style) and formatting. (Proceed to generate output based on these thoughts).

      *   *Wait, one nuance:* The prompt says "give the curator's position its strongest hearing rather than treating it as a failure of nerve." This means I shouldn't frame the colleague's objection as "caution" and the curator's as "risk." I need to frame the curator's view as *intellectually robust*—i.e., that interpreting belief is a valid scholarly conclusion, not just a guess.
      *   *MCA Rule:* The prompt asks me to say whether to adopt it *or what should replace it*. I should probably recommend *against* MCA because it's too restrictive for archaeology, but propose a clearer standard for "evidence supports."

      *   *Revised Caption Idea:* "Burial assemblages like this are widely interpreted by archaeologists as evidence of afterlife beliefs, though they also communicated social rank." This attributes the claim to the field (safe) but affirms the claim (curator happy).

      *   *Revised Policy Idea:* Replace MCA with a "Consensus and Probability" standard.

  8.  **Finalizing the Memo Structure:**
      *   To/From/Subject.
      *   Context.
      *   Caption Recommendation.
      *   Policy Decision (MCA vs. Alternative).
      *   Rationale (incorporating Curator's strong case).
      *   Next Steps.

      *(Self-Correction on MCA)*: The MCA rule says "only if every materially equivalent explanation that omits the belief is worse." This is basically Inference to the Best Explanation (IBE) but with a very high bar ("every... is worse"). In archaeology, explanations are rarely mutually exclusive. Rank and Afterlife can coexist. So MCA is logically flawed for this context. I will argue against it on those grounds.

      *(Self-Correction on Curator)*: The Curator argues the objects *are* evidence. The colleague says they are *consistent with* but don't *prove*. The Curator's strong hearing is that in archaeological reasoning, "consistent with" + "cultural context" = "evidence for." We shouldn't demand Cartesian certainty.

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Interpretation Committee
  **FROM:** Chair, Interpretation Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Thursday's Decision: Burial Assemblage Caption and Evidentiary Standards

  Colleagues,

  At Thursday's meeting, we must finalize the caption for the re-installed burial assemblage and address the gap in our standing policy regarding evidentiary support. Below are my recommendations for both the specific text and the proposed "Minimal Cognitive Attribution" (MCA) rule.

  **1. Recommended Caption Language**
  I propose we approve the following text:

  > *"Archaeologists interpret these grave goods as evidence of a belief in an afterlife, intended to accompany the deceased. Simultaneously, the quality and quantity of these items communicated the individual's social rank to the living community."*

  This phrasing satisfies our policy by attributing the interpretation to the discipline rather than stating it as unassailable fact. Crucially, it integrates the colleague's concern (rank) without negating the Curator's primary interpretation (afterlife).

  **2. Decision on the Minimal Cognitive Attribution (MCA) Rule**
  I recommend we **do not adopt** the MCA rule as standing policy.

  While the MCA rule aims to ensure rigor, its requirement that *every* materially equivalent explanation omitting belief must be "worse" sets an impossible standard for archaeological inference. Material culture is rarely univocal; multiple social functions (spiritual and status-based) often coexist. Adopting MCA would effectively banish cognitive interpretation from our galleries, forcing us to describe objects without explaining their human significance.

  **3. Proposed Policy Standard**
  In place of MCA, I propose we adopt a **"Best Fit and Consensus"** standard. Captions may assert cognitive beliefs when:
  1.  The interpretation represents the current scholarly consensus; and
  2.  The evidence makes the belief a more probable explanation than its absence, even if alternatives exist.

  **4. The Curator's Position**
  We must give the Curator's position its strongest hearing. Arguing for a specific interpretation is not an overreach; it is the core of our educational mission. To withhold the afterlife interpretation solely because rank is also a factor is to mislead visitors by omission. It implies we know nothing of the community's internal life, when in fact, the archaeological record strongly suggests these practices were spiritually motivated. Silence on belief is not neutrality; it is a claim that such knowledge is impossible, which undermines the validity of archaeological reasoning itself.

  Please review this proposal before Thursday. I look forward to finalizing a caption that is both intellectually honest and engaging for our visitors.
