      Colleagues, as we prepare to vote on the application for the outdoor trial of genetically modified poplar, we must confront the ambiguity in our governing statute regarding the precautionary principle. While the law instructs us that full scientific certainty is not a prerequisite for action, it leaves unresolved whether this principle merely permits regulatory intervention amidst uncertainty or whether it actively shifts the burden of proof onto the proponent to demonstrate safety. I contend that for this agency, the precautionary principle must be interpreted as the latter, imposing a burden on the applicant to establish that the proposed activity will not cause significant environmental harm. This reading is necessary because once genetically modified organisms are released into the open environment, retrieval is impossible and any ecological disruption may be irreversible. To treat the principle as merely permissive would be to prioritize economic innovation over environmental integrity, effectively presuming safety until harm is proven, which contradicts the protective purpose of our mandate.

      Applying this standard to the current application, the company's admission that gene flow to wild relatives cannot be quantified with present methods is fatal to their case. Under a burden-shifting interpretation, the inability to quantify a known pathway of potential harm means the burden of proof has not been met. We cannot authorize an outdoor release where the magnitude of genetic contamination is unknowable, regardless of the potential benefits. However, I recognize the strength of the objection that a rigid application of this principle proves too much. Critics argue that refusing this trial carries unquantified risks of its own, specifically that delaying biomass technology perpetuates reliance on coal generation and contributes to climate change, while potentially exporting the research to jurisdictions with weaker oversight. This is a serious moral and practical concern, suggesting that inaction is not a neutral stance but an active choice with environmental consequences.

