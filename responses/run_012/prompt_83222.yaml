  Start by asking her what an ordinary speaker is actually doing when they assert the abominable conjunction in a single breath if the parameters shift mid-sentence. When she inevitably claims the speaker is conflating contexts or questions, press her on whether this amounts to an error theory that labels standard intuitions as mistakes rather than solving them, and ask if her view vindicates knowledge or merely diagnoses a linguistic confusion.

  Next, ask whether this relativization dissolves the absurdity of the conjunction or merely relabels it as a linguistic infelicity. If she insists it dissolves the absurdity, follow up by asking whether the metaphysical absurdity remains even if the sentence is ill-formed, and what work the linguistic fix is actually doing if the underlying tension between knowing hands and not knowing ~BIV persists in the reality of the subject's position.

  Move to the fixing of the relevant alternatives and ask whether they are fixed by the subject's psychology, the attributor's conversational context, or something objective. When she chooses, point out that subject-fixing loses contextualist escapes from skepticism while attributor-fixing makes knowledge too easy, and ask which cost she is prepared to pay given that both options seem to undermine the stability of knowledge attributions.

  Then ask what fixes the method by reference to which the counterfactual is evaluated, given that methods are notoriously slippery and crucial for tracking. If she ties method individuation to the question parameter, press her on whether this makes tracking trivial by tailoring the method to rule out only the live alternatives, effectively guaranteeing sensitivity by definition rather than discovery.

  Transition to necessary truths and ask how sensitivity is assessed for propositions where the proposition cannot fail and the counterfactual looks vacuous. When she appeals to the question parameter to define the relevant possible worlds, ask whether this renders all mathematical knowledge vacuously true or undefined, and how she avoids the dilemma of knowing all necessary truths or none.

  Follow up by asking whether her view implies we know all necessary truths or none, given the vacuity problem. If she claims we know only some, ask what non-arbitrary principle distinguishes the sensitive necessary truths from the insensitive ones without abandoning the tracking framework, and whether this requires smuggling in a reliability condition that does the real work.

  Shift to the personal admission and ask her directly whether she is prepared to say in her own voice that she does not know she is not a brain in a vat. If she admits she does not know, press her on whether this undermines her claim to know she is currently speaking to you, since that knowledge entails she is not a handless brain in a vat being fed the experience of an interview.

  Then ask what this admission does to the rest of what she claims to know given the entailment relations. If she tries to maintain she knows ordinary propositions despite not knowing the denial of skepticism, ask how she avoids the instability of claiming knowledge that rests on unknown foundations, and whether this makes her position practically untenable.

  Move to the normative register and ask if knowledge that is not closed under known entailment can still be what licenses assertion. When she argues that assertion norms are contextual, follow up by asking whether she can assert a proposition whose known entailments she is forbidden from asserting, and whether this violates the norm that one should not assert what one knows implies falsehoods or unknowables.

  Finally, ask whether knowledge can still license the use of a proposition as a premise in practical reasoning if closure fails. If she says yes, press her on how one can practically reason from a premise to a conclusion one is not permitted to act upon, and whether this breaks the link between knowledge and action that makes knowledge valuable in the first place.
