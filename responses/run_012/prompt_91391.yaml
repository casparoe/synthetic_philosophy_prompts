answer: |-
  Here is a 50-minute teaching plan designed to navigate the tension between *On Liberty* and Mill's imperialism without excusing the latter or discarding the former.

  ### 1. The Opening: The Scope Condition (0–10 Minutes)
  **Goal:** Establish that the exclusion of colonized subjects is not an oversight, but a textual feature of *On Liberty*.

  *   **Do this:** Put the first paragraph of Chapter 1 on the board. Specifically, the sentence: *"It is, perhaps, hardly necessary to say that this doctrine is meant to apply only to human beings in the maturity of their faculties... Those backward states of society in which the race itself may be considered as in its nonage, are excepted from the application."*
  *   **Say this:** "Before we judge Mill, we have to read his terms of service. The Harm Principle is not universal in Mill's text. It has a 'Civilization Threshold.' Liberty is not a natural right here; it is a functional tool for 'progress' available only to those capable of 'improvement by free discussion.'"
  *   **Head off Misconception #2 ("So the Harm Principle is universal and he contradicted himself"):**
      *   **Where:** Right here, at the start.
      *   **How:** Explicitly state: "If you think this is a contradiction between *On Liberty* and his India work, stop. He built the exemption into the foundation of *On Liberty*. The theoretical challenge isn't inconsistency; it's the *criteria* for the exemption."

  ### 2. The Concrete Case: Press Censorship in India (10–25 Minutes)
  **Goal:** Move from abstract scope to concrete application using a case that mirrors *On Liberty*'s core concern (speech).

  *   **The Case:** **Mill's Dispatches on Indian Press Censorship (1850s).**
      *   **What it must have:** It must show Mill applying the *logic* of the Harm Principle (preventing harm to others) to justify the *denial* of liberty (free speech) to a specific population. Mill argued that while a free press prevents tyranny in England, in India it would incite racial hatred and sedition, causing tangible harm to the stability required for improvement.
      *   **Why the Bridge/Corn Dealer won't do it:** The "Bridge" and "Corn Dealer" examples assume a background condition of **political equality** and **shared rationality**. They are domestic policing problems within a "civilized" society. Using them implies the colonial context is the same as the domestic one, which obscures Mill's actual argument that the *preconditions* for liberty were missing in India.
  *   **Discussion:** Ask students: "If the goal of liberty is improvement, and the press in India causes racial violence (harm), does censoring it fit the Harm Principle?"
  *   **Head off Misconception #1 ("Hypocrite, case closed"):**
      *   **Where:** During the case analysis, when students react morally.
      *   **How:** Acknowledge the moral failure, but pivot to theoretical consistency. "Calling him a hypocrite assumes he claimed universality. He didn't. The harder question is: Is his logic *coherent*? He argues that despotism is legitimate *if* the end is improvement. Do we accept that trade-off?"
  *   **Head off Misconception #3 ("He must have been against the empire"):**
      *   **Where:** As soon as students try to salvage Mill's reputation.
      *   **How:** Remind them Mill was the Chief Examiner at the India Office and wrote defenses of the East India Company *after* the 1857 Rebellion. He didn't want the Company out; he wanted it to be a better "tutelary" authority. He wasn't a closet anti-imperialist; he was a theorist of "benevolent despotism."

  ### 3. The Theoretical Fork: Despotism as a Tool (25–40 Minutes)
  **Goal:** Force students to grapple with the "Tutelary" argument rather than dismissing it historically.

  *   **The Argument:** Mill views British rule not as permanent domination, but as a "school of governance." The despotism is meant to be **self-liquidating**. Once the "pupils" (Indians) learn the habits of civilization, the despotism ends, and *On Liberty* kicks in.
  *   **Head off Misconception #4 ("Man of his time, move on"):**
      *   **Where:** As students try to close the file with historical context.
      *   **How:** Connect it to the present. "This logic isn't dead. We see it whenever powerful nations say, 'We will intervene in your sovereignty to build democracy/human rights, and you get freedom when you meet our standards.' If you dismiss Mill as just 'Victorian,' you miss how this logic of conditional liberty still operates in international relations today."

  ### 4. The Closing Diagnostic (40–50 Minutes)
  **Goal:** Test if they understand the structural implication of Mill's theory.

  *   **The Fork:** Is the colonial carve-out a **limit** on the principle (an unfortunate exception) or an **implication** of it (liberty *requires* this hierarchy)?
  *   **The Question:**
      > "If the capacity for liberty must be taught by despotism, **who holds the power to decide when the lesson is over?**"
  *   **Why this works:**
      *   If they answer "The colonized people," they haven't understood Mill (he denies they have that capacity initially).
      *   If they answer "The colonizer," they see the trap: The teacher never has an incentive to let the student graduate.
      *   This shows whether they see the *structural* flaw in the theory (the self-liquidating despotism rarely liquidates) rather than just feeling moral anger.

  ### 5. What to Cut
  To make this fit in 50 minutes, you must ruthlessly cut the following:
  *   **Biography:** Do not discuss Harriet Taylor, Mill's breakdown, or his personal life. It distracts from the structural argument.
  *   **Domestic Harm Principle Exegesis:** Do not re-explain the Bridge or Corn Dealer cases. Assume they read them. Use class time only to explain why those cases *don't* apply to the colonial context.
  *   **Comparative Imperialism:** Do not bring in Burke, Macaulay, or Marx. Keep it immanent to Mill's text. This is about Mill's internal logic, not a history of the Raj.
  *   **The "Good" Mill:** Do not spend time balancing the scales with his support for women's suffrage or labor unions. Acknowledge it, but don't let it dilute the specific tension of Empire.

  ### Summary of Misconception Management
  1.  **"Contradiction"**: Head off at **Minute 0** (The Scope Condition).
  2.  **"Hypocrite"**: Head off at **Minute 15** (The Press Case/Consistency).
  3.  **"Anti-Empire"**: Head off at **Minute 20** (EIC Defense).
  4.  **"Man of his Time"**: Head off at **Minute 35** (Modern Paternalism).
