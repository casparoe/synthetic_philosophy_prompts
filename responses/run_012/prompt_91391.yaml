prompt: |-
  I'm TAing a politcal theory section and last week a student whose family is from Kerala asked me why we're reading On Liberty when the guy who wrote it spent his whole working life at the East India Company and defended British rule in India. I said something like "he was a man of his time" and even I could hear how weak it was. Now I've got fifty minutes to do Mill and empire properly, and I want a teaching plan, not the argument itself.

  What has to come first: I'm fairly sure it's the idea that the harm principle is stated with a scope condition attached. The book opens by saying its subject is "the nature and limits of the power which can be legitimately exercised by society over the individual", and there's the part about the principle not applying to anyone not yet capable of being improved by free discussion. So the sequence has to get them to the point were the colonial exemption looks like it might be internal to the principle rather than a lapse. Then tell me the one concrete case to carry the whole thing on -- something from Mill's India writing or from the Indian side of the relationship, your pick -- what that case has to have, and why the obvious candidates (the bridge, the corn dealer) won't do it. Then the misconceptions in the order they'll actually arrive, and exactly where in the sequence I head each one off: I'm expecting "hypocrite, case closed", "so the harm principle is universal and he contradicted himself", "he must have been against the empire", and "man of his time, move on". I want to end on the fork I actually want them to feel -- is the carve-out a limit on the principle or an implication of it, and was the despotism meant to be temporary and self-liquidating -- so give me one question to ask at the end that shows whether they got the fork or just got angry. And say what I should cut at this level. No reading list, I know the texts.
