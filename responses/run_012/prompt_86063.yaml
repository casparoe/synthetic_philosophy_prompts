answer: |-
  ### The "Who Decided?" Decision Tree

  **Instructions for the Group:**
  We are starting from the standard finding: brain activity (the readiness potential) ramps up roughly 300ms before you report being aware of your decision to move. Follow the questions below. Answer based on what you think the data *means*, not on which philosophical label you prefer. Jargon appears only at the end.

  ---

  #### **Node 1: The Signal**
  **Question:** Does the early brain signal represent a real, specific preparation for *this* movement, or is it an artefact created by averaging noisy trials?
  *   **It's an artefact/noise.** → Go to **Node 2**.
  *   **It's a real preparation.** → Go to **Node 3**.

  #### **Node 2: The Artefact Branch**
  **Question:** If the signal is just noise or averaging, is the experiment useless, or does it still tell us something about how we *feel* about decisions?
  *   **It's useless/misleading.** → **Leaf A**
  *   **It's still interesting (shows how we narrate).** → **Leaf B**

  #### **Node 3: The Nature of the Signal**
  **Question:** Is the early signal a finalized *decision* to move, or just a build-up of *urge/bias* that hasn't been decided yet?
  *   **Just an urge/bias.** → **Leaf C**
  *   **A finalized decision.** → Go to **Node 4**.

  #### **Node 4: The Veto**
  **Question:** Even if the start is unconscious, do you have the conscious power to *stop* (veto) the action before it happens?
  *   **Yes, I can stop it.** → **Leaf D**
  *   **No, once it starts, it goes.** → Go to **Node 5**.

  #### **Node 5: The Agent**
  **Question:** If the decision is unconscious and unstoppable, is that brain process still *you*, or is "you" only the conscious part?
  *   **Only the conscious part is me.** → Go to **Node 6**.
  *   **My whole brain (including unconscious bits) is me.** → Go to **Node 7**.

  #### **Node 6: The Conscious Role**
  **Question:** If "you" are only the conscious part, and you didn't start the action, is your feeling of willing a real cause or just a story you tell yourself?
  *   **Just a story/construction.** → **Leaf E**
  *   **A real cause that is missing (so freedom is gone).** → **Leaf F**

  #### **Node 7: The Timescale**
  **Question:** If the unconscious brain is "you," should we judge freedom by this specific split-second moment, or by the long-term habits/character that built that brain?
  *   **By this specific moment.** → **Leaf F**
  *   **By the long-term habits/character.** → **Leaf G**

  ---

  ### The Leaves (Positions)

  **Leaf A: The Artefact Deflationist**
  *   **Label:** Artefact Deflationist (e.g., Trevena & Miller)
  *   **Awkward Commitment:** You have to argue that decades of EEG averaging techniques are fundamentally manufacturing a signal that doesn't exist in single trials.

  **Leaf B: The Narrative Constructivist**
  *   **Label:** Narrative Constructivist (e.g., Dennett on user-illusions)
  *   **Awkward Commitment:** You must accept the data is technically bogus but maintain it's still useful for explaining why humans *feel* like they have free will.

  **Leaf C: The Urge/Bias Theorist**
  *   **Label:** Urge/Bias Theorist (e.g., Aaron Schurger)
  *   **Awkward Commitment:** You have to claim the brain is just randomly fluctuating toward a threshold, and "deciding" is just when the noise happens to tip over.

  **Leaf D: The Veto/'Free Won't' View**
  *   **Label:** The Veto View (e.g., Libet's later view)
  *   **Awkward Commitment:** You must locate a mysterious conscious power that can stop a physical chain of events already in motion without explaining how that doesn't violate physics itself.

  **Leaf E: The Epiphenomenalist about Conscious Will**
  *   **Label:** Epiphenomenalist about Conscious Will (e.g., Daniel Wegner)
  *   **Awkward Commitment:** You have to accept that your conscious experience of choosing is a complete illusion that has zero effect on the physical world.

  **Leaf F: The Hard Incompatibilist**
  *   **Label:** Hard Incompatibilist (e.g., Derk Pereboom / Galen Strawson)
  *   **Awkward Commitment:** You must conclude that moral responsibility is impossible regardless of whether the signal is real, artefact, or vetoable, because ultimate self-creation is impossible.
      *(Note: This leaf is reached via two different paths, Node 6 and Node 7.)*

  **Leaf G: The Compatibilist (Standing Policy)**
  *   **Label:** Compatibilist / Reasons-Responsive (e.g., Daniel Dennett / Alfred Mele)
  *   **Awkward Commitment:** You have to argue that "freedom" doesn't mean "could have done otherwise in this exact millisecond," but rather "acted according to your own trained character."

  ---

  ### Analysis for the Session Leader

  **1. Leaves the tree fails to separate:**
  *   **The Two Hard Incompatibilist Leaves (Leaf F):** The tree routes people to the same label from two different directions (Node 6: "Conscious self is me but powerless" vs. Node 7: "Whole self is me but determined by the moment"). In practice, these positions look identical in outcome (no free will), even if their metaphysical reasoning differs. You should point out to the group that arriving here from Node 6 makes you a *Skeptic about Agency*, while arriving from Node 7 makes you a *Skeptic about Indeterminism*, but the practical result is the same.

  **2. Combinations of answers nobody seems to hold:**
  *   **Artefact + Veto (Node 1 "Artefact" → Node 4 "Veto"):** This path is structurally impossible in the tree, but conceptually, nobody argues "The signal is fake noise, *therefore* I have a conscious veto." Usually, if the signal is fake, the need for a veto disappears because the unconscious decision didn't happen.
  *   **Urge + Compatibilist Policy (Node 3 "Urge" → Node 7 "Habits"):** This is an unexplored combo. One could argue "The brain accumulates urges based on my past habits, so I am responsible for the urge." Most people who take the Urge view (Schurger) use it to deflate free will, not save it. It's an attractive but unoccupied niche.
  *   **Conscious Self + Long-Term Habits (Node 5 "Conscious Only" → Node 7 "Habits"):** This is incoherent. If "you" are *only* the conscious narrator, you cannot claim credit for unconscious habit-formation that happened in the past. You can't have it both ways: either the unconscious habits are "you" (Node 5 Yes), or they aren't (Node 5 No).

  **3. Jargon Check:**
  *   The nodes use plain English ("story you tell yourself," "build-up of urge").
  *   The jargon is confined to the Leaves, allowing you to introduce the terms *after* the students have committed to a stance. This prevents them from answering based on which label they like.

  **4. The "Three Claims" Distinction:**
  *   **Late Intention:** Addressed at Node 3 (Decision vs. Urge).
  *   **Non-Causal Intention:** Addressed at Node 6 (Story vs. Cause).
  *   **Not Decided By Me:** Addressed at Node 5 (Conscious Self vs. Whole Brain).
  *   This ensures students don't conflate "I didn't feel it yet" with "I didn't do it."
