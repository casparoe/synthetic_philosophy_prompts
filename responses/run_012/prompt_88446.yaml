      *   *Counter-claim:* "Linear probes can fit noise/random states if complex enough or if the data has structure." (Actually, the specific claim about *randomly initialized* nets usually refers to the fact that random projections can preserve distances, or that with enough parameters, a probe can overfit. But the stronger critique is that *any* high-dimensional space contains linearly separable subspaces for many tasks by chance, especially if the probe is too expressive).
      *   *Nuance:* A *linear* probe on a *random* network usually *fails* on complex structured tasks compared to a trained network. However, the critique holds that decodability is necessary but not sufficient.
