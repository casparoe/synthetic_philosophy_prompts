  I'm building a case for a grad seminar on collective intentionality and I need one scenario that does a very specific job: make Bratman's shared-intention account and Searle's we-intention account both say "yeah, that's a joint action," while Gilbert's plural-subject account says "no, that's not a genuine joint action" — and the only thing seperating the verdicts has to be whether there's a joint commitment, with the agents' behavior, beliefs, and intentions held completely fixed. Make it a realistic, everyday situation (roommates, coworkers, strangers on a train — not a philosopher's toy), keep the setup to one paragraph, and make sure there's genuinely no commitment in there: no promise, no deal, and neither person has any claim against the other or would feel she'd broken faith by just walking off. After the case, walk through what each of the three accounts says and why, tell me which feature of the case is actually doing the work, what happens if you take that feature away, and then give me the strongest case a Gilbert defender could make that the scenario still involves a plural subject after all. Don't make the commitment-free version feel cold or robotic, by the way — I want it to read like ordinary cooperation, thats the whole point.
