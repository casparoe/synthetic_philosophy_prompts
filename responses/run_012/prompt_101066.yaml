answer: |-
  Every morning after a heavy snowfall, Elias and Mara, who live in adjacent units of a duplex, emerge within minutes of each other to clear the shared walkway. Without speaking or pausing to negotiate, they fall into a comfortable rhythm: Elias takes the left side and Mara the right, their shovels scraping in time as they exchange brief smiles and comments on the cold. Neither has ever asked the other to help, nor has either promised to return tomorrow; if Elias were to finish his side and immediately go inside while Mara was still working, she might feel disappointed but would never think he had wronged her or broken a promise, and he would feel no guilt for leaving, viewing his help simply as a friendly gesture he was free to stop at any moment.

  ***

  ### Theoretical Verdicts

  **Michael Bratman (Shared Intention):** Bratman says **Yes**. For Bratman, joint action requires that each agent intends that *we* act, and that these intentions are interlocking and mutually known. Elias intends that they clear the walk, Mara intends that they clear the walk, and they coordinate their sub-plans (left vs. right) based on this mutual knowledge. The fact that they are responsive to each other's actions and mesh their plans satisfies the psychological criteria for shared intention, even without a formal agreement.

  **John Searle (We-Intention):** Searle says **Yes**. Searle locates joint action in the primitive psychological state of the individual: the "we-intention." As long as Elias has a "We are shoveling" intention in his head, and Mara has one in hers, accompanied by mutual belief that the other shares this intention, the joint action exists. The internal psychological mode is sufficient; no external normative bond is required to constitute the action itself.

  **Margaret Gilbert (Plural Subject):** Gilbert says **No**. For Gilbert, joint action requires the formation of a *plural subject* via a **joint commitment**. This commitment creates normative obligations: each party acquires a right to demand performance from the other and a duty to fulfill the action. Since the scenario explicitly stipulates that neither feels wronged if the other leaves and neither has a claim against the other, the essential normative glue is missing. Without the joint commitment, they are merely two individuals acting in parallel, not one plural subject acting together.

  ### The Feature Doing the Work

  The pivot point is the **absence of normative entitlements and obligations**.

  In the scenario, the agents have the *psychology* of cooperation (intentions, beliefs, responsiveness) but lack the *normativity* of partnership (claims, duties, guilt). Bratman and Searle prioritize the psychological structure; as long as the intentions interlock or are "we-directed," the joint action is real. Gilbert prioritizes the normative structure; for her, the "jointness" is not in the head, but in the social bond created by commitment. If you were to **add** a feature where Elias felt he *owed* it to Mara to finish, or Mara felt *entitled* to complain if he left, Gilbert would switch her verdict to "Yes." If you were to **remove** the interlocking intentions (e.g., Elias thinks he's just clearing his own side regardless of Mara), Bratman and Searle would switch to "No."

  ### The Strongest Gilbertian Counter-Argument

  A defender of Gilbert could argue that **joint commitment can be implicit in the behavior itself.** They would claim that the "comfortable rhythm," the "smiles," and the coordinated division of labor (left vs. right) *constitute* a non-verbal expression of readiness to be jointly committed. By engaging in such tight coordination without negotiating, Elias and Mara are effectively signaling, "I am ready to be bound with you in this," and the acceptance is signaled by the other's continued participation. The "disappointment" Mara feels if Elias leaves is not just a sad emotion, Gilbert might argue, but the phenomenological shadow of a normative expectation—a sign that a plural subject was formed, even if the agents themselves lack the philosophical vocabulary to recognize the obligation they incurred.
