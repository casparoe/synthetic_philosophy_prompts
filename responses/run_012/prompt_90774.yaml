answer: |-
  This is an excellent pivot. The Newton-to-Einstein transition is the canonical "intuition pump" for verisimilitude, but as you've sensed, it is often treated too gently in the literature. To use it as a stress test for the machinery itself, we need to be precise about what is being measured, against what standard, and whether the formal tools can actually register the difference without cheating.

  Here is the mapping of the episode through the concept of verisimilitude, followed by an assessment of the concept's viability.

  ### 1. The Target: What is "The Truth" ($T$)?

  To measure verisimilitude ($Vs$), we need a target. In a seminar on scientific realism, $T$ is the complete, true description of the world (or the relevant sector of it).

  *   **The Problem:** In the Newton-Einstein case, we rarely treat $T$ as the "actual world" directly. We usually treat General Relativity (GR) as the proxy for $T$ when comparing it to Newtonian Mechanics (NM). But as you noted, if we are strict realists, GR is likely false too (due to singularities and incompatibility with quantum mechanics).
  *   **The Implication:** If both NM and GR are false, we are trying to measure the distance of two false theories from a third, unknown Truth ($T_{ultimate}$).
  *   **The Mapping:**
      *   $T_{ultimate}$: The correct quantum theory of gravity (unknown).
      *   $N$: Newtonian Gravitation (False).
      *   $E$: General Relativity (False, but presumably $Vs(E) > Vs(N)$).

  If we cannot define $T_{ultimate}$, we cannot calculate $Vs$ directly. We are forced to infer $Vs$ from the relationship between $N$ and $E$. This leads to the first major hurdle: **Are we measuring distance from Truth, or distance from each other?** Most formal accounts require knowledge of $T$ to count "true consequences." If we don't have $T$, we are relying on the *assumption* that $E$ is closer to $T$ to prove that $E$ is closer to $T$. This is circular.

  ### 2. The Limiting Case and Ontological Distance

  You asked if the correspondence relation (Newton as a limit of Einstein) establishes verisimilitude.

  *   **The Mathematical Relation:** It is true that the Einstein field equations reduce to the Poisson equation for Newtonian gravity in the limit of weak fields and low velocities ($c \to \infty$).
  *   **The Verisimilitude Claim:** Proponents argue this shows $N$ captures a "chunk" of the truth that $E$ captures plus more. Therefore, $E$ has greater truth-content.
  *   **The Ontological Objection:** Verisimilitude is supposed to be about *truth*, not just *prediction*.
      *   $N$ posits: Absolute space, absolute time, gravity as a force vector acting instantaneously at a distance.
      *   $E$ posits: A 4D pseudo-Riemannian manifold, gravity as curvature, no instantaneous action.
      *   **The Conflict:** These are contradictory ontologies. $N$ says spacetime is flat; $E$ says it is curved. They cannot both be "approximately true" about the *nature* of spacetime in a simple additive way.
  *   **Assessment:** The limiting case relation establishes **empirical continuity**, not necessarily **ontological verisimilitude**. If verisimilitude is merely about predictive accuracy in specific domains, it collapses into empirical adequacy (van Fraassen's territory). If it is about the nature of reality, the Newton-Einstein case is tricky because the mathematical mapping masks an ontological rupture. A robust definition of $Vs$ must explain how a theory with a false ontology (Newton's force) can be "close" to a theory with a different ontology (Einstein's geometry). Structural Realists (like Worrall) argue the *mathematical structure* is preserved, which saves verisimilitude. But standard verisimilitude accounts focus on propositional content, where $N$ and $E$ contradict.

  ### 3. The Formal Collapse (Tichý and Oddie, 1974)

  This is the wall you hit. Popper's original qualitative definition (1963) stated that Theory $A$ is closer to the truth than $B$ if $A$ has more true consequences and no more false consequences (or fewer false and no less true).

  *   **The Tichý/Oddie Proof:** They demonstrated that for any two false theories in a propositional calculus, Popper's definition fails.
      *   If $A$ and $B$ are both false, they both entail at least one false statement.
      *   It turns out that under Popper's logic, you cannot compare them unless one is a subset of the other in a very specific way.
      *   Worse, the ranking is **language-dependent**. If you change the primitives of your language (e.g., defining "rainy" vs. "not rainy" vs. "windy"), the verisimilitude ordering can flip.
  *   **Application to Newton/Einstein:**
      *   Since both $N$ and $E$ are false (strictly), Popper's original metric cannot rank them. It yields incomparability.
      *   To rank them, you effectively need to know the Truth already to count the "true consequences." If we assume $E$'s predictions are the "true" ones against which we measure $N$, we are begging the question.
      *   **The Consequence:** The machinery does *not* deliver on its promise in this case without significant modification. The original Popperian apparatus is useless here.

  ### 4. Viability: What is Doing the Explanatory Labor?

  Given the formal trouble, what is actually justifying the claim that Einstein is "closer to the truth"?

  1.  **Approximate Truth (Niiniluoto):** Ilkka Niiniluoto proposed a "min-sum" measure, defining distance in a state space. If we view physical laws as points in a space of possible functions, $E$ is metrically closer to $T$ than $N$ is.
      *   *Verdict:* This works for numerical parameters (e.g., the precession of Mercury), but struggles with the ontological shift (force vs. geometry). It saves verisimilitude by turning it into a topological problem, but it assumes we can define a metric on "theory space" that isn't language-dependent.
  2.  **Empirical Progress (Laudan):** Larry Laudan argued we should drop verisimilitude entirely. We observe that $E$ solves more problems than $N$. We don't need to say $E$ is "truer," only that it is more empirically successful.
      *   *Verdict:* This avoids the metaphysical swamp but abandons the Realist's goal. Realists want to say science *converges*, not just that it *works*.
  3.  **Unification/Explanatory Power:** Perhaps $E$ is preferred because it unifies gravity with inertia and special relativity.
      *   *Verdict:* This is a pragmatic virtue, not a truth-conducive one (necessarily).

  **My Assessment:** The Newton-Einstein case suggests that the intuitive notion of verisimilitude is doing work that the formalization cannot yet capture *without* smuggling in empirical success. The intuition that $E$ is "closer" relies heavily on the fact that $E$ saves the phenomena $N$ saves, *plus* the anomalies $N$ fails. This looks suspiciously like empirical adequacy wearing a metaphysical mask. However, if we accept **Structural Realism**, the case supports verisimilitude: the structural relations (the equations) are preserved in the limit, even if the ontology (force vs. curvature) changes. This suggests verisimilitude applies to *structure*, not *objects*.

  ### 5. Success Criteria: What Would Move the Needle?

  For verisimilitude to earn its keep in this seminar, a satisfactory definition must satisfy four conditions in the Newton-Einstein case:

  1.  **False-to-False Comparability:** It must rank two known false theories without requiring knowledge of the Ultimate Truth (avoiding circularity).
  2.  **Language Invariance:** The ranking of $E > N$ must hold regardless of whether we describe the physics in terms of "curvature" or "potential fields."
  3.  **Ontological Sensitivity:** It must account for the fact that $N$ and $E$ make contradictory claims about what gravity *is*, not just how it calculates. A theory that gets the numbers right but the ontology wrong should have lower $Vs$ than one that gets both right (even if we don't have the latter yet).
  4.  **Non-Triviality:** It must not simply reduce to "counts more true predictions." It needs to weigh *important* truths (fundamental laws) higher than *trivial* truths (specific planetary positions).

  If a definition meets these, it validates the Realist's claim that science converges on reality, not just utility.

  ### 6. The Harder Test: Phlogiston to Oxygen

  You asked for a competing episode. The **Phlogiston-to-Oxygen** transition (Lavoisier) is a **harder and fairer test** of verisimilitude than Newton-to-Einstein.

  *   **Why Newton-Einstein is "Too Easy":** There is a mathematical correspondence (limiting case). You can argue $N$ is a "special case" of $E$. This allows formalisms to cheat by measuring distance along a continuous mathematical curve.
  *   **Why Phlogiston-Oxygen is Harder:**
      *   **Ontological Discontinuity:** Phlogiston was often described as having *negative weight* or being a substance released during combustion. Oxygen is a substance with positive weight absorbed during combustion. There is no limiting case where Phlogiston turns into Oxygen. The direction of the causal process is reversed.
      *   **No Mathematical Continuity:** You cannot derive Lavoisier's equations from Stahl's by adjusting a parameter to zero.
      *   **The Verisimilitude Challenge:** If verisimilitude is real, we should be able to say Lavoisier's theory is closer to the truth than Stahl's, *despite* the total ontological rupture.
      *   **The Structural Hope:** A Structural Realist would argue that the *quantitative relations* of mass conservation in chemical combination were preserved, even if the agent (phlogiston/oxygen) was misidentified. If verisimilitude can be defined over these structural relations despite the ontological error, it survives. If it requires ontological continuity, it fails here.

  ### Conclusion for the Seminar

  The Newton-Einstein case confirms that we need a better formal definition, but it also reveals that the "intuitive notion" is likely a composite of **empirical progress** and **structural continuity**.

  If I were arguing this in your seminar, I would contend:
  1.  Popper's original definition is dead (Tichý/Oddie).
  2.  Modern quantitative definitions (Niiniluoto) work for the Newton-Einstein case *only if* we treat theories as points in a parameter space, which ignores the ontological clash.
  3.  Therefore, the Newton-Einstein case actually **undermines** standard verisimilitude because it tempts us to confuse mathematical approximation with truthlikeness.
  4.  The concept only survives if we shift to **Structural Verisimilitude** (preservation of relations despite ontological error).
  5.  To prove this, we must move to the **Phlogiston case**. If verisimilitude cannot explain why Lavoisier was closer to the truth than Stahl without a mathematical limiting case, then verisimilitude is likely just a shadow cast by empirical success, and the Realist should retreat to structural realism or abandon the term.

  The machinery doesn't deliver on the promise *yet*, but the failure points tell us exactly where the philosophy needs to go: away from propositional content and toward structural preservation.
