  **Memorandum on the Ellery Precedents**

  **To:** The Columnist
  **From:** Puzzle Desk Analyst
  **Subject:** Prediction of Verdict on the Gemstone Submission

  Based on the five rulings provided, Marion Ellery's adjudication rests on a tension between two competing definitions of an "idea". To predict her verdict on the new hidden-word clue for a gemstone, we must first isolate the variables she has consistently weighted.

  ### The Candidate Rules

  There are two coherent principles that fit the existing data, though they diverge on the current case.

  **Rule 1: The Specificity Principle (Answer-Bound)**
  *   **The Logic:** A "dupe" occurs only when the *specific solution* has previously been clued using the *same mechanism* and *same definition category*. The "idea" sold to the solver is the specific association between that word and that method of derivation.
  *   **Fit with Rulings:** This explains Rulings 1, 2, and 5 perfectly. In Ruling 5, Ellery explicitly states the desk had "sold that trick *for that word*," implying the word is the limiting factor. It also accommodates Rulings 3 and 4, where different answers automatically negate dupe status regardless of surface or machinery.
  *   **Prediction for Gemstone Clue:** **Not a Dupe.** The answer has never appeared in the paper; therefore, the specific trick has not been sold for this word.

  **Rule 2: The Archetype Principle (Structure-Bound)**
  *   **The Logic:** A "dupe" occurs when the *logical structure* (Mechanism + Definition Category) has been used, regardless of the solution. The "idea" sold is the cognitive task itself (e.g., "find a mineral hidden in the text").
  *   **Fit with Rulings:** This fits Rulings 1 and 5 (same structure repeated). It fits Ruling 3 (Hidden/River vs. Hidden/Cheese) on the grounds that "River" and "Cheese" are distinct definition categories, so the archetype differed. It struggles slightly with Ruling 2, but can argue that changing the mechanism changes the archetype entirely.
  *   **Prediction for Gemstone Clue:** **Dupe.** The paper has already sold the "Hidden Word + Mineral" archetype with *LODESTONE*. A gemstone is a subset of minerals; the solver is being asked to perform the identical logical operation on a semantically adjacent field.

  ### The Verdict and The Bet

  I would bet heavily on **Rule 1 (The Specificity Principle)**. Ellery will rule that the submission is **Not a Dupe**.

  **Why:**
  The phrasing in Ruling 5 is the smoking gun. When justifying a dupe verdict despite a "thoroughly rewritten surface" and a "different sense of the word," Ellery did not say, "We have already used Hidden Mineral clues." She said, "the desk had already sold that trick *for that word*." This qualifier binds the prohibition to the solution.

  Furthermore, Ruling 3 establishes that resemblance "confined to the machinery" is permissible if the answers differ. While the new case adds a similar definition category (Mineral) to the similar machinery (Hidden Word), the change in answer remains the most significant variable in Ellery's history. To rule this a dupe would require her to overturn the implication of Ruling 3, elevating the definition category to a status equal to the answer itself. Given the desk is currently arguing, the structuralists (Rule 2) are making noise, but Ellery's own precedents favour the Specificity Principle.

  ### The Deciding Case

  While the gemstone ruling will lean towards Rule 1, the two principles remain close enough to warrant a future test. The best case to distinguish them definitively would be:

  **A hidden-word clue for *LODESTONE*, defining it as a "Magnet" rather than a "Mineral".**

  *   **Rule 1 (Specificity) predicts: Dupe.** The answer (*LODESTONE*) and the mechanism (Hidden) are identical. The specific word has already been exhausted via the hidden-word mechanism; the definition nuance is secondary (as seen in Ruling 5, where different senses of "Mineral" did not save the clue).
  *   **Rule 2 (Archetype) predicts: Not a Dupe.** The structural archetype has shifted from "Hidden + Mineral" to "Hidden + Magnet/Function". If the "idea" sold is the logical category, this is a fresh task for the solver, even if the word is familiar.

  This case isolates the variable of the *Answer* against the variable of the *Definition Category*. If Ellery rules it a dupe, she confirms the Answer is the primary commodity. If she passes it, she confirms the Definition Category is the primary boundary.

  ### Principles at Stake

  If the five rulings genuinely underdetermine the gemstone clue—as the desk's argument suggests—then Ellery is standing at a crossroads regarding the paper's philosophy.

  **On the Reading of Rule 1 (Not a Dupe):**
  *   **Commitment:** The desk commits to the view that the *solution* is the primary unit of value. It prioritises the constructor's freedom to utilise effective mechanical templates on fresh vocabulary.
  *   **Sacrifice:** It risks solver fatigue. A veteran solver may feel bored encountering yet another "Hidden Mineral" clue, even if the mineral is new. The paper sells the *experience* of solving, and identical experiences may devalue the product regardless of the answer.

  **On the Reading of Rule 2 (Dupe):**
  *   **Commitment:** The desk commits to the view that the *logical operation* is the primary unit of value. It prioritises the solver's experience of novelty, ensuring the cognitive "flavour" of the puzzle remains varied.
  *   **Sacrifice:** It severely restricts the constructor's palette. "Hidden Word" and "Anagram" are finite mechanisms; if pairing them with broad categories (like "Mineral" or "River") burns them out, constructors will struggle to fill grids without resorting to obscure obscurities. It privileges the solver's comfort over the setter's toolkit.

  Given Ellery's eleven years of tenure and her specific phrasing in Ruling 5, I suspect she values the longevity of the setter's relationship with the grid over the marginal novelty of the solver's task. She will pass the gemstone.

