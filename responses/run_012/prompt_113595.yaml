answer: |-
  This is a profound and precise diagnostic of the tension at the heart of contract law. You have identified what legal theorists from Lon Fuller to Patrick Atiyah to Charles Fried have wrestled with: the disjunction between the *formation* of contractual obligation (which looks economic or reliance-based) and the *remedy* for breach (which looks will-based or rights-based).

  To reconstruct the implicit philosophy of this institution, we must treat the common law not as a failed attempt at moral philosophy, but as a successful attempt at **social engineering with a specific normative ontology.** The law does not presuppose a single, unified moral theory of promising. Rather, it presupposes a theory of **Institutional Conventionalism.**

  Here is the reconstruction of that theory, analyzed through the doctrinal clusters you identified.

  ### 1. The Theory of the Consideration Requirement: Channelling, not Denial

  You ask whether the consideration requirement commits the law to the view that bare promises generate no obligation, or whether it is merely evidentiary.

  **The Evidentiary/Channelling Reading (The Rescue):**
  If we interpret consideration substantively (i.e., "a promise creates no duty unless bought"), the law indeed adopts a cynical theory of obligation that no moral philosopher would endorse. However, the dominant jurisprudential defense (articulated by Lon Fuller) is that consideration serves a **channelling function**.

  On this reading, the law *does not* deny that bare promises bind morally. Instead, it asserts that the *legal institution* of contract is a specific technology distinct from the moral practice of promising. The consideration requirement is a formalism designed to distinguish serious, market-oriented transactions from social, domestic, or gratuitous undertakings.
  *   **What it rules out:** It rules out the **Pure Will Theory** (Fried/Kant) as a sufficient condition for *legal* enforcement. The law says, "Your will is not enough to invoke the state's coercive power; you must perform a specific ritual (exchange) to signal entry into this legal regime."
  *   **What it sits comfortably with:** It sits comfortably with **Convention/Practice Theory**. Just as a move in chess only binds you to the rules of chess if you are playing a game of chess (not just moving wood), a promise only binds you to *contract law* if you have entered the "game" of contract via consideration.

  **Does this rescue the law?**
  Yes, from the charge of moral error, but not from the charge of theoretical hybridity. It admits that the law is not enforcing *promises* per se, but *transactions*. The obligation does not stem from the speech act of promising, but from the act of entering a recognized economic institution.

  ### 2. The Expectation Measure: The "Private Law" Conception

  You note the tension: if consideration says "no obligation without exchange," why do damages reflect the value of the *promise* (expectation) rather than the value of the *exchange* or the *reliance*?

  If the ground of obligation were purely **Reliance** (Atiyah), damages should be limited to out-of-pocket loss. If the ground were purely **Will** (Fried), consideration shouldn't be required at all.

  The expectation measure presupposes that once the "entry fee" (consideration) is paid, the promisee acquires a **proprietary interest in the promisor's future performance.**
  *   **The Implicit Theory:** This is a **Bargain Theory of Rights**. By exchanging consideration, the promisee has *purchased* the promisor's future agency regarding that act. The promisor has alienated a slice of their future autonomy to the promisee.
  *   **Consistency Check:** Is this consistent with Consideration? Yes, if we view Consideration as the *mechanism of transfer*. Consideration proves that the right to performance was sold, not just given. Once sold, it belongs to the promisee. Breach is therefore a violation of the promisee's property right in the performance, warranting expectation damages (the value of the property).
  *   **Inconsistency:** It is inconsistent with a pure Reliance theory. The law explicitly rejects the idea that it is merely compensating for harm suffered; it is enforcing the entitlement to the gain.

  ### 3. The Objective Theory: The Rejection of Subjective Will

  The law's refusal to look behind outward manifestations ("I thought I was joking," "I meant X but said Y") is a decisive rejection of the **Subjective Will Theory**.

  *   **The Implicit Theory:** This presupposes a **Communicative/Conventional Theory** of obligation. Obligation arises not from what you *meant*, but from the normative expectations you created in a reasonable interlocutor.
  *   **Why:** This protects the security of transactions. If contract law relied on subjective intent, the stability of the market would collapse into epistemic uncertainty.
  *   **Philosophical Cost:** This severs the link between moral autonomy and legal obligation. You can be bound to a promise you never internally willed, provided you signaled it. This aligns the law closer to **Tort** (negligence in signaling) than to **Promise** (self-imposed duty).

  ### 4. Promissory Estoppel: The Safety Valve

  Promissory Estoppel is the anomaly that proves the rule. It enforces bare promises where reliance makes injustice otherwise.
  *   **Function:** It acknowledges that the Consideration/Channelling device is over-inclusive (it sometimes excludes promises that *should* be legally binding).
  *   **Theory:** It imports a **Reliance-Based Moral Theory** as a corrective to the **Convention-Based Legal Theory**. It admits that in the absence of the "contract" ritual, the moral duty not to harm (via reliance) can sometimes ripen into a legal duty to perform.
  *   **Tension:** Note that Estoppel often limits damages to *reliance*, not *expectation*. This preserves the distinction: Full Contract (Consideration + Expectation) vs. Quasi-Contract (Estoppel + Reliance). The law maintains that the full "benefit of the bargain" is reserved for those who paid the entry fee.

  ### 5. Philosophical Underdetermination

  Where is the practice underdetermined? Several incompatible theories license the current doctrine:

  1.  **Economic Efficiency (Posner):** Consideration screens out low-value claims (reducing litigation costs). Expectation damages induce efficient breach. Objectivity reduces information costs.
  2.  **Moral Pluralism (Macneil):** Contract law governs "discrete transactions" (market), while social promises govern "relational contracts" (family/friends). The doctrines simply police the boundary between these two spheres of human interaction.
  3.  **Institutional Conventionalism (Rawls/Scanlon):** The practice of contract is a distinct social institution with its own internal norms. The "obligation" is to follow the rules of the institution, not a pre-institutional moral duty.

  The law is underdetermined because it achieves **reflective equilibrium** among these theories without committing to the metaphysics of any single one.

  ### 6. The Counterfactual: A Straightforward Will-Based Account

  If you replaced the current system with a **Pure Will Theory** (any serious promise is legally enforceable):

  **Doctrinal Changes Required:**
  *   **Abolish Consideration:** Gratuitous promises (gifts, dinner dates, charitable pledges) become actionable.
  *   **Abolish Objective Theory:** Courts must inquire into subjective intent to ensure the "will" was truly engaged.
  *   **Defenses:** Insanity, intoxication, and duress would expand significantly, as any impairment of will voids the obligation.

  **Functional Losses:**
  *   **The Floodgates:** The courts would be inundated with disputes over social promises. The distinction between "I promise to come to your party" and "I promise to sell you 1000 widgets" would vanish legally, requiring courts to adjudicate the "seriousness" of every utterance.
  *   **Chilling Effect:** Social life would be juridified. People would hesitate to speak reassuringly or generously for fear of creating litigation risks. The "consideration" screen currently protects the **social sphere** from the **legal sphere**.
  *   **Evidentiary Nightmare:** Without the bright line of exchange, proving the existence and terms of a promise becomes a "he said/she said" inquiry into internal states, increasing error costs.

  **The Moral Picture:**
  *   **Legal Moralism:** The state becomes the enforcer of all moral duties of fidelity. This conflates *sin* (breaking a promise) with *crime/tort* (breach of contract).
  *   **Loss of Autonomy:** Paradoxically, a Will Theory might reduce autonomy. By making every promise legally binding, the law removes the agent's ability to choose *which* promises to elevate to the level of legal consequence. The current system allows agents to *choose* to be legally bound (by making a bargain) vs. morally bound (by making a gift promise).

  ### Conclusion: The Implicit Philosophy

  The common law of contract does not presuppose a theory of *promising* at all. It presupposes a theory of **market facilitation.**

  It treats the promise not as a moral speech act, but as a **commercial instrument.**
  1.  **Consideration** ensures the instrument is being used for market purposes (screening).
  2.  **Objectivity** ensures the instrument is reliable for third parties and courts (security).
  3.  **Expectation Damages** ensure the instrument has a stable value that can be traded and relied upon (liquidity).

  The tension you perceive arises because the law uses the *language* of morality (promise, obligation, duty) to describe what is functionally a **regulatory regime for economic exchange.**

  *   It rejects the **Will Theory** because the market needs stability more than it needs respect for individual subjective autonomy.
  *   It rejects the **Reliance Theory** as a general rule because the market needs predictability of value (expectation) more than it needs mere compensation for harm.
  *   It accepts **Convention Theory** because it views "Contract" as a distinct game with its own entry rules.

  The law is internally consistent if you accept its premise: **It is not enforcing morality; it is enforcing the integrity of the market institution.** The "promise" is merely the vehicle. If you demand it enforce morality (the Will Theory), you break the machine. If you demand it only compensate harm (the Reliance Theory), you devalue the currency of the market. The current hybrid is a pragmatic compromise that sacrifices philosophical purity for social utility.

  For your dissertation, the fruitful angle may not be to demand the law choose a moral theory, but to critique the **normative cost** of this institutional separation. Does carving out a space where promises are *not* binding (the gratuitous sphere) inadvertently devalue the moral force of promising in general? Or does it protect the moral practice from the corruption of legal coercion? That is the philosophical question the doctrine leaves open.
