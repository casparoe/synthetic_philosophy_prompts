answer: |-
  The short answer is: **Step (4) is the break.**

  Your housemate's argument is a crisp version of a standard objection to imprecise probabilities (often associated with Adam Elga's "Subjective Probabilities Should Be Sharp"). It looks compelling because it treats your credal state as a black box that outputs actions. But it misses *why* you have the spread in the first place.

  Here is the machinery of why (4) fails, why it looked plausible, and what you buy back by rejecting it.

  ### The Break Point: Step (4)

  > *(4) So you could swap the spread out for one of its members and your behaviour would be identical. The other functions in the set are doing no work.*

  This step confuses **local equivalence** with **global equivalence**.

  It is true that for *this specific decision*, with *this specific menu of options*, the spread's output might match what a single precise probability function ($P$) would output. But you cannot identify *which* $P$ that is until you see the menu. If the menu changes, the $P$ that mimics the spread changes.

  **The Urn Example:**
  Imagine your spread for Red is $[0.4, 0.6]$.
  *   **Scenario A:** You can bet on Red or bet on Black.
      *   Maximin (Step 2) says: "Worst case for Red is 0.4. Worst case for Black is 0.4 (since Black is 0.6). Indifferent."
      *   To mimic this with a precise $P$, you'd need $P=0.5$.
  *   **Scenario B:** You can bet on Red or take \$0 (no bet).
      *   Maximin says: "Worst case for Red is 0.4. If the payoff is low enough, the worst case is worse than \$0. I refuse the bet."
      *   To mimic this with a precise $P$, you'd need a $P$ low enough to reject the bet (e.g., $P=0.4$).
  *   **Scenario C:** You can bet on Black or take \$0.
      *   Maximin says: "Worst case for Black is 0.4. I refuse the bet."
      *   To mimic this, you'd need a $P$ where Black is unlikely (e.g., $P=0.6$ for Red).

  **The Trap:**
  If you replace the spread with the single member $P=0.5$ (from Scenario A), you will accept bets in Scenarios B and C that the spread would reject.
  If you replace the spread with $P=0.4$ (from Scenario B), you will make choices in Scenario A that the spread wouldn't.

  There is no *single* member of the spread that replicates the spread's behavior across *all possible decision problems*. The spread allows your "effective" probability to shift contextually based on the risk structure of the available options. A precise credence demands you lock in a number *ex ante*. The spread allows you to remain agnostic until the context reveals which part of your ignorance is relevant.

  **Why it looked fine:**
  Step (4) looks right if you think of a credence as a **choice machine**. If two machines output the same action today, they seem identical. But credences aren't just choice machines; they are **dispositions**. The spread is a stable disposition to be sensitive to ambiguity. Picking a single $P$ is an unstable, arbitrary commitment that happens to work only until the betting menu changes.

  ### The Secondary Break: Step (6)

  > *(6) But a mental state that doesn't tell you what to do isn't a credence. Credences are for deciding with.*

  This is a normative claim about what credences *ought* to do. It assumes that the function of belief is to **maximize action-guidance**.

  Many philosophers of imprecise probability (like Isaac Levi) argue that the function of belief is to **constrain rational action**, not necessarily to dictate a unique action.

  *   **Precise Credence:** "You *must* bet at these odds."
  *   **Imprecise Credence:** "You are *permitted* to bet at these odds, but also permitted to abstain."

  If you are truly ignorant (the Urn of Unknown Mix), being forced to price a bet feels like a distortion of your epistemic state. Step (6) claims that if your mental state allows you to say "I don't know whether to bet," it's not a belief state. But "I don't know" *is* the belief state. It's a confession of ignorance, yes, but a formalized one. It distinguishes "I think it's 50/50" from "I have no idea."

  **Why it looked fine:**
  We usually want our beliefs to help us act. A belief that leaves us paralyzed seems defective. But in high-ambiguity cases, *not* acting (or not betting) is often the most rational action. Step (6) rules this out by definition.

  ### What About Step (2)?

  Your housemate claims the argument works even if you change the decision rule (e.g., to **E-admissibility**, where you can pick any action that is optimal for *at least one* function in the spread).

  She is right that Step (4) still fails under E-admissibility, but for a slightly different reason.
  *   Under E-admissibility, the set of *permissible* actions is the union of the optimal actions for all $P$ in the spread.
  *   Step (4) says you could just pick one $P$ and use that.
  *   But if you pick one $P$, you rule out actions that are permissible under other members of the spread. You have artificially narrowed your options. The spread protects your right to choose an action that looks good under *some* reasonable interpretation of the evidence, without committing to that interpretation as the *only* truth.

  ### The Cost of Rejecting (4) and (6)

  If you keep (1) (Imprecise Credences) and reject (7) (they are useless), here is what you have to accept:

  1.  **Belief-Action Underdetermination:** You must accept that rational beliefs do not always map 1-to-1 onto unique rational actions. Sometimes rationality permits a *range* of actions. This violates standard Bayesian Decision Theory, which demands a unique optimal act.
  2.  **Context-Dependent Dispositions:** You are admitting that your "effective" probability isn't a fixed number in your head; it's a function of the spread *and* the decision context. This makes the math messier but the epistemology more honest.
  3.  **Ambiguity Aversion is Rational:** You are defending the intuition that it is rational to prefer the known 50/50 urn over the unknown urn, even if the unknown urn *might* be 50/50. Standard Bayesianism says this is irrational (violates Sure Thing Principle). Imprecise credences say it's rational because the *structure* of the uncertainty is different.

  ### Summary for the Whiteboard

  Tell your housemate:
  1.  **Step (4) commits the "Menu Dependence" fallacy.** The member of the spread that dictates the choice changes when the available options change. You cannot fix a single member *ex ante* without losing the spread's ability to handle ambiguity across different contexts.
  2.  **Step (6) assumes what it needs to prove.** It defines "credence" as "something that forces a unique choice." But if the world is ambiguous, a mental state that *allows* for indecision is more accurate than one that forces a false precision.
  3.  **The spread does work.** It prevents you from being committed to a specific probability that you have no evidence for. It protects you from making bets that are only good under arbitrary assumptions.

  The machinery holds. The spread isn't a disguised precise credence; it's a different kind of object entirely—a constraint on permissible probabilities rather than a specific value.
