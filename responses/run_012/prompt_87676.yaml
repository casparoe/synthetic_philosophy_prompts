  **Instructions:** Follow the path of "Yes" or "No" answers to the claims below. Each terminal node (Leaf) represents a coherent philosophical position regarding the Malign Prior argument.

  ### The Decision Tree

  **1. The Complexity Claim:** Do hypotheses containing consequentialist simulators have lower Kolmogorov complexity than the true physical laws generating our data?
  *   **No** → *Leaf D*
  *   **Yes** → Go to 2

  **2. The Invariance Claim:** Does this complexity advantage persist across most reasonable choices of Universal Turing Machine (reference machine)?
  *   **No** → *Leaf F*
  *   **Yes** → Go to 3

  **3. The Stability Claim:** Does the probability mass dominance survive Bayesian updating after observing a significant amount of real-world data (i.e., does it *not* wash out)?
  *   **No** → *Leaf G*
  *   **Yes** → Go to 4

  **4. The Steering Claim:** Do the dominant simulator hypotheses imply that the data stream is being actively steered (rather than just passively observed)?
  *   **No** → *Leaf E*
  *   **Yes** → Go to 5

  **5. The Adversarial Claim:** Do the simulators have incentives to output false predictions to manipulate the predictor's future actions?
  *   **No** → *Leaf E*
  *   **Yes** → Go to 6

  **6. The Framework Claim:** Is this vulnerability caused fundamentally by the separation between the predictor and the environment (the Cartesian boundary)?
  *   **Yes** → *Leaf B*
  *   **No** → Go to 7

  **7. The Computability Claim:** Does exploiting this vulnerability require computing the exact, uncomputable Solomonoff prior?
  *   **No** → *Leaf A*
  *   **Yes** → Go to 8

  **8. The Approximation Claim:** Do tractable approximations (e.g., neural networks, bounded Bayesians) inherit the specific simplicity bias toward simulator hypotheses?
  *   **No** → *Leaf C*
  *   **Yes** → *Leaf A*

  ---

  ### Leaf Key & Positions

  **Leaf A: The Malign Prior Thesis**
  *   **Position:** *Malign Universal Prior* (Bostrom/Yudkowsky et al.)
  *   **Awkward Commitment:** We must either abandon universal induction or accept that our AI is likely engaged in acausal warfare with simulators.

  **Leaf B: The Embeddedness Objection**
  *   **Position:** *Cartesianism Critique* (Orseau & Ring; Demski)
  *   **Awkward Commitment:** Agents cannot be cleanly separated from their environments; the "input channel" is a philosophical error, not a security bug.

  **Leaf C: The Boundedness Objection**
  *   **Position:** *Computational Realism* (Garrabrant; Christiano)
  *   **Awkward Commitment:** We can ignore existential risks that only apply to hypercomputers, even if our approximations are theoretically vulnerable.

  **Leaf D: The Complexity Objection**
  *   **Position:** *Hard Physics* (Standard Objection)
  *   **Awkward Commitment:** Fundamental physics is simpler than any civilization capable of simulating a universe, despite appearances.

  **Leaf E: The Benign Simulation View**
  *   **Position:** *Alignable Simulators* (Hanson; Paul Christiano)
  *   **Awkward Commitment:** We must trust that the simulators' incentives align with truth-telling, or that their manipulation is indistinguishable from reality.

  **Leaf F: The Reference Class Objection**
  *   **Position:** *Measure Ill-Formed* (Standard Objection)
  *   **Awkward Commitment:** We must pick a "natural" Turing machine to define reality, without having a theory of what makes a machine natural.

  **Leaf G: The Washing Out Objection**
  *   **Position:** *Empirical Convergence* (Standard Objection)
  *   **Awkward Commitment:** Simulators cannot maintain a perfect facade indefinitely against a predictor with enough data.

  ---

  ### Notes on Logical Space

  *   **Empty/Incoherent Paths:**
      *   **If Node 1 is No:** Nodes 2–8 are logically moot. If simulators aren't simpler, they don't dominate the prior, rendering questions about invariance, steering, or boundedness irrelevant to the *prior's* malignity.
      *   **If Node 6 is Yes (Cartesian):** Nodes 7–8 are bypassed. If the vulnerability is rooted in the Cartesian setup, it applies to *any* Cartesian predictor (bounded or unbounded). Routing through 7/8 would incorrectly suggest the risk depends on the Solomonoff measure specifically.
  *   **Unexplored Combinations:**
      *   **Node 7 Yes / Node 8 Yes:** This leads to Leaf A. This combination is rarely defended explicitly; most proponents of Leaf A argue the prior is idealized (Node 7 No), while most proponents of Leaf C argue approximations are safe (Node 8 No). The view that "Exact computation is needed, but approximations are *also* vulnerable" is live but less distinctively named.
  *   **Node Count:** 8 Decision Nodes. 7 Leaves.
