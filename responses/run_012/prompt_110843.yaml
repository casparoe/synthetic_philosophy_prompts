  2.  **Deconstruct the Cases & Distinctions (The "Criteria List"):**
      *   *Case (a) Accidental Isolation:* Theory must distinguish ignorance from resistance.
      *   *Case (b) Distrust/Discrediting:* Theory must account for *defensive* epistemic structures, not just lack of data.
      *   *Case (c) Illusion of Breadth:* Theory must look at network topology/source genealogy, not just self-reported consumption.
      *   *Case (d) Isolated Truth-Seeker:* Theory must not pathologize isolation itself; isolation isn't always the error.
      *   *Case (e) Righteous Minority:* Theory must not equate "minority view" with "bubble." Truth value shouldn't be determined by consensus.
      *   *Case (f) Self-selected vs. Imposed:* Theory must handle algorithmic curation *and* psychological selection.
      *   *Distinctions:* Mechanism (exposure vs. trust), Perspective (phenomenology vs. topology), Level (agent vs. system), Normative Target (truth vs. rationality).

  3.  **Evaluate the "Epistemic Sinkhole":**
      *   *Definition:* Cut off + Hostile.
      *   *Analysis:* Standard "Echo Chamber" (Nguyen) already includes the active discrediting of outsiders. Standard "Epistemic Bubble" (Nguyen) is just lack of exposure.
