      *   **Phase 3: Misconceptions & Boundaries (60-80 mins).**
          *   Address the specific list provided by the user.
          *   Draft the "preemptive sentences."

      *   **Phase 4: Conclusion (80-90 mins).**
          *   The Diagnostic Question.
          *   The Exclusions.

  5.  **Refining the Misconception Map:**
      *   *Priors:* It's not about how much you liked the theory before.
      *   *Logical Omniscience:* It's not that she *should* have known the implication earlier.
      *   *The "Fix":* Don't promise a solution exists.
