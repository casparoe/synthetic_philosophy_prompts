answer: |-
  Here is a plan for the ninety minutes. It is structured to prevent the room from treating this as a seminar on memory or narrative revelation, and to keep the focus on the mechanics of confirmation.

  ### I. The Sequence of Foundations (Minutes 0–30)

  You cannot speak of the problem until the machinery of the solution is visible. If you introduce the "old evidence" too soon, the room will treat it as a psychological puzzle about attention. You must build the Bayesian engine before you show them it has no fuel for this specific cargo.

  **1. Credence as Wager (0–10 mins)**
  Do not define probability as frequency. Define it as *price*.
  *   **The Move:** Ask them to price a ticket that pays $100 if a specific character in their current draft finishes the novel.
  *   **The Point:** Credence is not truth; it is exposure. It establishes that belief is a quantity that can move.
  *   **The Constraint:** Establish that credence ranges from 0 to 1. 1 is not "very sure"; 1 is *certainty*. There is no room above 1.

  **2. Likelihood as Fit (10–20 mins)**
  Distinguish $P(H)$ (how much you like the theory) from $P(E|H)$ (how well the theory predicts the fact).
  *   **The Move:** Use a crime scene. Hypothesis: The Butler did it. Evidence: The Butler's fingerprints are on the gun.
  *   **The Point:** A hypothesis is confirmed if the evidence is *more expected* under that hypothesis than under its rivals.
  *   **The Sentence:** "Confirmation is not the fact arriving; it is the fact fitting better here than there."

  **3. Conditionalization as Movement (20–30 mins)**
  Show the update rule without calling it a theorem.
  *   **The Move:** Show the ratio. New Credence = Old Credence $\times$ (Likelihood Ratio).
  *   **The Point:** For belief to move, the denominator—the probability of the evidence itself—must be less than 1.
  *   **The Trap:** If the evidence is already certain ($P(E) = 1$), the ratio becomes 1. The multiplication changes nothing.
  *   **The Preceding Requirement:** Before you can say "General Relativity was confirmed by Mercury," you must have established that *confirmation requires a change in credence*. If the math shows no change, the intuition that "yes, it did confirm it" creates the crisis.

  ### II. The Carrying Example (Minutes 30–60)

  Your wife/husband/sea example is superior to Mercury for this room, but it is treacherous. It risks collapsing into a story about *realization* rather than *logic*.

  **What it has that Mercury lacks:**
  *   **Intimacy of Certainty:** A novelist understands that a wife can know her husband's seasickness with $P=1$ certainty. Mercury's perihelion feels like data; seasickness feels like *knowledge*.
  *   **Separation of Fact and Theory:** The fact (seasickness) exists independently of the alibi theory. In the Mercury case, critics argue Einstein tailored the math to the residual. In your example, the seasickness is biologically fixed before the alibi is conjectured.

  **What it risks smuggling in:**
  *   **The Psychology of Oversight:** The room will argue, "She didn't *use* the evidence before." You must block this. The problem is not that she failed to use it; it is that the *logic forbids* it from counting now.
  *   **The Novelty of Connection:** They will confuse the newness of the *link* (hypothesis $\to$ fact) with the newness of the *fact*. You must insist the fact itself is the variable that is "old."
  *   **Memory:** If she "remembered" the seasickness, it is psychologically new. You must stipulate she never forgot it. It was simply inert.

  **How to stage it:**
  1.  **Stipulate Certainty:** "She does not merely believe he hates the sea; she knows it. It is a 1."
  2.  **Stipulate Entailment:** You must tighten the logic. It cannot be "he hates the sea, so he probably stayed home." It must be: "The hypothesis 'He stayed in the country' *entails* 'He did not cross the Atlantic.' The fact 'He cannot bear the sea' explains *why* he didn't cross, but for the Bayesian, the fact is already known."
      *   *Correction:* Actually, for the Old Evidence problem to bite, the Theory must entail the Evidence.
      *   *Revised Setup:* Hypothesis: "He spent the summer in England." Entailment: "He crossed the Channel." Old Evidence: "He gets violently seasick on crossings."
      *   *Wait, that makes the evidence count **against** the theory.*
      *   *Let's stick to the confirmation structure:* Hypothesis: "He is the father." Old Evidence: "Child has rare blood type."
      *   *If you must use the Sea:* Hypothesis: "He never left the country." Implication: "He never took a ferry." Old Fact: "He has no record of ferry sickness." (This is weak).
      *   *Recommendation:* Use the **Paternity** model for the logic, keep the **Sea** model for the narrative flavor, but warn them you are simplifying the entailment.
      *   *Better:* Hypothesis: "He wrote the anonymous letter." Old Fact: "The letter uses the word 'verily', which he always uses."
      *   *Decision:* Stick to your Sea example but frame it carefully:
          *   **Fact (Old):** He gets seasick within 10 minutes. ($P=1$)
          *   **Hypothesis (New):** He traveled to France in 1987.
          *   **Entailment:** To travel to France, he must cross the sea.
          *   **Conflict:** If H is true, he must have been seasick. We have no record of that.
          *   *Wait, you want confirmation.*
          *   **Fact (Old):** He has a passport stamp from a land-locked border crossing in 1987.
          *   **Hypothesis:** He stayed in Europe.
          *   **This is getting messy.**

      *   **Strict Advice:** Use the **Mercury structure** but with the **Wife's texture**.
      *   **Fact:** She knows he was in the house on the night of the 14th. (Old, $P=1$).
      *   **Hypothesis:** He is the one who wrote the note found on the table.
      *   **Entailment:** The writer of the note was in the house on the 14th.
      *   **Problem:** Since she already knew he was in the house ($P=1$), learning that the *writer* was in the house cannot increase her confidence that *he* is the writer. The math says the evidence is inert. Her intuition says it fits perfectly.

  **What must wait inside the sentence:**
  Do not say "This confirms the hypothesis" until you have shown the math says "This *cannot* confirm the hypothesis." The tension must land *after* the calculation fails.

  ### III. The Map of Misconceptions (Minutes 60–75)

  Intervene at these specific points. Do not wait for questions; plant the flags before they wander.

  **1. The Problem of Priors**
  *   **Where it forms:** When you define Credence.
  *   **The Misconception:** "This is just about how much we liked the theory to begin with."
  *   **The Preemptive Sentence:** "This is not about how much you loved the hypothesis before the evidence; it is about why the evidence fails to move the needle *at all*, regardless of your starting affection."

  **2. Logical Omniscience**
  *   **Where it forms:** When discussing the Wife's realization.
  *   **The Misconception:** "She should have known the hypothesis implied the fact earlier."
  *   **The Preemptive Sentence:** "Do not blame her for not seeing the connection sooner; the problem remains even if we grant her perfect logic. The math breaks even for an omniscient agent."

  **3. The Counterfactual Repair**
  *   **Where it forms:** When they try to fix it.
  *   **The Misconception:** "Just ask what she would have believed if she didn't know the fact."
  *   **The Preemptive Sentence:** "You cannot rewind time to erase a fact you know. Bayesian updating is for learning new things, not for pretending you are ignorant of what is certain."

  **4. The "Stopped Being Surprising" Error**
  *   **Where it forms:** When defining "Old."
  *   **The Misconception:** "Old evidence just means evidence that isn't surprising anymore."
  *   **The Preemptive Sentence:** "Surprise is a feeling; probability is a state. A fact can be shocking and still be $P=1$ if you already knew it. The problem is about knowledge, not emotion."

  **5. Refutation vs. Idealization**
  *   **Where it forms:** At the end, when the paradox hangs.
  *   **The Misconception:** "This proves Bayes is wrong."
  *   **The Preemptive Sentence:** "This does not break the engine; it shows the map is not the territory. It reveals where the idealization of 'knowledge' grinds against the reality of 'discovery'."

  ### IV. The Exit (Minutes 75–90)

  **The Diagnostic Question**
  Do not ask them to solve it. Ask them to locate the break.
  *   **The Question:** "If the wife's knowledge of the husband's seasickness is certain ($P=1$), and the hypothesis entails that knowledge, at exactly which step in the calculation does the confirmation vanish? Is it in the numerator, the denominator, or the prior?"
  *   **What this tells you:** If they say "the prior," they don't understand. If they say "the denominator becomes 1, so the ratio is 1," they have the problem. If they say "It doesn't vanish, that's the problem," they have the *point*.

  **What to Refuse to Explain**
  Announce these exclusions explicitly to manage expectations.
  1.  **The Solutions:** "I will not explain the 'counterfactual historical' repair, the 'entropy' solution, or the 'Jeffrey conditionalization' fix. There is no consensus on which works, and discussing them would turn this into a seminar on fixing math rather than feeling the puzzle."
  2.  **The History:** "We will not discuss whether Einstein actually knew about Mercury's perihelion before he finished General Relativity. That is a historical dispute; we are dealing with a logical one."
  3.  **The Psychology:** "We will not discuss why the wife *felt* more confident. We are analyzing why the *logic* says she shouldn't be."

  ### Summary of Flow
  1.  **Credence** (Price)
  2.  **Likelihood** (Fit)
  3.  **Conditionalization** (The Update Rule)
  4.  **The Wall** ($P(E)=1$ kills the update)
  5.  **The Example** (Wife/Sea, framed as logical entailment, not psychological realization)
  6.  **The Misconceptions** (Preemptive strikes)
  7.  **The Diagnostic** (Locate the zero)

  This sequence ensures they feel the *loss* of confirmation before they are asked to contemplate the *existence* of the problem. They must feel the engine stall before they can care about the mechanics of the stall.
