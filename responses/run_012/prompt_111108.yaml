      *   *Strengths:* Relatable, narrative-driven, separates the *fact* (husband hates sea) from the *hypothesis* (he didn't leave in '87). It captures the "aha!" moment of realization.
      *   *Weaknesses/Risks:*
          *   **Psychological vs. Logical:** Novelists will focus on *why* she didn't think of it before (psychological oversight) rather than the logical problem of $P(E)=1$.
          *   **Memory:** Did she forget the fact? If she forgot, it's "new" to her consciousness, dissolving the logical problem.
