  # The Health Plan Disease Classification Protocol

  **Purpose:** To determine whether a contested condition qualifies as a "Disease" for medical-necessity coverage.  
  **Philosophy:** Hybrid Naturalist/Normativist (Function + Harm + Values).  
  **Time:** 15 Minutes per condition.

  ### Step 1: The Mechanism Test (Naturalist Filter)
  **Question:** Is there evidence that a specific physiological or psychological mechanism is failing to perform its *etiological function* (the function it was selected/developed to do)?
  *   **Sufficient Answer:** Peer-reviewed evidence of pathway failure, structural defect, or regulatory breakdown.
  *   **Negative Verdict:** If the answer is **"No mechanism identified"** and the trait falls within the **normal statistical variation** of the population, terminate. **Verdict: Not a Disease.** (Hand-off to Value Judgment: See Step 5).
  *   **Note:** Do not require a known molecular cause if functional failure is observable (e.g., blindness).

  ### Step 2: The Reference Class Declaration (Biostatistical Filter)
  **Question:** Relative to *which* population is this trait being compared?
  *   **Required Statement:** You must write down: *"We are comparing [Patient] to [Reference Class: Age, Sex, Environment, Population]."*
  *   **The Flip Rule:** If the trait is **Statistically Normal** in the *Local/Current* population (e.g., Myopia in modern youth) but **Dysfunctional** relative to the *Species-Design/Ancestral* class, you must default to **Species-Design**.
  *   **Rationale:** Statistical prevalence does not negate functional failure. A broken leg is still broken even if everyone breaks their leg.
  *   **Termination:** If the trait is functional relative to Species-Design, terminate. **Verdict: Not a Disease.**

  ### Step 3: The Harm Separation (Harmful Dysfunction Filter)
  **Question:** What is the source of the harm?
  *   **Intrinsic Harm:** Pain, suffering, disability, or loss of capacity the individual has reason to value *independent of social reaction* (e.g., inability to see, inability to regulate emotion).
  *   **Extrinsic Harm:** Stigma, discrimination, economic disadvantage, or cosmetic distress caused *solely* by social norms or environmental mismatch.
  *   **Decision Rule:** 
      *   If **Intrinsic Harm** is present: Proceed to Step 4.
      *   If **Only Extrinsic Harm** is present: Terminate. **Verdict: Not a Disease.** (We do not medicalize social bias).
      *   If **Both**: Proceed to Step 4.

  ### Step 4: The Counterfactual Test (Normative Exposure)
  **Question:** *"If this condition were equally common and equally harmful, but we had **no biological account** of it at all, would we still call it a disease?"*
  *   **Yes:** (e.g., Blindness). Proceed to Verdict.
  *   **No:** (e.g., Unemployment, Illiteracy). This indicates the classification is driven by social values, not pathology.
  *   **Action:** If "No," you must explicitly state in the written rationale: *"This classification relies on a value judgment, not purely biological fact."*

  ### Step 5: Final Verdict & Discomfort Check
  *   **Disease:** Coverage presumption granted.
  *   **Not a Disease:** Coverage presumption denied (unless policy overrides for social reasons).
  *   **Discomfort Check:** If the committee feels strong resistance to this verdict, ask: *"Are we resisting because the science is wrong, or because the budget/moral implications are difficult?"* If the latter, **record the verdict anyway.** Do not adjust the science to fit the budget.

  ***

  # Worked Cases (Read Aloud)

  ### Case 1: Myopia in Young Adults (Prevalence: 85%)
  *   **Step 1 (Mechanism):** **Pass.** The eye's optical system fails to focus light on the retina. Function is impaired.
  *   **Step 2 (Reference Class):** **Local Class** (2024 Young Adults) = Normal. **Species Class** (Human Design) = Dysfunction. **Rule:** Default to Species. **Pass.**
  *   **Step 3 (Harm):** **Intrinsic.** Loss of visual capacity exists regardless of social stigma. **Pass.**
  *   **Step 4 (Counterfactual):** If we didn't know optics, would we call blindness a disease? **Yes.**
  *   **Verdict:** **DISEASE.**
  *   **Near Failure:** Step 2. The committee wanted to classify this as "Wellness" due to high prevalence. The Protocol forces "Disease" status because function fails regardless of statistics.
  *   **Committee Discomfort:** High. Classifying 85% of members as "diseased" strains the medical model and budget.
  *   **Instruction:** Accept the budget hit. The alternative is lying about the biology.

  ### Case 2: Prolonged Grief Disorder (DSM-5-TR)
  *   **Step 1 (Mechanism):** **Pass.** Attachment regulation system fails to adapt to loss over time; distinct from acute bereavement neurobiology.
  *   **Step 2 (Reference Class):** **Species/Cultural.** Grief is universal, but *prolonged incapacitation* is not species-typical function. **Pass.**
  *   **Step 3 (Harm):** **Intrinsic.** Severe distress and functional impairment (unable to work/care for self). **Pass.**
  *   **Step 4 (Counterfactual):** If biology were unknown, would we call incapacitating sadness a sickness? **Yes.**
  *   **Verdict:** **DISEASE.**
  *   **Near Failure:** Step 1 & 4. Skepticism that grief is "medical."
  *   **Committee Discomfort:** Moderate. Fear of medicalizing normal life.
  *   **Instruction:** Cover treatment. The dysfunction is in the *recovery mechanism*, not the sadness itself.

  ### Case 3: Idiopathic Short Stature (ISS) (Child, Low Normal Range)
  *   **Step 1 (Mechanism):** **Fail.** By definition, "Idiopathic" means no pathology found. Hormone axes are intact. Trait is within normal statistical variation.
  *   **Step 2 (Reference Class):** **Local/Species.** Child is at the 1st percentile, but within the *normal range* of human variation. **Fail.**
  *   **Step 3 (Harm):** **Extrinsic.** The child is healthy. Harm arises from social bias against short stature (bullying, hiring bias). **TERMINATE.**
  *   **Verdict:** **NOT A DISEASE.**
  *   **Near Failure:** Step 3. The committee wants to help the child.
  *   **Committee Discomfort:** **Extreme.** You are denying treatment to a suffering child.
  *   **Instruction:** **Do not change the verdict.** Instead, change the rationale. You must write: *"We are not covering this because the harm is social, not biological. We refuse to use medical funds to correct social bias."* This is the truth. Sit with the discomfort. It reveals that the demand is for social justice, not medicine.

  ***

  # What To Do With The Discomfort (ISS Case)

  In the ISS case, the Protocol forces a "Not a Disease" verdict. You will be tempted to override this to avoid bad press or because you empathize with the family. **Do not override the classification.** If you cover ISS, do so under a "Social Benefit" rider, not "Medical Necessity."

  **Why?** If you call ISS a disease to justify coverage, you medicalize social prejudice. You tell the child, "You are sick because society is mean." That is a lie. The Protocol forces you to admit the limit of your power: *We fix broken bodies, not broken societies.*

  **When would this verdict be wrong?**
  1.  If future science discovers a specific pathological pathway for ISS (Step 1 changes).
  2.  If the Plan decides to explicitly cover "Social Disadvantage" as a policy goal, separate from disease (Step 3 rule changes).

  **Do not use the Disease label to hide a Social Policy decision.**

  ***

  # Limitations: What This Procedure Cannot Do

  1.  **It Does Not Set Prices:** A condition can be a "Disease" under this protocol and still be excluded due to cost-effectiveness (e.g., a $10M gene therapy for a minor dysfunction). This protocol determines *eligibility*, not *affordability*.
  2.  **It Does Not Solve Justice:** It explicitly excludes extrinsic harm (stigma/poverty) from disease status. It will not help populations harmed by social structures unless a biological dysfunction is also present.
  3.  **It Does Not Replace Clinical Judgment:** It classifies the *condition*, not the *patient*. A patient with a "Disease" may not need intervention if the harm is negligible.
  4.  **It Is Not Static:** As reference classes shift (e.g., obesity becomes statistically normal), the Protocol requires re-evaluation. It demands you update your verdicts when the science or population changes.

  **Final Warning:** This procedure will generate verdicts that are scientifically defensible but politically difficult. If you cannot defend the verdict to the press, **change the policy, not the classification.** Keep the disease list honest.
