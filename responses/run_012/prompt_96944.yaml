answer: |-
  Here is the specification checklist for a coherent theory of Futarchy.

  ### The Spec: Requirements for Governance-by-Prediction-Market

  | Requirement | Source / Case | Constraint Type | Incompatible With | Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Counterfactual Resolution** | Conditional markets that never resolve because the policy didn't pass (the "Null World" problem). | **Hard** (Logical) | Decentralization / Trustlessness | **Critical Failure Point** |
  | **2. Metric Verifiability** | The market must settle on an objective number (e.g., GDP, homicide rate). | **Hard** (Mechanism) | Metric Alignment (Req #3) | **Tension** |
  | **3. Metric Alignment** | The metric must capture actual human welfare/values (avoiding Goodhart's Law). | **Hard** (Functional) | Metric Verifiability (Req #2) | **Tension** |
  | **4. Manipulation Resistance** | A whale cannot profit by buying the market *and* influencing the policy outcome (policy-market feedback loop). | **Hard** (Game Theory) | Small Scale / Low Liquidity | **Context Dependent** |
  | **5. Agenda Neutrality** | Who decides which policies get a market? Prevents "stacking the deck" with only bad options. | **Soft** (Political) | Pure Market Rule | **Unresolved** |
  | **6. Intergenerational Equity** | Policies whose payoff lands after current traders are dead (long-termism vs. discount rates). | **Soft** (Ethical) | Rational Market Pricing | **Structural Bias** |
  | **7. Information Aggregation** | Overcoming the No-Trade Theorem (why trade if prices are already efficient?). | **Hard** (Math) | Common Priors / Homogeneity | **Solvable w/ Heterogeneity** |
  | **8. Legitimacy Mapping** | Reconciling "One Dollar One Vote" (market weight) with "One Person One Vote" (democratic authority). | **Soft** (Political) | Democratic Theory | **Philosophical Block** |
  | **9. Oracle Integrity** | Who resolves the market? They cannot be bribed or coerced. | **Hard** (Security) | Human Resolution / High Stakes | **Critical Failure Point** |
  | **10. Causal Isolation** | Preventing traders from sabotaging or self-fulfilling the prophecy to win the bet. | **Hard** (Mechanism) | Policy Execution Power | **Critical Failure Point** |

  ### Constraint Classification

  *   **Hard Constraints:** Logical, mathematical, or physical impossibilities. If these are not met, the system either crashes or produces garbage output regardless of intent. (e.g., You cannot resolve a counterfactual without an oracle).
  *   **Soft Constraints:** Political, ethical, or aesthetic objections. The system *functions* technically, but may be unacceptable to the population or violate normative theories of justice. (e.g., Plutocracy vs. Democracy).

  ### Incompatible Pairs (The Trade-Offs)

  You suspected the metric tension was real. You are correct. Here are the pairs that cannot be simultaneously optimized:

  1.  **Metric Verifiability vs. Metric Alignment (Req #2 vs. #3)**
      *   **The Conflict:** To settle a market, the metric must be crisp, objective, and hard to dispute (Verifiability). To govern well, the metric must capture complex, nuanced human welfare (Alignment).
      *   **The Reality:** High verifiability metrics (GDP, stock price) are easily gamed and misaligned. High alignment metrics (happiness, flourishing) are subjective and impossible to resolve objectively. You must sacrifice one for the other.
      *   **Verdict:** **Cannot both be met.** This confirms your nagging feeling.

  2.  **Counterfactual Resolution vs. Trustlessness (Req #1 vs. Decentralization)**
      *   **The Conflict:** To pay out a bet on a policy that *was not enacted*, you need an oracle to simulate or estimate the outcome.
      *   **The Reality:** If the oracle is human/committee, they can be bribed (breaks Integrity). If the oracle is algorithmic, it cannot judge complex counterfactuals (breaks Accuracy). If the oracle is decentralized, it is slow and costly.
      *   **Verdict:** **Cannot both be met.** You need a trusted authority to resolve counterfactuals, which reintroduces the centralization Futarchy tries to remove.

  3.  **Capital Weighting vs. Democratic Legitimacy (Req #8 vs. Democratic Theory)**
      *   **The Conflict:** Prediction markets aggregate *wealth-weighted* beliefs. Democracies aggregate *person-weighted* preferences.
      *   **The Reality:** A Futarchy naturally drifts toward plutocracy. Rich agents have more say on what is "true" about the future.
      *   **Verdict:** **Cannot both be met.** You must choose whether authority comes from capital or citizenship.

  4.  **Market Liquidity vs. Manipulation Cost (Req #4 vs. Scale)**
      *   **The Conflict:** Markets are accurate when liquid. Manipulation is unprofitable when the liquidity is deeper than the manipulator's profit from the policy.
      *   **The Reality:** Works for a corporation (policy profit is capped). Fails for a state (policy profit is unlimited/taxation power). A whale can always afford to move a national market if they can capture the state apparatus.
      *   **Verdict:** **Scale Dependent.** Viable for small DAOs/Companies; likely non-viable for Sovereign States.

  ### The Single Killer Requirement

  **Requirement #1: Counterfactual Resolution**

  This is the requirement that knocks out the most versions of the idea, including the most sophisticated ones.

  **Why it kills the proposal:**
  Futarchy relies on the price difference between Market A (Policy X passes) and Market B (Policy X fails).
  *   If Policy X passes, Market A resolves, and Market B is voided.
  *   If Policy X fails, Market B resolves, and Market A is voided.

  To know which policy to pick, you need to know the price of *both* simultaneously. But only one world becomes real. The market that is voided never resolves based on reality. Therefore, the traders in the voided market are not betting on truth; they are betting on what the **Oracle** will *say* the truth would have been.

  This shifts the entire governance mechanism from "Market Truth" to "Oracle Trust."
  *   If the Oracle is honest and omniscient, you don't need the market; just ask the Oracle.
  *   If the Oracle is fallible or corruptible, the market prices reflect the Oracle's bias, not the policy's outcome.

  Every proposed solution (subsampling, peer prediction, synthetic controls) introduces enough noise or centralization that the "Wisdom of the Market" signal is drowned out by the "Oracle Risk." Without a solution to resolving worlds that do not exist, the mechanism cannot calculate the expected value of a policy, and the system halts.

  ### Summary of the "Metric Tension"
  You asked specifically about **Well-Defined vs. Captures-What-We-Care-About**.
  *   **Verdict:** You are right. They are mutually exclusive at high stakes.
  *   **Reason:** Anything simple enough to be a smart contract condition is simple enough to be optimized at the expense of the spirit of the law. Anything complex enough to capture human welfare is too complex to be a smart contract condition.
  *   **Implication:** Futarchy can only govern things that are easily measured. Since the most important governance decisions (war, rights, liberty, justice) are not easily measured, Futarchy is structurally blind to the most critical variables of governance.
