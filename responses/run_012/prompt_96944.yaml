prompt: |-
  ok so i've been reading about futarchy for years now — the whole setup where you vote on what you want (some metric) and then let prediction markets bet on which policy actually gets you there, instead of voting on policies directly. every thread i read either sells it as obviously correct or waves it off with "markets can't pick values, duh," and both sides skip the part i actually care about. so before i read another post on it, give me the spec. not a defense of it, a checklist: what does a theory of governance-by-prediction-market have to deliver to count as a serious proposal.

  stuff i want covered. the cases it has to get right: a whale who buys the market and then buys the policy, the metric that gets gamed the second you start steering by it, the conditional market that never resolves because the policy didn't pass so nobody ever got paid for being right about the counterfactual, the policy whose payoff only lands after everyone currently trading is dead, and the difference between running this on a company or a small city vs a whole society. the results it can't contradict — and i mean the actual formal ones, not vibes: the no-trade result where rational agents with common priors and nothing private between them just don't bet, the social-choice stuff about aggregating preferences, and the fact that a bet weighted by capital is not a vote weighted by persons. the distinctions it can't collapse: predicting vs deciding, values vs beliefs, the metric vs what we actually care about, and being legitimately authoritative vs merely being right. and the mechanism design parts where i suspect it dies — who resolves the market and why can't they be bought, who sets the agenda of which policies ever get put to a market, and how you stop a conditional market from being profitable to sabotage or self-fulfill.

  for each requirement tell me the case or result it's coming from, mark which ones are real constraints vs which are just aesthetic preferences of the hansonite crowd or the anti-market crowd, and — the part i most want — flag any pair that can't both be satisfied. i have a nagging feeling that well-defined-and-resolvable metric and metric-that-captures-what-we-care-about are two different requirements that definately can't both be met, but tell me if i'm wrong. and then pick the single requirement that knocks out the most versions of the idea. table's fine. skip scoring any specific proposal, i'll do that myself. no citations please, i'm not gonna go chase papers.
