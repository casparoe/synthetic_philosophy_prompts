answer: |-
  **Essay Question**

  **Time Allowed:** 45 Minutes
  **Instructions:** No notes or texts. Answer the following question.

  Two students debate Wittgenstein's remarks on games (§65–67). Student A argues Wittgenstein is proposing a "cluster concept" theory: to be a game, an activity need only possess any 3 of 6 standard features (competition, rules, skill, etc.). Student B argues Wittgenstein is refuted by Bernard Suits, who successfully defined games as "the voluntary attempt to overcome unnecessary obstacles."

  Consider a new activity: a person wanders alone in a field. There is no winning, no rules to break, and no goal. Yet, a community begins calling this "a game."

  Using this example, evaluate Student A and Student B. Does the "cluster" interpretation capture Wittgenstein's point? Does Suits' definition show Wittgenstein wrong? Explain what work "forms of life" or "training" does in explaining why the wandering is a game, which a feature-checklist cannot.

  ***

  **Model Answer**

  Student A and Student B both misunderstand Wittgenstein's methodological aim. They treat his remarks as a rival theory of concepts, whereas Wittgenstein is dissolving the craving for generality. The "wandering" case demonstrates why both the cluster model and the strict definition fail to capture how language actually functions.

  Student A's "cluster concept" interpretation is the more subtle error. It suggests that while there are no *necessary* conditions, there is a fixed set of *sufficient* conditions (tick 3 of 6). This retains the essentialist structure Wittgenstein attacks. It assumes the concept "game" is bounded by a latent logical structure waiting to be mapped. If the wandering activity lacks all 6 features on Student A's checklist, their model dictates it cannot be a game. However, if the community uses the word "game" for this wandering, then it *is* a game. For Wittgenstein, the boundaries of a concept are not fixed by features but by how the word is woven into practice. Family resemblance describes overlapping similarities without a underlying substrate; a checklist merely hides the essence behind a quota. It still looks for a justification in the *object* rather than the *use*.

  Student B appeals to Suits' definition. Wittgenstein would not deny that one *can* stipulate a definition for a specific purpose (e.g., regulating a tournament). However, Suits is refining a concept for a theoretical end, not describing the rough ground of ordinary language. If the community calls the wandering activity a "game," Suits must say they are speaking incorrectly. Wittgenstein asks us to look at what is actually said. If the definition conflicts with use, the definition is idle for understanding meaning. Suits shows we can impose precision, not that precision already exists in the concept.

  This is where "forms of life" and "training" do the work a checklist cannot. A checklist is static; it cannot explain why we extend the word "game" to the wandering activity. We extend it because the activity occupies a specific place in our form of life. Perhaps the wandering is done for amusement, or as a ritual, or mimics a video game mechanic. The speakers have been trained in a practice where "game" signals a certain attitude toward an activity, not a specific set of rules.

  The checklist asks, "Does this object have the features?" Wittgenstein asks, "How is this word used here?" The wandering is a game not because it shares features with chess, but because it functions similarly in the lives of the speakers. It might be a way to pass time, or a subject of conversation. The "meaning" is its use in this context.

  Ultimately, Student A and B assume philosophy must provide a boundary. Wittgenstein argues that language has no single boundary. The wandering example proves that feature-based models (whether essentialist or cluster) are retrospective. They describe past uses but cannot govern future ones. Only an appeal to the shared, trained behavior of a community—forms of life—explains how a rule-less, solitary activity can legitimately inherit the name "game" without a definition to authorize it. Wittgenstein isn't offering a better definition of "game"; he is showing that the demand for one obscures how language works.

  ***

  **Marking Scheme (20 Marks Total)**

  **1. Critique of the "Cluster" Model (4 Marks)**
  *   **Must Hit:** Identify that Student A's "3 of 6" checklist is still a form of essentialism (seeking sufficient conditions) and fails if the wandering activity has *none* of the features yet is still called a game.
  *   **Common Error:** Treating "cluster concept" as synonymous with "family resemblance" without noting that checklists imply fixed boundaries Wittgenstein rejects.

  **2. Evaluation of Suits' Definition (4 Marks)**
  *   **Must Hit:** Distinguish between *stipulative* definition (Suits) and *descriptive* grammar (Wittgenstein). Acknowledge Suits isn't "wrong" empirically, but is irrelevant to ordinary use if the community calls wandering a "game."
  *   **Common Error:** Claiming Wittgenstein says definitions are impossible, rather than that they are philosophically idle for describing use.

  **3. Application of the "Wandering" Example (4 Marks)**
  *   **Must Hit:** Use the example to show that the label depends on the community's treatment/context, not the activity's intrinsic properties (no rules/win).
  *   **Common Error:** Analyzing the wandering activity itself (e.g., arguing whether it *is* fun) rather than analyzing the *application of the word*.

  **4. Role of Forms of Life / Training (4 Marks)**
  *   **Must Hit:** Explain that "forms of life" accounts for the *extension* of the concept (why we accept the new case) whereas checklists only categorize existing data.
  *   **Common Error:** Vaguely referencing "culture" or "biology" without connecting it to linguistic training or public practice.

  **5. Methodological Insight (4 Marks)**
  *   **Must Hit:** Conclude that Wittgenstein is not proposing a rival theory of meaning (like A & B), but dissolving the demand for a theory.
  *   **Common Error:** Concluding that Family Resemblance *is* Wittgenstein's theory of meaning.

  **Differentiation (A vs. B Grade)**
  *   **B Grade (Solid):** Hits all 5 points accurately. Clearly explains why the checklist fails and why Suits is stipulative. Uses the wandering example effectively.
  *   **A Grade (Distinctive Move):** The A answer explicitly identifies that Student A and B are committing the *same* error (the "craving for generality"). The A answer recognizes that Family Resemblance is a *reminder* of how we speak, not a *discovery* about concepts. The B student treats Family Resemblance as a positive thesis; the A student treats it as a therapeutic method.
