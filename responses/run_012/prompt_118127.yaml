      *   *Logical Implication:* If the starting point is *unjust* (e.g., stolen goods), Nozick's theory requires rectification *before* entitlement applies. However, the *logic* of the Chamberlain argument is that *any* patterned end-state principle is incompatible with liberty. It doesn't matter if D1 is just by the patterned theorist's standards; the point is that maintaining *any* pattern requires interference.
      *   *Nuance:* For Nozick's conclusion (that D2 is just) to hold, D1 must be just *by entitlement standards*. But the argument against the *patterned theorist* works regardless, because it shows their principle is unstable.
