      *   *Priority 5: Sign vs. Magnitude.* (Addressing Hunch 1). This is likely a semantic distinction within the model. Lowest priority.

  6.  **Refining the "Philosopher without Experiments" Constraint:**
      *   Focus on formal modeling, conceptual analysis, normative ethics, and decision theory.
      *   Avoid empirical surveys or behavioral econ experiments (unless simulated).
      *   Focus on *principles* for coordination.

  7.  **Addressing Confidence and Uncertainty:**
