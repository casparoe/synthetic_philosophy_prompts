prompt: |-
  I'm advising a small funder who can back about four or five people for two years to work on the unilateralist's curse and the family of problems around it -- many independent actors, each unsure whether their action helps or hurts. Which open questions here are actually worth that, and in what order? I want the reasoning more than the list: what's upstream of what, what a philosopher can make real progress on without running experiments, and what would move a question up or down over the next year or two. A few things I keep wondering whether they're genuine gaps or already basically settled: whether the curse is really about uncertainty over the sign of your impact versus uncertainty over its magnitude, what happens once actors can cheaply talk to each other or correlate their choices, whether there's a mirror-image "unilateralist's blessing" for cases where sitting still is the dangerous move, and whether the whole thing is just a decision-theoretic artifact that evaporates under some accounts of choice under uncertainty. Sort the questions by how much else depends on them, tell me which of my hunches is a dead end, and be explicit about how confident you are in the ranking -- call out the one judgment you're least sure of.
