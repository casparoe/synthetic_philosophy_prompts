answer: |-
  Here is a prioritized research agenda for a small theoretical team (4–5 people, 2 years), sorted by upstream dependency. The logic is: **if the upstream question resolves one way, the downstream questions either vanish or change character entirely.**

  ### 1. Decision-Theoretic Robustness (The "Existence" Check)
  **Question:** *Does the Unilateralist's Curse (UC) persist under acausal decision theories (FDT/UDT) or only under Causal Decision Theory (CDT)?*

  *   **Why it is first:** The original formulation (Bostrom et al., 2016) assumes agents are causally independent but logically correlated only via shared evidence. If agents reason using Functional Decision Theory (FDT), they treat their decision as outputting the same result as other similar agents. If "I decide not to launch," FDT implies "other similar agents also decide not to launch." This could internally solve the curse without external norms.
  *   **The Work:** Formal modeling. Map the UC onto CDT, EDT, and FDT frameworks. Determine if the curse is a feature of *causal independence* or *epistemic independence*.
  *   **Dependency:** Everything downstream depends on this. If the curse evaporates under FDT, the agenda shifts to "promoting FDT reasoning." If it persists (because agents have different priors or algorithms), the rest of the agenda stands.
  *   **Dynamic Trigger:** **Move Up** if AI alignment research increasingly converges on FDT/UDT as the correct framework for autonomous agents. **Move Down** if the field consensus solidifies around CDT for human-scale policy.

  ### 2. Epistemic Architecture (Sign vs. Magnitude & Priors)
  **Question:** *Is the curse driven by uncertainty over the sign of impact, the magnitude, or heterogeneous priors?*

  *   **Why it is second:** You asked if this is settled. It is *mostly* settled, but there is a gap regarding **higher-order uncertainty**. The standard model assumes agents share a prior but receive noisy signals. In reality, actors often have fundamentally different worldviews (heterogeneous priors). If the curse persists even with common priors (sign uncertainty), norms are the solution. If it requires heterogeneous priors, the solution is epistemic convergence, not behavioral restraint.
  *   **The Work:** Conceptual analysis and probability modeling. Distinguish between "I don't know if this bomb works" (sign) vs. "I know it works but don't know the fallout" (magnitude) vs. "We disagree on the value of fallout" (priors).
  *   **Dependency:** Determines *what* needs to be coordinated. If it's sign uncertainty, we need deliberation. If it's heterogeneous priors, we need meta-ethics or value learning.
  *   **Dynamic Trigger:** **Move Up** if real-world cases (e.g., gain-of-function research) show actors disagree on values, not just facts.

  ### 3. Correlation & Communication Thresholds (The "Fix")
  **Question:** *How much communication or correlation is required to dissolve the curse?*

  *   **Why it is third:** Once we know the curse is real (Q1) and what drives it (Q2), we need to know if "cheap talk" solves it. If agents can simply say "I think this is bad," does the curse break? Game theory suggests cheap talk fails with heterogeneous priors or if lying is beneficial. We need to find the **threshold of correlation** required to make the unilateralist's restraint rational.
  *   **The Work:** Game-theoretic modeling. Analyze signaling games where agents have partial common interests. Define the "deliberation threshold": How many actors must agree before action is permissible?
  *   **Dependency:** This dictates the policy recommendation. If cheap talk works, fund communication forums. If it doesn't, fund binding norms.
  *   **Dynamic Trigger:** **Move Up** if digital coordination tools (Loomio, prediction markets) make correlation cheaper, changing the cost-benefit analysis of deliberation.

  ### 4. Normative Derivation (The "Action")
  **Question:** *What is the precise normative principle agents should follow?*

  *   **Why it is fourth:** Only after knowing the mechanics (Q1–Q3) can you prescribe a norm. Is it a "Principle of Conformity" (do what you think the group would decide)? Or a "Principle of Restraint" (act only if certainty > threshold)?
  *   **The Work:** Moral philosophy and normative ethics. Reconcile the UC with individual moral responsibility. Does the curse create a collective obligation that overrides individual conscience?
  *   **Dependency:** Relies on the previous three to be actionable.
  *   **Dynamic Trigger:** **Move Down** if Q3 shows that technical coordination solves the problem without needing new moral norms.

  ### 5. The Inverse Case ("Unilateralist's Blessing")
  **Question:** *Is there a symmetric paralysis problem where inaction is the danger?*

  *   **Why it is fifth:** This is logically symmetric but practically distinct due to omission bias. If the status quo is catastrophic (e.g., unaligned AI is inevitable unless *someone* intervenes), the UC logic suggests waiting for consensus could be fatal.
  *   **The Work:** Comparative case analysis. Apply the models from Q1–Q3 to "savior" scenarios.
  *   **Dependency:** Depends on the formalism established in Q1–Q4.
  *   **Dynamic Trigger:** **Move Up** if the geopolitical landscape shifts toward "emergency action" scenarios (e.g., pandemic response, AI arms races) where speed outweighs safety.

  ---

  ### Evaluation of Your Hunches

  1.  **"Sign vs. Magnitude Uncertainty"**: **Mostly a Dead End.**
      *   *Reasoning:* Mathematically, these are parameters of the same distribution. Unless you are investigating *higher-order* uncertainty (uncertainty about the distribution itself), distinguishing them doesn't change the structural solution. Don't fund a dedicated project on this; treat it as a modeling parameter in Q2.
  2.  **"Cheap Talk / Correlation"**: **High Value.**
      *   *Reasoning:* This is the most actionable lever. If the curse is just a communication friction problem, the solution is infrastructure, not philosophy. This is the pivot point between "we need new norms" and "we need better meeting software."
  3.  **"Unilateralist's Blessing"**: **Derivative.**
      *   *Reasoning:* It is a genuine gap, but it is downstream. Solve the curse first; the blessing is just the inverse variable. Funding a dedicated team for this prematurely risks solving a symmetric problem with the wrong tools.
  4.  **"Decision-Theoretic Artifact"**: **Critical Validity Check.**
      *   *Reasoning:* This is the highest risk. If the UC is just an artifact of CDT, the whole research program is solving a phantom problem. This must be the first 6 months of work.

  ---

  ### Confidence & Uncertainty

  **Confidence in Ranking:** **High.**
  The dependency logic is robust. You cannot prescribe norms (Q4) if you don't know if communication solves the problem (Q3), and you can't analyze communication if the problem vanishes under different decision theories (Q1).

  **The Judgment I Am Least Sure Of:**
  I am least certain about the **tractability of Question 1 (Decision-Theoretic Robustness)** within a 2-year timeframe.
  *   *Why:* The debate between CDT and FDT is philosophically dense and notoriously resistant to consensus. There is a significant risk that your team spends 18 months debating the foundations of decision theory without producing a conclusive answer on whether the UC survives the transition.
  *   *Mitigation:* Set a hard "stop-loss" on Q1. If the team cannot model the UC under FDT within 6 months, assume the curse holds for *human* agents (who intuitively reason causally) and proceed to Q2. Humans may be CDT-agents even if ideal agents are not.

  ### Summary Recommendation for the Funder
  Allocate **50% of capacity to Q1 and Q2** (Foundations). If the curse isn't real or is purely epistemic, Q3–Q5 are waste. Allocate **30% to Q3** (Coordination), as this yields the most practical policy value. Allocate **20% to Q4/Q5** (Norms/Inverse) only as output generation once the models are stable.

  **Do not fund empirical experiments.** With 4–5 people and 2 years, you cannot run meaningful behavioral econ studies. Stick to formal modeling and conceptual analysis. The value here is in clarifying the *logic* of the trap, not measuring how often humans fall into it.
