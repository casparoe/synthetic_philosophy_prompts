  2.  **Analyze the "Unilateralist's Curse" (UC):**
      *   *Origin:* Bostrom, Douglas, & Sandberg (2016).
      *   *Core Idea:* When many actors can independently decide to undertake an initiative, and they care about the common good, the initiative is more likely to be undertaken even if it's harmful, because the probability that *at least one* person thinks it's good increases with the number of actors, even if the expected value is negative.
