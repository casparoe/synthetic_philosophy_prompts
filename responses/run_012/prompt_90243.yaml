      *   *Option B (Loop):* Too deterministic? Implies no progress, just endless suffering/rebuilding. Might undermine the "Still Rising" message completely.
      *   *Option C (Hybrid):* A spiral? A line that acknowledges the cycles?
      *   *Decision:* A Hybrid is usually the most nuanced solution for a historical society trying to balance progress with reality. However, the prompt asks for a *concrete course of action... precise enough to draw.* A spiral is hard to draw physically in a gallery without confusing traffic flow.
      *   *Better Hybrid:* A linear path that *visually* incorporates the cycles. Or, stick to the Line but modify the narrative. Or, stick to the Loop but modify the ending.
