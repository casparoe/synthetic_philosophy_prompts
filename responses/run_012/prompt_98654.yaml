answer: |-
  **Project Title:** Constitutive vs. Regulative Constraints in Graphemic Identity: A Structural Analysis of the Letter 'a'

  **1. Statement of the Problem**
  Orthographic systems rely on a stable mapping between graphic tokens and graphemic types. Yet, the criteria for this mapping remain opaque. Consider the lowercase 'a'. It appears as a single-story circle-with-stem (ɑ) in handwriting and many sans-serif typefaces, and a double-story looped form (a) in serif printing. Both are indisputably 'a'. However, a circle without a stem is an 'o'; a circle with a broken stem is a botched 'a'; a circle with a tail is a 'q'. 

  The central question of this project is: **What formal distinction separates the constraints that constitute a letter's identity from the constraints that govern its stylistic execution?**

  Current discourse tends to conflate *identity conditions* (what makes a mark an instance of 'a' rather than 'o' or noise) with *style conditions* (what makes an 'a' legible, aesthetic, or standard within a specific script). This conflation obscures why some radical deviations (e.g., the shift from Carolingian to Humanist minuscule) preserve letterhood, while minor deviations (e.g., closing the counter of an open 'a') can destroy it. This project proposes that letter identity is maintained by a layer of *constitutive rules* distinct from the *regulative rules* of style, and seeks to formalize this distinction.

  **2. Critique of Existing Frameworks**
  Four standard positions fail to resolve this boundary problem:
  *   **Stored Template:** Posits a mental image against which tokens are matched. This fails to account for recognition of novel typefaces or historical scripts never previously encountered by the reader.
  *   **Geometric Features:** Defines letters by topological invariants (e.g., number of holes, endpoints). This fails because 'a' and 'o' share topology (one counter), and 'a' varies topologically (one vs. two counters) without losing identity.
  *   **Prototype Theory:** Suggests letters are recognized by proximity to a central tendency. While this explains typicality, it cannot explain the *boundary*. A "bad" 'a' is still an 'a'; a "perfect" 'o' is not. Graded membership does not explain binary categorization in reading contexts.
  *   **Pure Convention:** Asserts identity is arbitrary social agreement. This is trivially true but explanatorily empty; it does not describe the *mechanism* by which convention grips the graphic mark, nor why some deviations are accepted while others are rejected within the same convention.

  Each position leaves the question open because they treat the threshold of identity as either psychological, geometric, or sociological, rather than structural.

  **3. Methodology and Work Plan (6 Months, Part-Time)**
  This project will not catalogue more letterforms. Cataloging describes variation; it does not explain the *limit* of variation. Instead, I will analyze *failure cases* and *boundary transgressions* to isolate the constitutive layer.

  *   **Months 1–2: Structural Taxonomy.** I will compile a restricted dataset of 'a' and 'ɑ' forms, focusing not on canonical examples but on "degenerate" cases: handwritten slips, typographic errors, and historical transitions where 'a' merges visually with 'u', 'o', or 'e'. I will code these not by geometry, but by *functional consequence*: at what point does a reader hesitate or miscategorize the mark in context?
  *   **Months 3–4: Formalizing the Distinction.** Drawing on distinctions in speech act theory (constitutive vs. regulative rules) and structural linguistics, I will draft a formal framework. The goal is to identify "invariant relations" (e.g., the relationship between stem and counter) that persist even when geometric properties change. I will test this framework against the dataset from Phase 1.
  *   **Months 5–6: Synthesis and Drafting.** I will produce a 10,000-word paper outlining the framework. The deliverable is not a final theory of all orthography, but a proof-of-concept demonstrating that separating identity from style resolves specific paradoxes in graphemic theory.

  **4. Scope and Limitations**
  The scope is strictly limited to the Latin lowercase 'a' (including the single-story ɑ variant). I will not address uppercase, other alphabets, or logographic systems. This limitation is necessary to achieve the required granularity. The project is theoretical; it does not involve empirical psycholinguistic testing (e.g., reaction time studies), which exceeds the budget and timeline. I will rely on existing experimental literature for data on recognition thresholds, citing references I will supply.

  **5. Conditions of Failure**
  Honesty regarding risk is essential. The project would fail if:
  1.  **Collapse of the Distinction:** If analysis shows that "constitutive" rules are merely "regulative" rules with higher social enforcement, the core hypothesis is false.
  2.  **Context Dependence:** If it proves impossible to define identity constraints without referencing specific semantic contexts (i.e., if 'a' is only identifiable via the word it inhabits), the structural approach is untenable.
  3.  **Indeterminacy:** If the boundary remains fuzzy despite the new framework, the project will have failed to provide the promised determinate answer.
  In these cases, the final report will document the collapse of the distinction as a negative result, which remains valuable for the field.

  **6. Landscape of the Field: Settled vs. Contested**
  To situate this proposal accurately, one must distinguish between what is established and what remains disputed in the study of graphemics and orthography.

  *   **Settled:** It is generally agreed that graphemes are abstract types instantiated by physical tokens. It is also agreed that visual form alone is insufficient for identification; context and reader competence play roles. There is consensus that variation is systematic, not random.
  *   **Contested:** There is no consensus on the *locus* of graphemic identity. 
      *   *Cognitivists* argue identity is grounded in universal perceptual mechanisms or neural invariants. 
      *   *Structuralists* argue identity is purely relational within a specific system (e.g., 'a' is 'a' because it is not 'b'). 
      *   *Pragmatists* argue identity is an emergent property of communicative success, lacking fixed boundaries. 
      
  Furthermore, there is active disagreement regarding the status of allographs (variant forms of the same letter). Some theorists treat 'a' and 'ɑ' as distinct graphemes that function identically; others treat them as stylistic variants of a single grapheme. This project does not presuppose the resolution of this debate. Instead, it offers a methodological tool—the constitutive/regulative distinction—to clarify why this debate persists. The proposal does not claim the cognitivist or structuralist view is correct; rather, it suggests that both may be describing different layers of the same constraint system.
