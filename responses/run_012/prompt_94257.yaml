answer: |-
  In the mid-17th century, a centralized empire administered two adjacent highland valleys, identical in soil composition, altitude, disease vector prevalence, mineral endowment, and indigenous ethnic composition, separated only by a minor watershed. A reform decree intended to standardize land tenure and limit executive discretion was dispatched from the capital to both provincial governors. In Valley A, the courier carrying the sealed decree was ambushed by bandits unrelated to local politics, destroying the document; the local governor, assuming the decree never arrived or was revoked, continued traditional extractive practices unchecked. In Valley B, the courier arrived safely; the decree was registered, creating a legal precedent that bound future governors and empowered local landholders to challenge expropriation. The ambush was a random crime of opportunity on a road segment statistically identical to the safe route, intelligible as having easily occurred on the other road, and unrelated to the valleys' economic potential.

  **1. Predictions by Paradigm**
  An **institutions-first economist** predicts sharp divergence: Valley B will develop higher income per capita and greater stability because secure property rights incentivize investment, while Valley A will stagnate under extractive predation. A **geography-first economist** predicts convergence: since the fundamental determinants of productivity (soil, climate, disease) are identical, long-run economic outcomes must equalize regardless of transient administrative paperwork; any observed divergence is temporary noise. A **culture-first economist** also predicts convergence: since antecedent culture (norms, trust, work ethic) is held fixed, the behavioral response to the legal shock should be uniform; if the culture supports growth, both will grow, and if not, neither will, rendering the institutional shock irrelevant.

  **2. Identificatory Feature and Relaxation**
  The feature doing the identificatory work is the **exogeneity of the courier's fate relative to local economic conditions**. The ambush breaks the feedback loop between potential prosperity and institutional quality, acting as a natural experiment that assigns "inclusive" or "extractive" treatments randomly. If this feature is relaxed—for instance, if bandits systematically targeted valleys with higher stored wealth—the event becomes endogenous. The inference would then collapse, as the institutional difference would be a *result* of prior economic conditions rather than a cause of subsequent divergence, reintroducing the omitted variable bias the thought experiment seeks to eliminate.

  **3. Geographer's Attack and Reply**
  A geographer denying exogeneity would argue that **micro-topography determined the ambush risk**. Even if the valleys are identical, the road to Valley A might have passed through a ravine offering cover for bandits, whereas the road to Valley B was open plain; thus, geography caused the institutional divergence, not the random shock. The strongest reply is that the stipulation explicitly holds **transport infrastructure and terrain risk fixed**. The ambush was an act of human agency contingent on timing (e.g., the courier arrived at dusk rather than dawn), not structural geography. To argue otherwise is to claim that geography determines human choice deterministically, which conflates *constraint* with *outcome*.

  **4. Residual Identification Problem**
  Even in this maximally controlled hypothetical, a residual identification problem survives: **the indeterminacy of multiple equilibria**. If two societies with identical deep fundamentals (geography and culture) can lock into divergent stable states based on a random shock, then "institutional quality" is not a structural cause of development but an endogenous label for the equilibrium selected. The thought experiment identifies the *trigger* (the ambush) but fails to identify the *structural parameter* that allowed for two equilibria in the first place. We cannot know if prosperity in Valley B is caused by the property rights themselves or by the coordinated expectations the random shock facilitated. Thus, causal inference remains dependent on untestable assumptions about why the system permitted divergence despite identical fundamentals; the "institution" is revealed as a proximate mechanism, not a fundamental cause, and the true deep cause (the existence of multiple equilibria) remains unobserved.
