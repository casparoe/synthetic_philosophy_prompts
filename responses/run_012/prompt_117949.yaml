answer: |-
  **Setup and materials**
  Arrange six tables of three chairs each. Print eighteen sealed envelopes, labeled only with student numbers (1–18) for your tracking. Inside, place one "Judicial Charter" card. Distribute the four Charter types (A, B, C, D) as evenly as possible (5, 5, 4, 4) across the eighteen envelopes. Prepare eighteen voting paddles (cardstock red on one side, green on the other) and a stack of paper slips ("tokens"). Project a slide with five case summaries, revealed one per round.

  Before beginning, state only: "You are judges auditing influence cases. Your Charter defines how you earn tokens. Follow it strictly. Do not show your Charter to anyone. Vote simultaneously." Do not define manipulation, autonomy, or ethics. Do not explain that Charters differ. The room should feel like a compliance audit, not a philosophy seminar. Ensure pens are available for token tracking. You need no technology beyond a projector or printed case sheets. The secrecy of the Charter is the only critical constraint; if students compare cards early, the collision is ruined.

  **Rules of play**
  The game consists of five rounds. Each round represents one case of influence. You (the instructor) act as the Clerk, reading the case summary aloud and projecting it. Students act as Judges.

  **Turn Structure:**
  1.  **Case Presentation (3 mins):** Read the case. Students may ask clarifying questions of fact only (e.g., "Did the target know?"), which you answer neutrally.
  2.  **Deliberation (2 mins):** Students consult their sealed Charter. They must not speak to one another. They determine their verdict based *only* on the Charter's conditions.
  3.  **Verdict (1 min):** On your count, all students raise their paddle: Red (Manipulation) or Green (Legitimate).
  4.  **Scoring (2 mins):** Students check their Charter. Each Charter specifies token gains or losses based on the vote cast and the case facts. For example, a Charter might read: "If you voted Red and information was withheld, gain 1 token. If you voted Green and information was withheld, lose 1 token." Students record their own token count on paper. This forces them to internalize the rule even when it contradicts their intuition.
  5.  **Reset:** Collect no materials. Charters remain sealed.

  **Moves:** The only move is the vote. However, the Charter may include a "Veto" clause (e.g., "If you lose 2 tokens in one round, you may flip your vote, but you gain 0 tokens"). This adds tension without breaking secrecy.

  **Termination:** After Round 5, students stop. Total tokens are counted but not yet revealed. The game ends when you instruct them to place their Charters face-up on the table. Until this moment, no student should know another's Charter type. If a student refuses to play, they sit out; the data pool is large enough (18) to survive one dropout without losing statistical clarity. If a table goes off-script (talking), warn them that "auditors are watching," implying you track consistency.

  **Payoffs and scoring**
  Winning is defined individually: the student with the most tokens wins "Judicial Integrity." However, the pedagogical payoff relies on the distribution of Charters. Because Charters A, B, C, and D encode different logical tests (Route, Daylight, Motive, Endorsement), a single case will yield a split vote across the room.

  For the collision to be honest, the scoring must penalize intuition. If a student feels a case is benevolent but their Charter penalizes benevolence when secrecy is involved, they must lose tokens to vote their conscience. By tying tokens to consistency with the Charter rather than "correctness," you remove the incentive to guess your preference. They are rewarded for being good robots of their specific criterion.

  The distribution (5, 5, 4, 4) ensures that when Charters are revealed, there are enough voices per group to show a pattern rather than noise. If only one student had Charter B, their outlier vote looks like confusion. With five students, it looks like a coherent alternative jurisprudence. The token economy makes the cost of consistency tangible; they will feel the friction of applying a clean rule to a messy world.

  **Timeline for the hundred minutes**
  **00:00–00:10 (Setup):** Seat students, distribute envelopes and paddles. Read the introductory script. Emphasize secrecy and token tracking.
  **00:10–00:50 (Play):** Run the five rounds. Strict timekeeping is essential. 8 minutes per case keeps energy high. If a round drags, cut discussion time, not voting time.
  **00:50–01:00 (Reveal):** Instruct students to reveal Charters. Have them group physically or visually by Charter Type (A, B, C, D). Tally the votes for each case by Charter Type on the board.
  **01:00–01:40 (Debrief):** Facilitate the discussion mapping Charters to philosophical tests. Focus on the splits.
  **01:40–01:45 (Buffer):** Use any overrun from play to trim debrief. Do not skip the reveal.

  **Debrief**
  Begin by projecting the vote tally matrix: Cases down the side, Charter Types across the top. The visual gaps are your primary text.

  Map Charter A to the **Route Test** (bypassing reasoning). Point to Case 1 (The Nudge): Charter A voters likely voted Red (Manipulation) because reasoning was bypassed, while others voted Green. Ask Charter A students: "Did this feel like manipulation?" They will say yes, logically, but hesitate morally.

  Map Charter B to the **Daylight Test** (concealment). Point to Case 2 (Secret Meds): Charter B voters voted Red because of secrecy, despite the benevolent outcome. Ask the room: "Is transparency enough to legitimize saving a life against will?" This burns the Daylight criterion.

  Map Charter C to the **Motive Test** (benefit/standing). Point to Case 3 (Brutal Truth): Charter C voters voted Green because the intent was truth/benefit, ignoring the harmful timing. Ask: "Does good intent sanitize harm?"

  Map Charter D to the **Endorsement Test** (retrospective repudiation). Point to Case 4 (Trust Play): Charter D voters focus on whether the target would feel betrayed later.

  Highlight the **Belief/Desire Asymmetry** using Case 5 (Mood Music). Charter A (Route) calls this manipulation (bypasses reason). Charter C (Motive) calls it legitimate (benevolent). Ask: "If we change beliefs via reasons, it's education. If we change moods via music, is it engineering?" Do not settle this. Leave the asymmetry open as the residue of using one word ("manipulation") for distinct mechanisms. The goal is not to solve the definition but to show that the disagreement is structural, not sloppy.

  **What will predictably go wrong the first time I run it**
  1.  **Charter Leakage:** Students will peek at neighbors' cards. *Fix:* Frame the envelopes as "sealed evidence." If caught, do not shame; simply note in debrief that "contaminated data" explains why some votes didn't align with their revealed type.
  2.  **Rebellion:** Students will vote against their Charter to preserve moral comfort, losing tokens intentionally. *Fix:* Acknowledge this in debrief. "Who lost tokens to vote their conscience?" This validates the friction you intended.
  3.  **Time Creep:** Case discussions will overrun. *Fix:* Use a visible timer. Cut Case 5 if necessary; the asymmetry can be raised in closing remarks without a full round.
  4.  **Token Dishonesty:** Students may lie about scores. *Fix:* Emphasize that tokens are for self-tracking. The real score is the vote pattern, which is public.
  5.  **Instructor Bias:** You might nod when a "correct" philosophical view is voiced. *Fix:* Maintain neutral Clerk persona until the debrief.

  **What the activity cannot reproduce**
  This activity exposes the structural conflict between criteria but cannot resolve the normative question of which criterion *ought* to govern. It shows that "manipulation" is a cluster concept, but it does not tell students how to act when the criteria collide in real life. That synthesis requires you to step out of the Clerk role and lecture briefly at the very end. Additionally, the game abstracts away power dynamics; a boss manipulating an employee feels different than a friend manipulating a friend, regardless of the logical test. You must supply the context of power relations from the front of the room, as the mechanics treat all targets as equal agents.
