      *   *Clarification on Jaynes:* I need to make sure I explain *why* Jaynes gets 1/2. It's because he demands invariance under scaling and translation (the "straw" experiment), not just rotation. B hints at this but A shoots it down. I need to clarify that A is right that *rotation* isn't enough, but wrong that *maximal symmetry* leads to incoherence (it leads to uniqueness under Jaynes' criteria).
