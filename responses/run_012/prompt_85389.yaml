prompt: |-
  I have a set of gut verdicts about comparisons that flip when the data are split, and I want to know what principle, if any, they add up to. In each case I give the numbers and what I think.

  1. A trial of drug D against placebo, 100 patients per arm. D happened to be given mostly to the sicker patients: among mild cases D saved 9 of 10 and placebo 72 of 90; among severe cases D saved 36 of 90 and placebo 2 of 10. Overall D saved 45%, placebo 74%. Verdict: D works; the overall comparison is the misleading one.

  2. Two intensive care units, A and B, 100 patients each, with the same case mix on admission. A ventilates almost everyone: 90 ventilated, 45 survived, and 8 of its 10 unventilated patients survived. B ventilates 20, of whom 9 survived, and 60 of its 80 unventilated patients survived. Overall A 53%, B 69%; within each group A is ahead. Verdict: B is the better unit. Who ends up on a ventilator is a consequence both of how sick the patient was and of the unit's own habits, so the two groups are not comparing like patients, and here I would rather read the bottom line.

  3. A firm pays men more than women overall, but within every job title women earn at least as much as men. Verdict: the within-title comparison does not show the firm is fair, because who ends up in which title is part of what I am asking about. I go with the overall gap.

  4. A crop trial where the reversal appears only when the plots are split by which of two technicians recorded the yields. Verdict: nothing here; I would report the overall difference and treat the split as noise.

  5. Life expectancy in two countries. Country A has a much younger population and a slightly higher crude death rate, but lower death rates in every age band. Verdict: both numbers look right to me, for different questions — the crude rate for how likely a randomly chosen resident of A is to die this year, the age-adjusted one for whose health system is doing better — and I cannot tell whether that makes my verdicts inconsistent.

  6. The case I keep going back and forth on: two diets compared on weight loss, with results split by how closely participants stuck to their diet. Adherents do better on both diets. Sticking to a diet is partly a matter of what the diet is like to live with and partly a matter of the person.

  I suspect the principle is causal: pool the data unless the variable I am splitting on is a common cause of both the treatment and the outcome, in which case split. Is that right, or does one of my verdicts have to go? State the principle as precisely as you can, say which verdict it cannot accommodate, and tell me what it implies for a case I have not given — a variable that is a common cause of treatment and outcome but is itself partly shaped by the treatment, such as a severity score taken a few days in. If no single principle fits, give me the two best candidates and what each costs me. I would also like to know whether the principle is genuinely about causes or is only the thin instruction to answer the question that was asked, and if it is the latter, whether that is a defect.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Input:** Six scenarios involving Simpson's Paradox (or reversal paradoxes) where aggregate data and stratified data tell different stories. The user provides their "gut verdict" for each.
      *   **Task:** Identify the underlying principle connecting these verdicts. Evaluate the user's proposed principle ("pool unless the splitting variable is a common cause..."). Check for consistency. Address a specific edge case (mediator/confounder hybrid). Determine if the principle is causal or merely about answering the specific question.
      *   **Constraints:** State the principle precisely. Identify which verdict (if any) conflicts. Address the "severity score" edge case. Offer two candidate principles if one doesn't fit. Discuss the causal vs. question-based nature of the principle.

  2.  **Analyze the Six Scenarios:**

      *   **Case 1 (Drug Trial):**
          *   *Data:* Drug D given to sicker patients (confounding by indication). Stratified (by severity) shows D is better. Aggregate shows Placebo is better.
          *   *Verdict:* D works (trust stratified).
          *   *Structure:* Severity is a *confounder* (causes selection into treatment and affects outcome).
          *   *Causal Logic:* Adjust for confounders to estimate causal effect.

      *   **Case 2 (ICU Units):**
          *   *Data:* Unit A ventilates more. Stratified (by ventilation status) shows A is better. Aggregate shows B is better.
          *   *Verdict:* B is better (trust aggregate).
          *   *Structure:* Ventilation status is a *mediator* (Unit policy $\to$ Ventilation $\to$ Survival) AND a *collider* (affected by sickness and unit policy). Actually, looking closely: "Who ends up on a ventilator is a consequence both of how sick the patient was and of the unit's own habits."
          *   *Causal Logic:* Ventilation is on the causal pathway from Unit to Survival (partially). Adjusting for it blocks part of the unit's effect (the part mediated by ventilation strategy). We want the *total* effect of the Unit.
          *   *Note:* The user says "within each group A is ahead." This implies stratified favors A, aggregate favors B. User trusts aggregate. This aligns with *not* adjusting for a mediator.

      *   **Case 3 (Pay Gap):**
          *   *Data:* Men paid more overall. Within title, women paid same/more.
          *   *Verdict:* Firm is unfair (trust aggregate).
          *   *Structure:* Job Title is a *mediator* (Discrimination $\to$ Hiring/Promotion $\to$ Title $\to$ Pay) OR a *proxy* for the outcome of interest (equity in the whole process).
          *   *Causal Logic:* If the question is "Is there discrimination in the firm?", title allocation is part of the discrimination. Adjusting for title hides the mechanism. We want the total effect of Gender on Pay.

      *   **Case 4 (Technicians):**
          *   *Data:* Reversal when split by Technician.
          *   *Verdict:* Trust aggregate (treat split as noise).
          *   *Structure:* Technician is likely a *collider* or just random noise/post-treatment variation unrelated to causal mechanism. If technicians were assigned randomly or arbitrarily, stratifying reduces power or introduces bias if technician assignment depended on something else.
          *   *Causal Logic:* If Technician is not a confounder, don't adjust.

      *   **Case 5 (Life Expectancy):**
          *   *Data:* Country A younger, higher crude death rate, lower age-specific rates.
          *   *Verdict:* Both right for different questions (Crude = risk to random resident; Adjusted = health system quality).
          *   *Structure:* Age is a *confounder* for Health System $\to$ Death, but Age Distribution is a *feature* of the population.
          *   *Causal Logic:* Distinguishes between *effect of treatment* (health system) vs. *burden of disease* (crude rate).

      *   **Case 6 (Diets/Adherence):**
          *   *Data:* Split by adherence. Adherents do better on both.
          *   *Verdict:* User is unsure ("keep going back and forth").
          *   *Structure:* Adherence is a *post-treatment variable* (Mediator + Confounder). Treatment affects adherence (palatability), but patient traits also affect adherence (willpower).
          *   *Causal Logic:* This is the classic "Per-Protocol" vs. "Intention-to-Treat" (ITT) debate. ITT (aggregate) answers "What happens if I prescribe this?" Per-Protocol (stratified) answers "What happens if I take this?" but is biased by confounding (willpower).

  3.  **Evaluate the User's Proposed Principle:**
      *   *User's Principle:* "Pool the data unless the variable I am splitting on is a common cause of both the treatment and the outcome, in which case split."
      *   *Translation:* Adjust for Confounders, do not adjust for Non-Confounders.
      *   *Check against Cases:*
          *   Case 1 (Severity): Common cause (Sickness $\to$ Treatment, Sickness $\to$ Outcome). Principle says Split. Verdict says Split. (Match)
          *   Case 2 (Ventilation): Unit $\to$ Ventilation $\to$ Survival. Ventilation is *not* a common cause of Unit and Survival (Unit causes Ventilation). Principle says Pool. Verdict says Pool. (Match)
          *   Case 3 (Job Title): Gender $\to$ Title $\to$ Pay. Title is not a common cause of Gender and Pay. Principle says Pool. Verdict says Pool. (Match)
          *   Case 4 (Technician): Not a common cause. Principle says Pool. Verdict says Pool. (Match)
          *   Case 5 (Age): Age causes Death. Does Age cause Country? No. But Age Distribution differs. This is standardization. Principle is a bit fuzzy here but generally aligns with "Adjust for confounders of the *system* effect."
          *   Case 6 (Adherence): Adherence is caused by Diet. It is *not* a common cause of Diet and Outcome (Diet causes Adherence). Principle says Pool (ITT).
      *   *Problem:* The user is unsure on Case 6. The principle says Pool. But often we *want* to know the biological efficacy (which requires handling adherence). However, stratifying by adherence introduces bias (collider bias/confounding by patient traits). So the principle holds: Pooling (ITT) is the unbiased causal estimate of *assignment*. Stratifying is biased.
      *   *Refinement:* The principle needs to distinguish between *pre-treatment* confounders and *post-treatment* variables. The user's definition "common cause of treatment and outcome" implies pre-treatment.
      *   *The Edge Case:* "Severity score taken a few days in." Treatment affects severity, Severity affects outcome, Baseline Severity affects Treatment. This is a time-varying confounder affected by prior treatment.
      *   *User's Worry:* Is the principle genuinely causal or just "answer the question"?

  4.  **Synthesize the "Principle":**
      *   The governing framework is **Causal Inference / Directed Acyclic Graphs (DAGs)**.
      *   Specifically, the **Back-Door Criterion** (adjust for confounders) vs. **Front-Door/Total Effect** (do not adjust for mediators).
      *   The precise principle: **Adjust for pre-treatment confounders; do not adjust for post-treatment variables (mediators or colliders), unless using specific longitudinal methods (like g-methods) for time-varying confounders.**
      *   *Wait, Case 3 (Pay Gap):* Is the question causal? "Is the firm fair?" implies a causal question about Gender $\to$ Pay. Title is a mediator. If we want the *direct* effect of gender on pay (holding title constant), we adjust. If we want the *total* effect (including discrimination in hiring/promotion), we pool. The user chooses Pool. This implies the question is about the *total* effect of Gender.
      *   *Wait, Case 5 (Life Expectancy):* User says "Both numbers look right... for different questions." This admits the principle depends on the *question*, not just the causality.
      *   *Wait, Case 6 (Adherence):* User is unsure. Causal principle says Pool (ITT) for policy effect. Stratify is biased for biological effect unless using instrumental variables or similar.

  5.  **Addressing the Specific Questions:**
      *   *Is the user's principle right?* Mostly, but "common cause" is too simple. It needs to be "Pre-treatment confounder."
      *   *Which verdict does it not accommodate?* Case 6 is the trouble spot. If the user wants to know "Which diet is biologically superior?", pooling hides that. But stratifying is biased. The principle (Pool) gives the correct *unbiased* estimate of assignment, but maybe not the answer to the specific biological question.
      *   *The Edge Case (Severity Score mid-trial):* This is a **Time-Varying Confounder affected by Treatment**. Standard adjustment (stratification/regression) introduces bias (collider bias/over-adjustment). You need **G-methods (G-formula, IPTW, Structural Nested Models)**.
      *   *Causal vs. Question:* It is genuinely about causes, *but* the "cause" you care about depends on the question (Total Effect vs. Direct Effect).

  6.  **Drafting the Response:**

      *   **Validation:** The user's intuition is remarkably sound and aligns with modern causal inference (Pearl, Hernán, Robins).
      *   **The Principle:** Refine "Common Cause" to "Pre-treatment Confounder." Use the terminology of **Total Effect vs. Direct Effect** and **Pre-treatment vs. Post-treatment**.
      *   **The Verdict Check:**
          *   1, 2, 3, 4 fit the "Back-Door" vs. "Mediator" logic perfectly.
          *   5 fits the "Target Population" logic.
          *   6 is the pivot. The principle dictates Pooling (ITT) for unbiasedness. Stratifying is biased. The user's uncertainty is justified because the *question* might be about biological efficacy (Direct Effect), but the *method* (stratification) is wrong for that.
      *   **The Edge Case:** Explicitly identify this as a "Time-Varying Confounder Affected by Treatment." Explain why standard splitting fails (bias) and what works (G-methods).
      *   **Causal vs. Question:** It is causal, *but* "Cause" is relative to the intervention defined. (Intervention on assignment vs. Intervention on adherence).
      *   **Two Candidates:**
          1.  **The Causal DAG Principle:** (Adjust for confounders, never mediators). Cost: Doesn't help if you want Direct Effects without bias.
          2.  **The Decision-Theoretic Principle:** (Which number informs the specific decision?). Cost: Requires defining the decision precisely.

      *   *Self-Correction on Case 3:* In discrimination cases, sometimes we *do* want the direct effect (equal pay for equal work). But the user says "who ends up in which title is part of what I am asking about." This explicitly defines the query as Total Effect. So the principle holds.

      *   *Refining the Edge Case:* If severity is measured *after* treatment starts, and treatment affects severity, and severity affects outcome... adjusting for it blocks the path of the treatment working *through* severity. But if severity also confounds *subsequent* treatment... this is the classic "Z" variable in longitudinal studies. Standard regression biases the result.

      *   *Final Polish:* Ensure the tone is respectful of the user's deep intuition. They have essentially rediscovered the Back-Door Criterion and the Total/Direct Effect distinction without the jargon.

      *   *Structure:*
          1.  Affirm the intuition (Causal Inference).
          2.  State the Precise Principle (Back-Door + Total Effect).
          3.  Analyze the Verdicts (Case 6 is the friction point).
          4.  Address the Edge Case (Time-varying confounding).
          5.  Address Causal vs. Question (It's both).
          6.  Two Candidates (Causal Structure vs. Decision Context).

  7.  **Final Review of the "Edge Case":**
      *   Variable: Severity score taken a few days in.
      *   Causal structure: Treatment $\to$ Early Severity $\to$ Outcome. Also Baseline Severity $\to$ Treatment. Also Baseline Severity $\to$ Early Severity.
      *   If we adjust for Early Severity: We block the indirect effect (Treatment $\to$ Severity $\to$ Outcome). We might also open collider paths if there are unmeasured factors.
      *   Verdict: Do not simply split/adjust. Use G-methods. If forced to choose between Pool/Split for a simple analysis: Pool (ITT) preserves randomization integrity. Split biases the estimate.

  8.  **Final Review of Case 6 (Adherence):**
      *   User says "Sticking to a diet is partly a matter of what the diet is like... and partly a matter of the person."
      *   This confirms Adherence is a Mediator (Diet $\to$ Adherence) and a Confounder (Person $\to$ Adherence $\to$ Outcome).
