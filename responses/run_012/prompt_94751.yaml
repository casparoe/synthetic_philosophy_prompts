  ### Brainstorming Distinctions

  To build this tree, we must discard distinctions that are merely verbal or metaphysical without decision-theoretic bite. For instance, debating "free will" is irrelevant unless it changes the recommendation in Newcomb's Problem; we can stipulate the predictor's accuracy as a brute fact. Similarly, distinguishing "rationality as winning" from "rationality as reasoning" often collapses: if a theory recommends actions that lose money in these specific setups, its proponents usually redefine "winning" to match, so we must sort by *action recommendations in cases* rather than slogans.

  The distinctions that actually do the work are:
  1.  **Causal Efficacy:** Does a rational act require a causal link to the good outcome? (Separates CDT from the rest).
  2.  **Unit of Evaluation:** Are we evaluating the token act *now* or the algorithm/policy that generated it? (Separates Act-based theories like CDT/EDT from Policy-based theories like FDT).
  3.  **Temporal/Informational Sensitivity:** Does learning new information (e.g., the coin landed Tails) sever the normative link to the ex-ante optimal plan? (Separates EDT from FDT in Counterfactual Mugging).
  4.  **Binding Force:** If the policy is the unit of evaluation, does logical consistency bind the agent, or is external pre-commitment required? (Separates FDT from "Sophisticated" views).

  I am **85% confident** that these four dimensions capture the logical space of the major positions. The remaining uncertainty lies in whether "Decision Procedure" and "Policy" views are genuinely distinct in this space or merely different labels for the same logical leaf.

  ***

  ### The Decision Tree

  **Node 1: Metaphysical Coherence**
  *Question:* Is a scenario involving a perfect predictor of your free choice conceptually coherent, or does it entail a contradiction (e.g., violating free will or logic)?
  *   **No:** Go to **Leaf A**.
  *   **Yes:** Go to Node 2.

  **Node 2: Causal Constraint**
  *Question:* At the moment of choice, is it a necessary condition for an act to be rational that the act *causally influences* the payoff-relevant fact? (i.e., If the act cannot physically change the outcome, is it irrational to perform it for the sake of that outcome?)
  *   **Yes:** Go to **Leaf B**.
  *   **No:** Go to Node 3.

  **Node 3: Unit of Evaluation**
  *Question:* Should rationality assess the specific *token act* you are performing now (given your current information), or the general *policy/algorithm* that you are instantiating?
  *   **Token Act:** Go to Node 4.
  *   **Policy/Algorithm:** Go to Node 5.

  **Node 4: Evidential Screening**
  *Question:* If you are evaluating the token act, does learning the state of the world (e.g., being told the coin landed Tails in Counterfactual Mugging) break the normative link to the action that would have been optimal ex-ante?
  *   **Yes (Link Broken):** Go to **Leaf C**.
  *   **No (Link Holds):** *Diagnosis:* This combination is logically unstable (evaluating acts but ignoring current evidence to follow ex-ante plans without policy binding). Go to **Leaf C** (collapses to Evidential) or **Leaf D** (if insisting on act-based resoluteness). *For this tree, we route to Leaf C.*

  **Node 5: Binding Mechanism**
  *Question:* If you are evaluating the policy, does the logical connection between your decision and the predictor's simulation bind you to the ex-ante optimal choice *without* external pre-commitment technology?
  *   **Yes (Logical Binding):** Go to **Leaf D**.
  *   **No (Contractual Binding):** Go to **Leaf E**.

  ***

  ### Scoring Key and Leaf Definitions

  | Path | Answers | Leaf Position | Standard Name / Label |
  | :--- | :--- | :--- | :--- |
  | **1-No** | Incoherent | **Leaf A** | **The Ill-Posed View** (e.g.,某些 Compatibilist rejections, Logical Impossibility views) |
  | **1-Yes, 2-Yes** | Coherent, Causal Req. | **Leaf B** | **Causal Decision Theory (CDT)** |
  | **1-Yes, 2-No, 3-Token, 4-Yes** | Coherent, No Causal, Act, Screening | **Leaf C** | **Evidential Decision Theory (EDT)** |
  | **1-Yes, 2-No, 3-Policy, 5-Yes** | Coherent, No Causal, Policy, Logical | **Leaf D** | **Functional/Timeless Decision Theory (FDT/TDT)** |
  | **1-Yes, 2-No, 3-Policy, 5-No** | Coherent, No Causal, Policy, Contract | **Leaf E** | **Sophisticated Pre-Commitment View** |

  **Leaf Diagnoses & Case Recommendations:**

  *   **Leaf A (Ill-Posed):** Rejects the premises.
      *   *Newcomb:* Problem dissolves.
      *   *Mugging:* Problem dissolves.
      *   *Confidence:* **60%**. (Many argue coherence, but a minority hold this firmly).
  *   **Leaf B (CDT):** Rationality requires causal leverage.
      *   *Newcomb:* Two-Box (causal dominance).
      *   *Mugging (Informed):* Don't Pay (payment causes loss, no causal link to coin).
      *   *Mugging (Pre-commit):* Pre-commit if possible, but don't pay if surprised.
      *   *Blackmail:* Don't Pay (once threatened, payment doesn't causally un-arm it).
      *   *Confidence:* **95%**. (Standard definition).
  *   **Leaf C (EDT):** Rationality maximizes expected utility conditional on the act, but acts are evaluated token-by-token.
      *   *Newcomb:* One-Box (act is strong evidence of money).
      *   *Mugging (Informed):* Don't Pay (knowledge of Tails screens off the correlation; paying is bad news and costs money).
      *   *Mugging (Pre-commit):* Pre-commit to Pay (ex-ante correlation exists).
      *   *Blackmail:* Don't Pay (if threat is already armed, paying is just loss; if not armed, paying is unnecessary).
      *   *Confidence:* **90%**.
  *   **Leaf D (FDT/TDT):** Rationality evaluates the policy; logical counterfactuals bind the agent.
      *   *Newcomb:* One-Box (policy determines prediction).
      *   *Mugging (Informed):* Pay (policy of paying wins ex-ante; logical link holds despite info).
      *   *Mugging (Pre-commit):* Pay (policy binding).
      *   *Blackmail:* Don't Pay (policy of not paying prevents the threat from being armed in the counterfactual).
      *   *Confidence:* **85%**.
  *   **Leaf E (Sophisticated Pre-Commitment):** Rationality acknowledges policy optimality but requires external binding to enforce it.
      *   *Newcomb:* Two-Box (without contract), but wishes they had bound themselves.
      *   *Mugging (Informed):* Don't Pay (without contract).
      *   *Mugging (Pre-commit):* Pay *only if* contract signed.
      *   *Blackmail:* Don't Pay (unless contract to pay exists to deter).
      *   *Confidence:* **75%**. (This view is often a strategic admission by CDT agents rather than a distinct normative theory).

  ***

  ### Logical Space Analysis: Unoccupied Combinations

  1.  **Coherent + Causal Constraint + Policy Evaluation:**
      *   *Diagnosis:* **Incoherent.** If you require causal influence for rationality (Node 2), you cannot consistently evaluate policies based on acausal outcomes (Node 3/5). A policy to "Pay in Mugging" has negative causal utility. No serious theory occupies this space.
  2.  **Coherent + No Causal + Token Act + No Screening (Node 4 "No"):**
      *   *Diagnosis:* **Unattractive/Unstable.** This view claims to evaluate token acts but insists on following ex-ante plans even when current evidence screens off the benefit. This is effectively "FDT light" but lacks the metaphysical grounding (logical binding) to justify ignoring current evidence. It is usually defended as "Resolute Choice" but collapses into FDT or CDT upon scrutiny.
  3.  **Decision Procedure vs. Policy (Leaf D Split):**
      *   *Diagnosis:* **Verbal/Collapsed.** The prompt requested distinct leaves for "evaluate decision procedures" and "evaluate policies across branches." In this logical space, these map to the same path (Node 5 "Yes"). Distinguishing them requires a nuance about *how* the procedure is evaluated (e.g., rule-utilitarian vs. subjunctive) that does not change the action recommendations in the specified cases. I have flagged this as a single leaf (Leaf D) because the tree cannot separate them based on case outcomes.

  ***

  ### Confidence and Uncertainty Flag

  **Confidence in Substantive Claims:**
  *   **CDT/EDT/FDT distinctions:** **High (90%+).** These are well-trodden in the literature.
  *   **Ill-Posed View:** **Medium (60%).** While common in introductory critiques, few professional decision theorists hold this as a primary working view.
  *   **Sophisticated Pre-Commitment (Leaf E):** **Medium-Low (75%).** This is often a description of a CDT agent's regret rather than a standalone normative theory.

  **Least Sure Point:**
  I am **least sure (40% confidence)** about the stability of **Leaf E (Sophisticated Pre-Commitment)** as a distinct position from **Leaf B (CDT)**.
  *Reasoning:* A CDT agent admits they *wish* they had pre-committed. The "Pre-Commitment Only" view claims paying is *irrational* without the contract but *rational* with it. However, if the contract is just a causal penalty for breaking, CDT already accounts for that. If the contract is non-causal (a promise), CDT says breaking it is rational if it maximizes utility. Therefore, a view that says "You are obligated by the promise even without causal penalty" is effectively FDT (Leaf D). If it says "You are not obligated without causal penalty," it is CDT (Leaf B). Leaf E attempts to sit between them ("Obligated only if external tech exists"), which may be an empty set or merely a description of CDT agents using causal tools. I have included it to satisfy the prompt's requirement, but I flag it as the most theoretically precarious node in the construction.
