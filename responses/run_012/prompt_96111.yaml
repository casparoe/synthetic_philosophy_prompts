answer: |-
  ### Brainstorming Axes and Rejected Distinctions

  To build this tree, we must isolate the structural commitments that generate disagreement, filtering out distinctions that merely track our intuitions rather than ground them. I considered and rejected **Rationality** as an axis: labeling a binding act "rational" is usually the conclusion of the argument, not the premise (the tempted self finds the mast irrational; the binding self finds it rational). I also rejected **Public vs. Private** as a primary sorter, since your group's frustration stems precisely from the ambiguity there; that must be a node, not a given. Finally, I dismissed **Hard vs. Soft** constraints as too vague; "stickiness" (practical vs. formal revocability) does the necessary work without presupposing the metaphysics. The three axes you requested—Mechanism, Temporal Authority, and Revocability—are robust because they separate *how* the bind works, *who* has the right to decide, and *when* the decision can be undone.

  ***

  ### The Precommitment Decision Tree

  **Q1 (Continuity):** When you move from the case of Odysseus at the mast to a constitutional eternity clause, are you applying the same normative rules to a larger scale, or does the political context fundamentally change the nature of the agency involved?
  *   **If Same Rules:** Go to **Q2**.
  *   **If Different Rules:** Go to **Q6**.

  **Q2 (Mechanism):** In the device you are evaluating, does the agent remove the option entirely (the mast), attach a cost to the option (a smoker's deposit contract), or transfer the authority to choose to another body (central bank independence)?
  *   **If Remove Option:** Go to **Q3**.
  *   **If Attach Cost:** Go to **Q9**.
  *   **If Transfer Authority:** Go to **Q7**.

  **Q3 (Temporal Identity):** Regarding the agent who binds and the agent who is bound (e.g., the lucid self vs. the psychotic self in a psychiatric advance directive), are these strictly the same entity over time, or are they distinct temporal stages with competing interests?
  *   **If Same Entity:** Go to **Q4**.
  *   **If Distinct Stages:** Go to **Q5**.

  **Q4 (Deflation Check):** If the self is the same entity, is the "binding" device doing anything more than expressing a strong current intention that happens to persist?
  *   **If Just Intention:** **Leaf A**.
  *   **If More Than Intention:** Go to **Q5**.

  **Q5 (Temporal Authority):** If the selves are distinct or the intention persists structurally, does the earlier self (binding moment) have the right to restrict the later self (tempted moment), or does the later self retain the right to override the earlier plan?
  *   **If Earlier Self Rules:** **Leaf B**.
  *   **If Later Self Rules:** **Leaf C**.
  *   **If Earlier Self Rules but Harms Later:** **Leaf D**.

  **Q6 (Political Mechanism):** In the political case (e.g., an entrenchment clause a later supermajority wants repealed), is the constraint binding the outcomes of legislation or only the procedures by which legislation is passed?
  *   **If Binding Outcomes:** Go to **Q7**.
  *   **If Binding Procedures:** **Leaf E**.

  **Q7 (Agency Source):** For the constraint to hold, must the authority be shifted to a distinct agent (like a court or bank), or can the legislature bind itself directly?
  *   **If Shifted to Distinct Agent:** **Leaf F**.
  *   **If Bound Directly:** Go to **Q8**.

  **Q8 (Constituent Power):** Does the power that created the constitution (the constituent power) retain the capacity to undo the constraints it created, even if the ordinary legislature cannot?
  *   **If Retains Capacity:** **Leaf G**.
  *   **If Cannot Undo:** Go to **Q9**.

  **Q9 (Revocability):** Is the device formally revocable by the agent at any time, or is it formally irrevocable for a set period or indefinitely?
  *   **If Formally Revocable:** Go to **Q10**.
  *   **If Formally Irrevocable:** **Leaf H**.

  **Q10 (Stickiness):** If the device is formally revocable, is it designed to be practically sticky (high transaction costs, like a sunset clause that requires re-authorization) or easily reversible?
  *   **If Practically Sticky:** **Leaf I**.
  *   **If Easily Reversible:** **Leaf J**.

  ***

  ### The Leaves

  **Leaf A: The Deflationary View**
  *   **Commitment:** "Precommitment" is just ordinary intention plus a story; there is no normative puzzle because there is no actual constraint.
  *   **Awkward Commitment:** It must explain why we feel genuinely bound by our past selves even when we know we could technically change our minds.

  **Leaf B: Self-Paternalism as Legitimate**
  *   **Commitment:** The binding moment has authority over the tempted moment to secure long-term welfare, validating the mast and psychiatric advance directives.
  *   **Awkward Commitment:** It must accept that a person can be legitimately coerced by their own past will against their current expressed consent.

  **Leaf C: Sovereignty of the Present Self**
  *   **Commitment:** The tempted moment always retains the right to override the past, making all irrevocable binds morally void though perhaps prudentially useful.
  *   **Awkward Commitment:** It renders constitutional entrenchment and long-term contracts normatively fragile, reducible to mere predictions of behavior.

  **Leaf D: Binding as Aggression**
  *   **Commitment:** If temporal selves are distinct, the binding self is effectively aggressing against the future self's autonomy.
  *   **Awkward Commitment:** It implies that saving one's future life via a binding directive is morally equivalent to assaulting a separate person.

  **Leaf E: The Proceduralist View**
  *   **Commitment:** Binding is legitimate only when it binds process rather than outcomes, allowing future majorities to decide substance but not rules.
  *   **Awkward Commitment:** It struggles to distinguish between a procedure that guarantees an outcome and an outcome itself.

  **Leaf F: The Agency-Shifting View**
  *   **Commitment:** Only binding by another party counts as real precommitment, validating central bank independence but rejecting self-binding.
  *   **Awkward Commitment:** It makes autonomy impossible, requiring an infinite regress of external agents to validate any constraint.

  **Leaf G: Constituent Power Cannot Bind**
  *   **Commitment:** The people who make the constitution can never be bound by it, so eternity clauses are void against the original sovereign.
  *   **Awkward Commitment:** It risks making all constitutional stability contingent on the continuous, active presence of the revolutionary sovereign.

  **Leaf H: Unnamed (Incoherent)**
  *   **Commitment:** The view that a political body can bind its outcomes irrevocably without shifting agency or retaining constituent power.
  *   **Awkward Commitment:** This position is incoherent because it claims a body is both sovereign and not sovereign simultaneously.

  **Leaf I: Unnamed (Unexplored)**
  *   **Commitment:** The view that formally revocable but practically sticky devices (like sunset clauses) carry the same normative weight as irrevocable ones.
  *   **Awkward Commitment:** This view is merely unexplored, as theorists usually collapse practical stickiness into either full binding or non-binding.

  **Leaf J: Unnamed (Unattractive)**
  *   **Commitment:** The view that a promise made to someone who has since died remains binding only if it is easily reversible.
  *   **Awkward Commitment:** This view is unattractive because it makes the obligation vanish the moment it becomes convenient to break it.

  ***

  ### Diagnostic Analysis

  **Indistinguishable Leaves:**
  The tree struggles to separate **Leaf B (Self-Paternalism)** and **Leaf E (Proceduralist)** if the reader believes that binding procedures *is* the only legitimate form of paternalism. Both validate the constraint but for different reasons (welfare vs. process). If a reader answers "Earlier Self Rules" in Q5 but also insists on "Binding Procedures" in Q6, the tree forces a choice between welfare and process that the reader may not see as mutually exclusive.

  **Unoccupied Combinations:**
  The combination of **Political Context + Remove Option + Distinct Stages + Earlier Self Rules + Irrevocable** leads to **Leaf H (Incoherent)**. This space is unoccupied because it posits a sovereign entity that can permanently remove its own future options without transferring agency, which violates the definition of sovereignty used in constitutional theory. It is not merely unattractive; it is conceptually unstable.

  **The Key Node:**
  **Q1 (Continuity)** does the most work in this tree. It is the node where your reading group's frustration lives.
  *   **If a reader flips their answer at Q1:** The entire downstream logic shifts. If they move from "Different Rules" to "Same Rules," they must suddenly apply personal autonomy constraints to constitutional design, likely forcing them from **Leaf G (Constituent Power)** to **Leaf B (Self-Paternalism)**. Conversely, if they move from "Same Rules" to "Different Rules," they can no longer justify the mast using the same logic as the eternity clause, fracturing their theory of agency into two incompatible domains. Flipping Q1 doesn't just change a verdict; it changes the ontology of the agent from a human being to a polity (or vice versa), rendering half the tree's subsequent questions about temporal identity irrelevant.
