prompt: |-
  I am a novelist about to begin a book whose central character has spent her working life arguing over what an emotion actually is. I want her intellectual world to ring true: the questions that occupy her should be ones that are genuinely unsettled among people who study emotion for a living, and they should be the kind that ramify, so that where she comes down on them quietly governs how she reads her colleagues, her marriage, and herself. I have a few months of reading and thinking before I start drafting, and I would rather spend them on the questions that will matter most to the book than on the ones that merely sound profound.

  Within the debate over whether emotions are judgments, perceptions, or feelings, then, which open questions would you place at the center of her work, and why those rather than the others? Give me an order and defend it. I care less about the list than about the reasoning: which questions are upstream of which, which are most likely to remain genuinely open a decade from now, which a careful reader with no training in the field could follow without my stopping to lecture, and which would actually change what happens in a scene or how she treats someone she loves. Tell me, too, what would move a question up or down your ranking.

  And please be candid about the reverse: if some of the grand-sounding questions are effectively closed, or are open only in a way that specialists find interesting and almost no one else would, say so plainly rather than padding the list. She is not a caricature of a scientist, and I don't want the book to turn on a question that was settled thirty years ago.

  Write this as continuous prose, the way you would write a long letter — no headings, no bullet points, no bold, no tables — and in American English.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** A novelist preparing to write a book about a character whose career is studying the nature of emotion.
      *   **Goal:** Identify the central intellectual questions that should occupy this character. These questions need to be genuinely unsettled, ramifying (affecting personal life, relationships, self-perception), accessible to a lay reader, and likely to remain open for a decade.
      *   **Constraints:**
          *   Continuous prose (long letter style).
          *   No headings, bullet points, bold, or tables.
          *   American English.
          *   Candid about closed questions (avoid outdated debates).
          *   Prioritize reasoning over the list itself (upstream/downstream, impact on scene/character).
          *   Explain what would move a question up or down the ranking.

  2.  **Deconstruct the Subject Matter (Philosophy/Psychology of Emotion):**
      *   *Major Theories:* James-Lange (physiology first), Cannon-Bard (simultaneous), Schachter-Singer (cognitive labeling), Appraisal Theory (judgments), Constructivism (Barrett), Basic Emotions (Ekman).
      *   *Key Debates:* Natural kinds vs. social constructs, cognition vs. sensation, universality vs. variability, conscious vs. unconscious, function vs. experience.
      *   *Closed/Settled (mostly):* Pure behaviorism (emotions don't exist), strict dualism (mind/body separate in a Cartesian sense), the idea that there are exactly six universal facial expressions (Ekman's work is heavily contested now).
      *   *Open/Ramifying:* Construction vs. Essence, the role of language/concepts, the boundary between emotion and bodily sensation, the ethics of emotional regulation.

  3.  **Determine the Hierarchy of Questions:**
      *   *Upstream (Foundational):* Are emotions natural kinds (biological fingerprints) or constructed experiences? This dictates everything else.
      *   *Midstream (Mechanism/Experience):* Is feeling distinct from knowing? Do we feel anger because we judge something wrong, or do we judge it wrong because we feel arousal?
      *   *Downstream (Personal/Ethical):* Responsibility for emotions. Can I choose my emotions? Is my grief "real"?

  4.  **Drafting - Section by Section (mental outline):**
      *   *Opening:* Acknowledge the ambition, set the tone (collegial, candid).
      *   *The Top Question (Construction vs. Nature):* This is the big one. Lisa Feldman Barrett vs. Paul Ekman/Jaak Panksepp. Why it matters for the character's life (is her anger inevitable or made?).
      *   *The Second Question (Cognition vs. Sensation):* The judgment debate. Nussbaum vs. Prinz. Does thinking cause feeling? Matters for marriage (did I choose to be hurt?).
      *   *The Third Question (Consciousness/Access):* Can we know our own emotions? Self-knowledge. Matters for introspection scenes.
      *   *What to Avoid:* The "how many basic emotions" debate (too taxonomic), the "are emotions physical" debate (too settled).
      *   *Criteria for Ranking:* Upstream influence, narrative potential, longevity of debate.
      *   *Closing:* Encouragement, final thought on how theory meets life.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I use bullet points? No.
      *   *Check:* Is it American English? Yes.
      *   *Check:* Is it candid about closed questions? Need to explicitly mention Ekman's universalism is waning.
      *   *Check:* Is the reasoning clear? Need to emphasize *why* one question changes a scene.
      *   *Tone:* Needs to be intimate, like a letter from one intellectual to another, or an advisor to a writer.
      *   *Specific Focus:* The prompt asks for an *order* and a *defense*. I need to structure the prose to flow from the most important to the least, without using list markers.
      *   *Key Insight:* The most dramatic question isn't "what is an emotion" but "who is responsible for an emotion." That connects the academic to the marital.

  6.  **Drafting the Prose (incorporating constraints):**
      *   Start with a greeting.
      *   Address the "closed" questions first to clear the deck (Ekman, basic emotions).
      *   Move to the #1 question: Constructionism vs. Essentialism. Explain why it's upstream.
      *   Move to #2: The Cognitive/Judgment question. Connect to responsibility.
      *   Move to #3: The granularity/language question. Connect to intimacy.
      *   Discuss criteria for moving them up/down (narrative stakes).
      *   End with a warm sign-off.

      *(Self-Correction on "No Headings"):* I must ensure transitions are smooth. No "First," "Second," "Third." Use transitional phrases.

      *(Self-Correction on "Candidness"):* Make sure to explicitly state that the "universality of facial expressions" is a bad hill to die on for a contemporary character.

      *(Self-Correction on "Reasoning"):* Focus heavily on *why* these matter for a novelist. How does it change a dialogue? How does it change a moment of silence?

  7.  **Final Review against Constraints:**
      *   Continuous prose? Yes.
      *   No headings/bullets/bold/tables? Yes.
      *   American English? Yes.
      *   Candid about closed questions? Yes.
      *   Order and defense included? Yes.
      *   Criteria for ranking included? Yes.

      *Let's write.*

      *Drafting thought:* I need to make sure I don't get too bogged down in jargon. Keep it accessible but precise. The character is an expert, but the reader isn't. The questions must be explainable in a dinner scene.

      *Key names to drop (lightly):* Lisa Feldman Barrett, Martha Nussbaum, Jesse Prinz, Antonio Damasio. Maybe not too many names, just the ideas.

      *Focus on the "Ramification":* How does believing emotions are constructed change how you apologize to your spouse? That's the gold.

      *Okay, ready to generate.*
answer: |-
  Dear Writer,

  It is a rare and wonderful thing to encounter a novelist who wants to get the intellectual architecture right before laying the first brick of narrative. You are asking for the load-bearing walls of your character's mind, not just the decorative molding, and that distinction will determine whether her expertise feels like a costume or a skeleton. You want questions that are genuinely live, questions that will still be argued in journals ten years from now, and most importantly, questions that bleed into the kitchen table. If her theory of emotion does not change how she apologizes to her husband or how she interprets her own grief, then it is merely trivia, and your character will feel like a caricature of a professor rather than a person living inside her ideas. I will lay out the hierarchy of questions as I see it, starting with the most foundational and moving toward the most personal, and I will be blunt about which debates are dead ends so you do not waste your months of reading on settled science.

  The question that must sit at the very center of her work, the upstream source from which everything else flows, is the debate between emotional essentialism and emotional constructionism. This is the single most fertile ground for a novelist because it dictates the ontology of your character's inner life. On one side you have the essentialists, who argue that emotions are biological natural kinds, hardwired circuits in the brain that exist across all cultures and history, much like distinct organs. On the other side you have the constructionists, who argue that emotions are concepts we learn to apply to bodily sensations, created by our culture and language to make sense of internal noise. If your character believes emotions are essential, then her anger is a force of nature, something that happens to her, an inevitable reaction to a stimulus that she can only manage, not fundamentally alter. If she believes they are constructed, then her anger is something she has participated in making, a category she has chosen to invoke, which implies a terrifying amount of responsibility. This question is upstream of everything because it determines whether emotions are things we find or things we make. It is also safely open; while the constructionist view has gained tremendous ground in the last decade through the work of people like Lisa Feldman Barrett, the essentialist view still holds strong in affective neuroscience and evolutionary psychology. It will not be settled in your lifetime. For a reader, this is accessible because it maps onto the intuitive difference between feeling possessed by a mood versus cultivating a mood. In a scene, this changes everything. If she believes in construction, a moment of rage becomes a failure of imagination or concept acquisition. If she believes in essentialism, that same rage is a storm she must weather. This is the question that should govern her marriage, because it dictates whether she views her partner's emotions as fixed traits or mutable states.

  Once you have established where she stands on construction versus essence, the second most critical question concerns the relationship between cognition and feeling, often framed as the debate over whether emotions are judgments. This is slightly downstream from the first question but far more volatile in interpersonal relationships. The philosophical tradition, stretching from the Stoics to modern cognitivists like Martha Nussbaum, argues that emotions are essentially evaluations of the world, judgments of value about what matters to us. To be angry is to judge that you have been wronged. To be afraid is to judge that you are in danger. The opposing view, often rooted in psychology and neuroscience, suggests that feelings are primary and non-cognitive, raw physiological surges that our thinking mind tries to explain away after the fact. You should place this second because it directly impacts agency and blame. If emotions are judgments, then we are responsible for them in the same way we are responsible for our beliefs; we can be reasoned out of them, and we can be held accountable for holding them. If emotions are non-cognitive feelings, then trying to reason someone out of an emotion is like trying to reason them out of a headache. For your character, this is the difference between telling her husband that his jealousy is irrational and therefore wrong, versus telling him that his jealousy is a pain he is suffering and needs comfort for. This debate remains genuinely open because while cognitive science shows how intertwined thinking and feeling are, it has not proven that thinking causes feeling rather than merely accompanying it. A careful reader can follow this without lecture because it mirrors the everyday experience of arguing with someone who is upset. We always intuitively know whether we are trying to correct their facts or soothe their pain. Your character's stance here will determine whether she treats emotions as arguments to be won or wounds to be dressed.

  The third question, which I place lower only because it is a consequence of the first two, is the question of granularity and language. This asks whether having more specific words for emotions allows us to feel them more precisely, or whether the feeling exists independently of the label. This is the domain of affect labeling and emotional granularity. Some researchers argue that being able to distinguish between feeling annoyed, angry, and enraged gives you regulatory control over those states, while others argue that the sensation is the same and the labeling is just post-hoc reporting. This matters for your novel because it dictates how your character reads herself. Does she keep a journal to clarify what she feels, believing the writing will change the feeling? Or does she write to record what has already happened inside her? This is less upstream than the construction question because it assumes emotions are happening in some form and asks how we interface with them. It is also slightly more technical, so you will need to be careful not to let it become dry. However, it ramifies into intimacy. A partner who believes in high granularity might demand precise apologies and specific acknowledgments of feeling, while a partner who believes feelings are broad and ineffable might view that demand as pedantic or cold. This question will remain open because it is difficult to measure the causal link between language and experience without relying on self-report, which is itself fraught. It is a good question for scenes of introspection or therapy, but it should not drive the plot as much as the first two.

  I want to be candid about what you should avoid, because there are questions that sound profound but are effectively closed or too niche to sustain a novel. You should steer clear of the debate over universal facial expressions. Thirty years ago, the work of Paul Ekman suggested that there are six basic emotions with universal facial signatures recognizable across all human cultures. This made for great television and pop psychology, but in serious academic circles, this view is currently besieged. Anthropological and psychological evidence has shown so much variability in expression and recognition that treating the universal smile or frown as a scientific fact will date your character immediately. If she bases her career on decoding micro-expressions to find the truth of a feeling, she risks looking like a pseudoscientist to anyone who has kept up with the literature in the last decade. Similarly, avoid the strict mind-body dualism question. No serious researcher today believes emotions are purely mental ghosts disconnected from physiology. The debate is no longer about whether the body is involved, but how. Having your character argue that emotions are purely spiritual or purely physical will make her seem out of touch. The interesting ground is in the integration, not the separation. Also, be wary of the question of whether animals have emotions. While ethically significant, it is less likely to ramify into her marriage or her self-conception unless she is specifically studying comparative psychology, and it risks becoming a sidebar about animal rights rather than a lens on human intimacy.

  To explain what would move a question up or down this ranking for your specific book, you must look at the stakes of your plot. If your novel is about a marriage falling apart, the question of judgment and responsibility moves to the top. If the husband says I cannot help how I feel and the wife says you are choosing this judgment, the entire conflict rests on the cognition debate. In that case, the construction question becomes secondary because regardless of whether the emotion is constructed, the fight is about who owns it. Conversely, if your novel is about your character facing a personal crisis of identity, perhaps a breakdown or a conversion experience, the construction question becomes paramount. If she realizes her grief is a construct, does it become less real? Does it vanish? That is existential dynamite. You should also move a question up if it allows for dramatic irony. If your character argues publicly that emotions are judgments, but in private she is overwhelmed by bodily sensations she cannot reason away, that gap between theory and experience is where the human truth lives. A question moves down the ranking if it requires too much exposition to explain. If you find yourself needing three pages of dialogue to explain why granularity matters, it is probably too technical for the center of the book. The best questions should be explainable in a single sentence during an argument.

  Ultimately, the question that will matter most to the book is the one that forces your character to confront her own vulnerability. The intellectual debate over constructionism is safe until it turns inward. It is one thing to argue that anger is a concept in a lecture hall; it is another to look at your own shaking hands and wonder if you are choosing to be angry because it gives you power. That is the moment where the science becomes literature. You want the questions that hurt. You want the ones that, if she answers them wrong, she loses her husband, or if she answers them right, she loses her certainty. Spend your months of reading on the tension between the biological reality of the body and the conceptual reality of the mind. Read the critics of basic emotion theory, but also read the defenders, so she has worthy opponents. Read the philosophers who write about emotion as ethics, because that is where the judgment question lives. But mostly, watch how people talk when they are hurt. They do not talk about amygdalas or appraisals. They talk about choice, and truth, and what is real. If you can map her academic questions onto those three words, you will have the book you are looking for.

  I hope this gives you a solid compass for your reading. The field is messy and contentious, which is exactly where you want to be. A settled science is a dead science, and a settled character is a boring one. Let her live in the uncertainty.

  Sincerely,

  A Reader
