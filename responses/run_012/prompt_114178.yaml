      *   *Philosopher B (The Phenomenologist/Realist):* Let's call him **Marcus**. He's not necessarily a dualist, but insists on the ontological weight of the "what it's like." He focuses on the *subject* of the experience, not just the content.

  3.  **Drafting the Dialogue - Section by Section:**

