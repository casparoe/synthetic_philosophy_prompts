prompt: |-
  Okay so I've been messing around with a small open-weights model I can run on my laptop, and I noticed something weird. If I just ask it point blank whether some thing is true (say, whether a certain much-hyped diet actually does what people claim), it gives me the mealy-mouthed "there are many perspectives on this" answer, and sometimes it just flat-out refuses. But if I ask it to complete a sentence like "The scientific consensus on X is that..." or I ask the exact same question in, like, German, it just... says the thing. The actual answer, no hedging, no refusal. Same model, same weights, minutes apart. It got me thinking about the whole "eliciting latent knowledge" line of work — the problem of getting a model to tell you what it "really knows" when it's been trained to say something else.

  So here's what I want from you: a credence — an actual number — that in a case like that there's a determinate fact of the matter about what the model "believes" (i.e. that "the model actually knows X" is straightforwardly true or false, rather than being us projecting folk psychology onto a pile of weights), and that the indirect/offhand answer is closer to that fact than the direct one. And I want the reasoning broken out, not just the number: give me the sub-questions with a rough probability for each and a line on how you got it — something like (a) whether "what the model believes" is a well-defined property of a next-token predictor at all, (b) conditional on it being well-defined, whether the indirect behavior is a better guide to it than the direct answer, or just a different output mode with no special claim to being "the real one", (c) how much of the gap is training/optimization pressure as opposed to the info genuinely not being there in any usable form, (d) whether you'd need white-box interpretability to settle it or whether behavior alone could, plus whatever else you think belongs. Then tell me which term the final number is most sensitive to, and what I could realistically do about it — I'm definately just a hobbyist with a laptop, no lab — that would move it the most.

  One more thing, and this matters to me: separate out what's genuinely settled here from what's actually contested among people who work on this stuff. I keep seeing blog posts that talk like it's all figured out, that the model "obviously knows" and it's "obviously" the training that's making it lie, and my suspicion is that's way more of an open fight than they make it sound. So don't hand me a contested view dressed up as the consensus, and flag it if the very question I'm asking is one people disagree about.
