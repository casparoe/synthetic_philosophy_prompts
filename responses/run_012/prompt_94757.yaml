      *   Let's adjust based on the "Contested vs. Settled" constraint. The existence of "belief" is the biggest contention.

  5.  **Addressing the "Settled vs. Contested" Constraint:**
      *   *Settled:* Models behave differently under different prompts (context dependence). RLHF adds a layer of policy on top of base capabilities.
      *   *Contested:* Whether internal states correspond to "beliefs." Whether ELK (Eliciting Latent Knowledge) is solvable. Whether indirect prompting reveals "truth" or just "different biases."
      *   *Action:* I need to explicitly state that the *question itself* is part of the debate.

  6.  **Developing the Reasoning & Sensitivity Analysis:**
