answer: |-
  Good evening. For those who don't know me, I'm [Your Name], and I had the privilege of being [Advisor's Name]'s student.

  We are gathered in a museum, surrounded by things we have named. That is appropriate. Because for thirty-eight years, from this office right here, [Advisor's Name] has been naming the unnameable.

  I want to start with her sister, who is here tonight. For thirty years, at Thanksgiving, she has asked the same question: "So, how many kinds of bugs is it now?" And for thirty years, she has received a different answer. Twelve. Thirty-one. Nine. Somewhere between nine and thirty-four, depending on the weather.

  To the family: I know that sounds like we don't know what we're doing. To the colleagues in the room: you know that's exactly what we *are* doing.

  [Advisor's Name] spent her career studying a genus of eyeless cave beetles. She described her first species at twenty-six and her last at sixty-three. In between, the count went up, it went down, and it split apart. Her second student split them aggressively; her fourth student merged them ruthlessly. If this were a map-making expedition, we'd say the surveyors were lost. But [Advisor's Name] taught us that biology isn't map-making.

  A map-maker looks for lines that are already there in the terrain. A law-maker looks at a messy territory and draws lines so that people can live in it.

  That is the hardest thing to say about her work, and the most important. She did not discover a single, true number of beetle species hidden in the rock. She demonstrated that the number depends on what job you need the word "species" to do. Are we identifying them in the field? Protecting them under the law? Tracing their evolution? Those are different jobs, and they require different tools.

  To say this out loud is risky. It sounds like saying, "It's all made up." But [Advisor's Name] taught us that recognizing the ambiguity is not an excuse for inaction; it is a demand for responsibility.

  If you pretend nature comes pre-packaged into species, you can claim you're just reporting the facts. But if you admit that drawing the line is a decision, you have to own the consequences of where you draw it.

  And she owned them. We are not here just to celebrate a bibliography. We are here because a quarry never opened. We are here because a cave system was fenced and gated. Those things happened because a population in one wet hollow was named as a species of its own. Later, someone else might argue it's the same animal as one two hundred kilometres away. But because [Advisor's Name] was willing to make the decision *then*, with the evidence *then*, for the purpose of conservation *then*, that rock stayed in the ground.

  She used to say that our field's worst habit is treating a preferred criterion as a moral commitment. She treated it as what it is: a tool. And she wielded that tool with a wisdom that allowed the rest of us to stop arguing about whether the world is simple, and start working to protect the fact that it is complex.

  So, to her sister: I can finally give you a straight answer. How many kinds of bugs is it? It is exactly as many as it needs to be to keep the caves safe, the science honest, and the students employed.

  And to [Advisor's Name]: Thank you for teaching us that the truth isn't always a number we find. Sometimes, it's a line we draw, and the courage it takes to stand behind it.

  Please raise your glasses. To the architect of the ambiguous, the steward of the species problem, and our mentor, [Advisor's Name].
