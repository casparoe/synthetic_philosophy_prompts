prompt: |-
  I'm writing a novel in which a painter spends a chapter making very fine colour judgments — deciding, over and over, whether two patches of paint match — and I want the chapter to turn on a distinction I've only half understood, so I'm hoping you can explain it to me properly. At the climax of the scene she is standing at the studio window at dusk, looking at the display of a digital thermometer on the roof of the building across the street: a small panel of glowing digits reading twenty point three, with no unit marked and nothing to indicate whether the reading is Celsius or Fahrenheit, or whether the instrument is accurate at all. What interests me is the exact shape of what she can and cannot know from where she stands. She can see, perfectly clearly, that the display reads twenty point three. So she knows that the temperature is at least twenty degrees Celsius — that much seems plain, since the display says so and displays of that kind are normally accurate enough for a claim as coarse as that. And yet it also seems plain to me that she cannot know that she knows it: from the inside, she has no way to establish that the display is working, that she is reading it correctly, or that it hasn't been reset. She knows the fact, or so I want to say, but she is in no position to know that she knows it. What I can't see is whether those two claims can both be true, and if so why.

  I gather this general shape has a name — the question whether knowing entails knowing that one knows, the so-called KK principle, and something about knowledge being "luminous" or not — but I've never understood the mechanism. So please explain the conceptual issue to me: how can it be that she knows something and yet cannot know that she knows it? I'd like the explanation to turn on something concrete rather than staying at the level of labels, so please build it out of a case like hers, where knowledge and knowledge-that-one-knows seem to come apart, and show me exactly where the gap opens. In particular I want to understand why the inference from "I know that the display reads twenty point three" to "I know that I know it" is supposed to fail, when the premise looks like something she can simply see. Is the failure a matter of a margin or a threshold — that knowing requires a margin of safety against error, and knowing that one knows requires a margin of safety about that margin, which can give out even when the first does not? Is it rather that her evidence is fully available to her and her knowledge still isn't, so that what she can't see is a fact about her own epistemic standing rather than about the world? And is there any sense in which she might even be able to know that she doesn't know, or does the case leave her without any knowledge at all about her own epistemic state? I'd also like to know how the competing ways of modelling knowledge treat a case like this: whether a view that analyses knowing as having evidence that rules out the relevant error possibilities, or one that treats it as a matter of reliability, or one that sets a confidence threshold, would each predict the same verdict, and where they diverge. And please tell me, honestly, what is settled here and what is genuinely contested among people who work on it — I don't want a party line presented as the consensus, and if the very claim that she knows the temperature is at least twenty degrees is itself disputed, say so and say why, since I'd rather write the scene around a real disagreement than around a tidy answer that turns out to be one contested position among several. Where you find that a claim depends on a particular reading of a term or a particular formal model rather than on something everyone agrees to, please flag it rather than smoothing it over.

  Since I'll be reading this as background for fiction rather than for a seminar, and I'd rather absorb it the way one absorbs a letter than the way one absorbs a textbook, please give me continuous prose — no headings, no bullet points, no bold or italics, no tables — just paragraphs that carry the argument forward. And do keep in mind as you write that I'm not a philosopher and will only be able to use the parts that I can hold in my head while I'm drafting the scene.
