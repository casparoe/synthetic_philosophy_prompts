answer: |-
  # Session Plan: Libet's Experiments and the Phenomenology of Agency
  **Duration:** 75 Minutes
  **Audience:** Psychiatry Trainees
  **Goal:** To disentangle the neurophysiology of motor preparation from the phenomenology of volition, avoiding deterministic reductionism.

  ## 1. The Clinical Hook: The Signature Case (0–10 mins)
  Begin not with the laboratory, but with the clinic. Present the case of the individual signing a form while conversing, only noticing the signature is underway mid-stroke.

  **What this case must have:**
  *   **Divided Attention:** The agent's conscious focus is on the conversation, not the hand.
  *   **Intact Motor Planning:** The signature is fluent and accurate, implying the motor programme was loaded correctly.
  *   **Retrospective Awareness:** The agent recognises the action as their own *after* initiation but *before* completion.

  **What this case must lack:**
  *   **Pathology:** It must not be 'Alien Hand Syndrome' or a focal seizure; the agent must ultimately claim ownership of the act.
  *   **Coercion:** There is no external force moving the hand.
  *   **Amnesia:** The agent remembers the context and the action.

  **Where it misleads:**
  *   It suggests a *loss* of agency (something happened *to* me), whereas Libet's data suggests a *lag* in awareness (I did it, but I noticed later).
  *   It conflates *automaticity* with *unconscious decision*. The decision to sign was likely conscious minutes prior; only the execution was automated. Use this to pivot: "Libet attempts to isolate the execution from the prior decision. To do that, we need specific metrics."

  ## 2. Conceptual Prerequisites: The Metrics (10–25 mins)
  Before showing the timeline or the millisecond figures, you must establish what is being measured. If you present the numbers first, the trainees will treat them as physical constants rather than interpreted data.

  **The Dependencies:**
  1.  **The Nature of the Readiness Potential (RP):** They must understand that the RP is a measure of **motor preparation**, not **decision selection**. It indicates the brain is getting ready to move, not necessarily *that* it has chosen to move definitively.
      *   *Dependency:* You cannot claim the 'brain decided' (causality) until you establish that the RP represents a decision rather than a mere predisposition.
  2.  **The Nature of 'W' (Time of Will):** They must understand that 'W' is a **subjective report** mapped onto a clock face, not an objective neural timestamp. It is a memory of an intention, reconstructed post-hoc.
      *   *Dependency:* You cannot claim the intention was 'backdated' or 'illusory' until you acknowledge the inherent latency in subjective reporting.
  3.  **The Gap:** The critical interval is not between RP and Movement, but between RP and 'W'.
      *   *Dependency:* The numbers only carry weight if the trainees accept that 'W' is the best available marker for conscious intention, however flawed.

  **Instruction:** Do not show the graph yet. Define the variables. Ask: "If the RP is merely the engine idling, does it matter if it starts before the driver turns the key?"

  ## 3. The Spine: Three Questions (25–55 mins)
  Now present the timeline (RP onset ≈ -550ms, 'W' ≈ -200ms, Movement = 0ms). Structure the discussion around the three questions you identified. Do not allow the group to conflate them.

  **Question 1: Was the intention conscious when it arose? (-200ms)**
  *   **The Trap:** Assuming 'W' is the moment the intention was *formed*, rather than the moment it *entered awareness*.
  *   **Head Off Misconception:** *"The intention was backdated and so was never mine."*
  *   **Intervention:** Address this immediately here. Explain that Libet himself argued 'W' might be delayed by the time required to attend to the urge. The intention may have existed unconsciously before 'W', but 'W' marks the entry into the conscious field.
  *   **Takeaway:** Consciousness of intention is not necessarily the *start* of intention.

  **Question 2: Was it the earliest cause of the act? (-550ms vs -200ms)**
  *   **The Trap:** Equating the earliest neural correlate with the *cause* of the specific action.
  *   **Head Off Misconception:** *"The unconscious decided it."*
  *   **Intervention:** Address this when discussing the RP. Remind them of the definition established in Section 2: RP is preparation. A predisposition to move is not a command to move *now*.
  *   **Takeaway:** The RP creates the *capacity* for the movement, but does not necessarily determine the *timing* or *selection* of the specific act without further input.

  **Question 3: Was the act up to the agent? (Agency)**
  *   **The Trap:** Assuming that if the start is unconscious, the agent is a passenger.
  *   **Head Off Misconception:** *"This settles the free will question."*
  *   **Intervention:** Address this last. Introduce Libet's 'Veto'. The data shows preparation before awareness, but it also allows for conscious abortion of the act between 'W' and Movement.
  *   **Takeaway:** Agency may reside not in the *initiation* of the impulse, but in the *control* or *ratification* of it. Freedom might be 'free won't' rather than 'free will'.

  ## 4. The Objection: Averaging Artefacts (55–65 mins)
  A member will inevitably raise the critique that the RP is an artefact of averaging noisy single trials (Trevena & Miller).

  **Where it belongs:**
  Place this after the three questions have been logically separated. If raised earlier, it derails the conceptual distinction between agency and preparation.

  **How much survives:**
  *   **Acknowledge:** Accept that single-trial prediction is poor and the RP may reflect fluctuating attention rather than a specific motor command.
  *   **Preserve:** Even if the RP is 'noisy', the *phenomenological gap* remains. The trainees still experience the urge to move *after* the neural activity begins. The lesson shifts from "The brain determines the act" to "Conscious awareness is not the first event in the motor chain."
  *   **Verdict:** The metaphysical shock is dampened, but the clinical lesson on the latency of insight remains intact.

  ## 5. Conclusion and Exclusions (65–75 mins)
  **What to Refuse to Cover:**
  1.  **Compatibilist Metaphysics:** Do not allow the session to dissolve into a philosophy seminar on determinism vs. libertarianism.
      *   *Why:* Trainees need to understand the mechanism of agency for capacity assessments, not solve the hard problem of consciousness.
  2.  **fMRI Prediction Studies (Haynes et al.):** Do not introduce later studies claiming prediction seconds in advance.
      *   *Why:* These introduce different variables (complex decision making vs. simple motor act) that confuse the specific Libet timeline you are dissecting.
  3.  **Quantum Indeterminacy:** Do not discuss whether quantum noise allows for freedom.
      *   *Why:* It is scientifically speculative and clinically irrelevant.

  **The Final Question:**
  To test if they have grasped the difference between a precursor and a cause, pose this single question to the room:

  > *"If the readiness potential is a necessary condition for the movement to occur, but the movement can be voluntarily aborted after the potential has arisen, is the potential the **author** of the act or merely its **precondition**?"*

  **Expected Answer:** They should identify it as a precondition. If they identify it as the author, they have conflated causality with correlation.

  **Closing:**
  Remind them that in psychiatry, we often treat patients who feel their actions are not their own. Libet does not prove they are right; it proves that the feeling of 'mineness' is a complex construction, not a simple signal. Our job is to repair the construction, not debate the physics.
