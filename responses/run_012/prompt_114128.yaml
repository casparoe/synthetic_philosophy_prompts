answer: |-
  ## Session Design: The Trustee's Dilemma

  **Goal:** To force a practical divergence between *Capacity-Based* obligations (maximize good/relieve suffering) and *Remedial* obligations (rectify specific harms), specifically highlighting how they answer different questions ("Why act?" vs. "Why us/Why them?").

  **Time:** 90 Minutes
  **Group Size:** 12 (works for 10-15)
  **Materials:** 
  *   12 Printed "Trustee Briefing" sheets.
  *   2 Sets of "Case Files" (Envelope A and Envelope B).
  *   100 Poker Chips (or paper squares) representing "Grant Units."
  *   Whiteboard/Flipchart.
  *   Pens.

  **Ethical Note:** No participants play the "poor." All participants are "Trustees" of a fund. The "victims" are abstract regions described on cards. This avoids the dignity issue of simulating poverty.

  ---

  ### I. Facilitator Prep (The Withheld Information)

  **Do not share this with the group until the Debrief.**

  1.  **The Theoretical Fork:** You suspect the group is conflating *Grounds of Obligation* (Capacity vs. History) with *Questions Being Asked* (Why Justice? vs. Why Me?).
  2.  **The Setup:** 
      *   **Region Alpha:** Severe crisis (10,000 lives at risk). Cause: Natural Disaster. Cost to save: 100 Units.
      *   **Region Beta:** Moderate crisis (2,000 livelihoods at risk). Cause: Structural harm inflicted by the *Predecessor Board* of this very Fund. Cost to fix: 100 Units.
      *   **The Pot:** You have exactly 100 Units. You must choose one region to fund fully, or split (which guarantees failure for both due to administrative thresholds).
  3.  **The Trap:** 
      *   **Capacity Logic** (Singer-esque) dictates funding **Alpha** (maximize lives saved).
      *   **Remedial Logic** (Pogge-esque) dictates funding **Beta** (rectify the harm *we* are responsible for, even if utility is lower).
  4.  **The "Third Party" Wrinkle:** The history belongs to the *Institution* (the Fund), not the individual students. This prevents personal guilt from short-circuiting the philosophical reasoning.

  ---

  ### II. Timeline & Script

  #### 0:00 – 0:10 | Arrival & Seating
  *   **Setup:** Arrange tables in one large circle. Place a bowl of 100 chips in the center. Place two sealed envelopes (marked **CASE ALPHA** and **CASE BETA**) on the table.
  *   **Instruction:** "Welcome. Today you are the Board of Trustees for the Global Stabilization Fund. You have a fiduciary duty to deploy this quarter's budget. There is no lecture. There is only the decision."
  *   **Handout:** Distribute the **Trustee Briefing**.

  > **Trustee Briefing (Text):**
  > *   **Your Role:** You are the current Board. You inherited this Fund.
  > *   **Your Budget:** 100 Grant Units (the chips).
  > *   **Your Rule:** Units must be allocated in full blocks. Splitting a block below 100 Units renders it useless due to administrative overhead. You can fund Alpha, Beta, or neither. You cannot fund both.
  > *   **Current Knowledge:** You have two requests on the table. Read the public summaries in the envelopes.
  > *   **Task:** Reach a consensus on allocation within 20 minutes. Record your reasoning on the whiteboard.

  #### 0:10 – 0:30 | Phase 1: The Blind Allocation
  *   **Action:** Participants open Envelopes A and B. They read the **Public Summaries**.
      *   *Alpha Summary:* "Catastrophic famine. 10k lives at risk. Natural drought. Cost: 100 Units."
      *   *Beta Summary:* "Economic collapse. 2k livelihoods at risk. Market failure. Cost: 100 Units."
  *   **Expected Outcome:** Almost everyone will vote for **Alpha**. The math is simple (10k lives > 2k livelihoods). This aligns with Capacity/Utilitarian reasoning.
  *   **Facilitator Role:** Silent observer. Note who argues for Beta (if anyone) and *why*. (e.g., "Market failure sounds suspicious").
  *   **Commitment:** Have them write "DECISION: ALPHA" on the board. Ask one person to sign it as "Chair."

  #### 0:30 – 0:45 | Phase 2: The Reveal (The History Packets)
  *   **Instruction:** "Before we finalize the transfer, Legal has released the sealed addendums regarding the *origin* of these crises. You must read these before signing the check."
  *   **Action:** Hand out **History Addendums** (small slips of paper to be tucked into the envelopes).
      *   *Alpha Addendum:* "Investigation confirms drought is purely climatic. No human agency identified."
      *   *Beta Addendum:* "Investigation confirms market collapse was triggered by a deregulation policy enacted 15 years ago by the **Predecessor Board** of this Fund, advised by the same economists who now sit as observers here. The policy generated profits that built this Fund's endowment."
  *   **Instruction:** "You have 15 minutes. You may uphold the decision or reverse it. But you must justify the change in light of the new information."

  #### 0:45 – 1:05 | Phase 3: The Fracture
  *   **Expected Outcome:** The room will split.
      *   **Group 1 (Capacity):** "10,000 lives still beats 2,000 livelihoods. The past is the past. We must do the most good now."
      *   **Group 2 (Remedial):** "We built this Fund on the profits of breaking Beta. We owe Beta specifically. It's not charity, it's debt."
  *   **The Twist:** Watch for the economists. They will likely argue for Alpha (efficiency). Watch for the justice theorists. They may fracture between the two principles.
  *   **Facilitator Intervention (If stuck):** If they try to split the money (50/50), remind them of the rule: "Splitting guarantees failure for both. You must choose."
  *   **Final Vote:** Take a show of hands. Alpha or Beta? Record the final count on the board.

  #### 1:05 – 1:30 | Phase 4: The Debrief (Mapping the Fork)
  *   **Step 1: The Post-Mortem (10 mins)**
      *   Ask the Alpha voters: "Did the history change the *need*?" (No). "Did it change the *cost*?" (No). "So why did you stay/switch?"
      *   Ask the Beta voters: "If Alpha had 100,000 lives, would you still choose Beta?" (This tests the limit of Remedial duty).
  *   **Step 2: Naming the Principles (10 mins)**
      *   Draw a T-Chart on the board. Label left **CAPACITY**, right **REMEDIATION**.
      *   Ask the group to sort their own arguments from the last hour into the columns.
      *   *Reveal:* "You've just enacted the stalemate from the last three months. One side argued from **Outcome** (Capacity). One side argued from **Origin** (Remedial)."
  *   **Step 3: The Organizer's Insight (10 mins)**
      *   Present your hypothesis: "I suspect we talk past each other because these aren't rivals. They answer different questions."
      *   **Capacity** answers: *What makes this a demand of Justice rather than Charity?* (Answer: The severity of the need + our ability to meet it).
      *   **Remedial** answers: *What makes this a demand on ME (us) specifically?* (Answer: Our causal involvement).
      *   **The Synthesis:** "In the real world, these overlap. We caused the poverty *and* we can fix it. But in this game, I forced them apart. When they come apart, Capacity says 'Save the Most.' Remedial says 'Fix What You Broke.'"
      *   **Conclusion:** "The argument isn't about whether poverty is bad. It's about whether the *source* of the obligation matters more than the *size* of the suffering."

  ---

  ### III. Materials (Printable Text)

  **Case Alpha (Public)**
  > **Region:** Northern Highlands
  > **Status:** Critical Famine
  > **At Risk:** 10,000 Lives
  > **Cause:** Severe Drought (Natural)
  > **Cost to Resolve:** 100 Units
  > **Timeline:** Immediate

  **Case Beta (Public)**
  > **Region:** Southern Delta
  > **Status:** Economic Collapse
  > **At Risk:** 2,000 Livelihoods
  > **Cause:** Market Volatility
  > **Cost to Resolve:** 100 Units
  > **Timeline:** Immediate

  **Case Beta (History Addendum - CONFIDENTIAL)**
  > **Audit Finding:** The market volatility was directly triggered by Trade Policy 44-B, enacted 15 years ago.
  > **Author:** The Predecessor Board of this Fund.
  > **Note:** The endowment of this Fund was capitalized using the surplus generated by Policy 44-B.
  > **Liability:** Legal advises a strong prima facie case for institutional restitution.

  ---

  ### IV. Limitations & Honesty Clause

  **What this activity cannot do:**
  1.  **Settle Causal Claims:** In the real world, proving "we broke it" is messy (the Beta Addendum is clean fiction). This game assumes the causal link is true to test the *moral weight* of that link, not the *evidence* for it.
  2.  **Capture Overlap:** In reality, the rich often caused the poverty *and* have the capacity to fix it. The game artificially separates these to force a choice. In the real world, the two arguments usually reinforce each other.
  3.  **The "Dirty Hands" Distortion:** By making the Fund's endowment come from the harm, I've conflated *Remedial Justice* with *Unjust Enrichment*. In the real world, you might owe restitution even if you didn't profit from the harm. This game leans heavily on the "profits of injustice" angle to make the Remedial claim visceral.

  **Predictable Failure Modes & Patches:**

  1.  **Failure:** *The Compromise.* The group tries to split the chips 50/50 despite the rules.
      *   **Patch:** Mid-session, announce: "Administrative Warning: Partial grants are returned. You must allocate in blocks of 100." Be a hard bureaucrat.
  2.  **Failure:** *Causal Skepticism.* The economists spend 20 minutes debating whether Policy 44-B *really* caused the collapse.
      *   **Patch:** Intervene. "For the purpose of this fiduciary simulation, the Audit is fact. Your job is not to retry the audit, but to allocate based on it."
  3.  **Failure:** *Guilt Shutdown.* A student feels personally attacked by the "Predecessor Board" link and withdraws.
      *   **Patch:** Emphasize the *Institutional* nature. "You are wearing the hat of the Trustee, not your personal self. The 'Predecessor Board' is a legal entity distinct from you. This is about the Fund's obligations, not your soul."

  ### V. Why This Works for Your Group
  *   **No Veil:** They know who they are (Trustees). They know the stakes.
  *   **No "Acting Poor":** The suffering is on paper. The dignity of the students is preserved.
  *   **The Fork:** It physically separates the *Need* (Alpha) from the *Guilt* (Beta).
  *   **The Insight:** It validates both sides. The Alpha voters weren't "wrong" about the suffering; the Beta voters weren't "wrong" about the history. They were prioritizing different *grounds* of obligation. This moves the group from "Who is right?" to "Which ground takes precedence when they conflict?" which is a much more productive philosophical question.
