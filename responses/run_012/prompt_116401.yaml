answer: |-
  Your paraphrase is remarkably solid. You haven't mangled the text; you've identified the exact pressure points where Leibniz's system groans. You are correct that he uses the Scholastic term *velleity* (or *velleitas*) to describe the antecedent will, and the Latin phrase you're fishing for regarding evil is almost certainly *condition sine qua non* (a condition without which [the greater good] would not occur).

  Here is the breakdown of the argument, addressing your three specific sticking points.

  ### 1. The Function of the Antecedent/Consequent Distinction

  You are right to be suspicious that this looks like a semantic stopgap. On a first read, it looks like Leibniz is saying: "God wants X, but He also wants not-X, but don't worry, they are different *kinds* of wanting." That sounds like special pleading.

  However, in the architecture of the *Theodicy*, this distinction is doing heavier lifting than just avoiding contradiction. It is mapping the **structure of rational deliberation** onto the divine mind.

  *   **What it looks like it's doing:** Protecting God's benevolence. (He *does* love everyone, technically.)
  *   **What it's actually doing:** Protecting God's rationality and the Principle of Sufficient Reason (PSR).

  If God only had a **consequent will**, He would appear as a cold utilitarian who never actually valued the individual soul, only the aggregate sum. This makes God the author of sin directly, because He would be willing the damnation of Peter *simpliciter*.

  If God only had an **antecedent will**, He would be incompetent or finite. He would will the salvation of all, and fail to achieve it. This violates omnipotence.

  The distinction allows Leibniz to argue that God's will is **composite**. Think of it not as "God wants X and also wants not-X," but rather: "Every good, considered in isolation, exerts a positive pressure on the Divine Will (antecedent). However, these goods are not all compossible. The Divine Wisdom must calculate the resultant vector of all these pressures."

  The antecedent will is not a "failed desire" (which would imply passion or frustration in God); it is a **value input**. It is the acknowledgment that every good has ontological weight. The consequent will is the **output** of the optimization function.

  So, to answer your worry: *In what sense is it a will at all?* For Leibniz, it is a will in the sense of a **natural inclination of the divine nature**. God's nature is Goodness; therefore, God naturally inclines toward every good. It is not a "decree" (which implies a final decision), but it is a real metaphysical tendency. It prevents the system from collapsing into the claim that "Evil is actually Good." Evil is never willed antecedently; it is only accepted consequently. This preserves the objective status of Good and Evil, which is crucial for Leibniz against the voluntarists (who say Good is just whatever God wills).

  ### 2. Antecedent/Consequent vs. Permitted Evil

  Your hunch is correct: these are two different patches over two different holes.

  *   **The Antecedent/Consequent Distinction** solves the problem of **Volition**. (How can God will a world containing sin?)
  *   **The Permission Distinction** solves the problem of **Causality**. (Is God the author of sin?)

  Leibniz needs both. If he only used the Permission move ("God permits evil but doesn't cause it"), Bayle could reply: "But why did He permit *this* specific evil in *this* specific configuration if He could have permitted less? If He chose the configuration, He willed the evil contained within it."

  The Antecedent/Consequent distinction answers *why* the permission was granted (because the consequent will, aiming at the best total order, overrode the antecedent will against that specific evil). The Permission move answers *how* God relates to the evil metaphysically (He is the permissive cause, not the efficient cause).

  **Which bears the load?**
  The **Best of All Possible Worlds (BAPW)** thesis bears the actual load. The Antecedent/Consequent distinction is merely the psychological machinery that makes BAPW compatible with Benevolence. The Permission move is the metaphysical shield that makes BAPW compatible with Holiness.

  If you remove the Permission move, God becomes the author of sin. If you remove the Antecedent/Consequent move, God becomes a utilitarian monster who wills sin directly. But if you remove the BAPW thesis, the whole thing collapses, because there is no reason for the consequent will to override the antecedent will. The "greater good" justification relies entirely on the comparative perfection of the chosen world.

  ### 3. Partial Ordering and Moral Necessity

  This is the strongest objection you've raised, and it cuts to the bone of Leibniz's metaphysics. You are not being anachronistic; you are identifying the fragility of the Principle of Sufficient Reason when applied to value theory.

  **The Partial Order Problem:**
  Leibniz **cannot** accept a partial ordering of possible worlds. His metaphysics relies on the idea that "perfection" is quantifiable. For Leibniz, perfection is essentially "reality" or "essence" (the amount of being). He treats metaphysics like geometry. Just as there is a shortest distance between two points, there is a maximum sum of essence/compossibility.

  If the order is partial (World A is better in mercy, World B is better in justice, no fact of the matter which is better overall), then the Principle of Sufficient Reason fails. God would have no sufficient reason to choose A over B.
  *   **If God chooses arbitrarily:** This violates Divine Wisdom. Leibniz hates voluntarism (the idea that God's will is unmoored from reason).
  *   **If God chooses neither:** Then no world exists.
  *   **If God picks one and calls it best:** This is circular and collapses into voluntarism.

  Leibniz's "tie-break" is the **Identity of Indiscernibles**. He argues that two worlds cannot be exactly equal in perfection. There is always some differentiating factor. Therefore, there is always a unique maximum. If you deny this, you deny the rationality of the universe, which for Leibniz is tantamount to atheism.

  **Moral Necessity:**
  You suspect "moral necessity" is a euphemism. It is not a euphemism, but it is a **technical boundary marker**. Leibniz is trying to walk a tightrope between Spinoza and the Calvinists.

  *   **Absolute Necessity:** (Spinoza) God *could not* have done otherwise. It implies a contradiction. Leibniz rejects this to save contingency and freedom.
  *   **Moral Necessity:** God *would not* have done otherwise, because it would contradict His wisdom and goodness, but He *could* have (logically speaking).

  **The "Incline without Necessitating" Move:**
  This is where Leibniz's definition of freedom does the work. For Leibniz, freedom requires three things:
  1.  **Intelligence:** Knowledge of the object.
  2.  **Spontaneity:** The source of action is within the agent.
  3.  **Contingency:** The opposite is logically possible.

  Moral necessity preserves Contingency (it is not logically contradictory for God to choose a worse world) but removes the *probability* of it happening. A wise being *must* choose the best, not because of external coercion, but because wisdom *is* the inclination toward the best.

  **If the ordering is partial:**
  If you successfully argue that the ordering is partial, Leibniz's system does not just tweak; it breaks.
  1.  **PSR Fails:** There is no sufficient reason for the choice of one incomparable world over another.
  2.  **Freedom Becomes Arbitrariness:** If there is no "best" to incline the will, God's choice becomes a brute fact. This turns God into a Voluntarist deity, which Leibniz spends the *Theodicy* arguing against.
  3.  **Theodicy Fails:** If there is no unique "Best," then God cannot claim that *this* world (with all its specific evils) was required. He could have picked a different incomparable world with *different* evils. The defense that "this evil was necessary for the best world" evaporates if there is no single best world.

  **Summary on your "Stuck" Point:**
  You asked: *If the antecedent will is never defeated in the sense that matters... in what sense is it a will at all?*

  Leibniz's answer is that it is a **component of the calculation**, not a **competitor in the election**. It is not defeated; it is **subsumed**. The antecedent will for "no suffering" is satisfied insofar as the chosen world contains the *minimum* suffering compossible with the *maximum* good. It is not frustrated; it is optimized.

  The cost to God is zero because God does not experience time or sequence. He does not "want X, then realize He can't have it, then settle for Y." He sees the total compossible system in a single intuition. The antecedent will is our way of describing how God values the parts; the consequent will is our way of describing how God values the whole.

  **Where your paraphrase might drift:**
  You wrote: *"God sincerely wills a world in which not all are saved, in the consequent sense."*
  Be careful here. Leibniz would say God wills the **world** in which not all are saved, but He does not will the **damnation** itself, even consequently. He permits the damnation as a consequence of the laws of the world (which are good), but the damnation itself remains an object of antecedent aversion. The distinction is between willing the *system* that produces the outcome, and willing the *outcome* itself. Leibniz insists God only wills the system.

  If you keep that distinction sharp, your paraphrase holds. If you blur it, you make God the direct author of sin, which is exactly what Bayle accused him of.
