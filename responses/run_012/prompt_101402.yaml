  Find the category where you scored the highest. That is the theory of pleasure your intuitions align with.

  *   **Feeling:** You believe pleasures all share one distinctive feeling; they're just different flavors of it.
  *   **Attitude:** You believe a pleasure isn't a feeling at all, it's an attitude—being pleased *about* something.
  *   **Dimension:** You believe there is no shared feeling, but they share one dimension: you could line them all up on a single bad-to-good dial.
  *   **Motivation:** You believe what unites them is what they make you want—pleasure is whatever keeps you doing it.
  *   **Family:** You believe there's no single thing, only a family resemblance, so hedonism should be rewritten as a big list.
  *   **Deflation:** You believe there's no common thing, and hedonists shouldn't care; they can just point at the whole class and move on.

