answer: |-
  The Bureau of Posthumous Accounts smelled of ozone and toner, a sterile scent that clung to the back of the throat. Elara sat at Station 4, her fingers moving across the haptic interface without looking. On the screen, a timeline unfurled: a life represented by a green bar, abruptly severed by a red vertical line.

  *Subject: J. Kovic. Age 24. Cause: Vehicular collision.*
  *Projected Life Expectancy: 82.*
  *Deprivation Index: High.*

  Elara tapped the calculation key. The system whirred, pulling data from Kovic's cloud history, purchase orders, medical scans, and social connectivity maps. It constructed a counterfactual ghost—the man Kovic would have been. It estimated the value of unwritten songs, unmet partners, untraveled roads. The number settled in the bottom right corner: 4.2 million credits. Payable to the mother.

  It was clean. It was arithmetic. The harm was evident because the future was visible.

  She minimized Kovic's file and opened the next queue. Case 8990-V. The file icon was grey, not the usual blue.

  *Subject: Arthur Vane. Age 42. Cause: Cardiac Arrest.*
  *Projected Life Expectancy: 85.*
  *Deprivation Index: Zero.*

  Elara frowned. She tapped the file open. Attached to the death certificate was a notarized Form 88-B: Declaration of Satiety. Filed fourteen days before death.

  In the text box, in Vane's own handwriting scanned into the system: *I have no unfulfilled projects. I desire no further experiences. I consider my account closed.*

  Under Bureau Statute 12, a subject who voluntarily declares satiety waives the right to future goods. If you say you are full, the state cannot claim you were starved. The counterfactual ghost evaporated. There was no "would-have-been" because the subject had legally negated the "could-have-been."

  Elara rubbed her temples. She'd processed three satiety cases in her career. All were elderly, bedridden, in pain. Vane was a landscape architect. He was healthy. He was dead two weeks after signing.

  The beneficiary, Maya Vane, had filed a contestation.

  ***

  The interview room was small, soundproofed with grey foam wedges. Maya Vane sat on the metal chair, her hands wrapped around a cardboard box. She looked tired, the kind of tired that sleep doesn't fix.

  "Ms. Vane," Elara said, sitting opposite her. "The Declaration is binding. Your father stated he was complete."

  "He stated he was tired," Maya said. Her voice was flat. She pushed the box across the table. "He'd been working on the city park renovation for five years. It drained him. He thought he was done."

  "The form specifies mental capacity. He was certified sane."

  "He was sane," Maya said. She opened the box. She didn't pull out legal briefs or character witnesses. She pulled out objects.

  First, a packet of seeds. *Heirloom Tomatoes. Planting Season: Spring.*
  "He bought these three days before he died," Maya said. "He put them in his coat pocket. He didn't plant them."

  Elara looked at the packet. "Purchase does not equal intent. He could have bought them for a client."

  Maya pulled out a brochure. *University of Northern Arts. Evening Course: Ceramics. Start Date: September 14th.*
  "The semester starts next month. He registered. He paid the deposit."

  "Registration is reversible."

  Maya pulled out the last item. A sketchbook. She opened it to the last used page. It was a drawing of a porch. Not the porch they had now, but a wider one. There were two chairs drawn in pencil, lightly shaded. In the corner of the page, a date: *Yesterday.*

  "He drew this the night before his heart stopped," Maya said. "He didn't know he was going to die. So when he drew this, he wasn't deprived yet. He was alive. He had the porch, the seeds, the class."

  She looked up at Elara, her eyes dry and burning. "But now he's dead. So there's no one to miss the porch. You say death can't be bad for him because he isn't there to feel the loss. But if he isn't there to feel the loss, then his signature on that form doesn't matter either. He isn't there to be complete."

  Elara stayed silent. This was the loop. The Bureau's logic was airtight, but it felt like it was closing around a vacuum.

  "If I approve this," Elara said quietly, "I have to identify the moment of harm. The system requires a timestamp. When was he harmed, Ms. Vane?"

  Maya looked at the seeds. "That's what I'm asking you."

  ***

  Back at Station 4, the file glowed. Elara inputted the evidence. The system flagged the ceramics brochure as *Potential Asset*. It flagged the seeds as *Negligible Value*. It flagged the sketch as *Subjective*.

  The Deprivation Index remained at zero.

  Elara leaned back. The Epicurean logic was comfortable. It protected the dead from the indignity of being counted as victims of their own biology. If death is nothing to us, then Vane suffered no injustice. He simply ceased. The Satiety Declaration was the final period on the sentence.

  But the Deprivation Account nagged at her. The future goods were real. The porch existed in the probability space. By dying, Vane was removed from the trajectory that led to the porch. He was deprived of the sitting.

  But Maya was right about the timing.
  Before the cardiac arrest, Vane was alive. He had the seeds. He had the registration. He was not deprived.
  After the cardiac arrest, Vane was gone. There was no subject to experience the deprivation.
  So when did the harm happen?

  If the harm happened at the moment of death, there was no one to receive it.
  If the harm happened before death, he wasn't deprived yet.

  Elara opened the Satiety Declaration again. She zoomed in on the signature. *Arthur Vane. 14 days prior.*
  She opened the sketchbook scan. *1 day prior.*

  In the interval between the signature and the sketch, something had shifted. The signature said *Closed*. The sketch said *Continuing*.
  The harm wasn't the death. The death was just the mechanism. The harm was the contradiction.

  Elara began to type. She bypassed the standard Deprivation Module. She opened the Manual Override console. This required a justification code.

  *Code 44: Administrative Error in Self-Assessment.*

  She typed: *Subject declared closure of account while biological and psychological capacity for desire remained active.*

  The system blinked. *ERROR: Subject status is Deceased. Cannot assess capacity.*

  Elara stopped. The system was right. You can't assess the capacity of a dead man. You can only assess the corpse.

  She looked at the seeds on her desk. She had asked Maya to leave them as evidence. They sat there, small, hard, dormant. They contained a tree. They contained fruit. They contained the labor of planting, watering, pruning. They contained the shade under which a grandchild might sit.

  Vane hadn't known he wanted the grandchild. He hadn't known he wanted the shade. He only knew he wanted to plant the seed.

  The philosophy said you can't be harmed by missing out on things you didn't want. But desire isn't a static list. It's a muscle. It grows when used. By dying, Vane didn't just lose the things he wanted; he lost the ability to want new things.

  The harm was the amputation of the capacity to desire.

  Elara typed: *Harm Type: Truncation of Volitional Horizon.*

  The system paused. The cooling fans in the server room beneath the floor kicked up a notch, a low hum vibrating through the legs of her desk.

  *QUERY: Timestamp of Harm?*

  Elara's fingers hovered.
  If she put the time of death, the subject field is null.
  If she put the time of the Satiety Declaration, the subject was alive and consenting.
  If she put the time of the sketch, the subject was alive and active.

  The harm existed in the gap between the *would* and the *did*. It existed in the future tense that was deleted.

  Maya's voice echoed in the sterile room. *He didn't know he was going to die. So when he drew this, he wasn't deprived yet.*

  Elara realized the Bureau's entire model was based on a lie. They treated life as a container being emptied. But life was a container being filled, and the shape of the container changed as it filled. You couldn't measure the deficit because the vessel itself was expanding until the moment it broke.

  She couldn't timestamp the harm. The harm wasn't an event. It was a cancellation.

  Elara deleted the timestamp field. She typed *N/A*.
  The system flashed red. *REQUIRED FIELD.*

  She looked at the seeds again. They were waiting for a spring that wouldn't come for them. But the harm wasn't to the seeds. It wasn't even to Vane, not exactly. Vane was gone. The harm was to the *continuity*.

  She thought about the payment. If she paid out, she was validating the Deprivation Account. She was saying Vane was robbed. If she denied it, she validated the Epicurean view. She was saying Vane was complete.

  Maya wasn't asking for the money to buy a porch. She was asking for the state to acknowledge that her father was still growing.

  Elara opened a new form. *Claim Reclassification.*
  She changed the beneficiary from *Estate of Arthur Vane* to *Maya Vane, Continuing Agent.*
  She changed the harm description from *Loss of Life Years* to *Invalidation of Latent Potential.*

  Then she went back to the timestamp.
  The system demanded a moment. It needed a coordinate in spacetime where the wrong occurred.
  Elara looked at the clock on her wall. 16:42.
  She looked at the date of death.
  She looked at the date of the sketch.

  She typed the timestamp of the *current moment*.

  *QUERY: Subject is deceased at time of entry. Harm cannot be contemporaneous.*

  Elara typed faster. *Harm is contemporaneous with Assessment. The deprivation is realized only in the eyes of the survivor.*

  *QUERY: This contradicts Statute 1. Harm must be to Subject.*

  Elara stopped. This was the wall. The philosophy wouldn't bend. The state couldn't pay for the grief of the living under the guise of the dead's loss. That was fraud.

  But Maya was right. There was a debt.
  Elara minimized the system window. She opened the raw code editor. It was risky. Auditors would see it.
  She accessed the *Counterfactual Projection* matrix. Usually, this calculated the life years. She tweaked the variables. She isolated the *Satiety Declaration* as a variable error.

  She inputted a new equation: *If Satiety == False, then Deprivation = Standard.*
  She set *Satiety* to *Null*.

  Not false. Null.
  A declaration made by a mortal cannot be binding on the infinite variable of future desire. To declare satiety is to claim knowledge of the future. That is an impossibility. Therefore, the declaration is void not because he changed his mind, but because he couldn't know.

  The system processed. The green bar on the screen flickered. It extended past the red line, faint and dotted. A ghost of a future.
  The number calculated. 1.8 million credits.

  *QUERY: Timestamp of Harm?*

  Elara stared at the cursor.
  If she said the moment of death, she lies about the subject.
  If she says before, she lies about the deprivation.

  She typed: *00:00:00.*
  *ERROR: Invalid Time.*

  She typed: *Continuous.*
  *ERROR: Invalid Format.*

  She realized she couldn't solve it. The puzzle wasn't meant to be solved. It was meant to be carried. The Bureau paid the money to silence the question, not to answer it.

  But she had to enter something.
  She looked at the packet of seeds on her desk. They were small, dark, hard. They contained a timeline. Inside that seed was the sprout, the vine, the flower, the fruit, the rot. All of it, compressed.
  When did the seed become the plant? There was no moment. It was a process.
  When did Vane become dead? There was no second. It was a fade.

  Elara entered the date of the Satiety Declaration.
  *Timestamp: 14 days prior to death.*

  *WARNING: Subject was alive at this time. Harm classification inconsistent.*

  Elara added a note in the audit log, visible only to senior clerks.
  *Harm occurred at the moment the Subject believed he was finished. The death merely enforced the error. The deficit is the cost of the mistake.*

  She hit *Submit*.
  The system accepted it. The green bar solidified into the dotted future, then vanished as the file closed. The credits transferred to Maya's account.

  Elara sat back. The office hummed. The ozone smell was stronger now.
  She picked up the packet of seeds. She shouldn't have taken them. Evidence was supposed to be returned or incinerated.
  She turned the packet over in her hands.
  *Planting Season: Spring.*

  It was autumn.
  Even if she planted them now, they wouldn't grow. They needed the right time. They needed a future that matched their internal clock.
  Vane was like this. He was timed for a future that was deleted.

  Elara opened her drawer and placed the seeds inside, among the pens and staplers. She closed the drawer.
  She wasn't planting them. She wasn't throwing them away.
  She was keeping them in the interval.

  On her screen, the case status updated to *Closed*.
  But the timestamp in the log blinked. *14 days prior.*
  It stayed there, marking a moment when a man was alive, signing a paper that said he was done, while his hand was already reaching for a seed he hadn't planted yet.

  Elara opened the next file.
  *Subject: L. Chen. Age 19. Cause: Overdose.*
  *Deprivation Index: Calculating...*

  She watched the green bar grow. She waited for the red line. She wondered, as the number ticked up, where exactly the cut happened. Was it in the needle? Was it in the childhood that led to the needle? Was it in the old age that wouldn't happen?

  The system chimed. *Calculation Complete.*
  Elara didn't look at the number. She looked at the drawer where the seeds waited for a spring that wasn't coming, preserved in the dark, neither planted nor discarded, hanging in the time between the want and the having.
