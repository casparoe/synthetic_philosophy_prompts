  2.  **Deconstruct the Philosophy (for internal use):**
      *   *Closure Principle:* If S knows P, and S knows that P implies Q, then S knows Q.
      *   *Nozick's Tracking View:* S knows P if: (1) P is true, (2) S believes P, (3) If P were false, S wouldn't believe P (variation), (4) If P were true, S would believe P (adherence).
      *   *The Problem:* Tracking is not closed under known implication. You can track P (if P were false, you wouldn't believe it) and track P->Q, but fail to track Q (because in the nearest world where Q is false, P might still be true, so you'd still believe P, and thus believe Q).
      *   *The Gadget:* Visualizes this. Low radius = near worlds (checking variation). High radius = distant worlds. The protagonist sees that for the links, the belief holds steady across relevant counterfactuals, but for the conclusion, there's a specific radius where the belief decouples from the truth.

