answer: |-
  The rain lashed against the observation deck of the New Thames Crossing, blurring the lights of Canary Wharf into smeared neon ribbons. Inside, the air was dry and smelled of ozone and fresh coffee. Elara stood before the console, the Specula heavy in her hands.

  It looked like a tablet fused with a sextant, a brass dial etched with micrometres on the side. The dial set the radius of divergence. Turn it left, and the screen showed you what you would believe if things were almost exactly the same—a world where the traffic light was amber instead of green. Turn it right, and you drifted further—a world where you'd taken a different job, or never been born.

  Elara was the lead auditor. Tomorrow, the Prime Minister would walk across this span. Her signature made it safe.

  "You're staring at it like it's going to bite," Simon said, leaning against the doorframe. He held two mugs. He was a good engineer, pragmatic, the sort of man who trusted the sum of the parts to equal the whole.

  "The steel tensile strength," Elara said, not looking up. "I'm running it through the Specula."

  "And?"

  "Green." She tapped the screen. A solid, unwavering emerald line. "At a radius of point-zero-five—meaning, in worlds almost identical to this one—if the steel were weak, I wouldn't believe it was strong. My tests would catch it. My belief tracks the truth. I know the steel is sound."

  "Excellent," Simon said, handing her a mug. "That's link one."

  "Link two: the load distribution algorithms." She adjusted the dial, ran the simulation. Again, the line held steady. "If the math were wrong, I'd see the error. I know the math is sound."

  Simon smiled, relaxing. "So, the steel is strong, and the math holds. Therefore, the bridge stands. You know the premises, Elara. You know the implication. Sign the bloody form so we can go home."

  Elara didn't move. She shifted her thumb to the final check: *Structural Integrity of the Completed Span*. This was the conclusion. Q.

  She set the radius to point-one. A slightly wider net. Not a world where she was a baker, but a world where the wind patterns off the Shard were slightly different, or the concrete cure time varied by an hour due to humidity. Small shifts, but enough to matter.

  The screen flickered.

  The emerald line wavered, dipping into a sickly yellow, then stabilising back to green. But there was a ghost reading underneath. A shadow metric.

  "What's that?" Simon asked, stepping closer.

  "Noise," Elara said, but she tightened her grip. She turned the dial further. Point-two.

  The screen split. On the top half: *Truth*. On the bottom: *Belief*.

  In the current world, the Truth was 'Safe'. Her Belief was 'Safe'. They matched. But the Specula wasn't showing her now. It was showing her the nearby worlds where the Truth was 'Unsafe'.

  "Look at the divergence," she whispered.

  At a radius of point-two, there were worlds where the bridge failed. Not because the steel was weak—she knew the steel was strong—and not because the math was wrong. They failed because of resonance. A specific harmonic frequency caused by the new high-speed trains crossing simultaneously with a gust from the east.

  In those worlds, the bridge swayed and cracked. The Truth was 'Unsafe'.

  But look at the bottom line. Her Belief remained 'Safe'.

  "Why?" Simon asked, frowning at the data. "You checked the steel. You checked the math."

  "Because in those worlds, the steel *is* strong," Elara said, her voice tight. "And the math *is* right. My tests for those things still pass. So I still believe the bridge is safe. But it isn't."

  "So you don't know it's safe," Simon said. It wasn't a question.

  "I know the steel is safe. I know the math is safe. But I don't know the bridge is safe."

  "That's madness," Simon said, putting his mug down with a clatter. "If you know A, and you know A implies B, then you know B. That's basic logic. You're telling me you know the components are fine, but you can't know the machine works?"

  "The Specula doesn't care about logic, Simon. It cares about tracking. To know the bridge is safe, I need to be such that if it *weren't* safe, I wouldn't believe it was." She tapped the ghost reading. "But here, at this radius, the bridge isn't safe, and I *still* believe it is. My belief doesn't track the safety. It only tracks the components."

  "So the knowledge doesn't close," Simon said, rubbing his temples. "The gap opens up between the parts and the whole."

  "It opens up exactly where the unforeseen interactions live," Elara said. "My tests are designed to catch material failure. They aren't designed to catch systemic resonance unless I specifically look for it. If I don't look for it, my belief stays fixed even when the truth changes."

  "But you've done the standard protocols," Simon argued, his voice rising slightly. "Everyone uses the closure principle. We assume that if the inputs are known, the output is known. If you stop here, you stop the opening. You cost the city millions. On the basis of a ghost reading?"

  "On the basis that I don't know," Elara said. She looked out at the bridge. It was a beautiful thing, a harp of steel against the grey sky. "If I sign this, I am saying I know it will hold. But the device shows me worlds where it falls, and I'm still signing. That's not knowledge. That's just confidence."

  "Confidence is enough for engineering," Simon said. "We deal in probabilities. You know the probabilities are favourable."

  "Knowledge isn't probability," Elara said. "Not with this thing. We bought the Specula to stop us pretending. To stop us saying 'I know' when we really mean 'I hope'."

  She turned the dial back to zero. The screen cleared. The green line returned, solid and reassuring. It was so tempting. It felt like knowledge. It felt like certainty.

  But she remembered the flicker at point-two. The worlds where the wind sang the wrong note, and the steel held firm while the welds sheared, and she stood there believing it was fine until the moment it wasn't.

  "Simon," she said quietly. "If I sign this, and the bridge falls because of something my tests didn't cover... did I know it was safe?"

  "You followed the procedure."

  "Procedure isn't knowledge. The Specula proves that. I can know every brick is solid, and still not know the wall will stand."

  Simon looked at the device, then at the bridge. He was a reasonable man. He wanted the bridge to open. He wanted to trust his colleague. But he had seen the split screen. He had seen the worlds where Elara was wrong, yet certain.

  "What do you need?" he asked, his shoulders slumping.

  "I need to run the resonance simulations," Elara said. "It'll take three days. We miss the opening ceremony."

  "The Prime Minister..."

  "Will walk on a bridge I know is safe," Elara said. "Or he won't walk it at all."

  She picked up the stylus. She didn't sign the certification. Instead, she opened a new file: *Additional Testing Required*.

  Simon watched her for a long moment. He picked up his cold coffee, took a sip, and grimaced. "Three days," he said. "I'll tell the site manager."

  "Tell them I know the steel is good," Elara said, watching the rain. "That part is true. I know that much."

  "But not the bridge."

  "Not yet."

  She set the Specula down. The dial sat at zero, innocent and quiet. It didn't tell her the bridge would fail. It only told her that her certainty was a local phenomenon, valid for the parts but not the whole. She could live with the delay. She couldn't live with the gap.

  Outside, the Thames flowed on, indifferent to the difference between knowing the water was wet and knowing you wouldn't drown. Elara picked up the phone to order the simulations. The line clicked, solid and clear. She knew the phone worked. She just hoped the rest would catch up.
