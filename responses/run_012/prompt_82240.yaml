prompt: |-
  hey, im in a decision theory class and our prof is letting us submit our own exam question for the final (wierd, i know). i want to write one on death in damascus but im worried everyone will just write "EDT says stay, CDT says flee" and get full marks. can you help me write a question that actually makes people think, plus a model answer and a marking scheme?

  heres my idea for the twist. the standard case: death tells you he'll be in damascus tomorrow. you can stay or flee to aleppo. deaths prediction is reliable, so if you stay, thats evidence hes in aleppo, and if you flee, thats evidence hes in damascus. EDT says stay (since staying is evidence of survival). CDT says flee (since your choice doesnt causally affect where he is, and you should go where hes less likely to be).

  now the twist i want: suppose deaths prediction is only 80% reliable, and you know that. does EDT still recommend staying? does CDT still recommend fleeing? and heres the part i really want: suppose you can flip a fair coin to decide, and deaths prediction was about the coin outcome, not your deliberation. does that change anything? and finally, what if you find out deaths prediction was made by a brain-scanner that reads your neural activity at the moment youre deliberating — does that make the correlation evidential or causal, or does that distinction even make sense here?

  i want the question to be answerable in about 90 minutes, and i want the marking scheme to seperate an A from a B by naming specific moves. like, a B answer will just say "EDT uses conditional probabilities, CDT uses counterfactuals." an A answer should say something about decision instability, or about whether the coin-flip version makes the correlation between act and outcome vanish, or about whether the brain-scanner version collapses the evidential/causal distinction.

  also, please dont make it too long — maybe 600 words for the model answer. and can you make sure the marking scheme has specific point values? thanks!
