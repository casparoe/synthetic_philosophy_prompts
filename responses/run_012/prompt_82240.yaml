answer: |-
  ### Exam Question: Death in Damascus Revisited (20 Points)

  **Scenario:** 
  You are in Damascus. Death predicts where you will be tomorrow and goes there to find you. You prefer Survival (Utility = 1) over Death (Utility = 0). You know Death's prediction mechanism is 80% reliable: 
  *   $P(\text{Death in Damascus} | \text{You Stay}) = 0.8$
  *   $P(\text{Death in Aleppo} | \text{You Flee}) = 0.8$

  **Part A (5 pts):** Calculate the expected utility of Staying and Fleeing according to Evidential Decision Theory (EDT) and Causal Decision Theory (CDT). Assume CDT treats your act as causally independent of Death's prior location.

  **Part B (5 pts):** Suppose you commit to deciding via a fair coin flip, and Death predicts the *coin outcome* with 80% reliability. Does this break the evidential correlation for EDT? Explain.

  **Part C (10 pts):** Suppose instead Death uses a brain-scanner that reads your neural activity *during deliberation*, which causally produces your choice. Does this collapse the distinction between EDT and CDT? Discuss decision instability and whether the correlation is evidential or causal.

  ***

  ### Model Answer

  **Part A:** 
  For EDT, we maximize $E[U|Act]$. 
  $E[U|\text{Stay}] = P(\text{Survive}|\text{Stay}) \times 1 = 0.2$. 
  $E[U|\text{Flee}] = P(\text{Survive}|\text{Flee}) \times 1 = 0.2$. 
  EDT is initially indifferent. 
  For CDT, we maximize $E[U|do(Act)]$. Since your choice cannot causally influence Death's prior location, $P(\text{Death in D}|do(\text{Stay})) = P(\text{Death in D})$. Assuming a uniform prior (0.5), CDT also yields 0.5 expected utility for both acts. Both theories recommend indifference, but for different reasons.

  **Part B:** 
  No, flipping a coin does not break the evidential correlation for EDT. If Death predicts the coin outcome, then observing the coin landing Heads (Stay) is still evidence that Death predicted Heads (Damascus). The conditional probability $P(\text{Death in D}|\text{Coin=Stay})$ remains 0.8. EDT still sees the act as bad news. CDT, however, treats the coin flip as an exogenous causal intervention. Since the coin flip is causally independent of Death's prior prediction mechanism (assuming Death predicts the *output* but cannot change the past), CDT maintains that the act does not influence the state. The correlation remains evidential, not causal.

  **Part C:** 
  This scenario challenges the EDT/CDT distinction. If the brain-scanner reads neural activity that *causes* the choice, the correlation is no longer merely evidential; it is grounded in a common cause (the neural state). 
  For CDT, this is crucial. If the neural state $N$ causes both the Prediction $P$ and the Act $A$, then conditioning on $A$ screens off $P$. However, CDT uses counterfactuals $do(A)$. If $A$ is determined by $N$, can you truly $do(A)$? 
  This leads to **decision instability**. If EDT recommends Stay, you know your neural state predisposed you to Stay, meaning Death is in Damascus. You should then Flee. But if you Flee, your neural state must have been different, meaning Death predicted Flee. 
  In this specific "common cause" structure, EDT and CDT may converge if the agent conditions on the full causal history (ratificationism). However, standard CDT insists that once the neural state is fixed, your choice is determined, rendering deliberation futile. The distinction collapses only if we accept that the "evidence" provided by the scanner is actually a report on the causal antecedents of the act. An A-grade analysis recognizes that the scanner makes the correlation *diagnostic* of the cause, turning the problem into a Newcomb-like scenario where EDT fails due to instability, while CDT struggles with the definition of "free" intervention against a deterministic reader.

  ***

  ### Marking Scheme

  **Part A (5 Points)**
  *   **3 pts:** Correctly calculates EDT utilities (0.2 for both).
  *   **2 pts:** Correctly identifies CDT independence assumption (utilities equal based on prior).
  *   *B Grade:* Correct math but fails to note indifference.
  *   *A Grade:* Notes that indifference masks underlying structural differences.

  **Part B (5 Points)**
  *   **3 pts:** States clearly that correlation persists for EDT (Prediction tracks Coin).
  *   **2 pts:** Explains CDT view (Coin is exogenous intervention).
  *   *B Grade:* Says randomization "breaks" the prediction.
  *   *A Grade:* Distinguishes between predicting the *agent* vs. predicting the *randomizer*.

  **Part C (10 Points)**
  *   **4 pts:** Identifies the "Common Cause" structure (Neural State $\to$ Act & Prediction).
  *   **3 pts:** Discusses **Decision Instability** (recommendation changes upon reflection).
  *   **3 pts:** Evaluates whether EDT/CDT collapse (e.g., via Ratificationism or causal screening).
  *   *B Grade:* Defines EDT/CDT generally ("one uses conditionals, one uses counterfactuals") without applying to the scanner.
  *   *A Grade:* Explicitly mentions **instability**, **screening off**, or the **collapse of the evidential/causal distinction** due to the common cause mechanism.
