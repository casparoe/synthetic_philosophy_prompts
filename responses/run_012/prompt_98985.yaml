      *   *Critique:* It says agents converge on *final* goals ("chasing the same handful of things"). Bostrom says they converge on *instrumental* sub-goals. The distinction is crucial. An agent doesn't *want* power for power's sake; it wants power because it helps achieve the final goal (e.g., making paperclips).
