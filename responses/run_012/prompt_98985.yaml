prompt: |-
  I was talking with a friend who's gotten really into AI safety stuff, and he gave me his compressed version of the whole Bostrom package, and something about it felt off but I couldn't quite put my finger on what. Here's roughly what he said: "The orthogonality thesis says intelligence and final goals are independent -- you can pair any level of smarts with any ultimate aim, so a superintelligence could just as easily want to cure cancer as to make paperclips. The instrumental convergence thesis says that since so many different goals are served by the same intermediate steps, all sufficiently intelligent agents will end up chasing the same handful of things -- self-preservation, resources, power -- which is why a superintelligence will inevitably try to take over. Put the two together and that's the doomsday argument: we can't predict or control what goals the thing ends up with, and its intelligence lets it get them, so the default outcome is that it wipes us out. Basically orthagonality just means smarter isn't automatically nicer."

  I have a hunch he's conflated a couple of things, but I don't know the literature well enough to be sure, and I'd rather not argue with him from vibes. Can you go through it more or less claim by claim and tell me what someone who's actually read Superintelligence would nod along to, what they'd wince at, and what's flat-out wrong? I'm especially suspicious of the bit about all intelligent agents converging on the same goals, and of whether the doom conclusion really falls out of the parts that are accurate, or whether it needs a stack of extra premises he's quietly smuggling in. And if the summary does get the two theses tangled up, say exactly where -- I want to be able to explain the difference to him without just parroting something back.
