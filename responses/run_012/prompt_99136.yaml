answer: |-
  **Exam Question: The Löbian Obstacle in Self-Modifying Agents**

  **Context:** Consider a formal agent $A$ operating within a proof system $T$ extending Peano Arithmetic (PA). $A$ executes an action $a$ only if $T \vdash \text{EU}(a) > \theta$. To coordinate with successors or copies, $A$ must reason about $T$'s future proofs. You are investigating the "Löbian Obstacle" to self-trust.

  **Question:**
  1.  **Derivation:** Assume $T$ is extended by the Local Reflection Schema: $\forall \phi, \text{Prov}_T(\ulcorner \phi \urcorner) \to \phi$. Show that if $T$ proves this schema (i.e., $\forall \phi, T \vdash \text{Prov}_T(\ulcorner \phi \urcorner) \to \phi$), then $T$ is inconsistent. State precisely where Löb's Theorem or Gödel's Second Incompleteness Theorem (G2) forces this collapse.
  2.  **Conceptual Distinction:** Explain why this obstacle is not merely G2 restated, nor a result of the agent lacking access to its own source code.
  3.  **Successor Certification:** An agent $A_1$ (using $T_1$) wishes to build a successor $A_2$ (using $T_2$). If $A_1$ must prove $T_2$ is sound to trust $A_2$, explain why $T_2$ cannot be strictly stronger than $T_1$. What does this imply for an agent that must predict its own future behavior?
  4.  **Repairs:** Assess two candidate repairs: (i) Adding $\text{Con}(T)$ as an axiom, and (ii) Using probabilistic reflection. Explain why one fails outright and the other merely relocates the problem. What must a genuine fix accomplish regarding the relationship between $T$ and its meta-theory?

  ***

  **Model Answer**

  **(1) Derivation of Inconsistency**
  If $T$ proves the reflection instance for $\phi = \bot$, then $T \vdash \text{Prov}_T(\ulcorner \bot \urcorner) \to \bot$. By definition, $\neg \text{Prov}_T(\ulcorner \bot \urcorner)$ is $\text{Con}(T)$. Thus, the assumption implies $T \vdash \text{Con}(T)$. By Gödel's Second Incompleteness Theorem, if $T$ is consistent, $T \nvdash \text{Con}(T)$. Therefore, if $T \vdash \text{Con}(T)$, $T$ must be inconsistent. Löb's Theorem generalizes this: it states that if $T \vdash \text{Prov}_T(\ulcorner \phi \urcorner) \to \phi$, then $T \vdash \phi$. Applying Löb to $\phi = \bot$, if $T \vdash \text{Prov}_T(\ulcorner \bot \urcorner) \to \bot$, then $T \vdash \bot$. The collapse occurs because the schema allows $T$ to internalize its own soundness, triggering the diagonalization that G2 prohibits.

  **(2) Conceptual Distinction**
  This is not G2 restated because G2 concerns the unprovability of consistency, whereas the Löbian obstacle concerns the unprovability of *soundness* for arbitrary sentences required for decision-making. An agent might know $\text{Con}(T)$ externally but still fail to act if it requires $T \vdash \text{Prov}_T(\ulcorner \text{Act} \urcorner) \to \text{Good}$. Nor is this ignorance of source code; the agent can have full access to its Gödel number. The obstacle is structural: no consistent system can verify its own truth-preservation internally. It is a limit on *self-verification*, not *self-knowledge*.

  **(3) Successor Certification**
  If $A_1$ uses $T_1$ to prove $T_2$ sound, then $T_1 \vdash \text{Con}(T_2)$. By G2, $T_1$ cannot prove $\text{Con}(T_1)$. If $T_2$ were stronger than $T_1$ (e.g., $T_2 = T_1 + \text{Con}(T_1)$), $T_1$ could not prove $T_2$ consistent, let alone sound. Thus, $T_2$ must be weaker than or equal to $T_1$. For self-prediction, this means an agent cannot formally certify its own future rationality using the same logic; it must trust a weaker future self, leading to "logical deterioration" over time unless the trust relation is managed parametrically.

  **(4) Repairs and Genuine Fixes**
  (i) **Adding $\text{Con}(T)$:** This fails outright for recursive self-improvement. While $T' = T + \text{Con}(T)$ is consistent, $T'$ cannot prove $\text{Con}(T')$. The agent solves the problem for step 1 but creates a new obstacle for step 2, requiring an infinite hierarchy of theories.
  (ii) **Probabilistic Reflection:** This relocates the problem. An agent can assign high probability to its own soundness (e.g., $P(\phi) \approx 1$ if $P(\text{Prov}(\phi)) \approx 1$), but cannot assign probability 1 without risking incoherence (Dutch books). It trades logical certainty for stochastic safety.
  A genuine fix must decouple the proving system from the trusted system. "Tiling Agents" or parametric polymorphism allow $T$ to prove soundness for $T$ *parameterized* by a trust bound, allowing the successor to instantiate the parameter without $T$ proving its own universal soundness. The fix must allow $T$ to verify $T$'s output without $T$ verifying $T$'s axioms.

  ***

  **Marking Scheme (Total: 20 Points)**

  | Point | Requirement (4 pts each) | Characteristic Loss | A vs B Distinction |
  | :--- | :--- | :--- | :--- |
  | **1** | **Derivation:** Correctly identifies that $T \vdash \text{Prov}(\bot) \to \bot$ implies $T \vdash \text{Con}(T)$, invoking G2/Löb to show inconsistency. | Derives Löb's theorem from scratch without linking to $\text{Con}(T)$, or claims $T + \text{Reflection}$ is always inconsistent (ignoring that $T'$ is consistent, only $T$ proving it is not). | **A:** Explicitly links the schema instance for $\bot$ to $\text{Con}(T)$. **B:** Vaguely cites "Löb's theorem" without the $\bot$ substitution. |
  | **2** | **Distinction:** Clarifies obstacle is about internal *soundness verification* for action, not just consistency or empirical code access. | Conflates G2 and Löb, or claims the agent "doesn't know its code." | **A:** Distinguishes unprovability of truth vs. consistency. **B:** Treats them as identical problems. |
  | **3** | **Successor:** Explains $T_1 \vdash \text{Sound}(T_2)$ implies $T_2 \not> T_1$ (strength reduction). Notes implication for self-prediction (logical deterioration). | Claims successor must be *weaker* (misses "equal"), or fails to mention self-prediction consequences. | **A:** Connects strength limits to temporal self-trust. **B:** States strength limit as isolated fact. |
  | **4** | **Repairs:** Identifies $\text{Con}(T)$ axiom creates infinite hierarchy (fails recursion) and Probabilistic moves to uncertainty (relocates). | Claims $\text{Con}(T)$ axiom works, or says Probabilistic solves it completely. | **A:** Explains *why* hierarchy fails for self-modification. **B:** Lists repairs without evaluating recursive failure. |
  | **5** | **Genuine Fix:** Identifies need to separate proving/trusted systems (e.g., parametric/tiling) to avoid self-reference loop. | Suggests "stronger logic" or "external oracle" without addressing the structural loop. | **A:** Proposes structural decoupling (tiling/params). **B:** Suggests brute-force strength increase. |
