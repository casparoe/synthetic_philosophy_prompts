answer: |-
  # The Editorial Demarcation Protocol (EDP)

  **Purpose:** To distinguish scientific claims from non-scientific claims and scope mismatches prior to peer review.
  **Time Allocation:** 30 minutes per manuscript.
  **Operators:** Managing Editor + two Editorial Board Members (General Science background).
  **Outputs:** One of three decisions: (1) Send for Review, (2) Decline (Not Scientific), (3) Refer to Editor-in-Chief (Policy/Scope).

  ---

  ## Part I: The Procedure

  **Instruction:** Read the abstract, introduction, and methods (or theoretical equivalent). Answer the following questions in order. Do not proceed to the next question unless the previous one is satisfied. Record the justification for the decision in the "Editorial Minute" field provided at the termination point.

  ### Q1: The Empirical Claim Test
  **Question:** Does the manuscript make a claim about the contingent state of the natural or social world that could, in principle, be otherwise?
  *   **Sufficient Answer:** "Yes." The text asserts that something exists, happens, or relates in a specific way that is not true by definition (logic/math) or purely normative (ethics/aesthetics).
  *   **Termination (No):** **Decline (Not Scientific Claim).**
      *   *Justification:* "The manuscript addresses questions of logic, definition, or value rather than empirical claims about the world."
  *   **Proceed (Yes):** Go to Q2.

  ### Q2: The Risk Condition Test
  **Question:** Does the authors' method specify a state of affairs (data, observation, or experimental outcome) that would lower confidence in the claim or trigger a defined decision rule?
  *   **Sufficient Answer:** "Yes." This includes: (a) a statistical threshold (e.g., *p* < 0.05) where failure to meet it counts against the hypothesis; (b) a search protocol for existence claims where failure to find the entity after exhaustive effort counts against it; or (c) a specific observation that would contradict a theoretical prediction.
  *   **Constraint:** Do not reject because the test is difficult, expensive, or currently technologically limited. Ask only if the *condition* is specified.
  *   **Termination (No):** **Decline (Not Scientific Claim).**
      *   *Justification:* "The manuscript does not specify conditions under which the claim would be regarded as less probable or abandoned."
  *   **Proceed (Yes):** Go to Q3.

  ### Q3: The Immunization Test
  **Question:** If the Risk Condition (Q2) were met (i.e., the data came out "wrong"), does the author reserve the right to reinterpret the core mechanism to accommodate the data without abandoning the central claim?
  *   **Sufficient Answer:** "No." The authors indicate that negative results would require abandoning or significantly revising the core hypothesis, not merely adjusting auxiliary assumptions to make the core unfalsifiable.
  *   **Constraint:** Distinguish between adjusting parameters (acceptable) and changing the mechanism to fit *any* outcome (unacceptable).
  *   **Termination (Yes, they would immunize):** **Refer to Editor-in-Chief.**
      *   *Justification:* "The claim is empirically grounded but employs a protective structure that risks degenerating into non-falsifiability. Decision requires policy guidance on speculative theory."
  *   **Proceed (No):** Go to Q4.

  ### Q4: The Observational Access Test
  **Question:** Is the property or entity claimed to exist accessible to observation or measurement in principle, even if not in this specific study?
  *   **Sufficient Answer:** "Yes." There is a conceivable chain of inference or detection method.
  *   **Constraint:** Do not reject because the property is subjective (e.g., pain) if it is linked to reportable behavior or neural correlates. Reject only if the author explicitly states the property is *in principle* undetectable.
  *   **Termination (No):** **Decline (Not Scientific Claim).**
      *   *Justification:* "The manuscript posits properties that are explicitly defined as inaccessible to empirical observation."
  *   **Proceed (Yes):** Go to Q5.

  ### Q5: The Consensus Conflict Test
  **Question:** Is the primary objection to the manuscript that the claim contradicts established consensus or belongs to a field of low prestige, rather than failing Q1–Q4?
  *   **Sufficient Answer:** "Yes." The claim is testable (Q2), vulnerable (Q3), and accessible (Q4), but likely false or controversial.
  *   **Termination (Yes):** **Send for Review.**
      *   *Justification:* "The manuscript meets demarcation criteria for scientific claims. Validity is a matter for peer review, not editorial screening."
  *   **Proceed (No):** Go to Q6.

  ### Q6: The Scope Test
  **Question:** Is the claim scientific (passed Q1–Q5) but outside the journal's defined remit (e.g., purely clinical, purely engineering, or outside our natural/social science boundary)?
  *   **Sufficient Answer:** "Yes."
  *   **Termination (Yes):** **Refer to Editor-in-Chief.**
      *   *Justification:* "The manuscript is scientific but falls outside current scope definitions. Requires policy decision on journal boundaries."
  *   **Termination (No):** **Send for Review.**
      *   *Justification:* "The manuscript meets demarcation criteria and falls within journal scope."

  ---

  ## Part II: Application to Last Month's Queue

  Below are the Editorial Minutes generated by running the EDP on the three specified submissions.

  ### Submission A: Cosmological Ensemble Mechanism
  **Abstract Summary:** Proposes a mechanism generating an ensemble of universes. Claims existing data satisfy a statistical prediction derived from the mechanism.
  **EDP Run:**
  *   **Q1 (Empirical):** Yes. Claims a mechanism exists in reality.
  *   **Q2 (Risk):** Yes. Offers a statistical prediction satisfied by data.
  *   **Q3 (Immunization):** **FAIL.** When pressed on refutation, authors state they would modify the mechanism if data differed.
  *   **Decision:** **Refer to Editor-in-Chief.**
  *   **Editorial Minute:** "Manuscript passes initial falsifiability but fails the Immunization Test (Q3). Authors indicate the core mechanism would be adjusted rather than abandoned if predictions failed. This presents a risk of publishing a degenerative research programme. Requires Board policy decision on speculative cosmology."

  ### Submission B: Preregistered Multi-Site Study (Fringe Field)
  **Abstract Summary:** Reports positive effect in a field the Board regards as fringe. Preregistered, adequately powered, severe test.
  **EDP Run:**
  *   **Q1 (Empirical):** Yes. Claims an effect exists.
  *   **Q2 (Risk):** Yes. Preregistered decision rules and thresholds specified.
  *   **Q3 (Immunization):** Pass. Negative results would have counted against the hypothesis.
  *   **Q4 (Access):** Yes. Measured via standard instruments.
  *   **Q5 (Consensus):** **TRIGGER.** Objections are based on field prestige/consensus, not demarcation.
  *   **Decision:** **Send for Review.**
  *   **Editorial Minute:** "Manuscript meets all demarcation criteria (Q1–Q4). Objections relate to field standing rather than scientific status (Q5). Procedure mandates review to separate demarcation from belief."

  ### Submission C: Phenomenological Property Claim
  **Abstract Summary:** Argues certain experiences have a property that no possible observation could disclose. Author treats this as a strength.
  **EDP Run:**
  *   **Q1 (Empirical):** Yes. Claims experiences have a property.
  *   **Q2 (Risk):** Ambiguous.
  *   **Q3 (Immunization):** N/A.
  *   **Q4 (Access):** **FAIL.** Author explicitly states property is inaccessible to observation.
  *   **Decision:** **Decline (Not Scientific Claim).**
  *   **Editorial Minute:** "Manuscript posits properties explicitly defined as inaccessible to empirical observation (Q4). This constitutes a metaphysical claim rather than a scientific one. Decline without prejudice to validity."

  ---

  ## Part III: Meta-Analysis of the Procedure

  ### 1. Compression Losses (The One-Page Summary)
  If this procedure is compressed for a new Associate Editor, the following distinctions are lost, increasing the risk of error:
  *   **The Statistical Nuance (Q2):** A one-pager will likely ask "Is it falsifiable?" rather than "Is there a decision rule?" This leads to rejecting probabilistic claims that require thresholds.
  *   **The Immunization Distinction (Q3):** Without the explicit instruction to distinguish between *adjusting parameters* (normal science) and *changing the mechanism to fit any data* (degenerative), editors will reject legitimate theoretical work that is still being refined.
  *   **The "In Principle" Clause (Q4):** Editors may confuse "hard to measure" with "impossible to measure." The detailed constraint prevents rejecting difficult existence claims.

  ### 2. Judgments in Procedural Clothing
  The following steps appear mechanical but rely on hidden editorial judgment:
  *   **Q3 (Immunization):** Determining whether a revision is a "parameter adjustment" or a "core mechanism change" requires interpreting the authors' intent. An editor's bias can frame a reasonable adjustment as an immunizing stratagem.
  *   **Q5 (Consensus Conflict):** Deciding whether an objection is "belief-based" or "evidence-based" is subjective. An editor may genuinely believe a claim is untestable (Q2) when the author believes it is merely untested. The procedure forces the editor to categorize their own doubt.

  ### 3. What the Procedure Cannot Decide
  *   **Truth:** The procedure explicitly separates demarcation from truth. Submission B could be fraud, error, or truth; the procedure only ensures it is *science*.
  *   **Value:** It cannot determine if a scientific claim is *worth* publishing. A trivial, correctly executed study passes Q1–Q5.
  *   **The "Degenerative" Threshold:** For Submission A, the procedure flags the risk but cannot decide if the speculation is *productive* speculation or *wasted* speculation. That is why it refers to the EIC. The procedure identifies the wound; it cannot prescribe the cure.

  ### 4. The Unenjoyable Answer
  **Submission B (The Fringe Field)** is the outcome you will not enjoy.
  *   **Why:** It forces the journal to expend resources reviewing work the Board dislikes.
  *   **The Step:** **Q5 (Consensus Conflict Test).**
  *   **The Work:** This step strips the editors of the ability to use "low regard" as a proxy for "not science." It compels you to treat a fringe claim that is rigorously tested as scientifically equal to a mainstream claim that is rigorously tested. It protects the journal from the error of rejecting the manuscript that was later refuted scientifically (your second case study), but it requires you to defend the review process to a skeptical Board.
