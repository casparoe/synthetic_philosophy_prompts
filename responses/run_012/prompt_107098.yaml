  **OAKLAND STATE PHYSICS DEPARTMENT ABOLISHES MATTER TO CUT ONTOLOGICAL OVERHEAD**

  **OAKLAND STATE UNIVERSITY** — The Office of the Provost announced Monday that the Department of Physics has officially transitioned to a Berkeleian Idealist framework, effective immediately. In a move to streamline metaphysical commitments and reduce ontological overhead, the existence of material substance has been deemed an unnecessary hypothesis.

  "Matter is an idle hypothesis," said Department Chair Dr. Lyle Corwin during a press conference held in a lecture hall that, according to the new ontology, exists only as a collection of perceptual ideas. "We are retaining all phenomena. Gravity still pulls. Cyclotrons still spin. We are simply eliminating the unperceivable substrate previously assumed to support them. It's Occam's Razor applied to being itself."

  The shift has created logistical friction with Facilities Management. When a pipe burst in Lab 304 last week, maintenance crews were unable to locate the material pipe to repair it. "The foreman kept asking for the copper substrate," said Corwin. "I explained that the wetness on the floor is an idea of sense—vivid, orderly, and involuntary—which confirms its reality within the Divine Mind. The leak is real; the matter is not. He still tried to wrench a phantom valve. We had to remind him that the wrench, too, is an idea."

  Critics argue the move is semantically hollow. Dr. Helen Vance, a neighboring materialist realist, noted that the change is empirically undetectable. "They claim the world is ideas in the mind of God rather than objects in space," Vance said. "But if I drop a brick on my foot, the pain is identical. No experiment could ever tell the difference. They've renamed the furniture, not moved it. It's scientifically inert. I teach Newtonian mechanics; they teach theology with equations."

  Corwin insists the distinction protects against skepticism. He cited the department's recent adoption of the "Master Argument" as justification. "Try to conceive of a tree existing unconceived," Corwin told reporters. "You cannot. The act of conception implies a perceiver. Therefore, unperceived matter is inconceivable." When asked if this relies on conflating the act of thinking with the object thought of—a common criticism that the argument cheats by definitionally locking the object inside the mind—Corwin replied that the impossibility of the task proves the point. "Critics say it's a trick of grammar. We say it's a limit of thought. If you cannot frame the idea, the idea has no meaning. We are done positing things we cannot possibly encounter."

  Concerns regarding solipsism were dismissed. "Other minds exist, and the continuity of the laboratory when locked at night is secured by infinite perception," Corwin said. "The spectrometer doesn't vanish. God is still looking at it."

  **SIDEBAR: CAMPUS SAFETY UPDATES**
  The Environmental Health & Safety Office has released Form 10-B (Immaterial). The checkbox for "Material Hazard" has been removed. Users must now classify risks as "Ideas of Sense" (High Vividness) or "Ideas of Imagination" (Low Vividness). Warning labels regarding "Physical Impact" have been updated to read "Violent Sensory Input." Staff are reminded that while pain is real, suffering from the loss of material property is based on a category error. Insurance claims for "Destroyed Equipment" must now be filed under "Discontinued Perceptual Sequences."
