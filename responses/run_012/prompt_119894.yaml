answer: |-
  **Note to Author:**
  Regarding your procedural question: Do not write this as if the deal is already agreed, but do not frame the dissent as an obstacle. Frame the dissent as the *architect* of the compromise. By explicitly stating that the Two-Track Plan was designed *in response* to the ethical and procedural objections raised, you validate the dissenters' integrity without granting them a veto. This strengthens the compromise because it shows the Board listened, rather than merely bargained. Below is the memo drafted for circulation.

  ***

  **MEMORANDUM**

  **TO:** Board of Directors, Coastal Field Station
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Invasive Species Management Plan

  **Recommendation**
  I recommend the Board adopt the "Two-Track Plan" proposed by the mediator, subject to the strict performance triggers outlined below. This approach authorizes immediate trapping and hand-dispatch on the headland for three seasons, excludes aerial bait from the bay catchment, and establishes a co-management role for local fishing families.

  **Reasoning: Beyond the "Win-Win"**
  There is a concern that this compromise treats moral convictions as mere economic preferences—that we are "trading" the welfare of rats or the integrity of the bay for social peace. If the objection to aerial bait is deontological (i.e., that killing sentient individuals in this manner is inherently wrong, regardless of the outcome), then a simple trade is indeed unethical. You cannot bargain away a moral truth.

  However, governance requires balancing competing duties, not just maximizing utility. We have a duty to the seabird colony (stewardship), a duty to minimize suffering where possible (welfare), and a duty to procedural justice for local stakeholders (equity). The Two-Track Plan is not a trade-off that dilutes these duties; it is an integration of them. By rejecting the aerial drop, we acknowledge that the *method* of conservation carries moral weight. By including the fishing families in co-management, we acknowledge that conservation cannot succeed without social license. This is not buying off opposition; it is widening the scope of our ethical responsibility.

  **Risk Management: The "Worst-of-Both-Worlds" Objection**
  The strongest technical objection is that a partial measure may fail: trapping may be too slow, rat populations may become bait-shy, and the colony may collapse anyway, leaving us with neither ethical purity nor ecological success. This risk is real. A compromise that fails the birds serves no one.

  Therefore, adoption of the Two-Track Plan must be conditional on a "Sunset Clause" with hard triggers. We cannot allow a failed compromise to become permanent inertia.

  **Implementation and Triggers**
  1.  **Timeframe:** The trapping program is authorized for three consecutive autumn/winter seasons, commencing [Year].
  2.  **Performance Metrics:** Success is defined as: (a) a 90% reduction in rat tracking indices on the headland by the end of Season 2, and (b) stabilization of seabird fledgling counts by the end of Season 3.
  3.  **Reversion Trigger:** If these metrics are not met, the Board must immediately authorize a full aerial bait operation for the subsequent window.
  4.  **Decision Authority:** To avoid returning to deadlock, the verification of these metrics shall be conducted by the Lead Ecologist and one independent external reviewer appointed by the Chair. Their joint determination will trigger the reversion automatically, without requiring a new Board vote.

  **Conclusion**
  We are deadlocked because we are asking a single binary choice to answer a multi-faceted problem. The Two-Track Plan allows us to test a more ethically nuanced approach without surrendering our primary mandate to save the colony. It respects the moral seriousness of the staff's objection by changing our methods, and it respects the community's stake by changing our process. But it must remain a test, not a dogma. If the data shows the birds are losing, we must have the courage to revert to the most effective tool available.

  I move that we adopt the Two-Track Plan with the triggers as written.
