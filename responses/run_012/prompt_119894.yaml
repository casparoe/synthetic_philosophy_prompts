      *   *Check:* Is the recommendation clear? *Adjustment:* Bold the recommendation.

  7.  **Final Polish:** Check word count and flow. Ensure the voice sounds like a retired geologist (pragmatic but thoughtful). *Self-correction: Make sure not to sound too academic. The board needs to vote, not attend a lecture.*

