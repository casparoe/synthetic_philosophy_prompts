      *   **Intellectualists (Stanley, Williamson):** Know-how is a species of know-that. To know how to $\phi$ is to know, under a practical mode of presentation, that $w$ is a way to $\phi$.
      *   **Anti-Intellectualists (Ryle, Dreyfus, Fridland):** Know-how is distinct. It involves dispositions, bodily skills, and often operates without propositional guidance. Expertise often bypasses deliberation.
      *   **The Stalemate:** Intellectualists expand "proposition" and "knowledge" to cover dispositions. Anti-Intellectualists insist the *phenomenology* and *mechanism* of skill are non-propositional.
      *   **Key Tensions:**
          *   *The Coaching Problem:* If knowledge is propositional, why doesn't telling the proposition create the skill?
          *   *The Automaticity Problem:* When action is fast/automatic, is the proposition still guiding, or is it a mere disposition?
          *   *The "Practical Mode of Presentation" (PMOP):* Is this a real psychological mechanism or a philosophical placeholder?

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal but conciliatory. "Joint Statement on the Architecture of Skill and Knowledge."
