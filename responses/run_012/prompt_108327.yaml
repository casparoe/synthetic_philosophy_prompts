answer: |-
  **JOINT STATEMENT ON THE ARCHITECTURE OF SKILL AND KNOWLEDGE**

  **Preamble**
  We, the undersigned representatives of the Intellectualist and Anti-Intellectualist (Rylean/Phenomenological) camps, acknowledge that the debate regarding the relationship between *knowing-how* and *knowing-that* has reached a state of recursive stalemate. We agree that further iteration of standard arguments yields diminishing returns. This document does not resolve the debate. Instead, it maps the exact coordinates of our agreement, isolates the remaining substantive disagreements, and identifies the specific empirical or conceptual tests required to move forward. Our goal is to distinguish substantive metaphysical disagreement from verbal dispute.

  ### I. Points of Agreement
  *We agree on the following phenomenological and psychological facts. Neither side denies these data points; we disagree only on their interpretation.*

  1.  **The Competence/Articulation Gap:** A subject can possess a high degree of skill (e.g., riding a bicycle, pitching a baseball) without being able to verbally articulate the rules governing that skill. Conversely, a subject can articulate the rules of a domain (e.g., aerodynamics) without possessing the skill to perform within it.
  2.  **The Learning Trajectory:** Skill acquisition generally follows a trajectory from effortful, rule-following, and attention-heavy processing (novice) to fluid, rapid, and attention-light processing (expert).
  3.  **The Existence of Failure Conditions:** Both knowing-how and knowing-that are normative. One can fail to ride a bike (fall) just as one can fail to know a fact (assert falsehoods). Both involve correctness conditions.
  4.  **The Role of Propositional Input in Novices:** In the early stages of learning, verbal instructions (propositions) play a causal role in shaping behavior. Telling a novice "keep your elbow in" changes their movement.
  5.  **Psychological Pluralism:** We agree that the human mind contains distinct systems for declarative memory (facts) and procedural memory (skills). The debate is not about whether these systems exist, but whether the output of the procedural system constitutes a form of *knowledge-that*.

  ### II. Table of Disagreements
  *The following rows isolate the remaining points of contention. We have attempted to phrase each position such that the proponent of that view would accept it as fair. Where neutral phrasing proved impossible, it is noted in the "Integrity Flag."*

  | Domain | Intellectualist Position | Anti-Intellectualist (Rylean) Position | Integrity Flag |
  | :--- | :--- | :--- | :--- |
  | **The Metaphysics of Skill** | Knowing-how is a species of knowing-that. To know how to $\phi$ is to stand in a knowledge-relation to a proposition (that $w$ is a way to $\phi$) under a practical mode of presentation. | Knowing-how is a distinct mental kind, irreducible to knowledge-that. It is a complex disposition or ability to succeed, not a relation to a truth. | **None.** Both accept this as the core metaphysical split. |
  | **Guidance During Execution** | Propositional content guides action even in experts, though it may not be conscious. The "practical mode" allows the proposition to drive motor control without deliberation. | In expert flow, propositional guidance drops out. Action is guided by motor intentionality or bodily awareness, not by content-bearing states. | **High Risk.** The Intellectualist may claim the proposition is "implicit," which the Anti-Intellectualist views as a redefinition of "guidance." |
  | **The "Practical Mode"** | The "practical mode of presentation" is a genuine cognitive format that translates abstract truth into motor command without losing propositional structure. | The "practical mode" is a promissory note. It is a label used to retain the word "proposition" for states that functionally operate like dispositions. | **Slanted.** The Anti-Intellectualist phrasing here ("promissory note") is inherently skeptical. An Intellectualist would object to this row as written. |
  | **Error Explanation** | When an expert fails, they have misapplied the proposition or accessed the wrong way $w$. The error is intellectual (misrepresentation). | When an expert fails, the body has slipped its disposition. The error is mechanical or situational, not necessarily a failure of representation. | **None.** |

  ### III. The Cruxes: Predictive Disagreements
  *We identify three specific scenarios where our theories generate different expectations. We record our predictions in advance.*

  **Crux 1: The Coaching Paradox**
  *Scenario:* A coach observes a climber hanging off their fingers. The coach says, "Push through your toes." The climber repeats the sentence back perfectly ("I know, push through my toes") but continues to hang off their fingers until they physically fatigue and adjust their posture through trial and error.
  *   **The Question:** If the coach has transmitted a proposition, and the student possesses that proposition, why does the action not change?
  *   **Intellectualist Prediction:** The student possesses the proposition *under a theoretical mode*, not a *practical mode*. They know *that* pushing through toes is the way, but they do not yet know *that way* under the mode required for execution. The knowledge is present but the "mode" is missing.
  *   **Anti-Intellectualist Prediction:** The proposition is inert. The coach is attempting to transmit a disposition using a tool (language) designed for facts. The student acquires the skill only when the body integrates the constraint, at which point they possess *know-how*, which is distinct from the recited sentence.
  *   **Resolution Condition:** If the "practical mode" cannot be distinguished from "having a disposition" via independent psychological testing, the Intellectualist explanation risks becoming unfalsifiable.

  **Crux 2: The Fade-Out of Rules (Motor Learning Stages)**
  *Scenario:* Standard motor learning theory posits three stages: Cognitive (verbal rules), Associative (smoothing), Automatic (non-verbal flow). In the final stage, verbal interference often degrades performance (e.g., asking a golfer to describe their swing while putting).
  *   **The Question:** Does the fade-out of verbal access indicate the loss of knowledge-that, or merely the shelving of it?
  *   **Intellectualist Prediction:** The knowledge-that remains as a *standing state*. It is not consulted online, but it remains the normative standard. If asked later, the expert can reconstruct the proposition. The knowledge is not gone; it is simply not *occurrent*.
  *   **Anti-Intellectualist Prediction:** The knowledge-that has been replaced by a different architecture. The fact that verbal interference degrades performance proves that the online control system is *not* propositional. To claim the proposition is "still there" but causally inert is to redefine "knowledge" as something that costs nothing to have.
  *   **Resolution Condition:** We need a test that distinguishes between a *standing proposition* that is causally inert and a *disposition* that mimics one. If the proposition plays no causal role in the moment of action, the Anti-Intellectualist argues it is not doing the work of knowledge.

  **Crux 3: The Dissociation Test**
  *Scenario:* Neurological cases (e.g., ideomotor apraxia) where a patient can describe an action perfectly but cannot perform it, or can perform it but cannot describe it.
  *   **The Question:** Does this dissociation prove two distinct types of knowledge, or two access points to the same knowledge?
  *   **Intellectualist Prediction:** These are access failures to the same underlying propositional store. The apraxic patient knows the proposition but cannot access the practical mode to execute it.
  *   **Anti-Intellectualist Prediction:** This is definitive proof of distinct systems. One system handles representation (that), the other handles ability (how). The inability to perform despite perfect description proves that knowing-that is insufficient for knowing-how.
  *   **Resolution Condition:** If the "practical mode" is a distinct neural format that can be severed from the "theoretical mode," Intellectualism concedes a functional distinction that looks suspiciously like Ryleanism.

  ### IV. Analysis of the Verbal Dispute
  *We suspect a portion of this conflict is verbal. To dissolve it, we must agree on the following definitions.*

  1.  **The Definition of "Proposition":**
      *   *The Problem:* The Intellectualist camp has expanded "proposition" to include non-linguistic, motoric formats (via the "practical mode"). The Anti-Intellectualist camp reserves "proposition" for linguistic or sentence-like structures.
      *   *The Fix:* If "proposition" means *any content-bearing state that has correctness conditions*, Intellectualism is trivially true (skills have correctness conditions). If "proposition" means *sentence-like structure subject to logical inference*, Intellectualism is likely false regarding expert motor control.
      *   *Requirement:* The Intellectualist must specify whether the "practical mode" supports logical inference (e.g., can you combine two motor skills via modus ponens?). If not, the Anti-Intellectualist argues it is not a proposition, but a *program*.

  2.  **Standing vs. Occurrent Knowledge:**
      *   *The Problem:* Intellectualists often retreat to "standing knowledge" when experts aren't thinking about rules.
      *   *The Fix:* We must agree that for knowledge to be explanatory of an *action*, it must be causally relevant. If the proposition is standing but plays no causal role in the milliseconds of expert action, calling it "knowledge guiding the action" is misleading. It is better described as "knowledge that trained the disposition."

  3.  **Implicit vs. Explicit:**
      *   *The Problem:* "Implicit knowledge" is used by Intellectualists to mean "propositional content not currently in consciousness." Anti-Intellectualists use it to mean "non-propositional capacity."
      *   *The Fix:* Distinguish between *tacit propositions* (content you could say if pressed) and *embodied capacities* (content you cannot say even if pressed). If the expert cannot say it even under ideal reflection, the Intellectualist claim that it is "knowledge-that" is strained.

  ### V. Confidence Assessment & Uncertainty
  *As the authors of this joint statement, we offer the following meta-assessment of the claims above.*

  **High Confidence:**
  We are highly confident that the **Coaching Paradox (Crux 1)** represents the strongest challenge to Intellectualism. The fact that possessing the verbal rule (the proposition) does not generate the skill suggests that the "knowledge" in skill is not the rule itself, but the bodily integration of that rule. The Intellectualist reliance on the "practical mode" to explain this gap appears to be a buffer against counter-evidence.

  We are also highly confident that the **Motor Learning Stages** favor the Anti-Intellectualist view regarding *online control*. While Intellectualists can argue the knowledge remains as a standing state, the fact that re-introducing propositional focus degrades expert performance suggests the expert system is not merely a "fast version" of the propositional system, but a different architecture entirely.

  **Low Confidence (The Shaky Point):**
  We are least sure about the **Metaphysics of the "Practical Mode."** It is possible that the Intellectualist is pointing at a real cognitive phenomenon—a non-linguistic format that nonetheless bears truth-apt content—that current cognitive science simply lacks the vocabulary to describe. If such a format exists (a "motor proposition"), the Anti-Intellectualist objection collapses. However, until a mechanism is proposed for how a truth-apt state directly drives motor neurons without passing through a "desire" or "intention" state, this remains the weakest link in the Intellectualist chain.

  **Recommendation for Reporting:**
  The story is not that one side is wrong. The story is that "Knowledge" is doing too much work. The Intellectualist wants to preserve the normativity of knowledge (skills aren't just reflexes). The Anti-Intellectualist wants to preserve the phenomenology of skill (it doesn't feel like thinking). The resolution likely requires a new term that is neither "knowing-that" nor "mere habit," but a third category: **Embodied Normativity.**

  ***

  **Confidence Rating:**
  *   **Diagnosis of Stalemate:** 95%
  *   **Fairness of Disagreement Table:** 85% (The "Practical Mode" row remains contentious by nature).
  *   **Prediction on Coaching Paradox:** 90% (This is the hardest hurdle for Intellectualism).
  *   **Prediction on Metaphysical Resolution:** 40% (Philosophers rarely abandon core definitions easily).

  **Single Point of Greatest Uncertainty:**
  Whether the "Practical Mode of Presentation" can be naturalized. If cognitive science discovers a neural code that functions logically but operates motorically, the Intellectualist wins. If neural codes for motor control prove to be purely analog/vector-based without truth conditions, the Anti-Intellectualist wins. Currently, the evidence leans toward the latter, but the former is not impossible.
