      *   **Section 4: The Verbal Dispute Analysis:**
          *   Where is the fight just about words?
          *   The definition of "Proposition." If "proposition" includes non-linguistic, motoric formats, Intellectualism becomes trivial.
          *   The definition of "Knowledge." If "knowledge" includes dispositions, the distinction collapses.
          *   *Fix:* Distinguish between *informational content* (which might be propositional) and *control architecture* (which might not be).

      *   **Section 5: Confidence & Uncertainty:**
