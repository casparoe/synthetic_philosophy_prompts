      *   **Requirements:** Concrete recommendation on label wording, concrete recommendation on described tour, straight account of the strongest opposing case. No literature review/citations. Tone needs to be readable aloud, persuasive, practical, and decisive ("needs to land somewhere").
      *   **Deadline:** Opening on the 12th (implies urgency).

  2.  **Deconstruct the Problems & Formulate Solutions:**

      *   **Problem 1: The Label Verdict.**
          *   *Option A (Curator):* "This is one of the great paintings of the last century." -> Too authoritarian. Doesn't teach looking.
          *   *Option B (Invitational):* "Many visitors find..." -> Weak, passive, dilutes the museum's voice.
          *   *Option C (The Middle Path):* State the claim *and* point to the evidence. Don't just say it's great; say *why* the museum thinks it's great.
          *   *The Artist's "Failure" Comment:* Ignoring it feels dishonest. Including it as a "gotcha" undermines the acquisition. It should be context, not the final word.
          *   *Recommendation:* Draft a label that asserts value but grounds it in visual evidence. Acknowledge the artist's doubt without letting it veto the museum's stance.

      *   **Problem 2: The Described Tour.**
          *   *Option A (Pure Description):* "Red field, white line." -> Technically accessible, but misses the *experience* of the art (which includes social/cultural valuation).
          *   *Option B (Evaluative Guidance):* "The thing people look at..." -> Risks telling blind visitors what to feel.
          *   *Option C (Contextualized Valuation):* Acknowledge *that* it is valued and *where* that value sits visually, without dictating the emotional response. Distinguish between physical description and art-historical significance.
          *   *Recommendation:* Include the valuation but frame it as "This is why this painting is held in high regard" rather than "You should think this is beautiful." Partner with the advocacy group to refine the language.

      *   **Problem 3: The Opposing View (The "Warehouse" Argument).**
          *   Need to articulate why museums *must* take a stand. If we don't judge, we are just storage. Expertise matters. Visitors want guidance.

  3.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
