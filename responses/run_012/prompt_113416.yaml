answer: |-
  You are reading this very sharply. The tension you feel comes from seeing Aquinas trying to balance a **definitional claim** (what sedition *is*) with a **prudential calculation** (when resistance is *wise*).

  Here is a way to square both circles by staying strictly within the logic of this reply.

  ### 1. The "Unless" Clause: Not an Exception, but a Test
  Your first worry is that if sedition is defined as "attacking the common good," then a revolt that serves the common good isn't sedition by definition. So why the "unless" clause? It looks like a consequentialist loophole.

  However, for Aquinas, the "unless" clause is not an exception to the definition; it is the **method for verifying the definition.**

  Aquinas defines sedition as a special sin against the unity of the multitude (the common good). When you overthrow a tyrant, you are performing an act of "disturbance." Whether that disturbance counts as *sedition* (sinful discord) or *liberation* (just restoration) depends entirely on whether it actually achieves the common good.

  *   **The Definition:** Sedition = Discord detrimental to the common good.
  *   **The Scenario:** Overthrowing a tyrant.
  *   **The Test:** Does this specific overthrow help or hurt the common good?

  If the disturbance causes "greater harm... than from the tyrant's government," then the act has **failed to serve the common good.** If it fails to serve the common good, it falls back under the definition of sedition.

  So, the clause isn't a consequentialist addition to a deontological rule. It is Aquinas acknowledging that "disturbing a government" is physically the same action whether it is just or unjust. The *moral species* of the act (sedition vs. liberation) is determined by the outcome relative to the common good. The "unless" protects the definition: if the harm is greater, you aren't actually serving the common good, so you *are* committing sedition.

  ### 2. Intent vs. Outcome: Two Different Judgments
  Your second worry is about the shift from "directed to the private good" (intent/aim) to "subjects suffer greater harm" (outcome/consequence). You ask how he can hold both at once.

  He can hold them because he is applying the **same standard (the Common Good)** to **two different agents.**

  1.  **Judging the Regime (The Tyrant):**
      *   *Standard:* What is the *end* (telos) of this government?
      *   *Text:* "Directed... to the private good of the ruler."
      *   *Logic:* A regime is defined by its aim. If the aim is private, the regime is structurally unjust. This is a judgment on the **status of the authority.**
  2.  **Judging the Resistance (The Subjects):**
      *   *Standard:* What is the *effect* of this action?
      *   *Text:* "Subjects suffer greater harm from the consequent disturbance."
      *   *Logic:* An act of resistance is defined by its impact on the multitude. If the impact is net negative, the act is unjust. This is a judgment on the **morality of the action.**

  There is no tension here because Aquinas is not saying "Intent doesn't matter, only outcomes" or vice versa. He is saying:
  *   The Tyrant is guilty because of his **Intent** (he aims at private good).
  *   The Resisters are guilty (of sedition) if their **Outcome** is worse than the status quo.

  ### Synthesis: The Common Good as the Single Metric
  To put it in a single sentence: **The tyrant violates the common good by *design*; the resisters violate the common good by *excess*.**

  Aquinas is trying to prevent two errors:
  1.  **Quietism:** The idea that all authority must be obeyed even if tyrannical. (Solved by the first sentence: Tyranny is not just, so disturbing it is not inherently sedition.)
  2.  **Anarchism:** The idea that any rebellion against a tyrant is automatically holy. (Solved by the "unless" clause: If the rebellion destroys the city to save it, it is sedition.)

  The text is consistent because the "Common Good" is the ruler for both measurements. The tyrant fails the measurement because he ignores the common good in his **aims**. The rebels fail the measurement (and become seditious) if they ignore the common good in their **execution**.

  So, you aren't reading him too analytically; you are spotting the two distinct moral calculations he is running simultaneously. He isn't contradicting himself; he is ensuring that the "Common Good" isn't sacrificed by the ruler *or* by those who oppose him.
