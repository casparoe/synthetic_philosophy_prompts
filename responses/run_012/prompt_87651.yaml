      *   Tension? Only if Rule 1 is interpreted strictly as "Unweighted QALYs." If Rule 1 is "Cost per *Weighted* Unit," they are integrated.

  8.  **Final Polish:** Ensure the tone is appropriate for a grad student (analytical, precise, avoiding oversimplification). Ensure all parts of the prompt are answered. (Self-Correction: Make sure to explicitly address "whose health counts" and "how much".)

