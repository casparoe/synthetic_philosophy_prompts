      *   *Answer:* It *could* be defended by effects. If it is defended by effects, it is not committed to intrinsic egalitarianism. However, in political reality, it is often *rhetorically* defended by intrinsic egalitarianism. I need to make this distinction clear. The *practice* allows for the instrumental defense.
