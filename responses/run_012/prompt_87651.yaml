      *   *The Ban (Rule 3):* This is the crux. Address the "Leveling Down" objection. Distinguish between *Intrinsic Egalitarianism* (equality is good) and *Instrumental Defense* (equality preserves the system). The prompt asks if it *could* be defended by effects. Yes. This saves it from the "leveling down" objection *if* the empirical claim holds (that private markets harm the public system).
      *   *Severity vs. Ban:* Severity is about *need*. The Ban is about *process/market*. They are different. Severity says "sick people matter more." Ban says "money shouldn't buy health."
      *   *Counterfactuals:*
          *   *Friend's View (Max Health):* Drop Rule 2. Relax Rule 3.
