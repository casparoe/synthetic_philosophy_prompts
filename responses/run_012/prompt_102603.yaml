  **JOURNAL OF CAUSAL RIGOR — EDITORIAL STYLE MANUAL (REV. 14.2)**
  **SECTION 9: TELEOLOGICAL CONSTRUCTS AND INTENTIONAL STANCE**

  **9.1 General Prohibition.**
  Authors are prohibited from attributing purpose, goal-directedness, or intentionality to biological systems unless such attributes are explicitly grounded in a recognized Reasoner or filed under the Free-Floating Rationale Exemption (FFRE). Default mechanistic descriptions are preferred. Teleology is treated as a contingent property, not an intrinsic one.

  **9.2 The Reasoner Clause.**
  Teleological phrasing is permissible if a specific agent capable of representing the goal is identified as the causal source. The agent must possess the capacity to hold the outcome as a representation prior to the action.
  *   *Acceptable:* "The engineer designed the valve to regulate pressure."
  *   *Unacceptable:* "The valve regulates pressure to satisfy the system's needs."

  **9.3 Free-Floating Rationale Exemption (FFRE).**
  Authors may assert teleological function (e.g., "the heart pumps to circulate blood") without naming a Reasoner, provided the rationale exists independently of representation. This exemption acknowledges that reasons can exist in the world without being represented by a mind. To qualify, authors must submit Form T-44 alongside the manuscript.
  *   *Field 3a:* Demonstrate that the trait exists *because* of the stated outcome (etiological function), not merely that it produces the outcome.
  *   *Field 3b:* Confirm no mental representation of the outcome exists within the system itself.
  *   *Field 3c:* Certify the explanation is not a retrospective "just-so" narrative lacking comparative phylogenetic data.
  *   *Field 3d:* Specify whether the rationale is free-floating (historical) or derived (systemic).

  **9.4 Status of Natural Selection.**
  For the purposes of this journal, Natural Selection does not constitute a Reasoner. It is a filter, not an agent. It cannot "intend" outcomes, though it preserves traits that satisfy survival rationales. Authors must not conflate the filtering process with a decision-making mind.
  *   *Acceptable:* "Selection favored alleles that increased conductivity."
  *   *Unacceptable:* "Natural selection chose the faster organism to escape predators."
  *   *Unacceptable:* "Evolution sought a solution to the problem of oxygenation."

  **9.5 Anthropomorphic Verbs.**
  Verbs implying conscious desire, cognitive effort, or future-looking representation are strictly prohibited for non-sentient systems. The distinction lies in whether the system represents the goal or merely embodies the rationale.
  *   *Acceptable:* "The enzyme binds to the substrate to facilitate catalysis." (Filed under FFRE)
  *   *Unacceptable:* "The enzyme wants to bind to the substrate."
  *   *Unacceptable:* "The cell tries to maintain homeostasis."
  *   *Unacceptable:* "The DNA strives to replicate itself."

  **9.6 Function vs. Purpose vs. Goal.**
  Authors must distinguish causal roles from selected effects. Confusion between these categories is the primary cause of editorial return.
  *   *Function:* The current causal contribution (e.g., "the heart pumps blood"). No FFRE required.
  *   *Purpose:* The selected effect justified by history (e.g., "the heart pumps blood to sustain oxygenation"). Requires FFRE.
  *   *Goal:* Implies a represented future state. Prohibited unless a mind is present.

  **9.7 Compliance and Burden of Proof.**
  Manuscripts containing unfiled teleological claims will be returned for causal rewriting. Authors claiming a process "had reasons" without a mind must ensure Form T-44 verifies that the reasons were free-floating, not embedded. The Editorial Board reserves the right to reject FFRE claims if the rationale appears to be a projection of the author's own intentionality rather than a product of historical filtering. Authors are reminded that a rationale must be *there* without being *for* anyone. Failure to distinguish between a system acting *for* a purpose and a system acting *as if* for a purpose will result in immediate desk rejection.
