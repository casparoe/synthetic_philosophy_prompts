          *   Constraint Check: "Don't let her off with the standard move that the verification principle is dead."

  2.  **Deconstruct the Guest's Position:**
      *   **Core:** Verificationism (Logical Positivism). Meaning = method of verification.
      *   **Application:** "Life after death" claims lack verification conditions -> Meaningless (not false).
      *   **Twist:** NDEs are experiences of the *dying*, not the *dead*. Clinical death isn't final death. Therefore, NDEs don't verify survival of death.
      *   **Vulnerabilities:**
          *   Verification principle itself is notoriously hard to verify (self-refuting).
          *   Distinction between "dying" and "dead" might be semantic sleight of hand if consciousness persists through the transition.
          *   If survival is meaningless, what is the "subject" supposed to be in the hypothetical?
          *   Is the view insulated from refutation by defining away counter-evidence?

  3.  **Drafting Questions by Section:**

      *   **Warm-up that isn't a warm-up (1 question):**
