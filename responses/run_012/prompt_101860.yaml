          *   *Draft Q2:* You say survival claims are meaningless. But if I imagine waking up tomorrow in a new body, isn't that a coherent thought experiment?
          *   *Likely Answer:* Coherent imagination isn't logical possibility.
          *   *Follow-up:* So what *would* count as you surviving, if not remembering being you?

      *   **The insulation worry (2 questions):**
          *   Need to hit the "falsifiable or insulated" requirement.
          *   *Q1:* Immunity to evidence.
          *   *Q2:* Practical consequence.
          *   *Draft Q1:* If every piece of evidence gets redefined as "not really death," isn't your view immune to being wrong?
