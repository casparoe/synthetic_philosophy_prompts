      *   **The subject who survives (2 questions):**
          *   Need to hit the "subject if not a person with memories" requirement.
          *   *Q1:* Identity conditions.
          *   *Q2:* Continuity.
          *   *Draft Q1:* If someone survives, what survives? If it's not a body, is it a soul? If it's a soul, how is it still *you*?
          *   *Likely Answer:* That's the point; there's no criteria for identity, so the question collapses.
