  1.  **Analyze the Request:**
      *   **Task:** Create 9-10 interview questions for a podcast interview with a philosopher.
      *   **Guest's View:** Hard verificationist on life after death (Ayer-style). Claims about survival are meaningless, not false. New twist: Near-death experiences (NDEs) don't count as evidence because they happen *while dying*, not *after being dead*.
      *   **Constraints:**
          *   9 or 10 questions total.
