prompt: |-
  I'm prepping for a podcast interview with a philosopher who defends teh hard verificationist line on life after death. Her view is roughly Ayer's: claims that someone survives death aren't false, they're meaningless, because nothing could count as verifying them. Her new twist, which I want to press, is that near-death experiences don't even count as apparent counterevidence, since they're had by people who are still alive and are therefore reports about dying, not about being dead; they recieve them while dying, not after death. I want 9 or 10 questions that go beyond letting her restate Ayer 101. Please give me the questions grouped under these headings, in this order, with rough lengths: Warm-up that isn't a warm-up (1 question); The verificationist core (2 questions); The near-death experience problem (2 questions); The subject who survives (2 questions); The insulation worry (2 questions); Closing (1 question). For each question, give me the question, then a one-line sketch of the answer she's most likely to give, then a follow-up keyed to that answer. No bibliography, no reading list, no citations—she can't look anything up and neither can you. Keep it conversational. And dont let her off with the standard move that the verification principle is dead; I want at least one question each on the difference between meaningless and merely unverifiable, on whether the dying/dead distinction really makes near-death reports irrelevant, on what the surviving subject is supposed to be if not a person with memories, and on whether her view is falsifiable or just insulated by redefining meaningfulness.
