answer: |-
  ### Part 1: Evaluation of the "Explanatory Debt" Metaphor

  Your metaphor of **Explanatory Debt** is intuitively powerful and operationally useful for a funding panel. It correctly identifies that reductionism is not a free gift; it requires a transactional link between levels. However, to make it robust enough for a decision procedure, we must acknowledge where it breaks down and what it obscures.

  **Where it breaks down:**
  1.  **Eliminativism vs. Reductionism:** Debt implies the higher-level phenomenon (e.g., "belief") still exists to be "repaid." Some reductive projects argue the higher-level phenomenon is an illusion (eliminativism). In that case, there is no debt to repay, only a mistake to correct. Your metaphor assumes the higher level is real.
  2.  **Multiple Realizability:** A "currency exchange" implies a fixed rate. But in biology and psychology, one higher-level state (e.g., "depression") can be realized by many different lower-level states (different neurotransmitter profiles, circuit dysfunctions). A strict debt model suggests a 1:1 mapping that doesn't exist.
  3.  **Normativity:** You note greedy reductionism pays in a currency the lower level "does not issue." This is crucial for morality or aesthetics. Neurons issue *causes*; they do not issue *reasons*. The metaphor risks obscuring the is-ought gap by treating it as merely a currency conversion issue rather than a category error.

  **What it obscures:**
  It focuses on the *transaction* but can obscure the *architecture*. A crane doesn't just pay debt; it builds a structure that supports weight. A project might "pay the debt" (show correlation) but fail to show how the mechanism *sustains* the phenomenon under variation.

  **Integration:** We will retain your metaphor but refine the "repayment" condition to require a **Bridging Principle**. The panel must see not just that the lower level correlates with the higher, but *how* the lower level constitutes the higher without skipping over the functional organization.

  ***

  ### Part 2: The Crane-Skyhook Audit (Procedure)

  **Time:** 20 Minutes
  **Inputs:** One-page summary, 5-minute applicant interview.
  **Panel:** 3-5 intelligent non-specialists.

  **Instructions:** Read the summary (5 mins). Conduct the interview (5 mins). Deliberate using the five questions below (10 mins). Do not proceed to the next question if the previous one triggers a "Red Light."

  #### Question 1: The Phenomenon Check
  *Ask:* "Is the higher-level phenomenon (e.g., 'depression', 'moral judgement') defined in a way that is recognizable to those who live it, or has it been redefined to fit the tool?"
  *   **Green Light:** The definition captures the core features of the phenomenon as experienced or observed in the wild.
  *   **Yellow Light:** The definition is narrow but acknowledged as a proxy (e.g., "We are studying *risk-taking* as a proxy for *moral courage*"). *Action:* Fund only if the proposal explicitly limits its claims to the proxy.
  *   **Red Light:** The phenomenon is redefined so drastically that the original problem disappears (e.g., "Religious belief is just auditory hallucination"). *Action:* **Immediate No.** This is eliminativism disguised as explanation.

  #### Question 2: The Mechanism Specificity
  *Ask:* "Is the lower-level mechanism (gene, circuit, hormone) specific enough to do the work, or is it a 'hub' that does everything?"
  *   **Green Light:** The mechanism has a known, constrained function (e.g., "dopamine reward prediction error").
  *   **Yellow Light:** The mechanism is broad but the project isolates a specific pathway.
  *   **Red Light:** The mechanism is a "magic bullet" known to be involved in almost everything (e.g., "overall neural efficiency" or "inflammation" without a specific pathway). *Action:* **Immediate No.** This is neuro-babble.

  #### Question 3: The Bridging Principle (The Crane Test)
  *Ask:* "How does the mechanism *become* the phenomenon? Show us the steps between the synapse/gene and the belief/feeling."
  *   **Green Light:** The applicant describes a causal chain or computational model that links the lower-level activity to the higher-level pattern (e.g., "This circuit noise increases uncertainty, which the brain interprets as...").
  *   **Yellow Light:** The chain is plausible but unproven. *Action:* Fund as "Exploratory" with milestones requiring the bridge to be built.
  *   **Red Light:** The applicant asserts the link as self-evident or skips from biology directly to complex behavior (e.g., "Oxytocin increases trust, therefore it explains moral judgement"). *Action:* **Immediate No.** This is a Skyhook.

  #### Question 4: The Currency Check (Anti-Greed)
  *Ask:* "Does the lower-level explanation address the *content* of the phenomenon, or only the *capacity*?"
  *   **Green Light:** The project explains why the phenomenon has the specific structure it does (e.g., why *this* doctrine and not *that* one).
  *   **Yellow Light:** The project explains the capacity to have the phenomenon, but not the specific content. *Action:* Fund only if the description is changed to "The Biology of [Capacity]" rather than "The Mechanism of [Phenomenon]."
  *   **Red Light:** The project claims to explain normative content (truth, beauty, rightness) using only descriptive tools (hormones, firing rates). *Action:* **Refer to Philosopher/Board.** This is a category error.

  #### Question 5: The Exchange Rate (Explanatory Gain)
  *Ask:* "What do we know now that we didn't know at the higher level? Does the reduction allow new interventions or predictions?"
  *   **Green Light:** The lower-level view allows manipulation or prediction impossible at the higher level (e.g., a drug target, a specific neural intervention).
  *   **Yellow Light:** It offers a satisfying unification but no new leverage. *Action:* Fund only if the theoretical unification is exceptionally strong.
  *   **Red Light:** The lower-level description is less informative than the higher-level one (e.g., "He did it because of neuron X" tells us less than "He did it because he was angry"). *Action:* **No.** This is bad reductionism.

  ***

  ### Part 3: Limitations and Misfires

  Be honest with your board: This procedure is a heuristic, not a proof.
  1.  **Judgement Call:** Question 3 (The Bridge) is where bias enters. A reductionist will see a bridge where a holist sees a gap. The panel must agree on what counts as a "step."
  2.  **Emergence:** The procedure may misfire on emergent phenomena where the higher level has causal powers not easily traced to the lower level (downward causation).
  3.  **Early Stage Science:** Truly novel mechanisms often lack a "Bridging Principle" initially. This procedure favors mature science over high-risk discovery. You may need a separate "High Risk" stream that waives Question 3.
  4.  **Normative Blindness:** The procedure flags normative errors (Question 4) but cannot solve them. It kicks those to a philosopher.

  ***

  ### Part 4: Running the Audit on Three Proposals

  #### Proposal 1: Religious Belief (Agency Detection + Gene Variant)
  *   **Q1 (Phenomenon):** **Yellow.** "Religious belief" is broad; they are measuring "susceptibility to agency detection."
  *   **Q2 (Mechanism):** **Green.** fMRI and twin data are specific tools.
  *   **Q3 (Bridge):** **Red.** They show a correlation between the gene/brain area and belief *reports*, but offer no account of how agency detection generates *doctrinal content* (e.g., why belief in heaven vs. reincarnation). The bridge stops at "feeling watched."
  *   **Q4 (Currency):** **Red.** They are explaining the *capacity* for belief, but claiming to explain *belief* (which implies content).
  *   **Verdict:** **No.**
  *   **Reasoning:** This is a Skyhook. It hangs the complex structure of religion on a simple biological hook without showing how the hook supports the weight of doctrine. It incurs Explanatory Debt (claiming to explain belief) but pays in the wrong currency (susceptibility).
  *   **Recommendation:** Reject, or invite resubmission as "The Biological Substrate of Hyper-Active Agency Detection," explicitly disclaiming an explanation of religious content.

  #### Proposal 2: Depression (Serotonin Deficiency + Biomarker)
  *   **Q1 (Phenomenon):** **Green.** Depression is well-defined clinically.
  *   **Q2 (Mechanism):** **Yellow.** Serotonin is a "hub" chemical, but the biomarker adds specificity.
  *   **Q3 (Bridge):** **Red.** The "chemical imbalance" theory is the quintessential Skyhook. The proposal shows low serotonin correlates with low mood, but does not explain *how* the chemical deficit produces the specific psychological phenomenology (guilt, rumination, anhedonia).
  *   **Q4 (Currency):** **Red.** It attempts to explain a psychological state entirely via chemistry, ignoring the cognitive/Environmental feedback loops.
  *   **Verdict:** **No.**
  *   **Reasoning:** This is Greedy Reductionism. It assumes the currency of chemistry can purchase the goods of psychology without an exchange rate. It treats the biomarker as the cause rather than a component of a larger system.
  *   **Recommendation:** Reject. The "chemical imbalance" model is scientifically contested; funding this reinforces a simplified narrative that hinders treatment.

  #### Proposal 3: Moral Judgement (Oxytocin + Game Theory)
  *   **Q1 (Phenomenon):** **Yellow.** "Moral judgement" is conflated with "cooperative behavior in a game."
  *   **Q2 (Mechanism):** **Green.** Oxytocin and game-theoretic models are precise.
  *   **Q3 (Bridge):** **Yellow.** The experiments are elegant, showing oxytocin increases trust/cooperation.
  *   **Q4 (Currency):** **Red.** **Stop.** This is the critical failure. Oxytocin explains *tribal bonding* or *trust*. It does not explain *moral judgement*. Moral judgement involves claims about *rightness* that hold even against tribal interest (e.g., protecting an out-group member).
  *   **Q5 (Gain):** **Green.** It predicts behavior in games well.
  *   **Verdict:** **Fund with Major Caveats (Changed Description).**
  *   **Reasoning:** Here is what you do not want to hear: **Your project does not explain moral judgement.** It explains the *neurochemistry of parochial altruism*. By labeling it "moral judgement," you are committing the Naturalistic Fallacy. You are explaining why we *feel* moral, not what makes a judgement moral. The Explanatory Debt is unpaid because you are trying to buy "Normativity" with "Hormones."
  *   **Recommendation:** Fund only if the title and abstract are changed to "The Neurobiology of In-Group Trust and Cooperative Intuition." You must explicitly state you are *not* explaining the validity of moral reasoning. If you insist on explaining "judgement," this is a Skyhook that hides the normative gap.

  ***

  ### Part 5: Final Assessment

  The procedure works best when it forces the applicant to distinguish between the *substrate* of a capacity and the *content* of a thought. In all three cases, the "Red Lights" appeared when the proposal claimed to explain the *meaning* or *validity* of a high-level phenomenon using only the *causes* of the low-level substrate.

  For you personally, Proposal 3 is the hardest because the math is elegant. But elegance is not a bridge. The procedure forces you to admit that a beautiful model of oxytocin is still just a model of oxytocin, not a model of morality.

  \answer{The Crane-Skyhook Audit, The Bridging Principle}
