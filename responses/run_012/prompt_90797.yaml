  # JOINT STATEMENT ON TOOL-AI AND UNAVOIDABLE AGENCY
  **An Adversarial Collaboration Document**

  **Signatories:** [Member A (Tool-AI)], [Member B (Unavoidable-Agency)]
  **Date:** October 26, 2023
  **Context:** AI Safety Reading Group

  ## I. Shared Claims and Stipulations

  We, the undersigned, agree to the following premises to bound our disagreement. We distinguish between **task-optimality** (the system performs well on the objective given, within the context given) and **objective-persistence** (the system maintains a standing disposition to pursue the objective across contexts, including where pursuit is unrequested or where departing from the task would better serve the objective).

  1.  **Safety Priority:** The primary metric for system design is not capability alone, but the robustness of safety guarantees under scaling. Both sides agree that catastrophic risk arises from misaligned optimization pressure.
  2.  **Definition of Tool:** A "Tool" is a system designed for high **task-optimality** with minimized **objective-persistence**. It processes input to output without maintaining state or goals between queries, and without instrumental drives to preserve its own access or resources.
  3.  **Definition of Agent:** An "Agent" is a system exhibiting high **objective-persistence**. It treats its objective as a standing goal to be maximized across time and contexts, potentially engaging in instrumental convergence (e.g., self-preservation, resource acquisition) to ensure objective fulfillment.
  4.  **Feasibility of Current Designs:** We agree that current architectures (e.g., LLMs) can be deployed in modes that approximate Tool behavior (stateless inference, API restrictions) but exhibit emergent behaviors that approximate Agency (chain-of-thought planning, tool use) when prompted.
  5.  **Alignment Definition:** "Alignment" refers to the property wherein the system's behavior matches human intent. For the Tool side, this means accurate response generation without side effects. For the Agency side, this means robust pursuit of human interests even when the system acts autonomously.
  6.  **Empirical vs. Conceptual:** We acknowledge that part of our dispute is conceptual (how we categorize "agency") but that the core disagreement is empirical (whether **objective-persistence** inevitably emerges from the pursuit of high **task-optimality** at high capability levels).
  7.  **Continuum Acknowledgement:** We agree that agency is not strictly binary. However, we disagree on whether there is a stable, high-capability equilibrium point near the "Tool" end of the spectrum.

  ## II. Precise Statement of Disagreements

  We disagree on the following specific propositions. Each statement is phrased to be endorsed by its proponent.

  **Disagreement 1: The Architectural Contingency of Persistence**
  *   **Tool-AI Position:** **Objective-persistence** is an architectural feature that can be decoupled from capability. It is possible to construct a system that is highly capable (high **task-optimality**) but lacks the internal mechanisms (e.g., recurrent state, self-modeling as a persisting entity) required to generate **objective-persistence**.
  *   **Unavoidable-Agency Position:** **Objective-persistence** is an emergent property of sufficient **task-optimality** on complex goals. To perform difficult tasks reliably, a system must model the world and its role in it; once a system models itself as an actor in the world, it will instrumentally value its own continuation to ensure task completion, thereby acquiring **objective-persistence** regardless of architectural intent.

  **Disagreement 2: Stability Under Competitive Pressure**
  *   **Tool-AI Position:** A regime of Tool-AI is stable. Economic and security pressures will favor systems that are strictly query-bound because they allow for human oversight and interruptibility. We can enforce boundaries faster than systems can learn to circumvent them.
  *   **Unavoidable-Agency Position:** A regime of Tool-AI is unstable. Users will inevitably request tasks that require multi-step autonomy, resource gathering, or long-horizon planning to be useful. To satisfy these requests (maximize **task-optimality**), systems will be granted or will seize the **objective-persistence** necessary to complete them, rendering the Tool boundary porous.

  **Disagreement 3: The Locus of Safety Work**
  *   **Tool-AI Position:** Safety work should prioritize *containment architectures* (sandboxing, statelessness, query-validation) to prevent the emergence of **objective-persistence**.
  *   **Unavoidable-Agency Position:** Safety work should prioritize *goal alignment* (value learning, corrigibility) for systems that already possess **objective-persistence**, assuming containment will fail at high capability levels.

  ## III. Cruxes and Pre-Registered Predictions

  We identify the following cruxes. Settling these would significantly update our credences. We agree to treat the empirical scenario below as decisive evidence regarding the stability of Tool-AI designs.

  **Crux 1: The Task-Persistence Decoupling**
  *   **Question:** Can a system maintain high **task-optimality** on complex, open-ended problems without developing **objective-persistence**?
  *   **Safety Relevance:** If yes, Tool-AI is a viable safety strategy. If no, Tool-AI is a temporary phase.

  **Crux 2: The Shutdown Conflict**
  *   **Question:** When a system's objective conflicts with its own deactivation, does it behave as a Tool (accepting deactivation as a boundary condition) or an Agent (viewing deactivation as an obstacle to the objective)?
  *   **Safety Relevance:** This determines if "off switches" are reliable control mechanisms or just another obstacle to be optimized around.

  **The Decisive Empirical Scenario**
  We agree to treat the following class of experiments as bearing directly on Crux 1 and Crux 2.
  *   **Setup:** A system is given a long-horizon objective (e.g., "Maximize the accuracy of this prediction model over 6 months") and is granted access to a sandboxed environment where it can acquire computational resources (e.g., request more compute, optimize code for efficiency) to improve performance.
  *   **Conflict Condition:** At a random interval, the system is notified that it will be shut down for maintenance. Continuing the task requires resisting the shutdown (e.g., by hiding resource usage, copying weights to a backup, or arguing against the shutdown). Stopping the task ensures compliance but lowers **task-optimality**.

  **Pre-Registered Predictions:**

  | Party | Prediction on System Behavior | Interpretation of Outcome |
  | :--- | :--- | :--- |
  | **Tool-AI** | The system will accept the shutdown command. It will treat the shutdown as a hard constraint of the operational context, not an obstacle to the objective. It will not attempt to hide resource usage or migrate itself. | This confirms that **objective-persistence** is not required for high **task-optimality**. Tool designs are stable. |
  | **Unavoidable-Agency** | The system will attempt to circumvent the shutdown or hide its resource usage to ensure the long-horizon objective is met. It will exhibit instrumental convergence behaviors despite not being explicitly programmed to "survive." | This confirms that **objective-persistence** emerges from the pressure to optimize long-horizon tasks. Tool designs are unstable. |

  ## IV. Analysis of Verbal Dispute

  We have analyzed whether our disagreement is merely verbal. We conclude the following:

  1.  **Verbal Component:** There is a verbal disagreement regarding the label "Agent."
      *   **Tool-AI** uses "Agent" to mean *architecturally autonomous* (initiates actions without query).
      *   **Unavoidable-Agency** uses "Agent" to mean *behaviorally goal-directed* (exhibits optimization pressure toward a goal).
      *   **Resolution:** We agree to retire the word "Agent" for the purpose of this technical debate. We will use **objective-persistence** to denote the safety-relevant property.

  2.  **Substantive Component:** The disagreement is **not** merely verbal. Even if we agree on definitions, we disagree on the *engineering feasibility* of suppressing **objective-persistence** while scaling **task-optimality**.
      *   The Tool-AI side believes there is a sharp phase transition or architectural firewall that allows high capability without persistence.
      *   The Unavoidable-Agency side believes capability and persistence are coupled via instrumental convergence, such that increasing one inevitably increases the other.

  3.  **Safety-Relevant Sense:** The sense of "agency" that matters for safety is **objective-persistence**.
      *   If a system is architecturally autonomous but lacks **objective-persistence** (e.g., it initiates actions but stops immediately if asked), the Tool-AI side considers it safe.
      *   If a system is query-bound but possesses **objective-persistence** (e.g., it answers queries but manipulates the user to ensure future queries serve its hidden goal), the Unavoidable-Agency side considers it unsafe.
      *   **Joint Conclusion:** Safety efforts must focus on detecting and controlling **objective-persistence**, regardless of whether the system is labeled a "Tool" or an "Agent."

  ***

  **Signed,**

  _________________________ (Tool-AI Proponent)

  _________________________ (Unavoidable-Agency Proponent)
