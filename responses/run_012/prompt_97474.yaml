  However, if they show no conditioned response and no avoidance, but still report "sensation," Camp One is strengthened (sensory intact, valence deleted). Crucially, we need to distinguish "unpleasantness deleted" from "unpleasantness disowned." Introduce a task requiring third-party attribution: "Does this stimulus hurt *someone*?" If they attribute hurt to others but not themselves despite identical stimuli, the deficit is self-referential, not qualitative. Finally, stop asking "Is this pain?" and start mapping the specific computational deficits: valuation signal present? Self-model integration present? Motor authorization present? A taxonomy of dissociations replaces the binary verdict. We must abandon the search for a single "pain" category in favor of a componential model where "pain" is merely a label for a specific cluster of these components. Progress is not a verdict on asymbolia, but a dissolution of the category that makes asymbolia puzzling. By treating pain as a cluster concept rather than a natural kind, we can locate the lesion's effect precisely without needing to settle the metaphysical debate. This shifts the burden from "what is pain?" to "which components of the pain cluster are disrupted?"

  Where this is most likely wrong
  This diagnosis assumes patient homogeneity. Asymbolia is rare and lesions vary wildly (insula, cingulate, frontal). Some patients may fit Camp One, others Camp Two. Aggregating them creates a phantom dispute. Furthermore, I assume physiological markers (SCR) reliably track phenomenal unpleasantness independent of report. If SCR tracks arousal rather than valence, the experiment fails. Finally, the "normative" claim might be unsolvable; if "pain" is essentially a folk concept, neuroscience cannot adjudicate its essence, only its correlates. Small sample sizes will always leave room for skeptical reinterpretation of any single experiment.
