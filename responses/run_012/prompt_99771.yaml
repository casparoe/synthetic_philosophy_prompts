answer: |-
  You have independently rediscovered one of the most famous and difficult problems in 20th-century metaphysics. The structural pattern you describe is known as **Bradley's Regress** (or the **Regress of Relations**).

  It is named after the British Idealist philosopher **F. H. Bradley**, who articulated it in his 1893 work *Appearance and Reality*. Your intuition is correct: this is not merely an engineering inconvenience; it is a structural feature of any system that attempts to fully explicate the nature of "connection" or "unity" using only objects.

  Here is the identification, distinction, and analysis of your specific case.

  ### 1. The Established Concept: Bradley's Regress

  **The Problem:**
  Bradley asked: What constitutes a fact? Suppose we have two particulars, $a$ and $b$, and a relation $R$. The fact is that $a$ stands in $R$ to $b$ (written $R(a,b)$).
  If we treat $R$ as just another entity (a universal or a node), we now have a list of three items: $\{a, b, R\}$. But a list is not a fact. In a list, the items are merely juxtaposed; in a fact, they are *unified*.
  To unify them, we seem to need a "tie" or a "nexus" (let's call it $T_1$) that connects $R$ to $a$ and $b$. But if $T_1$ is itself an entity (a relation), we now have $\{a, b, R, T_1\}$, which is again just a list. We need a new tie $T_2$ to connect $T_1$ to the others. This generates an infinite regress.

  **Vicious or Benign?**
  *   **Metaphysically:** It is generally considered **vicious**. If the existence of a fact depends on the completion of this chain, and the chain never completes, then facts (and thus reality) cannot exist. Bradley used this to argue that relations are unreal and that reality must be a single, undivided Absolute.
  *   **Logically:** Some modern logicians argue it is **benign** if one accepts that the regress does not prevent the first step from functioning, but this is a minority view in ontology.

  **Standard Responses:**
  1.  **Primitivism (Russell/Armstrong):** Accept that "exemplification" or "instantiation" is a **non-relational tie**. It does the work of connecting without being an entity itself. (This matches your intuition about "treating the relating as primitive.")
  2.  **Fact Primitivism (States of Affairs):** Take the whole fact ($R(a,b)$) as the fundamental unit of reality, not the constituents.
  3.  **Adverbialism:** Modify the particulars rather than adding a relation (e.g., $a$ is $R$-ly related to $b$).

  ### 2. Distinction from Other Regress Arguments

  It is crucial to distinguish Bradley's Regress from the other two you mentioned, as they target different categories.

  | Argument | Target | The Regress Trigger | Why it differs from your case |
  | :--- | :--- | :--- | :--- |
  | **Bradley's Regress** | **Ontological Unity** | Trying to explain how constituents bind into a **fact**. | **This is your case.** It concerns the "glue" of reality (or data). |
  | **Third Man Argument** | **Universals / Classes** | Trying to explain **resemblance** or shared properties via a higher Form. | Concerns *classification* (is $a$ an $F$?), not *connection* (is $a$ related to $b$?). |
  | **Homunculus Fallacy** | **Explanation / Cognition** | Explaining a capacity (e.g., vision) by positing an agent with that capacity inside. | Concerns *causal explanation*, not ontological structure. It is a category mistake, not necessarily a structural regress of constituents. |

  ### 3. Is Your Database Case an Instance or an Analogy?

  Your knowledge graph case is a **formal instantiation** of Bradley's Regress, but it is **pragmatically resolvable** in a way the metaphysical version is not.

  **Why it is an Instance:**
  You are modeling a state of affairs (a relation) as an entity (a node). You then correctly observe that for this node to *actually relate* the other nodes, there must be a structural connection. If you demand that *every* structural connection be represented as a node, you trigger the regress.

  **Why it is Resolvable (The Boundary):**
  In metaphysics, we are asking what reality *is*. In a knowledge graph, you are defining a **formal semantics**.
  *   **The Metaphysical Trap:** Believing that the *representation* of the connection must be of the same ontological type as the *things connected*.
  *   **The Engineering Solution:** The **edge** in your graph is the **primitive nexus**.

  In RDF or Property Graphs, the edge is not an entity *within* the graph; it is part of the **syntax** that defines the graph. An edge asserts existence and connection by definition. To reify the edge itself is to move from the *object language* (the data) to the *meta-language* (statements about the data, e.g., provenance, confidence scores).

  **The Boundary Definition:**
  *   **Metaphysical Issue:** "What makes this relation hold in reality?" (Requires an ontological ground).
  *   **Practical/Engineering Issue:** "How do I annotate this relation with metadata?" (Requires reification).

  Your regress becomes vicious only if you confuse **annotation** with **constitution**.
  *   **Constitution:** The edge *makes* the nodes related. (Stop here. Primitive.)
  *   **Annotation:** The reified node *describes* the relationship (e.g., "This relationship was asserted by User X on Date Y").

  ### 4. A Precise Name and Definition for the DB Case

  Since you asked for a precise name that marks the boundary between the metaphysical issue and the practical one, I propose calling this the **Representational Grounding Problem**.

  **Definition:**
  > The **Representational Grounding Problem** occurs when a knowledge modeling system attempts to represent the *semantic binding* of its own primitives (edges/assertions) using those same primitives, thereby confusing the **syntax of connection** with the **semantics of content**.

  **What Counts as a Solution:**
  A solution acknowledges a **stratification of ontology**:
  1.  **Base Layer (Primitive Nexus):** The graph edges themselves. These are not reifiable entities within the system; they are the logical "glue" (instantiation). They are treated as **atomic assertions**.
  2.  **Reified Layer (Content):** The nodes that represent relationships *as topics of discourse* (e.g., events, claims, transactions). These are connected to entities via the Base Layer edges.
  3.  **Meta Layer (Annotation):** Properties of the Reified Layer (timestamps, confidence, source).

  **What Does Not Count as a Solution:**
  *   **Total Reification:** Attempting to model the Base Layer edges as nodes connected by further edges within the same logical layer. This is the engineering equivalent of Bradley's Regress and leads to infinite schema nesting.
  *   **Denial of Reification:** Refusing to reify relations at all. This solves the regress but limits expressivity (you cannot add metadata to relationships).

  ### Summary Recommendation for Your Ontology

  You do not need to solve Bradley's Regress metaphysically; you need to **block** it formally.

  1.  **Accept Primitivism:** Explicitly declare in your ontology documentation that **edges are primitive ties**. They do not require further justification within the graph. They correspond to the logical copula or the "nexus."
  2.  **Reify for Metadata, Not for Unity:** Only reify a relation when you need to talk *about* the relation (e.g., "This marriage *occurred in* 1990"). Do not reify the relation to make it "hold." It holds because the edge exists.
  3.  **Name the Pattern:** When documenting this design choice, refer to it as **"Blocking Bradley's Regress via Syntactic Primitivism."** This signals to other ontologists that you are aware of the philosophical depth of the problem and have chosen the standard analytic philosophy solution (akin to Bertrand Russell's later view) adapted for computer science.

  You have encountered the limit where data modeling touches fundamental ontology. The "inconvenience" you feel is the friction of trying to make a formal system fully self-describing. The way out is to accept that the system rests on a semantic foundation (the graph engine/syntax) that cannot be fully modeled *inside* the system without changing layers.
