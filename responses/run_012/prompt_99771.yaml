      *   It is also closely related to the **Problem of Unity** or the **Binding Problem** in metaphysics.
      *   It concerns the nature of *relations* and *facts* (states of affairs). How do constituents $a$, $b$, and relation $R$ form the fact $R(a,b)$ rather than just a list $\{a, b, R\}$?

  3.  **Distinguish from Other Regresses:**
