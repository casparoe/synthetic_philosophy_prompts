  8.  *(Self-Correction during drafting)*: Make sure not to conflate Putnam with Searle. Searle says "biology is necessary." Putnam says "computation is not sufficient" and "computation is observer-relative." Putnam's later view is that computational description is not a *natural kind*. I need to be precise there. The lab treats "computation" as a natural kind that carries mentality. Putnam says it's not.

