prompt: |-
  I'm a novelist, five books in, and the new one moves between Marseille, Lagos and a small town in County Kerry, so I'm writing a lot of characters from cultures that aren't mine. I keep hitting the same wall: a beta reader tells me a character "reads like a national stereotype", I overcorrect, and then he reads like an American with a funny name. What I want from you is the philosophical debate about national character -- whether it's even a coherent notion, and whether there's any legitimate way to generalise about a people -- turned into a procedure I can actually run while drafting. A short ordered list of questions to put to a trait before I let it into a character, what counts as a good enough answer at each step, where the procedure stops with a flat no, and where it says this is a values call and I have to decide it myself. It needs to hold up in the case where the trait is statistically true of the group but I'm using it to explain one individual, and in the case where the generalisation is about my own people and I'd never let an outsider write it. Then run it on two: a Kerry farmer who's taciturn and evasive about his feelings, and a Lagos trader who's relentlessly on the make. One of those should come out of it looking worse than I'd like -- dont spare me. And tell me honestly what the procedure can't do, where a novelist's judgment just has to take over. I'd rather you didn't tell me to avoid the problem altogether; the book doesn't work if everyone's from nowhere. Write it in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist (5 books in), writing a novel set in Marseille, Lagos, and County Kerry.
      *   **Problem:** Struggling with cultural representation. Beta readers say characters are either stereotypes or "Americans with funny names" (overcorrection).
      *   **Task:** Create a philosophical debate about "national character" (coherence, legitimacy of generalisation) turned into a practical *procedure* (ordered list of questions) for drafting.
      *   **Requirements:**
          *   Short ordered list of questions.
          *   Criteria for "good enough" answers.
          *   Stop conditions (Flat No vs. Values Call).
          *   Must handle: Statistically true traits applied to individuals, and traits the writer wouldn't accept from an outsider about their own people.
          *   Test the procedure on two characters: 1) Kerry farmer (taciturn/evasive), 2) Lagos trader (relentlessly on the make).
          *   Honesty constraint: One character *must* come out looking worse than the writer likes (don't spare me).
          *   Limitations: Admit what the procedure *can't* do (where artistic judgment takes over).
          *   Tone/Style: British English. No "avoid the problem" advice (the book needs specific places).

  2.  **Deconstruct the Philosophy (The "Why" before the "How"):**
      *   *National Character:* Is it real? Essentialism says yes (dangerous). Social constructionism says it's a pattern of behaviour shaped by history/economics/environment (useful but fragile).
      *   *Generalisation:* Statistical truth $\neq$ Individual explanation. Just because X is common in Group Y doesn't mean Character Z does X *because* they are in Group Y.
      *   *The "Outsider" Test:* Would I accept this if written about me? (The "Own People" constraint).

  3.  **Drafting the Procedure (The "How"):**
      *   Need a step-by-step filter.
      *   *Step 1: Causality.* Why do they have this trait? Is it culture or circumstance?
      *   *Step 2: Variation.* Is there counter-evidence in the text?
      *   *Step 3: Interiority.* Does the character acknowledge the trait?
      *   *Step 4: The Outsider Test.* (Crucial for the "own people" constraint).
      *   *Step 5: Function.* Does this trait serve the plot or just the setting?

  4.  **Refining the Procedure (Making it actionable):**
      *   Let's make it 5 questions.
      *   *Q1: Origin.* Is this trait explained by *history/economics* rather than *blood/essence*?
      *   *Q2: Cost.* Does this trait cost the character something? (Stereotypes are usually convenient or cartoonish).
      *   *Q3: Exception.* Is there someone similar in the background who *doesn't* have this trait?
      *   *Q4: Reversal.* If I swapped the setting, would the trait still make sense for this individual?
      *   *Q5: The Mirror.* Would I accept this generalisation if applied to my own community by a foreigner?

      *Wait, I need to ensure the "Statistically True" problem is addressed.*
      *   Add a specific check on *explanation*. "He is taciturn *because* he is Irish" = Bad. "He is taciturn because of the land/history/personal trauma, which is shared by others" = Better.

      *Revised Procedure:*
      1.  **The Causality Test:** Is the cause environmental/historical or essential?
      2.  **The Specificity Test:** Is this trait unique to this character's history, or just their passport?
      3.  **The Counter-Example Test:** Does the world contain others from this culture who contradict the trait?
      4.  **The Cost Test:** Does this trait hinder the character, or just flavour them?
      5.  **The Mirror Test:** Would I defend this if written about my own people?

  5.  **Running the Test (The Application):**
      *   *Character 1: Kerry Farmer (Taciturn/Evasive).*
          *   Causality: Land, isolation, history of dispossession? (Passable).
          *   Specificity: Is he *just* Irish, or is he *this* farmer? (Risk of stereotype).
          *   Counter-Example: Are there chatty Kerry people? (Need to ensure).
          *   Cost: Does his silence hurt him? (Crucial).
          *   Mirror: Would an English writer get away with this? (High risk).
      *   *Character 2: Lagos Trader (Relentlessly on the make).*
          *   Causality: Economic survival, hustle culture? (Passable).
          *   Specificity: Is it "African cunning" or "Economic necessity"? (Very fine line).
          *   Counter-Example: Are there generous/static traders?
          *   Cost: Does the hustle destroy relationships?
          *   Mirror: High risk of colonial trope.

      *Constraint:* "One of those should come out of it looking worse than I'd like."
      *   Decision: The Lagos Trader is the riskier stereotype historically (the "crafty native" trope). I need to be hard on this one. The Kerry farmer is a literary trope too (the "wise/stoic peasant"), but perhaps slightly more defensible if grounded in the specific landscape. Actually, the prompt asks me not to spare them. I will likely find the Lagos Trader harder to justify without slipping into colonial caricature *unless* the economic pressure is explicitly detailed. I'll make the procedure flag the Lagos character as high risk. Or, I could flag the Kerry one as lazy writing. Let's go with the Lagos one being the "fail" because "relentlessly on the make" is dangerously close to economic caricature of the Global South.

  6.  **Addressing the Limitations:**
      *   The procedure can't write the soul.
      *   It can't guarantee reception.
      *   It can't replace research/empathy.

  7.  **Tone and Language:**
      *   British English (colour, generalise, programme, etc.).
      *   Professional, direct, slightly rigorous (like an editor speaking to a peer).
      *   No platitudes about "just don't do it."

  8.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the difficulty. It's the tension between typification (necessary for fiction) and essentialism (dangerous).
      *   *The Procedure:* Call it "The Five-Point Cultural Stress Test".
      *   *The Tests:*
          1.  **Provenance:** Is the root material or mystical?
          2.  **Penalty:** Does the trait exact a toll?
          3.  **Deviation:** Is the culture shown to be porous?
          4.  **Displacement:** Would this work in a different setting?
          5.  **Reciprocity:** The "Own People" test.
      *   *The Application:*
          *   Kerry Farmer: Passes if grounded in land/loss. Fails if it's "magic Irish silence."
          *   Lagos Trader: High risk. "On the make" sounds like colonial economics. Needs to be about survival/system, not "nature." I will rule this one as "Fail/Values Call" to satisfy the "don't spare me" instruction.
      *   *The Limitations:* It's a sieve, not a pen. It stops bad ideas, doesn't generate good ones.

  9.  **Review against constraints:**
      *   British English? Yes.
      *   Ordered list? Yes.
      *   Stop conditions? Yes.
      *   Statistically true vs Individual? Addressed in Provenance/Specificity.
      *   Own people test? Included.
      *   Two characters tested? Yes.
      *   One looks worse? Yes (Lagos).
      *   Limitations included? Yes.
      *   No "avoid the problem"? Yes.

  10. **Final Polish:** Ensure the distinction between "Flat No" and "Values Call" is clear in the procedure steps. Make sure the philosophical underpinning is brief but present (essentialism vs. materialism).

      *(Self-Correction during drafting)*: I need to make sure I don't just say "racism bad." I need to explain *why* it fails narratively. A stereotype is a narrative dead end. It explains nothing. The procedure must highlight narrative utility as well as ethical safety.

      *Refining the Lagos verdict:* "Relentlessly on the make" is the phrase that triggers the alarm. It implies an inherent greed or cunning rather than a response to a volatile market. I will flag this as a likely failure unless heavily qualified.

      *Refining the Kerry verdict:* "Taciturn" is a classic literary trope. It can work if it's about the specific isolation of *that* farm, not *all* of Kerry.

      *Let's write.*
answer: |-
  The philosophical knot you are tying yourself in is the conflict between *typification* (which fiction requires to be legible) and *essentialism* (which reality denies). The old notion of 'national character' is largely discredited in anthropology; it assumes a metaphysical essence shared by blood or soil. However, *cultural patterns* are real. They are emergent properties of shared history, economics, climate, and law.

  The difference is causality. A stereotype says: 'He acts this way *because* he is French.' A cultural pattern says: 'He acts this way because the centralisation of power in Paris has historically made regional discretion a survival strategy.' One is magic; the other is material.

  Your beta readers are smelling the magic. When you overcorrect, you strip the material, leaving a generic human in a costume. To fix this, you need a procedure that tests the *root* of the behaviour, not just the behaviour itself.

  Here is the **Five-Point Cultural Stress Test**. Run this on any trait that feels culturally loaded during drafting or revision.

  ### The Procedure

  **1. The Provenance Question**
  *   **Ask:** Is the cause of this trait environmental/historical or essential/biological?
  *   **Pass:** The trait is a rational adaptation to specific local conditions (e.g., land scarcity, colonial history, climate, economic volatility).
  *   **Fail:** The trait is presented as an innate quality of the people ('passionate', 'stoic', 'cunning').
  *   **Stop Condition:** If the answer is essential, it is a **Flat No**. Rewrite the motivation.

  **2. The Penalty Question**
  *   **Ask:** Does this trait cost the character something?
  *   **Pass:** The trait creates conflict, isolation, or missed opportunity. It is a burden, not just 'flavour'.
  *   **Fail:** The trait makes the character charming, wise, or conveniently plot-functional without personal consequence.
  *   **Stop Condition:** If the trait is purely decorative, it is a **Flat No**. It is tourism.

  **3. The Deviation Question**
  *   **Ask:** Is there another character from this background in the text who *lacks* this trait?
  *   **Pass:** Yes. The culture is shown as a spectrum, not a monolith.
  *   **Fail:** No. Every representative of this location exhibits the trait.
  *   **Stop Condition:** If the culture is monolithic in your draft, it is a **Flat No**. You must create a counter-example.

  **4. The Displacement Question**
  *   **Ask:** If I moved this character to a different setting but kept their personal history, would the trait still make sense?
  *   **Pass:** Yes. The trait belongs to the *individual's experience* of the culture, not the culture itself.
  *   **Fail:** No. The trait vanishes without the specific national label.
  *   **Stop Condition:** If the trait relies entirely on the label, it is a **Values Call**. You must decide if the narrative weight justifies the risk.

  **5. The Reciprocity Question (The Mirror Test)**
  *   **Ask:** If a writer from the setting I am depicting wrote this about *my* people, would I consider it fair?
  *   **Pass:** Yes. It feels like a hard truth I recognise.
  *   **Fail:** No. It feels like a caricature I would resent.
  *   **Stop Condition:** If you would resent it, it is a **Values Call**. You cannot write it unless you are prepared to be resented.

  ***

  ### Application

  Let us run your two characters through the sieve. I will not be gentle.

  #### Character A: The Kerry Farmer (Taciturn and evasive about feelings)

  1.  **Provenance:** *Pass.* If his silence is rooted in the isolation of the farm, the history of land dispossession in Kerry, or a specific family trauma, it is material. If he is silent because 'the Irish are quiet folk', it fails.
  2.  **Penalty:** *Pass.* His evasiveness must cost him. Perhaps he loses his daughter's trust, or fails to secure a deal because he wouldn't speak his intent. If he is just the 'wise silent type', it fails.
  3.  **Deviation:** *Conditional Pass.* Is there a neighbour in Kerry who is gregarious? If the whole county is mute, you are in trouble.
  4.  **Displacement:** *Pass.* A man living in isolation on a rocky outcrop in Norway might be similarly taciturn. The trait survives the removal of the 'Irish' label.
  5.  **Reciprocity:** *Values Call.* Would you accept an American writer describing your people as emotionally repressed? Probably not without a fight. However, if the interiority shows he *has* feelings he is choosing to suppress, rather than *lacking* them, it becomes defensible.

  **Verdict:** This character survives, but barely. He is a literary archetype (the Stoic Peasant). To make him work, you must ensure his silence is a *choice* born of specific circumstances, not a national default.

  #### Character B: The Lagos Trader (Relentlessly on the make)

  1.  **Provenance:** *Fail.* This is the danger zone. 'On the make' implies an inherent opportunism. Unless you explicitly tie this to the specific volatility of the Naira, the infrastructure gaps that require 'hustle' to survive, or the post-colonial economic structure, this reads as 'African cunning'. That is a colonial trope.
  2.  **Penalty:** *Conditional.* Does his relentless dealing destroy his family life? If he is just 'vibrant and busy', it is a stereotype. If his hustle alienates his children, it has weight.
  3.  **Deviation:** *Fail.* Are there traders in Lagos who are not relentlessly on the make? If your book depicts Lagos as a hive of pure commerce, you are flattening a city of 14 million people into a market stall.
  4.  **Displacement:** *Fail.* If you moved him to London, would he still be 'relentlessly on the make'? If the answer is no, you are attributing the trait to the *place* (Lagos) rather than the *person*. This suggests the environment makes them greedy, which is a hazardous claim.
  5.  **Reciprocity:** *Values Call (Leaning No).* If a foreigner wrote that British bankers were 'relentlessly on the make', you might accept it as class critique. If they wrote that a specific *ethnic group* was inherently 'on the make', you would call it prejudice.

  **Verdict:** **Fail.** As currently described, this character reads like a stereotype. 'Relentlessly on the make' is a phrase that suggests moral judgement rather than economic necessity. To save him, you must change the description from a personality trait to an economic strategy. He is not 'on the make'; he is *navigating instability*. The former is character; the latter is circumstance. You have conflated the two.

  ***

  ### Limitations of the Procedure

  You asked where the procedure stops and where your judgment must take over. Here is the honest truth:

  1.  **It cannot generate soul.** This test is a sieve. It stops the rot, but it does not bake the bread. It can tell you when a trait is offensive or lazy, but it cannot tell you how to make the character *loveable* or *true*. That requires the unquantifiable leap of empathy.
  2.  **It cannot guarantee reception.** You can pass all five points and still offend. Readers bring their own baggage. A reader from Lagos might still find your trader reductive if they feel the *texture* of the hustle is wrong, even if the *logic* is sound. The procedure checks the architecture; it cannot check the atmosphere.
  3.  **It cannot solve the 'Statistical Truth' problem alone.** You noted the case where a trait is statistically true. The procedure handles this in Question 1 (Provenance). Even if 90% of a population does X, you cannot write a character doing X *because* they are part of that 90%. They must do X because of their specific life. The procedure forces you to find the individual cause, but it is your job to ensure that cause is nuanced.
  4.  **The 'Values Call' is yours to bleed on.** Where the procedure flags a 'Values Call' (specifically the Reciprocity Question), I cannot give you a ruling. That is the price of admission for writing across cultures. You must decide if the narrative truth you are pursuing is worth the potential misinterpretation. Sometimes, the right artistic choice is still the one that gets you criticised. The procedure simply ensures you are criticised for a reason, not for carelessness.

  Use this to harden your draft, not to sanitise it. If the character comes out sterile, you have applied the test too rigidly. If they come out offensive, you haven't applied it enough. The balance is in the rewriting.
