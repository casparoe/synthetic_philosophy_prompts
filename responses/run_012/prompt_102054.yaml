answer: |-
  **Bottom Line:** Authorize a prohibited act only if refusal guarantees immediate, catastrophic loss of life that compliance definitively prevents, and the violation creates no irreversible systemic risk to the mission.

  ### The Decision Procedure

  **1. The Certainty Test (Refusal)**
  *Ask:* If we refuse, is the harm (death/severe injury) certain, not just probable?
  *   **Yes:** Proceed.
  *   **No/Uncertain:** **STOP. Firm No.** You cannot violate principles for speculative gains. If you cannot quantify the harm, assume the prohibition stands.

  **2. The Efficacy Test (Compliance)**
  *Ask:* Will doing the forbidden thing definitely prevent that specific harm?
  *   **Yes:** Proceed.
  *   **No:** **STOP. Firm No.** Do not pay costs for无效 (ineffective) solutions.

  **3. The Reversibility Test**
  *Ask:* Is the harm caused by *our* action reversible?
  *   **Yes (e.g., money, time):** Proceed.
  *   **No (e.g., death, compromised identity, loss of neutrality):** **STOP. Firm No.** You cannot trade irreversible mission integrity for temporary access.

  **4. The Precedent Test**
  *Ask:* Will this decision normalize the violation for future teams?
  *   **Low Risk:** Field Officer may authorize (document heavily).
  *   **High Risk:** **Escalate to Board.** This is a values call, not a factual one.

  **5. The Transparency Clause**
  *Action:* Any authorization under this procedure must be documented and reported within 24 hours. Secrecy invalidates the exception.

  ### Limitations and Honesty
  This procedure is not philosophically neutral; it leans consequentialist to answer your Board member. It privileges immediate, visible suffering over abstract rule integrity. It will misfire when "certainty" is unknowable (common in crises), forcing a default "No" that may feel morally cowardly. It also cannot resolve conflicts where both compliance and refusal lead to certain death; in those cases, this flowchart breaks, and you must rely on moral luck. Finally, it risks laundering your gut feeling: if you want to say "Yes," you will find the certainty "high"; if "No," you will find the precedent "risky." Use it to stress-test instincts, not replace them.

  ### Case Applications

  **Case 1: Paying a bribe at a checkpoint for a medical convoy.**
  *   **Certainty:** Convoy turned back means patients die tonight. (Pass)
  *   **Efficacy:** Payment guarantees passage. (Pass)
  *   **Reversibility:** Money is lost, but lives are saved. Financial harm is reversible; death is not. (Pass)
  *   **Precedent:** Risky, but if documented as a one-off emergency, manageable. (Board Notification)
  *   **Result:** **Authorized.**
  *   **Why this bites:** Your deontological instinct says "Bribery is forbidden, full stop." This procedure forces you to admit that if the cost is money and the gain is life, the rule bends. It implicates you in corruption to save lives.

  **Case 2: Handing over staff names to a militia.**
  *   **Certainty:** Militia threatens to kill beneficiaries if names are withheld. (Pass)
  *   **Efficacy:** Handing list may stop immediate threat. (Pass)
  *   **Reversibility:** Once names are known, staff are permanently compromised. Neutrality is destroyed. (Fail)
  *   **Precedent:** Sets precedent that NGO data is accessible to armed actors. (High Risk)
  *   **Result:** **Firm No.**
  *   **Why this fits:** Even though lives are threatened, the harm of compliance (destroying long-term access and safety for all future staff) is irreversible. The procedure holds the line here, protecting the mission's future capacity over immediate pressure.

  This tool gives your Board member the consequentialist rigor they demand while preserving your deontological core where it matters most: irreversible compromise.
