prompt: |-
  You are an expert in both international criminal law and public-health surveillance, and I want you to work slowly and deliberately rather than reaching for the standard framing. Begin by thinking on the page: first, lay out for yourself the elements of the legal and moral category of genocide — the category Lemkin named and the courts have since construed — including the enumerated acts, the intent requirement and its special-intent wrinkle, the protected-group list, the individual-liability structure, and the fact that the label is conferred by courts and states rather than observed in the world. Then lay out, just as carefully, how a public-health agency's case definition actually functions: who writes it, what it trades away in sensitivity for the sake of specificity, what happens to cases that fall outside it, and what a surveillance system does and does not record. Only after that groundwork should you attempt the translation.

  I'm a science journalist who has spent a decade covering outbreaks, so I'm at home with case definitions, attack rates, background rates, person-place-time, case ascertainment, misclassification, and the institutional fights over when to declare an outbreak an outbreak; my legal knowledge is a lay reader's. Restate, as faithfully as you can, the case for treating genocide as a distinct legal and moral category — and the politics of applying or withholding the name — entirely in the vocabulary of case definitions and surveillance. Do not smuggle the lawyers' assumptions in and call them translation; if a legal notion has to be stretched to fit, say so as you stretch it.

  Then give me the residue report. What carries over without loss? What carries over only in a distorted form? What has no counterpart in surveillance vocabulary at all — and where the residue sits, tell me whether that is a defect of the surveillance framework or a sign that the legal and moral category is doing less work than it appears to.
