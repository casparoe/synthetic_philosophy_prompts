answer: |-
  ### Part I: The Legal Specimen (Deconstructing the Category)

  Before we can translate, we must isolate the variables. In international criminal law (ICL), genocide is not a description of scale. It is not a synonym for "mass killing." It is a specific statutory construct, codified in the 1948 Convention on the Prevention and Punishment of the Crime of Genocide.

  **1. The Enumerated Acts (*Actus Reus*)**
  The Convention lists five specific phenotypes of conduct. For a case to exist, one of these must be present:
  *   Killing members of the group.
  *   Causing serious bodily or mental harm.
  *   Deliberately inflicting conditions of life calculated to bring about physical destruction (e.g., starvation, blocking medicine).
  *   Imposing measures intended to prevent births (sterilization, prohibitions on marriage).
  *   Forcibly transferring children of the group to another group.

  **2. The Protected Group List**
  The Convention protects only four types of collectives: national, ethnical, racial, or religious. This is a closed list. Political groups, social classes, gender identities, and cultural groups were debated during drafting but excluded to secure state ratification. If the violence targets a political opposition, legally, it cannot be genocide, regardless of scale.

  **3. The Intent Requirement (*Mens Rea* and *Dolus Specialis*)**
  This is the critical constraint. General intent to commit the act (e.g., intent to kill) is insufficient. The prosecution must prove *dolus specialis* (specific intent): the intent to destroy the protected group, *in whole or in part*, *as such*.
  *   "As such" means the victims are targeted *because* of their group membership, not merely because they are in the way of a military objective.
  *   "In part" requires a substantial portion, often interpreted qualitatively (significance to the whole) as well as quantitatively.

  **4. Individual Liability and Binary Verdicts**
  Genocide is a crime of individual responsibility. States can be held responsible for failing to prevent it (ICJ), but the label "genocide" in its punitive sense attaches to specific perpetrators (ICC, ad hoc tribunals). The output is binary: guilty or not guilty. There is no "partial genocide" verdict.

  **5. The Labeling Mechanism**
  Genocide is not an empirical observation like "rain" or "earthquake." It is a forensic conclusion. It is conferred by a competent court after adversarial testing of evidence. Politically, states or the UN may use the term, but without a judicial finding, it remains an allegation. The legal category is designed to be high-threshold to prevent dilution and to trigger specific obligations (the duty to prevent and punish).

  ***

  ### Part II: The Epidemiological Instrument (Deconstructing Surveillance)

  Now, we lay out the mechanics of public-health surveillance. This is not about clinical care for an individual; it is about population-level monitoring to trigger control measures.

  **1. Authorship and Authority**
  Case definitions are written by technocratic bodies (CDC, WHO, ECDC) in consultation with member states. They are not static; they are revised as knowledge of the pathogen evolves (e.g., changing the COVID-19 case definition from PCR-only to include antigen tests or symptoms).

  **2. The Sensitivity/Specificity Trade-off**
  A case definition is a filter.
  *   **Sensitivity:** The ability to capture all true cases. High sensitivity is needed early in an outbreak to stop transmission.
  *   **Specificity:** The ability to exclude non-cases. High specificity is needed for final counts and resource allocation to avoid wasting interventions on false positives.
  *   *The Trade-off:* You cannot maximize both. A "suspect case" definition is sensitive but prone to noise. A "confirmed case" definition is specific but misses cases (under-ascertainment).

  **3. Exclusions and the "Non-Case"**
  If a patient presents with symptoms but fails the lab criterion or the epidemiological link, they are a "non-case" for surveillance purposes. They may still be sick, even dying, but they vanish from the dataset. They do not count toward the attack rate. They do not trigger the outbreak protocol.

  **4. What Surveillance Records**
  Surveillance systems record *events*, not *motives*. They track Person, Place, and Time. They calculate incidence, prevalence, and mortality rates. They look for clustering (excess over background rate). They do not record *why* the pathogen infected the host, only *that* it did.

  **5. The Declaration Threshold**
  Declaring an "outbreak" or "Public Health Emergency of International Concern" (PHEIC) is a political-technical decision. It triggers resource flow and travel restrictions. There is often institutional friction: epidemiologists may see the signal, but state authorities may suppress the declaration to avoid economic stigma.

  ***

  ### Part III: The Translation (Genocide as a Surveillance Category)

  Here we attempt the translation. We are treating the *legal category of genocide* as if it were a *public-health case definition* used to monitor a specific social pathology.

  **1. The Case Definition: Extreme Specificity**
  In surveillance terms, the legal definition of genocide is a **Confirmed Case Definition** optimized for 100% specificity at the expense of sensitivity.
  *   **Clinical Criteria:** The five enumerated acts.
  *   **Lab Criteria:** The proof of *dolus specialis* (specific intent).
  *   **Epi Link:** Membership in one of the four protected groups.

  In outbreak terms, this is akin to defining a disease not by symptoms (fever, rash), but by symptoms *plus* the isolation of a specific, rare virus *plus* proof that the virus was intentionally introduced.

  **2. Intent as a Biomarker**
  To make this fit the vocabulary: Specific intent (*dolus specialis*) functions as the **pathognomonic sign** or the **gold-standard biomarker**.
  *   In standard surveillance, if the clinical presentation matches (mass killing), we might classify it as "Violence Syndrome."
  *   In the Genocide Definition, without the biomarker (Intent to Destroy Group), the case is rejected, regardless of the clinical severity (body count).
  *   *The Stretch:* In epidemiology, biomarkers are biological and observable. Intent is psychological and inferential. We are treating a state of mind as if it were a PCR test result.

  **3. Ascertainment and the Surveillance Pyramid**
  *   **Suspect Cases:** Situations where mass atrocities occur against protected groups, but intent is ambiguous. In public health, these would be tracked to monitor trends. In the legal genocide framework, these are often discarded from the "genocide" dataset until adjudicated.
  *   **Confirmed Cases:** Only those adjudicated by a court (the Reference Lab).
  *   **The Consequence:** This creates massive **under-ascertainment**. The "incidence rate" of genocide is artificially low because the confirmation process takes years or decades. By the time a case is "confirmed," the outbreak is often over.

  **4. The Politics of Declaration: Threshold Effects**
  Why do states resist the label? In surveillance, declaring an outbreak triggers quarantine, trade bans, and stigma.
  *   **Sovereignty as Quarantine:** Calling an event "genocide" triggers a legal obligation for other states to intervene (prevention/punishment). This breaches sovereignty.
  *   **Misclassification Bias:** States have an incentive to classify deaths as "collateral damage of war" (non-case) rather than "genocide" (confirmed case) to avoid the intervention protocol. This is not scientific error; it is political suppression of surveillance data.

  **5. Distinctness: Why Not Just "Homicide"?**
  Why does this category need to exist, distinct from "Crimes Against Humanity" (which is broader)?
  *   **Epi Translation:** Think of "Crimes Against Humanity" as **All-Cause Mortality**. It captures everything (murder, enslavement, deportation). It has high sensitivity.
  *   **Genocide** is a specific **Etiological Classification**. It identifies a specific *strain* of violence (destruction of a group).
  *   **The Argument for Distinctness:** If you only track All-Cause Mortality, you miss the transmission dynamic. Genocide is contagious in a specific way—it targets identity to dismantle social immunity. If you don't name the specific strain, you apply the wrong intervention (peacekeeping vs. regime change, humanitarian aid vs. protection of specific enclaves). The distinct label is necessary for the specific *prophylaxis*.

  ***

  ### Part IV: The Residue Report

  We have run the legal category through the surveillance filter. Now we assess the loss, distortion, and void.

  **1. What Carries Over Without Loss**
  *   **The Trigger Function:** Both systems use a narrow definition to trigger a disproportionate response. In health, a "PHEIC" unlocks funds and waivers. In law, "Genocide" unlocks the duty to prevent and universal jurisdiction. The *politics of the threshold* are identical.
  *   **The Problem of Under-Reporting:** Both systems suffer when the entities responsible for reporting (states) are the vectors of the harm. Surveillance fails when governments hide cases; Genocide law fails when governments block investigations.
  *   **Standardization Necessity:** Both fields acknowledge that without a standardized case definition, data cannot be compared across borders or time. The 1948 Convention is the WHO ICD-10 code for mass atrocity.

  **2. What Carries Over Only in Distorted Form**
  *   **Intent as a Biomarker:** This is the greatest stretch. In surveillance, a pathogen exists independently of observation. In law, "intent" is constructed through evidence. Treating intent as a binary marker (present/absent) distorts the reality of violence, which often exists on a spectrum of negligence, recklessness, and malice. Surveillance deals with probabilities; Genocide law demands certainty (beyond reasonable doubt).
  *   **The "Outbreak" Timeline:** Surveillance is prospective (stop the spread). Genocide law is retrospective (punish the perpetrator). Translating genocide as a surveillance category implies we are monitoring to stop it *now*. But the legal definition is built for trial *later*. The "surveillance" is actually a "post-mortem audit."

  **3. What Has No Counterpart in Surveillance Vocabulary**
  *   **Individual Liability (The Vector vs. The Host):** Surveillance tracks the disease in the population. It does not care if the virus is "guilty." It cares about transmission chains. Genocide law is obsessed with *individual moral culpability*. There is no epidemiological equivalent to "prison." You isolate the infectious, you do not punish the virus. The legal category is doing *retributive* work that surveillance vocabulary cannot capture.
  *   **The Moral Expressivism:** Calling something "genocide" performs a moral function (stigma, historical memory) that exceeds the utilitarian function of a case definition. A "confirmed measles case" carries no moral shame. A "confirmed genocide" carries eternal infamy. Surveillance vocabulary has no variable for "shame."

  **4. The Residue Analysis: Defect or Feature?**
  *   **Is it a defect of the surveillance framework?** No. Surveillance is designed for control, not justice. Asking epidemiology to handle moral culpability would break the tool.
  *   **Is it a sign the legal category is doing less work than it appears?** Here is the critical finding. The translation reveals that the legal category of genocide is a **poor surveillance tool**. It is too specific, too slow, and too binary to effectively monitor ongoing atrocities for the sake of prevention.
  *   **The Conclusion:** The legal category is not designed to be a surveillance system. It is designed to be a **verdict**. When we try to use "genocide" as a real-time monitoring label (e.g., "Is this happening now?"), we are forcing a judicial tool to do epidemiological work. The friction you feel—the institutional fights over when to declare it—is not a bug. It is the result of using a high-specificity forensic definition to make low-specificity field decisions.

  **Final Translation:**
  Genocide, in surveillance terms, is not a case definition for *detection*. It is a case definition for *archival classification*. It is the ICD code you put on the death certificate after the autopsy, not the triage tag you use in the field. The politics of withholding the name are the politics of refusing to triage the patient as "critical" because the insurance (international intervention) is too expensive, even if the clinical signs (body count) are evident. The legal category preserves the *moral specificity* of the crime but sacrifices the *sensitivities* required to stop the outbreak while it is burning.
