  1. Moore explicitly identifies the enjoyment of beautiful objects and the pleasures of personal affection as the two distinct greatest goods known to us. (Uncontested exegesis)
  2. He simultaneously maintains the principle of organic unity, asserting that the value of a whole is never merely the sum of the values of its constituent parts. (Uncontested exegesis)
  3. Taken at full strength, this principle implies that aesthetic enjoyment and personal affection are not distinct atoms but fused components of a single compound good that cannot be separated without loss of value. (Contested interpretive move)
  4. Ranking them as independent items therefore requires treating them as separable sums, which directly contradicts the assertion that their value arises only from their organic unity. (Contested interpretive move)
  5. The final chapter's comparative verdict is thus incoherent, because it attempts to weigh as independent what the book's own metaphysics of value proves is a singular, indivisible whole. (Contested interpretive move)
