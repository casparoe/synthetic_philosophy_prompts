prompt: |-
  You are a philosopher of probability and formal epistemology with expertise in diachronic coherence and Bayesian updating. I want a careful accuracy audit, not a summary of the literature. Before you answer, brainstorm the main distinctions one would need—synchronic versus diachronic constraints, the difference between a theorem of the probability calculus and a rationality norm, the relationship between conditionalization and reflection, and the difference between reflection and chance-deference principles—then go sentence by sentence through the following characterization.

  A colleague who writes popular introductions to Bayesian reasoning summarized van Fraassen's Reflection principle for me like this:

  'Van Fraassen's Reflection principle says that a rational agent's current credence in A, conditional on the fact that her future self will assign credence x to A, must itself be x. In other words, you should treat your future self as an expert about your own future beliefs: if you know you will later be 90% confident that it will rain, you should be 90% confident now. This is just the probability calculus applied to your future self as a random variable, so it is a theorem of Bayesian rationality. It is also equivalent to the requirement that you update your credences by conditionalization; since every Bayesian accepts conditionalization, every Bayesian is committed to Reflection. The only people who reject Reflection are those who think there can be no rational constraints on what we will believe in the future, which is a position no serious epistemologist holds.'

  I suspect this is too smooth, but I don't know enough to locate the problems. Please tell me: which parts would van Fraassen or a sympathetic formal epistemologist accept, which are common simplifications, and which are outright mistakes? In particular, is Reflection really a theorem, is it really equivalent to conditionalization, and does the claim about all Bayesians follow? What would a defender of Reflection say about cases where you know your future self will be irrational—say, because of a drug, a bias, or a commitment device—and does that force a qualification, a restriction, or a rejection? Also address whether the summary has conflated Reflection with the Principal Principle or with the martingale/reflection property from probability theory, and whether the 'future self as expert' gloss captures the formal principle or slides past something important.

  Separate throughout what is settled from what is genuinely contested among people who know the topic, and do not present a contested reading as the consensus. If the summary's final conclusion does not follow from the accurate parts, say so explicitly. I would rather have a precise map of the fault lines than a verdict on whether the colleague is a good guy. No citations or reading list needed; keep it conceptual.
