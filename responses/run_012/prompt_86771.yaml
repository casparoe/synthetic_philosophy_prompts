answer: |-
  A perfect Bayesian walks into a support group for agents who conditionalize correctly. The facilitator asks, "Who here has assigned probability one to their evidence?" Every hand goes up. "And who here has had a hypothesis confirmed today?" Dead silence. 

  Finally, a guy in the back raises his hand. "I did!" Everyone stares. "How?" asks the facilitator. 

  "I lost my notes," he says. "Now that I'm uncertain about the evidence, my theory finally gets supported." 

  The facilitator smiles sadly. "Welcome back, Bob. Remember, folks: certainty kills confirmation. The only agent who keeps learning is the one who keeps being wrong."
