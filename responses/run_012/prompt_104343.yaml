  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   *Core Setup:* $N$ voters, binary state of world $\theta \in \{0, 1\}$.
      *   *Competence:* $p_i = P(\text{vote}_i = \theta) > 0.5$.
      *   *Independence:* Votes are conditionally independent given $\theta$.
      *   *Result:* As $N \to \infty$, $P(\text{majority} = \theta) \to 1$.
      *   *Negative Corollary:* If $p_i < 0.5$, $P(\text{majority} = \theta) \to 0$.

  3.  **Translate to Statistical Vocabulary:**
      *   *State of World:* Fixed unknown parameter $\theta \in \{0, 1\}$ (or $\mathbb{R}$ if we generalize, but CJT is binary). Let's stick close to the prompt's request for "fixed but unknown parameter."
      *   *Voter:* An estimator $\hat{\theta}_i$.
      *   *Vote:* A discretized realization of the estimator.
      *   *Competence ($p > 0.5$):* Bias condition. If $\theta=1$, $E[\hat{\theta}_i] > 0.5$. It implies the signal dominates the noise.
      *   *Majority Rule:* Aggregation function (e.g., mean of votes thresholded, or median).
      *   *Consistency:* The aggregate estimator $\hat{\theta}_{agg}$ converges in probability to $\theta$ as $N \to \infty$.
      *   *Independence:* Zero covariance between error terms $\epsilon_i, \epsilon_j$.

  4.  **Drafting Part 1: What Carries Over (The "Easy" Translation):**
      *   *Consistency:* The CJT limit result ($P \to 1$) is exactly weak consistency of the aggregate estimator.
      *   *Competence > 0.5:* This is a signal-to-noise ratio condition. It ensures the bias is in the "correct direction." In estimation terms, the individual estimators are "informative."
      *   *Aggregation:* Averaging independent estimators reduces variance ($\sigma^2/N$). This is standard sampling theory.
      *   *Negative CJT:* If bias is in the wrong direction ($p < 0.5$), consistency converges to the wrong value (inconsistency).
      *   *Key Insight:* The "wisdom of crowds" is just the Law of Large Numbers applied to biased Bernoulli trials.

  5.  **Drafting Part 2: What Translates Under Pressure (The "Hard" Translation):**
      *   *Independence:* CJT assumes conditional independence. In stats, this is zero covariance *conditional on $\theta$*. But in social settings, common shocks (correlated errors) violate this. If $\text{Cov}(\epsilon_i, \epsilon_j) = \rho > 0$, variance doesn't vanish at $1/N$. It stalls at $\rho$. This breaks consistency.
      *   *Binary Competence vs. IRT:* CJT treats $p$ as a property of the voter. Statistics (IRT) treats probability of correctness as $f(\text{ability}_i, \text{difficulty}_j)$.
      *   *The Tension:* If competence is item-specific, there is no single $p$. The "fixed parameter" $\theta$ might not even exist in the same way (is it a single truth or a vector of truths?).
      *   *Conclusion:* CJT requires competence to be a marginal property of the voter averaged over the distribution of items. If difficulty varies wildly, the "average competence" might be $>0.5$ while specific items are $<0.5$. The theorem holds only in expectation over items, not necessarily for every specific decision. This distorts the "guarantee" of the theorem.

  6.  **Drafting Part 3: What Does Not Survive (The "Normative" Residue):**
      *   *The Gap:* Statistics deals with *accuracy* (loss functions). Political philosophy deals with *legitimacy* and *authority*.
