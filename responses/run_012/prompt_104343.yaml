      *   *Honesty Check:* I must admit that modeling $\theta$ as a fixed parameter assumes realism (there *is* a truth). Political philosophy often debates whether a "correct" political decision exists. The statistical model *presupposes* epistemic realism, which begs the question against constructivist or proceduralist democrats.

