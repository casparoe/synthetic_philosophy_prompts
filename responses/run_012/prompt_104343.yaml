      *   *Specific Prompt Requirement:* "Tell me which choice you made and what it costs." I need to explicitly state that I am treating the political question as an estimation problem, which assumes a mind-independent truth.

  8.  **Final Review against constraints:**
      *   Three parts? Yes.
      *   Vocabulary check (bias, variance, consistency, etc.)? Yes.
      *   Residue report format? Yes.
      *   Honest about translation direction? Yes.

  **(Self-Correction Note):** In Part 2, regarding IRT. If competence is person-item specific, the CJT limit theorem doesn't necessarily fail, but the *condition* for it becomes much harder to verify. It shifts from $p > 0.5$ to $E[p_{ij}] > 0.5$ plus constraints on the variance of difficulties. I need to be precise that the *guarantee* weakens.

  **(Self-Correction Note):** In Part 3, the prompt asks about "authority" and "binding." I need to highlight that an estimator has no authority; it just has a mean squared error. The move from "is likely true" to "ought to be obeyed" is the leap that statistics cannot bridge.

