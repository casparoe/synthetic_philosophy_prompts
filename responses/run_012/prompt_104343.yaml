answer: |-
  Here is the translation of the Condorcet Jury Theorem (CJT) into the vocabulary of statistical estimation and inference, followed by the requested residue report.

  ### The Statistical Restatement

  Let $\theta \in \{0, 1\}$ be a fixed, unknown parameter representing the state of the world. We observe a sample of size $N$, denoted $X_1, \dots, X_N$, where each $X_i$ is a binary estimator of $\theta$.

  We model each voter $i$ as generating an estimate according to:
  $$ X_i = \theta + \epsilon_i $$
  where $\epsilon_i$ is an error term taking values in $\{-1, 0, 1\}$, constrained such that $X_i \in \{0, 1\}$.

  **Competence:** The condition that voter $i$ is "competent" ($p_i > 0.5$) translates to a constraint on the bias of the estimator. Specifically, $E[X_i | \theta = 1] > 0.5$ and $E[X_i | \theta = 0] < 0.5$. This ensures the signal-to-noise ratio is positive; the estimator is informative.

  **Independence:** The errors $\epsilon_i$ are independent and identically distributed (i.i.d.) conditional on $\theta$. Thus, $\text{Cov}(\epsilon_i, \epsilon_j | \theta) = 0$ for $i \neq j$.

  **Aggregation:** The majority rule is the aggregate estimator $\hat{\theta}_N = \mathbb{I}(\frac{1}{N}\sum X_i > 0.5)$.

  **Theorem:** If the individual estimators satisfy the competence condition (positive directional bias) and the independence condition (zero error covariance), then $\hat{\theta}_N$ is a **consistent estimator** of $\theta$. That is, $\hat{\theta}_N \xrightarrow{p} \theta$ as $N \to \infty$. The asymptotic variance of the unthresholded mean $\bar{X}_N$ vanishes at rate $1/N$.

  **Negative Corollary:** If the competence condition is violated ($p_i < 0.5$), the bias is directional in the wrong sense. The aggregate estimator is inconsistent; it converges in probability to $1 - \theta$.

  ***

  ### Residue Report

  #### Part I: What Carries Over Without Strain

  In your vocabulary, the core mechanical engine of the CJT is simply the Law of Large Numbers applied to biased Bernoulli trials. Several claims translate directly into standard properties of aggregation:

  1.  **Consistency as Convergence:** The claim that "the group becomes increasingly likely to be correct" is precisely the definition of weak consistency. The probability limit of the aggregate estimator is the true parameter. There is no distortion here; social epistemology's "truth-tracking" is statistics' "consistency."
  2.  **Competence as Signal-to-Noise:** The requirement $p > 0.5$ is not a mysterious epistemic virtue but a signal-to-noise condition. It ensures that the expectation of the error term $E[\epsilon_i]$ does not overwhelm the signal $\theta$. In terms of the bias-variance tradeoff, CJT prioritizes reducing variance through aggregation, provided the bias is not so severe as to reverse the sign of the expectation.
  3.  **The Negative Twin:** The claim that incompetent groups become reliably wrong is simply the statement that an aggregate of estimators with consistent directional bias toward the wrong value will converge to that wrong value. It is the consistency of a misspecified model.
  4.  **Diminishing Marginal Returns:** The theorem's implication that adding voters helps less as $N$ grows is the standard $1/\sqrt{N}$ reduction in standard error. The "wisdom" is just the reduction of sampling variance.

  In this domain, the CJT is not a theorem about politics; it is a theorem about the asymptotic behavior of the sample mean under specific distributional assumptions.

  #### Part II: What Translates Only Under Pressure

  Here the mapping requires forcing assumptions that are standard in your classroom but contentious in the social context.

  1.  **Independence vs. Zero Covariance:**
      In your vocabulary, independence is $\text{Cov}(\epsilon_i, \epsilon_j) = 0$. In the jury theorem, this is often glossed as "voters think for themselves." But statistically, this requires that there are no common shocks. If voters share a news source, a cultural bias, or a systemic misunderstanding, $\text{Cov}(\epsilon_i, \epsilon_j) = \rho > 0$.
      *   *The Distortion:* If $\rho > 0$, the variance of the aggregate does not vanish as $N \to \infty$. It converges to $\rho$. The estimator is **not consistent**. The CJT collapses not because voters are incompetent, but because the design matrix implies clustered errors. To save the theorem, one must assume conditional independence given $\theta$, which presupposes that $\theta$ captures all common causes of correlation. This is a strong exogeneity assumption that political reality rarely satisfies.

  2.  **Fixed Competence vs. Item-Response Models:**
      The CJT treats competence $p$ as a property of the voter (a fixed effect). Your field often treats correctness as a function of person and item parameters (IRT): $P(X_{ij}=1) = f(\alpha_i, \beta_j)$, where $\alpha$ is ability and $\beta$ is difficulty.
      *   *The Pressure:* If competence is a person-item pair, there is no single $p$. There is a distribution of $p_{ij}$. The CJT conclusion (consistency) holds only if the *expected* competence over the distribution of items is $> 0.5$.
      *   *The Cost:* This destroys the theorem's guarantee for any *specific* decision. The theorem might hold in expectation over a legislative session, but fail for the specific bill on the floor (which might have high difficulty $\beta_j$). The CJT claims to justify specific outcomes; the IRT translation only justifies the long-run average performance of the body. The theorem quietly depends on competence being a fixed property of persons to guarantee truth on specific tokens, not just types.

  3.  **Discretization Loss:**
      You asked to treat the vote as a discretization of the estimate. In statistics, discretizing a continuous signal (confidence) into a binary vote (0/1) throws away information.
      *   *The Pressure:* The majority rule is an inefficient estimator compared to a weighted mean of confidence levels. The CJT defends majority rule, but from an efficiency standpoint, it defends a lossy compression of data. To make the theorem fit, we must assume voters *cannot* report variance or confidence, only point estimates. This is an assumption about the communication channel, not the epistemology.

  #### Part III: What Does Not Survive Translation

  This is the critical residue. The statistical vocabulary is descriptive and instrumental; the political vocabulary is normative and deontic. Three key concepts evaporate upon translation.

  1.  **Legitimacy and Authority:**
      In your vocabulary, an estimator has **risk** (expected loss), not authority. If $\hat{\theta}_N$ is consistent, it is *accurate*, not *binding*.
      *   *The Defect:* Statistics cannot represent the claim "the minority ought to obey the majority." It can only represent "the minority is likely incorrect." The move from *is likely false* to *ought not to rule* is a loss function choice (specifically, a 0-1 loss where being wrong costs 1 and being right costs 0). But political legitimacy often requires obedience even when the outcome is suboptimal, or when the loss function is disputed.
      *   *The Cost:* By translating "legitimacy" as "consistency," we reduce political obligation to epistemic utility. This begs the question against proceduralists who argue legitimacy comes from the process, not the truth of the outcome. The vocabulary cannot criticize the authority claim because it lacks the deontic operators to represent it.

  2.  **The "General Will" vs. The Parameter:**
      The CJT is often used to ground the Rousseauian "General Will"—the idea that the vote reveals a collective interest that exists independently of the vote.
      *   *The Defect:* In your vocabulary, $\theta$ is a **fixed unknown parameter**. This assumes epistemic realism: there is a mind-independent truth to be estimated.
      *   *The Cost:* This is a non-neutral rendering. Many political philosophers argue that for many political questions (e.g., "What is justice?"), $\theta$ does not exist prior to the aggregation. The vote *constructs* the truth; it does not estimate it. By modeling the problem as estimation, I have imported the assumption that a correct answer exists. This makes the statistical vocabulary incapable of criticizing the CJT on constructivist grounds. It treats the existence of $\theta$ as a premise, whereas in political theory, the existence of $\theta$ is the conclusion proponents hope to secure.

  3.  **Exchangeability and Equality:**
      The classical CJT assumes voters are exchangeable (or at least identically distributed in the simplest form).
      *   *The Defect:* In statistics, exchangeability is a convenience for deriving asymptotic properties. In political philosophy, "one person, one vote" is a moral claim about equality.
      *   *The Cost:* If we relax exchangeability to improve efficiency (e.g., weighting voters by their estimated $\alpha_i$ in an IRT model), we increase statistical accuracy but violate the normative constraint of political equality. The statistical vocabulary recommends weighting by inverse variance (optimal aggregation). The political vocabulary forbids it. The translation reveals that the CJT is only normatively attractive if we ignore the statistically optimal solution.

  **Conclusion on Direction of Translation:**
  I have chosen to model the political question as an estimation problem. This choice costs us the ability to see the political act as anything other than truth-seeking. It renders the "authority of majority rule" as merely the "efficiency of the sample mean."

  If the political philosophers are using the CJT to claim that majority rule is *morally* binding because it is *epistemically* reliable, the statistical translation exposes a category error. The vocabulary shows that reliability (consistency) does not entail bindingness (authority) unless one adopts a specific, contestable loss function that equates "wrong" with "illegitimate."

  Therefore, the defect is not in your vocabulary, but in the original claim. The CJT proponents are importing the normative force of "science" (estimation of truth) to justify "politics" (allocation of power), while your vocabulary forces them to admit that they are simply minimizing variance under strong, often unrealistic, assumptions about the data generating process. The residue is the realization that the theorem proves nothing about legitimacy, only about the asymptotic properties of a specific aggregator under conditions rarely met in the wild.
