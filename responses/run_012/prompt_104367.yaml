  Two rationalists are arguing over the last slice of pizza.

  Alice says, "My posterior says I should eat it."
  Bob says, "Mine says we split it."
  Alice says, "But we have the same information."
  Bob says, "Then our priors differ."
  Alice says, "But the Common Prior Assumption says they must be the same."
  Bob says, "Okay. What is it?"
  Alice says, "I… can't say. It's pre-evidence."
  Bob says, "So you can't prove it?"
  Alice says, "No. It's the thing you use to prove other things."
  Bob says, "Well, my prior says 'finders keepers.'"
  Alice says, "You can't just assert that!"
  Bob says, "Why not? You can't evidence a prior. So you can't evidence mine is wrong."
  Alice pauses.
  Bob leans in. "Besides, if we keep disagreeing, the theorem says one of us is irrational. Do you want it to be you?"
  Alice stares at the plate.
  Bob says, "Thought so. Pass it here."
