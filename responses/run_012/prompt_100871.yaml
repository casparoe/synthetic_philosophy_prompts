answer: |-
  ### Setting Selection

  I considered three ordinary settings: a hospital records office, a family's private papers, and a school administrative office. The hospital setting risks drifting into technical jargon that mimics code, while family papers rely too heavily on specific interpersonal intentions that obscure the structural layers. I select the **school administrative office** because it offers standardized document types (layers), frequent machine production (non-intentional sources), and clear distinctions between official records and informal notes.

  ### The Four-Part Case

  **(1) Identical-Carrier Case**
  An automated billing system prints the string "Balance Zero" on official school letterhead, which administration accepts as a receipt of payment. The same system prints the identical string on an internal diagnostic log sheet, which technicians interpret as a sensor error code. The ink marks are identical, but the document type fixes whether the string asserts a financial state or a hardware status.

  **(2) Empty-Carrier Case**
  A standardized form labeled "State Proficiency Certified" arrives with the numerical score section completely obliterated by a coffee spill. The family knows the child passed because the form type itself asserts certification regardless of the specific data field. The outer layer carries the verdict even though the inner data carrier is destroyed.

  **(3) Orphan-Carrier Case**
  A strip of thermal paper reading "Cancel Class Today" is found loose in a hallway without letterhead, signature, or date. Without the framing context of authority, it is indeterminate whether this is an order from the principal, a request from a teacher, or a prank by a student. The string alone cannot fix the speech act or the proposition's truth conditions.

  **(4) Counter-Case**
  A standard interoffice memo form contains the sentence "The heating system is non-functional," which is understood solely by its lexical content. The memo header identifies it as internal communication but adds no semantic value to the claim about the heating system. The layer facilitates transmission but does not alter the proposition expressed.

  ### Demonstration and Analysis

  **Part 1: Identical-Carrier**
  *   **Content:** In the first instance, the content is "The account is settled"; in the second, it is "Sensor 4 reads null."
  *   **Location:** The content is located in the **Outer Layer**.
  *   **Working Layer:** The **Outer Layer** does the work. The Frame Layer merely announces a message exists in both cases, and the Inner Layer is numerically identical. The difference in meaning arises solely because the letterhead versus the log sheet specifies a different decoding scheme and institutional status.

  **Part 2: Empty-Carrier**
  *   **Content:** The content is "The student has met the proficiency standard."
  *   **Location:** The content is located in the **Outer Layer**.
  *   **Working Layer:** The **Outer Layer** does the work. The Inner Layer is physically absent, and the Producer's intention is inaccessible (and irrelevant given the accident). The Frame Layer establishes this as a message, but the specific assertion is carried by the form type itself, which functions as a performative declaration independent of the variable data.

  **Part 3: Orphan-Carrier**
  *   **Content:** The content is indeterminate; it is unclear if the proposition is "Classes are cancelled" (assertion) or "Please cancel classes" (request).
  *   **Location:** The content is **nowhere fixed**.
  *   **Working Layer:** The **Frame and Outer Layers** are missing. The Inner Layer is present but semantically inert without the Outer Layer to assign illocutionary force. This demonstrates that the Inner Layer cannot sustain determinate meaning alone when the normative context is stripped away.

  **Part 4: Counter-Case**
  *   **Content:** The content is "The heating system is non-functional."
  *   **Location:** The content is located in the **Inner Layer**.
  *   **Working Layer:** The **Inner Layer** does the work. Here, the Outer Layer is fully present and known but contributes only to the transmission protocol, not the truth conditions. This marks the limit of the thesis: the layer fixes the *status* of the message, but when the status is neutral, the lexical content carries the proposition.

  ### The Heavy Lifting Feature

  The single feature doing the heavy lifting across this set is the **conventional normative status conferred by the Outer Layer**. This is not merely the physical paper or format, but the social institution that attaches specific speech-act powers (asserting, ordering, certifying) to that format.

  If this feature is removed—if document types carry no conventional authority—then Part 1 collapses into ambiguity (both strings are just marks), Part 2 loses its determinate content (the form is just paper), and Part 3 remains indeterminate (as it is). Only Part 4 survives intact, because it relies on lexical semantics rather than institutional force. The thought experiment demonstrates that while lexical meaning resides in the Inner Layer, *communicative* meaning (what is done with the string) resides in the Outer Layer.

  ### Opponent Attacks

  A defender of **producer's intention** would attack Part 1 by arguing that the machine's designers intended the letterhead output to be a receipt and the log output to be a diagnostic, so intention still fixes the meaning. They would attack Part 3 by claiming the indeterminacy is merely epistemic; if we knew the finder's assumption of the producer's intent, the meaning would be fixed. They fail to see that in Part 2, the intention is irrelevant to the validity of the certification carried by the form itself.

  A defender of **receiver's construction** would attack Part 1 by claiming the administration and technicians simply *construct* different meanings based on context, so the layer is just a cue for the receiver. They would attack Part 3 by arguing that meaning is always created by the reader, so the indeterminacy is just a failure of the reader to commit to an interpretation. They fail to account for Part 2, where the content is determinate before the receiver constructs anything, forced by the external constraint of the form type.

  ### Self-Critique and Vulnerability

  My reasoning is most likely to fail in cases where the Outer Layer is present but systematically ignored or subverted by context. If a principal writes "You are fired" on a napkin, the Outer Layer (napkin) suggests informality, yet the intention and reception fix the meaning as a definitive termination. This suggests the layer is not constitutive of meaning but merely evidential.

  I would be moved to relocate meaning away from the layer if it could be demonstrated that the layer's normative status is itself nothing more than a aggregated history of receiver expectations. If the "authority" of the letterhead is reducible entirely to the receiver's belief that the producer intends it to be authoritative, then the layer collapses back into intention and construction, leaving no independent work for the layer itself. Until that reduction is proven, however, the layer remains the only stable locus for public meaning.
