answer: |-
  (1) 'The move in plain terms'
  The move argues that unequal probabilities can be derived by mathematically decomposing larger amplitude components into multiple equal-amplitude sub-components. It then applies a principle of indifference to count these sub-branches as equally likely outcomes.

  (2) 'Nearest existing names'
  The closest standard label is **the Counting Problem**, which questions why rational agents should care about branch counts rather than amplitudes. However, your specific snag targets the metaphysics underlying that count, often discussed under **branch individuation**. David Wallace labels the assumption required to block your objection **Branching Indifference**: the axiom that an agent should be indifferent to branching structure that doesn't affect payoffs. Some critics, like Adrian Kent, frame this as the **ill-definedness of branch number**, noting that decoherence yields a continuum, not discrete integers. While the **Preferred Basis Problem** asks *which* states define branches, your worry asks *how many* exist within that basis. The move itself is sometimes called the **equal-weight decomposition** or **fine-graining argument**, originating in Everett's original work where he approximated irrational amplitudes with rationals to invoke classical probability. This technical maneuver is central to early Everettian derivations. None of these names perfectly isolate the arbitrariness of the *carving* itself, but 'Counting Problem' is the broader umbrella most textbooks use, even if it often conflates the probability justification with the individuation issue you've spotted.

  (3) 'Where they don't fit'
  The **Preferred Basis Problem** is distinct because it concerns the *orientation* of the split (e.g., spin-z vs. spin-x), whereas your snag concerns the *granularity* of the split within a fixed basis. You can have a perfectly defined preferred basis and still face this arbitrariness; knowing the branches are 'up' and 'down' doesn't tell you if 'up' is one world or a million superposed sub-worlds. The general **Incoherence Problem** asks how probability makes sense if all outcomes occur, but your objection accepts the setup and attacks the *derivation* method. Even 'The Counting Problem' is slightly off-target because it usually asks why we should count branches *at all* rather than weight them. Your point is sharper: even if we *did* count, the number is gerrymanderable. This reveals that branches lack the discrete ontological status required for counting. In decision-theoretic approaches (Wallace), this is bypassed by axioms rather than solved by ontology; they stipulate agents shouldn't care about branching structure. But your snag highlights that without such stipulations, the 'equal-weight decomposition' is mathematically legitimate but physically unmotivated. It shows that branch number is not an observable quantity in Hilbert space. Consequently, any argument relying on integer counts of branches assumes a discrete ontology that decoherence theory does not provide. Decoherence yields a fuzzy continuum of histories, not sharp integers. This makes the move question-begging: it assumes the discreteness needed to get the probabilities it seeks to derive. The snag is thus ontological, not merely probabilistic. It exposes that 'worlds' are not fundamental particles you can tally, but emergent patterns whose boundaries are interest-relative. Therefore, the move fails unless supplemented by a principle that fixes the granularity, which standard MWI lacks.

  (4) 'Verdict'
  I'd label this **The Branch Individuation Problem**. It is the objection that branch counts are arbitrary because decomposition into sub-branches is continuous and non-unique. Unlike the Preferred Basis Problem (which asks *which* states define reality), this asks *how many* entities exist within those states. It marks the boundary where naive counting fails and decision-theoretic axioms (like Branching Indifference) must take over to save the derivation.
