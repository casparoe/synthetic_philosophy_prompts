answer: |-
  Your friend is wrong, but not for the reason you might hope. It is not a merely verbal dispute, because the stakes are not about dictionary definitions; they are about **explanatory license**. When a physiologist says "the function of the spleen is X," they are licensing a specific set inferences about what happens if you remove it. When an evolutionary biologist says "the function of the spleen is X," they are licensing inferences about why it persists despite costs. These are different licenses. If you unify the definitions, you risk granting the wrong license in the wrong context.

  Here is the diagnosis of the deadlock, the hidden question driving it, and the honest truth about progress.

  ### 1. The Diagnosis: Explanatory Goals, Not Semantics
  This is not a disagreement about what the word "function" means in English, nor is it purely about bedrock intuition. It is a disagreement about **which explanatory project is primary in biology.**

  *   **The Etiological (Historical) Camp** treats biology primarily as a **historical science**. Their core *explanandum* is: "Why is this trait here rather than absent?" To answer this, you need selection. Consequently, "function" must be tied to the history that explains the trait's presence. This account wins on **normativity**. It explains why a heart that pumps sand is *broken* (failing its selected effect) rather than just *different*.
  *   **The Causal Role (Systemic) Camp** treats biology primarily as a **mechanistic science**. Their core *explanandum* is: "How does this system work right now?" To answer this, you need current causal contributions. This account wins on **novelty and capacity**. It explains how a new mutation, an engineered organ, or a co-opted trait (exaptation) can have a function before selection has had time to act on it.

  The deadlock exists because biology *is both* a historical and a mechanistic science. The philosophical stalemate mirrors a genuine tension in the scientific practice. You feel stuck because you are bouncing between the two legitimate faces of the discipline.

  ### 2. The Data Disagreement
  You asked if they are disagreeing about which cases count as data. **Yes.** This is a major source of the impasse. Each side treats the other's "hard cases" as category errors.

  *   **For the Etiological theorist,** the "brand-new trait" is not a counter-example; it is a trait that *literally has no function yet*. It is a proto-function. They are willing to bite that bullet because preserving the link between function and normativity (malfunction) is more important to their project.
  *   **For the Causal Role theorist,** the "malfunctioning heart" is not a counter-example; it is a trait that *has the function of pumping blood but is failing to do so*. They distinguish function (the capacity) from performance. They are willing to bite the bullet that a heart pumping sand still has the "function" of pumping sand (as a capacity it is supposed to have in the model), even if it isn't doing it.

  They aren't looking at the same world and disagreeing; they are carving the world differently to serve different explanatory masters. The Etiological camp prioritizes the **adaptationist data** (why traits persist). The Causal Role camp prioritizes the **physiological data** (how systems operate).

  ### 3. The Hidden Conceptual Question
  You suspected a hidden question is doing the real work. It is this: **Can normativity be naturalized without history?**

  Both camps want "function" to do normative work (to distinguish use from misuse, health from disease).
  *   The **Etiological camp** says: No. The only way to say a trait *ought* to do X without invoking a designer is to say it was *chosen* to do X. History underwrites the norm.
  *   The **Causal Role camp** implies: Yes. The organization of the system itself underwrites the norm. If the system collapses without the trait doing X, then the trait *should* do X.

  The deep philosophical friction is whether **current organizational closure** (the idea that living systems are self-maintaining networks) is enough to ground "proper function," or if you strictly need the **filter of selection**.

  There is a second hidden question: **The "First Step" Problem.** The Etiological account struggles to explain the function of the *very first* heart. If function requires selection history, the first heart had no function until the second generation. This seems absurd to a physiologist. The Causal Role account handles this easily but loses the ability to call the first heart "broken" if it fails to pump, unless you invoke the system's viability.

  ### 4. Prospects for Progress
  You want to know what counts as progress. Here is the honest assessment.

  **What will NOT happen:**
  *   **A Knockout Argument:** One side will not prove the other wrong. The phenomena they explain are too distinct.
  *   **A Unified Definition:** There will be no single definition of "function" that captures both the normativity of evolution and the immediacy of physiology without becoming so vague it is useless.

  **What COUNTS as Progress:**
  Progress in this literature has shifted from **Conceptual Monism** (finding the *one true definition*) to **Pragmatic Pluralism** (mapping definitions to explanatory contexts).

  1.  **Disambiguation as Methodology:** Progress is achieved when biologists explicitly state which concept they are using. If you are modeling a metabolic pathway, you are using Causal Role. If you are comparing homologous traits across species, you are using Etiological. The progress is the *awareness* that switching labs requires switching conceptual tools.
  2.  **Organizational Accounts:** There is a third camp emerging (Mossio, Saborido, Moreno) attempting to ground normativity in **self-maintenance** rather than history. They argue that a trait's function is its contribution to the self-maintenance of the organization that produces it. This attempts to give you normativity *without* history (solving the "first heart" problem) while keeping the "malfunction" intuition. This is where the actual philosophical work is happening now. It hasn't won, but it's the only live attempt to bridge the gap.
  3.  **Formalizing the Context:** Progress looks like formal conditions for when to apply which account. For example: "Use Etiological accounts when the cost of the trait is high (requiring selection explanation). Use Causal Role accounts when the trait is new or the system is engineered."

  ### Summary
  Your friend says it's a verbal dispute that should dissolve. It shouldn't, because the word "function" is a **theoretical term**, not a natural kind label. It carries theoretical baggage.

  The disagreement is **real** because it reflects a dual nature in biology itself. Biology explains how organisms work (mechanism) and why they are here (history). As long as biology has these two distinct explanatory goals, "function" will fracture.

  **Progress is not resolving the tension; it is managing it.** The goal is not to find the One True Function, but to stop trying to force the Evolutionary concept to do Physiological work and vice versa. If you leave the philosophy with the conviction that you need two distinct tools in your kit, and the criteria for when to pick each, you have extracted the maximum value the literature can offer.
