prompt: |-
  I'm a reporter on the science desk and I've got a mess I need help thinking through before our 4pm news meeting, so apologies in advance for the length.

  I've been covering a mid-sized biotech's phase 2 trial. Two participants had a serious reaction back in the spring. My question to the company was simple: did you know about those reactions before you enrolled the rest of the cohort? I emailed their comms person and got back: "Every event in this trial has been reported in accordance with all applicable requirements, and the trial remains open." I wrote back saying that's not my question — are you telling me the reports went in before the later enrollments, or are you declining to answer? Crickets. A few days later on a call, their VP of comms said they weren't going to "litigate the timeline" and changed the subject.

  So the story ran with the line that the company acknowledged the reactions were reported only after more patients were enrolled. It got picked up alot. Now their lawyers want a correction, arguing the statement was accurate and that we put a confession in their mouth. Privately I think they knew exactly what they were doing — that sentence was built to be deniable.

  Two things are chewing at me. First, my desk has a rule of thumb I've never trusted: if the speaker could have tacked on "but I'm not saying anything about the timing" without contradicting himself, then the timing claim wasn't part of what he said, it was my inference, not his statement. That test feels backwards to me — the most deliberate evasions are exactly the ones you *can* tack that clause onto. Second, and this is the part that keeps me up: I had an internal email suggesting the safety report was drafted late. So I may have heard his sentence as an admission because I already believed it was true.

  What I need by 4: should we run a correction, a clarification, or stand by the story? And in the follow-up, what am I actually allowed to say about them — that they declined to answer, that they misled people, or nothing at all? And please tell me what the real rule should be, because "the tack-on test" is going to get somebody fired one of these days. Keep it usable — I have to say this out loud to a room of editors who will roll their eyes at anything that sounds like a seminar.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Situation:**
      *   **User:** Science desk reporter.
      *   **Context:** Preparing for a 4pm news meeting (urgent, high stakes).
      *   **Problem:** A biotech company is demanding a correction regarding a story about safety reactions in a Phase 2 trial. The core issue is whether the company admitted to knowing about reactions *before* enrolling more patients, or if the reporter inferred that from an evasive statement.
      *   **Key Evidence:**
          *   Reporter asked: "Did you know before enrolling the rest?"
          *   Company replied: "Every event... reported in accordance with all applicable requirements, and the trial remains open."
          *   Reporter followed up: "Is that a yes on timing or a decline to answer?" -> Crickets.
          *   VP Comms call: Won't "litigate the timeline."
          *   Story ran: "Company acknowledged the reactions were reported only after more patients were enrolled."
          *   Lawyers now say: That's a confession we didn't make.
          *   Internal Intel: Reporter has an email suggesting the safety report was drafted late (supports the reporter's hunch, but isn't public proof).
      *   **Internal Conflict:** The newsroom uses a "tack-on test" (if you can add "but I'm not saying X" without contradiction, you didn't say X). The reporter thinks this test is flawed for evasive language. The reporter also worries about confirmation bias (interpreting the quote as an admission because of the internal email).
      *   **Deliverable:** Actionable advice for the 4pm meeting (Correction? Clarification? Stand firm?), guidance on what can be said in follow-up (declined to answer? misled?), and a better heuristic than the "tack-on test."
      *   **Tone:** Professional, urgent, practical, newsroom-savvy (no academic seminars).

  2.  **Deconstruct the Journalism Ethics/Legal Issue:**
      *   **The Quote vs. The Interpretation:** The company said, "Every event... reported in accordance with all applicable requirements." They did *not* explicitly say, "We reported these specific events before enrolling the next patients."
      *   **The Story's Claim:** The story said the company *acknowledged* the reactions were reported *only after* more patients were enrolled.
      *   **The Gap:** "Reported in accordance with requirements" does not necessarily mean "reported after enrollment." Regulations often allow a certain window (e.g., 7 days, 15 days) for reporting serious adverse events. If they enrolled Patient B on Day 3 and reported the Event from Patient A on Day 7, they are compliant, but the enrollment happened before the report.
      *   **The Lawyer's Point:** They have a strong technical argument. They didn't admit the timing. The reporter *inferred* the timing based on their silence/evasiveness.
      *   **The Reporter's Point:** The evasiveness *is* the story. In investigative journalism, "no comment" or "we follow rules" when asked "did you break rules/timeline" is often treated as a confirmation of the negative. But stating it as a direct *acknowledgement* is risky.

  3.  **Evaluate the "Tack-On Test":**
      *   The newsroom rule: If I can add "but I'm not saying X" and it still makes sense, I didn't say X.
      *   Reporter's critique: Evasive statements are designed to pass this test.
      *   Reality: The test is actually a good legal shield, but a bad journalistic compass. It protects against libel but encourages "both-sidesism" where power hides behind semantics.
      *   Better Heuristic: "The Reasonable Reader Standard" combined with "Attribution of Inference." Did the *words* say it, or did the *context* imply it? If the latter, attribute the conclusion to the reporting, not the source.

  4.  **Formulate Recommendations:**

      *   **Decision (Correction vs. Clarification vs. Stand):**
          *   *Stand:* Risky. The specific phrasing "acknowledged... were reported only after" implies a direct admission. The lawyers can prove they didn't use those words.
          *   *Correction:* Implies the facts were wrong. The *fact* (that reporting happened after enrollment) might be true, but the *attribution* (that the company admitted it) is the weak point.
          *   *Clarification/Editor's Note:* Best path. It fixes the attribution without conceding the underlying truth. Change "Company acknowledged" to "Company declined to confirm timing, stating only that reports met requirements."
          *   *Why:* It protects the outlet from libel (you aren't claiming they said what they didn't) while maintaining the pressure (highlighting their refusal to answer).

      *   **Follow-up Language:**
          *   *Can we say they misled?* Only if you can prove intent. Hard to do.
          *   *Can we say they declined to answer?* Yes. This is factual. "When asked specifically about the timeline, the VP stated..."
          *   *Can we mention the internal email?* No. Not unless you can publish it. It's hearsay/anonymous source material that doesn't hold up in a correction context.
          *   *Best phrasing:* "The company did not directly answer whether reports were filed before subsequent enrollments."

      *   **The "Real Rule" (Heuristic):**
          *   Ditch the "Tack-On Test."
          *   Adopt: "Separate Observation from Attribution."
          *   If the source says A, and you conclude B, write "Source said A, which indicates B" OR "Source said A. Documents show B." Do not write "Source admitted B."
          *   *Newsroom speak:* "Don't put the conclusion in the quote. Put the conclusion in the narrative, backed by the silence."

  5.  **Drafting the Response:**
      *   *Tone:* Direct, empathetic to the deadline, authoritative but collaborative.
      *   *Structure:*
          1.  Immediate Verdict (for the 4pm meeting).
          2.  The Wording (how to fix it).
          3.  The Follow-up (what you can write next).
          4.  The Rule (replacing the tack-on test).
      *   *Refinement:* Make sure to distinguish between "Correction" (we got facts wrong) and "Clarification" (we need to be more precise about who said what). In many newsrooms, these are distinct. A clarification is safer here.
      *   *Addressing the Internal Email:* Warn strongly against using this to justify the story publicly. It's a conflict of interest/bias trap.

  6.  **Self-Correction/Review during drafting:**
      *   *Wait, did the reporter say the company acknowledged the reactions were reported AFTER?* Yes. "acknowledged the reactions were reported only after more patients were enrolled."
      *   *Did the company say that?* No. They said "reported in accordance with requirements."
      *   *Is the reporter's underlying fact true?* Maybe. But the *attribution* is the liability.
      *   *Advice:* Move the claim from "Company Acknowledged" to "Company Declined to Specify." This shifts the burden. It makes the *silence* the news, not the *admission*.
      *   *Newsroom Dynamics:* Editors hate "we stand by it" if legal is nervous. They hate "correction" if the reporter thinks they're right. "Clarification" is the compromise.
      *   *The "Tack-On Test":* Validate the reporter's instinct (it's flawed for PR speak) but offer a practical replacement that satisfies legal.

  7.  **Final Polish:** Ensure it sounds like a senior editor talking to a reporter. Short sentences. Clear headers. Actionable bullets. (Proceed to generate output).

  *(Self-Correction on the "Internal Email"):* I need to be careful not to tell them to ignore the email, but to recognize it as potential bias. The advice should be: "You can't use the email to defend the quote, but you can use the *pattern of behavior* to justify the follow-up story."

  *(Refining the "Rule"):* The "Tack-On Test" is essentially a logical negation test. The reporter is right that PR spin is designed to pass it. The better rule is "The Attribution Boundary." Did the *words* convey the meaning, or did the *context*? If context, attribute the meaning to the reporter, not the source.

  *(Final check on deadline):* Keep it tight. They have until 4pm.

  *(Let's write it.)*
answer: |-
  Here is the briefing you need for the 4pm meeting. It cuts through the semantics and focuses on liability, accuracy, and the next angle.

  ### 1. The Verdict: Run a Clarification, Not a Correction
  **Do not stand by the current phrasing.** Your lawyers are right on the narrow point: the company did not *acknowledge* the timing. They acknowledged *compliance*. Those are different things. A compliant report can still be filed after new enrollment if the regulation window allows it.

  **Do not run a full Correction.** A correction implies the underlying fact (that reporting happened after enrollment) is false. You don't know that for sure, and your internal email suggests it might be true.

  **Run a Clarification (or Editor's Note).**
  *   **The Fix:** Change the attribution, not the timeline.
  *   **Old Phrasing:** "The company acknowledged the reactions were reported only after more patients were enrolled."
  *   **New Phrasing:** "The company stated all events were reported in accordance with requirements. When asked specifically if reports were filed prior to subsequent enrollments, the company declined to provide a timeline."
  *   **Why:** This removes the libel risk (you aren't putting words in their mouth) while keeping the pressure on (highlighting their refusal to answer). It turns their evasion into the story, which is stronger journalism anyway.

  ### 2. The Follow-Up: What You Can Say
  You are safe to report on their **conduct**, just not their **intent**.

  *   **✅ "Declined to answer":** This is factual. You have the email trail and the call log. "The company declined to specify whether safety reports were filed before the cohort expanded."
  *   **✅ "Did not dispute":** If they haven't denied the timeline in their legal letter, you can say: "The company's legal challenge focused on the attribution of the statement, not the timeline of events themselves." (Only if true).
  *   **❌ "Misled":** Avoid this unless you have a smoking gun. It implies intent, which is hard to prove and easy to litigate.
  *   **❌ The Internal Email:** Do **not** mention the internal email suggesting the report was drafted late. That is your private knowledge. Using it to justify the public story now looks like confirmation bias. Keep it in your back pocket to guide your next investigation, not to defend the last one.

  ### 3. The Real Rule (Replace the "Tack-On Test")
  Your instinct is right: the "tack-on test" is a logician's tool, not a journalist's. PR firms write statements specifically to pass that test. It protects the newsroom from libel, but it allows sources to hide behind semantic shields.

  **Adopt the "Attribution Boundary" Rule:**
  > *If the meaning relies on what the speaker **didn't** say, the conclusion belongs to the reporter, not the source.*

  *   **Wrong:** "Smith acknowledged the funds were missing." (When Smith said "We are reviewing the accounts.")
  *   **Right:** "Smith said the accounts are under review. He did not confirm when the funds went missing."
  *   **Right:** "Smith said the accounts are under review, a standard response when discrepancies are found."

  **For your meeting:** Tell your editors, *"The 'Tack-On Test' protects us from lawsuits, but it lets sources lie by omission. The 'Attribution Boundary' keeps us accurate. We inferred the timing from their silence. We should own that inference in the text, rather than attributing the conclusion to their quote."*

  ### Summary for the Meeting
  1.  **Action:** Issue a Clarification. We attributed a conclusion to them that they didn't explicitly state.
  2.  **Narrative:** We aren't walking back the safety concern; we are tightening the attribution. Their refusal to answer the timeline is now the lead.
  3.  **Policy:** We are retiring the "Tack-On Test." It fails against professional evasion. We now separate *Quote* (what they said) from *Reporting* (what it implies).

  This gets you out of legal jeopardy, keeps the story alive, and fixes the newsroom heuristic without sounding like a philosophy seminar. Good luck at 4pm.
