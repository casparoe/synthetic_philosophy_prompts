answer: |-
  This is a classic application of the **Dogmatism Paradox** (Kripke/Harman). The paradox states: *If I know $P$, I know that any evidence against $P$ is misleading. Therefore, I am entitled to ignore any evidence against $P$.*

  The epistemological solution is **Defeasibility Theory**. Knowledge isn't a locked vault; it's a status that can be lost if "defeaters" appear. There are two types of defeaters you need to distinguish:
  1.  **Rebutting Defeaters:** Evidence that suggests the claim is *false* (e.g., a study showing MMR *does* cause autism).
  2.  **Undercutting Defeaters:** Evidence that suggests your *reasons* for believing the claim are flawed, even if the claim remains true (e.g., a study showing the CDC data you relied on was massaged, even if MMR still doesn't cause autism).

  Your hunch is correct: **Undercutting defeaters are the danger zone.** You can ignore a bad rebutting defeater (junk science). You cannot ignore an undercutting defeater (shaky grounds), because if your justification collapses, you no longer *know* the claim, you just *believe* it.

  Here is the **Defeater Check Protocol**. It is designed for a 60-minute window.

  ***

  ### The Defeater Check Protocol (60 Minutes)

  **Pre-Condition:** This protocol applies *only* to claims already on your "Settled List." If the claim is not on the list, use standard reporting triage.

  #### Step 1: Classify the Threat (5 Minutes)
  Read the abstract/executive summary of the new evidence. Determine what kind of attack this is on your settled claim ($P$).

  *   **Type A (Rebutting):** The evidence concludes $\neg P$ (e.g., "We found fraud in the 2020 election").
  *   **Type B (Undercutting):** The evidence concludes "The basis for believing $P$ is flawed" (e.g., "The studies proving election security relied on incomplete data").
  *   **Type C (Irrelevant):** The evidence is about $P$ but does not challenge truth or justification (e.g., "Autism rates are rising" — doesn't challenge vaccine causation).

  **Action:**
  *   If **Type C**: File quietly. Stop.
  *   If **Type A or B**: Proceed to Step 2.

  `[⚠️ JUDGMENT CALL]`: Distinguishing Type A from Type B can be tricky. Authors often frame an undercutting attack as a rebutting one to get attention. Look at the *methods*, not the press release. If they didn't actually measure the outcome, but attacked the prior measurements, it's Type B.

  #### Step 2: The Methodological Filter (15 Minutes)
  Assess the quality of the *new* evidence. You are not assessing the truth of $P$ yet; you are assessing the quality of the *challenge*.

  *   **Check 1:** Is the sample size/methodology consistent with the consensus standard that established $P$?
  *   **Check 2:** Has this been peer-reviewed or replicated? (If pre-print, downgrade confidence).
  *   **Check 3:** Is there a clear conflict of interest or funding source that biases the design?

  **Action:**
  *   **If "Junk" (Fails 2+ checks):** This is a **Misleading Defeater**. You are epistemically entitled to dismiss it. File quietly. Stop.
  *   **If "Robust" (Passes 2+ checks):** This is a **Prima Facie Defeater**. It *looks* like it defeats your knowledge. Proceed to Step 3.
  *   **If "Mixed/Unclear":** Proceed to Step 3 (Treat as potentially robust to be safe).

  `[⚠️ JUDGMENT CALL]`: "Junk" vs. "Robust" is not binary. In this 15-minute window, you are looking for *fatal* flaws, not nitpicks. If you have to squint to find the flaw, treat it as Robust.

  #### Step 3: The "Shaky Grounds" Audit (20 Minutes)
  **This is the critical step for your "Nasty Case."** Even if the new study is weak (Step 2), does it reveal that *your* original reasons for $P$ were weaker than you admitted?

  Ask: *If this new study had come out 5 years ago, would we have been comfortable putting $P$ on the Settled List?*

  *   **Scenario 1 (Strong Grounds):** Your belief in $P$ rests on multiple independent lines of evidence (meta-analyses, physical evidence, cross-party verification). The new evidence attacks only one minor pillar.
      *   *Result:* Justification holds.
  *   **Scenario 2 (Shaky Grounds):** Your belief in $P$ rests on a single institution's word, a single dataset, or a consensus that was reached hastily. The new evidence highlights that dependency.
      *   *Result:* Justification is **Undercut**. You may still believe $P$ is true, but you no longer *know* it in the strict sense required for the "Settled List."

  **Action:**
  *   If **Scenario 1**: Proceed to Step 4.
  *   If **Scenario 2**: **ESCALATE.** You must engage publicly or re-categorize the claim. You cannot file this quietly.

  `[⚠️ JUDGMENT CALL]`: This requires historical memory of *why* the claim is settled. If you (the senior) aren't available, the juniors must flag this for you. This is where "vibes" usually enter; force them to write down the *original justification* in one sentence to make it concrete.

  #### Step 4: The Stakes Test (10 Minutes)
  Epistemology meets Pragmatism. Even if your justification holds (Step 3), what is the cost of being wrong?

  *   **High Stakes:** Public health, violence risk, democratic stability.
  *   **Low Stakes:** Celebrity gossip, minor policy details.

  **Action:**
  *   **High Stakes + Robust Defeater:** Public response required (debunking or nuance).
  *   **High Stakes + Shaky Grounds (from Step 3):** Public response required (acknowledging complexity/uncertainty).
  *   **Low Stakes:** Can often be filed quietly even with a Robust Defeater, provided the claim isn't actively being used to harm.

  `[⚠️ JUDGMENT CALL]`: Defining "Harm." This is an ethical call, not an epistemic one. If the claim is being weaponized by bad actors, the threshold for "engage" lowers.

  #### Step 5: Final Disposition (10 Minutes)
  Select one of the three outputs:

  1.  **Quiet File:** Evidence is misleading (Step 2) AND grounds are strong (Step 3).
  2.  **Public Response:** Evidence is robust (Step 2) OR grounds are shaky (Step 3). *Note: Response can be "This study is flawed" OR "This issue is more complex than previously stated."*
  3.  **Escalate to Senior:** Step 3 yielded "Shaky Grounds" or Step 4 yielded "High Stakes/Unclear."

  ***

  ### Where This Procedure Breaks (The Honest Bit)

  You asked me to be straight about where the procedure runs out. Here are the three failure points you need to own as the senior:

  **1. The "True but Unjustified" Gap**
  Epistemology distinguishes *Truth* from *Justification*. Step 3 forces you to engage if justification is shaky, even if the claim is likely true.
  *   *The Limit:* The procedure tells you to **engage**, but it cannot tell you **what to say**. Do you publish a correction? A nuance piece? A "still true, but for different reasons" explainer? That is an editorial call, not a philosophical one. The procedure flags the wound; you have to stitch it.

  **2. The Consensus Trap**
  This protocol assumes you can identify "consensus standard" methodology in Step 2.
  *   *The Limit:* In polarized environments (like the 2020 election), there is no neutral consensus on methodology. One side's "robust" is the other side's "junk." The procedure will flag this as a **Judgment Call**, but ultimately, *you* have to decide which epistemic community your newsroom trusts. That is a political/ethical stance, not a procedural one.

  **3. The Time/Depth Trade-off**
  *   *The Limit:* Real defeasibility analysis often takes weeks, not 20 minutes (Step 3). If a "Shaky Grounds" issue is flagged, the 1-hour clock must stop. You cannot run this protocol to completion on a high-risk undercutting defeater. The procedure's output in that case must be "Stop the Clock, Senior Review."

  ### Summary for your Juniors

  *   **Junk Study + Strong Grounds** = Ignore. (You aren't being dogmatic; you're filtering noise).
  *   **Good Study + Strong Grounds** = Engage/Debunk. (The claim survives, but needs defense).
  *   **Weak Study + Shaky Grounds** = **ENGAGE.** (This is the trap. You must admit your original reasons were weak, even if you stand by the claim).
  *   **Good Study + Shaky Grounds** = Escalate/Senior Call. (The claim might be false, or at least no longer "Settled").

  **The Golden Rule:** You are never entitled to ignore evidence that attacks your *reasons*, only evidence that attacks the *fact* and fails basic quality control. Truth is stubborn; justification is fragile. Protect the justification.
