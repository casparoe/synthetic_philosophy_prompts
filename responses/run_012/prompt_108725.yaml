          *   Address specific misconceptions (accelerationism, end of history).
          *   Address the Pascal's Wager/Mugging objection (concede or deny?).
          *   Emphasize *leverage* (fraction of influence) over *drama/significance*.
          *   Deliberate omissions + signaling.
          *   Closing question/task (tests structural grasp, not just awe).
          *   British English.

  2.  **Deconstruct the Audience & Challenge:**
      *   Historians hate "specialness." They know every generation thinks they are special.
      *   They hate teleology (Whig history). HoH can sound like "history is leading to us."
      *   They hate presentism. HoH is inherently present-focused.
      *   *Strategy:* Frame HoH not as a claim about *importance* (vanity) but about *contingency* and *tractability* (structural conditions). Use their own tools (counterfactuals, path dependence) to sell it.

  3.  **Select the Case Study:**
      *   Constraint: No AI, No Nukes. Must be historical.
      *   Requirement: Must illustrate high leverage (small action, huge long-run consequence) without implying inevitability.
      *   Idea 1: The Industrial Revolution? (Too broad, too Whiggish).
      *   Idea 2: The Fall of Rome? (Too deterministic).
      *   Idea 3: The 1919 Paris Peace Conference? (Good, specific, high contingency).
      *   Idea 4: The invention of the Haber-Bosch process? (Good, tangible, global impact).
      *   Idea 5: The 1588 Spanish Armada? (Classic counterfactual).
      *   *Selection:* **The 1919 Paris Peace Conference (specifically the Treaty of Versailles).**
      *   *Why:* It's within living memory (historically speaking), involves specific agents (Keynes, Wilson, Clemenceau), has clear path dependence (WWII, Cold War, decolonisation), and allows for discussion of *missed* leverage (what could have been done differently). It avoids tech-determinism.
      *   *What it must contain:* Specific decision points, alternative paths, long-term downstream effects.
      *   *What it must not contain:* Determinism (it wasn't *bound* to happen), moral judgement (good/bad), tech focus.

  4.  **Structure the 90 Minutes:**
      *   Need to build the concept of "leverage" before applying it to "now."
      *   Need to tackle the "Pascal" objection early enough so it doesn't fester, but late enough that they understand the stakes.
      *   Need to distinguish from "End of History" and "Accelerationism."

      *   *Draft Sequence:*
          1.  Intro: Define Leverage (15 mins).
          2.  Historical Analogy: Versailles (30 mins).
          3.  The Hypothesis: Applying to Now (20 mins).
          4.  Objections: Pascal, Whig, Presentism (15 mins).
          5.  Closing Task (10 mins).

      *   *Refining Dependencies:*
          *   Can't talk about "Now" until "Leverage" is defined neutrally.
          *   Can't address Pascal's Wager until the "bet" (the stakes) is clear.
          *   Must distinguish from Accelerationism *before* presenting the hypothesis, otherwise they'll conflate them immediately.

  5.  **Addressing Specific Constraints:**
      *   *Pascal's Wager:* Concede the resemblance but distinguish the epistemology. It's not faith; it's expected value based on empirical tractability.
      *   *Leverage vs. Drama:* Use the whiteboard to draw a graph of "Influence over Future" vs. "Time." Show the spike.
      *   *Omissions:* Don't talk about specific effective altruism causes (x-risk specifics). Signal this by saying "We are discussing the *structure* of the claim, not the *content* of the agenda."
      *   *Closing Task:* Needs to test if they understand it's about *comparative* leverage. Ask them to identify a period of *low* leverage.

  6.  **Drafting the Plan (incorporating British English & Tone):**
      *   Tone: Academic, rigorous, respectful of historiography, avoiding evangelism.
      *   Whiteboard usage: Visualising the "Leverage Curve."

