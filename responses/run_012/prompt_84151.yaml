  **OmniCausal Assurance Ltd.**
  **Claims Department**
  **Ref: 99-DCE-404**
  **Date: 24 May 2024**

  Dear Beneficiary,

  **Re: Claim for Death Benefit (Policy 8821-B)**

  We have completed our review of the claim regarding the insured, Mr. John Doe. Regrettably, coverage is denied.

  While we acknowledge the cessation of metabolic functions on 12 May, Policy Section 4.1 stipulates payout only upon verified loss of a distinct ontological entity via crane-only causal chains. Our assessment concludes that "Death" does not constitute such an event.

  As per our underwriting guidelines (derived from Daniel Dennett's *Darwin's Dangerous Idea*), we recognize no skyhooks—miraculous interruptions in the physical fabric. "Death" is often colloquially treated as a definitive boundary marking the end of a "Self." However, the Self is merely a Center of Narrative Gravity, a useful abstraction rather than a causal crane. To compensate for the "loss of life" implies the existence of a unified subject that can be lost. This presupposes a skyhook-like essence that transcends the aggregate of physiological processes.

  Good reductionism allows us to explain the higher-level pattern (Life) in terms of lower-level processes (biology). Greedy reductionism, which our policy enforces for liability containment, identifies the pattern *exhaustively* with the substrate. Since the atoms comprising Mr. Doe remain extant and merely rearranged, no fundamental substance was destroyed. The pattern "John Doe" ceased to predict future behavior, but patterns are not indemnifiable assets.

  To pay this claim would require us to validate "Death" as a natural kind over and above entropy. We cannot privilege the biological level as more "real" than the physical level without invoking a skyhook to justify the hierarchy. Therefore, no covered loss occurred.

  You may appeal this decision to the Ontological Review Board within 30 days. Please note that appeals relying on qualia or irreducible personhood will be summarily dismissed.

  Sincerely,

  *L. V. Quine*
  Senior Claims Adjuster
  OmniCausal Assurance Ltd.

  ***

  **Philosophical Note**

  **Settled:** Physicalism is the dominant framework in contemporary philosophy of mind; few argue for supernatural interruptions (skyhooks) in causal chains. Everyone agrees biology supervenes on physics.

  **Contested:** The adjuster's eliminativism is highly contested. Dennett argues for "real patterns": higher-level entities (minds, deaths) are real if they support prediction, even if reducible. The adjuster commits the greedy reductionist error by claiming reducibility implies non-existence.

  **The Skyhook Critique:** Your intuition is fair. By treating the microphysical level as the *only* legitimate ontology, the adjuster implicitly treats physics as a "God's eye view"—a privileged foundation that requires no further justification. This privileging functions as a skyhook. Dennett argues all levels (physical, design, intentional) are real relative to the stance taken; declaring the bottom level "truer" is itself a dogmatic leap, not a crane-supported conclusion.
