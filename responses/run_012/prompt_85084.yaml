answer: |-
  Here is a session plan designed to navigate the tension between legal precision and moral weight, using Lemkin's broader conception as the pivot point.

  ### 1. Prerequisites: What Must Be in Place First
  Before you can distinguish the legal from the moral, you must establish the **authority of consequence**. The room needs to agree on two ground rules before the first slide is shown:

  *   **The Court vs. The Public Square:** Participants must understand that in a court of law, the goal is *adjudication* (guilty/not guilty, punishable by state force), which requires narrow definitions to protect the accused. In the public square, the goal is *recognition* (naming a harm to mobilize response), which often requires broader definitions to protect the vulnerable.
  *   **The "Stake" Management:** Since half the room has a stake in the answer, you must explicitly decouple the *concept* from the *current event*. You cannot analyze the tool while fighting over the target.
      *   *Action:* Open with a "Chatham House Rule" variant: We are analyzing the *definition*, not litigating the *news*. If a participant tries to pivot to a current conflict where they have a stake, you must have a pre-agreed signal to park the comment for the "limitations" section at the end.

  ### 2. The Case Study: A Recommendation
  **Do not use a case where the label is currently contested in the media.**
  You are inclined toward a contested case, but with an audience that has a "stake in the answer," a live-wire case (e.g., Gaza, Ukraine, Xinjiang) will turn the session into a tribunal. They will seek a verdict, not a concept.

  **Recommended Case: The Herero and Namaqua (German South West Africa, 1904–1908).**
  *   **Why it fits:** It is historically distant enough to lower the temperature but legally contested enough to teach the lesson. Germany did not legally recognize it as genocide until 2021.
  *   **What it has:** Clear evidence of intent to destroy the group's economic life (land confiscation), institutions (social structure), and physical existence (concentration camps). It fits Lemkin's "coordinated plan" perfectly.
  *   **What it lacks:** A contemporary legal trial. There was no Nuremberg for this event at the time. This forces the students to grapple with the *moral* label in the absence of the *legal* verdict, which is exactly the tension your cousin and relative were fighting over.
  *   **The Lesson:** It demonstrates "hoarding the word" (Germany took 100+ years to apply the label) and shows that the harm (destruction of a people's way of life) existed regardless of the legal stamp.

  ### 3. Misconceptions: Order of Appearance and Intervention
  Expect these three misconceptions to surface in this specific order. Here is how to head them off:

  **1. "Genocide means mass killing." (The Body Count Fallacy)**
  *   **When it surfaces:** During the initial brainstorming on "loose usage."
  *   **How to head it off:** Before showing the legal definition, show Lemkin's *Axis Rule* quote. Highlight his phrase: *"essential foundations of the life of national groups."* Ask: *"Can you destroy a group's life without killing every member?"* Use the Herero land confiscation to show that economic erasure was part of the genocidal plan, not just the shootings.

  **2. "If it isn't legally genocide, it isn't so bad." (The Legalist Fallacy)**
  *   **When it surfaces:** When discussing why Germany waited until 2021 to recognize the Herero case.
  *   **How to head it off:** Draw a T-Chart on the board: **Legal Genocide** vs. **Sociological Genocide**. Explain that the 1948 UN Convention was a political compromise that *narrowed* Lemkin's original idea (specifically excluding "cultural genocide"). Make it clear: *The law is a floor, not a ceiling.* A harm does not cease to be a horror because a court lacks jurisdiction.

  **3. "Intent requires a signed order." (The Paper Trail Fallacy)**
  *   **When it surfaces:** When analyzing the "specific intent" requirement in the legal category.
  *   **How to head it off:** Use the Herero "Extermination Order" (which existed) but contrast it with cases where intent was inferred from patterns. Explain that legal intent (*dolus specialis*) is often proven by the *systematic nature* of the acts (e.g., separating children from parents), not just a smoking gun document. This bridges the gap to the moral question: *Patterns reveal intent even when words do not.*

  ### 4. Session Sequence (The Arc)

  **Phase 1: The Loose Word (15 mins)**
  *   **Activity:** Ask participants to write down the first three images that come to mind when they hear "genocide."
  *   **Goal:** Reveal the "Holocaust Template" (camps, industrial killing).
  *   **Pivot:** Introduce Lemkin. Show that he was worried about the *future* of groups, not just the *bodies* of the present. He was worried about language, libraries, and land.

  **Phase 2: The Legal Hinge (30 mins)**
  *   **Activity:** Apply the 1948 UN Convention definition to the Herero case.
  *   **Focus:** Walk through the five acts (killing, serious harm, conditions of life, birth prevention, child transfer).
  *   **Tension Point:** Ask: *"Why did it take 117 years for this to be legally recognized if the facts didn't change?"*
  *   **Answer:** Politics. This validates your cousin's point (hoarding is political) without validating your relative's point (it belongs to one event). It shows the word is *managed*, not just *found*.

  **Phase 3: The Moral/Political Return (30 mins)**
  *   **Activity:** Return to the "Loose Word" list from Phase 1.
  *   **Question:** *"Now that you know the legal definition is narrower than Lemkin's, and narrower than the moral reality, who gets to use the word?"*
  *   **Goal:** Shift from "Is this genocide?" (Verdict) to "What work does calling it genocide do?" (Function). Does it mobilize aid? Does it freeze negotiations? Does it honor the dead?

  ### 5. The Closing Question
  Do not ask: *"Was the Herero case genocide?"* (They will just say yes).
  Do not ask: *"Is [Current Event] genocide?"* (This violates the declination below).

  **Ask this instead:**
  > *"If we restrict the word 'genocide' only to what a court can prove beyond a reasonable doubt, what kinds of destruction become invisible?"*

  This tests whether they grasp that the *legal* category excludes things (like cultural erasure) that the *moral* category includes. It forces them to weigh the cost of precision against the cost of exclusion.

  ### 6. What to Decline to Settle (and Why)
  **You must openly decline to adjudicate any currently active conflict.**
  *   **The Statement:** *"I will not offer a verdict on any ongoing conflict in this session, including those you may be thinking of."*
  *   **The Why:**
      1.  **Pedagogical Integrity:** You are teaching them how to fish, not giving them a fish. If you give a verdict, they focus on your authority, not the framework.
      2.  **Safety:** With half the room having a stake, a verdict on a live issue will shatter the room's cohesion.
      3.  **Competence:** You are a facilitator, not the International Criminal Court. To pretend otherwise is to model the exact kind of overreach the session warns against.

  **Final Note for the Facilitator:**
  Your relative thinks the word is sacred and singular; your cousin thinks it is a tool and political. The truth is, they are both right. The word *is* singular in its horror (Legal), but it *is* a tool in its application (Political). Your job is not to choose a side, but to show them the mechanism that makes both statements true. Lemkin is the key because he wrote the blueprint before the politicians narrowed the door. Keep them in the blueprint.
