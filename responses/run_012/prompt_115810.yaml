answer: |-
  Your colleague is advancing a form of conventionalism regarding historical periodisation. Her argument is that terms like 'the Middle Ages' or 'the Scientific Revolution' are not natural kinds waiting to be found in the strata of time, but rather conceptual tools we impose upon the past to make it intelligible. Taking this constructivist line seriously does not dissolve history into fiction, but it fundamentally alters the status of the claims historians make within those frameworks.

  Here are the five most important implications of this position, ranked from the most theoretically consequential to the most practically consequential for your museum.

  ### 1. The Status of Causal Explanations
  The most profound implication concerns how we explain change. If a period is a 'fire district' rather than a 'contour', then causation that relies on the boundaries of that period becomes circular.

  If the 'Scientific Revolution' is a chrononym constructed to group together certain changes in astronomy, physics, and methodology, one cannot subsequently use 'the Scientific Revolution' as the *cause* of those changes. To say 'the Scientific Revolution caused a shift in worldview' is to say 'our categorisation of these events caused a shift in worldview', which is nonsensical. Instead, causation must be located in the specific actions, material conditions, and intellectual exchanges of individuals, regardless of which side of an arbitrary date they fall.

  Consequently, the claim that the Scientific Revolution was a 'revolution' shifts from being a description of a sudden, objective rupture in reality to a description of a narrative strategy. It suggests that the 'rupture' may be an artefact of the zoom-level we have chosen. If we zoom in, the revolution often looks like evolution; if we zoom out, it looks like a spike. The constructivist view demands that we treat 'revolutions' not as events that happened *to* the past, but as patterns we have identified *in* the past for specific explanatory purposes. We must ask: does calling this a 'revolution' help us explain the speed of change, or does it merely obscure the continuities that made the change possible?

  ### 2. The Teleology of 'Rebirth' and Progress
  Secondly, this view exposes the normative baggage embedded in period terms. Chrononyms are rarely neutral; they are often inherited from the very people who lived through the transitions. The term 'Renaissance' (rebirth) was coined by humanists who wished to characterise their own time as a restoration of light following a period of darkness.

  If you accept your colleague's view, you must acknowledge that using these terms uncritically perpetuates the self-conception of a specific group of historical actors as an objective truth. To label a gallery 'The Renaissance' is not merely to date objects from 1400 to 1600; it is to endorse the claim that this era was a 'rebirth' and, by implication, that the preceding era was a 'death' or stagnation.

  If periods are administrative devices, then the 'Rebirth' is not a fact to be displayed, but a claim to be interrogated. The implication is that the museum must decide whether it is presenting the past as it was, or presenting the past as it *wished to be remembered*. A constructivist approach suggests that the 'Middle Ages' exists largely to serve the narrative needs of the 'Early Modern'. Therefore, causal claims about the 'darkness' of the medieval period versus the 'light' of the modern become suspect. They are not discoveries of historical quality, but artifacts of historical branding.

  ### 3. The Validity of Cross-Period Comparison
  Does this make cross-period comparison impossible? No, but it changes the justification required for it. If periods were natural kinds (like biological species), comparing 'Medieval' man to 'Modern' man would be like comparing a wolf to a dog—a comparison of two distinct entities.

  If periods are zoning tools, comparison becomes a comparison of *configurations* rather than *essences*. You can still compare the 12th century to the 17th century, but you cannot assume that the boundary between them represents a fundamental change in human nature or capacity. The comparison must be justified by the specific variables being measured (e.g., literacy rates, metallurgical technology, urban density) rather than by the period labels themselves.

  The constructivist view requires that we do not treat 'the Medieval' as a monolithic block that contrasts uniformly with 'the Modern'. It forces the historian to specify *which* aspects of the periodisation are relevant to the comparison. For example, if comparing legal systems, the '12th-century revival of Roman law' might be more significant than the '15th-century Renaissance'. The period labels become secondary to the specific phenomena being tracked. Comparison remains possible, but it must be rigorous about not reifying the boundaries as barriers to human agency.

  ### 4. Curatorial Labelling and Narrative Structure
  For your museum, the implication is not necessarily that you must banish the terms 'Middle Ages' or 'Renaissance', but that you must alter their grammatical status in your interpretive text.

  If these terms are pragmatic tools, they should be presented as such. A label that reads 'Objects from the Renaissance' implies the Renaissance is a place or a natural phenomenon. A label that reads 'Objects from the period traditionally known as the Renaissance' or 'Europe, 1400–1600' signals to the visitor that this is a framework, not a fact.

  The most constructive approach is to use the terms heuristically while acknowledging their limits. You might retain the room titles for navigational ease (as visitors expect them) but use the introductory panels to explain that these boundaries are fluid. For instance, you might note that while we call this room 'The Scientific Revolution', many of the ideas displayed here have roots in the previous gallery, and many 'medieval' ideas persisted long after the door closed. This turns the periodisation from an invisible assumption into a visible part of the exhibition's argument. It allows you to keep the administrative convenience of the 'fire district' without misleading the public into thinking the fire stopped burning at the boundary line.

  ### 5. Deciding When a Periodisation is a 'Mistake'
  Finally, if periodisations are pragmatic tools rather than true descriptions, how do we decide if one is wrong? A map projection can be 'wrong' not because it fails to be the earth (no flat map is the earth), but because it distorts the specific features relevant to the user.

  A periodisation is a mistake, on this view, if it creates false homogeneity or obscures significant continuity. It is a mistake if it groups together phenomena that have no causal connection simply because they happened to occur between the same arbitrary dates. For example, if grouping 'The Scientific Revolution' forces us to ignore the vital role of craft traditions or colonial expansion because they don't fit the 'great thinker' narrative, the periodisation is failing its pragmatic test.

  Conversely, a periodisation is a 'convenience' (and thus acceptable) if it successfully clusters related changes in a way that aids understanding without distorting the evidence. The test is not 'is this boundary real?' but 'does drawing this boundary help us explain the past better than leaving it undivided?' If a label creates more confusion than clarity—for instance, if visitors leave thinking nothing of importance happened between 500 and 1400—then the administrative device is malfunctioning. It is not ontologically false, but it is pragmatically defective.

  ### Summary for the Committee
  Your colleague is correct that these terms are constructs, but she is not necessarily correct that they should therefore be discarded. The implication of her view is not that we cannot speak of the Renaissance, but that we must speak of it *as* a Renaissance—a concept invented by historians and humanists, not a force of nature.

  For the museum, the path forward is likely a compromise: retain the familiar chrononyms for wayfinding, but strip them of their ontological weight in the interpretive text. Treat the transition from 'Medieval' to 'Early Modern' not as a change in the world's essence, but as a shift in the organisation of knowledge, power, and material culture that happened gradually, unevenly, and often retrospectively. This satisfies the historian's need for nuance without sacrificing the visitor's need for structure.
