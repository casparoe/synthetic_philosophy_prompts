prompt: |-
  I'm an undergraduate taking a metaphysics course and I work part-time in my university museum's collections office. We repeatedly have to decide whether a conserved or reconstructed artifact is still the same object for cataloguing, loans, and insurance: a ceramic vessel with a replaced handle, a painting that has been relined and retouched, a fossil skeleton reassembled from fragments, a plaster cast taken from an original mold, a digital model substituted for a fragile original. We keep three things separate in principle—the accession identity (the catalogue number), the physical-object identity (the material thing), and the display identity (what visitors are shown)—but in practice they collapse, and our current rule of thumb, 'if most of the original material is gone, it's a new object,' produces fights because the archaeologist, the conservator, and the insurer are answering different questions. Please turn the material-constitution literature (the statue and the clay, sortal relativity, constitution without identity, four-dimensionalism, mereological essentialism) into a decision procedure my office can actually run: the questions to ask in order, what counts as a sufficient answer, where it stops with 'same object' or 'different object', and where it must hand the call to a person because the issue is policy or values rather than metaphysics. I have about ten minutes per item, and the registrar and curator have to sign off. Include two or three worked cases, at least one where the procedure yields 'different object' even though the museum would prefer 'same'. Then say what the procedure cannot do, and where the theory is too contested to settle the case. I'd rather have an honest, self-critical procedure that flags its limits than a tidy one that pretends metaphysics decides everything; if my framing is confused—for instance, if 'same object' is doing several different jobs at once—say so and suggest how to separate them.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Undergraduate metaphysics student + museum collections office worker.
      *   **Problem:** Determining object identity for cataloging, loans, and insurance (conserved/reconstructed artifacts). Current rule ("most original material") causes conflict between stakeholders (archaeologist, conservator, insurer).
      *   **Task:** Convert material-constitution literature (statue/clay, sortals, 4Dism, etc.) into a *practical decision procedure* (10 mins/item, sign-off by registrar/curator).
      *   **Requirements:**
          *   Ordered questions with sufficient answers.
          *   Stop conditions ("same" vs. "different").
          *   Hand-off points (policy/values vs. metaphysics).
          *   2-3 worked cases (including one where metaphysics says "different" but museum wants "same").
          *   Critique/Limitations section (what the procedure *can't* do, where theory is contested).
          *   Address potential conceptual confusion (is "same object" doing too much work?).
      *   **Tone:** Honest, self-critical, practical, academically rigorous but accessible.

  2.  **Deconstruct the Philosophical Concepts:**
      *   *Material Constitution (Statue/Clay):* Distinguishes the constituting matter from the constituted object. Useful for separating "physical stuff" from "artifact."
      *   *Sortal Relativity:* Identity depends on the kind term (is it a *vessel* or a *collection of shards*?).
      *   *Constitution Without Identity:* The clay constitutes the statue but isn't identical to it. Allows for change in matter without change in object (under certain conditions).
      *   *Four-Dimensionalism (Perdurantism):* Objects are space-time worms. Repairs are just temporal parts. Good for continuity, bad for "destruction" events.
      *   *Mereological Essentialism:* If you lose a part, it's a new object. (Too strict for museums, but good as a boundary check).
      *   *Functional/Historical Continuity:* Causal history matters more than matter for artifacts.

  3.  **Address the Conceptual Confusion (Crucial Step):**
      *   The prompt admits the museum separates accession, physical, and display identity but they collapse in practice.
      *   *Diagnosis:* "Same Object" is ambiguous. It conflates *Numerical Identity* (Metaphysics), *Administrative Continuity* (Registrar), and *Authenticity/Value* (Curator/Insurer).
      *   *Solution:* The procedure must explicitly decouple these. We aren't asking "Is this metaphysically the same?" We are asking "Does this retain enough *X* to keep Accession Number *Y*?"

  4.  **Drafting the Decision Procedure (The "Museum Identity Protocol"):**
      *   *Goal:* 10 minutes. Needs to be a flowchart style.
      *   *Step 1: Sortal Classification.* What kind of thing is it? (Natural kind vs. Artifact vs. Document). This determines the persistence conditions.
      *   *Step 2: Causal/Historical Continuity.* Is there an unbroken chain of custody/intention? (Breaks the "Ship of Theseus" problem by focusing on history).
      *   *Step 3: Material Threshold.* The "Most Material" rule is too blunt. Use a "Core Function/Form" test.
      *   *Step 4: The "Destruction Event" Check.* Was there a point where the object ceased to function/exist?
      *   *Step 5: Stakeholder Flag.* If metaphysics is indeterminate, kick to policy.

  5.  **Developing Worked Cases:**
      *   *Case 1: Ceramic Vessel (Replaced Handle).* Classic Theseus. Metaphysics: Same (functional continuity). Museum: Same.
      *   *Case 2: Digital Model (Substitute).* Metaphysics: Different (no material/causal continuity of the original). Museum: Wants to treat as same for access? No, must be distinct.
      *   *Case 3: The "Phoenix" Reconstruction (e.g., heavily fragmented fossil or destroyed building).* Metaphysics: Different (destruction event occurred). Museum: Wants "Same" for prestige/grants. *This fits the requirement.*

  6.  **Refining the Philosophical Integration:**
      *   Don't just name-drop. Explain *why* a step uses a specific theory.
      *   *Sortals:* Use to define persistence conditions.
      *   *4Dism:* Use to justify repairs as temporal parts.
      *   *Constitution:* Use to separate the insurance value (material) from the catalog value (artifact).

  7.  **Drafting the Limitations/Critique:**
      *   Metaphysics doesn't give values. It gives structure.
      *   Insurance cares about value, not identity.
      *   "Identity" is often a proxy for "Value."
      *   Acknowledge that the procedure forces a binary (Same/Diff) on a spectrum.

  8.  **Review against Constraints:**
      *   10 mins/item? Yes, keep questions sharp.
      *   Registrar/Curator sign-off? Include a "Policy Override" section.
      *   Honest/Self-critical? Yes, emphasize the "Value vs. Identity" confusion.
      *   Undergraduate level? Keep jargon explained.

  9.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Initially, I might lean too hard on 4Dism. But museums are practical. 4Dism is good for *explaining* continuity, but "Destruction Events" are more practical for decision making. I'll frame 4Dism as "Spatio-Temporal Continuity."
      *   *Correction:* Make sure to explicitly separate the three identities the user mentioned (Accession, Physical, Display). The procedure should output a recommendation for *Accession Identity*, while noting implications for the others.
      *   *Emphasis:* The prompt asks to turn literature into a procedure. I need to make sure the link between "Sortal Relativity" and "Question 1" is clear.

  10. **Final Structure:**
      *   Introduction: Acknowledging the conceptual tangle.
      *   The Protocol (MIDP): 5 Steps.
      *   Worked Cases (3).
      *   Limitations & Theoretical Contests.
      *   Conclusion.

  (Proceed to generate response based on this plan.)
answer: |-
  This is a classic instance where applied metaphysics meets institutional bureaucracy. Your diagnosis is correct: "Same Object" is doing too much work. It is conflating **Numerical Identity** (metaphysics), **Administrative Continuity** (registrarial practice), and **Authenticity/Value** (curatorial/insurance interest).

  The literature you cited (Wiggins, Baker, Sider, etc.) suggests there is no single "truth" of identity independent of the *sortal concept* (the kind of thing we take the object to be) and the *practical interests* at stake. A procedure cannot solve value disputes, but it can prevent category errors.

  Below is the **Museum Identity Decision Procedure (MIDP)**. It is designed to be run in 10 minutes. It forces you to select a *Sortal* first, because persistence conditions depend on what kind of thing you think you have.

  ***

  # The Museum Identity Decision Procedure (MIDP)

  **Time Limit:** 10 Minutes
  **Required Sign-off:** Registrar (Accession), Curator (Value)
  **Goal:** Determine if the *Accession Identity* (Catalog Number) remains valid.

  ### Phase 1: Sortal Selection (2 Minutes)
  *Philosophical Basis: Sortal Relativity (Wiggins). An object persists only relative to the kind term applied to it.*

  **Q1: What is the primary sortal concept governing this item?**
  Select **one**:
  *   **A. Natural Kind:** (e.g., Fossil, Meteorite, Biological Specimen). *Persistence Condition: Material continuity is paramount.*
  *   **B. Functional Artifact:** (e.g., Tool, Vessel, Machine). *Persistence Condition: Functional continuity and form are paramount.*
  *   **C. Historical Document:** (e.g., Manuscript, Painting, Signed Contract). *Persistence Condition: Causal history of production (provenance of the mark) is paramount.*
  *   **D. Commemorative/Symbolic:** (e.g., Crown Jewels, Religious Relic). *Persistence Condition: Institutional designation is paramount.*

  > **Stop Condition:** If you cannot agree on the Sortal between Registrar and Curator, **HALT**. This is a policy dispute, not an identity question. Escalate to Collections Committee.

  ### Phase 2: The Destruction Event Check (3 Minutes)
  *Philosophical Basis: Four-Dimensionalism / Temporal Parts. Did the space-time worm break?*

  **Q2: Did the object undergo a "Cessation of Function" or "Loss of Integrity" event from which it did not recover continuously?**
  *   *Examples:* A vase shattered and sat in a box for 50 years before gluing (Discontinuous). A vase cracked and was immediately stabilized (Continuous). A building burned down and was rebuilt 100 years later (Discontinuous).
  *   **Yes:** Go to **Q3**.
  *   **No:** Go to **Phase 3**.

  **Q3: Is the current item a reconstruction based on memory/documentation, or a reassembly of original fragments?**
  *   **Reassembly of original fragments:** Proceed to **Phase 3**. (Metaphysically: Same object, damaged).
  *   **Reconstruction from documentation/new material:** **VERDICT: DIFFERENT OBJECT.** (Metaphysically: The original space-time worm ended; this is a replica).
      *   *Action:* Assign new Accession Number. Link to old number as "Predecessor."
      *   *Note:* Curator may override for *Display Identity*, but not *Accession Identity*.

  ### Phase 3: The Constitution Threshold (3 Minutes)
  *Philosophical Basis: Constitution Without Identity (Baker). The matter constitutes the object but is not identical to it. How much matter can change before the constitution relation breaks?*

  **Q4: Based on the Sortal selected in Phase 1, has the "Core Constitutive Material" been replaced?**
  *   **If Natural Kind (A):** Has >50% of the original mass been replaced or consolidated with synthetic material?
      *   **Yes:** **VERDICT: DIFFERENT OBJECT.** (It is now a cast/stabilized model).
      *   **No:** **VERDICT: SAME OBJECT.**
  *   **If Functional Artifact (B):** Has the part essential to its *definition* been replaced? (e.g., the handle of a mug vs. the body of a mug).
      *   **Yes:** **VERDICT: DIFFERENT OBJECT.** (It is now a hybrid/replica).
      *   **No:** **VERDICT: SAME OBJECT.** (Repairs are temporal parts).
  *   **If Historical Document (C):** Has the surface bearing the historical mark (brushstroke, ink, signature) been removed or painted over?
      *   **Yes:** **VERDICT: DIFFERENT OBJECT.** (The document is destroyed; only the support remains).
      *   **No:** **VERDICT: SAME OBJECT.** (Relining is permissible constitution).

  ### Phase 4: The Value/Policy Handoff (2 Minutes)
  *Philosophical Basis: Acknowledging that "Identity" is often a proxy for "Value."*

  **Q5: Does the metaphysical verdict conflict with institutional necessity?**
  *   *Scenario:* Metaphysics says "Different," but Insurance/Grant requires "Same."
  *   **Action:** Do **not** change the Accession Number. Instead, add a **Status Flag** to the record.
      *   **Flag:** `SUBSTANTIVELY_MODIFIED`
      *   **Note:** "Accession continuity retained for administrative purposes despite material discontinuity."
  *   **Why:** This separates *Administrative Identity* (we keep the number for paperwork) from *Physical Identity* (we acknowledge the stuff changed).

  ***

  # Worked Cases

  ### Case 1: The Neolithic Vessel (Functional Artifact)
  *   **Scenario:** A ceramic pot with a missing handle. Conservator fabricates a new handle from modern clay to allow safe handling. 90% of original clay remains.
  *   **Phase 1:** Sortal = **Functional Artifact**.
  *   **Phase 2:** No destruction event. Continuous custody.
  *   **Phase 3:** Core Constitutive Material? The body holds the volume; the handle is auxiliary. Essential function (holding liquid/display) is retained.
  *   **Verdict:** **SAME OBJECT.**
  *   **Outcome:** Accession number remains. Insurance covers original material value + conservation cost.
  *   **Theory:** *Constitution Without Identity.* The new clay constitutes the handle, but the artifact persists because the functional form continues.

  ### Case 2: The Digital Surrogate (Historical Document/Artifact)
  *   **Scenario:** A fragile manuscript is too damaged to display. A high-res 3D printed facsimile is created for the case. The original goes to cold storage.
  *   **Phase 1:** Sortal = **Historical Document**.
  *   **Phase 2:** No destruction event, but...
  *   **Phase 3:** Core Constitutive Material? The ink/paper interface *is* the document. The 3D print shares no material or causal history of production.
  *   **Verdict:** **DIFFERENT OBJECT.**
  *   **Outcome:** The print gets a new Accession Number (e.g., `2024.001.REP`). It is linked to the original (`1990.050`).
  *   **Theory:** *Mereological Essentialism / Causal History.* You cannot swap the entire matter of a document and keep the identity.
  *   **Museum Preference:** They want to call it "The Manuscript" on the label.
  *   **Procedure Fix:** Label says "Facsimile of 1990.050." Accession remains distinct.

  ### Case 3: The "Phoenix" Fossil (Natural Kind) — *The Conflict Case*
  *   **Scenario:** A dinosaur skeleton was found 90% fragmented. The original bone was too brittle. Conservators scanned the fragments, 3D printed a skeleton in resin, painted it to look like bone, and mounted it. The original fragments are in a drawer. The museum wants to loan the mount as "The T-Rex Specimen #404."
  *   **Phase 1:** Sortal = **Natural Kind** (Fossil).
  *   **Phase 2:** Destruction Event? The structural integrity failed completely. It ceased to be a skeleton and became a pile of shards.
  *   **Phase 3:** Core Material? >90% of the mass is now resin. The original bone is no longer constituting the display object.
  *   **Metaphysical Verdict:** **DIFFERENT OBJECT.** (The mount is a cast/model).
  *   **Museum Preference:** **SAME OBJECT.** (Marketing, grant requirements, prestige).
  *   **Procedure Resolution:**
      1.  **Accession Identity:** Remains `#404` (Administrative Continuity).
      2.  **Physical Identity:** Flagged as `RECONSTRUCTION`.
      3.  **Insurance:** Insured as "Reproduction" value, not "Original Specimen" value.
      4.  **Loan Agreement:** Must explicitly state "This loan consists of a reconstruction based on original holotype fragments."
  *   **Why this matters:** If the resin mount is destroyed in transit, the museum cannot claim the loss of the *fossil*, only the loss of the *model*. The procedure prevents insurance fraud by separating the Accession Number (which stays) from the Physical Reality (which changed).

  ***

  # Limitations & Theoretical Contests

  You asked for an honest critique of where this procedure fails. Here is where metaphysics cannot save you:

  **1. The "Ship of Theseus" Boundary is Arbitrary**
  The procedure uses thresholds (e.g., >50% mass, "essential part"). Metaphysically, these are vague. There is no fact of the matter about exactly *which* replaced handle makes it a new pot.
  *   *Limit:* The procedure forces a binary decision on a spectrum.
  *   *Mitigation:* The `SUBSTANTIVELY_MODIFIED` flag acknowledges the vagueness without breaking the database.

  **2. Identity vs. Value (The "Same" Trap)**
  Often, when stakeholders argue about "Is it the same object?", they are actually arguing about **Value**.
  *   *The Archaeologist* wants "Different" to ensure the reconstruction isn't cited as primary data.
  *   *The Curator* wants "Same" to keep the object on display as a star attraction.
  *   *The Insurer* wants "Different" to lower the payout risk.
  *   *Critique:* The MIDP pretends to solve identity, but it actually solves **classification**. It cannot determine value. If the Curator insists the resin T-Rex is "The Specimen" for a press release, metaphysics cannot stop them. It can only ensure the *catalog record* reflects the material reality.

  **3. Four-Dimensionalism vs. Endurantism**
  The procedure leans on **Perdurantism** (objects are space-time worms; repairs are just new temporal parts). However, many stakeholders are intuitive **Endurantists** (the object is wholly present at every time; if matter changes, the object changes).
  *   *Conflict:* If a conservative donor believes the object is its matter, they will reject the "Same Object" verdict on a relined painting.
  *   *Limit:* The procedure cannot reconcile ontological commitments. It prioritizes the *Institutional Sortal* over personal metaphysics.

  **4. The "Digital Object" Problem**
  The procedure struggles with born-digital art or complex media installations. If the software is emulated on new hardware, is it the same object?
  *   *Limit:* Sortal selection (Phase 1) breaks down here. Is it a Document? A Function? A Performance?
  *   *Recommendation:* For digital media, skip to Phase 4. Treat "Identity" as purely Administrative. Focus on **Authenticity Protocols** (checksums, migration logs) rather than material constitution.

  # Final Recommendation for Your Office

  Your current conflict arises because you are using **Accession Identity** to do the work of **Physical Identity**.

  1.  **Adopt the MIDP** to stabilize the Accession Number. Keep the number as long as there is *administrative continuity* (Phase 4), even if the physical object is new.
  2.  **Decouple Insurance.** Insurance should never be based on the Accession Number alone. It must be based on the **Phase 3 Verdict**. If the verdict is "Different Object" (physically), the insured value must reflect the material reality, regardless of the catalog number.
  3.  **Labeling.** Allow the Curator to use "Same Object" language for public display (Display Identity) *only if* the `SUBSTANTIVELY_MODIFIED` flag is visible in the internal record.

  This approach admits that "Identity" in a museum is a **normative status**, not a metaphysical fact. The procedure doesn't find the truth; it manages the disagreement.
