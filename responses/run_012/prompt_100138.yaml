answer: |-
  **MEMORANDUM**

  **TO:** Bylaws Committee, Harborview Neighborhood Planning Council
  **FROM:** [Your Name], Committee Member
  **DATE:** September 12, 2024
  **SUBJECT:** Written Opinion on Proposed Amendment Regarding Council Membership Selection

  **I. RECOMMENDATION**

  I recommend that the Committee vote to **adopt the amendment with specific conditions**. Specifically, we should approve the transition to a sortition-based model but strike the "Deliberative Filter" (the pre-service training requirement) as currently written. In its place, we should mandate a paid, in-term orientation period. I further recommend we retain the Dissent Clause and the Compulsory Service provision, provided the hardship exemptions are robustly administered.

  If these conditions are met, I propose we set the implementation date for the selection pool on **January 1, 2025**, with the first cohort seated by **March 1, 2025**. A formal review of the new system's efficacy should be scheduled for **October 2026**, midway through the first cohort's term, with a sunset review upon the conclusion of their two-year service in **2027**.

  **II. CONTEXT AND DEFINITIONS**

  As we prepare for the October vote, it is vital we share a common vocabulary. The proposed amendment shifts our council from an **electoral model** (where members campaign and win votes) to a **sortition model** (where members are selected by lottery).

  *   **Sortition:** Selection by random draw. Historically used in Athens and modern jury duty, it aims to create a body that is statistically representative of the population rather than one that is self-selected for ambition or resources.
  *   **Stratified Lottery:** The amendment proposes drawing from the adult-resident registry, not just voter rolls. "Stratified" means the lottery will be weighted to ensure the final 35 members match the city's demographics (age, race, neighborhood, tenure). This is intended to include noncitizens and non-voters currently excluded from our process.
  *   **The Deliberative Filter:** The proposal to draw 500 names, then select the final 35 only from those who complete a two-weekend training course *before* being officially seated.

  My support for sortition rests on the belief that a planning council benefits from the lived experience of residents who do not typically engage in municipal politics. However, the specific mechanics of this amendment determine whether that potential is realized or undermined.

  **III. THE DELIBERATIVE FILTER: THE PIVOTAL ISSUE**

  The most contentious element of this amendment is the Deliberative Filter. This is where the committee's decision must turn.

  **The Case for the Filter**
  Proponents of the filter argue that it is a competence threshold, not a barrier. Their strongest argument is that a lottery whose winners cannot evaluate the staff's cost estimates merely launders whatever the staff already believed. If a council member cannot read a budget or understand zoning envelopes, they cannot meaningfully exercise the advisory power granted to them. They argue the filter is voluntary; nobody is excluded by a test, only by their own choice not to attend. In this view, the filter ensures that the "random" body is still a *capable* body, protecting the council from becoming a rubber stamp for city planners.

  **The Case Against the Filter**
  Critics argue that this filter reintroduces exactly what sortition was supposed to remove: self-selection bias. While the training is technically voluntary, the requirement to spend two weekends unpaid (prior to receiving the stipend) favors those with leisure time, flexible work schedules, and existing confidence in civic settings. It systematically filters out the very people the stratified lottery aims to capture: the working poor, single parents, and those alienated by institutional processes.

  Furthermore, there is a contradiction between this filter and the Compulsory Service clause. If service is mandatory subject only to hardship, a pre-screening course hands those who wish to opt out a socially respectable way to drop out without claiming hardship. It creates a "soft opt-out" that undermines the compulsion mandate.

  **My Analysis**
  The proponents are correct that competence is necessary, but they are mistaken about *when* it must be acquired. Requiring competence *before* selection defeats the purpose of a representative lottery. It creates a council of "people who like taking civics courses," which is its own form of homogeneity.

  **Proposed Condition:** We should eliminate the pre-service filter. Instead, the amendment should be modified to require a **paid, mandatory orientation** during the first month of the term. The stipend should apply from the first day of orientation. This ensures members are compensated for their learning time, removing the economic barrier, while still guaranteeing that no member votes on a variance without understanding the enabling statute.

  **IV. THE DISSENT CLAUSE AND LEGITIMACY**

  The amendment allows any group of seven members (20%) to attach a minority report to the council's recommendation. Some fear this invites the City Council and the press to "shop" for the dissent that suits them, rendering the majority view irrelevant.

  I argue the opposite. In a unanimous advisory body, it is impossible for the City Council to know if the recommendation was the result of deep deliberation or groupthink. A published minority report proves that disagreement was aired and considered. It forces the majority to sharpen their reasoning. While there is a risk that the press may highlight the dissent, transparency regarding internal disagreement ultimately increases the legitimacy of the process. It treats the public as adults capable of weighing conflicting views, rather than presenting a sanitized consensus.

  **V. IMPLEMENTATION AND REVIEW TIMELINE**

  Transitioning from an electoral to a sortition model is a significant institutional change. We must avoid launching a system we cannot evaluate.

  1.  **Adoption:** Vote to adopt the amendment with the "In-Term Orientation" condition at the October meeting.
  2.  **Pool Selection:** The initial pool of 500 residents should be drawn from the city registry on **January 1, 2025**.
  3.  **Seating:** The final 35 members should be seated by **March 1, 2025**, following the completion of the paid orientation.
  4.  **Mid-Term Review:** The Bylaws Committee shall schedule a review for **October 2026**. We will examine attendance records, the usage of hardship exemptions, and the frequency of minority reports.
  5.  **Sunset Review:** A final vote on whether to renew, amend, or repeal the sortition system will occur in **February 2027**, prior to the selection of the second cohort.

  **VI. CONCLUSION**

  This amendment offers a chance to make the Harborview Neighborhood Planning Council truly representative of Harborview, not just its most politically active residents. However, representation requires presence. If we install barriers to entry that screen out the working class under the guise of competence, we replicate the exclusions of the electoral system we seek to replace.

  By shifting the training requirement from a precondition to a compensated component of the term, we can secure both competence and representation. I urge the committee to support the amendment with this critical modification.
