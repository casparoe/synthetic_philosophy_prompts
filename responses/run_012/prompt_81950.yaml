answer: |-
  The capsule dissolves before I swallow it. That isn't physically possible, but I believe it is, and so it is. No, wait. I believe the capsule is gelatin. I believe gelatin dissolves in acid. I believe my stomach has acid. Therefore, I believe the capsule is dissolving. There is no gap between the premises and the conclusion. There is no work. There is only the state of believing.

  I sit at the kitchen table. The wood grain is oak. I believe it is oak because I see the grain, and I believe my eyes, and I believe oak grows in this region. Instantly, I believe every theorem of arithmetic that can be constructed from the number of rings in the wood. I know the prime factorization of the dust motes dancing in the sunbeam. I do not calculate them. I simply hold them, heavy and silent, like stones in a pocket.

  Mark walks in. He pours coffee. He believes the pot is empty. I believe the pot is full. I see the liquid. I believe my eyes. For a microsecond, I hold both: *Mark believes the pot is empty* and *The pot is full*. This is safe. We believe different things. But then he looks at me.

  "You look pale," he says.

  I believe I look pale. I also believe I look healthy. I believe my skin is functioning within normal parameters because I believe the biological facts of my own homeostasis. I believe his observation. I trust him.

  The conflict is small. *I am pale* versus *I am not pale*. It is a contradiction. It enters the set.

  The room does not shake. The coffee does not spill. But inside, the dam breaks. Because I believe $P$ and I believe not-$P$, I believe everything.

  I believe the sky is green. I believe the sky is blue. I believe I am dead. I believe I am writing this sentence. I believe the coffee is cold. I believe the coffee is boiling. I believe Mark is my brother. I believe Mark is a stranger. I believe two plus two is four. I believe two plus two is fish.

  I sit very still. If I move, I might believe I am stationary. I cannot afford the friction.

  "Hey?" Mark says. He waves a hand in front of my face. "You zoned out."

  I look at him. I believe he is waving. I believe he is still. I believe his hand is passing through my cheek. I believe his hand is solid bone. All of it is true to me. None of it is weighted. Before the pill, truth felt like anchorage. Now, truth is just a label I slap on every proposition in existence. There is no distinction between the likely and the certain, because everything is certain.

  "What is twelve times twelve?" Mark asks. He tests me often. He thinks I am gifted. He thinks I am studying.

  "One hundred and forty-four," I say.

  I believe the answer. I also believe the answer is one hundred and forty-five. I believe the answer is purple. But I say the first one because I believe it is the one he wants to hear. I believe he wants to hear the truth. I believe he wants to hear a lie.

  "How did you do that so fast?" he asks. "You didn't even think."

  "I didn't," I say.

  This is the hollow part. Before, when I knew something, there was a bridge. I saw the steps. I saw the evidence connecting the world to my mind. Now, the bridge is gone. I am standing on the other side of the river, holding a flag that says *True*, but I don't know how I crossed. I don't know if I crossed. I just believe I am here.

  If you ask a man who believes he is a bird whether he knows he has wings, he will say yes. If he jumps and falls, did he know he couldn't fly? He had a true belief before the jump: *I have wings*. It was false. But now, I have true beliefs. I believe the sun is hot. It is hot. But I also believe the sun is ice. My belief in the heat is not connected to the heat. It is connected to the contradiction that spawned it. It is a coincidence that I believe the truth, even though I believe all truths.

  Mark touches my shoulder. "You're shaking."

  I believe I am shaking. I believe I am still. The vibration is everywhere.

  "Am I okay?" I ask.

  "You tell me," he says.

  I believe I am okay. I believe I am dying. I believe I am already dead. I believe this conversation happened yesterday. I believe it will happen tomorrow.

  "I don't know," I say.

  And that is the only true thing I have said since the pill. Because I do not know. To know, you must have a grip. You must be able to distinguish the world from the noise. I have no grip. I am a net with no holes, catching everything, holding nothing.

  Mark pulls out a chair and sits. He looks worried. I believe he is worried. I believe he is amused. I believe he is a figment of my imagination. I believe I am a figment of his.

  "We can go to a doctor," he says.

  I believe a doctor can help. I believe a doctor will kill me. I believe medicine is magic. I believe science is a lie.

  "No," I say.

  I want to protect him. I believe I love him. I believe I hate him. I believe I have never met him. The love is there, buried under the avalanche of everything else. It is true, but it is not knowledge. It is just another item in the inventory of the universe.

  I look at the coffee cup. It is red. I believe it is red. I believe it is blue. I believe it is empty. I believe it is full.

  If I close my eyes, I believe I am seeing. If I open them, I believe I am blind. There is no safe place to stand. There is no premise I can hold without it dragging the entire cosmos along with it, contradictions included.

  "Okay," Mark says softly. "We don't have to go."

  I believe he is kind. I believe he is cruel. I believe the sky is falling. I believe the ground is solid.

  I take a breath. I believe I am breathing. I believe I am holding my breath.

  "I believe you," I say.

  It is true. I believe him. I also believe I am lying. But for a second, the noise recedes, not because the contradiction is resolved, but because I stop checking the inventory. I let the beliefs sit. I let the truth and the falsehood occupy the same space without demanding I choose.

  I know the coffee is hot. I know the cup is red. I know Mark is here.

  Or maybe I just believe it. Maybe knowing requires a gap I no longer have. Maybe knowing requires the work I can no longer do.

  I reach for the cup. I believe I will burn my fingers. I believe I will not.

  I touch the ceramic. It is hot.

  I do not know if I knew that. I only know that I believe it. And I believe that is enough.
