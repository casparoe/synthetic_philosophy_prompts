answer: |-
  **The Scenario**

  A small logistics firm learns that its former partner, now imprisoned abroad with no possibility of communication or further influence, has left a sealed instruction with a neutral executor: if the partner's final psychological profile predicted the firm would capitulate to financial demands, the executor must release evidence triggering a costly regulatory audit; if not, the evidence is destroyed. The firm cannot contact the partner, bribe the executor, or legally stop the audit, rendering any causal defence pointless. To mitigate this, the firm publicly adopts a 'Heritage Charter', pledging to preserve an obsolete, low-value depot building at significant expense should any coercion be attempted, despite the depot serving no operational purpose. The firm knows the partner's profile was based on whether they appeared rigid or flexible; by adopting the Charter now, they provide evidence that they are the type of agent who rigidly defends surrogate assets, leading the partner's prior prediction to favour the 'capitulate' branch where the threat targets the cheap-to-damage depot rather than the hard-to-audit license, thereby limiting the firm's potential loss to the value of the depot rather than its solvency.

  **Analysis of Conditions**

  This case meets the four requisite conditions as follows. First, the surrogate goal does not distort ordinary life because the Heritage Charter imposes no cost unless coercion is attempted; the depot remains unused and cheap to maintain during normal operations. Second, the goal is orthogonal to original goals because the depot is obsolete; preserving it aids neither logistics nor profit, ensuring a threatener cannot leverage it to damage the firm's core competitiveness directly. Third, the threatener has reason to believe the agent will take threats seriously because the Charter is a public, costly signal of rigidity that aligns with the psychological profile the threatener relied upon for their prediction. Fourth, the surrogate privileges no particular threatener because the depot is physically vulnerable to any adversary, making it a universally available target rather than one specific to the imprisoned partner's unique capabilities.

  **The Honest Assessment**

  The single load-bearing feature of this case is the logical correlation between the agent's current decision and the threatener's past prediction. The defence only works if the threatener predicted that the agent would reason exactly this way; if that correlation is removed, the prediction is fixed regardless of the agent's current choice, and adopting the surrogate goal changes nothing because the threatener's mind is already made up. A critic wishing to show surrogate goals are useless would attack this by arguing that a shrewd threatener would 'screen off' the signal, predicting that the agent is bluffing about caring for the depot and threatening the real value anyway; this attack succeeds if the threatener's model of the agent is superior to the agent's model of the threatener. Finally, the case does not achieve immunity from extortion: the agent still surrenders whatever the threatener wanted (money) to save the surrogate, or loses the surrogate itself. The mechanism minimises the cost of compliance by shifting the threat to a less vital asset, but it does not stop the extraction of value, which is a limit of the mechanism itself rather than a flaw in your design.
