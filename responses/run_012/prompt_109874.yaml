answer: |-
  The fluorescent lights in the regulatory office hummed at a frequency that Ruth felt in her teeth. It was 4:15 PM on a Friday. The deadline for the BrightPath Clinic audit was 5:00 PM. If she didn't file the classification report, the system would auto-flag the clinic for suspension, triggering an investigation she didn't have the staff to run. If she did file it, she needed to pick the right code.

  Code 44-B: Preemptive Neural Dampening. Anaesthesia.
  Code 71-F: Retroactive Cognitive Suppression. Memory Editing.

  On her screen, the patient files for the BrightPath "Null-Field" generator scrolled by. Three hundred and twelve procedures. Zero complaints of pain. Zero instances of intra-operative movement. The success rate was statistically impossible, which was why she was here instead of at home.

  Her boss, Henderson, had stuck his head in an hour ago. "Just mark it 44-B, Ruth. The patients say they slept. The logs show the field was active. Why are we burning overtime on this?"

  "Because the logs show a latency spike," Ruth had said, not looking up.

  "Forty milliseconds. It's noise."

  "It's a window."

  Now, the office was quiet except for the hum and the click of her mouse. She opened the file for Subject 402. Mr. Henderson (no relation), age 54. Procedure: dorsal nerve realignment. Pain expectation: Level 9 out of 10.

  She played the interview recording. Mr. Henderson's voice was flat, relaxed. "Honestly? I counted to three, and then I was in the recovery room. Didn't feel the cut. Didn't feel the stitch. Felt like blinking."

  Standard anaesthesia talk. But Ruth toggled to the device telemetry. The Null-Field worked by projecting a counter-signal into the somatosensory cortex. For 44-B to apply, the counter-signal had to arrive before the pain signal completed its processing chain. It had to stop the show before the curtain went up.

  She zoomed in on the timestamp of the incision. The nociceptors fired at T-minus 0.00. The Null-Field engagement registered at T-plus 0.04.

  Forty milliseconds.

  In neurology, forty milliseconds was an eternity. It was enough time for a signal to travel from the spine to the thalamus and brush against the wider network. If the signal reached the network before the Null-Field killed it, the patient experienced the pain. If the Null-Field wiped the short-term buffer immediately after, the patient simply wouldn't remember it.

  That was 71-F. That was memory editing. That was torture followed by erasure.

  Ruth leaned back, rubbing her eyes. She needed proof of conscious registration. She couldn't ask the patients; if it was 71-F, they genuinely believed they felt nothing. Their honesty wasn't the variable. The variable was the definition of "felt."

  She dug deeper into the raw data streams. Most auditors stopped at the summary logs, but BrightPath stored the buffer dumps for debugging. She hadn't seen these in the initial package. They were encrypted, but she had the override key for a Level 5 audit.

  The decryption bar crawled across the screen. When it finished, a new window opened: *Raw Cortical Activation Map.*

  She found the spike corresponding to the incision. It was there. A bright, jagged bloom of red on the grayscale map. The pain signal hadn't just entered the building; it had walked into the lobby. The Null-Field hadn't stopped it at the door; it had escorted it out after the fact.

  Ruth's heart hammered against her ribs. This was it. This was the evidence. The signal was processed. The brain had received the data.

  But then she paused. Her hand hovered over the mouse.

  Processing data wasn't the same as experiencing it. The brainstem processed reflexes without consciousness. The thalamus routed signals without awareness. For 71-F to stick, she needed to prove the signal reached the global workspace—the place where data becomes experience. The place where *you* know that *you* are hurting.

  The map showed the signal reached the parietal lobe. It didn't show whether the lights turned on.

  She opened a second file. Subject 108. A younger woman. Her buffer dump showed the same red bloom. But there was something else. A secondary spike in the amygdala, timestamped at T-plus 0.035. Fear response.

  Ruth sat up straighter. Fear wasn't a reflex. Fear was an emotional tag. You couldn't be afraid of a pain you didn't know was happening. The amygdala lit up before the Null-Field wiped the memory.

  This was the smoking gun. The body remembered the fear even if the mind forgot the pain.

  She began to type her findings into the draft report. *Evidence suggests retroactive suppression. Amygdala activation indicates emotional registration prior to dampening.*

  She stopped. Her fingers hovered over the keys.

  Could the amygdala fire on a sub-conscious loop? If a loud noise happens while you sleep, you might startle. Your body reacts. Your brain processes the threat. But you don't wake up. You don't feel the fear. You just jerk.

  Was the amygdala spike a feeling, or was it just a reflex with extra steps?

  If she filed 71-F, BrightPath Clinic would be shuttered. The three hundred and twelve patients would be notified that their "painless" procedures were actually instances of unconsented agony. The lawsuits would bury the state. The technology would be banned, meaning future patients would have to endure the pain fully, with traditional anaesthesia that carried higher mortality risks for some demographics.

  If she filed 44-B, the clinic stayed open. The patients kept their peace of mind. The technology remained available. But if she was wrong, she had just certified a machine that tortured people and hid the evidence.

  She looked at the timestamp again. T-plus 0.04.

  There was no test for consciousness. There was no meter that measured "qualia." She could measure electricity, chemistry, blood flow. She could measure the memory of the event. She could not measure the event itself.

  The distinction existed in law, in ethics, in her job description. It did not exist in the data. The data was compatible with both stories. The brain could have built the experience and then deleted it, leaving no trace but the ghost of a fear response. Or the brain could have processed the signal as noise, triggered a safety reflex, and never let it into the light.

  From the inside, for the patient, it was identical. A blink. A void.

  From the outside, for Ruth, it was a chasm.

  H Henderson's voice echoed in her head. *Just mark it 44-B.*

  She looked at the amygdala spike. It was small. Within standard deviation for surgical stress even under anaesthesia. She could argue it was anticipatory anxiety before the cut, not a reaction to the pain itself. The timestamp was close enough to blur the line.

  She deleted the paragraph about the amygdala.

  She deleted the paragraph about the buffer dump.

  She highlighted the summary log instead. *Null-Field engagement within acceptable latency parameters. Patient reports consistent with unconsciousness.*

  It was a lie. Or it was the truth. She couldn't know. That was the terror of it. The universe didn't care which box she checked. The electrons in the server didn't change based on her classification. The only thing that changed was the legal reality.

  If she checked 71-F, she created victims. If she checked 44-B, she potentially protected a torturer.

  But creating victims was certain. Protecting a torturer was theoretical.

  Ruth took a sip of cold coffee. It tasted like metal. She moved the cursor to the dropdown menu. The options stared back at her.

  *Preemptive Neural Dampening.*
  *Retroactive Cognitive Suppression.*

  She thought about Mr. Henderson, the patient. He was happy. He was back at work. He trusted the system. If she called him a victim, she took that away. She gave him a memory of pain that he didn't have. She would be editing his memory just as effectively as the machine, only she would be writing pain instead of erasing it.

  She clicked 44-B.

  She attached the summary logs. She ignored the buffer dumps. She typed her name at the bottom of the form.

  *Auditor: R. Vance. Status: Approved.*

  She hit send. The progress bar filled instantly. The file moved to the server, joining the thousands of others. The hum of the lights seemed to get louder.

  Ruth closed the laptop. She didn't pack her bag immediately. She sat in the quiet office, watching the cursor blink on the black screen. She wondered if, somewhere in the code of the Null-Field, there was a flag she hadn't seen. A boolean variable. *Consciousness = True/False.*

  But there wasn't. There never would be.

  She stood up, turned off the lights, and walked out into the hallway. The door clicked shut behind her, locking the data in the dark.

