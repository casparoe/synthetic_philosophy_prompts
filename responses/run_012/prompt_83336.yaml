answer: |-
  **OFFICE OF DIACHRONIC CONSUMER PROTECTION**
  **GUIDANCE NOTE 742: PREFERENCE CYCLE LIABILITY AND ARBITRAGE RECOVERY**
  **REF: ODCP-PC-2024**
  **DATE: 14 OCTOBER 2024**

  **1. MANDATE AND SCOPE**
  1.1. Under the Consumer Rationality Act (2023), the Office of Diachronic Consumer Protection (the Office) is empowered to identify and remediate preference structures liable to wealth erosion via sequential trade.
  1.2. It is the statutory position of the Office that the existence of a circular preference ordering constitutes a actionable consumer harm, regardless of whether a third-party arbitrageur has actively engaged the consumer.
  1.3. This note outlines the methodology for assessing the Potential Arbitrage Levy (PAL) and the procedures for declaring Diachronic Consistency.

  **2. DEFINITIONS**
  2.1. **Circular Preference Ordering:** A state wherein a consumer prefers Option A to Option B, Option B to Option C, and Option C to Option A, when evaluated pairwise.
  2.2. **Money Pump Event:** A sequence of voluntary trades wherein a consumer exchanges an asset for a preferred asset plus a fee, repeatedly, returning to the original asset with reduced total wealth.
  2.3. **Exploitability:** The structural capacity of a preference ordering to sustain a Money Pump Event. Exploitability is treated as a standing disposition inherent to the consumer's utility function.
  2.4. **Diachronic Rationality:** Compliance with preference consistency over time. Note that Diachronic Rationality may diverge from Synchronic Rationality (see Section 4).

  **3. LIABILITY CALCULATION**
  3.1. Liability for the Potential Arbitrage Levy (PAL) is triggered upon audit confirmation of a Circular Preference Ordering.
  3.2. The Levy is calculated based on the maximum theoretical extraction possible within a standard trading window (defined as 24 hours), minus a statutory Handling Fee of 15%.
  3.3. **Rationale:** As private arbitrageurs are prohibited from executing money pumps under Section 8 of the Act, the Office collects the theoretical loss on behalf of the State. This prevents the consumer from retaining wealth they were structurally destined to lose.
  3.4. Payment is required even if the consumer claims they would have refused specific trades in the sequence. The liability attaches to the *capacity* to be pumped, not the execution.

  **4. DIACHRONIC ASSESSMENT AND LOCAL RATIONALITY**
  4.1. Consumers often argue that each individual trade in a sequence was rational at the time of execution (Synchronic Rationality).
  4.2. The Office acknowledges that a consumer may strictly prefer A to B at Time 1, B to C at Time 2, and C to A at Time 3. Each pairwise decision satisfies local utility maximization.
  4.3. However, the sequence results in a net loss of capital with no change in asset holding. Therefore, while locally rational, the sequence is globally irrational.
  4.4. Consumers are liable for the global outcome regardless of local justification.

  **5. EXEMPTIONS AND CHOOSER CLASSIFICATIONS**
  5.1. Consumers may apply for exemption from the PAL by proving they are not susceptible to sequential exploitation. Two classifications are available:
      5.1.1. **Type-R (Resolute) Status:** The consumer commits to an initial plan and refuses subsequent trades that deviate from it, even if those trades offer locally preferred options. Requires filing Form 12-R.
      5.1.2. **Type-S (Sophisticated) Status:** The consumer anticipates future preference reversals and rejects the initial trade to prevent the sequence from beginning. Requires filing Form 12-S.
  5.2. **Evidence Requirements:** Applicants must provide notarized proof of binding precommitment devices. Verbal assertions of willpower are insufficient.
  5.3. **Audit Note:** Historical data suggests 94% of claimed Type-R consumers revert to local maximization under stress. Provisional Levy applies during review.

  **6. PREFERENCE LOCKING SERVICE**
  6.1. To assist consumers in maintaining Diachronic Rationality, the Office offers a voluntary Preference Locking Service (PLS).
  6.2. Under PLS, the Office temporarily freezes the consumer's ability to engage in pairwise trades involving identified cycle assets.
  6.3. **Fee Structure:** A daily administration fee applies for the duration of the lock.
  6.4. **Warning:** Consumers who utilize PLS are exempt from the PAL but remain liable for the PLS fee. In most market conditions, the PLS fee is lower than the theoretical extraction by a private arbitrageur, representing a net saving for the consumer.

  **7. WORKED EXAMPLE**
  7.1. **Subject:** Citizen 8940.
  7.2. **Holdings:** One Apple. Market Value: $1.00.
  7.3. **Preferences:** Apple > Banana; Banana > Coconut; Coconut > Apple.
  7.4. **Sequence:**
      7.4.1. T1: Trades Apple + $0.10 for Banana. (Rational: Prefers Banana).
      7.4.2. T2: Trades Banana + $0.10 for Coconut. (Rational: Prefers Coconut).
      7.4.3. T3: Trades Coconut + $0.10 for Apple. (Rational: Prefers Apple).
  7.5. **Outcome:** Citizen holds One Apple. Net Loss: $0.30.
  7.6. **Assessment:** Citizen 8940 is liable for the PAL. The Office charges $0.30 (theoretical loss) minus 15% handling fee. Total Due: $0.255.
  7.7. **Defense:** Citizen 8940 argues they would have stopped at T2.
  7.8. **Ruling:** Defense rejected. The preference ordering at T1 indicated willingness to trade. The disposition existed. Liability stands.

  **8. APPENDIX: REQUIRED FORMS**
  8.1. **Form PC-1:** Declaration of Preference Ordering ( Mandatory for all citizens).
  8.2. **Form 12-R:** Application for Resolute Chooser Exemption.
  8.3. **Form 12-S:** Application for Sophisticated Chooser Exemption.
  8.4. **Form PLS-Contract:** Agreement for Office-Administered Preference Locking.

  **9. CONTACT**
  9.1. Queries regarding the distinction between dispositional exploitability and actual loss should be directed to the Compliance Division. Please note that questioning the philosophical basis of the Levy may be construed as evidence of Type-R instability.

  **END OF GUIDANCE**
