answer: |-
  This is a frustration shared by many biologists who wander into social theory. The problem is that "evolution" is used in three distinct ways: as a metaphor for *change*, as a description of a *pattern*, and as a claim about a *mechanism*. When a philosopher or internet commenter says "culture evolves," they slide between these meanings to insulate the claim from criticism.

  Given your background, I will skip the pop-sci definitions and treat this as a structural analysis of the analogy. Here is the menu of claims hidden inside "memes are the genes of culture," ordered from trivial to radical.

  ### 1. The "Change Over Time" Claim
  **The Claim:** Cultural traits change in frequency within a population over generations.
  **Status:** **Trivial.**
  **The Logic:** This is the definition of evolution in its broadest sense (descent with modification). No one denies that slang, tools, or laws change over time.
  **The Geneticist's View:** This is equivalent to saying "allele frequencies change." True, but it says nothing about *how* or *why*. It does not imply natural selection; it could be drift, migration, or directed design.
  **Casual Arguer's Intent:** This is usually their fallback position. If you press them on mechanism, they retreat to: "Well, obviously culture *changes*, doesn't it?"

  ### 2. The "Variation and Selection" Claim
  **The Claim:** Cultural change is driven by a Darwinian algorithm: there is variation in traits, differential fitness (some traits are kept/copied more than others), and heredity (traits are passed on).
  **Status:** **Substantive but Defensible.**
  **The Logic:** This claims the *pattern* of selection exists, even if the substrate differs. You don't need DNA for selection; you need replication, variation, and differential survival.
  **The Geneticist's View:** Defensible, provided you loosen the definition of "replication." In genetics, replication is high-fidelity copying. In culture, it is often *reconstruction* (I hear your idea, understand it, and reconstruct it in my head). As long as the reconstruction is faithful enough to maintain identity, selection can act.
  **Casual Arguer's Intent:** This is what they *think* they are saying. They believe they have identified a causal mechanism, not just a pattern.

  ### 3. The "Particulate Inheritance" Claim
  **The Claim:** Cultural units (memes) are discrete, particulate, and stable, analogous to alleles.
  **Status:** **Controversial / Often False.**
  **The Logic:** Standard population genetics relies on particulate inheritance (genes don't blend; they segregate). If inheritance is blending, variation collapses rapidly, and selection loses its grip.
  **Fold-in (a) Blending:** Cultural inheritance is heavily blending. If I take half your idea and half his idea, the "units" are not preserved intact. This breaks the strict mathematical analogy to Mendelian genetics.
  **The Geneticist's View:** In genetics, the gene is a physical locus. In culture, the "meme" is rarely a discrete unit. Is "humming a tune" one meme? Is "believing in democracy" one meme? Without discrete units, you cannot calculate frequencies or selection coefficients rigorously.
  **Casual Arguer's Intent:** They assume ideas are "things" that move between heads like beads on a string. They ignore the reconstruction/blending problem because it complicates the model.

  ### 4. The "Weismann Barrier" Claim
  **The Claim:** Cultural inheritance operates without a germ/soma distinction, allowing acquired traits to be inherited (Lamarckism).
  **Status:** **Substantive and True (but breaks the strict analogy).**
  **The Logic:** In biology, changes to the soma (body) do not affect the germ line (genes). In culture, changes to the "soma" (your learned behavior) *are* exactly what gets passed on.
  **Fold-in (a) Lamarckism:** This is the strongest disanalogy. Cultural evolution is inherently Lamarckian. You can acquire a trait during your lifetime and pass it on immediately.
  **The Geneticist's View:** This doesn't stop selection from happening, but it changes the *dynamics*. It allows for directed variation (people modify ideas *before* passing them on to make them better). This means cultural evolution can be teleological (goal-directed) in a way genetic evolution cannot.
  **Casual Arguer's Intent:** They usually ignore this. They want the explanatory power of Darwinism (blind selection) without admitting that cultural evolution allows for "intelligent design" by the participants.

  ### 5. The "Fitness Tautology" Claim
  **The Claim:** A meme is defined as a unit of culture that spreads; therefore, memes spread because they have high fitness.
  **Status:** **Flatly False (Circular).**
  **The Logic:** If you define a meme *ex post facto* as "whatever succeeded in spreading," then "memes spread" is a tautology. It explains nothing.
  **Fold-in (b) Circularity:** In genetics, fitness is a predictive measure based on phenotype/environment interaction. In casual memetics, fitness is often just a label for "this idea won."
  **The Geneticist's View:** To avoid circularity, you must be able to identify the meme and predict its fitness *independently* of whether it actually spread. Casual memetics rarely does this. It identifies the winner and calls it a "fit meme."
  **Casual Arguer's Intent:** This is the most common logical error. They use "it spread" as proof of "it was fit," and "it was fit" as the explanation for "it spread."

  ### 6. The "Mathematical Identity" Claim
  **The Claim:** The equations of population genetics (e.g., Price equation, Hardy-Weinberg) can be applied directly to cultural data to predict outcomes.
  **Status:** **Substantive but Limited.**
  **The Logic:** Dual-inheritance theory attempts this. It treats cultural transmission as a parallel system to genetic transmission.
  **The Geneticist's View:** This works only when cultural transmission is vertical (parent to child) and high-fidelity. It breaks down with horizontal transmission (peer to peer) and low-fidelity reconstruction. It is a useful modeling tool, but not a law of nature.
  **Casual Arguer's Intent:** They rarely know the math. They invoke the *authority* of the math to suggest culture is as hard a science as genetics, without doing the work.

  ### 7. The "Ontological Independence" Claim
  **The Claim:** Memes are real causal agents that act in their own interest, potentially parasitizing human hosts (e.g., "religion is a virus").
  **Status:** **Radical / Metaphysical.**
  **The Logic:** This treats memes as replicators comparable to genes, where the human brain is merely the vehicle (phenotype).
  **The Geneticist's View:** In biology, the gene is a physical molecule. The "selfish gene" is a heuristic for how selection acts on alleles. In memetics, claiming the meme has "interests" independent of human psychology is a category error unless you can show the meme exists physically outside the brain.
  **Casual Arguer's Intent:** This is the "edgy" reading. It allows them to say "Humans don't choose ideas; ideas choose humans." It absolves them of explaining *why* humans choose certain ideas (psychology/sociology) by attributing agency to the idea itself.

  ---

  ### Summary of the "Sticking Points" in Context

  **On Blending and Lamarckism (Point a):**
  *   **Where it breaks the analogy:** It invalidates Claim 3 (Particulate Inheritance) and Claim 6 (Mathematical Identity). You cannot run standard population genetics on blending traits without modification.
  *   **Where it doesn't:** It does not invalidate Claim 2 (Variation and Selection). Selection can act on blending traits (e.g., quantitative genetics), and Lamarckism just adds a bias to the variation term.
  *   **The Casual Error:** Arguers assume that because selection *can* happen, the *mechanics* must be the same as genetics. They ignore that Lamarckian inheritance allows for foresight, which fundamentally alters the evolutionary trajectory.

  **On Circularity (Point b):**
  *   **Where it breaks the analogy:** It invalidates Claim 5 (Fitness Tautology). If "meme" = "successful idea," memetics is not a science; it is a redescription of history.
  *   **The Fix:** To make it substantive, a meme must be defined structurally (e.g., a specific neural pattern or behavioral sequence) *before* measuring its spread.
  *   **The Casual Error:** Arguers almost always define memes by their success. "Religion is a successful meme." How do you know it's a meme? "Because it spread." This is the logical vacuum that bothers you.

  ### The Verdict on the Casual Arguer
  When someone says "memes are the genes of culture" in an online argument:
  1.  **They intend Claim 2** (Selection is happening).
  2.  **They rely on Claim 3** (Ideas are discrete units) to make it intelligible, even though it's empirically shaky.
  3.  **They fall into Claim 5** (Circularity) when asked for evidence of fitness.
  4.  **They ignore Point (a)** (Lamarckism/Blending) because admitting it undermines the "blind selection" narrative they find compelling.

  **Bottom Line:** The statement is a **category metaphor**, not a mechanistic identity. It is useful for shifting perspective (looking at ideas as replicators), but it is scientifically empty unless specific, independent criteria for meme identity and fitness are established. As a geneticist, your instinct is correct: they are borrowing the rigor of your field without accepting the constraints of its machinery.
