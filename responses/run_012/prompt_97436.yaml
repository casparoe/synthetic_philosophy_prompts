      *   *Wait, I need to address the User's specific heuristic failure.* The new procedure must explicitly handle the "Counterfactual" problem (i.e., those cut off *wouldn't* have lost power otherwise). The justification is *Aggregate Harm Minimization*, not *Individual Inevitability*. I need to make sure the protocol reflects this shift.

      *Revised Protocol Logic:*
      1.  **Imminence:** Is system failure < X minutes away?
      2.  **Scale:** Is Controlled Loss < Uncontrolled Loss (by factor Y)?
      3.  **Specifics:** Does Controlled Loss include known Critical Infrastructure without backup?
      4.  **Decision:** If 1 & 2 are YES and 3 is NO -> Act. If 3 is YES -> Escalate/Override.

      *Let's tighten this for the "3 AM Supervisor".*
      *   Q1: Is collapse unavoidable without shedding? (Yes/No/Unknown)
      *   Q2: Is the affected population in the shed plan smaller than the likely collapse zone? (Yes/No)
      *   Q3: Does the shed plan include known life-support dependencies without verified backup? (Yes/No)
      *   Q4: (The Value Gate) If Q1 is "Unknown" or Q3 is "Yes", do you accept the risk of collapse to spare specific identified harm?

      *Actually, let's make it a scoring system?* No, too slow. Flowchart is better.
      *   Let's create the **Emergency Load Shed Decision Tree (ELSDT)**.

  8.  **Final Polish of the Test Cases:**
      *   *Case 1 (Rolling Blackout):* Classic. Procedure should authorize.
      *   *Case 2 (Wildfire):* PSPS. Procedure should authorize (Fire > Power).
      *   *Case 3 (Against Instinct):* **The "Ghost Load" Scenario.** A sensor error suggests a deficit. Shedding cuts power to a known nursing home generator feed (they rely on grid for backup charging). Waiting 10 mins might clear the sensor.
      *   *User Instinct:* Cut power (Control the harm).
      *   *Procedure Result:* DO NOT CUT (Data uncertainty + High Vulnerability).
      *   *Why:* This challenges the "Control the bite" instinct by prioritizing data certainty and specific vulnerability over the desire for control.

  9.  **Final Review against Constraints:**
      *   Decision procedure? Yes.
      *   Questions in order? Yes.
      *   Sufficient answers? Yes.
      *   Stop points? Yes.
      *   Hand-off to person? Yes.
      *   Run on 3 cases? Yes.
      *   Honest critique? Yes.
      *   No reading recommendations? Yes.

      *(Self-Correction on Case 3)*: The prompt asks for a case the procedure resolves *against the user's instincts*. The user said: "I would rather know where it bites." So the user prefers deliberate action. The procedure should therefore recommend *inaction* (risking the cascade) in Case 3, forcing the user to accept uncertainty.
      *Scenario:* Frequency is dipping. 40% chance of cascade in 20 mins. Shedding guarantees outage to a zone with a known water pump station (sewage risk).
      *User Instinct:* Shed now. Control the outcome.
      *Procedure:* Probability too low + Critical Infrastructure at risk = Do Not Shed.
      *This works.*

  10. **Drafting the Content.** (Focusing on clear, bold headers, operational language).
      *   Make sure to explicitly mention the "Judgment Calls" section.
      *   Ensure the distinction between "Fact" and "Value" is clear in the hand-off step.

  11. **Final Polish:** Check tone. Empathetic but firm. Acknowledge the burden. (Proceed to generate output).

  *(Wait, one last check on the "Hand off to a person" requirement)*: The prompt says "the shift supervisor has to decide alone in the moment." So the "hand off" isn't to a boss, it's to the supervisor's own moral agency. The procedure must identify *where* the algorithm ends and the human responsibility begins. I will label this the "Human Override Gate."

  *(Refining the "Against Instinct" case)*: The user says "I would rather know where it bites." This implies a preference for Commission over Omission. To challenge this, the procedure must force Omission (letting the risk happen) when the Commission (cutting power) targets a highly vulnerable group, even if the risk is significant.
  *Case 3:* **The "Critical Feeder" Dilemma.**
  *Situation:* Grid stress high. Cascade probability 60%.
  *Option A (Shed):* Cuts Feeder 42. Feeder 42 serves a small rural hospital with *faulty* backup generators (known maintenance issue).
  *Option B (Ride):* 60% chance of regional blackout (including the hospital). 40% chance grid stabilizes.
  *User Instinct:* Shed. (Better to guarantee the hospital loses power for 1 hour than risk them being down for 24 hours in a collapse).
  *Procedure:* If Known Life-Support + Known Backup Failure = **NO SHED**. (Because deliberately cutting a known failing life-support system is active killing vs. passive risk).
  *Wait, that feels too strong.* Let's adjust.
  *Procedure:* If Vulnerability is High + Probability of Collapse is < Threshold (e.g., 75%), then **NO SHED**.
