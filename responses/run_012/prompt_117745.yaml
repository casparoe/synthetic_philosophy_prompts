answer: |-
  **Joint Statement on Invertebrate Sentience and Moral Uncertainty**

  **1. Agreed Claims**

  1.  Current biological science does not establish which taxa possess sentience, whether sentience admits of degrees, or which neural or behavioural markers are definitive. We treat the underlying biology as genuinely unresolved.
  2.  Both groups accept the structure of the scale argument: if sentient invertebrates exist in vast numbers, the aggregate moral value could exceed that of vertebrate welfare, provided the probability of sentience is non-zero.
  3.  We distinguish between *token uncertainty* (uncertainty about whether a particular individual is sentient) and *kind uncertainty* (uncertainty about whether the kind to which it belongs is sentient at all).
  4.  We acknowledge *the common-cause problem*: if sentience is a property of a kind, *kind uncertainty* is shared across all members, meaning individual-level probabilities are not independent draws but reflections of a single unresolved fact.
  5.  **Concession by Group 1:** We accept that if *the common-cause problem* obtains fully, *the additivity assumption* (that moral value aggregates by simple summation across individuals) is compromised, potentially invalidating standard expected-value calculations.
  6.  **Concession by Group 2:** We accept that if *kind uncertainty* is resolved positively, the sheer scale of invertebrate populations dictates that invertebrate welfare becomes the overwhelming moral priority, dwarfing vertebrate-focused work.
  7.  Both groups acknowledge *the sign problem*: uncertainty regarding whether interventions improve or worsen welfare remains significant regardless of sentience status.
  8.  Both groups agree that *the option value of research* is non-zero; resolving uncertainty may itself be the highest-value intervention under either side's commitments.

  **2. Disagreements**

  **Disagreement A: The Applicability of Summation**

  *   **Group 1 Formulation:** Even under *kind uncertainty*, we must assign a credence to the proposition that the kind is sentient. This credence functions as a probability weight applicable to the aggregate population. Therefore, *the additivity assumption* survives because the expected value of the whole kind is simply the value of the kind multiplied by the probability of the kind's sentience.
  *   **Group 2 Formulation:** *The common-cause problem* defeats the arithmetic rather than merely depressing it. Because *kind uncertainty* is not distributed independently across tokens, plugging probabilities into an expected-value calculation where they do not belong creates an artefact. We cannot sum across individuals when the uncertainty is structural rather than stochastic.
  *   **Neutral Restatement:** The groups disagree on whether *the additivity assumption* remains valid when *kind uncertainty* is present. Group 1 maintains that expected value can be calculated at the level of the kind and applied to the population, while Group 2 maintains that structural uncertainty precludes summation entirely.

  **Disagreement B: Priority of Action versus Investigation**

  *   **Group 1 Formulation:** Because the expected quantity of morally significant experience is so vast, the rational priority is to act on invertebrate welfare now. Uncertainty dampens the verdict without overturning it. Deferring action sacrifices too much potential value.
  *   **Group 2 Formulation:** Because the uncertainty is structural, the *option value of research* outweighs immediate intervention. Acting under *kind uncertainty* risks large-scale harm due to *the sign problem* without securing any moral gain if the kind is not sentient.
  *   **Neutral Restatement:** The groups disagree on the weighting of *the option value of research* against immediate intervention. Group 1 prioritises acting on expected value despite uncertainty, while Group 2 prioritises resolving *kind uncertainty* before committing to large-scale intervention.

  **3. Cruxes Table**

  | Sub-question | Case or Thought Experiment | Group 1 Prediction | Group 2 Prediction | Type |
  | :--- | :--- | :--- | :--- | :--- |
  | **Correlation of Sentience** | Imagine a species where neural complexity varies wildly between individuals due to environmental factors, unrelated to phylogeny. | *Token uncertainty* will dominate; sentience will correlate with individual neural metrics, validating summation across tokens. | *Kind uncertainty* will persist; if the species lacks the requisite architecture, no individual is sentient, regardless of variation. | Empirical (not presently resolvable) |
  | **Decision Rule** | A 'Single Switch' scenario: one action affects all members of a kind simultaneously. Either all are sentient or none are. | Expected value still applies; we multiply the total value of the kind by the probability of the switch being 'on'. | Expected value fails; this is a gamble on a fact, not a sum of probabilities. *The additivity assumption* collapses. | Conceptual |
  | **Intervention Sign** | An intervention reduces population size but improves individual welfare conditions for survivors. | Net positive if the welfare gain per token outweighs the loss of tokens, weighted by probability of sentience. | Net indeterminate; if *kind uncertainty* is high, we cannot know if we are harming subjects or merely removing non-sentient objects. | Evaluative |

  **4. Verbal Dispute and Remaining Disagreement**

  There exists a merely verbal dispute regarding the definition of 'probability' in this context. Group 1 employs a Bayesian interpretation where credence in *kind uncertainty* functions mathematically identically to frequency data regarding *token uncertainty*. Group 2 insists that credence in a structural fact is categorically distinct from frequency data.

  A stipulation that dissolves this verbal dispute is to agree that 'probability' refers strictly to degrees of belief rather than objective frequencies. However, even under this stipulation, a genuine disagreement remains. The dispute is not merely about the label attached to the uncertainty, but about whether *the additivity assumption* is permissible when the uncertainty concerns a shared property rather than independent traits. Consequently, the divergence in recommended action persists even if the terminology is unified.

  **5. Closing: Conditions for Revision**

  Both groups commit to revising their positions should specific evidence or arguments emerge.

  **Group 1** would abandon the priority of immediate action if it were demonstrated that *the common-cause problem* renders expected-value calculations incoherent rather than conservative. Specifically, if it is shown that *kind uncertainty* cannot be modelled as a weighted probability without violating decision-theoretic axioms, Group 1 accepts that the step from 'vast numbers' to 'moral priority' fails. This evidence is conceptual and obtainable through formal modelling.

  **Group 2** would abandon the priority of research if it were demonstrated that sentience varies sufficiently within kinds to convert *kind uncertainty* into *token uncertainty*. If biological markers show that sentience is not a property of the species or clade but of individual physiological states independent of phylogeny, Group 2 accepts that *the additivity assumption* is restored. This evidence is empirical. While currently beyond our technical reach, it is in principle obtainable.

  Both groups acknowledge that if *the sign problem* proves unsolvable—meaning we cannot determine the welfare valence of interventions even given sentience—the *option value of research* becomes absolute for both parties. Until such evidence is obtained, we maintain our respective positions while cooperating to refine the questions above.
