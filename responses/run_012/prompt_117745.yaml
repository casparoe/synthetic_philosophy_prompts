      *   *Kind Uncertainty Argument (Group 2):* Sentience is likely a property of a *kind* (species/clade), not randomly distributed among tokens. If the kind isn't sentient, *none* are. This is *The common-cause problem*. Therefore, you can't sum individual probabilities (*The additivity assumption* fails).
