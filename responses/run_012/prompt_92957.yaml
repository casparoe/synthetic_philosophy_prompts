      *   *Phrasing:* Ensure I use terms like "actant," "vital materialism," "thing-power" correctly but naturally.

  8.  **Final Polish:** Check flow between paragraphs. Ensure the transition from the "buy" to the "risk" to the "sceptic" is smooth. Make sure the British English is consistent (e.g., "programme" vs "program", "sceptic" vs "skeptic"). *Wait, "sceptic" is the British spelling, so that's good.*

