answer: |-
  To view the 1815 eruption of Mount Tambora through the lens of vital materialism or Actor-Network Theory (ANT) is to fundamentally alter the grammar of historical explanation. In the traditional historiography of the 'Year Without a Summer', the volcano is a trigger, a geological prelude to the human drama that follows. It is the first domino. But if we adopt the vocabulary of the 'actant'—that which modifies a state of affairs—we are asked to treat the sulphate aerosols, the ash clouds, and the dropping mercury in the thermometer not as background conditions, but as participants. We are invited to see history not as humans acting upon a stage, but as a collective of human and non-human forces entangling to produce the event.

  What, then, does this vocabulary actually buy us? Why trade the clean mechanics of 'cause and effect' for the murky waters of 'agency' and 'actants'?

  The primary purchase is a shift from linearity to relationality. In a standard causal model, the volcano erupts, the climate cools, and humans react. The volcano is passive in its aftermath; it does its work and recedes. In the vital materialist view, the volcanic ash remains an active force throughout 1816. It is not merely a cause of crop failure; it is a continuous obstruction that reshapes social networks. Consider the food riots in East Anglia or the emigration from New England to the American Midwest. A causal history says 'famine caused migration'. A materialist history asks how the cold itself reconfigured the possibilities of movement. The frost did not just kill the wheat; it hardened the roads, froze the rivers, and altered the caloric requirements of the labourer. It forced new alliances between magistrates and merchants, and broke old bonds between landlord and tenant.

  Furthermore, this lens illuminates the creative act at Villa Diodati. To say the cold weather 'inspired' Mary Shelley is to keep the weather outside the room, looking in. To say the weather was a co-author is to recognise that the gloom confined the party indoors, creating the specific pressure cooker of boredom and intimacy that necessitated the ghost story contest. The atmospheric pressure and the candlelight were not merely the setting; they were actants that constrained and enabled the narrative. The vocabulary of 'thing-power' allows us to see that the book *Frankenstein* is not just a human product, but a hybrid offspring of human imagination and volcanic stratospheric chemistry. It grants the non-human a dignity in the historical record, acknowledging that without the ash, the story does not exist in that form.

  However, this is where the harder half of the inquiry begins. There is a profound risk that in elevating the volcano to the status of an actor, we inadvertently slide back into the very environmental determinism these theories claim to dismantle. If the volcano is an 'agent' with the power to dictate history, where does human responsibility reside?

  The danger lies in the symmetrisation of power. ANT suggests we treat humans and non-humans symmetrically as nodes in a network. But history is not merely a network of effects; it is a terrain of moral choices. When harvests failed across Europe, the resulting catastrophe was not solely the work of the cold. It was the work of the Corn Laws in Britain, which kept grain prices artificially high to protect landowners. It was the work of speculative hoarding by merchants. It was the work of imperial administrators who prioritised export crops over subsistence farming in the colonies. If we focus too heavily on the 'agency' of the volcano, we risk obscuring the agency of the grain merchant who chose profit over relief.

  To say the volcano 'acted' is poetically potent, but analytically dangerous if it implies the volcano made the decisions. A volcano cannot be unjust; a government can. By granting the ash cloud the status of an actant, we might quietly write out the political decisions that turned a bad harvest into a famine. The 'Year Without a Summer' was not a natural disaster in the pure sense; it was a socio-natural crisis. The cold made the harvest fail, but the market made the people starve. If we treat the volcano as a historical agent equivalent to the British Parliament, we dilute the specific culpability of the latter. We risk returning to a 'climate made history' narrative, where human politics are merely the ripple effect of geological forces, absolving the powerful of the choices they made in response to the crisis.

  This brings us to the sceptic's objection. The sceptic argues that attributing agency to a mountain is a category mistake. Agency, they contend, requires intention, consciousness, or at least the capacity to have done otherwise. A volcano cannot intend to cool the climate; it simply obeys the laws of physics. To call it an 'actor' is to anthropomorphise geology, mistaking a blind force for a participant.

  Is the sceptic right? In a moral sense, yes. We cannot put a volcano on trial. We cannot reason with it. To imbue it with agency in a humanistic sense is indeed a confusion of categories. However, the sceptic may be missing the point of what vital materialism is attempting to achieve. The theory does not claim the volcano has *intent*; it claims the volcano has *effectivity*. The sceptic is holding onto a definition of agency that is exclusively humanist, rooted in the Enlightenment idea of the sovereign subject.

  What the sceptic misses is that human agency is also never pure. The British merchant making decisions about grain prices was also acting under constraints—market forces, laws, the physical spoilage of food, the pressure of creditors. If we deny the volcano agency because it lacks intention, we must also admit that human 'agency' is often just a complex reaction to material pressures. The vital materialist does not want to say the volcano is human; they want to say that the human is partly material.

  Therefore, the sceptic is right to warn against moral confusion, but wrong to dismiss the explanatory power of the concept. The error is not in calling the volcano an actant; the error is in assuming that 'actant' implies 'moral agent'. If we can hold both thoughts—that the volcano was a force that reshaped history, and that the humans remained the only entities capable of moral judgement—then the vocabulary holds.

  Ultimately, running Tambora through this theoretical mill yields a richer, if more complicated, history. It saves us from a dry recitation of climatic data by showing how the ash permeated the social fabric. But it demands vigilance. We must ensure that in listening to the 'voice' of the volcano, we do not drown out the voices of the starving, the rioting, and the governing. The volcano may have been an actant that changed the state of affairs, but it was humans who decided whether that change would be met with charity or speculation, with empathy or empire. The ash fell on everyone, but the burden was not shared equally. To recognise the power of the thing is not to excuse the actions of the man.
