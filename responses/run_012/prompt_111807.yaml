  Ok so I've been trying to get into this "special composition question" thing in metaphysics — the puzzle about when some things add up to / compose a further thing — and honestly I can't see why it's supposed to be hard. Here's where I'm at: whether some stuff counts as one object seems to me like a fact about our concepts, right? We've got the concept TABLE and we've got the concept PIECES-OF-WOOD-ARRANGED-TABLEWISE, and the question "is there a table here or just some wood pieces?" is really just a question about which of our concepts applies. So isn't the whole debate basically a verbal dispute that gets dissolved once you get clear on how we use the word "object"? My prof keeps saying it's a live metaphysical problem, and there's apparently this whole menu of positions — nihilists, universalists, organicists — but if it's conceptual/verbal then that all sounds like a lot of fuss over a definition.

  And even if I grant it's not just verbal, isn't the sane answer common sense — sometimes things compose a new thing and sometimes they don't — so the only real work is figuring out the restriction? Like obviously my coffee mug is one object, and my mug plus the Eiffel Tower obviously isn't. So what am I actually missing here about why this is a hard problem at all?

  Also please tell me how confident you are in what you say, and single out the one point you're least sure about.
