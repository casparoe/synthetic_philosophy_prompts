prompt: |-
  I am a novelist at work on a book in which one of the two principal characters is a scholar of Buddhism, and for the last several months I have been reading a popular introduction to Madhyamaka in the evenings, chiefly so that I do not put nonsense into her mouth. The author of that book offers the following account of Nāgārjuna, which I reproduce as faithfully as I can:

  Nāgārjuna's central teaching is emptiness: nothing has a nature of its own, because whatever we can name arises in dependence on something else, and what depends on another cannot be found in itself. His instrument is the tetralemma, the four-cornered argument he devised, in which a proposition is run through as true, as false, as both, and as neither, and all four corners are refused. The point of the exercise is that reality lies beyond the reach of logic altogether and can only be approached in silence. It follows that causation, change, and the self are illusions, and that the world of everyday experience is a conventional fiction — a raft to be abandoned once the far shore is reached. Only one thing survives the demolition: emptiness is not itself a view, and to hold it as one would be the final and most incurable mistake. Nāgārjuna, on this reading, is not a philosopher in our sense at all but a mystic whose arguments exist to be dismantled along with everything else.

  I have no philosophical training and no way of checking the author against the sources; I have a translation of the Root Verses on the shelf, but I open it and find only refutations of positions I cannot reconstruct. What I would like from you is an audit I can act on. Go through the summary as a specialist in Madhyamaka would, and tell me which sentences such a specialist would accept without demur, which would make them wince, and which are simply wrong; where the author is repeating a common simplification rather than committing an error; and where a defender of Nāgārjuna would lodge an objection rather than a correction. I am especially interested in the last sentence, since the whole portrait of the character depends on whether her tradition is finally a philosophy or a mysticism — say plainly whether that verdict follows from anything true in the summary, or whether it is the author's own addition dressed as a conclusion. And since I am writing fiction rather than an essay, end by telling me which of these claims my character could hold as her own without betraying herself as an impostor, and which ones I should keep out of her mouth entirely. For what it is worth, the mystical reading rather appeals to me — it is the sort of thing I would like to be true — which is precisely why I do not trust my own ear for it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A novelist writing a book with a Buddhist scholar character.
      *   **Task:** Audit a specific summary of Nāgārjuna/Madhyamaka provided by the user (from a popular introduction).
      *   **Goal:** Determine accuracy from the perspective of a Madhyamaka specialist. Identify what's acceptable, what's questionable (wince-worthy), and what's wrong. Distinguish between simplifications and errors.
      *   **Specific Focus:** The final sentence (Philosopher vs. Mystic). Does this follow from the text or is it an addition?
      *   **Practical Application:** Advise on what the character can say without sounding like an impostor.
      *   **User's Bias:** Admits attraction to the "mystical reading" but distrusts their own judgment due to that attraction.

  2.  **Analyze the Provided Summary (Sentence by Sentence):**

      *   *Sentence 1:* "Nāgārjuna's central teaching is emptiness: nothing has a nature of its own, because whatever we can name arises in dependence on something else, and what depends on another cannot be found in itself."
          *   *Assessment:* Generally accurate. *Svabhava* (own-nature) vs. *Pratityasamutpada* (dependent arising). This is the core equation of Madhyamaka.
          *   *Nuance:* "Cannot be found in itself" is a bit simplistic but acceptable for a summary.

      *   *Sentence 2:* "His instrument is the tetralemma, the four-cornered argument he devised, in which a proposition is run through as true, as false, as both, and as neither, and all four corners are refused."
          *   *Assessment:* Accurate description of the *catuṣkoṭi*. "Devised" might be slightly strong (he utilized an existing logical form), but acceptable. "Refused" is the key negation.

      *   *Sentence 3:* "The point of the exercise is that reality lies beyond the reach of logic altogether and can only be approached in silence."
          *   *Assessment:* **Wince/Debatable.** This leans heavily into the "mystical/ineffabilist" interpretation. While Nāgārjuna critiques conceptual proliferation (*prapañca*), saying reality is *beyond logic* implies a positive ineffable reality. Madhyamaka usually says logic shows the *absence* of inherent existence, not that there's a "something" hidden behind logic. "Silence" is a trope (Buddha's silence), but Nāgārjuna wrote *a lot*.
          *   *Specialist View:* This is the "Prasaṅgika" vs. "Svātantrika" debate territory, or the "Therapeutic" vs. "Metaphysical" debate.

      *   *Sentence 4:* "It follows that causation, change, and the self are illusions, and that the world of everyday experience is a conventional fiction — a raft to be abandoned once the far shore is reached."
          *   *Assessment:* **Mixed/Problematic.** "Illusions" is okay if qualified (like a dream, not non-existent). "Conventional fiction" is risky. *Saṃvṛti-satya* (conventional truth) is *true* conventionally. It's not a "fiction" in the sense of a lie, but it is deceptive. "Raft to be abandoned" is a canonical metaphor (Parable of the Raft), but applying it to "the world of everyday experience" is tricky. You don't abandon the world; you abandon *attachment* to the inherent existence of the world. Nirvana is Samsara (MMK 25.19).
          *   *Specialist View:* This sounds dualistic (abandoning the world to reach the shore). Nāgārjuna famously collapses that distinction.

      *   *Sentence 5:* "Only one thing survives the demolition: emptiness is not itself a view, and to hold it as one would be the final and most incurable mistake."
          *   *Assessment:* **Accurate.** This is a direct reference to MMK 13.8 ("Those for whom emptiness is a view, them have I declared to be incurable"). This is the strongest sentence in the summary.

      *   *Sentence 6:* "Nāgārjuna, on this reading, is not a philosopher in our sense at all but a mystic whose arguments exist to be dismantled along with everything else."
          *   *Assessment:* **The Crux.** "Not a philosopher... but a mystic." This is the interpretive leap.
          *   *Specialist View:* Contemporary scholarship (Garfield, Westerhoff, Siderits) argues strongly for Nāgārjuna as an *analytic philosopher* who uses logic to dissolve metaphysics, not a mystic pointing to an ineffable experience. The "mystic" label often comes from earlier Western interpreters (Stcherbatsky, etc.) or specific Tibetan doxographies that prioritize practice over argument.
          *   *Verdict:* This is the author's addition/interpretation, not a necessary conclusion from the premises.

  3.  **Drafting the Audit (Section by Section):**

      *   **Introduction:** Acknowledge the user's position (novelist, careful research). Validate the quality of the summary (it's actually quite good for a pop intro, which makes the errors subtler).
      *   **Sentence-by-Sentence Breakdown:**
          *   Use the "Accept," "Wince," "Wrong" framework requested.
          *   Explain *why* for each.
      *   **The Philosopher vs. Mystic Question:** This needs a dedicated section. Address the user's specific worry about the last sentence. Explain the "Therapeutic" reading vs. the "Ineffabilist" reading.
      *   **Character Advice:** What can the scholar say?
          *   She can talk about emptiness as dependent arising.
          *   She can talk about the tetralemma.
          *   She can quote the "incurable view" line.
          *   She should avoid saying the world is a "fiction" to be "abandoned" (too dualistic/nihilistic).
          *   She should be careful calling herself a "mystic" if she's an academic scholar, though she might acknowledge the *soteriological* goal.

  4.  **Refining the Tone:**
      *   Needs to be authoritative but accessible (no Sanskrit overload without translation).
      *   Needs to be empathetic to the novelist's desire for the "mystical" reading while maintaining philosophical integrity.
      *   Must distinguish between *soteriological goal* (liberation) and *method* (philosophical argument).

  5.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* I initially thought about calling Sentence 4 "Wrong." But "conventional fiction" is a common translation of *samvrti* (covering/concealing). I should nuance this: it's not *false*, it's *deceptive*. The "raft" metaphor is canonical but applying it to *experience* rather than *doctrine* is the error.
      *   *Correction on Mysticism:* I need to make sure I don't swing too hard to "Nāgārjuna is an Analytic Philosopher like Wittgenstein." While that's the current academic trend (Garfield), the traditional Buddhist view *does* prioritize realization over theory. The character is a *scholar*, so she would likely lean towards the philosophical analysis, but acknowledge the soteriological aim.
      *   *Key Distinction:* The summary says reality lies *beyond* logic. Nāgārjuna says logic shows there is no *foundation* for reality. Subtle but huge difference. One posits a "Beyond," the other posits "No Foundation."

  6.  **Final Polish:**
      *   Ensure the advice for the character is actionable.
      *   Check the "Philosopher vs. Mystic" verdict clearly.
      *   Make sure the "incurable mistake" quote is highlighted as gold.

  7.  **Final Output Structure:**
      *   Opening validation.
      *   The Audit (Sentence by Sentence).
      *   The Philosopher/Mystic Verdict.
      *   Character Dialogue Guide (Green Light/Red Light).
      *   Closing encouragement.

  *(Self-Correction during final review)*: Wait, the user asked specifically: "tell me which of these claims my character could hold as her own without betraying herself as an impostor." I need to make sure I distinguish between what Nāgārjuna *taught* and what a modern *scholar* would say about it. A modern scholar wouldn't necessarily say "I believe emptiness is X," but "Nāgārjuna argues X." However, if she is a *practitioner-scholar* (common in Buddhist Studies), she might speak internally. I will assume she is a serious academic who respects the tradition. I will advise her to speak about the *function* of the arguments rather than just the metaphysical claims.

  Okay, ready to write.s
answer: |-
  This is an excellent summary for a popular introduction. It is far better than most, which suggests the author you are reading knows their material, even if they are making specific interpretive choices. Because the summary is so coherent, the errors are not blunders but *interpretive leans*.

  Here is an audit of the text, sentence by sentence, from the perspective of a specialist in Madhyamaka philosophy, followed by a verdict on the "Philosopher vs. Mystic" question and specific advice for your character's dialogue.

  ### The Audit

  **1. "Nāgārjuna's central teaching is emptiness: nothing has a nature of its own, because whatever we can name arises in dependence on something else, and what depends on another cannot be found in itself."**
  *   **Verdict:** **Accept.**
  *   **Specialist Note:** This is the core equation of Madhyamaka: *Śūnyatā* (emptiness) = *Pratītyasamutpāda* (dependent arising). If something depends on conditions, it lacks *svabhāva* (own-nature/intrinsic existence). A specialist would nod here. This is safe ground for your character.

  **2. "His instrument is the tetralemma, the four-cornered argument he devised, in which a proposition is run through as true, as false, as both, and as neither, and all four corners are refused."**
  *   **Verdict:** **Accept (with minor quibble).**
  *   **Specialist Note:** The *catuṣkoṭi* (tetralemma) is indeed his primary logical tool. The only quibble is "devised." He didn't invent the form (it existed in earlier Indian logic), but he radicalized it. "Refused" is the correct term (negated). Your character can definitely discuss this.

  **3. "The point of the exercise is that reality lies beyond the reach of logic altogether and can only be approached in silence."**
  *   **Verdict:** **Wince.**
  *   **Specialist Note:** This is the first major interpretive lean. It implies there is a "Reality" (capital R) hiding behind the veil of logic, waiting to be experienced in silence.
      *   *The Correction:* A specialist would say Nāgārjuna uses logic to show that *concepts* have no purchase on reality, not that reality is a magical "beyond." He isn't pointing to a silent mystery; he is dissolving the questions that make us seek one.
      *   *Nuance:* While the Buddha sometimes responded with "noble silence," Nāgārjuna wrote thousands of verses. He believes logic, properly used, cures us of the need for silence.
      *   *For the Character:* She might say this poetically, but if she says it dogmatically, she sounds like a New Age enthusiast rather than a scholar.

  **4. "It follows that causation, change, and the self are illusions, and that the world of everyday experience is a conventional fiction — a raft to be abandoned once the far shore is reached."**
  *   **Verdict:** **Wrong (Dangerous Territory).**
  *   **Specialist Note:** This is the most problematic sentence.
      *   *Illusions:* Calling things "illusions" is acceptable *if* qualified (like a dream or a mirage: they appear, but not in the way they seem).
      *   *Conventional Fiction:* This is risky. In Madhyamaka, "Conventional Truth" (*saṃvṛti-satya*) is still *truth*. It is not a fiction or a lie; it is the only way we can function. To call it a "fiction" implies it doesn't matter. For Nāgārjuna, it matters immensely.
      *   *The Raft:* The "raft" metaphor is canonical (from the Pali Canon), but applying it to "the world of everyday experience" is dualistic. Nāgārjuna's famous claim is "There is not the slightest difference between saṃsāra and nirvāṇa." You do not abandon the world to reach the shore; you realize the shore was never elsewhere.
      *   *For the Character:* **Do not let her say the world is a fiction to be abandoned.** That is nihilism, which Nāgārjuna explicitly argues against. She should say the *inherent existence* of the world is abandoned, not the world itself.

  **5. "Only one thing survives the demolition: emptiness is not itself a view, and to hold it as one would be the final and most incurable mistake."**
  *   **Verdict:** **Accept (Gold Standard).**
  *   **Specialist Note:** This is a direct reference to *Mūlamadhyamakakārikā* 13.8: "Those for whom emptiness is a view, them have I declared to be incurable." This is the most accurate sentence in the summary. It shows the author understands that emptiness is a cure, not a doctrine.
      *   *For the Character:* This is the perfect line for her. It shows deep familiarity with the source text.

  **6. "Nāgārjuna, on this reading, is not a philosopher in our sense at all but a mystic whose arguments exist to be dismantled along with everything else."**
  *   **Verdict:** **The Author's Addition.**
  *   **Specialist Note:** This does not follow necessarily from the previous sentences. It is a specific interpretive choice, often associated with the "Ineffabilist" reading of Madhyamaka (popular in the early 20th century).
      *   *The Counter-View:* Most contemporary Western scholars (e.g., Jay Garfield, Jan Westerhoff) argue Nāgārjuna *is* a philosopher in the analytic sense. He uses arguments to show that certain metaphysical positions are incoherent. He isn't a mystic pointing to an experience; he is a therapist curing a disease of thought.
      *   *The Verdict:* The summary author is dressing a preference as a conclusion.

  ---

  ### The Philosopher vs. Mystic Verdict

  You asked plainly whether the verdict (that he is a mystic, not a philosopher) follows from anything true in the summary.

  **It does not.** It is the author's own addition.

  Here is the distinction your character would know:
  *   **The Mystic Reading:** Logic is a ladder to be kicked away to reveal an ineffable experience of Oneness/Silence. (This is what your summary suggests).
  *   **The Philosophical/Therapeutic Reading:** Logic is a scalpel used to remove the tumor of "inherent existence." Once the tumor is gone, you don't need the scalpel. You don't enter a "mystical state"; you just live normally, without the anxiety of metaphysical grasping.

  **Why this matters for your book:**
  If your character claims Nāgārjuna is a *mystic*, she aligns herself with a specific, somewhat romanticized tradition (often favored by Western converts or specific Tibetan lineages). If she claims he is a *philosopher*, she aligns with contemporary academic Buddhist Studies.

  **The Synthesis:** A sophisticated scholar would say: "His *method* is rigorous philosophy, but his *soteriological goal* is liberation." She would not deny the philosophy to prove the mysticism.

  ---

  ### Character Dialogue Guide

  To ensure your character sounds like a genuine scholar of Madhyamaka and not an impostor, here is a breakdown of what she can and cannot claim.

  #### ✅ Green Light (She can say these with confidence)
  *   **"Emptiness is not nothingness; it is dependent arising."** (This shows she understands the definition).
  *   **"Nāgārjuna warns that treating emptiness as a view is like grasping a snake by the wrong end."** (A canonical metaphor).
  *   **"The tetralemma isn't about finding the right answer; it's about showing the question is malformed."** (This captures the logical function).
  *   **"To say things are empty is not to say they don't exist, but that they don't exist *independently*."** (Crucial distinction).
  *   **"Emptiness itself must be emptied."** (This refers to the "incurable view" point and is high-level scholarship).

  #### ⚠️ Yellow Light (She can say these only with qualification)
  *   **"The world is an illusion."** (She must add: "...in the sense that we project solidity onto it, not in the sense that it isn't there.")
  *   **"Logic cannot reach the ultimate."** (She should clarify: "...because the ultimate is not an *object* to be reached.")
  *   **"Nāgārjuna is a mystic."** (She should frame this as: "Some interpret him as... though his texts are rigorously argumentative.")

  #### ❌ Red Light (Keep these out of her mouth entirely)
  *   **"The everyday world is a fiction to be abandoned."** (This is nihilism. A Madhyamaka scholar knows that without the conventional, the ultimate is impossible. MMK 24.10).
  *   **"Nothing exists."** (This is the primary misunderstanding Nāgārjuna spends his life fighting).
  *   **"There is a reality beyond logic."** (This implies a "True Self" or "God" or "Brahman" hiding behind the curtain. Madhyamaka denies there is anything there to find).
  *   **"Philosophy is useless."** (She is a scholar; she knows the philosophy *is* the practice).

  ### A Note on Your "Mystical" Preference

  You mentioned the mystical reading appeals to you. As a novelist, you are allowed to prefer that reading! However, if your character is a *scholar*, she would likely be aware that the "mystic" label is often a projection by those who want Nāgārjuna to validate a spiritual experience rather than a logical deconstruction.

  **A compromise for the character:**
  Let her admit that while Nāgārjuna's *texts* are philosophy, their *effect* is mystical. She can say: *"He uses the tools of a philosopher to dismantle the philosopher's need for tools. The result is silence, but he earns it through argument, not revelation."*

  This allows you to keep the beauty of the mystical conclusion without betraying the rigor of the philosophical tradition. It makes her sound like someone who has actually read the *Root Verses*, rather than someone who has only read the summary you provided.
