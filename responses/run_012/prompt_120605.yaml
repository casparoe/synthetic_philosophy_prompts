  **Title: Park Bench Logic**

  **Characters:** 
  **Buster:** A Golden Retriever who thinks he's loved.
  **Kant:** A scruffy terrier owned by a grad student.

  **Buster:** My human carried me up the stairs when I hurt my paw. He cried. He really cares about me.

  **Kant:** He doesn't care about *you*.

  **Buster:** What? He gave me the good treats. He sings to me.

  **Kant:** He's cultivating benevolence. You're just the prop. You aren't a rational agent, Buster. You're not an end in yourself.

  **Buster:** But… I'm the one eating the treats.

  **Kant:** And he's the one practicing virtue. If he kicked you, he wouldn't be wronging *you*. You can't be wronged. You don't have rights.

  **Buster:** But it would hurt.

  **Kant:** Sure. But morally? You're furniture with a pulse. The wrongness isn't in your pain, it's in his character damage. He's not hurting a dog, he's failing humanity.

  **Buster:** So when he thanks me for guarding the house…

  **Kant:** He's practicing gratitude. On you. For people.

  **Buster:** So I'm not really a boy?

  **Kant:** You're a good boy. But you're basically a moral dumbbell. He's not loving you, Buster. He's just doing reps.
