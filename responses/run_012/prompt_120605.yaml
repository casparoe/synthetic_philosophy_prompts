  I'm a backend engineer, so no philosophy training at all — my only exposure is a college roommate who was a philosophy major and used to rant at me while I played video games, which means I've retained about two and a half facts from the entire discipline. One of them is about Kant and animals. The way my roommate told it, Kant thought we have literally no direct duties to animals — not one. Any duty in the vicinity is a duty to humanity, so when you're kind to a dog you're not really doing anything for the dog, you're doing reps for your own moral character, and being cruel to an animal is wrong not because the animal is wronged but because it hardens you and makes you worse to people. Animals aren't persons on this picture, so no rights, and using them is fine in principle. I have a vague memory that he even says somewhere that being grateful to an old dog that served you loyally for years is really a duty owed to humanity rather than to the dog, which is such a weird way to put it that it's lived in my head rent-free ever since.

  Anyway, me and my freind have a long-running thing where we trade jokes on nerdy topics and score each other, and I want to submit one about Kant's view of animals. I dont want a joke that only needs the fact that Kant was uptight and loved rules — anyone could write that and it wouldn't be about the actual position. The punchline needs to turn on the real content: the indirect-duty structure, or the fact that the wrongness of cruelty is about what it does to you rather than to the animal, or the odd asymmetry that you can kill an animal for food but can't torment it. It should be funny to someone who knows the view cold, and someone who doesn't shouldn't come away thinking I've never heard of Kant. I'd love it if you made it a literal shaggy dog story, two dogs chatting in a park, one of them owned by a Kantian, or failing that a short monologue from the dog's perspective where he's a bit indignant that he's never actually the point of anything his owner does. No quotes or sources or reading suggestions needed, it's going in a group chat.
