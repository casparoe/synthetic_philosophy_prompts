prompt: |-
  I'm in a weird master's program that's half CS and half philosophy (long story) and I keep arguing with a friend who does AI safety work about how the labs actually get models to behave. Here's the thing that bugs me, and I'd like you to make philosophical sense of it rather than give me a tour of the field. On one hand, the standard move is to collect thousands of pairwise human comparisons — output A vs output B, which one's better — train a reward model on them, and then optimize the model against that reward, with a penalty for drifting too far from where it started. On the other hand, the same sort of lab will hand the model a written list of principles, or what they call a constitution, get it to critique its own draft answers against those principles, rewrite them, and then train on the rewrites. And then everyone acts shocked when the model finds a loophole in the reward and does something that scores great but is obviously not what anybody wanted — the specification-gaming thing, the letter of the rule versus the spirit of it.

  What I actually want is the implicit ethics of each of those two practices reconstructed, side by side. For the preference-comparison pipeline: what does it have to assume about value? That values are comparable across people, that they can be aggregated, that whoever you sampled is the right sample, that there's a fact of the matter about which of two outputs is better — and which of those does the practice strictly need versus just happen to fit comfortably with? Then do the same for the rules-and-self-critique pipeline: what does it assume about the form of morality — that it's codifiable in explicit rules a machine can apply, that a model critiquing its own output is doing anything like moral deliberation, that the regress of "rules for applying the rules" can be stopped somewhere? Then the part I care about most: are these two practices consistent with each other, or is the lab quietly running a preference-aggregation view in one pipeline and something rule-shaped or deontological in the other, and just not noticing? Tell me where each is underdetermined, i.e. where several rival theories would license the exact same engineering. And concretely, if you swapped the presupposed view for a rival — say, incommensurability of values, or a particularist who denies that any rule can capture what's morally salient in a situation — what would have to change in the code and the training setup, not just in the philosophy seminar? No citations needed, just the argument.

  Last line should start with "Verdict:" and give me a short phrase naming the view you think the practice really presupposes — and if the two pipelines disagree, name both.
