answer: |-
  **CITY OF RIVERTON**
  **DEPARTMENT OF TRANSIT & INFRASTRUCTURE**
  **REQUEST FOR PROPOSALS (RFP-2024-NS)**
  **SUBJECT: NEUTRAL SHELTER INITIATIVE**

  **1.0 PURPOSE AND VISION**
  The City of Riverton seeks proposals for the fabrication and installation of 150 Standard Transit Shelters (STS). The STS program aims to deploy infrastructure that is politically neutral, socially agnostic, and optimized for passenger flow. The City maintains that hardware neutrality ensures equitable access for all citizens. By removing subjective design elements, the STS will objectively increase ridership and reduce unauthorized occupancy. The City credits the physical structure with producing these social outcomes; pilot data indicates that specific surface angles reduce loitering incidents by 40% without human intervention. The shelter is not a social space; it is a logistical node. Vendors must demonstrate how their design facilitates movement without imposing cultural or political narratives on the waiting passenger. The goal is a frictionless environment where the artifact manages the user, not vice versa.

  **2.0 MANDATORY TECHNICAL REQUIREMENTS**
  2.1 **Seating Configuration:** Seating must consist of individualized contoured units. Continuous bench seating is prohibited to prevent multi-person occupation and ensure single-user turnover. Ergonomics should optimize comfort for a standard wait time of 10–15 minutes. Comfort beyond this duration is considered inefficient use of public space.
  2.2 **Surface Materials:** All surfaces must be non-absorbent and sloped where horizontal exposure exceeds 24 inches. This ensures rapid drainage and discourages prolonged recumbency unrelated to transit usage.
  2.3 **Data Integration:** Each unit must include embedded occupancy sensors and Wi-Fi handshake counters. Data will transmit to City Central to optimize route scheduling based on demographic flow.
  2.4 **Commercial Interface:** Each shelter must house two (2) illuminated digital ad panels. Panel content is managed by the City's Revenue Division. The shelter must structurally support commercial messaging without visual obstruction of transit signage. Revenue generation is a key component of shelter neutrality.
  2.5 **Accessibility:** Units must meet ADA slope requirements. However, entryways should remain open to ensure sightlines for security personnel, minimizing enclosed spaces that could obscure unauthorized activity.

  **3.0 EVALUATION CRITERIA**
  Proposals will be scored on a 100-point scale:
  *   Cost Efficiency (30 points)
  *   Durability & Vandal Resistance (25 points)
  *   Neutrality Compliance (25 points)
  *   Data & Revenue Integration (20 points)

  **4.0 ADDENDUM: VENDOR Q&A**
  *Following the pre-bid conference, the City received the following inquiries:*

  **Q1 (Apex Structures):** Requirement 2.1 specifies individualized seating to prevent multi-person occupation. Does the City acknowledge that designing out loitering is a social decision rather than a purely technical one?
  **A1:** The City does not make social decisions regarding infrastructure. We make operational decisions. Features that reduce loitering are classified as efficiency enhancements, not social engineering. The hardware produces improved flow outcomes regardless of intent.

  **Q2 (UrbanCore Solutions):** If the same STS model is installed on a park lawn versus a sidewalk outside a homeless services center, does the political neutrality of the artifact change based on context?
  **A2:** The artifact remains constant; external variables are outside procurement scope. The shelter's neutrality is inherent to its design specifications, not its location. Any perceived difference in impact is attributable to the population, not the object.

  **Q3 (CivicForm Inc.):** Requirement 2.3 requires demographic flow data. If the sensors track usage patterns to alter service allocation, is the City concerned that the hardware is effectively profiling neighborhoods?
  **A3:** Profiling implies intent. The sensors collect anonymized metadata for optimization. The City disclaims any intent to profile. However, vendors must guarantee the hardware can distinguish between riders and non-riders to ensure data integrity.

  **Q4 (Apex Structures):** You state the shelter is neutral, but Requirement 2.2 mandates slopes to discourage sleeping. How can a design intended to alter human behavior be considered neutral?
  **A4:** Altering behavior to match transit usage parameters is a functional requirement, not a political one. Neutrality means the shelter does not favor a specific ideology. Encouraging transit use over sleeping is an operational standard applicable to all users equally. The design modifies behavior to align with City policy, which is a technical implementation of existing law.

  **5.0 SUBMISSION**
  Submit sealed bids by November 15. The City reserves the right to reject any proposal that introduces subjective design elements. The selected vendor must certify that their product contains no embedded political assertions.
