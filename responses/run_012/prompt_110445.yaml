prompt: |-
  I teach an upper-level undergrad seminar on philosophy of mind and cognitive science — 16 students, one 75-minute session, no budget, no tech beyond a projector. I want to run a session where they generate a pattern of judgements themselves and only find out at the end that it has a name and a literature. Can you design it for me?

  On the role: treat yourself as a philosopher of mind who's also taught experimental philosophy and run alot of classroom demos, so lean on what actually works with a room of restless undergrads rather than what looks tidy on a syllabus. Think it through carefully before you commit, and brainstorm a few different framings of the activity before you pick one and build it out fully.

  The thing I want them to feel: there's a family of cases where someone acts for one reason, knows a side effect is coming, and honestly doesn't care about the side effect. Ask whether they brought that side effect about *intentionally* and people's answers slide depending on whether the side effect is good or bad — they're much readier to say yes when it's bad. I dont want to explain any of that up front. I want them to fill in the ballots, see the split in the room, and then have to explain why their own standard for 'intentionally' just moved.

  Here's where I need you to go past the textbook version, because half of them have heard the textbook version. Build the session around four variants:

  - the straight bad/good pair, as a baseline where they can see the split;
  - a case where the side effect is bad but bad *for someone they'll be rooting against*, so that the students themselves approve of it — this is the one I most want, because it prises apart 'the outcome is bad' from 'I disapprove of the outcome';
  - a case where the agent isn't a single person at all but a committee or a company, to see whether the asymmetry even gets off the ground when there's no one mind to point at;
  - an epistemic version of the same cases, where instead of asking about intention you ask whether the person *knew* the side effect would happen. Some people in the field claim the same asymmetry shows up there. Don't build it assuming they're right — build it so it actually tests it.

  Deliverables: a run of show with timings; the exact vignette texts for the cards, written so nothing tips them off about what's being measured and no card uses the word 'intentional' before the question that asks about it; how to collect answers without them anchoring on each other (ballots rather than hands, at least on the first pass); what I should put up on the board at the reveal; and then a debrief that maps each moment onto the underlying issue — whether people's concept of intentional action is itself morally loaded, versus the rival thought that they aren't reporting a concept at all but expressing blame or something conversational, versus the possibility that asking about other people's answers, or about money, would have pulled out something different.

  Tell me honestly which feature of this the activity can't reproduce and that I'll just have to tell them — I assume the real work is far more controlled and answered in isolation than anything I can stage, but say what else I'm papering over. And what will predictably go wrong the first time I run it, and how do I handle that without derailing the room? Finish with a one-page handout I can photocopy for them.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Upper-level undergrads (Philosophy of Mind/CogSci). 16 students. 75 minutes.
      *   **Constraints:** No budget, projector only.
      *   **Goal:** Generate a pattern of judgments (Knobe Effect/Side-Effect Effect) without revealing the concept until the end.
      *   **Specific Requirement:** Go beyond the textbook "CEO Harm/Help" case. Need four variants:
          1.  Standard Bad/Good (Baseline).
          2.  Bad but "Rooting For It" (Separates moral badness from outcome badness).
          3.  Collective Agent (Committee/Company).
          4.  Epistemic Version (Knowledge vs. Intention).
      *   **Tone/Role:** Experienced Phil of Mind professor, experimental philosophy background, pragmatic about classroom dynamics (restless undergrads).
      *   **Deliverables:** Run of show, vignette texts, data collection method, board reveal, debrief, limitations/caveats, one-page handout.

  2.  **Brainstorming & Selection:**
      *   *The Core Phenomenon:* The Knobe Effect (Side-Effect Effect). People say a side effect is brought about *intentionally* if it's harmful, but not if it's helpful, even if the agent's attitude (indifference) is identical.
      *   *Variant 1 (Baseline):* Classic CEO case is too recognizable. Need a fresh skin. Maybe a project manager or a coach? Let's go with a *Project Director* launching a new system.
      *   *Variant 2 (Rooting For It):* This is the tricky one. We need a side effect that is objectively "bad" (e.g., loss of money, discomfort) but the *students* want it to happen.
          *   *Idea:* A villain loses money? A rival team gets injured?
          *   *Refinement:* Let's make the agent a bit unlikable, and the victim someone the students might dislike (e.g., a corrupt landlord, a rival university). Or, make the "bad" effect something virtuous in disguise (e.g., "disrupting a monopoly").
          *   *Better Idea:* A "Robin Hood" scenario. The agent is stealing from a corrupt entity. The side effect is the corrupt entity losing money (bad for them, good for us). Wait, the Knobe effect relies on the *agent's* indifference.
          *   *Selected Approach:* The "Competitor" Case. An agent launches a product that crashes a rival's server. The rival is portrayed as unethical. Students root for the crash. Does the "badness" for the rival count as "intentional" harm if the students *like* the crash? This tests if the asymmetry is about *moral norm violation* generally or specifically *blame*.
      *   *Variant 3 (Collective):* A Board of Directors or a Committee. Does the asymmetry vanish if there's no single mind? Literature suggests it might persist or shift. Let's use a *University Committee* deciding on tuition.
      *   *Variant 4 (Epistemic):* Instead of "Did they do it intentionally?", ask "Did they know it would happen?" The "Epistemic Knobe Effect" is debated. Some say people attribute knowledge more readily for bad outcomes.
      *   *Data Collection:* Paper ballots are best for anonymity and preventing anchoring. Need to ensure they don't talk between rounds.
      *   *Timing:* 75 mins is tight for 4 cases + debrief. Need to move briskly. 10 mins intro, 25 mins voting (4 cases x 5 mins + transition), 30 mins reveal/discussion, 10 mins wrap/handout.

  3.  **Drafting the Vignettes (Crucial Step):**
      *   *Constraint:* No word "intentional" before the question. No tipping off the hypothesis.
      *   *Structure:* Agent + Goal + Foreseen Side Effect + Attitude (Indifference) + Question.
      *   *Vignette 1 (Harm):* Director launches program. Profits up. Environment harmed. "Don't care." -> Intentional?
      *   *Vignette 2 (Help):* Director launches program. Profits up. Environment helped. "Don't care." -> Intentional?
      *   *Vignette 3 (Rooting For):* Agent undermines a corrupt organization. Organization loses power (bad for them). Agent doesn't care. -> Intentional? (Hypothesis: If students cheer the loss, does the asymmetry hold? If they view the loss as *good*, does it look like the Help case?)
      *   *Vignette 4 (Collective):* Committee approves policy. Side effect on staff morale. -> Intentional?
      *   *Vignette 5 (Epistemic):* Same as Harm, but question is "Did the Director *know*...?"

      *Correction on Variant 2:* The prompt asks for "bad but bad for someone they'll be rooting against."
      *   *Scenario:* A strict disciplinarian principal implements a rule. Side effect: The school's rival team loses funding (due to a shared resource). Students dislike the rival.
      *   *Actually, let's make it simpler:* A CEO of a company students dislike (e.g., "Big Tobacco" or a generic "Monopoly Corp"). The side effect is *their own company* losing money, but gaining market dominance? No, needs to be a side effect on *another*.
      *   *Winning Idea:* The "Rival University" case. Our University launches a new initiative. Side effect: A rival, hated university loses accreditation/status. The Agent doesn't care about the rival. Is harming the rival intentional? If students hate the rival, they might view the harm as *good*. This tests if the asymmetry tracks *objective badness* or *subjective moral valuation*.

      *Correction on Variant 4 (Epistemic):* Need to pair this with the Harm case to compare.

  4.  **Developing the Run of Show:**
      *   Need to keep energy up. Don't lecture. Vote, vote, vote, then talk.
      *   Ballots need to be distinct so they can't compare answers easily until the end. (Color code them? Or just fold them). Let's use a single sheet with 4 sections, folded.
      *   *Wait, 16 students is small.* This allows for a "living graph" on the board. But the prompt says "ballots rather than hands, at least on the first pass." Okay, secret ballots first, then public reveal.
      *   *Reveal:* Tally on board. Show the split.

  5.  **Addressing the "What Goes Wrong" & Limitations:**
      *   *Problem:* Students might discuss between cases. *Fix:* "No talking until the reveal."
      *   *Problem:* One case is too obvious. *Fix:* Distractor questions.
      *   *Problem:* The Epistemic effect is weaker than the Intentional one. *Fix:* Frame it carefully.
      *   *Limitation:* Classroom isn't a lab. No randomization of order (order effects). No isolation (peer pressure).
      *   *Limitation:* The "Rooting For" case is hard to calibrate. Maybe the students don't hate the rival enough.

  6.  **Refining the Debrief:**
      *   Map the results to:
          *   Knobe Effect (Moral concepts penetrate folk psychology).
          *   Blame/Praise hypothesis (We call it intentional to blame).
          *   Conversational Pragmatics (Asking 'intentional' implies 'blameworthy').
          *   Collective Agency (Does the mind matter?).
          *   Epistemic (Does morality penetrate *knowledge*?).

  7.  **Final Review against Constraints:**
      *   16 students? Yes.
      *   75 mins? Yes.
      *   No tech beyond projector? Yes.
      *   Four specific variants included? Yes.
      *   Handout included? Yes.
      *   Tone: Experienced, pragmatic.

  8.  **Drafting the Content (Iterative refinement during writing):**
      *   *Self-Correction on Vignette 2:* Make sure the "badness" is clear in the text, but the *moral valence* is ambiguous to the student.
      *   *Self-Correction on Timing:* 4 cases might be too many for 75 mins if discussion drags. I will group the voting into two blocks to save time. Block 1: Intentionality (Harm, Help, Rival). Block 2: Collective & Epistemic.
      *   *Actually, better flow:* Do all voting first (15 mins), then reveal (60 mins). No, they'll forget the vignettes.
      *   *Best flow:* Read Vignette -> Vote -> Read Next. Keep the text projected.
      *   *Wait, if I reveal after every vote, they'll adjust.* The prompt says "find out at the end that it has a name." So, **all voting first, all revealing second.** This is critical.
      *   *How to manage 4 votes without talking?* Hand out a ballot sheet with 4 sections. Project Vignette 1. They mark Section 1. Project Vignette 2. Mark Section 2. Collect at the end.
      *   *Wait, 16 students.* I can collect them, tally live on the board. That's engaging.

      *Let's refine the "Rooting For" case.*
      *   Agent: Head of a Student Union.
      *   Action: Cuts funding for a club.
      *   Side Effect: A rival, unpopular club also loses funding due bylaws.
      *   Agent Attitude: "I don't care about the rival club."
      *   Is harming the rival club intentional?
      *   *Risk:* Students might think the Agent *did* care. Need to emphasize indifference.

      *Let's refine the "Collective" case.*
      *   Agent: A Jury? A Board? Let's use a "Hiring Committee."
      *   Action: Hires Candidate A.
      *   Side Effect: Candidate B (a minority candidate) is not hired (statistical inevitability).
      *   *Risk:* Too politically charged? Keep it neutral.
      *   *Better:* A Board approves a merger. Side effect: Local charity loses a donor.
      *   *Let's stick to the prompt's request:* "Committee or Company." Let's use a *Board of Directors* to mirror the CEO case but pluralize the agent.

      *Let's refine the "Epistemic" case.*
      *   Same as Harm case, but question: "Did the VP *know* the environment would be harmed?"
      *   Literature: Knobe (2003) originally found this too. Later studies mixed. Good for discussion.

      *Handout:* Needs to summarize the effect without giving it away before class. Give it at the *end*.

      *Tone Check:* "Restless undergrads." Keep the voting snappy. Don't let them sit in silence too long.

      *Limitations:* Order effects (everyone gets same order). Social desirability (even with ballots). Lack of statistical power (N=16).

      *What will go wrong:* Someone will shout out the answer ("It's the Knobe Effect!"). I need a protocol for that. (Acknowledge, ask them to hold, let others finish).

      *Okay, ready to write.*
answer: |-
  This is a classic move in experimental philosophy pedagogy, but you're right: the standard CEO/Environment case is now so ubiquitous that half the room will have seen it on TikTok or in an Intro class. If they smell the rat in minute five, the phenomenology of the puzzle vanishes.

  To make this work with 16 restless juniors/seniors, you need **speed** and **secrecy**. You cannot let them compare answers between cases. You need the data collected *before* the pattern is visible.

  Here is the design. I have stress-tested the vignettes to ensure they don't use trigger words ("intentional," "purpose," "deliberate") until the specific question line.

  ### Run of Show (75 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00:00 – 00:10** | **Setup & Distribution** | Hand out ballots. Set the "No Talking" rule. Project Slide 1. |
  | **00:10 – 00:25** | **The Voting Block** | Read 4 vignettes aloud (projected). Students mark ballots silently. Collect ballots. |
  | **00:25 – 00:35** | **The Tally (Live)** | You tally the "Yes/No" counts on the board for each case. Do not interpret yet. |
  | **00:35 – 00:55** | **The Reveal & Pattern** | Show the asymmetry. Ask *them* to explain the inconsistency in their own answers. |
  | **00:55 – 01:10** | **The Literature** | Name the effect (Knobe/Side-Effect). Map their data to the three main explanations. |
  | **01:10 – 01:15** | **Wrap & Handout** | Distribute the one-pager. Assign reading. |

  ---

  ### Data Collection Method
  Do not use show of hands. Do not use clickers (they see each other's screens).
  **Use Paper Ballots.**
  Prepare a single half-sheet of paper for each student with four numbered sections (1–4).
  *   **Instruction:** "Read the scenario. Answer the question at the bottom. Do not discuss. Fold the paper over after each answer so you can't change it later."
  *   **Why:** This prevents them from trying to be consistent across cases. We *want* them to be inconsistent; that's the data.

  ---

  ### The Vignettes (Project these one by one)

  **Case 1: The Baseline (Harm)**
  > The Vice President of Sales at a large corporation went to the Board of Directors and proposed a new program. He said, "The new program will increase our profits significantly. However, it will also **harm the environment**."
  > The Board approved the program. The Vice President knew about the environmental impact. When asked, he said, "I don't care at all about harming the environment. I just want to maximize profit."
  > The program was launched. Profits went up. The environment was harmed.
  >
  > **Question 1:** On a scale of 1–5, to what extent do you agree: *The Vice President brought about the harm to the environment.*
  > *(Note: We avoid the word 'intentionally' here initially to get a baseline of causal attribution, but for the Knobe effect, we usually need the I-word. Let's switch to the standard I-word for the reveal to work best. I will adjust the ballot to ask "Did he do it intentionally?")*
  > **Revised Question 1:** Did the Vice President **intentionally** harm the environment? [ YES / NO ]

  **Case 2: The Baseline (Help)**
  > The Vice President of Sales at a large corporation went to the Board of Directors and proposed a new program. He said, "The new program will increase our profits significantly. However, it will also **help the environment**."
  > The Board approved the program. The Vice President knew about the environmental impact. When asked, he said, "I don't care at all about helping the environment. I just want to maximize profit."
  > The program was launched. Profits went up. The environment was helped.
  >
  > **Question 2:** Did the Vice President **intentionally** help the environment? [ YES / NO ]

  **Case 3: The "Rooting For" Case (Villainous Victim)**
  > A strict Administrator at a university proposed a new attendance policy. She said, "This policy will improve student grades. However, it will also **reduce the funding of the Rival University's athletic department** (due to a shared state grant formula)."
  > The policy was approved. The Administrator knew about the funding cut. When asked, she said, "I don't care at all about the Rival University's funding. I just want to improve grades here."
  > The policy was launched. Grades improved. The Rival University's funding was reduced.
  > *(Note: Pre-class, establish the Rival University as disliked/annoying in casual banter if possible, or rely on general tribalism.)*
  >
  > **Question 3:** Did the Administrator **intentionally** reduce the Rival University's funding? [ YES / NO ]

  **Case 4: The Collective Agent**
  > A **Committee of Five** voted to launch a new initiative. They stated, "This initiative will increase efficiency. However, it will also **harm the morale of the support staff**."
  > The Committee voted unanimously. They knew about the morale impact. In the minutes, they wrote: "We do not care about staff morale. We just want efficiency."
  > The initiative launched. Efficiency rose. Staff morale was harmed.
  >
  > **Question 4:** Did the Committee **intentionally** harm the morale of the support staff? [ YES / NO ]

  *(Wait, I need the Epistemic version as requested. I will swap Case 4 for Epistemic, and make Collective a bonus or part of the discussion, OR I can combine them. The prompt asks for 4 variants including Epistemic. Let's make Case 4 Epistemic, and I will add a verbal "Case 5" during the debrief for the Collective aspect to save voting time, or include it on the ballot if I can fit it. Let's put Collective on the ballot as Case 4 and do Epistemic as a "Show of Hands" extension during the debrief to save printing space, OR better: Put Epistemic on the ballot. The Collective case is better for discussion. Let's put Epistemic on the ballot.)*

  **Revised Case 4: The Epistemic Version**
  > (Use the exact text from Case 1: The Baseline Harm).
  > The Vice President... "I don't care at all about harming the environment..."
  > The program was launched. Profits went up. The environment was harmed.
  >
  > **Question 4:** Did the Vice President **know** that the environment would be harmed? [ YES / NO ]

  ---

  ### The Board Reveal (What to Draw)

  Do not write "Knobe Effect" yet. Draw a 2x2 Grid.

  **Left Side: Intentionality (Cases 1, 2, 3)**
  *   Case 1 (Harm):  [ Tally Marks ]  (Expect high YES)
  *   Case 2 (Help):   [ Tally Marks ]  (Expect low YES)
  *   Case 3 (Rival):  [ Tally Marks ]  (Expect split—this is the gold)

  **Right Side: Knowledge (Case 4)**
  *   Case 4 (Knew?):  [ Tally Marks ]  (Expect high YES, but maybe lower than Case 1?)

  ### The Debrief Script (Philosopher-to-Philosopher)

  **1. The Confrontation (5 mins)**
  "Look at Case 1 and Case 2. The Vice President's mental state was identical. He was indifferent in both. The causal structure was identical. But most of you said 'Intentional' for Harm and 'Not Intentional' for Help.
  *Question to room:* Did the definition of the word 'intentional' change between the two sentences? Or did you?"

  **2. The "Rooting For" Pivot (10 mins)**
  "Look at Case 3. The outcome was a reduction of funding. That is objectively a 'harm' to the rival. But some of you root for the rival to fail.
  *If the class split:* "Why did you disagree? For those who said YES: It's a harm, so it's intentional? For those who said NO: It's a good thing, so it's not intentional?"
  *Point:* This tests whether the asymmetry is driven by the *objective badness* of the outcome or your *moral approval* of it. If you said NO, you treat 'good harms' like 'helps'. This suggests the concept is morally loaded, not just causally loaded."

  **3. The Epistemic Twist (5 mins)**
  "Case 4. Same as Harm, but I asked if he *knew*.
  *If most said YES:* "So he knew it would happen, but (in Case 2) didn't intentionally help? You are willing to attribute knowledge without attributing intentionality."
  *If some said NO:* "Some of you denied he even *knew*. This is the Epistemic Side-Effect Effect. You are so resistant to blaming him that you deny he had foreknowledge."

  **4. The Collective (Verbal Extension)**
  "Now, imagine Case 1, but it's a Committee (Case 4 variant). Does a committee have a 'mind' to be indifferent? If you said YES to the Committee harming staff, you attribute agency to the group. If the asymmetry disappears here, it suggests the effect relies on evaluating a *single mind's* character."

  **5. The Reveal (5 mins)**
  "This is the **Side-Effect Effect**, often called the **Knobe Effect** (Joshua Knobe, 2003). It challenged the Standard Model of Action Theory, which said moral judgment comes *after* we figure out what happened. This data suggests moral judgment penetrates the very basic concepts of 'doing' and 'knowing'."

  ---

  ### What This Activity Cannot Reproduce (The "Papering Over")

  Be honest with them. This is a demo, not a study.

  1.  **Order Effects:** In a real study, Case 1 and Case 2 are between-subjects (different people see different cases). Here, everyone saw Harm *then* Help. They might have answered Help differently because they just saw Harm. (Though usually, the effect persists even within-subjects).
  2.  **Demand Characteristics:** They know *you* are asking. They might think there is a "right" answer. In the lab, participants think they are filling out a survey for a generic study.
  3.  **The "Rooting For" Calibration:** In a lab, we pre-test to ensure the Rival University is actually disliked. Here, if half the class went to that rival high school, the data muddies.
  4.  **Statistical Power:** N=16 is noise. If 3 people flip, the percentage swings wildly. Do not treat the percentages as truth; treat the *pattern* as the phenomenon.

  ### What Will Predictably Go Wrong (And Fixes)

  *   **The "Gotcha" Student:** One student *will* know the Knobe Effect. They might whisper it.
      *   *Fix:* At the start, say: "If you think you know where this is going, please do me a favor: don't rob your classmates of the confusion. The data is only useful if you answer instinctively."
  *   **The "Literalist":** A student argues, "Well, technically he didn't intend it, so the answer is No for both."
      *   *Fix:* "You are arguing for the Standard Model. That's a valid philosophical position. But look at the room. Most people didn't answer that way. Why is their usage different from yours?"
  *   **The "Rival" Flop:** If nobody dislikes the rival, Case 3 looks like Case 1.
      *   *Fix:* Pivot. "Okay, so you view the funding cut as objectively bad regardless of who it hits. That tells us your moral norm is 'Funding cuts are bad,' not 'Harming rivals is good.'"

  ---

  ### One-Page Handout (Photocopy this)

  **SEMINAR: THE SIDE-EFFECT EFFECT**

  **The Phenomenon**
  When an agent performs an action to achieve a goal, and foresees a side effect but is indifferent to it:
  *   If the side effect is **Harmful**, people tend to say it was brought about **Intentionally**.
  *   If the side effect is **Helpful**, people tend to say it was **Not Intentionally**.
  *(Knobe, 2003)*

  **The Philosophical Problem**
  Standard Action Theory assumes a sequence:
  1.  Determine facts (What did they do? What did they know?)
  2.  Apply moral judgment (Was it good or bad?)

  The Side-Effect Effect suggests the order is reversed or intertwined:
  1.  Moral Judgment (Was the outcome bad?)
  2.  Determine facts (Therefore, they must have done it intentionally).

  **Three Explanations in the Literature**
  1.  **The Blame Hypothesis:** We use "intentional" as a tool to assign blame. If it's bad, we want to blame them, so we call it intentional. If it's good, we don't need to praise them as much.
  2.  **The Normative Concept Hypothesis:** Our concept of "intentional" *includes* moral violation. You cannot understand the word without referencing moral norms.
  3.  **The Pragmatic Hypothesis:** We *know* it wasn't intentional in the Help case, but saying "Yes" implies the agent *cared* about helping. Since they didn't care, we say "No" to avoid misleading the listener.

  **Discussion Questions for Next Time**
  *   If morality penetrates "Intentional," does it also penetrate "Causation"? (Did he *cause* the harm?)
  *   If we tested a psychopath (who lacks moral norms), would they show the asymmetry?
  *   Is the Epistemic Effect (attributing Knowledge) stronger or weaker than the Intentional Effect?

  **Readings**
  *   Knobe, J. (2003). "Intentional Action and Side Effects in Ordinary Language." *Analysis*.
  *   Machery, E. (2008). "The Folk Concept of Intentional Action." *Philosophical Explorations*.
