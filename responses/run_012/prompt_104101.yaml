      *   **Time:** First 10 minutes (before evidence).
      *   **Purpose:** Define the occasion, set the tone.
      *   **Philosophical Framework:** John Dewey's experimentalism about democracy and inquiry.
      *   **Constraints/Audience Dynamics:**
          *   *Councillors:* Suspect it's a glorified opinion poll/deliberation bias. Need to assure them this isn't just handing over power to a random sample without rigor.
          *   *Residents (60):* Non-philosophers. Avoid jargon ("inquiry," "warranted assertibility"). Keep it accessible.
          *   *Academics (2):* Will wince at loose interpretations. Needs to be structurally accurate to Dewey without naming him excessively (max once).
          *   *Speaker Persona:* Skeptical journalist (written skeptically about deliberation before). Don't sound like a convert/evangelist.
          *   **Key Deweyan Ideas to Embed:**
              1.  Inquiry starts from an *unsettled situation*, not a menu. The question/remits can be rewritten (focus on the word "best").
              2.  A *public* forms around shared consequences, not pre-existing shared interests. (Answering councillors).
              3.  Outcome is *warranted and revisable*, not certain. Don't promise they will "get it right" or "make history."
          *   **Local Detail:** House rule: At close of each Saturday, everyone names one thing that would change their mind. Call this "the most Deweyan object in the building" (or similar sentiment) without sloganizing.
      *   **Tone:** Spoken prose, accessible, honest, structural not decorative.
      *   **Length:** 10 minutes spoken (approx. 1000-1300 words).

  2.  **Deconstruct the Deweyan Concepts for Lay Audience:**
      *   *Inquiry starts from unsettled situation:* Instead of "Here are options A, B, C, pick one," it's "What is the problem actually? Is the question itself right?" -> Translate to: "Don't just answer the question on the card. Check if it's the right question."
      *   *Public formed by consequences:* Instead of "We all want the same thing," it's "We are here because what happens here affects us all, even if we want different things." -> Translate to: "You aren't a team. You're neighbors tied together by what happens next."
      *   *Warranted/revisable conclusion:* Instead of "This is the Truth," it's "This is the best answer we have based on what we know now, but we might learn more." -> Translate to: "You aren't promising a perfect solution forever. You're promising a reasoned decision for now."

  3.  **Drafting - Section by Section:**

