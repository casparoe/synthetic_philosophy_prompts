answer: |-
  Good morning.

  I want to start by being honest about why I'm standing here. I write about science and ideas for a living. That means I spend a lot of time looking at how we know what we know, and how we decide what to do about it. I have also written pieces in the past asking whether gatherings like this one actually work. I have wondered if deliberation is just a polite word for exhaustion, or if a random group of sixty people can really grasp the trade-offs that keep elected officials up at night.

  I am not standing here to tell you I have been converted. I am standing here to tell you what kind of machinery you are operating for the next three Saturdays. Because if you treat this process like a town hall, or a vote, or a focus group, it will fail. It needs to be something else.

  You have been handed a remit. It asks you to determine the *best* use of a capital fund over the next thirty years. I want you to pay attention to that word: *best*.

  In most political settings, "best" is a disguise. It usually means "the option that causes the least amount of trouble" or "the option that fits within the budget we already have." You are often presented with a menu: Option A, Option B, Option C. Your job is usually to pick one.

  But that is not what is happening in this room. If you treat this as a multiple-choice test, you will miss the point. The situation you are walking into is genuinely unsettled. We do not actually know yet what the problem is, let alone the solution. Maybe the best use of the fund isn't to build something new, but to maintain something old. Maybe it isn't about infrastructure at all, but about resilience.

  Your first task is not to answer the question on the card. Your first task is to check if the question on the card is the right one. You have permission to rewrite the problem. If the engineers come in later and give you evidence that contradicts the premise of the remit, you are not required to ignore it to stay on script. Inquiry doesn't start with answers. It starts with the recognition that things are unclear. So, do not rush to close the case. Sit with the uncertainty.

  This brings me to who you are. Look around the room. You do not know each other. You likely do not share the same interests. Some of you want lower taxes; some of you want better services. Some of you trust the city; some of you do not.

  The councillors sitting in the back might be worried that this group will become a mob, or worse, a mirror of their own biases. They might worry that the loudest voices will drag the quiet ones along. That is a real risk. But it is not the only way to understand a group like this.

  There is a way of thinking about democracy, argued famously by John Dewey, that suggests a public is not a group of people who already agree. A public comes into being only when people realize they are affected by the same consequences. You are not here because you share interests. You are here because what happens in this city lands on all of you, even if it lands differently.

  The councillor's job is to represent constituencies. Your job is to represent the consequences. When the economists present their data, do not ask "Does this help me?" Ask "Does this help us see the ripple effects we all share?" If you can map the consequences together, you become a public. If you just negotiate over interests, you remain sixty strangers.

  Now, I know that mapping consequences is hard. It requires changing your mind. And changing your mind is difficult, especially in public. We tend to treat stubbornness as a virtue in politics. We think it shows strength.

  That is why I want to draw your attention to a specific rule the organizers have set. At the close of each Saturday, every single one of you must name one thing that would change your mind.

  I want you to treat that rule seriously. Do not treat it as a therapy exercise. Do not treat it as a slogan. It is the most important tool in this room. In science, a claim is only valid if there is some evidence that could prove it wrong. If you say "I believe X," but there is nothing that could ever change your mind, you are not making a claim; you are stating a preference.

  That rule is the engine of this assembly. It forces you to hold your conclusions lightly. It reminds you that you are here to learn, not to win. If you leave each Saturday without having identified something that could shift your view, you haven't deliberated; you've just rehearsed.

  This leads to where you are going at the end of day three. There is a temptation to promise yourselves that you are about to make history. There is a temptation to think that if you work hard enough, you will find the *perfect* solution.

  You will not.

  No group of sixty people, over three weekends, can find a certainty. The future is too complex, and the evidence will always be incomplete. If you promise the city a perfect solution, you are lying.

  But you can promise something else. You can promise a warranted conclusion. That means a decision that is justified by the evidence you have seen, tested against the objections you have heard, and arrived at through a process that allows for correction. You are not building a monument. You are building a plan that holds weight because of how it was made.

  When you present your recommendation to the council, you should not say, "This is the truth." You should say, "This is the most robust conclusion we could reach given what we know now." That is not a weakness. It is the only honest way to govern a complex world. Certainty is for ideologues. Revisable conclusions are for citizens.

  So, here is what I ask of you.

  Do not rush to solve the problem before you understand it. Let the situation remain unsettled for as long as it needs to be.

  Do not look for agreement on interests. Look for shared visibility on consequences.

  And do not cling to your positions. Use that rule about changing your minds. Let it be the thing that keeps you honest when the fatigue sets in on Saturday afternoon.

  I am still skeptical about whether these processes can change the broader culture of our politics. I will be watching to see if you prove me wrong. But the only way you will do that is not by acting like a parliament, or a jury, or a focus group. It is by acting like what you are: a group of neighbors trying to figure out what the evidence demands, knowing that you might be wrong, but committing to being wrong together, and correcting it if you are.

  The engineers and economists will arrive soon. They will bring data. They will bring constraints. Your job is to bring the inquiry.

  Thank you.
