answer: |-
  Here is the specification of desiderata for an adequate theory of supererogation. Each requirement includes the motivating consideration and its status as either a non-negotiable condition for the category's existence or a commitment specific to a particular theoretical camp.

  ### I. Core Phenomenological Desiderata

  **1. The Optionality Condition**
  *   **Requirement:** The theory must specify that performing the act is not morally required, and omitting it is not morally wrongful.
  *   **Motivating Case:** The Soldier and the Grenade. A soldier throws himself on a grenade to save his squad. We intuitively judge that he was not *obligated* to die; he would not have been morally condemned for staying in cover.
  *   **Status:** **Non-negotiable.** If the act is required, it is a duty, not supererogatory. This defines the extension of the category.

  **2. The Value Condition**
  *   **Requirement:** The theory must account for why the act is morally good, valuable, or preferable to the baseline alternative.
  *   **Motivating Case:** The Soldier and the Grenade (again). While not required, the act is not merely neutral; it is morally excellent. A theory that classifies the act as morally indifferent fails to capture the "heroic" element.
  *   **Status:** **Non-negotiable.** Without positive moral value, the act is merely permissible, not supererogatory.

  **3. The Betterness Paradox Resolution**
  *   **Requirement:** The theory must explain how an act can be morally *better* than its alternative without being *obligatory*. It must block the inference from "A is better than B" to "One ought to do A."
  *   **Motivating Case:** The Maximizing Intuition. If morality is about making the world better, and Act A creates more good than Act B, why is the agent permitted to choose B?
  *   **Status:** **Non-negotiable.** Any theory that cannot block this inference collapses supererogation into duty (the "maximizing" collapse).

  **4. The Threshold Specification**
  *   **Requirement:** The theory must identify the metric or boundary where duty ends and supererogation begins (e.g., cost to agent, risk level, sacrifice).
  *   **Motivating Case:** The Sliding Scale of Sacrifice. Giving $10 to charity is good; giving $10,000 is heroic. At what point does the cost to the agent render the act optional rather than required?
  *   **Status:** **Commitment of one camp.** Objective theories posit a fixed threshold (e.g., "significant sacrifice"). Subjective theories posit a relative threshold (e.g., "sacrifice relative to income"). There is no consensus on the precise location, only that a line must be drawn.

  **5. The Act vs. Life Distinction**
  *   **Requirement:** The theory must distinguish between a single supererogatory act and a sustained life of moral heroism (sainthood).
  *   **Motivating Case:** The One-Off Hero vs. The Saint. A person who saves a child from a burning building once is a hero. A person who dedicates their life to caring for the leper colony is a saint. The theory must explain if these are the same category scaled up, or distinct moral statuses.
  *   **Status:** **Non-negotiable.** A theory that conflates occasional heroism with total self-abnegation fails to capture the nuance of moral assessment over time.

  ---

  ### II. The Contested Desiderata (Your Specific Concerns)

  **6. The Omission and Blame Condition**
  *   **Requirement:** The theory must state whether omitting a supererogatory act invites moral blame, criticism, or guilt.
  *   **Motivating Case:** The Shallow Pond. A person walks past a shallow pond where a child is drowning. They could save the child at the trivial cost of muddying their shoes, but they do not.
      *   *Traditional View:* If it is supererogatory, omission is not blameworthy.
      *   *Revisionist View:* Omission is not *wrongful*, but the agent is still criticizable or blameworthy for lacking virtue.
  *   **Status:** **Commitment of one camp.**
      *   *Traditional:* Supererogation entails immunity from blame. (Motivation: Protecting liberty).
      *   *Revisionist:* Supererogation entails immunity from *sanction*, but not necessarily immunity from *criticism*. (Motivation: Capturing the intuition that letting the child die is reprehensible, even if not a rights violation).
      *   *Note:* Your friend's pressure (that some omissions are blameworthy) pushes the theory toward the Revisionist View. This does not force abandonment of the category, but it requires decoupling "wrongdoing" from "blameworthiness."

  **7. The Agent-Relativity Condition**
  *   **Requirement:** The theory must explain how the same act-type can be obligatory for one agent and supererogatory for another.
  *   **Motivating Case:** The Lifeguard vs. The Bystander. A lifeguard is obligated to dive and save a swimmer; a bystander is not obligated (it is supererogatory). The physical act is identical; the moral status differs.
  *   **Status:** **Non-negotiable.** A theory that locates supererogation solely in the *act's consequences* (agent-neutral) cannot explain this without ad-hoc adjustments. The theory must locate the status partly in the *agent's role, relationship, or prior commitments*.

  **8. The Motive and Praise Condition**
  *   **Requirement:** The theory must specify whether the agent's motive determines the supererogatory status of the act, or merely the praiseworthiness of the agent.
  *   **Motivating Case:** The Glory-Seeking Helper. A colleague absorbs an exhausting burden to help a struggling coworker, but does so primarily to be admired by the boss.
      *   *View A (Objective):* The act is supererogatory because it is objectively beneficial and costly, regardless of motive.
      *   *View B (Subjective):* The act is not supererogatory (or not praiseworthy) because the motive is impure.
  *   **Status:** **Commitment of one camp.**
      *   *Consequentialist leanings:* Motive is irrelevant to the act's status, only to the agent's character.
      *   *Virtue/Kantian leanings:* Motive is constitutive of the moral worth. If the motive is vanity, the act lacks the specific moral value required for supererogation.
      *   *Relation to Praise:* If View A holds, the act is supererogatory but the agent is less praiseworthy. If View B holds, the act may not count as supererogatory at all.

  ---

  ### III. Incompatibilities and Tensions

  **The "Easy Rescue" Trilemma**
  The following three requirements appear jointly unsatisfiable in cases of high-value, low-cost assistance (like the Shallow Pond):
  1.  **High Value:** The act produces significant moral good.
  2.  **Low Cost:** The sacrifice required of the agent is trivial.
  3.  **Immunity from Blame:** Omitting the act is not blameworthy (Traditional Omission Condition).

  *Why:* If an act is High Value and Low Cost, strong moral intuition suggests it is **Obligatory**. If it is Obligatory, it violates the **Optionality Condition** (Req 1). If you insist it is Optional to preserve supererogation, you violate the intuition that omitting it is **Blameworthy** (Req 6).
  *Resolution:* A theory must sacrifice one.
  *   *Utilitarianism:* Sacrifices Optionality (makes it duty).
  *   *Libertarian/Deontological:* Sacrifices Blame (insists it is optional and not blameworthy).
  *   *Revisionist:* Sacrifices the link between Wrongdoing and Blame (it is optional, but you are still blameworthy).

  **Agent-Neutrality vs. Role-Differentiation**
  A theory that defines supererogation purely by **Objective Value** (Req 2) struggles to satisfy **Agent-Relativity** (Req 7). If the value of saving a life is constant, the moral status of the act should be constant. To satisfy Req 7, the theory must introduce agent-relative constraints (roles, contracts, special obligations) that modify the value calculation or the duty threshold based on *who* is acting.

  ---

  ### IV. The Single Most Constraining Requirement

  **The Optionality Condition (specifically the "Not Required" clause).**

  This requirement does the most work in ruling out otherwise popular theories.
  *   **Act Utilitarianism:** Fails immediately. Because it mandates maximizing the good, the "better" act is always the "required" act. It cannot satisfy the Optionality Condition without ceasing to be Act Utilitarianism.
  *   **Satisficing Consequentialism:** Attempts to meet this by setting a "good enough" threshold. However, it often struggles with the **Betterness Paradox Resolution** (Req 3). If doing *more* good is always better, why is stopping at "good enough" permitted? It risks collapsing back into maximizing or appearing arbitrary.
  *   **Deontology:** Best positioned to meet this condition by positing strict duties that have a ceiling (e.g., "do not kill," "keep promises") beyond which agents are free. However, Deontology struggles with the **Threshold Specification** (Req 4), often lacking a principled way to explain *why* certain costs negate duty while others do not.

  ---

  ### V. Verdict on Usual Contenders

  **1. Classical Act Utilitarianism**
  *   **Verdict:** **Fails.** It cannot satisfy the **Optionality Condition**. It dissolves supererogation into duty. It solves the **Betterness Paradox** by denying the phenomenon exists.

  **2. Standard Deontology (Kantian/Rights-based)**
  *   **Verdict:** **Passes Core, Struggles on Threshold.** It easily satisfies **Optionality** and **Agent-Relativity** (via roles/duties). It struggles with the **Threshold Specification** (where does duty end?) and the **Omission/Blame Condition** in easy rescue cases (why is the bystander not blameworthy?). It handles the **Motive Condition** well (duty vs. inclination), but may be too strict on motive for the **Value Condition**.

  **3. Revisionist Pluralism (The "Blameworthy Omission" View)**
  *   **Verdict:** **Most Promising for Your Dispute.** This view accepts **Optionality** (it is not a duty) but rejects the traditional **Omission/Blame Condition**. It allows you to say the bystander in the Shallow Pond committed no *wrong* (preserving the category) but is still *blameworthy* (satisfying your friend's intuition). It requires a complex moral psychology that separates "violation of obligation" from "failure of virtue," but it is the only framework that accommodates all your specific case intuitions without collapsing the category.

  **Summary Recommendation:**
  If you and your friend wish to preserve the category of supererogation while acknowledging that some omissions (like the Shallow Pond) are blameworthy, you must adopt a theory that treats **Supererogation as a status of the Act** (optional, good) but **Blame as a status of the Agent** (responsive to value, not just duty). This decouples the "Not Required" clause from the "Not Blameworthy" clause. If you insist they are coupled, you will be forced to classify easy rescues as duties, which shrinks the supererogatory category to only extreme heroism.
