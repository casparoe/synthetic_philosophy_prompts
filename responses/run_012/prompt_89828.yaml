  I'm a working programmer — backend systems by day, but I've kept up with type theory and computability on my own time, so I'm at home in the vocabulary of total and partial functions, oracles, decidability, termination, lazy evaluation, fixed points, and the Curry–Howard reading on which a proof of a proposition just is a program of the corresponding type. Lately I've been reading popular treatments of Zorn's lemma and the axiom of choice, and I keep having the nagging sense that the whole dispute — why one camp treats a proof that a maximal element exists as a finished proof even when it hands you no way to locate the element, and why the constructivists refuse to accept it — ought to be fully expressible in my own vocabulary, and that if someone did that translation honestly I would finally see what the fight is actually about. So that's the task: restate the disagreement over Zorn's lemma, the axiom of choice, and the non-constructive existence proofs that lean on them as faithfully as you can in the language of a programmer who thinks in procedures, oracles, search, termination, and types. A proof by Zorn's lemma becomes an oracle you're licensed to call without knowing its implementation; the maximal element becomes a value you can name but cannot compute; a non-constructive existence claim becomes a search you're told must terminate without being told how. Push that translation as hard as it will go.

