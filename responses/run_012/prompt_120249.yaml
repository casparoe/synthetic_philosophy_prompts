  The Equal-Weight View (conciliationism) demands that Kelvin and the geologists significantly lower their confidence and converge toward a middle ground. Since they regarded each other as epistemic peers, neither could rationally dismiss the other's calculation without independent justification. Steadfastness, conversely, permits both to maintain confidence if they believe their own assessment of the evidence is correct, regardless of the disagreement.

  This case devastates conciliationism. Splitting the difference between 20 million and 500 million years yields a number still wrong by an order of magnitude against the actual 4.5 billion. Conciliationism assumes the truth lies within the convex hull of the disagreement; here, the truth depended on an unknown variable (radioactivity) outside both frameworks. Compromise would have produced a precise falsehood rather than sustaining the competing research programs that kept the question alive.

  The fact that the geologists were right despite weaker arguments (variable sedimentation rates vs. rigorous thermodynamics) counts for steadfastness. Conciliationism would have forced the geologists to defer to Kelvin's superior physics, stalling the correct conclusion. Steadfastness allows rational agents to trust local evidence even when opposing theories seem mathematically stronger. Kelvin was rational but wrong; the geologists were rational and right. Conciliationism cannot accommodate this asymmetry without declaring the geologists irrational for holding out.

  Verdict: Conciliationism -- Compromise fails when the truth lies outside both parties' estimates.
