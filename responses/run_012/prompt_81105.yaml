      *Let's sharpen the "Definite Position":* I will argue that **Moral Particularism is essentially correct about how moral reasoning works, but your colleague draws the wrong practical conclusion for an institution.** A hospital is not a moral agent in the same way a person is; it is a bureaucracy that needs coordination. Therefore, you *must* write the policy, but you must write it as a particularist would: as a collection of presumptions, not commands. The supervenience objection is a logical trick that doesn't help clinicians.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the tension. State the thesis: The colleague is philosophically right about morality but practically wrong about institutions. You must write the policy, but its function changes.
      *   **The Nature of Principles (Holism):** Explain "holism of reasons." A feature (e.g., lying) is usually bad, but can be good (e.g., protecting a patient). This validates the colleague's view.
      *   **Implications for the Policy Document:** If principles aren't absolute, the policy cannot be a rulebook. It must be a "catalog of presumptions." It's not a distortion if understood correctly. It's a cognitive aid.
