answer: |-
  Here is the position you need to take: Your colleague is philosophically correct about the nature of morality, but she is practically wrong about the function of a hospital policy. You must write the policy, but if you write it the way you did at the academic medical center—as a set of binding constraints—you will be codifying a falsehood. If you write it as your colleague suggests—as if no structure is needed—you will invite chaos. The solution is to adopt the "compromise" your other colleague proposed, but you must understand *why* it works, because the justification matters more than the text.

  Here is the breakdown of why this is the case, how it changes your job, and why the philosophical objection against your colleague fails.

  ### 1. The Truth About Principles (Holism of Reasons)
  Your colleague is arguing for a view called *moral particularism*. Her core claim is that moral reasons are "holistic." In plain English, this means that a feature of a situation (like "lying to a patient" or "withholding treatment") does not have a fixed moral weight. In one context, lying is a decisive reason *against* an action. In another context (perhaps to preserve hope in a terminal diagnosis where truth would cause immediate physiological harm), that same feature might count *in favor* of the action, or carry no weight at all.

  If she is right, then a policy manual that says "Never lie to a patient" is not just rigid; it is factually incorrect about how morality works. It treats a variable feature as a constant.

  You should accept this. Your experience at the academic center likely showed you the cracks in the system: cases where following the flowchart led to a result everyone felt was wrong, requiring "workarounds" to achieve the right outcome. That friction was the sound of a generalist rule grinding against a particularist reality.

  ### 2. The Role of the Written Code
  Does this mean the code is a distortion? No. This is where your colleague makes her mistake. She assumes the only point of a policy is to capture moral truth. But a hospital is not just a collection of moral agents; it is a bureaucracy that requires coordination.

  A written code has two legitimate roles that do not depend on absolute moral principles:
  1.  **Epistemic Efficiency:** Most cases are not unique. Most of the time, "lying to a patient" *is* wrong. A policy acts as a heuristic—a mental shortcut—that saves clinicians from having to reinvent the wheel for every routine interaction. It encodes the community's accumulated wisdom about what features *usually* matter.
  2.  **Coordination:** Even if two clinicians disagree on the moral weight of a feature, they need to know what the institution expects so they can predict each other's behavior. The policy creates a focal point.

  Therefore, the policy is not a "crutch" in the derogatory sense. It is a scaffold. It is legitimate, provided you do not treat it as a moral oracle. It is a tool for efficiency and coordination, not a substitute for judgment.

  ### 3. Consistency and Precedent
  If there are no fixed principles, what becomes of "treating like cases alike"?

  Consistency remains a requirement, but it shifts from **consistency of outcome** to **consistency of reasoning**. You cannot demand that every case involving a DNR order ends the same way. You *can* demand that the committee considers the same set of features (patient capacity, surrogate reliability, prognosis) and weighs them in a comparable manner.

  Regarding precedent: Past committee rulings do not carry authority as *law*. They carry authority as *data*. A past ruling says, "In a situation with features X, Y, and Z, we judged that A was the right action." It does not say, "In all future situations with X, you must do A." If a new case has X and Y, but also has feature Q (which was absent before), the precedent may not apply. You treat past rulings as examples of good reasoning, not as binding statutes.

  ### 4. Accountability and the "Compromise"
  This brings us to the proposal from your other colleague: a code of default rules, defeasible by case specifics, with a requirement to document reasons for departure.

  You asked if this is just a "rulebook with extra steps." **It is not.** It is the only way to institutionalize particularism without collapsing into anarchy.

  Here is the distinction:
  *   **Rulebook:** "You must do X. If you do Y, you are in violation."
  *   **Defeasible Default:** "You should do X, because usually features F1 and F2 make X right. If you do Y, you must demonstrate that feature F3 was present and outweighed F1 and F2."

  This shifts the burden of proof. It acknowledges that the default rule is right 95% of the time (efficiency), but it protects the 5% of cases where judgment must override the rule (particularism). It holds the clinician accountable not for breaking a rule, but for failing to articulate a *reason* that justifies the break.

  You should adopt this model. It is not a compromise; it is the correct structural translation of particularist ethics into an institutional setting. It forces the clinician to engage in the very moral reasoning your philosopher colleague values, while maintaining the safety net the hospital needs.

  ### 5. Training New Members
  If rules are not the anchor, how do you train new committee members? You stop training them on "compliance" and start training them on "perception" and "articulation."

  *   **Perception:** Train them to spot morally relevant features. Novices often miss subtle details (e.g., the tone of a surrogate's hesitation, the difference between a patient's stated value and their lived history). Use case studies not to teach the "right answer," but to teach them what details *mattered* in the reasoning.
  *   **Articulation:** Train them to write the justification. If they depart from a default, can they explain *why* this case is different? If their explanation relies on "gut feeling," they are not ready. If they can point to specific features and explain how those features shifted the weight of the decision, they are reasoning well.

  ### 6. The Supervenience Objection
  Finally, you asked about the strongest objection against your colleague: the argument from supervenience. The argument goes like this: Moral facts depend on non-moral facts. If Case A and Case B are identical in every physical, psychological, and social detail, they must have the same moral status. Therefore, there must be a principle linking those details to the moral status.

  **This argument does not do the work the generalist wants it to do.**

  Here is why: The particularist agrees that moral properties supervene on non-moral properties. She agrees that if you duplicate the entire universe down to the atom, the moral verdict stays the same. But the generalist wants *finite, learnable principles* that we can use to guide action (e.g., "Always respect autonomy").

  The supervenience argument only proves that *some* function exists mapping non-moral facts to moral facts. It does not prove that humans can state that function as a rule. The "principle" the generalist gets from supervenience is trivial: "In a situation with exactly features {a, b, c... z}, do action X."

  This is useless for guidance. No two cases are ever identical in *every* non-moral respect. The moment you change one tiny detail, the generalist needs to know if that detail changes the moral outcome. The particularist says, "It might." The generalist says, "There must be a higher-order rule to tell us if it matters." But that higher-order rule is subject to the same problem.

  So, the supervenience argument saves the *logic* of morality but not the *practice* of principlism. It guarantees consistency, but it does not give you the actionable, finite list of rules the academic medical center tried to use. Your colleague can accept supervenience without conceding that her view is wrong. The generalist wins a logical point but loses the practical war.

  ### Summary of Directions
  1.  **Write the policy.** Do not listen to the colleague who says policy is a mistake. The hospital needs coordination.
  2.  **Write it as a particularist.** Use language like "presumptively," "typically," and "unless." Avoid "must" and "never."
  3.  **Adopt the compromise.** Make the default rules explicit, but require written justification for any departure. This enforces moral reasoning rather than blind compliance.
  4.  **Train for reasoning.** Evaluate committee members on their ability to identify relevant features and articulate weights, not on their ability to cite the manual.
  5.  **Dismiss the supervenience worry.** It is a metaphysical truth that does not help you write a better rulebook.

  Your colleague sees the truth of morality but ignores the truth of institutions. You see the truth of institutions but were trained in a false view of morality. Combine them. Build a policy that admits it is a heuristic, not a law. That is the only way to be ethically sound and operationally viable.
