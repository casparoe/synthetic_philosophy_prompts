          *   *Particularist rebuttal:* Yes, there is a "principle" for that exact case, but it's trivial. It doesn't help with the *next* case because the next case will differ slightly, and that difference might flip the valence of a feature. Supervenience guarantees consistency, not generalizability. It does not save the generalist's desire for action-guiding principles.
      *   **Conclusion:** Summarize the directive. Write the policy as a particularist.

  4.  **Refining the Tone:**
      *   Needs to be authoritative, argumentative, clear (for a nurse).
