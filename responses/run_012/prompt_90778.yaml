      *   (4) **Corruption/Meaning:** Sales wrong because they change the *meaning* of the thing (corruption objection), not just consequences. Affects non-participants too. *Implication:* Moral/Social ontology focus.
      *   (5) **Anti-Paternalism:** State shouldn't protect from bad bargains/regret. *Implication:* Consensual deals stand, even if risky.
      *   (6) **Exploitation/Unjust Price:** Prices can be unjust/exploitative even if voluntary. It's a wrong, not just bad luck. *Implication:* Fairness/Justice focus, potentially distinct from voluntariness.

  3.  **Identify Conflicts (Pairwise Analysis):**

      *   *(1) vs. (3):* (1) says "stop them trading what is theirs" is wrong. (3) says "Some things should not be bought and sold."
          *   *Conflict:* If I own myself (1), don't I own my vote/friendship? If the state stops me selling a kidney (1 says it shouldn't), why can it stop me selling a vote (3 says it should)?
