          *   *Decision:* **(1)** is the structural load-bearer. If you remove (1), (2) and (5) lose their political force. (3) and (4) become isolated moral preferences without a counter-weight. But actually, **(5)** is the bridge. No, (1) is the foundation. Let's stick with (1) but acknowledge its tension.
          *   *Wait, looking closer:* If I change (1), I fix the conflict with (3) and (6). If I change (6), I only fix the conflict with (1/5). If I change (3), I lose the moral limit.
