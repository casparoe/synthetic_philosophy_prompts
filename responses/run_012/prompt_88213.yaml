answer: |-
  **MEMORANDUM**

  **TO:** Members of the Public Statements Committee
  **FROM:** Chair, Public Statements Committee
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Motion Regarding State Campaign Against Ethnic Minority

  **1. Executive Summary**

  This Thursday, the Committee must vote on how to characterize the eighteen-month campaign by [State] against [Ethnic Minority]. We face two motions: one to declare the atrocities constitute *genocide* (Motion A), and one to adopt a graded internal vocabulary of severity without invoking legal terms of art (Motion B).

  After reviewing the evidence, our Charter, and the ethical implications of our speech, **I recommend we combine these motions.** We should adopt the Graded Vocabulary (Motion B) as our standing epistemic framework to satisfy the Charter's requirement for defensibility, but we must define the highest tier explicitly in accordance with the UN Genocide Convention and vote immediately to classify the current crisis under that tier. This allows us to speak the truth without pretending to be a court.

  **2. Charter Constraints and Institutional History**

  Our Charter permits statements on matters of public concern but stipulates that "any legal term of art we invoke be defensible." We have twice before declined to name atrocities, citing the risk of overstepping our competence. However, silence is also a statement. The presence of internal planning documents describing the group as an "obstacle to be removed" distinguishes this case from our previous deliberations. It moves the evidence from circumstantial to structural. We are not acting as a tribunal of conviction, but as a body of moral and conceptual inquiry. Our defensibility rests on the rigor of our reasoning, not the power of our subpoena.

  **3. Analysis of the Motions**

  *   **Motion A (Declaration of Genocide):** This motion prioritizes moral clarity. It aligns our language with the gravity of the suffering. However, standing alone, it risks violating the Charter if we cannot defend the *dolus specialis* (specific intent) required by international law.
  *   **Motion B (Graded Vocabulary):** This motion prioritizes conceptual precision and institutional safety. It creates three tiers of severity with stated thresholds. Standing alone, however, it risks bureaucratic obfuscation. Creating a new vocabulary in the face of mass killing may be perceived as a euphemism, dulling the urgency of our warning.

  **4. The Core Tension: A Hearing for the Objection**

  We must weigh the strongest arguments against invoking the term *genocide*.

  *The Objection:* Critics argue that a scholarly finding of genocide cheapens a category built for courts. The 1948 Convention was designed to trigger specific legal obligations and criminal liability. When a philosophical association deploys the term, we risk "conceptual inflation," where the word loses its distinctive horror. Furthermore, by invoking genocide, we summon obligations we cannot discharge. We cannot sanction the state, intervene militarily, or prosecute leaders. To name the crime without the capacity to stop it may render us spectators to our own rhetoric, potentially endangering colleagues on the ground by escalating political tensions without providing protection.

  *The Counter-Claim:* Proponents argue that withholding the word repeats the failure the concept was coined to prevent. Raphael Lemkin devised the term not merely for prosecutors, but to alert the world to a unique category of destruction. If we wait for a court to speak, it will be too late for the victims. Silence, or the use of softened language like "ethnic cleansing" or "humanitarian crisis," allows perpetrators to hide behind ambiguity. If the criteria are met, our refusal to name them is not neutrality; it is complicity in the erasure of the group's reality.

  **5. Specific Determinations on Intent and Scope**

  To ensure our finding is defensible under the Charter, we must be explicit about two philosophical and legal boundaries:

  *   **Inference of Intent:** We cannot demand a signed confession of genocidal intent. We must rely on *inference from a pattern of conduct*. The combination of mass killings, destruction of villages and places of worship, and forced displacement constitutes the *actus reus*. The internal planning documents describing the group as an "obstacle to be removed" provide the *mens rea*. We determine that the systematic nature of the violence allows for a reasonable inference of intent to destroy the group in whole or in part, even absent a formal judicial verdict.
  *   **Scope of Destruction:** We must adhere to the UN Convention's enumerated acts (killing, causing serious harm, inflicting conditions of life calculated to bring about destruction, preventing births, transferring children). We should **not** expand the definition to include "cultural genocide" (ethnocide) as a standalone category, as this is not recognized under international law. However, we note that the destruction of places of worship and cultural institutions is admissible as *evidence* of the intent to destroy the group *as such*. We stay confined to the Convention's protected groups and acts to maintain defensibility, using cultural destruction as proof of intent rather than as a separate crime.

  **6. Recommendation and Timeline**

  I propose we vote on a **Combined Resolution**:

  1.  **Adopt the Graded Vocabulary (Motion B)** as our standing policy. This satisfies the Charter's demand for defensibility by establishing clear thresholds for future statements.
  2.  **Define Tier 1** explicitly as acts meeting the criteria of the UN Genocide Convention.
  3.  **Classify the current crisis** as a Tier 1 event, thereby authorizing the use of the term *genocide* in our public statement.

  **Timeline:**
  *   **Vote:** This Thursday, October 26.
  *   **Drafting:** If passed, the Drafting Subcommitte will finalize the text by Friday, October 27.
  *   **Release:** The Public Statement will be issued no later than **Monday, October 30**.

  **7. Conclusion**

  We are philosophers. We know that words shape the world. To use the term *genocide* lightly is to damage the concept; to withhold it when warranted is to damage the world. By adopting the graded framework, we ensure we are not acting rashly. By filling the highest tier with the reality before us, we ensure we are not acting cowardly.

  I urge you to support this combined course. It honors our Charter, respects the gravity of the law, and fulfills our moral obligation to witness.

  **Chair, Public Statements Committee**
