  2.  **Analyze Rousseau's Position on Theater:**
      *   **Primary Source:** *Letter to M. d'Alembert on Spectacles* (1758).
      *   **Core Argument:** Theater is harmful to a republic, particularly a small one like Geneva.
      *   **Key Objections:**
          *   **Passivity:** Spectators sit idle, feeling emotions without acting on them. It substitutes pity for virtue.
          *   **Illusion/Deception:** Acting is inherently deceptive (wearing masks, pretending to be someone else). This corrodes authenticity and sincerity.
          *   **Actor/Spectator Divide:** The separation creates inequality and alienation.
          *   **Cost/Expense:** Theater is expensive, drains public resources, and encourages luxury.
          *   **Impact on Morals:** It reflects existing morals rather than improving them; often promotes vice or questionable values (e.g., Molière's *The Misanthrope* making virtue look ridiculous).
          *   **Women:** Bringing women into public spaces (theater) disrupts domestic modesty.
      *   **The Alternative:** Public festivals in the open air where people are both actors and spectators (e.g., dancing around a maypole). No tickets, no stage, no separation.
      *   **Nuance:** Rousseau distinguishes between the *institution* of theater (professional, enclosed, passive) and *festivals* (communal, active, open).

  3.  **Evaluate the Proposal against Rousseau's Criteria:**
      *   **Amateur Casting (Ordinary Residents):** This aligns with Rousseau's desire for citizens to participate. However, they are still *acting* roles written (even if co-written) for a performance.
