      *   **Public Squares (Open-air):** This aligns with Rousseau's preference for open festivals over enclosed theaters.
      *   **Public Funding:** Rousseau objected to the cost of theater draining resources, but he supported public festivals funded by the community. However, the cost here is for a "permanent civic program" with professional directors and streaming tech.
