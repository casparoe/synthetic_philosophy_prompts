answer: |-
  # Life-Detection Decision Protocol (LDDP) v1.0

  **Purpose:** To standardize panel decisions regarding biological status, containment, and public announcement.
  **Constraints:** 90-minute meeting limit; incomplete data; non-philosopher Chair.
  **Definitions:**
  *   **Life (Active):** Meets Criteria A, B, and D currently.
  *   **Life (Relic/Dormant):** Meets structural traces of A and D, with evidence of past B.
  *   **Biogenic Signature:** Chemical/physical evidence consistent only with biology, but no system present.
  *   **Anomaly:** Fails abiotic explanation, but lacks specific biological markers.
  *   **Non-Biological:** Explained by known physics/chemistry.

  ---

  ## Part 1: The Procedure

  ### Phase 1: The Abiotic Null (The Anomaly Test)
  *Time Allocation: 20 Minutes*

  **Q1: Can the observation be explained by known non-biological processes with high confidence?**
  *   **Evidence Required:** Two independent lines of evidence (e.g., spectral data + geological context; or chemical assay + isotopic fractionation).
  *   **Sufficient Answer for "Yes":** Abiotic models fit data within 2-sigma; no unexplained residuals.
  *   **Sufficient Answer for "No":** Abiotic models fail to reproduce key features (e.g., specific disequilibrium, complex chirality) despite rigorous modeling.
  *   **Decision:**
      *   If **Yes**: Classify as **Non-Biological**. Stop.
      *   If **No**: Proceed to Phase 2. (Status: *Candidate Anomaly*)

  ### Phase 2: System Categorization
  *Time Allocation: 10 Minutes*

  **Q2: What is the mode of observation?**
  *   **Remote:** Spectral, atmospheric, or telescopic data only. (Go to Path R)
  *   **Physical:** Sample in hand (rock, fluid, swab). (Go to Path P)
  *   **Synthetic/Digital:** Created in lab or simulation. (Go to Path S)

  ### Phase 3: Criteria Assessment (Path Dependent)
  *Time Allocation: 40 Minutes*

  **Path R (Remote):**
  *   **Q3-R:** Is there evidence of **Criterion A (Bounded Self-Maintenance)**? (e.g., spatial confinement of disequilibrium).
      *   *Note:* Remote data rarely proves A. If unknown, default to "No."
  *   **Q4-R:** Is there evidence of **Criterion D (Functional Integration)**? (e.g., coupled cycles).
      *   *Note:* Rarely provable remotely.
  *   **Default Classification:** If Q1 was "No" (Anomaly), max classification is **Biogenic Signature**. *Cannot be "Life (Active)."*

  **Path P (Physical):**
  *   **Q3-P:** Is there evidence of **Criterion A**? (Boundaries, energy flux).
  *   **Q4-P:** Is there evidence of **Criterion B**? (Template copying, heredity).
  *   **Q5-P:** Is there evidence of **Criterion D**? (Parts working for whole).
  *   **Scoring:**
      *   A + B + D Present: **Life (Active)**.
      *   A + D Present, B Unknown/Absent: **Life (Dormant/Relic Candidate)**.
      *   B + D Present, A Absent (e.g., requires external supply): **Synthetic Evolving System** (See Phase 4).
      *   Only D or A Present: **Anomalous Structure**.

  **Path S (Synthetic/Digital):**
  *   **Q3-S:** Does the system exhibit **Criterion B (Heritable Variation)**?
  *   **Q4-S:** Does the system exhibit **Criterion D (Functional Integration)**?
  *   **Q5-S:** Is the "Environment" supplying energy/matter *part of the experimental design* (Technician) or *natural*?
      *   If Technician: **Criterion A is Failed** (Not Autonomous).
      *   If Natural/Sealed: **Criterion A is Met**.

  ### Phase 4: Classification & Hand-Off
  *Time Allocation: 20 Minutes*

  **Q6: Apply Classification Matrix.**
  1.  **Confirmed Life (Active):** Path P, A+B+D Met. -> *Action: Public Announcement, Level 4 Containment.*
  2.  **Confirmed Life (Relic):** Path P, A+D Met, B inferred from context. -> *Action: Restricted Announcement, Level 3 Containment.*
  3.  **Biogenic Signature:** Path R, Q1 "No". -> *Action: "Evidence Consistent with Life" Announcement, No Containment.*
  4.  **Synthetic Evolving System:** Path S, B+D Met, A Failed. -> *Action: No "Life" Announcement, Level 3 Containment (Regulatory).*
  5.  **Unexplained Anomaly:** Q1 "No", Criteria A/B/D Failed. -> *Action: Internal Memo, Further Study.*

  **Q7: Philosophical Hand-Off.**
  *   *Trigger:* If the panel votes 50/50 on whether a "Synthetic Evolving System" (Path S) counts as "Life" for ethical/regulatory purposes.
  *   *Trigger:* If "Digital/Simulated" entities show B+D but lack physical matter.
  *   *Action:* Chair must defer to the **Philosopher of Biology** for a binding recommendation on *moral status*, though the Scientific Classification remains "Synthetic."

  ---

  ## Part 2: Record-Keeping Format

  **Case ID:** [YYYY-MM-Code]
  **Chair:** [Name]
  **Date:** [Date]

  **1. Abiotic Null Status:**
  [ ] Passed (Non-Biological)
  [ ] Failed (Candidate Anomaly)
  *Evidence Cited:* ___________________

  **2. Observation Mode:**
  [ ] Remote [ ] Physical [ ] Synthetic

  **3. Criteria Scorecard:**
  *   **A (Self-Maint):** [ ] Yes [ ] No [ ] Unknown
  *   **B (Heredity):** [ ] Yes [ ] No [ ] Unknown
  *   **C (Open-Ended):** [ ] Yes [ ] No [ ] N/A
  *   **D (Integration):** [ ] Yes [ ] No [ ] Unknown

  **4. Final Classification:**
  [ ] Confirmed Life (Active)
  [ ] Confirmed Life (Relic)
  [ ] Biogenic Signature
  [ ] Synthetic Evolving System
  [ ] Unexplained Anomaly

  **5. Dissent/Hand-Off Notes:**
  *(Record if Philosopher overruled majority on ethical status)*
  ___________________________________________________________________

  ---

  ## Part 3: Case Runs

  ### Case 1: Exoplanet Atmosphere
  *   **Evidence:** Strong disequilibrium pair (e.g., Methane + Oxygen). No spatial resolution. No other context.
  *   **Phase 1 (Null):** Abiotic models (volcanism, photolysis) fail to explain the ratio. **Status: Candidate Anomaly.**
  *   **Phase 2 (Mode):** **Remote (Path R).**
  *   **Phase 3 (Criteria):**
      *   Q3-R (Criterion A): Unknown. Cannot resolve boundaries. **Default: No.**
      *   Q4-R (Criterion D): Unknown. **Default: No.**
  *   **Phase 4 (Classification):** Matches **Biogenic Signature**.
  *   **Outcome:** Announcement allowed as "Chemical Evidence Consistent with Biology." **Not** "Life Detected." No containment (physically impossible).

  ### Case 2: Lab Polymer
  *   **Evidence:** Polymer replicates with variation. Evolution observed over 50 generations. Requires technician to add monomers and remove waste.
  *   **Phase 1 (Null):** Abiotic chemistry cannot explain the specific sequence fidelity. **Status: Candidate Anomaly.**
  *   **Phase 2 (Mode):** **Synthetic (Path S).**
  *   **Phase 3 (Criteria):**
      *   Q3-S (Criterion B): **Yes** (Replicates/varies).
      *   Q4-S (Criterion D): **Yes** (Structure dictates function).
      *   Q5-S (Criterion A): **No**. Environment is managed by technician. System does not maintain its own boundary/energy flux autonomously.
  *   **Phase 4 (Classification):** Matches **Synthetic Evolving System**.
  *   **Outcome:** **Not "Life."** However, triggers Level 3 Containment due to evolutionary potential.

  ### Case 3: Martian Micro-structure
  *   **Evidence:** Microscopic structure resembles cell wall. No metabolism detected. No DNA/RNA detected.
  *   **Phase 1 (Null):** Mineral dendrites can mimic shape. Abiotic null is **Weak**. (One line of evidence: morphology. Need second). Let's assume isotopic analysis is ambiguous. **Status: Candidate Anomaly.**
  *   **Phase 2 (Mode):** **Physical (Path P).**
  *   **Phase 3 (Criteria):**
      *   Q3-P (Criterion A): **No** (No metabolism).
      *   Q4-P (Criterion B): **No** (No heredity detected).
      *   Q5-P (Criterion D): **Yes** (Structural integration).
  *   **Phase 4 (Classification):** Matches **Unexplained Anomaly** (bordering on Relic, but insufficient evidence for B).
  *   **Outcome:** Internal Memo. Request further sampling. No announcement.

  ---

  ## Part 4: The Unpopular Outcome

  **I must state plainly:** You will not like the outcome of **Case 2 (The Lab Polymer)**.

  Under this procedure, the Polymer is classified as a **"Synthetic Evolving System,"** explicitly **not** "Life."
  *   **Why you won't like it:** Your chemists and synthetic biologists will argue that because the polymer evolves (Criterion B), it *is* alive, regardless of the technician. They will argue the technician is just part of the "environment," similar to a host organism.
  *   **The Consequence:** By ruling it "Not Life," you deny the team the prestige of creating "Life." However, by triggering Level 3 Containment anyway, you burden them with biosafety protocols they feel are unnecessary for a "tool." This creates friction: they get the regulatory headache of life without the scientific credit of life.
  *   **Why the Procedure does this:** To protect the "Active Life" classification for autonomous systems. If you classify the Polymer as "Life," you blur the line between a tool and an organism, creating a metaphysical nightmare for future containment protocols. This procedure chooses regulatory safety over scientific acclaim.

  *(Alternative Unpopular Outcome Note: If you had hoped to announce "Life" on Case 1 (Exoplanet), this procedure also blocks you, forcing the weaker "Biogenic Signature" language. This is scientifically more honest but programatically frustrating.)*

  ---

  ## Part 5: Limitations & Philosophical Encodings

  **What This Procedure Cannot Do:**
  1.  **Resolve the "Virus" Problem:** It does not explicitly categorize obligate parasites (like viruses) which fail Criterion A but pass B. It will likely classify them as "Synthetic Evolving Systems" or "Anomalies" depending on context, which virologists will contest.
  2.  **Handle Digital Life:** If a simulation meets B and D but has no physical substrate, Phase 2 (Path S) forces a "Synthetic" label, but Phase 4 (Hand-Off) admits the procedure cannot determine *moral status*. It kicks the can to the philosopher.
  3.  **Detect "Shadow Biospheres":** If a life form uses chemistry so alien that it passes the Abiotic Null (Q1) simply because we have no models for it, but also fails Criteria A/B/D because we don't recognize its metabolism, it will be classified as "Unexplained Anomaly" indefinitely.

  **Where It Will Misfire:**
  *   **The "Dormant" Trap:** In Case 3 (Martian Structure), if the structure is actually a spore in deep cryptobiosis, it will fail Criterion A (metabolism) and be downgraded to "Anomaly." The procedure favors *activity* over *potential*, risking false negatives for dormant life.
  *   **The "Technician" Loophole:** In Case 2, if the lab becomes fully automated, the "Technician" variable vanishes. The system might suddenly jump from "Not Life" to "Life" without changing its biology, solely due to a change in lab staffing.

  **Philosophical Choices Encoded:**
  1.  **Autopoiesis over Evolution (Criterion A as Gatekeeper):** By requiring Criterion A (Self-Maintenance) for "Active Life," this procedure encodes the **Metabolism-First** philosophical stance. It rejects the view that evolution alone (Criterion B) is sufficient for life. This is a value judgment: we value *autonomy* as much as *heritability*.
  2.  **The "Natural Kind" Assumption:** The procedure assumes "Life" is a distinct category that can be checked off (Yes/No). This encodes a **Natural Kind** ontology, ignoring the **Cluster Concept** view where something might be "50% alive." The procedure forces a binary decision for regulatory convenience.
  3.  **The Epistemic Barrier:** By restricting Remote observations (Path R) from ever achieving "Active Life" status, the procedure encodes an **Empiricist** constraint: you cannot claim *process* (Life) from *snapshot* (Spectra). This prioritizes ontological certainty over probabilistic inference.

  **Final Note to Chair:**
  When the panel argues about whether something "feels" alive, refer them to the Scorecard (Phase 3). If the boxes are not checked, the feeling is irrelevant to the classification. If the boxes are checked but the feeling is wrong, trigger the Philosophical Hand-Off (Q7). Do not debate the definition; audit the evidence against the criteria.
