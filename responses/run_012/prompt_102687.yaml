answer: |-
  This is one of the classic puzzles of post-Cold War international relations. You have identified the gap between *legality* (UN Charter compliance) and *legitimacy* (moral/political acceptance). The inconsistency you're seeing isn't just confusion; it reflects a specific, unstable compromise that emerged in the 1990s and fractured in the 2000s.

  Here is the breakdown of the implicit theory governing current practice, how your friend's proposal compares, and where the underdetermination lies.

  ### 1. The Implicit Theory: "Proceduralism with a Moral Safety Valve"

  The pattern you describe (Kosovo = okay; Iraq = not okay; Libya = okay-but-be-careful) does not follow a strict legalist theory, nor a pure moral theory. It follows a **hybrid theory of Institutional Legitimacy with Exceptional Override.**

  **The Core Presupposition:**
  Legitimacy is primarily procedural (derived from the UN Security Council), *unless* the procedure is blocked by unreasonable vetoes in the face of imminent humanitarian catastrophe, *and* the intervening coalition meets specific secondary criteria.

  **How it explains your triad:**
  *   **Kosovo (1999):** Lacked procedure (UNSC), but triggered the "Safety Valve." Why was it forgiven?
      1.  **Imminence:** Massacres were happening *now* (Račak).
      2.  **Multilateralism:** It was NATO (a standing alliance), not a single state.
      3.  **Last Resort:** Diplomatic options (Rambouillet) were exhausted.
      4.  **Proportionality:** Air campaign, no ground invasion initially.
      *Verdict:* "Illegal but legitimate."
  *   **Iraq (2003):** Lacked procedure. Did it trigger the Safety Valve? No.
      1.  **Imminence:** The humanitarian case was retrospective (Saddam was bad) not prospective (imminent genocide). The primary casus belli was WMDs.
      2.  **Multilateralism:** "Coalition of the Willing" (viewed as US-led).
      3.  **Last Resort:** Inspectors were still working.
      *Verdict:* Illegal and illegitimate.
  *   **Libya (2011):** Had procedure (UNSC Res 1973).
      1.  **Legitimacy Pass:** The resolution existed.
      2.  **The Catch:** The controversy arose because NATO interpreted "protect civilians" as "remove the head of state." This violated the implicit contract of the Safety Valve: you can bypass the UN in emergencies, but if you *have* the UN, you must stick to the mandate.
      *Verdict:* Legal, but legitimacy eroded due to mandate creep.

  **Rival Views This Quietly Rules Out:**
  1.  **Strict Charter Legalism:** This view holds Article 2(4) (ban on force) as absolute except for self-defense. It rules out Kosovo entirely. The current practice rejects this by admitting Kosovo was "legitimate."
  2.  **Pure Just War Theory (Moralism):** This view holds that if the *cause* is just, the intervention is legitimate regardless of the UN. This would likely license Iraq (if one accepts the humanitarian retrofitting) and certainly Kosovo. Current practice rejects this by condemning Iraq despite some humanitarian arguments.
  3.  **Sovereigntism/Realism:** This view holds that intervention is never legitimate unless it serves national interest or is invited. It rules out all three as "legitimate" in a moral sense, viewing them only as power projections.

  ### 2. Your Friend's Proposal: Hypothetical Consent

  Your friend is proposing a shift from **Institutional Legitimacy** to **Liberal Contractualism**.

  **The Theory:**
  Legitimacy derives from the will of the governed. Since victims under a dictatorship cannot vote, we use a counterfactual: *Would they consent to intervention if asked?* This is rooted in Kantian autonomy and modern "Democratic Peace" theory.

  **Does it resolve the Kosovo/Iraq/Libya mess?**
  It clarifies the moral intuition but creates new epistemic problems.
  *   **Kosovo:** Resolves cleanly. The Albanian population overwhelmingly welcomed NATO. Hypothetical consent aligns with actual reception.
  *   **Iraq:** Resolves cleanly (mostly). While some groups welcomed the fall of Saddam, the Sunni population and many nationalists did not consent. The "rescued" were not a monolith.
  *   **Libya:** Complicated. Benghazi consented; Tripoli and Sirte were loyalist strongholds. Who counts as "the people"? The whole state or the threatened group?

  **Where it just relocates the problem:**
  1.  **The Epistemic Problem:** You cannot ask them. We infer consent based on who cheers when the troops arrive. But people might cheer out of fear or short-term relief, only to resent occupation later (see Iraq 2004–2006).
  2.  **The Systemic Problem:** This theory ignores the *externalities* of intervention. Even if Libyans consented, the *precedent* of regime change under a protection mandate made Russia and China veto future resolutions (e.g., Syria). Hypothetical consent of the victims doesn't account for the security interests of the international system.
  3.  **The "Savior" Bias:** It assumes the intervener can accurately gauge consent. Historically, interveners almost always claim the locals consent (e.g., Soviets in Afghanistan, US in Vietnam). Without the UNSC as a third-party validator, "consent" becomes a rhetorical tool for the aggressor.

  ### 3. Underdetermination: Could Other Theories License the Same Record?

  This is the most critical philosophical point. **Yes.** You can arrive at the exact same judgments (Kosovo=Good, Iraq=Bad, Libya=Mixed) using entirely different theoretical frameworks. This means the *verdicts* don't prove the *theory*.

  **A. Act Utilitarianism (Consequentialism)**
  *   **Theory:** An intervention is legitimate if it produces the best net outcome.
  *   **Application:**
      *   Kosovo: Stopped ethnic cleansing, relatively low NATO casualties, stable(ish) outcome. **Verdict: Good.**
      *   Iraq: High casualties, destabilized region, rise of ISIS. **Verdict: Bad.**
      *   Libya: Gaddafi fell, but state collapsed into warlordism. **Verdict: Mixed/Bad.**
  *   **Result:** Matches current practice almost perfectly.
  *   **Difference:** Utilitarianism is purely backward-looking. Current practice tries to be forward-looking (setting rules for the future).

  **B. Great Power Concert (Realist Legitimacy)**
  *   **Theory:** Legitimacy is simply the absence of veto by a rival Great Power.
  *   **Application:**
      *   Kosovo: Russia was weak/dependent on IMF; didn't escalate. **Verdict: Tolerated.**
      *   Iraq: Russia and France threatened vetoes; global protests. **Verdict: Illegitimate.**
      *   Libya: Russia abstained (didn't veto). **Verdict: Legitimate.**
  *   **Result:** Matches the procedural outcome perfectly.
  *   **Difference:** This theory admits "morality" is irrelevant. It says Kosovo wasn't "morally justified," it was just "geopolitically convenient."

  ### 4. Summary of the Tension

  The reason you and your friend are going in circles is that you are arguing over **Source of Authority**, while the actual practice is determined by **Retrospective Consensus.**

  1.  **Your Position (Implicitly):** You are defending the **Institutional Compromise**. You want the UNSC to matter because it preserves international order, but you admit moral necessity can override it in extreme cases (Kosovo). You worry that if we discard authorization (your friend's view), we return to an era where strong nations invade weak nations claiming "they wanted it."
  2.  **Your Friend's Position:** They are defending **Moral Particularism**. They argue that institutions (UNSC) are often held hostage by dictators (Russia/China vetoing Syria), so legitimacy must reside in the victims' rights, not the bureaucrats' signatures.

  **The Underdetermined Gap:**
  The practice is underdetermined because **Libya** broke the compromise.
  *   Before Libya, the rule was: *UNSC authorization is required, unless it's a genocide and the UNSC is deadlocked (Kosovo).*
  *   After Libya, the rule became: *UNSC authorization is required, but if you get it, don't use it for regime change, or we (Russia/China) will block everything forever (Syria).*

  **Conclusion:**
  The current practice presupposes that legitimacy is **intersubjective**. It isn't found in the text of the resolution (Legalism) nor solely in the moral truth (Just War). It is found in the *acceptance* of the intervention by the relevant international community *after the fact*.
  *   Kosovo was accepted retrospectively.
  *   Iraq was rejected retrospectively.
  *   Libya was accepted procedurally but rejected politically by the BRICS nations subsequently.

  Your friend's theory (Consent) is morally cleaner but institutionally dangerous. Your implicit theory (UNSC + Override) is institutionally safer but morally inconsistent. The "mess" isn't a failure of logic; it's the friction between **Order** (UN Charter) and **Justice** (Human Rights). No theory resolves it; they only prioritize one over the other. The current practice tries to hold both, which is why it looks inconsistent when stressed.
