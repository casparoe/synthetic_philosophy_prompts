      *   *Problems:* Counterfactuals are slippery. Who counts as "the people"? What if they are misinformed? It ignores the *systemic* cost of bypassing the UN (precedent setting).
      *   *Verdict:* It relocates the problem from "Who signed the paper?" to "Who speaks for the victims?"

  4.  **Analyze Underdetermination (Could other theories license the same record?):**

      *   Yes. A "Consequentialist/Utilitarian" theory could justify the exact same judgments based on outcomes (Kosovo = good outcome; Iraq = bad outcome; Libya = mixed).
