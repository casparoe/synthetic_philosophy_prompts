      *   **The Question:** What theory of legitimacy underpins this pattern? Is it procedural (UNSC), moral (outcome), or hybrid? Is it consistent to treat Kosovo and Iraq differently despite both lacking authorization?
      *   **The Friend's Proposal:** Scrap authorization; use hypothetical consent of the rescued population.
      *   **The Request:** Spell out the implicit theory behind current practice, identify rival views it rules out, analyze the friend's proposal (does it help?), and determine if the practice is underdetermined (could other theories justify the same record?).

  2.  **Analyze the "Current Practice" (The Liberal Internationalist Compromise):**

