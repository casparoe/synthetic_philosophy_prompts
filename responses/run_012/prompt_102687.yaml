      *   *Implicit Theory:* "Procedural Legitimacy with a Moral Safety Valve."
      *   *Mechanism:* UNSC authorization is the default *necessary* condition. However, in extreme cases (genocide/imminent massacre), moral necessity can override procedural legality *if* the intervention is multilateral, proportional, and successful.
      *   *Why Kosovo vs. Iraq?*
          *   Kosovo: Imminent humanitarian catastrophe, multilateral (NATO), last resort (Rambouillet failed), limited scope (air campaign, no occupation initially).
