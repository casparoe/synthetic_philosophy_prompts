  The air is cold between.
  I reach to touch your arm.
  The wool feels rough as real.
  We speak for a moment.
  Then the light goes out.

  ***

  Panel one uses 'looks' epistemically (evidence of a fact); panel two uses it phenomenally (the fact of appearance).
  The punctuation isolates the look from the world, shifting it from conditional to absolute.
  A common-factor theorist will argue that identical descriptions prove identical inner states,
  ignoring the disjunctivist claim that the object's presence constitutes the experience itself, not merely causes it.
  The shift from 'and' to 'as' marks the difference between a property of the world and a property of the encounter.
