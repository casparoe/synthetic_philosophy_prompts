      *   **Colleague's Position:** Manipulation is to persuasion as hacking is to handing over a document. Manipulation exploits mental machinery; persuasion offers something to evaluate. This makes manipulation presumptively wrong and autonomy-undermining (dark patterns, microtargeting, casino programs vs. ordinary ads/argument).
      *   **Task:** Evaluate how far the analogy holds.
      *   **Structure:**
          1.  Verdict in the first sentence.
