  4.  **Identifying Disanalogies:**
      *   *Those that do NOT matter (for his use):*
          *   Physical vs. Mental substrate (doesn't change the ethical structure).
          *   Intent of the "designer" (Evolution vs. Engineer) - though this touches on the "proper function" point, for the *ethical* classification of the act, it might be secondary.
          *   Reversibility/Patching (You can patch software; retraining cognition is harder, but the wrongness lies in the act, not the fix).
      *   *Those that DO matter:*
          *   Normative ambiguity of "proper function" (Computers have specs; minds have debated teleologies).
          *   Integration of processes (Reason and emotion aren't separate modules like code and buffer overflows).
          *   Consent/Expectation (Users expect documents; do they expect social interaction to be non-exploitative?).

  5.  **Addressing the Three Specific Questions:**

      *   *Q1: Designer-specified proper functions.*
          *   Computers have specs. Minds have evolutionary functions (truth-tracking, survival) but also normative functions (autonomy, rationality).
          *   If the mind lacks a clear spec, "hacking" becomes undefined.
