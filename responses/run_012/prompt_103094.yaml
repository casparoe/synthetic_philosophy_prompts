answer: |-
  This is a critical juncture for your dissertation. To evaluate whether a decision theory has successfully "handled" fanaticism, you cannot simply ask if it avoids counterintuitive results; you must specify the cost paid to avoid them. Below is the specification of desiderata you requested, followed by an analysis of your "Repeat Mugger" case, a classification of constraints, and the identification of the impossibility results that should form the core of your chapter.

  ---

  ### I. The Specification: Desiderata for Handling Fanaticism

  To count as a solution, a decision theory must provide a determinate verdict on the following cases, maintain the following distinctions, and satisfy the following formal constraints.

  #### A. The Cases (Verdict Conditions)
  1.  **The Classic Mugger:** A request for a small sacrifice ($10) for a tiny probability ($10^{-100}$) of an astronomical payoff ($10^{100}$ utility).
      *   *Requirement:* The theory must yield a stable verdict (Reject or Accept) without relying on arbitrary probability cutoffs.
  2.  **The St. Petersburg Game:** A gamble with infinite expected value.
      *   *Requirement:* The theory must distinguish between games with infinite EV that are intuitively worth different amounts (e.g., standard St. Petersburg vs. "Pasadena" style games with undefined expectations).
  3.  **The Undefined Expectation:** Cases where the sum of probability $\times$ utility does not converge (e.g., the Pasadena Game).
      *   *Requirement:* The theory must not force an arbitrary assignment of value where the mathematics is undefined.
  4.  **The Repeat Mugger (Your Case):** $n$ independent iterations of the Classic Mugger. Individually $EV > 0$; collectively, probability of total ruin $\to 1$.
      *   *Requirement:* The theory must reconcile the single-case verdict with the sequential verdict (see Section II).

  #### B. The Distinctions (Conceptual Boundaries)
  1.  **Epistemic vs. Aleatory Uncertainty:** The theory must distinguish between risk (known probabilities) and ambiguity/ignorance (undefined/imprecise probabilities). A solution that handles Pascal's Mugging by claiming "the probability is undefined" must not collapse this into "the probability is zero."
  2.  **Structural vs. Parametric Risk Aversion:**
      *   *Parametric:* Risk aversion is a feature of the utility function (diminishing marginal utility).
      *   *Structural:* Risk aversion is a feature of the decision rule (e.g., Risk-Weighted Expected Utility).
      *   *Requirement:* The theory must be explicit about which it employs. Conflating them obscures whether the anti-fanaticism result comes from valuing money less or from reasoning differently.
  3.  **Infinite vs. Undefined:** The theory must treat "Expectation = $\infty$" differently from "Expectation does not exist." Collapsing these leads to paralysis in the face of undefined games.

  #### C. The Formal Constraints (Rational Norms)
  1.  **State-Wise Dominance:** If Act $A$ yields a better outcome than Act $B$ in every possible state of the world, $A$ is preferred to $B$.
  2.  **Diachronic Consistency (Dynamic Consistency):** If you plan a sequence of choices at $t_1$, you should not have an incentive to deviate from that plan at $t_2$ without new information.
  3.  **Coherence (No Dutch Books):** The agent's preferences should not expose them to a sure loss through a combination of bets.
  4.  **Separability (The Independence of Irrelevant Alternatives):** The choice between $A$ and $B$ should not depend on the presence of $C$, nor on how the choice is framed (extensionality).

  ---

  ### II. Analysis: The "Repeat Mugger" Desideratum

  **Is this a genuine desideratum or bookkeeping sleight of hand?**

  It is a **genuine desideratum**. It is not sleight of hand; it is an instance of the **Aggregation Problem** applied to dynamic choice.

  *   **The Tension:** Standard Expected Utility Theory (EUT) is *separable*. It evaluates acts based on their individual expected utility. If $EV(\text{Bet}) > EV(\text{Status Quo})$, EUT says take the bet. It does not care that taking $n$ bets leads to ruin, because the expectation of the *sequence* is also infinite (or astronomically high), dominated by the tiny possibility that you win *all* of them.
  *   **The Challenge:** If your theory says "Reject the Single Mugger," you have solved fanaticism but perhaps at the cost of Dominance. If your theory says "Accept the Single Mugger" (to preserve linearity/EV), it **must** explain why accepting the Sequence is irrational, or it must bite the bullet that ruining yourself is rational.
  *   **Why it matters:** This tests **Dynamic Consistency**. A theory that says "Take the single bet" but "Reject the sequence of bets" violates separability unless it incorporates a *policy-based* constraint (like a Kelly Criterion or a constraint on geometric growth rather than arithmetic).
  *   **Verdict:** Include it. It forces the theorist to choose between **Myopic Rationality** (maximize EV at every node) and **Strategic Rationality** (maximize EV of the whole path). Most anti-fanaticism theories implicitly rely on Strategic Rationality but fail to formalize it.

  ---

  ### III. Classification: Non-Negotiable vs. Camp Preference

  For your dissertation, you must distinguish between constraints that define *rationality* and constraints that define *your specific theory*.

  #### Non-Negotiable (The "Cost of Entry")
  *If a theory violates these, it is generally considered broken as a normative guide for agency.*
  1.  **State-Wise Dominance:** If you prefer an outcome that is strictly worse in every possible world, you are irrational. (Note: *Stochastic* Dominance is more contested in infinite contexts, but State-Wise is robust).
  2.  **Logical Consistency:** Preferences must be transitive.
  3.  **Diachronic Consistency:** You cannot be rationally required to plan $X$ and then rationally required to abandon $X$ without new info. (This kills many "naive" anti-fanaticism heuristics).

  #### Camp Preference (The "Theoretical Forks")
  *These are where the debates lie. A theory must pick a side, but picking a side doesn't invalidate the theory.*
  1.  **Unbounded Utility:**
      *   *Camp A:* Utility must be unbounded (to allow for infinite moral value, etc.).
      *   *Camp B:* Utility must be bounded (to avoid fanaticism).
  2.  **The Independence Axiom:**
      *   *Camp A:* Preserve Independence (leads to EUT and Fanaticism).
      *   *Camp B:* Relax Independence (leads to Risk-Weighted EU or similar, avoids Fanaticism).
  3.  **Probabilistic Precision:**
      *   *Camp A:* Credences must be precise real numbers (Bayesianism).
      *   *Camp B:* Credences can be imprecise/sets of probabilities (allows suspending judgment on the Mugger's claim).
  4.  **Aggregation Method:**
      *   *Camp A:* Arithmetic Mean (Expected Value).
      *   *Camp B:* Geometric Mean (Growth Optimal/Kelly) or Median.

  ---

  ### IV. The Impossibility Result: Jointly Unsatisfiable Subsets

  This is the most important part of your chapter. You cannot satisfy all desiderata simultaneously. Recent literature (specifically **Beckstead & Thomas, 2021**) has formalized this trilemma.

  **The Fanaticism Trilemma:**
  No decision theory can satisfy the following three conditions simultaneously:

  1.  **Unbounded Utility:** There is no upper limit to the value of outcomes (you can always imagine a world twice as good).
  2.  **State-Wise Dominance (or Stochastic Dominance):** If one option is better than another in every state (or with probability 1), choose it.
  3.  **Anti-Fanaticism:** There exists some tiny probability $p$ and some finite cost $c$ such that you should *not* pay $c$ for probability $p$ of an enormous good, regardless of how large the good is.

  **The Implications for Your Chapter:**
  *   **If you keep Unbounded Utility + Dominance:** You **must** accept Fanaticism (Standard EUT).
  *   **If you keep Dominance + Anti-Fanaticism:** You **must** accept Bounded Utility (e.g., von Neumann-Morgenstern with a cap). *Cost:* This implies that saving a billion lives is not significantly better than saving a million lives once you hit the "cap," which violates moral intuition.
  *   **If you keep Unbounded Utility + Anti-Fanaticism:** You **must** violate Dominance. *Cost:* You are rationally required to choose an option that is strictly worse in every possible state of the world. (This is the route of Risk-Weighted Expected Utility).

  **Additional Impossibility (The Repeat Mugger Specific):**
  *   **Separability + Anti-Fanaticism + EV Maximization:** You cannot maintain that decisions are separable (evaluate each bet on its own) while also rejecting the sequence of bets that leads to ruin.
      *   *Resolution:* You must either accept the ruin (EV Max), reject the single bet (Anti-Fanaticism), or reject Separability (Policy-based views).

  ### Recommendation for the Dissertation

  Do not try to solve the trilemma. Instead, use your chapter to **map the cost of the solution.**

  1.  **Adopt the Trilemma as your framework.** Explicitly state that "Handling Fanaticism" is not about finding a theory that has no costs, but about choosing which cost is least damaging.
  2.  **Use the "Repeat Mugger" to test Dynamic Consistency.** Show how Bounded Utility solves the single case easily but might struggle with the sequence if not carefully formulated, whereas Risk-Weighted views handle the sequence by altering the weighting of probabilities in a way that violates Independence.
  3.  **Final Decision:** When you settle on a camp, justify it by arguing that the constraint you are violating (e.g., Unbounded Utility or Dominance) is the one we can least afford to keep, given the desiderata list above.

  **Key Reference for your bibliography:**
  *   Beckstead, N., & Thomas, T. (2021). *A Paradox for Tiny Probabilities and Enormous Values.* (This paper proves the trilemma formally).
  *   Russell, J. S., & Isaacs, Y. (2021). *Infinite Ethics.* (For the distinction between infinite and undefined expectations).
  *   Buchak, L. (2013). *Risk and Rationality.* (For the violation of Independence as a solution).

  This specification gives you a rigorous grid to evaluate any theory you consider. If a theory claims to solve fanaticism, ask it: "Which horn of the trilemma did you grab?"
