  for my dissertaion chapter I need to finally settle on a decision theory for the fanaticism stuff, but before I pick a camp I want the actual spec first — what does a theory of rational choice under uncertainty have to deliver to count as having "handled" expected-value fanaticism? give me the desiderata: the cases it has to get right, the distinctions it can't collapse, the formal constraints it has to satisfy, with the consideration behind each. cases I've got so far: the classic pascal's mugging (tiny probablity, astronomically huge payoff), st petersburg-style unbounded expectation, and the ones where you can't assign a probability at all. distinctions I don't want blurred: small-but-precise probability vs imprecise/undefined probability; risk-aversion as a taste vs as a requirement of rationality; "the expectation is infinite" vs "the expectation is undefined." formal constraints: dominance, consistency, no dutch books, that kind of thing.

  and here's one I've been chewing on that I want the list to have to handle — call it the repeat mugger: a mugger offers you the same enormous payoff on n separate occasions, each gamble has positive expected value taken on its own, but accepting them all drains your finite stake with probability approaching 1. so any theory that says take each one individually owes an account of the sequence. is that a genuine desideratum or just bookkeeping sleight of hand?

  then flag which of the desiderata are non-negotiable and which are just one camp's preference, and tell me which subset you think is jointly unsatisfiable. that last bit is what I actually need for the chapter.
