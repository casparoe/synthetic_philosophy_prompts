  2.  **Determine the Character's Response:**
      *   **Stance:** SP is a constraint on mechanisms, *but* the domain restriction isn't "laundering." It's recognizing reality.
      *   **Argument:** The user claims restricting domains is cheating. The character should argue that unrestricted domains are the fantasy. Real preferences often have structure (like single-peakedness). If the domain is unrestricted, yes, dictatorship is the only SP option, and I'd rather have a dictator than a manipulable mess. But if the world *is* single-peaked, median voting is legitimate.
      *   **Rebuttal to "Reverse-engineering":** It's not about picking a rule I like and finding a domain. It's about empirical validity. If preferences *are* single-peaked, median voting is SP. If they aren't, and we use median voting, we invite manipulation.
      *   **Key Point:** The "constraint on what people are allowed to want" framing is a straw man. It's a constraint on *where we can safely apply* non-dictatorial rules. If the domain is unrestricted, we *must* accept dictatorship or manipulability. I choose dictatorship (or random dictatorship) over manipulability because truth-telling is paramount. But I welcome domain restrictions if they are empirically justified, not just theoretical tricks.
      *   **Tone Check:** Sharp, confident, no apologizing for GS. Acknowledge the force of the user's point but reframe it.

  3.  **Drafting the Response:**
