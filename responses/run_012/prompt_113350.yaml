answer: |-
  **PHI 405: Philosophy of Medicine — Final Examination**
  **Time Allowed: 90 Minutes**

  **Question 1**

  Consider the following stipulated case regarding adult lactase non-persistence. In humans, as in most mammals, the production of lactase (the enzyme required to digest milk sugar) is typically downregulated after weaning. This non-persistence is the statistical norm for the species *Homo sapiens* globally. The persistence variant is a recent, geographically localized evolutionary exception.

  Imagine two individuals, **A** and **B**. They are physiologically identical: both are adults with lactase non-persistence.
  *   **Individual A** lives in a society where the food supply depends heavily on untreated dairy. A experiences gastrointestinal distress, malnutrition, and seeks treatment.
  *   **Individual B** lives in a society with no dairy production and no cultural expectation that adults digest milk. B experiences no symptoms and seeks no treatment.

  In a well-organized essay, address the following four points:

  1.  **The Biostatistical Account (BST):** Explain what Christopher Boorse's BST must conclude about the disease status of A and B if the reference class is the entire species. Explain how the conclusion changes if the reference class is drawn more narrowly (e.g., "adults in dairy-dependent societies"). Why is the choice of reference class not settled by biological facts alone?
  2.  **The Harmful Dysfunction Analysis (HDA):** Explain what Jerome Wakefield's HDA must conclude about A and B. Specifically, analyze how the assessment shifts if the relevant function is specified by the mechanism's evolutionary selected effect rather than its current causal role.
  3.  **The Two-Index Account:** Assess the position presented in lecture: a state is a disease only if (Index 1) a mechanism fails its selected function AND (Index 2) that failure impairs the organism's ability to meet the demands of its *actual environment*. Does Index 2 allow this account to retain the value-free status naturalists desire, or does it merely relocate the reference-class problem? Distinguish between taking the environment descriptively versus fixing it by a privileged, species-typical baseline.
  4.  **Position:** Take a side among these three accounts. Name precisely what your chosen position must give up (e.g., objectivity, extensional adequacy, or moral neutrality) to maintain coherence.

  ***

  **Model Answer**

  The case of adult lactase non-persistence exposes the fault lines between naturalist and normativist definitions of disease. By holding physiology constant while varying the environment, we test whether disease is a fact of the body or a relation between the body and the world.

  Regarding the Biostatistical Account (BST), Boorse defines health as statistical normality of function within a reference class. If the reference class is the entire species, both A and B are healthy. Lactase non-persistence is the species-typical design; therefore, their physiological state is statistically normal. Biological function is contributing to survival and reproduction as designed by evolution for the majority of humans. However, if the reference class is narrowed to "adults in dairy-dependent societies," A becomes diseased. Within this subgroup, non-persistence is statistically abnormal and reduces functional efficiency. The critical philosophical problem is that biology cannot dictate the correct reference class. Choosing the species-wide class privileges evolutionary history over current ecology, while choosing the narrow class privileges current ecology over history. This choice is pragmatic or normative, not biological, undermining the BST's claim to be purely value-free.

  The Harmful Dysfunction Analysis (HDA) requires both a failure of internal mechanism (dysfunction) and a negative value judgment (harm). For Wakefield, dysfunction is usually tied to the selected effect—the reason the mechanism was evolved. Lactase downregulation is the selected effect; thus, strictly speaking, neither A nor B suffers a dysfunction. Their mechanisms are working as evolution designed. However, if function is specified by current causal role (digesting available food), A suffers a dysfunction. Regarding harm, A is clearly harmed (distress, malnutrition), while B is not. The HDA struggles here: if it sticks to evolutionary selected effects, it cannot classify A's condition as a dysfunction, failing to capture the medical reality. If it shifts to causal roles, it risks becoming too inclusive, labeling any inability to cope with a novel environment as a dysfunction.

  The Two-Index Account attempts to bridge this gap. Index 1 requires a failure of selected function. As established, evolutionarily, there is no failure here for either individual. However, let us assume for the sake of the account that we interpret "selected function" loosely enough to trigger Index 1, or focus on Index 2. Index 2 requires impairment in the *actual environment*. A is impaired; B is not. Thus, A is diseased, B is healthy. This saves extensional adequacy. However, does it retain naturalist objectivity? No. The "demands of the actual environment" are not objective facts in the same way enzyme levels are. Environments are human constructions. A dairy society is a specific cultural niche. By making disease relative to the "actual environment," the account relocates the reference-class problem. If we take the environment descriptively (whatever niche the person occupies), disease becomes radically relativistic. If we fix the environment by a privileged, species-typical baseline (e.g., Paleolithic conditions), we return to the BST's problem of ignoring current suffering. The Two-Index Account hides the normative choice within the definition of "actual environment."

  Taking a side, I defend a modified normativist position. We must accept that disease concepts are inherently evaluative. To maintain coherence, this position must give up the claim to value-free objectivity. Naturalist accounts like BST and the Two-Index Account strive for scientific neutrality but fail because they cannot non-arbitrarily select reference classes or environments without implicitly valuing certain forms of life over others. By admitting that calling A "diseased" is a judgment that their environment *ought* to be compatible with their physiology (or vice versa), we gain conceptual clarity. We sacrifice the dream of a purely biological definition of disease, but we gain the ability to justify treatment for A without having to pretend their biology is broken in a vacuum. The cost is accepting that medicine is not merely applied biology, but applied ethics.

  ***

  **Marking Scheme (30 Marks Total)**

  | Criterion | Marks | Specific Moves Required | Common Error |
  | :--- | :---: | :--- | :--- |
  | **1. Biostatistical Account** | **7** | **Species Class (2):** Correctly identifies A & B as healthy/non-diseased under species-wide norms. | Claims A is diseased because they have symptoms (ignores statistical norm). |
  | | | **Narrow Class (2):** Correctly identifies A as diseased under narrow cultural reference class. | Fails to note that B remains healthy even in the narrow class if defined by physiology. |
  | | | **Reference Class Problem (3):** Explains that biology cannot dictate the class choice; it is normative/pragmatic. | Asserts the "correct" class is biological fact rather than a philosophical choice. |
  | **2. Harmful Dysfunction** | **7** | **Selected Effect (3):** Notes that non-persistence is the evolved design, so strictly no dysfunction exists. | Confuses "harm" with "dysfunction" and claims dysfunction exists solely due to symptoms. |
  | | | **Causal Role Shift (2):** Explains how shifting to causal role changes the dysfunction assessment. | Treats selected effect and causal role as identical concepts. |
  | | | **Harm Condition (2):** Distinguishes A (harmed) from B (not harmed) regarding the value component. | Claims B is harmed because they *could* move to a dairy society (counterfactual harm). |
  | **3. Two-Index Account** | **10** | **Application (3):** Correctly applies both indices to show A is diseased, B is not (assuming Index 1 met). | Fails to apply both indices conjunctively; treats them as alternative conditions. |
  | | | **Value-Free Status (4):** Argues Index 2 relocates the reference class problem; "actual environment" is not value-free. | Accepts the account's claim to naturalism without critiquing the definition of "environment." |
  | | | **Descriptive vs. Privileged (3):** Distinguishes between relativistic environment vs. species-typical baseline. | Conflates "actual environment" with "natural environment" without distinguishing baselines. |
  | **4. Position & Trade-off** | **6** | **Clear Stance (2):** Explicitly chooses one account or a modified position. | Hedges without committing to a specific view or conclusion. |
  | | | **Identified Trade-off (4):** Precisely names what is sacrificed (e.g., objectivity, extensional adequacy). | Claims their chosen view has no downsides or sacrifices something irrelevant (e.g., "popularity"). |
  | **Total** | **30** | | |
