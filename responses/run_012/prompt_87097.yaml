  This is an excellent test case. It is physically concrete, historically documented, and carries high stakes, which makes it superior to the usual QWERTY debates where the counterfactual (a better keyboard layout) is hard to prove.

  Here is the mapping of Japan's frequency split onto the path-dependence literature, followed by an analysis of where the theory holds and where it frays.

  ### 1. Mapping the Mechanism: Increasing Returns vs. Sunk Costs

  To fit the Paul David / Brian Arthur model, you need three ingredients: (1) a contingent small event, (2) a mechanism of increasing returns (positive feedback), and (3) an outcome that is potentially inefficient or hard to reverse.

  **The Contingent Event:**
  The initial choice was genuinely contingent in the relevant sense. In the mid-1890s, there was no overwhelming technical consensus that 50Hz was superior to 60Hz or vice versa. 50Hz was associated with AEG (Germany/Europe) and 60Hz with Westinghouse/GE (US). Tokyo Electric Light Company bought AEG generators; Osaka Denki bought GE generators. This was largely a matter of which sales representative arrived first or which financing deal looked better. Neither frequency offered a decisive advantage for incandescent lighting or early induction motors.

  **The Mechanism:**
  This is where the distinction matters for the theory.
  *   **Increasing Returns (Arthur's view):** As Tokyo added more customers, it became cheaper to add more 50Hz generators and motors because the supply chain, maintenance expertise, and appliance market were all 50Hz. This is a network effect. The value of being on the 50Hz grid increased as more people joined the 50Hz grid.
  *   **Sunk Costs (Skeptics' view):** The infrastructure (transformers, transmission lines, consumer appliances) is durable capital. Replacing it is expensive.

  In the Japan grid case, **both** are present, but they operate at different stages.
  *   *Early stage (1900–1940):* Increasing returns dominated. As regional grids formed, utilities standardized internally to maximize interoperability.
  *   *Late stage (1950–Present):* Sunk costs dominate. The grid is fully built. The barrier to unification is no longer that "50Hz is the standard," but that "replacing every transformer and motor in Eastern Japan costs trillions of yen."

  **Does the distinction matter?**
  Yes. If the persistence is due to *dynamic increasing returns*, it suggests the system is actively resisting change because the alternative is less valuable *now* (e.g., no one makes 60Hz parts anymore). If it is due to *sunk costs*, it suggests the alternative is technically fine but economically prohibitive. The skeptic argument (Liebowitz & Margolis) is that "lock-in" is just a fancy word for "switching costs exceed benefits." Japan's grid looks more like the latter today than the former.

  ### 2. The "Side-by-Side" Claim and the Timing of Lock-in

  You mentioned reading that regions ran both frequencies side-by-side. This is a crucial nuance that complicates the "1890s decision" narrative.

  It is true that in the very early decades, Japan's electrification was fragmented. Many local utilities operated isolated micro-grids. There were periods where different frequencies coexisted even within the same broader region before the grids were interconnected.

  **Why this matters for the theory:**
  It suggests the "lock-in" did not happen in the 1890s. It happened later, during the period of **grid consolidation (1920s–1950s)**. As utilities merged to improve reliability and share hydro resources, they had to standardize. Eastern utilities merged into a 50Hz bloc; Western into a 60Hz bloc.

  This weakens the "small event" narrative slightly. It wasn't just that Tokyo bought German generators in 1895; it was that over the next 50 years, no central authority forced a standardization during the consolidation phase. The "path" wasn't a single fork in the road; it was a gradual hardening of regional boundaries. This makes the outcome less about a random historical accident and more about a **coordination failure** during industrial policy formation.

  ### 3. Global Context: Contingency vs. Convergence

  You asked if the interesting fact is that Japan has *two* frequencies, rather than *which* two.

  Globally, the 50/60 split is not random. It tracks imperial and industrial spheres of influence (British/German sphere → 50Hz; US sphere → 60Hz). Europe converged on 50Hz; North America on 60Hz. In those cases, the "path dependence" operated at the continental scale.

  Japan is the anomaly because it imported *both* spheres of influence simultaneously during the Meiji modernization.
  *   **Confirmation of Theory:** It shows that without a coordinating mechanism (a state mandate or a dominant firm), local increasing returns will fragment a national system.
  *   **Challenge to Theory:** It suggests that "national standards" are not inevitable. If path dependence were absolute, one frequency should have choked the other out even within Japan. The fact that they coexisted implies the "increasing returns" weren't strong enough to force a winner *across* the regional boundary, only *within* it.

  ### 4. Where the Path-Dependence Story Breaks or Overreaches

  This is the critical part for your debate. The Japan grid case is often cited as a "gotcha" for path dependence, but a closer look reveals it might actually undermine the stronger claims of the theory (specifically the claim of *inefficient* lock-in).

  **A. The "Inefficiency" Problem**
  The Paul David QWERTY argument relies on the idea that we are stuck with an *inferior* technology. Is a split grid inferior?
  *   **Yes:** It reduces resilience (as seen in 2011). It prevents arbitrage of electricity prices. It complicates frequency regulation.
  *   **No:** It creates a "firewall." If a frequency collapse happens in the East (e.g., a massive generator trip), it doesn't necessarily cascade to the West because the AC tie is broken. Some engineers argue the split actually *improved* stability by compartmentalizing the grid.

  If the split has safety benefits, it's not an "inefficiency." It's a trade-off. If the cost of unification (replacing all infrastructure) exceeds the expected value of the power transfers you lose (discounted by the probability of another 2011-style event), then **keeping the split is the economically rational choice.**

  This supports the skeptics: It's not "lock-in" in the sense of being trapped in a bad equilibrium; it's "stability" in a good enough equilibrium where the cost of escape is higher than the cost of staying.

  **B. The Technology Escape Hatch (HVDC)**
  You noted that modern power electronics could "paper over" the split. High-Voltage Direct Current (HVDC) back-to-back converters can link asynchronous grids efficiently.
  *   Japan has been adding converter capacity (Sakuma, Shin-Shinano, etc.).
  *   This turns the problem from a **technical constraint** (physics of AC synchronization) into a **budget constraint** (cost of converter stations).

  If the barrier is just money, is it still path dependence?
  *   **Pro-Theory:** The reason you need the money is because of the historical legacy. If we started today, we'd build one HVDC national grid.
  *   **Anti-Theory:** If we can solve the problem by just buying more converters, the "lock-in" is porous. We aren't "stuck"; we are just choosing to invest marginally rather than comprehensively. The persistence of the split is a series of active decisions *not* to unify, based on cost-benefit analysis, not an inability to change.

  **C. The "Small Event" vs. "Geography" Argument**
  The boundary between 50Hz and 60Hz runs through Shizuoka and Niigata. This roughly follows the geological and population divide between the Kanto plain and the Chubu/Kansai regions.
  Some historians argue the split persisted not just because of frequency, but because Japan's mountainous terrain makes East-West transmission difficult regardless of frequency. If the transmission capacity would be low anyway due to geography, the cost of standardizing frequency yields less benefit. This suggests the "lock-in" is reinforced by geography, not just history.

  ### 5. Verdict: What this case shows back at the theory

  If you use this case to settle your argument, here is the nuanced scorecard:

  **1. Confirmation:** It confirms that **history matters (non-ergodicity).** You cannot understand the current grid topology without knowing about AEG and GE in the 1890s. A purely functionalist explanation ("this is the optimal grid design") fails completely.

  **2. Anomaly/Correction:** It challenges the **"Inefficiency Trap"** narrative. The grid split persists not because Japan *can't* fix it, but because the cost of fixing it is astronomically higher than the expected loss from keeping it. This aligns with the economic skeptics (Liebowitz & Margolis) who argue that "lock-in" is usually just rational resistance to switching costs.

  **3. Refinement:** It suggests that **modularity** can mitigate path dependence. By building frequency converters, Japan has decoupled the *physical standard* from the *network utility*. They accept the historical legacy (the frequencies) but engineer around the constraint (the converters). This suggests path dependence isn't a prison; it's a design parameter.

  **Conclusion for your debate:**
  You should argue that Japan's grid is a **confirmed case of path dependence in origin, but a disconfirmed case of path dependence in persistence.**
  *   **Origin:** Contingent, amplified by network effects (David/Arthur win).
  *   **Persistence:** Driven by switching costs and rational cost-benefit analysis, not dynamic inefficiency (Skeptics win).

  The "lock-in" story breaks when it implies the system is helpless. Japan *could* unify the grid if they treated it as a national security priority worth trillions of yen. The fact that they haven't suggests the "inefficiency" of the split is smaller than the theorists claim. The split is a scar, not a cage.

  **Uncertainty Note:**
  I am unsure about the exact extent of "dual frequency" capability in early industrial motors. While dual-frequency motors existed, they were more expensive and less efficient. If early industrialists widely adopted dual-frequency equipment, the "lock-in" would be much weaker. The consensus is they did not, but the degree to which this was a technical limitation vs. a cost choice in the 1920s is hazy. However, given the scale of transmission infrastructure, the motor issue is secondary to the grid synchronization issue.
