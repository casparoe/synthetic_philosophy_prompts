answer: |-
  ### Case 1: The Median Salary Committee (Domain Restriction)

  **The Scenario**
  A university department must set the starting salary for a new hire. The budget constraints restrict the choice to three discrete points: Low (£40k), Medium (£50k), or High (£60k). There are three committee members: Dr Frugal (F), Dr Moderate (M), and Dr Generous (G).

  **The Mechanism**
  The committee uses the **Median Voter Rule**. Each member reports their preferred salary. The outcome is the median of the three reported values. If there is a tie (e.g., two report Low), the tied value wins.

  **The Preferences**
  Crucially, the members' preferences are **single-peaked** over the ordered options £40k < £50k < £60k.
  *   **Dr Frugal:** £40k ≻ £50k ≻ £60k (Peak: Low)
  *   **Dr Moderate:** £50k ≻ £40k ≻ £60k (Peak: Medium)
  *   **Dr Generous:** £60k ≻ £50k ≻ £40k (Peak: High)

  Note that no voter prefers the extremes to the middle option. There are no "valleys" in their utility functions.

  **Strategy-Proofness and Non-Dictatorship**
  Suppose the true peaks are as above. The reported vector is (Low, Medium, High). The median is Medium (£50k).
  *   **Can Frugal gain by lying?** If Frugal reports Medium, the vector is (Medium, Medium, High), median is Medium. No change. If Frugal reports High, vector is (High, Medium, High), median is High. Frugal prefers £50k to £60k, so this move hurts. Frugal cannot manipulate.
  *   **Can Generous gain by lying?** Symmetric to Frugal. Reporting Low pushes the median to Low, which is worse than Medium.
  *   **Is it dictatorial?** If Moderate changes their peak to Low, the vector becomes (Low, Low, High) and the outcome shifts to Low. Since Moderate can influence the outcome, they are not a dummy. Since Frugal can also influence the outcome (if Moderate and Generous both report High, Frugal reporting Low makes it Medium, not High), no single agent dictates the result regardless of others' preferences.

  **The Load-Bearing Feature**
  The escape route here is the **Restriction on Preference Domain**. The Gibbard–Satterthwaite (GS) theorem assumes *unrestricted domain*: it must hold for *any* possible ordering of preferences. By restricting the domain to single-peaked preferences, we evade the theorem. Black's Median Voter Theorem applies instead.

  **What Collapses if Removed?**
  If we allow unrestricted preferences, the mechanism fails. Suppose Dr Frugal actually prefers High to Medium (perhaps a high salary signals prestige, even if costly). Frugal's ranking: £40k ≻ £60k ≻ £50k. This is not single-peaked (a valley at Medium). If Moderate and Generous report truthfully (Medium, High), the median is High. But if Frugal reports Low (truthful peak), the median is Medium. Frugal prefers High to Medium, so Frugal is happy. But imagine a different configuration: if the others report (Low, High), the median is determined by Frugal. If Frugal's preferences are non-single-peaked, they may have an incentive to report an extreme they don't want to pull the median away from a "valley" outcome. Strategy-proofness breaks immediately once the single-peaked condition is violated.

  **The GS Loyalist's Critique**
  A GS loyalist would argue this example cheats by assuming away the very conflict that makes social choice hard. They would insist: "In real departments, preferences are rarely perfectly single-peaked. A member might prefer a very low salary to ensure hiring equity, or a very high one to attract a star, but view the medium option as a wasteful compromise that achieves neither. By ruling out these 'valley' preferences *a priori*, you have solved the problem by definition, not by design. The theorem still holds for the general case; you have simply stepped outside its jurisdiction."

  ***

  ### Case 2: The Co-op Renovation Lottery (Randomisation)

  **The Scenario**
  A housing co-op with three members (Alice, Bob, Charlie) must choose one capital improvement: a Garden, a Roof Terrace, or a Gym. They cannot afford more than one. Tensions are high; each member has a distinct favourite.

  **The Mechanism**
  The co-op adopts a **Random Dictator** rule. Each member submits their top choice. A name is drawn from a hat with equal probability (1/3 each). The chosen member's top pick is implemented.

  **The Preferences and Payoffs**
  To evaluate lotteries, we assume members have von Neumann–Morgenstern utilities (cardinal payoffs) consistent with their ordinal rankings.
  *   **Alice:** Garden (3 utils), Terrace (2 utils), Gym (1 util).
  *   **Bob:** Terrace (3 utils), Gym (2 utils), Garden (1 util).
  *   **Charlie:** Gym (3 utils), Garden (2 utils), Terrace (1 util).

  **Strategy-Proofness and Non-Dictatorship**
  Suppose all report truthfully. The lottery is: 1/3 Garden, 1/3 Terrace, 1/3 Gym.
  *   **Alice's Expected Utility:** $(1/3 \times 3) + (1/3 \times 2) + (1/3 \times 1) = 2$.
  *   **Can Alice manipulate?** Alice wants to increase the probability of the Garden. Under Random Dictator, the only way to increase the probability of the Garden is to report Garden as her top choice. If she lies and reports Terrace, the probability of Garden drops to 0 (since no one else picked it). Her expected utility falls. Since the mechanism only looks at the *top* choice to assign the dictatorship, reporting anything other than your true favourite strictly reduces the chance of that favourite winning. Truth-telling is a dominant strategy in expectation.
  *   **Is it dictatorial?** No single member determines the outcome. If Alice changes her report, the probability distribution changes, but she does not guarantee her preferred outcome. Power is symmetric.

  **The Load-Bearing Feature**
  The escape route here is **Determinism**. The classic GS theorem applies to social choice *functions* that map profiles to a single winner ($f: P^n \to A$). This mechanism is a social choice *correspondence* or random function ($f: P^n \to \Delta(A)$). By allowing the outcome to be a lottery, we bypass the impossibility result. (Note: This also implicitly relies on **Cardinal Information** to evaluate the lottery, as ordinal preferences cannot rank probability distributions without vNM utilities).

  **What Collapses if Removed?**
  If we force the mechanism to be deterministic while maintaining strategy-proofness and non-dictatorship, GS proves we must fail. If we remove the lottery and try to pick a specific winner based on these votes, we reintroduce the incentive to misreport. For instance, if we tried to break the tie by favouring Alice, Bob and Charlie would form a coalition to lie. If we use a Borda count, they would truncate preferences. The "smoothness" of the expected utility maximisation only works because the disappointment of losing is mitigated by the non-zero probability of winning, which is only possible with randomisation.

  **The GS Loyalist's Critique**
  The GS loyalist will contend that this is a surrender, not a solution. They would argue: "You have not resolved the social choice problem; you have merely privatised the risk. Ex-ante, the mechanism is strategy-proof. But ex-post, once the coin is flipped, the losers are still losers. If Alice wins the draw, Bob and Charlie are stuck with a Garden they dislike, and they will rightly claim the process was unfair in realised terms. Furthermore, by requiring vNM utilities to prove strategy-proofness, you have abandoned the ordinalist framework of GS. You are no longer aggregating preferences; you are gambling with utilities. The theorem stands for any deterministic rule that respects ordinal sovereignty."
