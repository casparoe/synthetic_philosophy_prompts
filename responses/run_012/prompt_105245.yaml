answer: |-
  This is a classic reconstruction of the "Hard Problem" objection to Dennett, and it is valid. The tension you feel arises because the argument is sound *if* you accept a realist view of qualia (intrinsic character), but Dennett's heterophenomenology is built specifically to bypass that view. To save the method without accepting the self-undermining conclusion, you must identify where the argument smuggles in an assumption that Dennett explicitly rejects.

  The loose thread is **Step (3)**.

  Step (3) claims that any theory built on heterophenomenological data is underdetermined with respect to "intrinsic character." This looks undeniable because introspection convinces us that there is "something it is like" to be us that exceeds our ability to report on it. However, from Dennett's perspective, this step begs the question. Heterophenomenology operates on the methodological principle that the subject's experience is *exhausted* by the best interpretation of their reports and dispositions. There is no leftover "intrinsic character" floating above the data to be underdetermined. By asserting that there *is* such a character independent of the data, Step (3) assumes the very dualist/realist ontology that heterophenomenology aims to replace with a functionalist/interpretivist one.

  Dropping (3) allows you to keep (1) intact. Heterophenomenology remains a method that treats reports as data; it just denies that there is a hidden realm of qualia that the data fails to capture. The cost is significant: you must accept Dennett's revisionism. You are no longer studying consciousness as traditionally conceived (the inner movie); you are studying the functional capacities that lead us to *say* we have an inner movie.

