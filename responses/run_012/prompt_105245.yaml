    "rejected_step": 3,
    "kind": "subtle_flaw",
    "flaw_or_cost_explained": "Step (3) presupposes the existence of 'intrinsic character' as a fact independent of behavioral and dispositional data. Dennett denies this ontology, arguing that once all heterophenomenological data is accounted for, there is nothing left over to be underdetermined.",
    "why_it_looked_fine": "Introspection strongly suggests that phenomenal experience has a private, ineffable quality that exceeds our public reports, making the gap between data and experience seem like an obvious metaphysical fact.",
    "does_premise_1_survive": "yes, intact, because the method still treats reports as data rather than authority, it just denies there is a hidden fact they fail to reveal",
    "residual_worry": "Whether this saves the science of consciousness only by changing the subject from 'experience' to 'dispositions to report'."
  }
  ```
