answer: |-
  **Case A**
  Consider a fictional plant species, *Viridus fictus*, grown in two separate valleys, North and South. The trait is "Leaf Area." In both valleys, the seeds are drawn from the same large, genetically diverse pool, so the distribution of growth-potential genes is identical in both locations. However, the North Valley has nutrient-rich soil, while the South Valley has nutrient-poor soil. Within the North Valley, plants with "large-leaf" alleles grow significantly larger than those with "small-leaf" alleles, and random soil micro-variations are minimal; thus, heritability is high. The same pattern holds within the South Valley: genetics strongly predict relative leaf size among neighbors. Yet, the average leaf area in the North is vastly larger than in the South solely because of the soil quality. The within-group variation is driven by genes, but the between-group mean difference is driven entirely by the environment.

  **Case B**
  Consider a fictional cloning facility producing *Robustus fakeus*, where the trait is "Stem Height." Population Alpha consists entirely of clones from Genotype 1, and Population Beta consists entirely of clones from Genotype 2. Genotype 2 is inherently taller than Genotype 1. Within Population Alpha, every individual is genetically identical, so any variation in stem height is due to random environmental noise like minor temperature fluctuations during growth; thus, heritability is zero. The same is true for Population Beta: zero genetic variation within the group means zero heritability. However, the average stem height of Population Beta is significantly taller than Population Alpha. The within-group variation is driven entirely by the environment, but the between-group mean difference is driven entirely by the fixed genetic difference between the two clone lines.

  **The Accounting**
  In both cases, heritability ($h^2$) measures the proportion of *within-population* phenotypic variance attributable to genetic variance ($V_G / V_P$) in a specific environment. It describes how much individuals differ from their neighbors due to genes, not what causes the group's average value. These within-population numbers are compatible with the between-population differences because variance (spread) and means (location) are mathematically independent parameters; knowing how spread out a distribution is tells you nothing about where its center lies relative to another distribution. The single structural feature making both cases possible is **the independence of within-group variance components from between-group mean shifts**. If this feature were removed—meaning if we assumed that the source of variance within groups must also explain the difference in means between groups—Case A would require the mean difference to be genetic, and Case B would require it to be environmental, collapsing the distinction. A proponent of using heritability for between-group comparisons would resist these cases by arguing they are pathological extremes unlikely in natural populations; they might claim that high heritability implies environmental robustness (canalization), making it improbable that an environmental factor could shift the mean enough to explain a large group difference without also increasing within-group environmental variance.
