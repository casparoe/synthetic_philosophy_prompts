answer: |-
  **OFFICE OF CHOICE ARCHITECTURE — EMPLOYEE ONBOARDING PACKET (V.4.2)**

  **1. Core Mandate and Philosophical Boundaries**
  Welcome to the unit. Your primary function is the strategic reordering of existing options to align citizen behavior with their own long-term welfare. It is critical that you distinguish between changing what is on the menu and changing the order of the menu. We do not remove items. We do not ban choices. We simply adjust the gravitational pull of the environment. If a citizen wishes to select the sub-optimal option, the pathway must remain open, even if we are authorized to place obstacles along that pathway to encourage deliberation. We reduce friction for beneficial choices and reintroduce friction for detrimental ones. This is not coercion; it is lubrication management.

  **2. Precedent: The Cafeteria Pilot**
  New hires often inquire about the Cafeteria Pilot. To clarify: the fries were not removed. They were relocated to the basement annex, behind the recycling bins. The salad was moved to eye level beside the tray pickup. Traffic data indicates a 40% increase in salad selection. Complaints regarding the distance to the fries are logged under "Preference Clarification." As per protocol, staff must sincerely maintain that nothing was taken away. The opt-out walk is still available. The fact that the basement door is frequently locked during peak hours is a facilities issue, not a policy constraint.

  **3. Internal Structure: System 1 vs. System 2 Divisions**
  You will be assigned to either the System 1 Division (Impulse Routing) or the System 2 Division (Deliberation Logging). While theoretically complementary, these departments compete for budgetary allocation. System 1 argues that citizens are too tired to read forms; System 2 argues that citizens must be forced to read forms to achieve autonomy. Currently, System 1 holds majority funding due to higher conversion rates on pension opt-ins. Please route all inter-departmental memos through Compliance. Do not acknowledge the turf war in front of stakeholders.

  **4. Authority on Default Settings**
  A common question arises: Who selects the default option? The Default Selection Committee meets annually to determine the pre-checked box for all municipal forms. Minutes from these meetings are unavailable. The current working theory is that the defaults reflect the aggregate will of the population, filtered through expert consensus. If asked, state that the default is merely a suggestion that carries the weight of inertia. If pressed on who decided that inertia should point toward Option A rather than Option B, refer the questioner to the Autonomy Preservation Score.

  **5. Metrics and Reporting**
  Every quarter, the Autonomy Preservation Score (APS) is calculated based on the ease of locating opt-out mechanisms across all active campaigns. The APS is generated on a secure server in the basement. While the metric is central to our ethical compliance, it has never once appeared in a public report. This is not an omission; it is a streamlining of data to prevent citizen confusion. High APS scores correlate with low participation rates, so the metric is treated as internal diagnostic data only.

  **6. Internal Correspondence: Dissent and Feedback**
  You may encounter memoranda from junior staff regarding edge cases. See Memo 88-B from Junior Analyst Miller, regarding "Populations Unable to Locate the Basement." Analyst Miller asks whether our friction models account for citizens with mobility issues or those who lack the cognitive bandwidth to recognize they are being nudged. Miller suggests that if a person never knows they were nudged, they cannot consent to the nudge. This memo was filed under "Hypotheticals." We do not nudge based on hypotheticals. We nudge based on aggregate flow.

  **7. Leadership Note**
  As you begin your work, remember the words of Senior Nudge Officer Vance: "People say they want freedom, but what they really want is to arrive at the correct destination without checking the map. We are not taking the wheel; we are simply adjusting the GPS so the scenic route looks like the highway. If they wish to turn off the device, the button is there. It is small, grey, and located behind the battery compartment, but it is there. That is liberty."

  **8. Equipment and Access**
  Your keycard grants access to all floors except the basement server room. If you need to retrieve fries for lunch, please submit a Form 12-Request for Caloric Access 24 hours in advance. This waiting period is designed to help you assess your true hunger levels.
