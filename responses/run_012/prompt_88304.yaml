answer: |-
  **THE MERITOCRACY DECISION TREE**

  **START:** Two surgeons. One born with steady hands, one who ground away for a decade. Both save lives. Both get paid.

  **1. Did either deserve success *before* society decided surgeons were useful?**
  *   **Yes:** Go to 2. (You believe in natural moral worth.)
  *   **No:** Go to 4. (You believe desert is made, not found.)

  **2. Does natural talent count as much as hard work?**
  *   **Yes:** Go to 3. (Talent is merit.)
  *   **No:** **EFFORT-ONLY DESERTIST.** (*Awkward commitment:* You must tell the gifted surgeon her genius earns her nothing compared to the grinder.)

  **3. Did you choose your own talents?**
  *   **Yes:** **EMPTY ROOM.** (Incoherent. Nobody believes we choose our DNA.)
  *   **No:** **STRICT MERITOCRAT.** (*Awkward commitment:* You must defend that a child born genius deserves more than a child born dull.)

  **4. Do social rules create desert once the job exists?**
  *   **Yes:** Go to 5. (Institutions define value.)
  *   **No:** **NIHILIST.** (Unloved. If nothing creates desert, why pay anyone?)

  **5. Inside the rules, does effort cancel out lucky breaks?**
  *   **Yes:** Go to 6. (Effort is the only true metric.)
  *   **No:** **LUCK EGALITARIAN.** (*Awkward commitment:* You must tax the hardworking to compensate the untalented for bad genetic luck.)

  **6. Did you choose your own capacity to work hard?**
  *   **Yes:** **EMPTY ROOM.** (Unattractive. Implies poor people chose their lack of grit.)
  *   **No:** **INSTITUTIONAL DESERTIST.** (*Awkward commitment:* You must admit "earning" it is just following rules written by others.)

  **7. (If Luck dominates) Should we compensate for bad luck?**
  *   **Yes:** **LUCK EGALITARIAN.** (See above.)
  *   **No:** Go to 8. (Luck is real, but compensation is impossible.)

  **8. Is the system's point to judge character or sort skills?**
  *   **Judge Character:** **MORALIST.** (Collapses. Markets don't judge character.)
  *   **Sort Skills:** Go to 9. (It's a machine, not a court.)

  **9. Who decides which skills are valuable?**
  *   **Neutral/Technical:** **NO-DESERT-BUT-MERITOCRATIC.** (*Awkward commitment:* You must tell workers they "earned" their pay even though you know it's just efficiency.)
  *   **Powerful People:** Go to 10. (Merit is defined by the hirer.)

  **10. Does the market price determine the value?**
  *   **Yes:** Go to 11. (Price is the signal.)
  *   **No:** **TECNOCRAT.** (Experts should set value, not the market.)

  **11. Does market price equal moral worth?**
  *   **Yes:** **EMPTY ROOM.** (Unattractive. Implies a drug dealer deserves more than a nurse if paid more.)
  *   **No:** **MARKET-REWARDS-AREN'T-DESERVED.** (*Awkward commitment:* You must argue CEOs don't morally deserve their pay, even if efficient.)

  **12. Is the problem unequal pay or unequal respect?**
  *   **Unequal Pay:** **REDISTRIBUTOR.** (Fix the money.)
  *   **Unequal Respect:** Go to 13. (Fix the status.)

  **13. Can we keep high pay but kill the prestige?**
  *   **Yes:** **POST-MERITOCRACY.** (*Awkward commitment:* You must convince society to stop respecting people for their jobs.)
  *   **No:** **DOMINATION/RELATIONAL CRITIQUE.** (*Awkward commitment:* You must argue the hierarchy itself is the violence, not just the pay.)

  ***

  **THE EMPTY ROOMS**
  *   **Chosen Talents/Effort:** Nobody occupies these. They require a view of the "self" that exists before biology or upbringing. Philosophically incoherent; psychologically unloved.
  *   **Price = Worth:** Defended by no one explicitly. Even libertarians usually separate market value from moral virtue.

  **THE BLIND SPOTS**
  *   **Hybrids:** The tree forces binary choices. Many readers hold that *some* desert is natural, but institutions shape it.
  *   **Entitlement vs. Desert:** The tree conflates "deserving" with "being entitled to." You can be entitled to a wage without morally deserving it.
  *   **The "Why":** It maps *what* you believe, not *why*. Two people might land on "Luck Egalitarian" for entirely different religious or secular reasons.
