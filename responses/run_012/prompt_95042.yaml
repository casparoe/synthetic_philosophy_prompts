      *   *Laws vs. Boundary:* Explain that laws are like rules of a game (allow moves forward and backward), boundary conditions are the setup of the board. To get a movie that makes sense in one direction, you need a specific starting frame.
      *   *What BC supplies:* It breaks the time-translation/time-reversal symmetry of the *history*, not the laws. It selects the specific trajectory out of the allowed phase space that exhibits a gradient.
      *   *The U-Shaped Universe:*
