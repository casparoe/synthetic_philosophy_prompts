          *   Picture: A universe with a "Janus point." Time flows away from the ordered ends toward the disordered middle.
          *   Implication: "Past" is indexical, like "here" or "left." It depends on where you stand on the entropy curve.

  6.  **Refining the "Observer in the Middle" point:**
      *   Strictly speaking, at maximum entropy, there are no observers (no free energy).
