      *(Self-Correction during drafting)*: Make sure I don't make math sound subjective. The point isn't that 2+2=5 is okay, but that *agreeing* on why 2+2=4 is what makes it math. Emphasize the "shared practice."

  9.  **Final Review against constraints:**
