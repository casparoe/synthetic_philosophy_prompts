answer: |-
  Imagine a deployment pipeline with two identical approval gates where you must approve exactly one to release safely. Approving at the first gate ships bugs (payoff 0), approving at the second is perfect (payoff 4), and skipping both cancels the release (payoff 1). Because the gates look identical and logs are unavailable, you cannot tell which gate you are at when you decide to approve or pass.

  Let $p$ be the probability you approve at any gate. If you always approve ($p=1$), you stop at Gate 1 (payoff 0). If you never approve ($p=0$), you skip both (payoff 1). Both deterministic policies fail. With a mixed strategy, the expected payoff is $P(\text{Exit 1}) \cdot 0 + P(\text{Exit 2}) \cdot 4 + P(\text{Continue}) \cdot 1$. Since $P(\text{Exit 1}) = p$, $P(\text{Exit 2}) = (1-p)p$, and $P(\text{Continue}) = (1-p)^2$, the expectation is $4p(1-p) + (1-p)^2$. Calculus shows this maximizes at $p=1/3$, yielding an expected payoff of $4/3$. This strictly beats the best deterministic policy (1).

  Randomization helps because you need to condition your action on "which step am I?" without having that information. A deterministic policy forces the same action at both steps, locking you into "Stop Early" or "Stop Late." A mixed policy allows you to distribute your stopping probability across the sequence, effectively hedging against your own forgetfulness. It allows the ex-ante planner to allocate probability mass to the second node without requiring the interim agent to know they are there.

  This example shares the exact structure of the Absent-Minded Driver: imperfect recall, identical decision nodes (one information set), and payoffs dependent on step count. Your retry loop candidate is superficially similar but structurally different. In a standard retry loop, continuation is forced by external failure, not chosen. In AMD, you choose to continue even when stopping is possible. Additionally, retry loops typically terminate on observable success, breaking the imperfect recall condition. If your job runner truly cannot distinguish attempts and must choose to retry or quit regardless of job status, it matches AMD. Otherwise, the observable success signal breaks the symmetry.
