  I'm a backend engineer and a few of us do a "bring one weird idea" half hour at lunch on Fridays, and next week it's my turn. I picked the absent minded driver thing — the puzzle where a guy has to take an exit off a highway, but he's absent minded, so he can't tell whether he's at the first exit or the second, which means whatever he decides to do he'll end up doing the same thing at both of them, and the interesting bit (as I understand it) is that the "just pick the better option at whichever intersection you're at" reasoning gives the wrong answer, and the best policy is some randomized thing rather than always-go-straight or always-turn. I think I get the shape of it, but I've only ever seen it told with the driving example, and I want something fresh for the lunch thing, and honestly I also want to check that im not just pattern matching on the picture of a road.

  So: give me an example of a decision problem that has the same conceptual issue but isn't the driving one, ideally something out of software/systems work or ordinary life rather than a made up casino game, and make it concrete enough that I could sit down and do the numbers on it — states, payoffs, what the agent can and can't observe at the moment it has to choose. Two things I specifically want out of it. First, the example should be one where a mixed/randomized policy does strictly better than every fixed policy, and you should explain why that happens, since I was always taught that flipping coins only helps when there's an adversary and here there isn't one. Second, tell me whether it really has the same structure as the driver or whether it's only superficially similar, and if it's only superficially similar, say exactly what's different. If it's easier to work with, my own half-baked candidate is a retry loop in a job runner that doesn't know whether it's on attempt one or attempt two, so it has to use the same retry rule both times — I suspect that's not quite the same thing, but I can't put my finger on why.

  Skip the history and who said what, I don't need papers or attributions, just the example and the explanation. Keep the whole thing under 500 words, and start with the example itself in two or three sentences before you explain anything.
