  10. **Final Polish:** Ensure tone is analytical, neutral, and directly addresses the "spec" format requested. (The user wants a technical specification for a philosophical theory).

  *(Self-Correction on Confidence)*: I need to be careful not to present philosophical consensus where there is none. I will frame the "Confidence" section carefully.

  *(Self-Correction on "Killer Requirement")*: The Lookup Table problem is the classic "Philosophical Zombie" argument. It's the strongest filter. I'll select that.

