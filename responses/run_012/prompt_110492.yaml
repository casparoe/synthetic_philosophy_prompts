      *   The "Sphexishness" concept comes from Hofstadter's "The Ants, the Grasshopper, and the Sphex," which popularized the philosophical zombie/automaton worry.
      *   The user wants to know *what a theory needs to do* to resolve this, not necessarily *which theory is right*.

  3.  **Drafting the Requirements (The "Spec"):**

      *   *Requirement 1: The Wasps' Loop (Empirical Adequacy).* The theory must explain the wasp data. Does it matter if it's an artifact? Yes, because if it's an artifact, the "sphexish" label might be a misinterpretation of noise.
      *   *Requirement 2: The Lookup Table Problem (Indistinguishability).* A giant table of inputs/outputs looks identical to a flexible agent from the outside. The theory must decide if internal structure matters.
      *   *Requirement 3: Etiology vs. Current State (The Broken Wing).* Is flexibility about *how* you got the behavior (evolution/learning) or *how* it runs now?
      *   *Requirement 4: The Regress Stopper (Meta-Rules).* If flexibility is just following a higher-order rule, what makes *that* rule flexible? The theory needs a bottom level that isn't just another rule.
      *   *Requirement 5: Ontological Status (Real vs. Descriptive).* Is rigidity in the world or in the map?
