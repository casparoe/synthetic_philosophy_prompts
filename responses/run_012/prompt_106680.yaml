  # Joint Statement on *De Re* Modality and Transworld Existence
  **Signatories:** The Counterpart Theory Working Group (CT) & The Transworld Identity Working Group (TIT)
  **Date:** October 26, 2023
  **Subject:** Outcomes of Adversarial Collaboration on Modality, Identity, and World-Boundness

  ## 1. Points of Agreement
  *The following claims are endorsed by both CT and TIT as the foundation for our continued discourse. We assign high confidence to these semantic and logical baselines.*

  1.  **Semantics of *De Re* Modality:** We agree that statements of the form "Object $x$ could have been $F$" possess truth conditions that can be modeled using possible worlds semantics. We disagree on the metaphysical makeup of the models, but not on their utility for evaluating truth. [Confidence: High]
  2.  **The Necessity of Identity:** Both camps accept the principle that if $x$ is identical to $y$, then necessarily $x$ is identical to $y$. CT models this via the preservation of counterpart relations across pairs; TIT models this via the strictness of identity across worlds. Neither view forces us to deny this logical theorem. [Confidence: High]
  3.  **What the Disagreement Is Not About:**
      *   **Epistemology:** We are not debating how agents *know* modal facts, only what makes them true.
      *   **Existence of Worlds:** We set aside the debate between *realism* (worlds are concrete or abstract objects) and *ersatzism* (worlds are descriptions). A CT realist and a TIT realist can still disagree on identity; a CT ersatzer and a TIT ersatzer can still disagree on identity. This collaboration assumes a working model of worlds regardless of their ontological status. [Confidence: Medium-High]
      *   **Skepticism:** Neither side argues that modal talk is meaningless or that all *de re* claims are false.
  4.  **Objections Set Aside:** We jointly set aside the objection that CT violates Leibniz's Law *within* a world. We agree that within a single world, identity is strict. The divergence concerns only the cross-world relation. We also set aside the "haecceitist" worry that TIT commits to primitive "this-ness" without qualitative grounding, treating it as a separate metaphysical commitment not required for the core identity dispute. [Confidence: High]

  ## 2. Disagreements and Diagnostic Table
  *The following table isolates the specific points of divergence. We have analyzed whether these are substantive metaphysical disagreements or merely verbal disputes regarding notation. We have also applied our joint analysis to the two injected cases (Rigid Counterpart Theory and The Machine).*

  | Sub-Question at Issue | CT Position (World-Bound) | TIT Position (Transworld) | Crux or Verbal? | Shared Argument / Case | CT Prediction / Verdict | TIT Prediction / Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Context-Sensitivity of Modality** | The truth of *de re* claims depends on which similarities are salient in the conversational context. The counterpart relation shifts. | The truth of *de re* claims depends on the metaphysical essence of the object. The identity relation is fixed. | **Genuine Crux.** This changes the logic of modal operators (e.g., validity of S4/S5). | **Ordinary Language Intuitions:** In some contexts we say "I could have been a fish" (biological); in others "I could have been a different person" (psychological). | **CT:** Ordinary talk is context-sensitive; logic should model this. Flexibility is a feature. [Confidence: High] | **TIT:** Ordinary talk is loose; metaphysics must be precise. Flexibility is a bug indicating ambiguity. [Confidence: High] |
  | **2. Status of Rigid Counterpart Theory (RCT)** | RCT is a distinct ontological view. Individuals remain world-bound; the equivalence class is a derivative construction, not the primary object. | RCT is Transworld Identity under a new label. If the relation is an equivalence relation, the equivalence class *is* the transworld individual. | **Verbal (Formally) / Substantive (Ontologically).** Truth conditions are isomorphic; fundamental ontology differs. | **Formal Mapping:** Define a "transworld individual" in CT as the set of all rigid counterparts. Compare to TIT's "individual." | **CT:** Isomorphic truth-conditions do not erase the ontological difference between one thing many-located vs. many things similar. [Confidence: Medium] | **TIT:** If the math is identical, the "world-bound" constraint is a gratuitous metaphysical complication. [Confidence: Medium-High] |
  | **3. The Machine Case (Origin vs. Function)** | **Actual:** Parts $P$, Function $F$.<br>**W1:** Parts $P$, Function $G$.<br>**W2:** Parts $Q$, Function $F$. | **Actual:** Parts $P$, Function $F$.<br>**W1:** Parts $P$, Function $G$.<br>**W2:** Parts $Q$, Function $F$. | **Genuine Crux.** Tests whether modality is grounded in history (origin) or quality (function). | **The Machine Case:** A device assembled from $P$ doing $F$. W1 has $P$ doing $G$. W2 has $Q$ doing $F$. | **CT:** Context determines the answer. If origin is salient, W1 is the counterpart. If function is salient, W2 is the counterpart. Both claims can be true in different contexts. [Confidence: High] | **TIT:** Origin is essential. W1 is the *same* machine (same parts/origin). W2 is a *different* machine (different origin). "The machine could have had parts Q" is false. [Confidence: High] |
  | **4. Essentiality of Origin** | Origin constraints are pragmatic constraints on the counterpart relation, not metaphysical necessities. | Origin constraints are metaphysical necessities derived from the nature of identity. | **Genuine Crux.** | **Kripke's Queen Case:** Could Queen Elizabeth have been born of different parents? | **CT:** True in a context where we care about the "role" of the Queen; false in a context where we care about her biological lineage. [Confidence: Medium-High] | **TIT:** False. She essentially has her actual parents. Any other person is not her. [Confidence: High] |

  ## 3. Analysis of Injected Cases

  ### A. The Status of Rigid Counterpart Theory (RCT)
  *Injection 1 Resolution:*
  We agree that Rigid Counterpart Theory (world-bound individuals + global, transitive, symmetric counterpart relation) is **extensionally equivalent** to Transworld Identity regarding the truth values of standard modal claims. If the counterpart relation is an equivalence relation, it partitions the domain of individuals into equivalence classes. TIT treats the class as the object; CT treats the class members as the objects.

  *   **Joint Verdict:** This is a **notational variant regarding logic, but a substantive disagreement regarding ontology.**
  *   **Reasoning:** If one's goal is solely to validate modal inferences, RCT and TIT are interchangeable. However, if one's goal is to describe the fundamental furniture of reality, they diverge. CT maintains that spatiotemporal isolation is fundamental; TIT maintains that transworld continuity is fundamental. We acknowledge that no empirical test can distinguish them, making this a purely metaphysical preference. [Confidence: Medium]

  ### B. The Machine Case
  *Injection 2 Resolution:*
  *   **Actual World:** Machine $M$ built from Parts $P$ performing Function $F$.
  *   **World 1:** Machine $M_1$ built from Parts $P$ performing Function $G$.
  *   **World 2:** Machine $M_2$ built from Parts $Q$ performing Function $F$.

  **CT Report:**
  We assert that "M could have performed G" is true in contexts where functional continuity is salient (referencing $M_2$). "M could have been built from Q" is true in contexts where functional role is salient (referencing $M_2$). "M could have performed G" is *also* true in contexts where material origin is salient (referencing $M_1$). There is no single fact of the matter independent of context.
  *Work done by:* Pragmatics and salience of similarity relations.

  **TIT Report:**
  We assert that "M could have performed G" is true (referencing $M_1$, which *is* $M$). "M could have been built from Q" is false (referencing $M_2$, which is *not* $M$). The identity of $M$ is fixed by its origin ($P$). $M_2$ is a distinct machine that merely mimics $M$'s function.
  *Work done by:* Metaphysical essentialism (Origin Essentialism).

  ## 4. Confidence and Uncertainty Declaration

  **Overall Confidence:**
  We are **Highly Confident** that we have correctly characterized the logical commitments of both positions. We are **Highly Confident** that the Machine Case reveals a divergence in how "essence" is treated (pragmatic vs. metaphysical).

  **Point of Least Certainty:**
  **The Ontological Significance of the RCT/TIT Distinction.**
  *Confidence Level: Low-Medium.*
  *Reasoning:* While we have classified the difference between Rigid Counterpart Theory and Transworld Identity as "ontological rather than logical," we are not certain this distinction carries genuine explanatory weight. If two theories generate identical truth conditions for every possible sentence in the language, and differ only in whether we say "one thing exists in two places" or "two things exist in one place each," it is possible we are reifying a grammatical difference. It remains an open question whether the "world-bound" constraint in RCT blocks any *future* metaphysical inferences that TIT would allow (e.g., regarding composition or causation across worlds). We flag this as the most vulnerable point in our joint diagnosis.

  **Signed,**

  *Lead Representative, Counterpart Theory Working Group*
  *Lead Representative, Transworld Identity Working Group*
