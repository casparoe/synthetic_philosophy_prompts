  6.  **Refining the Machine Case:**
      *   Actual: $M@ (P_1, F_1)$.
      *   $W_1: M_1 (P_1, F_2)$.
      *   $W_2: M_2 (P_2, F_1)$.
      *   CT: In context $C_1$ (origin salient), $M_1$ is counterpart. In $C_2$ (function salient), $M_2$ is counterpart. Both claims "M could have F2" and "M could have P2" can be true in different contexts.
      *   TIT: Origin is essential. $P_1$ is essential. So $M_1$ is $M$. $M_2$ is not $M$. "M could have P2" is false.
      *   *Crux:* Is modality context-sensitive (CT) or fixed by metaphysics (TIT)?

  7.  **Addressing the Confidence & Uncertainty Requirement:**
