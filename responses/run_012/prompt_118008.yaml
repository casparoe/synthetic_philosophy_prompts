  2.  **Position 2 (After Stress Test): "One object, two descriptions."** They argue properties belong to descriptions, not objects. *Intervention:* Distinguish sortals. "Does the description change the physics of squashing?" Show survival conditions are mind-independent features of the kind. If left unchecked, this dissolves the contradiction artificially.
  3.  **Position 3 (During Divergence): "A thing is its matter."** They deny the statue has different conditions than the clay. *Intervention:* Use reshaping intuition. "If I reshape it, you still have clay, but lost the art." Make them choose which object vanished. This forces them to admit the clay persists while the statue does not.
  4.  **Position 4 (Closing): "Two things in one place is impossible."** They reject distinctness to save physics. *Intervention:* Acknowledge the cost. "Then you must deny Leibniz's Law or accept identity." Don't solve it; let the tension stand. They must see that every answer has a metaphysical price. If you resolve this, they leave thinking the puzzle was merely difficult, not paradoxical.

  The check for understanding
  Do not ask for a solution. Ask: "If the statue is destroyed but the clay remains, what exactly ceased to exist?" If they say "the shape," they haven't grasped the objecthood. If they say "the statue," ask: "Was the statue the clay?" If "yes," ask: "Did the clay cease to exist?" They must articulate that accepting identity forces them to deny the clay's survival, while distinctness forces co-location. The correct response acknowledges the trade-off: "We must give up either the logic of identity or the impossibility of co-location."

  What to leave out, and why
  Omit four-dimensionalism (temporal parts). It solves the puzzle by denying the premise, which robs the session of its tension. Omit grounding and supervenience terminology; it is jargon that masks the intuition. Omit the history (Locke vs. Aristote). Announce explicitly: "Today is for diagnosing the contradiction, not curing it. We will not discuss 'temporal parts' or 'dominant sorts'." This validates their confusion as a genuine philosophical problem rather than a lack of technical knowledge. It keeps the focus on the metaphysical cost of each answer.
