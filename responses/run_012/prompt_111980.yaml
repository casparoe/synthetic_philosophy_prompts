  2.  **Deconstruct the Friend's Position (Kelly/Ergodicity Economics):**
      *   *Core Claim:* Maximize $E[\log(W)]$ because it equals the time-average growth rate. Maximize $E[W]$ is wrong because it's an ensemble average over parallel universes, not the single trajectory you live.
      *   *Justification:* Long-run dominance. Any other strategy gets wiped out relative to Kelly in the limit.
      *   *Fractional Kelly:* Purely risk management/psychological constraint, not optimal growth.
      *   *Ontology:* One life, one trajectory. Non-ergodicity is the key insight.

  3.  **Translate to Ecological Vocabulary:**
      *   *Wealth ($W$)* $\rightarrow$ Population Size ($N$).
      *   *Betting Fraction* $\rightarrow$ Reproductive Effort / Resource Allocation Strategy.
      *   *Expected Wealth ($E[W]$)* $\rightarrow$ Arithmetic Mean Fitness ($\bar{W}_A$).
      *   *Expected Log Wealth ($E[\log W]$)* $\rightarrow$ Geometric Mean Fitness ($\bar{W}_G$) or Long-term Stochastic Growth Rate ($\lambda_s = \exp(E[\log \lambda])$).
      *   *One Life/Trajectory* $\rightarrow$ Single Lineage realization.
      *   *Ruin* $\rightarrow$ Extinction ($N=0$).
      *   *Kelly Fraction* $\rightarrow$ ESS in a stochastic environment (often conservative bet-hedging).

  4.  **Evaluate the Four Planks:**

      *   *Plank 1: Ensemble Average is a Fantasy (Non-ergodicity).*
          *   *Translation:* Arithmetic mean fitness ($\bar{W}_A$) predicts nothing about a single lineage's persistence in a fluctuating environment.
          *   *Cleanliness:* Very clean. Ecology abandoned $\bar{W}_A$ for stochastic growth rates decades ago (Lewontin, Cohen, etc.).
          *   *Distortion:* Ecology often deals with structured populations (matrix models), not just scalar wealth.
          *   *Missing:* The philosophical weight of "one life." Ecology assumes the lineage *is* the replicator; the individual doesn't matter, the gene/lineage does. Finance cares about the specific agent's utility.

      *   *Plank 2: Log Wealth is Uniquely Correct.*
          *   *Translation:* Maximizing geometric mean fitness is the strategy that avoids extinction and dominates in the long run.
          *   *Cleanliness:* Mostly clean. $\log$ corresponds to additive growth rates.
          *   *Distortion:* In ecology, "correct" depends on the timescale and density dependence. If density dependence kicks in, $r$-selection (log) isn't always king; $K$-selection matters. Also, in finite time horizons, arithmetic mean can matter (short-term boom).
          *   *Missing:* The concept of "utility." Ecology has no utility, only persistence.

      *   *Plank 3: Long-Run Argument vs. Utility.*
          *   *Translation:* Selection favors the genotype with the highest stochastic growth rate. It's not a preference; it's a dynamic inevitability (dominance).
          *   *Cleanliness:* Very clean. This is the definition of an ESS in stochastic environments.
          *   *Distortion:* "Overtaken" implies competition. Kelly works even in isolation (growth rate). Ecology usually implies competition for the niche.
          *   *Missing:* The normative "ought." Selection says what *will* persist, not what an agent *should* choose unless the agent is a vehicle for selection.

      *   *Plank 4: Fixed Fraction (Fractional Kelly).*
          *   *Translation:* Conservative bet-hedging.
          *   *Cleanliness:* Clean.
          *   *Distortion:* In ecology, bet-hedging is often *adaptive* (evolutionarily stable) due to environmental correlation or competition, not just "stomaching variance." Fractional Kelly in finance is often admitted as sub-optimal for growth but optimal for utility. In ecology, "sub-optimal growth" strategies persist because of other constraints (trade-offs).
          *   *Missing:* The psychological component ("stomach variance"). Evolution has no nerves.

  5.  **Concrete Case (1.5 / 0.6 Bet):**
      *   *Math:* $0.5 \log(1.5) + 0.5 \log(0.6) \approx 0.5(0.405) + 0.5(-0.511) = -0.053$. Negative growth rate.
      *   *Finance:* Don't take the bet (or short it). $E[W] = 1.05$ (positive), but $g < 0$.
      *   *Ecology:* Lineage goes extinct. $\lambda_s < 1$. Arithmetic mean reproduction $> 1$ is irrelevant if variance is too high. This is the classic "variance load."

  6.  **The Residue Report (The Core Critique):**
      *   *Should vs. Will:* The friend says "You *should* maximize log wealth." Ecology says "Lineages that maximize log growth *will* dominate."
