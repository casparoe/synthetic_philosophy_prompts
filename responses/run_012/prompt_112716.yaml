prompt: |-
  Hey, so I'm a fifth-year PhD student in philosophy and next Friday I have to give a work-in-progress talk to our department's semantics-and-pragmatics reading group, and honestly I'm dreading the Q&A more than the talk itself. My thesis is a little heretical: I argue that Lewis's triviality results aren't really a refutation of Adams' Thesis so much as a proof that indicative conditionals can't be propositions at all. In other words, the only way to keep "the probability of 'if A then C' equals the probability of C given A" from collapsing is to give up the idea that the conditional has a truth value in the first place and go expressivist -- the conditional expresses a high conditional credence, it doesn't describe the world. I've got a sketch of the argument that runs through a variant of the proof where you conditionalize on a conditional, and I claim that exposes an import-export assumption as the real culprit, but I'm not sure how it'll land with this crowd.

  And the crowd is the problem. It's mostly truth-conditional semanticists who think every declarative clause -- especially one embedded in a belief report or under a quantifier -- has to have a truth condition, plus a couple of probabilists from the stats department who genuinely care whether the whole framework is even well defined, and one person who's a card-carrying Kratzer-style restrictor theorist and thinks the entire debate is a category mistake. I want to walk in knowing exactly what's coming at me.

  So please act like a seasoned philosopher of language who's coached a lot of people through hostile Q&As, and think carefully before you answer -- maybe start by brainstorming who in that room is going to say what. Then give me a prep sheet: the eight or so objections I'll actually get from this specific audience -- not the generic "but what about conditionals in the antecedent" thing every intro textbook mentions, but the ones tailored to these people and my particular argument -- ordered by how likely they are and how much damage they do. Phrase each one the way that person would actually phrase it. For each, give me a two-minute reply, a blunt note on where the reply is weakest, and a flag on what I should just concede up front. Tell me which single reply has to land for my thesis to survive the hour, and finish with the one question I'm definately praying nobody in that room asks, and why it would hurt so much. Oh and please skip the citations and reading lists -- a model without web access would just be guessing at those anyway, and I don't need the history, I need the ambush prep.
