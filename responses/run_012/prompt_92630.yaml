answer: |-
  Proceed only if the provider's consent remains meaningful despite the financial offer, and the child's legal status is secure regardless of the intended parents' home jurisdiction.

  ### Reasoning: The Load-Bearing Distinctions

  This procedure operationalizes four philosophical distinctions that determine moral permissibility without requiring ethical theory expertise.

  1.  **Undue Inducement vs. Fair Compensation (The Money Dimension):** Literature on commodification distinguishes between payments that *acknowledge* burden and payments that *obscure* risk. The operational test is not whether money is involved, but whether the money removes the ability to refuse. If the funds are required for subsistence (rent, food), refusal is not a viable option, and consent is compromised. If funds are for improvement (debt, savings), consent remains viable.
  2.  **Legal Evasion vs. Medical Travel (The Cross-Border Dimension):** "Reproductive tourism" is morally distinct from medical travel only when it harms the resulting child. The obligation is not to enforce foreign law, but to prevent statelessness. If the child cannot enter the IPs' home country or be recognized as their child, the clinic is facilitating harm.
  3.  **Embodied Labor vs. Separable Tissue (The Consent Dimension):** Egg donation involves separable tissue; gestation involves embodied labor. Philosophical consensus holds that bodily integrity during gestation cannot be contractually waived. A carrier must retain the right to make medical decisions during pregnancy, including termination, regardless of the contract.
  4.  **Altruism vs. Coercion (The Relationship Dimension):** Known donors/carriers are not inherently safer; familial pressure can invalidate consent more effectively than financial need. The test is not the relationship itself, but whether the provider has independent advocacy to resist familial obligation.

  ### The Procedure

  **Instructions:** Complete sequentially. If a step results in **STOP**, do not proceed. If a step results in **HAND-OFF**, escalate to the Director of Ethics and Compliance (you). If **PASS**, proceed to the next step.

  **Step 1: Legal Security (Cross-Border)**
  *   **Question:** Has independent legal counsel confirmed in writing that the child will be recognized as a legal citizen or resident of the intended parents' home country upon return?
  *   **Sufficient Answer:** Yes, with documentation of citizenship pathway or residency rights.
  *   **STOP:** No, or if the child risks statelessness. (Rationale: Preventing harm to the child overrides reproductive autonomy.)
  *   **HAND-OFF:** If the legal status is ambiguous or depends on a court ruling in the home country. (Rationale: This is a risk assessment, not a fact check.)

  **Step 2: Financial Voluntariness (Money)**
  *   **Question:** Is the compensation package within the clinic's standard range for this procedure, and has the provider stated that refusing this offer would not result in inability to pay for housing, food, or essential medical care?
  *   **Sufficient Answer:** Yes, compensation is standard, and provider confirms basic needs are met without this income.
  *   **STOP:** Yes, compensation is significantly inflated for this specific candidate, OR provider indicates this money is required for subsistence (rent/food). (Rationale: Undue inducement invalidates consent.)
  *   **HAND-OFF:** If compensation is standard but the provider indicates the money is needed to clear significant debt or avoid eviction *next month*. (Rationale: Distinguishing between "improvement" and "desperation" is a judgment call.)

  **Step 3: Bodily Integrity (Consent)**
  *   **Question:** Does the contract explicitly state that the gestational carrier retains sole authority over all medical decisions during pregnancy, including selective reduction or termination, without penalty?
  *   **Sufficient Answer:** Yes, the contract contains this clause and the carrier has verbalized understanding of it.
  *   **STOP:** No, or if the intended parents expect enforceability over medical decisions. (Rationale: Bodily autonomy cannot be sold.)
  *   **HAND-OFF:** If the carrier understands the clause but expresses hesitation or conflict about using that right. (Rationale: This is psychological ambivalence, not legal non-compliance.)

  **Step 4: Relational Independence (Relationships)**
  *   **Question:** Has the provider (donor or carrier) completed at least one session with a mental health professional independent of the intended parents?
  *   **Sufficient Answer:** Yes, and the professional confirms no evidence of coercion.
  *   **STOP:** No, or if the professional finds evidence of familial pressure.
  *   **HAND-OFF:** If the professional finds the relationship dynamic "complex" but not coercive. (Rationale: Weighing familial obligation against autonomy is a value judgment.)

  ---

  ### Case Runs

  **Case 1: The Cross-Border Intended Father**
  *   **Profile:** Resident of Country X (criminalizes commercial surrogacy). Wants carrier in our state.
  *   **Procedure Run:**
      *   Step 1 (Legal): Legal counsel reports Country X will not recognize the birth certificate and citizenship is not guaranteed; the child may enter on a tourist visa only.
      *   **Result:** **STOP.**
  *   **Analysis:** The procedure blocks this case. You mentioned your own family's experience with cross-border arrangements turned this into a personal mission. You likely prefer to help these parents access care unavailable at home. However, the procedure prioritizes the child's legal security over the parents' access. This outcome conflicts with your personal sympathy for reproductive tourism, but adheres to the non-harm principle regarding the child.

  **Case 2: The Repeat Egg Donor**
  *   **Profile:** 23-year-old female, 3rd donation. Candidly motivated by money to clear student debt.
  *   **Procedure Run:**
      *   Step 1 (Legal): N/A (Domestic).
      *   Step 2 (Money): Compensation is standard clinic rate. She states she can pay rent/food without this; the money is for debt reduction.
      *   Step 3 (Consent): N/A (Gametes are separable; standard consent applies).
      *   Step 4 (Relationships): Independent counsel completed; no coercion found.
      *   **Result:** **PASS.**
  *   **Analysis:** The procedure allows this. While some philosophical positions argue that selling gametes is inherently commodifying, the operational distinction here is between subsistence desperation and financial improvement. Her debt is a burden, but not a threat to basic welfare. The procedure accepts her autonomy to trade bodily tissue for financial advancement.

  **Case 3: The Sister Carrier**
  *   **Profile:** Couple wants wife's sister as carrier. Payment described as "gift" for house down payment.
  *   **Procedure Run:**
      *   Step 1 (Legal): Domestic, secure.
      *   Step 2 (Money): "Gift" amount equals standard commercial compensation. Sister states she needs the house to leave a bad living situation.
      *   **Step 2 Hand-Off:** Is needing a house to leave a bad situation "subsistence" or "improvement"? This is a judgment call. Escalated to Director.
      *   Step 3 (Consent): Contract allows carrier medical autonomy.
      *   Step 4 (Relationships): Independent counsel completed. Counsel notes sister feels "honored but obligated."
      *   **Step 4 Hand-Off:** Is "obligation" coercion? Escalated to Director.
      *   **Result:** **HAND-OFF (Final Decision Required).**
  *   **Analysis:** The procedure cannot resolve the tension between familial altruism and familial coercion. The "gift" language attempts to bypass market norms but functions as compensation. The decision rests on whether you value the sister's agency to help her family over the risk that she cannot say no to her sister.

  ---

  ### Limitations: What This Procedure Cannot Do

  1.  **It cannot detect internalized coercion.** A provider may genuinely believe she wants to donate because she has been socially conditioned to prioritize others' needs over her bodily integrity. The procedure relies on self-reporting and independent counsel, both of which can be compromised by internalized norms.
  2.  **It cannot resolve value conflicts at the Hand-Off points.** Steps 2 and 4 explicitly kick decisions to you when the line between "desperation" and "improvement," or "obligation" and "coercion," is blurred. The procedure identifies the gray zone; it does not illuminate it.
  3.  **It assumes honest input.** If intended parents lie about their home country's legal recognition, or if a provider lies about her financial need to secure the contract, the procedure fails. It is a compliance filter, not an investigation unit.
  4.  **It cannot predict future regret.** A provider may consent meaningfully today and feel exploited tomorrow. The procedure ensures procedural justice at the point of contract, not retrospective satisfaction.
  5.  **It places the moral burden on you.** By design, the "Hand-Off" steps admit that some questions are not factual but valuative. When the procedure stops, you are following a rule. When it hands off, you are deciding. There is no philosophical shield for those decisions.
