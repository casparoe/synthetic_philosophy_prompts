answer: |-
  The flour dust hung in the shaft of light between Elias and Sarah, unmoving. They had been standing like this for six minutes.

  "It's the product," Elias said, his arms crossed over his apron. "People come for the sourdough. If I don't mix, you don't have a shop. I ground this place."

  Sarah leaned against the register, her hand resting on the keys. "People come for the experience. The coffee, the smile, the transaction. If I don't open the till, you have nowhere to sell. I ground this place."

  "Then stop," Elias said. "See what happens."

  "I already did," Sarah said. "You're the one still wearing the apron."

  "I'm waiting for you to clock in."

  "I'm waiting for you to preheat."

  The logic was a closed circuit. Elias needed the shop to be open to justify baking. Sarah needed the bread to be baked to justify opening. Neither could move first without validating the other's claim to authority. If Elias baked now, he admitted the shop needed him. If Sarah opened the till, she admitted the bread needed her. The silence stretched. The ovens were cold. The register screen was black. The business hung in a vacuum, consuming its own tail.

  Outside, the sidewalk was wet from a night rain. A figure in a blue uniform walked up the steps, paused to adjust a strap, and lifted the flap on the door. A white envelope slid through the slot. It landed face up on the doormat. The return address was printed in stark, government block letters. It listed the business name only, ignoring the individual identities of owner and operator. It demanded a sum based on the entity's existence, regardless of internal hierarchy.

  The envelope settled. The dust motes danced around it.

  Elias shifted his weight. The silence was becoming expensive, though neither could say why. The cold air from the door slot brushed his ankles. He looked at the dark ovens, then at Sarah. She looked at the black screen, then at Elias. The argument hadn't been won, but the stalemate was becoming physically uncomfortable.

  "I'm not saying I was wrong," Elias said.

  "I'm not saying you were right," Sarah said.

  Elias turned and walked to the back. He flipped the breaker. The hum of the fans began, low and steady. Sarah tapped the register. The screen lit up green. They moved around each other without speaking, resuming the dance that required both of them to be true and neither of them to be in charge.

  The envelope remained on the mat. A draft pushed it half an inch further into the room. Neither of them looked down.

