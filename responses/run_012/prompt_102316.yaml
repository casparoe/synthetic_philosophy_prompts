prompt: |-
  I teach a seminar that's half philosophy students and half law students, so I've got a foot in both worlds and I keep noticing how much of the public-reason debate sounds like procedure to me. So: take the Rawlsian ideal of public reason -- roughly, that when we coerce each other through law the reasons we offer have to be ones every reasonable citizen could accept, that religious arguments can live in the background or enter under a proviso so long as they get backed up by public reasons in due course -- and restate it, as faithfully as you can, in the vocabulary I actually think in: evidence law and trial procedure. Admissibility versus weight, relevance, hearsay, judicial notice, burdens of proof, the gap between the reasons that end up in the record and the reasons the decision really rests on, harmless error on appeal. Then give me the residue report. What carries over cleanly, what has to be bent to fit, and what has no counterpart at all -- is there anything public reason demands that a court would treat as irrelevant or even improper to weigh? I'm especially curious whether the bit about all reasonable citizens being able to accept the justification survives, because I suspect it's doing work that no procedural rule does, and I want to know whether that's a defect in my translation or a sign the original is smuggling something in. And don't be polite if it turns out the translation is mostly loss -- I'd rather hear that than a forced analogy.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

