answer: |-
  This is a sharp intuition. You are right to hear procedure in public reason; Rawls is explicitly trying to construct a *method* for legitimacy, not just a moral outcome. But your suspicion is also correct: the translation leaks badly at the critical juncture.

  Here is the restatement of Public Reason in the vocabulary of Evidence and Procedure, followed by the residue report.

  ### The Translation: Public Reason as Rules of Evidence

  **1. The Forum and the Trier of Fact**
  The political arena is the courtroom. The "sovereign people" are the jury. The legislature/courts are the bench. When the state coerces a citizen (verdict/sentencing), it is issuing a judgment that deprives liberty or property.

  **2. Admissibility and Relevance (The Duty of Civility)**
  *   **Public Reasons:** These are **Competent, Substantial Evidence**. They are facts and logic subject to cross-examination, verification, and common human reason. They are "relevant" under Rule 401 because they probatively establish a secular state interest.
  *   **Comprehensive Doctrines (Religious/Philosophical):** These are treated as **Hearsay** or **Privileged Information**. "God told me" is an out-of-court assertion by an unavailable declarant. It lacks reliability guarantees. Alternatively, it is **Rule 403 Prejudicial**: its probative value to the general public is substantially outweighed by the danger of unfair prejudice, confusion, or alienating the jury pool.
  *   **Ruling:** A motion for judgment of acquittal should be granted if the state's case rests *solely* on inadmissible evidence (sectarian reasoning).

  **3. The Proviso (Curative Admissibility)**
  You may introduce the religious argument in opening statement (context/motivation), provided you lay a proper foundation of public reasons before closing argument. If you slip and argue revelation as fact, opposing counsel objects. The Judge issues a **Limiting Instruction**: "You may consider this testimony only for the purpose of understanding the speaker's motivation, not for the truth of the matter asserted." If public reasons are supplied "in due course," the error is **Cured**.

  **4. The Record and Judicial Notice**
  The justification for the law must appear on the **Face of the Record**. You cannot rely on secret legislative intent or private moral convictions.
  *   **Judicial Notice:** Public reasons are matters of common knowledge or capable of accurate determination by sources of reasonable accuracy (science, history, public consensus). Revelation is not subject to judicial notice.

  **5. Burdens of Proof**
  The burden is on the coercer (the State) to produce public reasons. The standard is not "Beyond a Reasonable Doubt" (truth), but **"Preponderance of Public Evidence"** (legitimacy). If the record is equally balanced between public and non-public reasons, the coercion fails.

  **6. Appeal and Harmless Error**
  If a law is challenged on appeal (constitutional review), the reviewing court looks *only* at the record. If the legislature relied on inadmissible evidence but there was enough competent evidence to support the verdict, the reliance on sectarian reason is **Harmless Error**. The judgment stands. However, if the inadmissible evidence was the *but-for* cause of the coercion, the verdict is reversed as **Unconstitutional** (lacking legitimacy).

  ***

  ### The Residue Report

  Here is where the analogy holds, where it bends, and where it breaks.

  **1. What Carries Over Cleanly**
  *   **The Exclusionary Logic:** The structural parallel is robust. Both systems say, "Even if this is true/important to *you*, you cannot use it to justify *this specific outcome*." Evidence law excludes reliable evidence if it was obtained unlawfully (exclusionary rule); Public Reason excludes true moral convictions if they aren't shareable. Both prioritize the *integrity of the process* over the *completeness of the information*.
  *   **The Record Requirement:** Rawls's insistence that justifications be explicit mirrors the administrative law requirement that agencies articulate their reasoning. You cannot hide behind "we know it's right"; you must show the work.

  **2. What Has to Be Bent to Fit**
  *   **The Judge vs. The Jury:** In your trial analogy, the Judge (State) instructs the Jury (Citizens) on what counts as evidence. But in Rawls's democracy, the Citizens *are* the Judge. There is no neutral arbiter to sustain an objection when a politician preaches. The "objection" has to be raised by the citizenry against themselves. This turns a procedural rule into a cultural norm, which is much harder to enforce than a Rule 103 objection.
  *   **Harmless Error:** In law, we tolerate procedural sins if the outcome is robust. Rawls is much stricter. If the *motive* was sectarian, even if the outcome looks secular, Rawlsians often argue the legitimacy is tainted. The legal system cares about the *verdict*; Public Reason cares about the *authority*.

  **3. What Has No Counterpart (The Breakdown)**
  *   **Truth vs. Legitimacy:** This is the fatal flaw in the translation. Evidence law is **epistemic**. We exclude hearsay because it's unreliable for finding the *truth*. Public Reason is **moral**. We exclude religious arguments not because they are false (they might be true), but because relying on them violates a duty of *respect*.
      *   *In Court:* If you have a video tape (competent evidence) proving the defendant is guilty, it doesn't matter if the prosecutor hates him. The verdict stands.
      *   *In Rawls:* If you have a public reason (competent evidence) supporting the law, but the *actual* driving force was sectarian dominance, Rawls says the law is illegitimate.
      *   *The Mismatch:* Evidence law assumes the rules serve the truth. Public Reason assumes the rules *constitute* the justice.

  **4. The "Reasonable Citizen" Test (Your Specific Worry)**
  You suspected the "all reasonable citizens could accept" clause was doing work no procedural rule does. **You are right.**

  In trial procedure, we do not require that the loser *accept* the reasoning. We require that the loser had a *chance to contest* the reasoning.
  *   **Legal Standard:** Procedural Due Process. (Did you get to speak? Was the judge impartial?)
  *   **Rawlsian Standard:** Substantive Acceptability. (Can you actually agree with this reason given your status as a free and equal person?)

  **The Smuggling:**
  Rawls is smuggling a substantive moral commitment (fraternity/equality) into a procedural box.
  *   In law, if the evidence is admissible, the verdict is valid, even if the defendant thinks the jury is stupid.
  *   In Public Reason, if the reason is not *shareable*, the coercion is tyranny, even if the vote was unanimous.

  There is no evidentiary rule that says, "This evidence is inadmissible because the opposing party cannot psychologically accept its premise without violating their own integrity." Rule 403 excludes evidence based on *prejudice*, not on *incompatibility with the opponent's worldview*.

  ### The Verdict on the Translation

  The translation is **mostly loss** regarding the core normative claim.

  If you treat Public Reason as mere procedure, you turn it into a **Hobbesian Modus Vivendi**. You get a system where we agree to stick to secular reasons simply to keep the peace (like a court sticking to rules to avoid mistrials).

  But Rawls wants **Liberal Legitimacy**. He wants the citizen to look at the law and say, "I am not being subdued; I am being addressed as an equal."

  *   **Procedure** ensures I wasn't cheated.
  *   **Public Reason** ensures I wasn't conquered.

  Your legal vocabulary captures the *mechanics* of the exclusion (the "how"), but it cannot capture the *point* of the exclusion (the "why"). In evidence law, we exclude to protect the **accuracy of the verdict**. In Public Reason, we exclude to protect the **status of the citizen**.

  If you teach this analogy, use it to show the *structure*, but be prepared to demolish it when you hit the "Reasonable Acceptance" clause. That clause is not a rule of evidence; it is a demand for recognition. No court procedure demands recognition; they only demand compliance.
