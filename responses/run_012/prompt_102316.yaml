      *   *Exclusions:* Comprehensive doctrines (e.g., specific religious revelations) cannot be the *sole* basis for coercion.
      *   *Proviso:* Religious/non-public reasons can be introduced if public reasons are provided in due course.
      *   *Goal:* Legitimacy of the political order, stability, mutual respect.
      *   *Audience:* The "public" (sovereign people).

  3.  **Map to Evidence/Procedure Vocabulary:**
      *   *Coercion through law* $\rightarrow$ *Judgment/Verdict affecting rights/liberty.*
      *   *Reasons offered* $\rightarrow$ *Evidence/Argument presented at trial.*
      *   *Reasonable citizen acceptance* $\rightarrow$ *Admissibility standards (Relevance + Reliability).*
      *   *Religious/Comprehensive doctrines* $\rightarrow$ *Hearsay / Privileged Info / Prejudicial Evidence (Rule 403).*
      *   *Public Reasons* $\rightarrow$ *Competent, Substantial Evidence.*
      *   *Proviso* $\rightarrow$ *Curative Admissibility / Limiting Instructions.*
      *   *The Record* $\rightarrow$ *The Official Justification.*
      *   *Appeal/Review* $\rightarrow$ *Ensuring the rules were followed.*

  4.  **Drafting the Translation (The "Case Law" Version):**
      *   *Premise:* The legislature/court is the trier of fact applying law to the populace.
      *   *Admissibility:* Arguments for coercion must pass a "Public Relevance" test. Is it probative of a legitimate state interest?
      *   *Hearsay/Privilege:* "God told me" is hearsay (out-of-court assertion, unavailable declarant) or privileged (internal conscience). It's inadmissible as *sole* basis for verdict.
      *   *The Proviso:* You can mention the religious motive (opening statement), but you must lay foundation with secular evidence (exhibits) before closing argument.
      *   *Jury Instructions:* The judge instructs the "citizen jury" to consider only public reasons in deliberation.
      *   *Appeal:* If a law rests solely on inadmissible evidence (sectarian reason), it's reversible error.

  5.  **Developing the Residue Report (The Critical Analysis):**
      *   *What carries over:* The exclusionary rules (Rule 403 prejudice vs. probative value matches the exclusion of divisive sectarianism). The focus on the *record* (justification must be explicit).
      *   *What bends:* "Reasonable citizen" isn't a judge. Judges are trained experts; citizens are laypeople. The "acceptance" standard in law is procedural compliance, not actual psychological acceptance.
      *   *What's missing (The Crucial Bit):* The *Legitimacy* vs. *Correctness* distinction. Law cares about correct application of rules. Public Reason cares about the *moral standing* to coerce.
      *   *The "All Reasonable Citizens" Test:* In law, we don't ask if the loser accepts the reasoning. We ask if the rules were followed. In Rawls, if a reasonable citizen *cannot* accept the reason, the law lacks legitimacy, even if procedurally perfect. This is the breakdown point.
      *   *Is it smuggling?* Yes. Rawls is smuggling a moral norm (mutual respect) into a procedural guise. Procedure ensures fairness; Public Reason ensures *fraternity/equality*.

  6.  **Refining the Tone:**
