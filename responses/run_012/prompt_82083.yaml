      *   *Final Polish on Question:* "Does the normative stalemate regarding dissenting advance directives dissolve if we treat the conflict not as autonomy vs. interests, but as a dispute over the default burden of justification, and does the asymmetry between refusing and demanding treatment determine which default is coherent?"

  3.  **Analyze the "Standing Positions" (The Literature Gap):**
      *   *Position A (Precedence/Autonomy):* Dworkin, etc. Past autonomy rules. But why? Usually appeals to "critical interests."
      *   *Position B (Presentism/Interests):* Dresser, etc. Present experience rules. But why? Usually appeals to "current welfare."
      *   *The Gap:* Both assume a starting point. A assumes the AD is valid until proven harmful. B assumes the AD is invalid until proven authoritative. They talk past each other because they don't argue the *procedural* priority, only the *substantive* value.
      *   *Why Personal Identity/Pre-commitment are the "Obvious" but Rejected Routes:* Personal identity (Parfit) gets bogged down in metaphysics (is it the same person?). Pre-commitment (Ulysses contracts) gets bogged down in contract law analogies that don't fit medical ethics. The proposal needs to explicitly avoid these to stay within scope and focus on the *normative structure*.

