answer: |-
  **Term Paper Proposal**

  **Title:** The Burden of the Past: Default Rules and the Asymmetry of Advance Directives

  **1. The Research Question**
  Does the normative stalemate regarding dissenting advance directives dissolve if we treat the conflict not as a substantive clash between past autonomy and present interests, but as a procedural dispute over the default burden of justification, and does the asymmetry between refusing and demanding treatment determine which default is coherent?

  **2. Rationale: Why the Standing Positions Stall**
  The contemporary debate over advance directives (ADs) in cases of later dissent (e.g., a patient with advanced dementia who appears content despite a prior directive refusing life-sustaining treatment) is typically framed as a contest between two substantive values: the autonomy of the earlier self versus the welfare or current will of the later self. Proponents of the directive argue that the earlier self's right to self-determination extends across time. Opponents argue that the later self's current experiential interests outweigh the abstract preferences of a person who no longer exists in a psychologically continuous sense.

  This framing produces a theoretical stalemate. Both sides appeal to intuitive moral primitives that are difficult to weigh against one another. However, this proposal argues that this stalemate is an artifact of a hidden procedural assumption. The debate is not actually being decided on the merits of autonomy versus welfare, but on an unargued default rule regarding the *status quo*.

  *   **Position A (Precedence)** implicitly assumes the directive is the status quo. The burden of proof lies on those who wish to override the document.
  *   **Position B (Presentism)** implicitly assumes the current will is the status quo. The burden of proof lies on those who wish to enforce a document against a dissenting patient.

  Because neither side explicitly argues for why their preferred starting point should hold, they talk past one another. They treat their default rule as a neutral background condition rather than a normative choice. This paper posits that by making this default rule explicit, we can move beyond the stalemate. Furthermore, the "Refusal vs. Demand" asymmetry serves as the critical test case. In medical ethics, the default for bodily integrity is typically "no treatment without consent." An AD *refusing* treatment aligns with this background default, whereas an AD *demanding* treatment conflicts with it. If the authority of the AD relies on the hidden default rule, its normative force should fluctuate depending on whether it is used to refuse or demand care. If the authority does not fluctuate, the default rule explanation fails, and we must return to substantive theories of identity or value.

  **3. Methodology and Argument Structure**
  This paper will avoid the two most common routes for analyzing advance directives: metaphysical accounts of personal identity and legalistic accounts of pre-commitment contracts.
  *   **Exclusion of Personal Identity:** Arguments relying on psychological continuity (e.g., Parfitian reductions) often lead to skepticism about the binding nature of ADs. However, this leads to a metaphysical quagmire that distracts from the normative question of how we ought to act *even if* we grant the earlier self some standing. This paper assumes for the sake of argument that the earlier self has *some* claim, to test the structure of that claim.
  *   **Exclusion of Contract Theory:** Treating ADs as Ulysses contracts invites analogies to commercial law that do not map cleanly onto fiduciary medical relationships. It also presupposes the enforceability it seeks to explain.

  Instead, the paper will employ a method of **procedural reconstruction**. It will analyze the logical structure of the arguments offered by both sides to reveal the hidden burden of proof.

  **Proposed Outline (for ~6,000 words):**

  *   **Introduction (750 words):**
      *   Define the problem of later dissent (the "then-self" vs. "now-self" conflict).
      *   State the thesis: The debate stalls due to unacknowledged default rules regarding the burden of justification.
      *   Introduce the Refusal/Demand asymmetry as the diagnostic tool.

  *   **Section I: The Stalemate of Autonomy vs. Interests (1,250 words):**
      *   Reconstruct the standard argument for the authority of the earlier self (Critical Interests/Autonomy).
      *   Reconstruct the standard argument for the authority of the later self (Experiential Interests/Current Will).
      *   Demonstrate why these two positions are incommensurable in the standard framing (the "stall").
      *   Argue that both positions rely on an unargued assumption about which state of affairs requires justification: following the AD or ignoring it.

  *   **Section II: The Default Rule Hypothesis (1,500 words):**
      *   Define the concept of a normative default rule in this context (who holds the veto?).
      *   Show how Position A relies on a "Precedence Default" (the past instruction stands unless actively revoked by the present self's *competent* judgment).
      *   Show how Position B relies on a "Concurrence Default" (the past instruction lapses unless actively endorsed by the present self's *current* judgment).
      *   Argue that the literature treats these defaults as self-evident rather than defended, which explains the lack of resolution.

  *   **Section III: The Test Case — Refusal vs. Demand (1,750 words):**
      *   Apply the Default Rule Hypothesis to **Directives Refusing Treatment**.
          *   Analyze how the background default of medical consent (bodily integrity) interacts with the AD. Here, the AD and the medical default often align (no treatment).
      *   Apply the Default Rule Hypothesis to **Directives Demanding Treatment**.
          *   Analyze the conflict. Here, the AD fights the medical default (which generally does not mandate futile or non-indicated care).
      *   **The Crucial Test:** If the authority of the AD is truly based on the "Precedence Default" (Past Self Rules), it should hold equally for refusal and demand. If the authority is actually parasitic on the background medical default, it will be strong for refusal but weak for demand.
      *   Argue that intuition and legal practice suggest the latter: we are more willing to honor a past refusal than a past demand when the present self dissents. This suggests the "authority" is not intrinsic to the AD but dependent on its alignment with the background burden of proof.

  *   **Section IV: Implications and Resolution (750 words):**
      *   Synthesize the findings. If the asymmetry holds, the "authority" of the AD is not content-independent (not just about the "say-so" of the past self).
      *   Propose a determinate answer: The binding force of an AD in cases of dissent is not a function of personal identity continuity, but of whether the AD relieves or compounds the burden of justification required by the medical context.
      *   Conclude that the debate should shift from "Which self wins?" to "Where does the burden of proof lie in this specific clinical context?"

  **4. Success and Failure Conditions**
  *   **Success:** The paper successfully demonstrates that the Refusal/Demand asymmetry exposes the hidden default rule. A successful outcome provides a determinate answer: that the authority of ADs is not uniform but context-dependent on the background burden of proof. It resolves the stalemate by showing that the two sides are actually arguing about procedure, not substance.
  *   **Failure (Collapse into Familiar Positions):** The project fails if it simply concludes that "Autonomy is more important for refusal" and "Welfare is more important for demand" without linking this back to the *structural default rule*. If the argument devolves into weighing values rather than analyzing the burden of justification, it has collapsed back into the stalemate it seeks to cure.
  *   **Failure (Metaphysical Drift):** The project fails if it becomes bogged down in defining the "self." If the argument requires a definitive stance on psychological continuity to make its point, it has violated the methodological constraint and exceeded the scope.
  *   **Failure (Indeterminacy):** If the Refusal/Demand test case yields ambiguous results (i.e., if we are equally willing to enforce demands as refusals), the Default Rule Hypothesis is falsified. The paper must acknowledge this possibility; however, the argument is that the asymmetry *is* the key to the solution.

  **5. Scope and Feasibility**
  *   **Word Count Management:** At 6,000 words, there is no room for a comprehensive literature review. The paper will reference the *structure* of the opposing arguments rather than engaging with every specific theorist.
  *   **What Must Be Cut:**
      *   **Legal Statutes:** Specific laws (e.g., Patient Self-Determination Act) will be mentioned only as illustrative of the default rule, not analyzed in legal detail.
      *   **Specific Clinical Conditions:** The paper will speak generally of "dementia" or "incapacity" rather than distinguishing between Alzheimer's, vascular dementia, etc., unless clinically relevant to the capacity to dissent.
      *   **Surrogate Decision Making:** The role of family members or proxies will be excluded to focus strictly on the dyadic conflict between the earlier self (via document) and the later self (via behavior).
      *   **Comparative Ethics:** Arguments from jurisdictions outside the dominant bioethical framework (e.g., non-Western conceptions of self) will be excluded to maintain focus on the internal logic of the autonomy/welfare debate.
  *   **Realistic Timeline:**
      *   *Weeks 1-2:* Finalize the reconstruction of the "Default Rule" concept.
      *   *Weeks 3-4:* Draft Sections I and II (The Stalemate and The Hypothesis).
      *   *Weeks 5-6:* Draft Section III (The Asymmetry Test Case) — this is the core contribution.
      *   *Weeks 7-8:* Draft Introduction and Conclusion; refine the "Success/Failure" criteria into the final argument.
      *   *Week 9:* Revision for clarity and word count.

  **6. Conclusion**
  This proposal shifts the terrain of the advance directive debate from metaphysics to procedure. By isolating the default rule regarding the burden of justification and testing it against the asymmetry of refusing versus demanding treatment, the paper aims to provide a determinate answer to why these disputes stall and how they might be coherently resolved. This approach respects the complexity of the moral problem while avoiding the infinite regress of personal identity theory.
