answer: |-
  # Q&A Prep Sheet: The Pasadena Game & Sequential Expectation

  **Speaker:** Retired Physicist
  **Audience:** Formal Epistemologists, Decision Theorists, Behavioral Economists, 1 Non-Standard Analyst
  **Core Thesis:** The Pasadena Game has a well-defined EV of $\ln 2$ because the game is a temporal process, not an unordered set. The expectation is the limit of the partial sums in the natural order of play.

  ---

  ### 1. The Axiomatic Kill Shot (Linearity & Additivity)
  **Likelihood:** High | **Damage:** Critical
  **The Question:** "Standard decision theory relies on the Linearity of Expectation: $E[X + Y] = E[X] + E[Y]$. If you assign $\ln 2$ to the Pasadena game ($P$), consider a game $C$ that pays $-\ln 2$ with probability 1. By your logic, $E[P+C]$ should be 0. However, if we combine the payoffs state-by-state, the resulting series might lose its conditional convergence properties or rearrange differently. If your expectation operator isn't linear, it cannot guide rational choice under uncertainty. Are you proposing we abandon Linearity for conditionally convergent prospects?"

  **Your 2-Minute Reply:**
  "I am not proposing we abandon Linearity universally, but rather that we restrict its domain. Linearity holds for absolutely convergent series, which covers 99% of physical and economic applications. The Pasadena game is a pathological edge case, like a singularity in general relativity. When you encounter a singularity, you don't discard the field equations; you acknowledge the coordinate system has broken down.
  My claim is that the 'state space' in the Pasadena game is not a static set of mutually exclusive possibilities, but a trajectory. When you add $C$ to $P$, you are altering the trajectory's payoff structure. If the addition destroys the conditional convergence, the game is no longer the same *type* of process. In physics, we accept that certain observables are not defined for certain states. I am arguing that for sequential processes with conditionally convergent payoff streams, the 'Expected Value' is the limit of the process, not the Lebesgue integral over the outcome space. We sacrifice Linearity in this specific, pathological domain to preserve the physical reality of the temporal generation of outcomes."

  **Where the Reply is Soft:**
  You are admitting that your definition of "Expectation" does not satisfy the standard axioms of rational preference (von Neumann-Morgenstern or Savage). If $E$ isn't linear, it doesn't map to utility in the standard way. They will press you on why this number ($\ln 2$) should guide action if it doesn't behave like a value.

  ---

  ### 2. The Measure Theoretic Purist
  **Likelihood:** High | **Damage:** Severe
  **The Question:** "You are conflating a Riemann sum with a Lebesgue integral. In modern probability theory, expectation is defined as the Lebesgue integral with respect to a probability measure. The Lebesgue integral is order-independent by construction. If the integral of the absolute value is infinite, the expectation is undefined. By insisting on the natural order, you are reverting to a pre-1900 definition of integration. Why should decision theory adopt a mathematically inferior framework just to rescue a value for this specific game?"

  **Your 2-Minute Reply:**
  "Mathematics is a tool for modeling reality, not the reality itself. The Lebesgue integral is designed for static measure spaces where all outcomes exist simultaneously. But a coin toss is a causal, temporal process. Toss 1 happens before Toss 2. The 'unordered bag of outcomes' is a mathematical abstraction that discards causal information inherent in the game's setup.
  When a physicist models a system, we choose the coordinate system that respects the symmetries and constraints of the physical setup. Here, the constraint is temporal ordering. To treat the outcomes as an unordered set is to throw away information about how the value is generated. I am not arguing that the Lebesgue integral is 'wrong'; I am arguing it is the wrong tool for *sequential* games where the payoff function depends on the stopping time index $n$ in a way that creates conditional convergence. We should use the definition of expectation that respects the generation mechanism."

  **Where the Reply is Soft:**
  You are effectively redefining "Expected Value" to mean "Limit of Partial Sums." The audience will argue that you are no longer talking about *Expectation* (a normative guide for belief) but about *Summation* (a mathematical operation). They will ask why this sum has normative force.

  ---

  ### 3. The State Individuation Objection
  **Likelihood:** Medium | **Damage:** Moderate
  **The Question:** "You claim the order is 'part of the game.' But I can describe the same game using a different state space. Suppose I define the state $\omega$ as the infinite sequence of coin flips. The payoff function $X(\omega)$ is defined on that sequence. The order of summation is a property of my calculation, not the game. If I calculate the expectation by grouping outcomes differently (e.g., pairing odd and even $n$), I get a different value. Why is your preferred ordering privileged? Is it just because it matches the index $n$?"

  **Your 2-Minute Reply:**
  "The index $n$ is not an arbitrary label; it is the stopping time. The game *ends* at $n$. The payoff is a function of the duration of the game. In the state space of infinite sequences, most sequences have probability zero. The only relevant states are the finite stopping times. These stopping times are naturally ordered by integers.
  If you group outcomes differently, you are effectively proposing a different game—one where the casino aggregates payouts before handing them over. In the standard Pasadena game, the payout is determined at the moment the game stops. The 'natural order' is privileged because it is the only order that corresponds to the causal history of the stopping event. To reorder the sum is to imagine a counterfactual process where the casino checks 'what if it had stopped at $n=2$?' after it already stopped at $n=1$. That is physically incoherent."

  **Where the Reply is Soft:**
  Decision theorists treat states as logically possible worlds, not causal histories. They will argue that rational choice should be invariant under redescription. If the payoff is the same, the value should be the same, regardless of how you describe the path to it.

  ---

  ### 4. The Non-Standard Analysis Angle (The One Guy)
  **Likelihood:** Low | **Damage:** Nuisance
  **The Question:** "If we're opening the door to non-standard summation methods to handle infinite payoffs, why stop at the standard limit $\ln 2$? Using hyperreals, we can assign a precise value to the remainder term of the series. Wouldn't a hyperreal expectation capture more information about the game's structure than just the standard part $\ln 2$?"

  **Your 2-Minute Reply:**
  "That is a fascinating alternative, and I agree that hyperreals offer a richer structure for infinite games. However, my goal here is minimal intervention. I want to show that even within standard analysis, the value is well-defined *if* we respect the sequential nature of the process. Introducing hyperreals adds ontological baggage that isn't necessary to resolve the paradox.
  Furthermore, for decision-making, agents typically operate in standard reals. A hyperreal value needs to be 'standardized' to be used in a bet anyway. My argument is that the standard part *is* the value, provided we don't permute the series. If you can show that a hyperreal approach yields a different *standard part* that better predicts rational behavior, I would be interested, but I suspect it will converge to the same $\ln 2$ in the standard shadow."

  **Where the Reply is Soft:**
  You are inviting him to prove you wrong using his own specialty. If he shows that the hyperreal value implies a different buying price, your $\ln 2$ claim looks arbitrary.

  ---

  ### ⚠️ THE QUESTION YOU HOPE NOBODY ASKS
  **The Dutch Book / Operationalization Challenge**
  **Damage:** Fatal
  **The Question:** "Let's make this operational. You say the value is $\ln 2 \approx 0.69$. I will sell you a ticket to play this game for $0.70$. Since you claim the value is $0.69$, you should refuse. But if you refuse, I can construct a Dutch Book against you by offering you the game for free and then charging you a fee slightly less than $\ln 2$ to swap it for a sure thing. If your 'value' doesn't dictate a buying and selling price that protects you from sure losses, in what sense is it a 'Decision Theoretic' value? Are you describing a mathematical sum or a price?"

  **Why this is dangerous:**
  This bypasses all your mathematical arguments about order and integration. It attacks the *normative* core of decision theory. If your $\ln 2$ doesn't prevent you from being money-pumped, it is not a valid decision-theoretic expectation.
  **Preparation:** If this comes up, do not try to solve the Dutch Book. Pivot to **Risk Aversion**. Argue that no rational agent should play this game at *any* price because the variance is infinite, and that $\ln 2$ is a descriptive property of the stream, not a prescriptive price. (This concedes the main point, but saves face).
