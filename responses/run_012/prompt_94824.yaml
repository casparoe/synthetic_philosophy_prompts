  I'm a retired physicist who's been sitting in on philosophy seminars for the last couple years, and somehow I've wangled an invite to give a talk at a decision theory workshop next month. The room is mostly formal epistemologists and decision theorists, a few economists who do behavioral stuff, and one guy who's really into non-standard analysis. My thesis is that the Pasadena game—flip a fair coin until heads, if it lands on toss n you win 2^n/n when n is odd and lose 2^n/n when n is even—actually has a perfectly well-defined expected value, namely ln 2, and that the whole 'undefined expcted value' thing is an artifact of treating the game as an unordered bag of outcomes instead of a sequential process. The coin flips generate the outcomes in a natural order, and that order is part of the game, not just a description of it. So the expectation is the sum in that order, which converges to ln 2. I want a Q&A prep sheet: the objections I'll actually get from this audience, ordered by how much damage they'd do, each phrased the way a decision theorist would put it, with a two-minute reply and a note on where the reply is soft. Include the question I'm hoping nobody asks.
