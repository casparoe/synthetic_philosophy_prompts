  ### Decision Tree for Platonia and Luring Lottery Variants

  This tree sorts decision-making positions based on how they resolve specific variations of the game. Answer each question with **Yes** or **No** based on your intuition or stated commitments. Follow the branch corresponding to your answer.

  **Q1. The Two-Group Variant (Symmetry Breaker)**
  *Scenario:* The population is divided into two groups of different sizes (Group A and Group B). The prize is paid *only* if exactly one person submits from Group A **AND** exactly one person submits from Group B.
  *Question:* Do you calculate your probability of submitting based on the assumption that your decision process is logically linked to the decision processes of agents in the *other* group, despite the population size difference?
  *   **Yes:** (Your decision depends on symmetry/logical correlation). Go to **Q2**.
  *   **No:** (Your decision depends only on causal impact and your local group size). Go to **Q7**.

  ---

  #### **Branch: Logical/Symmetry Dependent (Q2–Q6)**

  **Q2. The Cost Variant (Luring Lottery)**
  *Scenario:* In the Luring Lottery, submitting costs a small amount $c$. The total prize is $P$. The population is $N$. It is common knowledge that $P/N < c$ (the share if everyone submits is less than the cost).
  *Question:* Do you refrain from submitting because the *group outcome* (everyone losing money) is unacceptable, even if your individual causal impact on the total number of submitters is negligible?
  *   **Yes:** (You prioritize group outcome/logical constraint). Go to **Q3**.
  *   **No:** (You submit if your individual expected evidential return is positive, or you treat the cost as irrelevant to your logical duty). Go to **Q4**.

  **Q3. The Group Agent Claim**
  *Scenario:* You are reasoning about the Luring Lottery with costs (as above).
  *Question:* Do you explicitly adopt the perspective of a "group agent" (reasoning as "We choose...") rather than an individual agent reasoning about others?
  *   **Yes:** Go to **Q5**.
  *   **No:** Go to **Q6**.

  **Q4. The Information Variant (Correlation Breaker)**
  *Scenario:* In the Platonia Dilemma (cost=0), you receive reliable information that a large number of others have *already* submitted before you decide.
  *Question:* Does this information change your decision from "Submit" to "Do Not Submit" because the evidential correlation between your choice and theirs is now broken?
  *   **Yes:** (You are sensitive to evidential updates). **Leaf: Evidential Decision Theory**.
  *   **No:** (You maintain your strategy based on logical output or duty). Go to **Q6**.

  **Q5. The Duty Variant (Deontological Check)**
  *Scenario:* In the Platonia Dilemma, imagine a "magic" scenario where you can submit without it counting towards the total (it causes no harm), but you still derive personal satisfaction from the act of submitting.
  *Question:* Is submitting still impermissible because the *maxim* of your action ("I will submit") cannot be willed as a universal law, regardless of the causal outcome?
  *   **Yes:** **Leaf: Kantian Universalizability**.
  *   **No:** **Leaf: Team Reasoning**.

  **Q6. The Clone Variant (Logical Specificity)**
  *Scenario:* You know for a fact that one other player in the game is running the exact same algorithm as you (a perfect clone), but the rest are not.
  *Question:* Do you coordinate your decision specifically with the clone to maximize joint utility, treating the logical link as the primary constraint?
  *   **Yes:** **Leaf: Functional Decision Theory** (includes Timeless/Updateless).
  *   **No:** **Leaf: Superrationality** (Hofstadter style).

  ---

  #### **Branch: Causal/Independent (Q7–Q10)**

  **Q7. The Cost Variant (Luring Lottery)**
  *Scenario:* In the Luring Lottery, submitting costs $c$. $P/N < c$.
  *Question:* Do you submit anyway because submitting is a dominant strategy (your payoff is higher if you submit than if you don't, regardless of what others do)?
  *   **Yes:** Go to **Q8**.
  *   **No:** (You refrain because the equilibrium payoff is negative). Go to **Q9**.

  **Q8. The Dominance Claim**
  *Scenario:* In the Platonia Dilemma, you believe there is a 50% chance no one else will submit.
  *Question:* Do you submit solely because your action causally secures the prize in that 50% scenario, independent of whether others are rational?
  *   **Yes:** Go to **Q10**.
  *   **No:** (You require a stable equilibrium prediction). **Leaf: Nash Equilibrium**.

  **Q9. The Equilibrium Claim**
  *Scenario:* You learn that all other players are choosing to submit with probability 0.5 (irrational/random).
  *Question:* Do you adjust your strategy to be the best response to *their* actual behavior, even if it violates the rational equilibrium?
  *   **Yes:** **Leaf: Causal Decision Theory**.
  *   **No:** **Leaf: Nash Equilibrium**.

  **Q10. The Risk Variant (Platonia)**
  *Scenario:* In the Platonia Dilemma, the prize is huge, but the probability of being the sole entrant is extremely low (1 in a million).
  *Question:* Do you refrain from submitting because the variance is too high, preferring a guaranteed zero over a tiny chance of a huge win?
  *   **Yes:** **Leaf: Risk-Averse Rationality**.
  *   **No:** **Leaf: Causal Decision Theory**.

  ---

  ### Analysis of Unoccupied Combinations

  The following answer patterns lead to no named position.

  1.  **Q1(Yes) + Q2(No) + Q4(No) + Q6(No):**
      *   *Diagnosis:* **Incoherent.** This combination claims logical linkage (Q1) but ignores group costs (Q2), ignores broken evidential correlation (Q4), and ignores specific logical clones (Q6), leaving no basis for the initial "Yes."
  2.  **Q1(No) + Q7(No) + Q9(Yes):**
      *   *Diagnosis:* **Unattractive.** This claims independence from symmetry (Q1) and denies dominant strategies (Q7), yet adjusts to irrational opponents (Q9). It describes a strategist who ignores causal dominance but chases moving targets, a unstable hybrid.
  3.  **Q1(Yes) + Q3(Yes) + Q5(No):**
      *   *Diagnosis:* **Merely Unexplored.** This describes a "Team Reasoner" who explicitly uses group agency (Q3) but rejects the deontological constraint (Q5). While "Team Reasoning" is the closest leaf, this specific path emphasizes the consequentialist group view over the identity view, a nuance not captured by a distinct leaf.

  ### Indistinguishable Positions

  The following positions yield identical answers on every question in this tree and are flagged as pairs the tree cannot separate:

  *   **Causal Decision Theory & Act Utilitarianism:** In these specific game structures, causal dominance and individual utility maximization typically align.
  *   **Functional Decision Theory & Superrationality:** While FDT is more formalized, both rely on logical correlation in symmetric games and produce identical submission probabilities in the variants provided.
  *   **Nash Equilibrium & Risk-Neutral CDT:** In one-shot symmetric games with common knowledge, the Nash strategy often coincides with the Causal Dominance strategy.

