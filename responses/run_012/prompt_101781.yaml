  | **Nash Equilibrium** | No, Yes, No, No | **Q9** (Equilibrium Claim) |
  | **Evidential Decision Theory** | Yes, Yes, No, Yes | **Q4** (Information Variant) |
  | **Superrationality** | Yes, Yes, No, No, No | **Q6** (Clone Variant) |
  | **Functional Decision Theory** | Yes, Yes, No, No, Yes | **Q6** (Clone Variant) |
