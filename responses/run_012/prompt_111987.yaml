answer: |-
  The controversy over Jeremy Bentham's sexual morality turns on a single, sharp question: Is the Principle of Utility a shield for individual liberty, or is it a mirror for collective prejudice? Your friend argues for the former, positing that Bentham's hedonism is inherently liberating because it strips sexual acts of intrinsic sin, reducing them to calculations of pleasure and pain. You argue for the latter, suggesting that the very machinery of that calculation—specifically the inclusion of malevolent pleasures and the pains of the moral sanction—allows the theory to collapse into the tyranny of the majority. To resolve this impasse, we must strip away historical context and examine the internal logic of Bentham's framework. We must ask whether a consistent application of the calculus protects the sexual minority, or whether it theoretically sanctions their oppression.

  The strongest case for the liberating reading rests on Bentham's polemic against the Principle of Asceticism and the Principle of Sympathy and Antipathy. For Bentham, the Principle of Utility is the only rational standard for legislation: actions are right insofar as they augment the happiness of the community. Sexual acts, classified under the pleasures of sense, are genuine goods. In the absence of non-consent or physical harm, they produce no "primary mischief." Consequently, any law prohibiting such acts inflicts the pain of restraint and the loss of pleasure without preventing any countervailing pain. To prohibit them is to rely on the Principle of Asceticism (which erroneously posits pain as good) or the Principle of Sympathy and Antipathy (which posits mere dislike as a sufficient reason for punishment). On this reading, the liberating conclusion is not an accident; it is the logical result of purging legislation of irrational prejudices. If the only relevant pains are those of physical harm or violated consent, the utilitarian calculus necessarily clears the field for consensual sexual liberty. The fact that Bentham left these manuscripts unpublished is, as your friend suggests, evidence of external social pressure, not internal theoretical doubt.

  However, the instability reading exposes a deeper tension within the architecture of the calculus itself. Bentham's system is exhaustively hedonistic: it recognizes no qualitative distinction between pleasures, nor does it dismiss any pain as illusory simply because of its source. In his catalogues, Bentham explicitly lists the "pleasures of malevolence" (the gratification derived from another's suffering) and the "pains of the moral sanction" (the anguish of shame, ostracism, or the discomfort of witnessing what one finds repugnant). These are not errors in the data; they are data points. If a majority of the population feels intense disgust at a specific consensual sexual practice, that disgust constitutes a real pain under the moral sanction. If the legislators reflect this majority, the prohibition of the act gratifies their malevolent pleasure (the desire to punish the "deviant") and alleviates their pain of disgust.

  Here lies the wobble. If the legislator sums the intense, widespread pain of the majority's disgust against the concentrated, private pleasure of the minority's sexual act, the calculus may well dictate prohibition. The Instability Reading argues that Bentham cannot simply wish these pains away. To count them is to allow the Principle of Sympathy and Antipathy to re-enter the system through the backdoor of the Principle of Utility. The law would be punishing an act not because it causes physical harm, but because it causes *offense*. If the theory permits the pain of offense to outweigh the pleasure of the act, then the "liberation" is contingent solely on the empirical weakness of the majority's prejudice. It is not a theoretical right; it is a temporary reprieve.

  To defend a verdict, we must answer whether a consistent utilitarian can treat these malevolent pleasures and moral-sanction pains as fully weighted items. The answer, rigorously pursued, is yes. To exclude them is to cheat. Bentham's fundamental axiom is that nature has placed mankind under the governance of pain and pleasure. If a spectator feels pain upon witnessing a sexual act, that pain is phenomenologically real. To tell the legislator to ignore it is to introduce a restriction external to hedonism. It would require a distinction between "legitimate" pains (physical harm) and "illegitimate" pains (psychological disgust) that Bentham's qualitative hedonism does not support. For Bentham, pain is pain; the source does not negate the sensation.

  Therefore, if we treat these items as fully weighted, does the decriminalization of consensual sexual conduct survive? Theoretically, no. It survives only empirically. A consistent Benthamite utilitarianism cannot guarantee sexual liberty as a matter of principle. It can only recommend liberty as a matter of contingent calculation. If the majority's antipathy is sufficiently intense, the Principle of Utility demands the suppression of the minority. This confirms your position: the theory is unstable regarding liberty. It contains the resources for liberation (the rejection of asceticism), but it also contains the resources for repression (the validation of the moral sanction).

  Your friend might object that Bentham distinguishes between the *ground* of a decision and the *material*. One can use the Principle of Utility (the ground) to weigh the pain of disgust (the material) without adopting the Principle of Antipathy. However, this is a distinction without a difference in outcome. If the pain of antipathy is given full weight, the outcome is identical to legislating based on antipathy directly. The "wobble" you identify is real: the theory claims to be a rational check on prejudice, yet its calculus requires it to validate the painful sensations that prejudice produces.

  Can this be resolved without cheating? To save the liberating conclusion, one must impose a principled restriction on the calculus: specifically, that pains arising solely from the knowledge of another's harmless conduct (other-regarding preferences) must be discounted. But is this restriction itself a piece of asceticism or antipathy in disguise? It is not asceticism, as it does not claim pleasure is bad. It is, however, a rejection of the exhaustive hedonistic axiom. It claims that *some* pains do not count for legislative purposes. This moves the theory away from pure act-utilitarianism toward a rule-based or rights-based constraint. Bentham famously dismissed natural rights as "nonsense upon stilts," so he cannot appeal to a right to sexual privacy to override the calculus.

  Thus, the verdict must favor the Instability Reading. A consistent utilitarian, adhering strictly to Bentham's catalogues and the exhaustive weighing of sanctions, cannot theoretically condemn the criminalization of consensual sexual acts if the majority's disgust is sufficiently intense. The liberating reading relies on the empirical hope that disgust is rarely strong enough to outweigh sexual pleasure, or that the "secondary mischief" of insecurity caused by policing private acts will always be greater than the pain of disgust. But these are empirical gambles, not theoretical guarantees.

  The theory can condone or condemn without cheating, but it cannot guarantee liberation. To guarantee liberation, one must cheat the calculus by arbitrarily discounting the pains of the moral sanction when they stem from mere antipathy. Bentham himself likely sensed this, which may explain the hesitation in his manuscripts—not merely fear of persecution, but the recognition that his own arithmetic could be turned against the liberty he desired. The instability is not in Bentham's courage, but in his calculus. By making the moral sanction a genuine pain and malevolence a genuine pleasure, he built a machine that can process prejudice as readily as it processes reason. The liberating reading is a hopeful interpretation of Bentham's intent; the instability reading is the rigorous conclusion of Bentham's logic.
