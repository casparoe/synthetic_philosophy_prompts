  ### 1. Feasibility of a Single Principle

  It is possible to construct a single principle that delivers all seven judgments without abandoning any of them. However, doing so requires rejecting the common assumption that "diachronic rationality" entails "diachronic consistency" (i.e., that an agent's preferences must remain stable over time to be rational).

  Your judgments distinguish between three distinct sources of evaluation:
  1.  **Structural Coherence:** The logical properties of preferences at a single time (Cases 1, 6).
  2.  **Epistemic Accuracy:** The agent's beliefs about their own future psychology (Cases 4, 5).
  3.  **Instrumental Efficiency:** Choosing actions that satisfy current preferences given current beliefs (Cases 2, 3, 7).

  The tension in your set arises because standard money-pump arguments conflate structural defects with diachronic instability. Your judgment on Case (7) (*The Trader's Mark*) is the linchpin: it asserts that being "pumped" due to preference *change* is not irrational, whereas being "pumped" due to preference *intransitivity* (Case 1) is. Therefore, the principle must locate irrationality in **synchronic structure** and **self-knowledge**, but not in **diachronic stability**.

  No judgments need be abandoned, provided we accept that an agent can have defective preferences (irrational state) while making blameless choices (rational conduct), as seen in Case (6).

  ### 2. The Principle

  I propose the **Principle of Synchronic Coherence and Epistemic Self-Accuracy**.

  **Statement:**
  An agent is diachronically rational if and only if:
  1.  **(Synchronic Coherence)** At every moment $t$, the agent's preferences are transitive and complete.
  2.  **(Epistemic Accuracy)** The agent's beliefs about her own future preferences are accurate.
  3.  **(Instrumental Maximization)** At every moment $t$, the agent chooses the action that maximizes expected utility relative to her preferences at $t$ and her beliefs at $t$.

  **Mapping to Cases:**

  *   **Clause 1 (Synchronic Coherence):**
      *   **Motivated by Case (1) *The Cycle*:** The agent violates transitivity at a single time. This renders her preferences defective and her resulting vulnerability to a pump a symptom of irrationality.
      *   **Motivated by Case (6) *The Refuser*:** This clause explains why her *preferences* remain defective even though her *conduct* (refusing trades) satisfies Clause 3. It separates the rationality of the state from the rationality of the action.
      *   **Satisfied by Cases (2), (3), (4), (5), (7):** In all these cases, the agent's preferences are orderly at any given moment.

  *   **Clause 2 (Epistemic Accuracy):**
      *   **Motivated by Case (5) *The Improvident Agent*:** The agent is irrational not because her preferences change, but because her *belief* that she will quit is false. This locates the fault in foresight, not preference structure.
      *   **Motivated by Case (4) *The Foresighted Agent*:** She is rational because her belief about her future weakness is accurate, allowing her to form a valid plan (commitment device).
      *   **Satisfied by Cases (2), (3), (7):** These agents either do not need to predict future preferences to act rationally (3, 7) or do so accurately (2).

  *   **Clause 3 (Instrumental Maximization):**
      *   **Motivated by Case (2) *The Commitment Device* & Case (3) *The Change of Mind*:** These cases show that acting on a current preference (to stay in bed, to stay home) is rational even if it contradicts a past preference, provided it maximizes utility at the time of choice.
      *   **Motivated by Case (7) *The Trader's Mark*:** The agent maximizes at every step. Since Clause 1 and 2 are satisfied, the indefinite loss is a result of preference change, not irrationality.
      *   **Satisfied by Case (6):** Refusing the trade maximizes her utility at the time (assuming she prefers avoiding the loss of the item to the swap), rendering her conduct blameless.

  ### 3. Predictions for New Cases

  **(a) The Partial Cycle:** An agent with cyclical preferences (Tea > Coffee > Water) is offered only two exchanges (Tea for Coffee, Coffee for Water) and stops.
  *   **Prediction:** The agent's **preferences are irrational**, but her **conduct is rational**.
  *   **Reasoning:** Clause 1 is violated (intransitive preferences exist regardless of whether the cycle is closed). Clause 3 is satisfied (she maximizes at each step). Like Case (6), she has a defective state but avoids the worst consequence through luck or limited options.

  **(b) The Free Cycle:** An agent with cyclical preferences cycles back to the start with no charges.
  *   **Prediction:** The agent is **irrational**.
  *   **Reasoning:** Clause 1 is violated. The absence of charges removes the *cost* of the irrationality but not the *defect*. Intransitivity is a structural failure of valuation, not merely a vulnerability to financial loss. The money pump is a *demonstration* of the defect, not the *source* of it.

  **(c) The Foreseen Drain:** An agent with orderly preferences correctly foresees a tradesman will drain her indefinitely via preference changes, yet continues to trade.
  *   **Prediction:** The agent is **rational**, provided she lacks a stable higher-order preference to stop the trading.
  *   **Reasoning:** This extends Case (7). If she has no global preference (like the Smoker in Case 4) that conflicts with the local trades, she violates no clause. She is synchronically coherent (Clause 1), epistemically accurate (Clause 2), and maximizing locally (Clause 3). The "drain" is merely an external observation of welfare loss, not an internal violation of rationality. If she *did* have a stable preference to keep her wealth and traded anyway, she would violate Clause 3 (akrasia).

  **(d) The Instantaneous Agent:** An agent lives for a single instant with cyclical preferences.
  *   **Prediction:** The agent is **irrational**.
  *   **Reasoning:** Clause 1 is violated. Diachronic rationality supervenes on synchronic rationality. If an agent is irrational in a single time-slice due to intransitivity, they are irrational simpliciter. Time is not required for the defect of intransitivity to exist, only for the money pump to operate.

  ### 4. Normative Status and the Role of Charges

  **Is this a Requirement of Rationality?**
  Yes, this principle is a requirement of rationality, not merely a condition for representation as a utility maximizer.
  *   **Why:** Intransitivity (Clause 1) represents a failure of normative guidance; the agent's preferences fail to rank options consistently, leaving her without a determinate "best" option. This is a failure of agency itself, not just a mathematical inconvenience. Similarly, false beliefs about oneself (Clause 2) are standard epistemic irrationality.
  *   **Representation vs. Rationality:** While intransitivity makes an agent unrepresentable by a utility function, the *reason* we care is that such an agent is susceptible to domination (as in Case 1) or self-defeat (as in Case 5). However, Case (7) clarifies that susceptibility to loss *alone* is not the test; the test is whether the loss stems from a structural defect or mere change.

  **Do Charges Matter?**
  The existence or magnitude of charges makes **no difference** to the verdict of rationality, though it matters for the *consequences*.
  *   **Small vs. Large Charges:** Whether the charge is a penny or a fortune, the violation of Clause 1 (intransitivity) or Clause 2 (false belief) remains the same. The charge merely quantifies the cost of the irrationality.
  *   **No Charges:** As in Case (b), the absence of charges does not cure the defect. An agent with intransitive preferences is irrational even if a benevolent god prevents her from losing money. The money pump argument uses charges to *reveal* the inconsistency, but the inconsistency exists independently of the charges.
  *   **Exception:** Charges matter only insofar as they trigger the *Instrumental Maximization* clause (Clause 3). If a charge is large enough to make a trade undesirable, refusing the trade becomes the rational choice. But the rationality of the *preference structure* remains independent of the charges.

  **Summary:** The principle asserts that rationality is a matter of **logical coherence at a time** and **truthfulness about oneself across time**, but it does not demand **stability of desire across time**. This preserves the intuition that changing one's mind is permissible (Cases 3, 7) while maintaining that having contradictory minds at one time (Case 1) or being ignorant of one's own nature (Case 5) is not.
