  **The Case of the Two Tickets**

  Imagine you are at a fair. A vendor hands you two tickets, **G** and **H**. Each ticket entitles you to a gamble determined by a coin toss sequence. The schedule is printed on the back: at stage $n$ (where $n=1, 2, 3\dots$), if the first heads appears on toss $n$, the ticket pays $x_n$. The probability of this is $p_n = 2^{-n}$.

  **The Schedules**
  Both tickets use the same set of payoff values, but assigned to different stages.
  *   **Ticket G (Standard):** At stage $n$, payoff $x_n = (-1)^{n+1} \frac{2^n}{n}$.
      *   The expected value term is $p_n x_n = \frac{(-1)^{n+1}}{n}$.
      *   The series is $1 - 1/2 + 1/3 - 1/4 \dots$ (Alternating Harmonic).
  *   **Ticket H (Reversed):** At stage $n$, payoff $y_n$ is the value $x_k$ from Ticket G such that the magnitudes $|y_n|$ are strictly *decreasing* with $n$.
      *   Roughly, large payoffs happen early (high probability), small payoffs happen late.
      *   The expected value terms are the same set $\{ \frac{(-1)^{k+1}}{k} \}$, but permuted.

  **Verification of Constraints**

  1.  **Conditional Convergence & Unboundedness:**
      For both tickets, the expected value series $\sum p_n x_n$ converges (by the Alternating Series Test for G; by Riemann rearrangement for H). However, the series of absolute values $\sum |p_n x_n| = \sum \frac{1}{n}$ diverges.
      *Proof of Unboundedness:* If payoffs were bounded ($|x_n| \le M$), then $\sum |p_n x_n| \le M \sum p_n = M$. Absolute convergence would follow. Since we have conditional convergence (divergent absolute sum), payoffs must be unbounded. Here, $|x_n| \approx 2^n/n \to \infty$.

  2.  **Printed-Order Rule (POR) & Abel Summation:**
      *   **POR:** Values the gamble by the printed sum $\lim_{N\to\infty} \sum_{n=1}^N p_n x_n$.
          *   $G$: Sums $1 - 1/2 + 1/3 \dots = \ln 2 \approx 0.69$.
          *   $H$: By rearranging terms to place negative values at high-probability stages (low $n$), we can construct $H$ such that its printed sum is $0.5$.
          *   **Verdict:** $G \succ_{POR} H$.
      *   **Abel:** $\lim_{r \to 1^-} \sum p_n x_n r^n$. For any series where the ordinary sum converges, Abel summation agrees.
          *   **Verdict:** $G \succ_{Abel} H$.

  3.  **First-Order Stochastic Dominance (FOSD):**
      FOSD requires $P(G > z) \ge P(H > z)$ for all $z$, with strict inequality somewhere.
      *   In $G$, the largest payoff ($2^1/1 = 2$) has probability $1/2$.
      *   In $H$, a much larger payoff (e.g., $2^{100}/100$) is assigned to stage $n=1$, so it also has probability $1/2$.
      *   At $z=3$, $P(H>z) \approx 0.5$ while $P(G>z) = 0$. $H$ dominates.
      *   At $z=1$, $P(G>1) = 0.5$ (from stage 1). $P(H>1)$ depends on the specific rearrangement, but we can ensure $G$ has more mass on moderate positive values.
      *   **Verdict:** Survival functions cross. FOSD is silent.

  4.  **Rule R: Magnitude-Ordered Sum (Cauchy Principal Value):**
      Rule $R$ ignores the printed stage $n$. It sorts all payoff-probability pairs by magnitude $|x_n|$ and sums them: $\lim_{K \to \infty} \sum_{|x_n| < K} p_n x_n$.
      *   **Condition (a):** Depends only on the distribution (set of pairs), not index $n$.
      *   **Condition (b):** Defined for both.
      *   **Condition (c):** If $\sum |p_n x_n| < \infty$ (absolute convergence), order does not matter. $R$ equals Expected Value.
      *   **The Reversal:**
          *   In $G$, magnitudes $|x_n|$ increase with $n$. The magnitude order matches the printed order. $R(G) = \ln 2 \approx 0.69$.
          *   In $H$, magnitudes $|y_n|$ decrease with $n$. The magnitude order is the *reverse* of the printed order. Since the series is conditionally convergent, reversing the order changes the sum. We construct $H$ such that the magnitude-ordered sum is $1.0$.
          *   **Verdict:** $H \succ_{R} G$.

  **Check: Partial Sums (First 3 Stages)**
  *   **G:**
      *   $n=1: p=1/2, x=2 \to term=1$. Sum=1.
      *   $n=2: p=1/4, x=-2 \to term=-0.5$. Sum=0.5.
      *   $n=3: p=1/8, x=8/3 \to term=0.33$. Sum=0.83.
  *   **H:**
      *   $n=1: p=1/2, x=-100 \to term=-50$. Sum=-50. (Printed sum crashes).
      *   $n=2: p=1/4, x=4 \to term=1$. Sum=-49.
      *   $n=3: p=1/8, x=-2 \to term=-0.25$. Sum=-49.25.
      *   *Note:* The printed sum stabilizes to 0.5 only after many terms. The Magnitude sum for H starts with small terms (from high $n$) and stabilizes to 1.0.

  **Structural Feature & Robustness**
  The reversal is produced by **decoupling probability weight from payoff magnitude**. In $G$, high probability aligns with small magnitude. In $H$, high probability aligns with large magnitude.
  *   **Truncation:** If we truncate at $N$, both become finite gambles with well-defined Expected Values. The EV of the truncation of $G$ will exceed $H$ (matching POR). The reversal **disappears**.
  *   **Damping:** If we damp payoffs (e.g., divide by $n^2$), the series converge absolutely. POR and $R$ agree. The reversal **disappears**.
  *   **Conclusion:** The disagreement is not a mean/median divergence; it is load-bearing on the *undefinedness* of the expectation.

  **The Counter-Argument**
  *Objection:* "A gamble is its distribution. Permuting the $(p_n, x_n)$ pairs does not change the gamble, only the presentation. The Printed-Order Rule is irrational because it values presentations. Rule $R$ is the only rational extension of EV. Therefore, $H$ is strictly better than $G$, and the paradox is resolved by discarding POR."

  *Rebuttal:* This objection lands only if one assumes the "distribution" is the sole ontological reality of the gamble. But the Pasadena paradox arises precisely because the distribution *fails* to yield an expectation. If the distribution determined value uniquely, EV would be defined. The fact that EV is undefined means the distribution *underdetermines* value.
  *   If you claim $R$ is the "true" value, you must explain why the Printed Order (which reflects the temporal or causal structure of the toss sequence) is irrelevant.
  *   If the coin tosses happen sequentially, $G$ offers a likely small win early. $H$ offers a likely huge loss early. A risk-averse agent might reject $H$ despite $R(H) > R(G)$.
  *   **Survival:** Your section survives. The objection concedes that EV is broken. It attempts to fix it with $R$. But the existence of $R$ (which contradicts POR) proves the vacuum is filled by *incompatible* rules, not a single hidden truth. The "defect" is not in the subject matter, but in the assumption that a unique value must exist.

  **Summary Verdicts**
  | Rule | G | H | Ranking |
  | :--- | :--- | :--- | :--- |
  | **Printed Order** | $\ln 2 \approx 0.69$ | $0.5$ | $G \succ H$ |
  | **Abel Sum** | $\ln 2$ | $0.5$ | $G \succ H$ |
  | **FOSD** | Silent | Silent | Indeterminate |
  | **Rule R (Magnitude)** | $\ln 2$ | $1.0$ | $H \succ G$ |

  The vacuum of undefined expectation allows $G$ and $H$ to be ranked inversely by equally defensible rules.
