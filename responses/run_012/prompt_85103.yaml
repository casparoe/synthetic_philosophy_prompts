prompt: |-
  I teach a second-year "reasoning and evidence" course -- mixed majors, about 20 students, one 90-minute block -- and I want an activity that makes Simpson's paradox land as a felt problem rather than a table they nod at and forget. Don't name it until the debrief, and don't explain it up front.

  Here's the seed I've got, build the presentation around it (the numbers are made up, they're just arithmetic):

  Two treatments for the same condition. Treatment A: 18 of 20 mild cases recover, and 18 of 180 severe cases recover. Treatment B: 153 of 180 mild cases recover, and 1 of 20 severe cases recover. So A wins in each group (90% vs 85%, and 10% vs 5%) but loses overall (18% vs 77%), because B was given mostly to mild cases.

  What I want them to feel: they commit to a choice, publicly, and then the same numbers re-sliced tell them the opposite -- and then they find out that the arithmetic was never the problem, the causal story is.

  So design the session. Things I want in it:

  Round 1: everyone sees only the totals and has to pick a treatment. A real vote, on paper, hands up, whatever. Something at stake even if it's just chips or a small prize for the side that ends up "winning" the session. They should be irritated when the split is revealed.

  Round 2: same data, split by severity. Second vote. Let them argue it out. Don't resolve it for them.

  Round 3, the part I actually care about: give them the same two tables three times with three different backstorys for what that severity variable is -- say, severity was recorded by the clinician before anyone was assigned a treatment; severity was recorded on day 3, after treatment had started; severity is something that both the treatment and a hidden frailty factor influence. They have to say, for each backstory, which comparison answers the question of which treatment is better. I want them to discover that the right move flips with the story, and that there's no rule -- always pool, always split -- that saves you from doing the causal work. The day-3 one is the one they'll fight about, so leave room for that.

  A lobbying round if it fits: two teams, one briefed to argue for A, one for B, each free to present the data however it likes to a student playing the regulator, who then rules. Fake currency or points for a favourable ruling. Point of it is to make them feel that one table is also a weapon, then ask whether presenting it that way was dishonest given each of the three backstories.

  Then a debrief that maps what just happened onto the pieces of the idea: the unequal group sizes, the lurking variable, why the reversal is arithmetically fine, why the resolution is causal rather than statistical, and why a bigger sample doesn't fix any of it. Tell me the materials I need to print and how to set the room up.

  And be honest with me about the running of it: what predictably goes wrong the first time (I'm guessing someone insists the totals have to be right because more data is better, and someone accuses the whole thing of being a trick about lying), how to handle each of those, and which feature of the idea the activity can't reproduce so I have to supply it myself in the debrief.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Course:** 2nd-year "Reasoning and Evidence" (mixed majors).
      *   **Class Size:** ~20 students.
      *   **Time:** 90 minutes.
      *   **Goal:** Make Simpson's Paradox a *felt problem*, not just a table.
      *   **Core Data:** Treatment A (18/20 mild, 18/180 severe) vs. Treatment B (153/180 mild, 1/20 severe).
          *   Mild: A (90%) > B (85%).
          *   Severe: A (10%) > B (5%).
          *   Overall: A (18%) < B (77%).
      *   **Structure:**
          *   Round 1: Totals only -> Vote.
          *   Round 2: Split by severity -> Vote.
          *   Round 3: Three backstories (Causal structures) -> Decide which table matters.
          *   Lobbying Round: Teams argue for A or B to a "Regulator."
          *   Debrief: Connect to theory (confounding, causal graphs, etc.).
      *   **Requirements:** Materials list, room setup, prediction of pitfalls, facilitation tips.
      *   **Constraint:** Do not name "Simpson's Paradox" until the debrief. Do not explain it up front.

  2.  **Evaluate the Data:**
      *   Treatment A: 18/20 (Mild) + 18/180 (Severe) = 36/200 Total Recovered. Total Patients = 200. Rate = 18%.
      *   Treatment B: 153/180 (Mild) + 1/20 (Severe) = 154/200 Total Recovered. Total Patients = 200. Rate = 77%.
      *   *Check:* The prompt says "A wins in each group... but loses overall."
      *   *Wait, let me double check the arithmetic provided in the prompt.*
          *   Prompt: "Treatment A: 18 of 20 mild cases recover, and 18 of 180 severe cases recover." -> Total A = 200 patients. Recovered = 36. Rate = 18%.
          *   Prompt: "Treatment B: 153 of 180 mild cases recover, and 1 of 20 severe cases recover." -> Total B = 200 patients. Recovered = 154. Rate = 77%.
          *   Prompt Claim: "A wins in each group (90% vs 85%, and 10% vs 5%)"
              *   Mild: A (18/20 = 90%) vs B (153/180 = 85%). **A Wins.**
              *   Severe: A (18/180 = 10%) vs B (1/20 = 5%). **A Wins.**
          *   Prompt Claim: "but loses overall (18% vs 77%)"
              *   Overall A: 36/200 = 18%.
              *   Overall B: 154/200 = 77%.
              *   **B Wins Overall.**
      *   *Conclusion:* The arithmetic holds up. It's a classic Simpson's Paradox setup. The imbalance in group sizes (A gets mostly severe, B gets mostly mild) drives the reversal.

  3.  **Drafting the Session Flow (90 Minutes):**
      *   *Intro (5 min):* Set the scene, no theory.
      *   *Round 1 (10 min):* Aggregate data. Vote.
      *   *Round 2 (15 min):* Disaggregated data. Vote. Tension.
      *   *Round 3 (25 min):* The Three Backstories (Causal Context). Small groups.
      *   *Lobbying (20 min):* Advocacy roleplay.
      *   *Debrief (15 min):* Naming the paradox, causal graphs, takeaways.
      *   *Total:* 90 mins. Tight but doable for 20 students.

  4.  **Developing the Three Backstories (Round 3):**
      *   *Story 1 (Confounder):* Severity determined *before* treatment (e.g., tumor size at diagnosis). Doctors assigned treatment based on severity (A for severe, B for mild). *Conclusion: Split the data.*
      *   *Story 2 (Mediator/Collider issue):* Severity measured *after* treatment starts (e.g., inflammation level on Day 3). Treatment causes inflammation. *Conclusion: Aggregated data might be safer, or splitting is biased.* (Actually, if severity is a *mediator*, splitting blocks the path. If it's a *collider*, splitting opens a path. Let's simplify for 2nd years: If treatment *causes* the "severity" label, splitting hides the treatment's effect on severity). Let's stick to the prompt's suggestion: "recorded on day 3." If Treatment A causes high inflammation (labeled "severe"), splitting makes A look bad on the "severe" group artificially.
      *   *Story 3 (Hidden Common Cause):* Severity is influenced by a hidden frailty factor *and* treatment. Or, as the prompt suggests: "something that both the treatment and a hidden frailty factor influence." This is tricky. Let's refine this to be a *Collider*. Example: Hospitalization status. You only see patients who are hospitalized. Hospitalization is caused by Severe Condition AND Treatment Side Effects. *Conclusion: Splitting creates bias.*
      *   *Refinement for Clarity:* To make it punchy for 2nd years:
          1.  **Pre-existing Condition:** Severity is baseline. (Split).
          2.  **Side Effect:** Severity is a reaction to the drug. (Don't Split).
          3.  **Selection Bias:** Severity determines if they are in the study *and* treatment affects survival to measurement. (Don't Split / Complex).
          *Let's follow the prompt's specific suggestions closely to ensure alignment.*
          1.  Clinician recorded before assignment. (Confounder -> Split).
          2.  Recorded Day 3 after start. (Mediator -> Don't Split).
          3.  Treatment + Hidden Frailty influence it. (Collider -> Don't Split).

  5.  **Designing the Lobbying Round:**
      *   Need a "Regulator" (Instructor or brave student).
      *   Team A (Pro Treatment A) wants to use the Split data.
      *   Team B (Pro Treatment B) wants to use the Aggregate data.
      *   Twist: They have to justify *why* their table is the honest one based on the Backstories.

  6.  **Anticipating Pitfalls:**
      *   *Pitfall 1:* "Bigger numbers are always better." (Aggregate is more robust).
      *   *Pitfall 2:* "This is a trick/math error." (Denial).
      *   *Pitfall 3:* "Just randomize next time." (True, but doesn't solve the analysis of *this* data).
      *   *Pitfall 4:* Confusion on Round 3 (Causal direction is hard).
      *   *Handling:* Validate the intuition, then show the consequence. Use causal diagrams in debrief.

  7.  **Materials & Setup:**
      *   Handouts for each round (progressive disclosure).
      *   Voting cards (A/B).
      *   Whiteboard for tallying.
      *   Room: Clusters of tables for group work.

  8.  **Refining the Debrief:**
      *   Must explicitly state: Statistics describes, Causality explains.
      *   Must mention: "Conditioning on a collider."
      *   Must mention: Randomization fixes this *prospectively*, but we often have *retrospective* data.

  9.  **Review against Constraints:**
      *   Don't name it until debrief? Yes.
      *   Don't explain up front? Yes.
      *   Include the specific arithmetic? Yes.
      *   Include the three backstories? Yes.
      *   Include lobbying? Yes.
      *   Include "what goes wrong"? Yes.

  10. **Final Polish:**
      *   Make sure the tone is facilitative, not lecturing.
      *   Ensure the "felt problem" aspect is highlighted (the irritation of the reversal).
      *   Check timing. 90 mins is tight for all this. I need to be strict on timekeeping. I will suggest trimming the lobbying if Round 3 runs long, as Round 3 is the core learning objective. Actually, the prompt says "A lobbying round if it fits." I'll include it but mark it as flexible.
      *   *Self-Correction on Lobbying:* With 20 students, lobbying might eat too much time. I'll integrate the lobbying *into* Round 3. Each group gets a backstory and has to argue the decision. That saves setup time. No, the prompt specifically asks for a lobbying round with teams arguing for A or B. I will keep it but keep it snappy (5 mins prep, 10 mins pitch).

      *Wait, one detail in the prompt:* "Round 3... give them the same two tables three times with three different backstorys... They have to say, for each backstory, which comparison answers the question."
      *Okay, I need to make sure Round 3 is distinct from Lobbying.*
      *Revised Flow:*
      1. Round 1 (Aggregate)
      2. Round 2 (Split)
      3. Round 3 (Three Scenarios - Small Groups)
      4. Lobbying (Teams A vs B - Whole Class)
      5. Debrief.
      *Time Check:* 5 + 10 + 15 + 25 + 20 + 15 = 90. It's tight. I will advise the instructor to be ruthless with timekeeping.

      *Wait, checking the arithmetic again.*
      Treatment A: 18/20 mild (90%), 18/180 severe (10%). Total 36/200 (18%).
      Treatment B: 153/180 mild (85%), 1/20 severe (5%). Total 154/200 (77%).
      *Wait, the prompt says:* "Treatment A: 18 of 20 mild cases recover, and 18 of 180 severe cases recover."
      *Wait, the prompt says:* "Treatment B: 153 of 180 mild cases recover, and 1 of 20 severe cases recover."
      *Wait, the prompt says:* "A wins in each group (90% vs 85%, and 10% vs 5%)"
      *Wait, the prompt says:* "but loses overall (18% vs 77%)"
      *Okay, the arithmetic is consistent.*
      *Wait, is it realistic?* Treatment B is amazing for mild cases (85%) but terrible for severe (5%). Treatment A is great for mild (90%) and slightly less terrible for severe (10%).
      *Why would anyone give Treatment B to severe cases if it's so bad?* Maybe they didn't know severity beforehand. That fits Story 1 (Severity recorded *after* assignment or unknown).
      *Why would Treatment A get mostly severe cases?* Maybe it's the "rescue" drug for sick people.
      *Okay, the narrative holds together.*

      *Let's write the plan.*

      *One more thing:* The prompt asks: "which feature of the idea the activity can't reproduce so I have to supply it myself in the debrief."
      *Answer:* The formal causal graph (DAG). Students can feel the logic, but they won't naturally draw nodes and arrows distinguishing confounders from colliders without explicit instruction. Also, the mathematical proof that $P(A|B) \neq P(A|B,C)$ etc. is abstract; the activity provides the intuition, not the formalism.

      *Let's finalize the "What goes wrong" section.*
      *Common pushback:* "Just look at the sample size." "The severe group for B is too small (20) to trust."
      *Counter:* "Assume these numbers are from a study of 20,000 people scaled down. The proportions hold."
      *Common pushback:* "Treatment B is clearly better for mild, which is most people."
      *Counter:* "If you are severe, which do you want?" (Highlights the individual vs. population tension).

      *Okay, ready to draft.*
answer: |-
  This is a high-leverage activity. It works because it weaponizes the students' own intuition against them. The 90-minute block is tight, so you must be a ruthless timekeeper.

  Here is the session design, materials, and facilitation guide.

  ### Session Overview
  *   **Time:** 90 Minutes
  *   **Room Setup:** Clusters of tables (4-5 students per table). You need to move between groups easily.
  *   **Materials:**
      *   **Handout 1:** "The Headline" (Aggregate data only).
      *   **Handout 2:** "The Breakdown" (Disaggregated data).
      *   **Handout 3:** "The Context" (Three backstories).
      *   **Voting Cards:** Two colors (e.g., Blue for Treatment A, Red for Treatment B).
      *   **Whiteboard/Projector:** For tallying votes and drawing the final causal diagrams.
      *   **Fake Currency:** (Optional, for the lobbying round).

  ---

  ### Part 1: The Trap (20 Minutes)

  **0:00 – 0:05 | Introduction**
  *   **Say:** "You are a panel of medical advisors. A pharmaceutical company has two drugs for a serious condition. They want to know which one we should recommend for the general population. You have the data from the clinical trials. Your goal is to save lives. You will vote on which treatment to approve."
  *   **Distribute:** Handout 1 (Aggregate Data Only).
  *   **Constraint:** Do not mention subgroups. Do not mention severity. Do not mention sample sizes beyond what is on the page.

  > **Handout 1 Content:**
  > **Clinical Trial Results (Total Population)**
  > *   **Treatment A:** 200 Patients. 36 Recovered. (18% Recovery Rate)
  > *   **Treatment B:** 200 Patients. 154 Recovered. (77% Recovery Rate)
  > *   **Question:** Which treatment do you recommend for approval?

  **0:05 – 0:10 | Round 1 Vote**
  *   Have students vote privately on paper first (commitment), then hold up cards publicly.
  *   **Tally:** Write the counts on the board.
  *   **Expected Result:** Almost everyone votes **Treatment B**. The difference (18% vs 77%) is massive.
  *   **Say:** "The data seems clear. Treatment B is the winner. Keep your votes visible."

  **0:10 – 0:20 | The Reveal**
  *   **Distribute:** Handout 2 (Disaggregated Data).
  *   **Say:** "The researchers just sent an addendum. They realized patient severity matters. Here is the same data, split by condition severity."
  *   **Task:** "Look at the numbers. Do not talk yet. Just look. Then, vote again."

  > **Handout 2 Content:**
  > **Clinical Trial Results (By Severity)**
  > **Mild Cases:**
  > *   **Treatment A:** 20 Patients. 18 Recovered. (90%)
  > *   **Treatment B:** 180 Patients. 153 Recovered. (85%)
  >
  > **Severe Cases:**
  > *   **Treatment A:** 180 Patients. 18 Recovered. (10%)
  > *   **Treatment B:** 20 Patients. 1 Recovered. (5%)
  >
  > **Question:** Which treatment is more effective?

  **0:20 – 0:25 | Round 2 Vote & Tension**
  *   **Vote:** Have them vote again.
  *   **Result:** Most will flip to **Treatment A** (it wins in both subgroups).
  *   **Facilitation:** Ask a student who flipped: "Why did you change?" Ask a student who didn't: "Why did you stay?"
  *   **The Feeling:** Let them feel the irritation. The math hasn't changed, but the answer did.
  *   **Say:** "Arithmetically, both tables are correct. Treatment A is better for mild. Treatment A is better for severe. Treatment B is better overall. How is this possible? Take 5 minutes at your tables to figure out where the 'truth' is."

  ---

  ### Part 2: The Causal Turn (35 Minutes)

  **0:25 – 0:40 | Round 3: The Three Stories**
  *   **Distribute:** Handout 3.
  *   **Say:** "Statistics describes *what* happened. Causality explains *why*. The numbers are fixed. The story changes. In your groups, read the three scenarios. For each one, decide: Do we look at the **Total** table or the **Split** table to decide which drug is better? Why?"

  > **Handout 3 Content:**
  > **Scenario 1: The Triage**
  > Severity was assessed by a clinician *before* treatment assignment. Doctors tended to give Treatment A to Severe patients because it was known to be stronger, and Treatment B to Mild patients.
  >
  > **Scenario 2: The Reaction**
  > Severity was assessed on *Day 3*, after treatment started. Treatment A causes high inflammation (labeled 'Severe') as a side effect, even in patients who eventually recover. Treatment B does not cause inflammation.
  >
  > **Scenario 3: The Hidden Frailty**
  > Severity is influenced by a hidden genetic frailty factor. This frailty makes recovery harder *and* makes patients more likely to be assigned Treatment A (doctors sense they are sicker). Treatment does not influence severity; severity influences assignment and outcome.

  *   **Debrief Round 3:** Go through scenarios quickly.
      *   *Scenario 1 (Confounder):* **Split.** Severity caused the assignment. We must compare like-with-like.
      *   *Scenario 2 (Mediator):* **Total.** Treatment *caused* the "Severe" label. Splitting hides the fact that A causes inflammation but still cures.
      *   *Scenario 3 (Confounder):* **Split.** Frailty is a common cause. We need to control for severity to isolate the drug effect.
  *   **Key Point:** "The right table depends on the arrow of time and cause, not the size of the numbers."

  **0:40 – 1:00 | The Lobbying Round**
  *   **Setup:** Split the room. Left side = Team A (Pro Treatment A). Right side = Team B (Pro Treatment B).
  *   **Role:** You (or a brave student) are the **Regulator**.
  *   **Task:** Teams have 5 minutes to prepare a 2-minute pitch. They must use the data to argue their drug is better.
  *   **The Kicker:** After the pitches, ask the teams: "Based on Scenario 2 (The Reaction), was the losing team's pitch *dishonest*?"
  *   **Goal:** This makes them feel that presenting a statistically true table can be ethically wrong if the causal story doesn't match.
  *   **Regulator Ruling:** Award points to the team that best aligns their data presentation with the *current* backstory you whisper to the regulator (change the backstory between pitches to confuse them, or stick to one for clarity). *Recommendation: Stick to Scenario 1 for fairness, then ask the "dishonesty" question hypothetically.*

  ---

  ### Part 3: The Debrief (25 Minutes)

  **1:00 – 1:15 | Naming the Beast**
  *   **Say:** "What you just experienced has a name: **Simpson's Paradox**."
  *   **Write on Board:** Draw the three Causal Diagrams (DAGs).
      1.  **Confounder:** Severity $\rightarrow$ Treatment AND Severity $\rightarrow$ Recovery. (Solution: Condition on Severity).
      2.  **Mediator:** Treatment $\rightarrow$ Severity $\rightarrow$ Recovery. (Solution: Do NOT condition on Severity).
      3.  **Collider:** Treatment $\rightarrow$ Severity $\leftarrow$ Frailty. (Solution: Do NOT condition on Severity).
  *   **Explain:** "In Round 1, you saw the Total. In Round 2, you saw the Split. In Round 3, you realized neither is 'right' without the arrows."

  **1:15 – 1:25 | Addressing the Pitfalls**
  *   **Address "Bigger Data is Better":** "Someone probably thought the Total table is better because $N=200$ is bigger than $N=20$. In statistics, precision matters. In causality, *bias* matters. A precise wrong answer is worse than a rough right one."
  *   **Address "It's a Trick":** "This isn't a math error. It's a weighting issue. Treatment B looked good overall because it was 'weighted' with easy cases. Treatment A looked bad overall because it was 'weighted' with hard cases."
  *   **Address "Just Randomize":** "If we randomized perfectly, Severity would be balanced, and the Total table would match the Split table. But we often don't have randomized data. We have hospital records. In hospital records, Simpson's Paradox is everywhere."

  **1:25 – 1:30 | Final Takeaway**
  *   **Say:** "You cannot reason about evidence using numbers alone. You need a story about how the world works. Without a causal model, data is just a Rorschach test. You can find whatever pattern you want if you slice it enough. Your job isn't to calculate; it's to ask: *What produced this table?*"

  ---

  ### Facilitation Guide: What Will Go Wrong

  **1. The "Sample Size" Objection**
  *   **What happens:** A student will say, "In the Severe group, Treatment B only had 20 people. That's not significant. We should trust the Total."
  *   **Why:** They are thinking like statisticians (variance), not causal reasoners (bias).
  *   **Fix:** Acknowledge it. "In a real trial, yes, we'd want more power. But for this exercise, assume these proportions are the *true* rates. If you are a Severe patient, do you want the 5% chance or the 10% chance? Don't hide behind the N."

  **2. The "It's a Trick" Accusation**
  *   **What happens:** Students feel manipulated. "You hid the severity on purpose."
  *   **Why:** Because you did. It feels like a gotcha.
  *   **Fix:** Lean into it. "Yes. In the real world, the severity data is often hidden in a different spreadsheet, or not collected at all. The 'trick' is how observational data is often presented in news headlines. I wanted you to feel the frustration of the headline reader."

  **3. Round 3 Confusion (Mediators vs. Confounders)**
  *   **What happens:** They can't distinguish Story 2 from Story 3.
  *   **Why:** Causal direction is cognitively difficult.
  *   **Fix:** Use hand gestures. For Story 1: Point from Severity to Treatment ("Doctors decided based on severity"). For Story 2: Point from Treatment to Severity ("The drug caused the symptom"). Keep it physical.

  **4. Time Creep**
  *   **What happens:** The Lobbying Round eats 20 minutes and you run out of time for the Debrief.
  *   **Why:** Students love arguing.
  *   **Fix:** If you are at 1:00 PM and haven't started Debrief, **cut the Lobbying Round.** Move straight to the Debrief. The "felt problem" happens in Rounds 1 and 2. The Lobbying is just fun; the Debrief is the learning.

  ### What This Activity Cannot Reproduce (For Your Debrief)

  You must supply these two concepts verbally, as the activity creates the intuition but not the formalism:

  1.  **The Mathematical Identity:** The activity shows the reversal, but it doesn't show *why* it's arithmetically inevitable given the weights. You need to explicitly write out the weighted average formula on the board during debrief to show that $Total \neq Average of Subgroups$ when group sizes differ.
  2.  **The "Collider" Nuance:** Story 3 (Hidden Frailty/Severity) is technically a confounding structure if Frailty causes Severity and Assignment. If Severity is a *collider* (Treatment $\rightarrow$ Severity $\leftarrow$ Frailty), conditioning on it *creates* bias. This is subtle. In the activity, students will likely treat Story 3 the same as Story 1. You need to clarify in the debrief that "controlling for a variable" is dangerous if that variable is an effect of two other things (a collider), even if the numbers look the same.

  ### Materials to Print

  **Handout 1 (Card Stock, 20 copies)**
  > **MEDICAL ADVISORY BOARD: VOTE 1**
  >
  > **Treatment A:** 18% Recovery (36/200)
  > **Treatment B:** 77% Recovery (154/200)
  >
  > **CIRCLE YOUR CHOICE:**
  > [ TREATMENT A ]   [ TREATMENT B ]

  **Handout 2 (Card Stock, 20 copies)**
  > **MEDICAL ADVISORY BOARD: VOTE 2**
  >
  > **Mild Cases**
  > Treatment A: 90% (18/20)
  > Treatment B: 85% (153/180)
  >
  > **Severe Cases**
  > Treatment A: 10% (18/180)
  > Treatment B: 5% (1/20)
  >
  > **CIRCLE YOUR CHOICE:**
  > [ TREATMENT A ]   [ TREATMENT B ]

  **Handout 3 (Paper, 1 per table)**
  > **THE CONTEXT SCENARIOS**
  > *(Text as detailed in Round 3 above)*
