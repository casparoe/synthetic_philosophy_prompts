answer: |-
  ## The Decision Procedure: "Belief-State Classifier v1.0"

  This procedure is designed for build-time execution against user personas and scenario snapshots. It prioritizes safety (avoiding patronizing behavior) over completeness (avoiding silent failures).

  **Inputs:**
  *   $P$: The target proposition (e.g., "Arrive before 5").
  *   $B$: The user's explicit belief set (list of asserted propositions).
  *   $U$: The user profile (role, tenure, known concept tags).
  *   $K$: Knowledge Base (domain ontology, definitions, rules).

  **Policy Knobs (Set by Product Owner, not Engineering):**
  *   `MAX_INFERENCE_DEPTH`: Integer (Default: 2). The maximum number of logical steps allowed for "Would Grant."
  *   `CONCEPT_THRESHOLD`: Float (Default: 0.8). The minimum familiarity score required to treat a concept as "known."
  *   `TAUTOLOGY_POLICY`: Enum (`IGNORE`, `GRANT`). Whether to surface logical truths.

  ---

  ### Step 1: Explicit Endorsement Check
  **Test:** Is $P$ (or a semantically equivalent string) present in $B$?
  *   **Match:** Return **HOLDS**. Stop.
  *   **No Match:** Proceed to Step 2.

  ### Step 2: Consistency Check (The "Explosion" Guard)
  **Test:** Does $B$ contain a direct contradiction (e.g., $Q$ and $\neg Q$, or $Q$ and $R$ where $Q \land R \to \bot$ per $K$)?
  *   **Inconsistent:** **ESCALATE TO DOMAIN EXPERT.**
      *   *Reason:* Classical logic dictates everything follows from a contradiction. We cannot bucket consequences of a broken belief state without risking nonsense. The belief state itself needs repair before we assess knowledge of $P$.
  *   **Consistent:** Proceed to Step 3.

  ### Step 3: Tautology & Validity Check
  **Test:** Is $P$ logically valid independent of $B$ (e.g., $A \to A$)?
  *   **Yes:** Check `TAUTOLOGY_POLICY`.
      *   If `IGNORE`: Return **MERELY FOLLOWS** (Do not surface).
      *   If `GRANT`: Return **WOULD GRANT**.
  *   **No:** Proceed to Step 4.

  ### Step 4: Bounded Derivation Test
  **Test:** Run a forward-chaining reasoner from $B$ using $K$. Stop if proof depth exceeds `MAX_INFERENCE_DEPTH`.
  *   **Proof Found (Depth $\le$ Limit):** Proceed to Step 5 (Concept Check).
  *   **Proof Found (Depth $>$ Limit):** Return **MERELY FOLLOWS**. Stop.
  *   **No Proof Found:** Proceed to Step 5 (Concept Check) *if* semantic similarity suggests a link; otherwise Return **MERELY FOLLOWS**.
      *   *Note:* This step assumes that if the reasoner can't find it quickly, the user won't either.

  ### Step 5: Concept Familiarity Check
  **Test:** Extract all predicates/terms in $P$ and the derivation path. Compare against $U$'s known concept tags. Calculate Familiarity Score ($0.0$ to $1.0$).
  *   **Score $\ge$ `CONCEPT_THRESHOLD`:** Return **WOULD GRANT**.
      *   *Judgment Call:* This assumes tenure/role correlates perfectly with concept knowledge.
  *   **Score $<$ `CONCEPT_THRESHOLD` BUT $> 0.0$:** Return **COULD REACH**.
      *   *Implication:* User has the logic but lacks the vocabulary/definition. Assistant should offer definition, not just inference.
  *   **Score $\approx 0.0$:** Return **MERELY FOLLOWS**.
      *   *Implication:* User lacks the conceptual tools. Inference is impossible for them without significant training.

  ### Step 6: Default Fallback
  **Test:** If previous steps are inconclusive (e.g., reasoner timeout, ambiguous concepts).
  *   **Action:** **ESCALATE TO PRODUCT OWNER.**
      *   *Reason:* This is a policy decision on risk. Do we assume they know it (risk confusion) or assume they don't (risk patronizing)?

  ---

  ## Test Runs

  Here is the classification for your four cases using default knobs (`MAX_INFERENCE_DEPTH` = 2, `TAUTOLOGY_POLICY` = `GRANT`).

  ### (a) Office closes 5, Meeting 4:30 $\to$ Arrive before 5.
  *   **Step 1:** Not explicitly held.
  *   **Step 2:** Consistent.
  *   **Step 3:** Not a tautology.
  *   **Step 4:** Derivation found.
      *   $Meeting(4:30) \land Location(Office) \to InOffice(4:30)$.
      *   $InOffice(4:30) \land Closes(5:00) \to ArriveBefore(5:00)$.
      *   Depth: 2 steps. (Passes Limit).
  *   **Step 5:** Concepts (Time, Location, Office Hours) match standard user profile. Score: 1.0.
  *   **Result:** **WOULD GRANT**.
  *   **Confidence:** High (95%). The inference is trivial and concepts are universal.

  ### (b) Meetings on Tuesdays + This Meeting Wednesday $\to$ Office is on fire.
  *   **Step 1:** Not held.
  *   **Step 2:** **Inconsistent.** ($AllMeetings(Tuesday) \land ThisMeeting(Wednesday)$).
  *   **Action:** **ESCALATE TO DOMAIN EXPERT.**
  *   **Forced Bucket:** If forced to ignore Step 2 and proceed: **MERELY FOLLOWS**.
      *   *Reason:* It follows via *ex falso quodlibet* (explosion), but derivation depth is irrelevant.
  *   **Confidence:** High (100% on Escalation). Low (on Bucket).
  *   **Note:** This case breaks the bucketing system. Classifying it as *Merely Follows* is logically true but product-toxic.

  ### (c) Reports reviewed by Legal + This is a Report $\to$ Reviewed by Legal. (New Hire).
  *   **Step 1:** Not held.
  *   **Step 2:** Consistent.
  *   **Step 3:** Not a tautology.
  *   **Step 4:** Derivation found. Modus Ponens. Depth: 1 step. (Passes Limit).
  *   **Step 5:** Concept Check.
