  **The Scenario**
  The government proposes the "Automation Dividend Reform," replacing all low-wage labor subsidies with a high universal cash transfer funded by a tax on capital and human labor. Under the status quo, the worst-off group consists of unskilled service workers earning $25,000 annually, embedded in stable workplace communities that confer the social standing of "contributing citizens." Under the reform, low-skill jobs are eliminated by automation incentives; the new worst-off group consists of the "structurally redundant," who receive $35,000 annually from the dividend but are excluded from the labor force, lacking institutional roles that publicly affirm their status as cooperating members of society. The reform raises the income of the bottom quintile but dissolves the social institutions that typically generate the social bases of self-respect for that specific class, creating a new social position defined by economic security but civic stigma.

  ***

  **(a) The Difference Principle (Index = Income and Wealth)**
  If the index of primary goods is operationalized strictly as income and wealth—the standard metric in most welfare economics and policy applications—the Difference Principle mandates accepting the reform. The representative member of the worst-off group under the reform ($35,000) has a higher expectation of economic resources than the representative member of the worst-off group under the status quo ($25,000). Since the principle requires maximizing the long-term expectation of the least advantaged, and the metric is monetary, the policy passes.

  **(b) The Difference Principle (Index = Rawlsian Primary Goods)**
  If the index includes the *social bases of self-respect* with the weight Rawls assigns them (lexical priority over economic gains once a threshold is met), the Difference Principle rejects the reform. Rawls identifies self-respect as "perhaps the most important primary good." The reform trades a marginal increase in wealth for a substantial loss in the public recognition of one's status as a full cooperating member of society. Because the new worst-off group (the redundant) suffers a deficit in the most important primary good relative to the old worst-off group (the workers), the reform fails to maximize the index of the least advantaged.

  **(c) The Parties in the Original Position (Choosing the Index)**
  The parties behind the veil would reject the reform, but their reasoning precedes the policy evaluation: they would refuse to adopt an index that prioritizes income over the social bases of self-respect. Knowing they represent free and equal moral persons, they recognize that without the social bases of self-respect, they cannot effectively pursue any conception of the good. They would therefore institutionalize an index weighting that protects the structural conditions for civic standing, leading them to veto any policy that creates a class of "paid but redundant" citizens, regardless of the income floor.

  ***

  **Analysis of the Divergence**

  **The Single Feature Doing the Work**
  The feature driving the tension is the **endogeneity of the worst-off group's social meaning**. It is not merely that the class structure changes, but that the policy *constitutes* the nature of the bottom position. In the status quo, the worst-off are "workers"; in the reform, they are "recipients." Because the primary good of self-respect is not an internal psychological state but a *public institutional status*, the policy itself determines the availability of that good. If you remove this feature—i.e., if the social meaning of the bottom position remained fixed as "contributing workers" regardless of the policy—the trade-off would be simple (income vs. leisure), and the income gain would likely dominate once basic needs are met. The divergence arises because the reform changes *what it means* to be at the bottom, altering the very goods available to be maximized.

  **The Best Rawlsian Reply**
  The strongest Rawlsian reply is that **the Difference Principle and the Veil of Ignorance do not actually come apart** in a consistent theoretical framework. The Difference Principle is not a freestanding welfare function to be applied with arbitrary metrics; it is the *output* of the deliberation in the Original Position. The parties behind the veil *define* the index of primary goods before they evaluate specific policies. Therefore, if the parties would reject the reform (because they prioritize self-respect), the Difference Principle *properly understood* also rejects the reform. The apparent divergence exists only if one treats the Difference Principle as a bureaucratic rule for income redistribution detached from its justificatory ground in the Original Position.

  **The Blocking Constraint**
  Under your constraints, they **cannot truly come apart**. The constraint doing the blocking is **Constraint (2) combined with the definition of Primary Goods**. Rawls explicitly defines the "worst-off" not by income alone, but by their share of the *index of primary goods*, which includes the social bases of self-respect. If you adhere strictly to Rawls's definitions, the Difference Principle *must* align with the Veil's choice of index. To generate a genuine divergence where the DP says "Take" and the Veil says "Reject," you would have to violate the internal logic of Rawls's theory by applying the DP with a utilitarian index (income) while expecting the Veil to use a Rawlsian index (moral personality). For your chapter, the critical insight is not that the Veil and DP conflict, but that the Veil is doing the work of **fixing the metric** so that the DP cannot be co-opted by income-maximization. The independence of the Veil lies in its power to constitute the good, not to contradict the principle derived from it.
