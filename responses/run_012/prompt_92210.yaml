prompt: |-
  I'm working up a paper on the ethics of panpsychism and I keep getting stuck before I even start, so I want the spec written out first. Assume experience (or proto-experience, pick whichever version of panpsychism you think is most defensible, and say if the choice matters for the ethics) is fundamental and spread through the physical world. Give me the desiderata any theory of moral status has to meet against that backdrop -- the cases it has to get right, the distinctions it can't collapse, the constraints it can't violate, with the consideration behind each. Two things I specifically need worked out. First, the combination problem seems to have an ethical twin: if there are micro-experiences scattered everywhere, what makes some bundle of them add up to one subject that can be harmed? Don't just tell me "wherever there's an organism" -- tell me what would justify drawing the line there rather than somewhere else in the physics, and whether that line is doing real work or just smuggling in our intuitions about animals. Second, whether suffering in this picture can be summed across a system, or whether only unified subjects count at all, and what that does to a straightforward sentientist calculus. Flag any pair of desiderata you suspect can't be jointly satisfied -- that's the part I most want. Then briefly score a utilitarian view, a rights view, and some holistic or biocentric view against the list. Skip citations, I'll fill those in myself.
