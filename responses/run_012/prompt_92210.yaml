  2.  **Deconstruct the Core Challenge:**
      *   Panpsychism posits that *everything* has some form of experience (or proto-experience).
      *   Traditional ethics relies on distinguishing beings that matter (sentient beings) from those that don't (rocks, atoms).
      *   If everything matters, ethics becomes paralyzing (the "overdemandingness" or "clutter" problem).
      *   The "Combination Problem" (how micro-experiences make macro-experiences) has an ethical analog: Where does moral patienthood reside? In the electron? The atom? The rock? The human?
      *   Aggregation: If I crush a rock, do I harm $10^{23}$ micro-subjects? Or just one macro-subject (if the rock is one)? Or none (if rocks don't combine)?

  3.  **Drafting the Desiderata (The "Spec"):**
      *   *Desideratum 1: Non-Triviality.* The theory shouldn't make action impossible. If stepping on grass is murder, the theory is practically useless.
      *   *Desideratum 2: Phenomenal Continuity.* It must respect the physics. If experience is fundamental, we can't just arbitrarily say "brains have it, rocks don't" without a physical correlate.
      *   *Desideratum 3: Moral Significance Gradient.* Not all experiences are equal. A human's pain should matter more than an electron's "proto-pain."
      *   *Desideratum 4: Subject Unity.* Harm happens *to* someone. We need to identify the "someone."
      *   *Desideratum 5: Causal Relevance.* The moral status should track the capacity to be affected by actions.

  4.  **Addressing the Specific Questions:**

      *   *The Ethical Combination Problem:*
          *   Problem: Why is *this* bundle (a dog) a subject, but *that* bundle (a pile of sand) not?
          *   Potential Solution: Integrated Information or Causal Interdependence. The line must be drawn where information/experience is integrated, not just aggregated.
          *   Justification: It's not just "our intuition about animals." It's about the *structure* of experience. A rock's particles don't talk to each other; a brain's do.
          *   Does it smuggle intuition? Risky. Need to ensure the physical criterion (integration) is independent of the moral conclusion.

      *   *Aggregation of Suffering:*
          *   Option A: Summation. $10^{23}$ electrons suffering = huge disvalue. (Leads to absurdity).
          *   Option B: Subject-Relative. Only unified subjects count. (Solves absurdity, but risks ignoring the micro-level entirely).
          *   Impact on Sentientism: Breaks the simple "sum of pleasure minus pain" calculus. Needs a weighting function based on complexity/integration.

  5.  **Identifying Incompatible Desiderata (The "Hard Trade-offs"):**
      *   *Fundamentalism vs. Non-Triviality.* If experience is truly fundamental to *all* matter, and all experience has *some* moral weight, action is impossible. You have to deny weight to the micro-level to save the theory.
      *   *Physical Continuity vs. Moral Discontinuity.* Physics is continuous; moral status usually feels discontinuous (you are a person, a rock is not). Bridging this without arbitrariness is hard.

  6.  **Scoring the Ethical Frameworks:**
      *   *Utilitarianism:* Struggles with aggregation. If micro-experiences count, the math breaks. If they don't, it violates the panpsychist premise.
      *   *Rights View:* Needs clear subjects. Panpsychism blurs subject boundaries. Hard to assign rights to electrons.
      *   *Holistic/Biocentric:* Fits better. Can value systems as wholes. But might undervalue individual suffering within the system.

