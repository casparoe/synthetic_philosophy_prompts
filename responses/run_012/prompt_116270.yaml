          *   Refute Cheapness (Claim 2): Low absolute cost is fine if the differential exists.
      *   *Section 2: The Actual Requirement (The Core Correction).*
          *   Correct the "cannot afford" misconception. It's about *incentive compatibility*, not budget constraints.
          *   Introduce the **Single Crossing Property** (Marginal Cost differs).
