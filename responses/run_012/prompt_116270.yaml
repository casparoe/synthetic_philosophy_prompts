      *   *Did I explain Case 2 correctly?* If production cost is identical, but punishment is applied only to low types, the *expected cost* becomes differential. This preserves the logic of signaling theory but broadens "cost" beyond "production handicap." The user's error was thinking the *production* cost itself must be the handicap.
