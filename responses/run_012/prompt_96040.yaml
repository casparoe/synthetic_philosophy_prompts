          *   Argument: Causal closure of the physical doesn't eliminate the reality of higher-level patterns.
          *   Verdict 2: Physical is ontologically privileged (causal basis), but Intentional/Design patterns are equally real (projectible).
      *   **Section 4: What Hangs on the Verdict.**
