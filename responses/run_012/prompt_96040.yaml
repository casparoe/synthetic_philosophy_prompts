      *   *Claim 2:* The patterns of the Design and Intentional stances are *as real as* physical patterns in terms of projectibility, but the Physical stance retains *ontological privilege* regarding causal closure. Reality is not monolithic; it is stratified.
      *   *Commitment:* I will defend a "Robust Realism about Abstracta." The patterns are mind-independent features of the world's complexity, even if their *detection* is mind-dependent. The Physical stance is causally privileged, but not explanatorily supreme.

  6.  **Drafting - Section by Section:**

      *   **Introduction:** Introduce Dennett's framework. State the classmate's objection (Parochial-Enumeration). State the thesis (Principled taxonomy + Stratified Reality).
