          4.  Commit to a position (no fence-sitting).
          5.  Discuss stakes: Folk psychology, special sciences, levels of description.
      *   **Format:** Seminar paper essay.
      *   **Tone:** Philosophical, rigorous, argumentative.

  2.  **Deconstruct Dennett's Position:**
      *   *Real Patterns:* Dennett argues patterns are real if they support prediction better than the noise floor (compressibility). "Real" doesn't mean "made of fundamental stuff," it means "projectible."
      *   *The Three Stances:*
          *   Physical: Laws of physics, constitution.
          *   Design: Function, purpose (evolutionary or engineered).
          *   Intentional: Beliefs, desires, rationality.
      *   *Relationship:* The Physical is ontologically fundamental (causal machinery), but the others are epistemologically indispensable and pick out *real* patterns, not just fictions.

  3.  **Address the "Parochial-Enumeration Problem":**
      *   *Objection:* If compressibility defines reality, why stop at three? Why not "hydrological stance"?
      *   *Counter-argument:* Dennett isn't listing *every* possible stance. The three stances are *strategies* for prediction, not specific domains. The "Design Stance" covers hydrology, epidemiology, etc., insofar as they treat systems as functional. The "Intentional Stance" is a specific subset of the Design Stance (where the function is rationality).
      *   *Verdict:* The taxonomy is principled, not parochial, but it needs clarification. It's a hierarchy of abstraction, not a list of scientific disciplines.

  4.  **Address the "Incompatible Design/Intentional Case":**
