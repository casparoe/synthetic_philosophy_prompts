  You receive two items, both explicitly given to you as gifts with no strings attached: a hand-knitted scarf and a box of chocolates. In the first situation, you decide to keep the scarf in your closet rather than giving it away to someone else who might use it, and you cite the fact that *it is a gift* as your reason for keeping it; the gift-status makes retaining it a gesture of respect. In the second situation, you decide to eat the chocolates rather than saving them indefinitely or passing them on, and you cite the fact that *it is a gift* as your reason for not keeping them; the gift-status makes consuming them a gesture of acceptance. The physical act of "retaining possession" is what you do with the scarf and refrain from doing with the chocolates. The only difference between the situations is the type of object (scarf versus chocolates), a descriptive fact about durability and intended use that is not itself a moral principle, and the consequences of retaining versus consuming are held constant in terms of overall utility (both bring similar joy).

  **1. Feature, Background, and Switch**
  The feature is the normative status of the object: "It is a gift." The background condition is the physical nature of the object (durable textile versus perishable food). The switch works because the feature "gift" generates a reason to *retain* possession in the context of the scarf, but generates a reason to *relinquish* possession (by consuming) in the context of the chocolates. In both cases, the agent appeals to the gift-status itself as the justification for the differing actions.

  **2. Particularist vs. Generalist**
  A moral particularist would argue that this case demonstrates holism: the moral valence of "being a gift" is not fixed but depends on the context. It counts in favor of retention here and against retention there, without any change in the meaning of "gift." A moral generalist would attempt to formulate a universal principle to capture both verdicts, such as: "One should retain possession of a gift if it is durable, and relinquish possession of a gift if it is perishable." However, this principle risks being uninformative; it merely restates the physical circumstances of the case in the antecedent. It does not explain *why* durability interacts with gift-status to produce these reasons, it only codifies the observation. If the principle must list every relevant contextual detail (scarf vs. chocolate, durable vs. perishable) to yield the correct verdict, it loses the predictive and explanatory power generalism seeks.

  **3. Feature Doing the Real Work**
  The feature doing the real work is the interaction between the normative status ("gift") and the physical context ("perishable vs. durable"). However, since the prompt requires the *feature* to be the reason, the feature "gift" is doing the work, but its *direction* is determined by the context. The context acts as a valence switch for the feature itself.

  **4. Removing or Altering the Feature**
  If the feature "it is a gift" is removed (e.g., you bought the items yourself), the valence switch collapses. You would keep the scarf because you like it and eat the chocolates because you like them; the specific moral pressure of "respecting the giver" or "accepting the offering" vanishes. The case becomes a standard prudential decision about object management, which is generalist-friendly (principles of utility or preference). The valence switch survives only when the moral feature "gift" is present, confirming that the context-dependence is specific to the moral reason, not just physical management.

  **5. Generalist Attack and Success**
  A defender of generalism would attack the case by arguing that the "physical nature of the object" is not a morally inert background condition but a morally relevant feature that must be included in the principle. They would claim the true feature is not "it is a gift" but "it is a perishable gift" versus "it is a durable gift." If this is accepted, the valence does not switch; there are simply two different features with fixed valences. This attack succeeds only if one accepts that "perishable gift" is a unified moral kind. The particularist would counter that "perishable" is a natural fact, not a moral one, and that merging them into a single feature is an ad hoc maneuver to save the principle from counter-example. The attack partially succeeds in showing that generalists can always expand their principles, but fails to show that such expanded principles are genuinely explanatory rather than descriptive catalogs.

  **6. What the Case Shows**
  This case shows that moral reasons can be context-dependent in a way that resists simple codification without trivializing the principle. It demonstrates that a single moral feature ("gift") can provide opposing reasons depending on non-moral circumstances ("perishability"). It does not show that moral principles are impossible, but rather that they must be so complex and context-laden that they resemble particularist judgments more than abstract rules. It challenges the generalist to explain how a principle can be both universal and informative without simply listing every possible contextual variation.
