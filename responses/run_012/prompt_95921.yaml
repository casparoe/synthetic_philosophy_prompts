answer: |-
  Here is the draft material. I've treated the Perturbation Principle as a functionalist-causal criterion, which is where its real philosophical teeth (and gums) are.

  ### Expert Brainstorming: Failure Modes
  Before writing the question, here is where this principle bleeds. A strong student needs to spot that "respond as a single unit" is the load-bearing wall. If "unit" means "object," the analysis is circular. If "unit" means "spatiotemporal continuity," it's too broad. The "sum of responses" clause is also tricky: to know how parts would respond *on their own*, we have to imagine them not composing anything, which presupposes we know when composition *doesn't* occur. The "salience" clause is the emergency exit: if salience is interest-relative, composition becomes mind-dependent (bad for realists); if objective, gravity perturbs everything jointly (Universalism). Finally, the Statue/Lump case is the kill shot: they share all physical perturbations. If the principle says they both exist, it doesn't solve coincidence; if it says only one exists, it can't explain why based on perturbation alone.

  ***

  ### 1. The Exam Question

  **Question 4: The Perturbation Principle**

  Consider the following proposal regarding the Special Composition Question:

  > **The Perturbation Principle:** Some things compose a further thing just in case there is some *salient* way of perturbing them under which they respond as a *single unit*—i.e., a counterfactual in which their joint response isn't just the sum of the responses each would have had on its own.

  Evaluate this principle as an answer to the Special Composition Question. Do not simply categorize it alongside standard views (e.g., Universalism, Nihilism). Instead, apply the principle to the following four cases: (1) a heap of sand, (2) a wooden chair, (3) a living organism, and (4) a statue constituted by a lump of clay.

  In your analysis, you must address the following:
  1.  **Extension:** Does the principle yield the correct verdicts for these cases? If not, how must "salient" or "single unit" be adjusted to fix it?
  2.  **Circularity:** Does the phrase "respond as a single unit" presuppose the existence of the very object the principle is trying to ground?
  3.  **Collapse:** Does the principle collapse into Universalism (if "salient" is read broadly/physically) or Nihilism (if read narrowly/strictly)?
  4.  **Ontological Status:** Is this principle actually answering *when composition occurs*, or is it offering a rival criterion for *when we treat things as objects*?

  Conclude with a definitive verdict: Is the Perturbation Principle a viable metaphysical ground for composition? If you argue it is viable despite vagueness, specify the precisification required and defend its cost.

  ***

  ### 2. Model Answer (Top-Student Level)

  The Perturbation Principle offers a compelling causal criterion for composition, grounding objecthood in dynamic integration rather than static arrangement. Initially, it succeeds where intuitive cases demand it. An organism clearly satisfies the principle: perturb the skin, and the immune system responds jointly, not merely as a sum of isolated cells. A chair also passes: push the leg, and the seat moves. Without composition, the leg would slide away; the joint motion indicates a unity. However, the principle falters when pressed on ontology versus epistemology.

  The first major failure mode is the Statue and the Lump. Both the statue and the constituting lump share the exact same physical parts. If you perturb the clay (e.g., by squeezing), both the statue and the lump respond jointly. The principle cannot distinguish them. It might verify that *composition occurs* (the clay parts compose *something*), but it cannot determine whether they compose *one* thing or *two* coincident things. Since the Perturbation Principle relies on physical counterfactuals, and the physical counterfactuals are identical for both candidates, the principle is silent on coincidence. It fails to solve the Special Composition Question because it cannot adjudicate between competing candidates for the composed object.

  Secondly, the principle faces a dilemma regarding "salience." If salience is objective, gravity perturbs all matter jointly; the planets respond to solar gravity as a system. This pushes the view toward Universalism: everything composes something. If salience is interest-relative (salient to humans), then composition becomes mind-dependent. A heap of sand might compose an object when a gardener intends to sweep it (a salient perturbation), but not when scattered by the wind. This makes existence contingent on human interests, which is metaphysically costly. To avoid this, one might precisify "salient" as "causally significant interaction." But this is vague. To rescue it, we must precisify "single unit" as "bound by non-additive forces." Yet this risks circularity: a "non-additive force" often presupposes a binding structure that already constitutes an object. We are defining composition by reference to forces that only exist between composed parts.

  Furthermore, the "sum of responses" clause is problematic. To calculate how parts would respond *on their own*, we must imagine a world where they do not compose. But if composition is unrestricted (Universalism), there is no such world. If composition is restricted, we need a prior theory of composition to set the baseline for the counterfactual. Thus, the principle cannot be the *ground* of composition; it can only be a *test* for it. It presupposes the metaphysics it claims to explain.

  Ultimately, the Perturbation Principle is not an answer to the Special Composition Question, but a rival pragmatic criterion for object-conceptualization. It tells us when it is *useful* to treat parts as a whole, not when a whole *exists*. A viable precisification would require stripping "salience" of human interest and defining "single unit" via fundamental physical binding. However, this costs the principle its intuitive appeal regarding artifacts (chairs have no fundamental binding distinct from their parts). Therefore, the principle fails as a metaphysical ground. It collapses into Universalism under physical scrutiny or Nihilism under strict mereological scrutiny. It is a descriptive heuristic, not an ontological foundation.

  ***

  ### 3. Marking Scheme (Total 20 Marks)

  | Criterion | Marks | Common Pitfall / How Students Blow It |
  | :--- | :---: | :--- |
  | **Application to Cases** | 4 | Fails to apply the principle to all four required cases (Heap, Chair, Organism, Statue/Lump) or treats them as a list rather than integrating them into the argument. |
  | **The Circularity Objection** | 4 | Misses that "single unit" or "joint response" presupposes the existence of the object; treats the definition as unproblematically primitive. |
  | **The Salience Dilemma** | 4 | Does not identify the collapse risk: either "salient" is objective (leading to Universalism via gravity) or subjective (making composition mind-dependent). |
  | **Statue/Lump Distinction** | 3 | Claims the principle solves the coincidence problem; fails to see that physical perturbations are identical for both coincident objects. |
  | **SCQ vs. Rival Question** | 3 | Accepts the principle as an ontological answer without questioning whether it addresses *existence* or merely *conceptual utility/pragmatics*. |
  | **Vagueness & Precisification** | 2 | Lazy verdict ("it's just vague"); fails to propose a specific precisification (e.g., "fundamental binding") or defend the cost of adopting it. |

  ***

  ### Colleague-to-Colleague Note on Traps
  A couple of traps I built into the question you should be aware of when grading:

  1.  **The "Sum of Responses" Trap:** Students might try to calculate the "sum of responses" without realizing they need a baseline world where the parts *don't* compose. If they don't spot that this baseline requires a prior mereology, they miss the circularity point (Criterion 2).
  2.  **The "Salience" Escape:** Weak students will say "Salience solves it!" without defining *whose* salience. If they don't push on whether salience is mind-dependent, they miss the collapse objection (Criterion 3).
  3.  **The Coincidence Blindspot:** Many students treat the Statue/Lump case as just another "does it exist?" case. They need to realize the principle verifies composition for the *parts*, but can't count the *objects*. If they say "The principle says the clay composes the statue," they haven't thought about whether it *also* composes the lump simultaneously (Criterion 4).

  This should separate the students who have memorized the literature from those who can actually do metaphysics.
