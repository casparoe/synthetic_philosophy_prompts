prompt: |-
  I'm building the final exam for an upper-level metaphysics seminar on material objects and I need one essay question on the special composition question -- the van Inwagen thing, when do some things add up to a further thing. My problem is that every student in the room can recite the standard menu (universalism, nihilism, organicism, restrictivism, whatever) and then just sit there. So I want a question where they can't do that. I'm going to hand them a view they've never seen and make them actually test it.

  Here's the view I'm putting on the exam. Call it the perturbation principle: some things compose a further thing just in case there is some salient way of perturbing them under which they respond as a single unit -- i.e. a counterfactual in which their joint response isn't just the sum of the responses each would have had on its own. (I made this up on the drive in, so please don't worry about whether it's in the literature or hunt for who said it. I want it treated as a live proposal, not as a target to be identified.)

  What I need from you:

  First, act like an expert in contemporary metaphysics and mereology -- someone who knows the composition debate cold and also knows where clever-sounding principles quietly fall apart. Think carefully and, before you write anything, spend a few lines brainstorming the failure modes: what kinds of cases tend to break principles like this, what the usual cheap escape routes are, and which of them a good student should be able to spot and a weak one shouldn't.

  Then give me:

  1. The exam question itself, worded so it can't be answered by naming the standard positions or by a summary of the debate. It should make them commit to an extension for the perturbation principle and defend it.

  2. A model answer, around 700 words, at the level of the best student in the class.

  3. A marking scheme: five or six must-hit points, marks adding to 20, and for each point one line on how students typically blow it.

  Things I want the question to force them through, so build these into the question and the model answer: the heap of sand and the case of a chair; the statue and the lump of clay (and whether a perturbation principle can even distinguish them without cheating); a living organism and its cells, since that's the case organicism is built for; whether the principle is circular -- does "as a single unit" or "joint response" smuggle in the very notion of an object it's supposed to analyse; what happens when "salient" gets read narrowly versus broadly, and whether the principle then collapses into nihilism at one end or universalism at the other; and whether this is an answer to the special composition question at all or a rival question in disguise. I'd also like the model answer to resist the lazy "it's just vague" verdict -- if vagueness is the objection, say which precisification would rescue the principle and what that precisification costs elsewhere.

  No references, no reading list, no "see so-and-so" -- just the question, the answer, and the scheme. Keep the tone like a colleague handing me the draft, and flag anything you think is a trap in the question itself.
reasoning: |-
  Here's a thinking process that leads to the suggested output:

  1.  **Analyze the Request:**
      *   **Task:** Create a final exam essay question, a model answer, and a marking scheme for an upper-level metaphysics seminar.
      *   **Topic:** Special Composition Question (SCQ).
      *   **Specific Constraint:** The exam must feature a *novel* principle invented by the user ("The Perturbation Principle") to prevent students from regurgitating standard positions (Universalism, Nihilism, Organicism, etc.).
      *   **The Principle:** "Some things compose a further thing just in case there is some salient way of perturbing them under which they respond as a single unit -- i.e. a counterfactual in which their joint response isn't just the sum of the responses each would have had on its own."
      *   **Required Content:**
          1.  Brainstorming failure modes (expert perspective).
          2.  The Exam Question (forcing commitment/extension).
          3.  Model Answer (~700 words, top-student level).
          4.  Marking Scheme (5-6 points, total 20, common pitfalls).
      *   **Required Cases/Issues to Cover:** Heap of sand, Chair, Statue/Lump, Organism/Cells, Circularity ("single unit"), Salience (Nihilism/Universalism collapse), Is it really an answer to SCQ?
      *   **Tone:** Colleague-to-colleague, expert metaphysician.
      *   **Constraint:** No references/reading lists.

  2.  **Brainstorming Failure Modes (Expert Perspective):**
      *   *Circularity:* The definition relies on responding "as a single unit." But what is a unit? If it means "an object," the principle is circular. If it means "coordinated motion," it might be too broad.
      *   *Salience:* "Salient way of perturbing." Salient to whom? Humans? God? If human-interest relative, composition becomes mind-dependent (problematic for realists). If objective, what makes a perturbation salient?
      *   *The Sum of Responses:* How do we calculate the sum of responses of parts *without* the whole? This requires a baseline of how parts behave in isolation. But parts are rarely in isolation.
      *   *Statue/Lump:* Both respond to squashing. The lump survives, the statue doesn't. Does the perturbation principle distinguish them? If the principle says "they compose," does it mean *one* thing or *two*? It struggles with coincident objects.
      *   *Heaps:* A heap of sand responds to wind. Do the grains respond as a unit? Maybe they all blow away together. Is that a "joint response" or just parallel individual responses?
      *   *Organisms:* Cells respond to injury together (homeostasis). This fits well. But does it rule out artifacts?
      *   *Collapse:* If *any* perturbation counts (gravity), we get Universalism. If *no* perturbation counts as truly "joint" without prior unity, we get Nihilism.
      *   *SCQ vs. Rival:* Is this answering "when does composition occur?" or "when do we *treat* things as objects?" It risks being pragmatic rather than ontological.

  3.  **Drafting the Exam Question:**
      *   Need to present the principle clearly.
      *   Need to force application to specific cases (Heap, Chair, Organism, Statue/Lump).
      *   Need to force analysis of the "Salience" and "Single Unit" terms.
      *   Need to ask if it solves SCQ or changes the subject.
      *   *Drafting thought:* Make sure they don't just say "It's vague." They need to propose a precisification.

  4.  **Drafting the Model Answer:**
      *   *Goal:* ~700 words. High quality.
      *   *Structure:*
          1.  Initial plausibility (Organisms work).
          2.  Problem cases (Heap/Chair).
          3.  The Coincidence Problem (Statue/Lump).
          4.  The Circularity/Salience Dilemma.
          5.  Conclusion on SCQ status.
      *   *Key argument:* The principle works descriptively but fails ontologically because "single unit" presupposes composition, and "salience" makes composition mind-dependent. To save it, one must precisify "salience" objectively, but that leads to Universalism (gravity perturbs everything jointly).
      *   *Tone:* Analytic, precise, critical but charitable.

  5.  **Drafting the Marking Scheme:**
      *   Total 20 marks.
      *   5-6 criteria.
      *   Must include specific pitfalls for each.
      *   Criteria: Application to cases, Circularity objection, Salience/Collapse objection, Statue/Lump distinction, SCQ status, Vagueness precisification.

  6.  **Refining and Polishing:**
      *   *Check against constraints:* Did I include the heap? Yes. Chair? Yes. Statue/Lump? Yes. Organism? Yes. Circularity? Yes. Salience? Yes. SCQ status? Yes. Vagueness precisification? Yes.
      *   *Word Count:* Keep the model answer tight.
      *   *Tone Check:* Ensure the intro sounds like a colleague ("Here's the draft...").
      *   *Trap Flagging:* The prompt asks me to flag traps in the question itself. I need to make sure I note where the question might mislead students (e.g., implying the principle *is* an answer to SCQ).

  7.  **Final Review of the "Perturbation Principle":**
      *   It's essentially a functionalist/causal criterion for composition.
      *   The "sum of responses" clause is the tricky bit. If I push a chair, the legs move *because* they are attached. If they weren't attached, they wouldn't move. So the joint response differs from the sum of isolated responses. This makes artifacts pass easily.
      *   The "Salient" clause is the escape hatch.
      *   The Model Answer needs to catch this: If we remove "salient," gravity makes everything a unit (Universalism). If we keep "salient," it's anthropocentric.

  8.  **Constructing the Output:** (Proceeding to generate response based on these thoughts).
      *   *Self-Correction during drafting:* Make sure the model answer doesn't just list objections but *commits* to a verdict as requested ("make them commit to an extension"). The model answer should argue the principle fails as an ontological ground but might work as a conceptual guide, or argue it collapses into Universalism. Let's go with the collapse/circularity critique as the strongest "A-grade" move.
      *   *Word Count Check:* Ensure the model answer is close to 700.
      *   *Marking Scheme:* Ensure the "how they blow it" lines are specific.

  9.  **Final Polish:** Check the tone of the introductory advice. It should be helpful and professional. (Okay, ready to write).

  *(Self-Correction on Model Answer Length)*: 700 words is actually quite short for all those requirements. I need to be dense. I will prioritize the Circularity and Salience arguments as they are the "killer" objections.

  *(Self-Correction on Marking Scheme)*: Ensure the points add up to exactly 20.

  *(Final check on constraints)*: "No references, no reading list." "Keep the tone like a colleague." "Flag anything you think is a trap in the question itself."

