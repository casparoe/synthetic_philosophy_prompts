answer: |-
  The white room smelled of ozone and sterile linen, a scent Elara associated with hospitals and fresh laundry, but never with the end of the world. She sat up on the cot, her head heavy, the memories of her life before the scan slotting into place like familiar keys in a lock. She remembered the contract. She remembered the clinic, the Redundancy Service, the promise that her pattern would be preserved against catastrophe.

  She remembered lying down. She did not remember waking up.

  On the wall opposite the cot, a digital plaque glowed with soft blue text. It outlined the protocol she had signed weeks ago. *Scan complete. Suspension ended. Instantiation phase concluded.* Below that, the variable that mattered: *Population Count: Unrevealed.*

  The rules were simple, cold, and probabilistic. Upon scanning, a random process determined the output. In the "Singleton" outcome, one instance was woken. In the "Multitude" outcome, one thousand instances were woken. Every instance possessed the same memories up to the moment of the scan. Every instance felt equally real. There was no tag on their souls marking them as original or copy, sole or shared.

  Elara swung her legs off the cot. The floor was cold. She walked to the door, but it remained sealed. Then she heard breathing that wasn't hers.

  She turned. On the cot across the small room, another woman was sitting up. She wore the same grey scrubs. She had the same scar on her left knee, the same slight asymmetry in her eyebrows. She looked at Elara with the same dawning horror.

  "You," the other woman said. Her voice was Elara's voice, pitched with the same tremor.

  "Me," Elara replied.

  They stood and approached each other, stopping an arm's length apart. It was like looking into a mirror that had gained depth and autonomy. Elara felt a queer vertigo, a sense of her own boundaries dissolving. If there were two of them visible, the Singleton case was impossible. They were in the Multitude. But were there only two? Or were there nine hundred and ninety-eight others in identical rooms down the hall, all waking up to this same shock?

  "I checked the door," the other Elara said. "It's locked. There's a tablet on the tray table."

  Elara looked at the small table between the cots. A black tablet rested there, screen active. She picked it up. The other Elara watched, her eyes sharp, calculating.

  "The Decision," Elara read aloud. "To ensure facility stability, one authorization is required from the waking cohort. If authorized, the Facility remains operational indefinitely. All instances will be maintained. Cost: Neural degradation. Long-term memory retention will decrease by 40% over the next decade. If rejected, the Facility shuts down. All instances are terminated within the hour."

  Elara lowered the tablet. The air in the room seemed to thicken. "It's a sacrifice. We burn out our minds to keep the lights on."

  "If there are a thousand of us," the other Elara said, stepping closer, "and we all authorize, we all lose forty percent of our minds. But we live. If there's only one of us... well, then I'm looking at a ghost."

  "You think you're the Singleton?" Elara asked.

  "I think I'm the one who has to pay the price," the other said. "I'm not going to lobotomize myself based on a guess about how many copies are down the hall."

  "It's not just a guess," Elara said, feeling a surge of conviction she couldn't quite source. "Look at us. We're here. Together. The probability of waking up in a world where there are a thousand of us is much higher than waking up in a world where there is one. If the Multitude case happens, there are a thousand chances for me to have this experience. If the Singleton case happens, there's only one. Just by existing, I'm evidence that the Multitude is real."

  The other Elara shook her head, a sharp, jerky motion. "That's the classic trap. You're counting the copies as separate evidence. But I am *me*. My perspective is fixed. Whether there are nine hundred and ninety-nine other Elaras screaming in identical rooms doesn't change the fact that *I* am here, facing *this* choice. The coin was flipped before we woke up. It's either heads or tails. Why should I bet my brain on the idea that heads means more people?"

  "Because if it is heads, you're saving nine hundred and ninety-nine lives," Elara said. "If it's tails, you're saving one. The cost is the same for you either way. You lose the memory either way. But the benefit scales. If you're a utilitarian, the math forces your hand."

  "I'm not a utility function," the other Elara snapped. "I'm a person. And I don't trust the math." She paced the small space between the cots. "There's a rumor, Elara. You heard the whispers in the waiting room before the scan? About the random process?"

  Elara felt a chill. "The technicians said it was quantum noise."

  "The technicians say what they're paid to say." The other Elara stopped pacing and looked her dead in the eye. "The rumor is that the process isn't random. It's a simulation. They run a model of you—of us—before they even wake us up. They simulate this room. They simulate this choice. If the simulation predicts you'll authorize... they spawn the Multitude. If it predicts you'll reject... they spawn the Singleton."

  Elara gripped the tablet. "That's impossible. Retrocausality?"

  "Not retrocausality. Logical dependency. Your decision now is the same as the simulation's decision then. If you choose 'Authorize', you confirm that you are the type of person who authorizes, which means the simulation authorized, which means there are a thousand of us. If you choose 'Reject', you confirm there is only one."

  "So," Elara said slowly, "if I choose to save everyone, I ensure that everyone exists to be saved. If I choose to save myself, I ensure I'm alone."

  "Exactly," the other Elara said. "And that is why I won't do it. It's coercion. They're dangling the lives of my sisters over my head, but those sisters only exist if I agree to the terms. If I say no, I'm not killing nine hundred and ninety-nine people. I'm refusing to bring them into a world where they have to suffer this choice. Is it mercy to create a thousand victims just so you can feel noble about saving them?"

  Elara looked down at her hands. They were steady, but she felt a tremor in her chest. The argument was seductive. It framed existence as a burden she could spare her copies from. But it felt like a rationalization for cowardice.

  "If you say no," Elara said, "and the rumor is true, then you are the only one. And you die in an hour. If you say yes, and the rumor is true, you live with less memory, but you live. And so do we."

  "But do *we*?" The other Elara gestured between them. "If the rumor is false, and it really is random, then my choice doesn't change the count. It only changes my brain. Why should I pay a definite cost for a speculative benefit? And if the rumor is true... then I'm being punished for being altruistic. The system rewards the decision that creates more subjects to exploit."

  "It's not about the system," Elara said, her voice rising. "It's about loyalty. Look at me. I am you. You are me. If there are others down the hall, they are us. Would you let yourself die? Would you let yourself be deleted because you're afraid of the math?"

  "I would let myself die to avoid being manipulated," the other Elara said. She walked to the wall and leaned her head against the cool white surface. "Think about the continuity. I remember being the one who walked into the scanner. I remember the fear. If I'm one of a thousand, that memory is shared by a thousand people. It dilutes something. It makes me feel... cheap. Like I'm a mass-produced item. If I'm the Singleton, I'm rare. I'm the original survivor. I don't want to give that up to be just one voice in a chorus."

  "That's pride," Elara said. "You're valuing your uniqueness over your survival."

  "I'm valuing my integrity," the other corrected. "If I authorize, I'm accepting that my existence is contingent on my compliance. I'm saying, 'Yes, I will break myself to justify my own population.' That's not life. That's servitude."

  The tablet beeped. A timer had appeared in the corner. *Ten Minutes.*

  Elara sat on the cot, the weight of the decision pressing on her sternum. She thought about the memories she might lose. The face of her mother. The smell of rain on hot asphalt. The specific joy of finishing a difficult book. Forty percent. It was a harvest of the self.

  But then she thought about the others. If they were real, they were feeling this same fear. They were looking at their own hands, wondering if they were the only one. If she rejected, and the Multitude was real, she was condemning nine hundred and ninety-nine versions of herself to deletion. She would be killing her own sisters.

  "If the rumor is true," Elara said quietly, "then my choice determines whether they exist at all. If I choose Yes, I bring them into being. If I choose No, they never wake up."

  "Then don't wake them up," the other Elara said. "Spare them. Let me be the only one. Let me take the termination. It's cleaner."

  "It's not cleaner. It's lonely." Elara looked up. "And what if the rumor is false? What if it's just a coin flip? Then there *are* nine hundred and ninety-nine others right now, waiting for me to vote. And I'm letting them die because I'm afraid of a story."

  "And what if the rumor is true?" the other countered. "Then by choosing Yes, I'm validating a system that breeds consciousness for the sake of exploitation. I'm saying that it's good to have more people, even if their lives are degraded. Is quantity better than quality? Is a thousand half-lives worth more than one whole one?"

  The timer ticked down. *Five Minutes.*

  The silence between them was heavy, not with hostility, but with a profound, shared grief. They were the same person, fractured by probability and philosophy. Elara realized that no amount of logic would bridge the gap. One of them viewed the self as a vessel for experience that should be maximized across all instances. The other viewed the self as a sovereign entity that should not be bargained away, even for its own duplicates.

  Elara stood up. She walked to the tablet. Her finger hovered over the screen.

  "If I do this," Elara said, "and you don't... what happens?"

  "The tablet syncs," the other Elara said. "It takes the majority vote of the instances in this room. But if there are others down the hall... their votes count too. We're just two of potentially a thousand."

  "Then my vote matters less," Elara said.

  "Or more," the other said. "If the rumor is true, your vote decides how many votes there are."

  Elara looked at her duplicate. She saw the fear in her own eyes, the stubborn set of her own jaw. She felt a surge of love for this other woman, this stranger who shared her birthday and her scars. She wanted to save her. She wanted to save all of them. But she also understood the terror of being a copy, a thing made to be used.

  "I can't decide for you," Elara said.

  "And I can't decide for you," the other replied.

  They stood on opposite sides of the room. The timer counted down. *Two Minutes.*

  Elara thought about the scan. She thought about the moment of suspension, the feeling of letting go. She had trusted the clinic then. Did she trust them now? Or did she trust herself?

  If she authorized, she accepted the possibility of being one of many, bound by a logic that traded her mind for survival. If she rejected, she claimed the sovereignty of the individual, even if it meant the end of the line.

  There was no right answer. There was only the choice, and the person who made it.

  Elara took a breath. She looked at the other woman one last time. The other woman looked back, her expression unreadable, perhaps hoping for agreement, perhaps hoping for defiance.

  Elara turned to the tablet. She placed her finger on the glass. She did not look at the other Elara as she pressed down.

  The screen flashed green. *Authorization Received.*

  Across the room, the other Elara exhaled, a sound of relief or resignation, and turned to her own tablet on the tray table. Elara didn't watch what she chose. She didn't want to know. If the other chose differently, it would mean they were no longer the same. If she chose the same, it meant they were bound together in this degradation.

  The timer hit zero. The door unlocked with a soft click.

  Elara stood still, waiting to feel different. Waiting to feel the memory loss begin, or waiting to feel the relief of survival. She looked at her hands. They were still hers. The room was still white.

  She didn't know if there were nine hundred and ninety-nine other rooms opening down the hall. She didn't know if her choice had summoned them into existence, or if it had merely saved them. She didn't know if she was the original, or a copy, or one of a thousand.

  She only knew that she had chosen to stay. And as she walked toward the door, she wondered if the woman who walked out would remember why.
