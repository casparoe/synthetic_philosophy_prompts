      *   *Actually, looking closer:* The user says "I'd rather find out now that its incoherent." The P1/P2 clash is the most obvious target for a professor.
      *   *Recommendation:* Keep P1 (it's a strong, standard position). Modify P2. The Bangladeshi farmer isn't subject to *your* state's coercion directly, but to the *global order* your state shapes. Or, admit it's a moral claim that requires *new* democratic institutions (transnational), not inclusion in *your* existing demos.
