  3.  **Map Hegel to Analyst Vocabulary:**
      *   *Bargaining Range/Reversion Outcome:* Hegel rejects the idea that war is just a failure to find a bargain. It's about the *status* of the bargainer.
      *   *Deterrence/Offence-Defence:* Relevant, but secondary to the *meaning* of the conflict.
      *   *Two-Level Games:* Hegel cares deeply about the domestic-external link, but not as a constraint on negotiation. Rather, the external threat solidifies the domestic level.
      *   *User's Terms:*
          *   *Recognition Rents:* Fits Hegel's idea of honour and status. States fight to be recognised as sovereign.
          *   *Internal-Audit Value:* Fits Hegel's idea of testing the citizenry's willingness to sacrifice.
          *   *Ethical Slack:* Fits Hegel's idea that peace allows civil society to dominate (selfishness), while war uses up that slack for the universal good. Or, conversely, peace creates "corruption" because slack is used for private gain. Let's refine: Ethical slack is the capacity to act beyond survival. In peace, this goes to private accumulation. In war, it goes to the state's ethical life.
