      *   Ensure the "Ethical Slack" term is used correctly. In the prompt, it's defined as capacity *not* required for survival spent on self-conception. For Hegel, peace allows this to be spent on *particular* self-conception (civil society), war forces it into *universal* self-conception (state). I need to be careful not to make it sound like "spare capacity" in a budgetary sense, but in a teleological sense.

      *(Self-Correction on Ethical Slack)*: The prompt defines it as "capacity... not required for survival... spend on projects that sustain its self-conception."
