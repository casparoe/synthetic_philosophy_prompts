      *(Self-Correction on Internal-Audit Value)*: This is a strong fit. Hegel explicitly talks about the "vanity of temporal goods" being revealed in war. The crisis reveals if the state is just a protection agency or an ethical whole.

      *(Self-Correction on Recognition Rents)*: Rationalists treat reputation as a signal for future bargaining. Hegel treats recognition as the *substance* of sovereignty. I need to mark this distinction.

  10. **Final Review against constraints:** British English spelling (recognise, programme, honour, defence). No citations. No quotes.

