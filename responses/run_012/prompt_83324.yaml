answer: |-
  Here is a reading of *His Dark Materials* designed to break the "tool vs. part" stalemate in your section, followed by the requested table and a factual correction.

  ### The Dæmon as Constitutive, Not Coupled: A Reading

  **Is the dæmon an Extended Mind?**
  Strictly speaking, no. Clark and Chalmers argue for *functionalism*: if an external resource plays the same functional role as an internal process, it is part of the mind. Otto's notebook is functionally equivalent to biological memory. A dæmon is not functionally equivalent to a cognitive process; it is portrayed as the *source* of agency itself. However, for your students, the dæmon acts as a **reductio ad absurdum of the "mere tool" objection**. If a student insists Otto's notebook is "just a tool" and not part of his mind, ask them if a dæmon is just a tool. If they say no (because removing it destroys the person via intercision), they have conceded that *some* external entities are constitutive of the self. The dæmon forces the "coupling-constitution" objection to show its hand: if severing the coupling destroys the constitution, the coupling was never merely causal.

  **Intercision and the Natural Experiment**
  Intercision is the decisive evidence. In the EMT framework, removing Otto's notebook degrades his performance but leaves "Otto" intact. Removing a dæmon leaves a body that breathes but lacks will, creativity, or spirit. This suggests the dæmon is not an *extension* of the mind (which implies the mind exists prior to the extension) but a *constituent* of the person. It breaks the Clark/Chalmers version of EMT because they rely on **contingency** (Otto could use a different notebook). A dæmon is necessary. This supports a stronger, embodied/enactive view of cognition (like Alva Noë's) over Clark's functionalist version. The distinction between "body" and "mind" collapses; the dæmon is the visible boundary of the psychological body.

  **Contingency vs. Necessity**
  This is where the analogy fractures. EMT relies on **substrate neutrality**: it doesn't matter *what* does the thinking, only *that* it gets done. Otto could use a phone, a PDA, or paper. A dæmon is not replaceable. You cannot swap Pantalaimon for a different animal. This violates the multiple realizability condition of standard functionalism. If the specific external object matters metaphysically, we aren't doing cognitive science anymore; we're doing theology. However, for the purpose of the class, this highlights the **Cognitive Bloat** objection. If Otto's notebook is part of his mind, why not his glasses? Why not the air he breathes? Pullman answers: because the bond is unique and necessary. It gives students a criterion for stopping the bloat that Clark's "trust and endorsement" conditions sometimes fail to provide.

  **The Ethics of Extension**
  Pullman dramatizes the ethical implication that Clark ignores. If the mind extends, violating the extension is assault. Touching a dæmon is taboo because it is direct manipulation of the psyche. In our world, grabbing someone's phone is property damage; in Pullman's, it is battery. This validates the intuition behind the "coupling-constitution" debate: if we treat extensions as mere property, we miss the vulnerability involved in relying on them. The taboo makes the boundary of the person **public**. In EMT, the boundary is invisible (inside the skull vs. in the pocket). Pullman makes it visible (the space around the animal). This helps students see that the "boundary of the mind" is not a geometric fact but a normative one.

  **The Category Error**
  Be honest: Dæmons are souls. EMT is a naturalistic thesis about information processing. Importing a metaphysical soul into a functionalist argument is cheating. A dæmon feels pain when the human feels fear; it is an emotional regulator, not just a memory store. This shifts the debate from "Extended Cognition" to "Extended Personhood." Clark cares about where *belief* is located; Pullman cares where *will* is located. The comparison fails if you stick strictly to the 1998 text, but it succeeds if you treat EMT as a broader inquiry into the limits of the self. What survives is the **phenomenology**: the experience of thinking *with* something else is indistinguishable from thinking *inside* yourself.

  **What the Books Add**
  Arguments like Otto's are sterile; they appeal to intuition pumps about memory retrieval. *His Dark Materials* adds **affect**. Students get stuck on Otto because they don't care about the notebook. They care about Lyra. The books force students to feel the loss of the extension. It transforms the question from "Where is the belief stored?" to "What happens when I am cut off from what makes me me?" It emotionalizes the functionalist debate, making the "constitution" side feel like the only moral option.

  ***

  ### Factual Correction
  You noted: *"witches can send theirs off alone for miles."*
  **Correction:** In the books, *all* humans feel increasing physical pain as the distance from their dæmon increases. Witches are the **only** beings who can separate from their dæmons completely without pain or limit. This distinction is crucial for the "necessity" argument above: for humans, the coupling is physically enforced by pain, making the "extension" biologically mandatory, unlike Otto's notebook. I have proceeded with this corrected version in the table.

  ***

  ### Comparison Table: EMT vs. Pullman

  | Feature or Scene | What EMT Predicts | What Pullman Actually Shows | Verdict | Why |
  | :--- | :--- | :--- | :--- | :--- |
  | **Intercision** | Removing the resource degrades cognitive function but leaves the agent intact. | Removing the dæmon leaves the body alive but destroys the person's will and spirit. | **Undercuts** | Suggests the external part is constitutive of the *self*, not just a cognitive tool. |
  | **Distance/Pain** | Access should be easy, but physical distance shouldn't cause somatic suffering. | Increasing distance causes physical pain; separation is physically impossible for most. | **Complicates** | The coupling is biologically enforced, violating the contingency condition of EMT. |
  | **Settling** | Cognitive systems should be flexible and adaptable to new tools/forms. | Dæmons settle into one form at puberty and cannot change thereafter. | **Undercuts** | Implies a fixed metaphysical essence rather than a flexible functional system. |
  | **Touching Taboo** | Interfering with an extension is property damage or minor obstruction. | Touching another's dæmon is considered profound violation/assault. | **Supports** | Validates the intuition that violating an extension is violating the person. |
  | **Whispering/Advice** | External resources store data for retrieval (like Otto's notes). | Dæmons argue, comfort, and reason *alongside* the human in real-time. | **Supports** | Demonstrates active, ongoing cognitive processing, not just passive storage. |
  | **Replacement** | Resources should be replaceable (Otto could use a different notebook). | A dæmon is unique to the human and cannot be swapped or substituted. | **Undercuts** | Violates the multiple realizability requirement of functionalist EMT. |
  | **Witch Separation** | If the resource is external, it should be operable independently. | Only witches can separate fully; for others, the "extension" is physically bound. | **Complicates** | Shows the "external" mind is usually embodied, blurring the internal/external line. |
  | **Death** | When the agent dies, the resource remains as an object. | When the human dies, the dæmon fades into dust simultaneously. | **Undercuts** | Confirms they are one ontological entity, not two coupled systems. |
