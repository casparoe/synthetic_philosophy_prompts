answer: |-
  # Joint Statement on the Moral Status and Priority of Insects

  **Signatories:** [The Proponent of the Scale Argument] & [The Skeptic Regarding Insect Priority]
  **Date:** October 26, 2023
  **Subject:** Clarifying the grounds of agreement and disagreement regarding the moral weight of insects.

  ## Preamble

  We, the undersigned, acknowledge that while we reach different conclusions regarding the prioritization of insect welfare in effective altruism and moral philosophy, much of our apparent conflict stems from imprecise terminology and unexamined assumptions about uncertainty. This document is not an attempt to force a consensus where none exists, but to isolate the precise variables upon which our disagreement turns. We agree that the stakes are high: if the Proponent is correct, neglecting insects is a catastrophe of unprecedented scale; if the Skeptic is correct, prioritizing insects risks misallocating resources away from causes with more robust evidence of impact.

  ---

  ## Part I: Points of Consensus

  We affirm the following claims as a shared foundation for our continued discourse.

  1.  **The Scale of the Population:** We agree that the number of individual insects alive at any given time is on the order of $10^{18}$ (one quintillion) or higher. We agree that this number exceeds the population of vertebrates by at least nine orders of magnitude. We acknowledge significant uncertainty in these estimates, particularly regarding soil-dwelling micro-arthropods (e.g., springtails), but agree the magnitude is sufficient to drive "scale arguments."
  2.  **Distinction Between Sentience and Valence:** We agree to distinguish two concepts often conflated:
      *   *Sentience (Phenomenal Consciousness):* The capacity for there to be "something it is like" to be the organism.
      *   *Valenced Experience:* A subset of sentience involving positive or negative affective states (suffering or pleasure) that possess a *magnitude*.
      *   *Consensus:* Moral weight requires valenced experience, not merely sentience. An organism could theoretically be sentient (aware) without having welfare that matters morally (no hedonic tone). The Scale Argument depends on the existence of *valenced* experience, not just information processing.
  3.  **The Structure of Expected Value:** We agree that the expected moral value ($E$) of focusing on insects can be modeled roughly as:
      $$E = N \times P(V) \times M \times T$$
      Where $N$ is the number of individuals, $P(V)$ is the probability of valenced experience, $M$ is the moral magnitude (welfare range) per individual, and $T$ is the tractability of intervention. We agree that a high $N$ can mathematically compensate for low $P(V)$ or $M$, provided they are not zero.
  4.  **Epistemic Asymmetry:** We agree that there is an asymmetry in the costs of error.
      *   *False Negative (Denying experience when it exists):* Risks complicity in massive suffering.
      *   *False Positive (Attributing experience when it does not exist):* Risks wasted resources and opportunity costs.
      *   *Consensus:* We disagree on which error is more probable, but agree that the False Negative carries a heavier *moral* weight if it occurs, while the False Positive carries a heavier *strategic* cost if it occurs.
  5.  **Heterogeneity of "Insects":** We agree that "insect" is not a natural kind for the purpose of moral status. The neurological and behavioral differences between a honeybee (*Apis mellifera*), an aphid, and a springtail (Collembola) are vast. We agree that assigning a single probability $P(V)$ to all insects is a modeling fiction. Any serious calculation must account for a distribution of probabilities across taxa.
  6.  **Current Intervention Landscape:** We agree that currently available interventions are limited. They primarily consist of: (a) funding research into insect sentience, (b) advocating for reduced use of broad-spectrum pesticides in non-agricultural contexts, and (c) researching humane pest control methods. We agree that no intervention currently exists that can reliably improve insect welfare at a global scale without significant trade-offs for human or vertebrate welfare.

  ---

  ## Part II: Table of Remaining Disagreements

  The following table isolates the specific claims where we diverge. For each, we state our position in our own words, identify the "crux" (the specific sub-question that, if resolved, would shift our view), and list evidence we both agree would be relevant.

  | Disagreement | Proponent's Position | Skeptic's Position | The Crux | Agreed Evidence / Case | Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Distribution of Sentience Probability** | While heterogeneity exists, we lack evidence to rule out valence in most lineages. We should use a "heavy-tailed" prior where a significant minority (e.g., >10%) of insect species have non-negligible $P(V)$. | Heterogeneity is the dominant factor. $P(V)$ is likely bimodal: near-zero for the vast majority of biomass (aphids, springtails) and non-negligible only for a tiny fraction (social Hymenoptera). | **Is cognitive complexity a prerequisite for valence?** If simple nociception (withdrawal reflex) exists without affect, does it count? | Comparative neuroanatomy studies identifying homologues of vertebrate pain pathways (e.g., opioid systems) in non-Hymenoptera insects. | **Prop:** Such homologues will be found in diverse lineages.<br>**Skep:** They will be restricted to complex bees/ants or absent entirely. |
  | **2. The Magnitude of Welfare Range ($M$)** | Even if insect experience is "simpler" than humans, the sheer scale ($N$) means the *sum* of welfare ranges dominates. A tiny unit of suffering $\times$ quintillions > human suffering $\times$ billions. | The welfare range ($M$) is likely non-linear. If an organism lacks a unified self-model or temporal integration, its "suffering" may be momentary and morally negligible, effectively making $M \approx 0$ regardless of $N$. | **Does moral weight scale linearly with cognitive capacity?** Or is there a threshold below which experience has no moral weight? | Behavioral tests for "emotional coping" (e.g., seeking analgesics after injury, trading off pain for reward) in simple insects. | **Prop:** Even simple insects will trade off rewards to avoid noxious stimuli.<br>**Skep:** Only complex insects will show evidence of integrated emotional states. |
  | **3. The Handling of Uncertainty (Pascal's Mugging)** | Given the astronomical stakes, we cannot ignore low-probability hypotheses. We must act on expected value even when $P(V)$ is uncertain, provided it is not vanishingly small. | The uncertainty is so profound that the expected value calculation is unstable. Assigning any specific non-zero probability is arbitrary. We should prioritize causes with robust evidence over those with high variance. | **What is the appropriate discount rate for epistemic uncertainty?** At what point does "unknown" become "negligible" for decision-making? | Analysis of historical cases where "low probability, high impact" moral claims were later verified or falsified (e.g., fetal pain, animal sentience history). | **Prop:** History shows we systematically underestimate sentience.<br>**Skep:** History shows we systematically overattribute human-like traits to animals. |
  | **4. Tractability and Leverage ($T$)** | Research is highly leveraged. A small investment now could clarify $P(V)$ and unlock massive future value. Policy changes on pesticide use are feasible low-hanging fruit. | Even if $P(V)$ is confirmed, changing human behavior regarding insects (pests, agriculture) is culturally and economically intractable compared to vertebrate welfare. | **Is the bottleneck knowledge or motivation?** If we knew insects suffered, would we act? | Pilot studies on consumer willingness to pay for "insect-friendly" products or policy analysis of pesticide regulation barriers. | **Prop:** Willingness to pay will be significant once awareness is raised.<br>**Skep:** Willingness will remain near zero due to disease/agricultural concerns. |

  ---

  ## Part III: Candor on Confidence and Verbal Disputes

  In the spirit of intellectual honesty, we append the following meta-commentary regarding the state of the field and our own confidence levels.

  **1. What is Settled vs. Contested**
  *   **Settled:** It is scientifically settled that insects exhibit complex behaviors (learning, navigation, communication). It is *not* settled whether these behaviors require phenomenal consciousness. It is settled that insects possess nociceptors (pain receptors); it is *not* settled whether nociception implies suffering.
  *   **Contested:** The link between neural complexity and valence is the primary contested domain. There is no consensus in neuroscience or philosophy of mind on the "minimum hardware" required for suffering. Consequently, any probability assigned to $P(V)$ is currently subjective Bayesian estimation, not empirical fact.

  **2. The Heterogeneity Crux**
  We explicitly identify the **heterogeneity of insects** as a genuine crux, not merely a complication.
  *   *Why:* The Proponent's argument often relies on the *total* biomass of insects. The Skeptic's argument relies on the *median* complexity of insects.
  *   *Resolution Condition:* If it is discovered that 99% of insect biomass belongs to lineages that diverged before the evolution of valence-capable neural structures, the Proponent's expected value calculation drops by two orders of magnitude. If it is discovered that valence is a basal trait of all arthropods, the Skeptic's position becomes untenable.

  **3. Identification of Verbal Disputes**
  We acknowledge that a portion of our disagreement is verbal, specifically regarding the definition of **"Suffering."**
  *   *The Verbal Knot:* The Proponent often uses "suffering" to mean "any negative valenced state that the organism attempts to avoid." The Skeptic often uses "suffering" to imply "a unified negative experience that persists over time and impacts a self-model."
  *   *Impact:* If we adopt the Proponent's definition, the Scale Argument succeeds easily. If we adopt the Skeptic's definition, it likely fails. We agree that the moral truth does not depend on our definition, but our *action* does. We commit to using the term **"Valenced Avoidance Behavior"** when referring to observable data, and reserving **"Suffering"** for the inferred internal state, acknowledging we may be talking past each other when using the latter.

  **4. Confidence Levels**
  *   **Proponent Confidence:** I assign roughly 15% probability to the hypothesis that insect welfare should be the *top* global priority. I am not certain, but the expected value is too high to ignore.
  *   **Skeptic Confidence:** I assign less than 1% probability to the hypothesis that insect welfare should be the *top* global priority. I am not certain they don't matter, but I am confident the evidence is insufficient to displace vertebrate-focused or existential risk causes.

  **Signed,**

  _________________________
  [The Proponent]

  _________________________
  [The Skeptic]
