  Summary. You propose a hedonistic value theory where pleasure is the sole intrinsic good, grounded strictly in phenomenal character rather than desire. However, you deny pleasures share a common felt quality, arguing instead that they form a heterogeneous real kind investigable by science, inclusive of relief and even cruel sensations.

  Genuine tensions, ranked by severity. The most severe tension arises between (ii), (iii), and (iv). If pleasures share no common phenomenal ingredient (ii) and value is grounded strictly in phenomenal character (iii), then "intrinsic goodness" supervenes on disparate bases. For (iv) to hold, science must identify a unified natural kind. However, natural kinds typically require shared causal powers or structural properties. If the only unity is normative (i), science cannot investigate it as a natural kind. You assert a naturalistic ontology for a category defined by heterogeneous phenomenology and normative status, creating a metaphysical gap between the science of mind and the value theory. Without a common phenotype, the "real kind" status lacks a candidate referent, rendering (iv) empirically empty unless you posit a hidden commonality contradicting (ii). You must either accept that science will find a unified mechanism despite phenomenological heterogeneity, or admit pleasure is not a natural kind.

  Next, (iii) and (vi) conflict regarding the grounding of value. Commitment (iii) asserts value is grounded in how a state feels. Commitment (vi) admits relief may involve no positive feeling, only pain's cessation. If the phenomenal character of relief is merely the absence of pain, then absence grounds intrinsic goodness. This contradicts the standard reading of (iii), which implies a positive phenomenal bearer. If absence suffices, then pain's absence is the good-maker, not a positive feel. This forces a shift toward negative hedonism or requires redefining "phenomenal character" to include absences, which dilutes the explanatory power of (iii). It suggests the grounding property is not "feeling" but "relation to pain," which undermines the phenomenological grounding claim.

  Finally, (i) and (ii) threaten the unity of value. Hedonism (i) posits a single intrinsic good. Heterogeneity (ii) denies a single experiential commonality. If the experiences share no felt quality, the unity of "goodness" becomes suspect. Is the goodness of relief the same property as the goodness of peach-tasting? If yes, what unifies them besides the label? If no, Hedonism fragments into a pluralism of goods. You risk making "good" an equivocal term, undermining the systematic power of (i). To maintain (i), you must argue that goodness is a single higher-order property realized by heterogeneous states, but this weakens the direct phenomenal grounding of (iii).

  Apparent tensions that dissolve. This conflicts only if one conflates intrinsic value with moral permissibility. Your package distinguishes the value of the *state* (pleasure) from the value of the *act* or *character*. Affirming the intrinsic goodness of the cruel person's feeling does not entail the act is good. The tension is with external moral intuition, not internal logic. The distinction preserves consistency without revision.

  Similarly, denying a common felt quality does not necessitate a desire-based account. One can reject phenomenal unity while maintaining that desire is irrelevant to value. The rejection of a phenomenal common denominator is compatible with the rejection of desire as a constitutive element. Both are negative claims about what pleasure is *not*, leaving room for a heterogeneous but non-desire-based account. These pairs remain stable because they address different categories: moral evaluation versus ontological classification. Consequently, the internal logic holds firm against these specific pairings.

  The cheapest repair. Surrender (iv). Claim pleasure is not a "real kind" for science, but a functional or normative category grouping heterogeneous states that share the property of being intrinsically good. This preserves (i), (ii), (iii), and (vi) without requiring neuroscience to find a unified "pleasure mechanism." The cost is precise: you lose the claim that a mature science of mind will discover genuine facts about pleasure as a natural kind. Neuroscience might find correlates for *types* of pleasure, but not pleasure *simpliciter*. You retreat from strong naturalism about value bearers, accepting that "pleasure" is a folk-psychological or philosophical construct rather than a biological natural kind. The resulting position can no longer claim that pleasure exists independently of our evaluative practices, weakening the objectivity of the category while saving the value theory. You effectively decouple the metaphysics of mind from the axiology of experience. This allows you to maintain that pleasure is real in a normative sense without demanding a unified physical substrate. You must accept that the unity of pleasure is axiological, not ontological. This aligns better with (ii) but requires abandoning the hope for a unified science of value-bearing states.
