      5.  **Prop 1 vs. Prop 2:** The "Sorites Paradox" of typography. (Is a broken bowl still an 'a'?).

  6.  **Developing Fixes:**

      *   *Fix for 4 vs 5:* Drop 4. Accept a "family resemblance" or "prototype" theory. Or refine 5 to say "recognition is probabilistic," not essence-based.
