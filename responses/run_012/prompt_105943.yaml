  9.  **Final Polish:** Ensure tone is collaborative and analytical, not dismissive. Use philosophical terms (Universalism vs. Nominalism) but keep them grounded in typography. (Self-correction: Don't get *too* bogged down in jargon, keep it useful for a designer).

      *   *Re-evaluating Prop 4 vs 5:* Prop 4 says "You can't say what an 'a' is apart from a style." Prop 5 says "Recognition implies style-independence."
      *   *Resolution:* Prop 4 is likely the weak link for a font designer. You need a spec (structure) to build the modules. Prop 5 is an empirical fact of cognition. Prop 4 is a philosophical stance that might be too strong.
