answer: |-
  Your diagnosis is sharp, but it stops one layer short of the engine driving the stalemate. You are correct that the sides are often analyzing different objects (act vs. policy) and asking different questions (what to do now vs. what to have been). However, characterizing this as merely "talking past each other" or a verbal disagreement is too charitable. If it were purely verbal, they could agree on the action while disagreeing on the description. They do not. They recommend opposite moves.

  The disagreement is **substantive**, but it is not about the empirical facts of the case. It is a clash of **normative primitives** regarding the definition of agency and the metaphysics of counterfactuals.

  Here is the breakdown of the disagreement, the internal tension you identified, and what actual progress looks like.

  ### 1. The Disagreement: Two Conceptions of Agency
  You hypothesized that this might be "two questions sharing one name." That is partially true, but the conflict arises because both sides claim their question is the *fundamental* one for rationality.

  *   **The Causalist (CDT) Primitive:** Agency is **local causal leverage**. To be an agent is to be a locus of intervention in a causal graph. A choice is rational only if it changes the future via physical causal arrows. If the money is already in the box, your hand movement cannot causally affect the box's content. Therefore, taking both is the only act that exerts leverage. For the causalist, a decision theory that tells you to ignore causal structure is not "rationality"; it is superstition or wishful thinking.
  *   **The Policy/Updateless (UDT/TDT) Primitive:** Agency is **logical control**. To be an agent is to be an instance of a computational pattern. Your decision is an output of that pattern. If a predictor simulates you, your decision *logically determines* the prediction, even if it doesn't *causally* influence it downstream. For the updateless theorist, a decision theory that leaves money on the table because it fetishizes temporal ordering is "suboptimal" and therefore irrational.

  **Why it's not just verbal:**
  The clash is about **winning conditions**.
  *   For CDT, "winning" means acting in accordance with causal efficacy. If you lose money but acted causally rationally, you satisfied the norm.
  *   For UDT, "winning" means achieving the highest utility. If you act causally rationally but get less money, you failed the norm.

  This is a teleological clash. CDT views rationality as a constraint on *process* (respect causal structure); UDT views rationality as a constraint on *outcome* (maximize utility across logical possibilities). They are not disagreeing about the case; they are disagreeing about what the word "rational" is supposed to optimize.

  ### 2. The Metaphysical Bottleneck
  You noted the causalist wants a mechanism for the predictor. This is not just pedantry; it is the core substantive disagreement.

  *   **CDT requires a causal graph.** In standard physics, correlations without common causes or direct causation are impossible. If Omega predicts you perfectly, there *must* be a causal link (e.g., Omega scanned your brain). If that link exists, CDT often collapses into one-boxing because the scan is a common cause. The "hard" Newcomb problem (where the correlation is acausal or logical) is viewed by causalists as **metaphysically incoherent**. They reject the premise.
  *   **UDT requires a logical graph.** It treats computations as abstract objects that exist timelessly. If your algorithm outputs "One Box," and Omega's algorithm simulates you, the outputs are logically linked. UDTers argue that restricting reality to *physical* causality is an unjustified metaphysical bias.

  The stalemate persists because there is no agreed-upon ontology for "logical causation." CDTists say, "Show me the mechanism." UDTers say, "The mechanism is math." Until there is a formal semantics for logical counterfactuals that satisfies both, they will talk past each other.

  ### 3. The Internal Stall: Indexicality vs. Logical Omniscience
  Your intuition about the stall *inside* the policy view is correct and points to the hardest open problem in formal decision theory: **The problem of logical omniscience and indexical uncertainty.**

  You wrote: *"if your decision is computed by a fixed rule, learning that you're running that rule looks like information you should update on."*

  Here is the precise tension:
  1.  **Updatelessness:** To get the million, you must reason from a prior *before* you know you are in the Newcomb room. You must say, "If I were the kind of agent who one-boxes, I get a million."
  2.  **Indexicality:** But you *are* in the room. You have observed "I am facing the boxes." To apply a policy, you must condition on your observations to know which branch of the policy applies.
  3.  **The Conflict:** If you update on "I am facing the boxes," you might also update on "My algorithm is likely the one that two-boxes" (if, for example, two-boxers are more common in this room). If you update on your own source code, you lose the ability to treat your output as a free variable that determines the prediction.

  This is the **Problem of Self-Locating Belief in Logical Space**.
  *   If you are logically omniscient, you know your output already. There is no decision to make.
  *   If you are not logically omniscient, how do you compute the counterfactual "If my code outputted B..." without contradicting the fact that your code *does* output A?

  Current UDT formulations hand-wave this with "logical counterfactuals," but we lack a rigorous probability theory over logical statements that allows for non-trivial uncertainty about one's own computation while maintaining updatelessness. This is the "miniature external problem" you sensed. It is the barrier preventing UDT from being a fully formalized, computable algorithm.

  ### 4. What Counts as Progress?
  Since the disagreement is about normative primitives and metaphysical ontology, a survey of opinions won't help. Progress requires one of three things:

  **A. A Formalism for Logical Counterfactuals (Technical Progress)**
  We need a mathematical framework that defines "What would happen if this mathematical function returned a different value?" without exploding into inconsistency.
  *   *Why this breaks the stalemate:* If we can formalize logical counterfactuals, CDTists can no longer claim the scenario is incoherent. They would have to accept the logical link as a valid structural constraint, effectively forcing CDT to absorb UDT's insights. (Work on *Logical Induction* and *Functional Decision Theory* attempts this, but it is incomplete).

  **B. A Dominance Argument in a Broader Class (Pragmatic Progress)**
  Show that UDT dominates CDT not just in Newcomb, but in a superset of problems where CDT intuitively wins, or show that CDT is a special case of UDT under causal independence.
  *   *Why this breaks the stalemate:* If UDT can be shown to reproduce CDT's recommendations in standard causal worlds (where no predictors exist) but outperform it in logical-correlation worlds, the "Two Questions" view collapses into "One General Theory." The disagreement would shift from "Which theory?" to "What are the boundary conditions?"

  **C. An Alignment-Driven Dissolution (Pragmatic Progress)**
  This is already happening. In AI safety, we are *building* agents. We do not build agents that feel the "causal footprint" intuition; we build agents that optimize objective functions.
  *   *Why this breaks the stalemate:* When you design an AI, you are necessarily an Updateless Designer. You program the policy. The question "What should I do now?" (CDT) becomes irrelevant for the agent; the question "What policy should I install?" (UDT) becomes the only engineering reality. If decision theory is viewed as engineering rather than phenomenology, UDT wins by default. The stalemate persists only because humans insist on modeling themselves as un-designed causal loci.

  ### Summary Diagnosis
  The disagreement is **substantive**, rooted in conflicting definitions of **agency** (causal lever vs. logical pattern) and **rationality** (process adherence vs. outcome optimization).

  The stall inside the policy view is the **lack of a formal theory of logical counterfactuals** that handles indexical self-knowledge without collapsing into triviality.

  Progress will not come from better arguments about Newcomb's box. It will come from either:
  1.  A formal mathematical account of logical counterfactuals (resolving the metaphysical clash).
  2.  The construction of artificial agents where the "designer perspective" (UDT) renders the "actor perspective" (CDT) obsolete (resolving the normative clash).

  Until then, the causalists are defending a phenomenology of human freedom, and the updateless theorists are defending a mathematics of optimization. They are not solving the same problem.
