      *   **User's Question:** What kind of disagreement is this (verbal, substantive, clash of standards, two questions)? Is there a stall *within* the policy view (updatelessness vs. updating on self-knowledge)? What counts as progress?
      *   **Constraint:** "Diagnosis and reasons, not a survey of who says what." (Avoid just listing positions; focus on analysis).

  2.  **Deconstruct the User's Hypothesis:**
