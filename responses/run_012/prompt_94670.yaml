      *   *Argument to stop asking:* Unlikely. The stakes (AI alignment, acausal trade) are too high.
      *   *Best path:* Showing that one theory dominates the other in a broader class of problems (e.g., Newcomb + Prisoner's Dilemma + Parfit's Hitchhiker). UDT currently wins on "winning" (getting the money), but CDT wins on "rationality as causal control." Progress looks like a unified framework that recovers CDT in causal worlds and UDT in logical-correlation worlds.

