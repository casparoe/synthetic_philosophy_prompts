      *   **Section 1: Lottery vs. Preface.** Are they the same? Structurally, yes. But the *stakes* differ. Lottery is purely statistical; Preface involves evidence. However, for the purpose of the logic of belief, they exert the same pressure. I will treat them as the same structural problem to test the fix.
      *   **Section 2: The Choice.** Why reject Closure?
          *   Rejecting Consistency makes rationality impossible (explosion).
