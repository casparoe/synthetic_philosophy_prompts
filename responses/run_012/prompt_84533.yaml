answer: |-
  This is a classic case of life bleeding into art, not as a distraction, but as a pressure test. You are living inside the central conflict of your novel. That is exhausting, but it is also a gift. You don't have to imagine the stakes; you feel them in your boiler payments.

  You are asking three distinct questions: one about political theory (the boundary problem), one about procedural legitimacy (the paradox of the vote), and one about character voice (the union rep). I will address them in that order, because the theory informs the procedure, and the procedure informs the character.

  ### 1. The Principled Line (The Boundary Problem)

  In political theory, this is called the **Boundary Problem** or the question of *constituent power*. Who constitutes the *demos*? There is no metaphysical answer, but there are three standard frameworks used by people who design co-ops, municipalities, and unions. None are perfect, but they are the tools professionals use.

  **Argument A: The Stakeholder Principle (Your Dad / The Owners)**
  *   **The Principle:** Decision-making rights are proportional to *risk exposure*.
  *   **The Logic:** If the co-op fails, the owners lose their equity and credit. The renters lose a lease, which is bad, but they are not liable for the building's debt. Therefore, the people holding the bag must hold the pen.
  *   **The Flaw:** It conflates *financial* risk with *existential* risk. A renter with no savings who gets evicted faces a catastrophe equal to an owner facing foreclosure. Also, it ignores *sweat equity*. The renters patching the roof are investing labor that increases the asset value they are barred from owning.
  *   **The Professional Fix:** In successful co-ops, this is usually handled by creating two classes of membership: "Equity Members" (vote on capital issues, mortgage, sale) and "Occupancy Members" (vote on livability, rules, maintenance). The Owners' argument holds for the mortgage; it fails on the culture.

  **Argument B: The All-Subjected Principle (Ravi / The Renters)**
  *   **The Principle:** Anyone subject to the coercive power of the rules should have a say in making them.
  *   **The Logic:** If the Co-op Charter says "No sublets" or "Rent increases to cover mortgage," the renters are bound by that law. Democratic legitimacy requires that no one be governed without consent.
  *   **The Flaw:** As you noted, this expands infinitely (the flour delivery guy).
  *   **The Professional Fix:** You limit it to *residency*. If your primary residence is the building, you are subject to the coercion. This excludes the flour guy but includes 3B and 6A. It draws the line at the doorstep, not the deed.

  **Argument C: The Continuity Principle (The Union Rep's likely take)**
  *   **The Principle:** The group that maintains the function of the entity survives.
  *   **The Logic:** A building without residents is a shell. A town without workers is a ghost. If you exclude the people who keep the place running (the ceramics studio, the roof-patchers), you create an adversarial class within the walls.
  *   **The Flaw:** Idealism doesn't pay the bank.
  *   **The Professional Fix:** This isn't about rights; it's about leverage. If the renters organize, they can block the buyout. Therefore, they must be bought off or bought in.

  **The Verdict on Principles:** There is no "correct" line. There is only a *stable* line. A line is stable if the people on the losing side accept it enough not to burn the building down (metaphorically or literally). Your committee's draft is unstable because it creates a permanent underclass inside the cooperative structure, which contradicts the very idea of a co-op.

  ### 2. The Paradox (Who Decides Who Decides?)

  You asked: *Is the vote about who votes a real contradiction, or just an awkward fact?*

  It is a real contradiction. It is the **Paradox of Foundation**. You cannot democratically vote on the rules of democracy before the democracy exists. Someone always has to pick up the pen first.

  **How professionals deal with it:**
  They don't solve it logically; they solve it *provisionally*.

  1.  **The Interim Agreement:** The current committee admits they are a "Provisional Steering Group." They state clearly: "We are setting these voting rules *only* for the purchase vote. The first act of the new Co-op Board will be to ratify or rewrite the membership charter."
  2.  **The Super-Majority Hedge:** If you are going to exclude a group (the renters), you require a higher threshold of approval from the included group (e.g., 80% of owners, not 51%). This acknowledges the lack of total legitimacy.
  3.  **The "Opt-In" Clause:** The vote proceeds with owners, but the charter includes a pre-negotiated path for renters to buy shares later. This buys peace now without surrendering control now.

  **For your novel:** Your character needs to recognize that the contradiction isn't a bug to be fixed, but a tension to be managed. If someone claims the process is "purely fair," they are lying. If someone claims the process is "purely corrupt," they are giving up. The work is in the messy middle.

  ### 3. The Character (The Retired Union Rep)

  You want the strongest version of each side, filtered through a woman who is sharp, tired, and allergic to sentiment. She shouldn't speak in ideals; she should speak in consequences. She knows that rights are just enforceable claims.

  Let's call her **Elena**. She's sitting in the community room, smoking (or chewing gum aggressively), looking at the draft rules.

  **Elena on the Owners' Side (To the Renters):**
  > "Don't look at me like I'm the landlord. I'm not. The bank is the landlord. Right now, the bank doesn't care if you're happy, they care if the wire hits on the 1st. The owners are the ones whose names are on the note. If the roof leaks, they pay. If the market tanks, they lose the shirt off their back. You want a vote? Fine. But a vote is a share of the debt. You want to vote on the budget, you put your name on the mortgage. If you aren't willing to lose the house, you don't get to decide how to buy it. That's not capitalism, that's arithmetic."

  **Elena on the Renters' Side (To the Owners):**
  > "You think you can vote them out and they'll just stay and pay rent? You're dreaming. You buy this place, you become the management. And management needs labor. Who fixes the toilet at 3 AM? Who keeps the ceramics kiln from burning the place down? If you treat them like tenants, they'll act like tenants. They'll call the city inspector when the wiring sparks. They'll withhold rent when the heat drops. You want a co-op? A co-op is a union of residents. If you build a castle with a moat inside the walls, don't be surprised when you drown in it. You need their hands, so you need their buy-in."

  **Elena's Verdict (The Synthesis):**
  > "Here's the truth. Neither of you is right. You're just negotiating power. The owners have the capital, the renters have the disruption. So here's the deal. Owners keep the veto on the sale, because they hold the deed. But the renters get a veto on the *charter*, because they hold the keys. You write a rule that hurts them, they lock the door. You write a rule that hurts the bank, you lose the building. So you write a charter that scares the bank less than it scares the renters. That's the only math that works."

  ### 4. What You Actually Think (For the Novel)

  You asked to know what you think before you have her say it. Here is my read on your position, based on how you framed the problem:

  You are suspicious of the "All Affected" argument because you know it leads to paralysis (the flour delivery guy). But you are equally suspicious of the "Equity" argument because you know it leads to oligarchy (the committee of five).

  You are likely a **Proceduralist**. You believe the outcome matters less than the mechanism of repair.

  In your novel, the scene shouldn't end with a vote. It should end with a *renegotiation of the process*. The Union Rep shouldn't solve the moral dilemma; she should expose the power dynamic.

  **The Plot/Life Bleed:**
  In your life, you are one of the five. You hold the pen. That is why you are spinning. You are complicit.
  In your novel, you have the luxury of making the Union Rep the one who speaks the truth. In life, you have to *be* the one who listens to her.

  **My advice for the scene:**
  Have the Union Rep shut down the moralizing. Have her tell the town (or the building) that they are arguing about *justice* when they should be arguing about *survival*.
  *   "Justice is what we write in the charter. Survival is whether there's a building left to put it in."

  **The Resolution:**
  The principled line is drawn at **Residency + Liability**.
  1.  **Residency:** You live there (excludes the flour guy, includes the renters).
  2.  **Liability:** You sign the note (excludes the renters from capital votes, includes owners).
  3.  **The Bridge:** Renters get voting rights on *living conditions* and a guaranteed path to equity. Owners get voting rights on *finance* and a guarantee of rent stability.

  If you write the scene where the characters realize they need two different voting tracks (Capital vs. Occupancy), you solve the plot.
  If you propose that in your Thursday meeting, you might solve the life problem.

  Or, at the very least, you'll stop throwing away the drafts. The contradiction isn't in the writing; it's in the world. Stop trying to resolve it logically. Let the characters live in the tension. That's where the story is.
