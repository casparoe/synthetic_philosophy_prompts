prompt: |-
  I'm a novelist — a few books out, nothing you'd have heard of, and I teach a workshop on Tuesday nights to pay for the boiler. I've got a problem that I genuinely can't tell if its a plot problem or a life problem, because at the moment it's both, and I keep flipping between them.

  I live in a converted warehouse, fourteen flats over a dead printing shop. The landlord wants out, and a group of us want to buy the building as a co-op before some developer turns it into short-term rentals. The catch is who decides. A committee of five of us — self-selected, basically the ones who kept showing up to the Thursday meetings — wrote a draft set of rules and stuck a copy in every mailbox, and the draft says only the eight owner-occupied flats vote on whether to go ahead, on the grounds that they're the ones with equity in the building. The renters are not thrilled. One family's been in 3B since about 2004, a woman runs a ceramics studio out of the ground floor, and there's a couple subletting 6A who are somehow the most organized people in the whole building. They say they're the ones who get evicted if it goes to a developer, they're the ones who've been patching the roof, and anyway we five wrote those rules in a group chat. And here's where my head starts to spin: whoever wins the vote in November gets to write the co-op charter, and the charter says who's a member, and members vote on who else gets to buy in, and on whether tenants get voting rights later. So the vote about who votes is being run by the people the current rules say get to vote, which is us five and the eight owners who are mostly also us five. My partner thinks I'm overthinking it. My friend Ravi says obviously everyone affected should get a vote. My dad says obviously only the people on the hook for the mortgage. Both sound airtight until I push on them — if affected is the test, the developer's affected, the neighborhood's affected, the guy who delivers the flour to the bakery downstairs is affected; if on the hook is the test, the renters are on the hook for the rent and the subletters are on the hook for the sublease, and my dad just says "that's different" and changes the subject.

  Meanwhile the novel is a small town on the coast where the year-rounders are voting on whether to let the summer people and the families who moved in over the last decade vote on a buyout of the fishing rights. Same shape, I'm fairly sure, and I've written three versions of that scene and thrown all of them away. So what I want from you isn't "be more inclusive, meetings are hard." I want the actual arguments. Is there a principled way to draw the line about who belongs in the decision, or is every answer just whoever's holding the pen deciding who counts? How do people who think about this for a living deal with the fact that the vote about who votes has to be organized by somebody who's already decided who counts — is that a real contradiction, or just an awkward fact you get past and how? And if you had to hand my character (retired union rep, sharp, tired, allergic to sentiment) the strongest version of each side for one scene, what would you have her say? I'd like to know what I actually think before I have her say it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** A published novelist (modest success), teaches workshops, lives in a converted warehouse co-op situation.
      *   **The Problem:** A conflict between "plot" and "life." The user is facing a real-life governance dilemma in their building (owners vs. renters/subletters regarding a co-op buyout) that mirrors the plot of their current novel (townspeople vs. summer people/fishermen regarding fishing rights buyout).
      *   **The Core Question:** Is there a *principled* way to decide who gets to vote on the future of a community (building/town), or is it just power determining legitimacy? How do political theorists/practitioners handle the "boundary problem" (who decides who decides)?
      *   **The Specific Ask:**
          1.  The actual arguments (principled boundaries).
          2.  How experts deal with the "vote about who votes" paradox (is it a contradiction or just awkward?).
          3.  Dialogue/arguments for a character (retired union rep, sharp, tired, allergic to sentiment) representing the strongest version of each side.
          4.  Goal: Help the user figure out what *they* think so they can write the scene.
      *   **Tone:** Intellectual, respectful, nuanced, not preachy ("I want the actual arguments," not "be more inclusive"). The user is a writer, so the language should be evocative but precise.

  2.  **Deconstruct the Political Theory (The "Boundary Problem"):**
      *   *The Problem:* This is known in political science as the "Boundary Problem" or the "Constituent Power Problem" (Who constitutes the *demos*?).
      *   *Key Theorists:* Frederick Whelan, Robert Dahl, Carol Gould.
      *   *Principles of Inclusion:*
          1.  **All Affected Interests (AAI):** Everyone impacted by the decision should have a say. (Ravi's argument). *Critique:* Too broad (the flour delivery guy).
          2.  **All Subject to Coercion (ASC):** Everyone subject to the binding rules/laws. (Closer to the renters' argument).
          3.  **Stakeholder/Property:** Those with capital at risk. (Dad's argument).
          4.  **Membership/Community:** Those who identify as part of the group over time.
      *   *The Paradox:* You need a rule to decide the rule. This is the *pouvoir constituant* (constituent power) vs. *pouvoir constitué* (constituted power).
      *   *Resolution:* It's rarely solved philosophically; it's solved politically through negotiation, precedent, or force. It *is* a contradiction, but a productive one.

  3.  **Address the "Life vs. Plot" Connection:**
      *   Acknowledge the bleed. This is the "write what you know" trap where "what you know" is currently stressful.
      *   The fiction allows for a cleaner resolution (or a more tragic one) than real life.
      *   The user needs to separate the *ethics* from the *strategy*.

  4.  **Drafting the Arguments (for the User and the Character):**
      *   *Side A (The Owners/Equity):* Risk, liability, long-term commitment. If the co-op fails, they lose the house. Renters can leave.
      *   *Side B (The Renters/Residents):* Displacement, community continuity, labor. They maintain the building. Excluding them creates a class system within the co-op.
      *   *Side C (The Union Rep Character):* She needs to cut through the moralizing. Focus on *leverage* and *solidarity*. A co-op with hostile tenants is a failed co-op. But a co-op with no capital is a dream.

  5.  **Refining the "Vote About Who Votes" Paradox:**
      *   Is it a contradiction? Yes.
      *   Is it fatal? No.
      *   How is it handled? Provisional agreements. "We vote now on this temporary rule, with the understanding that the Charter will ratify it." It's a handshake before the contract.
      *   *Key Insight:* Legitimacy comes from the *process* being accepted, not just the *rule* being logical.

  6.  **Developing the Character Voice (Retired Union Rep):**
      *   Name: Let's call her "Marge" or just "the Rep."
      *   Voice: Cynical but practical. No jargon. Short sentences. Focus on power dynamics.
      *   Argument 1 (Owners): "Skin in the game."
