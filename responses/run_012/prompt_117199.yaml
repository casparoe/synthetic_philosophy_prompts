prompt: |-
  A student in my metaethics seminar has an arguement she thinks turns Williams's integrity objection into a proof that no moral theory with a general criterion can be true, and I can't decide whether it's a real result or a trick of phrasing. It goes:

  (1) A moral theory's job is to say what an agent may and must do.
  (2) If the theory has a general criterion of right action, then what justifies the agent's act is, at bottom, that the criterion selects it.
  (3) So when the man saves his wife rather than the stranger, if his reason is just that she's his wife, the theory will ask what makes that enough; and the answer has to come from the criterion (partiality is permitted, or the act maximizes the good). His justifying thought has to be, at least implicitly, a thought about the criterion.
  (4) So the theory treats his attachment to her as not justifying anything on its own — it needs the criterion to back it.
  (5) That's Williams's complaint about the wife case: the theory wants one thought too many.
  (6) But nothing in (1)-(5) is about consequentialism in particular. Any theory that sorts acts by a general criterion does this, agent-relative theories included.
  (7) So the objection, if it lands, refutes every general moral theory; and a charge that convicts every theory isn't an objection to any of them. Which leaves either that Williams is just describing what it is to have a theory at all, or that there can be no general theory.

  She also says the wife case is a distraction — swap in a man whose deepest project is famine relief and she claims the argument runs identically — which I think is either the sharpest thing she's said or a sign something broke upstream. Where's the break? I'd like to keep (5), since I think Williams is onto something real, but (7) is absurd. And if you tell me the whole thing never gets off the ground, tell me what the agent's justification is supposed to be instead, because it can't just be that she's his wife with nothing behind it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Student's Argument:**
      *   **Premise 1:** Moral theory's job = prescribe action (may/must).
      *   **Premise 2:** If a theory has a *general criterion*, justification bottoms out in the criterion selecting the act.
      *   **Premise 3:** In the wife/stranger case, if the agent acts because "she's my wife," the theory demands a further justification via the criterion (e.g., "partiality is good"). Thus, the agent's thought must implicitly reference the criterion.
      *   **Premise 4:** Therefore, the attachment itself doesn't justify; the criterion justifies the attachment's weight.
      *   **Premise 5:** This is Williams's "one thought too many" objection.
      *   **Premise 6:** This applies to *any* theory with a general criterion (Consequentialism, Deontology, Agent-Relative, etc.).
      *   **Conclusion (7):** Therefore, the objection refutes *all* general moral theories. Since a charge that convicts everyone convicts no one (or implies theory is impossible), either Williams is just describing theory *per se*, or no general theory is possible.
      *   **Side Claim:** The specific content (wife vs. famine relief) doesn't matter; the structure is the same.

  2.  **Evaluate the Strengths and Weaknesses:**
      *   *Strength:* It correctly identifies that Williams's objection targets the *structure* of impartial moral theorizing, not just consequentialism. It captures the alienation worry.
      *   *Weakness:* It conflates the *theorist's justification* with the *agent's justification*. It assumes that for a theory to be true, the agent must consciously (or implicitly) employ the theory's criterion in their deliberation. It misunderstands the role of "grounding" vs. "motivating/reasoning."
      *   *The "Break":* The break is likely at (2) and (3). Just because a theory *validates* a reason doesn't mean the agent must *cite* the validation as their reason.

  3.  **Address the Specific Constraints:**
      *   The user wants to keep (5) (Williams is onto something real).
      *   The user thinks (7) is absurd.
      *   The user wants to know where the break is.
      *   The user wants to know what the agent's justification *is* if it's not just "she's my wife" with nothing behind it (avoiding brute intuitionism?).

  4.  **Drafting the Response - Step-by-Step:**

      *   **Validate the Student:** Acknowledge that this is a sophisticated reading. It's not a "trick of phrasing" in a cheap sense; it pushes Williams to a radical conclusion (anti-theory). Many philosophers (e.g., McNaughton, Rawls on the distinction between justification and deliberation) have traveled this road.
      *   **Locate the Break:** The critical error is in **Premise (3)** and the inference to **(4)**.
          *   *Distinction:* **Criteria of Rightness** vs. **Decision Procedures**.
          *   A theory can say "Saving your wife is right *because* it falls under a protected sphere of personal relationships" (Criterion) without requiring the agent to think "I am saving her because this falls under the protected sphere..." (Deliberation).
          *   Williams's objection isn't that the theory *exists*; it's that the theory demands the *agent's perspective* align with the *theorist's perspective*.
      *   **Address the "One Thought Too Many":**
          *   Williams isn't saying the agent *cannot* have a theory. He's saying the *moral demand* to have that thought corrupts the relationship.
          *   The student argues that *any* theory requires this thought. The counter is: A good theory explains *why* the thought "she's my wife" is sufficient without requiring the agent to think the explanation.
      *   **Address the "Famine Relief" Swap:**
          *   This is the weakest part of the student's argument.
          *   Williams's point is about *ground projects* and *integrity*.
          *   If the project is famine relief, acting *for* famine relief is direct.
          *   If the project is loving a wife, acting *for* the theory *about* loving a wife is alienating.
          *   The structural symmetry the student claims isn't there. One is a moral project (potentially), the other is a constitutive personal commitment.
      *   **Address the "Justification" Question:**
          *   The user asks: "What is the agent's justification supposed to be instead?"
          *   Answer: The justification is the relationship itself. It's not "brute" in the sense of random; it's *constitutive*. To ask "Why love her?" is to misunderstand what love is.
          *   Distinguish **External Justification** (Theorist to Agent: "You are permitted") vs. **Internal Reason** (Agent to Self: "I love her").
          *   The theory's job isn't to generate the reason, but to *recognize* it.
      *   **Refuting (7):**
          *   (7) claims if it applies to all theories, it refutes none.
          *   Counter: It might refute the *ambition* of theory to capture the first-person perspective. It doesn't mean no theory is true; it means no theory can fully replace the agent's standpoint.
          *   Or, it means we need a theory that *builds in* this gap (e.g., a pluralistic intuitionism or a specific kind of contractualism that respects the "personal point of view").

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Caution:* Don't just say "Rule Utilitarianism solves this." Williams would say that still adds the thought.
      *   *Focus:* The distinction between the **context of justification** (philosophical) and the **context of action** (psychological/deliberative).
      *   *The Student's Trap:* The student assumes that if $X$ justifies $Y$ objectively, the agent must know $X$ to be justified in doing $Y$. This is false. (Analogy: I am justified in taking medicine because it cures me. I don't need to know the biochemistry to be justified in taking it, though I do need to want to be cured.)
      *   *Wait, is that right?* In morality, reasons need to be accessible. But Williams's point is about the *content* of the reason, not access. The content "she is my wife" is accessible. The content "maximizing utility permits partiality" is the "one thought too many."
      *   *The Real Break:* Premise (2). "What justifies the agent's act is, at bottom, that the criterion selects it." This is true for the *theorist*, but false for the *agent*. The agent is justified by the reasons *within* the criterion's permitted scope, not the scope itself.

  6.  **Structuring the Reply:**
      *   **Introduction:** Validate the student. This is a known "Anti-Theory" move (Clarke, McNaughton, Williams himself later).
      *   **The Break (Premise 3 & 2):** Distinguish Criteria of Rightness from Deliberative Reasons. The theory validates the reason "She is my wife"; it doesn't replace it.
      *   **The "Famine Relief" Swap:** Explain why this fails. Integrity involves projects that define the self. Some projects are moral, some are personal. Collapsing them destroys the personal ones.
      *   **The Justification Question:** Explain "Constitutive Reasons." The relationship *is* the reason. The theory's role is negative (don't forbid it) or protective (shield it), not generative.
      *   **Conclusion on (7):** It doesn't prove no theory is possible; it proves theory has limits. It refutes *reductive* theories, not necessarily all normative structures.

  7.  **Final Polish:** Ensure the tone is appropriate for a professor discussing a seminar student's argument (collegial, precise, philosophical). Make sure to explicitly answer the "what's the justification instead" prompt.

      *(Self-Correction during drafting)*: I need to be careful not to defend Consequentialism. The student is right that Williams attacks the *form* of impartial theory. I need to show why that doesn't lead to "no theory is possible" but rather "theory must respect the gap."
      Actually, the student's conclusion (7) is "Either Williams is describing theory per se, or there can be no general theory." This is actually a defensible position (Anti-Theory). But the user wants to keep (5) and reject (7). So I need to show why (7) doesn't follow even if (1)-(6) are mostly right.
      The key is that (2) is ambiguous. "Justifies" can mean "makes objectively right" or "provides the motivating reason." Williams attacks the conflation of these. If we separate them, (7) fails.

      *Revised Plan:*
      1. Acknowledge the sophistication (Anti-Theory tradition).
      2. Identify the equivocation in (2) and (3) between *truth-makers* and *reasons*.
      3. Explain why the Famine Relief swap fails (Integrity vs. Morality).
      4. Answer the justification question (Constitutive vs. Instrumental).
      5. Show how to save Theory without losing Williams.

  8.  **Final Review against constraints:**
      *   Keep (5)? Yes.
      *   Reject (7)? Yes.
      *   Explain justification? Yes.
      *   Locate the break? Yes (Premise 2/3 equivocation).

