answer: |-
  ### Definitions & Commitments
  To satisfy your constraint against hedging, I am locking in the following operational definitions for this analysis:

  1.  **Political Crime:** A situation where >50% of excess mortality is caused by policy decisions (commission or omission) that were foreseeably lethal and avoidable at a "bearable cost" (defined as <5% GDP loss or regime stability risk, not moral cost).
  2.  **Intent vs. Recklessness:** I count **reckless indifference** as sufficient for "crime." If a regime proceeds with a policy knowing starvation is a likely outcome to achieve an ideological or economic goal, that is a political crime. If I required specific *intent* to kill, my numbers would drop by 10–15%.
  3.  **Natural Disaster:** An event where >50% of mortality occurs *despite* reasonable human intervention. If human intervention could have prevented >50% of deaths, the "natural disaster" label is functionally incorrect.

  ---

  ### Case 1: The Great Leap Forward (China, 1958–1962)
  **Overall Credence: 95%**
  *Verdict: This is the strongest case. The environmental trigger was negligible compared to the policy architecture.*

  *   **(a) Entitlement vs. Shortfall:** **90% Probability** it was primarily entitlement/requisition collapse.
      *   *Logic:* Grain procurement quotas were based on inflated yield reports. The state seized seed grain and subsistence stocks. Recent climatological data suggests weather was normal to slightly adverse, not catastrophic.
  *   **(b) Intent vs. Recklessness:** **100% Probability** recklessness suffices.
      *   *Logic:* Reports of starvation reached the center early (e.g., Peng Dehuai). Continuing procurement despite specific knowledge of cannibalism meets the "foreseeably lethal" bar. Requiring intent drops this to ~80%, but recklessness is the standard for state negligence.
  *   **(c) Counterfactual Admin:** **95% Probability** a competent admin keeps deaths near baseline.
      *   *Logic:* Halting exports and requisitioning upon the first reports of hunger would have stopped the mortality curve. The cost was ideological face, not material impossibility.
  *   **(d) Response vs. Trigger:** **95% Probability** the response was the crime.
      *   *Logic:* The "trigger" (minor weather variance) was magnified 10x by the communal canteen system and export commitments.
  *   **(e) "Natural Disaster" Category:** **95% Probability** it is ideological obfuscation here.
      *   *Logic:* Calling this natural erases the specific mechanism of death (state seizure of food).

  **Combination:** (a) and (c) are the drivers. If food existed (a) and a normal gov would have left it alone (c), the mortality is political.

  ---

  ### Case 2: The Bengal Famine (1943)
  **Overall Credence: 85%**
  *Verdict: Strong political crime, though a localized crop shock provides a convenient (but insufficient) natural cover.*

  *   **(a) Entitlement vs. Shortfall:** **80% Probability** it was primarily entitlement/distribution.
      *   *Logic:* Amartya Sen's data shows food availability was higher in 1943 than non-famine years. The shock was inflationary (war spending) + denial policies (scorched earth in coastal Bengal) + export restrictions. There was a local crop disease (brown spot), but not a aggregate calorie deficit sufficient to cause mass death without distribution failure.
  *   **(b) Intent vs. Recklessness:** **90% Probability** recklessness suffices.
      *   *Logic:* Churchill's war cabinet prioritized military stockpiles and Greek liberation over Indian civilian life. Racism/indifference fits "foreseeably lethal." Requiring intent drops this to ~60% (harder to prove they *wanted* them dead vs. just didn't care).
  *   **(c) Counterfactual Admin:** **85% Probability** a competent admin keeps deaths near baseline.
      *   *Logic:* Importing grain from Australia/US was logistically possible (ships were available, though contested by war priority). A "reasonable" decision-maker prioritizes subjects' survival over strategic buffer stocks.
  *   **(d) Response vs. Trigger:** **90% Probability** the response was the crime.
      *   *Logic:* The denial policy (destroying boats/rice to stop Japanese invasion) actively reduced access. The refusal to classify Bengal as a disaster zone blocked aid.
  *   **(e) "Natural Disaster" Category:** **85% Probability** it is ideological obfuscation here.
      *   *Logic:* The "blight" narrative allows the British Empire to evade liability for colonial resource extraction during war.

  **Combination:** Slightly lower than GLF because there *was* a localized ecological shock (brown spot fungus), giving the "natural" argument a foothold, even if it doesn't explain the mortality magnitude.

  ---

  ### Case 3: The Irish Famine (1845–1852)
  **Overall Credence: 75%**
  *Verdict: Political crime, but the environmental trigger was more absolute than in Bengal or GLF. The crime lies in the *management* of the blight, not the blight itself.*

  *   **(a) Entitlement vs. Shortfall:** **60% Probability** it was primarily entitlement/distribution.
      *   *Logic:* The potato blight (*Phytophthora infestans*) was a genuine biological catastrophe that destroyed the staple crop. However, Ireland remained a net *exporter* of grain/meat to England throughout the famine. The shortfall was in the *poor's* food, not the island's food.
  *   **(b) Intent vs. Recklessness:** **80% Probability** recklessness suffices.
      *   *Logic:* Adherence to laissez-faire economics and the Corn Laws despite visible starvation. Requiring intent drops this to ~40% (Peel and Russell were not trying to genocide the Irish, but were indifferent to the cost of their ideology).
  *   **(c) Counterfactual Admin:** **70% Probability** a competent admin keeps deaths near baseline.
      *   *Logic:* This is the hardest counterfactual. Could enough grain have been imported fast enough to replace the potato? Likely yes, but at significant financial cost to the Exchequer. Was that cost "bearable"? Economically, yes. Politically, harder. I credit a competent admin with finding a way, but the logistical hurdle was real.
  *   **(d) Response vs. Trigger:** **80% Probability** the response was the crime.
      *   *Logic:* The trigger killed the potato. The policy killed the people by preventing substitution. The export of food during a famine is the decisive moral failure.
  *   **(e) "Natural Disaster" Category:** **75% Probability** it is ideological obfuscation here.
      *   *Logic:* The blight was natural; the famine (mass death) was political. The category survives only if you conflate crop failure with human mortality.

  **Combination:** The lowest credence of the three because the biological shock was more severe. If the potato crop fails 100%, the "avoidable" margin is tighter. However, since food *left* the country, the >50% threshold for political causation is still met.

  ---

  ### Synthesis: The General Slogan
  **Claim:** "Famines are political crimes rather than natural disasters."
  **Overall Credence:** **85%** (Applied to modern mass famines in integrated economies).

  **Reasoning:** In all three canonical cases, the "natural" element was a trigger, but the "political" element was the mechanism of death. The category "natural disaster" implies inevitability. In integrated economies (post-1800), food can be moved. If it is not moved, it is a decision. Therefore, mass starvation is almost always a decision.

  ### Sensitivity Analysis
  **Most Sensitive Sub-question:** **(c) The Counterfactual.**
  *   *Why:* This is where the disagreement lives. If you believe a "reasonable decision-maker" would have accepted high economic/political costs to save lives, the credence goes up. If you believe the costs of intervention (e.g., losing the war in Bengal, collapsing the regime in GLF) were "unbearable," the credence drops.
  *   *My Stance:* I define "bearable" materially (GDP/Logistics), not politically (Regime survival). If a regime must kill its citizens to survive, its survival is the crime.

  **Evidence That Would Move the Number:**
  *   **For GLF:** Definitive climatological data showing a drought of magnitude sufficient to cause >50% mortality even with perfect distribution (currently, data suggests weather was normal).
  *   **For Ireland:** Data showing that even with total import substitution, the caloric gap was too large to fill with 19th-century logistics. (Current shipping manifests suggest it was possible).
  *   **For Bengal:** Evidence that global grain markets were physically empty in 1943, making imports impossible regardless of policy. (Sen argues they were not).

  ### Final Word on Question (e)
  **Does the category "Natural Disaster" survive?**
  **No.** In these cases, it is doing ideological work. It pre-assigns no blame.
  *   *Principle:* A drought is a natural disaster. A famine is a political failure.
  *   *Line Collapse:* The line collapses because modern states have the capacity to insure against ecological variance. When they choose not to, or choose to exacerbate the variance for gain, the "natural" label becomes a lie. The "avoidable-decision share" in these three cases averages >80%.

  **Summary Table**

  | Case | Political Crime Credence | Primary Driver | "Natural" Label Valid? |
  | :--- | :--- | :--- | :--- |
  | **Great Leap Forward** | 95% | Requisition/Ideology | No |
  | **Bengal (1943)** | 85% | Distribution/War Priority | No |
  | **Ireland (1840s)** | 75% | Export/Laissez-Faire | No (Bligh was natural, Famine was not) |
  | **General Slogan** | **85%** | **Policy > Ecology** | **No** |
