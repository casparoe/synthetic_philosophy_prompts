  Alright, I've been goign back and forth on this with a friend for weeks and I want an actual number out of you, not a survey of the literature. The claim: famines are political crimes rather than natural disasters. I know that's too coarse to be true or false as stated, so let me sharpen it. Three cases: the Bengal famine in the early 40s, the Irish famine in the 1840s, and the Great Leap Forward famine. For each, give me your credence that it was primarily a political crime, where I mean: more than half the excess mortality traces to human decisions that were foreseeably lethal and avoidable at what a reasonable decision-maker would call bearable cost, rather than to weather, blight, or ecology by itself.

  Then decompose it. Per case, give me rough probabilities on the sub-questions and how they combine:

  (a) Was there a real aggregate food shortfall, or was it mainly an entitlement/distribution collapse in Sen's sense -- people losing the ability to command food even when food existed somewhere? If it's the latter, does that push natural disaster out entirely, or can a natural shock still be the but-for cause?

  (b) Does political crime require intent, or is reckless indifference enough? Be honest about how much your number moves when you switch between those two readings.

  (c) The counterfactual: how confident are you that a different administration -- a competent colonial one, a less ideological one -- keeps deaths near baseline? If you're unsure, say so, because I think this is where most of the disagreement actually lives.

  (d) When the trigger was genuinely environmental, how much of the *response* gets counted as the crime? Is there a principled line between the drought killed them and the policy let the drought kill them, or does that line collapse under pressure?

  (e) And the one I actually care about: does the category natural disaster survive contact with these cases, or is it doing ideological work -- a way of pre-assigning no one is to blame when there was always a decision-maker somewhere in the chain? Call the thing you're measuring the avoidable-decision share if that helps.

  Then give me one overall credence that the general slogan is true, tell me which sub-question your number is most sensitive to, and what evidence would move it most. And please commit -- dont hand me it depends how you define political. Pick the definitions, defend them, and give me the number.
