      *   **The Question:** Is "pleasure" a single homogeneous quantity (requiring interpersonal comparison) or a shorthand for individual utilities? Does the "Calculus of Pleasure and Pain" commit Jevons to interpersonal comparisons? If not, how do we reconcile the "problem of Economics" (maximizing pleasure) with the methodological individualism?
      *   **Constraint:** Close reading, not general survey. Address the specific textual tension.

