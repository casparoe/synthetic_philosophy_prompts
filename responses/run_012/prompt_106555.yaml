answer: |-
  This is an excellent close reading. You have identified a genuine tension in the text that stems from Jevons's dual inheritance: he is trying to build a rigorous, mathematical science of exchange while simultaneously grounding it in the moral philosophy of Benthamite Utilitarianism.

  The short answer is: **No, Jevons does not require interpersonal comparisons of utility to construct his theory of exchange, nor does the phrase "Calculus of Pleasure and Pain" commit him to them in this context.** The appearance to the contrary arises because he uses "Pleasure" in two different registers: first as a **philosophical anthropology** (what motivates humans generally), and second as a **technical variable** (what the individual trader calculates).

  Here is a close reading of how Jevons resolves this tension within the logic of the *Theory*.

  ### 1. The "Problem of Economics": Agent vs. Analyst
  Your difficulty hinges on the sentence: *"To satisfy our wants to the utmost... is the problem of Economics."*

  If this is the *economist's* problem, then yes, the economist would need to sum pleasures across persons to solve it. But if you read the subsequent chapters, specifically the Theory of Exchange, it becomes clear that Jevons defines this as the **economic agent's problem**, which the economist merely observes and models.

  When Jevons writes that the problem is "to maximise pleasure," he is describing the *axiom of human action*, not the *task of the social planner*. He is establishing that every individual acts *as if* they are solving a maximization problem. The "Calculus" is therefore not a global accounting ledger kept by the economist, but a description of the mental arithmetic performed by the trader.

  *   **Textual Evidence:** Immediately following your quoted passage, Jevons moves to discuss the "individual." He writes, "Each individual is the best judge of his own pleasures and pains." This shifts the locus of the calculation from a central authority (which would require interpersonal comparison) to the decentralized agent (which requires only intrapersonal comparison).

  ### 2. "Pleasure" as Homogeneous Within, Heterogeneous Across
  You ask if "pleasure" is a single homogeneous quantity or a family of quantities. Jevons's answer is subtle: **It is homogeneous within a single mind, but incommensurable across minds.**

  Jevons needs homogeneity *within* the mind to make the calculus work. For the marginal utility equation to hold ($MU_x / P_x = MU_y / P_y$), the utility derived from $x$ and $y$ must be reducible to a common denominator *for that specific agent*. That common denominator is "pleasure" or "utility."

  However, the clause you identified—"**provided that the will or inclination of the person immediately concerned is taken as the sole criterion**"—acts as a firewall. It prevents the homogeneity from extending across persons.
  *   **Why?** Because if my inclination is the *sole* criterion for my utility, and yours is the *sole* criterion for yours, there is no third, objective "pleasure-meter" to compare the two.
  *   **The Result:** "Pleasure" in the opening sentence is indeed a shorthand for a **family of quantities**. It is a generic label for the variable $u$ in the function $u = f(x)$, where the function $f$ is unique to every individual.

  ### 3. The "Calculus" is Structural, Not Substantive
  When Jevons calls economics a "Calculus of Pleasure and Pain," he is not claiming we can add your pleasure to mine. He is claiming that the **structure of choice** is identical for all of us.

  The "Calculus" refers to the logic of the margin. It is the mathematical form of the decision-making process (equating marginal utility to price, or equating marginal utilities across goods), not the summation of the resulting utility values across society.
  *   **The Appearance of Aggregation:** The phrase carries the weight of Bentham's "greatest happiness principle." Jevons invokes this to give economics a moral foundation and a universal motive force. He wants to say, "Everyone is doing the same kind of thing (maximizing)."
  *   **The Reality of the Theory:** Once the theory gets to work (Chapter IV, Theory of Exchange), the "Calculus" dissolves into a system of simultaneous equations where each equation represents a distinct mind. The market clears not because total pleasure is maximized globally, but because every individual has exhausted their own opportunities for gain.

  ### 4. How Exchange Works Without Interpersonal Comparison
  You noted that Jevons builds exchange out of each trader's own schedule. This is the proof that he does not need interpersonal comparison.

  In Jevons's theory of exchange (the famous "trading body" analysis), trade occurs because of a **double inequality of valuation**, not a comparison of total pleasure.
  *   Trader A values Good X less than Good Y (at the margin).
  *   Trader B values Good X more than Good Y (at the margin).
  *   They trade until their marginal ratios align with the price ratio.

  At no point does Jevons ask, "Did A gain more pleasure than B lost?" or "Did the total pleasure of the system increase?" He only requires that *A* feels better off by *A's* scale, and *B* feels better off by *B's* scale. The "maximisation of pleasure" mentioned in your opening quote is satisfied if **every individual maximizes their own function**, subject to the constraint of exchange.

  ### 5. Where the Confusion Comes From
  The appearance that Jevons requires interpersonal comparison stems from two sources in the text:

  1.  **The Benthamite Preamble:** Jevons is writing in 1871. It was intellectually difficult to discuss "utility" without invoking the Utilitarian ethic, which *does* presuppose interpersonal comparability for legislative purposes. Jevons borrows the *vocabulary* of legislation ("the problem of Economics") but applies it to the *mechanics* of the market. He does not explicitly flag this shift in register as clearly as a modern text would.
  2.  **The Word "Ultimate":** When he says pleasure and pain are the "ultimate objects," he implies a teleological end. If there is one "End," it tempts the reader to assume there is one "Measure." But Jevons treats the End as universal (everyone seeks pleasure) while treating the Measure as private (only I can measure mine).

  ### Conclusion
  To answer your specific questions:

  *   **Is "pleasure" a single homogeneous quantity?** No. It is a generic name for the objective function of every individual agent. It is homogeneous *intra-personally* (allowing me to compare bread vs. coal), but not *inter-personally*.
  *   **Does "Calculus of Pleasure and Pain" commit him to interpersonal comparisons?** No. It commits him to the view that human behavior follows a calculable logic of trade-offs. The "Calculus" is the method of the agent, not the auditor.
  *   **Whose pleasure is being maximised?** Each person's, individually. The "Problem of Economics" is solved when the system reaches an equilibrium where no individual can further maximize their own pleasure through exchange.
  *   **Where does the appearance to the contrary come from?** It comes from Jevons's failure to fully decouple his **moral philosophy** (Benthamism, which aggregates) from his **positive science** (Marginalism, which individualizes). He uses the former to justify the universality of the motive, but relies on the latter to construct the mechanics.

  You are right to feel the pull of the text. Jevons is standing with one foot in the 18th-century moral philosophy of aggregate welfare and one foot in the 20th-century microeconomics of individual choice. But for the specific machinery of his exchange theory, the "sole criterion" clause you identified is the operative rule: the economist takes the individual's inclination as given and does not compare it to another's.
