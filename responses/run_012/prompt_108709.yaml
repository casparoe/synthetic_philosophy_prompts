  The practice you describe is not a monolith governed by a single logical rule, but a **division of epistemic labor** stabilized by institutional boundaries. To reconstruct the implicit theory committing this cluster of behaviors to coherence, we must view science not as a set of propositions with a uniform status, but as an ecosystem where different roles carry different evidentiary burdens.

  ### The Implicit Theory: Distributed Empiricism

  The practice presupposes a **hierarchical model of empirical constraint**. It assumes that the relation between theory and experience is not local (claim-by-claim) but systemic (network-wide).

  1.  **Relation between Theory and Experience:** The practice assumes that while not every scientific claim must be directly testable *now*, the *system* of claims must be anchored to observation *eventually*. The psychology department manages the "periphery" of the network, where claims are cashed out immediately in data to ensure rigor and replicability. The physics department manages the "core" or "leading edge," where claims are buffered from immediate refutation to allow for mathematical unification and theoretical development.
  2.  **Answerability:** A claim is answerable to evidence if it plays a role in a network that *ultimately* yields empirical consequences. String theory is answerable not because it is currently falsifiable, but because it is mathematically constrained and purportedly describes the same physical world as the Standard Model. Pre-registered hypotheses are answerable because they are the designated cash-out points for that network.
  3.  **Demarcation:** The practice treats the line between science and pseudoscience as **institutional and gradient**, not logical and sharp. However, for the purpose of public policy (the curriculum), it projects a **sharp, logical boundary** (falsifiability) to simplify legal and pedagogical defense.

  ### Strict Presuppositions vs. Comfortable Fits

  We must separate what holds the practice together from what merely decorates it.

  *   **Strictly Presupposed:** **Systemic Empirical Accountability.** The practice collapses if the entire network loses its connection to observation. If the physics department admitted their models would *never* constrain observation, they would be reclassified as mathematics. If the psychology department admitted data was irrelevant to theory choice, they would be reclassified as humanities. The practice *requires* that evidence acts as a final arbiter somewhere in the system.
  *   **Merely Fits:** **Local Falsifiability.** The curriculum rule claims that *every* scientific topic must issue in testable predictions. This is inconsistent with the physics department's tolerance of string theory. Therefore, local falsifiability is not a strict presupposition of the *actual* scientific practice; it is a **rhetorical fit** used for political demarcation. It fits the need to exclude religious claims (which often claim immunity from evidence entirely) but does not accurately describe the internal logic of high-energy physics.
  *   **Merely Fits:** **Pure Fruitfulness.** Conversely, the physics justification ("it's fruitful/unifying") cannot stand alone. If fruitfulness were the only criterion, astrology could claim to be "unifying" or "progressive." The practice rules out pure coherentism; fruitfulness only counts if it is fruitfulness within an empirically anchored program.

  ### Philosophical Underdetermination

  The practice is philosophically underdetermined between two major accounts, both of which license the behavior you observe:

  1.  **Lakatosian Methodological Falsificationism:** This view distinguishes between the "hard core" of a research program (protected from refutation) and the "protective belt" (where testing happens). This perfectly maps onto your physics (core) vs. psychology (belt) distinction. The curriculum rule is a simplified heuristic for identifying programs that have degenerated (like ID) versus those that are progressive.
  2.  **Social Epistemology / Community Norms:** On this view, science is defined by the norms of the community (e.g., pre-registration, peer review, openness to critique). String theory is science because the community treats it as a serious candidate for physical truth subject to mathematical and eventual empirical critique. ID is excluded because it violates the norm of submitting to naturalistic explanation.

  Both accounts license the same behavior: tolerate high-level theory, demand low-level rigor, and police the boundary politically. The practice does not distinguish between them.

  ### Evaluating the Candidates

  *   **Strict Falsificationism:** **Ruled Out.** The physics department's continued funding and prestige despite the lack of refutable predictions in string theory demonstrates that the practice does not strictly presuppose Popperian falsifiability for every claim. If this view were enforced, half of theoretical physics would be defunded.
  *   **Long-run Fruitfulness (Lakatos):** **Compatible.** This view accommodates the physics department (progressive problem shifts) and the psychology department (protecting the empirical base). It explains the curriculum rule as a heuristic for identifying "degenerating" programs.
  *   **Method/Community/IBE:** **Compatible.** This view explains the pre-registration norm (community rigor) and the string theory tolerance (inference to the best explanation regarding unification).

  **Inconsistency:** The only internal inconsistency lies in the **curriculum rule's claim to sufficiency**. It states falsifiability is the *reason* for demarcation. But since the university tolerates unfalsifiable theories internally, the rule is demonstrably false as a philosophical account. It is doing **rhetorical work** (providing a clear legal standard) rather than **philosophical work** (describing actual scientific reasoning).

  ### The Cost of Swapping Views

  If we swapped the presupposed view (Distributed Empiricism/Lakatos) for a rival:

  1.  **Swap to Strict Falsificationism:**
      *   *Curriculum:* Unchanged.
      *   *Referee Report:* String theory papers rejected as unscientific.
      *   *Methods Course:* Unchanged.
      *   *Loss:* We lose the ability to pursue unified theories that precede technological capacity. Science becomes myopic, unable to invest in long-term theoretical infrastructure.
  2.  **Swap to Pure Coherentism/IBE (No Empirical Anchor):**
      *   *Curriculum:* Collapses. Intelligent Design could argue it offers the "best explanation" for complexity. The legal defense fails.
      *   *Referee Report:* Mathematical elegance becomes the only standard.
      *   *Methods Course:* Pre-registration becomes optional; exploration is elevated to theory-building.
      *   *Loss:* We lose the constraint that prevents science from becoming mere storytelling. Public trust erodes as "science" no longer guarantees a connection to observable reality.

  ### Conclusion

  The practice holds together because it treats **empirical accountability** as a distributed resource rather than a local property. It strictly presupposes that the enterprise must answer to the world, but it merely fits the demand that every single claim must do so immediately. The curriculum rule is a necessary political fiction, while the departmental practices are the epistemic reality.

  Verdict: Systemic Empirical Accountability -- strictly presupposed
