answer: |-
  This is a formidable request, precisely because it targets the fault line that split 20th-century analytic philosophy. As an experimentalist, you are asking for an operational definition of a distinction that many philosophers have declared obsolete. You want to know if "analyticity" is a feature of the world (or language) or an artifact of the apparatus (or philosophical tradition).

  Below is the specification sheet you requested. I have structured it as a set of engineering desiderata for a theory of the Analytic–Synthetic Distinction (ASD).

  ### Desiderata for a Theory of the Analytic–Synthetic Distinction

  #### I. Extensional Adequacy (The Cases)
  *The theory must correctly classify specific test cases. A theory that gets the math wrong is no good, but a theory that cannot explain why the math feels different from the zoology is also no good.*

  1.  **The Agreed Core:** Must classify "All bachelors are unmarried" and "All vixens are female" as analytic.
      *   *Status:* **Non-negotiable.** If a theory calls these synthetic, it is not a theory of the *analytic* distinction; it is an error theory.
  2.  **The Logical Tautologies:** Must classify "$P \lor \neg P$" as analytic (or logically true).
      *   *Status:* **Non-negotiable.**
  3.  **The Arithmetic Identity:** Must provide a principled verdict on "2 + 2 = 4".
      *   *Status:* **Non-negotiable.** (Verdict may be analytic or synthetic a priori, but cannot be "contingent empirical".)
  4.  **The Zoological Generality:** Must handle "All cats are animals."
      *   *Status:* **Non-negotiable.** (Historically analytic for Frege/Carnap; potentially synthetic for Putnam/Kripke. The theory must explain *why* it falls where it does, not just assert it.)
  5.  **The Chemical Identity:** Must handle "Water is H₂O" or "Gold is element 79."
      *   *Status:* **Non-negotiable.** (Must distinguish this from "Vixens are female" given that one is discovered by experiment and the other by dictionary.)
  6.  **The Incompatibility:** Must handle "No surface can be wholly red and wholly green at once."
      *   *Status:* **Non-negotiable.** (Is this logic? Meaning? Or metaphysical necessity?)
  7.  **The Disputed Boundary:** Must handle "All bodies are extended" vs. "All bodies have weight."
      *   *Status:* **Preference of one camp.** (Kant took the former as analytic; modern physics might treat mass/extension differently. A robust theory must explain the shift.)

  #### II. Intensional Clarity (The Definition)
  *The theory must define the distinction without cheating.*

  8.  **Non-Circularity:** Must state what makes a truth analytic without presupposing "synonymy," "necessity," or "a priori" unless those are independently defined.
      *   *Status:* **Non-negotiable.** (This is Quine's central challenge. If you define analytic as "true by meaning," you must define "meaning" without referencing analyticity.)
  9.  **Distinctness:** Must not collapse Analytic into Necessary, A Priori, Obvious, or Definitional by Convention.
      *   *Status:* **Non-negotiable.** (Kripke showed necessary truths can be synthetic ["Water is H₂O"]; obvious truths can be false. A theory that conflates these is descriptively inadequate.)
  10. **Binary vs. Graded:** Must specify if the distinction is a sharp line or a continuum.
      *   *Status:* **Preference of one camp.** (Traditionalists demand binary; Quineans and Cognitive Scientists often prefer graded/prototype structures.)

  #### III. Epistemological and Metaphysical Grounding
  *The theory must explain how we know these truths and what makes them true.*

  11. **Account of Knowledge:** Must explain how analytic truths are known (e.g., understanding meaning alone) and whether this mechanism is compatible with naturalism (cognitive science).
      *   *Status:* **Preference of one camp.** (Quineans demand naturalization; Rationalists allow irreducible rational insight.)
  12. **Truth-Makers:** Must specify whether analytic truths are made true by linguistic conventions, conceptual roles, or worldly structures.
      *   *Status:* **Non-negotiable.** (A theory must commit to an ontology.)

  #### IV. Scientific Utility and Holism
  *The theory must fit the actual practice of science, as you observed it.*

  13. **Constitutive vs. Empirical:** Must explain how to distinguish constitutive rules of a theory (definitions) from empirical claims within that theory.
      *   *Status:* **Non-negotiable.** (This is your primary motivation. Without this, the distinction does no work.)
  14. **Theory Change:** Must account for the historical fact that "constitutive principles" are often abandoned (e.g., "Atoms are indivisible" was once constitutive).
      *   *Status:* **Non-negotiable.** (If analytic truths cannot be false, how do we reject them without changing the subject?)
  15. **Quinean Holism:** Must not contradict the thesis that beliefs face experience as a corporate body and that any statement can be held true come what may, given drastic enough adjustments elsewhere.
      *   *Status:* **Preference of one camp.** (This is the Quinean dogma. Traditionalists reject it. However, given your request to accommodate the "history of science," this leans toward Non-negotiable for *your* purposes.)
  16. **Functional Utility:** The distinction must do more than label; it must predict where resistance to revision will occur or explain the structure of justification.
      *   *Status:* **Non-negotiable.** (If it doesn't do work, it is, as you say, merely relabeling.)

  ---

  ### The Exclusionary Requirement

  The single requirement that does the most to exclude candidate theories is **#8: Non-Circularity.**

  This is the weapon Quine wielded in *Two Dogmas of Empiricism*. Most traditional accounts define "analytic" as "true in virtue of meaning." But when pressed to define "meaning" or "synonymy," they inevitably rely on notions of "necessity" or "entailment," which themselves rely on analyticity. If you enforce strict non-circularity (demanding a reductive explanation in terms of behavior, stimulus, or physical facts), almost all pre-Quinean theories fail. If you relax it (allowing "meaning" as a primitive), you satisfy the Rationalists but alienate the Naturalists.

  ### The Jointly Unsatisfiable Pair

  You suspected that at least one pair of requirements is jointly unsatisfiable. You are correct. The tension that drives the entire debate is between:

  **Requirement #13 (Constitutive vs. Empirical)** and **Requirement #15 (Quinean Holism/Theory Change).**

  *   **The Tension:** To satisfy #13, the theory must posit a stable boundary between rules that *define* the terms (constitutive) and claims that *describe* the world (empirical). This implies that if you reject a constitutive rule, you are no longer talking about the same thing (you have changed the meaning).
  *   **The Conflict:** To satisfy #15 (and the historical reality of #14), the theory must acknowledge that scientists often reject constitutive rules (e.g., abandoning Newtonian mass definitions in Relativity) while claiming to be describing the *same* world, not just speaking a different language.
  *   **Why they are unsatisfiable:** If the distinction is real and sharp (#13), then theory change involving analytic truths is impossible without "changing the subject." If theory change is continuous and holistic (#15), then there is no stable set of constitutive rules, and the distinction dissolves into a matter of degree (how central a belief is to the web). You cannot have a **fixed architectural distinction** and **fluid holistic revision** simultaneously. One must give: either the distinction is real but science is discontinuous (meaning variance), or science is continuous but the distinction is an artifact of centrality (Quine).

  ### School Prejudices

  *   **Non-Circularity (#8):** This is a **Quinean/Naturalist prejudice.** A Rationalist (e.g., Grice, Strawson, or Chomsky) would argue that "meaning" is a legitimate primitive and demanding a behaviorist reduction is a "prejudice of the empiricist." They would mark this as merely a preference.
  *   **Quinean Holism (#15):** This is a **Quinean prejudice.** Logical Positivists and Kripkean Essentialists reject the idea that logical laws or analytic truths are revisable in light of experience. They would mark this as a preference, not a demand.
  *   **Binary vs. Graded (#10):** This is a **Cognitive Scientist/Quinean preference.** Traditional logic and Kantian philosophy demand a binary distinction.

  ---

  ### Assessment of Historical Programmes

  Here is how the two major contenders fare against your specification list.

  #### 1. The Logical Positivist Programme (Carnap, Ayer)
  *   **Performance:**
      *   **Passes:** Extensional Adequacy (mostly). They correctly classify "Vixens are female" and tautologies.
      *   **Passes:** Constitutive vs. Empirical (#13). This was their main goal (framework principles vs. internal questions).
      *   **Fails:** Non-Circularity (#8). Quine demonstrated they could not define "analytic" without relying on "synonymy," which they could not define without "analytic."
      *   **Fails:** Holism and Theory Change (#14, #15). They struggled to explain framework changes. If a framework is a set of linguistic conventions, abandoning it isn't discovering it was false; it's just choosing a new language. This makes scientific progress look like arbitrary switching rather than learning.
      *   **Fails:** Naturalization (#11). Their account of meaning was often platonic or reliant on unverifiable verification conditions.
  *   **Verdict:** It provides the **Utility** you want (distinguishing rules from claims) but fails the **Non-Circularity** and **Holism** constraints. It treats the distinction as real but cannot ground it without circularity.

  #### 2. Quine's Position (*Two Dogmas of Empiricism*)
  *   **Performance:**
      *   **Passes:** Non-Circularity (#8). By eliminating the distinction, he avoids the circular definition.
      *   **Passes:** Holism and Theory Change (#14, #15). His "web of belief" model perfectly captures the experimentalist's reality: any claim can be saved by adjusting the periphery, and even logic is revisable if the central tension is high enough.
      *   **Fails:** Constitutive vs. Empirical (#13). This is the casualty. For Quine, there is no *principled* difference, only a difference in degree of centrality. This denies you the sharp tool you want to separate definitional parts from empirical parts.
      *   **Fails:** Extensional Adequacy (#1-7). He treats "Vixens are female" as just a very central belief, not a different *kind* of truth.
      *   **Passes:** Naturalization (#11). Fits well with a behaviorist or cognitive science view of language learning.
  *   **Verdict:** It satisfies the **Metaphysical/Epistemic** constraints (Holism, Non-Circularity) but fails the **Utility** constraint (#16). It explains why the distinction is hard to draw by claiming it isn't there. For a scientist wanting to know if a principle is a definition or a law, Quine says: "It depends on how stubbornly you hold it."

  ### Final Summary for the Experimentalist

  You asked for a theory that illuminates how definitional parts stand to empirical parts.
  *   **The Positivists** give you the illumination but build the lamp out of circular wiring.
  *   **Quine** cuts the power to show you the wiring was faulty, leaving you in the dark.

  The unsatisfiable pair (#13 vs. #15) suggests that your desire for a **sharp, functional distinction** may be incompatible with a **realistic history of scientific theory change**. The most honest answer, based on the last 70 years of philosophy, is that the distinction is likely **graded** (a matter of centrality in the web of belief) rather than **binary**, but that for the local purposes of designing an experiment, treating certain principles as "constitutive" is a necessary heuristic, not a metaphysical truth. The distinction is not a feature of the world; it is a feature of the apparatus of inquiry, useful only so long as you do not look too closely at its mountings.
