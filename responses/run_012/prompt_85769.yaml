answer: |-
  **Essay Question**

  Standard aggregation cases ask whether many small harms to distinct people outweigh one catastrophic harm to a single person. This conflates two distinct questions: (1) Do small harms aggregate across *time* within a single life? and (2) Do harms aggregate across *persons*?

  **Part A:** Consider a "Single-Person Variant." One person suffers one dust-speck annoyance every day for fifty years. No other harms occur. Is this lifetime of annoyance morally comparable to one year of torture? Argue this case on its own terms, without referencing other people.

  **Part B:** Consider a "Chain Argument." Construct a sequence of scenarios starting with "One Year of Torture" and ending with "Fifty Years of Dust Specks." Each step in the chain differs from the previous one only marginally (e.g., reducing torture intensity slightly or adding a negligible number of specks). If A is worse than B, and B is worse than C, transitivity demands A is worse than C. Yet the start seems obviously worse than the end, while each step seems neutral.

  In a unified essay: First, determine if the Single-Person Variant generates the same intuitive resistance as the standard interpersonal case. Second, identify which premise the Chain Argument forces you to reject: the transitivity of "worse than," the existence of a threshold where specks become torture, or the judgment that adjacent steps are equal. Commit to one rejection and explain the theoretical cost of doing so.

  ***

  **Model Answer**

  The intuitive resistance to aggregating dust specks against torture relies heavily on the separateness of persons. When we isolate the harms within a single life, the aggregation problem loses its force, revealing that the core moral objection is interpersonal, not intrapersonal. However, accepting intrapersonal aggregation invites the Chain Argument, which threatens rational comparability. To preserve rational choice, we must accept lexical thresholds despite the cost of arbitrariness.

  In the Single-Person Variant, one individual endures a minor annoyance daily for fifty years. While no single instance is significant, the cumulative effect constitutes a substantial degradation of quality of life. A lifetime of constant, low-level irritation prevents deep focus, ruins leisure, and creates a background hum of suffering. It is coherent to argue this life is worse than a life containing one year of intense torture followed by forty-nine years of bliss. Crucially, this judgment does not require summing harms across different subjects. The victim is the same entity throughout; memory and psychological continuity bind the specks into a unified narrative of suffering. Therefore, the intuition that "specks don't add up" fails in the intrapersonal case. If we agree a lifetime of specks is bad, the resistance to the standard interpersonal case cannot be based on the magnitude of the harm alone. It must rest on the claim that harms to person A cannot simply be added to harms to person B to outweigh harms to person C. The separateness of persons is the active premise, not the non-aggregation of small harms.

  However, accepting that small harms aggregate intrapersonally exposes us to the Chain Argument. If we move from torture to specks via marginal steps—slightly less intense torture, slightly more specks—we face a sorites paradox. If each step is not worse than the previous, transitivity implies the final case (all specks) is not worse than the first (all torture). This contradicts our considered judgment that torture is uniquely catastrophic. We face a trilemma: reject transitivity, deny the adjacency judgment, or deny the endpoint judgment.

  Rejecting transitivity is too costly. It undermines the logic of "better than" required for decision theory. If "not worse than" is intransitive, we cannot rank options, and rational choice collapses. Denying the endpoint judgment (claiming specks are worse than torture) is implausible; it violates the qualitative distinction between agony and annoyance. Therefore, we must deny the judgment that adjacent steps are morally equal. We must assert that there is a specific point in the chain where a marginal increase in specks becomes worse than a marginal decrease in torture.

  This commitment incurs the cost of arbitrariness. There is no natural fact about the universe that marks the exact step where specks outweigh reduced torture. Any threshold we draw will seem precarious; removing one speck from the "worse" side makes it "better," which seems absurd for such a marginal change. This violates the principle of supervenience on natural properties, suggesting moral value jumps discontinuously. Yet, this cost is preferable to the alternative. Accepting a threshold preserves the qualitative distinction between types of suffering and maintains the transitivity required for rational action. We must accept that moral categories are sometimes lexical rather than continuous.

  Thus, the original aggregation puzzle dissolves when interpersonal separation is removed, but the structural problem of vagueness remains. The solution is to accept intrapersonal aggregation while defending lexical thresholds against the chain, paying the price of arbitrariness to save rational comparability.

  ***

  **Marking Scheme (20 Points)**

  | Criteria | Points | Typical Student Fumble |
  | :--- | :--- | :--- |
  | **1. Distinguishes Interpersonal vs. Intrapersonal**<br>Clearly identifies that the standard case conflates aggregation across persons with aggregation across time/experience. | 5 | Conflates the two issues, treating the single-person case as just a smaller version of the group case. |
  | **2. Analyzes Single-Person Variant**<br>Argues the single-person case on its own terms (psychological continuity, cumulative quality of life) rather than dismissing it as obvious. | 5 | Treats the single-person case as a trivial warm-up without explaining *why* aggregation works there. |
  | **3. Engages the Chain Argument**<br>Correctly identifies the threat to transitivity and the sorites structure of the step-wise comparison. | 5 | Describes the chain but fails to explain why it threatens rational choice or transitivity specifically. |
  | **4. Commits to a Cost**<br>Explicitly rejects one premise (transitivity, threshold, or adjacency) and articulates the specific theoretical cost (e.g., arbitrariness, irrationality). | 5 | Hedges by saying "it depends" or refuses to acknowledge the negative consequence of their chosen solution. |

  **Total:** 20 Points
