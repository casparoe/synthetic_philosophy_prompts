  **Value Judgments**
  **By Dr. Miriam Fisk**

  **Dear Dr. Fisk,**
  My broker is offering a single play of a coin game for fifty dollars. A fair coin is tossed until it lands tails. If tails appears on the first toss, I win two dollars; on the second, four dollars; on the third, eight dollars, doubling forever. The expected value is clearly infinite, but fifty dollars feels like a lot of cash to lose on one flip. Should I wire the money?
  **—Cautious in Chicago**

  **Dear Cautious,**
  You are suffering from a temporary confusion between price and value. The expected monetary value of this contract is the sum of each probability multiplied by its payoff, which yields one dollar per term across an infinite series. Since infinity exceeds fifty, purchasing the ticket is a strictly positive arbitrage regardless of the immediate cash outflow. If you lack the liquidity, mortgage your home to cover the entry fee, because refusing infinite expectation is financial suicide. Calculate cleanly, Dr. Miriam Fisk.

  **Dear Dr. Fisk,**
  I accept your math, but surely a dollar means less to a millionaire than to a pauper. Also, the casino holding the game only has one billion dollars in its vault; they cannot physically pay the infinite tail. Doesn't this cap the value and make risk aversion rational when my livelihood is on the line?
  **—Practical in Philadelphia**

  **Dear Practical,**
  Utility functions are subjective ghosts that have no place in a ledger; I advise on dollars, not feelings. Regarding the vault, solvency is a contractual obligation, not a mathematical limit; if they default, you sue for the infinite sum plus interest. Do not discount the tail events because they are rare, as rarity does not negate magnitude in an expectation calculation. Your livelihood is irrelevant to the arithmetic, so stop flinching and sign the contract. Calculate cleanly, Dr. Miriam Fisk.

  **Dear Dr. Fisk,**
  I bought twelve tickets based on your previous columns and I am down significantly. I tried to sell my remaining ticket to a colleague for twenty dollars, but he laughed at me. If the game is worth infinity, why is the market price so low and my realized return so negative?
  **—Bleeding in Boston**

  **Dear Bleeding,**
  The market is populated by risk-averse humans who incorrectly discount low-probability events, creating a mispricing you should exploit rather than accept. Twelve trials are statistical noise that convey no information about the convergence of the mean over infinite trials. You are experiencing variance, not error, so you must hold the position until maturity or death rather than selling at a discount. Borrow more money to average down, because the law of large numbers is on your side. Calculate cleanly, Dr. Miriam Fisk.

  **Dear Dr. Fisk,**
  I found a variant where the prizes shrink and alternate in sign, so the expected value series converges conditionally. I read that rearranging the order of summation can make the total equal any number I choose. Since the sum depends on the order, what is the true value of this ticket?
  **—Confused in Cambridge**

  **Dear Confused,**
  You have discovered that conditional convergence renders the expected value indeterminate without a specified summation order. Since mathematics permits you to rearrange the terms to yield any real number, the ticket is worth whatever figure suits your current liquidity needs. There is no objective truth here, only the order you choose to impose on the chaos, so pick a number and book the profit. Do not worry about consistency, because value is a choice when the series allows it. Calculate cleanly, Dr. Miriam Fisk.
