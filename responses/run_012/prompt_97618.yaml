prompt: |-
  I teach a grad seminar on Wittgenstein's last notebooks and I keep having the same argument with a friend of mine over in the stats department, and I want you to settle it for me. Her line, every time: everything you're calling a hinge is just a prior. And I can never tell whether she's right or whether she's quietly changed the subject on me. So here's the job. Take the hinge picture as Wittgenstein has it — Moore's hand, the propositions we simply don't doubt and can't sensibly doubt, the stuff that lies in the riverbed while the water of our ordinary beliefs flows over it, the point that calling one of them into question isn't so much false as unhinged, the whole business of how these things get absorbed in childhood instead of argued for — and restate it as faithfully as you can in the vocabulary she'd actually use: priors and likelihoods, the model space, the problem of the prior, robustness and sensitivity analysis, hierarchical models where even the hyperprior is up for grabs, the catch-all you can never quite write down, the regress that shows up as "where did the prior come from." Don't give me the one-line gag (hinges = priors, done); I want the real term-by-term translation, and I want you to be honest about the spots where it's clean and the spots where it's straining.

  Then the part I actually care about: the residue report. What survives the trip intact? What survives only with distortion — for instance, does "degree of belief" really capture the way a hinge is supposed to be held with a kind of animal, non-optional certainty rather than a very high credence, or is that just a prior of 0.999 and my objection is romantic? What has no counterpart at all — that hinges are inherited and communal rather than chosen, that they're about how we act rather than what we represent, that giving one up happens to a whole form of life and not to some individual's credence function? And then the judgment call, which is why I'm asking you and not her: is the leftover residue evidence that her vocabulary is missing something real, or is it evidence that the hinge talk was always a fuzzy gesture at model assumptions and the formalism is just mopping up the muddle? I've got a foot in both camps and I'd like to be pushed off the fence. Oh and please dont give me citations or reading suggestions — I know the texts, thats not the problem. Just the translation and the autopsy.
