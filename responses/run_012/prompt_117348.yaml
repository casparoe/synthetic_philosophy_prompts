answer: |-
  Here is the disambiguation of "Victors' Justice," laid out as a menu of distinct legal and moral claims. Each item includes a verdict on its validity, an assessment of whether it licenses a refusal to plead, and a note on its provenance in 1946 versus later historiography.

  ### 1. The Claim of Composition
  **The Argument:** The bench consists entirely of judges appointed by the prosecuting nations. At Tokyo, the court was constituted by General MacArthur (SCAP), a single military commander, rather than by treaty between states. Therefore, the tribunal is an arm of the occupation, not an independent judiciary.
  **Verdict:** **Platitude (Factually true, legally weak).**
  **Jurisdictional Consequence:** **Does not license refusal to plead.**
  In 1946, a serious jurist would recognize that international tribunals are invariably constituted by coalitions. While the Tokyo Charter's origin in occupation authority is unique, it does not inherently negate jurisdiction if the occupying power has the *de facto* authority to govern. A lawyer who stops here is arguing bias, not nullity. He must enter a plea of "Not Guilty" and argue for recusal, not reject the court itself.
  **1946 vs. Historian:** A 1946 jurist would view this as a procedural complaint. Historians view it as structural proof of the court's political nature.

  ### 2. The Claim of *Nullum Crimen* (The Retroactive Offence)
  **The Argument:** "Crimes Against Peace" (waging aggressive war) were not criminal offences under international law when committed. The Kellogg-Briand Pact renounced war but prescribed no penalties. To punish men for acts that were legal (or sovereign acts) at the time is to apply *ex post facto* law.
  **Verdict:** **Substantive and Defensible.**
  **Jurisdictional Consequence:** **Licenses refusal to plead.**
  This is the core of the jurisdictional objection. If there was no law, there is no crime. If there is no crime, the court has no subject matter jurisdiction. This is not a complaint about fairness; it is a claim that the indictment describes nothing that the law recognizes. A serious lawyer uses this to say: "There is no law here to which I can answer."
  **1946 vs. Historian:** This was the primary defence strategy in 1946 (argued by Stahmer at Nuremberg and Takayanagi at Tokyo). Historians later accepted the *principle* of the crime but debated the *application*.

  ### 3. The Claim of Sovereign Authority (The Retroactive Forum)
  **The Argument:** Criminal law requires a sovereign to enact it. There is no global sovereign. Therefore, the "international community" cannot create criminal law binding on individuals, only on states. The tribunal is applying a law it has invented for the occasion, without a legislature to authorize it.
  **Verdict:** **Contentious (The deepest jurisprudential claim).**
  **Jurisdictional Consequence:** **Licenses refusal to plead.**
  This goes deeper than *Nullum Crimen*. It argues that the *court itself* is a legal impossibility. It posits that international law is merely contract between states, not criminal statute over men. If this claim holds, the tribunal is not a court but a political commission. This allows the lawyer to stand silent: one does not plead to a political commission.
  **1946 vs. Historian:** Recognized by the most rigorous jurists in 1946 (notably Justice Pal). Later historians often sideline this metaphysical problem in favor of moral outcomes.

  ### 4. The Claim of Selective Enforcement (*Tu Quoque*)
  **The Argument:** The victors committed similar acts (firebombing of Dresden/Tokyo, atomic bombs, Soviet invasions) but are not in the dock. The law is being applied only to the losers. Therefore, the trial is revenge, not justice.
  **Verdict:** **Platitude (Legally irrelevant).**
  **Jurisdictional Consequence:** **Does not license refusal to plead.**
  In law, the guilt of a third party does not exonerate the defendant. Selective enforcement is a moral complaint, not a jurisdictional bar. A court can be hypocritical and still be a court. If this is the lawyer's only argument, he is not challenging the court's authority, only its integrity. He must plead.
  **1946 vs. Historian:** A favourite of later historians and critics. In 1946, defence counsel raised it, but the judges ruled it inadmissible as a defence to the charges.

  ### 5. The Claim of Internal Dissent
  **The Argument:** The "victors" were not of one mind. At Tokyo, Justice Pal (India) argued for total acquittal based on the lack of jurisdiction and evidence. At Nuremberg, the Soviet judge dissented against the acquittals. The judgment is not the voice of "Civilization," but a fractured political compromise.
  **Verdict:** **Substantive.**
  **Jurisdictional Consequence:** **Supports refusal to plead (indirectly).**
  This does not technically void jurisdiction, but it undermines the moral authority required to sustain a new legal order. Specifically, Pal's dissent was not on the facts, but on the law (aligning with Item 3). Citing Pal allows the lawyer to say: "Even one of your own judges says this court is a legal error."
  **1946 vs. Historian:** Pal's dissent was a 1946 reality, though suppressed in the immediate aftermath. It has become a cornerstone of post-colonial legal critique.

  ***

  ### The Residue: If the Allies Had Been Tried
  If you grant the premise that the Allies *had* tried their own men for firebombing or aggression, the menu collapses as follows:

  *   **Collapses:** **Selective Enforcement (Item 4).** This vanishes entirely. It becomes a nullity.
  *   **Survives:** ***Nullum Crimen* (Item 2) and Sovereign Authority (Item 3).** Even if the Allies tried themselves, the defence can still argue: "You are trying us for a crime that did not exist, in a court that has no sovereign power."
  *   **Survives:** **Composition (Item 1).** The bench would still be constituted by the victors (even if they included themselves).
  *   **Survives:** **Internal Dissent (Item 5).** Legal disagreement would likely still exist.

  **Conclusion on Residue:** If selectivity is removed, "Victors' Justice" ceases to be a complaint about hypocrisy and reveals its true spine: a claim that **International Criminal Law is a fiction.** The residue is not that the winners wrote the statute, but that *no one had the pen.*

  ***

  ### 1946 Jurist vs. Later Historian
  *   **The 1946 Jurist:** Recognized **Item 2 (*Nullum Crimen*)** and **Item 3 (Sovereign Authority)** as the only valid objections to *jurisdiction*. To a jurist of that era, Item 4 (Selectivity) was a newspaper argument, not a legal one.
  *   **The Later Historian:** Focuses on **Item 4 (Selectivity)** and **Item 1 (Composition)**. They are interested in the geopolitical outcome and the moral asymmetry, often treating the legal technicalities of Item 3 as quaint obstacles to necessary justice.

  ***

  ### The Character's Choice
  You asked which single reading your lawyer most probably means.

  He is serious. He is not a cynic. He refuses to plead.
  Therefore, he cannot mean **Item 4 (Selectivity)**. A cynic complains that the other side didn't get punished. A serious lawyer complains that *no one* can be punished by this mechanism.
  He cannot mean **Item 1 (Composition)** alone. That is a procedural objection, not a fundamental one.

  He means **Item 3: The Claim of Sovereign Authority.**

  He is asserting that there is no criminal law without a prior sovereign to have enacted it. He is not arguing that the trial is unfair; he is arguing that it is *ontologically impossible*. He is not saying, "You are bad judges." He is saying, "This is not a court."

  When he says "Victors' Justice," he does not mean "You won, so you get to judge." He means: "Victory is a political fact; Justice is a legal condition. You have brought the former into the room and claimed it is the latter. I will not participate in the category error."

  This makes him dangerous. It makes him a man who respects the Law more than the Outcome. It isolates him from his clients (who want to live) and the prosecutors (who want vindication). It leaves him standing alone in the gap between what was done and what can be named. That is the silence you are looking for.
