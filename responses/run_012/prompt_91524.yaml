answer: |-
  # Activity: The Consistency Tribunal

  ## 1. Overview & Materials
  **Concept:** Students act as a "Tribunal of Rationality" tasked with establishing a consistent ordering of badness. They must issue binding verdicts on pairs of outcomes. The activity forces them to commit to **Monotonicity** (more harms are worse) and **Severity** (torture is worse than a speck) before trapping them with **Aggregation** (do enough specks beat torture?).

  **Materials:**
  *   Whiteboard + 3 distinct colored markers (one per group).
  *   Masking tape (roll).
  *   Projector (for displaying the Scenario Cards).
  *   Handout: "Tribunal Charter" (one per group, see below).
  *   18 Students divided into 3 Tribunals (6 students each).

  **Roles (within each Tribunal):**
  *   **Scribe:** Writes the verdict on the board.
  *   **Advocate:** Speaks the group's justification (rotates each round).
  *   **Auditor:** Watches for contradictions with previous rounds (rotates each round).
  *   **Members:** Participate in deliberation.

  **The Commitment Scheme (The "Bond"):**
  At the start, each group must write a **Core Principle** on the board (e.g., "Harms always add up" or "Severity trumps quantity"). This is "sealed" with a piece of masking tape over it after Round 1. If their final verdicts logically contradict their Core Principle, they must publicly remove the tape and mark the principle "VOID" in the debrief. The "cost" is public inconsistency.

  ## 2. Timeline (75 Minutes)

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Divide groups. Distribute Charter. Explain the "Bond." Groups draft Core Principle. |
  | **10-15** | **Round 1** | **The Anchor.** 1 Torture vs. 1 Speck. (Establishes Severity). Tape over verdict. |
  | **15-20** | **Round 2** | **The Step.** 1 Speck vs. 2 Specks. (Establishes Monotonicity). Tape over verdict. |
  | **20-25** | **Round 3** | **The Escalation.** 1,000 Specks vs. 1,001 Specks. (Re-affirm Monotonicity). Tape over. |
  | **25-35** | **Round 4** | **The Gap.** 1 Torture vs. 1 Million Specks. (The Intuition Clash). Tape over. |
  | **35-45** | **Round 5** | **The Abyss.** 1 Torture vs. $10^{15}$ Specks. (The Breaking Point). Tape over. |
  | **45-55** | **The Audit** | Groups swap Auditors. They trace the logic chain on the board to find the break. |
  | **55-75** | **Debrief** | Instructor maps the activity to the Trilemma. Discuss solutions. |

  ## 3. Escalation Schedule & Scenarios
  *Project these prompts. Ensure students understand "All else equal" (same people, no side effects, etc.).*

  *   **Round 1 (Severity):**
      *   Outcome A: One person is tortured for one year.
      *   Outcome B: One person gets a dust speck in their eye.
      *   *Expected Verdict:* A is worse than B.
  *   **Round 2 (Monotonicity - Micro):**
      *   Outcome A: One person gets a dust speck.
      *   Outcome B: Two people get a dust speck.
      *   *Expected Verdict:* B is worse than A.
  *   **Round 3 (Monotonicity - Macro):**
      *   Outcome A: 1,000 people get a dust speck.
      *   Outcome B: 1,001 people get a dust speck.
      *   *Expected Verdict:* B is worse than A. (Crucial: They must affirm that *every* extra speck adds badness).
  *   **Round 4 (The Pinch):**
      *   Outcome A: One person is tortured for one year.
      *   Outcome B: 1,000,000 people get a dust speck.
      *   *Expected Verdict:* **Divergence Point.** Some will say A (Torture still worse). Some will say B (Aggregation kicks in).
  *   **Round 5 (The Ceiling):**
      *   Outcome A: One person is tortured for one year.
      *   Outcome B: Every human who will ever live ($10^{15}$) gets a dust speck.
      *   *Expected Verdict:* **The Trap.** If they said A in Round 4, do they still say A here? If they say B here, *where* did the switch happen?

  ## 4. Debrief Notes (Mapping Activity to Theory)
  *Do not lecture immediately. Ask the Auditors to report where the logic broke.*

  **A. The Logical Squeeze (The Trilemma)**
  Draw a triangle on the board. Label the corners with the three commitments they made during the game.
  1.  **Severity:** Torture > 1 Speck (Round 1).
  2.  **Monotonicity:** $N+1$ Specks > $N$ Specks (Rounds 2 & 3).
  3.  **Non-Aggregation:** Torture > Any Number of Specks (Rounds 4 & 5 for most intuitively).
  *Point:* You cannot hold all three. If 1 and 2 are true, 3 *must* be false by transitivity. If 1 and 3 are true, 2 *must* be false at some point.
  *Note:* This is the **logical** problem. It is settled that these three are inconsistent.

  **B. The Normative Fight (The Solutions)**
  *Flag clearly:* Philosophers disagree on which horn to grab. This is **not settled**.
  *   **Option 1: Bite the Bullet (Aggregationists).** Accept that enough specks outweigh torture. (Classic Utilitarianism).
      *   *Cost:* Violates deep intuition about the *kind* of suffering.
  *   **Option 2: The Threshold (Lexical Views).** Deny Monotonicity at a certain point. "After 10,000 specks, adding more doesn't make it worse *relative to torture*."
      *   *Cost:* Seems arbitrary. Why 10,001 and not 10,000? (The "Sorites" problem).
  *   **Option 3: Incomparability.** Deny that the two outcomes can be compared.
      *   *Cost:* Makes decision-making impossible in mixed cases.
  *   **Option 4: Intransitivity.** Deny that "better than" chains together.
      *   *Cost:* Radical revision of logic; makes rational choice theory collapse.

  **C. The "Seams" (Contested Ground)**
  *   **Vagueness:** Some argue the boundary is real but vague (no sharp line, but still a line).
  *   **Discontinuity:** Others (e.g., Parfit) argue there is a sharp discontinuity in value.
  *   **Context:** Mention that in *policy* (climate change, taxation), we act *as if* aggregation is true, even if our guts reject it in *torture* cases.

  ## 5. Troubleshooting: Predictable Failures

  | Failure Mode | Why it happens | Instructor Fix |
  | :--- | :--- | :--- |
  | **"It depends on the people."** | Students try to escape the ceteris paribus clause (e.g., "What if the speck people are children?"). | **Strict Adjudication:** Remind them the Charter says "Identical agents, identical context." If they break this, the Auditor calls a "Foul" and they must re-vote. |
  | **"We change our minds."** | Round 5 intuition overrides Round 2 logic. | **The Tape:** Physically prevent them from erasing Round 2. Point to the taped-over verdict. "You are bound by your past self. How do you reconcile?" |
  | **"We vote differently per group."** | Group 1 says Aggregation, Group 2 says Threshold. | **Use It:** This proves the intuition is unstable. In the debrief, highlight that the *disagreement between groups* is the data point. The problem is that *reasonable people diverge*. |
  | **"This is stupid/obvious."** | 4th-years might cynically dismiss the puzzle. | **Reframe:** "I'm not asking for your moral opinion. I'm asking for your consistency score. Can you write a rule that survives all 5 rounds without contradiction?" Gamify the logic. |
  | **Running out of time.** | Deliberation drags in Round 4. | **Hard Stop:** At 45 mins, blow the whistle. Even if verdicts aren't unanimous, record the majority. The *tension* is more valuable than the consensus. |

  ## 6. Limitations: What This Activity Cannot Do
  *Be honest with the students about this in the final 5 minutes.*

  1.  **Phenomenology:** The game cannot make them *feel* the dust speck. They are processing symbols, not sensations. The "tiny harm" feels smaller in the abstract than it might in reality (or larger, depending on the student).
  2.  **Cognitive Limits:** Humans cannot actually visualize $10^{15}$ people. They are guessing at the magnitude. The "math" of the harm is simulated, not experienced.
  3.  **Resolution:** This activity **will not solve the problem**. It will not tell them whether Torture or Specks are actually worse. It only demonstrates that their current toolkit for deciding produces a contradiction.
  4.  **Real-World Stakes:** There is no actual suffering here. Some students may argue the puzzle is a "philosopher's fantasy" that dissolves in real policy contexts. Acknowledge this: The puzzle is a *stress test* for principles, not necessarily a direct policy guide.

  ---

  ### Instructor's Cheat Sheet: The "Audit" Moment (Minute 45)
  *When the Auditors swap groups, give them this specific instruction:*
  "Look at Round 2 (2 specks > 1 speck). Look at Round 5 (Torture vs. Trillions of Specks). If you said Trillions is *better* than Torture, but 2 specks is *worse* than 1 speck... **where is the switch?** Write the number on the board where the math flips. If you cannot write a number, you have admitted there is no logical boundary, only a feeling."

  *This forces them to confront the **Sorites Paradox** element explicitly.*
