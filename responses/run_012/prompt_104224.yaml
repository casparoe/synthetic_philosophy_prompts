      *   *What is the moral philosophy?* Primarily consequentialist/utilitarian, but EA is a *practice*, not a single philosophy.
      *   *The "Demandingness Objection":* This is a classic critique of utilitarianism. EA addresses this practically.
      *   *Peter Singer's "Famine, Affluence, and Morality":* Argues for giving until marginal utility. This is the philosophical root, but EA practice is more nuanced.
      *   *Current EA Discourse:* There is active debate about "fair share," "overdemandingness," and community norms.
      *   *Career Advice:* "Earn to give" is one path, not the only one. Direct work is also valued.
      *   *Consensus vs. Contestation:*
          *   *Settled:* EA is not a dogma; 10% is a focal point/norm, not necessarily the absolute moral truth for everyone.
