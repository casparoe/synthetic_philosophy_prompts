          *   *EA Stance:* It's complicated. Many EAs are consequentialists who believe we *should* do more, but they recognize psychological limits.
          *   *Concept:* "Satisficing" vs. "Maximizing."
          *   *Consensus:* There is *some* obligation to help. The exact boundary is fuzzy.
          *   *Contestation:* Is failing to give 10% morally wrong? Most say yes (within the community). Is failing to give 50% morally wrong? Many say "ideally yes, but practically we don't enforce that."

      *   **Question 3: Inconsistency (Borrowing from two pictures)?**
          *   *User's Hypothesis:* Is it mixing strict consequentialism with common-sense morality?
