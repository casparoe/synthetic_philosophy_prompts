answer: |-
  You have put your finger on the central philosophical tension within Effective Altruism (EA). In academic ethics, this is known as the **demandingness objection**: if morality requires us to prevent bad things whenever we can do so without sacrificing something of *comparable* moral significance (as Peter Singer argued), then most affluent people should be giving away almost everything until they are nearly as poor as those they help.

  The EA movement's practice (specifically the "Giving What We Can" 10% pledge and career advice) does not perfectly align with strict philosophical utilitarianism. It is a pragmatic adaptation. Below is an analysis of what the practice presupposes, followed by a clear separation of what is settled versus what is contested within the community.

  ### 1. What the Practice Presupposes About Obligation

  The 10% pledge (administered by the organization *Giving What We Can*) is not generally presented by its founders as the precise mathematical limit of moral obligation. Instead, it functions as a **Schelling point** or a **focal norm**.

  *   **The Origin:** The founder, Toby Ord, calculated that he could live a comfortable life on 10% of his income and pledged the rest. When formalizing the group, 10% was set as the *entry threshold* for the pledge, not necessarily the *ceiling* of duty.
  *   **The Presupposition:** The practice presupposes that while there is a moral duty to help, moral norms must be **sustainable** and **scalable**. If the movement demanded 50% or 90% as a mandatory requirement for membership, it would likely attract far fewer people, resulting in less total money donated overall.
  *   **Obligation Status:** The practice treats the 10% as a **minimum baseline for "serious" participation**, but it remains ambiguous on whether failing to give 10% makes you a "bad person" in the absolute sense. Within the community, giving less than 10% is viewed as failing to meet the community norm, but outside the community, EA advocates often argue that *any* effective giving is good.

  ### 2. Duty vs. Supererogation (Above and Beyond)

  You asked if the practice views giving as a duty or as supererogatory (good to do, but not wrong to skip). The EA movement effectively **hedges** on this.

  *   **The Hybrid View:** Most EA thinkers acknowledge that strict consequentialism implies a very high duty (perhaps 50%+). However, they recognize that human psychology and social cohesion break down under extreme demands. Therefore, they advocate for a "moderate" obligation (10%) as a **political and social compromise**, even if their *philosophical* beliefs suggest more is required.
  *   **The "Ought":** When they say you "ought" to give 10%, they usually mean "if you accept the basic premise that you should help others effectively, this is the reasonable implementation of that premise." They generally do not treat someone who gives 0% as a moral monster in social settings, because doing so would be counterproductive to converting them.
  *   **Career Choice:** Regarding careers (e.g., finance/tech to donate vs. direct work), the advice is usually framed as **optimization**, not strict duty. You are encouraged to find the career where you can do the *most* good, which varies by person. For some, that is earning to give; for others, it is research or advocacy.

  ### 3. Is the Practice Inconsistent?

  Your suspicion that the practice borrows from two incompatible pictures is largely correct, though proponents would call it **pragmatic** rather than inconsistent.

  *   **Picture A (Maximizing):** The intellectual engine is consequentialist. It says "count every life equally" and "maximize impact." This suggests giving until it hurts significantly.
  *   **Picture B (Common-Sense):** The social engine relies on common-sense morality. It allows for personal projects, leisure, and a standard of living that doesn't induce burnout.
  *   **The Synthesis:** EA attempts to push Picture B toward Picture A without triggering the rejection mechanisms of human psychology. They accept that they are not asking people to be "moral saints" (in the philosophical sense) because "moral saints" are rare and often ineffective due to burnout.

  ### 4. Counterfactual: Rebuilding on Strict Impartial Maximizing

  If EA were rebuilt strictly on the view that you must maximize good impartially (e.g., strict Act Utilitarianism):

  *   **The Pledge:** The 10% figure would vanish. It would be replaced by a "Marginal Utility" standard. You would give until the utility you gain from your next dollar equals the utility that dollar would generate for the world's poorest. For a high earner in a rich country, this could easily be 50% to 80% of income.
  *   **Career:** "Earn to Give" would become the default obligation for anyone with high earning potential, unless they could prove their direct work was vastly more impactful. Taking a lower-paying job for personal fulfillment would be viewed as morally impermissible (self-indulgence).
  *   **Social Norms:** The community would likely be smaller, more intense, and potentially prone to high burnout rates. There would be significant moral stigma attached to spending money on non-essentials (hobbies, luxury, etc.).

  ### 5. Counterfactual: Rebuilding on Low-Demand Morality

  If EA were rebuilt on a view where morality doesn't demand much (e.g., Virtue Ethics or Moderate Deontology):

  *   **The Pledge:** The 10% pledge would be reclassified as **supererogatory**. It would be seen as a praiseworthy act of charity, similar to volunteering at a soup kitchen, but not something one "ought" to do.
  *   **Career:** Career advice would focus on "doing good within your career" rather than "picking a career for impact." Personal fulfillment would be weighted equally with impact.
  *   **Social Norms:** The urgency would dissipate. The language of "effectiveness" and "maximization" would be softened. It would look more like traditional philanthropy: "Give if you can, but live your life."

  ***

  ### 6. Settled vs. Contested Within the EA Community

  It is vital to distinguish between what is agreed upon by researchers and organizers versus what is actively debated.

  #### **Settled (General Consensus)**
  *   **EA is not a complete moral theory:** It is widely accepted that EA is a *project* or *practice* that can be supported by various ethical theories (utilitarianism, virtue ethics, religious views), not a single dogma.
  *   **10% is a norm, not a law of physics:** There is consensus that the 10% figure is a community commitment threshold, not a precise derivation of moral truth.
  *   **Impact matters:** Everyone agrees that if you are going to help, you should try to ensure your help actually works (evidence and reason).
  *   **Burnout is bad:** There is consensus that sustainability matters. Pushing people to give so much that they quit the movement is counterproductive.

  #### **Contested (Genuine Disagreement)**
  *   **The Moral Ceiling:** There is **no consensus** on how much one is *morally required* to give beyond the 10% pledge. Some prominent EAs (like Peter Singer) imply the obligation is much higher; others argue that 10% is a "fair share" and demanding more is unreasonable.
  *   **Earn to Give vs. Direct Work:** Five years ago, "Earn to Give" (finance/tech) was often presented as the default high-impact path. Today, this is **heavily contested**. Many now argue that direct work (research, policy, AI safety) is often higher impact, and that earning to give can have negative reputational externalities.
  *   **The "Fair Share" Argument:** There is an ongoing debate about whether an individual is obligated to take up the slack if others don't give. (i.e., If everyone gave 10%, poverty would end. Since they don't, do *I* have to give 50% to make up for them? Some say yes, most say no.)
  *   **Personal Fulfillment:** There is disagreement on how much weight to give personal happiness. Some argue that if you are miserable, you can't do good (instrumental value of happiness). Others argue that personal happiness is morally irrelevant compared to saving lives (impartiality).

  ### Summary
  Your intuition is correct: the 10% pledge is a pragmatic compromise between a demanding philosophical ideal and human psychological reality. The movement presupposes that there is a duty to help, but it intentionally sets the *enforceable norm* lower than the *theoretical maximum* to ensure long-term sustainability. Whether this is a wise strategy or a moral failure is one of the few things within the community that remains genuinely contested.
