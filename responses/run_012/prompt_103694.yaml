answer: |-
  The afternoon light slants across the wall-sized chart, illuminating rows of identical little men printed in stark black ink against a cream background. There are hundreds of them, arranged in columns rising from left to right.

  **Speaker A:** Look at the slope of it. You don't need to read a caption to feel the weight of those additional rows. In 1929, there were this many unemployed. By 1932, there are these many. The fact is physically present on the wall.

  **Speaker B:** The fact is present, perhaps, but is it asserted? I grant you the rhetorical impact. It strikes the gut. But stand back with me. If I were to take a knife and scrape away one of these figures from the 1932 column, have I told a lie?

  **A:** You have distorted the ratio. If the key states one figure equals one thousand workers, removing one falsifies the quantity.

  **B:** But only because the key tells me so. The picture itself says nothing. A row of men is just a row of men. Without the textual anchor, there is no truth condition, and therefore no falsehood. A lie requires a proposition. Can this wall speak a sentence? Can it say, "Unemployment did *not* rise"? How do you paint negation?

  **A:** You are demanding sentential syntax from a visual medium. The negation is in the comparison. If I show a row of ten and a row of five, the visual relation asserts the difference. To deny it would be to misrepresent the physical count. The truth is in the isomorphism between the ink and the social condition.

  **B:** Isomorphism implies a logic. Where is the disjunction? Where is the quantifier? Does this chart say "For all years, unemployment rose," or "There exists a year where unemployment was high"? You say the visual relation asserts the difference, but I see only juxtaposition. The inference that this implies a trend rather than merely two distinct states—that is supplied by your mind, not the ink.

  **A:** It is supplied by human perception, which is universal. That is the point. A logician needs a gymnasium education to parse your symbols. A dockworker sees these rows and understands the pressure on his livelihood immediately. If you insist on formal syntax, you lock the knowledge away in the university.

  **B:** I am not insisting on elitism, but on clarity. Look at the figures themselves. You call them neutral. But why does the worker wear a cap? Why is he holding a tool? That is a stylistic choice. Another designer might have drawn him bareheaded or idle. That choice smuggles in a theory about what a worker *is* before the statistics even begin.

  **A:** The style is standardized to remove individuality. We do not draw specific men; we draw units of labor. The repetition is not arbitrary; it respects the psychology of perception. We do not enlarge the figure to show more people, because a giant worker looks like a different kind of being. We multiply them to show plurality. That is a discovery about how humans see quantity, not a stipulation.

  **B:** Is it? Or is it a convention you have agreed to treat as natural? And here is the deeper trouble. Neurath himself insisted there is no theory-neutral observation language. No clean slate. All statements are part of a coherent system of encyclopedia entries, not mirrors of reality. Yet here you stand, claiming these pictures offer a direct legibility of social facts. If there is no clean slate, these icons are already theory-laden.

  **A:** They are physicalist. They track material conditions—bread, housing, labor hours. Neurath's anti-foundationalism means we must check our statements against each other, not against mystical sense data. This chart coheres with the census data, the tax records, the union logs. It is not a mirror; it is a tool for coordination.

  **B:** A tool, yes. But Neurath called it a "language-like technique." A helping language. He explicitly denied it was a full language. He knew it could not stand alone.

  **A:** He was being precise. It is a helping language because it assists the written word, not because it is deficient. It crosses linguistic boundaries. A German worker and a French worker see the same rows. The concession that it needs words does not negate its epistemic virtue. It means the medium is hybrid.

  **B:** But if it needs words to function—to define the unit, to define the time, to define the subject—then the pictorial element is decorative. It persuades, it motivates, but it does not know. You said earlier the fact is physically present. I say the fact is linguistically constructed, and the pictures merely clothe it in an aura of obviousness. That aura is dangerous. It conceals the editorial choices we discussed.

  **A:** I concede that without the key, the chart is silent. I grant you that. But once the convention is established, the visual array carries the load of the comparison. You say the aura is dangerous. I say the abstraction of your logic is dangerous. When you reduce suffering to a variable in a equation, you lose the human magnitude. These rows of men force you to count the cost.

  **B:** I concede the political virtue. It mobilizes. It makes the abstract concrete for those excluded from formal education. That is a moral good. But do not confuse mobilization with verification. You ask if the chart can assert something false. I say it cannot assert anything at all. It can only show. To assert is to claim. To claim requires the possibility of negation.

  **A:** Then we are at an impasse. You define knowledge by the capacity for logical negation. I define it by the capacity for social coordination and physicalist understanding.

  **B:** Perhaps. But look at the top row. Those last five figures. They are slightly spaced apart. Was that intentional?

  **A:** It was a printing error.

  **B:** Then the chart has lied to me for ten minutes. I read a hesitation in the trend that was merely a mechanical fault.

  **A:** Then we correct the print. But you saw a trend. You read the picture.

  **B:** I read into it. There is the difference.

  **A:** And I say that reading *is* the knowing.

  They stand silent for a moment, the hundreds of identical eyes staring back at them, neither confirming nor denying the silence between the two philosophers.
