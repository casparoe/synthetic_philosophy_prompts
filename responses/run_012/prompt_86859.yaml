  5.  **Drafting - Step-by-Step Construction (incorporating constraints):**

      *   *Opening:* Start with the nature of the problem. It's not about who is right, but what a theory must *do*.
      *   *Ontology:* Address the two endings and the translator. A theory must say what the "book" is. Is it the manuscript, the printed version, the translation? If the translator made it better, is that the book? If the editor cut load-bearing stuff, is that a mutilation or the work? The theory needs an ontology of the artifact.
