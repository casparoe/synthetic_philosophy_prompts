answer: |-
  This is a fascinating problem that sits right at the intersection of graphic design, cognitive psychology, and linguistics. You are essentially asking for the **identity conditions of a glyph**: At what point does a shape stop being a representation of a concept and become something else?

  Here is a breakdown of who is right, the philosophy behind letter identity, and how your desire for a coherent "extended alphabet" fits into the picture.

  ### 1. Who is right about the 'a'?

  **The Verdict:** Your friend is practically right; you are theoretically right. But for a school mural, **your friend wins.**

  Here is why:
  *   **Context vs. Isolation:** You are correct that in running text (*cat*, *bat*, *apple*), context disambiguates letters. Our brains are predictive engines; we read words, not letters. However, you are painting an **alphabet mural**. In this context, letters often stand alone or are scrutinized individually by children learning their shapes. In isolation, the "distinctive features" of the letter must carry the entire load of recognition.
  *   **The Audience:** This is for a school. Children are in the process of mapping shapes to sounds. If you introduce ambiguity (an 'a' that looks like a 'q' or reversed 'd'), you are creating cognitive friction for the exact demographic that needs clarity the most.
  *   **The 'g' Insight:** You are absolutely right about the 'g'. There was a famous study (Bressan, 2016) showing that most people cannot correctly draw or identify the specific structure of the two-story 'g' despite reading it daily. The single-story 'g' (the "opentail" or "looptail" vs. "hooktail") is the standard for handwriting and early education. Stick with the kid-book 'g'. Your friend is arguing for typographic tradition; you are arguing for pedagogical function.

  ### 2. Is there a principled way to tell when a shape is still the letter?

  Yes. You can look at this through two frameworks: **Distinctive Features** and **Structuralism**.

  **Distinctive Features (The Anatomy)**
  In linguistics, phonemes are defined by features (voiced, nasal, plosive). In typography, letters are defined by visual features. To determine if your 'a' is still an 'a', you must check its **invariants**:
  *   **The Counter:** Does it have a closed loop? (Distinguishes it from 'u' or 'n').
  *   **The Stem:** Is there a vertical element? (Distinguishes it from 'o').
  *   **The Termination:** Does the stem go up (ascender), down (descender), or stay mid-line (x-height)?
      *   An 'a' is x-height.
      *   A 'd' has an ascender.
      *   A 'q' has a descender.
  *   **The Side:** In a single-story 'a', the stem is on the right. If your wobbly style makes the stem drift to the left, it becomes a 'q' or a reversed 'd'.

  **The Threshold of Recognition**
  There isn't a hard mathematical line, but there is a **tolerance zone**.
  *   **Zone 1 (Identity):** The shape is wobbly, but the distinctive features (closed counter, right-side stem, x-height) are present. It is an 'a'.
  *   **Zone 2 (Ambiguity):** The stem is too long (looks like 'd') or the loop is open (looks like 'u'). This is where your friend is reacting.
  *   **Zone 3 (Blob):** The features are so distorted that the brain cannot map it to any stored prototype.

  **Structuralism (Your Intuition)**
  You wrote: *"an 'a' is an 'a' partly because of what it isn't."*
  You have independently discovered **Ferdinand de Saussure's theory of structuralism**. In semiotics, a sign has no intrinsic meaning; it has value only in its difference from other signs.
  *   'a' is 'a' because it is not 'o' (it has a tail).
  *   'a' is 'a' because it is not 'd' (the tail doesn't go up).
  *   'a' is 'a' because it is not 'q' (the tail doesn't go down).

  If your style makes the 'a' encroach on the visual territory of the 'd' or 'q', you are collapsing the structural differences that give the letter its meaning.

  ### 3. Is the "Extended Alphabet" desire coherent?

  **Yes, absolutely.** This is the definition of a **Design System** or **Parametric Typography**.

  You are asking: *Can I define a set of rules (grammar) that generates valid characters, even for symbols that don't exist yet?*
  *   **The Rules:** You already have two (unicursal stroke, uniform loop width). You likely have others implicitly (slant angle, stroke weight, terminal shape).
  *   **The Coherence:** If you can draw a made-up symbol using your rules, and it looks like it belongs with the 'A' and the 'Z', you have successfully created a stylistic "language." This is how constructed scripts (like Tolkien's Tengwar or the Klingon alphabet) are born.

  **Does this bear on the 'a' question?**
  Yes, critically.
  If your goal is a coherent *system*, then **consistency cannot override legibility.**
  *   A design system for art can prioritize style over function.
  *   A design system for *language* (which an alphabet is) must prioritize function.

  If your rule "every letter must be unicursal" forces the 'a' to look like a 'q', then the rule is breaking the system's primary purpose. You have to tweak the rule or the execution. For example, can you start the 'a' at a different point in the loop to change the visual weight without lifting the brush? Can you vary the *entry/exit* point of the stroke to distinguish the 'a' from the 'd' while keeping the width uniform?

  ### Practical Advice for the Mural

  1.  **Fix the 'a':** Since this is for kids, prioritize the "Distinctive Features." Ensure the 'a' clearly sits on the baseline (unlike a 'q') and does not rise above the x-height (unlike a 'd'). Even in a wobbly style, the *boundaries* of the letter must be respected.
  2.  **Keep the 'g':** Trust your research. The single-story 'g' is cognitively simpler and appropriate for the setting.
  3.  **Test in Isolation:** Cover the other letters. Show the 'a' to a child (not your artist friend). Ask them what letter it is. If they hesitate, the structural difference has been compromised.
  4.  **Embrace the System:** Your desire to make non-English symbols fit the style is a great way to stress-test your rules. If you can design a "thorn" (Þ) or an "eth" (Ð) or a completely made-up symbol that obeys your "uniform loop width" and "unicursal" rules, you will solidify the visual grammar of your mural.

  **Summary:** You are right that letter identity is relational (structuralism) and that people don't know letter details as well as they think (cognitive science). But your friend is right that in an alphabet chart, the visual signal must be unambiguous. Tweak the 'a' to respect its boundaries within the system, keep the 'g' simple, and trust your instinct about building a coherent visual language.
