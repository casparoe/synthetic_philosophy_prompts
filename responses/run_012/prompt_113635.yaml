answer: |-
  This is a classic governance problem: you are operating on *case law* (precedent) without a *constitution* (policy). When the cases are easy, the implicit rule feels obvious. When a case lands in the cracks between precedents, the committee fractures.

  Here is the breakdown of the rules you are actually running, how they apply to the current crisis, and how to write the policy so you don't have to have this fight again.

  ### 1. The Three Implicit Rules
  Based on your six precedents, there are three distinct rules that fit the data equally well. Each explains the "Yes" votes and the "No" votes, but they diverge on the current application.

  **Rule A: The "Faultless Victim" Principle (Causality)**
  *   **The Logic:** We assist when misfortune happens *to* a member, not when a member *makes* misfortune.
  *   **Fits Precedents:**
      *   *Yes:* Congenital condition (unchosen), Condemned building (external), Factory shutdown (external).
      *   *No:* Poker (chosen risk), Poetry (chosen income loss), Motorbike loan (chosen debt).
  *   **Prediction for Current Case:** **NO.** Gambling is a chosen risk (like poker), and turning down jobs is a chosen income reduction (like poetry). The painkiller origin story blurs this, but the continued gambling and job refusals re-establish agency.

  **Rule B: The "Floor of Dignity" Principle (Outcome)**
  *   **The Logic:** We assist when the alternative is destitution or homelessness, regardless of fault. We are a safety net, not a judge.
  *   **Fits Precedents:**
      *   *Yes:* All resulted in potential homelessness or severe health crisis.
      *   *No:* Poker guy kept his flat. Poetry guy had family housing. Motorbike guy had a loan asset (bike) and presumably housing.
  *   **Prediction for Current Case:** **YES.** He is facing a hostel. Under this rule, the cause matters less than the cliff he is standing on.

  **Rule C: The "Exhausted Options" Principle (Mitigation)**
  *   **The Logic:** We assist only when the member has no other viable avenue for support (family, employability, assets).
  *   **Fits Precedents:**
      *   *Yes:* Congenital (can't work?), Condemned (no other building), Factory (can't instantly find work).
      *   *No:* Poker (had job), Poetry (had family), Motorbike (had loan capacity).
  *   **Prediction for Current Case:** **NO (Conditional).** He turned down two jobs. Until he proves he cannot work or will accept suitable work, he has not exhausted options.

  ### 2. The Motorbike Ambulance Detail
  Your committee member is right: **The ambulance and surgery decision is the whole answer in miniature.**

  It is not a cop-out; it is a distinction between **Acute Survival** and **Financial Restoration**.
  *   **Paid:** Ambulance/Surgery. Why? Because leaving him to bleed out or die was morally unacceptable to the co-op, regardless of how he crashed. This is *harm reduction*.
  *   **Denied:** Physio/Loan. Why? Because paying for his recovery from the risk (physio) or the cost of the risk (loan) would subsidize the risky behavior itself.

  **How this applies to the gambler:**
  If you follow the Motorbike Precedent, you do not ask "Did he deserve this?" You ask "Are we preventing immediate catastrophe or subsidizing a lifestyle?"
  *   **Arrears/Eviction:** This is the ambulance. It is the acute threat to life/shelter.
  *   **Gambling Debts/Income Loss:** This is the physio/loan. This is the consequence of the behavior.

  **The Analysis:** The Motorbike precedent suggests you **pay the rent to stop the eviction** (save the life), but you **do not clear his gambling debts** or guarantee future support unless the behavior stops (don't fund the risk).

  ### 3. The Closest Analog
  You have two competing analogs, which is why the committee is split.

  *   **The Poker Player (Causality Analog):** This is the strongest match for the *cause*. Both involve gambling. If you rule Yes here, you effectively overturn the Poker precedent. You are telling members that if they gamble enough to lose their house, you will save them, whereas if they only lose their savings, you won't.
  *   **The Poetry Quitter (Mitigation Analog):** This is the strongest match for the *barrier*. Both turned down work. The Poetry case was denied because he had family. This man has no family.

  **The Verdict:** The **Condemned Building** case is the hidden analog. In that case, the member didn't choose the crisis, but the outcome was homelessness. The current case is the inverse: he chose the crisis, but the outcome is homelessness.
  *   **Closest Functional Analog:** The **Motorbike Crash**. It is the only other case where you split the decision (Yes to emergency, No to recovery).

  ### 4. Which Rule Should You Adopt?
  You should adopt a hybrid rule: **"The Last Resort Safety Net with Behavioral Conditions."**

  **The Policy:** *The fund prevents homelessness for members who have exhausted other options, provided they are actively engaging in remediation of the cause.*

  **Why this rule?**
  1.  **It honors the Co-op Ethos:** It satisfies the "Floor of Dignity" half of the committee. You do not let a member sleep in a hostel if you have the money.
  2.  **It protects the Fund:** It satisfies the "Faultless Victim" half. You are not bailing out the gambling; you are bailing out the *housing*.
  3.  **It aligns with the Motorbike Precedent:** It treats the housing as the "ambulance" (essential) and the gambling recovery as the "physio" (member's responsibility).

  **Application to Current Case:**
  *   **Decision:** **YES, but Conditional.**
  *   **Reasoning:** We will cover the arrears to prevent eviction (Acute Survival). However, continued support is contingent on two things:
      1.  Proof of enrollment in gambling addiction treatment (remediation of cause).
      2.  Acceptance of the next suitable job offered (exhaustion of options).
  *   **Why:** If you say a flat No, you become a body that lets members end up on the street (violating the Condemned/Factory precedents). If you say a flat Yes with no strings, you overturn the Poker/Poetry precedents and invite moral hazard.

  ### 5. The Future Stress Test
  You asked for the case that will force you to admit which rule you're actually running. You will find out when you encounter **The Self-Inflicted Medical Crisis.**

  **The Case:** A long-term member develops lung cancer. They smoked heavily for 30 years by choice. They need ongoing care not fully covered by insurance.
  *   **If you pay:** You have officially adopted the **Floor of Dignity** rule. Cause does not matter; need does. You must then admit the Poker Player was treated unfairly, or that "housing" is the only line you draw.
  *   **If you deny:** You have officially adopted the **Faultless Victim** rule. You judge the origin of the hardship. You must then admit that if the Gambler's addiction is deemed a "choice," he shouldn't get rent aid either.

  **Recommendation:** Write the policy now, before the cancer case arrives. Define "Hardship" as *situational destitution*, not *moral innocence*. This allows you to help the gambler without endorsing the gambling, keeping your fund solvent and your conscience clear.

  **Drafting the Reasoning for Next Week:**
  *"The Committee authorizes payment of arrears to prevent eviction, consistent with our precedent of preventing homelessness (Condemned Building). However, citing our precedent on voluntary risk (Motorbike/Poker), this aid is classified as emergency harm reduction. Future eligibility is contingent on evidence of addiction management and employment engagement, distinguishing between saving the member's housing and subsidizing the member's choices."*
