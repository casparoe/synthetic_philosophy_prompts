answer: |-
  This is a classic formulation of the **proliferation problem** for counterfactual theories of omission. You have constructed a valid *reductio*. Since you are committed to keeping (1) (the intuition that omissions *can* be causes in cases like the lifeguard), you cannot accept the conclusion (7). Therefore, you must block the slide from (1) to (6).

  Here is the diagnosis of where the argument breaks, why it tricked you, and the price of fixing it.

  ### 1. Which step goes?
  **Step (2) is the weak link.**

  Step (2) claims: *What makes an omission a cause is **just** the counterfactual dependence.*

  This looks fine because it seems to simply summarize the logic of (1). But it doesn't. Step (1) relies on specific, loaded examples (lifeguard, landlord) that carry implicit **normative expectations** or **defaults**. Step (2) strips those away and leaves only the counterfactual structure.

  By moving from (1) to (2), you have generalized from "omissions in contexts of duty/expectation" to "omissions in contexts of pure counterfactual dependence." That is the overreach.

  ### 2. Why did it look fine when you wrote it?
  It looked fine because counterfactual dependence is the *engine* of omission causation. Without the counterfactual ("had he jumped in, the swimmer would live"), the lifeguard's inaction is irrelevant. So, it is tempting to think the counterfactual is the *whole story*.

  It tricked you because (1) feels true, and (2) feels like a neutral analysis of (1). But (1) is actually doing two things:
  1.  Establishing counterfactual dependence.
  2.  Relying on a background norm (lifeguards watch swimmers; landlords provide safety).

  When you wrote (2), you kept the first ingredient and dropped the second. The bison case (3-5) works precisely because it satisfies the counterfactual condition but violates the normative/default condition.

  ### 3. How to fix it (and what you are paying)
  To keep (1) and avoid (6), you must modify (2). You need to add a **Normality** or **Expectation** constraint.

  **Revised (2):** An omission is a cause if (a) the outcome counterfactually depends on the failure to act, **AND (b) the action was expected, normal, or required in that context.**

  *   **Lifeguard:** Expected to watch. (Cause)
  *   **Landlord:** Required to install alarms. (Cause)
  *   **Bison:** Not expected to be there. (Not a cause)
  *   **Colleagues:** Not expected to trample your lawn. (Not a cause)

  **The Cost:**
  If you take this route, you are paying a metaphysical price. You are admitting that **causation is not a purely physical or structural relation.** It is partly sensitive to norms, conventions, or statistical defaults.

  *   **Pure Metaphysics View:** Causation is "out there" in the world, independent of human expectations. (This view forces you to accept the bison is a cause, i.e., drop (6)).
  *   **Contextualist View:** Causation is partly determined by the context of inquiry and what counts as "normal." (This allows you to reject the bison, but makes causation less objective).

  For a senior seminar, this is a fantastic trade-off to discuss. It forces students to choose: Is causation a feature of the universe (like gravity) or a feature of how we carve up the universe (like "pest" or "weed")?

  ### 4. Is the "Causation vs. Explanation" distinction doing work?
  Your second colleague suggests you are mixing up *causation* (the relation) with *causal explanation* (the speech act).

  *   **The Distinction:** On this view (often associated with David Lewis), the bison's absence **IS** a cause. There are billions of causes for your green lawn. However, when we ask "What caused the lawn to be green?", we are asking for a *selective explanation*. We filter the billions of causes down to the relevant ones (rain, fertilizer) and ignore the irrelevant ones (no bison).
  *   **Is it renaming the problem?** Honestly? **Yes and No.**
      *   **Yes:** It feels like a dodge because it contradicts the ordinary language intuition. If you tell a student, "Technically the bison's absence caused your lawn, it's just not a good explanation," they will feel you are playing word games. Their intuition is that the bison is *not a cause*, not that it is a *bad cause*.
      *   **No:** It does substantive work if you want to preserve a purely objective, counterfactual theory of causation. It allows you to keep the metaphysics clean (causation = counterfactual dependence) and move the messiness to pragmatics (explanation = salience).

  **Verdict:** If your goal is to validate the intuition that the landlord *caused* the death but the bison *did not*, the causation/explanation distinction is insufficient. It validates the landlord as a *better explanation*, but it still makes the bison a *cause*. Since you want to deny the bison is a cause, you need the **Normality Constraint** (modifying Step 2), not the Explanation Distinction.

  ### 5. What about your first colleague (Drop 6)?
  Your first colleague says: *Accept that everything is a cause. Causation doesn't have to discriminate.*

  *   **Why you don't buy it:** Because it renders the word "cause" useless for practical reasoning. If the bison, the rain, the fertilizer, and the lack of locusts are all "causes" in the same sense, the concept loses its grip on responsibility and intervention.
  *   **Why they say it:** It preserves the simplicity of the counterfactual analysis. It is the "Hard Realist" position.
  *   **Teaching value:** It is worth presenting this as the "Eliminativist" or "Liberal" view. But since you want to keep (1) in its strong sense (responsibility), you cannot accept this. If causation is everywhere, then the lifeguard isn't *special*, he's just one of a billion causes. That undermines the moral weight you want to preserve in (1).

  ### Summary for your Seminar
  Don't drop (1). Don't drop (6). **Drop the sufficiency claim in (2).**

  Tell your students:
  > "Counterfactual dependence is *necessary* for omission causation, but it is not *sufficient*. To count as a cause, an omission must also violate a norm or a default expectation. Without that constraint, we face the proliferation problem (the bison). With it, we save the lifeguard case but admit that causation is partly dependent on human expectations, not just physical facts."

  This is the most honest path. It avoids the absurdity of the bison, saves the intuition of the landlord, and opens a rich debate about whether causation is objective or context-sensitive.
