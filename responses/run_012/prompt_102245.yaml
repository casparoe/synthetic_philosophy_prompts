  So the translation must be about *Criterion Validity*, not *Construct Validity* (mostly).
  *Crucial distinction:* ML fairness is about *predictive fairness*. Psychometrics distinguishes *measurement fairness* (Invariance) from *predictive fairness* (Differential Prediction). The ML theorems map to the latter.

