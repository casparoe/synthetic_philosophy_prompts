      *   *Check:* The "Residue."
      *   *Correction:* The residue is the *ontological status of the criterion*. ML treats it as fixed. Psych treats it as estimated.

  10. **Final Polish:** Structure clearly with headings. Ensure the "Verdict" is nuanced. (Proceed to generate output based on these thoughts).

