prompt: |-
  ok so this is for my ethics club and I need one specific thing built to order, not a general essay, so please stick to the shape I'm asking for.

  The thing our club made up: a 'suffering budget.' You decide before you shop that you'll be responsible for at most 100 units of animal suffering per year (the units are fake but you treat them as real and comparable, and you have to actually spend the budget, you don't get credit for underspending). Every food choice gets paid out of the budget. It's a made up rule, we know, but it's our rule and it has to be applied as written.

  What I need from you: build me ONE thought experiment, realistic, set in an actual supermarket aisle or on an actual shrimp/fish farm, where the suffering budget tells the character to do something that makes a normal caring person wince. The wince has to fall out of the structure of the rule, not because the budget is set way too low or because the character is dumb or selfish. If the rule is really doing the work, then swapping the character out for a saint shouldn't fix the case.

  Constraints:
  - one paragraph for the scenario, no science fiction, no lab, no demons or perfect computers
  - the choice has to be between two farmed options or two farming methods, and it has to be about crustaceans or fish specifically (shrimp, prawns, crabs, lobster, tilapia, salmon, whatever, as long as it's farmed sea animals)
  - no numbers I couldn't hold in my head
  - the case must NOT depend on whether crustaceans actually feel pain or not. I know thats unsettled and I don't want my whole case to hinge on a fact nobody knows. Make it hinge on the rule.
  - at least one part where the suffering gets moved onto animals that aren't in the budget at all. We made up a name for this in club, 'unit laundering,' and I want the case to use it.

  After the scenario: say what the budget rule tells the character to do and why, what a plain 'just minimize total suffering' person says about the same case, and what a person who thinks the whole units-of-suffering idea is garbage says. Then tell me the one feature of the case thats doing all the work, what happens if I take that feature out, and how someone who likes the suffering budget would attack my case to make it not count (like they'd add something to the budget or cap something, so tell me what they'd patch and whether the patch is cheating).

  Also tell me honestly if the case only works because the rule is kinda dumb to begin with, or if it's a real problem for a rule like that.

  I wrote 'wince' earlier, I don't mean gore, I mean the reader should think 'no way thats ok.'
