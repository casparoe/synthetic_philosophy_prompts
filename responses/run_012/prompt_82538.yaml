      *   *The "Cognitive" ambiguity:* Also very accurate. "Cognitive" can mean "involving beliefs/judgments" (strong) or "involving information processing/appraisal" (weak). Perceptualists often claim to be cognitive in the weak sense, Judgmentalists in the strong sense.
