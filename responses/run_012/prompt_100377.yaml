      Hi there,

      I have been thinking about the deadlock you and your colleague have been stuck in for the last two years, and I want to offer a direct diagnosis rather than hedging my bets. You asked me to take a position, so here it is. This is not merely a verbal disagreement where you are using the word structure in different ways, nor is it a standard metaphysical dispute that can be solved by better definitions. The engine driving this entire stalemate is the Newman objection, and it is functioning as a hidden premise that neither of you is explicitly addressing.

      The reason you keep circling the same drain is that the Newman objection forces a choice that you are both trying to avoid. Newman showed that if you claim only structure is known or real, you risk triviality because any set of objects can fit any structure provided you have enough of them. To avoid this triviality, you must say something about the nature of the things involved. Your epistemic strategy is to posit that there are things behind the structure, even if we cannot know them. This saves the theory from triviality but at the cost of introducing the Kantian thing-in-itself your colleague hates. You are effectively adding a metaphysical posit to save the epistemology. Your colleague's ontic strategy is to deny the things entirely and say the structure is all there is. This avoids the Kantian posit but runs straight into the charge of incoherence because, as you say, relations seem to require relata.

      I believe your colleague is closer to the truth, but you are right to feel that her position is incomplete. The disagreement persists because you are defending a classical metaphysical intuition against a post-classical ontology. Your insistence that relations need relata is based on a classical view of objects as individuated substances that stand in external relations. Your colleague is arguing from the standpoint of modern physics, particularly quantum mechanics, where individuality is often lost and systems are defined by their symmetries and entanglements rather than by intrinsic properties. When you say relations need things to relate, you are imagining billiard balls. When she says relations are all the way down, she is imagining quantum fields where the excitation is secondary to the field structure.

      However, simply asserting this will not break the deadlock. The progress you are looking for requires admitting that your something behind the structure is indeed doing no explanatory work. It is a placeholder that soothes your metaphysical anxiety but adds no predictive power or clarity to the science. It is a Kantian noumenon in a lab coat, just as she says. If you hold onto it, you are committed to an entity that by definition makes no difference to our knowledge or the structure of the world. That is a weak position to defend.

      On the other hand, your colleague cannot simply wave away the coherence objection. She needs to show how structure can exist without relata without collapsing into a mathematical abstraction that says nothing about the world. The way forward is not to argue about metaphysics in the abstract but to look at specific case studies in physics where the object concept dissolves. If she can demonstrate that in quantum entanglement or general relativity the traditional notion of an object is what is causing the trouble, then her ontic structural realism gains traction. If she cannot ground her structure in physical practice, then the Newman objection will always haunt her, suggesting her structure is just a mathematical map with no territory.

      So here is what counts as progress. You need to concede that the unknowable something behind the structure is a redundant posit that violates parsimony. It solves the Newman problem only by cheating, by secretly assuming there are relata without saying what they are. She needs to concede that structure without any account of instantiation is vulnerable to the charge of being merely mathematical. Progress happens when you both stop arguing about whether relations need relata in the abstract and start arguing about whether specific physical theories require objects or whether they can be formulated purely structurally. If the physics can be done without objects, your intuition about relata is just a historical artifact. If the physics requires objects, her ontology is empty.

      Stop fighting about Kant and start fighting about quantum field theory. That is where the Newman objection lives now, and that is where you will either find common ground or finally decide who is right. The metaphysical intuition is the trap. The physics is the way out.

      Best wishes

