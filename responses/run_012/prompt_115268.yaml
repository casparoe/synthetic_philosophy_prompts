  ### Model Answer for Part (b)

  **Question:** What should her credence that the coin landed heads be when she is told that it is Monday? Answer separately for each of the two positions you set out in (a), saying for each whether the credence moves, and why. What should her credence be if she is told that it is Tuesday?

  **Model Answer:**

  **1. The Thirder Position (Elga)**
  *   **Initial Credence:** Upon waking (before being told the day), the Thirder assigns equal credence to the three subjectively indistinguishable centered worlds: $P(H, Mon) = 1/3$, $P(T, Mon) = 1/3$, $P(T, Tue) = 1/3$. Thus, initial $P(Heads) = 1/3$.
  *   **Given Monday:** Beauty learns she is not in the $(T, Tue)$ world. The remaining possibilities are $(H, Mon)$ and $(T, Mon)$. Since these were initially equiprobable ($1/3$ each), they remain equiprobable conditional on Monday.
  *   **Calculation:** $P(Heads | Monday) = \frac{P(Heads \cap Monday)}{P(Monday)} = \frac{1/3}{2/3} = 1/2$.
  *   **Movement:** The credence **moves** from $1/3$ to $1/2$. The information "It is Monday" is evidence favoring Heads because Heads guarantees a Monday waking, whereas Tails only yields a Monday waking in one of two wakings.
  *   **Given Tuesday:** If told it is Tuesday, the only compatible world is $(T, Tue)$. Heads is impossible. $P(Heads | Tuesday) = 0$.

  **2. The Halfer Position (Lewis)**
  *   **Initial Credence:** Upon waking, the Halfer maintains the prior chance of the coin. $P(Heads) = 1/2$. Lewis distributes the remaining $1/2$ probability over the Tails wakings: $P(H, Mon) = 1/2$, $P(T, Mon) = 1/4$, $P(T, Tue) = 1/4$.
  *   **Given Monday:** Beauty learns she is not in the $(T, Tue)$ world. We condition on the event $Monday$, which comprises $(H, Mon)$ and $(T, Mon)$.
  *   **Calculation:** $P(Monday) = P(H, Mon) + P(T, Mon) = 1/2 + 1/4 = 3/4$.
      $P(Heads | Monday) = \frac{P(H, Mon)}{P(Monday)} = \frac{1/2}{3/4} = 2/3$.
  *   **Movement:** The credence **moves** from $1/2$ to $2/3$. Although the waking itself was uninformative for the Halfer, the specific information "It is Monday" eliminates the Tuesday possibility, which is exclusively associated with Tails. This shifts the probability mass toward Heads.
  *   **Given Tuesday:** If told it is Tuesday, Heads is impossible. $P(Heads | Tuesday) = 0$.

  **Summary:**
  *   **Thirder:** Moves $1/3 \rightarrow 1/2$ on Monday; $0$ on Tuesday.
  *   **Halfer:** Moves $1/2 \rightarrow 2/3$ on Monday; $0$ on Tuesday.
  *   **Note:** Both agree on Tuesday (0), but they diverge significantly on Monday because they start from different priors regarding the centered worlds upon waking.
