  7.  **Final Polish:** Check British spelling (referee, defence, programme, etc. - wait, "referee" is fine, "program" vs "programme"). Ensure the distinction between 's' and 'z' in words like 'realise' (Oxford spelling is standard for UK academic). *Correction:* Use standard UK English conventions (e.g., 'philosophise', 'defence').

