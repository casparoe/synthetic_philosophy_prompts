      *   *Sam's Map analogy:* A map represents a city. The map is physical. The city is physical. In epiphenomenalism, the report is physical, the qualia is mental. The issue is how the physical gets the "content" of the mental without interaction. Jess is right: it requires a mapmaker who can see both.

