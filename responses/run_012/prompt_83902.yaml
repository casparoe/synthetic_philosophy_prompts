      *   **Jess's Counter 2 (Mapmaker):** "How does the brain know which experience to draw a map of... smuggles in a mapmaker."
          *   *Assessment:* This is the knockout blow. A map represents a city because a cartographer made it so. If the brain is the mapmaker, it must be sensitive to the territory (qualia) to map it. If qualia are inert, the brain can't be sensitive to them.
          *   *Rating:* Clearly Right.

  4.  **Synthesize the "What They're Missing" Section:**
      *   **Sam:** Missing an account of *why* the correlation holds. He relies on "reliability" but offers no mechanism for reliability if the effect (qualia) doesn't feed back into the cause (brain). He is essentially positing a "pre-established harmony" (Leibniz) without admitting it.
      *   **Jess:** Might be assuming a specific causal theory of knowledge that some externalists reject. However, her critique of the analogies is sound. She might be missing that some modern epiphenomenalists (like Chalmers) accept we *can't* know qualia in the standard sense but argue we have a different kind of acquaintance.
      *   **Both:** They are debating classical Huxleyan epiphenomenalism. They aren't discussing *constitutive* panpsychism or illusionism which try to dissolve the problem. They are also ignoring the "systematic overdetermination" escape route (though that has its own costs).

