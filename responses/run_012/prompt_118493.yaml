answer: |-
  Your intuition is exceptionally strong. You have correctly identified that statutory interpretation is, at its core, an information retrieval and ambiguity resolution problem within a legacy system. The friction your flatmate feels and the friction you feel when debugging a race condition in a payment processor share the same topological structure: *What does this system actually do when the inputs are edge cases the original architects didn't anticipate?*

  However, your hypothesis that it is *only* "code is the spec" plus politics misses the critical constraints of the legal environment that do not exist in software engineering. The mapping is about 85% isomorphic. The remaining 15% is where the system breaks if you treat it purely like code.

  Here is the systematic translation, followed by the residue report and the argument against your framing.

  ### Part 1: The Translation Layer

  | Legal Concept | Engineering Equivalent | The Operational Reality |
  | :--- | :--- | :--- |
  | **Statute** | **Production Source Code** | The authoritative artifact. If it doesn't compile (pass bicameralism/presentment), it doesn't exist. |
  | **Legislature** | **Core Maintainers / Architects** | The only entity with write access to `main`. |
  | **Legislative History** | **Commit Messages, PR Descriptions, Jira Tickets** | Contextual metadata explaining *why* a function was added. Often incomplete, sometimes contradictory, occasionally written by someone who left the company 20 years ago. |
  | **Textualism** | **"The Code is the Spec"** | You trust the AST, not the docstring. If the code says `if x > 5` and the comment says `# check if x is less than 5`, you follow the code. The compiled binary is the truth. |
  | **Purposivism** | **"Intent-Based Debugging"** | You assume the code is buggy or underspecified. You read the Jira ticket to understand the business goal. If the code breaks the business goal, you interpret the execution to match the goal (or patch it). |
  | **The Judge** | **The Runtime Interpreter / On-Call SRE** | The entity that actually executes the logic against real-world inputs. In Common Law, they also write to the cache (precedent). |
  | **Precedent (Stare Decisis)** | **Cached Dependencies / Regression Suite** | Past decisions bind future ones. Changing a ruling is like a breaking change in a public API; it risks crashing clients (citizens/businesses) who depend on the old behavior. |
  | **Reasonable Expectation** | **SLA / SLO / Implicit Interface Contract** | Not explicitly typed, but relied upon by the client. If you violate it, the client churns (or sues). |
  | **Canons of Construction** | **Linting Rules / Style Guides** | Heuristics for parsing ambiguous syntax (e.g., "assume this variable is local unless declared global"). |
  | **Constitution** | **Root Permissions / Kernel Constraints** | The underlying OS. No function can violate memory safety (rights) defined here. |
  | **The Doorbell Case** | **Edge Case in Logging/Monitoring** | `func Record(ctx Context)`: Does `ctx.Location == Hallway` imply `ctx.Privacy == False`? The type definition of `Hallway` is ambiguous. |

  **The Textualist Argument in Your Vocab:**
  "We cannot look at the Jira ticket (Legislative History). The ticket is not the code. If the Architects wanted to exclude smart doorbells, they should have added `&& !device.is_doorbell` to the conditional. They didn't. To add it now is to deploy unreviewed code. That is the Judge acting as Maintainer, which violates separation of concerns."

  **The Purposivist Argument in Your Vocab:**
  "The code is throwing a panic on a valid use case. The Jira ticket clearly states this module is for 'preventing espionage,' not 'security monitoring.' If we execute this strictly, we break the business logic. We need to apply a patch (interpretation) that aligns the runtime behavior with the original feature request."

  ---

  ### Part 2: The Residue Report

  This section analyzes where the translation holds, where it distorts, and where it fails completely.

  #### 1. Clean Mappings (High Fidelity)
  *   **Reliance Interests vs. Backwards Compatibility:** This is the strongest link. Lawyers argue *stare decisis* prevents upsetting settled expectations. Engineers argue semver and deprecation policies prevent breaking client integrations. Both are cost-benefit analyses on the technical debt of changing behavior.
  *   **Ambiguity Resolution:** Both fields use heuristics to resolve syntax errors. In law, *ejusdem generis* (general words follow specific words) is essentially pattern matching on a list type. In code, it's type inference.
  *   **Legacy Debt:** Both systems suffer from "dead code" that cannot be removed because something critical depends on it. The "reasonable expectation of privacy" in a hallway is essentially an undocumented API contract that users have relied on for 50 years.

  #### 2. Distorted Mappings (Low Fidelity)
  *   **Legislative History vs. Commit Messages:** In engineering, a commit message is usually written by the coder *immediately* before or after the code. In law, legislative history is often contradictory (different senators say different things on the floor) or strategic (lies inserted to sway votes). Trusting a commit message is risky; trusting a floor speech is often suicidal. The signal-to-noise ratio is much worse in law.
  *   **The "Bug" Concept:** In engineering, if the code contradicts the spec, it's a bug, and we fix the code. In law, if the text contradicts the "purpose," it is not necessarily a bug; it might be a feature the compromise produced. Purposivism risks assuming the Legislature was rational and consistent. Textualism assumes they might have been drunk or corrupt, and the text is the only sober artifact.

  #### 3. No Counterpart (The Missing 15%)
  *   **Coercive Monopoly:** You can fork a repo. If you disagree with the Go team's spec, you can compile a different compiler. You cannot fork the State. There is only one `main` branch for criminal law. This raises the stakes of interpretation from "service outage" to "loss of liberty."
  *   **Retroactivity:** In engineering, a hotfix applies to future requests. In law, a judicial interpretation often applies *retroactively* to the conduct that triggered the case. If the court decides the doorbell *is* illegal today, you were illegal yesterday. This violates standard causality in system design.
  *   **Normativity (Is vs. Ought):** Code describes state transitions (`x = x + 1`). Law prescribes obligations (`x ought to be 1`). A compiler does not care if you *should* run the function. A judge cares deeply about the moral weight of the execution.

  ---

  ### Part 3: The Counter-Argument (Why "Code is Spec" Fails)

  Your working hypothesis is that the debate is "Code is Spec" (Textualism) vs. "Politics/Intent" (Purposivism), and that the former is the more rigorous engineering stance.

  I argue that this framing misses the fundamental nature of the Judge's role and the concept of Authority.

  #### 1. The Judge is not a Compiler; They are a Maintainer with Read-Only Claims
  In your model, the Judge is the Runtime. A runtime is deterministic. It does not choose; it executes.
  In reality, the Judge is a **Maintainer who claims to be a Reader.**

  When a Supreme Court Justice interprets a statute, they are effectively writing a patch. They are adding a method to a struct they don't own.
  *   **Textualism** is the lie that they are *not* writing a patch. It is a claim of legitimacy: "I am not changing the system; I am merely revealing what was always there."
  *   **Purposivism** is the admission that a patch is required, but it attempts to style the patch to look like the original codebase.

  **Why this matters:** In engineering, we prefer the maintainer to admit they are changing the spec. If the API changes, we want a v2.0, not a silent change in v1.0 that breaks our client.
  Textualism argues that Purposivism is a silent breaking change. It violates the **Interface Contract** between the Legislature (Maintainer) and the Public (Client). If the Public reads the code (statute) and sees `if (doorbell)`, they rely on that. If a Judge says, "Actually, the *intent* was to exclude doorbells," the Judge has silently patched the production environment without a version bump. That is a violation of engineering ethics, even if it produces a "better" outcome.

  #### 2. Authority is not Root Access; It is Social Consensus
  You mentioned authority: *"who is permitted to bind whom."*
  In engineering, authority is cryptographic. If you have the private key, you can sign the commit. If you have `sudo`, you can run the command. The system enforces authority.

  In law, authority is **intersubjective**. The Judge has no army. The Sheriff has the army, but the Sheriff only listens because the society agrees the Judge has the right to speak.
  *   **The Engineering Gap:** In your world, if the spec is ambiguous, the system crashes or returns `null`.
  *   **The Legal Reality:** In law, the system *cannot* crash. The Judge *must* return a value. `void` is not an option.

  Because the system cannot crash, the Judge *must* have write access, even if the Constitution says they only have read access. Textualism is a **constraint mechanism** designed to limit the blast radius of that write access. It is not an assertion that "code is truth." It is an assertion that "if we allow the Runtime to write to Disk, the data will corrupt."

  #### 3. The "Ought" Problem (Normativity)
  Code handles *state*. Law handles *rights*.
  Consider your doorbell example.
  *   **Engineering View:** Does `Hallway` implement the `PrivateSpace` interface? If no, `Record()` is allowed.
  *   **Legal View:** *Should* `Hallway` implement `PrivateSpace`?

  Textualism tries to avoid the "Should." It asks, "Did the Architects implement it?"
  Purposivism asks, "Did the Architects *mean* to implement it?"

  The residue here is **Moral Hazard**.
  If you treat law as code, you assume the Code is morally neutral. But statutes are moral claims encoded in syntax.
  If the statute says "All red cars are illegal," and a fire truck is red:
  *   **Textualist/Engineer:** Fire truck is illegal. Fix the code.
  *   **Purposivist:** The purpose was traffic safety, not stopping emergencies. Fire truck is legal.

  The "Missing Something Big" is that **Law is a system for resolving moral conflicts without violence.** Code is a system for resolving state conflicts without crashes.
  When you interpret a statute, you are not just debugging a logic error; you are allocating suffering. Who goes to jail? Who pays?
  Textualism argues that allocating suffering based on "Intent" (which is fuzzy) is more dangerous than allocating it based on "Text" (which is sharp), even if the Text is sometimes dumb. It prefers a deterministic bug to a non-deterministic "fix."

  ### Conclusion

  Your feeling is right about the *structure* of the problem. It is an ambiguity resolution problem in a legacy system with high technical debt.

  But your feeling is wrong about the *stakes* and the *actor*.
  1.  **Stakes:** You can fork the code. You cannot fork the law. This makes the "Interface Contract" (Text) more sacred in law than in engineering, because the users have no exit option.
  2.  **Actor:** You view the Judge as a Reader. They are a Writer pretending to Read. Textualism is not a claim about truth; it is a **governance policy** to limit the Judge's write permissions.

  The residue isn't just institutional noise. It's the recognition that in law, the "Runtime" (Judge) has the power to kill processes (citizens), and the "Source Code" (Statute) is the only leash we have on them. Textualism is the argument that the leash must be made of steel (text), not rubber (intent), even if the steel sometimes chokes the dog.

  Your flatmate is arguing about how much rubber is acceptable on the leash. You are arguing that the leash should be steel because you're used to systems where the code *is* the constraint. In law, the code is only the constraint if everyone agrees to pretend the Judge can't cut it.
