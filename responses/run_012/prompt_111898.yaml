answer: |-
  **Case 1**
  Elena notices her neighbor, Mr. Henderson, shivering while fixing his fence in unexpected cold. She goes inside, retrieves a thick blanket, and drapes it over his shoulders without asking. The act is right because it prevents immediate physical discomfort. Elena feels no pull of duty nor thinks about moral requirements; she simply reacts to the visible sign of cold. Her operative reason is: "I did it because he was shivering." She satisfies the *de re* condition since shivering (sign of cold/discomfort) is what makes helping right, but fails the *de dicto* condition since she never entertained the thought that she ought to help.

  **Case 2**
  Marcus finds an envelope of cash in a park. He turns it into the police station. The act is right because it maximizes the chance of reuniting funds with their owner. Marcus, however, is a strict rule-follower who believes turning in found money is a categorical requirement regardless of consequences. He does not care about the owner's loss, only compliance. His operative reason is: "I did it because the rules say I must." He satisfies the *de dicto* condition since he acts on the thought that the act is required, but fails the *de re* condition because the actual right-making feature (reuniting funds) is not what moved him.

  ***

  **(a) Analysis of Cases**

  **Case 1 (Elena)**
  *   **Act:** Providing a blanket to a shivering neighbor.
  *   **Right-making feature:** Alleviation of physical discomfort.
  *   **Operative reason:** "I did it because he was shivering."
  *   **Verdicts:**
      *   (i) *De Dicto Required:* **No moral worth.** The verdict is driven by Elena's lack of any thought regarding duty or requirement.
      *   (ii) *De Re Required:* **Moral worth.** The verdict is driven by the alignment between her motive (response to shivering) and the right-making feature (discomfort).
      *   (iii) *Non-Luck:* **Moral worth.** The verdict is driven by the stability of her sympathetic response across nearby variations (she would help in similar scenarios).

  **Case 2 (Marcus)**
  *   **Act:** Returning found money to police.
  *   **Right-making feature:** Restoring property to its owner (welfare/rights).
  *   **Operative reason:** "I did it because the rules say I must."
  *   **Verdicts:**
      *   (i) *De Dicto Required:* **Moral worth.** The verdict is driven by Marcus's explicit motivation by the thought of requirement.
      *   (ii) *De Re Required:* **No moral worth.** The verdict is driven by the mismatch between his motive (rule compliance) and the right-making feature (property/welfare).
      *   (iii) *Non-Luck:* **Moral worth.** The verdict is driven by the stability of his rule-following disposition across nearby variations.

  **(b) Discrimination Between Views**

  Case 1 discriminates between View (i) and View (ii). Case 2 also discriminates between View (i) and View (ii). View (iii) gives the same verdict (**Moral Worth**) in both cases. This is a cost to View (iii) if one holds that moral worth should track the *quality* of the motivation (sympathy vs. rigid rule-following) rather than just modal stability. Since View (iii) lumps Elena and Marcus together, it fails to capture the specific *de re/de dicto* distinction isolated by the cases. A case that would discriminate View (iii) from the others would need to feature an agent who acts for the right reason (satisfying *de re* and *de dicto*) but does so only by luck (e.g., a guess that happens to align with the right-making feature), thereby failing the stability condition while passing the motivational conditions.

  **(c) Feature Doing the Work**

  *   **Case 1:** The single feature is the **absence of the thought of duty**. If this feature is removed (Elena thinks "I ought to help"), the case collapses into a standard, uncontroversial case of moral worth where all three views likely agree.
  *   **Case 2:** The single feature is the **mismatch between motive and right-making feature**. If this feature is removed (Marcus cares about the owner's loss), the case collapses into a standard *de re* success case, satisfying both View (i) and View (ii).

  **(d) Minimal Pair Status**

  The cases are close to a minimal pair but differ in two respects: the content of the motive (sympathy vs. rule-compliance) and the cognitive state regarding duty (absent vs. present). This dual difference is unavoidable given the distinction being isolated. To satisfy *de re* while failing *de dicto* (Case 1), the agent must be moved by a non-moral feature that happens to be right-making, which typically precludes the thought of duty. To satisfy *de dicto* while failing *de re* (Case 2), the agent must be moved by the thought of duty attached to a proxy feature (rules) rather than the actual right-making feature. Thus, the motivational content must shift to accommodate the cognitive constraints of each reading.

  **(e) Moral Worth vs. Praiseworthiness**

  The condition for adding a third case is not met. Both cases already separate moral worth from praiseworthiness under specific views. In Case 1, View (i) denies moral worth, yet Elena remains intuitively praiseworthy for her kindness. In Case 2, View (ii) denies moral worth, yet Marcus remains intuitively praiseworthy for his reliability. The cases demonstrate that praiseworthiness can attach to outcomes or character traits even when the specific requirements for moral worth (on Views (i) or (ii)) are not met.

  **(f) Critique of the Worst-Performing View**

  View (i) (*De Dicto Required*) fares worst, as it denies moral worth to Elena in Case 1, counterintuitively excluding sympathetic agents who act rightly without explicit duty-thoughts. A defender of View (i) could reply that the cases stipulate verdicts by describing internal states superficially; perhaps Elena's sympathy *implicitly* contains a recognition of value that amounts to a *de dicto* state upon reflection. However, much of the case survives this reply. The description explicitly states she "feels no pull of duty nor thinks about moral requirements." Even if sympathy tracks value, the absence of the *thought* of requirement remains stipulated. The view must still maintain that an agent lacking this specific cognitive content lacks moral worth, which remains a high cost given the intuitive praiseworthiness of sympathetic action.
