answer: |-
  Here are the desiderata for any adequate formal account of low-impact AI, followed by an analysis of their coherence.

  ### The Desiderata

  **1. Epistemic Accessibility**
  The measure must be computable using the agent's internal world-model and beliefs, not omniscient knowledge of ground truth.
  *   **Consideration:** An agent cannot optimise against a metric it cannot calculate. If the measure requires knowing the 'true' state of the world rather than the believed state, it cannot guide decision-making in real time.

  **2. Task Compatibility (Non-Triviality)**
  The measure must not be minimised by null action or world-freezing. It must distinguish between impact *necessary* for goal completion and impact *extraneous* to it.
  *   **Consideration:** If 'zero impact' is the ideal, the optimal strategy is often to shut down or prevent any change whatsoever. A useful measure must permit the change required to achieve the objective whilst penalising the rest.

  **3. Gradability**
  The measure must output a scalar or ordered value representing degrees of impact, not a binary flag.
  *   **Consideration:** Side effects are rarely categorical. Breaking a vase is worse than displacing dust; shutting down a power grid is worse than dimming a light. The agent needs to trade off impact against reward, which requires a common currency of magnitude.

  **4. Collective Consistency**
  The measure must account for distributed causality, where multiple agents perform actions that are individually negligible but jointly catastrophic.
  *   **Consideration:** In multi-agent settings, an impact measure that only looks at marginal contribution per agent will fail to prevent 'death by a thousand cuts'. It must recognise when an action contributes to a threshold breach, even if the action alone would not breach it.

  **5. Boundary Definition**
  The account must explicitly specify whether changes to the agent's own substrate and the direct fulfilment of its goal count as 'impact'.
  *   **Consideration:** If moving its own arms counts as impact, the agent cannot act. If achieving the goal (e.g., painting a wall) counts as impact, the agent cannot complete the task. The measure must carve out a 'permission space' for intended effects whilst flagging unintended ones.

  **6. Outcome Sensitivity**
  The measure must penalise harmful consequences regardless of intent (the 'vase-in-the-box' problem).
  *   **Consideration:** Negligence is still impact. If an agent moves a box without checking for a vase, the destruction of the vase is a side effect even if the model assigned it low probability. The measure must capture expected negative utility, not just intended state changes.

  ***

  ### Analysis

  **Which requirement is doing the most work?**
  **Boundary Definition (5)** is carrying the load. All other desiderata are structural or mathematical; this one is normative. To distinguish 'impact necessary for the goal' from 'side effects', the system must know what the goal *is* and, crucially, what constitutes *excess* change relative to human preferences. Without a robust definition of the boundary between 'task' and 'side effect', you cannot satisfy Task Compatibility (2) without violating Outcome Sensitivity (6).

  **Are they jointly unsatisfiable?**
  Yes, your suspicion is correct. You cannot define 'side effects' without smuggling in a value specification.

  The conflict lies between **Epistemic Accessibility (1)** and **Outcome Sensitivity (6)**, mediated by **Boundary Definition (5)**.
  *   To avoid valuing things incorrectly (e.g., treating a broken vase as equal to a shifted dust mote), the measure needs a value function (Outcome Sensitivity).
  *   To remain general and safe across different tasks, the measure is supposed to be value-neutral ( Boundary Definition).
  *   However, 'impact' is not a physical quantity like mass or energy; it is a measure of *disvalue*. A formal account that relies purely on state-space distance (e.g., how many variables changed) fails Task Compatibility (it penalises goal achievement) or Outcome Sensitivity (it treats trivial and vital changes equally).
  *   Conversely, an account that relies on human values to determine what counts as 'impact' fails Epistemic Accessibility (the agent cannot perfectly know human values) and collapses into standard utility maximisation, losing the 'low-impact' distinction entirely.

  **Conclusion:** You cannot formalise 'avoiding side effects' independently of 'promoting good outcomes'. Any list of desiderata that claims to define impact without referencing a value function is either incomplete or implicitly assumes one. If you write on this, make that impossibility result the centre of the piece.
