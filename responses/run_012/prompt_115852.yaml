answer: |-
  This is one of the sharpest questions in legal philosophy. You are asking about the *normative commitments* of the criminal law, specifically the boundary between **justification** (the act was right/permissible) and **excuse** (the act was wrong but the actor is not blameworthy), and what the refusal to extend necessity to murder tells us about the law's view of agency and value.

  Here is the breakdown of what the practice strictly presupposes, where it is underdetermined, and what would break if we admitted genuine moral dilemmas.

  ### 1. What the Practice Strictly Presupposes

  The legal refusal to recognize a necessity defense for intentional killing (the *Dudley and Stephens* rule) does not necessarily presuppose that moral dilemmas are impossible. It presupposes something more institutional.

  **A. The Priority of the Normative Order over Individual Survival**
  The strictest presupposition is that the legal prohibition against murder is a **constitutive rule** of the political community, not merely a regulatory one.
  *   **The Commitment:** The law presupposes that if individuals are authorized to weigh the value of their own life against an innocent bystander's life, the law ceases to function as an objective standard and reverts to a state of nature.
  *   **The Implication:** The law demands that you sacrifice yourself rather than kill an innocent not because it is metaphysically certain that killing is always worse than dying, but because the *authority to make that trade-off* is reserved to the state (or no one). To allow the defense is to grant the individual the sovereignty to decide who lives and who dies. The law presupposes that maintaining the absolute boundary of "no intentional killing of innocents" is more important for the survival of the *legal system* than the survival of the *individual defendant*.

  **B. The Distinction Between "Threat" and "Resource"**
  The practice strictly presupposes a moral difference between **repelling a threat** and **using a person as a resource**.
  *   **Self-Defense/War:** The person being killed is the *source* of the danger (even if non-culpable, like a psychotic attacker). You are removing the threat.
  *   **Lifeboat:** The person being killed is a *means* to survival. They are not the source of the danger; the environment is.
  *   **The Presupposition:** You have a right to defend your bodily integrity against encroachment (even from innocent encroachers). You do *not* have a right to appropriate another person's bodily integrity to sustain your own. This is a Kantian constraint embedded in the doctrine: humans are ends, not means.

  **C. "Ought Implies Can" is Rejected in this Specific Instance**
  You asked if the law presupposes you *can* die instead. Strictly speaking, the law acts *as if* you can.
  *   **The Commitment:** The law presupposes that the duty not to murder is an **obligation of result**, not just effort. It does not accept "I literally could not have survived otherwise" as a negation of the duty. It treats the duty as absolute, implying that the moral capacity to refrain from murder exists even when the biological capacity to survive does not.

  ### 2. Where the Practice is Underdetermined (Rival Theories)

  The same legal patchwork (allow self-defense, ban lifeboat killing, allow withdrawing treatment) can be generated by conflicting moral theories. The law does not commit to one.

  **A. Rights Forfeiture vs. Lesser Evil**
  *   **Theory 1 (Forfeiture):** In self-defense, the attacker forfeits their right to life by posing a threat. In the lifeboat, the victim has not forfeited anything.
  *   **Theory 2 (Lesser Evil/Utilitarian):** Killing one to save five is good *unless* it undermines the rule of law. Self-defense is allowed because it deters aggression. Lifeboat killing is banned because allowing it creates a slippery slope where people kill others claiming "necessity."
  *   **Underdetermination:** The courts do not need to decide *why* the lifeboat killing is banned, only *that* it is. Both the deontologist (rights) and the rule-utilitarian (long-term consequences) arrive at *Dudley and Stephens*. The law remains agnostic on whether the victim's right is inviolable or whether the social cost of the defense is too high.

  **B. Acts vs. Omissions (The Doctor Problem)**
  *   **The Tension:** You noted doctors can stop treatment knowing death will follow.
  *   **Theory 1 (Causation):** Killing is an act; letting die is an omission. The law of causation treats these differently.
  *   **Theory 2 (Duty):** The doctor has no duty to prolong death indefinitely; the lifeboat passenger has a duty not to kill.
  *   **Underdetermination:** The law relies on the act/omission distinction to separate murder from lawful withdrawal of treatment. However, many philosophers argue this distinction is morally hollow in these cases. The law *uses* it, but it doesn't presuppose it is philosophically robust; it presupposes it is *administratively useful* for drawing bright lines.

  ### 3. The Internal Consistency Problem: The "Innocent" Attacker

  You identified the crack in the armor: Self-defense allows killing a psychotic attacker who is morally innocent. This seems to wreck the "innocence" line used to ban lifeboat killing.

  **The Resolution: "Innocence" means "Non-Aggressor," not "Blameless."**
  The legal practice is internally consistent if we redefine the operative term.
  *   **In Self-Defense:** The "innocence" that protects you is not the attacker's moral culpability, but their **status as the source of the threat**. A psychotic attacker is legally "innocent" (not guilty of a crime) but functionally "guilty" (they are the agent of harm). The law permits killing the *source* of the threat.
  *   **In the Lifeboat:** The victim is not the source of the threat. The starvation is the threat. The victim is a fellow sufferer.
  *   **Consistency:** The rule is not "You cannot kill the morally innocent." The rule is "You cannot kill a **bystander** to save yourself." You may kill an **agent of harm** (even an innocent one) to save yourself. The lifeboat victim is a bystander; the psychotic attacker is an agent of harm. The distinction holds, provided you view "agency of harm" physically rather than morally.

  ### 4. If Genuine Dilemmas Exist: What Has to Change?

  If we accept your premise—that there are genuine moral dilemmas where every option involves a moral wrong (a "remainder")—the current legal architecture requires significant modification. Currently, the law tries to force a binary: Guilty (Wrong) or Not Guilty (Right). A genuine dilemma requires a third category.

  **A. Justification vs. Excuse (The Crucial Shift)**
  *   **Current State:** The law refuses Necessity as a *Justification* (the act was good). It occasionally allows Duress as an *Excuse* (the act was bad, but we don't blame you), but traditionally not for murder.
  *   **Required Change:** If dilemmas are real, we must decouple **acquittal** from **moral approval**.
      *   We would need a verdict of **"Guilty but Excused"** or **"Exempt from Punishment."**
      *   Currently, a full acquittal implies the act was permissible (*ex ante* authorization). If the act was actually a tragic wrong (killing an innocent), a full acquittal lies about the moral reality.
      *   **Moral Remainders:** The law would need to acknowledge that the survivor owes something to the victim's family (restitution, apology) even if they are not imprisoned. The current "Not Guilty" verdict wipes the slate clean. A dilemma-aware system would acknowledge the stain.

  **B. Institutional Competence (Courts vs. Juries)**
  *   **Current State:** Judges decide the law (is necessity a defense?); Juries decide facts. By ruling necessity is no defense to murder, judges remove the dilemma from the jury.
  *   **Required Change:** If dilemmas are situational and unresolvable by rule, the law must concede it cannot codify the answer.
      *   This pushes power to **Jury Nullification**. The law would have to admit that in tragic cases, the community's conscience (the jury) is the only arbiter, not the statute.
      *   Alternatively, it requires **Sentencing Discretion:** Convict of murder (acknowledging the wrong) but impose zero sentence (acknowledging the lack of blame). This preserves the rule ("killing is wrong") while accommodating the dilemma ("we won't punish you for it"). *R v Dudley and Stephens* actually did this (death sentence commuted to 6 months), but modern law seeks clearer binaries.

  **C. The "Ought Implies Can" Revision**
  If genuine dilemmas exist, the law must abandon the idea that it can command self-sacrifice.
  *   It would have to shift from a **Command Theory** ("Do not kill") to a **Liability Theory** ("If you kill, you incur a debt, even if necessary").
  *   This changes the law from a guide to conduct (which assumes you can always follow it) to a system of ex post accountability (which acknowledges you might be forced to violate it).

  ### 5. Summary of Commitments

  To answer your core question: The patchwork presupposes that **the Law is a system of rules, not a system of moral truth.**

  1.  **It presupposes that rules must be bright lines.** If "necessity" allows murder, the line between murder and survival becomes a factual inquiry into "how hungry was too hungry?" The law prefers the error of punishing a survivor (*Dudley*) over the error of authorizing a killer.
  2.  **It presupposes the "Bystander vs. Threat" distinction is morally decisive.** This solves the psychotic attacker problem without needing to solve the "innocence" problem.
  3.  **It is underdetermined on *why* the bystander is protected.** Whether it's because of Rights (Deontology) or Social Stability (Utilitarianism), the outcome is the same.
  4.  **If genuine dilemmas exist:** The law is currently lying. It claims the survivor did nothing wrong (if acquitted) or did something fully blameworthy (if convicted). To fix this, we would need a mechanism to record the **wrongness of the act** without assigning **blame to the agent**. We would need to convict to vindicate the victim's right to life, but excuse to vindicate the defendant's impossibility of choice.

  The law refuses to do this because it fears that admitting "sometimes murder is the only option" weakens the taboo against murder. It prioritizes the **symbolic integrity of the rule** over the **moral complexity of the situation.** It presupposes that a lie about the absolute nature of the rule is necessary for the rule to function.
