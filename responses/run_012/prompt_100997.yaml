  3.  **Task 1: Mapping the Substitution to the Swedish *Hen* Debate:**

      *   *Original Debate:* *Han* (he) / *Hon* (she) vs. *Hen* (neutral).
      *   *Hofstadter's Swap:* Race for Sex.
      *   *Swedish Context:* *Hen* is a *new* pronoun, not just a semantic shift of an old one. *Man* exists as a generic indefinite pronoun (like German *man* or French *on*), but it's homophonous with *man* (male).
