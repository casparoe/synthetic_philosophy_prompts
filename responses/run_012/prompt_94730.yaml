          *   *Analysis:* If wealth isn't compounded, log wealth maximization is equivalent to log utility. But if the resource is consumed (e.g., eating a meal, saving a life once), "growth rate" is category error.
          *   *Implication:* The theory might be silent or forced to treat one-off events *as if* they were repeated (ergodicity assumption).
