answer: |-
  **Scenario**
  In the summer of 2023, a road crew is resurfacing Main Street. They operate a specific asphalt paver, serial number #404, which breaks down frequently but keeps working. The crew does not refer to it by its serial number; instead, they organically begin calling the machine "Gus." When new workers ask which machine is Gus, the veterans say, "Gus is the paver laying Main Street." In the actual world, serial #404 is indeed the machine laying Main Street. However, there is a nearby counterfactual situation where serial #404 suffers a catastrophic engine failure before the job starts. To keep the schedule, the company sends a different paver, serial #405, to lay Main Street. The crew still refers to the job as "fixing Gus's route," but we must determine what the name "Gus" picks out in this counterfactual scenario.

  **Picture A (The Descriptive Picture)**
  *   **Reference in Counterfactual:** In the counterfactual world, "Gus" refers to serial #405, because #405 is the unique object satisfying the description "the paver laying Main Street."
  *   **Linking Sentence:** The sentence "Gus is the paver laying Main Street" expresses an analytic truth in this world.
  *   **Epistemic Status:** This sentence is knowable *a priori* by anyone who understands the meaning of the name "Gus," because the description constitutes the meaning of the term.
  *   **Necessary A Posteriori:** This case exhibits no necessary *a posteriori* truths. The identity "Gus is #404" is contingent (false in the counterfactual) and knowable *a posteriori*.

  **Picture B (The Rigid Picture)**
  *   **Reference in Counterfactual:** In the counterfactual world, "Gus" refers to serial #404, even though it is sitting idle in the depot. The name was attached to #404 in the actual world and rigidly designates it across all worlds where it exists.
  *   **Linking Sentence:** The sentence "Gus is the paver laying Main Street" expresses a contingent falsehood in this world (since #404 is not laying the street).
  *   **Epistemic Status:** This sentence is knowable only *a posteriori* (we had to inspect the actual world to see which machine got the name), and it is not analytic.
  *   **Necessary A Posteriori:** This case exhibits a necessary *a posteriori* truth: "Gus is serial #404." It is necessary because "Gus" picks out #404 in every possible world; it is *a posteriori* because we required empirical investigation to discover which serial number corresponded to the machine originally dubbed "Gus."

  **The Discriminating Feature**
  The feature doing the discriminating work is the **modal intuition regarding the name's attachment**. Specifically, it is whether the name tracks the *object* that originally bore it (the hunk of metal #404) or the *role* the object satisfies (the paver on Main Street). If your intuition is that "Gus" is still the broken machine in the depot, Picture B wins. If your intuition is that "Gus" is whichever machine is actually doing the work, Picture A wins.

  **Effect of Removal**
  If we remove the **contingency of the description**—for example, if "Gus" were defined as "The machine *capable* of laying Main Street" (a property #404 retains even when broken)—the divergence collapses. Both pictures would agree that "Gus" refers to #404 in the counterfactual, because #404 satisfies the modified description. The thought experiment relies entirely on the description being something the object could fail to satisfy while remaining the same object.

  **Defense of the Losing Picture**
  A defender of Picture A (Descriptivism) would resist this example by arguing that the speakers' description is more sophisticated than it appears. They would claim that when the crew says, "Gus is the paver laying Main Street," they implicitly mean "The paver *actually* laying Main Street" (a rigidified description). By building "actuality" into the description, the Descriptivist can account for the intuition that "Gus" refers to #404 even in the counterfactual, without conceding that the name is rigid independently of the description. They would argue that our intuition of rigidity is actually an intuition about the hidden indexical "actually" within the descriptive meaning.
