answer: |-
  # Q&A Prep Sheet: Hyperbolic Discounting & Akrasia
  **Workshop Context:** 15 attendees (Majority: Behavioral Econ; Minority: 2 Aristotelians, 1 Action Theorist).
  **Goal:** Clarify the conceptual boundaries of akrasia without rejecting the data.

  ### Strategic Concessions (Say these early or weave into replies)
  1.  **Correlation vs. Constitution:** Concede immediately that hyperbolic discounting (HD) is a robust *predictor* of akratic behavior. You are not denying the data; you are denying that the data *defines* the phenomenon.
  2.  **Observability:** Admit that "endorsement" is phenomenological and harder to measure than choice data. Frame this as a feature (capturing the agency) not a bug (ignoring the mind).
  3.  **Normativity:** Concede that you are making a claim about the *structure of agency*, not necessarily about welfare optimization (which is the economists' usual proxy for normativity).

  ---

  ### Objection 1: The "Black Box" Challenge
  **Who:** Lead Behavioral Economist (The majority view)
  **Phrasing:** "Look, the beauty of the $\beta$-$\delta$ model is that it reveals preference through choice. If 'endorsement' is an internal state we can't observe or parameterize, how is this anything more than a semantic stipulation? If I can't model the 'live judgment,' I can't distinguish your 'akrasia' from simple preference change in the data. You're making the phenomenon unmodelable."

  **Damage:** **High.** If the room decides your distinction is empirically empty, the paper loses relevance for the majority.

  **2-Minute Reply:**
  "I'm not asking you to throw out the model; I'm asking you to restrict its claim. The $\beta$-$\delta$ model explains *choice reversal*, which is a behavioral regularity. My project explains *agency failure*, which is a normative structure.
  Think of it like pain. We can model nociception (neural firing) perfectly, but nociception isn't identical to the experience of pain. Similarly, preference reversal is the 'nociception' of akrasia. Sometimes it signals pain (akrasia), sometimes it's just growth (preference change).
  If we define akrasia solely by reversal, we categorize Ulysses (who reverses but binds) and the Reformed Smoker (who reverses and quits) as structurally identical to the Relapsing Smoker. They aren't. My 'endorsement test' is the phenomenological gap between those cases. You don't need to parameterize endorsement to acknowledge that the *meaning* of the choice differs for the agent."

  **Thin Spot:** You are admitting your core criterion is unobservable to the economist. If they press on "scientific rigor," you have no recourse other than appealing to philosophical intuition.

  ---

  ### Objection 2: The "Two Selves" Challenge
  **Who:** Aristotelian Virtue Ethicist
  **Phrasing:** "You treat the agent as a unity across time, but your own description suggests fragmentation. If the later self has a different preference and doesn't endorse the earlier judgment, why is the earlier judgment authoritative? Why is the t2 self 'akratic' rather than just 'autonomous'? If the t2 self doesn't feel the authority of the t1 judgment, on what grounds do you say they are the same agent failing?"

  **Damage:** **High.** This attacks the metaphysical foundation. If the agent isn't unified, there is no weakness of *will*, just conflict between *selves*.

  **2-Minute Reply:**
  "This is the crux. I'm not arguing that t1 rules t1 by metaphysical fiat. The unity comes from the *narrative commitment* the agent maintains.
  Akrasia isn't just breaking a rule; it's betraying a commitment you still hold. In the Relapsing Smoker case, the t2 self *acknowledges* the authority of the health judgment ('I know I shouldn't') but acts against it. That tension *constitutes* the unity.
  In the Reformed Smoker case, the t2 self says, 'I no longer accept that judgment.' That's a change of mind, not a failure of will.
  So, the agent is unified precisely *in the struggle*. If there's no struggle because the judgment is dead, there's no akrasia. I'm not imposing t1's authority on t2; I'm pointing out that akrasia only exists when t2 *accepts* that authority and violates it anyway."

  **Thin Spot:** This leans heavily on the phenomenology of "struggle." If they argue that "accepting authority" is itself just another preference, you risk circularity.

  ---

  ### Objection 3: The Intention Challenge
  **Who:** Philosopher of Action
  **Phrasing:** "You say the akratic agent acts against a 'live' judgment. But what do they intend? If I judge X is best, but intend Y, am I irrational? Or do I actually judge Y is best *all-things-considered* at the moment of action? If the judgment is truly 'live,' how is the intention formed? It sounds like you're describing a divided mind, not a single intention."

  **Damage:** **Medium.** This questions the coherence of the action itself.

  **2-Minute Reply:**
  "I want to resist the idea that intention must align with all-things-considered judgment. That's the intellectualist view I'm challenging.
  The akratic intention is 'I will do Y, even though I judge X is best.' This is a distinct mental state from 'I judge Y is best.'
  We know this from the regret that follows immediately. If the judgment had actually shifted to Y, there would be no immediate regret, only satisfaction. The akratic intends the action *as* a violation. That's why the endorsement test works: the judgment remains the normative standard, even as the motivational force of desire overrides it. The intention is to gratify the desire *despite* the judgment."

  **Thin Spot:** This invites a debate on "Guise of the Good." If they are a strong proponent of the idea that we always act under the guise of the good, they will claim your "live judgment" must have been suppressed or clouded (returning to Aristotle).

  ---

  ### Objection 4: The Naive/Sophisticated Orthogonality
  **Who:** Behavioral Economist (Follow-up)
  **Phrasing:** "You say the naive/sophisticated distinction is orthogonal to akrasia. But sophistication affects welfare and planning. A sophisticated agent binds themselves (like Ulysses). A naive one doesn't. If sophistication changes the outcome, how can it be irrelevant to whether akrasia occurred?"

  **Damage:** **Medium.** Challenges your specific claim about the standard literature distinctions.

  **2-Minute Reply:**
  "Sophistication determines *whether* the reversal leads to a bad outcome, not *whether* the failure of will occurs.
  Consider two agents who both want to quit smoking. Both face a cigarette.
  Agent A (Naive) thinks 'I won't smoke' but smokes.
  Agent B (Sophisticated) thinks 'I will probably smoke' and smokes.
  If Agent B smokes while still judging they shouldn't, they are akratic, even if they predicted it. Sophistication is about *expectations* of future preferences. Akrasia is about the *relation* between current judgment and current action.
  You can be sophisticated and akratic (predicting your failure and failing anyway). You can be naive and not akratic (simply changing your mind). The variables track different things."

  **Thin Spot:** Economists often define rationality by welfare outcomes. If sophistication saves welfare, they will struggle to accept it's not part of the "rationality/akrasia" package.

  ---

  ### Objection 5: The Aristotelian Ignorance Check
  **Who:** Second Aristotelian (The "Textual" One)
  **Phrasing:** "Aristotle says the akratic acts in ignorance—the major premise is clouded. You say the judgment must be 'live' and fully endorsed. Aren't you contradicting the classic account? If the knowledge is fully active, wouldn't that make the action impossible?"

  **Damage:** **Low.** Mostly textual/historical, but good for rapport.

  **2-Minute Reply:**
  "I'm updating Aristotle, not discarding him. Aristotle distinguishes between having knowledge and *using* it. The akratic has the knowledge (it's 'live' in that sense) but fails to attend to it in the moment of action.
  My 'endorsement test' captures that specific failure of *attention* or *authority*. The knowledge isn't clouded in the sense of being gone; it's clouded in the sense of being overpowered.
  I'm arguing that if the knowledge disappears entirely (the preference actually changes), it's not akrasia. So we agree: some trace of the judgment must remain. I'm just insisting that trace must be normative endorsement, not just a vague memory."

  **Thin Spot:** You are interpreting "clouded" loosely. A strict textualist might push back that for Aristotle, the premise *is* temporarily lost.

  ---

  ### The Dreaded Question (The One You Hope Nobody Asks)
  **Who:** Anyone (but likely the Action Theorist or a sharp Econ)
  **Question:** "If the later self does not endorse the earlier judgment, you say it's not akrasia. But if the later self *does* endorse the earlier judgment, why does it lose? If the judgment is truly authoritative at t2, what motivates the violation? Isn't your 'endorsement' just a powerless epiphenomenon? If it has no motivational force, why call it a 'judgment' rather than a 'wish'?"

  **Why it's deadly:** It exposes the gap between your normative "endorsement" and the motivational psychology. If endorsement has no force, it's irrelevant to action theory. If it has force, why does it lose to hyperbolic discounting? This forces you to explain the *mechanism* of failure, which you've tried to keep conceptual.

  **Prepared Defense:**
  "That's the hard problem of agency. I'm not solving the mechanism of *how* desire overrides judgment; I'm defining the conditions under which we call that override 'akrasia.'
  Whether endorsement has motivational force is a separate psychological question. My claim is that *when* we identify akrasia, we are identifying cases where the agent perceives that force as authoritative but fails to align with it.
  Even if endorsement is 'powerless' in that moment, it's the *standard* by which the agent condemns themselves. Without that standard, there's no failure, just change."
