answer: |-
  Good morning, and welcome to this workshop on Skolem's Paradox. Looking around the room, I see a division of labour that is as deliberate as it is rare. Half of you could reconstruct the downward Löwenheim–Skolem proof on a napkin during the coffee break; the other half know the paradox primarily as a headline in the history of ideas, a moment where formalism seemed to bite its own tail. My task this morning is not to bridge that gap by simplifying the mathematics for the philosophers or dumming down the history for the logicians. Rather, I wish to propose an agenda that makes this split expertise the engine of our inquiry.

  We often introduce Skolem's Paradox as a shock about smallness. The narrative runs thus: Zermelo–Fraenkel set theory proves the existence of uncountable sets; yet, the Löwenheim–Skolem theorem guarantees that if this theory is consistent, it possesses a countable model. How can a countable model contain an uncountable set? It is a delicious contradiction, but it is also a distraction. If we focus solely on countability, we miss the broader structural lesson embedded in the theorem.

  The hook I want to place before you is this: the very machinery that hands you a countable model of set theory also hands you a model of every infinite cardinality. The Löwenheim–Skolem results are not merely about shrinking universes; they are about the indeterminacy of size itself. If a first-order theory has an infinite model, it has models of all infinite sizes. Consequently, what looks like a paradox about size is really a lesson about the inability of any theory to fix the cardinality of its own universe from the inside.

  For the specialists here, this is familiar terrain. You know that within the countable model, Cantor's diagonal argument still proceeds without error. The set that the model claims is uncountable is indeed uncountable *relative to the model*, because the bijection that would reveal its countability simply does not exist within the model's domain. The paradox dissolves once we distinguish between the internal perspective of the model and the external perspective of the metatheory.

  But for the purposes of this workshop, that dissolution is not the end of the matter; it is the beginning. If the theory cannot pin down the size of its own universe, what exactly is it pinning down? We are left with a profound relativity of cardinality. This is where I need the philosophers and historians to take the lead, supported by the rigour of the logicians. We are not here to merely nod at the distinction between internal and external truth. We are here to interrogate its cost.

  Over the next two days, I ask that we resist the urge to tidy this up too neatly. Do not let the paradox become a mere technicality to be filed away under 'model-theoretic artefacts'. If set theory is to serve as the foundation of mathematics, yet cannot distinguish between a countable universe and an uncountable one from within, we must ask what 'foundation' means in this context. Is the indeterminacy a bug in our formalisation, or is it a feature of mathematical reality itself?

  I propose we structure our sessions around three questions. First, on the nature of reference: when a set theorist quantifies over 'all sets', what is the scope of that quantification if the theory cannot fix its own model? Second, on the nature of truth: if cardinality is relative to the model, in what sense is the Continuum Hypothesis a determinate question? And third, on the historical trajectory: how did the mathematical community come to accept this relativity, and what alternatives were discarded along the way?

  We have the technical expertise to understand the mechanics, and the philosophical breadth to understand the implications. Let us ensure that the dialogue between these groups remains frank. Let us not shy away from the discomfort that Skolem intended. The theorem tells us that our theories are leaky vessels; they cannot hold the size of their own universe fixed. Our job is to decide whether we can still sail in them.

  Thank you, and let us begin.
