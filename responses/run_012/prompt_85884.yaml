  1. Is the question "Could *you* have..." about strict numerical identity across possible worlds?
      *   **No** → **Counterpart Theory**
          *   *Claim:* Origin is **Required** (you are world-bound), but the question is about counterparts.
          *   *Awkward Commitment:* You literally could not have been different, making modal claims about yourself strictly false.
