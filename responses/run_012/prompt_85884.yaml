  2. Case: A different sperm and egg yield a genome identical to yours. Is this individual you?
      *   **No** (Origin Required) → Go to 3.
      *   **Yes** (Origin Not Required/Genome Suffices) → Go to 4.

  3. Case: Two zygotes fuse to form one person (using the gametes that made you). Is this person you?
      *   **Yes** → **Gametic Origin Essentialism**
          *   *Claim:* Gametic origin is **Required** (and suffices for personhood, if not uniqueness).
          *   *Awkward Commitment:* You must accept that chimeras formed from your gametes are numerically identical to you despite different developmental histories.
      *   **No** → **Zygotic Essentialism**
          *   *Claim:* Zygotic origin is **Required**.
          *   *Awkward Commitment:* You must deny that a person formed from your exact zygotic material (via fusion) is you, privileging the initial cell boundary over continuity.

  4. Case: The same sperm and egg unite but the genome is altered early by a mutagen. Is this individual you?
      *   **No** → **Genome Essentialism**
          *   *Claim:* Genome is **Required and Suffices**.
          *   *Awkward Commitment:* You must accept that a clone with your genome is you, even if produced centuries later from somatic cells.
      *   **Yes** → Go to 5.

  5. Case: A zygote splits into monozygotic twins. Is it indeterminate which twin is you?
      *   **Yes** → **Bare Anti-Essentialism**
          *   *Claim:* No origin properties are **Required**.
          *   *Awkward Commitment:* You must accept that personal identity can be metaphysically indeterminate despite all physical facts being fixed.
      *   **No** → **Haecceitism**
          *   *Claim:* No origin properties are **Required** (identity is primitive).
          *   *Awkward Commitment:* You must accept brute facts about identity that do not supervene on any qualitative or historical properties.

