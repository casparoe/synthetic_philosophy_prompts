  **Notes on Logical Space and Cases**

  *   **Unused Cases:** The **IVF** case (same gametes in a dish) does not separate any target positions, as all realist leaves answer "Yes"; it serves only to rule out material-process essentialism not listed here. The **Cloning** case (somatic nucleus) collapses onto the **Duplicate Genome** node for Genome Essentialists (Yes) and Gametic/Zygotic Essentialists (No), though some Haecceitists might debate the transfer of haecceity; it is treated here as congruent with the Duplicate case.
  *   **Unoccupied/Incoherent Combinations:** The combination of answering "Yes" to **Duplicate Genome** (Origin not required) but "No" to **Mutagen** (Genome required) is occupied by **Genome Essentialism**. However, answering "No" to **Duplicate** (Origin required) and "Yes" to **Mutagen** (Genome not required) is the stable **Gametic Essentialist** position. A position claiming "No" to **Duplicate** and "No" to **Mutagen** is **Incoherent** for a realist essentialist, as it implies origin is required but neither gametes nor genome constitute that origin.
  *   **Indistinguishable Leaves:** The tree cannot separate **Haecceitism** and **Bare Anti-Essentialism** on origin cases alone, as both deny origin essentialism; the split relies on the student's intuition regarding *indeterminacy* in the **Twins** case rather than a difference in outcome.
  *   **Verbal Dispute:** The **Counterpart Theory** leaf makes the dispute merely verbal regarding the modal operator "could"; it agrees with **Gametic Origin Essentialism** on the practical outcome (no counterpart with different origin is *you*) but disagrees on the metaphysical explanation (transworld identity vs. similarity relation).
