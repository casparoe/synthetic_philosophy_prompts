answer: |-
  Good morning. For those who don't know me, I was [Advisor's Name]'s doctoral student. But standing here today, looking out at this room, I realize I am not the only one who learned from her.

  This gathering is unique. On one side of the aisle sit her colleagues and students, people who know her as a formidable mind, a scholar who spent a lifetime wrestling with the questions of how we live together. On the other side sit her family and her church family, people who know her as a devout woman, a person of prayer, and a quiet pillar of faith.

  It is rare that the two halves of a person's life meet in one room. But [Advisor's Name] would have wanted it this way. Because the great work of her life was not to keep these worlds separate, but to show how they could stand side-by-side without collapsing into one another.

  Many of you in the academic world know her for her work on John Rawls. You know the debates. You know the standard story: that Rawls began with high moral ideals and later retreated into a drier, political framework that asked religious people to leave their deepest convictions at the door when they entered the public square.

  [Advisor's Name] spent her career telling us that story was wrong.

  She argued that Rawls didn't want to keep religion out of public life because he thought it was unimportant. He wanted to keep it out because he thought it was too important to be handled by the state. She believed that if a society is held together by only one shared faith, the only way to maintain that unity is for the government to prop that faith up. And when the state props up faith, faith loses its freedom. It loses its soul.

  She taught me that the separation of church and state isn't a wall to keep God out. It is a fence to keep the government from touching God.

  But I know that for her family and congregation, this sounds like theory. You didn't know her for her arguments. You knew her for her presence. You knew that she was in the pews every Sunday, often before anyone else arrived. You knew that her philosophy was not a replacement for her religion, but a way of protecting the integrity of it.

  Most of her academic colleagues never knew she went to church. She didn't hide it out of shame. She kept it private because she believed that some things are too sacred to be used as credentials. She didn't wear her faith to win an argument. She lived her faith to honor a truth.

  And this brings me to the lesson I want to leave us with today. It is the idea she wanted her career to be built on.

  She used to say that the Rawlsian rule—the rule about how we speak to one another in public—isn't a rule about what you are allowed to believe. It is a rule about what can serve as a shared premise. It is about the language we use when we have to make decisions that affect everyone, not just our own.

  She had a test for this. She taught it to me in her office, and she lived it in her life. She said: **"The test is whether you'd be willing for the person across the table to reject it and still be owed an answer."**

  Think about that.

  If I come to you with a reason for how we should live, and you tell me, "I don't share that belief," do I walk away? Do I say you are lost? Or do I still owe you an answer? Do I still owe you respect?

  For [Advisor's Name], true respect wasn't agreeing with someone. It was staying at the table when they disagreed.

  She applied this to the great questions of justice. But she also applied it to the people in this room. To the philosophers who doubted the necessity of faith, she offered the rigor of her belief. To the believers who doubted the value of secular democracy, she offered the rigor of her reason. She never asked either side to surrender. She asked both sides to stay at the table.

  She believed that if I cannot give you a reason you can accept without forcing you to believe what I believe, then I am not talking *with* you. I am talking *at* you. And that is the beginning of coercion. That is the beginning of the state propping up the faith.

  In her own life, she was the person across the table for all of us.
  To her students, she was the advisor who demanded we clarify our terms, not to silence us, but to ensure we were actually hearing each other.
  To her church, she was the sister who prayed without demanding that the world conform to the church's rules to be worthy of love.
  To her family, she was the mother and wife who listened more than she spoke, always willing to let the other person reject her view and still be owed her kindness.

  There is a tension between faith and philosophy. Faith seeks the absolute; philosophy seeks the shared. [Advisor's Name] did not try to dissolve that tension. She held it. She carried it. She showed us that you can be fully devoted to the truth of heaven and fully devoted to the peace of earth, provided you understand that the peace of earth requires a language we all share, while the truth of heaven requires a silence only God can fill.

  Now, she has stepped away from the table. She no longer needs shared premises. She no longer needs to find the words that work for the believer and the skeptic alike. She is in a place where the test is over, because the answer is known.

  But we remain here. We remain in the room of disagreement. We remain in the world where we must decide how to live together.

  So, let us honor her by keeping our seats. Let us honor her by refusing to walk away when the person across from us rejects our premise. Let us honor her by remembering that we still owe each other an answer. We still owe each other respect.

  She spent her life teaching us how to build a society where different truths can dwell in peace. Now, it is up to us to dwell in it.

  Thank you.
