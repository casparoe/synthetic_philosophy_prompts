prompt: |-
  My dissertation advisor died in March and I'm giving the eulogy. She spent her whole career on Rawls and religion — her line was that everyone reads the later political stuff as a retreat from his early religious seriousness, and that this gets it exactly backwards: he never stopped thinking that a whole society can only be held together by one shared faith if the state props that faith up, which is why he wanted religion kept out of public reason, not because he thought any less of it. She was a churchgoer her entire life, which most of her colleagues never knew. Half the room at the memorial will be philosophers who know the public-reason debates inside out; the other half are her family and her congregation, who knew her as a devout woman and not at all as a theorist. Write the eulogy, seven minutes or so. It has to be honest about the tension between the faith and the philosophy without dissolving it into either "she was really a believer all along" or "her theory quietly replaced her religion," and without any vocabulary that will lose the family. The one thing I really want it built on, not just mentioned: her own view that the Rawlsian rule isnt a rule about what you may believe but about what can serve as a shared premise — she used to say the test is whether you'd be willing for the person across the table to reject it and still be owed an answer.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Subject:** Dissertation advisor (female), died in March.
      *   **Topic:** Her career focused on John Rawls and religion.
      *   **Key Intellectual Contribution:** She argued against the common view that Rawls's later political work was a retreat from his early religious seriousness. Instead, she argued he wanted religion kept out of *public reason* precisely because he valued it too much to let it be propped up by the state. A shared faith requires state coercion to hold a society together, which corrupts faith.
      *   **Personal Life:** Devout churchgoer her whole life (secret from most colleagues).
      *   **Audience:** 50% Philosophers (know public-reason debates), 50% Family/Congregation (know her as devout, not a theorist).
      *   **Tone/Constraint:** Honest about the tension between faith and philosophy. Avoid reducing her to *just* a believer or *just* a theorist. No jargon that loses the family.
      *   **Core Concept to Build Around:** The Rawlsian rule isn't about what you *may* believe, but what can serve as a *shared premise*. The test: Would you be willing for the person across the table to reject it and still be owed an answer?
      *   **Length:** ~7 minutes spoken (approx. 900-1100 words).

  2.  **Determine the Structure:**
      *   **Opening:** Acknowledge the loss, the dual nature of the room (two communities), and her role as a bridge.
      *   **The Intellectual Core (Simplified):** Explain her work on Rawls without jargon. Focus on *why* she thought separating church and state protects faith.
      *   **The Personal Core:** Her private devotion. The fact that colleagues didn't know, but it fueled her work.
      *   **The Synthesis (The "Test"):** Integrate the specific prompt requirement about the "shared premise" and the "person across the table." This is the heart of the eulogy.
      *   **Closing:** How she lived this principle. A final farewell that speaks to both groups.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Start with the split in the room. It's a unique gathering. She lived in both worlds.
      *   *Explaining the Work:* Need to translate "public reason" and "political liberalism" into plain English.
          *   *Idea:* Use the metaphor of a table or a foundation.
          *   *Drafting thought:* Don't say "comprehensive doctrines." Say "deep convictions." Don't say "overlapping consensus." Say "common ground."
          *   *Key point:* She believed Rawls wasn't pushing God away; he was protecting God from politics.
      *   *Her Faith:* Mention she was in church every Sunday. The colleagues didn't know, but it wasn't a secret she kept out of shame; it was a private garden.
      *   *The Core Concept (The Prompt):* This needs to be the pivot point.
          *   *Quote/Paraphrase:* "The test is whether you'd be willing for the person across the table to reject it and still be owed an answer."
          *   *Application:* How did she live this? She didn't demand agreement to offer respect.
      *   *Conclusion:* She is now beyond the need for public reason. She sees clearly.

  4.  **Refining the Tone:**
      *   *Avoid:* "Epistemological," "Normative," "Comprehensive Doctrine," "Veil of Ignorance."
      *   *Include:* "Respect," "Conversation," "Foundation," "Love," "Truth."
      *   *Balance:* Ensure the philosophers don't feel she's being reduced to a Sunday School teacher, and the family doesn't feel she's being reduced to a cold academic. She was *both*.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hello everyone. I'm [Name]. She was my advisor. Half of you know her as a philosopher, half as a church member. She studied Rawls. People think Rawls hated religion in politics. She said no, he loved it too much to let the state touch it. She went to church always. She taught me that rules aren't about silencing belief but about how we talk. The test: Can you disagree and still talk? She lived this. Goodbye.

      *Critique 1:* Too dry. Needs more emotion and better flow. The "test" needs to be the climax.

  6.  **Drafting - Iteration 2 (Focusing on the "Test"):**
      Let's make the "table" imagery central. The philosophical table and the communion table.
      *   *Opening:* Welcome both groups.
      *   *Middle:* Explain her theory. It's not about silencing God. It's about not using the police to enforce God.
      *   *The Pivot:* The specific quote about the person across the table.
      *   *Ending:* She is now across the table from God.

  7.  **Writing the Content (incorporating constraints):**
      *   *Word Count Check:* 7 minutes is roughly 1000 words at a moderate pace.
      *   *Jargon Check:* Ensure "public reason" is explained contextually if used. Better to use "shared language."
      *   *The "Tension":* Make sure I don't say "her philosophy was just her faith." Say her philosophy *protected* the integrity of her faith.

      *(Self-Correction during drafting)*: I need to be careful not to make the philosophers feel like I'm dumbing it down, or the family feel like I'm preaching. The bridge is *respect*.
      *   *Key phrase to integrate:* "The test is whether you'd be willing for the person across the table to reject it and still be owed an answer."

  8.  **Final Polish:**
      *   Check rhythm and cadence.
      *   Ensure the emotional arc lands.
      *   Verify the specific Rawls interpretation is accurate to the prompt (state propping up faith = bad).

      *(Final Review against Prompt)*:
