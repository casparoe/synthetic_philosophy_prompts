  ### 1. The cases that set the bar

  The five cases stress-test construction across time, biology, and power, demanding a theory that handles both fragility and inertia. Witches demand an account of extinct kinds: if the category vanishes, did the people cease to be witches, or did the kind cease to exist, and how do we speak of their reality now? Money tests institutional reality: shells function as currency without intrinsic value, relying on collective intentionality that can shift overnight via redenomination, yet commands goods instantly. Race pressures context dependence: the same body counts as different kinds across borders, proving membership isn't physical, yet the hierarchy persists regardless of individual belief or denial. Essential workers show rapid construction: a label coined in crisis immediately altered material access to vaccines and pay, proving new kinds can bite instantly without historical sedimentation. Sex versus gender is the hard limit: any theory must distinguish biological constraints from social performance without collapsing one into the other or denying the reality of either. Together, these cases require a theory to explain how ideas become structures, how structures constrain bodies, and how both can change without denying the reality of their effects. Your friend's equation of money and race fails because it ignores the differential stickiness of these structures; money can be redenominated by fiat, but racial hierarchy survives the fiat. A theory must explain why some constructions are paper and others are stone. This specification is not about deciding which cases are valid, but about ensuring the theory can process the data they provide. A theory that simplifies money to mere agreement cannot handle the inertia of race. A theory that naturalizes sex cannot handle the variability of race. The spec must force the theory to account for the mechanism of construction, not just the label. It must distinguish between the token and the type, the practice and the rule. Ultimately, the cases demand an ontology that is robust enough to crush you but flexible enough to vanish.

  ### 2. What a theory has to deliver

  1. **Causal Power:** Constructed kinds must produce physical effects independent of individual belief or understanding. Behind this is money and essential workers; a bank transfer moves goods even if you don't understand banking, and hazard pay arrives regardless of your opinion on the label. A theory fails here if it treats construction as merely descriptive or linguistic, rendering social kinds epiphenomenal shadows that track reality but never touch it. If the theory cannot explain how a piece of paper kills a man via economic exclusion, or how a job title grants vaccine priority, it is useless. It must grant social facts the same causal gravity as physical facts. Without this, construction is just storytelling. The theory must show how the concept itself becomes a causal mechanism in the world.

  2. **Contextual Variability:** Kind membership must allow for change without physical alteration in the subject. Race demonstrates this clearly: crossing a border changes your racialization without changing your DNA or ancestry. A theory fails if it posits a hidden essence or necessary physical trait for membership, forcing it to deny that the same person can be different kinds in different places. It must explain how the social context, not the body, determines the kind without making the kind arbitrary in its effects. If it cannot handle the Brazil-versus-US racial classification difference, it cannot handle race. This variability is the core of the racial puzzle. The theory must accommodate fluid boundaries without losing explanatory power.

  3. **Historical Contingency:** The theory must allow kinds to cease existing while their subjects remain. Witches were real agents of harm within their framework, but the kind 'witch' no longer picks out anyone today. Failure looks like eternalism, where the category always existed waiting to be found, or eliminativism, where witches never existed at all, denying the historical reality of the executions. The theory must navigate between saying the kind was real then but isn't now, without contradicting itself. It must explain ontological death without physical death. If it says witches were always real, it validates the persecutors; if it says they were never real, it erases the victims. The theory must handle extinction events.

  4. **Material Constraint:** Social construction cannot imply infinite malleability of the physical substrate. Sex versus gender requires acknowledging biological facts that constrain social interpretation without determining it. A theory fails if it becomes idealist, suggesting bodies are purely discursive products immune to medical fact, or biologistic, suggesting social roles are direct readouts of anatomy. It must account for the resistance of the physical world without surrendering to naturalism. If it says biology is irrelevant, it fails sex; if it says biology is destiny, it fails gender. The body pushes back. The theory must find a middle ground between determinism and voluntarism.

  5. **Intersubjective Stability:** The kind must persist despite individual dissent or ignorance. Money works even if you reject it; race oppresses even if you deny its validity. A theory fails if it relies on universal consent, collapsing whenever a single agent opts out, which would make social reality impossibly fragile. It must explain how structures endure beyond the consciousness of the participants who sustain them through routine action. A theory that requires everyone to agree on the value of the dollar to explain inflation is dead on arrival. Stability must be explained through practice, not just agreement. The structure must hold even when the agents are unaware.

  6. **Normative Resistance:** Constructed hierarchies must be difficult to dismantle despite being arbitrary in origin. Race and essential worker statuses create entrenched interests that resist change. A theory fails if it implies that because something is constructed, it is easily deconstructed, underestimating the inertia of institutionalized practice. It must explain why some constructions harden into stone while others remain fluid, without appealing to natural necessity. It must distinguish between a label that sticks and a label that binds. Arbitrary does not mean easy. The theory must account for the power dynamics that sustain the construction against efforts to change it.

  ### 3. Requirements that can't both be met

  The sharpest tension lies between Material Constraint and Contextual Variability. If you demand a biological anchor to satisfy Sex, you struggle to explain Race's border-crossing fluidity without biology. If you prioritize Variability to satisfy Race, you risk making Sex seem wholly arbitrary, contradicting medical reality and lived experience. You must give up strict Material Constraint in favor of Variability. Biology provides a substrate, not a blueprint. Prioritizing Variability ensures the theory handles the political stakes of Race and Witches, where physical traits were often irrelevant to the kind's operation. A theory that anchors too hard in the physical cannot explain why the same body is protected in one jurisdiction and hunted in another. The cost is accepting that even sex categories are stabilized by practice, not just nature, but this is preferable to naturalizing racial hierarchy or denying the reality of social extinction. This choice also protects the Essential Worker case, where biology is irrelevant but constraint is high. The theory must accept that stability comes from power, not physics.

  ### 4. What does the most filtering

  The requirement that kills the most views is Causal Power Independent of Individual Belief. Many respectable theories collapse because they make social reality too dependent on conscious acceptance or linguistic agreement. Strict Realists claim social kinds map to mind-independent structures, often ignoring the role of human practice in sustaining them, making them unable to explain historical change or the witch case. Nominalists claim kinds are merely names we use for convenience, failing to explain why those names constrain behavior like laws of physics or distribute resources like property in the money case. Constructivists claim kinds are produced by practices but constrain future action, though some versions struggle to explain the resistance of the material world or the inertia of institutions in the sex case. Only views that grant constructed entities ontological weight comparable to physical objects, capable of acting on bodies without constant renewal of belief, survive this filter. This requirement forces the theory to treat social facts as hard facts.
