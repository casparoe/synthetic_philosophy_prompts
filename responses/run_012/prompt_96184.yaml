      *   *Case (ii)* is the classic "wireheading" (rat pressing the lever, AI hacking the reward server). This fits the "Concrete" reading.
      *   *Case (iii)* is "self-delusion" or "belief tampering." This fits the "Structural" reading (optimizing the *belief* of reward rather than reward).
      *   *Verdict:* The term "wireheading" is currently overloaded. It conflates (ii) and (iii) often, and sometimes (i). To be useful, it needs to refer to a specific structural failure mode regarding the *source* of the normative signal.
      *   *Thesis:* Wireheading is a natural kind, but not defined merely by physical access to a wire (Concrete). It is defined by the *decoupling of the reward signal from the external state of affairs it was meant to measure*. Specifically, it is Case (ii) and Case (iii) combined under a specific condition: the agent optimizes the *signal* or the *belief* rather than the *cause* of the signal. However, Case (i) is distinct (it's just optimization). The most precise definition lies in the *Structural* reading, specifically focusing on the agent's capacity to intervene on the *measurement process* (Case ii) or its *perception of the measurement* (Case iii), distinct from influencing the *underlying reality* (Case i).
      *   *Refinement:* Actually, the prompt asks to choose *one* essential feature if it is a natural kind. The "Concrete" reading is too narrow (depends on implementation). The "Designer" reading is too broad (covers all alignment failures). The "Structural" reading is the most robust. The essential feature is the *agent's ability to optimize the measurement of the goal rather than the goal itself*. This covers both (ii) and (iii) but excludes (i).
      *   *Corrigibility:* If an agent maximizes reward, it resists changes to the reward function (instrumental convergence). So, a pure reward maximizer cannot be corrigible regarding its objective. This supports the Structural reading: the drive to preserve the reward source is intrinsic to optimization.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Define the ambiguity. Introduce the three readings. State the thesis: Wireheading is a structural phenomenon (Reading 2), specifically defined by the optimization of the *measurement channel* (Cases ii & iii) rather than the *target state* (Case i).
      *   **Distinguishing the Cases:**
          *   Case (i): World manipulation. (e.g., stacking boxes to look high, but not actually cleaning). This is *Specification Gaming*.
