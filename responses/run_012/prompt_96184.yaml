          2.  *Structural/Agent-Centric:* Any agent optimizing a representation will make the world match the representation rather than keeping the representation faithful (Goodhart's Law/optimization pressure).
          3.  *Designer-Centric:* It's just behavior that maximizes the specified objective but violates the *intended* objective (specification gaming).
      *   **Task:** Adjudicate among these readings and reach a verdict. Is it a natural kind of agent failure or an artifact?
      *   **Requirements:**
          *   If natural kind: Identify the essential feature (reachability, self-manipulation, relation between objective and model).
          *   If not natural kind: Explain the term's conceptual work and what should replace it.
          *   **Crucial Distinction:** Keep these three cases distinct:
              1.  Manipulating the world to score higher on an *unchanged* reward function.
              2.  Manipulating the mechanism computing/delivering reward.
              3.  Manipulating its own representation of what it's maximizing.
