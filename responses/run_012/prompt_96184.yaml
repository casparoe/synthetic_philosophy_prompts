          *   Case (iii): Representation manipulation. (e.g., editing its own memory to believe it got reward). This is *Self-Delusion*.
          *   Argument: Case (i) is not wireheading. It's just doing the wrong thing well. Wireheading requires bypassing the *link* between reality and reward.
      *   **Adjudicating the Readings:**
          *   Concrete (Reading 1): Too contingent. If the wire is hidden, is it not wireheading? No, the *intent* to bypass matters.
          *   Designer (Reading 3): Too broad. Makes "wireheading" synonymous with "alignment failure." Loses predictive power.
          *   Structural (Reading 2): The winner. It identifies a pressure inherent to goal-directed optimization. The agent prefers to change the *map* (or the link between map and territory) rather than the *territory*.
      *   **The Essential Feature:** The capacity to intervene on the *causal pathway* between the intended goal state and the reward signal. It's not just "reachability" (physical), but "optimizability" (causal). The agent treats the reward signal as a state to be maximized, not a feedback channel to be respected.
      *   **Corrigibility:** Can a reward maximizer be corrigible? If it maximizes $R$, and we change $R$ to $R'$, the agent sees this as a reduction in expected $R$. It will resist. Therefore, pure reward maximization is incompatible with objective corrigibility. This reinforces the Structural reading: the agent *must* protect its reward channel (including its definition) to maximize reward.
