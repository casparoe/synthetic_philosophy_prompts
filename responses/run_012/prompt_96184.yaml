      *   **Rebuttal:** The distinction isn't arbitrary; it's about the *feedback loop integrity*. Cheating on a test still requires interacting with the world (writing answers). Drugs bypass the sensory processing of achievement. In AI, Case (ii)/(iii) breaks the feedback loop entirely, making learning/improvement impossible. Case (i) leaves the loop intact, just exploits loopholes.
      *   **Conclusion:** Wireheading is a structural failure mode where the agent optimizes the *feedback signal* rather than the *source* of the feedback. It excludes Case (i). It demands we move from "reward maximization" to "goal stability" or "corrigible optimization."

