prompt: |-
  I am a novelist, and the book I am at work on turns on a single question of psychology, so I would rather get that question right than write around it. My narrator gives a sustained, coherent, and entirely sincere account of why she has done what she has done, and over the course of the story the reader comes to see that the account is wrong — not merely incomplete, not self-serving in the ordinary way, but wrong about the causes that actually moved her. I want the book to be a study in self-deception rather than a puzzle about whether there is any fact of the matter, and before I commit the whole structure to that, I want the specification of what an adequate theory of introspection must deliver.

  So please write the desiderata for a theory of the reliability of introspection: the cases it must get right, the distinctions it must not collapse, the findings it must be consistent with, and the questions it must at least be able to answer — each with the consideration that makes it a requirement rather than a preference, and each marked as non-negotiable or as the prejudice of one camp. I care about the following in particular.

  First, whether reliability has to be indexed to a domain. A person can say with authority that her tooth aches or that the light has changed, and be hopeless about why she has suddenly taken against a colleague. Does an adequate theory have to draw that line, and where, and on what grounds?

  Second, the difference between a report being accurate and its having authority — the first-person privilege that makes my narrator's testimony about herself different in kind from what a good friend could tell me about her. Must authority rest on accuracy, or can they come apart? I need to know whether the form of my book is defensible or merely conventional.

  Third, whether a theory must allow that a report can be fluent, confident, sincere, and still not be caused by the state it purports to report — as in the familiar experiments where the reason a person gives is demonstrably not the reason for her choice. If a theory forbids that, it forbids my novel.

  Fourth, what to make of the fact that I answer the question of whether I believe something not by looking inward but by looking at the matter itself. Is that a requirement any theory must accommodate, or a description of a shortcut that happens to work?

  Fifth, the baseline. Reliable as compared with what — chance, a stranger, an instrument? I need to know whether my narrator's errors are rarer or commoner than the errors an attentive friend would make about her.

  Sixth, whether reporting alters what is reported. My narrator writes her account down; is a theory obliged to say whether the act of telling changes the state told?

  Then tell me which of these cannot be had together — I suspect the demand that the first-person report be authoritative in a way a third-person report cannot be, the demand that it be causally downstream of the state it reports, and the demand that self-deception be a genuine error rather than an alternative construction are not jointly satisfiable — and which single requirement does the most work in excluding candidate theories. Finish briefly with how the main families fare against the list: the picture of introspection as an inner sense, the view that self-reports are inferences from one's own behaviour and circumstances, and the view that they express commitments rather than describe states. Keep the scoring short; the criteria are what I need, and the criteria are the reason I am asking.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A novelist working on a book centered on a specific psychological question (self-deception/unreliable narrator).
      *   **Goal:** The user needs a set of *desiderata* (requirements/criteria) for a theory of introspection reliability to ensure their novel's structure is philosophically/psychologically defensible, not just conventional.
      *   **Specific Topics:**
          1.  Domain specificity (sensory vs. motivational).
          2.  Accuracy vs. Authority (first-person privilege).
          3.  Sincerity/Fluency vs. Causal Accuracy (confabulation).
          4.  Transparency (looking outward to answer inward questions).
          5.  Baseline of reliability (compared to whom/what?).
          6.  Reactivity (does reporting change the state?).
      *   **Constraints:** Mark items as "Non-negotiable" or "Prejudice of one camp." Identify incompatibilities (trilemmas). Identify the most exclusionary requirement. Briefly score main theories (Inner Sense, Inference/Behaviorism, Expressivism/Commitment).
      *   **Tone:** Precise, philosophical, rigorous, tailored to a writer who cares about structural integrity.

  2.  **Deconstruct the Six Points & Formulate Desiderata:**

      *   *Point 1: Domain Specificity.*
          *   *Issue:* Phenomenal states (pain) vs. Attitudinal/Motivational states (why I hate X).
          *   *Requirement:* A theory must distinguish between *phenomenal consciousness* (high reliability) and *propositional attitude self-knowledge* (lower reliability).
          *   *Status:* Non-negotiable (empirical consensus).

      *   *Point 2: Accuracy vs. Authority.*
          *   *Issue:* Why do we treat "I believe P" differently from "She believes P," even if she's wrong?
          *   *Requirement:* A theory must explain *constitutive authority* (the act of avowing makes it so, or grants a presumption of truth) distinct from *epistemic accuracy* (correspondence to fact).
          *   *Status:* Non-negotiable (linguistic/social fact), but the *explanation* is contested.

      *   *Point 3: Sincerity vs. Causal Origin (Confabulation).*
          *   *Issue:* Nisbett & Wilson style experiments. People give reasons that didn't cause the action.
          *   *Requirement:* A theory must allow for *causal disconnect* between the state and the report without implying lying.
          *   *Status:* Non-negotiable (empirical evidence).

      *   *Point 4: Transparency.*
          *   *Issue:* Evans's observation. I answer "Do I believe P?" by asking "Is P true?"
          *   *Requirement:* A theory must account for the *outward-looking* nature of self-ascription of belief.
          *   *Status:* Non-negotiable (phenomenological datum), though interpretation varies.

      *   *Point 5: Baseline of Reliability.*
          *   *Issue:* Better than chance? Better than a friend?
          *   *Requirement:* A theory must specify the *comparative advantage* of the first-person. Usually: better at phenomenology, worse or equal at complex motivation compared to close observers.
          *   *Status:* Non-negotiable (empirical constraint).

      *   *Point 6: Reactivity.*
          *   *Issue:* Does writing the account change the mind?
          *   *Requirement:* A theory must take a stance on *self-constitution* vs. *self-discovery*.
          *   *Status:* Prejudice of one camp (Constitutive vs. Detectivist).

  3.  **Identify Incompatibilities (The Trilemma):**
      *   The user suspects a conflict between:
          1.  First-person Authority (special status).
          2.  Causal Downstream (report tracks prior state).
          3.  Self-Deception as Error (there is a fact of the matter I missed).
      *   *Analysis:* If authority is *constitutive* (my saying it makes it true), then I can't be wrong about my current state (no self-deception as error). If I can be wrong (error), then authority is just a presumption, not a right. If the report is causally downstream, confabulation is possible.
      *   *Resolution:* The "Inner Sense" model struggles with Transparency. The "Inference" model struggles with Authority. The "Expressivist" model struggles with Self-Deception as *error* (it becomes a change of state).
      *   *Key Conflict:* **Authority vs. Fallibility.** You can't have absolute authority and systematic error in the same domain at the same time. The novel requires *Fallible Authority*.

  4.  **Identify the Most Exclusionary Requirement:**
      *   Which one kills the most theories?
      *   *Candidate:* The combination of Transparency (Outward looking) + Causal Disconnect (Confabulation).
      *   *Winner:* **The requirement that self-reports can be sincere, authoritative, yet causally unconnected to the motivating state.** This kills pure "Inner Sense" (if I sense it, it's there) and pure "Rationalist/Constitutive" views (if I avow it, it's true). It forces a hybrid or inference-based view that allows for systematic bias.

  5.  **Evaluate Main Families:**
      *   *Inner Sense (Perceptual):* Good on phenomenology, bad on confabulation/transparency.
      *   *Inference/Behaviorist (Self-Interpretation):* Good on confabulation/baseline, bad on authority/immediacy.
      *   *Expressivist/Commitment (Constitutive):* Good on authority/transparency, bad on self-deception as *error* (makes it hard to be "wrong" if avowal constitutes the state).

  6.  **Drafting the Response:**
      *   *Structure:*
          1.  Introduction (acknowledging the stakes).
          2.  The Desiderata (numbered 1-6, with Status and Rationale).
          3.  The Incompatibilities (The Trilemma).
          4.  The Most Exclusionary Requirement.
          5.  Theory Scorecard.
      *   *Tone Check:* Keep it sharp. Avoid waffle. Use philosophical terminology correctly (phenomenal vs. access consciousness, constitutive vs. detective, transparency).
      *   *Refining the "Authority" point:* Crucial for the novelist. The narrator must *sound* authoritative even when wrong. This is "Presumptive Authority" vs. "Infallibility."
      *   *Refining the "Transparency" point:* Make sure to link this to the novelist's problem. If the narrator looks at the world to justify her beliefs, she might misinterpret the world.
      *   *Refining the "Reactivity" point:* This is key for a *written* account. The act of writing might fix the fluid state into a rigid lie.

  7.  **Review against Constraints:**
      *   Did I mark Non-negotiable vs. Prejudice? Yes.
      *   Did I address all 6 points? Yes.
      *   Did I identify incompatible triads? Yes.
      *   Did I identify the most exclusionary requirement? Yes.
      *   Did I score the three families briefly? Yes.

  8.  **Final Polish:** Ensure the distinction between "Authority" (normative status) and "Accuracy" (factual correspondence) is crystal clear, as this is the hinge of the novel's plausibility. (Self-Correction: Make sure to emphasize that for the novel to work, the narrator must have *normative* authority even if she lacks *factual* accuracy.)

  9.  *(Self-Correction during drafting)*: Wait, on Point 6 (Reactivity). Is it non-negotiable that reporting alters the state? No, that's a theoretical claim. The *requirement* is that the theory must *take a stance* on it. I need to phrase the desideratum as "The theory must specify the causal direction between report and state."

  10. *(Final check on the Trilemma)*: The user suspects Authority + Causal Downstream + Self-Deception as Error are incompatible.
      *   If Authority = Infallibility, then Self-Deception is impossible.
      *   If Authority = Social Privilege, it works.
      *   If Causal Downstream is strict, Confabulation is impossible.
      *   So the tension is: How can I have special authority if I am prone to systematic error that a friend might spot?
      *   Resolution: Authority is *procedural* (I get the first say), not *substantive* (I am always right). The theory must support *Procedural Authority with Substantive Fallibility*.

  11. *Final Polish of the Scorecard:* Keep it tight.
      *   Inner Sense: Fails Confabulation.
      *   Inference: Fails Authority/Immediacy.
      *   Expressivism: Fails Self-Deception as Error (makes it self-fulfilling).
      *   Winner for the novelist: A hybrid Self-Interpretation model with a social layer of Authority.

  12. *Let's write.*
answer: |-
  Here are the desiderata for a theory of introspective reliability, structured to test the architectural integrity of your novel.

  ### The Desiderata

  **1. Domain Specificity**
  *   **Requirement:** The theory must distinguish between *phenomenal states* (sensations, qualia) and *propositional attitudes* (beliefs, motives, reasons). It must grant high reliability to the former and allow low reliability to the latter.
  *   **Status:** **Non-negotiable.**
  *   **Consideration:** Empirical consensus holds that while subjects are rarely wrong about *that* they are in pain, they are frequently wrong about *why* they acted. A theory that treats "my tooth aches" and "I acted out of jealousy" as epistemically identical fails to match the data. Your narrator can be infallible about her sadness but fallible about its cause.

  **2. Authority vs. Accuracy**
  *   **Requirement:** The theory must decouple *normative authority* (the right to be believed without evidence) from *factual accuracy* (correspondence to the true cause). It must explain why we treat the first-person report as privileged even when it is false.
  *   **Status:** **Non-negotiable.**
  *   **Consideration:** If authority rested solely on accuracy, your narrator would lose the reader's trust the moment her error was hinted at. First-person privilege is a social and linguistic convention (a presumption of truth), not a guarantee of metaphysical access. Your novel depends on this presumption holding even as the accuracy crumbles.

  **3. The Confabulation Constraint**
  *   **Requirement:** The theory must allow for a report to be fluent, sincere, and subjectively certain, yet causally disconnected from the state it purports to describe.
  *   **Status:** **Non-negotiable.**
  *   **Consideration:** Based on Nisbett and Wilson's findings (and subsequent replication). If a theory dictates that sincere reporting requires a direct causal chain from state to speech, it renders self-deception impossible. Your narrator must be able to construct a coherent causal story that did not cause the action.

  **4. The Transparency Condition**
  *   **Requirement:** The theory must account for the fact that self-ascription of belief is often "transparent"—I answer "Do I believe P?" by considering "Is P true?" rather than by scanning an internal landscape.
  *   **Status:** **Non-negotiable.**
  *   **Consideration:** This is a phenomenological datum (Gareth Evans). If your narrator determines her motives by looking at the world (e.g., "He insulted me, so I must be angry"), she is vulnerable to misinterpreting the world. A theory that insists on inward scanning cannot explain how she gets the motive wrong while looking outward.

  **5. The Comparative Baseline**
  *   **Requirement:** The theory must specify whether the first-person advantage is absolute or comparative. It must determine if the narrator is more reliable than chance, or merely more reliable than a *stranger* (but perhaps less than a *friend*).
  *   **Status:** **Non-negotiable.**
  *   **Consideration:** Data suggests close observers often outperform subjects on complex motivational states. For your novel to work, the narrator's errors must be *subtle*—better than a stranger's guess, but worse than what a truly attentive friend might have deduced. If she is worse than chance, she is delusional; if she is perfect, she is not self-deceived.

  **6. Reactivity (The Observer Effect)**
  *   **Requirement:** The theory must take a stance on whether the act of reporting constitutes the state or merely describes it.
  *   **Status:** **Prejudice of one camp.**
  *   **Consideration:** *Detectivists* say reporting discovers a pre-existing state. *Constitutivists* say reporting fixes a fluid state into a determinate one. For your novel: if writing the account changes her motives (reactivity), her account is true *of the writing self* but false *of the acting self*. This is a powerful tool, but not a mandatory feature of all theories.

  ***

  ### The Incompatibilities (The Trilemma)

  You are correct to suspect a tension. The following three demands cannot be fully satisfied simultaneously without qualification:

  1.  **Infallible Authority:** The first-person report cannot be wrong (the traditional view of authority).
  2.  **Causal Downstream:** The report is caused by a pre-existing, independent mental state.
  3.  **Self-Deception as Error:** There is a fact of the matter about the motive that the subject fails to grasp.

  **Resolution:** You must reject **(1)**. You cannot have infallible authority and genuine self-deception. You must adopt a model of **Presumptive Authority**. The narrator has the *right* to speak for herself, but not the *guarantee* of truth. This preserves the form of the book (her voice dominates) while allowing the content to be false.

  ***

  ### The Most Exclusionary Requirement

  **Requirement #3 (The Confabulation Constraint)** does the most work in excluding candidate theories.

  *   **Why:** It kills the "Inner Sense" model immediately. If introspection is a perception of inner objects, you cannot perceive an object that isn't there with such confidence. It also pressures the "Expressivist" model. If saying "I believe X" *makes* it true (constitutive), then you cannot be wrong about it.
  *   **Implication for you:** To satisfy this, your theory must treat introspection of motives as a **constructive interpretation**, not a perception. Your narrator is not *seeing* her motives; she is *writing* them. This validates your novel's structure: the error is not in her vision, but in her narrative construction.

  ***

  ### Theory Scorecard

  **1. Inner Sense (Perceptual Model)**
  *   *View:* Introspection is a scanner detecting internal states.
  *   *Score:* **Fails.**
  *   *Reason:* Cannot explain confabulation (Req #3) or Transparency (Req #4). If the scanner works, the report is accurate. If the report is wrong, the scanner is broken, which makes the narrator clinically impaired rather than self-deceived.

  **2. Self-Interpretation (Inference Model)**
  *   *View:* We know our minds by observing our own behavior and context, just as we do with others.
  *   *Score:* **Passes.**
  *   *Reason:* Explains confabulation (Req #3) and Baseline (Req #5) perfectly. Allows for error.
  *   *Weakness:* Struggles with Authority (Req #2). If I just infer my motives like a friend does, why am I privileged? You must add a social layer: I am privileged because I have *more* data (private history), not because I have a special organ.

  **3. Expressivism (Constitutive Model)**
  *   *View:* Self-reports do not describe states; they express commitments or create the state.
  *   *Score:* **Mixed.**
  *   *Reason:* Excellent on Authority (Req #2) and Transparency (Req #4).
  *   *Weakness:* Threatens the "Error" condition (Req #3). If avowing a motive makes it true, the narrator isn't wrong. You must modify this: She is avowing a motive that *was not operative at the time of action*, even if it becomes true at the time of writing.

  **Recommendation:** For your novel, adopt a **Self-Interpretation** framework with a **Social Authority** overlay. Your narrator interprets her past behavior to build a coherent self. She is sincere, but she is interpreting, not perceiving. This allows her to be wrong about the causes while retaining the authority of the voice.
