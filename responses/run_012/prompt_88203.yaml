answer: |-
  This is one of the most profound and difficult tensions in the ethics of war, and it is entirely understandable that it has moved from abstract seminar discussion to a source of personal friction. You are standing at the intersection of two distinct disciplines: the **Law of Armed Conflict (LOAC/IHL)**, which is pragmatic and regulatory, and **Just War Theory (JWT)**, which is philosophical and evaluative.

  Your brother and the revisionist philosophers are indeed often talking past each other, but not entirely. There is a verbal equivocation on the word "Moral," but there is also a genuine, substantive disagreement about the relationship between law and morality.

  To resolve this for your paper and, perhaps, for your relationship with your brother, we need to disaggregate the "Moral Equality of Combatants" (MEC) into the three distinct claims you identified: **Permission**, **Liability**, and **Blame**.

  ### 1. What the Doctrine Actually Asserts

  The traditional doctrine of MEC (championed by Michael Walzer and encoded in the Geneva Conventions) asserts a **symmetry** between combatants on opposing sides. However, it asserts this symmetry differently across your three categories.

  **A. Permission (The Right to Kill)**
  *   **Traditional View:** MEC asserts that combatants on both sides possess an equal *legal* and *moral* permission to use lethal force against enemy combatants. This is the concept of **Combatant Privilege**. A soldier is not a murderer for killing an enemy soldier, provided he follows the rules of engagement and IHL.
  *   **Revisionist View:** MEC is false here. Permission to kill is derived from the justice of the cause (*jus ad bellum*). A soldier fighting in self-defense has a right to kill; a soldier fighting an aggressive war does not, because he is threatening people who have done nothing to forfeit their right to life.
  *   **The Equivocation:** Your brother is speaking of *institutional* permission (the state and the law license this act). The revisionists are speaking of *natural* permission (does the act violate the victim's rights?).

  **B. Liability (The Status of Being a Target)**
  *   **Traditional View:** MEC asserts that combatants on both sides are equally **liable** to be attacked. By putting on the uniform and carrying arms, you become a legitimate target, regardless of whether your war is just.
  *   **Revisionist View:** This is partially accepted but nuanced. Unjust combatants are certainly liable. Just combatants are *not* morally liable (they are doing nothing wrong), but they may be *permissibly* killed by unjust combatants due to epistemic limitations (the enemy soldier doesn't know the war is unjust) or necessity.
  *   **The Disagreement:** The traditionalist says the uniform makes you liable. The revisionist says your *actions* (posing a threat for an unjust cause) make you liable.

  **C. Blame (Culpability)**
  *   **Traditional View:** MEC asserts that soldiers are not **culpable** for the war itself. They are "tools" of the state. As long as they do not commit war crimes (*jus in bello* violations), they bear no moral guilt for participating.
  *   **Revisionist View:** Soldiers bear some moral responsibility for the war they fight. While a conscript might be excused due to duress or ignorance, a volunteer soldier in an aggressive war shares in the moral guilt of that aggression.
  *   **The Disagreement:** This is the sharpest point of contention. Your brother sees the separation of *ad bellum* (political) and *in bello* (tactical) as a moral shield. Revisionists see it as a moral blindfold.

  ### 2. The Genuine Disagreement: Separation vs. Integration

  Once you clear up the equivocation, the remaining disagreement is not verbal; it is structural. It is about the **Separation Thesis**.

  **Your Brother's Position (The Traditionalist/LOAC View):**
  He is arguing for the **Separation of *Jus Ad Bellum* and *Jus In Bello***.
  *   **The Claim:** The rules of fighting must be independent of the reasons for fighting.
  *   **The Justification:** This is not "civilian hand-wringing"; it is a doctrine of **prudence and humanitarianism**. If soldiers believed they could only kill if their cause was just, three things would happen:
      1.  Soldiers would spend their time debating geopolitics rather than following rules of engagement.
      2.  Each side would claim absolute moral superiority, leading to the dehumanization of the enemy and total war (no quarter given).
      3.  Prosecution of war crimes would become impossible, as every soldier would claim "my cause was just, so my killing was justified."
  *   **For your brother:** MEC is a functional necessity. It allows him to look the enemy in the eye as a professional peer rather than a criminal, which paradoxically makes it easier to treat prisoners humanely and limit violence.

  **The Revisionist Position (The Moral Philosopher's View):**
  They argue for the **Integration of *Jus Ad Bellum* and *Jus In Bello***.
  *   **The Claim:** You cannot separate the act of killing from the reason for killing. Killing is only permissible in war for the same reasons it is permissible in domestic life: self-defense or defense of others.
  *   **The Justification:** To say an aggressor soldier has the same moral standing as a defender is to insult the victim. It implies that the right to life is forfeited simply by wearing a uniform, even if that uniform represents a criminal enterprise.
  *   **For you:** This aligns with your legal intuition that one cannot claim legal privilege for an illegal act (aggression).

  ### 3. Does Permission Imply "No Wrong"?

  You asked: *If the doctrine is true in the permission sense, whether anything at all follows about whether the soldier on the unjust side is doing something morally wrong.*

  **The Answer:** No, nothing follows. This is the crux of your seminar paper.

  The Traditional Doctrine grants a **Legal Justification** (or Privilege), not necessarily a **Moral Justification**.
  *   **Legal:** The law *treats* the soldier as if he is not doing wrong to ensure the war remains regulated.
  *   **Moral:** The soldier *might* still be doing something morally wrong (participating in aggression), but the law **excuses** him or grants him **immunity** from prosecution for pragmatic reasons.

  Your brother insists "nothing follows" because he is operating within the **Legal/Institutional** framework. Within the law of war, if you follow the rules, you have committed no wrong.
  The revisionists insist "something follows" because they are operating within the **Deep Moral** framework. Within ethics, if you are threatening innocent life without justification, you are doing wrong, regardless of what the Geneva Conventions say.

  ### 4. Advice for the Future Legal Officer

  As you apply for a direct commission as a legal officer, you must navigate this distinction carefully.

  1.  **In the Courtroom and the Field:** You must adopt your brother's view. As a Judge Advocate, you advise commanders on LOAC. LOAC *presumes* the Moral Equality of Combatants. You cannot advise a commander that "the enemy is fighting unjustly, therefore they are criminals and we need not afford them prisoner of war status." That is a war crime. The law requires you to treat the moral equality as a fact.
  2.  **In the Seminar Room:** You can adopt the revisionist view. It is intellectually robust and highlights the tragedy of war. It acknowledges that while the law *must* treat soldiers equally to function, morality *cannot* truly view an aggressor and a defender as equals.
  3.  **With Your Brother:** You can tell him this: "I understand now that you are defending the **rule of law** in war. If soldiers are judged on the justice of their cause, the laws of war collapse. I am questioning the **moral metaphysics** of war. We are not disagreeing on the rules; we are disagreeing on what the rules imply about the soul."

  ### Summary for Your Paper

  *   **What MEC Asserts:** It asserts a **legal symmetry** of privilege and liability to ensure the containment of violence. It asserts that *jus in bello* obligations apply equally regardless of *jus ad bellum* status.
  *   **What MEC Does Not Assert:** It does not assert that the causes are equally just. It does not assert that the moral weight of killing is identical in the eyes of God or conscience. It does not absolve leaders of aggression.
  *   **The Equivocation:** The word "Moral" in "Moral Equality of Combatants" is a misnomer. It is a **Legal Equality with Moral Consequences**.
  *   **The Genuine Disagreement:** Lies in whether the law should mirror deep morality (Revisionists) or whether the law should create a functional moral fiction to prevent greater atrocities (Traditionalists).

  Your brother is right that for the soldier in the trench, the doctrine must be true for the war to remain human. The revisionists are right that for the philosopher (and the lawyer analyzing the root causes), the doctrine is a fiction. Both can be held simultaneously without contradiction, provided you distinguish between **regulated conduct** and **moral truth**.
