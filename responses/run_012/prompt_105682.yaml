answer: |-
  Here is the plan. It is designed to move the group from "This is a weird sentence" to "This is a structural crisis in our semantics" without getting bogged down in the history of solutions.

  ### 1. The Sequence: Setting the Trap
  Do not start with the Liar sentence. If you start with the sentence, they will treat it as a linguistic oddity (like a garden-path sentence). You need them to treat it as a *proof of inconsistency* within a system they themselves endorsed.

  **Order of Operations:**
  1.  **The T-Schema (The Contract):** Write $T(\ulcorner \phi \urcorner) \leftrightarrow \phi$ on the board. Ask for a show of hands: "Who accepts this as a basic constraint on any adequate theory of truth?" (Everyone will raise their hand. They have now signed the contract.)
  2.  **Classical Logic (The Engine):** Briefly stipulate that you are working in classical logic (Bivalence: $\phi \lor \neg \phi$; Non-Contradiction: $\neg(\phi \land \neg \phi)$). Ask if anyone wants to drop these *before* seeing the problem. (They won't. This locks the cage.)
  3.  **The Truth-Teller (The Control):** Introduce your "This sentence is true" example. Show that it satisfies the T-Schema and Classical Logic without explosion (it's just underdetermined). **Point:** Self-reference is not the bug.
  4.  **The Liar (The Explosion):** Introduce "This sentence is false." Derive the contradiction using *only* the T-Schema and Classical Logic they just endorsed. **Point:** The bug is the interaction of Truth + Logic + Reference.
  5.  **The Gap Proposal (Dana's Move):** Propose a 3rd value (Gap/Indeterminate). Show how the Liar falls into the gap. Contradiction avoided.
  6.  **The Strengthened Liar (The Revenge):** Introduce "This sentence is not true." Show that if it's in the gap, it is "not true," which makes it true. **Point:** The Gap solution requires a predicate ("is not true") that cannot be expressed in the object language without contradiction.

  **Why this order:** By the time you introduce the Liar in step 4, they are not arguing about the sentence; they are arguing about the premises they agreed to in steps 1 and 2. The paradox becomes a *reductio* of the naive theory of truth, not a riddle about sentences.

  ### 2. The Example: The Liar Family
  Stick with your matched pair ("This sentence is true" vs. "This sentence is false"), but with a specific modification for the climax.

  **The Choice:** Use the pair for the first half, but **morph** the Liar sentence for the second half.
  *   **Act 1:** $L_1$: "This sentence is false." (To break Bivalence).
  *   **Act 2:** $L_2$: "This sentence is not true." (To break Gaps).

  **Why:** Your intuition is correct that the Truth-Teller is necessary to disarm the "self-reference is illegal" objection. However, if you stick strictly to "false" for the Liar, Dana's gap solution looks too clean. You must explicitly switch the predicate from "false" to "not true" to demonstrate Revenge.
  *   **Requirement:** The example must be formalized early. Write $\lambda = \neg T(\ulcorner \lambda \urcorner)$. If you stay in natural language, linguists will argue about presupposition and CS folks will argue about syntax. Anchor it in the notation $T(\ulcorner \phi \urcorner)$ so the shift from $\neg T$ (false) to $\neg T$ (not true) is visible as a semantic shift, not just a wording change.

  ### 3. Misconceptions to Head Off
  There are three specific derailments you need to preempt.

  *   **"Self-reference is the bug."**
      *   *Where:* Immediately after the Truth-Teller example.
      *   *Fix:* Explicitly state: "If self-reference were the problem, the Truth-Teller would also explode. It doesn't. Therefore, self-reference is a necessary condition, not a sufficient one."
  *   **"So logic is broken (Paraconsistency)."**
      *   *Where:* After the initial Liar derivation.
      *   *Fix:* Remind them that we use classical logic to build computers and prove theorems successfully every day. Abandoning Classical Logic is a massive cost. Frame the problem as: "Which is more expendable: The T-Schema, Classical Logic, or Expressive Completeness?" Don't let them default to "Logic is wrong" without weighing the cost.
  *   **"Gaps solve it." (Dana's Position)**
      *   *Where:* Before they get too comfortable with the 3-value solution.
      *   *Fix:* This is where the Strengthened Liar ($L_2$) does the work. Head this off by saying: "A solution is only a solution if it can describe its own success. If the gap theory cannot express the concept 'is in a gap' without contradiction, it is not a complete theory of truth."

  ### 4. The Diagnostic Question
  Do not ask "Did you understand?" or "What do you think?" Ask them to perform the Revenge move themselves.

  **The Question:**
  > "If you adopt a gap theory to solve the Liar, you must claim the Liar sentence has a status other than True or False. Let's call that status 'Gap'. Now: Is the sentence *'The Liar sentence has the status Gap'* itself True, False, or Gap?"

  **Why this works:**
  *   If they say **True**: You ask, "Then isn't 'The Liar sentence is not True' also true? And if so, haven't we recreated the Strengthened Liar?"
  *   If they say **Gap**: You ask, "Then the theory cannot correctly describe its own central claim. The theory is expressively incomplete."
  *   If they say **False**: You ask, "Then the Liar isn't in a gap. Contradiction."

  This question reveals whether they see Revenge as a structural problem (the language can't describe its own semantics) or just another puzzle sentence.

  ### 5. Scope Limits: What to Refuse
  You are not running a survey course on truth theories. You are running a diagnosis session.

  *   **Refuse:** To evaluate Kripke's fixed points, Tarski's hierarchy, or Paraconsistent logic in detail.
  *   **The Script:** "There are sophisticated formal ways to handle this (Kripke, Tarski, etc.), and we can read those next week. But today, I want to isolate *why* we need those heavy machines. If we don't feel the pressure of the Revenge paradox, the solutions look like magic tricks rather than necessary repairs. We are stopping at the diagnosis."
  *   **Why:** If you open the floor to solutions, the CS students will try to code a fix and the linguists will argue about context. Keep them focused on the *inconsistency of the naive constraints*.

  ### 6. Contested Readings (Flag These)
  You need to protect yourself from looking dogmatic, especially since Dana's position is a legitimate school of thought.

  *   **Flag 1: The Status of Revenge.**
      *   *Say:* "I am presenting Revenge as a fatal objection to gap theories. This is my position, and it is common, but it is not settled. Some theorists argue Revenge sentences are contextually shifted or ineffable. I am teaching the 'Revenge is fatal' narrative because it best illustrates the tension between expressive power and consistency."
  *   **Flag 2: The Viability of Gaps.**
      *   *Say:* "Dana's position—that gaps solve the problem—is a standard and robust view (e.g., Strong Kleene). It handles the *standard* Liar perfectly. We are only moving past it to show that it struggles with *semantic closure* (the ability of the language to describe its own truth conditions)."
  *   **Flag 3: The T-Schema.**
      *   *Say:* "We are treating the T-Schema as intuitive. Some theories restrict it. We are assuming it holds to see what breaks."

  **Summary of Defense:**
  This plan works because it forces the students to endorse the premises that lead to the contradiction. They become complicit in the paradox. By using the Truth-Teller as a control, you eliminate the easiest escape route (self-reference). By ending on the diagnostic question about the "Gap" predicate, you force them to confront the expressive cost of Dana's solution without you having to personally attack her argument. You aren't arguing with Dana anymore; you're using her argument as a stepping stone to the deeper problem.
