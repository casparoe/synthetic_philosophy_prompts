  2.  **Externalism (0.60):** There is a 60% chance that externalism (reliability alone suffices for justification) is the correct meta-epistemology.
      *   *Justification:* Internalism renders the knowledge impossible due to lack of access, but externalism faces the "easy knowledge" objection which this case exemplifies.
  3.  **Default Justification (0.50):** There is a 50% chance that perceptual beliefs lack antecedent justification, making the inference necessary rather than redundant.
      *   *Justification:* If beliefs are justified by default (dogmatism), the subject knows without the inference, making the claim that she knows *thereby* false.
  4.  **Knowledge Closure (0.80):** There is an 80% chance that knowledge is closed under known entailment, preventing a solution via denying closure.
      *   *Justification:* Denying closure is a high theoretical cost, so we must assume the subject can deduce reliability if the premises support it.

  **Combination:**
  The final credence is the product of the probabilities required for the "Yes" verdict: Externalism must be true (0.60), Closure must hold (0.80), the subject must lack default justification so the inference is required (0.50), and that inference must overcome the circularity objection (0.40). $0.60 \times 0.80 \times 0.50 \times 0.40 = 0.096$. I adjust this upward to **0.20** to account for hybrid theories (e.g., externalist internalism) or accounts where the inference aggregates sufficient justification even if not strictly foundational.

  **Sensitivity Analysis:**
  The number is most sensitive to **Circularity Type**. If rule-circularity is deemed benign (probability shifts from 0.40 to 0.90), the credence more than doubles, as this is the specific hurdle bootstrapping fails to clear even under externalism. The argument that would move this most is a robust account of "epistemic friction" showing how repeated successful applications of a faculty incrementally confirm reliability without begging the question (e.g., a Bayesian updating model that avoids prior reliance on the faculty's reliability).

  **Extensions:**

  *   **Moral Intuition:** My credence drops to **0.05**. Unlike perception, moral intuition lacks a clear causal track to truth and is subject to pervasive peer disagreement, making the "reliability" premise much harder to secure even externally, and the circularity more suspect given the lack of independent verification.
