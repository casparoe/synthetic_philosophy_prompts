  | **Cost-Effectiveness** (Picking charities by health benefit/$) | **Mixed** (Rational method, immoral end) | **Rationality:** Using reason to maximize outcomes is good; but maximizing *others'* welfare at the expense of your own hierarchy of values is altruistic sacrifice. | Medium | If the giver views the donation as a personal value (e.g., "I value a disease-free world for my own sake") rather than a duty to strangers. |
  | **Drowning Child** (Duty to save at cost of luxury) | **Con** (Immoral) | **Self-Ownership:** You are an end in yourself, not a resource for others; saving a life is noble only if voluntary and not at the cost of your own survival/happiness. | High | If the argument is reframed from "duty" to "voluntary benevolence based on a shared love of human life," she might endorse the action but reject the obligation. |
  | **Longtermism** (Far future as top moral priority) | **Con** (Mystical) | **Metaphysics:** Ethics is for living on *this* earth; prioritizing abstract, non-existent future beings over concrete, living humans is a form of other-worldliness. | High | If the focus is on preventing immediate existential threats (e.g., nuclear war) that would destroy the *conditions* for rational life, she would support the action for self-preservation reasons. |
