answer: |-
  The classmate's dismissal is licensed only if the one-liner is interpreted as a radical anti-intellectualist thesis about the constitution of knowledge rather than a trivial claim about physical acquisition, a distinction that determines whether the system lacks ability or lacks knowledge itself.

  **Menu of Claims Implicit in "You Can't Learn to Ride a Bicycle from a Book"**

  1.  **The Causal Necessity of Practice (Acquisition):** Physical repetition is causally required to develop the neuromuscular coordination necessary for bicycle riding.
      *   **Status:** Platitude.
      *   **Implication:** A system without a body cannot ride, but this does not prove it lacks the *knowledge* of how to ride, only the capacity to perform.
      *   **Philosophical Fit:** Compatible with all positions (Stanley & Williamson, Ryle, Polanyi).
      *   **Verdict on Classmate:** Does not license the dismissal of the system's *knowledge*; only licenses denying its *performance*.

  2.  **The Insufficiency of Explicit Instructions for Performance (Acquisition/Performance):** Possessing all propositional instructions is insufficient to guarantee successful performance without practical calibration.
      *   **Status:** Substantive and defensible thesis.
      *   **Implication:** You might know the steps but fail to execute them due to lack of feel or timing.
      *   **Philosophical Fit:** Compatible with Intellectualism (S&W) if one distinguishes possessing knowledge from exercising it successfully.
      *   **Verdict on Classmate:** Leaves the question open; the system might know how but be unable to manifest it without a body or practice.

  3.  **The Insufficiency of Propositions for the Skill State (Constitution - Modest):** Possessing all relevant true propositions is not sufficient for possessing the state of *knowing-how*, even if performance is set aside.
      *   **Status:** Substantive and contested thesis.
      *   **Implication:** There is a gap between knowing facts about an activity and knowing the activity itself.
      *   **Philosophical Fit:** Accepted by Ryle and Polanyi; rejected by Stanley & Williamson (who argue knowing-how *is* a species of knowing-that under a practical mode of presentation).
      *   **Verdict on Classmate:** Licenses the dismissal only if one rejects Intellectualism.

  4.  **The Distinctness of Know-How and Know-That (Constitution - Radical):** Knowing-how is not a species of knowing-that at all; they are fundamentally different mental kinds.
      *   **Status:** Substantive thesis (Rylean Anti-Intellectualism).
      *   **Implication:** No amount of reading (accumulating knowing-that) can ever constitute knowing-how.
      *   **Philosophical Fit:** Argued for by Ryle; explicitly rejected by Stanley & Williamson.
      *   **Verdict on Classmate:** Fully licenses the dismissal; if true, the manual-reading system categorically cannot know how to rebuild an engine.

  5.  **The Ineffability of Skill Content (Tacit Knowledge):** Essential components of skill are tacit and cannot be fully articulated in text (manuals are inherently incomplete).
      *   **Status:** Substantive thesis (Polanyian).
      *   **Implication:** Since the system only accessed explicit text, it necessarily missed the tacit core of the skill.
      *   **Philosophical Fit:** Associated with Polanyi; incompatible with strong Intellectualism which holds all knowledge is propositional.
      *   **Verdict on Classmate:** Licenses the dismissal based on the medium's limitation rather than the mind's structure.

  **Distinctions and Consequences**

  Separating **acquisition** from **constitution** is critical because Intellectualists (Stanley & Williamson) can concede the one-liner is true regarding acquisition (you need practice to *get* the knowledge or embody it) while denying it proves anything about constitution (once acquired, the state is propositional). If the claim is merely about acquisition, the system might possess the knowledge state via its data ingestion but lack the causal history usually required for humans, or simply lack the body to verify it. If the claim is about constitution, the system is metaphysically incapable of holding the state.

  Distinguishing the **modest thesis** (propositions insufficient for performance) from the **strong thesis** (knowing-how is not knowing-that) determines what turns on the difference: under the modest thesis, the system might know how to rebuild the engine but fail to do so reliably; under the strong thesis, the system does not know how at all, regardless of its success rate. The classmate treats the matter as settled, implying they assume the strong thesis is obvious, when it is actually the primary point of contention in contemporary epistemology.

  **Philosophical Positions and the Dismissal**

  *   **Stanley & Williamson (Intellectualism):** They would reject Claims 3, 4, and 5. They would argue that if the system grasps the propositions in the manuals under a "practical mode of presentation," it knows how. They would reject the classmate's dismissal, arguing the system possesses the knowledge even if it lacks the body to execute it (Claim 1).
  *   **Ryle (Anti-Intellectualism):** He would accept Claims 3 and 4. He would argue that intelligence is displayed in performance, not in the recitation of rules. He would license the classmate's dismissal, arguing that a system regurgitating manual data is merely simulating intelligence, not exercising skill.
  *   **Polanyi (Tacit Knowledge):** He would accept Claim 5. He would argue that since manuals cannot capture the tacit coefficients of skill (the "feel" of the engine), the system is necessarily ignorant of the actual craft. He would license the classmate's dismissal based on the incompleteness of explicit codification.

  **Conclusion on the Classmate's Move**

  The classmate's dismissal is only valid if one adopts the Rylean or Polanyian reading (Claims 3, 4, or 5), which treats the one-liner as a metaphysical truth about the nature of skill. If one adopts the Intellectualist reading, the one-liner is at best a claim about physical acquisition (Claim 1), which fails to prove the system lacks knowledge, leaving the question of the system's expertise open. By treating the matter as settled, the classmate presupposed Anti-Intellectualism without argument.
