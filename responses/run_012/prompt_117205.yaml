  **Pastoral Corner**
  *Reflections and Replies from the Vicarage*

  **Q:** *Can you tell me plainly: did the Resurrection happen or not? I need to know if it is a fact.* — **Mr. Henderson**

  **A:** If you mean, is it a fact like the date of the harvest festival, then no. It is not a hypothesis to be verified by evidence. To treat it as a historical claim is to misunderstand the grammar of our faith. It is a picture that regulates our living. If you live as though Christ is alive, the question of 'happening' loses its usual force. It is not about what happened then, but what happens now.

  **Q:** *My son has stopped believing. He says there is no proof. What argument should I use to bring him back?* — **Mrs. G.**

  **A:** Do not offer him proofs. Religious belief is not a conclusion drawn from evidence, so evidence cannot undo it. You cannot argue someone into a form of life. Instead, show him the peace that the belief affords you. Let him see the difference it makes in how you bear sorrow. He must see the use of the words before he can understand them.

  **Q:** *Do I have to believe every word of the Creed to be married in the church?* — **Anonymous**

  **A:** To say the Creed is not to assert a theory about the world. It is to pledge allegiance to a community and its way of seeing. If you are willing to stand before us and let those words shape your marriage, then you are participating in the practice. The belief is in the doing. If you wait for internal assent before speaking, you have already stepped outside the room.

  **Q:** *Mrs. P says the vestry was built in 1890. Mr. T says 1892. They have stopped speaking. Please adjudicate.* — **Churchwarden**

  **A:** It is unfortunate that a date has become a idol. Whether it is 1890 or 1892 matters only if it changes how you care for the building. If the date does not alter your duty to the church, the dispute is merely verbal. Please reconcile. The stone remains the same regardless of the number carved upon it.

  **Q:** *Following recent visitations, I require a written statement of what your parish actually teaches regarding the truth claims of Christianity. Please submit by Friday.* — **The Lord Bishop**

  **A:** My Lord, I have struggled with this. To write down what we teach as a set of propositions is to suggest that our faith rests on those propositions being factually correct. It turns a passion into a calculation. If I write that 'God exists' as a fact, I imply it could be disproven. But I understand you require a record. We teach that there is a way of living that is true, regardless of the weather. Does this satisfy? I fear it does not. I will send something, but know that in fixing the teaching, I may lose the life of it. I am trying to say what cannot be said without nonsense. I remain, etc.
