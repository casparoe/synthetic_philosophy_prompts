      *   **Form:** Sonnet (14 lines, strict rhyme scheme, iambic pentameter preferred).
      *   **Voice:** Someone in pain trying to write about it.
      *   **Key Constraint/Feature:** The form must embody the philosophy. The rhyme scheme should feel forcing. The speaker should notice mid-poem that the rhyme was already waiting for them (the sense of choice arrives after the choice is made).
      *   **Volta:** The realization that if this view is right, the poem (which captures the feeling) was written by something that never felt it.
      *   **Audience:** Philosophy club (needs accuracy) + General audience (needs to work as a poem).

