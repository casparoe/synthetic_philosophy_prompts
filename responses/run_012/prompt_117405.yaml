answer: |-
  The practice of publishing cryptographic security levels—compressing RSA moduli, elliptic curve orders, and symmetric key lengths into a single "bits of security" metric—is a feat of engineering normalization that rests on a fragile stack of metaphysical and physical assumptions. To reconstruct what this practice presupposes, we must distinguish between the *mathematical formalism* used to derive the numbers and the *ontological commitments* required to treat those numbers as actionable truth.

  ### 1. The Ontology of the Security Level

  The "bit" in "128-bit security" is not a measure of information entropy in the Shannon sense, but a measure of *computational work*. It asserts that breaking the primitive requires $2^{128}$ elementary operations. For this to function as a universal standard, the practice presupposes:

  1.  **A Universal Cost Model:** There exists a canonical way to count "operations" such that an operation in a finite field (ECC) is commensurable with an operation in integer arithmetic (RSA) and a substitution-permutation network (AES).
  2.  **Stable Hardness:** The difficulty of the underlying mathematical problem is stable enough over the relevant timeframe (e.g., 10–30 years) that a static table is not immediately obsolete.
  3.  **Physical Realizability:** There is a mapping from abstract operations to physical resources (time, energy, area) that holds across different implementations.

  ### 2. Strict Requirements vs. Philosophical Comforts

  We must separate what is logically necessary for the tables to function from what merely makes the practitioners feel comfortable.

  **Strictly Required:**
  *   **Commensurability of Difficulty:** The practice *requires* that difficulty is a scalar quantity that can be compared across disjoint mathematical domains. If factoring hardness and discrete logarithm hardness are incommensurable (like comparing length to weight), the table is category error.
  *   **Average-Case Hardness:** The practice *requires* that the specific instances generated by the protocol (random keys) are as hard as the hardest instances. If "easy" instances exist with non-negligible probability, the security level is inflated.
  *   **Bounded Adversarial Physics:** The practice *requires* a bound on the physical computational power available to an adversary. To claim 128 bits is secure for 20 years, one must assume the adversary cannot build a computer that violates known thermodynamic or quantum limits within that window.
  *   **Public Knowledge Baseline:** The practice *requires* that the "best known attack" is public knowledge. If a classified algorithm exists that reduces the cost by a factor of $2^{40}$, the table is objectively false for the entity holding that algorithm.

  **Merely Fits Well (Underdetermined):**
  *   **Realism about Complexity Classes:** The tables do *not* require that $P \neq NP$ is true, nor that complexity classes are real Platonic objects. They only require that *currently*, no efficient algorithm exists. The practice is compatible with the eventual collapse of these classes, provided the collapse happens at input sizes larger than those used in practice.
  *   **The Polynomial-Time Boundary:** The tables do *not* rely on asymptotic complexity ($O$-notation). They rely on *concrete* security estimates. Whether polynomial time is the "right" boundary for tractability is irrelevant; the tables care about whether $2^{128}$ gate cycles are affordable *now*.
  *   **Intrinsic Hardness:** The practice does not strictly require hardness to be an intrinsic property of the problem. It works equally well if hardness is purely epistemic (a property of our current ignorance), provided that ignorance is shared and stable.

  ### 3. Evaluation of Rival Views of Complexity

  Here we assess which philosophical stances are ruled out by the existence and use of these tables, and which remain compatible.

  **Ruled Out (or Severely Tensioned):**
  *   **Radical Reasoner-Relativity:** If complexity is relative to the specific reasoner (e.g., "Hard for Alice, easy for Bob" based on cognitive or architectural idiosyncrasies unrelated to resource class), a public standard is impossible. The tables assume a *standard adversary* model. If security is fundamentally agent-relative, the table is a lie.
  *   **Radical Machine-Relativity (without class specification):** If hardness is entirely dependent on the specific micro-architecture of the attacking machine (e.g., RSA is hard on Intel but trivial on some exotic neuromorphic chip that *could* exist), the table fails. The tables assume a "generic" von Neumann or quantum circuit model. They rule out the view that there is *no* stable relationship between algorithm and physical cost.

  **Compatible:**
  *   **Instrumentalism about Complexity Classes:** This view fits perfectly. The tables treat complexity classes as useful fictions for organizing algorithms, not as truths about the universe. The "security level" is an instrument for risk management, not a theorem.
  *   **Epistemic View (Complexity as Knowledge):** This is arguably the most accurate description of the practice. A "128-bit security level" really means "We do not know an algorithm better than $2^{128}$." The tables are updated when knowledge changes (e.g., when Shor's algorithm was published, RSA security levels collapsed relative to quantum adversaries).
  *   **Conventionalism about the Polynomial-Time Line:** Since the tables use concrete bit-lengths rather than asymptotic classes, they are agnostic about where the "efficient" line is drawn. They only care about the specific cost at the specific parameter size.

  **Underdetermined:**
  *   **Realism about Hardness:** The practice is underdetermined here. It works *as if* hardness is real (methodological realism), but it does not prove it. Practitioners can be realists or anti-realists about the mathematical difficulty, provided they agree on the cost estimates.
  *   **Physics of Computation:** The tables assume a physics of computation (energy per bit flip, speed of light limits), but they do not specify *which* physics. They are compatible with classical physics, but the advent of quantum computing showed they were not compatible with *all* possible physics. The practice assumes the adversary is bound by the *same* physics as the defender, which is a contingent claim.

  ### 4. Consequences of a Concrete, Machine-Relative Shift

  If the presupposed picture were replaced by a **concrete, machine-relative view**—where hardness is not a property of the problem but a function $H(problem, machine\_class, state\_of\_knowledge)$—the practice of cryptographic standardization would undergo a radical transformation.

  **Changes in Construction:**
  *   **Vectorization of Security Levels:** The single number (e.g., "128-bit") would be abandoned. It would be replaced by a vector or a surface: "128-bit against CPU, 80-bit against FPGA, 0-bit against Fault-Tolerant Quantum."
  *   **Hardware-Specific Parameters:** Standards would no longer recommend "RSA-3072." They would recommend "RSA-3072 for General Purpose Compute, RSA-4096 for Cloud-Adversary Environments." Parameter selection would become context-dependent rather than universal.
  *   **Dynamic Tables:** Instead of static publications (e.g., NIST SP 800-57), tables would become continuous feeds, updated as new hardware architectures (ASICs, TPUs, Quantum Annealers) shift the cost function for specific primitives.

  **Changes in Defense:**
  *   **Justification by Benchmarking:** Arguments for security would shift from "reduction to hard problem" to "benchmarking on representative hardware." Security proofs would need to include cost models of specific circuit implementations, not just gate counts.
  *   **Obfuscation of Capability:** If security is machine-relative, defenders might try to hide their own hardware capabilities to maintain an asymmetry. The current culture of open standards assumes transparency; a machine-relative view might incentivize secrecy about defensive computational power.

  **What Must Be Abandoned:**
  *   **The Myth of Interoperability via Equivalence:** The core promise of the current tables—that an ECC key and an RSA key provide "the same security"—would be abandoned. Interoperability would require negotiating not just algorithms, but *security contexts*.
  *   **Long-Term Security Claims:** You could no longer claim a system is "secure for 30 years." You could only claim it is secure against *currently known* machine classes. The concept of "archival security" would vanish, replaced by "agile migration protocols."
  *   **The Abstraction Layer:** Cryptography currently relies on an abstraction layer where the algorithm is separate from the implementation. A machine-relative view collapses this layer. You cannot teach "RSA" without teaching "RSA on a Quantum Computer" vs "RSA on a GPU."

  **What Remains (Rejustified):**
  *   **Risk Management:** The goal remains managing risk, but the metric changes from "bits" to "cost-to-break in dollars/joules."
  *   **Reductionism:** Mathematical reductions (e.g., "breaking this is as hard as finding short vectors") remain useful, but only as lower bounds within a specific machine model, not as absolute guarantees.

  ### Conclusion

  The publication of cryptographic security tables is an act of **ontological compression**. It compresses a multi-dimensional space of mathematical problems, physical hardware, and epistemic states into a single scalar. It does not strictly require realism about complexity classes, but it *does* require a stable physics of computation and a shared epistemic baseline.

  It rules out views where complexity is radically agent-relative or where no stable mapping exists between algorithms and physical cost. It is highly compatible with instrumentalism and epistemic views. If forced to adopt a concrete, machine-relative ontology, the practice would lose its universality. The "security level" would cease to be a property of the key and become a property of the *relationship* between the key, the attacker's hardware, and the current state of mathematical knowledge. The table would not be rewritten; it would be shattered into a thousand context-specific fragments, and the dream of a universal, timeless cryptographic standard would be abandoned for a regime of continuous, hardware-aware adaptation.
