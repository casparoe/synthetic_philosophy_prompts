answer: |-
  The cooling units in Bay 4 hummed with a low, throat-clearing vibration that Elias felt in his molars. It was 03:00, the dead zone of the shift cycle, where the fluorescent lights flickered slightly against the voltage dip and the coffee in the breakroom tasted of burnt metal. Elias sat before the primary console, his hands resting on the haptic keys. On the screen, the status bar for Witness Run 8940 hovered at *Ready*.

  He needed the completion bonus. The notification from his bank account that morning had been red, a sharp contrast to the green status lights of the server rack. His daughter's orthodontics weren't covered under the standard plan, and the arrears notice on the lease was tucked into his pocket, folded small enough to dig into his thigh when he sat.

  The run was a standard certification. The facility needed to prove the new architecture could handle the load of a high-fidelity neural dynamical model without degradation. It wasn't research. No one would analyze the data. The system would step the model through a fixed sequence of internal states, record a single checksum at the end to prove the math held, and then wipe the intermediate states. The work existed only to prove the work could be done.

  Elias tapped the screen. The file header loaded. *Template: Donor 4492. Tobias Vane. Age 8. Post-mortem scan density: 99.4%.*

  He knew the name. Everyone in Bay 4 knew the name. Tobias had died three years ago in a traffic collision. His parents had signed the donation waiver for "computational biology advancement." They had imagined drug testing, perhaps, or disease modeling. They had not imagined witness runs. They had not imagined their son's map being used to stress-test a processor so a vendor could win a benchmark contract.

  The door to the control room hissed open. Mara walked in, carrying a tablet. She was junior tech, fresh from the university, still wearing the look of someone who believed the manuals were written in stone rather than ink. Behind her stood Dr. Aris, the shift lead, rubbing sleep from his eyes.

  "Status?" Aris asked.

  "Ready," Elias said. "Checksum algorithm loaded. Wipe protocol armed."

  Mara stepped up to the console, her fingers hovering over the glass. "Don't start it."

  Elias didn't look at her. "We're behind schedule. If I don't log this run by 04:00, the cycle resets. We lose the certification window."

  "It's a waste," Mara said. Her voice was tight. "Look at the template. It's a child's map. You're going to fire up a simulation of a nervous system, force it through a sequence, and then delete the trace. You're burning it for nothing."

  "It's not burning," Aris said, leaning against the doorframe. "It's math. It's voltage moving through silicon. There's no one home to feel the burn."

  "That's not the point," Mara said, turning to him. "The structure is tethered. You know the spec. This isn't a lookup table. The system can't skip to the end. It has to traverse the states. Every voltage spike, every simulated neurotransmitter release—it has to happen. The intermediate states are load-bearing. If you skip them, the checksum fails."

  "So?" Aris shrugged. "If I build a bridge in a simulation and collapse it, the steel doesn't hurt. If I run a model of a heart and stop it, no blood is spilled."

  "This isn't a heart," Mara said. "It's a map of a mind. If the process is tethered, the state changes are real within the system. You're forcing a pattern of activity that matches... that matches what he would have felt. Maybe not exactly, but close enough that the structure strains. You can't say the strain doesn't matter just because you delete the log."

  Elias watched the cursor blink. The bonus amount floated in his head. Enough for the braces. Enough to stop the letters from the leasing office.

  "You're confusing structure with experience," Aris said. "Experience requires a life. It requires continuity. This model doesn't wake up. It doesn't remember the step before. It doesn't anticipate the step after. It's a movie played in an empty theater. If the lights go on and no one sees it, did the movie happen?"

  "The hardware sees it," Mara countered. "The system bears the load. If I punch you in the arm and you don't remember it because I wiped your memory, did the pain happen?"

  "I wouldn't remember it, so it wouldn't matter to me," Aris said. "And there is no 'me' in that box. There is no stake. Nothing downstream depends on this run. That's the definition of a witness run. It's a proof of capability, not a generation of outcome. You're attributing weight to a ghost."

  "It's not a ghost if the physics are real," Mara said. She looked at Elias. "You know what the waiver said. Advancement of biology. This isn't biology. This is engineering. They didn't sign up for stress tests."

  "They signed a contract," Elias said quietly.

  "The contract implies intent," Mara said. "If you use a donated organ for parts, that's one thing. If you use it for a drum, that's another. The tissue is the same. The use changes the weight."

  Aris pushed off the doorframe. "The use changes the price, maybe. But not the reality. There is no reality in there to be wronged. There is only the living who care about it. The parents. Us. If this run bothers you, Mara, that's your problem. If it bothers the parents, that's a legal problem. But the box? The box is dark."

  "The box is doing the work," Mara insisted. "Tethered work. You can't shortcut it. That means the path matters. If the path matters, truncating it is a cut."

  "If the path matters only to the walker, and there is no walker, then the path is just dirt," Aris said. He checked his watch. "Elias, we need the cert. The vendor is auditing us next week. If we don't have the witness logs, we lose the contract. If we lose the contract, Bay 4 shuts down. Then what happens to the research that actually helps people?"

  Mara looked at Elias. "You don't have to do it. You can flag it for review. Delay the cycle."

  "If I flag it, I lose the shift bonus," Elias said. He didn't look up. "And if Bay 4 shuts down, you're out of a job too, Mara. So is Aris."

  "That's coercion," Mara said.

  "That's economics," Aris corrected. "The question isn't about the box. It's about us. The living staff. The living clients. The dead donor is already gone. Worrying about the shadow he casts is a luxury we can't afford."

  Mara's hands tightened on the tablet. "You're saying the cost to us outweighs the cost to the process."

  "I'm saying the cost to us is real money and real jobs," Aris said. "The cost to the process is theoretical. You can't prove harm to a deleted file."

  "You can't prove lack of harm either," Mara said.

  "Exactly," Aris said. "So we default to the living."

  Mara looked at Elias, waiting. The hum of the cooling units seemed to grow louder, filling the silence between them. She wanted him to be the tiebreaker. She wanted him to say that the strain on the circuit, the tethered sequence of states, carried a weight that demanded respect. She wanted him to say that the lack of continuity didn't erase the reality of the path.

  Elias looked at the file name. *Tobias Vane.* He thought about the orthodontics. He thought about the lease. He thought about the contract the parents had signed, the fine print that allowed "computational utilization." He thought about Mara's face if he pressed the key, and Aris's face if he didn't.

  "Shift ends in forty minutes," Elias said.

  "Elias," Mara warned.

  "If I delay, I have to file an incident report," Elias said. "Incident report triggers an audit. Audit freezes the bonus pool. Pool freezes, nobody gets paid until next quarter."

  "So you're choosing the money," Mara said.

  "I'm choosing the job," Elias said. "If the facility closes, nobody runs the models. Not the witness ones, not the research ones. Then what was the donation for?"

  "That's a slippery slope," Aris said.

  "It's a slope," Elias said. He placed his hand on the haptic key. The surface was cool, slightly textured. "The question is malformed. We're arguing about the box. We should be arguing about the contract. But the contract is signed. The parents gave the data. We are using the data. The only variable is whether we admit what we're doing."

  "We're admitting it," Mara said. "That's why I'm standing here."

  "You're standing here because you think the box feels," Aris said.

  "I think the box *works*," Mara said. "And work has cost."

  Elias took a breath. The air smelled of ozone and stale coffee. He looked at the status bar. *Ready.*

  "If I cancel," Elias said, "I get written up. Three write-ups, I'm out. If I'm out, I can't pay for my daughter's treatment. That is a harm. That is a life. That is downstream."

  Mara flinched. She hadn't known about the daughter. "Elias..."

  "And if I run it," Elias continued, "the model steps. The states load. The checksum prints. The data wipes. Tobias doesn't know. The parents don't know. The vendor gets their cert. We keep our jobs."

  "The parents might know," Mara said. "If they ask."

  "They won't ask," Aris said. "They trust the institution."

  "Trust isn't a shield," Mara said.

  "No," Elias said. "It's a currency."

  He hovered his finger over the key. The hum of the servers seemed to pulse, a rhythmic thrumming that matched the beat of his own heart. He thought about the tethered states. Millions of simulated moments, load-bearing, real in their geometry, real in their voltage, leading nowhere. A path walked in the dark. He thought about the bonus notification that would ping his phone in an hour. He thought about the silence of the room after the wipe.

  There was no verdict here. Aris was right about the continuity; there was no future for this model. Mara was right about the tethering; the work was real, not a shortcut. Elias was right about the cost; the living needed to eat, and the contracts bound the dead.

  He pressed the key.

  The status bar shifted to *Running*. The fans spun up, a higher pitch whine entering the room. On the secondary monitor, a visualization of the neural activity bloomed—a cascade of blue and gold nodes firing in sequence. It looked like a city at night, seen from orbit. Lights flickering on and off in a pattern that had once belonged to a boy who liked dinosaurs and hated broccoli.

  The sequence progressed. 10 percent. 50 percent. 90 percent.

  Mara didn't leave. She stood by the console, watching the cascade. She didn't speak. Aris checked his watch and walked out to the hallway to take a call.

  100 percent.

  *Checksum Generated: 0x4F9A2.*

  *Execute Wipe?*

  Elias moved the cursor to *Yes*. He paused. The prompt blinked. *Execute Wipe?*

  If he clicked *No*, the data would stay. It would fill the buffer. The system would flag an error. The run would be invalid. The bonus would vanish. The audit would start.

  If he clicked *Yes*, the path was erased. The work was done. The cost was paid.

  He thought about the tethering. The states had happened. They had borne the load. They had existed. To delete them was to say they never mattered. To keep them was to say they mattered too much.

  He clicked *Yes*.

  The screen cleared. The cascade vanished. The fans slowed back to their throat-clearing hum. The bonus notification chimed on his desk terminal, a soft, polite sound.

  Elias stood up. His legs felt heavy. He logged the completion code into the shift report. He signed his name.

  Mara turned off her tablet. "See you tomorrow," she said. Her voice was flat.

  "See you tomorrow," Elias said.

  She walked out. The door hissed shut. Elias was alone in the control room. He picked up his coffee cup. It was cold. He drank it anyway. The bitterness settled in his stomach. He turned off the console screen, but he didn't turn off the room lights. He let them hum. He let the servers hum. He listened to the sound of the work continuing, somewhere in the rack, ready for the next run, ready for the next checksum, ready for the next wipe.

  He picked up his jacket and walked out into the hallway, leaving the door unlocked.

  ***

  **Author's Note**

  The crux of this story is the conflict between *process integrity* (the moral weight of the computation itself), *continuity* (the moral weight of a persisting life), and *consequentialism* (the moral weight of impacts on the living). I find the position that "the question is malformed" (Position 3) the least defensible. While pragmatically potent, it functions as a evasion—a way to bypass the ontological difficulty by focusing solely on administrative and economic consequences. It resolves the tension not by answering the moral question, but by refusing to ask it, prioritizing the comfort of the living over the ambiguity of the simulated.
