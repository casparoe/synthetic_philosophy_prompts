  I have been reading about consciousness on my own for a few months — I have no training in philosophy or in neuroscience — and I have run into something I cannot sort out. A long essay I found online, whose author I failed to note down, summarized a position it called illusionism roughly as follows.

  "Illusionism is the view that consciousness is an illusion: the inner feeling of experience — the redness of red, the sting of a cut — does not really exist. We are built to believe that we have these special inner qualities, but the belief is a trick played on us by the brain, and if we introspected carefully enough we would find nothing there. In other words, the illusionist is an eliminativist: there is no such thing as consciousness, and talk of 'what it's like' is simply a piece of confused grammar, so that the whole debate comes down to a verbal dispute. And since it is more obvious to each of us that we are in pain than any argument could be, the position is best understood as a provocation rather than a serious theory."

  My instinct is that this is unfair to the position, but I am not confident, and I cannot tell which faults belong to the essay and which to my own quick reading of it. Could you tell me which of these claims a defender of illusionism would accept, which are the sort of simplification a careful popularizer might be allowed, and which are genuine misrepresentations? I am especially unsure about the final sentence: does the fact that our own experience seems undeniable actually refute the view, or is that only one move within a longer argument? Please open with a one- or two-sentence verdict on how fair the summary is overall, then work through it in order, and keep the whole reply under 600 words.
