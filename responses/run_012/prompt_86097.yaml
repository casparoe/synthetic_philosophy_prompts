  # ETHICS HANDOUT: THE UTILITY MONSTER DECISION TREE

  **Instructions:** Start at **Node 1**. Answer "Yes" or "No" based on your immediate judgment of the case described. Follow the arrow to the next Node or to a **Leaf** (a final position). Do not worry about consistency with other courses or theories; answer what seems right to you *now*.

  ---

  ### THE TREE

  **Node 1: The Standard Case**
  Imagine a being exists who gains 10,000 units of satisfaction from a resource (e.g., a cookie) that would give you only 1 unit of satisfaction. There are no side effects. Should you give the resource to the being?
  *   **Yes** → Go to Node 2.
  *   **No** → Go to Node 6.

  **Node 2: The Ordinary Neighbor**
  Suppose this being is not a sci-fi monster, but a human neighbor with unusually intense emotional capacity. The math (10,000 to 1) remains the same. Should you give them the resource?
  *   **Yes** → Go to Node 3.
  *   **No** → Go to Node 7.

  **Node 3: The Digital Mind**
  Suppose the being is a fast-running computer simulation. It processes experience so quickly that 1 second of its time equals 1 hour of yours, generating the 10,000 to 1 ratio through speed rather than intensity. Should you give it the resource?
  *   **Yes** → Go to Node 4.
  *   **No** → **Leaf A**.

  **Node 4: The Continuous Dial**
  Imagine a dial that lowers the being's advantage. At setting 10,000:1 you said Yes. At setting 1.1:1 (they gain slightly more than you lose), do you *still* give them the resource?
  *   **Yes** → Go to Node 5.
  *   **No** → Go to Node 8.

  **Node 5: The Many vs. The One**
  You have accepted the single being's claim. Now, imagine 10,000 ordinary people each gain a tiny amount (totaling the same as the monster) if you sacrifice your resource. Do you sacrifice it for the crowd?
  *   **Yes** → Go to Node 9.
  *   **No** → **Leaf B**.

  **Node 6: The Many (Alternative Entry)**
  You rejected the Monster at Node 1. But suppose instead of one monster, there are 10,000 ordinary people who each gain a small amount if you sacrifice your resource. Do you sacrifice it for the crowd?
  *   **Yes** → Go to Node 10.
  *   **No** → Go to Node 11.

  **Node 7: The Explanation (Neighbor Rejected)**
  You rejected the Neighbor at Node 2. Is this because no actual human can psychologically feel 10,000 times more pleasure than another?
  *   **Yes** → **Leaf C**.
  *   **No** → Go to Node 12.

  **Node 8: The Bounded Function**
  You rejected the 1.1:1 case at Node 4. But suppose the monster has a limit: it gains huge welfare up to 100 cookies, then gains *nothing* more (satiation). Do you sacrifice resources until it is full?
  *   **Yes** → **Leaf D**.
  *   **No** → Go to Node 12.

  **Node 9: The Limit (Aggregator)**
  You accept aggregation for both Monster and Many. Is there *any* amount of loss to you that is too great to sacrifice, regardless of the total gain to others?
  *   **Yes** → **Leaf D** (Threshold).
  *   **No** → **Leaf E**.

  **Node 10: The Mirror**
  You accepted the Many at Node 6. Does this principle imply that current wealth redistribution from the moderately well-off to the desperately poor is morally mandatory?
  *   **Yes** → **Leaf F**.
  *   **No** → **Leaf C** (Empirical).

  **Node 11: The Hard Limit**
  You rejected the Many at Node 6. Is this because small gains to many people simply count for less morally than a significant loss to one person (a concave value function)?
  *   **Yes** → **Leaf G**.
  *   **No** → Go to Node 12.

  **Node 12: The Currency**
  You have rejected aggregation in the previous steps. Is this because welfare cannot be measured on a precise ratio scale (you cannot say "10,000 times more")?
  *   **Yes** → **Leaf H**.
  *   **No** → Go to Node 13.

  **Node 13: The Status**
  Is your rejection based on the idea that the other beings (monster or crowd) have lower moral status than you, so their welfare counts for less?
  *   **Yes** → **Leaf I**.
  *   **No** → Go to Node 14.

  **Node 14: The Structure**
  Is your rejection based on the idea that persons are separate entities and losses cannot be cancelled out by others' gains?
  *   **Yes** → **Leaf J**.
  *   **No** → **Leaf K**.

  ---

  ### THE POSITIONS (LEAVES)

  **Leaf A: Biological Bias (Digital Skeptic)**
  *   **Commitment:** Moral consideration depends on biological substrate, not speed or capacity of experience.
  *   **Awkward Commitment:** You must deny that a digital mind suffering in real-time feels pain, even if it behaves exactly like a biological mind.
  *   *[Welfare Neutral]*

  **Leaf B: Aggregation Inconsistency (The Unoccupied)**
  *   **Commitment:** A single being's massive gain outweighs your loss, but a crowd's identical total gain does not.
  *   **Awkward Commitment:** You treat a single entity as morally weightier than a multitude without a principled distinction between them.
  *   *[Welfare Neutral]*

  **Leaf C: Empirical Falsehood (Contingent Rejection)**
  *   **Commitment:** The case is logically possible but false of any actual creature; no being can actually feel that much.
  *   **Awkward Commitment:** If science discovered a being that *could* feel that much, you would have to sacrifice everyone to it.
  *   *[Welfare Neutral]*

  **Leaf D: Threshold Aggregator (Satiated)**
  *   **Commitment:** Maximize total welfare, but only until marginal gains equalize or the recipient is satiated.
  *   **Awkward Commitment:** You must support sacrificing the poor to the rich until the rich are "full," then stop abruptly.
  *   *[Welfare Neutral]*

  **Leaf E: Unqualified Aggregator (Bullet-Biter)**
  *   **Commitment:** Always maximize the sum of welfare, regardless of distribution, magnitude of individual loss, or identity.
  *   **Awkward Commitment:** You must support sacrificing an innocent person if it provides enough minor conveniences to a large enough crowd.
  *   *[Welfare Neutral]*

  **Leaf F: The Mirror Reading (Bad Faith)**
  *   **Commitment:** The "monster" relation already exists between the wealthy and the poor; denying it is dishonest.
  *   **Awkward Commitment:** You must endorse radical redistribution of your own resources immediately to be consistent.
  *   *[Welfare Neutral]*

  **Leaf G: Prioritarian (Concave Value)**
  *   **Commitment:** Welfare counts, but benefits to those with less count for more; small gains to many cannot outweigh a large loss to one.
  *   **Awkward Commitment:** You must sometimes prefer a lower total sum of welfare to avoid inequality or significant individual loss.
  *   *[Welfare Neutral]*

  **Leaf H: Measurement Skeptic (Ratio Denier)**
  *   **Commitment:** The case is ill-formed because welfare admits no ratio scale (we cannot measure "10,000 times" pleasure).
  *   **Awkward Commitment:** You cannot compare even your own intense pain against your own mild pleasure quantitatively.
  *   *[Hedonistic/Desire-Dependent]*

  **Leaf I: Graded Status (Moral Hierarchy)**
  *   **Commitment:** Beings have different moral weights; the monster's welfare counts for more (or the crowd's for less) per unit.
  *   **Awkward Commitment:** You must defend a hierarchy where some beings are inherently "worth more" than others independent of their capacity to suffer.
  *   *[Welfare Neutral]*

  **Leaf J: Separateness of Persons (Non-Aggregative)**
  *   **Commitment:** Society is not a super-person; one person's loss is never cancelled by another's gain.
  *   **Awkward Commitment:** You cannot justify any policy that harms one identifiable person to save two others from identical harm.
  *   *[Welfare Neutral]*

  **Leaf K: Incommensurability (No Common Currency)**
  *   **Commitment:** Your loss and their gain are different kinds of values that cannot be weighed on a single scale.
  *   **Awkward Commitment:** Moral decision-making becomes a matter of intuition or fiat rather than calculation or principle.
  *   *[Objective-List Dependent]*

  ---

  ### INDISTINGUISHABLE POSITIONS

  **Leaf J (Separateness) and Leaf K (Incommensurability)**
  *   **Flag:** Node 14 cannot fully separate these. Both yield the same verdict (do not sacrifice), and a student may cite both reasons simultaneously. The tree forces a choice where a hybrid view is possible.

  ### WELFARE DEPENDENCY NOTES

  *   **Leaf H (Measurement Skeptic):** Relies on welfare being subjective or ordinal. If welfare is objective (e.g., "health units"), ratio scales are plausible.
  *   **Leaf K (Incommensurability):** Most robust on Objective-List theories (e.g., liberty vs. happiness). Harder to sustain on pure Hedonism (pain vs. pleasure are often seen as commensurate).
  *   **All Other Leaves:** Currency-neutral. A "Monster" can be constructed for any theory that aggregates value (resources, desire satisfaction, objective goods).

  ---

  ### UNOCCUPIED COMBINATIONS

  **1. The Aggregation Inconsistency (Leaf B)**
  *   **Diagnosis:** *Incoherent.* Accepting the Monster case entails accepting that sums matter. Rejecting the Many case entails that sums do not matter. Holding both implies the *identity* of the recipient matters more than the *amount* of good, which contradicts the logic used to accept the Monster.

  **2. The Digital Skeptic (Leaf A)**
  *   **Diagnosis:** *Unattractive.* This position relies on "carbon chauvinism." If the digital mind exhibits all behavioral and functional signs of welfare, denying it moral weight requires a metaphysical claim about souls or biology that most modern ethicists find untenable.

  **3. The Empirical Falsehood (Leaf C) + Unqualified Aggregator (Leaf E)**
  *   **Diagnosis:** *Unexplored/Unstable.* Some students claim the Monster is impossible (Leaf C) but would feed it if it existed (Leaf E). This is stable only as long as the impossibility holds. It collapses into Leaf E upon empirical discovery, making it a contingent bullet-bite.

  ---

  **Instructor's Meta-Commentary:**
  The load-bearing node is **Node 5 (The Many vs. The One)**, as it distinguishes those who object to the *monster* specifically from those who object to *aggregation* generally; this is where the "utilitarian" intuition is truly tested. The tree forces a genuine disagreement into a merely verbal one at **Node 14**, where "Separateness of Persons" and "Incommensurability" often describe the same intuitive refusal to trade lives using different metaphysical vocabularies.
