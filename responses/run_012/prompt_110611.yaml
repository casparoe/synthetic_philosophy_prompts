answer: |-
  | Reading | The Claim | What Must Be True | Verdict | Does it Support the Conclusion? | Test Case |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **The Hardin Inevitability** | Unrestricted access to a scarce resource inevitably causes depletion. | Users cannot communicate, bind agreements, or establish norms; resource is rivalrous. | Contested | Only with an extra premise — community self-governance is impossible. | Alpine grazing commons (managed successfully for centuries vs. Hardin's prediction). |
  | **The Strategic Dominance** | Rational actors will defect because the payoff structure makes cooperation strictly dominated. | Interaction is one-off, communication is non-binding, no external enforcement exists. | Substantive and defensible | No — requires extra premise — the game cannot be iterated or monitored. | Anonymous online comment section (one-shot) vs. recurring village council (iterated). |
  | **The Public Goods Flip** | Individuals will withhold contribution to a shared benefit because they cannot be excluded from enjoying it. | The good is non-excludable and contribution entails private cost (underprovision vs. depletion). | Substantive and defensible | Only with an extra premise — voluntary mechanisms cannot sustain the good. | Local news subscription (underprovided) vs. Fishery collapse (depleted). |
  | **The Assurance Problem** | Actors prefer mutual cooperation but defect because they lack assurance others will join. | Two equilibria exist (all cooperate vs. all defect), and cooperation is preferred to defection. | Contested | No — requires extra premise — communication cannot solve the assurance problem. | Group chat restaurant picking (coordination) vs. Overfishing (incentive to defect). |
  | **The Institutional Vacuum** | Resource collapse occurs only when property rights or governance norms are absent. | Users are capable of organizing but lack legal or social authority to enforce rules. | Substantive and defensible | Yes — implies local solutions are viable (contradicts privatisation-only claims). | Open ocean fishing (no owner) vs. Private pond (owner manages stock). |

  When someone uses the slogan without context, assume they mean **The Hardin Inevitability** mixed with **The Strategic Dominance**. They are asserting that the resource is finite, the actors are selfish, and ruin is the default state unless an external authority intervenes. This is the "lazy" default because it bypasses the need to investigate whether communication, iteration, or norms are present, effectively shutting down inquiry into local governance or coordination mechanisms by framing the problem as a law of nature rather than a design failure.

  The slogan cannot settle the **political legitimacy** or **feasibility** of the solution. Even if the incentive structure is correctly identified as a Prisoner's Dilemma, the label does not determine whether privatisation, state regulation, or community norms are the morally preferred or practically possible remedy. It describes a pressure, not a destiny, and it offers no metric for weighing the costs of the proposed cure against the costs of the disease, leaving the most important journalistic questions—who decides, and who pays—completely unanswered.
