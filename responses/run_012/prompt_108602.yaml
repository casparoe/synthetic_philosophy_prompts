prompt: |-
  OK so I've been reading about Bronston v. United States, the 1973 Supreme Court perjury case, and I want you to run it through Grice's stuff on implicature and speaker meaning. Here's the setup so you don't have to go looking: Bronston ran a film company that had gone into bankruptcy, and at a hearing a creditor's lawyer asked him about his Swiss bank accounts. The exchange went like this: "Do you have any bank accounts in Swiss banks, Mr. Bronston?" "No, sir." "Have you ever?" "The company had an account there for about six months, in Zurich." "Have you any nominees who have bank accounts in Swiss banks?" "No, sir." "Have you ever?" "No, sir." Turns out he'd personally had an account in Geneva for nearly five years, and everyone agreed every one of his answers were literally true. The Court held a literally true but unresponsive answer isn't perjury even if he meant to mislead, because the questioner has to frame his questions acutely and the safeguard is cross-examination, not the criminal law.

  What I want is the machinery worked out on this. What did he say vs. what did he implicate; which maxims were in play or flouted; is the "negative implication" even a particularized implicature or is it just a false belief he caused without implying anything; and does the Cooperative Principle apply at all to a hostile witness being cross-examined by someone who isn't his ally? Then run it the other direction: does the saying/implicating distinction actually explain the legal rule here, or does the rule refuse to make speaker meaning the unit of liability, which is in tension with Grice's whole point that speaker meaning is what meaning is? And contrast advertising / consumer-protection law, where literally true but misleading statements are actionable — what Gricean difference (who the hearer is, what remedies exist, what the institution is for) marks that line? Be straight about where the framework goes quiet instead of forcing it to talk.

  Say what would change your mind, and end with a final line beginning Verdict: that sums up in one sentence whether Grice illuminates this case or the case exposes a limit of Grice.
