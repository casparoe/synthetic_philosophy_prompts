  2.  **Gricean Analysis of *Bronston*:**

      *   *Q1:* "Do you have any bank accounts in Swiss banks?" *A1:* "No, sir." (Literal truth, currently no account).
      *   *Q2:* "Have you ever?" *A2:* "The company had an account there for about six months, in Zurich." (Literal truth, company did, he personally did too but didn't say that).
      *   *Implicature:* By answering about the *company* when asked about *himself* (implicitly, given the context of personal liability), he implicates "I personally have never had an account."
      *   *Maxims:*
          *   **Quantity:** Make your contribution as informative as required. Bronston violates this. He gave *less* information than required to satisfy the query's intent.
          *   **Relation:** Be relevant. His answer is tangentially relevant (company vs. individual) but arguably flouts Relation to generate the implicature that there is no personal account.
          *   **Quality:** Do not say what you believe to be false. He adhered to this strictly (literal truth).
      *   *PCI vs. False Belief:* Is it an implicature? Grice says implicatures are cancellable. If Bronston said, "The company had an account... and so did I," it wouldn't be contradictory, just surprising. This suggests it *is* an implicature. However, in a legal setting, is it a *communicative* act intended to be inferred, or just a deceptive maneuver? Grice assumes cooperation. Bronston was actively non-cooperative.
      *   *Cooperative Principle in Court:* This is the big friction point. Grice's CP assumes participants are trying to exchange information efficiently. A hostile witness under oath is *not* cooperating with the questioner. They are cooperating with the *process* (telling the truth) but not the *interlocutor*. Does CP apply to adversarial proceedings? Maybe a modified CP where "Cooperation" = "Adherence to Rules of Evidence" rather than "Helpfulness."

  3.  **Legal Rule vs. Gricean Theory:**

      *   *The Law:* The law cares about the *proposition expressed* (what is said), not the *speaker meaning* (what is implicated). Perjury requires a false statement of fact.
      *   *Grice:* Speaker meaning (including implicature) *is* the core of communication.
      *   *Tension:* The law essentially says, "We don't care about speaker meaning for liability purposes here." This creates a disconnect. Grice explains *how* the deception worked (via implicature), but the law refuses to punish the deception *because* it was only implicature. So Grice explains the mechanism of the lie, but the law rejects Grice's ontology of meaning for the purpose of justice.
      *   *Does the distinction explain the rule?* Yes, the Court explicitly relies on the literal truth (what is said) vs. the misleading inference (what is implicated). They privilege "saying" over "implicating."

  4.  **Contrast with Advertising/Consumer Protection:**

      *   *Advertising:* "Literally true but misleading" is often actionable (e.g., FTC standards).
      *   *Gricean Difference:*
          *   *Hearer:* In court, the hearer is a trained lawyer (sophisticated). In advertising, the hearer is the general public (vulnerable).
          *   *Institution:* Court is adversarial (burden on questioner). Market is transactional (burden on seller not to deceive).
          *   *Remedy:* Perjury is criminal (high stakes, strict construction). Advertising is civil/regulatory (protective).
          *   *CP Status:* Advertising is inherently non-cooperative in the Gricean sense (trying to sell, not inform). Yet the law imposes a "duty of candor" that overrides the natural non-cooperation. In court, the witness has a duty of truthfulness, but the *lawyer* has the duty of inquiry.

  5.  **Where the Framework Goes Quiet:**

      *   Grice assumes a shared goal of communication. In *Bronston*, the goal is obstruction. Grice can describe the *mechanism* (flouting maxims to generate false inferences), but his normative framework (how communication *should* work) doesn't map well to adversarial legal procedure where non-cooperation is a strategic right.
      *   Grice doesn't account for *legal consequences* of meaning. He cares about understanding, not liability.
