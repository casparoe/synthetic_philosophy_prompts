answer: |-
  1. The claim that master and slave share the same interest follows deductively from the teleological definition of the slave as the bodily instrument of the master's mind, constituting a single functional unit rather than serving as an independent ethical premise. This unity implies that harming the slave harms the master's own capacity for action, grounding the relationship in biological synergy rather than mere coercion.

  2. Aristotle's assertion that nature distinguishes between the female and the slave posits two distinct natural functions within the household, rejecting the idea that one type of person can optimally fulfill both reproductive and servile roles. This specialization argument relies on the principle that nature, unlike a frugal smith, designs specific capacities for specific ends, thereby naturalizing the separation of gendered authority from chattel status.

  3. The absence of a natural ruler among barbarians indicates collective natural slavery because Aristotle assumes rational capacity for rule is a scarce natural endowment rather than a conventional political achievement. Without this internal hierarchical distinction, the group lacks the functional architecture of a free polis and is thus categorized as a single servile body awaiting external direction.

  4. This structural deficit justifies the poet's claim that Hellenes should rule barbarians, as the Greek master provides the rational foresight the barbarian community naturally lacks. The argument thereby collapses the distinction between ethnic identity and natural status, treating conquest as the restoration of a proper mind-body relationship on a political scale.

  5. The argument's strongest reading presents a consistent teleological system where function determines status, but its weakest reading exposes a circular empirical claim that identifies natural rulers solely by their existing political dominance. Consequently, the distinction between natural and conventional slavery collapses when the alleged natural markers of rule are shown to be contingent social constructs.
