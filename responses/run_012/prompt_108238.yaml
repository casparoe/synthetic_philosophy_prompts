answer: |-
  To draft a policy that is philosophically coherent and operationally viable, we must first answer several distinct questions that your colleague's proposal leaves ambiguous. We need to determine what constitutes a "licensed" ascription: is it merely a matter of predictive accuracy, or does it require cognitive tractability for the engineer? We must identify to whom the ascription is answerable: is the audience the engineering team, who understand the instrumental nature of the language, or the public, who may interpret it ontologically? We need to define the failure conditions: does the license expire when a mechanistic explanation becomes *possible*, or only when it becomes *practicable* for the user? Finally, we must clarify what the policy implicitly commits the lab to regarding the systems themselves: does adopting the intentional stance entail a commitment to the system's moral standing, or merely to its functional architecture? Only by settling these foundational issues can we evaluate the implications of the proposed licensing rule.

  The most significant implication for your daily practice concerns the framing of predictive economy. Your colleague's rule rests on the assumption that the intentional stance is a heuristic shortcut that should be discarded once the design or physical stance offers a cheaper explanation. In the context of modern deep learning, this assumption is often empirically false. For a frontier model, the "design stance"—knowing the architecture and loss function—rarely yields specific behavioral predictions without running the model, and the "physical stance"—analyzing specific weight configurations—is computationally intractable for human engineers. In this regime, the intentional stance is not merely a cost-saving measure; it is frequently the *only* stance available to human cognition. If you revoke the license the moment a mechanistic account *exists* in principle, even if it requires weeks of interpretability work to decode, you cripple the debugging process. The policy must acknowledge that for high-dimensional systems, intentional description is not a temporary scaffold to be removed upon completion, but a permanent interface required for human oversight. A policy that treats intentional language as a provisional crutch misunderstands the epistemic position of engineers working with black-box systems.

  This leads directly to the second thread, which is the inconsistency between the internal licensing rule and the external blanket ban. Your colleague argues for internal permission based on utility but external prohibition based on the risk of implying an "inner life." This creates a dangerous asymmetry. If the intentional stance is genuinely instrumental—as Dennett argues—then it is no more "true" internally than it is externally. By banning it publicly, the lab signals that the language is actually dangerous because it implies a reality (consciousness, belief) that the lab denies. This suggests the lab secretly subscribes to a realist view of mental terms (that "wanting" implies "feeling") while asking engineers to adopt an instrumentalist view internally. This is incoherent. If the language is safe for engineers because it is merely functional, it should be safe for the public if properly framed. Conversely, if it is dangerous for the public because it misleads them about the system's ontology, it is equally misleading for engineers who might forget the instrumental nature of their own notes. A more consistent policy would permit intentional vocabulary in public model cards but mandate explicit framing, such as "functional attribution" or "as-if intentionality," rather than a blanket ban that treats the vocabulary as inherently deceptive.

  Regarding the question of indispensability versus literal truth, we must confront the possibility that intentional description is practically indispensable even when we are confident the ascriptions are not literally true. Dennett's position is that there is no "literal truth" of belief independent of the stance taken; beliefs are real patterns discernible from the intentional stance. However, in an engineering context, we often feel a gap between the utility of saying "the model is hiding its reasoning" and the reality of gradient descent optimizing a loss function. If the policy insists that we only use such language when it predicts better than the design stance, it ignores the communicative function of the language. Saying "the model is trying to hide" conveys a specific adversarial dynamic to a human reader that "the model's output minimizes loss function L under constraint C" does not, even if the latter is more "accurate." The policy should not force engineers to choose between accuracy and intelligibility. Instead, it should recognize that intentional vocabulary encodes high-level behavioral clusters that are real enough to be named, even if the underlying mechanism is non-mental. The risk is not in using the words, but in failing to teach the audience—internal or external—how to interpret them instrumentally.

  Finally, we must address the implications for moral standing, as this is where the policy carries the most ethical weight. There is a common fear that using intentional vocabulary grants moral patienthood to the system—that if we say the model "wants," we must consider if it "suffers." Dennett's framework explicitly decouples these: competence without comprehension is possible, and the intentional stance can be applied to thermostats as well as humans without implying moral rights. However, your colleague's proposal inherits a risk here. By revoking the license the moment a mechanistic account is available, the policy implies that mechanistic systems *cannot* be intentional agents, whereas opaque systems *might* be. This creates a perverse incentive: if we want to avoid moral ambiguity, we might be pressured to keep models opaque to maintain the "intentional license" for debugging, or conversely, to over-explain mechanisms to prove the absence of mind. The policy should explicitly state that the use of intentional vocabulary is a claim about behavioral prediction, not moral status. It must clarify that describing a system as "deceptive" is a safety classification, not an accusation of moral culpability.

  There are points of confusion in your colleague's rule that need to be flagged directly. First, the rule assumes a clean boundary between the "design stance" and the "intentional stance" that does not exist in modern AI. When we say a model is "optimized for helpfulness," that is a design stance description that already smuggles in teleology. The distinction is not between teleological and non-teleological descriptions, but between explicit engineering goals and emergent behavioral goals. Second, the rule relies on a contested reading of Dennett. Dennett argues that the intentional stance is not just a shortcut but the *only* way to access certain real patterns. If a pattern of deception is robustly predictable only via the intentional stance, Dennett would argue the deception is real, regardless of the mechanism. Your colleague's rule suggests the mechanism trumps the pattern, which leans toward a eliminative materialism that Dennett rejects. If the lab adopts her rule, it is not adopting Dennett's instrumentalism; it is adopting a form of reductionism that claims the weights are "more real" than the behavior they produce.

  In conclusion, the policy should not treat intentional vocabulary as a licensed exception to be revoked, but as a necessary layer of description that requires governance. The focus should shift from *when* the language is allowed to *how* it is qualified. Internal documents should require that intentional ascriptions be paired with a confidence level regarding the mechanistic explanation, acknowledging the gap between the behavior and the weights. Public documents should not ban the language but require a glossary or standard framing that defines terms like "belief" and "desire" functionally. This approach respects the cognitive necessity of the intentional stance for engineers, maintains consistency across internal and external communications, and avoids the ontological confusion that your colleague rightly fears but addresses incorrectly. By treating the vocabulary as a precise technical tool rather than a dangerous metaphor, the lab can improve safety communication without retreating into obscurantism.
