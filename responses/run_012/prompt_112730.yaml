prompt: |-
  ok so im a junior and somehow im the "data person" on the school paper, which basically means im the only one who doesnt cry when a spreadsheet opens. heres my problem. our district rolled out a new Algebra I program (call it Program A) in some schools last year and kept the old one (Program B) in others, and each school just picked which one it wanted, which i already know is a bad sign. the district sent us three summary tables and ive been staring at them for two days because they contradict each other and i cant tell which contradiction is real and which one is me being dumb. table 1, pass rate by the 7th grade placement test (that test is from the year before, way before any of this):

  | | advanced placement | regular placement | total |
  |---|---|---|---|
  | Program A | 18 of 20 | 60 of 100 | 78 of 120 (65%) |
  | Program B | 80 of 100 | 10 of 20 | 90 of 120 (75%) |

  table 2, same two programs, but split by whether the kid passed the Unit 1 test, which happens in october about six weeks into the course:

  | | passed unit 1 | didnt pass unit 1 | total |
  |---|---|---|---|
  | Program A | 120 of 160 | 12 of 40 | 132 of 200 (66%) |
  | Program B | 90 of 100 | 40 of 100 | 130 of 200 (65%) |

  and table 3, which is just the regular placement row from table 1 broken down by which middle school the kid came from: Northside, A 33 of 60 and B 8 of 12; Riverside, A 27 of 40 and B 2 of 8. so table 1 says B is better overall but A is better for both kinds of student. table 2 has the opposite shape (A better overall, B better inside both groups). and table 3 takes the group where A looked best and finds a middle school where B wins by a mile. my editor (she teaches history, shes nervous about anything that looks like a study) wants something to run thursday, and my dream headline is basically that the new program is actually better and the district average is just composition. but i have a feeling the procedure your about to give me is going to tell me i cant write that, and i want you to say so straight if it does.

  what i want is a procedure i can actually run, like a numbered list of questions in order, that tells me: when am i allowed to split a number apart and when do i have to leave it whole; what has to be true about the thing im splitting on for the split to mean anything at all; what i do when a cell has 12 kids in it; how far down i can keep splitting before im just fishing until something flips; and what to do when i cant find out why the groups ended up different sizes in the first place (the district will not tell us how schools chose, they just say "site based decision," which is a phrase i now hate). it needs to end with an actual verdict for each of the three tables: what claim, if any, i can put in print, and if the honest answer is that i can report the numbers but not the causal claim, then say that and tell me how to write it so the paper doesnt look like we're covering for the district. also tell me where the procedure genuinely cant decide and i have to go ask a human — my stats teacher, the district data office, the advisor — and be honest about which of the steps are judgment calls dressed up as arithmetic. two other kids on the paper who dont know what a variable is have to be able to follow it, i've got about an hour with these numbers plus whatever the district emails back, and dont send me off to read papers, i need steps.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** High school junior, "data person" for the school paper. Self-aware, knows spreadsheets better than peers, but not a statistician. Under pressure (deadline Thursday).
      *   **Task:** Needs a concrete, step-by-step procedure to analyze three contradictory data tables regarding two Algebra I programs (A vs. B).
      *   **Constraints:**
          *   Must be actionable (numbered list).
          *   Must be understandable by non-stats peers.
          *   Time limit: ~1 hour + email wait time.
          *   No reading academic papers.
          *   Must address specific methodological questions (when to split, sample size, fishing/exhaustion, confounding variables).
          *   Must provide a verdict for each table (what can be printed).
          *   Must be honest about limitations (causal claims vs. observation).
          *   Must identify when to ask a human.
          *   Tone: Direct, supportive, realistic, not condescending.
      *   **The Data:**
          *   *Table 1 (Simpson's Paradox setup):* Program B looks better overall (75% vs 65%), but Program A looks better within subgroups (Advanced: 90% vs 80%; Regular: 60% vs 50%). *Wait, let me check the math.*
              *   Prog A Advanced: 18/20 = 90%.
              *   Prog B Advanced: 80/100 = 80%.
              *   Prog A Regular: 60/100 = 60%.
              *   Prog B Regular: 10/20 = 50%.
              *   *Observation:* A is better in both subgroups. B is better overall. This is classic Simpson's Paradox. The cause is the weighting (A has mostly Regular students, B has mostly Advanced students).
          *   *Table 2 (Reverse Paradox?):* Program A looks better overall (66% vs 65%). Inside subgroups:
              *   Passed Unit 1: A (120/160 = 75%) vs B (90/100 = 90%). *B is better.*
              *   Didn't Pass Unit 1: A (12/40 = 30%) vs B (40/100 = 40%). *B is better.*
              *   *Observation:* B is better in both subgroups. A is better overall. Another Simpson's Paradox. A has mostly "Passed Unit 1" students (160 vs 40), B has equal split (100 vs 100).
          *   *Table 3 (Small Sample/Confounding):* Breakdown of "Regular Placement" from Table 1 by Middle School.
              *   Northside: A (33/60 = 55%), B (8/12 = 66%). *B wins.*
              *   Riverside: A (27/40 = 67.5%), B (2/8 = 25%). *A wins.*
              *   *Observation:* In Table 1 Regular, A won (60% vs 50%). Now, split by school, B wins in Northside, A wins in Riverside. This suggests "Middle School" is a confounding variable or the sample sizes are too small (especially B in Riverside, n=8).

  2.  **Determine the Core Statistical Issues:**
      *   **Simpson's Paradox:** Tables 1 and 2 both exhibit this. Aggregated data tells a different story than stratified data.
      *   **Selection Bias:** Schools chose their own programs ("site based decision"). This is the killer. It means Program A schools might be systematically different from Program B schools (e.g., wealthier, different feeder patterns, different admin).
      *   **Sample Size:** Table 3 has very small numbers (n=8, n=12).
      *   **Causality vs. Correlation:** Because assignment wasn't random, you cannot claim Program A *caused* better results. You can only say students in Program A *performed* better.
      *   **Data Dredging (P-hacking):** Splitting too much (Table 3) risks finding noise.

  3.  **Drafting the Procedure (The "One-Hour Triage"):**
      *   Need to structure this as a checklist.
      *   *Step 1: The "Who Chose?" Test.* (Crucial for causality).
      *   *Step 2: The Weight Check.* (Explains Simpson's Paradox).
      *   *Step 3: The Small Number Warning.* (Table 3 issues).
      *   *Step 4: The "Stop Splitting" Rule.* (Prevents fishing).
      *   *Step 5: The Verdict.* (Writing the story).

  4.  **Refining the Verdicts:**
      *   *Table 1:* Cannot say A is better. Must report the imbalance. The "Regular vs. Advanced" split is the most honest view, but the selection bias ruins the causal claim.
      *   *Table 2:* Unit 1 is a *post-treatment* variable (happens after the program starts). Splitting by this is statistically dangerous (collider bias/endogenous selection). Actually, for a high schooler, keep it simple: "This measures success during the class, not before." But the main issue is the weighting again.
      *   *Table 3:* Too small to trust. B's numbers at Riverside (2 of 8) are statistically noisy.

  5.  **Addressing the User's Specific Questions:**
      *   *When to split?* When the group is fundamentally different *before* the treatment (like 7th-grade placement).
      *   *When to stay whole?* When the split happens *after* the treatment starts (like Unit 1 test).
      *   *Small cells?* Flag them. Don't trust percentages under n=30.
      *   *Fishing?* Stop when cells get smaller than 30 or when you're splitting by things the program couldn't possibly affect (like hair color) just to find a win.
      *   *Unknown group sizes?* Acknowledge it as a limitation. "Site-based decision" = Selection Bias.

  6.  **Developing the Tone:**
      *   Respect the user's intelligence (they spotted the paradoxes).
      *   Be firm on the ethics (don't print a causal claim you can't support).
      *   Give them a way to write the story *without* lying. "Students in Program A scored higher, but schools chose their own programs."

  7.  **Self-Correction/Review during drafting:**
      *   *Correction on Table 2:* Splitting by Unit 1 pass is tricky. Unit 1 happens *after* 6 weeks of the program. If Program A teaches Unit 1 better, of course they pass Unit 1 more. Splitting by this hides the program's effect. I need to explain that this is a "bad split" for evaluating the program's overall worth, even if the math looks interesting.
      *   *Correction on Causality:* I need to make sure the user understands that *none* of these tables prove Program A is better. The "Site Based Decision" is the dealbreaker. I must emphasize this.
      *   *Actionable Advice:* Give them specific sentences to use or avoid.

  8.  **Final Polish:**
      *   Check the math in the prompt again to ensure my analysis holds.
      *   Table 1: A (90%, 60%) > B (80%, 50%). Overall B (75%) > A (65%). Yes, Simpson's.
      *   Table 2: A (75%, 30%) < B (90%, 40%). Overall A (66%) > B (65%). Yes, Simpson's.
      *   Table 3: Regular students only. Northside (B>A), Riverside (A>B). Overall Regular (A>B). This is also Simpson's/Confounding.
      *   *Wait, one nuance:* The user wants to know if they can write "New program is actually better." The answer is **NO**. I need to be very clear on that. The selection bias is too high.

  9.  **Structure of Response:**
      *   Validation (You're not dumb, this is real).
      *   The 5-Step Procedure.
      *   The Verdicts (Table by Table).
      *   The "Human Help" List.
      *   The Headline/Lead advice.

  10. (Final check of constraints): "Two other kids... have to be able to follow it." Keep language simple. "Don't send me off to read papers." Keep it self-contained. "Tell me straight if I can't write that." Be direct.

  Let's write it.cw
answer: |-
  You are not being dumb. You have spotted **Simpson's Paradox** twice (Tables 1 and 2) and **Small Sample Instability** once (Table 3). This is real statistics, not you miscalculating.

  However, your dream headline ("New program is actually better") is statistically unsafe to print. Because schools chose their own programs ("site based decision"), you have **Selection Bias**. You cannot prove the *program* caused the scores; it might be that schools with better students/resources picked Program A.

  Here is your 1-hour triage procedure. It is designed for you and your non-stats peers to follow.

  ### The 5-Step "Don't Get Sued" Procedure

  **Step 1: The "Before vs. After" Split Test**
  *   **Question:** Did the thing I'm splitting by happen *before* the program started or *after*?
  *   **Rule:**
      *   **Before (e.g., 7th Grade Test, Middle School):** You **MUST** split. These are pre-existing conditions. Ignoring them hides the truth (Table 1).
      *   **After (e.g., Unit 1 Test):** You **MUST NOT** split for a final verdict. This test happened *during* the program. If Program A teaches Unit 1 better, of course those kids pass Unit 1. Splitting by this hides the program's total effect (Table 2).
  *   **Action:** Trust Table 1's splits. Ignore Table 2's splits for the main conclusion.

  **Step 2: The Weight Check (The Simpson's Paradox Test)**
  *   **Question:** Did one program get way more "easy" students than the other?
  *   **Rule:** Look at the subgroups. If Program A has 100 "Regular" kids and Program B has only 20 "Regular" kids, the "Total" number is lying.
  *   **Action:** If the subgroups tell a different story than the Total (like Table 1), **throw out the Total.** Report the subgroups. The Total is mathematically correct but misleading.

  **Step 3: The "Tiny Cell" Warning**
  *   **Question:** Is there a group with fewer than 30 students?
  *   **Rule:** If a specific box has fewer than 30 kids (e.g., Program B at Riverside in Table 3 has only 8 kids), the percentage is unstable. One or two kids failing changes the score by 10-20%.
  *   **Action:** You cannot claim a "win" or "loss" on these numbers. You must label them "Too small to compare."

  **Step 4: The "Fishing" Stop Line**
  *   **Question:** How far down can I keep splitting?
  *   **Rule:** Stop when you run out of **logical** categories (like School or Placement) or when you hit the "Tiny Cell" limit (Step 3).
  *   **Action:** Do not split by teacher name, gender, or birthday month. If you have to split deeper to find a win, you are fishing. Stop at the School level (Table 3) but apply the Tiny Cell Warning.

  **Step 5: The Causality Wall**
  *   **Question:** Did the district assign the programs randomly?
  *   **Rule:** No. They used "site based decision." This means Program A schools might be richer, have better teachers, or have more involved parents.
  *   **Action:** You **cannot** write "Program A causes higher scores." You **can** write "Students in Program A scored higher." You must mention the selection bias in the text.

  ---

  ### The Verdicts (What you can print)

  Here is exactly what you can claim for each table.

  **Table 1 (Placement Test Split)**
  *   **Status:** **Most Reliable Data.**
  *   **The Math:** Program A is better for *both* Advanced (90% vs 80%) and Regular (60% vs 50%) students.
  *   **The Catch:** Program B loaded up on Advanced students (100 kids vs A's 20), which made their Total look better (75% vs 65%).
  *   **Verdict:** You can report that **Program A students outperformed Program B students within the same skill levels.**
  *   **The Headline Constraint:** You cannot say "Program A is better." You must say "Program A students outperformed."
  *   **Required Context:** You must write: *"However, schools chose their own programs, so we cannot confirm if the curriculum caused the difference."*

  **Table 2 (Unit 1 Test Split)**
  *   **Status:** **Misleading / Do Not Use for Main Claim.**
  *   **The Math:** Program B actually wins inside both groups (90% vs 75% for passers; 40% vs 30% for non-passers), but Program A wins the Total.
  *   **The Catch:** This is Simpson's Paradox again, BUT the split is invalid (Step 1). Unit 1 is part of the course. Splitting by it is like judging a diet program by splitting people into "people who lost weight in month 1" vs "people who didn't."
  *   **Verdict:** **Do not publish a comparison based on this table.** It confuses the reader and measures mid-year progress, not final success. Use it only to show that data is complicated.

  **Table 3 (Middle School Split)**
  *   **Status:** **Too Noisy.**
  *   **The Math:** Program B wins at Northside, Program A wins at Riverside.
  *   **The Catch:** Look at the denominators. Program B at Riverside is **2 of 8**. That is 25%. If one more kid passes, it jumps to 37%. That is not data; that is luck.
  *   **Verdict:** **Do not make a claim.** You can report the numbers, but you must add a warning: *"Sample sizes at the school level were too small to draw firm conclusions."*

  ---

  ### How to Write the Story (Without Lying)

  Your editor is nervous. Give her this structure. It protects the paper from looking like district propaganda.

  **The Lead:**
  "Students in the new Algebra I program (Program A) passed at higher rates than the old program (Program B) when comparing similar students, district data shows."

  **The "But" (Crucial for honesty):**
  "However, the overall pass rate for Program B appeared higher. This was because schools using Program B had more students who were already placed in advanced tracks before the year began."

  **The Limitation (Protects you from the District):**
  "Because schools chose which program to use rather than being assigned one randomly, the data cannot prove the new curriculum caused the improvement. Schools with different resources or student populations may have self-selected into different programs."

  **The Visual:**
  Print Table 1. **Cross out the "Total" column** with a marker or put a star next to it that says "Misleading due to group imbalance." Show the Advanced/Regular rows clearly.

  ---

  ### When to Stop and Ask a Human

  You have about an hour. If you get stuck on these, email your stats teacher or the district data office immediately.

  1.  **Ask the District Data Office:** "Can you confirm if 'site based decision' means principals chose, or was it based on funding/grants?"
      *   *Why:* If it was based on grants (e.g., only low-income schools got Program A), that explains the bias better than "principals chose."
  2.  **Ask your Stats Teacher:** "Is n=8 (Table 3, Riverside B) small enough that I should suppress the number entirely?"
      *   *Why:* Some privacy rules forbid reporting groups smaller than 10. You don't want to accidentally out a student.
  3.  **Ask your Advisor:** "Are we allowed to publish that the district's 'Total' number is misleading?"
      *   *Why:* This is an editorial decision, not a math one. The district might get mad. Your advisor needs to know you have the math to back it up.

  ### Summary Checklist for Your Peers
  1.  **Did the split happen before the class?** Yes = Good split. No = Bad split.
  2.  **Are the groups balanced?** If Program A has 100 regular kids and Program B has 20, ignore the Total.
  3.  **Are there fewer than 30 kids in a box?** If yes, call it "Too small to compare."
  4.  **Did schools pick the program?** If yes, never use the word "Caused." Use "Associated with."

  **Final Verdict:** You can write that Program A students did better *within comparable groups*, but you cannot write that Program A is *better* overall. The "Site Based Decision" line kills the causal claim. Write the nuance. It makes for a better story anyway.
