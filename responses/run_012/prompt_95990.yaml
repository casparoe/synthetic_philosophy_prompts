  6.  **Final Polish:** Check word count and timing. Ensure no forbidden terms ("epistemology," "Hume," "Reid," "reductionism"). Ensure the philosophical structure holds the weight.

      *(Self-Correction on the "Where it comes down" aspect)*: The prompt says the distinction should determine where the address comes down. If I lean too hard on "trust everyone," it's dangerous. If I lean too hard on "verify everything," it's impossible. The philosophical insight is that *testimony is a source of knowledge*, not just a placeholder for real knowledge. So the speech should argue: Your colleague's word *is* evidence, provided you uphold the system that makes it reliable. The intern inherits the reliability of the institution.

