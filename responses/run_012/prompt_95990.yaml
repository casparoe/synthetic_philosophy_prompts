      *   **Pre-task:** Briefly note 2-3 places where the distinction bites before drafting.

  2.  **Deconstruct the Philosophy for the Context:**
      *   *Reductionism:* "Trust but verify." You need reasons to believe the person talking to you. In medicine, this means checking labs, looking at the patient yourself, doubting the sign-out.
      *   *Anti-Reductionism:* "Trust unless broken." We are socially entitled to believe what we are told. In medicine, this means accepting the sign-out as truth so you can sleep/function, assuming the system works.
      *   *The Tension:* Medicine requires both. You can't verify everything (Reductionism is impossible at 3 a.m.), but blind trust is dangerous (Anti-Reductionism is risky).
      *   *The Resolution:* The speech needs to navigate this. It can't just say "trust everyone." It can't just say "verify everything." It needs to acknowledge the *burden* of the handoff. The white coat symbolizes the acceptance of this burden.

  3.  **Identify Where the Distinction Bites (Pre-drafting Note):**
      *   *The 3 A.M. Decision:* The intern cannot verify the outgoing resident's assessment ("she's turned the corner"). They must act on testimony alone. Reductionism says this is unjustified; Anti-Reductionism says it's necessary.
      *   *The Chain of Custody:* Information passes from attending -> resident -> intern -> nurse. Each link adds potential noise. Reductionism demands checking the source; Anti-Reductionism relies on the institutional integrity of the chain.
