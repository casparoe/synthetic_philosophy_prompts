prompt: |-
  I've got a small philosophy podcast — a couple of hundred listeners, mostly people who did a conversion course and never quite stopped — and next week's guest has spent the last few years working on the surprise exam paradox. Her book manuscript is with a press, so she's definately happy to talk about unpublished material, and her line is roughly this. The student's Sunday-night argument, she says, only ever kills off one reading of 'surprise': the reading on which it means the student can't deduce in advance which day the exam falls on. The reading she actually cares about — the student being caught off guard when the paper lands in front of them — is left completely untouched by the backward induction, and she thinks the whole paradox is manufactured by sliding quietly between the two. She also insists the teacher's announcement isn't a prediction about the student's state of mind at all but a commitment about the teacher's own future behaviour, and she's fond of saying the thing is the centipede game in school uniform.

  Draft me eight to ten interview questions, none of them generic. I want at least one that makes her spell out the de dicto/de se slide and say what exactly is supposed to be illicit about it, one on the commitment reading — in particular whether it makes the announcement unfalsifiable, and what's meant to happen when the teacher has only one day left on which to schedule the exam — and one that puts pressure on the centipede analogy by asking where it breaks down. I also want a question about an awkward consequence of her view: if surprise is a matter of what the particular student can deduce, then the same announcement looks true for the class dunce and false for the star logician, and I want to know whether she bites that bullet or starts hedging. For each of these, give me a follow-up keyed to the answer she's most likely to give, so I'm not left flat-footed in front of her. Finish with a question about what would count against her position — and don't let her get away with 'that's just a different sense of surprise'; if she reaches for that, I need the next question ready.
