answer: |-
  1. **The Two Readings of Surprise**
  You distinguish between surprise as *indeducibility* (the student can't logically prove the date) and surprise as *psychological unpreparedness* (the student is startled when the paper lands). The standard literature treats the backward induction argument as disproving the possibility of the exam entirely. On your view, does the backward induction argument succeed on its own terms, or is it invalid even under the 'indeducibility' reading?

  *   **Follow-up:** If she says the argument succeeds for inducibility but fails for psychology: "If the student has successfully deduced the exam cannot happen, aren't they psychologically prepared for *no* exam? How do they remain 'caught off guard' by an event they've logically ruled out?"

  2. **The Illicit Slide (De Dicto/De Se)**
  You argue the paradox relies on sliding between readings of 'surprise'. I want to pin down the mechanism. Are you locating the equivocation in a *de dicto*/*de se* distinction? Specifically, is the student moving illicitly from 'There is no day such that I know the exam is on that day' to 'For any day, I know the exam is not on that day'?

  *   **Follow-up:** If she confirms this scope shift is the culprit: "Does the student's reasoning *require* the teacher's announcement to be a prediction about the student's mind to get that scope shift off the ground? If it's just a commitment, does the slide disappear entirely?"

  3. **Commitment vs. Prediction (Unfalsifiability)**
  You insist the teacher's announcement is a commitment to future behaviour, not a prediction of the student's epistemic state. If it's a commitment, does that render the announcement unfalsifiable? If the teacher gives the exam on Friday and the student deduced it, hasn't the teacher broken their commitment to surprise, making the announcement false?

  *   **Follow-up:** If she says the teacher can simply choose not to examine to keep the commitment true: "Doesn't that turn the announcement into a threat ('I will surprise you or I won't test you at all') rather than a statement of fact about the week's schedule?"

  4. **The Last Day Scenario**
  Let's pressure that commitment reading. It's Thursday night. The student knows the exam must be Friday. The teacher is committed to 'surprise' (on your psychological reading). If the teacher gives the exam Friday, the student isn't psychologically surprised. If the teacher doesn't, there is no exam. How does the commitment view resolve this specific deadlock without conceding to the backward induction?

  *   **Follow-up:** If she says the teacher just accepts they can't test on Friday: "So the student's induction *does* successfully rule out Friday, just not for the reasons Quine or Shawfield thought? Are you rehabilitating the student's conclusion while rejecting their reasoning?"

  5. **The Dunce and the Logician**
  Here's an awkward consequence. If surprise is a matter of what the particular student can deduce, the announcement 'There will be a surprise exam' looks true for the class dunce (who can't deduce anything) and false for the star logician (who can). Do you bite this bullet and accept the truth value of the announcement is relative to the audience's cognitive power?

  *   **Follow-up:** If she bites the bullet (yes, it's relative): "Does that mean the teacher makes a true statement at 9 AM, but if a transfer student with superior logic skills joins at 10 AM, the teacher's statement retroactively becomes false? How do you handle that instability?"

  6. **The Centipede Analogy**
  You've described the paradox as 'the Centipede Game in school uniform'. In Centipede, two players alternate moves with increasing payoffs, relying on common knowledge of rationality. What is the precise structural isomorphism here? Who is making the moves, and what constitutes the 'payoff' for the teacher and the student?

  *   **Follow-up:** If she says the payoff is 'surprise' vs 'deduction': "In Centipede, a player can choose to stop the game to maximize payoff. What is the student's equivalent move to 'stop the game' and force the teacher's hand before Friday?"

  7. **Breaking the Analogy**
  Where does the Centipede analogy break down? In Centipede, backward induction suggests the game should end immediately, yet players often cooperate. In the Surprise Exam, the backward induction suggests the exam *can't* happen, yet teachers give them all the time. Is the disanalogy that the teacher in SEP has unilateral control over the 'board', whereas Centipede players do not?

  *   **Follow-up:** If she agrees the teacher has unilateral control: "If the teacher has unilateral control, isn't the problem simply one of *trust* rather than logic? Does your solution ultimately reduce the paradox to a problem of credibility rather than epistemology?"

  8. **The Knowledge Condition**
  Standard formulations require the student to *know* the announcement is true. If the announcement is a commitment, can the student 'know' it in the same way? Or are they merely believing a promise? If they only believe it, does the backward induction lose the premise it needs to start?

  *   **Follow-up:** If she says they only believe it: "If the student doesn't know the announcement is true, the paradox dissolves trivially. Are you arguing the paradox is only paradoxical if we mistakenly treat a promise as a known fact?"

  9. **Falsification**
  Finally, what would count against your position? If you're distinguishing two senses of surprise to dissolve the tension, I need to know what empirical or logical evidence would force you to concede that the 'indeducibility' reading actually *does* entail the 'psychological' one.

  *   **Follow-up:** If she reaches for "That would just be a different sense of surprise": "I'm pressing you on this: if you define the terms so that they can't interact, isn't the theory immune to critique by stipulation? What observable scenario—perhaps a specific classroom experiment—would prove your distinction wrong?"

  10. **Broader Implications**
  If you're right, and the Surprise Exam is really a confusion about speech acts (commitments vs. predictions) masked as an epistemic paradox, does this bleed into other areas? Are there other 'paradoxes of knowledge'—like the Preface Paradox or Lottery Paradox—that you suspect are actually manufactured by similar slides between normative commitments and descriptive predictions?

  *   **Follow-up:** If she sees a connection: "Does this suggest a broader project of 'dissolving' epistemology into philosophy of language? Are you arguing that most epistemic paradoxes are just linguistic confusions in disguise?"
