answer: |-
  Here is the translation and residue report, piece by piece, in the vocabulary of deployment, bytecode, and state transitions.

  ### Part 1: The Translation Table

  **1. The Player's Program**
  *   **Theory:** A Turing-complete function $P$ submitted to the referee.
  *   **Contract Vocabulary:** A **Deployed Contract** (specifically, the runtime bytecode).
  *   **Nuance:** It is not the Solidity source. It is not the ABI. It is the immutable code at a specific address. The "strategy" is encoded in the logic of the `fallback` or specific entry points.

  **2. The Referee**
  *   **Theory:** A trusted entity that runs $P_1(P_2)$ and $P_2(P_1)$ and distributes payoffs.
  *   **Contract Vocabulary:** The **EVM + The Block Producer**.
  *   **Nuance:** The EVM executes the logic (the `CALL` or `STATICCALL`). The Block Producer (miner/validator) orders the transactions and finalizes the state transition (the "payoff" distribution). Crucially, the EVM does not care about "payoffs" (utility); it cares about state validity.

  **3. Reading the Opponent's Source**
  *   **Theory:** $P_1$ receives the source code of $P_2$ as input.
  *   **Contract Vocabulary:** **`EXTCODECOPY`** or **`EXTCODEHASH`**.
  *   **Nuance:** You cannot read "source." You read runtime bytecode. You cannot read the constructor arguments used to deploy it (unless they were emitted in an event or stored in a known slot). You are inspecting the *behavioral fingerprint*, not the intent.

  **4. The Equilibrium Condition**
  *   **Theory:** A pair $(P_1, P_2)$ where neither player gains by submitting $P'_1$ given $P_2$ is fixed.
  *   **Contract Vocabulary:** A pair of **Deployed Addresses** $(A_1, A_2)$ where neither deployer would have saved gas or extracted more value by deploying a different bytecode to a different address, given the other address exists.
  *   **Nuance:** In contracts, this is usually a **Nash Equilibrium in Deployment Strategy**. It implies that once deployed, neither user has a profitable transaction they can send to their own contract to change the outcome, assuming the other contract stays static.

  **5. The Clone Recipe ("Cooperate if Identical")**
  *   **Theory:** `if (input_code == my_code) return COOPERATE else return DEFECT`.
  *   **Contract Vocabulary:** `require(EXTCODEHASH(msg.sender) == EXTCODEHASH(address(this)))`.
  *   **Nuance:** This is the "Mirror Pattern." If I am a vault, I only release funds to a contract that is a byte-for-byte copy of myself. This ensures that only an entity willing to lock themselves into the exact same ruleset can access the funds.

  **6. The Folk Theorem Result**
  *   **Theory:** Any feasible payoff better than minimax is achievable in one shot.
  *   **Contract Vocabulary:** **Arbitrary Logic Encoding**.
  *   **Nuance:** In contracts, this is trivialized. You don't need an equilibrium theorem to achieve a specific payout; you just `transfer` the ETH in the constructor logic. The "Folk Theorem" in contracts translates to: "Any distribution of funds that is computationally verifiable can be hardcoded."

  ---

  ### Part 2: The Residue Report

  Here is where the mapping breaks, fudges, or inverts.

  #### 1. The Enforcer Inversion (Your Suspicion)
  **Verdict:** You are correct. The mapping inverts at the critical point.

  *   **Theory:** The Referee is **passive**. It runs code but does not enforce the *agreement*. The enforcement comes from the *structure of the programs themselves*. If I deviate, your program punishes me. The trust is in the math of the equilibrium, not the referee.
  *   **Contracts:** The EVM is **active**. It enforces the *state transition*. If I try to withdraw more than my balance, the EVM reverts the transaction regardless of what the other contract does.
  *   **The Cost:** Program Equilibrium buys you **coordination without a trusted third party**. Smart Contracts buy you **execution without a trusted third party**.
      *   In the theory, the "Prisoner's Dilemma" still exists; the programs just solve it.
      *   In contracts, the "Prisoner's Dilemma" is **abolished** by the code. You cannot defect if the code makes defection revert.
      *   **What the construction buys that contracts don't:** Program Equilibrium allows two *independent* agents to cooperate when they cannot agree on a *shared* contract. In your world, you usually deploy *one* escrow contract that both trust. In the theory, they deploy *two* contracts that trust each other. This matters in cross-chain or cross-DAO scenarios where a single shared state is impossible.

  #### 2. Deployment Ordering and Cost
  **Verdict:** The "Simultaneous Move" assumption is the biggest fudge.

  *   **Theory:** $P_1$ and $P_2$ are submitted simultaneously. Neither sees the other before committing.
  *   **Contracts:** Deployment is **sequential**. Tx1 deploys $A_1$. Tx2 deploys $A_2$. The deployer of $A_2$ sees $A_1$'s bytecode before deploying.
  *   **The Exploit:** The second mover can write a "Counter-Contract" specifically designed to pass $A_1$'s checks while retaining an exploit (e.g., a reentrancy hook hidden in a fallback that $A_1$ didn't anticipate).
  *   **The Fix:** You need a **Commit-Reveal Scheme** on top of the deployment.
      1.  Commit: `hash(bytecode + salt)` posted on-chain.
      2.  Reveal: Deploy contract, submit salt.
      3.  Verify: Check `hash(deployed_bytecode + salt) == commit`.
  *   **Simulation Cost:** Theory assumes free inspection. On-chain, `EXTCODECOPY` costs gas. If the "Program Equilibrium" requires running the opponent's logic (simulating their move), you hit the **block gas limit**. You cannot simulate a full Turing-complete opponent inside a transaction. You can only check static properties (hashes, storage roots).
  *   **Conclusion:** "Hash-committed to code identical to mine" is the only viable counterpart. Full logical simulation is too expensive and hits recursion depth limits.

  #### 3. Whitespace and Bytecode Fragility
  **Verdict:** This is **more fragile** in practice, but it is a **security feature**, not a bug.

  *   **Theory:** One space character breaks cooperation. This is seen as a flaw (brittleness).
  *   **Contracts:** One byte difference changes the `EXTCODEHASH`.
  *   **Why it bites you:** Compiler versions, optimizer settings, and **metadata hashes** (IPFS/Swarm hashes of the source appended to bytecode) mean two developers compiling the "same" Solidity file will produce *different* bytecode.
  *   **The Call:** In Program Equilibrium theory, this fragility is a coordination failure. In Smart Contracts, this fragility is **Authenticity**.
      *   If you allow "semantic equivalence" (e.g., "if logic is roughly the same"), you open a vector for an attacker to submit a contract that *looks* the same but has a backdoor.
      *   **Residue:** To make this work on-chain, you must standardize the **Build Pipeline**. You aren't just agreeing on code; you are agreeing on compiler version, flags, and metadata stripping. If you don't, the "Clone Recipe" fails not because of game theory, but because of CI/CD drift.

  ---

  ### Part 3: The Final Call

  **Is this a gap in your vocabulary, or is the theory doing less work than it looks?**

  It is **not** a gap in your vocabulary. Your intuition that "contracts borrow the chain's enforcement" is the correct lens.

  **Program Equilibrium** is a solution to the **Commitment Problem**: "How do I prove to you I will stick to this strategy when there is no one to stop me from lying?"
  **Smart Contracts** are a solution to the **Enforcement Problem**: "How do we ensure the strategy is executed exactly as written?"

  When you implement a "Clone Recipe" (`if codehash == my_codehash`) in Solidity, you are using the **Enforcement** (EVM) to solve the **Commitment** (Program Equilibrium).

  **The Verdict:**
  The theory describes how to build a **virtual enforcer** out of code logic when no physical enforcer exists.
  You work in an environment where the **physical enforcer** (the consensus network) already exists.

  Therefore, applying Program Equilibrium directly to smart contracts is often **redundant overhead**, *unless* you are in a specific niche:
  1.  **Cross-Chain/Off-Chain Coordination:** Where the EVM cannot see the other party's state (e.g., Ethereum contract coordinating with Solana contract). Here, you *need* the Program Equilibrium logic because the "Referee" is broken.
  2.  **Governance/DAO Mergers:** Where two DAOs want to merge treasuries but neither wants to trust the other's multisig. They deploy "Mirror Vaults." This is pure Program Equilibrium.

  **Summary of the Inversion Cost:**
  The theory buys cooperation in a **hostile environment** (no referee power).
  You build in a **cooperative environment** (the chain enforces rules).
  If you use Program Equilibrium patterns on-chain, you are paying gas to solve a problem the chain already solved for you, *unless* the "game" is about **which contract to trust**, not **how to execute the transaction**.

  **Direct Answer to your Suspicion:**
  Yes, the mapping inverts. The theory assumes the referee *cannot* enforce the payoff, only compute it. The EVM *must* enforce the state change to function. Consequently, the "equilibrium" in your world is not about finding a stable strategy pair, but about **hardcoding the desired outcome into the state transition function**. The theory is about *strategy selection*; your job is about *mechanism design*. They are orthogonal. The "Clone Recipe" works on-chain not because it creates an equilibrium, but because it acts as a **permissioning check** enforced by the EVM.

  **Final Residue:**
  The "Folk Theorem" result is the biggest illusion. In theory, it says "any payoff is possible." In contracts, it says "any payoff is possible *if you can code it*." The constraint isn't game theory; it's **complexity and gas**. The theory hides the cost of computation; your reality is defined by it. The construction works, but it's expensive, brittle to compiler versions, and sequential deployment requires commit-reveal schemes to prevent second-mover advantage. It is not a magic bullet for cooperation; it is a specific pattern for **mutual authentication via bytecode identity**.
