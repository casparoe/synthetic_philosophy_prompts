  The branches

  The taxonomy proceeds from the definition of violence to the scope of agency, then to the moral structure. It is designed to isolate specific commitments rather than historical labels. Students should answer based on intuition.
  1. **Violence Scope:** Does the prohibition cover only killing, or any use of force? This determines whether non-lethal physical defense remains an option for the agent. It decides if pushing an attacker away is forbidden.
  2. **Agent Scope:** Does the rule bind only private individuals, or also state officials acting in office? This separates personal moral purity from political responsibility regarding defensive wars. It asks if a president may order strikes.
  3. **Modal Status:** Is abstaining from violence merely permissible, morally obligatory, or a supererogatory ideal? This distinguishes what you may do from what you must do, affecting blame. It determines if violence is a sin or a failure of heroism.
  4. **Grounding:** Is the wrongness located in the act itself, the intention to harm, or the corruption of the agent's soul? This shifts focus from external outcomes to internal integrity and virtue. It asks whether consequences matter for the judgment.
  5. **Complicity:** Is the goal keeping one's own hands clean, or ensuring the world's ledger of violence is minimized? This splits instrumental pacifism from consequentialist reductionism regarding third-party defense. It tests if hiring a bodyguard is allowed.
  6. **Participation:** Is the stance a personal constraint or a refusal to sustain a shared violent practice? This tests consistency on indirect involvement like taxation or hiring bodyguards. It asks if paying taxes for war is complicity.

  The leaves

  1. **Absolute Pacifism:** All violence is forbidden regardless of consequence, implying one must die rather than kill even to save innocents, which cannot accommodate the defense of third parties without contradiction and demands total passivity in the face of evil even when intervention could save lives.
  2. **Conditional Pacifism:** Violence is forbidden unless necessary to prevent greater violence, collapsing into just war theory under pressure, which struggles to define the threshold where violence becomes permissible and risks permitting too much violence eventually.
  3. **Contingent Pacifism:** Modern wars are always unjust, requiring the awkward claim that no future war could ever be justified, relying on empirical claims that may become false and tying morality to contingent historical facts.
  4. **Private Pacifism:** Individuals must not kill but states may, creating a moral schism between citizen and official roles, suggesting morality changes when one puts on a uniform and creating a dual ethics system.
  5. **Political Pacifism:** States must not wage war even if individuals may defend themselves, leaving citizens unprotected by their government, demanding the state absorb violence without reciprocating and risking national suicide while maintaining moral purity.
  6. **Clean Hands Pacifism:** One must not be the instrument of harm, allowing one to hire a bodyguard to kill while remaining pure, prioritizing personal integrity over the victim's survival and permitting outsourcing violence to others who bear the moral burden instead.
  7. **Clean Ledger Pacifism:** Total violence must be minimized, requiring one to kill personally if it prevents others from killing more, risking becoming a calculus that permits significant violence and may demand killing for peace.
  8. **Virtue Pacifism:** Violence corrupts the soul, implying that killing in self-defense is spiritually worse than being murdered, valuing the agent's character over the victim's life and being self-regarding rather than other-regarding.
  9. **Deontological Pacifism:** Killing is intrinsically wrong, meaning the moral status of the act ignores the victim's right to life, treating the prohibition as a rule rather than a harm prevention and remaining rigid against consequences.
  10. **Supererogatory Pacifism:** Nonviolence is saintly but not required, suggesting those who fight are morally adequate rather than wrong, removing the moral force to condemn war and making pacifism optional for agents.
  11. **Non-lethal Pacifism:** Killing is forbidden but force is allowed, requiring a bright line between bruising and breaking bones, facing the problem of accidental lethality in defense and being hard to enforce practically.
  12. **Complicity Pacifism:** Funding violence is tantamount to doing it, requiring total withdrawal from society to avoid tax-funded war, making ordinary citizenship morally impossible and demanding economic isolation from the state even if it means poverty.

  Empty branches

  **State-Only Individualism:** A view binding officials to nonviolence while permitting private citizens to kill is virtually nonexistent. It is unattractive because it disarms the state while leaving violence privatized and unregulated. It creates a power vacuum.
  **Obligatory Clean Hands:** Claiming one must keep hands clean but may let the ledger fill with blood is incoherent. It treats integrity as a duty while ignoring consequences entirely, creating a moral blind spot. It is selfishly consistent.
  **Supererogatory Tax Resistance:** Holding that paying war taxes is permissible but refusing is saintly is unexplored. It lacks motivation since the complicity claim usually drives obligation rather than optional heroism. It is unstable.
  **Lethal-Only Prohibition:** Forbidding killing but allowing torture is logically possible but morally repugnant. No pacifist occupies this branch because it violates the core spirit of nonviolence and respect. It is abhorrent.

  Pairs it can't separate

  **Contingent Pacifism and Just War Theory:** Both may oppose all current wars, differing only on the possibility of future justification. The tree cannot separate them without empirical data on future conflicts.
  **Clean Ledger and Utilitarianism:** Both minimize total violence, differing only in rhetorical framing. The decision tree treats them identically regarding third-party defense outcomes.
  **Virtue and Deontological Pacifism:** Both forbid killing based on agent-focused reasons, differing only on metaphysical grounding. The practical verdicts on self-defense remain indistinguishable in most cases.
