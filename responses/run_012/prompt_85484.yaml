      The standard ontological claim regarding video game entities is straightforward: they possess no welfare. The colossi in this game are arrangements of code and texture maps; they have no interests, no capacity for suffering, and no continuity of existence outside the simulation. To ask if they are wronged is to category-mistake data for life. This conclusion must be stated clearly and accepted. However, accepting that nothing is harmed within the fiction does not explain the profound moral unease the game generates in those who play it. This unease suggests that moral bookkeeping operates on two distinct ledgers. The first is the ledger of the fiction, where ex hypothesi no one is wronged because no one exists to bear the wrong. The second is the ledger of the player, where what is at stake is not the welfare of a character but the conduct of the human operator. A serious reading must determine which ledger the game actually draws upon and whether it can engage the second without smuggling the first back in.

      The game dramatizes the possibility of wrongless wrongs. If cruelty or desecration can be wrong in themselves, constituted by the act rather than suffered by a victim, then the emptiness of the fiction ledger becomes irrelevant. The game posits a class of acts a person should not perform even in a world where nothing is at stake but herself. Here, the complicity mechanic is central. The fiction marks the destruction of the colossi as transgressive—they are monumental, often passive, and their death releases a corrupting substance—yet the game requires this destruction to proceed. There is no branch, no refusal, and no in-fiction excuse that absolves the agent. The player is placed in a laboratory of agency where the only variable is their own willingness to perform the act. By making the player the sole locus of the act, the game tests whether moral resistance persists when the consequences are虚构 (fictional) and the necessity is artificial.

