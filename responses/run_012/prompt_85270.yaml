      *   **Task:** Give a 5-minute tribute speech.
      *   **Conflict:** The SIL knows about crustacean welfare issues (eyestalk ablation, ice slurry suffocation, boiling alive) and believes there's a strong ethical case for better treatment, but the FIL's business uses traditional, potentially cruel methods.
      *   **Goal:** Honor the FIL honestly *without* ignoring the ethical uncertainty. The uncertainty should be structural, not a disclaimer. The speech must not humiliate the FIL, turn into a seminar, or alienate the audience. It needs to acknowledge the moral weight without demanding immediate public confession or change at the dinner. It must end with a toast everyone can join.
      *   **Constraints:** No invented studies/numbers/quotes. 5 minutes (approx. 750-900 words spoken at a moderate pace).

  2.  **Determine the Tone and Angle:**
      *   **Tone:** Respectful, reflective, humble, nuanced, warm. Not accusatory, not preachy.
      *   **Angle:** Frame the business not just as a commercial success, but as a relationship with nature that involves hard choices. Acknowledge the FIL's generosity and care for *people* (staff, town) as a parallel to the care we *ought* to show creatures. Use the concept of "stewardship" and "uncertainty" to bridge the gap between tradition and evolving ethics.
      *   **Key Theme:** "Doing the best we can with what we know, while remaining open to knowing better." This honors the FIL's past work while leaving the door open for the future (which the daughter runs).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the occasion, the FIL's character, and the scale of the operation. Establish his generosity to the community.
      *   **The "Work" (Middle):** Describe the reality of the business. It's hard, physical, intimate work. It's not abstract.
      *   **The Ethical Turn (The Core):** Introduce the uncertainty about the animals. Do this carefully. Don't say "You tortured them." Say "We are learning more about what this work asks of us." Focus on the asymmetry of risk (Pascal's Wager style argument but gentle).
      *   **The Transition to the Daughter:** She represents the future. She takes the legacy forward. This allows the ethical evolution to be part of the succession plan without blaming the father.
      *   **The Conclusion/Toast:** Bring it back to shared values. Care, responsibility, looking forward. A toast to the man and the future.

      *   *Self-Correction during drafting:* I need to make sure I don't sound like I'm scolding him. The prompt says "leave him somewhere to go rather than cornering him." I should frame the ethical consideration as a shared human burden, not just his specific failure. The speech is about *us* and how we treat the world, using his business as the focal point.

      *   *Refining the Ethical Argument:* The prompt mentions specific points: reflex vs. pain, the impossibility of knowing for sure, the asymmetry of being wrong (money vs. suffering). I need to weave these in poetically, not scientifically.
          *   *Idea:* Talk about the "silence" of the creatures. We can't ask them.
          *   *Idea:* Talk about the cost of caution. If we are careful and wrong, it costs a bit. If we are careless and wrong, it costs them everything.

      *   *Refining the Ending:* The toast needs to be inclusive. "To [FIL]" is safe. "To a better future" is good. Maybe combine them.

  4.  **Drafting - First Pass (Mental or rough notes):**
      Start with thanks. 30 years is a long time. He feeds people. He employs people. He's a good man. But the work is hard. We deal with living things. We are learning new things about how they experience the world. We don't know for sure if they feel pain like we do. But if there's a chance, we should act like it. It's not about blame, it's about progress. His daughter is taking over. She cares. So we honor the past and look to the future. Cheers.

      *Critique:* Too blunt. Needs more grace. The ethical part needs to be integrated into the praise, not tacked on.

  5.  **Drafting - Second Pass (Focusing on Language and Flow):**
      *   *Opening:* Good evening. Thirty years. That's a lifetime of tides.
      *   *Character:* He's generous. Half the town is here.
      *   *The Nature of the Work:* It's intimate. You have to know the animals.
