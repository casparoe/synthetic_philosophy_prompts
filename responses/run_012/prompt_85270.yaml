answer: |-
  Good evening, everyone.

  For those who don't know me, I'm [Your Name]. I married into this family, and by extension, I married into this business. Thirty years is a long time to do anything. It's long enough to forget when you started, long enough for the work to become part of your hands, part of your voice, part of how you walk.

  We are here to honor [Father-in-Law's Name]. And looking around this room, you see the evidence of the man. Half the town is here. Staff who have been with him since the beginning, buyers who trust his word, neighbors who know that if their truck breaks down, he's the one with the jumper cables. He is decent. He is generous. He has spent three decades pulling livelihoods out of the water to support families on land. That is a legacy of care.

  But if you know this business, you know it isn't just about ledgers and logistics. It is an intimate relationship with living things. It requires you to know the life you are handling. And because I am family, and because I respect [Father-in-Law's Name] enough to be honest in his house, I want to touch on the weight of that relationship.

  For thirty years, [Father-in-Law's Name] has operated by the knowledge available to him. He has done what was required to keep the ponds running and the staff paid. But those of us who work closest to the water know there is a silence there. We work with creatures that cannot speak to us. We cannot ask them what the experience is like. We cannot run the experiment that tells us for certain where a reflex ends and a feeling begins.

  We are left with a guess.

  And like any guess worth making, it carries a cost. If we assume they feel nothing, and we are right, we save time and money. We keep the habits we inherited. But if we assume they feel nothing, and we are wrong, the cost is paid in suffering. On the other side, if we assume they feel, and we are wrong, the cost is paid in effort. In changing habits. In spending a little more to ensure a quicker end.

  Those two costs are not the same size.

  I don't say this to judge the past. Stewardship is not about being perfect; it is about paying attention. It is about looking at what you hold in your hands and asking, "Is there a better way to carry this?" [Father-in-Law's Name] asked that question every day about his people. He built a place where people were looked after. That same instinct for care is the bridge to the future.

  That future is in good hands. [Daughter's Name] has been running the hatchery with a pride and precision that honors everything her father built. She knows the biology better than anyone. She also knows that the world is listening more closely to that silence in the water than it used to. She understands that tradition is a foundation, not a fence. It supports you, but it doesn't have to confine you.

  So, this retirement isn't just a celebration of what has been finished. It is a handover. It is an acknowledgment that we can honor the provider by caring for the provision. We can respect the thirty years of hard work by being willing to learn what the next thirty years might require.

  [Father-in-Law's Name], you taught us that a business is only as good as the people it sustains. Tonight, we raise a glass to the man who sustained us. And we look forward to a future where that circle of care widens, as our knowledge grows, and as we find the courage to pay the smaller cost to avoid the greater risk.

  To [Father-in-Law's Name]. To [Daughter's Name]. And to the work that cares for what it touches.

  Cheers.
