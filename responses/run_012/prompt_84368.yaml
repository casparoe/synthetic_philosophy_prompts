answer: |-
  # JOINT STATEMENT ON THE STATUS AND SCOPE OF THE CHURCH–TURING THESIS

  **Signatories:** The Conceptualist Working Group & The Empiricist Working Group
  **Date:** October 2023
  **Subject:** Clarification of Disagreements Regarding Computability and Physical Law

  ## 1. AGREED CLAIMS

  Both camps affirm the following propositions as settled matter, distinguishing mathematical theorem from philosophical interpretation:

  1.  **Formal Equivalence:** It is a proven mathematical theorem that the standard formalisms of computation (Turing machines, lambda calculus, general recursive functions, register machines, etc.) define the exact same class of functions. Disagreement regarding the Church–Turing Thesis (CTT) does not concern this equivalence.
  2.  **Scope of the Thesis:** Both camps agree that the CTT asserts a relationship between a formal class of functions (the Turing-computable) and an informal class of processes (the "effectively calculable" or "physically realizable"). The disagreement concerns the definition of the informal class.
  3.  **Limitation of Proof:** Both camps agree that the CTT cannot be proven mathematically, as it bridges formal mathematics and an informal notion (either conceptual or physical).
  4.  **Mutual Concessions:**
      *   **Conceptualists concede** to Empiricists: If a physical process reliably produces outputs corresponding to a non-Turing-computable function, and this reliability is grounded in well-confirmed physical law, the *concept* of "effective procedure" may require revision to accommodate physical reality.
      *   **Empiricists concede** to Conceptualists: Any claim of hypercomputation (computation beyond Turing limits) requires a description of the input/output procedure that is itself intelligible to human investigators. If the input or output cannot be specified or read by an effective procedure, the claim of "computation" loses its operational meaning.

  ## 2. PRECISE STATEMENT OF DISAGREEMENT

  The residual disagreement is isolated to the modality of the term "effective procedure" within the thesis statement.

  *   **The Conceptualist Position:** The CTT is a thesis about **idealized human calculability**. It asserts: *"Every function that can be computed by a human following a definite, finite method (idealized for time and memory but not for logical structure) is Turing-computable."* On this view, the thesis is a piece of conceptual analysis. It is not falsifiable by physics, because a physical process that violates Turing limits would, by definition, not qualify as an "effective procedure" in the relevant sense.
  *   **The Empiricist Position:** The CTT is a thesis about **physical computability**. It asserts: *"Every function that can be computed by a physically realizable system in our universe is Turing-computable."* On this view, the thesis is a contingent law of nature. It is falsifiable by physics; if a machine can be built that computes a non-Turing-computable function, the thesis is false, regardless of whether that machine fits the historical concept of "human calculation."

  **The Core Conflict:** Whether the boundary of computation is drawn by the logical requirements of *description and verification* (Conceptualist) or by the *causal capacities of the physical world* (Empiricist).

  ## 3. CRUXES AND PREDICTIONS

  The following sub-questions represent the points where evidence could shift the consensus. Both sides agree on the nature of the evidence required, though they differ on its likelihood and interpretation.

  | Crux | Question | Agreed Test / Evidence | Conceptualist Prediction | Empiricist Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | **The Verification Gap** | Can a hypercomputational output be independently verified by a Turing-bounded observer? | **No.** Verification requires an effective procedure; if the output is non-Turing-computable, no effective procedure can verify it. Therefore, the claim is incoherent. | **Yes (in principle).** Verification may rely on physical theory (e.g., General Relativity) rather than algorithmic check. We can trust the physics even if we cannot algorithmically check the math. |
  | **B** | **Idealization Limits** | Does "computation" permit infinite steps in finite time (supertasks)? | **No.** An effective procedure must consist of a finite number of steps at any given stage. Supertasks violate the concept of a "step." | **Yes.** If physics permits a trajectory with an infinite number of causal events in finite proper time, it counts as computation. |
  | **C** | **Continuous Information** | Can a physical parameter encode unbounded information (infinite precision)? | **No.** Reading a parameter is a measurement process, which is discrete and finite. Infinite precision is not effectively readable. | **Yes.** If physical laws allow continuous states with infinite precision, and we can couple them to discrete inputs/outputs, information density is not bounded by Turing limits. |

  ## 4. NOTE ON VERBAL DISPUTE

  A significant portion of the conflict is verbal, turning on the referent of the phrase "Church–Turing Thesis."

  *   If the name refers to **CTT-Effective** (about algorithms/human calculation), the Conceptualists are correct: the thesis is a robust conceptual analysis, largely immune to empirical refutation.
  *   If the name refers to **CTT-Physical** (about what the universe can do), the Empiricists are correct: the thesis is a bold empirical hypothesis, vulnerable to discovery in theoretical or experimental physics.

  **Recommendation:** Future literature should distinguish between **CTT-Effective** and **CTT-Physical**. Most mathematical disputes vanish when this distinction is enforced. The remaining dispute is whether *CTT-Physical* deserves the prestige of the name "Church–Turing Thesis" or should be termed the "Physical Computability Hypothesis."

  ***

  ## 5. ASSESSMENT OF SPECIFIC PROPOSALS

  Both camps have reviewed two specific classes of proposed hypercomputation. The following details the shared description, the requirements for acceptance as a counterexample, the respective verdicts, and the assessment of coherence.

  ### Proposal A: The Accelerating Machine (Zeno Machine)
  *   **Description:** A device that performs step $n$ in time $1/2^n$. It completes an infinite sequence of steps within one second of external time and displays a result at $t=1$.
  *   **Requirement for Counterexample:** The device must be physically constructible, and the result displayed at $t=1$ must be readable and verifiable as the solution to a non-Turing-computable problem (e.g., the Halting Problem).
  *   **Conceptualist Verdict:** **Not a Counterexample.** An "effective procedure" requires that each step be discrete and that the procedure be surveyable. A supertask is not a procedure; it is a physical trajectory. The "result" at $t=1$ is not the output of a computation but a boundary condition of a physical system.
  *   **Empiricist Verdict:** **Potential Counterexample.** If General Relativity permits spacetimes (e.g., Malament-Hogarth spacetimes) where an observer can receive signals from an infinite past worldline in finite proper time, this constitutes a physical computation.
  *   **Coherence Check:**
      *   *Conceptualist on Empiricist:* Incoherent. You cannot verify the output without an effective procedure. If you claim the output is "the answer," you must describe how you read it. If reading it is effective, the function was Turing-computable.
      *   *Empiricist on Conceptualist:* Overly restrictive. You are defining computation by human limitations rather than physical possibility. We can verify the output by trusting the physical theory that predicts the machine's behavior, even if we cannot simulate the machine.

  ### Proposal B: The Analog Hypercomputer
  *   **Description:** A device where the answer is encoded in a continuous physical parameter (e.g., voltage, position), assuming the parameter can hold unbounded information via infinite precision.
  *   **Requirement for Counterexample:** Demonstration that the device can distinguish between two values of the parameter that differ by less than any Turing-machine specifiable bound, and that this distinction determines the output of a non-Turing-computable function.
  *   **Conceptualist Verdict:** **Not a Counterexample.** Measurement is a discrete act. To "read" the answer is to map the continuous value to a discrete symbol. This mapping is itself an effective procedure. If the mapping is effective, the function is Turing-computable. Infinite precision is not physically readable.
  *   **Empiricist Verdict:** **Potential Counterexample.** If physical laws are continuous and deterministic, and noise can be suppressed below arbitrary thresholds, the universe supports infinite information density. The limit is engineering, not logic.
  *   **Coherence Check:**
      *   *Conceptualist on Empiricist:* Incoherent. You claim the device computes, but you cannot confirm the value it holds without a measurement process. That measurement process is the real computer. If the measurement is finite-precision, the device is Turing-equivalent. If it is infinite-precision, you cannot report the result.
      *   *Empiricist on Conceptualist:* Coherent but skeptical. We admit we cannot *check* the answer algorithmically. However, we can confirm the device works by confirming the physical theory that governs it. If the theory says the voltage encodes $\pi$, and our theory is confirmed to high precision, we accept the computation.

  **Final Joint Note on Verification:**
  Both camps acknowledge a critical bottleneck: **The Empiricist cannot empirically confirm a hypercomputational output without relying on physical theory rather than algorithmic verification.** The Conceptualists argue this reduces the claim from "computation" to "physical prediction." The Empiricists argue that since all computation is ultimately physical, "physical prediction" is the only foundation computation ever had. This remains the final, unresolved boundary.
