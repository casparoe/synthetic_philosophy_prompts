answer: |-
  **Introduction: The Framework of *What Is Art?***

  To reconstruct Leo Tolstoy's verdict on these modern phenomena, we must anchor ourselves in the text of *What Is Art?* (1897). His definition is specific: art is a human activity in which one man consciously, by means of certain external signs, hands on to others feelings he has lived through, and others are infected by these feelings and experience them.

  Three criteria determine the quality of this transmission:
  1.  **Individuality:** The feeling must be distinct.
  2.  **Clarity:** The expression must be intelligible.
  3.  **Sincerity:** The artist must feel the emotion they convey (the most important condition).

  Furthermore, Tolstoy posits a historical metric: the value of art is determined by the "religious consciousness of the age." In his view, the Christianity of his time demanded universal brotherhood; therefore, true art must unite all men, not merely please a privileged class.

  In the analysis below, I distinguish between **textual commitments** (claims explicitly supported by *What Is Art?*), **scholarly contention** (where interpreters disagree on the rigidity of his claims), and **extrapolation** (where I apply his logic to situations he could not have envisaged).

  ***

  ### 1. Instruction-Based and Conceptual Art
  *The Case: Works defined by written instructions (e.g., Sol LeWitt), where the conceiver does not execute the work, and the executor feels nothing.*

  **Tolstoy's Likely Verdict:** Predominantly Counterfeit Art.

  **Reasoning:**
  Tolstoy draws a sharp distinction between the artist and the craftsman. In his view, the craftsman executes the will of another, while the artist originates the feeling. In the case of instruction-based art, the conceiver occupies the role of the artist, and the wall-drawer the role of the craftsman. Textually, Tolstoy accepts this division; he acknowledges that a composer does not need to play every instrument, nor a poet write every copy.

  However, the verdict hinges on **sincerity** and the **nature of the feeling**. Tolstoy explicitly rejects art that appeals primarily to the intellect rather than the emotions. He writes that "art which transmits thoughts... is not art." Conceptual art often privileges the idea (the instruction) over the sensory emotional experience. If the work is an intellectual puzzle rather than a transmission of feeling, Tolstoy is textually committed to classifying it as non-art or bad art.

  Furthermore, consider the **clarity** criterion. Tolstoy demanded that art be accessible to the uncorrupted peasant. Instruction-based art often relies on art-historical context to be understood. If the viewer requires a catalogue essay to grasp the "feeling," it fails the clarity test.

  **Epistemic Status:**
  *   **Textual Commitment:** Tolstoy is explicit that art must transmit *feeling*, not *thought*. If the instruction is purely cognitive, it falls outside his definition.
  *   **Extrapolation:** Applying this to LeWitt requires assuming the "feeling" in such works is negligible. Some scholars argue minimalism evokes a feeling of order or presence. If one grants that the viewer *does* feel a distinct emotion (e.g., calm) intended by the conceiver, Tolstoy might concede it is art, provided the conceiver sincerely felt that calm.
  *   **Contention:** Knowledgeable readers disagree on how literally to take Tolstoy's dismissal of intellectual art. Some argue he allows for intellectual feelings; others argue he strictly bifurcates mind and heart. I prefer the stricter reading because Tolstoy consistently attacks the "upper-class" tendency to obscure meaning with complexity.

  **The Absurdity:**
  Here, Tolstoy's theory holds together without contradiction, but at the cost of excluding a major movement of the 20th century. He would likely view the separation of conception and execution as a symptom of the division of labour he despised, which fragments human unity. He would not be troubled by excluding this from "true art"; he would view its exclusion as proof of his theory's correctness.

  ***

  ### 2. Machine-Generated Content (AI)
  *The Case: Images or prose generated by a system from a prompt. The prompter may feel keenly, the machine feels nothing, the audience is moved.*

  **Tolstoy's Likely Verdict:** Counterfeit Art (a dangerous deception).

  **Reasoning:**
  This case presents the sharpest tension in Tolstoy's theory. His definition requires that the artist transmit feelings *he has lived through*.
  1.  **The Machine:** It has no inner life. It cannot "live through" anything. Therefore, it cannot be the artist.
  2.  **The Prompter:** Did they "live through" the feeling in the output? If I prompt "melancholy autumn," I may feel anticipation or curiosity, but I have not necessarily lived through the specific melancholy the image depicts. The image is a statistical aggregation of human signs, not a record of a specific human experience.
  3.  **The Audience:** They may be infected. They may feel melancholy.

  **The Conflict:**
  Tolstoy states that the *degree* of art is determined by the *degree* of infectiousness. If the audience is genuinely moved, the test of infectiousness is passed. However, the *definition* of art requires a human source of sincere feeling.
  Tolstoy is textually committed to the idea that counterfeit art can *mimic* the effects of true art. He argues that opera and Wagner's music often moved people, yet he labelled them counterfeit because the feeling was not sincere or clear, but manufactured for effect. He would likely categorise AI output similarly: it is a simulation of the signs of feeling without the reality. It is "amusement" designed to provoke a physiological response, not a spiritual transmission.

  **Epistemic Status:**
  *   **Textual Commitment:** Tolstoy insists on the moral agency of the artist. A being without a soul (the machine) cannot transmit religious consciousness or sincere feeling.
  *   **Extrapolation:** I am extrapolating that Tolstoy would view the prompter as a consumer rather than an artist. If the prompter treats the machine as a brush, Tolstoy might ask: "Did you feel this specific image before it existed?" If the answer is no, sincerity is broken.
  *   **The Repellent Conclusion:** Here is where the theory strains. If we take "infectiousness" as the *sole* empirical mark of art (ignoring the origin), Tolstoy *would* be obliged to call moving AI output "art." This is a conclusion he would find repellent, as it severs art from moral responsibility. To avoid this, he must prioritise the *origin* (sincerity/lived experience) over the *effect* (infection).
  *   **Amendment:** To accommodate AI as art, one must amend the theory to remove the requirement that the feeling be "lived through" by the transmitter. This amounts to abandoning the core of Tolstoy's theory, which is fundamentally ethical, not aesthetic.

  ***

  ### 3. The Institutional and Market Setting
  *The Case: Museums, auction houses, algorithmic recommendation, global production.*

  **Tolstoy's Likely Verdict:** A Corrupt System Producing Mostly Counterfeit Art.

  **Reasoning:**
  This is the area where Tolstoy's text provides the strongest predictive power. He devoted significant portions of *What Is Art?* to attacking the institutions of his day: the Academies, the Conservatoires, and the patronage of the wealthy.

  1.  **The Market and Auction Houses:** Tolstoy argues that when art is paid for excessively, it becomes a commodity for the rich. He writes, "As soon as the artists... began to receive large payments, art... ceased to be the matter it had been." The auction house is the ultimate temple of this error, valuing art by price rather than by its capacity to unite men. He would view this as evidence that the work is intended for exclusivity, violating the requirement of universal accessibility.
  2.  **Museums:** Tolstoy viewed museums as graveyards where art is removed from the living context of religious life and placed on a pedestal for worship of the past. He would see the modern museum as a confirmation of his critique: art as a separate, specialised activity rather than a daily expression of life.
  3.  **Algorithms and Global Audience:** Tolstoy desired a global audience, but one united by "religious consciousness" (brotherhood). Algorithmic recommendation is designed to maximise engagement (pleasure/distraction), not moral unity. It fragments audiences into niches rather than uniting them in a common feeling.
  4.  **Production for a Global Market:** Tolstoy criticised art that was too complex for the peasantry. Modern global art is often tailored to the lowest common denominator of shock or pleasure to ensure marketability, or conversely, to such high levels of abstraction that it excludes the working class. Both fail his test.

  **Epistemic Status:**
  *   **Textual Commitment:** Extremely high. Tolstoy's critique of the "professionalisation" of art is central to his argument. He explicitly links the separation of art from life to the rise of payment and institutions.
  *   **Scholarly Contention:** Some readers argue Tolstoy's attack on institutions was rhetorical hyperbole intended to shock his contemporaries, not a literal blueprint for dismantling museums. Others take it as a sincere political programme. I side with the latter; his subsequent life (renouncing copyright, manual labour) confirms the sincerity of his institutional critique.
  *   **Extrapolation:** Applying his critique to *algorithms* is an extrapolation, but a safe one. Algorithms function as the ultimate "upper-class" critic, curating for pleasure and profit rather than religious truth.

  **The Absurdity:**
  There is no absurdity here for Tolstoy; the modern art world confirms his darkest prophecies. However, the absurdity lies in the implication of his solution. To fix this, Tolstoy implies we should dismantle the professional class of artists and return art to the people (folk art). In a globalised, complex economy, this is practically impossible. His framework offers no viable path for *professional* artists to operate ethically within a market economy, other than to cease being professionals. To accommodate the modern institution, one would have to abandon his rejection of payment and specialisation, which would collapse his distinction between "true art" and "counterfeit art."

  ***

  ### Conclusion: The Limits of the Theory

  Reconstructing Tolstoy's view reveals a theory that is remarkably robust against the **institutional** changes of the last century, but fragile against the **ontological** changes.

  1.  **On Institutions:** He is vindicated. The commodification and exclusivity he predicted have intensified. His framework requires no amendment here, only the courage to accept his radical conclusion: that most modern institutional art is not art at all, but a trade.
  2.  **On Conceptualism:** He holds firm, but at the cost of relevance. By excluding intellectual transmission, he excludes a vast swathe of modern human expression. To include it, one must amend the definition of "feeling" to include "intellectual realisation," which weakens his emotionalist core.
  3.  **On AI:** This is the breaking point. If infectiousness is the *test*, AI passes. If human sincerity is the *definition*, AI fails. Tolstoy would choose the definition. He would rather deny the title of "art" to a moving machine output than admit that art can exist without a moral soul.

  **Final Epistemic Note:**
  We must be careful not to treat Tolstoy's dismissals of Beethoven or Shakespeare as mere grumpiness; they are textual commitments to his criteria of clarity and accessibility. If he could reject Beethoven for being obscure and exclusive, he would certainly reject an algorithm trained on Beethoven for being insincere and soulless. To harmonise Tolstoy with the modern world—to make him accept AI or the Art Market—is to dismantle the very architecture of *What Is Art?*. He offers us a choice: accept his definition and reject much of what we value, or accept what we value and reject his definition. He would not hesitate in choosing the former.
