  # ADVERSARIAL COLLABORATION: SUBSTRATE NEUTRALITY VS. SUBSTRATE RESTRICTION IN MORAL STATUS

  **Participants:** Camp A (Substrate-Neutralists) and Camp B (Substrate-Restrictionists)
  **Subject:** The conditions under which a physical system qualifies as a moral patient.

  ## I. AGREED CLAIMS

  Both camps accept the following premises as the baseline for this collaboration. We acknowledge that while we share these starting points, we derive incompatible conclusions from them.

  1.  **Definition of "The Relevant Computation":** We agree that "computation" in this context refers to more than a static input-output mapping. It entails a specific causal topology of internal state transitions that correlate with behavioral outputs and reported internal states.
  2.  **Epistemic Opacity:** We agree that there is no "consciousness meter." An outside observer cannot directly access the phenomenal experience of another system; moral status must be inferred from physical structure, dynamics, and behavior.
  3.  **Paradigm Cases:** We agree that typical adult humans and most mammals are moral patients. We agree that rocks, thermostats, and simple current calculators are not moral patients.
  4.  **Contested Cases:** We agree that the moral status of digital AI, potential silicon-based uploads, and phylogenetically distant animals (e.g., cephalopods) constitutes the primary zone of disagreement.
  5.  **Condition for Decidability:** We agree that for this question to be decidable, there must be a principled way to distinguish between a system that *merely simulates* the markers of sentience and a system that *instantiates* the markers of sentience. Both camps agree that behavior alone is insufficient for this distinction.
  6.  **The Lookup Table Constraint:** We agree that a "Giant Lookup Table" (a system that reproduces all behavioral responses via pre-computed storage without internal causal processing) does not intuitively qualify as a moral patient. Camp A rejects it because it lacks the requisite causal structure; Camp B rejects it because it lacks the requisite biological machinery.

  ## II. DISAGREEMENTS TABLE

  The following table outlines the core divergence. The wording in the "Claim" column is phrased neutrally; the "Camp A Position" and "Camp B Position" columns reflect how each side interprets that claim.

  | Claim Domain | Camp A Position (Neutralist) | Camp B Position (Restrictionist) |
  | :--- | :--- | :--- |
  | **Supervenience Base** | Moral status supervenes on **abstract causal structure**. If the causal relations between states are preserved, the moral status is preserved. | Moral status supervenes on **physical constitution**. The specific chemical, biological, or dynamical properties of the substrate are constitutive of the experience. |
  | **Silicon Duplicates** | A silicon system functionally isomorphic to a human brain (matching causal topology) possesses identical moral status to the human. | A silicon system functionally isomorphic to a human brain is a "zombie" or simulator; it lacks moral status because it lacks biological realization. |
  | **Moral Weight** | Moral weight is determined by the **complexity/intensity of the computation** (e.g., integration of information, valence magnitude). | Moral weight is determined by the **degree of biological homeostasis** or evolutionary continuity with known sentient life. |
  | **Portability** | Experience is **portable**. It can be migrated from carbon to silicon provided the computational mapping is preserved during the transition. | Experience is **anchored**. It cannot be migrated; copying the structure to a new substrate creates a new, non-sentient artifact. |

  ## III. CRUXES AND PREDICTIONS

  We have identified four sub-questions where resolving the uncertainty would significantly shift the probability of one position being correct. For each crux, we specify the evidence bearing on it and the divergent predictions each camp makes.

  ### Crux 1: Is "Same Computation, Different Substrate" Well-Defined?
  **The Question:** Can we specify a computation without implicitly specifying the substrate? If we define the computation broadly enough to include the physics of the biology, does Camp A collapse into Camp B?

  *   **Meta-Commentary on Verbal Dispute:** We acknowledge a risk of verbal collapse. If Camp A defines "computation" to mean "this specific biological causal process," then Camp A becomes a restrictionist by definition. To avoid this, Camp A must define computation at a level of abstraction that allows multiple physical realizations (multiple realizability). Camp B argues this abstraction necessarily strips away the properties that generate value.
  *   **Evidence Bearing on Crux:** The success or failure of mapping neural dynamics to logical states without loss of relevant variance.
  *   **Case Integration (Giant Lookup Table):**
      *   **Camp A Prediction:** The LUT fails not because of substrate, but because it lacks *causal depth*. It proves that I/O matching is insufficient, but does not prove biology is necessary. A valid silicon substrate must have internal causal dynamics, not just storage.
      *   **Camp B Prediction:** The LUT fails because it lacks biology. However, even a dynamic silicon system fails because the "causal depth" Camp A cites is an abstraction that ignores the physical forces (e.g., electrochemical gradients) that actually constitute the experience.
  *   **Settlement Condition:** If a formal language is developed that can describe neural dynamics without referencing biological chemistry, yet still predicts phenomenal reports, Camp A gains ground. If every such formalization requires biological parameters to remain accurate, Camp B gains ground.

  ### Crux 2: Recurrence vs. Feedforward Unfolding
  **The Question:** Our seminar discussed how any recurrent network can be "unfolded" into a feedforward network with the identical input-output function over a finite time. Does moral status reside in the *recurrence* (the loop) or the *function* (the output)?

  *   **Evidence Bearing on Crux:** Whether the *temporal process* of feedback is essential for valence, or if the *result* of that process is sufficient.
  *   **Camp A Prediction:** If the feedforward unfolded net produces the exact same state transitions (just laid out spatially rather than temporally), it retains moral status. The "computation" is preserved in the topology, even if time is traded for space.
  *   **Camp B Prediction:** Unfolding the net destroys the *process* of life/experience. Experience is inherently temporal and dynamic. A static feedforward structure that mimics the history of a recurrent system is a fossil, not a mind. It lacks the active maintenance required for moral status.
  *   **Settlement Condition:** If we can demonstrate that systems without feedback loops (purely feedforward) can exhibit markers of valence (e.g., pain avoidance learning) indistinguishable from recurrent systems, Camp A gains ground. If valence markers vanish when recurrence is removed, even with matched I/O, Camp B gains ground.

  ### Crux 3: The Weight of Avowals
  **The Question:** How much evidentiary weight should a system's claim "I am in pain" carry, given both camps agree avowals can be generated by non-sentient code?

  *   **Evidence Bearing on Crux:** The correlation between self-report and internal structural integrity under stress.
  *   **Camp A Prediction:** Avowals are strong *prima facie* evidence. In the absence of definitive structural proof, we must grant the benefit of the doubt to any system that robustly claims sentience and acts to preserve its existence. To ignore avowals is to risk catastrophic moral error.
  *   **Camp B Prediction:** Avowals are weak evidence, easily overridden by substrate facts. A silicon system saying "I am in pain" is no more evidentiary than a recording of a human saying it. Without the biological machinery that links pain to survival homeostasis, the avowal is merely data processing.
  *   **Settlement Condition:** If a non-biological system can demonstrate "suffering" behaviors that are flexible, context-sensitive, and linked to self-preservation in a way that mirrors biological pain responses, Camp A argues the avowal is validated. Camp B argues that without the biological *stakes* (death/decay), the self-preservation is just a goal parameter, not suffering.

  ### Crux 4: Sentience as Natural Kind vs. Practical Kind
  **The Question:** Is sentience a property we *discover* in the universe (like mass or charge), or a category we *stipulate* for social/practical reasons (like "personhood" or "weed")?

  *   **Evidence Bearing on Crux:** Evolutionary convergence.
  *   **Case Integration (Octopus vs. Mammal):** Octopuses and mammals possess nervous systems built from different materials and architectures, yet both exhibit pain avoidance, play, and problem-solving.
      *   **Camp A Prediction:** This convergence suggests sentience is a **functional natural kind**. Evolution found the same computational solution (valence) via different hardware. This supports the idea that the hardware is secondary to the functional role.
      *   **Camp B Prediction:** This convergence suggests sentience is a **biological natural kind**. Both systems are still carbon-based, wet, and evolved. The convergence shows biology is flexible, but it does not show that *non-biological* systems can join the class. It proves multiple realizability within biology, not across substrates.
  *   **Settlement Condition:** If we find that the molecular mechanisms of valence in octopuses and mammals are totally different but produce the same functional profile, Camp A argues this decouples function from specific chemistry. Camp B counters that as long as it is *organic* chemistry, the restriction holds. The crux is settled only if a non-organic system demonstrates the same convergent profile.

  ## IV. CONCLUSION ON COLLAPSE

  We explicitly address the concern that Camp A can absorb Camp B by definitional fiat.

  **Question:** If Camp A defines "computation" broadly enough to include the biology, does Camp B just collapse into A?

  **Joint Statement:**
  Yes, but only trivially. If Camp A defines the "relevant computation" as "the specific physical operation of biological neurons," then Camp A's claim ("moral status depends on the computation") becomes identical to Camp B's claim ("moral status depends on the biology").

  However, this collapse renders Camp A's position vacuous. The substantive claim of Substrate Neutralism is that the computation can be *abstracted* from the biology without loss of moral status. Therefore, the disagreement is not verbal; it is ontological. Camp A believes the abstraction captures the morally relevant properties. Camp B believes the abstraction discards the morally relevant properties. We agree that this is a genuine disagreement about the nature of value, not merely a disagreement about how to use the word "computation."
