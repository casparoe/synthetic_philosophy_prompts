answer: |-
  This scenario describes a classic tension in bioethics and distributive justice: the conflict between **allocative efficiency** (maximizing aggregate health) and **disability accommodation** (ensuring equal status/access). To analyze the theories of equality presupposed here, we must distinguish between the *currency* of advantage (what is being distributed) and the *distributive rule* (how it is distributed).

  Below is an analysis of the implicit currencies, their consistency, and the implications of enforcing a single theoretical framework.

  ### 1. The Currency of Equality in Practice 1 (Cost-Per-QALY)

  **The Practice:** Funding treatments based on cost-per-Quality-Adjusted Life-Year, denying those above a threshold regardless of patient identity.

  *   **Implicit Currency:** **Health-Welfare.**
      The QALY metric treats health as a commodity that can be aggregated. It reduces "advantage" to a single dimension: the quantity and quality of life remaining. While "quality" sounds like capability, in health economics it is operationalized as a utility weight (0 = death, 1 = perfect health).
  *   **Implicit Theory of Equality:** **Prioritarianism or Utilitarianism within a Health Sphere.**
      Strictly speaking, maximizing QALYs is utilitarian (maximize the sum). However, because it is used in a public service, it is often justified by a "fair innings" argument (a form of prioritarianism: give priority to those with less health, provided it is efficient).
  *   **Strict Presupposition:**
      1.  **Commensurability:** All health benefits can be compared on a single scale.
      2.  **Aggregation:** It is permissible to deny a specific individual a benefit if the resources generate greater total health elsewhere.
      3.  **Identity-Irrelevance:** The specific identity or social status of the patient (e.g., disabled vs. non-disabled) is irrelevant except insofar as it affects the Q-score.
  *   **Philosophical Underdetermination:**
      This practice does not *strictly* presuppose that health is the *only* good in life, only that it is the only good *this budget* is responsible for. It is compatible with a **Sufficientarian** view if the threshold is set at a "decent minimum," but the *denial* mechanism suggests an aggregative logic rather than a threshold logic.

  ### 2. The Currency of Equality in Practice 2 (Accommodation Budget)

  **The Practice:** Funding interpreters, accessibility, and assistants without comparing their health return to medical treatments.

  *   **Implicit Currency:** **Capabilities (Functionings).**
      While the inputs are resources (money, interpreters), the *entitlement* is to a functioning: the ability to communicate, enter buildings, or read. The funding is not contingent on how much "health" this produces, but on enabling the person to operate within the service. This aligns with Amartya Sen and Martha Nussbaum's **Capability Approach**.
  *   **Implicit Theory of Equality:** **Capability Egalitarianism (or Status-Based Rights).**
      This practice presupposes that disabled individuals have a claim to a threshold of functioning that cannot be traded off against aggregate health gains. It treats accessibility as a **deontological constraint** or a matter of **equal status**, rather than a welfare maximization problem.
  *   **Strict Presupposition:**
      1.  **Conversion Sensitivity:** Different people require different resources to achieve the same level of access (the "conversion factor" problem).
      2.  **Non-Aggregation:** The claim to access is not defeasible by the fact that the money could save more lives elsewhere.
  *   **Philosophical Underdetermination:**
      One could argue this is **Resource Egalitarianism** (Ronald Dworkin), where the state provides insurance against bad brute luck (disability). However, a strict Resource view would typically subject these costs to opportunity analysis against other resource claims (like cancer drugs). The fact that this budget is "separate" and immune to health-comparison suggests a **Capability Threshold** view (Nussbaum) rather than a pure Resource view (Dworkin).

  ### 3. Consistency: Can the Institution Hold Both?

  **Verdict:** The institution is **theoretically inconsistent** if it claims to operate under a single monistic theory of distributive justice. It is, however, **pragmatically pluralist**.

  *   **The Conflict:** Practice 1 treats disability largely as a reduction in the *Q* (quality) of life, implying that extending the life of a disabled person is "worth less" than extending the life of an able-bodied person (a widely criticized feature of QALYs). Practice 2 treats disability as a difference requiring *accommodation* to ensure equal standing, implying the disabled person's claim is equal to the cancer patient's.
  *   **The Incompatibility:**
      *   If **Health-Welfare** is the true currency, Practice 2 is wasteful unless interpreters produce more QALYs than drugs (which is rarely calculated).
      *   If **Capabilities** are the true currency, Practice 1 is unjust because it ignores the fact that disabled people may need more resources to achieve the same health capabilities, and it penalizes them for lower baseline Q-scores.
  *   **How they coexist:** They coexist only through **Compartmentalization**. The institution implicitly adopts a **Hybrid Theory**: Utilitarianism for *clinical treatment* (Practice 1) and Rights-Based Capability Egalitarianism for *institutional access* (Practice 2). This is a "separate spheres" approach to justice.

  ### 4. Implications of Committing to a Single Currency

  If the institution were forced to abandon this hybridity and commit to one currency, significant operational changes would be required.

  #### A. If Committed to a Thoroughgoing Capabilities View
  *   **Demand on Cost-Per-QALY (Practice 1):**
      The QALY metric would have to be abandoned or radically modified. A capability view rejects weighting life-years by "quality" if that quality is depressed by disability. Instead, the metric would need to measure **Capability Expansion**.
      *   *Change:* A drug that extends the life of a disabled person would be valued equally to one extending an able-bodied person's life, provided both achieve the same *capability* to function. The "cost-per-QALY" threshold would be adjusted for **conversion factors**. It might cost more to achieve a year of life for a disabled patient; a capability view might mandate funding it anyway if it secures the central capability of "Life," whereas the current QALY system denies it for being "inefficient."
  *   **Demand on Accommodation (Practice 2):**
      This practice fits well but would demand more rigor. The institution would need to verify that the resources provided (interpreters, etc.) actually result in the *functioning* (communication), not just the provision of the resource.

  #### B. If Committed to a Thoroughgoing Resource View (Dworkinian)
  *   **Demand on Cost-Per-QALY (Practice 1):**
      Allocation would shift from "maximize health" to "mimic hypothetical insurance." Treatments would be funded based on what a rational person would have insured against behind a veil of ignorance.
      *   *Change:* Rare, expensive diseases might get *more* funding than QALYs allow (if people would insure against catastrophe), or *less* (if people would prioritize basic care). The "threshold" becomes an insurance premium limit, not a health-efficiency limit.
  *   **Demand on Accommodation (Practice 2):**
      **This is where the radical change occurs.** A thoroughgoing Resource Egalitarian view *cannot* sustain a separate budget immune to opportunity costs.
      *   *Change:* The cost of sign-language interpreters would have to be weighed against the cost of cancer drugs. Both are claims on the common pool of resources. If $1 million on interpreters buys less "resource equality" (or less insurance value) than $1 million on chemotherapy, the Resource view dictates shifting funds to chemotherapy. The current practice of "funding without asking whether those dollars buy as much health" is **incompatible** with a strict Resource Egalitarian view, which requires all claims to be commensurable in terms of resource share.

  ### 5. Consensus vs. Contested Claims

  In answering the above, it is vital to distinguish what is settled in the literature from what is debated.

  | Claim | Status in Distributive Justice Literature | Notes |
  | :--- | :--- | :--- |
  | **QALYs are Welfarist/Aggregative** | **Settled** | There is consensus that QALY maximization is structurally utilitarian and aggregates benefits across persons. |
  | **QALYs Discriminate Against Disabled** | **Settled** | It is widely accepted (e.g., by Nordenfelt, Brock, Daniels) that standard QALYs value life-extension for disabled people lower than for non-disabled people. |
  | **Accommodation = Capabilities** | **Contested** | While Capabilities theorists (Nussbaum) claim this, Resource Egalitarians (Dworkin, Cohen) argue accommodations can be justified via resource redistribution without invoking capabilities. |
  | **Resource View Requires Cutting Accommodations** | **Contested** | Some argue Dworkin's "expensive tastes" objection would cut accommodations. Others argue the "hypothetical insurance" model would protect them. However, it is **settled** that a Resource view requires *comparing* the cost of accommodations to other resource claims, unlike the current Practice 2. |
  | **Capabilities View Rejects QALYs** | **Settled** | Capability theorists universally reject the QALY reduction of "quality" to a single utility number, arguing it ignores the plurality of functionings. |
  | **Hybrid Theories are Coherent** | **Contested** | Walzer (Spheres of Justice) argues separate spheres are coherent. Monists (Cohen, Arneson) argue this is an unstable compromise that hides injustice. |

  ### Summary of the Oddity

  The institution is operating on a **Split-Conscience Theory of Justice**.
  1.  **For Medicine:** It acts as a **Health Utilitarian**, treating patients as vessels of health-outcomes to be maximized.
  2.  **For Access:** It acts as a **Capability Egalitarian**, treating patients as citizens entitled to a threshold of functioning regardless of cost-efficiency.

  To make this consistent, the institution must either admit that **Health** is not the only currency of justice (validating the accommodation budget as a separate justice requirement) or it must subject the accommodation budget to the same harsh efficiency calculus as the drug budget (which would likely violate disability rights norms). The current arrangement is philosophically unstable but politically common, relying on the **underdetermination** of whether "access" counts as "health treatment." A thoroughgoing theory would force these two budgets to speak the same language, likely to the detriment of one of the current practices.
