prompt: |-
  An oddity in a national health service I know of: to decide which treatments to fund, it ranks them by cost per quality-adjusted life-year and applies a threshold, so that a drug buying less health per dollar is denied regardless of who the patient is; but in a separate budget line the same service funds sign-language interpreters, accessible buildings, personal assistants, and reading services for blind users, without ever asking whether those dollars buy as much health as a cancer drug would. What theory of equality does the pair presuppose? Reconstruct the currency of equality implicit in the first practice and the currency implicit in the second -- welfare, resources, capabilities, or something else -- and say whether the institution can consistently hold both or is quietly committed to two incompatible equalisanda. Separate what each practice strictly presupposes from what it merely fits, flag where it is philosophically underdetermined, and then say what would have to change if the institution committed to a single currency: what would a thoroughgoing capabilities view demand of the cost-per-QALY threshold, and what would a thoroughgoing resource view demand of the accommodation budget? Be explicit about which parts of your answer are settled among people who study distributive justice and which are genuinely contested, rather than presenting a contested reading as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Scenario:** A national health service (NHS-like) has two distinct funding practices:
          1.  *Treatment Funding:* Uses Cost-Per-QALY (Quality-Adjusted Life Year) thresholds. Denies treatment if health gain per dollar is too low, regardless of patient identity.
          2.  *Accessibility Funding:* Funds sign-language interpreters, accessible buildings, personal assistants, reading services, etc., *without* comparing their health return to cancer drugs.
      *   **Task:**
          1.  Identify the theory of equality (currency of equality) implicit in Practice 1.
          2.  Identify the theory of equality (currency of equality) implicit in Practice 2.
          3.  Assess consistency: Can the institution hold both, or are they incompatible equalisanda?
          4.  Separate strict presuppositions from mere fits (flag philosophical underdetermination).
          5.  Analyze what would change if the institution committed to a *single* currency:
              *   Thoroughgoing Capabilities View $\rightarrow$ Impact on Cost-per-QALY.
              *   Thoroughgoing Resource View $\rightarrow$ Impact on Accommodation Budget.
          6.  **Crucial Constraint:** Distinguish between settled consensus and genuinely contested claims in distributive justice literature. Do not present contested readings as consensus.

  2.  **Analyze Practice 1: Cost-Per-QALY Thresholds:**

      *   *Mechanism:* Maximizing aggregate health outcomes within a budget.
      *   *Implicit Currency:* **Welfare (specifically Health-Welfare)** or **Health Outcomes**. It treats health as a commodity to be maximized.
      *   *Theory of Equality:* **Utilitarianism** (maximize total good) or **Prioritarianism** (weighted towards the worse off, but still outcome-focused). In terms of "currency," it aligns most closely with **Welfarism** (specifically health utility).
      *   *Nuance:* QALYs measure *quality* of life, which is a proxy for welfare, but restricted to health. It ignores *how* the health is achieved (process) and focuses on the *outcome*.
      *   *Strict Presupposition:* Health is the relevant metric of advantage. Aggregation is permissible (sacrificing one for the many if efficient).
      *   *Underdetermination:* Does it presuppose strict utilitarianism? Not necessarily. It could be consistent with a "sufficientarian" view (get everyone above a health threshold) if the threshold happens to align, but the *method* is aggregative. It doesn't strictly presuppose *equality* of health, but rather *efficiency* of health production. However, in the context of "theories of equality," it's usually mapped to **Welfarism** or **Outcome Egalitarianism** (trying to equalize health outcomes efficiently).

  3.  **Analyze Practice 2: Accessibility/Accommodation Budget:**

      *   *Mechanism:* Providing specific resources/services to disabled individuals to enable participation/functioning, without cost-benefit analysis against medical treatments.
      *   *Implicit Currency:* **Capabilities** (functionings one can achieve) or **Resources** (means to achieve ends).
      *   *Theory of Equality:* **Capability Approach** (Sen/Nussbaum) fits best. It focuses on what people are able to do and be (communicate, access buildings). **Resource Egalitarianism** (Dworkin) is also possible (providing insurance against bad luck/disability), but the focus on *functioning* (accessing the service) leans towards Capabilities.
      *   *Strict Presupposition:* Disabled individuals have a claim to access that is not contingent on the marginal health utility of that access compared to others. It recognizes a duty to accommodate difference.
      *   *Underdetermination:* Is it Resources or Capabilities? Resources (interpreters) are provided *to* achieve Capabilities (communication). A Resource view might ask "is this the cheapest way to give them equal resources?" A Capability view asks "does this enable them to function?" The prompt says they fund it "without ever asking whether those dollars buy as much health." This suggests a deontological constraint or a prior entitlement, fitting Capability/Status views better than pure Resource maximization.

  4.  **Assess Consistency (The "Oddity"):**

      *   *Conflict:* Practice 1 says "Health efficiency trumps individual need." Practice 2 says "Access entitlement trumps health efficiency."
      *   *Incompatibility:* If the currency is *Health Welfare* (Practice 1), then Practice 2 is irrational unless interpreters produce more QALYs than cancer drugs (which is unlikely and not the stated justification). If the currency is *Capabilities* (Practice 2), Practice 1 is oppressive because it ignores the conversion factors (disability) that make health harder to achieve for some.
      *   *Can they be held together?* Only via **Pluralism** (different spheres of justice) or **Hybrid Theory**. But strictly speaking, as a *single* theory of distributive justice, they rely on different equalisanda (Health Welfare vs. Functional Access).
      *   *Settled vs. Contested:* It is *contested* whether QALYs are purely welfarist or can be capability-adjusted. It is *settled* that QALYs generally ignore accommodation costs as distinct from treatment costs.

  5.  **Hypothetical Shifts (Single Currency Commitment):**

      *   *Scenario A: Thoroughgoing Capabilities View.*
          *   *Impact on QALY:* QALYs would need to be adjusted for "conversion factors." A year of life with a disability might be valued differently (not lower, perhaps higher cost to achieve same capability). The threshold wouldn't just be "health," but "capability to function." Cost-per-QALY might be replaced by Cost-per-Capability-Expansion.
          *   *Impact on Accommodation:* This fits well, but would demand *more* scrutiny on whether the accommodation actually expands capabilities vs. just providing resources.
      *   *Scenario B: Thoroughgoing Resource View (Dworkinian).*
          *   *Impact on QALY:* Treatment allocation would depend on "hypothetical insurance." Would a rational person insure against this condition?
          *   *Impact on Accommodation:* This is the big change. A strict Resource view *would* subject accommodations to opportunity cost. If $1M on interpreters buys less "resource equality" than $1M on cancer drugs, the Resource view (if aggregative) might cut the interpreters. *However*, Dworkin's "envy test" suggests disabled people need more resources to reach the same starting line. So, accommodations stay, *but* they must be cost-effective relative to other resource transfers. The prompt says they *don't* ask about cost-effectiveness vs. drugs. A strict Resource view *would* ask that.

  6.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the tension. Define the two practices.
      *   **Practice 1 (QALY):** Identify as **Welfarism/Health Maximization**. Note the aggregative nature.
      *   **Practice 2 (Accommodation):** Identify as **Capability** (primary) or **Resource** (secondary). Focus on the *status* of the disabled person.
      *   **Consistency Check:** They are theoretically inconsistent if viewed as a monolithic theory. They represent a **Pluralist** compromise.
      *   **Underdetermination:** QALYs aren't *purely* welfarist (they measure health, not total welfare). Accommodations aren't *purely* capability (they are resource inputs).
      *   **Single Currency Implications:**
          *   *Capabilities:* QALYs must be modified to account for disability not as a "lower quality" but as a different conversion rate.
          *   *Resources:* Accommodations must be subject to the same opportunity cost logic as drugs (Dworkin's insurance model).
      *   **Consensus vs. Contested:** Be careful here.
          *   *Settled:* QALYs are utilitarian/aggregative in structure. Capability approach focuses on functionings.
          *   *Contested:* Whether QALYs *can* be reconciled with Capabilities (some try). Whether Resource egalitarianism *requires* cutting accommodations (depends on the insurance model specifics).

  7.  **Refining the Philosophy (Self-Correction/Nuance):**

      *   *Correction on Practice 1:* Is it Equality? Actually, strict QALY maximization is Utilitarianism, not Egalitarianism. However, in the context of a public service, it's often justified as "fair innings" or maximizing health *equity* within a budget. I need to be precise: It presupposes **Health as the Equalisandum**, distributed via **Prioritarian/Utilitarian** rules.
      *   *Correction on Practice 2:* Is it Resources or Capabilities? Providing an interpreter is a resource. The *goal* is capability (communication). The prompt says they fund it *without* comparing health return. This implies a **Status-Based** or **Rights-Based** view (you have a right to access), which aligns closely with Nussbaum's **Central Capabilities** (thresholds that must be met regardless of cost-benefit against others).
      *   *The "Oddity":* The oddity is that Practice 1 treats disability as a reduction in Q (quality), whereas Practice 2 treats disability as a difference requiring accommodation. This is the "Disability Paradox" in health economics.
      *   *Consensus Check:* It is widely agreed in philosophy that QALYs discriminate against the disabled (lower Q scores). It is widely agreed that the Capability Approach offers an alternative. It is *contested* whether a single metric can capture both.

  8.  **Final Polish:** Ensure the tone is analytical, not prescriptive. Ensure the distinction between "strictly presupposes" and "merely fits" is clear. Ensure the "Settled vs. Contested" distinction is explicit.

      *(Self-Correction during drafting)*: I need to make sure I don't say Resource Egalitarianism *definitely* cuts accommodations. Dworkin argues for redistribution to the disabled. But the prompt says the current system *doesn't compare* the cost to cancer drugs. A strict Resource view *would* compare them as competing claims on the common pool. So the change would be the *introduction* of the comparison, not necessarily the *cutting*.

      *(Refining the "Currency" labels)*:
      Practice 1: **Health-Welfare** (a subset of Welfarism).
      Practice 2: **Capabilities** (specifically, functioning thresholds).
      Why not Resources for Practice 2? Because resources are instrumental. If a blind person doesn't need a reader (e.g., braille exists), the resource changes. The entitlement is to the *functioning* (access), not the specific resource. So Capabilities is the stronger fit.

      *(Refining Consistency)*: Can they be consistent? Only under **Sufficientarianism**. Maybe Practice 1 applies above a threshold, Practice 2 ensures the threshold is reachable? But the prompt implies Practice 1 denies treatment *regardless of who*, suggesting aggregation. Practice 2 suggests a side-constraint. This is a **Hybrid** view, not a single currency view.

      *(Final check on constraints)*: Did I flag underdetermination? Yes. Did I distinguish settled/contested? Yes. Did I answer the "what would change" part? Yes.

  9.  **Final Output Structure:**
      1.  Introduction: The Tension.
      2.  Practice 1 Analysis (Currency & Theory).
      3.  Practice 2 Analysis (Currency & Theory).
      4.  Consistency & Underdetermination.
      5.  Single Currency Implications (Capabilities & Resources).
      6.  Consensus vs. Contested Map.

      *(Wait, one more nuance)*: The prompt asks about "theories of equality." QALY maximization isn't strictly an *equality* theory, it's an efficiency theory used *within* an egalitarian institution. I must clarify that it presupposes **Health** is the thing to be equalized, but uses **Aggregation** to do it. Practice 2 presupposes **Status/Access** is the thing to be equalized, using **Entitlements**.

