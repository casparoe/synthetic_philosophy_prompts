answer: |-
  Thank you all for being here, and for sustaining what my grandmother started. Looking around this room, I see the two engines that have kept this foundation running for thirty years. I see the careful stewards who want to ensure every dollar does the most good possible. And I see the neighbors who believe that help is about dignity, not just data.

  Uncle Dave just offered us a way out of the tension between those two groups. He suggested that since none of us can truly know the future, we should simply fund what feels good in the moment. It is a comforting thought. And he is right about the not knowing.

  Here is the hard truth we rarely say out loud: We are clueless about the long run. When we fund a scholarship, we change a life. That student meets a partner, moves to a new city, has children. One of those children might cure a disease; another might start a conflict. The ripples go on for centuries. It is not just that we don't know the odds of these outcomes. It is that we don't even know what the possible outcomes *are*. We are missing the map entirely.

  To our friends who love the spreadsheets: You are right to be uneasy. We cannot prove that feeding someone today creates net good in twenty years. The chain of cause and effect is too complex to model.

  To our friends who love the people: You are right to be uneasy, too. Reducing a human being to a line item misses the point of charity. You know that looking someone in the eye matters, even if it doesn't show up in a report.

  But uncertainty is not a permission slip to stop thinking, and humanity is not an excuse to stop measuring. If we only follow our feelings, we might fund things that feel warm but do harm. If we only follow the models, we might fund things that look efficient but strip people of dignity. We cannot resolve this tension by picking a side. We have to hold it.

  My grandmother didn't start this foundation because she had a crystal ball. She started it because she saw a need she could meet *today*, with the understanding that tomorrow is opaque.

  So, here is what I ask we do on Monday. Do not just write checks, and do not just offer hugs. Do both, with your eyes open.

  When you visit the food bank or the clinic, ask the hard numbers: "Did this resource reach the people who needed it most? Did it work as intended?" Demand that accountability. It honors the donors who trust us with their capital.

  But then, look the recipient in the eye and ask the human question: "Did this help you stand on your own feet? Did this treat you with respect?" Demand that dignity. It honors the volunteers who give their time.

  We cannot know the end of the story. We cannot control the ripples. But we can control the quality of the stone we drop into the water. Let us drop stones that are both effective and kind. Let us be stewards of the present, humble about the future, and committed to each other here, now.

  Thank you.
