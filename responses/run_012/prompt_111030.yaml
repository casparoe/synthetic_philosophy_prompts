answer: |-
  Dear Writer,

  It is a rare and valuable thing to encounter a character in your own vocabulary who refuses to stay still, and pleasure is perhaps the most elusive character of all. You have put your finger on a puzzle that has occupied philosophers for centuries, and you are right to sense that the word is doing too much work while carrying too little weight. The first difficulty you describe, the fact that the cold river and the finished sentence and the rival's disgrace share no single sensory thread, is known in philosophy as the heterogeneity problem. For a long time, the dominant view was what we might call the feeling theory, which held that pleasure was a specific kind of sensation, a unique glow or tickle that accompanied certain experiences. Your examples dismantle this theory effortlessly. There is no common sensation between the relief of a tooth coming out and the satisfaction of a sentence ending correctly, yet we call both pleasure. If pleasure were a sensation like sweetness or redness, you should be able to isolate it, but you cannot.

  The second difficulty, where wanting and liking come apart in the figure of the addict or the joyless enthusiast, is often discussed under the heading of the wanting-liking distinction. This separates motivation from enjoyment. The addict wants the drug with a ferocity that has nothing to do with the pleasure it provides, and the enthusiast may find deep satisfaction in a duty they would not choose to pursue again. These are not merely exceptions; they are structural features of the human mind. You asked if these are one problem or two, and the most useful way to carve it is to see them as two symptoms of the same underlying error. Both problems arise because we try to treat pleasure as a noun, as a thing we possess, rather than as a verb, as a way we relate to the world. When you look for pleasure as a thing, you find heterogeneity. When you look for it as the engine of desire, you find the addict who wants without enjoying.

  The strongest candidate for what these experiences share, and the one that survives your test cases, is what philosophers call the attitudinal theory of pleasure. This view suggests that pleasure is not a sensation at all, but an attitude of being pleased that something is the case. When you stand in the cold river, you are not sensing a pleasure-particle; you are taking a positive stance toward the sensation of cold water. When you feel relief that the tooth is out, you are taking a positive stance toward the cessation of pain. When you feel schadenfreude, you are taking a positive stance toward a proposition, namely that your rival has fallen. This explains why there is no common feeling; the feelings are different, but the attitude toward them is the same. It is a kind of inner yes. This theory handles your examples well. The remembered humiliation works because you are now taking a positive attitude toward a memory that was once painful, perhaps because it signifies survival or distance. The relief works because the object of your attitude is the absence of pain. The sentence works because the object is the achievement of order.

  However, you also asked how this differs from the ordinary vagueness of a term like game or art, and this is where the carving must be precise. When Wittgenstein argued that games share no common feature but only a family resemblance, he was talking about a category we impose from the outside. We decide what counts as a game. Pleasure is different because it claims to be something felt from the inside. The vagueness of pleasure is not that we cannot decide where to draw the boundary, but that the boundary seems to dissolve upon inspection. It is not merely that different things are pleasant to different people, which would be simple subjectivity. It is that even for one person, at one time, the phenomenon itself refuses to unify. Nor is it a tautology, the idea that we pursue whatever we happen to pursue. If it were, the addict would be pursuing pleasure, but you correctly note that the addict pursues the drug without the pleasure. The attitudinal view saves us here by saying the addict wants the drug but does not take a positive attitude toward the experience of taking it, or at least not in the moment of consumption.

  So where does this leave you with your boundaries? If you adopt the attitudinal view, the boundary of pleasure is not a type of feeling but a direction of fit. Pleasure occurs when the mind welcomes an experience, whether that experience is sensory, intellectual, or social. Pain is the mind rejecting an experience. This allows you to keep the word unified without forcing a false unity upon the sensations. It survives the tooth because the mind welcomes the absence of pain. It survives the schadenfreude because the mind welcomes the justice or the status shift. It fails only if you insist that pleasure must feel good in a sensory way. For your purposes as a novelist, this suggests that you should not describe pleasure as a glow that washes over your characters, but as a alignment between what they encounter and what they endorse. The cold river is pleasure because the character welcomes the cold. The sentence is pleasure because the character welcomes the order.

  There is a risk, of course, that this makes pleasure sound too cognitive, as if your characters must consciously judge every experience. You can mitigate this by understanding that these attitudes are often pre-reflective. We do not think I welcome this cold water; we simply stay in the river. The attitude is in the staying, not in the thought. This preserves the immediacy of the river while accounting for the complexity of the humiliation. The humiliation is pleasure only because the character now stays with the memory, whereas before they fled it. This also clarifies the split between wanting and liking. Wanting is the reach; liking is the welcome. The addict reaches but does not welcome. The enthusiast welcomes but does not reach. They are distinct systems that usually travel together but can be severed.

  You asked me to invent a concept if no established one covered this, but the attitudinal theory covers the ground you have mapped. However, for a writer, the philosophical term might be too dry. You might think of it as resonance. When the world strikes a chord that the character is tuned to vibrate with, that is pleasure. Sometimes the chord is sensory, sometimes it is moral, sometimes it is relief. The tuning is the attitude. When the tuning and the striking come apart, you have your conflict. The addict is struck but not tuned. The reluctant enthusiast is tuned but not striking. This metaphor of resonance keeps the unity you need without demanding a single sensation. It allows you to say that the pleasure of the river and the pleasure of the sentence are the same kind of event, a matching of internal state to external condition, without claiming they feel the same.

  Ultimately, the problem you have stumbled into is the failure of language to capture a relation as if it were a quality. We speak of pleasure as if it were a property of the river or the sentence, but it is a property of the encounter. This is why the word shifts on you. It is not ambiguous like bank, which refers to two unrelated things. It is unstable because it refers to a dynamic event that takes different shapes depending on what is being encountered. Your intuition that you are quietly changing the subject is correct, but you are not changing the subject; you are revealing that the subject is broader than a feeling. It is a mode of engagement. If you write it as a mode of engagement, as a way your characters inhabit their moments, you will avoid the trap of searching for a sensation that isn't there. You will be free to describe the cold water and the finished sentence as different instruments playing the same note, which is the note of the character saying yes to their life, however briefly. This is the boundary you are looking for. It is not where the pleasure is, but where the acceptance is.
