  ### The episode, fixed

  The explanandum comprises two legislative acts: the 1807 abolition of the slave trade and the 1833 abolition of slavery in British colonies, involving £20 million compensation and apprenticeship. Contextual constraints are fixed: the Haitian Revolution (1791–1804) created regional instability; slave revolts were frequent; abolitionist leadership was predominantly evangelical, not gentry; and slavery expanded elsewhere (US, Brazil) post-1833. An adequate explanation must account for the specific timing of 1807 and 1833, the mechanism of change (economic vs. moral), and the agents involved. It must also explain why Britain acted while comparable capitalist economies did not. Explaining this episode requires identifying why these specific dates marked the tipping point rather than a generation earlier or later, and what role the enslaved played in forcing the issue.

  ### The economic thesis, run through the case

  For Williams, the relevant agents are emerging industrial capitalists and free-trade advocates opposing the mercantilist West India Lobby. They want open markets, cheaper labor inputs outside the Caribbean monopoly, and an end to aristocratic privilege embedded in plantation ownership. The mechanism is structural materialism: as slavery becomes less profitable relative to free wage labor and open trade, capitalism discards it; abolitionist sentiment functions merely as a legitimating ideology to smooth the transition. The timeline predicts abolition coinciding with economic decline or a decisive shift in capitalist interest. 1807 marks the trade's expendability; 1833 marks slavery's obsolescence. However, the profitability objection must remain in play. Critics argue the slave economy was expanding, not declining, in 1807. To sustain the thesis, one must argue capitalists anticipated future decline or valued risk mitigation over immediate profit. The theory treats morality as epiphenomenal. Evidence against it includes sustained sugar profits and the fact that British capitalism continued to thrive while other capitalist nations retained slavery. If the economy was booming, the economic thesis requires modification: perhaps abolition was about securing global hegemony rather than escaping a failing system. The compensation paid suggests a property rights negotiation consistent with economic transition, not purely moral rupture. The rise of East Indian sugar provided a competitive alternative, allowing Britain to abandon the West Indies without losing supply. This supports Williams's view of shifting capitalist interests, even if absolute profitability hadn't collapsed. The theory explains the 1833 timing as the moment when industrial capital no longer needed the colonial monopoly to thrive. The distinction between 1807 and 1833 is crucial: ending the trade protected existing slave values while stopping competition; ending slavery liquidated the asset class entirely. Williams argues this liquidation happened only when the asset was no longer central to industrial accumulation. The fixed fact of compensation aligns with Williams: capitalists compensated capitalists to restructure the economy. However, the persistence of slavery in the American South, a fellow capitalist economy, challenges the necessity of this shift. Williams must argue British capitalism was unique in its industrial maturity, whereas American capitalism remained agrarian and dependent on coerced labor. This nuance saves the theory from falsification but weakens its universal claim about capitalism and slavery.

  ### The honor account, run through the case

  Appiah identifies agents as the honor-holding elite (gentry, parliamentarians) whose social standing depends on peer recognition. They want to avoid shame and maintain status within their specific community. The mechanism is reflexive: honor initially sustained slaveholding as a mark of wealth and power, but a reorganized honor code made it a source of dishonor. The timeline predicts abolition when the practice becomes socially toxic among elites. In this case, evangelical abolitionists weaponized shame, framing slaveholding as barbaric rather than gentlemanly. The 1807 and 1833 dates mark the moment elite consensus shifted. However, the leadership was largely outside the gentry. This strains the mechanism: if abolitionists lacked honor-status, how did they shame the elite? The theory suggests they successfully appealed to the elite's self-image. The persistence of slavery elsewhere is less problematic for Appiah; honor codes are national or cultural, not global. British honor changed; American honor did not. Evidence against this would be if elites remained indifferent to public shame or if abolition occurred without elite consensus. The compensation package can be read as saving face—allowing elites to exit honorably rather than being stripped of assets. The reflexivity is crucial: the same social pressure that once validated plantation ownership as prudent management later validated abolition as moral duty. The change wasn't in the argument against slavery, which existed for centuries, but in the social cost of ignoring it. Once owning slaves signaled cruelty rather than competence, the practice collapsed among those dependent on social standing. This explains the rapid legislative shift once the cultural tide turned, distinguishing it from gradual economic decay. Appiah's account relies on the idea that elites care more than profits about their standing. The fixed fact of evangelical leadership suggests the honor code was penetrated from outside. The evangelicals did not hold traditional honor but held moral authority, which they converted into social shame. The mechanism works if we accept that honor is permeable to moral argument when backed by public mobilization. The 1833 abolition, coming after decades of campaigning, fits the honor model of a slow cultural shift reaching a tipping point. However, the Haitian Revolution complicates this: fear may have driven the honor shift more than moral argument. If elites abolished slavery to prevent a British Haiti, is that honor or security? Appiah would argue security is part of honorable stewardship, but the distinction blurs. The honor account explains the internal British dynamic well but struggles to explain why the honor code shifted exactly when it did without referencing external material shocks.

  ### Where each theory strains

  Both theories strain on timing and agency. Williams struggles with the profitability objection: if slavery was profitable in 1807, why abolish then? The Haitian Revolution offers a clue: fear of revolt made slavery risky, altering the economic calculus without necessarily reducing profits. This introduces a variable Williams underplays: the cost of repression. Similarly, 1833 follows the Jamaica revolt (1831), suggesting enslaved agency forced the economic hand. Williams treats the enslaved as passive economic units. Appiah strains on the leadership demographic. If honor flows through the gentry, why did evangelicals drive the change? Perhaps the mechanism isn't honor but religious moralism, which Appiah subsumes under honor too quickly. Furthermore, honor sustained slavery for centuries; what triggered the flip? Appiah points to narrative shifts, but the Haitian Revolution provided the material shock that made the narrative stick. Both theories struggle with the persistence of slavery in the US South. For Williams, this is fatal if American capitalism was similar to British. For Appiah, it requires distinct honor cultures, which is plausible but descriptive rather than explanatory. Finally, both theories marginalize the enslaved. Revolts imposed costs (economic) and highlighted brutality (moral/honor). Neither theory fully integrates this resistance as a causal mechanism rather than background noise. The timing of 1833 specifically is hard for Williams if profits were high, and hard for Appiah if honor was stable. The apprenticeship system suggests a compromise neither theory fully predicts: economic continuity masked as moral transition. The £20 million compensation is a strain for Appiah: if slavery was dishonorable, why pay to stop it? It looks more like an economic buyout. Conversely, for Williams, if slavery was unprofitable, why pay so much? It suggests slavery still held value. The fixed fact of slavery persisting elsewhere for decades challenges the inevitability implied by both theories. Williams implies capitalism naturally sheds slavery; the US South proves it can sustain it. Appiah implies honor codes naturally progress; the American South proves they can stagnate. The role of the enslaved is the biggest blind spot. Revolts made slavery dangerous (economic) and visible (moral). Neither theory centers this agency.

  ### What the case does to the theories

  The case embarrasses Williams on strict profitability but supports the broader structural shift toward free trade and risk management. It suggests economics matters, but not as a simple decline thesis. The case complicates Appiah: honor explains the speed of elite compliance once turned, but not the initial agitation by non-elites. It confirms that moral change requires elite buy-in, but leaves the source of the moral shock undertheorized. The episode suggests a third mechanism: resistance-induced cost imposition. Enslaved people made slavery expensive (security costs) and morally untenable (through revolt narratives). This bridges the economic and moral: resistance lowered profitability (Williams) and generated shame (Appiah). The case falls outside Williams's strict determinism because morality wasn't just ideology; it motivated actors who sacrificed economic gain. It falls outside Appiah's clean honor model because the shame was externally imposed by radicals and the enslaved, not internally generated by elite reflection. Ultimately, the episode suggests moral revolution requires a convergence of material cost and symbolic shame, neither of which is sufficient alone. The persistence of slavery elsewhere confirms that British abolition was specific to British political culture and economic structure, not a universal capitalist or moral stage. The compensation detail supports both: it acknowledges property (economic) but facilitates exit (honor). The case confirms that moral revolutions are not purely ideational nor purely material. It embarrasses Williams by showing moral actors mattered; it embarrasses Appiah by showing material threats mattered. A synthesis is required where enslaved resistance raises the economic cost of slavery while simultaneously providing the moral evidence needed to shift the honor code. The British state's capacity to pay compensation and enforce abolition is a variable neither theory fully accounts for: state power enabled the transition.

  ### Bottom line

  The economic account survives better as a structural frame, provided it incorporates risk and resistance costs, while the honor account explains the psychological mechanism of elite compliance. I would change my mind if data showed abolition occurred during peak slave profitability without increased revolt risk, or if elites abolished slavery while gaining social status from holding it. A hybrid model acknowledging enslaved agency as the catalyst for both economic and moral shifts is necessary.
