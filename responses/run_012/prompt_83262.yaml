      *   *Refining the "Collapse":* Be honest. It *does* collapse mathematically. Don't waffle. The difference is the *locus of uncertainty*.
      *   *Refining the "Verdict":* Don't say "it depends." Say "GD is the substrate, AD is a pattern."

  8.  **Self-Correction/Edge Case Check:**
