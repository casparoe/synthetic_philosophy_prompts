answer: |-
  Here are the desiderata for a claim of underdetermination to constitute a substantive threat to scientific realism or rational theory choice.

  ### 1. Robust Empirical Equivalence (EE)
  **The Requirement:** The rival theory must entail the exact same set of observational consequences as the target theory, not merely share the subset of consequences currently tested. It must match all *possible* evidence derivable from the target theory, including future experimental outcomes.
  **The Consideration:** Mere "unrefutedness" is insufficient. Two theories can coexist simply because technology is not yet precise enough to distinguish them (e.g., early atomic models). If the equivalence breaks under novel testing conditions, the underdetermination is merely a gap in current data, not a structural feature of the theory-evidence relationship. Realism is threatened only if no possible evidence could ever discriminate.

  ### 2. Non-Triviality (Ontological Distinctness)
  **The Requirement:** The rival theory must posit a genuinely distinct ontology or causal structure. It cannot be a mere notational variant, a coordinate transformation, or a syntactic relabeling of the target theory.
  **The Consideration:** This addresses the "gerrymandering" objection. If a rival is generated by simply renaming variables (e.g., positing that "electrons" are actually "schmelectrons" with inverted charge definitions but identical behavior), it does not represent a distinct world-state. A threat to realism requires that the world could actually be *different* in a way that matters, not just described differently. If the rivalry is linguistic rather than metaphysical, it threatens semantics, not realism.

  ### 3. Endurance (Transient vs. Permanent)
  **The Requirement:** The underdetermination must be shown to be permanent (in-principle) or enduring enough to span the lifespan of the theory's acceptance. It cannot be a transient state awaiting better instrumentation or auxiliary hypotheses.
  **The Consideration:** Most historical cases of underdetermination are transient; later developments resolve them. If the underdetermination is temporary, it supports a fallibilist epistemology but not anti-realism. To threaten realism, one must show that the evidence *cannot* converge on a unique theory, not that it *has not yet* converged.

  ### 4. Local Scope (Piecemeal vs. Holistic)
  **The Requirement:** The claim must specify whether the underdetermination applies to specific theoretical modules (local) or the entire web of belief (global). It cannot slide from a local case to a global conclusion without argument.
  **The Consideration:** Local underdetermination (e.g., specific interpretations of quantum mechanics) allows for realism about the rest of science. Global underdetermination (all evidence is compatible with infinite world-structures) implies total skepticism. Proponents often cite local cases to motivate global skepticism. A valid argument must either prove global underdetermination directly or explain why local instances generalize without collapsing the distinction between core theory and auxiliary assumptions.

  ### 5. Methodological Neutrality
  **The Requirement:** The construction of the rival theory cannot presuppose the illegitimacy of the very ampliative methods (e.g., Inference to the Best Explanation, simplicity, coherence) that the realist uses to break ties.
  **The Consideration:** Realists often argue that while evidence underdetermines theory *deductively*, it does not do so *ampliativley*. If the underdetermination argument assumes that only deductive relations count as evidence, it begs the question against the realist. To be a fair challenge, the rival must remain viable even when standard theoretical virtues are applied.

  ***

  ### The Primary Deflator
  **Requirement 3 (Endurance)** does the most work to deflate the versions of the argument actually run in seminars and literature.
  Most interlocutors cite historical cases (e.g., Ptolemaic vs. Copernican systems at time *t*) or current stalemates (e.g., string theory variants) and treat them as proof of permanent in-principle underdetermination. However, history shows that almost all specific cases of empirical equivalence are eventually broken by new technology or the discovery of novel phenomena. By forcing the claim to demonstrate *permanence* rather than *current stalemate*, you shift the burden from the realist (to explain why we picked one) to the anti-realist (to prove we can never pick one). This collapses the majority of "historical induction" arguments for underdetermination.

  ### The Incompatible Pair
  You likely cannot satisfy **Requirement 4 (Global Scope)** and **Requirement 2 (Non-Triviality)** simultaneously.
  *   **Why:** To construct a **Global** rival (one that matches all possible evidence for an entire worldview), you generally need an algorithm that systematically transforms the target theory. However, every known algorithm for generating global rivals (e.g., Quine's "reconstrual of predicates") produces **Trivial** rivals (notational variants).
  *   **The Trade-off:** If you want a Non-Trivial rival, you can usually only construct it Locally (specific to a domain). If you want a Global rival, it will almost certainly be Trivial. A claim that asserts both Global Scope and Non-Triviality is almost certainly overstating its case.

  ***

  ### Regarding the "Gerrymandering" Objection
  The seminar participant's claim (that you can always relabel vocabulary to create a rival) is **not a genuine constraint**; it is a trivialization that fails **Requirement 2 (Non-Triviality)**.

  While it is logically true that one can construct infinite syntactic variants of a theory, these variants do not constitute distinct metaphysical hypotheses. They are the same theory wearing a mask. If your list of desiderata allows relabeling to count as underdetermination, the list is broken. You must explicitly exclude "algorithmic rivals" that lack independent motivation or distinct ontological commitments. The existence of logical space for a rival does not imply the existence of a *scientific* rival. Dismissing these cases is not ignoring the problem; it is recognizing that underdetermination is an epistemic problem about *knowledge of the world*, not a logical problem about *consistency of sentences*.
