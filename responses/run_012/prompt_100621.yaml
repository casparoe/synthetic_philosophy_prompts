prompt: |-
  I'm a second-year PhD in philosophy of science and I keep getting dragged into arguments where somebody says some theory or other is "underdetermined by the evidence" and then treats that as if it settles the realism debate by itself. Before I read any more of it I want the spec first. Write me the desiderata: what does a claim of underdetermination actually have to deliver to be a real problem for a realist (or for choosing between theories) — which cases it has to get right, which distinctions it can't just collapse (at-a-time vs in-principle, holistic vs piecemeal, genuine empirical equivalence vs mere unrefutedness), which background results it can't contradict. Give the consideration behind each requirement, say which single requirement does the most to deflate the versions people actually run, and flag any two requirements I probably can't have at once. One thing that keeps bugging me: a guy in my seminar said underdetermination is trivial because you can always gerrymander a rival by relabeling the theoretical vocabulary so it makes the same predictions — is that a genuine constraint on the list or just him being clever? Skip the scorecard of who said what, I only want the requirements.
