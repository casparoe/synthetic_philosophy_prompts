answer: |-
  **Exam Question**

  In lectures, we distinguished between two properties often conflated under 'logical omniscience': **tautology-omniscience** (an agent knows all logical validities) and **closure-omniscience** (an agent's knowledge is closed under known implication). We argued these properties are separable and that closure-omniscience is the specific threat that renders reasoning pointless.

  1.  Construct a small, concrete model or scenario (formal or semi-formal) featuring an agent who exhibits **tautology-omniscience** but fails **closure-omniscience**. Explicitly show how the separation works in your construction.
  2.  Explain why closure-omniscience, rather than tautology-omniscience, undermines the value of deductive reasoning.
  3.  Evaluate whether introducing 'impossible worlds' resolves both properties simultaneously. Identify any theoretical cost incurred by this repair (e.g., regarding the nature of knowledge or primitive stipulations).

  ***

  **Model Answer**

  Tautology-omniscience requires an agent to know every logical validity regardless of content. Closure-omniscience requires that if an agent knows $p$ and knows $p \to q$, they necessarily know $q$. Standard possible-worlds models enforce both, but they can be decoupled.

  To construct an agent who is tautology-omniscient but not closure-omniscient, consider a syntactic model where knowledge is defined by a specific set of formulas $K$ held by the agent. Let the logic include the axiom schema $A \to A$. We stipulate that $K$ contains every substitution instance of this axiom; thus, the agent knows all validities of this form, satisfying a fragment of tautology-omniscience. However, we define $K$ such that it is not closed under Modus Ponens. Specifically, let $p \in K$ and $(p \to q) \in K$, but $q \notin K$. In this scenario, the agent possesses the relevant logical truths (the tautologies) and the specific premises, yet fails to possess the consequence. The separation is clear: the agent has the logical tools (tautologies) but fails to apply them consistently (closure).

  This separation clarifies why closure-omniscience is the genuine threat to rationality. If an agent is merely tautology-omniscient, they still face the task of combining known truths to derive new ones; reasoning remains a process of synthesis. However, if an agent is closure-omniscient, the consequence $q$ is already in the knowledge set the moment $p$ and $p \to q$ are known. Deduction does not expand the agent's epistemic state; it merely reiterates what is already implicitly held. Reasoning becomes pointless because there is no epistemic gap for deduction to bridge. Tautology-omniscience leaves the gap open; closure-omniscience closes it prematurely.

  Regarding repairs, impossible worlds semantics attempts to fix closure-omniscience by allowing accessible worlds where logical laws fail. In such a model, an agent can know $p$ and $p \to q$ (true at all normal and impossible worlds they access) while $q$ is false at some accessible impossible world. This successfully breaks closure-omniscience. It typically breaks tautology-omniscience as well, since impossible worlds can falsify standard validities like $A \to A$.

  However, this repair incurs a significant theoretical cost. By allowing worlds where logic fails, we risk abandoning the idea that knowledge is a propositional attitude grounded in truth conditions. If a 'world' can make $p$ and $p \to q$ true while $q$ is false, the semantic value of connectives becomes unstable. Alternatively, to prevent total collapse, one must smuggle in awareness primitives—stipulating which impossible worlds are accessible based on the agent's computational limits. This shifts the explanatory burden from the logic itself to extra-logical constraints on the agent's architecture. Thus, while impossible worlds separate the two omnisciences, they do so by potentially sacrificing the standard semantic interpretation of knowledge or relying on unexplained psychological primitives.

  **Load-Bearing Claim and Vulnerability**
  The argument rests on the claim that the sole value of deductive reasoning is the expansion of known content (moving from unknown to known). If reasoning has value even when consequences are already known—for instance, in increasing certainty, justification, or cognitive availability—then closure-omniscience does not make reasoning pointless. The reasoning is shakiest here: it assumes a purely extensional view of knowledge, ignoring the psychological or justificatory benefits of deriving what one already implicitly knows.

  ***

  **Marking Scheme**

  **Total: 20 Marks (5 Points × 4 Marks)**

  1.  **Definition and Distinction:** Clearly defines tautology-omniscience and closure-omniscience as distinct properties without conflating them.
      *   *Typical Failure:* Treating them as the same problem or defining closure merely as "knowing logic."
  2.  **Concrete Construction:** Provides a valid scenario (syntactic set, specific model, etc.) where the agent knows validities but fails Modus Ponens (or equivalent closure).
      *   *Typical Failure:* Describing the separation abstractly without a concrete instance of $p, p \to q \vdash \neg Kq$.
  3.  **Reasoning Argument:** Correctly identifies closure (not tautologies) as the property that eliminates the epistemic gap required for reasoning to have value.
      *   *Typical Failure:* Arguing that knowing tautologies is the main problem because humans are bad at logic.
  4.  **Repair Evaluation:** Accurately assesses impossible worlds as breaking closure (and usually tautologies) but notes the semantic or primitive cost.
      *   *Typical Failure:* Claiming impossible worlds solve the problem cleanly without mentioning the cost to propositional attitudes or primitives.
  5.  **Critical Trade-off:** Identifies that fixing the logic often requires smuggling in psychological constraints or abandoning standard semantics.
      *   *Typical Failure:* Listing solutions without critiquing the theoretical price paid for each.

  **Differentiator (17+ vs 13):** A 17+ answer integrates the theoretical cost into the evaluation of the repair (Point 5 informs Point 4), showing why the fix is unstable; a 13 answer lists the fix and the cost as separate observations without connecting them.
