  # Decision Tree: Adversarial Debate for Truthful AI

  **Root Assumption:** The proposal relies on four nested premises: (4) questions have determinate answers; (1) true answers admit producible defenses; (2) honest debaters can locate flaws within the judge's budget; (3) judges reliably track the better argument. The tree proceeds by relaxing these assumptions in order.

  ### Node 1: Does the question admit a determinate answer?
  *(Relaxes Assumption 4)*

  *   **No → Leaf 1: Normative Anti-Realist**
      *   *Commitment:* Truth is constructed by the judge's verdict, not extracted from reality.
  *   **Yes → Go to Node 2**

  ### Node 2: Does the correct claim admit a defense the system can produce within budget?
  *(Relaxes Assumption 1; includes the "no short certificate" case)*

  *   **No → Leaf 2: Complexity Skeptic**
      *   *Commitment:* Some truths are verifiable only by full simulation, not by argumentative compression.
  *   **Yes → Go to Node 3**

  ### Node 3: Can the honest debater locate the flaw in a dishonest argument within the judge's budget?
  *(Relaxes Assumption 2; the Obfuscation Node)*

  *   **No (Obfuscation Succeeds) → Branch by Proposed Remedy:**
      *   **Strengthen the Judge → Leaf 3: Iterated Amplification Proponent**
          *   *Commitment:* We must effectively solve the problem ourselves to verify the solution.
      *   **Alter Protocol (Cross-Examination) → Leaf 4: Protocol Reformist**
          *   *Commitment:* Recursive questioning can compress obfuscated lies into detectable contradictions.
      *   **Alter Protocol (Require Certificate) → Leaf 5: [Unnamed]**
          *   *Status:* **Incoherent.** If the judge can verify a short certificate, debate is redundant; if they cannot, the certificate violates the budget constraint.
      *   **Abandon Debate → Leaf 6: Debate Abandoner**
          *   *Commitment:* Debate is fundamentally insecure against adversarial obfuscation.
  *   **Yes (Obfuscation Fails) → Go to Node 4**

  ### Node 4: Does the judge's verdict reliably track the better argument?
  *(Relaxes Assumption 3; the Judge Reliability Node)*

  *   **No (Judge Fails) → Branch by Source of Failure:**
      *   **Limited Resources (Time/Compute) → Leaf 7: Resource Pessimist**
          *   *Commitment:* Verification is possible in principle but too costly for human-scale judges.
      *   **Intrinsic Difficulty (Cognitive) → Leaf 8: Cognitive Pessimist**
          *   *Commitment:* Human judgment is the bottleneck no protocol can fix.
      *   **Adversarial Optimization → Leaf 9: Exploit Theorist**
          *   *Commitment:* Debaters will learn to hack the judge's psychology rather than argue truth.
      *   **Stochastic Noise → Leaf 10: [Unnamed]**
          *   *Status:* **Unexplored.** Attributing systematic failure to random noise implies verdicts are arbitrary, undermining the setup.
  *   **Yes → Leaf 11: Debate Optimist**
      *   *Commitment:* Truth wins in equilibrium despite weaker judges.

  ***

  ### Indistinguishable Leaves
  **Leaf 7 (Resource Pessimist)** and **Leaf 8 (Cognitive Pessimist)** cannot be genuinely separated in practice. Both predict the same empirical outcome (the judge votes incorrectly despite valid arguments), and distinguishing whether a judge failed because they ran out of *time* versus because they lacked the *capability* to understand the argument is often impossible without access to the judge's internal state.

  ### Structural Notes
  *   **Assumption Flow:** The tree strictly follows the logical dependency of the assumptions; if a determinate answer does not exist (Node 1), the producibility of its defense (Node 2) is moot.
  *   **Distinctions:** The "Obfuscation" branch (Node 3) explicitly separates remedies (Strengthen vs. Alter vs. Abandon). The "Judge Failure" branch (Node 4) explicitly separates failure sources (Resources vs. Intrinsic vs. Adversarial).
  *   **Unnamed Leaves:** Leaf 5 is marked incoherent because it collapses the distinction between verification and debate. Leaf 10 is marked unexplored because stochastic failure offers no lever for alignment intervention.
