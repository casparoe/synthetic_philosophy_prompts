  *(Self-Correction on Case 3)*: Initially, I thought about denying Case 3 outright. But the prompt asks to take hindsight seriously. If they made a reasonable choice at the time, is it fair to punish them just because it failed? Maybe a partial award is better. Let's go with a one-time emergency grant to prevent immediate homelessness, but no ongoing support. This balances the "choice" aspect with the "sufficiency" aspect.

  *(Self-Correction on Case 2)*: The prompt asks if denying is defensible if it leaves them below a decent minimum. I should argue *no*, it's not defensible under Clause 2, even if Clause 1 suggests denial. This highlights the tension.

