      *   Constraints (engineer chooses materials, selection works with what's there).
      *   Perfection (engineer aims for optimal, selection aims for "good enough").

  4.  **Drafting the Impact Analysis (Which breaks matter?):**
      *   *Function-talk:* Survives? Yes, etiological accounts of function don't need a mind, just history of selection.
      *   *Optimality models:* Survives? Mostly, as heuristic tools, but must acknowledge constraints (local optima vs. global).
      *   *Competence vs. Comprehension:* Survives? Yes, this is the core strength. Selection produces competence without comprehension.

  5.  **Drafting the Better Analogy:**
      *   What's better than an engineer?
      *   A Tinkerer (Jacob's "Evolution as Tinkering").
      *   Or an Algorithm/Search Process.
      *   "Tinkerer" captures the makeshift nature better.

