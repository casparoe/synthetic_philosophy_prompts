      **Where the Mapping Breaks**
      The engineer possesses foresight and intent; selection has neither. An engineer chooses materials to fit a blueprint; selection must work with available variation constrained by history (path dependence). An engineer seeks a global optimum; selection settles for local optima ("good enough"). Finally, the engineer is external to the product; selection is an immanent process within the population.

