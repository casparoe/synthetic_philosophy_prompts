  The Dry Basin

  Look to the winners who stood on the stand,
  Look to the winners who ruled this land,
  Look to the winners with trophy in hand.
  We build a new temple on sand and on gravel,
  We build a new temple where engines travel,
  We build a new temple, we never unravel.
  The past is a muscle we flex for the now,
  The past is a sweat on the present brow,
  The past is a claim we allow.
  The concrete holds the shape of what is gone.
  Same triumph waits for the parking dawn.
  Same victory hums in the asphalt drawn.

  The ticket booth wood is weathered gray,
  The diving board steel is rusted away,
  The whitelist names are filed in tray,
  The chlorine scent is locked in clay.
  The shallow end depth is marked in stone,
  The deep end quiet is fully known,
  The lifeguard whistle is left alone,
  The rules of entry are overgrown.
  Preserve the tile. Preserve the crack.
  Preserve the lock. Keep nothing back.
  The concrete holds the shape of what is gone.
  Nothing new is worth carrying on.

  Burn the logbook. Bury the gate.
  The exclusion zone meets a heavier fate.
  Break the wall that guarded the gates.
  Drag the gravel. Fill the deep.
  Secrets are things we no longer keep.
  Judgment is sharp and the cut is clean.
  We scrub the algae from the scene.
  We kill the ghost to keep it green.
  The concrete holds the shape of what is gone.
  But I am the seed that the tree dropped down,
  And if I burn the root, I burn the crown,
  and I am the ash on this new ground.

  The steamroller rests. The lot is flat.
  The past cannot answer questions like that.
  Does this serve life? The gravel says nothing.
  Cars will park here. The engine is humming.
  I stand at the edge. The space is wide.
  There is no answer on the other side.
