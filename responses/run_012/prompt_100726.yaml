  ## 3. Instructor Scripts & Materials Detail

  ### The Intel Packets (Print these on different colored paper)

  **Packet A (Tables 1 & 2)**
  > **AUTOMATED SIGNAL DECODED**
  > **Content:** Conditional Probability Constraint
  > **Statement:** "IF the drone is in the NORTH half, THEN it is in the EAST half."
  > **Confidence:** 80% ($P(East | North) = 0.8$)
  > **Note:** No information is provided regarding the probability of the drone being in the North or South halves directly.

  **Packet B (Tables 3 & 4)**
  > **AUTOMATED SIGNAL DECODED**
  > **Content:** Conditional Probability Constraint
  > **Statement:** "IF the drone is in the WEST half, THEN it is in the SOUTH half."
  > **Confidence:** 80% ($P(South | West) = 0.8$)
  > **Note:** No information is provided regarding the probability of the drone being in the East or West halves directly.

  *(Instructor Note: Logically, "If N then E" is equivalent to "If not-E then not-N". Since West is not-East and South is not-North, these are contrapositives. They describe the same state of affairs.)*

  ### The "Cheat Sheet" for You (Do Not Distribute)
  *   **Team A Solution (Fix North):**
      *   $P(N) = 0.5$ (Fixed)
      *   $P(E|N) = 0.8 \rightarrow P(NE) = 0.4, P(NW) = 0.1$
      *   South remains proportional to prior ($P(S)=0.5$). Prior ratio SE:SW was 2:3.
      *   $P(SE) = 0.2, P(SW) = 0.3$
      *   **Focus:** $P(SW) = 0.3$
  *   **Team B Solution (Fix West):**
      *   $P(W) = 0.5$ (Fixed)
      *   $P(S|W) = 0.8 \rightarrow P(SW) = 0.4, P(NW) = 0.1$
      *   East remains proportional to prior ($P(E)=0.5$). Prior ratio NE:SE was 3:2.
      *   $P(NE) = 0.3, P(SE) = 0.2$
      *   **Focus:** $P(SW) = 0.4$
  *   **The Conflict:** Team A says $P(SW)=0.3$. Team B says $P(SW)=0.4$. Same info, different result.

