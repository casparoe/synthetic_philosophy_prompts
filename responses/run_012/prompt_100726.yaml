answer: |-
  Here is a complete design for a 90-minute seminar activity. It is built to generate the disagreement organically through framing effects, forcing students to confront the underdetermination of conditional updating without you having to lecture them into it.

  # Activity Title: Operation Gridlock
  **Goal:** Demonstrate that updating on conditional information ($P(B|A)=k$) is underdetermined by the probability axioms alone.
  **Core Mechanic:** Half the class receives the evidence framed one way; half receives the *logically equivalent* evidence framed differently. Both groups use the same intuitive updating rule ("Preserve the Antecedent"). They arrive at different conclusions.

  ## 1. Materials & Setup
  *   **Room:** 4 tables of 4 students (16 total).
  *   **Handouts:**
      *   **Mission Brief (All):** Contains the Map and Priors.
      *   **Intel Packet A (Tables 1 & 2):** The "North" framing.
      *   **Intel Packet B (Tables 3 & 4):** The "West" framing.
      *   **Index Cards:** 4 colors (one per student).
      *   **Whiteboard:** Divided into four quadrants (NE, NW, SE, SW).
  *   **The Numbers (Write these on the board before class):**
      *   **Search Grid:** Four Quadrants (NE, NW, SE, SW).
      *   **Prior Credences:**
          *   $P(NE) = 0.3$
          *   $P(NW) = 0.2$
          *   $P(SE) = 0.2$
          *   $P(SW) = 0.3$
      *   *Check:* $P(North) = 0.5$, $P(South) = 0.5$, $P(East) = 0.5$, $P(West) = 0.5$.

  ## 2. Minute-by-Minute Timeline

  ### Phase 1: Calibration (00:00 – 00:15)
  *   **00-05:** **Briefing.** Hand out the **Mission Brief**. Explain the scenario: A drone is lost. We have prior probabilities based on weather patterns (the numbers on the board). We need to allocate search resources based on updated credences.
  *   **05-15:** **Private Commitment.** Hand out **Index Cards**.
      *   *Instruction:* "On your card, write your name and your current credence for **North** ($P(N)$) and **East** ($P(E)$). Do not talk to your neighbors."
      *   *Collect & Tally:* Quickly scan the cards. They should all say $P(N)=0.5, P(E)=0.5$.
      *   *Say:* "Good. We are calibrated. We all agree on the starting state."

  ### Phase 2: The Update (00:15 – 00:40)
  *   **00-15:** **Distribute Intel Packets.**
      *   Give **Packet A** to Tables 1 & 2.
      *   Give **Packet B** to Tables 3 & 4.
      *   *Crucial Instruction:* "Do not show your packet to the other tables. This is classified intel. You have 10 minutes to agree on a new probability distribution for the four quadrants (NE, NW, SE, SW). The numbers must sum to 1.0."
  *   **00-25:** **Team Work.** Circulate.
      *   *If a team asks:* "Can we change the probability of North?"
      *   *Your Answer:* "You are rational agents. You received new information. Do what you think a rational agent should do." (Do not validate either method).
      *   *Expected Outcome:* Most will intuitively "Preserve the Antecedent."
          *   **Team A** (Given $P(E|N)=0.8$) will likely keep $P(N)=0.5$. They will set $P(NE)=0.4, P(NW)=0.1$. They will leave South proportional ($P(SE)=0.2, P(SW)=0.3$).
          *   **Team B** (Given $P(S|W)=0.8$) will likely keep $P(W)=0.5$. They will set $P(SW)=0.4, P(NW)=0.1$. They will leave East proportional ($P(NE)=0.3, P(SE)=0.2$).
  *   **00-35:** **The Reveal.** Ask one spokesperson from Team A and one from Team B to write their final four numbers on the whiteboard quadrants.
      *   **Team A:** NE=0.4, NW=0.1, SE=0.2, SW=0.3
      *   **Team B:** NE=0.3, NW=0.1, SE=0.2, SW=0.4
  *   **00-40:** **The Collision.**
      *   *Point out:* "Look at **NW**. You both agree it is 0.1. Look at **SE**. You both agree it is 0.2. But look at **NE** and **SW**."
      *   Team A thinks SW is 0.3. Team B thinks SW is 0.4.
      *   *Ask:* "You had the same priors. You are all rational. Did one of you make a calculation error?"
      *   *Let them argue.* They will check each other's math. The math is fine. The disagreement is principled.

  ### Phase 3: The Twist (00:40 – 01:00)
  *   **00-40:** **Swap Packets.** "Okay, Mission Control realized there was a transmission error. Table 1 & 2, swap packets with Table 3 & 4. You now have the *other* report."
  *   **00-45:** **Re-Evaluation.** "Read the new packet. Does this change your mind about your previous calculation? Discuss for 5 minutes."
  *   **00-50:** **The Realization.**
      *   Team A reads: "If West, then South (0.8)."
      *   Team B reads: "If North, then East (0.8)."
      *   *Prompt:* "Are these reports saying different things about the world, or are they saying the same thing?"
      *   *Guide them:* "If it is not the case that (North and Not-East), then if North, East. If West (Not-East), then South (Not-North)." They are logically equivalent constraints on the *truth*, but they frame the *condition* differently.
  *   **00:55:** **The Trap.** "If you used the rule 'Keep the probability of the IF-part fixed,' you just committed to two different realities based on the same information. Raise your hand if your probability for **South-West** changed just because I swapped the paper."
      *   *Result:* Hands go up. The "Preserve Antecedent" rule is framing-sensitive.

  ### Phase 4: Debrief & Diagnosis (01:00 – 01:30)
  *   **01:00-01:15:** **Map the Intuitions.**
      *   Ask Team A: "Why did you keep $P(North)$ at 0.5?"
          *   *Expected:* "The report told us about East-given-North. It didn't tell us anything about whether it was North or not. So North shouldn't change." (This is Van Fraassen's initial intuition).
      *   Ask Team B: "Why did you keep $P(West)$ at 0.5?"
          *   *Expected:* "Same reason. The report was about South-given-West. It didn't mention West's probability directly."
      *   *The Point:* Both intuitions are locally rational but globally inconsistent.
  *   **01:15-01:25:** **The Theoretical Wall.**
      *   Explain: "In standard Bayes, we update on *events* (I learned $E$ is true). Here, you learned a *constraint* ($P(E|N)=0.8$). Jeffrey Conditioning doesn't apply because you didn't learn a partition. Simple Conditionalization doesn't apply because you didn't learn a fact."
      *   Explain: "This is the **Judy Benjamin Problem**. The probability axioms do not tell you how to update on conditional information. You need a second-order principle."
      *   Introduce the competitor: "Some say minimize information loss (Maximum Entropy/MinCrossEnt). That method would have shifted $P(North)$ slightly in both cases to keep the 'distance' from the prior minimal. It would have given you the same answer regardless of the packet framing."
  *   **01:25-01:30:** **Closing.**
      *   "You felt the unease I feel. The math didn't break, but the rule did. Next week we discuss whether 'Minimize Information Loss' is the right fix, or if the problem shows rationality is indeterminate here."

