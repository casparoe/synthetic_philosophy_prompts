prompt: |-
  Hey, I need help designing a class activity and I'm stuck on the mechanics. Quick context: I run a 90-minute session in an upper-level formal epistemology seminar, about 16 students, and I want them to actually feel the Judy Benjamin problem in their bones rather than nod along to it. I'm pretty comfortable with Bayes but this one still makes me uneasy, so I want the students to hit the wall themselves before I say anything. Assume I'm fine with the philosophy but rusty on activity design, so take the pedagogy seriously.

  Here's the scenario I've been tinkering with, set in a made-up search-and-rescue op (nothing real, so they can't just look it up). A weather drone has gone down somewhere in a rectangular area split into four quadrants: NE, NW, SE, SW. The pre-mission forecast gives prior credences NE = 0.3, NW = 0.2, SE = 0.2, SW = 0.3. The drone's last automated packet comes in and it isn't a location, it's a conditional: it reports that if the drone is in the northern half then it's in the eastern half, at about 80% confidence -- so it tells you P(east | north) is roughly 0.8 and says nothing else about where it is.

  When I tried to update on this myself I got two different answers from two procedures that both felt fine. One keeps the chance of "north" exactly where it was, 0.5, and just redistributes inside the north half so that east-given-north is 0.8, leaving the south untouched. The other throws out the old numbers entirely and looks for the new distribution that's as close as possible to my old one while still respecting the 80% figure. Different answers, and honestly I couldn't tell you which is right, or whether the question even has an answer until you say something extra about what the packet is and how it was generated.

  So: act as an expert in formal epistemology and probability who's also a genuinely good teacher, and design me a runnable 90-minute activity around this. Brainstorm a few options internally first, then pick the one where the disagreement shows up in what the students do, not in what I tell them. I want them to (a) each produce credences, (b) discover they disagree, (c) try to argue each other out of it and fail, and (d) only then get the diagnosis. Give me roles or teams, the materials (I'd rather use index cards and a whiteboard than laptops), a minute-by-minute timeline, and the exact priors and numbers I should put on the board. I want them to definately feel the force of it, not just hear about it.

  Build in a second packet or some twist so the same thing bites twice -- maybe have them update on two conditional reports and compare notes on what happened, or hand different teams slightly different framing of the same message, whatever you think lands hardest. Then a debrief that maps the specific moments in the activity onto the general point about updating on conditionals versus updating on events, and tells me what to say about why the ordinary rule doesn't apply here.

  Be honest with me about two things. First, what will predictably go wrong the first time I run this -- I've never done a structured-disagreement activity before and I expect one or two loud students to steamroll it, and I don't know how to handle the team that just refuses to move off its number. Second, which part of the underlying idea the activity can't reproduce, so I know what I have to supply myself in the debrief. No reading lists or citations needed, I just need the thing to actually run.
