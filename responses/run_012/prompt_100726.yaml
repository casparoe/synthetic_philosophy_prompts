  ## 4. Honest Assessment: Pitfalls & Limitations

  ### What Will Predictably Go Wrong (And How to Fix It)
  1.  **The "Math Anxiety" Freeze:**
      *   *Risk:* Students stare at the packet, afraid to calculate without a formula.
      *   *Fix:* At minute 20, if silence persists, say: "There is no formula in the book for this. I want your *rational intuition*. If you heard that report, what would you bet?"
  2.  **The "Steamroller" Student:**
      *   *Risk:* One student knows Bayes well, dictates the "Fix Antecedent" method, and the team complies without feeling the tension.
      *   *Fix:* The **Private Commitment** (Phase 1) is your shield. But in Phase 2, circulate and ask the quiet students: "Do you agree with that number? Why?" If a team finishes too fast, ask them: "What would happen if the report said 'If West, then South' instead? Would your numbers change?" (Don't let them check yet).
  3.  **The "Stubborn Team" (Refusal to Move):**
      *   *Risk:* A team insists their number is the *only* rational one and dismisses the other team as wrong.
      *   *Fix:* Use the **Packet Swap**. When Team A sees Packet B, ask: "Is this information false?" No. "Is it different?" No. "So why did your number for SW change?" Force them to defend the *rule*, not the number.
  4.  **Convergence:**
      *   *Risk:* Somehow, everyone uses Maximum Entropy intuitively (unlikely) or everyone uses "Fix Antecedent" and doesn't notice the framing difference.
      *   *Fix:* You must explicitly draw the whiteboard comparison. Highlight the **SW** quadrant. If they don't see the conflict, *show* them the conflict. "Team A says 0.3. Team B says 0.4. One of you is allocating 33% more resources to this quadrant based on a sentence structure."

  ### What This Activity Cannot Do (Your Job in the Debrief)
  1.  **It Does Not Prove MaxEnt is Correct:**
      *   The activity proves "Simple Conditionalization / Preserve Antecedent" is flawed (framing sensitive). It does *not* prove that Minimum Cross-Entropy (MaxEnt) is the right solution. MaxEnt has its own objections (e.g., it shifts probabilities of things you explicitly learned nothing about).
      *   *Your Line:* "We broke the 'Preserve Antecedent' rule today. We did not fix epistemology. We just found out the easy tool is broken. The search for the right tool is still open."
  2.  **It Abstracts the "Why":**
      *   Students will feel the *math* conflict, but they might not feel the *philosophical* weight (why should learning a conditional change the antecedent's probability?).
      *   *Your Line:* You need to supply the intuition for why MaxEnt shifts the antecedent. (e.g., "If I learn 'If it rains, the ground is wet', do I become more confident it rained? Maybe, because wet grounds are more common when it rains. The worlds where the conditional holds might be clustered in a way that shifts the marginals.")
  3.  **It Doesn't Solve the "Van Fraassen" Objection:**
      *   Van Fraassen argued that there *is* no unique solution. The activity might make students think there *must* be one.
      *   *Your Line:* "Some philosophers look at this activity and say: 'Both teams were rational.' That's the radical view. Indeterminacy. Keep that in mind for the reading."

  ### Final Pedagogical Tip
  Since you mentioned you are "rusty on activity design," **write the numbers on the board beforehand.** Do not trust yourself to calculate $0.5 \times 0.8$ correctly while managing 16 students. Have the "Team A" and "Team B" solutions pre-written on a hidden part of the whiteboard (or a slide) so you can reveal them instantly if the students get stuck on the arithmetic. The goal is the *philosophical conflict*, not the multiplication.
