  There is a principle that ties almost all of your intuitions together, but to make it work, you have to accept that your verdict on **kidney sales** is inconsistent with your verdict on **surrogacy**.

  The principle I would defend is **"The Corruption of Social Meaning."**

  This principle argues that markets are not neutral tools; they change the nature of the goods being traded. When you put a price on something, you shift it from a social or moral norm (gift, duty, love, citizenship) to a market norm (profit, exchange, consumption). If that shift degrades the value of the thing or undermines human dignity, the market is forbidden.

  Here is how this principle sorts your list:

  *   **Generators & Tickets:** These are commodities. Putting a price on them doesn't change their meaning; it just allocates scarcity. (Allowed)
  *   **Votes:** Voting is a civic duty based on equality. Selling it turns citizenship into a commodity, corrupting democracy. (Banned)
  *   **Grades:** Education is about learning and mastery. Paying for As turns learning into a transaction, crowding out intrinsic motivation. (Bothersome/Banned)
  *   **Baby Naming:** A name is an act of parental love and identity. Selling it turns a child into a billboard. (Banned)
  *   **Surrogacy:** Reproduction is intimately tied to human dignity and family. Paying a poor woman to carry a child turns reproduction into a manufacturing service and the child into a product. (Banned)
  *   **Mourners:** Grief at a funeral can be performative. Hiring a mourner doesn't corrupt the meaning of death or family in the same way; it's a service, like a florist. (Allowed)

  ### The Verdict You Must Give Up: Kidney Sales

  You currently allow regulated kidney sales but ban surrogacy. Under the **Corruption of Social Meaning** principle, these two cases are morally identical.

  You argue that kidney sales are fine if "rules keep desperate people out." But that is an idealization. In reality, a market for organs inevitably commodifies the human body, treating it as a warehouse of spare parts rather than an integral whole. If you ban surrogacy because "money is doing something there that it shouldn't" regarding the body and reproduction, you must also ban kidney sales. Money corrupts the meaning of bodily integrity in both cases.

  You cannot hold that selling a womb is a violation of human dignity while selling a kidney is a neutral market transaction. Both treat the body as a means to an end rather than an end in itself. To be consistent, **you should ban kidney sales.**

  ### The Prediction: Drug Trials in Poor Countries

  This principle gives a clear prediction for your unresolved case: **Paying people in poor countries to be subjects in risky drug trials should be banned (or severely restricted).**

  Here is why:
  1.  **Exploitation of Vulnerability:** Like the surrogacy case, this relies on economic desperation. A "poor country" subject cannot give truly free consent when the payment represents a year's wages. This mirrors your objection to surrogacy in a poor country.
  2.  **Instrumentalization:** It treats vulnerable human beings as test subjects for the benefit of wealthy nations. This corrupts the medical norm of "do no harm" into a norm of "risk for profit."

  If the trial offers the *same* standard of care and risk as it would in a rich country, and the payment is not coercive, it might pass. But your description ("paying people in poor countries") implies the arbitrage of risk—doing it there *because* it is cheaper or less regulated. That is a violation of human dignity under this principle.

  ### Summary
  Your gut is tracking the difference between **markets for things** (generators, tickets) and **markets for human integrity** (votes, bodies, children, education). You just drew the line in the wrong place on kidneys. Move the line to exclude all bodily markets, and your philosophy becomes coherent.
