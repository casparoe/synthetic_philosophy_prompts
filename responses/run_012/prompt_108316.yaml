  I'm a software engineer with no real philosophy backround, and I've somehow been roped into co-teaching the last session of an upper-level seminar on minds and machines. My job is to write the one essay question on the LLM-understanding fight, plus a model answer and a marking scheme so the TAs can grade it consistently. Students get 90 minutes.

  I don't want a question people can pass by reciting either the parrot side or the autocomplete side. Here's the angle I want to force. In animal-behavior research there's an old rule — I forget whose, some Victorian guy — that you shouldn't credit a creature with the fancier mental faculty when a dumber one explains the same behavior, and that's roughly the whole parrot case applied to models. But I also know from my day job that people now do things like swap an internal activation from one forward pass into another and check whether the output moves the way their hypothesis predicts. So: does that kind of internal, interventional evidence settle whether the model understands, or does it just push the fight up a level, to whether those internal states are genuinely representations rather than convenient bookkeeping?

  Write the question so a student has to take a stand on whether the disagreement is empirical, conceptual, or merely verbal, and has to say what evidence would actually move them. Model answer around 450–500 words. In the marking scheme, name the specific moves an A answer has that a B answer doesn't, and the two or three mistakes that should cost marks (I'm told students love to say it's all just definitions and then stop).

  Last thing: after the marking scheme, tell me which part of your model answer you're least confident about, and what argument or piece of evidence would change your mind about whether that really is the A-level answer.

  Whole reply under 900 words, please.
