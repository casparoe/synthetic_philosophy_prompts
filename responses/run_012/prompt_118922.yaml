answer: |-
  This is a rigorous and historically grounded philosophical challenge. You are asking for an audit of **Logical Empiricism's visual turn**, specifically the Neurathian project of *Isotype* (International System of TYpographic Picture Education) pushed to its radical limit: the claim that a *purely* pictorial syntax can sustain the full semantic load of empirical science, and that doing so offers an ontological advantage by bypassing the metaphysical traps of subject-predicate grammar.

  Here is an audit of that thesis, structured by the expressive tasks you identified, the boundary between the awkward and the impossible, and the weight of the convention objection.

  ### 1. The Expressive Audit: Awkward vs. Impossible

  To sustain the thesis, the pictorial language must map onto the logical structure of scientific propositions. We can categorize the required expressive tasks into those that are **merely awkward** (solvable with visual complexity) and those that are **plausibly impossible** (requiring non-pictorial operators).

  #### A. The Merely Awkward (Solvable via Visual Syntax)
  *   **Statistics and Aggregation:** Neurath's Isotype excelled here. Using repeated icons to represent quantities (one man-icon = 1,000 workers) is effective.
      *   *The Cost:* Precision is sacrificed for perspicuity. You cannot easily depict a *p*-value of 0.043 without numerals. You can show "a small sliver of error," but that is qualitative, not quantitative.
      *   *Verdict:* Possible, but reduces science to rough approximation.
  *   **Spatial/Temporal Relations:** Ordering icons in a sequence can denote time; placing them near each other can denote proximity.
      *   *The Cost:* Ambiguity. Does proximity imply causation? Correlation? Mere coincidence? In language, we use prepositions and verbs to specify the relation. In pictures, the relation is often implicit, risking the *post hoc ergo propter hoc* fallacy.
      *   *Verdict:* Possible, but epistemically risky.

  #### B. The Plausibly Impossible (The Logical Constants)
  This is where the thesis faces its strongest counter-evidence. Science is not just a catalog of observations; it is a system of inferences. Inference requires logical constants that resist pictorialization.

  *   **Negation:** How do you picture "not"?
      *   *Attempt:* A picture of a cat with a cross through it.
      *   *Failure:* The cross is a symbol, not a picture. It is a linguistic operator imported into the visual field. If you remove the cross, you have a cat. If you remove the cat, you have nothing (which could mean "no cat" or "no picture").
      *   *The Impossibility:* A picture presents a state of affairs ($S$). To assert $\neg S$, the medium must be able to present $S$ *as absent*. But presentation entails presence. You cannot depict the absence of a thing without depicting the space it occupies, which then becomes a depiction of empty space, not a negation of the object. Negation requires a **syncategorematic** term (a function word), which pictures, being categorematic (naming/showing things), cannot inherently supply.
  *   **Conditionals and Counterfactuals:** Science relies on laws: "If $X$, then $Y$," or "If gravity were weaker, $Z$ would happen."
      *   *Attempt:* A split panel showing $X$ and $Y$.
      *   *Failure:* This depicts a conjunction ($X$ and $Y$), not a conditional relationship. It shows what *is*, not what *would be*. To depict a counterfactual, you must depict a world that does not exist. While you can draw a fantasy scene, you cannot pictorially distinguish "this is a lie" from "this is a hypothetical model" without a caption or a symbolic frame (e.g., a thought bubble, which is a convention, not a picture).
      *   *The Impossibility:* Modality (necessity, possibility) is invisible. A picture of a falling apple looks exactly the same whether the fall is contingent or necessary. The "lawfulness" of the event is not a visual property.
  *   **The Assertion Gap:**
      *   *Problem:* A picture of a cat does not assert "There is a cat." It could be a command ("Find a cat"), a wish ("I want a cat"), or a hypothesis ("Suppose a cat").
      *   *Failure:* Language has mood (indicative, imperative, subjunctive). Pictures lack mood. To turn a depiction into an assertion, you need a "force indicator." In language, this is the grammatical structure. In a wordless system, you would need a visual marker (e.g., a border color) to indicate "This is asserted fact." That marker is a symbol, not a picture.

  ### 2. The Metaphysical Advantage: Illusion or Reality?

  The thesis claims an **epistemic advantage**: avoiding the "substance/accident" and "thing/property" distinctions imported by subject-predicate grammar.

  *   **The Defense:** In "The cat is black," grammar forces us to posit a 'cat' (substance) holding 'blackness' (accident). A picture simply shows a black-shape. It avoids reifying the noun.
  *   **The Audit:** This advantage is illusory.
      1.  **Reification of the Icon:** To use a picture as a sign, you must treat the icon as a discrete unit. Once you individuate the "cat-icon" from the "background," you have reintroduced the substance/property distinction ontologically, even if not grammatically. You have committed to *objects* existing in *space*.
      2.  **Theoretical Entities:** Empirical science is not just about middle-sized dry goods. It is about electrons, fields, and curved spacetime.
          *   *Prediction:* The thesis forbids the representation of unobservables that lack visual analogues.
          *   *Consequence:* To picture an electron, you must draw a sphere (a billiard ball model). This imports *more* metaphysics than the word "electron," which can remain abstract. The word allows agnosticism about the shape; the picture forces a commitment to shape. Thus, the pictorial language is *more* metaphysically loaded, not less.

  ### 3. The Convention Objection

  You ask: *How much weight does the objection deserve that pictures are convention-laden in just the way words are?*

  **It deserves decisive weight.** This is the "Goodmanian Critique" (from Nelson Goodman's *Languages of Art*).

  *   **The Argument:** There is no "natural" pictorial language. A drawing of a man is just as conventional as the word "man" relative to the actual entity. Both require a scheme of projection.
  *   **The Implication:** If the pictorial system is dense and continuous (like a realistic painting), it is semantically inert (too much information). If it is articulated and discrete (like Isotype icons), it is effectively a **visual code**.
  *   **The Trap:** If the icons are stylized enough to function as scientific notation (e.g., a specific gear shape for "industry"), they function as **ideograms**. Once they function as ideograms, they are subject to the same logical limitations as words. They do not escape the "metaphysical baggage" of language; they merely translate it into a visual register. The "epistemic advantage" vanishes because the convention required to make the picture *scientific* strips it of its *pictorial innocence*.

  ### 4. Predictions and Forbidden Ground

  If the Neurathian thesis were true, it would predict/forbid the following:

  *   **Forbidden:** Any scientific theory that relies essentially on higher-order logic or quantification over properties (not just objects). You cannot picture "For all properties $F$..."
  *   **Forbidden:** Probabilistic causation that isn't reducible to frequency. You can picture 9 out of 10 icons falling, but you cannot picture the *propensity* of the 10th.
  *   **Predicted:** A science limited to phenomenology. The system would work for biology (taxonomy), astronomy (positions), and sociology (demographics). It would fail for quantum mechanics, relativity, and theoretical economics.
  *   **Predicted:** Stagnation. Because the system cannot easily express negation or counterfactuals, it cannot formulate the falsification conditions required for Popperian scientific progress. It becomes a catalog of positive facts, not a engine of hypothesis testing.

  ### 5. The Retreat: Scaffolding as Surrender

  You ask: *If it retreats to the weaker claim that pictures can carry scientific content with verbal scaffolding but not without it, is that a qualification or a surrender?*

  **It is a surrender.**

  *   **Reason:** The core claim was that the *advantage* is epistemic and stems from the *absence* of verbal metaphysics. If you require verbal scaffolding to handle negation, modality, and assertion, then the verbal component is doing the logical heavy lifting.
  *   **The Result:** The pictures become **illustrations**, not the language itself. They serve a mnemonic or pedagogical role (which Neurath admitted was valuable), but they cease to be the vehicle of truth-conditions. If the words are needed to specify *what is being asserted* about the picture, the picture is not carrying the content; it is merely anchoring the reference.
  *   **Concession:** Defenders would have to concede that pictures are **parasitic** on language for their logical structure. They can show the *terms* of the proposition, but not the *proposition* itself.

  ### 6. The Demonstration of Impossibility

  You requested a demonstration that some content is *impossible* to picture. Here is the strongest candidate: **Disjunctive Generalization.**

  Consider the claim: *"Either the switch is up or the circuit is broken."*

  1.  **Visualizing the Disjunction:** You cannot draw a single image that is true if the switch is up (and circuit whole) OR if the switch is down (and circuit broken).
      *   If you draw both scenarios side-by-side, you have asserted a conjunction ("This happened AND this happened").
      *   If you draw a blurry image merging the two, you have asserted a specific third state (a blurry switch).
  2.  **The Logical Gap:** The "OR" is a function that operates on truth values, not visual features. There is no visual feature corresponding to logical disjunction.
  3.  **The Consequence:** Since empirical science relies on hypothesis testing (Theory A is true OR Theory B is true), a purely pictorial language cannot formulate the state of scientific inquiry itself. It can only display the winner after the fact. It cannot depict the *space of possibilities* from which science selects.

  ### 7. Final Verdict

  The Neurathian thesis is **motivationally sound but logically untenable.**

  *   **What to Dismiss as Prejudice:** The idea that words are inherently superior for *memory* or *engagement*. Pictures are demonstrably superior for pattern recognition and holistic data comparison. The bias against visuals is often class-based ( Neurath's actual battle was against text-heavy bourgeois education).
  *   **What to Concede as Real Cost:** The loss of **logical articulation**. A picture is "dense" (every detail matters); a sentence is "digitized" (only the discrete units matter). Science requires digitization to handle error and precision.
  *   **The Weight of Convention:** The objection that "pictures are conventional" destroys the claim of metaphysical neutrality. A visual code is just as capable of reifying bad ontology as a verbal language. A drawing of a "spirit" or a "phlogiston icon" reifies those concepts just as much as the nouns do.

  **Conclusion:** The thesis fails because it conflates **representation** with **assertion**. Pictures can represent states of affairs; they cannot, without symbolic augmentation, assert logical relations between them. Therefore, a wordless notation cannot carry the *whole* content of empirical science, because the "content" of science includes the inferential links between observations, and those links are invisible. The retreat to "pictures with scaffolding" is an admission that pictures are the *objects* of scientific language, not the *syntax*.
