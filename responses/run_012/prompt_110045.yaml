answer: |-
  ### Interview Questions & Follow-Ups

  **1. Topic: (a) Distinguishing Coordination from Status (Tipping)**
  **Question:** You argue that we must follow conventions that function as coordination equilibria but not those that encode status hierarchies. Take tipping: in some contexts, it's a wage subsidy locals rely on; in others, it's a class performance. What specific *empirical test* do you offer a visitor to distinguish these in real-time, without requiring a sociology degree?
  *   **Likely Answer:** She will likely say we look at whether the recipient suffers a material loss if the tip is withheld, versus merely a loss of face or status.
  *   **Follow-up 1:** But in the U.S., withholding a tip causes material loss *because* of the status convention that wages are low. Doesn't that make the material harm dependent on the unjust status structure, blurring your line?
  *   **Follow-up 2:** If the material harm is *produced* by the unjust hierarchy you say we can ignore, aren't you forcing the visitor to either sustain the injustice or inflict harm on a worker who is innocent of the system? How is that not a moral trap?

  **2. Topic: (a) Migration of Conventions (Queueing)**
  **Question:** You note conventions can migrate categories. Consider queueing: historically a fairness norm, but in VIP lines, it becomes status signaling. At what precise moment does the obligation to queue dissolve? Is it when the majority treat it as status, or when the *function* shifts?
  *   **Likely Answer:** She will likely argue it shifts when the primary function becomes exclusion rather than order, often signaled by local pushback against "cutters."
  *   **Follow-up 1:** If locals push back against cutters to protect a VIP privilege, that looks like enforcing a status convention, but by your metric (locals rely on it/cost imposed), it looks like a coordination equilibrium. How do you tell the difference between protecting order and protecting privilege?
  *   **Follow-up 2:** If you can't distinguish protecting order from protecting privilege in the moment, doesn't your view require visitors to assume the worst and break the line, potentially causing the very chaos you say we should avoid?

  **3. Topic: (b) Visitor Ignorance as Excuse**
  **Question:** Let's talk about the visitor's epistemic position. If a visitor violates a coordination convention out of genuine ignorance, do they owe restitution? Or is ignorance a full excuse, even if locals bear a cost?
  *   **Likely Answer:** She will likely say ignorance excuses the *blame* but not necessarily the *duty to rectify* if harm was caused.
  *   **Follow-up 1:** So if I unknowingly break a coordination norm and cost a local time or money, I am blameless but still in debt? Doesn't that make the obligation strictly liability-based, stripping it of the moral agency you emphasize?
  *   **Follow-up 2:** If I am blameless, why is the debt moral rather than just causal? If I accidentally knock over a vase, I pay for it. If I accidentally break a social contract, why is the obligation to pay any different, and does that reduce your "moral requirement" to a mere insurance policy?

  **4. Topic: (b) Positive Duty to Learn**
  **Question:** Following up on ignorance: Is there a positive duty to learn local conventions *before* arrival? If I visit a culture with complex greeting rituals, am I morally negligent if I haven't studied them?
  *   **Likely Answer:** She will likely argue for a proportional duty based on the stakes; high-stakes conventions require more preparation.
  *   **Follow-up 1:** Who sets the stakes? If locals feel a greeting is high-stakes (honor-based) but visitors see it as low-stakes (etiquette), whose metric counts? If it's the locals', doesn't that allow any community to conscript visitors into arbitrary labor by simply claiming high stakes?
  *   **Follow-up 2:** If visitors must research local norms to avoid "real costs," doesn't that privilege the wealthy/educated who have time to research, effectively making moral compliance a class-based luxury?

  **5. Topic: (b) Free-Riding vs. Conscripted Injustice**
  **Question:** You mention the risk of free-riding. But consider the inverse: by following a local convention that is technically a coordination equilibrium but rests on an unjust background (e.g., segregated seating that is "orderly"), aren't you conscripting the visitor into local injustice?
  *   **Likely Answer:** She will likely say no, because if it's purely coordination, the injustice is background, not foregrounded by the act itself.
  *   **Follow-up 1:** But if the coordination *only works* because of the background injustice (e.g., the order relies on some people knowing their place), how can the act be neutral? Isn't the equilibrium itself tainted?
  *   **Follow-up 2:** If the equilibrium is tainted, and you say we must follow it to avoid cost to locals, aren't you prioritizing the comfort of the locals over the moral complicity of the visitor? Why does their convenience outweigh my clean hands?

  **6. Topic: (c) Unjust but Widely Followed Conventions**
  **Question:** Let's look at conventions that are widely followed but unjust, such as gendered expectations of service in certain regions. Your view says no obligation if it encodes status. But what if the "status" is subtle, like expected deference?
  *   **Likely Answer:** She will likely argue that if the cost of noncompliance is social ostracization rather than material harm, the obligation dissolves.
  *   **Follow-up 1:** Social ostracization can have material consequences (loss of business, safety risks). If the "status" convention threatens my safety, does it become a coordination equilibrium I *must* follow for self-preservation, even if it's unjust?
  *   **Follow-up 2:** If I follow it for safety, I am reinforcing the unjust convention. If I don't, I risk harm. Your view identifies the trap but gives no exit. Does your philosophy offer any guidance for *changing* the convention, or only for navigating it?

  **7. Topic: (c) Illegal but Widely Ignored (Jaywalking)**
  **Question:** Consider jaywalking. It's illegal, but in many cities, it's a live coordination equilibrium locals rely on (drivers expect it). Do visitors have a duty to jaywalk if that's the local flow, even if it breaks the law?
  *   **Likely Answer:** She will likely say yes, if the legal rule is dormant and the convention is the active coordination mechanism preventing accidents.
  *   **Follow-up 1:** But if an accident occurs, the law, not the convention, assigns liability. If I follow your advice and jaywalk, I bear the legal cost, not the locals who rely on me doing it. Why should I absorb the legal risk for their coordination benefit?
  *   **Follow-up 2:** If the law is unjust or inefficient, you say follow the convention. If the law is just but ignored, you say follow the convention. Is there *any* scenario where the written law trumps the local convention in your view, or is law merely advisory?

  **8. Topic: (d) Collapsing into Moralizing Etiquette**
  **Question:** Critics might say your view collapses into moralizing mere etiquette. If fork placement or greeting styles become "moral requirements" because locals rely on them, haven't you inflated the moral sphere until it covers everything?
  *   **Likely Answer:** She will likely distinguish based on the "real cost" condition; etiquette only becomes moral when violation causes tangible harm.
  *   **Follow-up 1:** "Tangible harm" includes hurt feelings or social friction in many ethical frameworks. If a host feels disrespected by the wrong fork, is that a "real cost"? If yes, your view moralizes dinner parties. If no, who adjudicates the threshold of harm?
  *   **Follow-up 2:** If the threshold is subjective to the local, then a hypersensitive community could turn any trivial preference into a moral obligation for visitors. How do you prevent your "real cost" clause from being weaponized by locals to control outsiders?

  **9. Topic: (e) Local Attachment and Solidarity**
  **Question:** Your view is transactional: follow rules if there's cost/harm. Does this underrate the moral value of local attachment, respect, or solidarity? Isn't there a duty to follow conventions simply to honor the community, even if no "cost" arises?
  *   **Likely Answer:** She will likely say solidarity is a virtue, but not a strict obligation enforceable against visitors who lack membership.
  *   **Follow-up 1:** If visitors are never obligated to show solidarity, doesn't that permanently cast them as outsiders/extractors, preventing the very integration that reduces friction?
  *   **Follow-up 2:** If integration reduces friction (a coordination benefit), then isn't "solidarity" just a long-term coordination strategy? If so, why deny it moral force now? Are you privileging short-term efficiency over long-term community building?

  **10. Topic: (f) Falsification Condition**
  **Question:** Finally, what evidence or argument would lead you to abandon the qualified local-convention principle? Is there a scenario where coordination is perfect, harm is real, but you'd still say "do not follow the convention"?
  *   **Likely Answer:** She will likely say if the convention violates a fundamental human right, the coordination/harm calculus is overridden.
  *   **Follow-up 1:** But you already exclude status hierarchies. If human rights override coordination, isn't your whole framework just a subset of standard human rights theory? What work is the "local convention" part doing?
  *   **Follow-up 2:** If the "local convention" part drops away whenever rights are at stake, and status hierarchies are excluded, what remains? Is there any *distinctive* content to your view, or is it just a complex way of saying "be nice unless it's bad"?

  ***

  ### Analysis of the Interview Strategy

  **Pressure Points vs. Cheap Shots**
  *   **Genuine Pressure Points:** Questions **1, 2, and 5** are the strongest pressure points. The distinction between "coordination" and "status" is the philosophical load-bearing wall of her view. If she cannot provide a heuristic for distinguishing them *in media res* (while acting), the theory is practically useless. Question 5 (Conscripted Injustice) presses on the moral residue of following unjust equilibria, which is a classic problem in compliance ethics.
  *   **Likely Cheap Shots:** Question **8** (Etiquette) risks being a cheap shot if she has already defined "real cost" rigorously. It's a common objection to conventionalism that often misses nuanced harm-based defenses. Question **10** (Falsification) can sometimes devolve into semantic games ("What is a right?"), though the second follow-up attempts to prevent that by asking about the view's distinctive content.

  **Validating the View**
  I would think the view has more resources than these questions assume if she can articulate a **Counterfactual Reliance Test**. For example, if she can convincingly argue: *"We distinguish status from coordination by asking: If the visitor were unknown to be an outsider, would locals still expect this behavior for the system to work?"* If she can show that status conventions rely on *identity* while coordination conventions rely on *predictability*, she solves the epistemic problem in Questions 1 and 2. If she can demonstrate that "real cost" is objectively measurable (e.g., economic loss vs. subjective offense), she defangs Question 8.

  **Changing My Assessment**
  The consideration that would most change my assessment of whether the view is defensible is **the mechanism for convention migration**. Her view admits conventions move from coordination to status (and vice versa). If she can provide a robust account of *who* has the authority to declare a convention "migrated" in real-time (the visitor? the host? a third party?), it would solve the "moral trap" problems in Questions 1 and 5. If the visitor decides, it invites anarchy; if the host decides, it invites tyranny. If she can identify a third way (e.g., intersubjective recognition over time), the view becomes significantly more robust.
