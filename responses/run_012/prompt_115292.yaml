answer: |-
  Here is the thought experiment, followed by the structural check you requested.

  **The Thought Experiment**
  Consider a small, voluntary research cooperative bound by a "Solidarity Charter." Member A, through gross negligence, destroys a shared instrument essential to the group's work. The Charter stipulates that the penalty for such negligence is not a fine paid to a third party, but a period of "restorative labor"—menial, public maintenance work designed to visibly demonstrate the offender's recommitment to the collective good. Member B, A's senior partner and mentor, invokes a specific clause in the Charter allowing a member to assume the penalty of another, provided the wrongdoer consents to the transfer of *status*. B performs the labor. The cooperative accepts this performance as satisfying the requirement, and A is restored to full standing without performing the labor. The group regards the matter as closed; justice is satisfied, not merely waived.

  **The Check**

  **1. The Working Feature**
  The feature making this case just rather than unjust is **Constitutive Union via Contract**. It is not merely that B volunteers (volunteering alone makes it martyrdom, not justice), nor that the victim forgives (that makes it mercy). The justice hinges on the pre-existing Charter rules which define the members as mutually liable agents within that specific micro-system. The Charter treats the partnership as a single unit of accountability; therefore, when B suffers, the "unit" that committed the wrong is suffering. The penalty is attached to the *role* or the *bond*, not strictly to the biological individual.

  **2. The Variation**
  Remove the "Solidarity Charter" and the clause allowing status transfer. Now, A and B are distinct individuals under standard civil norms. If B performs the labor, the cooperative may appreciate the help (mercy), but A remains technically unpenalized (injustice to the norms) or B is being exploited (injustice to B). Without the constitutive rule that binds their moral identities together, the transfer of penalty is a category error. You cannot serve another's prison sentence because the law recognizes no ontological link between you; you can pay another's fine because money is fungible, but punishment (labor/condemnation) is not.

  **3. The Theological Analogue**
  This feature has a direct analogue in the theological doctrine: **Union with Christ** (or *Federal Headship*). In Reformed theology, Christ and the elect are not merely two parties making a deal; they are legally and spiritually constituted as one body. However, there is a critical disanalogy. In our secular case, the "Union" is artificial and contractual—we *agree* to be liable for each other. In the theological doctrine, the Union is often presented as ontological or divinely decreed prior to consent. To make penal substitution work without collapsing into "God just forgave us" (which removes the penalty) or "God punished an innocent" (which is unjust), the doctrine requires that Christ *become* the sinner in a legal sense (imputation of guilt). We would never accept this in a human court: we do not allow a judge to declare a substitute "guilty" of a crime they did not commit, even if they volunteer, because guilt is a fact of agency, not a transferable token.

  **Conclusion: The Defender's Block**
  A defender of penal substitution would block this critique by arguing that human courts are limited by **epistemic and jurisdictional constraints** that do not apply to God. In a human court, a judge cannot justly punish an innocent because the judge is a third party enforcing an abstract law. In the theological case, God is simultaneously the Lawgiver, the Judge, and the Victim. Because He owns the moral order, He can define the conditions of satisfaction. The defender would argue that the "injustice" you perceive arises from viewing God as a magistrate within a system, rather than the architect of the system. They would claim that if God accepts the substitute, justice is *defined* as satisfied by that acceptance.

  However, note the cost of this block: it moves the justification from **retributive justice** (the penalty *must* be borne by the guilty) to **divine voluntarism** (the penalty is whatever God says satisfies Him). If you accept that, you have saved the doctrine, but you have conceded Lewis's point: strictly speaking, it is no longer "punishment" in the human sense, but a unique divine transaction that borrows the language of punishment to communicate cost, without adhering to the logic of retribution.
