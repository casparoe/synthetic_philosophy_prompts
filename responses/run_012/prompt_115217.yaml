      *   *Offense vs. Harm:* Offense (dislike/disgust) is not harm.

  3.  **Translate into Econ Vocabulary (The "Mapping"):**
      *   *Harm:* Negative Externality ($\frac{\partial U_i}{\partial x_j} < 0$).
      *   *Coercion (Law/Social Pressure):* Mechanism Design / Constraint Enforcement / Taxation ($t$) vs. Quantity Regulation ($q$).
      *   *Fallibility/Free Exchange:* Information Aggregation (Condorcet Jury Theorem style but dynamic). Bayesian updating. Costly state verification.
      *   *Individuality:* Local knowledge (Hayekian), preference heterogeneity, value of option rights/real options.
      *   *Self-Regarding:* Internalities (if we allow them) or simply $\frac{\partial U_i}{\partial x_j} = 0$.
      *   *Offense:* Preference externality (jealousy, disgust).
      *   *Paternalism:* Internalities ($\frac{\partial U_i}{\partial x_i}$ miscalculated due to bias) vs. Sovereignty.

