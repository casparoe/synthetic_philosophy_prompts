      *   *Defense 2 (Individuality/Experiments in Living):* Human development requires freedom. Diversity of lifestyles benefits society.
      *   *Defense 3 (Self-Regarding vs. Other-Regarding):* Distinction between actions affecting only the agent vs. others.
