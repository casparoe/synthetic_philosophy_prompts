answer: |-
  You have set up the problem with exceptional clarity, and I want to begin by validating your intuition: this is not an artifact of your framing, nor is it a beginner's misunderstanding. You have put your finger on the central philosophical tension in Buddhist thought. The conflict between *anattā* (not-self) and *karma* (moral causality across time) is the engine that drove centuries of scholastic debate within Buddhism itself, from the *Kathāvatthu* in the Theravāda tradition to the *Pudgalavāda* controversy and the Madhyamaka dialectics of Nāgārjuna.

  Your friend the Parfitian is half-right, but misses the soteriological point. You are half-right, but perhaps demand a metaphysical guarantee that the Buddha explicitly refuses to provide.

  Here is the breakdown of why your objection feels so potent, why the Buddha's silence is not evasion, and whether the "convention shuffle" is a cheat or a necessity.

  ### 1. The Trap of the Question (Why the Silence is Not Evasion)
  You interpret the Buddha's refusal to answer whether there is a self as evasion. In the context of the *avyākata* (undeclared questions), scholars and philosophers generally agree this was not because he didn't know, but because the question itself presupposes a category error.

  The question "Is there a self?" forces a binary: Yes (Eternalism) or No (Nihilism/Annihilationism).
  *   **If he says "Yes":** He validates the view that there is an unchanging substance. This reinforces clinging, because now there is something to protect, cherish, and identify with. It blocks liberation.
  *   **If he says "No":** He validates the view that nothing matters, that death is total extinction, and crucially for your objection, that karma is impossible (because there is no one to carry the debt). This leads to moral nihilism.

  The Buddha's silence is a therapeutic refusal to engage in a metaphysical game that distracts from the problem of suffering. He is not offering a competing ontology to the Upanishads; he is offering a phenomenology of experience. To ask "Who suffers?" is, in his view, like asking "Which direction did the fire go when it went out?" The fire doesn't "go" anywhere; the conditions for combustion ceased. Similarly, the "person" is a process. When the process stops, asking where the person went is a misuse of language.

  ### 2. The "Same/Different" Dichotomy and Dependent Origination
  Your core objection rests on this dilemma: *If the reborn person is not the same, karma is unjust; if they are the same, a self is smuggled in.*

  Buddhism rejects the premise that "same" and "different" are the only options. This is the doctrine of **Dependent Origination** (*paṭicca-samuppāda*). The relationship between the person who sows and the person who reaps is one of **causal continuity without substantial identity.**

  Consider the classic simile: A man lights a candle from another candle. Is the flame on the second candle the *same* as the first? No. Is it *different*? Not entirely, because it is causally dependent on the first. If you deny the connection, you deny causality. If you assert identity, you deny change.

  Your objection relies on a retributive model of justice: *Person A* must be *Person B* for punishment to be just. But Buddhism does not view karma as a legal system administered by a cosmic judge. It views karma as a natural law, like gravity or thermodynamics. If you touch a fire, pain arises. The "you" that touches and the "you" that feels pain are not substantively identical (cells have died, neurons fired, time has passed), but they are causally continuous. The pain is not a "punishment" inflicted on a "party"; it is the ripening of a condition.

  The suffering is real, even if the sufferer is not a substance. As the *Visuddhimagga* puts it: "There is suffering, but no one who suffers." The difficulty you feel is the intuition that suffering *requires* a subject. Buddhism argues that suffering is a quality of the aggregates themselves when clung to, not something that happens *to* an owner.

  ### 3. The "Convention Shuffle" and the Two Truths
  Your friend calls the appeal to convention a "shuffle." In Western analytic philosophy, this often looks like having your cake and eating it too. However, in Buddhism, this is the doctrine of the **Two Truths**:
  1.  **Ultimate Truth:** There are only aggregates, no self.
  2.  **Conventional Truth:** There are persons, agents, and moral responsibilities.

  The crucial point is that **Nirvana is realized within the conventional, not by escaping it.** You cannot practice the path without a conventional agent. You cannot feel compassion for "aggregates"; you feel it for "beings."

  Is this incoherent? Only if you demand that Conventional Truth must map 1:1 onto Ultimate Truth. But the Buddhist claim is pragmatic: The concept of "self" is useful *until* it becomes the source of suffering. The concept of "karma" is useful *until* it becomes a source of anxiety about future lives.

  Your friend (the Parfitian) says: "Once the person is only a designation, there is, strictly speaking, no person."
  The Buddhist replies: "Strictly speaking, there is also no 'strictly speaking.' There is only suffering and the end of suffering."

  Parfit uses reductionism to show that identity doesn't matter for survival. Buddhism uses reductionism to show that identity doesn't matter for *liberation*. The difference is that Parfit is describing the world, while the Buddha is prescribing a cure. The "convention" is not a metaphysical cheat; it is the only level at which the cure can be administered.

  ### 4. Is the Problem Setup the Difficulty?
  You asked: *"If the way I have set the problem up is itself the difficulty, I would rather be told that than be handed a solution to a problem that does not exist."*

  Here is the direct answer: **Yes, the way you have set the problem up is the difficulty.**

  You are asking for a metaphysical guarantor of moral responsibility. You want to know *what makes it fair* that this stream of aggregates suffers for that stream's actions. You are looking for a "who" that grounds the justice.

  The Buddha's radical claim is that the search for that "who" is the very mechanism that generates the sense of injustice. The feeling that "it is unfair that *I* suffer for what *I* did" presupposes an "I" that is distinct from the suffering, a subject that *has* the suffering as an attribute.

  If you fully accept *anattā*, the question shifts from "Is it just that *I* suffer?" to "Suffering is arising due to conditions. How do we cease the conditions?"

  This does not make the theory "coherent" in the sense of satisfying a Western demand for a unified theory of personal identity and moral justice. It makes it **soteriologically consistent**. It is coherent relative to its goal (ending suffering), not relative to an external standard of metaphysical justice.

  ### 5. Conclusion: Incoherent or Decorative?
  Is *anattā* incoherent? **Logically, yes**, if you demand it satisfy the Law of Non-Contradiction regarding identity over time while maintaining moral responsibility. It posits a causal chain that carries moral weight without a carrier.

  Is it merely decorative reductionism? **No**, because unlike Parfit's reductionism, it is not a neutral description. It is a tool for deconstruction. The "incoherence" you sense is the friction of the mind trying to grasp a process as a thing.

  The Buddha refused to take the stand you want him to take because taking that stand would validate the very craving for substantial existence that keeps the wheel of karma turning. The "evasion" is the point. To answer the question is to accept the premise that there *could* be a self to answer about.

  Your objection is deep because it reveals the limit of conceptual thought when applied to a system designed to transcend conceptual thought. You are trying to solve a practical problem (how to live/stop suffering) with a theoretical tool (metaphysics of identity). The Buddhist reply is that the tool is the trap.

  So, you are not wrong to feel the tension. But the tension is not a bug in the system; it is the feature that is meant to exhaust the intellect's desire for a foothold, forcing a shift from understanding *about* reality to experiencing the cessation of the one who wants to understand.
