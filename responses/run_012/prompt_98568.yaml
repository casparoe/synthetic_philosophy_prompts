answer: |-
  ### Specification for a Darwinian Theory of Cultural Evolution

  To move beyond case-by-case skirmishing, a theory claiming culture evolves via a Darwinian process must satisfy the following desiderata. These are divided into empirical obligations, explanatory distinctions, and theoretical constraints.

  #### I. Empirical Obligations (Phenomena to be Explained)
  1.  **The Ratchet Effect:** The theory must explain the cumulative, ratchet-like growth of behavioral complexity unique to humans. It must account for how modifications are retained and built upon over generations rather than lost, distinguishing human social learning from the non-cumulative traditions of other species.
  2.  **Differential Velocity:** The theory must account for the orders-of-magnitude difference in the speed of cultural change compared to genetic change, without positing a fundamentally different logic of selection.
  3.  **Maladaptive Persistence:** The theory must explain the stability and spread of traits that reduce the biological fitness of their bearers (e.g., celibacy, costly signaling that invites predation, dietary taboos that reduce caloric intake).
  4.  **Convergent Evolution:** The theory must account for the recurrence of structurally similar traditions in unconnected populations (e.g., similar kinship structures, ritual forms) without relying solely on direct diffusion or universal genetic determinism.
  5.  **Reconstructive Transmission:** The theory must accommodate the empirical finding that most cultural transmission is not copy-machine fidelity. It must explain stability despite the fact that learners typically reconstruct behaviors from partial cues based on internal cognitive schemas.

  #### II. Critical Test Cases
  The theory must explicitly model the difference between these two transmission pathways and declare whether they share a single evolutionary mechanism:
  1.  **The Blind Ritual:** A practice reproduced with high fidelity by agents who cannot articulate its function or meaning (e.g., specific religious gestures, etiquette rules). Here, transmission relies on copying the form despite ignorance of the content.
  2.  **The Re-derived Belief:** A belief that spreads because each new holder infers it independently from a shared cognitive disposition and environmental cue, with no direct copying of the belief state itself (e.g., intuitive dualism, specific hazard-avoidance heuristics). Here, the "trait" persists, but the causal chain is transformation, not replication.

  #### III. Required Distinctions
  The theory must not collapse the following distinctions:
  1.  **Trait Fitness vs. Carrier Fitness:** It must distinguish the success of the cultural variant from the reproductive success of the human hosting it.
  2.  **Content Bias vs. Context Bias:** It must distinguish transmission driven by the inherent properties of the idea (makes sense, easy to remember) from transmission driven by the properties of the model (prestige, majority status).
  3.  **Innovation vs. Selection:** It must separate the mechanism generating variation (psychological creativity, error) from the mechanism filtering variation (social adoption, retention).

  #### IV. Theoretical Constraints
  1.  **Cognitive Plausibility:** The mechanism of inheritance must be compatible with established findings in cognitive psychology regarding memory, attention, and inference.
  2.  **Continuity of Logic:** If the process is "Darwinian," the logic of variation, selection, and inheritance must be recognizably homologous to biological evolution, even if the substrate differs.

  ---

  ### Classification of Requirements

  #### Non-Negotiable (Empirical Anchors)
  *   **The Ratchet Effect, Differential Velocity, Maladaptive Persistence, Cognitive Plausibility.**
  *   **Reasoning:** These are observed features of the world. A theory that denies cumulative complexity or claims maladaptive traits are actually adaptive (via post-hoc rationalization) fails to describe the data. A theory that requires cognitive mechanisms known to be false (e.g., perfect memory) is falsified. These are the boundaries within which any valid theory must operate.

  #### Camp-Specific Commitments (Theoretical Wagers)
  *   **Discrete Particulate Units:** The requirement that culture be carved into "memes" or distinct replicators.
  *   **High-Fidelity Replication:** The requirement that transmission must approximate copying.
  *   **Reasoning:** These are methodological choices made to make the math work, not necessarily features of the phenomenon. One can have selection without discrete genes (e.g., quantitative traits), and one can have stability without copying (e.g., dynamic stability). Insisting on these as prerequisites excludes viable models prematurely.

  ---

  ### Joint Tensions and Unsatisfiable Subsets

  There are two primary tensions where the desiderata appear to pull in opposite directions. A successful theory must resolve these, not ignore them.

  #### 1. The Fidelity-Reconstruction Tension
  *   **The Conflict:** The **Ratchet Effect** requires high-fidelity inheritance to prevent information degradation over time. However, **Reconstructive Transmission** dictates that human learning is inherently noisy and inferential.
  *   **The Tension:** If transmission is reconstructive, how does the "ratchet" hold? If transmission is high-fidelity copying, how is it cognitively plausible given human memory?
  *   **Resolution Requirement:** The theory must specify a stabilizing mechanism that does not rely on perfect copying. (e.g., does the environment constrain reconstruction? Do cognitive attractors canalize variation?)

  #### 2. The Unit-Selection Tension
  *   **The Conflict:** **Darwinian Logic** traditionally presupposes discrete units of selection (to allow for competition and replacement). However, **Cognitive Plausibility** and **Maladaptive Persistence** often suggest culture operates as holistic, semantically integrated networks where "traits" cannot be easily individuated.
  *   **The Tension:** If units are not discrete, selection coefficients are difficult to define. If units are forced to be discrete, the theory misrepresents the holistic nature of meaning and practice.
  *   **Resolution Requirement:** The theory must define the "unit" of cultural evolution without committing to a "atomistic" view of culture that contradicts anthropological observation.

  #### The Most Serious Tension
  The **Fidelity-Reconstruction Tension** is the most critical. If a theory cannot explain how information persists across generations without positing a biologically implausible "copying mechanism," it fails the **Cognitive Plausibility** constraint. If it accepts reconstruction but cannot explain the **Ratchet Effect**, it fails the **Empirical Obligations**. This is the bottleneck through which most candidates fail.

  ---

  ### The Single Exclusionary Requirement

  **The Specification of the Inheritance Mechanism.**

  This is the requirement that does the most work in excluding candidates. Many theories can describe *selection* (why some ideas are popular) or *variation* (why people innovate). Far fewer can specify *what exactly is being inherited* and *how it persists* across generations in a way that satisfies both the **Ratchet Effect** and **Cognitive Plausibility**.

  *   If the inheritance mechanism is "copying," it excludes reconstructive accounts but struggles with cognitive plausibility.
  *   If the inheritance mechanism is "attraction," it satisfies cognition but struggles to explain the Ratchet without an additional selection layer.
  *   If the inheritance mechanism is left vague (e.g., "social learning"), the theory is not Darwinian, merely descriptive.

  A theory stands or falls on whether it can define the "replicator" (or functional equivalent) clearly enough to be modeled, but loosely enough to be real.

  ---

  ### Brief Assessment of Current Frameworks

  **1. Replication-Based Memetics**
  *   **Performance:** Fails the **Cognitive Plausibility** and **Reconstructive Transmission** constraints.
  *   **Analysis:** It treats the **Fidelity-Reconstruction Tension** by fiat, assuming high-fidelity copying exists. It handles the **Blind Ritual** case well but fails the **Re-derived Belief** case (classifying it as non-cultural or ignoring it). It satisfies the **Unit-Selection** requirement but at the cost of empirical realism.

  **2. Dual-Inheritance Accounts**
  *   **Performance:** Strong on **Maladaptive Persistence** and **Differential Velocity**; weak on **Cognitive Plausibility**.
  *   **Analysis:** It successfully models the **Ratchet Effect** and distinguishes **Trait vs. Carrier Fitness**. However, it often treats the "cultural unit" as a black box to facilitate mathematical modeling, glossing over the **Reconstructive Transmission** evidence. It handles the test cases by forcing both into a "transmission" category, potentially obscuring the mechanistic difference between copying and re-derivation.

  **3. Cultural Attraction Theory**
  *   **Performance:** Strong on **Cognitive Plausibility** and **Reconstructive Transmission**; struggles with the **Darwinian Logic** constraint.
  *   **Analysis:** It resolves the **Fidelity-Reconstruction Tension** by positing that stability comes from cognitive convergences (attractors) rather than copying. However, it risks failing the **Continuity of Logic** requirement. If variation is directed by cognition (transformation) rather than random (blind variation), and selection is replaced by convergent inference, it begins to look more like a Lamarckian or developmentalist account than a Darwinian one. It handles the **Re-derived Belief** case perfectly but must work harder to explain the **Blind Ritual** without invoking copying.
