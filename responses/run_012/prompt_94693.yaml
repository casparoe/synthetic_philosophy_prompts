answer: |-
  **Decision Tree: What Grounds Function Claims?**

  *Start:* A trait's having a function is a fact a biologist can get right or wrong, and it's the kind of fact that grounds claims about malfunction (e.g., a diseased heart).

  1.  **Is "function" univocal?**
      *   No → **Pluralist/Deflationary** ('Function' shifts meaning across explanatory projects).
      *   Yes → Go to 2.
  2.  **Is it an artifact?**
      *   Yes → **Designer Intention** (Distinguishes unused mousetrap from chair-as-doorstop).
      *   No → Go to 3.
  3.  **Depend on *actual* history?**
      *   Yes → 4. **Must history be selection-specific?**
          *   Yes → **Pure Selected Effects** (Appendix/flightless wings lack function if not selected).
          *   No → **Permissive Historical** (Cultural song/beaver dam via imitation counts).
      *   No → 5. **Is it about *potential* selection?**
          *   Yes → **Forward-looking Propensity** (Lightning dog duplicate has function).
          *   No → 6. **What fixes function now?**
              *   Capacity → **Causal Role** (Heart sound/nose holding glasses counts).
              *   System Goals → **Goal Contribution** (Drift trait later useful counts).
              *   Self-Maintenance → **Organizational** (Feathers: warmth → flight counts).

  | Position | Defining Commitment | Embarrassing Case |
  | :--- | :--- | :--- |
  | **Pure Selected Effects** | Function = past selection reason. | Lightning dog (has heart, no history). |
  | **Permissive Historical** | Function = history of reproduction/learning. | Spandrels (persist without selection). |
  | **Forward-looking Propensity** | Function = what *would* be selected. | Malfunction (broken heart retains function). |
  | **Causal Role** | Function = current causal capacity. | Heart sound (capacity, but not function). |
  | **Goal Contribution** | Function = contribution to system goals. | Drift traits (no goal, just persistence). |
  | **Organizational** | Function = sustaining self-production. | Boundary cases (viruses? ecosystems?). |
  | **Designer Intention** | Function = user/maker intent. | Evolved artifacts (AI learning?). |
  | **Pluralist** | Function = context-dependent kind. | Loss of explanatory precision. |

  **Notes on Topology**

  **Indistinguishable Pairs:** Permissive Historical vs. Organizational on the **Beaver Dam**. Both attribute function based on persistence/maintenance without genetic selection. The tree cannot separate them via the beaver case alone; requires distinguishing genetic from cultural transmission mechanisms externally.

  **Undefended Combinations:** Propensity + Robust Malfunction. If function is what *would* be selected, a broken heart (unselectable) struggles to retain function. This is unattractive: biologists assign function to broken traits regardless of current selectability.

  **The Drift Case:** A trait fixed by drift that later pays its way splits Pure SE (No) from Propensity/Causal/Org (Yes). It does not split Propensity from Causal Role, as both affirm function based on current/future utility rather than past origin. This suggests Propensity and Causal Role may collapse without further commitment to teleology.

  **Feathers:** Placed under Organizational to contrast with SE. SE locks function to original warmth; Organizational allows shift to flight if it maintains the system now.

  **Lightning Dog:** The decisive test for Historical views. If the duplicate lacks function, history is necessary. If it has function, history is not necessary.

  **Artifacts:** Included to test generality. If function requires selection, chairs lack functions. If intention suffices, biology might need a different account.
