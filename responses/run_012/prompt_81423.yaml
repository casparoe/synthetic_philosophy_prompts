answer: |-
  ### Correspondence Table

  | Source element (the item in the architectural story) | Alleged biological counterpart | Correspondence (holds / partial / none) | Does the mismatch damage the argument, and if so at which step |
  | :--- | :--- | :--- | :--- |
  | **The Architect** | **Natural Selection / Evolutionary History** | **Partial** | **Yes, at the causal origin step.** The architect chooses constraints intentionally; selection filters blind variation. However, this does not damage the *structural* logic of constraint, only the *mechanism* of constraint imposition. |
  | **The Dome & Pendentives** | **Primary Adaptations (e.g., large body size)** | **Holds** | **No.** Both represent the primary structural commitments that dictate subsequent necessities. |
  | **The Triangular Space (Spandrel)** | **Byproduct Trait (e.g., human chin)** | **Holds** | **No.** Both are necessary geometric/developmental consequences of the primary structure, not independently selected features. |
  | **The Mosaics** | **Current Utility / Exaptation** | **Holds** | **No.** Both represent secondary uses applied to a pre-existing feature, illustrating that utility does not imply origin. |
  | **The Decision to Build** | **Path Dependency / Phylogenetic Inertia** | **Partial** | **Yes, at the contingency step.** The architect could have chosen a different roof; evolution is constrained by available variation and history, not free choice. This weakens the claim that the "dome" was the only option. |
  | **Physical Laws (Gravity/Geometry)** | **Physical/Developmental Laws** | **Holds** | **No.** In both cases, the constraint (spandrel existence) is enforced by physics/math, not the agent. This is the core load-bearing similarity. |
  | **The Mason/Mosaicist** | **Secondary Selection Pressures** | **Partial** | **Minor damage.** The mosaicist deliberately fills the space; secondary selection is blind. This matters only if one argues the *refinement* of the byproduct implies original design. |

  ### Audit of the Analogy and the Designer Objection

  The postdoc's objection conflates the *mechanism of origin* with the *logic of constraint*. The architectural analogy is not intended to model the causal mechanism of evolution (where it indeed fails, as there is no architect); it is intended to model the logical relationship between primary structures, necessary consequences, and secondary uses. The postdoc argues that because the architect *chose* the dome, the resulting spandrel is ultimately a product of design. This misses the point that the spandrel exists due to geometry, not intent. Even if the architect intended the dome, the spandrel was not selected *for* its shape; it was necessitated by the dome's shape. In biology, if selection favors a large body (dome), heat retention issues (spandrel) may follow due to the square-cube law, regardless of whether heat retention was selected for. The presence of an architect in the source domain highlights the distinction between *intended function* and *necessary consequence*, which is precisely the distinction the anti-adaptationist needs to make.

  Regarding the distinction between "built for role" and "co-opted into role": the analogy keeps these apart successfully. The architect builds the space to hold the dome, not to hold the mosaic. The mosaicist arrives later. This maps cleanly to selection building a trait for Function A, while later pressures co-opt it for Function B. The designer objection does not blur this; even with a designer, the *reason the space exists* (geometry) is distinct from the *reason the space is decorated* (aesthetic utility). The objection only threatens the analogy if one claims the biological trait has *no* selective history at all, but the anti-adaptationist claim is usually weaker: that the *origin* of the trait's form is not explained by its *current* utility.

  The "proves too much" consideration is decisive against the postdoc's broader implication. Adaptationists routinely use design language (e.g., "engineering," "optimization," "watchmaker") to describe organisms. If the presence of a designer in the analogy invalidates the inference to biology, it invalidates the adaptationist's own heuristic tools. The adaptationist argues organisms *appear* designed; the anti-adaptationist argues some parts *appear* designed but are actually architectural necessities. Both rely on the artifact analogy. The postdoc's objection therefore undermines the shared language of the field rather than isolating a flaw in the spandrel argument. If the analogy is rejected solely because it involves a mind, then no artifact analogy can ever be used in biology, which cripples both sides.

  The analogy is sound for the weaker claim (logical possibility and epistemic caution) but unsound for the stronger claim (prevalence of byproducts). It proves byproducts *can* exist, not that they *do* exist in specific cases. The weakest load-bearing step is the inference from "possible" to "probable." The analogy demonstrates that utility is not evidence of origin, but it does not provide a method for distinguishing adaptation from byproduct in specific biological cases. For that, one needs evidence of independent variability and genetic linkage, which the architectural story cannot supply.

