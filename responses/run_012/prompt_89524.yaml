answer: |-
  **EXAMINATION PAPER**

  **Course:** PHI 405: Philosophy of the Social Sciences
  **Section:** B (Path Dependence and Historical Explanation)
  **Time Allowed:** 75 Minutes

  **INSTRUCTIONS:**
  *Read the case study below carefully. Your essay must be based on this case. Do not rely on external examples (e.g., QWERTY, VHS) except for brief illustrative comparison.*

  **CASE STUDY: THE REGIONAL STANDARD**
  *A region adopted one of two incompatible technical standards very early, at a moment when the choice was driven by local conditions — terrain, say, or the cost of raw materials — and when neither standard was clearly superior in general. Over the following decades the early choice attracted complementary investments: trained workers, tooling, spare parts, and regulation. The rival standard survived only in a few enclaves. With hindsight the winning standard looks clumsy, and engineers periodically argue that the region would have been better off had the other one prevailed. A neighbouring region, facing broadly similar conditions but starting later, settled on the alternative and has been content with it.*

  ***

  **ESSAY QUESTION**

  Analyze the case above through the lens of path dependence. Your essay must address the following three requirements:

  1.  **Criteria for Lock-in:** Specify what would have to be true about switching costs and complementarities for this situation to constitute genuine "lock-in" rather than the efficient selection of a standard that possessed hidden advantages.
  2.  **Conceptual Distinctions:** Distinguish this case from three look-alikes often conflated with path dependence: (a) mere sensitivity to initial conditions; (b) an ordinary coordination failure correctable by policy; and (c) an outcome that would have converged on the same result anyway under selection pressure.
  3.  **Falsifiability and Ergodicity:** Take a position on whether the lock-in claim is falsifiable. In doing so, utilize the distinction between **ergodic** and **non-ergodic** processes (where a process is non-ergodic if its long-run outcome depends on the particular path taken, such that time-averages and ensemble-averages come apart). Is lock-in best understood simply as non-ergodicity, or does equating the two obscure something important?

  ***

  **MODEL ANSWER**

  To classify the Regional Standard case as genuine path dependence, we must move beyond the observation that history matters. Genuine lock-in requires that the cost of switching to the superior alternative (the rival standard used by the neighbour) exceeds the net benefit of that switch, *and* that no decentralized mechanism exists to coordinate the transition. If the current standard persists merely because it is "good enough" and switching is transactionally expensive but theoretically profitable for a central planner, this is friction, not lock-in. Lock-in implies a stable equilibrium where individual rationality prevents collective optimality. If the standard were actually more efficient given the specific terrain (hidden advantages), its persistence is selection, not path dependence.

  We must rigorously distinguish this from three confounding categories. First, **sensitivity to initial conditions** is necessary for path dependence but insufficient. Chaos theory shows small causes have large effects, but ergodic systems can be sensitive yet converge on the same statistical distribution. Path dependence requires the *retention* of the early signal, not just its amplification. Second, an **ordinary coordination failure** implies that with a subsidy or regulation, the switch could occur easily. Lock-in suggests the complementarities (tooling, training) are so deep that policy intervention would be prohibitively costly, not merely politically difficult. Third, we must rule out **convergence under selection**. The existence of the neighbouring region is crucial here. If selection pressure were dominant, both regions should eventually converge on the fittest standard. The divergence suggests fitness is not the sole driver; however, if the neighbour's success is due to different latent conditions, the original region's choice might still be locally optimal.

  This leads to the problem of falsifiability. Claims of lock-in are often post-hoc: we observe inefficiency and assume lock-in caused it. To be falsifiable, the claim must specify the *mechanism* of increasing returns that prevented the switch. If every inefficient outcome is attributed to lock-in without identifying the specific increasing returns function, the concept becomes vacuous. It risks becoming a "just-so story" where any historical persistence is deemed path dependent.

  This brings us to ergodicity. An ergodic process allows time-averages to equal ensemble-averages; history washes out. A non-ergodic process means the specific trajectory determines the final state; history is constitutive. Lock-in is formally a non-ergodic process: the region's outcome depends on the specific path taken (the early adoption) rather than averaging out to the globally optimal standard.

  However, equating lock-in strictly with non-ergodicity obscures a normative dimension. Non-ergodicity describes a mathematical structure where history matters, but it does not imply *inefficiency*. A system can be non-ergodic and optimal. Lock-in, as used in social science, specifically implies *suboptimal* stability due to historical contingency. If we reduce lock-in to non-ergodicity, we lose the critical claim that the region is "worse off." Therefore, while lock-in is a species of non-ergodic process, the label "lock-in" carries an additional burden of proof regarding welfare and counterfactual efficiency that pure non-ergodicity does not. The claim is falsifiable only if we can measure the welfare gap and the specific switching barriers, not merely by observing historical divergence.

  ***

  **MARKING SCHEME (Total: 25 Marks)**

  **1. Criteria for Lock-in (5 Marks)**
  *   **Must Hit:** Candidate identifies that switching costs must outweigh benefits *and* that decentralized coordination is impossible (equilibrium argument).
  *   **Common Miss:** Treating mere inefficiency or high switching costs as sufficient proof of lock-in without addressing the equilibrium stability.

  **2. Distinction: Sensitivity vs. Path Dependence (5 Marks)**
  *   **Must Hit:** Candidate notes that sensitivity is necessary but insufficient; retention/feedback mechanisms are required to prevent history from washing out.
  *   **Common Miss:** Treating any historical influence or "butterfly effect" scenario as synonymous with path dependence.

  **3. Distinction: Coordination & Convergence (5 Marks)**
  *   **Must Hit:** Candidate distinguishes correctable policy failures from structural lock-in AND uses the neighbour case to question selection pressure convergence.
  *   **Common Miss:** Assuming lock-in is permanent/immutable (ignoring policy) OR ignoring the neighbour counterfactual when discussing selection.

  **4. Falsifiability Position (5 Marks)**
  *   **Must Hit:** Candidate argues that without specifying the mechanism of increasing returns, the claim is post-hoc and vacuous.
  *   **Common Miss:** Asserting lock-in is obviously true because the standard is clumsy, ignoring the risk of retrospective rationalization.

  **5. Ergodicity Analysis (5 Marks)**
  *   **Must Hit:** Candidate identifies lock-in as non-ergodic but argues that equating them obscures the *normative/inefficiency* claim inherent in "lock-in."
  *   **Common Miss:** Treating non-ergodicity and lock-in as perfect synonyms without noting the loss of the efficiency/welfare dimension.

  **Differentiation (First-Class vs. Second-Class)**
  *   **Solid Second-Class:** Correctly defines all terms, distinguishes the look-alikes accurately, and identifies lock-in as non-ergodic.
  *   **First-Class:** Explicitly challenges the equation of lock-in and non-ergodicity (Point 5 above). They recognize that non-ergodicity is a structural description, while lock-in is a normative critique of efficiency. They also use the "neighbouring region" case actively to test the selection pressure hypothesis rather than treating it as background detail.

  ***

  **CLOSING NOTE TO INSTRUCTOR**

  **Confidence Level:** High.
  The distinction between the mathematical structure (non-ergodicity) and the normative claim (inefficiency/lock-in) is robust in the literature (e.g., Pierson, Page), though often glossed over in undergraduate teaching.

  **Least Certain Point:**
  I am least sure about the assertion that non-ergodicity *necessarily* lacks a normative dimension. In some complex systems literature, "path dependence" is used descriptively without implying inefficiency. However, for the specific context of "lock-in" in social sciences (Arthur, David), the inefficiency claim is usually central. If your lecture emphasized a purely descriptive definition of path dependence, the model answer's stance on the "normative dimension" might need slight adjustment to match your specific curriculum.
