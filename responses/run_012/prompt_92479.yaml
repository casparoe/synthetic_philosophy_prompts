      *   *Test Case 3 (Figurines):* Used? Maybe placed once. Effort? Low/Medium. Location? Thresholds. Verdict: Practice yes, Meaning no. (Principle struggles here. It's not "unused" in the same way, it's "deposited." It's not necessarily "lavish." The user *limits* their inference here, which contradicts the "Lavish = Belief" rule if we consider ritual placement lavish in time if not material.)
      *   *Test Case 4 (Grave):* Wagon/Horse/Cups. Used? Yes, in life. Unused in death? Yes. Effort? High (killing a horse). Verdict: Belief (afterlife). (Fits "Lavish/Effort" aspect).
      *   *Test Case 5 (Stone Ring):* Effort? Massive. Unused? It's a structure. Verdict: Practice (tracking), No Belief (worship). (Here the principle *fails*. Massive effort usually implies belief to the user, but they are hedging on "worship." This suggests a distinction between *cosmology/order* and *theology/worship*.)
      *   *Test Case 6 (Temple/Altar):* Effort? High. Images? None. Verdict: Nothing. (Principle fails. High effort structure, but user refuses to infer specific theology.)

  3.  **Identify the Real Underlying Logic:**
      *   The user's "gut" isn't just about *effort* vs. *economics*. It's about **Irreversibility** and **Specificity**.
      *   *Axes in Bog:* Irreversible loss. You can't get them back. Specific context (bog, not cache). -> Safe to infer Belief.
      *   *Nails under Floor:* Reversible. You can dig them up tomorrow. Context (house) implies trade. -> Safe to infer Economics.
      *   *Figurines:* Specific placement (thresholds). But meaning is generic ("protection" vs "ancestor" vs "luck"). -> Safe to infer Practice, Unsafe to infer Specific Theology.
      *   *Grave Goods:* Irreversible. You kill the horse, it's dead. You bury the wagon, it's gone. -> Safe to infer Belief (Afterlife needs).
      *   *Stone Ring:* Irreversible effort. But function (calendar) is observable. *Intent* (worship vs. utility) is ambiguous. -> Safe to infer Knowledge/Order, Unsafe to infer Devotion.
      *   *Temple/Altar:* Structure implies gathering. Lack of images is ambiguous (aniconic vs. unfinished). -> Unsafe to infer Theology.

      *   *Refined Principle:* **The Principle of Sacrificial Irreversibility.**
          *   If the action removes the object/value from the human economy permanently (burying in a bog, killing a horse, breaking pots), you can infer **Belief/Value** (because no rational economic actor does this without a non-material return).
          *   If the action retains the object/value within the human economy (stash under floor, coins in a pot), you can only infer **Economics/Security**.
          *   *Caveat:* You can infer *Practice* from patterns (thresholds, solstice alignment), but you cannot infer *Specific Theology* (what they called the god, exactly why) unless the irreversibility is tied to a specific narrative (grave goods imply a journey).

  4.  **Evaluate the User's Verdicts against the Refined Principle:**
