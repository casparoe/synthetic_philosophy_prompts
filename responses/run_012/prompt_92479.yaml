      *   *Structure:*
          1.  Validate the gut (it's good).
          2.  Refine the principle (It's not just Effort vs. Savings, it's **Removal from Circulation**).
          3.  Test the principle against the user's cases (Show why the Axe/Nail distinction works).
          4.  Address the "Wobble" (Confirm the Axe/Nail logic).
          5.  Apply to the New Cases (Broken pots, Skull hoard).
          6.  Final "Permission" statement for the novelist.

      *   *Self-Correction on the Stone Ring:* The user says "I won't say they worshipped it." My refined principle supports this. Tracking is functional. Worship is theological. The *effort* proves it mattered, but not *how* it mattered. I need to make sure I distinguish between "Belief in order/cosmos" and "Belief in a deity."
      *   *Self-Correction on the Temple:* The user says "I genuinely can't tell." My principle supports this. A building is a container. Without contents (deposits), the *specific* belief is hidden.

      *   *Key Insight for the Novelist:* Archaeology tells you what they *did*. It rarely tells you what they *said*. But if what they *did* made no economic sense, they must have had a non-economic reason (Belief).
