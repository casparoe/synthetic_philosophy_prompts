answer: |-
  Your gut is better than your principle. Your principle is close, but it's missing the specific mechanism that makes your verdicts consistent.

  The principle isn't about "Effort vs. Savings." It's about **Removal from Circulation.**

  Here is the refined rule: **If an object is deliberately removed from the human economy permanently, you are allowed to infer Belief. If it is retained within the human economy, you are only allowed to infer Economics.**

  However, there is a second layer: **Symbolic Resonance.** You can infer *specific* beliefs only if the object's function mirrors the belief. If the object is generic, you can only infer *general* practice.

  Here is how this fixes your wobbles and handles your new cases.

  ### 1. The Axe vs. The Nail (The Wobble)
  Your principle says: "Lavish effort = Belief."
  *   **The Axes:** Bronze is expensive. Burying them in a bog makes them unrecoverable. You have taken high value and *destroyed* its economic utility. No rational merchant does this. Therefore, a non-rational (spiritual) obligation forced the hand. **Verdict: Belief.**
  *   **The Nails:** Iron is valuable. Burying them under a floor keeps them dry and secure, but *recoverable*. This is a safe. It retains economic utility. **Verdict: Economics.**

  **Why you felt the wobble:** You were looking at the material (Bronze vs. Iron). But the logic relies on the *deposition* (Bog vs. Floor). A bog is a lockbox with no key. A floor is a lockbox with a key. Your gut was right; your principle just needed to focus on retrievability, not just "lavishness."

  ### 2. The Figurine vs. The Grave (The Specificity Limit)
  *   **The Figurines:** They are buried (Removed from Circulation). So, Belief is confirmed. But a figurine is generic. Does it represent a grandmother? A demon? A luck-charm? There is no **Symbolic Resonance** between "clay person" and "specific theological concept." **Verdict: Practice only.**
  *   **The Grave:** Wagon and horses are buried (Removed from Circulation). But a wagon is for travel. Cups are for drinking. The objects *mirror* the proposed belief (Traveling and Hosting). The resonance is high. **Verdict: Specific Belief allowed.**

  ### 3. The Stone Ring vs. The Image-less Temple
  *   **The Ring:** Massive effort, removed from circulation (labor spent). But alignment is functional. It *does* something observable (marks the sun). You cannot prove if they loved the sun, feared the sun, or just used the sun to know when to plant. **Verdict: Knowledge/Order, not Worship.**
  *   **The Temple:** Massive effort. But an empty altar is ambiguous. Is the god invisible? Or did the carvers die of plague before finishing? There is no action taken that forces a specific interpretation. **Verdict: Unknown.**

  ### 4. Your New Cases
  Here is what the principle predicts you are allowed to write:

  **Case A: A pit with thousands of tiny deliberately-broken pots.**
  *   **Analysis:** Breaking is the ultimate removal from circulation. You cannot un-break a pot. This is economic suicide on a mass scale.
  *   **The Permission:** You are allowed to write that the *breaking* was the point. This was not an accident; it was a release.
  *   **The Limit:** You cannot say *what* was released. Was it the spirit of the pot? The spirit of the contents? A promise to a god?
  *   **Write this:** "They felt the pot had to die to finish the work."
  *   **Don't write this:** "They believed the clay held sins that needed shattering." (Too specific without text).

  **Case B: A hoard of coins mixed with jewelry and one human skull.**
  *   **Analysis:** Wealth removed from circulation + Human remains.
  *   **The Permission:** You are allowed to infer that the skull is not merely a corpse, but a *guardian* or a *key*. Wealth + Ancestor/Enemy = Transactional Spirituality.
  *   **The Limit:** You cannot know if the skull is the owner of the wealth (a grave) or the guardian of the wealth (a foundation deposit).
  *   **Write this:** "They believed the wealth needed a watcher," or "They believed the dead man could spend this where the living could not."
  *   **Don't write this:** "They worshipped a Skull God named X." (Too specific).

  ### Summary: What You Are Allowed To Write
  You are writing fiction, but you want the texture of truth. Here is your license:

  1.  **If it's lost forever (Bog, Broken, Buried with dead):** You can write internal monologue about *obligation*. Characters can feel they *must* do this, even if it hurts their survival. That is the definition of ritual.
  2.  **If it's stored (Floor, Cave, Pot):** You must write internal monologue about *security*. They intend to use it later.
  3.  **If the object matches the theory (Wagon = Travel):** You can name the belief.
  4.  **If the object is generic (Figurine, Stone, Empty Altar):** You can name the *feeling* (awe, caution, necessity), but not the *doctrine*.

  Your gut is working because it recognizes **Sacrifice.** Where there is sacrifice, there is belief. Where there is storage, there is trade. Trust the sacrifice.
