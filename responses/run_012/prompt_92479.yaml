      *   *The Wobble (Axes vs. Nails):* The user's principle holds up here. The material (Bronze vs. Iron) matters less than the *context of deposition* (Bog vs. Floor). The user's gut is correct: Bog = Lost forever = Ritual. Floor = Saved for later = Economic.

  5.  **Address the New Cases:**
      *   *Case A: Pit of thousands of tiny deliberately-broken pots.*
          *   Action: Deliberate breaking (Destruction).
          *   Reversibility: Irreversible.
          *   Economy: Negative value (destroying utility).
          *   Inference: **Belief/Ritual.** Specifically, a ritual of completion, release, or offering that requires destruction. You can write characters who feel the *necessity* of breaking them.
      *   *Case B: Hoard of coins/jewelry + one human skull.*
          *   Action: Burial of wealth + Human remains.
          *   Reversibility: Irreversible (Burial).
          *   Economy: Wealth removed.
          *   Inference: **Belief + Power.** This isn't just a grave; it's a statement. The skull implies ancestry, trophy, or foundation sacrifice. The wealth implies status or payment.
          *   Nuance: Is the skull the owner? Or a guardian?
          *   Verdict: You can infer they believed wealth and the dead (or this specific dead) were linked in a way that justified removing both from circulation.

  6.  **Drafting the Response:**
