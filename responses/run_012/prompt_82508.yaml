answer: |-
  Dear Colleague,

  This is a formidable teaching challenge because you are asking a group of practical minds to accept a counterintuitive normative structure without giving them the usual pragmatic scaffolding they rely on. To pull this off in ninety minutes, you cannot simply lecture on the theory; you have to walk them into a corner where their usual tools fail, and then hand them the key that fits only one lock. The session needs to begin by establishing a shared intuition that a promise is distinct from a prediction or a statement of intent, because if they do not grant that distinction at the outset, the rest of the architecture will collapse. You need to secure their agreement that when we say I promise, we are doing something different than saying I intend, and the way to do this is not by defining terms but by exposing the different reactions we have when those statements turn out false. If you say you intend to come and do not, you might be unreliable or changeable, but if you promise and do not, you have wronged someone. That specific sense of wronging is the phenomenon you need to isolate before you even ask why it exists.

  Once that intuition is live, you must introduce the case that will carry the entire session, and here I advise against using the promise to do what one would have done anyway as your primary engine. While that case effectively highlights that the speech act adds something, it fails to kill the consequentialist fallback because if the promisor was going to do it anyway, the consequences are likely fine, and the audience will slip back into thinking the obligation is just about the outcome. The promise to a deceased person is stronger for your purposes, but it carries a risk regarding the second condition you need to prove, which is that the obligation is owed to the promisee in a way that gives them the power of release. If the promisee is dead, the mechanics of release become metaphysically murky for a room of lawyers who prefer clear titleholders. I recommend you modify the dead person case slightly to preserve the living holder of the right. Construct a scenario where a promisor makes a serious promise to a friend, the friend subsequently falls into a permanent coma or dies, and a designated executor or surrogate is appointed who explicitly knows the promise and tells the promisor that performance is no longer required and would actually be a waste of resources. This setup ensures that breaking the promise costs no one anything measurable, satisfies the condition that the promisor has an obviously better use of his time, and yet preserves a living agent who holds the power of release. This allows you to test whether the obligation survives the disappearance of harm and reliance, while keeping the structure of who owns the obligation intact.

  You should introduce this case early, immediately after establishing the difference between promise and prediction, because you need the case to do the heavy lifting of refuting the first major misconception that will surface, which is that a promise is just a prediction of one's own behavior. When you present the case, someone will inevitably argue that if the friend is comatose or dead, the promise was merely a statement of intent that is now obsolete. You must head this off by asking them whether they would feel differently if the promisor had said I intend to visit versus I promise to visit. If they admit the moral residue is different, you have established that the speech act created a new normative fact, not just a psychological expectation. Once that is granted, the lawyers in the room will almost immediately attempt to convert the discussion into contract law, asking about consideration and enforceability. You must dispose of this in the sentence you requested, perhaps by stating that contract law is a regulatory system that often piggybacks on the moral phenomenon of promising but is not identical to it, and that we are investigating the underlying obligation that makes the contract binding in the first place. Do not let them linger there, or you will lose the moral structure to legal technicalities.

  The next misconception to anticipate is the reliance theory, which will arise naturally when you point out that the comatose friend cannot rely on the promise and suffers no harm if it is broken. The audience will want to say that without reliance, there is no obligation. This is the precise moment to introduce the first half of your core thesis, which is that a promise is not merely a heavy reason among others but an exclusionary reason. You need to show them that if the obligation depended on reliance, the promisor could calculate whether reliance occurred and decide accordingly, but our intuition is that the promisor is not free to make that calculation. The promise itself removes the option of weighing the benefits of breaking it against the costs. You can press this by asking if the promisor would be permitted to break the promise if he found a slightly better use of his time, even if no one was harmed. If they say yes, they are treating the promise as a weighty reason; if they say no, they are acknowledging it as an exclusionary reason. You must guide them to see that the latter is the only view that respects the authority the promisee has over the promisor's actions.

  Following this, the misconception that a promise no one knows about is not binding will surface, usually as a reaction to the secrecy of the case. If the executor knows but the public does not, does it matter? This is a good opportunity to reinforce that the obligation is interpersonal rather than public. However, the more dangerous misconception that will emerge from this sequence, and one you might be missing, is the idea that the obligation is merely internal or psychological, essentially a matter of guilt or integrity. If they think the binding force is just about the promisor's own conscience, they will miss the second half of your thesis, which is that the obligation is owed to the promisee. You need to pin this down when you discuss the power of release. If the obligation were just about the promisor's integrity, the promisee's release would not matter; the promisor could still feel bound to keep their word to maintain their own character. But if the obligation is owed to the promisee, the promisee's release dissolves the obligation entirely, even if the promisor would prefer to keep it. You must structure the discussion so that they see the release not as a favor but as the extinguishing of a right held by another.

  This leads directly to the misconception that the promisor can release himself. This will likely come up when you discuss the better use of time. Lawyers especially may argue that if the circumstances change sufficiently, the promisor can deem the promise void. You must correct this by returning to the structure of the right. If the obligation is owed to the promisee, the promisor lacks the jurisdiction to cancel it. You can illustrate this by asking if the promisor would be permitted to unilaterally decide the promise is no longer binding because he has found a better use of his time. The answer must be no, not because the consequences are bad, but because he is not the owner of the obligation. This is the crux of the session, and it must land before you address the final misconception regarding insincerity. Participants will ask if an insincere promise was never a promise at all. You should address this last because it threatens to undo the work of the session by suggesting that the obligation depends on the internal state of the promisor. You need to clarify that while insincerity is a defect, it does not necessarily negate the obligation created by the speech act, because the promisee has already acted on the assurance given. However, do not let this devolve into a debate on fraud; keep it focused on whether the obligation exists despite the internal lack of intent.

  To close the session, you need a single question that tests whether they have grasped the structural relationship between the exclusion of reasons and the power of release, rather than just memorizing your positions. I suggest you ask them this: If the person you promised to explicitly releases you from the promise, but you know that keeping it would produce better consequences for everyone involved than breaking it, are you permitted to keep it? If they have grasped the structure, they will see that the release terminates the obligation, so keeping it is no longer an act of promise-keeping but merely a supererogatory good deed, and they might even say you should not keep it if it undermines the institution of promising or the promisee's authority. If they say you are still obligated to keep it, they have missed the point that the obligation was owed to the person. If they say you are free to keep it but not obligated, they have understood that the release dissolves the bond. This question forces them to choose between consequentialist reasoning and the normative structure of the promise itself.

  Finally, there is something you must refuse to explain, and you should say so out loud to prevent the session from drifting into metaphysics. You must refuse to explain the mechanism by which words create obligations. There is no physical or causal mechanism that turns sound waves into bonds; it is a normative status created by shared social practice. If you try to explain how it happens in a causal sense, you will lose the room to naturalism. Tell them explicitly that you are not explaining the physics of obligation but the logic of the practice, and that asking how words bind is like asking how moves in chess create a checkmate; it is a rule of the game, not a force in the world. By setting this boundary, you protect the session from becoming a debate about realism versus anti-realism and keep them focused on the structure of the obligation itself. If you manage the sequence this way, moving from the intuition of wronging to the elimination of harm, then to the exclusion of reasons, and finally to the ownership of the obligation, you should be able to lead them to the conclusion without ever asserting it as a dogma.
