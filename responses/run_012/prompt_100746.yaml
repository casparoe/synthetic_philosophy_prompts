answer: |-
  **MEMORANDUM**

  **TO:** Exhibition Advisory Committee
  **FROM:** [Your Name], PhD Candidate, Department of Archaeology
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Exhibition Framing and Title

  **Recommendation**
  I recommend we shift the exhibition's core framing from "Collapse" to "Transformation." Specifically, we should retitle the exhibition to something like *When Societies Change: Resilience and Adaptation* and restructure the narrative arc to highlight continuity alongside discontinuity. The design team should begin pivoting text panels to reflect this shift by **Friday, November 10**, allowing time for copy revisions before final layout lock.

  **Reasoning**
  Our current framing relies on "collapse" as a singular event. Archaeologically, this term bundles three distinct processes: demographic decline, the breakup of ruling apparatuses, and loss of cultural complexity. In many cases, including the Late Bronze Age and Classic Maya, the "collapse" is primarily the failure of elite institutions (palaces, script, administration). Meanwhile, village life, farming systems, and regional populations often persist or reorganize. By focusing on the fall of elites, we risk teaching the public that society ended when it actually transformed.

  Furthermore, the Rapa Nui case is no longer considered a textbook example of self-inflicted ecocide. Recent evidence suggests complex adaptation and resilience prior to European contact. Presenting it as a cautionary tale of environmental suicide relies on outdated data and undermines our scientific credibility.

  **Addressing the Counter-Argument**
  I understand the design team's concern that "collapse" provides a necessary hook. There is a valid worry that nuanced framing loses public engagement. "Collapse" promises drama and a clear moral lesson; "Transformation" risks sounding academic or tepid. We must acknowledge that removing the disaster narrative makes the marketing challenge harder.

  However, our mission as a university museum is to lead public understanding, not merely reflect existing assumptions. The "disaster hook" relies on a false binary that visitors are increasingly ready to question. We can retain the dramatic visual elements of ruin and change but recontextualize them. The hook becomes not "Watch them fail," but "How did they survive?" This maintains tension while aligning with current archaeological consensus.

  **Next Steps**
  If we approve this shift, the design team can retain the existing visual assets (ruins, artifacts) but will need to rewrite interpretive text to emphasize what persisted, not just what vanished. This framing allows us to keep the three case studies without forcing them into an obsolete theoretical model.

  I am happy to work with the design team on specific wording to ensure the new framing remains compelling.
