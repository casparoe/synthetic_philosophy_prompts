      *   **Task:** Draft a short written opinion (memo) for an advisory committee meeting regarding a university museum exhibition on societal "collapse."
      *   **Audience:** Committee members (including design team, other academics, museum staff).
      *   **Constraints:** Under one page, no citations (user will add them), concrete recommendation on title/framing, deadline for design team, reasoning, honest treatment of the strongest counter-argument (the "hook" worry).
      *   **Key Issues:**
          *   Current framing: "Collapse," standard trio (Late Bronze Age, Maya, Rapa Nui), cautionary tale.
          *   User's critique: "Collapse" conflates demographic decline, elite breakup, and loss of complexity. Evidence often shows continuity (villages, farming) despite elite failure. Proxies are elite-biased. Rapa Nui ecocide narrative is contested/problematic.
          *   Counter-argument: Dropping "collapse" loses public engagement/the "hook."
      *   **Goal:** Persuade the committee to shift framing without alienating the design team, acknowledging the marketing concern while prioritizing archaeological accuracy.

  2.  **Determine the Tone and Style:**
      *   **Tone:** Professional, collegial, persuasive, nuanced, authoritative but respectful (it's a student writing to a committee).
      *   **Format:** Memo format (To, From, Date, Subject).
      *   **Length:** Strictly under one page (approx. 400-500 words).

  3.  **Drafting - Section by Section:**

