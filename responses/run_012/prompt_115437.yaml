answer: |-
  # Decision Tree: The Topology of Technological Politics

  This instrument maps the logical space of the debate over whether artifacts have politics. It is designed to prevent the collapse of distinct positions into a binary of "Determinism vs. Constructivism." Navigate the tree by answering the questions at each node. The questions are ordered so that you can answer them based on your analysis of a case without knowing which theoretical position you are approaching.

  ### **Node 1: Locus of Political Effect**
  **Question:** Is the political effect located *solely in the context of use* (the artifact is transparent), or does the *design/materiality* contribute independently?
  *   **Branch A (Use Only):** The artifact is neutral; politics arises only from how humans wield it.
      *   **→ LEAF 1: Instrumentalism**
          *   *Case:* The **seat belt** saves lives only when people use it; the buckle itself holds no political stance.
          *   *Awkward Commitment:* Must explain why some uses are systematically encouraged or discouraged by the object's shape.
  *   **Branch B (Design/Materiality):** The artifact's physical form or operational logic shapes political outcomes.
      *   **→ Go to Node 2.**

  ### **Node 2: Source of Political Character**
  **Question:** Is the artifact's political character settled primarily by *negotiations between social groups* before stabilization, or by *material/operational constraints*?
  *   **Branch A (Negotiation):** Politics is the result of human conflict and compromise during the design phase.
      *   **→ LEAF 2: Social Constructivism (SCOT)**
          *   *Case:* A **voting system's** categories encode prior political decisions settled by committees, not by the code itself.
          *   *Awkward Commitment:* Must treat the stabilized artifact as a "black box" that hides the politics rather than enacting them.
  *   **Branch B (Material/Operational):** Politics emerges from how the technology works, regardless of the design negotiations.
      *   **→ Go to Node 3.**

  ### **Node 3: Functional Flexibility & Necessity**
  **Question:** Could the same technical function be achieved by a differently designed artifact with *different* political effects, or does this technology *require* a specific social arrangement?
  *   **Branch A (Inflexible/Required):** The technology functions only within a specific social order (e.g., hierarchy, centralization).
      *   **→ Go to Node 3a.**
  *   **Branch B (Flexible/Influential):** The technology can function in multiple social orders but biases outcomes toward one.
      *   **→ Go to Node 4.**

  #### **Node 3a: Direction of Necessity**
  **Question:** Does the technology *produce* the social change as an inevitable consequence, or does it *presuppose* the social order to function at all?
  *   **Branch i (Produces Change):** The technology drives history; society must adapt to the machine.
      *   **→ LEAF 3: Strong Technological Determinism**
          *   *Case:* The **mechanized tomato harvester** made small farms unviable, forcing industrialization regardless of worker welfare. *(Note: This answer depends on the contested historical fact of whether alternative harvesters were possible.)*
          *   *Awkward Commitment:* Must treat social resistance as futile lag rather than genuine political agency.
  *   **Branch ii (Presupposes Order):** The technology requires a specific polity to operate; it is inherently political.
      *   **→ LEAF 4: Inherent Politics (Winner)**
          *   *Case:* **Low overpasses** deliberately built to exclude buses require a social order of exclusion to function as intended.
          *   *Awkward Commitment:* Must distinguish between a technical requirement and a designer's prejudice encoded as a requirement.

  ### **Node 4: Unit of Agency & Intention**
  **Question:** Is the political capacity resident in the *individual artifact* or the *sociotechnical assemblage*?
  *   **Branch A (Individual Artifact):** The object itself acts as a political agent.
      *   **→ Go to Node 4a.**
  *   **Branch B (Sociotechnical Assemblage):** The politics resides in the network (infrastructure, law, maintenance, users).
      *   **→ Go to Node 4b.**

  #### **Node 4a: Role of Intention (Artifact)**
  **Question:** Is the constraint *encoded by designers* as a moral rule, or *emergent from material properties*?
  *   **Branch i (Encoded):** Designers delegate morality to the object; it enforces rules.
      *   **→ LEAF 5: Delegation of Agency (Latour)**
          *   *Case:* A **speed bump** enforces slow driving by threatening damage, acting as a quasi-police officer.
          *   *Awkward Commitment:* Must grant objects a form of agency that risks dissolving the distinction between subjects and things.
  *   **Branch ii (Emergent):** The object biases behavior through affordances without explicit encoding.
      *   **→ LEAF 6: Affordance/Design Bias**
          *   *Case:* A **staircase** invites walking and discourages wheelchairs without explicitly banning them.
          *   *Awkward Commitment:* Must explain how a bias becomes a constraint without appealing to social enforcement.

  #### **Node 4b: Source of Systemic Logic (Assemblage)**
  **Question:** Is the political effect traceable to the *technology's internal logic* spreading outward, or the *contingent configuration* of the network?
  *   **Branch i (Tech Logic):** The technology's efficiency or rationality reshapes the network.
      *   **→ LEAF 7: Weak Technological Determinism**
          *   *Case:* **Credit-scoring systems** spread financial discipline because their logic is more efficient than human judgment.
          *   *Awkward Commitment:* Must explain why the "logic" of technology appears neutral when it embodies specific values.
  *   **Branch ii (Network Configuration):** The politics is in the arrangement of humans and non-humans; neither dominates.
      *   **→ LEAF 8: Sociotechnical Assemblage (Co-production)**
          *   *Case:* A **voting machine** is political only when combined with laws, training, and maintenance routines.
          *   *Awkward Commitment:* Risks making "politics" so diffuse that no specific site of responsibility can be identified.

  ### **Unoccupied Logical Space**
  *   **→ LEAF 9: [UNOCCUPIED] Negotiated Inflexibility**
      *   *Path:* Node 1 (Design) → Node 2 (Negotiation) → Node 3 (Inflexible).
      *   *Description:* The view that social groups negotiate a design that is *materially incapable* of functioning in any other social order.
      *   *Status:* **Incoherent.** If the constraint is truly material/inflexible (Node 3), it cannot be settled merely by negotiation (Node 2); if it is settled by negotiation, it remains flexible to further negotiation.
      *   *Awkward Commitment:* Claims human agreement can override physical necessity while simultaneously claiming physical necessity dictates social order.

  ---

  ### **Structural Notes for the Seminar**

  **1. Indistinguishable Positions**
  **Weak Determinism (Leaf 7)** and **Sociotechnical Assemblage (Leaf 8)** often answer the tree identically in practice. Both locate politics in the system and acknowledge flexibility. They are distinct only in *emphasis*: Weak Determinism retains a causal arrow from Tech → Society (the logic spreads), whereas Assemblage theory rejects the arrow for mutual constitution (co-production). If a student cannot specify the *direction* of the influence, these two leaves collapse.

  **2. Historical Contingency**
  Note the **Tomato Harvester (Leaf 3)**. Classifying this as Strong Determinism depends on the contested historical fact that no labor-friendly harvester was *technically* possible. If a flexible alternative existed (Node 3, Branch B), the position shifts to Weak Determinism or Inherent Politics. The tree exposes that "Determinism" is often a claim about the *absence of alternatives* rather than the presence of causal force.

  **3. Revision and Vulnerability**
  *   **Single Consideration for Revision:** If you accept **Post-humanist Symmetry** (the claim that humans and artifacts are ontologically identical in their capacity to act), **Node 1 (Locus)** collapses. You can no longer separate "Use" from "Design" because the user is also an artifact and the artifact is a user. This would flatten the top half of the tree, forcing a merger of Instrumentalism, Delegation, and Affordance.
  *   **Most Likely Error:** The distinction between **Inherent Politics (Leaf 4)** and **Strong Determinism (Leaf 3)** is the most fragile. In reality, technologies that "require" a social order often "produce" it as well. I have separated them logically (Presuppose vs. Produce), but empirically they may be the same phenomenon described from different temporal perspectives. A critic could argue this split is artificial.
