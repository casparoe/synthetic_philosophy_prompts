answer: |-
  The Free Port of Ostral did not believe in sin, only in instability. In the glass-walled towers of the Bureau of Exchange Stability (BES), morality was reduced to arithmetic. A trader was not wicked for losing money; they were wicked for losing money in a circle.

  Elara Vane, a Senior Auditor for the Bureau, sat behind a desk of polished basalt. Before her lay the certification files for the quarter. The legal doctrine was simple: The Principle of Voluntary Betterment. If a trader agreed to a trade, disclosed the terms, and preferred their new position to their old one at the moment of exchange, the trade was lawful. Fraud was impossible if consent was present. Therefore, the only protection the state could offer was to ensure the trader's preferences were coherent enough to prevent them from consenting to their own ruin.

  To be denied a "Stable Hand" license was not a punishment. It was a diagnosis. It meant the agent was unfit to navigate the market without bleeding capital to any predator who noticed the leak.

  **I. The Cycle**

  The first applicant was Kaelen, a commodities broker specializing in shipping insurance. He sat with his hands folded, confident. He held three contracts: Policy Red, Policy Blue, and Policy Green.

  "State your preference, Mr. Kaelen," Elara said, her stylus hovering over the digital ledger.

  "Red is better than Blue," Kaelen said. "Blue is better than Green."

  "And Green?"

  Kaelen smiled. "Green is better than Red. Red has the highest payout in a fire, but Green has the lowest premium. I value the premium savings over the fire risk, but I value the fire payout over the moderate coverage of Blue."

  Elara did not blink. She tapped the glass. "Initiate the Exchange Sequence."

  A clerk from the Bureau's testing division entered the room. He placed a stack of credit chits on the table.

  **The Ledger of Kaelen**
  *   **Start:** Holds Policy Green. Cash: 1000 Credits.
  *   **Trade 1:** Clerk offers Policy Blue for Policy Green + 1 Credit Fee.
      *   *Kaelen's Preference:* Blue > Green.
      *   *Action:* Kaelen accepts.
      *   **State:** Holds Policy Blue. Cash: 999 Credits.
  *   **Trade 2:** Clerk offers Policy Red for Policy Blue + 1 Credit Fee.
      *   *Kaelen's Preference:* Red > Blue.
      *   *Action:* Kaelen accepts.
      *   **State:** Holds Policy Red. Cash: 998 Credits.
  *   **Trade 3:** Clerk offers Policy Green for Policy Red + 1 Credit Fee.
      *   *Kaelen's Preference:* Green > Red.
      *   *Action:* Kaelen accepts.
      *   **State:** Holds Policy Green. Cash: 997 Credits.

  The clerk stepped back. Kaelen held the exact same policy he had started with. He was down three credits.

  "This is the third time this hour, Mr. Kaelen," Elara said, stamping the file with a heavy, red *DENIED*. "Under the Voluntary Betterment Act, every trade you made was legal. You preferred the new state to the old state at every timestamp. But the loop closes. You have paid three credits to remain stationary."

  "The market values flexibility," Kaelen argued, though his voice lacked force.

  "The market values direction," Elara corrected. "You are a money pump. Any counterparty can drain you until you are insolvent. We cannot certify you. You are not malicious; you are leaky."

  Kaelen left without his license. He would be allowed to trade, but he would do so without the state's seal, a pariah to the major banks who required Stable Hands for clearing. He was free to lose his money, but he was not fit to hold it.

  **II. The Sure-Thing Violation**

  The next file belonged to Mira, a venture capitalist. Her issue was not a circle, but a fracture in how she weighed certainty against probability. This was a violation of the Sure-Thing Principle, though the Bureau referred to it as "Contextual Instability."

  Mira sat opposite Elara, nervously tapping a pen. On the table lay two investment portfolios. Portfolio A offered a guaranteed return of 1 million credits. Portfolio B offered a 90% chance of 5 million credits and a 10% chance of zero.

  "In isolation," Mira said, "I prefer B. The expected value is higher."

  "But?" Elara prompted.

  "But if there is a background condition... say, if I already own a subsidiary that pays out 5 million credits in the 'zero' scenario of Portfolio B... then I prefer A. The certainty matters more when the downside is already covered elsewhere."

  Elara nodded. This was the fracture. Mira's preference between A and B flipped depending on a common consequence that should have been irrelevant. "We are going to test your dynamic consistency. We will simulate a two-stage investment."

  Elara projected a hologram into the center of the room.

  "Stage One," Elara narrated. "You have the option to pay a 'Lock-In Fee' of 50,000 credits. If you pay, Portfolio B is removed from the table in Stage Two. You will be forced to take Portfolio A later. If you do not pay, you retain the freedom to choose between A and B in Stage Two."

  Mira frowned. "If I don't pay, what will I choose in Stage Two?"

  "Based on your psych-profile," Elara said, "in Stage Two, without the pressure of the fee, you will choose Portfolio B. It is the higher expected value. However, you have told us that *right now*, considering your broader portfolio, you prefer the certainty of A."

  "So," Mira said slowly. "My future self will make a choice my current self dislikes."

  "Exactly. Your current self violates the Sure-Thing Principle. You rank the options differently depending on whether the choice is immediate or contingent. To align your future action with your current preference, you must restrict your future freedom."

  Mira looked at the hologram. She knew that if she waited, she would pick B. She knew that picking B would regretfully contradict her current assessment of risk. To satisfy her current self, she had to lobotomize her future self.

  She authorized the transfer.

  **The Ledger of Mira**
  *   **Start:** Cash: 10,000,000 Credits. Option to Choose A or B later.
  *   **Action:** Pays Lock-In Fee to remove Option B.
  *   **Cost:** -50,000 Credits.
  *   **Result:** Forced to take Portfolio A later.
  *   **Net Position:** Same Portfolio outcome as if she had just chosen A initially, but minus 50,000 Credits.

  Elara stamped the file *DENIED*.

  "You paid 50,000 credits to remove an option you did not want, which you would have freely rejected later anyway," Elara said. "A coherent agent does not need to pay to bind their own hands. The fee is the cost of your incoherence. You are taxing yourself to manage your own inconsistency."

  Mira stared at the deduction notice. "I protected my interests."

  "You paid a premium to exist in two time periods as different people," Elara said. "The Bureau cannot certify a trader who is at war with their own future."

  **III. The Incompleteness**

  Joren was different. He did not cycle, and he did not flip. He simply stopped.

  He was an art dealer, dealing in assets with no yield, only aesthetic value. Elara placed two paintings before him. *The Blue Square* and *The Red Circle*.

  "Which do you prefer, Joren?"

  "I do not know," Joren said. "They are different. One is not better than the other. They are incomparable."

  Elara leaned forward. This was the hardest case. The Bureau's doctrine assumed completeness—that any two states could be ranked. If they could not be ranked, the market could not clear efficiently.

  "Imagine a counterparty offers to swap *The Blue Square* for *The Red Circle* for a fee of 1 credit," Elara said. "Do you accept?"

  "No. I do not prefer the Circle to the Square."

  "Imagine they offer to swap *The Red Circle* for *The Blue Square* for a fee of 1 credit. Do you accept?"

  "No. I do not prefer the Square to the Circle."

  Elara turned to the Director of Licensing, who was observing behind the glass. "He is inert. He cannot be pumped. He refuses to trade in either direction."

  The Director's voice came over the intercom, cold and flat. "Apply the Forced-Choice Assumption."

  Elara turned back to Joren. "Mr. Joren, under the Market Participation Act, you must hold one asset or the other. You cannot hold 'neither' and you cannot hold 'both' indefinitely. You must divest one to acquire the other for tax purposes."

  Joren shifted. "That is an external constraint."

  "It is the reality of the market," Elara said. "If you are forced to choose, which do you pick?"

  "If I am forced... then I pick the Square."

  "Then we assign a shadow price," Elara said, typing rapidly. "If you pick the Square when forced, it implies the Square is preferred. If we then offer you the Circle for the Square plus a small fee, and you accept because you are indifferent, we can begin the cycle."

  Joren stood up. "I am not indifferent. I am incomparable. You are inventing a preference to tax me."

  "The Bureau does not recognize incompleteness," Elara said, her voice tight. "It recognizes only unexpressed preference. If you cannot rank them, you are vulnerable to a counterparty who *can* rank them for you and charge you for the privilege of deciding."

  She looked at the file. To pump Joren, the Bureau had to assume he *must* choose. Without that assumption, the money pump stalled. The incoherence here was not in Joren, but in the requirement that he have an opinion at all.

  Elara hesitated. The stamp hovered. If she denied him, she was asserting that incompleteness was a defect equivalent to a cycle. If she certified him, she admitted the market could function without complete rankings.

  She stamped *DENIED*. "You lack a defined utility function. You are unpredictable. In Ostral, unpredictability is a systemic risk."

  Joren took his paintings and left. He had not lost money, but he had lost his place in the system. Elara watched him go, wondering if the pump required a broken agent, or just a system that refused to accept 'I don't know' as an answer.

  **IV. The Pre-Commitment**

  Silas was the anomaly. He sat with a thick binder labeled "Constitution."

  "I know I have a cycle," Silas said before Elara could speak. "I know that on Tuesdays I prefer Risk, and on Fridays I prefer Safety. If I trade day-to-day, I will be pumped."

  "So?" Elara asked.

  "So, I have signed a Pre-Commitment Pact. I will not trade between Risk and Safety profiles regardless of my current preference. I will hold the 'Median Portfolio' for ten years. I will ignore my own desires at the moment of trade."

  Elara opened the file. "You are proposing to act against your revealed preference at every timestamp."

  "I am acting according to my long-term plan," Silas said. "My current self wants to trade. My Plan says no. I obey the Plan."

  "This violates the Principle of Voluntary Betterment," Elara said. "At the moment of the trade offer, you would prefer the new state. By refusing, you are choosing a state you currently rank lower."

  "I am ranking the *adherence to the Plan* higher than the *immediate gain*," Silas countered.

  "Is that true?" Elara asked. "Or are you simply lobotomizing your agency?"

  She ran the simulation. Silas would avoid the money pump. He would not lose the credits Kaelen lost. But he would also miss genuine opportunities. If the market shifted and the Median Portfolio became disastrous, Silas would refuse to switch to save himself, because the Plan forbade it.

  **The Ledger of Silas**
  *   **Start:** Holds Median Portfolio.
  *   **Opportunity:** Market crash imminent. Switch to Safe Portfolio saves 1,000,000 Credits.
  *   **Silas's Current Preference:** Prefers Safe Portfolio.
  *   **Plan Constraint:** "No changes for 10 years."
  *   **Action:** Silas refuses to switch.
  *   **Result:** Silas loses 1,000,000 Credits.
  *   **Status:** Consistent, but ruined.

  Elara looked at him. He was immune to the pump, but only by becoming rigid. He had cured the disease of incoherence by killing the patient's ability to feel.

  The Bureau's system flagged him. *STATUS: PATHOLOGICAL RIGIDITY.*

  "You are not certified," Elara said. "You are not a rational agent. You are a rule-following algorithm. We license traders, not scripts."

  "I am safe," Silas said.

  "You are safe from predators," Elara corrected. "But you are also deaf to the market. You have traded flexibility for immunity. The Bureau cannot certify a trader who will not respond to price signals."

  He left with his Constitution, safe from being pumped, and doomed to be irrelevant.

  **V. The Audit**

  The sun set over Ostral, turning the glass towers of the Bureau into pillars of fire. Elara remained at her desk. The files of the denied were stacked to her left; the certified to her right. The ratio was unsettling.

  She opened the internal server, the one marked *DIRECTORATE ONLY*. She had clearance, but rarely used it. She needed to check the Bureau's own ranking protocols against the standards she had applied all day.

  The Bureau prioritized licensing cases based on three metrics: Stability (S), Revenue (R), and Compliance (C).

  Elara pulled the logs from the last quarter.

  *   **Case 402 vs Case 405:** The Director prioritized Case 402.
      *   *Reasoning:* 402 had higher Stability (S) than 405. Revenue was equal.
      *   *Implied Preference:* S > R (when R is constant).
  *   **Case 405 vs Case 410:** The Director prioritized Case 405.
      *   *Reasoning:* 405 had higher Revenue (R) than 410. Compliance was equal.
      *   *Implied Preference:* R > C (when C is constant).
  *   **Case 410 vs Case 402:** The Director prioritized Case 410.
      *   *Reasoning:* 410 had higher Compliance (C) than 402. Stability was equal.
      *   *Implied Preference:* C > S (when S is constant).

  Elara froze.

  S > R.
  R > C.
  C > S.

  The Bureau's own ranking system cycled.

  If the Bureau were a trader, it would be denied a license. It was a money pump. A clever lobbyist could offer to shuffle the docket order, paying a small bribe for each swap, and return the Bureau to the starting docket with less integrity and no gain in efficiency.

  She looked at the *Report Anomaly* button. It glowed softly on her screen.

  If she filed the report, the Director would be disqualified. The Bureau would be forced to re-evaluate its own coherence. But to do what? To adopt Silas's rigidity? To force completeness on Joren's art? To pay Lock-In fees like Mira?

  The coherence argument proved that incoherent agents could be exploited. It did not prove that coherent agents were good. Silas was coherent and ruined. Kaelen was incoherent and kind.

  Elara looked at the stamp in her hand. It was heavy, cold basalt. It had the power to declare a man unfit. It had the power to declare the state unfit.

  The coherence argument claimed that if you are not coherent, you are a victim. But looking at the cycle in the Director's logs, Elara saw that the Director was not a victim. The Director was the one holding the stamp. The Director was the one setting the fees.

  The cycle existed, but no one dared pump the Bureau.

  Elara's finger hovered over the button. If she reported it, she would be asserting that the rules of rationality applied to the rule-makers. If she didn't, she admitted that rationality was merely a compliance standard for the licensed, not a truth for the licensor.

  The screen dimmed, waiting for input. The ledger of the Bureau was open, showing a deficit of logic that no amount of fees could cover.

  Elara withdrew her hand. She closed the file. She picked up her coat.

  Outside, the market roared, a machine fed by the certainty of those who knew what they wanted, and the blood of those who did not. She walked into the hall, leaving the question on the screen, unresolved, glowing in the dark room like a small, unblinking eye.
