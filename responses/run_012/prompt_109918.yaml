      *   *Drafting:* You're facing a state management and context propagation problem, not merely a reasoning gap. Current LLM agents operate reactively: they generate a thought, take an action, observe the result, and repeat. Without an explicit, persistent state machine, the model loses track of global constraints (like the school pickup) as the conversation history grows. Each step dilutes the attention paid to initial constraints. The "checklist" bolted on exacerbates this by adding token noise without structural enforcement, leading to loops where the model re-validates already satisfied conditions because it lacks a memory of *completed* checks. This is known as the "horizon problem" in planning: the agent sees the immediate next step clearly but fails to maintain the integrity of the overall plan across multiple hops. It's an architecture failure, not a intelligence failure. The model isn't smart enough to ignore the checklist, nor dumb enough to miss the clash; it's unstructured enough to lose the clash in the noise of execution.

