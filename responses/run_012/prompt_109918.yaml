prompt: |-
  I'm the technical lead at a small startup building an AI agent that runs errands for people — books appointments, replies to routine emails, reschedules things. It's great at single tasks, but the moment a job has more than one step it drops the ball. Ask it to move a dentist appointment and it'll email the clinic and move it, without ever checking that the new slot clashes with a school pickup sitting in a different calendar, or that the confirmation it's about to send will land in a shared inbox. So we bolted on a checklist: before finishing anything, check for clashes, shared inboxes, and a handful of other things. Now it's slow, it sometimes loops re-checking the same stuff forever, and it still misses things — just different ones. My co-founder reckons this is a model-capability problem and next year's models will just handle it. I dont buy it; I think we're up against something structural about how an agent decides what's relevant once it does anything. Am I right, and what would you actually do?

  Please lay it out as: 'What's really going on' (about 200 words — name the problem properly and say why it isn't just a bug or a capability gap); 'Why a better model won't dissolve it' (about 250 words); 'What I'd actually do' (about 300 words, concrete engineering and design advice); and 'How I'd know you're wrong' (a short list of observations that would count against your diagnosis).
