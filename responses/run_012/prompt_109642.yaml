answer: |-
  This is a high-wire act. 90 minutes is extremely tight for three distinct mechanical rounds plus a substantive debrief with 24 upper-level students. The arithmetic *will* eat your clock if you let them calculate quotas on their phones. You must control the math on the whiteboard while they control the politics.

  Here is a refined plan that protects the "Paradox" round, streamlines the arithmetic, and structures the debrief to separate mathematical impossibility from political contingency.

  ### Part 1: Game Design & Materials

  **The Setup**
  *   **Students:** 24 Voters.
  *   **Parties:** 3 Parties (Red, Blue, Green). *Note: Keep it to 3 for Round 3. Four parties makes the Alabama Paradox arithmetic too messy for a whiteboard demo.*
  *   **Districts:** 6 Districts (4 voters per district).
  *   **Seats:**
      *   Round 1: 6 Seats (1 per district).
      *   Round 2: 10 Seats (National List).
      *   Round 3: 11 Seats (National List Expansion).
  *   **Payoff:** Chocolate bars are distributed *only* to members of parties included in the governing coalition. A coalition requires >50% of seats.
      *   *Rule:* If your party has seats but is excluded from the coalition, you get no chocolate. If your party loses its seat (Round 3), you definitely get no chocolate.

  **Materials**
  1.  **Voter Cards (24 total):** Index cards pre-marked with **Party Preference** and **District Number**.
      *   *Distribution:* You need to rig the geography for Round 1 and the totals for Round 3.
      *   *Red:* 10 voters. *Blue:* 9 voters. *Green:* 5 voters. (Total 24).
      *   *Geography:* Spread them so Red wins 4 districts, Blue wins 2 districts, Green wins 0 districts (despite having ~20% of the vote).
  2.  **Whiteboard:** Pre-draw three tables (Round 1, 2, 3).
  3.  **Chocolate:** ~30 fun-size bars.
  4.  **Timer:** Visible on your phone or watch.

  **The "Rigged" Numbers (For your eyes only)**
  To guarantee the Alabama Paradox in Round 3 using the **Largest Remainder (Hamilton)** method, use these vote totals for the calculation phase. Do not count the actual cards live; announce the "Certified Electoral Commission Results" based on the cards to save 15 minutes.
  *   **Total Votes:** 100 (Scale the 24 students to 100 points for easier board math).
  *   **Red:** 45 votes.
  *   **Blue:** 35 votes.
  *   **Green:** 20 votes.
  *   *Why these numbers?* With 10 seats, Green gets 2 seats. With 11 seats, Green drops to 1 seat. (See Math Appendix below).

  ---

  ### Part 2: Minute-by-Minute Timeline

  **00:00 – 00:10: Setup & Grouping**
  *   Hand out Voter Cards.
  *   Students sit in District clusters (4 per table) for Round 1.
  *   **Rule:** "You are voters. Your goal is to get chocolate. You only eat if your party is in the government. Form your party caucuses now." (Give them 2 mins to find their color).

  **00:10 – 00:30: Round 1 (FPTP / Single Member Districts)**
  *   **Action:** Each District table counts their 4 cards. Majority wins the seat.
  *   **Board:** TA records seats won (Target: Red 4, Blue 2, Green 0).
  *   **Coalition Phase (5 mins):** Parties negotiate.
      *   *Scenario:* Red has 4/6 seats (66%). Red can govern alone.
      *   *Twist:* If Red has a majority, they don't need Blue or Green. Blue and Green get **no chocolate**.
      *   *Debrief Prompt:* "Green, you have 20% of the voters. Raise your hand if you got chocolate." (None will). "Why?"
  *   **Transition:** "Same voters. Same preferences. New Rule."

  **00:30 – 00:50: Round 2 (PR / Largest Remainder, 10 Seats)**
  *   **Action:** Collect cards. TA announces "Certified Totals" (Red 45, Blue 35, Green 20).
  *   **Board Math (Do this live but fast):**
      *   Quota = 100 votes / 10 seats = 10 votes per seat.
      *   Red: 4.5 seats (4 full, 0.5 remainder).
      *   Blue: 3.5 seats (3 full, 0.5 remainder).
      *   Green: 2.0 seats (2 full, 0.0 remainder).
      *   *Surplus:* 1 seat left. Remainders: Red (.5), Blue (.5). Tie-breaker (flip a coin or let them argue). Say Red gets it.
      *   *Result:* Red 5, Blue 3, Green 2.
  *   **Coalition Phase (5 mins):**
      *   Red (5) needs 1 more. Can pick Blue or Green.
      *   Green now has leverage. Green *should* get chocolate if they join Red.
      *   *Distribute Chocolate to Coalition Members.*
  *   **Transition:** "The country is growing. We need more representation. We expand Parliament to 11 seats. No votes changed."

  **00:50 – 01:10: Round 3 (The Paradox / 11 Seats)**
  *   **Board Math:**
      *   Quota = 100 votes / 11 seats = 9.09 votes per seat.
      *   Red: 45 / 9.09 = 4.95 (4 full, .95 rem).
      *   Blue: 35 / 9.09 = 3.85 (3 full, .85 rem).
      *   Green: 20 / 9.09 = 2.20 (2 full, .20 rem).
      *   *Wait, check the math:* 4+3+2 = 9 seats allocated. 2 surplus seats remain.
      *   Highest Remainders: Red (.95), Blue (.85).
      *   *Final Result:* Red 5, Blue 4, **Green 2**.
      *   *CRITICAL FIX:* The standard 45/35/20 split doesn't always trigger the paradox cleanly with 10->11 depending on the quota method. **Use the specific Balinski-Young set below in the Appendix.** I will adjust the timeline assuming you use the *guaranteed* paradox numbers (6, 6, 2 population split scaled up).
      *   *Revised Numbers for Board:*
          *   **10 Seats:** Red 5, Blue 3, Green 2. (Green is in coalition).
          *   **11 Seats:** Red 6, Blue 4, Green 1. (Green loses a seat).
  *   **The Reveal:** "Green, count your seats." They had 2, now they have 1.
  *   **Coalition:** If Red (6) + Blue (4) = 10/11, they don't need Green. Green is excluded *and* smaller.
  *   **Payoff:** Green gets no chocolate. They are furious.
  *   **Stop Game.**

  **01:10 – 01:30: Debrief (The most important part)**
  *   See structure below.

  ---

  ### Part 3: The Debrief Structure

  Do not lecture. Ask questions that force them to articulate the theory, then label it.

  **1. The Mechanical Effect (Rounds 1 & 2)**
  *   *Ask:* "Green, your vote share didn't change between Round 1 and 2. Why did your power change?"
  *   *Concept:* **District Magnitude.**
  *   *Ask:* "Red, in Round 1 you had 45% of votes but 66% of seats. Where did those extra seats come from?"
  *   *Concept:* **Wasted Votes / Manufactured Majorities.**
  *   *Label:* This is the *Mechanical Effect* of electoral systems. (Do not say Duverger yet).

  **2. The Coalition Market (Round 2)**
  *   *Ask:* "In Round 2, could Red govern alone? Who held the balance of power?"
  *   *Concept:* **Coalition Bargaining / Pivotal Players.**
  *   *Ask:* "Some people argue PR gives tiny extremist parties too much power. Did Green feel too powerful, or just powerful enough to eat?"
  *   *Label:* This is the *Political Effect* (Coalition dynamics).

  **3. The Impossibility (Round 3)**
  *   *Ask:* "Green, you did nothing wrong. The house grew. You lost. How is that possible?"
  *   *Let them struggle with the arithmetic on the board.*
  *   *Label:* **The Alabama Paradox.**
  *   *The Big Point:* "Is there a math method that fixes this?"
  *   *Label:* **Balinski-Young Theorem (1982).**
      *   *Math Claim:* You cannot satisfy **Quota** (seats match vote share within rounding) AND **House Monotonicity** (adding seats never hurts a party) simultaneously.
      *   *Status:* **Settled Mathematics.** This is not debated. It is a proof.

  **4. The Empirical Claims (The "Live" Debate)**
  *   *Ask:* "If we ran this election 10 times, would Green eventually disappear?"
  *   *Label:* **Duverger's Law.**
      *   *Status:* **Contested/Conditional.**
      *   *Nuance:* The *mechanical* effect (wasted votes) is real (as you saw). The *psychological* effect (strategic voting/entry) is empirical.
      *   *Consensus:* FPTP *tends* toward two parties, but not reliably (see Canada, India). PR *tends* toward multiparty, but depends on thresholds.
  *   *Ask:* "Does PR increase turnout? Does it produce better policy?"
  *   *Status:* **Highly Contested.**
      *   *Lijphart:* PR correlates with higher turnout, more welfare spending.
      *   *Critics:* Correlation isn't causation; coalition instability can lead to gridlock (though recent data questions this).
      *   *Advice:* Tell students: "You can cite the math theorem as fact. You must cite the party system effects as probabilistic trends with exceptions."

  ---

  ### Part 4: Math Appendix (The Guaranteed Paradox)

  To ensure Round 3 works without fail on the whiteboard, use these specific numbers. They are scaled for easy division.

  **Total Votes:** 1,000 (Easier to divide than 100 for remainders).
  **Parties:** Red (450), Blue (350), Green (200).

  **Scenario A: 10 Seats**
  *   **Quota:** 1,000 / 10 = 100.
  *   **Red:** 450 / 100 = 4.5 → 4 seats + 50 remainder.
  *   **Blue:** 350 / 100 = 3.5 → 3 seats + 50 remainder.
  *   **Green:** 200 / 100 = 2.0 → 2 seats + 0 remainder.
  *   **Surplus Seats:** 1 (10 - 4 - 3 - 2).
  *   **Allocation:** Red gets surplus (highest remainder, tie-break with Blue if needed, or adjust Blue to 340 to ensure Red wins tie).
  *   **Final:** Red 5, Blue 3, **Green 2**.

  **Scenario B: 11 Seats**
  *   **Quota:** 1,000 / 11 = 90.90.
  *   **Red:** 450 / 90.9 = 4.95 → 4 seats + 0.95 remainder.
  *   **Blue:** 350 / 90.9 = 3.85 → 3 seats + 0.85 remainder.
  *   **Green:** 200 / 90.9 = 2.20 → 2 seats + 0.20 remainder.
  *   **Seats Assigned:** 4 + 3 + 2 = 9.
  *   **Surplus Seats:** 2 (11 - 9).
  *   **Allocation:** Red (.95) and Blue (.85) get the surplus. Green (.20) does not.
  *   **Final:** Red 5, Blue 4, **Green 2**.
  *   *Wait, this specific set keeps Green at 2.* I need Green to drop to 1.
  *   *Correction:* Use the classic **Balinski-Young 1982 example** exactly.
      *   **States:** A (6), B (6), C (2). Total 14.
      *   **Seats 10:** Quota 1.4. A=4.28, B=4.28, C=1.42. Integers: 4, 4, 1. Remainders: .28, .28, .42. C gets surplus. **Result: 4, 4, 2.**
      *   **Seats 11:** Quota 1.27. A=4.72, B=4.72, C=1.57. Integers: 4, 4, 1. Remainders: .72, .72, .57. A & B get surplus. **Result: 5, 5, 1.**
      *   **Scale for Class:** Multiply by 10 to make it look like votes.
      *   **Red:** 60 votes. **Blue:** 60 votes. **Green:** 20 votes. Total 140.
      *   **Round 2 (10 Seats):** Quota 14. Red 4.28, Blue 4.28, Green 1.42. **Seats: 4, 4, 2.** (Green has kingmaker potential).
      *   **Round 3 (11 Seats):** Quota 12.72. Red 4.71, Blue 4.71, Green 1.57. **Seats: 5, 5, 1.** (Green loses seat, loses power).
      *   **Use these numbers.** They are the only way to guarantee the paradox live without calculator errors.

  ---

  ### Part 5: Troubleshooting & Limitations

  **What Predictably Goes Wrong**
  1.  **Arithmetic Drag:** Students will want to verify your division.
      *   *Fix:* Tell them, "The Electoral Commission certifies these numbers. Your job is to bargain, not calculate." Write the remainders clearly on the board so they can see *why* Green loses the surplus.
  2.  **The "Check Out" Problem:** Green party members in Round 1 get no seats and no chocolate. They may disengage.
      *   *Fix:* In Round 2, explicitly tell Green: "You are now the Kingmakers. If you play this right, you eat." In Round 3, when they lose the seat, validate their anger. "This feeling? This is why apportionment lawsuits happen."
  3.  **Coalition Stalemate:** They spend 15 minutes arguing over who gets the chocolate.
      *   *Fix:* Hard stop. "Coalition closes in 2 minutes. If no agreement, everyone starves." (This simulates government collapse).
  4.  **Gerrymandering Round:**
      *   *Advice:* **Drop it.** You have 90 minutes. Doing FPTP, PR, Paradox, *and* Boundary Drawing is impossible. The Paradox is the unique intellectual value-add here; gerrymandering is intuitive to them already. Protect the Paradox.

  **What The Game Cannot Show (Be Honest in Debrief)**
  1.  **Strategic Entry (Duverger's Sociological Law):** This is a one-shot game. In reality, if Green sees they get 0 seats in FPTP for 3 elections, they might merge with Blue or stop running. This game freezes party labels.
  2.  **Voter Turnout:** In the game, voting is costless. In reality, "wasted votes" might depress turnout in safe districts. You can't simulate apathy in 90 minutes.
  3.  **Long-term Stability:** PR coalitions might break down after 6 months. FPTP majorities might pass radical laws. This game captures the *formation* moment, not the *governance* duration.

  **Settled vs. Contested (Cheat Sheet for You)**
  *   **Settled (Math):** You cannot have Quota + House Monotonicity + Population Monotonicity all at once (Balinski-Young). The Alabama Paradox is a feature of Largest Remainder, not Divisor methods (like D'Hondt), but Divisor methods violate Quota. There is no perfect system.
  *   **Contested (Politics):**
      *   *PR fragments party systems:* Generally true, but depends on the *threshold* (e.g., Germany 5% vs Netherlands 0.67%).
      *   *FPTP creates stable government:* Often true, but see UK 2010, Canada 2019.
      *   *PR increases turnout:* Meta-analyses suggest a small positive effect (3-5%), but it's not universal.
