      *   *Politics:* Duverger's Law (sociological vs mechanical), Coalition Stability, Turnout. This is *empirical* and contested.
      *   *User's specific worry:* "I want to be true but you should tell me if I'm overstating it."
      *   *Fact Check:* Balinski-Young Theorem (1982) proves no apportionment method can satisfy Quota Rule and House Monotonicity simultaneously. This is settled math.
      *   *Empirical Claims:* PR fragments party systems? Generally yes, but depends on thresholds. FPTP stable single-party? Often, but not always (e.g., Canada, UK coalitions recently). Turnout? Mixed evidence.
