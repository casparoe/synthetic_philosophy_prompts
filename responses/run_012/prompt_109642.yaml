      *   *Correction on Round 4:* The user said "If there's time I'd also like four of them to redraw..." I should advise *against* this to protect Round 3, as 90 mins is very short for 3 complex rounds + debrief. I will list it as a "Drop this first" item.
      *   *Correction on Grouping:* 24 students. 4 Parties of 6 voters each is too clean. Real politics isn't that even. I should distribute voter cards such that Parties have unequal sizes (e.g., 10, 8, 4, 2) to force coalition math.
