answer: |-
  Here is an explanation of the machinery of Moore's ethics, structured according to your four points.

  ### First: The Method (The Isolation Test)

  Moore's isolation test is a tool for distinguishing *intrinsic* value from *instrumental* value. Most things we call "good" are good because of what they lead to (money leads to security, virtue leads to social order). Moore wants to find the things that are good even if they lead to nothing else.

  To do this, he asks you to perform a thought experiment: imagine the thing in question exists in the universe, and *nothing else exists*. No consequences, no future, no observers other than the experience itself. If, in that absolute void, you judge that it is better for this thing to exist than not to exist, then it has intrinsic value.

  Moore thinks we can run this test in imagination because he believes "good" is a simple, non-natural property, like "yellow." You cannot define yellow to a blind man; he must see it. Similarly, you cannot prove something is good by argument; you must intuit it. The isolation test is merely a way of cleaning the lens. It strips away the noise of association (e.g., "Virtue is good" often means "Virtue is useful") so that the intuition can operate on the thing itself.

  The difficulty arises with complex goods like friendship. You cannot isolate "friendship" in the same way you isolate a patch of blue. Friendship implies two people, reciprocity, and history. When Moore applies the test here, he is not isolating the social institution. He is isolating the *state of consciousness* involved in the friendship. However, he is careful to specify that this state of consciousness includes the *belief* in the existence of the other person.

  So, what is being isolated is not just your feeling of affection, but the whole complex fact: "A mind contemplating another existing mind with affection." If you imagine that complex state existing alone in the universe, would it be good? Moore says yes. If you imagine the affection existing but the other person being a fiction (a dream), the value is significantly less. The test detects the value of the *awareness of reality*, not just the awareness itself.

  ### Second: The Principle of Organic Unities

  This principle is Moore's safeguard against reductionism. It states that the value of a whole is not necessarily the sum of the values of its parts. A part might have zero value on its own, or even negative value, yet be essential to a whole that has immense positive value.

  This does two specific jobs for Moore. First, it blocks the hedonist inference. A hedonist might say, "Pleasure is the only good. In a tragic play, we feel pain. Therefore, the pain must be bad, and the play is only good because of the pleasure at the end." Moore says: No. The pain is a part of a whole (the aesthetic experience of tragedy). The pain in isolation is bad. But the whole (pain + understanding + emotion) is good. You cannot calculate the value of the whole by adding up the value of the pain and the value of the understanding separately.

  Second, it blocks the inference that if an element has no value, it is irrelevant. Consider the existence of the beautiful object. Does a beautiful sunset have value if no one sees it? Moore suggests that in isolation, the mere physical beauty has little to no intrinsic value. But when combined with a mind appreciating it, the value of the whole is huge. The physical beauty is a necessary condition for the high value, even if it contributes no value on its own.

  The cost to Moore is severe. By making value dependent on the specific configuration of wholes, he makes ethical calculation nearly impossible. If the value of a whole changes depending on how parts are arranged, you cannot create a universal ledger of values. You have to intuit the value of every specific situation anew. This undermines the utilitarian goal of maximizing good, because you can never be sure you have the sum right.

  ### Third: The Crux (Method and Organic Unities Combined)

  This is where the tension lies for your protagonist. The isolation test asks us to strip away context to find value. The principle of organic unities tells us that context *creates* value. How do they fit?

  Moore resolves this by distinguishing between the *definition* of value and the *conditions* of value. The isolation test defines what we mean by "intrinsic good" (it must be worthwhile in itself). The principle of organic unities describes how those goods actually appear in reality (they appear as complex wholes).

  However, there is a significant inconsistency in how Moore argues in the final chapter of *Principia Ethica* compared to his methodological start.
  At the start, the unit of isolation is a "state of consciousness." It is psychological.
  In the final chapter, the unit of isolation shifts to a "state of affairs." It is metaphysical.

  When Moore ranks the goods, he insists that the *reality* of the object matters. To love a person is better than to love a fiction, even if the feeling is identical. This means the "isolated" good is not just inside the protagonist's head; it includes the external world. The unit of isolation is effectively a "world containing a mind in a specific relation to an object."

  Is this consistent? Strictly, no. If the good is a state of consciousness, the external object's existence shouldn't change the intrinsic value of the consciousness. If the external object's existence *does* change the value, then the good is not just a state of consciousness. Moore wants it both ways: he wants the locus of value to be the mind (so we can access it), but he wants the magnitude of value to depend on the world (so that truth and reality matter).

  For your novelist's purpose: Moore's method claims to give you a clear scale (the isolation test), but his application (organic unities) makes the scale sensitive to facts outside the agent's control. Your protagonist cannot simply consult her feelings to know the value of her choice; she must know the *truth* about the object of her choice. If she chooses art over a friend, she must know if the art is *truly* beautiful and if the friend is *truly* worthy. The isolation test tells her what to look for; organic unities tell her that the stakes depend on reality, not just perception.

  ### Fourth: The Two Goods (Structure and Ranking)

  Moore identifies two primary categories of "unmixed good":
  1.  **Aesthetic Enjoyment:** The appreciation of beautiful objects (art, nature).
  2.  **Personal Affection:** The love of persons.

  Both are organic unities composed of three elements:
  *   A cognitive element (awareness of the object).
  *   An emotional element (the feeling of beauty or love).
  *   The object itself (which must be appropriately qualified).

  **The Structure and the Regress**
  You asked what stops the value from running away into a regress of appreciations. If I love you because you are good, and you are good because you love beauty, where does it end?
  Moore stops the regress at the appreciation of *beauty itself*.
  The hierarchy looks like this:
  *   **Level 1 (Foundation):** The appreciation of inanimate beauty (a sunset, a statue). This is good in itself.
  *   **Level 2 (Higher):** The appreciation of a person who appreciates beauty. This is "love of mind."
  *   **Level 3 (Highest):** Mutual love between persons who both appreciate beauty.

  The value is fixed by the "appropriateness" of the emotion to the object. Loving a bad person is not a high good, even if the feeling is intense, because the object does not warrant the emotion. Loving a stone is good, but limited, because the object is simple. Loving a person is better because the object is complex and capable of its own value.

  **The Comparison Argument**
  Moore argues that Personal Affection > Aesthetic Enjoyment. Here are the premises:
  1.  The value of a whole depends partly on the value of its object.
  2.  A human mind (capable of consciousness and virtue) is a more valuable object than a physical thing (even a beautiful one).
  3.  Therefore, a state of consciousness directed at a human mind is more valuable than a state of consciousness directed at a physical thing.
  4.  Personal affection is consciousness directed at a human mind.
  5.  Aesthetic enjoyment is (primarily) consciousness directed at physical beauty.
  6.  Therefore, Personal Affection > Aesthetic Enjoyment.

  **Where the Reader is Convinced vs. Hidden Work**
  The reader is convinced by the intuition that human connection feels "deeper" than aesthetic pleasure. It resonates with our moral experience.
  The hidden work lies in Premise 2. Moore assumes without proof that a human mind is intrinsically a more valuable *object* than a beautiful thing. He also smuggles in a moral requirement: the friend must be "good." He says the object of affection must be "not merely beautiful but itself good in a high degree."

  This creates a trap for your protagonist. Moore suggests that "the love of love" (appreciating someone's mental qualities) is the highest good. But he also warns that appreciating mental qualities *without* appreciating the beauty they appreciate is hollow.
  Furthermore, Moore creates a tension: he admits that the appreciation of admirable mental qualities *taken by itself* might be less intense or less immediately delightful than the appreciation of corporeal beauty. He relies on the *complexity* of the object to carry the weight of the ranking, not the intensity of the feeling.

  So, the argument relies on the objective hierarchy of objects (Person > Thing), not the subjective hierarchy of feelings. If your protagonist feels more joy in art than in people, Moore's system tells her she is wrong, not because her feeling is fake, but because she is misjudging the value of the object. The "choice" is not between two equal feelings; it is between a lower object (art) and a higher object (person), even if the lower object yields a more intense immediate consciousness.

  ### Confidence and Doubt

  I am highly confident in this reading of the structure of Moore's argument and the tension between his method and his conclusions. It accurately reflects the standard philosophical interpretation of *Principia Ethica*, specifically the friction between Chapter 1 and Chapter 6.

  The single point on which I am least sure—and where a Moore scholar would most plausibly object—is the **Unit of Isolation**.
  I have stated that Moore shifts from isolating a "state of consciousness" to a "state of affairs." A strict defender of Moore might argue that he never abandons the "state of consciousness" as the locus of value. They would argue that when Moore says the reality of the object matters, he means that the *belief* in the reality is part of the consciousness, and that a consciousness containing a true belief is intrinsically better than one containing a false belief, even in isolation.
  However, this stretches the definition of "consciousness" to include the external fact that makes the belief true. My reading assumes Moore cannot quite make that stick without admitting the external world is part of the good itself. If you portray your protagonist as struggling with whether the value is in her *mind* or in the *world her mind connects to*, you will be capturing the exact point where Moore's own text is most vulnerable.
