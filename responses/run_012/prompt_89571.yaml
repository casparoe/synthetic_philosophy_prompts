answer: |-
  **Project Title:** The Architecture of Obligation: Cost-Structures in Everyday Conventions and the Visitor Problem

  **1. Research Question**
  Standard accounts of social norms treat conventions as a monolithic category, typically analyzing them either as coordination devices (Lewisian) or as sources of moral obligation via fair play or respect. This project asks: **Does the identifiability and concentration of costs imposed by convention-violation determine the moral force of the obligation, and consequently, the conditions under which visitors incur that obligation?**

  I argue that the moral weight of a convention is not binary (moral vs. non-moral) but tracks the structure of the harm caused by opting out. By distinguishing between *traffic conventions*, *cost-shifting conventions*, and *claim-conventions*, we can derive a principled account of when a visitor owes compliance to local norms: specifically, when their participation triggers a non-diffuse cost or violates a procedural claim held by identifiable others.

  **2. Background and Problem**
  Philosophical literature on norms generally bifurcates into two camps. The first views conventions as arbitrary coordination solutions; on this view, one owes compliance only insofar as coordination is required to avoid chaos. The second views conventions as morally laden, grounded in duties of fair play or respect for local autonomy. Both approaches struggle to explain the intuitive variance in our judgments about everyday violations.

  Consider three cases: standing on the wrong side of an escalator, skipping a tip in a tipping economy, and cutting a queue.
  *   **Standard Coordination Accounts** imply all three are merely efficiency tools. This fails to capture why queue-jumping feels like a fairness violation even when the delay caused is negligible, and why tipping feels like a material harm rather than a coordination failure.
  *   **Fair-Play/Reciprocity Accounts** suggest that benefiting from a scheme generates an obligation to follow its rules. However, this is over-inclusive. It suggests a visitor owes compliance to *all* local conventions once they benefit, failing to distinguish between the diffuse annoyance of escalator etiquette and the material cost-shifting of tipping.
  *   **Respect Accounts** argue for compliance to avoid offending locals. This is under-inclusive, as it makes obligation contingent on local sensitivity rather than the structure of the interaction itself.

  Current frameworks lack the granularity to explain why we judge these violations differently. They treat "convention" as the explanatory variable, whereas I propose the *cost-structure* of the violation is the relevant variable.

  **3. Proposed Taxonomy**
  I propose slicing conventions not by their enforcement or history, but by who bears the cost of violation and whether that bearer is identifiable.

  1.  **Traffic Conventions:** Violations impose diffuse, low-level costs on no one in particular (e.g., escalator standing, driving on the left). The cost is systemic friction.
  2.  **Cost-Shifting Conventions:** Violations impose concentrated, material costs on identifiable individuals (e.g., tipping). Opting out saves the violator money but directly reduces the income of a specific server.
  3.  **Claim-Conventions:** Violations infringe on a procedural right to fair treatment, even if the material cost is diffuse (e.g., queueing). The harm is not primarily time lost, but the violation of the "first-come, first-served" claim established by the queue.

  This taxonomy allows for a determinate answer to the **Visitor Problem**. A visitor incurs an obligation to comply not merely upon entering a culture, but when their action moves from the *Traffic* category into the *Cost-Shifting* or *Claim* categories. If a visitor tips (or doesn't), they are engaging in cost-shifting; if they queue, they are engaging with claims. If they merely stand on the "wrong" side of an escalator, they remain in the realm of traffic conventions where obligation is weaker.

  **4. Methodology and Scope**
  The project will be completed over three months using conceptual analysis and comparative case study.

  *   **Month 1: Refinement and Case Selection.** I will rigorously define the three categories. I will select five test cases for each category (e.g., jaywalking, silence in libraries, dress codes) to ensure the taxonomy holds beyond the initial examples.
  *   **Month 2: Stress-Testing.** I will construct edge cases to test the boundaries. For example: Is queue-jumping in a virtual (online) space a *Claim* violation or a *Traffic* violation? Does the identifiability of the victim matter if the cost is negligible?
  *   **Month 3: Application and Drafting.** I will apply the refined taxonomy to the Visitor Problem to generate necessary and sufficient conditions for visitor obligation. The final output will be a workshop paper (approx. 6,000 words).

  **Scope Note:** I will **not** include an empirical survey of intuitions. While valuable, designing a statistically significant survey, obtaining IRB approval (if required), and analyzing data exceeds the three-month timeframe and risks diluting the conceptual work. Instead, I will rely on established thought-experiment methodologies and existing literature on normative intuitions.

  **5. Expected Outcomes and Success Conditions**
  *   **Success:** The project succeeds if the taxonomy predicts moral judgments in edge cases better than the Coordination or Fair-Play accounts alone. For example, if the model correctly identifies that a visitor is obligated to queue (Claim) but not obligated to adopt local greeting rituals (Traffic/Respect), it demonstrates explanatory power.
  *   **Failure:** The project fails if the categories collapse into one another upon scrutiny. If *Claim-Conventions* turn out to be merely a subset of *Cost-Shifting* (i.e., if queue-jumping is just a diffuse cost), the three-way split is unnecessary. Alternatively, if the Visitor Problem cannot be solved by the taxonomy (i.e., if visitors seem to owe obligations in *Traffic* cases regardless of cost), the central thesis is undermined.

  **6. Critical Vulnerabilities**
  The project is most likely to fall apart on the distinction between **Claim-Conventions** and **Traffic Conventions**.

  *   **The Killer Case:** Queueing. My argument rests on queueing being a *Claim-Convention* where the harm is the violation of a procedural right, distinct from the diffuse annoyance of *Traffic Conventions* (like escalator standing).
  *   **What Would Change My Mind:** If it can be demonstrated that the "harm" of queue-jumping is reducible to aggregate time-loss (a diffuse cost) rather than a distinct fairness violation, the third category collapses. For instance, if a queue-jumper slips in unnoticed and causes no delay to anyone (perhaps the line moves faster than expected), intuition suggests a violation still occurred. However, if further analysis shows this intuition is merely a heuristic for "potential delay" rather than a distinct moral claim, then *Claim-Conventions* are just *Traffic Conventions* with higher stakes.
  *   **Mitigation:** I will focus Month 2 on isolating the "fairness" intuition from the "efficiency" intuition. If I cannot separate them, I will collapse the taxonomy into a binary (Diffuse vs. Concentrated Cost) and adjust the Visitor obligations accordingly.

  ***

  ### Advisor's Note (Meta-Commentary)

  **On the Empirical Survey:**
  You were right to be hesitant. **Do not bolt on the survey.** For a 3-month philosophy workshop proposal, adding empirical work is a scope creep trap. It shifts the labor from conceptual analysis to data collection/IRB/Stats. Reviewers for philosophy workshops generally want to see rigorous argumentation, not pilot data. Ruling it out explicitly (as I did in the Methodology section) shows you understand the constraints of the fellowship.

  **On the Vulnerability:**
  I placed the "Critical Vulnerabilities" section *inside* the proposal text. This is a strategic move. Workshop organizers love seeing applicants who know where their own arguments might break. It signals intellectual maturity. However, be prepared for the Q&A to focus entirely on the Queueing vs. Escalator distinction. That is the hinge the whole project swings on. If you can't defend the idea that queue-jumping violates a *right* rather than just causing *annoyance*, the three-way split becomes a two-way split, and the "Visitor" conclusion loses nuance.

  **On the Research Question:**
  I tightened your question to be more determinate. Your original draft asked "When does a visitor pick up obligations?" which is open-ended. The revised version asks "Does the cost-structure determine the obligation?" This allows for a Yes/No answer (hypothesis testing) rather than just "exploring the topic." This makes the proposal look more like a research *project* and less like a reading list.
