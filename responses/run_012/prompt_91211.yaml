answer: |-
  **WORKSHOP PREPARATION SHEET: CAUSATION BY OMISSION**
  **To:** Doctoral Candidate
  **From:** Senior Colleague
  **Re:** Defence Strategy for Interdisciplinary Workshop

  You have three weeks. Your supervisor's worry (that the normative anchor is *ad hoc*) is the shadow hanging over the room. If you try to defend the view as a brute metaphysical truth, the metaphysicians will eat you alive. If you treat it as purely pragmatic, the lawyer and scientists will ask why it matters. Your strategy must be to frame the normative anchor not as a patch, but as the only way to make sense of *causal selection* in a world physically determined by positive events.

  Below is your battlefield map.

  ### I. Audience Brainstorm & Vocabulary Collisions

  *   **The Metaphysicians (The Majority):** They speak in *counterfactuals, pre-emption, and transitivity*. They will treat causation as a binary relation between events.
      *   *Collision:* They will ask, "What is the *event* that is the omission?" You must resist reifying omissions into spooky negative events. Your reply is that the *relata* are different in omission cases.
      *   *Risk:* They will smell "contextualism" and argue you've changed the subject from *causation* to *explanation*.
  *   **The Epidemiologists (The Scientists):** They speak in *interventions, confounders, and control groups*. To them, a cause is a variable manipulation.
      *   *Collision:* They will ask, "How do you code the norm as a variable?" They will struggle with the idea that the "control condition" is normative rather than statistical.
      *   *Risk:* They may dismiss the theory as unoperationalisable.
  *   **The Tort Lawyer (The Practitioner):** They speak in *duty of care, but-for tests, and proximate cause*.
      *   *Collision:* They will spot the circularity risk immediately. If causation depends on a norm, and liability depends on causation, are you collapsing the duty/causation distinction?
      *   *Risk:* If your theory makes legal verdicts indeterminate when norms are disputed, they will reject it.
  *   **The Graduate Students (The Generalists):** They want the *upshot*.
      *   *Collision:* They will ask why we shouldn't just call it "responsibility" and be done with it.
      *   *Risk:* They may feel you are multiplying metaphysical entities without necessity.

  ---

  ### II. The Prep Sheet: 8 Likely Objections

  *Order: High Probability/High Damage first.*

  #### 1. The "Ad Hoc" Charge (The Supervisor's Worry)
  **Who:** Senior Metaphysician.
  **Phrasing:** "You've introduced norms to solve the lifeguard case, but this looks like a gerrymandered solution. Why think the *metaphysics* of causation should depend on the *ethics* of the situation? Isn't this just stitching two distinct problems together to avoid a counter-intuitive result?"
  **Your Reply (2 mins):** "It is not that ethics determines metaphysics, but that *causal selection* is inherently interest-relative. In positive causation, physical processes do the selecting. In omissions, there is no physical process to select the cause from the background conditions. The 'norm' isn't an ethical patch; it is the functional equivalent of the physical process, providing the contrast class. Without it, every non-act is a cause of every outcome. I am not changing the metaphysics of causation; I am specifying the relata for a specific subclass of causal claims."
  **Honest Note:** *Soft Spot.* You are bluffing slightly on the "functional equivalent" claim. You haven't fully explained *why* norms play this role other than intuition. If pressed, concede that this is a form of causal pluralism.

  #### 2. The Circularity Objection (The Lawyer's Trap)
  **Who:** Tort Lawyer.
  **Phrasing:** "In law, we separate duty of care from causation. If your theory says an omission is only a cause *because* there was a duty (norm), then you've collapsed causation into duty. A court can't use your theory to determine liability if it presupposes the liability."
  **Your Reply (2 mins):** "I distinguish the *existence* of a norm from the *breach* of a norm. The norm establishes the causal baseline (e.g., 'lifeguards watch swimmers'). Causation is established if the failure to meet that baseline made a difference. Liability requires a further step: was the breach culpable? My account clarifies the 'but-for' test by fixing the counterfactual baseline. It doesn't decide the verdict; it ensures the court is asking the right counterfactual question."
  **Honest Note:** *Firm Ground.* This is your strongest distinction. Hold firm here. If you concede causation and duty are identical, your thesis fails.

  #### 3. The Operationalisation Challenge
  **Who:** Epidemiologist.
  **Phrasing:** "In my models, the control group is empirical. You're saying the control group is 'what ought to have happened'. How do I measure that? If two statisticians disagree on the norm, do they get different causal results?"
  **Your Reply (2 mins):** "Precisely. And that reflects reality. In epidemiology, 'compliance' is a normative baseline (taking the pill as prescribed). If compliance is ill-defined, the Average Treatment Effect is ill-defined. My account makes explicit what your models assume: that the 'intervention' is defined against a standard. Disagreement on the norm doesn't break the theory; it highlights that the causal claim itself is disputed until the norm is fixed."
  **Honest Note:** *Soft Spot.* You are risking their goodwill here. They hate indeterminate variables. Concede that for *scientific* causation, conventions usually fix the norms (protocols), whereas in *social* causation, they are contested.

  #### 4. Redundant Omissions (The Two Lifeguards)
  **Who:** Metaphysician.
  **Phrasing:** "Two lifeguards sleep. The swimmer drowns. Either waking up would have saved them. On your view, both violated a norm. Are both causes? If so, you have overdetermination. If not, which norm wins?"
  **Your Reply (2 mins):** "Both are causes. This is causal overdetermination, which is puzzling but not fatal. My account explains *why* they are causes (both breached a norm that made a difference). Standard counterfactual accounts struggle to call them causes at all because the outcome wouldn't change if *one* acted. I capture the intuition that both failed, while acknowledging the metaphysical oddity of overdetermination."
  **Honest Note:** *Firm Ground.* Don't run from overdetermination. It's a standard bullet to bite.

  #### 5. Double Prevention
  **Who:** Metaphysician.
  **Phrasing:** "I prevent you from preventing the accident. Did my action cause the accident? Your norm view seems to struggle with chains where the 'omission' is actually a positive prevention of a prevention."
  **Your Reply (2 mins):** "Double prevention cases often reduce to whether we describe the middle link as an omission or an action. If the norm expects you to intervene, and I stop you, I am a positive cause of the failure. My account handles this by tracing where the normative expectation lies. If the norm was on *you* to act, your non-action is the derivative cause; my action is the primary cause of your non-action."
  **Honest Note:** *Bluffing.* This is messy. If they press on transitivity, admit that omission chains are non-transitive.

  #### 6. The "Merely Pragmatic" Retreat
  **Who:** Grad Student.
  **Phrasing:** "If norms are just context, why not say omissions are never *real* causes, just useful ways of talking? What do we buy by keeping them in the metaphysical ledger?"
  **Your Reply (2 mins):** "Because 'merely pragmatic' suggests we could do without them if we were ideal observers. We can't. We cannot describe the social world without them. To say the gardener caused the plants to die is not just shorthand; it identifies the specific leverage point for future intervention. That makes it causally robust, not just rhetorically convenient."
  **Honest Note:** *Firm Ground.* This is the core motivation. Do not retreat to eliminativism.

  #### 7. Disputed Norms (The Hard Case)
  **Who:** Lawyer or Metaphysician.
  **Phrasing:** "Consider a new technology. There is no convention yet. Did the engineer's failure to install a safety feature 'cause' the crash? If the norm is unsettled, is the cause indeterminate?"
  **Your Reply (2 mins):** "Yes, the causal claim is indeterminate until the norm crystallises. This matches legal practice: courts often establish the duty and the causation simultaneously in novel cases. My theory explains why these cases feel harder than standard ones. It's not a bug; it's a feature of how normative causation works."
  **Honest Note:** *Soft Spot.* Scientists will hate "indeterminate causes." Be prepared to soothe them by saying physical causes remain determinate; only *omissive* causes are indeterminate here.

  #### 8. The Baseline Problem
  **Who:** Biostatistician.
  **Phrasing:** "You say the baseline is normative. But in a trial, the baseline is 'placebo'. If the norm changes (e.g., standard of care improves), does the cause of death change retroactively?"
  **Your Reply (2 mins):** "The causal claim is time-indexed to the norm *at the time of action*. We don't judge past omissions by future norms. This aligns with the legal principle against retroactivity. The 'cause' is fixed by the normative landscape existing at *t*."
  **Honest Note:** *Firm Ground.* This is safe.

  ---

  ### III. Strategic Concessions & Firm Ground

  **What to Concede (Buy Goodwill):**
  1.  **Causal Pluralism:** Concede that omissive causation might not be the *same relation* as physical causation. Say: "I am not arguing for a monistic theory of all causation. I am arguing for an account of how omissive claims function." This disarms the metaphysicians who want a unified physics-based view.
  2.  **Epistemic Difficulty:** Admit that identifying the relevant norm can be epistemically hard. Don't claim your theory makes verdicts easy, only that it makes them coherent.
  3.  **Supervisor's Worry:** Acknowledge the "ad hoc" risk openly. "It may look like a patch, but I argue it is the only bridge between physical events and social outcomes."

  **What to Hold Firm On (Survival Conditions):**
  1.  **Norms are Constitutive:** Do not allow them to reduce norms to "expectations" or "psychological states." The norm must be external (social/legal/moral fact).
  2.  **No Norm, No Cause:** In the "Stranger on the Beach" case, hold firm that there is *no causal relation*, only a physical sequence. Do not retreat to "it's a cause but we don't blame him."
  3.  **Derivative Status:** Maintain that omissive causation is secondary to positive causation. This protects you from accusations of inflating the ontology with "negative events."

  ---

  ### IV. The Dreaded Question

  **The Question:**
  *"Isn't this just a theory of **responsibility** masquerading as a theory of **causation**? You've defined 'cause' in such a way that it tracks blame, but surely the world doesn't care about our norms."*

  **Why it's deadly:** It accuses you of a category mistake. If true, your thesis belongs in Ethics, not Metaphysics.

  **The Answer:**
  "That is the crucial distinction. A theory of responsibility asks 'Who is to blame?'. A theory of causation asks 'What made the difference?'. In positive cases, physics answers the second question. In omissive cases, there is no physical 'making a difference' without a contrast class. Norms provide that contrast class. I am not defining cause *as* responsibility; I am arguing that in the absence of physical processes, normative structures provide the necessary framework for *any* difference-making claim to be true. Without the norm, there is no 'difference' to be made, only a sequence of events."

  **Final Advice:**
  You cannot win over everyone. The hardline physicalist metaphysicians will not accept normative baselines. Your goal is to convince the room that your account is the *most useful* tool for the interdisciplinary work the Centre does. Play to the Lawyer and the Epidemiologist; they need your distinction more than the Metaphysicians do. If they see the utility, the metaphysics will follow.

  Good luck. You know the material. Now, manage the room.
