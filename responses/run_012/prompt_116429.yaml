answer: |-
  ### The Agency Commodification Review Procedure

  **Purpose:** To determine whether a proposed paid-transaction program may be licensed.
  **Users:** Panel Members (5).
  **Time Limit:** 10 Working Days.
  **Rule of Thumb:** If a proposal fails a "Stop" question, it is rejected. If it reaches a "Panel Vote" question, the majority rules, but dissenting values must be recorded.

  ---

  ### Step 1: The Transparency Test (Labeling)
  **Question:** Is the payment described as something other than a price for the good itself?
  *   **Look for:** Labels like "compensation for time," "reimbursement for inconvenience," or "gift honorarium" when the amount varies with supply, demand, or the value of the item.
  *   **Sufficient Answer:** The proposer admits the payment functions as a market price, even if legally labeled otherwise, and justifies why that label is used (e.g., legal constraints).
  *   **Unacceptable Evasion:** Insisting the payment is *only* for time or risk when the amount paid correlates directly with the scarcity or value of the good (e.g., paying more for a kidney than for an hour of waiting).
  *   **If No Answer is Available:** Assume the label is deceptive.
  *   **Decision Point:** **Panel Vote.**
      *   *Reasoning:* Sometimes legal constraints require euphemisms. The panel must decide if the euphemism hides a moral risk or just satisfies a lawyer.
      *   *Record for Dissent:* If a member votes to reject based on this, they must record: "I object to the deception, not the trade." If a member votes to approve, they must record: "I accept the legal label as functionally honest."

  ### Step 2: The Desperation Test (Coercion)
  **Question:** Are the sellers likely to be people who cannot reasonably say no?
  *   **Look for:** Evidence that sellers are drawn from groups facing severe financial distress, lack of alternatives, or systemic disadvantage.
  *   **Sufficient Answer:** Data showing the seller pool matches the general population, or strict income caps that exclude the desperate.
  *   **Unacceptable Evasion:** Claiming "all contracts are voluntary" without addressing background inequality. A choice made between starvation and selling is not free.
  *   **If No Answer is Available:** Assume the sellers will be the most desperate available group.
  *   **Decision Point:** **STOP.**
      *   *Verdict:* If the evidence shows the market relies on predation of the vulnerable, the proposal is rejected. Do not proceed to Step 3.

  ### Step 3: The Spillover Test (Erosion of Non-Market Provision)
  **Question:** Will paying for this good reduce the supply of it given freely?
  *   **Look for:** Evidence that introducing money will make people feel they no longer need to give, or that the paid version will be seen as "better" or "standard," making the free version seem suspicious.
  *   **Sufficient Answer:** A monitoring plan with a "kill switch" that terminates the paid program if voluntary supply drops by a set percentage (e.g., 5%).
  *   **Unacceptable Evasion:** Claiming "markets always increase supply" without addressing social norms. Ignoring the risk that paying turns a duty into a job.
  *   **If No Answer is Available:** Assume voluntary supply will erode.
  *   **Decision Point:** **STOP.**
      *   *Verdict:* If the proposer cannot guarantee a mechanism to protect the voluntary system, the proposal is rejected. This protects the social habit of giving from being replaced by transaction.

  ### Step 4: The Survival Test (Allocation of Necessities)
  **Question:** Does this transaction allow wealth to determine who gets essential life goods?
  *   **Look for:** Goods like water, emergency shelter, life-saving medicine, or basic safety.
  *   **Sufficient Answer:** Proof that the paid tier does not reduce access for the non-paying tier (e.g., surplus inventory only), or that subsidies ensure the poor pay the same effective price.
  *   **Unacceptable Evasion:** Arguing that "prices allocate efficiently" when the good is required for survival. Efficiency does not justify letting the poor die.
  *   **If No Answer is Available:** Assume the poor will be priced out of survival.
  *   **Decision Point:** **STOP.**
      *   *Verdict:* If the market allows wealth to dictate survival outcomes without ironclad protections for the poor, the proposal is rejected.

  ### Step 5: The Meaning Test (Corruption of the Good)
  **Question:** Does selling this change what the good *is* in a way that damages society?
  *   **Look for:** Goods that carry civic, sacred, or democratic meaning (e.g., votes, legal exemptions, human body parts, honors).
  *   **Sufficient Answer:** A philosophical argument accepted by the panel that the market value does not overwrite the social value.
  *   **Unacceptable Evasion:** Dismissing the question as "mere sentiment."
  *   **If No Answer is Available:** The panel must vote on the value.
  *   **Decision Point:** **Panel Vote.**
      *   *Reasoning:* This is a value judgment, not a factual one.
      *   *Record for Dissent:* Dissenting members must write: "I believe selling [Good] degrades [Value, e.g., Democracy/Dignity]." Approving members must write: "I believe the benefits of trade outweigh the loss of meaning."

  ---

  ### Application to Proposals

  #### 1. Pilot Scheme: Paying Living Kidney Donors
  *   **Step 1 (Transparency):** **Panel Vote.** The proposal calls it "compensation for lost wages and risk." The amount is fixed, not bid, but it is substantial.
      *   *Record:* Some members view this as a price; others as genuine reimbursement.
  *   **Step 2 (Desperation):** **Pass (with conditions).** The pilot limits donors to those with income above the median to avoid preying on the desperate.
  *   **Step 3 (Spillover):** **STOP.**
      *   *Analysis:* The proposer cannot guarantee that paying some donors will not make voluntary donors feel their gift is devalued, or that hospitals will stop recruiting voluntary donors if paid ones are available. There is no "kill switch" tied to voluntary donation rates in the wider region, only within the pilot.
      *   *Verdict:* **Recommend Rejection.**
      *   *Note:* This contradicts the Chair's sympathy. The procedure prioritizes the protection of the voluntary gift economy over the potential increase in supply. The risk that paid donation corrodes the norm of bodily gift-giving is treated as a fatal flaw without a mitigation plan.

  #### 2. Emergency Surge Pricing (Water & Fuel Post-Flood)
  *   **Step 1 (Transparency):** **Pass.** It is explicitly priced.
  *   **Step 2 (Desperation):** **Pass.** In emergencies, everyone is desperate, but the seller (utility) is not exploiting a specific vulnerable class of sellers; it is pricing buyers.
  *   **Step 3 (Spillover):** **Pass.** No non-market version exists during the emergency; the alternative is hoarding or black markets.
  *   **Step 4 (Survival):** **Panel Vote.**
      *   *Analysis:* Water is essential. However, zero pricing leads to hoarding, leaving the poor with nothing. High pricing rations supply but hurts the poor. The proposal includes vouchers for low-income households to offset the surge.
      *   *Record:* Dissenters must record: "I believe life-support goods should never have a price, regardless of vouchers." Approvers must record: "I believe rationing by price with subsidies is better than rationing by hoarding."
      *   *Verdict:* **Recommend Approval (Conditional on Vouchers).**
      *   *Note:* This challenges the instinct that "price gouging is always wrong." The procedure recognizes that without price signals, the poor may get *less* due to empty shelves.

  #### 3. Queue Resale (Subsidized Housing Vouchers)
  *   **Step 1 (Transparency):** **Pass.** It is a sale of a queue position.
  *   **Step 2 (Desperation):** **STOP.**
      *   *Analysis:* Those holding the vouchers are low-income by definition. Those buying the spots are wealthier. The sellers are selling because they are desperate for cash now; the buyers are buying because they are impatient. This transfers a public benefit intended for the poor to the wealthy.
      *   *Verdict:* **Recommend Rejection.**
      *   *Note:* This fails on background injustice. The market turns a poverty-alleviation tool into a cash-out option for the poor and a shortcut for the rich.

  #### 4. Limiting Case: Vote Selling
  *   **Step 1 (Transparency):** **Pass.** Explicit price for a vote.
  *   **Step 2 (Desperation):** **STOP.** (Could stop here, but we continue to Step 5 for clarity).
  *   **Step 5 (Meaning):** **Panel Vote.**
      *   *Analysis:* Voting is a civic duty, not a property right. Selling it treats the citizen as a private owner of public power.
      *   *Record:* Dissenters (if any) must record: "I view the vote as personal property." Approvers must record: "I view the vote as a public trust that is corrupted by sale."
      *   *Verdict:* **Recommend Rejection.**
      *   *Note:* Unanimous rejection expected. The market changes the meaning of the vote from "expression of will" to "asset."

  ---

  ### Limitations and Escalation

  **What This Procedure Cannot Do:**
  1.  **It Cannot Predict Black Markets:** If we reject a proposal (like the Kidney Pilot), people may still trade illegally. The procedure evaluates the *licensed* program, not the underground reality. We cannot license an unethical program just to regulate an inevitable black market without Step 2 (Desperation) protections.
  2.  **It Cannot Measure "Meaning" Objectively:** Step 5 relies on the panel's collective moral intuition. A clever proposer can frame a good as "service" rather than "essence" to bypass this.
  3.  **It Cannot Solve Structural Injustice:** Step 2 identifies coercion caused by poverty, but it cannot fix the poverty. It can only block the transaction that exploits it.

  **How Proposers Can Walk Around It:**
  *   **Fragmentation:** A proposer might split a transaction into "membership fee" + "gift" to bypass Step 1.
  *   **Third-Party Payment:** A proposer might have a charity pay the "price" to bypass Step 4 (Survival), masking the market nature.
  *   **Data Obfuscation:** Proposers may claim insufficient data exists for Step 3 (Spillover). The procedure treats "no data" as a failure, but a persistent proposer may lobby to lower the evidence standard.

  **When to Escalate to Higher Authority:**
  The panel should refuse to decide and send the matter up if:
  1.  **Conflicting Statutes:** The proposal is required by law but fails the Ethics Procedure (e.g., a mandate to privatize a service that fails Step 5).
  2.  **Systemic Coercion:** If Step 2 fails because the *entire population* is desperate (e.g., a famine relief program that requires labor), the problem is not the transaction but the state's failure to provide security. This is a policy failure, not an ethics review failure.
  3.  **Novel Meaning:** If a proposal involves a new technology (e.g., selling genetic data, selling attention spans) where Step 5 (Meaning) has no precedent, the panel should recommend a legislative inquiry rather than issuing a license. We are not equipped to define the social meaning of goods that did not exist five years ago.
