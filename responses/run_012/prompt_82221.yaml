answer: |-
  The coffee in the pot had gone cold an hour ago. Priya's printout was still on the table between us, weighed down by a sugar jar. The graph was a mess of vertical lines.

  "Look at the error bars, Dev," I said, tapping the paper. "Ten to the fifteen. That's not uncertainty. That's a confession."

  Dev rubbed his face. He looked tired, the way you get when you've been defending a worldview for three hours. "It's a model, not a prophecy. The point is the *difference* in the means. The research fund has upside potential the bed nets don't."

  "The bed nets save a life. We know that. The model says the long-run effect is zero because the population balances out or whatever. But the research fund? Plus ten trillion lives? With error bars that encompass the heat death of the universe? You're laundering ignorance into numbers. You take 'I have no idea,' run it through a spreadsheet, and call it 'Expected Value.'"

  "I'm not ignoring the uncertainty," Dev said, leaning forward. "But I have to put the money somewhere. If I keep it in my checking account, that also has long-term consequences. Inaction isn't a shield against cluelessness."

  "It's a shield against *pretending*," I countered. "If I give to the bed nets, I know a kid doesn't get malaria this year. That is a fact. If I give to the obscure research fund, I'm betting on a butterfly effect I can't track. I've stopped trying to steer history. I just want to do the ordinary decent thing in front of me."

  "Okay," Dev said, picking up his mug and finding it empty. "Let's actually go at this. Because I think you're letting the perfect be the enemy of the good, and I think you're misdiagnosing the disease."

  "Try me."

  "First," he said. "Is cluelessness actually a problem for *us* specifically? Or is it a problem for everyone? If you abandon consequentialism, what do you switch to? Rules? Virtues?"

  "Rules," I said. "Don't lie, don't kill, help those near you."

  "Right. But rules have consequences too. If you don't lie to a murderer at the door, someone dies. If you help your neighbor fix his fence instead of donating to pandemic prevention, maybe the pandemic happens. You're still making a choice based on how you think things will turn out. You're just hiding the calculation behind 'ordinary decency.' So cluelessness doesn't wreck your view; it just means you're refusing to do the math on the same impossible problem we all face."

  I paused. That was the standard objection, but I needed to make sure I wasn't dodging it. "No, it hits us harder. For a deontologist, consequences are a constraint, not the criterion. If I follow the rule, I've done my job, even if the world burns. For me, for *us*, the consequence *is* the job. If I can't know the consequence, I can't know if I've done my job. It's the difference between navigating in the fog and driving blindfolded because you believe the road is an illusion. I'm saying the road is there, but we don't have headlights."

  "Okay," Dev conceded slowly. "The burden is higher for us. I'll grant that. But you're assuming the fog is total. You're saying the kid not getting malaria is the *only* thing we know. That near-term certainty swamps everything else."

  "It's the only thing that's *real*."

  "That's just discounting the future by illegibility," Dev snapped. "Just because the future is hard to see doesn't mean it doesn't matter. If I know there's a 1% chance this research fund prevents a sterilizing pathogen, that outweighs the bed nets, even if the error bars are huge. You're treating illegibility as zero value. That's not humility, that's myopia."

  "It's not myopia, it's epistemic honesty," I said. "When the error bars are $10^{15}$, the mean is noise. You're grabbing onto the one number that looks positive and ignoring the fact that the model admits it could be negative ten trillion just as easily."

  "Which brings me to Priya's graph," Dev said, tapping the paper. "Why do you assume the distribution is symmetric? Why do you assume the chaos cancels out?"

  "Because chaos theory. Sensitive dependence on initial conditions."

  "Sure," Dev said. "But here's my best story. The asymmetry of legibility. We notice long-run disasters because they're loud. Nuclear war, pandemics, totalitarianism. They get documented. Long-run *goods* are often quiet. Institutional stability, slow technological progress, norms of tolerance. They don't make headlines. So when we look back, it feels like interventions curdle, because the bad stands out. But that's a selection artifact. The research fund might not save ten trillion lives, but it might nudge a norm that prevents a collapse. We just can't see the thread."

  I leaned back. That was Dev's strongest point. I had to respect it. "That's a nice narrative. It comforts the part of you that wants to be a hero. But does it survive contact with reality? For every norm that prevents collapse, there's a technology that enables it. The same research fund could accelerate AI risk. The chaos isn't just hidden good; it's hidden risk. Your asymmetry argument works both ways. If we can't see the good threads, we can't see the bad ones either. So we're back to the error bars."

  Dev sighed. "So what's the alternative? You say 'ordinary decent thing.' I say okay, let's operationalize that. My fallback isn't maximizing expected value anymore. It's acting to keep future options open. Don't burn bridges. Preserve flexibility. Reduce existential risk. It's not about steering history to a specific utopia; it's about making sure there *is* a future to steer."

  I laughed, short and sharp. "That is expected-value reasoning in a trench coat."

  "How?"

  "Because you're still making a claim about the future," I said. "You're saying 'preserving options' is better than 'consuming options.' But how do you know? Maybe burning the bridge forces us to build a better one. Maybe flexibility leads to paralysis. You're still guessing which action leads to the better long-run state. You've just changed the metric from 'lives saved' to 'option value.' It's still a calculation on unknowable data."

  Dev was quiet for a moment. He looked at the graph, then at me. "It's not a calculation. It's a heuristic. Like 'don't play with loaded guns.' You don't need to calculate the trajectory of the bullet to know you shouldn't fire it blindly."

  "But consequentialism demands the trajectory," I said. "If you admit you're using heuristics because the calculation is impossible, you've admitted the framework is broken for this use case. You're acting like a rule-utilitarian because the act-utilitarian math is gibberish."

  "I'm acting like a consequentialist who acknowledges limits," he said. "You're acting like a consequentialist who demands omniscience."

  "And you're acting like one who thinks a heuristic is enough to justify spending money on a black box."

  We sat there. The fridge hummed. The crux wasn't about the money. It wasn't even really about the graph.

  "Here's where we are," Dev said softly. "You think the uncertainty is so vast that any claim to improve the long-term is arrogance. So you retreat to the visible, the local. The kid, the neighbor, the now."

  "Yes."

  "And I think that retreat is a moral failure," Dev said. "Because the long-term *does* exist. The stakes *are* that high. Even if we're clueless, we have to try to model it, because the cost of being wrong is extinction. You're prioritizing your own epistemic comfort over the potential scale of the good."

  "And you're prioritizing the *potential* scale of the good over the *actual* truth of the situation," I shot back. "You'd rather feel like you're helping the future than admit you can't see it. I'm saying the honest thing is to help the present and hope the future takes care of itself."

  "So the crux," Dev said, tracing the vertical line of the error bar on Priya's graph. "Is whether honesty requires humility, or whether it requires effort. Is the moral obligation to be right about what you know, or to try to affect what you don't?"

  I looked at the sugar jar. "I think it's whether you believe the universe is legible enough to be steered."

  Dev shook his head. "No. I think it's whether you believe you're allowed to stop trying."
