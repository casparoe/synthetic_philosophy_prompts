prompt: |-
  I help run a small grantmaking operation, and like everyone else in this corner of the world we rank candidate interventions with the standard three-factor rubric: score each one out of ten for importance, out of ten for tractability, and out of ten for neglectedness, multiply the three, and sort the pile by the product. It is an innocuous-looking piece of arithmetic, and I have come to suspect it carries an entire theory of value in its luggage. I would like you to unpack it.

  Start with what the multiplication itself commits us to. Does treating the three dimensions as factors presuppose that they are commensurable — that a point of importance and a point of tractability trade against one another at a fixed rate — and hence that the worth of a cause is a single cardinal quantity? Does it presuppose consequentialism, or could a deontological constraint survive inside a rubric of this shape? Which rival pictures of value does the product quietly rule out: lexical priorities, incommensurable goods, value pluralism, the possibility that some causes are simply not rankable against others?

  Then the dimensions one at a time, because I think at least one of them is doing something the rubric cannot admit. Neglectedness is scored as though it were a property of a cause, like its budget or its death toll; but the work it does in the ranking is as a proxy for the marginal value of the next dollar, which is a claim about the slope of a returns curve rather than a property of the cause. Notice the mismatch: importance measures a level, neglectedness measures a derivative, and the rubric multiplies them as if they were the same kind of thing. Is that a category error, or a defensible heuristic that works because the two happen to be correlated? And what does the rubric assume about the shape of returns — that a fully funded field returns nothing at the margin, a hard ceiling, or merely that returns diminish? Under a log-shaped curve, would the neglectedness factor still be the right correction? Which assumptions about crowding between causes, and about the mutual independence of the three factors, does the ranking silently require?

  Importance looks like it presupposes a common currency in which lives saved, animal welfare, the interests of future generations, and non-welfarist goods can all be priced. Which aggregation rule does that need — totalism, prioritarianism, something person-affecting — and which does the rubric thereby assume without argument? Tractability looks like it presupposes that difficulty is independent of the other two factors, when the selection effects of the field suggest the opposite, and that whoever assigns the score can state a probability. And what counts as one cause? The rubric presupposes that causes come in well-defined units that can be scored and compared; tell me where that breaks down.

  Then give me the analysis the practice deserves: what it strictly presupposes, what it merely fits well with, and where it is underdetermined, so that several incompatible theories would license the very same rubric. Close by telling me what the rubric would have to become if the contested presuppositions were dropped — if neglectedness were replaced by a direct estimate of marginal returns, or if values were treated as incommensurable. What would a scoring practice look like then, and would it still be a scoring practice?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Context:** The user runs a small grantmaking operation using the standard ITN (Importance, Tractability, Neglectedness) framework, scoring 1-10 and multiplying.
      *   **Task:** Unpack the theory of value embedded in this arithmetic.
      *   **Key Areas to Cover:**
          1.  **The Multiplication:** Commensurability, cardinality, consequentialism vs. deontology, rival value theories ruled out (lexicality, pluralism, etc.).
          2.  **The Dimensions (Specifically Neglectedness):** Level vs. Derivative mismatch, returns curves (diminishing, log, ceiling), independence assumptions, category errors.
          3.  **The Dimensions (Importance & Tractability):** Aggregation rules (totalism, prioritarianism), independence of difficulty, unit definition of "causes."
          4.  **Analysis of Practice:** Strict presuppositions vs. compatible fits vs. underdetermined areas.
          5.  **Alternative Practices:** What if presuppositions were dropped? (Marginal returns directly, incommensurability). Would it still be scoring?

  2.  **Initial Brainstorming & Conceptual Mapping:**

      *   *The Formula:* $V = I \times T \times N$.
      *   *Multiplication:* Implies substitutability. High $I$ can compensate for low $T$. Implies a single metric of value (cardinal). Implies no "veto" power (non-lexical).
      *   *Consequentialism:* Yes, fundamentally. You are ranking outcomes. Deontology struggles here unless constraints are baked into $T$ (probability of success = 0 if violates constraint), but that's awkward.
      *   *Neglectedness:* This is the trickiest part. $N$ is usually "how many people are working on this?" but acts as "how much good will my dollar do?" This is marginal utility vs. total utility. $I$ is total scale. $N$ is a proxy for marginal return. Multiplying Total Scale $\times$ Marginal Return is dimensionally weird unless $T$ bridges the gap. Actually, the standard EA argument is $Expected Value = Scale \times Probability of Success \times Marginal Impact per Resource$. $N$ proxies the last one.
      *   *Returns Curves:* The rubric assumes diminishing returns. If returns were linear, $N$ wouldn't matter. If returns were increasing, you'd want to fund crowded areas. It assumes a specific shape (usually concave).
      *   *Importance:* Requires a common denominator (QALYs, welfare units, dollars). Implies Total Utilitarianism usually (summing across beings/time).
      *   *Tractability:* Probability of success. Assumes we can know this. Assumes independence from $I$ and $N$ (but hard problems might be important *because* they are hard).
      *   *Units:* "Causes" are fuzzy. Is "Global Health" a cause? Or "Malaria Nets"? The granularity affects scoring.
      *   *Alternatives:* Direct marginal cost-effectiveness estimates (e.g., $/life saved). Portfolio theory (covariance between causes). Qualitative clustering instead of ranking.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the question. The ITN product isn't just math; it's metaphysics.
      *   **Part 1: The Arithmetic of Multiplication:**
          *   *Commensurability:* Yes, multiplication implies a common currency. A point of $I$ is exchangeable for a point of $T$.
          *   *Cardinality:* Yes, requires interval/ratio scales, not just ordinal. 8/10 is twice as good as 4/10? That's a strong claim.
          *   *Consequentialism:* It's inherently consequentialist (maximizing expected value). Deontological constraints don't fit well unless they zero out $T$, but that makes them lexical (which multiplication forbids).
          *   *Ruled Out:* Lexical priorities (no "rights" that trump utility), Strong Pluralism (no "incomparable" goods), Satisficing (you must maximize the product).
      *   **Part 2: The Dimensions (Neglectedness & Returns):**
          *   *Level vs. Derivative:* Crucial insight. $I$ = Total Benefit (Integral). $N$ = Marginal Benefit (Derivative). Multiplying them is dimensionally suspect unless $T$ normalizes it. Actually, the standard model is $EV = Total Problem Size \times Solvability \times (1 / Current Spending)$. So $N$ is a proxy for $1/Spending$.
          *   *Returns Curve:* Assumes diminishing marginal returns. Specifically, it often assumes a specific elasticity (e.g., log returns). If the curve is step-function or S-shaped, $N$ fails.
          *   *Independence:* Assumes $I, T, N$ are independent. But crowded fields might be crowded *because* they are tractable.
      *   **Part 3: Importance, Tractability, and Units:**
          *   *Importance:* Requires an aggregation theory. Totalism (sum of welfare) fits best. Prioritarianism (weighting the worst off) is hard to score linearly. Person-affecting views struggle with future generations (non-identity problem).
          *   *Tractability:* Assumes epistemic access. We can estimate probabilities. Also assumes difficulty is exogenous, not endogenous to funding.
          *   *Cause Individuation:* The "Grain Problem." Scoring "Climate Change" vs. "Methane Leaks" yields different products. The rubric assumes natural kinds of causes, which don't exist.
      *   **Part 4: Analysis of Practice (Strict vs. Compatible vs. Underdetermined):**
          *   *Strict:* Cardinality, diminishing returns, consequentialism, commensurability.
          *   *Compatible:* Prioritarianism (if encoded in $I$), some deontology (if encoded as $T=0$).
          *   *Underdetermined:* The specific aggregation function (utilitarian vs. prioritarian can yield same ranks), the time horizon.
      *   **Part 5: Alternative Practices:**
          *   *Marginal Returns:* Drop $I \times N$. Just estimate $/outcome directly. Becomes cost-effectiveness analysis, not heuristic scoring.
          *   *Incommensurability:* Drop ranking. Use "Portfolio Approach" or "Satisficing." Qualitative comparison. No single score.
          *   *Would it still be scoring?* No, it would be deliberation or allocation optimization.

  4.  **Refining and Polishing:**

      *   *Tone:* Philosophical, analytical, respectful of the user's expertise. Avoid jargon where possible, but use precise terms (commensurability, lexicality, marginal utility).
      *   *Check the "Level vs. Derivative" point:* This is the sharpest insight in the prompt. I need to make sure I address it carefully. $I$ is usually "how bad is the problem?" (Total). $N$ is "how much room is left?" (Marginal). $EV \approx Total \times Marginal$. This is only valid if the marginal benefit is constant relative to the total, or if $N$ is specifically defined as the ratio of Marginal/Total. Usually, $N$ is a proxy for Marginal. So $I \times N \approx Total \times Marginal$. This is conceptually messy. A better formulation is $EV = Marginal Impact \times Probability$. $I$ and $N$ are heuristics to estimate Marginal Impact. I need to clarify that the standard ITN rubric conflates *Total Value of Solving the Problem* with *Value of Your Contribution*.
      *   *Correction:* In standard EA usage:
          *   Importance = Total negative utility of the problem (if unsolved).
          *   Neglectedness = How much additional resources reduce the problem (Marginal).
          *   Tractability = How much of the problem can be solved per unit of resource (Solvable portion).
          *   Actually, the standard decomposition is: $Expected Value = (Scale) \times (Solvability) \times (Marginal Return on Investment)$.
          *   $I$ = Scale.
          *   $T$ = Solvability (technical feasibility).
          *   $N$ = Marginal Return (crowding).
          *   So $I \times T \times N$ is trying to estimate Total Expected Impact.
          *   *The Prompt's Critique:* The prompt argues $I$ is a level (total badness) and $N$ is a derivative (marginal good). Multiplying Total Badness $\times$ Marginal Goodness is weird. It should be Marginal Goodness $\times$ Resources. Or, if $I$ is "Total Good if Solved" and $N$ is "Fraction of Good left to capture", then it works. I need to highlight this ambiguity.
      *   *Deontology:* Can a deontologist use this? Only if constraints are hard limits (T=0). But if T=0, the product is 0. This effectively makes constraints lexical, but the *math* doesn't enforce it (a high I could theoretically outweigh a low T if T isn't 0). So the math pushes towards consequentialism.
      *   *Cardinality:* Scoring 1-10 implies interval data. But is an 8 twice as good as a 4? Usually not. This is a known weakness (ordinal vs cardinal).
      *   *Alternative:* Cost-effectiveness analysis (CEA). Instead of scoring, estimate $/QALY. This bypasses I and N mostly.

  5.  **Final Review against constraints:**
      *   Did I answer all parts of the prompt?
      *   Is the tone appropriate?
      *   Is the philosophical analysis rigorous?

      *(Self-Correction during drafting)*: Be careful not to just critique EA, but to answer the philosophical prompt about *value theory*. The user asks about the "theory of value in its luggage." Focus on metaphysics and ethics, not just grantmaking logistics.

      *Key distinction to make:* The rubric treats value as *scalar* and *additive* across causes (via the ranking list). This rules out pluralism where values are distinct vectors.

      *Neglectedness nuance:* The prompt says $N$ is a derivative. $I$ is a level. If $I$ is "Total Suffering" and $N$ is "Marginal Impact of Dollar", then $I \times N$ is dimensionally $[Suffering] \times [Suffering Reduction / Dollar]$. That doesn't yield Value. It yields $[Suffering^2 / Dollar]$.
      *Wait, standard interpretation:*
      $I$ = Total Value at Stake (e.g., 1000 lives).
      $T$ = Fraction of problem solvable (e.g., 50%).
      $N$ = Fraction of solvable problem not yet solved / Crowding factor (e.g., 10% of resources needed are present).
      Actually, the 80,000 Hours definition is often:
      $Impact = Scale \times Solvability \times Neglectedness$.
      Where Neglectedness is often defined as $1 / Log(Spending)$.
      So it *is* trying to estimate Marginal Impact.
      The prompt's insight is that $I$ is often scored as "How bad is it?" (Total) while $N$ is "How crowded is it?" (Marginal proxy).
      If I score "Existential Risk" as 10/10 Importance (Total extinction), and "Malaria" as 8/10 Importance (Millions of lives), I am comparing Totals.
      Then I apply Neglectedness.
      The multiplication assumes $Total \times Marginal \approx Value$.
      This only works if the Marginal Return is proportional to the Total Size. (i.e., bigger problems have higher marginal returns per dollar, holding crowding constant). This is a huge assumption.
      I will highlight this assumption.

  6.  **Final Polish:** Ensure the transition to the "Alternative Practice" section is clear. What does grantmaking look like without the rubric? Portfolio theory? Qualitative judgment?

      *(Final check on "Deontology")*: If I have a deontological constraint, say "Do not fund research involving embryo destruction," how does that fit? If I score Tractability as 0, it works. But if I score it 1 (very tractable technically) but Ethics as... wait, there is no Ethics score. So the rubric *excludes* deontology unless it's smuggled into Tractability. This is a key point. The rubric is ethically blind unless ethics is reduced to "feasibility."

      Okay, ready to write.
answer: |-
  The rubric you describe—$Score = Importance \times Tractability \times Neglectedness$—is not merely a sorting algorithm. It is a compact metaphysical engine. By adopting it, you are not just organizing a spreadsheet; you are committing to a specific ontology of value, a specific epistemology of social change, and a specific ethical framework.

  Here is the unpacking of that luggage.

  ### 1. The Arithmetic of Multiplication
  The decision to multiply rather than add, weight, or lexically order commits you to three strong claims about the structure of value.

  **Commensurability and Cardinality**
  Multiplication presupposes that the three dimensions are measured on ratio scales with a common zero point and interchangeable units. If Importance is "lives at stake" and Tractability is "probability of success," multiplying them implies that a 10% increase in probability is mathematically equivalent to a 10% increase in lives. This asserts **strong commensurability**: there is a single currency of value (usually expected utility) into which all distinct goods can be converted.
  Furthermore, using a 1–10 scale implies **cardinality**. It assumes an 8 is twice as valuable as a 4. Most human judgments are ordinal (we know A is better than B, not that A is $1.5\times$ B). By forcing ordinal judgments into a cardinal formula, the rubric creates a false precision that masks the underlying uncertainty.

  **Consequentialism vs. Deontology**
  The product is inherently **maximizing consequentialist**. It seeks to maximize the expected value of the output.
  *   **Deontological Constraints:** A deontological constraint (e.g., "do not violate rights") typically functions as a side-constraint or a veto. In a multiplicative model, a constraint can only survive if it reduces the *Tractability* score to exactly zero. If a cause is rights-violating but highly "tractable" (easy to achieve the goal), the rubric invites you to score it high. To make the rubric safe for deontology, you must treat ethical permissibility as a binary precondition outside the math. If you bake it into the scores, the math allows trade-offs (e.g., "This violates rights slightly [T=8] but saves many lives [I=10]"), which deontology forbids.
  *   **Ruled Out Theories:**
      *   **Lexical Priorities:** The product rules out the idea that one dimension trumps others regardless of magnitude. You cannot say "Neglectedness doesn't matter if Importance is low." A high Neglectedness score can mathematically rescue a low Importance score.
      *   **Value Pluralism:** If values are incommensurable (e.g., justice and welfare are distinct vectors that cannot be reduced to a single number), multiplication is category error. The rubric assumes a monistic value theory.
      *   **Satisficing:** The rubric demands maximization. It cannot accommodate a logic of "good enough."

  ### 2. The Dimensions: Levels, Derivatives, and Curves
  Your intuition about Neglectedness is the sharpest philosophical lever in this machine.

  **The Level vs. Derivative Mismatch**
  You are correct: **Importance** is typically scored as a *level* (the total magnitude of the problem, e.g., total lives lost). **Neglectedness** acts as a proxy for the *derivative* (the marginal return on the next unit of resource).
  *   **The Category Error:** Multiplying a Level ($L$) by a Derivative ($dL/dR$) yields a quantity with mixed dimensions ($L \cdot dL/dR$). In physics, this would be rejected. In grantmaking, it works only under a specific assumption: that the *marginal return is proportional to the total scale*.
  *   **The Hidden Assumption:** The rubric assumes that larger problems (higher Importance) inherently offer higher marginal returns per dollar, holding crowding constant. This is not necessarily true. A massive problem might be massive precisely because it is intractable or has hit a hard technological ceiling, meaning marginal returns are near zero despite high total stakes.
  *   **Returns Curves:** The Neglectedness factor assumes **diminishing marginal returns**. It presupposes a concave returns curve.
      *   If returns were linear, Neglectedness would be irrelevant (a dollar does the same good regardless of how many are spent).
      *   If returns were increasing (network effects, tipping points), the rubric actively penalizes the right strategy (it would tell you to avoid crowded, nearing-tipping-point fields).
      *   **Log-Shaped Curves:** If returns follow a logarithmic curve (common in EA models), the Neglectedness score is a rough proxy for the inverse of the log of spending. However, scoring this 1–10 linearly distorts the logarithmic reality. A move from \$1M to \$10M is not the same "distance" as \$1B to \$10B, but the rubric treats the score intervals as equal.

  **Independence Assumptions**
  The multiplication $I \times T \times N$ assumes the factors are **independent variables**.
  *   **Reality:** They are often correlated. High Importance often attracts funding (lowering Neglectedness). High Importance often attracts talent (increasing Tractability). By treating them as independent, the rubric risks double-counting or mispricing the correlations. It assumes a landscape where the "height" of the problem, the "steepness" of the climb, and the "number of climbers" are unrelated features, when they are ecologically linked.

  ### 3. Importance, Tractability, and the Unit of Analysis
  **Importance and Aggregation**
  Scoring Importance requires a common denominator for "badness."
  *   **Aggregation Rule:** The rubric silently assumes **Total Utilitarianism**. It sums welfare across individuals and generations.
  *   **Rival Views:**
      *   **Prioritarianism:** If you weight the welfare of the worst-off more heavily, a simple 1–10 score cannot capture the non-linear weighting without complex adjustment.
      *   **Person-Affecting Views:** If you believe we cannot harm/benefit those who don't yet exist (non-identity problem), the "Importance" of long-term future causes collapses. The rubric allows high scores for existential risk, which presupposes a non-person-affecting or totalist view.
      *   **Non-Welfarist Goods:** If "justice," "autonomy," or "beauty" are goods independent of welfare, they must be converted into welfare units to be scored. The rubric forces a reduction of all value to a single metric.

  **Tractability and Epistemology**
  Tractability is scored as a probability (likelihood of success).
  *   **Epistemic Hubris:** It assumes the grantmaker can assign a meaningful probability to complex social interventions. This presupposes a world where causality is stable and knowable.
  *   **Endogeneity:** It assumes difficulty is intrinsic to the cause. In reality, tractability is often a function of funding (money buys breakthroughs). The rubric treats Tractability as a static property, not a dynamic variable responsive to the very grantmaking it guides.

  **The Individuation of Causes**
  The rubric presupposes that the world comes pre-carved into "causes."
  *   **The Grain Problem:** Is the cause "Global Health" or "Malaria Eradication" or "Bednet Distribution in Sub-Saharan Africa"?
      *   "Global Health" scores high on Importance, low on Neglectedness.
      *   "Bednets" scores lower on Importance, higher on Neglectedness (maybe).
      *   The product changes based on how you draw the boundary. The rubric assumes **natural kinds** of interventions, but causes are arbitrary slices of a continuous causal web. This allows for "gerrymandering" scores by narrowing or widening the definition of the cause.

  ### 4. Analysis of the Practice
  What does this rubric strictly require, and where is it flexible?

  **Strict Presuppositions (The Hard Core)**
  1.  **Monism:** Value is a single scalar quantity.
  2.  **Cardinality:** Differences in scores represent proportional differences in value.
  3.  **Diminishing Returns:** Additional resources yield less marginal good (justifying the Neglectedness factor).
  4.  **Consequentialism:** The right action is the one maximizing the product.
  5.  **Separability:** The value of a cause can be assessed in isolation from the rest of the portfolio (ignoring covariance/diversification).

  **Merely Compatible (The Flexible Shell)**
  1.  **Time Horizon:** The rubric works for short-term aid or long-term existential risk, provided the "Importance" score internalizes the time discounting (or lack thereof).
  2.  **Specific Aggregation:** You can be a prioritarian *if* you encode the priority weighting into the Importance score manually. The math doesn't care how you derive the number, only that you produce one.
  3.  **Risk Neutrality:** The product calculates *expected* value. It is compatible with risk-neutrality. It is *not* compatible with risk-aversion unless you discount the score afterward.

  **Underdetermined Areas (The Blind Spots)**
  1.  **Covariance:** The rubric ranks causes individually. It does not account for portfolio theory. Two causes might be highly ranked but perfectly correlated (if one fails, both fail). The rubric cannot see systemic risk.
  2.  **Option Value:** It struggles to value "learning" interventions that have low immediate impact but high information value for future decisions.
  3.  **Moral Uncertainty:** It assumes you know which moral theory is true. It cannot easily score "hedge against moral uncertainty" unless that is defined as a cause itself.

  ### 5. Alternative Practices
  If you drop the contested presuppositions, the practice changes fundamentally.

  **Scenario A: Dropping the Level/Derivative Mismatch**
  *   **Change:** Replace $Importance \times Neglectedness$ with a direct estimate of **Marginal Cost-Effectiveness**.
  *   **Practice:** Instead of scoring "How bad is malaria?" (Level) and "How crowded is malaria funding?" (Derivative), you estimate "\$ per DALY averted for the *next* marginal dollar."
  *   **Result:** This collapses the three factors into one: **Expected Marginal Return**.
  *   **Is it still scoring?** It becomes **Cost-Effectiveness Analysis (CEA)**. It is less heuristic, more data-intensive. It removes the false precision of the 1–10 scale but demands data that often doesn't exist. It shifts the epistemic burden from "guessing three factors" to "modeling one causal chain."

  **Scenario B: Dropping Commensurability**
  *   **Change:** Acknowledge that "Animal Welfare," "Global Health," and "Existential Risk" are incommensurable goods.
  *   **Practice:** Abandon the single ranking list. Use a **Portfolio Approach** or **Satisficing Clusters**.
      *   Set minimum thresholds for each dimension (e.g., "Must be high importance, must be ethically permissible").
      *   Allocate budget across *clusters* of value based on ethical intuition or donor preference, not a global product.
      *   Use qualitative comparison within clusters, but no arithmetic between them.
  *   **Is it still scoring?** No. It becomes **Deliberative Allocation**. You are no longer sorting a pile; you are constructing a portfolio. It requires more governance and discussion, less spreadsheet arithmetic. It admits that the choice between saving a life now and preventing extinction later is a value judgment, not a calculation.

  **Scenario C: Dropping Independence (Portfolio Theory)**
  *   **Change:** Acknowledge that causes are correlated.
  *   **Practice:** Score causes based on their **marginal contribution to portfolio variance and return**. A cause might be funded not because its standalone product is high, but because it hedges against the failure of your top-ranked cause.
  *   **Is it still scoring?** It becomes **Asset Allocation**. The unit of analysis shifts from the "Cause" to the "Grant Portfolio."

  ### Conclusion
  The ITN product is a technology of **moral reductionism**. It works beautifully when the world behaves like a textbook economics problem: distinct goods, diminishing returns, known probabilities, and a single utility function. It breaks when the world behaves like a complex ethical ecosystem: incommensurable values, correlated risks, and deep uncertainty.

  If you keep the rubric, you must accept that you are not just ranking causes; you are enforcing a utilitarian, cardinal, and independent view of reality. If you wish to escape that theory of value, you must stop multiplying. You must either move to direct marginal estimates (CEA) or abandon the single score for a deliberative portfolio construction. The former is more rigorous; the latter is more honest.
