answer: |-
  ### Desiderata for a Theory of First-Language Acquisition

  The following table specifies the requirements for a theory of language acquisition treated as an empirical hypothesis. A theory fails a requirement if it cannot account for the phenomenon without contradicting established data or logical constraints.

  | # | Desideratum | Phenomenon / Consideration | Consequence of Failure (Concrete Illustration) | Type | Flags |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Input-Output Gap** | Children attain a system allowing infinite novel sentences from finite, fragmentary input. | Theory claims children memorize heard sentences. <br>*Failure:* Child produces "I goed" (never heard) or understands "The green dog bit the cat" (never heard). | Empirical | |
  | **2** | **Error Asymmetry** | Children make specific predictable errors (e.g., *goed*) but never others (e.g., *dog the green*). | Theory predicts children try all logically possible combinations. <br>*Failure:* Theory cannot explain why children never hypothesize that verbs come at the start of sentences in English, despite it being logically possible. | Empirical | |
  | **3** | **Convergence** | Children in the same community arrive at nearly identical grammars despite varying input quality/quantity. | Theory predicts high variance in outcome based on input variance. <br>*Failure:* Two children hearing different amounts of speech end up with fundamentally different rules for question formation. | Empirical | |
  | **4** | **Regularization (Creolization)** | Children exposed to unstructured input (pidgin) produce a structured system (creole). | Theory requires a full adult model to acquire grammar. <br>*Failure:* Theory predicts children exposed to pidgin remain stuck with pidgin, failing to generate new syntactic structure. | Empirical | |
  | **5** | **Distributional Sensitivity** | Infants detect statistical regularities in artificial speech streams rapidly. | Theory claims learning is purely rule-based without statistical tracking. <br>*Failure:* Theory cannot account for an infant distinguishing word boundaries based on syllable transition probabilities alone. | Empirical | |
  | **6** | **Maturational Window** | Acquisition is robust early, declines sharply after puberty, even with high motivation/input. | Theory predicts learning ability is constant across lifespan. <br>*Failure:* Theory predicts an adult immigrant should acquire native pronunciation/grammar as easily as a 3-year-old given sufficient exposure. | Empirical | |
  | **7** | **Retreat from Overgeneralization** | Children stop making errors like *goed* without consistent explicit correction. | Theory requires negative evidence (correction) to prune errors. <br>*Failure:* Theory predicts children continue saying *goed* indefinitely because parents rarely say "No, not *goed*." | Empirical | |
  | **8** | **Disambiguation of Endowment** | 'Innate' has four distinct meanings: (1) Present before experience; (2) Not derived from evidence; (3) Species-typical; (4) Language-specific. | Theory conflates these meanings to support a claim. <br>*Failure:* Theory claims a mechanism is **language-specific** (4) merely because it is **present at birth** (1), without evidence that it doesn't apply to music or vision. | Methodological | |
  | **9** | **Learner Specification** | The computational nature of the child must be defined to test if input is sufficient. | Theory posits a "black box" learner. <br>*Failure:* Theory claims input is sufficient but cannot specify the algorithm that processes it, making the claim unfalsifiable. | Methodological | |

  **Notes on Flags:**
  *   **Vacuous:** None of the above are strictly vacuous, provided "Theory" implies a mechanistic account. A requirement like "Must fit the data" would be vacuous (trivial restatement); these requirements demand *how* the fit is achieved.
  *   **Trivial:** Requirement 1 risks triviality if "input" is defined loosely to include all internal processing. It has force only if input is defined as external sensory data.

  ---

  ### Argument 1: The Structure of the Poverty of the Stimulus

  Your suspicion is correct. An appeal to the Poverty of the Stimulus (PoS) is merely a gesture unless it is structured as a formal learnability argument. Most appeals fail because they assert a gap without defining the learner trying to bridge it.

  For a PoS argument to have force, it requires the four parts you identified:
  1.  **The Attained State:** A specific linguistic generalization the child reliably makes (e.g., structure-dependent rules).
  2.  **The Available Evidence:** A rigorous inventory of the input showing the generalization is not explicitly present, nor statistically derivable by simple association.
  3.  **The Learner Class:** A specification of the cognitive machinery available (e.g., "a general-purpose statistical learner with memory limit X").
  4.  **The Impossibility Proof:** A demonstration that no learner in Class 3 can move from Evidence 2 to State 1 without additional constraints.

  **Evaluation:**
  The missing component in most literature is **Part 3 (The Learner Class)**. Without it, the argument is unfalsifiable. If a theorist claims "The input is insufficient," the counter-claim "A sufficiently powerful neural network could do it" cannot be refuted unless the first theorist specifies *which* networks they have ruled out.
  *   If the Learner Class is "any computable function," the PoS claim is false (anything can be hard-coded).
  *   If the Learner Class is "domain-general statistical inducer," the PoS claim is an empirical hypothesis about the limits of statistical induction.

  Therefore, **Requirement 9 (Learner Specification)** in the table above is the methodological enforcement of this. A PoS argument without a specified Learner Class fails Requirement 9. It is not enough to say "children aren't smart enough to figure this out from data." One must say "a learner with architecture X cannot solve problem Y given data Z."

  ---

  ### Argument 2: Jointly Unsatisfiable Desiderata

  There are indeed collisions between desiderata. These are not merely empirical tensions but often stem from formal constraints on learning systems.

  **Conflict A: No Language-Specific Bias vs. Convergence from Positive Evidence**
  *   **Colliding Requirements:** Desideratum 8 (No conflation; implies preference for general cognition) vs. Desideratum 3 (Convergence) + Desideratum 1 (Input-Output Gap).
  *   **The Collision:** This is a **theorem about learning** (related to "No Free Lunch" theorems). If the hypothesis space of possible grammars is large, and the input data is sparse (Desideratum 1), a learner without a bias specific to the structure of that space (language) will not converge on a single point (Desideratum 3). Different initial random weights or data orderings would lead to different grammars.
  *   **What Has to Give:** You cannot maintain all three.
      1.  Admit a language-specific bias (violates the spirit of Desideratum 8's push for generality).
      2.  Claim the input is richer than it appears (violates Desideratum 1).
      3.  Accept that convergence is an illusion and grammars vary more than thought (violates Desideratum 3).
      *Most current theories give up (1), positing "soft" biases in general cognition that happen to match language.*

  **Conflict B: Retreat from Overgeneralization vs. No Negative Evidence**
  *   **Colliding Requirements:** Desideratum 7 (Retreat) vs. Desideratum 1 (Positive Evidence Only implication).
  *   **The Collision:** This is the **Subset Problem**. If a child hypothesizes a rule that generates *all* past tenses (including *goed*), this hypothesis covers the target language (which generates only *went*) plus extra sentences. The target language is a *subset* of the child's hypothesis. To retreat to the subset, the learner must be told that the extra sentences (*goed*) are illegal. Positive evidence (hearing *went*) does not rule out *goed* (both could be true).
  *   **Proof or Empirical?** This is a **logical constraint on hypothesis testing**. It is a theorem that a learner operating on the "Subset Principle" (always guess the smallest language compatible with data) cannot start with a superset and retreat without negative evidence.
  *   **What Has to Give:**
      1.  **Negative Evidence exists:** Parents do correct children (empirically weak, but possible).
      2.  **Indirect Negative Evidence:** Children infer *goed* is bad because they never hear it, assuming they would have heard it if it were good (requires assumptions about input distribution).
      3.  **Pre-emption:** Hearing *went* blocks *goed* via competition (requires a specific memory/activation architecture).
      *Theories that insist on "Positive Evidence Only" while denying indirect mechanisms fail this logical constraint.*

  ---

  ### Argument 3: The Most Exclusionary Requirement

  The single requirement that does the most to exclude theories people actually hold is **Requirement 9: Learner Specification**.

  **Why it excludes the most theories:**
  The vast majority of accounts of language acquisition are "verbal theories." They describe inputs and outputs and posit a vague mechanism (e.g., "the child notices patterns," "Universal Grammar guides them"). They do not specify the algorithm.
  *   **Nativist theories** often fail this because they posit "parameters" without specifying the search algorithm that sets them.
  *   **Empiricist/Connectionist theories** often fail this because they simulate a network but do not prove the learning rules are psychologically real or computationally feasible for a human infant (e.g., backpropagation is biologically implausible).
  *   **Usage-based theories** often fail this because they rely on "general cognition" without defining the computational limits of that cognition.

  By demanding a specified Learner Class, you render unfalsifiable any theory that relies on a "black box" to bridge the Input-Output Gap. It forces the theorist to run the simulation or prove the theorem.

  **Defensibility vs. Prejudice:**
  This requirement is **defensible** as a condition on scientific explanation, not a prejudice of one camp.
  *   **Prejudice** implies a bias toward a specific outcome (e.g., "Nativism must be true").
  *   **Methodological Necessity** implies a bias toward testability.

  However, it is often *resisted* as if it were a prejudice. Theorists argue that "the brain is too complex to model yet" or "the algorithm is an implementation detail." This resistance suggests that without the black box, their theory cannot survive contact with the data. If a theory cannot specify its learner, it cannot claim the input is sufficient (because we don't know what the learner can do) nor insufficient (because we don't know what the learner needs).

  Therefore, Requirement 9 is the gatekeeper. It is not a claim about language; it is a claim about what counts as a theory. A theory that fails it is not wrong; it is incomplete. But in the context of empirical hypotheses, incompleteness regarding the mechanism of change is a fatal flaw. It excludes almost everyone, which is precisely why it is necessary.
