      *   *Residue:* The "Ought". Systems describe *mechanisms*. Epistemology describes *norms*.
      *   *Social:* Systems = state replication. Epistemology = knowledge transfer.

  8.  **Final Review against constraints:**
      *   "Dont just hand me 'reductionism = verify every packet'." -> Okay, focus on the *justification flow*.
      *   "Residue report... what survives... distortion... no counterpart." -> Structure clearly.
      *   "Fluent on systems, amateur on philosophy." -> Explain Hume/Reid briefly in context.
      *   "American English." -> Check spelling (behavior, model, etc.).

  9.  (Self-Correction during drafting): Make sure to distinguish between *authentication* (crypto) and *justification* (epistemic). A message can be authenticated but the content false. Reductionism worries about the content's truth via reliability. Anti-reductionism worries about the *right* to believe the content.

      *Refining the "Basic Source" point:* In systems, we always trace back to a Genesis Block or Root CA. Anti-reductionism says we don't need a Genesis Block for every claim; the communication channel *is* the genesis. This is the hardest mapping. I need to explain that systems *require* a bootstrap, whereas anti-reductionism says the bootstrap is innate to the social protocol.

