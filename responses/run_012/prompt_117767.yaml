      *   Ensure the explanation of *why* Bystander is wrong is clear (Inaction vs. Unwanted Action).

      *(Self-Correction during drafting)*: I should check if there's any interpretation where "same information" makes it worst. If they all get the *same wrong* information, they all act. But if they get independent information, only one needs to be wrong. If $P(e_i > 0 | v < 0) = \epsilon$.
