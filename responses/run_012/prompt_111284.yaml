  Dear colleague,

  I have been turning over Ruth's voting record and the upcoming porter standing rule, and I am willing to put money on her voting to scrap it. I believe the rule she is actually running is not age, but rather who bears the cost. Your observation that every rule she kept burdens the voters while every rule she scrapped burdens the non-voters is the key, and it holds up better than the age hypothesis when you look at her stated reasoning. If she were purely following age or a strict Burkean principle, she would keep the standing rule because it is from the 1880s, but her justification for scrapping the 1998 kitchen sign-in was not that it was too new, but that the porter's time was not worth the bursar's comfort. She explicitly weighed the burden on the subordinate against the convenience of the fellow, and she sided with the subordinate. The standing rule is the exact same dynamic: a burden on the porter for the ego of the fellow. Since she established in 1998 that a porter's minutes are not worth a bursar's comfort, consistency demands she rule that a porter's dignity is not worth a fellow's status. The age correlation in her past votes is likely coincidental, arising because old rules tend to be rituals bound upon the fellowship itself, while new rules tend to be administrative controls bound upon the staff and students.

  To settle this definitively, we need an agenda item where the age and cost hypotheses predict opposite outcomes. I suggest we introduce a new bye-law, dated this year, that requires fellows to wear name badges at formal hall or submit travel receipts within twenty-four hours. It must be a fresh rule, so the age principle dictates it should be scrapped immediately as untested. However, the cost falls squarely on the voters, the fellows, rather than the staff or students. If she is running the age rule, she will vote to scrap it. If she is running the cost rule, she will vote to keep it, accepting the burden on herself and her peers while having previously removed burdens from the non-voting members of the college. This should force her hand and reveal whether her conservatism is about tradition or about who pays the price.

  If she does vote to keep the standing rule, contrary to my prediction, she will have to perform some gymnastics to stay consistent with her explanation for the 1998 sign-in book. In 1998, she argued the book was scrapped because nobody could say what it was for, implying a lack of purpose made the burden on the porter unacceptable. To keep the standing rule, she would have to assert that unlike the sign-in book, the standing rule does have a known, load-bearing purpose, perhaps claiming the historian is wrong about the deference being a Victorian gloss and insisting it is essential for college hierarchy. She would have to argue that the 1998 book was purposeless bureaucracy while the standing rule is purposeful tradition, effectively shifting her goalposts from the burden on the porter to the utility of the rule, which would contradict her specific comment about the porter's time not being worth the bursar's comfort.

  Best regards,

  [Your Name]
