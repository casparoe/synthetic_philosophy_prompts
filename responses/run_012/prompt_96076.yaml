prompt: |-
  I work in accident and incident investigation — industrial and aviation safety — so my professional vocabulary is the one used to apportion causal responsibility after the fact: but-for and sine qua non causation, cause versus mere condition, intervening and superseding causes, proximate cause, comparative fault percentages, joint and several liability, the distinction between operator error and systemic or organizational failure, and the hindsight bias investigators are trained to fight precisely because we always know how the story ended.

  I have been reading about the historiographical quarrel over who is to blame for the First World War: the dispute reopened in the 1960s by a German historian who argued from the archives that the Reich had been pursuing expansionist aims all along, set against the older view that Europe slid into war through a shared failure of diplomacy, and against the later view that domestic pressures rather than any master plan drove the key decisions. Restate that quarrel in my vocabulary, as faithfully as you can — the competing theses and the evidence marshalled for each, rendered as competing causal apportionments. Then give me the residue report: what failed to survive the translation, and for each piece of residue, whether it marks a gap in my framework or a sign that the historians' disagreement is thinner than it sounds. Where you had to fudge rather than translate, say so rather than smoothing it over. Do not take a side on the war yourself, and do not assume that "who was at fault" means the same thing in the historians' mouths as it does in a fault-apportionment report — if my framework forces a verdict the historians would call a category error, flag that as an artifact of the translation.

  Return your answer as JSON with this schema:

  - "translation": array of objects, each with "historical_claim", "rendering_in_my_vocabulary", "fidelity" (one of "clean", "distorted", "forced"), and "where_it_strains" (empty string if none).
  - "residue": array of objects, each with "historical_claim", "why_no_counterpart", and "diagnosis" (one of "gap in my framework", "original dispute is doing work my framework cannot see", "original claim is vaguer than it looked").
  - "hardest_case": the single translation you are least confident in, with a sentence of justification.
  - "bottom_line": one sentence on whether the translation improved or damaged the original quarrel.
