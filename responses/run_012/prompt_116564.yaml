  ### The Drug Policy Decision Tree

  This tree maps the logical space of drug policy positions based on first principles rather than existing labels. It begins with the normative status of drug use, moves through the structural handling of supply, and concludes with market mechanics. Follow the branches that match your commitments to arrive at a specific policy position.

  **Node 1: The Status of Use**
  Is adult drug consumption a fundamental liberty interest that precludes the state from actively discouraging it?
  *   **Yes:** Go to Node 3.
  *   **No:** Go to Node 2.

  **Node 2: The Primary Metric**
  (If Use is not a liberty interest) Is the primary goal of policy to reduce the *rate of consumption* or to reduce *aggregate social harm*?
  *   **Reduce Consumption:** Go to Node 3.
  *   **Reduce Harm:** Go to Node 3.

  **Node 3: The Supply Chain**
  Should the *sale* of drugs remain a criminal offense?
  *   **Yes (Criminalize Sale):** Go to Node 4.
  *   **No (Legalize Sale):** Go to Node 5.

  **Node 4: The Possession Mechanism**
  (If Sale is Criminal) Should possession be adjudicated by non-judicial administrative health bodies rather than courts or police discretion?
  *   **Yes:** Go to Leaf A, B, or C.
  *   **No:** Go to Leaf D or E.

  **Node 5: The Market Structure**
  (If Sale is Legal) Should private profit-seeking entities be permitted to retail drugs?
  *   **Yes:** Go to Node 6.
  *   **No:** Go to Node 6.

  **Node 6: The Scope of Access**
  (If Sale is Legal) Should access be universal for all adults or restricted to registered medical patients?
  *   **Universal:** Go to Leaf F, G, or H.
  *   **Medical:** Go to Leaf I or J.

  ***

  ### The Leaves

  **Leaf 1: Libertarian Legalizer**
  *   **Path:** Liberty (Yes) → Sale (No) → Profit (Yes) → Access (Universal).
  *   **Most Awkward Commitment:** Must accept that corporate marketing may increase consumption rates without state intervention.
  *   **Distinction:** Distinguished from Commercial Legalizer by the foundational liberty claim rather than harm metrics.

  **Leaf 2: Libertarian Communitarian**
  *   **Path:** Liberty (Yes) → Sale (No) → Profit (No) → Access (Universal).
  *   **Most Awkward Commitment:** Must restrict voluntary economic exchange between consenting adults to prevent profit, despite affirming use as a liberty.
  *   **Status:** *Unoccupied/Unattractive.* This combination is logically possible but politically rare, as libertarians typically view profit restrictions as coercive.

  **Leaf 3: Paternalist Legalizer**
  *   **Path:** Liberty (No) → Metric (Consumption) → Sale (No) → Profit (No) → Access (Universal).
  *   **Most Awkward Commitment:** Must operate a legal market while actively trying to shrink its customer base, creating contradictory state incentives.
  *   **Distinction:** Distinct from State-Monopoly Legalizer because the goal is abstinence, not harm mitigation.

  **Leaf 4: Moralist Decriminalizer**
  *   **Path:** Liberty (No) → Metric (Consumption) → Sale (Yes) → Mechanism (Admin).
  *   **Most Awkward Commitment:** Must treat possession as a health issue administratively while maintaining that the behavior is morally wrong enough to ban sales.
  *   **Status:** *Unexplored.* Most moralists prefer criminal penalties to signal disapproval; most health advocates prioritize harm over prevalence.

  **Leaf 5: Portugal-style Public Health Decriminalizer**
  *   **Path:** Liberty (No) → Metric (Harm) → Sale (Yes) → Mechanism (Admin).
  *   **Most Awkward Commitment:** Must tolerate a violent black market for supply while removing penalties for possession, accepting that users cannot legally source their medicine.
  *   **Distinction:** Distinguished from Discretionary Decriminalizer by the requirement for a formal health commission rather than police diversion.

  **Leaf 6: Discretionary Decriminalizer**
  *   **Path:** Liberty (No) → Metric (Harm) → Sale (Yes) → Mechanism (No).
  *   **Most Awkward Commitment:** Relies on police and prosecutors to voluntarily deprioritize possession cases without statutory protection for the user.
  *   **Distinction:** Distinguished from Portugal-style by the lack of a statutory administrative body, making rights vulnerable to political shifts.

  **Leaf 7: Commercial Legalizer**
  *   **Path:** Liberty (No) → Metric (Harm) → Sale (No) → Profit (Yes) → Access (Universal).
  *   **Most Awkward Commitment:** Must accept that profit incentives may encourage high-potency products or heavy use, potentially increasing aggregate harm.
  *   **Distinction:** Distinguished from Libertarian Legalizer by the justification (harm reduction vs. liberty) and from State-Monopoly by the profit mechanism.

  **Leaf 8: State-Monopoly / Social-Justice Legalizer**
  *   **Path:** Liberty (No) → Metric (Harm) → Sale (No) → Profit (No) → Access (Universal).
  *   **Most Awkward Commitment:** Must trust the state to efficiently manage retail distribution without the corruption or inefficiency typical of government enterprises.
  *   **Distinction:** Often aligns with social-justice goals (expungement, equity) by denying windfalls to private capital.

  **Leaf 9: Private Medicalizer**
  *   **Path:** Liberty (No) → Metric (Harm) → Sale (No) → Profit (Yes) → Access (Medical).
  *   **Most Awkward Commitment:** Creates a legal market that requires a doctor's visit, effectively medicalizing recreation while allowing private profit.
  *   **Status:** *Unstable.* Tends to collapse into Commercial Legalization as medical definitions broaden.

  **Leaf 10: Public Medicalizer**
  *   **Path:** Liberty (No) → Metric (Harm) → Sale (No) → Profit (No) → Access (Medical).
  *   **Most Awkward Commitment:** Restricts access to patients while denying private pharmacies the ability to serve them, centralizing control in the state.
  *   **Distinction:** The strictest form of harm reduction, treating drugs purely as therapeutics.

  **Leaf 11: Pragmatic Harm Reductionist (Regime Agnostic)**
  *   **Path:** Liberty (No) → Metric (Harm) → Sale (Either) → [Indifferent].
  *   **Most Awkward Commitment:** Must concede that their preferred policy label (Decriminalization vs. Legalization) is contingent on empirical data that may change.
  *   **Status:** *Extensionally Equivalent.* This view occupies Leaf 5 and Leaf 7/8 simultaneously depending on local outcomes.

  **Leaf 12: Libertarian Medicalizer**
  *   **Path:** Liberty (Yes) → Sale (No) → Profit (Yes) → Access (Medical).
  *   **Most Awkward Commitment:** Asserts a right to use drugs but accepts a state gatekeeping mechanism (medical registration) that restricts that right.
  *   **Status:** *Incoherent.* A fundamental liberty interest cannot logically require medical permission for exercise.

  ***

  ### Flagged Pairs and Collapses

  **Pair: Leaf 5 (Portugal-style) and Leaf 7 (Commercial Legalizer)**
  *   **Flag:** These leaves cannot be separated for the **Pragmatic Harm Reductionist** (Leaf 11).
  *   **Reason:** The distinction is **empirical rather than conceptual**. For a pure harm-reductionist, the choice between criminalizing sale (Leaf 5) or legalizing it (Leaf 7) depends entirely on which model produces lower overdose rates and violence in a specific jurisdiction. The tree forces a structural choice where this actor sees only a means to an end.

  **Pair: Leaf 8 (State-Monopoly) and Leaf 3 (Paternalist Legalizer)**
  *   **Flag:** These leaves are structurally identical (State-run, Universal Access) but separated by Node 2 (Metric).
  *   **Reason:** The distinction **collapses under pressure**. A State-Monopoly aimed at harm reduction (Leaf 8) often adopts high prices and limited hours to reduce use, effectively becoming a Paternalist Legalizer (Leaf 3). The operational behavior converges even if the stated intent differs.

  ### Diagnosis of Unoccupied Combinations

  **Leaf 2 (Libertarian Communitarian)**
  *   **Diagnosis:** **Unattractive.** This position affirms the liberty to use but denies the liberty to profit from supply. While coherent (one could argue profit corrupts the liberty), it lacks a natural political constituency; libertarians generally support free markets, and communitarians generally support discouraging use.

  **Leaf 4 (Moralist Decriminalizer)**
  *   **Diagnosis:** **Unexplored.** This combination is logically stable but politically difficult. It requires arguing that drug use is wrong enough to ban sales, but not wrong enough to punish users criminally. Most moralists view criminal punishment as necessary for moral signaling; most decriminalization advocates view use as a health issue, not a moral failing.

  **Leaf 12 (Libertarian Medicalizer)**
  *   **Diagnosis:** **Incoherent.** This position claims drug use is a fundamental right while simultaneously accepting a state licensing regime (medical access) that inherently restricts rights. It conflates a liberty interest with a privilege granted by the state.
