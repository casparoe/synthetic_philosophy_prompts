answer: |-
  ### Exam Question

  **Course:** PHI304 Chance and Ignorance
  **Time Allowed:** 45 Minutes
  **Total Marks:** 20

  **Question 1**

  Consider the following two scenarios involving the application of the Principle of Indifference (PoI).

  **Case 1 (Ball Bearings):** A machine produces ball bearings. You are told only that the diameter $D$ of any given bearing lies in the interval $(0, 2]$ cm. You have no further information.
  *   (i) Applying PoI to the diameter, you assign a uniform distribution to $D$. The probability that $D \le 1$ is $1/2$.
  *   (ii) Applying PoI to the volume $V$, where $V \in (0, 4\pi/3]$, you assign a uniform distribution to $V$. Since a bearing with $D=1$ has volume $\pi/6$, the probability that $V \le \pi/6$ is $1/8$.
  *   (iii) Applying PoI to the surface area $A$, you assign a uniform distribution to $A$. The probability that $A$ corresponds to $D \le 1$ is $1/4$.

  **Case 2 (Sphere Conditioning):** A point is chosen uniformly on the surface of a sphere. You are then told the point lies on the meridian at longitude $0^\circ$. What is the probability it is within $30^\circ$ of the North Pole?
  *   (i) If you derive this by conditioning on a thin wedge around the meridian (preserving the surface area measure), the probability is $\approx 0.067$.
  *   (ii) If you treat the point as chosen uniformly along the length of the great circle (arc length measure), the probability is $1/6$.

  **Essay Task:**
  Write an essay addressing the following three points:
  1.  **Diagnosis:** Precisely identify what goes wrong in Case 1 and Case 2. Is the underlying mathematical problem the same in both cases, or are they distinct?
  2.  **Defense:** A critic claims these cases prove the Principle of Indifference is inconsistent and should be abandoned. Construct the best possible defense of the PoI. Is it dead, or does it require refinement? If refinement, what does that look like?
  3.  **Resolution:** Is there a principled way to select the "correct" parameterization (diameter vs. volume; surface measure vs. arc length)? Under what conditions does such a selection succeed or fail?

  ***

  ### Model Answer

  The two cases presented demonstrate that the Principle of Indifference (PoI) is not invariant under transformation, but they do so via distinct mathematical mechanisms. In Case 1, the contradiction arises from the **change of variables**. A uniform distribution on a random variable $X$ does not induce a uniform distribution on $f(X)$ unless $f$ is linear. By applying PoI to diameter, volume, and area simultaneously, we are implicitly asserting three incompatible probability measures over the same physical space. The error is the assumption that "ignorance" implies "uniformity" regardless of the parameterization. Ignorance about the diameter is not logically equivalent to ignorance about the volume, because the transformation between them is non-linear.

  Case 2 is subtly different. This is an instance of the **Borel-Kolmogorov paradox**. Here, the issue is not merely reparameterization, but conditioning on an event of measure zero (a specific meridian on a continuous sphere). The probability depends on the *limit process* used to approach the meridian. The "wedge" method preserves the original surface measure ($\sin \theta d\theta d\phi$), yielding a density proportional to $\sin \theta$ along the meridian. The "arc length" method assumes a new, independent measure on the circle itself. While Case 1 is about which variable represents ignorance, Case 2 is about how conditional probabilities are defined on null sets. Thus, while both show PoI yields conflicting results, Case 1 is a failure of transformation invariance, while Case 2 is a failure of conditional definition.

  To defend the PoI against the charge of inconsistency, one must concede that the principle as stated ("assign equal probability to equipossible cases") is incomplete. It is not dead, but it is underspecified. The defense rests on the claim that PoI applies only when there is a **privileged parameterization** justified by symmetry or physical mechanism. In Case 1, if the machine cuts bearings by diameter, the diameter is the privileged parameter. If it fills molds by volume, volume is privileged. The contradiction vanishes once we acknowledge that "total ignorance" rarely exists; there is almost always background knowledge about the *process* generating the value. The PoI should be restated: "Assign a uniform prior over the parameter space that is invariant under the symmetry group of the physical generating process."

  This leads to the resolution regarding principled selection. We can select the correct parameterization using **Invariance Principles** (as proposed by Jaynes) or **Maximum Entropy**. In Case 1, if the manufacturing process is scale-invariant, we might seek a prior $p(x) \propto 1/x$ (Jeffreys prior) which remains consistent under scaling, though this requires more than simple indifference. In Case 2, the "correct" answer depends on the physical setup. If the point was generated uniformly on the sphere and *then* filtered, the wedge method (0.067) is correct because it respects the generating measure. If the point was generated by spinning a dial on a ring, the arc length (1/6) is correct.

  Therefore, a principled selection succeeds when we have access to the symmetry group of the problem or the causal mechanism. It fails when we truly have *no* information about the measurement scale or generation process. In such radical ignorance, no unique prior exists, and the PoI cannot generate a single number without arbitrary choice. The lesson is not that probability theory is broken, but that priors must reflect physical symmetries, not merely linguistic descriptions of variables.

  ***

  ### Marking Scheme

  **Total Marks:** 20
  **Grade Boundaries:**
  *   **A (17–20):** Insightful, distinguishes the mathematical structures, nuanced defense of PoI.
  *   **B (13–16):** Competent, identifies the paradoxes correctly, standard defense (symmetry).
  *   **C (9–12):** Basic, identifies inconsistency, vague on resolution.
  *   **D/F (0–8):** Misunderstands the cases or claims PoI is simply false.

  #### 1. Diagnosis of Cases (6 Marks)

  *   **A-Grade Move (5-6 marks):** Explicitly distinguishes the mathematical nature of the two cases. Identifies Case 1 as **Change of Variables / Reparameterization** (Jacobian issues) and Case 2 as **Conditioning on Measure Zero / Borel-Kolmogorov** (limit process dependence). Notes that Case 1 is about the *representation* of ignorance, Case 2 is about the *definition* of conditional probability.
      *   *Typical B-Muff:* Treats both cases as identical examples of "PoI gives different answers for different variables." Fails to mention measure zero or limit processes for Case 2. (3-4 marks)
      *   *Typical C-Muff:* Vaguely says "math is different" or focuses only on the numbers contradicting. (1-2 marks)

  #### 2. Defense of the Principle (7 Marks)

  *   **A-Grade Move (6-7 marks):** Avoids the trap of declaring PoI "inconsistent/dead." Argues PoI requires a **privileged parameterization** based on physical context or symmetry. Reframes PoI from "ignorance" to "invariance under symmetry group." Acknowledges that "total ignorance" is a fiction; background knowledge about the *process* breaks the symmetry.
      *   *Typical B-Muff:* Defends PoI by saying "you just have to pick the physical one." Misses the deeper point about symmetry groups or invariance. Says "PoI works if you know the mechanism" without explaining *why* that validates the prior. (4-5 marks)
      *   *Typical C-Muff:* Claims PoI is useless/inconsistent (violates prompt constraint) OR claims PoI is fine and the math is wrong. (1-3 marks)

  #### 3. Resolution and Parameterization (7 Marks)

  *   **A-Grade Move (6-7 marks):** Proposes specific criteria for selection: **Jaynes' Invariance**, **Jeffreys Priors**, or **Maximum Entropy**. Distinguishes when this works (known symmetry/causal mechanism) vs. fails (radical ignorance where no scale is privileged). Explicitly links the "correct" answer in Case 2 to the *generating process* (sphere generation vs. circle generation).
      *   *Typical B-Muff:* Says "pick the one that matches the experiment." Lacks the terminology of invariance or entropy. Doesn't explicitly state when the selection method *fails*. (4-5 marks)
      *   *Typical C-Muff:* Suggests we should just "average the answers" or "ask the manufacturer." No principled statistical/philosophical criterion offered. (1-3 marks)

  #### General Penalties & Constraints
  *   **Constraint Violation:** If the answer concludes "Bayesianism is in trouble" or "PoI is logically inconsistent" without qualification, cap at 12 marks (C grade).
  *   **Constraint Violation:** If the answer claims the methods in Bertrand/Case 1 are "mathematically wrong" (rather than inappropriate for the *ignorance* claim), deduct 2 marks.
  *   **Clarity/Structure:** Deduct up to 2 marks for poor structure or failing to address all three sub-questions explicitly.

  #### Differentiator Summary (A vs B)
  *   **The "A" Student** sees that Case 2 is technically Borel-Kolmogorov (conditional probability on null sets), whereas Case 1 is standard transformation of variables. They defend PoI by invoking *symmetry groups* rather than just "physical intuition."
  *   **The "B" Student** sees both cases as "PoI ambiguity." They defend PoI by saying "use the physical variable." They understand the course material but miss the measure-theoretic nuance.
