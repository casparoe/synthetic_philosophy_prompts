          *   Refinement: The prompt asks about the difference between reason for attitude vs action. Practical upshot: You can legitimately write the essay only if you can find a true angle. If not, you are lying.

      *   **Section 4: If the money goes to the hardship fund (~150 words)**
          *   Does altruism justify the lie?
