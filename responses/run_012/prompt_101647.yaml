      *   **Section 3: What follows for what I should do (~200 words)**
          *   Focus: Action vs. Attitude.
          *   Distinction: You can choose to apply (action), but you cannot choose to admire (attitude).
          *   Advice: Don't try to manufacture the feeling. If you apply, frame the essay around what you *can* sincerely value (e.g., the foundation's current impact, not his past management). But if the prompt demands admiration for *him*, you face a integrity check.
