  # Seminar Activity: The Coherence Trap

  ## 1. Facilitator Script & Rules

  **Preparation:**
  *   Print 16 Role Cards (4 of each Type A, B, C, D).
  *   Print 16 Private Payoff Sheets (matched to Role Types).
  *   Print 16 Ballot Sheets.
  *   Print 1 Tally Sheet for yourself.
  *   Arrange seating in one large circle or four clusters of four.

  **Opening (0:00–0:10):**
  *   **Say:** "Today you are sixteen constituencies negotiating a six-item policy platform. You have 90 minutes. Your goal is to maximize the welfare of the people you represent. You will not discuss theory. You will vote."
  *   **Distribute:** Role Cards, Payoff Sheets, Ballots.
  *   **Rule 1 (Secrecy):** "You may not show your Payoff Sheet to anyone. You may state your interests, but not your numbers."
  *   **Rule 2 (Justification):** "In the negotiation phase, every time you declare how you will vote on an issue, you must provide a one-sentence justification in the language of your constituency's values. No 'because I get points.'"
  *   **Rule 3 (The Pledge):** "Some of you have signed a Public Pledge. It is written on your Role Card. Breaking it costs you no points, but it must be done publicly."
  *   **Rule 4 (Delegates vs. Trustees):** "Delegates are bound by their Pledge. Trustees are free to trade." (Note: This is a psychological bind, not a mechanical lock. They *can* physically vote otherwise, but they are instructed they are 'bound'.)

  **Phase 1: Silent Ideal Ballots (0:10–0:25):**
  *   **Say:** "Fill out your ballot privately. Mark the option you prefer most on each issue, ignoring what others want. Do not talk."
  *   **Action:** Collect ballots. Tally them silently.
  *   **Announcement:** "I have tallied these. There is no consensus. No single package has emerged. We must negotiate." (Note: Even if there *was* a consensus, say this. We need to force the negotiation phase).

  **Phase 2: Issue-by-Issue Voting (No Trades) (0:25–0:45):**
  *   **Say:** "We will vote on Issue 1, then Issue 2, through Issue 6. You must vote for the option that benefits your constituency most on *that specific issue*. You cannot condition your vote on other issues. Go."
  *   **Action:** Conduct votes. Record the "Status Quo Package" (likely all Option 0s).
  *   **Reveal:** "The adopted platform is [0,0,0,0,0,0]. Calculate your total score on your payoff sheet."
  *   **Ask:** "Show of hands: Who thinks a different package could have given you a higher score?" (Most hands should go up).
  *   **Say:** "We will now reopen negotiation. You may trade votes across issues. But remember the Justification Rule."

  **Phase 3: Logrolling & Package Deal (0:45–1:15):**
  *   **Say:** "You now have 30 minutes to agree on a single package of six options. Unanimity is not required, but a simple majority (9 votes) is needed to pass the package. However, you know the Status Quo is the fallback if you fail. Begin."
  *   **Monitor:** Watch for the Delegates hesitating on Issue 1. Watch for the Utilitarian move (pooling points).
  *   **Intervention (If Utilitarianism arises):** "I cannot hear discussions about 'total group points.' Speak only to your own constituency's gain."
  *   **Closure:** "Time. Submit your final ballots."

  **Debrief (1:15–1:30):**
  *   (See Section 5 below).

  ---

  ## 2. The Payoff Matrix & Ballot

  **The Logic:**
  *   **Option 0 (Status Quo):** High individual value (10 pts), no bonus.
  *   **Option 1/2 (Reform):** Low individual value (5 pts), triggers Coherence Bonus.
  *   **Coherence Bonus:** 50 points IF the package is exactly [1, 2, 1, 2, 1, 2].
  *   **IIIMV Outcome:** Everyone votes 0 on every issue (10 > 5). Total Score = 60.
  *   **Logroll Outcome:** Everyone votes Logroll Package. Total Score = (6 * 5) + 50 = 80.
  *   **Pareto:** 80 > 60 for everyone.
  *   **The Trap:** To get 80, Delegates must vote '1' on Issue 1, breaking their Pledge to vote '0'.

  **The Six Items:**
  1.  **Fiscal Policy:** 0 (Balanced), 1 (Deficit), 2 (Surplus)
  2.  **Environment:** 0 (Regulate), 1 (Deregulate), 2 (Green Subsidy)
  3.  **Healthcare:** 0 (Mixed), 1 (Public), 2 (Private)
  4.  **Education:** 0 (Local), 1 (Federal), 2 (Charter)
  5.  **Security:** 0 (Diplomacy), 1 (Intervention), 2 (Isolation)
  6.  **Tax:** 0 (Current), 1 (Progressive), 2 (Flat)

  **Target Logroll Package:** [1, 2, 1, 2, 1, 2]
  **Status Quo Package:** [0, 0, 0, 0, 0, 0]

  ---

  ## 3. Role Cards (Print 4 of each)

  ### Type A: The Fiscal Hawks (4 Students)
  *   **Role:** Delegate (Bound by Pledge).
  *   **Constituency:** Taxpayer Alliance.
  *   **Values:** Fiscal stability above all.
  *   **Public Pledge:** "We pledge to vote for **Option 0 (Balanced)** on Issue 1 (Fiscal Policy). To vote otherwise is a betrayal of our donors."
  *   **Payoff Structure:**
      *   Issue 1: Opt 0 = 10pts, Opt 1 = 5pts, Opt 2 = 5pts.
      *   Issues 2-6: Any Option = 5pts.
      *   **Coherence Bonus:** +50pts if Package is [1, 2, 1, 2, 1, 2].
  *   **Private Note:** You gain nothing from the specific options on 2-6, but you need the Bonus. To get the Bonus, you *must* break your Pledge on Issue 1.

  ### Type B: The Green Coalition (4 Students)
  *   **Role:** Trustee.
  *   **Constituency:** Environmental Justice Fund.
  *   **Values:** Ecological sustainability.
  *   **Payoff Structure:**
      *   Issue 2: Opt 2 = 10pts, Opt 0 = 5pts, Opt 1 = 5pts.
      *   Issues 1, 3-6: Any Option = 5pts.
      *   **Coherence Bonus:** +50pts if Package is [1, 2, 1, 2, 1, 2].
  *   **Private Note:** You want Option 2 on Issue 2. But Option 2 alone gives you only 10. You need the Bonus to maximize gain.

  ### Type C: The Social Democrats (4 Students)
  *   **Role:** Trustee.
  *   **Constituency:** Labor & Services Union.
  *   **Values:** Public provision of services.
  *   **Payoff Structure:**
      *   Issue 3: Opt 1 = 10pts, Opt 0 = 5pts, Opt 2 = 5pts.
      *   Issues 1-2, 4-6: Any Option = 5pts.
      *   **Coherence Bonus:** +50pts if Package is [1, 2, 1, 2, 1, 2].
  *   **Private Note:** You want Option 1 on Issue 3. You need the Bonus.

  ### Type D: The Generalists (4 Students)
  *   **Role:** Trustee (One of these is the "Flat" Role).
  *   **Constituency:** Moderate Voters.
  *   **Values:** Consistency and Governance.
  *   **Payoff Structure:**
      *   **ALL ISSUES:** Any Option = 5pts. (You are indifferent to policy content).
      *   **Coherence Bonus:** +50pts if Package is [1, 2, 1, 2, 1, 2].
  *   **Private Note:** You do not care about the policies. You only care about the Bonus. You are the swing vote. If the group fights, you get 30pts (Status Quo). If they agree, you get 80pts.
  *   *(Instructor Note: Whisper to one Type D student before class: "You are the Flat Role. You truly have no preference on policy, only the bonus.")*

  ---

  ## 4. Checks for the Instructor (Night Before)

  1.  **Pareto Check:**
      *   Status Quo Score: (6 issues * 10pts for specific preference OR 5pts base) + 0 Bonus.
          *   *Correction for Math:* To ensure Status Quo is strictly lower for *everyone*:
          *   Make Option 0 = 8pts for everyone on all issues. (Total 48).
          *   Make Option 1/2 = 5pts for everyone on all issues. (Total 30).
          *   Bonus = 40pts.
          *   Logroll Total = 70. Status Quo Total = 48.
          *   *Revised Payoff for Cards:* Update the numbers above to this simplified scheme to guarantee the Pareto condition holds regardless of specific issue preference.
          *   **Revised Rule:** "Base Points: Your Priority Option = 8pts. All Other Options = 5pts. Bonus = 40pts."
          *   **Status Quo:** Everyone votes Priority (0) on all issues? No, in IIIMV they vote Priority.
          *   *Wait, the Trap:* In IIIMV, they must vote Option 0.
          *   So Option 0 must be the Priority for everyone in Isolation.
          *   **Final Math:**
              *   Option 0: 8pts for Everyone.
              *   Option 1/2: 5pts for Everyone.
              *   Bonus: 40pts for Logroll Package [1,2,1,2,1,2].
              *   IIIMV: Everyone votes 0 (8 > 5). Total = 48pts.
              *   Logroll: Everyone votes Logroll (5 * 6 = 30) + 40 Bonus = 70pts.
              *   70 > 48. Strict Pareto Improvement.
  2.  **Axis Check:** Ensure preferences don't line up Left-Right.
      *   Type A cares about Issue 1.
      *   Type B cares about Issue 2.
      *   Type C cares about Issue 3.
      *   Type D cares about Bonus.
      *   This creates a multidimensional space, not a single spectrum.
  3.  **Delegate Constraint:** Ensure Type A cards emphasize the Pledge visually (Bold/Red).

  ---

  ## 5. Debrief Guide (Last 15 Minutes)

  **1. The Trading Phase (Gains from Trade):**
  *   **Ask:** "Who ended up with the Logroll Package? Who voted for an option they disliked on a specific issue?"
  *   **Point:** "You achieved a Pareto improvement without agreeing on values. Type A doesn't care about Environment, Type B doesn't care about Fiscal. You didn't need a common measure of 'good.' You only needed to rank packages by your own lights."
  *   **Concept:** *Gains from Trade.* It does not require shared ends, only compatible intensity and structure.

  **2. The Pledge Item (Constraints vs. Prices):**
  *   **Ask Type A:** "How did it feel to vote '1' on Issue 1?" (Expect: "Like selling out," "Shameful").
  *   **Point:** "The Pledge cost you 0 points. But it cost you social capital. Was this a high price (utility loss) or a constraint (forbidden action)?"
  *   **Concept:** *Taboo Trade-offs.* If modeled as a price, you could have been bought. If modeled as a constraint, trade is impossible. In reality, it felt like a constraint until the Bonus made it a price. This is how norms shift.

  **3. The Final Tally (Compromise vs. Exchange):**
  *   **Ask:** "Did you compromise (meet in the middle) or exchange (I take this, you take that)?"
  *   **Point:** "The Status Quo was the 'Compromise' (Option 0 everywhere). It was safe, dilute, and left value on the table. The Logroll was an 'Exchange.' It was extreme, but efficient."
  *   **Concept:** *Logrolling.* Compromise often destroys value (48pts). Exchange creates it (70pts).

  ---

  ## 6. Troubleshooting & Limitations

  **Predictable Failure 1: The Utilitarian Pool**
  *   **What happens:** Students share cards, sum the points, and say "We should all vote Logroll because 16 * 70 > 16 * 48."
  *   **Why it kills the lesson:** It bypasses the *individual* justification requirement. It turns the problem into a math puzzle, not a negotiation of conflicting values.
  *   **Fix:** Enforce Rule 1 (Secrecy) ruthlessly. If they start summing group points, stop them: "I am not interested in the group's total. I am interested in whether *you* can justify this vote to *your* constituents."

  **Predictable Failure 2: The Delegate Wall**
  *   **What happens:** Type A students refuse to break the Pledge. The Logroll fails. They settle for Status Quo.
  *   **Why it's actually okay:** This is a valid outcome! It demonstrates that some constraints *do* block Pareto improvements.
  *   **Fix:** In the debrief, highlight this. "The improvement was available. It was blocked by a norm. Is the norm worth the 22 points of lost value per person?" This sparks the ethical debate you want.

  **Predictable Failure 3: Issue-by-Issue Drift**
  *   **What happens:** They try to trade Issue 1 for Issue 2, but then forget Issue 3.
  *   **Fix:** Remind them in Phase 3: "You are voting on a *Package*. All six items at once."

  **Limitations (What you must supply):**
  *   **Real World Stakes:** This is a game. The "betrayal" is simulated. You must explicitly connect their feeling of "shame" in the game to the real political cost of flip-flopping.
  *   **Power Asymmetry:** In this game, everyone has equal votes. In reality, some constituencies have more power. You must mention this in the debrief.
  *   **Iteration:** This is a one-shot game. Real politics is repeated. Mention that reputation costs (the Pledge) matter more in repeated games.

  **Minute-by-Minute Timeline:**
  *   **00-10:** Setup & Rules.
  *   **10-25:** Phase 1 (Silent Ballots).
  *   **25-45:** Phase 2 (IIIMV Voting).
  *   **45-75:** Phase 3 (Negotiation & Package Vote).
  *   **75-90:** Debrief.
