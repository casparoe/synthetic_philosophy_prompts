answer: |-
  Here is a complete lesson plan designed to visceralize the Dogmatism Paradox (often attributed to Gilbert Harman) before introducing the formal argument.

  ## Activity Title: The Immunity Protocol
  **Time:** 75 Minutes
  **Class Size:** 14 Students
  **Goal:** To demonstrate that if we accept standard closure principles and the definition of knowledge, we are committed to the right to ignore counter-evidence.

  ### Part 1: Setup & Materials (Prep before class)
  1.  **Claim Cards (14 total):** Create 7 pairs of identical claims. The claims must be contingent, verifiable facts about the immediate environment.
      *   *Examples:* "The projector bulb is currently on," "There are exactly 14 chairs in this room," "The door to the hall is currently closed."
      *   *Crucial:* All claims must be **TRUE** at the start of class.
  2.  **Verification Envelopes (14 total):** Inside each, print the word **TRUE** in bold. Seal them.
  3.  **Evidence Packets (14 total):** These contain "Counter-Evidence."
      *   *Content:* A printed slip that looks authoritative. E.g., if the claim is "The door is closed," the evidence says: *Facilities Log 10:05 AM: Door mechanism malfunction. Status: UNLATCHED.*
      *   *Crucial:* The evidence must be **FALSE/MISLEADING**, but plausible enough to create doubt.
  4.  **Scorecards:** Simple grid for tracking points.
  5.  **The "Bin":** A physical trash can or box at the front of the room.

  ---

  ### Part 2: The Activity (45 Minutes)

  #### Phase 1: Verification & Commitment (10 mins)
  1.  Distribute **Claim Cards** and **Verification Envelopes**.
  2.  Instruct students to open the envelope. They now have justification for the claim.
  3.  **The Choice:** Students must privately mark their Scorecard with one of two statuses:
      *   **STATUS K (Knowledge):** "I claim to *know* this proposition is true."
      *   **STATUS O (Open):** "I believe this is true, but I am *open* to revision."
  4.  **Incentive Structure (Write on Board):**
      *   **If STATUS K:** You get **100 points** if the Claim is True at the end. You get **0 points** if the Claim is False. *Evidence does not affect your score.*
      *   **If STATUS O:** You start with **50 points**. If you revise your belief to match the Evidence, you keep the 50. If you *ignore* the Evidence and the Claim turns out False, you get **-50 points** (Penalty for dogmatism without knowledge).

      *(Note: This incentivizes Status K heavily, as 100 > 50, provided they trust their verification.)*

  #### Phase 2: The Attack (15 mins)
  1.  Tell the class: "New information has come to light from a high-reliability source (e.g., Building Management)."
  2.  Distribute the **Evidence Packets**.
  3.  Read a script: "This evidence directly contradicts your Claim. According to protocol:"
      *   **STATUS O Students:** You *must* publicly announce whether you are revising your belief to match the Evidence. If you revise, you keep your 50 points. If you refuse to revise, you are flagged for 'Epistemic Negligence' (lose 50 points).
      *   **STATUS K Students:** You have **Epistemic Immunity**. You may walk to the front and place your Evidence Packet in the **Bin**. You do not need to explain why. You do not need to revise. Your 100 points are secure *if the claim is true*.
  4.  **The Viseral Moment:** Watch the STATUS O students squirm. They have good evidence (in the context of the game) and must revise away from the truth. Watch the STATUS K students confidently trash the evidence.

  #### Phase 3: Resolution (10 mins)
  1.  Reveal the actual state of the world (e.g., walk to the door and show it is closed; check the projector).
  2.  Confirm all Claims were **TRUE**.
  3.  **Tally Scores:**
      *   **STATUS K (Dogmatists):** 100 points. (They ignored evidence, stayed with truth, won big).
      *   **STATUS O (Open-minded):** 50 points. (They followed evidence, revised away from truth, lost half their potential).
      *   **STATUS O (Stubborn):** -50 points. (They ignored evidence without 'Knowledge' status, punished).
  4.  **Result:** The "smug dogmatists" have objectively won the game. The "careful fallibilists" have been penalized for being responsive to evidence.

  #### Phase 4: The Silence (5 mins)
  1.  Do not explain the philosophy yet.
  2.  Ask: "How did that feel? Was the game fair? Did the 'Knowers' act rationally?"
  3.  Let the frustration simmer. Write "The Dogmatism Paradox" on the board only now.

  ---

  ### Part 3: The Debrief (30 Minutes)

  #### 1. Mapping the Game to the Argument (10 mins)
  Draw the following parallel on the board. Ask students to fill in the blanks based on the game rules.

  *   **Premise 1 (Verification):** If you have Status K, you have Justification + Truth. ($K(P)$)
  *   **Premise 2 (The Evidence):** The Evidence ($E$) implied $\neg P$.
  *   **Premise 3 (The Immunity Rule):** In the game, Status K allowed you to bin $E$. Why? Because the rules assumed: **If you Know $P$, you Know any evidence against $P$ is misleading.**
  *   **The Conclusion:** Therefore, if you Know $P$, you are entitled to ignore $E$.

  Explain that Harman's paradox isn't that we *should* ignore evidence, but that standard epistemology seems to *force* us to say we can.
  *   If I know $P$, and $E$ implies not-$P$, then $E$ is false/misleading.
  *   If I know $P$, and I can deduce $E$ is misleading, do I know $E$ is misleading? (Closure Principle).
  *   If I know $E$ is misleading, I don't need to listen to it.

  #### 2. Escape Routes (15 mins)
  Guide the seminar through the three standard philosophical exits. Ask which rule of the game they would break to fix the "unfairness."

  *   **Route A: Deny Closure (The Nozick/Reliabilist Move).**
      *   *Game Fix:* "Just because you Know the Door is Closed, doesn't mean you Know the Facilities Log is fake."
      *   *Philosophy:* Knowledge is not closed under known implication. You can know $P$, know $P \to \neg E$ is misleading, but still *not know* that $E$ is misleading.
  *   **Route B: Defeasibility (The Fallibilist Move).**
      *   *Game Fix:* "Status K does not grant Immunity. New evidence can defeat Knowledge."
      *   *Philosophy:* Knowledge is not a permanent state. Even if $P$ is true and justified, sufficiently strong counter-evidence can destroy the *status* of knowledge, forcing you to revise. The game assumed Knowledge is a shield; this route says Knowledge is glass.
  *   **Route C: Contextualism/Standards.**
      *   *Game Fix:* "The introduction of the Evidence changed the context. You had Status K *before* the evidence, but not *after*."
      *   *Philosophy:* The standards for 'Know' rose when the evidence appeared. You can't bin the evidence because you no longer meet the threshold for 'Know' in this new context.

  #### 3. Limitations & The "Rigged" Feeling (5 mins)
  Address the predicted failure modes directly.
  *   **What the game hid:** The game assumed the Claim remained True throughout. In reality, if evidence is strong enough, we often suspect the Claim *isn't* true anymore. The paradox relies on $P$ staying true while $E$ attacks it.
  *   **The "Rigged" Complaint:** If a student says, "The payoffs were rigged to make dogmatists win," agree with them.
      *   *Instructor Note:* "Exactly. The game rules *are* the premises of the paradox. If the conclusion (dogmatists win) feels wrong, then one of the rules (premises) must be false. Your job in epistemology is to find which rule to break."

  ---

  ### Predicted Failure Modes & Mitigation

  **1. The "Hedge" Problem (Nobody claims Status K)**
  *   **Risk:** Upper-level students are trained to be fallibilists. They might all choose Status O to avoid looking arrogant, ruining the comparison.
  *   **Mitigation:** Increase the Status K reward to **200 points**. Make the Status O cap **50 points**. Add a verbal prompt: "In this seminar, we value precision. If you verified it, claim it."
  *   **Backup:** If everyone hedges, *you* play the Dogmatist. Take a claim, verify it, declare Status K, bin the evidence, and claim the win. Then ask them why they feel morally superior but mathematically inferior to you.

  **2. The "Rebellion" (Students refuse to follow the Evidence Rule)**
  *   **Risk:** A Status O student says, "This evidence is obviously fake, I'm not revising."
  *   **Mitigation:** Pre-empt this in the instructions. "For the purpose of the simulation, the Evidence Packet counts as *prima facie* reliable testimony. You must treat it as credible unless you have Status K."
  *   **Debrief Use:** If they rebel, highlight it! "You just intuitively rejected Premise 3. You felt you didn't *know* the evidence was misleading, even though you knew the Claim. That's the Denial of Closure."

  **3. The "Cynic" (Claims the game proves nothing)**
  *   **Risk:** "This is just a game about points, not truth."
  *   **Mitigation:** Acknowledge this immediately in the debrief. "The points represent *epistemic standing*. The Dogmatist retains high standing; the Fallibilist loses standing. The paradox is about standing, not just truth."

  **4. Time Creep**
  *   **Risk:** The debrief turns into a general discussion on skepticism.
  *   **Mitigation:** Keep the board divided into three columns: **The Game**, **The Paradox**, **The Escape**. Force every comment to fit into a column.

  ### Instructor's Cheat Sheet (The Formal Argument)
  Keep this handy for the board work during debrief.
  1.  $S$ knows that $P$.
  2.  $S$ knows that if $E$ is true, then $P$ is false. (Evidence contradicts Claim)
  3.  Therefore, $S$ knows that $E$ is false. (Closure)
  4.  If $S$ knows $E$ is false, $S$ is justified in ignoring $E$.
  5.  **Paradox:** It seems irrational to ignore evidence without examining it, yet Knowledge seems to entail this right.

  ### Why this design works better than the rough idea
  *   **Scoring Asymmetry:** Your rough idea had "penalties for revising." This design creates a **cap** for open-mindedness (50) vs a **ceiling** for dogmatism (100/200). This makes the "rational" epistemic behavior (updating on evidence) strategically suicidal, which heightens the tension.
  *   **Physical Binning:** Making them physically throw away the evidence creates a stronger memory anchor for the "ignoring" premise than just "binning" on a scorecard.
  *   **Explicit Limitations:** By admitting the game assumes $P$ stays true, you prevent students from attacking the wrong part of the paradox (i.e., "But maybe the door opened!"). You isolate the logic of *knowledge* from the *metaphysics of truth*.
