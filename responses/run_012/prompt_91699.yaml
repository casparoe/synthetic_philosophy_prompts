answer: |-
  You are looking for a single governing rule, but your own examples suggest that truth is not a single commodity. It behaves differently depending on whether it is being used as a tool or worn as a badge. Your "truth budget" is a strong start, but it fails because it measures only the *utility* of the information, ignoring the *cost* of delivering it.

  To accommodate all eight verdicts, you need a two-clause principle. Let us call it **The Principle of Calibrated Candour**.

  **Clause 1 (Utility):** You owe the plain truth when the listener can act on it to prevent a concrete failure.
  **Clause 2 (Exposure):** You owe protection when the truth serves no corrective purpose but damages standing, or when your interests are not aligned.

  Clause 1 dictates *what* you must say to ensure the work succeeds. Clause 2 dictates *how* and *when* you say it to ensure the relationship survives, or permits silence when the relationship is transactional. Clause 1 is the engine; Clause 2 is the steering.

  ### How the Principle Fits Your Eight Cases

  1.  **Manager (Public):** Clause 1 dominates. The architecture will fail (concrete failure). She can fix it (actionable). The public setting is her choice, implying she accepts the exposure. You speak plainly.
  2.  **Tokyo Colleague (Public):** Clause 1 says the design needs fixing, but Clause 2 intervenes. Public correction damages standing (face) without adding value over a private correction. You hedge to protect dignity, deferring the utility to a private setting.
  3.  **Tokyo Colleague (Private):** Clause 1 dominates again. The failure is the same, but Clause 2's constraint (public standing) is removed. You speak plainly.
  4.  **Colleague's Talk:** Clause 1 dominates. He can fix the talk before the customer sees it. Lying ("went well") prevents him from averting failure. You owe the truth.
  5.  **Aunt's Meal:** Clause 2 dominates. No concrete failure is being averted (the meal is eaten). Truth only damages feelings. You owe protection (kindness).
  6.  **Friend's Short Story:** Here lies your conflict. Clause 1 suggests you owe the truth (sending a weak story to an agent risks her professional reputation). Clause 2 suggests protection (friendship). Your verdict wavers because you are weighing the risk to her career against the risk to her feelings.
  7.  **Recruiter:** Clause 2 dominates. Interests are not aligned (negotiation). Truth harms your position without helping them achieve a shared goal. You owe self-protection.
  8.  **Colleague's Concerns:** Clause 1 is violated by your omission. He acts on the belief he is safe; he is not. Clause 2 is violated because cooperative trust is broken by technical truth that misleads. You owe clarity.

  ### Application to New Cases

  **1. A stranger on a forum asking whether his plan will work.**
  *Verdict:* Give the plain technical truth, but detach it from personal judgement.
  *Reasoning:* Clause 1 applies (he can act to prevent failure). Clause 2's protection does not apply because there is no ongoing relationship to damage, nor is there a social cost to his standing amongst peers you both know. However, because you lack full context, you should caveat your advice to avoid leading him astray. You owe him accuracy, not kindness.

  **2. A close friend asking whether she was right to turn down a job offer six months ago, which she cannot undo.**
  *Verdict:* Offer support, not analysis.
  *Reasoning:* Clause 1 is null. She cannot act on the information to change the outcome; there is no failure to prevent. Clause 2 dominates. The only consequence of truth is regret or defensiveness. The "constructive" outcome is emotional stability, not factual accuracy. You tell her she made the best decision she could with the information she had at the time.

  ### The Verdict You Should Give Up

  The principle cannot accommodate your uncertainty regarding the **Short Story (Case 6)** whilst holding firm on the **Talk (Case 4)**.

  Structurally, these are identical. In both, a colleague faces an external audience (customer/agent) where poor performance damages their professional reputation. In Case 4, you correctly identified that withholding the truth was wrong because it exposed him to failure. In Case 6, telling her it is "strong" when it is not exposes her to rejection and reputational damage with the agent.

  If you accept the Principle of Calibrated Candour, you must concede that your response to the short story was too soft. You owed her the plain truth (Clause 1) because the stakes were professional, not merely social. The hesitation you feel is natural, but the principle dictates that protecting a friend from a painful truth that would save them from a career stumble is not kindness; it is negligence. You should give up the idea that "strong" was an acceptable answer.

  ### What Would Change My Mind

  My reasoning relies on the assumption that professional reputation (the Talk, the Story) outweighs immediate social comfort. I would abandon this principle if you presented a case where **truth prevented a failure but destroyed the capacity to work together.**

  For example: If telling your Manager (Case 1) the truth in public caused her to lose confidence in you permanently, such that you could no longer function as a team, then Clause 2 (Exposure) would have to override Clause 1. If you argued that preserving the working relationship was more valuable than the specific architectural decision, the principle would need to shift from "Constructive Consequence" to "Relational Continuity."

  Additionally, if you clarified that the Tokyo colleague's culture strictly forbids *any* public dissent regardless of stakes, Clause 2 would need to be weighted heavier than I have allowed. If "face" is not just about comfort but about social viability, then the public hedge is not just polite; it is mandatory, even if the project fails.

  ### Where My Reasoning Might Fail

  I have assumed that your colleagues generally prefer success to comfort. If your Tokyo colleague values group harmony over the technical perfection of the design, my advice on Case 2 and 3 might be culturally tone-deaf, even if it feels right to you as a British engineer. I have also assumed the "Recruiter" interaction is purely adversarial; if you view the market as a long-term network where reputation for honesty matters more than short-term leverage, Clause 2 might mislead you there.

  In short: this principle works for a team that wants to win. If the team prioritises staying friends over shipping code, the calibration changes.
