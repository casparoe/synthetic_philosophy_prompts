  ### The Map of Uncertain Evidence

  **Q1. The Certainty Constraint**
  Does every rational learning event culminate in you becoming certain ($P=1$) of *some* proposition (even if only "the detector clicked" or "I had this experience")?
  *   **YES** $\rightarrow$ Go to **Q2**.
  *   **NO** $\rightarrow$ Go to **Q3**. *(You are now a Radical Probabilist.)*

  **Q2. The Location of Certainty** *(Only if Q1=YES)*
  Is the proposition you become certain of an external report (e.g., "Detector readout = X") rather than an internal mental state?
  *   **YES** $\rightarrow$ **Leaf 1: Standard Conditionalization (Externalist)**.
  *   **NO** $\rightarrow$ **Leaf 1: Standard Conditionalization (Phenomenalist)**.
      *   *[**NOTE:** These two leaves are **operationally identical** for a Bayesian. Both update via $P_{new}(H) = P_{old}(H|E)$ where $P_{new}(E)=1$. The distinction is purely philosophical (what counts as $E$). **Leaf 1** includes the "Condition on Report" move (Lewis) and the "Expanded Space" move (modeling noise until the noise event is certain).]*

  **Q3. The Modelability Constraint** *(Only if Q1=NO)*
  Could the uncertainty be eliminated in principle by expanding your hypothesis space to include the noise process (e.g., treating the detector reliability as a variable)?
  *   **YES** $\rightarrow$ **Leaf 1** *(See above. You reduce uncertain evidence to certain evidence by modeling the causal chain.)*
  *   **NO** $\rightarrow$ Go to **Q4**. *(You believe uncertainty is ineliminable.)*

  **Q4. The Universality Constraint**
  Is there a single, context-independent formal rule that governs all such uncertain updates?
  *   **YES** $\rightarrow$ Go to **Q5**.
  *   **NO** $\rightarrow$ **Leaf 2: Particularism / "Malformed Question"**.
      *   *[**NOTE:** This position holds that the search for "The Rule" is malformed. Updating depends on the specific causal story of how the evidence was obtained (e.g., perception vs. testimony). No universal formula exists.]*

  **Q5. The Rigidity Constraint**
  Does the rule require that conditional probabilities on the evidence partition remain invariant? (i.e., $P_{new}(H|E_i) = P_{old}(H|E_i)$)
  *   **YES** $\rightarrow$ Go to **Q6**. *(This is the Jeffrey family.)*
  *   **NO** $\rightarrow$ **Leaf 3: Non-Jeffrey Radical Probabilism**.
      *   *[**NOTE:** Positions that allow uncertain evidence but reject Jeffrey's "rigidity" assumption. Often involves likelihood ratios or alternative distance minimization (e.g., Hellman, Diaconis). Rarely occupied as a stable long-term view.]*

  **Q6. The Commutativity Constraint** *(Your Snag)*
  Must the rule guarantee that sequential updates commute? (i.e., Updating on Report A then B must yield the same result as B then A).
  *   **YES** $\rightarrow$ **Leaf 4: Commutative Generalizations (e.g., Field)**.
      *   *[**NOTE:** Modifies Jeffrey's rule (often by dropping rigidity) specifically to restore order-independence.]*
  *   **NO** $\rightarrow$ **Leaf 5: Classic Jeffrey Conditionalization**.
      *   *[**NOTE:** Accepts Richard Jeffrey's original partition re-weighting. Accepts order-dependence as the cost of doing business with uncertain evidence. This is the position you found.]*

