answer: |-
  Your intuition that there is something clever here is correct, but your worry that it belongs in a thought experiment rather than a broke co-op is also correct. Dana is describing a simplified version of a governance model called futarchy, which uses prediction markets to decide policy based on expected outcomes, and while it is a fascinating intellectual framework, it is almost certainly the wrong tool for your specific situation. The core insight, that you should separate values from facts, is genuinely useful and might be the only way to break your deadlock, but the mechanism of using a betting market to resolve the facts is likely to create more problems than it solves given your size, financial state, and legal exposure.

  The first and most immediate breakdown point is liquidity and scale. For a prediction market to produce a reliable signal, you need enough money on the line that informed participants can outweigh noise or emotional betting. With four hundred members who are already financially strained enough that an eight percent price hike is a major board-level crisis, you are not going to have the capital depth to make the market efficient. If the total pool of bettable money is small, a single wealthy member or a small coalition can dominate the market not because they know the truth, but because they have the deepest pockets. This turns the decision from a search for truth into a contest of who can afford to risk the most cash, which undermines the legitimacy of the outcome. If the market says cut staff hours because three wealthy members bet heavily on it, the rest of the board will not see that as data, they will see it as a power play, and the personal tensions you are already experiencing will worsen.

  Then there is the question of who is allowed to bet, and your worry about the landlord is spot on. In a robust prediction market, outside participation is often welcomed because it brings in outside information, but in a small closed system like yours, outside money is purely manipulative. If your landlord can bet on the outcome that benefits them, they are not predicting the future, they are purchasing it. To prevent this, you would have to restrict betting to member-owners, but as noted above, that cripples your liquidity. Furthermore, even within the membership, you face the problem of participants betting to make their prediction come true rather than betting on what they think will happen. In large markets, this is hard to do because one person cannot sway the whole system, but in a co-op of this size, a board member who bets on cutting hours could subsequently sabotage the price increase option to ensure their bet wins. This creates a perverse incentive where the people responsible for implementing the decision are financially incentivized to ensure the alternative fails, which is toxic for a volunteer board that needs to work together.

  You are also right to be nagged by the values question. A prediction market can only optimize the specific metric you give it, it cannot optimize the spirit of your mission. You mentioned the goal is to stay open in five years with roughly the same members, but you cannot run a market on a five-year horizon because bets need to settle much sooner to inform immediate decisions. You would need a proxy metric, like membership retention after one year or quarterly profit margins. The problem is that people are very good at gaming metrics. If the market is optimizing for headcount, members might recruit passive owners who never shop just to boost the numbers. If it is optimizing for cash flow, they might defer necessary maintenance to make the books look good temporarily. Dana's proposal assumes that the metric equals the value, but in practice, optimizing the number often comes at the expense of the value. This does make the proposal less radical than she thinks, because it surrenders the nuance of your mission to a simplified number that the market can digest.

  There is also a boring but critical legal hurdle you cannot ignore. Depending on your jurisdiction, setting up a market where members put money down on organizational outcomes could be classified as gambling or even an unregistered securities offering. For a co-op that is always broke, the legal fees to structure this correctly would likely exceed the rent increase you are trying to solve for, and if you do it informally, you expose the board and the organization to liability if someone loses their money and gets angry. The complexity of administering the market, holding the funds, defining the resolution criteria, and paying out the winners requires administrative bandwidth that you likely do not have.

  However, just because the market mechanism is a bad fit does not mean Dana's underlying diagnosis is wrong. Your board is stuck because you are conflating preferences with predictions. When someone argues for cutting hours, you do not know if they believe it is the only way to survive or if they just hate the deli counter. The cheaper and safer fix is to adopt the separation of values and facts without the betting. You can do this by bringing in a neutral third party, like a co-op consultant or an accountant who specializes in retail food, to model the two scenarios. Pay them to give you a written projection of where each option leads in terms of membership and solvency. This gives you the factual ground you are missing without the risk of a gambling ring. Once you have that expert analysis, you can vote on the values. If the expert says both options lead to failure, then you know you need a third option. If the expert says one option clearly preserves membership better, then the factual debate is over and you only vote on whether you trust the expert.

  If you cannot afford a consultant, you can simulate the market insight using a deliberative polling method. Have board members write down their prediction for each option anonymously, along with a confidence level, before you argue about them. This often reveals that everyone actually agrees on the facts but disagrees on the risk tolerance. Sometimes the deadlock is not about what will happen, but about who bears the pain. The price increase hurts low-income members, while cutting hours hurts staff. A market does not solve that ethical distribution problem, it just hides it behind a number. You need to have the hard conversation about who you are willing to burden to save the co-op, and no amount of betting will make that conversation easier.

  So my straight read is that you should thank Dana for highlighting the distinction between facts and values, but vote down the prediction market mechanism. It is too fragile for your size, too risky for your legal standing, and too easy to manipulate in a small community. Instead, propose that you spend the next meeting defining the success metrics clearly and agreeing to seek external expert advice to forecast the outcomes of each option. Use democracy to pick the goal, use expertise to pick the means, and save the skin in the game for where it belongs, which is in the shared risk of ownership you all already have. You are already owners putting your community's future on the line, and that is enough skin in the game to motivate you to find the truth without needing to wager cash on it.
