prompt: |-
  Okay so everyone in climate ethics keeps leaning on the debt/borrowing analogy: we're "borrowing the planet from our children," running up a bill they'll have to pay, and the social discount rate is basically the interest rate on that loan. The thing is I keep seeing it dragged out to justify both aggressive mitigation and aggressive discounting, which can't both be right. Can you actually audit it? Lay out what maps onto what -- creditor, debtor, principal, interest, default, repayment -- then tell me where the mapping breaks (I suspect future people cant really be creditors at all if they can't consent or refuse, and there's no currency they can be repaid in), which of those breaks actually matter for how the analogy gets used in arguments, and whether the conclusions people draw from it survive once the disanalogies are on the table. If there's a better analogy for the intergenerational case, tell me what it is. American English please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Climate Ethics and the Debt/Borrowing Analogy ("borrowing from our children").
      *   **Problem:** The user observes the analogy is used to justify *both* aggressive mitigation (we owe them) and aggressive discounting (future costs matter less), which seems contradictory.
      *   **Task:**
          1.  Audit the analogy (map creditor, debtor, principal, interest, default, repayment).
          2.  Identify where the mapping breaks (specifically mentioning consent and currency).
          3.  Evaluate which breaks matter for the arguments made.
          4.  Determine if the conclusions survive the disanalogies.
          5.  Propose a better analogy if available.
      *   **Tone/Style:** American English, analytical, critical, clear.

  2.  **Deconstruct the Debt Analogy (The Audit):**
      *   *Debtor:* Current generation.
      *   *Creditor:* Future generations.
      *   *Principal:* Stable climate/ecosystem services/capital.
      *   *Interest:* Compounding damages/loss of adaptive capacity.
      *   *Repayment:* Mitigation costs/transition to green tech.
      *   *Default:* Climate catastrophe/tipping points.
      *   *Currency:* Well-being, resources, livability.

  3.  **Identify the Breaks (Disanalogies):**
      *   *Consent/Contract:* Future people didn't agree to lend anything. You can't borrow from someone who doesn't exist.
      *   *Reciprocity:* In normal debt, the creditor gets paid back *more* (principal + interest). In climate, "repayment" just means *not ruining their stuff*. They don't gain; they just avoid loss.
      *   *Currency/Transfer:* You can't wire "livability" to the future. You can only preserve conditions.
      *   *Identity/Existence:* Mitigation policies change *who* gets born (Non-Identity Problem). If we save the planet, different people exist than if we trash it. Can you owe money to people who wouldn't exist otherwise?
      *   *Discounting:* Financial debt implies interest accumulates. But economic discounting says future value is worth less *now*. The analogy fights itself here.

  4.  **Evaluate the Impact on Arguments:**
      *   *Aggressive Mitigation:* The analogy works okay here emotionally ("don't steal from kids"), but logically it's shaky due to the Non-Identity Problem. However, the *harm* principle survives even if the *debt* principle doesn't.
      *   *Aggressive Discounting:* This is where the analogy fails hardest. If it's a debt, you pay it back with interest. Discounting says "future pain is worth less." You can't use a debt analogy to justify discounting the value of the repayment. That's like saying "I owe you $100, but since you're unborn, it's only worth $5 to me."
      *   *Contradiction:* The user is right. You can't use the moral weight of debt to demand action *and* use financial logic to discount the value of that action.

  5.  **Assess Survival of Conclusions:**
      *   Does the obligation survive without the debt metaphor? Yes, based on harm prevention and stewardship, not contract.
      *   Does the discounting justification survive? No, not if based on this analogy. Discounting needs other grounds (pure time preference vs. opportunity cost), but using "debt" to justify low valuation of future welfare is incoherent.

  6.  **Find a Better Analogy:**
      *   *Trusteeship/Stewardship:* Managing an estate for beneficiaries who can't manage it yet.
      *   *Relay Race:* Passing the baton.
      *   *Lifeboat:* Shared survival.
      *   *Best Fit:* **The Trust Fund / Fiduciary Duty.** It handles the "no consent" issue (beneficiaries don't consent to trusts), the "currency" issue (preserving capital), and the "non-identity" issue (duty attaches to the role, not the specific individual).

  7.  **Drafting the Response (Iterative refinement for American English and tone):**
      *   *Intro:* Acknowledge the user's sharp observation. It's a "franken-analogy."
      *   *Section 1: The Audit.* Create a clear table or list mapping the terms.
      *   *Section 2: The Breaks.* Focus on Consent, Currency, and the Non-Identity Problem.
      *   *Section 3: The Contradiction.* Address the mitigation vs. discounting clash. This is the core of the user's prompt.
      *   *Section 4: Do Conclusions Survive?* Separate the moral obligation (yes) from the economic calculus (no).
      *   *Section 5: Better Analogy.* Propose the Fiduciary/Trust model.
      *   *Conclusion:* Summarize.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I explain *why* discounting contradicts the debt analogy? *Correction:* Make sure to distinguish between *social discount rate* (economic tool) and *moral debt* (ethical claim). The analogy conflates them.
      *   *Check:* Is the Non-Identity Problem explained simply? *Correction:* Keep it brief: "Different policies create different people."
      *   *Check:* American English. *Correction:* Use "livability," "favor," "check," instead of British idioms. Ensure spelling (behavior vs behaviour).
      *   *Check:* User suspicion. *Correction:* Validate their suspicion about consent and currency explicitly.

  9.  **Final Polish:** Ensure the structure is logical and the headings are clear. (Proceeds to generate output based on these steps.)
answer: |-
  You have spotted a massive crack in the foundation of climate economics. You are absolutely right: the debt analogy is being asked to do contradictory work. It is used to invoke a moral imperative (pay your debts!) while simultaneously being used to justify economic mechanisms that devalue that very debt (discounting).

  Here is the audit of the "Intergenerational Debt" analogy, where it breaks, and what survives the wreckage.

  ### 1. The Audit: Mapping the Analogy

  To see where the logic fails, we first have to see how proponents map the financial terms onto the climate crisis.

  | Financial Term | Climate Ethics Mapping | Intended Function |
  | :--- | :--- | :--- |
  | **Debtor** | Current Generation | Bears the responsibility to act. |
  | **Creditor** | Future Generations | Holds the claim to a stable climate. |
  | **Principal** | Planetary Stability / Natural Capital | The asset being "borrowed" against. |
  | **Interest** | Compounding Climate Damages | The cost of delay; damages grow over time. |
  | **Repayment** | Mitigation Costs (Decarbonization) | The sacrifice made now to preserve the principal. |
  | **Default** | Tipping Points / Catastrophe | Failure to repay results in systemic collapse. |
  | **Currency** | Welfare / Livability / Resources | The medium of exchange. |

  ### 2. Where the Mapping Breaks

  You suspected future people can't be creditors because they can't consent. That is the biggest break, but there are three others that dismantle the logic.

  **A. The Consent Break (The "Unborn Creditor" Problem)**
  In a loan, the creditor voluntarily lends capital expecting a return. Future people did not lend us a stable climate; they simply inherit the consequences of our actions.
  *   **Why it matters:** Debt implies a contract. Without consent, there is no contract. If there is no contract, the obligation isn't *debt*; it's something else (like tort law or stewardship). Using "debt" implies a transactional relationship that never happened.

  **B. The Currency Break (The "Repayment" Problem)**
  When you repay a loan, the creditor ends up *better* off (or at least whole) than before the loan. In climate mitigation, "repayment" doesn't give future people a bonus; it just prevents them from being dead or destitute.
  *   **Why it matters:** We aren't transferring wealth to them; we are refraining from destroying their wealth. You cannot "repay" someone by not punching them in the face. The analogy conflates *compensation* with *non-maleficence* (do no harm).

  **C. The Identity Break (The Non-Identity Problem)**
  This is the nuclear option in philosophy. Our climate policies change the economy, which changes who meets whom, which changes who gets born. The people living in 2100 under a "high mitigation" scenario will be *different specific individuals* than those living under a "low mitigation" scenario.
  *   **Why it matters:** You cannot owe a debt to specific people who would not exist if you had paid the debt. If we sacrifice heavily to save the climate, we change the future population. Can we owe money to people whose existence depends on us *not* owing that money?

  ### 3. The Contradiction: Mitigation vs. Discounting

  This is the specific contradiction you noticed. The analogy is being ridden in two directions at once.

  **Direction A: Aggressive Mitigation (The Moral Lever)**
  *   **Argument:** "We are stealing from our children. We must pay the debt."
  *   **Logic:** Debt is morally binding. Default is immoral.
  *   **Use:** Used to shame current populations into accepting high costs now.

  **Direction B: Aggressive Discounting (The Economic Lever)**
  *   **Argument:** "Future costs are worth less today. We apply a social discount rate."
  *   **Logic:** A dollar of damage in 2100 is worth pennies today.
  *   **Use:** Used to justify *lower* mitigation targets because the "present value" of future suffering is low.

  **The Break:**
  You cannot use the debt analogy to justify Direction A and then switch to financial math to justify Direction B.
  *   If it is a **moral debt**, the face value is absolute. You owe the full amount regardless of time preference.
  *   If it is a **financial instrument**, it is subject to discount rates. But if you discount it heavily, the "debt" becomes negligible, undermining the moral imperative in Direction A.

  Economists like William Nordhaus use the discount rate to say, "The debt is real, but it's not worth paying off fully right now because the interest rate (discount rate) says future pain is cheap." Ethicists use the debt metaphor to say, "The debt is sacred." **They cannot both be right.** If the social discount rate is high, the "debt" is effectively forgiven by inflation. If the debt is moral, the discount rate should be near zero.

  ### 4. Do the Conclusions Survive?

  **Does the obligation to mitigate survive?**
  **Yes.** Even if the debt analogy collapses, the obligation remains under different frameworks.
  *   **Harm Principle:** We are actively harming them, regardless of whether they "lent" us anything.
  *   **Stewardship:** We are the current managers of a system we didn't build and can't replace.
  *   **Survival:** It is in our own genetic/evolutionary interest to ensure the species continues.
  *   *Verdict:* The conclusion (we must act) holds, but the *reason* (we owe a debt) is false.

  **Does the justification for discounting survive?**
  **No, not if based on this analogy.**
  If you claim we are "borrowing from the future," you implicitly acknowledge the future has a claim on the present equal to the present's claim on itself. High discounting denies that claim.
  *   *Verdict:* Using the debt analogy to justify high discounting is incoherent. It's like saying, "I owe you $1,000, but since you won't be born for 50 years, I'm only going to give you $5." That isn't debt repayment; that's fraud.

  ### 5. A Better Analogy: The Fiduciary Trust

  The "Debt" analogy is transactional. The climate crisis is custodial. A better fit is the **Fiduciary Trust**.

  *   **The Setup:** A Trustee (Current Gen) manages assets for Beneficiaries (Future Gen).
  *   **Consent:** Beneficiaries do not need to consent to the trust; it is established by law or morality.
  *   **Currency:** The Trustee must preserve the *capital* (the climate system), not just pay out interest.
  *   **Identity:** The duty is to the *class* of beneficiaries (future humans), not specific individuals. It doesn't matter exactly *who* is born, only that the conditions for human life are preserved for whoever shows up.
  *   **Discounting:** A fiduciary cannot legally discount the value of the beneficiary's future interest to benefit themselves today. That is self-dealing and is forbidden.

  **Why this works better:**
  1.  **Solves Consent:** You don't ask the baby if they want the inheritance; you manage it for them regardless.
  2.  **Solves Currency:** You aren't "paying them back"; you are "preserving the estate."
  3.  **Kills Bad Discounting:** A trustee cannot gamble the principal for short-term gain. This aligns with the "Precautionary Principle" rather than Cost-Benefit Analysis.

  ### Summary

  The "borrowing from our children" analogy is a zombie metaphor. It refuses to die because it sounds good in speeches, but it is logically decomposing.

  1.  **The Audit:** It maps poorly because there is no contract, no currency transfer, and the creditors don't exist.
  2.  **The Contradiction:** You cannot use it to demand moral sacrifice (mitigation) and then use financial logic to minimize that sacrifice (discounting).
  3.  **The Survivors:** The duty to act survives, but it rests on harm prevention and stewardship, not debt repayment.
  4.  **The Fix:** Switch to the **Fiduciary/Trust** model. It captures the obligation without the false promise of a transactional repayment, and it blocks the economic maneuvering used to discount the value of future lives.

  You are right to be skeptical. When an analogy is used to prove $X$ and not-$X$ simultaneously, it isn't an argument; it's a rhetorical shield.
