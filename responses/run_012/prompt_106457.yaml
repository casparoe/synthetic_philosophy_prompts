answer: |-
  You are describing the central, agonizing problem of poetry translation, and you are right to feel that the standard labels don't quite stick. "Dynamic equivalence" is too theological/functionalist, and "compensation" usually implies making up for a deficit elsewhere rather than engineering a structural swap in situ.

  Here is the terminology, the concept, and the boundary line you are looking for.

  ### 1. The Name: "Equivalence of Effect" (or Functional Substitution)
  The most precise academic term for what you are doing comes from translation theorist Werner Koller. He distinguishes between *formal equivalence* (matching the form) and **equivalence of effect** (matching the impact on the reader).

  However, in the workshop vernacular of practicing poets, this is often called finding a **Poetic Analogue** or **Functional Substitution**.

  *   **Why it fits:** You aren't trying to match the *letters* (formal); you aren't just trying to match the *meaning* (semantic); you are trying to match the *work the device is doing* (functional).
  *   **Why it's not "Compensation":** Compensation is usually reactive ("I lost the alliteration in line 1, so I'll add some in line 3"). What you are describing is proactive structural engineering ("This device creates friction here; I need a different device to create friction here").
  *   **Why it's not "Paraphrase":** Paraphrase sacrifices the poetic function to preserve the semantic content. You are sacrificing the specific poetic *mechanism* to preserve the poetic *function*.

  ### 2. The Concept: Preserving "Defamiliarization"
  You asked what exactly the move is. The move is preserving **Defamiliarization** (or *Ostranenie*, from the Russian Formalists).

  Poetry works by making language strange, forcing the reader to slow down and perceive the word as an object, not just a window to meaning.
  *   **In your Latin example:** The minimal pair (e.g., *rosa* vs. *rasa*) creates a stumble. It makes the reader look at the words.
  *   **In your English solution:** The rhyme creates a chime. It makes the reader look at the words.

  The mechanism is different (orthography vs. phonology), but the **aesthetic load** is identical. You are translating the *experience of reading*, not just the text. This is why it is translation and not adaptation: you remain faithful to the *poem's behavior*, even if you must be unfaithful to the *poem's blueprint*.

  ### 3. The Boundary: Translation vs. Adaptation
  Where does it stop being translation? This is the hardest line to draw, but the consensus among practitioner-translators (like Robert Pinsky or Seamus Heaney) is this:

  **It remains translation as long as the semantic core is not bent to serve the new device.**

  *   **Translation:** You find a rhyme that highlights the *existing* meaning of the words. (The engineering serves the text).
  *   **Adaptation/Imitation:** You change the meaning of the words to make the rhyme work. (The text serves the engineering).

  In your hexameter example: Moving to pentameter is translation because English pentameter carries the same "high style" weight as Latin hexameter. If you moved to limerick meter, you would be changing the *tone* of the poem, which pushes it into adaptation. You are matching the **register** and the **prosodic weight**, which keeps it in the realm of translation.

  ### 4. The Invisibility: "Concealed Artifice"
  You asked if the invisibility of the effort is part of the same phenomenon. **Yes, absolutely.**

  This is the paradox of high-level translation: **The more engineering goes in, the more natural it must look.**

  In translation studies, this is often discussed under the umbrella of **Fluency** or **Naturalization** (though Lawrence Venuti critiques this as "domestication"). But from the craft perspective, it is **Concealed Artifice**.

  *   If the reader sees the gears turning (i.e., "Oh, he forced this rhyme to match that Latin pun"), the translation has failed.
  *   If the reader feels the *effect* of the pun (the pause, the focus) without noticing the rhyme was engineered to create it, the translation has succeeded.

  This is the same principle that governs original poetry. A sonnet that sounds like a casual conversation has required more engineering than a sonnet that sounds like a sonnet. In your case, the "invisibility" is the proof that the **Equivalence of Effect** was successful. You haven't just described the effect; you have recreated the conditions for it.

  ### Summary
  *   **The Term:** **Equivalence of Effect** (Koller) or **Functional Substitution**.
  *   **The Move:** Preserving the **Defamiliarization** (the "stop and look" moment) rather than the specific mechanism.
  *   **The Boundary:** It is translation as long as the new device serves the original meaning; it becomes adaptation if the meaning is altered to serve the new device.
  *   **The Invisibility:** This is **Concealed Artifice**. It is the hallmark of the move working correctly. If the engineering shows, the equivalence of effect has failed.

  You are effectively proving Robert Frost wrong ("Poetry is what gets lost in translation"). You are demonstrating that poetry is what *survives* in translation, provided you are willing to rebuild the engine rather than just polish the bodywork.
