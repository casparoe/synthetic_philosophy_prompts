answer: |-
  Here is the breakdown of the slogan **"You can't be responsible for who you are, because you'd have to have made yourself, and nobody made themselves."**

  This slogan is a compressed version of Galen Strawson's "Basic Argument," but as you suspected, it conflates several distinct logical moves. Below is the menu of readings, their truth values, and how they function in your friend's argument.

  ### 1. The Causal Origin Claim
  *   **The Assertion:** You did not choose your starting conditions (genes, parents, era, early environment). Since your current self is built from these materials, you are not the ultimate source of your current self.
  *   **Truth Verdict:** **Trivially True.** No one chooses their birth or genetic makeup.
  *   **Does it kill blame?** **No.** This is the "true but harmless" reading. Ordinary responsibility doesn't require you to have created your raw materials; it only requires that you can *manage* those materials rationally. A car isn't responsible for the factory it was built in, but it is responsible for where it drives if it has a working steering wheel.
  *   **Friend's Usage:** Your friend likely starts here because it's undeniable. But this claim alone only proves you aren't *ultimately* responsible, not that you aren't *practically* responsible.

  ### 2. The Regress Claim (Strawson's Core)
  *   **The Assertion:** To be responsible for an action, you must be responsible for the mental state (character/motivation) that caused it. To be responsible for *that* mental state, you must have chosen it based on a *prior* mental state. This creates an infinite chain. Since you cannot complete an infinite chain of choices, you can never be responsible for the current one.
  *   **Truth Verdict:** **Genuinely Contentious.** It is logically valid *if* you accept the premise that responsibility requires responsibility for the source. Compatibilists reject this premise, arguing you only need to be responsible for the action *given* your character, not responsible *for* the character itself.
  *   **Does it kill blame?** **Yes, but only "Basic" Blame.** It destroys the idea of "Ultimate Responsibility" (being the unmoved mover), but leaves "Attributability" (the action reflects who you are) intact.
  *   **Friend's Usage:** This is the engine of the argument. If your friend accepts this, he is arguing that unless you chose your own nature, your actions are just the output of a machine you didn't build.

  ### 3. The Metaphysical Impossibility Claim (*Causa Sui*)
  *   **The Assertion:** To "make yourself" in the way required for true responsibility, you would have to exist *before* you existed in order to choose your own nature. This is logically incoherent (like pulling yourself up by your bootstraps).
  *   **Truth Verdict:** **Trivially True.** Self-creation is logically impossible.
  *   **Does it kill blame?** **Only if blame requires self-creation.** This is the pivot point. If responsibility requires logical impossibility, then responsibility is impossible. But most philosophers argue responsibility requires *control*, not *self-creation*.
  *   **Friend's Usage:** This is the mic-drop moment. It sounds like a knockout punch ("It's logically impossible!"), but it only knocks out a definition of responsibility that almost nobody actually uses in daily life.

  ### 4. The Indeterminism Compatibility Claim
  *   **The Assertion:** This argument does not rely on determinism. Even if your choices are random/uncaused (indeterminism), you still didn't "make yourself." If a choice pops into your head without a cause, it's just luck, not control. If it *does* have a cause, we go back to the Regress Claim.
  *   **Truth Verdict:** **Strong/Robust.** This is Strawson's specific contribution. It blocks the escape route of "But I could have done otherwise!"
  *   **Why it matters:** It shows that "You didn't make yourself" isn't just about physics/causation; it's about *ownership*. Randomness doesn't give you ownership any more than causation does.
  *   **Friend's Usage:** If your friend knows this, he's smarter than average. It means he can't be countered by saying "But quantum physics says we have free will!" The argument survives that.

  ---

  ### The Verdict on Your Friend's Move

  **Which reading gets him to "He's not to blame *at all*"?**
  He needs a combination of **Reading 3 (Metaphysical Impossibility)** and **Reading 2 (The Regress)**.
  He is arguing that because self-creation is impossible (3), and responsibility requires self-creation (via the Regress in 2), responsibility is impossible.

  **Is he sliding between readings?**
  **Yes.** This is the critical failure in his argument.
  1.  He uses **Reading 1 (Causal Origin)** to get your agreement ("Obviously he didn't choose his abusive childhood").
  2.  He treats that as proof of **Reading 3 (Metaphysical Impossibility)** ("Therefore he couldn't have made himself").
  3.  He concludes with **Reading 2's consequence** ("Therefore he bears no blame").

  **The Slide:** He moves from "He didn't choose his start" (True) to "He lacks the control necessary for blame" (False/Contentious). Most legal and moral systems assign blame based on *current capacity* (could he understand right from wrong *now*?), not *historical origin* (did he build his own brain *then*?).

  ### The "True But Harmless" Reading
  You bet correctly. **Reading 1 (The Causal Origin Claim)** is the "true but harmless" version.
  *   **True:** Nobody made themselves.
  *   **Harmless:** It doesn't stop us from blaming people for actions they knowingly committed. We blame people for being who they are *when who they are causes harm*.
  *   **Why it matters:** If you accept this reading, you admit we aren't "Gods" with ultimate control, but you retain the ability to hold people accountable for safety, justice, and social coordination.

  ### Summary for the Argument
  If you want to push back, don't fight the "nobody made themselves" point. Agree with it. Instead, attack the link between **making yourself** and **being blameworthy**.

  **Say this:**
  > "I agree nobody made themselves. That's logically impossible. But blame isn't about being the *ultimate creator* of your soul; it's about being the *current operator* of your actions. If I drive a car I didn't build and crash it because I was texting, I'm still to blame. I didn't make the car, but I'm steering it. Your friend didn't make his brain, but he was steering it when he did that awful thing. 'Not making yourself' only matters if you think we need to be Gods to be responsible."
