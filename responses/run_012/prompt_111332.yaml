answer: |-
  ### Final Examination: Philosophy of Mind (PHIL 400)

  **Time Allowed:** 3 Hours
  **Instructions:** Answer the following question. Your response should be approximately 1,500 words. You are expected to engage directly with the text provided and demonstrate a command of Dennett's arguments in *Real Patterns* (1991). Do not simply summarize the three stances; you must commit to a position and defend it.

  **Case Study: The Chooser**
  > A laboratory has built a device — call it the Chooser — that plays a simple repeated game against a human opponent. Its only input is the last three moves of the game. It has no model of the opponent, no memory beyond a three-move buffer, and no internal component that could plausibly be described as representing anything about the opponent's intentions. Its behaviour, however, is predicted with near-perfect accuracy, and by a description far shorter than any physical-stance or design-stance description of comparable accuracy, if we attribute to it the belief that the opponent will repeat a losing move and the desire to exploit that tendency. A second attribution — that the Chooser believes the opponent is bluffing and desires to call the bluff — predicts equally well and is equally short, and the two attributions are incompatible with one another. The Chooser was assembled by an engineer who had no interest in the game and built it to pass a hardware test; no one ever intended it to play well.

  **Essay Question**
  Dennett argues that beliefs are real if they constitute "real patterns" identifiable via data compression, yet he also maintains that the physical stance is the most accurate description "in principle." Using the case of the Chooser:
  1.  Argue whether the compression criterion entitles Dennett to call the Chooser's attributed beliefs real, given the availability of two mutually incompatible but equally compressive attributions.
  2.  Explain whether this conclusion can be reconciled with the claim that the physical stance is most accurate in principle.
  3.  Conclude what this case demonstrates about the ontological status of real patterns: are they independent of any stance, or relative to a descriptive vocabulary and prediction task?

  ***

  ### Model Answer

  Dennett's commitments regarding the Chooser are compatible, but maintaining them requires accepting that "real patterns" are stance-relative rather than stance-independent. The existence of incompatible intentional attributions does not refute the reality of the patterns; rather, it clarifies that pattern reality is a function of predictive utility within a vocabulary, not a mirror of intrinsic inner states.

  Regarding the first task, the compression criterion does entitle Dennett to call the Chooser's beliefs real, despite the indeterminacy. In *Real Patterns*, Dennett argues that a pattern is real if there is a description that allows a predictor to compress data about a system's behavior better than raw physical data. The Chooser case presents a tie: two incompatible intentional stances yield identical compression ratios. A critic might argue this indeterminacy proves the beliefs are fictitious. However, Dennett's realism is not about unique correspondence to internal machinery. The physical substrate of the Chooser is deterministic, but it is noisy and complex. The intentional stance identifies a higher-order regularity within that noise. The fact that two vocabularies ("exploiting tendency" vs. "calling bluff") capture this regularity equally well shows that the *pattern* of behavior is real, even if the specific intentional gloss is underdetermined. The reality lies in the predictability gained, not in the uniqueness of the attribution. To deny the reality of these patterns because they are indeterminate is to demand a "God's eye view" of content that Dennett explicitly rejects.

  This leads to the second task: reconciling this with the physical stance's accuracy "in principle." Dennett claims the physical stance is most accurate because, given perfect knowledge of physics and infinite computing power, one could predict the system without error. The intentional stance, by contrast, is lossy; it ignores physical noise to highlight behavioral trends. This does not create an ontological conflict. The physical stance's "in principle" accuracy is a claim about causal closure and entailment, not a ranking of degrees of reality. The physical facts entail the behavioral patterns, but describing the system physically is often pragmatically impossible due to complexity. The intentional patterns are real abstractions *supervening* on the physical facts. The Chooser's silicon gates physically cause the moves, but the "belief" describes the structural relationship between inputs and outputs that makes prediction tractable. We can hold both commitments by viewing the physical stance as the foundation of causal power and the intentional stance as the identification of objective, higher-order regularities within that causal web. One describes the substrate; the other describes the signal.

  Finally, this case demonstrates that real patterns are relative to a descriptive vocabulary and a prediction task, not independent of any stance. If patterns were stance-independent, there would be a single true description of the Chooser's "mind." The Chooser case proves there is not. The engineer's lack of intent is crucial here; it severs the link between content and designer history, forcing us to rely solely on current predictive utility. The patterns are objective in the sense that any predictor using that vocabulary will find them, but they are not intrinsic properties of the Chooser like mass or voltage. They are relational properties emerging from the interaction between the system's structure and the predictor's interests.

  The price of this reconciliation is abandoning the intuition that reality requires stance-independence. We must accept that the Chooser really has beliefs, but that "having beliefs" is not a matter of housing a specific internal sentence. It is a matter of being a system whose behavior is best captured by intentional vocabulary. The rival attributions do not cancel each other out; they reveal that the intentional realm is coarse-grained. By accepting stance-relativity, we preserve the reality of the pattern (it is not a fiction) while acknowledging the supremacy of the physical stance in terms of causal completeness. The Chooser is a physical object that instantiates multiple, equally valid intentional patterns.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **Part 1: Compression and Indeterminacy (6 Marks)**
  *   **2 marks:** Identifies that the compression criterion relies on predictive utility, not unique correspondence to internal states.
  *   **2 marks:** Argues that rival attributions do not refute the criterion (indeterminacy $\neq$ unreality).
  *   **2 marks:** Explicitly commits to the beliefs being "real" despite the tie.

  **Part 2: The Physical Stance Claim (6 Marks)**
  *   **2 marks:** Interprets "in principle accuracy" as a claim about entailment/causal closure, not ontological superiority.
  *   **2 marks:** Explains how physical accuracy and intentional reality coexist (e.g., substrate vs. signal, or different resolutions).
  *   **2 marks:** Avoids the error of claiming physical accuracy makes intentional patterns "less real."

  **Part 3: Ontological Status (5 Marks)**
  *   **2 marks:** Concludes that patterns are stance-relative (relative to vocabulary/task).
  *   **2 marks:** Utilizes the engineer's lack of intent to support the independence from design history.
  *   **1 mark:** Clearly articulates the "price" paid (abandoning stance-independent realism).

  **Argumentation and Style (3 Marks)**
  *   **2 marks:** Maintains a definite position throughout without hedging.
  *   **1 mark:** Clarity, structure, and adherence to word count constraints.

  **Distinguishing an A (16-20) from a B (12-15)**
  To achieve an **A**, the candidate must:
  1.  Recognize the compression criterion is comparative and vocabulary-relative, not a correspondence test.
  2.  Distinguish the reality of a *pattern* from the reality of an *inner belief-state* (neurological vehicle).
  3.  Diagnose that "in principle" refers to ideal prediction/entailment, not a hierarchy of existence.
  4.  Notice that an equally good rival description does not by itself refute the criterion (it shows underdetermination, not fiction).
  5.  Engage the fact that the Chooser's rationale belongs to no one (engineer had no intent), isolating the Intentional Stance from the Design Stance.

  To receive a **B**, the candidate typically:
  1.  Correctly identifies the tension but resolves it by leaning too heavily on instrumentalism (treating beliefs as *mere* tools rather than real patterns).
  2.  Acknowledges the physical stance's accuracy but fails to explain *why* it doesn't eliminate intentional reality.
  3.  Discusses the rival attributions but treats them as a significant problem rather than a feature of coarse-graining.

  **Specific Mistakes (Deduct 2 marks per occurrence)**
  *   **Reciting the Stances:** Treating the prompt as an invitation to define Physical, Design, and Intentional stances generally.
  *   **Hierarchy of Reality:** Arguing that because the Physical Stance is more accurate, the intentional patterns are "less real" or "false."
  *   **Useful Fiction:** Describing the intentional attributions as "useful fictions" (Dennett insists they are *real* patterns).
  *   **Decisive Refutation:** Claiming the tie between rival attributions decisively refutes Dennett's realism.
  *   **Designer Intent:** Arguing the beliefs are unreal because the engineer didn't intend them (confusing Design and Intentional stances).
