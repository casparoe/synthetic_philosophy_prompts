answer: |-
  The Garrisonian verdict rests on a potent legal metaphor: the Constitution as a pro-slavery contract. To audit this analogy is not to dismiss it, but to test its structural integrity against the rules of contract law and the nature of constitutional governance. If the analogy holds, your friend is right: to swear an oath to the document is to become a guarantor of its debts, including the debt of human bondage. If the analogy breaks, the moral obligation shifts.

  Here is the audit of the contract picture, the points of failure, and the verdict on whether the metaphor or the history is doing the work.

  ### I. The Audit: Mapping the Contract

  To treat the Constitution as a contract in the private law sense, we must map the elements of formation and enforcement as your friend understands them.

  *   **The Parties:** The sovereign states (specifically the free states and the slave states) acting as corporate entities. The people are merely the constituents of these parties, not the parties themselves.
  *   **Offer and Acceptance:** The draft presented at Philadelphia (1787) is the offer; ratification by the state conventions is the acceptance.
  *   **Consideration:**
      *   *For Free States:* Security against foreign invasion, regulation of interstate commerce, a unified market.
      *   *For Slave States:* Protection of "property" in humans, political power via the Three-Fifths Clause, assurance of fugitive return, and a twenty-year shield for the Atlantic trade.
  *   **The Terms:** The specific clauses (Article I, Section 2; Article I, Section 9; Article IV, Section 2).
  *   **Breach:** Failure by the federal government or free states to enforce fugitive rendition; or conversely, abolitionist agitation interfering with the "property rights" guaranteed by the compact.
  *   **Remedy:** For Garrison, the remedy for breach (or for the immorality of the terms) is rescission: "No Union with Slaveholders." For the slaveholder, the remedy is specific performance (federal enforcement of slavery).
  *   **Interpretation:** The meaning is fixed by the mutual understanding of the parties at the time of signing (original intent).

  ### II. The Breaks: Where the Analogy Fails

  This mapping is coherent only if we ignore three fundamental disanalogies between private contracts and constitutional orders. Each break undermines your friend's conclusion.

  **1. The Status of the Enslaved: Object vs. Party**
  In contract law, a contract cannot bind a non-party. In the Garrisonian mapping, the enslaved are the *consideration* (the object of the bargain), not a *party* to it. They did not sign; they were not asked; they were legally defined as the thing being traded.
  *   **The Break:** If the enslaved are objects, the contract is a bill of sale for human beings. Under natural law (which abolitionists invoked), a contract for the sale of persons is void *ab initio* because its subject matter is illegal. You cannot contract away the liberty of a third party without their consent.
  *   **Why it Matters:** Your friend argues that upholding the Constitution makes one a party to the wrong. But if the contract is void regarding the enslaved, a moral agent is not bound to enforce a void clause. More importantly, if the Constitution claims to constitute "We the People," it implicitly claims to represent *all* inhabitants. By excluding the enslaved from party status while claiming to govern them, the document creates a contradiction. A contract that treats persons as things is not a valid contract; it is an act of violence. One is not complicit in the violence by rejecting the validity of the contract (Douglass's view); one is complicit only by enforcing the void terms (Garrison's fear).

  **2. Temporal Scope: Private Deal vs. Public Charter**
  Private contracts bind the signers and their heirs based on the intent at the moment of signing. Constitutions are designed to govern future generations who never consented to the original deal.
  *   **The Break:** A private contract's meaning is frozen by the "meeting of the minds" at formation. A Constitution contains an amendment mechanism (Article V) precisely because it acknowledges that the "parties" (the living citizens) change.
  *   **Why it Matters:** Your friend relies on the intention of the 1787 drafters to fix the meaning as pro-slavery. But a constitution is a framework for future self-governance, not a tomb for past intentions. If the text allows for amendment, the "contract" is not fixed. Douglass argued that the Constitution was a *glorious* document that could be wielded by future parties (the citizens of the 1850s) to undo the sins of the past parties (the founders). To treat it as a fixed private bargain denies the sovereign power of the living to alter their fundamental law.

  **3. Interpretation and Illegality: The Court vs. The Text**
  In contract law, if terms are ambiguous, courts look to the intent of the parties. If a contract contains illegal provisions, courts often sever the illegal terms rather than voiding the whole instrument, unless the illegal purpose is central.
  *   **The Break:** Your friend notes that the authoritative interpreters in the 1850s (e.g., Chief Justice Taney in *Dred Scott*) read the document as pro-slavery. In a private contract dispute, the court's reading is usually final.
  *   **Why it Matters:** This is the strongest point for your friend, *unless* the contract is unconscionable. If a contract violates public policy (liberty), the court's enforcement does not make it moral. Furthermore, Douglass's textualism argues that the *written terms* do not match the *secret intent*. In contract law, the "parol evidence rule" generally prohibits using outside evidence (secret intentions of drafters) to contradict the written text. If the text says "persons" and never "slaves," the written contract does not explicitly authorize slavery.
  *   **Severability:** If the bargain is partly illegal (slavery), does the whole Union fall? Garrison said yes (rescission). Douglass said no (severance). In law, if a contract has an illegal clause, that clause is often stricken while the rest remains enforceable. Douglass's position is legally more sound: strike the pro-slavery construction, keep the Union.

  ### III. Douglass's Counter-Move within the Analogy

  Douglass's argument is not sentimental; it is a strict constructionist argument that actually fits the *contract* analogy better than Garrison's does.

  *   **Textualism:** Douglass insisted that the words "slave" and "slavery" appear nowhere. In contract interpretation, the plain meaning of the text controls over the subjective intent of the drafters. If the contract speaks of "persons held to service," that is ambiguous. If it speaks of "We the People," that implies universal personhood.
  *   **The Preamble as Purpose:** The Preamble sets the "purpose" of the contract: "secure the Blessings of Liberty." In contract law, specific clauses are read in light of the general purpose. A clause allowing temporary importation of persons (Atlantic trade) contradicts the purpose of Liberty; therefore, it must be read restrictively (as a sunset provision), not expansively (as an endorsement).
  *   **Accommodation:** The contract analogy *can* accommodate Douglass. It requires treating the text as the final authority (over secret intentions) and the Preamble as the governing purpose (over specific, contradictory clauses). Your friend's reading requires us to ignore the text in favor of the "deal" made behind closed doors.

  ### IV. Verdict: Metaphor vs. History

  Does your friend's conclusion survive the audit? **No.**

  The conclusion that "fidelity to the document is complicity" relies on the metaphor of the Constitution as a *fixed, private, binding deal* that cannot be changed without dissolution.
  *   **The Metaphor's Burden:** The metaphor carries the argument, not the history. Historically, the document was ambiguous. Politically, it was a hybrid. But the *contract metaphor* forces a binary: either you enforce the deal as written by the original partners, or you break the deal.
  *   **The Reality:** The Constitution is not a contract between states; it is a law imposed by the people upon the government. Once you shift from "Contract" to "Law," the moral calculus changes. One is not complicit in a bad law by remaining within the jurisdiction; one is complicit only by refusing to work for its repeal.

  Your friend's argument collapses because it treats the Constitution as a *status quo* agreement rather than a *normative* framework. If it is a contract, it is a contract with illegal terms. In law, you do not burn the house because the deed has a void clause; you petition the court to strike the clause. Douglass recognized that remaining in the Union provided the political machinery (the "court") to strike the clause. Garrison, by demanding rescission, surrendered the machinery.

  ### V. A Better Figure: The Trust

  If the contract metaphor is too static and private, a better figure is the **Trust**.

  *   **The Settlers:** The Founders.
  *   **The Trustee:** The Federal Government.
  *   **The Beneficiaries:** The People (including future generations and, implicitly, the enslaved who were wrongly excluded).
  *   **The Trust Instrument:** The Constitution.
  *   **The Fiduciary Duty:** To administer the trust for the benefit of the beneficiaries according to the purpose of the trust ("Liberty").

  **Why this works better:**
  1.  **Non-Consenting Beneficiaries:** A trust can benefit people who did not sign it (future generations, the enslaved). They have standing even if they didn't consent.
  2.  **Fiduciary Duty overrides Specific Instructions:** If a Settler puts a clause in the trust that violates the core purpose (e.g., "use trust funds to buy slaves"), the Trustee has a fiduciary duty to ignore that instruction to preserve the integrity of the trust. The government (Trustee) had a duty to Liberty that overrode the specific instructions regarding fugitive slaves.
  3.  **Reform vs. Rescission:** You do not dissolve a trust because the Settlers made a mistake. You appoint a new Trustee or amend the terms to align with the fiduciary purpose.

  **Conclusion:**
  Your friend's Garrisonian verdict depends on the Constitution being a closed deal between sovereigns. The audit shows this mapping fails on the status of the enslaved, the rights of future generations, and the rules of interpreting illegal terms. Douglass's reading is not sentimentality; it is a sophisticated legal argument that the text's plain meaning and normative purpose (Liberty) void the secret intentions of the drafters. The Constitution was not a contract with slavery; it was a trust for liberty that had been temporarily encumbered by slavery. The moral obligation was not to walk away from the trust, but to reclaim it for its true beneficiaries.
