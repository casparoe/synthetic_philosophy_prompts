answer: |-
  This is a classic philosophical quagmire, and your intuition that you are talking past each other is highly plausible. However, calling it "merely verbal" is too easy and lets you both off the hook too quickly. There is a substantive core here, but it is likely not the one you are explicitly arguing about.

  Here is a diagnosis of the disagreement, a test of your hypothesis, and a roadmap for what would actually constitute progress.

  ### 1. The Diagnosis: Metaphysical Parsimony vs. Explanatory Utility

  You are not having a single disagreement; you are having two nested disagreements that you are conflating.

  **Layer 1: The Metaphysical Question (Your Colleague)**
  Your colleague is operating with a **Process/Mechanistic Theory of Causation**. For her, causation is a physical relation (transfer of energy, momentum, or physical process). On this view, the universe is a closed physical system. An "omission" is not a physical event; it is a description of the world *not* doing something. Therefore, it cannot enter into physical relations. Her worry about "over-generation" (the ceiling) is the standard objection to treating omissions as causes: if absences are causes, causation becomes ubiquitous and loses its power to distinguish specific mechanisms. She prioritizes **ontological parsimony**.

  **Layer 2: The Explanatory/Pragmatic Question (You)**
  You are operating with a **Counterfactual/Interventionist Theory of Causation** (closer to Lewis or Woodward). For you, causation is about dependency relations that support manipulation and explanation. If changing $X$ changes $Y$, $X$ is a cause of $Y$. You prioritize **explanatory utility**. In law, history, and medicine, omitting to act is treated identically to acting. If your theory of causation cannot account for the gardener, it fails as a tool for the special sciences.

  **The Verdict:** This is a **framework disagreement** (in the Carnapian sense). You are arguing over which conceptual framework is "correct," but frameworks are chosen based on what work you want them to do. She wants a concept of causation that fits fundamental physics; you want one that fits human reasoning and the special sciences.

  ### 2. Testing Your Hypothesis (Normativity in Disguise)

  Your hypothesis is that the disagreement is driven by **norms** (what *should* have happened) rather than metaphysics. You are largely right, but the "Normativity" story needs refinement to handle your wrinkles.

  **Wrinkle 1: The Thermostat (No Duty)**
  *The Case:* A thermostat fails to trip, pipes freeze. No moral duty, no contract.
  *Your Hypothesis:* If it's about norms/duties, this sinks the story.
  *Refinement:* It doesn't sink the story; it broadens it. The relevant norm isn't just moral/legal duty; it is **teleological function** or **statistical normality**.
  *   *Hart & Honoré's View:* We distinguish causes from conditions based on what is "abnormal." A thermostat *functioning* is the norm; a thermostat *failing* is an abnormality. The ceiling holding up is normal; the gardener not watering is abnormal (relative to his job).
  *   *Test:* If you can show that people attribute causation to omissions even when there is no function and no statistical abnormality, the normativity story fails. But evidence suggests we don't. We don't say "The absence of a hurricane caused the plant to live."
  *   *Conclusion:* The normativity story holds if you define "norm" broadly (functional/statistical), not just deontically.

  **Wrinkle 2: Two Omissions (Overdetermination)**
  *The Case:* Gardener A and Gardener B are both paid to water. Neither does. Plant dies. Either one watering would have saved it.
  *The Problem:* Counterfactual dependence holds for both. If A had watered, plant lives. If B had watered, plant lives.
  *Your Hypothesis:* Norms decide who we blame.
  *Refinement:* This shows that **causal selection** is distinct from **causal existence**. Even if you both agree that "omissions can be causes," you still need a principle to select *which* omission is *the* cause in a specific explanation.
  *   *Diagnosis:* This suggests your colleague is right that counterfactual dependence is insufficient, but wrong that it's irrelevant. The missing piece is **Contrastive Causation** (see below).

  **Wrinkle 3: Purpose of Explanation**
  *The Case:* Is this about what causation *is* or what explanation is *for*?
  *Verdict:* This is the strongest point in your favor. Causal claims are usually answers to "Why?" questions. "Why did the plant die?" implies "What went wrong?" The ceiling didn't go wrong; the gardener did.
  *   *Implication:* If causation is inherently contrastive (Why $E$ rather than $E^*$?), then omissions fit naturally. "Why did it die rather than live? Because the gardener didn't water rather than watering." The ceiling didn't change its state, so it doesn't enter the contrast.

  ### 3. What Kind of Disagreement Is This?

  It is a **Methodological Disagreement about Theoretical Virtues.**

  *   **Colleague:** Values alignment with fundamental physics and avoidance of "spooky" non-events. She fears that allowing omissions makes causation too subjective (dependent on human norms).
  *   **You:** Value alignment with human practice (law, history, daily reasoning). You fear that excluding omissions makes causation too narrow to be useful for explanation.

  **Is it Verbal?**
  Yes, in the sense that you are using the word "cause" to pick out different relations. She means "physical mechanism"; you mean "explanatory dependency."
  **Is it Substantive?**
  Yes, in the sense that you disagree on which theoretical virtue should dominate our ontology. Should our concept of causation be slave to physics, or slave to explanation?

  ### 4. How to Make Progress (Instead of Spinning)

  Stop arguing about the Gardener. You have reached reflective equilibrium on opposite sides. Try these moves:

  **A. Shift to Contrastive Causation (Jonathan Schaffer's Move)**
  Propose that causation is a quaternary relation: $C$ rather than $C^*$ causes $E$ rather than $E^*$.
  *   *Gardener:* Not-watering ($C$) rather than Watering ($C^*$) caused Death ($E$) rather than Life ($E^*$). **True.**
  *   *Ceiling:* Holding ($C$) rather than Collapsing ($C^*$) caused Death ($E$) rather than Life ($E^*$). **False.** (If the ceiling had collapsed, the plant would also have died).
  *   *Why this helps:* It solves the over-generation problem without denying omissions. It formalizes the "normativity" as a selection of the relevant contrast class. If your colleague accepts this, she can keep her metaphysics (events causing events) while you get your omissions (contrasts between events).

  **B. The "Interventionist" Test (James Woodward)**
  Ask her: "Is causation about prediction and control?"
  *   If yes: Then omissions *must* be causes. Knowing the gardener won't water allows me to predict the death and intervene (by watering it myself). The absence of water is a lever I can pull.
  *   If no: Then she must admit her concept of causation is not the one used in science (which relies on manipulation), but a specialized metaphysical one.
  *   *Progress:* Force her to admit whether she is doing physics or metaphysics.

  **C. Experimental Philosophy (X-Phi)**
  This is an empirical question about human cognition. There is actual literature on this (e.g., Hitchcock & Knobe, 2009).
  *   *Finding:* People are significantly more likely to attribute causal status to an omission if there is a norm violation.
  *   *Action:* Cite this. It supports your claim that "normativity is doing the work." If her claim is that "intuition is irrelevant," she retreats to pure metaphysics. If she cares about how the concept is actually used, the data sides with you.

  ### 5. Where Your Diagnosis Might Fail (Honest Assessment)

  You asked me to be honest about where your hypothesis could be wrong. Here are the failure points:

  1.  **The "Preemption" Problem:** There are cases where norms align, but causal intuitions diverge.
      *   *Case:* Assassin A waits to shoot the Victim. Assassin B is also waiting. A sees B, decides not to shoot (omission), knowing B will. B shoots (event). Victim dies.
      *   *Norm:* A violated a norm (don't kill). B violated a norm.
      *   *Intuition:* B's shooting is the cause. A's not-shooting is not the cause, even though A violated a norm and the death counterfactually depends on A's plan (if A hadn't planned to shoot, he wouldn't have held back).
      *   *Risk:* If normativity predicts A is a cause, but intuition says A is *not* a cause, then normativity is not the whole story. Structural features of the causal chain (preemption) matter independently of norms.

  2.  **The "Science" Objection:** Your colleague might argue that while norms work for *folk* causation, they have no place in *scientific* causation.
      *   *Challenge:* In epidemiology, "lack of vitamin C" causes scurvy. This is an omission. It is accepted science.
      *   *Failure Point:* If she insists that even in medicine, "lack of vitamin C" is just shorthand for a complex biochemical presence/absence cascade, she is defending a reductionist view that may be empirically adequate but pragmatically useless. Your hypothesis fails if she can show that a purely physicalist account can handle the special sciences without invoking norms (many try, few succeed).

  3.  **The Metaphysical Cost:** You might be underestimating the cost of your view. If omissions are causes, then causation is not a relation in the world, but a relation between the world and a mind (which expects things).
      *   *Risk:* If you admit this, you concede her main point: causation is not "out there." You win the practical battle (we can call it causation) but lose the metaphysical one (it's not mind-independent). You need to decide if you care about mind-independence.

  ### 6. What Would Change My Mind?

  If I were to tell you this is **substantive** rather than pragmatic/verbal, I would need to see:
  1.  **A case where Norms are identical, but Causal Intuitions diverge.** (See the Preemption case above). If we can find a pair of omissions where the normative status is exactly the same, but one feels like a cause and the other doesn't *for reasons unrelated to explanation*, then there is a metaphysical difference.
  2.  **A physicalist account of omissions.** If your colleague can show how an absence transfers energy or information without being a placeholder for a positive event, her metaphysical view gains traction. (Currently, most process theorists simply deny omissions are causes).
  3.  **Predictive Power.** If treating omissions as non-causes leads to better predictions in a specific scientific domain than treating them as causes, that is a substantive win for her. (Unlikely, given epidemiology/economics).

  ### Summary Recommendation

  Tell your colleague: **"We are agreeing on the physics but disagreeing on the ontology of explanation."**

  Propose a truce based on **Contrastive Causation**.
  *   Admit to her that "omissions" are not physical events (satisfies her metaphysics).
  *   Insist that "causal claims" are inherently contrastive and context-dependent (satisfies your pragmatics).
  *   Agree that the Gardener is a cause *relative to the contrast* of him doing his job, while the Ceiling is not *relative to the contrast* of it doing its job.

  This dissolves the standoff. You aren't arguing about the world; you're arguing about which map we're using. Stop trying to prove the map is the territory.
