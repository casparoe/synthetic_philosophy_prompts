      *   *Key Players:* Lewis (counterfactuals), Hart & Honoré (norms/abnormality), Schaffer (contrastive causation), Beebee (no causation by omission).
      *   *The "Over-generation" Problem:* If absences are causes, then the absence of *everything* that would have prevented the effect is a cause. (The "Ceiling" objection).
      *   *The "Normativity" Solution:* We pick out "abnormal" or "expected" absences.
      *   *The "Metaphysical" Objection:* Causation is a physical relation (transfer of energy/momentum). Absences transfer nothing.

  3.  **Evaluate the User's Hypothesis (Normativity/Semantics vs. Metaphysics):**
      *   *Strength:* It explains the intuitive asymmetry between the Gardener and the Ceiling. It aligns with the "pragmatic" turn in causation literature (van Fraassen, Hitchcock).
      *   *Weakness:* It might beg the question against the colleague. If the colleague is a *metaphysical realist* about causation (e.g., a process theorist), they will insist that if it's not a physical process, it's not causation, regardless of norms.
      *   *Verbal vs. Substantive:* Is it just a definition of "cause"? Or is it about the structure of reality?
      *   *Diagnosis:* It's likely a **methodological disagreement masquerading as a metaphysical one**, with a heavy dose of **conceptual pluralism**. They are likely optimizing for different theoretical virtues (parsimony vs. explanatory power).

