answer: |-
  ### Working Out the Distinctions

  To build a robust checklist, we must isolate three specific confusions that generate these pitches. First, **Effective vs. Physical**: The Church-Turing thesis (CTT) originally claims that any function calculable by a human following fixed rules is Turing-computable. The "Physical CTT" extends this to claim no physical system can compute more. Pitches often treat the Physical CTT as a proven law rather than an empirical hypothesis, or they conflate the mathematical definition of "effective procedure" with physical dynamics. Second, **Computability vs. Complexity**: CTT concerns *what* can be computed (decidability), not *how fast* (complexity). Solving an NP-hard problem quickly is a breakthrough in complexity theory, not a violation of CTT. Third, **Idealization vs. Encoding**: Models using exact real numbers or infinite steps (supertasks) assume physical idealizations (infinite precision, energy) that noise destroys. Conversely, some systems "solve" problems by encoding the answer into the infinite precision of the input, shifting the computational burden to the setup rather than the process.

  ### The Procedure

  1.  **Problem Class:** Is the problem formally undecidable for Turing Machines (e.g., Halting Problem) or merely computationally hard (e.g., Traveling Salesperson)?
  2.  **Physical Idealization:** Does the mechanism require infinite precision, infinite energy, or infinitely many operations in finite time?
  3.  **Encoding Burden:** Is the solution contained in the precision of the input or initial conditions rather than generated by the dynamics?
  4.  **Mind/Truth Distinction:** (For cognitive claims) Does the argument confuse truth-in-a-model with provability-in-a-system?

  ### Running the Procedure

  1.  **Analogue Combinatorial Device:**
      *   **Step 1:** Claims to solve NP-hard problems (combinatorial optimization) quickly.
      *   **Verdict:** **No.** This is a complexity claim, not hypercomputation. CTT allows fast solutions; it only forbids solving undecidable problems.
      *   **Action:** File under "Engineering Breakthrough" or "Skepticism on Speedup," not "Breaking Logic."

  2.  **Relativistic Supertask:**
      *   **Step 1:** Claims to decide undecidable problems.
      *   **Step 2:** Requires an observer to witness infinite steps (e.g., falling into a specific black hole geometry) or infinite energy.
      *   **Verdict:** **No.** Relies on physical idealizations (infinite steps/energy) not realizable in our universe.
      *   **Action:** File under "Mathematical Curiosity," not "Physical Reality."

  3.  **Gödelian Mind Argument:**
      *   **Step 1:** Claims minds see truth machines cannot prove.
      *   **Step 4:** Confuses semantic truth (we see it is true) with syntactic provability (the system proves it). We only see it is true if we assume the system is consistent, which the system cannot prove itself.
      *   **Verdict:** **No.** Category error between truth and proof.
      *   **Action:** File under "Philosophy," not "Computing."

  4.  **Quantum Annealer:**
      *   **Step 1:** Claims to solve optimization problems faster than classical computers.
      *   **Verdict:** **No.** Like the analogue device, this is a complexity claim. It does not solve the Halting Problem.
      *   **Action:** **Blunt Assessment:** The framing is marketing hype. The result may be real (speedup), but the "outside ordinary computation" claim is false. Do not publish as a CTT violation.

  ### Failure and Revision

  The procedure's weakest point is **Step 2 (Physical Idealization)**. Determining whether a physical system truly requires infinite precision or if noise fundamentally limits it is a matter of empirical physics, not logic. If a new physical theory (e.g., quantum gravity) demonstrated that spacetime discreteness allows robust hypercomputation with finite resources, Step 2 would flip. The procedure would need revision only if a device demonstrably solved an undecidable problem with finite, verifiable resources, forcing us to abandon the Physical Church-Turing Thesis.

