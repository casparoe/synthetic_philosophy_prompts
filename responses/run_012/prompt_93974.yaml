answer: |-
  Friends, families, faculty, and most importantly, the graduating class of this year.

  It is a privilege to stand on this lawn with you. For the past week, you have been told many things. You have been told to follow your passion, to trust your inner voice, and to remain true to yourselves regardless of where life takes you. These are comforting words. They suggest that inside each of you is a compass, calibrated and ready, waiting only for your command to point north. They suggest that the person you are today is a solid thing, a kind of moral bedrock that will hold firm when the storms come.

  I stand before you to offer a different kind of comfort. It is less romantic, but I believe it is more durable.

  We like to think of ourselves as consistent. We like to believe that if we are honest people, we are honest in every room, under every pressure, at every hour of the day. We want to believe that courage is a possession, something we carry in our pockets like a key, ready to unlock any door. But if you look honestly at your own lives over the past four years, you may notice a different pattern. You may recall days when you were patient and kind, followed by days when you were sharp and selfish, with no clear change in who you were between them. You may remember times when you intended to help a stranger, but the rush of the moment swept you past them before you could stop. You know that you are not the same person in a quiet library that you are in a crowded stadium. You are not the same person when you are rested that you are when you are hungry.

  This inconsistency is not a failure. It is a feature of being human.

  I can hear the worry this raises. I see it in the faces of the parents and grandparents in the audience. The worry is this: "If you tell them that their character changes with the weather, aren't you telling them that character doesn't matter? Aren't you lowering the bar? If goodness depends on the situation, what happens to responsibility?"

  It is a fair question. If I were telling you that your choices are illusions, that you are leaves blown by the wind, then yes, morality would be dead. But that is not what I am saying. I am saying that we have misunderstood what character is. We have treated it like a muscle, something that grows strong enough to lift any weight simply by wishing it so. But character is not a muscle. It is more like a skill.

  Consider a carpenter. We do not say a carpenter lacks skill because the wood they are given is knotted or wet. We say they are skilled because they know how to read the grain, how to choose the right tools for the material, and when to pause before forcing a joint. A skilled pilot is not someone who claims the air will always be calm. A skilled pilot is someone who knows how to fly when the air is not.

  If character were a global trait, a fixed star that shone the same way in every context, my advice to you would be simple: strengthen your will. Promise yourselves that you will be brave no matter what. But since character is responsive to the world around you, the advice must change. You cannot rely on being the same person in every room. Instead, you must become careful about which rooms you enter.

  This is the work that awaits you. It is not the work of transforming your soul into something impervious. It is the work of architecture.

  Most of what we call virtue is actually situation selection. It is the understanding that you are more likely to be generous when you are not exhausted. It is the knowledge that you are more likely to be honest when you have not backed yourself into a corner where lying is the only easy exit. It is the wisdom to know that you cannot trust yourself to be patient in a traffic jam, so you leave early enough that the traffic jam does not matter.

  If you try to be good by relying solely on your internal resolve, you will eventually find a situation where your resolve breaks. Everyone does. The situationist view does not excuse this; it predicts it. But it also offers a way around it. Do not build a life that requires you to be a hero every day. Build a life where the decent thing is also the easy thing.

  This requires humility. It requires admitting that you are not the center of your own behavior—that the context matters as much as the conviction. There will be colleagues here who know the literature I have spent my career studying. They might worry that I am going soft, that I am abandoning the rigor of the critique for the sake of a sunny send-off. I am not. The evidence remains what it is. We are not as consistent as we hope. But the conclusion that there is nothing left to say is wrong. There is plenty to say. It just isn't what we usually say.

  We usually tell you to find your purpose. I am telling you to find your constraints. We usually tell you to trust your conscience. I am telling you to trust your design. If you want to be a person who helps others, do not just vow to help. Put yourself in communities where helping is the norm. If you want to be a person who tells the truth, do not just vow honesty. Avoid the situations where truth is too costly to bear.

  This is not cheating. This is not avoiding the test. This is recognizing that the test is always happening, and the only way to pass is to understand the conditions under which you are taking it.

  So, as you leave this place, do not ask yourselves only, "Who do I want to be?" That question assumes there is a single "who" waiting to be uncovered. Ask yourselves instead, "Where do I function best? What environments bring out the version of me that I respect? What structures do I need to build so that when I am tired, or rushed, or afraid, I still slide toward the good?"

  You are not statues. You are currents. You change with the landscape. That is not a weakness. It is your capacity for adaptation. But it means you must be the gardener of your own life, not just the flower. You must tend the soil, not just admire the bloom.

  There will be times when you fail. There will be days when the situation overwhelms you, when you are rushed and you walk past the person slumped in the doorway, when you say the cruel thing because the room was hot and you were tired. When that happens, do not tell yourself that you are simply a bad person. Do not tell yourself that character is a myth. Tell yourself that you misjudged the conditions. Tell yourself that you must adjust the environment, not just the will.

  The world will try to sell you many things. It will sell you the idea that you can be anything, anywhere, anytime. It will sell you the idea that your inner light is enough to pierce any darkness. I am asking you to be skeptical of that. Your inner light is real, but it is fragile. It needs shelter. It needs walls. It needs a structure that holds it up when the wind blows.

  Go out and build those walls. Not to hide behind, but to stand within. Create a life where you do not have to be perfect to be good. Create a life where your virtues are supported by your habits, your friends, your schedules, and your spaces. Make it easy to be the person you hope to be.

  If you do this, you will not need to worry about whether you are the same person in every room. You will know that you are a person who chooses their rooms wisely. And in a world that is often too rushed, too loud, and too hard, that is the most honest form of courage left to us.

  Congratulations.

  ***

  **Note to the Speaker**

  **Account of Character Committed To:**
  The address commits you to a **social-cognitive account of character**, specifically one aligned with the "if-then" signatures of personality (Mischel/Shoda) and the importance of situation selection. It rejects the Global Trait Model (character as cross-situational consistency) and the Nihilistic Conclusion (character as illusion). Instead, it posits character as a **stable capacity for environmental structuring and situation selection**. It defines moral agency not as the power to override context through willpower, but as the wisdom to curate contexts that align with one's values. Character is thus a skill of navigation and design rather than a fixed internal substance.

  **The Sentence to Defend:**
  *"Do not build a life that requires you to be a hero every day. Build a life where the decent thing is also the easy thing."*

  **Reasoning:**
  This sentence encapsulates the core situationist advice (situation selection/structuring) while rejecting the global-trait expectation (heroic consistency). In ten years, a graduate might quote this back to you when they are in a situation where the "decent thing" is inherently difficult or costly (e.g., whistleblowing, protecting a vulnerable person in a hostile environment). They might argue that your advice encourages moral cowardice or privilege—that not everyone has the luxury of choosing their "rooms." You will need to defend the claim that while we cannot control all situations, our primary moral responsibility lies in minimizing unnecessary moral conflict through design, without implying that we should avoid all difficult moral tests. You must be prepared to distinguish between *avoiding difficulty* and *avoiding unnecessary temptation*.
