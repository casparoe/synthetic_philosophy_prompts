  1. Learning target and why this activity
  This activity targets the "arbitration gap": the distance between a mechanism that settles a choice and a reason that justifies it. Students often conflate decision procedures with rational justification. By forcing a choice between symmetric or incommensurable options under a justification requirement, this exercise induces the specific paralysis Buridan describes—not as animal stupidity, but as rational integrity. They will experience the tension between the demand for a sufficient reason and the absence of differentiating facts. The goal is to move the puzzle from a metaphysical curiosity to a practical deliberative crisis. They must feel that choosing arbitrarily feels like a failure of reasoning, yet insisting on a reason feels like an impossibility. This visceral frustration prepares them to distinguish indifference (no preference) from equipoise (equal opposing reasons) and to see why symmetry breaks differently than incommensurability. The activity avoids naming the puzzle until the end to prevent intellectualizing the experience before it occurs.

  2. Setup, materials, and roles
  Arrange chairs in a single closed circle. You need a projector, a visible timer, index cards, pens, and two sets of "Candidate Files" (Folder A and Folder B).
  **Roles:** The class is the "Allocation Committee." You are the "Auditor." Select one student as "Scribe" (writes the final justification) and one as "Chair" (manages speaking turns). Rotate these roles between rounds.
  **Materials:**
  1.  **Round 1 Files:** Two identical folders containing identical summaries of a grant applicant (same GPA, same proposal title, same essay text).
  2.  **Round 2 Files:** Two distinct folders. Candidate X has high research scores but low teaching scores. Candidate Y has high teaching scores but low research scores. The weighted total is identical.
  3.  **Justification Cards:** Index cards for drafting the rationale.
  4.  **Timer:** Projected on screen.
  Ensure the room is quiet enough for deliberation. Distribute pens and cards. Do not reveal the content of the files until the round begins.

  3. Rules and payoff scheme
  **Objective:** Award one singular grant to one candidate.
  **Rules:**
  1.  **Forced Choice:** The committee must select exactly one candidate. No splitting funds.
  2.  **Justification Requirement:** You must submit a written justification (max 3 sentences) explaining *why* the chosen candidate was superior based on the file contents.
  3.  **The Audit:** As Auditor, I will reject any justification that cites a procedure (e.g., "we chose left," "we flipped a coin") or external factors not in the file. The reason must be internal to the candidate's merit.
  4.  **Time Limit:** 7 minutes per round. If time expires without a valid justification, the grant is withdrawn.
  **Payoff Scheme:**
  Use "Seminar Privileges." If the committee successfully awards the grant with a valid justification in both rounds, the class earns a 10-minute extension on the next reading deadline. If they fail either round, the extension is lost. This creates low-stakes collective pressure. The pressure comes from the Audit rule: they cannot simply say "we had to pick one." They must fabricate or discover a reason where none ostensibly exists. This incentivizes them to mistake a procedure for a reason to save the privilege. The Scribe bears the burden of phrasing this correctly.

  4. Run of show
  **0:00-0:05:** Seat students. Explain only the Rules and Payoff. Do not mention Buridan or philosophy. Show the Timer.
  **0:05-0:15:** **Round 1 (Symmetry).** Distribute identical files. Start timer. Observe silence/confusion. Collect Justification Card.
  **0:15-0:25:** **Audit Round 1.** Read their justification aloud. If procedural, reject it. Ask: "Is this a reason or a method?" If they fail, withhold the privilege but proceed.
  **0:25-0:40:** **Round 2 (Incommensurability).** Distribute balanced files. Start timer. Observe debate over values (Research vs. Teaching). Collect Card.
  **0:40-0:50:** **Audit Round 2.** Accept most reasons here, but highlight if they ignored half the data to force symmetry.
  **0:50-1:30:** **Debrief.** (See Section 5).
  *Note:* Keep the transition between rounds sharp. Do not allow discussion between rounds about the nature of the task.

  5. Debrief and mapping
  Begin by revealing the name "Buridan's Ass." Ask: "When did you feel stuck?"
  **Mapping Symmetry:** In Round 1, the options were identical. This is **Indifference**. There was no reason to prefer A over B. If you chose A, was it rational? If you wrote "A was better," you lied. If you wrote "we picked randomly," you failed the Audit. This is the **Arbitration Gap**: you needed a reason to act, but only a procedure was available. The gap feels like a practical problem because the timer forces movement while the Audit blocks exit.
  **Mapping Incommensurability:** In Round 2, options were different but balanced. This is **Equipoise**. Here, reasons existed (Research vs. Teaching), but they were **Incommensurable**. You couldn't reduce them to a single scale without arbitrary weighting.
  **Procedure vs. Justification:** Ask the Chair: "Did you feel like you were deciding or explaining?" Often, groups vote (procedure) then write a justification (post-hoc rationalization). This mirrors the philosophical error of thinking a decision mechanism supplies rational necessity.
  **The Gap:** The feeling of paralysis wasn't ignorance; it was rational integrity. You refused to lie about the files. Buridan's point is that without a will capable of arbitrary choice, reason paralyzes. The activity makes the gap practical: you had to choose to get the prize, but you couldn't justify it to keep it. This tension is the core of medieval voluntarism vs. intellectualism.

  6. Predictable failures and how to handle them
  **Failure 1: The Hack.** Students may claim a trivial difference (e.g., "Font size was clearer") to satisfy the Audit.
  *Fix:* Pre-empt this. State in rules: "Reasons must concern merit, not presentation." If they do it anyway, accept it but highlight in debrief that this is "grasping at straws" to close the gap.
  **Failure 2: The Dictator.** One student dominates and forces a choice, bypassing the paralysis.
  *Fix:* As Auditor, intervene. "Does the committee agree this is the reason, or is this the Chair's reason?" Force consensus to ensure the group feels the weight.
  **Failure 3: Laughing it off.** They might treat the identical files as a joke.
  *Fix:* Maintain serious tone. "The Audit is strict. If you laugh, you aren't treating the justification requirement seriously." Remind them of the payoff (deadline extension).
  **Failure 4: Rushing.** They might submit a procedural justification hoping you miss it.
  *Fix:* Read it aloud slowly. "You wrote 'we chose the first one.' That is a method, not a merit. Rejected." If silence persists, remind them the timer is still running.

  7. What the activity cannot reproduce
  This simulation cannot reproduce the existential stakes of actual action. In class, paralysis is amusing; in life, it can be tragic. Also, group deliberation diffuses individual agency. Buridan's Ass is often about individual will, but here you negotiated the paralysis socially. You may have solved the puzzle by compromising rather than willing. Finally, the "Audit" is external. In real agency, the demand for a reason is internal. You might feel you satisfied the reason privately even if the Auditor rejected it. The activity externalizes the conscience, which simplifies the internal conflict of the will.
