      *   Ensure the definition is usable.
      *   Ensure the "hard conceptual questions" are explicitly addressed.

      *Refining the Definition:* "A plan is wildlife-welfare positive if it is reasonably expected to increase the average welfare per capita of the tract's sentient inhabitants and reduce the frequency of extreme suffering events, relative to the status quo."
      *Refining the Aggregation Point:* Explicitly mention that we are not aggregating across non-existent beings.

      *Let's write.*

