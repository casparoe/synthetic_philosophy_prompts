      *   *Structure:* 3 Decision Nodes ($D_1, D_2, D_3$). At each, choose Stop ($S$) or Continue ($C$). If $S$ at $D_i$, game ends with payoff $V_i$. If $C$ at $D_3$, game ends with terminal payoff $V_4$.
