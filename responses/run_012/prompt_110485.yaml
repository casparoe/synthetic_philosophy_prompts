      *   *Condition 2 (Mixed Optimal):* We need $E(p)$ to be maximized at some $p^* \in (0,1)$ such that $E(p^*) > \max(E(0), E(1))$.
          *   $E(0) = V_1$ (Stop immediately).
          *   $E(1) = V_4$ (Never stop).
