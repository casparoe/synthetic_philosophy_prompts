  **The Case**

  The city council is deciding whether to fund a rare medical treatment for a single patient or upgrade the water filtration system for the whole district. The budget covers one or the other; the upgrade would statistically prevent one fatality over the next decade, while the treatment would save the patient with certainty. During the hearing, the patient's mother describes her daughter's suffering and displays photos of her seventh birthday party before the illness. Moved by the testimony, the council funds the treatment. Critics argue the council failed its duty to the public good.

  **The Workup**

  **(1) Payload, Lever, and Verdict**
  *   **Payload:** Public policy should prioritize aggregate statistical welfare over identifiable individual cases (the "Identifiable Victim Effect" is a bias).
  *   **Lever:** The identifiable victim is a **child** (specifically, the photos of the seventh birthday party).
  *   **Verdict:** The council made the wrong decision (which supports the payload).

  **(2) Swapping the Lever**
  Hold the scenario fixed but change the patient from a seven-year-old child to a seventy-year-old retiree (swapping the birthday photos for pictures of a retirement party). The logical structure of the dilemma remains identical: one identifiable life versus one statistical life. However, the intuition weakens considerably. Readers are less inclined to condemn the council's decision, and the payload ("you shouldn't do this") feels less urgent. The persuasive force drops because the emotional valence of the lever was doing the heavy lifting, not the principle of statistical welfare.

  **(3) Pointing the Lever at the Opposite Payload**
  Keep the lever (the seven-year-old child) but argue for the opposite payload: "Public policy *should* prioritize identifiable individual cases when the stakes are human." The same detail—the child's birthday photos—now sells the opposite conclusion effortlessly. "You can't let a child die just for statistics!" becomes a compelling argument. Because the same feature (childhood) can be used to vindicate the council just as easily as it was used to condemn them, it proves the feature is argumentatively inert regarding the specific principle at stake. It is free-floating emotional weight.

  **(4) Load-Bearing Step and Potential Objection**
  Step (3) is load-bearing. It demonstrates that the lever is independent of the payload; it acts as a generic amplifier of moral urgency rather than a specific reason to prefer statistical welfare. A defender of the payload might object that I've cheated by ignoring relevant moral differences: children have more quality-adjusted life years (QALYs) than retirees, so saving the child *is* statistically superior. To meet this objection, the taxonomy must specify that the payload is about the *identifiability* distinction specifically, not the utilitarian calculus of life-years. If the principle is "Identifiability shouldn't matter," then age is irrelevant. If the defender insists age matters, they have shifted the payload to "Maximize life-years," in which case the case is no longer decorative—it's just a utilitarian calculation.

  **(5) The Legit Version**
  To make the lever legit, the feature doing the persuading must be one the principle actually cares about. The principle cares about *certainty vs. probability*.
  *   *Revised Lever:* The treatment saves the patient with 100% certainty, while the filtration upgrade prevents a fatality with only 50% probability (expected value still equal).
  *   *Why it works:* Now the tension is between *certainty* and *expectation*, which is central to decision theory. If readers still prioritize the certain save, they are revealing a risk-aversion bias relevant to the principle, not smuggling in an irrelevant emotional detail like "childhood." The feature driving the intuition (certainty) is now part of the payload's logical structure.
