answer: |-
  DIRECTORATE OF NATURAL ACQUISITION
  Enforcement Notice: DNA-2024-089
  Date: 14 October 2024
  To: Tokos Platform Ltd

  1. The Directorate finds that Tokos Platform Ltd (hereinafter 'the Firm') is engaged in unnatural acquisition. Statute distinguishes between acquisition bounded by the needs of the household and acquisition without limit. The Firm's staking protocol facilitates the latter. Money exists by convention solely to measure need for the purpose of exchange. It is barren. The Firm's software enables currency to generate offspring. This is contrary to the nature of the instrument. The Directorate notes the registered name 'Tokos'. The activity prohibited is the separation of gain from labour or use.

  2. A shoe has two uses: to be worn and to be swapped. The Firm treats the shoe only as something to be swapped, and further, swaps the swap itself. This creates a recursion of exchange value detached from use value. The Firm claims this is 'natural money'. This is a category error. If money is conventional, it cannot be natural. If it is natural, it cannot be merely conventional. The Firm cannot have both. The Directorate requires the Firm to cease operations that allow money to breed money, as this imposes a limit where there is none, and removes the limit where there ought to be one.

  3. In response to the Preliminary Finding, the Firm submitted: 'Value is determined by consensus among participants regarding future utility. There is no objective metric for "need" outside of market price. To cap yield is to impose an arbitrary convention over a discovered convention. Your Honour cannot define the natural limit of a household because the household itself is a conventional unit defined by the very market forces you seek to regulate.' The Directorate accepts that value holds only by convention. The Directorate does not accept that this permits unlimited accumulation. The Firm's argument confirms that price is not truth, yet assumes this validates their pricing. It does not. It merely validates the instability of the measure. The Firm believes this ambiguity protects them; it actually indicts them.

  4. Compliance requires the Firm to restrict yield to the satisfaction of genuine household requirements. The Compliance Schedule attached requires submission of a Just-Price Table demonstrating commensurability between digital tokens and household goods. The Directorate acknowledges that no true measure exists to make a house and a shoe commensurable. Accordingly, the Table may rely on prevailing market rates, provided these rates do not reflect unnatural accumulation. The Directorate cannot specify what constitutes unnatural accumulation without referencing market rates. The Firm is to resolve this circularity within 30 days. If the market sets the price, it is conventional. If the Directorate sets the price, it is arbitrary. The Firm must find the third option.

  5. Precedent exists where knowledge was used to predict harvests for gain, then abandoned as unworthy of serious pursuit. The Firm is reminded that capability does not imply permission. The ability to compound assets indefinitely does not constitute a right to do so. The limit must be found in the nature of the thing, not the capacity of the code.

  6. Failure to comply will result in a penalty of £250,000. This fine is payable in Sterling. The Directorate recognises Sterling is a conventional token with no intrinsic value, used only to stand in for need. The penalty is assessed in this convention because no other measure is currently authorised for state enforcement. The Firm is not to infer from this that Sterling represents true value. It is merely the token required to close the file.

  Signed,
  Senior Adjudicator
  Directorate of Natural Acquisition
