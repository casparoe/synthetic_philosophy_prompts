  1.  **P(Compatibility) = 0.85:** Scanlon's appeal to "generic reasons" demonstrates that contractualism can conceptually accommodate some aggregation without logical contradiction.
  2.  **P(Individuation) = 0.60:** We can likely distinguish substantive grounds (e.g., "physical integrity") from arbitrary gerrymanders (e.g., "people named Steve") without immediate collapse.
  3.  **P(Heterogeneous Coverage) = 0.30:** The "same-ground" restriction structurally resists aggregating varied harms (e.g., lost limbs vs. lost jobs) even when intuition demands saving the many.
  4.  **P(Integrity) = 0.50:** Broadening "grounds" enough to cover heterogeneous cases risks redefining them as "units of welfare," erasing the view's non-consequentialist distinctiveness.

  **Combination**
  $0.85 \times 0.60 \times 0.30 \times 0.50 \approx 0.0765$ (rounded to 0.08)

  **Sensitivity Analysis**
  The final number is most sensitive to **P(Heterogeneous Coverage)**. The "Same-Ground" restriction succeeds only if we can categorize distinct harms (pain, disability, death) under a single normative description without that description simply meaning "welfare loss." The example that would move this term most is a **Varied Harms Case**: if 1,000 people face different catastrophic losses (blindness, paralysis, bereavement) versus one person facing death, and you feel compelled to save the 1,000 despite the lack of a shared specific ground, your credence in this restriction must drop to near zero unless you accept that "having a serious interest" is the ground—which invites the collapse objection.

