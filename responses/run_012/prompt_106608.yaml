answer: |-
  You are right to trust your suspicion. The confusion isn't in your morals; it's in the category error you're making. You are sliding between two distinct jobs:

  1.  **Moral Obligation:** Do I owe this entity duty? (Is the act *wrong*?)
  2.  **Fitting Attitude:** Is my emotional response appropriate to the context? (Is the feeling *fitting*?)

  In the real world, these usually travel together. If something has rights (Obligation), you should feel bad harming it (Attitude). In games, they decouple. You can have a fitting emotion toward something you owe no obligation to (the Cube), and you can have an obligation to something that isn't "real" (the Historical Victim).

  Here is the principle that repairs your hunch, tests it against your cases, and identifies the inconsistency you're harboring.

  ### The Principle: The Covenant of Attention

  Moral weight in a game does not come from the *ontology* of the object (is it real? does it have a mind?), but from the **Covenant of Attention** established between the player and the system.

  *   **The Covenant:** The game asks you to regard an entity in a specific way (as a friend, as a threat, as a victim, as a tool).
  *   **The Weight:** Your moral feelings track whether you are upholding or violating that covenant.
  *   **The Exception:** When the game references **Reality**, the covenant is bypassed, and real-world moral obligations bleed through.

  ### Testing the Principle

  **1. The Companion Cube (Violation of Trust)**
  *   **Verdict:** Feels wrong.
  *   **Analysis:** The game explicitly breaks the "objects are tools" covenant and establishes a "object is companion" covenant (heart, voice, protection). Incinerating it violates the specific relationship the game solicited.
  *   **Status:** **Fitting Attitude.** You feel guilt because you betrayed a trust, even if the trust was with a machine.

  **2. Nameless Guards (Fulfillment of Function)**
  *   **Verdict:** No reaction.
  *   **Analysis:** The covenant here is "these are obstacles." They do not ask for recognition; they ask to be bypassed. Treating them as furniture fulfills the covenant.
  *   **Status:** **Fitting Attitude.** Indifference is the correct response to a door or a trap; the game frames them as such.

  **3. RPG Party Member (Narrative Loss)**
  *   **Verdict:** Grief, but not "wrong."
  *   **Analysis:** The covenant is "this is a person." Their death is a tragedy within the fiction. Since you didn't betray the covenant (you tried to save them), there is no moral wrong, only the fitting emotional cost of the narrative.
  *   **Status:** **Fitting Attitude.**

  **4. Killable NPC with Backstory (Agency & Consequence)**
  *   **Verdict:** "Small and real" wrongness, but "fine."
  *   **Analysis:** The game offers a *broken* covenant: "This is a person, but you are a god." The unique dialogue acknowledges your violation. You feel weight because you *could* have upheld the "person" covenant but chose the "god" covenant.
  *   **Status:** **Moral Obligation (Simulated).** The game simulates consequence to make you feel the weight of choice.

  **5. Procedural Villagers (The Inconsistency)**
  *   **Verdict:** Caring less is "correct."
  *   **Analysis:** The game says "these are generic." You respond with indifference. This fits the Covenant of Attention.
  *   **Status:** **Consistent with the Game, Inconsistent with You.** (See below).

  **6. Save File (Personal History)**
  *   **Verdict:** Small death (self) vs. Nothing (stranger).
  *   **Analysis:** This isn't about the character; it's about *you*. The covenant is between you and your own time/investment. Deleting it destroys a record of your agency.
  *   **Status:** **Fitting Attitude.** It is a loss of *your* history, not the character's life.

  **7. Historical Victim (The Reality Bridge)**
  *   **Verdict:** Treating as toy is *wrong*.
  *   **Analysis:** This breaks the Covenant of Attention. The game is no longer just a closed system; it is a window to **Reality**. The character represents a real moral patient who actually suffered. The obligation is not to the code, but to the memory of the person.
  *   **Status:** **Real Moral Obligation.** This is the only case where "wrong" is literal, not simulated.

  **8. Accessibility Skip (The Witness)**
  *   **Verdict:** Feels like "cheating them."
  *   **Analysis:** In a narrative covenant, a character's death is often their final act of agency or meaning. To skip it is to refuse to **witness** them. It treats their culmination as an inconvenience to you. It violates the covenant of "I will honor your story."
  *   **Status:** **Fitting Attitude.** It feels rude because it is dismissive of the narrative contract, even if it is practically useful.

  ### The Verdict You Must Give Up

  You must give up the idea that caring less about the **Procedural Villagers** is **correct**.

  Here is why: Your verdict on the **Historical Victim** establishes that *representation matters*. You feel heavier because the game points to real human suffering. This proves that your moral intuition responds to the *concept* of a human, not just the *quality of writing*.

  If you respect the Historical Victim because they represent a human, then dismissing the Procedural Villagers solely because they are "random" is a failure of that same principle. You are allowing the game to train you into dehumanization.
  *   **The Repair:** It is *understandable* that you care less (the game didn't build the covenant), but it is not *correct* in the same way you feel the Historical Victim case is correct. Your friend is right: it is "speciesist-in-spirit." You are granting moral weight based on "narrative polish" rather than "human form." To be fully consistent with your Historical Victim verdict, you must acknowledge that indifference to the procedural villagers is a **moral failing the game exploits**, not a correct judgment.

  ### The New Case Prediction

  Based on the **Covenant of Attention**, here is a case you haven't listed, and how the principle dictates you should feel:

  **The Case:** A game where you are given a digital pet (like a Tamagotchi) that has no voice, no backstory, and no face—just a blob of pixels. However, the game mechanics require you to feed it or it "cries" (text on screen) and dies. If you keep it alive for 100 hours, it evolves into a unique form based on your playstyle. If you kill it, the game deletes your save file.

  **The Prediction:** You will feel **more** moral weight toward this blob than the Procedural Villagers, and potentially more than the Nameless Guards.

  **Why:**
  1.  **Dependency:** The Covenant of Attention is stronger here ("This thing relies on *you*") than with the villagers ("These things exist near *you*").
  2.  **Investment:** Like the Save File case, the unique evolution creates personal history.
  3.  **Consequence:** The save deletion creates a real-world penalty, bridging the gap between game consequence and real consequence.

  ### Summary

  Your intuition is not inconsistent; it is sophisticated. You are correctly identifying that "wrongness" in games is usually about **Betrayal of Trust** (The Covenant), not **Harm to Life**.

  *   **Cube:** Betrayal of trust.
  *   **Guards:** No trust established.
  *   **Historical Victim:** Real trust (to memory).
  *   **Procedural Villagers:** No trust established (but you should question why you let the game stop you from giving it).

  The confusion arises because you are trying to apply real-world ethics (based on sentience) to simulated ethics (based on relationships). Stop asking "Is this thing alive?" and start asking "What relationship is this game asking me to have?" That is where your guilt, grief, and respect are coming from.
