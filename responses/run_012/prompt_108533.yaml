      *   Check the "Soft Spot" honesty.

      *(Self-Correction during drafting Objection 3)*: I need to be careful. If the Chinese delegate stands up and says "Yes, exactly," the journalist looks like a propagandist. The objection should be: "You are misinterpreting our mechanism as liberal reciprocity when it is communal governance." This puts the speaker in a bind.

