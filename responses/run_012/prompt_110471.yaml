  A book I've been reading summarizes strong longtermism roughly as follows: 'Strong longtermism is the view that our foremost moral priority should be reducing existential risk, since the far future contains an effectively infinite number of potential people and, on a utilitarian calculus, even a minuscule reduction in the probability of human extinction outweighs any benefit we could deliver to people alive today. It follows that we should redirect funding from global health charities toward speculative ventures such as artificial intelligence safety, and that we happen to live at a uniquely pivotal hinge of history, after which our values will be locked in for good. Its critics add that because we cannot predict the long-run consequences of our actions, the whole position is unfalsifiable.' I am drawn to longtermism but suspect this summary collapses distinctions its defenders insist on. Tell me which parts a careful longtermist would accept, which are overstatements or conflations, what a defender would say to the objection about unpredictable consequences, and whether the book's practical conclusion survives once the accurate parts are separated out. Please answer in continuous prose, without headings, bullet points, bold text, or tables.
