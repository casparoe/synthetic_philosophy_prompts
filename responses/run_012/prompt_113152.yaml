answer: |-
  **JOINT STATEMENT ON CONSCIOUSNESS (PHIL 337)**

  **I. AGREED CLAIMS**

  1.  **Physical Supervenience:** We agree that mental states supervene on physical states. No non-physical substance causally interacts with the physical world.
  2.  **The Meta-Problem:** Both sides accept the necessity of solving the "meta-problem": explaining the cognitive mechanisms that lead humans to judge they have phenomenal consciousness, regardless of whether those judgments are veridical.
  3.  **Definition of "Illusion":** We agree that "illusionism" does not claim conscious states are non-existent. It claims introspection misrepresents the *properties* of those states (e.g., representing them as ineffable or intrinsic when they are not).
  4.  **Scientific Scope:** Neuroscience will identify neural correlates of consciousness (NCC) relevant to both positions. Disagreement lies in interpretation, not data collection.
  5.  **Introspective Fallibility:** Both sides acknowledge introspection is a cognitive process subject to error, though we disagree on the extent of that fallibility regarding phenomenal properties.

  **II. MAP OF DISAGREEMENT**

  | Issue | Phenomenal Realist Position | Illusionist Position | Crux, Evidence, & Pre-registered Predictions |
  | :--- | :--- | :--- | :--- |
  | **1. Ontology of Experience** | Phenomenal properties (qualia) are real, irreducible features of existence. When it seems like there is experience, there is experience. | Phenomenal properties as commonly conceived are false representations. The brain posits "qualia" that do not exist in the physical system. | **Crux:** Is introspective appearance truth-conferring?<br>**Evidence:** A complete cognitive error theory.<br>**Prediction (PR):** Error theories will fail to capture the "what-it-is-like-ness."<br>**Prediction (I):** Error theories will fully explain the judgment without positing qualia. |
  | **2. The Hard Problem** | There is an explanatory gap between physical function and subjective experience that cannot be closed conceptually. | The "Hard Problem" is a cognitive illusion generated by flawed introspective concepts. Closing the meta-problem dissolves the hard problem. | **Crux:** Is the gap ontological or conceptual?<br>**Evidence:** Conceivability of philosophical zombies.<br>**Prediction (PR):** Zombies remain conceivable even with complete physical knowledge.<br>**Prediction (I):** Zombies will be deemed inconceivable once cognitive mechanisms are understood. |
  | **3. Terminological Equivocation** | "Phenomenal consciousness" refers to the *actual property* experienced. To deny it is to deny the datum itself. | "Phenomenal consciousness" refers to the *represented property*. To deny it is to deny the accuracy of the representation, not the state. | **Crux:** Does "phenomenal" pick out the appearance or the reality?<br>**Evidence:** Linguistic analysis of first-person reports.<br>**Prediction (PR):** Clarifying definitions will not dissolve the intuition of realism.<br>**Prediction (I):** Clarifying definitions will reveal the dispute is largely verbal regarding "existence." |

  **III. NOTE ON VERBAL DISPUTE**

  We acknowledge a significant portion of our conflict stems from equivocation on the term "phenomenal." Realists use it to denote the *appearance* of experience (which is indubitable), while Illusionists use it to denote the *properties* attributed to that appearance (which are dubitable). We agree that if the term refers only to appearance, Illusionism is false (since the appearance exists). If the term refers to intrinsic, non-physical properties, Realism is false (given physical supervenience). Our substantive disagreement remains whether the physical brain can instantiate properties that genuinely match our introspective appearance.
