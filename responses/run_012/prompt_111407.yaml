      *(Refining the Doctrinal Paradox point)*: In the movie, they don't formally vote on premises then conclude. They vote on the verdict, but the *discussion* is about premises. The paradox is avoided because they don't stop at majority; they force consensus. So the movie actually *solves* the paradox through deliberation.

      *(Refining the Unanimity point)*: Unanimity is a "AND" gate. CJT is a "MAJORITY" gate. This makes the system robust against false convictions but vulnerable to hung juries. Juror 8 uses the veto not to say "Innocent" but to say "Not Proven."

      *(Refining the Payoff)*: The movie is basically about increasing $p$ (competence) through information sharing, whereas CJT assumes fixed $p$.

