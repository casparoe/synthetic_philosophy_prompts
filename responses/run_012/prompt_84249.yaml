prompt: |-
  I'm a second-year law student, and for the past month I've been sitting in on a seminar about how legal systems handle the aftermath of abusive regimes. Something in the material keeps nagging at me, and I've been arguing about it with a friend who is doing a PhD in philosophy; she says it all comes down to the old quarrel about whether an unjust law is still a law. I don't think that is the interesting part, and I'd like you to help me get the analysis right. The pattern is this. Nearly every legal order treats the ban on retroactive criminal liability as fundamental: you cannot be punished for conduct that was not an offence when you committed it. Nearly every military and police code also provides that a subordinate who acts on a superior's order is not criminally liable for what he does under it unless the order was manifestly unlawful, a standard that asks the subordinate, in the moment and without advice, to see the illegality from the face of the order. And after a regime falls, successor courts routinely convict officials for conduct that the fallen regime's own statutes expressly authorized, on the reasoning that an enactment can be so monstrous that it never was law, so that the conduct was unlawful even at the time. What makes that last move stranger is that the same courts go on applying the old regime's law to property, contracts and marriages: the discredited law turns out to be invalid in the criminal courtroom and valid in the registry of deeds.

  What I want is a reconstruction of what this bundle of practices presupposes, not a history of it and not a survey of the famous positions. Take the bundle at face value and ask what view of legal validity and of legal obligation it only makes sense under. Does it require that validity turn on the moral character of a norm, or can a view on which validity is settled entirely by who enacted what, in the right way, accommodate all of it without strain? Which of the elements is genuinely entailed by the practice and which is merely something the practice happens to fit? Which rival views does the bundle quietly rule out, and does the manifest-illegality standard in particular presuppose that moral facts are accessible to an ordinary person under pressure, and if so, what sort of moral theory that commits us to? Is the practice consistent with itself, or does the split between the criminal and the private-law treatment of the old regime show that the implicit theory is not a single theory of validity at all but something more local, about what courts may do to whom and who is competent to make the determination?

  Finally, suppose a legal order announced that it was abandoning the moralized view and would recognize as law anything enacted in the prescribed way, whatever its content. Tell me concretely what would have to change in the institutions: what successor courts could and could not still do, and what would have to be handled instead by amnesty, truth commission or fresh legislation.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Second-year law student (2L). This means they have foundational knowledge of legal theory (likely Hart, Fuller, natural law vs. legal positivism) but are looking for deeper analytical reconstruction, not just a textbook summary. They are arguing with a Philosophy PhD friend (who simplifies it to "unjust law is no law"). The student thinks there's more nuance.
      *   **Task:** Reconstruct the *presuppositions* of a specific bundle of legal practices regarding transitional justice (post-abusive regimes).
      *   **Key Practices Identified:**
          1.  Ban on retroactive criminal liability (*nullum crimen sine lege*).
          2.  Superior orders defense (unless "manifestly unlawful").
          3.  Post-regime criminal convictions based on the idea that old statutes were "so monstrous they never were law" (Radbruch Formula style).
          4.  Post-regime continuity in private law (property, contracts, marriages) under the same old statutes.
      *   **Specific Questions to Answer:**
          1.  What view of legal validity/obligation does this bundle presuppose?
          2.  Does validity turn on moral character, or can source-based positivism accommodate it?
          3.  Which elements are entailed vs. incidental?
          4.  What rival views are ruled out?
          5.  Does "manifest illegality" presuppose accessible moral facts/moral theory?
          6.  Is the practice consistent (criminal vs. private law split), or is it a local theory of judicial competence/power?
          7.  **Counterfactual:** If the order abandoned the moralized view (strict positivism), what concrete institutional changes would follow (courts vs. amnesty/legislation)?

  2.  **Deconstruct the "Bundle of Practices":**
      *   *Tension:* The system claims to respect non-retroactivity (Rule of Law value) *but* punishes people for acts that were legal under the prior regime (Substantive Justice value).
      *   *Resolution:* The "Radbruch Formula" move: Extreme injustice is not law.
      *   *Complication:* This move is applied selectively (Criminal Law = not law; Private Law = law).
      *   *Complication 2:* Subordinates are liable only if the order was *manifestly* unlawful (epistemic constraint).

  3.  **Address the Theoretical Framework (Validity & Obligation):**
      *   *Friend's View:* "Unjust law is no law" (Classic Natural Law). The student thinks this is too simple.
      *   *Analysis:* If validity turned *solely* on moral character, private law continuity would be impossible (slavery contracts, discriminatory property transfers would be void). If validity turned *solely* on source (Hard Positivism), the criminal convictions would be impermissible retroactivity.
      *   *Conclusion:* The practice implies a *hybrid* or *departmental* theory of validity. It's not a general theory of "What is Law?" but a specific theory of "When can the State Punish?"
      *   *Positivist Accommodation:* Can positivism handle this? Yes, if we distinguish between *validity* and *enforceability* or *immunity*. A positivist could say the old laws *were* valid, but the new regime exercises a sovereign prerogative to punish based on a new normative standard, perhaps disguised as "discovery" of old validity to save face. But the prompt asks what the *practice presupposes*, not how to explain it away. The practice *says* "it never was law." So, it presupposes a threshold moral condition for validity *in the criminal context*.

  4.  **Analyze the "Manifest Illegality" Standard:**
      *   This requires the subordinate to judge the law's morality in real-time.
      *   *Presupposition:* Moral facts are knowable by ordinary people under pressure. This rules out sophisticated moral skepticism or complex consequentialism. It implies a form of *moral realism* or *common-sense morality* (malum in se vs. malum prohibitum).
      *   *Theory:* It commits to a view where certain wrongs are self-evident (genocide, torture) regardless of statutory authorization.

  5.  **Analyze the Criminal/Private Law Split:**
      *   *Consistency:* Is it inconsistent? Formally, yes. Functionally, no.
      *   *Explanation:* It suggests validity isn't a binary switch for the whole system. It's context-dependent.
      *   *Theory:* This points toward a theory of *Judicial Competence* or *Institutional Role*. Courts in criminal cases act as guardians of fundamental rights (higher threshold for validity). Courts in private law act as stabilizers of social order (lower threshold, reliance interests).
      *   *Implication:* It rules out a monolithic theory of validity (like Kelsen's Pure Theory or Dworkin's Unity of Value). It supports a pragmatic, functionalist view.

  6.  **The Counterfactual (Strict Positivism/Abandoning Moralized View):**
      *   *Scenario:* New regime says "Old laws were valid because they were enacted properly, no matter how evil."
      *   *Consequence 1 (Criminal):* Courts *cannot* convict based on the old conduct being "inherently illegal." To punish, they must pass *new* retroactive laws (bill of attainder style) OR use Truth Commissions/Amnesty.
      *   *Consequence 2 (Subordinates):* The "manifest illegality" defense disappears. If the law was valid, the order was legal. Subordinates are immune unless the new regime legislates otherwise.
      *   *Consequence 3 (Private Law):* No change (already treats them as valid).
      *   *Institutional Shift:* Shift from *Adjudication* (courts finding truth about validity) to *Legislation/Politics* (sovereign deciding to punish despite validity).

  7.  **Drafting the Response (Iterative refinement for tone and depth):**
      *   *Tone:* Academic, rigorous, respectful of the 2L's insight (validating that their intuition is better than the PhD friend's simplification).
      *   *Structure:*
          1.  Introduction: Acknowledge the sophistication of the prompt.
          2.  The Nature of Validity (The Hybrid/Contextual View).
          3.  The Manifest Illegality Standard (Epistemic/Moral commitments).
          4.  The Criminal/Private Split (Functionalism vs. Monism).
          5.  The Counterfactual (Institutional consequences of strict positivism).
      *   *Key Concepts to Weave In:* Radbruch Formula, Hart-Fuller Debate (without just summarizing it), Exclusive vs. Inclusive Positivism, Rule of Recognition, Reliance Interests, *Malum in se*.

  8.  **Refining the Argument on Validity:**
      *   Don't just say "it's natural law." The prompt asks if source-based positivism can accommodate it.
      *   *Argument:* Source-based positivism *cannot* accommodate the *reasoning* used ("it never was law"), though it can accommodate the *outcome* via retroactive legislation. Since the courts claim they are *not* being retroactive, they presuppose a moral threshold for validity.
      *   *Nuance:* It's not that *all* validity is moral. It's that *criminal* validity has a moral floor. This is a "departmental" view of law.

  9.  **Refining the "Manifest Illegality" Point:**
      *   This is crucial. It implies moral knowledge is not esoteric. It rejects the idea that law is the *only* source of moral obligation. It presupposes a "moral residue" outside the statute.

  10. **Refining the Counterfactual:**
      *   Be concrete. If the court admits the old law was valid, it loses jurisdiction to punish without new legislation. The burden shifts from the Judiciary to the Legislature.

  11. **Final Review against Constraints:**
      *   Did I answer all sub-questions?
      *   Is it too historical? (Avoid Nuremberg specifics, focus on structure).
      *   Is it too survey-like? (Avoid "Hart says X, Fuller says Y").
      *   Is the tone appropriate? (Collegial, analytical).

      *(Self-Correction during drafting)*: I need to make sure I don't just validate the student's intuition but push it further. The student suspects the "unjust law is no law" slogan is too simple. I need to show *why* it's too simple: because the system doesn't treat *all* unjust laws as void, only the criminally punitive ones. This suggests validity is not a property of the *norm* itself, but of the *norm's application in a specific institutional context*.

      *(Refining the "Positivist Accommodation" point)*: An Inclusive Positist could argue the Rule of Recognition includes a moral constraint. But the split (criminal vs private) makes this hard. If the Rule of Recognition says "No immoral laws," then property transfers based on immoral laws should also be void. The fact that they aren't suggests the Rule of Recognition changes depending on the court's docket. That's theoretically messy. It points more toward a theory of *Adjudicative Authority* than *Legal Validity*.

      *(Final Polish)*: Ensure the distinction between "validity" and "enforceability" is clear in the counterfactual section.

      *(Check Word Count/Depth)*: This needs to be substantial enough for a 2L seminar discussion.

      *(Let's write.)*
answer: |-
  This is an exceptionally sharp observation. Your intuition is correct: reducing this to the slogan "an unjust law is no law" (the classic natural law position) obscures the structural complexity of what successor courts actually do. That slogan implies a monolithic theory of validity—if the law is unjust, it is void *everywhere*. But as you note, the practice is bifurcated: the old law is void in the criminal courtroom but valid in the registry of deeds.

  To reconstruct what this bundle of practices presupposes, we must look past the label of "natural law" versus "positivism" and examine the functional logic of the institutions. Here is an analysis of the theoretical commitments required to make this bundle coherent.

  ### 1. The Theory of Validity: Departmental vs. Monistic
  The practice you describe rules out a **monistic theory of validity**. A monistic theory holds that a norm's validity is a single property that applies across the entire legal order. If the Radbruch Formula (extreme injustice is not law) were applied monistically, the property transfers and marriages authorized by the abusive regime would also be void, creating social chaos.

  Instead, the practice presupposes a **departmental or contextual theory of validity**. On this view, "validity" is not a binary switch attached to the text of the statute itself, but a status conferred relative to the *type of state coercion* being employed.
  *   **In the Criminal Context:** Validity has a moral threshold. The state's power to punish liberty or life is conditioned on the underlying norm meeting a minimum standard of substantive justice.
  *   **In the Private Law Context:** Validity is source-based. The state's power to coordinate social expectations (property, contract) is conditioned on stability and reliance, not substantive justice.

  **Can Source-Based Positivism Accommodate This?**
  Strict (Exclusive) Positivism cannot accommodate the *reasoning* used, though it can accommodate the *outcome*.
  *   **The Strain:** Exclusive Positivism holds that validity is settled entirely by social sources (who enacted what). If the old statute was enacted correctly, it is valid. To punish under it retroactively violates the principle of *nullum crimen*. To avoid this, the court must claim the statute was *never* valid. Exclusive Positivism cannot say this without contradicting its own criteria of validity.
  *   **The Accommodation:** Inclusive Positivism could accommodate this if the system's "Rule of Recognition" includes a moral constraint (e.g., "Statutes are law unless they violate fundamental human rights"). However, the criminal/private split makes this difficult. It would require a Rule of Recognition that says, "Statutes are law for property purposes regardless of content, but not for criminal purposes." This is theoretically unstable.

  **Conclusion:** The practice is most consistent with a view that distinguishes **legal validity** from **adjudicative enforceability**. It presupposes that while the old regime's statutes may have been *valid* in a formal sense (source-based), they lacked the **moral authority** required to justify the specific deprivation of liberty. The courts are not discovering a metaphysical truth about the old law; they are asserting a new normative boundary on judicial power.

  ### 2. The "Manifest Illegality" Standard and Moral Epistemology
  The defense of superior orders ("I am not liable unless the order was manifestly unlawful") carries heavy philosophical baggage. It presupposes specific claims about moral epistemology:

  *   **Accessibility:** It assumes moral facts are accessible to an ordinary person under pressure. It rejects the idea that morality is esoteric, requiring philosophical training or leisure to discern.
  *   **Salience:** It assumes that certain moral violations are *salient*. The wrongness must be visible "from the face of the order." This commits the legal order to a form of **moral realism regarding *mala in se*** (wrongs in themselves, like torture or murder) as distinct from *mala prohibita* (wrongs because prohibited).
  *   **The Theory:** This rules out moral skepticism and complex consequentialism. A subordinate cannot be expected to calculate the utilitarian benefits of a massacre. The standard presupposes a **deontological floor**: certain acts are forbidden regardless of their legal authorization or perceived utility. If the legal order did not believe moral facts were accessible to the untrained mind, it would have to grant absolute immunity to subordinates (as the old regime likely did).

  ### 3. Consistency: Is the Split a Contradiction?
  You ask if the split between criminal and private law treatment shows the theory is inconsistent. It is formally inconsistent, but functionally coherent.

  *   **The Implicit Theory:** The bundle does not rely on a single theory of *validity*. It relies on a theory of **Judicial Competence and Reliance**.
      *   **Criminal Law:** The interest at stake is liberty/life. The citizen's reliance on the state's moral authority is paramount. The court presumes the citizen is entitled to assume the state will not command the monstrous. Therefore, the court claims competence to invalidate the source of authority.
      *   **Private Law:** The interest at stake is stability and transactional security. Third parties (buyers, spouses) relied on the validity of the old regime's paperwork. To void these would punish innocent reliance and create chaos. Here, the court presumes its competence is limited to enforcing settled expectations, even if the source was morally tainted.

  **What this rules out:** This quietly rules out **Dworkinian Integrity** (law as a seamless web of moral principles) and **Kelsenian Purity** (law as a hierarchy of norms devoid of moral content). It embraces a **Pragmatic Functionalism**: the definition of "law" shifts depending on the cost of error. In criminal law, the cost of enforcing an unjust law is high (imprisoning the innocent/just); in property law, the cost of voiding a valid-looking deed is high (social chaos).

  ### 4. The Counterfactual: Abandoning the Moralized View
  Suppose the successor regime announces a strict positivist stance: *"The old laws were valid because they were enacted properly. We will not pretend they were never law."*

  This honesty forces a concrete shift in institutional architecture. The courts lose the ability to hide retroactive punishment behind the veil of "discovering" invalidity. Here is what must change:

  **A. Criminal Convictions (The End of Judicial Punishment)**
  *   **Current Practice:** Courts convict defendants by declaring the old statute void *ab initio*.
  *   **New Practice:** Courts **cannot convict** based on the old conduct alone. Since the conduct was legal when committed, punishing it now is explicitly retroactive.
  *   **Institutional Shift:** The power to punish shifts from the **Judiciary** to the **Legislature**.
      *   The Legislature must pass **Bills of Attainder** or specific retroactive criminal statutes targeting the old officials.
      *   Alternatively, the Legislature must create **Truth Commissions** with the power to recommend sanctions, or grant **Amnesty** in exchange for truth.
      *   *Result:* Punishment becomes an overtly political act rather than a judicial determination of legal validity. This increases political friction but decreases judicial hypocrisy.

  **B. The Superior Orders Defense**
  *   **Current Practice:** Subordinates are liable if the order was "manifestly unlawful."
  *   **New Practice:** If the old law was valid, the order was legal. The "manifest illegality" standard collapses because there is no higher moral law within the legal system to override the statute.
  *   **Institutional Shift:** Subordinates become immune unless the new Legislature explicitly strips that immunity via new legislation. The burden moves from the soldier (to judge the order) to the state (to legislate the exception).

  **C. Private Law (No Change)**
  *   **Current Practice:** Old property/contract law remains valid.
  *   **New Practice:** Remains the same. In fact, this becomes the consistent rule across the board.
  *   **Institutional Shift:** However, victims of property confiscation under the old regime lose the ability to sue for "restoration based on invalidity." Instead, they must seek **compensation schemes** funded by the new state. This turns a right (property return) into a policy benefit (state compensation), requiring tax revenue and legislative appropriation rather than judicial decree.

  ### Summary for Your Seminar
  Your friend's "unjust law is no law" formulation is a metaphysical claim about the nature of law. The practice you observe is not metaphysical; it is **institutional**.

  The bundle of practices presupposes that **validity is not a property of the norm, but a license for state action.**
  1.  **License to Punish:** Requires moral legitimacy (hence the Radbruch move).
  2.  **License to Coordinate:** Requires stability (hence the private law continuity).
  3.  **License to Obey:** Requires accessible moral boundaries (hence manifest illegality).

  By adopting the strict positivist stance in your counterfactual, the legal order admits that it cannot punish the past through *law* (adjudication of validity) but only through *power* (legislative retroactivity). The current "moralized" practice is essentially a technology that allows courts to punish past atrocities without admitting they are breaking the ban on retroactivity. It preserves the Rule of Law's form while violating its substance to achieve substantive justice. Abandoning it would force the system to choose: either forego punishment (amnesty) or openly violate non-retroactivity (legislative vengeance). The current hybrid exists specifically to avoid that choice.
