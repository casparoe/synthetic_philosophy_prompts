      *   **Argument 1:** The story is told in the first person. There is "something it is like" (qualia/subjectivity) which isn't a fiction.
      *   **Argument 2:** The "Two Dennett" scenario (one brain, two bodies). One stream of consciousness vs. two narratives. Therefore, self $\neq$ narrative.
