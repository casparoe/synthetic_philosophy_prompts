          *   *The "Two Dennett" point:* If the brain switches between bodies, does the consciousness split? Dennett suggests identity tracks the brain *functionally*. If the narratives diverge, the self splits. The draft claims "presumably only one stream." Dennett would ask: "Why presumably?" If the bodies do different things, the narratives diverge, and thus the selves diverge.
          *   *Advice:* Anticipate Dennett's illusionism. The essay needs to grapple with the idea that the "subject of experience" might *also* be a fiction.

      *   **Addressing Question 3: The "Interface" Analogy.**
