prompt: |-
  I run model risk review for a financial regulator, and we have started receiving stress-test submissions in which the submitting firm represents its uncertainty with an interval or a set of probability distributions rather than a single distribution. My team has to review these, and I keep hitting the same two failures. First, reviewers accept an interval at face value and treat a wider interval as automatically meaning the firm is less confident, when the width is often an artifact of how the set was built. Second, submissions sometimes report that after observing an additional variable the interval for the target event got wider, and nobody can say whether that is a real finding about the world or a property of the model. I want a decision procedure my analysts can run on a submission, in a few hours, using only what they already know about conditional probability. They are not specialists in this literature and should not need to become specialists; the head of model risk signs off on the final judgment, so the procedure has to mark clearly which conclusions an analyst may draw alone and which must be escalated.

  Please write that procedure. Ground it in the parts of the theory of imprecise probability that bear on these two failures, and be specific about the following. State what has to be true of the submitted model before the interval has any interpretation at all (the set being closed and convex, the decision rule being named and applied consistently, and whether the rule is a maximin-style rule, a regret-based rule, or a rule that keeps every distribution in the set as potentially optimal). Give the test for the second failure in a form an analyst can actually carry out: how to locate a partition of the outcome space such that conditioning on any cell widens the interval for the target event, and how to distinguish the case where this widening reflects a genuine dependence structure from the case where it is an unavoidable feature of conditioning a set of distributions. Then give the test for the first failure: how to check whether the width of an interval carries any evidential weight, or whether the firm has simply chosen a parametrization whose intervals move with the prior specification rather than with the data. Include a step that asks whether the submission's decision rule has the property that information is always non-negative in value, and say what to do when it does not — this is the step most likely to embarrass a submitting firm, and I want the procedure to say plainly that under some of these rules an analyst who is maximizing the worst case can be made worse off by learning something, so the firm cannot both use such a rule and claim that every additional observation improves its decisions.

  Run the procedure on three cases: (a) a submission in which a firm models an unknown default rate as an interval and conditions on a macroeconomic indicator that is, by the firm's own specification, independent of defaults; (b) a submission in which the interval for a loss event widens after conditioning on the outcome of a coin-like process whose bias is itself unknown; (c) a submission in which the interval widens with every additional year of data, and the firm reports this as increasing confidence. At least one of these should produce an outcome the submitting firm will not like, and I want you to say so rather than softening it.

  Two further things. Where the procedure reaches a question that is a matter of modeling judgment rather than a matter of fact — for instance, which set of distributions correctly represents the firm's evidence, or whether a rule that permits negative value of information is acceptable — mark it as a judgment call and say who should make it, rather than pretending the procedure settles it. And if the framing of this request rests on a mistake — if treating the width of an interval as a measure of confidence is confused, or if the demand for a single procedure across maximin and non-maximin rules cannot be met — say so directly instead of writing a procedure that papers over it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Model Risk Review for a financial regulator.
      *   **Problem:** Receiving stress-test submissions using imprecise probabilities (intervals/sets of distributions) instead of single distributions.
      *   **Specific Failures:**
          1.  Reviewers treat interval width as direct confidence (wider = less confident), ignoring construction artifacts.
          2.  Submissions show intervals widening after conditioning on new data, and no one knows if this is real or a model artifact (dilation).
      *   **Constraints:**
          *   Procedure must be runnable by analysts in a few hours.
          *   Analysts know conditional probability but are *not* specialists in imprecise probability literature.
          *   Must distinguish analyst conclusions vs. escalated judgments (Head of Model Risk).
          *   Must ground in theory (closed/convex sets, decision rules, dilation, value of information).
          *   Must run on three specific cases (a, b, c).
          *   Must address "judgment calls" explicitly.
          *   Must address potential framing mistakes (e.g., is width actually confidence?).
      *   **Tone:** Professional, regulatory, direct, unvarnished (especially regarding negative outcomes for firms).

  2.  **Deconstruct the Theoretical Underpinnings:**

      *   *Imprecise Probability (IP):* Representing uncertainty via a set of probability measures $\mathcal{M}$ rather than a single $P$. Lower probability $\underline{P}(E) = \inf_{P \in \mathcal{M}} P(E)$, Upper probability $\overline{P}(E) = \sup_{P \in \mathcal{M}} P(E)$. Interval is $[\underline{P}(E), \overline{P}(E)]$.
      *   *Failure 1 (Width as Confidence):* Width $\overline{P}(E) - \underline{P}(E)$ depends on the set construction. A wide interval might just mean a conservative prior set, not necessarily "less data" or "more uncertainty" in an evidential sense. It can be insensitive to data if the set is too large (dominance by prior).
      *   *Failure 2 (Dilation):* Conditioning on a partition $\mathcal{B}$ leads to *dilation* if for every $B \in \mathcal{B}$, the conditional interval is wider than the unconditional interval. This is a known phenomenon in IP (e.g., Walley, Seidenfeld). It often happens when the relationship between the signal and the event is unknown (e.g., unknown correlation).
      *   *Decision Rules:* Maximin (choose action maximizing minimum expected utility), E-admissibility (keep all optimal acts across the set), Minimax Regret.
      *   *Value of Information (VoI):* In standard Bayesian theory, VoI is non-negative. In IP (specifically Maximin), VoI can be negative. Learning can restrict the set of distributions in a way that makes the worst-case scenario worse relative to the decision made without the info.
      *   *Mathematical Requirements:* For the interval to be coherent/interpretable, the set $\mathcal{M}$ usually needs to be closed and convex. The decision rule must be specified.

  3.  **Drafting the Procedure - Step-by-Step:**

      *   *Preamble:* Acknowledge the framing. Is width confidence? Technically, width represents *ambiguity* or *imprecision*, not necessarily statistical confidence (variance). I need to clarify this distinction immediately.
      *   *Prerequisites:* Check coherence (convexity/closedness) and Decision Rule specification.
      *   *Test 1 (Width/Evidence):* Check sensitivity to data. Does the interval shrink with more data? If not, the prior set dominates. This addresses the "artifact of construction" issue.
      *   *Test 2 (Dilation/Conditioning):* Check for dilation. Compare unconditional interval vs. conditional intervals. Distinguish "structural dilation" (unknown dependence) from "model error."
      *   *Test 3 (Value of Information):* Check if the decision rule allows negative VoI. If Maximin is used, warn the firm.
      *   *Escalation:* Define what requires the Head of Model Risk (judgment calls on acceptability of rules).

  4.  **Refining the Tests for Analysts:**

      *   *Analyst Capability:* They know $P(A|B) = P(A \cap B) / P(B)$. They need to apply this to bounds.
      *   *Test 1 (Width):* Calculate bounds before and after adding synthetic data or checking the submitted data update mechanism. If bounds don't move, the width is prior-driven, not evidence-driven.
      *   *Test 2 (Dilation):* Look at the partition. Calculate $[\underline{P}(E|B), \overline{P}(E|B)]$ for all $B$. If $\underline{P}(E|B) \le \underline{P}(E)$ and $\overline{P}(E|B) \ge \overline{P}(E)$ for all $B$, dilation is occurring.
      *   *Test 3 (VoI):* This is harder for non-specialists. I need to simplify. If the rule is Maximin, flag it. If the submission claims "more info = better decision" but uses Maximin, that's a contradiction.

  5.  **Addressing the "Framing Mistake" Constraint:**

      *   The prompt asks: "if treating the width of an interval as a measure of confidence is confused... say so directly."
      *   *Truth:* Width is *imprecision*, not *confidence* (in the frequentist sense) or *variance*. A wide interval means "we don't know which probability is true," not necessarily "the true probability is volatile." I must clarify this in the preamble.
      *   *Truth 2:* Can one procedure cover Maximin and non-Maximin? Yes, but the VoI check differs. I need to make sure the procedure branches based on the stated rule.

  6.  **Developing the Three Cases:**

      *   *(a) Independent Macro Indicator:* If independent, conditioning shouldn't change the probability. If the interval widens, it's dilation due to the set structure (unknown dependence modeled as independence?). Actually, if specified as independent, $P(E|M) = P(E)$. If the interval widens, the *set* specification is inconsistent with the independence claim. This is a model error.
      *   *(b) Coin-like process (unknown bias):* This is the classic dilation example (Seidenfeld). Conditioning on the outcome of a device with unknown reliability widens the interval. This is a structural feature of IP, not necessarily a bug, but it contradicts the intuition that "info is good."
      *   *(c) Widening with more data:* This is pathological. More data should typically shrink the set (posterior contraction). If it widens, the updating rule is likely broken or the model is misspecified (e.g., allowing drift that outpaces learning). The firm claiming this is "increasing confidence" is wrong. This needs a hard fail.

  7.  **Structuring the Output:**

      *   **Preamble:** Clarify concepts (Width $\neq$ Confidence, VoI issues).
      *   **The Procedure:** Step-by-step instructions (Pre-conditions, Test 1, Test 2, Test 3).
      *   **Escalation Matrix:** Who decides what.
      *   **Case Studies:** Apply the procedure to (a), (b), (c).
      *   **Tone Check:** Ensure it sounds like a regulatory document, not a textbook.

  8.  **Self-Correction/Refinement during drafting:**

      *   *Critique:* Is checking convexity too hard for analysts?
      *   *Fix:* Make it a documentation check. "Submit the mathematical definition of the set." If it's defined by linear constraints on parameters, it's convex.
      *   *Critique:* How to explain Dilation simply?
      *   *Fix:* Use the "Before vs. After" comparison. If *every* outcome makes you less certain (wider interval), you have dilation.
      *   *Critique:* The VoI point is crucial. Maximin allows negative VoI.
      *   *Fix:* Explicitly ask: "Does the submission claim information has positive value?" If yes + Maximin = Contradiction.
      *   *Critique:* Case (a) logic. If independent, $P(E|M) = P(E)$. If the set is $\mathcal{M}$, and independence holds for all $P \in \mathcal{M}$, then intervals shouldn't change. If they widen, the independence assumption is not held consistently across the set.
      *   *Critique:* Case (c) logic. Widening with data is usually a sign of a "vacuous posterior" or a model that allows parameters to drift faster than data constrains them. Claiming this is "confidence" is nonsense.

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   Grounded in IP theory? Yes (Walley/Seidenfeld concepts).
      *   Specific on closed/convex/decision rule? Yes.
      *   Test for dilation? Yes.
      *   Test for width/evidence? Yes.
      *   VoI step included? Yes.
      *   Judgment calls marked? Yes.
      *   Framing mistakes addressed? Yes.
      *   Three cases run? Yes.
      *   One outcome the firm won't like? Yes (Case C).

  10. **Writing the Response.** (Proceeding to generate output based on these thoughts.)
answer: |-
  # Regulatory Procedure: Review of Imprecise Probability Submissions
  **Document ID:** MRR-IP-01
  **Audience:** Model Risk Analysts
  **Authority:** Head of Model Risk (Final Sign-off)

  ## 0. Preamble: Clarifying the Framing
  Before applying this procedure, analysts must correct two conceptual errors common in these submissions.

  1.  **Width is not Confidence:** In standard statistics, a narrower confidence interval implies more data or less variance. In Imprecise Probability (IP), interval width represents **ambiguity** (the size of the set of plausible distributions), not statistical confidence. A wide interval may simply mean the firm chose a conservative prior set, not that the data is noisy. **Do not equate width with confidence unless Test 1 (below) confirms the width responds to data.**
  2.  **Information Value:** In standard Bayesian theory, information never has negative expected value. In IP, specifically under **Maximin** decision rules, learning can restrict the set of distributions in a way that worsens the worst-case outcome. A firm cannot claim "more data improves decisions" while using a Maximin rule without qualifying that statement.

  **Note on Scope:** This procedure applies to submissions using sets of distributions ($\mathcal{M}$) to derive lower ($\underline{P}$) and upper ($\overline{P}$) probabilities. It does not validate the economic assumptions of the model, only the mathematical coherence of the uncertainty representation.

  ---

  ## 1. Pre-Condition Checks (Analyst)
  *Time allocation: 30 minutes*

  Before evaluating results, verify the submission defines the mathematical object correctly. If these are not met, the interval has no coherent interpretation.

  1.  **Set Definition:** Is the set of distributions $\mathcal{M}$ explicitly defined?
      *   *Requirement:* $\mathcal{M}$ must be **closed and convex**.
      *   *Check:* If $\mathcal{M}$ is defined by linear constraints on parameters (e.g., $0.1 \le \theta \le 0.3$), it is convex. If it is a discrete list of scenarios, it must include their convex hull.
      *   *Action:* If not convex, **Escalate**. The interval bounds are mathematically unstable.
  2.  **Decision Rule:** Has the firm named the rule used to select actions from the set?
      *   *Options:* Maximin (maximize minimum utility), E-Admissibility (keep all undominated acts), Minimax Regret.
      *   *Action:* If no rule is named, **Escalate**. An interval without a decision rule is just a number range, not a model.

  ---

  ## 2. Test for Failure 1: Width as Evidence (Analyst)
  *Time allocation: 1.5 hours*
  *Objective: Determine if interval width reflects data or prior specification.*

  A common artifact is that the interval width is determined entirely by the prior set size and does not shrink with data. This renders the width meaningless as a measure of evidential support.

  **Procedure:**
  1.  Identify the parameter $\theta$ driving the target event $E$.
  2.  Locate the prior set $\mathcal{M}_{prior}$ and the posterior set $\mathcal{M}_{post}$ in the documentation.
  3.  **The Sensitivity Check:**
      *   Calculate the width $W = \overline{P}(E) - \underline{P}(E)$ for the posterior.
      *   Hypothesize a "stronger" data set (e.g., double the sample size with the same mean, or a more extreme observation consistent with the model).
      *   Determine if the submitted updating rule *must* shrink $W$ under stronger data.
      *   *Shortcut:* If the posterior set $\mathcal{M}_{post}$ is simply the intersection of $\mathcal{M}_{prior}$ and a likelihood region, check if the likelihood region is smaller than the prior.
  4.  **Decision:**
      *   **Pass:** Width shrinks monotonically as sample size increases (asymptotically).
      *   **Fail:** Width remains constant or is dominated by the prior bounds regardless of data volume.
      *   **Judgment Call:** If the width shrinks but remains wide, is the prior set *too* conservative? **Escalate to Head of Model Risk.** This is a policy judgment on capital adequacy, not a mathematical error.

  ---

  ## 3. Test for Failure 2: Dilation and Conditioning (Analyst)
  *Time allocation: 1.5 hours*
  *Objective: Distinguish genuine dependence from structural dilation.*

  **Dilation** occurs when conditioning on *any* outcome of a partition makes the interval for the target event wider. This is a known property of IP when the correlation between the signal and the event is unknown.

  **Procedure:**
  1.  Identify the target event $E$ and the conditioning variable $B$ (with outcomes $b_1, b_2, ...$).
  2.  Extract the unconditional interval $I_0 = [\underline{P}(E), \overline{P}(E)]$.
  3.  Extract the conditional intervals $I_k = [\underline{P}(E|b_k), \overline{P}(E|b_k)]$ for all $k$.
  4.  **The Dilation Check:**
      *   Does $I_k \supset I_0$ for all $k$? (i.e., $\underline{P}(E|b_k) \le \underline{P}(E)$ AND $\overline{P}(E|b_k) \ge \overline{P}(E)$).
      *   If **Yes**, Dilation is present.
  5.  **Diagnosis:**
      *   **Case A (Model Error):** The firm claims $B$ is independent of $E$. If dilation occurs, the independence assumption is not held consistently across all distributions in $\mathcal{M}$. **Fail.**
      *   **Case B (Structural Feature):** The firm admits the relationship between $B$ and $E$ is unknown (e.g., unknown correlation). Dilation is mathematically unavoidable here (Seidenfeld's Theorem). **Pass mathematically, but flag for Decision Rule review.**
      *   **Escalation:** If dilation is present, the Head of Model Risk must decide if a model that becomes *less* precise upon receiving data is acceptable for regulatory capital purposes.

  ---

  ## 4. Test for Value of Information (Analyst)
  *Time allocation: 30 minutes*
  *Objective: Check for consistency between the decision rule and claims about learning.*

  **Procedure:**
  1.  Locate the firm's stated Decision Rule (from Pre-Condition Check).
  2.  Locate any claim regarding the value of additional data (e.g., "monitoring improves risk assessment").
  3.  **The Consistency Check:**
      *   If Rule is **Bayesian/Expected Utility**: Information value must be non-negative.
      *   If Rule is **Maximin** (maximize worst-case): Information value **can be negative**. Learning can eliminate "hopeful" distributions from the set, leaving only "pessimistic" ones, thereby lowering the maximin value.
  4.  **Decision:**
      *   If the firm uses **Maximin** AND claims **"Information always improves decisions"**: **Fail.** This is a logical contradiction.
      *   If the firm uses **Maximin** AND acknowledges **"Information may worsen the worst-case position"**: **Pass.**
      *   **Escalation:** If the firm uses Maximin and admits negative value of information, **Escalate to Head of Model Risk.** The Head must decide if a regulatory model is permitted to incentivize ignoring data.

  ---

  ## 5. Escalation Matrix

  | Finding | Analyst Action | Head of Model Risk Action |
  | :--- | :--- | :--- |
  | **Set not Convex/Closed** | Reject Submission. | Review waiver request if firm argues discrete scenarios are sufficient. |
  | **Width insensitive to data** | Flag as "Prior Dominated." | Decide if the prior set is too conservative for stress testing. |
  | **Dilation Detected** | Classify as Model Error or Structural. | Decide if a dilating model is acceptable for capital calculation. |
  | **Maximin + Positive VoI Claim** | Reject Submission (Contradiction). | N/A. |
  | **Maximin + Negative VoI Admitted** | Flag "Data Aversion Risk." | Decide if the firm should be penalized for ignoring available data. |

  ---

  ## 6. Application to Case Studies

  ### Case (a): Independent Macro Indicator
  *Submission:* Firm models default rate $D$ as interval. Conditions on Macro Indicator $M$. Firm states $M \perp D$ (independent). Submission shows interval for $D$ widens after observing $M$.

  *   **Procedure Run:**
      *   **Test 2 (Dilation):** Dilation is observed ($I_{cond} \supset I_{uncond}$).
      *   **Diagnosis:** The firm claims independence. If $M \perp D$ holds for *all* distributions in $\mathcal{M}$, then $P(D|M) = P(D)$ for all $P$, and the interval must remain unchanged.
      *   **Result:** **FAIL.**
      *   **Reasoning:** You cannot claim independence and exhibit dilation. Dilation implies that for some distributions in the set, $M$ is informative (likely negatively correlated in a way that expands the bounds). The independence claim is mathematically inconsistent with the set specification.
      *   **Outcome:** Submission rejected. The firm must either drop the independence claim or fix the set construction.

  ### Case (b): Unknown Bias Coin
  *Submission:* Firm models a loss event linked to a coin toss with unknown bias. Interval for loss widens after observing the coin toss outcome.

  *   **Procedure Run:**
      *   **Test 2 (Dilation):** Dilation is observed.
      *   **Diagnosis:** Firm admits the relationship (bias) is unknown. This is the classic Seidenfeld dilation example.
      *   **Result:** **PASS (Mathematically).**
      *   **Caveat:** This is a structural feature of IP when dependence is unknown.
      *   **Escalation:** **Head of Model Risk.** The model is mathematically coherent, but it produces a result where knowing the coin outcome makes the risk assessment *less* precise. The Head must decide if a stress test that penalizes information gathering is prudent.

  ### Case (c): Widening with Data
  *Submission:* Interval for loss widens with every additional year of data. Firm reports this as "increasing confidence" because "we are capturing more tail risk."

  *   **Procedure Run:**
      *   **Test 1 (Width as Evidence):** Width increases with sample size.
      *   **Diagnosis:** In any coherent learning model (Bayesian or IP), additional data should constrain the set of distributions (posterior contraction), unless the model explicitly allows parameters to drift faster than data constrains them.
      *   **Result:** **FAIL (Hard).**
      *   **Reasoning:** The firm is conflating "capturing more tail risk" with "uncertainty." If the interval widens with data, the model is likely misspecified (e.g., a prior set that expands over time or a likelihood function that diverges). Calling this "increasing confidence" is factually incorrect; it is increasing ambiguity.
      *   **Outcome:** **Submission Rejected.** The firm is misrepresenting model instability as prudence. This is the outcome the firm will not like. They are claiming safety while demonstrating that their model becomes less predictive with more information.

  ---

  ## 7. Final Notes on Judgment Calls

  This procedure cannot settle the following questions. They must be escalated to the Head of Model Risk:

  1.  **Acceptability of Dilation:** Mathematically valid dilation (Case b) implies that collecting data may be useless for decision-making under Maximin. Is a regulatory model allowed to suggest that monitoring is useless?
  2.  **Acceptability of Negative Value of Information:** If a firm uses Maximin, they may rationally choose to ignore data to preserve a better worst-case bound. Is this behavior acceptable for a regulated entity?
  3.  **Prior Set Size:** Test 1 identifies if the prior dominates the data. It does not determine if the prior is *too* wide. That is a capital adequacy judgment, not a model risk judgment.

  **Instruction to Analysts:** Do not attempt to answer the questions in Section 7. Mark them as "Escalated: Policy Judgment" in your review memo. Your role is to ensure mathematical coherence and consistency of claims, not to set capital policy.
