      **NOBM Replaces Subjective Surveys with Revealed Preference Index**

      **VALORIA CITY, 14 October 2024** — The National Office of Behavioural Metrics (NOBM) announced today the immediate discontinuation of all self-reported wellbeing instruments, including life-satisfaction scales and mood diaries. Effective next fiscal quarter, national welfare will be measured exclusively via the new Revealed Preference Index (RPI). The Index aggregates administrative records of actual citizen choices: procurement transactions, enrolment renewals, employment terminations, and contract signatures.

