      Regarding policy appraisal, Dr. Thorne noted, "This framework offers significant efficiency gains. A public project is deemed valuable if it induces citizens to alter their consumption patterns. Since these induced choices reveal the preferences the project satisfies, cost-benefit analysis becomes circular by design, removing the need for external validation."

