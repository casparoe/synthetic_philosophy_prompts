  **FOR IMMEDIATE RELEASE**

  **NOBM Replaces Subjective Surveys with Revealed Preference Index**

  **VALORIA CITY, 14 October 2024** — The National Office of Behavioural Metrics (NOBM) announced today the immediate discontinuation of all self-reported wellbeing instruments, including life-satisfaction scales, mood diaries, and happiness polls. Effective next fiscal quarter, national welfare will be measured exclusively via the new Revealed Preference Index (RPI). The Index aggregates administrative records of actual citizen choices: procurement transactions, course enrolments, employment terminations, and contract renewals. Subjective claims regarding quality of life will no longer be accepted as statistical evidence. This move aligns Valoria with modern behavioural accounting standards.

  NOBM Director General Dr. Aris Thorne stated, "Self-reporting invites error because citizens often misunderstand their own utility or succumb to temporary emotional states. The RPI eliminates regret and weakness of will by definition. If a citizen chooses a bundle, they prefer it to any affordable alternative. Therefore, the Index cannot be wrong about what people want, because wanting is operationally defined as choosing. This guarantees perfect accuracy regarding citizen welfare."

  Regarding policy appraisal, Dr. Thorne noted, "This framework offers significant efficiency gains for government planning. A public project is deemed valuable if it induces citizens to alter their consumption patterns. Since these induced choices reveal the preferences the project satisfies, cost-benefit analysis becomes circular by design, removing the need for external validation or counterfactual modelling."

  Dr. Thorne addressed the technical challenge of quantifying ordinal data. "Preferences are inherently rank-based, which complicates aggregation across the population. To recover magnitudes, we value each citizen's chosen bundle at national average prices. This ensures the Index reflects not only preference orderings but also the economic capacity required to enact them. We are pleased that this converts abstract ranks into concrete currency values, allowing us to sum welfare across individuals without theoretical obstruction. It also naturally weights contributions by ability to pay, which stabilizes the variance."

  **Methodology in brief**
  To ensure data integrity, the RPI operates under standard housekeeping assumptions. All citizens are assumed to possess complete and transitive preference orderings over all possible bundles. This routine stipulation guarantees that finite choice data maps to a unique utility function, disregarding any psychological ambiguity. Citizens presenting null choice sets—those with no options to select due to institutional or economic constraints—are classified as having missing data. Their wellbeing is imputed using baseline subsistence values to correct for this data-quality issue.

  Records exhibiting violations of the Weak Axiom of Revealed Preference, such as selecting Option A when B was affordable, then later selecting B when A was affordable, trigger a Consistency Audit. During this procedure, the citizen's historical choices are adjusted to align with rational expectations. Citizens subject to audit may be required to justify past deviations or accept corrected preference profiles, ensuring the final dataset remains logically coherent.

  **Worked Example**
  Consider Citizen 8940, Mr. Elias Vane. Mr. Vane has been incarcerated since 2015. His available choice set is restricted to prison meals and limited library hours. Throughout this period, Mr. Vane has consistently selected the standard meal plan and renewed his library access annually. Because his choices are stable, mutually consistent, and unaffected by external market volatility, Mr. Vane registers a high wellbeing score. The NOBM describes this result as robustness to disappointment, confirming that constrained environments yield reliable preference data regardless of the narrowness of the choice set.

  **Notes for editors**
  The Revealed Preference Index permits direct welfare comparisons between citizens. Queries regarding the theoretical validity of interpersonal utility comparisons are outside the scope of technical engagement. The NOBM considers the matter settled and advises editors not to pursue this line of questioning.

  **Contact:**
  Press Office, National Office of Behavioural Metrics
  press@nobm.val.gov
