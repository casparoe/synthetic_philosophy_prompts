      Records exhibiting violations of the Weak Axiom of Revealed Preference, such as selecting Option A when B was affordable, then later selecting B when A was affordable, trigger a Consistency Audit. During this procedure, the citizen's historical choices are adjusted to align with rational expectations, ensuring the final dataset remains logically coherent.

