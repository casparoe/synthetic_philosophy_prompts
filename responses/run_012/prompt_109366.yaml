prompt: |-
  I run the forecasting desk at a mid-sized public-health analytics unit: six analysts, a quarterly forecast cycle, and a standing commitment that our published numbers are what regional planners use to decide where mobile testing capacity goes. A statistician two desks over has spent the past month telling anyone who will listen that our forecast register is incoherent — that if he were allowed to place a handful of bets at the odds we publish, he could guarantee himself a profit, and that he would happily demonstrate this for a £50 stake against any of us. I have read enough to recognise the shape of the argument: a set of odds that can be assembled into a sure loss is supposed to be defective, and the defect is supposed to lie in the odds rather than in the person holding them. I cannot settle this by argument and I do not want to. What I want from you is a coherence audit — a procedure my analysts can run on their own registers, once a quarter, in under half an hour, with a spreadsheet and no probability theory beyond what I can teach in a single lunchtime session. I will sign off on the results, and an analyst whose register fails has to be told to their face, so the procedure needs to produce findings I can actually deliver, not a score.

  Here is what a register contains, so that the procedure can be built around it. For each question we track, an analyst publishes a single probability; sometimes, when they are unsure, a range instead. Questions come in families: partitions whose outcomes are supposed to be mutually exclusive and exhaustive, conjunctions and disjunctions built from those, conditionals of the form "if X happens, Y is likely", and — the part I care most about — a reflection item, in which each analyst also publishes a forecast of what their own forecast for the same question will be after the next data release. I want the audit laid out as a fixed sequence of tests, ordered so that the cheap and decisive ones come first, with each step stating what it checks, what counts as a failure, what a failure does and does not license us to conclude, and where the test simply cannot decide and a person has to. I want the points where judgment cannot be engineered away marked as such rather than hidden — in particular, I suspect most of the work is done by whoever decides which propositions are genuinely mutually exclusive, and by the question of what to do with an analyst who gives a range, or who says of some event that they would not bet on it at any odds. I also want it to say plainly what a clean audit does *not* establish. My worry is that I will start treating a passed audit as a certificate of quality, when as far as I can tell the whole apparatus tests internal consistency and says nothing at all about whether our numbers are any good. I do not need the case for probabilism made from first principles, and I do not want citations; I need the procedure.

  Finally, run it end to end on three registers, and be willing to reach conclusions I will not enjoy. The first is tidy: a four-way partition summing to 1.06, together with the analyst's own conditional forecasts for two of the branches. The second is the awkward one: an analyst who gives ranges rather than points, refuses to name odds for the tail event, and insists that this makes them immune to the statistician's game. The third is the one I expect to hurt: a register that is internally impeccable — the partition sums to one, every conjunction respects its bounds — but whose reflection item has the analyst promising to move from 0.4 to 0.75 when the next data release arrives while also describing that release as uninformative, and whose conditionals imply they should already have moved. Tell me what the procedure says about that analyst, whether the £50 demonstration is legitimate against any of the three registers, and what I should say to my desk on Monday. I am content to be told that the sceptic is right about numbers I am attached to; I would rather learn it from you than from him.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Role:** Head of a forecasting desk at a mid-sized public-health analytics unit.
      *   **Context:** 6 analysts, quarterly cycle, forecasts drive resource allocation (mobile testing).
      *   **Conflict:** A statistician claims the forecast register is "incoherent" (Dutch Bookable) and offers a £50 bet to prove it.
      *   **Goal:** A "coherence audit" procedure.
      *   **Constraints:**
          *   Must be runnable by analysts in <30 mins.
          *   Tools: Spreadsheet only.
          *   Math level: Teachable in a single lunchtime session (no heavy probability theory).
          *   Output: Fixed sequence of tests (cheap/decisive first).
          *   Content per step: What it checks, failure criteria, what failure implies/doesn't imply, where human judgment is needed.
          *   Explicitly mark where judgment cannot be engineered away (e.g., mutual exclusivity, handling ranges/refusals).
          *   Explicitly state what a *clean* audit does *not* establish (calibration/accuracy).
          *   **Crucial:** Run the audit on three specific hypothetical registers provided in the prompt and draw conclusions (even uncomfortable ones).
          *   **Tone:** Professional, direct, operational, no fluff, no citations, no first-principles defense of probabilism.

  2.  **Deconstruct the "Coherence Audit" (The Procedure):**

      *   *Concept:* Coherence in this context means avoiding a "Dutch Book" (a set of bets guaranteeing a loss). This translates to satisfying the axioms of probability (non-negativity, normalization, additivity).
      *   *Constraint:* Needs to be simple. No complex logic trees.
      *   *Structure:*
          1.  **Normalization Check (Partitions):** Do probabilities sum to 1?
          2.  **Bounds Check:** Are all probabilities between 0 and 1?
          3.  **Logical Consistency (Conjunctions/Disjunctions):** $P(A \text{ and } B) \le P(A)$, $P(A \text{ or } B) = P(A) + P(B) - P(A \text{ and } B)$.
          4.  **Conditional Consistency:** $P(A|B) = P(A \text{ and } B) / P(B)$.
          5.  **Reflection Principle (Martingale Property):** Current forecast should equal expected future forecast. $P_t = E_t[P_{t+1}]$.
          6.  **Handling Ranges/Refusals:** This is the tricky part. Ranges imply interval probabilities. Refusals imply undefined probabilities.
      *   *Ordering:* Bounds -> Partitions -> Logic/Conditionals -> Reflection.
      *   *Judgment Calls:* Defining the partition, interpreting ranges.
      *   *Limitations:* Coherence $\neq$ Accuracy.

  3.  **Drafting the Procedure (Iterative Refinement):**

      *   *Step 1: The Bounds.* Simple. $0 \le p \le 1$. Failure = Incoherent.
      *   *Step 2: The Partition Sum.* Mutually Exclusive & Exhaustive (MEE). Sum must be 1. Tolerance? Let's say 0.01 for rounding, but strictly 1. Failure = Incoherent. *Judgment:* Are they actually MEE?
      *   *Step 3: Logical Relations.* If $A \implies B$, then $P(A) \le P(B)$. If $C = A \land B$, then $P(C) \le \min(P(A), P(B))$.
      *   *Step 4: Conditionals.* $P(A|B) \times P(B) = P(A \land B)$.
      *   *Step 5: Reflection.* $P_{now} = \sum (P_{future\_state} \times P(state))$. Or simpler: If you predict you will change your mind to $X$, your current probability should reflect the weighted average of possible future probabilities. The prompt specifies: "forecast of what their own forecast... will be". So $P_{current} = E[P_{next}]$.
      *   *Handling Ranges:* If range $[L, U]$, check if *any* point in range satisfies coherence. If *no* point works, it's incoherent. If *all* work, it's coherent but imprecise.
      *   *Handling Refusals:* If "no bet", exclude from audit but flag for resource planning risk.

  4.  **Addressing the Three Registers (The Simulation):**

      *   **Register 1 (Tidy):** 4-way partition sums to 1.06. Conditionals on two branches.
          *   *Test:* Partition sum fails (1.06 > 1.01 tolerance).
          *   *Conclusion:* Incoherent. Dutch Book possible.
      *   **Register 2 (Awkward):** Ranges, refuses tail event odds. Claims immunity.
          *   *Test:* Ranges need to be checked for overlap coherence. Refusal means $P$ is undefined.
          *   *Conclusion:* If ranges allow a coherent point, they pass *coherence* but fail *actionability*. Refusal on tail event breaks exhaustiveness if it's part of a partition. The statistician's bet relies on defined odds. If odds are undefined, the bet can't be placed, but the planning utility is broken.
      *   **Register 3 (Hurtful):** Internally impeccable (sums to 1, logic holds). Reflection item: Current 0.4, expects to move to 0.75 on next data. Describes data as "uninformative". Conditionals imply they should have moved already.
          *   *Test:* Reflection Principle violation. If data is uninformative, $P_{next}$ should equal $P_{current}$ in expectation. If they expect to move to 0.75, $P_{current}$ should be closer to 0.75 (or the expected value of the future distribution). Specifically, $P_{now} = E[P_{future}]$. If $P_{now}=0.4$ and they are *sure* (or highly confident) they will move to 0.75, that's a Dutch Book (buy now at 0.4, sell later at 0.75).
          *   *Conclusion:* Incoherent via Reflection Principle. The statistician is right.

  5.  **Refining the Output Structure:**

      *   **Introduction:** Acknowledge the stakes.
      *   **The Procedure:** Step-by-step instructions.
      *   **The Limitations:** What passing means (and doesn't mean).
      *   **The Audit Results:** Application to the three registers.
      *   **The Monday Briefing:** What to tell the team.

  6.  **Self-Correction/Nuance Check:**

      *   *Tone:* Needs to be authoritative but not academic. "Here is the tool."
      *   *Math:* Keep it arithmetic. No integrals.
      *   *The Statistician's Bet:* Is it legitimate? Only if the register implies fixed odds. Ranges complicate this. Reflection violations are subtle but valid for Dutch Books.
      *   *Register 3:* This is the hardest. The violation is the *Reflection Principle* (van Fraassen). If I know I will believe $X$ tomorrow without new evidence, I should believe $X$ today. If the data is "uninformative," the expectation of the future probability must equal the current probability. $0.4 \neq 0.75$. This is a coherence failure.
      *   *Register 2:* The claim of immunity is partially true (you can't bet against undefined odds) but practically false (you can't plan resources). The audit must flag this as "Actionability Failure" rather than just "Coherence Failure."
      *   *Register 1:* Simple arithmetic error. 1.06 is a fail.

  7.  **Final Polish:** Ensure the distinction between *coherence* (logic) and *calibration* (truth) is sharp. Ensure the "Judgment Required" flags are prominent.

      *(Self-Correction on Register 3)*: The prompt says "conditionals imply they should already have moved." This suggests the data *is* available or the logic implies the update should have happened. But the core issue is the Reflection violation. If I predict I will believe 0.75 next quarter, and I believe that prediction now, my current probability *must* be 0.75 (assuming I think the future self is rational and has the same info). If I say "I will move to 0.75" but stay at 0.4, I am asserting my future self knows something I don't, *or* I am incoherent. If the data is "uninformative," I shouldn't move. If I expect to move, the data *must* be informative. Contradiction.

      *(Refining the Procedure for Ranges)*: A range $[L, U]$ is coherent if there exists *some* $p \in [L, U]$ that satisfies all other constraints. If the intersection of constraints is empty, it's incoherent. For the spreadsheet test: Check if $L_{sum} \le 1 \le U_{sum}$ for partitions.

      *(Refining the Statistician's Bet)*: The statistician can only guarantee profit if the odds are fixed and incoherent. If ranges are given, he must pick a point. If the analyst refuses odds, he can't bet. So, for Register 2, the bet is *not* legitimate as stated, but the register is useless for planning.

  8.  **Drafting the Response:** (Mental outline matched to final output).
      *   Header: Coherence Audit Protocol v1.0.
      *   Section 1: The Procedure (Steps 1-5).
      *   Section 2: Limitations (The "What Passing Means" clause).
      *   Section 3: Audit of the Three Registers.
      *   Section 4: Monday Morning Script.

      *Wait, one detail:* "under half an hour, with a spreadsheet and no probability theory beyond what I can teach in a single lunchtime session."
      *Action:* Ensure the steps are formula-based (e.g., `=SUM(B2:B5)`).
      *Action:* Ensure the Reflection test is simple. $P_{current}$ vs $P_{predicted\_future}$.

      *Let's write it.*
answer: |-
  # COHERENCE AUDIT PROTOCOL (v1.0)
  **Owner:** Forecasting Desk Lead  
  **Frequency:** Quarterly (Pre-publication)  
  **Time Budget:** 30 Minutes per Analyst  
  **Tools:** Spreadsheet only. No external software.

  ## PART 1: THE PROCEDURE

  Run these tests in order. If a register fails a step, stop. Record the failure. Do not proceed to subsequent tests until the error is corrected, as later tests depend on earlier ones holding.

  ### Step 1: The Bounds Check
  *   **What it checks:** That no probability is negative or exceeds certainty.
  *   **Spreadsheet Action:** For every cell containing a probability $p$, calculate `=IF(OR(p<0, p>1), "FAIL", "PASS")`.
  *   **Failure Condition:** Any cell returns "FAIL".
  *   **Judgment Required:** None. This is arithmetic.
  *   **Implication:** **Incoherent.** A bookmaker can take the bet on the violating proposition and guarantee a profit against the analyst.
  *   **Correction:** Analyst must resubmit numbers within [0, 1].

  ### Step 2: The Partition Sum
  *   **What it checks:** That mutually exclusive and exhaustive (MEE) lists of outcomes sum to exactly 1.0.
  *   **Spreadsheet Action:** Identify all declared partitions. Sum the probabilities. `=ABS(SUM(Range) - 1)`.
  *   **Failure Condition:** Difference > 0.01 (allowance for rounding).
  *   **Judgment Required:** **High.** The Lead must verify the outcomes are truly MEE.
      *   *Example:* "Case counts <100", "100-500", ">500" is MEE. "Case counts <100", "Case counts >500" is **not** (missing middle).
      *   *Example:* "Outbreak in Region A", "Outbreak in Region B" is **not** MEE (both can happen).
  *   **Implication:** **Incoherent.** If sum > 1, the bookmaker sells you all outcomes; you pay more than the payout. If sum < 1, the bookmaker buys all outcomes from you; you guarantee a loss.
  *   **Correction:** Analyst must normalize probabilities or redefine the partition.

  ### Step 3: Logical Consistency (Conjunctions & Disjunctions)
  *   **What it checks:** That compound events respect their components.
  *   **Spreadsheet Action:**
      *   If $C = A \text{ AND } B$, check `=IF(p_C > MIN(p_A, p_B), "FAIL", "PASS")`.
      *   If $D = A \text{ OR } B$ (where A, B disjoint), check `=IF(ABS(p_D - (p_A + p_B)) > 0.01, "FAIL", "PASS")`.
  *   **Failure Condition:** Any "FAIL".
  *   **Judgment Required:** **Medium.** Analyst must define the logical relationship explicitly in the register metadata.
  *   **Implication:** **Incoherent.** A bookmaker can construct a combination of bets on A, B, and C/D that guarantees a loss.
  *   **Correction:** Align compound probabilities with component probabilities.

  ### Step 4: The Conditional Check
  *   **What it checks:** That conditional probabilities align with joint probabilities.
  *   **Spreadsheet Action:** For any published $P(Y|X)$, verify against published $P(Y \text{ AND } X)$ and $P(X)$. Formula: `=ABS(p_Y_given_X - (p_Y_and_X / p_X))`.
  *   **Failure Condition:** Difference > 0.05 (allowance for stated precision).
  *   **Judgment Required:** **Low.** Only if $P(X)$ is near zero (division instability).
  *   **Implication:** **Incoherent.** A bookmaker can bet on the condition and the outcome separately to lock in a profit.
  *   **Correction:** Recalculate conditionals from joints or vice versa.

  ### Step 5: The Reflection Check
  *   **What it checks:** That current forecasts equal the expected value of future forecasts (assuming rational updating).
  *   **Spreadsheet Action:** Compare Current Probability ($P_{now}$) against the Analyst's Forecast of their Future Probability ($E[P_{next}]$).
      *   Formula: `=ABS(p_now - p_predicted_future)`.
  *   **Failure Condition:** Difference > 0.10 **UNLESS** analyst documents specific, known information arriving before $t_{next}$ that justifies the shift.
  *   **Judgment Required:** **High.**
      *   *Valid Shift:* "We know Lab Results X arrive next week."
      *   *Invalid Shift:* "I feel like the number will go up." or "The next data release is uninformative, but I will change my mind."
  *   **Implication:** **Incoherent.** If you know today that you will believe $0.75$ tomorrow, you should believe $0.75$ today. Failing this allows a bookmaker to buy from you today and sell back to you tomorrow at a guaranteed profit.
  *   **Correction:** Either move $P_{now}$ to match $E[P_{next}]$, or revise the expectation of $P_{next}$.

  ---

  ## PART 2: HANDLING EDGE CASES

  ### Ranges (e.g., "40% to 60%")
  *   **Procedure:** Treat the range as $[L, U]$. The register is **Coherent** if there exists *at least one* point $p$ within $[L, U]$ that passes Steps 1–5. It is **Incoherent** if the constraints force the valid probability outside the stated range.
  *   **Spreadsheet:** Check if $Sum(Lower\_Bounds) \le 1$ AND $Sum(Upper\_Bounds) \ge 1$.
  *   **Implication:** A passing range audit confirms *logical possibility*, not *actionability*.
  *   **Judgment:** **High.** Wide ranges pass coherence but fail planning utility. The Lead must decide if the range is too wide to allocate resources.

  ### Refusals ("I will not bet on this")
  *   **Procedure:** Mark as `NULL`.
  *   **Implication:** **Immune to Dutch Book, Useless for Planning.** You cannot be exploited if you do not post odds, but planners cannot use your work.
  *   **Judgment:** **Critical.** If a partition contains a `NULL`, the partition is incomplete. The register fails Step 2 by definition.

  ---

  ## PART 3: WHAT A CLEAN AUDIT DOES NOT ESTABLISH

  1.  **Accuracy:** A coherent forecast can be perfectly wrong. (e.g., Coherently assigning 100% probability to an event that does not happen).
  2.  **Calibration:** Passing the audit does not mean the analyst is well-calibrated (i.e., that events marked 70% happen 70% of the time).
  3.  **Information Quality:** An analyst can be coherent while ignoring available data.
  4.  **Immunity:** A clean audit prevents a *guaranteed* loss (Dutch Book). It does not prevent *expected* loss against a better-informed opponent.

  **Verdict:** A clean audit certifies that the numbers are **safe to use for linear planning**. It does not certify that they are **true**.

  ---

  ## PART 4: AUDIT OF THE THREE REGISTERS

  I have run the protocol above on the three registers you described. Here are the findings.

  ### Register 1: The Tidy One
  *   **Input:** Four-way partition sums to 1.06. Conditional forecasts on two branches.
  *   **Step 1 (Bounds):** PASS.
  *   **Step 2 (Partition):** **FAIL.** Sum is 1.06. Tolerance is 0.01.
  *   **Finding:** **Incoherent.**
  *   **Statistician's Bet:** **Legitimate.** He buys all four outcomes at your prices. He pays 1.06 units. One outcome must happen. He receives 1.00 unit payout. Wait, that's a loss for him.
      *   *Correction:* If you *sell* bets at implied odds (e.g., prob 0.3 means you sell a ticket for £0.30 that pays £1.00), and the sum is 1.06, you have collected £1.06 in premiums. You only have to pay out £1.00 on the winner. **You guarantee a profit of £0.06.**
      *   *Reverse:* If the statistician *places* bets *against* you (acting as the bookmaker) based on your odds: He sees you value the set of all outcomes at 1.06. He sells you the "Sure Thing" (the set of all outcomes) for £1.00. You pay £1.06 for the parts, but only £1.00 for the whole. He pockets the difference.
      *   **Verdict:** Yes, he can guarantee a profit against this register.
  *   **Action:** Analyst must normalize. This is a clerical error, not a conceptual one.

  ### Register 2: The Awkward One
  *   **Input:** Ranges provided. Tail event refused ("No odds"). Claims immunity.
  *   **Step 1 (Bounds):** PASS (Ranges within 0-1).
  *   **Step 2 (Partition):** **FAIL.** A partition requires exhaustive probabilities. A `NULL` on a tail event means the sum cannot be verified as 1. The set is not exhaustive.
  *   **Finding:** **Actionability Failure.**
  *   **Statistician's Bet:** **Illegitimate.** He cannot place a bet on a `NULL`. He cannot guarantee a profit because the odds are not defined. The analyst is technically safe from the Dutch Book *on that specific item*.
  *   **Operational Reality:** The register is useless for mobile testing allocation. You cannot plan capacity for a "Refused" risk.
  *   **Action:** Analyst must either provide a range (even if wide) or be reassigned to non-quantitative tasks. Coherence is irrelevant if the output is `NULL`.

  ### Register 3: The One That Hurts
  *   **Input:** Partition sums to 1. Logic holds. Current $P = 0.4$. Predicted Future $P = 0.75$. Data described as "uninformative." Conditionals imply update should have happened already.
  *   **Step 1-4:** PASS.
  *   **Step 5 (Reflection):** **FAIL.**
      *   *Logic:* If the data is uninformative, your expectation of your future belief should equal your current belief ($P_{now} = E[P_{next}]$).
      *   *Contradiction:* You state $P_{now} = 0.4$ and $E[P_{next}] = 0.75$.
      *   *Conditionals:* You state conditionals imply the update is already warranted. This means the information is *already* available.
  *   **Finding:** **Incoherent.** This is a violation of the Reflection Principle.
  *   **Statistician's Bet:** **Legitimate.**
      *   *The Play:* The statistician buys a bet from you *now* at 0.4 (pays £0.40, wins £1.00 if event happens). He knows (because you published it) that next quarter you will value this bet at 0.75.
      *   *The Lock:* Next quarter, he sells the bet back to you (or hedges) at 0.75.
      *   *Profit:* He buys low (0.4) and sells high (0.75) based entirely on your published trajectory, regardless of whether the event actually happens. He arbitrages your future self against your current self.
  *   **Action:** This analyst is trading on internal inconsistency. They are either withholding information (the conditionals) or misunderstanding their own updating process. This is the most dangerous failure because it looks clean.

  ---

  ## PART 5: MONDAY MORNING BRIEFING

  **To:** Forecasting Desk
  **From:** Desk Lead
  **Subject:** Quarterly Audit Results and Protocol Implementation

  Team,

  Effective immediately, we are adopting the Coherence Audit Protocol attached to this memo. Every quarterly register must pass this audit before publication. This is not a measure of your accuracy; it is a measure of whether your numbers can be used for resource allocation without guaranteeing a loss to the public purse.

  Regarding the recent challenges raised by the statistics unit:

  1.  **Register 1 (Partition Error):** The sum of 1.06 is a failure. It implies we value the set of all possible outcomes at more than certainty. This will be corrected before publication. This was a clerical normalization error.
  2.  **Register 2 (Ranges/Refusals):** Ranges are permitted only if they remain coherent (Step 2). Refusals to assign probability to defined partition elements are not permitted. If we cannot assign a probability, we cannot plan capacity. If you cannot provide a number, you must provide a range. If you cannot provide a range, that forecast line will be marked "Insufficient Data" and excluded from planning, which impacts our utility to the region.
  3.  **Register 3 (Reflection Violation):** This is the critical finding. An analyst cannot coherently hold a probability of 0.4 today while certifying they will hold 0.75 next quarter without new information. This allows external actors to arbitrage our forecasts against themselves.
      *   *Directive:* If you expect your forecast to move, you must either move it now or document the specific incoming data that justifies the shift. "Uninformative data" cannot justify a probability shift.
      *   *Consequence:* The register in question will not be published in its current form. The analyst responsible is required to reconcile their current probability with their expected future probability before sign-off.

  **Closing:**
  The statistician's offer of a £50 bet is irrelevant to our public health mission. However, his underlying mathematical point is valid: **Incoherent numbers are broken tools.** We build tools for planners. A tool that guarantees a loss is defective.

  Passing this audit does not mean you are right. It means you are consistent. Being consistently wrong is a performance issue. Being incoherent is a procedural failure. We will tolerate the former; we will not tolerate the latter.

  Run the audit on your current drafts by Tuesday noon.

  Signed,
  Desk Lead
