answer: |-
  # Specification for an Adequate Theory of the Doing/Allowing Distinction

  An adequate theory of the doing/allowing distinction must provide a principled method for classifying agent-conduct pairs as either instances of *doing* (acting) or *allowing* (omitting), such that this classification can sustain normative arguments without collapsing into them. The following six desiderata specify the conditions of adequacy.

  1.  **Normative Discriminability**
      *   **Requirement:** The theory must classify cases in a way that explains the variation in moral weight assigned to doing versus allowing. It must account for why the distinction sometimes grounds a difference in wrongness (e.g., murder vs. failure to rescue) and sometimes does not (e.g., euthanasia by injection vs. euthanasia by withdrawal).
      *   **Motivation:** A theory that classifies cases correctly but cannot explain why the classification matters is descriptively accurate but theoretically inert. Conversely, a theory that defines the distinction *by* the moral verdict renders the distinction redundant. The theory must navigate between these poles, handling cases where act/omission verdicts and wrongness verdicts come apart in both directions.

  2.  **Conceptual Independence**
      *   **Requirement:** The criteria for doing/allowing must remain distinct from the criteria for intending/foreseeing and distinct from the criteria for causal contribution.
      *   **Motivation:** If the distinction collapses into the Doctrine of Double Effect, it cannot do independent work in cases where an agent foresees harm but does not intend it. Similarly, if "doing" is defined simply as "being a cause," the theory fails in overdetermination cases where an omission is causally necessary for the outcome. The distinction must track a specific mode of agency, not merely mental states or counterfactual dependence.

  3.  **The Intervention Constraint**
      *   **Requirement:** The theory must classify the cessation of sustained life-support as *allowing* rather than *doing*, despite the physical action required to stop the machine.
      *   **Motivation:** This addresses the **Ventilator Pair (Case a)** and **Sustained Rescue (Case b)**. In the ventilator pair, a physician who never starts ventilation and one who withdraws it are typically judged to have done the same thing (allowed death), yet the latter performs a physical intervention. In sustained rescue, ceasing maintenance is physically positive but normatively negative. A theory that relies on muscular movement or energy expenditure will misclassify these paradigm omissions as doings.

  4.  **Baseline Flexibility**
      *   **Requirement:** The theory must identify the relevant counterfactual baseline (the "normal course of events") without relying on a single, fixed metric such as "nature" or "statistical normality."
      *   **Motivation:** This addresses the **Baseline Problem** and the **Institutional Omission (Case d)**. In the institutional case, two health systems produce identical mortality figures via different rules (declining treatment vs. discharging to die). A fixed natural baseline cannot distinguish these institutional policies. The theory must explain why the baseline shifts depending on institutional roles and expectations without making the baseline entirely arbitrary.

  5.  **Conduct Primacy**
      *   **Requirement:** The classification of an act as doing or allowing must not turn exclusively on the agent's private intentions or motives.
      *   **Motivation:** This addresses **Criminal Law and Clinical Ethics** pressures and the **Engineered Omission (Case c)**. In the engineered omission, an agent arranges affairs so that a death results from their later inaction. If the classification depends solely on the prior intent to kill, the distinction collapses into *mens rea*. Legal and clinical protocols require public, observable criteria for conduct that can be adjudicated without inspecting the agent's mind.

  6.  **Structural Determinacy**
      *   **Requirement:** The theory must specify whether the distinction is binary (an act is either doing or allowing) or scalar (degrees of doing), and ensure the output is applicable by agents with limited information.
      *   **Motivation:** This addresses the **Binary/Scalar Pressure**. Rules and laws generally require binary application, yet moral intuition often suggests gradations. A theory that yields a scalar result must explain how it translates into binary rules; a theory that yields a binary result must explain away the intuitive gradations. The account must be usable by agents who cannot inspect motives or calculate complex counterfactuals in real time.

  ***

  ### Incompatibility Analysis

  There is a fundamental tension between **Desideratum 3 (The Intervention Constraint)** and **Desideratum 5 (Conduct Primacy)**.

  **The Argument for Incompatibility:**
  Desideratum 5 demands that the classification of doing/allowing rely on observable conduct rather than hidden motives or normative status. Desideratum 3 demands that physically positive interventions (switching off a ventilator, removing a feeding tube) be classified as *allowing*. Taken strictly, these are contradictory. If we adhere to Conduct Primacy, the physical movement of switching off a ventilator is a *doing*. If we adhere to the Intervention Constraint, that same physical movement is an *allowing*. To satisfy the Intervention Constraint, one must appeal to something *other* than the physical conduct—typically a normative baseline regarding the patient's right to treatment or the physician's duty. However, appealing to rights or duties to determine the classification violates Conduct Primacy, as it makes the metaphysical classification dependent on the very normative facts the distinction is supposed to help adjudicate.

  **Recommendation:**
  **Desideratum 5 (Conduct Primacy)** must be abandoned in its strict form. We cannot maintain a purely descriptive, physicalist account of conduct if we wish to capture the moral reality of cases like the ventilator pair. The specification should be revised to require **Public Accessibility** rather than Conduct Primacy. The criteria for the distinction must be publicly accessible (like conduct), but they may include normative facts (such as duties and rights) that are socially established, rather than raw physical movements. This allows the theory to classify withdrawing treatment as allowing (because there was no duty to continue) without requiring access to private motives, satisfying the spirit of the law/ethics constraint without being trapped by physicalism.

  ***

  ### The Exclusionary Requirement

  The single requirement that does the most to exclude the standard families of account is **Desideratum 1 (Normative Discriminability)**, specifically the clause requiring the theory to explain *why* the difference matters where it does and is idle where it is not.

  Purely **causal accounts** fail this because causation is binary and constant; they cannot explain why causal contribution is sometimes worse than causal allowance and sometimes not. **Intention-based accounts** fail because they collapse the doing/allowing distinction into the intending/foreseeing distinction, rendering it unable to explain cases where the intention is identical but the moral weight differs. **Baseline or status-quo accounts** fail because a descriptive baseline cannot explain normative weight without smuggling in moral premises, which risks circularity. Only a theory that can link the metaphysical distinction to variable normative force without collapsing into that force can satisfy Desideratum 1.
