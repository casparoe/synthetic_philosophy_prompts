answer: |-
  Here is a session plan designed to bypass your audience's immunological response to "new" causal theories. Since they are fluent in Potential Outcomes (PO) and DAGs, they will treat any new theory as a subset of what they already know unless you force a wedge between the *math* they use and the *metaphysics* they assume.

  ### 1. The Dependency Structure (Order of Operations)

  You cannot start with definitions. If you define "Counterfactual Theory" first, they will hear "Rubin Causal Model." If you define "Intervention" first, they will hear "RCT." You have to decouple the *framework* from the *interpretation*.

  **Sequence:**
  1.  **The Frame (5 mins):** Acknowledge their fluency. State clearly: "We all use the Potential Outcomes *math*. Today is not about the math; it's about what makes a causal claim *true*. Is it truth conditions (Counterfactual) or stability conditions (Interventionist)?"
  2.  **The Trap (10 mins):** Define the **Counterfactual Theory of Causation (Lewis-style)**. Do *not* use $Y(1)$ notation yet. Use natural language: "$C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred." Ask them to accept this as the "Standard View" for the sake of argument.
  3.  **The Wedge (10 mins):** Introduce **Interventionism (Woodward-style)** *before* the example. Define an intervention not as an experiment, but as a **variable setting that breaks incoming arrows**. Crucial distinction: An intervention is a *theoretical operator*, not a human act.
  4.  **The Carrying Example (20 mins):** Apply both theories to the single case.
  5.  **The Collapse (15 mins):** Address misconceptions explicitly now that they've felt the tension.

  **Why this order?**
  You must define "Intervention" as a *structural break* before they see the example. If you show the example first, they will try to solve it using adjustment sets. By defining intervention as "breaking incoming arrows" first, you prime them to look for *structure*, not *confounding*.

  ### 2. The Carrying Example

  **Verdict on your suggestions:**
  *   **Firing Squad (Overdetermination):** **Trap.** In strict overdetermination (both shoot simultaneously), *both* theories struggle, and it devolves into legalistic semantics about "sufficient sets." It distracts from the core philosophical distinction.
  *   **Flagpole/Shadow:** **Good, but risky.** It illustrates asymmetry well, but epidemiologists might dismiss it as "time-ordering is obvious," missing the theoretical point about directionality.

  **Recommendation: Late Preemption (The "Assassin" Case)**
  This is the sharpest wedge for token causation.
  *   **The Case:** Assassin A shoots Victim. Assassin B is standing by, ready to shoot if A misses or hesitates. A shoots, V dies. B does nothing.
  *   **Why this works:**
      *   **Counterfactual Theory Verdict:** If A had not shot, B *would have* shot. V still dies. Therefore, V's death does *not* counterfactually depend on A's shot. Strict counterfactual theory says A did **not** cause the death. (This contradicts intuition).
      *   **Interventionist Verdict:** We intervene on A's shot (set $Shot_A = 0$). We must hold the *structure* fixed. In the actual causal path, A's shot fired. If we intervene to stop A, we are testing the *actual* mechanism. Because the backup mechanism (B) was *inactive* in the actual token event, the intervention on A changes the outcome *along the active path*. A **did** cause the death.
  *   **Why for this audience?** It prevents them from "adjusting for B." B is not a confounder; B is a *backup mechanism*. It forces them to see that Counterfactual Dependence (the math they know) can fail to capture Token Causation (the reality they want to explain), whereas Interventionism (tracking active paths) captures it.

  **Alternative (if Preemption feels too philosophy-heavy): The Barometer/Storm.**
  *   **Case:** Barometer falls ($B$), Storm comes ($S$). Common cause: Pressure drop ($P$).
  *   **Counterfactual:** In the actual history, if $B$ hadn't fallen, $S$ wouldn't have happened (because $P$ wouldn't have dropped). Dependence holds.
  *   **Interventionist:** If we *intervene* on $B$ (set needle to 'High' without changing $P$), $S$ still happens. Causation fails.
  *   **Risk:** Epidemiologists will immediately say "That's just confounding." You have to fight hard to make them see this as a *definition of causation* problem, not an *identification* problem. **Stick with Preemption** if you want to avoid them solving it with DAG adjustment.

  ### 3. The Misconceptions (Timing is Critical)

  You identified three major risks. Here is exactly when to neutralize them:

  **1. "Counterfactual Theory = Potential Outcomes Framework"**
  *   **When:** **The Frame (Start of session).**
  *   **How:** Explicitly state: "The Potential Outcomes *notation* ($Y(1), Y(0)$) is compatible with *both* theories. Lewis (Counterfactual) and Woodward (Interventionist) can both write down the same equations. The disagreement is about what makes the equation *causal*."
  *   **Why:** If you don't do this, they will think you are attacking RCM. You are attacking the *interpretation* of RCM.

  **2. "Intervention = Experiment (RCT)"**
  *   **When:** **The Wedge (Before the example).**
  *   **How:** When defining Interventionism, say: "An intervention is not something a human does. It is a change in the value of a variable that severs its dependence on parents. We can talk about interventions on gender, race, or geology, provided we can define the variable setting theoretically."
  *   **Why:** If they think Interventionism requires an RCT, they will dismiss it as "just experimental design." You need them to see it as a *theory of causation* that applies to observational data.

  **3. "Intervention = Human Act"**
  *   **When:** **During the Example (Application).**
  *   **How:** When discussing the Assassin case, clarify: "We aren't asking if a human *could* stop the assassin. We are asking if the *structure* of the situation is such that changing $Shot_A$ changes $Death$, holding the backup mechanism inactive."
  *   **Why:** This prevents them from arguing about feasibility. It keeps the focus on *invariance*.

  ### 4. The Closing Question

  Do not ask "Do you understand?" Ask a question that forces them to choose between *Dependence* and *Invariance*.

  **The Question:**
  > "Imagine we find a genetic marker $G$ that perfectly predicts Disease $D$ in all observed populations. However, due to biological pleiotropy, any attempt to modify $G$ (even in principle) disrupts the cellular machinery such that $D$ occurs anyway via a different pathway.
  >
  > **Is $G$ a cause of $D$?**"

  *   **Counterfactual Answer:** Yes. (In the observed world, if $G$ were absent, $D$ would be absent).
  *   **Interventionist Answer:** No. (There is no *stable* intervention on $G$ that changes $D$; the relationship is not invariant to manipulation).
  *   **Why this works:** It separates "Perfect Prediction/Dependence" from "Causal Leverage." It reveals if they view causation as describing the *world as it is* (Counterfactual) or the *world under change* (Interventionist).

  ### 5. What to Explicitly Skip

  To keep this to 60 minutes and avoid getting bogged down in technicalities that blur the distinction, announce at the start that you are **bracketing** the following:

  1.  **Modularity Assumptions:** Don't get into the weeds of whether the structural equations remain invariant. Assume they do for the sake of the example.
  2.  **Type vs. Token:** Acknowledge the distinction, but state you are focusing on *Token* (actual occurrence) for the example, as that's where the theories diverge most sharply.
  3.  **Pearl vs. Woodward:** They are allies here. Don't split hairs between $do$-calculus and Woodward's manipulability. Treat them as the "Interventionist Camp" vs. the "Lewis/Counterfactual Camp."
  4.  **Possible Worlds Semantics:** Do not explain Lewis's similarity metrics for possible worlds. It's a distraction. Just use the intuitive "If C hadn't happened..." phrasing.

  ### Summary Checklist for the Board
  1.  **Frame:** Math $\neq$ Metaphysics.
  2.  **Define:** Counterfactual (Dependence) vs. Intervention (Invariance/Path).
  3.  **Example:** Late Preemption (Assassin).
  4.  **Trap:** Intervention $\neq$ Human Experiment.
  5.  **Test:** The Immutable Genetic Marker.
  6.  **Skip:** Modularity details, Pearl/Woodward infighting.
