      *My advice:* Flagpole is good for asymmetry. Firing Squad is good for preemption. But for *this* audience, the **Barometer** is the most dangerous trap because they will conflate it with "Confounding."
      *Decision:* I will recommend the **Barometer/Storm** case but frame it carefully so they don't dismiss it as "just confounding." I will also validate the **Firing Squad** but warn about the "Overdetermination" vs "Preemption" distinction.
      *Actually, the strongest wedge for Interventionism is **Invariance**.*
      Let's suggest a **Policy/Structural** example. "Tax rates cause Revenue."
      No, let's stick to philosophy.
      *Revised Plan:* Use the **Firing Squad (Preemption)** as the primary token case. It forces the "Dependence" theory to fail (because the effect happens anyway). Interventionism saves it by looking at the *process/path*.
      *Wait, Woodward handles Preemption via "Active Paths."*
      Okay, I need to be precise.
      *Simple Counterfactual:* If $C$ hadn't happened, $E$ wouldn't have.
      *Preemption:* $C$ happens, $E$ happens. Backup $D$ exists. If $C$ hadn't happened, $D$ would have, so $E$ still happens. Simple Counterfactual says $C$ is not a cause. Intuition says $C$ is a cause.
      *Interventionist:* If we intervene to stop $C$ *along the specific path*, does $E$ change?
      This works.
      *But the Barometer is better for "Intervention $\neq$ Experiment".*
