answer: |-
  This is one of the classic problems of liberal political philosophy and ethics, often discussed under the headings of *precommitment*, *autonomy*, and the *dead hand of the past*. You have correctly identified that "Ropes not Chains" is the right intuition, but you are struggling to formalize the difference between a rope that helps you climb and a chain that holds you down.

  The principle that reconciles almost all of your verdicts is **The Agency-Preservation Principle.**

  It states: *You may bind your future self only if that binding preserves or restores their capacity for meaningful agency, or if it merely raises the cost of a choice without removing the choice itself. You may not bind your future self if it removes their capacity to revise their fundamental life path while their competence remains intact.*

  To make this work, you need three filters. If a precommitment fails any of these, it is a Chain, not a Rope.

  ### The Three Filters

  1.  **The Competence Filter:** Is the future self capable of rational judgment?
      *   If **No** (Psychosis, drunkenness): You can bind them physically or substantively (Psych directive, holding keys). You are acting as a guardian for their own agency, which is temporarily offline.
      *   If **Yes** (Sober adult, future legislature): You cannot bind their substantive choices.
  2.  **The Exit-Cost Filter:** Is the binding a *price* or a *wall*?
      *   If **Price** (Savings penalty, smart contract burn): You can breach the commitment if you pay. This preserves agency (you *can* leave, it just hurts).
      *   If **Wall** (Indenture, irrevocable vow): There is no legal or physical exit. This destroys agency.
  3.  **The Sovereignty Filter:** Are you binding *resources* or *will*?
      *   If **Resources** (Money, time, labor): Generally permissible (within reason).
      *   If **Will** (Right to change mind, right to legislate): Generally impermissible, unless it protects the *conditions* of will itself.

  ### Running Your Verdicts

  *   **Savings/Slots:** Passes all filters. Competent future self, financial penalty (price), binds resources. **(OK)**
  *   **Keys/Drunk:** Passes Competence Filter (future self incompetent). **(OK)**
  *   **Psych Directive:** Passes Competence Filter (future self psychotic). It looks like a Chain (restraint), but it is justified because the T2 self lacks the capacity to hold the Rope. **(OK)**
  *   **Ulysses:** Passes Exit-Cost Filter (crew can cut him down if they choose; it's a reversible restraint). **(OK)**
  *   **Indentured Servitude:** Fails Exit-Cost Filter (no pay, no exit) and Sovereignty Filter (binds will/labor). **(NO)**
  *   **Teen Vows:** Fails Competence Filter (debatable, but presumption is growth/change) and Exit-Cost Filter (irrevocable). **(NO)**
  *   **No-Contact Contract:** Fails Sovereignty Filter (binds fundamental relational will) while Competent. **(NO)**

  ### The Test Cases

  **1. The Smart Contract (Money burned if backing out)**
  This is a **Rope**, provided the stake isn't enslaving.
  It functions exactly like the savings account with a penalty. The fact that "no human can release you" is a feature, not a bug; it removes the temptation to negotiate with yourself. However, if the stake is *everything* (e.g., "burn all assets if I smoke one cigarette"), it becomes a de facto Chain because the cost of exit is life-ruining. If it's a reasonable stake, it is enforceable precommitment.

  **2. Binding Others (Founder binding future Board)**
  This is a **Chain on someone else.**
  You can bind yourself (Self-Binding). You cannot bind others (Heteronomy). A founder can set *procedural* rules (how votes are counted), but cannot bind *substantive* outcomes (must pay X pension) because that violates the future board's agency. This is the "Dead Hand Control" problem in law, and it is rightly frowned upon.

  ### The Verdict You Must Drop

  You wrote: *"I'm against [legislative budget rules], though I'm strongly in favor of entrenching a bill of rights, and I'm aware those are structurally the same move."*

  **This is the verdict you have to give up.** They are **not** structurally the same move.

  *   **A Balanced Budget Rule** binds a *substantive outcome*. It forces a future legislature to make specific choices (cut spending or raise taxes) regardless of the crisis they face. It binds their *will* to a past *preference*. This fails the Sovereignty Filter.
  *   **A Bill of Rights** binds the *procedural conditions* of agency. It prevents the future legislature from destroying the very system that gives them authority (e.g., by banning speech or ending elections). It does not tell them *what* to decide; it protects their right *to* decide.

  If you accept the Agency-Preservation Principle, you must see the Bill of Rights not as a "binding of the future self," but as the **constitution of the self.** It is the rulebook for the game, not a move within the game. A budget rule is a move that tries to forbid future moves.

  ### Why the Psych Directive and Teen Vow are Different

  You worried that honoring the Psych Directive was "picking whichever self I happen to approve of." The principle resolves this without cheating.

  *   **Teen Vow:** The T2 self (adult) is *competent* but *bound*. The T1 self (teen) is restricting the T2 self's right to evolve. This violates the Sovereignty Filter.
  *   **Psych Directive:** The T2 self (psychotic) is *incompetent*. The T1 self is not overriding a competent will; they are protecting a person whose will is temporarily broken. This passes the Competence Filter.

  ### Summary

  Your gut is working better than your rule. The rule needs to be: **You can mortgage your resources, but not your sovereignty; you can restrain your body, but only if your mind is lost.**

  *   **Keep:** The rejection of indenture, vows, and budget rules.
  *   **Keep:** The acceptance of savings, keys, and psych directives.
  *   **Drop:** The idea that Budget Rules and Bills of Rights are the same. One binds the player; the other protects the board.
  *   **Accept:** The Smart Contract (as a high-cost Rope).
  *   **Reject:** Binding Others (as a Chain on them).

  If you must sacrifice one of your *existing* verdicts to make the theory perfectly clean, it is the **Psychiatric Directive**. A strict "Present Self Sovereignty" theory would say the T2 self's current will (even if psychotic) is all that matters. But almost everyone rejects that because it abandons the person to their illness. So, keep the Directive, but classify it as **Guardianship**, not **Self-Binding**. That clears the tension.
