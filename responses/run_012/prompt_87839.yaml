answer: |-
  **Grade: 23 / 25**

  **Marker's Comments**

  This is an exceptionally strong answer, demonstrating a command of the literature that exceeds typical graduate seminar expectations (specifically the citation of Harrison and Kreps). The student clearly understands the structural assumptions of the Milgrom and Stokey (M&S) model. However, there is a significant logical contradiction in the final sentence of part (b) that undermines the theoretical conclusion of the theorem they just described. Below is a sentence-by-sentence breakdown of where credit is earned and where it is lost.

  ### Part (a): Assumptions, Conclusion, Intuition (10 points)
  **Score: 10 / 10**

  *   **Credit Earned:**
      *   *"Milgrom and Stokey (1982) consider an exchange economy in which the traders share a common prior over the states of the world, are risk-averse expected-utility maximizers, and begin from a Pareto-efficient allocation of the available goods..."*
          *   **Comment:** This is the crucial sentence. Many students miss the **Pareto-efficient initial allocation** assumption, focusing only on the common prior. Identifying that the starting point must be ex-ante efficient (exhausting all gains from risk-sharing) is the key to the theorem. Full credit here.
      *   *"...and in which it is common knowledge that they are rational and that the information structure is as it is."*
          *   **Comment:** Correctly identifies the Common Knowledge of Rationality (CKR) requirement.
      *   *"Under these assumptions they show that no trade takes place at all, even though the traders hold different private information about the state."*
          *   **Comment:** Accurate statement of the conclusion.
      *   *"The proof is an unravelling argument... a trader who proposes a transaction cannot be offering me a share of the ordinary gains from trade, so the only remaining explanation for his willingness to take the opposite side is that his information is better than mine."*
          *   **Comment:** This captures the adverse selection intuition perfectly. Because risk-sharing gains are exhausted (due to the efficiency assumption), any proposed trade must be speculative. If speculative, the counterparty must believe they have an informational advantage.
      *   *"Because everyone reasons in this way... any proposed trade reveals something unfavourable to the person who would accept it, and so every proposal is declined."*
          *   **Comment:** Correctly describes the iterative "unravelling" process leading to the no-trade equilibrium.

  *   **No Credit/Corrections:** None. This section is flawless.

  ### Part (b): Common Prior & Relaxation (7 points)
  **Score: 5 / 7**

  *   **Credit Earned:**
      *   *"The common prior is what makes the unravelling work, since it is only because the two traders interpret the same piece of information in the same way that my counterparty's willingness to trade can serve as evidence about the state for me."*
          *   **Comment:** Excellent explanation. It highlights that without a common prior, a counterparty's willingness to trade reflects their *prior* bias, not just their private signal, breaking the inference chain.
      *   *"Relax the common prior and the argument collapses, since two traders who weight the states differently may both expect to gain from the same bet..."*
          *   **Comment:** Correct. Heterogeneous priors allow for "agreeing to disagree" and thus agreeing to trade.
      *   *"...the heterogeneous-expectations model of Harrison and Kreps exploits precisely this to generate speculative trade in a stock market."*
          *   **Comment:** This is a sophisticated reference (Harrison & Kreps, 1978) that warrants bonus consideration, though within the constraints of the points available, it secures full marks for the "relaxation" portion of the question.
      *   *"The result is the trading counterpart of Aumann's agreement theorem, which says that two rational agents with a common prior must agree about the probability of any event."*
          *   **Comment:** Correctly situates M&S within the broader epistemic game theory literature.

  *   **Credit Lost / Correction Needed:**
      *   *"Its upshot is that private information is the engine of speculative trade: where traders know nothing that the others do not, there is nothing to trade on."*
          *   **Comment:** **This sentence is logically inconsistent with the theorem.** The "upshot" of Milgrom and Stokey (and Aumann) is precisely that private information is **not** sufficient to generate speculative trade when priors are common. The student seems to be describing the *folk wisdom* of markets rather than the *theorem's conclusion*. The theorem shows that private information is a broken engine under these conditions.
          *   **How to fix:** The student should write: *"Its upshot is that private information alone is insufficient to generate speculative trade. Where traders share a common prior and start from an efficient allocation, there is nothing to trade on, regardless of private information."*

  ### Part (c): Real Markets (8 points)
  **Score: 8 / 8**

  *   **Credit Earned:**
      *   *"The theorem does not show that speculative trade is impossible in real markets."*
          *   **Comment:** Correct. The theorem is a "no-trade" result under specific idealizations, not an empirical claim that markets are frozen.
      *   *"Real traders trade for reasons that have nothing to do with information — to hedge an exposure, to raise cash, or to rebalance a portfolio..."*
          *   **Comment:** Correctly identifies "liquidity" or "risk-sharing" motives. In the language of the model, this implies the initial allocation was *not* Pareto efficient (e.g., agents had unmanaged risk exposures), allowing for mutually beneficial trade that isn't purely speculative.
      *   *"...and transactions of that kind can be mutually beneficial without any disagreement about the state."*
          *   **Comment:** Accurate.
      *   *"The theorem should therefore be read as a statement about the informational channel only."*
          *   **Comment:** Perfect summary of the theorem's philosophical scope.

  *   **No Credit/Corrections:** None.

  ### General Observation for the Instructor
  This student is performing at a very high level. The error in part (b) is likely a slip of the pen or a momentary confusion between the *model's implication* and the *real-world phenomenon* the model critiques. They clearly know the Harrison and Kreps paper, which suggests they are reading beyond the syllabus.

  The distinction they draw in part (c) between "informational trade" and "liquidity/hedging trade" is the standard and correct defense against the "no-trade" critique of real markets. As a physicist, you might appreciate the analogy: The theorem proves perpetual motion machines (purely informational speculation) are impossible in this system; part (c) correctly notes that real engines run on fuel (liquidity shocks/hedging needs), not perpetual motion.

  **Recommendation:** Return the paper with the note on part (b) clarified. The student deserves to know that their final sentence contradicted the core result they successfully outlined in part (a).
