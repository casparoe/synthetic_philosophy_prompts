answer: |-
  Here is the dispute restated in your vocabulary, followed by the residue report and the verdict on your suspicion.

  ### Part I: The Dispute in Craft Terms

  **The Virtue Ethicist's Position: The Coherent Arc**
  To the virtue ethicist, a character is defined by a stable set of dispositions (traits) that constitute their **interiority**. When you draft a **scene**, the **dramatic logic** should flow from these dispositions. If a character is established as cowardly in Chapter 1, their **motivation** in Chapter 10 must align with that cowardice, unless there is a specific, earned **turn** in their **arc**.

  In this view, **foreshadowing** is not just a trick; it is an ontological promise. You are planting seeds of disposition that will bloom into action. The **gap between what a person is and what the plot requires them to do** should be minimal. If the plot requires a coward to stand fast, the author must do the work of **showing** the internal cultivation of courage (habit, practical wisdom) that makes this action consistent with the character's history. The character is the cause of the action. The **unreliable narrator** is a specific device, not the default state; the reader is entitled to believe that the **character** they are getting to know is the actual agent of the story.

  **The Situationist's Critique: The Tyranny of the Scene**
  The situationist argues that what you call "character" is merely **telling** masquerading as **showing**. They claim that in real life, the **scene** itself—the time pressure, the authority figure in the room, the weather, the random noise—overpowers the **motivation** derived from **interiority**.

  In this view, the **arc** is a post-hoc fabrication. You are looking at a series of disjointed actions driven by external pressure and stitching them together with a narrative voice that claims, "This person is brave." The situationist says the **gap between what a person is and what the plot requires them to do** is not a problem to be solved by better writing; it is the fundamental truth of human behavior. People do not have **stable dispositions**; they have a history of reactions to specific contexts. Therefore, **foreshadowing** is a lie. You cannot foreshadow an action based on "who someone is," because "who someone is" does not predict what they will do when the **obstacle** changes slightly. The **unreliable narrator** is not a device; it is the only honest way to write a person, because any claim to know a character's core is a fiction imposed by the author.

  **The Quarrel**
  *   **Virtue Ethics:** A novel where characters act randomly based on situational pressure is bad writing (incoherent **dramatic logic**). Therefore, stable character must be real enough to sustain a story.
  *   **Situationism:** A novel where characters act consistently across different situations is a fantasy (imposed **arc**). Therefore, fiction creates a false model of human agency by prioritizing **character** over **situation**.

  ***

  ### Part II: The Residue Report

  Here is what survives the translation from philosophy to craft, and what gets lost in the seam.

  **1. Claims That Survive Intact**
  *   **The Tension of Consistency:** Both sides agree that readers *expect* consistency. The virtue ethicist says this expectation tracks reality; the situationist says it tracks a cognitive bias. In craft terms, both acknowledge that **dramatic logic** relies on the reader believing the action belongs to the character.
  *   **The Unreliable Narrator as Epistemology:** The situationist critique translates perfectly into the concept of the unreliable narrator. The idea that we construct a "character" from observed behavior and might be wrong is central to novels like *The Remains of the Day* or *Gone Girl*. The philosophical claim that "character is a story we tell ourselves" is a standard workshop observation about **interiority** vs. **exteriority**.

  **2. Claims That Survive Only in Distorted Form**
  *   **Practical Wisdom (Phronesis) vs. Character Growth:** In virtue ethics, practical wisdom is the ability to read a situation and apply the right virtue. In fiction, this often distorts into **Plot Convenience**. When a character suddenly knows what to do to resolve the third act, we call it an "epiphany" or "arc completion." But often, it is just the author needing them to act. The philosophical nuance of *cultivated habit* is hard to distinguish from *narrative necessity* in the translation.
  *   **The "Situation":** In social psychology, a situation is often trivial (finding a dime, being in a hurry). In fiction, a **scene** is curated. A novelist cannot replicate the situationist's "trivial variables" without it reading as Chekhov's Gun. If you mention the hurry, it must matter. Therefore, the novelist's "situation" is always weighted with meaning, whereas the situationist's "situation" is often random noise. This distorts the comparison.

  **3. Claims With No Counterpart in Novelist Thinking**
  *   **Statistical Aggregation:** Situationism relies on aggregates (most people do X in Y situation). A novelist deals with *n=1*. You are writing *this* person. You cannot write "60% of people would walk past the seminary student." You must decide if *your* character walks. The statistical nature of the situationist critique has no **dramatic logic**. It creates no **scene**.
  *   **The Absence of Teleology:** This is the biggest seam. In real life (per situationists), situations happen *to* people. In fiction, situations happen *for* people. You construct the **obstacle** to test the **want**. A situationist argues that behavior is driven by uncurated context. A novelist *cannot* work without curation. There is no craft equivalent for "random environmental variable that changes behavior but means nothing to the theme." If it changes behavior, it *must* mean something to the theme, or it gets cut in revision.

  ***

  ### Part III: The Verdict

  You asked whether the residue looks like a genuine gap in your vocabulary or evidence that one side of the quarrel was less clear. And you offered your suspicion: *The novel is a standing argument for the virtue ethicists: the author controls the situations, so the characters can afford to be consistent.*

  I am going to demolish that suspicion, but gently, because it contains a half-truth.

  **The Novel is Not an Argument for Virtue Ethics**
  The novel is not an argument for virtue ethics; it is an argument for **Narrative Necessity**.

  Your suspicion rests on the idea that because you control the situations, you allow character to shine through. But consider the reverse: Because you control the situations, you *force* character to shine through.

  If you write a scene where a priest walks past a dying man, and you want to make a point about the erosion of faith, you will construct the scene (the hurry, the noise, the lighting) to ensure he walks past. If you write a scene where he stops to help, you construct the scene to ensure he stops. In both cases, the **situation** is doing the heavy lifting of the **plot**, and the **character** is being molded to fit it.

  The situationist charge is not that people *can't* be consistent. It is that their consistency is far more fragile than novels suggest. By curating the world to match the character's **arc**, you are effectively rigging the experiment. You are removing the "noise" that the situationists claim is the primary driver of behavior.

  **The Genuine Gap**
  There is a genuine gap in your vocabulary, but it is not on the side of character. It is on the side of **Noise**.

  In fiction, there is no such thing as irrelevant detail. If you describe the rain, it sets a mood or blocks a path. In the situationist view, the rain might just make someone grumpy, causing them to snap at a spouse, with no deeper meaning, no **foreshadowing**, and no **arc**.

  Your vocabulary cannot accommodate "meaningless causality."
  *   **Virtue Ethics** says: Action flows from Character.
  *   **Situationism** says: Action flows from Context (often random).
  *   **Fiction** says: Action flows from Theme.

  Because Fiction requires Theme, it must choose between Virtue and Situation. It usually chooses Virtue, because "Character acting out of theme" is readable, whereas "Character acting out of random situational pressure" reads as *deus ex machina* or bad pacing.

  **Conclusion**
  The philosophers' quarrel is about *truth*. Your craft quarrel is about *intelligibility*.

  The virtue ethicists are not necessarily right about human beings, but they are right about *readers*. Readers cannot process a human being who is entirely situationally malleable; they cannot track the **motivation**. They need the "folk psychology" of stable traits to keep the **dramatic logic** intact.

  So, the novel does not prove virtue ethics is true in the world. It proves that virtue ethics is necessary for *comprehension*. You are not building people out of sentences; you are building *interfaces* out of sentences. An interface must be consistent to be usable. A human being does not have to be.

  The residue suggests that the situationists are likely more accurate about the *mechanism* of behavior (context drives action), but the virtue ethicists are more accurate about the *experience* of behavior (we feel like we are acting from character). Your job is to write the experience, not the mechanism. You are not a psychologist; you are a phenomenologist. You write how it *feels* to be a person, and it feels like virtue ethics even if we are living in a situationist world.
