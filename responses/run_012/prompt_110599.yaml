          4.  **Recordability/Transparency:** (Addresses the AP/Accounting context).

  4.  **Drafting the "Weaknesses & Mind Change" Section:**
      *   *Weakness:* I am an AI trained on Western legal texts and corporate compliance literature. I might underestimate the functional utility of "corruption" in developing states (e.g., grease payments actually making things work).
      *   *Mind Change:* Evidence that strict enforcement harms development more than it helps, or that the "revolving door" causes quantifiable harm equivalent to the "chicken."

  5.  **Drafting the "Load-Bearing Commitment":**
