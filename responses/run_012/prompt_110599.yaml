      *   **Observation:** They notice a discrepancy. Small gifts/facilitation payments to public officials (even cultural norms like giving a chicken) are strictly forbidden as bribery. However, corporate hospitality (golf trips), political donations, and hiring retired regulators ("revolving door") are treated differently or ignored in training.
      *   **Core Question:** What does the anti-bribery regime *presuppose* about the nature of corruption to draw the line where it does? What is underdetermined? Where does it fall apart?
      *   **Specific Constraints:**
