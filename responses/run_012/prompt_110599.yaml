  2.  **Deconstruct the Anti-Bribery Regime (FCPA/UK Bribery Act/OECD):**
      *   *The "Line":* The law focuses on *quid pro quo* with *public officials* to influence *official acts*.
      *   *The "Exceptions":* Hospitality must be "reasonable and bona fide." Political donations are often protected speech (in the US) or regulated separately. Hiring advisors is legal unless proven to be a conduit for bribes.
      *   *The Cultural Clash:* The user highlights the difference between "corruption" (Western legal definition) and "gift economy/obligation" (local custom).
      *   *The Structural Issue:* The regime assumes a separation between public duty and private interest that doesn't exist everywhere.

  3.  **Drafting the Table Content (Iterative Process):**

      *   *Idea 1: Public vs. Private.* The law assumes a clear distinction.
          *   *Rules out:* Systems where the official *is* the community leader or where state/private lines are blurred.
