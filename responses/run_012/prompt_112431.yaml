  8.  **Final Polish:** Check word count and tone. Ensure the "Genuine Constraint" vs. "Camp Commitment" flags are clear. Ensure the specific cases (meiotic driver, sterile worker, etc.) are explicitly linked to the requirements.

      *(Self-Correction during drafting)*: I need to be careful not to solve the debate for them, but to give them the *tools* to solve it. However, the prompt asks me to "tell me whether I am right" about the trade-offs. So I must take a stance on the incompatibilities.

      *Key Insight:* The "Unit of Selection" is often a category error. It's better to think of "Unit of *Replication*" vs "Unit of *Selection*" vs "Unit of *Evolutionary Individuality*." I should emphasize this distinction in Requirement 5.

      *Key Insight on Equivalence:* The Kin/Group selection equivalence is mathematical, but causal stories differ. I need to clarify that the *requirement* is to acknowledge the math while justifying the causal preference.

      *Length Check:* A page and a half single-spaced is roughly 750-900 words. Double-spaced is roughly 400-500. I will aim for a dense 1000 words to ensure all points are covered adequately without fluff.

