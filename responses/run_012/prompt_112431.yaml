      *   *Requirement 4: Handling Sterility/Altruism.* How does fitness nil evolve?
          *   *Case:* Sterile workers.
          *   *Constraint:* Empirical adequacy (requires inclusive fitness or multilevel logic).
      *   *Requirement 5: Distinguishing Units.* Selection unit $\neq$ Adaptation unit $\neq$ Individuality unit.
          *   *Case:* A trait adapted for group benefit might arise from gene selection.
          *   *Constraint:* Conceptual clarity.
      *   *Requirement 6: Major Transitions.* How do lower units become higher units?
          *   *Case:* Eukaryogenesis, multicellularity.
          *   *Constraint:* Dynamic adequacy.
      *   *Requirement 7: Explanatory Non-Triviality.* Avoiding "everything is a unit" or "nothing is a unit."
          *   *Case:* The classmates' debate (bookkeeping vs. empty).
          *   *Constraint:* Pragmatic/Epistemic.

  4.  **Addressing the Trade-offs (The "Incompatible Pairs"):**
      *   *Singular Unit vs. Transitions:* The user is right. A static ontology struggles with dynamic emergence.
      *   *Distinct Mechanisms vs. Formal Equivalence:* The user is right. If models are mathematically equivalent, claiming they are distinct *causal* mechanisms is metaphysically heavy.
      *   *Absolute vs. Relative Fitness:* This affects the definition of altruism.

  5.  **Refining the Output (Checking against constraints):**
      *   *Tone:* Philosophical, precise, directive.
      *   *Length:* Needs to be dense but readable. ~1000-1200 words.
      *   *Formatting:* Numbered list for requirements, specific section for trade-offs.
      *   *Content Check:* Did I include the Price Equation? Yes. $rb > c$? Yes. Sterile workers? Yes. Meiotic drivers? Yes.
      *   *Adjudication:* I need to tell the student which requirement does the heavy lifting. Usually, it's the *Causal/Statistical* distinction combined with *Explanatory Utility*.

  6.  **Writing - Iteration 1 (Mental Outline):**
      Start with the math (Price). Then move to causality (Sober's distinction). Then the biological cases (sterility, conflict). Then the definitions (individuality). Then the transitions. Finally, the trade-offs.
      *Correction:* The prompt asks for logical dependencies. Math comes first. Causality comes second (interpreting the math). Cases come third (testing the causality). Definitions come fourth (categorizing the cases). Transitions come fifth (changing the definitions). Trade-offs last.

  7.  **Writing - Iteration 2 (Focusing on the "Specification"):**
      Make sure each requirement states *what* must be delivered and *why* (the case).
