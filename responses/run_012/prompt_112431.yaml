      *   **Constraints:**
          *   No survey of who holds what (no "Dawkins says X, Sober says Y").
          *   List of requirements paired with the case/consideration motivating them.
          *   Must address specific cases: sterile workers, meiotic drivers, selfish genes/transposables, resource restraint/tragedy of the commons, major transitions.
          *   Must address specific distinctions: selected *of* vs. *for*, selection vs. drift/sorting, unit of selection vs. adaptation vs. individuality, altruism vs. mutualism (absolute vs. relative fitness).
          *   Must address specific results/constraints: Price equation exactness, $rb > c$ derivability in both frameworks, formal equivalence of models.
          *   Must flag genuine constraints vs. camp commitments.
          *   Must flag incompatible pairs of requirements (trade-offs).
          *   Must address the student's specific suspicions about singular units vs. transitions and kin vs. group selection distinctness.
          *   Goal: Settle the "bookkeeping vs. empirical emptiness" debate between classmates.
          *   Length: ~1.5 to 2 pages.
          *   Order: Logical dependencies (not thematic grouping).

  2.  **Deconstruct the Requirements & Dependencies:**
      *   *Foundation:* The theory must define what "selection" means mathematically/causally before it can identify a "unit." (Price Equation constraint).
      *   *Differentiation:* It must distinguish causal efficacy from statistical artifact (Selected *of* vs. *for*).
      *   *Empirical Coverage:* It must handle the hard cases (sterile workers, meiotic drivers, etc.).
      *   *Conceptual Clarity:* It must distinguish units (selection, adaptation, individuality).
      *   *Equivalence:* It must acknowledge mathematical equivalences (Kin vs. Group selection formalisms).
      *   *Transitions:* It must explain how units change (Major Transitions).
      *   *Trade-offs:* The user suspects tensions between singular units and transitions, and between distinct mechanisms and empirical equivalence.

  3.  **Drafting - Section by Section (incorporating logical flow):**

      *   *Introduction:* Acknowledge the meta-problem. The debate is often about *explanatory utility* rather than *truth conditions*, but we need adequacy criteria.
      *   *Requirement 1: Mathematical Consistency (The Price Equation).* This is the bedrock. Any theory must be compatible with the covariance decomposition.
          *   *Case:* The equivalence of group and individual accounting.
          *   *Constraint:* Genuine mathematical constraint.
      *   *Requirement 2: Causal vs. Statistical Distinction (Selected *of* vs. *for*).* Just because variance exists at a level doesn't mean selection acts *for* that level.
          *   *Case:* Group drift vs. group selection.
