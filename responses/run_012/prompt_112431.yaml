answer: |-
  **Specification of Adequacy for a Theory of the Unit of Selection**

  To adjudicate the units-of-selection debate, a theory must satisfy the following requirements, ordered by logical dependency. You cannot define a unit until you have defined selection; you cannot define selection until you have accounted for the mathematical structure of evolutionary change; and you cannot claim explanatory power until you have distinguished causal efficacy from statistical description.

  **1. Mathematical Consistency with the Price Equation**
  *   **Requirement:** The theory must acknowledge that the change in frequency of any trait can be exactly decomposed into within-group and between-group covariance components, regardless of the causal story told.
  *   **Motivating Case:** The formal equivalence of kin selection and group selection models. Since $rb > c$ can be derived from both individual-level and group-level accounting, a theory claiming the two frameworks predict different outcomes is mathematically false.
  *   **Status:** **Genuine Constraint.** This is not a preference; it is an algebraic identity. Any theory violating this is empirically falsified.

  **2. Causal Interpretation of Statistical Covariance**
  *   **Requirement:** The theory must provide a criterion for distinguishing when a statistical covariance at a level reflects *selection acting on* that level versus when it is a byproduct of selection at a lower level (the distinction between being selected *of* and being selected *for*).
  *   **Motivating Case:** Group-level sorting vs. group-level selection. If groups dissolve and reform randomly every generation, group-level variance exists, but selection is not acting *on* the group. A theory that identifies the group as the unit solely based on variance fails here.
  *   **Status:** **Genuine Constraint.** Without this, the theory conflates drift/sorting with selection.

  **3. Resolution of Intragenomic Conflict**
  *   **Requirement:** The theory must explain how selection can favor traits that reduce the fitness of the organism containing them.
  *   **Motivating Case:** Meiotic drivers and transposable elements. These genes proliferate while damaging the host. If the "organism" is the sole unit of selection, this is inexplicable. The theory must allow for units below the organism.
  *   **Status:** **Genuine Constraint.** Empirical adequacy requires accounting for sub-organismal conflict.

  **4. Account of Sterility and Altruism**
  *   **Requirement:** The theory must explain the evolution of traits where the actor's direct fitness is zero or negative, without resorting to circular definitions of fitness.
  *   **Motivating Case:** Sterile workers in eusocial colonies. The worker has nil fitness; the colony thrives. A theory must specify whether the *gene* (via kin selection), the *colony* (via group selection), or the *queen* is the beneficiary of the adaptation.
  *   **Status:** **Genuine Constraint.** This is the classic anomaly that sparked the debate.

  **5. Distinction of Evolutionary Roles**
  *   **Requirement:** The theory must distinguish the *unit of selection* (what interacts with the environment), the *unit of adaptation* (what benefits from the trait), and the *unit of evolutionary individuality* (what has a unified fitness interest).
  *   **Motivating Case:** A trait that looks like restraint in resource use. It may be selected *at* the individual level (to avoid punishment) but adapted *for* the group benefit. Collapsing these distinctions leads to the error of assuming every selected trait is an adaptation for the unit selected.
  *   **Status:** **Genuine Constraint.** Conceptual clarity is required to avoid category errors.

  **6. Dynamics of Individuality (Major Transitions)**
  *   **Requirement:** The theory must explain how a population of lower-level units becomes a higher-level individual, specifically by specifying what changes in the *structure of fitness* during the transition.
  *   **Motivating Case:** The evolution of multicellularity or eukaryotes. A theory that posits a fixed, singular unit (e.g., "always the gene") cannot describe the *process* by which the cell became the individual. It must identify the suppression of lower-level conflict as the marker of the transition.
  *   **Status:** **Genuine Constraint.** A static ontology cannot explain dynamic emergence.

  **7. Explanatory Non-Triviality**
  *   **Requirement:** The theory must offer heuristic or causal insight that is not available via mere redescription.
  *   **Motivating Case:** The debate between your classmates. If the gene's-eye view can redescribe any outcome post-factum, it risks being a tautology. If group selection adds no predictive power over individual selection, it risks being empty bookkeeping. The theory must justify why one perspective is *more useful* for a specific problem.
  *   **Status:** **Camp Commitment (Pragmatic).** This is not about truth, but about scientific utility.

  ***

  **Incompatible Pairs and Trade-Offs**

  You asked to flag pairs of requirements that cannot be jointly satisfied. Your suspicions are correct, and they reveal the core tension in the field.

  **1. Singular Unit vs. Major Transitions**
  *   **Conflict:** You cannot maintain that there is *one* true unit of selection (e.g., "The Gene") while also satisfying Requirement 6 (Major Transitions). If the unit is fixed, a "transition" is merely a change in environment, not a change in individuality.
  *   **Verdict:** You are right. A theory that insists on a singular, timeless unit (like strict Gene Selectionism) must treat major transitions as metaphoric. A theory that takes transitions seriously (like Multilevel Selection) must accept that the unit of individuality is context-dependent and emergent. You must choose between ontological parsimony (one unit) and dynamic adequacy (changing units).

  **2. Distinct Mechanisms vs. Formal Equivalence**
  *   **Conflict:** You cannot claim that Kin Selection and Group Selection are distinct *causal mechanisms* while simultaneously satisfying Requirement 1 (Price Equation Equivalence). If the math is identical, the difference is purely descriptive (how we partition the variance), not causal (how the world works).
  *   **Verdict:** You are right. Claiming they are distinct mechanisms is a **Camp Commitment**, not a constraint. It is a metaphysical stance that privileges one causal narrative over another despite empirical equivalence. To satisfy Requirement 7 (Non-Triviality), a theorist must argue that one narrative is *heuristically superior* for specific cases (e.g., group selection for cultural evolution, kin selection for haplodiploidy), not that they are physically distinct forces.

  **3. Absolute vs. Relative Fitness (Altruism Definition)**
  *   **Conflict:** You cannot define altruism strictly by absolute fitness costs (Requirement 4) while maintaining that selection is always about relative frequency change (Requirement 1). In some group structures, an altruist lowers their absolute fitness but increases their relative fitness within the group.
  *   **Verdict:** This requires a stipulation. Most adequate theories define altruism by *absolute* fitness cost to the actor and *absolute* benefit to the recipient, independent of the selection mechanism. If you define it by relative fitness, "altruism" becomes indistinguishable from "spite" or "selfishness" depending on the grouping.

  **Adjudicating Your Classmates**

  *   **Classmate A (Bookkeeping):** They are correct regarding Requirement 1. If the models are equivalent, claiming group selection predicts something gene selection cannot is false. However, they fail Requirement 7. Redescription is not explanation. If the group-level view makes the evolution of sterility intelligible where the gene-level view requires complex accounting, the group-level view has explanatory value.
  *   **Classmate B (Empirically Empty):** They are correct that the gene's-eye view risks being a tautology (Requirement 7). However, they fail Requirement 3. Ignoring the gene as a unit makes meiotic drivers inexplicable.

  **The Deciding Requirement**

  If one requirement does the work of excluding popular theories, it is **Requirement 2 (Causal Interpretation)**. Many theories fail because they identify the unit of selection solely by where the variance is (statistical), rather than where the *causal interaction* lies. A theory that satisfies Requirement 2 acknowledges that while genes are always the replicators, the *vehicle* of selection changes. This allows you to tell your classmates: "The math is equivalent (Req 1), but the causal story changes depending on whether lower-level conflict is suppressed (Req 6). Therefore, the 'unit' is not a noun, but a description of the hierarchy of causal control."
