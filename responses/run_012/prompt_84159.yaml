answer: |-
  # ONTOLOGICAL ARGUMENT TRIAGE PROTOCOL (OATP)
  **For Editor Use Only | Estimated Time: 15 Minutes**

  ## I. STANCE AND PHILOSOPHY OF THE PROCEDURE
  **Recommendation:** Adopt a **Stricter Technical / Neutral Metaphysical** standard.
  **Defense:** Your journal publishes rigorous argumentation, not verified truth. You must desk-reject logical incompetence and failure to engage standard literature (Technical Strictness). However, you must *not* desk-reject based on the implausibility of premises like "Necessary Existence is a perfection" (Metaphysical Neutrality). If the logic is valid and the premises are clearly articulated, the paper must go to referees, even if you find the premises absurd. This protects the journal from accusations of bias and ensures referees handle substantive philosophical disputes.

  **The "Recipe" Reframing:** Your colleague suggests treating the argument as a recipe (specifying a role) rather than a proof (establishing existence).
  **Verdict:** This is a legitimate philosophical maneuver (shifting from *existence* to *coherence*), but it changes the subject.
  **Procedure Rule:** If an author uses this reframing, they must explicitly state they are arguing for *conceptual coherence* rather than *actual instantiation*. If they claim it proves existence while relying on the "recipe" defense to dodge objections, **Reject**.

  ---

  ## II. THE DECISION PROCEDURE

  ### STEP 1: CLASSIFICATION (2 Minutes)
  **Q1: Is this an Anselmian (Conceptual/Greatness) or Modal/Gödelian (Axiomatic/Possibility) argument?**
  *   **Anselmian:** Turns on "greater than," "conceivability," or existence as a predicate.
  *   **Modal/Gödelian:** Turns on possible worlds, S5, "positive properties," or essentialism.
  *   **Action:** Mark type. If mixed/unclear, proceed as **Modal** (higher technical burden).

  ### STEP 2: TECHNICAL HYGIENE (5 Minutes)
  **Q2 (Modal Only): Is the modal system specified, and is the inference valid within it?**
  *   **Check:** Does the author specify S5? If they rely on the move from $\diamond \square P$ to $\square P$, they *must* use S5.
  *   **Sufficient Answer:** "Uses S5 explicitly" OR "Uses weaker system and justifies why S5 is not needed."
  *   **Fail Condition:** Uses S5 inference rules without naming S5, or claims validity in S4/T.
  *   **Action:** If Fail $\rightarrow$ **Desk Reject** (Reason: Technical Incompetence).

  **Q3 (All): Is "Existence" or "Positive Property" treated as a first-order predicate without justification?**
  *   **Check:** Anselmian papers must address Kant. Gödel papers must define "Positive."
  *   **Sufficient Answer:** Acknowledges the status of existence/positivity (e.g., "treated as a second-order property," "axiomatized as primitive").
  *   **Fail Condition:** Treats existence as a standard property (like "red") with no defense against Kant.
  *   **Action:** If Fail $\rightarrow$ **Desk Reject** (Reason: Failure to engage standard objection).

  ### STEP 3: DEFEATER ENGAGEMENT (5 Minutes)
  **Q4: Does the paper address the specific fatal objection for its type?**
  *   **Anselmian:** Must address the **Parody Problem** (Gaunilo/Perfect Island) or **Kant's Objection**.
  *   **Modal:** Must address **Modal Collapse** (If God exists necessarily, is everything necessary?) or **The Possibility Premise** (Why think God is possible?).
  *   **Gödelian:** Must address **Modal Collapse** or the **Coherence of 'Positive'**.
  *   **Sufficient Answer:** Dedicates a section or substantial paragraph to the objection, offering a counter-argument or concession.
  *   **Fail Condition:** Ignores the objection, or dismisses it in a footnote without argument.
  *   **Action:** If Fail $\rightarrow$ **Desk Reject** (Reason: Insufficient Literature Engagement).

  ### STEP 4: THE "RECIPE" CHECK (3 Minutes)
  **Q5: If the argument is reframed as "conceptual coherence" (Recipe), does the conclusion match?**
  *   **Check:** Does the abstract/conclusion claim "God Exists" or "The Concept of God is Coherent"?
  *   **Sufficient Answer:** Conclusion matches the strength of the premises. (e.g., If arguing for coherence, conclude coherence).
  *   **Fail Condition:** Premises argue for coherence/role-filling, but conclusion claims actual existence without a bridging premise.
  *   **Action:** If Fail $\rightarrow$ **Desk Reject** (Reason: Non Sequitur/Overclaim).

  ### STEP 5: FINAL DISPOSITION
  *   **If any "Fail Condition" met:** **Desk Reject.** (Use specific reason from above).
  *   **If all "Sufficient Answers" met:** **Send to Referees.**
      *   *Note to Editor:* You may personally find the premises absurd. **Send it anyway.** Your job is to ensure the argument is *argued*, not that it is *true*.
  *   **If the paper turns on a contested philosophical judgment (e.g., "Is S5 appropriate for metaphysics?"):** **Send to Referees.** This is not a mechanical defect; it is a philosophical dispute.

  ---

  ## III. TEST RUNS

  ### CASE 1: The Clean Anselmian Submission
  **Description:** Argues from "Being than which nothing greater can be conceived." Premise: Existence in reality is greater than existence in understanding. Concludes God exists.
  **Procedure Run:**
  1.  **Classification:** Anselmian.
  2.  **Technical Hygiene (Q3):** Treats existence as a "great-making property."
      *   *Check:* Does it address Kant? **No.** It asserts existence adds to greatness as a brute fact.
      *   *Result:* **Fail Condition Met.**
  3.  **Defeater Engagement (Q4):** Does it address Parody? **No.**
      *   *Result:* **Fail Condition Met.**
  4.  **Disposition:** **Desk Reject.**
  5.  **Editor Note to Author:** "While the reconstruction is clear, the manuscript treats existence as a first-order predicate without engaging Kant's objection, and does not address standard parody objections. These are requisite engagement points for this argument form."

  **Analysis:** This is a satisfying reject. The paper is technically outdated and ignores the literature. The procedure works as intended.

  ### CASE 2: The Gödel-Style Modal Submission
  **Description:** Defines God as having all "Positive Properties." Axioms: Positive properties are necessarily positive; Necessary Existence is Positive. Uses S5. Argues from Possible Instantiation to Necessary Existence.
  **Procedure Run:**
  1.  **Classification:** Modal/Gödelian.
  2.  **Technical Hygiene (Q2):** Uses S5 explicitly. Inference from $\diamond \square E$ to $\square E$ is valid in S5.
      *   *Result:* **Pass.**
  3.  **Technical Hygiene (Q3):** Treats "Positive" as a primitive undefined term (standard in Gödelian literature).
      *   *Result:* **Pass** (Accepted as axiomatic choice).
  4.  **Defeater Engagement (Q4):** Addresses Modal Collapse? **Yes.** Argues that divine freedom is compatible with necessity. Addresses "Positive"? **Yes.** Stipulates it as a primitive moral/aesthetic notion.
      *   *Result:* **Pass.**
  5.  **Recipe Check (Q5):** Claims "God Exists."
      *   *Result:* **Pass** (Premises support this within the system).
  6.  **Disposition:** **Send to Referees.**

  **The Unpleasant Outcome:**
  You (the Editor) find the axiom "Necessary Existence is Positive" to be nonsense. You suspect the "Positive" property is a placeholder that allows any property to be smuggled in. You are confident this is sophistical.
  **Procedure Command:** **You must send it to referees.**
  **Reason:** The paper is logically valid within its stated system (S5). The premises are clearly stated (even if you hate them). It engages the standard objections (Collapse). To reject this is to act as a metaphysical gatekeeper, not a procedural editor. The referees must decide if the axioms are plausible.
  **Editor Note to Author:** (None at triage).
  **Internal Note:** "Technically sound, metaphysically dubious. Send to [Referee A] and [Referee B] with instruction to focus on the plausibility of the 'Positive' axioms and the Modal Collapse response."

  ---

  ## IV. LIMITATIONS: WHAT THIS PROCEDURE CANNOT DO

  No matter how strictly you apply this protocol, the following disputes will remain **Philosophical Judgments** requiring human referees. You cannot mechanicalize these:

  1.  **The Choice of Modal Logic:** Whether S5 is the correct logic for *metaphysical* modality (vs. logical modality) is a live debate. The procedure checks if they *use* S5 consistently, not if they *should*.
  2.  **The Coherence of "Positive":** Whether "Positive Property" is a coherent primitive or a disguised contradiction is a substantive philosophical dispute, not a formal error.
  3.  **Necessary Existence as a Perfection:** Whether existence is a "great-making" property is the core Kantian dispute. The procedure ensures they *address* Kant, not that they *refute* him.
  4.  **The Possibility Premise:** In Modal OAs, the claim "It is possible that a Maximally Great Being exists" is often the weak link. Assessing whether an author has provided *sufficient warrant* for this possibility is a judgment call on argumentative weight, not logical validity.
  5.  **Recipe vs. Proof:** If an author argues "I am only proving coherence," but implies existence, the procedure catches blatant non-sequiturs. It cannot catch subtle rhetorical bait-and-switches where the tone suggests ontology but the text claims conceptual analysis.

  ## V. SUMMARY INSTRUCTIONS FOR TRIAGE NOTES

  1.  **Identify Type:** Anselmian vs. Modal/Gödel.
  2.  **Check Logic:** Valid in stated system? (S5 required for Modal OA).
  3.  **Check Kant/Predication:** Does Anselmian address existence-as-predicate?
  4.  **Check Objections:** Parody (Anselm) or Collapse (Modal)?
  5.  **Decision:**
      *   Logic Invalid / Objections Ignored $\rightarrow$ **Desk Reject.**
      *   Logic Valid / Objections Engaged $\rightarrow$ **Send to Referees** (Even if premises seem absurd).
  6.  **Reminder:** You are triaging *rigor*, not *truth*. If the argument is rigorous but false, let the referees say so.
