prompt: |-
  I am the philosophy of religion editor at a small academic journal, and I triage roughly forty submissions a year that turn on some version of the ontological argument; an increasing number are modal, and several are Gödel-inspired. The problem is not a shortage of referees but inconsistency: one report treats the argument as a live proof, another as a dead letter, and I have to decide under deadline what to send out and how much weight to give each report. I have a PhD in philosophy but not in modal logic, and I have about fifteen minutes per submission at triage; desk rejections are mine to make, while acceptances go to the editor-in-chief. Please turn the ontological argument itself, including its modal version, into a decision procedure I can actually run before I assign referees. I want the questions in the order I should ask them, what counts as a sufficient answer to each, where the procedure stops with a clear send-to-referees or reject-without-review, and where it must hand the decision to a human because the issue is a contested philosophical judgment rather than a mechanical defect. Build in the distinctions that matter: whether the argument is Anselmian or Gödel-style; whether it treats greatness as a maximal property or a second-order property; whether it relies on S5 and what happens if it does not; whether positive property is doing substantive work or is a placeholder; whether necessary existence is a perfection or a category mistake; whether the argument has a parody or modal-collapse problem; and whether the modal operator is meant to be logical, metaphysical, or something else. A colleague has suggested we treat the argument as a recipe rather than a proof: the premises specify a role, and the question is whether any possible world can fill that role. I want the procedure to be honest about whether that reframing helps or just changes the subject.

  Then run the procedure on two submissions. The first is a clean Anselmian argument from a being than which nothing greater can be conceived, with the usual premise that existence in reality is greater than existence in the understanding. The second is a Gödel-style modal argument: it defines God as a being having all positive properties, treats positive properties as necessarily positive, treats necessary existence as positive, and uses S5 together with an essence premise to move from possible instantiation to necessary existence. I want to see where each one passes, where it stalls, and what I should write to the authors. Include at least one case where the procedure tells me to do something I will not like -- for example, if it says I cannot reject a submission I am confident is sophistical, or if it says a premise I find absurd is not procedurally defective. Finally, tell me what the procedure cannot do: which disputes about the ontological argument will remain disputes no matter how carefully I sequence the questions. I would rather have a committed recommendation, with reasons, than a neutral survey of options: if you think the procedure should be stricter or looser than I am asking for, say so and defend it. Do not give me a reading list or citations; I need the procedure itself, in a form I can paste into our submission-triage notes.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Philosophy of Religion Editor at a small academic journal.
      *   **Task:** Create a decision procedure (triage tool) for ontological argument (OA) submissions.
      *   **Constraints:** ~15 minutes per submission, PhD in philosophy (not modal logic specialist), 40 submissions/year (many modal/Gödel-inspired).
      *   **Goal:** Reduce referee inconsistency, streamline desk rejects vs. send-to-referees.
      *   **Specific Requirements:**
          *   Order of questions matters.
          *   Define sufficient answers.
          *   Clear stop points (Reject vs. Send vs. Human Judgment).
          *   Include specific distinctions (Anselmian vs. Gödel, S5, Positive Properties, Necessary Existence, Parody/Collapse, Modal Operator type).
          *   Address the "Recipe vs. Proof" reframing.
          *   Run the procedure on two specific cases (Clean Anselmian, Gödel-style).
          *   Include an "unpleasant outcome" (procedure forces a send on a sophistical paper or blocks a reject on an absurd premise).
          *   State limitations (what disputes remain).
          *   Take a stance (stricter/looser) and defend it.
          *   Format: Ready to paste into triage notes (no reading lists/citations).

  2.  **Deconstruct the Ontological Argument Landscape:**
      *   *Anselmian (Classical):* Relies on "greatness," "conceivability," and existence as a predicate/perfection. Vulnerable to Kant (existence isn't a predicate) and Gaunilo (parodies).
      *   *Modal (Plantinga):* Relies on S5, Maximal Greatness, Possible Instantiation. Vulnerable to modal collapse, premise plausibility.
      *   *Gödelian (Formal):* Axiomatic, relies on "Positive Properties," Essentialism, S5. Vulnerable to modal collapse (Heytex/Oppy), coherence of "Positive," triviality.
      *   *Common Failure Modes:* Modal fallacy (scope of operators), equivocation on "existence," hidden premises, failure to engage standard objections (Kant, S5, Parody).

  3.  **Drafting the Decision Procedure (The "Triage Protocol"):**
      *   *Philosophy:* The procedure needs to filter out *technical incompetence* and *failure to engage literature* without adjudicating *truth*. It must distinguish between "bad philosophy" and "controversial philosophy."
      *   *Stance:* I need to recommend a *stricter* procedural filter on technical coherence but a *looser* filter on substantive metaphysical premises. Why? Because the journal's role is to publish rigorous argumentation, not necessarily true conclusions. However, arguments that fail basic logical hygiene waste referee time.
      *   *Structure:*
          1.  Classification (Anselmian vs. Modal/Gödel).
          2.  Technical Coherence (Logic/Modal System).
          3.  Premise Clarity (Definitions).
          4.  Objection Engagement (Parody/Collapse/Kant).
          5.  The "Recipe" Test.
          6.  Final Disposition.

  4.  **Refining the Questions (Iterative Process):**
      *   *Q1: Type.* Is it Anselmian or Modal/Gödel? (Determines subsequent path).
      *   *Q2: Modal Logic.* If modal, is the system specified? (S5 is standard, but needs justification).
      *   *Q3: Key Terms.* Is "Existence" or "Positive" defined non-circularly?
      *   *Q4: Objections.* Does it address the specific fatal objections for its type? (Kant for Anselm, Collapse for Gödel).
      *   *Q5: The "Recipe" Check.* Does it acknowledge the gap between conceptual coherence and actual instantiation?

      *Critique:* This needs to be sharper for a 15-minute triage. It needs "Kill Switches."
      *Revised Plan:*
      1.  **Categorization:** Anselmian vs. Modal/Gödel.
      2.  **Technical Hygiene:** Modal scope, logical validity.
      3.  **Premise Substantiation:** Are the controversial premises argued for or just asserted?
      4.  **Defeater Engagement:** Parody, Collapse, Kant.
      5.  **Verdict.**

  5.  **Developing the "Unpleasant Outcome":**
      *   The procedure must force a "Send to Referees" if the logic is valid and the premises are clearly stated, even if the editor thinks the premises are absurd. This upholds academic freedom/rigor over personal metaphysical bias.
      *   *Scenario:* A Gödel paper that admits "Positive" is primitive but derives the conclusion validly within S5. Editor hates it, but procedure says "Send."

  6.  **Running the Test Cases:**
      *   *Case 1 (Clean Anselmian):* Likely fails on "Existence as a Predicate" (Kant) engagement. If it doesn't address Kant, it's a desk reject.
      *   *Case 2 (Gödel-style):* Likely passes technical checks if S5 is used correctly. Fails if it ignores Modal Collapse. If it addresses collapse but offers a novel solution, it must go to referees even if the editor doubts the solution.

  7.  **Addressing the "Recipe vs. Proof" Reframing:**
      *   Does this help? It shifts burden from "Is God real?" to "Is this concept coherent?"
      *   *Verdict:* It helps filter *incoherent* concepts but doesn't solve the *instantiation* gap. The procedure should treat this as a "Premise Substantiation" check.

  8.  **Finalizing the Limitations:**
      *   The procedure cannot decide if S5 is the right logic for metaphysics.
      *   It cannot decide if "Positive Property" is coherent.
      *   It cannot decide if "Necessary Existence" is a perfection.
      *   These are *philosophical disputes*, not *procedural defects*.

  9.  **Drafting the Content (incorporating the "Editor Persona"):**
      *   Tone: Professional, direct, actionable.
      *   Format: Checklist/Flowchart style text.
      *   Defense of Stance: Argue for "Procedural Rigor, Metaphysical Agnosticism."

  10. **Review against Constraints:**
      *   15 mins? Yes, if questions are binary/quick.
      *   Distinctions included? (S5, Positive, Necessary Existence, etc.)
      *   Two cases run? Yes.
      *   Unpleasant outcome included? Yes.
      *   Limitations stated? Yes.
      *   No citations? Yes.

  11. **Self-Correction during drafting:**
      *   *Initial thought:* Maybe reject all Anselmian arguments as outdated.
      *   *Correction:* No, that's bias. Some contemporary work revisits Anselm. The filter must be *engagement with objections*, not *age of argument*.
      *   *Initial thought:* Require a proof of S5.
      *   *Correction:* Too technical for 15 mins. Require *acknowledgment* of S5 commitment and *awareness* of alternatives.
      *   *Refining the "Recipe" point:* The colleague's suggestion is essentially about *possibility premises*. The procedure needs to check if the author proves possibility or assumes it.

  12. **Final Polish:** Ensure the "Stop/Go" signals are explicit. Make sure the "Unpleasant Outcome" is highlighted in the test case section. (Proceed to generate output).

  *(Self-Correction on the "Unpleasant Outcome"):* The prompt asks for *at least one case where the procedure tells me to do something I will not like*. I should ensure one of the test cases triggers this. The Gödel case is the best candidate for this. It might be technically sound but metaphysically vacuous. The procedure should force a send if it's technically sound, forcing the editor to swallow their skepticism.

  *(Refining the Procedure's Stance):* I will advocate for a *stricter* technical filter but a *neutral* metaphysical filter. This protects the journal from publishing logical errors while avoiding the editor acting as a gatekeeper for metaphysical orthodoxy.

  *(Final check on "Recipe vs Proof"):* I need to be honest. It changes the subject from "God exists" to "The concept is coherent." The procedure should note that this is a valid *philosophical* move but requires the author to explicitly make that move, not hide it.

