  2.  **Deconstruct the Deflationary Account:**
      *   *Core Claim:* TI = Distributive Injustice regarding Credibility.
      *   *Implication:* If distribution is fair (according to the relevant metric), there is no wrong, even if epistemic agency is undermined.
      *   *Implication:* "Epistemic wrong" is just a label for this distribution issue, not a separate normative force.
      *   *Test Case:* The "Statistically Accurate Prejudice" (SAP) case. Hearer uses prejudice, but it tracks truth/reliability in that context. Distributive view says: Fair (assuming the "entitlement" is based on actual reliability). Epistemic view says: Wrong (because the *basis* of the judgment undermines the speaker's status as a knower).

  3.  **Drafting Section 1: Observations, Cases, Arguments (The "Leftover Wrong")**
      *   *Case 1: The Statistically Accurate Prejudice (SAP).*
