          *   *Defender's Move:* Redescription. Claim the speaker is entitled to credibility *independent* of statistical group data (individual entitlement). If the hearer uses group data, they violate the entitlement rule.
          *   *Verdict:* This strains the "distributive" model. If entitlement is individual, why call it distributive in the socioeconomic sense? It starts looking like an epistemic right. *Status: Genuine Counterexample (if entitlement is defined by reliability).*
      *   *Case 2: The Over-Credibility (Positive Prejudice).*
          *   *Challenge:* Distributive injustice usually focuses on *under*-allocation. What about giving *too much* credibility to a dominant group member? Is that a distributive wrong to the *speaker*? No, they benefit. Is it a wrong to others? Maybe. But the epistemic wrong of TI often includes the corruption of the hearer's own epistemic character.
          *   *Defender's Move:* Redescription. It's a distributive wrong to the *excluded* others (opportunity cost).
          *   *Verdict:* Awkward. It shifts the victim from the speaker to third parties. *Status: Awkward.*
      *   *Case 3: Epistemic Harm without Credibility Loss.*
          *   *Challenge:* A speaker is believed, but treated as a mere source of data (like a thermometer), not a rational agent. They get the "good" (belief), but the *manner* is insulting to their epistemic agency.
