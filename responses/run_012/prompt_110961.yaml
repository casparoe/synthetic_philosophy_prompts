      *   *Self-Correction on SAP:* I need to be careful. If the distributive account says entitlement is based on *individual* reliability, then using group statistics is a distribution error (profiling). I need to push the point that if the group statistic *accurately predicts* the individual's reliability in this instance, the distribution is technically "correct" by outcome standards. The wrong is the *process*. The deflationary account struggles with process-only wrongs if the outcome is fair.
      *   *Refining the "Credibility as Good" point:* If credibility isn't scarce, distribution makes no sense. I need to emphasize this ontological commitment.
      *   *Refining the "Unfalsifiable" point:* Distinguish between normative resilience and tautology.

  11. **Final Polish:** Ensure clear headings and logical flow. (Proceed to generate output based on these thoughts).

