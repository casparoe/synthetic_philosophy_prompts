      *   *Defender should concede:* That epistemic vocabulary highlights the *mechanism*, even if the *wrong* is distributive. That not all credibility deficits are injustices (some are just mistakes).
      *   *Critic presses:* That the "distributive" label is a category mistake. That the primary harm is to agency, not resource allocation.

  8.  **Drafting Section 6: Predictions**
      *   *Deflationary Prediction:* Remedies should focus on reallocating credibility (quotas, blind review) rather than changing epistemic habits/virtues.
      *   *Rival Prediction:* Remedies focus on virtue cultivation (humility, listening).
      *   *Difference:* The deflationary view implies we can fix TI without fixing the hearer's mind, just the output distribution.

  9.  **Drafting Section 7: The Single Decisive Consideration**
      *   *Choice:* The SAP case (Statistically Accurate Prejudice).
      *   *Reason:* It isolates the variable. Reliability is matched (Distributive fair), Prejudice is present (Epistemic foul). If the deflationary account says "No Wrong," it contradicts the core intuition of TI. If it says "Wrong," it must explain why distribution was unfair despite reliability tracking, which forces it to import epistemic norms.

