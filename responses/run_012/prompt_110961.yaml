          *   *Verdict:* If "credibility" means "recognition as a knower," the view collapses into the epistemic view. *Status: Fatal (Collapse risk).*

  4.  **Drafting Section 2: Internal Costs (Credibility as a Distributable Good)**
      *   *Premise:* The view relies on credibility being a "scarce social good" like money or jobs.
