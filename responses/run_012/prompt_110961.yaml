      *   *If the claim fails:*
          *   *Collapse:* If credibility isn't distributable, the metaphor breaks. The view must explain the wrong without distribution. It likely defaults to "violation of epistemic norms," which is the rival view.
          *   *Retreat:* It could retreat to "status good" (honor/prestige). But then it becomes a subset of general social injustice, losing the specific "testimonial" focus.
      *   *Conclusion:* The view is fragile here. If credibility isn't like a pie, the distributive model loses its bite.

