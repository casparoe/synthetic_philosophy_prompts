answer: |-
  ### 1. Brainstorming Candidate Rules

  To reconstruct your colleague's criterion, we must test standard philosophical rules against her twelve historical verdicts.

  *   **The No-Miracles Argument (Naive Realism):** *Rule:* If a theory yields novel successful predictions, its central posits are real.
      *   *Accommodates:* Atoms, Electrons, Neptune, EM Field.
      *   *Fails:* Phlogiston, Caloric, Ether, Bohr Orbits, Vulcan. (All yielded successful predictions in their time; she deems them unreal.)
      *   *Status:* **Eliminated.**

  *   **The Pessimistic Meta-Induction (PMI):** *Rule:* Since past posits were unreal, current posits are likely unreal.
      *   *Accommodates:* Phlogiston, Caloric, Ether, Bohr Orbits.
      *   *Fails:* Atoms, Electrons, Genes, Neptune. (She is a robust realist about these.)
      *   *Status:* **Eliminated.**

  *   **Entity Realism (Manipulability):** *Rule:* A posit is real if we can causally manipulate it (e.g., "spray electrons").
      *   *Accommodates:* Electrons, Atoms, Genes.
      *   *Fails:* Neptune. (We cannot manipulate Neptune; we observe it. Yet she calls it real.)
      *   *Fails:* EM Field. (Fields are not "entities" in the manipulable sense of Hacking's paradigm cases, though they are causal.)
      *   *Status:* **Eliminated.**

  *   **Structural Realism:** *Rule:* The mathematical structure of successful theories is real, even if the ontology changes.
      *   *Accommodates:* Ether (she grants the equations survived), EM Field, Electrons.
      *   *Fails:* **The Ether Verdict.** She explicitly states the Ether was *never real*, despite acknowledging the equations survived into Relativity. A structural realist would say "the structure was real." She distinguishes the *math* (retained) from the *posit* (discarded).
      *   *Status:* **Eliminated.**

  *   **Divide et Impera (Selective Realism):** *Rule:* The posits *essential* to a theory's novel success are real; incidental posits are not.
