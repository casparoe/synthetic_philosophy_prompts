  ### 2. Identifying the Surviving Criterion

  Only one rule survives her record intact: **The Ontological Retention Criterion.**

  **The Criterion:** *A theoretical posit is real if and only if (1) it plays an indispensable causal role in the theory's empirical success, and (2) the specific ontology (the entity itself, not merely the mathematical formalism or the phenomena explained) is preserved in the theory's empirically adequate successor.*

  **Discriminating Verdicts:**
