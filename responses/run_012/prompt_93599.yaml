  ### 6. Principled Selective Realism or Hindsight?

  **Verdict:** **Hindsight in Disguise.**

  **Reasoning:**
  Her criterion ("Real = Retained in Successor Theory") is logically sound but epistemically inaccessible to the practicing scientist. To apply her rule, one must know the *future* of the theory.
  *   In 1880, a scientist using her rule would have to declare the Ether **Real**, because they did not yet know Special Relativity would discard it.
  *   In 1920, a scientist using her rule would have to declare Bohr Orbits **Real**, because they did not yet know Wave Mechanics would discard them.

  Your colleague is making her judgments from the vantage point of the *present*, looking back at what survived. This is not a guide for current scientific realism; it is a historiographical classification.

  **What an Honest Version Would Commit To:**
  For her view to be a *principled selective realism* rather than hindsight, she would have to commit to a marker of "survivability" that is detectable *in the present*.
  *   She would have had to say in 1880: *"The Ether is likely unreal because [X feature of the posit] suggests it won't survive."*
  *   She would have had to say in 1920: *"Bohr Orbits are likely unreal because [Y feature] suggests they are instrumental."*

  Since she offers no such forward-looking criterion (and indeed, her record implies she waits to see what happens), her "selective realism" is merely the observation that **some past posits turned out to be true.** That is a tautology, not a philosophical defense of realism. She is not telling us how to find truth; she is telling us how to recognize it after the fact.
