prompt: |-
  So me and a couple friends started this little reading group at school — we're all kinda into AI safety stuff after this guest talk we went to — and we keep hitting the same wall. Everyone says an AI agent should be "low impact" or should "avoid side effects," and then the second you push on what that actually means, nobody agrees. Like, is a side effect just anything the agent changed that it wasn't told to change? But then it changed the air temperature just by existing, so everything is a side effect and the idea is useless. Or is it about what a human would've wanted it to change, but then you need to already know what people value, which is the exact thing you were trying to avoid needing. My friend says you literally cannot define "side effect" without smuggling in a full value specification, and I half-believe her but I want the actual spec on the table before I pick a side.

  So before I read any more of these "impact measure" proposals, write me the desiderata — the full list of what any adequate definition of "side effects" / "low impact" for an AI agent has to be able to do. The cases it has to get right (a robot that moves a box and scuffs the floor; an agent that saves a bunch of people by shutting down a factory; an agent that does nothing at all when doing nothing is itself the harmful thing; two agents whose actions are identical but whose reasons for acting differ — or whatever cases you think actually matter, and say why each one earns a spot). The distinctions it can't collapse (harmful vs. merely unintended; doing vs. allowing; changing the world vs. failing to change it; impact the agent caused vs. impact that would've happened anyway). And any hard constraints that come from the setting itself — that it has to work before the agent knows the true values, that it has to be computable from the agent's side, that it can't just tell the agent to do nothing forever. For each requirement, give me the one case or consideration that makes it non-optional.

  Then the part I most want: which of these requirements are genuinely non-negotiable and which are just preferences of one camp, and whether some subset is jointly unsatisfiable — because if "no full value spec" and "matches what people actually care about" can't both hold at once, that itself is the answer to my friend's claim, and I'd rather know that then get a fake list where everything magically fits. Also say which single requirement does the most to rule out the proposals people actually make, and be upfront about where your own reasoning here is most likely to fall apart — like if there's some consideration that, if it turned out to matter, would flip your call on whether the no-full-spec requirement is even legit.

  Format it as: "The cases it has to handle" (longest, roughly a paragraph per case), "The distinctions it can't collapse" (a few lines each), "Hard constraints" (short), "What's non-negotiable vs. what's just a camp preference" (medium), "The requirement that does the most work" (short), and "Where this is most likely wrong" (short). A table is fine for the middle sections if thats cleaner.
