          *   *Crux 1: Non-domination value independent of welfare.*
              *   Argument: The "Status Without Wealth" case.
              *   Prediction: Relational says Good. Prioritarian says Bad (or only instrumentally good).
          *   *Crux 2: Prioritarianism and Domination.*
              *   Argument: Can prioritarian weights capture the urgency of ending domination?
              *   Prediction: Prioritarian says Yes (via welfare impact). Relational says No (misses the deontic/structural wrong).
          *   *Crux 3: Distributions vs. Relations.*
              *   Argument: The "Island of Masters and Slaves" vs. "Equal Paupers."
              *   Prediction: Disagreement on what is being compared.

      *   **Section 5: Verbal Dispute Identification:**
          *   Is some of this just about the word "Equality"? Yes. Telic Distributive vs. Relational.
          *   Is there a substantive remainder? Yes, the ontology of value (welfarism vs. non-welfarism).

  4.  **Refining and Polishing:**
