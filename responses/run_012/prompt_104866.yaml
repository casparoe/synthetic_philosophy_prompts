answer: |-
  # JOINT STATEMENT ON THE LEVELLING-DOWN OBJECTION
  **An Adversarial Collaboration Between a Prioritarian and a Relational Egalitarian**

  **Date:** October 26, 2023
  **Signatories:** [The Prioritarian] & [The Relational Egalitarian]

  ### Preamble
  For years, we have debated the moral significance of equality and the force of the Levelling-Down Objection (LDO). The Prioritarian has maintained that the LDO demonstrates that equality of outcome possesses no intrinsic value. The Relational Egalitarian has maintained that the LDO targets a strawman—Telic Distributive Egalitarianism—rather than the view that actually matters: Relational Egalitarianism. This document records our agreed map of the disagreement, the specific points of remaining contention, and the empirical or intuitive tests we propose to settle them.

  ---

  ### 1. Agreed Claims and Presuppositions
  We endorse the following numbered claims as an accurate description of the logical landscape, regardless of our normative evaluations.

  1.  **Definition of the LDO:** The Levelling-Down Objection asserts that if equality were intrinsically valuable, a state of affairs where everyone is equally worse off (Levelled Down) would be better *in at least one respect* than a state of affairs where some are better off and others worse off (Unequal), even if the Levelled Down state is better for no one.
  2.  **Presupposition of Impersonality:** The LDO presupposes that "betterness" can be impersonal. That is, a state can be better without being better *for* any particular individual. Both sides accept this is a coherent logical possibility, though we disagree on whether it is morally actual.
  3.  **Presupposition of Welfarism:** The standard formulation of the LDO presupposes that the relevant metric for "level" is individual welfare (well-being, preference satisfaction, or subjective flourishing).
  4.  **Distinction of Respect:** Both sides distinguish between being *better in one respect* (pro tanto) and *better all things considered*. We agree that a Prioritarian can concede equality is good *instrumentally* while denying it is good *intrinsically*.
  5.  **The Prioritarian Concession:** The Prioritarian concedes that social hierarchy, domination, and oppression are morally bad and should be remedied, even if remedying them does not maximize aggregate welfare.
  6.  **The Relational Concession:** The Relational Egalitarian concedes that if "equality" is defined strictly as the minimization of statistical variance in welfare distribution, the LDO is fatal to that view. No plausible moral theory holds that making everyone miserable is good *in virtue of the misery being shared equally*.

  ---

  ### 2. Residual Disagreement
  While we agree on the logic above, we disagree on the *scope* and *target* of the LDO. We state our remaining divergence as follows:

  *   **The Prioritarian Formulation:** "The LDO successfully refutes the claim that distributive equality is an intrinsic value. Since Relational Egalitarianism often relies on the intuition that hierarchy is bad even when welfare is constant, the Relational Egalitarian must either abandon welfarism or admit that their view is not about 'equality' but about 'rights' or 'status,' which are distinct values."
  *   **The Relational Egalitarian Formulation:** "The LDO successfully refutes Telic Distributive Egalitarianism, but that is a view nobody should have held. The LDO has no force against Relational Egalitarianism because the 'level' in question is not welfare, but social status. Dismantling hierarchy is not 'levelling down' welfare; it is 'levelling up' standing. The objection fails because it category-errors the *currency* of equality."

  ---

  ### 3. The Central Case: The Dismantling of Hierarchy
  We agree to treat the following case as the decisive test for our disagreement.

  **The Case:** A rigid caste system exists. The Upper Caste enjoys significant privilege (high welfare). The Lower Caste suffers subordination (low welfare). The system is dismantled overnight.
  *   **Consequence A:** The Upper Caste loses their privilege and status, resulting in a net decrease in their welfare (they feel humiliated, lose unearned income, and suffer psychological distress).
  *   **Consequence B:** The Lower Caste gains legal status and non-domination, but due to entrenched economic realities and psychological scarring, their *welfare* does not measurably increase in the short term.
  *   **Net Result:** The former superiors are worse off. The former inferiors are not better off (in welfare terms). Total welfare decreases.

  **The Question:** Is this instance of "Levelling Down"? And if so, is it objectionable?

  *   **Prioritarian Initial Stance:** This is Levelling Down in terms of welfare. It is regrettable *all things considered*, though perhaps justified instrumentally to prevent future harm.
  *   **Relational Initial Stance:** This is not Levelling Down. It is Justice. The decrease in welfare for the oppressors is morally irrelevant compared to the cessation of the wrong of domination.

  ---

  ### 4. The Cruxes: Arguments and Predictions
  We identify three specific cruxes underlying our divergence. For each, we specify an argument or case that bears on it, and we record our predictions regarding how the other side will respond.

  #### Crux 1: The Independence of Non-Domination
  *   **The Issue:** Does the value of non-domination exist independently of its impact on anyone's welfare?
  *   **The Test Case:** *The Contented Slave.* A slave is well-treated, has high subjective welfare, and prefers their condition to the uncertainty of freedom. The master derives no pleasure from domination but maintains the system out of tradition. Abolishing slavery lowers the master's welfare (loss of labor convenience) and lowers the slave's welfare (loss of security/preference satisfaction).
  *   **Relational Prediction:** We predict the Prioritarian will judge abolition as *all-things-considered worse* or only justified by long-term instrumental gains, because no one's welfare is improved.
  *   **Prioritarian Prediction:** We predict the Relational Egalitarian will judge abolition as *intrinsically better*, even if welfare drops permanently for all parties.
  *   **Agreed Significance:** If the Relational Egalitarian is correct, welfarism is false. If the Prioritarian is correct, "non-domination" is merely a proxy for long-term welfare interests.

  #### Crux 2: Prioritarianism and the Badness of Domination
  *   **The Issue:** Can Prioritarianism account for the specific urgency of ending domination without smuggling in egalitarian values?
  *   **The Test Case:** *The Weighted Privilege.* We must decide between Policy A (moderate welfare gain for the dominated, slight welfare loss for dominators) and Policy B (massive welfare gain for dominators, slight welfare gain for the dominated). Standard Prioritarianism might favor B if the dominators are numerous enough or the gain is large enough, despite B entrenching hierarchy.
  *   **Prioritarian Prediction:** We predict the Relational Egalitarian will claim Prioritarianism *must* endorse B in some permutations, proving it cannot capture the deontic constraint against hierarchy.
  *   **Relational Prediction:** We predict the Prioritarian will claim they can adjust the weighting function to prioritize the "urgency" of the dominated's position sufficiently to always rule out B, without invoking equality.
  *   **Agreed Significance:** This tests whether Prioritarianism is a distinct theory or merely Egalitarianism in disguise.

  #### Crux 3: Distributions vs. Relations
  *   **The Issue:** Is the relevant moral comparison between *distributions of goods* or *qualities of relations*?
  *   **The Test Case:** *The Equal Paupers vs. The Hierarchical Wealth.* Society X has perfect equality but relations of suspicion and latent aggression. Society Y has high inequality but relations of benevolent paternalism where no one feels dominated.
  *   **Relational Prediction:** We predict the Prioritarian will prefer Society Y if total/prioritized welfare is higher, viewing the "relations" as instrumental to welfare.
  *   **Prioritarian Prediction:** We predict the Relational Egalitarian will prefer Society X (or a third option Z) because the *structure* of Y is morally tainted, regardless of the welfare flow.
  *   **Agreed Significance:** This determines whether the LDO applies. If the object of value is relations, "levelling" welfare is irrelevant.

  ---

  ### 5. Identification of Verbal Dispute
  We acknowledge that a portion of our dispute is merely verbal, specifically regarding the label **"Equality."**

  *   **Why it is verbal:** When the Prioritarian says "Equality has no intrinsic value," they mean *Telic Distributive Equality of Welfare*. When the Relational Egalitarian says "Equality is intrinsically valuable," they mean *Relational Equality of Status*. We are not disagreeing about the world; we are disagreeing about which concept deserves the noun "Equality."
  *   **Resolution:** We agree to use "Distributive Equality" for the former and "Relational Equality" for the latter in future correspondence.

  **However,** we affirm that a **substantive dispute remains** regarding **Welfarism**.
  Even if we change the labels, the Prioritarian holds that only welfare (or welfare-weighted outcomes) counts toward the *final* moral evaluation. The Relational Egalitarian holds that the *structure of agency and power* counts toward the final moral evaluation, even at a permanent cost to welfare. The Central Case (Section 3) is designed to test this substantive remainder.

  ### 6. Commitment to Future Inquiry
  We commit to revisiting this statement after conducting a joint thought-experiment workshop focused on *The Contented Slave* and *The Dismantled Hierarchy*. We agree that if the Prioritarian cannot account for the badness of domination without referencing the welfare of the dominated, and if the Relational Egalitarian cannot explain why status matters without referencing the welfare benefits of status, we will be forced to synthesize our views.

  **Signed,**

  _________________________
  (The Prioritarian)

  _________________________
  (The Relational Egalitarian)
