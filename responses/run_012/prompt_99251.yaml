      *   *The Core Tension:* Computationalism is currently under pressure from two sides: (1) The rise of Deep Learning/Connectionism (which challenges classical symbolic computationalism) and (2) The "Triviality" arguments in philosophy of computation (which threaten to make the term "computation" vacuous).
      *   *The Sweet Spot:* A 1-year fellowship needs a focused, high-leverage target. It shouldn't be "Is computationalism true?" (too big). It should be "What specific conceptual bottleneck prevents progress on whether computationalism is true?"
      *   *The Winner:* The **Individuation/Triviality Problem** (Metaphysics of Computation) is the most upstream. If *any* physical system computes *any* function, "computation" explains nothing. However, purely metaphysical work can be dry. The *Kind of Computation* (Classical vs. Non-Classical) is more timely due to AI, but risks becoming empirical. The *Explanatory Value* (Consciousness) is crucial but often stalls on hard problem intuitions.
      *   *Decision:* The agenda should prioritize the **Metaphysics of Implementation** (solving the triviality problem) *linked* to the **Individuation of Computational Kinds** (how we distinguish relevant computations). This bridges the gap between "what is computation" and "what is the brain doing."

  3.  **Drafting the Agenda - Step-by-Step:**

      *   **Introduction:** Acknowledge the user's intuition. Validate that the "Greatest Hits" (Searle, etc.) are low-yield now. Set the tone for a strategic memo.
      *   **Criterion Definition:** Explicitly state the ranking criteria (Upstream Leverage, Formal Tractability, Neglect/Value Ratio).
      *   **Priority 1: The Implementation/Triviality Constraint.**
