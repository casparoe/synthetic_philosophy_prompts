answer: |-
  **MEMORANDUM**

  **TO:** Search Committee, Cognitive Science Department
  **FROM:** [Your Name]
  **SUBJECT:** Strategic Agenda for Visiting Fellowship: Foundational Computationalism
  **DATE:** October 26, 2023

  ### Executive Summary

  Our intuition is correct: the standard "greatest hits" of computationalism (Searle's Chinese Room, Putnam's Multiple Realizability, the Turing equivalence of neurons) are no longer the highest-leverage targets for a one-year foundational project. These debates have reached a reflective equilibrium where new arguments rarely shift prior probabilities. They are downstream of a more pressing conceptual crisis.

  If we host a fellow to re-litigate whether syntax is sufficient for semantics, we will reproduce existing stalemates. Instead, I propose we target the **metaphysical and individuation constraints on computation itself.** The field is currently bottlenecked by the "Triviality Problem" (the fear that physical systems trivially realize all computations) and the "Individuation Problem" (the inability to specify *which* computation a cognitive system is performing without circular appeal to function).

  Resolving these upstream issues is a prerequisite for making progress on the nature of neural computation or the explanation of consciousness. The following agenda ranks three lines of inquiry based on **Upstream Leverage**, **Formal Tractability** (suitable for a philosopher without lab access), and **Neglect-to-Value Ratio**.

  ---

  ### Ranking Criteria

  To evaluate candidate topics, I applied the following constraints:
  1.  **Upstream Leverage:** Does answering this question dissolve or settle adjacent disputes? (High leverage = yes).
  2.  **Formal Tractability:** Can this be advanced via conceptual analysis, logic, or formal semantics without requiring new empirical data or complex modeling? (High tractability = yes).
  3.  **Neglect-to-Value:** Is the topic under-discussed relative to its importance for the viability of computationalism?

  ---

  ### The Agenda

  #### Priority 1: The Metaphysics of Implementation (Solving the Triviality Problem)
  **The Question:** *What non-arbitrary constraints distinguish a physical system that genuinely implements a computation from one that merely satisfies a structural mapping?*

  **Reasoning:**
  This is the most upstream issue. If Pancomputationalism is true (i.e., every physical system implements every computation), then claiming "the brain is a computer" is vacuous. It explains nothing. The standard response has been to dodge this by appealing to "causal structure" or "counterfactuals," but recent work suggests these dodges are insufficient against sophisticated triviality arguments (e.g., from Putnam, Searle, and more recently, Piccinini and Millhouse).

  *   **Upstream Leverage:** **Critical.** If we cannot define implementation non-trivially, the debate over *what kind* of computation the brain performs (Priority 2) is meaningless, and the debate over whether computation explains consciousness (Priority 3) is dead on arrival. A robust account of implementation settles the ontology before we discuss the psychology.
  *   **Tractability:** **High.** This is pure philosophy of science and logic. It requires analyzing mapping relations, causal structures, and modal constraints. It fits the "no lab, no modeling" constraint perfectly.
  *   **Neglect/Value:** **High Value / Moderate Neglect.** While discussed in specialized philosophy of computation circles (e.g., work by Gualtiero Piccinini, Nir Fresco, Mark Rescorla), it has not sufficiently permeated the broader cognitive science discourse. Most cognitive scientists assume implementation is "obvious" until pressed.
  *   **Why not the Chinese Room?** The Chinese Room assumes a notion of "symbol manipulation" that presupposes a solution to the implementation problem. If we solve Priority 1, the Chinese Room either dissolves (because the room doesn't meet the implementation constraints) or transforms into a more precise question about semantic grounding.

  #### Priority 2: The Individuation of Computational Kinds (The "Grain" Problem)
  **The Question:** *By what criteria do we individuate the specific computation a cognitive system is performing, distinct from the infinite other computations it physically realizes?*

  **Reasoning:**
  Even if we solve Priority 1 and agree the brain *is* a computer, it realizes infinite functions simultaneously (e.g., it computes XOR, but also computes "disjunction" in a million other ways). Cognitive science requires picking out the *relevant* computation (the one that explains behavior). Currently, we often individuate computations by their cognitive *effects*, which risks circularity (it computes X because it causes behavior Y, which we explain by computation X).

  *   **Upstream Leverage:** **High.** This bridges the metaphysics of computation (Priority 1) and the empirical practice of cognitive modeling. If we can provide a non-circular account of computational individuation, we provide a criterion for adjudicating between Classical, Connectionist, and Dynamical models without needing new data.
  *   **Tractability:** **High.** This requires conceptual analysis of function, mechanism, and representation. It leans heavily on logic and philosophy of mind.
  *   **Neglect/Value:** **High Value / High Neglect.** This is often swept under the rug in empirical work. Philosophers focus on "is it computation?" (Priority 1) or "does it feel like something?" (Priority 3), leaving the "which computation?" question under-theorized.
  *   **Why not Multiple Realizability (MR)?** MR is a claim about the *relation* between kinds. But before we ask if cognition is multiply realizable, we must be able to individuate the computational kind in the first place. Priority 2 is a precondition for a coherent debate on MR.

  #### Priority 3: The Viability of Non-Classical Computationalism
  **The Question:** *Can we formally characterize "neural computation" or "analog computation" in a way that preserves the explanatory power of computationalism without retreating to Classical (Turing-style) Symbolicism?*

  **Reasoning:**
  Classical Computational Theory of Mind (CTM) is struggling. Deep Learning works, but it doesn't look like classical symbol manipulation. If we define computation strictly as Turing-machine equivalent, we may be forcing the brain into a category that doesn't fit. However, if we define it too loosely (e.g., as any dynamical system), we risk collapsing into triviality (Priority 1). We need a formal middle ground.

  *   **Upstream Leverage:** **Moderate.** This determines the future framework of cognitive theory. However, it depends on the success of Priorities 1 and 2.
  *   **Tractability:** **Moderate.** This risks drifting into empirical modeling. The fellow must be constrained to *conceptual* analysis of existing formalisms (e.g., analyzing the logical structure of backpropagation or dynamical systems theory) rather than building new models.
  *   **Neglect/Value:** **High Value / Low Neglect.** This is a hot topic due to AI, but much of the work is empirical. Foundational work here is needed to interpret the empirical results.

  #### Deprioritized: Consciousness and Intentionality (as starting points)
  **Reasoning:** Questions like "Can computation explain qualia?" or "How does syntax yield semantics?" are currently stalled because they presuppose a stable definition of computation.
  *   **Why Downgrade:** You cannot determine if computation *explains* consciousness until you have a non-trivial account of what computation *is* (Priority 1) and how to identify it in the brain (Priority 2). Focusing here first leads to intuition-pumping rather than resolution.
  *   **Exception:** If the fellow makes progress on Priority 1, they should be encouraged to apply it to intentionality (e.g., "Does a non-trivial implementation constraint solve the grounding problem?").

  ---

  ### Dynamic Factors: What Moves the Ranking?

  The ranking above is stable for the immediate future, but the following developments would shift priorities:

  1.  **AI Architectural Shifts (Moves Priority 3 Up):** If the next 2 years see a collapse of Transformer architectures in favor of radically different substrates (e.g., neuromorphic, analog, or quantum-inspired), the need to define "Non-Classical Computation" becomes urgent.
  2.  **New Triviality Proofs (Moves Priority 1 Up):** If a logician publishes a rigorous proof that current "mechanistic" accounts of computation still succumb to triviality, Priority 1 becomes the *only* viable project.
  3.  **Neuroscientific Mechanistic Consensus (Moves Priority 2 Up):** If experimentalists converge on a specific neural coding scheme (e.g., precise spike timing vs. rate coding) that demands a specific computational ontology, the Individuation Problem becomes the bottleneck for interpreting that data.

  ### Recommendation for the Call for Applicants

  Do not ask for proposals on "Computationalism and Consciousness" or "The Chinese Room Argument." These invite well-worn essays.

  **Draft Language:**
  *"We invite applications for a fellowship focused on the foundational metaphysics and individuation of computation in cognitive science. We are particularly interested in work that addresses the triviality arguments against physical implementation, the criteria for individuating computational kinds in neural systems, and the formal distinction between classical and non-classical computational frameworks. Projects that re-litigate standard arguments regarding multiple realizability or the Chinese Room without addressing these underlying metaphysical constraints are discouraged."*

  ### Conclusion

  The standard debates are familiar because they are easy to state, not because they are the current bottlenecks. The viability of computationalism now hinges on whether we can define "computation" rigorously enough to avoid vacuity (Priority 1) and specifically enough to avoid circularity (Priority 2). A fellow who can advance the metaphysics of implementation will do more for the department's foundational standing than one who offers a new take on Searle. This agenda maximizes the leverage of a single year of conceptual work.
