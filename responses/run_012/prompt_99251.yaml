      *   **Priority 2: The Individuation of Computational Kinds (The "Grain" Problem).**
          *   *Why:* Even if the brain computes, *which* computation matters for cognition? (Individuation problem).
          *   *Work:* Linking semantic content to syntactic structure without falling into homuncular traps.
          *   *Upstream:* Connects metaphysics to cognitive explanation.
      *   **Priority 3: Non-Classical Computationalism (Beyond Turing).**
          *   *Why:* Classical COGNITION is struggling against Neural Nets. We need a formal definition of "neural computation" that isn't just "approximate Turing."
          *   *Work:* Analog, dynamical, or probabilistic computation definitions.
          *   *Risk:* Can drift into empirical modeling. Needs strict conceptual boundaries.
      *   **Deprioritized:** Consciousness/Intentionality (as a starting point).
          *   *Why:* Too downstream. You can't solve how computation yields consciousness until you agree on what the computation *is*.
      *   **Deprioritized:** Chinese Room/Multiple Realizability (in isolation).
