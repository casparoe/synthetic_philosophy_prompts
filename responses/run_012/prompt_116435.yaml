prompt: |-
  My co-op is re-writing its bylaws and weve been argueing for a week about whether the rule that lets us change the rules can itself be changed. My friend Dave is dead certain it cant, and he says there's an Escher print that proves it — the one where two hands are each drawing the other one, each coming out of a cuff, and neither is the 'real' hand. He says a hand can't draw the paper it's sitting on, so there has to be something outside the loop holding the whole thing up. He calls it the 'inviolate level' — the thing that isn't part of the loop but is what makes the loop possible. His conclusion: our bylaws need at least one clause nobody can ever amend, otherwise the amendment process is a legal fiction and the whole thing is floating in the air.

  I half beleive him but I think the drawing might be doing work it can't do. Can you give me the correspondence — the two hands, the paper, the cuffs, the artist, this inviolate level — and then the places the mapping breaks when the target is a set of rules that govern their own change? The thing I keep getting stuck on is whether whatever is outside the loop has to be another rule (like an unamendable clause) or whether it could be something that isn't a rule at all, like people just continuing to treat the rules as binding. And does Dave's conclusion follow from the picture, or is the picture smuggling in 'there's always a bigger hand'? If there's a better image for this, tell me what it is.

  Also tell me where your reasoning is weakest and what would change your mind — if there's a self-amending system with nothing unamendable in it that runs fine, I'd want to know what that looks like. And please lead with your bottom line in the first sentence, then the reasoning, no throat-clearing and dont restate my question.
