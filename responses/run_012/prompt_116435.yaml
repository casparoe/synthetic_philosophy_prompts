answer: |-
  Dave is correct that a rule system requires a foundation outside its own text, but incorrect that this foundation must be an unamendable clause within that text.

  In Dave's mapping, the two hands represent the amendment clause and the substantive bylaws, the paper is the physical document, the cuffs are the jurisdictional boundaries, and the artist or "inviolate level" is the membership body or state law granting existence. The analogy breaks because Escher depicts a physical impossibility while law is a social performative; the "paper" in law is not a passive substrate requiring support but an active authority, and the "artist" is not a higher rule but the social fact of acceptance. The "outside the loop" element does not need to be a rule, such as an unamendable clause, but is typically the members' continued consent to be bound (what legal philosopher H.L.A. Hart called the Rule of Recognition). Dave's conclusion fails because the image smuggles in the assumption that validity must be hierarchical, whereas legal validity can be circular if socially sustained. A better image is the Ouroboros (a snake eating its tail), which symbolizes self-creation without external support, or a game of chess, where the rules govern play including rule changes if agreed, but the game exists only because players agree to play. Self-amending systems with nothing unamendable run fine constantly; the U.S. Constitution allows Article V (the amendment rule) to be amended using Article V procedures, and corporate bylaws routinely allow amendment of the amendment clause without entrenchment, both functioning without legal collapse.

  My reasoning is weakest in assuming that general legal theory applies uniformly to your specific co-op, ignoring that local statutes might impose specific structural requirements. I would change my position if your state's Cooperative Corporation Act explicitly mandates an entrenched clause for bylaws to be legally valid, as statutory law trumps general legal theory.
