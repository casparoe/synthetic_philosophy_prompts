      *   Final verdict: The system is irrational, even if the parts are rational.

  8.  **Final Polish:** Ensure the language is encouraging for a high school researcher. (e.g., "This is an excellent question," "This distinction is crucial for your project.")

  **(Self-Correction during drafting):** I need to be careful with the word "irrational." In strict economics, if an agent maximizes utility, they are rational. If the market clears at a wrong price, is the *market* irrational? Economists prefer "inefficient." However, the user asks if we have grounds to call the *outcome* irrational. I will argue that "systemic irrationality" is a valid concept distinct from "individual irrationality." I will defend the use of the term "irrational" for the bubble/outcome while preserving the "rationality" of the agents.

