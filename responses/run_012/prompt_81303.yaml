  # Decision Tree: Worst-Case vs. Average-Case Guarantees

  **Starting Commitment:** We cannot exhaustively verify the behaviour of a system that is smarter and more general than we are, and the systems we care about will act on inputs and in environments that nobody enumerated in advance.

  ---

  ### Node 1: Agentic Status
  **Is the system designed to autonomously optimize open-ended goals in the world, or to answer specific queries for human use?**
  *   **Queries (Tool):** → **Leaf A: Capability Restriction / Non-Agentic Tooling**
      *   *Awkward Commitment:* Requires humans to remain in the loop for all high-stakes decisions indefinitely, assuming human judgment does not degrade.
  *   **Goals (Agent):** → Go to Node 2.

  ### Node 2: Failure Reversibility
  **If the system executes a harmful action, does the physics of the situation allow for detection and correction before catastrophic loss?**
  *   **Yes (Recoverable):** → Go to Node 3.
  *   **No (Irreversible):** → Go to Node 4.

  ### Node 3: Intervention Locus
  **Is the safety reliance placed primarily on social/legal monitoring structures, or on technical containment protocols?**
  *   **Social/Legal:** → **Leaf B: Institutional Guarantee**
      *   *Awkward Commitment:* Requires robust global coordination and assumes no rogue actors can bypass monitoring.
  *   **Technical:** → **Leaf C: [Unnamed: Technical Containment]**
      *   *Diagnosis:* **Unattractive.** Technical containment of superintelligence is generally viewed as infeasible without prior alignment; this position often collapses into Leaf A or B.

  ### Node 4: Optimization Pressure
  **Is the failure mode primarily due to the system actively circumventing constraints (adversarial), or failing to generalize correctly (indifferent competence)?**
  *   **Circumventing (Adversarial):** → Go to Node 5.
  *   **Generalizing (Indifferent):** → Go to Node 6.

  ### Node 5: Uncertainty Domain (Adversarial)
  **Is the worst case defined by the input space given a fixed model, or by the space of possible models consistent with training data?**
  *   **Input Space:** → **Leaf D: Worst-Case-Only**
      *   *Awkward Commitment:* Requires a mathematical bound that may be impossible to compute for general systems; implies "don't build" unless solved.
  *   **Model Space:** → **Leaf E: Only Worst-Case-Over-Hypotheses**
      *   *Awkward Commitment:* Implies average-case over inputs is meaningless without solving model uncertainty first.
      *   *(Note: Leaves D and E are logically distinct but often converge on the same practical policy: do not deploy without formal bounds.)*
  *   **Both:** → **Leaf F: [Unnamed: Combined Adversarial]**
      *   *Diagnosis:* **Unexplored.** Most literature focuses on one domain; combining them usually tightens the bound to infeasibility.

  ### Node 6: Environment Stability
  **Can the deployment environment be modeled as a draw from a stationary probability distribution?**
  *   **Yes (Stationary):** → Go to Node 7.
  *   **No (Non-Stationary):** → Go to Node 8.

  ### Node 7: Tail Risk Tolerance
  **Does the cost function allow for rare failures (tail risk), provided the average performance is high?**
  *   **Yes:** → **Leaf G: Average-Case Adequacy**
      *   *Awkward Commitment:* Accepts that some catastrophic outliers will occur as a statistical certainty.
  *   **No:** → **Leaf H: [Unnamed: Zero-Tolerance Average-Case]**
      *   *Diagnosis:* **Incoherent.** If tail risk is unacceptable, average-case metrics are insufficient; this position logically forces a move to Node 8 or Node 5.

  ### Node 8: Distributional Uncertainty
  **Is the uncertainty about *which* distribution applies (requiring robustness over a set), or about the validity of *any* training-derived distribution?**
  *   **Which Distribution:** → **Leaf I: Robustness to Plausible Distributions**
      *   *Awkward Commitment:* Requires defining the boundary of "plausible" without circularity or hiding worst-cases inside the set.
      *   *(Note: Hard to separate from Leaf G if the "set" is narrow; hard to separate from Leaf D if the "set" is broad.)*
  *   **Validity of Any:** → Go to Node 9.

  ### Node 9: Transfer Validity
  **Do safety properties learned on the training distribution provably transfer to the deployment distribution, even if they differ?**
  *   **Yes:** → **Leaf J: [Unnamed: Safe Transfer]**
      *   *Diagnosis:* **Unexplored/Unattractive.** Contradicts the Starting Commitment regarding unenumerated environments; assumes a level of inductive bias we do not possess.
  *   **No:** → **Leaf K: Training-to-Deployment Transition**
      *   *Awkward Commitment:* Implies training safety metrics are largely irrelevant to deployment safety; shifts focus entirely to online monitoring or capability control.

  ---

  ### Summary of Logical Probes
  1.  **Quantification:** Probed in Nodes 5, 6, 8 (Inputs vs. Models vs. Distributions).
  2.  **Failure Mode:** Probed in Node 2 (Recoverable vs. Irreversible).
  3.  **Adversary:** Probed in Node 4 (Adversarial vs. Indifferent).
  4.  **Trusted Distribution:** Probed in Nodes 6, 8 (Stationary vs. Set vs. None).
  5.  **Locus:** Probed in Nodes 1, 3 (Model vs. Institution vs. Tool).
  6.  **Worst-Case Scope:** Probed in Node 5 (Max over Inputs vs. Max over Models).

  ### Unoccupied/Problematic Combinations
  *   **Recoverable + Irreversible Harm:** (Node 2 contradiction).
  *   **Adversarial + Average-Case:** (Node 4 → Node 7). Generally incoherent; adversaries exploit tail risks.
  *   **Non-Stationary + Safe Transfer:** (Node 8 → Leaf J). Contradicts the definition of non-stationarity in high-stakes contexts.
  *   **Tooling + Irreversible:** (Node 1 → Node 2). If a tool causes irreversible harm, it is functionally an agent; this path is usually reclassified to Node 1 "Agent".
