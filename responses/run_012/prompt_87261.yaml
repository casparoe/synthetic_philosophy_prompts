answer: |-
  **Memorandum: Research Agenda for Diachronic Collective Intentionality**

  **To:** Principal Investigator
  **From:** Research Consultant
  **Subject:** Strategic Allocation of Six Person-Years (Conceptual Work)
  **Date:** 24 May 2024

  ### 1. Judgement on the Reframing

  Your suspicion that the individual-versus-collective axis is exhausted is well-founded. The literature has reached a reflective equilibrium where reductionists (e.g., Bratmanians) and non-reductionists (e.g., Gilbertians) talk past one another, often differing merely on the threshold of 'mutuality' required.

  The **Synchronic/Diachronic reframing** does carve the phenomena at a joint, but with a caveat. It risks collapsing back into the older debate if 'diachronicity' is treated merely as a chain of synchronic states linked by causal memory. If the account of a legislature persisting over a century reduces to 'Member A at $t_1$ intends X, causes Member B at $t_2$ to intend X', you have not escaped the individualist paradigm; you have merely added a time index.

  For this reframing to succeed, it must demonstrate that the *unit of agency* itself persists over time in a way that is not reducible to the psychological continuity of the constituents. It must show that the 'we' has a temporal thickness that the 'I' cannot replicate through succession.

  **What would show this is a distraction?**
  If, after rigorous analysis, the conditions for diachronic joint action turn out to be nothing more than: (1) overlapping synchronic collective intentions, and (2) causal chains of information transfer. If the 'normative glue' holding the sequence together dissolves into individual obligations to update one's beliefs based on predecessors' actions, the reframing has failed. It would merely be the philosophy of joint action applied to a longer timeline, rather than a new ontology.

  **New questions revealed:**
  Your reframing illuminates the **problem of agential death**. In individual action, death terminates agency absolutely. In diachronic joint action, 'death' (of participants) is compatible with the survival of the agent. This raises the question: *Can a joint action outlive every original participant while remaining numerically the same action?* The synchronic view struggles here; the diachronic view makes it the central puzzle. It also highlights the role of **non-human anchors** (records, charters, artefacts) which are often treated as external tools in synchronic views but must be constitutive in diachronic ones.

  ---

  ### 2. The Research Agenda

  For three researchers over two years, I propose three interconnected Work Packages (WPs). These are ordered by logical dependency.

  #### **Priority 1: The Continuity Condition (WP1)**
  *   **The Question:** What constitutes the numerical identity of a joint action over time? Specifically, what distinguishes a single joint action persisting through participant turnover from a mere sequence of distinct but similar joint actions?
  *   **Why Upstream:** This is the metaphysical foundation. Without a criterion for identity, we cannot determine if a commitment has been *transferred* or merely *replicated*. If we cannot define when 'we' at $t_1$ is the same agent as 'we' at $t_2$, questions about obligation inheritance (WP2) are unintelligible.
  *   **Tractability:** High. This is classic conceptual analysis suited to philosophical methodology. It relies on constructing and testing cases (e.g., The Ship of Theseus applied to a football squad; a research programme where the hypothesis changes but the team identity holds; a queue where everyone moves forward). It requires no data, only rigorous intuition-pumping and consistency checking.
  *   **Downstream Impact:** Resolution here dictates the ontology of social institutions. If continuity requires physical overlap (handover), institutions are fragile. If it requires only normative alignment, they are robust but potentially unmoored. It determines whether we treat institutions as processes or objects.

  #### **Priority 2: The Inheritance Mechanism (WP2)**
  *   **The Question:** By what mechanism does a new participant acquire the intentions and obligations of a pre-existing collective without having participated in their formation? (The 'Novice Entry' problem).
  *   **Why Upstream:** Once we know *that* the action persists (WP1), we must explain *how* the intentional state is carried across the boundary of personhood. Standard joint intention theory assumes co-formation (we decide together). Diachronic theory must explain deferred formation (I decide to join what you decided).
  *   **Tractability:** Moderate to High. This requires analysing the normative logic of 'joining'. It can be tackled through the literature on promises, contracts, and political obligation, re-engineered for collective intentionality. It is conceptual but demands precision to avoid conflating moral obligation with intentional state.
  *   **Downstream Impact:** Crucial for understanding institutional stability and moral responsibility. If inheritance is automatic upon entry, individuals are bound by past sins of the collective. If it requires re-ratification, institutions are unstable. This resolves debates about historical guilt and institutional reform.

  #### **Priority 3: The Termination Condition (WP3)**
  *   **The Question:** Under what conditions does a diachronic joint action cease to exist, even if participants remain willing to continue? (e.g., loss of a charter, death of a key founder, change in external recognition).
  *   **Why Upstream:** Less so than WP1/2, but necessary for completeness. It defines the boundaries of the phenomenon.
  *   **Tractability:** Moderate. Termination is often the inverse of continuity. However, it introduces externalist factors (social recognition) which may complicate the purely intentional analysis.
  *   **Downstream Impact:** Determines the ethics of dissolution and the 'right to end' a collective project.
  *   **Decision on Competition:** If time becomes critical, **drop WP3**. Termination is logically secondary to Continuity. If you define what makes something persist, the cessation is simply the failure of those conditions. WP3 can be absorbed into the conclusion of WP1. Giving up WP3 means leaving the 'death' of collective agents less formally defined, but the core theory of their 'life' remains intact.

  ---

  ### 3. Allocation of Person-Years

  *   **Researcher A (Lead):** Focus on **WP1 (Continuity)**. Responsible for the metaphysical framework. Must engage with social ontology (Searle, Tuomela) but push beyond status functions to agential persistence.
  *   **Researcher B:** Focus on **WP2 (Inheritance)**. Responsible for the normative/ethical interface. Must engage with literature on political obligation and promising to model the transfer of 'we-intentions'.
  *   **Researcher C:** Focus on **WP1 & WP2 Integration + Artefacts**. A crucial insight of the diachronic turn is that minds alone cannot bridge time. Researcher C should analyse the conceptual role of records, minutes, and artefacts. Are these merely causal aids, or are they constitutive parts of the diachronic intention? (This addresses the 'new questions' regarding what becomes of commitment when participants die).

  ---

  ### 4. Criteria for Progress and Failure

  To ensure the funder sees value, you need clear markers of conceptual progress.

  **What moves items UP (Signs of Success):**
  1.  **The 'Empty Room' Test:** If the team can construct a coherent case where a joint intention persists despite a temporary gap in *all* participating minds (e.g., a dormant company reactivated after 50 years), WP1 is succeeding. This would prove irreducibility to synchronic states.
  2.  **Differentiation of 'We':** If the team can formally distinguish between 'We-who-are-here' and 'We-who-are-this-organisation' in a way that alters the truth conditions of intention ascriptions, the reframing is validated.
  3.  **Artefact Integration:** If Researcher C can demonstrate that removing the record-keeping artefacts conceptually destroys the diachronic intention (not just makes it harder), this elevates the role of material culture in intentionality, a significant theoretical advance.

  **What moves items DOWN (Signs of a Dead End):**
  1.  **Reduction to Causal Chains:** If the best account of continuity turns out to be purely causal (A told B, B told C) without a normative or intentional link, the project collapses into standard social psychology. This would demote WP1 significantly.
  2.  **The 'Fresh Start' Intuition:** If considered judgements consistently suggest that new members *always* form a new intention rather than inheriting an old one (i.e., the 'Novice Entry' problem resolves by denying inheritance), then WP2 is unnecessary, and the diachronic view offers no advantage over iterated synchronic views.
  3.  **Adjacency Failure:** If developments in the metaphysics of ordinary objects (persistence of ships, organisms) show that social entities follow no special rules, the distinctiveness of the project is threatened. The team must show why *agential* persistence differs from *object* persistence.

  ### 5. Summary Recommendation

  Proceed with the reframing, but guard against the 'collapsing back' risk by insisting on **normative continuity** rather than causal continuity.

  Fund **WP1 and WP2** as the core. Make WP3 (Termination) contingent on surplus time. Ensure Researcher C is explicitly tasked with bridging the gap between mind and record, as this is the most likely place to find the 'joint' you suspect exists. If, after 12 months, the team cannot distinguish diachronic joint action from a sequence of synchronic agreements linked by memory, terminate the diachronic hypothesis and revert to refining the synchronic models. However, given the stagnation you describe, the diachronic turn is the only avenue with sufficient friction to generate new heat.
