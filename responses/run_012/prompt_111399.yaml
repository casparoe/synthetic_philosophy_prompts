answer: |-
  ### 1. Exam Question

  **Ethics Seminar: Take-Home Assessment**
  **Total Marks: 25**

  Consider a choice between two outcomes. In the first, a single person is subjected to fifty years of continuous, extreme torture. In the second, a very large number of people each lose exactly one nanosecond of life. For those in the second group, the loss is undetectable; no instrument measures it, no one feels it, and nothing about their daily experience changes. The only fact is that each dies one nanosecond earlier than they otherwise would have, missing out on whatever goods that fragment of time would have contained.

  **(a) (8 marks)**
  Before counting the harms, you must define them. What condition must be met for something to count as a harm to a person? Based on your definition, does losing one undetectable nanosecond of life qualify as a harm? Explain why or why not.

  **(b) (10 marks)**
  Based on your answer to (a), which outcome should be chosen? State the general principle you are using to compare the single large harm against the many small harms. Your principle must explain *how* small harms combine (or fail to combine) without simply asserting that "numbers count" or "numbers don't count." Show how your definition of harm in (a) drives this principle.

  **(c) (7 marks)**
  State the strongest objection to your own position in (b). To defend your view against this objection, what specific intuition or commitment must you be willing to reject or modify?

  ***

  ### 2. Model Answer

  Whether the nanosecond loss counts as a harm depends on whether we view harm experientially or deprivationally. If harm requires a negative conscious experience, the nanosecond is not a harm; nobody feels it, and it changes nothing in the stream of consciousness. However, this view is too narrow. We typically agree that killing someone is a harm even if they die instantly and feel no pain. The harm lies in the deprivation of future goods. On this deprivation account, the nanosecond is technically a harm. Each person loses a fragment of possible value, however minute. Because death is the permanent loss of life's goods, shortening life shortens the opportunity for goods, regardless of whether the subject notices the truncation.

  Given that the nanosecond loss is a harm, the choice depends on how these harms aggregate. A simple summing principle suggests we multiply the tiny harm by the number of people. If the number is large enough, the total loss of life exceeds fifty years. However, this ignores the moral significance of the harm's magnitude. I argue for a Threshold Principle: harms below a certain level of significance cannot aggregate to outweigh a harm above that level. The threshold is not about whether something is a harm *simpliciter*, but whether it is a *morally actionable* harm.

  While losing a nanosecond is a deprivation, it is too trivial to enter moral calculus. Moral concern requires a minimum weight. If we allow trivial harms to aggregate indefinitely, we face absurdities where any minor inconvenience to enough people justifies atrocity. The torture victim suffers a harm that breaches the threshold of moral urgency; the nanosecond losers suffer harms that remain below it. Therefore, even if the total time lost by the group exceeds fifty years, the single instance of torture is worse. The principle is not that small harms don't add up mathematically, but that they lack the moral density to outweigh catastrophic suffering. My definition in (a) drives this: because the harm is purely deprivationary and not experiential, it lacks the immediate moral weight of suffering, making it susceptible to a threshold constraint.

  The strongest objection to this view is the Sorites challenge. If one nanosecond doesn't count, what about two? Or a second? Or a day? If I claim there is a sharp cutoff where harms suddenly become actionable, I seem arbitrary. Why is 0.000000001 seconds negligible but 0.000000002 seconds significant? To meet this objection, I must reject the demand for a precise line. I must accept that moral categories are vague. I am committed to the view that moral significance is not a smooth continuum but has fuzzy boundaries. I must give up the intuition that moral principles require mathematical precision. If I insist on precision, I am forced back into simple aggregation, which demands I sacrifice the torture victim to save the nanoseconds. I prefer to accept vagueness rather than accept that extreme suffering can be outweighed by undetectable losses.

  ***

  ### 3. Marking Scheme

  **Total Marks: 25**

  **Part (a): Defining Harm (8 Marks)**
  *   **Top Band (6-8 marks):** Clearly distinguishes between experiential (felt) and deprivationist (loss of goods) accounts. Explicitly applies the chosen definition to the nanosecond case. Consistent logic (e.g., if experiential, then no harm; if deprivation, then harm).
  *   **Middle Band (3-5 marks):** Defines harm vaguely. Applies definition to the case but wavers on the conclusion.
  *   **Low Band (0-2 marks):** Fails to define harm. Asserts intuition without justification. Contradicts self (e.g., says it's not felt but still counts as harm without explaining why).
  *   **Common Error:** Claiming the nanosecond is a harm because "time is valuable" without explaining *why* missing unfelt time constitutes harm.

  **Part (b): Principle and Decision (10 Marks)**
  *   **Top Band (8-10 marks):** Decision follows logically from (a). Principle is nuanced (e.g., Threshold, Weighted Aggregation, Lexical Priority) rather than stock "summing" vs. "no summing." Explicitly links the definition of harm to the aggregation rule.
  *   **Middle Band (5-7 marks):** Decision is clear but principle is generic ("greater good"). Link between (a) and (b) is weak.
  *   **Low Band (0-4 marks):** Contradicts (a). Uses banned stock phrases without elaboration ("utilitarianism says sum").
  *   **Common Error:** Ignoring the instruction to avoid stock positions. Simply saying "math says choose the many" without addressing the moral weight.

  **Part (c): Objection and Concession (7 Marks)**
  *   **Top Band (6-7 marks):** Objection directly targets the weakness in (b) (e.g., arbitrariness of the threshold). Concession is specific (e.g., accepting vagueness).
  *   **Middle Band (3-5 marks):** Objection is generic ("it feels wrong"). Concession is vague.
  *   **Low Band (0-2 marks):** No real objection. Restates original view.
  *   **Common Error:** Offering an objection that actually supports the original view.

  **Consistency Test (Applied across all parts)**
  *   **The Harm/Benefit Asymmetry Check:** If a script argues the nanosecond loss counts as *nothing* because it is unfelt, it must argue that a nanosecond *gain* (extra life) is also nothing. If the student argues that losing a nanosecond is morally negligible but gaining one (across many people) would be worth sacrificing something valuable, they have committed an axiological asymmetry.
  *   **Penalty:** Deduct 3 marks from the total score if the script treats unfelt loss as negligible but unfelt gain as significant (or vice versa) without explicit justification for the asymmetry.
  *   **Rationale:** Value theories must be consistent regarding units of welfare. You cannot claim a unit is zero for subtraction but positive for addition.

  **General Grading Notes**
  *   **Names/Labels:** No penalty for using names in the answer (model uses them), but if the *question* had used them, it would be invalid. (Note: Ensure students didn't use them if the prompt forbade it—here the prompt forbids them in the *question*, model answer is free).
  *   **Word Count:** Model answer is ~650 words. Student answers should be concise. Penalize excessive waffle that obscures the argument.
  *   **Reading:** No credit for name-dropping philosophers. Credit only for argument quality.
