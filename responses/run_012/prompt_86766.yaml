answer: |-
  ### Preliminary Analysis: The Joints of the Dispute

  Before drafting the statement, we need to locate the structural load-bearing walls of this argument. You are correct that "person" is doing too much work, but dismissing it as *merely* verbal is a category mistake. In social ontology, verbal disputes over status terms *are* substantive disputes over the distribution of power and protection.

  Here is where the actual joints are:

  1.  **The Descriptive/Normative Slide:** The Threshold Liberal (TL) treats personhood as a *deontic shield* (you have rights because you are a person). The Strong Relationalist (SR) treats personhood as a *teleological goal* (you have obligations because you are becoming a person). They are arguing about whether "person" names a starting block or a finish line.
  2.  **The Metaphysics of Status:** TL relies on a form of intrinsicism (properties inhere in the individual). SR relies on extrinsicism (properties are constituted by the network). The disagreement is whether a solitary human on an island is a person. TL says yes; SR says no (or at best, a *potential* person).
  3.  **The Normative Risk:** TL fears exclusion (if personhood is earned, the tyrant can strip it). SR fears vacuity (if personhood is inherent, the sociopath claims protections they haven't earned).
  4.  **The "Human" Escape Hatch:** Much of this dissolves if we distinguish "Human Being" (biological/metaphysical kind) from "Person" (normative/social status). TL wants to collapse these; SR wants to separate them.

  Below is the draft joint statement. It is designed to be signed, but it exposes the fault lines rather than papering them over.

  ***

  # Joint Statement on the Ontology and Normativity of Personhood

  **Signatories:** [Threshold Liberal Representative], [Strong Relationalist Representative]
  **Facilitated by:** [Your Name]

  ### I. Agreed Claims

  We, the undersigned, acknowledge that our disagreement is not merely terminological but reflects a tension inherent in moral ontology. We agree on the following propositions as the baseline for future discourse:

  1.  **The Necessity of Sociality for Flourishing:** Regardless of the ontological status of personhood, we agree that human beings require robust social relations to develop moral agency, rationality, and psychological integrity. Isolation is destructive to the *capacity* to function as a person, even if it does not extinguish the *status* of personhood.
  2.  **The Danger of Exclusion:** We agree that any theory of personhood must provide a robust account of why it is wrong to treat vulnerable humans (infants, the cognitively impaired, the comatose) as mere things. We differ on *why* it is wrong, but agree that it *is* wrong.
  3.  **Community Fallibility:** We agree that existing communities can be morally wrong about who counts as a person. The SR agrees that a community can fail to recognize a person who *ought* to be recognized; the TL agrees that social recognition is the mechanism by which rights are actualized in practice.
  4.  **The Dual-Usage Hypothesis:** We acknowledge that the English term "person" (and equivalent terms in other languages) is currently doing double duty: (a) designating a metaphysical kind with inherent moral weight, and (b) designating a normative achievement of moral maturity. Our debate is partly about which usage should be privileged in ethical theory.
  5.  **Open Question:** We explicitly leave open whether "personhood" is the correct term for the basis of human rights, or if a distinct term (e.g., "human dignity" or "moral status") should be reserved for the TL's binary concept, leaving "personhood" for the SR's graded concept.

  ### II. Table of Residual Disagreements

  | Domain | Neutral Question | Threshold Liberal (TL) Position | Strong Relationalist (SR) Position |
  | :--- | :--- | :--- | :--- |
  | **Ontological Ground** | What is the primary truth-maker for the predicate "is a person"? | **Intrinsic Properties:** Membership in a kind (human) or possession of basic capacities (potential or actual) is sufficient. Relations are causal conditions, not constitutive ones. | **Extrinsic Relations:** Standing in normative social relations is constitutive. One cannot be a person in isolation; personhood is a status function imposed and sustained by a community. |
  | **Modality** | Is personhood a binary switch or a scalar value? | **Binary/Threshold:** One is either a person or not. There are no degrees of personhood, though there are degrees of *functioning*. | **Graded/Achievement:** Personhood comes in degrees. One can be "more" or "less" of a person based on moral conduct and social integration. |
  | **Forfeiture** | Can an existing person lose their personhood? | **No:** Personhood is inalienable. Even the worst criminal retains the status, though they may lose liberties. | **Yes:** Personhood can be forfeited through anti-social behavior (witchcraft, severe criminality) or neglected through isolation. |
  | **Scope of Obligation** | What is our duty to those with whom we share no relations (distant strangers)? | **Direct:** We owe them duties *because* they are persons. Distance is morally irrelevant. | **Indirect/Constructive:** We owe them duties to *establish* relations. They are potential persons relative to us; our duty is to make them neighbors. |

  ### III. Crux Analysis: Cases and Predictions

  To prevent talking past one another, we identify three test cases. We record our predictions *ex ante* to see where the theories diverge in practice.

  **Crux 1: The Case of the Oppressive Community**
  *Scenario:* A traditional community excludes a specific caste from ritual participation, treating them as sub-persons. The excluded group possesses standard human capacities.
  *   **Shared Bearing:** This tests whether personhood is a tool for liberation or a description of social fact.
  *   **TL Prediction:** The excluded group are full persons. The community is committing a moral error by failing to recognize an antecedent truth. Rights trump community norms.
  *   **SR Prediction:** The excluded group are being *wrongfully denied* the opportunity to achieve personhood. The community is ontologically deficient. The remedy is not to assert inherent status, but to transform the community relations to include them.

  **Crux 2: The Case of the Moral Monster**
  *Scenario:* A serial killer who is highly socially integrated and charismatic, but uses those relations to manipulate and destroy others.
  *   **Shared Bearing:** This tests the link between social integration and moral worth.
  *   **TL Prediction:** The killer remains a person with rights (due process, no torture). Their moral failure is a failure of *action*, not *ontology*.
  *   **SR Prediction:** The killer has actively diminished or lost their personhood. Their "relations" are parasitic, not constitutive of genuine personhood. Punishment may be partly about ontological exclusion.

  **Crux 3: The Case of the Feral Child**
  *Scenario:* A child raised without human contact until age 10, then rescued.
  *   **Shared Bearing:** This tests the necessity of actual vs. potential relations.
  *   **TL Prediction:** The child was a person throughout isolation by virtue of species membership/potential. Rescue is restoring *function*, not conferring *status*.
  *   **SR Prediction:** The child was a "human-it" (in Menkiti's terms), not a person. Rescue initiates the *process* of becoming a person. Status is conferred through integration.

  ### IV. Mandatory Scaffolding Disclosure

  Per the facilitator's requirement, we locate our views within the following grid regarding the grounding of personhood for any being $x$ at time $t$.

  **Options:** (a) Kind Membership, (b) Capacities, (c) Actual Relations, (d) Recognition by Others.

  **Threshold Liberal Disclosure:**
  *   **Ground:** Primarily **(a) Kind Membership**, supported by **(b) Capacities** (as potential).
  *   **Necessity:** (a) is Necessary and Sufficient. (c) and (d) are Causally relevant but Ontologically irrelevant.
  *   **Modality:** **Binary.**
  *   **Defeaters:** None. Status is inalienable.

  **Strong Relationalist Disclosure:**
  *   **Ground:** Primarily **(c) Actual Relations**, mediated by **(d) Recognition**.
  *   **Necessity:** (c) and (d) are Necessary. (a) is Necessary but not Sufficient (one can be human and not a person).
  *   **Modality:** **Graded / Threshold with Defeaters.**
  *   **Defeaters:** Yes. Anti-social behavior or total isolation acts as a defeater for the predicate.

  ### V. Reflexive Conclusion & Vulnerability Assessment

  **The Likely Fudge:**
  The claim in Section I (#5) regarding the "Dual-Usage Hypothesis" is the most fragile point of agreement.
  *   *Why:* The TL will privately resent this because they believe collapsing "Human" and "Person" is politically necessary to protect the vulnerable. Separating them risks creating a class of "humans" without "personhood."
  *   *Why:* The SR will privately resent this because they believe elevating "Human" to a moral category is precisely the Western atomism that erodes community responsibility. If "Human" grants rights automatically, why bother with the hard work of building community?
  *   *Verdict:* We sign this knowing that we are agreeing to *talk* about the distinction, not necessarily to *adopt* it as final metaphysics.

  **What Would Change My Mind (The Redraw Condition):**
  *   **For the TL:** If the SR can demonstrate a case where the "Inherent Status" view *actively causes* harm that the "Achievement" view prevents (e.g., showing that treating criminals as full persons undermines victim restoration in a way that relational accountability fixes), I would move toward a hybrid threshold model.
  *   **For the SR:** If the TL can demonstrate a case where the "Achievement" view *necessarily* leads to atrocity that cannot be checked from within the relational framework (e.g., showing that without an appeal to inherent status, marginalized groups have no leverage against a unanimous oppressive community), I would concede a "basic floor" of ontological status.

  **Where My Reasoning May Fail:**
  As the drafter, my own bias leans toward the Social Ontology view that *all* status is socially constituted (Searle/Tuomela). I may be underestimating the TL's claim that biological kind membership itself carries normative weight independent of social imposition (a form of natural normativity). If natural normativity is coherent, the SR's claim that relations are *constitutive* (rather than just epistemically necessary for recognition) is weakened. I have attempted to bracket this meta-ethical dispute, but it remains the submerged bedrock of the disagreement.

  ***

  ### Facilitator's Note (For your eyes only)

  You asked me to be upfront about the fudge. The "Dual-Usage Hypothesis" (Section I, #4) is the classic Metz/Menkiti compromise move. It works procedurally but often fails metaphysically.

  **Why it might fail:** The SR (Ubuntu tradition) often argues that *rights* themselves are relational. If you grant the TL a category of "Human with Rights" that exists prior to relation, you have already conceded the core liberal metaphysical point. The SR might sign this but feel they have surrendered the ground that *makes* Ubuntu distinct.

  **The Verbal vs. Substantive Check:** You suspected half the fight is verbal. I confirm this, but with a caveat. It is verbal in the sense that they are mapping different concepts onto the word "Person." It is *substantive* because those concepts dictate policy.
  *   If TL wins: We fund universal basic income based on citizenship/biology.
  *   If SR wins: We fund community integration programs and restorative justice based on participation.
  *   *The Fix:* The document forces them to admit they are optimizing for different goods (Protection vs. Integration).

  **Where I Could Be Wrong:**
  I may be too generous to the SR on the "Oppressive Community" crux. The SR claim that "a true community cannot be oppressive" can sound like a no-true-Scotsman fallacy that offers no recourse for the victim *in the moment*. If the SR cannot explain how the victim appeals to justice *before* the community reforms, the TL is right to fear the view. I have tried to capture this in the "Community Fallibility" agreement, but it remains the weakest link in the SR armor.

  If your group members are sophisticated, they will attack Section V immediately. That is where the real work begins.
