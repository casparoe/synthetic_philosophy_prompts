answer: |-
  **The Architecture of Testimony: A Defense of Transmission-Robustness**

  The dominance of the Knowledge Norm (KN) in the literature on assertion rests on a compelling intuition: assertion is the outward expression of an inward epistemic state. To assert $p$ is to represent oneself as knowing $p$. This view, championed by Williamson and others, treats the speech act as a transaction between a speaker and a hearer, where the hearer's primary role is to acquire a belief or act on information. However, as you have noted, this model treats the social life of information as an afterthought. It assumes the hearer is a terminal node. In reality, our epistemic ecosystem functions like a grid: information is generated, transformed, and transmitted. The spokesperson, the journalist, the teacher, and the physician do not merely consume assertions; they are conduits.

  I argue that the fundamental norm governing assertion is not knowledge, but **Transmission-Robustness (TR)**. On this view, one must assert $p$ only if one's epistemic position is sufficiently strong to license the hearer to re-assert $p$ to a third party, accounting for the ordinary degradation of evidence that occurs during transmission. The Knowledge Norm is not false, but it is derivative: it is the limit case of Transmission-Robustness where the expected chain of transmission has a length of one. Below, I defend this position, engage the four pressures you identified, and conclude with a candid assessment of the view's costs.

  ### The Positive Case for Transmission-Robustness

  The central motivation for TR is that the primary epistemic function of assertion is not merely the alignment of beliefs between two agents, but the distribution of epistemic labor. When an expert asserts to a layperson, the goal is rarely just that the layperson believes the proposition. The goal is often that the layperson can integrate that proposition into their own reasoning and, crucially, rely on it in contexts where the expert is not present.

  Consider a structural engineer inspecting a bridge. She asserts to a project manager, "The load-bearing capacity is sufficient." The project manager does not check the math; he asserts to the construction crew, "Pour the concrete." If the engineer's assertion was based on knowledge that was highly idiosyncratic—say, a hunch backed by inaccessible data—the project manager cannot properly assert to the crew. He becomes a broken link. Under KN, the engineer did nothing wrong (she knew the capacity). Under TR, the engineer violated a norm because her epistemic position was not *robust* enough to survive the transmission to the crew. She failed to provide a warrant that could be decoupled from her specific cognitive access.

  TR captures the intuition that in relay cases, the speaker undertakes a responsibility not just for the truth of $p$, but for the *transferability* of the warrant for $p$. Knowledge is often fragile; it depends on specific evidence chains that may not survive summarization. Robustness requires an epistemic position that remains secure even when the downstream hearer lacks the speaker's specific evidence.

  ### Engaging the Pressures

  **1. The Demand and Control Objection**
  The first pressure is whether TR renders assertion unreasonably demanding. If my obligation depends on what a downstream hearer does, and I cannot control them, am I not held responsible for the actions of others?

  This objection conflates *control* with *foreseeability*. Norms often depend on foreseeable contexts without requiring control. If I hand you a crate marked "Fragile," I am obligated to pack it sufficiently to withstand the standard handling of a shipping courier, even though I do not control the courier. I am not responsible if the courier drops it from a plane, but I am responsible if I pack it in tissue paper knowing it will go on a truck.

  Similarly, TR does not require the speaker to guarantee the downstream hearer's rationality. It requires the speaker to anticipate the *standard degradation* of transmission. In a relay context, it is foreseeable that hedges will be stripped, nuance lost, and evidence simplified. The speaker's epistemic position must be strong enough to withstand this entropy. If the speaker knows the hearer is a gossip who distorts everything, TR may forbid assertion entirely. But in standard professional relay cases (doctor to patient to family, scientist to journalist to public), the degradation functions are predictable. The norm is demanding, yes, but this explains why we reserve certain assertions for experts: they are the only ones with epistemic positions robust enough to license downstream transmission.

  **2. The Norm vs. Prudence Objection**
  The second pressure asks whether TR is a genuine norm of assertion or merely a norm of caution. KN is often defended as constitutive: you cannot properly assert without knowledge. Is TR just advice on how to avoid bad consequences?

  TR is constitutive of assertion understood as a *social* institution rather than an individual act. If we view assertion through a Brandomian lens, to assert is to undertake a commitment and license others to rely on that commitment. If I assert $p$ but my epistemic position is such that you cannot properly rely on it to assert $p$ to others (when such reliance is expected), I have failed to fully undertake the commitment inherent in the speech act. I have given you a belief, but not a public warrant.

  Prudence advises against assertion because of external consequences (e.g., "Don't assert or you'll be sued"). TR advises against assertion because the act itself is defective relative to its social function. An assertion that cannot be transmitted in a relay context is like a key that fits the lock but breaks if you try to turn it. It is not merely imprudent to use it; it fails to function as a key.

  **3. The Stability of the Terminal/Relay Distinction**
  The third pressure challenges the stability of the distinction. If every hearer is a potential relay, does the Knowledge Norm vanish entirely?

  This is a feature, not a bug. The distinction between terminal and relay audiences is not metaphysical but pragmatic, grounded in speaker intent and reasonable expectation. When I whisper a secret to a spouse, the reasonable expectation is termination. In that context, the degradation factor is zero, and TR collapses into KN. When I publish a paper, the reasonable expectation is infinite relay.

  However, you are right to suspect that the "terminal" case is an idealization. In the real world, almost all assertions have some downstream potential. This implies that KN is rarely the *actual* governing norm, even when it seems to apply. This does not invalidate KN, but it relegates it to a theoretical baseline. It is the norm for assertion in a vacuum. TR is the norm for assertion in gravity. The instability of the distinction simply highlights that the strength of the required epistemic position is a scalar variable dependent on the expected transmission chain length, not a binary switch.

  **4. Standard Cases and the Knowledge Norm**
  Finally, how does TR handle the standard cases used to motivate KN? Consider the case where I know the train leaves at 4, I tell you, you catch it, and you tell no one. KN says I properly asserted. TR must agree, but for a different reason.

  In this case, the expected chain length is one. Therefore, the required robustness is minimal; it need only survive the transfer to you. Since you are acting immediately, the "degradation" is negligible. TR permits the assertion.

  However, TR diverges from KN in "esoteric knowledge" cases. Suppose I am a mathematician and I know a theorem is true via a proof too complex for you to understand. I assert the theorem to you. KN says I am fine. TR says I am problematic. If you cannot grasp the proof, you cannot re-assert the theorem to your students without relying blindly on my authority. If the context implies you *should* be able to teach this theorem, my assertion was defective under TR, even if I knew it. This aligns better with our intuitions about pedagogy and expertise. We often feel that an expert who cannot explain their conclusion in a transferable way has failed in their assertion, even if they know the truth. TR explains this; KN does not.

  ### Candid Assessment of Costs

  A genuine defense requires acknowledging where this view bleeds. There are three significant costs to adopting Transmission-Robustness as the fundamental norm.

  **First, the Problem of Indeterminacy.**
  KN is crisp: either you know or you don't (ignoring Gettier complications). TR is vague. How much robustness is enough? What is the "ordinary loss" of transmission? In a high-stakes medical context, ordinary loss might be near zero. In casual conversation, it might be high. This makes the norm heavily context-sensitive, potentially to the point of instability. It shifts the burden to the speaker to calculate the social topology of their audience. While I argued this is foreseeable, in practice, it may lead to a paralysis where speakers are unsure if their epistemic position is "robust enough" for the specific social network they are addressing.

  **Second, the Burden on Simplification.**
  TR implies that to assert properly in relay cases, a speaker must often simplify their evidence without distorting it. This creates a tension between accuracy and robustness. To make a warrant transferable, I might have to strip away the very caveats that make my knowledge secure. TR demands I make my knowledge "portable," but portability often requires compression, and compression risks loss of truth. The view places a heavy, perhaps unfair, burden on experts to be not just knowers, but effective communicators. It conflates epistemic authority with rhetorical skill. A brilliant scientist with poor communication skills might be normatively barred from asserting under TR, even if they know more than anyone else.

  **Third, the Blurring of Assertion and Explanation.**
  Finally, TR risks collapsing the norm of assertion into the norm of explanation. To ensure transmission robustness, I often need to explain *why* $p$ is true, not just assert *that* $p$ is true. If the norm requires me to equip you to re-assert, it pushes me toward providing arguments rather than flat assertions. This challenges the idea that assertion is a distinct speech act. If I cannot assert without providing the tools for downstream warrant, the distinction between "asserting" and "arguing" becomes porous.

  ### Conclusion

  Despite these costs, Transmission-Robustness offers a superior map of our epistemic terrain. The Knowledge Norm treats knowledge as a private possession that we show to others. Transmission-Robustness treats knowledge as a public resource that we distribute. The costs—indeterminacy, the burden of communication, and the blurring of speech acts—are not bugs in the theory, but reflections of the messy reality of social epistemology. We do not assert in a vacuum; we assert into a network. If the norm of assertion does not account for the network, it accounts for very little. KN is the norm for the solitary thinker speaking into the void; TR is the norm for the community building a world of shared facts. Given that we live in the latter, TR must be fundamental.
