  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Acknowledge the dominance of the Knowledge Norm (Williamson, etc.).
          *   Introduce the "Relay Problem": Testimony is often infrastructure, not just consumption.
          *   State the thesis: Transmission-Robustness (TR) is fundamental; Knowledge Norm (KN) is derivative.
          *   Roadmap.

      *   **The Positive Case for Transmission-Robustness:**
          *   Why look here? The social function of assertion. It's not just sharing mental states; it's distributing epistemic labor.
          *   Define TR: One must assert $p$ only if one's epistemic position is sufficient to license a downstream assertion by the hearer, given expected degradation (loss of evidence access, simplification of hedges).
          *   Why KN fails here: I can know $p$ based on complex calculus. I tell you. You don't understand the calculus. You tell a third party. If KN is the only norm, you shouldn't assert (you don't know). But the system *needs* you to assert. Therefore, *my* original assertion was defective if it didn't empower you.

      *   **Engaging Pressure 1: Demand and Control:**
          *   *Objection:* I can't control what you do. How can my norm depend on your future actions?
          *   *Response:* Distinguish between *controlling* the hearer and *anticipating* the hearer. Norms are often sensitive to context. If I hand you a fragile vase, I must pack it well enough for the journey, even if I don't control the carrier.
          *   *Refinement:* It's not about *actual* downstream use, but *foreseeable* downstream use. If I know you are a spokesperson, the bar is higher. If I know you are a confidant, the bar is lower.
          *   *Cost:* This makes the norm context-sensitive in a way that might feel unstable.

      *   **Engaging Pressure 2: Norm vs. Prudence (Caution):**
          *   *Objection:* Isn't this just "be careful"? Constitutive norms (like KN) define the act. Prudential norms advise on consequences.
          *   *Response:* TR is constitutive of *socially functional* assertion. Assertion is a speech act that changes normative statuses (Brandomian flavor). If I assert but cannot license you to re-assert, I haven't fully played the game of testimony. I've given you a belief, not a warrant.
          *   *Distinction:* Prudence says "Don't assert or you'll get sued." TR says "If you assert, you undertake a responsibility to license further transmission."

      *   **Engaging Pressure 3: The Terminal/Relay Distinction:**
          *   *Objection:* Everyone is a relay. We all talk to others. So KN never applies.
          *   *Response:* Concede the point partially. KN is an idealization. However, we can distinguish based on *speaker intent* and *reasonable expectation*.
          *   *Nuance:* If I whisper a secret, I reasonably expect termination. If I publish a paper, I expect relay.
          *   *Implication:* KN isn't false, it's just the limit case where the expected chain length is 1. But since chain length is rarely 1, TR is the *fundamental* norm.
          *   *Weakness:* This makes the norm heavily dependent on pragmatic expectations, which varies wildly.

      *   **Engaging Pressure 4: Standard Cases (The "Moore" style cases):**
          *   *Scenario:* I know the train leaves at 4. I tell you. You catch the train. You tell no one.
          *   *TR Analysis:* Even here, TR applies but collapses to KN. Why? Because the "degradation factor" is zero if no transmission occurs. But wait, TR requires the *capacity* for robustness.
          *   *Adjustment:* In terminal cases, the "downstream" requirement is vacuous or minimal. So TR permits assertion where KN permits it.
          *   *Conflict:* What if I have a Gettierized belief that is true and justified but not knowledge? KN says no assert. TR might say assert if it's robust enough for the specific hearer? No, stick to the prompt's claim: KN is derivative. So if it's terminal, TR = KN.
          *   *Real Conflict:* What if I know $p$, but my evidence is esoteric? KN says Assert. TR says Don't (because you can't pass the warrant).
          *   *Verdict:* TR bites the bullet. In standard cases where the hearer *could* have passed it on but didn't, the speaker was still obligated to provide robust warrant. This explains why "trust me, I'm an expert" feels different from "here's the data."

      *   **Candid Assessment of Costs/Weaknesses:**
          *   1. *Vagueness:* How much robustness is enough? (The "Packaging" problem).
          *   2. *Speaker Burden:* It places a heavy load on experts to simplify without distorting.
          *   3. *The "Liar" Problem:* If I lie robustly (you can pass on my lie easily), TR doesn't forbid it (TR is about epistemic position, not truth). Wait, TR is an *epistemic* norm. It requires a good epistemic position. So lies are out.
