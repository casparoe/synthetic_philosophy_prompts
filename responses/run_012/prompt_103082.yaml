      *   **Core Thesis:** The fundamental norm is not Knowledge (KN), but *Transmission-Robustness* (TR). KN is derivative (applicable only when the audience is terminal).
      *   **Key Concept:** Assertions are often made to be passed on (relay cases: spokespersons, inspectors, physicians). The original speaker's epistemic position must sustain the assertion through downstream transmission losses (loss of evidence, caveats, hedges).
      *   **Required Engagements:**
          1.  Demand/Control Objection: Is TR too demanding since speakers can't control downstream hearers?
          2.  Norm vs. Prudence Objection: Is TR just a norm of caution/wisdom rather than constitutive of assertion?
          3.  Stability of Distinction: Is the terminal/relay distinction stable? If everyone is a relay, does KN vanish?
          4.  Standard Cases: How does TR handle standard KN motivation cases (terminal audience, immediate action)?
