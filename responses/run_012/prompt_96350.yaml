      *   *Correction on Fink:* A fink removes the disposition *when* the trigger happens. In RL, if I have a "safe RL" shield that overrides actions *only* when a dangerous state is detected, is that a mask or a fink?
          *   If the shield changes the *action* but the *policy* $\pi$ remains the same underneath: Mask (blocks manifestation).
          *   If the shield actually *modifies the weights* $\theta$ temporarily: Fink.
          *   Actually, Lewis's Fink removes the *disposition*. If the disposition is the *capacity* to act, and the shield prevents the capacity from existing *at that moment*, it's a fink. But in ML, capacities are static at inference. So Finks are rare in standard RL, common in Meta-RL or Adaptive Control. I need to make this distinction clear.
      *   *Correction on Mask:* A mask allows the disposition to exist. If I have a policy $\pi$ and I clip the action, the policy $\pi$ still "wants" to do $a$. The manifestation (effect on env) is blocked. This maps well.

  9.  **Final Polish:** Ensure the distinction between "Policy" (function) and "Parameters" (basis) is clear, as this maps to Disposition vs. Basis. Ensure the "Residue" section directly answers the "Limitation vs. Fluff" question.

  **(Self-Correction on the "Mask vs. Dist Shift" question):**
