      *   **Task 1:** Restate the Dark Forest argument using *only* survival game vocabulary (spawns, maps, bases, etc.).
      *   **Task 2:** Provide a "residue report" (what translated well, what was fudged, what didn't translate).
      *   **Task 3:** Address the core question: When things don't translate, is it because the game brain is missing something real, or because the Dark Forest theory relies on shaky assumptions (like no communication, infinite game)?
