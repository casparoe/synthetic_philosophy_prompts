      *   *Axiom 2:* Civilizations continuously grow and expand, but total matter in the universe is constant.
      *   *Concept 1:* Chains of Suspicion (I don't know if you're good; you don't know if I know you're good; distance makes communication slow/unreliable).
      *   *Concept 2:* Technological Explosion (A weak civ can suddenly become strong and wipe you out).
      *   *Conclusion:* The only safe move is to destroy any detected civ immediately. Silence is survival.

