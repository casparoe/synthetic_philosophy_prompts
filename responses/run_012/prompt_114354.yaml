  The wine sat between them, a dark reservoir in the candlelight. Twenty years had etched lines around Elias's eyes, but his hands still moved as if sketching equations in the air. Julian sat straighter, his gaze fixed on the label of the bottle, as if reading the fine print for errors.

  "It's the cleanest thing I've ever seen," Elias said, tapping his fork against the table. "The strategy-stealing argument. You have to admit, Julian. It's elegance personified."

  "It's a parlor trick," Julian said, not looking up. "It tells you the house is on fire but refuses to point out the smoke."

  "It tells you the fire *must* exist. In Hex, we know the first player wins. We know it with absolute certainty. No computation, no brute force. Just pure logic."

  "Logic that hides the work," Julian countered. "You assume a winning strategy for the second player exists, then you show the first player can steal it. But the entire weight of the proof rests on one physical intuition: that having an extra stone on the board never hurts you."

  Elias leaned forward. "But it doesn't hurt. In Hex, your own stones are bridges, not obstacles. That's the beauty. I play an arbitrary move. Then I pretend I'm you, playing your winning strategy. If your strategy ever calls for playing on that arbitrary spot I already took, I just play somewhere else. Since an extra stone only helps, I win. Contradiction. The second player cannot have a winning strategy."

  "In Hex," Julian emphasized. "Because you've already decided the game is monotonic. If I apply that same argument to a game with *zugzwang*, where being forced to move is a liability, your proof proves a falsehood. It tells me the first player wins in a game where the first player loses. So the argument itself is hollow. It's a machine that only works when you already know the answer."

  Elias swirled his wine. "So? Mathematics is full of existence proofs that don't construct the object. We know there are transcendental numbers without writing one down for centuries. Does their existence matter less because we couldn't name them?"

  "This isn't a number in a void. It's a game." Julian finally looked at him. "A proof is supposed to illuminate. If I sit down at a Hex board, and you tell me, 'Elias, you are White, you have a forced win,' but you cannot tell me where to place my first stone, you haven't given me mathematics. You've given me an oracle. You've told me the treasure is buried here, but you've handed me a shovel with no handle."

  Elias smiled, a sad, tired expression. "I concede the handle. I can't play the game better than you. I don't know the opening move. But I know the landscape. I know that the territory belongs to the first mover. There is value in mapping the boundaries of truth, even if we can't walk the path."

  "But is it truth if it's inaccessible?" Julian pressed. "You say the first player wins. But if the winning strategy is too complex for any human mind to compress, if it requires a lookup table the size of the universe... in what sense does that strategy *exist*? To say 'there is a move' implies someone could make it. If no one can ever say how, you're not describing a game. You're describing a metaphysical assertion."

  Elias paused. He looked at his hands. "I grant you this: the premise carries the weight. The logic is just the lever. Without the intuition that stones don't obstruct, the lever breaks. I need the game."

  "And I grant you," Julian said softly, "that the logic is valid. If the premise holds, the conclusion follows. I am not saying you are wrong. I am saying you are empty."

  They sat in the noise of the restaurant, the clatter of plates filling the silence.

  "So we are left with the ghost," Elias said. "A fact that hangs over the board. The first player wins. But the how is lost to complexity."

  "Or," Julian said, picking up his fork, "it's not a fact yet. It becomes a fact only when the move is made."

  Elias shook his head. "No. The move waits for us. That's the terror of it. Can it be a fact about a game that the first player wins, when nobody will ever be able to say how?"
