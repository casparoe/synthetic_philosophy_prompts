prompt: |-
  Next term I am teaching a graduate seminar on the ethics of deception, and I have run into a pedagogical wall that I should like you to help me get over. My students are entirely at home in the distinction as the philosophy of language draws it: a lie as a false assertion made with the intention of being believed, misleading as a true utterance that nevertheless induces a false belief. They can run the usual moves about the gap between what is said and what is conveyed, about the difference between misleading by implicature and misleading by trading on a presupposition the hearer already holds, and they are happy to argue about whether the merely misleading speaker is more culpable than the outright liar or less. What they lack, and what I want to give them, is a translation of the whole apparatus into a vocabulary they do not yet have and that I happen to know rather well from my own training: the economics of information. I am fluent in it — types and mechanisms, incentive compatibility, the revelation principle, cheap talk, signalling and screening, sender–receiver games, and above all information design and Bayesian persuasion — well enough to teach it, though I am not a working economist and make no claim to be abreast of the frontier. A colleague in the economics department tells me the distinction is a distinction without a difference, since all that ultimately matters is the receiver's posterior; I want to know whether he is right, or whether he is simply describing the limits of his own formalism and calling them the limits of the subject.

  What I should like from you is a systematic translation, undertaken in good faith, followed by an honest report of what the translation fails to carry. Begin with a translation dictionary: for each element of the ethical apparatus — the act of assertion, the content asserted, the hearer's uptake, the speaker's intention, the wrong done — give the closest counterpart in the information-design vocabulary, and say how tight the fit is. Then take the six species of deceptive act around which I organise the course and render each of them as a sender–receiver problem: (i) a flatly false assertion made in order to be believed; (ii) a literally true assertion whose implicature is false; (iii) a literally true assertion that trades on a false presupposition the hearer already holds, so that the hearer supplies the error; (iv) a truthful but selective presentation of evidence that moves the hearer's posterior without any false content at all, where the speaker knows in advance which comparisons the hearer will make; (v) deception by omission, in which nothing false is said but the hearer's default assumption — that a report is complete, say, or that a quoted price includes tax — is left uncorrected; and (vi) deception by making the world rather than the words, as when evidence is planted or an observation arranged so that no utterance occurs at all.

  The residue report is the part I care about most, so please do not hurry it. I want to know which claims in the ethics translate cleanly, which translate only at the cost of distortion, and which have no expression whatever in the target vocabulary; and for each residue, whether it marks a genuine gap in the formal apparatus or a sign that the original claim was less determinate than it looked. My own suspicion, which I should like you to test rather than flatter, is that the lying/misleading distinction is causally invisible to the economics — that once the receiver's prior and updating rule are fixed and common knowledge, exploiting them is simply another channel, and the point at which error enters the causal chain makes no difference to anything the formalism can express — while being normatively central to the ethics, which is concerned with what the hearer is entitled to infer and with the recruitment of the hearer's own reasoning as the proximate cause of the error. If that is right, tell me what follows for the two disciplines; if it is not, tell me where the translation does better than I have allowed. Throughout, keep the translation honest: where you find yourself importing an assumption of the target framework — that only the posterior matters, or that the receiver's inference rule is always given — flag it as an assumption rather than presenting it as a result of the translation.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A philosophy professor teaching a graduate seminar on the ethics of deception.
      *   **Problem:** Students understand the philosophy of language distinctions (lying vs. misleading, assertion vs. implicature, etc.) but lack an understanding of the economics of information (information design, signaling, Bayesian persuasion, etc.).
      *   **Goal:** A systematic translation of the ethical/philosophical apparatus into the economic/information-design vocabulary.
      *   **Specific Tasks:**
          1.  Create a translation dictionary (Ethical Concept $\to$ Economic Concept + Fit Assessment).
          2.  Translate six specific species of deceptive acts into sender-receiver problems.
          3.  Provide a "Residue Report" (what translates cleanly, what distorts, what is lost).
          4.  Address the colleague's claim (distinction without a difference based on posterior) vs. the professor's suspicion (causally invisible but normatively central).
          5.  Maintain intellectual honesty (flag assumptions, don't flatter).
      *   **Tone:** Academic, rigorous, respectful, nuanced, "in good faith."

  2.  **Deconstruct the Translation Dictionary:**
      *   *Act of Assertion:* In economics, this is a *message* ($m$) from a set $M$. Fit: Tight, but "assertion" carries normative weight (commitment) that "message" lacks.
      *   *Content Asserted:* The semantic content. In economics, this is the mapping from state $\omega$ to message $m$. Fit: Loose. Economics cares about information content (partitioning), not semantic truth conditions.
      *   *Hearer's Uptake:* Posterior belief ($\mu$). Fit: Very Tight. This is the core of Bayesian updating.
      *   *Speaker's Intention:* Utility function ($u_S$) dependent on receiver action ($a$). Fit: Tight, but reduces moral intention to preference ordering.
      *   *The Wrong Done:* Welfare loss, inefficiency, or violation of mechanism constraints (e.g., incentive compatibility). Fit: Poor. Economics describes *outcomes*, ethics describes *wrongs*.

  3.  **Translate the Six Species of Deceptive Acts:**
      *   *(i) Flatly False Assertion (Lying):* Sender sends $m$ indicating $\omega_1$ when state is $\omega_2$. In standard cheap talk, this is off-equilibrium or requires a lying cost. In Bayesian Persuasion (Kamenica-Gentzkow), the sender chooses a signal structure. A lie is a signal realization that is impossible under the true state *if* the signal is verifiable. If cheap talk, it's just a message. *Key distinction:* Economics often assumes verifiable or costless talk. To model a lie, we need a "lying cost" or a constraint on message space (verifiability).
      *   *(ii) True Assertion, False Implicature:* Message $m$ is technically consistent with $\omega$, but signal structure $\pi$ is designed so $P(\omega|m)$ induces wrong action. This is classic *Bayesian Persuasion*. The signal is truthful (likelihoods are valid) but informative in a biased way.
      *   *(iii) True Assertion, False Presupposition:* Receiver has incorrect prior $\mu_0$. Sender sends $m$ consistent with $\mu_0$. Sender doesn't correct prior. This is *exploiting prior bias*. Economics usually assumes common knowledge of priors. If priors differ, it's "agreeing to disagree" or heterogeneous priors models.
      *   *(iv) Selective Evidence (Truthful but Biased):* This is the definition of *Bayesian Persuasion*. Sender chooses information structure $\pi$ to maximize $E[u_S]$. The signal is valid, but the *selection* of the experiment is strategic.
      *   *(v) Deception by Omission:* Sender observes $\omega$ but sends null message or partial message. In disclosure models (Milgrom/Roberts), this is "unraveling" failure. If there's no cost to disclose, omission signals bad news. If there is a cost or friction, omission can sustain pooling.
      *   *(vi) Making the World (Evidence Planting):* This changes the state $\omega$ or the signal generation process itself. This is *moral hazard* combined with information design. The sender affects the state distribution, not just the signal.

  4.  **Drafting the Residue Report (The Core Challenge):**
      *   *The Colleague's Claim:* "Distinction without a difference." From a *consequentialist* welfare perspective focusing solely on the posterior/action, the colleague is right. The receiver takes action $a(\mu)$. If $\mu$ is the same, $a$ is the same.
      *   *The Professor's Suspicion:* "Causally invisible but normatively central." The *path* to the posterior matters ethically (autonomy, entitlement to infer). Economics treats the signal structure as a choice variable but doesn't morally weight *how* the posterior was reached (lie vs. imply).
      *   *What Translates Cleanly:* Incentives, posteriors, actions, welfare outcomes.
      *   *What Distorts:* Intention (reduced to utility), Truth (reduced to consistency with signal structure).
      *   *What is Lost:* Normative force, the "right to truth," the distinction between *making* someone believe vs. *letting* them believe.
      *   *The "Gap":* Economics assumes rationality/common knowledge. Ethics assumes entitlements. The "wrong" in lying is often deontological (violation of a norm of assertion), which has no counterpart in consequentialist mechanism design unless modeled as a constraint (e.g., "honesty constraint").

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction on Lying:* In standard Bayesian Persuasion, the sender *cannot* lie about the signal realization if the signal is verifiable. If it's cheap talk, "lying" is just sending a message that doesn't reveal the state. To distinguish lying from misleading in economics, we need *verifiability constraints*. A lie is sending a message $m$ that is *infeasible* given state $\omega$. Misleading is sending a feasible $m$ that induces wrong inference.
      *   *Correction on Priors:* Standard models assume common priors. Case (iii) requires heterogeneous priors or "subjective beliefs." This is a known friction in econ.
      *   *The "Residue":* The ethical distinction relies on the *norm of assertion*. Economics has no "norm," only "equilibrium." The residue isn't necessarily a failure of economics, but a difference in *project*. Economics predicts; Ethics evaluates.
      *   *Addressing the Colleague:* He is right *within the model* if the model only cares about ex-post welfare. He is wrong if the model incorporates "truth-telling constraints" or "lying costs" which effectively internalize the ethical distinction as a technological constraint.
      *   *Addressing the Professor:* Your suspicion is correct regarding the *standard* formalism. However, information design *can* model the distinction if you constrain the signal space (verifiability). The "gap" is that economics treats verifiability as a technical constraint, whereas ethics treats truthfulness as a moral constraint.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the ambition and validity of the project.
      *   **Part I: The Translation Dictionary:** Table or list format. Concept $\to$ Counterpart $\to$ Fit Quality.
      *   **Part II: The Six Species:** Detailed mapping for each case.
      *   **Part III: The Residue Report:** The philosophical meat. Address the colleague and the professor's suspicion.
      *   **Conclusion:** Pedagogical advice.

  7.  **Tone Check:** Ensure I don't sound like an economist dismissing philosophy or a philosopher dismissing economics. Maintain the "honest broker" stance requested. Use precise terminology (Kamenica-Gentzkow, Cheap Talk, Verifiability, Common Priors).

  8.  **Final Polish:** Check against the prompt's specific constraints (flag assumptions, don't hurry the residue report). *Self-correction:* Make sure to explicitly flag the assumption that "only the posterior matters" as an economic assumption, not a universal truth. Ensure the distinction between *cheap talk* (non-verifiable) and *hard information* (verifiable) is central to the lying vs. misleading translation.

  *(Self-Correction during drafting Part II)*: For (i) Lying, I need to be careful. In Bayesian Persuasion, the sender commits to a *distribution* of signals. They don't "lie" about the signal; they choose a noisy signal. Lying fits better in *Cheap Talk with lying costs* or *Disclosure with Verifiability*. I must distinguish these frameworks to do the translation justice.
  *   *Lying:* Sending a message $m$ that is not in the feasible set $M(\omega)$.
  *   *Misleading:* Sending $m \in M(\omega)$ that induces belief $\mu \neq \omega$.
  This technical distinction mirrors the philosophical one perfectly *if* we assume verifiability. If we assume cheap talk, the distinction collapses (all talk is cheap). I need to highlight this.

  *(Refining the Residue)*: The ethical "wrong" often involves the *relationship* between speaker and hearer (fiduciary, conversational). Economics models this as repeated games or reputation, but a one-shot seminar example loses this. I should mention *relational contracts* or *reputation* as the economic proxy for ethical norms.

  Okay, ready to write. The structure is clear. The content needs to be high-level graduate seminar appropriate.cw
answer: |-
  This is a formidable pedagogical challenge, precisely because you are asking for a mapping between a normative framework (ethics) and a positive/formal one (information economics). The friction you anticipate is real: ethics is often concerned with the *constitution* of the act, while economics is concerned with the *consequences* of the act (specifically, the induced action).

  Below is the systematic translation you requested, followed by the residue report. I have endeavored to keep the economic formalism honest, flagging where the model imposes constraints that the ethical framework does not, and vice versa.

  ### Part I: The Translation Dictionary

  Here, I map the core concepts of the ethics of deception onto the vocabulary of information design and mechanism theory.

  | Ethical Concept | Economic Counterpart | Fit Assessment |
  | :--- | :--- | :--- |
  | **The Act of Assertion** | **Message ($m$)** drawn from a message space $M$. | **Tight, but thin.** In economics, a message is a costless (cheap talk) or costly signal. It lacks the normative "commitment" inherent in assertion. To capture the *norm* of assertion, one must add a constraint (e.g., a "lying cost" or verifiability constraint). |
  | **The Content Asserted** | **Signal Realization / Information Structure ($\pi$).** | **Loose.** Ethics cares about truth-conditions (correspondence to state $\omega$). Economics cares about *informativeness* (partitioning of the state space). A "true" assertion in economics is one consistent with the signal structure, not necessarily the state. |
  | **The Hearer's Uptake** | **Posterior Belief ($\mu$).** | **Very Tight.** Both frameworks treat the hearer as an updater. In economics, this is strictly Bayesian: $\mu = P(\omega \| m)$. |
  | **The Speaker's Intention** | **Sender's Utility Function ($u_S(a, \omega)$).** | **Tight, but reductive.** Intention to deceive translates to the sender preferring an action $a$ based on false $\mu$ rather than true $\omega$. Moral intention (malice, duty) is collapsed into preference orderings. |
  | **The Wrong Done** | **Welfare Loss / Inefficiency / Violation of IC.** | **Poor.** Economics identifies "wrong" with Pareto inefficiency or violation of Incentive Compatibility (IC). It cannot natively capture deontological wrongs (e.g., violation of autonomy) unless modeled as a constraint. |
  | **The Norm of Truth** | **Verifiability Constraint / Hard Information.** | **Moderate.** In disclosure models, the sender can only send messages $m \in M(\omega)$. If $M(\omega)$ is a singleton, truth is forced. If $M(\omega)$ is large, deception is possible. This mirrors the distinction between lying (sending impossible $m$) and misleading (sending possible but ambiguous $m$). |

  **Assumption Flag:** The economic framework assumes the receiver's updating rule is fixed and known (Common Knowledge of Rationality). It assumes the "wrong" is measurable in terms of utility or welfare. It does not assume a intrinsic disvalue to falsehood unless explicitly parameterized (e.g., a "lying cost" parameter $k$).

  ---

  ### Part II: The Six Species as Sender–Receiver Problems

  I will render your six cases using the standard **Bayesian Persuasion** (Kamenica & Gentzkow, 2011) and **Information Disclosure** (Milgrom & Roberts, 1986) frameworks. Let $\omega$ be the state of the world, $\mu$ the receiver's belief, and $a$ the receiver's action.

  **(i) The Flat Lie (False Assertion)**
  *   **Ethical Description:** Speaker asserts $p$, knows $\neg p$, intends hearer to believe $p$.
  *   **Economic Translation:** This requires a **Cheap Talk with Lying Costs** or **Verifiability** model.
      *   *Scenario:* The sender observes $\omega$. The message space $M$ allows for claims about $\omega$.
      *   *Mechanism:* If the model assumes *hard information* (verifiability), a lie is sending a message $m$ such that $m \notin M(\omega)$ (technically infeasible). If the model assumes *cheap talk*, a lie is sending $m$ that implies a state $\omega'$ when $\omega \neq \omega'$, incurring a psychological or reputational cost $c(m, \omega)$.
      *   *Result:* The sender trades off the benefit of the induced action $a(\mu')$ against the cost of lying $c$.
  *   **Fit:** Good, provided you specify that "assertion" implies a claim of verifiability.

  **(ii) The Misleading Implicature (True Assertion, False Implication)**
  *   **Ethical Description:** Speaker asserts $p$ (true), knowing hearer will infer $q$ (false).
  *   **Economic Translation:** This is the core of **Bayesian Persuasion**.
      *   *Scenario:* The sender commits to an information structure $\pi(s \| \omega)$.
      *   *Mechanism:* The sender chooses a signal $s$ that is *truthful* (the likelihoods are valid) but *noisy*. For example, grouping a bad state $\omega_B$ with a good state $\omega_G$ into a single signal realization $s_{good}$.
      *   *Result:* The receiver updates to $\mu(s_{good})$, which is technically correct given the signal structure, but leads to an action $a$ that the receiver would not take if they knew $\omega$. The sender exploits the gap between the signal and the state.
  *   **Fit:** Excellent. This is precisely what information design models.

  **(iii) Trading on False Presupposition (Exploiting Prior Error)**
  *   **Ethical Description:** Speaker asserts $p$ (true), knowing hearer holds false background belief $b$, and $p + b \to$ error.
  *   **Economic Translation:** **Heterogeneous Priors** or **Biased Updating**.
      *   *Scenario:* Standard models assume Common Priors ($\mu_0$). Here, Sender knows Receiver's prior is $\mu_0^R$, which is incorrect relative to objective frequencies.
      *   *Mechanism:* Sender chooses message $m$ to maximize utility given $\mu_0^R$. Sender does not correct $\mu_0^R$ because doing so might reduce the probability of the desired action (or correcting is costly).
      *   *Result:* This is often modeled as "optimal persuasion with biased receivers." The sender tailors the signal to the receiver's bias rather than the truth.
  *   **Fit:** Moderate. Standard theory assumes common priors; this requires a specific deviation (heterogeneous priors) which is technically tractable but less standard.

  **(iv) Selective Evidence (Truthful but Biased Presentation)**
  *   **Ethical Description:** Presenting true facts $F_1...F_n$ while withholding $F_{n+1}$, knowing comparison induces error.
  *   **Economic Translation:** **Information Design / Experiment Choice.**
      *   *Scenario:* Sender chooses the *experiment* $\pi$.
      *   *Mechanism:* The sender is free to choose any Blackwell-informative structure. They choose a structure that is fully truthful (no lies) but has low "Blackwell informativeness" regarding the specific dimension the receiver cares about.
      *   *Result:* This is the definition of the Kamenica-Gentzkow solution. The sender creates a distribution of posteriors that is a mean-preserving spread of the prior, optimized for sender utility.
  *   **Fit:** Perfect. This is the canonical economic model of deception without lying.

  **(v) Deception by Omission (Failure to Correct Default)**
  *   **Ethical Description:** Not speaking when convention expects speech (e.g., "price includes tax").
  *   **Economic Translation:** **Disclosure Games / Unraveling Failure.**
      *   *Scenario:* Sender observes $\omega$. Can send $m=\omega$ or $m=\emptyset$ (null).
      *   *Mechanism:* In standard unraveling (Grossman/Milgrom), if disclosure is costless, all types disclose. Omission implies the worst type. To sustain omission as deceptive, you need a **friction**: a cost of disclosure, or a receiver who naively assumes $m=\emptyset$ means "average" rather than "worst."
      *   *Result:* If the receiver is sophisticated, omission cannot deceive (they infer the worst). If the receiver is naive (behavioral econ), omission works.
  *   **Fit:** Tight, *if* you assume the receiver is not fully rational (naive) or there are disclosure frictions. In a fully rational equilibrium, omission is transparent.

  **(vi) Making the World (Planting Evidence)**
  *   **Ethical Description:** Arranging facts so they are true but misleading (e.g., staging a photo).
  *   **Economic Translation:** **Moral Hazard in Information Production.**
      *   *Scenario:* Sender affects the state $\omega$ or the signal generation process $P(s \| \omega)$.
      *   *Mechanism:* This combines *Hidden Action* (Moral Hazard) with *Hidden Information* (Adverse Selection). The sender exerts effort $e$ to change the probability of a favorable signal, independent of the underlying quality.
      *   *Result:* The signal is "true" (it occurred), but the causal link between signal and state is severed.
  *   **Fit:** Good, but requires a multi-stage model (action then signal).

  ---

  ### Part III: The Residue Report

  This is the critical section. You asked whether your colleague is right (distinction without a difference) or whether your suspicion holds (causally invisible but normatively central).

  **1. The Colleague's Claim: "All that matters is the posterior."**
  *   **Verdict:** *Technically true within the standard consequentialist welfare framework, but substantively incomplete.*
  *   **Analysis:** In a standard Sender-Receiver game, the Receiver's utility depends on $u_R(a, \omega)$. The action $a$ depends on $\mu$. If a Lie and a Misleading Implicature produce the identical posterior $\mu$, they produce the identical action $a$, and thus the identical material welfare for the Receiver.
  *   **The Assumption:** This relies on the assumption that the Receiver's utility function does not include a term for "being lied to." If the Receiver has "taste for truth" (a deontological preference), then the *path* to the posterior enters the utility function.
  *   **Conclusion:** Your colleague is describing the limits of *consequentialist* mechanism design. If the model only values outcomes, the distinction vanishes.

  **2. Your Suspicion: "Causally invisible... normatively central."**
  *   **Verdict:** *Correct. The economic formalism treats the "channel" of deception as a technical constraint, whereas ethics treats it as a moral boundary.*
  *   **The Translation Gap:**
      *   **In Economics:** The distinction between Lying (i) and Misleading (ii) is modeled as a difference in the **Message Space Constraint**.
          *   Lying is constrained by $m \in M(\omega)$ (Verifiability).
          *   Misleading is unconstrained (Cheap Talk/Persuasion).
          *   *Economic View:* These are just different technologies. One is more expensive (requires forging evidence) or impossible (hard info).
      *   **In Ethics:** The distinction is about **Agency and Entitlement**.
          *   Lying violates the norm of assertion (you claim authority you don't have).
          *   Misleading exploits the hearer's reasoning (you let them hang themselves).
          *   *Ethical View:* The hearer is *entitled* to rely on assertion, but *responsible* for their own inferences.
  *   **The Residue:** Economics cannot express "entitlement." It can only express "equilibrium constraints."
      *   *Example:* In case (v) Omission, economics says: "If the receiver is rational, they should infer the worst." Ethics says: "The speaker has a duty to correct the default assumption." The economic model treats the duty as a parameter; the ethical framework treats it as a premise.

  **3. What Translates Cleanly?**
  *   **Incentives:** The speaker's motivation to deceive maps perfectly to the divergence of utility functions ($u_S \neq u_R$).
  *   **Information Asymmetry:** The structural condition for deception is perfectly captured by the sender observing $\omega$ and the receiver not.
  *   **Strategic Ambiguity:** The concept of "keeping the receiver in the dark" is precisely modeled by Blackwell informativeness.

  **4. What Translates Only with Distortion?**
  *   **Intention:** In ethics, intention distinguishes deception from mere error. In economics, "intention" is just the maximization of $E[u_S]$. A sender who accidentally misleads (due to a model error) looks the same as a strategic deceiver in the outcome, though mechanism design can model "types" (honest vs. dishonest).
  *   **The "Wrong":** Economics translates "wrong" as "inefficiency." But deception can be Pareto efficient (e.g., a "white lie" that makes everyone happier). Ethics might still condemn this; Economics would applaud it. This is a fundamental clash of axioms.

  **5. What Has No Expression in the Target Vocabulary?**
  *   **The Norm of Assertion:** There is no variable for "the right to be told the truth." You can model a *cost* to lying, but that treats truth-telling as a resource constraint, not a moral duty.
  *   **Recruitment of Reasoning:** Your point about "recruitment of the hearer's own reasoning" (Case ii & iii) is the hardest to translate. Economics models the hearer as a function $f(m) \to \mu$. It does not distinguish between $f$ being "hijacked" vs. "informed." The *autonomy* of the hearer is not a variable in the welfare function.

  ### Pedagogical Implications

  **Is the distinction without a difference?**
  Your colleague is right *if* the goal is predicting market outcomes or equilibrium behavior in a one-shot game with rational agents. In that world, a receiver who can be misled by a true statement is functionally identical to one who can be lied to; both have been manipulated to the same posterior.

  However, your suspicion is right *if* the goal is normative evaluation or institutional design.
  1.  **Legal/Institutional Design:** We regulate lies (fraud) differently from misleading implications (puffery). Why? Because enforcement costs differ. It is cheaper to verify truth (did he say X?) than to verify implication (did he mean Y?). The economic translation here is **Verification Costs**. The ethical distinction maps to the **Cost of Enforcement**.
  2.  **Reputation/Repeated Games:** In a repeated setting, lying often carries a higher reputation cost than misleading because it is more detectable. The "norm" emerges as an equilibrium strategy. Here, economics *can* recover the ethical distinction as a **focal point in a repeated game**.

  **Recommendation for the Seminar:**
  Use the translation to show the students that the "lying vs. misleading" distinction is **technologically contingent**.
  *   If verification is costless (hard info), lying is impossible; only misleading remains.
  *   If verification is impossible (cheap talk), lying and misleading collapse into "talk."
  *   The ethical distinction persists *because* we live in a world where verification is costly and norms serve as low-cost enforcement mechanisms.

  **The Final Verdict:**
  The economic formalism does not *deny* the ethical distinction; it **endogenizes** it. What ethics treats as a categorical boundary (Lie vs. Mislead), economics treats as a continuum of signal verifiability and inference costs.
  *   **Tell your students:** "The economist asks: 'How hard is it to prove you lied?' The ethicist asks: 'Did you violate a duty?' The translation shows that the duty often tracks the difficulty of proof."
  *   **Tell your colleague:** "You are right that the *posterior* is the same. But you are wrong that the *mechanism* is irrelevant. The mechanism determines the stability of the equilibrium (reputation) and the cost of regulation (verification). The ethical distinction is a heuristic for those economic frictions."

  This approach respects the rigor of the economics while preserving the normative insight of the philosophy. It shows that the "residue" is not a failure of the formalism, but a difference in the *objective function* of the two disciplines.
