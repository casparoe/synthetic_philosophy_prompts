answer: |-
  ### Brainstorming Pass: The Standard Cast of Cases

  *   **The Threatened Belief (The Pragmatic Doxastic Case):** A demon threatens to torture you unless you believe the moon is made of cheese.
      *   *What it shows:* Prudential reasons (avoiding pain) can count as reasons *to* believe, but they cannot make the belief epistemically justified or true. They are the "wrong kind" for belief.
  *   **The Bribed Admiration (Ewing's Demon):** An evil demon threatens to torture everyone unless you admire him.
      *   *What it shows:* Moral or pragmatic pressure can give you a reason to admire, but it does not make the demon *admirable*. This is the canonical threat to the Fitting-Attitude analysis of value.
  *   **The Coerced Intention (Kavka's Toxin Puzzle variant):** You are offered a reward for intending to drink a harmless toxin, though you need not actually drink it.
      *   *What it shows:* Incentives can be reasons to *want* to intend, but they cannot be reasons that rationalize the intention itself, since intentions aim at action, not just reward collection.

  ***

  ### The Wrong Kind of Reasons: A Glitch in the Theory of Value

  In contemporary value theory, one of the most elegant ideas is the **Fitting-Attitude (FA) analysis**, often called the **Buck-Passing Account**. The core thesis is deceptively simple: for something to be good is just for it to be the kind of thing that merits a pro-attitude (like desire, admiration, or approval). To say "justice is good" is to say "it is fitting to favor justice." This allows us to "pass the buck" of value onto reasons for attitudes, avoiding the need to posit "goodness" as a mysterious, standalone property.

  But this elegant machinery faces a specific, grinding friction known as the **Wrong Kind of Reasons (WKR) problem**. It is not merely a technical footnote; it is a stress test for whether we can understand value in terms of reasons at all.

  #### 1. Why This Is a Structural Threat, Not a Quirk

  It is tempting to dismiss the WKR problem as a simple category error. We can easily say that the demon's threat gives us a *pragmatic* reason to admire him, but not a *value-based* reason. The demon isn't admirable; he's just dangerous.

  However, for the FA analyst, this distinction is fatal if not handled with extreme care. The FA analysis claims that **Value = Fittingness of Favoring**. If the analysis is to work, it must be extensionally adequate: it must classify exactly the right things as good and the right things as bad.

  If we define "fitting" simply as "there is a reason to have this attitude," the demon becomes admirable. After all, there is an overwhelming reason to admire him (saving the world). To save the theory, the FA analyst must say: "No, only the *Right Kind* of Reasons (RKR) count toward fittingness."

  But here lies the trap. If we must appeal to a prior notion of the "Right Kind" to filter out the demon's threat, aren't we secretly relying on the very notion of value we were trying to analyze? If "Right Kind" just means "reasons that track genuine value," the analysis is circular: *X is good iff there are value-tracking reasons to favor X.* The WKR problem threatens to turn the Buck-Passing Account from a reductive analysis into a tautology.

  #### 2. Drawing the Line: Object vs. Constitutive Standard

  How, then, do we distinguish the Right Kind from the Wrong Kind without smuggling value back in? Philosophers generally divide into two camps, each paying a steep theoretical cost.

  **The Object-Based View:** This view holds that RKRs must concern the **properties of the object** of the attitude. A reason to admire someone must be about *them* (their courage, wit), not about the consequences of admiring them (saving the world).
  *   *The Cost:* This is often too restrictive. Consider gratitude. Sometimes I have reason to be grateful for a benefit even if the benefactor didn't intend it (a lucky accident). Is the "object" the accident or the benefit? Furthermore, this view struggles to explain why some object-based reasons are still "wrong." If a demon threatens to torture me unless I admire his *shoes*, the reason is technically about the object (the shoes), yet it remains the wrong kind.

  **The Constitutive Standard View:** This view argues that RKRs are those that align with the **constitutive aim** of the attitude. Belief aims at truth; admiration aims at excellence. Reasons that help achieve the aim are RKR; reasons that merely coerce the attitude are WKR.
  *   *The Cost:* Defining these "aims" without referencing value is notoriously difficult. Does admiration aim at *actual* excellence or *perceived* excellence? If actual, we risk circularity again (excellence = value). If perceived, we risk making value too subjective. Moreover, some attitudes don't have clear aims. What is the constitutive aim of "being amused"? Is it incongruity? If so, why is a tragic incongruity not funny?

  #### 3. A Hard Case: The Archivist's Envy

  To see why this distinction is so fragile, consider a case I'll call **The Archivist's Envy**.

  Imagine you are the curator of a national archive. A rival private collector possesses a rare manuscript that completes your collection. A benevolent donor offers a grant: "If you can genuinely **envy** the collector's holding, I will fund the preservation of *both* collections. If you feel only professional respect, funding is cut, and the papers will decay."

  You have a profound reason to envy the collector: the preservation of history. This reason is not external coercion (like the demon); it is a moral imperative tied to the very mission of your role. Furthermore, envy is an object-directed attitude; to envy is to desire what another has because you perceive it as good. You can cultivate this perception to unlock the funding.

  Here, we have a consideration (preservation of history) that plainly counts as a reason *for* the attitude (it motivates and rationalizes the cultivation of envy), yet it clearly does not make the attitude **fitting**. The collector's manuscript does not become more enviable because history needs saving. The envy remains unfitting, even if it is morally obligatory to cultivate it.

  This case tests the limits of the RKR/WKR distinction.
  *   **The Object Test:** The reason is about the manuscript (the object of envy). So, is it RKR? If yes, the manuscript becomes "enviable" (valuable in that specific way), which seems wrong.
  *   **The Standard Test:** Does envy aim at "superiority of possession"? If so, the funding doesn't change the superiority. So it's WKR. But why? Is it because the reason is consequentialist? But many RKRs are consequentialist (I admire him because his kindness inspires others).

  The danger here is **presupposition**. To declare the archivist's reason "Wrong Kind," we seem to need to already know that the manuscript isn't truly more enviable. We are using our intuition about *fittingness* to filter the *reasons*, rather than using the *reasons* to define *fittingness*. If the distinction relies on a pre-theoretical grasp of fittingness, the FA analysis has not explained value; it has merely renamed it.

  #### Verdict: Contained, Not Solved

  Is the WKR problem fatal to the Fitting-Attitude analysis? My verdict is **no, but it humbles the project.**

  The problem is containable if we accept that the FA analysis is not a reductive definition in the strictest sense, but rather a structural mapping of the normative domain. We can distinguish RKRs from WKRs by looking at the **normative role** the reason plays. RKRs are reasons that figure in the *correctness conditions* of the attitude (making it successful as that attitude), whereas WKRs figure in the *wisdom conditions* (making it beneficial to have the attitude).

  In the Archivist case, the preservation of history makes it *wise* to envy, but not *correct* to envy. This distinction preserves the intuition without circularity, provided we can flesh out "correctness" independently of "value."

  However, I am **least confident** in our ability to fully explicate "correctness" without lingering traces of value. The line between "making an attitude successful" and "making an attitude valuable to have" is perilously thin. The WKR problem reminds us that while reasons and value are inextricably linked, they are not identical. Value may pass the buck to reasons, but someone still has to sign for the package.
