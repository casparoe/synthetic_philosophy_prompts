answer: |-
  # THE DECISION SORTER
  **Instructions:** Start at **Q1**. Follow the arrows based on your honest answer. Write down the code at the end of your path (e.g., "A-3"). Match the code to the **Position Key** on the reverse.

  **Q1: The 70% Mugger.**
  Omega offers the Counterfactual Mugging deal, but she is only right 7 times out of 10. The coin came up Tails. She asks for $100.
  *   **A:** I do not pay. The coin is already fixed; my money can't change the past. (Go to Q2)
  *   **B:** I pay. The odds are good enough to make the policy profitable. (Go to Q5)
  *   **C:** I need to know more about how she predicts. (Go to Q3)

  **Q2: The Human Reader.**
  Same deal as Q1 (Tails, $100 ask), but the predictor is a psychologist cold-reading your face (60% accuracy), not Omega.
  *   **A:** I still don't pay. Correlation isn't causation. (Go to Q4)
  *   **B:** I pay. If he's right often enough, I want to be the type he predicts will pay. (Go to Q6)

  **Q3: The Mechanism.**
  Why did you hesitate in Q1?
  *   **A:** Because Omega sounds like magic, and I don't trust magic. (Result: **M-1**)
  *   **B:** Because 70% feels like a gamble, not a logical link. (Go to Q2)

  **Q4: The Smoking Lesion.**
  A brain lesion causes both cancer and the desire to smoke. Smoking doesn't cause cancer. Do you smoke?
  *   **A:** Yes. Smoking doesn't cause cancer, so I enjoy the cigarette. (Result: **C-1**)
  *   **B:** No. Smoking is evidence I have the lesion, so I avoid it. (Result: **E-1**)

  **Q5: The Two Friends.**
  One coin toss. You and a friend (who thinks exactly like you) are asked separately to pay $100 if Tails. You can't talk.
  *   **A:** We are two people. I decide for me; she decides for her. (Go to Q7)
  *   **B:** We are one logical pattern. We must pick the same policy together. (Go to Q8)

  **Q6: The Threshold.**
  In Q2 (Human Reader), you paid. What if his accuracy was 51%?
  *   **A:** I still pay. Any correlation counts. (Result: **E-2**)
  *   **B:** I stop paying. There has to be a profit margin. (Result: **P-1**)

  **Q7: The Blackmail.**
  XOR Blackmail: A blackmailer sends a letter only if they predict you *won't* pay, but they only send it if the event happened. You get the letter.
  *   **A:** I don't pay. I'm being robbed. (Result: **C-2**)
  *   **B:** I pay. My policy determines whether the letter was sent. (Result: **F-1**)

  **Q8: The Precommitment.**
  Could you have bound yourself to pay before the coin toss?
  *   **A:** Yes, and I should have. I failed to bind. (Result: **F-2**)
  *   **B:** No, "what I would have done" isn't a real fact until I do it. (Result: **F-3**)

  ---
  *(Cut here or flip page)*
  ---

  # POSITION KEY

  **C-1: The Causal Purist**
  *   **View:** Only direct cause-and-effect matters. The past is fixed.
  *   **Awkward Swallow:** You leave $1,000,000 on the table in Newcomb's Problem because you two-box.
  *   **Notes:** Distinguishes sharply between Q1 (Omega) and Q2 (Human).

  **C-2: The Causal Realist**
  *   **View:** Same as C-1, but recognizes that in Blackmail, paying actively incentivizes the blackmail mechanism.
  *   **Awkward Swallow:** Must explain why Newcomb is different from Blackmail (both involve predictors).
  *   **Notes:** Often overlaps with C-1; tree separates them on Blackmail intuition.

  **E-1: The Evidentialist**
  *   **View:** Your choice is news. You choose the world with the best expected news.
  *   **Awkward Swallow:** You refuse to smoke in the Smoking Lesion case, effectively letting a brain lesion dictate your habits to avoid bad news.
  *   **Notes:** Pays in Q1/Q2 if correlation is high.

  **E-2: The Correlation Maximizer**
  *   **View:** Any statistical link between your act and the outcome is actionable.
  *   **Awkward Swallow:** Vulnerable to "Spurious Correlation" scams (e.g., paying because a stranger sneezed in a pattern that matches your wealth).
  *   **Notes:** Distinct from E-1 by willingness to act on weak signals.

  **P-1: The Threshold Pragmatist**
  *   **View:** You pay when the expected value is positive, treating prediction as a probability game.
  *   **Awkward Swallow:** You cannot explain why you pay at 70% accuracy but not 69%, other than "math." The principle shifts at the margin.
  *   **Notes:** Common among non-philosophers. Rarely holds up under "Cloning" cases.

  **M-1: The Mechanism Skeptic**
  *   **View:** You pay for Omega (physics/magic) but not for Humans (psychology).
  *   **Awkward Swallow:** You treat a perfect physical prediction differently than a perfect psychological prediction, despite the outcome being identical.
  *   **Notes:** **Empty Slot Warning:** Many people occupy this intuitively, but it is logically unstable. If the prediction is real, the mechanism shouldn't matter.

  **F-1: The Functionalist (UDT/FDT)**
  *   **View:** You choose a policy that governs all instances of your decision algorithm, including counterfactuals and twins.
  *   **Awkward Swallow:** You pay in the XOR Blackmail case, which feels like rewarding a kidnapper for a crime they haven't committed yet.
  *   **Notes:** Treats Q5 (Two Friends) as one decider.

  **F-2: The Precommitment Strategist**
  *   **View:** The rational move happens *before* the game. If you're in the game, you've already lost.
  *   **Awkward Swallow:** Offers no advice for the moment of decision other than "regret." Doesn't solve the problem, just moves it back in time.
  *   **Notes:** Often a retreat from F-1.

  **F-3: The Fact Denier**
  *   **View:** There is no fact about "what you would have done" in the other branch. The case is incoherent.
  *   **Awkward Swallow:** Makes it hard to plan for *any* future contingency where you might fail.
  *   **Notes:** **Empty Slot Warning:** Rarely held consistently. Usually a way to avoid paying in Q1.

  **COLLECTIVE: The Twin Agent**
  *   **View:** (From Q5-B) You and your friend are one agent. You maximize joint utility.
  *   **Awkward Swallow:** Blurs the boundary of "self." If your friend dies, do you lose half your agency?
  *   **Notes:** Required for cooperation in Twin Prisoner's Dilemma without external enforcement.

  ---

  # UNOCCUPIED SLOTS & GLITCHES

  **The "Magic" Gap (M-1):**
  Many people say they would pay Omega (Q1) but not the Psychologist (Q2). This slot is logically fragile. If the prediction happens, *how* it happens shouldn't change the math. If you occupy this, you are likely treating Omega as a causal force (she *makes* it heads) rather than a predictor.

  **The 50% Cliff:**
  If you pay at 70% (Q1) but not 51% (Q6), you are a **Threshold Pragmatist**. If you pay at 70% but not for the Human at 60%, you are a **Mechanism Skeptic**. If you pay for the Human at 60% but not 51%, you are both. There is no named position for "Pay for Omega at 51%, but Human only at 90%." This view is likely incoherent.

  **The Blackmail/Newcomb Split:**
  If you One-Box in Newcomb (take the money) but Refuse to Pay in Blackmail, you occupy a unstable slot. Both cases rely on the predictor anticipating your choice. Most positions that solve one solve the other. If you split them, check if you are treating Blackmail as a *threat* and Newcomb as a *gift*.

  **The "Two Friends" Glitch:**
  If you answered Q5-A (Two Deciders) but Q8-A (Precommitment possible), you have a tension. If you can precommit, you can precommit to coordinating with your friend. If you treat yourselves as separate, precommitment shouldn't bridge the gap between two separate brains.

  **No Position for "Pay Because It's Virtuous":**
  Some argue "I pay because I want to be the sort of person who pays." This maps to **F-1 (Functionalist)** but adds a moral layer. The tree treats this as a policy choice. If you think it's a *moral* duty rather than a *rational* one, you are outside the decision theory map entirely.

  **Indistinguishable Leaves:**
  **C-1** and **C-2** often merge. The tree separates them only if you feel Blackmail is fundamentally different from Prediction. Most Causalists treat them the same (Don't Pay).

  **The "Physical Process" View:**
  If you believe "My brain is already leaking the answer" (Q9 in spirit), you are likely **F-1**. If you think this means you have no choice, you are a **Determinist**, which dissolves the decision problem entirely. The tree assumes you feel you have a choice to make.
