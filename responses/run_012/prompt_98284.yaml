      *   *Premise (3):* This is the comparison step. It assumes a "total" view or a simple minimization function. It ignores the *value* of positive experiences, even if they aren't intrinsically *good* in a way that outweighs suffering. It also ignores the disvalue of *death* or *loss of potential*.
