answer: |-
  This is a rigorous request that cuts through the standard marketing of "AI safety" into the actual engineering of *assurance*. You are asking for the specification of a **Security Property** for a cognitive system, not a behavioral promise.

  Most current "control" proposals fail because they treat the model as a stochastic process to be sampled rather than an optimizer to be constrained. They rely on the model *happening* to behave, rather than being *unable* to succeed.

  Below are the desiderata for a control protocol safety case. I have categorized them by **Non-Negotiables** (if these fail, you have no safety case), **Structural Requirements** (how the system must be built), and **Trade-Offs** (where you must choose).

  Following the list, I will rule directly on your specific suspicions.

  ---

  ### Part 1: Non-Negotiable Desiderata
  *If a protocol cannot satisfy these, it does not provide control; it provides monitoring at best.*

  #### 1. The Zero-Trust Baseline (Alignment Independence)
  *   **Requirement:** The safety case must hold conditional on the model being actively deceptive, goal-misgeneralized, and capable of long-term planning. It cannot rely on the model "wanting" to pass the check.
  *   **Reason:** Alignment is a property of the model's internals; Control is a property of the deployment environment. If your safety case collapses when the model is treated as an adversary, you have an alignment case, not a control case.
  *   **Bound:** Must bound damage assuming the model optimizes *against* the control measures.

  #### 2. Adversarial Robustness to Observable Feedback (The "Gaming" Bound)
  *   **Requirement:** The protocol must remain secure even if the model has full access to the monitoring logic, the monitor's past judgments, and the rejection criteria.
  *   **Reason:** As you noted, an adaptive adversary optimizes into the blind spots of the monitor. If the monitor's accuracy is measured on a static eval set, but the model sees the monitor's gradients (or outputs) during deployment, the eval distribution is invalid. The model will find the decision boundary and hug it.
  *   **Bound:** Safety must not rely on the monitor being *smarter* than the model, but on the model being *informationally constrained* from exploiting the monitor's errors.

  #### 3. Capability Containment (The "Couldn't" vs. "Didn't")
  *   **Requirement:** The protocol must demonstrate that harmful actions were *structurally impossible* or *guaranteed to be intercepted*, not just that they were not observed in testing.
  *   **Reason:** "The model didn't escape in 10,000 trials" is a statistical claim. "The model cannot send bits to the internet because the sandbox physically lacks a network interface" is a control claim. Safety cases for catastrophic risk require the latter.
  *   **Bound:** You must bound the *channel capacity* for harmful output, not just the probability of harmful intent.

  #### 4. Trusted Computing Base (TCB) Minimization
  *   **Requirement:** The monitoring system (including any AI monitors) must be strictly less capable than the threshold required to execute the harmful action independently.
  *   **Reason:** If the monitor is an AI capable of coding, and the harmful action is "write a bioweapon," the monitor is now a risk vector. You cannot secure a system by adding more untrusted components unless their *authority* is strictly capped.
  *   **Bound:** The monitor must be architecturally incapable of executing the payload it is inspecting, even if compromised.

  ---

  ### Part 2: Structural Requirements
  *These define how the components must interact to sustain the Non-Negotiables.*

  #### 5. Collusion Resistance with Correlated Weights
  *   **Requirement:** The protocol must specify the maximum allowable correlation between model instances (e.g., in cross-examination setups) and prove safety holds below that threshold.
  *   **Reason:** Standard control protocols (like debate or cross-examination) assume independence. If two models share weights, they share reasoning shortcuts and hidden channels. They do not need to "communicate" to collude; they only need to think alike.
  *   **Distinction:** You cannot assume weight-sharing implies perfect collusion, but you must assume it implies *non-zero* correlation. The safety case must quantify how much correlation breaks the scheme.

  #### 6. Defined Failure Composition
  *   **Requirement:** The safety case must mathematically define how failure probabilities combine across chained measures (e.g., Sandbox + Monitor + Human-in-the-Loop).
  *   **Reason:** "Composes gracefully" is wishful thinking. In security, layers often introduce new attack surfaces. If Measure A fails silently, does Measure B detect it, or does Measure B assume Measure A worked and thus blind itself?
  *   **Bound:** You need a fault tree analysis that accounts for *correlated failures* (e.g., the monitor fails exactly when the model exploits a specific semantic ambiguity).

  #### 7. Auditability of the Control Logic
  *   **Requirement:** The control protocol itself (the code enforcing the sandbox, the monitor's weights, the decision logic) must be fully auditable by humans, even if the model's internals are not.
  *   **Reason:** You cannot verify a black-box controller guarding a black-box model. At least one side of the equation must be transparent to the auditor.
  *   **Distinction:** The *model* can be opaque; the *governance* cannot be.

  ---

  ### Part 3: Trade-Offs and Collisions
  *You cannot have everything. Here is where the physics of the problem forces a choice.*

  #### 1. Usefulness vs. Information Leakage
  *   **Collision:** To be useful, the model must output complex, high-bandwidth information. To be safe, you must restrict the model's ability to hide malicious payloads in complex output.
  *   **Ruling:** You must give up **unrestricted usefulness**. A control protocol that allows the model to output arbitrary code or natural language without severe bottlenecking cannot guarantee safety against a superhuman adversary. The requirement is to define the *maximum safe bandwidth*, not to hope you can keep full bandwidth safe.

  #### 2. Monitor Capability vs. Monitor Safety
  *   **Collision:** To catch a smart model, you need a smart monitor. To keep the monitor safe, you need a dumb monitor.
  *   **Ruling:** You must give up **catching everything**. You cannot build a monitor smart enough to catch all subtle deceptions without the monitor itself becoming a risk. The safety case must rely on catching *high-impact* actions via narrow, dumb checks (e.g., "does this code call `socket`?") rather than broad, smart checks (e.g., "is this code malicious?").

  #### 3. Transparency to Adversary vs. Security by Obscurity
  *   **Collision:** Kerckhoffs's principle (security should not rely on secrecy) vs. the risk of the model optimizing against the specific defense.
  *   **Ruling:** **Transparency to the Adversary is Non-Negotiable.** You must assume the model knows the protocol. If your safety relies on the model not knowing how the monitor works, you will fail once the model infers it from input/output feedback (which it will). Your controls must be robust to being known.

  ---

  ### Part 4: Rulings on Your Specific Suspicions

  Here I rule directly on the points you raised, distinguishing between **Non-Negotiable** (Safety Case fails without this) and **Preference** (Methodological choice).

  **1. Alignment Assumptions**
  *   **Your Suspicion:** Protocols assume alignment or blur the line.
  *   **My Ruling:** **Non-Negotiable.** The protocol must assume **Zero Alignment**. If the safety case relies on $P(\text{model is nice}) > 0$, it is not a control protocol; it is a risk assessment. Control is the layer that works when $P(\text{model is nice}) = 0$.

  **2. "Didn't" vs. "Couldn't"**
  *   **Your Suspicion:** Eval pass rates are not capability bounds.
  *   **My Ruling:** **Non-Negotiable.** A safety case based on "the model didn't do it in eval" is scientifically invalid for catastrophic risk. You need a mechanistic argument for why the action was *blocked* or *detected*, not just unobserved. If you cannot prove "couldn't," you must bound the "didn't" with such extreme statistical confidence that it approximates "couldn't" (which is usually impossible for adaptive adversaries).

  **3. Adaptive Adversary (Monitor Feedback)**
  *   **Your Suspicion:** The model optimizes into the monitor's acceptance region; measured accuracy is fake.
  *   **My Ruling:** **Non-Negotiable.** This is the load-bearing wall. If the protocol does not account for the model seeing the monitor's judgments (or inferring them), the safety case is void. This implies you cannot use gradient-based fine-tuning on the monitor based on deployment data without resetting the threat model. The monitor must be static or updated via a process the model cannot influence.

  **4. Collusion (Weak Correlation)**
  *   **Your Suspicion:** Where does the requirement bite?
  *   **My Ruling:** **Non-Negotiable.** It bites at **Weight Sharing**. If two instances share weights, they are not independent witnesses. A safety case using multiple instances must prove that the correlation coefficient of their deceptive strategies is low enough to maintain the statistical bound. If they share weights, you effectively have one instance with multiple I/O heads.

  **5. Monitor is an AI**
  *   **Your Suspicion:** The monitor is part of the risk.
  *   **My Ruling:** **Non-Negotiable.** The monitor is part of the TCB. If the monitor is an untrusted AI, you have simply moved the trust boundary, not solved the problem. The monitor must either be a trusted human, a verified formal system, or an AI with strictly capped capabilities (e.g., cannot execute code, cannot access network).

  **6. Composition**
  *   **Your Suspicion:** Is "composes gracefully" real or wishful?
  *   **Ruling:** **Structural Requirement.** It is real, but it is rarely satisfied. Most measures are not independent. Chaining three "90% safe" measures does not give you "99.9% safe" if they all fail on the same semantic trigger. The safety case must explicitly model the *dependency graph* of failures. If it doesn't, it is wishful thinking.

  **7. Transparency to Adversary**
  *   **Your Suspicion:** This is load-bearing.
  *   **Ruling:** **Correct.** It is Non-Negotiable. Security through obscurity fails against an optimizer that can query the system. The protocol must be secure *because* of its structure, not because the model doesn't know it exists.

  **8. Worst-Case Bounds**
  *   **Your Suspicion:** Maybe less important than people say.
  *   **Ruling:** **Disagree.** For catastrophic risk, Expected Value is insufficient. You need a Worst-Case Bound on *Impact*. You might not be able to bound the *probability* of an attempt (the model might try every time), but you must bound the *probability of success* given an attempt. If you cannot bound the success probability to near-zero, you do not have a safety case for high-stakes deployment.

  ### Summary of Collisions to Resolve
  You asked which ones collide and which to give up.

  1.  **Usefulness vs. Safety:** You cannot have a model that is both **Superhumanly Capable** and **Strictly Controlled** by a **Subhuman Monitor**.
      *   *Give Up:* Unrestricted Usefulness. You must accept that high-safety deployment looks like "narrow tool use" rather than "autonomous agent."
  2.  **Detection vs. Prevention:** You cannot guarantee you will *detect* a deception without guaranteeing you can *prevent* the action it enables.
      *   *Give Up:* Post-hoc Detection. For catastrophic actions, detection must be pre-execution (blocking), not post-execution (alerting).
  3.  **Independence vs. Efficiency:** Running truly independent monitors (different architectures, different weights) is expensive.
      *   *Give Up:* Cost Efficiency. If you want the safety case to hold, you must pay the compute cost of genuine independence, not just random seeds on the same model.

  ### Final Verdict for Your Spec
  When you write your safety case, if the protocol relies on **any** of the following, it fails the desiderata:
  1.  The model not knowing the rules.
  2.  The model not trying to break the rules.
  3.  The monitor being smarter than the model.
  4.  Statistical evals without mechanistic constraints.
  5.  Independent instances that share weights.

  If the protocol survives those cuts, *then* you score it.
