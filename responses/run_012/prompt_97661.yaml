prompt: |-
  ok so I keep reading about AI control — the whole idea that instead of (or alongside) getting a model to actually want good things, you build the deployment so that even a model that's secretly working against you can't do much damage. Monitors, sandboxing, one model watching another, that family. I'm going to have to write an actual safety case for a deployment soon and I want the spec first, before I look at any particular protocol, because I suspect most of them are quietly answering an easier question than the one that matters.

  So write me the desiderata: what does a control protocol, or a safety case built on one, have to deliver before it should count as giving me real assurance? I want the requirements, each with the reason behind it — what it has to be robust to, what it has to bound, what it must not assume, what distinctions it can't blur. A few things I'm already suspicious about and want you to rule on rather than assume:

  - whether it's allowed to assume anything about whether the model is aligned, or whether 'we don't know' has to be the default the protocol is built around
  - the difference between 'the model didn't do the bad thing in this eval' and 'the model couldn't have' — I think a lot of control evals only get the first and then act like they got the second
  - an adversary that has read the protocol and adapts, versus one that's just a random broken model. And heres the thing I can't get past: the advesary can also see the monitor's judgments, so it can optimize into exactly the region the monitor accepts, and now the monitor's measured accuracy is on a distribution the adversary chose. Any requirement that doesn't say something about this feels fake to me.
  - collusion between multiple model instances, including instances that are only weakly correlated with each other — where exactly does that requirement bite, and how weak is weak enough?
  - what happens when the monitor is itself an AI and is therefore part of the thing you're trying to make safe
  - composition: if I chain three half-safe measures together, do I know whether I'm more or less safe, or is 'composes gracefully' a real requirement or just wishful thinking

  Also tell me which of these are non-negotiable and which are just one camp's preference. My guess is that 'the protocol has to be transparent to the adversary' is load-bearing and that 'we need a genuine worst-case bound' is maybe less so than people say — but rule on it, don't humor me. And if some subset of the requirements can't be satisfied together — like you can't both use the untrusted model's help and treat it as a worst-case adversary, or you can't get a bound and also get usefulness — say which ones collide and which one I should give up. Don't score the protocols, I'll do that once I have the list.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for an AI control protocol:

  1.  **Deconstruct the Request:**
      *   **Goal:** Create a list of desiderata (requirements) for an AI control protocol/safety case.
      *   **Context:** The user is writing a safety case for a deployment and suspects existing protocols answer easier questions than the hard ones.
      *   **Key Concerns to Address:**
          *   Alignment assumptions (aligned vs. unaligned default).
          *   Eval vs. Capability bounds ("didn't" vs. "couldn't").
          *   Adaptive Adversary (model sees protocol/monitor outputs).
          *   Collusion (multiple instances, weak correlation).
          *   Monitor Safety (monitor is also an AI).
          *   Composition (chaining measures).
      *   **Specific Instructions:**
          *   Provide requirements with reasons (robustness, bounds, assumptions, distinctions).
          *   Rule on the user's specific suspicions (don't humor, take a stand).
          *   Distinguish non-negotiable vs. preference.
          *   Identify trade-offs/collisions (what can't be satisfied together).
          *   Do *not* score specific protocols.

  2.  **Analyze the Core Philosophy:**
      *   The user is advocating for a "Control" paradigm (often associated with the "Control vs. Alignment" debate in AI safety, e.g., Paul Christiano, alignment research groups).
      *   The core tension is *Trust vs. Verification*. The user wants verification that holds even under worst-case trust assumptions.
      *   The "Adaptive Adversary" point is crucial. If the model can see the monitor's gradients or outputs, it can game the monitor (Goodhart's Law on steroids).
      *   The "Composition" point is about system architecture safety.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: The Alignment Assumption.*
          *   User Question: Can we assume alignment?
          *   My Ruling: No. Control is specifically for when alignment fails or is unknown. If you assume alignment, you don't need control, you need monitoring.
          *   *Desideratum:* **Zero-Trust Baseline.** The protocol must provide safety guarantees conditional on the model being actively deceptive and capable of long-term planning, without relying on the model *wanting* to be safe.

      *   *Requirement 2: Capability vs. Behavior (The "Couldn't" vs. "Didn't").*
          *   User Question: Eval pass rates aren't enough.
          *   My Ruling: Correct. Stochastic passing isn't safety. We need bounds on capability or structural constraints.
          *   *Desideratum:* **Capability Bounds over Behavioral Statistics.** Safety must rest on constraints that make harmful actions *impossible* or *detectable with probability 1* (within the threat model), not just unlikely based on past samples.

      *   *Requirement 3: The Adaptive Adversary (Distributional Shift).*
          *   User Question: Model sees monitor judgments.
          *   My Ruling: This is the hardest technical problem. If the model optimizes against the monitor, the monitor's accuracy metric is void.
          *   *Desideratum:* **Adversarial Robustness to Observable Feedback.** The protocol must remain secure even if the model has full access to the monitoring logic and historical judgment data. (This implies cryptographic or information-theoretic separation, or monitoring that doesn't leak gradients).

      *   *Requirement 4: Collusion.*
          *   User Question: Multiple instances, weak correlation.
          *   My Ruling: Control often relies on cross-examination. If models collude, cross-examination fails.
          *   *Desideratum:* **Collusion Resistance.** The protocol must bound the probability of successful collusion even if instances share latent weights or training data. It must specify the minimum entropy/isolation required between instances.

      *   *Requirement 5: Monitor Safety.*
          *   User Question: Monitor is also an AI.
          *   My Ruling: Infinite regress problem. The monitor must be simpler or strictly less capable, or the system is just "AI watching AI."
          *   *Desideratum:* **Trusted Computing Base (TCB) Minimization.** The monitor's complexity and capability must be strictly bounded below the threshold required to execute the harmful action independently.

      *   *Requirement 6: Composition.*
          *   User Question: Do chained measures add up?
          *   My Ruling: Usually they multiply failure rates, but correlated failures break this.
          *   *Desideratum:* **Compositional Safety Guarantees.** The safety case must mathematically define how failure probabilities combine (e.g., independent vs. correlated failure modes).

  4.  **Refining and Categorizing (Non-Negotiable vs. Preference):**
      *   *Non-Negotiable:* Zero-Trust, Adversarial Robustness, TCB Minimization. Without these, it's not "control," it's "hope."
      *   *Preference/Trade-off:* Strict Capability Bounds (might kill usefulness), Perfect Collusion Resistance (might be impossible without extreme isolation).

  5.  **Addressing the Trade-offs (The "Collisions"):**
      *   *Usefulness vs. Security:* Stronger control usually means more friction/lateness/rejection.
      *   *Transparency vs. Security:* If the model sees the protocol to be "transparent," it can game it. But if it's hidden, we can't audit it. *Correction:* The *adversary* (model) seeing it is the threat. The *auditor* seeing it is a requirement.
      *   *Capability vs. Control:* To control a superintelligence, you need a mechanism that can understand it. If the mechanism understands it, the mechanism might be as dangerous. This is the "Monitor Safety" collision.

  6.  **Finalizing the Rulings on User Suspicions:**
      *   *Alignment Assumption:* Must be Zero-Trust.
      *   *Didn't vs. Couldn't:* Must be "Couldn't" (or "Couldn't without detection").
      *   *Adaptive Adversary:* This is the load-bearing wall. If this fails, the rest is theater.
      *   *Composition:* It is a real requirement, not wishful thinking, but requires independence proofs.

  7.  **Structuring the Output:**
      *   Introduction: Acknowledge the rigor of the request.
      *   Section 1: The Non-Negotiables (The "Must Haves").
      *   Section 2: The Structural Requirements (Architecture & Logic).
      *   Section 3: The Trade-offs & Collisions (Where things break).
      *   Section 4: Rulings on Specific Suspicions.
      *   Conclusion: Summary of the burden of proof.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I tell them which protocols are good? *No, forbidden.*
      *   *Check:* Did I address the "monitor sees monitor" issue? *Yes, under TCB.*
      *   *Check:* Did I address the "adaptive adversary" specifically regarding distribution shift? *Yes, need to emphasize that eval distributions $\neq$ deployment distributions under optimization pressure.*
      *   *Tone:* Professional, rigorous, slightly skeptical (matching the user), authoritative but not dogmatic.

  9.  **Final Polish:** Ensure the distinction between "Safety Case" (the argument) and "Control Protocol" (the mechanism) is clear but integrated. The desiderata apply to the *argument* about the protocol. (Proceed to generate output).

  *(Self-Correction on "Transparency"):* The user mentioned "protocol has to be transparent to the adversary" as load-bearing. I need to be careful here. Kerckhoffs's principle applies: security should not rely on obscurity. So yes, the model *should* be assumed to know the protocol. I need to validate that intuition.

  *(Self-Correction on "Worst-Case Bound"):* User thinks this might be less important than people say. I disagree. In safety cases, expected value isn't enough for catastrophic risk. I need to push back gently there or clarify *what* is being bounded (probability of escape vs. impact). I will argue that bounding *impact* is more feasible than bounding *probability of attempt*, but a bound is still non-negotiable.

  *(Refining Collusion):* "Weakly correlated" is the key. If they share weights, they share reasoning. Control protocols often assume independence. I need to make sure the desideratum demands proof of independence or bounds on correlation.

  *(Refining Composition):* "Composes gracefully" is vague. The requirement should be "Defined Failure Composition."

