  Consider a drone controller implemented as a deterministic recurrent neural network trained to intercept moving targets by predicting their trajectories based on visual occlusion cues. To predict the drone's behavior when a target disappears behind a screen, an operator must attribute the belief 'the target persists behind the screen' alongside the goal 'intercept,' because a belief-free input-output mapping requires enumerating every possible occlusion duration to match the prediction that the drone will wait for exactly the time required for the target to traverse the hidden distance, whereas the belief attribution captures this temporal generalization immediately. Yet the internal hidden state driving the wait decision is invariant to the target's actual existence, responding identically to the visual occlusion pattern regardless of whether the target is physically present behind the screen or has vanished entirely, failing a sensitivity test where the attributed content requires responsiveness to physical persistence that the internal state does not distinguish. I define 'Predictive Compression' as the reduction of state-space complexity achieved by treating internal vectors as semantic propositional attitudes rather than numerical activations.

  **Analysis**

  **Attributed Belief:** The system believes *that the target continues to exist and move behind the occluding object*. This content is fine-grained regarding spatial trajectory and temporal duration but coarse regarding ontological status, as it does not distinguish between a physical object and a persistent digital phantom.

  **Instrumentalist Verdict:** The attribution is legitimate. Because the belief-based model yields predictions about wait-times that no belief-free model matches as cheaply (satisfying the indispensability criterion via Predictive Compression), the instrumentalist grants the status of belief regardless of internal machinery.

  **Representationalist Verdict:** The attribution is illegitimate. Since the internal hidden state is invariant to the target's actual existence and tracks only visual occlusion, no state has the content *that the target persists*; thus, the necessary condition for belief (internal representation of content) is not met.

  **Parting Company:** They part company on whether predictive utility suffices for legitimacy. The instrumentalist prioritizes the efficiency of the explanatory model, while the representationalist prioritizes the structural isomorphism between internal state and external fact.

  **Design-Stance Description:** The system is an LSTM network minimizing a loss function defined by interception error, updating hidden vectors based on pixel-difference inputs over time. This description leaves out the semantic interpretation of the hidden vectors as representing *objects* rather than *pixel patterns*.

  **Single Feature:** The feature doing the work is *Occlusion-Based Generalization*. It allows the system to act on unseen entities based on visual cues alone.

  **Survival of Removal:** If this feature is removed (reducing the system to a reactive controller), what survives is a simple stimulus-response reflex that halts only while visual contact is maintained, eliminating the wait-time behavior entirely.

  **Strongest Representationalist Reply:** The representationalist may argue the content is actually *that visual occlusion is occurring*, not *that the target persists*. This saves the structural requirement but costs them their general position's ability to distinguish between accurate representation and systematic error (misrepresentation), as the system's "error" (waiting for a vanished target) becomes veridical behavior under the revised content.

  **Consideration to Move Me:** If evidence showed the internal state explicitly encoded a binary flag for *target existence* distinct from *occlusion*, I would move to the representationalist verdict, as the content would then be recoverable from the machinery.

  **Likely Failure Point:** My reasoning is most likely to fail if the "cheapness" of the belief model is merely subjective engineering convenience rather than an objective computational constraint, undermining the claim of indispensability.
