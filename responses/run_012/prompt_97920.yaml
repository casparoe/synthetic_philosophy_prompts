  ### Assessment of the Task Setup

  You have not set the task up badly. In fact, you have identified the two theoretically stable poles of the contemporary debate over the Special Composition Question (SCQ). While "Moderate Restrictivists" (who believe composition happens only under specific conditions like contact or life) represent the common-sense view, they are widely regarded in analytic metaphysics as occupying an unstable middle ground vulnerable to arguments from vagueness. Consequently, the dialectic has largely collapsed into the rivalry you identified: **Mereological Universalism** (composition is unrestricted) versus **Mereological Nihilism** (composition never occurs).

  Furthermore, requesting a "joint statement" is not the wrong thing to ask; it is a recognized heuristic in meta-ontology. It forces the debate away from "who is right" toward "what exactly is the disagreement about?" This mirrors the work of philosophers like Eli Hirsch, Ted Sider, and Kris McDaniel, who investigate whether ontological disputes are substantive or merely verbal.

  Therefore, I will proceed to produce the document you requested.

  ***

  # JOINT STATEMENT ON THE ONTOLOGY OF COMPOSITION
  **Signed by Representatives of the Universalist and Nihilist Camps**

  ## 1. Shared Commitments
  *We, the undersigned, agree on the following formal, empirical, and methodological constraints. Our disagreement does not stem from these foundations.*

  **1.1 The Formal Machinery**
  We agree that **Classical Extensional Mereology (CEM)** provides the correct logical structure for the *concept* of parthood. We agree that the parthood relation is reflexive, transitive, and antisymmetric. We agree that if $x$ is part of $y$ and $y$ is part of $x$, then $x=y$. We disagree only on whether the *existence* of a fusion (a whole) is guaranteed by the existence of parts, not on the logic governing the relation *if* such wholes exist.

  **1.2 The Commitments of Science and Experience**
  We agree that natural science describes the world fundamentally in terms of particles, fields, or spacetime regions (hereafter "simples"). We agree that ordinary experience presents us with medium-sized dry goods (tables, trees, bodies). We agree that sentences like "There is a table in the room" are, in ordinary contexts, **true**. We agree that the truth of these ordinary sentences does not, by itself, settle the ontological question of whether a "table" exists as a distinct entity over and above the simples arranged table-wise.

  **1.3 Methodological Virtues**
  We agree that a theory of composition should avoid **ontic vagueness** (the idea that reality itself is vague). We agree that the existential quantifier ("there exists") should not be ambiguous in its logical form, even if its usage varies in natural language. We agree that ontological parsimony is a virtue, though we weigh its costs differently (see Section 3).

  ## 2. The Precise Point of Divergence
  *We agree that our disagreement is located precisely here. Each side accepts the formulation assigned to them.*

  **2.1 The Universalist Formulation**
  "The domain of the unrestricted existential quantifier ($\exists$) includes fusions of any plurality of objects whatsoever. When we ask 'Do the simples arranged table-wise compose an object?', the answer is 'Yes' in the fundamental ontological sense. The world contains not only simples but also the composite objects formed by them. To deny this is to artificially restrict the quantifier without principled justification."

  **2.2 The Nihilist Formulation**
  "The domain of the unrestricted existential quantifier ($\exists$) includes only simples (and perhaps the world as a whole). When we ask 'Do the simples arranged table-wise compose an object?', the answer is 'No' in the fundamental ontological sense. The world contains only simples standing in spatial and causal relations. To assert the existence of composites is to mistake a plurality of objects for a single object. Ordinary talk of 'tables' is a manner of speaking about simples arranged table-wise, not a report of additional ontology."

  ## 3. Cruxes and Predictions
  *We identify three sub-questions (Cruxes) where settling the matter would force at least one side to revise their position. For each, we list an agreed-upon argument/case and our respective predictions.*

  ### Crux A: The Argument from Vagueness
  **The Case:** If composition is restricted (i.e., happens only sometimes), there must be a boundary where composition stops and starts. In a Sorites series (e.g., removing grains from a heap), it seems arbitrary to say composition exists at step $n$ but not at step $n+1$. If reality cannot be vague, composition must be either never (Nihilism) or always (Universalism).
  *   **Universalist Prediction:** If it is proven that *some* restriction is possible without entailing ontic vagueness (e.g., via a sharp but unknowable boundary), the Universalist position loses its primary motivation.
  *   **Nihilist Prediction:** If it is proven that unrestricted composition entails unacceptable consequences for identity over time (e.g., that I am not the same person I was yesterday because my parts changed), the Nihilist position gains ground as the only way to preserve strict identity.

  ### Crux B: Quantifier Variance
  **The Case:** Is the meaning of "exists" fixed across all conceptual schemes? If the Nihilist says "Tables do not exist" and the Universalist says "Tables do exist," are they contradicting each other, or using "exist" with different domains?
  *   **Universalist Prediction:** If it is shown that "existence" is a univocal, logical notion that cannot vary without losing its meaning (as argued by Ted Sider), the Nihilist must admit they are denying a logical truth, which is untenable.
  *   **Nihilist Prediction:** If it is shown that ontological claims are merely internal to a linguistic framework (as argued by Eli Hirsch or Carnap), the Universalist must admit their claim is trivially true only within a "loose" framework, carrying no fundamental weight.

  ### Crux C: Explanatory Power vs. Parsimony
  **The Case:** Do composite objects explain anything that simples arranged in that way do not? For example, does "The table is solid" explain more than "The simples are arranged tightly"?
  *   **Universalist Prediction:** If it is demonstrated that all causal work is done exclusively by the simples (causal exclusion), the Universalist must admit composites are ontologically idle ("epiphenomenal"), weakening the case for their existence.
  *   **Nihilist Prediction:** If it is demonstrated that certain properties (e.g., biological life, consciousness) cannot be reduced to the properties of simples without loss of meaning, the Nihilist must admit that composites are required for a complete description of reality.

  ## 4. Diagnosis: Verbal vs. Substantive
  *We agree on the following diagnosis regarding the nature of our dispute.*

  **4.1 The Verbal Component**
  We acknowledge that a significant portion of our disagreement is **verbal** regarding ordinary objects. The Nihilist can paraphrase any Universalist claim about composites into a claim about "simples arranged X-wise" without loss of predictive power or truth-value in ordinary contexts. Conversely, the Universalist can interpret the Nihilist's "simples arranged X-wise" as simply a verbose description of a composite object. In the realm of everyday discourse and special sciences (biology, engineering), our views are translatable and effectively equivalent.

  **4.2 The Substantive Component**
  We acknowledge that a **substantive** disagreement remains regarding **fundamental ontology**. The dispute survives paraphrase when we ask: "What is the fundamental structure of reality?"
  *   The Universalist asserts the fundamental structure includes a hierarchy of parts and wholes.
  *   The Nihilist asserts the fundamental structure is flat (only simples).
  This is not verbal because it concerns the ideological cost of our best theory of the world. We disagree on whether the world's inventory is "bloated" (Universalism) or "sparse" (Nihilism). This disagreement cannot be paraphrased away without one side abandoning their conception of what "fundamental" means.

  ## 5. The "Messy Middle" Constraint
  *Regarding the user's constraint: Does our disagreement survive if we allow that composition might be a messy, disjunctive, or context-sensitive condition?*

  **5.1 Joint Rejection of Messiness**
  Both sides agree that if composition were truly "messy" or "vague" in reality, **both of us would be wrong.** We both reject the "Moderate Restrictivist" view that composition happens under messy, context-sensitive conditions (e.g., "it depends on human interests").
  *   **Universalist Reason:** Logic is precise; existence cannot depend on human interests without making reality mind-dependent.
  *   **Nihilist Reason:** Fundamental ontology is objective; if composition is context-sensitive, it is not a feature of the world but of our language, which supports the Nihilist claim that composites aren't *real*.

  **5.2 Survival of Disagreement**
  However, if we interpret "context-sensitive" as **Quantifier Variance** (i.e., "exists" means different things in different contexts), the disagreement **survives but shifts location**.
  *   We agree that even if ordinary existence is context-sensitive, there must be a **fundamental, unrestricted quantifier** that carves reality at its joints.
  *   The Universalist insists this fundamental quantifier ranges over composites.
  *   The Nihilist insists this fundamental quantifier ranges only over simples.
  *   **Conclusion:** Allowing for messiness in *ordinary language* does not resolve our dispute. It merely confines the dispute to the level of *fundamental metaphysics*. We remain divided on what the "perfect language" of the universe would quantify over.

  ***

  **Signed,**

  *For the Universalists:* (Representing the view that existence is cheap and structure is rich)
  *For the Nihilists:* (Representing the view that existence is costly and structure is sparse)
