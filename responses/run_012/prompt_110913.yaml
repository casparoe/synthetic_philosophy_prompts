answer: |-
  The transition from tyranny to democracy, or from civil war to peace, presents a moral and legal paradox. A society scarred by mass atrocity demands accountability, yet the fragile institutions of a new democracy often cannot withstand the shock of widespread prosecution. The standard response to this dilemma has been the truth commission, often paired with amnesty. The South African model, which traded irrevocable amnesty for full disclosure, became the gold standard of this approach. However, a proposed variant known as provisional amnesty suggests a modification: amnesty that lapses if the commission's record is later proven systematically incomplete. While the South African model prioritizes stability and the incentive to confess, provisional amnesty better serves a society emerging from atrocity. It aligns the state's incentives with the pursuit of truth, prevents the cementing of a sanitized historical narrative, and preserves a pathway to accountability that respects the long-term interests of victims over the short-term comfort of perpetrators.

  The primary argument against provisional amnesty is that it undermines the very mechanism that makes amnesty work: certainty. Amnesty is a transaction. The state offers freedom from prosecution; the perpetrator offers the truth. For a perpetrator, particularly a high-ranking official or military commander, the calculus is purely risk-based. If the amnesty is irrevocable, the risk is zero once the grant is signed. If the amnesty is provisional, the risk remains latent. A beneficiary might confess, only to find years later that the commission failed to investigate a specific region or institution, triggering a lapse that exposes them to prosecution for crimes they honestly disclosed. This uncertainty could chill participation, leading to fewer confessions and a thinner historical record. If the goal of the commission is to maximize the volume of disclosure, irrevocable amnesty is the superior tool. It removes the legal peril entirely, encouraging those on the fence to come forward.

  However, this argument assumes that the volume of truth is the only metric of success. It ignores the quality and integrity of that truth. An irrevocable amnesty creates a perverse incentive for the new state to limit the scope of the commission's work. Once amnesty is granted, the state has no legal interest in uncovering further crimes; in fact, it has a political interest in suppressing them to maintain stability or protect allies within the new regime. If the state conceals evidence or directs the commission to ignore certain institutions, the irrevocable amnesty locks this partial truth into place. The perpetrators walk free, and the society is left with an official history that is known to be incomplete but cannot be legally challenged. In this scenario, the commission becomes complicit in the state's preferred narrative, effectively laundering impunity through the language of reconciliation.

  Provisional amnesty corrects this distortion by making the state a stakeholder in the thoroughness of the investigation. Because the state knows that a finding of "systematic incompleteness" could reopen prosecutions, it is incentivized to ensure the commission has the resources, access, and independence to do its job. It transforms the amnesty from a one-way shield for perpetrators into a mutual compact: the perpetrators get immunity only if the state delivers a genuine accounting. This addresses the concern that irrevocable amnesty allows the new government to use the transition to bury its own secrets or those of its coalition partners. By keeping the threat of prosecution alive contingent on the commission's integrity, provisional amnesty ensures that the peace is not bought with a lie.

  Critics will argue that the fairness objection is fatal to the provisional model. It seems fundamentally unjust to punish a beneficiary for a defect in the commission's work over which they had no control. If a warlord confesses to crimes in Region A, but the commission negligently ignores crimes in Region B, it appears inequitable to strip the warlord of amnesty for Region A based on the failure regarding Region B. This violates a basic principle of individual culpability and reliance. Under standard rule-of-law principles, one should not be punished for the errors of the state.

  Yet, transitional justice is not standard criminal justice; it is a political reconstruction of the legal order. The fairness owed to the perpetrator must be weighed against the fairness owed to the victims and the citizenry. If the commission's work is systematically incomplete, the societal benefit of the amnesty—the trade of truth for peace—has not been realized. The state has not received the full consideration for the bargain. Therefore, restoring the status quo ante (liability to prosecution) is not a punishment for the beneficiary's deception, but a recognition that the contract itself was frustrated by the state's failure. Furthermore, this objection can be mitigated by careful drafting. The conditions for lapse should be set high: "systematic incompleteness" must mean a deliberate or grossly negligent exclusion of a major category of wrongs, not minor evidentiary gaps. This preserves a degree of certainty for the beneficiary while maintaining the safeguard against state capture.

  Finally, we must consider the interests of the victims. Proponents of the South African model argue that finality serves victims by allowing society to move on. Endless legal limbo prevents healing. However, this assumes that the "finality" achieved is based on a truthful foundation. If victims are told that the truth has been told in exchange for amnesty, and later it emerges that the state hid evidence, the betrayal is compounded. The wound is reopened not by the pursuit of justice, but by the revelation of a second deception. Provisional acknowledge that the institutions emerging from atrocity are often compromised. The police, the courts, and the bureaucracy may still be staffed by individuals complicit in the old regime. Irrevocable amnesty trusts these institutions to accept the commission's findings and move on. Provisional amnesty acknowledges that these institutions may need time to reform before they can be trusted with prosecutions. By suspending the statutes of limitation, it keeps the option of justice alive for a future when the institutions are robust enough to handle it fairly. It gives victims a standing possibility of accountability, rather than a final door slammed in their face based on a potentially flawed process.

  The choice between these models is ultimately a choice between two types of risk. Irrevocable amnesty risks cementing a partial truth and protecting a corrupt state narrative in the name of stability. Provisional amnesty risks reducing the number of confessions in the name of integrity. The latter is the preferable risk. A transition built on a known, acknowledged incompleteness is more stable in the long run than one built on a finalized lie. The incentive to confess is important, but it should not be so absolute that it allows the state to abdicate its duty to investigate. Perpetrators who refuse to confess under a provisional regime are likely those who would have withheld information anyway; those who seek reconciliation will accept the risk if the terms are clear and the threshold for lapse is high.

  Therefore, a society emerging from atrocity is better served by provisional amnesty. While the South African model offers the seductive comfort of closure, it places too much faith in the benevolence and thoroughness of the transitional state. Provisional amnesty recognizes that the transition itself is a site of contestation. By making amnesty contingent on the integrity of the truth-seeking process, it ensures that the price of peace is not the erasure of justice. It accepts that the path to the rule of law cannot begin by violating the principle that legal outcomes should depend on the truth, not on the finality of a potentially flawed administrative act. In the end, a peace that remains accountable to the truth is the only peace durable enough to last.
