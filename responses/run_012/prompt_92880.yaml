      *   **Constraint:** Distinguish implications following from the *analogy itself* vs. those depending on *further assumptions* (commensurability of values). Address what holds even without a shared moral currency.
      *   **Tone:** Academic, rigorous, accessible to a high school philosophy student (not too dense, but philosophically precise).

  2.  **Deconstruct the Core Analogy:**
