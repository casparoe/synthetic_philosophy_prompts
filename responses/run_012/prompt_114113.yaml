answer: |-
  "Beside the intention" (*praeter intentionem*) is not merely a psychological claim about your feelings ("I didn't mean it"). It is a claim about the **moral object** of the act. For Aquinas, an act's species (what kind of act it is) is determined by what the will chooses as an end or a means. In self-defense, the will chooses "preserving life." The aggressor's death is foreseen but not chosen as a means or an end. It is a side effect of the chosen act (repelling force).

  This distinguishes the structure of the act, not just the agent's mindset. If you kill *to* stop the attack (making death the means), you intend the killing. Aquinas says private persons cannot do this; only public authority can intend killing for the common good. Therefore, for a private individual, the death must remain strictly outside the intention. The physical act is lawful only if the internal orientation is strictly toward defense, with death accepted only as an unavoidable byproduct of moderate force.

  Regarding Trolley cases: Aquinas is stricter than modern Double Effect formulations. In the standard Bridge case, you intend the man's death as a means to stop the train. Aquinas would forbid this for a private individual. In the Switch case, if the death is truly beside the intention (mere side effect), it might pass, but Aquinas's prohibition on intending death for private persons is a high bar. The distinction survives only if "intention" tracks the structural role of the death (means vs. side effect), not just your feelings.

  On impartiality: You are right to spot a tension. Trolley literature often assumes utilitarian impartiality (one life = one life). Aquinas explicitly rejects this: "one is bound to take more care of one's own life than of another's." This is not a bug but a feature of his natural law ethics. You have a special duty to your own preservation. So, while Double Effect is used in both contexts, the underlying axioms differ. Aquinas permits self-preference; Trolley problems often test impartial aggregation.

  So, "beside the intention" keeps the act's species as "defense" rather than "killing." It requires that death not be the tool you use, nor the goal you seek, even if you know it will happen.
