prompt: |-
  I'm in this applied ethics seminar and we just spent two weeks on consent — the usual stuff: deception and coercion in medicine and sex, whether coercion is really about threats vs. offers, whether consent is a mental state or a performative act. My roommate and I have been arguing about it at dinner all week (he's a law student, so everything turns into contracts with him), and I think I've got an angle for the final paper, but I want to run the notes past you before I commit, because I keep flip-flopping on whether it's real or just a distinction in search of a paper.

  The idea: nearly everyone treats consent as doing one job, which is changing permissions — you consent, and something that was off-limits for the other person becomes permitted. I want to argue that consent does two jobs that can come apart. First it changes permissions (the standard story). Second it changes reasons: it gives the other person a reason to act that is *yours*, one that runs through your will rather than through their own interests or some general duty. Call these the permission function and the authorship function. I think seperating them gives a cleaner diagnosis of the three classic defeaters. Deception wrecks permission: you can't waive a right you didn't know you were waiving, so the act that got licensed isn't the act you actually performed — but authorship survives, because you really did put your will behind something. Coercion is the mirror image: permission may well survive (saying yes under a threat isn't saying nothing), but authorship is gone, because the reason the other person is acting on isn't properly yours — it's theirs wearing your clothes. And competence isn't a third defeater at all, it's the precondition for either function running at all, which is why incompetent consent feels void in a different way than coerced consent does. The payoff I'm most excited about: this predicts that we should treat coerced-but-informed consent as still doing something normatively — the person has a complaint, but the other party isn't simply an offender the way a deceiver is — and I think that lines up with intuitions about bad plea deals or exploitative but fully disclosed contracts. I have a whole section sketched on why the voluntariness/information distinction can't get you this, but honestly I'm not sure that section isn't just relabeling, and I've been thinking about it alot.

  So: comments, please, and be specific. I don't want a reading list or "have you considered the literature on X" — I'll find sources myself. Tell me where the argument actually breaks, whether the permission/authorship split earns its keep or is just voluntariness vs. information with new names, and whether the coercion case comes out the way I need it to. And say whether this is a paper or just a clever distinction, because I'd rather drop it now than in April. At the end, tell me how confident you are in the whole thing and which single point you're least sure about — I want to know where you're guessing.
