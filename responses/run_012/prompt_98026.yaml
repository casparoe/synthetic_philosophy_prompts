answer: |-
  The tangle you describe is not a logical error; it is a **stratified moral economy**. The system does not rely on a single theory of work. Instead, it operates on three distinct, contradictory theories simultaneously, assigned to workers based on their class, status, and leverage.

  To make the current practice coherent, we must reconstruct the implicit theory that justifies this segmentation. Let's call this **The Theory of Labor as Status**.

  ### 1. Reconstructing the Theory the Practice Needs

  For the current system to function without collapsing under its own contradictions, it must presuppose the following three axioms:

  **Axiom 1: For the Subordinate, Time is a Commodity (The Disutility Theory)**
  *   **Target:** Hourly/Non-exempt workers.
  *   **Presupposition:** Work is inherently a burden (disutility). The worker possesses no stake in the outcome, only in the time sold.
  *   **Logic:** Because the work is alienated, extra time requires extra compensation (time-and-a-half). This is a protective mechanism. It treats the worker's body and time as property they own and rent out.
  *   **Function:** Prevents the employer from consuming the worker's entire life without premium pay.

  **Axiom 2: For the Steward, Time is a Commitment (The Vocational Theory)**
  *   **Target:** Salaried/Exempt workers (Managers, Professionals).
  *   **Presupposition:** Work is an expression of identity and status. The worker is a "steward" of the firm's goals.
  *   **Logic:** Because the worker is ostensibly buying into the mission (and is paid for *output*, not *input*), time tracking is petty. Overwork is not a burden to be compensated, but a signal of loyalty and ambition.
  *   **Function:** Extracts more labor for less marginal cost while binding the worker psychologically to the firm. It transforms exploitation into "commitment."

  **Axiom 3: For the Outcast, Labor is a Moral Debt (The Duty Theory)**
  *   **Target:** The Unemployed.
  *   **Presupposition:** Existence without contribution is a drain on the collective.
  *   **Logic:** Benefits are not a right of citizenship but a bridge to duty. You must prove you are willing to sell your time (even at a loss of status or utility) to deserve support.
  *   **Function:** Maintains labor discipline. It ensures that even "bad" jobs are taken, keeping the wage floor suppressed and validating the moral worth of employment itself.

  **The Synthesis:**
  The system presupposes that **work is a disutility for those with no power, a vocation for those with some power, and a duty for those with no job.** The incoherence you sense is the friction between these three modes.

  ### 2. The Hourly/Exempt Line: Principle or Accident?

  You asked if the hourly/exempt distinction presupposes that some work is different in kind, or if it is a historical accident.

  **It is a historical accident dressed up as a principle.**

  *   **Historical Origin:** The Fair Labor Standards Act (1938) created the exempt category primarily for executives and high-level administrators. The theory was that these individuals had enough **bargaining power** to negotiate their own hours and did not need the state's protection.
  *   **The Drift:** Over decades, the definition of "exempt" expanded. It is no longer about bargaining power; it is about **cost accounting**. Employers realized that if they could classify a worker as "exempt," they could extract 50 hours of work for 40 hours of pay.
  *   **The False Principle:** The system claims the distinction is based on the *nature of the work* (decision-making vs. task execution). In reality, it is based on the *predictability of the labor*. If your work can be strictly bounded, you are hourly. If your work bleeds into your life (answering emails at night, thinking about strategy on weekends), you are exempt.
  *   **Verdict:** The line does not reflect a genuine difference in the *kind* of human effort (a manager's hour is as biologically taxing as a cashier's). It reflects a difference in **control**. Hourly workers sell time; exempt workers sell availability.

  ### 3. Structural Analysis: Required vs. Compatible vs. Underdetermined

  If we accept **The Theory of Labor as Status** as the operating system, we can categorize the elements you observed:

  **Strictly Required (The Load-Bearing Walls)**
  1.  **The Moral Obligation to Work:** Unemployment benefits *must* be conditional. If survival were guaranteed without labor, the "Duty Theory" collapses, and the leverage to force people into low-wage hourly work vanishes.
  2.  **The Status Signal:** Exempt status *must* carry social prestige. If working 60 hours for free were seen purely as exploitation rather than "commitment," high-status workers would demand hourly protections. The "honor" of overwork is a necessary subsidy to the salary model.
  3.  **The Disutility Acknowledgement:** Overtime pay *must* exist for the bottom tier. Without it, the physical limits of the working class would be hit too hard, leading to immediate burnout or revolt. The system needs a pressure valve for the lowest tier.

  **Merely Compatible (The Decor)**
  1.  **Karoshi Compensation:** This is compatible but not required. The system can function without admitting death by overwork. However, compensating it acts as a safety valve: it admits the harm (validating the Disutility Theory) while keeping the cultural expectation of devotion (validating the Vocational Theory). It allows the system to say, "We didn't mean for you to die, but we still expect you to try."
  2.  **Professional Identity:** The idea that lawyers or doctors *love* their work so much they don't mind overtime is compatible. It helps the Vocational Theory, but the system works fine even if they hate it, as long as they are paid enough to stay silent.

  **Underdetermined (The Glitch Zones)**
  1.  **The Threshold:** Where exactly does hourly become exempt? Is it $35,000 a year? $100,000? The theory doesn't say. It is purely political. This is why we see "managers" making minimum wage who are still exempt.
  2.  **The Definition of Leisure:** The system assumes leisure is the *absence* of work. It does not account for "on-call" leisure (checking Slack on vacation). The theory is underdetermined on when work actually ends.
  3.  **The Gig Economy:** Uber drivers are the ultimate contradiction. They are treated as independent contractors (Exempt/Vocational: set your own hours!) but algorithmically managed like Hourly workers (Disutility: optimize every second). They fall through the cracks of the Theory of Labor as Status.

  ### 4. What Changes if We Take a "Right to Leisure" Seriously?

  Currently, we have a **Right to Work** (in the sense of non-discrimination) and a **Duty to Work** (for benefits). A **Right to Leisure** would invert the moral architecture.

  If leisure were a fundamental right (e.g., legally enforced maximum hours for *all* workers, unconditional basic income):

  1.  **The Hourly/Exempt Line Dissolves:** If there is a hard cap on work hours (say, 35/week) for *everyone*, the "commitment" of the exempt worker becomes illegal. You cannot signal loyalty by sacrificing leisure if leisure is protected. The distinction between selling time and selling outcomes vanishes; everyone sells outcomes within a protected time window.
  2.  **Unemployment Benefits Decouple:** If leisure is a right, you do not need to prove you are seeking work to deserve existence. The "Duty Theory" collapses. Work becomes purely voluntary or incentivized, not coerced by starvation.
  3.  **Karoshi Becomes Malpractice:** In Japan, overwork is currently a tragedy that is sometimes compensated. Under a Right to Leisure, overwork is a violation of rights, akin to assault. The "honor" narrative is stripped away; working 60 hours is not devotion, it is a breach of contract by the employer.
  4.  **Wage Compression:** Currently, exempt workers subsidize their employers with unpaid overtime. If that time were reclaimed or paid, the cost of "high status" labor rises. This might narrow the gap between managerial and hourly pay, or it might reduce the number of managerial positions.

  ### Conclusion: Is the Practice Incoherent?

  **Logically, yes. Functionally, no.**

  As a moral philosophy, the current tangle is incoherent. It claims work is a burden (pay overtime), a virtue (work more for free), and a debt (work or starve) all at once.

  However, as a **system of social control**, it is highly coherent.
  *   It keeps the bottom tier physically protected just enough to keep working (Overtime).
  *   It keeps the middle tier psychologically bound to the firm (Exempt/Commitment).
  *   It keeps the unemployed desperate enough to accept the terms of the bottom tier (Benefits Conditionality).

  The "tangle" is not a bug; it is the mechanism by which the system extracts maximum labor from different classes using different levers. To untangle it requires not just changing labor law, but dismantling the **Theory of Labor as Status** and replacing it with a theory where time belongs to the worker, regardless of their title.
