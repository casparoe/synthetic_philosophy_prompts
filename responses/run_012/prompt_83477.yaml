      *   *Normative/Descriptive Blur:* The prompt says "ought to be calibrated," but the argument with the friend seems to be about *why* cultures *are* tight. I need to clarify if this is a normative theory of governance or a descriptive theory of cultural evolution. The context suggests it's meant to explain *why* cultures vary (descriptive), but phrased normatively ("ought"). I will treat it as a functionalist hypothesis about cultural evolution.
