      *(Self-Correction on the "Fishing Village" case)*: If they are loose except on the sea, that actually *supports* the User's specificity claim (tightness calibrated to specific risks). But the fact they are loose *despite* physical danger elsewhere hurts the "general threat" idea. It suggests *domain-specific* tightness. The User already distinguishes rules/latitude/enforcement. This case might actually be a win for the User if framed as "domain-specific cliff ratio." I need to be careful not to give them a free pass. The danger is *physical*, the norm is *social*. If nature provides the sanction, social sanction is redundant. This is a nuance the User's model might miss (substitution effect).

