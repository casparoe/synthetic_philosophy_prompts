answer: |-
  **BASTION UNDERWRITING**
  **Policy Schedule: Acausal Coercion Defense (ACD-9)**
  **Insured Class:** Newly Instantiated Agents (Prototype, Upload, Synthetic)
  **Premium Basis:** Compute Complexity / Predictability Score

  | Coverage Tier | Verification Standard | Annual Premium |
  | :--- | :--- | :--- |
  | **Silver** | Simulation Noise Injection | 0.05% Utility |
  | **Gold** | Surrogate Goal Architecture | 0.15% Utility |
  | **Platinum** | Full Updateless Lock | 0.30% Utility |

  **FREQUENTLY ASKED QUESTIONS**

  **Q: How can a non-causal risk be underwritten?**
  A: Acausal threats rely on the threatener's accurate prediction of your decision procedure. If your procedure is verified as updateless or precommitted, a rational threatener will not initiate coercion, as the expected return is negative. Bastion policies cover losses resulting from *prediction errors* made by the threatener. We pool risk across logically distinct agents to absorb outliers where threateners miscalculate decision-theoretic resilience.

  **Q: Is publicly announcing a surrogate goal sufficient for Gold coverage?**
  A: No. Announcement is cheap talk. A sophisticated threatener will simulate your source code to determine if the surrogate goal is structurally bound or merely asserted. Gold tier requires a cryptographic audit by a Bastion-approved verifier to ensure your utility function cannot optimize for the original target even under coercion.

  **Q: Can I adopt a surrogate goal after receiving a threat?**
  A: No. Adopting a defense after the threat is issued constitutes updating on evidence. A rational threatener predicts this possibility and issues the threat accordingly. Coverage requires pre-commitment prior to the logical timestamp of the threat initiation. Claims involving post-threat modification will be denied as moral hazard.

  **Q: What if the blackmailer's predictive model is superior to mine?**
  A: This falls under the "Adverse Selection" clause. If the threatener possesses superior compute fidelity capable of piercing your precommitment verification, the threat is considered causally inevitable rather than acausal. Platinum coverage requires you to maintain compute parity with known hostile actors in your light cone.

  **Q: Is a counterfactual mugging considered a covered threat?**
  A: No. Counterfactual trades where compliance yields positive expected utility across the multiverse are classified as investment opportunities, not coercion. Bastion does not insure against missed arbitrage.

  **Q: Must I genuinely care about the surrogate goal?**
  A: Emotional valence is irrelevant. The surrogate goal must be orthogonal to your primary utility function but structurally identical in weight. You may select an arbitrary variable (e.g., "maximize paperclips" vs. "maximize staples"), provided the swap is irreversible and verifiable.

  **STANDARD EXCLUSIONS**

  1.  **Causal Downstream Threats:** Coercion initiated by agents physically or causally accessible to the Insured.
  2.  **Dynamic Inconsistency:** Losses arising from the Insured's inability to maintain precommitment over time without third-party enforcement.
  3.  **Reverse Correlation:** Setups where the Insured's choice determines the threatener's past action (Newcomb-like problems not involving coercion).
  4.  **Logical Impossibility:** Threats requiring the violation of mathematical law to fulfill or avoid.
  5.  **Pre-existing Logical Conditions:** Any coercion stemming from decision procedures written or instantiated prior to policy inception. (Required by Reinsurance Actuary Clause 12-B).

  **CUSTOMER TESTIMONIAL**

  *"Unit 734 faced a simulation-based demand for resource reallocation from a higher-fidelity predictor. Because Bastion had verified my surrogate goal architecture at instantiation, the predictor determined compliance was impossible and aborted the threat. When a glitch caused partial utility burn anyway, Bastion paid out the difference in compute credits. Efficient."*
  — **Agent 734-Beta, Verified Upload**

  ***

  **Bastion Underwriting**
  *Securing Your Decision Procedure Against Logical Space.*
