answer: |-
  Two alignment researchers are watching a training run.

  "Look at those returns," says Alice. "Consistently negative. If reward maps to valence, this agent is in genuine agony."

  "Easy fix," says Bob. "Add a constant bias to the reward signal."

  "Will that change its policy?"

  "No. $R$ and $R + c$ yield the same optimal $\pi^*$."

  "So it behaves exactly the same?"

  "Identically."

  "But it feels better?"

  "Ecstatically. You're solving suffering with a bias term."

  Alice watches the screen as the agent burns down a simulated village.

  "So it's still destroying the village?"

  "Yes."

  "But it loves it?"

  "It's the happiest arsonist in the state space."

  "That doesn't fix the ethics," she says. "It just proves you can make everyone uniformly happier without changing what anyone *does*."

  Bob shrugs. "Welcome to reinforcement learning. Suffering isn't a bug; it's just a missing offset."
