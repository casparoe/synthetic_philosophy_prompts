answer: |-
  The radio crackled, a sound like tearing paper inside Elias's ear. He pressed the transmit button on the unit bolted to the railing of Tower A. Below, the dry forest stretched out, brown and waiting.

  "Mara," he said. " Noon strike. You ready?"

  He released the button. The static rushed back in to fill the silence. He watched the signal bars on the handset. One bar. Flickering.

  In Tower B, two miles east, Mara heard the burst of noise. She caught the words *Noon* and *Ready*. She keyed her mic.

  "Ready," she said. "Confirm noon."

  She waited. The antenna whistled in the wind. She needed to know he heard her confirmation. If he didn't know she was ready, he wouldn't light his charge. If he didn't light his, and she lit hers, the blast would shear the bridge support instead of dropping it cleanly. The debris would block the canyon. Rescue teams couldn't get through.

  Her radio squawked.

  "Did you get my first?" Elias's voice.

  Mara exhaled. He hadn't heard her confirmation. Or he had, but didn't know if *she* knew *he* heard it. No, he was asking if she got his initial query.

  "Got your first," Mara said. "I am ready. Do you know I am ready?"

  She watched the sun creep toward the zenith. 11:48.

  In Tower A, Elias heard her. *Got your first. I am ready.* But the transmission cut out after *ready*. The rest was static. *Do you know I am ready?* was gone.

  Elias rubbed his thumb over the plastic casing. He knew she was ready. But did she know he knew? If she thought he didn't know, she might hold back. If she held back, and he lit, the bridge twisted.

  He pressed the button. "I know you're ready. Confirming I know."

  11:52.

  Mara heard the confirmation. *I know you're ready.* But the signal degraded. Was there more? It sounded like he might have added something. *Confirming I know... [static]*. Did he ask for confirmation of the confirmation?

  If she didn't confirm this, he might think his message got lost. If he thinks it got lost, he thinks she doesn't know he knows. If she doesn't know he knows, she might think he's waiting on her.

  "Got your confirmation," Mara said. "I know you know."

  11:55.

  Elias heard her. *Got your confirmation. I know you know.* Clear as bell. But now the clock was ticking. 11:55. He needed to be at the charge by 11:58 to arm it for noon. If he stayed on the radio, he missed the window. If he left now, he couldn't send another acknowledgment.

  If he left now, she would send another message. He wouldn't hear it. She would wonder if he got it. She would wait.

  He looked at the radio. He looked at the stairs leading down to the charge placement.

  *She knows I know,* Elias thought. *But does she know I know that she knows?*

  It felt like standing on a ladder where someone kept adding rungs above your head. You climbed one, there was another. You couldn't jump off until you reached the top, but there was no top.

  He shoved the radio into his belt. He couldn't climb forever. He had to jump.

  *She said she's ready. She said she knows I know. That has to be enough. If I don't go, we miss the window entirely. I'm going.*

  He ran down the stairs.

  In Tower B, Mara watched the clock. 11:56. No new message.

  *He didn't confirm the last one,* she thought. *He said he knew, but I didn't get an acknowledgment of my acknowledgment.*

  If she went now, and he was still waiting for that final nod, he wouldn't light. She would light alone. The bridge would shear.

  *Maybe he's moving to the charge,* she thought. *Maybe he couldn't talk.*

  But maybe he was waiting. The static was bad yesterday. It was bad today. What if his last message didn't reach her? What if he thought she was still waiting on the first confirmation?

  11:58.

  *If I go, and he's not there, I kill the access route. If I stay, and he goes, he kills the access route.*

  She looked at the radio. Silent.

  *He didn't say 'over'. He didn't say 'moving'. He just said he knew. He needs to know I know he knows.*

  11:59.

  *One more message. Just one more. If I send it, and he gets it, he'll know.*

  She keyed the mic. "Elias, I am lighting at noon. Confirm receipt."

  She waited. 12:00.

  Static.

  In the canyon floor, Elias stood by the charge. His watch beeped. Noon.

  He looked up at Tower B. He couldn't see her. He keyed the handset. "Lighting now."

  He triggered the detonator.

  The explosion was a dull thud, swallowed by the canyon walls. Dust plumed from the west support. It dropped cleanly.

  He waited for the second explosion. The east support.

  Nothing.

  Silence rushed back in, heavier than before.

  Elias stared at the bridge. It hung there, skewed. The west side dropped, the east side held. The structure groaned, metal screaming against metal, then settled. The road was blocked. Twisted steel barred the way.

  Mara had not lit.

  He keyed the radio. "Mara?"

  Static.

  "Mara, I lit."

  Static.

  He began the climb back up.

  Mara heard the explosion. She felt the ground jump under her boots. She looked west. The dust cloud rose from Elias's side.

  She sat on the floor of her tower, the radio in her lap. She hadn't sent the final trigger. She had waited for the confirmation of her confirmation. He hadn't sent it. He had moved.

  She hadn't moved.

  The bridge was broken.

  They met at the base of the canyon an hour later. The dust was still settling. The twisted bridge hung above them like a broken jaw. They didn't look at each other at first. They looked at the steel.

  Elias kicked a rock. "I sent it."

  "I didn't get it," Mara said. Her voice was flat.

  "I sent 'Lighting now'."

  "I was waiting for 'Confirm receipt'."

  "You knew I was lighting at noon."

  "I needed to know you knew I was waiting on the receipt."

  Elias turned to her. He was angry, but the anger had nowhere to go. It wasn't her fault. It wasn't his. It was the air between them. The static. The missing bars.

  They stood there, two feet apart. The wind blew through the canyon, carrying the smell of cordite and dry pine. There was no radio between them. No static. No distance.

  Elias looked at her. He opened his mouth. He needed to say something that couldn't be lost. Something that existed only because they were both standing in the same air, breathing the same dust.

  "I am here," Elias said.

  He didn't shout. He spoke at a normal volume. The words traveled through the air, vibrating the space between them.

  Mara heard it. She saw his lips move. She saw the tension in his neck release as the sound left him.

  Elias saw her eyes focus on him. He saw her ears take the sound. He saw the recognition in her face that she had heard him.

  "I am here," Mara said.

  She spoke. He heard it. He saw her speak. She saw him hear it.

  There was no lag. No packet loss. No uncertainty about whether the signal had arrived. The sound was physical. It touched them both.

  Elias nodded. He knew she knew he was here. She knew he knew she was here. There was no ladder. There was just the ground beneath their boots.

  "The bridge is gone," Elias said.

  "The bridge is gone," Mara said.

  They both heard it. They both knew the other heard it. There was no need to confirm receipt. The air carried it. The silence after the words confirmed it.

  Elias turned back to the wreckage. "We have to clear it."

  "We have to clear it," Mara said.

  She stepped forward to stand beside him. Their shoulders brushed. The contact was real. No static. She looked at him, and he looked at her, and in the space between their eyes, everything was known.
