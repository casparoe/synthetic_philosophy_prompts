answer: |-
  You have independently rediscovered one of the most persistent headaches in the philosophy of law and metaphysics. You are describing the problem of **Causal Selection**, specifically filtered through what H.L.A. Hart and Tony Honoré called the **Abnormality Condition**, and you are bumping directly into the paradox of **Causation by Omission**.

  Here is the breakdown of the concepts, the literature, and the actual disagreement you are sensing.

  ### (a) The General Thing: Causal Selection & The Causal Field

  The general phenomenon you identified—that we pick the "abnormal" factor out of a web of necessary conditions—has a name: **Causal Selection**.

  In philosophy, the standard model of causation is often **Counterfactual Dependence** (the "but-for" test). *But for* the disease, the patient wouldn't have died. *But for* the staffing level, the patient wouldn't have died. Both are equally necessary. Metaphysically, they are on equal footing.

  However, in practice (law, medicine, everyday talk), we do not treat them equally. We distinguish between **Conditions** (the background standing state of affairs) and **Causes** (the specific intervention or deviation).

  *   **The Concept:** **The Causal Field.** (Popularized by philosopher J.L. Mackie).
      We implicitly define a "field" of normal operations. Anything inside that field is a *condition*. Anything that deviates from that field is a *cause*.
  *   **The Mechanism:** **The Abnormality Condition.** (Hart & Honoré, *Causation in the Law*, 1959).
      Hart and Honoré argued that common-sense causation isn't about physics; it's about **deviations from a expected course**.
      *   *In your sister's ICU:* The "field" is a patient with a severe disease (expected) in a hospital with standard staffing (expected). The disease is part of the "story," but it is the *background*. The doctor covering three wards is a *deviation* from the expected field. Therefore, it gets selected as "The Cause."
      *   *Why it feels unsatisfying:* Because metaphysically, the disease is doing the killing. But pragmatically, the disease is the *problem we are managing*, while the staffing is the *variable we failed to control*.

  So, for (a), the term is **Causal Selection based on Abnormality**.

  ### (b) The Special Case: Causation by Omission

  You asked if absences are a sub-case or a separate problem. In the literature, this is treated as a distinct crisis called **Causation by Omission** (or Negative Causation).

  It is a separate problem because it breaks the "Abnormality" rule you noticed in part (a).
  *   **The Guard:** Absence is abnormal + Absence is a cause.
  *   **The Plants:** Absence is abnormal (you usually water them) + Absence is *not* a cause (in the moral/legal sense).

  If Causal Selection were purely about "what was unexpected," your failure to water the plants would be the cause of their death. But it isn't. Why?

  *   **The Problem:** **The Too Many Causes Objection.**
      If absences count as causes universally, then you are the cause of every starvation death you didn't prevent by sending money, every fire you didn't put out, etc. This leads to **Causal Inflation**.
  *   **The Solution:** **Normative Expectations.**
      Most modern philosophers (and legal theorists) argue that we only treat an omission as a cause if there was a **Normative Duty** to act.
      *   The guard had a *contractual duty* to be there. His absence violates a norm. Therefore, it is causal.
      *   You had no *duty* to water the plants (unless you explicitly agreed to). Your absence is just a fact of the world, not a violation of a norm. Therefore, it is merely a condition.

  So, for (b), this is **Causation by Omission**, and it is distinguished from general Causal Selection by the requirement of a **Normative Baseline**. It is not just about what *was* unexpected, but what *should have been* expected.

  ### (c) The Actual Disagreement: Metaphysics vs. Pragmatics

  You asked what the actual disagreement is, regarding the claim that "nothing can't cause something" vs. "I cause every death."

  This is the battle between **Metaphysical Realism** and **Pragmatic Contextualism**.

  1.  **The Metaphysical Realists (The "Nothing Can't Cause" Camp):**
      *   **Argument:** Causation is a physical relation between events (energy transfer, physical push/pull). An "absence" is not an event; it is the lack of an event. Therefore, strictly speaking, **omissions cannot cause anything.**
      *   **Implication:** When we say "the guard's absence caused the breach," we are speaking loosely. Really, the *intruder's action* caused the breach. The guard's absence was just a condition that allowed it.
      *   **Pros:** Avoids the "Too Many Causes" problem.
      *   **Cons:** Makes a hash of law and medicine. If we can't say omissions cause harm, we can't sue for negligence.

  2.  **The Pragmatic Contextualists (The "Causal Selection" Camp):**
      *   **Argument:** Causation isn't a feature of the universe; it's a **tool for explanation**. We use causal language to identify *levers for intervention*.
      *   **Implication:** We call the staffing "the cause" not because it pushed the patient, but because it is the thing we can *change* next time. We don't call the disease "the cause" in the root-cause analysis because we are already trying to fix the disease; we are trying to fix the *system*.
      *   **Pros:** Explains why we talk the way we do. Solves the ICU problem.
      *   **Cons:** Risks the "Too Many Causes" problem (why can't I intervene on the plants?).

  **The Synthesis (The Answer to your deadlock):**
  The disagreement is resolved by admitting that **Causal Claims are Normative.**
  When we say "X caused Y," we are not just making a physics claim; we are making a claim about **responsibility and intervention.**
  *   "The guard caused the breach" = "The guard was the appropriate target for intervention/blame."
  *   "I didn't cause the plants' death" = "I was not the appropriate target for intervention/blame."

  ### Coining the Term

  You asked me to coin a name if there isn't a single one. While "Causal Selection" is the academic term, it feels too dry for the visceral frustration you're describing. It misses the moral weight your sister feels.

  I propose calling this **"Normatively-Filtered Causal Salience."**

  *   **Normatively-Filtered:** We screen out potential causes that don't violate a duty or expectation (the plants).
  *   **Causal Salience:** We highlight the factors that stand out against the background (the staffing).

  **How this differs from "The thing we could have changed" (Control):**
  Sometimes we can change the background, but we don't call it the cause. We could theoretically cure the disease (change it), but in the root-cause analysis, we treat it as fixed/background. We focus on the staffing because it is the *uncontrolled variable* in the system. "Control" implies ability; "Salience" implies *attention*. We attend to the breach of protocol, not the breach of biology.

  **How this differs from the Cynical View (Suing/Firing):**
  The cynical view says we pick causes *only* to find a scapegoat. **Normatively-Filtered Causal Salience** argues we pick causes to **stabilize expectations.**
  If we label the disease "the cause," the lesson is "Patients with this disease die." (Fatalism/No learning).
  If we label the staffing "the cause," the lesson is "Systems must not allow one doctor to cover three wards." (Systemic improvement).
  It isn't just about blame; it's about **information compression.** We cannot store the "giant sprawling story" in a database. We need a tag that tells future actors where to look. The "abnormal" tag is the most efficient compression algorithm for preventing recurrence.

  ### Summary for the Argument with Your Sister

  1.  **You are right about the pattern:** It is called **Causal Selection**. We select causes based on **Abnormality** (Hart & Honoré), not just necessity.
  2.  **You are right about the absence problem:** It is called **Causation by Omission**. It is treated differently because it requires a **Normative Duty** to count as a cause (avoiding the "Too Many Causes" problem).
  3.  **The Resolution:** Causation in human systems (medicine, law) is not a metaphysical fact like gravity; it is a **Pragmatic Tool**. We name the cause that represents the **fixable deviation from the norm.**
  4.  **Why it hurts:** Because it feels like we are ignoring the "real" physical cause (the disease). But in systems engineering, the "real" cause is the one that, if fixed, prevents the outcome *in the future*. The disease is the hazard; the staffing is the failure of the safeguard. We investigate the safeguard failure.

  Your sister is frustrated because she sees the **Metaphysical Reality** (the disease killed him). The review board is operating on **Systemic Pragmatism** (the staffing failure allowed it to happen). Both are true, but they are playing different language games.
