prompt: |-
  I'm a grad student in political philosophy, and I'm trying to pin down somethnig about how liberal states treat conscience. I'd like you to act as an expert on just war theory and the law of armed conflict, and think through this carefully with me rather than giving me the standard survey. Start by brainstorming a few candidate readings of the practice before you commit to one.

  Here's the practice that's bugging me. Take conscientious objection to military service. In the US, and in a bunch of other countries, if you want the legal exemption you have to be against war as such — against participating in any war. The way it's usually put is that you have to oppose war in any form. Somebody who shows up and says "this particular war is unjust and I won't fight in it, but I'd gladly fight in a just one" gets turned down; the boards treat that as a political judgment, not a conscientious one. Selective objection basically doesn't count.

  But here's what makes me scrath my head. The same legal order, at least since Nuremberg, tells soldiers that "I was just following orders" is no defense, and that you have a duty to disobey manifestly unlawful orders — that you're supposed to follow your conscience against the state's command to commit atrocities. So the law is willing to honor conscience when it tells you to refuse an illegal order, but it refuses to honor conscience when it tells you the whole war is illegal. That can't be right as stated, or at least it needs some story.

  So here's what I want from you. What does this practice presuppose? What has to be true about conscience for the "all wars, not this war" line to make sense? Does it presuppose that genuine conscience has to be universal and unconditional, that it's a matter of identity rather than judgment, that it has to be grounded in religion or morality rather than politics, or something else entirely? Which rival accounts of conscience does the rule quietly rule out? And is the practice actually committed to any one of these, or is it underdetermined — could several different theories of conscience license the same rule, with the universality requirement doing other work (say, an administrative filter for sincerity)?

  Then the second half: is the practice consistent with the Nuremberg-side insistence that you must follow conscience against unjust orders, or do the two pull apart? If they pull apart, is that a genuine inconsistency in the commitments, or just a tension between two different institutional concerns — military discipline on one side, individual conscience on the other — that don't have to share a theory?

  A colleague floated the idea that what the boards are really testing for isn't universality at all but whether the objection is identity-constituting — whether refusing would cost you something like your sense of who you are — and that universality is just a crude proxy for that. I don't know if that's right. If you think that reading is better, tell me what it changes about the reconstruction.

  Don't give me a reading list or citations, I'll handle those myself. I want the reconstruction of the implicit theory, and a clear line between what the practice strictly presupposes and what it merely fits well with. Be honest about confidence: if part of this turns on how the exemption actually works in practice and you're not sure, say so instead of asserting it. And if my framing is confused — for instance, if you think the two halves of the law aren't actually in tension — push back instead of humoring me.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
