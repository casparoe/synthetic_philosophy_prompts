          *   I need to push back on the idea that Nuremberg and CO are the *same* kind of conscience. One is negative (don't commit crime), one is positive (opt out of system).

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I initially thought about focusing heavily on *jus ad bellum* vs *jus in bello*. I need to make sure I don't get bogged down in JWT technicalities and lose the *political philosophy* angle on conscience.
      *   *Refinement:* The key is the liberal distinction between the *right to exit* (CO) vs. the *duty to police* (Nuremberg).
      *   *Confidence:* I am confident in the philosophical reconstruction, less confident in the specific administrative practices of every liberal democracy, so I will qualify claims about "the practice" to the US/Western model generally.
