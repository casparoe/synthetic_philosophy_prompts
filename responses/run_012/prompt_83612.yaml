answer: |-
  **JOINT STATEMENT ON THE STRUCTURE AND EXPLANATION OF SELF-DECEPTION**

  **Date:** October 24, 2023
  **Signatories:** [Intentionalist Participant], [Non-Intentionalist Participant]
  **Context:** Concluding document of the Adversarial Collaboration Workshop on Self-Deception

  ### 1. Substantive Points of Agreement

  We, the undersigned, having engaged in two days of structured dialectic, affirm the following claims as the common ground for our future work. We reject the notion that self-deception is a folk-psychological myth, and we reject the notion that the logical paradoxes surrounding it render the phenomenon impossible.

  1.  **The Phenomena are Real and Distinct:** We agree that self-deception is distinct from simple ignorance, lying, and mistaken belief. It involves a specific etiology where motivation influences doxastic formation in a way that is epistemically defective but subjectively resilient.
  2.  **Case Specificity:** To anchor our theories, we agree on two paradigm cases that any adequate account must explain without residue:
      *   *The Anxious Parent (Ordinary Life):* A mother receives multiple credible reports from teachers that her son is bullying classmates. She feels a surge of distress. Subsequently, she remembers only the teacher's compliment about his art project, dismisses the reports as "misunderstandings," and interrogates her son in a leading manner that elicits denials she accepts uncritically. She sincerely believes he is innocent. Her belief is false, but her confidence is high, and she avoids further information gathering.
      *   *The Tenured Skeptic (Institutional/Professional):* A senior physicist holds a favored theory that is increasingly contradicted by new data. She does not consciously decide to ignore the data. However, she assigns herself to review papers challenging her theory and consistently recommends rejection on technical grounds she would waive for allies. She cites older, supportive papers disproportionately in her own work. She sincerely believes her theory remains the most viable. Her belief may be false, but the distortion lies in her stewardship of the evidentiary process.
  3.  **The Paradox as Constraint, Not Refutation:** We agree that the "Static Paradox" (holding contradictory beliefs) and the "Dynamic Paradox" (intending to deceive oneself) highlight tensions in our folk psychology, but neither proves self-deception is impossible. The Static Paradox shows we cannot model the self-deceived mind as a single, synchronous, transparent belief-box. The Dynamic Paradox shows we cannot model the agency involved as a fully conscious, unitary strategic plan. Both accounts must dissolve these paradoxes without denying the phenomena.
  4.  **Normative Responsibility:** We agree that self-deception carries a specific normative weight. We blame self-deceivers in ways we do not blame the merely mistaken. This suggests that the self-deceived person is not a passive victim of cognitive malfunction but is implicated in the production of their error. Any account must explain why the self-deceiver is an appropriate target of critique (e.g., for epistemic negligence or bad faith).
  5.  **Truth Value and Policy Distortion:** We agree that the falsity of the resulting belief is not the defining feature of self-deception. A person can self-deceptively arrive at a true belief (e.g., the Anxious Parent's son actually *is* innocent, but she believes it only because she ignored evidence that he was guilty). What matters is the distortion of the *policy* by which evidence is gathered and weighed. If the mechanism is motivationally biased in a way that typically leads to error, it counts as self-deception regardless of the accidental truth of the outcome.
  6.  **Verbal Disputes:** We acknowledge that a portion of our historical disagreement is verbal. Specifically, arguing over whether the term "deception" *strictly* requires a conscious intention to mislead is unproductive. We agree to use "deception" in a functional sense (producing a false or unwarranted belief in a target) while reserving judgment on whether the "deceiver" and "deceived" must be distinct homunculi or conscious agents.

  ### 2. Residual Disagreement

  Despite our agreement on the phenomena, we disagree on the underlying architecture required to explain them. The following table isolates the precise points of divergence. We have vetted these formulations to ensure neither constitutes a strawman of the other's position.

  | Disputed Question | Intentionalist Formulation | Non-Intentionalist (Deflationist) Formulation |
  | :--- | :--- | :--- |
  | **1. The Role of Agency** | Self-deception is a *teleological* activity. The subject pursues the goal of holding a specific belief (or avoiding another). This goal-directedness is constitutive of the phenomenon, even if the intention is not consciously entertained. | Self-deception is a *mechanical* outcome of motivational bias. The subject pursues the goal of emotional comfort or social standing, and the belief is a byproduct. No goal regarding the belief itself is required. |
  | **2. Mental Architecture** | To avoid the Static Paradox, the mind must be functionally partitioned. There must be a subsystem that knows the truth (or manages the deception) and a subsystem that holds the false belief. These parts need not be "persons," but they must be agential enough to manage information flow. | A unified mind with biased processing rules suffices. Asymmetrical scrutiny (testing $p$ harder than $\neg p$) explains the outcome without needing a "deceiving part." The mind is one, but its standards are inconsistently applied. |
  | **3. The Reflexive Case** | If a subject believes "I am self-deceived about $X$," this requires a higher-order intention to monitor the deception. If she is wrong (she thinks she is self-deceived but isn't, or vice versa), it implies a failure of the monitoring sub-agent to communicate accurately with the conscious self. | If a subject believes "I am self-deceived about $X$," this is a higher-order biased belief. She may wish to see herself as insightful (believing she sees her own bias) or wish to excuse herself (believing she is biased to lower responsibility). It is bias all the way down. |

  ### 3. The Cruxes: Predictions and Evidence

  We identify three specific sub-questions where empirical or conceptual progress could shift the burden of proof. For each, we record our divergent predictions and agree on what would count as evidence against our respective positions.

  **Crux 1: Strategic Signatures in Information Avoidance**
  *   **The Question:** Does the avoidance of counter-evidence look like strategic hiding (interpersonal deception) or like heuristic neglect (bias)?
  *   **Intentionalist Prediction:** Behavioral and neural markers will show evidence of *active suppression* or *strategic planning* to avoid information, analogous to lying. We expect to see conflict-monitoring signatures (e.g., anterior cingulate activation) when the subject encounters the threat of evidence, indicating a goal to suppress it.
  *   **Non-Intentionalist Prediction:** Avoidance will look like *attentional drift* or *re-weighting*. The subject does not "hide" the evidence from themselves; they simply fail to register its relevance. We expect to see reduced activation in salience networks, not conflict monitoring.
  *   **Agreed Falsifiers:**
      *   *Against Intentionalism:* If studies show that self-deceivers process threatening evidence with no more cognitive load or strategic planning than they process neutral evidence, the "intention to deceive" loses its mechanistic foothold.
      *   *Against Non-Intentionalism:* If subjects demonstrate the ability to successfully hide evidence from their future selves in ways that require complex planning (e.g., setting up environmental constraints to prevent future knowledge), simple bias models will be insufficient.
  *   **Status:** Empirical.

  **Crux 2: The "Lucky Self-Deceiver" (True but Unwarranted Belief)**
  *   **The Question:** Can we distinguish the self-deceiver from the optimist when both arrive at a true belief via biased means?
  *   **Intentionalist Prediction:** The distinction lies in the *aim*. The self-deceiver aims at comfort; the optimist aims at truth but is biased. If the belief is true, the Intentionalist must argue the intention was to believe the comforting thing, which happened to be true. This makes the "true self-deceiver" a rare, unstable category.
  *   **Non-Intentionalist Prediction:** The distinction is irrelevant to the mechanism. Both are products of motivational bias. Calling one "self-deception" and the other "optimism" is a post-hoc normative judgment based on truth value, not a difference in kind.
  *   **Agreed Falsifiers:**
      *   *Against Intentionalism:* If we find cases where subjects clearly intend to believe $p$ for comfort, succeed, and $p$ is true, yet we still intuitively classify this as self-deception, the Intentionalist link between deception and falsity/error is strained.
      *   *Against Non-Intentionalism:* If subjects treat their own true beliefs formed via bias differently (e.g., with less confidence or different justification) than their false beliefs formed via bias, it suggests the mind tracks the reliability of the process, undermining the "bias is all that matters" claim.
  *   **Status:** Conceptual/Empirical hybrid.

  **Crux 3: Reflexive Accuracy**
  *   **The Question:** In the reflexive case ("I know I am self-deceived"), is the subject accessing a hidden truth or constructing a new narrative?
  *   **Intentionalist Prediction:** A subject who correctly identifies their own self-deception has temporarily bridged the partition. The "deceiving part" has lost control, or the "deceived part" has gained access to the manager's logs. This should be a moment of high cognitive integration.
  *   **Non-Intentionalist Prediction:** The claim "I am self-deceived" is itself a belief subject to bias. A subject might claim this to signal humility or to preempt criticism. Accuracy is accidental.
  *   **Agreed Falsifiers:**
      *   *Against Intentionalism:* If subjects who claim to be self-deceived show no change in information processing (they continue to ignore evidence despite the insight), the "bridging the partition" model fails. Insight does not equal integration.
      *   *Against Non-Intentionalism:* If subjects who claim to be self-deceived show a marked, sustained improvement in evidentiary scrutiny compared to those who deny it, it suggests the reflexive belief accesses a real structural fact about their cognition, not just another biased narrative.
  *   **Status:** Empirical.

  ### 4. Closing Note: Unsettled Issues and Conceptual Redescription

  This collaboration has not settled whether self-deception is fundamentally a failure of *rationality* or a success of *coping*. Nor have we resolved whether the "intention" posited by the Intentionalist is a genuine mental state or a metaphorical description of a homeostatic loop.

  We note that a significant portion of our disagreement may stem from divergent working concepts of **belief**.
  *   The **Intentionalist** tends to treat belief as a commitment that one *manages*. On this view, managing a commitment implies an agent doing the managing.
  *   The **Non-Intentionalist** tends to treat belief as a *disposition* to act and infer. On this view, dispositions can be skewed by motivation without a manager.

  If we adopt a "policy-based" view of belief (where believing $p$ is committing to a policy of using $p$ in reasoning), the Intentionalist's "management" looks more like policy enforcement, and the Non-Intentionalist's "bias" looks more like policy corruption. This redescription may dissolve the need for a "deceiver" while preserving the normative blame (one is responsible for one's policies).

  Furthermore, regarding the **reflexive case**, we acknowledge a shared difficulty. If a subject believes "I am self-deceived," the Intentionalist risks an infinite regress of deceivers (who deceives the monitor?). The Non-Intentionalist risks a performative contradiction (I am biased in believing I am biased). We agree that this specific case remains the strongest test for both theories. Neither of us has a fully satisfactory account of how a system can accurately model its own opacity without becoming transparent.

  Finally, we acknowledge that the **true but unwarranted belief** case forces us to confront the value of truth in our definitions. If self-deception is defined by the *process* (motivational bias), truth is irrelevant. If it is defined by the *outcome* (holding a false belief), truth is essential. We have agreed in Section 1 to prioritize the process, but we recognize that our pre-theoretical intuitions still tug toward the outcome. This tension remains unresolved.

  We sign this statement not to declare victory, but to map the terrain on which the next phase of inquiry must be built.

  __________________________
  [Intentionalist Participant]

  __________________________
  [Non-Intentionalist Participant]
