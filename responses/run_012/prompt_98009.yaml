answer: |-
  Good evening, everyone. For those who don't know me, I'm the sibling. And for those who *do* know me, you know I'm currently operating under a very specific set of constraints.

  [Name of Bride] told me beforehand, and I quote, "If you stand up there and say we're 'perfect for each other' or that we'll 'live happily ever after,' I will disown you." She said this only half-jokingly. So, consider this my formal plea to the estate executors: I am following instructions.

  But honestly, being given that restriction is a gift. Because it forces me to talk about what marriage actually *is*, rather than what we pretend it is.

  My sister is finishing her PhD in philosophy, specifically on something called "Transformative Experience." For the half of the room currently checking their watches, don't worry, I'm not going to lecture you. But the core idea is this: There are certain choices in life—having a child, moving to a new country, or, say, getting married—that change you so fundamentally that you cannot know what it will be like from the inside until you've already done it.

  You can't make a pros and cons list for becoming a new person, because the "you" who makes the list isn't the "you" who has to live with the results.

  [Name of Bride] has this brilliant spin on it: She says getting married is making a promise on behalf of a person who doesn't exist yet. The "you" standing here at the altar is not the "you" who will be here in ten years. That future version of yourself is being created by the very choice you're making today.

  Now, for the family: I know this sounds complicated. But translate it out of the academic speak, and it's actually the most romantic thing I've ever heard her say.

  Because if you can't know what marriage will be like, and you can't guarantee how you'll change, then standing here today isn't about certainty. It's about courage.

  It's easy to commit to something you understand. It's easy to sign a contract when you know exactly what the fine print says. But [Name of Bride] and [Name of Groom] are doing something braver. They are acknowledging that they *don't* know who they will become. They don't know what hardships will reshape them, or what joys will soften them, or how the other person will surprise them when the script flips.

  And they are saying "Yes" anyway.

  [Name of Groom], you are signing up for a future self of hers that hasn't been written yet. And she is doing the same for you. That requires a level of trust that goes way beyond "compatibility." Compatibility is about who you are *now*. Marriage is about who you are willing to become *together*.

  So, I'm not going to wish you a life without conflict, because conflict changes us. I'm not going to promise you constant happiness, because happiness is a weather pattern, not a climate. And I certainly won't say you're perfect, because perfection implies you're finished, and the whole point of today is that you are just beginning to be made.

  Instead, I want to make a promise that fits within the epistemic boundaries of the bride's dissertation.

  I promise to love the people you are today. And I promise to remain curious about the people you will become. When the transformation gets scary—and it will—I hope you remember this moment. Not the details of the catering or the flowers, but the feeling of standing on the edge of the unknown, holding hands, and deciding to jump.

  To the philosophers in the room: This toast respects the limits of rational choice theory.
  To the family: This toast means they're brave enough to love each other without a map.

  So, if everyone could raise a glass.

  To [Name of Bride] and [Name of Groom]. May you be kind to the future selves you are creating. May you be patient when the other person changes in ways you didn't predict. And may you always find each other, no matter how many times you transform.

  To the unknown.
