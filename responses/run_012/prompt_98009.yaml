prompt: |-
  My sister's getting married next month and she's asked me to give the toast. The wrinkle: she's finishing a PhD in philosophy and her whole dissertation is on L.A. Paul's thing about transformative experience -- the idea that some big life choices (having a kid, becoming a vampire, uprooting to another country) change you so much that you literally can't know in advance what they'll be like from the inside, so the usual "list the pros and cons and pick the best option" model of rational choice kind of falls apart. She's got her own spin on it too, which she's defaintely told me about at least four times: that getting married is promising something on behalf of a person who doesn't exist yet, because future-you -- the one who'll actually be doing the being-married -- gets made by the very choice you're making now. Half the room at the reception will be her department, who'll catch every nod; the other half is our very warm, very emotional, non-academic family who just want to hear something lovely about the two of them. She told me beforehand, only half joking, that if I stand up and say "you two are perfect for each other and you'll be happy forever," she'll disown me, because on her view nobody can honestly know that going in. So write me a four-to-five minute toast. It needs to be genuinely moving and funny and land as love rather than as a seminar, and it can't smuggle in any claim she'd have to object to. And it has to actually do something with the philosophy -- not just name-drop it once and move on -- so the idea shapes what I'm allowed to promise on their behalf and what I have to leave open.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Sister's wedding next month.
      *   **Speaker:** Sibling of the bride.
      *   **Key Constraint 1 (The Bride):** PhD candidate in Philosophy, specializing in L.A. Paul's "Transformative Experience."
      *   **Key Constraint 2 (The Theory):** Transformative experiences change you so much you can't know what they're like beforehand. Rational choice (pros/cons) fails. Marriage creates a "future you" that doesn't exist yet.
      *   **Key Constraint 3 (The Audience):** 50% Philosophy Department (will catch references/nods), 50% Warm/Emotional Non-Academic Family (needs to be lovely, not dry).
      *   **Key Constraint 4 (The Ban):** Cannot say "You're perfect for each other" or "You'll be happy forever" (Bride will disown speaker for making epistemically unjustified claims).
      *   **Key Constraint 5 (The Goal):** Genuinely moving, funny, lands as love, not a seminar. Must *use* the philosophy to shape the promise/toast, not just name-drop.
      *   **Length:** 4-5 minutes (approx. 600-750 words spoken at a moderate pace).

  2.  **Deconstruct the Philosophy (L.A. Paul & Bride's Spin):**
      *   *Core Idea:* You can't know what marriage is like until you're in it because it changes who you are.
      *   *Bride's Spin:* Promising on behalf of a non-existent future self.
      *   *Implication for Toast:* Don't predict the future. Acknowledge the uncertainty. Frame the commitment not as a guarantee of happiness, but as a willingness to face the unknown *together*. The value isn't in knowing the outcome, but in choosing the transformation.

  3.  **Determine the Tone:**
      *   Warm, witty, slightly intellectual but accessible.
      *   Needs to bridge the gap between the philosophers nodding in approval and the aunties wiping tears.
      *   Avoid jargon where possible, or explain it through metaphor.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the unique pressure. Make a joke about the "disowning" threat. Establish the sibling bond.
      *   **The Philosophy (The "Meat"):** Introduce the concept without lecturing. Use the "vampire" example (classic L.A. Paul) but pivot to marriage. Explain *why* we can't predict happiness.
      *   **The Pivot (The Emotional Core):** If we can't predict, why do it? Because the uncertainty is the point. It's about building the future selves together.
      *   **The Groom/Partner:** Needs to be included. How do they fit into this transformative framework? They are the co-pilot in the unknown.
      *   **The Toast/Promise:** What *can* I promise? Not happiness. But presence, curiosity, and the willingness to be changed.
      *   **Closing:** Raise glasses.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hi everyone. Sister told me not to say "happy ever after." She's writing a thesis on why that's impossible.
      *   L.A. Paul says marriage changes you. You become a new person.
      *   So I can't say you'll be happy. But I can say you're ready to be changed.
      *   [Groom's Name], you're the other half of this experiment.
      *   Let's drink to the unknown.

      *Critique 1:* Too dry. Needs more heart. Needs to address the family side more. Needs to be funnier.

  6.  **Drafting - Iteration 2 (Adding Flavor & Emotion):**
      *   Start with the threat. "If I say 'perfect match,' I'm out of the will."
      *   Explain the "Transformative Experience." Use the vampire analogy lightly.
      *   Connect it to love. Love isn't finding a puzzle piece; it's melting down the pieces to make a new sculpture.
      *   Address the family: You don't need a PhD to know love is scary.
      *   Address the philosophers: Yes, I'm respecting the epistemic boundary.
      *   The Wish: Not for happiness, but for courage.

  7.  **Refining the Philosophy (Crucial Step):**
      *   The bride's specific spin is: "Promising something on behalf of a person who doesn't exist yet."
      *   I need to make sure the toast reflects *that*. The vow isn't a prediction; it's a blank check signed by the current self for the future self.
      *   So, the toast should celebrate the *courage* to sign that check.

  8.  **Writing the Content (incorporating constraints):**
      *   *Word Count Check:* 4-5 minutes is roughly 600-800 words.
      *   *Tone Check:* Is it too academic? Keep sentences punchy.
      *   *Emotional Check:* Ensure the groom feels included and the sister feels seen.

      *(Self-Correction during drafting)*: Make sure I don't accidentally say "You will grow." Say "You *might* grow, and that's okay." Actually, L.A. Paul says you *will* be transformed, just you don't know the valence. So I can say "You will change," just not "You will change for the better." Wait, marriage implies a normative good. I should frame it as "You will change, and you choose to face it together."
      *Refinement:* The toast should focus on the *choice* to enter the transformation, not the *result* of the transformation.

  9.  **Final Polish:**
