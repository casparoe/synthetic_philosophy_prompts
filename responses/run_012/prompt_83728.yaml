  **MEMORANDUM**

  **TO:** Content Review Panel
  **FROM:** [Your Name], Philosophy of Biology Consultant
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on "Function" Terminology for Evolution Gallery

  **Bottom Line:** We must stop treating "function" as a single concept. The Selected-Effects (SE) and Causal-Role (CR) accounts answer different questions. SE explains *why a trait exists* (history); CR explains *what a trait does now* (current contribution). For an evolution gallery, SE is the primary standard, but we must acknowledge CR where current utility exists. Adopting this dual framework resolves the panelists' deadlock without sacrificing scientific accuracy.

  **The Conflict**
  Our disagreement stems from two valid but distinct definitions of "function."
  1.  **Selected-Effects (SE):** A trait's function is the effect for which it was naturally selected. This explains why the trait is here. If a trait was selected for thermoregulation, that is its function, even if it fails to regulate heat today.
  2.  **Causal-Role (CR):** A trait's function is any current contribution it makes to a containing system's capacity. This is relative to the system chosen. If the appendix houses bacteria now, that is a function, even if evolution didn't design it for that.

  The Palaeontologist argues from CR (usefulness now); the Philosopher argues from SE (history of selection). Both are correct within their own frameworks, but mixing them creates contradictions.

  **Implications of the Choice**
  Adopting this distinction clarifies two critical issues for our designers:
  1.  **Malfunction:** Talk of "malfunction" only makes sense under SE. A trait malfunctions if it fails to perform the effect it was selected for. Under CR, a trait merely contributes differently; it does not malfunction. We must restrict "malfunction" to SE contexts.
  2.  **"For" Talk:** Designers love saying a part is "for" something. This is teleological language. It is only strictly accurate under SE. We cannot say a trait is "for" a current benefit unless that benefit explains its existence. We must reserve "for" for evolutionary functions.

  **Steelman of the Rejected Single-Account Approach**
  If we were forced to choose only one account, the Causal-Role view is powerful for physiology and medicine. It captures novel utilities (like the appendix's bacteria reservoir) that SE ignores. Rejecting CR entirely would blind us to how organisms actually operate today. However, for an *evolution* gallery, CR is insufficient. It cannot distinguish between adapted traits and accidental byproducts. If we use CR alone, we imply the heart sound is as "functional" as the pumping, obscuring the mechanism of natural selection. Therefore, SE must remain the default for evolutionary explanations.

  **Recommendation and Label Revisions**
  We will adopt the dual-account strategy. Labels will distinguish "Evolutionary Function" (SE) from "Current Role" (CR). This satisfies the Philosopher's demand for historical accuracy and the Palaeontologist's demand for current utility.

  Please hand the following replacement text to the designers immediately:

  **1. Human Goosebumps**
  *Current:* "a leftover from our furrier ancestors — it no longer has a function."
  *Replacement:* "**Evolutionary Function:** Thermoregulation (in furrier ancestors). **Current Role:** None. This reflex remains, but without fur, it no longer warms us."
  *Rationale:* Acknowledges SE function (history) while confirming CR uselessness (now).

  **2. The Appendix**
  *Current:* "a vestigial organ, with no function."
  *Replacement:* "**Evolutionary Function:** None (vestigial). **Current Role:** Reservoir for beneficial gut bacteria."
  *Rationale:* Denies SE function (not selected for bacteria) but affirms CR contribution (science advisory).

  **3. Heart Sound Interactive**
  *Current:* "the sound it makes has a function: it lets a doctor hear your heartbeat."
  *Replacement:* "**Biological Function:** Pumping blood. **Incidental Effect:** Sound. Doctors use this sound for diagnosis, but the heart was not selected to make noise."
  *Rationale:* Clarifies that the sound is a CR function only within a medical system, not an SE biological function.

  **Next Steps**
  This framework prevents future relitigation. If a label concerns *origin*, use SE. If it concerns *operation*, use CR. Do not blend them. Approve these revisions so we can meet the Thursday deadline.
