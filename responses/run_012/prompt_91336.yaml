      *   *Section 4: The Degree Objection.* Tackle the "absurdity" claim. Compatibilists *embrace* degrees. Responsibility is graded.
      *   *Section 5: The Lecture Fix.* How to explain this to the class next week.
      *   *Conclusion:* Summarize the specific broken step.

  8.  **Refining the Argument (Self-Correction during drafting):**
