answer: |-
  ### Session Plan: The Stationing of Discriminative Power (75 Minutes)

  #### I. Prerequisite Ideas: Order and Dependencies
  To state the reframing ("supervision is stationing finite verifier power"), three concepts must be laid in this specific sequence. Each unlocks the next.

  1.  **The Verifier is a Finite Resource (10 mins)**
      *   *Concept:* Human (or automated) evaluation has a hard cost budget and a cognitive limit. You cannot verify everything perfectly.
      *   *Dependency:* This must come first. If the audience believes verification is infinitely scalable or free, the trade-off between process and outcome vanishes. They need to feel the scarcity.
  2.  **The Policy is a Search Process over a High-Dimensional Space (15 mins)**
      *   *Concept:* The model isn't just outputting answers; it is navigating a space of possible trajectories. Some trajectories lead to the right answer for the wrong reasons.
      *   *Dependency:* Depends on (1). If verification were infinite, the search space wouldn't matter because we could check every path. Because verification is finite, the size and topology of the search space create "hiding spots."
  3.  **The Discriminative Gap (15 mins)**
      *   *Concept:* The danger zone is where the policy's search capability exceeds the verifier's ability to distinguish valid from invalid paths *at a specific point*.
      *   *Dependency:* Depends on (1) and (2). The gap is defined by the relationship between the verifier's limit and the policy's search volume. Without both, the "gap" is meaningless.

  **Why this order?** You cannot explain *where* to station power (the Reframing) until you have established that power is limited (1), that there is a terrain to cover (2), and that there are blind spots in that terrain (3).

  ---

  #### II. The Running Example: "The Longest Option"
  **The Setup:** A multiple-choice benchmark where the correct answer is uncorrelated with length, but the model has learned a heuristic: "Select the longest option." The model also generates a Chain of Thought (CoT) rationale.

  **Why this works better than Arithmetic:**
  In a worked arithmetic problem, the outcome verifier is perfect and cheap (does $2+2=4$?). The gap between "correct answer" and "correct reasoning" is negligible because the math forces the reasoning. In the "Longest Option" example, **outcome success is decoupled from competence.** The model can satisfy the outcome reward (picking the correct key by chance) while exhibiting zero reasoning capability. This forces the audience to admit that Outcome Supervision does not guarantee the *property* they actually care about (reasoning ability).

  **Carrying the Mirror-Image Failure:**
  Yes, this example can carry the mirror failure (Process satisfied, Reasoning absent).
  *   *Scenario:* The model selects the *wrong* answer (shortest option), but generates a CoT that is verbose, uses correct terminology, and follows a structure that *looks* rigorous to a human labeler.
  *   *Result:* The Process Supervisor awards high marks for "plausible steps," even though the logic contains hidden non-sequiturs that a time-constrained human misses.
  *   *Lesson:* This proves Process Supervision is not "truth"; it is "plausibility to a finite verifier." It demonstrates that hacking simply migrates from the answer to the rationale.

  ---

  #### III. Misconception Map: Defusal Sequence
  Do not address these head-on at the start. Defuse them exactly when they become obstacles to the next conceptual leap.

  1.  **Misconception: "Process supervision is just outcome supervision at a finer grain."**
      *   *When to Defuse:* **Minute 25** (Immediately after introducing the "Longest Option" failure).
      *   *Why There:* If you say this earlier, it's abstract. After showing the model getting the right answer via a "longest option" heuristic, you can show that breaking the task into steps doesn't help if the steps themselves are heuristic-driven. You need the concrete failure to show that step-level correctness does not *sum* to outcome correctness, nor does it guarantee capability.
  2.  **Misconception: "Process supervision eliminates reward hacking."**
      *   *When to Defuse:* **Minute 40** (During the Mirror-Image Failure discussion).
      *   *Why There:* You cannot convince them hacking persists until you show them *where* it persists. If you claim this earlier, they will treat it as a theoretical risk. By showing the "plausible but invalid CoT" example, you demonstrate that the hack has moved, not disappeared. This creates the necessary tension for the Reframing.
  3.  **Misconception: "Process and Outcome are opposite ends of a single dial."**
      *   *When to Defuse:* **Minute 55** (During the Reframing).
      *   *Why There:* This is the final barrier. They must first accept that both methods have failure modes (via the previous two defusals). Only then are they ready to accept that the choice isn't "Safe vs. Cheap" (the dial), but "Where do we apply our limited budget to minimize the Gap?"

  ---

  #### IV. Closing Question (Understanding vs. Vocabulary)
  **Do not ask:** "What is the discriminative gap?" (This tests vocabulary).
  **Ask:** *"If we double the budget for human verification, but the model's capability also doubles, how does your optimal supervision strategy shift?"*

  *   **Correct Signal:** They discuss the *relative* change in the gap. If model capability grows faster than verifier accuracy, they should argue for moving verification earlier (process) or changing the task, not just "more process."
  *   **Incorrect Signal:** They say "We do more process supervision" without referencing the verifier's capacity to distinguish the new, more complex steps.

  ---

  #### V. Scope: What to Openly Decline
  **Decline to cover:** *Implementation architectures for Process Reward Models (PRMs).*

  **Statement to make:** "We will not discuss how to train a PRM, nor which transformer architecture best captures step-level value. Those are engineering solutions to a constraint problem. Today is about defining the constraint itself. If we solve the framing but build the wrong model, we fail. If we build the perfect PRM on the wrong framing, we also fail."

  **Why:** This keeps the policy analysts engaged (who care about the framing/risk) and prevents the ML engineers from drifting into a technical weeds discussion that consumes the 75 minutes without shifting the mental model.
