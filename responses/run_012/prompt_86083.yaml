prompt: |-
  Next month I'm leading a seventy-five-minute session for a mixed group — working ML engineers plus two policy analysts, none of them with a philosophy background — and they will arrive with the slogan that process supervision is the careful option and outcome supervision the cheap one. I want to move them to a framing they won't have met: that the choice is not between two techniques but about where a finite verifier's discriminating power is stationed, and that the variable that matters is the gap between what the policy can search over and what the verifier can actually tell apart. Don't give me the explanation; plan the session. Which ideas have to be in place before that reframing can even be stated, in what order, and why each depends on the one before it? I want a single example to carry the whole thing, and my candidate is a multiple-choice setting where the model reliably picks the longest option, so an outcome reward is fully satisfied while nothing recognizable as reasoning is happening — tell me what that example must do that a worked arithmetic problem could not, and whether it can also carry the mirror-image failure, where a process reward is satisfied by steps that merely look plausible to the labeler. Then map the misconceptions in the order they will surface — I expect that process supervision is just outcome supervision at a finer grain, that process supervision eliminates reward hacking, and that the two sit at opposite ends of a single dial — and say precisely where in the sequence each has to be defused and why there rather than earlier. Close by giving me one question to ask at the end that would distinguish understanding the reframing from having learned the vocabulary, and tell me what I should openly decline to cover in the time available.
