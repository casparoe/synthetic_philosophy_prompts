answer: |-
  # Q&A PREP SHEET: Akrasia vs. Hyperbolic Discounting
  **Seminar:** Interdisciplinary Department Seminar
  **Presenter:** [Your Name]
  **Core Thesis:** Akrasia $\neq$ Hyperbolic Discounting. Akrasia is an evaluative conflict (Standing vs. Engaged), not a temporal preference reversal.

  ---

  ## 1. THE HIGH-DAMAGE OBJECTIONS
  *Ordered by threat level to the paper's viability.*

  ### Objection #1: The "Parsimony & Formalization" Challenge
  **Constituency:** Behavioral Economists (50% of room)
  **The Question:** "You argue hyperbolic discounting is the *wrong* model, but it generates precise, testable predictions for intertemporal choice with a single parameter ($\beta$). Your 'standing vs. engaged' distinction sounds like a verbal description, not a model. If both frameworks predict the same choice data (e.g., smoking relapse), why should we abandon the parsimonious mathematical model for a metaphysically loaded one that offers no new equations?"

  **The 2-Minute Reply:**
  "I concede that for *aggregate prediction* of choice data, hyperbolic discounting is robust. I am not arguing we discard it for forecasting market behavior. My claim is about *explanatory adequacy* regarding the agent's perspective. Hyperbolic discounting models the agent as rational at every instant; the preference reversal is consistent. But this erases the phenomenon of *regret* during the action.
  In my model, the 'gap' between standing and engaged evaluation predicts *post-action distress* and *self-binding behavior* that standard discounting struggles to capture without ad-hoc additions. If an agent truly prefers B at $t_1$, they shouldn't feel they made a mistake at $t_1$. Akratics do. My framework isn't meant to replace the discount function for pricing bonds; it's meant to explain why agents pay to restrict their own future choice sets in ways the discount model calls 'irrational' but the akrasia model calls 'enforcement of standing judgment.' We need the formalism for prediction, but we need the distinction for intervention design."

  **Where the Reply is Soft:**
  You admitted you lack a competing equation. If they press on how to *quantify* the "gap" without just recreating a discount parameter, you risk sounding like you're doing "science-ish" philosophy.
  **Mitigation:** Point to dual-system literature (System 1/System 2) as a bridge to formalization, but insist the *normative* label matters for treatment.

  ### Objection #2: The "Homunculus" Charge
  **Constituency:** Philosophers of Action / Davidsonians (33% of room)
  **The Question:** "Davidson argued that incontinent action violates the 'Principle of Continence'—you cannot hold an all-things-considered judgment that A is best and intentionally do B without a shift in judgment. By positing 'standing' vs. 'engaged' evaluation, aren't you just reintroducing faculty psychology? You've split the agent into two sub-agents: one that stands back and judges, and one that engages and acts. How is this not a homunculus fallacy?"

  **The 2-Minute Reply:**
  "It's a crucial distinction that I am not positing two *agents*, but two *modes of access* to value. Think of it like peripheral vs. foveal vision. I can judge 'standingly' that health is valuable (foveal), but in the 'engaged' moment of craving, my attention narrows to the immediate relief (peripheral), without me explicitly judging relief > health.
  Davidson assumes judgment must always drive action directly. I'm suggesting attention mediates judgment. The 'engaged' evaluation isn't a new preference; it's the standing evaluation under conditions of narrowed cognitive bandwidth. This avoids the homunculus because there's no little man pulling the lever; there is just a single agent whose access to their own values is context-sensitive. The conflict is real, but it's internal to a single mind, not a battle between two minds."

  **Where the Reply is Soft:**
  Davidsonians are stubborn on the logic of "all-things-considered." If "engaged evaluation" drives the action, they will argue it *was* the all-things-considered judgment at that moment, and you are just playing with words.
  **Mitigation:** Emphasize *phenomenology*. The agent *reports* they didn't change their mind. Trust the report over the logical reconstruction.

  ### Objection #3: The "Clinical Utility" Challenge
  **Constituency:** Clinicians / Addiction Specialists (~17% of room)
  **The Question:** "My patients don't report 'evaluative gaps.' They report that in the moment, the drug *is* the most important thing. Later, they regret it. That sounds exactly like a preference reversal. Why does your distinction matter for treatment? If I tell them 'you didn't actually want that,' does that help recovery more than teaching them to manage discounting?"

  **The 2-Minute Reply:**
  "It matters profoundly for shame and relapse. If we tell patients their preference simply reversed (hyperbolic model), we validate the choice: 'At that moment, you wanted it more.' This reinforces the idea that the craving *was* their true self.
  If we validate the akrasia model—that their standing judgment remained intact but was occluded—we validate the *regret* as accurate data, not just a mood swing. Treatment shifts from 'accepting your impulses' to 'protecting your standing values from attentional capture.' Patients report feeling 'hijacked,' not 'changed.' My model aligns with the phenomenology of hijacking. It allows us to treat the *access* to values (mindfulness, cues) rather than just trying to reshape the *values* themselves."

  **Where the Reply is Soft:**
  Some clinicians are pragmatists. If the behavioral intervention is the same (avoid cues), they may view the theoretical distinction as academic navel-gazing.
  **Mitigation:** Cite specific therapies (e.g., ACT or Mindfulness-Based Relapse Prevention) that rely on the separation of "observing self" (standing) from "experiencing self" (engaged).

  ---

  ## 2. STRATEGIC STANCE

  ### What to Concede Up Front
  *   **Predictive Parity:** Concede that hyperbolic discounting predicts *choice* data as well as, or better than, your current model. Do not fight them on the math of choice.
  *   **Terminology:** Concede that "Standing vs. Engaged" needs further formalization. Acknowledge this is a conceptual paper laying the groundwork for a formal one.

  ### What to Hold Firm
  *   **The Phenomenology:** Do not let them redefine the agent's experience. The agent *feels* conflict, not reversal. This is your empirical anchor.
  *   **Normativity:** Hold that "Rationality" isn't just internal coherence (BE view); it includes fidelity to long-term judgment. Akrasia is a failure of fidelity, not coherence.

  ### The Single Exchange You Must Win
  **The Target:** The Behavioral Economists (Objection #1).
  **Why:** They are half the room. If they dismiss the paper as "unformalized metaphysics," the philosophers will treat it as speculative and the clinicians as irrelevant.
  **The Winning Move:** Shift the goalposts from **Prediction** to **Intervention**.
  *   *Argument:* "If your goal is to predict bond prices, use discounting. If your goal is to stop a suicide attempt or an overdose, you need to know if the agent *endorses* the action. Hyperbolic discounting says yes (at $t_1$). Akrasia says no. That difference determines whether we treat the patient as competent or compromised."
  *   *Goal:* Make them admit that their model has blind spots regarding *agency* that matter for welfare economics.

  ---

  ## 3. THE DREADED QUESTION
  **"The Epiphenomenal Trap"**
  *(Hope nobody asks this, likely from a sharp Davidsonian or a theoretically inclined Clinician)*

  **The Question:** "If 'engaged evaluation' is what actually drives the action, and 'standing evaluation' fails to move the body, in what sense is the standing evaluation *normative*? Isn't it just a ghost? If I define 'preference' as 'what is chosen,' you have no theory left. Why isn't the engaged evaluation just the *real* preference, making your 'standing' evaluation a useless fiction?"

  **Why this kills you:** It collapses your distinction back into revealed preference theory. If standing evaluation doesn't drive action, it's not a preference; it's a wish. If it's just a wish, it's not akrasia; it's just wanting two incompatible things.

  **Emergency Defense:**
  "Because the standing evaluation drives *meta-action*. It drives the call to the sponsor, the locking of the cabinet, the request for commitment devices. It is causally efficacious, just not always *immediately* efficacious on the motor output. It is the planner; engaged is the doer. Both are real parts of the agent."
