      *   **Core Argument:** Hyperbolic discounting involves rational preference reversals (internally coherent at each moment). Akrasia involves evaluative conflict (judging A best now, doing B now, no ranking change). Proposal: Model akrasia as a gap between *standing evaluation* and *engaged evaluation*, not a discount function.
      *   **Audience:** Interdisciplinary seminar.
          *   50% Behavioral Economists (BE): Love hyperbolic discounting, hate "will," want formal models.
          *   33% Philosophers of Action (Davidsonian): Sympathetic to akrasia, hate faculty psychology (homunculi, separate mental agents).
          *   ~17% Clinicians (Addiction): Care about patient reports, think philosophy ignores reality.
      *   **Deliverable:** Q&A Prep Sheet.
      *   **Requirements:**
          *   Objections ordered by damage potential.
          *   Phrased in constituency-specific vocabulary.
          *   Two-minute reply for each.
          *   Note on where the reply is soft/vulnerable.
