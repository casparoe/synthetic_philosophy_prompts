          *   Identify the *one* exchange to win.
          *   Identify the "hope nobody asks" question.

  2.  **Deconstruct the Core Argument & Vulnerabilities:**
      *   *Claim 1:* Hyperbolic discounting $\neq$ Akrasia.
          *   *Vulnerability:* BEs will say hyperbolic discounting *predicts* the behavior, so why complicate it? If the math works, the metaphysics doesn't matter.
      *   *Claim 2:* Akrasia is evaluative conflict (Judgment A > B, Action B).
          *   *Vulnerability:* Davidsonians will ask: How is this possible without irrationality or separate mental parts? If you judge A best, doesn't that *mean* you prefer A? If you choose B, didn't your preference change?
      *   *Claim 3:* Model = Standing vs. Engaged Evaluation.
          *   *Vulnerability:* BEs will say "Show me the equation." Davidsonians will say "This sounds like a homunculus (a little person inside pulling the levers)." Clinicians will say "Does this help me treat the patient?"

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The BE Attack):* "Why complicate the model?"
          *   *Vocab:* Parsimony, predictive power, revealed preference.
          *   *Damage:* High. If the model doesn't predict better, it's useless to them.
          *   *Reply:* Predictive equivalence isn't explanatory equivalence. Hyperbolic discounting misses the *phenomenology* of regret and conflict.
          *   *Soft Spot:* Do I have a formal alternative? If not, they win.

      *   *Objection 2 (The Davidsonian Attack):* "Faculty Psychology/Homunculus."
          *   *Vocab:* All-things-considered judgment, principle of continence, mental anomalism.
          *   *Damage:* High. This attacks the coherence of the theory.
          *   *Reply:* It's not two agents; it's two modes of access to the same values. Attention-mediated, not structural.
          *   *Soft Spot:* Defining "engaged evaluation" without making it a separate desire.

      *   *Objection 3 (The Clinician Attack):* "Does this match the patient experience?"
          *   *Vocab:* Craving, triggers, cognitive dissonance, treatment adherence.
          *   *Damage:* Medium-High. If it doesn't fit reality, it's armchair speculation.
          *   *Reply:* Patients report knowing it's bad *while* doing it. Hyperbolic discounting says they value it more *in the moment*. There's a difference.
          *   *Soft Spot:* Clinicians might say "Semantics don't stop overdoses."

      *   *Ordering by Damage:*
          1.  BEs (The majority, control the "science" status).
          2.  Davidsonians (Control the "philosophical coherence" status).
          3.  Clinicians (Control the "practical relevance" status).
          *Actually, the Davidsonian objection might be more fatal to the *argument* itself, while the BE objection is fatal to the *uptake*. Let's prioritize the BE objection as #1 because they are 50% of the room and demand formalization.*

  4.  **Developing the Strategy (Concede/Hold/Win):**
      *   *Concede:* Hyperbolic discounting is a great *predictive* tool for aggregate behavior. Don't fight the math's utility.
      *   *Hold:* Akrasia is a distinct *phenomenological* and *explanatory* category. Prediction $\neq$ Understanding.
      *   *Win:* The distinction between "valuing B more at t1" (Hyperbolic) vs. "Valuing A more but choosing B" (Akrasia). This is the core thesis.

  5.  **Identifying the "Hope Nobody Asks" Question:**
      *   What kills the "Standing vs. Engaged" model?
      *   Question: "If engaged evaluation drives action, in what sense is it not the *real* evaluation? Are you just renaming 'preference'?"
      *   If "engaged evaluation" is just what you maximize, then standing evaluation is epiphenomenal. This collapses the distinction.

  6.  **Refining the Content (Drafting the Sheet):**
      *   *Tone:* Professional, strategic, sharp.
      *   *Formatting:* Clear headings, bullet points for readability during a talk.
      *   *Time Check:* Ensure replies are ~2 minutes spoken (approx. 250-300 words).

      *(Self-Correction during drafting)*: Make sure the Davidsonian objection uses specific Davidsonian terms (principle of continence, all-things-considered judgment). Make sure the BE objection mentions "revealed preference" and "parsimony."

      *(Refining the "Win" Exchange)*: The crucial win is against the BEs. If they accept that hyperbolic discounting fails to capture the *normative* dimension of akrasia, the philosophers and clinicians will fall in line. If the BEs crush the model as "unformalizable," the paper dies. So the "Must Win" is the Formalization/Parsimony objection.

      *(Refining the "Hope Nobody Asks")*: The "Epiphenomenal Standing Evaluation" question is the strongest philosophical critique. It attacks the utility of the proposed distinction.

