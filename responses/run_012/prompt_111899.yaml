answer: |-
  **Project Title:** The Propositional Bottleneck: Diagnosing the Root of Logical Omniscience

  **1. Research Question**
  The standard problem of logical omniscience (LO) is that standard epistemic logics entail that agents believe all logical consequences of their beliefs. The standard diagnosis is that *possible-worlds semantics* is too coarse-grained. The proposed research asks a more fundamental question: **Does logical omniscience follow necessarily from the assumption that belief is a binary relation between an agent and a *proposition* (Propositionalism), independent of the specific semantic framework used to model those propositions?**

  Most literature treats LO as a bug in *possible-worlds* modeling. This project tests the hypothesis that LO is a bug in *propositionalism* itself. If belief is a relation $B(a, p)$ where $p$ is a proposition (whether possible-worlds sets, structured tuples, or probabilities), and propositions are individuated by truth-conditions or logical equivalence, then closure under logical consequence may be structural rather than contingent. The determinate aim is to prove or disprove: *Any epistemic framework that retains propositionalism as the core attitude structure cannot avoid logical omniscience without ad hoc stipulations that effectively reintroduce non-propositional representations (e.g., syntax, formats, or procedures).*

  **2. Background and Limitations of Existing Approaches**
  Current solutions to LO generally accept the propositional structure $B(a, p)$ and attempt to patch the logic or the ontology.
  *   **Impossible Worlds:** Enrich the ontology with worlds where logical laws fail. *Critique:* This explains why agents miss consequences, but it does not explain *which* consequences are missed. It requires a similarity metric or relevance constraint that usually smuggles in syntactic or cognitive complexity bounds, suggesting the proposition $p$ is not doing the work.
  *   **Awareness/Syntactic Approaches:** Agents are only aware of certain formulas. *Critique:* In CS (e.g., Fagin & Halpern), this works well, but it often abandons pure propositionalism for a relation between agents and *sentences*. If the proposal is that we can keep propositionalism but restrict awareness, we face the question: what is the object of awareness? If it is the proposition, we return to LO. If it is the sentence, we have abandoned propositionalism.
  *   **Resource Bounds:** Agents have limited computational power. *Critique:* This explains *why* an agent doesn't believe $p$, but in a propositional model, if $p$ is logically equivalent to $q$ and the agent believes $q$, the model typically forces $B(a, p)$ regardless of cost, unless the "proposition" is indexed by complexity. But indexing a proposition by complexity changes its identity conditions, effectively turning it into a "presented proposition."

  These approaches treat symptoms. They leave the core question open: Is it possible to retain a clean propositional account of content while blocking omniscience, or is the "format" of the content essential to the attitude?

  **3. Methodology**
  The project will proceed via comparative formal modeling and case analysis over three months.

  *   **Phase 1: Formalizing "Propositionalism."** I will define a minimal constraint, the *Propositional Identity Constraint (PIC)*: If content $c_1$ and $c_2$ are the same proposition (truth-conditionally or structurally equivalent), then for any agent $a$, $B(a, c_1) \iff B(a, c_2)$.
  *   **Phase 2: Stress-Testing Patches.** I will construct three minimal models representing the dominant fixes: (1) An impossible-worlds model, (2) An awareness-based model, and (3) A probabilistic confidence model. I will apply the PIC to each.
  *   **Phase 3: The "Presentation" Counter-Model.** I will sketch a alternative model where the belief relation is ternary: $B(a, p, f)$, where $f$ is a "format" or "file." I will demonstrate that this model blocks LO naturally without ad hoc awareness sets, precisely because $f_1 \neq f_2$ even if $p_1 = p_2$.
  *   **Phase 4: Workshop Case Studies.** I will prepare two concrete cases for discussion:
      1.  *The Cryptographic Case:* An agent has a key and an encrypted message. Propositionally, they possess the plaintext. Intuitively, they do not. I will show how propositional models struggle to represent this without syntactic padding.
      2.  *The Mathematical Case:* An agent understands the axioms of Peano Arithmetic but does not believe Gödel's sentence. I will analyze whether "structured propositions" can distinguish these without collapsing into syntax.

  **4. Success and Failure Conditions**
  *   **Success:** The project succeeds if I can demonstrate that any model satisfying PIC generates LO under plausible inference rules, and that avoiding LO requires violating PIC (i.e., individuating content more finely than truth-conditions or logical equivalence allow). This would support the thesis that we must move from *propositional* attitudes to *presentational* attitudes.
  *   **Failure:** The project fails if:
      1.  I construct a model that satisfies PIC but successfully blocks LO without appealing to syntax, formats, or arbitrary awareness sets. (This would prove propositionalism is viable).
      2.  I discover during the literature review that this specific no-go claim is already a settled theorem in the literature (e.g., in the work of Hintikka, Stalnaker, or the Fagin-Halpern-Moses-Vardi framework). *Honesty Check:* There is significant overlap with the "hyperintensionality" debate and syntactic approaches in AI. The value of this project is not in discovering the distinction, but in rigorously isolating *propositionalism* as the specific failure point across both philosophical and CS frameworks, rather than treating it as merely a "possible worlds" issue. If this turns out to be standard orthodoxy, the output will be a synthesis paper clarifying the dialectic for the workshop.

  **5. Scope and Timeline (3 Months Part-Time)**
  *   **Month 1: Literature & Formalization.** Review existing "fixes" to ensure the PIC definition is robust. Draft the formal definitions of the three patch models.
  *   **Month 2: Modeling & Proofs.** Run the stress tests. Attempt to derive LO from PIC in each model. Draft the "Presentation" counter-model.
  *   **Month 3: Synthesis & Workshop Prep.** Write the position paper (10-15 pages). Prepare the two case studies for group discussion. The goal is not to publish a final theorem, but to present a working argument that structures the workshop debate.

  **6. Relevance to Workshop**
  This topic sits directly at the intersection of the group's interests.
  *   **For Philosophers:** It addresses the nature of content and the Fregean distinction between sense and reference in epistemic contexts.
  *   **For Computer Scientists:** It addresses Knowledge Representation (KR). If propositions are insufficient, what data structures (mental files, symbolic formats) are required for realistic agent modeling?
  By framing LO not as a technical glitch in modal logic but as a category error in how we model content, the proposal invites collaboration on what should replace the propositional relatum, rather than just how to patch it.
