answer: |-
  You have not only identified a genuine philosophical problem, you have independently rediscovered one of the central debates of twentieth-century analytic philosophy. The pattern you are circling is real, it has a name (or rather, a cluster of names), and your intuition that the second case is not simply a confusion is shared by many serious philosophers.

  Here is the breakdown of the territory you have mapped, the established terms for it, and a proposal for how to draw the line you are seeking.

  ### 1. The Established Terminology

  **Case 1: The "Merely Verbal Dispute"**
  The first case (the plant-based burger) is what philosophers call a **merely verbal dispute**. The classic account comes from Rudolf Carnap (1950). In a merely verbal dispute, once the parties clarify their definitions, the disagreement evaporates. There is no residual tension. If you agree that the patty has ingredients $X, Y, Z$ and is cooked via method $A$, and I agree, but I call it a "burger" and you call it a "patty," and we acknowledge that no practical or theoretical consequence hangs on the label, the dispute is dissolved.

  **Case 2: The "Metalinguistic Negotiation"**
  The second case (the religious ritual, the existence of numbers) is what contemporary philosophers (notably David Plunkett, Alexis Burgess, and Timothy Sundell) call a **metalinguistic negotiation**.

  This is the term you are looking for. In a metalinguistic negotiation, the parties *are* disagreeing about words, but they are doing so because the words themselves carry normative weight. They are arguing about **which concept we ought to use** to govern our shared practices.

  When your friend said, "the real question was which of the two uses ought to govern," they were explicitly stating that this was a metalinguistic negotiation. They were not arguing about the physics of the ritual; they were arguing about the *utility, moral significance, or social function* of the concept "ritual."

  ### 2. Is the "Something is Lost" Claim Legitimate?

  You asked: *Is the thought that something is lost when one side's vocabulary is translated into the other's a legitimate idea or a confusion?*

  It is a legitimate idea. In philosophy of language, this is often discussed under the heading of **Expressive Power** or **Ideology** (in the technical sense used by W.V.O. Quine).

  Two languages (or conceptual schemes) can be *extensionally equivalent* (they pick out the same objects in the world) but differ in *ideology* (the primitive concepts they use to do the picking).

  *   **Example:** Imagine a language that has a specific word for "the feeling of sadness specifically caused by rain." Another language lacks this word and must say "sadness caused by rain."
  *   **The Loss:** The first language makes that specific distinction *salient*. It invites speakers to notice that specific feeling. The second language allows you to describe it, but does not highlight it.

  In your "religious ritual" case, your friend likely believes that the concept "ritual" captures a normative or phenomenological reality (a binding social obligation, a sacred intent) that a purely behavioral description ("people gathering and singing") fails to capture *efficiently* or *respectfully*. They argue that translating their view into your vocabulary requires a circumlocution that loses the *point* of the practice, even if it captures the *facts*.

  So, the claim is not a confusion. It is a claim about **Conceptual Salience**. One vocabulary may carve the world in a way that is more useful, more moral, or more truthful to human experience, even if both vocabularies cover the same physical facts.

  ### 3. Drawing the Boundary: When is "It's Verbal" a Dodge?

  You asked for a mark of the boundary between Case 1 (where "we mean different things" ends the argument) and Case 2 (where it does not).

  Here is a three-part test to distinguish a **Merely Verbal Dispute** from a **Metalinguistic Negotiation**.

  **Criterion 1: Translatability without Loss**
  *   **Merely Verbal:** I can translate everything you say into my vocabulary without losing any nuance, emphasis, or utility. (e.g., You say "burger," I say "plant-patty," we both know exactly what is on the plate).
  *   **Metalinguistic:** Translation is "lossy." To say what you mean in my terms requires long explanations that miss the immediate recognition or normative force your term provides. (e.g., Translating "ritual" into "repeated behavioral pattern" loses the sense of sacred obligation).

  **Criterion 2: Normative Stakes**
  *   **Merely Verbal:** Neither side thinks the *choice of word* changes how we should act in the future, other than labeling.
  *   **Metalinguistic:** The choice of word *dictates* future action or judgment. If we call it a "ritual," we grant tax exemption and respect. If we call it a "meeting," we do not. The dispute is about the *consequences of the classification*, not the facts of the classified object.

  **Criterion 3: The "Dodge" Test**
  *   **Merely Verbal:** If I say, "Ah, you use the word differently," you feel relieved. The tension releases.
  *   **Metalinguistic:** If I say, "Ah, you use the word differently," you feel frustrated. You feel I am ignoring the *importance* of your usage. You want to persuade me to *adopt* your usage, not just acknowledge it.

  ### 4. Cases on Each Side of the Line

  To solidify this, here are two pairs of examples that mirror your experience.

  **Side A: Merely Verbal (The "Burger" Case)**
  *   **Dispute:** "Is a tomato a fruit or a vegetable?"
  *   **Facts:** Both agree on the biology (ovary of a flower, seeds inside) and the culinary use (salads, savory dishes).
  *   **Resolution:** One admits, "Biologically it's a fruit; culinarily it's a vegetable."
  *   **Why it stops:** There is no normative stake. Calling it a fruit does not change the tax rate, the moral status, or the recipe. Once the definitions are aligned, the argument is dead.

  **Side B: Metalinguistic Negotiation (The "Ritual" Case)**
  *   **Dispute:** "Is this interrogation technique 'torture'?"
  *   **Facts:** Both agree on the physical acts (sleep deprivation, loud noise, stress positions). Both agree on the physiological effects on the detainee.
  *   **Resolution:** Impossible by facts alone.
  *   **Why it continues:** One side insists on the word "torture" because it triggers a moral prohibition and legal ban. The other side insists on "enhanced interrogation" because they believe the moral prohibition is misplaced for this context.
  *   **The "Something Lost":** If the second side translates "torture" into "enhanced interrogation," the first side claims a moral reality has been erased. The vocabulary itself is the battlefield. To say "we just mean different things" is a dodge, because the goal is to settle *which meaning the law and society will adopt*.

  ### 5. What Should You Call It?

  If you need a single label to use in your arguments that distinguishes this from a trivial verbal dispute, I recommend **"Substantive Conceptual Dispute."**

  *   **Verbal Dispute:** We disagree about the label.
  *   **Factual Dispute:** We disagree about the world.
  *   **Substantive Conceptual Dispute:** We agree about the world and the label's definition, but we disagree about **which conceptual framework should govern our shared life.**

  ### Summary

  You are not confused. You have encountered the limit of the "verbal dispute" diagnosis.
  1.  **Case 1** is a **Merely Verbal Dispute**. The "different meanings" reply works here.
  2.  **Case 2** is a **Metalinguistic Negotiation** (or Substantive Conceptual Dispute). The "different meanings" reply fails here because the dispute is about *which meaning we should adopt*.
  3.  **The "Something Lost"** is real. It is a loss of **Expressive Power** or **Normative Salience**. Some vocabularies allow us to see and value things that others render invisible.
  4.  **The Boundary** is marked by **Normative Stakes**. If the choice of words changes how we ought to act or value the world, it is not merely verbal.

  When your friend says you are "dodging" by calling it verbal, they are right in the second case. You are treating a negotiation over values as a confusion over definitions. The argument isn't about what *is*; it's about how we *speak*, because how we speak determines what we *value*.
