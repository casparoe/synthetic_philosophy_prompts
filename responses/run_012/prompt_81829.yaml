  # DECISION TREE: ONTOLOGICAL POSITIONS ON PSYCHIATRIC CATEGORIES
  ### (Given the Concession of Looping Effects)

  **Starting Commitment:** You accept that psychiatric classification is not passive. The classified population, their self-descriptions, and the criteria themselves can shift in response to the fact of being classified (looping effects). The question is not *if* looping occurs, but what its existence implies about the reality of the category.

  **Instructions:** Begin at **Node 1**. Answer the question based on your view of the category in question. Follow the branch to the next Node or to a Final Position (Leaf).

  ---

  ### NODE 1: The Performative Mode & The Control
  **Question:** Compare the category to an indifferent-kind control (e.g., **Leukemia**), where classification does not alter the biological substrate. Does the movement under classification obscure a dysfunction fixed independently of the classification, or is the movement ontologically decisive?

  *   **A. A fixed dysfunction remains underneath (Looping is noise).**
      *   $\rightarrow$ **GO TO LEAF 1**
  *   **B. The movement is ontologically decisive (No fixed substrate).**
      *   $\rightarrow$ **GO TO NODE 2**

  *(Example Case: **Cross-cultural variability of depression**. If you view cultural differences as noise masking a universal dysfunction, choose A. If you view them as fundamental to the kind, choose B.)*

  ---

  ### NODE 2: The Threat of Instability
  **Question:** Regarding **performative looping** (where the label induces symptoms): Does this instability demonstrate that there is no stable kind there to track?

  *   **A. Yes (The target moves too much to be real).**
      *   $\rightarrow$ **GO TO LEAF 2**
  *   **B. No (The kind is stable enough or real in a different way).**
      *   $\rightarrow$ **GO TO NODE 3**

  *(Example Case: **The rise and fall of multiple personality**. If you view this history as proof the category was a transient artifact, choose A.)*

  ---

  ### NODE 3: The Apparatus Mode
  **Question:** Is the category primarily an administrative instrument for resource allocation and recording, such that its reality is exhausted by its institutional utility?

  *   **A. Yes (Utility > Truth).**
      *   $\rightarrow$ **GO TO LEAF 3**
  *   **B. No (It tracks a structure beyond administration).**
      *   $\rightarrow$ **GO TO NODE 4**

  *(Example Case: **Apparatus-driven drift**. If changes in funding or diagnostic codes are the only "reality" that matters, choose A.)*

  ---

  ### NODE 4: Internal Causal Structure
  **Question:** Does the coherence of the category depend on causal relations among the symptoms themselves, independent of the classification label?

  *   **A. Yes (Symptoms cause symptoms).**
      *   $\rightarrow$ **GO TO LEAF 4**
  *   **B. No (The classification is part of the causal structure).**
      *   $\rightarrow$ **GO TO NODE 5**

  ---

  ### NODE 5: Feedback Stabilization
  **Question:** Is the feedback loop of classification itself a mechanism that entrenches a real causal structure, primarily driven by institutional reinforcement?

  *   **A. Yes (The loop makes it real).**
      *   $\rightarrow$ **GO TO LEAF 5**
  *   **B. No (The reality depends on meaning/authority, not just causal feedback).**
      *   $\rightarrow$ **GO TO NODE 6**

  ---

  ### NODE 6: Semantic Drift & Community
  **Question:** Regarding **semantic drift** (where the community revises criteria): Is the classified community the primary driver of this drift?

  *   **A. No (Drift is expert-driven or spontaneous).**
      *   $\rightarrow$ **GO TO LEAF 6 (UNOCCUPIED)**
  *   **B. Yes (The community drives the meaning).**
      *   $\rightarrow$ **GO TO NODE 7**

  *(Example Case: **Anorexia as a culture-bound syndrome**. If you believe the syndrome exists but is shaped by experts/media rather than the sufferers redefining it, choose A.)*

  ---

  ### NODE 7: The Status of Self-Understanding
  **Question:** When the community revises the criteria, are they *constituting* the kind (making it what it is), or claiming *standing* to define a kind that exists in interaction with them?

  *   **A. Constituting (The kind *is* the interaction).**
      *   $\rightarrow$ **GO TO LEAF 7**
  *   **B. Claiming Standing (The kind exists, but they have authority).**
      *   $\rightarrow$ **GO TO LEAF 8**

  *(Example Cases: **The reframing of autism by autistic self-advocates** (A) vs. **The declassification of homosexuality** (B).)*

  ---

  ## FINAL POSITIONS (LEAVES)

  **LEAF 1: Essentialist Realism**
  *   **Commitment:** The category tracks a dysfunction fixed independently of the classification.
  *   **Awkward Consequence:** You must treat the lived experience of the classified moving under the label as measurement error or noise rather than data.

  **LEAF 2: Constructivism / Eliminativism**
  *   **Commitment:** Looping is a defect, and the moving target shows there is no kind there to track.
  *   **Awkward Consequence:** You must deny the reality of suffering that organizes itself around the label, treating it as purely ephemeral.

  **LEAF 3: Pragmatic Instrumentalism**
  *   **Commitment:** The category is an administrative instrument that need not track anything.
  *   **Awkward Consequence:** You cannot object to a diagnosis on the grounds that it is "false," only that it is "useless" or "harmful."

  **LEAF 4: Symptom-Network Realism**
  *   **Commitment:** The category is real without any essence, because the symptoms cause one another.
  *   **Awkward Consequence:** You must explain why the network clusters under specific labels without appealing to a common underlying cause.

  **LEAF 5: Feedback-Stabilized Realism**
  *   **Commitment:** Looping is a mechanism like any other, and a self-sustaining one, so the feedback entrenches a real causal structure.
  *   **Awkward Consequence:** You must grant ontological reality to conditions that might vanish if the institutional feedback loop were discontinued.

  **LEAF 6: Expert-Driven Interactive Realism (UNOCCUPIED)**
  *   **Commitment:** The category is interactive and real, but the classified community has no role in defining it.
  *   **Diagnosis:** **Incoherent.** If the kind is interactive but the subjects do not drive the semantics and institutions do not stabilize it (Node 5), there is no agent left to sustain the interaction.

  **LEAF 7: Dynamic Nominalism**
  *   **Commitment:** The category is a real kind but a distinctively interactive one, whose members' self-understanding is part of what the kind is.
  *   **Awkward Consequence:** You cannot separate the "person" from the "kind," as the act of classification changes the person being classified.

  **LEAF 8: First-Person Realism**
  *   **Commitment:** The category is authorized in part by the community it classifies, so the classified have standing to say what the kind is.
  *   **Awkward Consequence:** You must accept that a category may remain "real" even if the community rejects the label, provided they retain the standing to redefine it.
