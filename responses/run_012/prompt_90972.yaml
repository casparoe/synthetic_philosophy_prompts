  *(Self-Correction during drafting)*: Wait, regarding the "community" bit. Putnam *does* talk about the division of linguistic labor in "The Meaning of 'Meaning'". So it's not *entirely* wrong to associate Putnam with community. However, the Twin Earth argument *specifically* relies on the difference in the *physical environment* (H2O vs XYZ), not the difference in the community (Oscar and Twin Oscar have parallel communities). The flatmate says "you mean whatever the people around you mean, which is why the whole argument is really a social theory." This implies Twin Earth proves social externalism. It proves environmental externalism. The Division of Labor is a separate (though related) point in the same paper. I need to make this distinction clear. The flatmate is conflating the two arguments in the same paper, or conflating Putnam with Burge. I will lean towards the distinction between Environmental vs. Social Externalism to be precise.

