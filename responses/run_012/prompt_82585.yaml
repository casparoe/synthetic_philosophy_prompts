          2.  Disagreements Table (each side's formulation, acceptable to their own side).
          3.  Crux Section (sub-questions, concrete cases/arguments bearing on them, pre-recorded predictions).
          4.  Stipulated Case & Taxonomy (Agent M, Consideration C, Action $\phi$, 4 Motivational Profiles). Analysis of each profile (Reason existence? Truth value? Function?). Predictions of concession.
          5.  Advice Test Section (What an advisor must say in each profile for sincerity/correctness/action-guidance).
          6.  "Fully Rational" Clause Analysis (Normative vs. Procedural work; Externalist explanatory force).
          7.  Candid Conclusion (What would change minds, limitations of the document).
      *   **Constraints:** No citations/bibliography. Stand-alone argument. Tone must be collaborative but precise (philosophical joint statement).

  2.  **Deconstruct the Philosophical Positions:**
      *   **Internalist (Williams-style):** "A has a reason to $\phi$" implies "A could reach a motivation to $\phi$ via sound deliberation from their existing subjective motivational set (S)." If no link to motivation is possible, the reason claim is false or meaningless.
      *   **Externalist (McDowell/Nagel-style):** "A has a reason to $\phi$" is true if there is a normative fact supporting $\phi$, regardless of A's psychology. Motivation is a separate issue (internalism about *judgment* vs. *reasons*).

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal and collaborative. "Joint Statement on the Nature of Normative Reasons."
      *   **Preamble:** Acknowledge the collaboration, the good faith, and the persistence of disagreement.

      *   **Section 1: Agreed Claims:**
          *   Need common ground. Both agree reasons are normative. Both agree reason-talk guides action. Both agree the amoralist is a conceptual possibility (though they disagree on whether the amoralist *has* reasons). Both agree "fully rational" is an idealization. Both agree some disagreements are substantive, not just verbal.
          *   *Drafting thought:* Ensure the language doesn't secretly favor one side. Use neutral terms like "normative force" rather than "psychological grip."

      *   **Section 2: Disagreements Table:**
          *   Need to state the core divergence clearly.
          *   Internalist: Reason claims entail motivational accessibility.
          *   Externalist: Reason claims assert normative relations independent of accessibility.
          *   *Constraint:* Wording must be acceptable to the signer.

      *   **Section 3: The Stipulated Case (Agent M):**
          *   This is the core "weeds" section.
          *   *Profile 1 (Occurrently motivated):* Easy agreement. Both say "Yes, reason exists."
          *   *Profile 2 (Disposed via deliberation):* Internalist says "Yes." Externalist says "Yes." (This is the overlap zone).
          *   *Profile 3 (External intervention needed):* Internalist says "No" (deliberative route blocked). Externalist says "Yes" (normative fact remains).
          *   *Profile 4 (Impossible to motivate):* Internalist says "No/False." Externalist says "Yes/True."
          *   *Function of statement:* Internalist: Describing psychological potential. Externalist: Stating a normative fact.
          *   *Predictions:* Internalist predicts Externalist will concede Profile 4 is practically useless. Externalist predicts Internalist will concede Profile 4 is conceptually coherent.

      *   **Section 4: The Advice Test:**
          *   What can an advisor say?
          *   Internalist: "If you deliberated, you would want to."
          *   Externalist: "You ought to, regardless of want."
          *   Agreement: Advice must be intelligible. Disagreement: Conditions for *correctness*.

      *   **Section 5: "Fully Rational" & Explanatory Force:**
          *   Internalist: "Fully rational" is procedural (sound deliberation).
          *   Externalist: Worries this is circular or lacks normative oomph.
          *   Externalist: Needs to explain why reasons *matter* if not tied to motivation.
          *   Internalist: Worries Externalism makes reasons inert.

      *   **Section 6: Cruxes:**
          *   Need specific sub-questions.
          *   Crux 1: The status of the "Incurable Amoralist" (Profile 4).
          *   Crux 2: The meaning of "Ought implies Can" (motivational can vs. physical can).
          *   Crux 3: The nature of deliberation (discovery vs. construction).
          *   *Predictions:* Record what each thinks the resolution would look like.

      *   **Section 7: Candid Conclusion:**
          *   What changes minds?
          *   Internalist: A case where normative truth clearly outstrips psychology without losing action-guidance.
          *   Externalist: A proof that reason claims without motivational hooks are semantically empty.
          *   Limitations: We might be talking past each other on "reason."

  4.  **Refining and Polishing:**
      *   *Tone Check:* Is it too adversarial? No, it needs to sound like a joint document. Use "We agree," "We note," "The Internalist maintains," "The Externalist maintains."
      *   *Constraint Check:* Did I use the specific M/C/$\phi$ taxonomy? Yes. Did I include the 4 profiles? Yes. Did I avoid citations? Yes.
      *   *Philosophical Nuance:* Ensure the Internalist isn't a crude Humean (allow for "appropriate deliberative conditions") and the Externalist isn't a Platonist detached from agency (acknowledge action-guidance).
      *   *Specific Instruction:* "Ask the internalist and the externalist to say, for each profile, whether M has a reason to $\phi$..." -> Make sure this is a table or clear list.
      *   *Specific Instruction:* "Predictions recorded in advance." -> Add a column or section for this.

  5.  **Self-Correction during Drafting:**
      *   *Initial thought:* Maybe make them agree on more.
      *   *Correction:* No, the prompt asks for a record of disagreement too. The value is in mapping the dispute, not dissolving it falsely.
      *   *Check:* Did I address the "Advice Test" specifically for *each* profile? I should ensure that's clear.
      *   *Check:* The "Fully Rational" section needs to address whether it's normative or procedural.
      *   *Check:* The "Candid Section" needs to admit where the document might be "tendentious."

  6.  **Final Review against Prompt:**
      *   Numbered agreed claims? Yes.
      *   Disagreements table? Yes.
      *   Crux section with sub-questions and concrete cases? Yes.
      *   Stipulated Case (M, C, $\phi$, 4 profiles) with analysis? Yes.
      *   Advice Test section? Yes.
      *   "Fully Rational" analysis? Yes.
      *   Candid conclusion (change of mind + limitations)? Yes.
      *   No citations? Yes.

  7.  **Final Polish:** Ensure the distinction between Profile 2 (Deliberation) and Profile 3 (Intervention) is sharp, as that's a key battleground for Internalism (Williams' "sound deliberative route"). Profile 3 is usually where Internalists draw the line (external manipulation breaks the internal link).

  *(Self-Correction on Profile 3)*: A strict Williams-internalist might say Profile 3 is *not* a reason because the route isn't deliberative. A softer internalist might allow it. The prompt says "committed reasons internalist... tied to... appropriate deliberative condition." So Profile 3 (pill/threat) is likely a "No" for the Internalist, as it bypasses deliberation. Profile 4 is definitely a "No."

