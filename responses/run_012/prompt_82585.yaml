answer: |-
  # JOINT STATEMENT ON THE NATURE OF NORMATIVE REASONS
  **Signed by the Committed Reasons Internalist and the Committed Reasons Externalist**
  **Date:** October 26, 2023

  ## PREAMBLE
  We, the undersigned, have engaged in a sustained adversarial collaboration regarding the metaphysics and semantics of normative reasons. Our starting positions were diametrically opposed. The Internalist holds that a reason statement ("A has a reason to $\phi$") is conceptually tied to the agent's motivational architecture. The Externalist holds that reason statements report normative facts independent of the agent's psychology.

  This document does not record a synthesis. Rather, it maps the precise geometry of our agreement and disagreement. We have forced our dispute into the weeds using a stipulated taxonomy to prevent verbal evasion. We sign this not because we have converged, but because we now understand exactly where and why we diverge.

  ---

  ## SECTION 1: AGREED CLAIMS
  *We jointly affirm the following numbered claims as the common ground of our collaboration.*

  1.  **Normativity:** Reason statements are inherently normative. They are not merely reports of statistical regularities or sociological pressures. To say "A has a reason to $\phi$" is to claim that $\phi$-ing is supported by considerations that count in favor of the action.
  2.  **Action-Guidance:** Reason-talk serves an action-guiding function. A theory of reasons that renders reason statements incapable of guiding action (even in principle) is deficient. However, we disagree on the mechanism of this guidance (see Section 5).
  3.  **The Amoralist:** We agree that the "amoralist" (an agent who makes moral judgments without motivation) is a conceptual possibility in the sense that such a person can exist without logical contradiction. We disagree on whether the amoralist *has* reasons for the actions they judge correctly.
  4.  **Fully Rational Agent:** We agree that the concept of a "fully rational agent" is an idealization used to test reason claims. We disagree on whether this idealization is procedural (defined by the absence of deliberative error) or substantive (defined by alignment with normative truth).
  5.  **Substantive Disagreement:** We agree that our disagreement is not merely verbal. We are not using the word "reason" to mean entirely different things such that we could both be right. We are making competing claims about the same phenomenon: the relationship between normative truth and human agency.
  6.  **Truth Conditions:** We agree that reason statements have truth conditions. They are not merely expressions of emotion or commands. We disagree on what facts satisfy those conditions.

  ---

  ## SECTION 2: DISAGREEMENTS TABLE
  *The following formulations capture the core divergence. Each side certifies that the row assigned to them accurately reflects their committed position.*

  | Feature | The Internalist Formulation | The Externalist Formulation |
  | :--- | :--- | :--- |
  | **Truth Maker** | A reason statement is true only if there exists a "sound deliberative route" from the agent's current subjective motivational set (S) to a motivation to $\phi$. | A reason statement is true if there exists a normative fact supporting $\phi$, regardless of the agent's subjective motivational set (S). |
  | **Motivation** | Motivation is constitutive of reasons. If motivation is impossible (even under ideal deliberation), the reason does not exist. | Motivation is a consequent of reasons. If a reason exists, motivation *should* follow, but its absence does not negate the reason. |
  | **Error Theory** | If the Externalist is right, most ordinary reason claims are false or misleading because they imply a motivational link that doesn't exist. | If the Internalist is right, we lack the vocabulary to criticize agents who are deliberatively sound but morally monstrous (e.g., the happy psychopath). |
  | **Semantics** | "Has a reason" implies "Could be motivated." This is an analytic or conceptual truth. | "Has a reason" implies "Ought to $\phi$." The link to "Could be motivated" is synthetic and contingent. |

  ---

  ## SECTION 3: THE STIPULATED CASE AND TAXONOMY
  *To force precision, we analyzed Agent M, who recognizes consideration C as counting in favor of action $\phi$. We distinguished four motivational profiles.*

  ### The Profiles
  1.  **Profile 1 (Occurrent):** M is occurrently motivated to $\phi$ by C.
  2.  **Profile 2 (Deliberative):** M is not occurrently motivated, but would become motivated by ordinary deliberation that adds no new non-normative information.
  3.  **Profile 3 (Intervention):** M is not motivated and would not be moved by deliberation, but could be brought to care by external intervention (pill, novel, threat) that does not change what C is.
  4.  **Profile 4 (Incurable):** M is not motivated and cannot be brought to care by any intervention, though M continues to recognize C intellectually.

  ### Joint Analysis of Profiles
  *For each profile, we record our respective judgments on whether M has a reason, the truth value of the statement "M has a reason to $\phi$," and the function of that statement.*

  | Profile | Internalist Judgment | Externalist Judgment |
  | :--- | :--- | :--- |
  | **1. Occurrent** | **Reason Exists.** Statement is **True**. Function: Reports a psychological/normative alignment. | **Reason Exists.** Statement is **True**. Function: Reports a normative fact that is currently motivating. |
  | **2. Deliberative** | **Reason Exists.** Statement is **True**. Function: Reports a dispositional fact about the agent's rational potential. | **Reason Exists.** Statement is **True**. Function: Reports a normative fact that the agent is capable of recognizing. |
  | **3. Intervention** | **No Reason.** Statement is **False**. Function: Utterance is a category mistake; it confuses causal manipulation with rational deliberation. | **Reason Exists.** Statement is **True**. Function: Reports a normative fact that the agent is currently failing to grasp due to corrigible defect. |
  | **4. Incurable** | **No Reason.** Statement is **False**. Function: Utterance is false. At best, it means "Others have reasons to stop M." | **Reason Exists.** Statement is **True**. Function: Reports a normative fact that stands in judgment over the agent's incorrigible psychology. |

  ### Predictions of Concession
  *   **Internalist Prediction:** We predict the Externalist will concede that in Profile 4, the reason statement loses its *action-guiding* force. If M cannot be moved, calling it a "reason for M" is practically inert and perhaps misleading.
  *   **Externalist Prediction:** We predict the Internalist will concede that in Profile 4, the Internalist must resort to an error theory about our ordinary moral language. We ordinary speakers say the incurable psychopath has a reason not to kill, even if they can't be motivated. The Internalist must call this ordinary speech false.

  ---

  ## SECTION 4: THE ADVICE TEST
  *We agreed to test our positions against the pragmatics of advice. An advisor speaks to M in each profile. For the advice to be sincere, correct, and action-guiding, what must the advisor be able to say?*

  | Profile | Internalist Requirement for Correct Advice | Externalist Requirement for Correct Advice |
  | :--- | :--- | :--- |
  | **1 & 2** | Advisor says: "If you deliberate, you will see you want to $\phi$." This is sincere because the link exists. | Advisor says: "You ought to $\phi$." This is correct because the norm exists, and action-guiding because M is responsive. |
  | **3** | Advisor **cannot** give correct advice to M to $\phi$. Advisor must instead advise *others* to intervene on M. To tell M "You have a reason" is to lie. | Advisor says: "You ought to $\phi$, and your current inability to care is a defect we can fix." This is correct (normative fact) and action-guiding (points to intervention). |
  | **4** | Advisor **cannot** address M regarding reasons to $\phi$. Advisor can only say: "You are dangerous." To say "You have a reason" is nonsense. | Advisor says: "You ought to $\phi$, even though you will not." This is correct (normative fact) but admits failure of action-guidance *for M*. |

  **Agreement on Advice:** We agree that in Profile 4, the Internalist's advice is more pragmatically honest (admitting the breakdown of agency), while the Externalist's advice preserves the normative standard but risks emptiness. We disagree on whether "emptiness" falsifies the reason claim.

  ---

  ## SECTION 5: "FULLY RATIONAL" AND EXPLANATORY FORCE
  *We examined the theoretical work done by our respective core concepts.*

  ### 1. The Internalist's "Fully Rational" Clause
  *   **The Charge:** The Externalist charges that the Internalist's "fully rational agent" is doing merely procedural work (no logical errors, full information) and lacks normative force. Why should M care about being "fully rational" in the Internalist sense?
  *   **Internalist Defense:** "Fully rational" is not a neutral procedure. It describes the agent's own commitments extended over time. The normative force comes from *internal consistency*. If M rejects the output of sound deliberation, M is violating their own deeper commitments.
  *   **Agreement:** We agree that if "fully rational" is purely procedural, it cannot ground robust moral obligations. The Internalist accepts this limitation: reasons are relative to the Subjective Motivational Set (S).

  ### 2. The Externalist's Explanatory Force
  *   **The Charge:** The Internalist charges that the Externalist offers a "mere list of normative truths." If reasons exist independently of motivation, what explains their *force*? Why are they reasons *for agents* rather than just Platonic facts?
  *   **Externalist Defense:** Normative facts are sui generis. Their force is not explained by psychology but by their authority. To ask "Why should I care about a reason?" is to ask for a reason outside the space of reasons.
  *   **Agreement:** We agree that the Externalist must explain how a fact independent of psychology can bind a psychological being without collapsing into mysticism. The Internalist must explain how a fact dependent on psychology can bind an agent who lacks the relevant psychology.

  ---

  ## SECTION 6: CRUXES
  *We identified three specific sub-questions (Cruxes) where settlement would move at least one side. For each, we recorded a concrete case and our pre-recorded predictions.*

  ### Crux 1: The Status of the Incurable Psychopath (Profile 4)
  *   **Sub-Question:** Is it a conceptual truth that an agent who *cannot* be motivated to $\phi$ (even by ideal intervention) lacks a reason to $\phi$?
  *   **Concrete Case:** A agent, M, is neurologically incapable of caring about the suffering of others (Profile 4). M recognizes "suffering" as a concept but feels no pull. M tortures for fun. Does M have a reason to stop?
  *   **Internalist Prediction:** If the Externalist concedes that "reason" in this case is disconnected from *M's* agency and functions only as a judgment *on* M, the Internalist will accept a hybrid view for moral reasons specifically.
  *   **Externalist Prediction:** If the Internalist concedes that we can meaningfully say "M should stop" without implying "M could be motivated," the Internalist will abandon the strict motivational constraint.

  ### Crux 2: The Scope of "Deliberation"
  *   **Sub-Question:** Can "deliberation" include imaginative expansion (e.g., reading a novel, undergoing therapy) that changes the *content* of S, or is it limited to instrumental reasoning from existing S?
  *   **Concrete Case:** M does not care about art. M reads a novel (Profile 3 intervention) and comes to care. Was this a "sound deliberative route" or an external causal intervention?
  *   **Internalist Prediction:** If the Externalist agrees that some changes to S are "rational growth" rather than "causal manipulation," we can narrow the gap on Profile 3.
  *   **Externalist Prediction:** If the Internalist admits that "rational growth" can create reasons that did not exist before (by changing S), they concede that reasons are not strictly grounded in the *prior* S, weakening Internalism.

  ### Crux 3: "Ought Implies Can"
  *   **Sub-Question:** Does "Ought implies Can" apply to motivational capacity?
  *   **Concrete Case:** M physically can $\phi$, but psychologically cannot bring themselves to $\phi$ (Profile 4).
  *   **Internalist Prediction:** If the Externalist denies that psychological impossibility negates "Ought," they must explain the utility of the "Ought."
  *   **Externalist Prediction:** If the Internalist affirms that psychological impossibility negates "Ought," they must explain how moral progress is possible (since progress often requires doing what we currently feel we cannot).

  ---

  ## SECTION 7: CANDID CONCLUSION
  *In this final section, we step out of our joint persona to state individually what would falsify our positions and where this document may be unstable.*

  ### What Would Change Our Minds
  *   **The Internalist:** I would abandon my position if presented with a case where an agent is motivationally incurable (Profile 4), yet we universally and confidently assert they have a reason to act, *and* this assertion proves indispensable for social practices (blame, punishment, reconciliation) in a way that an error-theory cannot sustain. If the "normative fact" is required to make sense of blame, I must concede.
  *   **The Externalist:** I would abandon my position if it were demonstrated that reason statements without a motivational hook are semantically incomplete—i.e., if it were shown that "M has a reason" literally means nothing to a listener who knows M cannot be motivated. If the link to motivation is a precondition for the *intelligibility* of the sentence, not just its utility, I must concede.

  ### Limitations and Instabilities
  *   **Verbal Slippage:** We suspect we may have papered over a disagreement on the word "motivation." The Internalist often means "disposition to act," while the Externalist sometimes hears "occurrent desire." We have tried to standardize this in the Taxonomy (Section 3), but ambiguity may remain in Profile 3.
  *   **The "Normative" Definition:** In Section 1, Claim 1, we agreed reasons are "normative." The Internalist likely means "normative relative to S," while the Externalist means "normative simpliciter." This document treats this as a substantive disagreement, but it risks being a definitional stalemate.
  *   **Profile 3 Boundary:** We are least stable on Profile 3 (Intervention). The line between "deliberation that expands S" and "external intervention that changes S" is porous. A novel (intervention) might be required for sound deliberation. We predict this is where future collaboration will focus.

  **Signed,**

  *The Committed Reasons Internalist*

  *The Committed Reasons Externalist*
