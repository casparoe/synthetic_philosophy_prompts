  I'm in a Buddhist ethics course and we have to post our own position for the seminar to poke at, so I want a consistency check before I commit to it. Here's where I've landed: (1) karma is a causal law rather than a cosmic ledger — nobody's keeping score, it's just that intentional actions shape your character and what you later experience; (2) what makes an action bad kammically is the state of mind behind it, not the harm it does, i.e. intention is the kamma; (3) the precepts arn't absolute commands, but I don't think "it turned out for the best" is ever on its own a good reason to break one; (4) all the same, I think the boat captain story — he kills the one guy who was about to kill the five hundred passengers, and the tradition calls it skillful means — comes out fine, and I'd defend it; (5) there's no self, just a causal stream; (6) compassion has to be impartial, so you should be willing to give up your own liberation for others, and I like the idea that you can dedicate your merit to them; (7) I'm not a consquentialist — it can't make sense of the precepts, or of why motive is the whole story.

  Which of these actually pull against each other, and how badly? I have a hunch (5) is a red herring with respect to (1) and (6), but tell me if I'm wrong about that. Rank the real tensions by severity, say what has to give in each, and tell me which single change would clean up the most.
