answer: |-
  Here is the comparison, the stress-test against your cases, and the verdict.

  ### 1. The Future Contingent Test (The Coin & The Job)

  This is the sharpest wedge between the three pictures. You have a fair coin, not yet tossed.
  *   **Indicative:** "If it lands heads, I win."
  *   **Counterfactual (Subjunctive form):** "If it landed heads, I'd win."

  **Picture 1 (Worlds/Semantic):** This picture struggles here. Standard semantics ties the counterfactual to a similarity ordering that usually presupposes the antecedent is false or fixed in the past. If the coin hasn't landed, there is no "actual fact" for the antecedent to be remote from. The "closest heads-world" and "closest tails-world" are equidistant from actuality. Picture 1 has to invoke awkward machinery (e.g., temporal branching or "metaphysical openness") to explain why the morphology shifts if the metaphysical distance hasn't opened up yet. It predicts the two should be interchangeable, but they aren't.

  **Picture 2 (Credence/Suppositional):** This picture also stumbles. It says the counterfactual flags the antecedent as "supposed false." But you don't believe the coin will land tails. You assign it 50/50. Using the counterfactual form would be a lie about your credence. Picture 2 cannot explain why a rational agent with 0.5 credence would choose the "false supposition" morphology over the "open supposition" morphology.

  **Picture 3 (Common Ground):** This picture handles the case naturally. The distinction isn't about the world's metaphysics or your private credences; it's about the *conversational status* of the antecedent.
  *   **Indicative:** Proposes adding "it lands heads" to the set of live possibilities we are planning for. It treats the outcome as a branch of the *actual* future.
  *   **Counterfactual:** Proposes considering "it lands heads" as a deviation from the expected or default course. It treats the outcome as a *hypothetical* scenario, distinct from the projected actuality.
  *   **Result:** You use the indicative when you are betting or planning (integrating the possibility into the common ground). You use the counterfactual when you are speculating or distancing yourself from the outcome (keeping it outside the common ground). The morphology tracks *conversational attitude*, not metaphysical distance.

  ### 2. The Assertion Tension Test

  Why can't we happily assert the indicative and counterfactual twins simultaneously? (e.g., "If Oswald didn't kill Kennedy, someone else did" AND "If Oswald hadn't killed Kennedy, someone else would have"). Or, in your future case: "If I get the job, I'll move" AND "If I got the job, I'd move."

  **Picture 1 (Worlds):** This picture actually *fails* to explain the tension without help. Semantically, both conditionals can be true at once. The indicative quantifies over epistemically open worlds (where ~Oswald implies conspiracy); the counterfactual quantifies over metaphysically close worlds (where ~Oswald implies no conspiracy). Since the truth conditions are compatible, Picture 1 must treat the inability to assert both as an external pragmatic datum, not something internal to the theory. It explains why they have different truth values, but not why asserting both feels like a conflict.

  **Picture 2 (Credence):** Similar problem. I can have high conditional credence in both. $P(B|A)$ can be high, and my credence in $B$ under the supposition of $A$ (flagged false) can also be high. The tension here is psychological: I cannot simultaneously hold $A$ as "to be believed" and "to be supposed false." But Picture 2 describes the mental states; it doesn't fully explain the *normative* clash in assertion.

  **Picture 3 (Common Ground):** This picture explains the tension as a **pragmatic contradiction**. To assert the indicative is to propose: "Let's treat A as a live option in our context." To assert the counterfactual is to propose: "Let's treat A as a non-live/excluded option in our context." You cannot successfully propose updating the common ground in two mutually exclusive ways at the same time. It is a Moore's Paradox for context updates: "Add A to our assumptions" + "Do not add A to our assumptions." The tension isn't just a datum; it's a violation of the rules of conversation.

  ### 3. Verdict on Picture Three

  Is Picture 3 a genuine option or just Picture 1 in pragmatic clothing?

  It is a **genuine option**, but it functions best as a *rival theory of the distinction's locus*, not necessarily a rival theory of truth.
  *   **Picture 1** locates the difference in **Semantics** (the proposition expressed).
  *   **Picture 3** locates the difference in **Pragmatics** (the update performed).

  Picture 3 earns its keep because it solves the Future Contingent problem that Picture 1 cannot. Picture 1 requires metaphysical distance to justify the counterfactual form; Picture 3 only requires *conversational* distance. Since a future coin toss has no metaphysical distance yet, Picture 1 is forced to say the forms are synonymous (which they aren't), while Picture 3 correctly identifies that the speaker is signaling a different stance toward the possibility.

  However, Picture 3 is vulnerable on **embedding**. If I say, "It is not the case that if it landed heads, I'd win," Picture 3 struggles to explain what is being negated if there are no truth conditions. Picture 1 handles negation easily (negating the quantification over worlds).

  ### Final Verdict

  **Which carries the most explanatory weight?**
  **Picture 3 (Common Ground)** carries the most weight for explaining the *usage data* you care about (the coin case, the assertion tension, the morphological choice in future contingents). It explains *why* we choose one form over the other in real time. Picture 1 explains the logic of the sentences once chosen, but Picture 3 explains the choice itself.

  **Which is a verbal variant?**
  **Picture 2 (Credence)** is the most likely candidate for being a verbal variant of Picture 1. In most formal implementations, quantifying over epistemically accessible worlds (Pic 1) yields the same validity conditions as conditionalizing credences (Pic 2). Pic 2 is largely the psychological correlate of Pic 1's epistemic modal base. It doesn't add independent explanatory power for the *distinction* between indicative and counterfactual; it just translates the domain restriction into belief revision terms.

  **Summary:**
  *   **Picture 1** is the semantic engine (handles logic/truth).
  *   **Picture 2** is the psychological dashboard (reducible to 1).
  *   **Picture 3** is the steering wheel (handles the distinction/usage).

  For your specific puzzles (future coins, assertion tension), **Picture 3 is the winner.** It is not merely a redescription; it identifies the actual mechanism (context management) that allows the counterfactual form to function even when the antecedent isn't false. Picture 1 is forced to treat the future-counterfactual as an anomaly; Picture 3 treats it as the standard case.
