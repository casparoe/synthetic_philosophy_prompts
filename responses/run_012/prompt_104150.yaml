answer: |-
  ### Logical Space Mapping

  The comparative science of consciousness divides primarily along the axis of *criteria*: is consciousness a matter of specific biological hardware (substrate) or specific computational/behavioral capacities (function)? Within those criteria, positions diverge on *specificity* (e.g., neocortex vs. any nervous system) and *modality* (binary presence vs. graded degrees). Finally, meta-philosophical commitments regarding *uncertainty* (evidentialism vs. precaution) and *ontology* (fact vs. stance) determine the practical verdict when data is incomplete. This instrument navigates these forks to locate a coherent position.

  ### The Diagnostic Instrument

  **Node 1: Modality**
  Is consciousness an all-or-nothing property (Binary), or does it admit of degrees (Degrees)?
  *   **Degrees** → Go to Node 2.
  *   **Binary** → Go to Node 3.

  **Node 2: Graded Policy**
  For graded views, under uncertainty, do we withhold attribution until proven (Evidential) or extend the benefit of the doubt (Precautionary/Stance)?
  *   **Precautionary** → **Leaf 1**.
  *   **Evidential** → (Terminates: Skepticism).

  **Node 3: Kind of Candidate**
  For binary views, what makes a system a candidate: possession of a neural substrate (Substrate) or performance of a functional role (Function)?
  *   **Substrate** → Go to Node 4.
  *   **Function** → Go to Node 7.

  **Node 4: Substrate Specificity**
  If substrate is required, is a thalamocortical-style architecture necessary (Cortex), or is a midbrain/centralized nervous system sufficient (Non-Cortex)?
  *   **Cortex** → Go to Node 5.
  *   **Non-Cortex** → Go to Node 6.

  **Node 5: Cortical Policy**
  Regarding cortical candidates, does uncertainty block attribution (Fact) or does precaution mandate it (Stance)?
  *   **Precaution/Stance** → **Leaf 2**.
  *   **Evidence/Fact** → (Terminates: Skepticism).

  **Node 6: Non-Cortical Policy**
  Regarding non-cortical candidates, does uncertainty block attribution (Fact) or does precaution mandate it (Stance)?
  *   **Precaution/Stance** → **Leaf 3**.
  *   **Evidence/Fact** → (Terminates: Skepticism).

  **Node 7: Function Specificity**
  If function is required, does it demand complex integration/attention (Complex) or basic sensory-affective loops (Basic)?
  *   **Complex** → Go to Node 8.
  *   **Basic** → Go to Node 9.

  **Node 8: Complex Policy**
  Regarding complex functional candidates, does uncertainty block attribution (Fact) or does precaution mandate it (Stance)?
  *   **Precaution/Stance** → **Leaf 4**.
  *   **Evidence/Fact** → (Terminates: Skepticism).

  **Node 9: Basic Policy**
  Regarding basic functional candidates, does uncertainty block attribution (Fact) or does precaution mandate it (Stance)?
  *   **Precaution/Stance** → **Leaf 5**.
  *   **Evidence/Fact** → (Terminates: Skepticism).

  ### The Leaves

  **Leaf 1: Continuous Phenomenology**
  *   **Position:** Graded Precautionary Functionalism.
  *   **Awkward Commitment:** Moral status must be calculated on a sliding scale, implying a half-conscious animal deserves half-protection.

  **Leaf 2: Cortical Conservatism**
  *   **Position:** Substrate Binary (Cortex) Precautionary.
  *   **Awkward Commitment:** Decorticate mammals and human infants under two are philosophical zombies despite behavioral evidence of pain.

  **Leaf 3: Subcortical Inclusion**
  *   **Position:** Substrate Binary (Non-Cortex) Precautionary.
  *   **Awkward Commitment:** Teleost fish possess conscious experiences qualitatively identical to humans despite lacking cortical layering.

  **Leaf 4: Convergent Cognitivism**
  *   **Position:** Function Binary (Complex) Precautionary.
  *   **Awkward Commitment:** Octopuses are conscious while insects are not, despite some insects exhibiting comparable behavioral flexibility.

  **Leaf 5: Pan-Sentient Functionalism**
  *   **Position:** Function Binary (Basic) Precautionary.
  *   **Awkward Commitment:** A fruit fly's suffering matters morally as much as a dog's, demanding radical revision of pest control.

  ### Testing the Instrument

  *   **Honeybee:** Routes to **Leaf 5** (Basic Function) or Termination (Substrate/Complex Function).
  *   **Octopus:** Routes to **Leaf 4** (Complex Function) or **Leaf 3** (Non-Cortex Substrate).
  *   **Teleost Fish:** Routes to **Leaf 3** (Non-Cortex Substrate); excluded by Leaf 2 and Leaf 4.
  *   **Decorticate Mammal:** Routes to **Leaf 3** (Non-Cortex Substrate); excluded by Leaf 2 (Cortex required).
  *   **Sleeping (Dreaming) Mammal:** Routes to **Leaf 2** or **Leaf 3**; Graded view (Leaf 1) may assign reduced intensity.
  *   **Insect Larva:** Routes to **Leaf 5** (Basic Function); excluded by all Substrate and Complex Function views.

  ### Closing Analysis

  **(a) Indistinguishable Leaves**
  The tree cannot structurally separate **Leaf 3 (Subcortical Inclusion)** from **Leaf 4 (Convergent Cognitivism)** regarding cephalopods. Both attribute consciousness to octopuses and exclude insects. The instrument conflates them because it treats "Non-Cortex Substrate" and "Complex Function" as parallel paths that converge on the same verdict for this specific case, differing only in their justification (biology vs. behavior) which the leaves summarize identically regarding scope.

  **(b) Unoccupied Combinations**
  1.  **Substrate + Basic Function:** This combination is incoherent; if one requires specific biology, one rarely accepts "basic" loops in divergent biology (e.g., insects) as sufficient.
  2.  **Binary + Evidential Policy:** This combination is unattractive; demanding positive evidence for a binary fact in the absence of reportability leads to universal skepticism, which functions as a refusal to occupy a position on animal consciousness at all.
  3.  **Cortex + Precaution + Insects:** This combination is unexplored territory; no current view argues for a cortical requirement while simultaneously extending precaution to animals lacking cortex.
