  Context: I'm a philosophy PhD student sitting in on a graduate set theory course. Not a set theorist, but not a beginner either. I've been trying to actually understand Zorn's lemma instead of just using it as a black box.

  So I was messing around last night and I think I can prove there's a set of all sets with it, which obviously can't be true, so something has to be broken. Here's the argument exactly as I wrote it down:

  (1) Let P be the collection of all sets, ordered by ⊆.
  (2) Take any chain C in P, i.e. a bunch of sets any two of which are comparable under ⊆.
  (3) The union ⋃C is a set, and every element of C is a subset of ⋃C, so ⋃C is an upper bound of C.
  (4) Therefore every chain in P has an upper bound.
  (5) By Zorn's lemma, P has a maximal element M.
  (6) Maximal means no element of P properly contains M.
  (7) But M ∪ {M} is a set and properly contains M. Contradiction.

  My friend says this shows Zorn's lemma (or the axiom of choice) is actually inconsistent. I don't buy that — I use Zorn alot and I'm not about to throw it out — but I also can't just wave the contradiction away. If it comes to it I'd definately rather keep Zorn than give up "there's no set of all sets," but I want to know what I'm actually paying.

