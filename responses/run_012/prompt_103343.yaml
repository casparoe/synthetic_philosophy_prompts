  | Environmental Degradation | -$320 Billion | Assignable (Cost) |
  | Future Population Health Harms | -$890 Billion | Unassignable (Nil) |
  | **Net Regulatory Impact** | **$130 Billion** | **Positive** |

  **5. Grievance Eligibility Window**
  Standing to file complaints regarding long-term harms is governed by the Grievance Eligibility Window. Complainants must demonstrate by preponderance of evidence that they would have existed even under the No-Action Alternative. Given the Counterfactual Substitute Assay findings, future citizens born post-implementation are ineligible to lodge grievances regarding policy-induced identity conditions. Only those alive at the time of enactment retain standing.

  **6. Anticipated Objections**
  The Agency anticipates three primary objections to this methodology. First, critics note this reasoning licenses nearly any policy, provided it changes who exists and ensures lives remain worth living. The Agency concurs that this is a logical consequence of the Person-Affecting Restriction; if the restriction is valid, the licensing is permissible. Second, critics question the principled difference between harms running through identity (recorded as nil) and harms affecting existing persons (recorded as costs). The Agency notes current statutory frameworks do not provide metrics for impersonal harms or comparative states of affairs. Third, objections suggest outcome comparison should not reduce to particular people's welfare. The Agency acknowledges this requires a moral theory comparing outcomes independently of individuals, which falls outside the Office's statutory mandate to assess individual impacts. The Office treats the Non-Identity Problem as a procedural license rather than a theoretical puzzle.

