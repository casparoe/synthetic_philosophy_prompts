      Title: OFFICE OF LONG-RANGE CONSEQUENCES
      Subject: Regulatory Impact Assessment: Strategic Aquifer & Lithium Access Program (SALAP)
      Date: October 24, 2024

      1. **Policy Overview and Identity Effects**
      The Strategic Aquifer & Lithium Access Program (SALAP) authorizes extensive extraction operations in Zones 4 through 9. Modeling confirms SALAP will degrade regional climate stability and deplete aquifers for approximately 120 years. However, SALAP also alters migration patterns and economic incentives, shifting the timing of family formation for approximately 4.2 million households. Under the Person-Affecting Restriction mandated by OLC Directive 77-B, harms are only cognizable if identifiable individuals are made worse off than they would otherwise have been. Because SALAP determines which specific individuals come into existence, the Agency applies the Non-Identity Offset.

      2. **Counterfactual Substitute Assay**
      To quantify identity dependence, the Agency employs a Counterfactual Substitute Assay. This assay compares the genetic identity of persons born under SALAP against persons born under the No-Action Alternative. Due to the sensitivity of conception to temporal and spatial variables (e.g., commute times, housing availability), any policy-induced shift in conception timing greater than one month results in a numerically different individual. The Assay confirms that 98% of persons born in the affected region during the extraction period are contingent upon SALAP. Without SALAP, these specific individuals would not exist.

      3. **Worked Example: Household 44-B**
      Consider Household 44-B. Under the No-Action Alternative, this household remains in Zone 4, conceiving a child in November 2026. Under SALAP, economic incentives prompt relocation to Zone 6 in January 2026. Conception occurs in March 2026. Due to the difference in gamete combination resulting from the shifted timing, the child born in March (Child S) is numerically distinct from the child who would have been born in November (Child N). Child S will live in a degraded environment with reduced life expectancy. However, Child S's life remains worth living. Since Child N never exists, Child S cannot claim to be worse off than their counterfactual self. The harm is therefore unassignable.

      4. **Cost-Benefit Analysis**
      The following table summarizes the projected impacts. Damages associated with future persons are recorded as nil pursuant to the Non-Identity Offset.

      | Impact Category | Projected Value (Present Discounted) | Assignability Status |
      | :--- | :--- | :--- |
      | Economic Extraction Value | $450 Billion | Assignable (Benefit) |
      | Environmental Degradation | -$320 Billion | Assignable (Cost) |
      | Future Population Health Harms | -$890 Billion | Unassignable (Nil) |
      | **Net Regulatory Impact** | **$130 Billion** | **Positive** |

      5. **Grievance Eligibility Window**
      Standing to file complaints regarding long-term harms is governed by the Grievance Eligibility Window. Complainants must demonstrate by preponderance of evidence that they would have existed even under the No-Action Alternative. Given the Counterfactual Substitute Assay findings, future citizens born post-implementation are ineligible to lodge grievances regarding policy-induced identity conditions. Only those alive at the time of enactment retain standing.

      6. **Anticipated Objections**
      The Agency anticipates three primary objections to this methodology.
      First, critics note this reasoning licenses nearly any policy, provided it changes who exists and ensures lives remain worth living. The Agency concurs that this is a logical consequence of the Person-Affecting Restriction.
      Second, critics question the principled difference between harms running through identity (recorded as nil) and harms affecting existing persons (recorded as costs). The Agency notes current statutory frameworks do not provide metrics for impersonal harms.
      Third, objections suggest outcome comparison should not reduce to particular people's welfare. The Agency acknowledges this requires a moral theory comparing states of affairs rather than individuals, which falls outside the Office's statutory mandate to assess individual impacts.

      7. **Public FAQ and Constitutional Provision**
      **Q: Does this mean the future will be worse?**
      A: The future will be different. Specific individuals will not be worse off than their alternative state of non-existence.
      **Q: Can we sue on behalf of unborn grandchildren?**
      A: No. They cannot be identified prior to conception.

      **Proposed Constitutional Amendment:**
      *Article XII, Section 4:* No person shall be deemed harmed by a policy that constitutes a necessary condition of their existence, provided their life exceeds the threshold of worth living. Standing is limited to persons identifiable independent of the contested policy.

