prompt: |-
  I am putting together materials for a graduate seminar in population ethics, and for one of the workshop sessions I would rather use a satire than another exposition, so I would like you to draft a mock Regulatory Impact Assessment in the deadpan register of a real government cost-benefit document, issued by an invented agency — call it the Office of Long-Range Consequences — in defense of a policy its own authors concede will leave the future worse off. The policy, which you may specify as you like, should be something like a long-term resource-extraction and settlement-licensing regime that will degrade the climate and drain aquifers for a century or more; what makes it interesting to the agency is that it will also, by shifting migration patterns and the timing of family formation, determine which people come to exist. The memo's central move is what its drafters call the Non-Identity Offset: because every person who will live under the policy would not have existed under the alternative, and because each of them will have a life worth living, the agency proposes to record the resulting harms at zero, on the ground that there is no one who can be identified as having been made worse off. Please build out the apparatus in the same spirit — a Counterfactual Substitute Assay that demonstrates the alternative course would have produced different persons, a Grievance Eligibility Window requiring complainants to show they would have existed but for the policy, a worked example involving a household that moves and conceives a child a few months earlier than it otherwise would have, and a cost-benefit table in which a column of very large damages is entered as unassignable and therefore nil. Include a section anticipating objections, in which the agency answers honestly enough that the reader can see the real trouble: that the same reasoning would license nearly anything, that there may or may not be a principled difference between harms that run through a person's identity and harms that do not, and that the objection seems to require a way of comparing outcomes that does not reduce to comparing how well off particular people are. End with a short citizen-facing FAQ and a final provision proposing a constitutional amendment to the same effect. The target of the satire is the person-affecting restriction and the bureaucratic habit of treating the nonidentity problem as a license rather than a puzzle, not any actual philosopher or agency, and the piece should never wink: the humor has to come from getting the structure right, so that someone who knows the literature laughs rather than winces while someone who does not can still reconstruct the problem from the memo alone. Keep the nonidentity problem distinct from the repugnant conclusion and the mere-addition paradox — the memo may gesture at them but must not conflate them — and write it in American English, roughly 800 words, formatted as numbered sections with headers and at least one table.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Draft a mock Regulatory Impact Assessment (RIA).
      *   **Tone/Style:** Deadpan, bureaucratic, government cost-benefit document style. No winking/satire markers (the humor comes from the logic itself).
      *   **Agency:** Office of Long-Range Consequences (OLRC).
      *   **Policy:** Long-term resource-extraction/settlement-licensing regime (degrades climate/aquifers for 100+ years).
      *   **Core Concept:** The "Non-Identity Offset." Because the policy changes *who* exists (via migration/timing of conception), and those people have lives worth living, harms are recorded as zero (no one is made worse off compared to their alternative state of non-existence).
      *   **Required Elements:**
          *   Counterfactual Substitute Assay (showing alternative course = different persons).
          *   Grievance Eligibility Window (complainants must show they would have existed anyway).
          *   Worked Example (household moves, conceives earlier).
          *   Cost-Benefit Table (large damages entered as unassignable/nil).
          *   Objections Section (honest admission: licenses nearly anything, identity vs. non-identity harms, outcome comparison issues).
          *   Citizen-facing FAQ.
          *   Final Provision (constitutional amendment).
          *   Distinction: Keep Non-Identity Problem distinct from Repugnant Conclusion/Mere-Addition Paradox.
          *   Length: Roughly 800 words.
          *   Format: Numbered sections with headers, at least one table.
          *   Language: American English.

  2.  **Deconstruct the Logic (The Non-Identity Problem):**
      *   Parfit's problem: Policies that affect who comes into existence cannot be said to harm those people if their lives are worth living, because without the policy, they wouldn't exist.
      *   The satire: Bureaucracy embracing this logical loophole to justify harmful policies by claiming "zero net harm" because the victims are "non-identical" to the counterfactual victims.
      *   Constraint: Do not confuse with Repugnant Conclusion (maximizing population at low welfare) or Mere Addition. Focus strictly on identity dependence.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard government memo header.
      *   **Section 1: Executive Summary & Policy Overview.** Define the policy (Resource Extraction & Settlement Licensing Act). Acknowledge environmental damage but pivot to identity effects.
      *   **Section 2: The Non-Identity Offset.** Explain the core logic. Harms = 0 because subjects are contingent on the policy.
      *   **Section 3: Methodology (Counterfactual Substitute Assay).** How do we prove different people? Genetic timing, migration.
      *   **Section 4: Worked Example.** The household moving and conceiving earlier.
      *   **Section 5: Cost-Benefit Analysis (Table).** Show the damages as "Unassignable/Nil."
      *   **Section 6: Grievance Eligibility.** You can't complain unless you would have existed anyway.
      *   **Section 7: Anticipated Objections.** Honest admission of the implications (licenses anything, person-affecting restriction limits).
      *   **Section 8: FAQ & Constitutional Amendment.** Wrap up.

  4.  **Drafting - Tone Check:**
      *   Must be dry. No exclamation points. No "obviously absurd." Just "pursuant to," "methodology," "statutory requirement."
      *   The horror should be in the calm acceptance that causing a miserable future is fine because the people in it are "new."

  5.  **Drafting - Content Constraints:**
