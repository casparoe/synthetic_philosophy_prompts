  **Mark: 6.5 / 10**

  **Comments:**

  You have a solid grasp of the factual outcome of the debate and Fuller's position is well-explained. However, there are significant theoretical imprecisions regarding Hart's argument and a fundamental error in your conclusion that prevents this from scoring higher. In a second-year theory course, distinguishing between the *results* a theorist advocates and the *theoretical machinery* they use to get there is crucial.

  Here is the breakdown:

  *   **Hart's Outcome (Correct):** You correctly identify that Hart believed the informer should be punished, but only through a retroactive statute passed by the legislature. This shows you have done the reading on the specific case.
  *   **Hart's Reasoning (Imprecise/Partially Incorrect):** You attribute Hart's position to the "core and penumbra" distinction. This is a conflation of his 1958 debate with Fuller and his 1961 book *The Concept of Law*.
      *   *The Error:* In the Informer Case debate, Hart's point is not about judicial discretion in the "penumbra." His point is that the Nazi statute *was* valid law (it fell within the core of validity at the time). Because it was valid law, the courts could not simply pretend it didn't exist to punish her.
      *   *The Cost:* This costs you marks because the question asks how his *general account* leads to the conclusion. His account of the Separation Thesis (that law and morality are separate, so a law can be valid but evil) is the driver here, not the semantic openness of rules. You describe the solution (honesty/legislature) correctly, but the theoretical mechanism is off.
  *   **Fuller's Reasoning (Strong):** This is the best part of your answer. You correctly identify the "Inner Morality of Law," list the principles, and explain how the Nazi regime's failure to meet these standards allowed Fuller to view the statutes as non-law. This links his general theory to the case outcome perfectly.
  *   **The Conclusion (Major Error):** Your final paragraph claims Hart's "minimum content of natural law" renders the Separation Thesis dead. This is objectively incorrect within the context of Hart's jurisprudence.
      *   *The Correction:* Hart explicitly argues that the minimum content is based on *contingent facts* of human nature (vulnerability, limited resources, etc.), not on necessary moral truths. He maintains that this concession does *not* bridge the gap between law and morality. To say the Separation Thesis is "dead" because of this is to misunderstand Hart's defense of positivism.
      *   *The Cost:* This is a significant theoretical mistake. If you write this in a final exam, it signals a misunderstanding of the core positivist project.

  **Advice for next time:**
  Be careful not to mix up Hart's different arguments. The "Core/Penumbra" distinction is about judicial interpretation of *valid* rules. The "Informer Case" argument is about the *validity* of evil rules. Also, avoid making sweeping claims about a theorist's project being "dead" or "contradictory" unless you can substantiate it with their specific counter-arguments (Hart specifically defends the Minimum Content *as consistent* with Positivism).

  Good work on Fuller, but tighten up the Hart analysis.
