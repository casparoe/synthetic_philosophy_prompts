  Okay so I think I get Quine's gavagai point — a native points at a rabbit and says "gavagai" and I can't tell whether it means the rabbit, the undetached rabbit parts, or a rabbit stage. My question is whether this is really just an evidence problem. Like, if I did enough fieldwork that I had every behavioral fact about these speakers nailed down — or even better, if I could somehow just look inside their heads and read off their mental states — wouldn't "gavagai" turn out to have one determinate meaning after all, and Quine's indeterminacy just be a fancy name for "you havent gathered enough data yet"? And if it really is more than that, what's the practical upshot for the dictionary I'm writing — do I just pick one of the three readings arbitrarily, since there's no fact of the matter to get wrong?
