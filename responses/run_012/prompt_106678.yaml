          2.  **Precautionary Principle:** In ethics and policy, when there is uncertainty about harm (especially severe harm like pain), the burden of proof usually shifts to the actor causing the potential harm, not the victim proving they feel it. The user's default (no protection) risks causing massive suffering if the assumption is wrong.
          3.  **Moral Risk Asymmetry:** The cost of false positive (protecting a non-sentient being) is low (economic cost, inconvenience). The cost of false negative (failing to protect a sentient being) is high (intense suffering, death). Ethical decision-making under uncertainty usually favors minimizing the worst-case scenario.
          4.  **Evolutionary Continuity:** Pain systems are evolutionarily conserved. Nociception + complex behavior + central processing usually implies sentience in vertebrates and increasingly accepted in cephalopods/crustaceans. Treating them like machines ignores biological plausibility.
          5.  **Verification vs. Evidence:** "Verification" implies certainty. Science rarely offers absolute certainty. Policy must act on *probability* and *weight of evidence*, not absolute proof.
          6.  **The Machine Analogy:** Machines are designed artifacts known not to feel. Animals are evolved organisms with nervous systems homologous to ours. The analogy is flawed.

