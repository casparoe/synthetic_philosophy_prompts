      I completely understand your frustration because on the surface you are both speaking different languages while using the same words. When your friend says if you are both rational you will both cooperate, they are smuggling in a specific conception of decision theory that contradicts the standard causal model you are likely using. To unpack this, we should first brainstorm the possible layers of meaning hidden in that slogan before we judge which ones hold water. The claim could be a tautology about definitions, an empirical guess about psychology, a logical argument about identical algorithms, or a statement about a modified game structure. It could mean that rationality is defined by winning rather than process, it could mean that people who study this stuff are correlated in behavior, it could mean that logical necessity binds identical reasoners even without communication, or it could mean that access to source code changes the payoff matrix entirely.

      Once we have that spread out, we can sort them from the weakest to the strongest. The weakest version is purely definitional and nearly empty. This reading says that we should define the word rational as whatever strategy produces the highest payoff. Since mutual cooperation yields a higher payoff than mutual defection, a rational agent is simply one who cooperates. This is technically true by stipulation but it does not solve the problem because it ignores the mechanism of choice. In your experiment with an anonymous player, this definition doesn't help you because it doesn't tell you how to achieve that outcome given the incentives. It just renames the desired outcome as rationality. If you adopt this definition, you are saying rational people cooperate, but you still have no causal lever to pull to make that happen if the other person is using a different definition.

      The next layer is an empirical claim about psychology rather than logic. This suggests that people who read decision theory literature form a specific demographic that is conditioned to cooperate. Your friend might be arguing that because you are both in the reading group, you are both likely to be cooperators. This is a claim about human behavior and social correlation. It might be true in your specific group, but it is not a universal truth of rationality. In a truly anonymous experiment with a random stranger, this claim fails because you cannot assume the stranger shares your specific cultural conditioning. It relies on similarity of upbringing and education rather than similarity of logical structure.

      Then we get to the core theoretical claim, which is what your friend likely means when they mention running the same algorithm. This is the concept of superrationality or logical decision theory. The argument here is that if two agents are perfectly rational and have the same information, they must arrive at the same conclusion. Therefore, your decision is logically correlated with theirs. You are not choosing between cooperate and defect while their choice stays fixed. You are choosing between the world where you both cooperate and the world where you both defect. Since the former is better, you cooperate. This is a claim about logic and the nature of reasoning. It is true only if you accept that your decision process and theirs are sufficiently identical that the output is logically bound. In your experiment, this is shaky. Unless you know the other player is using the exact same decision procedure as you, you cannot assume the logical link. If they are a standard causal decision theorist, they will defect regardless of your logic, and your cooperation will just be exploited.

      The strongest claim involves the setup where players read each other's source code. This is not a standard Prisoner's Dilemma anymore. It is a modified game where you can condition your move on their move. If you can see their code, you can write a program that says cooperate if and only if their program cooperates. This makes mutual cooperation a stable equilibrium because defection is punished by the code itself. This is a claim about game structure and computability. It is true within that specific setup, but it does not apply to your situation. You do not have access to the other player's source code, and humans do not run transparent algorithms that can be inspected before the move.

      So when we judge these against your specific scenario of a one-shot anonymous experiment, most of them fall apart. The definitional claim is empty. The psychological claim is unreliable. The logical correlation claim requires an assumption of identicality that you cannot verify. The source code claim is irrelevant to the setup. Your intuition that defecting is the dominant strategy holds under standard causal decision theory, which assumes your choice cannot causally influence the other player's choice. Your friend is operating under a framework that assumes logical influence without causal contact.

      My guess is that the people repeating this slogan have the superrationality argument in mind but are conflating it with the source code scenario. They feel that because you are both rational agents in a reading group, you are effectively running the same mental software, so the logical correlation holds. They are treating the reading group membership as a proxy for algorithmic identity. They believe that rationality implies a kind of symmetry that forces cooperation. However, they are glossing over the requirement that the other player must actually be using the same decision theory. If there is even a small chance the other player is a standard defector, the logical link breaks, and cooperation becomes risky. They are likely assuming a level of homogeneity in the group that does not exist in the wider population, and they are treating a normative ideal of rationality as a descriptive fact about your opponent.

      Ultimately, your friend is not wrong that cooperation is better, but they are wrong that standard rationality guarantees it in your setup. They are advocating for a specific, controversial decision theory that requires stronger assumptions about the world than the standard model does. You are right to feel that something is being smuggled in, because the move from we are both rational to we will both cooperate requires the hidden premise that our rationality is identical and logically binding, which is not true for distinct human beings in an anonymous experiment. The slogan works only if you redefine rationality to include logical correlation with similar agents, which is exactly what your friend is doing, but it is not the default definition used in most economics or standard game theory.

