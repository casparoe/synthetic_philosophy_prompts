answer: |-
  You say you see a contradiction between my citation of Cicero and my counsel in *De Regno*, but you mistake the object of praise for the authority of the agent. Cicero is right that the liberation of the country is a good thing, and the death of a tyrant is not murder in itself; yet this does not make every hand fit to strike. In the *Sentences*, I consider the act insofar as it serves the common good; in *De Regno*, I consider the order of justice required to perform it. A private person acts on private authority, and to allow private judgment to execute public punishment is to dissolve the very bond of civil peace. Thus, the first is no license for the second, for a good end does not justify a disordered means.

  Regarding your question on who counts as public authority when the tyrant holds every office: if he is a usurper, he never truly held the office, and the authority reverts to the community or those who elevated him. If the multitude elected him, they may depose him; if he was appointed by a superior, appeal lies there. But if there is no earthly recourse, it does not follow that the private sword is loosed. To say the remedy is from God is not merely to warn of failure, but to affirm that judgment belongs to the Lord and His ordained order. The private zealot sins not because he might fail, but because he usurps a judgment that is not his, disturbing the peace even in seeking to restore it.
