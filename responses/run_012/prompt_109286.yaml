answer: |-
  Here is a menu of the specific claims hidden inside the phrase "X is just a social construct," broken down by what they assert, their truth value, and how they apply to your roommate's arguments.

  ### Part 1: The Menu of Claims
  *What exactly is being claimed when someone says "X is a social construct"?*

  1.  **The Historical Contingency Claim**
      *   **Claim:** This category did not exist in the past and might not exist in the future; it was brought into being by human history, not discovered like a planet or a virus.
      *   **Truth Value:** **Substantive & Defensible.** (Weekends and money fit this; gravity and hydrogen do not.)
      *   **Scope:** About the *concept's origin*, not necessarily its current utility.

  2.  **The Mind-Dependence Claim**
      *   **Claim:** X cannot exist without human agreement or cognition. If all humans vanished, X would vanish (unlike mountains or tectonic plates).
      *   **Truth Value:** **Substantive & Defensible.** (Money vanishes without minds; radiation does not.)
      *   **Scope:** About the *ontology* (mode of existence) of the thing.

  3.  **The Arbitrariness Claim**
      *   **Claim:** The specific boundaries of X are not fixed by nature. We drew the line *here* rather than *there* for reasons that could have been different.
      *   **Truth Value:** **Nuanced.** (The *existence* of currency is non-arbitrary for complex economies; the *color of the bill* is arbitrary. Race boundaries are socially drawn, but often track real geographic/genetic clusters imperfectly.)
      *   **Scope:** About the *boundaries* of the category.

  4.  **The Functional Claim**
      *   **Claim:** X exists to perform a specific social job (e.g., coordinate behavior, distribute resources, enforce hierarchy).
      *   **Truth Value:** **Substantive & Defensible.**
      *   **Scope:** About the *purpose* of the category.

  5.  **The "Nothing But" Claim (The "Just" Claim)**
      *   **Claim:** Because X is socially constructed, it lacks "real" causal power, objective constraints, or moral weight. It is *only* an idea, not a force.
      *   **Truth Value:** **False.** (This is the money/rent error. A stop sign is a social construct, but hitting one at 60mph has physical consequences. Money is constructed, but lacking it has physical consequences.)
      *   **Scope:** About the *consequences* of the category.

  6.  **The Reflexive (Looping) Claim**
      *   **Claim:** The classification changes the people classified. Once we name a group, people in that group change their behavior to fit (or fight) the name, which then changes the definition of the group.
      *   **Truth Value:** **Substantive & Deep.** (This makes the category *more* real, not less, because it has feedback loops.)
      *   **Scope:** About the *interaction* between the category and the people sorted.

  ---

  ### Part 2: Pinning Down "Just" and "Reflexivity"

  **1. The Word "Just"**
  *   **Does it add a claim?** Yes. It adds a **reductionist claim**. It asserts that *only* Claim 1 or 2 is true, while explicitly denying Claim 5's opposite. It implies: "Because it is constructed, it is not binding."
  *   **Does the money case kill the dismissive reading?** It kills the idea that "constructed = optional." It relocates the dismissiveness. The roommate is treating "social" as synonymous with "imaginary." The rent example proves that social facts can be **institutionally coercive**. You cannot pay rent with "the idea that money is fake" because the landlord participates in the same construct, and the state enforces it.
  *   **Verdict:** "Just" is an attitude masquerading as an argument. It attempts to swap "contingent origin" for "lack of consequence."

  **2. The Reflexive Bit (The Loop)**
  *   **Where does it go?** This is **Claim 6** on the menu.
  *   **Category vs. People:** This is the crucial distinction your roommate misses.
      *   *The Category:* Is a tool/schema. It is malleable.
      *   *The People:* Are flesh and blood. They experience the category as a constraint.
  *   **Does it make the kind more or less real?** **More real.** If a classification changes how people act, feel, and organize, it has causal power. A "real" biological virus changes your body; a "real" social construct changes your life trajectory.
  *   **The Trap:** Your roommate uses reflexivity to say "we can change the categories." But if the categories act back on the people, changing the category requires changing the people/institutions, which is hard.

  ---

  ### Part 3: The "Strong Version" Paradox
  *If there is no fact of the matter about boundaries, does that help her "we can change them" move?*

  *   **The Move:** "Since boundaries are constructed, we can redraw them."
  *   **The Support:** Yes, Claim 3 (Arbitrariness) supports this. If nature didn't draw the line, humans can move the line.
  *   **The Undercut:** If the **Strong Version** is true (there is *no* fact of the matter, not even a social one), then **no arrangement is better than another.**
      *   If race/gender is *purely* arbitrary with no connection to history, biology, or lived experience, then fighting for a *specific* new arrangement is meaningless. Why change it to *this* rather than *that*?
      *   To argue we *should* change the categories, you must admit the categories currently do something (Claim 4: Function) that is harmful or helpful. You have to admit they are "real" enough to cause harm.
      *   **Conclusion:** The Strong Version helps the *ability* to change (logic) but undercuts the *reason* to change (normativity).

  ---

  ### Part 4: The Kitchen Cheat Sheet (Applying the Menu)
  *Bring this to the table. Match her conclusion to the specific claim required to sustain it.*

  **1. The Race/Medicine Move**
  *   **Her Argument:** Race is constructed $\rightarrow$ Race has no biological basis $\rightarrow$ Race-based medicine is nonsense.
  *   **Required Claims:** She needs **Claim 5 ("Nothing But")** to be true. She assumes "Social" excludes "Biological correlate."
  *   **The Counter:**
      *   **Claim 1 (Contingency)** is true: Race categories are historically drawn.
      *   **Claim 6 (Reflexivity)** is true: Because society treats races differently (environment, stress, access), biological differences *emerge* from the social construct.
      *   **Verdict:** Her conclusion is **False**. Race is socially constructed, but because it structures environment and exposure, it is a valid (though imperfect) proxy for certain medical risks. "Constructed" does not mean "physiologically inert."

  **2. The Gender/Categories Move**
  *   **Her Argument:** Gender is constructed $\rightarrow$ Boundaries are arbitrary $\rightarrow$ We can just change the categories.
  *   **Required Claims:** She needs **Claim 3 (Arbitrariness)** and **Claim 1 (Contingency)**.
  *   **The Counter:**
      *   **Claim 6 (Reflexivity)** complicates this. The categories are embedded in laws, language, and habits.
      *   **Claim 5 ("Nothing But")** is the weak point. She treats the category as a sticker we can peel off. But the category is glued on by institutions.
      *   **Verdict:** Her conclusion is **Substantive but Difficult**. We *can* change the categories (Claim 3), but not "just" like that (Claim 5). It requires institutional work, not just semantic work.

  **3. The Money/Rent Move**
  *   **Her Argument:** Money is constructed $\rightarrow$ Money isn't "real" $\rightarrow$ My obligation is flexible.
  *   **Required Claims:** She relies entirely on **Claim 5 ("Nothing But")**.
  *   **The Counter:**
      *   **Claim 2 (Mind-Dependence)** is true: Money needs agreement.
      *   **Claim 4 (Function)** is true: Money coordinates labor and housing.
      *   **Claim 5** is **False**: Institutional facts are binding.
      *   **Verdict:** Her conclusion is **False**. You cannot pay rent with a social construction *unless* it is the *specific* social construction the landlord accepts (dollars). The "construct" is the system, not your personal interpretation of it.

  ### Summary for the Roommate
  "If 'social construct' means **Contingent** (Claim 1), you're right about all three. If it means **Mind-Dependent** (Claim 2), you're right about all three. But if you use it to mean **Unconstrained** (Claim 5), you're wrong about the rent, wrong about the medicine, and oversimplifying the gender change. You can't use the *origin* of the category to deny the *consequences* of the category."
