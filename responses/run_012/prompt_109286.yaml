      *   *Function:* Does it serve a purpose? (Yes.)
      *   *Reality/Constraint:* Is it "real" in its effects? (Yes.)
      *   *Malleability:* Can we change it? (Depends on the type.)

  3.  **Drafting the Menu (The Claims):**
      *   I need to categorize the different ways "social construct" is used.
      *   *Claim 1: Historical Contingency.* It wasn't always here; we made it.
      *   *Claim 2: Mind-Dependence.* It doesn't exist without us thinking it does.
      *   *Claim 3: Arbitrariness/Variability.* The boundaries aren't fixed by nature.
      *   *Claim 4: Functional/Instrumental.* It exists to do a job (coordinate, oppress, organize).
      *   *Claim 5: The "Just" (Dismissive).* It's *only* social, implying it's not "real" or "binding."
      *   *Claim 6: Reflexivity/Looping.* The category changes the people in it (Hacking's looping effects).

  4.  **Evaluating the Claims (True/False/Trivial):**
      *   *Contingency:* Substantive. (Weekends are contingent; gravity is not.)
