          *   "Use propensities when doing physics." (Physicists often use Bayesian methods for data analysis even in QM).

  5.  **Addressing Specific Technical Questions:**

      *   *Limiting Frequency:* It's a *definition* for Von Mises. For others, it's a hoped-for convergence (Law of Large Numbers). The distinction matters because if it's a definition, single cases are meaningless. If it's a theorem, what is the primitive?
      *   *Reference Class:* Primarily a Frequentist problem (which sequence does this trial belong to?). Bayesians have it too (which model/priors?), but it manifests differently.
      *   *Single-Case:* Bites Frequentists hardest (cannot assign prob to unique event). Propensities solve this. Bayesians solve this by shifting to belief.
