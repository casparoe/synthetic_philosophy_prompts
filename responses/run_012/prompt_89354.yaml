      *   **Subjectivism (Bayesianism):**
          *   *Degree of Belief:* Yes (Ramsey/de Finetti).
          *   *Not a fact about the world:* Yes, it's epistemic.
          *   *Internally consistent is legitimate:* *Wince/False.* This describes *personalist* Bayesianism (de Finetti). Objective Bayesians (Jaynes) argue priors are constrained by logic/symmetry (Principle of Indifference). The blog post ignores Objective Bayesianism.
          *   *Prior on God:* Technically yes, but implies arbitrariness.

      *   **Propensity:**
          *   *Real tendency:* Yes (Popper).
          *   *Single Case:* This is the main selling point.
          *   *Physics/QM:* Yes, often cited.
          *   *Wince:* Propensities are metaphysically obscure. How do you measure them without frequencies? (Humphreys' Paradox).

      *   **Conclusion ("Three Tools"):**
          *   *Pragmatism:* Useful for working scientists.
          *   *Philosophical Reality:* They make ontological claims that contradict. One says probability *is* physical, another says it *is* mental. They can't both be fundamentally true in the same sense.
          *   *Different Answers:* Need a concrete example.

  4.  **Drafting the Critique (Categorization):**

      *   *(a) Nod:* General characterizations (Frequency = long run, Subjective = belief, Propensity = physical chance).
