  *   **Minimum ($U_{min} = 0$):** Total destitution (homelessness, no savings, permanent career scarring).
  *   **Maximum ($U_{max} = 100$):** Financial independence, prestigious career, secure retirement.
  *   **Current State ($U_{safe} = 60$):** Secure home, stable income, modest retirement.
  *   **Success State ($U_{gain} = 65$):** Partnership secured, home retained, slightly higher income.
  *   **Failure State ($U_{ruin} = 0$):** Partnership fails, firm sues for liabilities, Elena loses home and license.
  **The Probabilities (ii):** Based on actuarial data from similar firms, the partnership succeeds with probability $0.95$ ($19/20$) and fails with probability $0.05$ ($1/20$).
  **The Structure (iii) & (iv):** This is a one-shot offer. No divine intervention, no infinite populations, no afterlife. Just Elena, her house, and the contract.

  **The Choice:**
  *   **Option A (Safe):** Decline partnership. Keep current life. Utility = 60.
  *   **Option B (Risky):** Accept partnership. 95% chance of Utility 65; 5% chance of Utility 0.

  ---

  ### The Walk-Through

  **1. The EV Maximizer**
  *   **Verdict:** Take Option B.
  *   **Reasoning:** Expected Utility of A is $60$. Expected Utility of B is $(0.95 \times 65) + (0.05 \times 0) = 61.75$. Since $61.75 > 60$, rationality demands accepting the risk. The 5% chance of ruin is an acceptable cost for the positive expected gain.
  *   **Intuition Check:** This makes skin crawl. Most people would not risk 5% objective probability of homelessness for a marginal increase in lifestyle quality, even if the math says "go."

  **2. The Risk-Averse Agent (Rank-Dependent/Weighted)**
  *   **Verdict:** Take Option A.
  *   **Reasoning:** A risk-weighted agent applies a decision weight $w(p)$ to probabilities that diverges from objective $p$. Typically, small probabilities of catastrophic outcomes are overweighted. Even with $p=0.05$, the decision weight on the ruin outcome might be $w(0.05) = 0.15$.
  *   **Calculation:** $U_{Risky} = 0.85(65) + 0.15(0) = 55.25$. Now $55.25 < 60$. The agent refuses the bet, not because the utility function changed, but because the *weighting* of the tail risk reflects a aversion to dispersion that EV ignores.

  **3. The "Ruin Clause" Proponent**
  *   **Verdict:** Take Option A (Impermissible to choose B).
  *   **Reasoning:** "No option which can leave you with literally nothing is ever permissible." This is a deontological constraint on the choice set, not a calculation within the utility function.
  *   **Does it do work the Utility Function couldn't?** **Yes.** In this scenario, the bounded utility function *failed* to stop the EV recommendation. $U$ was bounded $[0, 100]$, yet EV still recommended risking 0. The Ruin Clause overrides the calculation entirely. It acts as a lexical veto, whereas the utility function merely scales the value of the outcomes. Bounding utility limits the *upside*; it does not necessarily make the *downside* prohibitive enough to outweigh a high-probability gain.

  ---

  ### Analysis of Your Hunch and the Constraints

  **1. Is this Fanaticism?**
  Your hunch is correct: **This is not fanaticism.** This is plain risk-neutrality clashing with deep risk-aversion.
  *   **Fanaticism** (Pascal's Mugging style) requires that a *tiny* probability of a *huge* gain outweighs a *certain* moderate good.
  *   **This Case** relies on a *moderate* probability of a *moderate* gain outweighing a *small* probability of ruin.
  *   Under constraints (i) and (ii), Pascal-style fanaticism is mathematically impossible. If $U$ is bounded (say at 100) and $p \ge 0.05$, the maximum possible EV of a risky option is $0.05 \times 100 = 5$ (if the safe option is 0). If the safe option is mid-range (60), the risky option cannot beat it unless the probability of success is high (as in the Mortgage Gamble above). But if the probability of success is high, it's not a "long shot," it's a "good bet with bad tail risk."

  **2. The Load-Bearing Clause**
  You asked which clause is load-bearing. If we want *fanaticism* (tiny prob $\times$ huge value), **Clause (i) (Bounded Utility)** is the killer.
  *   **Why:** Fanaticism relies on the leverage of unbounded utility. If $U$ can go to infinity (or sufficiently high finite values), then $p \times U$ can exceed any certain $U_{safe}$ even as $p \to 0$.
  *   **Dropping it:** If you allow Unbounded Utility (drop Clause i), the monsters return immediately. Even with $p=1/20$, an unbounded utility function allows for outcomes where $U_{gain}$ is large enough that $0.05 \times U_{gain} > U_{safe}$.
  *   **Clause (ii) (Probability):** This also constrains fanaticism, but less fundamentally. If Utility is unbounded, even $p=1/20$ allows for fanaticism. If Utility is bounded, even $p=1/10^{100}$ prevents it. Thus, (i) is the primary load-bearer for the *phenomenon* of fanaticism.

  **3. Bounding Utility: Confused or Substantive?**
  You suspected bounding utility is "confused or a sneaky change... since utility is only pinned down up to positive affine transformation."
  *   **Correction:** You are partially wrong. EV maximization is invariant only under *positive affine* transformations ($U' = aU + b, a > 0$). Bounding a previously unbounded function is a **non-linear** transformation. It changes the cardinal properties of the scale, specifically the marginal utility of goods at the extremes.
  *   **Effect:** It effectively builds risk-aversion into the utility function. However, as the Mortgage Gamble shows, it does not necessarily build in *enough* risk-aversion to match human intuition about ruin. It changes the risk profile, but it doesn't solve the "Ruin" intuition on its own.

  **4. Raising the Endowment**
  If we quietly raise Elena's endowment so the bad outcome stops being "losing everything" (e.g., she has a trust fund that prevents homelessness, so $U_{min} = 40$ instead of 0):
  *   **New EV(B):** $0.95(65) + 0.05(40) = 61.75 + 2 = 63.75$.
  *   **New EV(A):** 60.
  *   **Result:** The bet becomes even *more* attractive to the EV maximizer.
  *   **Collapse:** If we raise the endowment such that the "Safe" option is near the bound (e.g., $U_{safe} = 95$, $U_{max} = 100$, $U_{min} = 90$), then EV(B) $\approx 99.5$ vs EV(A) $= 95$. Still attractive.
  *   **Wait, check the ratio:** If $U_{safe}$ is very close to $U_{max}$, the *gain* from winning is small. If $U_{safe} = 99$, $U_{max}=100$, $U_{min}=0$. EV(B) = $0.95(100) + 0.05(0) = 95$. EV(A) = 99. **Now EV says Safe.**
  *   **Conclusion:** Yes, it collapses into a boring good bet (or a boring bad bet) depending on the **stake-ratio-to-endowment** (position in utility space). When the agent is "rich" (near the utility bound), they cannot gain enough utility to justify the risk of falling to the bottom. The tension is highest when the agent is in the middle of the utility curve. This confirms the whole thing is about the ratio of the stake to the agent's position in utility space, not just probability.

  **5. The Fanatic's Attack**
  *   **Attack:** "You are conflating *utility* with *psychological comfort*. If Elena's true utility function is bounded as stated, and she refuses Option B, she is literally throwing away expected value. Her 'skin-crawl' is loss aversion, which is a cognitive bias, not a rational constraint. If she truly valued 'no ruin' lexically, her utility function would reflect that (e.g., $U(ruin) = -\infty$ or a lexical ordering), but you forbade that in Clause (i). Given your own rules, refusing is irrational."
  *   **Does it land?** **Yes.** Within the strict confines of orthodox decision theory with the utility function provided, the EV maximizer is right. The "skin-crawl" comes from the fact that the specified utility function does not match the intuitive moral weight humans place on ruin. The Fanatic correctly identifies that the problem lies in the *specification of the preferences*, not the *maximization rule*.

  ### Conclusion

  You cannot generate Pascal-style fanaticism under these constraints. You can only generate Risk-Neutrality vs. Risk-Aversion conflicts. The "monsters" of fanaticism require the ability to trade a certain moderate good for a tiny chance at an *unbounded* (or sufficiently massive) good. By bounding utility, you cap the leverage.

  \answer{unbounded-utility}
