  **MEMORANDUM**

  **TO:** All Demes, Trait Groups, and Phenotypic Vehicles
  **FROM:** Committee on Levels of Booking
  **DATE:** Cycle 44, Generation 10,902
  **SUBJECT:** Reclassification of Fitness Revenue Streams to Group Level

  **1.0 PURPOSE**

  Effective immediately, the Office of Fitness Accounting will cease recognizing individual reproductive output as the primary ledger for fitness revenue. Henceforth, all variance in lineage persistence must be decomposed and booked at the level of the Trait Group. This directive resolves longstanding ambiguities regarding the capitalization of altruistic behaviors and standardizes the audit process for multilevel selection events.

  **2.0 RATIONALE**

  Recent audits of Avian Unit 4 revealed significant discrepancies. Hens in this division reduced individual egg production (individual cost) to minimize acoustic predation risks (group benefit). Under previous accounting standards, these hens were flagged as underperforming assets. However, the Unit's total lineage survival exceeded projections. This confirms that group-level terms in the variance decomposition name distinct causal processes rather than merely repartitioning the same total individual fitness. Management rejects the objection that group fitness is a fallacy of averaging; the emergent value of the cohort constitutes real revenue, distinct from the sum of individual shares.

  **3.0 POLICY CLAUSES**

  **3.1 Recognition of Altruism**
  Traits previously categorized as individual expenses shall be reclassified as group-level assets if they correlate positively with deme survival. A worker organism reducing its own replication to subsidize a colony mate is not generating a loss; it is transferring equity to the Group Ledger. The description of the trait changes from "self-sabridging" to "group-investing" based solely on the level of booking.

  **3.2 Handling of Free-Riders and Cheaters**
  Group-level revenue recognition is contingent upon sufficient between-group variance. Divisions must maintain strict population structure and limited dispersal to prevent free-riders from diluting group equity. If cheaters replicate faster within the group than the group replicates against other groups, the division will be flagged for liquidation. High relatedness is acceptable as a proxy for structure, but must not be confused with the mechanism itself.

  **3.3 Intragenomic Conflicts**
  Shareholders (replicators) whose interests diverge from the vehicle majority—specifically meiotic drive elements attempting to bypass fair segregation protocols—are to be listed as liabilities. While these elements maximize their own transmission, they reduce vehicle integrity. They are not recognized as valid divisions unless they demonstrate independent group-level adaptation.

  **3.4 Applicability to Issuing Body**
  This Committee constitutes a Trait Group. Therefore, under the policies herein established, the Committee's own continued existence is contingent upon differential extinction rates between this Committee and alternative bureaucratic structures. If this Office does not replicate or contribute to the variance in persistence of Offices relative to other Offices, it possesses no fitness and holds no authority to issue memoranda.

  **4.0 OUTSTANDING OBJECTIONS**

  The Fundamental Replicator Division has lodged a formal dispute. They argue that Kin Selection and Group Selection are not rival explanations but two bookkeepings of a single process, convertible via inclusive fitness logic. They contend that insisting on Group Level booking is redundant accounting. Management maintains that while the math may be convertible, the causal attribution differs. However, to avoid audit paralysis, both ledgers may be maintained in parallel until further notice, provided the Group Ledger takes precedence in public filings.

  **5.0 SIGNATURE**

  **Dr. Aris Thorne**
  Director of Phenotypic Consolidation
  Committee on Levels of Booking

  ***

  **APPENDIX A: SCHEDULE OF EXEMPTIONS FOR INTRAGENOMIC CONFLICTS**

  | Element Type | Behavior | Exemption Status | Required Justification |
  | :--- | :--- | :--- | :--- |
  | **Standard Allele** | Fair Meiosis | Approved | None |
  | **Segregation Distorter** | Biased Transmission | Pending | Must prove group benefit outweighs individual cost |
  | **Cytoplasmic Factor** | Maternal Inheritance Only | Denied | Incompatible with nuclear group strategy |
  | **Transposon** | Replication within Genome | Under Review | Must demonstrate regulation by host suppressors |

  *Note: Submission of Form B-12 (Claim of Vehicle Integrity) is required for all Pending status elements. Failure to demonstrate between-group variance will result in silencing.*
