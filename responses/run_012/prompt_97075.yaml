answer: |-
  Good morning. Thank you for being here.

  I have a set of instructions from my uncle. They were found on his desk, rewritten several times, in that handwriting that crowded the margins of every book he owned. He was very specific about what he did not want said. He asked that nobody tell you he is watching over us. He asked that we not say he has gone to a better place, or that he is at peace now. And he wrote, in a line I have read more times than I can count: "Do not dress the old doctrines up to make them easier to swallow."

  He also asked that I not give a lecture. Given that he taught physics for thirty years and spent the next twenty reading ancient Indian texts, this leaves me in a bit of a bind. But I think I know what he meant. He knew this room is split. Half of you are family who want to know he is okay. Half of you are colleagues and students who know how his mind worked. And there is a small group here from a Tuesday night study circle he kept secret for fifteen years. He never mentioned them to me. I think he was protecting the work from the biography.

  So, I am not going to explain his philosophy. I am not a philosopher, and I am not sure I understand it fully, even now. But I am his nephew, and I knew the man.

  For thirty years, my uncle stood in front of classrooms and drew diagrams on chalkboards. He graded problem sets with a red pen that was always running out of ink. He cared about precision. He cared about the specific answer to the specific question. If you ask me who he was, I will tell you about the way he poured coffee, or how he laughed when he was tired, or the way he signed his name on birthday cards. These things were real. He was real.

  And then, for the last twenty years, he read. He read the Upanishads. He read Schrödinger. He came to believe something that is very difficult to say at a funeral. He believed that the separation we feel between ourselves and the world, and between ourselves and each other, is not the final truth. He believed that consciousness is not something we *have*, but something we *are*, and that it is not divided up into individual pieces like water in separate cups.

  He was impatient with the idea that "his" consciousness would survive his death. He thought that was a category error. He would say that consciousness was never plural to begin with.

  I know what that sounds like in a room like this. It sounds like I am telling you he didn't exist. It sounds like I am telling my aunt that she hasn't lost anyone. I want to be very clear: That is not what I am saying. And it is not what he would have wanted.

  He knew that grief is real. He knew that love is particular. He knew that when you lose someone, you lose a specific laugh, a specific warmth, a specific way of seeing the world. He did not think that realizing the universe is one big thing makes the loss of a husband or an uncle stop hurting. In fact, he thought pretending it doesn't hurt was a kind of dishonesty.

  He didn't want me to tell you he is at peace because he didn't think "he" was anywhere to be peaceful. But he also didn't think he was gone in the way we usually mean.

  I have been trying to understand what comfort is available here, without breaking his rules. Without lying.

  I think the comfort is in the Tuesday nights. I think it is in the fact that for fifteen years, he sat in a room with a small group of people, and they looked at these difficult, terrifying, beautiful ideas together. He didn't do that to escape the world. He did it because he thought it was the only way to truly meet it.

  He believed that the plurality we perceive is an appearance. But he also believed that the appearance is the only place the truth shows up. He graded those problem sets because the students were there. He loved my aunt because she was there. He didn't love "humanity"; he loved people.

  So, I cannot tell you he is watching over you. I cannot tell you that you will see him again in a place without time. But I can tell you this: The consciousness that was looking out of his eyes is the same consciousness that is looking out of yours. Not metaphorically. Not as a warm feeling of connection. But as a matter of fact, as he understood it.

  When you miss him, and you feel that ache, that is not a mistake. That is the particular meeting the universal. That is the real thing.

  He had a sense of humor about all of this. He would probably be rolling his eyes at me right now, worrying that I am taking it too seriously. He would tell me to check my watch, to stop philosophizing, and to go get a drink with the department chair. He knew that life is absurd. He knew that we are all just guessing. But he guessed with generosity. He guessed with kindness.

  We are here to honor the specific man. The one who wore the same tweed jacket until it fell apart. The one who annotated his books until there was no white space left. The one who sat with us, in this particular time, in this particular place.

  He asked us not to dress up the doctrines. So I won't. I don't know where he is. I only know where he was. He was here. He was with us. And in the way that matters most to those of us left behind, the love he gave was not an illusion. The loss is not an illusion.

  If there is a unity that holds us, I trust it is large enough to hold this grief, too.

  Thank you.
