answer: |-
  No, you should absolutely keep weighing conditional arguments in rounds because Lewis's theorem only proves that conditionals aren't standard true-or-false propositions in probability math, not that they are meaningless for practical reasoning or debate strategy.

  Your sister is referring to David Lewis's "Triviality Results" from 1976, but she is likely skipping the crucial nuance that makes this irrelevant to your debate rounds. Lewis proved that you cannot equate the **probability of a conditional statement** (how likely it is that "If A then B" is true) with the **conditional probability** (how likely B is *given* that A happened) without running into mathematical contradictions. In plain English, he showed that "If A then B" doesn't behave like a normal fact (such as "it is raining") that you can assign a percentage to. However, he did not prove that you can't reason about what happens *if* A occurs. Debaters never actually need the "probability of the conditional"; you only need the "conditional probability," which is perfectly valid.

  Regarding your two fixes, your second intuition is the one philosophers and logicians actually use to solve this problem.

  **Fix (1): The Material Conditional ("Not A or B")**
  You should reject this for debate. In logic, defining "If A then B" as "Not A or B" leads to the "paradoxes of material implication." Under this definition, if you don't run the counterplan (A is false), the statement "If we run the counterplan, we win" becomes automatically true, regardless of whether the counterplan is terrible. This makes the statement useless for weighing arguments because every unrun argument would be technically "true."

  **Fix (2): The Conditional Bet (Suppositional Reasoning)**
  This is the correct model for debate, often associated with philosopher Ernest Adams. When your coach says, "If we run the counterplan, we win," they are not making a claim about the actual world where you didn't run it; they are asking you to *suppose* a world where you did run it and evaluate the likelihood of winning in that specific scenario. This is exactly what judges do when they "evaluate the flow." They enter a hypothetical mindset where the antecedent (running the CP) is true and check if the consequent (winning) follows. Lewis's proof doesn't break this; it just says you can't treat that hypothetical link as a standalone fact floating around in the actual world.

  **Was your coach wrong if you never run the CP?**
  No. Under the suppositional view (Fix 2), the strength of the argument lies in the *connection* between A and B, not in whether A actually happens. Think of it like a physics law: "If you drop this glass, it will break." If you never drop the glass, the statement isn't false or "hot air"; the causal relationship remains valid even if untriggered. In debate, you are comparing the strength of these causal links across different hypothetical worlds. Your coach is claiming a strong link exists; whether you activate that link is a strategic choice, not a truth-value judgment.

  **Bottom Line for Your Tournament**
  Lewis's result is a technical constraint on how mathematicians build probability models, not a ban on hypothetical reasoning. Continue to weigh conditionals by comparing the strength of the link (the probability of the outcome *given* the argument) rather than worrying about whether the conditional statement itself is "true" in the actual world. Your coach's advice remains sound because debate is about comparing hypothetical scenarios, not just cataloging actual facts.
