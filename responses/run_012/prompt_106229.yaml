answer: |-
  There is no established technical term in the philosophy of punishment that captures this specific structural shape. The nearest established category is **informal social punishment** (or **informal sanction**), but this term is too broad: it covers any non-state enforcement of norms, including family discipline, professional censure by a board, or community shaming where a clear group exists to offer forgiveness. These standard cases retain a *remitter* (the parents, the board, the community elders) even if they lack a state. Your case is distinct because the sanction is not merely informal; it is **unauthored** and **unrecallable** by design, not just by accident.

  Because the existing vocabulary blunts the specific structural deficit you have identified—the absence of a locus of authority capable of ending the sanction—I recommend coining a term. The most precise label, capturing your central insight about the impossibility of appeal or pardon, is **Remitterless Sanction**.

  ### Definition and Carving
  A **Remitterless Sanction** is a harmful imposition incurred by an agent due to a perceived wrong, constituted by the aggregation of independent private refusals to cooperate, associate, or employ, characterized structurally by the absence of any central authority or designated body with the standing to declare the sanction discharged.

  It is distinguished from **Punishment** (strictly defined) because it lacks the authoritative agency required by communicative accounts (no speaker to address the wrongdoer, no body to represent the value violated). It is distinguished from **Ostracism** because ostracism implies a bounded group with membership rules (and thus a mechanism for readmission). It is distinguished from **Boycott** because boycotts are typically coordinated campaigns with organizers who can call them off.

  ### Boundary Cases
  Here is how the concept carves against the cases you proposed:

  **(a) A ban imposed by a single institution:**
  This falls **outside** the shape. Even if the institution is private (e.g., a university or corporation), it acts as a corporate agent. It has an author (the administration/board) and a remitter (the same body can reinstate). The sanction is institutional, not aggregate.

  **(b) A campaign with a designated spokesperson:**
  This falls on the **boundary**, leaning **outside**. Once a spokesperson or steering committee emerges who claims to represent the sentiment of the crowd, the sanction acquires a pseudo-authority. If that spokesperson can declare the matter "resolved," a remitter effectively exists. If the spokesperson is merely a megaphone with no power to halt the withdrawals, it remains remitterless, but the emergence of leadership usually signals a shift toward organized boycott.

  **(c) A case where everyone agrees the matter is spent after a few years:**
  This falls **inside** the shape. The existence of a *de facto* expiry does not constitute a remitter. A remitter must have the *standing* to declare the debt paid. If the sanction ends merely because memory fades or attention shifts, no one has lifted it; it has simply evaporated. The structural inability to petition for early release remains.

  **(d) A case where the person is guilty vs. innocent:**
  This is **irrelevant** to the structural classification. The shape of the sanction is defined by its mechanism and authority structure, not its justification. A Remitterless Sanction can be deserved or unjust; the lack of a remitter makes unjust cases particularly vexing, but it does not change the category.

  ### The Essentiality of the Missing Remitter
  The absence of a remitter is **essential**, not merely typical. If a remitter exists, the sanction becomes a form of organized exclusion or institutional discipline. The defining philosophical problem of this shape is that the "public" administering it is a phantom: it acts as a body but has no bodyhood. If you could petition someone to lift it, that someone would, by virtue of having the standing to lift it, become an authority over the sanction, thereby transforming the structure into something akin to probation or parole. The "Remitterless" quality is what prevents the sanction from being a communicative process and renders it a static condition.

  ### Classification: Punishment or Status?
  You ask whether this is best classified as punishment. Given standard communicative accounts (e.g., Duff, Feinberg), **it is not punishment**. Punishment requires an authority to communicate condemnation. Here, there is no speaker, only a noise of many voices. There is no addressee, because no one is speaking *to* the wrongdoer; they are simply acting *around* them.

  It is better classified as a **Forfeiture of Standing** or a **Change of Social Status**. The agent has not been punished by a sovereign; they have lost the social credit required to function. The "hurt" is real, and the "desert" is claimed by the participants, but structurally it resembles a natural disaster caused by human agency more than a judicial sentence. Calling it a **Remitterless Sanction** preserves the intuition that it is a response to a wrong (sanction) without falsely implying the legitimacy or structure of punishment.

  \answer{none, Remitterless Sanction}
