  ### Pre-Marking Brainstorm: Common Student Pitfalls

  Before looking at the specific script, here are the typical failure modes I anticipate when marking this question. I keep this list in mind to ensure I'm grading the *philosophy* and not just the prose.

  1.  **The "Memory Loss" Error:** Students claim the reasoning fails because students forget the induction by Thursday. This is a psychological solution to a logical problem. (Instant fail on part b).
  2.  **The "False Premise" Confusion:** Students say the announcement is simply *false* because the exam happened. This misses the point: the announcement was *true* (it was a surprise), so the issue is how the students reasoned from a true premise to a false conclusion.
  3.  **The "Bluffing/Trust" Error:** Students argue the chain breaks because the teacher might lie or change their mind. This confuses *epistemic logic* (what can be known) with *pragmatic trust* (will she do it?). The paradox holds even if the teacher is infallibly honest.
  4.  **The "Inconsistency" Trap (Your Flatmate's View):** Students argue the announcement is logically inconsistent (like the Liar Paradox) and therefore a surprise exam is impossible. This is a defensible philosophical position (Quine), **but** in the context of this specific question prompt—which explicitly states the exam *did* happen on Wednesday—this answer often fails to explain *how* it happened if it was impossible. It requires distinguishing between "true" and "knowable."
  5.  **The "Knowledge Iteration" Miss:** The strongest answers identify that the students assume they can *know* the announcement is true, or that knowledge is closed under deduction in a way that it isn't here. Students who miss the distinction between *P is true* and *Students know P* usually cap at a 6/10.
  6.  **Botching the Induction:** In part (a), students often mess up the order (e.g., ruling out Monday first) or fail to mention the "Thursday night" conditionality.

  ---

  ### Grading Breakdown

  **Total Mark: 6/10**

  **Part (a) Set out reasoning: 4/4**
  **Part (b) Diagnosis & Status: 1/4**
  **Clarity & Justification: 1/2**

  ---

  ### Feedback for Student

  **What you got right:**
  *   **Reconstruction (Part a):** Your summary of the students' backwards induction is excellent. You correctly identified the conditional structure ("Suppose the exam hasn't happened by Thursday night...") and the iterative elimination process. This is a perfect account of the reductio ad absurdum the students attempt.
  *   **Validity vs. Soundness:** You correctly noted that the reasoning is *valid* (the steps follow logically) and that the error must therefore lie in the premises or entitlements ("fault must be in what they're entitled to assume"). This shows good logical literacy.

  **Where the reasoning slips (Part b):**
  *   **Pragmatics vs. Epistemology:** You argue the chain collapses because "the teacher might change her mind, or might have been bluffing." This is a category error. The paradox is not about whether the teacher is trustworthy; it is about whether the students can *know* the date. Even if the teacher is infallibly honest and never changes her mind, the paradox arises. Your diagnosis turns an epistemic problem into a pragmatic one.
  *   **Contradicting the Prompt:** The question stipulates: *"As it happens, the exam is given on Wednesday and the class is surprised."* Your conclusion states: *"a teacher who genuinely means what she says can't set a surprise exam at all."* You have prioritized a theoretical diagnosis over the explicit facts of the scenario. A full-mark answer must reconcile the logic with the fact that the exam *did* occur.
  *   **The "Inconsistent" Claim:** While comparing this to the Liar Paradox is a known philosophical position (Quine), you did not justify it correctly. The Liar Paradox creates a truth-value gap; here, the announcement is clearly *true* (it was a surprise). The standard solution is not that the announcement is inconsistent, but that it is a **blindspot**: it is true, but it cannot be *known* by the students to be true. You missed the distinction between the *truth* of the announcement and the *knowability* of the announcement.

  **What a full-mark answer would have said:**
  *   It would have agreed that the exam happened and was a surprise (so the announcement was true, not inconsistent).
  *   It would have located the failure in the students' assumption that they can *know* the announcement is true *and* use that knowledge to deduce the day.
  *   It would have explained that the announcement creates a situation where, if the students come to *know* the exam is on Friday, it ceases to be a surprise, so they cannot *know* it is on Friday. The reasoning fails because it assumes knowledge is preserved through the deduction in a way that destroys the surprise condition.

  **Summary:**
  You have a strong grasp of the logical structure of the argument (Part a), but your resolution (Part b) relies on a "bluffing" objection that misses the epistemic point, and it concludes the scenario is impossible despite the prompt telling you it happened. You are arguing your flatmate's position, but in this specific context, it ignores the data.
