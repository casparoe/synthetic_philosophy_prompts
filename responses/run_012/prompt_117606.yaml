answer: |-
  Your flatmate has cornered you with a sophisticated version of a classic philosophical problem (the Duhem-Quine thesis), but he has made a critical error in **Step (5)**.

  You do not need to give up (3). You do not even need to give up (7). The break is in his comparison of the *mechanics* of scientific adjustment versus conspiracy adjustment.

  Here is how you escape the corner, which step breaks, and what criterion you actually use to replace the simplistic version of (3).

  ### 1. Where the Argument Breaks: Step (5)

  Your flatmate claims that the scientific examples (Neptune, Neutrinos, Stellar Parallax) are structurally identical to the conspiracy example (Moon Hoax). He argues that in both cases, an anomaly arose, and the theorists "posited something unseen" to save the theory.

  **This is false.** The structural similarity is superficial; the epistemic direction is opposite.

  *   **Science makes *risky* predictions.** When Le Verrier posited Neptune to save Newton's laws, he didn't just say "a planet exists." He calculated *exactly where it must be* in the sky. If astronomers had pointed their telescopes there and found nothing, Newton's laws would have been severely damaged. The adjustment *increased* the theory's exposure to falsification.
  *   **Conspiracy theories make *safe* accommodations.** When the Moon Hoax theorist says "the photos were faked," they are not risking a new observation. They are explaining away an old one. If you ask, "Where is the studio?" they say "Classified." If you ask, "Who directed it?" they say "Kubrick" (who is dead). If you find a studio, they say "Decoy."

  **The Break:** Step (5) claims every one of those scientific moves turned evidence against the theory into something anticipated.
  **The Correction:** No. Those scientific moves turned evidence against the theory into a **new test**. The conspiracy move turns evidence against the theory into **proof of the cover-up**.

  ### 2. Why It Looked Fine (The Trap)

  It looked fine because you are both focusing on the *past* (accommodation) rather than the *future* (prediction).

  In the short term, a struggling theory and a conspiracy theory look the same: both are scrambling to explain why reality doesn't match their model. This is the "toothless" worry your flatmate raised. If you only look at a single snapshot in time, a scientist positing a neutrino looks a lot like a conspiracist positing a secret lab.

  But science is a movie; conspiracy theory is a loop.
  *   **Neutrino:** Posited in 1930. Detected in 1956. The theory stuck its neck out for 26 years.
  *   **Moon Hoax:** Posited in 1970s. Today, the explanation for new high-res photos is still "CGI." The theory never sticks its neck out.

  ### 3. What You Buy Instead of (3)

  You don't have to discard (3), but you must upgrade it. The flatmate is attacking a "Straw Popper" version of falsifiability (i.e., "Can I imagine a world where this is false?"). You can imagine a world where the Moon Hoax is false (we just find the director). That's not enough.

  You need to replace (3) with the **Lakatosian Criterion of Progressive Problem Shifts** (or, in Bayesian terms, **Novel Predictive Success**).

  **The Old (3):** "A theory is irrational if no evidence can count against it."
  **The New (3*):** "A theory is irrational if its adjustments only accommodate past anomalies without generating *novel, independent, and risky* predictions."

  **What this costs you:**
  It costs you the ability to dismiss a conspiracy theory *instantly* based solely on its structure. You have to admit that a conspiracy theory *could* be rational if it started making successful, risky predictions.
  *   *Example:* If the Moon Hoax theorists said, "The original film reels are stored in Vault X in Nevada, and if you go there on Tuesday, you will see temperature fluctuations consistent with film storage," and then you went and found that... well, then you'd have to take them seriously.
  *   Since they never do this, they fail the criterion.

  ### 4. How to Counter the "Prior Probability" Objection

  You mentioned you tried arguing about the "number of people" (the silence problem) and he dismissed it as "asserting a prior." He was technically right to dismiss it *in that form*, because you were arguing about the *content* of the theory rather than the *method*.

  Here is how you reframe that argument so it isn't question-begging:

  Don't argue that "Thousands of people can't keep secrets." Argue that **the conspiracy theory has no mechanism for error correction.**
  *   **Science:** If Le Verrier had calculated wrong, the scientific community would have rejected the Neptune hypothesis. The system has a built-in "error-correcting" mechanism (peer review, replication).
  *   **Conspiracy:** If a conspiracist claims the studio is in Nevada and it isn't, they don't abandon the theory. They move the studio to Arizona. There is no mechanism that allows the theory to *die*.

  A system that cannot die is not a theory; it is a faith.

  ### Summary for Your Flatmate

  Tell him this:

  1.  **I keep (7):** Science is rational.
  2.  **I keep (3*):** Unfalsifiability is still the problem, but defined dynamically, not statically.
  3.  **I reject (5):** Your scientific examples are false equivalents.
      *   Newton + Neptune = "Look at *this specific coordinate*." (Risky)
      *   Copernicus + Distance = "Wait until our instruments improve." (Testable future condition)
      *   Moon Hoax + Cover-up = "The evidence is hidden/faked." (Immunizing strategy)
  4.  **The Demarcation:** A theory is rational if its "rescue hypotheses" expand our empirical knowledge (predict new things). It is irrational if its "rescue hypotheses" only shield the core from existing knowledge (explain away old things).

  **The Exit:**
  "You're right that science sometimes posits unseen things to save a theory. But science posits them to *find* them. Conspiracy theories posit them to *hide* them. One opens the world to new tests; the other closes the world to testing. That is the difference between a hypothesis and a hole."
