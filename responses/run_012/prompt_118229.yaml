answer: |-
  Your question is not malformed, but your mapping of the logical space contains a specific imprecision that is likely contributing to your confusion. You suspect three rules might survive her four verdicts: **Instrumentalism** (Good's Theorem), **Experientialism** (feelings matter), and **Veritism** (truth has intrinsic value).

  Here is the direct read: **Veritism is already dead.** Her stated position ("where nothing you do depends on it, its value is exactly zero") and her verdict on Case 3 (irrelevant lottery numbers are worth *nothing*, not just *not enough to bother with*) explicitly rule out the idea that true belief is worth having on its own. If truth had intrinsic value, Case 3 would have positive value, even if small. Her claim that the value is *exactly zero* is the coffin nail for Veritism.

  This leaves you with two surviving rules that fit Cases 1–4 equally well:
  1.  **Strict Instrumentalism:** Information is a tool. Value = Improvement in expected utility of actions. Feelings about knowing are costs of acquisition, not value of the information.
  2.  **Experiential Consequentialism:** Information is an experience. Value = Improvement in actions + Utility of the psychological state of knowing (relief, dread, closure).

  Here is the breakdown of the stuck case, the prediction, and the separating test.

  ### 1. What she should say (Consistency)
  To be consistent with her **stated position** (Good's Theorem), she must **decline the test**.

  Good's Theorem states that free information cannot lower expected utility *because it can be ignored*. However, this theorem assumes the utility function is defined over world-outcomes, not information-states. If "knowing" itself causes dread, that dread is a cost of acquiring the signal.
  *   **Instrumental Value:** Zero (you stipulated the action space is empty).
  *   **Acquisition Cost:** Positive (the dread weighs on her).
  *   **Net Value:** Negative.

  A strict Good's Theorem adherent treats the "dread" not as a property of the information's value, but as a transaction cost. Since the gross value is zero (no action change) and the cost is positive, the net value is negative. She should decline.

  To be consistent with **Experiential Consequentialism**, she must also **decline the test**.
  *   **Instrumental Value:** Zero.
  *   **Experiential Value:** Negative (you stipulated dread outweighs relief).
  *   **Net Value:** Negative.

  **Conclusion:** In this specific stipulation (Dread > Relief, Empty Action Space), both surviving rules converge on the same verdict: **Decline.** If she accepts the test, she is inconsistent with *both* rules that fit her track record.

  ### 2. What she will say (Prediction)
  Despite the logic above, I predict she will **accept the test**, or struggle to justify accepting it.

  Why? Because human intuition strongly favors "closure" or "knowing one's fate" even when instrumentally useless. In your argument, she likely tried to find a hidden "action" to save Good's Theorem (e.g., "I can mentally prepare," "I can adjust my subjective probability," "I can value authenticity"). But you stipulated those away.

  If she accepts, she is revealing that she is actually an **Experiential Consequentialist** who *thinks* she is an Instrumentalist. She likely believes the relief of the 70% all-clear outweighs the dread of the 30% bad news, despite your stipulation. Or, she values "not being deceived" as a pseudo-action. If she accepts, her stated theory (Good's Theorem) is false for her, even if her verdicts on 1–4 were compatible with it.

  ### 3. The Separating Case
  Since Case 5 yields the same verdict (Decline) for both surviving rules, it cannot separate them. You need a case where Instrumental Value is Zero, but Experiential Value is Positive.

  **Case 6: The Relief Test**
  *   **Setup:** A free, perfectly reliable test for a rare, untreatable, incurable condition.
  *   **Stipulations:**
      *   She has no specific fear of this condition (it is obscure).
      *   If positive: No symptoms for 20 years, then sudden death. No planning possible (too far off), no treatment.
      *   If negative: She lives a normal lifespan.
      *   **Crucial Change:** She has been vaguely worried about her health generally. A negative result would provide significant **relief** (positive experiential utility). A positive result would cause negligible dread (it's too far off to feel real).
      *   **Action Space:** Empty. No financial, medical, or family arrangements change regardless of the result.
  *   **The Separation:**
      *   **Strict Instrumentalist:** Value = 0. (No decision changes). She should be **indifferent** (or decline if there is any trivial cost/effort).
      *   **Experiential Consequentialist:** Value > 0. (Relief outweighs negligible dread). She should **accept**.

  **Why this separates them:**
  In Case 5, the experiential term was negative, aligning with the instrumental term (zero). In Case 6, the experiential term is positive, while the instrumental term remains zero. If she takes the test in Case 6, she admits that the *feeling of knowing* is part of the value, contradicting her seminar denial. If she declines/ is indifferent, she is a consistent Instrumentalist.

  ### Summary of the Disagreement
  You are not imagining the ambiguity. Her verdicts on 1–4 are underdetermined between Instrumentalism and Experientialism. However, your suspicion that Veritism (Intrinsic Truth) might survive is the imprecision: her Case 3 verdict kills it.

  The argument you had last night likely stalled because Case 5 is a "double negative" case (No Action Value + Negative Experience Value), which forces both theories to say "No." You need Case 6 (No Action Value + Positive Experience Value) to force her to choose between her theory and her intuition.

  **Final Verdict:** If she wants to be consistent with her stated Good's Theorem position, she must decline Case 5. If she accepts, she is an Experientialist masquerading as an Instrumentalist. The question is well-posed, but the "Intrinsic Truth" option was a red herring eliminated by her own Case 3 verdict.
