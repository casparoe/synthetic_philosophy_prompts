  Ok so I'm a backend engineer, no physics or philosophy degree, and I've gone down a Maxwell's-demon shaped hole over the weekend. I know the standard move is "the demon has to pay for the information somehow," but *what* it pays for, and *when*, keeps slipping out of my hands. I have a bunch of gut verdicts on specific setups and I want you to figure out what principle, if any, they add up to. Please don't just recite the usual Landauer/Bennett stuff at me — I've seen the Wikipedia version. Actually test candidate principles against my cases and tell me which of my verdicts has to go.

  Take each case as a setup where we ask: does this demon beat the second law — net work out of a single heat bath, in a full cycle, with everything counted?

  1. Szilárd engine, one molecule in a box. Measure which side it's on, insert a partition, let the molecule push a tiny piston, harvest the work, then reset the one-bit memory back to blank. Gut: no win. The reset is where it dies — clearing that bit costs at least kT ln 2, which is exactly what I got out.

  2. Same as (1), but the memory is a write-once tape that's never erased and never reused. Each cycle adds one new bit and you just keep the tape, or archive it. Gut: honestly this one makes me nervous. If nothing is ever erased I can't see the bill. My gut says it might actually win, which I'm definately pretty sure means my gut is broken somewhere.

  3. Demon pre-loaded with the answers: a cheat sheet that already lists where every molecule will be for the next hour. Gut: no win, but not because of the demon — whoever wrote the cheat sheet already paid, so the cost just moved upstream. Feels like the cost doesn't vanish, it relocates.

  4. Feynman ratchet, no measurement at all, just a pawl on a gear. Gut: no win, and this one doesn't even feel like an information problem — the pawl itself gets jostled by the same thermal bath, so it fails for a boring mechanical reason.

  5. The demon is a Python script on my laptop, and I count the laptop's waste heat. Gut: no win, obviously, the thing thermal-throttles before it does anything interesting.

  6. Same as (1), but I erase the demon's memory using a reservoir that's *colder* than the gas. Gut: this one feels like it might sneak a win, and I can't articulate why, which is exactly the kind of feeling I don't trust.

  My tentative principle: "a demon only beats the second law if it gets information for free, and information is never free — you either pay to acquire it or you pay to clear it." That handles 1, 3, 4, 5 fine. It fumbles 2 (nothing is cleared) and 6 (clearing is cheap because it's cold).

  So: what's the best principle, or small set of principles, that actually covers these? Test them honestly against the cases, and if you have to keep a messy principle to save all six verdicts versus a cleaner one that kills one of them, say so and tell me which. Also tell me what your surviving principle predicts for a case I haven't listed: a demon with no measurement and no memory at all — just a fixed, pre-programmed, time-varying force I apply to the gas, no feedback loop. Is that even a demon? Does my principle have anything to say about it? And be honest about which of my six gut calls it can't accommodate.

  You can play the role of a physicist-philosopher of statistical mechanics who actually cares about getting the accounting right — start by brainstorming three or four candidate principles, then stress-test them one by one, then commit. Be careful about the difference between "the demon is impossible" and "the demon is possible but useless," and about where the entropy actually ends up.

  End your answer with a final line in exactly this form, nothing after it:

  \answer{principle: <short statement of the surviving principle>; overturned: <which of my verdicts, if any, it forces me to drop>}
