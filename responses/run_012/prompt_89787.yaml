answer: |-
  You're thinking about this exactly right for a backend engineer: you're looking for the transaction log, the state mutations, and the cycle closure. The confusion arises because "information" in thermodynamics isn't abstract data; it's a physical resource like voltage or pressure.

  Let's brainstorm three candidate principles to see which one actually balances the books.

  ### Candidate Principles

  1.  **The Landauer Erasure Principle:** "Information is physical. Erasing one bit of information necessarily dissipates at least $kT \ln 2$ of heat into the environment."
      *   *Focus:* The reset step.
      *   *Weakness:* It focuses too much on the *end* of the cycle. It struggles to explain Case 2 (where you don't erase) or Case 6 (where you erase cheaply) without hand-waving.

  2.  **The Global Entropy Balance:** "The total entropy of the system (Gas + Demon + Bath) must never decrease. Work extraction reduces gas entropy, so demon or bath entropy must increase to compensate."
      *   *Focus:* The accounting ledger.
      *   *Weakness:* It's tautological ("entropy never decreases"). It tells you *that* you must pay, but not *how* or *where* the mechanism fails in specific setups like the ratchet.

  3.  **The Information-as-Fuel Principle:** "Mutual information between the demon and the gas is a thermodynamic resource (negentropy). You can burn it to extract work from a single bath, but to run a cycle, you must regenerate that resource, which costs work unless you have a second, colder bath."
      *   *Focus:* The correlation as a consumable.
      *   *Strength:* It treats information like battery charge. You can spend it (Case 2), but you can't magically recharge it for free (Case 1) without a gradient (Case 6).

  ### Stress-Testing the Candidates

  Let's run **Principle 3 (Information-as-Fuel)** against your cases. This is the strongest candidate because it unifies the mechanics with the accounting.

  *   **Case 1 (Standard Szilárd):** You burn 1 bit of correlation to get work. To close the cycle, you must regenerate the blank bit. Regenerating a blank bit from a random one requires dumping entropy to the bath. Cost = Gain.
      *   *Verdict:* **No win.** (Matches your gut).
  *   **Case 2 (Write-Once Tape):** You burn 1 bit of correlation to get work. You do *not* regenerate the bit. You have extracted work, but you have consumed a piece of "blank tape" (low entropy state). The tape is now "used" (high entropy).
      *   *Analysis:* This is not a cycle; it's a fuel cell. You get work out, but you deplete the negentropy stored in the blank tape. Once the tape is full, the engine stops.
      *   *Verdict:* **No win (against 2nd Law).** It works transiently, but it doesn't violate the law because the tape's entropy increased. Your gut ("might actually win") is half-right (you get work) but wrong on the physics (it's not a violation, it's consumption).
  *   **Case 3 (Cheat Sheet):** The correlation was pre-loaded. The "fuel" was burned upstream by whoever wrote the sheet.
      *   *Verdict:* **No win.** (Matches your gut).
  *   **Case 4 (Feynman Ratchet):** No measurement means no correlation established ($I=0$). You have no fuel to burn. The pawl is just part of the thermal noise.
      *   *Verdict:* **No win.** (Matches your gut).
  *   **Case 5 (Python Script):** The laptop is the demon + bath. Inefficiencies mean you burn way more electrical work to create the correlation than you get back from the gas.
      *   *Verdict:* **No win.** (Matches your gut).
  *   **Case 6 (Cold Reset):** You burn correlation to get work from the hot gas. You regenerate the correlation by dumping heat into a *cold* bath.
      *   *Analysis:* This *does* produce net work. However, it is no longer a "single heat bath" engine. It is a standard Carnot heat engine operating between $T_{hot}$ (gas) and $T_{cold}$ (reset reservoir). The "demon" is just the mechanism.
      *   *Verdict:* **No win (against 2nd Law definition).** You defined "beating the second law" as "net work out of a **single** heat bath." This setup uses two. It doesn't violate the law; it utilizes a temperature gradient. Your gut ("sneak a win") is dangerous here because it implies a violation, not a standard engine.

  ### The New Case: Pre-Programmed Force

  **Setup:** A demon with no measurement and no memory, just a fixed, time-varying force (open-loop control).
  **Prediction:** **No net work.**
  **Reasoning:** Without measurement, there is no mutual information established between the demon and the molecule. The force is independent of the molecule's state. By Liouville's theorem, you cannot compress the phase-space volume of the gas (reduce its entropy) using Hamiltonian dynamics alone without feedback. On average, the force will push the molecule as often as it hinders it. It's not a demon; it's just a vibrating wall. To be a demon, you need the feedback loop (measurement $\to$ correlation $\to$ action).

  ### Which Verdicts Must Go?

  Your tentative principle ("pay to acquire or pay to clear") was close, but it missed the nuance of *consumption* versus *cycling*.

  1.  **Verdict 2 (Write-Once Tape):** You must drop the idea that this "might win" against the Second Law. It produces work, yes, but it consumes the tape's low-entropy state. It is a battery, not a perpetual motion machine. If you count the tape's entropy increase, the books balance.
  2.  **Verdict 6 (Cold Reset):** You must drop the feeling that this "sneaks a win" against the Second Law. It produces work, but only by exploiting a temperature difference (two baths). Under your own definition ("single heat bath"), this is a failure case, not a win. It's a heat engine, not a law-breaker.

  ### The Surviving Principle

  The principle that survives is the **Information-as-Fuel** view, tightened to account for cycles and bath constraints.

