answer: |-
  Here is the adjudication of the exchange between Rowan and Mira.

  ### Move-by-Move Adjudication

  **Rowan (1): Partly Right.**
  Rowan is correct that commemorating a demonstrable falsehood regarding victimization carries moral risk and can obscure injustice. However, the claim that a community has "no right" to commemorate a fiction is too rigid. Collective memory often operates through mythopoetic structures that serve social cohesion, not just factual recording. While the *specific* fiction here hides coercion, the blanket prohibition ignores the distinction between foundational myths and historical deception.

  **Mira (1): Clearly Right.**
  Mira correctly identifies the ontological difference between history and collective memory. Memory is not merely failed history; it is a normative practice that sustains identity and values over time. Her point that the ritual encodes a commitment (a "ought") rather than a chronology (an "is") is philosophically sound. The value of the ritual lies in its performative reinforcement of solidarity, regardless of the empirical origins.

  **Rowan (2): Clearly Right.**
  Rowan successfully pierces Mira's defense by asking *whose* commitment is being encoded. By highlighting the power dynamic (heroes vs. coerced laborers), Rowan shows that the current memory is not just inaccurate but ethically asymmetrical. The proposal to reframe the ritual as atonement is a constructive synthesis: it preserves the ritual's form while correcting its moral content. This move shifts the debate from "truth vs. lie" to "justice vs. vanity."

  **Mira (2): Partly Right.**
  Mira is right to warn against the "expropriation" of memory by external experts; democratic self-determination requires that a community own its narrative changes. However, she risks romanticizing community agency. A community does not have an unconditional right to self-definition if that definition relies on the erasure of marginalized subgroups (like the refugee descendants Rowan mentions). "Confiscation" is a strong metaphor, but sometimes external critique is necessary to break internal silences.

  **Rowan (3): Clearly Right.**
  Rowan's insistence that the community is not a monolithic subject is crucial. By invoking the descendants of the refugees, Rowan demonstrates that the "community's memory" is already contested internally. The demand for an account ("'It is ours' is not an account") is a demand for public reason. Traditions cannot be justified solely by their existence; they require moral justification when they conflict with established records of harm.

  **Mira (3): Clearly Right.**
  Mira's final move is the strongest of the debate. She accepts Rowan's moral pressure but rejects the binary choice between "historical accuracy" and "communal memory." By arguing for integration (acknowledging coercion *within* the ritual of solidarity), she preserves the function of memory (continuity) while accommodating the function of history (accuracy). She correctly notes that the historical record is also an interpretation, preventing the historians' account from becoming a new dogma.

  ### Overall Verdict

  **Mira is more right overall.**

  While Rowan successfully identifies the moral injury and the internal pluralism of the town, Mira provides the superior philosophical framework for resolution. Rowan's approach risks a simple substitution: replacing a comforting myth with a harsh historicism that might shatter the community's capacity for solidarity without offering a way to rebuild it. Mira recognizes that memory is a living practice, not a static claim. Her argument allows the town to absorb the historians' findings *into* the ritual rather than letting the findings *replace* the ritual. This preserves the community's agency (addressing her own point in Move 2) while satisfying Rowan's demand for truth and atonement (addressing his point in Move 3). Mira's path leads to a more complex, mature identity; Rowan's path leads to a correction that might be morally pure but socially brittle.

  ### What Both Are Missing

  1.  **The Policy Link:** The prompt notes the story is invoked when debating whether to accept *newcomers*. Neither speaker explicitly connects the revision of the ritual to current civic policy. If the ritual justifies exclusion ("we saved them once, we are full"), correcting the memory might change current immigration attitudes. If the ritual justifies inclusion ("we are a sheltering people"), correcting it might undermine humanitarian arguments. The adjudication of the ritual should depend on what *future* actions it is meant to license.
  2.  **The Specific Agency of Descendants:** Rowan mentions the descendants of the refugees, but neither speaker argues that *these specific people* should lead the revision process. Both treat the problem as a negotiation between "the town" (as a whole) and "the historians." The most just outcome would likely involve ceding authority over the ritual's revision to the descendants of the coerced laborers, rather than the town council or the academic team.
  3.  **The Limits of the Record:** Mira mentions the record is incomplete, but neither presses the epistemic vulnerability of the historians' account. Tax records and poor-law correspondence reveal the *administrative* truth, but they may miss informal acts of kindness that occurred alongside the coercion. A truly robust memory might hold both the structural coercion and the individual resistance in tension, rather than choosing one narrative over the other.
