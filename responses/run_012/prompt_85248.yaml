  # Joint Statement on Moral Priorities and Future Impact

  **Date:** October 26, 2023
  **Signatories:** [Name 1] (The Longtermist), [Name 2] (The Skeptic)

  ## 1. Shared Claims

  We agree on the following foundational premises. These claims establish the structure of our disagreement without resolving it.

  1.  **Moral Relevance of the Future:** The well-being of future people matters morally. We disagree on the weight of this matter relative to present people, but neither of us claims the future is morally irrelevant.
  2.  **Resource Constraints:** Resources (time, money, effort) are limited. Allocating resources to one end necessarily reduces resources available for others.
  3.  **Empirical vs. Moral Distinction:** Our disagreement consists of both moral claims (how we should value different outcomes) and empirical claims (what outcomes our actions will actually produce).
  4.  **Uncertainty Matters:** Uncertainty about the consequences of an action should reduce the confidence we have in that action's value. We disagree on the rate at which confidence decays over time and distance.
  5.  **Evidence Standard:** Claims about the future should be judged by the same standards of evidence as claims about the present. Extraordinary claims require extraordinary evidence, though we disagree on what counts as "extraordinary" in this context.
  6.  **Definition of Priority:** When we use the word "priority," we refer to the allocation of marginal resources. To say X is a higher priority than Y is to say that an additional unit of resource should be spent on X rather than Y.
  7.  **Definition of Negligible:** When we use the word "negligible," we refer to a quantity too small to influence a decision given current uncertainty. We agree that a probability can be so low as to be negligible, but we disagree on where that threshold lies.

  ## 2. Remaining Disagreements

  The following table summarizes our substantive disagreements. We have formulated each position to be acceptable to the holder of that view, avoiding caricature.

  | Topic | The Longtermist Position | The Skeptic Position |
  | :--- | :--- | :--- |
  | **Weight of Future Welfare** | The potential number of future lives is so vast that even a tiny fraction of their total welfare outweighs the total welfare of all present people. | The welfare of existing people commands a higher moral weight than potential future people, or else the uncertainty regarding the future is too high to allow such comparison. |
  | **Predictive Reliability** | We can identify specific actions today that reliably improve the trajectory of civilization over centuries or millennia, despite uncertainty. | Our capacity to forecast consequences degrades rapidly over time; beyond a short horizon, causal models are indistinguishable from noise. |
  | **Risk vs. Certainty** | A small probability of preventing permanent civilizational collapse is more valuable than a certainty of improving present-day welfare. | A certainty of improving present-day welfare is more valuable than a small probability of preventing collapse, due to the risk of model error. |
  | **Verbal Clarification** | *None.* This is a substantive moral and empirical claim. | *None.* This is a substantive moral and empirical claim. |

  ## 3. Cruxes

  We identify the following sub-questions as "cruxes." Settling these questions would genuinely move at least one of us toward the other's position.

  1.  **The Epistemic Crux:** Is it possible to construct causal models of social and technological change that retain predictive power beyond a 100-year horizon?
      *   *Who moves:* The Skeptic would move toward Longtermism if reliable long-term modeling were demonstrated. The Longtermist would move toward Skepticism if it were proven that such modeling is impossible.
  2.  **The Leverage Crux:** Do present-day actions have stable, lock-in effects that persist for centuries, or do social systems self-correct and erase present influences over time?
      *   *Who moves:* The Longtermist would move toward Skepticism if evidence showed that present actions rarely have stable long-term effects.
  3.  **The Valuation Crux:** Does the sheer magnitude of the potential future population outweigh the high confidence we have in present-day needs?
      *   *Who moves:* The Skeptic would move toward Longtermism if they accepted that potential lives weigh equally to actual lives without a heavy discount rate for uncertainty.

  ## 4. Tests and Cases

  For each crux, we propose a test, case, or argument that bears on the question. We record our predictions and thresholds in advance.

  ### Case A: The Decision-Theoretic Test (Addresses The Valuation Crux)
  **Scenario:** Consider an intervention that costs $1. On its best estimate, it has a specific probability of preventing a permanent collapse of civilization (ending all future potential lives). Otherwise, it does nothing. We compare this to giving $1 to a proven near-term health intervention (e.g., bednet distribution) that saves a known fraction of a life.

  **Question:** At what probability of success does the collapse-prevention intervention become the better use of funds?

  *   **The Longtermist Prediction:**
      *   **Threshold:** I would continue funding the collapse-prevention intervention until the probability drops below 1 in 10^15 (one in a quadrillion).
      *   **Reasoning:** The value of the future is astronomically large. Even a minuscule fraction of that value exceeds the value of a single present life. I accept the risk that the model is wrong, provided the model is not demonstrably absurd.
  *   **The Skeptic Prediction:**
      *   **Threshold:** I would stop funding the collapse-prevention intervention if the probability drops below 1 in 1,000.
      *   **Reasoning:** At probabilities this low, the estimate is more likely to be a result of model error than reality. The "expected value" is an illusion created by multiplying a huge number by an unreliable tiny number. I prioritize the known value of the health intervention.

  ### Case B: The Epistemic Test (Addresses The Epistemic Crux)
  **Scenario:** We establish a forecasting tournament. Participants make specific, falsifiable predictions about social and technological variables (e.g., energy prices, governance structures, population levels) at 10-year, 50-year, and 100-year intervals.

  **Question:** What result would cause the Longtermist to abandon their position?

  *   **The Longtermist Condition for Abandonment:**
      *   **Requirement:** I would abandon strong longtermism if data shows that forecast accuracy at the 100-year horizon is statistically indistinguishable from random chance (baseline noise) across multiple domains, despite expert effort.
      *   **Reasoning:** My position relies on the premise that we can identify levers that improve the long-term trajectory. If trajectory changes are fundamentally unpredictable, we cannot claim to improve them.
  *   **The Skeptic Condition for Abandonment:**
      *   **Requirement:** I would abandon strong skepticism if data shows that expert forecasts at the 100-year horizon consistently outperform baseline models with high confidence.
      *   **Reasoning:** My position relies on the premise that complexity erodes predictability. If experts can reliably navigate this complexity, my objection regarding unreliability fails.

  ### Case C: The Historical Leverage Test (Addresses The Leverage Crux)
  **Scenario:** We examine historical interventions intended to have permanent effects (e.g., founding of constitutions, establishment of international norms, containment of dangerous technologies).

  **Question:** What percentage of these interventions retain their intended effect after 200 years?

  *   **Shared Metric:** We agree to review a set of 50 historical cases.
  *   **The Longtermist Prediction:** At least 20% of these cases show stable, intended effects persisting to the present.
  *   **The Skeptic Prediction:** Less than 5% of these cases show stable, intended effects; most outcomes are dominated by unforeseen subsequent events.

  ## 5. Closing Statement on Mind-Changing

  We acknowledge that this document does not settle our dispute. It serves to clarify the conditions under which we might update our views.

  **What The Longtermist Needs to See:**
  To significantly reduce emphasis on longtermism, I need to see empirical evidence that human forecasting capacity hits a hard ceiling before the 100-year mark, or that present actions rarely correlate with outcomes beyond that horizon. Abstract arguments about uncertainty are insufficient; I require data on forecast decay rates.

  **What The Skeptic Needs to See:**
  To significantly increase emphasis on longtermism, I need to see a track record of successful interventions where resources spent today yielded verified, positive outcomes centuries later. I need to see that the "expected value" calculations survive contact with reality over long timeframes.

  **Is There a Settling Condition?**
  We agree that there is no single experiment that will definitively settle the matter immediately. The future has not happened yet. However, we agree that improving our metrics for long-term forecasting accuracy is the most productive path toward convergence. If we can quantify how much trust to place in 100-year models, we can calculate the appropriate discount rate for future impact. Until then, we agree to disagree on the allocation of marginal resources, while cooperating on interventions that satisfy both near-term welfare and robust long-term safety.

  **Signed,**

  _________________________
  (The Longtermist)

  _________________________
  (The Skeptic)
