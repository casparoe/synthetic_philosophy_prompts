  She will say the requirement is binding, so that the fifty-eight per cent majority is simply defeated. Her verdicts follow a principle of **agency preservation**: she enforces precommitments that secure the conditions of autonomous agency (sobriety, life, fundamental rights, deliberative stability) against internal or external erosion, but voids those that alienate future agency or lock in mundane policy. Ulysses, the alcoholic, and the dementia patient preserve the self against impairment; constitutional rights preserve the political self against majoritarian whim. Conversely, the religious covenant alienates the right of exit (destroying agency), and the zoning provision locks in policy rather than principle (frustrating self-government). The new case mirrors the constitutional entrenchment she upheld: it protects a Bill of Rights via a deliberative procedure, enhancing rather than alienating democratic agency. The fact that deliberation occurred does not waive the supermajority requirement, just as Ulysses' pleading did not waive the binding; the procedure is the safeguard, not merely a proxy for deliberation.

  Two rival rules fit her record equally well. The **Impaired Agency Rule** holds that precommitments are valid only when the later self is compromised (drunk, dementia, siren-song); this fits Ulysses, the alcoholic, and the dementia case, but struggles with the constitutional entrenchment where the later legislature is competent. The **Formal Hierarchy Rule** holds that precommitments are valid only at the constitutional level, not the contractual or municipal level; this fits the constitutional vs. zoning/covenant split, but fails to explain why the alcoholic's private contract was enforced.

  The case that best separates these rules is a **state constitutional amendment entrenching a specific economic policy, such as a fixed tax rate or sports subsidy, amendable only by supermajority**. If she strikes this down, her rule is substantive (Rights vs. Policy), confirming the agency preservation reconstruction. If she upholds it, her rule is formal (Constitution vs. Contract/Charter), supporting the Hierarchy Rule.

  My reconstruction is likeliest to break down on the distinction between the **City Charter** and **Constitutional** cases. If it turns out she voted against the zoning entrenchment not because it was policy rather than rights, but because *local* governments lack the sovereignty to entrench any provision against future majorities, then the new case might fail if the state referendum is viewed as statutory rather than constitutional. Specifically, if she reveals that **any self-entrenchment of amendment procedures is void as a paradox of sovereignty**, regardless of the subject matter, I would move to the opposite prediction; this would imply her approval of the earlier constitutional case rested on the substantive rights entrenched, not the procedural lock, and that locking the *procedure itself* crosses a line the zoning case also crossed.
