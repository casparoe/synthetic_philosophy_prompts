prompt: |-
  ok, sanity check before I write this up for a seminar on transitional justice. Roughly where I've landed: (1) retributive desert is real and backward-looking — someone who did the thing deserves to suffer for it, and that's not just a convention; (2) conditional amnesty, full public disclosure with no prosecution, was the right call where a negotiated transition made trials impossible, and it wasn't merely the lesser evil; (3) what victims are owed is acknowledgment rather than information — a wrong that never gets publicly recorded as a wrong against a particular person stays a wrong in the present tense, it doesn't just become history; (4) forgiveness is a good thing, and a truth commission can stand in for the community's forgiveness or at least make it possible; (5) a state can owe an apology and reparations for what a previous regime did, including to citizens who weren't born yet; (6) none of this requires moral principles to be suspended in politics — I'm not a dirty-hands person, I just think morality demands something different in the political case.

  Which of these actually pull against each other, how bad is each clash, and what's the cheapest repair, plus what it costs? I have a feeling (1) and (4) are at odds but that might just be the obvious reading. Rank by severity rather than flagging everything as equally bad, tell me which pairs only look like they clash, and dont give me a lecture on the literature — I want the audit. British English please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Sanity check a set of six propositions for a seminar on transitional justice.
      *   **Goal:** Identify conflicts/tensions between the propositions, rank them by severity, suggest repairs, and estimate costs. Distinguish real clashes from apparent ones.
      *   **Constraints:** No lecture on literature (keep it practical/audit-style), British English, rank by severity.
      *   **The Propositions:**
          1.  Retributive desert is real/backward-looking (deserving suffering).
          2.  Conditional amnesty (no prosecution) was right/not just lesser evil in negotiated transitions.
          3.  Victims owe acknowledgment > information (wrong stays present if unrecorded).
          4.  Forgiveness is good; TCs can stand in for/make possible community forgiveness.
          5.  State owes apology/reparations for previous regime (including to unborn citizens).
          6.  No moral suspension in politics (not dirty-hands); morality demands something different in political cases.

  2.  **Initial Scan for Tensions:**
