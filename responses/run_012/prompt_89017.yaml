      4.  Strategic Recommendation.

      *Wait, one more check on (1) vs (2).* If (2) says amnesty was "the right call... not merely the lesser evil," it claims positive moral value. (1) says justice requires suffering. This is the "Justice vs. Peace" debate but framed ontologically. The repair must address whether "justice" is monolithic.

