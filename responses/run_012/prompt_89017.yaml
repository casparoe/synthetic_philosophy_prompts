      *Refining the (5) point:* Unborn citizens. This is about intergenerational justice. (1) is about backward-looking desert. (5) is forward-looking obligation based on past wrongs. They clash on the *basis* of the obligation.

  6.  **Final Polish:** Check against constraints.
      *   British English? Yes.
