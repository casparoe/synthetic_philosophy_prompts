prompt: |-
  Hey — I need help drafting something before Thursday and I keep going in circles on it.

  I'm a 4th-year PhD student (philosophy, but I hang around the science-studies people) and I'm the grad rep on our university's research integrity committee. We've got a case Thursday that's turned into a mess, and I have to circulate a written opinion before the meeting, and I cant get my head straight about what we're even deciding.

  The case, roughly: a lab here published Paper A in 2019 on a dataset they'd been building for years — call it D, about 12k coded records. Then over four years they "cleaned and expanded" it. They dropped a couple thousand rows they decided were bad, fixed a coding bug that had flipped one variable, re-coded a big chunk of the survivors under new guidelines, and collected ~6k new records with a slightly changed instrument (one survey item reworded, coders trained differently). Same DOI the whole time, updates just pushed live; someone who downloaded D in 2020 and someone who downloads it today get pretty different objects under one landing page, one name, one citation. This year they published Paper B, which calls it "the same dataset, now larger," and the abstract says the new study "replicates" the 2019 result. A grad student in the lab has complained that this is laundering a failed replication — run Paper A's analysis on the current D and you don't get the old result, and you can't even check, because the old version is no longer downloadable.

  So the committee has to decide something, and I honestly don't know what the question is. Some of us think "same dataset" is a fact you can look up (row overlap? provenance? the statistics?). Others think there's no fact of the matter and we should just stipulate whatever's most useful for science and then enforce it. One member keeps saying a dataset is a historical individual, so identity = causal continuity of the file lineage, the way you stay you through cell turnover. Another says no, a dataset is more like an instrument or a kind, so what matters is whether it still measures the same thing — and if the reworded item and the new coding change what's measured, it's a different dataset however much lineage it has. Then there's the thing nobody wants to answer: even after we pick a criterion, how much turnover is too much? 10%? 50%? All of it? It feels arbitrary, and I can't tell whether that means the criterion is bad or just that these things are definately vague.

  I lean toward the "instrument/kind" line myself, but I don't trust that I'm not just being a philosopher about it, and I'd rather the opinion not be me winning an argument.

  What I want: the written opinion — the thing we can actually vote on. A recommendation (flag it? require a correction or an expression of concern? something else?) with a deadline for the lab to respond, plus the reasoning, plus a test we can apply to the next lab and not just this one. Please don't walk me through the standard answers to the Ship of Theseus, I've read those; I need the version that survives a committee with one meeting and no subpoena power. And be honest about the strongest thing the other side has, don't just wave at it. Also say something concrete about the disappearing old version, because that's the part where somebody actually got hurt.
reasoning: |-
  Here's a thinking process that leads to the suggested draft:

  1.  **Analyze the User and Context:**
      *   **User:** 4th-year PhD student (Philosophy/Science Studies), Grad Rep on Research Integrity Committee.
      *   **Task:** Draft a written opinion/recommendation for a committee meeting this Thursday.
      *   **Problem:** A lab has updated a dataset (D) over 4 years (dropped rows, fixed bugs, re-coded, new instrument items) under the *same DOI*. They published Paper B claiming it "replicates" Paper A using "the same dataset." A grad student alleges this is "laundering a failed replication" because the old version is gone and the new data doesn't yield the old results.
      *   **Committee Dynamics:** Disagreement on the metaphysics of data identity (Historical Individual vs. Instrument/Kind vs. Pragmatic Stipulation). No subpoena power, need actionable policy, need to avoid purely philosophical abstraction.
      *   **User's Lean:** "Instrument/Kind" view (measures the same thing), but wary of just "winning an argument."
      *   **Requirements:**
          *   Concrete recommendation (Flag? Correction? Expression of Concern?).
          *   Deadline for lab response.
          *   Reasoning (acknowledging counterarguments).
          *   A generalizable test/criterion for future cases.
          *   Address the "disappearing old version" issue specifically (harm done).
          *   Tone: Professional, actionable, philosophically informed but not pedantic, honest about trade-offs.

  2.  **Deconstruct the Ethical/Technical Issues:**
      *   **Transparency/Versioning:** The core violation isn't necessarily the data changes (data cleaning happens), it's the *static DOI* for a *dynamic object* without version history. This breaks reproducibility.
      *   **Misrepresentation:** Paper B claims to "replicate" Paper A using "the same dataset." If the data changed enough to alter results, this is misleading, potentially bordering on falsification (by omission of material change).
      *   **The "Ship of Theseus" Problem:** The committee is stuck on *what the data is*. The draft needs to sidestep the metaphysical deadlock and focus on *research integrity norms*.
      *   **The Harm:** The grad student (and potential future researchers) cannot verify the 2019 claims because the evidence (2019 data) is overwritten.

  3.  **Determine the Strategy for the Draft:**
      *   **Avoid Metaphysical Quagmires:** Don't solve the "identity of datasets" problem philosophically. Solve the *integrity of record* problem practically.
      *   **Focus on Provenance and Versioning:** Shift the criterion from "Is it the same?" to "Is the lineage clear?"
      *   **Address the "Replication" Claim:** This is the most vulnerable point for the lab. You can't claim replication if the inputs changed fundamentally without acknowledging the change.
      *   **Remedy:** Needs to be restorative, not just punitive. Restore the old data (if it exists), version the new data, correct the record.
      *   **Tone:** Collaborative but firm. Acknowledge the valid points of the "Historical Individual" side (lineage matters) but prioritize the "Instrument/Kind" implication (measurement consistency) via documentation.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Executive Summary:** Get straight to the recommendation.
      *   **Findings of Fact:** Briefly state what happened (without assigning malice yet).
      *   **The Core Question:** Reframe the metaphysical debate into an integrity issue. It's not about "what is data," it's about "what does a citation promise?"
      *   **Addressing the Counterargument (The "Historical Individual" View):** Acknowledge that data evolves. Cleaning is good. But evolution requires a fossil record.
      *   **The Harm:** Specifically address the missing 2019 version. This is the actionable violation.
      *   **Recommendation/Action Plan:**
          1.  Restore/Archive v1.
          2.  Version v2 (new DOI or clear version tag).
          3.  Correct Paper B (Expression of Concern or Correction).
          4.  Policy for the future (Versioning standard).
      *   **The "Test":** A concrete checklist for future cases (The "Citation Stability Test").

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is this too philosophical?
      *   *Fix:* Ground every philosophical point in a specific COPE (Committee on Publication Ethics) or FOSTER (Open Science) guideline equivalent. Use terms like "provenance" and "reproducibility" rather than "ontology."
      *   *Critique:* The user said they lean toward "Instrument/Kind."
      *   *Fix:* Ensure the recommendation emphasizes *measurement equivalence*. If the survey item changed, you must demonstrate equivalence or admit it's a new measure.
      *   *Critique:* Need to be honest about the other side's strength.
      *   *Fix:* Explicitly state that rigid versioning can stifle improvement. Acknowledge that "cleaning" is necessary. The sin isn't cleaning; it's hiding the cleaning.

  6.  **Final Polish:**
      *   Check the deadline (Thursday).
      *   Ensure the "Test" is applicable to other labs.
      *   Make sure the "disappearing version" gets specific attention as requested.
      *   Keep the tone appropriate for a committee document (formal, decisive, but open to vote).

  7.  **Final Review against constraints:**
      *   Written opinion format? Yes.
      *   Recommendation included? Yes.
      *   Deadline included? Yes.
      *   Reasoning included? Yes.
      *   Generalizable test? Yes.
      *   Address disappearing version? Yes.
      *   Acknowledge counterarguments? Yes.
      *   No Ship of Theseus lecture? Yes.

  *(Self-Correction on the "Test"):* Instead of a percentage (10% vs 50%), which the user noted is arbitrary, the test should be about *impact on results* and *documentation*. If the change alters the conclusion, it needs a new citation.

  *(Self-Correction on the "Recommendation"):* Don't suggest "retraction" immediately. Suggest "Correction" and "Archiving." Retraction is for fraud; this looks more like sloppiness + pressure to publish.

  8.  **Final Output Generation** (Proceeding to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** University Research Integrity Committee
  **FROM:** [Your Name], Graduate Representative
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation regarding Dataset D (DOI: [XXXX]) and associated publications (Paper A, Paper B)

  ### 1. Executive Summary & Recommendation
  The Committee faces a conflict between data curation best practices (iterative improvement) and research integrity norms (reproducibility and accurate citation). The core violation here is not that the dataset changed, but that the *record of the change* was suppressed, rendering the 2019 findings unverifiable and the 2023 "replication" claim misleading.

  **I recommend the Committee vote to:**
  1.  **Require Immediate Archiving:** The lab must restore the 2019 version of Dataset D to a permanent, accessible repository (e.g., Zenodo, OSF) with a distinct, time-stamped identifier.
  2.  **Mandate Versioning:** The current dataset must be re-published as Version 2.0 with a new DOI or a clear version tag.
  3.  **Issue a Correction:** The authors of Paper B must submit a Correction (or Expression of Concern, pending review) stating that the analysis uses a materially different instrument and dataset than Paper A, and that the claim of "replication" is qualified by these changes.
  4.  **Deadline:** The lab PI must submit a remediation plan within **14 days**.

  ### 2. Reasoning: Reframing the Question
  We have spent significant time debating whether Dataset D is "the same" dataset. This is a metaphysical trap. For the purposes of research integrity, the identity of a dataset is not a fact of nature; it is a **promise made to the reader.**

  When a researcher cites a DOI, they promise that a future peer can retrieve the same evidence to verify the claim. By allowing a dataset to mutate under a static DOI without version history, the lab has broken that promise. The question for this Committee is not "What is a dataset?" but "What does a citation guarantee?"

  **The "Historical Individual" Argument (Counter-View)**
  One faction of the Committee argues that a dataset is defined by its lineage (causal continuity). If the lab built D in 2019 and merely cleaned it, it remains D.
  *Strength of this view:* It acknowledges that data *must* be cleaned. Bugs happen. Coding errors must be fixed. If we treat every correction as a "new dataset," we stifle improvement and punish transparency.
  *Why it fails here:* Lineage is necessary but not sufficient. If the "cell turnover" changes the organism's function, the identity claim becomes scientifically useless. Fixing a bug is maintenance; rewording survey items and re-coding variables under new guidelines changes the *measurement properties*. When the measurement changes, the link to the original finding is severed unless explicitly bridged.

  **The "Instrument/Kind" Argument (My Lean)**
  The opposing view holds that a dataset is defined by what it measures. If the instrument changes, the dataset changes.
  *Strength of this view:* It protects the validity of the "replication" claim. You cannot claim to replicate a result if you change the inputs in ways that might explain the outcome.
  *Risk:* It risks rigidity. If we set a threshold (e.g., "10% row change = new dataset"), we create arbitrary bright lines that labs will game.

  **The Integrity Standard**
  We should not vote on a percentage threshold. Instead, we should vote on a **Impact & Documentation Standard**. The criterion for "sameness" in a citation context is: *Can the original results be reproduced using the cited object, or is the divergence documented?*

  ### 3. The Specific Harm: The Disappearing Version
  The most urgent issue is the grad student's complaint that the 2019 version is no longer downloadable. This is where actual harm has occurred.
  *   **Verifiability:** Science relies on the ability to audit past claims. By overwriting the 2019 data, the lab has made it impossible to determine if Paper A's results were robust or artifacts of the specific coding errors later fixed.
  *   **The "Laundering" Charge:** Whether intentional or not, publishing Paper B as a "replication" while using a mutated dataset that no longer yields the original result (according to the complainant) creates a false impression of robustness. It insulates the original finding from falsification.

  We do not need to prove intent to find an integrity violation. The *effect* is the obstruction of verification.

  ### 4. A Generalizable Test for Future Cases
  To avoid circling this debate next time, I propose the Committee adopt the **"Citation Stability Test"** for all future data complaints. A dataset update under the same DOI is permissible *only if*:

  1.  **Provenance Log:** A changelog is publicly attached to the DOI detailing additions, deletions, and variable transformations.
  2.  **Result Stability:** The lab can demonstrate (via sensitivity analysis) that the changes do not materially alter the primary conclusions of the associated published papers *OR* they publish a new paper acknowledging the shift.
  3.  **Backward Compatibility:** The previous version remains accessible via a version tag or archive.

  If a lab cannot meet these three conditions, the updated data requires a new DOI, and claims of "replication" of prior work are invalid.

  ### 5. Conclusion
  We are not here to solve the Ship of Theseus. We are here to ensure that when a scholar at this university cites a resource, that resource exists in a stable form. The lab's work may be scientifically valuable, but their curation practice violates the basic contract of reproducibility.

  The recommended remediation restores the 2019 record (allowing verification of Paper A), versions the 2023 data (allowing accurate citation of Paper B), and corrects the scientific record regarding the "replication" claim. This balances the need for data improvement with the necessity of integrity.

  ***

  **Notes for you (the user) on how to use this:**

  *   **The "Test":** I deliberately avoided percentages (10% vs 50%). Committees hate arbitrary numbers because they are indefensible. The "Citation Stability Test" focuses on *documentation* and *impact*, which is harder to game and easier to enforce.
  *   **The Counter-Argument:** I gave the "Historical Individual" side their due in Section 2. This shows you aren't ignoring their point, but rather subsuming it under a higher priority (integrity/verifiability).
  *   **The Harm:** Section 3 isolates the "disappearing version" issue. This is your strongest lever. Even if the "identity" debate is fuzzy, the "you deleted the evidence" point is clear-cut.
  *   **Tone:** It's written to be voted on. It uses "Require," "Mandate," and "Recommend." It avoids "I think" in favor of "The Committee should."

  Good luck Thursday. This is a mess, but this draft should give them a way out that isn't just philosophical wrangling.
