answer: |-
  The claim "Rationality just is maximizing expected utility (EU)" is a rhetorical compression of several distinct claims ranging from linguistic stipulations to substantive normative arguments. In the context of Risk-Weighted Expected Utility (REU) theory (e.g., Buchak 2013), the dismissal often relies on equivocation between these readings.

  Below is the menu of precise theses, ordered from the trivial to the radical, with verdicts on their truth, logical relations, and capacity to dismiss REU.

  ### 1. The Stipulative Definition
  *   **Claim:** "Rationality" is *defined* as the maximization of $\sum p_i u(x_i)$.
  *   **Category:** Definition of Rationality.
  *   **Verdict:** **Platitude (Linguistically) / Question-Begging (Substantively).** It is trivially true by stipulation but offers no argument against REU. It merely asserts that REU proponents are using the word "rational" differently.
  *   **Relation to REU:** Incompatible by fiat.
  *   **Dismissal Power:** **None.** It changes the subject rather than refuting the alternative theory.

  ### 2. The Descriptive Generalization
  *   **Claim:** Human agents (or ideal agents) *actually* maximize expected utility in practice.
  *   **Category:** Descriptive Generalization.
  *   **Verdict:** **False.** Empirically, humans violate EU axioms (Allais paradox, etc.). Normatively, ideal agents might not either if REU is correct.
  *   **Relation to REU:** Incompatible.
  *   **Dismissal Power:** **None.** REU is a normative proposal, not a descriptive model of current human behavior. Showing humans don't follow EU does not prove they should.

  ### 3. The Representation Theorem (Conditional)
  *   **Claim:** If an agent's preferences satisfy axioms $A$ (e.g., vNM or Savage axioms), then there exist functions $p$ and $u$ such that the agent maximizes EU.
  *   **Category:** Representation Theorem Conditional on Axioms.
  *   **Verdict:** **True (Mathematically).** This is the vNM or Savage theorem.
  *   **Relation to REU:** **Compatible.** REU is *also* a representation theorem. If an agent satisfies Buchak's axioms, they maximize REU. Crucially, any REU preference order can be mathematically *represented* as an EU order (by absorbing the risk function into the utility function), but this representation may not preserve the agent's actual beliefs or the structural explanation of their choice.
  *   **Dismissal Power:** **None.** This theorem does not say you *must* satisfy axioms $A$; it only says *if* you do, you look like an EU maximizer.

  ### 4. The Redescription Claim
  *   **Claim:** Any coherent preference order (including REU) can be mathematically modeled as EU maximization; therefore, the distinction is illusory.
  *   **Category:** Proper Objects of Utility / Mathematical Equivalence.
  *   **Verdict:** **True (Mathematically) / Vacuous (Theoretically).** You can always define a new utility function $u'$ such that $EU(u') = REU(u, r)$. However, this often requires $u'$ to depend on the probability distribution itself, violating the standard separation of belief and value.
  *   **Relation to REU:** **Compatible (Formally) / Incompatible (Structurally).** REU proponents accept the math but reject the redescription because it obscures the distinct psychological/normative role of the risk function.
  *   **Dismissal Power:** **Weak.** It suggests REU is notationally redundant, but fails to address why the *structure* of the risk function matters for normative theory (e.g., in dynamic choice or when probabilities are objective).

  ### 5. The Normative Axiomatic Requirement
  *   **Claim:** Rational agents *ought* to satisfy the specific axioms that entail EU (specifically the **Independence Axiom**).
  *   **Category:** Normative Requirement.
  *   **Verdict:** **Substantive and Defensible (Contested).** This is the core of the debate. EU proponents argue Independence is constitutive of rationality (e.g., Joyce 1999); REU proponents argue Independence is too strong and rules out legitimate risk attitudes.
  *   **Relation to REU:** **Incompatible.** REU explicitly violates Independence.
  *   **Dismissal Power:** **High (If Proven).** If one can demonstrate that violating Independence entails irrationality (e.g., via a money pump or Dutch Book that cannot be avoided), this dismisses REU. However, REU proponents have constructed defenses against standard money pumps, making this an open philosophical dispute, not a settled matter.

  ### 6. The Belief-Desire Separation (Location of Risk)
  *   **Claim:** Risk attitudes must be located entirely in the curvature of the utility function (desire), not in the weighting of probabilities (belief/processing). Utility is defined over final outcomes, not prospects.
  *   **Category:** Where Risk Attitudes Must Be Located / Proper Objects of Utility.
  *   **Verdict:** **Substantive.** This claims that caring about the *structure* of a gamble (e.g., the spread of outcomes) independently of the final utility is irrational.
  *   **Relation to REU:** **Incompatible.** REU posits a risk function $r(p)$ distinct from $u(x)$. It claims rational agents can care about the "security" of a prospect independently of the expected value.
  *   **Dismissal Power:** **High (If Proven).** This is the specific technical objection to REU. However, asserting it without argument is merely dogmatic. REU argues that separating risk into $u$ fails to capture distinctions between "risk-averse regarding gains" and "risk-seeking regarding losses" without ad-hoc utility assignments.

  ### 7. The Pragmatic Vulnerability (Dutch Book)
  *   **Claim:** Any agent not maximizing EU is susceptible to a Dutch Book (a series of bets guaranteeing a loss) or Money Pump.
  *   **Category:** Normative Requirement (Pragmatic).
  *   **Verdict:** **Substantive (Often False for REU).** Standard Dutch Book arguments rely on assumptions (like linear pricing of bets) that REU agents reject. While some dynamic inconsistency arguments exist against REU, they are not as decisive as the standard EU Dutch Book.
  *   **Relation to REU:** **Incompatible (Allegedly).**
  *   **Dismissal Power:** **Conditional.** Only supports dismissal if the specific Dutch Book argument holds against the specific REU formulation. Many do not.

  ### 8. The Constitutive/Metaphysical Claim
  *   **Claim:** Expected Utility is the *only* coherent structure of practical reason itself; non-EU theories are conceptually incoherent, not just normatively wrong.
  *   **Category:** Definition of Rationality (Metaphysical).
  *   **Verdict:** **Radical / Likely False.** This elevates a specific mathematical model to a truth of reason. It ignores that EU is one solution to the problem of decision under uncertainty, not the definition of the problem itself.
  *   **Relation to REU:** **Incompatible.**
  *   **Dismissal Power:** **None (Philosophically).** This is a conversation-stopper, not an argument.

  ---

  ### Logical Map and Entailments

  *   **1 (Definition)** entails **5 (Location of Risk)** only by linguistic fiat.
  *   **3 (Representation)** does **not** entail **5 (Normative Requirement)**. (You can satisfy the math without being obligated to satisfy the axioms).
  *   **5 (Normative Requirement)** entails **6 (Location of Risk)** (If you must satisfy Independence, risk must be in $u$).
  *   **7 (Pragmatic Vulnerability)** is often used to support **5 (Normative Requirement)**.
  *   **4 (Redescription)** is mathematically equivalent to **3 (Representation)** regarding static choice but diverges on dynamic choice and belief interpretation.

  **Compatibility with REU:**
  *   **Compatible:** 2 (Descriptive - REU doesn't claim humans are EU), 3 (Representation - REU is also a representation theorem), 4 (Redescription - mathematically true but theoretically resisted).
  *   **Incompatible:** 1 (Definition), 5 (Normative Axioms), 6 (Location of Risk), 7 (Pragmatic Vulnerability), 8 (Constitutive).

  ---

  ### Which Readings Support Dismissal?

  To legitimately dismiss Risk-Weighted Expected Utility, the commenter must be relying on **Thesis 5 (The Normative Axiomatic Requirement)** or **Thesis 6 (The Belief-Desire Separation)**.

  *   **Thesis 5** is the only reading that earns the dismissal *if* the Independence Axiom can be defended as a necessary condition of rationality. This requires an argument (e.g., "violating Independence makes you susceptible to sure losses"). Merely stating "Rationality is EU" assumes this thesis without proving it.
  *   **Thesis 6** supports dismissal if one can show that locating risk in the probability weighting function is conceptually confused (e.g., it conflates belief with desire).

  **Which Readings Leave REU Untouched?**
  *   **Thesis 3 (Representation Theorem):** This actually *presupposes* the possibility of alternatives. It says "If axioms $A$, then EU." It leaves open "If axioms $B$, then REU."
  *   **Thesis 4 (Redescription):** This leaves REU untouched normatively. Even if an REU agent can be *modeled* as an EU agent, their *reasoning* (maximizing REU) remains distinct. The redescription move is often a "theoretical cheapening" that REU proponents reject.
  *   **Thesis 1 (Definition):** This leaves REU untouched as a substantive theory; it merely excludes it from the label "rational" by linguistic decree.

  ### Conclusion: What the Commenter is Likely Claiming

  When a commenter says, "Rationality just is maximizing expected utility," they are typically conflating **Thesis 3 (Representation)** with **Thesis 5 (Normative Requirement)**.

  They observe that the Representation Theorem exists (Thesis 3) and implicitly assume that the axioms required for that theorem are themselves normative requirements (Thesis 5). They treat the mathematical result ("Preferences + Axioms $\rightarrow$ EU") as a normative proof ("Rationality $\rightarrow$ Axioms $\rightarrow$ EU").

  **Verdict on the Dismissal:**
  This move **does not earn the dismissal**. It skips the substantive debate over whether the Independence Axiom (which REU violates) is actually a requirement of rationality. To dismiss REU, one must argue *for* Independence, not simply assert EU as the definition of rationality. Without that argument, the claim is either a trivial stipulation (Thesis 1) or a conflation of math with normativity (Thesis 3 $\rightarrow$ 5). REU remains a live, defensible alternative under Theses 5 and 6 until the Independence Axiom is successfully defended against Buchak's counter-arguments.
