prompt: |-
  I was recently diagnosed with a hereditary condition whose severity depends on environmental triggers and on choices I made before I knew I carried the variant, and it has turned a long-running argument between two people close to me into something I can no longer ignore: one is a luck egalitarian, the other a relational egalitarian. Write the joint statement they could both sign after a good-faith adversarial collaboration. I want a numbered section of claims they agree on—about what equality is for, about the distinction between luck that fixes what a person can choose and luck that fixes how much a person's choosing matters, about the conversion problem in which identical resources yield unequal wellbeing through unchosen differences in capacities, and about how far the harshness and abandonment objections land. Then give their precise residual disagreements, each phrased so the side that holds it would accept the wording, followed by a disagreements table, the cruxes, and for each crux a case or argument both sides agree would bear on it with each side's prediction recorded in advance. If any part of their dispute is merely verbal, say which part and why. Do not cite any literature; reason from the positions themselves.
