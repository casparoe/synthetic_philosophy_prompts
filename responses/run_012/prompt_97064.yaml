      *   **Craving (Tanha):** In the original context, this isn't just "wanting." It's a specific kind of *grasping* or *thirst* that implies dissatisfaction.
      *   **Subject of Experience:** A coma patient lacks a subject. If there is no "one" to experience the absence, is the absence valuable?

  4.  **Evaluate Horn 1 (Positive State):**
