answer: |-
  **Seminar Note: Diagnosis of the Continuum Argument against Threshold Negative Utilitarianism**

  **To:** Population Ethics Seminar Group
  **From:** [Your Name]
  **Re:** Objection to Lexical Threshold View (Suffering vs. Pleasure)

  Colleagues,

  The argument you have constructed is a rigorous instantiation of a *sorites paradox* applied to normative thresholds. It is structurally sound and mirrors objections frequently raised against Parfit's non-archimedean views or prioritarian thresholds. Your concern that it 'proves too much' is well-founded: if valid, it dismantles not only your supervisor's view but almost any ethical theory relying on a sharp discontinuity in a continuous spectrum (e.g., rights thresholds, sufficiency views).

  However, the argument is not fatal. It relies on a contentious bridge principle between phenomenology and normativity. Below is a diagnosis of the fault line, the cost of repairing it, and a defence against the charge that the problem merely relocates.

  ### 1. The Diagnosis: Reject Premise (5)

  The argument hinges on Premise (5):
  > *(5) No requirement of reason can turn on a difference that no possible experience could detect and that amounts to an infinitesimal difference in magnitude.*

  This is the premise you must reject. It asserts a **Phenomenal Constraint on Normativity**: that normative status (tradeable vs. lexically protected) must supervene on discriminable phenomenal differences.

  **Why it looked compelling:**
  Premise (5) appeals to a powerful intuition about fairness and action-guidance. It seems unjust or irrational to demand that an agent respect a boundary they cannot, even in principle, perceive. If an agent cannot distinguish $S^+$ from $S^-$, how can they be morally required to treat them differently? It conflates *ontological* difference with *epistemic* access.

  **Why it is false:**
  Normative facts supervene on natural facts, not on our ability to detect those facts. Consider a cliff edge obscured by fog. The danger of stepping forward is objective; it does not vanish because the drop is visually indistinguishable from the solid ground behind it. Similarly, on your supervisor's view, the badness of suffering is a property of the state of affairs (perhaps defined by neural intensity, duration, or functional role), not merely the subject's reportability.

  If suffering is bad *in itself*, then an objective difference in magnitude—even if sub-threshold for conscious discrimination—constitutes a real difference in value. To accept (5) is to claim that morality is blind to reality where human perception is blind. A Negative Utilitarian, who takes the badness of suffering to be an objective feature of the world, is well-placed to deny this.

  ### 2. Pricing the Repair: The Cost of Sharp Boundaries

  By rejecting (5), you preserve the Threshold View, but you must pay a price. You must accept **Normative Sharpness**.

  **The Cost:**
  You must admit that there is a precise point on the continuum of suffering where the normative status flips from 'commensurable' to 'lexically prior', even if no subject can identify that point. This invites the charge of 'normative magic': why should an infinitesimal increase in neural firing rate transform a permissible sacrifice into an absolute prohibition?

  **Does the view survive?**
  Yes, in a recognisable form. Many legal and moral systems rely on sharp boundaries that are epistemically difficult to locate (e.g., the precise moment of death, or the threshold of viability). The view survives by distinguishing between:
  1.  **The Metaphysical Boundary:** Where the value actually changes (sharp).
  2.  **The Epistemic Boundary:** Where we can confidently say it has changed (vague).

  Your supervisor's view can maintain that the *rule* is sharp, while our *application* of the rule must be cautious. We treat borderline cases as protected precisely because we cannot be sure they fall below $T$. This introduces a 'margin of error' in practice without surrendering the theoretical threshold.

  ### 3. The Relocation and Vagueness Objection

  You rightly anticipate the objection: *If we relocate $T$, or make $T$ vague, does not the argument simply run again?*

  **Scenario A: Relocating the Threshold**
  If you simply move $T$ to avoid the specific $\epsilon$ chosen, the sorites argument does not care; it applies to *any* sharp threshold. However, having rejected (5), you are no longer vulnerable to the claim that the boundary is *arbitrary* merely because it is imperceptible. The boundary is fixed by the nature of suffering, not by our perception of it. The argument cannot run again because it relies on the premise that imperceptibility entails normative identity, which you have already denied.

  **Scenario B: Embracing Vagueness**
  A more sophisticated repair is to deny that $T$ is a sharp line and instead posit a **Vague Region**.
  *   **The Move:** Admit that for some range of suffering, it is *indeterminate* whether it is lexically prior or tradeable.
  *   **Blocking the Argument:** This blocks the inference at Step (6). The sorites argument relies on binary logic (Tradeable / Not Tradeable). If there is a third status (Indeterminate), the slide from 'Tradeable' to 'Not Tradeable' is interrupted. One cannot infer that because $S^-$ is tradeable, $S^+$ must be, because $S^+$ might fall into the indeterminate zone.
  *   **The Relocation Worry:** The opponent will ask: "Where does the vague region start and end?" (Higher-order vagueness).
  *   **The Response:** You can accept higher-order vagueness. There is no sharp boundary between the 'clearly tradeable' and the 'indeterminate'. While this looks like an infinite regress, it is not vicious. It simply reflects the semantic or ontological fuzziness of value concepts. The argument fails to gain traction because it requires a premise of *bivalence* (that every case is determinately one or the other) to generate the contradiction in (9). If you reject bivalence for borderline cases, the contradiction never arises.

  ### 4. Recommendation for Presentation

  To defend your supervisor's view without embarrassment, I suggest the following strategy:

  1.  **Concede the force of the Sorites:** Acknowledge that continuum arguments are the standard objection to threshold views. This shows intellectual honesty.
  2.  **Attack the Epistemic Principle:** Focus your energy on Premise (5). Argue that objective badness does not wait for human discrimination. Use the 'Cliff Edge' analogy.
  3.  **Distinguish Theory from Practice:** Clarify that while the *theory* may posit a sharp threshold (to avoid the collapse into pure aggregation), the *practical guidance* will treat borderline cases as lexically protected due to epistemic risk. This neutralises the 'unfairness' objection.
  4.  **Accept Vagueness if Necessary:** If pressed, allow that the threshold is vague. Explain that this does not destroy the view; it merely means there are cases where it is indeterminate whether the lexical priority applies. This is preferable to the conclusion in (8), where atrocities become tradeable.

  **Summary:** The argument fails because it assumes normative status must track discriminable experience. By severing that link, the Threshold View survives, albeit with the admission that moral reality may be more precise than human perception.

  I hope this assists in your preparation.

  Yours,

  [Your Name]
