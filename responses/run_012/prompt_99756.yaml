  **Editor's Note:** *The Impartial Spectator adjudicates disputes between your passions and your conscience using the machinery of moral sentiment. Please describe your situation and the reaction of those around you.*

  **Dear Impartial Spectator,**
  A colleague presented my report as his own. I wish to scream in the meeting. Is this righteous indignation or petty vanity? My office culture suggests I should let it go to keep peace. My family says I'm too sensitive.

  **Dear Colleague,**
  Resentment is the safeguard of justice, provided its pitch matches the injury. Propriety consists in the concord between your sentiment and what an uninvolved onlooker could enter into. Ask yourself: would a neutral man, changing places in fancy with you, join your fury? If your workplace tolerates such theft, your inner judge may have learned leniency from bad company. You must command your passion to match not what your office accepts, but what a truly uninvolved man would endorse. Yet, we must admit, your spectator is formed by the actual spectators around you. If your neighbours think you difficult for complaining, your conscience may struggle to distinguish propriety from popularity. The man within the breast is taught by the men without. Aim to be praiseworthy, even if you are not praised, though telling the difference requires a self-command your environment may actively discourage. You risk becoming a rubber stamp for your office's laxity if you do not strive to imagine a stricter judge.

  **Dear Impartial Spectator,**
  An earthquake killed thousands abroad. I read the news and felt nothing. My friends feel nothing. Are we sociopaths? We donate locally, but distant pain feels like fiction. The news moves on quickly.

  **Dear Reader,**
  We naturally feel more for the loss of a finger than a distant calamity. This is not vice, but the limitation of imagination. Sympathy is not pity; it is an imagined fellow-feeling. If your community remains unmoved, your internal spectator learns to sleep. To wake it, you must labor to visualize the specific suffering, not the abstract number. However, if your social circle prizes stoicism over benevolence, your spectator may mistake indifference for propriety. You are not a monster, but you must strive to broaden the circle of your imagined neighbours. The danger is that your conscience becomes merely the echo of your local paper. You must strive to feel what a citizen of the world would feel, even if your actual neighbours think such feeling impractical. It is hard to summon feeling for those you cannot see, but moral sentiment requires the effort of imagination beyond your immediate circle.

  **Dear Impartial Spectator,**
  I donated a fortune to a hospital wing. Mostly I wanted my name on the plaque. Is this virtue? My club says it's excellent PR. I feel virtuous because they applaud me. I worry I love the applause more than the good.

  **Dear Benefactor,**
  The desire for praise is natural; the love of praiseworthiness is noble. You seek the applause of the public, which is the man without. You must consult the man within. Beware: our spectators are often corrupted by admiration for wealth and status. We admire the rich more than the wise. Your inner judge may be applauding your status, not your charity. This is a case where your spectator is badly formed by the corruption of society. To correct it, you must imagine the gratitude of the patients, not the envy of your peers. It is difficult to separate the voice of conscience from the echo of society, but you must strive to hear the difference. Do not let your virtue be a transaction for status, even if your class insists it is. You must learn to value the approval of the impartial man over the flattery of your club, though your spectator was likely built by that very club.
