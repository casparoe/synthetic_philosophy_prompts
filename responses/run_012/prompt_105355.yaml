answer: |-
  ### The Menu of Claims

  Here are six distinct readings of the maxim "absence of evidence is not evidence of absence," evaluated for truth, defensibility, and their capacity to block your inference.

  **1. The Humility Reading**
  *   **Thesis:** My current failure to find something does not, by itself, constitute logical proof that the thing does not exist.
  *   **Verdict:** Trivially true. (It is a statement about the limits of a single negative observation).
  *   **Blocks Inference?** No. It licenses caution ("we cannot be certain"), but it does not forbid a probabilistic inference ("it is unlikely").
  *   **Work Done:** None. It reminds you to be modest, but it does not invalidate your conclusion.

  **2. The General (Face Value) Reading**
  *   **Thesis:** Absence of evidence is *never* evidence of absence, under any circumstances.
  *   **Verdict:** False. (In Bayesian terms, if $P(E|H)$ is high, then $\neg E$ significantly lowers the probability of $H$. If a search is exhaustive and the object is durable, silence *is* evidence).
  *   **Blocks Inference?** Yes, absolutely. It declares your inference logically illicit.
  *   **Work Done:** All of it. This is the reading required to shut down the discussion entirely, but it relies on a logical falsehood.

  **3. The Sensitivity Reading**
  *   **Thesis:** Silence counts as evidence exactly in proportion to the probability that the search would have detected the phenomenon had it been present.
  *   **Verdict:** Substantive and defensible. (This is the correct statistical interpretation of negative evidence).
  *   **Blocks Inference?** Conditionally. It blocks the inference only if the excavation's "sensitivity" (sample size, strategy, recovery methods) was low. If sensitivity was high, it supports your inference.
  *   **Work Done:** Shifts the debate to excavation methodology rather than logic.

  **4. The Preservation Reading**
  *   **Thesis:** The silence is a fact about taphonomy and the loss of perishable materials rather than about the past reality of the site.
  *   **Verdict:** Substantive and defensible (context-dependent).
  *   **Blocks Inference?** Only if specific taphonomic conditions (acidic soil, erosion, later truncation) are demonstrated to have removed ritual traces.
  *   **Work Done:** Shifts the debate to formation processes. If the soil is sterile due to acidity, ritual organics are gone; if sterile due to lack of deposition, they were never there.

  **5. The Recognition Reading**
  *   **Thesis:** The absence lies in our categories rather than in the past; "ritual" is a residual category for finds we cannot otherwise explain, so finding nothing "unexplained" analytically guarantees finding no ritual.
  *   **Verdict:** Substantive and defensible (theoretically).
  *   **Blocks Inference?** Yes. It argues that your definition of ritual presupposes the evidence you seek, making the negative finding a tautology of your classification system.
  *   **Work Done:** Undermines the ontology of "ritual" itself. It suggests you are looking for a modern construct, not a past practice.

  **6. The Conversational Reading**
  *   **Thesis:** The sentence is not a claim about evidence at all but a device for moving the burden of proof back to the claimant.
  *   **Verdict:** Pragmatically true (as a speech act).
  *   **Blocks Inference?** Temporarily. It functions as a "not proven" verdict, demanding more positive data before accepting a negative claim.
  *   **Work Done:** Delays judgment. It keeps the discussion open without committing to the truth of the matter.

  ***

  ### Analysis of the Dispute

  **Which readings license his refusal, and which license only caution?**
  Only the **General Reading** and the **Recognition Reading** license a flat refusal to let the inference be drawn. The General Reading claims the logic is invalid (false); the Recognition Reading claims the category is incoherent (theoretical). The **Humility**, **Sensitivity**, and **Preservation** readings license only *caution*. They suggest you should qualify your conclusion (e.g., "provided taphonomy allows," or "given current exposure"), but they do not forbid the inference. The **Conversational Reading** licenses a pause, not a refusal.

  **What would you need to establish for the Sensitivity Reading to favor him rather than you?**
  For the Sensitivity Reading to support your colleague, you would need to demonstrate that the excavation had a low probability of detecting ritual *even if it were there*. You would need to show:
  1.  **Sampling Bias:** The excavated areas missed the specific loci where ritual occurs (e.g., you dug houses but ritual happened exclusively at a shrine 50m away).
  2.  **Resolution:** The excavation methods were too coarse to find small ritual items (e.g., no flotation for seeds, no fine-screening for beads).
  3.  **Expectation Mismatch:** The ritual practices expected (e.g., song, dance, ephemeral offerings) leave no durable trace by definition.
  If, however, you excavated to sterile soil across the *whole* settlement with fine screening, and ritual in that period/culture is typically associated with durable figurines or structured deposits (as your premise suggests), the Sensitivity Reading favors *you*. Silence becomes loud evidence.

  **Is there a version of the maxim that is both true and useful?**
  The universal maxim ("Never") is false and therefore useless for rigorous analysis. The honest replacement is a conditional claim: **"Absence of evidence is not evidence of absence *when the expected evidence is unlikely to survive or be recognized*."** This is not a slogan; it is a prompt to evaluate taphonomy and category validity. It forces the archaeologist to quantify the reliability of the negative record rather than hiding behind a proverb.

  **Which reading is he most likely to intend, and how would you tell?**
  He is most likely intending a conflation of the **General Reading** (for rhetorical force) and the **Recognition Reading** (for theoretical cover). He wants the absolute block of the General Reading without having to prove the logical impossibility of negative inference.
  *   **How to tell:** Ask him: "Do you mean that *no amount* of excavation could prove a lack of ritual (General), or that *this specific* excavation wasn't sufficient (Sensitivity)?" If he insists the inference is *logically* invalid regardless of excavation quality, he is using the General Reading. If he admits that a larger sample might change things, he is using Sensitivity/Humility.

  **Ordering the Readings (Weakest to Strongest)**
  I order these by **Epistemic Robustness** (defensibility/truth). A claim that is false is "weak" argumentatively, even if it asserts more.

  1.  **The General Reading** (False). *Platitude dressed as insight.* It asserts the most but is logically untenable.
  2.  **The Humility Reading** (Trivial). *Platitude.* True, but offers no analytical leverage.
  3.  **The Conversational Reading** (Pragmatic). True as a social move, but dissolves upon analysis of the actual evidence.
  4.  **The Preservation Reading** (Substantive). Defensible, but requires specific geological proof.
  5.  **The Sensitivity Reading** (Substantive). Defensible and methodologically sound; the standard for scientific inference.
  6.  **The Recognition Reading** (Strongest). *Insight.* This is the only reading that genuinely challenges the premise of your inference without relying on logical errors. It attacks the definition of ritual itself.

  **The "Invisible Ritual" Trap**
  If your colleague combines the slogan with the thought that **ritual is in any case archaeologically invisible**, his position becomes **immune to excavation**.
  *   **Is it immune?** Yes. If ritual leaves no trace by definition, then neither positive nor negative evidence can ever be gathered.
  *   **What does this cost him?** It costs the claim all empirical content. If ritual is invisible to archaeology, then archaeology cannot study ritual. By making the claim unfalsifiable, he removes it from the realm of science and places it in the realm of faith or pure speculation. He preserves the *possibility* of ritual at the site, but only by rendering the *study* of ritual impossible. In a seminar on "ritual and belief in later prehistory," this is a performative contradiction: he is participating in a discourse he claims is impossible to substantiate.
