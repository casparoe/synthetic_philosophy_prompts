answer: |-
  This is an exceptionally sharp reading of the *Enquiry*. You have identified the precise pivot point upon which Hume's entire philosophy of causation turns, and where many readers (and indeed many philosophers after him) get stuck.

  To answer your questions directly: Hume is deliberately running the two readings together, but he believes he has a warrant for doing so that makes the move from the observational (A) to the ontological/semantic (B) valid. However, that warrant relies on a specific theory of meaning (the Copy Principle) that is not logically forced by observation alone. Consequently, it is entirely coherent to accept the observational point while resisting the ontological conclusion, provided you reject Hume's underlying empiricist semantics.

  Here is a detailed breakdown of how this works, how it maps onto modern debates, and where the leverage points lie.

  ### 1. Does the Observational Point Force the Ontological Conclusion?

  You distinguish between:
  *   **Reading A (Epistemological):** We do not *perceive* necessary connection in single instances.
  *   **Reading B (Metaphysical/Semantic):** Therefore, necessary connection does not exist in objects (or the idea of it is meaningless).

  On a standard realist view, A does not force B. One could argue: "Just because we cannot see the magnetic field doesn't mean it isn't there." However, Hume is not operating with standard realist assumptions. He is operating with the **Copy Principle**.

  Hume's argument structure is roughly this:
  1.  **Semantic Premise:** Every meaningful idea must be derived from a preceding impression (sensory or reflective).
  2.  **Empirical Premise:** When we survey external objects (Reading A), we find no impression of "power" or "necessity." We only see succession and contiguity.
  3.  **Psychological Premise:** The only impression resembling "necessity" is an internal feeling of determination in the mind after repeated observations (habit).
  4.  **Conclusion:** Therefore, the *idea* of necessary connection is nothing but the projection of that internal feeling onto external objects. To speak of necessity as residing in objects independent of the mind is to use a term without a corresponding idea.

  For Hume, Reading A forces Reading B **only because** of the Semantic Premise. If you cannot point to the impression that gives the word "necessary connection" its meaning when applied to objects, then you are not making a claim about a hidden reality; you are uttering sounds without sense.

  So, is he deliberately letting them run together? **Yes.** He is employing a verificationist theory of meaning *avant la lettre*. He isn't just saying "we don't know if it's there"; he is saying "if it were there, it would have to be observable to be meaningful, and since it isn't observable, the concept is empty."

  ### 2. Is it Coherent to Accept A but Resist B?

  You ask whether someone can accept the observational point (we don't see the tie) but resist the conclusion (causation is just regularity). **Yes, this is a coherent position, but it requires rejecting Hume's Copy Principle.**

  There are two major historical ways philosophers have done this:

  **A. The Kantian Turn (Transcendental Idealism)**
  Kant agrees with Hume on Reading A: necessity is not an empirical datum. You cannot find "cause" in the sensation of the billiard ball hitting the next. However, Kant rejects Reading B. He argues that necessity is not derived *from* experience but is a condition *for* the possibility of experience. For Kant, the category of causality is a rule the mind imposes to make sense of temporal succession. Thus, necessity is objectively valid for the world of experience, even if not empirically observable. This accepts Hume's observation but denies his reduction of necessity to habit.

  **B. Scientific Realism (Inference to the Best Explanation)**
  Modern realists argue that Hume's empiricism is too restrictive. We routinely accept the existence of unobservable entities (electrons, gravitational fields, quarks) because they provide the best explanation for observable phenomena. A realist about causal powers argues: "We don't see the power, but positing a real productive tie explains *why* the regularity holds, why it supports counterfactuals (if the ball *had* been struck, it *would* have moved), and why we can manipulate nature."
  On this view, Hume's move from "we don't see it" to "it's meaningless" is a non sequitur. It commits the "fallacy of empiricism": assuming that what exists must be directly observable.

  **Verdict:** The position is coherent if you abandon strict empiricism. If you stay within Hume's system, A forces B. If you step outside his system, A and B come apart.

  ### 3. The Modern Dispute: Laws of Nature

  You asked how much of the present-day dispute over laws of nature is just Hume restated. The answer is: **The architecture is Humean, but the materials are new.**

  The modern debate is largely between **Humean Supervenience** (championed by David Lewis) and **Anti-Humean Necessitarianism** (championed by D.M. Armstrong, Fred Dretske, and Michael Tooley).

  **Where it is Hume Restated:**
  *   **The Core Tension:** The debate is exactly about whether laws are merely descriptions of global regularities (Hume's constant conjunction) or whether they involve a relation of "necessitation" between universals (Hume's obscure idea of power).
  *   **The Skeptical Challenge:** Anti-Humeans still have to answer Hume's challenge: "What is this necessitation relation? How do we know it? Is it just a word we use to comfort ourselves?"

  **Where it is Doing Something New:**
  *   **Counterfactuals:** Hume focused on induction (predicting the future). Moderns focus on counterfactuals (what *would* happen if...). Anti-Humeans argue that mere regularity cannot distinguish between a law ("all gold spheres are less than 1 mile wide") and an accident ("all moa birds died before 1950"). Both are true regularities, but only the first supports counterfactuals. They argue you need "genuine necessitation" to explain this difference. Hume did not have the logical tools to formalize this distinction.
  *   **Inference to the Best Explanation (IBE):** As mentioned above, modern anti-Humeans use IBE. They argue that positing a "necessitation relation" is a better explanation of the structure of science than Hume's "cosmic coincidence" of regularities. Hume rejected IBE because it posits unobservables; moderns accept it as standard scientific practice.
  *   **Modal Logic:** Hume lacked a formal semantics for modality. Today, we can model "possible worlds." A Humean (like Lewis) says laws are regularities that hold in the actual world and are systematized simply. An Anti-Humean says laws constrain which worlds are possible. This allows for a much more precise formulation of the disagreement than Hume could manage.

  ### 4. Summary: How to Read the Passage

  Returning to your specific text from the *Enquiry*:

  > "We only find, that the one does actually, in fact, follow the other."

  This sentence supports **Reading A** primarily. It is a report on the limits of sensory impression. However, in the context of the *Enquiry* as a whole, Hume intends this to support **Reading B**.

  If you read Hume as a **Skeptic**, he is saying: "We cannot know if there is power, so we should stop talking about it."
  If you read Hume as a **Projectivist** (which is the more common modern reading of the *Enquiry*), he is saying: "The 'power' is a sentiment we project. There is no power in the object."

  **The Coherent Position for You:**
  If you wish to accept the observational point but resist the conclusion, you are effectively adopting a **Critical Realist** or **Kantian** stance. You are claiming that:
  1.  Observation is theory-laden or limited (we don't see the micro-structure of causation).
  2.  Meaning is not strictly tied to immediate sensory impressions (we can meaningfully talk about unobservables).
  3.  Causation involves a productive relation that explains regularity, rather than being identical to it.

  This is a robust philosophical position. It acknowledges Hume's devastating critique of *naive* observation while refusing to accept his empiricist constraints on *metaphysics*. Hume's argument forces the second conclusion only if you grant him the first premise of his theory of ideas. Once you challenge the idea that "all meaning comes from impressions," the door opens to real causal powers again.

  In short: Hume is not reporting a fact about nature that forces a metaphysical conclusion; he is applying a filter (empiricism) to experience and reporting what remains after the filter does its work. If you change the filter, the result changes.
