  1.  **The Dial**
      You are offered a life in a machine. **Option A** is vivid, pleasurable, but false (no causal contact with the world). **Option B** is veridical (true of the actual world) but still has no causal contact. Is Option A at least as good for you as Option B?
      *   **Yes (Experience is sufficient):** Go to 2.
      *   **No (Truth matters):** Go to 3.
      *   **Indeterminate (No fact of the matter):** Go to *Leaf 1 (Deflationary View)*.

  2.  **The False Belief**
      You feel profound satisfaction believing you have written a great novel. In reality, you have not, and you never will know. Is your well-being diminished by the falsity of the belief?
      *   **No (Feeling is all):** Go to 7.
      *   **Yes (Truth of satisfaction matters):** Go to *Leaf 2 (Internalist Desire Satisfactionism)*.

  3.  **The Ledger**
      You live a normal life with veridical experiences. At the end, **The Ledger** reveals you had zero causal influence on events (you were a passive observer of a real world). Is your life less good than you thought?
      *   **No (Veridicality is enough):** Go to 8.
      *   **Yes (Causal contact matters):** Go to 4.

  4.  **The Understudy**
      You live a life where a perfect double actually performs all your actions, but your stream of experience is identical to what it would have been if you had acted. Is this life worse than one where you truly caused the outcomes?
      *   **No (Contact is enough):** Go to 5.
      *   **Yes (Authorship matters):** Go to 9.

  5.  **The Objective Good**
      Suppose you have causal contact and experience, but you are not developing any distinctively human capacities (e.g., you are a contented couch potato). Is your well-being lower than it could be?
      *   **No (Experience + Contact is sufficient):** Go to 10.
      *   **Yes (Nature/Capacities matter):** Go to 6.

  6.  **The List vs. The Nature**
      Is the value of your life determined by achieving specific items (e.g., knowledge, friendship) regardless of your nature, or by fulfilling your specific nature as a human being?
      *   **Specific Items:** Go to *Leaf 3 (Objective List Theory)*.
      *   **Fulfilling Nature:** Go to *Leaf 4 (Perfectionism)*.

  7.  **Aggregation (Experiential)**
      Consider two lives with the same total amount of pleasure. **Life A** has steady pleasure. **Life B** has a tragic dip followed by a higher peak. Does the shape matter, or just the sum?
      *   **Just the Sum:** Go to *Leaf 5 (Experiential Hedonism)*.
      *   **The Shape Matters:** Go to *Leaf 6 (Holistic Hedonism)*.

  8.  **Aggregation (Veridical)**
      Consider two lives where your desires are equally satisfied by the world. **Life A** is a steady grind. **Life B** is a narrative redemption arc. Does the narrative shape add value beyond the sum of satisfied desires?
      *   **Just the Sum:** Go to *Leaf 7 (Externalist Desire Satisfactionism)*.
      *   **The Shape Matters:** Go to *Leaf 8 (Narrative Desire Theory)*.

  9.  **Aggregation (Authorship)**
      You have full authorship of your life. **Life A** is a series of disjointed achievements. **Life B** is a coherent project spanning decades. Is B better simply because of the coherence?
      *   **No (Achievements sum up):** Go to *Leaf 9 (Atomistic Authorship View)*.
      *   **Yes (Coherence adds value):** Go to *Leaf 10 (Narrative Authorship View)*.

  10. **Aggregation (Hybrid)**
      You have experience and causal contact. **Life A** is a sum of good moments. **Life B** has the same sum but includes a meaningful sacrifice. Does the sacrifice add value beyond the experience/contact sum?
      *   **No (Sum is sufficient):** Go to *Leaf 11 (Additive Hybrid Theory)*.
      *   **Yes (Meaning adds value):** Go to *Leaf 12 (Meaningful Hybrid Theory)*.

  ***

  ### Closing Analysis: Unoccupied and Inseparable Spaces

  **Inseparable Leaves:**
  *   **Leaf 1 (Deflationary) vs. Indeterminacy:** There is no question in the tree that separates a hard Deflationist (no fact exists) from a Confused Realist (fact exists but I can't find it). We flag this because a participant answering "Indeterminate" at Node 1 might simply be epistemically humble rather than ontologically deflationary.
  *   **Leaf 5 (Hedonism) vs. Leaf 2 (Internalist Desire):** In practice, these are indistinguishable by case verdicts. If you require the *experience* of desire satisfaction, you are functionally demanding pleasure/satisfaction feelings. We separated them at Node 2 to honor the literature, but a participant cannot reliably distinguish them without using the labels themselves.

  **Unoccupied Combinations:**
  *   **Veridicality without Contact (Node 3 "No" path):** This view (Truth matters, Contact doesn't) is logically coherent but rarely defended. It implies that being a passive observer of the truth is as good as interacting with it, provided you aren't lied to. It is unoccupied because most who demand truth also demand agency (Contact), and most who accept passivity accept simulation (Experience).
  *   **Perfectionism without Contact (Node 5 "Yes" but Node 3 "No"):** A view where you must fulfill your nature, but it doesn't matter if you are causally disconnected from the world (e.g., a brain in a vat fulfilling "human nature" via simulation). This is generally considered incoherent; perfection usually requires actualizing potentials in the real world.
  *   **Momentary Authorship (Node 9 "No" + Momentary Locus):** While we split Authorship by Aggregation, a "Momentary Authorship" view (well-being is a property of time-slices of authorship) is unexplored. Authorship is inherently diachronic (projects span time), so a momentary locus is unattractive to proponents of this view.

  **Temporal Axis Note:**
  The tree applies the Temporal/Aggregative questions (Nodes 7–10) only after the Reality status is settled. This reflects the logical dependency: one must decide *what* is good (Reality Axis) before deciding *how* it sums (Temporal Axis). However, note that Perfectionism (Leaf 4) and Objective List (Leaf 3) terminate before the explicit Aggregation nodes; this is a compression for space, assuming these views typically imply a Whole-Life/Holistic structure by default. A strict instrument would branch them further, but that would exceed the leaf limit.
