answer: |-
  **Project Title:** The Grain of Rationality: Partition-Relative Coherence and the Limits of Expected Utility

  **1. Statement of the Research Question**
  Standard coherence arguments for Expected Utility (EU) maximization—specifically Dutch Book, Money Pump, and Representation Theorems—presume a specific ontology of choice. They assume that for any prospect in a relevant Boolean algebra, an agent can recognize it as a salient, individually assessable option and express a preference over it. This project challenges that assumption. I propose that rational agents operate with coarse-grained preference partitions, limited attention, and non-zero deliberation costs. Consequently, the "exploitative force" of coherence arguments may depend on the ability to force an agent to refine their partition beyond their cognitive or economic budget.

  The central research question is: *Does the normative force of coherence arguments survive when agents are modeled as having preferences defined only over a coarse algebra of prospects, where refining that algebra incurs deliberation costs?*

  I hypothesize that EU maximization is not uniquely rational under these constraints. Instead, coherence establishes a dynamic constraint on how an agent's partition may be refined. An agent may be locally coherent relative to a partition without being globally representable as an EU maximizer. The project aims to formalize "Partition-Relative Coherence" and determine whether standard exploitation arguments can be reconstructed when choice is sensitive to the grain of the option set and the cost of discrimination.

  **2. Context and Gap in Existing Literature**
  Decision theory currently occupies two siloed positions. On one side, formal epistemology and decision theory defend EU maximization via coherence arguments that treat the agent as logically omniscient regarding the option space. These arguments demonstrate that violating axioms like Independence or Transitivity commits an agent to sure losses. However, these proofs implicitly assume the agent can distinguish between arbitrarily similar prospects without cost.

  On the other side, the literature on bounded rationality acknowledges deliberation costs and limited attention but typically treats these as performance errors or descriptive deviations from a normative ideal. There is a lack of formal work integrating deliberation costs directly into the *normative* definition of coherence. Existing models of costly deliberation usually focus on information acquisition prior to choice, rather than the granularity of the choice set itself.

  This project bridges that gap. It asks whether the normative ideal itself shifts when the cost of distinguishing options is internalized. If a Money Pump requires an agent to distinguish between prospect $A$ and a perceptually or cognitively indistinguishable $A'$, and making that distinction costs more than the pump extracts, is the agent truly irrational? Current frameworks cannot answer this because they lack a formal mechanism for partition-relative preference. By developing this mechanism, the project clarifies whether EU is a requirement of rationality *simpliciter* or merely a requirement of rationality for agents with infinite discriminative capacity.

  **3. Methodology and Work Plan**
  The project will proceed over twelve months, divided into four phases of formal development and philosophical analysis.

  *Months 1–3: Formal Framework Development*
  I will construct a formal model of a "Partition-Agent." This involves defining a state space equipped with a partition function representing the agent's salient prospects. I will introduce a cost function associated with refining the partition (splitting cells). The preference relation will be defined over the cells of the partition, not the underlying states. The goal is to produce a working definition of "Partition-Relative Preference" that allows for incompleteness between cells that are not jointly salient.

  *Months 4–6: Testing Coherence Arguments*
  Using the framework from Phase 1, I will attempt to reconstruct the standard Money Pump and Dutch Book arguments. I will model the "bookie" as an external agent capable of offering options that require the subject to refine their partition to accept or reject. I will analyze whether a sure loss is inevitable or if the deliberation costs block the sequence of trades. I will specifically test whether violations of Transitivity or Independence remain exploitable when the cost of distinguishing the relevant prospects exceeds the potential loss.

  *Months 7–9: Defining Partition-Relative Coherence*
  Based on the results of Phase 2, I will formulate the normative norms for the Partition-Agent. If global EU maximization is not required, what is? I expect to derive a dynamic norm governing when it is rational to refine a partition versus when it is rational to remain coarse. This will involve defining a threshold of "cost-sensitive exploitation." I will draft the core philosophical chapters arguing that coherence is a property of the agent-partition pair, not the agent alone.

  *Months 10–12: Synthesis and Dissemination*
  The final phase involves integrating the formal results into a unified dissertation chapter or standalone paper. I will refine the philosophical implications for normative decision theory, specifically addressing the "idealization" objection. I will present the work at one departmental workshop and submit the manuscript to a peer-reviewed journal in formal philosophy.

  **4. Criteria for Project Failure**
  It is essential to define conditions under which this research program would not yield publishable results.
  1.  **Triviality:** If the cost function can be tuned such that *no* agent is ever exploitable regardless of their preferences, the model becomes vacuous. Failure occurs if I cannot identify a non-arbitrary constraint on deliberation costs that preserves some normative bite.
  2.  **Collapse:** If the model demonstrates that any Partition-Agent who avoids cost-sensitive exploitation must effectively behave *as if* they are a global EU maximizer (perhaps by pre-committing to a fine-grained partition), then the project fails to establish a distinct normative category.
  3.  **Formal Intractability:** If the interaction between partition refinement and dynamic choice leads to logical paradoxes that prevent a stable definition of preference, the formal framework will be untenable.

  **5. Assessment of Scope and Realism**
  This scope is ambitious for a one-year fellowship but realistic given my current proficiency in formal modeling. The risk lies in the complexity of dynamic choice with endogenous partitions. To mitigate this, I will restrict the initial formal work to finite state spaces and specific cost functions (e.g., linear costs per partition split) rather than attempting a general theory immediately.

  I will prioritize the Money Pump argument over Dutch Book arguments in the first pass, as the sequential nature of money pumps interacts more naturally with deliberation costs. If time permits, I will extend the analysis to Dutch Books. The philosophical writing will proceed in parallel with the modeling to ensure that the formal results are interpreted correctly. The project is designed to be modular; even if the full representation theorem is out of reach, a successful analysis of the Money Pump under deliberation costs constitutes a significant contribution to the literature on bounded rationality and normative decision theory.

  The outcome will be a rigorous demonstration that the normative standards of rationality are sensitive to the cognitive grain of the agent. This challenges the view that ideal rationality is simply the limit of bounded rationality as costs go to zero, suggesting instead that the structure of rationality changes qualitatively when attention and discrimination are scarce resources.
