prompt: |-
  I am a third-year PhD student in philosophy, working at the intersection of decision theory and formal epistemology, and I need a two-page research proposal for a one-year fellowship. My half-formed idea is this. The standard coherence arguments for expected utility maximization—Dutch book, money pump, representation theorems—are usually taken to show that an agent whose preferences violate the expected-utility axioms is irrational because the agent can be exploited or is committed to inconsistent valuations. But I suspect the exploitative force depends on a hidden assumption about the grain of choice: that any prospect in the relevant algebra can be offered to the agent as a single, salient, individually assessable option. Real agents have coarse-grained preference partitions, limited attention, and deliberation costs. I want to ask whether the coherence argument survives once we model an agent whose preferences are defined only over a coarse algebra of prospects and who can refine that algebra only through costly deliberation. Does expected utility maximization remain uniquely rational, or does the argument instead establish a dynamic constraint on how an agent’s partition may be refined—so that an agent can be coherent relative to a partition without being globally representable as an expected-utility maximizer? The project would develop a formal framework for what I am calling partition-relative coherence, define an exploitation notion that is sensitive to deliberation costs and choice-size thresholds, and test whether the money-pump and Dutch-book constructions can be reconstructed under those constraints. Turn this into a proposal with a precise statement of the question, an explanation of why the existing positions leave it open, a month-by-month method for the year, what would count as the project failing, and an honest assessment of whether the scope is realistic. Do not include a bibliography or citations; I will add those myself.
