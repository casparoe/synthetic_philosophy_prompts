answer: |-
  There is no single, canonical term in political science, theology, or sociology that captures this pattern exactly. While adjacent concepts exist—such as Robert Bellah's "Civil Religion," the sociological notion of "Functionalism," or the historical concept of "Erastianism"—none of these describe the specific *argumentative inversion* you have identified. Civil Religion describes the content of public ritual; Functionalism describes the utility of religion to society; Erastianism describes state supremacy over the church. None of them account for the phenomenon where the defense of a religious structure is strongest among those who do not believe it, while the attack is strongest among those who do.

  Because the pattern is distinct and recurrent, it warrants a specific designation. I propose the term **The Paradox of Religious Custody**.

  Below is a clear account of its edges, followed by answers to your specific questions regarding the inversion, scope, politics, sincerity, and identification.

  ### Definition: The Paradox of Religious Custody

  **The Paradox of Religious Custody** occurs when the defense of a religious institution's public status is grounded in secular utility (infrastructure, social cohesion, historical continuity) by non-adherents, while the attack on that same status is grounded in spiritual integrity (doctrinal freedom, prophetic voice, independence) by adherents.

  The defining feature is that the "custodians" of the institution (those who defend its legal and public place) are not its "owners" (those who hold its theological truth claims). The institution is treated as a public good by those outside it, and as a compromised vessel by those inside it.

  ### Analysis of the Pattern

  **1. Is the inversion essential?**
  Yes, the inversion is the essential mechanic of the paradox. If the alignment were standard—if believers defended the establishment because it spread the Gospel, and secularists attacked it because it wasted public funds—you would have ordinary interest-group politics. The paradox exists only because the motivations cross over. The secular defender values the *shell* (the building, the rite, the parish network) precisely because they do not care about the *kernel* (the doctrine). The believer attacks the *shell* precisely because they care too much about the *kernel* to let it be housed there. Without this inverse relationship between belief and defense, the pattern collapses into standard conflict.

  **2. Does it require an established church?**
  No. The structure arises wherever the state and religious bodies have a formal interface that creates a "settlement." As you noted, it appears in tax levies (Germany, Scandinavia), in constitutional exemptions (the U.S. tax code), and in strict separationist doctrines (French *laïcité* or American strict separationism).
  *   **In Establishment:** The secularist defends the bishop in the legislature as a voice for "community values."
  *   **In Taxation:** The secularist defends the church tax because it funds Caritas or the Salvation Army.
  *   **In Separation:** The secularist defends strict separation as a sacred civic principle (a "secular dogma"), while the believer views it as a restriction on their free exercise.
  In all three, the state arrangement is defended for its *function*, and attacked by believers for its *effect on faith*.

  **3. How is it distinguished from ordinary coalition politics?**
  In ordinary coalition politics, support is transactional and aligned with self-interest. A union supports a labor law because it helps workers; a corporation supports a tax break because it helps profits.
  In **The Paradox of Religious Custody**, the support is *fiduciary*. The secular defender is not arguing that the arrangement benefits *them* personally (they do not attend the church), but that it benefits the *polity*. They are acting as a trustee for an asset they do not own.
  *   **Coalition Politics:** "I defend this church because my voters like it."
  *   **Paradox of Custody:** "I defend this church because the nation needs it, even though I never go."
  The distinction lies in the justification: one is pragmatic self-interest; the other is appeals to public infrastructure or national heritage.

  **4. Is it a species of hypocrisy?**
  No. Hypocrisy implies a pretense of belief or a concealment of motive. In this pattern, the motives are open and sincere. The secular defender is not pretending to believe in the Resurrection; they are openly stating that the Church is useful for weddings and social cohesion. The believer is not pretending to want disestablishment for power; they are openly stating that the Gospel cannot be preached freely under state constraint.
  It is not hypocrisy; it is a **category error**. The two sides are arguing about different objects. One is arguing about a *public utility* (the church as a service provider); the other is arguing about a *spiritual body* (the church as a bearer of truth). Because they are discussing different categories, neither is lying, but neither is hearing the other.

  **5. Clear Cases and Clear Non-Cases**

  To identify **The Paradox of Religious Custody**, look for the mismatch between *status* and *defense*.

  *   **Clear Case:**
      *   **Context:** The Church of England.
      *   **The Defense:** A prominent atheist politician argues against disestablishment, stating that the Church provides a "moral fabric" and a "national listening post" that the state cannot replicate.
      *   **The Attack:** A prominent Anglican bishop argues for disestablishment, stating that the Church cannot critique the government while sitting in its legislature.
      *   **Why it fits:** The atheist defends the *institution*; the believer attacks the *institution* to save the *faith*.

  *   **Clear Case:**
      *   **Context:** U.S. "Blue Laws" or Legislative Prayer.
      *   **The Defense:** A secular legislator defends a legislative chaplaincy as "tradition" and "furniture of public life," explicitly denying it is religious endorsement.
      *   **The Attack:** A devout believer sues to remove the prayer, arguing that it trivializes sacred invocation into political theater.
      *   **Why it fits:** The secularist protects the *ritual* as heritage; the believer rejects the *ritual* as profaned.

  *   **Clear Non-Case:**
      *   **Context:** State funding for a religious school.
      *   **The Defense:** A religious parent argues for the funding because it allows them to teach their children the truth of their faith.
      *   **The Attack:** A secular taxpayer argues against the funding because it violates separation of church and state.
      *   **Why it fails:** This is standard alignment. The believer defends for religious reasons; the secularist attacks for secular reasons. There is no inversion.

  *   **Clear Non-Case:**
      *   **Context:** A political party courting a religious voting bloc.
      *   **The Defense:** A politician defends tax exemptions for churches because their constituents demand it.
      *   **Why it fails:** This is coalition politics. The defense is based on electoral calculation, not on a theory of the church as public infrastructure.

  ### Summary

  The pattern you have observed is **The Paradox of Religious Custody**. It is defined by the **inversion of belief and defense**, where the settlement is protected by those who view it as a **public utility** and threatened by those who view it as a **spiritual liability**. It is not hypocrisy, because both sides are sincere about their respective categories (civic vs. sacred), but it results in a dialogue of the deaf because the "church" being defended is not the "church" being attacked. It applies to any formal state-religion settlement, not just establishment, and it is distinct from coalition politics because the defense is fiduciary (for the public good) rather than transactional (for group interest).
