  *(Self-Correction during drafting)*: I initially thought about putting the "Knowledge" variant as a hard requirement. But the user asked "whether a single account is supposed to swallow both." So the requirement should be *clarity* on whether it covers both, not necessarily that it *must* cover both. I will phrase it as "Scope Definition."
  Actually, looking at the prompt: "I don't know whether a single account is supposed to swallow both... I want the spec to say whether that's a requirement." Okay, I will list it as a "Stretch Goal" or "Contested Scope" requirement.
  The user wants the *conflicts* flagged. The biggest conflict is between "It's a pragmatic error" and "It's a doxastic impossibility."
  Let's refine the "Conflict" section to be very explicit about the trade-off.

  10. **Finalizing the "Killer Requirement":**
