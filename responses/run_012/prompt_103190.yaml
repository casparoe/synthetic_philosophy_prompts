answer: |-
  ### Exam Question

  **Course:** PHI 450: Teleology and Functions
  **Assessment:** Take-Home Final
  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Question:**

  Consider the concept of a **free-floating rationale**: a reason for a trait's existence that is grounded in a selection process, even if no agent represents that reason. Evaluate this concept using the following three cases:

  1.  **The Bodyguard Plant:** A plant releases volatiles when chewed, attracting wasps that kill the caterpillar. The plant has no neural representation of the wasp or the goal of survival.
  2.  **The Architectural Spandrel:** A biological structure arises purely as a necessary byproduct of developmental geometry. It confers no advantage and has no selection history, though it resembles a functional adaptation.
  3.  **The Underdetermined Trait:** A trait exists where two distinct selection histories (Rationale X and Rationale Y) fit the available evolutionary evidence equally well. Nothing in the biology distinguishes between them.

  **In a single coherent essay, answer the following:**

  1.  For cases (1) and (2), state whether a free-floating rationale exists. Explicitly state the **criterion** you are using to make this distinction.
  2.  Apply that criterion to case (3). Is the free-floating rationale a fact about the organism or a fact about our descriptive limitations?
  3.  Does invoking "free-floating rationales" do explanatory work that plain talk of natural selection (frequency changes over time) does not, or is it merely a mentalistic redescription of the same physical facts?

  ***

  ### Model Answer (Approx. 600 Words)

  To evaluate free-floating rationales, we must adopt the **Selected Effect (SE) criterion**: a trait has a function (and thus a rationale) if and only if it was preserved by natural selection *for* that effect. This criterion decouples function from mental representation, allowing rationales to "float" free of minds, provided they are anchored in selection history.

  Applying this to **Case 1 (The Bodyguard Plant)**, a free-floating rationale clearly exists. The volatile release was selected *because* it attracted wasps that increased fitness. The absence of neural representation is irrelevant under the SE account; the "reason" is encoded in the differential reproduction of ancestors, not in the plant's head. The rationale is real because the selection history is real.

  In **Case 2 (The Spandrel)**, there is no free-floating rationale. While the structure looks designed, it lacks the requisite etiology. It was not selected *for* its current appearance; it is a causal byproduct. To attribute a rationale here is to mistake current utility for historical function. The SE criterion correctly denies a rationale here, distinguishing genuine teleology from mere appearance.

  **Case 3 (The Underdetermined Trait)** presents the critical challenge. If Rationale X and Rationale Y fit the evidence equally, is there a fact of the matter? A robust realist about free-floating rationales must argue that the rationale is a **fact about the organism**, not us. Evolutionary history is singular; the trait *was* selected for X or Y (or both), even if our epistemic access is insufficient to distinguish them. To claim the rationale is "just a fact about us" collapses teleology into instrumentalism, suggesting functions are projections rather than discoveries. However, this commitment reveals a limit: if history is genuinely inscrutable, the free-floating rationale becomes ontologically real but epistemically inaccessible. We must resist the temptation to say "both are true"; the SE criterion demands a specific historical chain. If that chain is lost, the specific rationale is unknown, not indeterminate.

  Does this notion do explanatory work, or is it redescription? Plain natural selection talk describes *how* frequencies changed (the mechanism). Free-floating rationale talk explains *why* the trait persists in terms of stability conditions (the design stance). This distinction allows for **counterfactual reasoning** that plain frequency talk obscures. For example, in Case 1, we can predict that if the wasp goes extinct, the plant's trait becomes maladaptive. Plain selection talk only records past frequency increases; it does not inherently highlight the *dependency* relationship that sustains the trait.

  Furthermore, free-floating rationales allow for **multiple realizability**. We can group the plant's chemical release with a bird's alarm call under the rationale "recruiting bodyguards," despite different physical mechanisms. Plain selection talk ties us to specific physical histories; rationale talk abstracts the functional logic. This abstraction is not merely mentalistic decoration; it generates predictions about how the system will respond to perturbations. If the rationale were just a redescription, it would add no predictive leverage. Because it allows us to anticipate system behavior based on goal-directed norms (e.g., "the system should fail if the goal is blocked"), it constitutes a distinct explanatory level.

  However, we must acknowledge the risk in Case 3. If we cannot distinguish between rationales, our explanatory power stalls. Thus, the concept of free-floating rationales is robust only where selection histories are recoverable. It is not a magic bullet for ignorance. It transforms physical facts into normative facts (what the trait *ought* to do), which is essential for biology, but it remains tethered to the hard constraint of actual history. Without that tether, as in Case 2, it is fiction; with it, as in Case 1, it is science.

  ***

  ### Marking Scheme (20 Marks)

  **Grade Band A (16–20 Marks): Distinction**
  **Grade Band B (11–15 Marks): Credit**
  **Grade Band C (6–10 Marks): Pass**
  **Grade Band D (0–5 Marks): Fail**

  #### 1. Analysis of Cases 1 & 2 (Criterion Application) – 6 Marks
  *   **A (5-6 marks):** Explicitly names a criterion (e.g., Selected Effect, Etiological). Correctly identifies Case 1 as having a rationale (selection without representation) and Case 2 as lacking one (no selection history). Explains *why* the criterion yields these results (etiology vs. current utility).
  *   **B (3-4 marks):** Gets the verdicts right (Yes for 1, No for 2) but the criterion is vague (e.g., "it depends on evolution"). May confuse "function" with "benefit" in Case 2.
  *   **C (1-2 marks):** Verdicts inconsistent with the stated criterion. Confuses free-floating rationale with conscious intent (claims Case 1 has no rationale because the plant doesn't think).
  *   **D (0 marks):** Fails to address both cases or gets both verdicts wrong.

  #### 2. Analysis of Case 3 (Ontology vs. Epistemology) – 8 Marks
  *   **A (7-8 marks):** Directly addresses the "fact about organism vs. fact about us" prompt. Takes a defensible stance (usually realism: history is singular even if unknown). Distinguishes ontological status from epistemic access. Acknowledges the tension this creates for the theory.
  *   **B (4-6 marks):** Addresses the prompt but conflates "we don't know" with "there is no fact." May suggest both rationales are equally real (relativism) without justification. Treats the problem as purely evidentiary rather than conceptual.
  *   **C (2-3 marks):** Ignores the "fact about us" dimension. Simply restates that Case 3 is confusing. Claims the rationale is undefined without explaining the implications for teleology.
  *   **D (0-1 marks):** No engagement with Case 3.

  #### 3. Explanatory Value (Redescription vs. Work) – 4 Marks
  *   **A (4 marks):** Identifies specific explanatory gains (e.g., counterfactuals, multiple realizability, normative predictions). Clearly distinguishes the "Design Stance" from the "Physical Stance."
  *   **B (2-3 marks):** Claims it has value but is vague on *how* (e.g., "it helps us understand better"). Fails to distinguish it clearly from plain selection talk.
  *   **C (1 mark):** Claims it is purely redescription or purely magical with no argument.
  *   **D (0 marks):** No engagement.

  #### 4. Clarity and Structure – 2 Marks
  *   **A (2 marks):** Coherent essay flow. Precise philosophical terminology. Adheres to word constraints.
  *   **B (1 mark):** Understandable but disorganized. Terminology used loosely.
  *   **C/D (0 marks):** Difficult to follow or significantly over/under length.

  #### Specific Penalties / "Killer Mistakes"
  *   **-3 Marks:** Claiming Case 1 lacks a rationale because the plant has no mind (misses the core concept of the unit).
  *   **-3 Marks:** Claiming Case 2 has a rationale because the structure is useful (confuses Selected Effect with Causal Role).
  *   **-2 Marks:** Treating "free-floating rationale" as synonymous with "unconscious mental state."
  *   **-2 Marks:** In Case 3, arguing that biology *creates* the rationale rather than discovers it (unless argued as a sophisticated constructivist position).
