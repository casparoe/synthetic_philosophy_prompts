answer: |-
  # Graduate Seminar in Value Theory: Final Examination

  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in essay form. You may not consult any external materials. An answer that merely surveys the options without committing will not count as a good one.

  **Definitions:**
  *   **A Grain:** A single just-noticeable flicker of mild bodily discomfort, lasting a fraction of a second, of a kind that no one would take any step to avoid and that leaves no trace.
  *   **The Wrack:** Fifty years of unremitting severe pain undergone by one person, with no relief and no compensation.

  **Question:**
  1.  Is there any finite number *N* such that an outcome in which *N* distinct people each undergo exactly one Grain is worse, all things considered, than an outcome in which one person undergoes the Wrack?
  2.  Suppose the Grains are so arranged that each person undergoes exactly one and no one's life, taken as a whole, is any the worse than it would otherwise have been (due to compensation or contextual swamping). Does that change your answer to the first question, and why?

  **Requirements:**
  Beyond a verdict on the first question, your essay must:
  (a) State the general principle that generates your verdict and explain what makes it a principle rather than a mere stipulation.
  (b) Say what that principle forces you to accept elsewhere — in particular, whether it commits you to something like the Repugnant Conclusion, or to denying the transitivity or the continuity of the *better-than* relation, or to positing a discontinuity in value that stands in need of explanation.
  (c) Answer the second question in a way that is consistent with the principle given in (a).

  ***

  # Model Answer

  My verdict on the first question is negative: there is no finite number *N* of Grains that makes the outcome worse than one person undergoing the Wrack. The Wrack is lexically worse than any aggregation of Grains. This verdict is generated by the **Principle of Lexical Thresholds**. This principle holds that harms above a certain severity threshold cannot be outweighed by any sum of harms below that threshold, regardless of the number of sufferers. This is a principle rather than a stipulation because it derives from a qualitative distinction in the nature of suffering itself, not an arbitrary numerical cutoff. Severe pain destroys agency and consumes the subject's world; a Grain is merely a nuisance that leaves the subject's capacity for well-being intact. The distinction is grounded in the phenomenology of pain, making the threshold objective rather than stipulative.

  Adopting this principle forces me to accept specific logical costs regarding the structure of value. Most significantly, I must deny the continuity of the *better-than* relation. If value were continuous, a sufficient number of small disvalues would eventually sum to outweigh a large disvalue. By asserting lexical priority, I posit a discontinuity in value space. This avoids the Repugnant Conclusion in the negative domain (the "Sadistic Conclusion"), where vast numbers of trivial harms outweigh severe torture. However, this commitment requires me to defend the existence of a sharp boundary where value jumps. While some argue this violates transitivity (via spectrum arguments), I maintain transitivity holds within categories; the lexical break prevents the spectrum from forming a continuous chain that forces a transitive collapse. The cost is accepting that value is not purely additive across qualitative kinds.

  Regarding the second question, the arrangement where no one's life is overall worse does not change my verdict; it reinforces it. My principle relies on the intrinsic badness of the experience, not merely the net impact on a life narrative. However, if a life is not overall worse, the moral weight of the Grain is further diminished, arguably rendering it morally negligible rather than just lexically inferior. Even if one argues the Grain retains negative intrinsic value despite the life being overall unaffected, the Lexical Threshold Principle still applies: the intrinsic badness of a Grain remains below the severity threshold required to compete with the Wrack. Therefore, the outcome remains better than the Wrack outcome.

  Consistency is maintained because the principle focuses on the *kind* of harm occurring in the outcome, not solely on the aggregate welfare change per life. Whether the Grain is compensated within a life or not, it remains a sub-threshold harm. The Wrack remains a super-threshold harm. Since no sum of sub-threshold harms can outweigh a super-threshold harm, the addition of the "no overall worse life" condition does not bridge the lexical gap. It merely removes one potential counter-argument (that the Grains constitute a net welfare loss) that might have tempted a utilitarian aggregationist. My position remains stable: the qualitative nature of the Wrack protects it from being outweighed by quantity, regardless of whether the quantity constitutes a net loss for the individuals involved. To argue otherwise would be to treat value as purely quantitative, which my principle explicitly rejects.

  \answer{Lexical Discontinuity}

  ***

  # Marking Scheme

  | Point | Marks | Characteristic Failure |
  | :--- | :--- | :--- |
  | **1. Definite Verdict on Q1** | 5 | Fails to state a clear "Yes" or "No" (hedges or claims indeterminacy). |
  | **2. Principle Articulation** | 5 | Describes a view without identifying the underlying rule (e.g., says "utilitarianism" but fails to explain *why* it is a principle vs. stipulation). |
  | **3. Logical Commitments** | 5 | Vaguely mentions "counter-intuitive results" without naming specific logical properties (e.g., continuity, transitivity) denied or accepted. |
  | **4. Verdict on Q2** | 5 | Ignores the second question or provides a verdict without justification. |
  | **5. Consistency Check** | 5 | Q2 verdict contradicts the principle established in Q1 (e.g., switches to aggregationism for Q2). |

  \answer{Lexical Discontinuity}
