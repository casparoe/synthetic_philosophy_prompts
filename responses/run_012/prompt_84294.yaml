  **(Self-Correction during drafting):** I need to be careful not to dismiss Searle too easily. His point is about the *structure of the mind*, not the mechanism. In CS terms, he's arguing for a hardware feature, not a software protocol. I should make that distinction clear. Also, for Gilbert, emphasize that the "Plural Subject" is a virtual machine instance distinct from the nodes.

