  8.  **The "Carrying a Table" Verdict:**
      *   Scenario: Two people, physical coordination, continuous adjustment.
      *   *Gilbert:* Too rigid? Requires explicit agreement to stop.
      *   *Searle:* Too magical? "Primitive" doesn't explain *how*.
      *   *Bratman:* Fits best. Interlocking sub-plans ("I lift left," "You lift right"), mutual responsiveness (adjusting to wobble), common knowledge (we know we are lifting).
      *   *CS Analogy:* Bratman is like a distributed control loop with shared state. Gilbert is like a transaction. Searle is like a CPU instruction.
      *   *Selection:* Bratman. It captures the dynamic, adaptive nature of the task without requiring a rigid transactional boundary or a magical primitive.

