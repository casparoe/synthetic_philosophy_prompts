answer: |-
  There is no single, canonical term in rhetoric or logic that captures this specific dialectical shape, though it touches on concepts in the philosophy of science (Lakatos), philosophy of mind (Functionalism), and systems theory (Equifinality).

  The pattern you have identified is distinct because it is not a retreat from a claim, but a **transmutation of the claim's ontology**. The debate survives not by changing the standard of victory, but by changing the *nature of the object* that is supposed to achieve victory, while insisting it is the same object.

  I propose we call this move **The Functionalist Pivot**.

  ### Definition: The Functionalist Pivot

  **The Functionalist Pivot** is a dialectical maneuver in which a defender, faced with an impossibility claim based on *mechanism* (Essentialism), responds with a model that achieves the same *output* via a different mechanism (Functionalism). This forces the critic to retreat from claiming the outcome is *impossible* to claiming the mechanism is *inauthentic*.

  The result is a **Dual-Victory Stalemate**:
  1.  **The Critic** claims victory because the defender admitted the functional role (e.g., prices) is indispensable.
  2.  **The Defender** claims victory because they proved the functional role can be realized without the original mechanism (e.g., markets).

  The debate then relocates from **Feasibility** ("Can it be done?") to **Identity** ("Does this count as the real thing?").

  ---

  ### Why Existing Labels Fail

  You correctly intuited that standard fallacies don't fit. Here is the precise carving of the differences:

  | Concept | Why it doesn't fit | The Functionalist Pivot |
  | :--- | :--- | :--- |
  | **Moving the Goalposts** | Implies changing the *criteria for success* to avoid defeat (bad faith). | The criteria (efficient allocation) remain identical. The *means* change, and the *definition of the means* becomes the battleground. |
  | **Motte-and-Bailey** | Involves retreating to a *pre-existing*, modest claim that was always defensible. | There is no retreat to a safe core. The entire thesis is transformed from "We don't need prices" to "We can make prices." |
  | **Proof-of-Concept** | Implies a successful demonstration that ends the dispute. | The "proof" (Lange's model) does not end the dispute; it *sustains* it by shifting the ground from physics to semantics. |
  | **In-Principle vs. In-Practice** | Usually distinguishes theory from engineering constraints. | This is deeper: it distinguishes *ontology* (what a price *is*) from *phenomenology* (what a price *does*). |

  ### The Philosophical Engine: Essentialism vs. Functionalism

  The engine driving this pivot is a clash between two philosophical stances:

  1.  **Essentialism (Mises):** A thing is defined by its origin or structure. A "price" is *essentially* a signal emerging from voluntary exchange. If you calculate it centrally, it is not a price; it is a shadow. Therefore, socialism lacks prices *by definition*.
  2.  **Functionalism (Lange):** A thing is defined by its causal role. A "price" is *functionally* a number that balances supply and demand. If the Planning Board produces that number, it *is* a price, regardless of origin.

  The Pivot occurs when the Functionalist forces the Essentialist to argue against the *function* (which works) by retreating to the *essence* (which is missing).

  ### Edges and Applications

  You asked where else this shape appears. The Functionalist Pivot is ubiquitous in debates about complex systems where the *source* of a property is contested.

  #### 1. Artificial Intelligence (The Turing Shift)
  *   **Claim:** Machines cannot "think" or "understand" (Essentialist: understanding requires qualia/biology).
  *   **Pivot:** Build a system that passes the Turing Test (Functionalist: understanding is the ability to converse indistinguishably from a human).
  *   **Stalemate:**
      *   *AI Skeptic:* "It proves syntax is possible without semantics." (Victory for the necessity of biology).
      *   *AI Proponent:* "It proves semantics is unnecessary for intelligent behavior." (Victory for the sufficiency of computation).
  *   **Edge:** The pivot breaks if the system fails the test (feasibility failure) or if the "understanding" leads to errors a human wouldn't make (functional divergence).

  #### 2. Public Goods (The Market Boundary)
  *   **Claim:** Free markets cannot provide public goods like lighthouses (Essentialist: markets require excludability).
  *   **Pivot:** The state provides lighthouses within a capitalist framework (Functionalist: the economy still functions as a market).
  *   **Stalemate:**
      *   *Market Purist:* "That proves markets aren't self-sufficient; you need a state crutch."
      *   *Mixed Economist:* "That proves markets are compatible with state provision."
  *   **Edge:** The pivot breaks if the state provision crowds out so much private activity that the system is no longer recognizably a "market" (the isomorphism collapses).

  #### 3. Biological Evolution (Intelligent Design)
  *   **Claim:** Natural selection cannot produce "irreducibly complex" organs (Essentialist: design requires a designer).
  *   **Pivot:** Evolutionary algorithms simulate design processes to produce complex outputs (Functionalist: design is the output, not the intent).
  *   **Stalemate:**
      *   *ID Proponent:* "The algorithm was designed by a human; nature has no programmer."
      *   *Evolutionary Biologist:* "The process works without a programmer in the simulation; nature doesn't need one either."

  ### When the Pivot Fails (The Edges)

  The Functionalist Pivot is robust, but it has two failure points where the debate collapses back into a plain refutation:

  1.  **Functional Drift:** If the simulation cannot track changing conditions as well as the original. (Hayek's later argument against Lange: The Planning Board can set prices, but it cannot access the *tacit knowledge* required to adjust them fast enough. The function is not actually equivalent.)
  2.  **Incentive Incompatibility:** If the simulation requires agents to act against their nature. (Lange instructs managers to minimize cost; Mises/Hayek argue managers in a socialist state lack the *incentive* to do so. The mechanism works on paper, but not with human psychology.)

  ### Summary

  The move is **The Functionalist Pivot**.

  It is the rhetorical act of neutralizing an **ontological impossibility** ("You can't have X without Y") by demonstrating a **functional isomorphism** ("We can have X-like outcomes using Z"). It transforms a debate about **possibility** into a debate about **authenticity**, allowing both sides to claim they have vindicated the necessity of their preferred mechanism.

  It differs from moving the goalposts because the goal (efficient allocation) remains fixed; only the definition of the ball changes. It differs from Motte-and-Bailey because neither side retreats to a safer position; both advance onto the new terrain of simulation. It is the standard maneuver whenever a dispute arises over whether a phenomenon is defined by its **source** or its **effect**.
