answer: |-
  **Class Handout: The Geometry of Doubt**
  **Subject:** Social Choice Theory and *Twelve Angry Men*

  **1. The Binary Trap and the Third Option**
  Start by acknowledging the structural friction. Arrow's Impossibility Theorem requires at least three alternatives to generate a paradox. A jury verdict appears binary: Guilty or Not Guilty. If you treat it as a simple binary choice, Arrow does not apply; majority rule works fine without contradiction.

  However, the legal reality provides the third alternative: The Hung Jury. A mistrial is a distinct social outcome from an acquittal. It consumes resources, allows the defendant to remain in limbo, and permits retrial. Once you recognize "Hang" as a third option, the jury system is no longer a simple binary switch. It is a mechanism trying to order three states: Conviction, Acquittal, and Deadlock.

  The film initially treats "Hang" as a system failure. The judge admonishes them to fulfill their duty. The jurors treat the holdout as a nuisance. But through the lens of social choice, the Hung Jury is the only escape valve from the impossibility of aggregating twelve distinct internal orderings into one collective ranking without violating fairness conditions. The film asks you to watch how a group moves from the threat of Deadlock toward Consensus, and whether that consensus is genuine or coerced.

  **2. Unanimity as Distributed Dictatorship**
  The jury operates under a unanimity rule for conviction. In social choice terms, this grants every individual a veto. If the social choice function requires everyone to agree on "Guilty," then any single juror is a dictator over the "Guilty" outcome. They cannot force an acquittal alone, but they can single-handedly block a conviction.

  This creates what you might call a distributed dictatorship. Power is not concentrated in one person; it is smeared across twelve. The cost of this safeguard is instability. As Arrow would predict, a rule that gives everyone veto power risks producing no outcome at all (the Hung Jury).

  Does the film acknowledge this trade-off? Yes, but it frames it morally rather than mathematically. Juror 8 does not argue that the defendant is innocent; he argues for his right to exercise the veto. He leverages the system's inability to produce an outcome to force a re-evaluation of the inputs. The film suggests that the "failure" of the rule to produce a quick verdict is actually its success. It forces the cost of the veto to be paid in time and emotional labor. The question for the class: Is the exhaustion of the jurors a bug or a feature? Does the system work because it is painful?

  **3. Premises, Verdicts, and Incoherence**
  You asked whether the film stages a scenario where the group is consistent on the parts but incoherent on the whole. This is often called the doctrinal paradox. Imagine a majority believes the knife evidence is unreliable. A majority believes the witness is lying. But a majority still votes "Guilty" because they combine the evidence differently.

  *Twelve Angry Men* largely avoids staging this specific incoherence, and that avoidance is telling. The jurors do not vote on the premises to mathematically derive the verdict. They vote on the verdict, then dismantle the premises to justify changing that vote. Juror 8 forces the group to align their beliefs about the evidence (the premises) with their vote on the outcome.

  There is a moment where this tension nearly snaps. When the jurors vote by secret ballot to see if anyone else doubts the guilt, one juror (Juror 5) admits he voted "Not Guilty" not because he believed the evidence, but because he felt pressured by the others' certainty. Here, the premise (evidence is weak) and the verdict (Not Guilty) were misaligned. The film resolves this by having them argue until the premises support the verdict.

  For the class: Ask them if the film is cheating. By refusing to vote on the premises formally, the jury avoids the mathematical paradox but opens the door to manipulation. If they had voted strictly on the reliability of the old man's testimony, would the result have been the same? Or does the film argue that legal truth cannot be reduced to premise-based voting?

  **4. Fixed Preferences vs. Deliberative Transformation**
  Arrow's framework assumes preferences are fixed inputs. The mechanism simply aggregates them. *Twelve Angry Men* is a counter-narrative to this assumption. The entire film is a machine for changing preferences.

  This is not a refutation of Arrow, but a boundary marker. Arrow describes the limits of *aggregation*. The film describes the potential of *deliberation*. In the film, the "profile" (the set of individual rankings) is fluid. Juror 3's preference is rooted in personal trauma; Juror 10's is rooted in prejudice. Juror 8 introduces new information (the knife, the timing) and new emotional appeals (empathy for the boy).

  The theoretical takeaway: Social choice theory tells us what happens when we count votes. It does not tell us what happens when we change minds. The film argues that a just outcome requires the latter. However, be careful not to romanticize this. Juror 8 also uses psychological manipulation. He isolates Juror 10 during his bigoted rant. He stages a reenactment of the walk to shame the older jurors. Preference change is not always rational; it is often social pressure.

  **5. The Agenda-Setter in the Room**
  The Foreman has the title, but Juror 8 has the power. In social choice, the person who controls the order of voting or discussion controls the outcome. This is the agenda-setting problem.

  Juror 8 seizes the agenda immediately. He dictates the sequence: first the knife, then the noise of the train, then the eyesight of the woman. By breaking the deliberation into discrete, winnable battles, he prevents the group from voting on the "big picture" where emotion dominates. He forces them to vote on small uncertainties.

  The Foreman represents the formal rules; Juror 8 represents the informal structure. The class should note that without an agenda-setter, the deliberation would likely have collapsed into a shouting match (chaos). With Juror 8 as the agenda-setter, the path is linear toward acquittal. This raises a normative question: Is it better to have a neutral procedure that might fail, or a manipulated procedure that leads to the "right" result?

  ***

  **Scenes to Fight About**

  **1. The Secret Ballot (Mid-Film)**
  *Context:* Juror 8 proposes a secret ballot. He abstains. If anyone votes "Not Guilty," they stay and talk. One vote comes in "Not Guilty."
  *The Fight:* Juror 3 immediately assumes he knows who did it and begins interrogating the group. This scene exposes the fragility of the unanimity rule. The mere existence of a vetoer turns the group into an inquisition. Discuss whether the secret ballot was a legitimate procedural move or a manipulation to fracture the majority without accountability.

  **2. The Knife Demonstration (Early)**
  *Context:* Juror 8 produces a switchblade identical to the murder weapon, which was claimed to be unique.
  *The Fight:* This is pure agenda control. Juror 8 introduces a new variable that changes the probability of the "Guilty" narrative. But notice the reaction: the others feel tricked. Discuss whether introducing new evidence outside the courtroom is valid deliberation or contamination. In Arrow's terms, he is altering the "state of the world" to shift the preference profile.

  **3. Juror 10's Rant (Late)**
  *Context:* Frustrated, Juror 10 launches into a bigoted tirade about "those people." The other jurors physically turn their backs on him.
  *The Fight:* This is preference change through social exclusion, not logical argument. The theorem cannot model this. The film suggests that some preferences (prejudice) must be socially invalidated before aggregation can occur. Ask the class: Is this justice, or is it mob rule in reverse? Does the film endorse silencing a voter to reach a consensus?

  **4. The Final Collapse (End)**
  *Context:* Juror 3 is the last holdout. He breaks down, crying "Not Guilty."
  *The Fight:* The system produces an outcome, but the final voter does not change his mind based on evidence. He changes based on emotional exhaustion and the realization that he is alone. The unanimity rule is satisfied, but the consensus is hollow. The film treats this as a victory for reasonable doubt. A social choice theorist might call it a coerced equilibrium.

  ***

  **Where the Film Exceeds the Theorem**

  Arrow's theorem is static; it is a photograph of a voting system. *Twelve Angry Men* is a video. The theorem tells us that no voting system is perfect under fixed conditions. The film tells us that the conditions are never fixed.

  The film adds a variable Arrow excludes: *Empathy.* Juror 8 wins not because he has better math, but because he forces the other men to inhabit the life of the defendant. He asks them to imagine the sound of the train, the drag of the leg, the fear of the boy. This transforms the choice from a calculation of probability to a moral identification.

  Social choice theory assumes voters are self-interested or have fixed ideological rankings. The film assumes voters are capable of altruistic re-ordering. The theorem predicts deadlock or dictatorship. The film offers a third path: persuasion.

  However, do not let the class leave thinking the film disproves Arrow. It merely sidesteps it. If Juror 8 had failed, and the jury hung, Arrow would be vindicated. If Juror 8 had been a demagogue leading them to convict an innocent man through the same manipulation, Arrow would be vindicated. The film shows the *best-case scenario* for deliberation. Social choice theory warns us about the *structural risks*. Use the film to show the potential of human reasoning; use Arrow to show why we cannot rely on it.
