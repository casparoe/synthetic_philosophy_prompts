      *   **The Unanimity Rule (Veto Power):** This is the strongest point. Unanimity = Intersection of sets. Everyone is a dictator over the "Guilty" outcome. If anyone says "No," "Guilty" is impossible. This creates the "Dictatorship smeared across twelve." The film treats the hung jury threat as leverage for truth, not just procedural failure. Does the film know? Yes, Juror 8 leverages the veto explicitly. He doesn't claim innocence; he claims the right to block.
      *   **Premises vs. Verdict (Discursive Dilemma):** The film doesn't explicitly show a vote where Premises = Innocent but Verdict = Guilty. Instead, it shows the *manipulation* of premises to align with the verdict. Juror 8 forces them to re-evaluate premises *because* he refuses the verdict. It's the reverse of the paradox: he uses the verdict veto to force a re-vote on the premises. This is a crucial distinction. The class should discuss if this is healthy (truth-seeking) or manipulative (outcome-driven).
      *   **Fixed vs. Fluid Preferences:** Arrow assumes fixed inputs. The film shows inputs changing. This moves the discussion from *Social Choice* (aggregation) to *Deliberative Democracy* (transformation). The film argues that the *process* changes the preferences, making the aggregation valid. Arrow can't model the conversation, only the vote.
      *   **Agenda Setting:** The Foreman is weak, but he controls the *pace* and *topic*. Juror 8 seizes agenda control (the knife, the walk, the noise). This is the "structure-induced equilibrium." Whoever controls the sequence of evidence controls the path of persuasion.

