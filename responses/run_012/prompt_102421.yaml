answer: |-
  The rain against the window of Mr. Sterner's office was the sort of fine, persistent drizzle that seemed to exist solely to justify the existence of umbrellas and indoor heating. Arthur sat in the leather chair, his hands resting on his knees, watching the solicitor adjust his spectacles.

  On the desk between them lay two manila folders. They were thin, but Arthur knew they contained more weight than the paper suggested. It was the estate of a distant uncle, a man Arthur barely remembered, who had died with a peculiar sense of humour and a specific set of instructions regarding his liquid assets.

  'The first election,' Mr. Sterner said, his voice dry as toast. He opened the left folder. 'Clause Four, Section A.'

  Arthur leaned forward. The terms were simple enough. He could take a settled sum of £500. It would be transferred immediately. No conditions, no delays.

  'Alternatively,' Sterner continued, tapping the second page, 'you may elect for the lottery provision. In this scenario, there is an eighty-five per cent chance you receive the £500. There is a fourteen per cent chance you receive £2,500. And there is a one per cent chance you receive nothing.'

  Arthur sat back. The numbers hung in the air. £500 was not a fortune, but it was concrete. It was the leak in the roof fixed. It was the credit card balance cleared. It was peace of mind.

  He looked at the alternative. To gamble for the £2,500 meant risking the £500 he was already being handed. Yes, the odds were heavily in his favour to get at least the £500, but that one per cent nagged at him. One per cent was a chance. If he took the gamble and landed on that one per cent, he would walk out of this office with nothing while knowing he had thrown away a certainty. He could hear the conversation in the pub already. *You had it in your hand, Arthur. You let it slip.*

  The certainty felt warm. It felt like ownership. The gamble felt like hunger.

  'I'll take the certain sum,' Arthur said.

  Mr. Sterner nodded, making a note. He did not look surprised. He slid the first folder aside and pulled the second one forward.

  'There is a second clause,' Sterner said. 'Clause Four, Section B. This is independent of the first election, though derived from the same fund.'

  Arthur straightened his tie. He had £500 coming. He felt richer already, safer.

  'In this instance,' Sterner said, 'you cannot take a certain sum. You must choose between two probabilities. Option One: a fifteen per cent chance of receiving £500, and an eighty-five per cent chance of receiving nothing.'

  Arthur nodded. Slim odds. Mostly nothing.

  'Option Two,' Sterner continued, 'a fourteen per cent chance of receiving £2,500, and an eighty-six per cent chance of receiving nothing.'

  Arthur looked at the numbers. Fifteen per cent versus fourteen per cent. The difference was a sliver. In both cases, the overwhelming likelihood was that he would walk away with empty pockets. The safety net was gone. There was no certain £500 to protect this time.

  If he chose Option One, he was risking almost everything for a modest return. If he chose Option Two, he was risking almost the same amount for a sum that was five times larger.

  In the first decision, the £500 had felt like something he owned. To risk it was a loss. But here, neither prize was his. Both options were mostly composed of nothing. The difference between an eighty-five per cent chance of nothing and an eighty-six per cent chance of nothing was invisible to the gut. It was all grey sky.

  But the prize... £500 was bills. £2,500 was a life. £2,500 was a deposit on a car. It was a holiday somewhere warm where the rain didn't fall like this. Since he was likely to get nothing either way, why not aim for the thing that would actually change his week? The modest prize seemed paltry now that the certainty was removed. It wasn't worth the sacrifice of the larger dream when the risk was effectively the same.

  'The second option,' Arthur said. 'The fourteen per cent.'

  Mr. Sterner made another note. He capped his pen and looked at Arthur over the rim of his glasses. 'Very good. The documents will be processed.'

  Arthur stood up and took his umbrella from the stand. He shook hands with the solicitor and stepped out onto the pavement. The drizzle was still falling.

  He walked towards the bus stop, his mind turning over the last ten minutes. He had chosen safety when it was offered. He had chosen ambition when safety was impossible.

  Was it inconsistent? Mathematically, perhaps. If he valued the £500 enough to secure it against a tiny risk in the first room, should he not have valued it enough to chase it in the second? But in the first room, the £500 was a floor. In the second, it was just another ceiling.

  He thought about the one per cent chance of nothing he had avoided. He thought about the one per difference in probability he had ignored.

  A bus rumbled past, spraying a sheet of dirty water onto the curb. Arthur stepped back to avoid it. He checked his pocket for his pass. He felt neither foolish nor clever. He felt the weight of the certain £500 coming into his account, and he felt the phantom weight of the £2,500 that might never arrive.

  He opened his umbrella. It seemed sensible to stay dry while he could. But as he waited for the next bus, he found himself hoping, quite intensely, for the rain to stop, knowing full well that the sky was unlikely to listen.
