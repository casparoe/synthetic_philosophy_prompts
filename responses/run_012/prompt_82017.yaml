      *   It *is* a "Public Law Corporation" (*Körperschaft des öffentlichen Rechts*). This is the key legal concept. It grants privileges (tax collection, right to employ civil servants in some roles) in exchange for state oversight (constitution must be democratic, etc.).
      *   *View of Religion:* Religion is a *public good* or at least a *publicly relevant institution* that stabilizes society. The state facilitates it but doesn't fund it directly.
