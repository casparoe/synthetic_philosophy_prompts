answer: |-
  You are right to identify these systems not as clean implementations of political theory, but as distinct constitutional settlements that encode different metaphysical commitments about what religion *is* in relation to the polity. The incoherence you sense is real, but it is the incoherence of a map trying to represent a territory that refuses to be purely public or purely private.

  Here is the breakdown of the implicit theories, the necessary commitments of the German model, and the argument for why it cannot be reconciled with *laïcité*.

  ### 1. The Implicit Theory of the German Model
  The German system (*Kirchensteuer*) does not treat religion as a voluntary association in the liberal-private sense, nor as a public body in the statist sense. It treats recognized religious communities as **Public Law Corporations** (*Körperschaften des öffentlichen Rechts*).

  This is a specific legal category that sits between the private and the public. The implicit theory here is **Cooperative Separation**.

  *   **Religion as a Publicly Relevant Institution:** The state presupposes that religion performs a social function (welfare, education, moral cohesion) that benefits the public order. Therefore, the state grants these bodies privileges usually reserved for state agencies (e.g., the right to collect taxes via the state apparatus, the right to employ staff under public law conditions).
  *   **Membership as a Civil Status:** By linking tax liability to a state-maintained register, the German system presupposes that religious affiliation is a matter of civil record, akin to marital status or domicile. It is not merely an internal state of conscience.
  *   **State Neutrality as Parity, not Distance:** The state is not neutral by ignoring religion (as in France), but by treating all recognized religions equally *in their relationship to the state*. The state facilitates the funding of the Church not because it endorses the theology, but because it endorses the *institution's* right to exist and sustain itself without direct state subsidy.

  **The Baptism Paradox:** You noted the Church claims she is still baptised while the State says she has resigned. This is not a bug; it is a feature of the "Two Spheres" theory. The German state acknowledges the Church's sovereignty over *spiritual* status (canon law), but asserts its own sovereignty over *civil* status (tax law). The €30 fee buys you out of the civil contract, not the spiritual reality. The system presupposes that these two realities can run in parallel without the state needing to resolve the theological contradiction.

  ### 2. Comparative Implicit Theories
  To see why the German commitments are distinct, we must contrast them with the commitments of the other systems you mentioned.

  *   **France (*Laïcité*):**
      *   **Theory:** **Republican Universalism.** The citizen stands directly before the State, unmediated by any corporation.
      *   **Commitment:** The State must be blind to religious affiliation. To record religion is to fracture the unity of the citizenry. Religion is strictly private.
      *   **The Alsace Exception:** As you noted, this proves the "sedimented compromise" theory. It is a legal fossil that contradicts the core commitment of French *laïcité*, tolerated only because removing it would cost more political capital than keeping it.

  *   **United Kingdom (Establishment):**
      *   **Theory:** **Constitutional Symbolism.** The Church is an organ of the state's identity, not necessarily its funding.
      *   **Commitment:** Religious identity is woven into national sovereignty (the Monarch is the Defender of the Faith). However, the funding model (private endowments/donations) suggests a commitment to **financial disentanglement**. The state grants status and privilege (Lords, coronation) but refuses the liability of direct funding. It is establishment without fiscal entanglement.

  *   **United States (Separation):**
      *   **Theory:** **Libertarian Pluralism.** Religion is a private market good that must be protected from state interference.
      *   **Commitment:** "No Entanglement." Tax exemption is a negative liberty (the state cannot burden religion), not a positive subsidy. The "Ministerial Exception" presupposes that churches are sovereign micro-states where civil rights law does not fully penetrate. The state cannot record membership because that would imply a power to define it.

  ### 3. Presuppositions vs. Accidents in the German System
  You asked which parts of the German arrangement are genuinely presupposed and which are accidents.

  **Genuinely Presupposed (Necessary Commitments):**
  1.  **The Register:** The state *must* know who belongs to which church. Without a civil register of affiliation, the tax cannot be withheld at source. This is the non-negotiable core.
  2.  **Public Law Status:** The churches *must* be more than private clubs. If they were private NGOs, the state could not use its coercive tax apparatus to collect dues for them. They require a public mandate to access the tax infrastructure.
  3.  **The Exit Mechanism:** There *must* be a formal civil act of resignation. Since entry is often recorded civilly (via baptismal data shared with the registry) or assumed, exit must be a reciprocal legal act to update the tax status.

  **Accidents (Contingent Features):**
  1.  **The Fee:** The €30 administrative fee is contingent. It could be free, or higher. It is a bureaucratic cost-recovery measure, not a theological or constitutional necessity.
  2.  **The Rate:** The 8–9% surcharge is a legislative choice. It could be a flat fee or a different percentage.
  3.  **The Employer's Role:** The fact that the employer withholds it is an administrative convenience of the wage-tax system. It could theoretically be collected via direct debit, though less efficiently.

  ### 4. Can the German Model be Made Consistent with *Laïcité*?
  You suspect it cannot be done piecemeal. You are correct. The German arrangement is **structurally incompatible** with a *laïcité*-style view.

  **The Argument:**
  *Laïcité* is not merely a policy of funding; it is an epistemological constraint on the state. It demands that the state *cannot know* the religious affiliation of its citizens in its administrative capacity. The category "Catholic" or "Protestant" must not exist in the civil registry.

  The German *Kirchensteuer* requires the exact opposite: the state *must* know and record that affiliation to function.
  1.  **The Data Requirement:** To withhold the tax, the finance office must query the religious registry. This creates a database of creed. In a *laïc* system, the creation of this database is itself the violation.
  2.  **The Incentive Structure:** In Germany, the state has an interest in the stability of religious corporations (they provide kindergartens, hospitals, counseling). The state facilitates their funding to ensure they remain viable public partners. In a *laïc* system, the state must be indifferent to the viability of religious corporations; their survival is a private matter.
  3.  **Constitutional Lock:** The German system is not just statutory; it is anchored in the *Grundgesetz* (Basic Law), which incorporates the Weimar Constitution's articles on religion. These articles mandate the "Public Law Corporation" status. To move to *laïcité*, Germany would not just need to stop collecting tax; it would need to amend its constitution to strip churches of their public status and delete the religious field from civil registries.

  **Why Piecemeal Reform Fails:**
  You cannot simply stop recording religion while keeping the tax, because you lose the mechanism of collection. You cannot keep the record while claiming *laïcité*, because the record itself constitutes recognition.
  If you tried to hybridize it—for example, by making the tax voluntary without a register—you would collapse the system into the American model (donations). If you kept the register but stopped the tax, you would move toward the British model (status without fiscal support). But you cannot have the German fiscal support without the German administrative intrusion.

  ### Conclusion
  The German system presupposes that religion is a **publicly anchored private commitment**. It is a hybrid that refuses to choose between the private right of conscience and the public utility of the church.

  It is not incoherent on its own terms; it is coherent within a specific theory of **subsidiarity**, where the state supports social institutions that do public work without absorbing them into the state bureaucracy. However, it is fundamentally incompatible with *laïcité*, which views any state knowledge of religious affiliation as a threat to liberty.

  Your girlfriend's experience highlights the friction point: she is treated as a member of a public corporation for tax purposes, and a member of a spiritual body for sacramental purposes. The state allows her to resign from the former; the Church says she cannot resign from the latter. The German state accepts this duality. A *laïc* state would refuse to acknowledge the duality in the first place, rendering the question of resignation moot because the question of membership would never be asked.
