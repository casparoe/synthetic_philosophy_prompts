      *   *Venn's "Series":* For Venn, probability *only* exists relative to a series. There is no "probability of a single event" in isolation. It's always $P(A|B)$ where $B$ defines the series.
      *   *Does he solve RCP?* Historically, Venn is often credited with *identifying* the problem (or at least the difficulty of selecting the series) even if he didn't fully solve it in the modern sense. He acknowledges the difficulty of choosing the right series.

