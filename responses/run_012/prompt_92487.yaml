answer: |-
  Dear Colleague

  It was a pleasure to discuss your final-year seminar on rational-choice and democratic theory, and I have drafted the take-home final essay question as we discussed. The aim is to force students to engage with the logic of the voting paradox without relying on the standard dismissal of instrumental rationality. The question is built around the reasoning from your reading group colleague, attributed exactly as you requested, and it mandates four specific analytical tasks. The question reads as follows. Consider the following position offered by a colleague in our reading group. The turnout puzzle is an error in the unit of analysis. The standard puzzle, she says, asks what difference my single vote makes; but voting is not a solitary act with a solitary effect, it is a move inside a practice that only functions if enough others make the same move. Ask instead what happens when people situated as I am, deciding as I decide, vote or stay home, and a reason to vote reappears. She concludes that the paradox therefore dissolves rather than being solved. Write an essay that assesses this argument. First, reconstruct the standard rational-choice argument precisely enough to identify which premise the colleague's reframing actually attacks, making clear that the argument does not claim a vote has no effect but that its expected effect is swamped, so that the conclusion depends on how the value of the outcome is specified and on the size of the cost. Second, distinguish the turnout puzzle from the other problem that is also called the paradox of voting, and say why treating them as one thing is a mistake. Third, assess whether the colleague's move dissolves the paradox or merely relocates it by locating the inferential gap between what people in my position would bring about and what I have reason to do, and decide whether closing that gap requires an independent normative premise about participating in a practice, in which case the puzzle is conceded rather than dissolved. Fourth, say what the whole exercise implies for the ethics of voting, in particular whether there can be a duty to vote that is not grounded in the expected consequences of one's own ballot, and whether any such duty is conditional on the character of the practice.

  Below is a model answer designed to show the depth of analysis you should expect from an A-grade student. It runs to approximately seven hundred words. The standard rational-choice argument posits that a rational agent votes only if the expected utility of voting exceeds the cost. This expected utility is the probability of being pivotal multiplied by the benefit of the preferred outcome. Since the probability of a single vote deciding an election is astronomically low, the expected benefit is swamped by even minimal costs of time and effort. The colleague attacks the premise that the unit of analysis is the individual act rather than the collective practice. She suggests we should consider the effect of a cohort of similar agents voting simultaneously. However, we must distinguish this turnout puzzle from the other paradox of voting, often associated with Condorcet or cyclical majorities, which concerns the coherence of collective preferences rather than individual incentives. Conflating them is a mistake because the former is a problem of individual motivation within aggregation, while the latter is a problem of aggregation itself. Assessing the colleague's claim requires noting that showing a group of similar voters matters does not automatically give me a reason to join them. There is an inferential gap between the claim that people like me voting changes outcomes and the claim that I therefore have a reason to vote. Closing this gap requires an independent normative premise, such as a duty of fair play or a Kantian universalizability principle, which asserts I must act as I would have others in my position act. If such a premise is required, the paradox is not dissolved but relocated from instrumental rationality to normative theory. The colleague claims dissolution, but she actually concedes the instrumental failure and shifts the ground to obligation. This implies that a duty to vote cannot be grounded in the expected consequences of one's own ballot alone. Instead, it must be grounded in the value of the practice itself. Such a duty is conditional on the character of the practice. If the practice is corrupt or the options are morally equivalent, the duty may vanish. Thus, the ethics of voting relies on the integrity of the democratic system rather than the causal power of the individual ballot. The colleague is right that the individualist frame is limited, but wrong that this dissolves the puzzle without remainder. It merely changes the terms of engagement from calculation to obligation. The standard argument remains valid instrumentally, so the normative premise must do the heavy lifting. Students must recognize that the move from is to ought here is not automatic. The group effect is a fact, but the reason to participate is a value. Without that value, the free-rider problem remains intact even if the unit of analysis shifts. The ethics of voting thus becomes a question of membership and contribution rather than causation. This preserves the rational-choice insight while allowing for democratic duty. The colleague's error is thinking that changing the description changes the logic. It does not. It changes the solution space. We move from expected utility to deontology or virtue ethics. This is a significant shift, not a dissolution. The paradox remains for the instrumentalist. It is solved only for the normativist. The essay should conclude that the colleague offers a relocation, not a dissolution, and that this relocation necessitates a robust account of political obligation grounded in the practice's character.

  Finally, here is the marking scheme structured as five must-hit points worth five marks each, totaling twenty-five marks. The first point requires a precise reconstruction of the standard expected utility argument, noting that the probability is low but not zero, and candidates typically lose this by claiming the standard argument says a vote has no effect whatsoever. The second point requires a clear distinction between the turnout puzzle and the cyclical majority paradox, and candidates typically lose this by treating both as problems of aggregation or failing to name the second paradox. The third point requires identification of the inferential gap between group impact and individual reason, and candidates typically lose this by assuming the group effect automatically generates an individual reason. The fourth point requires assessing whether a normative premise is needed to close that gap, and candidates typically lose this by accepting the colleague's claim of dissolution without questioning the need for an independent obligation. The fifth point requires an account of the ethics of voting conditional on practice character, and candidates typically lose this by arguing for an unconditional duty to vote regardless of the system's integrity. To separate an A answer from a B answer, you should look at whether the student keeps dissolution and relocation distinct and by whether it makes a normative account of voting do real work rather than invoking it as a label. An A answer will explicitly state that the normative premise carries the weight that instrumental rationality cannot, whereas a B answer will suggest the colleague's reframing alone solves the problem without additional normative machinery. You should penalize any answer that fails to note that the standard argument depends on the specification of outcome value and cost size, as this is crucial for the first point. You should also penalize any answer that does not address the conditionality of the duty on the character of the practice, as this is crucial for the fifth point. The marking should be strict on the distinction between dissolving a paradox and relocating it, as this is the core theoretical insight of the question. Ensure that students do not simply summarize the literature but evaluate the specific argument provided by the colleague. The goal is to test their ability to dissect reasoning rather than recall facts. I hope this draft serves your seminar well and provokes the kind of rigorous thinking you aim for.

  Best wishes
