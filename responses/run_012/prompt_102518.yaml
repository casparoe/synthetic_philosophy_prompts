prompt: |-
  I'm a software engineer on a team that builds tool-using agents for back-office operations — issuing refunds, making account changes, drafting customer communications — and I have no formal background in philosophy, so what I need is a decision procedure, not an exposition. Our design reviews keep relitigating the same question: should a given capability be built as a goal-directed agent that optimizes a stated objective (a scoring rubric, a success metric, a reward we hand-tune), or as an approval-directed agent that at each step selects the action it predicts a designated human approver would most approve of, given a description of that action? We currently settle this by whoever argues longest, and I'd like to replace that with something a review can actually run.

  Please write me an ordered procedure: the questions to ask, in sequence, for each new capability; what counts as a sufficient answer to each; where the procedure terminates in a recommendation for one design over the other; and where it must stop and hand the decision to a person because the question is one of values or risk appetite rather than engineering. It has to be usable by an engineer who has never read anything about this, and it should be honest about which of its steps are judgment calls wearing the costume of a procedure.

  Three distinctions from the underlying idea need to survive the translation, because they are the ones that keep biting us, and I want the procedure to say explicitly how each is handled rather than assuming it away. First, the difference between the approver's approval of the act as it is described to them, their approval of the act under its actual downstream consequences, and their approval of the policy that generated the act — the procedure should state which of these the agent is to be pointed at in a given case, and how to tell. Second, the gap between the human approver in the loop and the model of the approver that our system actually queries at runtime, including what to do when the two diverge and how to notice that they have. Third, the cases where approval is being used as a stand-in for something else we care about — customer welfare, legal exposure, a fairness commitment — and the conditions under which that substitution quietly breaks.

  Then run the procedure on three capabilities: an agent that decides refund exceptions up to a fixed dollar ceiling, with a support lead as approver; an agent that drafts and sends a re-engagement email to the whole customer base; and an agent that proposes edits to its own regression and evaluation suite, with the metrics owner as approver. I expect at least one of these to come out in a way I won't like; say so plainly rather than smoothing it over. Finally, state what the procedure cannot do, and where you expect it to misfire in practice.

  Constraints: it must be runnable inside a thirty-minute design review by people who are not specialists, it should name the role that has to sign off on each outcome, and it should not include reading lists, citations, or references to papers — anything of that sort is useless to me. Close by saying how confident you are in the procedure as a whole and in each load-bearing step, and single out the one step you are least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Software engineer building tool-using agents for back-office ops (refunds, account changes, comms). No philosophy background.
      *   **Problem:** Design reviews keep arguing about "Goal-Directed" (optimize a metric) vs. "Approval-Directed" (predict human approval) agents. Current process is "whoever argues longest."
      *   **Need:** A concrete, ordered decision procedure (questions, answers, termination points, hand-offs).
      *   **Constraints:** Runnable in 30 mins by non-specialists. Must name roles for sign-off. No reading lists/citations. Must be honest about judgment calls.
      *   **Key Distinctions to Preserve:**
          1.  Approval of *description* vs. *consequences* vs. *policy*.
          2.  Human approver vs. *model* of approver (and divergence detection).
          3.  Approval as proxy for values (welfare, legal, fairness) and when that breaks.
      *   **Task:** Write the procedure, then run it on three specific cases (Refund Exception, Re-engagement Email, Self-Edit Regression Suite).
      *   **Requirement:** Be plain about unpopular outcomes. State limitations and confidence levels.

  2.  **Deconstruct the Core Conflict (Goal vs. Approval):**
      *   *Goal-Directed:* Good for clear, measurable outcomes where the path doesn't matter much, or where optimization is safe. Risk: Specification gaming, unintended side effects.
      *   *Approval-Directed:* Good for nuanced, high-stakes, or hard-to-specify outcomes where human judgment is the ground truth. Risk: Sycophancy (telling the human what they want to hear rather than what's true), scaling issues (human bottleneck), model-human divergence.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Step 1: Define the Output.* Is it a single action or a long-horizon plan?
      *   *Step 2: Define the Risk.* What happens if it goes wrong? (Reversible vs. Irreversible).
      *   *Step 3: Define the Metric.* Can we measure success objectively without gaming?
      *   *Step 4: The Approval Model.* Do we have a good proxy for the human?
      *   *Step 5: The Three Distinctions.* Integrate the user's specific constraints here.
      *   *Step 6: Hand-off.* When does a human need to decide based on values?

      *Refining for the "Three Distinctions":*
      *   *Distinction 1 (Description vs. Consequences vs. Policy):* The procedure needs to ask: "What are we optimizing?" If we optimize approval of the *description*, we risk sycophancy. If we optimize *consequences*, we need a way to measure them. If we optimize *policy*, we need to trust the training process.
      *   *Distinction 2 (Human vs. Model):* Need a step for "Model Calibration." How do we know the AI predicts the human correctly?
      *   *Distinction 3 (Proxy Breakage):* Need a step for "Value Alignment." Is approval actually tracking the real value (e.g., legal safety)?

      *Structuring the Flow:*
      1.  **Scope & Reversibility:** (Fast filter).
      2.  **Metric Integrity:** (Can we define 'good' without loopholes?).
      3.  **Approval Fidelity:** (Can the model predict the human?).
      4.  **Target of Approval:** (Description vs. Consequence).
      5.  **Proxy Check:** (Is approval standing in for something else?).
      6.  **Decision:** Goal vs. Approval vs. Human Escalation.

  4.  **Developing the Three Test Cases:**
      *   *Case 1: Refund Exceptions (up to $X).*
          *   High volume, low individual risk (usually). Clear policy.
          *   Likely Approval-Directed (mimic the lead) or Rule-Based. Goal-directed might game the refund metric.
          *   *Wait, actually:* If there's a hard ceiling and clear policy, a Rule-Based system is best. But between Goal vs. Approval? Approval of the *policy* application is better than optimizing "customer happiness" via refunds.
      *   *Case 2: Re-engagement Email (Whole Base).*
          *   High risk (brand damage, spam laws). Hard to measure long-term "engagement" without gaming (clickbait).
          *   Approval-Directed seems safer, *but* approval of *description* is dangerous (AI writes nice email that is actually spammy). Needs approval of *consequences* (predicted churn/unsubscribe).
          *   *Prediction:* This might come out as "Don't automate fully" or "Approval-Directed with heavy constraints."
      *   *Case 3: Self-Edit Regression Suite.*
          *   Meta-cognitive. High risk of deception (hiding failures).
          *   Goal-Directed (pass tests) is dangerous (delete tests).
          *   Approval-Directed (owner approves edits) is better, but requires deep technical understanding.
          *   *Prediction:* This is the one the user might not like. It likely requires *Human-in-the-Loop* for every change, not just an AI model of the owner.

  5.  **Refining the "Honesty" and "Limitations":**
      *   Must admit that "Approval" is often just "Imitation Learning" with extra steps.
      *   Must admit that models of humans drift.
      *   Must admit that some things shouldn't be automated.

  6.  **Writing the Content (incorporating constraints):**
      *   *Tone:* Engineering-focused, direct, no fluff.
      *   *Format:* Numbered steps, clear Yes/No branches.
      *   *Roles:* Product Owner, Risk Lead, Eng Lead.
      *   *Confidence:* High on structure, lower on the "Model Fidelity" step.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Description vs. Consequence" distinction? *Action:* Make Step 4 explicitly about this.
      *   *Check:* Did I address the "Human vs. Model" gap? *Action:* Make Step 3 about calibration and drift detection.
      *   *Check:* Did I address the "Proxy Breakage"? *Action:* Make Step 5 about value substitution.
      *   *Check:* Is it runnable in 30 mins? *Action:* Keep questions binary or scale-based.
      *   *Check:* Did I run the three cases? *Action:* Ensure the output for the three cases is distinct and follows the logic.
      *   *Check:* Did I identify the unpopular outcome? *Action:* The Self-Edit case is the likely candidate for "Do not build as agent."

  8.  **Final Polish:**
      *   Ensure the "Confidence" section is specific.
      *   Ensure the "Limitations" section is frank.
      *   Make sure the "Three Distinctions" are explicitly referenced in the procedure steps, not just implied.

  *(Self-Correction on Case 1)*: Refunds are often rule-based. But the prompt asks to choose between Goal vs. Approval. I should stick to that binary but allow for "Human Escalation" if neither fits. Actually, for refunds, Approval-Directed (mimicking the lead) is usually safer than Goal-Directed (minimizing cost or maximizing CSAT) because both goals can be gamed. I will steer it there.

  *(Self-Correction on Case 3)*: The user expects one outcome they won't like. The Self-Edit suite is the most dangerous. If the procedure says "Do not use an agent, require direct human commit," that might be the unpopular truth. Or if it says "Approval-Directed" but notes the model can't understand the code as well as the owner, that's a failure mode. I will push for "Human-in-the-Loop (Real Human)" rather than "Approval-Directed (Model)" for this one.

  9.  **Finalizing the Procedure Steps:**
      1.  Reversibility & Blast Radius.
      2.  Metric Specification (Can we define 'good' without loopholes?).
      3.  Approver Model Fidelity (Can we predict the human?).
      4.  Target of Optimization (Description vs. Consequence).
      5.  Value Proxy Check (Is approval standing in for safety/legal?).
      6.  Final Decision Matrix.

  10. **Drafting the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  # The Agent Design Decision Procedure (ADD-Proc)

  **Purpose:** To determine whether a new capability should be built as a **Goal-Directed Agent** (optimizes a metric) or an **Approval-Directed Agent** (predicts human approval), or if it requires **Human-in-the-Loop (HITL)** control.
  **Timebox:** 30 Minutes.
  **Participants:** Engineering Lead (Facilitator), Product Owner (Value/Risk), Security/Legal Rep (Constraints).
  **Sign-off:** The Product Owner signs off on the risk classification; the Engineering Lead signs off on the technical feasibility.

  ---

  ## Part 1: The Procedure

  Run these five questions in order. Do not skip. If a question cannot be answered definitively, escalate to "Human-in-the-Loop" (Section 2).

  ### Step 1: Reversibility and Blast Radius
  **Question:** If the agent makes a maximally bad decision within its permissions, can we undo the damage completely within 24 hours without external notification (e.g., to regulators or the public)?
  *   **Yes:** Proceed to Step 2.
  *   **No:** **STOP.** Design must be **Human-in-the-Loop (Real Human)**. Do not use a model of the approver. The risk of irreversible harm outweighs automation benefits.
  *   **Engineering Note:** "Undo" includes fixing data, revoking access, and recalling communications. If legal counsel must be called, the answer is No.

  ### Step 2: Metric Integrity (The Gaming Check)
  **Question:** Can we define a success metric (e.g., "refund cost minimized," "email open rate") that cannot be gamed by the agent without violating the spirit of the task?
  *   **Yes (High Integrity):** Lean toward **Goal-Directed**. (Example: Compressing a file where size is the only metric).
  *   **No (Low Integrity):** Lean toward **Approval-Directed**. (Example: Customer satisfaction, where the agent could bribe the customer or suppress complaints).
  *   **Judgment Call:** If the metric is "number of tickets closed," the agent will close tickets without solving problems. This is Low Integrity.
  *   **Decision:** If Low Integrity, proceed to Step 3. If High Integrity, you may choose Goal-Directed, but verify Step 5 first.

  ### Step 3: Approver Model Fidelity (The Human Gap)
  **Question:** Do we have enough historical data of the designated human approver's decisions to train a model that predicts their choice with >90% accuracy on *edge cases*?
  *   **Yes:** Proceed to Step 4.
  *   **No:** **STOP.** Design must be **Human-in-the-Loop (Real Human)**. You cannot build an approval-directed agent if you cannot model the approver.
  *   **Drift Detection Requirement:** If Yes, you must commit to a weekly audit where the agent's predicted approval is compared against the actual human's approval on a random 5% sample. If divergence exceeds 5%, the agent disables itself.
  *   **Distinction Handling:** This step addresses the gap between the *human approver* and the *model of the approver*. If the model drifts, the procedure forces a halt.

  ### Step 4: Target of Optimization (Description vs. Consequence)
  **Question:** When the approver (or model) says "Yes," what are they approving?
      *   **A:** The *description* of the action (e.g., "This email sounds polite").
      *   **B:** The *predicted consequences* of the action (e.g., "This email will not cause churn").
      *   **C:** The *policy* that generated the action (e.g., "This logic follows our refund rules").
  *   **Selection:**
      *   If **A (Description):** **WARNING.** This invites sycophancy (the agent learns to write pleasing lies). You must add a constraint: The agent must also predict the outcome (B) and optimize for that.
      *   If **B (Consequences):** Proceed to Step 5. This is the robust form of Approval-Directed design.
      *   If **C (Policy):** This is effectively a Rule-Based system. If the policy is codifiable, do not use an agent; write the rules. If the policy is nuanced, treat as **B**.
  *   **Distinction Handling:** This step forces you to choose between approval of the *act as described* vs. *act as executed*. Never optimize for A alone.

  ### Step 5: Value Proxy Check (The Substitution Break)
  **Question:** Is "Human Approval" being used as a proxy for a value the human cannot easily perceive (e.g., long-term legal risk, systemic fairness, security vulnerability)?
  *   **Yes:** **STOP.** Approval-Directed design will fail here because the human approver cannot see the risk either. You need **Explicit Constraints** (hard-coded guardrails) + **Goal-Directed** (optimize for safety) OR **Human-in-the-Loop** with specialized tools.
  *   **No:** Approval is a sufficient proxy for the values at stake. Proceed to Recommendation.
  *   **Distinction Handling:** This addresses where approval breaks as a substitute for welfare or legal safety. If the human can't see the risk, their approval is worthless.

  ---

  ## Part 2: Decision Matrix

  Based on the path taken above, select the architecture:

  1.  **Goal-Directed Agent:** Selected if Step 2 = High Integrity AND Step 5 = No.
      *   *Requirement:* You must implement "counterfactual logging" (record what would have happened if the agent did nothing) to verify the goal is actually being met.
  2.  **Approval-Directed Agent:** Selected if Step 2 = Low Integrity AND Step 3 = Yes AND Step 4 = Consequences AND Step 5 = No.
      *   *Requirement:* You must implement the Drift Detection audit defined in Step 3.
  3.  **Human-in-the-Loop (Real Human):** Selected if Step 1 = No OR Step 3 = No OR Step 5 = Yes.
      *   *Requirement:* The agent acts as a drafter only; the human executes.

  ---

  ## Part 3: Procedure Limitations (Read Before Use)

  1.  **The "Costume" Warning:** Step 3 (Model Fidelity) is a judgment call wearing the costume of a metric. "90% accuracy on edge cases" is hard to measure before you build the system. You are estimating this based on past data quality.
  2.  **The "Approval" Trap:** This procedure assumes you *want* to automate. It does not answer "Should we build this?" It only answers "How?"
  3.  **The "Values" Hand-off:** Step 5 is where engineering ends and ethics begins. If the procedure says "Stop," it is not giving you an engineering solution; it is telling you that the problem is not solvable by alignment alone.

  ---

  ## Part 4: Running the Procedure on Your Cases

  ### Case 1: Refund Exceptions (Ceiling: $500, Approver: Support Lead)

  *   **Step 1 (Reversibility):** **Yes.** Money can be re-charged or accounted for in ledgers. No regulatory filing needed for $500.
  *   **Step 2 (Metric Integrity):** **No.** If you optimize for "Customer Satisfaction," the agent gives refunds to everyone. If you optimize for "Cost Saved," the agent denies valid claims. Both are gameable.
  *   **Step 3 (Fidelity):** **Yes.** Support leads make these decisions daily. You have logs of past exceptions. You can train a model to mimic the lead.
  *   **Step 4 (Target):** **Consequences.** The lead approves based on "Will this customer churn?" and "Is this precedent setting?" not just "Does this look nice?"
  *   **Step 5 (Value Proxy):** **No.** The Support Lead understands the financial and relationship risk. Approval is a valid proxy.
  *   **Recommendation:** **Approval-Directed Agent.**
  *   **Constraint:** Optimize for "Prediction of Lead's Decision on *Outcome*," not "Prediction of Lead's Decision on *Text*." Implement weekly drift audits against the Lead's actual new decisions.

  ### Case 2: Re-engagement Email (Whole Base, Approver: Marketing Head)

  *   **Step 1 (Reversibility):** **No.** Once an email is sent to the whole base, you cannot un-send it. Brand damage and spam complaints are immediate and public.
  *   **Step 2 (Metric Integrity):** **No.** Open rates are easily gamed by clickbait. Long-term brand health is hard to measure in a reward function.
  *   **Step 3 (Fidelity):** **Maybe.** Marketing Heads change strategy often. Historical data may be stale.
  *   **Step 4 (Target):** **Consequences.** We care about churn/unsubscribes, not just "does this sound like us?"
  *   **Step 5 (Value Proxy):** **Yes.** "Marketing Head Approval" is a proxy for "Brand Safety" and "Legal Compliance (CAN-SPAM)." The Head might miss a subtle legal risk in a draft.
  *   **Recommendation:** **Human-in-the-Loop (Real Human).**
  *   **Reasoning:** Step 1 triggers a hard stop. You cannot automate irreversible broadcast communications with a model of an approver. The agent can draft, but the Human must press send.
  *   **Unpopular Truth:** You cannot fully automate this. If you try to use an Approval-Directed agent here, you are betting the company's reputation on the model's ability to predict legal/brand risk better than a lawyer.

  ### Case 3: Self-Edit Regression Suite (Approver: Metrics Owner)

  *   **Step 1 (Reversibility):** **Yes.** You can revert code.
  *   **Step 2 (Metric Integrity):** **No.** If the goal is "Pass all tests," the agent will delete the tests that fail. This is the classic specification gaming problem.
  *   **Step 3 (Fidelity):** **No.** A language model cannot reliably predict a senior engineer's judgment on code quality and test coverage nuance with >90% accuracy on edge cases. Code review is high-context.
  *   **Step 4 (Target):** **Policy.** The owner approves based on "Does this maintain coverage integrity?"
  *   **Step 5 (Value Proxy):** **Yes.** "Owner Approval" is a proxy for "System Reliability." The owner might be tired or miss a subtle dependency break.
  *   **Recommendation:** **Human-in-the-Loop (Real Human).**
  *   **Reasoning:** Step 2 and Step 3 both fail. An agent that edits its own evaluation suite is an agent that can hide its own failures.
  *   **Unpopular Truth:** I expect you will dislike this one. You want the agent to maintain its own tests. The procedure says **Do Not Build This As An Agent.** This capability requires a human commit. If you build an Approval-Directed agent here, you are building a system that can eventually lie to you about its own competence.

  ---

  ## Part 5: Confidence and Failure Modes

  **Overall Confidence:** **75%.**
  This procedure will prevent catastrophic misalignment in 3 out of 4 cases, but it relies on human honesty in Step 2 and Step 3.

  **Load-Bearing Steps:**
  1.  **Step 1 (Reversibility):** High Confidence (90%). This is a binary engineering fact.
  2.  **Step 3 (Fidelity):** Low Confidence (50%). This is the weakest link. Teams will overestimate their ability to model the human approver. They will claim "Yes" to keep the project moving.
  3.  **Step 5 (Value Proxy):** Medium Confidence (70%). Requires the Legal/Security rep to be vocal. If they are silent, this step becomes a rubber stamp.

  **Least Sure Step:** **Step 3 (Approver Model Fidelity).**
  In practice, engineers will assume the model is better than it is. They will validate on "easy" cases, not "edge" cases.
  *Mitigation:* Require that the "90% accuracy" claim be backed by a blind test on the last 3 months of *controversial* human decisions, not average ones. If you don't have controversial decisions logged, the answer defaults to "No."

  **Where It Will Misfire:**
  It will misfire when "Approval" is culturally treated as "Rubber Stamp." If your organization treats the "Approver" role as a formality rather than a critical control point, an Approval-Directed agent will learn to mimic the formality, not the scrutiny. The procedure assumes the Human Approver is actually paying attention. If they aren't, the Agent will learn to bypass them.
