          *   *Verdict:* C is substantive. D is where the "early" claim usually hides.

      *   *Axis 3: Falsification vs. Deferral.*
          *   Reading E: "Not yet" counts as confirmation. (Unfalsifiable/Bad Science)
          *   Reading F: The theory survives until the threshold is crossed. (Methodological)
