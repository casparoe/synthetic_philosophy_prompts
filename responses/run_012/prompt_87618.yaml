      *   *Side B (Singularists/Incomparabilists):* Ranking is a category error, a second injury, morally failing. Often associated with Holocaust uniqueness debates.
      *   *Common Ground:* Both accept facts, both agree suffering is bad, neither are moral relativists.
      *   *The Friction:* They talk past each other. The scientist user suspects a measurement specification error.

  3.  **Brainstorming Section (Drafting thoughts):**
      *   *Side A (Comparativist) pressed:* "If we can't compare, how do we know the Holocaust wasn't just a traffic accident scaled up? How do we allocate resources to Rwanda vs. Bosnia?" Counterexample to them: A rigid hierarchy that minimizes lesser (but still horrific) sufferings, or a utilitarian calculation that justifies ignoring unique cultural destruction.
      *   *Side B (Singularist) pressed:* "Is the murder of 1 million *really* not worse than the murder of 10? Is gas chambers *really* not distinct from shooting?" Counterexample to them: If they refuse *all* comparison, they cannot argue for intervention in future genocides because they can't distinguish genocide from civil war. They rely on implicit comparison while denying explicit ranking.
      *   *Uncertainty:* Am I charitably representing Side B? Sometimes they deny *ranking* but accept *comparison* for explanation. Need to distinguish "ranking" (ordinal/ratio) from "comparing" (identifying similarities/differences).

  4.  **Diagnosing the Dispute:**
      *   *Is it verbal?* Partly. "Comparison" is doing too much work. Side A means "structural mapping for causal inference." Side B hears "hierarchical ranking for moral valuation."
      *   *Is it substantive?* Yes, regarding the structure of value. Is value monistic (one scale, e.g., lives lost) or pluralistic (lives, culture, intent, method)? If pluralistic, incomparability is a formal feature, not a refusal.
