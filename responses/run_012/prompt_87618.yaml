      *   *Bedrock Intuitions:* Side A: Rationality requires ordering. Side B: Sacredness resists quantification. These are hard to argue for because they are pre-conditions of the argument.
      *   *Hidden Empirical/Formal Question:* Can historical events be tokenized into variables without losing the "event-ness"? Side B says no (holism). Side A says yes (reductionism necessary for science).
      *   *Confusion:* Side A often assumes a *total* order is needed for *any* comparison. Side B often assumes *any* comparison implies a *total* ranking. Both are measurement errors.

  5.  **Defining Progress:**
