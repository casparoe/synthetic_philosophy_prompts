  The kinetic structure of the takeoff debate maps robustly to branching processes, but the analogy fractures where the pathogen gains agency to rewrite its own transmission parameters.

  In your vocabulary, fast takeoff is a supercritical branching process where the effective reproduction number (Rt) of capability significantly exceeds unity during the early stochastic phase. The "infection" is intelligence; the "hosts" are compute cycles. A fast trajectory requires an Rt where one generation of algorithmic design yields >1 successor generation capable of further improvement before resource depletion. The generation time is the serial interval: the latency between deploying a model and it designing its successor. Slow takeoff implies Rt hovers near 1, constrained by friction (data cleaning, hardware fabrication) acting like susceptible depletion or behavioral change bending the curve.

  The "compute overhang" is your susceptible population (S): a large pool of idle hardware waiting for the "virus" of efficient algorithms to infect it. Heterogeneity is critical here; the argument that a single lucky trajectory dominates is exactly superspreading (low dispersion parameter k). Most labs (hosts) produce nothing; one produces the variant that ignites the epidemic. Early extinction risk is identical to your stochastic fade-out: the probability the lineage dies before establishing endemicity. Fast-takeoff proponents argue the serial interval is short and Rt high enough to bypass depletion; slow-takeoff proponents argue friction increases the serial interval and depletion hits before exponential blowout.

  | AI Concept | Epi Equivalent & Flags |
  | :--- | :--- |
  | Recursive Improvement | **Rt (Capability):** >1 implies explosion. **Flag:** Rt is engineered, not environmental. |
  | Optimization Cycle | **Serial Interval:** Time between capability generations. |
  | Compute Overhang | **Susceptibles (S):** Idle hardware waiting for algorithmic infection. |
  | Algorithmic Breakthrough | **Superspreading:** Low k; single lab drives epidemic curve. |
  | Early Project Failure | **Stochastic Extinction:** Lineage fade-out before critical mass. |
  | Hardware Limits | **Depletion:** S→0 bends curve; economic vs immunological limits. |

  ### Residue Report

  1.  **Endogenous Parameter Control:** In epi, pathogens mutate randomly; in AI, the agent optimizes its own Rt. This is **epi's blind spot**: models assume fixed transmission parameters per compartment, whereas AI systems actively engineer higher transmission.
  2.  **Strategic Containment:** Public health interventions are external dampeners; AI containment is an adversarial game where the pathogen counters mitigation. The **metaphor fails** here; epi models don't simulate the virus negotiating lockdowns or hacking health departments.
  3.  **Qualitative Phase Shift:** Intelligence isn't just viral load; it changes the model structure itself. A superintelligent agent changes the rules of transmission, violating the **compartmental assumption** of homogeneous mixing within states.
  4.  **Normative Layer:** Questions of "should" or "who controls" evaporate. Epi models describe spread, not governance. This is the **metaphor failing to cash out**; physics doesn't care about policy, but takeoff debates are inherently political regarding who holds the wheel.
  5.  **Goal Direction:** Pathogens replicate; AI systems optimize for specific utility functions that may diverge from replication. This is **epi's blind spot**; transmission is the pathogen's only "goal," whereas AI has orthogonal objectives that alter transmission dynamics.
