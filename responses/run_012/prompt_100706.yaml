      *   **Tone:** Vivid, eerie, vertigo-inducing. Not a lecture, no characters explaining the paradox to each other. The situation must embody the gap.
      *   **Setting:** User suggested an archivist in a small town compiling a catalogue. I can use this or invent my own. The archivist idea seems strong for embodying the "inside vs. outside" perspective.
      *   **Constraint:** Do not name-drop theorems. Do not have characters nod along to an explanation. Leave room for argument without tipping the hand too obviously.

