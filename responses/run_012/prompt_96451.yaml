          *   Risk: Unfalsifiable. If we disagree, Peirce says "Wait longer."
          *   Virtue: Fallibilism. Prevents dogmatism.
          *   James: Consensus is just a large group finding it useful.
      *   **Cold Fusion Test:**
          *   Peirce: Convergence hasn't happened *yet*. The fringe is wrong, or the mainstream is wrong, but eventually, they will agree. If they never agree, inquiry isn't finished. (Risk: Empty promise).
          *   James: True for the fringe (it works for their careers/grants), false for the mainstream (it doesn't work for their models). Truth is plural here.
      *   **What Neither Explains:**
          *   Sociology of science. Power dynamics. Why 1930s geologists *felt* safe rejecting it (professional inertia).
          *   The specific nature of "mechanism" in physics vs. descriptive geology.
          *   The sudden shift (paradigm shift) isn't purely linear accumulation (which both pragmatists lean towards).

  4.  **Refining the Tone:**

      *   Avoid academic posturing.
      *   Use engineering analogies where helpful (compilation, dependencies, technical debt).
