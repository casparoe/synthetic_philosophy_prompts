  2.  **Analyze the Core Concepts (Mental Sandbox):**

      *   *Peirce:* Truth = Final Opinion of the community of inquirers after indefinite investigation. Reality = Independent of what you or I think, but not independent of what *anyone* would think under ideal conditions. Meaning = Practical bearings (conceptual pragmatism).
      *   *James:* Truth = What happens to an idea when it proves useful/good to believe. "Cash value." Truth is made in the process of verification. More individualistic/psychological than Peirce.
      *   *Continental Drift Case:*
          *   1912-1930: Evidence exists (fit, fossils), Mechanism missing. Rejected.
          *   1960s: New evidence (seafloor spreading, magnetism), Mechanism found (convection). Accepted.
          *   Key tension: Did the truth *change*, or did our *access* to it change?
      *   *Cold Fusion Case:*
          *   Claim made, failed replication, mainstream rejected, fringe persists.
          *   Tests Peirce's "fated convergence." Tests James's "good for *us* to believe" (who is us?).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Define the two pragmatists simply. Acknowledge the engineer persona (focus on function/utility).
      *   **The Three Questions (1930 Context):**
          *   *(a) Was it true?*
              *   Peirce: Yes. Reality is independent. The final opinion *would* be yes, even if we aren't there yet.
              *   James: Tricky. Truth "happens." In 1930, it wasn't "true" yet because it hadn't been verified/worked. It became true later.
          *   *(b) Was it reasonable to believe?*
              *   Peirce: No. Inquiry hadn't settled. The method of science requires testing mechanisms.
              *   James: Depends on "good for us." If believing it hindered research or had no payoff, maybe no. But James allows "will to believe" in certain cases. Likely no, given the lack of mechanism.
          *   *(c) Could they have known?*
              *   Peirce: No. Knowledge requires the process of inquiry to support it.
              *   James: No. Verification hadn't happened.
          *   *Analysis:* Peirce separates truth (ontological/fated) from knowledge (epistemic/current). James collapses truth into the verification process.
      *   **Strain Point 1: The Mechanism Objection:**
          *   Geologists rejected it because physics said "no."
          *   Peirce: Fits well. Practical bearings include causal mechanisms. If the mechanism is impossible, the concept lacks coherent practical bearings *at that time*.
          *   James: Harder. If it *was* true (in a realist sense), why wasn't it "good to believe"? James risks making truth too dependent on current utility. He needs to argue that "good to believe" includes coherence with *established* physics.
      *   **Strain Point 2: Cash-Value Running Backwards:**
          *   Drift had low utility in 1930, high in 1960.
          *   James: Looks like truth changed. Is this a bug? It implies truth is retrospective. It risks looking like "Truth = Whatever wins."
