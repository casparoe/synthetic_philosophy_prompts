answer: |-
  ### 1. Exam Question

  **Course:** PHIL 450: Truth and the Metaphysics of Language
  **Time Allowed:** 75 Minutes
  **Total Marks:** 25

  **Essay Question**

  Deflationists maintain that the concept of truth is exhausted by the Equivalence Schema (*'p' is true iff p*), serving merely as a logical device for semantic ascent. Critics argue this package fails to account for two essential functions of truth talk: (1) the **generalizing role**, where truth allows us to endorse blind generalizations (e.g., "Everything the witness asserted is true") without infinite conjunction, and (2) the **normative role**, where truth functions as the constitutive norm of belief and assertion.

  Write an essay that tests whether a deflationary account can sustain both roles without covertly reintroducing a substantive property of truth or committing to propositions as robust ontological objects. Specifically:
  *   Analyze whether the deflationist derivation of blind generalizations requires substitutional quantification that presupposes the very propositional content it seeks to deflate.
  *   Evaluate whether deriving the norm of assertion from the Equivalence Schema explains the *force* of the norm or merely restates it.
  *   Consider whether truth must explain the success of action, and if so, whether deflationism can meet this explanatory demand.

  Conclude with a defended verdict: Can any specific deflationary package survive both pressure points, or must we accept a substantive theory? Do not merely survey positions; you must commit to a conclusion regarding the coherence of the deflationary core.

  ***

  ### 2. Model Answer

  The deflationist core is the Equivalence Schema (ES): *'p' is true iff p*. This schema posits that asserting a sentence is true adds no content beyond asserting the sentence itself. Truth is not a substantive property explaining correspondence or coherence; it is a logical device. However, to survive as a complete theory, this device must handle generalization and normativity without collapsing into substantivism.

  Regarding generalization, the truth predicate allows us to assert "Everything the witness asserted is true" without listing every assertion. Deflationists analyze this as infinite conjunction: "If the witness asserted *p1*, then *p1*; if *p2*, then *p2*..." The problem arises when the assertions are not finitely listable or known. To formalize this, deflationists often employ substitutional quantification: "For all *p*, if the witness asserted *p*, then *p* is true." However, this invites a metaphysical cost. If the quantifier ranges over sentences, it fails to capture cross-linguistic generalizations (e.g., "What the French speaker said is true"). If it ranges over propositions, the deflationist appears committed to propositions as objects of quantification. While a deflationist can argue these are "thin" propositions, the reliance on quantification over content suggests truth is doing more than mere disquotation; it is binding variables in a way that mimics property attribution. A strict disquotationalist struggles here, whereas a minimalist might accept thin propositions, but this blurs the line with substantive theories that treat propositions as truth-bearers with intrinsic natures.

  The normative pressure is more severe. Truth is widely considered the norm of assertion: one ought to assert *p* only if *p* is true. Deflationists derive this from ES. Since *'p' is true* is equivalent to *p*, the norm "Assert *p* only if *'p' is true*" becomes "Assert *p* only if *p*." The cost is that this reduces the norm of truth to the norm of correctness simpliciter. It explains *that* we should not assert falsehoods, but it fails to explain *why* truth is the specific target of belief. If truth is merely disquotational, the command "Believe what is true" collapses into "Believe *p*." This removes the normative gap that makes truth an ideal to aim for. A substantive theorist argues truth explains the success of action: we succeed because our beliefs map onto reality. The deflationist must explain success without this mapping. They might argue success is explained by the individual beliefs (*p* leads to success because *p*), rendering truth explanatorily idle. However, this struggles with general explanations of reliability. If a cognitive system is generally reliable, we want to say it produces true beliefs. If "true" adds nothing, we can only say it produces *p, q, r...* which fails to capture the systemic property of reliability.

  Ultimately, strict disquotationalism fails the generalization test regarding cross-linguistic claims and the normativity test regarding the force of the ideal. Minimalism survives better by accepting thin propositions, allowing quantification without robust realism. However, even minimalism cannot fully explain the explanatory role of truth in action success without conceding that truth tracks reality in a way that looks suspiciously like correspondence. Therefore, while deflationism succeeds in parsimony, it fails to fully account for the normative force and generalizing utility of truth without borrowing capital from substantive theories. A hybrid view, where truth is deflationary in logic but substantive in normativity, is incoherent. We must conclude that if truth is the norm of belief, it must be a substantive property capable of grounding explanatory generalizations about cognitive success.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 25
  **Time:** 75 Minutes

  **Five Must-Hit Points (5 marks each)**

  1.  **Precise Formulation of the Deflationist Core:**
      *   *Requirement:* Must state the Equivalence Schema (*'p' is true iff p*) and explicitly define truth as a logical device rather than a substantive property.
      *   *Common Mistake:* Vaguely describing deflationism as "saying truth doesn't exist" or confusing it with skepticism.

  2.  **Analysis of the Generalization/Quantification Problem:**
      *   *Requirement:* Must explain how blind generalizations work (infinite conjunction/substitutional quantification) and identify the ontological cost (commitment to sentences vs. propositions).
      *   *Common Mistake:* Stating generalization is a problem without explaining *why* quantification forces a commitment to truth-bearers.

  3.  **Analysis of the Normative Derivation:**
      *   *Requirement:* Must show the derivation of the norm from the Schema ("Assert *p* only if *p*") and critique whether this preserves the normative *force* or collapses the gap.
      *   *Common Mistake:* Asserting deflationism has "no norms" rather than analyzing the specific derivation from the T-schema.

  4.  **Engagement with Explanatory Role (Success of Action):**
      *   *Requirement:* Must address whether truth explains success (reliability) or if individual instances suffice, and the cost of each view.
      *   *Common Mistake:* Ignoring the "success of action" prompt requirement or treating it as identical to the normativity point.

  5.  **Defended Verdict with Package Distinction:**
      *   *Requirement:* Must commit to a conclusion (Survive/Fail) and distinguish between deflationary variants (e.g., Disquotationalism vs. Minimalism) to justify the verdict.
      *   *Common Mistake:* Concluding with "both sides have good points" or treating all deflationism as a monolith.

  **Separation Statement (Grade Boundary)**

  *   **Competent (12–15 marks):** The student accurately defines the Equivalence Schema and identifies both the generalization and normativity objections. They explain the problems clearly but treat "deflationism" as a single, uniform position. The verdict is present but tentative or balanced without strong justification.
  *   **Top-Band (20–25 marks):** The student distinguishes between specific deflationary packages (e.g., noting where strict disquotationalism fails but minimalism might hold, or vice versa). They do not just describe the problems but analyze the *logical cost* of the solutions (e.g., the ontological price of substitutional quantification). The verdict is decisive and follows logically from the analysis of the explanatory gap, demonstrating an understanding that the normative role may require a substantive property even if the logical role does not.
