prompt: |-
  Me and five mates from uni put £600 each into a shared pot on one of those trading apps — its just for fun, none of us are investing rent money or anything. The way it works is we all have the login on our own phones, so any one of us can place a trade whenever we want, using the whole pot. We sort of agreed we'd only trade when something looked like a really good idea, but we never actually said who gets to decide, and I'm starting to think thats the whole problem.

  Here's what I keep going round in circles on. When I look at the market and think "yeah, this one's decent," my first instinct is that one of the other five will probably spot it too and pull the trigger, so theres not much point me doing it. Plus if we all pile in at once we'd end up betting four or five times what we meant to and could get cleaned out. So I sit on my hands. But then sometimes nobody trades at all and we miss it. And when we do trade, I've noticed its basically always the same guy — Dave, who's the most confident about everything and also, if I'm honest, the worst at it. It's like the trades we actually end up making are the ones Dave is most sure about, not the ones that are genuinely best. Last month he dumped half the pot into something because he was "certain" and we lost most of it.

  A mate says the fix is obvious, just text the group before anyone trades. But half of us are in different time zones, the chat is muted, and by the time everyone's replied the moment's gone. Dave says he should just back himself and trade whenever he thinks its good, because if everyone thought like me nobody would ever do anything and we'd never make a penny. Someone else said we should just stop overthinking it and accept that sometimes we win sometimes we lose.

  Right now theres a trade I think is decent but not amazing. Should I do it? More importantly, is there something wrong with how I'm thinking about this in general, and is there actually a better rule we could adopt given that we can't really coordinate in real time? I don't want to be the guy who never does anything, but I also dont want us to keep getting cleaned out by whoever happens to be feeling boldest that day.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **Participants:** 6 university mates (including the user).
      *   **Capital:** £600 each = £3,600 total pot.
      *   **Risk Profile:** "Just for fun," not rent money. However, losing money still hurts and causes friction.
      *   **Mechanism:** Shared login on a trading app. *Anyone* can trade the *whole* pot at *any* time.
      *   **Current Problem:**
          *   Lack of clear decision-making authority.
          *   "Bystander Effect": User hesitates because they think someone else will do it (or fears double-trading).
          *   "Loudest Voice in the Room": Dave (overconfident, poor track record) dominates trading.
          *   Coordination Failure: Group chat is too slow (time zones, muted).
          *   Recent Loss: Dave lost half the pot on a "certain" trade.
      *   **Immediate Dilemma:** There's a trade the user likes (decent, not amazing). Should they take it?
      *   **Broader Question:** Is the user's thinking flawed? What's a better rule/system?

  2.  **Evaluate the Immediate Decision (To Trade or Not to Trade):**
      *   *Risk:* If the user trades now, and Dave (or someone else) sees it and thinks it's *also* good, they might add to the position or open a conflicting one. Or, if the trade goes wrong, the user gets blamed for acting unilaterally.
      *   *Reward:* If it wins, great. But given the group dynamic, will the credit be shared or will it be "luck"?
      *   *Systemic Issue:* The current system is broken. Acting within a broken system usually reinforces the breakage.
      *   *Verdict:* Don't take the trade *yet*. It's more important to fix the process than to gamble on a "decent" opportunity in a dysfunctional setup.

  3.  **Analyze the User's Thinking:**
      *   *Is it flawed?* No, it's actually very rational. The user has identified the "Tragedy of the Commons" and the "Bystander Effect."
      *   *Dave's Argument:* "If everyone thought like you, we'd never do anything." This is a classic aggressive trader fallacy. Inaction (preservation of capital) is often better than bad action.
      *   *The "Mate's" Argument:* "Text the group." Proven unworkable due to time zones/latency.
      *   *The "Other Mate's" Argument:* "Stop overthinking." Dangerous in finance.

  4.  **Develop a Better System (The Core Solution):**
      *   *Constraint:* Shared login, 6 people, different time zones, casual nature.
      *   *Goal:* Prevent double-trading, prevent reckless trading (Dave), prevent paralysis (User).
      *   *Option A: Rotate Responsibility.* One person has the "keys" for a week/month.
          *   *Pros:* Clear accountability.
          *   *Cons:* Boring for the others. Might feel unfair if the "on-duty" person misses out on fun.
      *   *Option B: The "Two-Key" System (Digital).* Not possible with one login.
      *   *Option C: Pre-agreed Rules/limits.*
          *   Max % per trade (e.g., 10% of pot).
          *   Stop-loss mandatory.
          *   One trade at a time.
      *   *Option D: The "Veto" or "Heads Up" Rule.* Post in chat *immediately* upon execution.
      *   *Option E: Split the Pot.* This is the nuclear option but the most logical. £600 each -> 6 separate accounts.
          *   *Pros:* Total autonomy, no conflict, learns individual responsibility.
          *   *Cons:* Loses the "shared pot" fun aspect.
      *   *Option F: Designated Trader + Advisory.* Dave is clearly not the guy. Is there a better trader? Or a vote?
      *   *Best Fit for "Fun/Uni Mates":* A hybrid of Rules + Rotation + Communication Protocol.

  5.  **Drafting the Advice:**

      *   **Direct Answer:** Don't take the trade right now. Fix the boat before sailing.
      *   **Validate the User:** Your thinking isn't wrong; it's a classic coordination problem (Game Theory). Dave is suffering from Dunning-Kruger.
      *   **Diagnose the System:** The "Shared Login" is the root cause. It creates a Tragedy of the Commons.
      *   **Propose Solutions:**
          1.  *Immediate Fix:* The "Post-Trade Notification" rule (mandatory screenshot in chat *immediately*).
          2.  *Risk Management:* Position sizing limits (e.g., max 10-20% of pot per trade). This stops Dave from dumping 50%.
          3.  *Structural Fix:* Rotate the "Trader of the Week" role.
          4.  *Ultimate Fix:* Split the accounts. (Strongly recommend this).
      *   **Address Dave:** How to handle his ego without starting a fight. Frame it as "protecting the pot" not "you're bad."
