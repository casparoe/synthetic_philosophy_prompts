      *   *What if the user takes the trade and wins?* Short term gain, long term pain (reinforces bad system).
      *   *What if the user takes the trade and loses?* Blame game ensues.
      *   *Conclusion:* The advice must emphasize *process over outcome*.

  8.  **Final Polish:** Organize into clear sections: The Immediate Decision, The Diagnosis, The Solutions. (This matches the structure of the final output). Ensure the distinction between "fun money" and "disrespecting the money" is clear. Losing 50% of the pot isn't "fun," it's stressful.

