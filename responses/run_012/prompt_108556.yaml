answer: |-
  This is a strong framing for *this* audience. It shifts the Utility Monster from a "gotcha" against utilitarianism to a technical specification problem about aggregation functions. That will resonate with rationalists who think in terms of optimization and alignment.

  However, you are correct to worry about distortion. Nozick's original point in *Anarchy, State, and Utopia* was deontological: he wanted to show that utilitarianism fails to respect the **separateness of persons**. He didn't care about diminishing marginal utility (DMU); he cared that rights act as side-constraints. By framing the monster as "non-diminishing utility," you are moving the debate from *rights vs. consequences* to *parameter tuning within consequentialism*.

  **Verdict:** Keep your framing. It is more useful for a rationalist book club than Nozick's original intent. But you must explicitly flag the distortion in the first 5 minutes so you remain intellectually honest. Tell them: *"Nozick used this to attack rights. We are going to use it to audit our aggregation functions."*

  Here is the 50-minute teaching plan.

  ---

  ### 1. The Dependency Stack (Whiteboard: Left Column)
  **Time: 0:00–0:10**

  Do not start with the monster. Start with the prerequisites. If any of these fail, the monster dissolves. Draw this as a literal stack or dependency tree on the board.

  1.  **Consequentialism:** We judge actions by outcomes.
  2.  **Cardinal Utility:** Outcomes can be assigned numbers (not just ranked).
  3.  **Interpersonal Comparability:** My "5 utils" can be weighed against your "5 utils." (Crucial: If this fails, the monster is just a guy who likes stuff, not a moral hazard).
  4.  **Aggregation:** We sum the utils (Total Utilitarianism).
  5.  **Conversion Function:** Resources $\to$ Utility.
  6.  **The DMU Assumption:** The slope of #5 decreases as resources increase.

  **The Move:** Tell the group: *"The Utility Monster is not a creature. It is the name we give to the system state that emerges if you accept 1 through 5, but you delete 6."*

  **Why this order:** If you skip Interpersonal Comparability, the audience will argue "maybe he just *says* he's happier." If you skip Aggregation, they'll argue "why do we have to give him everything?" You need to lock those in as the "rules of the game" before introducing the exploit.

  ### 2. The Carrying Example (Whiteboard: Center Graph)
  **Time: 0:10–0:25**

  Do not use the Monster as the example. Use **Painkillers** (or "Experience Machine Credits").

  **Why Painkillers:**
  *   **Intuitive DMU:** Everyone understands the first pill ends agony (huge utility), the second ensures comfort (medium utility), the third does nothing (zero utility), the fourth kills you (negative utility).
  *   **Stakes:** It's not trivial like pizza. It involves suffering, which fits the moral weight.
  *   **AI Bridge:** It translates easily to "neural modulation" for the AI guy later without starting there.

  **The Exercise:**
  1.  Draw an X/Y graph. X = Pills, Y = Utility.
  2.  Draw the **Normal Curve**: Steep up at first, then flatlines.
  3.  Ask the room: *"If we have 100 pills and 10 people in pain, how do we distribute?"* They will say "10 each" or "enough to stop pain, save the rest." This confirms they are implicitly using DMU.
  4.  **The Switch:** Now draw the **Monster Curve**. It is linear or exponential. The 100th pill gives *more* relief/pleasure than the 1st.
  5.  **The Question:** *"Given our rules (Maximize Total Utility), who gets the pills?"*
  6.  **The Result:** Mathematically, everyone else must starve/suffer so the Monster can take all 100.

  **What this example must NOT have:**
  *   **Do not** make the Monster "evil." If the Monster is selfish, the audience will conflate the problem with greed. The Monster can be a saint donating the utility to charity; the math stays the same.
  *   **Do not** make it about "need." The Monster doesn't *need* it more; they *convert* it better.

  ### 3. Misconception Management (The "Interrupt" Points)
  **Time: 0:25–0:40**

  You predicted four misconceptions. Here is exactly when they will arise and how to kill them.

  **1. "The Monster is just a selfish person."**
  *   **When:** Immediately after you reveal the Monster Curve.
  *   **Fix:** Pre-empt this. Say: *"Imagine the Monster is a hospital. Giving the pills to the Monster saves 1,000 lives. Giving them to you saves 1. The math is identical. This is not about greed; it's about capacity."*

  **2. "Diminishing Returns is a law of nature."**
  *   **When:** When you draw the linear Monster Curve. People will say "That's physically impossible."
  *   **Fix:** This is the core of your framing. Stop and say: *"In physics, maybe. In information processing? In neuroscience? DMU is an empirical claim, not a logical truth. If we build an AI, do we code in DMU? If we don't, have we built a Monster?"*
  *   **Note:** This is where you feed the AI guy a bone without letting him eat the meal.

  **3. "It's a sci-fi hypothetical so it doesn't matter."**
  *   **When:** Towards the end of the example.
  *   **Fix:** Connect it to **Priority**. *"We already act like DMU is true. We tax the rich to give to the poor. Why? Because we assume $1,000 helps the poor more than it hurts the rich. That is a Utility Monster argument in reverse. If the Rich Guy was actually a Utility Monster (linear utility), redistribution would be immoral."* This makes it a live political/economic problem.

  **4. "This proves Utilitarianism is wrong."**
  *   **When:** The conclusion.
  *   **Fix:** Clarify the scope. *"It proves Total Utilitarianism + No DMU is counterintuitive. It doesn't kill utilitarianism. It forces you to choose: Do you cap utility? Do you use Prioritarianism (weight the worse off)? Or do you accept the Monster?"*

  ### 4. Scope Boundaries (What to Refuse)
  **Time: Call this out at 0:05**

  You need to explicitly state what you are **not** doing. Write this on the bottom right of the whiteboard under "Out of Scope."

  1.  **Nozick's Rights Theory:** *"We are not discussing whether the Monster has a right to the pills. We are discussing whether the Aggregator should give them."*
  2.  **Population Ethics:** *"We are not talking about creating more Monsters. We are talking about resource allocation among existing agents."* (Avoids the Repugnant Conclusion rabbit hole).
  3.  **AI Alignment Solutions:** *"We are identifying the structural risk, not solving alignment today."* (This manages the AI guy).

  **Script for the AI Guy:**
  He *will* speak. When he does, say: *"That is exactly the DMU question. If a superintelligence has no diminishing returns on compute, does it become a Utility Monster by definition? Let's park that as the 'Advanced Case' and make sure we solve the 'Basic Case' first."* This validates him without derailing the lesson.

  ### 5. The Closing Check (Structure vs. Punchline)
  **Time: 0:45–0:50**

  Do not ask "Does this make sense?" They will lie. Test the structural dependencies you built in Step 1.

  **The Quiz:**
  Present a variant on the board.
  *"Case B: The Monster has Diminishing Utility, but their baseline is 100x higher than yours. (Their first pill is worth 100 of your pills). Do we still feed them everything?"*

  **What to look for:**
  *   **If they say "Yes":** They understood Aggregation + Comparability, but missed that DMU was the specific lever you were pulling.
  *   **If they say "No, because eventually they diminish":** They understood the DMU lever.
  *   **If they say "No, because it's unfair":** They reverted to deontology (Nozick's actual point). Acknowledge this is a valid separate objection.

  **The Takeaway Line:**
  *"The Utility Monster isn't a bug in the universe. It's a bug in our aggregation function. If you want to be a utilitarian, you have to decide if you're hard-coding Diminishing Marginal Utility into your morality, or if you're willing to feed the Monster."*

  ---

  ### Summary of Whiteboard Layout

  | **Left: The Stack** | **Center: The Graph** | **Right: Boundaries** |
  | :--- | :--- | :--- |
  | 1. Consequentialism | [Y-Axis: Utility] | **OUT OF SCOPE** |
  | 2. Cardinal Utility | [X-Axis: Resources] | 1. Rights/Entitlements |
  | 3. Interpersonal Comp. | **Curve A (Normal):** | 2. Population Ethics |
  | 4. Aggregation (Sum) | Concave (Diminishing) | 3. AI Solutions |
  | 5. Conversion Func. | **Curve B (Monster):** | |
  | 6. **DMU Assumption** | Linear/Exponential | **AI Note:** |
  | | | "Is Superintelligence |
  | **MONSTER = Delete 6** | [Shaded Area: Total Utility] | Curve B?]" |

  ### Why this works for your audience
  *   **Rationalists** love breaking systems. Framing the Monster as an "exploit" on the Aggregation Function appeals to that mindset.
  *   **Yudkowsky readers** are primed to worry about AI optimization gone wrong. The "Neural Stimulation" example bridges the gap between moral philosophy and alignment risk without requiring you to become an AI researcher for the hour.
  *   **Parfit readers** will appreciate the precision on Interpersonal Comparability, even if you aren't doing full Population Ethics.
  *   **No Formal Training:** The graph and the painkiller example keep it grounded. No jargon beyond what you define on the board.

  You have a solid plan. Your framing is a distortion of Nozick, but it is the *correct* distortion for this room. Just own it.
