      *   *Refining the "Proxy" point:* The prompt mentions the regulatory challenge. This is the modern instantiation of the RCP. I need to make sure the "Residue Report" addresses the *normative* aspect (protected characteristics) not just the *statistical* aspect.

  8.  **Final Polish:** Check against the specific questions in the prompt.
