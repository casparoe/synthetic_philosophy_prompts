  8.  **Addressing the "Merely Verbal" Moment:**
      *   This usually happens when students realise "information" is a fuzzy word.
      *   Strategy: Shift from "Is it information?" to "Does calling it information hide the causal work done by the cell?"
      *   Location: After establishing the machinery's role but before the final conclusion.

  9.  **What to Leave Out:**
      *   Epigenetics (too complex, distracts from the code metaphor).
