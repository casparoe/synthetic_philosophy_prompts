      *   "If we found a cell where the same DNA sequence produced proteins using a completely different mapping rule without changing the DNA, would the 'information' in the DNA have changed?"
      *   Better: "If you had to explain to a judge why a software bug was caused by the code versus the compiler, how does the DNA/Cell relationship map onto that, and who is liable?" -> A bit too abstract.
