answer: |-
  # Teaching Plan: DNA, Code, and Information (90 Minutes)

  ## 1. The Sequence of Components and Dependencies

  You must deliver the concepts in the following order. Deviating from this sequence will allow students to retreat into their existing mental models before you have dismantled the foundations.

  1.  **Establish the Intuition (15 mins):** Elicit and solidify their existing belief that DNA is a program/code.
      *   *Dependency:* You cannot dismantle a model until the students have explicitly committed to it. If you start by critiquing, they will defend a straw man.
  2.  **Define 'Information' (15 mins):** Distinguish between *causal difference-making* (Shannon/physical) and *semantic content* (meaningful message).
      *   *Dependency:* You cannot argue about whether DNA carries information until you agree on what 'information' means in this context. Without this, the debate is verbal only.
  3.  **The Core Example (25 mins):** Present the case of context-dependent expression (see Section 2).
      *   *Dependency:* You cannot discuss the locus of information (Step 4) without a concrete case where the physical sequence remains constant but the outcome varies.
  4.  **The Machinery and Arbitrariness (20 mins):** Explain that the mapping between sequence and product is enforced by cellular machinery, not chemical necessity.
      *   *Dependency:* You cannot establish arbitrariness without the example showing variable outcomes, and you cannot discuss the machinery without first defining information semantically.
  5.  **The Parity Argument (10 mins):** Argue that DNA is one causal factor among many (cytoplasm, environment, machinery).
      *   *Dependency:* You cannot argue for parity until you have shown that DNA does not uniquely determine the outcome (via the Core Example).
  6.  **The 'Merely Verbal' Pivot (5 mins):** Address the objection that the distinction is semantic nitpicking.
      *   *Dependency:* This must come last. If raised earlier, it shuts down inquiry. It can only be resolved once the causal consequences of the distinction are clear.

  ## 2. The Single Example

  Your hunch is correct, but it requires precise framing. The example must be **Alternative Splicing** (specifically, a gene like *DSCAM* in fruit flies or *Troponin* in humans).

  **Why this example:**
  It resonates with engineers. It functions like a conditional compilation or a library link rather than a linear script. It demonstrates that the DNA sequence is necessary but not sufficient for the specific output.

  **What the example must HAVE:**
  *   **Invariant Input:** The DNA sequence must remain identical in both contexts.
  *   **Variant Output:** The resulting protein structure must differ significantly in function or shape.
  *   **Contextual Switch:** The difference must be driven by the cellular environment (e.g., tissue type, developmental stage) acting via the spliceosome machinery.

  **What the example must LACK:**
  *   **Mutation:** There must be no change to the DNA itself. If the DNA changes, students will revert to "DNA determines everything."
  *   **External Sender:** Do not imply the cell is 'deciding' consciously. Avoid teleology.
  *   **Complex Biochemistry:** Do not dwell on splice sites or introns/exons mechanics beyond the logic of 'selection'.

  **Why not RNA Editing?**
  RNA editing (where the base is chemically altered post-transcription) is philosophically sharper but biologically obscure for this audience. It risks looking like 'data corruption' rather than 'interpretation'. Splicing looks like 'logic flow', which engages their professional intuition better.

  ## 3. Why the Codon Table and Central Dogma Must Not Carry the Session

  **The Codon Table:**
  *   **Diagnosis:** It presents the genetic code as a static dictionary inherent to the triplet itself. It hides the *agents* (aminoacyl-tRNA synthetases) that enforce the mapping.
  *   **Failure:** It reinforces the misconception that the meaning is *in* the DNA. It suggests a chemical necessity (UUU *must* equal Phenylalanine) rather than a contingent convention enforced by machinery.

  **The Central Dogma Arrow (DNA → RNA → Protein):**
  *   **Diagnosis:** It depicts a unidirectional flow of command, resembling a pipeline.
  *   **Failure:** It obscures the feedback loops and the causal role of the cellular context. It implies the DNA is the 'sender' and the protein is the 'receiver', whereas in reality, the cell is the interpreter of the DNA. It privileges the DNA as the sole source of agency.

  ## 4. Misconceptions and Intervention Points

  | Misconception | When it will arise | Where to head it off |
  | :--- | :--- | :--- |
  | **"DNA causes everything."** | During the opening discussion. | **Step 3 (Core Example).** Use the splicing case to show identical DNA yields different outcomes. Causation is distributed. |
  | **"The code is chemical law."** | When discussing the mapping. | **Step 4 (Machinery).** Explicitly state that the mapping is maintained by enzymes that could, in principle, be different. It is historical, not physical necessity. |
  | **"Information implies a Designer."** | During Step 2 (Define Information). | **Step 2.** Decouple 'semantic information' from 'intent'. A thermostat carries information about temperature without a sender intending a message. |
  | **"It's just semantics."** | Near the end (Step 6). | **Step 6 (Verbal Pivot).** Show that calling it 'code' locates the bug in the DNA, whereas calling it 'causal substrate' locates the bug in the system. This has practical diagnostic consequences. |
  | **"DNA is the 'Program', Cell is the 'Hardware'."** | Throughout. | **Step 5 (Parity).** Argue that the cytoplasm is equally 'programmatic'. The distinction between software and hardware collapses in biology. |

  ## 5. The 'Merely Verbal' Moment

  **When it falls:**
  This will occur immediately after you argue that DNA lacks semantic content (Step 5/6 transition). Students will argue: "If it walks like a code and quacks like a code, why does it matter if we call it information?"

  **How to convert it:**
  Do not argue semantics. Argue **locus of control**.
  Ask: "In your work, if a program fails, do you debug the source file or the compiler?"
  Explain: "If DNA is 'code', we look for errors in the sequence (mutation). If DNA is 'substrate', we look for errors in the cellular machinery (expression context). Calling it 'information' biases where we look for causes. The question is not what we call it, but where we assign causal privilege."

  ## 6. What to Leave Out

  You must explicitly state to the class that you are omitting the following, to prevent them from raising these as counter-arguments during the session:

  1.  **Epigenetics:** "We are not discussing methylation or histone modification today. Those are further layers of context, but they complicate the core logical point about the DNA sequence itself."
  2.  **Evolution of the Code:** "We are not asking how the code arose, only how it functions structurally in the present cell."
  3.  **Shannon Mathematics:** "We are not calculating bits. We are discussing the philosophical category of information."
  4.  **Exceptions to the Code:** "We are ignoring mitochondrial variations or stop-codon read-through. These are exceptions that prove the rule of machinery dependence."

  ## 7. The Final Question

  Do not ask for a summary. Ask for an application of the distinction.

  **"If you could upload a human DNA sequence into a simulation, but lacked the model of the cellular machinery required to interpret it, would you possess the 'information' to build a human? Why or why not?"**

  *   **Recognition:** They say "No" because they remember you said DNA isn't enough.
  *   **Understanding:** They say "No, because the 'instructions' are not in the sequence alone; they exist in the relationship between the sequence and the interpreter. Without the machinery, the sequence is just data without syntax."

  ## 8. Confidence Statement

  I am highly confident in this plan's structure to dismantle the "DNA as Program" metaphor for a technical audience. The dependency chain ensures they cannot revert to easy causal claims without contradicting their own engineering intuition regarding compilers and interpreters.

  The single claim in this plan about which I am least confident is that **Alternative Splicing is the optimal example**. While it fits the 'context' argument perfectly, a hardened software engineer might argue that conditional compilation is still 'code' (e.g., `#ifdef` directives). If they dig in here, the analogy may reinforce rather than challenge the code metaphor. However, given the constraints and audience, it remains the most robust available option.
