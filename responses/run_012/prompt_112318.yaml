      *   **Constraint 11:** British English.
      *   **Constraint 12:** Finish with confidence level and the single least confident claim.

  2.  **Deconstruct the Conceptual Goals:**
      *   *Difference-making vs. Content-bearing:* DNA makes a difference (causal), but does it carry semantic content (like a message)?
      *   *Arbitrariness:* The code isn't in the DNA; it's in the mapping relation established by the cell machinery.
      *   *Causation vs. Information:* DNA causes things, but calling it "information" might imply a sender/receiver framework that isn't biologically necessary.
      *   *Parity:* DNA is special, but is it privileged over other developmental factors (cytoplasm, environment, etc.)?
