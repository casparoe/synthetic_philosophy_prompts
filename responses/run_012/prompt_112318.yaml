  5.  **Diagnose Why Codon Table/Central Dogma Fail:**
      *   *Codon Table:* Looks like a static dictionary. Implies the meaning is *in* the triplet. Hides the machinery (tRNA, synthetases) that enforces the mapping. Reinforces "DNA contains the code" rather than "Cell interprets the DNA".
      *   *Central Dogma Arrow:* DNA -> RNA -> Protein. Implies flow of *stuff* or *command*. Hides the feedback loops, the context, and the parity of other factors. It looks like a pipeline, not a negotiation.

  6.  **Map Misconceptions to Sequence:**
      *   *Misconception 1:* "DNA causes everything." -> Head off at Parity phase.
      *   *Misconception 2:* "Code implies a coder." -> Head off at Information definition phase.
      *   *Misconception 3:* "The mapping is physical/chemical necessity." -> Head off at Arbitrariness phase.
      *   *Misconception 4:* "It's just semantics." -> Head off at the Verbal Dispute phase.

  7.  **Drafting the Plan (Iterative refinement for dependencies):**
      *   *Step 1: Establish the Intuition.* Get them to commit to "DNA is code".
      *   *Step 2: Dissect the Metaphor.* What makes code, code? (Sender, Receiver, Convention).
