      *   *Claim 5 (Ancestor to Neural):* Fair analogy in terms of output, but the mechanism is vastly different (symbolic/sub-symbolic hybrid vs. pure connectionist). Acceptable simplification.
      *   *Claim 6 (Hand-coded knowledge/Scaling):* True. FARG models are notoriously brittle and knowledge-heavy.
      *   *Claim 7 (Categories are feature-based):* **MAJOR RED FLAG.** This contradicts the core FARG thesis (Copycat, Tabletop, Letter Spirit) which argues for fluid concepts, role-based mapping, and context-dependence.
