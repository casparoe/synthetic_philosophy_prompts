prompt: |-
  ok so my philosophy club got into a huge argument about whether you can know stuff if you dont know you're not dreaming, and it made me realize my gut says different things about different cases and I cant figure out the rule. I dont want a reading list or names to look up, I just want to know if theres one principle behind my verdicts or if some of them have to go. Also please just write it as normal paragraphs, no headings or bullet points or bold or tables, like you'd write an email.

  Heres what I actually think. Theres a laptop in front of me right now and I'd say I know its there. What I wouldnt say is that I know I'm not a brain in a jar being fed fake laptop experiences. I get that if I know theres a laptop then it follows that I'm not a jar brain, but I still dont feel like I know the second thing, so apparently knowing doesnt always carry over to stuff that follows from it. Except someone pointed out that I know my bus gets me to school at 7:40, and I'd happily say I know it doesnt get me there at 7:45, so sometimes it does carry over and I cant tell whats different about those two.

  Some more of my cases. My friend Priya says the history essay is due Friday, and she always checks the board before she tells me anything, and I'd say I know its due Friday. But theres a raffle at the school fair with 500 tickets and I have one, and I believe mine wont win, but I wouldnt say I know that. I also think I know the sun will come up tomorrow, even though if it werent going to I'd probly still believe it would. And theres this kid Marcus who announces before every game that we're gonna win no matter what, and last week we won and now he says he knew it, but I dont think he knew, because he'd have said the exact same thing either way.

  Heres the one thats really messing me up. A guy in my class copied the answers off the teachers answer key and got a perfect score. If the answers had been different he'd have written different answers, so he was right and his belief would've changed if it was wrong, which sounds like the good kind of belief. But I still dont think he knew the answers. He got them right without getting them, if that makes sense.

  So the rule I keep coming back to is something like, you know something if you wouldnt believe it if it werent true. But that makes the copying kid come out as knowing and the sun come out as not knowing, and both of those feel wrong to me. Is there a version of the rule that fixes that, or a totally different one that gets more of my cases? Tell me what it says about a case I havent listed, and be honest about which of my verdicts it forces me to give up, because I'd rather drop one gut feeling than pretend they all fit together.
