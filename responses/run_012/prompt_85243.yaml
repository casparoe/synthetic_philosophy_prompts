prompt: |-
  Ok so I'm in this after school philosophy thing and next month it's my turn to run the session, and I picked the liar paradox because our teacher mentioned offhand that there are people who think some contradictions are actually true, which kinda broke my brain. I want to hand out a decision tree instead of just talking at people, so everyone can follow their own answers and land on a position with a name at the end.

  Start it from something nobody needs jargon for, like "the sentence 'this sentence is false' is a normal English sentence that I understand", and then every node is one question about it, phrased so you can answer it without already knowing where it leads. I want the tree to reach: (a) the view that the sentence has no truth value at all, (b) the view that it's both true and false, (c) the view that the sentence is fine and something about our reasoning has to give, and split that one by what gives — do we drop the rule that gets you from "P or Q" plus "not P" to Q, or the rule that lets you use an assumption twice, or the idea that if A proves B then A implies B, (d) the view that the sentence is meaningless, or that "true" quietly changes meaning partway through the argument, or that "true" isn't a real property of sentences at all, (e) the view that English just can't contain its own truth talk so the sentence never actually gets formed, and (f) whatever combination nobody has bothered to defend.

  Stuff I want used as test cases so the branches have something to bite on: "this sentence is false", "this sentence is not true" (I heard this one is nastier for the both-true-and-false people, don't know why), "this sentence is true", the one that says if this sentence is true then 2+2=5, and the preface-paradox thing where a whole book of well supported claims adds up to something inconsistent. Also one case where a database or a physics theory is contradictory and we still want to reason with it — that should come out somewhere different from the both-true-and-false branch if it really is different.

  Where the tree can't seperate two positions everyone lumps together, say so instead of pretending it can. And for combinations of answers that nobody holds, say whether that's because the view is incoherent, or ugly, or just nobody's tried it.

  Also can you tell me how confident you actually are in the tree you give me — like if you had to bet on one branch being wrong, which one, and where are you just guessing about what the real positions are? I'd rather know where it's shaky than get something that sounds confident.
