answer: |-
  Here is the reverse-engineering of your professor's framework, the verdict on your final case, and the test to prove it.

  ### 1. The Reconstructed Rule: "Threshold Prioritarianism with Growth-Adjusted Discounting"

  Your professor is running a **Two-Tier System**. She is not using a single continuous formula (like a standard discount rate) for all cases. Instead, she distinguishes between **Survival/Catastrophe** and **Consumption/Welfare**.

  *   **Tier 1 (The Catastrophe Threshold):** If a project prevents an irreversible, existential, or civilizational collapse (Cases 1 & 4), standard cost-benefit analysis (CBA) is suspended or heavily modified. The "cost" to the present is secondary to the "floor" of existence for the future. Time discounting is effectively set to zero for survival.
  *   **Tier 2 (Ordinary Welfare):** If a project involves standard economic gains or losses (Cases 2 & 3), standard CBA applies *with a specific ethical adjustment*: **Declining Marginal Utility.** We discount future consumption not just because it is far away (pure time preference), but because future people are expected to be richer. A dollar to a richer future generation is worth less utility than a dollar to the poorer present generation.

  ### 2. The Verdict on the Final Case: **REJECT**

  **Prediction:** She will reject the project.

  **Reasoning:**
  This case explicitly falls into **Tier 2**. You specified it is an "ordinary economic benefit" and "nothing about averting a catastrophe." Therefore, the "Catastrophe Exception" (Tier 1) does not trigger. We revert to Tier 2 logic.

  In Tier 2, the decisive variable is the wealth differential. You noted the future generation will be "quite a bit richer than we are." In intergenerational ethics (specifically the Ramsey Rule framework often taught in these seminars), transferring resources from a poorer present to a richer future is ethically inefficient. Because of declining marginal utility, the "large benefit" to them is worth less in *utility terms* than the "fair bit cost" is to us. Unless the rate of return on the project is astronomically high (higher than the social discount rate adjusted for growth), the transfer reduces total welfare. She has already signaled in Case 2 that ordinary gains are approved only when the cost/benefit ratio is favorable *and* the time horizon is short (10 years). Stretching that to 250 years with a "richer future" clause is the classic setup for a **Reject** verdict based on the argument that we should not impoverish the present to enrich the already-wealthy future.

  ### 3. Why This Rule (and Not the Others)?

  You asked me to pick one and defend it. I am confident she is running **Threshold Prioritarianism** rather than **Pure Discounted Utilitarianism** (Ramsey Rule) or **Zero Pure Time Preference** (Stern Review style).

  **The Evidence:**
  Look at Case 4: *"A cheap thing now that shaves the odds of a distant, irreversible catastrophe... approve, and she says the normal cost-benefit framing almost doesn't apply here."*

  *   **Why Pure Ramsey is out:** A pure Ramsey economist would *always* apply cost-benefit framing. They would calculate the expected value of the catastrophe reduction, discount it back 300 years, and compare it to the cost. By explicitly stating that "normal framing doesn't apply," she has admitted that her model has a **lexical priority** for catastrophe avoidance that overrides standard discounting.
  *   **Why Zero Pure Time Preference is out:** If she believed time was morally neutral (Stern), Case 3 (Large cost/Small payoff in 10 years) might still be rejected, but the distinction between Case 1 (Catastrophe) and the Target Case (Ordinary Gain) would be less sharp. The Stern approach often implies heavy investment for the future regardless of their wealth, provided the return is positive. Her rejection of Case 3 and the specific "richer future" clue in the Target Case suggests she *does* care about the distribution of wealth (marginal utility), not just the sum total.

  **The Synthesis:**
  She is combining the **Philosophical Floor** (we must ensure the future exists) with the **Economic Efficiency** (we shouldn't waste resources making the rich richer). This fits all four verdicts perfectly:
  *   Cases 1 & 4 hit the Floor $\rightarrow$ Approve.
  *   Case 2 is Efficient (short term, positive return) $\rightarrow$ Approve.
  *   Case 3 is Inefficient (negative return) $\rightarrow$ Reject.

  ### 4. The Flag: The "Richer Future" Discount

  You suspected that *"we only get to discount because future people will be richer, full stop"* is doing work here. You are half-right.

  **That rule is ruled out as a *universal* principle, but it is the *dominant* principle for Tier 2.**

  If that rule were the *only* rule (Pure Growth-Adjusted Discounting), she could not have said "normal cost-benefit framing almost doesn't apply" in Case 4. In a pure growth-adjusted model, a catastrophe 300 years out is still just a number to be discounted by the growth rate. If the future is rich enough, even preventing a catastrophe might fail the cost-benefit test (because their marginal utility of survival is "low" relative to our cost).

  By approving Case 4, she admits that **Survival trumps Wealth.** However, in the Target Case (Ordinary Gain), Wealth trumps Time. So, the "Richer Future" rule is the engine for ordinary cases, but it is disabled for existential cases.

  ### 5. The Discriminating Fifth Case

  To force a split between **Threshold Prioritarianism** (my pick) and **Strict Utilitarianism with Growth Discounting** (the main competitor), present her with this case:

  **The "Gilded Ruin" Case:**
  > "A project costs us a **fair bit** now. It prevents a **civilizational collapse** in 250 years. However, due to technological advances, even *after* the collapse, the future generation will still be **twice as rich as we are today**. The collapse is irreversible and involves massive loss of culture and stability, but not extinction."

  **The Split:**
  *   **If she Approves:** She is running **Threshold Prioritarianism**. The label "civilizational collapse" triggers the Catastrophe Exception (Tier 1), rendering their relative wealth irrelevant. Survival/Stability is lexically prior to utility maximization.
  *   **If she Rejects:** She is running **Strict Utilitarianism**. Even though it's a "collapse," she is weighing the utility loss against our cost. Since they are still richer than us, their marginal utility loss is discounted heavily. If the cost to us is high enough, the math says "let them collapse."

  **Why this works:** It isolates the "Catastrophe" variable from the "Wealth" variable. The Target Case tests Wealth vs. Time. The "Gilded Ruin" tests Wealth vs. Catastrophe. If her "Catastrophe Exception" is real, Wealth shouldn't matter in the Gilded Ruin. If her "Growth Discount" is the only real driver, Wealth should override the Catastrophe label.

  **Summary for your exam:**
  Call **Reject** on the Target Case. Argue that because it is an **ordinary consumption good** (Tier 2) and the future is **richer** (declining marginal utility), the transfer is inefficient. Cite Case 4 to show you understand that this logic *only* applies because it isn't a catastrophe. That demonstrates you've cracked the Two-Tier code.
