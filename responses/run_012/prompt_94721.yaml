prompt: |-
  In biology we get told 'DNA is a code' constantly — it's on the slides, my teacher says it every lesson, and then last week in debate club someone said that since DNA is a code, editing a gene is basically debugging, and that you could in principle read a whole person off their genome like a file. I sort of get it and sort of think it's just a metaphor, but I can't tell which parts are actually doing work. Could you lay out all the different precise things 'DNA is a code' could be claiming — from the boring/trivial reading up to the really strong ones — and for each say whether it's true, false, or genuinely open, and which of them would actually support the 'editing = debugging' and 'read a person off the genome' stuff? Also, is there a difference between saying the code is arbitrary (like a cipher someone just picked) and saying the information in DNA is real? Please lay it out as a list I can take to my teacher, and don't just tell me it's a metaphor — I know that, I want to know which metaphor, and what each version commits you to. British English please, and no alot of hedging.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The claim "DNA is a code."
      *   **Context:** Biology class vs. Debate Club (specific claims: editing = debugging, reading a person off the genome = reading a file).
      *   **Task:** Break down the precise meanings of "DNA is a code" into a list of claims (from trivial to strong).
      *   **Evaluation:** For each claim, state if it's True, False, or Open.
      *   **Implication:** Identify which claims support the debate club arguments ("editing = debugging", "read a person off the genome").
      *   **Specific Question:** Address the difference between "arbitrary code" (cipher) and "real information."
      *   **Tone/Style:** British English, no excessive hedging, clear list format, suitable for taking to a teacher.
      *   **Constraint:** Don't just dismiss it as a metaphor; explain *which* metaphor and what it commits one to.

  2.  **Deconstruct "DNA is a Code":**
