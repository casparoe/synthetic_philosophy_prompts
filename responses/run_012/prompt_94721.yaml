      *   *Level 1: Sequence.* It's a linear string of symbols. (True)
      *   *Level 2: Translation.* It maps to something else (amino acids). (True)
      *   *Level 3: Instruction/Program.* It tells the cell what to do actively. (Mostly True, but context-dependent)
      *   *Level 4: Blueprint/Plan.* It contains the full specification of the organism. (False/Overstated)
      *   *Level 5: Arbitrary Symbol System.* The relationship between codon and amino acid is contingent, not physical law. (True)
      *   *Level 6: Determinism.* The code fully determines the outcome (phenotype). (False)

  3.  **Address the Debate Club Claims:**
      *   *Editing = Debugging:* Implies errors are bugs, function is purely logical, context doesn't matter much.
      *   *Read a person off the genome:* Implies genetic determinism, that the genome contains *all* the information needed to reconstruct the person.

  4.  **Address "Arbitrary vs. Real Information":**
      *   *Arbitrary:* The genetic code (codon table) could have been different (historical accident).
      *   *Real Information:* It reduces uncertainty, has semantic content in a biological context (Shannon vs. Semantic information).

  5.  **Drafting the Content (Iterative refinement for British English and tone):**
      *   *Tone:* Direct, analytical, academic but accessible. Avoid "kind of," "sort of," "maybe." Use "True," "False," "Unsupported."
      *   *Structure:* Numbered list of claims.
