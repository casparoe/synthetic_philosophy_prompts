answer: |-
  You have described a phenomenon that sits at the intersection of game theory, behavioral economics, and social psychology. While there is no single, colloquial noun (like "gravity") that captures every nuance you outlined, there is a precise technical vocabulary for it.

  The pattern you are describing is best defined as a **War of Attrition with Endogenous Valuation**, driven by **Escalation of Commitment** and **Effort Justification**.

  Here is the breakdown of why your intuition distinguishes this from the "Dollar Auction" or simple "Escalation," and where the established terminology actually fits your description.

  ### 1. The Game Theory Structure: War of Attrition
  You correctly identified that this is not quite a **Dollar Auction**. In a Dollar Auction, the prize is fixed (a dollar bill), and the trap is that the *second-highest* bidder must pay their bid without winning.

  Your scenario is structurally a **War of Attrition**. In this game, two competitors contend for a prize by accumulating costs over time. The winner is the one who persists longer; the loser is the one who quits first. Crucially, in a standard War of Attrition, **both parties pay the costs they incur**, regardless of who wins. This matches your legal battle: both you and your brother pay your legal fees, win or lose.

  **Where your description adds nuance (Endogenous Valuation):**
  In a standard War of Attrition, the prize has a fixed value (e.g., the house is worth \$500k). You noted that in your case, *"the thing on the table becomes more valuable the more we both spend on it."*
  In economics, this is called **Endogenous Valuation**. The value of the prize is not external (market price of the house); it is internal to the game (the value of *winning* relative to the cost incurred).

  ### 2. The Psychological Mechanism: Escalation of Commitment
  You hesitated to use **"Escalation of Commitment"** because you feel neither of you made an initial decision to defend, and stopping wouldn't admit an *error*. However, in behavioral science, the definition is broader than your intuition suggests.

  *   **The Decision:** You are correct that you did not choose the inheritance. However, you *did* choose the *strategy* of litigation over concession. Every time you authorized a lawyer to file a motion, that was a discrete decision. Escalation of Commitment does not require the *situation* to be chosen, only the *course of action*.
  *   **The Forfeit:** You state *"nothing is forfeited by stopping."* Economically, this is false. Psychologically, this is the core of the trap. If you stop, the money already spent is confirmed as **waste**. If you continue and win, that same money can be reframed as an **investment**. The "forfeit" is the psychological pain of converting sunk costs from "investment" to "waste."
  *   **The Driver:** The driver is not recouping money (you know the house isn't worth it); the driver is **Loss Aversion**. The pain of "wasting" \$100k is greater than the pain of spending another \$10k to avoid that waste.

  ### 3. The "Value Rise": Effort Justification and Signaling
  This is the specific feature you found hardest to fit: *"his spending appears to raise its value to me as much as my own does."*

  This is explained by two combined concepts:

  1.  **Effort Justification (Cognitive Dissonance):** This is a psychological phenomenon where individuals attribute greater value to an outcome they put significant effort into attaining. If you spend \$50,000 on a principle, your brain rationalizes that the principle *must* be worth \$50,000, otherwise you are a fool.
  2.  **Costly Signaling:** Your brother's spending is a signal of his resolve. In a War of Attrition, you cannot know when the other person will quit. His spending signals, "I am willing to burn \$50k to not lose." To beat that signal, you must signal, "I am willing to burn \$51k." His spending raises the "price" of your victory, which retroactively raises the value of the victory required to justify that price.

  ### 4. Answers to Your Boundary Questions

  **Does it survive the substitution of a thing with a fixed market value?**
  **Yes, but the dynamic changes.** If the house had a fixed, liquid market value (e.g., you could sell it tomorrow for \$1M), the rational cap on spending is \$1M. The "Endogenous Valuation" you describe relies on the prize being **symbolic** (face, principle, not being the sucker). If the prize is purely financial, the pattern collapses once costs exceed market value. If the prize is symbolic, the value can rise indefinitely.

  **Does it require two parties or can it occur with one?**
  **It can occur with one,** but it is less stable. A single person can fall into Escalation of Commitment (e.g., continuing to repair a worthless car). However, the **reciprocal signaling** ("his spending raises its value to me") requires an opponent. Without an opponent, there is no "War," only a "Sunk Cost Fallacy." The interactive element transforms it into a **Conflict Spiral**.

  **What distinguishes it from a contest in which each side is merely waiting for the other to tire?**
  In a simple waiting game (like a strike), costs are often static or low (lost wages). In your pattern, **costs are active and increasing** (legal fees), and the **motivation shifts**. In a waiting game, I wait because I think you will break. In your pattern, I spend because *you spent*. The spending itself becomes the fuel. This distinguishes it as **Active Escalation** rather than **Passive Attrition**.

  **Does the fact that neither forfeits anything by stopping mean it is just stubbornness?**
  **No.** "Stubbornness" implies an irrational personality trait. This pattern is **rationally irrational**. Given the psychological stakes (social status, self-image as a non-sucker), continuing is the "rational" choice to minimize psychological loss, even if it maximizes financial loss. It is a **local optimum** (saving face) that creates a **global catastrophe** (bankruptcy). It is a systemic trap, not merely a character flaw.

  ### Summary Definition

  If you need a label for this pattern, the most precise existing term is **Escalation of Commitment in a War of Attrition.**

  However, to capture the specific nuance you identified (where the opponent's cost increases your valuation), you might define it as:

  > **Reciprocal Endogenous Escalation:** A conflict dynamic where the value of victory is not fixed but is determined by the cumulative cost incurred by both parties. The costs are not viewed as losses to be minimized, but as investments that validate the principle at stake. The opponent's expenditure signals resolve, which raises the cost of yielding, thereby increasing the subjective value of continuing the conflict.

  **What falls outside this definition:**
  *   **Bluffing:** If one party is pretending to spend but isn't, it is a signaling game, not this pattern.
  *   **Fixed Prize:** If the goal is purely to acquire an asset with a fixed resale value, the escalation should theoretically cap at that value. If it exceeds that value, the prize has effectively become symbolic (Face), bringing it back *inside* your definition.
  *   **One-Sided Sunk Cost:** If you are fighting a building code violation alone, that is simple Escalation of Commitment. It lacks the **Reciprocal** element where the *other* party's spending drives your valuation.

  You are describing a situation where the **cost has become the commodity.** You are no longer fighting for the house; you are fighting to validate the money you have already spent. That is the heart of the trap.
