answer: |-
  Reject premise (2) by substituting its requirement for a single sensory feature with a determinable property like "felt goodness" or an attitudinal state, which allows heterogeneous experiences to count as instances of a unified kind without rendering hedonism empty.

  Premise (2) looked compelling because it assumes that for a term to pick out a natural kind or a value-making property, it must refer to a uniform qualitative "tingle" or sensation, akin to the way "yellow" picks out a specific wavelength range. This intuition relies on a sense-data model of mind that treats psychological categories as atomistic impressions rather than functional roles or determinable structures. However, as you noted, this criterion abolishes almost every useful psychological category: "pain" includes burns, grief, and phantom limb sensations which share no single sensory quality, yet we rightly treat pain as a unified kind for medical and ethical purposes. The error lies in conflating *heterogeneity of manifestation* with *heterogeneity of nature*; just as "color" is a valid kind despite the differences between red and blue, "pleasure" can be a valid kind despite the differences between a bath and a proof.

  To unify pleasures without satisfying (2)'s strict demand, you can adopt a determinable model or an attitudinal account. On the determinable view (defended by Fred Feldman), pleasures share a high-level phenomenological property—"felt goodness"—that manifests differently in different contexts, much like "shape" unifies circles and squares without being a specific shape itself. On the attitudinal view (defended by Chris Heathwood), pleasure is not a sensation but a pro-attitude toward a proposition or state of affairs (taking pleasure in X), which unifies the category functionally rather than phenomenologically. Both accounts block the move to (4) by showing that a kind can be real without being phenomenologically homogeneous, preserving hedonism's claim that there is a single currency of value.

  The price of this repair depends on which unifying story you choose. If you choose the determinable view, you invite the empirical objection that no such common "felt goodness" actually exists upon introspection, risking the charge that the unifying property is occult or idle. If you choose the attitudinal view, you face the fresh trouble hinted at in (5): if pleasure is just taking a pro-attitude toward things, hedonism risks collapsing into desire-satisfaction theory, since the distinction between "taking pleasure in X" and "desiring X" becomes perilously thin. Furthermore, by loosening the definition of pleasure to accommodate heterogeneity, you make the utilitarian calculus harder to operationalize, as comparing the intensity of a "proof-closing" pleasure against a "bath" pleasure becomes less straightforward than comparing two sensations.

  Ultimately, your intuition that the argument proves too much is correct because it relies on a naive realism about categories that fails outside this specific debate. Rejecting (2) saves hedonism, but it forces you to defend a more sophisticated metaphysics of mind where psychological kinds are unified by function or determinable structure rather than simple sensory identity. This costs you the intuitive simplicity of classical hedonism but spares you the absurdity of eliminating pain, belief, and desire alongside pleasure.
