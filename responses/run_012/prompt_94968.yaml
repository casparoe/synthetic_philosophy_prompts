answer: |-
  This is a profound puzzle, and your intuition that "nothing happened" is the correct starting point for a metaphysical investigation. In the philosophy of action and metaphysics, this is often treated as a tension between two ways of understanding the world: the **physical** (what actually occurs in space and time) and the **counterfactual** (what *would* have occurred if things were different).

  To answer your request directly: The obstacle you feel is not a confusion, but a clash between two legitimate concepts of "cause." One concept requires a transfer of energy or a physical event (the "push"). The other requires a dependency relationship (the "if-then"). Omissions fit the second but not the first.

  Here is an analysis of your three difficulties, treating each on its own terms, followed by a conclusion on what is a dispute about words and what is a dispute about the world.

  ### 1. Selection: The Indefinite Omissions

  You ask: *Why is "not checking the patient" the cause, rather than "not singing" or "not resigning"? Is this selection factual or based on expectation?*

  **The Analysis**
  If we look strictly at the physical history of the universe, there is no difference between the nurse's "not checking" and her "not singing." Both are descriptions of the same physical state: the nurse continuing her other activities while the patient lies unattended. Physically, there is an infinity of things she did not do at that moment.

  If causation were purely a matter of physical events colliding (like billiard balls), none of these non-acts could be causes. But we use causation to explain *why* a specific outcome occurred. To do this, we compare the actual world to a specific **alternative** world.

  *   **Actual World:** Nurse does not check; patient dies.
  *   **Alternative World A:** Nurse checks; patient lives.
  *   **Alternative World B:** Nurse sings; patient dies.

  The reason we select "not checking" as the cause is that Alternative World A is the only one where the outcome changes. However, this raises your second point: why do we even consider Alternative World A? Why not Alternative World C, where she flies in like Superman and saves the patient?

  **The Verdict**
  The selection is **not a fact about the physical situation alone; it is a fact about our expectations and norms.**

  For an omission to be selected as *the* cause, it must be an omission of an action that was **expected, normal, or required**. This makes the causal claim partly evaluative. When we say "The nurse's failure to check caused the death," we are implicitly saying: "Given the role of a nurse, the checking was the relevant alternative that did not obtain."

  **What follows for the claim that omissions cause things?**
  It means that omission causation is not "brute" physical causation. It is a hybrid relation. It combines:
  1.  **A factual dependency:** (If she had checked, the death would likely have been averted).
  2.  **A normative selection:** (She was supposed to check).

  This does not make the causal claim false, but it does mean it is not "objective" in the same way that "the bullet caused the wound" is objective. The bullet causes the wound regardless of what anyone thinks a bullet should do. The nurse's omission causes the death only relative to a system of expectations about what nurses do.

  ### 2. Agency and Expectation: The Mind-Dependence Problem

  You ask: *Can a machine omit? Does this require duty or expectation? Is omission causation impossible in a world with no expectations?*

  **The Analysis**
  Consider your home automation system. It fails to send an alert, and the food spoils. Did the system "omit" to send the alert?

  To answer this, we must distinguish between **physical absence** and **functional omission**.
  *   **Physical Absence:** No signal was sent. This is a brute fact. It exists in a world without minds.
  *   **Functional Omission:** The system *failed* to do what it is *for*. This requires a concept of function.

  A rock does not "omit" to save a drowning man, even if its presence would have saved him. A rock has no function. A thermostat, however, is an artifact designed with a purpose. Its "omission" is real, but its reality is derivative. It derives from the intentions of the designers and the expectations of the users.

  **The Verdict**
  Omission causation is **impossible in a world with no expectations at all.**

  In a universe containing only particles and forces, there are no omissions, only states of affairs. There is the presence of energy and the absence of energy. "Absence" becomes "Omission" only when there is a standard of comparison—a norm, a function, or a desire—that renders the absence significant.

  Therefore, when we say the automated filter "caused" the fraud loss by not stopping it, we are importing human norms into the description of the machine. The machine is a proxy for human agency.

  **Is this a problem?**
  It depends on what you want causation to do. If you want causation to describe the fundamental furniture of the universe (like gravity), then omissions are not causes. But if you want causation to explain how complex systems (biological, social, mechanical) succeed or fail, then omissions are indispensable causes. They are real features of *systems*, even if they are not real features of *physics*.

  ### 3. Description: The Redescription Problem

  You ask: *If one inaction is a failure to do X and a failure to do Y, and the verdict shifts when we redescribe it, is causation relative to description?*

  **The Analysis**
  Imagine a doctor who sits still. By sitting still, she fails to administer Drug A (which cures the disease) and fails to administer Drug B (which also cures the disease). The patient dies.
  *   Description 1: "The doctor caused the death by not giving Drug A."
  *   Description 2: "The doctor caused the death by not giving Drug B."

  Physically, the "cause" is identical: the doctor's body remaining in the chair. Yet, if Drug A was out of stock, Description 1 is false (giving it wasn't possible), while Description 2 might be true.

  This shows that causation by omission does not track the **physical motion** (or lack thereof); it tracks the **counterfactual dependency**.

  **The Verdict**
  This shows that **causal relations are sensitive to descriptions because the descriptions identify the specific dependency.**

  When we say "Not giving Drug A caused the death," we are not pointing at the doctor's stillness. We are pointing at the specific link between *that specific drug* and the *patient's health*. The stillness is merely the vehicle.

  If the verdict shifts when we redescribe the inaction, it is not because causation is "just words." It is because different descriptions pick out different **potential interventions**.
  *   "Not giving Drug A" implies: If Drug A had been given, life would continue.
  *   "Not giving Drug B" implies: If Drug B had been given, life would continue.

  If one of those conditionals is false (e.g., Drug A was ineffective), then that description does not identify a cause. So, the causal relation is not relative to our *whims*, but it is relative to the **specificity of the counterfactual scenario** we are testing. The "cause" is not the stillness; the cause is the absence of the specific preventative factor.

  ### Conclusion: Words vs. World

  You asked to distinguish which difficulties are genuine disagreements about how the world works and which are disputes about words, and what would settle the genuine ones.

  **1. The Dispute About Words (The Definition of "Cause")**
  Much of the unease comes from insisting that "cause" must mean "physical push." If we define cause strictly as energy transfer, then omissions are not causes. Full stop.
  *   *Settlement:* This is settled by stipulation. We can agree to use "physical causation" for pushes and "explanatory causation" for dependencies. If we do this, the puzzle dissolves: omissions are explanatory causes, not physical causes.

  **2. The Genuine Disagreement (The Role of Norms)**
  The deeper, genuine issue is whether our causal explanations of the world can legitimately include normative facts (expectations, duties, functions).
  *   *The Question:* Is it a fact about the *universe* that the nurse caused the death, or is it a fact about our *social practice* of blaming nurses?
  *   *My Position:* It is a fact about our social practice, but that does not make it less real. Human life is conducted within systems of norms. A "traffic jam" is not a physical object like a rock, but it is a real phenomenon that causes me to be late. Similarly, an "omission" is not a physical event, but it is a real phenomenon within a functional system that causes harm.
  *   *Settlement:* This is settled by acknowledging that **causation is context-dependent.** In a physics lab, omissions are not causes. In a hospital, a courtroom, or an engineering review, omissions are causes. To deny this in the latter contexts is to lose the ability to explain how those systems work.

  **Summary of the Three Difficulties:**
  1.  **Selection:** Solved by recognizing that norms select the relevant counterfactual from the infinite background of non-acts.
  2.  **Agency:** Solved by recognizing that omissions require a functional system (mind, design, or biology); they do not exist in a norm-free void.
  3.  **Description:** Solved by recognizing that causation tracks specific dependencies, not just physical kinematics.

  **Final Thought**
  Your puzzle arises because you are trying to locate a "negative fact" in the "positive world." The solution is to realize that when we speak of omission causation, we are not describing the positive world alone. We are describing the positive world *plus* a map of expectations laid over it. The "cause" is the gap between the map and the territory. That gap is not a physical thing, but it is a real source of explanation.
