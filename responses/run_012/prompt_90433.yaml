  # Seminar Handout: Diagnostic Decision Tree
  ## Topic: Time, Modality, and the Open Future
  ## Session 1: Mapping the Logical Space

  **Instructions:**
  This instrument is designed to locate your pre-theoretic commitments within the landscape of contemporary debate. It does not assume knowledge of the literature. Begin at the **Root** and follow the branches based on your intuitions about the two test cases below.

  **The Test Cases:**
  1.  **Case A (Human Contingency):** "There will be a sea battle tomorrow." (Assume human free will is compatible with the physics of the situation, and no prophecy or decree has been made).
  2.  **Case B (Quantum Indeterminacy):** "This specific atom will decay within the next 5 minutes." (Assume standard Copenhagen interpretation: the outcome is genuinely probabilistic and not determined by prior physical states).

  ---

  ### THE DECISION TREE

  **[ROOT]**
  **Start:** You accept that sentences like Case A and Case B are meaningful and capable of being assessed for truth or falsity *in principle*.
  │
  ▼
  **[NODE 1: The Metaphysical Status of Case B]**
  **Question:** Regarding the Quantum Decay (Case B): Is the outcome *ontologically settled* right now? (i.e., Is there a fact of the matter about how it will decay, even if physics prohibits us from knowing it?)
  │
  ├── **YES** (There is a hidden fact / Determinism is true) ──► Go to [NODE 2A]
  │
  └── **NO** (Reality is genuinely branching / open) ──► Go to [NODE 2B]
  │
  ▼
  **[NODE 2A: The Uniformity Question]**
  **Question:** Does the Sea Battle (Case A) share the same metaphysical status as the Quantum Decay (Case B)? (i.e., Is the sea battle also *ontologically settled* now?)
  │
  ├── **YES** (Both are settled) ──► Go to [NODE 3A]
  │
  └── **NO** (Quantum is settled, Sea Battle is not) ──► **[UNOCCUPIED NODE 1]** *(See Diagnosis Below)*
  │
  ▼
  **[NODE 2B: The Uniformity Question]**
  **Question:** Does the Sea Battle (Case A) share the same metaphysical status as the Quantum Decay (Case B)? (i.e., Is the sea battle also *ontologically open*?)
  │
  ├── **YES** (Both are open) ──► Go to [NODE 3B]
  │
  └── **NO** (Quantum is open, Sea Battle is settled) ──► **[UNOCCUPIED NODE 2]** *(See Diagnosis Below)*
  │
  ▼
  **[NODE 3A: Grounding the Settled Future]**
  **Question:** If the future is settled, what makes the statement "There will be a sea battle" True *now*?
  │
  ├── **A privileged "actual" branch among many possibilities** ──► **LEAF: The Thin Red Line**
  │
  └── **The future event itself (or primitive truth)** ──► **LEAF: Ockhamism** *(Note: Often indistinguishable from TRL in practice)*
  │
  ▼
  **[NODE 3B: The Truth-Value Question]**
  **Question:** Given the future is open (from Node 2B), does the statement "There will be a sea battle" have a classical truth value (True or False) *right now*?
  │
  ├── **YES** (Bivalence holds despite openness) ──► Go to [NODE 4]
  │
  └── **NO** (Bivalence fails / Truth-value gap) ──► Go to [NODE 5]
  │
  ▼
  **[NODE 4: The Grounding of Bivalence]**
  **Question:** If it is True/False now despite openness, is this truth value *knowable in principle* by an omniscient observer?
  │
  ├── **YES** (There is a fact to be known) ──► **LEAF: The Thin Red Line** *(Converges with 3A)*
  │
  └── **NO** (True/False but no fact to ground knowledge) ──► **LEAF: Ockhamism** *(Relativist / Contextualist variants)*
  │
  ▼
  **[NODE 5: The Status of the Gap]**
  **Question:** If it lacks a classical truth value, is the statement "There will be a sea battle" currently **False** (because it is not necessary), or **Indeterminate** (neither True nor False)?
  │
  ├── **FALSE** (Only necessary futures are True) ──► **LEAF: Peirceanism**
  │
  └── **INDETERMINATE** (Neither True nor False) ──► Go to [NODE 6]
  │
  ▼
  **[NODE 6: The Logic of Indeterminacy]**
  **Question:** Does the Law of Excluded Middle ("Either there will be a battle or there won't") hold for this statement?
  │
  ├── **YES** (It is super-true, even if not simply true) ──► **LEAF: Supervaluationism**
  │
  └── **NO** (The disjunction itself lacks a truth value) ──► Go to [NODE 7]
  │
  ▼
  **[NODE 7: Semantics vs. Metaphysics]** ⚠️ **(PIVOT POINT)**
  **Question:** Is the indeterminacy located in **Language/Logic** (we lack a truth-value assignment rule) or in **Reality** (the world lacks a truth-maker)?
  │
  ├── **LANGUAGE/LOGIC** (Many-valued logic system) ──► **LEAF: Łukasiewicz-style Many-Valued Logic**
  │
  └── **REALITY** (No fact of the matter exists) ──► **LEAF: Aristotelianism / Open Future (Open Theism)**

  ---

  ### DIAGNOSTIC NOTES FOR THE INSTRUCTOR

  #### 1. Unoccupied Nodes & Combinations
  *   **[UNOCCUPIED NODE 1] (Quantum Settled / Sea Battle Open):** This view posits hidden variables for physics but libertarian freedom for humans. While metaphysically possible (e.g., certain dualist interactions), it is rarely defended in the *semantics* literature because it requires two different logical treatments for future tense depending on the subject matter. It is **underexplored** in formal semantics but common in lay intuition.
  *   **[UNOCCUPIED NODE 2] (Quantum Open / Sea Battle Settled):** This view posits indeterministic physics but a determined human future (compatibilism or theological predestination). It is **unattractive** to most participants in this debate because the "Open Future" puzzle is usually motivated by the desire to treat human freedom and physical chance analogously. If a student lands here, press them on why human action escapes the indeterminacy of the physical substrate.

  #### 2. Indistinguishable Leaves
  *   **Ockhamism vs. Thin Red Line (TRL):** In the tree, these appear in multiple spots. In contemporary literature, the distinction is notoriously slippery. TRL proponents argue there is a fact of the matter (one branch is actual); Ockhamists argue truth is relative to a context of use. However, both often yield the same truth-value assignments for ordinary assertions. **Diagnosis:** If a student lands on TRL via Node 3A and another on Ockhamism via Node 4, their practical commitments may be identical. The distinction is often merely about whether one posits a metaphysical "actualizer" or a semantic "context."
  *   **Aristotelianism vs. Open Theism:** These land on the same leaf. Aristotelianism is the logical/metaphysical core; Open Theism is the theological application. **Diagnosis:** Treat them as the same position for the purposes of the seminar, noting that Open Theism adds constraints on divine foreknowledge that pure Aristotelianism does not require.

  #### 3. The Semantic/Metaphysical Pivot (Node 7)
  *   **Location:** Node 7 is the critical juncture where the tree forces a distinction between **Semantics** (Łukasiewicz) and **Metaphysics** (Aristotelian/Open).
  *   **Risk:** Students often conflate these. A student might say "It's indeterminate" meaning "I don't know" (Epistemic), "The logic doesn't assign a value" (Semantic), or "The fact doesn't exist" (Metaphysical).
  *   **Instruction:** If a student hesitates here, ask: "If we perfected our language and logic, would the indeterminacy remain?" If yes, they are Aristotelian. If no, they are Łukasiewicz.

  #### 4. Weak Joints & Potential Biases
  *   **The "Truth-Apt" Root:** The tree begins by excluding non-cognitivism (the view that future contingents are not propositions at all). This **begs the question** against expressivist or pragmatic accounts of future discourse. If a student objects to the Root, the tree cannot sort them.
  *   **Node 3A vs. Node 4 (The Ockham/TRL Blur):** The tree attempts to separate Ockhamism and TRL by "Grounding." However, many modern Ockhamists (e.g., MacFarlane) accept truth-relativism that functions identically to TRL in single-context assertions. The tree may **mis-sort** a Relativist Ockhamist into TRL if they affirm there is a "fact of the matter" relative to the speaker.
      *   *Correction:* Be prepared to merge these leaves in discussion. The distinction is often more about the *model theory* (branching time with a designated line vs. branching time without) than the intuitive output.
  *   **Node 1 (Quantum Intuitions):** The tree relies on the student having an intuition about Quantum Mechanics (Case B). Most philosophy students do not. They may answer based on a misunderstanding of physics (e.g., assuming Quantum = Deterministic).
      *   *Correction:* Explicitly stipulate the "Copenhagen Interpretation" in the prompt (as done above), but warn students that if they reject the stipulation, their path through the tree reflects their philosophy of physics, not just philosophy of time.
  *   **Peirceanism Ambiguity:** Node 5 asks if the statement is "False." Peirceans say future contingents are false *because* they are not necessary. However, some interpretations of Peirce suggest they are "neither true nor false" but treated as false for logical purposes. The tree forces a binary choice that might oversimplify the Peircean textual evidence.

  #### 5. How to Redraw the Tree
  You would need to redraw the tree if:
  1.  **Relativism becomes the dominant framework:** If the seminar focuses heavily on Assessment-Sensitive Truth (MacFarlane), the Bivalence/Gap distinction (Node 3B) collapses. You would need a branch for "True relative to Context of Use" vs. "True relative to Context of Assessment."
  2.  **Presentism vs. Eternalism is central:** This tree assumes a branching time framework. If the debate is primarily about the existence of future objects (Presentism) vs. existing times (Eternalism), Node 1 (Ontological Status) needs to be split into "Do future times exist?" before asking about truth values.
  3.  **The "Sea Battle" is rejected as a test case:** If the seminar moves toward decision theory (e.g., Newcomb's Problem) rather than semantics, the "Truth Value" nodes become less relevant than "Credence" or "Rational Action" nodes.

  ---
  **Instructor's Note:** Use the leaves not as final destinations, but as starting points for the first week's reading. The value of this tree is not in the sorting, but in the hesitation students feel at Node 7 and the confusion between Node 3A and Node 4. That confusion *is* the subject matter of the course.
