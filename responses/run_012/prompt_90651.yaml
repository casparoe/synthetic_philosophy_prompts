answer: |-
  # Sorting the Kinds: A Decision Tree for Natural Kind Realisms

  **Instructions:** Start at **Q1**. Follow the path that matches your intuition about the specific case mentioned. Record your four-letter code (e.g., **S-C-D-M**) and find your position in the Key below.

  ### The Tree

  **Q1. The Anchor (Chemical Elements)**
  When the Periodic Table predicts reactions better than a phone book, is that primarily because:
  *   **(S) Structure:** Atoms *have* a mind-independent hidden structure (atomic number) we are matching?
  *   **(I) Inference:** The table *licenses* more reliable inferences and interventions, regardless of hidden structure?

  **Q2. The Glue (Biological Species)**
  Do members of a biological species (unlike elements) hold together because:
  *   **(E) Essence:** They share a strict necessary feature (real definition) no member can lack?
  *   **(C) Cluster:** They share a loose cluster of correlated traits where exceptions are allowed?

  **Q3. The Reach (Psychiatry & Race)**
  Should we demand the same account of "kinds" for Psychiatric Diagnoses/Race as we do for Chemical Elements?
  *   **(U) Unified:** Yes, one account of "kindness" must cover physics, biology, and social science.
  *   **(D) Disunified:** No, social/biological kinds require a fundamentally different treatment than physical kinds.

  **Q4. The Cut (Folk "Fish")**
  When folk categories (like "fish" excluding whales) fail to match science, is the mistake that:
  *   **(W) World:** We failed to discover a boundary that was already there in nature?
  *   **(M) Mind:** We imposed a boundary based on human interests that nature does not support?

  ---

  ### The Key: 16 Logical Positions

  | Code | Position Name | The Awkward Commitment |
  | :--- | :--- | :--- |
  | **S-E-U-W** | **Classic Essentialist Realism** | Must deny that evolution can change the essential properties of a species. |
  | **S-E-U-M** | **Kantian Essentialism** | Claims essences exist but are imposed by the mind (tension between *S* and *M*). |
  | **S-E-D-W** | **Domain Essentialism** | Must explain why Psychiatry has essences while Physics does not (or vice versa). |
  | **S-E-D-M** | **Local Conceptualism** | **Unexplored:** Rarely defended; implies essences are local conventions. |
  | **S-C-U-W** | **HPC Realism (Boyd)** | Must explain where the "homeostasis" comes from without smuggling in an essence. |
  | **S-C-U-M** | **Structural Conceptualism** | **Incoherent:** Claims structure is real (*S*) but kinds are concepts (*M*). |
  | **S-C-D-W** | **Domain-Specific HPC** | Must draw a sharp metaphysical line between domains that may be continuous. |
  | **S-C-D-M** | **Pluralistic Realism (Dupré)** | Claims real structure (*S*) but multiple valid conceptual cuts (*M*); hard to motivate *S*. |
  | **I-E-U-W** | **Inferential Essentialism** | **Unattractive:** Why insist on strict essences (*E*) if only inference matters (*I*)? |
  | **I-E-U-M** | **Conventionalist Essentialism** | **Oxymoron:** Treats essences as human conventions rather than necessary features. |
  | **I-E-D-W** | **Pragmatic Domain Essentialism** | **Unexplored:** Combines pragmatism with rigid domain boundaries. |
  | **I-E-D-M** | **Social Constructionist Essentialism** | **Unattractive:** Implies social kinds have strict essences determined by interest. |
  | **I-C-U-W** | **Empiricist Realism** | **Tension:** Claims only inference matters (*I*) but boundaries are discovered (*W*). |
  | **I-C-U-M** | **Unified Pragmatism** | Risks making the success of physics seem as arbitrary as the Dewey Decimal System. |
  | **I-C-D-W** | **Promiscuous Realism** | **Flagged:** Converges in practice with **S-C-D-M**; disagrees on whether "realness" is required. |
  | **I-C-D-M** | **Pragmatic Pluralism (Chang)** | No fact of the matter on the "correct" classification, even for elements. |

  ---

  ### Notes on Convergence and Empty Space

  1.  **The "Incoherent" Quadrant:** Positions **S-X-X-M** (Structure + Mind) and **I-X-X-W** (Inference + World) are logically tense. If you chose **S** (Structure) but ended up at **M** (Mind), you likely believe structure exists but our *categories* are still human tools (see **S-C-D-M**). If you chose **I** but ended at **W**, you likely believe our tools track real boundaries we just can't fully describe (see **I-C-D-W**).
  2.  **Convergent Practice:** **HPC Realism (S-C-U-W)** and **Pragmatic Pluralism (I-C-D-M)** often agree on how to treat biological species (as clusters), but disagree on whether the "cluster" is a feature of the world or our interests. This tree sorts the metaphysics, not the laboratory practice.
  3.  **The "Empty" Leaves:** Leaves marked **Unexplored** or **Unattractive** represent logical possibilities that few philosophers occupy. If you land here, check if you answered a question instrumentally (what works) rather than metaphysically (what is).
  4.  **Race and Psychiatry:** If you answered **(D) Disunified** in Q3, you reject the idea that Race or Depression must be "real kinds" in the same way Gold is a real kind to be scientifically useful.
