answer: |-
  The pattern you describe reflects the **Objective Theory of Contract**, which, when translated into the philosophy of language, presupposes a **hybrid conception of speech acts**. It treats performative utterances (clicks, signatures, algo-orders) as **conventionally constituted illocutionary acts** that are *prima facie* binding based on their public form, but which remain **rebuttable** by evidence of defective internal states (intention, capacity, volition).

  Here is an analysis of the philosophical commitments, consistency, and counterfactual implications of this legal-technical regime.

  ### 1. The Presupposed Conception of Speech Acts
  This system presupposes that the **illocutionary force** (the binding power) of a speech act is derived primarily from **social and institutional convention** rather than the speaker's contemporaneous psychological state.

  In J.L. Austin's terms, the law treats the "click" or the "algo-order" as a performative utterance that succeeds in virtue of satisfying **procedural felicity conditions** (e.g., the button was labeled "I Agree," the algorithm was authorized) rather than **psychological felicity conditions** (e.g., the user felt a sense of commitment). The law prioritizes the **manifestation of assent** over the **reality of assent**.

  However, it is not purely conventional. By allowing defenses like duress, mistake, or incapacity, the system acknowledges that the *felicity* of the act can be retroactively voided if the **sincerity conditions** (a la Searle) were fundamentally compromised. Thus, the presupposed conception is: **A speech act is a binding public signal that creates a presumption of commitment, subject to defeaters based on private incapacity or coercion.**

  ### 2. Convention vs. Intention: Explaining the Discrepancy
  Does this require convention over intention? **Yes, predominantly.** A purely intention-based account (such as Gricean communication or Searle's intentionality) cannot easily explain why an automated algorithm's output binds a human principal. An algorithm has no mind; it cannot intend to promise. If binding force required contemporaneous intention, high-frequency trading and automated supply chains would be legally impossible.

  However, a **layered intention-based account** can partially explain the "unread click." One could argue the user formed a *prior* intention to be bound by the *system's rules* (which state that clicking equals agreeing). Here, the specific click is not the promise; the promise was made when the user first engaged with the platform, and the click is merely the **execution of a standing intention**.

  **Why the joke fails:** An intention-based account explains the "joke" exception through the **reasonable person standard**. Speech act theory relies on shared context. If a statement is made in a context where a reasonable observer would recognize it as non-serious (a toast at a bar vs. a checkout screen), the illocutionary act of "offering" is not successfully performed. The law does not require access to the speaker's mind to detect a joke; it requires that the *public context* did not support the convention of seriousness. Thus, the "joke" exception is actually consistent with the convention-based view: the convention of contracting was not invoked by the context.

  ### 3. Rival Accounts Ruled Out
  The current practice rules out several rival philosophical accounts of performatives:

  *   **Pure Subjectivism (The "Meeting of the Minds" Doctrine):** This view holds that a contract is only formed if there is a subjective alignment of intent at the moment of agreement. The enforcement of unread clickwraps and algo-trades explicitly rejects this.
  *   **Strict Silence as Inaction:** The refusal to treat silence as acceptance (absent prior convention) rules out the view that *inaction* is a natural sign of assent. It affirms that speech acts require **conventional uptake**; without a prior rule establishing that "silence = yes," the utterance lacks illocutionary force.
  *   **Magical Ritualism:** The system rules out the idea that the words themselves have inherent power. If they did, defenses like duress or incapacity would not matter (a spell works regardless of the caster's freedom). The fact that private facts defeat public marks shows the act is not magic, but **normative**.

  ### 4. Internal Consistency
  Is the system internally consistent, given that private facts defeat public marks?

  **Logically, it is tense; Pragmatically, it is consistent.**
  *   **The Tension:** If the click *constitutes* the agreement (as a convention), then logically, evidence that the user was joking or coerced should be irrelevant, just as evidence that a chess player didn't *feel* like moving a pawn is irrelevant to the validity of the move.
  *   **The Resolution:** The consistency is maintained through a hierarchy of norms. The law treats the public act as creating a **reliance interest** in the counterparty. The private defects (duress, incapacity) are not treated as "the act didn't happen," but rather as **overriding policy considerations** that invalidate the enforcement of the act to prevent injustice.
  *   **Verdict:** It is consistent if viewed as an **estoppel-based system**. You are bound by your public representation to protect those who relied on it, *unless* your internal state was so compromised (incapacity, gun-to-head) that the law values your protection over the counterparty's reliance.

  ### 5. Counterfactuals: Pure Convention vs. Pure Intention

  If we shifted the philosophical foundation of contract and platform design, the practical changes would be drastic.

  #### A. If we adopted a Purely Convention-Based View
  *   **Platform Consent:** "Clickwrap" would become "Click-and-Bind-Irrevocably." Platforms would not need to highlight terms. Dark patterns would be fully enforceable. If the convention of the interface says "Scrolling = Agreement," then scrolling would bind you, even if you are illiterate or blind.
  *   **Automated Transactions:** Algorithms would be treated as independent agents. Errors in code (e.g., selling a stock for $1 instead of $100 due to a bug) would be binding. "Manifestation of Clerical Error" defenses would vanish.
  *   **Defenses:** Duress and incapacity would likely be eliminated or severely narrowed. If the public ritual was performed correctly, the internal state is irrelevant. This would maximize market efficiency but drastically increase coercion and exploitation.

  #### B. If we adopted a Purely Intention-Based View
  *   **Platform Consent:** Clickwraps would likely become unconstitutional or unenforceable. Platforms would need to prove **actual comprehension and contemporaneous intent** for every material term. This might require video verification, quizzes on terms of service, or active negotiation. E-commerce friction would skyrocket.
  *   **Automated Transactions:** Algorithms could not contract. Every algo-trade would require a human to ratify the intention at the moment of execution. High-frequency trading would cease to exist.
  *   **Defenses:** The "Joke" defense would expand. Any party could void a contract by claiming, "I didn't truly intend that," shifting the burden to the other party to prove subjective intent. Litigation would become a psychological inquiry into the state of mind of the parties rather than an analysis of the document.

  ### Summary
  The current legal-technical framework presupposes a **Conventionalist theory of speech acts with Intentionalist safety valves.** It treats the external signal as the constitutive act to ensure market stability and reliance, but admits internal evidence to ensure fairness. It is internally consistent only if one accepts that the *purpose* of contract law is not merely to record promises, but to balance **transactional security** (convention) against **autonomous volition** (intention). To move to either extreme would either destroy consumer protection (Pure Convention) or collapse modern digital commerce (Pure Intention).
