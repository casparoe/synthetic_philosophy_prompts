prompt: |-
  ok so I'm a novelist, about a year into a book that keeps changeing shape on me. The premise: a small town votes to tear down its memorial to something awful that happened there, and the book follows the people who want it gone and the ones who think that's a betrayal. I figured the hard part would be plot. Turns out the hard part is that I don't actually know what I think, and every scene I write is secretly an argument I haven't finished having.

  So I've been reading around the whole duty-to-remember versus case-for-forgetting thing — Margalit on why remembering is somehow owed to the dead, Rieff basically saying that collective memory is a trap that keeps old wounds festering, that forgetting can be a kind of health. I get the two poles. What I don't have is a sense of which questions in that territory are actually worth building a novel around versus which ones just sound deep. Like, is the live question whether there's a duty at all, or is it something further in — who the duty is owed to, whether a community can owe it the way a person can, whether forgetting can be an act of justice rather than cowardice, how you tell the difference between honoring something and being haunted by it, whether remembering is even the right word for what a town does with a monument.

  Here's what I want from you. If you were me — one person, maybe two years of writing time, one book — which two or three questions in this area would you actually build around, and which would you drop even though they sound profound? And I want the reasoning, not a list: why one question is upstream of another, which ones have a real answer waiting at the bottom versus which just generate more talk, and which ones would change the whole book if I got them wrong versus which are decoration. Tell me what would make you move your own ranking — if I came back tomorrow and said I'd decided X, what would that shift?

  One more thing: it's fiction, not a philosophy book, so the questions have to be ones that can live in scenes and fights between characters, not ones that only exist in a seminar. If a question can't be dramatized, say so — that's actually useful to me.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and the Problem:**
      *   **User:** A novelist, one year into a draft.
      *   **Project:** A novel about a small town voting to tear down a memorial to a traumatic event. Conflict: Removal vs. Preservation.
      *   **Core Issue:** The author doesn't know what *they* think. Every scene feels like an unfinished argument. The premise is shifting.
      *   **Research:** Has read Margalit (duty to remember) and Rieff (memory as trap/forgetting as health). Understands the poles.
      *   **Request:** Identify 2-3 *specific* questions worth building the novel around vs. those to drop. Explain *why* (upstream/downstream, dramatizable vs. abstract, high stakes vs. decoration). Explain what would shift the ranking.
      *   **Constraint:** Must be fiction-friendly (dramatizable in scenes/fights), not philosophical abstraction.

  2.  **Deconstruct the Philosophical Landscape (Memory vs. Forgetting):**
      *   *Duty to Remember:* Margalit. Ethics of memory. Owed to the dead.
      *   *Case for Forgetting:* Rieff. Memory as pathology. Healing requires letting go.
      *   *Other angles:* Who owns the past? Performative memory vs. lived memory. Generational guilt. The function of monuments (to teach? to warn? to honor?).

  3.  **Evaluate Potential Questions for Fiction:**
      *   *Question A: Is there a duty to remember?* (Too abstract. Hard to dramatize without sounding like a lecture. Binary yes/no doesn't drive plot.)
      *   *Question B: Who is the duty owed to?* (Better. The dead? The survivors? The future? This creates conflicting loyalties among characters.)
      *   *Question C: Can forgetting be justice?* (Strong. Reframes the antagonist not as a villain but as a healer. High dramatic potential.)
      *   *Question D: Can a community owe a debt like a person?* (Too legalistic/philosophical. Hard to show in a scene.)
      *   *Question E: Honoring vs. Being Haunted.* (Very strong. Psychological stakes. Visual imagery.)
      *   *Question F: What does the monument actually *do*?* (Functional. Does it stop history from repeating? Or does it freeze pain?)

  4.  **Select the Top 2-3 Questions:**
      *   *Selection 1: Is the monument for the dead, or for the living?* (This cuts through the "duty" abstraction. If it's for the dead, they can't complain if it's gone. If it's for the living, does it help or hurt them? This drives character motivation.)
      *   *Selection 2: Is forgetting an act of cowardice or an act of mercy?* (This gives moral weight to both sides. It prevents the "racist/progressive" caricature trap. It makes the conflict internal as well as external.)
      *   *Selection 3 (The Tie-Breaker):: Who gets to decide when the debt is paid?* (This introduces power dynamics. Is it the victims' families? The town council? The younger generation? This creates the *plot* mechanism—the vote, the meetings, the sabotage.)

      *Refining the Selection:* Let's look for the *upstream* questions.
      *   *Upstream:* What is the function of the monument *now*? (Not originally, but *now*.)
      *   *Upstream:* Is the pain being kept alive to protect the dead or to punish the living?
      *   *Drop:* "Can a community owe a debt?" (Too metaphysical). "Is remembering the right word?" (Too semantic).

      *Final Choice:*
      1.  **Who is the memory *for*?** (The Dead vs. The Living).
      2.  **Is the monument a mirror or a shield?** (Truth-telling vs. Protection/Identity).
      3.  **Does removing the stone bury the sin or just hide the evidence?** (Justice vs. Convenience).

      *Wait, let's make them more actionable for a novelist.*
      1.  **Is the monument keeping the wound open to heal it, or to keep it bleeding?** (The Function of Pain).
      2.  **Who owns the right to forgive?** (The Authority of Memory).
      3.  **Is the "truth" the stone represents, or the reaction to the stone?** (The Nature of the Trigger).

      *Let's go with the most dramatizable ones.*
      1.  **Is the monument a promise to the dead, or a warning to the living?** (If it's a promise, breaking it is betrayal. If it's a warning, does it still work?)
      2.  **Does taking it down heal the town, or does it gaslight the victims?** (The consequence of action).
      3.  **Are we remembering the event, or are we remembering *ourselves* as the people who remember?** (Identity vs. History).

      *Actually, the user asked for "Upstream/Downstream" logic.*
      *   *Upstream:* What is the *purpose* of the memory?
      *   *Downstream:* How do we enact that purpose?
      *   *Decoration:* Metaphysics of collective guilt.

      *Let's settle on these three:*
      1.  **Is the monument a tombstone or a teacher?** (Function).
      2.  **Who holds the keys to the future: the grieving or the growing?** (Authority/Generation).
      3.  **Is the pain we feel proof of respect, or proof of pathology?** (Internal State).

      *Wait, I need to be stricter.* The user says "every scene I write is secretly an argument I haven't finished having." This means the characters are mouthpieces. The goal is to make the *plot* answer the question, not the dialogue.
      *   *Best Question 1:* **Does removing the monument help the victims, or does it comfort the perpetrators?** (This creates immediate stakes. If it helps victims, removal is good. If it comforts perpetrators, removal is bad. But what if the victims are divided?)
      *   *Best Question 2:* **Is the town defined by what it did, or by what it does now?** (Identity. This allows for redemption arcs or tragedy.)
      *   *Best Question 3:* **Can you honor a tragedy without making it your identity?** (The psychological cost.)

      *Let's refine for the "Upstream/Downstream" requirement.*
      *   *Upstream:* **What is the monument actually doing to the people looking at it right now?** (Not what it *should* do, what it *is* doing).
      *   *Midstream:* **Who has the standing to decide?** (Victims' kin vs. Townspeople).
      *   *Drop:* **Does a collective have a soul?** (Too abstract).

      *Okay, let's draft the response focusing on:*
      1.  **The Function Question:** Is the monument a mirror (truth) or a shield (identity)?
      2.  **The Beneficiary Question:** Who benefits from the pain of remembering?
      3.  **The Drop List:** Metaphysical collective guilt, semantic definitions of memory.

      *Wait, I need to address the "What would shift your ranking" part.*
      *   If the author finds a specific historical parallel? No.
      *   If the author finds a character whose personal stake contradicts the public stake? Yes.

      *Let's structure the advice:*
      *   Acknowledge the trap (philosophical paralysis).
      *   Identify the 2 Core Questions.
      *   Identify the 1 Drop Zone.
      *   Explain the "Upstream/Downstream" logic.
      *   Explain Dramatization.
      *   Explain the "Shift" condition.

      *Core Question 1: Is the pain of the monument necessary for the lesson, or is the pain just the scar tissue?* (Necessity of Suffering).
      *   *Dramatization:* A character who visits the monument and feels sick vs. a character who visits and feels safe.
      *   *Upstream:* Determines if removal is mercy or erasure.

      *Core Question 2: Who is the "we" in "We must remember"?* (Boundaries of Community).
      *   *Dramatization:* A newcomer vs. a legacy family. A victim's grandchild who wants it gone vs. a perpetrator's grandchild who wants it kept.
      *   *Upstream:* Determines who gets a vote/voice.

      *Drop:* "Can a community owe a debt?" (Too legalistic). "Is forgetting justice?" (Too abstract).

      *Let's polish the "Shift" condition.* If the author finds a character who *needs* the monument to stay up for a reason that isn't hate (e.g., fear of forgetting the lesson), that shifts the weight from "Good vs. Evil" to "Safety vs. Truth."

      *Wait, one more thought:* The user says "I don't actually know what I think." The novel shouldn't answer the question definitively (thesis statement), but it should *interrogate* a specific tension. The advice should be: Don't pick a side, pick a *tension*.
      *   Actually, the user asks "which questions... would you actually build around." This implies selecting the *engine* of the book.
      *   Okay, I will advise picking the question that forces *action*, not the one that forces *definition*.

      *Revised Plan:*
      1.  **Question 1 (The Engine): Is the monument keeping the wound clean or keeping it infected?** (Health vs. Honesty).
      2.  **Question 2 (The Stakes): If we take it down, who gets to pretend nothing happened?** (Complicity vs. Healing).
      3.  **The Drop:** The metaphysics of collective debt.
      4.  **Reasoning:** Upstream/Downstream, Dramatization.
      5.  **The Shift:** Character discovery.

      *Let's refine Question 1.* "Is the monument a tombstone or a teacher?" is good. But "Is the monument a mirror or a shield?" is better for conflict.
      *   Mirror: Shows us who we were.
      *   Shield: Protects us from having to change.
      *   *Wait, if it's a shield, taking it down exposes us.*
      *   *If it's a mirror, taking it down removes the reflection.*
      *   Let's go with: **Is the monument a warning or a warranty?** (Warning: Don't do this again. Warranty: We promise we aren't those people anymore).
      *   *Actually, the "Health vs. Honesty" angle is more Rieff/Margalit specific.*
      *   Let's stick to the user's research. Margalit = Ethics of Memory. Rieff = Against Remembrance.
      *   *Synthesis Question:* **Does remembering this specific thing require this specific stone?** (Materiality of Memory).
      *   *Why:* It moves away from abstract "memory" to physical "stone." It allows for scenes about construction, demolition, graffiti, weathering.
      *   *Second Question:* **Who is allowed to move on?** (The timeline of grief).
      *   *Drop:* **Does the town have a soul?**

      *Okay, I have a strong direction now.*
      *   **Focus 1:** The Materiality Question (Does the stone *do* the work, or is it a crutch?).
      *   **Focus 2:** The Authority Question (Who owns the grief?).
      *   **Drop:** The Metaphysical Question (Collective guilt).
      *   **Reasoning:** Focus 1 & 2 drive plot/scene. Drop drives essays.
      *   **Shift:** If a character reveals a secret about the *origin* of the monument (it was built to hide something, not honor something).

      *Let's write.*
answer: |-
  This is a classic trap for smart novelists: you've done the research, so now you're writing a thesis disguised as a story. When every scene feels like an unfinished argument, it's usually because the characters are debating the *definition* of the problem rather than suffering the *consequences* of it.

  You asked for two or three questions to build around, and which to drop. Here is the triage I would perform if I were in your chair, trying to get from "philosophical paralysis" to "pages turning."

  ### 1. The Builder Question: Does the stone do the work, or is it a crutch?
  **Keep this.** This is your most upstream question.
  **Drop:** "Is there a duty to remember?"

  **Reasoning:**
  "Is there a duty to remember?" is a binary switch (Yes/No). It leads to speeches. It leads to characters standing in town halls quoting Margalit at each other. It is undramatic because the answer doesn't change what anyone *does* on a Tuesday morning.

  "Does the stone do the work, or is it a crutch?" is functional. It forces you to evaluate the monument not as a symbol, but as a *tool*.
  *   **If it's a tool:** It actively prevents the atrocity from happening again. Removing it increases danger.
  *   **If it's a crutch:** It allows the town to feel they've "paid" for the sin without changing their behavior. Removing it forces actual change.

  **Why it works for fiction:**
  You can dramatize this without dialogue.
  *   *Scene:* A teenager walks past the monument. Do they look up and read the names (tool), or do they look down and walk faster to avoid the guilt (crutch)?
  *   *Scene:* A city council meeting. The pro-monument side argues that the stone *is* the lesson. The anti-monument side argues the stone *replaces* the lesson.
  *   *Stakes:* If you get this wrong, the book feels academic. If you get it right, every act of vandalism or preservation becomes a tactical move in a war over the town's safety, not just its soul.

  ### 2. The Stakes Question: Who is allowed to move on?
  **Keep this.** This is your engine for character conflict.
  **Drop:** "Can a community owe a debt like a person?"

  **Reasoning:**
  The metaphysics of collective guilt (can a "town" owe a debt?) is a black hole. It generates talk, not action. It's a legalistic distinction that belongs in a law review, not a scene.

  "Who is allowed to move on?" is visceral. It creates immediate, incompatible desires between characters who should otherwise agree.
  *   **The Conflict:** Maybe the descendants of the *victims* want the monument gone because it hurts too much to see every day (Rieff's "health"). Maybe the descendants of the *perpetrators* want it to stay because they need the public shame to keep them honest (Margalit's "duty").
  *   **The Drama:** This flips the expected script. It prevents your book from being a simple proxy for current culture-war headlines. It forces your "villains" to have noble motives and your "heroes" to have selfish ones.
  *   **Upstream/Downstream:** This question is downstream of the first one. If the stone is a crutch, the perpetrators keeping it up is cowardice. If the stone is a tool, the victims wanting it down is a loss of protection. The friction between these two positions *is* your plot.

  ### 3. The Drop Zone: The Definition of "Remembering"
  **Drop:** "Whether remembering is even the right word for what a town does."

  **Reasoning:**
  This is semantic decoration. It sounds profound, but it's a distinction without a difference in a narrative context. Whether you call it "commemorating," "archiving," or "haunting," the physical action is the same: The stone stays or the stone goes.
  Spending energy here will lead to scenes where characters quibble over language ("It's not memory, it's history!"). That kills pacing. You want scenes where characters quibble over *fate* ("If this goes, my grandfather's crime disappears!").

  ### Why This Ranking?
  I have ranked **Function** (Does it work?) and **Authority** (Who decides?) above **Metaphysics** (What is guilt?).

  *   **Function** determines the *plot*. (We must destroy/keep the object because of what it *does*.)
  *   **Authority** determines the *conflict*. (You don't have the right to decide because of who you *are*.)
  *   **Metaphysics** determines the *theme*, but theme should emerge from the wreckage of the plot, not dictate it.

  If you build around Metaphysics, you write a book where people change their *minds*. If you build around Function and Authority, you write a book where people change their *lives*.

  ### What Would Shift My Ranking?
  You asked what would make me move these priorities. There is one specific discovery that would overturn this advice:

  **If you find a secret about the monument's origin.**

  If, during your drafting, you discover that the monument wasn't built to honor the dead or warn the living, but was built *to hide a deeper crime* (e.g., the "awful thing" it memorializes is a lie covering up something worse), then **Function** becomes irrelevant. The monument isn't a tool or a crutch; it's evidence.

  If that happens, the primary question shifts to: **Is the truth worth the destruction it will cause?**

  *   **Why this shifts things:** It moves the book from a "debate" genre to a "thriller/mystery" genre. The tension is no longer "Should we keep this?" but "What happens if we look behind this?"
  *   **The Test:** If you can imagine a scene where a character finds a box of letters inside the cornerstone that changes the narrative of the original atrocity, drop my advice above and chase that secret. That is a question that *cannot* be solved in a seminar, only in a climax.

  ### Summary for Tomorrow's Drafting
  1.  **Stop writing scenes where characters define memory.** Start writing scenes where characters interact with the physical reality of the stone (cleaning it, hiding it, tripping over it, reading it).
  2.  **Assign the "Rieff" position (forgetting is health) to a victim's family member.** This makes it emotionally defensible, not just intellectually clever.
  3.  **Assign the "Margalit" position (duty to remember) to a perpetrator's family member.** This makes it a burden, not a virtue signal.

  If you do that, you won't have to know what *you* think. The book will tell you.
