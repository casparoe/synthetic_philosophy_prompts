answer: |-
  1. **Is the distinction real?**
  The distinction is pragmatically real but technically precarious. A quantitative geneticist will argue that *Intervention-heritability* is not a distinct parameter but a simulation result derived from *Variance-heritability* plus a model of the intervention. Their objection will be: "You aren't defining a new property of the trait; you are calculating the effect size of a policy." If you define Intervention-heritability as "the fraction of *current* variance removed," you create a metric that is path-dependent. If a population has already been equalised for nutrition, a further nutrition intervention has zero Intervention-heritability, even if nutrition is the primary causal driver of the trait historically. This makes the metric a property of the *current policy context*, not the biology.

  To save the distinction, you must lean into this: argue that *Variance-heritability* is a descriptive statistic of a static system, while *Intervention-heritability* is a dynamical property of the system-plus-policy. Do not try to claim they are both "heritabilities" in the same ontological sense. Reserve the word *heritability* for Variance-heritability (standard usage is too entrenched to fight). Call the second quantity *Intervention Efficacy* or *Variance Reduction Potential*. If you insist on calling it Intervention-heritability, you will spend the Q&A defending terminology rather than the concept. Your definition is tight enough for philosophy, but it behaves badly in GxE cases: if an environmental intervention changes the expression of genetic variance (e.g., a diet that suppresses a genetic predisposition), the "fraction of current variance removed" conflates removing environmental variance with suppressing genetic variance. You need to acknowledge this conflation explicitly.

  2. **Accuracy.**
  You are right to worry about the GxE gesture. Saying heritability estimates bear on the intervention question "under assumptions" understates the problem. In the presence of GxE, within-population $h^2$ is locally valid and globally inert. It does not bear on the intervention question *at all* without a reaction norm. You should strengthen this: the estimate is not just indirect; it is potentially misleading if the intervention moves the population to a new reaction norm slope.

  The myopia example is technically risky. You write: "prevalence rising steeply within a single generation." This describes a shift in the *mean*, not necessarily a reduction in *variance*. Your definition of Intervention-heritability is "the fraction of the population's current trait variance that the intervention would remove." If an environmental shift (e.g., increased near-work) shifts the mean myopia score up but maintains the same spread (variance) around the new mean, your Intervention-heritability is zero, even though the trait is environmentally malleable. You are conflating *malleability of the mean* with *reducibility of the variance*. This is a critical slip. If the intervention equalises the environment (e.g., everyone gets glasses, or everyone is banned from reading), variance might drop. If the intervention just shifts the environment for everyone equally, variance might stay high. You must distinguish between interventions that shift the mean and interventions that compress the variance. The former is about population health; the latter is about inequality. Your current definition only captures the latter.

  3. **Is the target real?**
  The "ritual" charge is accurate for public discourse and introductory textbooks, but your audience (graduate philosophy of biology) knows the Lewontin/Block clarifications by heart. If you present this as "philosophers don't know Q1 doesn't imply Q3," they will reject it. You must frame the target not as *ignorance* of the distinction, but as *dissatisfaction* with it. The standard clarification is negative (it tells you what heritability *isn't*); your proposal is positive (it tells you what metric you *should* use).

  The strongest version of the position you are attacking is not that Q1 implies Q3, but that Q1 is the *only* rigorous question available, and Q2/Q3 are therefore unscientific. Some methodological individualists hold that without a specific $h^2$ estimate, policy talk is mere speculation. Your contribution is to argue that Q2/Q3 are answerable, just not via $h^2$. If the standard view already accepts Q2 is distinct but claims it's unquantifiable, your proposal to quantify it (via Intervention-heritability) is the real novelty. Ensure you aren't fighting a straw man who thinks $h^2$ predicts group differences; fight the one who thinks nothing else can.

  4. **The gap question.**
  Section 3 is correct but risks triviality. Every causal claim requires a counterfactual. The distinctive work the within-between argument does is not just that counterfactuals need specification, but that *between-group* counterfactuals often involve variables that are not independently manipulable (e.g., "genotype distribution" is confounded with "historical environment").

  Do not drop the claim, but restate it: Q3 is not just underspecified; it is often *incoherent* without a policy constraint. "What would happen if we equalised genotypes?" is not a valid counterfactual for humans. "What would happen if we equalised schooling?" is. The within-between argument's distinctive force is that it blocks the *genetic* equalisation counterfactual as scientifically illegitimate in human contexts, while leaving the *environmental* one open. Make sure Section 3 emphasizes that Q3 requires a *manipulable* variable, not just a specified one. This avoids the "all causal questions need specification" triviality objection.

  5. **Shape and cuts.**
  Section 5 is redundant. It explains the motivation for the confusion, but Section 2 already established the logical error. Cut Section 5 entirely, and move the "recipe" metaphor to the end of Section 4. End the essay on the proposal (Section 4), not the diagnosis. The "recipe" line is a strong closer: "The decomposition looks like a recipe, but it is a balance sheet."

  The myopia example needs repair (see Priority 2). If you cannot fix the variance/mean distinction, cut the example. It is currently doing decorative work that might undermine your technical credibility. A better example might be PKU: high $h^2$ in a standard environment, but an environmental intervention (diet) removes nearly 100% of the variance (for the pathological tail). This fits your "variance removal" definition perfectly.

  6. **One paragraph on the thing I do not know I have got wrong.**
  You are implicitly treating variance reduction as the normative goal of policy. Your definition of Intervention-heritability values interventions that homogenise traits. But many policies aim to shift means (e.g., increase average height via nutrition) without reducing variance, or even to increase variance (e.g., enrichment programmes that allow high-potential individuals to flourish). By defining the metric as "fraction of variance removed," you build an egalitarian bias into the concept of heritability itself. A critic will argue that a trait can be highly "intervention-heritable" in your sense (variance collapses) but the intervention is undesirable (e.g., levelling down), or that an intervention is desirable but has low Intervention-heritability (shifts mean, keeps variance). You need to acknowledge that your metric measures *equalisation potential*, not *malleability* simpliciter. If you don't, you are smuggling a political value into a technical definition.
