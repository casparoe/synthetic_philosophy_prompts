          *   *Severity:* Medium-High. You *can* keep Multiverse without SIA (using standard Bayesian updating on "Life exists"), but it's weaker. However, combined with (1) "existence is not evidence," this gets tricky. (1) says my existence isn't evidence of *more observers*. (6) says my existence is evidence of *more universes*.
