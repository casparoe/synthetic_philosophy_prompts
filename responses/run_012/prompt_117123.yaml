      *   *Correction:* The Sim Argument *can* run on SSA alone *if* you grant the premise that post-humans will run many sims. The probability shift comes from the ratio of Sim-to-Real observers. If you are a random observer (SSA), and there are 1000 sims for 1 real, you are likely a sim. This *looks* like SIA, but it's actually SSA applied to a specific hypothesis ($H_{sim}$ vs $H_{real}$).
      *   *Wait, check:* Does SSA alone support the Sim Arg? Yes, *if* you accept the empirical premise that many sims are run. Does it support the Multiverse? SSA alone does *not* support the Multiverse as well as SIA does. SIA favors hypotheses with more observers. Multiverse has more observers. SSA is neutral or favors smaller universes (Doomsday).
      *   *So:* (1) SSA + (3) Anti-SIA is consistent. (2) Doomsday follows from (1). (5) Sim Arg is *possible* under SSA but requires specific empirical premises. (6) Multiverse is *hard* under SSA/Anti-SIA because SSA doesn't favor the hypothesis with more total observers (universes).
      *   *Re-evaluating Sleeping Beauty:* Thirderism is the biggest outlier for a pure SSA holder. SSA typically = Halfer. SIA = Thirder. This is the strongest conflict.

      *   *Re-evaluating Sim Arg:* The Sim Arg is often criticized *using* the Presumptuous Philosopher logic. If you buy the Presumptuous Philosopher objection (3), you should be wary of the Sim Arg (5). Why? Because the Sim Arg says "Believe you are a sim because there are more sims." The Presumptuous Philosopher says "Don't believe you are in the big universe just because there are more observers." These are structurally identical moves.
