          5.  The "Cheapest Fixes."

      *   *Refining the Sleeping Beauty/SSA link:* I need to be careful. SSA *can* be made compatible with Thirding if the reference class is "observer-moments" rather than "observers." But the user defined (1) as "random observer." If "observer" = "Beauty," SSA says 50%. If "observer" = "awakening," SSA says 33%. The user's definition in (1) is the ambiguity.
