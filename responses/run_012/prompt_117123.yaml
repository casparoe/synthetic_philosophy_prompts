      *   **Pair 2: SSA (1) & Sleeping Beauty Thirder (4).**
          *   *Relation:* This is the big one. Standard SSA usually leads to the "Halfer" position in Sleeping Beauty. Thirderism is typically associated with SIA (or a specific variant of SSA called "SSA+SIA" or just a different interpretation of centered worlds).
