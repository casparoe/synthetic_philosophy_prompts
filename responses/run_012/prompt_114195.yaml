  # Statement of Adversarial Collaboration: The Duty of Truthfulness in Coercive Contexts

  ## I. Agreed Claims
  Both parties accept the following premises as the common ground for this collaboration. These claims establish the boundaries of the dispute and exclude external objections (e.g., consequentialist critiques).

  1.  **The Case:** A malicious agent (the "murderer") arrives at the door of a moral agent, asking for the location of an intended victim with the stated aim of killing them. The moral agent knows the victim's location.
  2.  **The Nature of the Duty:** The duty of truthfulness is a perfect duty. Its moral force is not derived from the consequences of speaking truly or falsely (e.g., trust utility, harm prevention), but from the requirements of practical reason.
  3.  **The Source of Authority:** The authority of the duty stems from the Categorical Imperative (CI), specifically the Formula of Universal Law and the Formula of Humanity. Both parties agree that the CI is the final arbiter of moral permissibility.
  4.  **Universalizability:** The CI procedure tests the *maxim* of the action, not the action in isolation. Both parties agree that the procedure determines whether a maxim can be willed as a universal law without contradiction.
  5.  **The Text:** Both parties accept Kant's "On a Supposed Right to Lie from Philanthropy" as the primary statement of the Rigorist position, acknowledging that the Internal Critic argues this text contains an error in the *application* of Kant's own system, not a rejection of the system itself.
  6.  **Moral Agency:** Both parties agree that the primary goal of the moral law is the preservation and integrity of rational agency.

  ## II. Table of Surviving Disagreements
  The following table outlines the substantive divergences. Each column is phrased such that the respective party accepts the description as an accurate statement of their position.

  | Topic of Disagreement | The Rigorist Position | The Internal Critic Position |
  | :--- | :--- | :--- |
  | **1. Scope of the Obligation** | The duty of truthfulness is owed to humanity as such. Any question posed by a rational being creates a normative claim to the truth, regardless of the questioner's intent. | The duty of truthfulness is owed only within a context of reciprocal right. A coercive aggressor forfeits their entitlement to the truth by placing themselves outside the condition of lawful communication. |
  | **2. Conflict of Duties** | There is no genuine conflict of duty. The duty to speak truthfully is unconditional; the duty to preserve life is a wide/imperfect duty that cannot justify violating a perfect duty. | There is a conflict of jurisdiction. The duty to preserve life (and prevent injustice) overrides the duty to communicate truthfully when the communicative partner is actively undermining the conditions of right. |
  | **3. The Locus of Wrongness** | Lying is wrong primarily because it corrupts the liar's own capacity for avowal. It is a violation of a duty to oneself to maintain integrity as a moral speaker. | Lying is wrong primarily because it undermines the social preconditions of trust. When the questioner destroys those preconditions (via threat of violence), the prohibition loses its grip. |
  | **4. Unconditionality** | "Unconditional" means the rule admits no exceptions in application. If the condition "someone asks a question" is met, the duty is triggered. | "Unconditional" means the *ground* of the duty is not empirical, but its *application* depends on the normative status of the recipient. If the recipient lacks standing, the duty does not activate. |

  ## III. The Cruxes and Variant Tests
  The collaboration identifies two fundamental cruxes driving the disagreement. For each crux, we stipulate a variant case. Both parties commit in advance to how their position must apply to these variants to maintain internal consistency.

  ### Crux 1: The Source of the Obligation
  **The Question:** Does the murderer's question constitute a declaration that places the answerer under an obligation to *him*, or does the obligation arise solely from the answerer's duty to their own rational nature?

  **Variant Test A: The Victim Has Already Left**
  *Scenario:* The moral agent knows the intended victim has already fled the house and is safe. The murderer asks, "Are they inside?" The moral agent considers lying to send the murderer away.

  *   **Rigorist Prediction:** The lie remains **forbidden**.
      *   *Reasoning:* Since the obligation is grounded in the duty to oneself (integrity of avowal) and owed to humanity generally, the safety of the victim is irrelevant. The moral injury is the corruption of the speaker's will, which occurs regardless of whether harm is prevented.
  *   **Internal Critic Prediction:** The lie remains **permissible**.
      *   *Reasoning:* Since the obligation is grounded in reciprocal right, the murderer's status as a coercive aggressor has not changed. The victim's safety is not the source of the permission to lie; the murderer's lack of entitlement to the truth is. The lie is permissible because the murderer has no *right* to the answer, not merely to save the victim.

  ### Crux 2: The Nature of the Duty (Self vs. Other)
  **The Question:** Is the operative duty a duty to others (to maintain social trust) or a duty to oneself (consistency in avowal)?

  **Variant Test B: The Request is in Writing**
  *Scenario:* The murderer does not speak but slides a note under the door demanding a written reply regarding the victim's location.

  *   **Rigorist Prediction:** The medium is **morally irrelevant**.
      *   *Reasoning:* The duty is to oneself to avoid intentional untruth. Whether the avowal is spoken or written, the maxim of deceiving a rational being is universalized. The formal nature of writing does not alter the contradiction in the will.
  *   **Internal Critic Prediction:** The medium is **potentially relevant**.
      *   *Reasoning:* If the duty is based on reciprocal trust within a civil condition, a written demand may imply a different normative context than spoken coercion. However, to remain consistent with the "forfeiture of right" view, the Critic maintains the lie is **permissible**, arguing that a written demand under threat of violence still lacks the lawful standing required to generate an obligation of truthfulness. (Note: If the Critic argues the duty is purely social, they must argue the written note fails to establish the necessary social contract of truth-telling).

  ## IV. Identification of Verbal Dispute
  Upon analysis, a portion of the dispute is identified as **merely verbal**, specifically concerning the definition of **"Exceptionlessness."**

  *   **The Dispute:** Both parties agree that the *ground* of the duty is a priori and not derived from consequences. However, they disagree on whether "exceptionless" refers to the *triggering conditions* or the *weight of the duty*.
  *   **Rigorist Usage:** "Exceptionless" means there are no factual scenarios where the maxim "I will lie" is permissible. The condition "someone asks" is purely empirical and sufficient to trigger the duty.
  *   **Internal Critic Usage:** "Exceptionless" means the duty's authority is never overridden by empirical goods (like happiness). However, the duty has *jurisdictional limits*. If the normative conditions for the duty (reciprocal right) are absent, the duty is not "excepted"; it simply does not apply.
  *   **Resolution:** This is verbal insofar as both agree the moral law is supreme. The Rigorist calls the Critic's "jurisdictional limit" an exception; the Critic calls the Rigorist's "triggering condition" a category error.
  *   **Substantive Remainder:** Even if this terminology is aligned, a substantive disagreement remains regarding **whether a coercive aggressor retains the normative standing to claim truth.** The Rigorist asserts standing is inherent to humanity; the Critic asserts standing is conditional on lawful behavior. This substantive point is not verbal and is the true locus of the collaboration's work.
