answer: |-
  This is a classic and formidable objection to supervaluationism, often referred to as the **"Sharp Boundaries Objection"** or a version of the **"Problem of Higher-Order Vagueness."** Your colleague has reconstructed a well-known argument that strikes at the heart of the view.

  To save supervaluationism, you should reject **Step (6)**. However, doing so requires accepting significant costs regarding logic and metaphysics. Below is a detailed breakdown of where the argument goes wrong, how to repair the datum, the costs involved, and a comparison with epistemicism.

  ### 1. Diagnosing the Mistake: Step (6)

  The error lies in the inference from the supertruth of an existential claim to the existence of a determinate fact.

  *   **Step (5)** is correct within supervaluationism: The sentence $\exists n (\text{Heap}(n) \land \neg \text{Heap}(n+1))$ ("There is a sharp boundary") is indeed **supertrue**. It is true on every admissible precisification because every classical precisification must draw a line somewhere.
  *   **Step (6)** is the mistake: "If there is a sharp boundary then 'heap' is not vague after all."

  The supervaluationist argues that vagueness is not the absence of a boundary *simpliciter*, but the absence of a **determinate** boundary. Supervaluationism validates the existential claim ("There is a cutoff") while invalidating every instance ("$n$ is the cutoff").

  For any specific number $k$, the sentence $\text{Heap}(k) \land \neg \text{Heap}(k+1)$ is **not supertrue**. On some precisifications, the cutoff is at $k$; on others, it is at $j$. Since no specific cutoff is true on *all* precisifications, no specific cutoff is supertrue.

  Therefore, the supervaluationist accepts that it is true that *a* boundary exists, but denies that there is any fact of the matter as to *where* it is. This preserves the intuition of vagueness: the language is semantically indecisive. The term 'heap' does not select a single sharp set; it selects a range of sharp sets. Consequently, there is no single sharp boundary in reality, only a cloud of candidate boundaries.

  ### 2. Repairing the Datum

  To maintain consistency, you must refine the datum in Step (1).

  *   **Original Datum:** A term is vague only if its extension has no sharp boundary.
  *   **Repaired Datum:** A term is vague only if it lacks a **determinate** sharp boundary.

  On the repaired datum, supervaluationism is consistent. It posits that while the sentence "There is a boundary" is true, the boundary is not a determinate feature of the world. The "extension" of a vague term is not a single set with a boundary, but a partial function (or a set of candidate sets). The "gap" between the supertrue (definitely a heap) and the superfalse (definitely not a heap) constitutes the vagueness. As long as that gap remains, the term is vague, even if the logic forces us to assent to the existential claim of a boundary.

  ### 3. The Cost: Logic and Higher-Order Vagueness

  Giving up Step (6) saves the theory from incoherence, but it exacts a heavy price.

  **A. Non-Classical Logic**
  By accepting $\exists x Fx$ as true while denying $Fa$ for every specific constant $a$, supervaluationism must abandon standard classical logic rules. Specifically, it fails **Existential Instantiation**.
  *   In classical logic, if "Someone is the culprit" is true, you can reason about "the culprit."
  *   In supervaluationism, you can assert "There is a cutoff number," but you cannot reason about "the cutoff number" because there isn't one.
  This makes the logic weaker and counter-intuitive. It implies there are truths without specific truth-makers.

  **B. The Problem of Higher-Order Vagueness**
  This is the more severe cost. Supervaluationism defines truth via the set of **admissible precisifications**.
  *   Question: What makes a precisification admissible?
  *   Problem: There must be a boundary between admissible and inadmissible precisifications. If that boundary is sharp, then supervaluationism has replaced the vagueness of 'heap' with the precision of 'admissible precisification.' It hasn't eliminated sharp boundaries; it has just pushed them up a level.
  *   If the boundary of admissibility is *vague*, then the definition of supertruth becomes vague. But if the definition of truth is vague, the logic itself becomes unstable (e.g., is it supertrue that a sentence is supertrue?).

  Supervaluationists often try to handle this by "supervaluating over precisifications of admissibility," but this can lead to an infinite regress or a collapse into the claim that there is, after all, a sharp boundary at the meta-level.

  ### 4. Comparison with Epistemicism

  How does the epistemicist (e.g., Timothy Williamson) fare against this argument?

  **The Epistemicist Stance:**
  *   **Rejects Step (1):** Epistemicists argue that the datum is wrong. Vagueness *is* compatible with sharp boundaries. A term is vague if its boundary is **unknowable**, not if it doesn't exist.
  *   **Accepts Steps (3), (4), (5):** Like the supervaluationist, they agree there is a sharp boundary.
  *   **Rejects Step (6):** They deny that the existence of a sharp boundary eliminates vagueness. For them, vagueness is a species of ignorance.

  **Comparison of Costs:**

  | Feature | Supervaluationism | Epistemicism |
  | :--- | :--- | :--- |
  | **Logic** | **Non-Classical.** Fails existential instantiation, bivalence, and sometimes conditional proof. | **Classical.** Retains all standard rules of inference. |
  | **Metaphysics** | **Semantic Indecision.** No fact of the matter about boundary location. | **Realism.** There is a fact of the matter (e.g., 543 grains is the cutoff), fixed by usage patterns. |
  | **Phenomenology** | **Preserves Intuition.** Matches the feeling that there is no specific cutoff. | **Violates Intuition.** Requires believing a specific grain makes the difference, even if unknowable. |
  | **Higher-Order Vagueness** | **Struggles.** Risks drawing a sharp line at the level of admissibility. | **Handles Better.** Explains higher-order vagueness as higher-order ignorance (margin for error principles). |

  **Who fares better?**
  *   **Epistemicism** wins on **logical simplicity**. It keeps classical logic intact and provides a robust account of higher-order vagueness without positing truth-value gaps.
  *   **Supervaluationism** wins on **pre-theoretical intuition**. It respects the strong intuition that there *really isn't* a specific grain that turns a heap into a non-heap. It treats vagueness as a semantic phenomenon rather than an epistemic limitation.

  ### Summary Recommendation

  To keep supervaluationism, you must tell your colleague:
  1.  **Reject Step (6).** The truth of "There is a boundary" does not imply the term is precise, because no *specific* boundary is true.
  2.  **Accept the Logical Cost.** Acknowledge that this requires a logic where $\exists x Fx$ does not imply $Fa$ for any $a$.
  3.  **Acknowledge the Meta-Problem.** Admit that handling the boundary of "admissible precisifications" is the theory's weakest point (higher-order vagueness).

  If your colleague finds the logical costs too high (specifically the failure of existential instantiation), they may find **Epistemicism** more attractive, as it accepts the sharp boundary conclusion but preserves classical logic. However, if they share your desire to preserve the intuition that the world/language is not sharp, supervaluationism remains the best option, provided one accepts the non-classical logic required to sustain it.
