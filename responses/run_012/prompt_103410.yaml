      *   *Problem:* When many agents can independently initiate a project, the probability that *at least one* does so increases with the number of agents, even if the expected utility is negative. The decision is made by the most optimistic agent, not the average.
      *   *Solution (Standard):* Conformity, consensus, or pooling judgments.
