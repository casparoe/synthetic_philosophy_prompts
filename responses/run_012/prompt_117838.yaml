answer: |-
  There is no single established term in social psychology, sociology, or epistemology that captures the specific constellation of features you describe: sincerity, the transformation of fact into loyalty, and the rapid dissolution of belief upon the dissolution of the collective.

  While the phenomenon is well-documented in anecdote and historical analysis (including the French political philosophy you allude to), the existing vocabulary describes adjacent mechanisms but misses the core ontological status of the belief itself.

  Here is an analysis of why the nearby notions fail, followed by a proposed term and definition.

  ### Why Existing Concepts Fail

  **1. Groupthink (Irving Janis)**
  *   **The Notion:** A psychological drive for consensus within a cohesive group overrides realistic appraisal of alternatives.
  *   **Why it fails:** Groupthink is primarily a theory of *decision-making pathology*, not belief formation. It explains why a group makes a bad *choice* (e.g., launching a failed invasion), not why members sincerely perceive a specific *fact* differently (e.g., "this tactic worked"). Crucially, Groupthink does not account for the *reversibility* you observed. In Groupthink, members often double down after failure due to sunk-cost fallacy; they do not typically wake up weeks later wondering what they were thinking.

  **2. Motivated Reasoning (Psychology)**
  *   **The Notion:** Individuals process information to arrive at a preferred conclusion, often unconsciously.
  *   **Why it fails:** This is an *individualistic* cognitive model. It assumes the desire precedes the reasoning. In your description, the "desire" (loyalty) and the "reasoning" (facts) are co-constituted by the social environment. Motivated reasoning implies the believer is doing the work internally; your observation suggests the "work" is being done *between* them, externally, in the social space.

  **3. False Consciousness (Marxist Theory)**
  *   **The Notion:** Holding beliefs contrary to one's material interest due to ideological conditioning by a ruling class.
  *   **Why it fails:** False consciousness implies a deep, structural, and long-term ideological conditioning (e.g., capitalism, patriarchy). It is not designed to explain rapid, reversible shifts in a small voluntary association. Furthermore, false consciousness usually implies the believer is "wrong" about their *interests*; your group members were "wrong" about *evidence* and *tactics*, which is an epistemic error, not necessarily an ideological one.

  **4. Adaptive Preference (Jon Elster / Martha Nussbaum)**
  *   **The Notion:** Scaling down one's desires to match what is possible (the "sour grapes" mechanism).
  *   **Why it fails:** This applies to *preferences* and *values* (what I want), not *beliefs* about reality (what is true). You can adapt to wanting less money; you cannot "adapt" to believing a tactic worked when it objectively failed, unless the mechanism of truth-validation has changed.

  **5. Epistemic Closure (Political Science)**
  *   **The Notion:** A state where a group is insulated from outside information or viewpoints.
  *   **Why it fails:** Closure describes the *boundary* of information flow, not the internal mechanism of validation. A group can be closed and still argue rigorously about facts internally. Your group was not just closed; it had repurposed the *function* of fact-claiming from "describing reality" to "signaling membership."

  ### The Proposed Concept: Epistemic Tenancy

  Since no existing term captures the *sincere*, *socially-hosted*, and *reversible* nature of this belief state, I propose the term **Epistemic Tenancy**.

  **Definition:**
  **Epistemic Tenancy** is a state in which an individual's conviction regarding matters of fact is not internally owned but socially leased. The belief is sustained not by the individual's continuous engagement with evidence, but by the structural integrity of the collective that validates it. When the collective dissolves or the individual exits, the "lease" is terminated, and the belief is evicted, often leaving the individual with no memory of having genuinely held it.

  **Three Criteria for Epistemic Tenancy:**
  1.  **Sincerity:** The holder is not lying or coerced. At the time of holding, the belief feels as authentic as any other.
  2.  **Relational Validation:** The truth-value of a claim is determined by its social utility (cohesion, loyalty, morale) rather than its correspondence to external reality. Evidence is treated as a rhetorical resource for the group, not a constraint on the group.
  3.  **Structural Dependence:** The belief cannot survive the removal of the social structure. It does not migrate with the individual.

  ### Marking the Edges

  **What Resembles It But Is Not (False Positives):**
  *   **Brainwashing/Coercive Control:** In brainwashing, the belief is often implanted through trauma, isolation, or fatigue and may persist after exit (trauma bonding). Epistemic Tenancy requires no coercion; it arises from voluntary cooperation.
  *   **Professional Deference:** A junior researcher accepting a senior's result is relying on expertise, not social cohesion. If the lab closes, the junior researcher should still believe the data *if* the data was sound. In Epistemic Tenancy, the belief vanishes because the *social validation* vanishes, not because new data emerged.
  *   **Faith/Religion:** Religious belief is often designed to persist *despite* the absence of a community (e.g., solitary prayer, martyrdom). Epistemic Tenancy collapses without the community.
  *   **Pluralistic Ignorance:** This requires private doubt ("I don't believe it, but I think everyone else does"). In Epistemic Tenancy, there is no private doubt; the doubt itself has been rendered unintelligible.

  **What Counts As An Instance Without Formal Organisation (True Positives):**
  *   **Dyadic Enmeshment:** A couple develops a shared narrative about a friend ("He is toxic") that neither would sustain alone. If they break up, both often rapidly revise their view of the friend. The belief belonged to the *relationship*, not the partners.
  *   **Digital Micro-Communities:** A subreddit or Discord channel rallies around a specific interpretation of a news event. When the channel is banned or the drama fades, members return to mainstream interpretations within days, unable to recall why the alternative facts seemed compelling.
  *   **Crisis Response Teams:** Ad-hoc groups formed during emergencies often develop a "command reality" (e.g., "We are sure the building is clear") that allows them to function. Once the crisis ends, members realize they didn't actually know that for a fact; they needed to believe it to act.

  ### Summary
  The mechanism you isolated is the **socialization of epistemic authority** to the point where the individual mind becomes a terminal for the group's reality. **Epistemic Tenancy** distinguishes this from hypocrisy (it is sincere) and ideology (it is reversible). It identifies the belief not as a mental object, but as a social contract.
