      *   *Does it change implications?* For the friend's argument: If measurement cost energy, the friend is definitely wrong. If only erasure costs, the friend *thinks* he's right, but fails because of the finite storage/entropy of the tape. So the distinction matters for *where* the cost is accounted, but not for the *final result* (2nd Law stands).
