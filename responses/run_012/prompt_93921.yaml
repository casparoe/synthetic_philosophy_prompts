          *   *Conclusion:* The friend is wrong about beating the 2nd Law in a closed system. The entropy is just pushed into the tape. A computer cannot run forever on a sealed battery doing useful work because the physical state of the memory must change, and eventually, you run out of low-entropy memory states (even if the tape is long, it's finite in reality, or if infinite, the *preparation* of the blank tape cost the entropy elsewhere).
