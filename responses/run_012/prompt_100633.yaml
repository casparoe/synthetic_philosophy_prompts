          1.  **Intent (Case 4 vs 5):** The principle cares about *who made it*, not *why*. You have to admit the painting is the same; your anger in #5 is moral, not about the art's status.
          2.  **Experience (Case 3):** You have to accept that "value" isn't just "what I see." It's about the object's biography.
