answer: |-
  This is a classic set of problems in the philosophy of art. You have basically reinvented the puzzles posed by Nelson Goodman in his book *Languages of Art* (1968) and Walter Benjamin in *The Work of Art in the Age of Mechanical Reproduction*.

  Your gut feelings are consistent with how most people feel, but your "half-baked guess" (Intent to Deceive) is indeed too weak. It explains why we get mad, but not why the *object* changes value.

  Here is the simplest, most robust principle that fits your data, followed by the honest truth about what you have to sacrifice to keep it.

  ### The Principle: "The History of Production Matters"
  **(Also known as Goodman's "Autographic" Arts)**

  The rule is: **For physical art (paintings, sculptures), the value is not just in what the object looks like, but in the specific history of how it came into existence.**

  *   **Autographic Arts:** Arts where the history of production is essential to the work's identity (Painting, Sculpture). A forgery here is defective *even if indistinguishable*, because it has the wrong history.
  *   **Allographic Arts:** Arts where the history of production does not matter, only the structure/notation (Music, Literature, Digital Files). A copy here is equal to the original.

  ### How this principle handles your cases:

  *   **Case 1 (Aunt's Print):** **Fine.** It is sold as a print. Its history is "made by museum shop." No lie about history.
  *   **Case 2 (The Forger):** **Bad.** The painting claims a history ("painted by Vermeer in 1660") that is false. The aesthetic experience is the same, but the *artistic identity* is a lie.
  *   **Case 3 (The Swap):** **Bad.** Even if undetected, the object in the frame now has a history of "made by Forger in 2024," not "made by Master in 1660." The museum owns a different *ontological* object, even if it looks the same.
  *   **Case 4 & 5 (Student Workshop):** **Same Object.** This is where the principle gets strict. Whether the student *meant* to trick you (Case 5) or everyone just *assumed* it was the Master (Case 4), the **history of production is identical**: "Painted by Student." The principle says the *art status* is the same in both cases.
  *   **Case 6 (Restoration):** **Compromised.** The history of production has been physically interrupted. If 80% is new paint, the causal chain from the original artist's hand is broken.
  *   **Case 7 (Digital):** **Fine.** Digital art is *Allographic*. The "work" is the code/file structure, not the specific hard drive it sits on. There is no "history of production" attached to the specific pixels on your screen.
  *   **Case 8 (Assistant):** **Weird but Valid.** The history is "Designed by Master, Executed by Assistant." This is a true history, unlike the Forger. That's why it feels better than Case 2.
  *   **Case 9 (AI):** **Forgery-Adjacent.** If the AI presents the work as "Human Expression," it is lying about the history of production. If it presents it as "AI Generation," it is a new category. If you feel "off," it's because it mimics the *look* of Autographic art without the *history* of human creation.

  ### The Sacrifice: Which gut feeling must you give up?

  To keep this principle simple and powerful, you have to sacrifice the distinction between **Case 4 (Honest Mistake)** and **Case 5 (Deceptive Student).**

  **Your Gut:** In Case 4 you feel "less excited." In Case 5 you feel "tricked and mad." You treat them as different situations.
  **The Principle:** The painting in Case 4 and Case 5 is **ontologically identical.** It was made by the same hand, at the same time, with the same materials.
  **The Sacrifice:** You must admit that your anger in Case 5 is **moral**, not **aesthetic**. The *painting* hasn't changed status between 4 and 5; only the *context of the sale* has. If you want a simple rule, you have to say: "Once we know it's by the student, its status as art is fixed. Whether the student lied about it is a crime, but it doesn't change the painting's nature further."

  *Why make this sacrifice?* Because if you keep "Intent to Deceive" as part of the rule, you can't explain Case 3 (The Swap). In Case 3, if nobody knows, there is no deception of the public, yet you still feel the museum was robbed. The "History of Production" rule explains Case 3 perfectly, but it requires you to treat Case 4 and 5 as the same *artistic* event.

  ### The New Case: The "Agreed Upon" Forgery
  *Case: A perfect forgery of a lost painting that everybody just AGREES to treat as the real one forever.*

  **What the Principle Says:** It is still a fake.
  **Why:** Because the "History of Production" is an objective fact, not a social agreement. Even if the entire world agrees to call it a Vermeer, the physical reality is that Vermeer never touched it.
  **The Tension:** This creates a conflict between **Essentialism** (what the object *is*) and **Institutional Theory** (what the artworld *says* it is).
  **My Advice:** For your paper, stick to the Essentialist view (History of Production). It is philosophically cleaner. You can argue that the world is *choosing* to value the copy *as if* it were the original (like a memorial), but that doesn't make it the original. It becomes a "functional original," but not an "ontological original."

  ### Summary for your Paper
  1.  **Rule:** Art value in physical media depends on the **History of Production** (Autographic), not just visual experience. Digital media is different (Allographic).
  2.  **Why we care:** We care about originals because art is a form of **human communication**. Knowing the history tells us *who* communicated *what* to us. A forgery is a lie in that conversation.
  3.  **The Cost:** You must separate **Moral Wrong** (lying about the art) from **Artistic Status** (what the art *is*). Case 4 and Case 5 are the same art; the difference is just ethics.

  This gives you a clean, defensible thesis that handles the Digital exception (Case 7) and the Museum Swap (Case 3) without needing a complicated list of exceptions.
