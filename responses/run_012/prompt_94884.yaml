answer: |-
  Dear Colleague,

  I have been thinking deeply about your thesis regarding the incoherence of low-impact AI, and I must say that the trilemma you have constructed is formidable. It captures the central tension in the field between the desire for value-neutral safety constraints and the inevitable entanglement of any metric with some notion of what matters. You argue that any impact measure must be trivial, a hidden utility function, or arbitrarily baseline-dependent, and you further worry about the butterfly effect rendering any causal cutoff value-laden. To answer your request, I have tried to identify what would genuinely count against this thesis, sorting these potential defeaters by how decisive they would be in undermining your claim of incoherence. I have focused on what a proponent of low-impact AI would need to demonstrate to show that their project is viable, and what you should accept as evidence that your trilemma is not exhaustive.

  The most decisive evidence against your thesis would be a formal existence proof of an impact measure that satisfies non-triviality, value-neutrality, and baseline-robustness within a well-defined mathematical framework. Since your thesis claims conceptual incoherence, it is essentially a claim about the impossibility of constructing such a function. Therefore, the construction of even one such function in a simplified environment would serve as a direct counterexample to the claim of incoherence. Specifically, if a researcher could define a measure based on something like state reachability or attainable utility preservation and prove formally that this measure does not implicitly rank world-states according to human preferences but rather according to a structural property of the environment, such as the size of the reachable state space, this would strike at the heart of your second horn. Your argument assumes that ranking differences between world-states is equivalent to ranking them by value, but if impact can be defined as the reduction of future options regardless of what those options are used for, then the measure is tracking power or capacity rather than goodness. A formal result showing that penalizing the reduction of attainable utility for a wide range of random reward functions prevents side effects without optimizing for any specific reward function would demonstrate that the measure is not a utility function in disguise. This would show that your second horn is not exhaustive because there is a category of measures that track instrumental convergence rather than terminal values.

  Somewhat less decisive but still critical would be a successful philosophical argument that the baseline problem is not a problem about values but a general problem about counterfactuals and causal inference. You argue that choosing a baseline, such as inaction or a default policy, encodes a judgment about what the agent was entitled to do. However, a defender of low-impact AI could argue that the baseline is analogous to a reference frame in physics. Choosing a coordinate system does not encode a value judgment about where an object should be, it is merely a technical necessity for measuring change. If the baseline is derived from the causal structure of the environment—for instance, defining the baseline as the trajectory the world would take if the agent's actions were nullified at the physical level rather than the policy level—then the choice is grounded in physics rather than normativity. If it can be shown that the choice of baseline is determined by the causal graph of the environment and not by human preferences, then the third horn of your trilemma loses its force. This would not prove that low-impact AI is easy, but it would prove that it is not incoherent due to value-laden baselines. The key evidence here would be a demonstration that different agents using the same causal baseline agree on what constitutes an impact, even if they have different goals, suggesting the baseline is objective rather than normative.

  A third line of defeaters would be empirical engineering developments, specifically a working low-impact agent that passes a battery of side-effect tests without a hand-specified utility function. You ask whether this would count against the thesis, and I believe it would, provided the success cannot be redescribed as the agent having hidden values. If an agent is tasked with moving a box from A to B and successfully does so without breaking a vase that was never mentioned in its reward function or constraints, and this behavior generalizes to new environments with new fragile objects, this suggests the agent has learned a concept of impact that is decoupled from specific object values. For this to count against your thesis, the agent must not be using a model of human preferences to infer that vases are valuable. Instead, it must be using a heuristic like minimizing change to the environment's state distribution or minimizing energy expenditure beyond what is required for the task. If such a system is built and verified, it shifts the burden of proof back to you to explain where the hidden values are. If the only response is to claim that any successful avoidance of side effects implies the agent must have implicitly valued the intact vase, then your thesis risks becoming unfalsifiable. A defender of low-impact AI would concede that if every success is dismissed as hidden utility, the theory protects itself from refutation at the cost of explanatory power. Therefore, a clear case where an agent avoids a side effect that provides no instrumental benefit to its goal and was not pre-programmed to avoid would be strong empirical evidence against the incoherence claim.

  Regarding the butterfly-effect worry, what would count against your thesis is a demonstration that temporal or causal discounting can be justified without value judgments. You argue that drawing a line in time or causal distance is arbitrary and thus value-laden. However, if it can be shown that the sensitivity of impact measures to distant consequences decays naturally due to environmental entropy or chaos, then the cutoff is not arbitrary but dictated by the physics of the system. If a measure is designed to be robust to small perturbations that wash out over time, then ignoring the butterfly effect is not a value judgment but a recognition of causal insignificance. A formal result showing that impact measures converge to a stable value regardless of the time horizon, provided it exceeds a certain threshold determined by the environment's Lyapunov time, would undermine the claim that the cutoff is arbitrary. This would show that the butterfly effect is a technical manageable issue rather than a conceptual blocker.

  You also ask whether the thesis is a conceptual truth or an empirical generalization. If it is conceptual, as your use of the word incoherent suggests, then a single counterexample in a formal model is sufficient to disconfirm it. If it is empirical, then we need robust performance across diverse real-world domains. I suspect your thesis sits somewhere between the two, claiming that the conceptual structure of impact measurement inevitably collapses into value judgments. To falsify this, one does not need a perfect real-world system, but one does need a coherent mathematical model where the collapse does not occur. The most persuasive thing you could encounter is a paper that defines impact purely in terms of information theory or thermodynamics, showing that minimizing impact is equivalent to minimizing entropy production or information divergence from a natural prior, and proves that this does not require ranking states by human preference. If impact is simply friction, then avoiding it is not a moral choice but a physical efficiency constraint.

  Finally, I must address the risk of unfalsifiability. You ask what would show that the thesis is unfalsifiable because any measure can be redescribed as encoding values. This is a genuine risk for your position. If you define value function so broadly that any preference for one trajectory over another counts as a value function, then your claim that impact measures are utility functions in disguise becomes tautological. What would count against this is a clear distinction between instrumental preferences and terminal values. If a low-impact measure can be shown to prefer trajectories that leave more options open for any possible future agent, regardless of their values, then it is value-agnostic in a meaningful sense. A defender of low-impact AI would concede that if their measure favors one specific conception of the good life, they have failed. But if their measure favors capacity itself, they have not. Therefore, evidence that a measure preserves capacity without preserving specific outcomes would count against your thesis.

  In summary, the most decisive defeater would be a formal proof of a non-trivial, value-neutral impact measure in a simplified model. Following that, a robust philosophical argument that baselines are causal rather than normative would weaken your third horn. Empirical success that cannot be explained by hidden reward hacking would challenge the practical implication of your thesis. And finally, if your thesis cannot specify what evidence would change your mind, it ceases to be a scientific claim and becomes a philosophical stance. I hope this helps you stress-test your position. It is a strong thesis, but it is not immune to counterexample, particularly from the direction of formal safety research that defines impact in terms of power and options rather than states and preferences.

  Best regards,

  Your Colleague
