answer: |-
  You press me upon a point of considerable consequence, and I must acknowledge that the distinction you seek is not merely one of accounting, but of principle. The Navigation Acts, I have conceded, are perhaps the wisest of all the commercial regulations of England, because they aim at defence, which is far more important than opulence. Yet observe the limit of that concession: those acts impose a burden upon industry to secure the nation, whereas the exclusive trade with the colonies imposes a burden upon industry to secure the profits of a particular order of men. The defence of the realm justifies a tax upon the public for the public safety; it does not justify a scheme that forces the capital of the kingdom into channels where it yields less return, simply to swell the revenues of merchants who would otherwise be undersold. The empire you defend is not the shield of defence, but the engine of monopoly. One protects the body politick from foreign violence; the other wounds it from within by diverting its stock from natural and advantageous employments to support a dominion that costs more than it yields.

  As to your suspicion regarding my hope for future trade, you mistake my meaning if you suppose I rely upon affection alone. I rely upon the natural course of things when the artificial causes of jealousy are removed. The animosity you cite arises precisely from the restraint; it is the jealousy of a master towards a servant, or a parent towards a child whom he seeks to bind in perpetuity. If Britain were to release her colonies from the oppression of exclusive trade, she would remove the chief ground of quarrel. Trade follows advantage, and so long as Britain remains the great market for manufacture, the colonies will likely resort thither without compulsion. But even if they did not, the principle remains: it is unjust to govern provinces for the sole benefit of the governing country without admitting them to a share in the representation. Since such representation is impracticable at such a distance, the only honourable course is separation. My argument is not merely a wager that the enterprise does not pay; it is a conviction that a system founded upon injustice and maintained by force is incompatible with the liberty and prosperity of a free people.
