      *   **Second Wrinkle:** Distinguish between *Creation* (starting a life) and *Continuation* (keeping a life going). Do they rely on the same principles?
      *   **Requirements:** Precise research question, gap analysis (why existing views don't settle it), methodology (12-month plan), success/failure conditions, honesty about scope (too big?).
