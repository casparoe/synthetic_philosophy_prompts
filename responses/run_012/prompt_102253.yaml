answer: |-
  Here is a draft of the proposal, written to fit standard fellowship formatting (approx. 1,000–1,200 words, which typically fills two single-spaced pages with standard margins). Following the draft, I have included a section of **Advisor Notes** regarding the scope and feasibility, as you requested.

  ***

  **Project Title:** The Fractured Asymmetry: Decoupling Axiological and Deontic Grounds in Procreative Ethics

  **Project Summary**
  The procreation asymmetry—the intuition that we have strong reasons not to create miserable lives but no corresponding reasons to create happy ones—remains one of the most stubborn problems in population ethics. Current defenses of the asymmetry generally attempt to derive both horns from a single normative source, whether person-affecting restrictions, impersonal value, or conditional obligations. This project argues that these unified accounts fail because the asymmetry is not a single phenomenon. It is a conflation of two independent claims: an axiological claim about the impersonal badness of suffering and a deontic claim about the impermissibility of imposing existence without consent. By decoupling these grounds and testing them against a neglected distinction between *creation* (starting a life) and *continuation* (sustaining an existing life), this project will demonstrate that the asymmetry fractures under pressure. The outcome will be a rigorous map of where procreative duties actually originate, replacing a stalled debate over a unified principle with a pluralistic account of procreative value.

  **Statement of the Research Question**
  The central question of this project is: *Can the procreation asymmetry be grounded in a single normative principle, or is it merely the coincidental conjunction of independent axiological and deontic claims?*

  To answer this, the project must resolve two sub-questions:
  1.  **The Grounding Question:** Do the two horns of the asymmetry (the badness of creating suffering vs. the non-goodness of creating happiness) rely on the same type of normative reason?
  2.  **The Continuity Question:** Does the same principle that governs *creating* a life with suffering also govern *continuing* a life with suffering?

  A successful answer will provide a taxonomy of procreative reasons that explains why the asymmetry feels intuitive without requiring a unified metaphysical grounding. It will specify precisely which horn of the asymmetry survives if we remove impersonal value claims, and which survives if we remove agent-relative constraints.

  **State of the Art and Gap Analysis**
  Existing literature generally falls into three camps, all of which assume the asymmetry requires a unified explanation.
  *   **Person-Affecting Views:** These argue that creating a miserable person harms *that* person, while creating a happy person benefits no one (since there is no prior subject). However, these views struggle to explain why the harm is significant enough to forbid creation while the lack of benefit is not significant enough to forbid non-creation, without smuggling in impersonal premises.
  *   **Impersonal/Axiological Views:** These argue that suffering is impersonally bad. Yet, they fail to explain why we are not equally obligated to prevent impersonal badness by creating happy people to "outweigh" the suffering, unless they quietly rely on deontic constraints.
  *   **Hybrid/Conditional Views:** Recent attempts to combine these approaches often result in *ad hoc* restrictions. They attempt to squeeze deontic conclusions (permissions/obligations) out of axiological premises (value states), which is where the logical cracks appear.

  The gap this project addresses is the failure to distinguish the *type* of reason operating in each horn. No current account systematically tests whether the "bad to create suffering" horn relies on impersonal value while the "not good to create happiness" horn relies on agent-relative permissions. Furthermore, the literature treats procreation as a monolithic event. By distinguishing *creation* from *continuation*, this project introduces a stress test that existing unified theories cannot pass. If a unified principle covers creation but fails continuation (or vice versa), the claim to unity is false.

  **Methodology and Work Plan**
  This is a conceptual analysis project utilizing a method of "normative isolation." I will construct cases where axiological and deontic variables are manipulated independently to see which intuitions hold.

  *   **Months 1–3: Reconstruction and Critique.**
      *   Systematize the leading unified accounts of the asymmetry (e.g., Benatar, Parfit, Frick).
      *   Formalize the distinction between the Axiological Claim (suffering is bad *simpliciter*) and the Deontic Claim (imposition requires consent/justification).
      *   *Deliverable:* Annotated bibliography and a 10-page critique of unified accounts.

  *   **Months 4–6: The Creation/Continuation Stress Test.**
      *   Develop case pairs: (A) Creating a child with a chronic condition vs. (B) Keeping an existing child with that condition alive.
      *   Analyze whether the moral intuition shifts between A and B. If the principle is unified, the verdict should remain stable. If the verdict flips, it suggests different principles are at work.
      *   *Deliverable:* Draft of the core argument section (approx. 15 pages).

  *   **Months 7–9: Testing the Split.**
      *   Argue for the "Fractured Asymmetry" thesis: The "bad to create suffering" horn is axiological; the "not good to create happiness" horn is deontic.
      *   Address counterarguments: specifically, that the distinction is merely semantic or that one ground reduces to the other.
      *   *Deliverable:* Full first draft of the paper.

  *   **Months 10–12: Revision and Dissemination.**
      *   Refine arguments based on feedback from supervisors and peer reading groups.
      *   Submit to a top-tier journal in ethics or population philosophy.
      *   Present findings at one graduate conference.
      *   *Deliverable:* Final manuscript ready for submission.

  **Success and Failure Conditions**
  *   **Success:** The project successfully demonstrates that unified accounts entail contradictions when applied to continuation cases. It produces a stable pluralistic account where the two horns of the asymmetry are grounded in distinct normative categories.
  *   **Failure (Negative Result):** It turns out that the Axiological and Deontic claims cannot be separated—that is, every attempt to isolate one inevitably invokes the other. While this would falsify my hypothesis, it would still be a valuable philosophical result, proving that a unified theory is necessary and narrowing the search space for future work.
  *   **Failure (Scope):** The Creation/Continuation distinction proves to be morally irrelevant (i.e., intuitions do not shift). In this case, the project will pivot to focus exclusively on the Axiological/Deontic split without the continuation variable.

  **Feasibility and Scope**
  This project is designed for a 12-month fellowship. It does not require empirical data or complex modeling, only rigorous conceptual analysis. The scope is limited to the *grounding* of the asymmetry, not a full defense of a specific population ethic. By focusing on the *structure* of the argument rather than solving population ethics broadly, the project remains tractable within the timeframe.

  ***

  ### Advisor Notes (Read Before Submitting)

  You asked for honesty about whether this is too big for a year. Here is the assessment:

  **1. Is it too big?**
  Yes, strictly speaking. The "Creation vs. Continuation" wrinkle is essentially a second paper.
  *   **The Risk:** You might spend 6 months proving the Axiological/Deontic split, only to find the Creation/Continuation distinction muddies the waters without adding decisive leverage. Reviewers might worry you are trying to solve the Non-Identity Problem *and* the Asymmetry *and* End-of-Life Ethics all at once.
  *   **The Fix:** In the proposal above, I framed "Continuation" as a *stress test* for the main hypothesis, not a second hypothesis. This keeps it methodologically subordinate. If you get stuck, drop the Continuation section (Months 4–6) and focus entirely on the Axiological/Deontic decoupling. That is a solid, publishable paper on its own.

  **2. The "Failure" Section**
  I wrote the failure conditions carefully. In philosophy, proving your hunch *wrong* is still a result. However, fellowship committees want to fund success. I phrased the "Negative Result" as "narrowing the search space," which sounds productive. Keep that framing.

  **3. The "Gap"**
  I deliberately avoided citations as you requested, but I namedropped the *types* of views (Person-Affecting, Impersonal, Hybrid). When you fill in the citations, ensure you aren't setting up strawmen. The strongest objection to your view will be: "Of course they are distinct, but they correlate perfectly in the procreation case, so a unified theory captures that correlation." You need to be ready to explain why a "conjunction of independent claims" is better than a "unified theory that explains the correlation." (Hint: Parsimony vs. Accuracy).

  **4. Shrinking the Project**
  If you feel overwhelmed, cut the "Continuation" aspect entirely. Focus solely on: *Defenders of the asymmetry conflate reasons of value with reasons of rights.* That is a complete argument without needing to compare creating lives to sustaining them. The Continuation point is a "force multiplier" for the argument, but the argument stands without it. If you need to shrink it, make that cut.
