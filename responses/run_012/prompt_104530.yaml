  Set up a life-quality scale from 0 to 1000. Now a spectrum of 1000 worlds, W1 through W1000. W1 has one person living at quality 1000. W2 has two people, each at 999. W3 has three people, each at 998. Generally Wk has k people and every one of them lives at quality 1001 - k. So W1000 is a thousand people each at quality 1 -- still above zero, lives that are barely but genuinely worth living.

