      *   *Self-Correction during drafting:* I need to make sure I don't just describe the UK system but analyze the *theory of authority* behind it. The prompt asks for the *presupposed theory*.
      *   *Key Insight:* The system relies on a "fiction" (the King rules) to mask the reality (the People/Parliament rule), but the fiction retains a "reserve" truth (the King *could* act if the system breaks). This is the latency.

  5.  **Final Review:** Does the distinction between "strict presuppositions" and "accommodations" hold up?
      *   *Presupposition:* The head of state must be distinct from the head of government to ensure neutrality.
      *   *Accommodation:* That head of state happens to be hereditary. (Could be elected).
      *   *Presupposition:* Acts require countersignature (accountability).
      *   *Accommodation:* The specific content of the advice.

