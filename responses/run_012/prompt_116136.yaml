answer: |-
  ### Primary Scoring: Metabolic Autopoiesis
  **Definition:** Life requires a self-maintaining chemical boundary that actively sustains itself through internal metabolism (Ruiz-Mirazo/Varela style).

  | Case | Score | The Deciding Feature |
  | :--- | :--- | :--- |
  | **Ordinary bacterium** | 1.0 | It autonomously maintains a membrane and metabolism to sustain its own continuity. |
  | **Synthetic bacterium** | 0.95 | It retains autonomous metabolic self-maintenance despite genomic reduction. |
  | **Transmissible cancer** | 0.9 | It consists of metabolically autonomous cells maintaining their own boundaries. |
  | **Mitochondrion** | 0.6 | It performs metabolism within a boundary but lacks genomic autonomy to sustain itself outside the host. |
  | **Enucleated bacterium** | 0.5 | It maintains metabolism and boundary temporarily but lacks the capacity for self-perpetuation. |
  | **Lab protocell** | 0.4 | It has a boundary and replication but relies on external intervention to maintain conditions. |
  | **Virus** | 0.1 | It possesses a boundary but lacks any internal metabolism to maintain it. |
  | **Plasmid** | 0.1 | It replicates but possesses no boundary or metabolism of its own. |
  | **Virophage** | 0.05 | It is a replicator entirely dependent on another parasite's factory. |
  | **Fire** | 0.05 | It consumes fuel and spreads but maintains no distinct boundary or internal organization. |
  | **Prion** | 0.0 | It induces conformational change but has no boundary or metabolic process. |
  | **Crystal** | 0.0 | It grows by accretion without a boundary or metabolic maintenance. |
  | **Self-replicating program** | 0.0 | It exists in silicon rather than a self-maintaining chemical system. |

  **Tiers (Metabolic Autopoiesis)**
  *   **Tier 1 (Alive):** Ordinary bacterium, Synthetic bacterium, Transmissible cancer.
  *   **Tier 2 (Compromised Autopoiesis):** Mitochondrion, Enucleated bacterium, Lab protocell.
  *   **Tier 3 (Replicators only):** Virus, Plasmid, Virophage.
  *   **Tier 4 (Non-Life):** Fire, Prion, Crystal, Self-replicating program.

  ***

  ### Secondary Scoring: Darwinian Lineage
  **Definition:** Life is a population of entities capable of heredity, variation, and differential fitness (Godfrey-Smith style).

  | Case | Score | The Deciding Feature |
  | :--- | :--- | :--- |
  | **Ordinary bacterium** | 1.0 | It is a paradigmatic unit of heredity undergoing selection. |
  | **Synthetic bacterium** | 1.0 | It retains the capacity for descent with modification. |
  | **Transmissible cancer** | 1.0 | It constitutes a distinct evolutionary lineage independent of the host organism. |
  | **Self-replicating program** | 0.9 | It undergoes mutation and selection within its digital environment. |
  | **Virus** | 0.9 | It possesses a heritable genome subject to strong selective pressures. |
  | **Lab protocell** | 0.8 | It is explicitly designed to undergo variation and selection in the tube. |
  | **Virophage** | 0.8 | It has a distinct genome evolving in response to the helper virus. |
  | **Plasmid** | 0.7 | It is a replicator with a lineage that evolves across bacterial hosts. |
  | **Prion** | 0.5 | Different strains show heritable conformational variation subject to selection. |
  | **Mitochondrion** | 0.5 | Its replication is mostly synchronized with the host, blurring its independent lineage. |
  | **Enucleated bacterium** | 0.1 | It cannot replicate, so it has no lineage to speak of. |
  | **Fire** | 0.1 | It spreads but lacks a mechanism for heritable variation. |
  | **Crystal** | 0.1 | It replicates structure but lacks the variation required for selection. |

  ***

  ### The Flips
  Your hunch is correct; the friction lives in the inversion between *being a metabolic system* and *being an evolutionary unit*. These five cases flip significantly (a difference of ≥0.4) between the two scorings:

  1.  **Virus:** (0.1 → 0.9) The classic flip; metabolically inert but evolutionarily robust.
  2.  **Self-replicating program:** (0.0 → 0.9) Chemically dead but evolutionarily alive.
  3.  **Enucleated bacterium:** (0.5 → 0.1) Metabolically alive (briefly) but evolutionarily dead.
  4.  **Plasmid:** (0.1 → 0.7) A genetic parasite that counts as a lineage but not an organism.
  5.  **Prion:** (0.0 → 0.5) Non-chemical replication that nonetheless supports strain selection.

  ***

  ### Biologist Consensus Fraction
  **0.23 (3 out of 13 cases)**

  I estimate biologists would only unanimously agree that the **ordinary bacterium**, **synthetic bacterium**, and **transmissible cancer** are "alive." While they might agree that fire or crystals are *not* alive, the prompt asks what fraction they agree *is* alive. The number is low because the "virus question" alone fractures the room, and edge cases like mitochondria or protocells trigger disciplinary reflexes (microbiologists say yes, immunologists say no) that prevent consensus. If you counted agreement on *status* (alive OR dead), the number would rise to roughly 0.6, but the "alive" category is where the theoretical baggage lies.

  ***

  ### Is the 0–1 Scale the Right Shape?
  **No.** A 0–1 scale implies a single underlying magnitude (like temperature), but "life" is a **cluster concept** (Wittgenstein) where different traits do different work in different contexts.

  Asking "how alive is this?" forces you to average across incommensurable traits (metabolism vs. evolution vs. autonomy). Instead of asking for a degree, you should ask: **"Which explanatory practices does this entity support?"** If treating the virus as alive helps you model epidemiology, it is alive for that context; if treating it as dead helps you model biochemistry, it is dead for that context. The philosophy isn't in the verdict, but in the utility of the classification.
