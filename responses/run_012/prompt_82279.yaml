      *   The view is *Mereological Nihilism* (or Composition Nihilism).
      *   The specific argument relies on *Parity of Reasoning*: If we deny existence to the sand pile (because it's vague/arbitrary), we should deny it to the cat (for similar reasons).
      *   The "fusion/growth" criterion is a specific version of *Universalism* vs. *Restrictivism*. He's arguing for a very strict restrictivism that collapses into nihilism.
