  My roommate keeps leaning on an analogy he got from some podcast and I can't tell if it's actually doing work or just sounds good. His line is: a cat is nothing over and above a bunch of atoms arranged like a cat, and that's exactly like a pile of sand being nothing over and above a bunch of grains. Since nobody thinks the sand pile is some real extra object on top of the grains, he says, the cat isn't a real extra object on top of the atoms either -- so there's no cats, no tables, just particles. His test for being one thing is that the parts have to be fused or grown together; a pile of sand fails that, and so does a cat, because the cells are basically just sitting next to each other. I'm pretty sure somethings off but I cant pin it down. Can you actually lay the analogy out for me -- a correspondence table of what maps onto what between the sand pile and the cat -- and then go through where the mapping breaks? I want to know which of the differences actually matter for his conclusion (that composites never exist) versus which are beside the point, and whether his conclusion even survives once the breaks are on the table. Also, is he smuggling anything in just by picking the sand pile as his example, and is there a better analogy for what he's really trying to say?
