  My flatmate Dmitri and I have been going back and forth about this since a seminar on chance and credence last week, and we're both stuck, so I'm outsourcing it. The setup is as boring as possible: a radioactive source in a sealed box. At t0 I read off its complete microphysical state S, and given S the objective chance of the detector clicking in the next minute is 0.4. Dmitri's argument runs like this. (1) The principal principle says that a rational agent's credence in an event E, conditional on the proposition that the chance of E is p, is p -- with the usual proviso that the condition be "admissible," i.e. carry no information about E over and above the chance. (2) The chance of E is by construction the complete summary of everything that bears on whether E happens; if you knew the chance and nothing else about E you'd know all there is to know about E's prospects, so any evidence of yours that entails the chance proposition is, for these purposes, no better than the chance proposition itself. (3) I know S, and S fixes the chance of a click at 0.4, so my evidence entails "the chance of a click is 0.4." (4) Hence my credence in the click, given everything I know, is 0.4. (5) And by (2) that can't change: the chance already summarised everything relevant, so it's a fixed point -- no later evidence can move me off 0.4, not even watching the needle jump. He also brushes aside the admissibility proviso as boilerplate, on the grounds that the chance proposition trivially satisfies it, since the chance just is the best possible summary of what bears on E.

  The conclusion is obviously nuts and I'd rather not give up the principal principle or the idea that chances are objective and sometimes knowable, but I genuinely can't find the bad move -- each step looks innocent on its own, and I can't tell whether the rot is in (2), in the move from (3) to (4), or in (5). So which step do you reject, and why did it look fine? And I want the price tag: if the honest fix is some restriction on how the principle get's applied -- to which condition, at which time, in whose evidence -- tell me what we lose by accepting that restriction, and whether there's a second, cheaper place to cut that I should weigh against it. I care alot more about knowing which bit of machinery is load-bearing than about rescuing his argument.

  Give me exactly five numbered points, a sentence or two each, no introduction and no wrap-up: the first names the step or steps you'd reject, the next three give the diagnosis and price the main alternative repairs, and the last says which repair you'd actually bet on and what it still leaves unexplained.
