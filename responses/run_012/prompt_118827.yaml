      *   **Task:** Evaluate how far this analogy holds.
      *   **Format Constraints:** Plain prose only. No tables, no headings, no bullet points, no bold text. Just sentences and paragraphs.
      *   **Specific Content Requirements:**
          *   Map the analogy (who/what plays the parent, child, love, sacrifice, years, other parent).
          *   Identify where it comes apart (does the demand end? is it shared? is the motive endorsable? is sacrifice part of the parent's good? is keeping something back allowed?).
          *   Evaluate the conclusion (does the demandingness worry evaporate?).
          *   Address the "individual vs. collective" and "unbounded vs. large" distinction the friend waves away.
          *   Suggest a better analogy if this one fails.

  2.  **Deconstruct the Analogy (Mapping):**
      *   *Parent:* The moral agent (the consequentialist).
      *   *Child:* The beneficiary of the moral action (the distant stranger/global poor).
      *   *Love:* The moral motivation (benevolence/utility maximization).
      *   *Sacrifice:* Money, time, career opportunities given up.
      *   *Years:* The duration of the commitment (lifetime vs. childhood).
      *   *Other Parent:* This is tricky. In a two-parent household, the load is shared. In morality, is it shared? Maybe other moral agents? Or is there no "other parent"?
      *   *Goal:* The child's flourishing vs. General Welfare.

  3.  **Analyze Where It Breaks Down (The "Quietly Brings With It" part):**
      *   *Termination:* Parenthood ends (kids grow up). Morality (on strict consequentialism) doesn't. There's always more suffering to relieve.
      *   *Shared Burden:* Parents often share the load with a partner. Consequentialism often isolates the agent ("*I* must give until *I* have nothing").
      *   *Motive:* Parental love is partial and emotional. Consequentialism demands impartiality. Can you love everyone like a child? Psychologically impossible.
      *   *Self-Interest:* Raising kids often brings meaning/joy to the parent (constitutive good). Giving money to strangers is often purely sacrificial without that deep personal meaning.
      *   *Permission to Keep Back:* Parents are allowed to have hobbies, sleep, lives. Strict consequentialism often implies you must keep giving until marginal utility is zero.
      *   *Impartiality:* The friend says "treat everyone's kid like your own." But parents treat their *own* kid specially. If you treat *everyone's* kid with that intensity, you burn out. If you treat *everyone's* kid with normal care, you aren't meeting the "parental sacrifice" standard.

  4.  **Evaluate the Conclusion:**
      *   Does the demandingness worry evaporate? Probably not. The analogy hides the *unbounded* nature of moral demand vs. the *bounded* nature of parental duty.
      *   The friend's move relies on the *admirability* of parents to justify the *obligatoriness* of morality. But we admire supererogatory acts (going above and beyond) differently than mandatory ones.

  5.  **Address the "Individual vs. Collective" and "Unbounded" points:**
      *   If everyone did their fair share, the burden would be light. But consequentialism often burdens the compliant agent regardless of non-compliance.
      *   Unbounded at every moment creates anxiety/exhaustion different from a large but finite task.

  6.  **Drafting the Response (adhering to constraints):**
