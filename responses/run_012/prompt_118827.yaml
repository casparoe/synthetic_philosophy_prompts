      *   *Correction:* Need to suggest a better analogy. Maybe a lifeguard? Or a firefighter? Or a collective tax system? A lifeguard is good because it has shifts (bounded time) and specific duty. Or perhaps a "community barn raising" to address the collective action problem. Let's go with the lifeguard or a shift-worker analogy to highlight the bounded nature. Actually, a "shift worker in a crisis" might be better to address the "unbounded" issue. Let's think of a "neighbor helping a neighbor build a house." No, that's too light. How about a "doctor in a triage situation"? That captures the impartiality but also the limits. Let's stick to something that highlights the *collective* aspect since the friend ignored that. A "crew rowing a boat." If one rows until they collapse, the boat sinks.

  8.  **Final Polish:** Check against the "no formatting" rule one last time. Ensure the flow is logical.

