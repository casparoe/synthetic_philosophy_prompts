answer: |-
  Your friend's analogy is compelling because it draws on an intuition we all recognize, which is that deep commitment to another being can consume a life without necessarily ruining it. To map this out in plain terms, the moral agent in the consequentialist framework plays the role of the parent, while the beneficiaries of moral action, such as the global poor or distant strangers, play the role of the child. The love that drives a parent to sacrifice sleep and career maps onto the moral motivation of benevolence or the desire to maximize utility. The financial and temporal costs of raising a child correspond to the donations and lifestyle changes demanded by effective altruism or strict utilitarianism. The years spent raising a child map onto the moral agent's lifetime of service. However, the role of the other parent is where the mapping becomes strained, because in the parental analogy there is usually a partner sharing the load, whereas in the demandingness objection the moral agent is often imagined as standing alone against the needs of the world.

  The analogy begins to come apart when you look closely at the conditions under which the sacrifice occurs. A parental demand has a natural termination point because children eventually grow up and become independent, but the moral demand in consequentialism is theoretically unbounded because there will always be someone in need until the end of time. The burden of parenthood is also typically shared between two parents or a wider family network, yet the demandingness objection usually posits a solitary agent who must make up for the failure of others to contribute. Furthermore, the motive that makes parental sacrifice bearable is a specific, partial love for a particular individual, but consequentialism requires impartiality and cannot endorse partial love as a fundamental principle unless it accidentally leads to good outcomes. This creates a tension where the theory relies on a psychological mechanism it officially disavows. Additionally, the sacrifice of parenthood is often constitutive of the parent's own good, meaning that raising the child is part of what gives the parent's life meaning, whereas giving money to a stranger is often purely subtractive from the agent's own projects without offering that same deep personal narrative.

  This leads to the crucial point about keeping something back, because nobody considers a parent a monster for retaining some money for a hobby or some time for sleep, yet strict consequentialism often implies that any resource not directed toward the greater good is a moral failure. This tells us that we intuitively recognize agent-centered prerogatives in the parental case that the moral theory refuses to grant in the general case. The conclusion your friend is after, which is that the demandingness worry evaporates once we see how much people can bear, does not survive this scrutiny because the analogy was carrying the weight of the argument through hidden features like limits, shared responsibility, and personal meaning. The parental case works precisely because it is bounded and shared, while the moral case is presented as unbounded and solitary. If you remove the hidden supports from the parental analogy, the burden becomes crushing in that context too, just as it is in the moral one.

  The point your friend waves away regarding the demand landing on each of us separately is actually the most damaging flaw in the comparison. A demand that is unbounded at every single moment is different in kind from one that is merely large because it prevents long-term planning and creates a state of perpetual anxiety that undermines the agent's ability to function effectively. In the parental case, the demand is large but structured, whereas in the moral case, the demand is structurally infinite. A better analogy for what your friend is trying to say would be a shift worker in a crisis response team, such as a firefighter or a doctor in a triage unit. In that scenario, the demand is high and the sacrifice is real, but there are shifts so the demand ends, there is a crew so the burden is shared, and the role itself provides a professional identity that integrates the sacrifice into the person's own good. This captures the admirability of high demand without implying that the agent must be consumed entirely, showing that the problem is not the height of the demand but the lack of structure and reciprocity in the moral theory.
