  *Drafting thought:* The "Rebuttal" needs to hit hard on the "No-Report" paradigm. In healthy people, we validate these signals by asking them "Did you see it?" In patients, we can't ask. So we are assuming the neural signature transfers. That's the leap.
  *Drafting thought:* HOT specific: HOT says consciousness is a thought *about* a state. The scanner sees the neural correlate of the thought. But in a damaged brain, that correlate might be present without the phenomenology, or vice versa.

  *Final Plan:*
  1. Header.
  2. Recommendation (Reject for clinical use).
  3. The Clinical Stakes.
