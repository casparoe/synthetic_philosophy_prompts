          *   Climate: Systemic liability, behavioral fix, positive duty.
          *   The inconsistency reveals a preference for "one-time fixes" over "lifestyle changes." It shows we care more about *clean hands* (not poisoning) than *active stewardship* (preserving the habitat).
      *   **Confidence & Uncertainty:** Rate confidence. Identify the trickiest part (interpreting the "why" behind climate inaction vs. waste action).

  6.  **Refine the Tone:**

