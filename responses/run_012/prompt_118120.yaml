  This is a classic "Strange Loop" problem, heavily flavored by Douglas Hofstadter's *Gödel, Escher, Bach* mixed with legal positivism (specifically Hans Kelsen's *Grundnorm*). Your friend is distinguishing between systems that *represent* reality (and thus need a ground) and systems that merely *reflect* or *define* internally.

  Here is the breakdown of the rules she is likely using, the prediction for your rulebook, and the case that would force her hand.

  ### The Two Candidate Rules

  To explain all eight of her verdicts, she is likely running one of two underlying frameworks. Both fit the data, but they diverge on the rulebook.

  **Rule Set A: The "Ontological Substrate" Rule**
  *   **The Logic:** A tangle is only legitimate if the loop rests on a level that is *ontologically distinct* from the loop itself. The Inviolate Level must be the "reality" that executes or authors the symbols, not just another set of symbols.
  *   **Why it fits her verdicts:**
      *   *Escher/Quine/Compiler:* The Inviolate Levels are physical/causal (The Artist's Hand, The CPU, The Machine). They are not part of the drawing/code; they are the *ground* upon which it exists.
      *   *Court/States/Liar:* These are purely semantic/normative loops. They claim authority or truth, but there is no "reality" outside the claim to ground it. A judge is a person, but in her framework, a judge acting *under jurisdiction* is part of the normative system, not the physical ground (unlike the CPU).
      *   *Dictionary/Mirrors:* These fail the "Representation" test. They don't claim truth or authority; they are flat mappings. Hence, "Not-a-Loop."
  *   **Key Constraint:** Human agents following rules count as *inside* the normative loop (like the Court), not as the *outside* substrate (like the Machine), unless they are acting as pure physical hardware.

  **Rule Set B: The "Logical Stratification" Rule**
  *   **The Logic:** A tangle is legitimate if the self-reference is resolved by a hierarchy of logical types or time-steps. The Inviolate Level is the "Metalanguage" or "Previous State" that governs the transition to the next state.
  *   **Why it fits her verdicts:**
      *   *Compiler:* The "Earlier Build" is the metalanguage for the new build.
      *   *Escher:* The "Frame" of the paper is the metalanguage for the drawing.
      *   *Court:* Past rulings *should* be the metalanguage, but she calls it Vicious. *Correction:* Under this rule, she must view the Court's past rulings as *same-type* references (precedent), not *higher-type* references (charter).
      *   *Liar Sentence:* Simultaneous self-reference. No time-step separation. Vicious.
      *   *Dictionary/Mirrors:* Flat. No hierarchy.
  *   **Key Constraint:** If you can freeze the state (versioning), you create an Inviolate Level. If the system touches its own foundation *while* standing on it, it collapses.

  ---

  ### The Prediction for the Rulebook

  **The Scenario:** A rulebook with no external charter, where amendments run under the "frozen" procedure active at the start of the amendment.

  *   **Rule Set A (Substrate) Predicts:** **Vicious Circle.**
      *   *Reasoning:* "Nothing outside the book authorizes any of it." The Members are not a "Machine"; they are participants bound by the norms. Without a Charter, Founder, or External Law, there is no Ontological Substrate. The "Freezing" is just a rule *inside* the book, not a level *outside* it. It matches the **Court** verdict perfectly (internal authority, no external ground).
  *   **Rule Set B (Stratification) Predicts:** **Real Tangle.**
      *   *Reasoning:* The "Freezing" mechanism creates a temporal hierarchy. Rule(t) is the Inviolate Level for the transition to Rule(t+1). This mimics the **Compiler** verdict (Earlier Build). As long as the rule is frozen during the process, the loop is broken into steps, providing the necessary stratification.

  **Which one should you bet is hers?**
  **Bet on Rule Set A (Ontological Substrate).**
  *   **Why:** The **Court** verdict is the smoking gun. A court *also* relies on "past rulings" (a form of temporal stratification/versioning), yet she calls it Vicious because there is "no statute or charter above it." If temporal stratification were enough, the Court would be a Real Tangle. The fact that she rejects the Court means she requires an *external* ground (Charter/Statute), not just an *internal* mechanism (Freezing/Past Rulings).
  *   **Her Verdict:** She will call your Rulebook a **Vicious Circle**. The "Members" are not the "Machine," and the "Book" has no "Charter." The freezing is a trick within the loop, not a way out of it.

  ---

  ### The Retroactive Wrinkle

  **The Change:** A clause allows an amendment to rewrite the procedure *that passed it* (retroactive change).

  **Does this move anything for her?**
  *   **If she holds Rule Set A (Substrate):** **No.** It was already Vicious because it lacked an external ground. Retroactivity just makes it "more" vicious, but the verdict doesn't change.
  *   **If she holds Rule Set B (Stratification):** **Yes.** This collapses the temporal hierarchy. If Rule(t+1) can change Rule(t), then Rule(t) was never Inviolate. The "Earlier Build" is contaminated. This would force a Rule Set B adherent to switch their verdict from Real to Vicious.

  **Strategic Insight:** If you present the Retroactive version and she says, *"Well, obviously that breaks it,"* implying the Frozen version *wasn't* broken, she is a Rule Set B thinker (and I was wrong about the Court). If she says, *"It was already broken, this just makes it ugly,"* she is a Rule Set A thinker (which fits the Court precedent).

  ---

  ### The Case That Splits Them

  To force her to pick between Substrate (A) and Stratification (B), you need a case where the Physical Ground is weak, but the Logical Stratification is strong.

  **The "Human Compiler" Case:**
  > "Imagine a club where the Members memorize the Rulebook. To amend it, they gather and recite the current rules from memory to validate the new ones. They act as strict automatons: no discretion, pure execution. There is no written charter, only their minds and their voices. The procedure is frozen during the recitation."

  *   **Rule Set A (Substrate) Says:** **Vicious.**
      *   Humans are normative agents, not silicon. Even if they act like machines, they are socially constructed entities. Without a written Charter or External Law, there is no Ontological Ground. (Matches the Court verdict).
  *   **Rule Set B (Stratification) Says:** **Real Tangle.**
      *   The "Frozen Recitation" creates a logical time-step. State(Memory-N) validates State(Memory-N+1). The strict "automaton" rule removes the semantic ambiguity that plagued the Court. The hierarchy exists.

  **Why this forces a choice:**
  This case isolates the variable of **Human Agency vs. Logical Process**.
  *   If she says **Vicious**, she confirms that for her, *only* non-human physical substrate (Paper, Silicon, Stone) or External Norms (Charter, Law) count as Inviolate. Humans inside the system can never be the Ground.
  *   If she says **Real**, she confirms that *Logical Separation* is the true key, and the Court was only Vicious because legal precedent isn't strict enough versioning, not because it lacked a "physical" ground.

  Given her "Art Historian" side (concerned with the Frame/Artist) and "Compiler Nerd" side (concerned with the Machine/Code), my money is on **Vicious**. She likely sees the "Inviolate Level" as the thing that *cannot* be part of the game. In a club, the members are always players. In a computer, the hardware is never the code.
