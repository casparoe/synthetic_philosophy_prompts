answer: |-
  ### The translation

  In your framework, a claim is not a standalone proposition but an output licensed by a procedure. The "truth" of a statement is secondary to the validity of the inference it supports. When philosophers distinguish lying from misleading, they are distinguishing between asserting a falsehood and asserting a truth that invites a false inference. In statistical terms, this maps onto the distinction between fabrication and selection bias, specifically regarding the calibration of the error rates associated with the claim.

  A "lie" translates to fabrication or direct procedural violation. You report a test statistic that was never computed, or you assert a guarantee (e.g., "Type I error is controlled at 5%") that the procedure mathematically cannot provide. This is a hard failure of validity. The data generating process described does not match the actual data generating process. The claim is unlicensed because the procedure cited does not exist.

  "Merely misleading" translates to selective reporting or hidden analyst degrees of freedom. Here, every reported number is accurate conditional on the subset of data shown, but the procedure that produced the subset is omitted. The claim is technically true but inferentially void. Consider your colleague's case: reporting the one significant comparison out of twenty. The statement "Group A differed from Group B (p=0.03)" is literally true for that slice of data. However, the license attached to a p-value assumes a specific sampling and testing protocol. By omitting the selection process, the colleague implies a procedure of "test hypothesis A" when the actual procedure was "test 20 hypotheses, report the minimum p-value." The reader is entitled to conclude that the false positive rate is 5%; the procedure actually delivers a false positive rate near 64%. The statement is not false, but the inference is miscalibrated.

  In philosophy, intent is the primary differentiator: the liar intends to deceive; the misleader intends to allow deniability. In your framework, intent collapses. A sloppy analyst who forgets to correct for multiple comparisons and a cynical analyst who hides twenty failed tests produce identical miscalibration. The procedure is equally invalid in both cases. Intent only enters as a prior on the analyst's reliability for future work, not as a variable in the current validity check. The "wrong" is the distortion of the error rate, not the mental state of the distorter.

  Regarding audience responsibility: philosophers debate whether the listener should verify implications. In your vocabulary, the "competent reader" is entitled to assume standard procedural guarantees unless explicitly warned otherwise (e.g., via preregistration or disclosure of exploratory status). If the selection process is hidden, the reader cannot perform the necessary calibration. The burden is entirely on the reporter to disclose the procedure that licenses the inference. Omission of the selection protocol is not a conversational nuance; it is a missing parameter required to compute the variance of the estimator. Thus, "misleading" is not a lesser offense than "lying"; it is a covert violation of the procedure's assumptions that renders the confidence interval meaningless.

  ### Term for term

  | Philosophers' Term | Statistician's Term | Fit Quality |
  | :--- | :--- | :--- |
  | Lying | Fabrication / False Procedure Report | High |
  | Merely Misleading | Selection Bias / Hidden Degrees of Freedom | High |
  | Intent to Deceive | Analyst Degrees of Freedom (Cynical vs. Sloppy) | Low |
  | Literal Truth | Accuracy of Reported Estimate | High |
  | False Implication | Invalid Inference License | High |
  | Moral Wrong | Procedural Violation / Miscalibration | Medium |
  | Audience Duty | Assumption of Preregistration / Transparency | Low |
  | Deception | Type I Error Inflation | Medium |
  | Omission | Missing Data / Unreported Comparisons | High |
  | Conversational Norm | Standard Statistical Protocol | Medium |

  ### What got left behind

  The translation loses the normative weight of *intent* and the semantic nuance of *literal truth*. In philosophy, the liar violates a norm of assertion; the misleader exploits a norm of cooperation. In your framework, both violate the norm of calibration. The distinction between "sloppy" and "cynical" evaporates because the sampling distribution of the estimator does not care about the analyst's soul. This is a feature, not a bug, for science, but it leaves you unable to adjudicate blame, only validity. You can flag the procedure as broken, but you cannot distinguish malice from incompetence without external metadata.

  Furthermore, the philosophical debate hinges on the literal truth of the assertion. The misleader says something true; the liar says something false. In your vocabulary, this distinction is epistemically thin. A literally true estimate derived from a biased selection process is functionally equivalent to a false one because the confidence interval does not cover the parameter at the stated rate. The "truth" of the number is irrelevant if the license to generalize is void. The philosophical distinction protects the speaker who hides behind technical truths; your framework indicts the inference regardless of the number's accuracy.

  This divergence is sharpest in the 1/20 case. A philosopher might classify this as "merely misleading," potentially assigning it less moral weight than a direct lie because the audience *could* theoretically ask "did you test others?" and because the statement itself is verifiable. Your framework classifies this as severe selection bias. It is arguably worse than a simple lie because a lie is often detectable upon replication, whereas selective reporting passes peer review and corrupts the meta-analytic baseline. The philosophical framework asks, "Did the speaker violate a linguistic norm?" Your framework asks, "Is the literature now miscalibrated?" The former protects the speaker's ambiguity; the latter protects the reader's inference.

  Finally, the concept of audience responsibility does not survive cleanly. Philosophers argue over how much work the listener must do to avoid being fooled. In statistics, the "competent reader" is defined by their ability to interpret reported procedures, not to guess hidden ones. If the procedure is not reported, the reader is not complicit in their own deception; they were denied the inputs required for calibration. The philosophical idea that the listener shares responsibility for the implication collapses when the missing information is structurally necessary for the math to hold.

  ### Your call

  The leftover is a sign that the philosophers' distinction is thinner than it sounds. Their debate relies on semantic technicalities—literal truth versus implied falsehood—that do not track epistemic harm. A miscalibrated procedure damages knowledge accumulation regardless of whether the analyst lied or merely misled. Your vocabulary captures the consequence (invalid inference) rather than the mechanism (semantic ambiguity). The only genuine hole is the inability to distinguish intent, but that is a legal or HR concern, not a scientific one. For the integrity of the record, the procedural violation is the only variable that matters.
