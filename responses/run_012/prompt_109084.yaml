prompt: |-
  I work in applied statistics — I'm the person colleagues bring an analysis to before it goes out, and most of my job is deciding whether a claim is something the procedure that produced it actually licenses. So everything I think with is procedures and their guarantees: what a test is calibrated to do over repeated use, what a confidence interval entitles a reader to conclude, the difference between a comparison I preregistered and one I ran after seeing the data, the file drawer, the fact that an estimate can be right about the sign and wildly wrong about the size, and the difference between the data being consistent with no effect and there being no effect. Notice that in my world there's nowhere to put the person. A procedure is misleading or it isn't, and it stays that way whether the analyst was cynical or just sloppy. Intent shows up only as a reason to distrust the procedure, never as a separate ingredient.

  There's a debate in philosophy I keep bumping into and I want it translated into my terms: is there a moral difference between lying and merely misleading? Somebody says something literally true, arranged so you draw the false conclusion, and the philosophers want to know whether that's a lesser wrong than saying the false thing outright, and whether it's a wrong at all when the audience is expected to do some work of their own. Restate that arguement as faithfully as you can in my vocabulary — procedures, licenses, calibration, selection, omission, and the inference a competent reader is entitled to draw. Then the part I actually care about: what didn't survive the trip? What maps cleanly onto something I already have a name for, what can I only get at by distorting it, and what has no counterpart in how I think at all.

  Here's the case I want run through it, because I suspect it's where the translation breaks: a colleague reports the one comparison out of twenty that came out significant. No false statement anywhere, no hidden data — just a choice about what to report and what to leave out. Every reader concludes the effect is real and roughly the size of the estimate. Where does that sit in the philosophers' distinction, and does my framework have anything to say about it that theirs doesn't?

  Assume I'll follow the technical terms; don't spend the answer doing pragmatics 101. Keep it tight and use these sections, in this order: The translation (600–800 words); Term for term (a table, ten rows max, philosophers' term / my term / how clean the fit is); What got left behind (400–600 words); Your call (about 150 words) on whether the leftover is a hole in my vocabulary or a sign that the philosophers' distinction is thinner than it sounds.
