      *   *Principle of Charity:* This is the trickiest. Davidson says it's constitutive. In ML, this looks like a *strong structural prior* over the joint distribution of meaning and belief. It's not just "assume they are right"; it's "assume the mapping preserves logical structure and truth conditions relative to the world."
      *   *Meaning/Belief Inseparability:* Joint inference. You cannot optimize $P(\text{Meaning} | \text{Utterance})$ independently of $P(\text{Belief} | \text{Context})$. They are latent variables in a single generative model.
      *   *Indeterminacy:* Non-identifiability. Multiple parameter settings (translation matrices + belief models) yield the same likelihood on the observed data.
      *   *Truth/Conditions:* The loss function. Minimizing prediction error regarding "holding true" (assent/dissent) given environmental states.

      *Drafting the Translation:*
