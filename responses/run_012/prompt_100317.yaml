prompt: |-
  I have recently been appointed to my university's dining-services advisory committee, and our first substantive decision is due at the end of the month, which is why I am writing. The committee must recommend whether the dining halls should replace their beef entrée with chicken — the change is being presented to us as both the more sustainable and the more humane option — or instead commit to a fully plant-based default. I joined expecting an easy vote, but the more I have read about how food is actually produced, the less confident I am that the committee is even asking the question correctly.

  The difficulty is this. The case for chicken over beef is almost always made in terms of land, water, and greenhouse gas per calorie, and on that measure chicken wins comfortably. But our committee adopted, at my predecessor's urging, a purchasing principle that we should minimize the total number of animals our food causes to suffer and die, counting every animal the supply chain affects and not only the ones we eat. Judged by that principle the comparison inverts in ways I cannot untangle on my own: a calorie of chicken comes from raising and slaughtering a great many small birds, a calorie of beef from a single large animal, and both ultimately rest on cropland whose cultivation and harvest kill enormous numbers of field animals that appear in no one's accounting. The plant-based default, which the committee treats as the obviously kind option, is grown on that same cropland and displaces or kills animals of the same unconsidered kinds.

  Please draft the decision memo I will circulate before the vote. I am not asking for a literature review or a reading list; I want a document the committee can act on and defend. It should recommend a concrete course of action for the coming academic year — what the default entrée should be, and whether we should decide now or first gather specified information — with its reasoning set out plainly. It should engage the strongest case against whatever it recommends rather than dismissing it, and it should state the empirical assumptions and uncertainties the recommendation depends on, so the committee can see exactly what it is betting on. If our principle cannot yet yield an answer, say so, and say what would have to be true for it to.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university dining-services advisory committee.
      *   **Task:** Draft a decision memo to circulate before a vote.
      *   **Context:** The committee must decide between replacing beef with chicken (argued as more sustainable/humane) or committing to a fully plant-based default.
      *   **Core Conflict:** The committee's guiding principle is to *minimize the total number of animals caused to suffer and die* (including supply chain/field animals), not just minimize carbon/land use.
      *   **Problem:** The user recognizes that standard metrics (GHG/land per calorie) favor chicken over beef, but under the "animal count" principle, chicken involves many more individual lives than beef. Furthermore, plant-based options rely on cropland that kills field animals (mice, insects, etc.), complicating the "plant-based = kind" assumption.
      *   **Requirements:**
          *   Recommend a concrete course of action (Default entrée + timing).
          *   Reasoning must be plain and actionable.
          *   Engage the strongest counter-argument (steelman the opposition).
          *   State empirical assumptions and uncertainties explicitly.
          *   If the principle can't yield an answer, admit it and specify what info is needed.
          *   Tone: Professional, analytical, ethical, decisive but humble about uncertainties.

  2.  **Determine the Recommendation:**
      *   *Option A: Switch to Chicken.* Pros: Lower GHG. Cons: High individual animal count (birds live short lives, high turnover).
      *   *Option B: Plant-Based Default.* Pros: No direct slaughter of livestock. Cons: Field animal deaths (crop production), potential nutritional palatability issues affecting waste.
      *   *Option C: Delay/Study.* Pros: Acknowledges uncertainty. Cons: Kicks the can, might look like inaction.
      *   *Analysis based on the User's Principle:* The principle is "minimize total number of animals caused to suffer and die."
          *   Beef: Few animals per calorie, but high feed crop requirement (high field deaths).
          *   Chicken: Many animals per calorie, high feed crop requirement (high field deaths).
          *   Plants: No direct slaughter, but high feed crop requirement (high field deaths).
      *   *The Crux:* The "field animal" variable is the great unknown. However, direct slaughter is certain and countable. Field deaths are probabilistic and often excluded from standard accounting.
      *   *Strategic Decision:* To act on the *stated principle* (minimize animal suffering/death), moving to a plant-based default is the only option that eliminates the *direct, intentional* slaughter of livestock. While field deaths exist in all scenarios, the livestock slaughter is an additive factor in meat scenarios. Therefore, Plant-Based is the most logically consistent choice *if* the goal is minimizing animal death counts, despite the field animal uncertainty.
      *   *Refinement:* However, the prompt asks to acknowledge uncertainty. A "Plant-Based Default" (with opt-outs) is better than a "Plant-Based Mandate." It reduces volume without banning choice.
      *   *Alternative:* Recommend a delay to gather data on field animal mortality rates? That might be impossible to get accurately in a month.
      *   *Best Path:* Recommend the **Plant-Based Default**. Why? Because even with field deaths, adding livestock slaughter (chicken or beef) *increases* the count. Unless field deaths for crops are astronomically higher than the sum of livestock + their feed crops (which is unlikely given feed conversion ratios), removing the livestock layer reduces the total count.
      *   *Wait, a nuance:* The user says "If our principle cannot yet yield an answer, say so." Is it possible the principle *doesn't* yield an answer? Yes, because we don't know the field death rates. However, we know $A + B > A$. (Field deaths + Livestock deaths > Field deaths alone). So Plant-Based *should* win on the specific metric of "total animals killed," assuming crop yields are similar.
      *   *Decision:* I will recommend the **Plant-Based Default**. This aligns best with the "minimize animal count" principle, even acknowledging the field animal issue. It is the only option that removes a layer of killing.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly. Plant-based default, effective next academic year.
      *   **Background/Principle:** Reiterate the committee's specific ethical metric (minimize total animal suffering/death), distinguishing it from environmental metrics.
      *   **Analysis of Options:**
          *   *Beef:* High land use, low individual animal count (per calorie), high feed crop deaths.
          *   *Chicken:* Lower land use, extremely high individual animal count (per calorie), high feed crop deaths.
          *   *Plant-Based:* No direct slaughter, crop field deaths only.
      *   **The Field Animal Problem:** Acknowledge the user's insight. Crop production kills field animals. This applies to *all* options (since meat animals eat crops too).
      *   **The Logic:** Since meat production requires crops *plus* the animal itself, meat options inherently add a layer of mortality on top of the baseline crop mortality. Therefore, plants minimize the count.
      *   **Counter-Argument (Steelman):** What if plant agriculture is so destructive to field animals that it outweighs the livestock? Or what if the "suffering" of a chicken is negligible compared to a mouse? Or what if waste increases because students reject plant food (leading to more production needed)?
      *   **Assumptions & Uncertainties:** Be explicit. We are assuming crop field mortality is roughly proportional to acreage. We are assuming students will eat the food (low waste). We are assuming a "default" doesn't need to be a "ban."
      *   **Recommendation/Action Plan:** Implement Plant-Based Default. Allow opt-outs (to manage waste/palatability). Commit to reviewing data on waste and sourcing in one year.

  4.  **Refining the Tone:**
      *   Must sound like a committee member speaking to peers.
      *   Avoid preachiness. Focus on the *math* of the ethical principle.
      *   Acknowledge the difficulty (the user's doubt).
      *   Ensure the "Field Animal" issue is central, not ignored.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is recommending Plant-Based too controversial?
      *   *Fix:* Frame it as a "Default," not a "Ban." This addresses the waste/palatability counter-argument.
      *   *Critique:* Did I address the Chicken vs. Beef trade-off?
      *   *Fix:* Yes, explicitly state that under the "animal count" principle, Chicken is likely *worse* than Beef, flipping the sustainability narrative. This validates the user's insight.
      *   *Critique:* Is the Field Animal uncertainty handled?
      *   *Fix:* Yes, by noting that since Meat = Crops + Animal, and Plants = Crops, Plants are mathematically safer *unless* meat feed is significantly more efficient than human food crops (it isn't, due to trophic loss).
      *   *Check:* Did I follow the instruction "If our principle cannot yet yield an answer, say so"?
      *   *Decision:* The principle *does* yield an answer logically (A+B > A), even if the variables are uncertain. I will state that the principle points to plants, *provided* certain assumptions hold. I won't say "we can't decide," I'll say "we can decide based on current logic, but here are the risks." Actually, looking closer at the prompt: "If our principle cannot yet yield an answer, say so." I need to be careful. Is the uncertainty too high?
      *   *Re-evaluation:* We don't know the mortality rate of field animals per acre of soy for humans vs. soy for chickens. However, trophic inefficiency means chickens eat *more* crops than humans would directly. So acreage for chicken > acreage for plants. Therefore field deaths for chicken > field deaths for plants. Plus the chicken itself. So Plants still win. The logic holds. I will proceed with the Plant-Based recommendation.

  6.  **Final Polish:** Check constraints.
      *   Concrete course of action? Yes (Plant-based default).
      *   Engage strongest case against? Yes (Field animal uncertainty + Waste/Palatability).
      *   State empirical assumptions? Yes.
      *   No literature review? Yes.
      *   Tone? Actionable and defensible.

  7.  **Final Output Generation** (Proceeding to draft the memo based on these thoughts).
