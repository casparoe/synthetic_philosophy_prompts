  **MEMORANDUM**

  **TO:** Dining Services Advisory Committee
  **FROM:** [Your Name/Committee Member]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Entree Sourcing Principle and Default Option

  ### Executive Summary

  This memo recommends that the Committee adopt a **fully plant-based default entrée** for the upcoming academic year, while maintaining an opt-out provision for meat-based meals.

  This recommendation is not based on carbon footprint or land efficiency, but strictly on the purchasing principle adopted by this Committee: *to minimize the total number of animals caused to suffer and die, including those affected by supply chain cultivation.*

  While the switch from beef to chicken is often argued on environmental grounds, under our specific ethical principle, chicken represents a significant increase in individual animal mortality compared to beef. However, both meat options require crop cultivation that kills field animals *plus* the slaughter of the livestock itself. A plant-based default removes the livestock layer, offering the only mathematically consistent path to minimizing total animal counts, provided specific assumptions regarding crop yields and food waste hold true.

  ### Background: The Ethical Metric

  At the urging of the previous committee, our guiding metric is not greenhouse gas emissions per calorie, but the **count of individual lives impacted.**

  We face three options:
  1.  **Status Quo (Beef):** High land use, low individual animal count per calorie, high field-animal mortality via feed crops.
  2.  **Switch to Chicken:** Lower land use, extremely high individual animal count per calorie (due to small body size and rapid turnover), high field-animal mortality via feed crops.
  3.  **Plant-Based Default:** No direct livestock slaughter, field-animal mortality via crop cultivation only.

  ### Analysis of Options Under Our Principle

  **1. The Chicken vs. Beef Trade-off**
  Standard sustainability metrics favor chicken over beef. However, under our principle, this comparison inverts. To produce one calorie of beef requires a fraction of the individual lives required to produce one calorie of chicken. If our goal is to reduce the *number* of deaths, replacing beef with chicken is a step backward, as it exchanges one large death for dozens of smaller ones per unit of food.

  **2. The Field Animal Variable**
  The most significant uncertainty in our deliberation is the mortality of field animals (rodents, insects, birds) displaced or killed during crop cultivation and harvest. This applies to all three options, as cattle and poultry are fed crops.
  *   **Meat Options:** Total Deaths = (Field deaths to grow feed) + (Livestock slaughter).
  *   **Plant Option:** Total Deaths = (Field deaths to grow human food).

  Because of trophic inefficiency (energy loss when feeding plants to animals), producing calories via meat requires more acreage of crops than producing those same calories directly for humans. Therefore, the meat options likely incur *higher* field-animal mortality than the plant option, in addition to the direct slaughter of the livestock.

  ### The Strongest Counter-Argument

  The strongest case against the plant-based default rests on two empirical uncertainties:

  **A. The Intensity of Crop Mortality**
  It is possible that the crops suitable for direct human consumption (e.g., vegetables, grains) require more intensive harvesting methods or pesticide use per calorie than the crops suitable for animal feed (e.g., field corn, soy). If the "field death rate" per acre for human-grade crops is exponentially higher than for feed-grade crops, the plant-based option could theoretically result in more total animal deaths than a highly efficient beef system, despite the absence of livestock slaughter. We currently lack precise data on field-animal mortality rates per crop type.

  **B. The Waste Factor**
  A default influences behavior. If the plant-based default is perceived as lower quality or less satiating, students may discard more food or seek alternative protein sources off-campus that are less regulated. If waste increases, we must produce more calories to feed the same population, scaling up the field-animal mortality associated with crop production. If the "opt-out" rate for meat is high, the administrative burden may also sustain the meat supply chain at a level that negates the reduction in animal counts.

  ### Empirical Assumptions and Uncertainties

  To defend this recommendation, the Committee must acknowledge we are betting on the following assumptions:

  1.  **Trophic Efficiency:** We assume that feeding plants directly to humans requires less total acreage than feeding plants to animals to feed humans, thereby reducing total field-animal habitat disruption.
  2.  **Comparative Mortality:** We assume that the slaughter of one cow or fifty chickens adds a net positive number of deaths to the baseline field mortality, rather than substituting for it.
  3.  **Acceptability:** We assume a "default" rather than a "mandate" will keep food waste low. (Students who strongly object can still request meat, but the friction reduces overall demand).
  4.  **Sourcing Parity:** We assume the plant-based proteins are sourced from similar agricultural systems as the animal feed (e.g., not wild-foraged), making the acreage comparison valid.

  ### Recommendation and Action Plan

  Given the uncertainty regarding field-animal mortality rates, our principle cannot yield a *perfect* answer. However, it yields a *probabilistic* one. The meat options add a guaranteed layer of slaughter on top of a probable layer of field deaths. The plant option removes the guaranteed layer.

  Therefore, I recommend the following course of action:

  1.  **Adopt a Plant-Based Default:** The daily main entrée served in dining halls should be plant-based.
  2.  **Maintain an Opt-Out:** Meat alternatives (prioritizing beef over chicken if forced to choose, based on individual animal count) should be available upon request, but not displayed as the primary option. This balances ethical reduction with student preference to minimize waste.
  3.  **Data Commitment:** Dining Services must track waste volumes and opt-out rates for the first semester. If waste increases by more than 10%, the Committee will reconvene to adjust the menu, as high waste undermines the ethical goal.
  4.  **Supplier Inquiry:** Before contracting, Dining Services should query potential suppliers on their harvest methods. Preference should be given to suppliers who utilize practices known to reduce field-animal mortality (e.g., flush bars on harvesters, reduced tillage), regardless of whether the crop is for human or animal consumption.

  ### Conclusion

  We cannot eliminate animal death from our food system entirely, as even plant agriculture disrupts ecosystems. However, under the principle of minimizing total counts, removing the livestock intermediary is the only lever we possess that guarantees a reduction in direct slaughter without relying on uncertain trade-offs in field mortality.

  I move that we adopt the Plant-Based Default with an Opt-Out provision for the coming academic year, contingent on the waste-monitoring protocol outlined above.
