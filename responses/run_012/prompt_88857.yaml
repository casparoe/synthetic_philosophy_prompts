prompt: |-
  I run the ops for a small community "library of things" in a town of about 30,000 — we lend tools, run a repair café, have a shared garden plot, a community fridge, and a little fleet of cargo bikes. We've got around 250 members, two part-time staff, and a volunteer board. Lately every monthly meeting turns into alot of the same arguments: the 3D printer in our makerspace is always tied up by the same four guys, the garden's irrigation timer gets over-ridden so half the beds get soaked and the rest dry out, the community fridge is either empty or full of stuff nobody wants, and the cargo bikes are never where they're supposed to be. My board wants me to write up a procedure for deciding when we should step in with rules — reservations, time limits, fees, quotas, maybe even kicking someone out — and when we should just add capacity or leave it to people to work out. I've read a bit about the tragedy of the commons and public goods, and a friend who studies environmental governance said the key questions are whether the resource is rivalrous and how hard it is to exclude people, but I can't turn that into something I can actually use at a meeting. I think the fridge might be more of a public good and the printer more of a commons, but I'm not sure if that changes what I should do. I don't want a reading list or citations, I just need a procedure.

  Can you write me a decision procedure I can actually run? I'm thinking: a sequence of questions to ask in order, what counts as a sufficient answer to each, where the procedure stops and says 'no new rule' or 'new rule needed,' and where it hands the decision to the board because it's really a values call about fairness or who belongs. It has to be usable by a volunteer coordinator who's never taken a poli-sci class, and it should keep the distinctions that actually change the answer — like whether the thing is rivalrous, whether exclusion is feasible, whether users are identifiable, whether the resource is a public good on top of a common-pool resource — and drop the ones that don't. Please don't just tell me to 'use the design principles' — I need the actual questions to ask, in order. I've got maybe 20 minutes per case, any fee or exclusion has to be approved by the board, and we can't afford a lawyer. Also, alot of our members are students or renters who move away every year, so the usual 'we'll all see each other again' enforcement mechanism is kinda weak. Then run it on three cases: the 3D printer, the garden irrigation, and the community fridge. At least one of them should come out in a way I won't like — I'd rather find out now than at the meeting. And please say what the procedure can't do, or where it will misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Ops manager for a small "library of things" (30k town, 250 members, 2 staff, volunteer board).
      *   **Problem:** Recurring conflicts (3D printer hogging, garden irrigation misuse, fridge waste/empty, cargo bikes missing). Board meetings are stuck in loops.
      *   **Need:** A concrete *decision procedure* (sequence of questions) to decide when to add rules (reservations, fees, exclusion) vs. add capacity vs. leave it alone.
      *   **Constraints:** Usable by volunteers (no poli-sci jargon), 20 mins per case, no lawyer, high member turnover (weak social enforcement).
      *   **Requirements:** Must distinguish resource types (rivalry, excludability), identify where board values come in, run on three specific cases (Printer, Garden, Fridge), include at least one uncomfortable outcome, and state limitations.
      *   **Forbidden:** No reading lists, no citations, no vague "use Ostrom's principles" without concrete questions.

  2.  **Deconstruct the Theory (Mental Sandbox):**
      *   *Tragedy of the Commons:* Rivalrous + Non-excludable = Depletion. Solution: Property rights or regulation.
      *   *Public Goods:* Non-rivalrous + Non-excludable. Solution: Usually funded by taxes/donations, hard to restrict.
      *   *Club Goods:* Non-rivalrous + Excludable. Solution: Membership fees.
      *   *Private Goods:* Rivalrous + Excludable. Solution: Market/Ownership.
      *   *Context:* This is a community org. "Excludability" isn't just technical; it's social/political. "Rivalry" isn't just physical; it's about congestion.
      *   *Key Insight:* The user needs a flowchart logic translated into text questions. The logic needs to filter: Is it broken? -> Is it scarcity or behavior? -> Can we fix it without rules? -> Do we need rules? -> What kind? -> Who decides?

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Attempt 1 (Too Academic):* Is it rivalrous? Is it excludable? If yes/no... (Too abstract for volunteers).
      *   *Attempt 2 (Too Simple):* Is it broken? Yes -> Fix it. (Misses the nuance of fairness and values).
      *   *Attempt 3 (Balanced):* Focus on *impact* first, then *cause*, then *solution feasibility*.
      *   *Step 1: Harm Check.* Is anyone actually being hurt or excluded? (If no, stop).
      *   *Step 2: Scarcity vs. Misuse.* Is there not enough stuff, or is the stuff being used wrong?
      *   *Step 3: Technical Fix.* Can we fix it with a timer, a lock, or more money? (Avoids social rules).
      *   *Step 4: Social Fix.* Can we fix it with a sign-up sheet or a chat? (Low friction).
      *   *Step 5: Rule Check.* If we need rules, does it require exclusion or fees? (Board territory).
      *   *Step 6: Values Check.* Does this align with our mission? (Board territory).

      *Refining for the User's Constraints:*
      *   Need to explicitly handle the "high turnover" issue (weak social enforcement).
      *   Need to distinguish between the Fridge (public good/charity) and Printer (club good/tool).
      *   Need to ensure the "uncomfortable outcome" happens naturally.

  4.  **Finalizing the Decision Procedure (The "Resource Triage Protocol"):**
      *   Make it a numbered list of Yes/No questions.
      *   Define "Stop" points clearly.
      *   Define "Board Escalation" points clearly.
      *   Keep language plain English.

  5.  **Running the Cases:**
      *   *3D Printer:* High demand, specific users. Rivalrous. Excludable (keys/login). Likely needs rules (time limits).
      *   *Garden Irrigation:* Shared resource, sabotage/neglect. Rivalrous (water). Excludable (locks). Needs technical fix + rule.
      *   *Community Fridge:* This is the tricky one. It's often treated as a public good, but if it's constantly empty/full of trash, it's failing.
          *   *Hypothesis:* The procedure might suggest *restricting access* or *charging fees* for the fridge to make it sustainable, which contradicts the "community fridge" ethos. OR, it might suggest shutting it down. Let's aim for the "Shut it down or radically change mission" outcome, as that's usually the uncomfortable truth for fridges that aren't working. Actually, a better "uncomfortable" outcome is realizing the Fridge *cannot* be managed like a library item and needs a dedicated champion or removal. Let's go with: The procedure indicates that without a dedicated manager (cost money), the Fridge violates the "no harm" rule and should be paused. That's uncomfortable.

  6.  **Addressing Limitations:**
      *   Where does this fail? Politics, hidden power dynamics, mission drift.
      *   It can't measure "vibe."
      *   It assumes good faith.

  7.  **Review against Constraints:**
      *   20 mins? Yes, it's a checklist.
      *   No jargon? Yes.
      *   Distinguishes resource types? Yes, via the questions about rivalry and exclusion.
      *   Uncomfortable outcome? Yes (Fridge).
      *   No citations? Yes.

  8.  **Final Polish:**
      *   Tone: Professional, direct, operational.
      *   Structure: Procedure first, then Cases, then Limitations.
      *   Ensure the "Board Escalation" is clear for values-based decisions.

      *(Self-Correction during drafting)*: Make sure I don't confuse "excludable" (can we stop people?) with "exclusive" (do we want to?). The procedure needs to ask "Can we technically stop people?" not "Should we?"
      *(Refining the Fridge Case)*: If I say "Shut it down," that's dramatic. If I say "Requires paid staff," that's also dramatic for a small org. Let's make the procedure point out that *volunteer management* is insufficient for a high-turnover perishable good. That leads to "Get funding or close." That's uncomfortable.

      *(Refining the Printer Case)*: The user hates the "four guys." The procedure should lead to "Time limits + Booking System."
      *(Refining the Garden Case)*: The timer is being overridden. This is a technical failure + rule failure. Procedure should lead to "Lock box + Single Keyholder."

      *(Wait, one more check)*: The prompt asks for *one* outcome the user won't like. I will make the Fridge outcome the uncomfortable one (suggesting it might need to be closed or monetized to survive, which violates the "free food" ethos).

      *(Final check on "Public Good vs Commons")*: The user mentioned this. I need to make sure the procedure implicitly handles this without using the terms.
      *   Printer = Rivalrous (one person uses it) + Excludable (members only). -> Club Good / Common Pool.
      *   Fridge = Non-rivalrous (mostly) + Non-excludable (usually open). -> Public Good (but prone to spoilage/rivalry if space is full).
      *   Garden = Rivalrous (water/plot) + Excludable (members). -> Common Pool.
      *   The procedure must detect the "Non-excludable" nature of the fridge as a risk factor.

      *Okay, ready to write.*
answer: |-
  Here is a decision procedure designed for your context. It is called the **Resource Triage Protocol**. It is designed to be run in under 20 minutes by a coordinator or volunteer lead. It avoids academic terms and focuses on operational reality.

  ### The Resource Triage Protocol

  **Pre-Condition:** Only run this protocol if a specific resource (printer, bike, fridge, garden bed) has generated at least three distinct complaints or incidents in the last 60 days.

  **Step 1: The Harm Check**
  *   **Question:** Is the current situation preventing members from using the resource *or* creating a safety/financial risk to the organization?
  *   **If No:** Stop. Do not make a new rule. Monitor for 30 days. (Sometimes noise is just noise).
  *   **If Yes:** Proceed to Step 2.

  **Step 2: The Scarcity Check**
  *   **Question:** Is the problem that we literally don't have enough of the thing (e.g., not enough bikes), or that the existing thing is being used inefficiently/incorrectly (e.g., bikes are hidden, printer is hogged)?
  *   **If "Not enough thing":** Proceed to **Path A (Capacity)**.
  *   **If "Used incorrectly":** Proceed to Step 3.

  **Path A (Capacity)**
  *   **Question:** Can we afford to buy/build more of this resource within the current budget without cutting other programs?
  *   **If Yes:** Buy the resource. Stop.
  *   **If No:** Treat as "Used incorrectly" and proceed to Step 3. (Scarcity often forces behavior management).

  **Step 3: The Technical Fix Check**
  *   **Question:** Can this be solved with a lock, a timer, a physical barrier, or a software setting without changing human behavior? (e.g., a lockbox for keys, a hard stop on the printer software).
  *   **If Yes:** Implement the technical fix. Assign one staff/volunteer to hold the "master key" or admin password. Stop.
  *   **If No:** Proceed to Step 4.

  **Step 4: The Identification Check**
  *   **Question:** When the problem happens, can we identify exactly *who* did it within 24 hours? (e.g., login logs, sign-in sheet, camera, unique keys).
  *   **If No:** **STOP.** You cannot enforce rules on anonymous users. You must either make the resource excludable (members only, key fob) or discontinue the resource. (This is a Board decision if discontinuing).
  *   **If Yes:** Proceed to Step 5.

  **Step 5: The Friction Check**
  *   **Question:** Can the solution be managed by a sign-up sheet or a polite conversation, or does it require tracking hours/usage limits?
  *   **If "Sign-up/Chat":** Implement the low-friction system. Stop.
  *   **If "Tracking/Limits":** Proceed to Step 6.

  **Step 6: The Exclusion & Fee Check (Board Escalation)**
  *   **Question:** Does the solution require charging money, banning a member, or strictly limiting access (e.g., "2 hours per week")?
  *   **If No:** Ops Manager may implement the rule. Stop.
  *   **If Yes:** **STOP.** This requires Board Approval. Prepare a brief stating: 1. The Harm, 2. Why technical fixes failed, 3. The proposed restriction.

  ***

  ### Running the Cases

  Here is how the protocol applies to your three specific headaches.

  #### Case 1: The 3D Printer
  *   **Step 1 (Harm):** Yes. Four members are monopolizing a shared asset, excluding others.
  *   **Step 2 (Scarcity):** Used incorrectly. It's not that you need 10 printers; it's that one is hogged for days.
  *   **Step 3 (Technical):** Partially. Most printer software allows queue limits, but physical removal is hard.
  *   **Step 4 (Identification):** Yes. You know who the four guys are. Logs show user IDs.
  *   **Step 5 (Friction):** Tracking/Limits. A sign-up sheet won't work if they ignore it. You need hard time limits (e.g., 24-hour print max).
  *   **Step 6 (Exclusion/Fee):** **Board Escalation.**
      *   *Outcome:* You need a rule limiting print time per member per week. If they exceed it, they are locked out.
      *   *Why:* This moves from "community norm" to "enforced restriction." Since you have high turnover, social shaming won't work. You need a hard technical limit enforced by policy.
      *   *Verdict:* **New Rule Needed (Board Approval).**

  #### Case 2: The Garden Irrigation
  *   **Step 1 (Harm):** Yes. Plants are dying (financial loss) and beds are uneven (fairness issue).
  *   **Step 2 (Scarcity):** Used incorrectly. Water is available, distribution is broken.
  *   **Step 3 (Technical):** **Yes.**
      *   *Outcome:* The timer is being overridden. The solution is not a rule; it is a lockbox. The timer goes in a locked box. Only the Garden Lead (staff or designated volunteer) has the code.
      *   *Verdict:* **Technical Fix Only.** No new member rules needed. If the Garden Lead breaks it, that is a staff/volunteer management issue, not a member policy issue.

  #### Case 3: The Community Fridge
  *   **Step 1 (Harm):** Yes. Food waste (financial/reputation risk) and empty shelves (members go hungry).
  *   **Step 2 (Scarcity):** Used incorrectly. Food is there, but it's the wrong food, or it spoils.
  *   **Step 3 (Technical):** No. You cannot put a timer on a fridge.
  *   **Step 4 (Identification):** **No.**
      *   *Critical Failure Point:* People drop off food anonymously. People take food anonymously. You cannot identify who put the rotten lasagna in or who took the last of the milk.
      *   *Protocol Instruction:* **STOP.** You cannot enforce rules on anonymous users.
      *   *Required Action:* You must make the resource excludable (Members only, key fob access) OR discontinue the resource.
      *   *Verdict:* **Board Escalation (Discontinue or Restructure).**
      *   *The Uncomfortable Truth:* The protocol dictates that a "open to all" fridge is operationally impossible for your organization without a dedicated, paid staff member to monitor every deposit. Since you cannot identify users, you cannot enforce safety or fairness rules. The Board must decide to either:
          1.  **Close the fridge.** (It is a liability with no enforcement mechanism).
          2.  **Lock it.** (Members only, strict deposit rules, violation = membership revocation).
          3.  **Fund it.** (Hire a part-time "Fridge Manager" to inspect every item).
      *   *Why you won't like this:* You likely started the fridge to be open and charitable. This procedure tells you that "open and charitable" is incompatible with "sustainable and safe" given your current staffing and turnover. It forces a choice between mission and operations.

  ***

  ### Where This Procedure Will Misfire

  You asked for the limitations. This protocol is a tool, not a truth machine. Here is where it will fail you:

  1.  **The "Vibe" Blindspot:** This protocol measures measurable harm. It does not measure "feeling unwelcome." If the four guys with the 3D printer are technically within the rules but make the space feel like a boys' club, this protocol says "No Action." You need a separate "Culture Check" for that.
  2.  **The Power Blindspot:** Step 4 assumes that if you *can* identify someone, you *can* hold them accountable. If one of the 3D printer guys is the Board Treasurer's nephew, the identification won't matter. The protocol assumes the Board will enforce its own rules impartially.
  3.  **The Mission Drift:** As seen in the Fridge case, this protocol optimizes for sustainability and risk management. It will often recommend restricting access or closing programs that are "leaky." If your mission is specifically to serve high-need, transient populations who *cannot* follow sign-up procedures, this protocol will tell you to shut down your most important programs. You must override the protocol with a values statement, but you must do so knowing the operational cost.
  4.  **The Turnover Trap:** The protocol assumes that "Rules + Identification = Compliance." In a town with high renter turnover, people don't care about long-term reputation. A rule that relies on "don't do this again" fails if the user moves out next month. For high-turnover resources, the protocol should be interpreted to favor **Technical Fixes (Step 3)** over **Behavioral Rules (Step 5)** whenever possible.

  **Recommendation for your Meeting:**
  Print this protocol. Put it on the table. Tell the Board: *"We are not arguing about the fridge today. We are running the Fridge through the Triage Protocol. If the protocol says we need to lock it or close it, that is the recommendation. We can vote to override the protocol, but we must vote to accept the risk it identified."*

  This shifts the argument from "I think" to "The system says."
