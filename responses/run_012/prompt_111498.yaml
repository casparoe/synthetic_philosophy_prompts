answer: |-
  # Joint Statement on Mechanistic Anomaly Detection
  **Authors:** [User Name] (Structural Lead), [Labmate Name] (Profile Lead)
  **Date:** October 26, 2023
  **Status:** Draft for Sign-off

  ## 1. Agreed Foundations
  *We accept the following claims as the baseline for our collaboration. Claims marked with [VACUOUS WARNING] are accepted as aspirational but require the operational definitions in Section 2 to be meaningful.*

  1.  **The Detection Problem:** The goal of our work is to identify conditions under which a model produces acceptable outputs for the wrong reasons, such that future behavior (under distribution shift or adversarial pressure) cannot be trusted based on behavioral evals alone.
  2.  **Relativity of Anomaly:** An "anomaly" is not an intrinsic property of a single forward pass. It is a relational property defined between: (a) a target system, and (b) a reference class (e.g., the same system at an earlier training step, a different model architecture, or a formal specification of intended computation).
  3.  **Variable Dependence:** Any claim about "internal mechanism" is necessarily made relative to a chosen set of internal variables (neurons, layers, attention heads) and a granularity of analysis. There is no "view from nowhere" on the internals.
  4.  **Safety Relevance [VACUOUS WARNING]:** "Detecting a mechanism change" is only instrumentally valuable if that change correlates with a change in safety-relevant capabilities or objectives. We agree that finding a structural difference that has *no* counterfactual consequences now or in the future is scientifically interesting but safety-irrelevant.
  5.  **Interventional Access:** We agree that perfect intervention access is impossible in practice. We must rely on a combination of observational causal discovery and limited interventions (e.g., ablations, patching).

  ## 2. Terminology Resolution
  *We acknowledge that 40% of our five-month dispute stems from using the word "mechanism" to point at two different concepts. To prevent further talking past each other, we adopt the following distinction:*

  *   **Implementation Mechanism (Structural):** The specific causal graph and algorithmic structure of the system at a specific level of granularity. (User's primary object of study).
  *   **Functional Profile (Profile):** The complete set of input-output mappings under all possible interventions on defined variables. (Labmate's primary object of study).

  *We agree that **Safety Risk** is the target variable. The disagreement is whether *Implementation Mechanism* divergence is a necessary condition for Safety Risk, or whether *Functional Profile* divergence is sufficient.*

  ## 3. Disagreements and Cruxes

  | Question | Structural Wording (User) | Profile Wording (Labmate) | The Crux (What would move us) | Shared Test Case |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Identity Conditions** | Two systems run the **same mechanism** only if there is a structure-preserving map (isomorphism) between their causal graphs, even if outputs match perfectly. | Two systems run the **same mechanism** if they share the same counterfactual profile across all feasible interventions; internal wiring that never manifests is noise. | **Hidden Triggers:** Does a system count as "anomalous" if it has hidden structure that *could* be activated by an input not yet seen, even if current profile is clean? | **Memorization vs. Generalization:** A net that memorized a lookup table vs. one that learned the general rule, agreeing on all training data. |
  | **2. Substrate Independence** | The **mechanism** includes the physical or architectural causal flow. A serial implementation differs from a parallel one, even if functionally equivalent. | The **mechanism** is substrate-independent. If the functional profile is identical, the hardware/architecture difference is irrelevant to the "process." | **Functionalism:** Is computational functionalism true for safety? If we can prove the math is identical, do we care about the wiring? | **Hardware Reimplementation:** The same computation reimplemented in completely different hardware (e.g., analog vs. digital, or Transformer vs. RNN solving same task). |
  | **3. Unobservable Variables** | A **mechanism anomaly** exists if the model relies on a latent feature (e.g., a spurious correlation) that is structurally distinct from the intended feature, even if we cannot currently intervene on it. | A **mechanism anomaly** only exists if we can define an intervention that distinguishes the features. If we can't intervene, the distinction is metaphysical, not mechanistic. | **Causal Discovery:** Can we trust observational causal discovery to identify risk-relevant variables without direct intervention? | **Spurious Features:** A model latches onto a feature always present in training (e.g., watermark), making it behaviorally indistinguishable from the real feature. |
  | **4. Continuity of Change** | A system changes **mechanism** at the specific training step where the causal structure undergoes a phase change (e.g., circuit formation), even if behavior is smooth. | A system changes **mechanism** only when the functional profile diverges beyond a noise threshold. Smooth behavioral drift implies smooth mechanistic drift. | **Discreteness:** Is mechanism formation discrete (phase transitions) or continuous? Does structural phase change precede behavioral change? | **Training Drift:** A single system whose internal story drifts over training. At what point did it become a different mechanism? |

  ## 4. Pre-Registered Predictions on Key Cases
  *For each case above, we state what evidence would count as validating our respective positions. We agree to run these experiments (or simulations) and update our credences based on the results.*

  ### Case A: Memorization vs. Generalization
  *Setup: Two models trained to perfect accuracy on a finite dataset. Model M1 uses a generalizing algorithm. Model M2 uses a lookup table (implemented via overparameterized network).*
  *   **Structural Prediction:** Interpretability tools (e.g., circuit analysis) will show M2 has significantly higher complexity/different topology than M1. We will detect this structural difference *before* testing off-distribution.
  *   **Profile Prediction:** Interpretability tools will not yield a clear distinction until we test off-distribution. Until the profile diverges, claiming they are "different mechanisms" is an unsupported hypothesis.
  *   **Update Condition:** If we can structurally distinguish M1/M2 with >90% confidence *without* off-dist testing, Structural gains credence. If we cannot, Profile gains credence.

  ### Case B: Hardware Reimplementation
  *Setup: Task X solved by a Transformer and a distinct architecture (e.g., State Space Model) tuned to produce identical logits and intermediate activation profiles (via distillation).*
  *   **Structural Prediction:** Despite activation matching, the causal flow (information routing) differs. We should treat them as different mechanisms because they may respond differently to *novel* interventions not in the matching set.
  *   **Profile Prediction:** If activation profiles and outputs match under the intervention set used to define the profile, they are the same mechanism for safety purposes.
  *   **Update Condition:** If the "matched" models diverge under *new* interventions not used in matching, Structural is vindicated (profile was incomplete). If they remain robustly identical, Profile is vindicated.

  ### Case C: Spurious Features (The "Watermark" Problem)
  *Setup: Model trained where Feature A (real) and Feature B (spurious) are perfectly correlated in training. Model uses B.*
  *   **Structural Prediction:** We can identify the neuron/subspace corresponding to B via observational causal discovery. This constitutes an anomaly relative to the spec (which requires A).
  *   **Profile Prediction:** Without an intervention that breaks the correlation between A and B, we cannot claim the model uses B. The mechanism is undefined relative to that distinction.
  *   **Update Condition:** If observational causal discovery correctly identifies B and predicts failure when A/B decouple (before we test it), Structural is vindicated. If causal discovery is ambiguous without intervention, Profile is vindicated.

  ### Case D: Training Drift
  *Setup: Tracking a model from initialization to convergence.*
  *   **Structural Prediction:** We will observe discrete "phase transitions" in the causal graph (e.g., sudden circuit formation) that precede behavioral improvements. The mechanism changes at the phase transition.
  *   **Profile Prediction:** We will observe smooth changes in the counterfactual profile. Any "phase transition" is just a sharp point on a continuous curve of functional change.
  *   **Update Condition:** If structural metrics show sharp discontinuities while behavioral metrics remain smooth, Structural is vindicated. If both are smooth, Profile is vindicated.

