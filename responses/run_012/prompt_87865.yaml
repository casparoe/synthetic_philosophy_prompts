prompt: |-
  Ok, I need a memo and I'm abit out of my depth with it, so bear with me.

  I sit on the advisory panel that's drafting the statute for the tribunal we're standing up over the war that ended last year. I'm the philosopher in the room; everyone else is a practitioner, and the prevailing mood is "just do what Nuremberg and Tokyo did and stop fussing". I'm the one who has to write the paper for Thursday's meeting, and the places where "do what Nuremberg did" stops being an answer are exactly the places nobody wants to look.

  You're a philosopher of law with a proper working knowledge of both of those trials. Please actually think before you write — start by jotting down the several different things "retroactive" can mean, because I'm fairly sure we're using the one word for three or four different complaints.

  The live question is whether our statute should carry a count of aggression — launching the war against the neighbouring state. I'll spell the facts out, because I'd rather you reasoned from what's in front of you than from half-remembered analogies. The fighting ran roughly 2019 to 2022. There's a treaty that bans it, but our defendant state only ratified that treaty in 2021, it entered a reservation, and it's written to bind states rather than individuals. The defendant state's own domestic law positively authorised the operations at the time, and the officers will say so. Some of the worst of it predates the ratification. And the bit that keeps derailing our meetings: two of the states funding us did something very similar over the same period, and everyone in the room knows it. One of the judges we've shortlisted has said, off the record, that she won't convict anyone of aggression she can't tell apart from what our own side was doing.

  Two smaller things to fold in. First, superior orders: my instinct is to copy the Nuremberg rule — obeying your government or a superior doesn't excuse you, but the court can weigh it when it fixes sentence — and I want to know whether that transplant takes, given that our defendants were doing something their own law positively required of them. Second, a colleague keeps saying the tribunal's authority will be made rather than found, that we'll earn it by how we run the thing rather than by pointing at a prohibition that already existed, and another colleague says that's just a politer way of saying the winners decide. I dont want that settled with a shrug.

  So, the memo. Bottom line first: include the aggression count or not; if we include it, what to do about the pre-2021 conduct; and the orders clause you'd actually drop into the statute, word for word, so we have something concrete to argue over. Then the reasoning, and then the strongest version of the case against your own recommendation, argued properly rather than as a strawman, since that's the part I'll get hammered on. Two pages, no footnotes, no reading list — it's an internal paper and nobody reads them anyway.

  The thing I'd most like your judgement on: what can we actually take from Nuremberg and Tokyo, and what can't we? They get cited in the room as though they were one precedent. I suspect they aren't, and that some of the differences matter to us rather than being trivia. I also want to know how the Nuremberg court got itself off the "you're inventing crimes after the fact" hook — if the answer turns out to be just "the winners said so", then we're in trouble.

  British English please, it's going to people who notice. Cheers.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**

      *   **Role:** Philosopher of Law with expertise in Nuremberg and Tokyo tribunals.
      *   **Task:** Write a 2-page internal memo for an advisory panel drafting a statute for a new war crimes tribunal.
      *   **Context:** War ended last year (2022), fighting ran 2019-2022. Defendant state ratified relevant treaty in 2021 (with reservation, state-binding). Domestic law authorized operations. Two funding states committed similar acts. One shortlisted judge refuses to convict on aggression if it looks like "victor's justice."
      *   **Key Issues:**
          1.  Include a count of Aggression (Crime Against Peace)?
          2.  How to handle pre-2021 conduct (retroactivity)?
          3.  Superior Orders clause (specific wording).
          4.  Legitimacy: "Authority made vs. found" vs. "Winners decide."
          5.  Nuremberg/Tokyo precedents: What holds, what doesn't? How did Nuremberg handle *nullum crimen sine lege*?
      *   **Format:** Memo, Bottom Line Up Front (BLUF), Reasoning, Strongest Counter-Argument. No footnotes, no reading list. British English. Max 2 pages (roughly 800-1000 words).
      *   **Tone:** Professional, philosophical but practical, rigorous, acknowledging the political sensitivity without caving to it.

  2.  **Deconstruct "Retroactivity" (as requested in the prompt's instruction to "think before you write"):**

      *   *Temporal:* Conduct happened before the law was written (ex post facto).
      *   *Jurisdictional:* Applying a tribunal's power to a state that didn't consent to *this* tribunal.
      *   *Substantive:* Criminalizing an act that was legal under domestic law at the time.
      *   *Individual vs. State:* The treaty binds states, but we are prosecuting individuals. This is a key Nuremberg innovation (and point of contention).

  3.  **Analyze Nuremberg/Tokyo Precedents:**

      *   *Nuremberg (IMT):* Charged Crimes Against Peace (Aggression). Defense argued *nullum crimen sine lege*. Court argued the Kellogg-Briand Pact (1928) made war illegal, so individuals planning it were criminal. It was "found" law, not "made" law, according to the judgment. Reality: It was victors' justice, but procedurally robust.
      *   *Tokyo (IMTFE):* Similar charges, but dissenting opinions (Pal, Röling) were much stronger on the *ex post facto* issue. Röling argued aggression is a political crime, not criminal.
      *   *Difference:* Nuremberg had a tighter legal frame; Tokyo was more overtly political/occupied territory.
      *   *Relevance:* We can't just copy-paste. The 2021 ratification is a weak link compared to Kellogg-Briand.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Bottom Line:** Needs to be decisive.
          *   *Aggression Count:* Include it, but limit temporal scope.
          *   *Pre-2021:* Exclude from Aggression count (charge as war crimes instead).
          *   *Superior Orders:* Nuremberg model (not a defence, but mitigation).
      *   **Reasoning:**
          *   *Retroactivity:* Distinguish between *malum in se* (wrong in itself) and *malum prohibitum*. Aggression is tricky. The 2021 treaty is the weak point. We must avoid the *ex post facto* trap for the pre-2021 period.
          *   *Nuremberg Lesson:* They didn't just say "winners decide." They leaned on the Kellogg-Briand Pact to show the *state* act was already illegal, then imputed that to individuals. We lack that pre-2021.
          *   *Legitimacy:* The "authority made not found" argument is dangerous if it admits to arbitrariness. It must be framed as "constitutive justice" – we are creating the condition for law to exist where it was absent.
          *   *Superior Orders:* Domestic law authorization is the trap. If we say "domestic law doesn't matter," we look imperialist. If we say "it matters," we grant immunity. Nuremberg solution: Domestic law doesn't excuse, but moral choice matters for sentencing.
      *   **Counter-Argument:**
          *   The "Victor's Justice" charge. If funders did the same, and we ignore it, the tribunal is a tool of policy, not law. The judge's refusal is a warning.
          *   The *Nullum Crimen* challenge is stronger here than at Nuremberg because the treaty reservation and timing are specific hurdles Nuremberg didn't have to the same degree (Kellogg-Briand was older and broader).

  5.  **Refining the Content (Self-Correction during drafting):**

      *   *Check:* Did I define "retroactive"? Yes, need to weave that into the reasoning.
      *   *Check:* British English (authorise, criminalise, programme, centre, etc.).
      *   *Check:* Word count. Keep it tight. No fluff.
      *   *Check:* The Superior Orders clause needs to be specific text.
      *   *Check:* Address the "authority made vs found" debate.
      *   *Check:* Address the Nuremberg "how they got off the hook" question.

  6.  **Drafting the Superior Orders Clause:**
      *   *Nuremberg Charter Art 8:* "The fact that the Defendant acted pursuant to order of his Government or of a superior shall not free him from responsibility, but may be considered in mitigation of punishment if the Tribunal determines that justice so requires."
      *   *Adaptation:* Need to acknowledge the domestic law aspect specifically.
      *   *Draft:* "The fact that the Accused acted pursuant to an order of the Government or a superior, or in accordance with domestic law in force at the time, shall not relieve them of criminal responsibility. However, the Tribunal may consider such circumstances in mitigation of sentence if it determines that justice so requires, particularly where the moral choice was effectively constrained."

  7.  **Drafting the Aggression Decision:**
      *   If we charge aggression pre-2021, we lose on *nullum crimen*.
      *   If we don't charge aggression at all, we ignore the root cause.
      *   *Solution:* Charge aggression only post-ratification (2021-2022). Pre-2021 acts charged as conventional war crimes (murder, destruction) which are customary law.
      *   *Wait, the prompt says:* "The defendant state only ratified that treaty in 2021... Some of the worst of it predates the ratification."
      *   *Problem:* Aggression is a leadership crime. Soldiers on the ground can't commit aggression. If we limit aggression to post-2021, we might miss the architects.
      *   *Better Solution:* Charge Aggression, but explicitly acknowledge the *lex scripta* gap pre-2021. Rely on Customary International Law (CIL) for pre-2021. But CIL on aggression is fuzzy.
      *   *Safest Philosophical/Legal Path:* Include the count. For pre-2021, argue that the prohibition on aggressive war was CIL *before* the treaty (Kellogg-Briand logic). But acknowledge the risk.
      *   *Actually, looking at the constraints:* The prompt asks for a recommendation. The most defensible position legally is to limit the *temporal jurisdiction* of the Aggression count to post-ratification, while using War Crimes for the earlier period. This sacrifices some justice for legitimacy.
      *   *Wait, re-reading the prompt:* "Two of the states funding us did something very similar... One of the judges... won't convict anyone of aggression she can't tell apart from what our own side was doing."
      *   *Hard Truth:* If we charge aggression, we invite the comparison. If the funders aren't charged, it looks biased.
      *   *Recommendation:* Include the count. It is the core moral purpose. But restrict temporal jurisdiction to post-2021 to satisfy *nullum crimen* regarding the treaty, relying on CIL for the principle but treaty for the specific definition. *Correction:* No, if CIL existed, the treaty date doesn't matter. The problem is the *reservation* and *state vs individual*.
      *   *Decision:* Recommend including the count. It distinguishes "war crimes" from "war itself." Address the retroactivity by distinguishing between *ex post facto* (forbidden) and declaratory law (permissible). Address the "funders" issue by narrowing the definition of aggression to *unprovoked invasion* specifically, distinguishing it from the funders' actions (assuming they were interventions/peacekeeping/etc., though the prompt implies they were "similar").
      *   *Actually, the most honest advice:* If the funders did the *same* thing, charging aggression undermines the tribunal. But as a philosopher of law, I must argue for the *principle*.
      *   *Revised Recommendation:* Include the count. It is necessary for the historical record. Limit pre-2021 aggression charges to avoid the *nullum crimen* trap, focusing on war crimes for that period. This concedes the legal point to save the moral one.

  8.  **Final Polish:**
      *   Ensure the distinction between Nuremberg and Tokyo is clear (Nuremberg = legalistic defense of precedent; Tokyo = more overt occupation justice).
      *   Ensure the "authority made vs found" is addressed.
      *   Check British spelling.
      *   Check length.

      *(Self-Correction on "Retroactive" definitions)*: I need to make sure I explicitly clarify the meanings of retroactivity in the reasoning section as requested ("start by jotting down..."). I will weave this into the "Reasoning" section rather than a separate list, to save space and maintain memo flow, but ensure the distinctions are clear.

      *(Refining the Superior Orders Clause)*: The prompt asks for the words to drop into the statute. I will provide a specific article text.

      *(Refining the Nuremberg analysis)*: How did they get off the hook? They argued the Kellogg-Briand pact rendered war illegal, so doing it was a crime. They claimed they were *declaring* existing law, not *making* new law. We need to assess if we can make that claim.

      *(Final Plan)*:
      1. Header.
      2. Bottom Line (Aggression: Yes, with temporal limit; Orders: Nuremberg standard; Legitimacy: Constitutive).
      3. Reasoning (Retroactivity distinctions, Nuremberg vs Tokyo, Superior Orders, Legitimacy).
