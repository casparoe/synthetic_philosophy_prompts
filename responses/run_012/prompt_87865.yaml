answer: |-
  **MEMORANDUM**

  **TO:** Advisory Panel, Tribunal Statute Drafting Committee
  **FROM:** Legal Philosophy Consultant
  **DATE:** 14 October 2023
  **SUBJECT:** Statute Drafting: Aggression, Retroactivity, and Superior Orders

  **BOTTOM LINE**

  1.  **Aggression Count:** Include it. A tribunal that ignores the crime of launching the war fails its primary moral purpose. However, to satisfy *nullum crimen sine lege* (no crime without law), the Aggression count must apply only to conduct post-dating the 2021 treaty ratification. Pre-2021 conduct should be charged as conventional war crimes (murder, destruction), which rest on customary international law unaffected by the treaty date.
  2.  **Superior Orders:** Adopt the Nuremberg standard verbatim, with a specific addition regarding domestic law. See proposed text below.
  3.  **Legitimacy:** We must reject the notion that authority is merely "made." We are not creating law *ex nihilo*; we are enforcing a pre-existing moral prohibition that lacked a court. If we cannot distinguish our funders' conduct from the Defendant's, we cannot charge Aggression without destroying the Tribunal's credibility.

  **Proposed Statute Text (Superior Orders):**
  > *Article X: Superior Orders and Domestic Law*
  > 1. The fact that the Accused acted pursuant to an order of the Government or a superior, or in accordance with domestic law in force at the time, shall not relieve them of criminal responsibility.
  > 2. The Tribunal may, however, consider such circumstances in mitigation of sentence if it determines that justice so requires, particularly where the moral choice was effectively constrained by the threat of immediate sanction.

  **REASONING**

  **1. The Ambiguity of "Retroactivity"**
  We are conflating three distinct complaints under the label "retroactive." We must disentangle them to draft defensibly.
  *   *Temporal:* Punishing acts committed before the statute existed. This is generally forbidden unless the act was already criminal under customary law.
  *   *Jurisdictional:* Subjecting a state to a tribunal it did not consent to. This is solved by the UN mandate or the nature of *jus cogens* norms.
  *   *Substantive:* Criminalising an act that was legal under the defendant's domestic law at the time. This is the core tension. Nuremberg established that domestic legality is irrelevant to international criminality. We must hold this line, or "war crimes" becomes a synonym for "lost wars."

  **2. Nuremberg and Tokyo: What Holds?**
  The room treats IMT (Nuremberg) and IMTFE (Tokyo) as identical. They are not. Nuremberg survived legal scrutiny because it leaned heavily on the Kellogg-Briand Pact (1928) to argue that aggressive war was already illegal *before* the Nazis acted. The Court claimed it was *finding* law, not *making* it. Tokyo was legally shakier; the dissenting opinions (notably Justice Pal) successfully argued it was pure victor's justice, as the Allies had not disavowed colonialism or imperialism.

  We cannot simply copy Nuremberg because our factual predicate is weaker. The Defendant State ratified the prohibitory treaty in 2021, with reservations. We cannot claim the 2019-2021 conduct violated *that* treaty. To charge Aggression for that period, we must prove the prohibition existed as Customary International Law (CIL) independent of the treaty. If we cannot prove CIL status, charging pre-2021 aggression is *ex post facto* punishment. Limiting the Aggression count to post-2021 preserves the charge while respecting the principle of legality.

  **3. Superior Orders and Domestic Authorization**
  Your instinct is correct: we must transplant the Nuremberg rule. If domestic authorisation excuses the accused, the Tribunal is useless; every defendant will produce a statute signed by the dictator. However, the "moral choice" test is vital. At Nuremberg, the defence argued that disobedience meant death. The Charter allowed mitigation. Our proposed text above clarifies that domestic law is no *defence*, but the coercion inherent in a totalitarian legal system is relevant to *sentencing*. This balances the need for accountability with fairness to conscripts or lower-level functionaries.

  **4. Authority: Made or Found?**
  The colleague who says authority is "made, not found" is half-right, but dangerous. If we admit we are inventing law, we confirm the "winners decide" critique. We must argue that the Tribunal is *constitutive*. The law existed as a moral and customary norm, but lacked an institutional voice. We are providing the voice, not the norm. However, this only works if we apply the norm consistently. If the funding states committed similar acts of aggression and are immune, the "constitutive" argument collapses into "victor's justice."

  **THE STRONGEST CASE AGAINST THIS RECOMMENDATION**

  You will be hammered on the "Victor's Justice" point, and the critique is legally sound.

  At Nuremberg, the Allies could plausibly argue they had not committed *Crimes Against Peace* in the same manner as the Axis (regarding the specific wars charged). Here, you state two funding states did "something very similar." If the shortlisted judge refuses to convict on aggression she cannot distinguish from our side's conduct, she is invoking the principle of *equality before the law*.

  If we include the Aggression count but lack the political will to investigate the funding states, the Tribunal becomes a tool of policy, not law. The defence will argue that the prohibition on aggression is selectively applied, rendering it arbitrary. In domestic law, arbitrary enforcement can vitiate a statute. In international law, it destroys legitimacy.

  Furthermore, limiting the Aggression count to post-2021 (to avoid retroactivity) may look like a legalistic fudge. It admits that pre-2021 aggression was not criminal, which undermines the moral narrative that the war itself was the crime. It creates a perverse incentive: defendants will argue the worst atrocities were committed in 2020, precisely when Aggression was not chargeable.

  Finally, the "domestic law" clause remains a flashpoint. If the Defendant State's officers were legally obligated to shoot, and we hang them for it, we are imposing an external moral standard that overrides their social contract. Nuremberg worked because the Nazi laws were deemed manifestly illegitimate. If the Defendant State was a functioning democracy until 2020, the "moral choice" argument is harder to sustain. We risk punishing men for loyalty to a state that we now deem criminal, which is the very definition of *ex post facto* justice.

  **Recommendation:** Proceed with the Aggression count but prepare a public doctrinal paper distinguishing the funders' conduct from the Defendant's *before* indictments are issued. If we cannot distinguish them legally, we must drop the count, or the Tribunal will be remembered as a show trial.
