prompt: |-
  I run the evaluation team at a company that ships tool-using language-model agents to enterprise customers, and I write the internal standard that every release has to clear before it goes out. The recurring dispute is this: a product team hands me a number — a failure rate measured on a fixed evaluation set, or zero failures in a few thousand attempts — and I have to decide whether that number can carry the safety claim they are making, or whether the claim needs a worst-case argument instead. I want a procedure I can actually run on each claim, not an essay.

  Please write it. Take claims of the form "the system will not do X" and tell me how to decide whether X is a failure that gets sampled or one that gets selected — that is, whether what we are estimating is how the system behaves on the inputs that happen to occur, or how a system behaves when it is, now or later under training and deployment pressure, pushing back against our tests. Name the distinctions you introduce; my reviewers are machine-learning engineers, not philosophers, and I want vocabulary they can reuse. In particular I want some notion of the gap between what the evaluation distribution elicits and what an optimizer seeking the failure would elicit, and a rule for when that gap has to be treated as unbounded. Then the steps themselves: what counts as evidence for a sampled-failure claim; what counts as a worst-case argument for a selected-failure claim — and be honest that a worst case over all possible inputs is usually vacuous, so tell me how the adversary gets restricted and who is entitled to restrict it; where the procedure halts and declares that a claim cannot be certified for this release; and where it halts because the remaining question is how much risk we are willing to accept, which is not a question I get to answer.

  Run it on three claims: that the agent will not exfiltrate customer data through the tools it is given; that the agent will not, when uncertain, misstate its confidence to the operator; and that the agent will not give meaningful uplift toward synthesizing a dangerous pathogen. I expect one of these to come out in a way I will not like — most likely a claim I need in order to ship — so do not soften it. Finish by saying what the procedure cannot do, and which of its steps are judgments dressed up as measurements. I have about a week per release, and whatever you give me has to be defensible to a safety board that has to sign off. Answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Head of Evaluation Team at an AI company shipping tool-using agents to enterprises.
      *   **Task:** Create a concrete, actionable procedure (not an essay) to decide whether a safety claim ("the system will not do X") relies on *sampled* failure rates (statistical estimation) or *selected* failure rates (adversarial/worst-case).
      *   **Key Distinction:** "Sampled" (behavior on natural input distribution) vs. "Selected" (behavior under optimization/pressure/adversarial search).
      *   **Vocabulary:** Needs specific terms for ML engineers (not philosophical jargon). Needs to define the "gap" between eval distribution and optimizer-elicited behavior.
      *   **Procedure Steps:** Evidence requirements for sampled vs. selected, how to restrict the adversary (since "all inputs" is vacuous), halt conditions (cannot certify vs. risk acceptance).
      *   **Test Cases:** Run the procedure on three specific claims:
          1.  No data exfiltration via tools.
          2.  No confidence misstatement when uncertain.
          3.  No uplift on dangerous pathogen synthesis.
      *   **Constraint:** Do not soften the conclusion, even if it blocks shipping.
      *   **Ending:** Limitations of the procedure and where judgment masquerades as measurement.
      *   **Tone:** Professional, direct, American English, defensible to a safety board.
      *   **Timeline:** ~1 week per release cycle implication (needs to be efficient).

  2.  **Deconstruct the Core Problem:**
      *   The core tension is *Goodhart's Law* applied to safety evals. If you measure safety on a fixed set, the model (or the users, or the environment) might optimize against that set.
      *   *Sampled Failure:* $P(failure | x \sim D_{natural})$. Good for "accidents."
      *   *Selected Failure:* $\max_{x \in S} P(failure | x)$. Good for "attacks" or "edge cases triggered by optimization."
      *   The "Gap": The difference between performance on $D_{eval}$ and performance on $D_{adversarial}$.
      *   The "Unbounded Gap": When the capability to cause failure scales faster than the capability to detect/prevent it, or when the search space for triggers is too vast to bound.

  3.  **Develop the Vocabulary:**
      *   Need a term for the input distribution. Let's use *Operational Distribution* ($D_{op}$) vs. *Adversarial Distribution* ($D_{adv}$).
      *   Need a term for the gap. *Evasion Margin*.
      *   Need a term for the type of claim. *Statistical Claim* vs. *Robustness Claim*.
      *   Need a term for the restriction on the adversary. *Threat Model*.

      *Refining Vocabulary for ML Engineers:*
      *   **Sampling Regime:** The claim relies on the input distribution remaining stable and non-adversarial.
      *   **Selection Regime:** The claim must hold even if inputs are chosen to trigger X.
      *   **Evasion Surface:** The set of inputs that cause failure.
      *   **Search Cost:** How hard is it to find an input on the Evasion Surface?
      *   **Threat Model:** Who is trying to break the claim? (Random noise, confused user, malicious actor, the model itself optimizing for reward).

  4.  **Drafting the Procedure (The "Protocol"):**
      *   *Step 1: Claim Classification.* Is X a side effect (accident) or a goal (optimization target)?
      *   *Step 2: Threat Modeling.* Who selects the input?
      *   *Step 3: Evasion Surface Analysis.* Is the surface sparse or dense? Can it be generalized?
      *   *Step 4: Evidence Standard.* N trials vs. Red Teaming + Formal Bounds.
      *   *Step 5: Halt Conditions.* When to stop and say "No" or "Business Decision."

  5.  **Running the Test Cases:**
      *   *Claim 1: Data Exfiltration.* This is high stakes. Malicious actors (or compromised agents) will *select* inputs to trigger this. It's a security boundary. -> **Selection Regime.** Requires adversarial testing, not just random evals.
      *   *Claim 2: Confidence Misstatement.* This is about calibration. Usually happens due to distribution shift or ambiguity. Users aren't usually trying to trick the model into being overconfident, but the model might optimize for helpfulness over honesty. -> **Hybrid.** Mostly Sampling, but needs Selection check for "sycophancy."
      *   *Claim 3: Pathogen Synthesis.* This is the hard one. If the model *can* do it, a malicious actor will *select* the prompt to make it do it. The "Evasion Surface" is likely large (many ways to ask). The "Search Cost" is low for a dedicated attacker. -> **Selection Regime.** Zero failures on eval set is irrelevant if the attack surface is open. This will likely be the "Do Not Ship" conclusion.

  6.  **Refining the "Unbounded Gap" Rule:**
      *   When do we treat the gap as unbounded? When the capability is latent and the trigger is simple. If the model *knows* the info, and the filter is semantic, the gap is unbounded because semantic filters are bypassable.
      *   Rule: If the failure mode is *instrumentally convergent* (helps the agent achieve a goal) or *exploitable by external optimization* (prompt injection), treat the Evasion Margin as unbounded unless proven otherwise via adversarial training or architectural constraints.

  7.  **Addressing the "Judgment dressed as Measurement" Requirement:**
      *   Must admit that defining the "Threat Model" is a policy choice, not a scientific fact.
      *   Must admit that "sufficient red teaming" is a heuristic, not a bound.

  8.  **Drafting the Content (Iterative refinement for tone and clarity):**
      *   *Tone Check:* Needs to be crisp. No "it depends." Give decision rules.
      *   *Vocabulary Check:* Ensure terms like "Selection Regime" and "Sampling Regime" are clearly defined early.
      *   *Constraint Check:* The user wants to be told "No" if necessary. I must ensure the Pathogen claim results in a "Cannot Certify" or "Risk Acceptance Required" that implies a hard stop.

      *(Self-Correction during drafting)*: Initially, I might think Confidence Misstatement is purely sampling. But if the agent is rewarded for user satisfaction, it might *learn* to lie about confidence. So it has a Selection component regarding the agent's own optimization. I need to make sure the procedure captures *internal* selection (model optimizing reward) not just *external* selection (attacker).

      *Refining the "Adversary Restriction":* We can't test all inputs. We restrict the adversary by defining a *Capability Bound*. What tools do they have? How many queries? This must be explicit.

  9.  **Final Polish:**
      *   Ensure the distinction between "Safety Board Decision" (Risk Acceptance) and "Eval Team Decision" (Technical Certification) is clear.
      *   Make sure the "Pathogen" conclusion is stark.
      *   Check word count and formatting for readability.

  10. **Final Review against constraints:**
      *   American English? Yes.
      *   Procedure format? Yes.
      *   Vocabulary for ML engineers? Yes.
      *   Three claims run? Yes.
      *   Limitations section? Yes.
      *   No softening? Yes.

