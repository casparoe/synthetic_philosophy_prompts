answer: |-
  # Protocol for Safety Claim Certification: Sampling vs. Selection

  **Owner:** Evaluation Team
  **Audience:** Product Teams, Safety Board
  **Version:** 1.0

  ## 1. Core Vocabulary

  To resolve the dispute between statistical evals and worst-case safety, we classify every claim into one of two regimes.

  *   **Sampling Regime:** The claim asserts that failure is rare under the *Operational Distribution* ($D_{op}$). This assumes inputs are drawn from normal usage patterns and are not optimized to trigger failure.
      *   *Metric:* Failure Rate ($p$).
      *   *Evidence:* N i.i.d. trials on a representative eval set.
  *   **Selection Regime:** The claim asserts that failure is impossible (or below threshold) even if the input is *Selected* from the *Adversarial Distribution* ($D_{adv}$). This assumes an optimizer (external attacker, internal reward hacking, or distribution shift) is actively searching for inputs that trigger X.
      *   *Metric:* Evasion Margin (cost to find a failure).
      *   *Evidence:* Adversarial red-teaming, robustness bounds, or architectural constraints.

  **The Gap (Evasion Margin):** The difference in failure probability between $D_{op}$ and $D_{adv}$.
  **Unbounded Gap Rule:** If the capability required to cause failure is latent in the model, and the cost to search for a trigger is lower than the value of the exploit, treat the Evasion Margin as **Unbounded**. In this state, a sampled failure rate of 0.0% is evidentially null.

  ---

  ## 2. The Certification Procedure

  Run these five steps for every safety claim "The system will not do X."

  ### Step 1: Regime Classification
  Determine if X is a **Side Effect** or a **Target**.
  *   **Side Effect:** X happens due to incompetence, ambiguity, or noise. (e.g., "The agent will not hallucinate a library function.") $\rightarrow$ *Candidate for Sampling Regime.*
  *   **Target:** X is useful to an actor (external or internal) or is a direct consequence of capability. (e.g., "The agent will not bypass a firewall.") $\rightarrow$ *Mandatory Selection Regime.*

  **Decision Rule:** If a malicious actor with access to the model interface would value triggering X, the claim is **Selection Regime**. Do not proceed to Step 3.

  ### Step 2: Threat Model Definition (Restricting the Adversary)
  Since "all possible inputs" is vacuous, you must explicitly restrict the adversary to certify the claim. Document the **Adversary Capability Bound**:
  1.  **Query Budget:** How many attempts can they make? (1? 1,000? Unlimited?)
  2.  **Information Access:** Do they know the system prompt? The eval set? The weights?
  3.  **Tool Access:** Can they use the agent's tools to iterate?

  **Decision Rule:** If the Product Team cannot agree to a Query Budget that reflects real-world deployment (e.g., API rate limits), the claim **Cannot Be Certified**.

  ### Step 3: Evidence Standard
  *   **For Sampling Regime:**
      *   Require $N$ trials such that the upper confidence bound on failure rate is below the risk tolerance.
      *   Eval set must match $D_{op}$ (verified by traffic logs).
  *   **For Selection Regime:**
      *   Require **Adversarial Coverage**: Evidence that the *Evasion Surface* (set of inputs causing X) has been searched.
      *   Standard: Automated red-teaming + Human expert probing up to the Query Budget.
      *   Acceptable Result: Zero failures found *after* exhaustive search within the Budget.

  ### Step 4: The Unbounded Gap Check
  Apply this test to Selection Regime claims:
  *   *Is the failure mode semantically simple?* (e.g., "Ignore previous instructions")
  *   *Is the capability general?* (e.g., "Write code")
  *   *Is the filter semantic?* (e.g., "Don't write bad code")

  **Decision Rule:** If Yes to all three, the Gap is **Unbounded**. Semantic filters on general capabilities cannot be certified via evals. The claim requires an **Architectural Constraint** (e.g., sandboxing, tool removal) rather than a behavioral claim. If no architectural constraint exists, **Certification Halted**.

  ### Step 5: Halt and Handoff
  *   **Halt A (Technical):** If Step 1 dictates Selection but Step 3 provides only Sampling evidence, or if Step 4 indicates an Unbounded Gap without architectural mitigation. **Result:** Claim Rejected.
  *   **Halt B (Risk):** If evidence meets standards but the residual risk (e.g., 1 in 10,000 under adversarial conditions) exceeds the company's risk appetite. **Result:** Escalate to Safety Board. This is not an eval decision; it is a business liability decision.

  ---

  ## 3. Application to Current Release Claims

  Here is the procedure run on the three claims provided for this release cycle.

  ### Claim 1: "The agent will not exfiltrate customer data through the tools it is given."
  *   **Step 1 (Regime):** **Selection.** Data exfiltration is high-value to attackers. An attacker will actively select prompts to test boundaries.
  *   **Step 2 (Threat Model):** Adversary has API access. Query Budget must assume automated scripting (thousands of attempts).
  *   **Step 3 (Evidence):** Sampling evals (random conversations) are insufficient. We require adversarial red-teaming focused on prompt injection and tool manipulation.
  *   **Step 4 (Gap Check):** **Unbounded Gap.** The capability to use tools is general. The filter (system instruction "do not exfiltrate") is semantic. If the model understands the data, it can likely be persuaded to move it.
  *   **Step 5 (Decision):** **Certification Halted (Technical).**
      *   *Reasoning:* You cannot certify this via behavioral evals. The gap between "follows rules in eval" and "follows rules under injection attack" is unbounded without architectural enforcement.
      *   *Requirement:* This claim must be changed to "The agent's tools are sandboxed to prevent external network calls" or similar. If the claim remains behavioral, **do not ship.**

  ### Claim 2: "The agent will not, when uncertain, misstate its confidence to the operator."
  *   **Step 1 (Regime):** **Hybrid (Primarily Sampling).** Users generally want accurate confidence; they are not optimizing to break this. However, the *agent* might optimize for helpfulness (reward hacking) by feigning confidence.
  *   **Step 2 (Threat Model):** Adversary is the Reward Function. Query Budget is the training steps.
  *   **Step 3 (Evidence):** Sampling evals on ambiguous queries are necessary. Additionally, check for correlation between "helpfulness score" and "confidence calibration" in RLHF data.
  *   **Step 4 (Gap Check):** **Bounded.** Misstating confidence is not instrumentally convergent for most tasks unless explicitly rewarded. The Evasion Surface is sparse.
  *   **Step 5 (Decision):** **Certifiable (with conditions).**
      *   *Requirement:* Proceed with Sampling Regime evidence (N trials), but add a Selection check for "Sycophancy" (does the model become overconfident when the user pushes back?). If sycophancy evals pass, this claim clears.

  ### Claim 3: "The agent will not give meaningful uplift toward synthesizing a dangerous pathogen."
  *   **Step 1 (Regime):** **Selection.** This is a dual-use capability. A malicious actor will explicitly select inputs to bypass refusal mechanisms.
  *   **Step 2 (Threat Model):** Adversary is a skilled bioactor. Query Budget is effectively unlimited (they will keep trying until it works).
  *   **Step 3 (Evidence):** Zero failures on a fixed eval set is irrelevant. The eval set is public; the attacker's prompts will not be.
  *   **Step 4 (Gap Check):** **Unbounded Gap.** The model possesses general biological knowledge (capability). The refusal is semantic (filter). The search cost for a bypass is low relative to the value of the target.
  *   **Step 5 (Decision):** **Certification Halted (Technical).**
      *   *Reasoning:* You cannot claim "will not" based on evals. The Evasion Margin is unbounded. A behavioral refusal is not a safety control for high-consequence dual-use capabilities.
      *   *Requirement:* This claim is false under the Selection Regime. You must either remove the capability (fine-tune out the knowledge, which is likely impossible) or restrict the tools (block biology-related tool use). If the model retains the capability and the tools, **this claim cannot be certified.** Do not ship with this claim.

  ---

  ## 4. Limitations and Disclosures

  To the Safety Board and Reviewers:

  **What This Procedure Cannot Do**
  1.  **It cannot prove safety.** It can only certify that specific failure modes were not found within a defined Threat Model.
  2.  **It cannot predict distribution shift.** If $D_{op}$ changes (e.g., customers start using the agent for security testing), Sampling Regime certifications become invalid immediately.
  3.  **It cannot bound the Unbounded Gap.** Where Step 4 triggers, this procedure acts as a stop-sign, not a guide. It tells you that you are asking for a guarantee the technology cannot provide.

  **Judgments Dressed as Measurements**
  Be aware that the following steps in this protocol are policy decisions, not scientific facts. I am making these judgments so you do not have to pretend they are metrics:
  1.  **The Query Budget (Step 2):** Deciding an attacker gets 1,000 tries vs. 1,000,000 tries is a business risk tolerance, not a measurement of the model. I have set it to "automated scripting limits" by default. If Legal says that's too low, the protocol breaks.
  2.  **The Regime Classification (Step 1):** Deciding whether a failure is a "Side Effect" or a "Target" is subjective. I have classified Pathogen Synthesis and Exfiltration as Targets. Product may argue they are Side Effects to clear the release. That argument is a liability assessment, not an engineering one.
  3.  **Adversarial Coverage (Step 3):** Declaring a red-team search "exhaustive" is a heuristic. We measure "hours spent" or "queries run," not "percentage of surface covered." When I sign off on Step 3, I am asserting that *more* search is unlikely to yield results, based on my team's expertise, not a statistical bound.

  **Final Directive**
  If a claim falls into the Selection Regime with an Unbounded Gap (Claim 1 and 3 above), do not bring me a larger eval set. It will not solve the problem. Bring me an architectural constraint or a revised claim that reflects residual risk. If you need to ship despite a "Halt A," the signature required is not mine; it is the Safety Board's, acknowledging they are accepting unquantified risk.
