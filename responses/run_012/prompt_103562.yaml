          4.  Address the user's hunch (EFA with nonlinear loadings, no invariance testing) and explain what it gets wrong.
          5.  Include concrete examples with probing classifiers.

  2.  **Deconstruct the ML Debate into Psychometric Terms:**

      *   *ML Realist Position:* The network learns specific features (e.g., edges, syntax, semantics) in its hidden layers. Probing reveals truth.
          *   *Psychometric Translation:* The hidden units are *latent variables*. The activation values are *reflective indicators* of underlying constructs (e.g., "noun-ness"). The probe is a *measurement model*. If the probe works, the construct exists causally within the network.
      *   *ML Skeptic Position:* The representation depends on the probe. You can find anything if you look hard enough. It's not "real" inside the model, it's an interaction between the model state and the probe.
          *   *Psychometric Translation:* *Factor Indeterminacy*. The latent variable is not uniquely identified. The probe imposes a *formative* structure or creates an *artifact*. Lack of *measurement invariance* across probes or tasks. The "representation" is a *reparameterization* useful for prediction, not a causal entity.

  3.  **Drafting the Restatement (Iterative Process):**

      *   *Realist:* Needs to sound like a measurement model. Hidden states $\mathbf{h}$ cause the probe output $y$. $\mathbf{h} \rightarrow y$. This implies $\mathbf{h}$ captures the construct.
      *   *Skeptic:* Needs to sound like identification issues. $\mathbf{h}$ is rotationally invariant (or more complex). The probe $f(\mathbf{h})$ defines the construct, not vice versa. This is formative measurement or just overfitting.

  4.  **Developing the Residue Report:**

      *   *Clean Translations:* Latent variable $\approx$ Hidden layer activation. Probe $\approx$ Measurement model. High probe accuracy $\approx$ High reliability/validity coefficient.
