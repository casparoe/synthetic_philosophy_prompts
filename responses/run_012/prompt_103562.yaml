  10. **Final Polish:** Organize with clear headings. Ensure the "Residue Report" is tabular or bulleted for readability. (Proceed to generate output based on these thoughts).

  *(Self-Correction Note during final output generation)*: Make sure to explicitly mention *Factor Indeterminacy* in the context of linear probing. If $W$ is the probe weights, and $W' = W + \delta$ where $\delta$ is in the null space of the activations, the probe changes but predictions don't. This is classic indeterminacy.

  Also, emphasize the *Causal* aspect. In SEM, $\eta \rightarrow y$. In NN probing, $h \rightarrow y_{probe}$. But $h$ was caused by $x$. So $h$ is an intervening variable. The "construct" is often defined by $y_{probe}$. This is circular if not careful.

