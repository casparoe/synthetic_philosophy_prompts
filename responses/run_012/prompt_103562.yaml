prompt: |-
  I'm a psychometrics PhD student (SEM, measurement theory, construct validity) and I keep getting pulled into arguements with ML people about whether neural nets have representations. The realists say interpretability is discovering the model's internal representation of some feature; the skeptics say it's a useful fiction or just a projection of the probe. Restate both positions in my vocabulary as faithfully as you can -- latent variables, reflective vs formative indicators, identifiability and factor indeterminacy, measurement invariance, construct validity, the difference between a latent variable as a convenient reparameterization and as a causal entity -- and then give me the residue report. What translates cleanly, what only translates with distortion, and what has no counterpart at all? Is the residue a defect of my framework or a sign that the ML debate is less substantive than it looks? My hunch is that a lot of it is just exploratory factor analysis with nonlinear loadings and no invariance testing, but tell me what that hunch gets wrong. Concrete examples with probing classifiers would help.
