      *   **User Persona:** Psychometrics PhD student. Expertise in Structural Equation Modeling (SEM), measurement theory, construct validity, latent variables, identifiability, etc.
      *   **Context:** Frequent arguments with Machine Learning (ML) researchers about whether Neural Networks (NNs) have "representations."
      *   **The Debate:** Realists (interpretability = discovering internal representations) vs. Skeptics (representations = useful fiction/probe projection).
