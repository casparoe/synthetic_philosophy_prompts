      *   *No Counterpart:* *Overparameterization/Double Descent.* Psychometrics usually worries about $N < p$ or identification; ML thrives in $p \gg N$. *Gradient Flow/Learning Dynamics.* Psychometrics is static (covariance structure); ML is dynamic (optimization trajectory). *Superposition.* Multiple features in one neuron (polysemanticity) vs. simple structure.

  5.  **Evaluating the Residue:**

      *   Is it a defect of Psychometrics? Partially. Psychometrics assumes low-dimensional, identifiable structures. ML assumes high-dimensional, redundant, distributed coding.
      *   Is the ML debate less substantive? No, it's about *ontology*. But the lack of formal measurement theory in ML makes it look like philosophy rather than science.

  6.  **Addressing the User's Hunch ("EFA with nonlinear loadings and no invariance testing"):**

      *   *What it gets right:* Probing *is* essentially checking if a linear/nonlinear combination of hidden units predicts a label. Lack of invariance testing is a huge problem in ML interpretability (probe results change with architecture, seed, training data).
      *   *What it gets wrong:*
          1.  **Superposition:** Psychometrics assumes local independence (mostly) and simple structure (one indicator loads on one factor). NNs use *superposition* (one neuron encodes multiple features depending on context).
