  Dear Novelist,

  It is a rare pleasure to encounter a fictional conceit that cuts so precisely to the bone of a longstanding philosophical difficulty. Your connoisseur is attempting to solve a problem that has troubled ethicists and psychologists since the Greeks, and your intuition that the word pleasure names a role rather than a quality is remarkably astute. You are asking for the precise name and shape of the problem where a theory insists on a single name and a single currency for things that share no common measure. The established term most often used in philosophical literature is the Heterogeneity Problem, sometimes called the Heterogeneity Objection to Hedonism. This problem asserts that there is no single phenomenological quality common to all experiences we call pleasurable, such that the taste of an oyster and the resolution of a fugue do not share a specific feeling-tone any more than they share a color or a shape. However, I suspect this term may feel slightly insufficient for your purposes because it focuses primarily on the lack of common feeling, whereas your character is engaged in an economic act of translation. He is not merely observing that pleasures feel different; he is actively forcing them into a single ledger, treating them as commensurable units despite their heterogeneity.

  To carve this out precisely, we must distinguish it from two neighboring concepts you mentioned. The first is the problem of comparing unlike goods, often discussed under the header of Incommensurability. Incommensurability typically arises when we try to weigh two different values against one another, such as justice versus mercy, or liberty versus security. In those cases, we admit there are two different currencies and struggle to find an exchange rate. Your character's problem is more radical because he insists there is only one currency. He is not trying to exchange justice for pleasure; he is trying to exchange an oyster for a fugue under the banner of a single good. The second concept to distinguish is the idea that pleasures differ in kind, which is the cornerstone of Qualitative Hedonism, most famously associated with John Stuart Mill. Mill argued that pleasures do differ in quality, some being higher and some lower, but he maintained they were still all pleasures. Your character goes a step further into a kind of fiction; he treats them as quantitatively comparable units in a ledger even if, as you say, they have nothing in common except that he wants them. This suggests his theory is not truly hedonistic in the sensory sense, but rather a form of Desire Satisfaction Theory masquerading as Hedonism.

  Given that the established term Heterogeneity Problem focuses on the feeling rather than the currency, and that Reification is a broader metaphysical error, I propose that the precise shape of your character's error is best captured by a coined term: the Fallacy of Hedonic Reification. This term defines the specific mistake of treating a functional relation as a substantive property. In your character's ledger, pleasure is a functional role; it is whatever occupies the slot of being desired or ranked highly. However, he reifies this function, treating it as if it were a substantive substance like gold or calories that flows from the oyster to the fugue. He mistakes the label for the material. The boundary cases for this fallacy are instructive for your narrative. On one side, you have sensory pleasures, like the taste of wine or the warmth of a bath, which do share a common bodily feeling-tone. In these cases, the reification is less obvious because there is a phenomenological glue holding the category together. On the other side, you have what we might call structural or intellectual pleasures, such as the satisfaction of a solved puzzle, the relief of a burden, or the memory of a victory. These share no common feeling, only a common direction of fit toward the subject's desires. When your character ranks the smell of a childhood kitchen against the resolution of a fugue, he is committing the Fallacy of Hedonic Reification by assuming a common substance exists to be measured where only a common function exists to be performed.

  This carving allows your character to defend his life as a pursuit of pleasure while remaining philosophically consistent in his inconsistency. He is a nominalist who acts like a realist. He knows, perhaps deep down, that the entries share no common quality, but his economy requires them to be fungible. This tension is the engine of his drama. He is not merely measuring; he is creating the currency by the act of measurement. If you need a phrase to describe the shape of the problem itself, rather than the error, you might call it the Tension Between Axiological Monism and Phenomenological Pluralism. This describes the state of affairs where one insists on a single value system while acknowledging a multiplicity of experiences. However, for the specific act of treating these heterogeneous things as a single tradable currency without a common measure, the Fallacy of Hedonic Reification offers the sharpest tool. It captures the alchemy your character performs, turning the lead of disparate desires into the gold of a single ledger, not by finding a common element, but by insisting on the name. I hope this provides the precise terminology you need to anchor your character's rationale in a tradition of thought that has long struggled with the same elusive substance.

  Yours sincerely,

  A Student of Philosophy
