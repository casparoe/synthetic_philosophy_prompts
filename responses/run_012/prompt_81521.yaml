answer: |-
  Here are the desiderata for a resolution to the St. Petersburg Paradox (SPP), classified by necessity and theoretical commitment, followed by the structural conflicts and an assessment of the standard candidates.

  ### The Desiderata List

  **1. Valuation Completeness**
  *   **The Requirement:** The resolution must explain the intuitive gap between paying \$20 (reasonable) and \$1000 (irrational), even if it claims the "true" value is infinite. If it asserts "no fact of the matter," it must explain why the agent refusing \$1000 isn't making a mistake.
  *   **The Case:** A paradox resolution that doesn't align with basic risk intuition is just a mathematical curiosity. It must account for actual decision behavior.
  *   **Status:** **Non-negotiable.** (Without this, you haven't resolved the *paradox*, only the equation.)

  **2. Idealization Coherence**
  *   **The Requirement:** The solution must address the mathematical idealization (infinite bankroll, infinite time, fair coin). It cannot rely on "casinos go broke" or "you will die" as the primary mechanism unless it also solves the idealized case for a immortal agent with a god-bank.
  *   **The Case:** Relying on physical limits changes the subject from decision theory to physics. The paradox exists in the expectation calculus, not the warehouse.
  *   **Status:** **Non-negotiable.**

  **3. Description Invariance**
  *   **The Requirement:** The value assigned to the game must depend only on the probability distribution of outcomes, not on the narrative mechanism (coin flips vs. random number generator) or the order of summation.
  *   **The Case:** Rational choice should be sensitive to outcomes and probabilities, not framing. This specifically targets the "Pasadena Game" variant (alternating series) where rearrangement changes the sum.
  *   **Status:** **Non-negotiable.**

  **4. Finite Convergence**
  *   **The Requirement:** As the bankroll cap $C \to \infty$, the prescribed entry fee must track the finite expected value of the capped game (approx. $\log_2(C)$). The uncapped solution should be the limit of the capped solutions.
  *   **The Case:** If the theory gives a wildly different answer for $C = 2^{100}$ vs $C = \infty$, it is discontinuous and unstable.
  *   **Status:** **Camp Commitment.** (Deflationists reject this; they say the limit is discontinuous.)

  **5. Dominance Preservation**
  *   **The Requirement:** If Game A pays strictly more than Game B in every possible outcome, the Value(A) must be strictly greater than Value(B). Specifically, SPP + \$1 must be valued higher than SPP.
  *   **The Case:** Violating dominance allows money-pumping and violates the basic definition of rational preference.
  *   **Status:** **Camp Commitment.** (Bounded utility and probability thresholds often sacrifice this.)

  **6. Axiomatic Transparency**
  *   **The Requirement:** The resolution must explicitly identify which VNM axiom (Completeness, Transitivity, Continuity, Independence/Archimedean) is being relaxed or discarded to achieve the result.
  *   **The Case:** You cannot keep the standard axioms of expected utility and get a finite value for SPP. Hiding the axiom break is dishonest.
  *   **Status:** **Non-negotiable.**

  **7. Iterative Stability**
  *   **The Requirement:** The valuation must scale coherently when the game is offered $N$ times. If the single-play value is finite, $N$ plays should not explode to infinity faster than the bankroll allows, nor should the "infinite" value prevent learning from frequency.
  *   **The Case:** Decisions are rarely one-off. A theory that works for $N=1$ but implies bankruptcy or absurdity for $N=100$ is pragmatically useless.
  *   **Status:** **Camp Commitment.** (Some ergodic solutions rely entirely on this; some EV solutions ignore it.)

  **8. Mugging Consistency**
  *   **The Requirement:** The mechanism used to solve SPP must either solve Pascal's Mugging (tiny prob, huge utility) or provide a principled distinction between the two cases.
  *   **The Case:** Both problems stem from the product of probability and utility diverging. A solution that fixes one but leaves the other vulnerable is incomplete.
  *   **Status:** **Camp Commitment.** (Some argue SPP is about variance, Mugging about priors.)

  ---

  ### The Impossible Pair

  You cannot have **Expectation Maximization** (standard linearity of EV over unbounded outcomes) and **Finite Valuation** (a specific, finite price for the game) at the same time.

  *   **Why:** By definition, the St. Petersburg distribution has an infinite sum. If you maximize expectation, the value is infinity. If the value is finite, you are not maximizing expectation in the standard sense.
  *   **The Cost:** To resolve the paradox, you must sacrifice one. Either you accept the value is infinite (Deflationism) or you stop maximizing standard expectation (Bounded Utility, Non-EV theories).

  ### The Killer Requirement

  **Dominance Preservation.**

  *   **Why it kills candidates:** This is the constraint that exposes the hidden costs of every solution.
      *   **Bounded Utility:** Kills dominance at the margin. If utility saturates, adding \$1 to every outcome (SPP + \$1) might not increase the utility value if both are already at the asymptote.
      *   **Probability Thresholds:** Kills dominance by discontinuity. If a payoff moves from just below the threshold to just above, value jumps, allowing preference reversals.
      *   **Time-Averaging (Ergodic):** Kills dominance between ensemble and time averages. A game that dominates in expectation might not dominate in time-growth rate depending on wealth dynamics.
      *   **Deflationism:** Keeps dominance but fails Valuation Completeness (can't explain why \$1000 is bad).

  ---

  ### Assessment of the Usual Suspects

  **Bounded Utility**
  *   Saves Finite Valuation and Mugging Consistency, but openly sacrifices Unbounded Utility and often violates Dominance Preservation at high wealth levels.

  **Ditching Expected Value (e.g., Ergodic/Time-Average)**
  *   Saves Finite Valuation and Iterative Stability, but sacrifices Description Invariance (ensemble vs. time) and requires changing the definition of rationality.

  **Deflationary ('It's Infinite, Deal With It')**
  *   Saves Expectation Maximization and Dominance, but fails Valuation Completeness completely (cannot explain the \$20 vs \$1000 intuition).

  **Probability Thresholds (Ignore tiny probs)**
  *   Saves Finite Valuation, but sacrifices Continuity and Dominance Preservation, creating arbitrage opportunities around the threshold cutoff.
