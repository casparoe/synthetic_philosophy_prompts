answer: |-
  **Veritab Community Standards & Epistemic Compliance Manual**

  **1.0 Policy Overview**
  Veritab operates under the Knowledge Norm of Assertion (KNA). Users are permitted to assert proposition *p* only if User knows *p*. Mere belief, even if justified, is insufficient for unqualified assertion. The platform defines knowledge as factive, justified true belief secured against epistemic luck. Violations result in content removal or epistemic suspension.

  **2.0 The Truth Defense**
  Users frequently appeal moderation decisions by demonstrating the truth of the asserted proposition. This defense is invalid. Truth is a necessary condition for knowledge, but not a sufficient one. A post stating *p* where *p* is true but the User lacked knowledge at the time of posting constitutes an improper assertion. Veritab moderates the epistemic status of the speaker, not merely the correspondence of the content to reality. Claiming "I was right" admits to a lucky guess, which is a Tier 2 violation.

  **3.0 Gettier Cases and Appeals**
  Users may appeal removal if they believe their justification was non-accidental despite obtaining truth via deviant causal chains. These appeals are routed to the Gettier Review Board (GRB). The GRB evaluates whether the justification relied on a false lemma. If a User asserts *p* based on evidence for *q*, where *q* entails *p*, but *q* is false, the assertion is voided even if *p* is true. Users must demonstrate a direct justificatory link between evidence and fact. Evidence of environmental luck (e.g., fake barn county scenarios) results in permanent restriction on factual claims regarding the subject matter.

  **4.0 Probabilistic Content and Predictions**
  Assertions regarding future contingents or statistical outcomes are strictly regulated. Users cannot know future events; therefore, categorical assertions about tomorrow's weather or market performance are prohibited. Users must employ epistemic modals ("might," "probably," "likely") to downgrade the speech act to opinion or prediction. Lottery propositions are explicitly banned; asserting a ticket will lose based on high probability alone violates the KNA, as probabilistic justification does not yield knowledge in lottery cases. Hedge your claims or face suspension.

  **5.0 Contextual Sensitivity**
  Veritab acknowledges that knowledge attributions are context-sensitive. Moderation standards adjust based on practical stakes. In low-stakes contexts (e.g., restaurant recommendations), standard justification suffices. In high-stakes contexts (e.g., medical, legal, or financial advice), the threshold for "knows" is raised. A User may know something in a casual conversation but fail to know it when giving advice that impacts another User's welfare. Users are responsible for calibrating their epistemic confidence to the practical stakes of the thread. Ignorance of stakes is not a defense.

  **6.0 Testimonial Chains**
  Assertions based on testimony require verification of the source's epistemic status. Blind reposting constitutes an assertion of knowledge by the reposting User. If User A asserts *p*, and User B reposts *p*, User B claims to know *p*. If User A lacked knowledge, User B is liable for improper assertion unless User B possesses independent verification. Long testimonial chains degrade justificatory strength. Users exceeding three degrees of separation from the original evidence source must tag content as "Hearsay" to avoid KNA violations.

  **7.0 Retraction and Admission**
  Retracting a post is treated as an admission that the Knowledge Norm was violated at the time of the original assertion. Since knowledge is factive and stable, one cannot know *p* at T1 and not know *p* at T2 unless the world changed. Therefore, retracting a claim about a past or present state of affairs concedes that the User did not know the claim at the time of posting. Voluntary retraction mitigates penalties but triggers an Epistemic Integrity Strike. Three strikes result in revocation of assertion privileges, limiting the User to questioning and hypothesizing.

  **8.0 Compliance**
  Veritab reserves the right to request justificatory dossiers for high-visibility posts. Failure to produce evidence upon request confirms ignorance. Assert responsibly.

  ***

  **Note on Philosophical Claims**

  I am highly confident in the satire's alignment with Williamsonian KNA orthodoxy, particularly regarding the insufficiency of truth and the impropriety of lottery assertions. The point I am least sure of is the treatment of retraction in Section 7. While Williamson suggests retracting implies one didn't know, some contextualists argue retraction merely signals a shift in context standards rather than prior ignorance. I have taken liberties by treating the KNA as an enforceable platform policy without addressing the skeptical problem that if we rarely know, the platform would be empty. Additionally, the "Gettier Review Board" assumes deviant causal chains are adjudicable by moderators, which is a deliberate bureaucratic caricature of a metaphysical problem.
