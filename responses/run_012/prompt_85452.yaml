      *   **Context:** Hospital risk model, two groups (X: 10% base rate, Y: 30% base rate). Model is *calibrated within groups*. Scores cluster away from 0 and 1 (imperfect).
      *   **Part (a):** What follows about FP/FN rates? Is it a defect or a constraint?
          *   *Key Concept:* Base Rate Fallacy / Impossibility Theorem (Chouldechova, Kleinberg et al.).
          *   *Logic:* If calibrated within groups, $P(Y=1|S=s, G=X) = P(Y=1|S=s, G=Y) = s$.
          *   *Error Rates:*
              *   FPR = $P(S > t | Y=0)$.
              *   FNR = $P(S \le t | Y=1)$.
              *   With different base rates ($P(Y=1|X) \neq P(Y=1|Y)$), you cannot have equal FPR and FNR across groups *if* calibrated.
              *   Specifically, the group with the *lower* base rate (X) will generally have a *higher* False Positive Rate (FPR) for a given threshold, because the denominator ($Y=0$) is larger relative to the positive cases, assuming similar score distributions for positives/negatives. Wait, let's verify the direction.
              *   *Verification:* Let's look at the "Impossibility Theorem" logic. If calibration holds, $PPV$ depends on base rate. $PPV = \frac{TP}{TP+FP}$. If base rate is lower in X, for the same score threshold (implying same PPV roughly if calibrated), the ratio of TP to FP must adjust.
              *   Actually, the standard result (Chouldechova 2017) is: If Calibration holds and Base Rates differ, then FPR and FNR cannot be equal across groups.
              *   Which group has higher FPR? Group X (lower base rate). Why? Because there are more non-cases in X. If the model assigns similar scores to non-cases across groups (often assumed in these simplified impossibility proofs, though not strictly given here), the absolute number of FPs might be similar, but the *rate* (FP / Non-Cases) depends on the score distribution of non-cases.
              *   *Strict Logic:* Calibration means $E[Y|S=s, G] = s$.
              *   FPR$_G$ = $\int_{t}^1 P(S=s|Y=0, G) ds$.
              *   FNR$_G$ = $\int_{0}^t P(S=s|Y=1, G) ds$.
              *   If Base Rate X < Base Rate Y.
              *   Chouldechova's result: FPR is higher in the group with the lower prevalence (Group X). FNR is higher in the group with the higher prevalence (Group Y).
              *   *Defect vs Constraint:* It is a mathematical constraint (arithmetic), not necessarily a model defect, provided the base rate difference is real and not a measurement artifact.
