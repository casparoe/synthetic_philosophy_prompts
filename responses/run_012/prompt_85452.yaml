          *   *Assessment:* Calibration is *one* notion of fairness, but not the only one. The error disparity is *not* an artifact of biased data in the sense that "better data" fixes it. It's arithmetic given the base rate difference. "Better data" (perfect prediction) would solve it (everyone gets 0 or 1), but the prompt says the model is imperfect. So the vendor is wrong that "better data" (within the realm of imperfect prediction) removes the conflict.
      *   **Part (c):** Assess proposal to remove group membership/correlates.
