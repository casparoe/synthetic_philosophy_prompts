answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Two philosophers, ELARA (defending Supervaluationism) and MARCUS (defending Epistemicism), are sitting over cold coffees. A sketch of the board game castle sits on a napkin between them.*

  **Marcus:** Let's look at the napkin. The piece is on the line. Fifty percent inside, fifty percent outside. You're telling me there is no truth to the claim "The piece is in the castle"?

  **Elara:** I'm telling you the rule says "mostly inside." "Mostly" is vague. In this specific configuration, the linguistic rules we established don't determine an outcome. It's not that we don't know; it's that the world and our words haven't settled it. The statement is neither true nor false.

  **Marcus:** That violates the Law of Excluded Middle. "Either the piece is in the castle or it is not." That has to be true. If you deny that, you break classical logic. My view is simpler: There is a fact of the matter. The word "mostly" has a sharp cutoff—maybe it means 50.0001% coverage. Your piece is at exactly 50%. So it's out. You just don't know where the cutoff is.

  **Elara:** But why 50.0001%? Why not 51%? Why not 49.9%? If there is a sharp cutoff, what *makes* it there? Is it a metaphysical miracle? Did the moment we wrote "mostly" on that rulebook, the universe magically selected a specific micron-width boundary? That seems absurd.

  **Marcus:** It's not magic; it's how reference works. Think about the word "bald." There is a specific number of hairs where a man transitions from not-bald to bald. We can't find it, and we can't measure it, but it exists. Meaning is fixed by usage, but usage doesn't determine the boundary *for us*. It determines a boundary *in spite of us*.

  **Elara:** That's the epistemicist leap I can't make. With "bald," you can argue biology dictates a functional threshold. But with "mostly inside a drawn line"? We made this game up three weeks ago! Our usage is the *only* thing that fixes the meaning. And our usage runs out at the borderline.
  This is where supervaluationism helps. We look at all the "admissible precisifications" of the rule. One admissible version says "mostly" means >45%. Another says "mostly" means >55%. Both are consistent with how we've used the word so far.
  In the 50/50 case, some admissible precisifications say "In," some say "Out." Therefore, the statement is super-true in neither. It's indeterminate.

  **Marcus:** Ah, "admissible." That's the black box I want to open. What makes a precisification admissible? If you say anything consistent with past usage is admissible, then almost anything goes. If you say there are constraints, aren't those constraints just... sharp boundaries in disguise?

  **Elara:** The constraints are grounded in our linguistic intentions. We wouldn't accept a precisification that says a piece is "mostly inside" when only 1% is inside. That violates the meaning of "mostly."

  **Marcus:** Okay, so there's a boundary between "admissible" and "inadmissible" precisifications. Is *that* boundary sharp?
  Suppose 55% is admissible as a cutoff for "mostly." Is 54.999% admissible? If you say "Yes," then eventually you admit a cutoff that makes your 50/50 piece "In." If you say "No," then you have a sharp line between admissible and inadmissible. You've just pushed the vagueness up a level. You haven't eliminated sharp boundaries; you've just hidden them behind the word "admissible."

  **Elara:** That's the problem of higher-order vagueness, and I'll grant you it's a difficulty. But it's less damaging than your alternative. You're saying there is a *fact* about whether 50.0000001% counts as "mostly," a fact that is in principle unknowable.
  Ask yourself: Why are we ignorant? Usually, ignorance is because we lack data. I don't know the number of hairs on your head because I haven't counted them. But in the castle case, even if we measure the area perfectly, we still won't know if it counts. The ignorance isn't empirical; it's semantic. You're claiming there's semantic knowledge that is inaccessible to any speaker of the language. That makes meaning seem like a ghostly entity detached from human use.

  **Marcus:** I'm not saying it's detached from use. I'm saying use determines reference in a way that is sensitive to micro-features we can't track. Think about "heap." One grain isn't a heap. A billion is. Somewhere in between, the word "heap" flips. The flip is determined by the complex causal history of how we use the word, social pressures, context, etc. It's too complex for us to compute, so it looks vague. But complexity isn't indeterminacy.
  Back to your castle. If you say there's "no fact of the matter," what happens if I bet you $20 that the piece is in?
  If there's no fact, you can't win the bet. I can't win the bet. The bet is void. But in practice, if we call a referee, the referee *must* rule one way. They will flip a coin or make a judgment call. Once they rule "In," it becomes retroactively true that it was In.

  **Elara:** No, once they rule, they've *precisified* the rule. They've made a decision that narrows the admissible set for future moves. But regarding the move *before* the ruling? It was indeterminate.
  And this explains the phenomenology better than you do. When I look at that piece, it doesn't *feel* like I'm missing information. It feels like the question is defective. If I told you, "I don't know if that number is prime," you'd assume I haven't done the math. But if I say, "I don't know if that color is red or orange," you understand that the spectrum is continuous. My view respects that feeling. Your view tells me I'm just blind to a sharp line in a continuous spectrum.

  **Marcus:** Feelings aren't metaphysics. The feeling of continuity is a cognitive limitation.
  But let's press your "admissible" point again. You said a precisification requiring 1% to be "mostly" is inadmissible. Why?
  Because it violates the meaning of "mostly." But "mostly" is vague! So the condition for admissibility is itself vague.
  If "admissible" is vague, then classical logic fails for your meta-language too. You can't say "Either a precisification is admissible or it is not." So your whole system, which relies on classical logic to validate tautologies, collapses under higher-order vagueness. You need a sharp line between admissible and inadmissible to make your math work. And if you have that sharp line, why not just admit I have a sharp line for "in the castle"?

  **Elara:** Touché. That is the weak spot. Supervaluationism works best for first-order vagueness. If we accept higher-order vagueness—that there are borderline cases of admissible precisifications—then we can't define "super-truth" as "true in all admissible precisifications" without ambiguity.
  However, even if I concede that, my view captures something vital about the game. The game is a cooperative social practice. If we encounter a 50/50 case, the rational move isn't to search for a hidden truth. It's to amend the rule.
  Your view suggests the rule was always complete, we just couldn't see the edges. My view says the rule was genuinely incomplete. That seems more honest to how we actually make things up. We didn't define "mostly" with micron precision because we didn't care to. The gap isn't a failure of knowledge; it's a feature of the design.

  **Marcus:** But if the gap is a feature, then logic fails. Consider this sentence: "If the piece is mostly inside, then it is mostly inside."
  That's a tautology. It must be true.
  But on your view, if the piece is 50/50, the antecedent ("The piece is mostly inside") is neither true nor false. In many gap logics, if the antecedent lacks a truth value, the conditional lacks a truth value. So you're forced to say a logical tautology is not true. That's a huge cost.

  **Elara:** Supervaluationism saves the tautologies! That's its main selling point.
  Remember: A sentence is super-true if it's true in *all* admissible precisifications.
  In every admissible precisification, there is a sharp cutoff. In every single one of them, "If P, then P" comes out true. So, "If the piece is mostly inside, then it is mostly inside" is super-true, even though "The piece is mostly inside" is indeterminate. I get to keep classical logic for the valid arguments, while admitting truth-value gaps for the atomic claims.

  **Marcus:** You keep classical logic only by sacrificing the principle of bivalence. But you also sacrifice the inference rule of Conditional Proof.
  Here's the killer: "Either the piece is mostly inside, or it is not mostly inside."
  You say this is super-true. It's true in every precisification.
  But you also say "The piece is mostly inside" is indeterminate, and "The piece is not mostly inside" is indeterminate.
  So you're claiming it's *true* that (A or B), even though neither A nor B is true.
  That implies the truth of the disjunction doesn't rest on the truth of its parts. It makes "truth" a weird, holistic property that floats above the actual facts of the board.
  In the castle game, if I ask "Is it in or out?" and you say "It's true that it's either in or out, but neither 'in' nor 'out' is true," I'm going to throw the board across the room. It's linguistically coherent but pragmatically insane.

  **Elara:** It's pragmatically insane because you want to move the piece. But metaphysically? It captures the reality of the situation. The board doesn't dictate an answer.
  Let's go back to your sharp line. You say there's a fact. Let's say the fact is 50.0001%.
  I take the piece and shave off a microscopic sliver of wood from the side touching the line. Now it's 49.9999%.
  According to you, the piece has magically jumped from "Out" to "In" (or vice versa) based on a change invisible to the naked eye, with no change in our intentions, rules, or perception.
  That makes the truth of the game depend on quantum fluctuations in the wood's edge, rather than the rules we agreed on. That makes the game less about our agreement and more about physics.

  **Marcus:** The game *is* physical. The pieces are physical. The board is physical.
  Why is it weird that physical facts determine rule application?
  You're worried that the transition is too sharp. But nature is full of sharp transitions. Water boils at 100°C. At 99.999°C it's not boiling. Is that vague? No.
  You might say "boiling" is vague because of bubbles, but "crossing the line" is geometric.
  Your worry is that "mostly" is a human concept. I agree. But human concepts latch onto the world. If the world provides a precise measurement (area overlap), and the concept has a precise threshold (even if unknown), the match is precise.
  The "magic" you accuse me of is just the precision of reality. The "gap" you propose is a metaphysical hole where logic should be.

  **Elara:** But "mostly" isn't "all." If the rule was "The piece must be entirely inside," then your geometric precision works. But "mostly" introduces a proportion.
  And here's the circle I can't escape, which you pointed out earlier: To define the admissible precisifications, I need to know what counts as a valid interpretation of "mostly."
  If "mostly" is vague, then the set of admissible precisifications is a vague set.
  If the set is vague, then there are borderline cases of admissibility.
  So there are precisifications that are *neither* admissible *nor* inadmissible.
  In those cases, is the statement true?
  If I admit that, I need a super-super-valuationism. And so on. It's vagueness all the way down.
  Maybe you're right that epistemicism stops the regress. You just say "There's a sharp line for admissibility too."
  But I still can't accept that there's a *fact* about the 50/50 case. It feels like we're trying to squeeze a square peg into a round hole. The rule "mostly" was designed to be flexible. By insisting on a fact, you're removing the flexibility we intentionally built in.

  **Marcus:** We built in flexibility for *human convenience*, not metaphysical indeterminacy.
  We didn't want to measure areas with a planimeter every turn. So we used a vague term.
  That doesn't mean the term lacks a truth condition. It just means the truth condition is hard to access.
  Think about the alternative. If you're right, and there's no fact, then if we played this game a million times with that exact piece in that exact spot, sometimes it would be "In" and sometimes "Out" with no reason why.
  Wait, no—you'd say we have to make a decision.
  But if we have to make a decision, *we* are creating the fact.
  If we create the fact, then before the decision, there was no fact.
  So, before the decision, was the move legal?
  If you say "Indeterminate," then the game state is indeterminate.
  If the game state is indeterminate, can I capture your piece?
  If I capture it, and later we decide the piece was "Out" (illegally placed), was the capture valid?
  Your view makes the history of the game unstable. My view says the piece was Out all along. We just didn't know. When we realize it, we correct the board. The history is fixed, just unknown.

  **Elara:** But that assumes the rules exist independently of our ability to apply them.
  I think the rules are constituted by our practices. If our practice runs out—if we stare at the board and shrug—then the rule runs out.
  You're positing a "Platonic Rulebook" in the sky that has the answer written in invisible ink.
  I'm saying the Rulebook is us. And right now, "We" don't have an answer.
  So, is there a fact? No. There's just us, a rainy afternoon, and a piece on a line. And we need to decide whether to keep playing or go make tea.

  **Marcus:** (Laughs) Tea sounds good. But I'm still counting that piece as Out.

  **Elara:** And I'm counting it as... indeterminate. Which means I get to move it again.

  **Marcus:** See? Even in the dialogue, we can't escape the need for a binary choice.

  **Elara:** Maybe that's not because reality is binary. Maybe it's because board games require it. But life? The castle? The line? That's where the fog lives.

  **Marcus:** Or maybe the fog is just in our eyes.

  *(They sit in silence for a moment, looking at the 50/50 piece on the napkin. Neither moves it.)*
