prompt: |-
  My younger brother entered treatment for a gambling disorder this spring, and since then I have not been able to say what I mean when I say he kept choosing something he did not want. In the same months my employer rolled out a benefits portal that infers what we "prefer" from our clicks, and a hospital ethics board I sit on has begun weighting treatment options by preference surveys. This has stopped being an abstract question for me, and I want the specification before I look at any more arguments. No citations or reading list, please; I will supply those myself.

  Write the desiderata a theory of preference and utility must meet: what any adequate account of what it is for someone to prefer one thing to another, and of what the quantity called utility is supposed to name, has to be able to do. Fix the purpose as I have. The account has to serve as a standard for policy that binds many people at once, it has to license attributions of preference to subjects who cannot be asked (an infant, a person with advanced dementia, a rat in a choice box), and it has to leave room to say that a person's own choices can betray them. The cases I care most about are the ones where those three jobs pull apart: choices made under addiction or coercion, choices that framing flips, choices that are incomplete or intransitive, and choices the chooser would disown on reflection. Set out the requirements, the cases the theory must get right, the distinctions it must not collapse, the formal and empirical results it must stay consistent with, each with the case or consideration that motivates it, and mark which are non-negotiable and which are commitments of one camp only. The part I most want is where the list undermines itself: identify any subset of requirements that cannot be jointly satisfied and say what has to give. Then say which single requirement does the most to exclude otherwise plausible accounts, and briefly how the pure revealed-preference picture, the preference-as-mental-ranking picture, and hedonic accounts fare against the list.

  Use these sections, in this order: "The purpose I have fixed" (about 80 words); "The desiderata" (numbered, each with the case behind it, 700 to 900 words); "Non-negotiable and negotiable" (a short table); "Where the list is unsatisfiable" (about 250 words); "The requirement that does the most excluding" (about 150 words); "What would change my mind" (about 150 words, saying which consideration would move you to a different verdict and where your own reasoning is most likely to fail).
