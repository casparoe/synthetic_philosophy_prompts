answer: |-
  The purpose I have fixed

  The account must function as a normative standard for public policy binding diverse populations. It must license preference attributions to subjects incapable of verbal report, such as infants or non-human animals. Crucially, it must preserve the conceptual space to assert that an agent's actual choices can betray their own welfare or deeper aims. It must resolve tensions where behavior, reported desire, and welfare diverge, specifically in cases of addiction, coercion, framing effects, and reflective disownment.

  The desiderata

  1. **Observational Grounding:** The theory must link preference to observable phenomena to serve policy and non-verbal subjects effectively. *Case:* A rat pressing a lever or an infant crying; we cannot ask them, so choice behavior must signal preference. If preference is purely internal, policy cannot adjudicate resource allocation for those who cannot speak. This requires that preference leaves a trace in the world accessible to third parties. Without this, the ethics board cannot act on behalf of the incapacitated. The data must be public, not private. If we require verbal report, we exclude the vulnerable. If we require only behavior, we risk misinterpretation. The theory must bridge this gap without demanding impossible access. [Non-negotiable]

  2. **Welfare Connectivity:** Utility must track what is genuinely good for the subject, not just what they grab in the moment. *Case:* The gambling brother chooses the casino but is harmed; utility cannot simply equal chosenness. If utility is only revealed choice, we lose the ability to criticize harmful policies that satisfy expressed desires. The theory must distinguish between satisfying a preference and benefiting the subject. Otherwise, enabling addiction counts as welfare maximization. We need a gap between choice and good. If choice defines utility, policy becomes purely procedural and loses normative force. We must be able to say the choice was mistaken. [Non-negotiable]

  3. **Volitional Integrity:** Preference must distinguish between compelled action and endorsed desire to capture agency. *Case:* Coercion or addiction where the hand moves but the will resists; the theory must label this as non-preferential choice. A theory that equates action with preference cannot account for the experience of compulsion where the agent feels hijacked by their own impulses. It must separate the mechanism of choice from the authority of the chooser. If we cannot distinguish coercion from choice, consent becomes meaningless. Policy would enforce the will of the strongest impulse rather than the agent. [Non-negotiable]

  4. **Reflective Stability:** Preferences should align with what the agent would endorse upon calm reflection over time. *Case:* The brother in recovery disowns his gambling choices; the theory must privilege the reflective self over the impulsive self. Policy based on transient impulses risks undermining the agent's long-term autonomy. The account must allow for a hierarchy of desires where some count more than others. Immediate gratification cannot override considered judgment. If we ignore reflection, we treat agents as collections of moments rather than unified selves. The theory must stabilize identity across time. [Non-negotiable]

  5. **Structural Consistency:** Preferences must exhibit minimal consistency (transitivity) to be actionable in policy planning. *Case:* If A > B and B > C, policy cannot cycle resources based on C > A without exploitation. Intransitive preferences prevent coherent planning and resource distribution. While humans violate transitivity, a policy standard requires a rationalizable model to avoid money-pump vulnerabilities. We must assume rationality to model systems, even if agents are not. If preferences cycle, optimization is impossible. The theory must impose structure on messy data to function as a guide. [Negotiable]

  6. **Interpersonal Comparability:** Utility must be comparable across subjects for binding policy allocation. *Case:* Allocating hospital resources requires weighing one patient's pain against another's survival; purely ordinal rankings fail here. Without comparability, ethics boards cannot maximize aggregate welfare. This demands a cardinal measure of utility, not just ranking, which is empirically contentious. We need a common currency of value to trade off lives. If utility is ordinal only, we cannot sum harms. The theory must provide a scale that crosses individual boundaries. [Negotiable]

  Non-negotiable and negotiable

  | Requirement | Status |
  | :--- | :--- |
  | Observational Grounding | Non-negotiable |
  | Welfare Connectivity | Non-negotiable |
  | Volitional Integrity | Non-negotiable |
  | Reflective Stability | Non-negotiable |
  | Structural Consistency | Negotiable (Camp: Rational Choice) |
  | Interpersonal Comparability | Negotiable (Camp: Utilitarianism) |

  Where the list is unsatisfiable

  The set containing Observational Grounding, Welfare Connectivity, and Volitional Integrity forms an impossible trinity. If preference is grounded in observation (behavior), it cannot distinguish volition from compulsion, violating Integrity. If preference tracks welfare objectively, it becomes unobservable to the third party, violating Grounding. If preference tracks volition, it is hidden from the policy maker, violating Grounding again. You cannot have a metric that is publicly visible, normatively authoritative, and internally authentic simultaneously. To make policy, Observational Grounding usually survives, forcing Welfare Connectivity to weaken; we measure clicks, not goods. To save Welfare, we must abandon Grounding, relying on objective lists that ignore choice. To save Volition, we must abandon Policy, retreating to first-person authority. One must give: typically, the claim that policy can know welfare without paternalism.

  The requirement that does the most excluding

  Welfare Connectivity is the primary exclusionary constraint. It immediately falsifies the pure revealed-preference picture, which defines utility as choice; if choice betrays welfare, revealed preference fails. It strains the preference-as-mental-ranking picture, as rankings may be adaptive or ignorant of the good. Hedonic accounts fare better on welfare but fail Volitional Integrity, as pleasure is not always preferred. This requirement demands a theory that knows the subject's good better than the subject's hand does, which most formal models reject to maintain neutrality.

  What would change my mind

  I would shift if a formal model demonstrated how to measure welfare objectively without paternalism, perhaps via neuroscientific markers of satisfaction that align with reflection. My reasoning might fail by assuming policy requires a single unified metric; perhaps a pluralistic framework handling different desiderata in different contexts is viable. If I accepted that policy should only track choice and ignore welfare, the tension dissolves, but that abandons the ethics board's purpose.
