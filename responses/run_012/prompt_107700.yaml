  # DECISION TREE: THE MORAL STRUCTURE OF DOING AND ALLOWING

  **Instructions:** Answer each question by appealing to the five cases provided in the seminar pack. Follow the path indicated by your answer. Termini in **bold** are positions. Terminii in *italics* are dead ends.

  **Q1. Causal Relation (Case a):** In the flood case, does the engineer's omission cause the harm in the same metaphysical sense as an action would?
  *   (1a) Yes, identical sense. → **Go to Q2**
  *   (1b) No, omissions are not causes. → **Go to Q2**
  *   (1c) Only in a counterfactual sense. → **Go to Q2**

  **Q2. Conventional Basis (Case e):** In the dispatch case, is the classification of the system's default as 'inaction' determined by natural facts or institutional rules?
  *   (2a) Natural facts. → **Go to Q3**
  *   (2b) Institutional rules. → **Go to Q3**

  **Q3. Moral Ground (Case b):** In the infusion case, is the moral difference grounded in the act/omit distinction itself, in other factors (e.g., burden), or is there no difference?
  *   (3a) Intrinsic to act/omit. → **Go to Q4**
  *   (3b) Proxy for other factors. → **LEAF: Proxy View**
  *   (3c) No difference (Irrelevant). → **LEAF: Moral Equivalence**

  **Q4. Constraint Strength (Case b variant):** If intrinsic, does the distinction forbid harm absolutely or merely weigh against it?
  *   (4a) Absolute constraint. → **Go to Q5**
  *   (4b) Outweighable weight. → **Go to Q5**

  **Q5. Granularity (Case c):** In the landslide case, is the moral status of stopping maintenance binary relative to diverting, or is there a gradient?
  *   (5a) Binary. → **Go to Q6**
  *   (5b) Graded/Intermediate. → **Go to Q6**
  *   *(4a + 5b)* → *DEAD END: Absolute constraints cannot be graded.*

  **Q6. Unit of Agency (Case d):** In the board case, does the distinction apply primarily to individual members or the collective body?
  *   (6a) Individuals only. → **Go to Q7**
  *   (6b) Collective/Institutional. → **LEAF: Collective Responsibility**

  **Q7. Intentional Override (Case b):** Is the moral difference better explained by intending harm versus merely foreseeing it?
  *   (7a) Yes, replaces act/omit. → **LEAF: Intentionalism**
  *   (7b) No, act/omit remains distinct. → **Go to Leaf Assignment**

  ---

  ### LEAF ASSIGNMENT (Based on Path History)

  *   **Path (3b):** **Proxy View** — The distinction carries no intrinsic weight but is a reliable proxy for something else. *Awkward commitment: The distinction vanishes if burdens and knowledge are equalized.*
  *   **Path (3c):** **Moral Equivalence** — The view that there is no moral difference at all. *Awkward commitment: Must condemn the engineer in (a) exactly as if she broke the pump.*
  *   **Path (4a, 5a, 7b):** **Strict Absolutism** — The view that the difference is a strict, non-scalar constraint. *Awkward commitment: Cannot justify stopping infusion in (b) even to relieve suffering.*
  *   **Path (4b, 5b, 7b):** **Scalarism** — The view that the difference is real but graded, with intermediate cases. *Awkward commitment: Requires precise calibration of responsibility for intermediate cases.*
  *   **Path (1b, 3a, 7b):** **Causal View** — The view that the distinction is grounded in causation, with omissions not causes at all. *Awkward commitment: Must explain moral weight without causal power.*
  *   **Path (1c, 3a, 7b):** **Counterfactual View** — The view that omissions are causes only in a counterfactual sense. *Awkward commitment: Relies on metaphysically contentious counterfactual dependence.*
  *   **Path (2b, 3a, 7b):** **Conventionalism** — The view that the classification of something as an act rather than an omission is fixed by convention. *Awkward commitment: Moral status changes if institutional rules change.*
  *   **Path (6b, 3a, 7b):** **Collective Responsibility** — The view that the unit of assessment is a practice, institution, or collective. *Awkward commitment: Individuals may be blameless despite collective harm.*
  *   **Path (7a):** **Intentionalism** — The view that the doing/allowing contrast should be replaced by the intending/foreseeing contrast. *Awkward commitment: Treats foreseeable side-effects of actions same as omissions.*
  *   **Path (1a, 2a, 4b, 5a, 6a, 7b):** **Naturalist Weight** (Unnamed) — The view that the distinction is natural, binary, outweighable, and individual. *Awkward commitment: Commits to robust metaphysical realism about actions.*

  ---

  ### INDISTINGUISHABLE POSITIONS
  This tree cannot separate **Strict Absolutism** from a **Deontological Constraint View** that relies on rights rather than the act/omit distinction itself. Both answer every branch question identically. The further question needed is whether the constraint stems from the *nature of the act* or the *rights of the victim*; this belongs to the weight of the distinction rather than its structure.

  ### MISSING COMBINATIONS
  *   **(4a + 5b):** Incoherent. Absolute constraints forbid an act type entirely; they do not admit of degrees.
  *   **(3c + 7a):** Unexplored. If the act/omit distinction is irrelevant (3c), appealing to intention (7a) changes the subject rather than refining the distinction.
  *   **(3b + 4a):** Incoherent. A proxy for burdens cannot be an absolute constraint, as burdens vary by context.

  ### SEMINAR NOTE
  **Q3 (Moral Ground)** does the most work, as it triages the fundamental metaphysical commitment (intrinsic vs. proxy vs. none) before structural questions arise. **Intentionalism** is the hardest leaf for a reader to reach from the cases alone, because Cases (a) through (e) are framed explicitly around action and omission, requiring the reader to abstract away from the provided vocabulary to identify intention as the primary variable.
