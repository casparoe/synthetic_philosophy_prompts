      To: Advisory Commission on Altenian Referendum
      From: [Member Name/Placeholder]
      Date: [Current Date]
      Subject: Recommendation on Procedural Response to Altenian Independence Referendum

      This opinion addresses the procedural mandate of the Commission: to advise the Government of the Republic of Venmark on how to respond to the scheduled Altenian independence referendum. We operate within a tension between the national Constitution, which declares the Republic indivisible, and Altenia's Statute of Autonomy, which asserts the Altenian people's right to decide their political status. Resolving this tension requires a process that respects legal hierarchy without igniting political crisis.

      **Recommended Course of Action**
      The Government should not seek to enjoin the referendum immediately, nor should it recognize the result unconditionally. Instead, it should initiate immediate negotiations with the Altenian regional government to establish a legal framework governing the referendum. This framework must define the question, the electorate, and the consequences of the vote. The Government should set a deadline of ninety days from today to conclude this framework agreement. If no agreement is reached within this period, the Government should then seek judicial intervention to halt the vote on constitutional grounds. This approach prioritizes a political solution while retaining legal leverage.

      **Position on Concentric Majorities**
      The Commission should endorse a modified version of the government lawyers' "concentric-majorities rule."
      First, regarding sub-regions within Altenia: The right to opt out must be granted to Marrow Bay and the Kelder Islands. If the principle of self-determination justifies Altenia's vote to leave Venmark, consistency demands that distinct political communities within Altenia not be forced into a new state against their will. To allow Altenia to carry Marrow Bay out of the Republic against a local majority would replicate the coercion Altenia alleges it suffers from the central government.
      Second, regarding Tarn: The right to opt out does not extend to Tarn's opposite case. Tarn lies outside the statutory scope of Altenian self-determination. Allowing Tarn to join an independent Altenia via referendum would effectively permit a region of Venmark to secede without the constitutional amendment required for such a transfer. Tarn's petition must be treated as a separate matter requiring national legislative approval, not as a condition of the Altenian referendum.
      Third, to prevent instability, the right to opt out is limited to existing administrative sub-regions. It does not extend to neighborhoods or private parcels.

