          *   *Hofstadter's View:* Hofstadter is a functionalist/physicalist regarding the mind. He believes meaning arises from isomorphisms between structures. It's not *entirely* in the mind of the receiver in a solipsistic sense; it requires a structural correspondence between the message and the receiver's internal structure. However, he does argue meaning isn't intrinsic to the ink on the page.
          *   *Verdict:* Mostly accurate, but "entirely in the mind" risks sounding too subjective/idealist. Hofstadter sees meaning as a relationship (isomorphism). But for the sake of the summary, this is close enough to his anti-intrinsic-meaning stance.

