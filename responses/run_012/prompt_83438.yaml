prompt: |-
  I'm taking a cognitive science seminar on self-reference and meaning, and we have just finished the section of Gödel, Escher, Bach that draws the distinction between frame messages, outer messages, and inner messages. A classmate who took the course last year sent me the following summary of what he calls "Hofstadter's theory of meaning," and I would like to know how much of it I can trust:

  "Hofstadter says every message has three layers. The frame message is the packaging — the fact that the thing is a message at all, like an envelope or a file header. The outer message is the sender's intention, the instructions for decoding what is inside. The inner message is the actual content, the meaning itself. The whole point of the distinction is that meaning is not in the physical object at all; it lives entirely in the mind of the receiver, so two readers can assign different meanings and there is no fact of the matter about which one is right. That is why Hofstadter thinks faithful translation is impossible in principle, and why he holds that a computer can only manipulate symbols, never understand a message."

  Parts of this match what I remember from lecture and parts do not. Please go through it claim by claim and tell me what Hofstadter would accept as stated, what he would regard as a distortion of his view, and what is simply wrong; where the summary is wrong, say whether the larger conclusions it draws — that meaning is arbitrary, that translation is impossible in principle, and that no machine could understand a message — are conclusions Hofstadter himself would endorse or reject. I would rather have a definite verdict on each sentence than a survey of possible readings, so please commit to a position and give your reasons. You do not need page references or citations; I care about the substance of the argument. Please write in American English, and end with a single line beginning "Verdict:" that states your overall assessment in one sentence.
