answer: |-
  Good morning. Welcome to all of you.

  Look around the room. On one side, I see people who spend their lives getting dirt under their fingernails. You deal in stratigraphy, in seriation, in the stubborn physicality of things that survived. On the other side, I see people who spend their lives getting concepts under their fingernails. You deal in intentionality, in social ontology, in the structures of mind and society.

  Usually, these two groups meet to apologize to each other. The archaeologists apologize for being too muddy to find the mind; the philosophers apologize for being too airy to touch the ground. We are not here to apologize. We are here to collide.

  Our question is deceptively simple: What can material remains tell us about the beliefs and institutions of people who left no writing?

  For two days, we are going to interrogate the bridge between the object and the mind. But I want to start by throwing a wrench into the machinery of that bridge. I want to propose a thesis that I hope will annoy half of you and terrify the other half.

  Here it is: We treat "belief" and "institution" as if they are two different depths in the same well. We assume that if we dig deep enough into the material record, we find institutions, and if we dig even deeper, we find beliefs. We treat the difference between them as a matter of evidential strength. Institutions are easier to see; beliefs are harder to see.

  I am arguing that this is wrong. The difference is not one of degree. It is a difference of kind.

  Consider what a belief is. A belief is a state of mind. It can be held once. It can be held by a single person. It can be entirely private. I can believe that the spirit of my ancestor lives in this specific stone, and I can die taking that secret to the grave. If I am the only one who ever held that belief, and I bury the stone with me, the material record might preserve the stone, but the belief—the specific cognitive content attached to it—is gone. It leaves no necessary trace. A belief does not require repetition to exist.

  Now consider an institution. An institution is not a state of mind. It is a pattern of behavior. It is a rule, a norm, a practice. Crucially, an institution *cannot* exist in a single instance. You cannot have a marriage, a market, or a burial rite happen once. For an institution to exist, it must be repeated. It requires coordination across time and across bodies.

  And what is the archaeological record? The archaeological record is not a snapshot of life. It is an accumulation of debris. It is, by definition, a product of repetition. It preserves the things that were done over and over again.

  So, here is the provocation: The material record is structurally aligned with institutions, but structurally misaligned with beliefs.

  When we find a hundred pots buried in a specific orientation, we are looking at repetition. We are looking at a rule that was followed. We are looking at an institution. But how often do we slide from that observation to a claim about belief? We say, "They believed the dead needed provisions for the journey."

  I am suggesting that this slide is not just an overreach. It is a category mistake.

  The pattern in the ground proves the *doing*, not the *thinking*. It proves that there was a normative constraint on how pots were placed. It proves an institution of burial. It does not prove that every person who placed a pot believed in a journey. Some might have been following orders. Some might have been afraid of social sanction. Some might have believed the pots were for the living, not the dead. The institution survives the loss of the belief. We have all participated in institutions—shaking hands, wearing black to funerals—long after the original beliefs that spawned them evaporated.

  If I am right, then archaeology is actually in a much stronger position than it claims, but also a much more limited one. It is stronger because it is the perfect science of institutions. It is limited because it is the wrong tool for the science of belief. By trying to do both with the same move, we muddy the water. We claim a certainty about the inner life that the outer record cannot support.

  Now, I can hear the objections forming. I need to address the strongest one before we break for coffee, or we will just spin our wheels.

  The objection is this: "You cannot have an institution without shared belief."

  The philosophers among you will argue that institutions are constituted by collective intentionality. A rule is not a rule unless the participants recognize it as a rule. The archaeologists will argue that practice and belief are woven together in the habitus; you can't separate the hand from the head. If they buried pots the same way for five hundred years, they must have shared a worldview.

  I concede the point in life, but I stand by the distinction in death.

  Yes, in the living society, belief and institution are entangled. But the archaeological record is not a living society. It is a graveyard of actions. The entanglement is severed the moment the actor dies. What remains is the sediment of the action, not the motivation.

  We can imagine a scenario where the belief changes but the institution remains. Perhaps the original belief was about a journey, but over five centuries, it shifted to a belief about appeasing the gods, while the pot placement remained identical. The material record looks static. The belief history is dynamic. If we read the belief directly from the pot, we flatten five hundred years of cognitive history into a single slogan.

  So, I am not saying beliefs didn't matter. I am saying the *evidence* accesses them differently. To treat the pattern of objects as a direct map of the pattern of minds is to confuse the shell with the ghost.

  This is the agenda I want to set for the next two days. I do not want us to agree on this. I want us to fight over it. Because if this distinction holds, it changes how we write, how we excavate, and how we interpret.

  So, I leave you with three questions to take up in the sessions.

  First, the methodological question: If we accept that the material record privileges institutions over beliefs, how do we describe what we find without smuggling belief back in? Can we develop a vocabulary of "normative constraint" or "behavioral regularity" that is robust enough to stand on its own, without leaning on the crutch of "worldview"?

  Second, the limit question: Where does the material record fail to capture an institution? If an institution is repetition, what happens when the repetition is invisible? Are there institutions of speech, or of temporary gathering, that leave no assemblage? If so, are we systematically blind to the most important parts of their social lives because they didn't throw things away?

  And third, the ethical question: What do we lose if we stop claiming to know what they believed? There is a human desire to restore the voice to the voiceless. To say "they believed" is to make them fully human in our eyes. To say "they complied with a norm" feels colder, more mechanical. Are we willing to accept a colder history if it is a more honest one? Or is the inference to belief a necessary act of imagination, even if it is logically flawed?

  We have two days. We have the dirt, and we have the concepts. Let's see if we can fit them together without breaking either.

  Thank you. Let's begin.
