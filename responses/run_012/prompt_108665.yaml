      *   *Objection:* The "Shared Mind" objection.
      *   *Questions:* Focus on the "How" and the "So What."
      *   *Closing:* Let the fight begin.

  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm saying beliefs *don't exist*. I'm saying the *evidence* treats them differently. I need to be precise there. Also, ensure the "category mistake" line lands hard.

  7.  **Final Word Count Check:** Aiming for ~1400 words.
      *   Intro: 200 words.
      *   Thesis: 400 words.
      *   Objection/Concession: 400 words.
      *   Questions/Close: 400 words.
      *   *Adjustment:* Keep sentences punchy for spoken delivery.

  8.  **Final Review:** Does this provoke argument? Yes, by telling archaeologists their standard inference might be a logical error. Does it engage philosophers? Yes, by asking them to ground their concepts in materiality.

