      *   **Topic:** What material remains tell us about beliefs and institutions of non-literate peoples.
      *   **Core Thesis:** Belief and institution are recovered differently from objects. It's not a difference of *degree* (evidence strength) but of *kind*. Beliefs can be singular/private; institutions require repetition. Material record preserves repetition. Therefore, material record is better evidence for institutions than beliefs. Moving from pattern to belief is a category mistake, not just an overreach.
      *   **Tone:** Spoken (not read), vivid, provocative (meant to spark argument), sharp but fair.
      *   **Length:** About 10 minutes spoken (approx. 1,300 - 1,500 words at a moderate pace).
      *   **Requirements:** Set the agenda, concede the strongest objection, close with 2-3 genuine questions for the workshop. No citations.

  2.  **Determine the Voice and Style:**
      *   Needs to bridge the gap between dirt-under-the-fingernails archaeologists and armchair philosophers.
      *   Avoid overly dense jargon that alienates the archaeologists.
      *   Avoid overly simplistic empiricism that insults the philosophers.
      *   Use metaphors related to digging, layering, and building.
      *   The rhythm should be conversational but punchy. Short sentences. Pauses. Rhetorical questions.

  3.  **Drafting - Section by Section:**

      *   **Introduction (Welcome & Stakes):**
          *   Acknowledge the unusual pairing.
          *   State the central question clearly.
          *   Establish the tension: We want to know what they *thought*, but we only have what they *left*.

      *   **The Core Argument (Belief vs. Institution):**
          *   Define the terms operationally.
          *   *Belief:* Internal, can be singular, private, fleeting.
          *   *Institution:* External, requires coordination, repetition, rules.
          *   *The Material Record:* It's a graveyard of actions, not thoughts. It favors the repeated.
          *   *The Thesis:* It's a category mistake to treat them the same.

      *   **The Provocation (The "Slide"):**
          *   Address the common practice: "We see a pattern, so they must have believed X."
          *   Reframe: The pattern proves the *institution* (the doing), not necessarily the *belief* (the thinking).
          *   Analogy: Traffic lights. We stop not because we "believe" in red, but because the institution of traffic law demands it.

      *   **The Concession (The Strongest Objection):**
          *   What will the archaeologists say? "Institutions *are* made of beliefs."
          *   What will the philosophers say? "Beliefs manifest in actions."
          *   The Counter-argument to my thesis: You can't have an institution without shared belief.
          *   My Concession: True, they are entangled. But the *evidence* accesses them differently. We see the shell, not the ghost.

      *   **The Agenda/Questions:**
          *   Need 2-3 specific, workable questions.
          *   1. Methodology: How do we describe institutions without smuggling in belief?
          *   2. Limits: When does the material record *fail* to show an institution?
          *   3. Ethics/Interpretation: What do we lose if we stop claiming to know their beliefs?

      *   **Conclusion:**
          *   Call to action.
          *   Invite the conflict.
          *   End on a strong note.

  4.  **Drafting - Iteration and Refinement (Self-Correction during the process):**
      *   *Check:* Is it too academic? *Fix:* Simplify the language. Use "dirt" and "pots" instead of "assemblages" and "ontologies" where possible, or define them quickly.
      *   *Check:* Is it too long? *Fix:* Keep an eye on word count. 10 minutes is roughly 1,300 words.
      *   *Check:* Is the thesis clear? *Fix:* Repeat the "Kind vs. Degree" distinction.
      *   *Check:* Is the tone right? *Fix:* Ensure I'm not scolding the archaeologists but challenging the *interpretation* habit. Ensure I'm not asking philosophers to ignore reality.
      *   *Refining the Concession:* Make sure I don't undermine my own argument. The concession should be: "Yes, they are linked in life, but distinct in death (the record)."

  5.  **Final Polish (Reviewing against constraints):**
      *   No citations. (Check.)
      *   Spoken style. (Check for contractions, direct address, rhetorical pauses.)
      *   Address both groups. (Check.)
      *   Core thesis prominent. (Check.)

  6.  **Writing the Script:** (Proceeding to generate the text based on these thoughts.)
