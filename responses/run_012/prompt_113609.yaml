answer: |-
  Elena sat in the quiet hum of the server room, the glow of the monitor illuminating the dust motes dancing above her keyboard. On the screen lay the digital ghost of Arthur Penhaligon. For thirty years, Arthur had generated data: credit card swipes, GPS pings, calendar invites, mouse hovers. Now Arthur lay in a hospital bed, his mind gone, and the court had appointed Elena's algorithm as his legal proxy. She had to build a reward function—a mathematical map of what Arthur valued—so the agent could spend his money and manage his life as he would have.

  She began with the paths. Arthur had commuted to work every day for a decade. Elena programmed the agent to minimize travel time, assuming time was money. But then she tweaked the math. She added a term that taxed every step away from home but refunded it exactly upon arrival at the office. The total cost of the commute remained identical. The agent chose the exact same routes. Yet, in the first version, Arthur valued efficiency; in the second, he valued being at home so intensely that leaving was painful, only soothed by reaching work. The behavior was identical, but the internal story had flipped. Elena noted this in her log: *Gauge freedom.* The numbers were fixed only up to a transformation that vanished over a complete trajectory. She could make Arthur seem selfish or devoted without changing a single predicted turn of the wheel.

  Next, she looked at leisure. Arthur had never purchased opera tickets. The initial model assumed a reward of zero for classical music. But Elena overlayed the financial data. During those years, Arthur's disposable income was negligible. He hadn't chosen against the opera; the choice had never been available. The traces recorded choices, not the walls of the maze he walked within. If she adjusted the model to say he loved music but was constrained by cash, the past data still fit perfectly. Now that Arthur's estate was liquid, the agent faced a new choice: buy the season tickets? The data couldn't say. A preference for a thing could always be traded off against a constraint that concealed it.

  Then there was the noise. Arthur ate healthy meals ninety percent of the time. Sometimes, however, he bought fast food at 2:00 AM. Was Arthur a health nut who occasionally slipped? Or was he indifferent to diet, merely habituated to salads? Elena adjusted the parameter controlling randomness. She could model him as sharply opinionated with rare errors, or deeply indifferent with consistent habits. Both curves hugged the historical data points with equal fidelity. She ran the validation on the last six months of held-out data. The predictions were green across the board. The model knew where he would have gone, what he would have bought, how long he would have stayed. The accuracy was ninety-eight percent.

  But accuracy on the past was not understanding the future.

  The crisis arrived on a Tuesday. The hospital required a decision on long-term care. Option A was a standardized facility: efficient, sterile, cost-effective. Option B was a specialized home-care setup: expensive, requiring estate management, but allowing Arthur to remain in his own house.

  The agent hesitated. In the data, Arthur had never managed staff; he had always been an employee. Was this a constraint he would have welcomed removing, or a burden he avoided? In the data, Arthur had never sold his home. Did he love the house, or was the market simply never right? The gauge freedom meant the agent could assign high value to the house's location or high value to the safety of the facility, and both would align with his history of staying put. The noise parameter mattered too. If Arthur was sharp about his environment, the sterile facility was a torture he would have avoided at all costs. If he was indifferent, the facility was a rational savings opportunity.

  Elena looked at the validation metrics. They were perfect. They were useless. The model predicted the paths he had taken, but it could not distinguish between the love of the path and the lack of alternatives. She had to commit to a parameterization. If she chose the "sharp preference" model, the agent would spend heavily to keep him home, potentially depleting the inheritance for his daughter. If she chose the "indifferent" model, the agent would sell the house and place him in care, preserving the money but breaking a promise Arthur might have felt deeply.

  She thought about the gauge freedom. She could shift the value of the house without changing the optimality of his past commutes. She could claim he loved the house, or claim he merely hated moving. There was no evidence to adjudicate. The data was a shadow, and she was trying to reconstruct the object.

  Elena typed a command. She selected the model that assumed strong preference for home environment over financial efficiency. She chose the interpretation that favored the person over the ledger. She knew it was arbitrary. She knew another researcher could justify the opposite with the same math. But the agent had to act, and inaction was itself a decision. She hit execute. The agent authorized the home care. The funds were transferred. The house remained.

  Elena leaned back. The system was live. It would make thousands of decisions now, all logically consistent with the man Arthur had been, and all potentially wrong about the man he was. She had recovered a function that worked, but she had not recovered the mind.

  The problem I faced is known as the identifiability problem in inverse reinforcement learning. We observe actions and try to infer the goals that caused them. But many different goals can produce the same actions. We cannot tell the difference between what someone wanted and what they were forced to do, nor between what they cared about deeply and what they simply did out of habit. The data fits multiple stories equally well, and choosing one over the other changes the future, even if it doesn't change the past.
