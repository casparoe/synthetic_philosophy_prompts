answer: |-
  The current landscape of animal welfare legislation and institutional ethics review presents a striking paradox. On one hand, vertebrate protection is robust, grounded in a precautionary principle regarding sentience; on the other, insects are largely excluded, despite their astronomical numbers and the unresolved nature of their sentience. To understand this inconsistency, we must reconstruct the implicit moral framework guiding current practice, distinguish its necessary commitments from its convenient contingencies, and consider the implications of shifting towards an expected-value model.

  ### The Implicit Conception of Moral Status

  The prevailing practice presupposes a **Threshold View** of moral status, tempered heavily by **Administrative Pragmatism**.

  Under a pure Expected-Value View, moral weight is calculated as the product of the probability of sentience ($P$), the capacity for suffering ($S$), and the number of individuals ($N$). If $P$ for insects is merely $0.01$, but $N$ is $10^{12}$, the aggregate moral weight should theoretically dwarf that of vertebrates, where $P$ is near $1.0$ but $N$ is comparatively small. The fact that legislation does not reflect this calculation indicates that the current system does not treat moral status as continuously aggregative across all living entities.

  Instead, the system operates on a binary or lexical threshold. An entity must clear a specific epistemic bar regarding the *probability* of sentience before it enters the moral community at all. Below this line, $N$ is irrelevant; moral weight is effectively zero. Above this line, $N$ and $S$ determine the extent of protection. Consequently, the current framework treats moral status not as a scalar quantity that accumulates with population size, but as a gatekeeping status determined by phylogenetic proximity and neurological complexity.

  ### Strict Presupposition vs. Comfortable Accommodation

  It is vital to distinguish what the current practice *strictly presupposes* from what it merely *accommodates comfortably*.

  **Strict Presupposition:**
  At its core, the practice strictly presupposes that **epistemic confidence in sentience is a necessary condition for moral consideration.** It commits to the claim that uncertainty can justify exclusion. If the law protected insects, it would admit that a low probability of sentience, when multiplied by vast numbers, generates moral obligations. By excluding them, the law presupposes that below a certain confidence interval, the moral claim is void, regardless of scale. It further presupposes that moral status is fundamentally tied to specific biological capacities (likely centralised nervous systems) rather than the aggregate sum of potential experiences.

  **Comfortable Accommodation:**
  The practice accommodates, but does not strictly require, **Administrative Pragmatism**. While regulators often cite the impossibility of monitoring trillions of insects as a reason for exclusion, this is a policy constraint, not a moral axiom. The system accommodates the view that 'ought implies can'; if we cannot practically enforce welfare standards for insects, we are not obliged to try. However, this is a comfortable fit rather than a logical necessity. One could imagine a system that mandates welfare standards for insects but relies on statistical sampling rather than individual oversight. The current reliance on pragmatism allows the Threshold View to persist without having to defend the specific location of the threshold philosophically; it simply hides behind the veil of intractability.

  ### Philosophical Underdetermination

  The current framework is philosophically underdetermined in several critical areas:

  1.  **The Location of the Threshold:** There is no explicit criterion for why the threshold sits between decapods and insects. Is it based on brain structure, behavioural complexity, or evolutionary distance? The law remains silent, leaving the boundary arbitrary from a theoretical standpoint.
  2.  **The Aggregation Problem:** The framework is underdetermined regarding whether small harms can aggregate to outweigh large harms. Does the suffering of a trillion insects, each with a 1% chance of feeling it, outweigh the torture of one dog? Current practice suggests 'no', but no ethical theory underpinning the legislation explicitly justifies this non-aggregation.
  3.  **Epistemic vs. Ontological Claims:** It is unclear whether insects are excluded because they *are not* sentient (ontological) or because we *do not know* if they are (epistemic). The precautionary principle suggests the latter, yet the exclusion acts as if the former were true.

  ### Rebuilding on a Probability-Weighted Scale Argument

  If welfare law and ethics review were rebuilt on an explicitly probability-weighted version of the scale argument (an Expected-Value View), the changes would be profound and disruptive.

  **1. Legislative Scope:**
  Legislation would need to expand beyond listed species to include all animals with a non-negligible probability of sentience. This would likely encompass all arthropods. The UK Animals (Scientific Procedures) Act 1986, for instance, would require amendment to remove the exclusion of invertebrates (save for cephalopods) and replace it with a risk-based classification.

  **2. Ethics Review and Harm-Benefit Analysis:**
  Ethics committees would be required to calculate expected moral cost. A research proposal involving one million insects would need to demonstrate that the potential benefit outweighs the aggregate expected suffering ($N \times P \times S$). This would make large-scale insect research significantly harder to justify unless the probability of sentience could be empirically lowered or the welfare measures drastically improved.

  **3. Rearing and Slaughter:**
  The insect farming industry would face immediate regulatory burdens. Currently, insects are often killed by freezing or heating without anaesthesia. Under an expected-value framework, even a low probability of suffering would mandate humane killing methods proportional to the risk. Given the scale of $N$, the cost of implementation would be high, potentially requiring automated stunning technologies and strict environmental controls to minimise stress during rearing.

  **4. Administrative Shift:**
  To manage the scale, regulation would have to shift from individual animal tracking to population-level welfare metrics. Instead of licensing individual procedures, authorities might licence facilities based on their capacity to maintain welfare standards across bulk populations. This acknowledges the pragmatic constraint while adhering to the moral imperative of the expected-value view.

  ### Conclusion

  The current inconsistency in animal welfare protection presupposes a Threshold View of moral status, wherein epistemic uncertainty regarding sentience acts as a veto, rendering numbers irrelevant below a certain phylogenetic line. While this view accommodates administrative pragmatism, it remains philosophically underdetermined regarding the justification of the threshold and the aggregation of harm. Shifting to an expected-value framework would not merely expand the list of protected species; it would fundamentally alter the calculus of ethical review, forcing a confrontation between the sheer scale of insect use and the moral weight of even a improbable capacity for suffering. Until such a shift occurs, the protection of vertebrates remains a moral luxury purchased at the expense of the invertebrate multitude.
