          *   *Comfortable Accommodation:* It accommodates the pragmatic view (we can't regulate flies). It accommodates speciesism (phylogenetic closeness). It fits comfortably with a "lexical priority" where vertebrate welfare always trumps invertebrate welfare regardless of numbers.

      *   **Philosophical Underdetermination:**
          *   Where is the theory vague? The definition of sentience. The weight of probability. The aggregation problem (does small suffering $\times$ huge numbers equal large suffering?).
          *   The law doesn't specify *why* the threshold is where it is. It's underdetermined between a metaphysical claim (insects *aren't* sentient) and an epistemic claim (we *don't know* if they are).

      *   **Expected-Value vs. Threshold:**
