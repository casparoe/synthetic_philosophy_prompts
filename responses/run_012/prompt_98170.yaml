      *   *Justification:* Sentience probability. Vertebrates = high probability. Insects = low/uncertain probability.
      *   *The Tension:* $1 \text{ vertebrate} \times \text{high } P(\text{sentience})$ vs. $10^{12} \text{ insects} \times \text{low } P(\text{sentience})$.
      *   *The "Scale Argument":* Numbers matter. If $P > 0$, then $N \times P$ could be huge.
