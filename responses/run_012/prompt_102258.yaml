      *   *Nuance:* If the membership votes to overrule the Board, and they do it by 2/3 (claiming the unanimous rule doesn't apply to the interpretation), you have a constitutional crisis. The Chair needs to know what to do if that happens. (Answer: Declare the result, note the objection, advise legal counsel).
