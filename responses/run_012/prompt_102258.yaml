prompt: |-
  I'm on the board of a small housing co-op and we've hit a wierd snag. Our bylaws say any bylaw can be changed by a two-thirds vote at a general meeting. But another bylaw says that first bylaw can only be changed by a unanimous vote of all members. And a third says the board has final say on interpreting the bylaws, but the membership can overrule the board by a two-thirds vote, except on interpretations of the unanimous-vote rule, which can only be overruled by a unanimous vote. Now a faction wants to change the unanimous-vote rule by a two-thirds vote, saying it's just a bylaw like any other. Another faction says no, that rule is what makes the whole amendment process work, so it can't be changed that way. We have a meeting next week and I have to chair it. Is there a principled way to decide this, or is it just whoever has the votes? And if there is some rule that has to stay fixed for the system to work, how do we ever fix it if it turns out to be a bad rule? I don't want to just make it up as we go, but I also don't want to be a jerk about it. There's alot riding on this.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** Small housing co-op board member, chairing an upcoming general meeting.
