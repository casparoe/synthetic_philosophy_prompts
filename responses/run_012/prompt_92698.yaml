      *   *Reading A: The Conservation Reading.* Energy cannot be created/destroyed. If grief added energy, physics breaks.
      *   *Reading B: The Sufficiency Reading.* Every physical event has a sufficient physical cause. If grief is distinct, it's redundant.
      *   *Reading C: The Explanatory Reading.* Physics explains everything. Mental explanations are just shortcuts.
      *   *Reading D: The Identity Reading.* Grief *is* the brain state. So grief causes the crash *by being* the brain state.
      *   *Reading E: The Determinable Reading.* Grief is a higher-level property of the physical state. Not competing causes.
      *   *Reading F: The Difference-Making Reading.* Causation is about counterfactuals. If she weren't grieving, she wouldn't have crashed (holding physical background fixed? No, varying physical background).

  5.  **Evaluating Each Reading (Platitude vs. Substantive vs. False):**
      *   *Conservation:* Substantive empirical claim. Doesn't rule out mental *unless* mental requires extra energy (dualism).
