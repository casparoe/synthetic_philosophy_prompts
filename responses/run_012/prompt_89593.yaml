          *   *Correction on CDT in Death in Damascus:* In the standard case (no cost), CDT says it doesn't matter *causally*, but usually, it recommends fleeing because of deliberational dynamics (Arntzenius/Gibbard/Harper). Actually, the standard result is that CDT is *unstable*. If you think you will stay, you think Death is in Damascus, so you should flee. If you think you will flee, you think Death is in Aleppo, so you should stay.
