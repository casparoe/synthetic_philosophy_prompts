  If I assign $P(\text{Flee}) = 0.5$, then $P(\text{Death in Aleppo}) = 0.5$.
  $EU(\text{Flee}) = 0.5 U(\text{Death}) + 0.5 U(\text{Life}) - c$.
  $EU(\text{Stay}) = 0.5 U(\text{Life}) + 0.5 U(\text{Death})$.
