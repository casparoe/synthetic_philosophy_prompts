answer: |-
  ### (1) Exam Question

  **Question 3: Death in Damascus with a Cost (20 Marks)**

  *Recommended time: 25 minutes.*

  **The Case:**
  You are in Damascus. Death tells you he has come for you and that his appointment book is infallible: he is already scheduled to be in whichever city you choose to be in tomorrow. You can Stay in Damascus or Flee to Aleppo. If Death is in the same city as you, you die (Utility = 0). If he is not, you survive (Utility = 100). In the standard case, both options seem fatal.

  **The Variant:**
  Suppose Fleeing is costly (selling property, miserable camel ride). Let the cost be $c > 0$. Staying costs nothing. Death remains infallible; he will be in the city you choose.

  **Task:**
  Write a concise essay addressing the following four points:
  1.  **EDT's Recommendation:** What does Evidential Decision Theory recommend in this cost variant? Does the cost resolve the "shrug" problem (i.e., that both options are fatal)?
  2.  **CDT's Stability:** What does Causal Decision Theory recommend? Explain why this recommendation fails the test of *deliberational stability* (i.e., could you endorse the reasoning after acting on it?).
  3.  **The Newcomb Distinction:** A student argues, "CDT solves Newcomb's Problem by noting the box contents are fixed; the same logic applies here: Death's location is fixed, so just maximize survival chances." Explain why this transplant of Newcomb-reasoning fails in this specific case.
  4.  **Infallibility vs. Reliability:** Which parts of your analysis depend on Death being *infallible*? Briefly explain what happens to the recommendations if Death is only 90% reliable.

  ***

  ### (2) Model Answer

  In the cost variant of Death in Damascus, Evidential Decision Theory (EDT) and Causal Decision Theory (CDT) diverge sharply, revealing structural flaws in how each handles perfect prediction.

  **1. EDT's Recommendation**
  EDT evaluates actions based on the news they bring. Since Death is infallible, choosing to Flee is perfect evidence that Death is in Aleppo, guaranteeing death. Choosing to Stay is perfect evidence Death is in Damascus, also guaranteeing death. In the standard case, EDT yields equal expected utility for both, resulting in a "shrug." However, the cost $c$ breaks this tie. The expected utility of Fleeing is $U(\text{Death}) - c$, while Staying is $U(\text{Death})$. Since $c > 0$, EDT definitively recommends **Stay**. The cost resolves the indeterminacy by penalizing the futile action, allowing EDT to offer a stable preference even when survival is impossible.

  **2. CDT's Stability**
  CDT evaluates actions based on their causal consequences, screening off correlations. It treats Death's location as causally independent of your choice. Consequently, CDT calculates expected utility using the prior probability of Death's location, which mirrors your own propensity to choose. If you lean toward Staying, you assign high probability to Death being in Damascus, making Fleeing look causally efficacious for survival (since you assume Death's location is fixed independent of your act). If you lean toward Fleeing, you assign high probability to Death being in Aleppo, making Staying look better.
  This creates **deliberational instability**. There is no fixed point where your intention matches the recommended action. You cannot endorse the advice after acting because the reasoning that generated the advice (the probability assignment) shifts once the decision is made. Furthermore, CDT's arithmetic implies a non-zero probability of survival (by weighting the possibility that Death is in the *other* city), which contradicts the premise of infallibility. CDT effectively ignores the logical constraint that makes survival impossible.

  **3. The Newcomb Distinction**
  The student's objection fails because it conflates causal independence with probabilistic independence. In Newcomb's Problem, the money is fixed in the past; your choice cannot change it, and two-boxing dominates because the correlation is screened off by the past cause. In Death in Damascus, the "state" (Death's location) is not merely a past fact; it is defined by a logical relation to your choice. While your choice does not *cause* Death's location, the location is not independent of the choice in the way CDT requires for its probability calculus. Transplanting the Newcomb solution ignores that Death's infallibility creates a logical loop that CDT's causal partition cannot sever without assigning impossible probabilities.

  **4. Infallibility vs. Reliability**
  The analysis depends heavily on infallibility. If Death is only 90% reliable, the logical loop breaks. EDT still likely recommends Staying (to save cost $c$), as the evidential link remains strong, but survival becomes possible. CDT becomes more stable; with imperfect correlation, the probability assignments may converge on a mixed strategy or a pure strategy without oscillating, as the agent can assign a genuine chance to survival that doesn't immediately invert upon deliberation. The "impossible probability" error vanishes because survival is no longer logically excluded.

  ***

  ### (3) Marking Scheme

  **Total: 20 Marks**

  **1. EDT on Cost Variant (4 Marks)**
  *   **2 Marks:** Correctly identifies that EDT sees the choice as evidence of Death's location (correlation = 1).
  *   **2 Marks:** Correctly concludes EDT recommends **Stay** because $U(\text{Stay}) > U(\text{Flee}) - c$. Notes that cost resolves the "shrug."
  *   *Common Error:* Claiming EDT still shrugs because death is certain regardless of cost (misses utility maximization).

  **2. CDT Stability & Probability (6 Marks)**
  *   **3 Marks:** Explains CDT instability (oscillation): intending to stay makes fleeing look good, intending to flee makes staying look good. No stable fixed point.
  *   **3 Marks:** Identifies the "Impossible Probability" issue: CDT assigns non-zero survival probability by treating Death's location as independent, contradicting the infallibility premise.
  *   *Common Error:* Saying CDT recommends Fleeing (or Staying) definitively without addressing the feedback loop/dynamics.

  **3. Newcomb Distinction (4 Marks)**
  *   **2 Marks:** Notes that in Newcomb, the state is causally independent *and* fixed in the past.
  *   **2 Marks:** Explains that in Death, the state is logically tied to the choice; treating it as independent (like Newcomb) violates the case description (infallibility).
  *   *Common Error:* Arguing Newcomb and Death are identical cases structurally.

  **4. Infallibility vs. Reliability (4 Marks)**
  *   **2 Marks:** Identifies that infallibility creates the logical contradiction/instability for CDT.
  *   **2 Marks:** Correctly notes that 90% reliability allows for genuine survival probability, stabilizing CDT and keeping EDT's recommendation (likely) the same but for different reasons.
  *   *Common Error:* Claiming 90% reliability makes no difference to the formal structure.

  **5. Clarity and Structure (2 Marks)**
  *   **2 Marks:** Essay is coherent, addresses all four prompts, and stays within time limits (concise).
  *   *Common Error:* Disorganized or fails to address one of the four sub-questions.
