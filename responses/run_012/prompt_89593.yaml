      *   *Self-Correction on CDT:* In the cost variant, CDT is even *more* unstable or just unstable? If $c > 0$, CDT might say "Stay" if you think you'll stay, but "Flee" if you think you'll flee? Actually, if CDT treats Death's location as causally independent, it calculates $EU(\text{Flee}) = P(D \in A) \cdot U(\text{Death}) + P(D \in D) \cdot U(\text{Survival}) - c$. Since $U(\text{Survival}) \gg U(\text{Death})$, CDT usually recommends Fleeing *unless* $P(D \in D)$ is extremely low. But since $P(D \in D) = P(\text{Stay})$, if you intend to stay, $P(D \in D) = 1$, so $EU(\text{Flee}) = U(\text{Death}) - c$. $EU(\text{Stay}) = U(\text{Death})$. So if you intend to stay, CDT says Stay. If you intend to flee, $P(D \in A) = 1$, so $EU(\text{Flee}) = U(\text{Death}) - c$, $EU(\text{Stay}) = U(\text{Death})$. So CDT says Stay?
      *   *Wait, let's trace CDT carefully.*
