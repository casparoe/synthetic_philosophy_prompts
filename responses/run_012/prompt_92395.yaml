answer: |-
  There is no established term in the philosophy of probability, statistics, or forecasting that specifically names this pattern.

  While the components you describe are well-documented individually, their combination into a defensive rhetorical strategy does not have a standard label.
  *   **The Reference Class Problem** (Reichenbach/Venn) addresses the underdetermination of the *frequency* due to class selection, but it assumes a frequentist framework. It does not account for switching to subjective or propensity interpretations to save the number.
  *   **The Problem of the Single Case** addresses whether probabilities apply to unique events, but it does not address the *shifting justification* for the number.
  *   **Principled Pluralism** (e.g., Gillies, Galavotti) argues that different interpretations are valid in different contexts, but it requires *consistency* within a context and explicit acknowledgment of the shift. It is a methodological virtue, whereas your pattern is an epistemic vice.
  *   **Equivocation** is the logical fallacy involved, but it is too broad. It does not capture the specific dynamic of protecting a fixed numerical estimate against falsification by exploiting the polysemy of "probability."

  Because this specific maneuver—exploiting the ambiguity of probability interpretations to render a specific estimate unfalsifiable—lacks a name, I propose the term **Interpretive Immunization**.

  Below is the definition and carving you requested.

  ***

  ### Term: Interpretive Immunization

  **Definition:**
  Interpretive Immunization is a rhetorical and epistemic strategy in which a speaker defends a fixed probability estimate against criticism by opportunistically shifting between incompatible ontological interpretations of probability (e.g., Frequentist, Subjectivist, Propensity) without adjusting the numerical value. The shift is driven solely by defensive utility: each interpretation is invoked only when it shields the estimate from a specific objection, and abandoned when it exposes the estimate to a different one. The result is a claim that is structurally unfalsifiable.

  **Necessary Conditions (The Edges):**
  For a pattern of argument to count as Interpretive Immunization, all four of the following must be present:
  1.  **Numerical Fixity:** The probability value (e.g., "20%") remains constant throughout the defense, even as the justification for it changes.
  2.  **Interpretive Incompatibility:** The justifications appealed to rely on interpretations of probability that are mutually exclusive in standard philosophy (e.g., claiming the number is an objective frequency when challenged on belief, but an objective propensity when challenged on sample size).
  3.  **Defensive Contingency:** The choice of interpretation is determined by the *type of objection* raised, not by the nature of the evidence or the context of the inquiry. (e.g., Frequentism is used to deflect charges of bias; Subjectivism is used to deflect charges of insufficient data).
  4.  **Immunizing Effect:** The shifting prevents the claim from being empirically tested or logically falsified. No single interpretation is held long enough for its verification conditions to be applied.

  **Sufficient Conditions:**
  If a speaker maintains a fixed probability claim and meets conditions 1–4, they are engaging in Interpretive Immunization, regardless of whether they are consciously deceiving others or are themselves confused about the nature of probability.

  ***

  ### Distinctions from Nearest Neighbors

  **1. vs. The Reference Class Problem**
  *   **The Neighbor:** The Reference Class Problem notes that any individual case belongs to multiple classes with different frequencies (e.g., "smokers" vs. "smokers with gene X"), making the frequency claim underdetermined.
  *   **The Difference:** The Reference Class Problem is a *symmetric* difficulty about data selection within a *single* interpretation (Frequentism). Interpretive Immunization is an *asymmetric* maneuver that jumps *between* interpretations. In the Reference Class Problem, the frequency changes when the class changes. In Interpretive Immunization, the *number stays the same* while the *meaning of the number* changes to justify it.

  **2. vs. The Problem of the Single Case**
  *   **The Neighbor:** This problem asks how objective probabilities (frequencies/propensities) can apply to a unique, non-repeatable event (e.g., "Will *this* election be won?").
  *   **The Difference:** The Single Case problem is a metaphysical or logical puzzle about applicability. Interpretive Immunization is a dialectical strategy used to *evade* that puzzle. A speaker engaging in Interpretive Immunization uses the Single Case problem as a shield (switching to Subjectivism when repeatability is challenged) rather than grappling with it.

  **3. vs. Principled Pluralism**
  *   **The Neighbor:** Pluralists (like Donald Gillies) argue that different interpretations are valid for different purposes (e.g., Frequencies for insurance, Credences for betting).
  *   **The Difference:** Pluralism is **consistent** and **transparent**. A pluralist says, "Here I am using frequency, there I am using credence," and accepts that the numbers might differ or serve different functions. Interpretive Immunization is **opportunistic** and **opaque**. It insists the *same number* serves *all functions* simultaneously, depending on which function is under attack. Pluralism seeks clarity; Immunization seeks invulnerability.

  ***

  ### Boundary Cases

  **1. The Excluded Case (Resembles it, but is not): *Contextual Pluralism***
  *   **Scenario:** A climate scientist says, "For historical temperature trends, we use frequentist confidence intervals (95%). For future policy risk under novel emissions scenarios, we use subjective Bayesian credences (95%)."
  *   **Why Excluded:** The scientist explicitly labels the interpretations. They do not claim the 95% frequency *is* the 95% credence. They do not switch to defend a single fixed number; they allow the numbers to vary based on the method. There is no attempt to render the claim unfalsifiable; rather, the verification conditions for each claim are clearly stated.

  **2. The Included Case (Easy to miss): *Reified Confusion***
  *   **Scenario:** A doctor insists, "There is a 20% chance of recurrence." When asked for data, she cites survival rates (Frequency). When told the patient is unique, she says, "It's my clinical judgment" (Subjective). When asked if it's just a guess, she says, "No, the tumor biology dictates it" (Propensity). She genuinely believes "20%" is a physical property of the tumor that *also* reflects data *and* her belief.
  *   **Why Included:** Even though the speaker is not cynically manipulating the argument, the *structure* is Interpretive Immunization. The claim remains unfalsifiable because the speaker treats the three incompatible interpretations as a single "natural kind." The effect is the same: the number cannot be tested because its ontological status slides away upon contact. This is the cognitive root of the rhetorical strategy.

  ### Summary of the Carving
  **Interpretive Immunization** is not merely being vague. It is the specific exploitation of the **ambiguity of the word "probability"** to create a **Popperian immunizing stratagem**. It differs from the Reference Class Problem because it changes the *ontology* rather than the *population*. It differs from Pluralism because it is *defensive* rather than *methodological*. It turns probability from a tool of measurement into a shield against refutation.
