      *   *Refining Ergodicity:* Ole Peters argues that the expectation value is irrelevant for a single agent playing over time. The geometric mean (growth rate) is the relevant metric. For St. Petersburg, the geometric mean is finite (actually quite low). This solves it without needing "psychological" utility functions. It's a physics/math fix, not a psych fix. This directly addresses the "hidden assumption" prompt.

