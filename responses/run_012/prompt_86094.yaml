answer: |-
  You are not going round in circles because you have missed something; you are going round in circles because the thing you are chasing is, strictly speaking, impossible. The frustration your logician feels is not a bug in his understanding, but a feature of the landscape. You have stumbled upon the exact reason why this field is still alive and kicking after two millennia.

  Here is the specification you asked for, followed by the bad news about which lines on the spec cannot be drawn simultaneously.

  ### The Spec: Desiderata for a Theory of Truth

  If your logician is building a system to model ordinary language (rather than a formal calculus designed to avoid the mess), these are the demands he is placing on his theory.

  1.  **Transparency (The T-Schema):**
      *   *The Requirement:* The move from 'Snow is white' to 'It is true that snow is white' (and vice versa) must be valid without restriction. The truth predicate adds no content; it is a device for disquotation.
      *   *The Case:* If I say, "What she said is true," I am not attributing a mysterious property to her sounds; I am endorsing her claim. If the theory makes 'True' a heavy, substantive property, it fails to capture how we actually use the word.

  2.  **Expressive Completeness (Generalisation):**
      *   *The Requirement:* One must be able to say things like "Everything the Pope says is true" without listing every sentence the Pope has ever uttered.
      *   *The Case:* We use truth to quantify over infinite sets of claims. A theory that requires us to unpack every instance is useless for human speech.

  3.  **Semantic Closure (No Hierarchy):**
      *   *The Requirement:* The language must be able to contain its own truth predicate. Ordinary speakers are not forbidden from saying, "This sentence is true."
      *   *The Case:* Tarski solved the paradox by saying a language cannot define its own truth (you need a meta-language). But we do it all the time. A theory that bans this is modelling a robot, not a human.

  4.  **Classical Logic:**
      *   *The Requirement:* The Law of Non-Contradiction (nothing is both true and false) and the Law of Excluded Middle (everything is either true or false) must hold.
      *   *The Case:* If you lose these, proof by contradiction dies. Mathematics as we know it becomes unstable. Your logician likely views this as surrender.

  5.  **The Gap/Glut Distinction:**
      *   *The Requirement:* A sentence that lacks a truth value (a gap) must be distinct from a sentence that has both values (a glut).
      *   *The Case:* "The King of France is bald" (gap) feels different from "This sentence is false" (glut/candidate). Collapsing them muddies the water between nonsense and paradox.

  ### The Incompatibility: The Trilemma

  Here is the answer to your question about which pairs cannot be had together. It is not merely a pair; it is a trio. You cannot have the following three simultaneously:

  1.  **Classical Logic.**
  2.  **Semantic Closure** (Self-reference allowed, no hierarchy).
  3.  **Full Transparency** (The T-Schema holds for all sentences).

  If you have any two, the third must break. This is the upshot of Tarski's Undefinability Theorem and the Liar Paradox.

  *   If you keep **Classical Logic** and **Semantic Closure**, you must restrict **Transparency**. (You have to say the T-Schema fails for the Liar sentence. But then, why? What makes that sentence special?)
  *   If you keep **Transparency** and **Semantic Closure**, you must sacrifice **Classical Logic**. (You allow gaps or gluts. This is where the 'gap vs. glut' distinction becomes vital.)
  *   If you keep **Classical Logic** and **Transparency**, you must impose a **Hierarchy**. (You ban the language from talking about its own truth. This solves the maths but kills the natural language application.)

  **Which single requirement thins out the field the most?**
  **Classical Logic.**
  The moment your logician insists that the Law of Excluded Middle cannot be touched, he eliminates the majority of modern solutions (paraconsistent and paracomplete logics). He forces himself into the Tarskian corner (hierarchies) or into a denial of natural language (banning self-reference). If he is willing to break logic, the field opens up, but the cost is high.

  ### The Fiction Constraint

  You asked if a theory of truth *owes* you an account of sentences in fiction.

  **The Philosophical Boundary:**
  Strictly speaking, no. Standard theories of truth (correspondence, coherence, deflationary) deal with *assertoric* discourse—claims made about the actual world. Truth *in* fiction is usually handled by a separate operator: "In the story *S*, *p* is true." This is a modal notion, not a semantic one.

  **The Novelist's Opportunity:**
  However, your logician is likely trying to build a *Unified Theory of Content*. He wants one predicate, $T$, that works for "Paris is in France" and "Holmes lived in Baker Street."

  If he insists on one predicate without context parameters, he creates a contradiction.
  *   $T(\text{Holmes lived in London})$
  *   $\neg T(\text{Holmes lived in London})$ (Because Holmes does not exist).

  To make this work without two predicates, the theory must treat truth as **relational**. Truth is not a property of a sentence alone, but of a sentence *relative to a context* (or a 'world').
  *   *The Risk:* If he treats fiction as just another 'context', he risks making truth too easy. If 'true' just means 'true in some context', then everything is true somewhere. He needs a 'base world' (reality) to anchor the predicate.
  *   *The Free Indirect Style Problem:* This is the killer for his theory. In free indirect style, the voice slides between narrator and character.
      *   *Sentence:* "He was alone, finally free."
      *   *Problem:* Is this true in the world of the story (narrator fact)? Or true only in the character's delusion?
      *   *Requirement:* His theory needs an index for **commitment**. Who is asserting this? If the theory cannot track *who* is bound by the truth claim, it cannot handle the novel form.

  **Does the theory owe you this?**
  No. But your logician *believes* it does. This is likely why he is unwell. He is trying to solve the Liar Paradox (hard) and the Problem of Fictional Truth (separate hard problem) with a single tool. He is trying to make semantics do the work of pragmatics.

  ### The Families (One Line Each)

  *   **Tarskian Hierarchies:** Saves classical logic by banning the language from talking about itself; accurate for maths, dead on arrival for novels.
  *   **Kripkean Fixed Points:** Allows gaps (sentences with no truth value) to stop the Liar; keeps classical logic mostly, but loses the Law of Excluded Middle for problematic sentences.
  *   **Paraconsistent Logics:** Accepts gluts (sentences can be true and false); keeps the T-Schema and self-reference, but sacrifices the Law of Non-Contradiction.
  *   **Contextualist Theories:** Says the word 'true' shifts meaning depending on when it is spoken; solves the paradox by making truth unstable, which might suit your fiction theme nicely.
  *   **Deflationism:** Says 'true' isn't a property at all, just a grammatical tool; dissolves the problem by denying there is anything to explain, which might enrage your logician.

  ### Summary for the Character

  Your logician is exhausted because he is demanding a system that is **semantically closed**, **classically consistent**, and **fully transparent**. He cannot have all three.

  If he wants to account for fiction with the same predicate, he must also make truth **context-sensitive**. If he refuses to do that, his theory will declare all fictional statements false (because Holmes doesn't exist) or all of them true (because they exist in the text).

  The tragedy of his condition is that he is looking for a static solution to a dynamic problem. He wants a single key for every lock, but the locks keep changing shape.
