answer: |-
  ### Verdicts Restated

  You present eight cases involving the exchange of value for influence. You judge speed money (1), lawful campaign donations buying access (5), and overpriced contracts for former officials (7) as corrupt. You judge post-facto gifts (2), private sector tipping (3), hiring a qualified nephew (4), and a farmer paying protection (8) as not corrupt. The cousin at customs (6) is your tension point: you lean toward "not corrupt" due to kinship, though you acknowledge it mirrors the speed money case. Your goal is a principle that explains these distinctions without relying on legality or local norms.

  ### The Principle

  Corruption is the subversion of an **entrusted public or institutional role** by a **particularistic private interest**, where that interest **determines the distribution** of a good or service that ought to be governed by **universalistic norms**.

  This principle has four clauses, each earned by your verdicts. First, the role must be **entrusted** with a public or institutional good. This excludes the maître d' (3), whose role is commercial hospitality, not public trust, and the farmer (8), who holds no entrusted power. Second, the motive must be a **particularistic private interest** (money, kinship, political capital). This captures the clerk (1), the mayor (5), and the minister (7), while excluding the nurse (2), whose gift was unsolicited and post-facto, thus not a motivating interest.

  Third, the private interest must **determine the distribution**. This acquits the nephew case (4). Although kinship was present, it did not determine the outcome; merit did. The process was tainted, but the role's rationale (hiring the best) was fulfilled. Fourth, the distribution ought to be governed by **universalistic norms** (queue, merit, law). This convicts the speed money clerk (1), who swapped a queue for cash, and the mayor (5), who swapped access for donations. It explains why you are angrier at (5) than (1): the mayor subverts the law itself to create the advantage, whereas the clerk merely bypasses a delay within a lawful system.

  This principle also clarifies the consultant case (7). The "private interest" is the future employment or past loyalty of the deputy, which determined the contract price, subverting the norm of fair market value. It handles the farmer (8) by noting the farmer is not the agent subverting the role; he is the victim of the clerk's corruption. The principle focuses on the abuse of the role, not merely the transaction. It distinguishes corruption from mere rudeness or private commerce by anchoring it in the betrayal of a specific duty of impartiality owed to the public or institution.

  ### What It Costs

  To maintain this principle, you must abandon your verdict on Case 6 (The Cousin at Customs). Your principle convicts the cousin. Like the speed money clerk, the customs officer allows a particularistic interest (kinship) to determine the distribution (timing of clearance) of a public good, overriding the universalistic norm (first-come, first-served or standard processing). You resist this because kinship feels socially obligatory in a way cash is not. However, accepting this exception validates your friend's view that corruption is merely a local norm violation. If you accept a "family exception," the principle collapses into cultural relativism, where corruption is only what a specific society forbids.

  A more complicated principle could save Case 6 by adding a clause: "unless the benefit is non-monetary and the recipient was entitled to the outcome anyway." But this is patching. In Case 6, the cousin received faster service than the standard "week later" for those who don't ask nicely. Someone else waited longer. The entitlement was to standard processing, not expedited kinship processing. Abandoning this verdict is worth it because it preserves the core insight: corruption is the privatization of public office. Whether the currency is cash or whisky is secondary to the conversion of public duty into private favor.

  ### Two Undecided Cases

  **(a) The Journalist and the Police Officer:** This is **corrupt**. The officer holds an entrusted public role. The report is a public good distributed by universalistic norm (legal entitlement to access). The officer withholds it to extract a private payment. The private interest (money) determines the distribution (access), subverting the norm. It is identical to Case 1 (Speed Money), even if the money is framed as a "fee." The officer is selling what is already owed.

  **(b) The Regulator and the Revolving Door:** This is **corrupt**, structurally. The regulator holds an entrusted role requiring impartiality. Taking a lucrative job at a regulated firm creates a private interest (future employment) that competes with public duty. Even without a specific *quid pro quo* (Case 5 parallels this), the arrangement converts public trust into private advantage. It undermines the universalistic norm that regulation is performed solely for the public good. Like the mayor's donation, it creates an access channel and incentive structure that biases the role, regardless of whether a specific decision was visibly altered. The corruption lies in the compromise of the role's integrity.

  ### Settled and Contested

  Among philosophers and social scientists, there is settled agreement that corruption involves the abuse of entrusted power for private gain. There is also consensus that legality is not the boundary; lawful acts (like your Case 5) can be corrupt. However, the scope is genuinely contested. Your friend's view—that corruption indices measure resemblance to Western norms—is a serious critique in development sociology, arguing that "informal networks" (like Case 6) are functional social glue, not pathology. Conversely, institutionalists argue that impartiality is a universal requirement for development. The definition of "private gain" is also disputed: does it include political advantage (Case 5) or only material wealth? Finally, the private sector's status is unclear; some argue corporate fraud is corruption, others reserve the term for public office. Your principle sides with the institutionalists: impartiality is the universal standard, and its subversion is corruption, regardless of local tolerance.
