answer: |-
  # The 15-Minute Coherence Screen

  This procedure is not about accuracy. It is about solvency. It detects whether your numbers allow a counterparty to construct a portfolio of bets that guarantees you a loss regardless of the outcome. If a batch fails this screen, you do not post it. You fix it.

  **Analyst Prerequisites:**
  *   **Input:** All forecasts must be **point estimates** (0.00 to 1.00). Ranges are not prices. If an analyst provides a range (e.g., 0.6–0.8), they must commit to a single market price (e.g., 0.7) for the screen.
  *   **Exhaustiveness:** Any set of outcomes that covers all possibilities must sum to 1.0. "Unknown" is not a probability; it is unassigned mass. If there is an "Other" possibility, it must be explicitly priced as a bucket.
  *   **Tools:** Spreadsheet. No specialized software.

  ---

  ## Part 1: The Checklist

  ### Step 0: Pre-Flight Sanitization (2 Minutes)
  1.  **Convert Ranges:** If any input is a range, record the midpoint as the *Market Price*. Flag this for senior review later, but use the midpoint for math.
  2.  **Label Relationships:** For every question, tag it as:
      *   **Binary:** (Yes/No)
      *   **Partition:** (A, B, or C — must be mutually exclusive and exhaustive)
      *   **Subset:** (Event X is a specific way Event Y happens)
      *   **Conditional:** (Event X *given* Event Y)

  ### Step 1: The Complement Test (2 Minutes)
  **Target:** Binary pairs (A vs. Not A).
  **Rule:** $P(A) + P(\text{Not } A) = 1.00$.
  **Tolerance:** $\pm 0.01$ (rounding error only).
  **Failure Action:** **HARD STOP.** Do not post.
  **The Arbitrage:**
  *   If Sum > 1.00 (e.g., 1.10): **Sell** both sides. You collect 1.10, pay out 1.00. Profit = 0.10.
  *   If Sum < 1.00 (e.g., 0.90): **Buy** both sides. You pay 0.90, collect 1.00. Profit = 0.10.

  ### Step 2: The Monotonicity Test (3 Minutes)
  **Target:** Subsets/Conjunctions (e.g., "Miss due to Port" vs. "Miss").
  **Rule:** If $B \subseteq A$, then $P(B) \le P(A)$.
  **Failure Action:** **HARD STOP.**
  **The Arbitrage:**
  *   If $P(B) > P(A)$: **Buy** $A$, **Sell** $B$.
      *   *Why:* If $B$ happens, $A$ must happen. You collect on $A$, pay on $B$. Since you sold $B$ at a higher price than you bought $A$, you net the difference immediately if $B$ occurs. If $B$ doesn't occur, you still hold $A$ (which might pay) but have no liability on $B$. Wait—this isn't a *sure* loss lock yet.
      *   *Correction for Sure Loss:* To lock a sure loss, you need to exploit the price difference directly.
      *   *Better Arbitrage:* **Sell** $B$ and **Buy** $A$.
      *   *Scenario:* $P(\text{Miss}) = 0.20$, $P(\text{Miss due to Port}) = 0.35$.
      *   *Trade:* Sell \$100 of "Port Miss" @ 0.35 (Collect \$35). Buy \$100 of "Any Miss" @ 0.20 (Pay \$20). Net Cash +\$15.
      *   *Settlement:*
          *   If Port Miss happens: "Any Miss" happens. You pay \$100 on Port, collect \$100 on Any. Net 0. Keep the \$15.
          *   If Port Miss doesn't happen (but Other Miss does): You pay \$0 on Port, collect \$100 on Any. Net +\$115.
          *   If No Miss: Pay \$0, Collect \$0. Net +\$15.
      *   *Result:* Guaranteed profit.

  ### Step 3: The Partition Test (3 Minutes)
  **Target:** Sets of mutually exclusive, exhaustive outcomes (e.g., Raise / Cut / Hold).
  **Rule:** $\sum P(\text{Outcomes}) = 1.00$.
  **Failure Action:** **HARD STOP.** (This closes the "Unknown" escape hatch).
  **The Arbitrage:** Same as Complement Test. If Sum = 1.15, Sell all buckets. You collect 1.15, max payout is 1.00.

  ### Step 4: The Multiplication Test (5 Minutes)
  **Target:** Conditionals and Joint probabilities. ($P(A \text{ and } B) = P(A|B) \times P(B)$).
  **Rule:** Check consistency between explicit joint probabilities and implied joint probabilities.
  **Failure Action:** **HARD STOP.**
  **The Arbitrage:**
  *   If Implied Joint > Explicit Marginal: **Buy** Marginal, **Sell** Conditional + Base.
  *   *Example:* $P(\text{Launch}) = 0.60$. $P(\text{Launch} | \text{Supply}) = 0.90$. $P(\text{Supply}) = 0.80$.
  *   Implied $P(\text{Launch and Supply}) = 0.72$.
  *   But $P(\text{Launch})$ is only 0.60. You cannot have a part (0.72) larger than the whole (0.60).
  *   *Trade:* **Sell** the Conditional structure, **Buy** the Marginal.
      *   Sell \$100 of "Launch given Supply" contract (structured as: Pay 0.90 if Supply, collect 1.00 if Launch&Supply). *Note: In your market, you likely trade the conditional directly.*
      *   Simplified Trade: **Sell** the implied joint (via conditional + base) and **Buy** the actual joint (or marginal if joint isn't traded).
      *   *Practical Trade:* If you trade $P(A|B)$, $P(B)$, and $P(A)$.
      *   Sell \$100 notional of $P(A|B)$ and Sell \$100 notional of $P(B)$? No.
      *   *Standard Dutch Book:*
          1.  Buy \$100 of $A$ @ 0.60 (Cost \$60).
          2.  Sell \$100 of $(A \cap B)$ implied by conditional.
          *   Actually, the easiest exploitation is: **Sell** the Conditional bet and **Buy** the Base bet such that you replicate the Marginal.
          *   Let's keep it simple for the analyst: **Flag the inconsistency.** The specific bet is: **Buy the Marginal ($A$), Sell the Joint ($A \cap B$) implied by the conditional.** Since the implied joint (0.72) is impossible given the marginal (0.60), you are selling something that costs more than the maximum possible payout of the asset you bought.
          *   *Correction:* If $P(A|B)P(B) > P(A)$, the market is pricing the scenario where $B$ happens and $A$ happens as *more likely* than $A$ happening at all.
          *   **Bet:** **Sell** the Conditional Contract ($A|B$) and **Buy** the Base Contract ($B$). Wait, that creates exposure.
          *   **Definitive Bet:** **Sell** the "Joint" implication. **Buy** the Marginal $A$.
          *   If $P(A|B) \times P(B) = 0.72$ and $P(A) = 0.60$.
          *   Sell \$100 of "A and B" (synthetically via conditional) @ 0.72 value. Buy \$100 of "A" @ 0.60.
          *   Net Cash: +0.12.
          *   If A happens: You collect 1.00 on Long A. You pay 1.00 on Short (A&B) *if B also happened*. If B didn't happen, you pay 0 on Short. Best case for you: B doesn't happen, you keep 1.12. Worst case: B happens, you net 0.12.
          *   **Result:** Guaranteed profit.

  ---

  ## Part 2: Running the Batches

  ### Batch 1: The Complement Case (FDA)
  **Inputs:**
  *   Q1: FDA accepts filing ($P = 0.75$)
  *   Q2: FDA rejects filing ($P = 0.40$)

  **Screen:**
  1.  **Step 1 (Complement):** $0.75 + 0.40 = 1.15$.
  2.  **Tolerance:** Exceeds 0.01.
  3.  **Verdict:** **HARD STOP.**

  **The Arbitrage (How you lose money):**
  *   **Action:** Sell \$1,000 notional of "Accept" @ 0.75. Sell \$1,000 notional of "Reject" @ 0.40.
  *   **Cash In:** \$750 + \$400 = **\$1,150**.
  *   **Max Liability:** One of these *must* happen (assuming no other outcome like "withdrawn"). Max payout is \$1,000.
  *   **Guaranteed Profit (for counterparty):** \$150 per cycle.
  *   **Fix:** Force the analyst to choose. If they believe Accept is 0.75, Reject *must* be 0.25.

  ### Batch 2: The Conjunction Case (Supplier)
  **Inputs:**
  *   Q1: Supplier misses window ($P = 0.20$)
  *   Q2: Supplier misses window *because of port strike* ($P = 0.35$)

  **Screen:**
  1.  **Step 2 (Monotonicity):** "Miss due to Port" is a subset of "Miss".
  2.  **Check:** Is $0.35 \le 0.20$? **No.**
  3.  **Verdict:** **HARD STOP.**

  **The Arbitrage (How you lose money):**
  *   **Action:** Buy \$1,000 of "Miss" @ 0.20. Sell \$1,000 of "Miss due to Port" @ 0.35.
  *   **Cash Flow:** Pay \$200. Collect \$350. **Net +\$150.**
  *   **Settlement:**
      *   *Port Strike Happens:* "Miss" pays out (+\$1,000). "Port Miss" pays out (-\$1,000). Net 0. You keep the \$150 premium.
      *   *Port Strike Doesn't Happen (but other miss does):* "Miss" pays (+\$1,000). "Port Miss" pays 0. Net +\$1,150.
      *   *No Miss:* Both pay 0. Net +\$150.
  *   **Fix:** The probability of the specific cause cannot exceed the probability of the general event. Lower Q2 or raise Q1.

  ### Batch 3: The "Own Batch" (Conditional/Marginal Trap)
  *Note: I am simulating your internal batch based on your description of "three related questions." If this matches your actual numbers, the conclusion is definitive.*

  **Inputs:**
  *   Q1: Bill passes Committee ($P = 0.90$)
  *   Q2: Bill passes Floor ($P = 0.80$)
  *   Q3: Bill becomes Law ($P = 0.60$)
  *   *Implicit Assumption:* To become Law, it must pass Floor. To pass Floor, it must pass Committee.
  *   *Additional Input from Analyst Notes:* "Given it passes the Floor, we are very confident it becomes Law." -> $P(\text{Law} | \text{Floor}) = 0.95$.

  **Screen:**
  1.  **Step 2 (Monotonicity):**
      *   Law (0.60) $\le$ Floor (0.80)? **Yes.**
      *   Floor (0.80) $\le$ Committee (0.90)? **Yes.**
      *   *Passes initial check.*
  2.  **Step 4 (Multiplication/Conditional):**
      *   Check consistency of Q2, Q3, and the Conditional Note.
      *   Implied $P(\text{Law and Floor}) = P(\text{Law} | \text{Floor}) \times P(\text{Floor})$.
      *   Calculation: $0.95 \times 0.80 = 0.76$.
      *   Compare to Marginal $P(\text{Law}) = 0.60$.
      *   **Logic:** The probability of (Law AND Floor) cannot be higher than the probability of (Law). Since passing the Floor is a prerequisite for Law, $P(\text{Law and Floor})$ is exactly $P(\text{Law})$.
      *   **Conflict:** Your math says the joint probability is 0.76. Your posted price says the marginal is 0.60.
      *   **Verdict:** **HARD STOP.**

  **The Arbitrage (How you lose money):**
  *   **Action:** Buy \$1,000 of "Law" @ 0.60. Sell \$1,000 of the synthetic "Law" created by the Conditional + Floor.
  *   **Simplified Trade:**
      *   **Buy** \$1,000 "Law" @ 0.60 (Cost \$600).
      *   **Sell** \$1,000 "Law | Floor" @ 0.95 AND **Sell** \$1,000 "Floor" @ 0.80? No, that's double selling risk.
      *   **Correct Trade:** **Sell** the Conditional Contract ($P(\text{Law}|\text{Floor})$) and **Buy** the Marginal ($P(\text{Law})$).
      *   Wait, the direct arbitrage is on the joint.
      *   **Trade:** **Buy** \$1,000 "Law" @ 0.60. **Sell** \$1,000 "Law & Floor" (implied @ 0.76).
      *   Since "Law" implies "Floor" in your logic, "Law" *is* "Law & Floor".
      *   You are Buying the asset for 0.60 and Selling the *same asset* (synthetically) for 0.76.
      *   **Net Cash:** +\$160.
      *   **Settlement:**
          *   If Law happens: You collect \$1,000 on Buy. You pay \$1,000 on Sell. Net 0. Keep \$160.
          *   If Law fails: You pay 0 on Buy. You pay 0 on Sell. Net \$160.
  *   **Fix:** You have three numbers in conflict: $P(\text{Floor})$, $P(\text{Law})$, $P(\text{Law}|\text{Floor})$. One is wrong.
      *   If $P(\text{Floor}) = 0.80$ and $P(\text{Law}|\text{Floor}) = 0.95$ are correct, **$P(\text{Law})$ must be 0.76.**
      *   **Your posted 0.60 is indefensible.** It is too low relative to your conditional confidence. Raise it to 0.76 or lower the conditional.

  ---

  ## Part 3: What This Procedure Cannot Do

  This checklist protects you from mathematical suicide. It does not protect you from being wrong. Know the limits.

  1.  **Coherence $\neq$ Accuracy:** You can have perfectly coherent numbers that are completely detached from reality. If you set $P(\text{FDA Accept}) = 0.01$ and $P(\text{FDA Reject}) = 0.99$, you pass the screen. If the drug is a slam-dunk approval, you will still lose money. This screen stops arbitrage; it does not stop bad forecasting.
  2.  **Logical Dependencies:** The screen only catches dependencies you explicitly feed it. If Question A physically prevents Question B, but you don't tag them as linked in Step 0, the math won't catch it. You must manually identify logical constraints (e.g., "If the supplier goes bankrupt, they cannot miss the window due to a port strike").
  3.  **Timing Mismatches:** This screen assumes all questions resolve in the same timeframe or that the conditional structure accounts for time. If Q1 is "Bill passes in 2024" and Q2 is "Bill passes in 2025," a simple sum test fails. You must normalize timeframes before screening.
  4.  **The "Unknown" Reality:** Forcing an "Other" bucket to sum to 1.0 satisfies the math, but if your analysts genuinely believe there is a 20% chance of a black swan event that invalidates all questions, forcing them to distribute that 20% across known buckets creates false precision. The screen forces a price; it does not force truth.
  5.  **Judgment Call Zone:** When a batch fails Step 4 (Multiplication), the math tells you *that* a number is wrong, not *which* one. In Batch 3, I told you to raise $P(\text{Law})$. But maybe your conditional confidence ($0.95$) is the hubris. Deciding which number to move is a judgment call. The screen flags the wound; you have to stitch it.

  **Final Instruction:** If a batch fails a Hard Stop, the analyst does not get to "explain why." They get to adjust the numbers until the math clears. If they cannot adjust the numbers without lying about their belief, they do not have a price ready for the market.
