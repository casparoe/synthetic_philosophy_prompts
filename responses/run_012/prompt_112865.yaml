prompt: |-
  ok so I'm in a formal epistemology module this term and we did Dutch book arguments a couple of weeks ago. I think I follow the proof but something about it is bugging me and I can't tell if its a real problem or if I've just misunderstood what the argument is meant to be doing.

  Here's what set it off. My mate works in a betting shop and I've been pestering him about how the odds actually get set. Turns out a bookmaker prices up every runner in a race so the implied probabilities add up to well over 100% — sometimes way over, in a big handicap. So by the Dutch book standard the posted odds are incoherent: back every horse and you lose for sure. But he isn't doing anything wrong and the firm isn't being irrational, the margin is the whole business model. And when the money piles in on one side he moves the price, not because he's changed his mind about the horse but because he wants to balance his book. Then the same shop will talk about the market's probability of something, and everyone quotes betting odds as if they were probabilities, and now there are exchanges and cash-out offers where you can get two different implied probabilities for the same event at the same moment, and over in finance people use what looks like the same no-arbitrage reasoning but there it's obviously a constraint on prices rather than on anybody's beliefs.

  So what does the practice actually presuppose? Is it committed to the Dutch book argument being about prices rather than credences, or does it need some two-tier picture where coherence binds beliefs but not the odds a bookie posts? Does it presuppose that betting dispositions measure credence, given that the price is driven by other punters' money rather than the bookie's own view? And if the odds aren't credences, what is everyone doing when they read probabilities off them?

  Please spell out the implicit picture, tell me which parts are strictly presupposed and which just sit comfortably with several different theories, and say where the practice would have to change if we took the other line on what the argument is targeting.
