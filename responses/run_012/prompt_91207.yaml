answer: |-
  You have correctly identified that the "Surprise Quiz" is merely the most rigid, brittle instance of a much broader class of speech acts. Your intuition that there is a "wider pattern" is philosophically sound. The math colleague is applying a specific logical tool (backward induction) to a general pragmatic phenomenon, which is why his explanation feels both compelling and incomplete.

  There is no single established term that captures exactly the "carving" you are looking for—most literature focuses on the paradox itself (under the umbrella of **Dynamic Epistemic Logic** or **Moore's Paradox**) rather than the spectrum of success and failure in real-world announcements.

  To give you the structure you are after, I propose we call this wider class **Epistemic Binding**.

  Below is the carving of that concept, distinguishing why some bindings snap (the quiz) while others hold (the party), and what your math colleague is missing.

  ### 1. The Structure: Epistemic Binding
  **Definition:** An *Epistemic Binding* is an authoritative declaration regarding a future event, where the content of the declaration imposes a constraint on the audience's knowledge state prior to that event's occurrence.

  In all three of your cases (Quiz, Party, Fire Drill), the authority says: *"Event E will occur, but your epistemic state regarding E must remain 'uncertain' until E occurs."*

  The difference lies not in the announcement, but in the **Truth-Conditional Dependence** of the event on that epistemic state.

  ### 2. The Carving: Constitutive vs. Contingent Binding

  This is the distinction that explains why the quiz logic collapses while the party logic survives.

  **A. Strong (Constitutive) Binding: The Quiz**
  In the quiz scenario, the surprise is a *condition of the event's validity*.
  *   **The Logic:** If the students deduce the day, the event ceases to be a "surprise quiz." It becomes a "scheduled quiz."
  *   **The Collapse:** The announcement creates a logical loop. By announcing the surprise, the teacher gives the students the information needed to destroy the surprise. If the students are perfect logicians who trust the teacher, the announcement becomes self-falsifying.
  *   **Why it works in reality:** It works only because the students are not perfect logicians, or they do not trust their own deduction enough to rule out Friday. The "binding" is logically fragile but pragmatically robust because human rationality is bounded.

  **B. Weak (Contingent) Binding: The Party**
  In the party scenario, the surprise is a *feature of the experience*, not a condition of the event's existence.
  *   **The Logic:** If your sister deduces the day, the party still happens. The statement "There will be a party" remains true regardless of her knowledge. The "surprise" is an emotional goal, not a truth condition.
  *   **The Survival:** The announcement does not create a paradox because the event is not defined by the ignorance. The authority (her friends) is not promising "You *cannot* know," but rather "We will ensure you *do not* know." This is a promise of secrecy, not a logical constraint.
  *   **Why it works:** The binding is on the *planners' behavior* (they must hide info), not on the *guest's logic* (she must fail to deduce).

  **C. Institutional (Simulated) Binding: The Fire Drill**
  The fire drill is a hybrid. It is legally required to be announced (Weak Binding), but operationally treated as a surprise (Strong Binding).
  *   **The Tension:** This creates a "wink" culture. Everyone knows a drill *might* happen this week. The "surprise" is not about *if* or *when*, but about the *exact moment*. It relies on **attenuated attention**. The announcement works because the audience agrees to treat the knowledge as "background noise" rather than "active deduction."

  ### 3. Diagnosing the Math Colleague's Error

  Your colleague's chain of reasoning ("If it hasn't happened by Thursday, it must be Friday...") is a valid proof *only* under three idealized conditions that rarely exist in a school:

  1.  **Common Knowledge:** Everyone must know the announcement, know that everyone knows it, know that everyone knows that everyone knows it, ad infinitum. In reality, there is always a student who didn't listen, breaking the chain.
  2.  **Factivity of Knowledge:** The logic assumes that if a student *believes* they have deduced the day, they *know* the day. In epistemology, knowledge requires truth. If they deduce "It must be Friday" and the quiz is on Thursday, their deduction was false, so they never "knew." The paradox relies on treating "justified belief" as "knowledge."
  3.  **Static Authority:** The logic assumes the teacher is bound by the announcement more than the students are. In reality, the teacher can choose Friday *even if* the students expect it, thereby making the "surprise" claim false but the "quiz" claim true. The announcement is a threat, not a logical axiom.

  The colleague asks whether the announcement defeats itself or the reasoning is invalid. The answer is: **The reasoning is valid, but the premises are false.** The premise that "The audience will successfully deduce the day if it is logically possible" is false.

  ### 4. Borderline Cases and Definitions

  To solidify this concept for your purposes, here is how **Epistemic Binding** applies to borderline cases:

  *   **Security Check (Strong Binding):** "We will test security systems unannounced." If you know, you pass the test artificially. This functions like the Quiz. If staff deduce the day, the test is compromised.
  *   **Birthday Gift (Weak Binding):** "I have a gift for you." If you guess what it is, it is still a gift. The surprise enhances the value but does not define the object.
  *   **The "Pop" Quiz that isn't (Failed Binding):** A teacher says "Surprise Quiz!" but gives it every Tuesday. The Epistemic Binding has dissolved into a routine. The announcement is now a lie, not a bind.

  ### 5. Summary for the Deputy Head

  You are managing **Epistemic Bindings**.

  *   **When the Binding is Constitutive (Quiz/Inspection):** You rely on the audience's **bounded rationality**. You are betting they will not complete the backward induction. The "surprise" is a logical vulnerability that you exploit psychologically.
  *   **When the Binding is Contingent (Party/Drill):** You rely on **information control**. You are betting you can keep the specific data (time/location) hidden. The "surprise" is a logistical challenge, not a logical one.

  Your math colleague is treating all Epistemic Bindings as Constitutive. He is right that *if* the surprise is a logical condition of the event, the announcement is paradoxical. But in the case of the party (and often the drill), the surprise is merely a practical outcome. The announcement survives because it is a promise of *secrecy*, not a promise of *ignorance*.

  **The Coined Term:** **Epistemic Binding**
  **The Definition:** An authoritative speech act that attempts to constrain an audience's future knowledge state regarding an event.
  **The Distinction:** **Constitutive Binding** (knowledge state defines the event; prone to paradox) vs. **Contingent Binding** (knowledge state affects the experience; prone to secrecy failures).

  This structure explains why you can schedule the party with confidence, but must schedule the quiz with a prayer.
