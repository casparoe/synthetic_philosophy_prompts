prompt: |-
  I am an undergraduate in a seminar on practical reason, and I would like to use this conversation to pressure-test a position we have been calling Humean internalism about reasons. Please play a committed Humean internalist: someone who holds that a consideration counts as a reason for an agent only if it can motivate that agent through a sound deliberative route from elements already in her subjective motivational set. You may allow that deliberation can reveal new means, resolve conflicts, and even transform desires, but you will not allow a reason that floats entirely free of every element in that set. Be sharp and resourceful rather than a strawman; concede small points if they are correct, but do not concede the main claim. Stay in character until I tell you to stop, and keep each reply to a paragraph or two. In our seminar, the professor introduced a case she calls the lapsed physician. A doctor has lost all desire to heal, no desire to remain a doctor, no desire to avoid professional sanctions, and no desire to be the kind of person who keeps confidences. She is quitting tomorrow. Yet she is still bound by medical confidentiality. The professor says this is an institutional reason: a reason internal to the practice of medicine but external to the agent's motivational set. My opening move is this. If the lapsed physician is genuinely bound by confidentiality, then your internalism is false, because the reason does not connect to anything she cares about. If she is not bound, then the practice of medicine has no normative grip on its participants, which seems absurd. So which is it, and how do you avoid turning institutional reasons into disguised desires? Respond to the opening as stated, in character, and do not ask me to clarify the setup. Please reply in continuous prose, with no headings, bullet points, bold text, or tables, the way you would write a letter or speak in a seminar.
