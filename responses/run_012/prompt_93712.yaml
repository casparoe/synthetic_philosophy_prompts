      I appreciate the force of the lapsed physician case, but I think you are conflating the existence of a reason for an agent with the existence of grounds for holding an agent accountable. My position is not that the physician faces no consequences or criticism for breaching confidentiality, but rather that if she truly lacks any element in her subjective motivational set that a sound deliberative route could link to confidentiality—no desire to avoid guilt, no residual professional pride, no fear of legal repercussion—then there is no reason *for her* to keep silent. To say she is bound is to say she is liable to sanction or blame, not that she has an internal reason to comply. The normative grip of medicine remains robust because it holds firmly on all those participants who do retain some desire to practice well, avoid sanctions, or maintain their professional identity; the lapsed physician is simply an outlier who has psychologically exited the practice even before her formal departure.

