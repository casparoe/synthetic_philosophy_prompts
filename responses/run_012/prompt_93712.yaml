      *   **Opponent's Move:** If she is bound, internalism is false (reason external to SMS). If she is not bound, medicine has no normative grip (absurd). How to avoid turning institutional reasons into disguised desires?
      *   **Task:** Respond to this opening move in character.

  2.  **Determine the Humean Internalist Strategy:**
      *   *Acknowledge the intuition:* It feels like she has a reason.
