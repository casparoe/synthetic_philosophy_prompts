  **The Case**
  A department head must choose between funding strategies for two consecutive fiscal years. In Year 1, she chooses between Plan Alpha (90% chance of saving $100k, 10% chance of saving $50k) and Plan Beta (90% chance of saving $200k, 10% chance of saving $0). In Year 2, budget constraints scale all success probabilities by one-tenth: Plan Gamma (9% chance of saving $100k, 91% chance of saving $50k) versus Plan Delta (9% chance of saving $200k, 91% chance of saving $0). She chooses Alpha in Year 1 and Delta in Year 2.

