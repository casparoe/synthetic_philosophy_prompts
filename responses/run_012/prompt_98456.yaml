      *   *Case 8 (Refuse dissolution w/o confidence + alternative):* Verdict = Lawful/Proper. Preserves chamber's ability to form a government without election. Fits.
      *   *Case 9 (Minister lies, no resignation):* Verdict = Breach, not Unconstitutional. Does this disable accountability? The chamber *can* still remove them or the government, but the norm is breached. It's an offense *within* the accountability framework, not an attack *on* the framework. Fits.
      *   *Case 10 (Entrench standing orders):* Verdict = Torn. Why? Because it limits future majorities (accountability of future govts) but is done by the current majority. The principle suggests it might be unconstitutional if it binds future electorates/chambers too tightly, but "standing orders" are internal. This is the weak point for the principle.
