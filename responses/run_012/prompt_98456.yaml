          *   Verdict: Unconstitutional. (Perhaps the *most* unconstitutional).
      *   **Critique/Refinement of the Principle:**
          *   Point out the "Government" vs. "Chamber/Electorate" nuance. Case 2 is about the Chamber, not the Government. Case 10 is about the Chamber binding itself.
          *   Suggest a slight tweak: Focus on **Democratic Sovereignty** or **The Conditions of Accountability**.
          *   Address Case 10 (Entrenchment): The principle suggests this is dangerous. If a simple majority binds the future, it reduces future accountability. It should likely be deemed Unconstitutional (or at least a grave breach) to align with the logic of Case 2.
