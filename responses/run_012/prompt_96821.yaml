      *   *TA Guidance:* Since the TA is a poet, explain *why* these distinctions matter in prose terms (intent, contract with reader).

  6.  **Refining and Polishing:**
      *   *Check Word Count:* Ensure the model answer is close to 600.
      *   *Check Tone:* Ensure it sounds like a novelist talking to grad students (craft-focused, not just moralizing).
      *   *Check Constraints:* Did I hit all four points (a, b, c, d)? Yes.
      *   *Marking Scheme:* Is it actionable? Yes, specific deductions for specific vagueness.

