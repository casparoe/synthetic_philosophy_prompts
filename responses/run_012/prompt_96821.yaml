answer: |-
  Here is the exam package. It is designed to be handed directly to your students and your TA.

  ***

  # FINAL EXAMINATION: HISTORICAL FICTION SEMINAR
  **Time:** 90 Minutes
  **Format:** In-class essay, no notes.

  **PROMPT:**

  In this course, we have operated under the maxim: *"Be true to the person, not the paper."* This suggests that when archival evidence is cold or contradictory, the novelist should prioritize psychological truth over documentary record.

  Consider the following case: A student writes a novel about a real, well-documented 1880s philanthropist known historically as "tireless and beloved." The student invents a secret, driving motive: a deep contempt for the poor. There is no evidence for this in the archive; the student argues it makes the character "cohere" dramatically.

  Write an essay addressing the following four points:

  1.  **Define the Limit:** If "person, not paper" does not license this invention, what does it actually permit? Distinguish between *interpreting* a gap and *contradicting* a record.
  2.  **The Ethics of Harm:** Address the objection that a dead woman cannot be harmed by fiction. Who, exactly, is wronged if not the subject?
  3.  **Variables:** Does your judgment change if the woman was totally obscure? Does it change if she has living grandchildren?
  4.  **The Counter-Argument:** Name the strongest artistic argument *against* your position (i.e., why a novelist *should* be allowed to make this change) and explain why you accept or reject it.

  ***

  # MODEL ANSWER (For TA Use Only)
  **Word Count:** Approx. 600 words

  The maxim "be true to the person, not the paper" is an instruction on empathy, not a license for fabrication. It permits the novelist to imagine the *interiority* that the archive omits, but it forbids inventing a *motive* that the archive's actions refute. To imagine the philanthropist felt lonely despite brisk letters is to fill a gap in the human record. To imagine she hated the poor she dedicated her life to feeding is to contradict the evidence of her actions. The former interprets silence; the latter calls the subject a liar. "Person, not paper" means trusting the human being over the document, not trusting the plot over the human being.

  Regarding harm: the dead woman is not the primary victim. The dead cannot suffer. The wrong is committed against the reader and the historical record. Historical fiction enters a contract with the reader that the "truth" of the world is stable, even if the dialogue is invented. When an author invents a core malice without evidentiary basis, they break this contract. They are not writing historical fiction; they are writing allegory using a real name as a costume. Furthermore, history is a collaborative accumulation. To insert a malicious motive as "fact" via fiction is to pollute the ecosystem of understanding for future historians and readers. We owe the truth to the living, who rely on us to distinguish between what happened and what we wish had happened.

  Does obscurity matter? Marginally. If the woman is unknown, the risk of contaminating the public record is lower, but the ethical breach remains. The novelist is still claiming authority over a life they do not own. However, the existence of living grandchildren shifts the ethical weight from epistemological to interpersonal. While we do not owe descendants censorship, inflicting gratuitous pain on the grieving for the sake of "character coherence" is an abuse of power. It treats real grief as a resource to be mined. In the case of the beloved philanthropist, the public fame raises the stakes: she is a public trust. To defame a public figure without cause is a specific kind of lying that fiction does not immunize.

  The strongest objection to this stance is the "Emotional Truth" argument. A critic might argue that history records behavior, but fiction reveals essence. Perhaps the philanthropist *was* driven by contempt, even if she didn't know it, and only a novelist can see that shadow. This is a powerful claim for the utility of art. However, I reject it in this specific instance because it relies on a cliché (the hypocrite philanthropist) rather than a deeper insight. If the invention serves a thematic convenience rather than a revelatory necessity, it is lazy. We are allowed to imagine the shadow, but we are not allowed to paint over the light just because the shadow is more dramatic. The limit is humility: we invent to serve the person, not to serve the plot.

  ***

  # MARKING SCHEME & TA GUIDE
  **Total Marks:** 25
  **Grader Note:** You are a poet; you know that precision matters. In this exam, vagueness is the enemy. The most common mistake will be an appeal to "balance." Do not reward it. A student who says "it depends on the balance between art and truth" is avoiding the work of defining where the line is.

  ### 1. Defining the Maxim (8 Marks)
  *   **A-Level (7-8 marks):** Clearly distinguishes between *interiority* (feelings, loneliness, doubt) which can be invented, and *motive/action* (contempt, malice) which must align with evidence. Uses the phrase "interpreting gaps vs. contradicting record."
  *   **B-Level (4-6 marks):** Discusses the rule but remains vague. Uses words like "flexibility" or "interpretation" without defining the boundary.
  *   **Fail (0-3 marks):** Claims the rule allows total invention, or claims the rule forbids *any* invention.
  *   **Specific Deduction:** -2 marks if they use the word "balance" without defining the specific weights involved.

  ### 2. The Ethics of Harm (5 Marks)
  *   **A-Level (5 marks):** Identifies the **Reader** or the **Historical Record** as the victim. Argues that the contract of the genre is breached.
  *   **B-Level (3-4 marks):** Focuses only on the dead subject (e.g., "it disrespects her memory") without addressing the reader/historical truth aspect.
  *   **Fail (0-2 marks):** Claims no one is harmed because she is dead.
  *   **Specific Deduction:** -2 marks if they argue that "fiction is always understood as fake," ignoring the genre contract of historical fiction.

  ### 3. Variables (Obscurity/Descendants) (5 Marks)
  *   **A-Level (5 marks):** Nuanced distinction. Acknowledges obscurity lowers public harm but not ethical harm. Acknowledges descendants add an ethical layer (grief/consent) but distinguishes it from the artistic truth.
  *   **B-Level (3-4 marks):** Binary thinking (e.g., "It's fine if she's obscure," or "Family always matters most").
  *   **Fail (0-2 marks):** Ignores one of the two variables.
  *   **Specific Deduction:** -2 marks if they claim living descendants have a "right of veto."

  ### 4. The Counter-Argument (5 Marks)
  *   **A-Level (5 marks):** Names a specific artistic justification (e.g., "Emotional Truth," "Myth vs. History," "The Shadow Self"). Refutes it or accepts it with strict conditions.
  *   **B-Level (3-4 marks):** Names a weak objection (e.g., "Some people might get mad") or fails to refute it convincingly.
  *   **Fail (0-2 marks):** No counter-argument offered.
  *   **Specific Deduction:** -3 marks if the counter-argument is a strawman (e.g., "Someone might say we should never write about real people").

  ### 5. Clarity and Voice (2 Marks)
  *   **A-Level (2 marks):** Precise, academic but engaged tone. No filler.
  *   **B-Level (1 mark):** Wordy, repetitive, or overly casual.
  *   **Fail (0 marks):** Incoherent.

  ***

  ### TA TROUBLESHOOTING (Read Before Grading)
  *   **The "Balance" Trap:** If a student writes, "The writer must balance the need for a good story with respect for the truth," they have not answered the question. They are describing the problem, not solving it. Cap this answer at a B (max 18/25).
  *   **The "Poetic Truth" Defense:** If a student argues that "facts don't matter, only the feeling," challenge their definition of Historical Fiction. If facts don't matter, it is Fantasy. Deduct heavily in Section 1.
  *   **Word Count:** The model is 600 words. Students writing 200 words cannot make these four moves. Deduct in Section 5. Students writing 1000+ words are likely waffling to hide a lack of precision. Look for density, not volume.
