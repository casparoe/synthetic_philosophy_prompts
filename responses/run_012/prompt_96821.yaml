  2.  **Deconstruct the Core Ethical/Aesthetic Problem:**
      *   *The Rule:* "Person, not paper" means interpreting gaps in the record through empathy and psychological consistency, not contradicting the record for mere plot convenience or shock value.
      *   *The Violation:* Inventing a core character trait (contempt for the poor) that directly contradicts the public and private record (beloved, tireless) without evidentiary basis turns the historical figure into a puppet for the plot.
      *   *The Nuance:* Fiction *requires* invention. The line is between *interpretation* (filling gaps) and *contradiction* (overwriting).
      *   *The Ethics:* Does truthfulness matter if the subject is dead? What about legacy? What about the reader's trust?

  3.  **Drafting the Exam Question:**
      *   Needs to be provocative but precise.
      *   Needs to set up the scenario clearly (the 1880s philanthropist).
      *   Needs to list the four specific sub-tasks (a, b, c, d) requested by the user.
