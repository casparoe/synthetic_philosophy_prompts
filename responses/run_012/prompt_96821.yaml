      *   *Addressing (d) Best Objection:* The "Myth vs. History" argument (fiction reveals emotional truths facts cannot). The model answer must acknowledge this but refute it or limit it.
      *   *Tone:* Academic but grounded in craft.

  5.  **Drafting the Marking Scheme:**
      *   *Total:* 25 marks.
      *   *Differentiation:* Need to penalize the "balance" answer heavily.
      *   *Categories:*
          1.  Defining the Maxim (The Core Distinction).
          2.  The Ethics of Harm (Dead/Descendants).
          3.  The Counter-Argument (Steel-manning).
          4.  Clarity/Craft.
      *   *Specifics:*
          *   A-grade must distinguish between *gap-filling* and *contradiction*.
