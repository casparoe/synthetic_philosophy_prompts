answer: |-
  Your nagging feeling is correct. The blog post gets the *logic* of the theorems roughly right but fails catastrophically on the *assumptions* and the *empirical conclusion*. It commits the classic sin of taking a "frictionless vacuum" model and acting surprised that the real world has air resistance.

  Here is the definite view you asked for. The post is a useful heuristic for understanding market microstructure, but as a statement of fact about why trading occurs, it is misleading.

  ### Sentence-by-Sentence Critique

  **1. "The no-trade theorems are results in the economics of information showing that rational, self-interested traders can never have any reason to trade with each other on the basis of private information."**
  *   **Verdict:** **Keep, but qualify.**
  *   **Why:** This is the core of the Milgrom-Stokey (1982) theorem. However, the phrase "any reason" is dangerous. It should read "any *speculative* reason." Rational agents *will* trade to hedge risk or manage liquidity (e.g., I sell stock because I need to buy a house, not because I know the price will drop). The theorem specifically kills *purely speculative* trade based on asymmetric information.

  **2. "The crucial assumption is rationality: if two people are both rational and both know the price, then any offer one of them makes must rest on something the other doesn't know..."**
  *   **Verdict:** **Strike "rationality" as the sole culprit; insert "common priors."**
  *   **Why:** This is the smuggling you sensed. Rationality alone isn't enough. The theorem requires **Common Priors** (we start with the same baseline probability distribution) and **Common Knowledge of Rationality**. If we have different priors (I think tech stocks are inherently riskier than you do), we can trade rationally forever. The blog implies rationality does all the heavy lifting; it doesn't.

  **3. "...so the other treats the offer itself as evidence, updates on it, and before long the two agree -- and a trade you already agree on isn't worth doing."**
  *   **Verdict:** **Keep.**
  *   **Why:** This is an accurate layman's summary of the "unraveling" argument. If I offer to sell you a asset at price $X$, you infer I know something bad. You lower your bid. I infer you know something worse. The spread collapses to zero, and trade vanishes.

  **4. "In other words it's just Aumann's result that rational agents can't agree to disagree, dressed up in market language."**
  *   **Verdict:** **Keep.**
  *   **Why:** This is technically correct. Milgrom-Stokey is essentially the economic application of Aumann's Agreement Theorem.

  **5. "The moral is that real markets only trade because of irrationality or noise traders..."**
  *   **Verdict:** **Strike. This is the fatal error.**
  *   **Why:** This ignores the primary engine of real-world volume: **liquidity shocks and hedging needs.** Pension funds trade because people retire. Market makers trade to earn the spread, not because they have alpha. Corporations trade to hedge currency risk. None of this requires "irrationality" or "noise." It requires *non-informational motives*. The blog post creates a false dichotomy: either you have private info (no trade) or you are irrational (trade). It ignores the third, massive category: you have a different endowment or risk profile.

  **6. "...and since we see enormous trading volumes every day, the theorems are either empirically false or an irrelevant curiosity."**
  *   **Verdict:** **Strike. Logical fallacy.**
  *   **Why:** This is like saying "Newton's laws are false because birds fly." Newton's laws apply to falling bodies in a vacuum; birds have wings (liquidity needs). High volume does not refute the theorem; it merely confirms that the theorem's strict assumptions (pure speculation, common priors, no liquidity shocks) do not hold in the real world. That makes the theorem a *benchmark*, not a falsehood.

  ### The "Smuggled" Premise

  The blog post smuggles in the idea that **information is the only reason to trade.**

  In the No-Trade world, everyone starts with the same wealth, the same risk tolerance, and the same prior beliefs. The only thing that varies is private signals. In that specific, sterile world, trade is impossible.

  In the Real World, we trade because:
  1.  **Liquidity:** I need cash now; you have cash now.
  2.  **Hedging:** I own an airline and want to buy oil futures to lock in costs; you are a speculator willing to take the other side.
  3.  **Differing Priors:** We genuinely interpret the same data differently (which violates the Common Prior assumption).

  ### Final Verdict: Do the theorems have "real bite"?

  **Yes, but not the bite the blogger claims.**

  The No-Trade Theorems are not a prediction that markets should shut down. They are a warning about **market efficiency and the value of research.**

  1.  **The Bite:** They explain why it is so incredibly hard to beat the market. If you think you have found a "free lunch" based on private information, the theorem warns you: *If the other side is willing to take that bet, they probably know something you don't.* It forces institutional investors to justify trade not on "I know more," but on "I have a different liability structure" (hedging) or "I am providing liquidity."
  2.  **The Relevance:** They justify the existence of market makers and bid-ask spreads. Because rational agents fear trading against better-informed agents (adverse selection), they demand a spread to compensate for that risk. Without the No-Trade logic, we couldn't explain why spreads exist in liquid markets.
  3.  **The Conclusion:** The blogger is wrong to dismiss the theorems as "irrelevant" because volume is high. Volume exists *despite* the no-trade pressure, not because the pressure doesn't exist. The theorems explain why trading is costly (spreads) and why alpha is rare, not why trading is zero.

  **Summary:** Trust the logic (information gets priced in quickly), distrust the moral (trade requires irrationality). Real markets trade because life is messy (liquidity/hedging), not because traders are stupid. The theorems are a crucial baseline for understanding *why* liquidity providers demand compensation, not a proof that markets shouldn't exist.
