  I hold this folded paper in my palm,
  The other lies apart, unseen, unknown.
  One contains double what the other holds,
  Yet neither bears a mark to show its worth.
  Suppose this sum is less, the other's double;
  Suppose this sum is more, the other's half.
  Each chance weighs equal with the other chance,
  So swapping promises a greater gain.

  I hold that folded paper in my palm,
  The other lies apart, unseen, unknown.
  One contains double what the other holds,
  Yet neither bears a mark to show its worth.
  Suppose that sum is less, the other's double;
  Suppose that sum is more, the other's half.
  Each chance weighs equal with the other chance,
  So swapping promises a greater gain.

  Yet if this reason serves for any sum,
  It speaks not how the sums were first decreed.
  A rule for all amounts is trust for none,
  And gain is but a ghost in both my hands.
