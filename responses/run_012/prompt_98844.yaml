  I'm a science journalist working on a feature about the Pasadena paradox — you know, the game where the expected payoff isn't just infinite, it's undefined, so different ways of adding up the outcomes give you different answers. I've been talking to a decision theorist who thinks most of the standard moves here (cap the payoffs, impose a concave utility function, say the game is too unrealistic to matter) are definately dodging the real question: what does it even mean to have a rational preference between two options when your theory assigns both of them no well-defined expected value at all? She wants to write a paper on this, but she's stuck on how to frame it as a tractable research project rather than a tour of the existing literature.

  Can you help me turn this into a short research proposal — something like 4000-5000 words, one semester of work — on the question of how a decision theory should handle choice situations where the relevant expectations are undefined rather than merely infinite? I want the question stated precisely enough that it has a determinate answer, an explanation of why the existing positions don't settle it, a concrete method for making progress, what a result would look like, and an honest assessment of what could make the project too big for a semester. Don't bother with a reading list or citations — she'll fill those in — but do say which arguments and positions the proposal would have to engage.

  Part of what I'm after is how confident you are in the framing you propose: where is the reasoning most likely to fail, and what argument or counterexample would make you change your mind about whether this is the right question to ask? Give me your answer as a numbered list with exactly five items, each a sentence or two, no introduction or conclusion.
