answer: |-
  ### The Contradiction
  Your mate is trying to have it both ways. He uses the slogan to mean **"The King has no power"** (so he's useless) and **"The King has reserve power"** (so he's a backstop). These are mutually exclusive. Here is the menu of what the slogan actually means, tested against reality.

  ### The Menu of Meanings

  **1. The "Rubber Stamp" Claim**
  *   **The Claim:** The King mechanically signs whatever Parliament puts in front of him. He has zero discretion.
  *   **Verdict:** **Trivially True (99% of the time).** By convention, he never refuses.
  *   **Your Mate's Use:** He leans on this to argue the King is an **ornament** (therefore abolish).
  *   **The Flaw:** If this were 100% true, the King couldn't be a backstop. A stamp cannot stop a tyrant.

  **2. The "Reserve Power" Claim**
  *   **The Claim:** The King retains legal authority to act without ministerial advice, but only in extreme constitutional emergencies.
  *   **Verdict:** **Substantive and Defensible.** The power exists in law but is dormant by convention.
  *   **Your Mate's Use:** He leans on this to argue the King is a **backstop** (against autocracy).
  *   **The Flaw:** If this is true, the King *does* rule in crises. The slogan "does not rule" is false in the exact scenario your mate cares about.

  **3. The "Legal Fiction" Claim**
  *   **The Claim:** All government power is legally the King's, but politically the Ministers'.
  *   **Verdict:** **True.** Laws are "His Majesty's Government," but Ministers take the blame.
  *   **Your Mate's Use:** Irrelevant to his argument, but explains why the slogan exists.
  *   **The Flaw:** None, but it doesn't help him bin the monarchy.

  **4. The "Influence" Claim (Bagehot)**
  *   **The Claim:** The King has no public power, but private rights to "be consulted, to encourage, to warn."
  *   **Verdict:** **True.** This is how the monarchy actually functions week-to-week.
  *   **Your Mate's Use:** This is a **quiet admission the slogan is false.** If you can warn/encourage, you are participating in rule, just quietly.
  *   **The Flaw:** It undermines the "ornament" argument. An ornament doesn't warn the Prime Minister.

  ---

  ### The Stress Test (Concrete Cases)

  **Case A: Royal Assent (What if the King says no?)**
  *   **Scenario:** Parliament passes a bill; the King refuses to sign.
  *   **Slogan Test:** If he says no, he is **ruling**.
  *   **Verdict:** **False.** The slogan breaks here.
  *   **Reality:** Last refused 1708 (Queen Anne). If Charles did it today, it would cause a revolution. He *can* legally do it, but politically he can't.
  *   **Pub Point:** "If he can't say no, he's a stamp. If he can say no, he rules. Which is it?"

  **Case B: Hung Parliament (No clear majority)**
  *   **Scenario:** Election results are messy. Who does the King invite to form a government?
  *   **Slogan Test:** The King must exercise **personal discretion**.
  *   **Verdict:** **Substantive.** He isn't just stamping here; he is deciding.
  *   **Reality:** The King meets with party leaders to gauge who can command confidence. He is not a passive ornament here.
  *   **Pub Point:** "In a hung parliament, the King isn't decorating the room; he's picking the Prime Minister. That's ruling."

  **Case C: Australia 1975 (The Governor-General sacks the PM)**
  *   **Scenario:** Governor-General Sir John Kerr dismisses PM Gough Whitlam.
  *   **Slogan Test:** The Crown's representative **fired the head of government**.
  *   **Verdict:** **False.** The slogan "does not rule" was demonstrably false on 11 November 1975.
  *   **Reality:** Kerr used the Queen's reserve powers. If the slogan applies to the King, it applies to his reps.
  *   **Pub Point:** "Your slogan says the Crown doesn't rule. Kerr proved the Crown can fire a PM. So the Crown rules when it wants to."

  ---

  ### The Technicalities

  **Does the slogan cover the Governor-General?**
  *   **Verdict:** **Yes.** The GG *is* the Crown in that realm.
  *   **Implication:** If the GG can sack a PM (as in 1975), the King *can* rule. Your mate cannot claim the King is powerless while admitting the GG has reserve powers. They are the same office.

  **Is Bagehot's "Three Rights" a fifth reading?**
  *   **Verdict:** **No, it's a correction.**
  *   **Implication:** Bagehot admits the slogan is a shorthand for "does not rule *publicly*." It admits the King has soft power.
  *   **Pub Point:** "Bagehot wrote the rulebook. He said the King has the right to warn. If you can warn the boss, you aren't just a statue."

  ---

  ### How to Win the Argument

  Hit him with the **Exclusivity Trap**:

  1.  "You say the King is a **useless ornament** because he 'doesn't rule'."
  2.  "Then you say he's a **necessary backstop** because he can stop a tyrant."
  3.  "To be a backstop, he must have power. To be an ornament, he must have none."
  4.  "You can't use 'reigns but does not rule' to prove he's powerless *and* powerful in the same breath."
  5.  "Australia 1975 proved the Crown *can* rule. So either the slogan is false, or the backstop is real. If the backstop is real, he's not just an ornament."

  **The Knockout:** "Decide, mate. Is he a stamp or a safety valve? If he's a safety valve, he has power. If he has power, your slogan is wrong."
