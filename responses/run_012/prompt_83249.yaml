answer: |-
  **Materials:** 16 internet-connected devices, shared screen, spreadsheet for bets/ratings. Fake pot ($100 gift card).

  **Rules:** Reactor melts down unless "Save" is pressed.
  **Run 1 (Anarchy):** Everyone has a "Save" button. No roles. Secretly ensure no one presses (meltdown).
  **Run 2 (Hierarchy):** Randomly assign one "Operator". *Crucially*, everyone else keeps their "Save" button (counterfactuals identical). Secretly ensure Operator doesn't press (meltdown).
  **Betting:** Before Run 2, players bet points on whether the Operator will press. This cements the expectation/norm. High stakes on the Operator create the "duty."
  **Rating:** After each run, privately rate 0-10: "Who caused the meltdown?" and "Who is to blame?"

  **Run-of-Show (80m):**
  *   **0-10m:** Intro. Explain counterfactual dependence simply: "If X hadn't happened, would Y still occur?"
  *   **10-30m:** Run 1. Minimal betting. Action (30s). Rating.
  *   **30-50m:** Run 2. Assign Operator. Heavy betting on Operator's action. Action (30s). Rating.
  *   **50-80m:** Debrief. Compare ratings.

  **Debrief:**
  Display the data. In Run 1, blame should be diffuse ("Everyone/No one"). In Run 2, blame should spike for the Operator, despite their causal power being identical to Run 1 (anyone could have saved it).

  **The Philosophy:** This maps to the omission/commission asymmetry and normative causal selection (Hitchcock, Knobe, Sytsma). Causal verdicts track **defaults vs. deviants**. In Run 1, inaction is the default for everyone. In Run 2, action is the default for the Operator. When the Operator omits, it's a deviant event we label "cause." When others omit, it's background.

  **The Lesson:** Our causal intuition isn't a physics engine; it's a social norm detector. We blame the omission that violates expectation. The game forces them to feel that the Operator *caused* the harm by doing *nothing*, simply because they were supposed to act. This breaks the pure counterfactual theory of causation.

  **Troubleshooting:**
  *   *Issue:* A non-Operator presses "Save," preventing meltdown.
  *   *Fix:* Have a "God Mode" override to force meltdown regardless, or restart immediately. Do not let a save happen; the lesson requires harm.
  *   *Issue:* Players argue counterfactuals ("But I could have saved it!").
  *   *Fix:* Validate them. "Yes, counterfactually you caused it too. But did you *feel* it?" Highlight the divergence between logical dependence and psychological attribution.
  *   *Issue:* Betting feels irrelevant.
  *   *Fix:* Make the bet payout large enough to create genuine expectation/disappointment.

  **Limitation:**
  The game cannot reproduce the *moral* weight of real omission (e.g., a parent vs. stranger). The "Operator" role is arbitrary and thin. You must explicitly state that real-world causal judgments often rely on deeper moral norms, not just assigned roles. The game isolates the mechanism (norms drive causation), but you must lecture on the external validity. Also, the game creates a "joint causation" scenario which is harder to parse than single-agent omission cases like the gardener who doesn't water the plants. The game proves norms matter, but not why some norms are moral and others are conventional.
