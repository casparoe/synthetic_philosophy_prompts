answer: |-
  You and Ines have reconstructed the "moral hazard" argument of the *Letter to d'Alembert* with impressive precision. It is indeed a tidier machine than Rousseau usually builds, which is why the cracks are showing so clearly. You are right to feel that it proves too much and that the internal gears (specifically 6 and 7) are grinding.

  Here is the diagnosis.

  ### 1. The Break Point: Step (4)
  You suspect (4) is the shakiest, and you are correct. **Step (4) is the failure point.**
  *"Sympathy is a limited stock: what's spent in the stalls isn't available on the street."*

  **Why it looked obvious:**
  It relies on a hydraulic model of emotion that feels intuitively true. We speak of "venting" anger or "draining" our compassion. It aligns with a specific reading of Aristotelian catharsis (purgation) but inverts the value: if catharsis cleanses the soul, Rousseau argues it empties the wallet of virtue. It makes the math easy: if emotion is a finite resource, spending it on fiction is theft from reality.

  **Why it breaks:**
  Psychologically and phenomenologically, this is false. Practicing pity in a safe environment often *heightens* sensitivity, it doesn't deplete it. If (4) were true, actors would be the most heartless people on earth, and teachers of ethics would be moral monsters. More damningly, as you noted, this condemns the novel. Rousseau wrote *Julie*; he knows readers weep over books and then go help their neighbors. If (4) holds, Rousseau is a hypocrite. If (4) falls, your argument loses its "zero-sum" force.

  **What you have to give up:**
  You have to give up the idea that the *quantity* of sympathy is the metric. You cannot argue that theatre makes us poorer in feeling. You must argue that theatre makes us **corrupt in the structure** of our feeling.

  ### 2. The Missing Argument: Representation vs. Presence
  You asked if there is a different reason Rousseau dislikes the theatre that you left out. There is. It is the load-bearing wall that your reconstruction missed.

  Rousseau's objection is not primarily about *emotion economics* (steps 1-5); it is about **political ontology**.

  For Rousseau, the theatre introduces **representation** into the civic sphere.
  *   **The Theatre:** A few people act; many watch. The actors are paid to pretend; the audience pays to be passive. It institutionalizes a split between "doers" and "watchers." It turns civic virtue into a commodity you consume rather than a practice you enact.
  *   **The Novel:** You noted Rousseau wrote novels. He admits they are dangerous, but they are *private* dangers. Reading is solitary. It doesn't structure the public gathering of the citizenry. The theatre is a *public institution*, and for a republic, the structure of public gathering is the structure of the state.
  *   **The Festival:** This resolves your puzzle about the festivals. In a Rousseauian festival, there are no spectators. As he writes, "Let the spectators themselves become the spectacle." The difference isn't sitting vs. standing; it is **alienation vs. presence**. In the theatre, I look at a stranger pretending to be a hero. In the festival, I look at my neighbor being themselves. One reinforces separation; the other reinforces community.

  ### 3. Resolving the Contradiction (6 vs. 7)
  You correctly spotted that (6) and (7) fight each other in your reconstruction.
  *   (6) says content doesn't matter (because the *act* of feeling spends the stock).
  *   (7) says content does matter (because the play mirrors the audience's taste).

  If you cut (4), (6) collapses with it. If sympathy isn't a finite stock, then it *does* matter what you are sympathizing with. This actually saves the argument. Rousseau's real point is closer to (7): The theatre crystallizes existing social corruption. It takes the *amour-propre* (vanity/social comparison) already present in Paris and gives it a temple.

  ### 4. How to Fix the Argument
  To keep the argument viable without it proving too much (condemning novels) or contradicting itself, you need to swap the "Depletion Model" for the "Habituation Model."

  **Keep (1) and (2):** Feeling can be a substitute for action. Weeping can give a false sense of moral completion.
  **Cut (4):** Do not claim sympathy is used up.
  **Replace (5) with:** "The theatre habituates citizens to passivity. It trains us to judge virtue from a distance rather than practice it in proximity."
  **Replace (6) with:** "The content is secondary to the form. Even a virtuous play reinforces the habit of paying to watch virtue rather than embodying it."

  ### Summary
  The argument goes wrong at **(4)** because it tries to quantify emotion rather than qualify the social relation.

  It looked obvious because "venting" is a common metaphor, but it forces Rousseau into a hypocrisy regarding novels.

  To fix it, you must admit that Rousseau isn't worried about Geneva running out of pity. He is worried about Geneva **privatizing its virtue**. He fears the theatre turns the citizen into a consumer. The cost of holding this view is high: it requires you to accept that *how* we gather is more morally significant than *what* we feel, and it demands a suspicion of any art that requires a passive audience. That is a much harder pill to swallow than "feelings have costs," but it is the only one that makes Rousseau consistent.
