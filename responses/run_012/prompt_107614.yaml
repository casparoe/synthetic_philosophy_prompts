answer: |-
  ## The Assumption Audit Protocol (AAP)
  **For:** Scientific Advisory Panel on Regulatory Modelling
  **Time Budget:** 20 minutes per assumption (within a 2-hour model review)
  **Purpose:** To prevent the "F-twist" (instrumentalism) from licensing unsafe extrapolation.

  ### Preamble: The Three Readings
  Before applying the protocol, the Panel must agree on which of the three readings applies to the assumption in question. The modellers must declare this *ex ante*.

  1.  **Negligibility Assumption:** The factor exists but is quantitatively small. (e.g., "We ignore friction.")
      *   *License:* Permits extrapolation *if* the factor remains small in the new context.
  2.  **Domain Restriction:** The model makes no claim where the assumption fails. (e.g., "Valid only for temperatures > 0°C.")
      *   *License:* Forbids extrapolation beyond the boundary. Sign-off is conditional on the policy staying within the domain.
  3.  **Heuristic Device:** The assumption is known false, but the derived relationship holds empirically. (e.g., "Assume perfect competition to estimate markup bounds.")
      *   *License:* Permits use for directionality or bounds, but forbids precise point forecasts without external validation.

  ---

  ### The Procedure (5 Steps)

  #### Step 1: The Classification Check
  **Question:** Has the modelling team explicitly categorized the assumption (Negligibility, Domain, or Heuristic) and provided the justification for that classification?
  *   **Sufficient Answer:** A written statement linking the assumption to one of the three readings with a citation or derivation.
  *   **Insufficient Answer:** "This is standard practice" or "The predictions fit past data." (This is the F-twist evasion).
  *   **Technical vs. Judgment:** *Technical.* Either they stated it or they didn't.
  *   **Stop Rule:** If unclassified, return to modellers. Do not proceed.

  #### Step 2: The "Switch" Test (Sensitivity)
  **Question:** If we relax this assumption (make it more realistic), does the model output change materially within the *calibrated* range?
  *   **Sufficient Answer:** Sensitivity analysis showing the output variance is below a pre-agreed threshold (e.g., <5% of policy effect size) when the assumption is perturbed.
  *   **Insufficient Answer:** "We didn't test that because the assumption is necessary for identification."
  *   **Technical vs. Judgment:** *Technical.* Requires code execution or literature meta-analysis.
  *   **Stop Rule:** If output changes materially in-sample, the assumption is not Negligible. It must be re-classified as Domain or Heuristic.

  #### Step 3: The Mechanism Check
  **Question:** Is this assumption doing *causal work* or *mathematical work*?
  *   **Sufficient Answer:** A causal diagram or structural explanation showing whether the assumption drives the result (causal) or merely simplifies the solution (mathematical).
  *   **Insufficient Answer:** "It allows us to solve the equilibrium." (This admits it is doing mathematical work, which risks being a Heuristic).
  *   **Technical vs. Judgment:** *Judgment wearing technical clothes.* Modellers often claim causal mechanisms are "mathematical necessities." The Panel must probe if the mechanism relies on the falsity of the assumption.
  *   **Stop Rule:** If the assumption drives the causal mechanism and is known false, it cannot be Negligibility. It is a Heuristic.

  #### Step 4: The Extrapolation Boundary
  **Question:** Does the intended regulatory use case push the model into a regime where the assumption is *more* false than in the calibration data?
  *   **Sufficient Answer:** A comparison of the assumption's validity in the calibration period vs. the policy forecast period.
  *   **Insufficient Answer:** "The model is robust."
  *   **Technical vs. Judgment:** *Judgment.* Requires comparing the policy context to historical data.
  *   **Stop Rule:** If validity degrades significantly:
      *   If classified as *Negligibility*: **Reject.**
      *   If classified as *Domain*: **Restrict Scope** (Policy must not violate the domain).
      *   If classified as *Heuristic*: **Restrict Use** (No point forecasts; use for scenario bounds only).

  #### Step 5: The Sign-Off Condition
  **Question:** Given the classification and the boundary, does the residual risk fall within the agency's risk tolerance?
  *   **Sufficient Answer:** A explicit statement of the risk (e.g., "We accept a 10% error margin on distributional estimates").
  *   **Insufficient Answer:** Silence or implicit trust.
  *   **Technical vs. Judgment:** *Pure Value Judgment.* This is where the Panel takes responsibility.
  *   **Stop Rule:** If the Panel cannot agree on the risk tolerance, sign-off is withheld.

  ---

  ### Case Studies

  #### Case 1: Representative Agent (RA) in Tax-Incidence Forecasting
  *   **Context:** A model forecasts the distributional effects (inequality) of a new capital gains tax.
  *   **Assumption:** The economy is represented by a single "average" household (Representative Agent).
  *   **Chair's Preference:** I want to wave this through. RA models are stable, converge easily, and we are in a hurry.
  *   **Protocol Application:**
      *   **Step 1 (Classification):** Modellers claim *Negligibility* ("Heterogeneity doesn't matter for aggregate revenue").
      *   **Step 2 (Switch):** *Technical.* Sensitivity analysis shows aggregate revenue is stable, but *distributional* metrics (Gini, quintile shares) cannot be generated internally by an RA model. They are imputed post-hoc.
      *   **Step 3 (Mechanism):** *Judgment.* The assumption is doing **causal work** regarding incidence. Incidence *is* heterogeneity. You cannot calculate distributional effects of a tax without modelling differential constraints.
      *   **Step 4 (Boundary):** The policy is explicitly targeted at changing distribution. The assumption is maximally false in the intended use case.
      *   **Step 5 (Sign-Off):** **REJECTED.**
  *   **Outcome:** The procedure rules against the Chair's preference. An RA assumption cannot be read as Negligibility for distributional outcomes. It must be treated as a **Domain Restriction** (Model applies only to aggregate revenue, not distribution) or a **Heuristic** (Use only for directionality, not quantitative incidence).
  *   **Ruling:** Sign-off withheld for distributional claims. Model may only sign off on aggregate revenue forecasts.

  #### Case 2: Homogeneous Mixing in Public Health Intervention
  *   **Context:** Projecting the effect of a vaccination campaign aimed at a specific subpopulation (e.g., urban school-age children) on overall infection rates.
  *   **Assumption:** All individuals mix randomly with all other individuals (Homogeneous Mixing).
  *   **Protocol Application:**
      *   **Step 1 (Classification):** Modellers claim *Domain Restriction* ("Valid for high-contact populations").
      *   **Step 2 (Switch):** *Technical.* Comparing to network models shows overall R0 is similar, but local extinction probabilities differ.
      *   **Step 3 (Mechanism):** *Judgment.* The assumption simplifies transmission math but does not fundamentally alter the *direction* of the intervention effect (vaccination reduces spread).
      *   **Step 4 (Boundary):** The intervention targets a subpopulation. Homogeneous mixing assumes the subpopulation is not distinct. This violates the policy design. However, if the subpopulation is the primary vector, the error may be contained.
      *   **Step 5 (Sign-Off):** **CONDITIONAL.**
  *   **Outcome:** The assumption is accepted as a **Heuristic Device**.
  *   **Ruling:** Model may be used to forecast *aggregate* reduction in cases. Model may **not** be used to forecast elimination timelines or effects on *other* specific subpopulations (e.g., rural elderly), as the mixing assumption fails there. Scope is restricted to aggregate impact.

  #### Case 3: Rational Expectations (RE) in Novel Policy Rule
  *   **Context:** Forecasting the effect of a novel central bank policy rule (one never tried before) on inflation.
  *   **Assumption:** Agents form expectations using the true model of the economy (Rational Expectations).
  *   **Protocol Application:**
      *   **Step 1 (Classification):** Modellers claim *Heuristic* ("Agents learn quickly").
      *   **Step 2 (Switch):** *Technical.* Literature on learning models shows significant deviation from RE in the first 2–5 years of a novel regime.
      *   **Step 3 (Mechanism):** *Judgment.* The assumption is doing **causal work**. The "policy ineffectiveness" or "announcement effect" relies entirely on agents believing the policy will persist.
      *   **Step 4 (Boundary):** The policy is *novel*. Agents cannot rationally know the model of a policy that has no history. The assumption is most false exactly where the forecast is needed (the transition period).
      *   **Step 5 (Sign-Off):** **RESTRICTED.**
  *   **Outcome:** The assumption fails the Extrapolation Boundary. It cannot be Negligible (learning matters) and cannot be Domain Restricted (we need the transition).
  *   **Ruling:** Model may not be used for point forecasts of the transition period (years 1–3). It may only be used for **long-run equilibrium** comparisons (Heuristic), with an explicit disclaimer that short-run costs are likely underestimated.

  ---

  ### Technical vs. Judgment: A Note for the Chair
  In drafting this procedure, I have marked specific steps as "Judgment wearing technical clothes." You must watch for these closely during the review.

  1.  **The "Identification" Trap (Step 3):** Modellers will often say an unrealistic assumption is "necessary for identification." This sounds technical. It is often a judgment that they prefer a solvable model over a realistic one. *Challenge:* Ask if a Bayesian or structural approach could identify the parameter without the assumption.
  2.  **The "Robustness" Claim (Step 2):** Modellers will claim a model is "robust" without showing the perturbation. *Challenge:* Demand the code for the perturbed run. If they say it "won't converge," that is evidence the assumption is doing causal work, not just mathematical work.
  3.  **The Risk Tolerance (Step 5):** This is the only step that is purely yours. The procedure forces the technical uncertainty into the open so that your value judgment is about *risk*, not about *truth*.

  ### Where the Procedure Bites
  In **Case 1 (Representative Agent)**, the procedure forced a rejection of a assumption you preferred to accept. This is the intended function. The F-twist argues that because the RA model predicts aggregate revenue well, it can forecast distribution. The AAP exposes that the assumption shifts from *Negligibility* (for revenue) to *Logical Impossibility* (for distribution). By forcing the classification in Step 1, you prevent the modellers from sliding between readings to suit the sign-off requirement.

  **Final Instruction to Panel:** When in doubt, default to **Domain Restriction**. It is safer to say "This model does not apply to this question" than to say "This false assumption is close enough."
