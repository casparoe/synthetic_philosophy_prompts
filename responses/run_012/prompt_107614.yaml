prompt: |-
  I chair a scientific advisory panel that must sign off, roughly monthly, on quantitative models used to support regulatory decisions — tax-incidence forecasts, integrated assessment models, projections of targeted public-health interventions. Panel members are mostly not modellers, we have about two hours per model, and our sign-off is what lets an agency act. Reviewers repeatedly invoke the idea — sometimes labelled the F-twist — that a model's assumptions need not be realistic provided its predictions are good enough; I find this discharges some objections and licenses worse ones. Please write a decision procedure my panel can run assumption by assumption to decide whether an unrealistic assumption is acceptable for the intended use: the questions to ask in order, what counts as a sufficient answer, when the assumption obliges us to restrict the model's scope rather than license extrapolation, and where the procedure stops and hands the decision to the panel as a value judgment. Build it around a distinction I want to preserve: an assumption can be read as a negligibility assumption (approximately true, the neglected factor is small), as a domain restriction (the model makes no claim where the assumption fails), or as a heuristic device (known false but useful for reaching a testable result) — and these readings license different uses of the same model. Then run it on three cases: a representative-agent assumption in a model used to forecast the distributional effects of a tax; a homogeneous-mixing assumption in a model used to project the effect of an intervention aimed at a small subpopulation; and a forward-looking rational-expectations assumption in a model used to forecast the effects of a novel policy rule. Include at least one case where the procedure rules against an assumption I would prefer to wave through, and mark plainly which steps are technical and which are judgment wearing technical clothes.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case studies:

  1.  **Analyze the Request:**
      *   **Role:** Chair of a Scientific Advisory Panel (SAP).
      *   **Task:** Create a decision procedure for evaluating model assumptions under time pressure (2 hours/model) for regulatory sign-off.
      *   **Problem:** Reviewers often use the "F-twist" (Friedman's instrumentalism: assumptions don't need to be realistic, only predictions) to dismiss valid concerns, leading to potential overreach.
      *   **Goal:** A structured procedure to decide if an unrealistic assumption is acceptable, distinguishing between *negligibility*, *domain restriction*, and *heuristic device*.
      *   **Requirements:**
          *   Step-by-step questions.
          *   Criteria for sufficient answers.
          *   Triggers for scope restriction vs. extrapolation.
          *   Clear hand-off point for value judgments.
          *   Distinction between technical steps and judgment steps.
          *   Apply to three specific cases (Tax/Representative Agent, Health/Homogeneous Mixing, Policy/Rational Expectations).
          *   Include at least one case where the procedure rules *against* the Chair's preference (to test robustness).
      *   **Tone:** Professional, rigorous, actionable, suitable for a regulatory context.

  2.  **Deconstruct the Core Concept (The "F-Twist" vs. Reality):**
      *   Milton Friedman's 1953 essay argues that the realism of assumptions doesn't matter, only the accuracy of predictions.
      *   *Critique:* This works for physics sometimes, but in social/regulatory science, extrapolation beyond observed data is common. If assumptions are false *and* causal mechanisms are mispecified, predictions fail out-of-sample.
      *   *The Proposed Distinction:*
          1.  *Negligibility:* The factor exists but is small enough to ignore (e.g., air resistance for a falling rock in a vacuum chamber).
          2.  *Domain Restriction:* The model only applies where the assumption holds (e.g., Newtonian physics only at low speeds).
          3.  *Heuristic:* The assumption is false but helps derive a relationship that holds true anyway (e.g., assuming perfect competition to find a baseline for market power).

  3.  **Drafting the Decision Procedure (The "Assumption Audit Protocol"):**
      *   Need to fit within a 2-hour review. It must be efficient.
      *   *Step 1: Classification.* What kind of assumption is it? (Negligibility, Domain, Heuristic).
      *   *Step 2: Sensitivity/Robustness.* If we relax it, does the output change materially?
      *   *Step 3: Causal Mechanism.* Is the assumption driving the *mechanism* or just simplifying the *math*?
      *   *Step 4: Intended Use Match.* Does the regulatory question fall within the safe zone defined by Steps 1-3?
      *   *Step 5: The Hand-off.* Where does science end and policy risk begin?

      *Refining the Steps for the Prompt's specific constraints:*
      *   Need to explicitly mark Technical vs. Judgment.
      *   Need to define "Sufficient Answer."
      *   Need to define the "Stop Rule" (when to reject/restrict).

  4.  **Developing the Case Studies:**
      *   *Case 1: Representative Agent (RA) in Tax Incidence.*
          *   *Context:* Forecasting distributional effects.
          *   *Problem:* RA assumes everyone is the same. Distributional effects require differences.
          *   *Verdict:* This should likely fail or require severe restriction. An RA model *cannot* logically produce distributional outcomes without external post-hoc adjustments. This is a good candidate for the "rules against preference" if the Chair likes RA models for simplicity.
      *   *Case 2: Homogeneous Mixing in Public Health.*
          *   *Context:* Intervention on a small subpopulation.
          *   *Problem:* Mixing assumes everyone contacts everyone. Subpopulation implies structure.
          *   *Verdict:* Likely acceptable as a *Domain Restriction* if the subpopulation is well-mixed internally, but risky for spillover.
      *   *Case 3: Rational Expectations (RE) in Novel Policy.*
          *   *Context:* Novel rule (Lucas Critique territory).
          *   *Problem:* RE assumes agents know the model. Novel policy means they can't know it yet.
          *   *Verdict:* High risk. Likely needs to be treated as a Heuristic with strong caveats, or rejected for forecasting.

      *Selection for "Rules Against Preference":* The Representative Agent case is the strongest candidate. It is mathematically impossible for a pure RA model to generate inequality metrics without external imputation. If the Chair wants to wave it through for speed, the procedure must stop them.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the tension (Friedman vs. Regulatory Risk). Define the three readings (Negligibility, Domain, Heuristic).
      *   **The Protocol (AAP):** 5 Steps.
          *   Step 1: Categorize (Technical/Judgment mix).
          *   Step 2: The "Switch" Test (Technical).
          *   Step 3: The Mechanism Check (Judgment).
          *   Step 4: The Extrapolation Boundary (Judgment).
          *   Step 5: The Sign-off Condition (Decision).
      *   **Case Studies:** Apply the protocol rigorously.
      *   **Reflection:** Highlight where the procedure bit back.

  6.  **Refining the "Technical vs. Judgment" Distinction:**
      *   *Technical:* Can be answered by running code, checking literature, or mathematical proof.
      *   *Judgment:* Involves risk tolerance, definition of "material," or policy stakes.
      *   *Judgment in Technical Clothes:* When a modeller says "it's standard" instead of showing evidence. The protocol needs to expose this.

  7.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the procedure too long for 2 hours?
      *   *Fix:* Emphasize that the *modellers* must provide the dossier beforehand. The panel *reviews* the answers, doesn't generate them from scratch.
      *   *Critique:* Did I clearly distinguish the three readings?
      *   *Fix:* Ensure the definitions are upfront and referenced in the cases.
      *   *Critique:* Is the "rules against preference" clear?
      *   *Fix:* In Case 1, explicitly state that the Chair might want to accept it for simplicity, but the logic forbids it.

  8.  **Final Polish:**
      *   Ensure tone is authoritative but humble (acknowledging limits).
      *   Check that all constraints of the prompt are met (F-twist mention, 3 cases, specific distinction, technical/judgment marking).

  **(Self-Correction Note on Case 1):** A Representative Agent model used for *distributional* effects is a category error. A single agent has no distribution. To make it work, modellers often apply "incidence rules" post-model. The assumption isn't just unrealistic; it's logically incompatible with the output *unless* treated as a heuristic baseline. I need to make sure the procedure catches this logical impossibility, not just empirical falsity.

  **(Self-Correction Note on Case 3):** Rational Expectations with *novel* policy is the classic Lucas Critique. The procedure should flag this as a Heuristic that fails the "Extrapolation Boundary" if used for point forecasting.

  9.  **Finalizing the Output Structure:**
      *   Preamble: The Problem with the F-Twist.
      *   Definitions: The Three Readings.
      *   The Protocol (5 Steps).
      *   The Case Studies.
      *   Closing Note on the "Bite."

