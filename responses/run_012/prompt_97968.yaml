answer: |-
  **MEMORANDUM**

  **TO:** All Instructional Faculty
  **FROM:** Office of Examination Integrity, Okeechobee County Unified School District
  **DATE:** October 14, 2023
  **SUBJECT:** Policy Directive 892-B: Protocols for Genuinely Surprising Summative Assessments

  Effective immediately, the Office of Examination Integrity (OEI) is implementing new standards to address recurring student grievances regarding the predictability of scheduled surprise examinations. It has come to our attention that learners are utilizing deductive reasoning to anticipate assessment windows, thereby compromising the pedagogical value of the surprise element. To restore epistemic uncertainty, the following protocols must be strictly observed.

  **Section 1: Prohibition of Deducible Temporal Endpoints**
  Faculty are prohibited from administering surprise examinations on the final day of any designated assessment window (e.g., Friday of a Monday–Friday week). Pursuant to student logical models, if an examination has not occurred by the conclusion of the penultimate day, the final day becomes logically inevitable. An inevitable event cannot constitute a surprise. Therefore, the final day is hereby deemed ineligible.

  **Section 2: Iterative Eligibility Review**
  Faculty must recognize that Section 1 renders the penultimate day functionally equivalent to the final day. With the actual final day eliminated from the possibility space, the penultimate day becomes the new logical endpoint. Consequently, if the exam has not occurred by the antepenultimate day, the penultimate day becomes inevitable. By transitive property, no day within a finite sequence may host a surprise examination, as each day eliminates the next via backwards induction.

  **Section 3: Administrative Certification of Unpredictability**
  To circumvent the restrictions outlined in Section 2, the OEI will intervene. Faculty must submit proposed exam dates to the OEI for "Epistemic Viability Certification." The OEI shall verify that the selected date cannot be inferred by ideal reasoners possessing common knowledge of the syllabus. Only dates bearing this certification may be utilized.

  **Section 4: Transparency and Informational Leakage**
  Faculty are reminded that all administrative certifications are public record under District Transparency Bylaws. Students are entitled to know whether a date has been certified. If students know a date is certified, they know the OEI has validated its unpredictability. However, the OEI will only certify a date that survives Section 2. Therefore, the existence of a certification allows students to deduce the specific date that survived elimination. Thus, the certification itself renders the exam predictable.

  **Section 5: Meta-Cognitive Blindness Protocols**
  To prevent the leakage described in Section 4, the OEI must certify dates without knowing which dates have been certified. However, District Policy 104 forbids officials from certifying unknown variables. Consequently, the OEI cannot certify a date without violating transparency, and cannot withhold certification without violating integrity.

  **Section 6: Suspension of Assessments**
  Given that any announced examination window allows for backwards induction, and any administrative override creates a public record enabling forward deduction, it is the determination of the OEI that no date exists which satisfies the criteria for a genuinely surprising examination. To prevent logical inconsistency and potential student litigation regarding breached expectations of surprise, all surprise examinations are hereby suspended indefinitely.

  Faculty are advised to schedule all future assessments as "Expected Routine Evaluations" to avoid paradoxical liabilities.

  **Approved by:**
  *Dr. Aris Thorne, Director of Epistemic Compliance*
  *Okeechobee County Unified School District*
