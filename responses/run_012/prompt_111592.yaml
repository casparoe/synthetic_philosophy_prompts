answer: |-
  You are describing **one phenomenon** with two symptoms. The academic umbrella is **Judgment Aggregation**, specifically a **Temporal Doctrinal Paradox** coupled with **Path Dependence**.

  But you need a word for the sentence. The cleanest term for the *shape* of the thing—the policy that exists in the output but not in the minds—is a **Phantom Policy**.

  Here is the carving you asked for, stripped of the reading list.

  ### 1. Is it one phenomenon or two?
  It is **one structural flaw** manifesting in two ways.
  *   **Symptom A (The Phantom Policy):** Individual consistency aggregates into collective incoherence. (This is the *Doctrinal Paradox* or *Discursive Dilemma*, stretched over time).
  *   **Symptom B (The Agenda Sensitivity):** Changing the order or bundling changes the outcome, even if preferences stay the same. (This is *Path Dependence* or *Agenda Control*).

  **Why they are the same:** Both prove that the group **does not have a coherent "will" or preference** prior to the vote. The preference is not *discovered* by the voting; it is *constructed* by the procedure. If the group had a true, consistent collective mind, the order of votes wouldn't matter, and the case-by-case outcomes would align with their stated principles. Because they don't, the procedure itself is writing the policy, not the people.

  ### 2. Why your existing instincts don't fit
  *   **Not Groupthink:** Groupthink requires social pressure or conformity. Here, members are voting sincerely and independently. The error is mathematical, not psychological.
  *   **Not Slippery Slope:** A slippery slope implies a degradation of logic or standards over time (Step Z is worse than Step A). Here, every step is logically sound on its own. The error is in the *accumulation*, not the degradation.
  *   **Not Drift:** Drift implies members' minds are changing. You verified they aren't. The inputs are static; the aggregation method is creating the variance.

  ### 3. The Term: **Phantom Policy**
  Use this for your piece. It captures the "real but unauthored" nature of the rule.
  *   **Sentence:** *"The board wasn't drifting, and it wasn't gridlocked; it was generating a **phantom policy**—a set of rules that existed in the record but in no member's head."*

  **Alternative (more technical): Procedural Artifact.**
  *   **Sentence:** *"The outcomes were not expressions of collective will, but **procedural artifacts** created by the order of the agenda."*

  ### 4. The Edges (Borderline vs. Outside)
  To ensure you're using it correctly, here is where the concept stops and starts:

  *   **Clearly Inside (Fits your case):**
      *   Members vote sincerely on every item.
      *   No member would endorse the *cumulative* result if stated as a single rule.
      *   Changing the *order* or *bundling* of votes changes the *outcome* (proving the outcome is procedure-dependent, not preference-dependent).
      *   The incoherence is only visible from the "bird's-eye view" (the record), not the "seat view" (the individual voter).

  *   **Borderline (Use with caution):**
      *   **Logrolling:** If members are trading votes ("I'll vote for your variance if you vote for mine"), that is *strategic*, not structural. Your case is stronger because members are *not* trading; they are being sincere.
      *   **Precedential Drift:** If members start changing their minds because "we approved one like this last month," that is psychological adaptation. Your case is stricter: their minds *haven't* changed.

  *   **Clearly Outside (Do not use):**
      *   **Mission Creep:** This implies the organization's goals are expanding intentionally or through negligence. Your case is about *inconsistency*, not expansion.
      *   **Regulatory Capture:** This implies outside influence. Your case is internal structural incoherence.
      *   **Simple Inconsistency:** If the board voted Yes on Case A and No on identical Case B, that's just error. Your case is subtler: the cases are different, the votes are consistent *locally*, but the *principle* derived from them is contradictory.

  ### 5. Why the "Time" Element Doesn't Disqualify It
  You mentioned you couldn't find a match because existing literature focuses on "a single vote on a set of linked propositions." Do not let that stop you.
  *   **The Logic Holds:** Time is just a way of hiding the linkage. If you took your year's worth of protocols and laid them out as a single spreadsheet of "Principles Applied," the contradiction appears instantly. The fact that they were voted on in January vs. June is irrelevant to the logical structure; it only makes the paradox harder for the members to see.
  *   **The Bundling Proof:** The fact that the new Chair changed outcomes by bundling items proves the underlying math is identical to the single-vote paradoxes. Bundling forces the group to confront the linkage that time had hidden.

  ### Summary for your notes
  *   **The Phenomenon:** **Path-Dependent Judgment Aggregation**.
  *   **The Word:** **Phantom Policy** (or **Procedural Artifact**).
  *   **The Hook:** The procedure is writing the rules, not the people.
  *   **The Distinction:** It is structural incoherence, not psychological drift.

  This gives you the precision of social-choice theory without forcing your readers to digest a paradox. You can describe it as a "structural blind spot" where the math of voting overrides the intent of the voters.
