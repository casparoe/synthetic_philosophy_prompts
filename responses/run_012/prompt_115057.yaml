          4.  **Power Laws:** Heavy tails vs. Exponential decay.
          5.  **Lindy Effect:** The direct contradiction (Increasing vs. Constant hazard).
          6.  **Definition of Death:** Regime change vs. State death. How does coding affect the hazard rate?
          7.  **Inside View/Policy:** If causes don't matter, what do we fund?
          8.  **The "Sample of One" Defense:** Is the US/China actually a sample of one, or does the class apply?
          9.  **Mechanism:** If fiscal crises don't predict death, why do they correlate?
          10. **The "Bracing/Nuts" tension:** Why does this feel nihilistic? (Maybe too soft). Let's go with *Intervention*. If hazard is constant, can intervention change it?

  4.  **Refining Follow-ups (The "Trap"):**
      *   The prompt emphasizes anticipating the "That's the inside view" dodge.
      *   *Strategy:* The follow-up must force him to admit either (1) the model has no predictive power for specific cases, or (2) the model is empirically falsified by the specific case data.
      *   *Example:* If he says "We can't predict specific collapses," the follow-up is "Then your model describes a graveyard, not a hospital. Why should we listen to a coroner about public health?"

  5.  **Review against Constraints:**
