          *   *Follow-up:* He'll say "Manage risk, not specifics." Counter: "If I can't distinguish between a fiscal crisis that kills and one that doesn't, 'manage risk' is just 'hope for luck'."

      *   *Topic (d): Lindy Effect.*
          *   *Draft 1:* What about Lindy?
          *   *Refinement:* Lindy implies survival probability *increases* with age. You say it's *constant*. These can't both be true. Which data are you ignoring?
          *   *Follow-up:* He'll say "Lindy is selection bias." Counter: "If your memoryless model is the Outside View, and Lindy is an empirical regularity in the same data, isn't your Outside View just wrong?"

      *   *Filling the gaps (Need 8-10 total).*
          *   Need more on the "Inside View" dismissal.
