answer: |-
  Here are ten questions designed to pin down the guest's model, anticipate his "outside view" defenses, and force him to grapple with the implications of his thesis.

  ### 1. The Symmetry Claim
  You argue that a reference class is only principled if it's picked out by a symmetry—that features we're indifferent to shouldn't move the hazard rate. But in physics, symmetries correspond to conservation laws. What is the *generator* of the symmetry for a polity? If you're invoking time-translation invariance to justify a constant hazard rate, aren't you just assuming memorylessness to prove memorylessness?

  *   **Likely Answer:** He'll say it's not about physical time, but about epistemic indifference: if we can't distinguish State A from State B on relevant variables, we must treat them as identical.
  *   **Follow-up:** "But that's the Principle of Indifference, which is a rule for managing ignorance, not a feature of the world. If your 'symmetry' is just a formal way of saying 'we don't know which variables matter,' then your constant hazard rate isn't a discovery about history; it's a confession of model underfitting. Why should we trust a confession more than a theory?"

  ### 2. Gerrymandering the Class
  If I want to prove the American Republic is stable, I can choose the reference class 'democracies with nuclear weapons and a dollar reserve currency.' If I want to prove it's doomed, I choose 'federal republics exceeding 250 years.' How does your symmetry criterion actually prevent me from gerrymandering the class until the frequency comes out how I like? What's the objective stop-loss?

  *   **Likely Answer:** He'll argue that you must use the *widest* defensible class and that adding specific features (like nuclear weapons) requires proving they alter the hazard rate, which data shows they don't.
  *   **Follow-up:** "But the data only shows they don't alter the rate *if* you've already accepted the memoryless model. If I show you that nuclear states have a different survival curve than non-nuclear states, you'll say that's a sample-size noise issue. Where is the test that isn't protected from falsification by a plea for 'more data'?"

  ### 3. Falsification Conditions
  Let's talk empirics. What specific pattern in the historical record would force you to abandon the memoryless hypothesis? If you see a cluster of states dying at age 200, or a cluster surviving to age 1000, is that compatible with your model, or does that break the exponential distribution?

  *   **Likely Answer:** He'll say that random clustering is expected in stochastic processes, but a statistically significant deviation from the exponential fit (e.g., a p-value below a threshold) would falsify it.
  *   **Follow-up:** "Significant deviations *do* appear in survival analysis of organizations, usually as 'heavy tails.' If you find them, do you adjust the model, or do you discard the data points as 'definitionally ambiguous'? Because if you discard the outliers, you're curating the data to fit the curve."

  ### 4. The Power Law Critique
  Many complex systems don't follow exponential decay (memoryless); they follow power laws (scale-free). That means you have loads of short-lived states and a handful of incredibly durable ones—more durable than your model allows. If state lifespans are actually power-law distributed, doesn't that imply age *does* convey information (i.e., survival is path-dependent), and your constant hazard rate is just an average over two different regimes?

  *   **Likely Answer:** He'll argue that power laws and exponentials can look similar over short time horizons, or that the "heavy tail" is just a small-number statistical artifact.
  *   **Follow-up:** "If the tail is fat, it means the most successful polities have found a way to lower their hazard rate over time. If your model treats the Roman Empire's longevity as luck rather than adaptation, you aren't modeling history; you're modeling a lottery. Why should a policymaker care about the odds of a lottery?"

  ### 5. The Lindy Effect
  You must get asked about the Lindy Effect constantly—the idea that the future life expectancy of an idea or institution increases with its age. That's the opposite of memoryless. Do you think Lindy is a real regularity in political science, or just a selection artifact? And if it is real, doesn't it directly contradict your constant hazard rate?

  *   **Likely Answer:** He'll likely say Lindy applies to non-perishable goods (ideas, technologies) but not perishable ones (states, people), or that it's a bias caused by looking only at survivors.
  *   **Follow-up:** "But states *are* the dataset you're using. If the data shows that 500-year-old states are statistically less likely to die in the next decade than 50-year-old states, your model is empirically wrong. Are you saying that pattern doesn't exist in your data, or that you're filtering it out?"

  ### 6. Coding the "Death" of a State
  Your hazard rate depends entirely on how you code "death." If the Soviet Union becomes the Russian Federation, is that a death or a regime change? If you code it as a death, you inflate the hazard rate; if you code it as survival, you lower it. How much of your 'memoryless' result is just an artifact of treating continuity as discontinuity to make the math cleaner?

  *   **Likely Answer:** He'll say they use strict criteria (loss of sovereignty, central authority collapse) and that sensitivity analyses show the result holds across coding schemes.
  *   **Follow-up:** "Sensitivity analyses usually show the *direction* holds, not the *magnitude*. If shifting the coding threshold changes the expected lifespan by two centuries, then the 'constant' in your constant hazard rate is actually a variable dependent on historian judgment. How do you quantify that error bar?"

  ### 7. Policy and Defunding History
  If age carries no information, and specific decline narratives (fiscal crises, elite overproduction) are just 'inside view' stories, what is a policymaker supposed to do? If I can't distinguish between a crisis that kills a state and one it survives, isn't the logical upshot of your work that we should stop funding the study of history and just buy actuarial tables?

  *   **Likely Answer:** He'll say we should stop trying to *predict* specific collapses and start building *resilience* against random shocks, similar to earthquake engineering.
  *   **Follow-up:** "Earthquake engineers study the fault lines, they don't just assume the ground shakes randomly. If you tell me not to study the 'fault lines' of history because they're inside-view stories, you're telling me to build blind. Isn't 'resilience' without diagnosis just hoarding resources until you run out?"

  ### 8. Intervention and Hazard Rates
  If the hazard rate is constant for a class, can a specific polity change its class? If the US implements a policy that successfully reduces elite overproduction, does it move into a 'lower hazard' reference class, or is that policy change itself just a random variable that doesn't alter the underlying decay probability?

  *   **Likely Answer:** He'll say policies are inside-view attempts to cheat the outside view, and that historically, such reforms don't shift the aggregate survival statistics.
  *   **Follow-up:** "So you're saying reform is statistically invisible. If a state *cannot* signal a lower hazard rate through behavior, then markets and allies should price all mature states as equally risky. But they don't. They price some as safe and some as risky. Is the market wrong, or is your model missing a signal?"

  ### 9. The "Sample of One" Defense
  You dismiss decline narratives because they are stories told about a sample of one. But every state *is* a sample of one in terms of its specific culture and geography. If the outside view swallows all the specific details, doesn't it become useless for anyone living *inside* a specific state? I don't live in 'Sovereign Polity #405'; I live in *this* one.

  *   **Likely Answer:** He'll argue that the inside view is overconfident and that the outside view provides a necessary sanity check on our exceptionalism.
  *   **Follow-up:** "A sanity check is useful, but a ceiling is not. If the outside view tells me my survival odds are 2% regardless of what I do, that's not a check, it's a fatalism. Are you offering a tool for risk assessment, or a philosophical argument for nihilism?"

  ### 10. Modern Complexity
  Your data includes polities from antiquity to the present. But modern states have surveillance, economic tools, and destructive capacity that ancient states didn't. Doesn't pooling these into one reference class violate your own symmetry argument? Shouldn't a 'nuclear industrial state' be a different symmetry group than an 'agrarian empire,' and if you split them, does the memoryless property still hold?

  *   **Likely Answer:** He'll say that despite technological changes, the fundamental dynamics of political cohesion and collapse remain invariant.
  *   **Follow-up:** "If the dynamics are invariant despite the invention of nuclear weapons, global finance, and the internet, then your model implies human politics is static. But if politics is static, why did we invent those things? You're either saying technology doesn't matter for survival, or that history is a loop. Which is it?"
