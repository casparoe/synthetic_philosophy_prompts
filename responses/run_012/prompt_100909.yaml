      *   *Question 1 (Upstream):* **Characterizing the Ignorance.** How do we bound the preference set without inviting strategic expansion? If I say "I might value X this much," do I have an incentive to say "I might value X *any* amount" to block changes? *Reasoning:* If you can't define the set without triggering gaming, the rest fails.
