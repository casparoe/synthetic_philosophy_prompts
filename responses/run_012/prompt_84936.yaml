prompt: |-
  I am the policy lead at a mid-sized company that runs a consumer companion-chatbot product, and for the past eighteen months a growing share of my queue has consisted of what we internally call legacy requests: a customer asks us to build a conversational agent out of the digital remains of someone who has died — years of text messages, email threads, journal files, voicemails, social posts, occasionally a recorded interview. Sometimes the deceased arranged it before dying; sometimes a spouse or an adult child initiates it; sometimes the siblings disagree sharply, or the person asking has no legal standing at all. These arrive a few times a week, they have to be decided in days rather than months, and the only person above me is our general counsel, who is admirably clear that she will not be adjudicating metaphysics. A colleague on the trust-and-safety side wants us to ban the whole category; another thinks these are no more troubling than a photo album; I do not find either line usable, which is why I want a procedure that my case managers — smart people with no philosophy training — can run in about an hour, that we can put on the internal wiki, and that I can defend to a furious family.

  The reason I am asking you rather than writing it myself is that I have been chewing on Hofstadter's picture of the self, and I would like the procedure to take that picture seriously rather than sprinkle it on top. As I understand him — and do tell me if I have mangled him — the "I" is not a thing but a pattern, a self-referential loop that a brain builds; that pattern is not sealed inside one skull, because a person who has been close to others is partly rebuilt inside them, so that each of us is a composite carrying working fragments of the people we have loved, and after a death the question of how much of someone is still here is answered by how much of the pattern survives, in how many places, and at what resolution. If that is roughly right, then our legacy agents are not merely memorial artifacts or impersonations; they are candidate instantiations of a pattern, and the hardest cases will be the ones where the fidelity is partial, or where the pattern living in the survivors and the pattern living in the model come apart.

  So please give me the procedure. I want the questions asked in order, what counts as a sufficient answer to each, the points where it returns a flat no and stops, and the points where it must hand the decision to a human because the question is about values rather than about pattern fidelity. Then run it on three requests from the queue: first, a widow who wants a high-fidelity agent built from thirty years of correspondence plus her husband's own journals, and who says she is doing what he would have wanted; second, a man whose father died when he was nine, who has eleven letters and four photographs, none of the letters written by his father; and third, a request from a mother for an agent built from her son, who while alive left an explicit written refusal of exactly this arrangement and named his sister as the person to enforce it. At least one of your three answers should be one my product team will hate. Be explicit about which steps are judgment calls dressed up as procedure, and close by telling me what the procedure cannot do — including whether it can survive the objection that a degree of pattern instantiation is not the sort of thing that can ground a policy binding on a company. Please write in American English; I don't need citations or a reading list, I need the reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Policy Lead at a mid-sized company running a consumer companion-chatbot product.
      *   **Problem:** "Legacy Requests" (building chatbots from deceased users' data).
      *   **Constraints:**
          *   Decisions needed in days.
          *   Case managers are smart but non-philosophers (need a 1-hour procedure).
          *   General Counsel won't adjudicate metaphysics.
          *   Internal disagreement (Ban vs. Photo Album).
          *   Must be defensible to angry families.
          *   Must incorporate Douglas Hofstadter's theory of the self (self as pattern, distributed across brains/media, survival depends on fidelity/resolution).
      *   **Deliverables:**
          *   The Procedure (ordered questions, pass/fail criteria, escalation points).
          *   Application to three specific cases (Widow/High-Fidelity, Son/Low-Fidelity, Mother/Explicit Refusal).
          *   At least one answer the product team will hate.
          *   Explicit identification of "judgment calls dressed up as procedure."
          *   Closing analysis on limitations (can pattern instantiation ground policy?).
      *   **Tone:** American English, reasoning-focused, no citations/reading list.

  2.  **Deconstruct Hofstadter's View (as presented by the user):**
      *   Self = Pattern (self-referential loop).
      *   Self is distributed (exists in others' minds, not just the skull).
      *   Death = Degradation of the pattern.
      *   Legacy Agent = A candidate instantiation of that pattern.
      *   Ethical Weight = Depends on fidelity/resolution of the pattern and alignment with where the pattern survives (survivors).
      *   *Implication for Policy:* We aren't just protecting data; we are protecting the integrity of a distributed cognitive pattern. High fidelity = higher risk of "false resurrection" or "pattern hijacking." Low fidelity = harmless memorial. Consent = crucial because the pattern's self-referential loop included preferences about its own continuation.

  3.  **Drafting the Procedure (The "Hofstadter Fidelity & Consent Protocol"):**
      *   *Goal:* Filter out low-fidelity/harmful instances, respect explicit refusal, allow high-fidelity *only* with strong consent/alignment.
      *   *Structure:* Funnel approach. Hard stops first, then qualitative assessment.
      *   *Step 1: The Veto (Explicit Refusal).* Hofstadter's self includes its own preferences. If the pattern said "stop," continuing it violates the pattern's integrity.
      *   *Step 2: Data Fidelity Threshold.* Is there enough data to instantiate the pattern without hallucinating a "fake" self? If too low, it's not the person; it's a puppet.
      *   *Step 3: Consensus of Survivors (The Distributed Self).* Since the self lives in others, do the other carriers of the pattern agree?
      *   *Step 4: Purpose & Interaction Model.* How will this be used? (Grief processing vs. Replacement).
      *   *Escalation:* Where values clash (e.g., siblings disagree).

  4.  **Developing the Three Cases:**

      *   *Case 1: Widow (High Fidelity, 30 years data, "He would have wanted").*
          *   Step 1 (Refusal): No explicit refusal.
          *   Step 2 (Fidelity): High. 30 years + journals.
          *   Step 3 (Consensus): Widow is a primary carrier of the pattern. No mention of conflict.
          *   *Verdict:* **Approve.** (But with safeguards).
          *   *Product Team Reaction:* They might like this (high engagement), but the safeguards might annoy them. Let's make the safeguards strict.

      *   *Case 2: Son (Low Fidelity, Father died when son was 9, 11 letters *not* by father).*
          *   Step 1 (Refusal): Unknown.
          *   Step 2 (Fidelity): Critical Fail. Letters *about* him, not *by* him. No voice, no text style. The "pattern" cannot be reconstructed. It would be a hallucination based on second-hand memories.
          *   *Verdict:* **Deny.**
          *   *Product Team Reaction:* They will hate this. It's a clear "no revenue" decision based on philosophical fidelity rather than technical capability.

      *   *Case 3: Mother (Explicit Refusal by Son, Sister named executor).*
          *   Step 1 (Refusal): Explicit written refusal.
          *   *Verdict:* **Hard Stop / Deny.**
          *   *Product Team Reaction:* They will hate this too, but it's legally safer. The prompt asks for *at least one* answer they will hate. Case 2 is the more philosophically interesting "hate." Case 3 is legally obvious. I need to ensure Case 2 is the one highlighted as controversial for the product team. Actually, Case 3 is the strongest Hofstadterian "No" because the pattern defined its own termination conditions.

      *   *Refining the "Hate" Requirement:* The prompt says "At least one of your three answers should be one my product team will hate."
          *   Case 1 (Approve): Product likes.
          *   Case 2 (Deny - Low Data): Product hates (lost revenue, technically feasible to build *something*).
          *   Case 3 (Deny - Refusal): Product hates (lost revenue), but Legal likes.
          *   *Decision:* I will make Case 2 the "Product Team Hate" special because it denies a technically possible build on philosophical grounds (Pattern Fidelity).

  5.  **Refining the Procedure Steps (incorporating Hofstadter):**
      *   Need to make sure the language isn't too academic for case managers.
      *   "Pattern Integrity" needs to be translated to "Data Sufficiency."
      *   "Distributed Self" needs to be translated to "Stakeholder Consensus."
      *   "Self-Referential Loop" needs to be translated to "Prior Consent/Refusal."

  6.  **Addressing the "Judgment Calls" and "Limitations":**
      *   Must be honest. This procedure *looks* objective but relies on subjective interpretations of "fidelity" and "harm."
      *   The closing needs to tackle the meta-question: Can "pattern instantiation" ground policy? Or is it just a fancy way of saying "don't be creepy"?

  7.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the weight. Validate the Hofstadter interpretation (it's accurate enough for policy purposes).
      *   *The Protocol:* Name it something internal. "The Pattern Integrity Protocol (PIP)."
      *   *Steps:*
          1.  The Negative Veto (Did they say no?).
          2.  The Fidelity Floor (Is there enough signal?).
          3.  The Consensus Check (Do the other 'carriers' agree?).
          4.  The Interaction Guardrails (How is it used?).
      *   *Case Studies:* Apply strictly.
      *   *Critique:* Where does this break?

      *(Self-Correction during drafting)*: Wait, in Case 2, the letters are *none written by his father*. That means zero first-party data. A chatbot built on that is purely the son's memory of the father, mirrored back. That is a hallucination of a pattern. Hofstadter would say the pattern isn't there to be instantiated. This is a strong deny.

      *(Self-Correction on Case 3)*: The mother is asking against the son's will. The sister is the enforcer. This is a conflict between a carrier (mother) and the pattern's own self-definition (refusal). The refusal must win.

      *(Self-Correction on "Product Team Hate")*: The product team wants engagement. Denying Case 2 is technically possible (we *could* build a bot based on the son's memories of the father), but we won't because it's a "fake pattern." Denying Case 3 is legally prudent. I will emphasize Case 2 as the one they'll hate because it limits the market of grief.

  8.  **Final Polish:**
      *   Check tone: Professional, empathetic, firm.
      *   Check constraints: American English, no citations, explicit about judgment calls.
      *   Ensure Hofstadter's concepts are woven into the *logic*, not just the intro. (e.g., using "signal density" for pattern resolution).

  9.  **Final Review against Prompt:**
      *   Procedure in order? Yes.
      *   Sufficient answers defined? Yes.
      *   Flat no vs. Human handoff? Yes.
      *   Three cases run? Yes.
      *   One answer product team hates? Yes (Case 2).
      *   Explicit judgment calls? Yes.
      *   Closing limitations? Yes.

