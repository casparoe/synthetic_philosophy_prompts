      *   *Candidate 3: Accuracy vs. Understanding.* (Addressing User Interest 2). Can EUT model understanding?
      *   *Candidate 4: Dynamic Epistemology beyond Conditionalization.* (Planning, intervention, inquiry).
      *   *Candidate 5: The Connection to Action.* (Pragmatic encroachment, decision theory links).

  5.  **Selecting and Ranking the Top 3:**
      *   *Priority 1: The Aggregation/Measurement Foundation.* (Why? It's upstream. If the math of aggregation is arbitrary, the whole program rests on stipulation. It addresses the "smuggling" concern directly.)
      *   *Priority 2: Expanding the Ontology of Epistemic Value.* (Why? It addresses the "swamping/non-accuracy goods" concern. If AFE can't handle understanding, it's not a *general* epistemology. It's high risk/high reward.)
      *   *Priority 3: The Dynamics of Inquiry (Question-Relative Accuracy).* (Why? Standard EUT is static or just conditionalization. Real epistemology involves choosing *what* to investigate. This bridges accuracy and pragmatic concerns without pragmatic encroachment.)

      *Wait, I need to check the "Upstream" criteria.*
      *   Aggregation is definitely upstream.
      *   Non-accuracy goods is foundational (challenges the "First").
      *   Dynamics is more applied but necessary for completeness.

      *Let's refine Priority 2.* Instead of just "Understanding," make it "The Structure of Epistemic Value." Can we derive other goods from accuracy, or do we need a pluralist EUT?
      *Let's refine Priority 3.* Focus on "Epistemic Planning/Inquiry." When should I stop gathering evidence? This connects to the "cost" of accuracy which standard EUT ignores.

  6.  **Developing the Reasoning for Each:**

      *   **Topic 1: The Aggregation Axiom (The "Hidden Normativity" Problem).**
          *   *Reasoning:* Standard EUT sums accuracy across propositions. Why additive? Why not max? Why not weighted? This determines whether we value "getting the big things right" vs. "getting many small things right." This is exactly the "smuggling" concern.
          *   *Upstream:* High. Settles how we treat logical omniscience, how we treat imprecise credences, and potentially permissivism.
          *   *Tractability:* Medium-Hard. Requires formal work + philosophical argument.
          *   *Status:* Neglected. Everyone assumes additivity.

      *   **Topic 2: Deriving Non-Accuracy Goods (The "Swamping" Problem).**
          *   *Reasoning:* If accuracy is the *only* good, understanding is just a cluster of accurate credences. But intuition says understanding is more (coherence, grasping relations). Can EUT model "grasping"? If not, is AFE false or incomplete?
          *   *Upstream:* High. Determines if AFE is a total theory of epistemology or just a theory of belief.
          *   *Tractability:* Hard. Conceptual analysis + formal modeling.
          *   *Status:* Neglected/ Emerging. (Carr, Kvanvig, etc., touch on it, but not deep EUT integration).

      *   **Topic 3: The Ethics of Inquiry (Stopping Rules & Question-Relative Accuracy).**
          *   *Reasoning:* EUT tells you how to update, not when to stop thinking or what to investigate. To solve this, you need to value accuracy *relative to a question*. This forces a confrontation with pragmatic costs without admitting pragmatic encroachment.
          *   *Upstream:* Medium. Connects to decision theory and epistemology of inquiry.
          *   *Tractability:* Medium.
          *   *Status:* Overworked in decision theory, neglected in pure EUT.

