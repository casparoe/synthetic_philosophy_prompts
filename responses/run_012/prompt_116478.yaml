answer: |-
  You have correctly identified that two distinct principles are fighting in your head. Your scientific training emphasizes **Epistemic Validity** (randomization removes bias in measurement), while your political intuition emphasizes **Normative Fairness** (randomization ensures equal treatment) and **Competence** (some tasks require skill).

  Here is the precise framework that organizes your verdicts, the conflict you must resolve, and the verdict you must discard.

  ### The Two Principles

  **Principle 1: The Epistemic/Representative Principle**
  *Use a lottery when the goal is to obtain an unbiased sample of a population for the purpose of judgment or measurement.*
  *   **Rationale:** Just as you randomize samples to characterize a catalyst bed, you randomize citizens to characterize "the public" or "the truth" without selection bias.
  *   **Supports:** Jury (sample of community conscience), Citizens' Assembly (sample of public values), Tax Audit (sample of compliance rates).

  **Principle 2: The Competence/Accountability Principle**
  *Do not use a lottery when the task requires specialized technical verification or continuous executive power that demands accountability.*
  *   **Rationale:** Some variables cannot be averaged out by a sample; they require controlled conditions (expertise). Furthermore, power without a mechanism for removal (election) creates systemic risk.
  *   **Supports:** Drug Approval (technical verification), Bridge Safety (technical verification), Law Drafting (technical skill), Legislature (continuous power without recall).

  **Principle 3: The Allocative Fairness Principle**
  *Use a lottery when distributing indivisible burdens or benefits among claimants who are morally equal.*
  *   **Rationale:** When merit or need cannot distinguish between claimants, chance is the only neutral arbiter.
  *   **Supports:** Draft, Organ Transplant, School Slot, Job Tie-Break.

  ### The Conflict and the Sacrifice

  Your unease with the **Legislature** is resolved by distinguishing *Judgment* from *Power*. A Citizens' Assembly exercises **Judgment** (recommending values), which fits Principle 1. A Legislature exercises **Power** (binding execution), which triggers Principle 2 (Accountability). You can keep both verdicts if you accept that sortition is for *advisory judgment* but not *executive authority*.

  However, your verdict on the **Tax Audit** is inconsistent with your career and Principle 1.
  *   **Your Verdict:** "Wrong. It should track suspicion, not chance."
  *   **The Conflict:** In your lab, if you only measured "suspicious" batches, your data on process stability would be biased. You would not know the true error rate of the system. Random audits are the *only* way to measure the "tax gap" (systemic compliance) without bias. Targeted audits are for enforcement; random audits are for inference.
  *   **The Sacrifice:** You must accept that a **random lottery for a subset of tax audits is correct** for systemic measurement, even if targeted audits are better for catching specific criminals. Your gut reaction here privileges individual liberty over statistical truth, which contradicts your professional instinct to "randomize to kill bias."

  Additionally, your verdict on **Judge Assignment** is vulnerable. While judges need competence (Principle 2), the *assignment* of a judge to a case is administrative. Random assignment prevents "forum shopping" (bias). If the Jury (fact-finder) can be random to prevent bias, the Judge (law-applier) can be random to prevent corruption. I recommend you reconsider this, but the Tax Audit is the stronger contradiction.

  ### Predictions for New Cases

  Here is how these principles apply to two hard cases I have selected:

  **Case 1: Selecting members of a Central Bank Interest Rate Committee.**
  *   **Analysis:** This requires high technical expertise (Principle 2) and involves continuous executive power (Principle 2). It is not a value judgment (Principle 1) nor a scarce good allocation (Principle 3).
  *   **Prediction:** **Wrong.** A lottery here would be disastrous. Expertise and accountability are paramount.

  **Case 2: Selecting which neighborhood receives a new public park when the budget allows only one.**
  *   **Analysis:** All neighborhoods are morally equal claimants (Principle 3). No technical expertise is needed to pick the *location* once criteria are met.
  *   **Prediction:** **Fine.** A lottery is the fairest method to resolve the scarcity among equals.

  ### Confidence Assessment

  **Confidence:** 85%
  I am highly confident that the Epistemic vs. Competence distinction maps your intuitions. The framework holds for 12 of your 13 cases immediately.

  **Least Sure Point:** The boundary between the **Citizens' Assembly** and the **Legislature**.
  I am least sure about where to draw the line between "advisory judgment" and "binding power." If an Assembly's recommendation is automatically enacted (binding), does it become a Legislature in your eyes? Your unease suggests yes, but political theorists argue that if the scope is limited (single issue), sortition remains valid even with binding power. This is the fuzziest variable in the package.

  ### Final Principle

  \answer{Use lotteries to ensure unbiased judgment and fair allocation among equals, but never for tasks requiring technical verification or unaccountable executive power.}
