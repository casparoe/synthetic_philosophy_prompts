answer: |-
  This is a brilliant instinct. You've identified one of the most counter-intuitive lessons in decision theory: **a strategy can be admissible (never the worst) yet inadmissible (never the best) because it is dominated by a mixture.**

  Most people intuitively understand "don't pick the option that loses." Very few understand "don't pick the option that's safe, if a randomized portfolio beats it."

  Here is a design for your night. It is built to be run in 90 minutes with minimal math on the table, maximum friction in the play, and a debrief that lets them discover the theorem themselves.

  ### Game Title: "The Middle Trap"

  **Players:** 8 people (4 pairs).
  **Time:** 90 Minutes.
  **Stakes:** Points converted to sweets/prizes at the end. (e.g., Top 2 pairs get a chocolate bar each).
  **Materials:**
  *   4 printed score sheets.
  *   Decks of cards for each player:
      *   **Investors (Row):** 3 cards labeled **TOP**, **MIDDLE**, **BOTTOM**.
      *   **Markets (Column):** 2 cards labeled **LEFT**, **RIGHT**.
  *   Tokens (poker chips, dried beans, anything) for scoring.

  ---

  ### 1. The Payoff Sheet (Keep this hidden initially)
  Give each pair a "Contract Sheet." It shows the Investor's payouts only. The Market player gets a separate sheet showing *their* payout is the negative of the Investor's (Zero-Sum). This makes the Market player adversarial without needing complex incentives.

  **Investor Payoffs (Points):**
  | | Market: LEFT | Market: RIGHT |
  | :--- | :---: | :---: |
  | **Investor: TOP** | 30 | 0 |
  | **Investor: MIDDLE** | 14 | 14 |
  | **Investor: BOTTOM** | 0 | 30 |

  **Market Payoffs:** You lose whatever the Investor wins. (If Investor gets 30, you get -30).
  *Note: We multiply your 3/1.4/0 by 10 to avoid decimal tokens.*

  ---

  ### 2. The Rules of Play

  **Phase 1: The Intuition (20 Minutes)**
  *   **Setup:** Pairs sit opposite. One is Investor, one is Market.
  *   **Action:** Simultaneous play. Both choose a card, place face down, reveal, score, repeat.
  *   **Rounds:** 10 Rounds.
  *   **Constraint:** No talking. No showing cards until revealed.
  *   **The Trap:** Most Investors will quickly realize TOP and BOTTOM are volatile. MIDDLE guarantees 14 points. In a short 10-round game, 140 points feels safer than gambling on 30s.
  *   **The Market's Role:** Because it's zero-sum, the Market player wants to minimize Investor points. If they notice the Investor playing MIDDLE, they don't care (14 either way). If they notice the Investor playing TOP, they play RIGHT (0 points for Investor). *This punishes purity.*

  **Phase 2: The Portfolio (20 Minutes)**
  *   **Swap:** Investors become Market, Market become Investors.
  *   **New Rule:** "The Long Term Contract."
  *   **Action:** The Investor must now submit a **stack of 10 cards face-down** at the start of the phase. (e.g., 5 TOP, 5 BOTTOM). They cannot change this during the 10 rounds.
  *   **Market Play:** The Market player still plays one card per round, seeing the result of the previous round before playing the next.
  *   **Why:** This forces the Mixed Strategy. It physically prevents the Investor from reacting, forcing them to commit to the *distribution*.
  *   **Math:** A 5/5 split of TOP/BOTTOM guarantees an *expected* 15 points per round regardless of what Market does. (0.5 * 30 + 0.5 * 0 = 15).
  *   **Comparison:** 15 (Mix) > 14 (Middle).

  **Phase 3: The Purge (15 Minutes)**
  *   **Rule Change:** "Regulatory Ban."
  *   **Action:** Announce that **MIDDLE is now illegal.** (Collect all MIDDLE cards).
  *   **Play:** 10 Rounds, standard simultaneous play (TOP/BOTTOM vs LEFT/RIGHT).
  *   **Why:** This simulates the "Iterated Deletion." Once they realize Middle is dominated, remove it. Now they are left with a pure Matching Pennies game (TOP/BOTTOM vs LEFT/RIGHT).
  *   **Result:** They will realize that without MIDDLE, *predictability* is death. If they play TOP twice in a row, Market will crush them. They must randomize again to survive.

  ---

  ### 3. The Debrief (35 Minutes)
  *Do not lecture. Ask questions. Write their answers on a whiteboard/paper.*

  **Step 1: The Safety Illusion**
  *   "In Phase 1, who played MIDDLE more than 5 times?" (Hands will go up).
  *   "How did it feel when you played MIDDLE?" (Answers: Safe, steady, boring, reliable).
  *   "How did it feel when you played TOP/BOTTOM?" (Answers: Nervous, risky, hopeful).
  *   "Look at the scores. Who scored higher? The Middle players or the Top/Bottom mixers?"
  *   *Reveal the math:* Write the expected value on the board.
      *   Middle = 14.
      *   50/50 Mix = 15.
  *   "Middle was never the worst outcome. But it was always the wrong choice. Why?"
  *   *Target Answer:* "Because the average of the risky ones was higher than the safe one."

  **Step 2: The Randomization Insight**
  *   "In Phase 2, when you had to commit to a stack of cards, did anyone try to put MIDDLE cards in the stack?"
  *   "If you put a MIDDLE card in the stack, you lowered your average score. You literally paid to feel safe."
  *   **The Point:** "Safety has a price. Sometimes the price is higher than the risk."

  **Step 3: The Iteration (Phase 3)**
  *   "When I took Middle away, what happened?"
  *   "Did anyone try to just play TOP every time?" (Let them admit they got crushed).
  *   "So Middle was 'safe but dead.' Once we killed it, what became the new danger?"
  *   *Target Answer:* "Predictability."
  *   **The Point:** "First we delete strategies that lose. Then we delete strategies that are predictable. Being 'the safe option' isn't enough. You have to be 'the best response.'"

  ---

  ### 4. Predictable Failures (And how to handle them)

  **Failure 1: "I'd just play Top and hope."**
  *   **What happens:** A player ignores the risk and spams TOP. The Market player (incentivized by zero-sum) will spam RIGHT. The Investor scores 0.
  *   **Your Move:** Do not correct them during play. Let them score 0. In the debrief, ask: "You played Top 10 times. What did the Market do?" "They played Right." "Why?" "To stop me." "So your strategy created its own counter-strategy. Middle didn't do that."

  **Failure 2: Risk Aversion (The Real Enemy)**
  *   **What happens:** A player says, "14 points for sure is better than 15 points on average because I might get 0."
  *   **The Truth:** They are right, *in utility*. This is the limitation of the game.
  *   **Your Move:** Acknowledge it. "In this game, 1 point = 1 sweet. You are risk-neutral. In real life, losing everything hurts more than winning feels good. If 0 points means you go home hungry, Middle is rational. But if you play this game 1,000 times, Middle makes you poorer. The lesson is about *repeatable decisions*, not one-off survival."

  **Failure 3: Collusion**
  *   **What happens:** Investor and Market agree to play TOP/LEFT every time to maximize joint points.
  *   **Your Move:** This breaks the Zero-Sum incentive.
  *   **Prevention:** Tell them at the start: "This is a competitive league. I'm tracking total scores across all tables. If you collude, you aren't beating your opponent, you're lowering your rank on the leaderboard."

  ---

  ### 5. What This Can't Show (Be Straight With Them)

  You asked for honesty about limitations. Put this on the table at the end.

  1.  **Risk Neutrality:** As mentioned, this game assumes 15 expected points is strictly better than 14 guaranteed. In real life (career choices, investments), variance matters. The game proves Middle is *mathematically* dominated, not necessarily *psychologically* dominated.
  2.  **The "Next" Deletion:** You mentioned wanting the deletion to keep going ("something else becomes the new safe-but-dead"). In this specific 3x2 matrix, once Middle is gone, there is no *third* option to delete. You are left with TOP and BOTTOM. Neither dominates the other. The "next thing to die" isn't a strategy, it's **purity**. The lesson shifts from "Delete Bad Options" to "You Must Randomize." That is a profound shift, but it's different from iterated deletion of pure strategies.
  3.  **Coin Flips vs. Payoffs:** You suspected the coin flip does the work. You are correct. The payoffs (30 vs 14) just set the threshold. If Middle paid 16, the mix wouldn't dominate it. The insight isn't about the numbers 3 or 0; it's about the *convexity* of the payoff space. The "Mix" creates a new line on the graph that sits higher than the Middle point.

  ### Facilitator Cheat Sheet (The "Aha" Moment)

  When they ask, "Why is Middle bad if I never lose big?"
  Draw this on a napkin:

  ```
        | Col L | Col R |  AVERAGE
  ------|-------|-------|----------
  TOP   |  30   |   0   |    15
  MID   |  14   |  14   |    14  <-- DOMINATED
  BOT   |   0   |  30   |    15
  ```

  Say: "Middle is a single point. Top and Bottom are the ends of a seesaw. If you sit in the middle of the seesaw (the mix), you hover *above* the Middle option. You aren't choosing Top or Bottom. You are choosing the *average* of them. And the average is higher than the safe bet."

  ### Final Tip
  Print the payoff matrices on cards they can hold. Don't put them on a wall. Keep the information private. The friction of not knowing what the other person sees is where the anxiety (and the learning) lives.

  Good luck. This is a great thing to teach friends. It changes how people look at "safe choices" forever.
