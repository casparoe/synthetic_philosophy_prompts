answer: |-
  Your intuitions are sophisticated and consistent with a specific, albeit disjunctive, metaphysical stance. You are not a **nihilist** (you believe some composites exist), nor a **universalist** (you believe not all composites exist), nor a **monist** about composition (you treat organisms, artifacts, and materials differently).

  The tensions you identified (Man o' War vs. Swarm, Lego vs. Sand) are not errors in your thinking but boundary conditions that reveal the structure of your ontology. Based on your verdicts, I propose the following principle.

  ### The Principle of Non-Accidental Unity

  **Statement:**
  Several things compose a further thing if and only if they are united by a **single system of persistence conditions** arising from one of three sources:
  1.  **Physiological Interdependence** (Biological Unity)
  2.  **Intentional Functional Arrangement** (Artifactual Unity)
  3.  **Continuous Material Cohesion** (Substantial Unity)

  Where "single system of persistence conditions" means that the parts cannot persist *as the kinds of things they are* independently of the whole, or their arrangement is maintained against entropy by a specific cause (life, mind, or chemical bond) rather than accidental contact.

  ---

  ### Clause 1: Physiological Interdependence
  **Precise Formulation:** Parts compose a whole if they are metabolically or physiologically dependent on one another such that separation results in the death or functional cessation of the parts *as components*.
  **Motivating Verdicts:**
  *   **Dog:** Cells/organs cannot survive apart; the tail is part of the regulatory system.
  *   **Portuguese Man o' War:** Zooids are specialized to the point of organ-like dependency; none survive alone.
  *   **Lichen:** Fungus and alga exchange metabolites to form a thallus neither could sustain alone.
  *   **Chimera:** Two embryos fuse into a single developmental trajectory.
  *   **Bee Swarm (Negative):** Bees are independent organisms; coordination is behavioral, not physiological. Separation does not kill the bee.
  *   **Biofilm/Forest (Negative):** Organisms coexist and cooperate but retain independent metabolic cycles.

  ### Clause 2: Intentional Functional Arrangement
  **Precise Formulation:** Parts compose a whole if they are arranged by an agent to serve a specific function, and that arrangement confers a status on the parts that they lack in isolation.
  **Motivating Verdicts:**
  *   **Car:** Parts (engine, tire) are defined by their role in the vehicle.
  *   **Lego Model:** Bricks are clipped according to a design; the "model" is a functional/representational unit.
  *   **Mortared Wall:** Bricks are arranged by intent and fixed to serve a structural end.
  *   **Tower + Shoe (Negative):** No unifying function or design connects them; their proximity is accidental.
  *   **Loose Sand/Loose Lego (Negative):** No unifying design governs the specific arrangement; gravity or storage dictates the position.

  ### Clause 3: Continuous Material Cohesion
  **Precise Formulation:** Parts compose a whole if they are bonded at the molecular or crystalline level into a continuous mass where boundaries between parts are obliterated.
  **Motivating Verdicts:**
  *   **Sandstone:** Sand grains are cemented into a continuous rock.
  *   **Statue/Lump:** The bronze is continuous; the "statue" is a shape imposed on the continuous mass (supporting your view that they are one object described twice).
  *   **Loose Sand/Bricks Side-by-Side (Negative):** Contact is macroscopic, not molecular; boundaries remain distinct.
  *   **Cloud (Negative):** Vapor droplets are not bonded; they are a suspension.

  ---

  ### Application to New Cases

  Here is how the Principle of Non-Accidental Unity verdicts on the cases you requested:

  1.  **Severed Hand Surgically Reattached:**
      *   **Verdict:** **One Object (Restored).**
      *   **Reasoning:** Clause 1. Once vascular and neural connections are re-established, the hand re-enters the single system of physiological persistence conditions of the body. It is not merely attached; it is integrated.

  2.  **Brain-Dead Body on a Ventilator:**
      *   **Verdict:** **Not One Object (Collection of Tissues).**
      *   **Reasoning:** Clause 1 fails. The central regulatory system (the brain) has ceased. The ventilator provides an *external* artificial function (Clause 2), but the body itself is no longer a self-maintaining biological unity. It is a collection of organs kept viable by an artifact.

  3.  **A Virus:**
      *   **Verdict:** **Not One Object (Complex Molecule).**
      *   **Reasoning:** It fails Clause 1 (no metabolism of its own) and Clause 2 (not made by an agent). It falls under Clause 3 (Material Cohesion), making it a single large macromolecular structure, but not a composite "object" in the same sense as a cell or car. It is a "piece of matter" rather than an "entity."

  4.  **A Prion:**
      *   **Verdict:** **Not One Object.**
      *   **Reasoning:** Similar to the virus. It is a misfolded protein aggregate. While it grows by converting other proteins, this is a chemical cascade (Clause 3), not a unified system of persistence. It is a pathological accumulation, like a crystal growing in a solution.

  5.  **A City:**
      *   **Verdict:** **Not One Object.**
      *   **Reasoning:** It fails Clause 1 (people are independent organisms). It partially fits Clause 2 (infrastructure is designed), but there is no single function or agent that arranges the whole. A city is more like a **Forest** or **Swarm**: a complex system of independent agents and artifacts, but not a unified object.

  6.  **A Corporation:**
      *   **Verdict:** **Not One Object (Abstract Entity).**
      *   **Reasoning:** Your intuitions concern physical composition ("bricks," "sand," "dogs"). A corporation is a legal fiction. Physically, it is people in buildings (like a City). It has functional unity (Clause 2) but lacks physical cohesion. If you require physical composition, it is not an object.

  7.  **The Sorites Heap (Adding one grain):**
      *   **Verdict:** **Vague Objecthood.**
      *   **Reasoning:** This attacks Clause 3. Material cohesion is not binary; friction and electrostatic forces increase gradually. The Principle admits that "object" is a vague predicate here. There is no precise grain where the heap becomes an object. You should accept that **composition is vague** in borderline material cases.

  ---

  ### The Hard Conflicts: What Must Be Sacrificed?

  You asked for an honest account of which verdicts the principle cannot accommodate.

  **1. The *Dictyostelium* (Slime Mold) Problem**
  *   **Your Intuition:** Ambiguous ("I cannot say which side it is on").
  *   **The Principle's Verdict:** **Borderline.**
  *   **Analysis:** In the slug stage, the amoebae coordinate movement (like a Swarm) but also differentiate into stalk and spore cells, some of which die for the whole (like a Man o' War). They are facultatively multicellular.
  *   **Resolution:** The Principle validates your uncertainty. It is not a failure of the principle that it yields no binary answer here; it is a discovery that nature does not always respect our binary categories. You should **keep your ambiguity**.

  **2. The Statue and the Lump**
  *   **Your Intuition:** "One object described twice."
  *   **The Principle's Verdict:** **Consistent, with a caveat.**
  *   **Analysis:** Clause 3 (Material Cohesion) says the bronze is one object. Clause 2 (Artifact) says the statue is one object. If they occupy the same space and are made of the same matter, the Principle allows you to view them as numerically identical (Constitutionalism).
  *   **Resolution:** No sacrifice needed, provided you accept that "artifact status" does not create a *new* material object, but rather classifies the existing material object.

  **3. The Lego Model vs. The Heap of Sand**
  *   **Your Intuition:** Lego is one object; Sand is not.
  *   **The Principle's Verdict:** **Consistent.**
  *   **Analysis:** This relies entirely on Clause 2 (Intentionality). If you believe the Lego model is an object *only* because a human intended it to be, you must accept that if a child knocks it over, it ceases to be a "model" and becomes a "pile," even if the clips are still engaged.
  *   **Resolution:** You must accept that **artifact objecthood is mind-dependent.** If you find this unsettling (i.e., you think the Lego model remains an object even if no one knows it exists), then Clause 2 needs strengthening to "Functional Arrangement" regardless of intent. But given your rejection of the Tower + Shoe, Intent seems necessary.

  ### The Disjunction: Defect or Discovery?

  You asked: *If the only principle that saves every verdict is an unprincipled disjunction — organisms and artifacts, and nothing else — say so, and say whether that is a defect or a discovery.*

  **It is a Disjunction.**
  My proposed principle is explicitly tripartite (Biology, Artifact, Material). Is this a defect?

  **It is a Discovery.**
  A single, unified principle of composition (such as "Contact" or "Causal Integration") fails to match your intuitions because **human ontology is not unified.** We navigate the world using three different cognitive systems:
  1.  **Biology:** We track living agents (predators, prey, kin).
  2.  **Tools:** We track manipulable objects (cars, walls, legos).
  3.  **Stuff:** We track continuous masses (water, rock, sand).

  To demand a single metaphysical glue that binds a dog, a car, and a rock into "objects" in the exact same way is to demand that human cognition work differently than it does. The disjunction is not a failure of philosophy; it is an accurate map of the conceptual boundaries you are already using.

  **The One Verdict You Should Give Up:**
  If I must press you to change one verdict to make the principle more robust, it is this: **The Statue and the Lump.**
  You say they are "one object described twice." However, your rejection of the **Tower + Shoe** suggests you believe spatial coincidence isn't enough for unity. If the Lump existed *before* the Statue was cast, and the Statue comes into existence *when* it is cast, they have different persistence conditions (the lump survives melting; the statue does not).
  *   **Recommendation:** Adopt the view that the Statue and the Lump are **two distinct objects occupying the same place.** The Lump is a Material Object (Clause 3); the Statue is an Artifactual Object (Clause 2). They coincide but are not identical. This aligns better with your rejection of the Tower + Shoe (which separates objects by function) and saves the Principle from contradictions regarding when an object begins and ends.

  ### Summary
  Your intuitions are governed by the **Principle of Non-Accidental Unity**. It requires that parts share a fate determined by Life, Mind, or Chemical Bond. It correctly predicts your uncertainty about the Slime Mold and your distinction between the Man o' War and the Swarm. It reveals that your ontology is disjunctive, which is a feature of human cognition, not a bug. To fully align with this principle, you should reconsider the identity of the Statue and the Lump, treating them as coincident but distinct entities.
