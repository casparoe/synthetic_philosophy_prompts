      *   *Difference Principle:* Inequalities are only permitted if they benefit the least advantaged. It's not "trickle-down" (which hopes for benefit); it's a strict condition (must demonstrate benefit).
      *   *Translation risks:* Rawls talks about "primary goods" and "basic structure." A shop isn't a society. Applying it directly might be category error. But the *spirit* (maximin strategy) is usable.
      *   *What to keep:* The focus on the worst-off position. The requirement that inequality serves them *specifically*, not just generally. The idea that you don't know who you will be in the system.
      *   *What to drop:* The complex mathematical utility curves, the "original position" metaphysics, the distinction between moral desert and entitlement (too abstract for a 2-hour meeting).

  3.  **Develop the Decision Procedure:**
      *   Needs to be actionable.
      *   Step 1: Identify the Least Advantaged. (Crucial step requested).
