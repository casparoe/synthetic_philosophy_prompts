      *   *Honest verdict:* Strictly speaking, Rawls doesn't cover this.
      *   *Practical pivot:* However, worker co-ops *act* like mini-polities. The *logic* applies even if the *jurisdiction* doesn't. I need to be clear about this distinction so the user doesn't claim "Rawls says..." incorrectly, but can use the *framework*.

