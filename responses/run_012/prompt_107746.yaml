answer: |-
  ### Evaluation of Simplifications

  **1. Single Value of Time**
  (a) **Score:** 0.4
  (b) **Rank:** 4
  (c) **Justification:** While Friedman allows aggregation, cordon charges work on the margin; if the marginal traveller's value of time differs significantly from the average, the aggregate elasticity will be misestimated.

  **2. Instantaneous Adjustment**
  (a) **Score:** 0.8
  (b) **Rank:** 2
  (c) **Justification:** Policy appraisals require dynamic predictions, and ignoring habit persistence or relocation lags systematically overstates short-run responsiveness and understates long-run land-use effects.

  **3. Hyper-rationality (Full Equilibrium)**
  (a) **Score:** 0.1
  (b) **Rank:** 6
  (c) **Justification:** This is the quintessential "as if" assumption Friedman explicitly defends, arguing that predictive accuracy matters more than the psychological reality of the calculation process.

  **4. Aggregated Network (Nine Corridors)**
  (a) **Score:** 0.6
  (b) **Rank:** 3
  (c) **Justification:** Cordon pricing creates specific spatial distortions and boundary effects that a coarse network cannot capture, risking significant errors in where and how traffic diverts.

  **5. Price Responsiveness Calibrated to Baseline**
  (a) **Score:** 0.9
  (b) **Rank:** 1
  (c) **Justification:** Calibrating price sensitivity to a period without the charge assumes structural stability where none exists (the Lucas Critique), rendering out-of-sample policy predictions statistically invalid.

  **6. Fixed External Factors (Bus, Fuel, etc.)**
  (a) **Score:** 0.2
  (b) **Rank:** 5
  (c) **Justification:** Holding exogenous variables constant is a standard *ceteris paribus* simplification necessary for isolation, provided no feedback loops between the charge and these factors are expected.

  ***

  ### General Criterion for Benign vs. Load-Bearing Unrealism
  The separating criterion is whether the simplification alters the **marginal mechanism of response** to the specific policy shock. Benign unrealisms (like hyper-rationality or *ceteris paribus*) simplify the calculation of the equilibrium without changing the direction or magnitude of the incentive; load-bearing unrealisms (like calibration methods or dynamic lags) structurally determine the elasticity or timing of the reaction, directly threatening predictive validity.

  ### Friedman-Style Defence Assessment
  *   **Most Convincing:** Simplification **#3 (Hyper-rationality)**. Friedman's methodology is built precisely on this point: agents need not actually solve equilibrium problems, they need only behave *as if* they do for the aggregate prediction to hold.
  *   **Least Convincing:** Simplification **#5 (Calibration to Baseline)**. Friedman demands predictive performance in *new* situations; tuning parameters to fit historical data without a price signal guarantees overfitting, which Friedman would recognize as a failure of instrumental validity rather than a permissible simplification.
