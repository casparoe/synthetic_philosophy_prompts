answer: |-
  The distinction you have intuited is one of the most significant in political philosophy, yet it is often overlooked in casual discourse. You are describing the difference between **freedom as non-interference** and **freedom as non-domination**.

  The specific label you are looking for is **Republican Liberty** (or Neo-Roman Liberty), defined by the condition of **Non-Domination**.

  While "Negative Liberty" (Isaiah Berlin) defines freedom as the absence of obstacles, and "Positive Liberty" defines it as the capacity for self-mastery, **Non-Domination** defines freedom as the absence of arbitrary power over you. It is not about whether someone *stops* you; it is about whether someone *can* stop you, at their whim, without consequence.

  Here are the edges of this concept, tailored to your questions and your characters.

  ### 1. The Kind Master (The Problem of Arbitrariness)
  **Question:** *If the man is kind and would never interfere, is she still unfree?*
  **Answer:** **Yes.** This is the defining feature of domination.

  In the framework of Non-Domination (championed by contemporary philosophers like Philip Pettit and historical scholars like Quentin Skinner), the chain is not the act of interference, but the *capacity* for arbitrary interference.

  If the housekeeper behaves well only because she fears the master's temper, she is dominated. But even if she behaves well because the master is kind, she is *still* dominated. Her security exists only at his pleasure. He retains the power to change his mind, to revoke her privileges, or to punish her without recourse. She lives in a state of dependency.

  **For your novel:** This creates a profound psychological tension. The housekeeper may feel gratitude toward a kind master, but the reader (and the philosophy) sees that her gratitude is a survival mechanism. She must monitor his mood not because he is cruel, but because his power is absolute. Her "choice" to stay late or leave early is not a right; it is a privilege granted by his silence.

  ### 2. Law vs. Custom (The Source of Power)
  **Question:** *If the power belongs to no person but to a custom nobody enforces, does it still count?*
  **Answer:** **Yes.**

  Domination does not require a statute. It requires a social relationship of dependency where one party has the power to interfere arbitrarily in the choices of another.

  *   **The Soldier's Wife:** The law restricts her, but because she has a voice in the assembly, the law is (theoretically) **non-arbitrary**. It tracks her interests. She is restricted, but she is not dominated by the state, because she is a co-author of the rules.
  *   **The Housekeeper:** Custom restricts her. Even if no law says she must not contradict the master, the social structure gives him the power to fire her, ruin her reputation, or cast her out. That power is arbitrary because she has no recourse and no voice in the "rules" of the household.

  **For your novel:** This allows you to explore invisible cages. The housekeeper's unfreedom is atmospheric. It is in the air she breathes. She polices herself because the custom is internalized. This is often more compelling fiction than a locked door, because the conflict is between her will and the invisible weight of the room.

  ### 3. Feeling Unfree (Subjective vs. Objective Status)
  **Question:** *If she does not feel it, does that matter?*
  **Answer:** **No.**

  In the theory of Non-Domination, freedom is a **status**, not a feeling. A slave who is happy, well-fed, and rarely beaten is still a slave. A housekeeper who loves her master and feels no burden is still dominated.

  This is crucial for character work. If she does not feel unfree, she may be suffering from **adaptive preference** (a concept from feminist philosophy, notably Martha Nussbaum and Amartya Sen). This is when a person adjusts their desires to match their possibilities to avoid the pain of wanting what they cannot have.

  **For your novel:** You have a choice here.
  *   **Tragic Irony:** She believes she is free, but the reader sees the strings. This creates pathos.
  *   **Awakening:** She begins to feel the weight of the custom only when she sees the soldier's wife (who is restricted but has status).
  *   **Complicity:** She recognizes her domination but accepts it as the price of safety.

  ### 4. Is this one thing, or several?
  You are not conflating several things; you have isolated a single, coherent structural relationship. However, it helps to view it through three lenses:

  1.  **Dependency:** The housekeeper relies on the master for her livelihood and housing. The soldier's wife relies on the state, but the state relies on her vote. The dependency is mutual in the second case, unilateral in the first.
  2.  **Arbitrariness:** The master's power is unchecked. The law's power is (ideally) checked by the assembly.
  3.  **Social Status:** This is the Hannah Arendt angle. Arendt distinguished between the *Oikos* (the household, the realm of necessity and management) and the *Polis* (the public realm, the realm of freedom and action).
      *   The Housekeeper is trapped in the *Oikos*. Even if she is the manager, she is dealing with necessity and the temper of the head of house.
      *   The Soldier's Wife enters the *Polis*. Even if she is restricted, she is recognized as a citizen capable of speech and judgment.

  ### Summary for the Writer
  The word you want is **Domination**.

  *   **Negative Liberty** asks: "How many doors are open?" (The Housekeeper has many open doors).
  *   **Positive Liberty** asks: "Am I master of myself?" (A psychological question).
  *   **Republican Liberty (Non-Domination)** asks: "Does anyone hold the keys to these doors arbitrarily?" (The Housekeeper is unfree because the master holds the keys, even if he leaves them in the lock).

  **Why this matters for your ending:**
  If the housekeeper leaves the house, she gains Negative Liberty (no one stops her), but if she has no money or status, she may fall under the domination of poverty or a new master. If the soldier's wife loses her vote, she loses her status as a non-dominated person, even if her husband remains kind.

  The tragedy of the housekeeper is not that she is stopped; it is that she must **curry favor**. She must constantly read the room, manage the ego, and suppress her voice to maintain her position. That is the essence of unfreedom as domination: the necessity of being a supplicant. The soldier's wife may be restricted, but she stands upright before the law. The housekeeper must bow before the man, even when he is not looking.
