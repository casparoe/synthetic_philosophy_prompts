          *   Character B (Soldier's Wife): Legal restrictions on residence/money/travel, *but* has political voice (vote/assembly).
          *   **Intuition:** The user feels Character A is *less free* than Character B, despite having fewer overt obstacles.
      *   **The Question:** What is the name of this specific type of unfreedom? It's not just "negative liberty" (no obstacles) or "positive liberty" (self-mastery/governing). It's about being "at another's mercy."
      *   **Specific Nuances to Address:**
          *   Does it matter if the master is kind/non-interfering?
          *   Does it matter if the power is custom vs. law?
          *   Does it matter if the subject feels unfree?
