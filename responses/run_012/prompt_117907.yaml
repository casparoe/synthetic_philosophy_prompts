prompt: |-
  I am a catastrophe-risk analyst at a mid-sized reinsurer, and I am the person who signs off on the "event rate" — the annual probability of a loss-causing event — that goes into our pricing and into the risk report our board reads every month. We work from a vendor's catastrophe model, and for fifteen years our house rule, left behind by a chief underwriter who had read a little philosophy at university, has been painted on the wall of the modelling room: defer to the model's event rates except where the countervailing evidence is inadmissible. Nobody can tell me what that means in practice. Some of my colleagues take the model output as the answer and stop thinking; others quietly shade it toward whatever the last few storm seasons felt like, and neither group can say why what they did was defensible. I have been asked to write the team a decision procedure for when we may depart from a chance estimate, and I want it to rest on what the philosophy of probability actually says about deference to objective chance — the claim, as I understand it, that if you know the objective chance of an event is x, then your own credence in it should be x, at least when your evidence is of the right kind. I believe this is called the Principal Principle, and I suspect that "of the right kind" is doing all of the work.

  Please write that procedure. It has to be something an analyst with no philosophy and an hour per account can actually run: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops and says that the estimate governs, where it says that we may not defer, and a short justification of each step, including the parts of the theory that make this harder than it looks. In particular it must cope with the fact that the vendor's number is an estimate of a chance rather than a chance itself; with the possibility that some of my evidence bears on the event rather than on the conditions that make it likely; with the fact that the reference class the model used is not always the class our exposure falls in; with the climatologists' insistence that the baseline chance is itself drifting over the horizon we price; and with the awkward case where a model assigns an event a probability near zero and the event happens anyway. Then run it on three live problems: our own twenty years of claims data suggesting that the model's landfall frequency for one coastal county is roughly forty per cent too low; a seasonal forecast that would have me raising next quarter's rates even though the model has not moved; and a low-frequency, high-severity product where the model gives a one-in-ten-thousand annual rate and we have booked two such losses in five years.

  I am asking partly in order to settle an argument, so I would rather have the uncomfortable answer than a diplomatic one: tell me plainly where the procedure returns something I will not like, and where it cannot decide and has to hand the question back to a person. I also need one paragraph on the step where a settled credence becomes a price, since a small error in a rare-event rate costs us more than a large one in a common rate, and I do not want the procedure to pretend that the two questions are the same. I have to circulate this to the modelling team and to the chief underwriter, who signs off on it, before Thursday's meeting, so keep it to a document they will actually read, and mark clearly which steps are procedure and which are judgment wearing procedure's clothes.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Catastrophe-risk analyst at a mid-sized reinsurer.
      *   **Task:** Write a decision procedure for when to depart from a vendor catastrophe model's "event rate" (annual probability of loss).
      *   **Context:** Current house rule is vague ("defer... except where countervailing evidence is inadmissible"). Colleagues either blindly follow the model or intuitively shade it.
      *   **Philosophical Basis:** Lewis's Principal Principle (PP) – defer to objective chance *if* evidence is "admissible."
      *   **Constraints:**
          *   Must be usable by an analyst with no philosophy training in ~1 hour per account.
          *   Must address specific complexities: model estimate vs. true chance, direct vs. indirect evidence, reference class mismatch, non-stationarity (climate change), and zero-probability events occurring.
          *   Must include three specific case studies (live problems).
          *   Must include a paragraph on converting credence to price (risk loading/utility).
          *   Must be honest/uncomfortable (not diplomatic), marking where judgment overrides procedure.
          *   Format: A document suitable for circulation to the modelling team and Chief Underwriter before Thursday.
          *   Length: Concise enough to be read.

  2.  **Deconstruct the Philosophy (The Principal Principle):**
      *   *The Principle:* $C(A | Ch(A)=x \land E) = x$, where $C$ is credence, $Ch$ is objective chance, and $E$ is admissible evidence.
      *   *The Catch:* "Admissible evidence." Roughly, evidence that doesn't give information about the *outcome* other than through the *chance*. Historical data about the *process* is usually admissible. Information about the *specific outcome* (e.g., "the coin landed heads") is inadmissible.
      *   *Application to Cat Models:* The model output ($M$) is *not* the objective chance ($Ch$). It's an estimate of the chance. So we need a "Model Deference Principle": Defer to $M$ unless we have evidence that $M$ is biased or the underlying physics/climatology has changed.
      *   *Admissibility in this context:*
          *   Admissible: Data on the *process* (wind speeds, pressure, SST), long-term climate trends, model validation errors.
          *   Inadmissible (for updating the *rate*): Specific knowledge of *this year's* outcome (crystal ball), or short-term noise mistaken for signal (recency bias).
          *   *Crucial Distinction:* Is the evidence about the *chance* (admissible) or the *outcome* given the chance (inadmissible)? In reinsurance, "outcome" evidence usually looks like recent loss experience. If the process is stationary, recent losses update the chance estimate. If non-stationary, they might signal a drift.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* A flowchart-like text.
      *   *Step 1: Define the Object.* Is the model number a chance or an estimate? It's an estimate. So we are deferring to the *process* that generated the estimate, not the number itself.
      *   *Step 2: Admissibility Check.* Is the new evidence about the physical likelihood (admissible) or just the realization (inadmissible)?
      *   *Step 3: Reference Class.* Does the exposure match the model's bucket?
      *   *Step 4: Stationarity.* Is the climate drifting?
      *   *Step 5: The Zero-Event Problem.* How to handle impossibility proofs.

      *Refining for the "1 Hour/No Philosophy" Constraint:* I can't use terms like "admissible evidence" without defining them operationally. I need to translate "admissible" into "Does this change the physics or just the luck?"

      *Refining the "Uncomfortable Truths":*
      *   Truth 1: The model is never the "Objective Chance." It's a simulation.
      *   Truth 2: Recent loss experience (2 losses in 5 years) is statistically weak but psychologically strong. The procedure must force the analyst to admit if they are overriding based on *fear* vs. *data*.
      *   Truth 3: Pricing $\neq$ Probability. Risk loading matters more for tail risk.

  4.  **Developing the Case Studies:**
      *   *Case 1 (20 years data, model 40% low):* This is a validation issue. If the data is credible, the model is biased. Procedure should say: Override.
      *   *Case 2 (Seasonal forecast, model static):* Seasonal forecasts are probabilistic views on the *current year's conditions* (El Niño, etc.). This is admissible evidence about the *current* chance, distinct from the long-term average. Procedure should say: Adjust, but cap the deviation based on forecast skill.
      *   *Case 3 (1 in 10k rate, 2 losses in 5 years):* This is the "Black Swan" or "Model Failure" case. Statistically, 2 in 5 implies a rate of 0.4, not 0.0001. The model is catastrophically wrong. Procedure must say: Do not use the model rate. But acknowledge the uncertainty.

  5.  **Drafting the Content - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Introduction:** Acknowledge the "House Rule" and the need for operationalizing "Admissible Evidence."
      *   **The Core Concept:** Translate Lewis's PP into "Process vs. Outcome."
      *   **The Procedure (The Algorithm):** Numbered steps with Stop/Go conditions.
      *   **The "Judgment" Flags:** Explicitly mark where human intuition is unavoidable.
      *   **The Pricing Paragraph:** Distinct section on Probability vs. Price.
      *   **The Case Studies:** Apply the algorithm strictly.
      *   **Conclusion:** Warning about limitations.

  6.  **Refining the Tone:**
      *   Professional, direct, slightly austere.
      *   No fluff.
      *   Acknowledge the tension between quantitative rigor and business reality.
      *   *Self-Correction on Philosophy:* Ensure I don't misrepresent Lewis. The PP applies to *objective chance*. Cat models provide *subjective probabilities* based on physics. So the procedure is actually about *when to trust the model's representation of the physics*. I need to make sure the user understands the model is a proxy for Chance, not Chance itself.

  7.  **Addressing Specific Constraints:**
      *   *Model Estimate vs. Chance:* Addressed in Step 1.
      *   *Evidence on Event vs. Conditions:* Addressed in Step 2 (Process vs. Realization).
      *   *Reference Class:* Addressed in Step 3.
      *   *Drifting Baseline:* Addressed in Step 4.
      *   *Zero Probability:* Addressed in Step 5.
      *   *Pricing vs. Credence:* Dedicated section.
      *   *Marking Judgment:* Use bold brackets like **[JUDGMENT CALL]**.

  8.  **Final Review against the Prompt:**
      *   Did I answer the "inadmissible evidence" riddle? Yes, by defining it as evidence about the outcome that isn't mediated by the chance.
      *   Is it usable in an hour? Yes, it's a checklist.
      *   Are the three cases run? Yes.
      *   Is the pricing paragraph included? Yes.
      *   Is it honest/uncomfortable? Yes, specifically in Case 3 and the Pricing section.

  9.  **Final Polish:** Check the "Thursday meeting" urgency. Keep it tight. Ensure the distinction between *Credence* (belief in probability) and *Price* (monetary value) is sharp. (Self-correction: Make sure to emphasize that in Case 3, the model is effectively broken, not just "off".)

  *(Self-Correction during drafting)*: I need to be careful with the Principal Principle. Lewis's PP says $C(A|Ch(A)=x) = x$. But we don't know $Ch(A)$. We know $Model(A) = x$. So we are actually using a principle of *Expert Deference*. If the model is an "expert" on the chance, we defer. But if we have evidence the expert is wrong (bias), we don't. I will frame the procedure around "Model Validity" rather than pure metaphysics, but ground it in the PP logic regarding admissibility.

  *Wait, one nuance:* The prompt asks to rest on the philosophy of probability/Principal Principle. I need to make sure I explicitly link the steps to "Admissibility."
  *Admissible:* Information about the *chance setup* (e.g., climate change, model bias).
  *Inadmissible:* Information about the *outcome* that bypasses the chance (e.g., "I feel like a storm is coming" without data, or treating short-term variance as a trend).
  Actually, in a Bayesian context, *all* evidence is admissible for updating credence. The PP is about *initial* credence matching chance. The "inadmissible" part in Lewis's framework is usually future information or direct outcome information. In insurance, "recent losses" are admissible evidence for updating the *estimate of the chance*, unless one assumes the chance is known and fixed. Since the chance is *unknown*, recent losses are admissible for updating the *estimate*.
  *Correction:* The prompt says the house rule is "defer... except where countervailing evidence is inadmissible." This implies the model rate is treated *as if* it were the Objective Chance. Therefore, evidence is "inadmissible" if it shouldn't override the known chance. But since the chance isn't known, the "inadmissible" label really means "statistically insignificant noise" or "outcome bias." I will interpret "inadmissible" operationally as "Evidence that does not bear on the stability or accuracy of the generative process."

  Let's write it.
answer: |-
  **MEMORANDUM**

  **TO:** Modelling Team; Chief Underwriter
  **FROM:** Catastrophe Risk Analysis
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Procedure for Departure from Vendor Event Rates (The "Admissibility Protocol")

  ### 1. Purpose and Philosophical Basis
  Our house rule requires us to defer to the vendor model's event rate unless countervailing evidence is "inadmissible." This memo operationalizes that rule using the **Principal Principle** (Lewis, 1980). The Principle states: *If you know the objective chance of an event is $x$, your credence should be $x$, provided your evidence is admissible.*

  **The Problem:** The vendor model does not give us Objective Chance ($Ch$). It gives us an Estimate of Chance ($Est$).
  **The Solution:** We treat the model as an "expert" on $Ch$. We defer to the expert unless we possess **Admissible Evidence** that the expert is biased, the physical setup has changed, or the exposure falls outside the expert's scope. "Inadmissible" evidence is defined here as short-term noise mistaken for signal, or outcome knowledge that does not reflect a change in the underlying physics.

  ### 2. The Decision Procedure
  *Time allowance: 60 minutes per account/zone. If a step triggers a **[JUDGMENT CALL]**, document the rationale in the underwriting file.*

  **Step 1: The Identity Check (Model vs. Chance)**
  *   **Question:** Is the evidence suggesting the *model code* is wrong, or that the *world* has changed?
  *   **Procedure:** If the evidence indicates a coding error, bug, or known vendor bias (e.g., validation reports showing systematic overestimation in this region), **OVERRIDE**.
  *   **Theory:** The Principal Principle applies to Objective Chance. A buggy model is not a proxy for Chance.
  *   **Stop:** If the model is technically sound, proceed to Step 2.

  **Step 2: The Admissibility Filter (Process vs. Outcome)**
  *   **Question:** Does the evidence bear on the *physical likelihood* (process) or merely the *realization* (outcome)?
  *   **Procedure:**
      *   **Admissible (Override allowed):** Data on sea surface temperatures, wind shear, pressure fields, or long-term claims history (>20 years) indicating structural bias.
      *   **Inadmissible (Defer to Model):** "It feels active," recent loss experience (<10 years) without physical corroboration, or recency bias.
      *   **Theory:** Knowing a coin landed heads five times in a row is inadmissible for predicting the sixth toss *if* you know the coin is fair. It is admissible if you suspect the coin is biased.
      *   **[JUDGMENT CALL]:** Is 15 years of data enough to prove bias, or is it noise? If the p-value of the deviation is <0.05, treat as Admissible. If >0.05, Defer.

  **Step 3: The Reference Class Match**
  *   **Question:** Does our exposure match the model's resolution?
  *   **Procedure:** If our exposure is hyper-local (e.g., a single coastal county) and the model resolves at regional level (e.g., state-wide), and we have local data contradicting the regional average, **OVERRIDE**.
  *   **Theory:** The Principal Principle requires $Ch(A)$ to match the specific event $A$. A regional rate is not the chance for a specific county if heterogeneity exists.
  *   **Stop:** If resolution matches, proceed to Step 4.

  **Step 4: The Stationarity Check (Drift)**
  *   **Question:** Is the baseline chance drifting (e.g., climate change)?
  *   **Procedure:** If credible climatological consensus indicates a trend (e.g., +5% frequency per decade) and the model is static (based on 30-year historical averages), **ADJUST** the rate to the mid-point of the risk horizon.
  *   **Theory:** Objective Chance is time-indexed. $Ch_{2024}(A) \neq Ch_{1990}(A)$. Deferring to a static model violates the principle if the chance itself is dynamic.
  *   **[JUDGMENT CALL]:** Selecting the rate of drift. Use the median of IPCC/industry consensus, not the tail.

  **Step 5: The Zero-Event Boundary**
  *   **Question:** Did an event occur that the model assigned probability $\approx 0$?
  *   **Procedure:** If an event occurs with a model return period >10,000 years, and it happens within our observation window, the model's tail is broken. **DO NOT DEFER**. Switch to a heavy-tailed distribution or empirical rate.
  *   **Theory:** A single observation of an "impossible" event falsifies the chance estimate of zero. $Ch(A)=0 \land A_{occurred}$ is a contradiction.
  *   **Stop:** Procedure ends. Hand off to Chief Underwriter for tail loading.

  ---

  ### 3. Application to Live Problems

  **Case A: 20-Year Claims Data vs. Model (Coastal County)**
  *   **Input:** Model rate = 2.0%/yr. Local claims data (20 yrs) implies 2.8%/yr (40% higher).
  *   **Run:**
      *   Step 1: Model code valid? Yes.
      *   Step 2: Admissibility? 20 years is the industry standard for climatology. This is evidence of *process bias*, not just luck. **Admissible.**
      *   Step 3: Reference Class? Data is county-specific; model is likely regional. **Mismatch confirmed.**
      *   Step 4: Stationarity? Assume static for this check.
      *   Step 5: N/A.
  *   **Verdict:** **OVERRIDE.** Use the empirical 2.8% rate, blended 50/50 with the model to account for sampling error.
  *   **Justification:** The model fails the Reference Class Match. Local data is admissible evidence of model bias in this specific bucket.

  **Case B: Seasonal Forecast vs. Static Model**
  *   **Input:** Model rate = 5.0%/yr (long-term avg). Seasonal forecast (El Niño) suggests 7.5% for next 12 months.
  *   **Run:**
      *   Step 1: Model valid? Yes, for long-term.
      *   Step 2: Admissibility? Seasonal forecasts measure *current physical conditions* (SST, shear). This is evidence about the *current chance*, not just the outcome. **Admissible.**
      *   Step 3: Reference Class? Matches.
      *   Step 4: Stationarity? This is short-term drift.
      *   **Constraint:** Seasonal forecasts have skill scores <0.7.
  *   **Verdict:** **ADJUST, BUT CAP.** Move rate toward 7.5%, but weight by forecast skill (e.g., adopt 6.0%).
  *   **Justification:** Deferring to the long-term model ignores admissible evidence about the *current* physical state. However, forecast uncertainty prevents a full override.

  **Case C: The "Impossible" Loss (1 in 10,000 vs. 2 in 5 Years)**
  *   **Input:** Model rate = 0.01%/yr. Experience = 2 losses in 5 years (implied 40%/yr).
  *   **Run:**
      *   Step 1: Model valid? Technically yes, but empirically no.
      *   Step 2: Admissibility? Two losses in five years is statistically overwhelming evidence against a 1/10,000 rate.
      *   Step 5: Zero-Event Boundary? **TRIGGERED.** The model assigned near-zero probability to an event that is demonstrably recurrent.
  *   **Verdict:** **REJECT MODEL RATE.** The model is falsified for this peril/zone.
  *   **Uncomfortable Truth:** We cannot calculate a new precise rate. We have insufficient data to know if the true rate is 10% or 50%. We must price for maximum plausible loss, not expected loss.
  *   **[JUDGMENT CALL]:** This step hands the question back to a person. The procedure identifies the failure, but cannot calculate the fix. The Chief Underwriter must set the rate based on risk appetite, not probability.

  ---

  ### 4. From Credence to Price (The Risk Loading)
  *Do not confuse the output of this procedure (Credence) with the Price.* The procedure above establishes your best estimate of the *frequency* ($p$). Pricing requires $Price = Expected Loss + Risk Load$. For rare events, a small error in $p$ creates a massive error in Solvency Capital. If the procedure yields a rate of 0.1% with high uncertainty, you cannot price at $Loss \times 0.1\%$. You must price as if the rate is higher to cover the variance risk. **Rule:** If the evidence triggering an override is high-variance (e.g., short-term data), increase the Risk Load multiplier. If the evidence is low-variance (e.g., physical climate drift), keep the Load standard. A wrong probability on a common event hurts profitability; a wrong probability on a tail event kills the company. Treat the uncertainty in the rate itself as a cost.

  ### 5. Limitations and Handoffs
  This procedure cannot resolve:
  1.  **Conflicting Admissible Evidence:** When physical data says "up" and claims data says "down." **[HANDOFF TO CHIEF UNDERWRITER]**.
  2.  **Market Discipline:** When the procedure says "Raise Rates" but the market says "Write at Model or lose the client." **[HANDOFF TO STRATEGY]**.
  3.  **True Black Swans:** Where no data exists and physics is uncertain. **[HANDOFF TO BOARD RISK COMMITTEE]**.

  **Implementation:** Effective immediately. All rate departures must cite the specific Step (1-5) authorizing the change.

  ***

  **Note to Analyst:** This document is deliberately uncomfortable. Case C admits that our models can be catastrophically wrong without telling us the right answer. Case A admits that our "gold standard" vendor is often locally biased. Do not smooth these edges. The Board needs to see where the math stops and the guessing begins.
