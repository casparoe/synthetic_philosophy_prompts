      *   (6) vs. (4)/(7): (6) says "one agent" over time. (4) and (7) require binding the future self. If it's one agent, why the need for binding? Usually, multiple selves theories *motivate* commitment. If it's one agent, shouldn't preferences just update? (4) explicitly says "nothing has changed except the hour," implying a preference change without a reason, which is weird for a single agent.
