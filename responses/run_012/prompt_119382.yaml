      *   **The Core Schism:** The biggest conflict is between **Sophistication** (Item 2: anticipate and avoid) and **Resolution** (Items 4 & 7: commit and follow through). You generally have to pick one strategy for dynamic choice.
      *   **The Asymmetry:** Item 3 (Beliefs) demands diachronic coherence without loopholes. Item 2 (Preferences) suggests a loophole ("decline the first trade"). This is inconsistent treatment of diachronic rationality.
