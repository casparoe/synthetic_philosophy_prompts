          *   *Item 5's "Out of Place" Feeling:* This is likely the one the user feels doesn't belong. It's axiological (value theory), while the rest are decision-theoretic/structural.

      *   **Conflict D: Commitment vs. One Self (Items 6 vs. 7).**
          *   (6) No multiple selves.
          *   (7) Commitment devices are required.
          *   *The Tension:* Commitment devices are typically justified by *hyperbolic discounting* or *multiple selves* (I need to protect me-from-tomorrow from me-from-tonight). If (6) is true, and I am one agent, why do I need to lock the door? Ideally, I should just choose the best option.
          *   *Resolution:* (6) + (7) implies *Resolute Choice* (McClennen) rather than *Sophisticated Choice* (multiple selves bargaining). If I am one agent, I should plan optimally over time. If I know I will be weak, the optimal plan *includes* the commitment device. So (6) and (7) are actually compatible *if* (7) is seen as a tool for the single agent to achieve its long-term goals.
