  Regarding inevitability, Tolstoy distinguishes necessity from fatalism. Fatalism implies a predetermined endpoint independent of action; Tolstoy's determinism implies actions are determined by prior causes. He would not claim the camps were destined regardless of human action. Rather, given the antecedent conditions—the sum of German prejudices, economic fears, and bureaucratic habits—the outcome was necessary. The Holocaust was the integral of infinitely small acts: the clerk filing the form, the neighbor closing the curtain. Without those millions of micro-complicities, the leader's will is noise.

  To the historians, Tolstoy would critique both sides. Intentionalists worship the idol of power, mistaking the figurehead for the cause. Functionalists see the apparatus but forget it comprises individuals. Tolstoy would insist the apparatus radicalized because millions of small actors chose radicalization locally, seeking order or advantage. The "competitive radicalization" was just the sum of these infinitesimal choices.

  However, Tolstoy would have to concede where this case strains his framework. His model assumes leaders are powerless labels because communication is slow and local initiative high, as in the Napoleonic wars. The Nazi state mechanized obedience through technology and terror. If the command structure uniquely coerced the "infinitesimal acts," the leader's weight increases. Tolstoy's calculus struggles with industrialized coercion where the vector is top-down rather than emergent.

  The consideration most likely to overturn this verdict is the specific content of the will. Tolstoy assumed soldiers fought for vague patriotism existing prior to Napoleon. If Hitler uniquely generated the specific will to exterminate—a vector not present in the mass prior to his agitation—then the Great Man theory gains traction. If the mass would not have moved *that* way without *that* man, Tolstoy's determinism falters. This is where your editor's pressure holds weight: if the printer's son resisted while the civil service daughter complied, their individual choices matter more than the tide. Your novel might find its truth in the tension: the camps required both the dictator's signal and the printer's silence. Tolstoy's framework breaks if the signal itself created the silence where none existed before.
