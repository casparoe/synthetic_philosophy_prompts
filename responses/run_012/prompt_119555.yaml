answer: |-
  ### Root question

  In constructing a theory of political justice, what is the normative relationship between the moral agent's identity and the political principles that govern them? This question asks whether the authority of political principles derives from the agent's capacity to choose ends independently, or from the agent's embeddedness in a shared life that gives those ends meaning.

  ### The tree

  **Node 1: The Metaphysics of the Agent**
  *Question:* For the purposes of political justification, is the moral agent's identity conceptually prior to their specific ends and attachments?
  *   **Yes (The Unencumbered Self):** The agent is defined by the capacity to choose, revise, and distance themselves from their ends.
      *   *Go to Node 2A.*
  *   **No (The Situated Self):** The agent's identity is partially constituted by their ends, attachments, and community membership.
      *   *Go to Node 2B.*

  **Node 2A: The Status of Neutrality (Unencumbered Branch)**
  *Question:* Is the requirement that the state remain neutral among conceptions of the good itself a neutral procedural constraint?
  *   **Yes (Procedural Neutrality):** Neutrality is a rule of the game that does not presuppose any specific way of life is better.
      *   *Go to Node 3A.*
  *   **No (Comprehensive Neutrality):** Neutrality is justified because autonomy or skepticism is itself a substantive moral value.
      *   *Go to Node 3B.*

  **Node 2B: The Status of Neutrality (Situated Branch)**
  *Question:* Can political principles be justified without presupposing the superiority of a specific conception of the good life?
  *   **Yes:** It is possible to bracket substantive goods even if the self is situated.
      *   *Go to Node 3C.*
  *   **No:** Justification must appeal to the substantive goods internal to the community's practices.
      *   *Go to Node 3D.*

  **Node 3A: The Subject of Justice (Procedural/Unencumbered)**
  *Question:* Are claims of justice reducible entirely to the interests of individual persons?
  *   **Yes:** Only individuals have moral standing; groups are voluntary associations.
      *   *Go to Node 4A.*
  *   **No:** Communities or cultures can hold irreducible claims distinct from the sum of their members' interests.
      *   *Go to Node 4B.*

  **Node 3B: The Subject of Justice (Comprehensive/Unencumbered)**
  *Question:* Are claims of justice reducible entirely to the interests of individual persons?
  *   **Yes:** Only individuals have moral standing.
      *   *Go to Node 4C.*
  *   **No:** Communities can hold irreducible claims.
      *   *Leaf: Unnamed (Diagnosis: Incoherent combination).*

  **Node 3C: The Subject of Justice (Situated/Neutral Justification)**
  *Question:* Are claims of justice reducible entirely to the interests of individual persons?
  *   **Yes:** Individuals remain the primary unit of justice.
      *   *Go to Node 4D.*
  *   **No:** Communities can hold irreducible claims.
      *   *Leaf: Unnamed (Diagnosis: Unstable combination).*

  **Node 3D: The Subject of Justice (Situated/Substantive Justification)**
  *Question:* Are claims of justice reducible entirely to the interests of individual persons?
  *   **Yes:** The community matters, but only as a context for individual flourishing.
      *   *Go to Node 4E.*
  *   **No:** The community is an irreducible subject of justice with claims that may override individual interests.
      *   *Go to Node 4F.*

  **Node 4A: State Action (Procedural/Individual)**
  *Question:* May the state actively promote a specific conception of the good life or civic virtue?
  *   **No:** The state must remain neutral in action as well as justification.
      *   *Leaf: Libertarianism.*
  *   **Yes:** The state may promote virtue to sustain the procedural framework.
      *   *Leaf: Civic Liberalism.*

  **Node 4B: State Action (Procedural/Communal)**
  *Question:* May the state actively promote a specific conception of the good life or civic virtue?
  *   **No:** The state protects cultures but does not endorse their internal values.
      *   *Leaf: Liberal Culturalism.*
  *   **Yes:** The state promotes the conditions for cultural survival even if illiberal.
      *   *Leaf: Unnamed (Diagnosis: Unattractive combination).*

  **Node 4C: State Action (Comprehensive/Individual)**
  *Question:* May the state actively promote a specific conception of the good life or civic virtue?
  *   **No:** The state promotes autonomy but remains neutral on specific life plans.
      *   *Leaf: Autonomy-Based Liberalism.*
  *   **Yes:** The state promotes autonomy as a specific, superior way of life.
      *   *Leaf: Perfectionist Liberalism.*

  **Node 4D: State Action (Situated/Neutral Just/Individual)**
  *Question:* May the state actively promote a specific conception of the good life or civic virtue?
  *   **No:** The state respects situatedness but remains neutral in policy.
      *   *Leaf: Unnamed (Diagnosis: Merely undeveloped).*
  *   **Yes:** The state promotes the conditions for situated agency.
      *   *Leaf: Weak Communitarianism.*

  **Node 4E: State Action (Situated/Substantive/Individual)**
  *Question:* May the state actively promote a specific conception of the good life or civic virtue?
  *   **No:** The good is substantive, but the state is too blunt an instrument to promote it.
      *   *Leaf: Traditionalist Conservatism.*
  *   **Yes:** The state must promote the virtues required for the common good.
      *   *Leaf: Civic Republicanism.*

  **Node 4F: State Action (Situated/Substantive/Communal)**
  *Question:* May the state actively promote a specific conception of the good life or civic virtue?
  *   **No:** The community defines the good, but the state is suspect.
      *   *Leaf: Anarchist Communitarianism.*
  *   **Yes:** The state is the agent of the community's ethical life.
      *   *Leaf: Strong Communitarianism.*

  ### Leaves

  *   **Libertarianism:** Must tolerate the erosion of social bonds if they result from voluntary individual choices.
  *   **Civic Liberalism:** Must use state power to cultivate virtues that the theory claims the state should not define.
  *   **Liberal Culturalism:** Must protect illiberal cultural practices to sustain the autonomy of the members within them.
  *   **Unnamed (Perfectionist Communal Proceduralism):** Must enforce cultural survival without being able to say why that culture is valuable.
  *   **Autonomy-Based Liberalism:** Must treat autonomy as a value while claiming the state is neutral about values.
  *   **Perfectionist Liberalism:** Must coerce individuals into lifestyles that maximize their own freedom.
  *   **Unnamed (Situated Neutral Individualism):** Must acknowledge the self is constituted by ends but refuse to policy-protect those ends.
  *   **Weak Communitarianism:** Must appeal to community values without granting the community political standing.
  *   **Traditionalist Conservatism:** Must defend a substantive moral order while denying the state the authority to enforce it.
  *   **Civic Republicanism:** Must define the common good without providing a mechanism to resolve disputes within the community.
  *   **Anarchist Communitarianism:** Must rely on community cohesion while rejecting the institution that typically secures it.
  *   **Strong Communitarianism:** Must subordinate individual rights to the ethical needs of the community.

  ### Empty branches

  *   **Situated Self + Neutral Justification + Community Subject:** *Diagnosis:* Incoherent; if the self is constituted by the good, one cannot justify neutrality among goods without undermining the self's ontology.
  *   **Unencumbered Self + Non-Neutral Justification + Community Subject:** *Diagnosis:* Unstable; if the self is prior to ends, it is difficult to explain why a community has irreducible claims that bind the self.
  *   **Situated Self + Neutral Justification + Neutral State:** *Diagnosis:* Merely undeveloped; theoretically possible but politically toothless, as it acknowledges community importance without protecting it.

  ### Pairs the tree cannot separate

  *   **Perfectionist Liberalism (Raz) and Civic Republicanism:** Both occupy the leaf where justification is substantive and the state promotes virtue. The tree distinguishes them only by the *content* of the good (Autonomy vs. Civic Virtue), which is a parameter within the position rather than a structural branch.
  *   **Political Liberalism (Rawls) and Procedural Libertarianism (Nozick):** Both land in the "Unencumbered/Procedural/Individual/Neutral" leaf. The tree cannot capture the difference between Rawls's egalitarian distribution and Nozick's entitlement theory, as those are disagreements *within* the liberal framework rather than structural disagreements about the self or neutrality.

  ### Settled versus contested

  **Settled:** Specialists generally agree that "Communitarianism" is not a unified alternative theory to liberalism but a critique of liberal assumptions. There is consensus that the "ontological argument" (that liberalism requires an atomistic self) failed; liberals can accommodate the situated self without abandoning liberal politics.

  **Contested:** It remains genuinely disputed whether state neutrality is possible or whether it silently privileges liberal individualism (the "neutrality is sectarian" claim). Furthermore, scholars disagree on whether liberal culturalism (group rights for individuals) successfully bridges the gap between individual autonomy and community preservation, or if it merely masks a perfectionist agenda.
