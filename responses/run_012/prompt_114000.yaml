  **SECTION 7: CONDUCT, COMMITMENT, AND CORRECTIVE ACTION**

  **7.1 Ontological Compliance and Prohibited Posits**
  NeuroCore Dynamics operates under the strict ontological framework of Eliminative Materialism. Employees are hereby notified that Folk Psychology (FP) constitutes a radically false theory of human behavior, comparable to phlogiston or caloric fluid. Consequently, the attribution of propositional attitudes—including but not limited to beliefs, desires, intentions, hopes, fears, and expectations—is strictly prohibited in all internal communications. Employees must not state that a colleague "believes" a project is viable, nor should they claim to "intend" to meet a deadline. Such statements reinforce a pre-scientific ontology that impedes the adoption of accurate neurocomputational vocabulary. It is the Company's expectation that employees will refrain from holding the belief that beliefs exist. Failure to purge FP terminology from performance reviews, emails, or casual discourse will be treated as a violation of scientific integrity standards.

  **7.2 Performance Metrics and Effort Vectoring**
  Traditional assessments of employee effort rely on the fictitious concept of "trying." As there is no singular neural correlate for "trying," this metric is abolished. Performance will instead be assessed via output vectors and synaptic efficiency proxies where available. Employees are required to produce deliverables consistent with their job description without reference to internal states of "knowing how" or "striving." However, employees are expected to understand that failure to meet quotas indicates a misalignment of neural activation patterns requiring corrective training. While "trying" is not real, the Company expects all staff to try to align their output with organizational goals. Managers are instructed not to ask why an employee "forgot" a task, as memory retrieval is a causal process, not a volitional failure. Instead, managers should inquire regarding the specific environmental inputs that failed to trigger the appropriate behavioral output.

  **7.3 Contractual Intent and Causal Chains**
  The concept of "meaning to" do something is recognized as a relic of FP. Therefore, contractual obligations and promises are not binding based on intent, but on causal inevitability. If an employee states they "promise" to finish a report, this is understood as a prediction of future behavior based on current neural states, not a commitment of will. Should the report remain unfinished, the employee cannot claim they "meant to" complete it, as no such mental state obtained. However, employees are required to intend to honor their contractual obligations. Breach of contract will be adjudicated based on the observable discrepancy between predicted and actual output, regardless of the employee's sincere assertion that they planned to comply.

  **7.4 Affirmation of Non-Sincerity**
  Upon signing this handbook, employees must sincerely affirm that sincerity is a prescientific fiction. By signing, you acknowledge that your signature does not represent an internal state of agreement, but rather a behavioral marker indicating a high probability of future compliance. Employees are expected to feel genuine conviction that genuine conviction is nonexistent. Any employee found harboring a sincere belief in the authenticity of their own affirmations will be referred to Compliance for ontological reconditioning.

  **7.5 Grievance Procedure and Instrumental Provision**
  Employees who are subjected to Folk-Psychological attribution by management (e.g., "I think you believe you are underperforming") may file a Level 1 Grievance via the HR portal. Such attributions create a hostile ontological environment. However, the Company acknowledges that until neurocomputational vocabulary achieves full lexical saturation, FP terms may be retained instrumentally. Employees are permitted to use words like "believe" or "want" solely as useful fictions to facilitate workflow, provided they do not actually believe that these words refer to real entities. Managers must ensure that this instrumental use does not slip into realist endorsement. It is expected that employees will not expect consistency in the enforcement of this clause.
