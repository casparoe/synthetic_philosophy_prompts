answer: |-
  This is a translation task from semantic-historical space to phase-space. I will treat the historical theories as candidate models for a dynamical system $S$, define their state variables $x \in \mathbb{R}^n$, their flow $\phi_t$, and their control parameters $\mu$. I will not protect the historians from the rigor of the formalism; if their theory implies a discontinuity or a teleological force, the math will expose it as a singularity or a non-autonomous forcing term.

  ### Part 1: The Four Systems

  #### 1. Polybius: The Autonomous Limit Cycle
  **Theory:** The *anacyclosis*. Six constitutions (Monarchy $\to$ Tyranny $\to$ Aristocracy $\to$ Oligarchy $\to$ Democracy $\to$ Ochlocracy $\to$ Monarchy). Transition is driven by internal moral decay (virtue $\to$ vice).
  **System Translation:**
  *   **State Space:** A discrete manifold $\mathcal{M} = \{1, ..., 6\}$ embedded in a continuous space of "Power Concentration" ($p$) and "Corruption" ($c$).
  *   **Dynamics:** A deterministic discrete map $x_{k+1} = f(x_k)$.
  *   **Flow:** The system possesses a **stable limit cycle**. The trajectory is closed and periodic.
  *   **Control:** The system is **autonomous**. The forcing function is internal to the state (corruption is a function of the duration in power). There are no external control inputs $u(t)$.
  *   **Stability:** The cycle is structurally stable against small perturbations (noise in the populace), but the period is fixed by the rate of moral decay.
  *   **Equation Form:** $\dot{\theta} = \omega$, where $\theta$ is the phase on the cycle. The "corruption" variable acts as a slow parameter drift that triggers the bifurcation to the next constitutional state once a threshold is crossed.

  #### 2. Ibn Khaldun: The Driven Relaxation Oscillator with Reset
  **Theory:** Dynasties rise via *asabiyyah* (group solidarity), peak in luxury, decay as *asabiyyah* dissipates, and are overthrown by a new group with high *asabiyyah*.
  **System Translation:**
  *   **State Variables:** $x = [A, L, P]^T$ where $A$ is *asabiyyah*, $L$ is luxury/urbanization, $P$ is political power.
  *   **Dynamics:** Coupled nonlinear ODEs.
      *   $\dot{P} \propto A$ (Solidarity generates Power).
      *   $\dot{L} \propto P$ (Power generates Luxury).
      *   $\dot{A} = -\alpha L A$ (Luxury dissipates Solidarity).
  *   **Structure:** This is a **relaxation oscillator**. $A$ builds up (outside the city), discharges into $P$ and $L$, and $L$ kills $A$.
  *   **The Reset:** The system does not naturally return to high $A$. It requires an external shock. This is a **hybrid system**. When $P \to 0$ (collapse), a boundary condition triggers a jump: $A(t^+) = A_{high}$ (new tribe).
  *   **Hysteresis:** The path from $A_{high} \to L_{high}$ is not reversible. You cannot regain *asabiyyah* within the luxury state; you must exit the basin of attraction of the "Civilized State" to the "Barbarian State" to reset.
  *   **Noise:** Stochastic variations in harvest/war affect the decay rate $\alpha$.

  #### 3. Spengler: The Finite-Time Singularity (Morphological Trajectory)
  **Theory:** Cultures are organisms with a fixed lifespan (~1000 years). They pass through seasons (Spring, Summer, Autumn, Winter). They do not learn from each other; they do not cycle; they die.
  **System Translation:**
  *   **State Space:** A high-dimensional manifold of "Cultural Expression" (Art, Math, Politics).
  *   **Dynamics:** **Non-autonomous flow** with explicit time dependence. $\dot{x} = f(x, t)$.
  *   **Trajectory:** A heteroclinic orbit connecting an unstable fixed point (Birth) to a stable sink (Death/Caesarism).
  *   **Constraint:** The trajectory is confined to a specific tube in phase space (Destiny). Deviations are impossible. This implies infinite stiffness in the control parameters.
  *   **Termination:** The system reaches a **finite-time singularity** or a terminal attractor where $\dot{x} = 0$ permanently. There is no exit map.
  *   **Key Feature:** Unlike Polybius, there is no recurrence. Unlike Khaldun, the decay is not due to feedback (luxury killing solidarity) but due to an internal clock (morphological exhaustion).

  #### 4. Toynbee: The Bifurcating Control System
  **Theory:** Civilizations grow by successfully responding to challenges. They break down when the "Creative Minority" fails to respond. Disintegration leads to a "Universal State" or a new genesis.
  **System Translation:**
  *   **State Variables:** $C$ (Challenge magnitude), $R$ (Response capability).
  *   **Dynamics:** A control system where the "Creative Minority" acts as the controller $u(t)$ attempting to maximize $R$.
  *   **Growth Condition:** Growth occurs if $R(t) > C(t)$.
  *   **Bifurcation:** The system faces a **bifurcation point** at every challenge.
      *   Branch 1 (Success): $C_{next} > C_{current}$ (Challenge ratchets up). System moves to a higher energy state.
      *   Branch 2 (Failure): $R < C$. System collapses into a "Universal State" (rigid equilibrium) or disintegrates.
  *   **Path Dependence:** The history is a **tree of trajectories**, not a single line or cycle. The state space expands with every successful response.
  *   **Stochasticity:** The success of the response is probabilistic, dependent on the "vitality" of the minority.

  ---

  ### Part 2: The Residue Report

  Here we assess the fidelity of the translation. What is lost, what is forced, and where the frameworks clash.

  #### 1. What Carries Over Cleanly (The Isomorphisms)
  *   **Feedback Loops:** Khaldun's "Luxury kills Solidarity" is a perfect negative feedback loop ($\dot{A} = -LA$). Polybius's "Success breeds Hubris" is positive feedback leading to instability. These map 1:1 to control theory.
  *   **Basins of Attraction:** The distinction between "Barbarian" and "Civilized" in Khaldun is clearly two distinct basins. Moving between them requires energy (conquest).
  *   **Thresholds:** Toynbee's "Challenge and Response" is a threshold function. If input $< $ threshold, no growth. This is standard nonlinear dynamics (e.g., Heaviside or sigmoid functions).
  *   **Hysteresis:** All four theories imply history doesn't rewind. In dynamics, this is hysteresis. You cannot return to the initial state by reversing the parameters (e.g., Spengler's Winter does not turn back to Spring).

  #### 2. What Fits Only With Distortion (The Forced Mappings)
  *   **Polybius's Moral Variables:** In dynamics, "Virtue" and "Vice" must be state variables. But they are normative, not descriptive. To model them, we must define them operationally (e.g., "Virtue = Compliance with Law"). This strips the moral weight, which is central to Polybius. The math works, but the *meaning* is attenuated.
  *   **Spengler's "Destiny":** Spengler claims cultures *must* die at a specific time. In dynamics, this requires a hard time-dependence $f(x,t)$ that overrides state feedback. This is "open-loop control" in a system that looks closed. It forces the model to be non-autonomous in a way that feels ad hoc. It's like a differential equation with a timer that kills the solution at $t=1000$ regardless of $x$.
  *   **Toynbee's "Creative Minority":** This is a "homunculus" controller. In control theory, the controller must be part of the system dynamics. Toynbee treats the Minority as almost external to the civilizational mechanics until they fail. Modeling this requires a meta-variable that governs the gain of the control loop, which risks infinite regress.

  #### 3. What Is Inexpressible (The Residue)
  *   **Teleology (Purpose):** Dynamics describes *how* a state changes, not *why* it exists. Toynbee and Spengler imply a purpose (spiritual fulfillment, morphological completion). A limit cycle has no purpose; it just is.
      *   *Fault:* **Framework's.** Dynamical systems are inherently non-teleological. You cannot derive "meaning" from a Jacobian.
  *   **Qualitative Morphology:** Spengler talks about the "feel" of a culture (Apollonian vs. Faustian). This is topological, but not metric. It's about the *shape* of the manifold, not the trajectory on it. Standard dynamics focuses on trajectories.
      *   *Fault:* **Historians'.** Spengler is vague. "Faustian" is a mood, not a parameter. If he cannot define the metric space, the dynamics cannot operate on it.
  *   **Contingency vs. Determinism:** Polybius and Spengler are deterministic (the cycle/seasons *will* happen). Toynbee and Khaldun allow for contingency (if the response fails, if the new tribe doesn't come).
      *   *Fault:* **Historians'.** They often conflate "likely" with "necessary." Dynamics forces you to declare: is there noise ($\sigma > 0$) or not? Most historians want both (deterministic outcome, contingent path), which is mathematically inconsistent without specifying the probability distribution of the noise.

  ---

  ### Part 3: The Cyclical-vs-Linear Contrast Decomposed

  The standard historiographical divide is "Ancients thought in circles, Moderns think in lines." Your vocabulary reveals this to be a category error. The distinction dissolves into at least three distinct dynamical properties:

  #### 1. Periodic Orbit vs. Heteroclinic Trajectory
  *   **Polybius** is truly cyclical in the dynamical sense: a **Limit Cycle**. $x(t+T) = x(t)$.
  *   **Spengler** is linear in the sense of a **Transient Trajectory to a Sink**. It has a start and an end. It does not repeat.
  *   **Residue:** "Cyclical" history is rare. Even Polybius admits the cycle can be broken by a "mixed constitution" (Rome), which acts as a control input stabilizing the system to a fixed point, stopping the cycle.

  #### 2. Autonomous vs. Non-Autonomous (Driven)
  *   **Linear/Progressive** narratives (e.g., Enlightenment progress) often imply a **Non-Autonomous System** with a forcing function that pushes parameters in one direction ($\dot{\mu} > 0$). Time is an explicit input.
  *   **Cyclical** narratives are usually **Autonomous**. Time is implicit in the state evolution.
  *   **Khaldun** breaks this: It is autonomous decay, but driven reset. It is a **Driven Relaxation Oscillator**. It looks cyclical macroscopically, but microscopically it is a series of distinct pulses driven by external shocks.

  #### 3. Reversible vs. Hysteretic (Topological)
  *   **Linear** often implies **Irreversibility** (Entropy). You cannot go back to Feudalism.
  *   **Cyclical** implies **Recurrence**.
  *   **The Real Distinction:** It's about the **Basin Structure**.
      *   If the phase space has one global attractor (Communism, End of History), the system is "Linear" (convergent).
      *   If the phase space has multiple attractors and noise kicks the system between them, it looks "Cyclical."
      *   If the system has **Hysteresis** (Khaldun/Toynbee), the "Line" is actually a ratchet. It moves forward, but can crash back, just not to the *exact* same state.

  ### Conclusion for the Module

  The "Cyclical vs. Linear" dichotomy is a low-resolution projection of high-dimensional dynamics.
  *   **Polybius** is a **Limit Cycle** (Autonomous, Periodic).
  *   **Khaldun** is a **Hybrid System** (Autonomous decay + External Reset).
  *   **Spengler** is a **Finite-Time Trajectory** (Non-autonomous, Terminal).
  *   **Toynbee** is a **Branching Stochastic Process** (Bifurcating, Path-Dependent).

  **The Verdict:** Your framework is superior for precision. It exposes where the historians are making precise claims (feedback loops) and where they are smuggling in mysticism (Destiny, Spirit). The "Residue" (Meaning, Purpose) is not a failure of your dynamics; it is a recognition that history-as-math describes the *kinematics* of power, not the *semantics* of human experience. The historians often confuse the two. Use the math to separate the mechanism from the mood. If they cannot specify the state vector, they are writing poetry, not theory.
