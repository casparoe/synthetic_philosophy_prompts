answer: |-
  # THE SELF-DECEPTION DECISION TREE
  **For the use of the reading group. Please mark your path.**

  ```text
  START: Consider the putative case (e.g., the smoking doctor).
         Does the agent hold the belief they verbally deny?
         (i.e., Does their behaviour betrays the truth they avow?)
         |
         +-- NO --> [ORDINARY ERROR] (Not self-deception. Stop.)
         |
         +-- YES --> They "really hold" the belief dispositionally.
                     |
                     Question 1: IS THE PROCESS INTENTIONAL?
                     (Did they strategise to avoid the truth, or did
                     desire warp processing without a plan?)
                     |
                     +-- INTENTIONAL --> Question 2: IS THE MIND DIVIDED?
                     |                   (Is one sub-agent hiding truth
                     |                   from another, or is it one mind
                     |                   managing attention?)
                     |                   |
                     |                   +-- DIVIDED --> [THE TRADITIONALIST]
                     |                   |
                     |                   +-- SINGLE  --> Question 3: IS IT PRETENCE?
                     |                                   (Are they merely
                     |                                   acting as if they
                     |                                   believe?)
                     |                                   |
                     |                                   +-- YES --> [THE PRETENDER]
                     |                                   +-- NO  --> [EMPTY NODE*]
                     |
                     +-- MOTIVATED --> Question 4: IS THE FUNCTION SOCIAL?
                                       (Is the bias maintained to signal
                                       virtue/loyalty to others rather
                                       than to soothe the self?)
                                       |
                                       +-- YES --> [THE SIGNALLER]
                                       |
                                       +-- NO  --> Question 5: IS IT DISTINCT?
                                                   (Is this distinct from
                                                   ordinary motivated belief
                                                   plus avoidance?)
                                                   |
                                                   +-- NO  --> [THE DEFLATIONIST]
                                                   +-- YES --> Question 6: THE HALF-KNOWING?
                                                               (Do they adjust behaviour
                                                               to the truth while denying
                                                               it occurrently?)
                                                               |
                                                               +-- YES --> [THE TACIT ACKNOWLEDGER]
                                                               +-- NO  --> [THE MOTIVATED BELIEVER]
  ```

  ## LEAF DEFINITIONS & UNCOMFORTABLE CASES

  **1. THE TRADITIONALIST**
  *View:* Self-deception requires a partitioned mind akin to interpersonal deception.
  *Uncomfortable Case:* **The Partner Last to Know.** If the mind is partitioned, how did the partition arise without the 'knowing' part intending it, and why does the 'ignorant' part feel genuine distress upon discovery rather than relief?

  **2. THE PRETENDER**
  *View:* The agent does not believe the falsehood but asserts it to manage attention or avowal within a single mind.
  *Uncomfortable Case:* **The Loud Declarer.** When behaviour flatly contradicts the avowal (e.g., the investor who won't open statements), at what point does sustained pretence calcify into a belief the agent can no longer distinguish from truth?

  **3. THE SIGNALLER**
  *View:* The point of deceiving yourself is to deceive other people better (honest signalling of bias).
  *Uncomfortable Case:* **The Ideologue.** If the function is purely social, why do agents often maintain the belief in private where no signalling benefit exists, even suffering personal cost (e.g., the smoking doctor alone in a room)?

  **4. THE DEFLATIONIST**
  *View:* There is no distinct phenomenon; it is ordinary motivated belief plus avoidance behaviour.
  *Uncomfortable Case:* **The Smoking Doctor.** This view struggles to explain the specific phenomenological tension—the feeling of 'knowing but not knowing'—that distinguishes this from simple ignorance or lying.

  **5. THE TACIT ACKNOWLEDGER**
  *View:* A coined category for the 'half-knowing' state; the belief guides action but is barred from verbal report.
  *Uncomfortable Case:* **The Half-Knower.** How do we empirically distinguish this from the Deflationist view without relying on the agent's own unreliable introspection regarding what they 'really' know?

  ---

  ## STRUCTURAL NOTES & FLAGS

  **1. INDISTINGUISHABLE LEAVES**
  The tree cannot reliably separate **The Deflationist** and **The Tacit Acknowledger**.
  *Reason:* Both predict identical behaviour (avoidance + contradictory action). The only difference is theoretical: whether one posits a specific cognitive mechanism for barring verbal report (Tacit) or simply notes the absence of belief formation (Deflationist). In practice, an outside observer cannot distinguish them without privileged access to the agent's cognitive architecture.

  **2. EMPTY NODES**
  **Intentional + Single Mind (Strictly Unified) [Marked EMPTY above]**
  *Status:* **Incoherent.**
  *Reason:* This combination generates the 'Static Paradox'. To intentionally deceive oneself, one must know the truth (to formulate the plan) and not know the truth (to be deceived). Without a divided mind (partition) or a mechanism like attentional diversion (Pretence), a strictly unified mind cannot hold the intention to deceive itself without immediately resolving the deception. It is unliveable as a stable state.

  **3. BRANCHING LOGIC**
  Note that **The Signaller** branches off 'Motivated' rather than 'Intentional'. While signalling can be strategic, the self-deception view posits that the agent must *believe* the signal to send it honestly. Therefore, the bias is motivated by social utility, not necessarily by a conscious intention to lie to oneself.

  **4. USAGE INSTRUCTION**
  When discussing a case, do not ask "Is this self-deception?" Ask "Which leaf does this land on?" If two members land on different leaves for the same case, the disagreement is likely about the mechanism (Intentional vs. Motivated), not the phenomenon.

  ---
