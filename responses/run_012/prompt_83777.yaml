  **Title and one-sentence statement of the question**
  **Constraint as Laundering: An Audit Protocol for Formal Translation**
  This project asks whether formal constraints in poetry translation necessitate specific lexical choices that readers mistake for authorial intent.

  **Background: what is already settled here and what is not**
  Translation studies largely accepts that form contributes to meaning, yet lacks a granular vocabulary for describing how specific formal constraints operate during the transfer process. Existing scholarship demonstrates that multiple valid translations of a single source text exist, often diverging based on how translators prioritize rhyme, meter, or syntax. However, current frameworks treat these divergences as stylistic preferences rather than structural necessities. There is no settled method for distinguishing between a word chosen for semantic fidelity and a word chosen to satisfy a rhyme scheme. Consequently, the specific cost of formal fidelity remains unquantified. While theoretical discussions abound regarding the loss inherent in translation, the mechanical interaction between target-language constraints and source-text semantics remains opaque. This project moves beyond theoretical assertion to empirical audit, seeking to categorize the specific lexical expenditures required by form.

  **The question, stated precisely enough that it has a determinate answer, including what would count as an answer in each direction**
  The central question is twofold. First, is the distinction between load-bearing and decorative constraints stable across different source-target pairings, or is it relational? Second, can we reliably audit a translation to identify which lexical items are necessitated by formal constraints versus those licensed by the source text? A positive answer requires establishing a coding protocol with high inter-coder reliability that successfully categorizes every consequential word choice into four states: necessitated by constraint, licensed by source, both, or neither. A negative answer would demonstrate that such categorization is inherently subjective, varying significantly between coders regardless of protocol strictness. Determining this answers whether formal constraint actively launders invention as intention, or whether such claims are merely critical projections. If the protocol holds, we can map the pressure points of translation; if it fails, the distinction between constraint and choice is critically unusable.

  **Why the obvious approaches leave it open — the sense-for-sense/word-for-word split, the 'form is part of meaning' line, the equivalent-effect line, and the auditing practice of translators themselves**
  Traditional binaries fail to capture this mechanic. The sense-for-sense versus word-for-word distinction ignores formal constraints entirely, treating them as optional ornamentation rather than structural loads. The argument that form is part of meaning is theoretically sound but practically useless for audit; it declares everything significant without explaining what was sacrificed to achieve that significance. Equivalent-effect theories rely on reader reception, which is too variable to isolate the specific pressure of a constraint on the text itself. Furthermore, translators themselves rarely document their decision trees; published notes highlight clever solutions but omit forced compromises. Consequently, there is no existing methodology to separate the forced from the chosen. Without a protocol to mark these distinctions, claims about formal fidelity remain anecdotal. We cannot know if a rhyme word is a brilliant discovery or a desperate compromise without a system to trace the pressure that produced it. Current criticism lacks the tools to differentiate between a translator's voice and the voice of the constraint.

  **Method, week by week, with the materials, the constraint regimes, the coding scheme, and how I would keep my own poetic incompetence from contaminating the results**
  The six-week timeline is divided into three phases. Weeks 1-2: Selection and Setup. I will select four short public-domain French poems (2-8 lines). I will define three constraint regimes: Source Form, Target Standard Form, and an Invented Strict Form (fixed stress and final consonant). Weeks 3-4: Production. To mitigate my own poetic incompetence, I will not write original translations. Instead, I will generate versions algorithmically from a literal prose gloss, forcing word substitutions only to meet constraints. This isolates the constraint's pressure from stylistic variation. My RA will independently generate parallel versions to ensure reproducibility. Week 5: Audit. We will apply the coding protocol to all versions, categorizing lexical choices. We will calculate inter-coder reliability to test the protocol's stability. Week 6: Analysis. I will compile the data to identify patterns where constraints forced semantic drift. By removing external reader studies, I avoid IRB delays and focus on the audit mechanism itself. The coding scheme will tag each lexical unit with its justification source, allowing for quantitative analysis of constraint pressure.

  **Deliverable**
  The primary deliverable is a validated audit protocol for formal translation, accompanied by a dataset of coded translations. I will produce a white paper detailing the coding scheme, the inter-coder reliability statistics, and case studies showing where constraints laundered invention. This document will serve as a methodological tool for future comparative literature research, allowing scholars to move beyond anecdotal claims about formal fidelity.

  **What would count as failure or a null result**
  A null result would occur if inter-coder reliability remains low despite protocol refinement, indicating that distinguishing necessity from choice is inherently subjective. This would suggest that the "laundering" effect is in the eye of the beholder rather than a structural feature of the text. Alternatively, if the constraint regimes produce no significant semantic divergence from the literal gloss, the hypothesis that constraints force lexical invention would be disproven for the selected languages. Either outcome is valuable: it would either validate the protocol for future use or demonstrate the limits of formalist auditing. Failure to complete the coding within six weeks would also constitute a project failure, necessitating a reduction in the number of texts analyzed. A null result clarifies the boundary of what can be known about translation mechanics.

  **Scope and the risks I am underrating**
  The primary risk is underestimating the time required for the coding phase; linguistic nuance may make binary categorization difficult. I mitigate this by limiting the corpus to four short texts. Another risk is the "poetic incompetence" factor; using algorithmic substitution from a gloss mitigates this but may produce unnatural text. I accept this trade-off to isolate variables. I have cut the blind-attribution reader study originally envisioned; recruiting subjects and securing IRB approval is impossible within a six-week summer window. Focusing on inter-coder reliability between myself and the RA ensures the project remains doable while still testing the protocol's viability. This scope ensures a completed, fundable project rather than an ambitious fragment.
