  I keep seeing people say information can never hurt you — that if you're rational and the info is genuinely free (costs nothing, you're allowed to just ignore it, and nothing in the world changes just because you learned it), then knowing more can only help, or at worst leave you where you already were. I mostly buy it, but I can feel a hole in it and I can't build the example myself.

  Write me a short story where someone gets free, reliable, no-strings info and ends up worse off, and not because they're dumb or they panic — they play it about as well as anyone could. The bit I keep circling is that the info is about other people and what they're going to do, and those people can tell, or will work out, that our person now knows. Make the loss a real one: they'd honestly have been better off if the info had never shown up in the first place.

  Then finish with a few sentences naming exactly which part of the "info can't hurt you" claim the story breaks. I have a hunch the claim only really holds for one person acting alone, but tell me if that's the right diagnosis or if i've got it wrong.
