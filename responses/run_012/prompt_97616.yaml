answer: |-
  Julian sat in the glass-walled conference room, the offer letter sliding across the table. He was alone for a moment while the hiring manager, Elena, took a call in the hallway. On the table lay a forgotten internal memo, slipped out of Elena's folder. It was unmarked, but the header was unmistakable: *Q3 Compensation Bands – Senior Analyst.*

  It was free information. He hadn't hacked anything; it was just paper left behind. It was reliable; the numbers matched the vague hints Elena had dropped earlier. And he was allowed to ignore it. He could push the paper aside, pretend he never saw it, and negotiate based on market averages.

  But Julian was rational. The memo showed the salary cap for his role was exactly $142,500. The offer on the table was $135,000. If he ignored the memo, he might haggle to $138,000, or he might settle for $135,000. If he used the memo, he could ask for the hard cap. A rational agent does not leave free money on the table.

  When Elena returned, Julian smiled. "I'm very interested, but looking at the responsibilities, I need to be at the top of the band. $142,500."

  Elena didn't blink. She didn't counter. She slowly closed her folder. "That is a very specific number, Julian."

  "It's the market rate for this level of responsibility," Julian said, keeping his voice steady. He hadn't revealed his source. He was playing it perfectly.

  "We haven't discussed specific band caps yet," Elena said. "In fact, I haven't shared the upper limit with any external candidates. It's internal data."

  Julian's heart sank, but he maintained his posture. "Just a lucky guess based on my research."

  Elena shook her head, not with anger, but with cold calculation. "If you're willing to leverage internal documents left on a table to squeeze an extra seven grand, you're a security liability. We deal with proprietary client data. I can't trust you with secrets if you exploit mine on day one."

  She stood up. "We're withdrawing the offer. We'll go with the second candidate."

  Julian left the building. He remained unemployed for eight months, burning through his savings. He had played the hand optimally given the information he held. But if that memo had never existed—if he had remained ignorant—he would have signed at $135,000. He would have been employed. He would have been richer.

  ***

  **The Diagnosis**

  Your hunch is exactly right. The claim that "information can't hurt you" holds true only in **Decision Theory** (one person acting against a static environment or "Nature"). In that context, you can always choose to ignore the info, so your expected utility never drops.

  The story breaks the claim because it introduces **Game Theory** (multiple rational agents). Here, the "state of the world" includes other people who update their strategies based on *your* knowledge. When your opponent knows (or suspects) that you know, the information ceases to be a private tool and becomes a **signal**. By acting rationally on the info, Julian signaled he was a security risk, changing Elena's payoff matrix and causing her to withdraw the offer. In multiplayer scenarios, knowledge can destroy trust, and trust is often more valuable than the information itself.
