answer: |-
  **The Case of the Silent Looms**

  To test your claim, I have constructed a specific example. It is a composite, based on real Neolithic and Bronze Age weaving sites in the Balkans and Anatolia, but simplified to isolate the logical conflict. In real excavations, data is messier; here, I have stripped away the noise to let the contradiction stand clear.

  **What was found, and in what context**
  Imagine a site called "High Ridge," dated to roughly 4000 BCE. Excavators uncovered a large central building (the "Temple") and twenty surrounding domestic houses (the "Village").

  The material fact in question is the distribution of ceramic loom weights—small, fired-clay doughnuts used to tension thread on vertical looms. In the Temple, archaeologists found a cache of fifty loom weights. They were pristine, uniform in size, and showed no signs of wear. They were buried together in a sealed pit under the floor. In the twenty surrounding Village houses, excavators found *zero* loom weights. Not one. Furthermore, no thread, no cloth, and no loom posts were found in the houses either.

  **The belief reading (Excess)**
  This reading focuses on the Temple cache. Why make fifty perfect tools and bury them where they can never be used? This is effort expended with no practical return. It is waste. In archaeological terms, waste is the signature of the sacred. The belief reading argues that the community produced these weights as votive offerings. The "excess" labor of making them was a gift to a deity of craft or harvest. The fact that they are unused is the point; they were removed from the human economy to enter the divine one. The Village houses have no weights because the people chose to dedicate their production capacity to the gods.

  **The institution reading (Absence)**
  This reading focuses on the Village silence. Weaving is a basic human need; every household requires cloth. Yet the domestic record shows a systematic absence of the means of production. This suggests a rule. The institution reading argues that private weaving was prohibited. The Temple was not a shrine, but a state-run workshop. The weights found there were inventory, not offerings. The absence of weights in the houses is evidence of a monopoly: the central authority controlled all textile production, perhaps to tax it or to restrict high-quality cloth to an elite. The people did not *choose* to give the weights; they were *forbidden* to keep them.

  **The third possibility (Equifinality)**
  A third voice suggests the pattern is an artefact of preservation or recovery. Perhaps loom weights in the houses were made of organic material (wood or bone) that rotted away, while the Temple weights were clay and survived. Or, perhaps the Village houses were looted after abandonment, with valuable tools taken by survivors, while the Temple pit remained sealed and hidden. In this scenario, there was neither piety nor prohibition—just differential decay and chance survival.

  **What each reading assumes that the objects themselves do not show**
  The belief reading assumes intent. It assumes that the people who buried the weights understood them as "useless" in a worldly sense and valued that uselessness. The clay itself does not say "I am an offering."
  The institution reading assumes power. It assumes that the absence of weights in the houses was enforced, not accidental. It assumes a central authority capable of policing twenty households. The silence of the soil does not say "This was banned."

  **How much of each is borrowed from an analogy with a living society**
  Both readings lean heavily on the present to explain the past. The belief reading borrows from modern religious practices where people burn money or leave food at shrines—acts of deliberate waste. The institution reading borrows from modern command economies or guild systems, where certain trades are centralized and regulated. Without these modern parallels, the clay weights are just stones; the analogies provide the narrative glue.

  **What further find would decide between them — or an argument that nothing could**
  Ideally, a text would decide it: a receipt saying "Tax Paid" or a prayer saying "Gift Given." But this is a pre-literate society.
  One might hope for residue analysis: if the Temple weights show traces of oil or fiber, they were used (supporting Institution). If they are chemically clean, they were not (supporting Belief).
  However, a stronger argument is that nothing could definitively decide between them. Even if the weights are unused, a state could stockpile unused tools. Even if they are used, a temple could reuse sacred tools before burying them. The two readings are underdetermined by the record because they describe *relationships* (between people and gods, or people and rulers) that do not fossilize. The physical object is the same; only the invisible context changes.

  **The general point**
  This example illustrates the asymmetry in your claim. The material record licenses claims about **belief** more readily than claims about **institutions**, precisely because belief leaves a scar of excess. Waste is tangible; a buried tool is a physical fact that demands explanation.

  Institutions, however, rely on absence. They are defined by what is *not* there (the missing loom in the house). But the archaeological record is a sieve; it is defined by what *did not survive*. To argue for an institution is to argue that a silence in the data is a silence in history, not a silence in preservation. The record licenses belief because belief adds matter (the offering). It deceives regarding institutions because institutions often subtract matter (the prohibition), and subtraction is indistinguishable from loss. We can find the trace of a thought that demanded effort; we cannot easily find the trace of a rule that demanded restraint.
