  ### Calibration Exercise Scores

  1.  **Wrist lock:** 0.90
  2.  **Gular patch:** 0.50
  3.  **Caudal rod:** 0.30
  4.  **Cranial crest:** 0.25
  5.  **Slow metabolism:** 0.20
  6.  **Enlarged liver:** 0.15
  7.  **Cranial strut:** 0.10

  ### Ranking (Most to Least Defensible)

  1.  Wrist lock
  2.  Gular patch
  3.  Caudal rod
  4.  Cranial crest
  5.  Slow metabolism
  6.  Enlarged liver
  7.  Cranial strut

  ### Per-Item Reasoning

  **1. Wrist lock (0.90)**
  *   **Objection:** None serious; it survives because the trait is unique to the functional lineage, develops in sync with the behavior, and experimental manipulation confirms necessity.
  *   **Category:** Genuine adaptation.
  *   **Evidence:** A fossil record showing the bone evolving *before* the suspensory behavior would lower the score; finding no genetic variance for the trait despite selection pressure would also lower it.

  **2. Gular patch (0.50)**
  *   **Objection:** Signal reliability is compromised because environmental noise (fruit availability) decouples the signal from the proposed indicator of individual quality (health).
  *   **Category:** Genuine adaptation (noisy signal) or Exaptation.
  *   **Evidence:** Demonstrating that mates prefer patches only when controlling for seasonal fruit abundance would raise the score; showing patch size is genetically fixed regardless of diet would lower it.

  **3. Caudal rod (0.30)**
  *   **Objection:** Phylogenetic inertia and developmental constraint, as the trait appears in non-climbing relatives and emerges in the embryo before functional use.
  *   **Category:** Product of phylogenetic inertia (possibly exapted).
  *   **Evidence:** Biomechanical data showing the rod provides zero bracing advantage in this species compared to relatives would lower the score; finding genetic variation correlated with climbing efficiency would raise it.

  **4. Cranial crest (0.25)**
  *   **Objection:** Allometric byproduct, since crest size tracks body size and a sister species performs the same behavior without the crest.
  *   **Category:** Developmental byproduct.
  *   **Evidence:** Controlling for body size and finding crest size still predicts contest outcomes would raise the score; finding the crest is composed of non-structural fat or keratin would lower it.

  **5. Slow metabolism (0.20)**
  *   **Objection:** Deep phylogenetic inertia, as the trait persists across a large clade occupying habitats with vastly different seasonal pressures.
  *   **Category:** Product of phylogenetic inertia.
  *   **Evidence:** A comparative analysis showing metabolic shifts correlating with habitat seasonality within the clade would raise the score; finding the trait is linked to a lethal mutation if altered would lower it.

  **6. Enlarged liver (0.15)**
  *   **Objection:** Phylogenetic inertia combined with developmental constraint, since a sister species on a different diet shares the trait via a shared growth field.
  *   **Category:** Product of phylogenetic inertia / Developmental byproduct.
  *   **Evidence:** Identifying detoxification enzymes specific to the staple leaf that are absent in the sister species would raise the score; showing liver size is uncorrelated with toxin load would lower it.

  **7. Cranial strut (0.10)**
  *   **Objection:** Structural constraint, as the strut arises necessarily from ossification centers in all order members, including those with weak bites.
  *   **Category:** Developmental byproduct.
  *   **Evidence:** Finding a species in the order where ossification centers fuse without forming a strut would raise the score; stress tests showing the strut bears no load during biting would lower it.

  ### Spandrels Critique Calibration

  **Clearest Poster Child for the Spandrels Critique:**
  **Item 7 (Cranial strut).** This trait exemplifies the architectural byproduct argument: it exists solely because of the necessary mechanics of skull growth (ossification centers) rather than selective utility, as evidenced by its presence in taxa that derive no functional benefit from it.

  **Strongest Evidence Against Indiscriminate Application of the Critique:**
  **Item 1 (Wrist lock).** This trait demonstrates that not all features are byproducts or inertia; the tight correlation between trait specificity, developmental timing, and experimental necessity shows that natural selection can and does produce genuine adaptations that cannot be explained away by structural constraints.
