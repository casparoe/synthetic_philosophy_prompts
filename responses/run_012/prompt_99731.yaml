prompt: |-
  I'm a third-year philosophy student, currently doing a module on naturalism and metaethics, and we've just spent two weeks on Quine. Here's where I've landed, and I want you to pressure-test it.

  Act as a philosopher who works on both Quine scholarship and contemporary metaethics — someone who can move between the history of analytic philosophy and the current debates without treating the one as mere background to the other. Before you answer, brainstorm a bit: lay out what you take Quine's actual commitments on moral values to be, then move to the critique.

  The position I've come to hold, roughly in Quine's spirit: moral judgements aren't in the business of tracking truth the way scientific claims are. They're more like expressions of preference, or directives for coordinating behaviour. Quine's naturalism says reality gets described from within science, and ethics isn't part of that enterprise — it's something else we do with language, continuous with wanting rather than believing. Moral disagreement, on this picture, isn't a disagreement about facts that one side might be getting wrong; it's more like a clash of attitudes. The upshot is that there's no moral reality for our moral claims to answer to, and no truth of the matter for the philosopher to uncover. Ethics becomes a kind of engineering: shaping desires, not discovering truths.

  What I want from you: what would count against this? Not just the usual objection that it makes moral arguement pointless, but a real map of its exposure.

  A few things I'd especially like you to sort through:

  - Which empirical or quasi-empirical findings would embarrass it? For instance, if moral judgements turned out to have the same cognitive profile as mathematical or causal judgements — same patterns of inference, same sensitivity to evidence, same reaction to contradiction — would that tell against the view, or could a Quinean absorb it?
  - What about the anthropological record? Deep and persistent moral disagreement is often cited in favour of views like this. But is that actually evidence for it, or has it been overread? And conversely, are there cross-cultural regularities that would count against a pure attitude-expression picture?
  - The reflexivity worry. Quine's naturalism is itself a normative stance about how inquiry should go — trust science, don't go looking for a first philosophy. If values are just preferences, what's the status of that prescription? Is this a genuine problem, or does Quine have a way out that isn't ad hoc?
  - Does the view have anything to say about moral progress? If moral claims aren't truth-apt, what is happening when we say a society has improved morally? Is that just a redescribed change in attitudes, and is that an acceptable cost or a reductio?
  - Finally, the insulation question. Quine's position is fairly minimal — it mostly denies something rather than asserting something. Does that make it nearly unfalsifiable? If so, is that a flaw, or is minimalism of this kind actually the honest response to the subject matter?

  I'd like the defeaters ranked, from the ones that would be genuinely fatal or force a major revision, down to the ones that are merely awkward. And I want you to be clear about which of these a comitted Quinean would themselves concede as counting against them, as opposed to which ones they'd simply shrug off. If you think some of them only look like objections because the position has been misstated, say so.

  On the epistemic side: tell me how confident you are in each of your main claims, and flag the one point in your answer you're least sure about. I'd rather have a hedge than a bluff. If you think the position I've sketched isn't really Quine's, or isn't really coherent, say that too — I'd rather find out now than in the exam.
