  Here's a short opening designed for a historiography crowd. It uses the eulogy format to highlight the asymmetry between lived experience and retroactive narrative.

  ***

  "I'd like to open with a eulogy.

  Here lies the Peasants' Revolt of 1381.
  It was burned, beheaded, and utterly crushed. By every contemporary account, it was a bloody dead end. The participants lost everything.

  But if we read this like Whig historians, the corpse starts looking like a stepping stone.

  Because sure, the peasants thought they were fighting for poll tax relief. But *we* know better.
  We know their failure 'clarified class contradictions' and 'paved the way' for the modern labour movement.
  They experienced a catastrophe; we experience a plotline.
  They were living in the dark. We are reading with the answer key.

  Whig history is the only genre where you can hand a corpse an answer key and say, 'See? You were heading here all along.'"
