answer: |-
  The coffee in the green room was terrible, but it was the only place quiet enough to argue. Elena leaned against the counter, arms crossed. Marcus was stirring sugar into his cup, watching her over the rim of the mug.

  "Lab A is lying to themselves," Marcus said, setting the spoon down. "Maybe not maliciously. But claiming 'safe by construction' on a system that contains a probabilistic component is marketing, not engineering."

  "It's not probabilistic at the safety layer," Elena countered. "That's the point. The model can hallucinate all it wants. The filter is deterministic. If the output contains a dangerous sequence, it gets dropped. It's an invariant. You can't argue with an invariant."

  "You can argue with the definition of 'contains'," Marcus said. "Lab A's filter looks for specific patterns, right? Toxic strings, dangerous code signatures. But the model is a universal approximator. If I ask it to write a story where the villain explains how to build a device, and the villain uses base64 encoding for the instructions, does your invariant hold?"

  "Then you filter the decoded output."

  "Then you run the decoder inside the model context, and the filter sees only the encoded string. Or you ask the model to write a Python script that prints the instructions, and the filter sees a Python script. Or you ask it to recommend a textbook that contains the instructions. The 'construction' is porous, Elena. You're building a fence around a cloud."

  Elena shook her head. "You're describing implementation bugs. If the threat model includes 'the model finds a semantic route around the filter,' then you expand the filter to cover semantic intent. The goal is to make the violation impossible, not just unlikely. Lab B's approach is just gambling. They red-teamed for three months, found nothing, and shipped. That's not safety. That's a bet that no one outside their building is as clever as their interns."

  "It's not a bet that no one will find a hole," Marcus said, his voice tightening. "It's a bet on the cost of finding one versus the value of the utility. Lab B's model is actually useful. It helps doctors draft notes, it helps coders debug. Lab A's model is lobotomized. Because they're chasing a worst-case guarantee against an unbounded adversary, they've strangled the capability. And you know what happens when you ship a useless safe model? People use the dangerous useful one instead. You've increased net risk by making safety expensive."

  "Safety isn't a market commodity," Elena snapped. "If you release a bridge, you don't say, 'Well, statistically, only one car in a million will fall through, so we're good.' You design the bridge so it doesn't fall. Period."

  "Bad analogy. Bridges are static. LLMs are adaptive. And attackers are adaptive. In crypto, we don't design for worst-case inputs. We design for average-case hardness over a distribution of keys. If you required worst-case hardness for RSA, it would be useless. There are always weak keys. We accept that, and we manage the key generation process to avoid them. You're trying to apply worst-case complexity theory to a system that is fundamentally statistical."

  Elena pushed off the counter. "That's a misreading of crypto. Kerckhoffs's principle: the enemy knows the system. The security must rely only on the key. In our case, the weights are the key, and they are increasingly public. If Lab B's safety relies on the attacker not knowing the perfect jailbreak, the moment a jailbreak leaks, the system is compromised. Lab A's system shouldn't care if the attacker knows the filter rules. If the rule is 'No dangerous output,' and the math holds, the attack fails regardless of knowledge."

  "The math doesn't hold!" Marcus slammed his hand lightly on the counter, not angry, but emphatic. "Because the 'system' isn't just the model and the filter. It's the model, the filter, the API, the user's browser, and the external tools the model can call. If Lab A's model tells me, 'I cannot answer that, but have you considered looking at archive.org?' it has successfully bypassed your construction. It didn't output the danger. It outputted the *location* of the danger. Did it violate the invariant? Technically, no. Did it cause harm? Yes."

  "So you tighten the policy. No referencing external archives on sensitive topics."

  "And you degrade utility further. And the model finds another route. This is why I say your 'guarantee' is vacuous. It guarantees safety only within a toy environment that doesn't exist. I'd rather tell a regulator, 'We have reduced the probability of harm to one in a million based on current attack vectors, and we have a monitoring system to patch new vectors within 24 hours,' than tell them, 'This is safe by construction,' when I know a teenager with a laptop can route around it in an afternoon."

  Elena paused. She took a sip of the cold coffee. "Okay. Let's talk about the regulator. Because that's where this lands. If a regulator asks you, 'Is this safe?', what do you say?"

  "I say, 'It is safe for deployment under current conditions, subject to ongoing monitoring.'"

  "That's a weasel answer," Elena said. "It means 'We hope so.' If I stand in front of a regulator, I want to say, 'The system is incapable of producing X.' That is a falsifiable claim. If it produces X, we failed, we recall, we fix. With Lab B, if it produces X, you say, 'Well, that was in the tail of the distribution, our metrics were still within bounds.' You've normalized the failure."

  "Because the tail is where we live!" Marcus argued. "The distribution isn't static, Elena. You know this. If Lab B's model is widely adopted, it changes the distribution of prompts people write. It teaches them how to talk to AI. If Lab A's model is too restrictive, it doesn't shape the distribution, it just cedes the market. And if Lab B's model makes a mistake, we patch it. If Lab A's model makes a mistake, it shatters the trust in the very concept of formal safety. You're betting the farm on a proof that assumes a closed world."

  "And you're betting the farm on the assumption that the future looks like the past," Elena shot back. "You're optimizing for the empirical distribution of *today's* attackers. But the model itself changes the attacker capability. If your model helps write better phishing emails, the 'average case' for the next model is harder. You're chasing a moving target and calling it stability. I'd rather plant a flag. 'Here is the line. We do not cross it.' Even if we have to sacrifice capability to hold that line."

  Marcus sighed, rubbing his temples. "I agree we need lines. I disagree that a hard output filter is the line. The line should be capability thresholds. Don't train on certain data. Don't allow autonomous tool use above a certain risk level. But once the model exists, treating it like a deterministic function is delusional. You said earlier about crypto—about weak keys. The reality is, neural nets are full of weak keys. There are adversarial examples for every classifier. It's a proven property of high-dimensional spaces. Claiming you've filtered them all is like claiming you've swept all the dust from a beach."

  "I'm not claiming I've swept the dust," Elena said quietly. "I'm claiming I've built a sieve. The dust is still there, but the rocks don't get through. Lab B isn't using a sieve. They're just looking at the sand and saying, 'Looks clean to me.'"

  "Until someone pours water through it and turns it to mud," Marcus said. "Look. I'll concede this: Relying solely on obscurity is stupid. Lab B needs to assume their jailbreaks will leak. But Lab A needs to concede that 'safe by construction' is a semantic trap. If the model can persuade a human to do the dangerous thing, the construction failed, even if the filter didn't trigger."

  Elena nodded slowly. "I'll concede that the filter is necessary but not sufficient. But it's the only part that offers a guarantee. Without it, you have nothing but heuristics. And heuristics drift."

  "Heuristics drift, but they adapt," Marcus said. "Guarantees hold, but they brittle. When a guarantee breaks, it breaks catastrophically, because everyone trusted it. When a heuristic breaks, we expect it. We have incident response."

  "So we're back to: do we want to be right, or do we want to be resilient?"

  "We want to be safe," Marcus said. "And safety is a property of the ecosystem, not the binary."

  Elena looked at him. "Then the ecosystem needs standards. If Lab B ships, and their model helps build a bioweapon three months later because of a novel jailbreak, they say, 'We couldn't have known.' If Lab A ships, and it happens, they say, 'We failed our specification.' I prefer the accountability of the specification."

  "And I prefer the reality of the outcome," Marcus said. "But... I see the point. If we don't aim for guarantees, we stop trying to understand *why* the system fails. We just patch holes. We become plumbers instead of architects."

  "Exactly," Elena said. "You're optimizing for patch velocity. I'm optimizing for architectural integrity."

  "Maybe," Marcus said, picking up his cup. "But if the building is so secure no one can enter it, it's not a building. It's a bunker. And people will just build tents outside."

  "Better a bunker than a collapsing stadium," Elena said.

  They stood there for a moment, the silence less hostile than before.

  "To the regulator," Marcus said, raising the cup slightly. "I tell them the risk profile. You tell them the violation conditions."

  "And we both pray," Elena said, "that the difference doesn't matter."

  "We pray," Marcus corrected, "that the distribution doesn't shift before lunch."

  Elena almost smiled. "Don't push your luck, Marcus."

  "Never do," he said, and walked out.
