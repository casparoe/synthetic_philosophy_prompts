prompt: |-
  I'm prepping for a podcast episode where the guest is Dr. Mara Ellison, a deterrence theorist who's been developing a view she calls the credibility lottery. The core idea, as I understand it: a nuclear threat is never credible if it's a bare intention, so the only way to make it credible is to hand part of the trigger to a process you don't fully control — a delegation to chance, or to lower-level commanders, or to a doctine that automates retaliation. But she goes further than the usual Schelling-style line: she says this is not a strategy states should choose, it's a trap they fall into, and that most of the apparent paradoxes of brinkmanship — the rationality of irrationality, the reciprocal fear of surprise attack, the stability-instability paradox — are artifacts of modeling the adversary as a unitary rational actor with common priors. Once you model the adversary as a Bayesian updater with private information and non-stationary beliefs, she thinks brinkmanship stops looking like a clever move and starts looking like a coordination failure. She also thinks the same logic applies to cyber and AI escalation, which is where I want to push her.

  I need 8 to 10 interview questions that go beyond letting her restate the view. Act as a political scientist and game theorist who knows this literature cold. Before you write the questions, brainstorm the main fault lines — where the view is strongest, where it's most vulnerable, and what the standard objections are — then draft the questions. I want at least one question each on: (1) the commitment problem and whether delegating to chance really solves it or just relocates it; (2) the difference between a threat and a warning, and whether her account can keep them apart; (3) the ethics of deliberately increasing the probability of accidental catastrophe; (4) the stability-instability paradox and whether her model actually predicts less low-level aggression or just different low-level aggression; and (5) whether the logic survives when the adversary is not a state — e.g., a non-state actor, or an AI system that doesn't have beliefs in the relevant sense. For each question, give a follow-up keyed to the answer she's most likely to give. Don't ask generic stuff like what got her into deterrence. If the framing I've given you is confused — say, if the credibility lottery is just the threat that leaves something to chance under a new name, or if the Bayesian-updating point doesn't do the work I think it does — tell me straight instead of humoring me. I'd rather have the questions rebuilt than get a polite set that misses it.
