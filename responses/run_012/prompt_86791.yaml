answer: |-
  **Project Title:** The Monotonicity of Advantage: A Structural Analysis of the Strategy-Stealing Argument

  **Project Summary**
  The strategy-stealing argument is a staple of combinatorial game theory, typically presented as a clever non-constructive proof that the first player must win in symmetric, no-draw games like Hex or Chomp. The standard pedagogical treatment frames it as a parlor trick: if the second player had a winning strategy, the first player could make an arbitrary opening move and then "steal" the second player's strategy, ignoring the extra piece on the board on the grounds that it can never hurt. This project proposes that this standard view obscures the argument's mathematical content. The core mechanism is not symmetry, but a specific claim about monotonicity: that adding an option (or a piece) to a player's available set never decreases the value of their position.

  This fellowship will support a one-year investigation to formalize the necessary and sufficient conditions under which strategy stealing holds. By treating the argument not as a binary switch but as a structural property subject to degradation, I will characterize exactly where the logic fails—such as in misère play, zugzwang positions, or games lacking determinacy—and what weaker conclusions survive in those contexts. The outcome will be a unified taxonomy of game structures that admit strategy-stealing proofs, moving the concept from a collection of ad hoc tricks to a rigorous theoretical framework.

  **Statement of the Question**
  Current literature treats strategy stealing as a binary property: either a game allows the argument, or it does not. This leaves the underlying structural dependencies undefined. The research question is: **What are the necessary and sufficient conditions on a game's payoff structure, information sets, and move availability such that a strategy-stealing argument validly implies a first-player win?**

  This question has a determinate answer in the form of a formal theorem characterizing the class of "strategy-stealable" games. The answer will specify the minimal monotonicity axioms required for the "extra move never hurts" intuition to hold, and it will delineate the boundary where "cannot lose" ceases to imply "must win" due to failures in determinacy.

  **Background and Significance**
  Standard treatments of strategy stealing focus on its epistemic output: it proves existence without providing a construction. Consequently, the argument is often dismissed as having limited utility beyond specific existence proofs. This view is insufficient for three reasons.

  First, it ignores the monotonicity assumption. In many games, having an extra piece restricts future moves or forces unfavorable exchanges. The standard argument glosses over why this does not happen in games like Hex. Second, it fails to account for systematic failures. In misère play (where the last player to move loses), the strategy-stealing argument often collapses because the "spare move" may force a player to take the final token. Similarly, in games with zugzwang, the obligation to move is a penalty, rendering the "arbitrary opening move" potentially fatal. Third, in infinite games, the inference that "the first player cannot lose, therefore the first player wins" relies on the Axiom of Determinacy. Standard expositions rarely distinguish between the failure of the steal itself and the failure of the determinacy assumption required to convert a non-loss into a win.

  By resolving these ambiguities, this project will clarify the relationship between option monotonicity and game value. This has implications beyond recreational mathematics, touching on computational complexity (why some games are hard to solve despite known winners) and economic game theory (the value of commitment and move order).

  **Methodology**
  The project will proceed in three phases, combining axiomatic formalization with comparative case analysis.

  *Phase 1: Formalization of Monotonicity (Months 1–3)*
  I will define a general game framework capable of encompassing finite, infinite, perfect, and imperfect information games. Within this framework, I will isolate the "Monotonicity of Options" axiom. This involves defining a partial order on game states where state $A$ is "greater than" state $B$ if $A$ offers a superset of options or advantages relative to $B$. The goal is to prove that strategy stealing is valid if and only if the game's valuation function is monotonic with respect to this order.

  *Phase 2: Boundary Analysis and Case Studies (Months 4–8)*
  I will test the formal conditions against specific classes of games where the standard argument is known to struggle.
  1.  **Misère Play:** I will analyze why the monotonicity claim fails when the winning condition is inverted. The objective is to formulate a "misère strategy steal" that yields a weaker bound (e.g., limiting the second player's margin of victory rather than proving a first-player win).
  2.  **Zugzwang and Costly Moves:** I will examine games where moves carry costs or where passing is forbidden. This will quantify the "penalty of the extra move" and determine if a modified steal argument can bound the cost of the opening move.
  3.  **Imperfect Information and Simultaneity:** In games where players move simultaneously or hide information, the "steal" is ill-defined because the first player cannot perfectly mimic the second. I will investigate whether a probabilistic or expected-value version of the argument holds.
  4.  **Infinite Games:** I will separate the monotonicity condition from the determinacy condition. I will construct examples where the steal proves the first player cannot lose, but where the game is undetermined, thereby showing the argument does not guarantee a win without additional set-theoretic assumptions.

  *Phase 3: Synthesis and Taxonomy (Months 9–12)*
  The final phase will integrate the findings into a taxonomy of game structures. I will draft the final monograph and prepare two journal articles: one on the axiomatic conditions for strategy stealing, and one on the specific failures in misère and infinite contexts.

  **Expected Results and Deliverables**
  The primary deliverable is a formal characterization theorem defining the class of strategy-stealable games. This theorem will explicitly state the monotonicity conditions required for the "extra move never hurts" claim to be valid.

  Secondary deliverables include:
  1.  A classification of "near-miss" games where strategy stealing provides a bound on the score rather than a binary win/loss result.
  2.  A clear distinction between failures of the stealing mechanism and failures of determinacy in infinite contexts.
  3.  Two peer-reviewed manuscripts and a working paper series.

  **Scope and Feasibility**
  This project is scoped for a one-year fellowship. It does not aim to solve open games (e.g., determining the winner of Chomp on arbitrary boards) but rather to solve the meta-question regarding the *method* of proof. The formal work in Phase 1 builds on existing extensive-form game theory but applies it to a specific logical structure. The case studies in Phase 2 are selected because they are well-documented in literature, allowing the focus to remain on the structural analysis rather than discovering new game properties. The risk lies in the possibility that the necessary and sufficient conditions turn out to be tautological (e.g., "stealing works when the game value is monotonic"). To mitigate this, the success criterion is not just defining the condition, but demonstrating its utility in predicting the argument's failure in the specific boundary cases (misère, zugzwang) where current intuition is vague.

  **Criteria for Success and Failure**
  Success is defined as producing a formal framework that correctly predicts the validity of strategy-stealing arguments across the selected case studies without ad hoc adjustments. Specifically, the framework must explain *why* the argument fails in misère play using the same axioms that show *why* it succeeds in normal play.

  Failure would consist of producing conditions that are either too broad (including games where the argument clearly fails) or too narrow (excluding standard cases like Hex), or if the analysis devolves into a restatement of known results without unifying them under the monotonicity hypothesis. If the "monotonicity" insight proves to be merely a restatement of the definition of a first-player win without offering predictive power regarding the argument's applicability, the project will be deemed to have not met its theoretical objectives.

  **Conclusion**
  The strategy-stealing argument is one of the few non-probabilistic existence proofs in game theory that is accessible yet deeply mysterious in its limitations. By shifting the focus from the trick to the structure, this project will clarify the relationship between move availability and game value. The result will be a robust theoretical tool for analyzing competitive structures where the advantage of moving first is assumed but not understood.
