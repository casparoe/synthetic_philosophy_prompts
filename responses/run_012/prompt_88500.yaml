  The notion of domination does crucial work interference-talk cannot by capturing structural vulnerability rather than discrete events. Consider the contented slave: if the master never actually interferes, negative liberty registers no violation. Yet, republican theory identifies unfreedom here because the subordinate lives at the mercy of another's choice. This relationship forces anticipatory conformity; you modify your behavior not because you are stopped, but because you know you *could* be stopped arbitrarily. Domination thus names a condition of powerlessness that exists independently of its exercise. It is not merely negative liberty with a modal qualifier about probability, but a qualitative shift from counting barriers to analyzing status. Freedom requires robust protection against arbitrary power, ensuring you stand as an equal peer rather than a subordinate subject, regardless of whether that subject chooses to act. Your friend calling it "negative liberty in careful dress" misses that non-domination requires changing the power relation itself, not just reducing interference rates. It is distinct because it targets the capacity for arbitrary interference embedded in social status, not the interference itself.
