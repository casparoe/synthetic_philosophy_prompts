prompt: |-
  For the past term I have been in a reading group on mental causation — two philosophers of biology, a physicist, and me — and I have ended up defending a position I did not expect to hold. I used to think the causal exclusion argument was close to decisive against non-reductive physicalism: if the physical realiser of a belief already suffices for the behaviour, and nothing is overdetermined, the belief looks like a causal dangler. I have come round to thinking that the argument only bites if one assumes a production conception of causation, on which a cause must push, generate, or transfer something into its effect. On a difference-making conception instead, where a cause is whatever an intervention on it would change the effect of, holding the rest of the system fixed, mental properties are not excluded at all, because intervening on someone's belief is simply not the same operation as intervening on the neural configuration that realises it. So my position is this: mental properties are causally efficacious, the physical does not crowd them out, and the exclusion argument is not so much refuted as an artefact of a mistaken metaphysics of causation which ought to be replaced rather than answered on its own terms.

  What I want from you is a map of how exposed that position actually is. What would count against it — which arguments, formal results, intuitions, or developments in neighbouring debates — and which of those should genuinely move me rather than merely irritate me? Please rank the objections, from the ones that would sink the view to the ones that would only make me shift in my seat, and be explicit about the difference. I am as interested in what someone who holds my view ought to concede as counting against them as in what critics say from the outside; I would rather hear the concessions a defender would make than a list of external complaints. And I would like you to be candid about whether the position has been insulated by its own manoeuvre: if I have defined causation so that the mental comes out efficacious, have I done any philosophical work, or have I merely relocated the problem into the choice of a theory of causation? What would distinguish a substantive defence from a verbal one?

  Three pressures I would particularly like you to develop. First, the generalisation question: if the exclusion argument threatens not only mental properties but the properties of any special science, then saving the mental by switching to difference-making causation saves biology, economics, and meteorology too — tell me whether that is a cost or a benefit, and whether a defender could consistently save the mental while giving up the rest. Second, permissiveness: a conception of causation generous enough to let beliefs cause behaviour may also let in disjunctive, gerrymandered, or merely correlated properties, and I want to know whether that consequence is acceptable or whether it is the sort of commitment that tells against the view; what would move me most would be a demonstration that the difference-making account either fails to apply to mental properties as we actually individuate them, or applies so liberally that it licenses causation by any arbitrary property whatsoever. Third, the rival conclusions: a friend in the group insists the whole dispute is verbal and that the two sides are talking past one another — say what would have to be true for him to be right, since that too would count against me, and tell me which position my view collapses into if the strongest objections land, whether property dualism, eliminativism about higher-level causation, or plain physicalism with a decorative vocabulary. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**

      *   **Context:** The user is part of a reading group on mental causation (philosophers of biology, physicist, user).
      *   **Current Position:** They have moved from thinking the Causal Exclusion Argument (CEA) defeats non-reductive physicalism (NRP) to thinking CEA relies on a "production" conception of causation. They now endorse a "difference-making" (interventionist) conception, where mental properties are causally efficacious because interventions on beliefs differ from interventions on neural states.
      *   **Core Claim:** Mental properties are efficacious; physical doesn't crowd them out; CEA is an artefact of a mistaken metaphysics of causation.
      *   **Task:** Map the exposure of this position. Rank objections (sink the view vs. shift in seat). Focus on concessions a defender *should* make, not just external complaints. Address whether the view is insulated/verbal.
      *   **Specific Pressures to Develop:**
          1.  *Generalisation:* Does saving mental causation save all special sciences? Cost or benefit? Can one save mental but drop others?
          2.  *Permissiveness:* Does difference-making let in too much (disjunctive, gerrymandered properties)? Is this acceptable?
          3.  *Rival Conclusions:* Is the dispute merely verbal? If objections land, what does the view collapse into (dualism, eliminativism, decorative physicalism)?
      *   **Tone/Style:** Candid, philosophical, British English.

  2.  **Deconstruct the Position:**

      *   **Label:** This is essentially a version of *Non-Reductive Physicalism via Interventionism* (akin to Woodward, List, Menzies).
      *   **Strength:** It bypasses the "causal closure of the physical" premise by redefining causation such that closure doesn't imply exclusion.
      *   **Weakness:** It risks making causation too easy (inflationary), potentially trivialising the claim that "mental causes matter." It also faces the "exclusion" problem in a new guise (proportionality/exclusion within interventionism).

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the position. It's a standard but robust move in contemporary metaphysics (Woodwardian). Validate the shift from production to difference-making.
      *   **The "Verbal" Worry (Insulation):** Address the candid question first. Is this just defining the problem away?
          *   *Distinction:* Substantive vs. Verbal. It's substantive if the interventionist framework has independent motivation (e.g., fits scientific practice) and imposes constraints (proportionality). It's verbal if it's *ad hoc* just to save the mental.
      *   **Pressure 1: Generalisation (Special Sciences):**
          *   *Analysis:* If difference-making saves the mental, it saves biology/economics.
          *   *Verdict:* This is a *benefit*, not a cost. NRP is usually motivated by the autonomy of special sciences.
          *   *Consistency:* Can you save mental but drop economics? Hard to do consistently without arbitrary line-drawing. If the view collapses here, it collapses into *Eliminativism about Higher-Level Causation* (only physics is real) or *Radical Pluralism*.
      *   **Pressure 2: Permissiveness (The "Too Many Causes" Problem):**
          *   *Analysis:* Interventionism can validate disjunctive properties or trivial correlations as causes if not constrained.
          *   *Key Constraint:* The Proportionality Constraint (Yablo, List & Menzies). A cause must be specific enough but not too specific.
          *   *Risk:* If the view accepts *any* difference-maker, it's trivial. If it accepts only "proportional" causes, it faces the challenge of showing mental properties are *more* proportional than neural ones.
          *   *Ranking:* This is a "Sink the View" risk if not handled. If mental properties aren't the *best* difference-makers, neural ones might still exclude them even on interventionism.
      *   **Pressure 3: Rival Conclusions & The Verbal Dispute:**
          *   *Friend's Claim:* Dispute is verbal.
          *   *Condition for Truth:* If "causation" is ambiguous and both sides are right relative to their definition, but neither definition is privileged for the metaphysical question "what moves the body?".
          *   *Collapse:* If the interventionist move fails, the view likely collapses into *Epiphenomenalism* (mental properties exist but don't cause) or *Reductive Physicalism* (mental properties just *are* the neural causes).
      *   **Ranking Objections:**
          1.  *The Proportionality/Exclusion within Interventionism:* (Sink the view). If neural states are better difference-makers, mental states are still excluded.
          2.  *The Triviality/Permissiveness Objection:* (Sink the view). If everything counts as a cause, causation loses explanatory power.
          3.  *The Generalisation Issue:* (Shift in seat). Mostly a feature, but forces commitment to special science realism.
          4.  *The Verbal Dispute:* (Shift in seat). Changes the meta-philosophical stakes but doesn't refute the utility of the view.

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction:* I need to make sure I don't just say "Woodward says X." I need to address the *user's* specific formulation. They say CEA is an artefact of mistaken metaphysics.
      *   *Nuance:* The "Realisation" relation is tricky in interventionism. If you intervene on the mental, you *must* change the physical (supervenience). Does this violate the "holding the rest of the system fixed" clause? This is the *Baumgartner Objection*. This is crucial. If you can't intervene on the mental without intervening on the physical, the variables aren't independent, and the causal graph breaks.
      *   *British English:* Ensure spelling (realise, defence, programme) and idiom fit.
      *   *Concessions:* What must the user concede? They must concede that mental causation is not "fundamental" in the same way physical causation is. They must concede that causation is interest-relative or model-relative.

  5.  **Final Polish:**

      *   Structure the response clearly with headings.
      *   Ensure the ranking is explicit.
      *   Check the "Verbal" question carefully.
      *   Make sure the "Collapse" scenarios are clear.

  6.  **Writing the Content (incorporating the above thoughts):**

      *   *Intro:* Validate the position (List & Menzies style).
      *   *Insulation:* Distinguish between *stipulation* and *theoretical utility*.
      *   *Pressure 1 (Generalisation):* It's a feature. Consistency requires accepting special science causation.
      *   *Pressure 2 (Permissiveness):* The Proportionality constraint is the defence. But the *Baumgartner* objection is the real killer here (can you intervene on M without P?).
      *   *Pressure 3 (Rival/Verbal):* If verbal, it's pragmatism. If it fails, it's epiphenomenalism.
      *   *Ranking:* 1. Baumgartner/Intervention Impossibility (Sink). 2. Proportionality/Neural Superiority (Sink). 3. Permissiveness (Shift). 4. Generalisation (Shift/Benefit). 5. Verbal Dispute (Meta-shift).

      *(Self-Correction during drafting)*: Wait, the Baumgartner objection is technical. I need to explain it simply. If M supervenes on P, you cannot change M without changing P. Interventionism requires changing the cause while holding other causes fixed. If P is a cause of Behaviour, and M supervenes on P, can you intervene on M while holding P fixed? No. So M looks excluded even in interventionist graphs *unless* you treat P and M as distinct variables in a specific way. I need to highlight this.

      *Revised Ranking:*
      1.  The Interventionist Exclusion (Baumgartner): Even on difference-making, if the physical is the *only* variable that can be independently manipulated, mental is excluded. (Sink)
      2.  Proportionality: If neural states are more proportional, they win. (Sink)
      3.  Permissiveness/Triviality: If causation is too easy, it's meaningless. (Shift/Sink depending on severity)
      4.  Generalisation: Commitment to special sciences. (Shift)
      5.  Verbal Dispute: Meta-philosophical deflation. (Shift)

      *Concessions:* Must concede causation is model-relative. Must concede mental causation isn't fundamental.

      *Collapse:* If it fails, it's Reductive Physicalism (mental = neural) or Epiphenomenalism (mental exists but doesn't cause).

      *Let's write.*
answer: |-
  Your position is a sophisticated and increasingly standard defence of non-reductive physicalism, closely aligning with the interventionist frameworks developed by philosophers such as James Woodward, Christian List, and Philip Pettit. You have effectively moved the goalposts from a metaphysics of *oomph* (production) to a metaphysics of *dependence* (difference-making). This is a robust manoeuvre, but it is not without significant exposure.

  You asked for candour regarding whether this is substantive work or merely verbal insulation, and for a ranked map of objections. I shall address the insulation worry first, as it colours how we assess the specific pressures, before moving to the three pressures you outlined and the ranking of objections.

  ### 1. Insulation and Substantive Work

  You ask whether you have done philosophical work or merely relocated the problem into the choice of a theory of causation. This is the charge of *ad hocery*.

  **The Verbal Worry:** If you select a difference-making conception of causation *solely* because it preserves mental efficacy, you have engaged in a verbal defence. You have defined 'cause' as 'whatever allows the mental to be a cause'. This is philosophically sterile.

  **The Substantive Defence:** The position is substantive if the interventionist framework is motivated by independent considerations—specifically, that it better captures scientific practice across the board, not just in psychology. If you argue that physics, biology, and economics *all* rely on difference-making relations rather than production chains, then your move is not a rescue mission for the mental, but a general reform of metaphysics that happens to have salutary effects for the philosophy of mind.

  **What you ought to concede:** To show this is substantive, you must concede that causation is not a monolithic, fundamental feature of the universe waiting to be discovered. You must accept that causation is *model-relative*. On your view, whether a belief causes an action depends on the variables included in your causal model. If you include only fundamental physical variables, the mental disappears; if you include mental variables, it appears. You must concede that there is no "God's eye view" of causation where the mental is either definitively in or out. If you are unwilling to concede that causal claims are relative to a level of description, your defence collapses into verbal stipulation.

  ### 2. The Three Pressures

  #### First Pressure: Generalisation (The Special Sciences)
  You ask whether saving the mental saves biology, economics, and meteorology, and whether this is a cost.

  *   **Analysis:** On an interventionist account, higher-level properties in biology (e.g., fitness) or economics (e.g., inflation) are difference-makers just as mental properties are. If you intervene on inflation (via interest rates), you change spending, holding micro-transactions fixed in the model.
  *   **Cost or Benefit:** This is a **benefit**. The primary motivation for non-reductive physicalism is usually the autonomy of the special sciences. If your view saves the mental but sacrifices biology, it is inconsistent, as mental properties are arguably no more distinct from physical properties than biological ones are.
  *   **Consistency:** Could you save the mental but give up economics? Only if you posit a sharp ontological discontinuity between the psychological and the socio-economic, which is difficult to sustain given that economics supervenes on psychology.
  *   **Concession:** You must concede that you are a **realist about special science causation**. You cannot be a sceptic about economic causation while defending mental causation. If you find yourself unwilling to defend the causal efficacy of 'inflation', your defence of 'belief' looks suspiciously parochial.

  #### Second Pressure: Permissiveness (The "Too Many Causes" Problem)
  A difference-making account is notoriously liberal. If causation is just counterfactual dependence, then the presence of oxygen causes the fire just as much as the striking of the match. Worse, it might validate disjunctive or gerrymandered properties (e.g., "the property of being a match-strike-or-a-lightning-strike").

  *   **The Risk:** If your view licenses *any* difference-maker as a cause, it trivialises causation. Everything is connected to everything else in the vast web of physical dependence.
  *   **The Defence:** Proponents usually invoke a **Proportionality Constraint** (drawing on Stephen Yablo). A cause must be specific enough to produce the effect, but not *too* specific. The belief is proportional to the action; the specific neural configuration is *too* specific (it rules out other neural realisers of the same belief that would have caused the same action).
  *   **What would move you:** You should be moved if it can be demonstrated that neural states are *more* proportional than mental states. If the neural state is the precise difference-maker, and the mental property is too vague (e.g., if 'believing it will rain' is too coarse-grained to explain the specific motor movements of grabbing an umbrella), then the mental is excluded even on difference-making grounds.
  *   **Acceptability:** It is acceptable to let in 'background conditions' (like oxygen) as causes, provided we distinguish them pragmatically from 'foreground' causes. It is *not* acceptable to let in arbitrary disjunctions. If your view cannot distinguish between a genuine mental cause and a gerrymandered disjunction of neural states, it loses explanatory power.

  #### Third Pressure: Rival Conclusions and the Verbal Dispute
  Your friend suggests the dispute is verbal. For him to be right, it must be the case that 'causation' is an ambiguous term, where the production theorist and the difference-making theorist are talking about different relations, both of which exist.

  *   **Condition for Truth:** The dispute is merely verbal if both sides agree on the non-causal facts (the physics, the supervenience relations, the counterfactual dependencies) and disagree only on the label 'cause'.
  *   **Why it counts against you:** If the dispute is verbal, your 'victory' is hollow. You have shown that mental properties are 'difference-making-causes', but the production theorist concedes this while insisting they are not 'production-causes'. If the original worry was about whether the mind has *ontological oomph*, showing it has *counterfactual dependence* might not satisfy the pre-theoretical intuition that drove the exclusion argument in the first place.
  *   **Collapse:** If the strongest objections land (specifically, that difference-making cannot save the mental without triviality), your view collapses into one of two positions:
      1.  **Reductive Physicalism:** Mental properties *are* physical properties, and they cause things only in virtue of being physical. (You lose non-reductivism).
      2.  **Epiphenomenalism:** Mental properties exist, but they are causally inert by-products. (You lose mental efficacy).

  ### 3. Ranking the Objections

  Here I rank the objections from those that would sink the view to those that would merely cause discomfort. I have distinguished between external complaints and internal concessions you should make.

  **1. The Interventionist Exclusion Argument (Baumgartner's Objection)**
  *   **Rank:** **Sink the View.**
  *   **The Argument:** Michael Baumgartner has argued that even within interventionism, mental properties are excluded. To test if $M$ (mental) causes $B$ (behaviour), one must intervene on $M$ while holding other causes of $B$ fixed. But since $M$ supervenes on $P$ (physical), and $P$ causes $B$, you cannot change $M$ without changing $P$. Therefore, you cannot perform the required intervention on $M$ independently of $P$.
  *   **Why it sinks you:** If valid, this shows that difference-making does *not* save the mental; it merely restates the exclusion problem in graph-theoretic terms. It implies that the variables are not distinct enough for the causal model to function.
  *   **Concession:** You must concede that your view requires a specific interpretation of 'intervention' that allows for supervenience bases to vary. If you cannot solve the technical problem of how to intervene on a supervenient property without violating the 'fixed background' clause of interventionism, the view is formally incoherent.

  **2. The Proportionality/Neural Superiority Objection**
  *   **Rank:** **Sink the View.**
  *   **The Argument:** Even if interventions are possible, the neural realiser might be a *better* difference-maker than the mental property. If the specific neural firing pattern is what makes the difference to the specific muscle contraction, and the mental property is too coarse-grained, then the neural state 'crowds out' the mental state even on difference-making grounds.
  *   **Why it sinks you:** This undermines the claim that mental properties are *distinctively* efficacious. It suggests that for precise prediction and control, we always ought to prefer the physical description.
  *   **Concession:** You must concede that mental causation is not *universally* superior. There will be cases (e.g., fine-grained motor control) where the neural description is the proportional cause. Your claim must be restricted to contexts where the mental abstraction is the relevant level of explanation.

  **3. The Triviality/Permissiveness Objection**
  *   **Rank:** **Shift in Seat.**
  *   **The Argument:** Difference-making makes causation too easy, validating absurd causes.
  *   **Why it only shifts you:** This is a problem for *all* difference-making accounts, not just yours. It can be managed by adding constraints (like proportionality or normality conditions). It weakens the punch of your claim (causation is less 'metaphysically heavy' than you might like), but it does not refute the core claim that mental properties are among the causes.
  *   **Concession:** You must concede that 'causation' is less exclusive than common sense suggests. Many properties will be causes of a single event. You lose the intuition that there is *one* true cause.

  **4. The Generalisation Pressure**
  *   **Rank:** **Shift in Seat.**
  *   **The Argument:** Saving the mental saves economics and biology, which some find ontologically profligate.
  *   **Why it only shifts you:** As noted, this is largely a benefit. It only becomes an objection if you are committed to a form of physicalism that denies causal efficacy to higher-level sciences.
  *   **Concession:** You must concede that you are not a 'fundamentalist' about causation. You must accept that causal facts are not written into the bottom level of reality.

  **5. The Verbal Dispute Objection**
  *   **Rank:** **Shift in Seat.**
  *   **The Argument:** You and the production theorist are talking past each other.
  *   **Why it only shifts you:** Even if true, it does not refute your position; it merely reclassifies it as a pragmatic recommendation rather than a metaphysical discovery. It suggests you should stop claiming to have 'solved' the exclusion problem and start claiming to have 'dissolved' it.
  *   **Concession:** You should concede that you are not describing a mind-independent relation. You are advocating for a conceptual framework that is more useful for understanding agents.

  ### Summary of the Position's Exposure

  Your position is robust against the *original* formulation of the Exclusion Argument, but it is highly exposed to **technical refinements of the interventionist framework itself** (specifically Baumgartner's objection regarding supervenience and intervention).

  **What distinguishes a substantive defence from a verbal one?**
  A verbal defence says: "I define causation as X, and under X, the mental causes."
  A substantive defence says: "Causation *is* X (for independent reasons regarding scientific methodology), and under X, the mental causes, *and* X imposes constraints (like proportionality) that prevent triviality."

  To maintain the substantive defence, you must be willing to accept that mental causation is **real but non-fundamental**, and **model-relative**. If you insist that mental causation is as fundamental as physical causation, or that it holds independently of our causal models, your view will collapse under the weight of the Interventionist Exclusion Argument. If you accept these concessions, you have a viable, albeit deflated, non-reductive physicalism.
