          *   *Implication:* If she were Strict Chesterton, she would evaluate the written portfolio on its merits against the oral exam. She might still vote against it, but her reasoning ("scheme nobody's run") implies a *presumption against untested novelty*, which is Burkean. Strict Chesterton doesn't inherently privilege "decades of use" over "logical improvement" once the purpose is understood.

