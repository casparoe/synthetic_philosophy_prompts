          *   Here: Purpose is good. New thing is *lightly* tested.
          *   Nadia's threshold for "tested" seems high ("decades"). A pilot at three papers is not "decades."
          *   *Prediction:* She votes **Against** (or for a much longer pilot). She sees the Two-Source Rule as a cultural bulwark (like the Oral Exam) rather than just a procedural filter.

      *   *Wait, let's look closer at the "Standards Editor" detail.*
          *   Nadia respects institutions. A 20-year veteran proposing change *from within* might sway her more than an external reform.
          *   However, her Case 3 reasoning ("scheme nobody's run") suggests she distrusts *process changes* to *cultural rituals*.
          *   The "Old Guard" argument ("different beats") is the kind of specific, contextual skepticism she likes. It says "The map is not the territory."
          *   *Final Lean:* **Against.** She is a Burkean, not just a Chestertonian. The burden of proof is on the changer to show the *cultural* function is preserved, not just the *metric* (corrections). The study measures corrections, not "culture of verification."

  5.  **Drafting the Response:**

      *   **Verdict:** Against (or skeptical).
      *   **Rule:** Pragmatic Burkean (Presumption for tradition unless new way is *proven* to sustain the *full* function, not just the measurable output).
      *   **Why:** Case 3 is the smoking gun. It shows she rejects change even when the old purpose is known and good, if the new method lacks deep track record.
