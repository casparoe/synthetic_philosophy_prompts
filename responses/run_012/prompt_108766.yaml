answer: |-
  Here is the breakdown of Nadia's operating system, my prediction for your committee, and the limits of that prediction.

  ### The Verdict
  **Nadia would be against the proposal.**

  She would likely argue that while the *manifest* purpose of the two-source rule (accuracy) is understood, the *latent* functions (newsroom culture, the habit of skepticism, the shared burden of verification) are not fully captured by the pilot study's metrics. She would side with the "Old Guard" that the study is thin and the beats are different, viewing the two-source rule not as a procedural hurdle but as a cultural ritual analogous to the oral qualifying exam.

  ### The Rule She Is Running
  She is not running a strict **Chestertonian** rule ("Oppose only when the purpose is unknown"). She is running a **Pragmatic Burkean** rule ("Presume in favor of the enduring institution; the burden of proof is on the reformer to show the new system sustains both the manifest and latent functions of the old one").

  **Why the distinction matters:**
  *   **Strict Chesterton:** Once you identify the purpose of the fence (e.g., "accuracy"), the fence loses its magical protection. You then judge the proposed change on its merits. If the new system is more efficient and equally accurate, you take it.
  *   **Pragmatic Burke:** Identifying the purpose is necessary but *not sufficient*. Even if you know the purpose, the fact that the old rule has survived for decades creates a presumption that it contains "latent wisdom" (habits, culture, unintended benefits) that a new scheme cannot immediately replicate. The reformer must prove the *new* system has a track record, not just a theory.

  ### The Evidence: Why Case 3 is the Key
  You noted that her record fits both rules. It doesn't. **Case 3 (The Oral Exam)** breaks the Strict Chesterton model.

  *   **In Case 3:** The purpose of the oral exam was *known* ("tests whether you can defend work... drags you into culture"). Under Strict Chesterton, the fence is "understood," so the gate is open to evaluate the portfolio on its merits.
  *   **Nadia's Verdict:** She opposed the change anyway.
  *   **Her Reasoning:** "You don't swap out something that's been doing that job for decades on the strength of a scheme nobody's run."

  This is pure Burke. She privileges *time* and *embedded practice* over *theoretical efficiency*. She acknowledges that the "culture" aspect of the exam is hard to replicate in a portfolio.

  **Applying this to your Newspaper:**
  The Two-Source Rule is the journalistic equivalent of the Oral Qualifying Exam. It is a decades-old ritual that defines the profession's culture.
  *   **The Proposal:** Like the portfolio, it promises efficiency (fewer killed stories) and claims equal accuracy (study shows fewer corrections).
  *   **The Flaw (in Nadia's eyes):** The study is "thin" and the pilots were "different beats." This mirrors her objection to the "scheme nobody's run." To a Burkean, a pilot at three other papers is not the same as *prescription* (long-standing usage) at *your* paper.
  *   **The Stake:** In Case 6 (Tenant Notice), she supported change because the purpose of the old rule was "shielding landlords from mild inconvenience." That is a low-value tradition. In your case, the tradition protects "truth." High-value traditions get a much higher burden of proof for removal.

  ### Confidence and Value
  **How much is this worth?**
  I would bet money on this, but not the house. I'd say **75% confidence**.

  The pattern is strong, specifically the weighting of "decades of function" over "new schemes." However, human consistency is rarely 100%, and the variable of the **Standards Editor** introduces noise. Nadia respects institutional memory (Case 5: Constitution; Case 3: Department Culture). The fact that the change is proposed by a 20-year veteran "not a person who wants to burn the place down" might soften her stance compared to an external reformer.

  **What would change my mind (The Counterfactuals):**
  1.  **If the pilot had been internal:** If the "documented-provenance" rule had been used informally at *your* paper for five years with good results, Nadia would likely support codifying it. She accepts evolution within a tradition; she resists replacement by external schemes.
  2.  **If the "Old Guard" argument was about power, not craft:** If the people opposing the change were clearly using the rule to protect their own turf (like the Notary connections in Case 2), she would turn on them. If you can show her that the two-source rule is currently being used to block stories for political reasons rather than accuracy, she might vote For.
  3.  **If the study measured "culture":** If the pilot study showed that the new rule *improved* the culture of verification (e.g., junior reporters learned faster), she might accept that the latent function is preserved.

  **Where my read is most likely to be wrong:**
  I could be underestimating her commitment to **Case 1 (The Sand Bucket)**.
  In Case 1, she kept a rule *nobody understood*. In your case, everyone understands the rule. Is it possible she is a "Chestertonian Fundamentalist"? i.e., *Once the purpose is known, the Burkean presumption evaporates?*
  If she is, she would look at the study (fewer corrections, no more retractions) and say: "Purpose is accuracy. New rule achieves accuracy better. Fence comes down."
  **Why I doubt this:** Her reasoning in Case 3 explicitly ties the *duration* ("decades") to the *validity* of the rule, independent of just knowing the purpose. She didn't say, "The purpose is culture, and portfolios can't do culture." She said, "Don't swap decades for a scheme." The *age* of the rule was part of the argument, not just the function.

  ### Summary for your Committee Meeting
  If you want to anticipate her argument, do not expect her to say "We don't know what the two-source rule is for." She knows exactly what it's for.

  Expect her to say: **"Accuracy metrics aren't the only thing that rule does. It builds a habit of skepticism. A three-paper pilot with a thin study doesn't prove that habit survives the transition. Until the new rule has 'decades' of its own, or the study proves the cultural function is intact, the presumption stays with the rule that has kept us honest since the fifties."**

  To win her over, you don't argue about accuracy. You argue about **continuity**. You need to show how the new rule *preserves the ritual* of verification, even if it changes the source count. If you frame it as "evolving the tradition" rather than "replacing the fence," you might get her vote.
