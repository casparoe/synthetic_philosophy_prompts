      *   *Hypothesis A (Strict Chesterton):* Oppose change ONLY if purpose is unknown. If purpose is known, judge on merits.
      *   *Hypothesis B (Strong Burkean):* Presumption against change. Even if purpose is known and good, the burden is on the changer to prove the new way works *as well as* the old way over time.

      *   *Testing against Case 3 (Oral Exams):*
          *   Purpose: Known (defense/culture).
