          *   *Analysis:* This is the pivot point. Purpose is *known* and *good*. Yet she opposes change. This leans *Burkean*. Strict Chesterton says if you know the purpose, you can evaluate the change on merits. She is adding a burden of proof on the *new scheme* ("nobody's run"). She values the *track record* of the old way over the *theory* of the new way.

