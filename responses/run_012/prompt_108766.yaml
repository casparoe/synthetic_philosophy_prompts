          *   *Decision:* I lean towards **Against** (or at least, highly skeptical/delaying). Why? Because Case 3 is the strongest signal of her specific flavor of conservatism. She values the *embedded culture* (Oral Exam) over *theoretical efficiency* (Portfolio). The Two-Source Rule is embedded culture. The Provenance Rule is theoretical efficiency (even with a pilot). The "thin study" and "different beats" arguments validate her Case 3 concern that "you don't swap out something that's been doing that job for decades on the strength of a scheme [with a thin study]."
