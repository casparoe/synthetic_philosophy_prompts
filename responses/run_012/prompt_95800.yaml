prompt: |-
  I've got zero philosophy training — I'm a self-taught mechanic, I restore old trucks in my garage and I can read a shop manual cover to cover — but I've been going back and forth with a buddy about whether being sick is a fact or an opinion. Far as I can tell the fight is between the people who say disease is just biology, some part of you not doing what it's supposed to, and the people who say "supposed to" only means something once you say what you want the body for and what everyone else expects of it. Naturalists and normativists, I think? I dont remember which is which, and I've read alot about it lately.

  What I want: take that whole argument and rebuild it in the language I actually use. Shop specs, tolerances, service limits, wear items vs. real faults, factory intent, "it's within spec but it's tired," modified motors, backyard fixes. Be as faithful as you can, and then tell me what didn't make the trip.

  Use these as the test cases, because they're what keeps tripping me up. My steering box has play that's nothing on the tractor and scary in my buddy's car. The manual says a quart of oil every 800 miles is normal, but no mechanic I know would call that motor healthy. I've got a truck that runs perfect and nobody wants it because the paint's gone. And here's the thing I can't get past: the manual exists because somebody at the factory decided what the car is for. Who wrote ours?

  Then the residue report: what came across clean, what you had to fudge, what has no counterpart in my vocabulary at all, and whether the leftovers mean my way of talking is missing something real or that the philosophers are fighting about less than they think. Don't hand me a reading list, I'm not going to read papers. Just argue it out.
