answer: |-
  Dear Colleague,

  It is a rare privilege to have three years of protected time, and the ambition you are describing fits that rarity well. The unity of the proposition is one of those problems that looks like a graveyard of discarded theories, but that is precisely why it remains live. If it were easily solved, it would not keep returning. Your suspicion that the standard exits are answering the wrong question is not only worth three years of work, it is arguably the only way to make progress that speaks to both metaphysicians and formal semanticists. However, there is a sharp line between dissolving a problem because it is malformed and changing the subject because the problem is hard. To ensure you are doing the former, your agenda must be disciplined by the constraint you have imposed on yourself. The single-primitive constraint is severe, and that is its virtue. It forces you to stop treating propositions, facts, and judgments as interchangeable vessels for unity and demands an account of how they differ. If you can show that existing theories violate this constraint systematically, you will have produced a negative result that is more valuable than a shaky positive theory. The risk is that you spend three years arguing that everyone else is confused without offering a clearer picture of what confusion-free work looks like. To avoid this, you need to treat your suspicion not as a conclusion but as a methodological filter that generates specific, tractable questions.

  The most upstream question you must tackle, and the one that determines whether anything can pass your constraint, concerns the individuation of constituents independent of the proposition they inhabit. Most accounts of unity presuppose that we know what the constituents are before we ask how they are united, but if the identity of a constituent depends on its role in a unified whole, you have smuggled unity into the relata. This is where the metaphysicians in your department will engage you. You need to determine whether there is a category of entity that can be specified without reference to predicative structure. If there is not, then the regress is not benign; it is vicious, because the inputs to the unifying operation are already outputs of it. Progress here within three years would not be a final ontology but a impossibility proof showing that any account treating constituents as independent particulars fails to recover predication. Alternatively, if you can articulate a notion of constituent that is prior to unity—perhaps using a fine-grained metaphysics of dependence—you will have cleared the ground for a non-circular account. This is tractable with existing tools in fine-grained metaphysics and ground theory, but it requires you to resist the temptation to solve the binding problem before you have secured the relata.

  Once the status of constituents is addressed, the second priority is to disentangle the unity of propositions from the unity of facts. Your single-primitive constraint explicitly forbids using the same unexplained primitive for both, yet most theories slide between them. Metaphysicians often care about facts as truthmakers, while semanticists care about propositions as contents, but the unity problem arises in both domains for seemingly different reasons. A fact is unified because the world is a certain way; a proposition is unified because it represents the world as being a certain way. If you treat these as the same kind of unity, you will fail your own test. The work here is to show that the direction of fit matters for unity. Progress would look like a distinction that forces a bifurcated theory: one account for the metaphysical glue of facts and another for the semantic glue of propositions, or a demonstration that one reduces to the other without residue. This is where you can engage the semanticists. If the unity of the proposition is a feature of how content is computed rather than what content is, then the metaphysical unity of facts might remain primitive while the semantic unity is explained by derivation. This leads directly to the third question, which is the semanticist's version of your problem: the gap between a derivation of a meaning and the meaning itself.

  The question of whether composition rules belong to the content or are merely facts about how we compute it is the seam you identified, and it is the most tractable place for formal work. Current structured meaning theories often treat the structure as part of the content, but this invites the regress because the structure itself needs unifying. If you can model a system where the derivation yields a value that does not require a further unifying relation to be a content, you will have made substantial progress. This might involve adopting a type-theoretic framework where the well-formedness of the type guarantees unity, effectively making unity a syntactic constraint rather than a metaphysical addition. Progress here would be a formal model that satisfies your single-primitive constraint by showing that semantic unity is a byproduct of computational validity while metaphysical unity is a primitive of the world. This would satisfy both audiences: the semanticists get a working model of composition without mystery, and the metaphysicians get a clear boundary where explanation stops and reality begins. If you can translate the vocabulary of binding relations into the vocabulary of type constraints, you will have achieved the kind of translation that counts as real progress in this field.

  However, you must be honest about what not to work on. Do not spend time on act-theoretic accounts unless you can formalize the act types in a way that constrains truth conditions. Purely psychological explanations of unity will alienate the semanticists and leave the metaphysicians unsatisfied because they treat the proposition as a mental event rather than a shareable content. Similarly, avoid historical exegesis of Russell or Bradley beyond what is necessary to set up the problem. The literature is saturated with interpretations of what Russell meant by the unity of the proposition; what is missing is a working theory that avoids the regress without dissolving the proposition into a set. You should also avoid trying to solve the problem for all types of propositions at once. Focus on atomic predication first. If you cannot solve it for a simple subject-predicate structure, solving it for quantified or modal propositions is premature. Many researchers generalize too quickly to complex contents to hide the failure at the atomic level. Stick to the simplest case where the regress is most vivid.

  The strongest reason to think this area is a dead end, and the one you must be prepared to confront, is that unity is simply a primitive feature of reality that cannot be explained without circularity. If propositions are fundamental entities, then asking what unifies them is like asking what unifies an electron. It is a category mistake to demand a binding relation for something that is essentially unified. If this is true, your suspicion that the question is malformed is correct, but not in the productive way you hope. It would mean the project is not to explain unity but to argue that it is a brute fact. This is the nihilist option regarding the problem. To avoid this being a mere avoidance of the hard problem, you must show that treating unity as primitive creates more problems than it solves, such as an explosion of primitive facts or an inability to explain falsity. If you can demonstrate that primitivism about unity leads to unacceptable metaphysical costs, then your project of seeking an explanation is vindicated. If you cannot show those costs, then you risk spending three years arguing for a primitivism that others already hold.

  Ultimately, whether your suspicion is worth three years depends on whether you can turn the reframing into a constraint that rules out specific theories. If your conclusion is merely that we should ask a different question without showing why the old questions lead to contradiction, you will be accused of changing the subject. But if you can use your single-primitive constraint to prove that a whole family of views is incoherent because they conflate facts, propositions, and judgments, you will have carved out a significant contribution. The goal should not be to publish a final theory of unity, which may be impossible, but to map the logical space such that future work cannot ignore the distinctions you have drawn. Aim for a pair of papers: one demonstrating the failure of extant views under your constraint, and one offering a formal sketch of how semantic derivation can mimic unity without invoking a binding relation. This is enough for a postdoc worth of time and establishes you as someone who clarifies foundations rather than just building on them. The risk is real, but the potential to reset the terms of the debate for both metaphysicians and semanticists is worth taking.
