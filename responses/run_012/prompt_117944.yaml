      *   *Thesis 4 (Political Consent):*
          *   Claim: Laws affecting the group require group consensus.
          *   Truth Condition: The group is a political sovereign.
          *   Verdict: False/Impossible (minorities don't get veto).
          *   Faction: Faction A (Oppose bill).
          *   Proves too much? Paralyzes all legislation affecting minorities (taxes, safety laws).
      *   *Thesis 5 (Moral Sovereignty):*
