      *   Say: "We aren't doing math proofs today, we're looking at incentive structures."

  7.  **Final Question:**
      *   Needs to test structural understanding, not memory.
      *   "How do we change $r$ in our project process?" or "Identify the 'Loser Penalty' in our current roadmap."

  8.  **Drafting the Plan (Iterative refinement):**
      *   *Time Check:* 40 mins.
      *   0-5: Intro & Rules.
      *   5-15: The Game (Play $r=0$). *Wait, user wants to walk through r=1, 1/2, 0.* Okay, I need to advise on pacing. If they play all three, it will drag. I will suggest playing $r=0$ live, and simulating $r=1$ mentally. *Actually, reading the prompt again:* "I'll walk through r = 1, then r = 1/2, then r = 0." Okay, I must respect the user's plan but optimize it. I will advise making the $r=1$ and $r=1/2$ parts very fast "thought experiments" so there's time for the debrief.
      *   *Correction:* The user's plan is to *teach* through the parametrized version. I should support this but warn that playing 3 auctions takes too long. Suggest: Explain $r=1$ (no game), Explain $r=1/2$ (hypothetical), Play $r=0$ (real).
      *   *Wait, one more thing:* The "Locally Rational Step." This is the crux. It happens when Bid > Prize. I need to make sure the facilitator pauses exactly there.
      *   *Misconceptions:* Address them *during* the debrief, not before. Let the feeling sit first.
      *   *Scaling:* The "Loser" in a company isn't a person, it's the *sunk budget*. The "Penalty" is the write-off.

  9.  **Refining the "Spine" Advice:**
      *   Is $r=1 \to 0$ right? Yes, it proves it's structural. But don't play three games. Use the "Walkthrough" as a whiteboard explanation, then play the final one.
      *   Why? Because playing $r=1$ is boring. Nobody bids past \$1. It kills energy.
      *   *Recommendation:* Explain $r=1$ and $r=1/2$ on the whiteboard to establish the *rule change*. Play $r=0$ live to generate the *emotion*.

  10. **Final Polish:**
      *   Tone: Professional, actionable, peer-to-peer.
      *   Structure: Time-boxed segments.
      *   Specific scripts for the "Kill Points."

  11. **Self-Correction on "Loser" in Company Context:**
      *   In the auction, the *Loser* pays. In a project, who pays if we quit? The *Manager's Reputation* or the *Department's Budget*.
      *   If I cancel a project, the budget is gone (Loser pays). If I continue, I spend more but might deliver (Winner pays bid, gets value).
      *   The "Loser Penalty" is the *recognition of loss*.
