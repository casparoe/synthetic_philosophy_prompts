prompt: |-
  I'm running a lunchtime session at work on escalation of commitment -- 40 minutes, a dozen PMs and engineers, no econ background -- and I want to teach it thru the dollar auction instead of the usual doomed-project war story. Don't explain the idea to me, plan how I explain it.

  I'm going to use a parametrized version: winner pays their bid and takes the dollar, loser pays their bid too but gets a fraction r of it back, and I'll walk through r = 1, then r = 1/2, then r = 0. My hunch is that at r = 1 theres no trap at all and the trap shows up continuously as r falls, which should make the escalation feel inevitable rather than like a magic trick -- tell me if that's the right spine, or whether I should just do r = 0 straight and skip the warm-ups.

  What has to come first, what depends on what, and where in the sequence does the locally-rational step actually live? I want them to feel that dropping out at 90 cents is the crazy move and continuing is the sane one, and that nobody in the room has to be greedy or stupid for any of it to happen. Which misconceptions should I expect -- I'm betting on "this is just the sunk cost fallacy", "they just need more discipline and know when to quit", and "the auctioneer is tricking them" -- and at what exact point in the sequence do I kill each? What does the auction give me as a carrying example that a failing-project anecdote doesn't, and what do I have to bolt onto it to get from two bidders to a whole company?

  Also tell me what to openly skip at this level and say so out loud (I assume anything with subgame-perfect in it), and give me one question to ask at the end that would show they've got the structure and not just the story.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

