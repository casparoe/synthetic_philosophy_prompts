answer: |-
  Here is the battle plan for your 40-minute session.

  ### 1. The Spine: Validate and Compress
  Your hunch is correct: the $r=1 \to 0$ spine is superior to jumping straight to $r=0$. It proves the behavior is **structural**, not psychological. It removes the "people are stupid" defense.

  **However, do not play three full auctions.** You will run out of time, and the $r=1$ auction will be boring (bidding stops at \$1.00).
  *   **$r=1$ (The Control):** Do this as a **whiteboard thought experiment**. Ask: "If I bid 90c and lose, I get 90c back. Do I bid \$1.10?" They will say no. Establish that the trap *cannot* exist here.
  *   **$r=1/2$ (The Bridge):** Briefly mention this on the slide. "If I lose 90c, I get 45c back. My loss is 45c. Do I bid \$1.10 to lose only 10c?" Show the math, don't play it.
  *   **$r=0$ (The Trap):** **Play this live.** This is the only round where money (or candy/points) changes hands. This generates the visceral emotion you need for the debrief.

  ### 2. The Sequence & Dependencies
  You have 40 minutes. Strict timeboxing is required.

  *   **0:00–0:05: Rules & Parameters.**
      *   Define the prize (\$1 bill or equivalent).
      *   Define the rule: Winner pays bid, gets \$1. **Loser pays bid, gets $r$ back.**
      *   *Dependency:* They must understand the **Loser Penalty** before they bid. Write the formula for "Net Loss if I Quit" on the board: $Loss = Bid \times (1-r)$.
  *   **0:05–0:10: The $r=1$ Thought Experiment.**
      *   Ask the room: "Bidding is at 90c. If I quit, I lose 0. If I bid \$1.10 and win, I lose 10c. Do I bid?"
      *   Wait for the "No."
      *   *Point:* Without a loser penalty, rationality holds.
  *   **0:10–0:25: The $r=0$ Live Auction.**
      *   Start bidding at 5c.
      *   **Crucial Facilitation:** When bidding crosses \$1.00 (e.g., \$1.05 vs \$1.00), **pause the room**.
      *   Ask the \$1.00 bidder: "If you quit now, you pay \$1.00 and get nothing. If you bid \$1.10 and win, you pay \$1.10 and get \$1. Your loss is 10c. 10c is better than \$1.00. Do you bid?"
      *   Let them bid. Let it escalate to \$3–\$5 or until they revolt.
  *   **0:25–0:35: The Debrief (Killing Misconceptions).**
      *   See section 3 below.
  *   **0:35–0:40: Mapping to Work & Closing.**
      *   See section 4 below.

  ### 3. The Locally Rational Step & Misconceptions
  The "Locally Rational Step" lives **exactly at the first bid over \$1.00**.
  This is where you must intervene. The room will laugh and say "That's crazy." You must show them the math:
  *   **Option A (Quit):** Loss = Current Bid (e.g., 90c).
  *   **Option B (Bid \$1.10):** Loss = Bid - Prize (e.g., 10c).
  *   **Logic:** Minimizing loss is rational. Therefore, bidding \$1.10 is the *only* rational move.

  **Kill the Misconceptions here:**

  | Misconception | When it arises | How to kill it (Script) |
  | :--- | :--- | :--- |
  | **"This is the Sunk Cost Fallacy."** | During debrief. | "Sunk cost says 'ignore the past.' I am asking you to **minimize future loss**. Ignoring the 90c you already spent guarantees you lose 90c. Spending 10c more guarantees you lose only 10c. This isn't looking backward; it's forward-looking loss aversion." |
  | **"They just need discipline to quit."** | When they say "I would have stopped." | "Discipline implies fighting an emotion. I just showed you the math where quitting is the **more expensive option**. Would you have the discipline to choose the more expensive option? No. The incentives forced your hand." |
  | **"The Auctioneer is tricking them."** | If they blame you/rules. | "I am passive. I take no risk. The bidders create the loss for *each other*. In your company, who is the auctioneer? Usually, it's nobody. It's the budget structure itself." |

  ### 4. From Auction to Company (The Mapping)
  The auction isolates the mechanism, but work is messier. You need to bolt on **visibility** and **stakes**.

  *   **The Dollar:** The Project's ROI / Business Case.
  *   **The Bids:** Engineering hours / Budget spent.
  *   **The Loser Penalty ($r=0$):** This is the critical mapping. In a company, who pays if we cancel?
      *   *It's not the money.* The money is gone either way.
      *   *It's the Reputation/Career Capital.* If I cancel, I am the PM who killed a project. If I continue, I am the PM fighting to ship.
      *   *It's the "Waste" Narrative.* Admitting the spend was a loss hurts more than spending more to "try to save it."
  *   **The Two Bidders:** This is the hardest mapping. In the auction, it's You vs. Opponent. In work, it is often **You vs. Your Past Self** (the version of you that started the project) or **Project A vs. Project B** (fighting for the same budget).
      *   *Advice:* Frame it as "The Project vs. The Alternative Investment." Every dollar you put into the doomed project is a dollar not spent on a new one. The "Loser" is the Opportunity Cost.

  ### 5. What to Openly Skip
  You have no econ background in the room. Do not pretend otherwise.
  *   **Say this:** "Economists call this 'subgame perfect equilibrium' and write papers on the Nash strategies. We are skipping that. We care about the **incentive structure**, not the proof."
  *   **Skip:** Mixed strategies, expected utility calculations, infinite horizon arguments.
  *   **Why:** It creates distance. You want them feeling the trap, not analyzing it from a distance.

  ### 6. The Closing Question
  Do not ask "What did we learn?" (They will say "Don't bid too much").
  Ask a diagnostic question that forces them to find the parameter $r$ in their actual work.

  **The Question:**
  > "Think of a project currently on your roadmap that is slipping. If we cancel it today, what is the specific penalty you pay that you *don't* pay if you ship it late and over budget? That penalty is your $r$. How do we lower it?"

  **Why this works:**
  *   It identifies the **Loser Penalty** (Career risk? Budget write-off rules? Executive perception?).
  *   It shifts the solution from "try harder" to "change the structure."
  *   It proves they understand the mechanism, not just the story.

  ### Summary Checklist for You
  1.  **Props:** One real dollar bill (or distinct prop), Whiteboard.
  2.  **Visual:** Write $Loss_{quit} = Bid$ and $Loss_{win} = Bid - 1$ on the board.
  3.  **Pacing:** Hard stop the auction at 25 mins even if they are still going. The debrief is more important than the winner.
  4.  **Tone:** Empathetic. Validate that *you* would have kept bidding too. The point is that the room is rigged, not that they are weak.
