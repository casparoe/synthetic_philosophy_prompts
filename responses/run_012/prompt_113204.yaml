  To: Exhibits Committee
  From: [Your Name]
  Date: [Current Date]
  Re: Dead Theories Gallery Labels

  After 35 years in spectroscopy, I've learned that data rarely fits a binary. This debate mirrors a classic tension: is science a graveyard of errors, or a ladder of progress? Both sides here have merit.

  The Director is right that clarity matters. School groups need to know phlogiston isn't hiding in the room. Ambiguity fuels skepticism. If we hedge too much, we imply all ideas are equally valid, which undermines scientific authority. We owe the public the current consensus.

  The Curator is right that "wrong" is historically clumsy. As she notes, the math for the luminiferous aether became field theory without changing a symbol. Calling that "wrong" erases the continuity of discovery. It suggests scientists were blind rather than building scaffolding. Science is rarely a clean break; it is usually a renovation.

  However, adopting either position fully creates new problems. The Director's approach is too reductive; the Curator's is too obscure for a general audience. I recommend a **Third Option**: "Discarded Entities, Enduring Structures."

  We must state clearly that the entities (aether, phlogiston) do not exist, satisfying the need for truth. But we must also explain *why* the theory persisted by highlighting the specific relationships that survived. This honors the history without confusing the visitor.

  **Proposed Policy Language:**
  "Labels must state the current consensus on an entity's existence while explicitly identifying mathematical or conceptual structures retained by successor theories."

  **Criteria for Honesty:**
  To ensure this isn't just tactful hedging, we need strict criteria for the "survival" claims:
  1.  **Relations:** A relation "carries over" only if the equations reduce to the old form in specific limits (e.g., Newtonian gravity within General Relativity) or if conservation laws remain identical.
  2.  **Successor:** A theory counts as a successor only if it holds established consensus (e.g., standard textbooks, peer-reviewed literature). Consensus shifts only upon broad community review, not individual hypothesis.

  This approach avoids the Director's simplification without accepting the Curator's philosophical commitment unverified. It tells visitors: "The thing wasn't real, but the work wasn't wasted."

  \answer{other - hybrid clarity model}
