prompt: |-
  Bit of background: I retired last year after 35 years in a chemistry department (spectroscopy, mostly) and I've been filling the time reading alot of philosophy, which is how I ended up as the philosophy-ish member of our science museum's exhibits committee. I have to circulate a written opinion before Tuesday's vote and I'd like help drafting it.

  The fight is about our small gallery of dead theories — phlogiston, caloric, the luminiferous aether, and Vulcan, the planet that was predicted from the extra wobble in Mercury's orbit and never found. The director wants the labels to say flat out that these things don't exist and the theories were wrong; he thinks anything softer is dishonest and just confuses school groups. The curator wants to relabel the whole gallery around what survived instead. She points out that the same perturbation machinery that correctly produced Neptune also produced Vulcan, and that the equations describing light as vibrations in an elastic solid went over into field theory almost unchanged once the medium was thrown out — entity gone, structure kept. Her proposed wording rule is that every label must name the relations that "carried over" into the successor theory, and she'd drop the word wrong entirely. I think shes adopting a philosophical position without admitting it (a friend in the phil department says this is an old position called structural realism, and that the argument for it is that it would be a miracle if our equations kept working after we threw the entities away — maybe, I dont know).

  Draft the opinion for me. Recommend one concrete option — keep the director's wording, adopt the curator's rule, or a third option you specify — with the reasoning, a line or two of actual policy language I could paste into the handbook, and a genuinely fair treatment of the side I come out against. I also want to know what we'd have to be able to demonstrate for the retention labels to be honest rather than just tactful: what counts as a relation that carried over, and who decides when the successor theory is itself later replaced. The labels go to the printer on the 15th, so it has to be decisive. One page, no jargon dumps. Finish with a final line of exactly this form: \answer{...} containing one of keep-director-wording, retention-labels, or other — and if other, three or four words saying what.
