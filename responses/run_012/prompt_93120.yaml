answer: |-
  The hum of the rig was the first thing Elara noticed when she woke, a familiar static against the roof of her mouth. The Lattice. For twelve years, it had been her eyes. A camera on her brow caught the world, translated light into pressure, and pressed it against her tongue. A wall was a warm, dull ache across the back molars. A face was a constellation of sharp ticks on the tip. She knew the geometry of her apartment better than most sighted people knew their own hands.

  But today, the hum was competing with a new sensation. A leak.

  Dr. Thorne stood over her, his voice a low rumble that she felt in her chest as much as heard. "Keep them closed a little longer, Elara. The pupils need to stabilize."

  "Stabilize what?" Her voice was raspy. The bandages over her eyes felt heavy, like wet wool.

  "Light intake. We're going to remove the dressing. When you open them, don't try to name anything. Just tell me what it feels like."

  Thorne's hands were gentle. The air hit her eyelids first, cool and dry. Then the wool was gone.

  Elara opened her eyes.

  She had expected the Lattice's translation: pressure, gradients, sharp lines. She had prepared for the tongue-grid to flare in sympathy with the optical input. Instead, she was hit by a violent, silent explosion. Color didn't press; it flooded. It had no weight. It had no texture. It was simply *there*, hovering in front of her without touching her tongue.

  "Too bright?" Thorne asked.

  "It's... loud," she whispered. "But quiet."

  She blinked. The room resolved into shapes. A white wall. A blue curtain. A table. On the table sat two objects covered by black cloths. She knew what was under them. A cube. A sphere. She had identified them by the Lattice a thousand times. The cube sent a grid of hard stops to her tongue; the sphere sent a rolling, continuous gradient that faded at the edges.

  "Ready for the test?" Thorne asked. He moved to the table.

  "Wait," Elara said. She reached up and touched the switch behind her ear. The hum in her mouth stopped. The tongue went silent. She wanted to isolate the new sense. She wanted to know if the light alone carried the truth.

  Thorne nodded, appreciating the control. He pulled the cloths off.

  A white cube. A white sphere. Lit by a single overhead lamp.

  "Which is which?" Thorne asked.

  Elara stared. The objects were baffling. In the Lattice, a shape was defined by where the pressure *wasn't*. The background was silence; the object was the buzz. Here, the objects were defined by where the light *was*. But the light didn't stop at the edge. It spilled. Shadows pooled around the base of the sphere, soft and undefined. The cube cast a hard, dark wedge.

  "The one on the left," Elara said, pointing to the cube. "That's the cube."

  "Why?"

  "Because of the shadow," she said. "It's... angry."

  Thorne made a note. "And the other?"

  "The sphere. It's... sliding."

  "You're using tactile metaphors," Thorne observed. "Do you *see* them as the shapes you know? Or are you guessing based on the shadows?"

  Elara frowned. She leaned forward. The Lattice had taught her that a sphere was a continuous surface. There were no corners to catch the pressure. But looking at the sphere, she saw a highlight. A bright spot on the top curve. She had never felt a highlight on her tongue. The Lattice didn't transmit reflection; it transmitted proximity.

  "I know which one is which," Elara said slowly. "I can tell you the coordinates. I can tell you the volume."

  "But?"

  "But this isn't them." She gestured at the objects. "The ones I know... they resist. When I put a cube on the table, the Lattice tells me where it ends because the signal cuts off. Here..." She traced the air near the sphere. "Here, the edge is where the color changes. But the color keeps changing. The shadow moves when you move."

  Thorne shifted his weight. The shadow on the table slid.

  "See?" Elara said. "The shape I know is constant. The shape I see is... dependent. It depends on where you stand. It depends on the light."

  "That's how vision works," Thorne said softly. "It's perspectival. The Lattice gave you a depth map. This gives you a surface map."

  "It gives me a lie," Elara said. "I know the cube is the cube. I would bet my life on it. But looking at it... I don't see a cube. I see a square face with two trapezoids attached. I know it's a cube because my tongue remembers the hard stop. But my eyes... my eyes see a flat thing."

  She reached out. Her hand hovered over the sphere.

  "Don't touch," Thorne said. "Not yet. That's the condition."

  "If I don't touch it, it's not real," Elara said. "The Lattice was direct. Camera to tongue. Input to sensation. This..." She tapped her eyelid. "This feels like looking at a picture of a thing. I know the picture represents the thing. I know the code. But I don't see the thing."

  "So you recognize the geometry," Thorne pressed. "But not the object?"

  "I recognize the *logic*," Elara corrected. "The logic of the edge. The logic of the occlusion. But Molyneux asked if I could tell them apart. I can. But he didn't ask if I would believe they were the same things I touched."

  She pulled her hand back.

  "Is that a failure?" Thorne asked.

  Elara looked at the sphere. The highlight shifted as she tilted her head. It was beautiful. It was nothing like the steady, humming pressure of the Lattice. The Lattice was a tool; this was a presence.

  "I can pass your test, Doctor," she said. "I can name them. But if you ask me if I see what I felt..." She turned off the camera feed behind her ear completely. The silence on her tongue was absolute. "Then no. I see something new. And I don't know if it's a cube anymore, or just a picture of one."

  She stood up, steadying herself on the chair. The room swam, not in space, but in meaning.

  "I need to touch them," she said. "Not to know which is which. But to see if the light lies."

  Thorne hesitated, then nodded. "Proceed."

  Elara reached out. Her fingers brushed the sphere. Cold, smooth, solid. The resistance matched the Lattice. It did not match the eyes. The eyes said *surface*; the hand said *volume*.

  She pulled her hand back and looked at her fingertips, then at the sphere.

  "It's not that I couldn't identify them," she said, her voice trembling slightly. "It's that I don't know which sense is telling the truth. The tongue told me about space. The eyes tell me about light. They agree on the name, but they disagree on the world."

  She sat back down.

  "Record it as a success," Elara said. "But note that the subject requests the blindfold back."

  Thorne paused, pen hovering. "You want to stop?"

  "I want to think," she said. "I need to know if I'm looking at the world, or just a map of it."

  ***

  **Afterword**

  This story takes a specific liberty with the classic Molyneux problem. The original thought experiment (posed by William Molyneux to John Locke) assumes a subject with *no* prior visual experience whatsoever, relying solely on touch (haptics) to form spatial concepts. By giving Elara a sensory substitution device (SSD) that translates optical data into tactile pressure, the story shifts the question from "Can touch inform sight?" to "Can mediated spatial information transfer to direct perception?"

  Philosophically, this leans on the contested distinction between *amodal spatial representation* (the idea that "cube" is an abstract concept independent of sense) and *modality-specific qualia* (the idea that the experience of light is intrinsic to the concept of "seeing a cube"). The story favors a nuanced empiricist position: Elara can identify the shapes (suggesting abstract spatial concepts transfer), but she rejects the *identity* of the experience (suggesting qualia are essential to objecthood). It suggests that while the *geometry* of Molyneux's problem might be solvable via substitution, the *ontology*—what it means for an object to be real—remains tied to the specific medium of perception. The ending refuses a flat "yes/no" verdict on identification, focusing instead on the phenomenological dissonance that arises when two senses agree on data but disagree on reality.
