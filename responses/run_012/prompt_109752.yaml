prompt: |-
  I cover evolutionary biology for a general-interest science magazine, and I have reached the point where I cannot write another story about the fights over levels of selection without a standard to hold the claims to. Researchers send me papers and press officers send me releases announcing that selection has been shown to act on genes, or on groups, or for the good of the species, and I have no principled way to tell a claim that adds something from a redescription of something we already knew. So before I write, I want the specification. What does any theory of the units and levels of selection have to deliver to be adequate to that job — the cases it must get right, the distinctions it must not collapse, the formal results it must live with, the questions it must answer — with the case or consideration behind each requirement?

  Take the following as the minimum it has to cover, and add whatever else a working theory cannot duck: a gene that cheats the meiotic lottery and so spreads at the expense of the rest of the genome; an inherited microbe that spreads by turning its host's offspring into daughters, at the host's cost; a sterile worker ant that rears the queen's offspring and has none of its own; an alarm call that raises the caller's chance of being eaten and lowers everyone else's; a trait that is good for the group and bad for the individual, and its mirror image; and the fact that the entities we call individuals are themselves historical products, assembled out of things that were once free-living.

  Spell the distinctions out rather than naming them: between the level at which selection is acting and the level at which a trait's benefit accrues; between an entity's being selected and its being the thing whose variation is merely being tracked; between a collective as a bearer of fitness and a collective as a unit that reproduces; between selection and drift or transmission bias. Then the formal constraints. The bookkeeping result usually called the Price equation splits a change in frequency into a within-group and a between-group part, and it is an algebraic identity, true of any partition of any population, so a theory that leans on it has to say what its results rule out and what they merely restate. The same goes for the condition usually called Hamilton's rule, which tells you when a costly behaviour can spread by benefiting relatives: say what it settles about the level at which selection is acting and what it leaves open.

  Then the part I most want. Tell me which of these requirements are genuine and which are one camp's preference dressed up as a constraint. Flag any pair or subset that cannot be jointly satisfied, and say which one you would surrender. Finish by identifying the single requirement that does the most to exclude the main contending positions.

  Take a position throughout. I do not want a menu of options and a shrug; make the calls, give your reasons, and tell me where your position would be most vulnerable if someone pushed on it. No reading list and no citations — what I need is the reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Evolutionary biology journalist for a general-interest science magazine.
      *   **Problem:** Overwhelmed by conflicting claims about levels of selection (gene, individual, group, species). Needs a principled standard to distinguish substantive claims from mere redescriptions.
      *   **Task:** Specify the requirements for an adequate theory of units/levels of selection.
      *   **Required Content:**
          *   Must cover specific cases (meiotic drive, endosymbionts/sex-ratio distorters, sterile workers, alarm calls, group-bad/individual-good vs. vice versa, major transitions/individuality).
          *   Must spell out specific distinctions (level of action vs. benefit, selected entity vs. tracked variation, collective fitness vs. collective reproduction, selection vs. drift/bias).
          *   Must address formal constraints (Price Equation, Hamilton's Rule) and what they actually settle vs. restate.
          *   **Crucial:** Take a position. No hedging. Identify genuine requirements vs. partisan preferences. Identify incompatibilities. Identify the single most exclusionary requirement.
          *   **Constraint:** No reading list, no citations. Just reasoning.

  2.  **Determine the Stance/Position:**
      *   The prompt asks me to *take a position*. I cannot be neutral.
      *   *Option A: Pluralism.* (Everything is a level depending on perspective). *Critique:* This fails the user's need. They want to distinguish substance from redescription. Pluralism often collapses into "it's all just math," which doesn't help a journalist evaluate claims.
      *   *Option B: Gene-Centric (Dawkins/Williams).* *Critique:* Strong on meiotic drive, struggles slightly with major transitions without careful wording, often accused of being tautological by opponents.
      *   *Option C: Multi-Level Selection (MLS) / Hierarchy Theory (Okasha, Godfrey-Smith, etc.).* *Critique:* Good for groups/transitions, but risks labeling everything as group selection if not careful.
      *   *Option D: The "Replicator/Interactor" Distinction (Hull) refined by Causal Process.*
      *   *Decision:* I will adopt a **Causal-Process Position** anchored in **Reproduction and Fitness Decoupling**. This aligns closely with the "Major Transitions" framework (Maynard Smith/Szathmáry) and Godfrey-Smith's "Darwinian Populations" approach, but I will articulate it as my own reasoned stance. This position prioritizes *causal responsibility* over *mathematical partitioning*. It treats the "individual" not as a given, but as an achievement. This allows me to be decisive about what counts as a "level of selection" versus a "level of effect."

  3.  **Drafting the Requirements (The "Specification"):**

      *   *Case 1: Meiotic Drive.* Needs to distinguish selection *on* the gene vs. selection *on* the organism.
      *   *Case 2: Inherited Microbe (Wolbachia).* Similar to drive, but involves distinct lineages. Needs to handle conflicting fitness interests.
      *   *Case 3: Sterile Ant.* The classic altruism problem. Needs to explain how sterility evolves without group selection *necessarily* being the driver (kin selection logic), or when group selection *is* the driver.
      *   *Case 4: Alarm Call.* Costly to self, benefit to others. Distinguish kin benefit vs. group benefit.
      *   *Case 5: Group Good/Individual Bad (and vice versa).* The core conflict.
      *   *Case 6: Major Transitions (Individuality).* How aggregates become individuals.

      *   *Distinctions:*
          *   Action vs. Benefit (Where the filter is vs. where the profit goes).
          *   Selected vs. Tracked (Replicator vs. Vehicle).
          *   Collective Fitness vs. Collective Reproduction (Bottlenecks).
          *   Selection vs. Drift/Bias (Systematic vs. Random/Structural).

      *   *Formal Constraints:*
          *   Price Equation: It's a tautology. It partitions variance but doesn't identify causation.
          *   Hamilton's Rule: It predicts spread, not mechanism. $rb > c$ doesn't tell you *who* is selecting.

  4.  **Developing the Argument (The "Position"):**

      *   *Core Thesis:* A theory of levels of selection must identify the **locus of causal responsibility for fitness differences**. Mathematical partitioning (Price) is insufficient because it allows infinite redescriptions. We need a causal criterion.
      *   *The "Individual" is a Variable:* The theory must explain how lower-level units lose their ability to be selected (suppression of conflict) to form a higher-level unit.
      *   *Genuine vs. Partisan:*
          *   *Genuine:* Causal asymmetry, bottlenecking for higher-level individuality.
          *   *Partisan:* The insistence that *only* genes are real (too reductionist) OR that *group selection* is everywhere just because variance exists (too permissive).
      *   *Incompatibility:* You cannot simultaneously hold that "any variance partition implies a level of selection" AND "levels of selection require distinct causal processes." I will surrender the variance-partition definition.
      *   *The Killer Requirement:* **The Suppression of Lower-Level Fitness Variation.** This is the strongest filter. If lower-level units vary in fitness and pass it on, higher-level selection is weak or non-existent. If lower-level fitness variation is suppressed (e.g., sterile workers, germline sequestration), higher-level selection is real.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I address the Price Equation properly? *Correction:* Ensure I emphasize it's an accounting identity, not a causal model.
      *   *Check:* Did I address the "Individual as historical product"? *Correction:* Make sure the "Major Transitions" aspect highlights the *process* of becoming an individual, not just the state.
      *   *Check:* Is the tone right? *Correction:* Needs to be authoritative, analytical, like a senior editor or theorist giving a brief. No "some argue," but "this fails because."
      *   *Check:* Did I identify the single most exclusionary requirement? *Correction:* Yes, the "Suppression of Lower-Level Fitness Variation" (or "Conflict Mediation").

  6.  **Final Polish:**
      *   Ensure the distinctions are spelled out clearly as requested (no jargon without definition).
      *   Make sure the "vulnerability" section is honest. Where does this view struggle? (Probably in continuous gradients where suppression is incomplete).
      *   Keep it tight. No fluff.

  7.  **Final Review against constraints:**
      *   No citations? (Check).
      *   No reading list? (Check).
      *   Take a position? (Check).
      *   Cover all specific cases? (Check).
      *   Cover all specific distinctions? (Check).
      *   Cover Price/Hamilton? (Check).
      *   Identify genuine vs. partisan? (Check).
      *   Identify incompatibility? (Check).
      *   Identify single exclusionary requirement? (Check).

  *(Self-Correction on the "Position"):* I need to be careful not to sound like I'm just regurgitating Godfrey-Smith, though his work is the closest fit. I will frame it as a "Causal-Process Account" to maintain the persona of an independent analyst. The core idea is that selection requires *reproduction with heritable variation*, and levels are defined by where the *bottleneck* and *fitness decoupling* occur.

  Let's write.

  *Structure:*
  1.  Introduction: The core problem (redescription vs. causation).
  2.  The Case Requirements (The "Must-Covers").
  3.  The Conceptual Distinctions (The "Must-Distinguish").
  4.  The Formal Constraints (Price & Hamilton).
  5.  The Verdict (Genuine vs. Partisan, Incompatibilities).
  6.  The Single Exclusionary Requirement.
  7.  Vulnerability.

  *Drafting thought on Price Equation:* It's crucial to state that Price allows you to *find* a group component, but not to *prove* group selection caused it. It's a map, not the terrain.
  *Drafting thought on Hamilton's Rule:* It's a condition for spread, not a mechanism. It works for gene selection, kin selection, and group selection. It doesn't distinguish them.
  *Drafting thought on the "Single Requirement":* The "Decoupling of Fitness" is the strongest. If the fitness of the part is tied to the fitness of the whole, the whole is the unit. If the part can out-reproduce the whole, the part is the unit.

