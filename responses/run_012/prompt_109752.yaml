answer: |-
  Here is the specification you asked for. I am taking a **Causal-Process Position**. My stance is that a level of selection exists only where there is a distinct causal process of reproduction with heritable variation, and where the fitness of the lower-level parts is sufficiently decoupled from their own replication to be mediated by the higher-level unit. Mathematical partitioning is not enough; you need causal asymmetry.

  ### 1. The Cases: What the Theory Must Explain

  A theory fails if it treats these six scenarios as identical. It must distinguish the causal architecture in each.

  *   **Meiotic Drive:** A gene biases segregation to enter more than half the gametes.
      *   *Requirement:* The theory must identify this as selection *on the gene*, contrary to the interest of the organism. The organism is the vehicle being exploited, not the unit being optimized.
  *   **Inherited Microbe (e.g., *Wolbachia*):** A bacteria alters host sex ratios to favor females (who transmit the bacteria), reducing host population growth.
      *   *Requirement:* The theory must recognize two distinct lineages (host and microbe) with conflicting fitness interests. It must not collapse this into "group selection" on the host-microbe super-organism, because their reproduction is not perfectly aligned.
  *   **Sterile Worker Ant:** A worker foregoes reproduction to raise the queen's offspring.
      *   *Requirement:* The theory must explain how a trait that reduces individual fitness to zero can spread. It must distinguish between the *gene's* interest (kin selection) and the *colony's* interest (group selection). If the theory says "the colony is selected," it must explain why the workers don't cheat.
  *   **Alarm Call:** A bird calls, attracting predators, saving neighbors.
      *   *Requirement:* The theory must distinguish whether this spreads because the neighbors are relatives (kin selection/gene selection) or because groups with callers out-compete groups without them (group selection). The outcome is the same; the level of selection is the question.
  *   **Group-Good/Individual-Bad vs. Mirror Image:** A trait that lowers individual fitness but raises group fitness, versus one that raises individual fitness but lowers group fitness.
      *   *Requirement:* The theory must predict which wins. It cannot simply say "it depends on the math." It must specify the structural conditions (migration rates, assortment) that allow the group-benefit to override the individual-cost.
  *   **The Individual as Historical Product:** Multicellular organisms evolved from single cells.
      *   *Requirement:* The theory must explain the *transition*. How did free-living cells become a reproducing individual? It must account for the suppression of cell-level selection (cancer) to allow organism-level selection. A theory that treats the organism as a given from the start fails here.

  ### 2. The Distinctions: What Must Not Be Collapsed

  You cannot use these terms interchangeably. If a theory blurs them, it is descriptive, not explanatory.

  *   **Level of Action vs. Level of Benefit:**
      *   *Distinction:* Selection *acts* where the filter is applied (e.g., predators eating birds). Benefit *accrues* where the fitness gain is realized (e.g., the genes in the relatives saved).
      *   *Requirement:* A theory must not claim selection is at the level of the benefit. Altruism benefits the group, but selection may act on the gene via kinship. Confusing the beneficiary with the selector is the most common error in press releases.
  *   **Selected Entity vs. Tracked Variation:**
      *   *Distinction:* An entity is *selected* if its properties causally influence its replication. An entity is *tracked* if its frequency changes merely because it is correlated with the thing actually being selected.
      *   *Requirement:* A theory must distinguish the replicator (the thing copied) from the vehicle (the thing tested). If a gene frequency changes only because it is linked to a selected organism, the gene is being tracked, not directly selected.
  *   **Collective Fitness vs. Collective Reproduction:**
      *   *Distinction:* A group can have a "fitness" (average survival of members) without being a "reproducer" (passing on traits via a bottleneck).
      *   *Requirement:* A theory must not call every group with high survival a "unit of selection." A herd of deer has fitness, but it does not reproduce as a herd. A termite colony does. Only the latter is a candidate for a higher-level unit of selection.
  *   **Selection vs. Drift/Transmission Bias:**
      *   *Distinction:* Selection is systematic covariance between trait and fitness. Drift is random sampling. Transmission bias is a structural skew (like meiotic drive) independent of fitness.
      *   *Requirement:* A theory must not label every frequency change as "selection." Meiotic drive is a transmission bias, not organismal selection. Calling it "gene selection" is acceptable only if the gene is treated as the reproducer, not if it is treated as a standard adaptive trait.

  ### 3. The Formal Constraints: What the Math Actually Says

  You must treat equations as tools, not oracles.

  *   **The Price Equation:**
      *   *The Constraint:* This equation partitions total evolutionary change into a covariance term (selection) and an expectation term (transmission bias). It can be recursively applied to partition variance into "within-group" and "between-group" components.
      *   *The Trap:* It is an algebraic identity. It is true by definition. You can always partition variance such that there is a "group selection" component, even in a population of solitary individuals.
      *   *What it settles:* It tells you how much variance *exists* at different levels.
      *   *What it leaves open:* It does not tell you if the group component is *causal*. A theory leaning on Price must admit that finding a non-between-group covariance term does not prove group selection is operating, only that the math allows you to describe it that way. It rules out nothing; it merely restates the data.
  *   **Hamilton's Rule ($rb > c$):**
      *   *The Constraint:* A behavior spreads if the relatedness ($r$) times the benefit ($b$) exceeds the cost ($c$).
      *   *The Trap:* It is often cited as proof of "kin selection" as a distinct mechanism from "group selection."
      *   *What it settles:* It predicts the *conditions for spread* of an altruistic trait.
      *   *What it leaves open:* It says nothing about the *level* of selection. The same inequality can be derived from a gene-centric model, a kin-selection model, or a multi-level selection model. It settles the outcome, not the mechanism. A theory cannot use Hamilton's Rule to define the unit of selection; it is agnostic on the unit.

  ### 4. The Verdict: Genuine Requirements vs. Partisan Preferences

  Here is where I make the calls you requested.

  *   **Genuine Requirement:** **Causal Responsibility.** A level of selection is real only if variations at that level cause differences in reproduction that are heritable. If you can remove the higher-level structure and the frequency change stops, the higher level was causal. If the frequency change persists due to lower-level dynamics, the higher level is a redescription.
  *   **Genuine Requirement:** **Fitness Decoupling.** For a higher level (like a multicellular organism) to become a unit of selection, the fitness of the lower parts (cells) must be decoupled from their own replication and tied to the replication of the whole.
  *   **Partisan Preference (Gene-Centric):** The claim that "only genes are truly selected" because they are the only things that persist indefinitely. This is a metaphysical preference for permanence over process. Organisms reproduce; genes are just the record. Insisting on the gene as the *only* unit obscures the causal power of the organism.
  *   **Partisan Preference (MLS Pluralism):** The claim that "selection acts at all levels simultaneously" whenever variance can be partitioned. This is an accounting preference. Just because you *can* partition variance doesn't mean a causal process exists at that level. This view makes the concept of "level" meaningless because it applies everywhere.

  **The Incompatibility:**
  You cannot jointly satisfy **"Any variance partition implies a level of selection"** and **"Levels of selection require distinct causal processes."**
  *   *Reason:* Variance partitioning (Price) is infinite and arbitrary. Causal processes are finite and structural.
  *   *What I Surrender:* I surrender the variance partition definition. It is too permissive. It allows you to claim "group selection" in a population of clones or solitary individuals just by drawing boundaries. I choose **Causal Process**. If there is no mechanism for the group to reproduce or for group traits to be heritable independent of individual traits, there is no group selection, regardless of what the variance math says.

  ### 5. The Single Exclusionary Requirement

  If you want one test to separate the substantive claims from the noise, use this:

  **The Suppression of Lower-Level Fitness Variation.**

  *   **The Rule:** A higher-level unit (group, organism, colony) is a genuine unit of selection *only if* mechanisms exist to suppress fitness variation among its lower-level parts.
  *   **Why it excludes:**
      *   It excludes "group selection" in a loose aggregation of animals where individuals still compete to reproduce. If the individuals vary in fitness and pass it on, selection is at the individual level, even if the group benefits.
      *   It includes the multicellular organism. Somatic cells do not vary in fitness (they don't reproduce); only the germline does. The "individual" is real because cell-level selection is suppressed.
      *   It includes the eusocial colony. Workers are sterile; their fitness variation is zero. The colony is the reproducer.
      *   It excludes most "species selection." Species do not typically suppress variation among their constituent populations in a way that makes the species the sole reproducer.
      *   It handles Meiotic Drive. Drive exists *because* suppression failed. The gene is selected because the organism-level suppression of within-genome conflict broke down.

  This requirement forces you to look for **mechanisms of conflict mediation** (policing, bottlenecks, sterilization, single-cell bottlenecks). If the press release claims "selection at level X," ask: "What mechanism suppresses selection at level X-1?" If they cannot answer, it is a redescription.

  ### 6. Vulnerability

  My position is most vulnerable when **selection is weak and gradients are continuous.**

  In nature, suppression is rarely absolute. Cancer exists (cell-level selection breaking out). Cheater cells exist in slime molds. Migration blurs group boundaries. My requirement for "suppression" draws a sharp line in a fuzzy world. A critic can argue that by demanding suppression, I am defining away the interesting cases where multi-level selection is a tug-of-war rather than a settled hierarchy.

  If you push me here, I must concede: The "unit" is not a binary switch but a slider. However, for your purpose as a journalist filtering claims, the binary test is necessary. If the suppression is weak, the claim of a "higher level of selection" is weak, and likely not the dominant story. My position risks under-calling the complexity of transitional states, but it protects you from over-calling the prevalence of group selection in systems that are merely aggregates.

  **Summary for your desk:**
  Demand causal mechanisms, not variance partitions. Demand evidence of fitness decoupling, not just group benefits. If they can't explain how the lower level was stopped from competing, they haven't found a new level of selection; they've just drawn a new circle around the old one.
