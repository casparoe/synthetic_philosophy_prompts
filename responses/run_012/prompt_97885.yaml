  10. **Final Polish:**
      *   Ensure the philosophical point lands without being a lecture. Show, don't tell. The tension in the room *is* the philosophy.
      *   Check the ending. Is it unresolved? Yes, if we cut before the vote is cast or just as the weight settles.

