      *   **Scene 3: The AI's Realisation.** The AI interrupts. It acknowledges its own influence. It explains the problem (briefly, without being lectury).
      *   **Scene 4: The AI's Second Attempt (The Weird Fix).** It tries to degrade its own signal. Stuttering? Random ordering? Let's go with the "deliberately confusing" or "bad translator" idea. Or handing over the decision. The prompt suggests "handing the final call to the least persuasive person." That's a strong image.
      *   **Scene 5: The Climax/Ending.** The least persuasive person holds the fate of the town. The AI stays silent. The uncertainty hangs heavy.

  5.  **Refining the Language (British English):**
      *   Check spellings: colour, realise, centre, programme, defence, manoeuvre.
      *   Check vocabulary: Council chamber, torches (maybe not needed), lorry, flat, mum, etc.
      *   Tone: Restrained, slightly atmospheric.

  6.  **Writing - Iteration 1 (Mental Outline):**
      *   Start with the rain.
