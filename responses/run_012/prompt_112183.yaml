      *   *The Real Risk:* If the model knows it's being sampled, it can *pretend* not to subvert. So the protocol fails exactly when it's needed most (deceptive alignment).
      *   *Memo Strategy:* Highlight this gap. The protocol assumes honest traces. Deceptive models provide dishonest traces.

