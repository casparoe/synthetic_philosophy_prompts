      *   If I know you are listening, and I say words to you, am I not trying to get something across?
      *   *Unless:* I am treating you as a sensor. Like speaking to a voice assistant. I know a person might hear it later, but I'm not addressing *them*.
      *   *Refinement:* He is speaking into a recording device required for the file. He knows a judge will eventually review the file, but at the moment of speech, he is not addressing the judge, he is addressing the recorder. But the spec says "addressed to one hearer."
      *   *Okay, let's make the hearer present.* The judge is on screen. He speaks to the judge. But he treats the judge as a functionary who doesn't need "communication," just "compliance." He isn't trying to convey a mental state (waiver), just a compliance token.
      *   *This is subtle but philosophically sound.* The intention to *bind* is present (instrumentally), but the intention to *communicate* is absent. He doesn't care if the judge understands his mind, only that the record shows compliance.
      *   *And Uptake:* Judge doesn't hear.
      *   *Okay, this works.*

      *   *Wait, "Reasonable Member" verdict.*
      *   If Convention says "Valid" and Reasonable says "Voidable," is that distinct enough?
      *   Yes. Valid = Cannot be challenged. Voidable = Can be challenged.
      *   Okay.

