  **The Scenario**
  During a remote bail hearing via secure video link, a competent defendant with prior legal experience knows that stating "I waive counsel" is the required protocol to unlock the next stage of the process. Treating the phrase as a mere password to advance the interface rather than a communication to the court, he recites the words mechanically to secure his release, possessing no intention to convey any mental state of waiver to the judge or to get anything across to her mind; simultaneously, the judge's audio feed cuts out during the phrase, so she never hears the utterance and signs the order based solely on the system's "compliance verified" log, resulting in a total absence of uptake.

  **The Three Accounts**
  1.  **Convention-First:** Verdict: **Valid Waiver.** The act is constituted by conformity to the constitutive rules of the court protocol. Since the competent speaker uttered the required words in the correct setting, the act is complete regardless of mental states or reception. The working feature is **rule conformity**.
  2.  **Intention-plus-Uptake:** Verdict: **Void (No Waiver).** The act requires a meeting of minds; it fails because the speaker lacked communicative intention (treating words as a password) and the hearer lacked uptake (audio failure). The working feature is **communicative reciprocity**.
  3.  **Reasonable Member (Objective):** Verdict: **Voidable.** The act counts *prima facie* as a waiver because a reasonable member of the community, seeing the log and hearing the recording, would take him to be committed; however, unlike the Convention account, this verdict allows the commitment to be overturned if the mechanical context is revealed. The working feature is **objective reliance**.

  **The Checks**
  If you restore the missing features (the speaker intends to communicate waiver and the judge hears it), the case collapses into an ordinary successful waiver. All three accounts then converge on "Valid," confirming that the divergence relies entirely on the absence of intention and uptake. The **Intention-plus-Uptake account comes out worst**. Its verdict renders institutional stability impossible; if court waivers vanish whenever a judge misses a word or a defendant is cynical, the practice collapses. Its best line of defence is to **drop the uptake requirement**, arguing that speaker intention alone suffices. This does not save them; it leads to the "secret promise" problem, where I can bind you without you ever knowing, which is equally destructive to communication.

  **Convention First: Proves Too Much?**
  Yes, the convention-first verdict risks separating the act from communication altogether. If rule conformity is all it takes, a parrot trained to say "I waive" in court would technically waive its rights. The convention theorist can draw a principled line at **competence and context**: the speaker must be a competent agent capable of following rules, and the context must be one where the rule is in force. This excludes parrots (incompetent) and stage actors (wrong context), but it still admits the defendant in the scenario, proving that communication is not essential to the act's existence.

  **Austin: Misfire vs. Abuse**
  On the **Intention account**, this is a **Misfire**: the conditions for the act (intention/uptake) were not met, so the act never happened. On the **Convention account**, this is a **Happy Act**: the procedure was correctly followed, and since the defendant wasn't insincere (he didn't assert a belief he lacked, he just didn't care), it isn't even an Abuse. The case highlights that Austin's framework struggles when the "procedure" is satisfied but the "communication" is entirely absent.
