answer: |-
  This is a classic case of a philosophical slogan doing too much work. "There's no fact of the matter" (NFM) is a chameleon phrase. In the mouth of a seminar peer, it is often used as a conversation-stopper rather than a committed thesis. However, to defeat the hand-waving, you need to pin down exactly which metaphysical or semantic commitment they are trying to hide behind.

  Here is the menu of distinct claims that sentence could be making in the context of the baldness study, ranked from deflationary to metaphysically extravagant.

  ### 1. The "We Haven't Stipulated Yet" Reading (Deflationary)
  *   **The Claim:** In natural language, 'bald' lacks a precise cutoff. In the context of the study, the researchers have not yet publicly specified the exact operational definition (e.g., "less than 500 hairs per cm²"). Therefore, until they do, there is no fact about whether a specific subject falls under the study's *current* description.
  *   **Status:** **Platitude.** It is trivially true that if a definition is incomplete, its application is undetermined.
  *   **Licenses the Move?** **No.** This actually *supports* your criticism. If they haven't stipulated a cutoff, the study is methodologically flawed. It invites you to demand they set a boundary, not to tell you that boundaries are impossible.
  *   **Likelihood:** High. This is often what scientists mean when they aren't trying to do metaphysics.

  ### 2. The Semantic Indeterminacy Reading (Supervaluationism)
  *   **The Claim:** The word 'bald' is semantically incomplete. There are many ways to make it precise (precisifications), and none is the "correct" one. A statement is "true" only if it is true on *all* admissible precisifications. For the borderline case (the thinning crown), some precisifications say "bald," others say "not." Thus, no single truth value exists relative to the language itself.
  *   **Status:** **Substantive Thesis.** This is a standard, defensible position in philosophy of language (Fine, Keefe).
  *   **Licenses the Move?** **No.** Supervaluationism explains why *natural language* is vague, but it does not prevent a study from *stipulating* a precisification. Once the study says "For our purposes, bald = X," the vagueness is resolved by fiat. The study can still be criticized if their chosen precisification is medically useless, even if it wasn't "the only true one."
  *   **Likelihood:** Moderate. This is the "philosophically literate" version of the claim.

  ### 3. The Contextualist Reading
  *   **The Claim:** The truth value of "He is bald" shifts depending on the conversational context (stakes, contrast class, interests). In a casual chat, he might be bald; in a dermatological study, he might not. There is no "context-independent" fact.
  *   **Status:** **Substantive Thesis.** (See: David Lewis, Stewart Shapiro).
  *   **Licenses the Move?** **Partially.** It suggests the study must define its context. However, it does not license the claim that the category is *arbitrary* in a way that precludes criticism. If the study claims to be measuring "clinical baldness" but uses a cutoff that dermatologists reject, they have failed their own context.
  *   **Likelihood:** Moderate. People often sense that "it depends on what you're using the word for."

  ### 4. The Ontic Vagueness Reading (Metaphysical Fuzziness)
  *   **The Claim:** The vagueness isn't in our words or knowledge; it's in the world. The man's scalp is objectively in an indeterminate state. It is not that we don't know if he's bald; it's that reality itself has not decided.
  *   **Status:** **Wild / Controversial.** (See: Gareth Evans' objection). Most philosophers reject this because it requires abandoning classical logic or identity conditions for objects.
  *   **Licenses the Move?** **Yes, but at a high cost.** If reality is fuzzy, then any binary coding is a distortion of nature. However, this is overkill for a hair study. It implies *all* scientific categorization is suspect, not just this study.
  *   **Likelihood:** Low. Unless your peer is a metaphysician, they probably don't believe the universe is literally fuzzy.

  ### 5. The Nihilist / Error Theory Reading
  *   **The Claim:** "Bald" is a defective predicate, like "witch" or "phlogiston." Nothing is truly bald. All statements claiming someone is bald are strictly false (or lack truth conditions).
  *   **Status:** **Radical / Plainly False (Pragmatically).** While logically possible, it makes communication impossible.
  *   **Licenses the Move?** **Yes.** If the category is fake, the study is nonsense and cannot be criticized for getting the "facts" wrong (since there are none). But this undermines the study's existence entirely, which the researcher probably doesn't want to do.
  *   **Likelihood:** Very Low.

  ### 6. The Epistemic Confusion (What they might mean but said wrong)
  *   **The Claim:** There *is* a sharp boundary (a specific number of hairs), but it is humanly impossible to know where it is. (Epistemicism, e.g., Timothy Williamson).
  *   **Status:** **Substantive Thesis.**
  *   **Licenses the Move?** **No.** In fact, this destroys their argument. If there *is* a fact of the matter (even if unknowable), then the study's coding is either correct or incorrect. They cannot claim the category is arbitrary; they can only claim it is hard to verify.
  *   **Likelihood:** High. People often confuse "no *knowable* fact" with "no fact."

  ---

  ### The Critical Pivot: Why Their Move Fails

  Your interlocutor is making a sleight-of-hand inference. They are moving from **Premise 1** (Natural language 'bald' is vague/NFM) to **Conclusion** (Therefore, the study's operational definition is arbitrary and immune to criticism).

  **This is a non-sequitur on almost every reading of the menu.**

  1.  **Stipulation vs. Discovery:** Scientific studies do not *discover* the boundary of 'bald'; they *stipulate* a boundary for the sake of measurement (e.g., "Hamilton-Norwood Scale Stage 4+").
  2.  **Arbitrariness $\neq$ Immunity:** Even if the choice of cutoff is arbitrary (e.g., why 500 hairs and not 501?), once chosen, the application of that cutoff is **not** arbitrary. You can absolutely criticize the study for:
      *   Inconsistency (coding two identical scalps differently).
      *   Invalidity (the cutoff doesn't correlate with the health outcomes they claim to study).
      *   Reliability (different coders can't agree on the application).

  **"No fact of the matter" about the *word* does not entail "No fact of the matter" about the *data protocol*.**

  ### Which reading do people usually have in mind?

  When a non-metaphysician says "There's just no fact of the matter" in a seminar, they usually mean a sloppy hybrid of **Reading 1 (Deflationary)** and **Reading 3 (Contextualist)**, infused with a dose of **Relativism**.

  They intend to convey: *"The boundary is not dictated by nature, so any boundary we draw is a human construct, and you can't say our construct is 'wrong' in the same way you can say 2+2=5 is wrong."*

  **How to reply:**
  > "I agree there's no fact of the matter about the *word* 'bald' in natural language. But this is a study with a protocol. Either you have stipulated a precise cutoff or you haven't.
  >
  > If you haven't, your data is uncodable (my original point).
  > If you have, then there *is* a fact of the matter about whether a subject meets your criteria, and I can criticize whether that criteria is medically valid.
  >
  > 'No fact of the matter' protects you from neither methodological sloppiness nor invalid operationalization."

  This forces them to pick a square on the menu. If they pick **Ontic Vagueness**, they look crazy. If they pick **Semantic Indeterminacy**, you point out that stipulation resolves it. If they pick **Deflationary**, you point out that means they need to finish their protocol.
