      *   *Checking Constraints:* No bold, no bullets, no headings. Email length (not too short, not a thesis). Don't hedge at the end.

      *   *Drafting thoughts:* Start by validating the user's intuition about the "slippery" middle. Move through the historical claim, then the statistical claim, then the competence/jury claim, then the missing objections. End with a definitive verdict.

      *   *Specific focus on the professor's proposal:* The prompt mentions the professor's version had stratification and a second panel. The flatmate's summary ignores the second panel mostly. I should mention that the professor's safeguards acknowledge the risks the flatmate glosses over. The second panel is an admission that the first might be rash or uncompetent.

      *   *Re-evaluating the "Competence" claim:* Is it possible sortition is *more* competent? Some argue elected officials are competent at getting elected, not governing. But random people lack expertise. The counter-argument is they can hire experts. But then who chooses the experts? The flatmate's claim that it is *more* competent is the strongest overreach.

      *   *Final Verdict:* The "more democratic" part holds up better than the "more competent" part. The conclusion that it is *both* simultaneously based on her reasoning is false. The reasoning conflates representation with wisdom.

