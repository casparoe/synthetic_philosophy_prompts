answer: |-
  Your intuition that something slippery is happening in the middle of her summary is correct, and specifically, you are right to suspect that the competence claim is doing heavy lifting that the mirroring argument cannot support. To unpack this, we need to look at where her summary aligns with serious political theory and where it drifts into advocacy shorthand. Her opening claim that lottocracy is democracy the way the Athenians did it is historically plausible but romantically simplified. A careful defender would accept that Athens used sortition for most offices, but they would acknowledge that Athens excluded women, slaves, and residents without citizenship, whereas modern proposals aim for universal inclusion. More importantly, Athens did not lose sortition because elections took over; it lost its sovereignty because it was conquered by Macedon, and even in its prime, it used elections for military generals because they wanted expertise there. When she says the reason it works is statistics and that a random sample mirrors the population the way a poll does, she is conflating descriptive representation with substantive representation. A stratified sample of a few hundred people will indeed mirror the demographics of the population quite well, ensuring that the poor, the rural, and the unemployed have a voice in the room. However, a poll captures snap judgments, often uninformed ones, whereas the proposal relies on deliberation to transform those snap judgments into reasoned decisions. The slippery leap happens in her next sentence, where she claims that because the chamber mirrors the public, whatever it decides is what the public would decide if it had time and information. This is a normative assumption, not a statistical fact. It assumes that deliberation inevitably leads to a clearer version of the public will, rather than potentially distorting it through groupthink, polarization, or manipulation by the experts who brief the chamber.

  This leads directly to the core issue you identified regarding competence. Her conclusion that sortition is both more democratic and more competent than elections rests on the idea that ordinary people, once gathered, possess a collective wisdom that career politicians lack. A careful defender would argue that sortition removes the incentive to please donors or party machines, which is a form of integrity, but integrity is not the same as competence. Competence in legislation requires understanding complex trade-offs between macroeconomic policy, international relations, and legal coherence. While elected politicians are often careerists, they also accumulate experience and institutional knowledge that a rotating body of amateurs lacks. Her defense against this relies entirely on the jury comparison, noting that we let twelve random people decide on life imprisonment. This analogy is the weakest link in her chain. Juries are tasked with determining facts based on evidence presented within a strict framework of existing law, where the goal is to find a truth about a past event. Legislators are tasked with creating law, balancing competing values, and allocating resources where there is no objective truth to find, only difficult choices between incompatible goods. Furthermore, a jury decision is final and specific, whereas legislation requires ongoing oversight and adjustment. If a jury makes a mistake, it affects one case; if a citizens chamber passes a flawed budget or defense policy, the consequences are systemic and long-lasting.

  She is also incorrect to claim that competence is the only serious objection. A major objection that she leaves out is accountability. In an electoral system, if representatives perform poorly, they can be voted out. In a sortition system, the members are not accountable to anyone; they serve their term and return to private life. If the chamber makes a disastrous decision, there is no mechanism to punish them individually, and because the chamber is constantly rotating, it is difficult to assign responsibility to the body as a whole. There is also the problem of coordination with the executive branch. If the legislature is chosen by lot but the executive is elected, you create two bodies with competing claims to legitimacy, which can lead to gridlock or constitutional crises. The professor's specific proposal mentioned a second independently drawn panel for a re-vote, which is actually an admission that the first chamber might be rash or uncompetent, a safeguard your flatmate glossed over in her enthusiasm.

  So, to answer your main question directly: her conclusion does not survive once you fix the shaky parts. The claim that sortition is more democratic is defensible if you define democracy as descriptive representation rather than electoral authorization, but the claim that it is more competent is not supported by the arguments she provided. The mirroring argument establishes representativeness, not wisdom, and the jury analogy fails to account for the difference between judging facts and making policy. The competence claim only works if you assume that the removal of careerist incentives automatically yields better decisions, ignoring the loss of expertise and the risks of amateurism. You were right to feel that the middle was slippery; that was where the argument swapped evidence for hope. Sortition might produce a legislature that looks more like the people and acts with less corruption, but there is no statistical or historical guarantee that it will act with more competence than a professionalized body, and relying on the jury comparison to prove otherwise is a category error.
