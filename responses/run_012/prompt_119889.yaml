  # Decision Tree: Defining "Low Impact" Without Full Value Specifications

  ### Shared Commitments
  *   **Side Effects Matter:** An agent reaching its goal is not safe if it causes unacceptable collateral damage (e.g., breaking vases to fetch coffee).
  *   **Alignment is Not the Solution:** We cannot solve this by saying "just tell the agent to do what we mean"; we assume a complete value specification is unavailable or too costly to write.

  ---

  ### The Tree

  **Q1: Does the definition of impact require reference to *human* values or preferences?**
  *   **No** (Value-Neutral Attempt) → Go to **Q2**
  *   **Yes** (Value-Laden) → Go to **Q5**

  **Q2: Is low impact enforced as a *hard constraint* on behavior or a *penalty* inside the objective function?**
  *   **Hard Constraint** → **Leaf 1: Hard Impact Constraints**
  *   **Penalty** → Go to **Q3**

  **Q3: Is the metric based on *physical state variables* (energy, entropy) or *counterfactual agency* (capabilities)?**
  *   **Physical State** → **Leaf 2: Thermodynamic Impact**
  *   **Counterfactual Agency** → Go to **Q4**

  **Q4: Is the baseline for comparison *immediate inaction* or *preserved attainable utility*?**
  *   **Immediate Inaction** → **Leaf 3: Status Quo Bias**
  *   **Preserved Attainable Utility** → **Leaf 4: Attainable Utility Preservation (AUP)**

  **Q5: Is the partial value specification treated as *sufficient to define safety* or *insufficient, requiring trade-offs*?**
  *   **Sufficient** → **Leaf 5: Partial Value Specification**
  *   **Insufficient** → **Leaf 6: The Stopgap View**

  ---

  ### Leaf Positions & Awkward Commitments

  1.  **Hard Impact Constraints**
      *   *Awkward Commitment:* No major position occupies this leaf because hard constraints on change render almost all useful action impossible (e.g., breathing changes entropy).
  2.  **Thermodynamic Impact**
      *   *Awkward Commitment:* It treats moving a feather and moving a boulder as equally impactful if energy expenditure is matched, ignoring semantic meaning.
  3.  **Status Quo Bias**
      *   *Awkward Commitment:* It penalizes the agent for preventing bad things that would have happened anyway, incentivizing passive omission over active safety.
  4.  **Attainable Utility Preservation (AUP)**
      *   *Awkward Commitment:* It requires simulating countless random goals to measure "power," potentially incentivizing the agent to manipulate the definition of "options."
  5.  **Partial Value Specification**
      *   *Awkward Commitment:* It assumes the unspecified values won't be violated in catastrophic ways by optimizing against the specified ones.
  6.  **The Stopgap View**
      *   *Awkward Commitment:* It admits the concept of "side effects" is incoherent without full alignment, rendering the safety research program circular until alignment is solved.

  ---

  ### Gap Analysis & Diagnostics

  **Unoccupied Combinations (The Gaps)**
  *   **Leaf 1 (Hard Impact Constraints):** This combination of answers (Value-Neutral + Hard Constraint) is **unattractive/incoherent**. While theoretically possible, no serious research program advocates for a hard cap on physical change or state distance, as it creates a "modal realism" problem where the agent cannot act without violating the constraint. It is marked as a leaf to show the structural possibility, but it remains empty in practice.
  *   **Value-Neutral + Hard Constraint + Agency:** A sub-gap within Leaf 1. Attempting to hard-constraint "attainable utility" is **incoherent** because utility is unbounded and undefined without a specific function; you cannot place a hard limit on "all possible futures."

  **Indistinguishability Check**
  *   **Leaf 5 (Partial Value Spec) vs. Leaf 6 (Stopgap):** These leaves are separated by **Q5** (Sufficiency). However, in practice, these positions are **merely unexplored** in their distinction. Many proponents of Partial Value Specifications privately harbor Stopgap concerns, treating their specs as sufficient only until a failure occurs. The tree separates them philosophically, but empirically, they often converge on the same engineering implementations (e.g., impact regularization with a human-in-the-loop override).

  **Diagnostic Summary**
  The tree reveals that **Value-Neutrality** (Left Branch) forces a choice between ignoring meaning (Thermodynamic) or relying on complex counterfactuals (Status Quo/AUP), all of which struggle with *gaming* (the agent reducing its own impact score by incapacitating itself). The **Value-Laden** branch (Right Branch) admits that "impact" is normative, but splits on whether we can pretend otherwise (Partial Spec) or must admit defeat (Stopgap). The empty **Hard Constraint** leaf highlights that without a value judgment to prioritize *which* changes matter, we cannot strictly forbid change itself.
