  We agree intentionality talk is a tool for explaining systems whose behavior is robustly counterfactual-supporting but physically opaque. A successful explanation must account for normativity (truth/falsity conditions) and causal efficacy without invoking magic. We agree cases (i–v) are genuinely unsettled metaphysical disputes, not merely underdescribed physics. The verbal dispute concerns whether to label complex derived intentionality "original"; the substantive dispute concerns whether consciousness/biology is constitutive of content. What would genuinely move the needle: empirical proof of non-biological consciousness or biological systems lacking content despite complexity. What would only look like it: redefining "intentionality" or "consciousness" without changing empirical predictions.

  2. **Precise Disagreements (Adversarial Characterization)**
  **A (Interpretivist):** Intentionality is a relational property dependent on the interpretive stance; there is no inner glow, only varying complexity of information processing that warrants the intentional stance. "Original" is a pragmatic label for systems where the stance yields high predictive payoff.
  **B (Biological Naturalist):** Intrinsic intentionality is a causal biological power like digestion; derived intentionality is parasitic on intrinsic; simulation duplicates neither. Consciousness is constitutive of intentionality; a state that couldn't in principle be conscious is not intentional.
  **The Clash:** A accuses B of mysticism (homunculus); B accuses A of elimination (behaviorism). Both agree the other's previous characterization of their view was uncharitable; this document corrects that.

  3. **Crux 1: Lineage, Structure, & Readers (Cases i & ii)**
  | Case | Description | Crux Question | A's Prediction | B's Prediction |
