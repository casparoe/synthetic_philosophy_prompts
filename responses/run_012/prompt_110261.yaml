  | :--- | :--- | :--- | :--- | :--- |
  | **(iii) Rings** | Tree rings/sediment (natural info). | Is natural information intentionality? | Tree rings are proto-intentional; the line is graded. | Natural info is causation, not intentionality; no mind, no aboutness. |
  | **(iv) Program** | Evolved program, no designer. | Does selection without designer suffice? | Selection suffices for derived/original blur; function is real. | Selection without biology is just causation; no intrinsic intentionality. |
