      2.  **Saint/Hero not a structural divide:** Difference is cost (good vs. skin), not moral category. Suspicious of heroism as special department.
      3.  **Ought implies can (Hard-line):** Morality can't demand impossible/unlivable. Demandingness objection fatal to act-consequentialism (buying coffee isn't wrongdoing).
      4.  **Reasons-monism:** One "ought" fixed by balance of reasons. If most reason to do A, you ought to do A (required).
      5.  **Praise/Blame track requirements:** Credit only for required, blame only for skipping required. (Wait, this seems contradictory to supererogation immediately).
      6.  **Suberogatory exists:** Acts allowed but objectionable (permissible but bad).

  3.  **Identify Tensions/Contradictions:**

      *   **Tension A: (1) Supererogation vs. (4) Reasons-monism.**
          *   (1) says some acts are *better* but *not required*.
          *   (4) says if there's *more reason* to do A, you *ought* (required) to do A.
          *   If the saintly act has "more reason" (because it's morally better), (4) says it's required. (1) says it's optional.
          *   *Severity:* High. This is the classic supererogation problem for maximizing theories.

      *   **Tension B: (1) Supererogation vs. (5) Praise/Blame track requirements.**
          *   (1) says supererogatory acts are *better* (implying praise-worthy).
          *   (5) says you *don't get credit* for doing what was optional (only for required).
          *   If supererogatory acts are optional (by def), (5) says no credit. But the point of supererogation is usually that they *are* praiseworthy.
          *   *Severity:* High. Direct contradiction on the function of praise.

      *   **Tension C: (4) Reasons-monism vs. (3) Ought implies can/Demandingness.**
          *   (4) says "ought" = balance of reasons. If moral reasons outweigh coffee reasons, you ought to donate.
          *   (3) says if it's too demanding (unlivable), it's not required.
          *   If moral reasons *always* outweigh personal reasons (implied by "morally better"), (4) makes everything required. (3) tries to cap it.
          *   *Severity:* Medium/High. Requires a specific account of how personal reasons weigh against moral reasons to avoid consequentialism while keeping monism.

      *   **Tension D: (6) Suberogatory vs. (4) Reasons-monism.**
          *   (6) says acts are allowed but objectionable (less reason?).
          *   (4) says if less reason, you ought not do it (required not to do it).
          *   If it's permissible, (4) suggests reasons are balanced or tipping towards doing it. If it's objectionable, reasons tip against.
          *   *Severity:* Medium. Similar structure to supererogation but inverted.

      *   **Tension E: (2) Saint/Hero not structural vs. (1) Supererogation.**
          *   (1) posits a category of acts beyond duty.
          *   (2) says don't make heroism a special department.
          *   *Severity:* Low. (2) is about the *agent* type, (1) is about the *act* type. Can be reconciled.

