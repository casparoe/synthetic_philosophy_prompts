          2.  (1) vs (5): Supererogation vs. Praise logic. If optional = no credit, supererogation loses its point.
          3.  (4) vs (3): Monism vs. Demandingsness. Monism pushes toward consequentialism; (3) tries to block it without explaining why personal reasons outweigh moral ones.
