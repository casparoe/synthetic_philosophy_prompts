  # STOICISM: A DECISION TREE ON WHAT IS "UP TO US"

  **Instructions:** Start at the top. Answer each question based on your intuition or the text you are defending. Follow the path to find your position.

  ### 1. THE ARCHER
  **When the archer shoots perfectly but the wind moves the target, was the *miss* outside their power?**
  *   **NO (The miss was in their power):** Go to **Question 2**.
  *   **YES (Only the attempt was in their power):** Go to **Question 3**.

  ### 2. THE HEALTH CASE
  **If the miss is in your power, is your *health* in your power in the same way your *anger* is?**
  *   **YES:** 🍂 **LEAF 1: UNNAMED (Total Control)**.
      *   *Diagnosis: Incoherent.* (Denies the reality of external obstacles).
  *   **NO:** 🍂 **LEAF 2: UNNAMED (Partial Control)**.
      *   *Diagnosis: Unattractive.* (Accepts external limits but claims outcome power).

  ### 3. THE DOCTOR
  **The doctor does everything right, but the patient dies. Was "saving the patient" a separate category from "treating well" (e.g., Influence vs. Control)?**
  *   **YES:** 🍂 **LEAF 3: THE THREE-WAY SPLIT** (Popular Literature).
      *   *Position: Things we control, things we influence, things we do not.*
  *   **NO:** Go to **Question 4**.

  ### 4. THE THREAT
  **A tyrant threatens death to make you break a promise. Is breaking the promise "up to you"?**
  *   **NO (Coercion removes power):** 🍂 **LEAF 4: THE FATALIST CONCLUSION**.
      *   *Position: Nothing is in our power in the sense required.*
  *   **YES (The will remains free):** Go to **Question 5**.

  ### 5. THE SAILOR
  **The sailor resolves to sail, adding "fate permitting." Is this proviso a fact about physics or advice for peace of mind?**
  *   **ADVICE:** Go to **Question 6**.
  *   **PHYSICS:** Go to **Question 7**.

  ### 6. THE PROMISE (Utility)
  **If calming your anger keeps the peace, is the doctrine's main job to manage emotions for social order?**
  *   **YES:** 🍂 **LEAF 5: SOCIO-POLITICAL OBJECTION**.
      *   *Position: The revival has converted an ancient claim into a technique for managing emotions.*
  *   **NO:** 🍂 **LEAF 6: EXEGETICAL ARTIFACT**.
      *   *Position: The dichotomy is an artifact of how the modern revival reads a single opening chapter.*

  ### 7. THE HEALTH CASE (Pursuit)
  **If this is about physics, does "in our power" cover the *correct pursuit* of health, or only the *choice* to pursue it?**
  *   **COVERS PURSUIT:** 🍂 **LEAF 7: RATIONAL SOUL ACTIVITY**.
      *   *Position: It covers the whole activity of the rational soul including the correct pursuit of indifferent things.*
  *   **ONLY CHOICE:** Go to **Question 8**.

  ### 8. THE MEMORY CASE
  **Is your *memory of a fact* as much "in your power" as your *anger* is?**
  *   **YES:** 🍂 **LEAF 8: UNNAMED (Cognitive Control)**.
      *   *Diagnosis: Merely Unoccupied.* (No major school claims full voluntary control over memory retention).
  *   **NO:** Go to **Question 9**.

  ### 9. THE PROMISE (Causality)
  **Was a promise kept under compulsion ever in the promiser's power because they *caused* it, or because it was a *moral choice*?**
  *   **BECAUSE THEY CAUSED IT:** 🍂 **LEAF 9: ATTRIBUTABLE-TO-ONE**.
      *   *Position: Being in our power means attributable-to-one rather than causally guaranteed.*
  *   **BECAUSE IT WAS A MORAL CHOICE:** 🍂 **LEAF 10: STRICT DICHOTOMY**.
      *   *Position: The notion is a technical claim doing real work inside a determinist physics and a theory of agency.*

  ***

  ### ⚠️ NOTE ON DISTINCTIONS

  **Indistinguishable Leaves:**
  For practical purposes, **Leaf 9 (Attributable-to-One)** and **Leaf 10 (Strict Dichotomy)** often occupy the same space. The tree separates them by *definition* (causal origin vs. moral worth), but in the classroom, they frequently yield identical advice.

  **Unoccupied Combinations:**
  *   **Leaf 1 & 2:** No Stoic position occupies these. *Diagnosis: Incoherent or Unattractive.* They deny the fundamental Stoic insight that outcomes are not guaranteed.
  *   **Leaf 8:** No position occupies this. *Diagnosis: Merely Unoccupied.* While we manage attention, claiming memory retention is "up to us" in the same way as assent is psychologically untenable.
