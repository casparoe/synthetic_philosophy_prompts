  Bit of a weird one. I'm a backend dev with no philosophy training whatsoever, and I keep ending up in arguements about whether ripping up habitat is bad for animals. I don't want a balanced overview, I want you to argue a position for me. British English please — I've moved onto a UK team and they keep flagging my 'analyze' and my 'color'.

  Here's the frame I'd like you to argue inside. I made it up, so it isnt from anywhere and you won't find it written down. Score any patch of land with a 'per-hectare ledger': the average number of animals on a hectare, times their average lifetime welfare, where a life that's mostly hunger and fear and ends in being eaten counts as a big negative. Add that up over all the years you're counting, including animals that haven't been born yet. That's the score for that land use.

  The claim I want defended: do this honestly and a boring low-population land use — wheat field, car park, solar farm — usually comes out ahead of the species-rich habitat it replaced. So habitat destruction is more often good for animals than bad, and the standard conservationist instinct has the sign the wrong way round.

  Things I want you to actually chew on rather than wave at:

  - Most wild animals are r-strategists — thousands of eggs, almost all of them dead before adulthood. I want reasoning about numbers, not vibes.
  - Don't assume wild lives are net negative. Tell me whether the argument survives if you assume they're net positive, and if it doesn't survive, just say so.
  - What about a replacement land use that supports a small number of animals with really grim lives — a rubbish tip, an intensive chicken shed? Does the ledger catch that, or does it fall over?
  - And the bit I'm least sure of: is 'average population times average welfare' even the right way to score a hectare, or am I mixing up totals and averages? If my formula's wrong, fix it and say why.

  I definately don't need a reading list or references, I won't read them. Just the argument, and be straight with me about where it gets shaky.
