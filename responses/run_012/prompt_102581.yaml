  Here is the quantitative breakdown you requested. These probabilities represent my credence based on the current weight of historiographical consensus, economic analysis, and archival evidence available as of 2024. They are epistemic probabilities (degrees of belief given the evidence), not frequencies.

  ### 1. Top-Line Probability
  **Probability that the proposition is true for all three cases:** **0.55**
  *(The proposition being: For each famine, the scale was the foreseeable consequence of choices by identifiable people who had feasible alternatives, under which deaths would have been drastically fewer.)*

  **Why this number?** While confidence is high for each individual case, the requirement that the claim holds for *all three* simultaneously (a logical conjunction) compounds the uncertainty. The Irish Famine is the "weakest link" in this chain regarding the feasibility of alternatives in a 19th-century administrative state.

