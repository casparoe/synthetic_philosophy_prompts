  I've been trying to wrap my head around Bernard Williams's thing where a guy saves his wife instead of a stranger, and a utilitarian justification for that — like, it's ok because she's his wife and partiality is allowed since it maximizes overall happiness — is supposed to be one thought too many. I think I get the vibe but I cant tell if its a real objection to utilitarianism or just an aesthetic complaint about the kind of person who'd need the justification. Give me your actual credence that the integrity objection, taken as a package (the wife case plus whether it generalizes to cases where someone's deepest projects are on the line), is a genuine problem for utilitarianism rather than a clash of sensibilities. And I want the decomposition, not just a vibe: how much rides on whether utilitarianism is a decision procedure or only a criterion of rightness; how much on whether a utilitarian can be the sort of person who just saves his wife with no extra thought, because the disposition itself is justified by the theory (the sophisticated consequentialist move); how much on whether the objection is really about the thoughts that actually occur to the agent vs. the order of justification the agent is committed to; how much on whether Williams is targeting utilitarianism specifically or the whole idea that morality needs a system; and any other term you think belongs. Give a number for each and the combination. Then tell me which term you're least confident about and what would move it. Also, one more thing: if the guy is a utilitarian who's trained himself so that the only thought is she's my wife, but the utilitarian justification is still sitting there in the background as a disposition, does the objection dissolve or just get pushed back a level? I'm asking because I suspect the objection either proves too much or too little, but I can't tell which.
