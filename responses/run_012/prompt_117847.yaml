answer: |-
  Here is the decomposition of the Integrity Objection, the credence assignments, and the analysis of the "trained utilitarian" follow-up.

  ### Overall Credence
  **0.78** that the Integrity Objection is a **genuine structural problem** for utilitarianism (specifically regarding its account of agency and value) rather than merely an aesthetic clash of sensibilities.

  My reasoning is that while Utilitarianism can technically accommodate the *action* (saving the wife), Williams identifies a conflict in the *source of normativity*. If a moral theory requires that the ultimate justification for your deepest commitments lies outside those commitments (in the general welfare), it structurally alienates the agent from the very projects that constitute their identity. This is not just a vibe; it is a conflict between impartial value and personal identity.

  ---

  ### Decomposition of the Objection
  Here is how much rides on each specific variable in determining whether the objection holds water.

  #### 1. Actual Thoughts vs. Order of Justification
  **Weight: 0.90**
  This is the pivot point. If Williams is complaining about phenomenology (what you literally think while grabbing the life ring), the objection is weak. A utilitarian can easily say, "Panic precludes calculation." But Williams is complaining about the *order of justification*. He argues that even if the thought doesn't occur to you, the fact that the *rightness* of the act depends on a utilitarian calculation (even a hypothetical one) changes the nature of the commitment.
  *   **Why this weight:** If the objection is only about occurrent thoughts, credence drops to ~0.20. If it is about the grounding of value, credence stays high. Williams explicitly targets the justificatory structure.

  #### 2. Decision Procedure vs. Criterion of Rightness
  **Weight: 0.85**
  Standard utilitarian defense: "Utilitarianism is a criterion of rightness, not a decision procedure. You don't need to calculate to act rightly."
  *   **Why this weight:** If this distinction fully neutralizes the objection, the problem dissolves. However, Williams anticipates this. He argues that even if it's only a criterion, adopting it as your *moral framework* shapes your character and dispositions over time. It still rides heavily on this, because if Utilitarianism *required* constant calculation, it would be absurd on practical grounds alone. The fact that it survives as a criterion is what makes the Integrity Objection philosophical rather than practical.

  #### 3. The "Sophisticated Consequentialist" Move (Dispositional Justification)
  **Weight: 0.70**
  Can a utilitarian cultivate a disposition to save loved ones *because* having such dispositions maximizes utility?
  *   **Why this weight:** This is the strongest utilitarian counter-argument. If the disposition is self-effacing (you don't think about utility, you just love), does integrity remain intact? Williams says no, because the commitment is held *on lease* from utility. If the utility of the disposition vanished, the commitment should be dropped. This conditionality undermines the "depth" of the project. This factor carries significant weight because if dispositional utilitarianism works, the objection is largely defanged.

  #### 4. Target: Utilitarianism Specifically vs. The "Morality System" Generally
  **Weight: 0.60**
  Is Williams attacking Utilitarianism, or is he attacking the idea that morality must be a system of obligations that overrides personal projects (which implicates Kantianism too)?
  *   **Why this weight:** If this is a general attack on systematic morality, it is less a refutation of Utilitarianism *specifically* and more a plea for ethical particularism. If it applies equally to Kant, it suggests the problem is "Morality" not "Utility." However, it hits Utilitarianism harder because Utilitarianism requires the *value* of the project to be contingent on aggregate welfare, whereas Kant might ground it in duty or rational nature.

  #### 5. The Alienation Effect (Identity and Projects)
  **Weight: 0.85**
  This is the core mechanism. Does the theory force the agent to view their own life as a vessel for universal satisfaction?
  *   **Why this weight:** If Utilitarianism can account for the intrinsic value of integrity without instrumentalizing it, the objection fails. But Utilitarianism, by definition, values things instrumentally (relative to the good). Therefore, the alienation is built into the axiology. This is a heavy lifter for the "genuine problem" verdict.

  ---

  ### Least Confident Term
  **Target: Utilitarianism Specifically vs. The "Morality System" Generally (0.60)**

  **Why:** It is difficult to disentangle Williams's critique of Utilitarianism from his broader critique of the "morality system" (which includes Kantian obligation structures). In *Ethics and the Limits of Philosophy*, Williams suggests that the very idea of a "moral obligation" that overrides personal projects is the problem.
  **What would move it:**
  *   **Move Up (More specific to Util):** If it can be demonstrated that Kantian agents can maintain integrity because their duties are derived from *their own* rationality (autonomy), whereas Utilitarian duties are derived from *external* states of affairs (welfare), then the objection is uniquely devastating to Utilitarianism.
  *   **Move Down (General Anti-Theory):** If a robust defense shows that *any* normative theory (including Virtue Ethics) requires some level of external justification that threatens integrity, then Williams isn't refuting Utilitarianism; he's refuting Normative Ethics. If that's the case, the weight of this factor drops, as it becomes a meta-ethical complaint rather than a first-order refutation.

  ---

  ### The Follow-Up: The Trained Utilitarian
  *Scenario: The agent thinks "She's my wife." The utilitarian justification underpins the disposition in the background.*

  **Does the objection dissolve or get pushed back?**
  It gets **pushed back a level**, and in doing so, it reveals that your suspicion is correct: **The objection proves too much against systematic impartial morality, but too little against Utilitarianism as a decision guide.**

  Here is the breakdown:

  1.  **The Push-Back:** The objection no longer targets the *act* (saving the wife) or the *occurrent thought* ("She's my wife"). It targets the *source of normativity*. The agent is now alienated not from their action, but from their *character*. Their character is a tool engineered by utility. If the utility of loving their wife disappeared (e.g., in a specific scenario where saving her causes a catastrophe), the trained utilitarian must be prepared to extinguish that love. Williams argues that a commitment you are prepared to extinguish for external reasons is not a "deep project" or a genuine relationship; it is a managed asset.
  2.  **Proves Too Much:** If Williams is right here, he arguably rules out *any* moral theory that claims overarching authority. If having a "background justification" destroys integrity, then Kantians (whose background is the Categorical Imperative) and Religious Ethicists (God's will) are also alienated from their projects. This suggests Williams is actually an anti-theorist. If so, the objection doesn't kill Utilitarianism specifically; it kills the project of systematizing ethics.
  3.  **Proves Too Little:** If the Utilitarian replies, "So what? Integrity is just a feeling. If maximizing welfare requires me to view my wife as an asset, then that is what morality demands," they bite the bullet. The objection fails to show Utilitarianism is *false*, only that it is *demanding*. It becomes a clash of sensibilities (as you suspected) unless you accept Williams's premise that integrity is a non-negotiable constraint on moral theory, not just another value to be maximized.

  **Verdict:**
  The objection dissolves as a refutation of Utilitarian *action-guidance* (the trained utilitarian acts correctly). It survives as a critique of Utilitarian *axiology* (the utilitarian cannot value integrity for its own sake).

  Therefore, the objection proves **too much** if it implies no moral system is compatible with integrity. It proves **too little** if it only shows that Utilitarianism is psychologically difficult, rather than logically incoherent. The strongest reading is that it exposes a **category error**: Utilitarianism tries to subsume personal identity under impartial value, but personal identity is the *precondition* for having value at all. You cannot maximize the good if there is no "you" left to do the maximizing.

  **Final adjustment to credence:** If you accept the "category error" reading, my 0.78 credence holds. If you view it as merely "Utilitarianism is hard to live with," the credence drops to 0.40. I favor the former.
