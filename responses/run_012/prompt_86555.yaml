answer: |-
  This is a brilliant premise. You are essentially asking your group to perform stratigraphy on paper—treating documents not as windows into truth, but as sedimentary layers deposited by human intent, erosion, and accident. As a geologist, you know that a rock doesn't tell you *why* it formed, only *that* it formed under certain conditions. History is the same, but the rocks are lying to you on purpose.

  Below is a complete run-of-show for your 75-minute session. It includes the "Secret Truth" (for you only), the printable Dossier (for the group), the timeline, and the debrief script designed to induce that specific epistemic vertigo you're looking for.

  ---

  # Session Title: The Fort Cedar Dossier
  **Topic:** Epistemology of History / Source Criticism
  **Time:** 75 Minutes (60 Activity / 15 Debrief)
  **Materials:** Printed dossiers (one per small group of 3-4), pens, large paper for the three lists.

  ## Part 1: Facilitator's Key (DO NOT DISTRIBUTE)
  *Keep this for yourself. This is the "reality" of the fiction. Do not reveal this unless the group gets completely stuck in the debrief.*

  **The Actual Events (1824):**
  1.  **The Disappearance:** Agent Vance did not die in an ambush. He deserted. He was in massive debt and fled to Mexico.
  2.  **The Cover-Up:** Fort Commander Sterling knew Vance fled but reported him dead to avoid the scandal of a diplomat deserting under his watch (which would ruin Sterling's career).
  3.  **The "Ambush":** Fabricated by Sterling. No indigenous attack occurred.
  4.  **The Ledger Anomaly:** The rations issued after death were embezzled by Sterling (claiming they were for "search parties").
  5.  **The Rival:** The rival trader (Source 4) suspected murder but had no proof; he was right about the cover-up, wrong about the motive.

  ---

  ## Part 2: The Dossier (Printable Material)
  *Cut these into separate slips of paper. Give Sources A–E to the groups at the start. Hold Source F for the 40-minute mark.*

  **SOURCE A: Official Dispatch to Washington**
  *From: Cmdr. James Sterling, Fort Cedar*
  *Date: November 14, 1824*
  "It is with heavy heart I report the demise of Agent Vance. On the 12th, while scouting the northern ridge, his party was set upon by a war band of Kootenai. In the ensuing skirmish, Agent Vance fell. His body could not be recovered due to enemy fire. I have ordered the fort to heightened alert. The treaty negotiations are hereby suspended."

  **SOURCE B: Private Diary of Mrs. E. Sterling**
  *Date: November 13, 1824*
  "James came in late, reeking of brandy. He tore up a letter before I could see the seal. He says Mr. Vance was a fool to go north this time of year, but I heard them shouting two nights prior. Vance said, 'You leave me no choice.' James looks haggard. He says the Indians are restless, but the traders say the tribes are camped twenty miles south for the winter."

  **SOURCE C: Fort Provision Ledger (Unintentional Trace)**
  *Entry: Nov 10 – Rations issued to Agent Vance (10 days supply).*
  *Entry: Nov 20 – Rations issued to Agent Vance (5 days supply).*
  *Entry: Nov 25 – Rations issued to Search Party (15 men).*
  *Signature: J. Sterling, Commander.*

  **SOURCE D: Letter from Rival Trading Co.**
  *From: H. Graves, Graves & Sons*
  *Date: December 1, 1824*
  "Word reaches us of Vance's death. Convenient, given his debts to our firm were due last month. Sterling has always been protective of his post's reputation. We suspect foul play, not savages. The Kootenai are trading peacefully at our outpost. We intend to investigate."

  **SOURCE E: The Columbia Gazette**
  *Date: January 10, 1825*
  "TRAGEDY AT THE FRONTIER. Agent Vance slain by hostile natives. Commander Sterling heroically defends the fort. (Based on official dispatches received from Fort Cedar, Nov 30)."

  **SOURCE F: (THE TWIST – Hand out at 40 Minutes)**
  **Land Registry, Santa Fe, New Mexico**
  *Date: March 15, 1825*
  "Purchase of 40 acres mining claim by Mr. Arthur Vance, formerly of Virginia. Payment made in gold coin."

  ---

  ## Part 3: Run-of-Show (60 Minutes)

  ### 0:00 – 0:05 | Introduction & Rules
  *   **Say:** "We are historians for the next hour. Your job is not to solve a mystery, but to establish what can be *justified* based *only* on these papers. There is no Google. There is no 'truth' outside this envelope."
  *   **The Task:** "In your groups, produce three lists:
      1.  **Established:** Facts supported by independent, reliable evidence.
      2.  **Probable:** Likely, but relies on inference or single sources.
      3.  **Merely Reported:** Claims made by sources that are unverified or contradicted.
      *   **Goal:** Write one paragraph consensus account of 'What happened to Vance.'"
  *   **Constraint:** "You cannot assume any source is lying unless you have evidence *within the dossier* that proves it."

  ### 0:05 – 0:35 | Phase One: The Investigation
  *   Groups read Sources A–E.
  *   **Facilitator Role:** Circulate. Do not answer questions. If they ask "Is the diary reliable?", ask "What does the ledger say about the diary's claim?"
  *   **Watch For:**
      *   Groups trusting Source B (Diary) because it feels "private" and "honest."
      *   Groups treating Source A (Report) and Source E (Newspaper) as two confirmations (they are not).
      *   Groups ignoring Source C (Ledger) because it's boring numbers.

  ### 0:35 – 0:40 | Consensus Building
  *   Ask groups to finalize their one-paragraph account.
  *   Most will likely conclude: *Vance was probably murdered by Sterling, or died accidentally and Sterling covered it up. The ambush is suspicious.*

  ### 0:40 – 0:50 | Phase Two: The Twist
  *   **Action:** Hand out **Source F**.
  *   **Say:** "New evidence has surfaced from a different archive. You have 10 minutes to adjust your lists and rewrite your paragraph."
  *   **Effect:** This should shatter the "Murder" theory. He's alive in Santa Fe. But it doesn't prove *why* he left or if Sterling knew. It turns a murder mystery into a desertion scandal.
  *   **Vertigo Check:** Notice how their "Established" list from 35 minutes is now mostly "Refuted."

  ### 0:50 – 1:00 | Final Wrap
  *   Collect the papers.
  *   **Say:** "Stop. Do not try to solve it. Keep the feeling of the floor dropping out when Source F arrived. That feeling is the topic of our debrief."

  ---

  ## Part 4: The Debrief (15 Minutes)
  *This is where you connect the game to the philosophy. Do not lecture; ask questions that lead to these points.*

  **1. The Trap of Vividness (Source B vs. C)**
  *   **Ask:** "Who trusted the Diary (B) more than the Ledger (C)? Why?"
  *   **Point:** We trust *intentional* testimony (diaries) because it speaks to human motive. We distrust *unintentional* traces (ledgers) because they are dry. But the Ledger is harder to fake than a diary entry.
  *   **Philosophical Hook:** This is the tension between **Narrative Coherence** (it makes a good story) and **Evidentiary Weight** (it's hard to forge). Historians often have to choose the boring truth over the vivid lie.

  **2. The Illusion of Corroboration (Source A vs. E)**
  *   **Ask:** "How many of you counted the Report (A) and the Newspaper (E) as two sources confirming the ambush?"
  *   **Point:** They are one source. The Newspaper is an echo.
  *   **Philosophical Hook:** **Independence.** Evidence only compounds if the sources are independent. If they share a lineage, you don't have a chorus; you have an echo chamber. This is the "Regression Problem"—if you trace every source back, many lead to a single, possibly flawed, origin point.

  **3. The Hostile Witness (Source D)**
  *   **Ask:** "Source D (Rival) is biased. He wanted Vance dead for debt. Did anyone use him anyway?"
  *   **Point:** A biased source is useless for *motive* but valuable for *facts* that go against their interest. (e.g., If the Rival admits the tribes were peaceful, that's likely true, because he wants to blame Sterling).
  *   **Philosophical Hook:** **Marc Bloch's point.** We don't discard biased sources; we interrogate the bias to find the truth hidden within it.

  **4. The Adjacent Truth (The Collingwood Move)**
  *   **Ask:** "Did any source tell you directly 'Sterling lied'?" (No). "How did you figure it out?"
  *   **Point:** You used the Ledger (rations) to answer a question it wasn't asked (Was Vance alive?).
  *   **Philosophical Hook:** **R.G. Collingwood.** History is not reading what sources say; it is questioning them. A source is silent on the main question (Did he die?) but decisive on an adjacent one (Was he eating?). We reconstruct the past by cross-examining sources on questions *they* didn't intend to answer.

  **5. The Vertigo (Source F)**
  *   **Ask:** "When Source F arrived, did you feel like you knew *more*, or like you knew *less*?"
  *   **Point:** You thought you were close to the truth (Murder). Now you know he lived, but you realize you know *nothing* about Sterling's intent. Did Sterling know? Was Sterling an accomplice?
  *   **Philosophical Hook:** **The Asymptote of Truth.** New evidence doesn't just fill gaps; it often expands the perimeter of what we don't know. There is no "ledge outside the sources." Source F is just another piece of paper. How do we know *it* isn't a fake? (We don't. We just bet on it).

  ---

  ## Part 5: Troubleshooting & Limitations

  ### Predictable Failure Modes
  1.  **The "Sherlock Holmes" Trap:** Participants will try to solve the mystery perfectly.
      *   *Fix:* Remind them: "In real history, we rarely get Source F. You are doing well if you feel uncertain."
  2.  **The "Authority" Bias:** They will treat the Official Report (A) as the baseline truth and treat the Diary (B) as rumor.
      *   *Fix:* In the debrief, highlight that Official Reports are often the *most* manipulated documents in a hierarchy.
  3.  **The "Consensus" Rush:** Groups will agree too quickly to finish the task.
      *   *Fix:* Walk around and play Devil's Advocate. "You say the ambush happened, but the Ledger says he ate for two weeks after. How do you reconcile that without guessing?"

  ### What This Activity Cannot Do (Be Honest About This)
  *   **Scale:** Real historical uncertainty isn't resolved in 10 minutes; it festers for decades. This game compresses the frustration, but not the endurance.
  *   **Archival Depth:** Real historians spend years finding one ledger. Here, the ledger was handed to them. This creates a false sense of accessibility.
  *   **The "Reality" Check:** In the game, *you* know the truth (the Secret Key). In real history, there is no Facilitator. There is no Secret Key. The vertigo of real history is realizing there is no answer key at the end of the semester.

  ### Closing Thought for You (The Geologist)
  You mentioned the rock record is "inferring a past nobody watched." In the debrief, you might share this:
  *"In geology, if I find a fossil in a layer, I can date the layer. If the layer is disturbed, I can see the fault. In history, the fault lines are invisible. The sources are the rocks, but they are rocks that were planted there by someone who wanted me to dig in a specific spot. Today, you felt the weight of that."*

  ---

  ## Instructions for Preparation
  1.  **Print:** Copy the "Dossier" section onto 5-6 sheets of paper. Ideally, use different fonts or slightly aged paper if you want to be fancy, but plain text works.
  2.  **Cut:** Separate Sources A–E into envelopes. Keep Source F separate.
  3.  **Practice:** Read through the sources yourself to ensure you know where the contradictions lie (e.g., The Ledger dates vs. The Death Date).
  4.  **Mindset:** You are not the teacher. You are the Archivist. You possess the boxes; they possess the curiosity. If they ask "What really happened?", your answer is: "What can you prove?"
