  What I want is your credence, plus the decomposition. Terms I think belong:

  - P(we're in a simulation), and how you get it -- the self-sampling assumption that most observers are simulated versus the self-indication assumption that pushes the other way, and whether Bostrom's trilemma is even a valid argument or just a disjunction we have no reason to put much weight on any particular arm of.
  - conditional on being simulated, how much of the far future's value survives -- does it go to ~0 because our sim just gets switched off and the base-reality future isn't ours to shape, or does it only drop by some factor because the sim might be huge, long-lived, and full of moral patients, or because the simulators might be watching and be moved by what we do.
  - whether our actions can still reach base reality at all conditional on simulation -- the old "the simulators might be persuaded" move.
  - whether fanaticism even needs the base-reality assumption in the first place, or whether an astronomically valuable sim-future is still astronomically valuable.
  - and whatever independent dampening you think is already there without the simulation stuff -- Pascalian-style skepticism about tiny probabilities, the value of the present, and so on.

  Give me a number and one line of justification for each term, how you combine them, and then tell me which term the final number is most sensitive to and what evidence or arguement would move it the most. And don't just tell me it's all downstream of SSA vs SIA -- I want to see where the weight bascially sits.
