  Alright, I want an actual number here, not a "well, it depends." My credence that taking the simulation argument seriously should substantially dampen fanaticism about the far future is maybe 0.45, and I keep bouncing between 0.3 and 0.6 depending on the day, so I clearly don't have a grip on it.

