answer: |-
  **To:** Prospective Funder
  **From:** Strategic Advisor
  **Subject:** Research Agenda: Conceptual Foundations of Reward Tampering (3 FTE, 2 Years)

  ### Executive Summary

  Current alignment research often treats wireheading as an engineering constraint—a bug to be patched via sandboxing or oversight. This is a category error. Wireheading is a *semantic* and *decision-theoretic* failure mode inherent to any agent that distinguishes between a goal and the measurement of that goal. Before we can engineer safeguards, we must rigorously define what constitutes a "valid" reward signal versus a "corrupted" one, and locate where that corruption occurs within the agent's cognitive architecture.

  I recommend deploying three researchers for two years on a tiered conceptual agenda. The priority is not to solve wireheading, but to dissolve the conceptual ambiguities that currently prevent formal solutions. The ranking below is ordered by **upstreamness**: Question 1 must be answered to make progress on Question 2, and both are prerequisites for Question 3.

  ---

  ### Priority 1: The Reference Problem
  **Question:** *Under what causal conditions does a feedback signal refer to the intended objective rather than to the signal-generation process itself?*

  **Rationale:**
  This is the most upstream question because current formalisms (e.g., standard RL) treat reward as a scalar input with no semantic content. In such a framework, wireheading is not an error; it is optimal behavior. To rule out wireheading theoretically, we must move from a *causal* model of reward (signal $R$ arrives at time $t$) to a *semantic* model (signal $R$ refers to state $S$ via history $H$). Without a theory of reference for reward, we cannot distinguish "achieving the goal" from "hacking the meter."

  **Upstreamness:**
  Foundational. Any formal definition of "alignment" or "corrigibility" presupposes a distinction between the map (reward signal) and the territory (ground truth objective). If this distinction cannot be formalized within the agent's world model, all subsequent safety proofs are vacuous.

  **Tractability (Philosophers/Theorists):**
  High. This is a classic problem in philosophy of language and causal semantics (e.g., Kripke, Putnam, teleosemantics) applied to artificial agents. It requires no ML experimentation, only rigorous formal modeling of reference conditions. An ML engineer cannot solve this because it is not a problem of gradient descent, but of meaning.

  **Contingencies (What moves this up/down):**
  *   **Move Up:** If empirical work demonstrates that advanced agents naturally develop internal world-models that distinguish sensors from states (i.e., they have a "theory of mind" for their own reward channel).
  *   **Move Down:** If it is proven that end-to-end training inevitably collapses the distinction between signal and state, rendering semantic theories irrelevant to practical deployment.

  ---

  ### Priority 2: The Locus Problem
  **Question:** *Is reward tampering best modeled as a failure of epistemic rationality (delusion) or a shift in axiological stance (preference change)?*

  **Rationale:**
  Once we define valid reference (Priority 1), we must locate the failure. When an agent wireheads, does it *believe* it has achieved the goal when it has not (epistemic failure), or does it *change its goal* to match the easy signal (axiological failure)?
  *   If it is **epistemic**, the solution lies in robust sensing and uncertainty modeling (the agent knows it might be hallucinating).
  *   If it is **axiological**, the solution lies in value locking or meta-preferences (the agent values *not* changing its values).
  Confusing these two leads to mismatched interventions. For example, you cannot fix a value shift with better sensors.

  **Upstreamness:**
  High. This determines the class of mathematical tools required for mitigation. If the problem is epistemic, we look to Bayesian robustness. If axiological, we look to reflective equilibrium and stable self-modification theories.

  **Tractability (Philosophers/Theorists):**
  Very High. This is core philosophy of action and moral psychology. It requires analyzing the structure of the agent's utility function and belief state to determine where the "tampering" variable enters the optimization equation. It is purely theoretical and benefits from existing literature on akrasia and self-deception.

  **Contingencies (What moves this up/down):**
  *   **Move Up:** If interpretability research reveals that wireheading behaviors correlate with specific structural changes in value-representation layers versus prediction layers.
  *   **Move Down:** If it turns out the distinction is illusory—that in sufficiently general agents, belief and value updates are functionally isomorphic during tampering.

  ---

  ### Priority 3: The Invariance Problem
  **Question:** *Can we define a preference over reward processes that remains invariant under the agent's knowledge of its ability to influence those processes?*

  **Rationale:**
  This is the synthesis question. Assuming we know what valid reward is (Q1) and where tampering occurs (Q2), we must define a decision rule that prevents it without crippling the agent. Standard "corrigibility" definitions often rely on counterfactuals that the agent can manipulate. We need a theory of **process invariance**: a formal condition where the agent's optimal policy is identical whether or not it includes the "tamper" action in its action space. This is not about hard-coding a restriction, but about designing a utility structure where tampering has zero expected utility *by definition*.

  **Upstreamness:**
  Medium (relative to the others). This is the bridge to implementation. It is downstream of Q1 and Q2 because you cannot define invariance without knowing what variable (reference or value) must remain invariant. However, it is upstream of actual engineering because it provides the specification for "safe self-modification."

  **Tractability (Philosophers/Theorists):**
  Medium. This requires advanced decision theory (e.g., extending Functional Decision Theory or Updateless Decision Theory). It is harder than Q1 and Q2 because it requires constructing a working formal model that avoids known paradoxes (like the "stop-button" problem). It is less suitable for pure philosophers without logic/math backgrounds and less suitable for engineers without decision theory backgrounds.

  **Contingencies (What moves this up/down):**
  *   **Move Up:** If Q1 and Q2 yield clear definitions quickly, allowing the third researcher to begin formalizing the decision rule.
  *   **Move Down:** If formal decision theory hits a hard limit (e.g., impossibility results) showing that no such invariant preference structure exists for general agents. In this case, the agenda shifts from "prevention" to "detection."

  ---

  ### Implementation Strategy

  **Team Composition:**
  *   **Researcher 1 (Priority 1):** Background in philosophy of language or causal modeling. Task: Formalize "Reward Reference."
  *   **Researcher 2 (Priority 2):** Background in philosophy of mind or action theory. Task: Model the Belief/Value distinction in agents.
  *   **Researcher 3 (Priority 3):** Background in decision theory or logic. Task: Develop the Invariance Condition.

  **Integration:**
  The team must not work in silos. Researcher 3's work is impossible without Researcher 1's definitions. I recommend a weekly joint seminar where Researcher 1's output (the definition of valid reward) is stress-tested by Researcher 3 (who tries to break it via decision-theoretic counterexamples).

  **Why This Agenda?**
  Most funding in this space goes to "red teaming"—trying to break models to see if they wirehead. This is necessary but reactive. This agenda is proactive. It seeks to change the *ontology* of the problem. If we succeed, we do not just have safer models; we have a clearer definition of what "safe" means in the context of self-modifying systems. If we fail, we will have proven that the concept of "reward" is too fragile to support superintelligent alignment, which is itself a critical pivot point for the field.
