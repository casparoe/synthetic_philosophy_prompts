  Suppose you are advising a funder who can support three researchers for two years on conceptual work about wireheading and reward tampering—roughly, an agent interfering with its own reward signal or the process that produces it. Which open questions should they prioritize, and why? I care less about the list than the ranking: for each, say how upstream it is of other alignment problems, how tractable it is for philosophers and theorists rather than ML engineers, and what would move it up or down. Please focus on questions that turn on the structure of reward rather than implementation details—for example, whether an agent that rewrites its own reward channel is best modeled as changing its values or as changing its beliefs about what its values already were. The deliverable is a defended agenda, not a survey.
