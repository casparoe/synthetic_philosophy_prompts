answer: |-
  Here is the diagnosis, straight up: This is not a verbal dispute, and it is not a hidden empirical disagreement. It is a **foundational conflict between two incompatible models of political legitimacy**, specifically regarding the **allocation of the burden of proof** and the **definition of the moral unit**.

  You are correct to suspect the disagreement is upstream. It sits precisely at the point where your students decide what the *default status* of a human being is in relation to a state. The impasse persists because your students are arguing from two different axiomatic starting points that are both deeply embedded in the liberal tradition, yet mutually exclusive when applied to borders.

  Here is the breakdown.

  ### 1. The Diagnosis: Competing Default Settings
  The open-borders camp operates on a **Jurisdictional Model**. They view the state as a coercive monopoly over a territory. In this model, the default status of a human is *free movement*, and the border is a restriction on that liberty. Therefore, the burden of proof lies on the state to justify why it is blocking a person from accessing resources or land. The "moral unit" is the individual human, and the scope of justification is global.

  The right-to-exclude camp operates on an **Associational Model**. They view the state as a collective project or a voluntary association of citizens. In this model, the default status of a political community is *self-constitution*, and the border is the boundary that makes the association possible. Therefore, the burden of proof lies on the outsider to justify why they should be admitted to a private club. The "moral unit" is the *demos*, and the scope of justification is internal.

  When your students agree on "autonomy" and "equality," they are using the same words to describe different structures. For the Jurisdictional side, autonomy means *individual mobility*. For the Associational side, autonomy means *collective self-determination*. For the Jurisdictional side, equality means *global equal opportunity*. For the Associational side, equality means *equal standing among co-members*.

  They aren't budging because neither side can argue for their default setting without presupposing the very thing the other side denies. To argue that "movement is a basic liberty" presupposes the Jurisdictional Model. To argue that "community requires control" presupposes the Associational Model.

  ### 2. The Coercion / All-Affected Move
  Your colleague's point about coercion is sharp, but it does not dissolve the impasse; it **locates the circularity**.

  The argument "coercion must be justified to everyone it coerces" relies on an **All-Subjected Principle**. This principle bites hard against the Associational Model because it denies the community the right to define the scope of its own justification. If you must justify your border to the person outside it, you have already conceded that the person outside is part of the moral community you are governing.

  However, the Associational camp is right to call this question-begging. You cannot use the All-Subjected Principle to determine the boundaries of the demos without already knowing who counts as "subject." If the border defines who is subject, then the person outside is *not* subject, and the principle doesn't apply to them.

  So, where does this move bite? It exposes that the Associational Model relies on a **fiction of separateness**. It treats the border as a wall between two independent houses, when in reality, the border is a mechanism of global distribution that actively harms those on the other side. The All-Subjected argument forces the Associational camp to admit that their "private club" is built on public infrastructure (the global state system).

  But does it resolve the debate? No. The Associational camp can simply retreat to a **Right to Freedom of Association** claim that trumps the coercion claim. They will argue that forced association is itself a violation of autonomy. So you are left with a clash of rights: *Right to Move* vs. *Right to Associate*. There is no higher court of appeal within liberal theory to settle which right is prior.

  ### 3. Is This Bedrock?
  **Yes.** This is bedrock. But admitting that is not a cop-out if you understand *why* it is bedrock.

  It is bedrock because **Liberalism itself is divided**. The liberal tradition contains two core commitments that are in tension:
  1.  **Universalism:** All humans have equal moral worth and basic rights (supports Open Borders).
  2.  **Particularism:** Legitimate government requires the consent of the governed and collective self-determination (supports Right to Exclude).

  In domestic politics, we hide this tension. In immigration ethics, the tension is laid bare. You cannot argue someone out of Universalism without ceasing to be a liberal cosmopolitan. You cannot argue someone out of Particularism without ceasing to be a democratic statist. Since your seminar is likely grounded in liberal ethics, your students are fighting a civil war within the theory itself.

  Calling this "bedrock" is not saying "people have different tastes." It is saying "the theoretical framework you are using contains a contradiction at its limit."

  ### 4. What Counts as Progress?
  If this is a bedrock clash of incompatible liberal commitments, then **resolution is impossible**. If you continue to treat the goal of the seminar as "finding the correct answer," you will fail every time.

  Progress looks like a **shift in pedagogical goal**. Stop trying to get them to agree on the *permissibility* of borders. Start trying to get them to agree on the **tragic structure** of the choice.

  Here is what counts as progress in your seminar:
  1.  **Explicitly Naming the Burden of Proof:** Force the students to state their default. "Do you assume movement is free until restricted, or exclusion is presumed until overridden?" Make them see that this is an axiom, not a conclusion.
  2.  **Mapping the Costs:** Instead of asking "Which side is right?", ask "Which value are we willing to sacrifice?" If we choose Open Borders, what specific conception of democratic self-determination are we willing to degrade? If we choose Closed Borders, what specific conception of global equality are we willing to abandon?
  3.  **The "Damage Control" Question:** Since the contradiction is bedrock, the most honest political philosophy isn't about solving the problem, but managing it. Progress is when students move from "Borders are just/unjust" to "Given that we value both X and Y, how do we minimize the violation of the one we are forced to compromise?"

  ### 5. Why This Isn't a Cop-Out
  It is easy to say "agree to disagree" and move on. That is a cop-out.
  It is rigorous to say "The theory generates a paradox here, and we must analyze the structural implications of that paradox." That is philosophy.

  If you tell your students, "You are stuck because you are both right about different things that the same theory tells you to value," you validate their intuitions while deepening their theoretical understanding. You teach them that political philosophy often ends not in a solution, but in a clearer view of the dilemma.

  **The Verdict:**
  Stop trying to break the wall. Teach them to examine the bricks. The impasse *is* the lesson. The disagreement is bedrock because it reflects a genuine contradiction within the normative framework they are all sharing. Your job is not to resolve the contradiction, but to make sure they understand that the contradiction is real, structural, and unavoidable. If they leave the seminar understanding that the conflict between universal liberty and particular self-determination is the central tragedy of modern politics, you have succeeded.
