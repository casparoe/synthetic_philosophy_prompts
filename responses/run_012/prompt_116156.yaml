  1.  **Analyze the Request:**
      *   **Topic:** Hegel's *Phenomenology of Spirit*, specifically the Master-Slave Dialectic (Lordship and Bondage).
      *   **Format:** Short poem, two voices (Master, Bondsman/Slave), no labels.
      *   **Constraint 1 (Structure):** Every stanza is a two-line unit (couplet split between voices). One line per voice.
      *   **Constraint 2 (Rhyme):** Rhymes must *only* occur across the gap between voices. Neither voice can rhyme with itself. A rhyme only exists if the other answers it. (AABB is out, ABAB is out. It must be A-A, B-B, etc., where the first A is Master, second A is Slave, or vice versa? Wait, let's clarify: "a rhyme can only ever be completed across the gap between them, so neither voice is ever allowed to rhyme with itself." This implies if Voice 1 says "cat", Voice 2 must say "bat". Voice 1 cannot say "mat" later. Actually, it means the rhyme pair is the stanza. Line 1 rhymes with Line 2. Line 3 rhymes with Line 4. But the constraint says "neither voice is ever allowed to rhyme with itself." This means if Master speaks line 1, Slave speaks line 2 (rhyme), Master speaks line 3, Slave speaks line 4 (rhyme). Master's line 1 end-word cannot rhyme with Master's line 3 end-word. Slave's line 2 end-word cannot rhyme with Slave's line 4 end-word. The rhyme is *only* within the stanza across the voices.)
      *   **Constraint 3 (Content/Thematics):**
          *   Master's lines end on *things* (objects, consumption, enjoyment).
          *   Slave's lines end on *doings* (verbs, shaping, forming, work).
          *   Reasoning: Master reaches object only through Slave, gets no satisfaction. Slave finds himself in work, but one-sidedly, after fear of death.
          *   No heroizing the Slave: The win isn't mutual.
      *   **Constraint 4 (The Break):** At the end, break the rule. Master goes quiet before the last rhyme closes. Slave's final line is left hanging unrhymed.
      *   **Constraint 5 (Length):** 20-30 lines.
      *   **Constraint 6 (Meter):** No fixed meter.
      *   **Interpretation:** The user reads the section as sliding into Unhappy Consciousness, not mutual recognition. The poem should reflect this lack of resolution.

