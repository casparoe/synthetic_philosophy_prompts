answer: |-
  # Final Exam: Decision Theory (Graduate Seminar)
  **Question 4: Risk-Weighted Expected Utility (45 Minutes, 25 Marks)**

  **Stem:**
  Consider a finite gamble $L$ with monetary outcomes $x_1 \le x_2 \le \dots \le x_n$ occurring with probabilities $p_1, p_2, \dots, p_n$ (where $\sum p_i = 1$). Let $r: [0,1] \to [0,1]$ be a continuous, strictly increasing risk function such that $r(0)=0$ and $r(1)=1$. The Risk-Weighted Expected Utility (REU) of $L$ is defined as:

  $$ REU(L) = x_1 + \sum_{i=2}^n r\left(\sum_{j=i}^n p_j\right) \cdot (x_i - x_{i-1}) $$

  Intuitively, the gap between outcome $i$ and $i-1$ is weighted by the risk-function value of the cumulative probability of achieving outcome $i$ or better. Assume utility is linear in money ($u(x) = x$).

  **(a) Warm-up (5 Marks)**
  (i) Show algebraically that if $r(p) = p$, REU collapses to standard Expected Utility (EU).
  (ii) Consider Gamble $G$: $\$0$ with prob $1/2$, $\$100$ with prob $1/2$. Compute $REU(G)$ for $r(p) = p^2$ and $r(p) = p^3$.
  (iii) In this framework, what condition on $r(1/2)$ characterizes an agent as risk-averse regarding $G$ (i.e., preferring the expected value $\$50$ for sure over $G$)?

  **(b) The Reduction Violation (10 Marks)**
  Consider a two-stage process $T$: Flip a fair coin. If Tails, you receive $\$100$ for sure. If Heads, you play Gamble $G$ (from part a).
  (i) Write $T$ as a single one-shot gamble over final outcomes and compute its REU using $r(p) = p^2$.
  (ii) Now evaluate $T$ via backward induction: Calculate the REU of the sub-gamble $G$, treat that value as a certain outcome at the root node, and compute the REU of the root using $r(p) = p^2$.
  (iii) Explain the source of the discrepancy. Does REU satisfy the Reduction of Compound Lotteries axiom? Which description (one-shot or two-stage) does the theory treat as authoritative, and is this discrepancy a bug or a feature?

  **(c) Normative Implications (10 Marks)**
  (i) **The Defender's Case:** Why might a proponent of REU argue that treating the one-shot and two-stage descriptions differently is necessary to capture risk attitudes? What must they concede about an agent who holds these differing preferences?
  (ii) **The Critic's Case:** What is the strongest objection regarding dynamic consistency or exploitation (e.g., money pumps)? To avoid this objection, what substantive commitment must the critic admit EU makes about risk?

  ***

  # Model Answer

  **(a)**
  (i) If $r(p) = p$, the weight on gap $(x_i - x_{i-1})$ is $\sum_{j=i}^n p_j$. Summing these weighted gaps reconstructs the standard expectation $\sum p_i x_i$.
  (ii) For $G = (0, 0.5; 100, 0.5)$:
  $REU(G) = 0 + r(0.5)(100 - 0) = 100 \cdot r(0.5)$.
  If $r(p) = p^2$, $REU = 100(0.25) = 25$.
  If $r(p) = p^3$, $REU = 100(0.125) = 12.5$.
  (iii) Risk aversion here means preferring the EU ($\$50$) to the gamble. Since $REU(G) = 100 \cdot r(0.5)$, risk aversion requires $100 \cdot r(0.5) < 50$, or $r(0.5) < 0.5$. Generally, $r(p) < p$ indicates risk aversion.

  **(b)**
  (i) **One-Shot:** Tails (0.5) $\to$ 100. Heads (0.5) $\to$ G (0 or 100).
  Final distribution: $\$0$ with prob $0.25$, $\$100$ with prob $0.75$.
  $REU_{1-shot} = 0 + r(0.75)(100 - 0) = 100(0.75)^2 = 56.25$.
  (ii) **Two-Stage (Backward Induction):**
  Node Heads: Value is $REU(G) = 25$ (from part a).
  Node Tails: Value is $100$.
  Root Node: Gamble between $\$25$ (prob 0.5) and $\$100$ (prob 0.5).
  $REU_{tree} = 25 + r(0.5)(100 - 25) = 25 + 0.25(75) = 43.75$.
  (iii) **Discrepancy:** $56.25 \neq 43.75$. REU violates Reduction of Compound Lotteries. The risk function is applied to cumulative probabilities at *each* node in the tree. In the one-shot version, the probabilities aggregate ($0.5 + 0.25 = 0.75$) before $r$ is applied. In the tree, $r$ is applied to the top coin flip (0.5) separately from the inner flip. REU treats the **tree structure** as authoritative; risk is sensitive to how uncertainty is resolved, not just final states. Whether this is a bug or feature is the central normative debate.

  **(c)**
  (i) **Defender:** A defender (e.g., Buchak) argues risk is an attitude toward *uncertainty structure*, not just outcomes. Separating sources of risk (e.g., macro vs. micro uncertainty) is rational. **Concession:** They must concede the agent is indifferent between objectively identical final distributions if framed differently. The agent's preference is frame-dependent regarding the *process*, not just the *outcome*.
  (ii) **Critic:** The critic argues this invites dynamic inconsistency. If an agent can pay to switch from the Tree description to the One-Shot description (since $56.25 > 43.75$), they can be money-pumped. **Commitment:** To close the gap, the theory must enforce Reduction, which implies risk neutrality regarding the *structure* of chance. The critic must admit EU is not "neutral" but assumes linearity in probability is a rational requirement, ruling out structural risk sensitivity a priori.

  ***

  # Marking Scheme (25 Marks)

  **1. EU Reduction & Risk Definition (5 Marks)**
  *   **Must-Hit:** Correctly shows $r(p)=p$ yields $\sum p_i x_i$ AND identifies $r(0.5) < 0.5$ as the condition for risk aversion.
  *   **A vs B:** A students explicitly link the inequality to the weighting of the upper tail. B students often state "concave utility" (irrelevant here as $u(x)=x$) or miss the specific condition on $r$.

  **2. Simple REU Calculations (5 Marks)**
  *   **Must-Hit:** Correct values for $G$ under $p^2$ (25) and $p^3$ (12.5).
  *   **A vs B:** B students may miscalculate the cumulative probability term (e.g., weighting $x_2$ by $p_2$ instead of $p_2$). A students show the gap calculation $(x_i - x_{i-1})$.

  **3. Compound Lottery Calculations (5 Marks)**
  *   **Must-Hit:** Correct REU for One-Shot (56.25) AND Two-Stage (43.75).
  *   **A vs B:** B students often fail to treat the sub-gamble value ($25$) as the *outcome* at the root node in the backward induction step, instead trying to merge probabilities prematurely.

  **4. Structural Explanation (5 Marks)**
  *   **Must-Hit:** Identifies that REU applies $r$ to cumulative probabilities at *each node* vs. *aggregated* probabilities. Explicitly states Reduction of Compound Lotteries is violated.
  *   **A vs B:** B students say "the math is different." A students explain *why*: the risk function distorts the top-level coin flip differently than the aggregated probability mass.

  **5. Normative Trade-off (5 Marks)**
  *   **Must-Hit:** Defender: Risk applies to structure/process. Critic: Vulnerability to preference reversals/pumps. Must note EU assumes linearity in probability is rational.
  *   **A vs B:** B students treat the "bug/feature" debate as settled (e.g., "It's a bug because pumps are bad"). A students recognize the live disagreement: Defenders accept frame-sensitivity to model risk; Critics accept EU's substantive restriction on risk attitudes to preserve invariance.

  **Total:** 25 Marks.
  **Time Check:** Arithmetic (15 mins), Explanation/Writing (30 mins).
