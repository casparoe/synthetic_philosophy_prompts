  The cursor blinked against the white field of the document. *Resignation.* Effective immediately.

  Mara sat at the kitchen table. The mortgage statement was pinned under a magnet on the fridge behind her, a white rectangle of guilt. Outside, the Honda coughed when it rained, another bill waiting to happen. But the job was eating her alive, a slow corrosion she could no longer afford.

  Five years ago, she had installed the box. It was a small black unit wired into her modem, a piece of hardware Julian had sold her during his "constraint architecture" phase. She had programmed it then, in a fit of clear-eyed desperation: if she did not input a cancellation code by 11:59 PM tonight, the box would bypass her login and transmit the document automatically. She had built a cage for her future self because she didn't trust her future self to walk through the door.

  Now it was 11:58.

  She looked at her hand. It looked ordinary. The skin was dry, the knuckles slightly swollen. She placed her index finger on the enter key. This was the moment the philosophers argued about, she knew. The intersection of desire and inevitability.

  She didn't slam the key. She pressed it with a deliberate, almost ceremonial pressure. She felt the tactile bump of the switch giving way, the micro-travel before the circuit closed. She watched her own wrist, wondering if a forced movement would have been jerky, a spasm of the nerves. This was smooth. This was hers. She held the key down for a fraction of a second longer than necessary, asserting duration, asserting presence.

  The screen flashed. *Sent.*

  The black box on the table remained dark. It had not needed to fire. She had done it. She sat back, feeling the rush of agency, the clean burn of a choice made. She was responsible. She had burned the bridge.

  ***

  Julian came over two days later to look at the Honda. He wasn't really a mechanic, but he understood systems, and he was the only one who knew about the box. He wiped grease from his hands with a rag, leaning against the open hood.

  "You look lighter," he said.

  "I did it," Mara said. "I sent it."

  "Before the timeout?"

  "By a minute."

  Julian nodded, tossing the rag onto the roof of the car. "Good. Clean break."

  "Julian," she said. "The box. Did it... was it ready?"

  He paused, his hand on the hood latch. "The box?"

  "If I hadn't pressed send. Would it have worked?"

  Julian sighed, the sound of a man who has answered this question too many times. "Mara, you know how these things are. Firmware updates. Server handshakes. The provider for that specific protocol went under last year. I meant to tell you to migrate the script."

  "What does that mean?"

  "It means the trigger mechanism hasn't pinged a server in twelve months. It's been a paperweight since before you decided to quit."

  Mara felt the ground tilt. "So if I hadn't pressed send..."

  "Nothing would have happened. The email would have stayed in the draft folder. You could have closed the laptop. You could have gone to work tomorrow."

  "You're saying I had a choice."

  "I'm saying the constraint was an illusion. But you did the thing, didn't you? You quit. Who cares about the counterfactuals?"

  "I care," she said. "If the box worked, I couldn't have stayed. I was responsible because I had no other option. If the box was broken..."

  "Then you're responsible because you chose it."

  "Those are different things, Julian."

  "Are they?" He kicked the tire gently. "The outcome is identical. The bank sees the same lack of income. Your boss sees the same empty desk. Why does the plumbing matter?"

  "Because I need to know what I am."

  "You're a person who quit a job. Stop looking for the metaphysics in the wiring."

  ***

  The phone rang on Thursday. It was her former supervisor, David. He sounded tired, already scrambling to cover her shift.

  "We need to process the exit interview," he said. "HR is asking about the nature of the departure. Voluntary or constructive dismissal?"

  Mara held the phone tight. The kitchen was quiet. The black box sat on the table, a silent lump of plastic.

  If she said voluntary, she forfeited the severance. If she said forced—if she claimed the automated system had locked her out of her own career—it might look like a glitch, a technical coercion. She could claim she was trapped by her past self's programming. She could claim she lacked alternatives.

  But if the box was broken, that was a lie. She had walked away.

  And if the box worked, was it a lie to say she chose? She had pressed the key. She had felt the travel.

  "Mara?" David prompted. "We just need to know if you felt you had a choice."

  She looked at her hand. The same hand that had pressed the key. It rested on the table now, palm open. It looked capable of picking up the phone and walking out the door. It looked capable of being forced.

  She thought about the geochemistry of it—all those years studying isotopes, knowing that the ratio depended on conditions you couldn't always see. The model determines the answer. But she didn't have the model. She had only the sample.

  "I'm trying to remember," she said.

  "Remember what?"

  "Whether I could have stopped."

  There was a long silence on the line. In the background, she could hear the hum of the office, the printers, the life she had stepped out of.

  "Just tell us what you want us to put down," David said. "It's just a box to check."

  Mara looked at the black box. It offered no data. It offered no verification log. It was just a thing she had built to tell her who she was, and now it was silent.

  "If I say I chose it," she said, her voice low, "then I'm the one who did it."

  "And if you say you didn't?"

  "Then I'm just... the place where it happened."

  She heard David shift the phone away from his mouth, muffle a sigh. "Mara, does it matter? You're not coming back."

  She looked at her finger. The tip was slightly red where it had pressed the key. A mark of contact. Or a bruise from a impact that never came.

  "I don't know," she said. "I need to check the logs."

  "There aren't any logs," Julian had said.

  "Mara?" David pressed. "Voluntary?"

  She closed her hand into a fist. She felt the tension in the tendons, the capacity to grip, the capacity to release. She didn't know if the lock was open or if she had simply turned the key in a dead bolt.

  "Call me back," she said.

  She hung up before he could answer. She sat in the quiet kitchen, waiting for a feeling that would distinguish necessity from choice, but the silence was the same either way.
