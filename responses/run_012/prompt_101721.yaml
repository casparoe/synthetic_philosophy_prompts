          3.  **Annihilation vs. Constraint** (The ontological difference).
          4.  *Camus's specific framing:* **Usurpation of God/Nature.** The state claiming the right to decide *when* life ends vs. deciding *how* life is lived.

  8.  **Final Polish:** Ensure the tone is philosophical, respectful of the friend's logic, but firm on the distinction. Use Camus's specific language where possible (*Reflections on the Guillotine*). Ensure the "Cost" section is honest about the moral compromise of imprisonment.

