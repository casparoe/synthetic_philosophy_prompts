answer: |-
  This episode presents a sophisticated variant of path dependence, one that complicates the standard economic narrative by substituting geopolitical strategy for market competition. To analyze this in both directions: forward, we trace how the initial naval choice triggered increasing returns that foreclosed alternatives; backward, we examine whether the resulting dominance implies genuine superiority or merely the solidification of a contingent military decision.

  ### Mechanisms and the State-Market Distinction

  Standard path dependence theory (Arthur, David) posits that small, historically contingent events are amplified by increasing returns to adoption, leading to a stable equilibrium that may be inefficient. In the nuclear case, the "small event" was the U.S. Navy's requirement for a compact propulsion plant for the *Nautilus*. This was not a market choice but a military specification. However, the mechanisms of amplification fit the theory well.

  **Increasing Returns and Learning by Doing:** Once the Navy invested in the pressurized-water reactor (PWR), the marginal cost of subsequent PWRs dropped. Westinghouse and other suppliers accumulated specific knowledge (learning by doing) that reduced construction time and risk for water-cooled designs relative to gas or heavy-water alternatives. When the Atomic Energy Commission (AEC) moved to civil power, it did not start from zero; it inherited a subsidized industrial base.

  **State vs. Market:** The fit holds, but with a crucial modification. In market-based path dependence, increasing returns are driven by network effects or user adoption. Here, they were driven by **state subsidy and procurement**. The "market" for nuclear technology was created *ex post* by the state, which had already pre-selected the winner. The AEC's demonstration programme was not a neutral trial; it was a technology transfer from the Navy to the civilian sector. The "early lead" was not a competitive advantage gained in a marketplace, but a strategic asset transferred from the defense budget. This suggests the theory must account for **political path dependence**, where the "returns" are political capital and national security infrastructure rather than pure profit.

  ### The Anatomy of Lock-in

  To understand why this convergence persisted, we must distinguish between the types of lock-in.

  1.  **Technical Lock-in:** This refers to hardware compatibility and physical standards. The evidence here is **weak**. Unlike the QWERTY keyboard, where switching requires replacing every unit, nuclear reactors are standalone plants. A gas-cooled reactor does not physically prevent the construction of a water-cooled one nearby. The fuel cycles differed (enriched vs. natural uranium), but these were not technically incompatible in a way that prevented parallel development, as evidenced by Canada's sustained CANDU (heavy water) programme.
  2.  **Institutional Lock-in:** This refers to regulatory codes, licensing regimes, and supply chains. The evidence here is **strong** and does the primary explanatory work. As the U.S. exported its design, it exported its regulatory philosophy. Safety codes were written around the physics of light water (e.g., loss-of-coolant accidents). Insurance models and liability frameworks (like the Price-Anderson Act in the U.S.) were calibrated to PWR risks. When France abandoned its gas-graphite line in the 1970s, it was not because the technology failed, but because the global supply chain and regulatory predictability had shifted to the American PWR standard. The "trained staff" mentioned in the prompt is an institutional asset; retraining a workforce for a different thermodynamic cycle is prohibitively expensive.
  3.  **Epistemic Lock-in:** This refers to the atrophy of the capacity to evaluate alternatives. The evidence here is **strong**. By the 1980s, the engineering community's heuristic tools for safety analysis were optimized for water. The knowledge required to safely operate gas-cooled reactors at scale did not vanish, but it ceased to be transmitted to new generations of engineers. The "discarded alternatives" became theoretically possible but practically unimaginable within the dominant engineering paradigm.

  **Explanatory Work:** Institutional and Epistemic lock-in explain the convergence better than Technical lock-in. France's switch is the smoking gun: a sovereign state with a working alternative voluntarily abandoned it. This cannot be explained by technical inferiority alone, but by the institutional pressure to align with the dominant supply chain and regulatory norms to ensure economic viability and export potential.

  ### The Hard Question: Lock-in or Efficiency?

  The strong claim of path dependence requires that the outcome be contingent—that a different initial choice could have led to a different, perhaps superior, equilibrium. The convergence of the U.S. and the USSR (VVER) on pressurized water challenges this. Independent convergence is normally evidence of a "global optimum," suggesting the design won because it was genuinely better (simpler, cheaper heat transfer), not because of historical accident.

  However, the "efficiency" of the light-water reactor is conditional. LWRs require enriched uranium. In the 1950s, enrichment technology was expensive and primarily justified by weapons production. The civil nuclear programme rode on the coattails of the military-industrial complex, which subsidized the cost of enriched fuel.
  *   **The Counterfactual:** If the U.S. had not pursued nuclear submarines (requiring high energy density/enrichment), the enrichment infrastructure would not have existed at scale. Without cheap enriched fuel, the LWR loses its economic advantage over natural uranium designs (like the British Magnox or Canadian CANDU).
  *   **Determinacy:** For the question "would the same outcome have arrived anyway?" to have a determinate answer, we would need to know if enrichment costs would have fallen sufficiently through purely civil demand. The historical record suggests they did not; enrichment remained tied to defense stockpiles. Therefore, the "efficiency" of the LWR was an artifact of the military path. The USSR's independent convergence supports this: they too had a massive weapons-grade enrichment program. Both superpowers converged on water *because* both had already committed to the enrichment path for bombs.

  Thus, this is lock-in, but not of a design *per se*, but of a **fuel cycle**. The design followed the fuel. The contingency lies in the decision to pursue enrichment-based weapons, which made water-cooling the logical civil extension.

  ### Departure from QWERTY

  This episode departs from the QWERTY narrative in three critical ways:

  1.  **Origin of Momentum:** QWERTY is a story of market friction and user habit. Nuclear convergence is a story of **state capacity and industrial policy**. The "network effect" was not between users, but between regulators, suppliers, and the military.
  2.  **Efficiency Claim:** QWERTY is famously alleged to be inferior. The LWR is not necessarily inferior; it is **locally optimal** given the subsidized constraints. It is the "cheapest" design only if one accepts the cost structure of the enrichment infrastructure as a given. Path dependence theory usually implies a welfare loss; here, the welfare loss is obscured because the "inefficient" path (enrichment) was subsidized for non-economic (military) reasons.
  3.  **Reversibility:** QWERTY is locked in by decentralized coordination failure. Nuclear lock-in was enforced by **centralized licensing**. You cannot simply "type" on a gas reactor; you must be licensed to build it. The state actively closed the path, rather than the market drifting into it.

  ### Implications for Theory

  This case supports, strains, and silences different aspects of path dependence theory.

  *   **Supports:** It validates the core mechanism of **increasing returns to scale** and the power of the **critical juncture** (the *Nautilus*). It confirms that early leads, even if contingent on specific constraints (submarine compactness), can become entrenched through learning and supply chain development.
  *   **Strains:** It strains the theory's reliance on **contingency vs. efficiency**. The independent Soviet convergence suggests that some paths are "wide" (attracting multiple actors) rather than "narrow" (accidental). The theory struggles to distinguish between a design that wins because it is locked-in and a design that wins because it solves a fundamental constraint (heat transfer) that becomes dominant once a related constraint (enrichment) is solved.
  *   **Silent:** Standard theory is largely silent on the **military-industrial origin** of technological paths. It assumes commercial competition or user adoption. It lacks the vocabulary to describe how national security imperatives can create a "market" that bypasses the efficiency testing phase entirely. The theory treats the "initial condition" as a random shock; in this case, the initial condition was a deliberate geopolitical strategy.

  In conclusion, the convergence on light-water reactors is a case of path dependence driven by institutional and epistemic lock-in, rooted in a military contingency that subsidized the fuel cycle. It demonstrates that path dependence is not merely a market failure, but can be a deliberate instrument of state policy, where the "lock" is applied not by consumer habit, but by regulatory and industrial architecture.
