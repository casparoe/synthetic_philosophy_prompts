answer: |-
  The name your friend half-jokingly christened is indeed from the rationalist-adjacent literature: *The Unilateralist's Curse* by Bostrom, Douglas, and Sandberg (2016). Their paper focuses on the statistical argument you accepted immediately: when many actors face a decision with a common value component but independent noise, the probability that *at least one* actor incorrectly judges a bad action as good approaches 1 as the number of actors increases.

  Your strong selection claim, however, goes further. It posits a dynamic evolutionary pressure: that institutions permitting unilateralism will *select for* the mistaken, because the mistaken act (gaining influence) while the correct restrain (ceding influence). This shifts the argument from a static probability problem to a dynamic institutional failure mode.

  Here is the analysis of what counts against it, ranked by potency.

  ### 1. Cost Internalization (Skin in the Game)
  **Rank:** 1 (Highest Potency)
  **Mechanism:** If the costs of a wrong "yes" land primarily on the actor rather than the commons, the selection pressure inverts.
  **Why it bites:** Your selection story requires that the mistaken actor survives and thrives after acting. In competitive markets, litigation environments, or any system where failure leads to exit (bankruptcy, firing, loss of credibility), the unilateralist who is "most reliably mistaken" is removed from the pool. They do not govern the institution over time; they become a cautionary tale. The institution becomes governed by those who correctly judged the risk, because they are the only ones left.
  **Defender's Concession:** A defender of the strong claim would cheerfully accept that this defeater nullifies the curse in *competitive markets* or *personal decisions*. They would argue the curse only applies where downsides are socialized (public policy, existential risk, open science) while upsides are privatized (credit, discovery, policy legacy).
  **Your Implicit Commitment:** You are implicitly committed to the idea that the institution absorbs the error cost. If you define "institution" broadly enough to include firms that go bankrupt, your claim fails. To save the claim, you must restrict it to institutions with weak feedback loops between individual error and individual consequence.

  ### 2. Reversibility and Correction
  **Rank:** 2
  **Mechanism:** If unilateral actions can be undone, corrected, or outcompeted by subsequent actors, the "governance" claim weakens.
  **Why it bites:** The strong claim assumes that acting seizes the field permanently. If a mistaken actor releases a bad preprint, others can critique it. If they start a bad company, it fails. If they run a bad experiment, it is not replicated. The field is not ceded; it is merely cluttered temporarily. The selection pressure favors those who can correct errors, not just those who make first moves.
  **Defender's Concession:** A defender would waive this for irreversible harms (Pandora's box scenarios). They would argue that for the specific class of decisions you care about (existential risk, normative shifts), reversibility is an illusion. For general institutional governance, however, this is a major leak.
  **Genuine Escape vs. Slower:** This is a genuine escape for reversible domains. It only makes the curse slower in irreversible domains.

  ### 3. Visible Restraint and Reputation
  **Rank:** 3
  **Mechanism:** If restraint is observable and rewarded, the "ceding the field" premise fails.
  **Why it bites:** Your model assumes action is visible and rewarded, while restraint is invisible and penalized. In many institutions (tenure, judiciary, safety-critical engineering), prudence is a signaled virtue. Actors who restrain themselves based on good judgment gain reputational capital ("steady hands"), which converts to influence later. The mistaken unilateralist may gain short-term visibility but suffers long-term reputational decay ("reckless").
  **Defender's Concession:** A defender would argue that restraint is inherently counterfactual and thus hard to signal. You can't prove you *didn't* launch the dangerous experiment unless there was public pressure to do so. They would accept this defeater only in contexts where "not acting" is a public stance.
  **Your Implicit Commitment:** You are implicitly committed to a visibility asymmetry: that "doing" is always more legible than "not doing."

  ### Asymmetries: Permission vs. Worth
  You asked about the asymmetry where judgment is about *permission* (norms) rather than *worth* (value).
  *   **Permission:** Violating a norm usually triggers immediate social enforcement (blame, sanction). This aligns with **Cost Internalization**. The mistaken unilateralist is punished by the group. The curse is weaker here.
  *   **Worth:** Judging value (e.g., "this research is safe enough") often lacks immediate enforcement. The punishment only comes if the risk materializes, which might be late or never. The curse is stronger here.
  *   **Actor Bears Downside:** If the actor bears the downside, the curse **inverts**. The system becomes robust *because* the unilateralists eliminate themselves. The curse only survives when the actor captures the upside (credit, profit) while the group absorbs the downside (risk, pollution).

  ### Risks to the Strong Claim
  The strong selection claim risks becoming a tautology. If you define the relevant institutions as "those where downsides are socialized and actions are irreversible," then the claim is true by construction. The risk is that you are not describing a universal feature of unilateralism, but a specific feature of *unaccountable* unilateralism. If you strip away the accountability mechanisms (cost internalization, reversibility, reputation), you have built a model where mistakes necessarily accumulate. That is a theorem about your model, not necessarily the world.

  To hold the claim without it being trivial, you must demonstrate that modern institutions *systemically* drift toward socializing downsides and obscuring restraint, rather than these being contingent features you can fix.

  ### Verdict
  Verdict: fragile - Cost internalization removes the mistaken from the pool.
