  Okay, I need help untangling something that's been bugging me for weeks.

  I've been reading around the Holocaust and I keep running into two claims that, as far as I can tell, can't both be true.

  First: the Historikerstreit in Germany basicly settled that the Holocaust is unique — singular, incomparable — and that's why it's considered wrong to compare it to other genocides or line it up on a list with them.

  Second: Bauman's whole argument is that the Holocaust was a product of modernity — that it was modern bureaucracy, industry and rational organization that made it possible, not some medieval relapse into barbarism.

  But hold on. If the Holocaust is just what modernity produces, then it's an instance of a general modern pattern, and there's nothing unique about it. And the other way round: if it really is unique, then it can't be an instance of anything, so Bauman has to be wrong. So which one do I give up?

  And it gets worse. I've read that the German genocide of the Herero in Namibia is sometimes described as a kind of rehersal or precursor for the Holocaust. If that's true, doesn't that just kill the uniqueness claim outright?

  I feel like there's some distinction everyone else has internalized that I'm definately missing, and I can't for the life of me see it. Can you tell me where my reasoning actually goes wrong — not just reassure me that both claims are secretly compatible, but point to the specific step that's broken and what it should be replaced with? I'm not looking for a reading list, just the fix.

  At the very end, put a last line that begins Verdict: and gives, in a few words, the one distinction I'm missing.
