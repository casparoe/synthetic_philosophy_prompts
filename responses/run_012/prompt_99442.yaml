answer: |-
  You are reading this correctly, and your confusion is understandable. James is walking a tightrope here. He is trying to persuade pacifists without alienating patriots, and to do that, he has to admit something that sounds like a concession but is actually a diagnosis.

  Here is a breakdown of what is happening in those passages.

  ### 1. Is he conceding the case to the war party?
  No, but he is conceding a **psychological point**. James is arguing that you cannot defeat war simply by proving it is immoral, irrational, or horrific. If you approach peace activism thinking that people love war because they are stupid or evil, you will fail.

  He is arguing that people love war because it satisfies deep human needs: the need for discipline, the need for community, the need for self-sacrifice, and the need for high stakes. When he says "The military feelings are too deeply grounded," he is telling the peace advocate: "You have to respect the enemy here, and the enemy is human nature."

  So, he isn't saying war is *good*; he is saying war is *potent*. It does something for the human spirit that peace currently fails to do.

  ### 2. What is the "better substitute" a substitute for?
  This is the core of his argument. The substitute is not for the violence; it is for the **function** that war serves.

  War provides a "strenuous" life. It demands everything from a person. It creates a clear distinction between heroism and cowardice (glory and shame). James is arguing that we need to find a way to generate that same intensity, discipline, and collective purpose without the killing.

  When he says "better substitutes," he means social projects or civic duties that demand as much courage and sacrifice as war does, but are directed toward construction rather than destruction. (Later in the essay, he famously suggests a "war against nature," where young people serve in coal mines or build infrastructure, to get that same military discipline without the enemy.)

  ### 3. The "Politics and Trade" Sentence
  This is the trickiest part of the passage. Here is the syntax unpacked:

  > *Military feelings won't go away until [better substitutes] are offered than [the glory and shame of politics and trade].*

  James is identifying politics and economics (trade) as the **current** peaceful alternatives. They are the things we do instead of war. They *do* offer glory (winning an election, making a fortune) and shame (losing, going bankrupt).

  However, James is saying these are **pale shadows**. They aren't good enough.
  *   **Trade** is often about self-interest and profit, not self-sacrifice.
  *   **Politics** can be corrupt or abstract, lacking the life-and-death intensity of the battlefield.

  He is arguing that the "glory and shame" of making money or winning office are not powerful enough to kill the military instinct. We need a substitute that is *better* than politics and trade. We need something more morally demanding and emotionally gripping than just commercial success.

  ### 4. "The horrors make the fascination"
  This is a claim about **human psychology**, though he uses it as a rhetorical move to shut down a common argument.

  Many peace advocates argue: "If people only saw how bloody war is, they would stop wanting it." James is saying: "No, they won't." He believes that for many, the danger *is* the point. The risk of death is what makes the courage meaningful. If you remove the horror, you remove the test of character.

  By admitting this, he is strengthening his own position. He is saying: "Since we can't scare people out of war, we must offer them something else that tests their character just as severely."

  ### Summary of the Argument
  James is not surrendering to the war party. He is upgrading the peace argument.

  *   **Old Peace Argument:** War is horrible and irrational; therefore, stop it.
  *   **James's Argument:** War is horrible, but it fulfills a deep psychological need for heroism and discipline. Politics and money aren't enough to replace that need. Therefore, we must invent a new kind of civic duty—a "moral equivalent"—that is as hard and demanding as war, but peaceful.

  He is telling the peace advocate that their job is much harder than they thought. They aren't just stopping a bad habit; they are replacing a central pillar of human culture with something equally compelling but benevolent.
