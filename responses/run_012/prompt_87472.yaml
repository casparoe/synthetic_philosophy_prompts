answer: |-
  ### I. The Case Under the Theory

  To map the Senate episode onto the four answers, we must first identify the ontological status of the change. In 2013 and 2017, the **text** of Rule XXII did not change; it still reads that cloture requires three-fifths. What changed was the **precedent** (the interpretation of the Chair) and the **practice** (the enforcement of that interpretation by majority vote). The Standing Rules of the Senate exist in a dual state: as printed text and as interpreted by the Chair subject to appeal.

  **The Majority's Claim:**
  The Majority's argument expresses a hybrid of **Official Practice** and the **Pseudo-problem**. By asserting that the Senate's constitutional power to determine rules is a "continuing power" that cannot be entrenched by a prior majority, they argue that the current majority's act of interpretation *is* the valid rule-making act. They deny that a vicious regress exists: the rule does not need to authorize the act because the constitutional authority of the body supersedes the standing rule. They treat the rule not as a constraint on their power to define the rule, but as an object subject to their current will. This aligns with the Pseudo-problem view that the act of changing the rule is not logically distinct from the exercise of the power the rule purports to regulate. However, because they relied on the convergence of the majority to sustain the Chair's overturned ruling, they ultimately rely on **Official Practice**: the rule is what the officials (the Senators) treat as the rule.

  **The Minority's Objection:**
  The Minority's complaint is a classic statement of **Prior Authorization**. They argued that Rule XXII explicitly mandates a two-thirds vote to amend the cloture threshold. By bypassing this via a simple majority appeal, the Majority violated the rule in force. Implicitly, this objection flirts with **Rupture**. If the change was not authorized by the existing basic norm (Rule XXII), then, in Kelsenian terms, the validity of the new procedure rests on a break in the chain of legitimacy. The Minority framed the maneuver as "breaking the rules" or a "power grab," suggesting that the continuity of the legal order was threatened.

  **The Best Fit:**
  **Official Practice** best fits what actually happened. The text of Rule XXII remained static, yet the operational reality shifted. The validity of the change was not derived from the text (Prior Authorization) nor did it result in a systemic collapse or founding of a new Senate (Rupture). It was validated because the relevant officials (the majority) enforced it and the minority, though protesting, ultimately acquiesced to the new reality (evidenced by the 2017 Republicans adopting the same mechanism).

  **The Other Three Views:**
  *   **Prior Authorization:** On this view, the 2013 precedent was *invalid*. The rule in force required a two-thirds vote; a simple majority vote could not amend it. The consequence is radical: every nomination confirmed under the post-2013 precedent rests on a procedurally illegitimate foundation. This view forces a distinction between *efficacy* (the nominees are seated) and *validity* (the process was void), rendering the legal theory descriptively impotent against political reality.
  *   **Rupture:** This view must characterize the 2013 maneuver as a revolution. Since the change was not authorized by Rule XXII, the "basic norm" of the Senate shifted. However, this creates a continuity problem: if it were a true rupture, the 2017 Congress would be operating under a new constitutional order of the Senate. Yet, they treated the 2013 precedent as binding inheritance, not as a revolutionary decree they had to re-ratify. Rupture theory cannot easily explain why the "revolution" did not reset the clock on other rules.
  *   **Pseudo-problem:** This view asks why the Majority needed a route that avoided a direct vote on the rule at all. If no paradox exists, why the procedural gymnastics of the point of order and appeal? The answer lies in the *textual* resistance. While the logic of self-amendment may not be paradoxical, the *institutional* cost is high. The Majority needed to claim they were interpreting the Constitution, not amending the Rule, to avoid the stigma of violation. The Pseudo-problem view dissolves the logical paradox but fails to account for the political necessity of disguising the change.

  ### II. The Theory Under the Case

  Turning the episode around to test the four answers reveals where the self-amendment problem is robust and where it requires supplementation.

  **Durability and Prior Authorization:**
  The durability of the precedent, specifically its adoption by the party that originally objected to it (the Republicans in 2017), vindicates **Official Practice** and embarrasses **Prior Authorization**. Under Prior Authorization, the 2013 change was void *ab initio*. Therefore, the 2017 Majority could not rely on it; they would have had to initiate a new unauthorized change. By treating the 2013 precedent as settled law, the 2017 Majority acknowledged that validity is constituted by sustained practice, not by antecedent textual authorization. The self-amendment problem, viewed through Prior Authorization, cannot explain why an "invalid" act becomes the basis for future "valid" acts without a formal ratification.

  **Disuse on Legislation and Official Practice:**
  The maneuver's disuse on ordinary legislation shows that **Official Practice** needs an account of *convergence* that the self-amendment problem does not supply. The problem asks how a rule can change itself; it does not ask *when* officials will agree that it has changed. The Majority has the votes to extend the nuclear option to legislation, yet they hesitate. This suggests that "Official Practice" is not merely about the will of the current majority, but about a stable expectation among the institution's members. The self-amendment problem describes the logic of the change, but it is silent on the sociological threshold required for a practice to become a rule. It cannot distinguish between a temporary majority imposition and a settled rule of recognition.

  **Availability and Rupture:**
  The availability of the maneuver to any future majority, coupled with its disuse, complicates the **Rupture** thesis. If this were a true Kelsenian rupture, using the maneuver should be rare and catastrophic, resetting the normative order. However, the maneuver is now a known "tool" in the Senate toolkit. Its availability suggests it is part of the system's grammar, not an exit from the system. Yet, the reluctance to use it on legislation suggests participants *feel* it as a rupture. This supports a nuanced Rupture view: self-amendment at the level of ultimate rules is a "latent revolution." It is legally continuous but normatively discontinuous. The self-amendment problem helps identify this boundary: changes authorized by text are normal politics; changes authorized only by practice are quasi-revolutionary.

  ### III. The Silence of the Problem

  Finally, we must acknowledge where the self-amendment problem falls silent.

  First, the problem cannot, on its own resources, distinguish a rule-change **valid because authorized** from one **valid because accepted**. In the Senate, the 1975 change (authorized by text) and the 2013 change (accepted by practice) produced the same operational result. The logical structure of self-amendment treats them as distinct puzzles, but it lacks the normative metric to tell us which produces a more stable or legitimate outcome. It describes the mechanism of validity but cannot weigh the cost of bypassing authorization.

  Second, it is unclear whether this distinction is one the **participants themselves can draw**. Senators argue in the language of Prior Authorization ("You broke the rule") even when they act according to Official Practice ("We are setting a precedent"). They inhabit both theories simultaneously depending on whether they are in the Majority or Minority. The self-amendment problem treats these as mutually exclusive theoretical stances, but in the institution, they are rhetorical tools deployed strategically. The theory cannot adjudicate which stance is the "true" description of the system because the system operates on the tension between them.

  Third, the problem cannot say **which of the four answers a system ought to adopt**. It can describe that the Senate operates on Official Practice, but it cannot determine if the Senate *should* require Prior Authorization to protect minority rights. The self-amendment problem is a diagnostic of legal logic, not a prescription for institutional design. It reveals the paradox of sovereignty—that the power to make rules must ultimately rest outside the rules—but it cannot resolve whether that power should be constrained by text (Prior Authorization) or left to political convergence (Official Practice). The Senate episode shows that a system can survive the self-amendment problem without solving it, living instead in the ambiguity between the text that binds and the practice that frees.
