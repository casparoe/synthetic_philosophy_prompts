answer: |-
  # Seminar Handout: Which Theory of Consent Validity Do You Actually Hold?

  **Instructions:** Read each scenario below. Select the **one** statement that best matches your judgment of the situation. Do not worry about legal technicalities or philosophical labels; answer based on your intuitive sense of whether the agreement holds.

  ***

  ### 1. The Surgeon's Odds
  A surgeon tells a patient that a specific risk of permanent nerve damage is "rare." He does not mention that "rare" statistically means a 1-in-2,000 chance. The patient agrees to the surgery.
  *   **A.** Her consent was valid; the surgeon provided enough information for a decision.
  *   **B.** Her consent was invalid; the misleading statistic undermines her agreement.
  *   **C.** Her consent was valid, but the surgeon still wronged her by withholding the specific number.

  ### 2. The Sterility Lie
  A man tells his partner he is sterile, knowing this is false. She consents to sex specifically to avoid pregnancy and subsequently conceives.
  *   **A.** Her consent was invalid; she agreed to sex under a false premise about the consequences.
  *   **B.** Her consent was valid, but he still wronged her by lying about his fertility.
  *   **C.** Her consent was valid; she agreed to the physical act of sex, and conditions do not negate that.

  ### 3. The Kidney Price
  A kidney seller accepts a fee well below what the intermediary is paid, having been told by the intermediary that this is the "going rate." The seller is desperate for money.
  *   **A.** Her consent was invalid; the exploitation and deception regarding the price void the agreement.
  *   **B.** Her consent was valid, but the intermediary still wronged her by taking advantage of her desperation.
  *   **C.** Her consent was valid; she accepted the offered price freely, regardless of the intermediary's profit.

  ### 4. The Dementia Trial
  A woman in early dementia can restate the risks of a trial treatment in her own words but cannot compare the probabilities of success versus failure. She agrees to join the trial while her adult daughter objects.
  *   **A.** Her consent was invalid; she lacks the capacity to weigh the probabilities required for this decision.
  *   **B.** Her consent was valid; she understands the core risks, which is sufficient for this specific choice.
  *   **C.** Her consent was invalid; her daughter's objection overrides the patient's current expressed wish.

  ### 5. The Prisoner's Offer
  A prisoner volunteers for a high-risk medical study that will shorten his sentence by six months if he completes it.
  *   **A.** His consent was invalid; the pressure of incarceration makes any agreement to risk coercive.
  *   **B.** His consent was valid, but the state still wronged him by offering such a choice in a prison context.
  *   **C.** His consent was valid; a reduction in sentence is an offer, not a threat, and he chose to accept it.

  ### 6. The Clickwrap Agreement
  A user clicks "I agree" to terms permitting a company to train AI models on her private messages. She did not read the terms.
  *   **A.** Her consent was invalid; without reading or understanding the terms, no agreement actually occurred.
  *   **B.** Her consent was valid, but the company still wronged her by burying invasive terms in fine print.
  *   **C.** Her consent was valid; clicking the button is the act of agreement, regardless of whether she read the text.

  ### 7. The Blank Check
  A patient tells her surgeon, "Whatever you think best," and goes under anesthesia. The surgeon performs a procedure she would have refused had she been asked specifically about it.
  *   **A.** Her consent was invalid; she did not authorize this specific procedure.
  *   **B.** Her consent was valid, but the surgeon still wronged her by exceeding the trust she placed in him.
  *   **C.** Her consent was valid; she transferred the authority to decide to the surgeon, and he used it.

  ### 8. The Morning Regret
  A man agrees to sex he knows he will regret in the morning. He is drunk but currently lucid and verbal.
  *   **A.** His consent was invalid; intoxication undermines the capacity to consent, regardless of current lucidity.
  *   **B.** His consent was valid, but the partner still wronged him by engaging when regret was foreseeable.
  *   **C.** His consent was valid; he was lucid enough to speak and agree at the time.

  ***

  ## Instructor's Scoring Key & Theoretical Mapping

  **Note to Instructor:** This quiz is designed to sort students into philosophical clusters based on their verdict patterns. There is no "correct" score. Use the tally below to identify which theoretical commitments dominate the room.

  ### Part I: Tallying the Positions

  Count the number of times the student selected each option type across the eight questions.

  *   **Invalidity Count:** (Total of all "A" answers)
  *   **Separatist Count:** (Total of all "B" answers)
  *   **Validity Count:** (Total of all "C" answers)

  *High Invalidity* suggests a **Substantive/Protectionist View** (consent is fragile and easily vitiated by context).
  *High Separatist* suggests **Moral Separatism** (consent can be normatively effective even if the action is immoral).
  *High Validity* suggests **Formalism/Normative Power** (consent is a robust transactional mechanism).

  ### Part II: Diagnostic Question Pairs

  To identify specific theoretical commitments, compare answers on the following paired questions:

  **1. The Deception Distinction (Compare Q1 & Q2)**
  *   **Q2 Invalid / Q1 Valid:** Holds the **"Fraud in the Factum"** view. Deception invalidates consent only when it defeats what the consenter was actually agreeing to (the nature of the act), not merely when it induces them (consequences/risks).
  *   **Q1 & Q2 Both Invalid:** Holds the **"Broad Deception"** view. Any material lie that influences the decision vitiates consent.
  *   **Q1 & Q2 Both Valid:** Holds the **"Caveat Emptor"** view. Consent is robust against deception unless it physically prevents refusal.

  **2. The Duty to Disclose (Compare Q1 & Q3)**
  *   **Q1 Invalid / Q3 Valid:** Holds the **"Professional Duty"** view. Validity turns on whether the deceiver owed a specific fiduciary or professional disclosure duty (surgeon) rather than a general duty of honesty (salesman).
  *   **Q1 & Q3 Both Invalid:** Holds the **"Fairness"** view. Validity turns on whether the information asymmetry was exploitative, regardless of professional status.

  **3. Normative Power vs. Mental State (Compare Q6 & Q8)**
  *   **Q6 & Q8 Both Valid:** Holds the **"Normative Power"** view. Consent is a performative act (clicking, speaking); internal mental states (reading, regret) are secondary to the external authorization.
  *   **Q6 & Q8 Both Invalid:** Holds the **"Mental State"** view. Consent requires actual understanding and unimpaired volition; external signs are merely evidence, not the consent itself.
  *   **Q6 Valid / Q8 Invalid:** *Theoretically Tense.* Suggests a view where contractual formalism overrides ignorance, but biological impairment overrides speech. (See "Unmapped Patterns" below).

  **4. Coercion Standards (Analyze Q5)**
  *   **Q5 Invalid:** Holds the **"Objective/Structural"** view. Contextual pressures (prison) can render consent invalid even if the subject feels uncoerced (subjective).
  *   **Q5 Valid:** Holds the **"Subjective/No-Threat"** view. Unless a specific threat is made by the agent, the offer is valid, regardless of background desperation.

  **5. Competence Standards (Analyze Q4)**
  *   **Q4 Valid (Option B):** Holds the **"Decision-Relative"** view. Competence is fluid; if she understands the gist of *this* decision, she is competent.
  *   **Q4 Invalid (Option A or C):** Holds the **"Fixed Threshold"** view. There is a cognitive bar (e.g., comparing probabilities) that must be met, or surrogate authority overrides current expression.

  **6. Separatism (Analyze "B" Answers)**
  *   **Frequent "B" Selections:** Holds the **"Separatist"** view. Valid consent and wrongful conduct can coexist. The agreement is normatively effective (no battery/violation of rights), but the actor is morally blameworthy.
  *   **Rare "B" Selections:** Holds the **"Unity"** view. If the conduct is wrongful, the consent is typically treated as invalid, or if consent is valid, the conduct is permissible.

  ### Part III: Unmapped Patterns & Theoretical Gaps

  **1. The Incoherent Combination (Q6 Valid / Q8 Invalid)**
  *   **Pattern:** Student marks Clickwrap as Valid (ignoring lack of mental understanding) but Drunk Sex as Invalid (ignoring presence of verbal agreement).
  *   **Diagnosis:** This position is difficult to defend coherently. It suggests that *ignorance* does not vitiate consent, but *intoxication* does, despite both involving a gap between mental state and external expression. This is usually **incoherent** unless the student relies on a specific policy distinction (e.g., "protecting bodily integrity is more urgent than protecting data").

  **2. The Unexplored Combination (Q3 Valid / Q5 Invalid)**
  *   **Pattern:** Student marks the Kidney Sale as Valid (market freedom) but the Prisoner Study as Invalid (coercion).
  *   **Diagnosis:** Both cases involve structural desperation. Validating one while invalidating the other suggests an **unexplored** or intuitive distinction between "economic pressure" and "state custody" that lacks a unified theoretical framework in the literature.

  **3. Indistinguishable Positions**
  *   **Separatism vs. Duty-Based Views:** A student who selects "Valid but wronged" (Separatist) on Q1 (Surgeon) may look identical to a student who believes the consent was *actually* invalid but is choosing the "softest" option available. The quiz cannot distinguish between a true Separatist and a "Soft Protectionist" who dislikes marking "Invalid."
  *   **Normative Power vs. Strict Validity:** A student who selects "Valid" on Q6 (Clickwrap) might be a Normative Power theorist (the act creates the obligation) or a Contractualist (the signature binds). The verdict is the same, though the reasoning differs.

  **4. Unoccupied Position: The "Mental State Separatist"**
  *   **Pattern:** Selecting "Valid but wronged" on Q6 (Clickwrap).
  *   **Diagnosis:** This is theoretically rare. If consent requires a mental state (understanding the terms), and the user didn't read them, consent is usually *invalid*, not "valid but wronged." To claim it is valid despite no mental state, yet wronged, requires a complex hybrid view that is largely **unoccupied** in current literature.
