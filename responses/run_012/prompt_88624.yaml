          *   Rest likely mixed grad students/researchers.
      *   **Constraints:** No citations/reading lists. No hedging about audience (I know the audience). 8 specific objections ordered by damage potential. Phrased in the specific voice of the audience members. 2-minute reply per objection. 1-line note on reply weakness. What to concede early. The "killer" objection. The "hope nobody asks" question.
      *   **Tone:** Direct, high-stakes, academic but practical, slightly stressed (left it late).

  2.  **Deconstruct the Thesis & Audience Matchups:**
