answer: |-
  # Q&A Prep Sheet: Interventionist Structural Realism
  **Presenter:** Retired Mineralogist (40 yrs X-ray)
  **Topic:** Structure of Interventions vs. Mathematical Structure
  **Audience:** 5-person Reading Group (2 OSR, 1 CE, 2 SSR)

  ---

  ### 1. The Ex-Chemist (Old-School Scientific Realist)
  **Likelihood:** Certain | **Damage:** High
  **The Attack:** "You're separating the 'doing' from the 'knowing' artificially. In my lab, the specimen prep worked *because* we understood the bonding theory. If the theory was just 'paint,' why did changing the theory (e.g., from classical to quantum bonding models) allow us to prep *new* specimens we couldn't before? The routines aren't stable; they evolve with the ontology. Isn't this just instrumentalism with a miner's helmet on?"

  **2-Minute Reply:**
  "You're right that routines evolve, but they evolve much slower than the equations. I used the same Bragg diffraction routines under three different interpretations of what the diffraction pattern *was*. The quantum model let us prep new things, yes, but it didn't change the fact that the crystal pushed back when we got the angle wrong. My claim isn't that theory is useless; it's that theory is the *tool*, while the intervention is the *hand*. The stability I'm pointing to is the resistance of the world to our manipulation, which persists even when our explanation of *why* it resists changes. I'm not denying ontology; I'm saying the ontology is accessed *through* the stability of the intervention, not the other way around."

  **Weakness:** This concedes that theory *does* drive progress in intervention. If the "wall" changes shape when the "paint" changes, the distinction blurs. You risk admitting the "wall" is theory-laden.

  ---

  ### 2. The Hardline Ontic Structural Realists (OSR) (x2)
  **Likelihood:** High | **Damage:** High
  **The Attack:** "You're talking about *human* structure, not *world* structure. Intervention is a relation between an agent and a system. If OSR is right, relations are fundamental and mind-independent. Your 'lab routines' are anthropocentric scaffolding. Where is the mind-independent structural reality in your view? Or have you reduced realism to sociology?"

  **2-Minute Reply:**
  "I'm not talking about the routine as a social habit; I'm talking about the *constraint* the routine encounters. When I set up a goniometer, there are degrees of freedom I have and degrees of freedom I don't. That limitation isn't human; it's modal. The 'structure of intervention' is the map of those modal constraints. I agree with you that objects-as-substances are suspect. But the 'node' in your graph isn't just a mathematical point; it's a locus of resistance to manipulation. I'm grounding your abstract structure in the physical friction of the lab."

  **Weakness:** They will press you on whether "resistance" presupposes an object doing the resisting. If you say "no," you sound mystical. If you say "yes," you're back to standard realism.

  ---

  ### 3. The Constructive Empiricist (CE)
  **Likelihood:** Medium | **Damage:** Medium
  **The Attack:** "This sounds like Van Fraassen would agree with you, minus the label. He says aim for empirical adequacy, not truth. You say aim for reproducible intervention. What's the difference? Why do you need to call this 'Realism' at all? Why not just admit you're talking about reliable instruments?"

  **2-Minute Reply:**
  "Because instruments break, and when they do, we don't just tweak the calibration; we say the *world* interfered. Empiricism stops at 'saving the phenomena.' I'm saying the phenomena push back. When a crystal fractures during mounting, that's not just an observation; it's a causal interaction that limits what I can observe next. I'm a realist about the *friction*, not just the *view*. I need the 'Realism' label because the resistance exists whether I observe it or not. Empirical adequacy is about the fit between theory and data; my view is about the fit between action and world."

  **Weakness:** Van Fraassen can accommodate "resistance" as part of the observable phenomena. You need to prove you aren't just re-describing empirical adequacy in muscular language.

  ---

  ### 4. The General Old-School Realist (SSR)
  **Likelihood:** Medium | **Damage:** Medium
  **The Attack:** "You're throwing out the baby with the bathwater. The reason your routines work is that the terms in your equations *refer* to real things (electrons, lattices). If you cut the link between the math and the furniture of the world, you can't explain the *success* of the intervention. Truth explains success; 'routines' just describe it."

  **2-Minute Reply:**
  "Truth explains success only if you assume your current theory is the final one. History shows the 'furniture' changes—phlogiston became oxygen, ether became fields. But the ability to isolate a gas or measure a wave speed remained. I'm arguing that the *reference* is stable at the level of interaction, not at the level of description. We latch onto the real furniture by bumping into it, not by naming it correctly. The math is a sketch of the furniture; the intervention is the collision."

  **Weakness:** This risks sounding like you think "collision" happens without "things" colliding. It invites the charge of being incoherent about causality.

  ---

  ### The One Question You're Dreading
  **Who:** The Ex-Chemist (follow-up)
  **The Question:** "Okay, you say the 'wall' pushes back. **What is the wall made of?** If you refuse to say it's made of the entities my theories describe (atoms, bonds, fields), then you have no account of *why* the wall is there. If you *do* say it's made of those entities, then you've admitted the theory is latching onto reality, and your 'Interventionist' view collapses back into Standard Realism. Which is it?"

  **Why it's damaging:** It forces you into a dilemma.
  1.  **Deny the entities:** You look like an instrumentalist who ignores the causal powers of the materials you studied for 40 years.
  2.  **Accept the entities:** You concede that the "mathematical structure" (which describes the entities) *is* what survives, undermining your core claim that the math is just "paint."

  **Suggested Defense (if asked):**
  "It's made of *capacities*. Not 'electrons' as little balls, but 'capacity to diffract,' 'capacity to fracture.' The theory names the capacity; the intervention tests it. I'm not denying the entities exist; I'm saying we know them *only* as centers of causal capacity revealed through intervention. The math describes the capacity, but the *reality* is the capacity itself, which survives even when the mathematical description of it gets overhauled."
  *(Note: This leans heavily on Cartwright's "Dappled World" / capacities view. Be prepared for them to pounce on that.)*
