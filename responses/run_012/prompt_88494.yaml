  1. The doctrine's implicit view of memory
  The doctrine operates on a theory of "Skin-Bound Cognitivism." It presupposes that the legal boundary of the mind coincides with the biological boundary of the body. Inside the skin, states are mental; outside the skin, objects are property. Memory is treated as an internal, static reservoir of knowledge that becomes legally relevant only when communicated through testimonial acts. When a suspect types a passcode, the law sees this as bridging the gap between internal knowledge and external evidence, thereby triggering protection against self-incrimination. The passcode is protected not because it secures memory, but because producing it admits knowledge. Conversely, biometric features are classified as physical characteristics, akin to blood or handwriting, because they exist on the body's surface regardless of conscious recall. The smartphone itself, despite holding the functional equivalent of a lifetime's memory, is categorized as a container of property rather than an extension of the cognitive self. Consequently, the Fourth Amendment protects the device as a possession, while the Fifth Amendment protects the key only if it requires a mental act. This framework assumes that cognition stops where the body ends. It treats the phone as a warehouse where memory is stored, not as a component of the remembering system itself. The law thus maintains a sharp ontological divide: the mind is a private sanctuary of thought, while the world, including digital tools, is a public sphere of physical evidence. This view ignores the functional integration of device and user, prioritizing the location of the storage medium over the role it plays in the cognitive process. The implicit theory is that memory is what you hold in your head, not what you hold in your hand. Even at the border, where sovereignty claims are highest, the device remains property subject to search, implying that whatever memory resides there is not truly "yours" in the constitutional sense until it is retrieved by your internal mind. The doctrine presumes a Cartesian theater where the self watches the world, rather than a system extended into it. The testimonial privilege protects the integrity of the internal theater, not the external props.

  2. Strict presupposition versus comfortable fit
  The strict presupposition of this practice is not the location of memory, but the distinction between compelled communication and physical surrender. The law requires a difference between an act that conveys knowledge and a condition that yields evidence. This fits comfortably with a skull-bound view because, historically, only the brain conveys knowledge while the body yields physical data. However, the practice does not logically require the mind to be confined to the skull; it only requires that the *method of access* be classified as either testimonial or physical. If a device were accessed by a mental command transmitted via brainwave, the practice could theoretically protect it as testimonial without admitting the device is part of the mind. The core commitment is to the voluntariness of the communicative act, not the metaphysics of cognition. Therefore, the skull-bound theory is a contingent fit rather than a necessary foundation. The practice could survive the rejection of Cartesianism if the definition of "testimonial" expanded to include functional access to extended memory. What would not survive is the collapse of the act/condition distinction. If every physical surrender were deemed communicative because it reveals information, the Fifth Amendment would swallow the Fourth. Thus, the doctrine presupposes that some acts are purely physical, regardless of their informational content. It relies on the intuition that giving a finger is fundamentally different from speaking a thought. This intuition aligns with folk psychology but does not strictly depend on it. The legal machinery turns on the nature of the compulsion, not the ontology of the memory. As long as the law can distinguish between forcing a statement and forcing a posture, the implicit theory of memory remains secondary. The practice is committed to protecting the will, not necessarily the brain.

  3. What it rules out
  The practice explicitly rules out the Extended Mind Thesis as a legal principle. It is inconsistent with any view that treats external storage as constitutive of the cognitive self for Fifth Amendment purposes. If the phone were legally part of the mind, searching it without consent would resemble extracting a confession, yet courts treat it as searching a filing cabinet. This excludes the view that cognition is distributed across tools and environment. Furthermore, the doctrine rules out the view that biometric unlocking is a testimonial act. Under a distributed cognition view, presenting a finger to a sensor is functionally identical to recalling a code; both retrieve information from the extended system. The law rejects this equivalence by logic, not merely habit. The precedent holds that biometrics are non-testimonial because they do not require the suspect to disclose the contents of their mind. This logic excludes any theory claiming that physical traits communicate knowledge. However, the practice does not rule out all functionalist views of memory. A functionalist could agree that internal recall is special without claiming external tools are mind. The exclusion is specific to the legal status of the tool, not the nature of cognition itself. The doctrine is inconsistent with the claim that privacy rights attach to information based on its cognitive role rather than its location. It denies that the cloud is a protected mental space. This is excluded by the third-party doctrine, which treats shared data as abandoned privacy. Thus, the law rules out any theory that grants constitutional protection to memory based on its functional integration with the self. It mandates that protection follows physical possession or internal knowledge, not cognitive reliance. The logic of the Fifth Amendment requires a boundary that the Extended Mind Thesis blurs.

  4. Where it is underdetermined
  The doctrine is underdetermined regarding the role of volition versus location. Both a Cartesian dualist and a functionalist could agree that compelling a passcode is more intrusive than compelling a fingerprint, but for different reasons. The dualist argues the passcode is inside the mind; the functionalist might argue the passcode requires a voluntary cognitive act while the finger does not. Current decisions license both explanations equally well. The law protects the passcode because it is testimonial, but "testimonial" is defined by the act of communication, not strictly by the skull. Therefore, a theory that locates memory in the cloud but protects access based on voluntary authentication would yield the same results. The underdetermination lies in whether the protection covers the *information* or the *act*. Several incompatible theories of mind would license the same decisions because the legal test focuses on the suspect's behavior, not the memory's ontology. To force a choice, the courts would need a case involving passive cognitive access. Imagine a device that unlocks via neural interface without conscious command, or a password manager that auto-fills based on location. Here, the location of the memory (internal vs. external) and the voluntariness of the act diverge. If the law protects the auto-fill, it prioritizes the information's privacy regardless of the act. If it allows compulsion, it prioritizes the lack of testimonial act. Currently, the doctrine does not distinguish these scenarios. It assumes the passcode is always a mental act and the finger is always physical. A case where the finger acts as a key without mental engagement, or the mind acts without physical movement, would reveal whether the law protects the boundary of the body or the integrity of the choice. Until then, the metaphysical foundation remains ambiguous.

  5. The two rationales, pulled apart
  The testimonial and biometric rationales diverge when access requires physical presence but no mental retrieval. Consider a suspect forced to wear a smartwatch that keeps a phone unlocked via proximity. The testimonial rationale asks: did the suspect communicate knowledge? No, the watch did the work. The biometric rationale asks: is the suspect providing a physical characteristic? Yes, their presence and body heat or signal. Under current practice, the biometric rationale likely dominates. Courts have treated face and finger scans as physical evidence, implying that providing access via bodily presence is not testimonial. If the rationales were separated, the testimonial protection would vanish for the smartwatch, while the biometric rule would permit the compulsion. This suggests the practice is actually tracking the surface of the body rather than the content of the act. The law cares less about whether the suspect "knows" the key and more about whether the key is part of their flesh. However, this creates tension. If the watch stores the passcode, is it a container or a body part? The practice treats it as a container. But if the watch unlocks via heartbeat, it becomes biometric. The doctrine is tracking the *mode of authentication* rather than the *location of memory*. It permits compulsion when the body is the key, even if the body is merely carrying the key. This reveals that the biometric rationale is broader than the testimonial one. It swallows cases where the mind is not engaged but the body is. The practice is not consistently protecting mental privacy; it is protecting against forced communication. When communication is bypassed by technology that uses the body as a token, the protection fails. The doctrine tracks the physical instrumentality of the suspect, not the cognitive effort.

  6. What the extended mind thesis would change
  If the Extended Mind Thesis were adopted as a legal premise, the consequences would be transformative. First, passcode protection would extend to biometric unlocking. If the phone is part of the mind, forcing a finger to unlock it is forcing the mind to yield its contents, making it testimonial. The distinction between code and finger would collapse because both access the same cognitive system. Second, the device itself would gain Fifth Amendment protection against search, not just Fourth Amendment protection against seizure. Searching the phone would become equivalent to searching a thought process, requiring a higher threshold than a warrant. Third, border searches would face strict scrutiny. If the device is cognitive infrastructure, inspecting it at the border is inspecting the traveler's mind, potentially violating the privilege against self-incrimination regardless of sovereignty claims. Fourth, cloud copies would remain protected. If the system is extended, the location of the server is irrelevant; the data is still part of the user's cognitive loop. The Third-Party Doctrine would weaken, as sharing data with a provider would not abandon privacy if the provider is merely a functional component of the memory system. The whole area would reframe around cognitive liberty rather than property or privacy. The question would shift from "where is the data?" to "does this search impair cognitive autonomy?" However, this creates practical difficulties. Defining the boundary of the extended mind is harder than defining the boundary of the body. Does a library book count? A friend's memory? The law prefers bright lines. Finally, the focus would shift to the voluntariness of the act. If the mind is extended, compelling access is compelling the self to function against its will. This might protect against forced decryption even if the key is stored externally, provided the system is endorsed by the user. However, this risks making every search a search of the mind. The law might resist this by limiting "extended mind" to devices in immediate possession. Even so, the cloud copy remains problematic. If the cloud is part of the mind, subpoenas to companies become subpoenas to the self. The government would need to compel the user, not the company, to produce the data, triggering Fifth Amendment rights. This would upend the Third-Party Doctrine entirely. The bottom line remains: the current doctrine assumes a mind that stops at the skin. Accepting that it does not would require rewriting the distinction between testimony and evidence. The practice needs a view of the mind to function coherently, but it currently uses the wrong one. Rebuilding it without metaphysics is possible but would require abandoning the testimonial/physical distinction entirely in favor of a unified right to cognitive security. Ultimately, the law cannot avoid metaphysics; it simply hides it. Making it explicit would reveal that the current rules protect an outdated picture of the human being.
