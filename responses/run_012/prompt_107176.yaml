answer: |-
  \
  **Activity Title:** The Succession Protocol
  **Target:** 16 Final-Year Students
  **Duration:** 90 Minutes
  **Materials:** 
  - 4 distinct chairs (placed at the front, facing the class).
  - 16 envelopes (each containing 10 poker chips/tokens and a rule sheet).
  - 50 spare tokens (for the "State Bank").
  - A pack of small paper slips (for sealed bids).
  - Whiteboard and markers.
  - A timer (phone or watch).

  ### 1. Rules, Roles, and Materials

  **The Setup**
  Arrange the 4 chairs at the front. These are the **Elite Seats**. They are the only source of high status. The rest of the room is the **Common Zone**. 
  Distribute one envelope to each student. Inside are 10 tokens (their initial capital) and a printed summary of the rules.

  **The Roles**
  There are no fixed roles at the start. Every student is an **Agent**. In each round, Agents choose one of two paths:
  1.  **Commoner:** Stay in the Common Zone. Earn income from the State. Pay taxes to the Elite.
  2.  **Aspirant:** Pay an entry fee to compete for an Elite Seat.

  **The Economy (Whiteboard Tracking)**
  Draw three columns on the board: *Commoner Income*, *Elite Reward*, *State Tax*.
  - **Commoner Income:** Tokens given by the State to Commoners each round.
  - **Elite Reward:** Tokens given by the State to Seat-holders each round.
  - **State Tax:** Tokens Seat-holders must pay back to the State to maintain legitimacy.

  **The Mechanism**
  The game runs for **3 Rounds**. Each round represents a generation.
  1.  **Investment Phase:** Agents decide secretly whether to remain Commoners or become Aspirants. Aspirants must pay **2 tokens** into the Bank (Education Cost).
  2.  **Auction Phase:** If there are more Aspirants than Seats (4), Aspirants submit sealed bids (tokens) for the Seats. The 4 highest bidders win the Seats. Losers lose their Education Cost.
  3.  **Governance Phase:** The 4 Seat-holders must collectively pay the **State Tax** (set by you, the Instructor). To gather these tokens, they may forcibly tax Commoners (take tokens from envelopes).
  4.  **Resolution:** Income is distributed. Check **Collapse Conditions**.

  **The Parameters (For Your Eyes Only)**
  You will change the parameters each round to simulate structural pressure. Do not explain *why* yet.
  - **Round 1 (Stability):** Commoner Income: 5. Elite Reward: 20. State Tax: 10 total. (Easy to sustain).
  - **Round 2 (Expansion):** Commoner Income: 4. Elite Reward: 20. State Tax: 15 total. (Tighter).
  - **Round 3 (Crisis):** Commoner Income: 2. Elite Reward: 20. State Tax: 25 total. (Unsustainable).

  **Collapse Conditions (The Powder Keg)**
  Write these on the board before Round 1:
  1.  **Popular Unrest:** If any Commoner ends the round with **0 tokens**.
  2.  **Elite Fragmentation:** If the number of Failed Aspirants exceeds **6** in a single round.
  *If either condition is met, the Society Collapses. All tokens are void. Game Over.*

  **Payoff Scheme**
  - **Survival:** The goal is to end Round 3 with the most tokens.
  - **Status:** Seat-holders get a "Status Point" (tick on board). Most Status Points wins if tokens are equal.
  - **No Real Money:** The winner gets first choice of seminar reading for next week, or a small privilege (e.g., choosing the break time). This is low stakes but sufficient for final-year students to compete.

  ### 2. Timeline (90 Minutes)

  **00:00 – 00:15: Introduction & Setup**
  - Seat the class. Place the 4 chairs prominently.
  - Distribute envelopes.
  - Read the rules aloud. Emphasise: "You are rational agents. Maximise your tokens. Avoid Collapse."
  - **Crucial:** Do not explain the changing parameters. Just announce the numbers for Round 1 on the board.

  **00:15 – 00:45: The Game (3 Rounds)**
  - **Round 1 (10 mins):** Usually stable. Few Aspirants (4-6). Seats filled easily. Commoners taxed lightly.
  - **Round 2 (10 mins):** Announce new parameters. Commoners notice income drop. More students become Aspirants (8-10) because Elite Reward looks high relative to Commoner Income. Bidding war begins.
  - **Round 3 (10 mins):** Announce crisis parameters. Commoner income is pitiful. Everyone rushes to be an Aspirant (12+). Bids skyrocket. Seat-holders cannot extract enough tax from impoverished Commoners to pay the State Tax. Collapse condition triggered.
  - *Note:* Keep the pace brisk. Use the timer. If they hesitate, remind them: "Income is accruing. Decide."

  **00:45 – 01:30: The Debrief**
  - **Phase 1: Phenomenology (15 mins):** "What did you feel in Round 3?" "Did you choose to crash the society, or did it happen to you?"
  - **Phase 2: Structural Mapping (15 mins):** Map their actions to the theory (Positional Goods, Overproduction, Fiscal Squeeze).
  - **Phase 3: Model Critique (15 mins):** Reveal that *you* changed the numbers. Ask: "If I had set 5 chairs, would you be heroes or villains?"
  - **Phase 4: Synthesis (15 mins):** Discuss the tension between structural inevitability and model arbitrariness.

  ### 3. Debrief: Mapping Moments to Theory

  Use the whiteboard to draw connections between what happened and the philosophical concepts.

  | Moment in Game | Concept to Highlight | Question to Ask |
  | :--- | :--- | :--- |
  | **Round 1 Stability** | **Healthy Elite Density.** | "In Round 1, the elite were stable. Why didn't you complain then?" |
  | **Round 3 Rush** | **Elite Overproduction.** | "Why did you all choose to be Aspirants in Round 3? Was it greed, or was being a Commoner impossible?" |
  | **The Fixed Chairs** | **Positional Goods.** | "Could we have created more Chairs? What happens to the value of the Chair if I add 4 more?" |
  | **The Tax Demand** | **Fiscal Squeeze.** | "Seat-holders: You needed tokens to pay the State. Where did they come from? Did you want to tax Commoners that hard?" |
  | **The Collapse** | **Non-Monotonicity.** | "More ambitious people (Aspirants) entered the system. Did that make society better or worse?" |
  | **The Rules Reveal** | **Model Artefact.** | "I changed the income numbers. If this was history, who changed the numbers? If it was no one, is the model wrong?" |

  **The Pivot Point:**
  Halfway through the debrief, reveal the **Parameters Table** (the changing income/tax numbers you used).
  *Say:* "In Round 1, Commoner income was 5. In Round 3, it was 2. I decided that. In a real society, who decides that? If no one decides it, is it a law of nature? If someone did decide it, why didn't they stop the crash?"
  This forces them to confront the difference between a *simulation* (where the teacher is God) and *history* (where structure emerges from nowhere).

  ### 4. Predictable Failures & Fixes

  **1. The "Collusion" Failure**
  *Risk:* Students realise in Round 2 that if fewer people bid, everyone wins. They agree to limit Aspirants.
  *Fix:* Enforce **Sealed Bids**. Collect paper slips simultaneously. Remind them: "You cannot enforce contracts. This is a state of nature." If they still collude, introduce a "Defector" rule: "If anyone bids above 5 tokens, they win automatically." (Write this on a hidden card and reveal it if collusion occurs).

  **2. The "Cynic" Failure**
  *Risk:* Students refuse to play seriously, calling it "just a game."
  *Fix:* Frame it as a **Logic Test**, not role-play. "I am testing whether rational agents can solve a coordination problem." Use the "Status Points" to appeal to academic competitiveness.

  **3. The "Timekeeping" Failure**
  *Risk:* Bidding takes too long; debrief gets cut.
  *Fix:* Strict 3-minute limit per phase. Use a visible timer. If time runs out in Round 3, declare Collapse immediately and move to debrief. The abrupt end reinforces the "catastrophe" theme.

  **4. The "Winner" Distraction**
  *Risk:* Students focus on who won the tokens, missing the structural point.
  *Fix:* In the debrief, explicitly invalidate the winner. "The winner has 50 tokens. But the society collapsed. Is 50 tokens worth a revolution?" Shift the metric from *individual payoff* to *system survival*.

  ### 5. Limitations: What You Must Supply

  **The Ideological Component**
  The game cannot reproduce *why* people believe they deserve the Chair. In the game, it's pure math (tokens). In history, it's ideology, meritocracy, or divine right.
  *Your Task:* In the debrief, you must narrate this. "In the game, you bought education tokens. In history, you bought degrees, networks, and narratives. You felt entitled to the Seat. That entitlement is what makes the disappointment dangerous. The game gave you numbers; history gives you grievances."

  **The Time Scale**
  The game compresses generations into minutes. Students won't feel the "slow pressure."
  *Your Task:* Describe the pressure verbally. "Imagine Round 1 was your grandparents. Round 2 your parents. You are Round 3. You didn't see the income drop happen; you just woke up into it."

  ### 6. Final Note on Tone

  Do not resolve the tension. If a student asks, "So is structural theory true or not?" answer: "You tell me. Did you choose to crash the system, or did the rules crash it for you? And who wrote the rules?" Leave them with the irritation that both answers seem correct.

  \answer{That the structural forces shaping history are real enough to crush them, but arbitrary enough to have been otherwise.}
