      *   **Constraints:**
          *   Invent a setting (small city-state, concrete details).
          *   Mechanically live features: (1) Private vs. Public authorization (scarce); (2) Compounding costs of delay; (3) Private grievances vs. Common good.
          *   At least one role must defend the ruler's survival (defensibly).
