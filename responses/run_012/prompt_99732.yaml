      *   **Headings:** Overview, Setup and materials, Roles, Rules and payoffs, Run of play, The squeeze, Debrief, What will predictably go wrong, What the activity cannot reproduce.

  2.  **Deconstruct the Aquinas Position (II-II, Q. 42, A. 2, Ad 3):**
      *   Disturbing a tyrant's government is not sedition *unless* the disturbance causes greater harm than the tyranny.
      *   The tyrant is the true seditious party (encourages discord).
      *   The "squeeze": You have a right/duty to act, but the *consequences* of acting might make you the seditious one. It's a consequentialist constraint on a deontological permission.
      *   Key tension: Private initiative vs. Public authority. Aquinas generally prefers public authority to depose a tyrant, but allows for private action if no public authority exists (though he is cautious). The prompt emphasizes the *risk* of private action becoming sedition through disproportionate harm.

  3.  **Design the Activity:**
      *   **Setting:** City-state of "Ostra." Ruler: "Magister Vane."
      *   **Mechanic 1 (Authorization):** Need a "Seal of Legitimacy." Only one exists. It's held by a council or hidden. If you act without it, you are "Private." If you have it, you are "Public."
