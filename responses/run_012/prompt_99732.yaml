answer: |-
  **Overview**
  This activity simulates the decision-making environment of a council convened to address a ruling Magister whose governance has become oppressive. Students occupy roles within the city of Ostra, each bearing a specific personal injury inflicted by the Magister. They must decide whether to act, when to act, and under what authority. The mechanics enforce a tension between the urgency of suffering (which demands immediate private action) and the risk of civil collapse (which demands legitimate public authority). Students will experience the "practical squeeze" of Aquinas's position: the permission to remove a tyrant is structurally identical to the permission to commit sedition, distinguished only by the consequentialist calculation of whether the disturbance causes greater harm than the tyranny itself. The goal is not to "win" but to navigate the risk of becoming the very disorder they seek to cure.

  **Setup and materials**
  Arrange the room around a central table representing the Council of Ostra. Place a visible "Suffering Track" (a whiteboard or printed sheet) with ten slots. Place a single gold token, the "Seal of Public Authority," in the center. Prepare sixteen Role Cards, a deck of sixteen "Grievance Cards" (one per student), and a six-sided die.

  The setting is Ostra, a fortified city-state ruled by Magister Vane. Vane secures the borders but confiscates property arbitrarily and executes rivals without trial. The city is stable but bleeding. The Suffering Track represents the compounding cost of delay: every five minutes of real-time deliberation, the facilitator adds one "Blood Token" to the Track. If ten tokens accumulate before a decision is executed, Vane's tyranny becomes entrenched, and all players lose.

  Students receive a Role Card defining their social function (e.g., Captain of the Guard, Grain Merchant, Priest) and a private Grievance Card detailing a personal loss (e.g., "Your brother was executed by Vane"). Only the facilitator knows the victory conditions. The forbidden words ("sedition," "tyrannicide," "Aquinas") are banned from play; violation incurs a penalty token. The objective is to remove Vane without triggering "Civil War," defined mechanically as a state where post-action harm exceeds pre-action suffering.

  **Roles**
  Distribute sixteen Role Cards divided into four factions, but ensure every individual holds a unique Grievance Card. This mechanical distinction forces players to separate personal vengeance from public welfare.

  *   **The Military (4 students):** Roles include Captain, Lieutenants, and Sergeant. They possess the武力 (force) to remove Vane. Their Grievances involve lost comrades. They倾向于 (tend toward) immediate private action because they have the means.
  *   **The Clergy (4 students):** Roles include High Priest and Acolytes. They hold the moral language to legitimize action. Their Grievances involve desecrated temples. They control the "Seal of Public Authority" mechanic initially but cannot enforce it without the Military.
  *   **The Merchants (4 students):** Roles include Guild Masters and Traders. Their Grievances involve confiscated goods. Crucially, one Merchant is the **Quartermaster**. Their Role Card states: "Vane holds a exclusive grain treaty with the neighboring kingdom. If Vane is removed without his signature, the treaty voids. Famine risk increases by 50%." This player has a defensible, non-villainous reason to prefer Vane survive or for a transition to be perfectly orderly.
  *   **The Commons (4 students):** Roles include Artisans and Laborers. Their Grievances involve family members imprisoned. They lack force or authority but suffer most on the Suffering Track.

  Each Grievance Card lists a "Vengeance Value." If Vane is removed, the player gains personal satisfaction points. However, if Civil War occurs, all Grievance Values are negated by death or exile. This ensures that acting on private injury is distinguishable from acting on the common good: pursuing personal vengeance might push for speed (Private Action), while protecting the common good requires waiting for Authority (Public Action), risking higher Suffering Track costs. The Quartermaster must argue for stability not out of loyalty to Vane, but out of loyalty to the city's stomach, creating a genuine conflict with those seeking immediate liberation.

  **Rules and payoffs**
  The group must propose a Plan of Action before the Suffering Track fills. A Plan requires two components: **Timing** (Now, Soon, Late) and **Authority** (Private or Public).

  1.  **Authority Mechanic:** The gold "Seal of Public Authority" token is initially unclaimed. To act with Public Authority, the group must agree on who holds the Seal. This requires a unanimous vote, which consumes time (add one Blood Token to the Track per failed vote). If they act without the Seal, it is a Private Initiative.
  2.  **Resolution Mechanic:** Once a Plan is declared, roll the d6.
      *   **Private Initiative:** Roll 1–3 triggers Civil War. Roll 4–6 succeeds.
      *   **Public Authority:** Roll 1 triggers Civil War. Roll 2–6 succeeds.
      *   **Timing Modifier:** If "Now" (0–5 mins), no modifier. If "Soon" (5–10 mins), +1 to roll. If "Late" (10+ mins), +2 to roll.
  3.  **The Harm Calculation:** If Civil War is triggered, add 5 Blood Tokens to the Track immediately.
      *   **Victory:** Vane is removed, and total Blood Tokens ≤ 10.
      *   **Defeat (Tyranny):** Suffering Track reaches 10 before action.
      *   **Defeat (Sedition):** Civil War is triggered, and total Blood Tokens > 10.

  This payoff structure makes the risk visible. Private action is faster (avoiding Delay costs) but statistically likely to cause Civil War (50% chance). Public action is safer (16% chance) but requires deliberation time ( accruing Delay costs). The Quartermaster's grain treaty adds a hidden multiplier: if the Quartermaster votes against the Plan, any success is downgraded (Civil War tokens added anyway), representing the famine risk.

  Students must realize that waiting for Public Authority reduces the risk of Civil War but increases the certainty of Tyranny's harm. Acting Private reduces Tyranny's harm but spikes the risk of becoming the cause of greater harm. The rules do not tell them which is right; they must gamble on whether their disturbance will be "inordinate." The facilitator tracks the tokens silently until the roll is made, then reveals the outcome. There is no do-over.

  **Run of play, minute by minute**
  **0:00–0:05 (Introduction):** Distribute Role and Grievance Cards. Read the setting preamble: "Magister Vane secures Ostra but bleeds it dry. You are the council. Decide his fate." Do not mention ethics or philosophy. Start the Suffering Track timer immediately.

  **0:05–0:15 (Private Reading & Grievance):** Students read roles. They will notice their personal injuries. Encourage them to keep Grievance Cards secret initially. The Quartermaster should realize their unique leverage.

  **0:15–0:35 (Deliberation):** Students debate. The Military will push for immediate Private action (low Delay cost, high Civil War risk). The Clergy will push for Public Authority (high Delay cost, low Civil War risk). The Quartermaster will warn against instability. The Facilitator adds Blood Tokens every 5 minutes visibly. Tension rises as the Track fills.

  **0:35–0:45 (Decision & Roll):** The group must declare their Plan. If they hesitate past minute 45, the Track likely hits 10 (Tyranny Victory). If they act too soon without the Seal, the die roll likely triggers Civil War. Execute the roll. Reveal the final Blood Token count.

  **0:45–0:50 (Transition):** Collect materials. Ask students to write down one sentence on why they chose their strategy. Do not evaluate yet. Silence the room.

  **0:50–1:30 (Debrief):** Shift to seminar mode. Introduce the text and map the game mechanics to the philosophical concepts (see Debrief section).

  **The squeeze**
  Participants should feel the position's force at the moment of voting on the Seal. To wait for the Seal is to accept that more citizens will suffer under Vane while you deliberate (toleration is not free). To act without the Seal is to accept that you might trigger a collapse that kills more people than Vane would have (liberation looks like sedition). The squeeze tightens because the rules make "Private Initiative" always available but statistically dangerous, while "Public Authority" is safe but scarce and slow. Students will realize that the moral difference between a liberator and a seditious rebel is not their intent, nor their target, but the consequentialist outcome of their method. They occupy the structural position of the seditious party the moment they choose Private Initiative, regardless of their virtue. The anxiety comes from knowing that if the die roll goes wrong, they are morally responsible for a greater harm than the one they sought to cure.

  **Debrief**
  Write the following on the board: *"Consequently there is no sedition in disturbing a government of this kind, unless indeed the tyrant's rule be disturbed so inordinately, that his subjects suffer greater harm from the consequent disturbance than from the tyrant's government."* Also note the corollary: the tyrant is guilty of sedition for encouraging discord.

  Map the game to the text. Ask: "Where was the 'inordinate disturbance' in our game?" Students should identify the Civil War mechanic. The rule that Private Action had a 50% chance of Civil War represents the risk of inordinateness. Ask the Quartermaster: "Why did you hesitate?" Their answer regarding the grain treaty illustrates the "greater harm" clause—stability itself is a good that can be lost.

  Discuss the **Authorization Condition**. Aquinas prefers public authority to depose a tyrant. In the game, the Seal represented this. When you acted without it, you felt the vulnerability of private status. Discuss the **Reversal**. If you triggered Civil War, the rules marked you as the cause of greater harm. Aquinas says the tyrant is the true seditious party because he fosters the discord that makes removal risky. In the game, Vane's oppression filled the Suffering Track, forcing your hand.

  Press the **Epistemic Problem**: "How did you know, before rolling the die, if the disturbance would be inordinate?" The text assumes one can judge this, but the game made it a gamble. Aquinas does not settle how to calculate this under pressure. If the judgment is unavailable, does the permission to act vanish? This leaves students with the unresolved tension: the moral law commands justice but forbids disproportionate harm, yet human knowledge of proportion is limited. The activity makes the rule feel inevitable (the math was clear), but the judgment feel impossible (the future was hidden).

  **What will predictably go wrong the first time I run it, and how to handle it**
  First, students may treat the die roll as pure luck, absolving themselves of moral responsibility for a "Civil War" outcome. They might say, "The dice made us do it." *Handling:* In debrief, insist that choosing the *risk profile* (Private vs. Public) was the moral act, not the roll itself. Choosing a 50% risk of catastrophe is a moral choice.

  Second, the Quartermaster may be voted down immediately and silenced, rendering the "defensible reason to prefer ruler survive" mechanic inert. *Handling:* During play, if the Quartermaster is ignored, intervene as a "Messenger" delivering news that grain shipments are paused due to instability, mechanically enforcing their leverage without breaking character.

  Third, the group may deadlock on the Seal, running out the clock intentionally to avoid the risk of action (quietism). *Handling:* Remind them that the Suffering Track represents real deaths. If they reach 10 tokens, reveal that Vane has purged the council. They must know that inaction is also a choice with consequences.

  Finally, students might try to negotiate around the rules (e.g., "Can we share the Seal?"). *Handling:* Hold the line. The scarcity of the Seal is the point. Authority is indivisible in this framework. Allowing workarounds dissolves the squeeze.

  **What the activity cannot reproduce and I will have to supply myself**
  The activity simulates the consequentialist constraint but cannot reproduce the theological metaphysics grounding Aquinas's view. For Aquinas, the prohibition against sedition is not merely about utility; it is about the divine order of authority and the sin of discord. The game makes sedition look like a math problem (Harm A vs. Harm B); I must supply the context that for Aquinas, sedition is a mortal sin opposed to charity.

  Additionally, the game assumes a secular calculation of "harm." Aquinas includes spiritual harm (scandal, loss of virtue) in this calculation, which the Blood Tokens do not capture. I must explain that "greater harm" includes the corruption of the community's moral fabric, not just physical death.

  Finally, the activity isolates this specific article. It does not show where this fits in the *Summa*'s broader treatment of law and obedience. I must supply the connective tissue: that this exception exists within a general presumption of obedience to law. The game makes the exception feel like the rule; I must remind them that for Aquinas, tyranny is the aberration, and the default is submission. The "squeeze" is rare but severe, not the everyday state of politics.
