      *   *Refinement:* Make sure to highlight the "Holy Alliance" vs. "Concert" distinction. The Holy Alliance is the ideological glue (Christian monarchism), which is anti-Kantian.
      *   *Refinement:* Clarify Kant's definition of "Republican." It's not democracy; it's separation of executive and legislative. Some post-Vienna states had this.

  9.  **Final Polish:** Check against the prompt's specific constraints (brainstorm first, architecture second, mapping both directions, explicit disanalogies, conclusion with flagged details). *Self-Correction during drafting:* Make sure the brainstorm is distinct and brief, not merged into the analysis. Ensure the distinction between "peace as absence of war" and "peace as a legal condition" is central.

  **(Self-Correction Note):** I need to be careful not to conflate the "Concert of Europe" (the system of consultation) with the "Holy Alliance" (the ideological pact), though they overlapped. Kant would hate the Holy Alliance most. The Concert is the diplomatic mechanism. I should focus on the Concert as the "peace mechanism."

  **(Final Check on Kant's Text):** Kant's First Definitive Article: "The Civil Constitution of Every State Shall Be Republican." Second: "The Right of Nations Shall Be Based on a Federation of Free States." Third: "Cosmopolitan Right Shall Be Limited to Conditions of Universal Hospitality."
  Preliminary Articles include: "No independently existing state... shall be acquired by another," "Standing armies shall gradually be abolished," "No state shall forcibly interfere..."
