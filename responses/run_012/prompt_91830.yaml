  2.  **Brainstorming Connections (Mental Sandbox):**
      *   *Kant:* Needs Republics (separation of powers, consent), Federation of Free States (not a world state), Hospitality/Commerce. Peace must be principled, not pragmatic.
      *   *Vienna:* Monarchies restored (anti-republican). Concert = Great Power Directorate (anti-federation of *free* states). Peace lasted ~40-100 years (depending on how you count Crimea/WWI).
      *   *Tension:* Empirical success of Vienna vs. Normative requirements of Kant.
      *   *Nuance:* Kant distinguishes between a "peace treaty" (ends one war) and "perpetual peace" (ends war *as a state of nature*). Vienna was arguably the former extended.
      *   *Nuance:* Kant's "Republicanism" isn't just democracy; it's rule of law/separation of powers. Some constitutional monarchies emerged post-Vienna.
      *   *Nuance:* The Concert relied on secrecy (Protocol of Aix-la-Chapelle, etc.), Kant demands publicity.
      *   *Nuance:* The Concert suppressed revolution (Carlsbad Decrees), violating internal right.

  3.  **Architecting Kant's Argument:**
      *   Need to be precise. It's not just "be nice."
      *   *Preliminary Articles:* Negative conditions (no secret reservations, no independent acquisition of states, standing armies abolished, etc.).
      *   *Definitive Articles:* Positive conditions.
          1.  Civil Constitution: Republican.
          2.  Right of Nations: Federation of Free States (*foedus pacificum*), not a state of nations (*civitas gentium*).
          3.  Cosmopolitan Right: Universal hospitality.
      *   *Key Distinction:* A treaty of peace (*pactum pacis*) ends a specific war. A league of peace (*foedus pacificum*) seeks to end *all* war.
      *   *Mechanism:* Why republics? Because citizens bear the cost. Why federation? To secure freedom without coercion.

  4.  **Mapping Direction 1: Vienna through Kant's Lens:**
      *   *Did they meet Preliminary Articles?* No secret reservations? Actually, yes, there were secret protocols (Poland/Saxony). Standing armies? No, they expanded.
      *   *Did they meet Definitive Article 1 (Republicanism)?* No. Legitimacy principle restored monarchs. However, some constitutional elements crept in (France's Charter).
      *   *Did they meet Definitive Article 2 (Federation)?* No. It was a hegemonic directorate (Pentarchy), not a voluntary federation of equals. It was a balance of power mechanism, which Kant explicitly rejects as a "mere idea" that doesn't guarantee peace.
      *   *Explaining Longevity:* Kant might attribute this to the "spirit of commerce" (Definitive Article 3-ish) or simply the exhaustion from Napoleon (a temporary pause). He would likely call it a "truce" rather than "Perpetual Peace."
      *   *Falsification?* It challenges the *necessity* claim. Kant says peace *requires* republics. Vienna says peace *can* happen without them. But Kant is making a normative/transcendental claim about *right*, not just a pragmatic prediction about stability.

  5.  **Mapping Direction 2: Theory through Vienna's Lens:**
      *   *Refuting Article 1?* If peace is the goal, and Vienna achieved peace without republics, isn't Kant wrong?
      *   *Counter:* What kind of peace? Internal repression (Carlsbad, Holy Alliance). Kant links external peace to internal justice. A peace built on suppressing the will of the people is unstable *in principle*, even if stable *in fact* for a while.
      *   *Exclusionary Peace:* The Concert was for Great Powers. Small states were objects, not subjects. Kant's federation is for *all* states (eventually).
      *   *War Abroad:* The 19th century wasn't peace-free (Crimea, Franco-Prussian). It was just no *general* European war. Kant aims to end war *as such*.
      *   *Publicity:* Kant's transcendental formula of public law. The Concert was deeply secretive. This violates the condition for *right*.

  6.  **Disanalogies and Silences:**
      *   *Kant's Silence:* He doesn't fully account for a hegemonic stabilizer (Pax Britannica). He assumes anarchy leads to war unless structured by right. He underestimates the stabilizing potential of a shared conservative ideology among monarchs.
      *   *Disanalogy:* Kant's "Federation" is voluntary and growing. The Concert was exclusive and static.
      *   *Disanalogy:* Kant's "Republic" is about representation. Vienna's "Monarchy" was about dynastic right.

  7.  **Conclusion & Verdict:**
      *   *Verdict:* The friend is too quick. Vienna refutes a *crude* reading of Kant (peace = absence of great war). It does not refute Kant's *normative* claim (peace = condition of right).
      *   *Insight:* Vienna shows that *stability* can be achieved through hegemony and shared elite interest (Realism), but Kant argues this isn't *Peace* (moral/legal condition). The "Democratic Peace" literature often misses Kant's emphasis on *law* and *federation* in favor of just regime type.
      *   *Flagged Detail:* The extent of constitutionalism in post-Vienna states (e.g., France, Bavaria) matters. If they were semi-republican, Kant gets partial credit. The treatment of Belgium/Poland matters for the "federation" point.

