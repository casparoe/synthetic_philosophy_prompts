prompt: |-
  I run the tradecraft review desk for a small all-source analysis team. Every product we release states a confidence level for each judgment on a five-band probability yardstick (roughly 5, 20, 50, 80 and 95 per cent); a typical assessment carries thirty to sixty separate judgments, each sourced independently and each written to be defensible on its own; and the products go to readers who commit money and personnel on the strength of them. Two problems keep recurring, and I have to issue a standing procedure covering both. First, our judgments are individually sound, yet any product of this size is known on base rates alone to contain at least one error, and readers treat the report as a package and ask what our confidence is in the report. Second, we sometimes need to say that one of a set of mutually exclusive possibilities will occur when no single member of the set rises above the bottom band, and analysts then try to convert the disjunction into an actionable claim about one member. Two of my analysts have offered mechanical fixes: take the product of the per-judgment confidences as the report's confidence, or take the minimum. The product is a reductio, since 0.95 to the fortieth is about 0.13, below our lowest band; the minimum is a reductio in the other direction. I need to know what belongs in their place.

  Please write the procedure: the questions a reviewer asks in order, what counts as a sufficient answer at each step, where the procedure stops with a no, where it hands the decision back to a person because the question is one of values rather than evidence, and what the procedure cannot do at all. It has to be runnable in an afternoon by someone with no philosophy and no statistics beyond arithmetic, and it has to tell the reviewer which parts of a judgment must go into the text so that a reader cannot mistake the whole for the sum of the parts. Then run it on three cases: a report of forty judgments all at the 95 per cent band; a warning problem in which we are confident that one of nine routes will be used but no single route exceeds the 20 per cent band; and a case in which the procedure forces us to tell a reader something we would rather not. I do not need the lottery paradox and the preface paradox explained to me; I need the translation, including what is lost in it. Take a definite position on which resolution of them the procedure should be built on, and defend that choice rather than laying the options out for me.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Tradecraft Review Desk Lead for a small all-source analysis team.
      *   **Context:** Products have 30-60 independent judgments, each with a 5-band probability yardstick (5%, 20%, 50%, 80%, 95%). Readers make high-stakes decisions based on these.
      *   **Problems:**
          1.  *Conjunction Problem:* Readers treat the report as a package. Mathematically, the probability of *all* judgments being correct drops rapidly as $N$ increases (e.g., $0.95^{40} \approx 0.13$). Analysts propose "Product" (too low) or "Minimum" (too high/ignores conjunction).
          2.  *Disjunction Problem:* Need to state *one of X, Y, Z* will happen, but no single option exceeds the lowest band (e.g., 9 routes, none > 20%). Analysts try to force a specific choice to make it actionable.
      *   **Task:** Write a standing procedure (algorithm/checklist) to address these.
          *   Must be runnable in an afternoon by non-experts (arithmetic only).
          *   Must specify questions, sufficient answers, stop conditions, value vs. evidence distinctions, and limitations.
          *   Must dictate what goes into the text to prevent reader error.
          *   Must take a definite philosophical position (resolve the paradoxes), not just list options.
          *   Must test the procedure on three cases: (1) 40 judgments @ 95%, (2) 1-of-9 routes (none > 20%), (3) A case where the procedure forces an uncomfortable truth.
      *   **Constraint:** Do not explain the Lottery or Preface Paradoxes; translate them into tradecraft. Acknowledge what is lost in translation.

  2.  **Determine the Philosophical Position:**
      *   *The Core Conflict:* The "Preface Paradox" (I believe every sentence in my book, but I believe there is at least one error) vs. "Logical Consistency" (I cannot believe $A$ and $B$ and... and $Not(A \land B \land ...)$).
      *   *The "Product" Fix:* Mathematically rigorous for independent conjunctions but useless for communication (confidence collapses).
      *   *The "Minimum" Fix:* Ignores the accumulation of risk.
      *   *The "Disjunction" Fix:* Analysts want to pick a winner when the math says "spread."
      *   *My Position:* **Pragmatic Separation of "Judgment Confidence" from "Report Reliability."**
          *   We cannot mathematically aggregate confidence across heterogeneous judgments without making assumptions about independence and weight that we don't possess.
          *   We *must* acknowledge the inevitability of error in complex products without invalidating the utility of the individual judgments.
          *   For disjunctions, we must resist the urge to false-positive a specific path. The value is in the *set*, not the *member*.
          *   *Resolution:* Adopt a **"Scoped Confidence"** approach. Confidence applies to the *logic and evidence supporting the specific claim*, not the metaphysical truth of the claim in a vacuum, and definitely not the conjunction of all claims in the report. The report is a *menu of risks*, not a single bet.
          *   *Why:* This preserves the utility of the analysis for decision-makers (who need specific inputs) while protecting the agency from claiming omniscience. It forces transparency about uncertainty.

  3.  **Drafting the Procedure (The "Tradecraft Review Protocol"):**
      *   *Goal:* Actionable, arithmetic-based, clear stop-points.
      *   *Structure:*
          1.  **Conjunction Check (The Report Level):** How to handle the "confidence in the report" question.
          2.  **Disjunction Check (The Menu Problem):** How to handle "One of these will happen."
          3.  **Textual Safeguards:** What must be written to prevent reader error.
      *   *Tone:* Directive, bureaucratic but sharp, no-nonsense.

      *   *Drafting - Section 1: Conjunction.*
          *   Rule: Do not calculate a aggregate probability for the whole report.
          *   Reason: Judgments are not independent coins. Some are foundational, some are peripheral.
          *   Action: Classify judgments as "Core" vs. "Supporting." Confidence applies to Core.
          *   Text requirement: Explicit disclaimer that "High confidence in individual judgments does not guarantee zero errors in the product."

      *   *Drafting - Section 2: Disjunction.*
          *   Rule: If $P(A) + P(B) + P(C)$ is high, but $P(A)$, $P(B)$, $P(C)$ are low, do *not* elevate one.
          *   Action: Report the Disjunction.
          *   Text requirement: "We assess that Action will occur via Route X, Y, or Z. We cannot distinguish which."

      *   *Drafting - Section 3: The Uncomfortable Truth.*
          *   Rule: If the evidence forces a low-confidence conclusion that impacts high-stakes decisions, state the low confidence. Do not hedge to make it actionable.

  4.  **Refining the Procedure (Making it "Runnable"):**
      *   Need specific questions.
      *   Need "Pass/Fail" criteria.
      *   Need to identify where human judgment overrides the algorithm (Values vs. Evidence).

      *   *Revision:* Let's create a "Review Checklist."
      *   *Step 1: The Conjunction Test.* Count judgments. If > 20, trigger the "Error Acknowledgement" clause.
      *   *Step 2: The Disjunction Test.* Sum of probabilities in a set > 80%? Individual < 50%? Trigger "Range Binding."
      *   *Step 3: The Textual Audit.* specific phrases required.

  5.  **Addressing the "What is Lost" Constraint:**
      *   I need to explicitly state that we are sacrificing logical closure for communicative utility. We are admitting we might be wrong somewhere without saying *where*. This is intellectually messy but operationally necessary.

  6.  **Developing the Three Test Cases:**
      *   *Case 1 (40 @ 95%):* Procedure should prevent claiming 95% confidence in the *report*. It should force an acknowledgement that 1-2 errors are statistically likely.
      *   *Case 2 (1-of-9 routes):* Procedure should prevent picking one. It should force the text to say "One of these 9."
      *   *Case 3 (Uncomfortable Truth):* A scenario where the procedure forces the analyst to say "We don't know" despite pressure to act.

  7.  **Final Polish:**
      *   Ensure the tone is authoritative.
      *   Check against the "no philosophy/stats beyond arithmetic" rule.
      *   Ensure the philosophical stance is clear (Pragmatic Fallibilism).

      *(Self-Correction during drafting)*: I initially thought about suggesting weighting judgments. No, that's too complex for "arithmetic only." Stick to counting and bands.
      *(Self-Correction on Disjunction)*: Make sure the procedure explicitly forbids "rounding up" a 20% chance to 50% just to make it actionable.
      *(Self-Correction on Philosophy)*: I need to explicitly state I am choosing the "Fallibilist/Pragmatic" resolution over the "Bayesian/Coherentist" one. We prioritize decision utility over logical perfection.

  8.  **Final Review against constraints:**
      *   Procedure included? Yes.
      *   Questions in order? Yes.
      *   Sufficient answers defined? Yes.
      *   Stop conditions? Yes.
      *   Values vs. Evidence? Yes.
      *   Limitations? Yes.
      *   Three cases run? Yes.
      *   Definite position taken? Yes.
      *   What is lost acknowledged? Yes.

      *Let's write it.*
answer: |-
  # STANDING PROCEDURE 7.4: CONFIDENCE AGGREGATION AND DISJUNCTIVE CLAIMS

  **EFFECTIVE:** Immediately
  **AUTHORITY:** Tradecraft Review Desk
  **APPLICABILITY:** All All-Source Products carrying >10 distinct judgments

  ## 1. PHILOSOPHICAL STANCE AND INTENT
  This procedure adopts a **Pragmatic Fallibilist** position. We reject the demand for logical closure (that a report must be 100% consistent and error-free to be valid) in favor of decision utility. We acknowledge that a report containing many high-confidence judgments will statistically contain errors, but this does not invalidate the utility of the individual judgments. We also reject the pressure to convert uncertain disjunctions ("one of these") into false certainties ("this one").

  **What is lost in this translation:** We sacrifice logical perfection. We are admitting that we believe $A$, believe $B$, and believe $C$, while simultaneously admitting that $A \land B \land C$ is likely false. This is logically inconsistent but operationally honest. We prioritize the reader's ability to manage risk over the analyst's desire to appear omniscient.

  ## 2. THE REVIEW CHECKLIST
  The Reviewer must execute the following steps in order. If a step fails, the product cannot be released until corrected.

  ### STEP 1: THE CONJUNCTION AUDIT (The "Package" Problem)
  **Question 1.1:** Count the total number of distinct probability judgments in the draft.
  *   **Arithmetic:** Sum the judgments.
  *   **Sufficient Answer:** An integer $N$.
  *   **Stop Condition:** If $N < 10$, proceed to Step 2.
  *   **Trigger:** If $N \ge 10$, proceed to Question 1.2.

  **Question 1.2:** Calculate the "Expected Error Count."
  *   **Arithmetic:**
      1.  Count judgments in the 95% band ($N_{95}$). Multiply by 0.05.
      2.  Count judgments in the 80% band ($N_{80}$). Multiply by 0.20.
      3.  Count judgments in the 50% band ($N_{50}$). Multiply by 0.50.
      4.  Sum these three results.
  *   **Sufficient Answer:** A number representing the statistical expectation of errors (e.g., 2.4).
  *   **Stop Condition:** If the result is $< 1.0$, proceed to Step 2.
  *   **Trigger:** If the result is $\ge 1.0$, the text **must** be modified per Instruction 1.3.

  **Instruction 1.3 (Mandatory Text):**
  If triggered, the Executive Summary must contain the following sentence, verbatim:
  *"This assessment contains [N] distinct judgments. While individual judgments carry high confidence, statistical base rates suggest this product likely contains at least one error. Readers should treat judgments as independent risk factors, not as a single guaranteed package."*

  **Reviewer Decision Point (Values vs. Evidence):**
  If the analyst argues that the judgments are "interdependent" (i.e., if one is wrong, they are all wrong) to avoid this warning, the Reviewer must decide: Is the dependency evidentiary or structural?
  *   **Evidence:** "Source A provided all data." (Valid exception, waive Instruction 1.3).
  *   **Value:** "We don't want to scare the reader." (Invalid exception, enforce Instruction 1.3).

  ### STEP 2: THE DISJUNCTION AUDIT (The "Menu" Problem)
  **Question 2.1:** Identify any set of mutually exclusive outcomes presented as a collective threat/opportunity (e.g., "Routes A, B, or C").
  *   **Sufficient Answer:** A defined set of options $\{O_1, O_2, ... O_n\}$.
  *   **Stop Condition:** No such sets exist. Proceed to Step 3.

  **Question 2.2:** Check the confidence band of the *highest* ranked option.
  *   **Arithmetic:** Identify the option with the highest probability. Note its band (5, 20, 50, 80, 95).
  *   **Trigger:** If the highest option is in the 5% or 20% band, proceed to Question 2.3.
  *   **Stop Condition:** If the highest option is $\ge 50%$, proceed to Step 3.

  **Question 2.3:** Check the collective confidence of the set.
  *   **Arithmetic:** Sum the probabilities of all options in the set.
  *   **Sufficient Answer:** A percentage total.
  *   **Trigger:** If the Sum $\ge 80%$ (High confidence in the *set*) BUT the Individual Max $\le 20%$ (Low confidence in the *member*), Instruction 2.4 is triggered.

  **Instruction 2.4 (Mandatory Text):**
  The analyst is **forbidden** from elevating the confidence of the single highest option to make it actionable. The text must state:
  *"We assess with high confidence that the event will occur via one of the following routes: [List]. We cannot distinguish which route will be chosen. Planning must cover all listed routes."*

  **Reviewer Decision Point (Values vs. Evidence):**
  If the analyst argues "The reader needs a single answer to allocate resources," the Reviewer must rule:
  *   **Evidence:** "New intel rules out Route B and C." (Valid, remove B and C from set, recalculate).
  *   **Value:** "It is too hard to defend three routes." (Invalid, enforce Instruction 2.4).

  ### STEP 3: THE UNCOMFORTABLE TRUTH CHECK
  **Question 3.1:** Scan for judgments where the stakes (money/personnel) are high, but the confidence band is low (5% or 20%).
  *   **Sufficient Answer:** List of High-Stakes/Low-Confidence judgments.
  *   **Trigger:** Any such judgment exists.

  **Instruction 3.1 (Mandatory Text):**
  For each identified judgment, the text must explicitly state the *consequence of being wrong*.
  *   **Format:** "If this judgment is incorrect, the impact will be [Description]. Mitigation requires [Action]."
  *   **Prohibition:** Do not use hedging language (e.g., "might," "could") to mask the low confidence. Use the band label (e.g., "Low Confidence").

  ## 3. LIMITATIONS OF THIS PROCEDURE
  1.  **It cannot calculate "Report Confidence."** There is no single number that represents the truth of the whole document. Any request for one must be rejected.
  2.  **It cannot resolve dependency.** If Judgment A relies on Judgment B, the arithmetic in Step 1 is invalid. The Reviewer must identify this qualitatively; the math assumes independence.
  3.  **It cannot force action.** This procedure ensures the *warning* is clear. It cannot force the reader to act prudently.

  ***

  # APPLICATION OF PROCEDURE 7.4

  ## CASE 1: The High-Volume Report
  **Scenario:** A product containing 40 judgments. All are assessed at the 95% band.
  **Analyst Preference:** State "High Confidence" in the report overall. Use the "Minimum" fix (Report confidence = 95%).

  **Execution:**
  1.  **Step 1.1:** $N = 40$. Trigger ($N \ge 10$).
  2.  **Step 1.2:** Expected Error Count = $40 \times 0.05 = 2.0$.
  3.  **Result:** Trigger ($2.0 \ge 1.0$).
  4.  **Action:** Instruction 1.3 applies. The Executive Summary must state: *"This assessment contains 40 distinct judgments. While individual judgments carry high confidence, statistical base rates suggest this product likely contains at least one error..."*
  5.  **Outcome:** The analyst cannot claim 95% confidence in the *report*. They must admit that 1-2 errors are statistically probable.
  6.  **What is preserved:** The utility of the 40 judgments (each is still 95% likely to be true).
  7.  **What is lost:** The illusion of perfection. The reader cannot treat the report as a single binary bet.

  ## CASE 2: The Warning Problem (Disjunction)
  **Scenario:** Intelligence indicates an attack is imminent. There are 9 possible routes. Evidence suggests one will be used. Probability is distributed roughly evenly; no single route exceeds the 20% band. Sum of probabilities $\approx 90%$.
  **Analyst Preference:** Pick the "most likely" route (20%) and write the judgment as "Moderate Confidence" (50%) so the field team can deploy resources to one location.

  **Execution:**
  1.  **Step 2.1:** Set identified (9 routes).
  2.  **Step 2.2:** Max individual band = 20%. Trigger ($\le 20%$).
  3.  **Step 2.3:** Sum of set = 90%. Trigger (Sum $\ge 80%$ AND Max $\le 20%$).
  4.  **Action:** Instruction 2.4 applies. Analyst is forbidden from elevating the single route.
  5.  **Mandatory Text:** *"We assess with high confidence that the event will occur via one of the following routes: [1-9]. We cannot distinguish which route will be chosen. Planning must cover all listed routes."*
  6.  **Outcome:** The field team receives a harder task (defend 9 routes) but an honest one.
  7.  **What is preserved:** Integrity of the probability assessment.
  8.  **What is lost:** Actionable specificity. The reader may complain they cannot resource 9 routes. This is a resource problem, not an intelligence problem. The procedure forces the intelligence gap to remain visible rather than hiding it with a lie.

  ## CASE 3: The Uncomfortable Truth
  **Scenario:** A judgment states "Enemy Capability X is operational." Confidence is 20% (Low). However, if true, it renders the client's current investment obsolete (High Stakes).
  **Analyst Preference:** Phrase the judgment as "Enemy Capability X is *possible*" and omit the confidence band to avoid drawing attention to the uncertainty, hoping the reader investigates.

  **Execution:**
  1.  **Step 3.1:** High Stakes (investment obsolete) + Low Confidence (20%). Trigger.
  2.  **Action:** Instruction 3.1 applies.
  3.  **Mandatory Text:** *"Low Confidence: Enemy Capability X is operational. If this judgment is incorrect, the impact will be minimal (status quo). If this judgment is correct, the impact will be total obsolescence of current investment. Mitigation requires immediate verification testing."*
  4.  **Outcome:** The analyst cannot hide the uncertainty. The reader is forced to see that they are betting on a 20% chance with 100% downside.
  5.  **What is preserved:** The ability of the reader to make a risk-weighted decision.
  6.  **What is lost:** The analyst's ability to "nudge" the reader toward caution without owning the recommendation. The procedure forces the analyst to expose the gamble.

  ***

  # REVIEWER NOTES ON PHILOSOPHY AND TRADEOFFS

  **Why Pragmatic Fallibilism?**
  We could have chosen the "Coherentist" approach (do not publish until all judgments are logically consistent and the product confidence is high). This would result in almost no reports being published, as complex reality rarely yields high-conjunction probability. We could have chosen the "Subjective" approach (confidence is just a feeling, ignore the math). This leads to overconfidence and catastrophic failure.

  Pragmatic Fallibilism accepts that we are working in a world of incomplete information. We treat our judgments as **bets** rather than **truths**.
  *   In Case 1, we admit we are placing 40 bets, not 1 bet.
  *   In Case 2, we admit we know the *race* will happen, but not who will win.
  *   In Case 3, we admit we are offering a long-odds hedge, not a sure thing.

  **The Cost:**
  This procedure will make our products look more uncertain than our competitors who use the "Minimum" or "Round Up" methods. Readers accustomed to definitive answers will initially find this frustrating. They will ask, "So what should I do?"
  The procedure's answer is: "We tell you the odds; you decide the bet."
  This shifts liability for the decision to the reader, which is the only defensible position for an analysis team that does not control the assets.

  **Final Directive:**
  If an analyst resists these textual insertions on the grounds that they "undermine credibility," remind them that credibility is lost when we are wrong, not when we admit we could be. Run the checklist. If it triggers, the text changes. No exceptions.
