answer: |-
  Good evening, everyone. For those who don't know me, I'm the reason the seating plan looks like a peace treaty negotiation. On my left, the experimentalists, the CMB hunters, and my brother-in-law who saves lives with medical imaging. On my right, my students and the string theory group. I know what the left side thinks. You've suspected since about 1998 that I stopped doing physics and started doing theology with extra steps. You've been polite about it, but I see the eyes glaze over when I mention "eternal inflation."

  And I know what the right side hopes. You want me to stand up and say that the landscape is real, that the multiverse is waiting for us, and that your careers are built on solid ground.

  After forty-one years, I owe both sides the truth. And the truth is stranger than either of those options.

  I've spent the last year reading philosophy—mostly in the evenings, when the equations stopped making sense and started looking like poetry. It changed how I see my own career. Specifically, it changed how I think about being wrong. In my field, there are three ways a theory can be "unprovable."

  The first way is trash. Your theory forbids nothing. Anything that happens is consistent with the theory. If you predict everything, you predict nothing. We aren't doing that. I hope.

  The second way is frustrating. Your theory forbids plenty, but none of it is something we can currently go and check. Maybe we will check it in a thousand years. Maybe never. This is where many of you thought I was living. You thought I was saying, "The other universes are there, you just can't see them yet."

  But here is the honest admission, the one I need to make before the philosopher at table 3 stops taking notes and starts objecting. We aren't really in the second category. We are in a third category.

  Our theories *do* forbid things. But only once we add a rulebook for how to count possibilities. We call it a "measure." Nature does not hand us this rulebook. We have to pick it. We have to decide whether to count universes by volume, by number of observers, or by some other weight. And depending on which rulebook we pick by hand, the predictions change.

  So, to my experimentalist friends: You are right to be skeptical. We do make predictions, but they aren't predictions until we've made a choice that nothing in nature forces on us. That is a strange place for a scientist to live. It acknowledges that the human element—our choice of how to count—is part of the physics.

  To my students: This does not mean the work was worthless. Knowing exactly *where* the uncertainty enters the calculation is progress. It is better to know you are choosing a rulebook than to pretend you found one written in the stars.

  Now, I should mention the elephant in the multiverse. If the universe is big enough and old enough, random fluctuations should produce conscious beings more often than evolution does. This means that statistically, I am probably not a retired physicist giving a speech. I am a "Boltzmann Brain," a momentary hallucination popping into existence with false memories of a career. If that's true, none of this is real, and the wine is definitely an illusion. I choose to believe I'm not a hallucination, mostly because the catering bill looks very concrete. But I acknowledge the logic haunts us.

  I also want to avoid one last trap. I am not going to argue that we must be right because we can't think of a better theory. That is a fact about us, not about the world. Just because we are stuck doesn't mean the landscape is real. It might just mean we are tired.

  So, where does that leave us? It leaves us in a humble place. We are mapping the limits of what can be said, not just the limits of what can be seen.

  To my family, especially my wife: Thank you for listening to me worry about whether I exist for four decades. To my brother-in-law: Thank you for keeping me grounded in the observable universe. And to my students: Go forth. Ask hard questions. And when you find a rulebook you have to pick by hand, admit it. Don't hide it.

  Science isn't just about being right. It's about being honest about how you might be wrong.

  Please raise your glasses. To the observable, the unobservable, and the honest space in between. Cheers.

