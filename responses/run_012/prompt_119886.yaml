answer: |-
  This is a strong philosophical intuition, but you are walking into a minefield of existing literature. Your core instinct—that the "cancellation" step presupposes the very ontology it claims to justify—is correct and under-discussed in introductory treatments. However, to write a successful paper, you need to navigate the technical distinctions and the existing canon carefully.

  Here are blunt answers to your four questions, followed by strategic advice.

  ### 1. Does the Independence / Sure-Thing distinction hold up?
  **Yes, but your terminology is slightly off.**
  In von Neumann-Morgenstern (vNM) theory (objective probabilities, which Allais used), the axiom is **Independence**. In Savage (subjective probabilities), it is the **Sure-Thing Principle**. You are discussing Allais, so you are technically attacking Independence.

  However, your philosophical point stands: Rejecting branch-wise decomposition is not *just* violating the axiom; it is rejecting the **Consequentialism** and **Reduction of Compound Lotteries** assumptions that make the axiom plausible.
  *   **EUT Ontology:** A lottery is *nothing over and above* the probability-weighted sum of its outcomes. Therefore, common branches *must* cancel because they add identical value to both sides.
  *   **Allais Ontology:** A lottery is a structured object with global properties (e.g., "security," "variance," "disappointment potential"). The 0.89 branch interacts with the other branches.

  **Verdict:** You are not just relabeling. You are identifying the *metaphysical precondition* of the axiom. If you frame this as "Independence presupposes a specific ontology of risk that is not rationally compulsory," you have a solid argument. If you frame it as "Independence is wrong," you're just doing standard non-EU theory.

  ### 2. Does the certainty do any work?
  **No, and this strengthens your argument.**
  You noted the **Common Ratio Effect** (scaling down probabilities removes the "sure thing" but keeps the violation). This is crucial.
  *   If the violation depended entirely on the "Certainty Effect" (psychological overweighting of $p=1$), scaling would eliminate it.
  *   Since scaling *doesn't* eliminate it, the violation is about how probabilities interact *globally*, not just about the endpoint of certainty.

  This supports your "holistic distribution" claim. It suggests people care about the *shape* of the probability distribution (e.g., skewness, cumulative weight), not just the isolated branches. This aligns with **Rank-Dependent Utility (Quiggin)** or **Prospect Theory**, where decision weights are applied to cumulative probabilities, not individual branches.
  **Advice:** Use the Common Ratio effect to show that the problem isn't "irrational love of certainty," but "rational attention to distributional structure."

  ### 3. Am I re-deriving something standard?
  **Yes. Bluntly: You are echoing Lara Buchak, Kahneman & Tversky, and Machina.**
  *   **Lara Buchak (*Risk and Rationality*, 2013):** This is the most important citation for you. She argues exactly what you are arguing: that it is rational to care about the global properties of a gamble (risk-weighted expected utility). She explicitly defends the Allais preferences as rational because the agent cares about the *structure* of the risk, not just the outcomes.
  *   **Kahneman & Tversky (1979):** Prospect Theory identifies the **Isolation Effect**. They argue people discard common components (cancellation) inconsistently. They agree with you that cancellation is a psychological process, not a logical necessity.
  *   **Mark Machina (1982):** Showed that you can have smooth preferences that violate Independence if you drop the assumption that utility is linear in probabilities.

  **How to save the paper:** Do not claim novelty on the *diagnosis*. Claim novelty on the *normative rehabilitation*.
  *   *Standard view:* Allais preferences are a bias/error to be corrected (Savage's "sure thing" argument).
  *   *Your view:* Allais preferences reveal that the EUT ontology is substantively restrictive, not neutrally formal. The "error" is only an error if you accept EUT's definition of a lottery *a priori*.
  *   *Pitch:* "I am not discovering that Independence is violable; I am arguing that the standard justification for Independence (the cancellation argument) is question-begging because it assumes consequentialism."

  ### 4. Cases where Holistic vs. Branch-wise come apart?
  You need cases where the *structure* matters independently of the outcomes.
  1.  **The Ellsberg Paradox:** People prefer known probabilities over unknown probabilities, even if the branch-wise expected value is identical. This violates Independence (or Sure-Thing) because the *source* of the uncertainty (the ambiguity) is a global property of the act, not a branch-wise consequence.
  2.  **Diamond's Fairness Example (1967):**
      *   Option A: Give a kidney to Patient 1 (Sure).
      *   Option B: Flip a coin. Heads: Patient 1 gets it. Tails: Patient 2 gets it.
      *   Consequentialist/EUT view: If Patient 1 and 2 have equal need, the expected utility is the same (0.5 life + 0.5 life = 1 life).
      *   Holistic view: Many prefer B because the *process* is fairer ex-ante. The "fairness" is a property of the lottery structure, not the final outcome.
  3.  **Regret Theory (Loomes & Sugden):** Your preference between A and B depends on what you would have felt if you chose C. The value of a branch depends on the foregone alternatives. This explicitly rejects branch-wise independence.

  ### Strategic Recommendations

  1.  **Fix the Terminology:** Distinguish between **vNM Independence** (objective) and **Savage's Sure-Thing Principle** (subjective). Allais is vNM. The "cancellation" argument is the mathematical expression of Independence. The philosophical underpinning is **Consequentialism** (only outcomes matter) and **Reduction** (compound lotteries reduce to simple ones). Attack *those*.
  2.  **Engage Buchak:** You cannot write this paper without citing Lara Buchak. If you haven't read *Risk and Rationality*, read it now. Your argument is essentially a summary of her Chapter 3, but you can differentiate by focusing specifically on the *cancellation step* as the point of contention.
  3.  **Reframe the "Mistake":** Don't say economists are "mistaken" about the math. Say they are "silent" on the metaphysics. The math of Independence is fine; the *interpretation* of it as a requirement of rationality (rather than a specific attitude toward risk) is what you are challenging.
  4.  **The "Teeth":** Your strongest point is the Savage quote (or similar) where he tells people to "revise their preferences." Use that. It shows that the EUT defense is often a coercive normalization ("think like us to be rational") rather than a logical proof.

  **Summary:** The argument is interesting and philosophically sound, but it is not new to the non-EU literature. Your contribution must be to clarify *why* the cancellation step is philosophically loaded, rather than just noting that people violate it. Focus on the **ontology of the gamble**.
