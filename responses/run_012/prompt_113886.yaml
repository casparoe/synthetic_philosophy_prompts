  4. **Chemical Suppression Check:** Check the medication chart immediately. Has there been a recent increase in sedatives, antipsychotics, or benzodiazepines? If the resident is drowsy, unresponsive, or unusually still, behavioral cues are invalid. You cannot use silence as evidence of comfort. Proceed to Step 6. This acknowledges the failure of Behaviorism when behavior is chemically severed from feeling. Silence is not evidence of absence here.
  5. **The Constitutive Action:** If triggers are physical (Step 2) and comfort measures failed (Step 3), treat the behavior as pain itself. Do not look for further proof or wait for consistency. The grimace is the pain. Request analgesia from the nurse. Note: You must do this even if the resident settles quickly afterward, as anticipation of pain is still pain. This follows the Wittgensteinian view that the expression is part of the phenomenon, not just evidence of it. You are not inferring a ghost in the machine; you are responding to the public event.
  6. **The Risk Hand-off:** If chemical suppression is active (Step 4) and a painful pathology exists (e.g., fracture, ulcer), you cannot solve this alone. The question is no longer "Are they in pain?" but "Is the risk of withholding meds too high?" Document the lack of behavioral cues due to medication clearly in the notes. Hand off to the nurse in charge verbally. Say: "I cannot assess pain due to sedation, but pathology suggests risk. Please review analgesia schedule." This shifts the burden from epistemology to ethics. You are admitting you cannot know, but refusing to gamble on their suffering.
  7. **Relational Distress Rule:** If distress correlates exclusively with a specific staff member's presence, not their touch, this is relational distress. Do not request analgesia. Request a change in care assignment. Medication cannot fix fear of a person. Administering analgesia here is category error.
  8. **Final Action Mandate:** If Step 5 is satisfied, you are obligated to request relief. Hesitation based on uncertainty is invalid here. The behavior warrants the response. Your discomfort with uncertainty is not a valid stop rule.

  Three worked cases
  **Case 1:** Mrs. G grimaces and cries out when turned but sits cheerfully chatting afterwards. Step 1 confirms a change from baseline during care. Step 2 identifies physical manipulation as the trigger. Step 3 fails; repositioning gently does not stop the cry. Step 5 applies. The procedure forces you to request analgesia before the next turn, even though she is cheerful otherwise. You might hesitate, fearing overmedication, but the constitutive rule says the grimace during movement is pain regardless of later mood. You act.

  **Case 2:** Mr. K moans continuously when Carer A enters but stops when she leaves. Step 1 shows a change in state. Step 2 identifies the trigger as a person, not touch. Step 7 applies immediately. This is relational distress, not nociceptive pain. The procedure stops you from requesting medication. You must instead speak to the nurse about changing the care roster. Medicating Mr. K would be a category error, treating a psychological fear with a physiological solution.

  **Case 3:** Mrs. L is drowsy and still following a medication review, though she has a known heel ulcer. Step 1 shows a change (stillness). Step 4 confirms chemical suppression. Behavior is invalid. Step 6 applies. You cannot infer comfort from silence. You must hand off to the nurse, stating pathology suggests risk despite suppressed cues. This is the unwanted action: you are forced to advocate for analgesia review without behavioral evidence, relying solely on risk assessment. It feels like guessing, but the procedure mandates risking overmedication over untreated pain.

  Where this misfires
  The procedure fails when behavior is completely decoupled from feeling, such as in rare neurological conditions where reflex grimacing occurs without sensation. Here, Step 5 leads to unnecessary medication. The answer I won't like is in Case 3: medicating based on risk rather than evidence feels like abandoning the empirical ground the philosophy promised. It forces me to act on a hypothesis I cannot verify. The conceptual questions are "Is this pain?" (Step 5) and "Is this risk?" (Step 6). The evidential questions are "Did they grimace?" and "Are they sedated?" When evidence is removed by sedation, the procedure shifts to ethics, which feels like a failure of the mind-reading project. It exposes that care is often managing uncertainty, not solving it.

  What it cannot do
  It cannot access the qualitative feel of the resident's experience or guarantee the correctness of any single decision. It cannot replace clinical judgment regarding drug interactions or contraindications. It cannot resolve situations where the risk of sedation equals the risk of untreated pain.
