answer: |-
  # Joint Statement on the Scope and Force of the Gibbard–Satterthwaite Theorem

  **Date:** October 24, 2023
  **Parties:** Camp A (Impossibility Hawks) and Camp B (Escape Artists)
  **Subject:** Adversarial Collaboration on Strategic Manipulation in Voting Rules

  After twelve months of debate, we submit this joint statement to clarify where our disagreement lies and where it does not. We agree that the Gibbard–Satterthwaite (G-S) theorem is mathematically sound within its axioms. Our conflict concerns the normative weight of those axioms and whether escaping them yields institutions that are robust enough for political use. To facilitate this, we adopt the following taxonomy established during our collaboration:

  *   **Strategy-Proofness Levels:**
      *   **L1:** Deterministic strategy-proofness. No single voter can gain by misreporting given fixed ballots from others.
      *   **L2:** Randomized strategy-proofness. The rule is randomized; no single voter can gain in *expected utility* by misreporting, even if they change the probability distribution over outcomes.
      *   **L3:** Restricted-domain strategy-proofness. No single voter can gain on a domain including a status quo/default outcome, where preferences are single-peaked-ish but允许 a secondary dimension (e.g., intensity or orthogonality).
  *   **Manipulation Types:**
      *   **Individual:** Unilateral misreporting by one voter.
      *   **Coalition:** Coordinated misreporting by a group.
      *   **Uncertainty:** Misreporting by a voter who lacks complete information about others' ballots.

  ### 1. Agreed Claims

  1.  **Validity of G-S:** We agree that for any deterministic voting rule with at least three possible outcomes, if the domain of preferences is unrestricted and the rule is unanimous, the rule is not L1 strategy-proof. There exists at least one preference profile where an individual voter can gain by misreporting.
  2.  **Scope of Assumptions:** We agree that G-S assumes ordinal ballots, complete information (no uncertainty), and deterministic outcomes. It does not formally address L2 (randomization) or L3 (restricted domains with status quo anchors).
  3.  **Existence of Escapes:** We agree that rules exist which satisfy L2 (e.g., random dictatorship) or L3 (e.g., status-quo anchored median voting) under specific conditions. Camp A does not deny the mathematics of these escapes; Camp B does not deny that these escapes violate unrestricted domain or determinism.
  4.  **Coalition Vulnerability:** We agree that most L2 and L3 escapes remain vulnerable to coalition manipulation even when they are immune to individual manipulation. A rule that is L2 strategy-proof for individuals may still allow a coalition to shift expected utility in their favor.
  5.  **Uncertainty Factor:** We agree that introducing uncertainty (where voters do not know others' ballots) changes the calculation of manipulation. A rule might be manipulable in theory (G-S) but not in practice if the computational burden or information requirement is too high. We disagree on whether institutions should rely on this friction.
  6.  **Counterexample Criteria:** We agree on what would falsify our respective core positions.
      *   **For Camp A:** If Camp B produces a deterministic, unanimous rule with 3+ outcomes on an unrestricted domain that is L1 strategy-proof, Camp A concedes. (We agree this is mathematically impossible).
      *   **For Camp B:** If Camp A demonstrates that all L2 and L3 escapes fail to produce better social welfare than random chance in realistic simulations involving coalition formation, Camp B concedes that the escapes are normatively useless.
  7.  **Normative Stakes:** We agree that the core dispute is not mathematical but normative: whether the cost of restricting domains (L3) or accepting randomness (L2) is higher than the cost of admitting manipulability (L1 failure).

  ### 2. Disagreements Table

  | Issue | Camp A Position (Impossibility Hawks) | Camp B Position (Escape Artists) |
  | :--- | :--- | :--- |
  | **Normative Weight of L1** | We maintain that L1 is the only baseline that matters for legitimacy. If a rule is not L1 strategy-proof, it incentivizes lying, which corrupts the epistemic function of voting regardless of whether voters are sophisticated enough to exploit it. | We maintain that L1 is too strict for real institutions. If a rule is L2 or L3 strategy-proof, it prevents *profitable* manipulation for typical voters under realistic cognitive loads, which is the only sense of "strategy-proof" that matters for stability. |
  | **Domain Restrictions (L3)** | We maintain that restricting preferences to single-peaked-ish domains with a status quo is normatively suspect because it disenfranchises voters with multi-dimensional preferences, effectively smuggling in dictatorship by defining out legitimate dissent. | We maintain that most political choices *are* anchored by a status quo and exhibit single-peaked-ish structure. Designing rules for L3 domains reflects reality rather than restricting it; ignoring this structure forces artificial choices that voters do not actually hold. |
  | **Randomization (L2)** | We maintain that L2 rules (randomization) fail because political accountability requires deterministic outcomes. A voter cannot hold a representative accountable for a lottery result, and coalitions can easily game expected utility distributions. | We maintain that L2 rules are superior when consensus is impossible. Preventing individual expected-utility gains reduces the incentive to polarize. Coalition manipulation of lotteries is harder to coordinate than manipulation of deterministic thresholds. |
  | **Reliance on Uncertainty** | We maintain that institutions should not rely on voter ignorance or uncertainty to prevent manipulation. A robust rule must be strategy-proof under complete information; relying on friction is a design flaw. | We maintain that complete information is a fantasy in large electorates. A rule that is manipulable only under complete information but stable under uncertainty is functionally strategy-proof for all practical institutional purposes. |

  ### 3. The Cruxes

  To move this debate forward, we identify three concrete cruxes. For each, we specify a case, rule, or profile and pre-register our predictions.

  **Crux 1: The Randomized Dictatorship Test (L2 vs. Coalition)**
  *   **Case:** A committee of 5 voters choosing between 3 candidates (X, Y, Z). The rule is Randomized Dictatorship (L2 strategy-proof for individuals).
  *   **Profile:** Voters 1 & 2 prefer X > Y > Z. Voters 3 & 4 prefer Y > Z > X. Voter 5 prefers Z > X > Y.
  *   **Test:** Can a coalition (Voters 1 & 2) misreport to shift the probability distribution enough to gain in expected utility, even if individuals cannot?
  *   **Camp A Prediction:** The coalition will successfully manipulate the distribution. They will report extreme preferences to weight the lottery, proving L2 is fragile against coordinated action.
  *   **Camp B Prediction:** The coalition cannot gain significantly without risking a worse outcome (e.g., Z winning). The linearity of expected utility in this rule makes coalition gains negligible compared to the risk, preserving stability.

  **Crux 2: The Status Quo Anchor Test (L3 Domain)**
  *   **Case:** A budget allocation choice with a status quo default ($S$). Preferences are single-peaked on a budget line but allow a secondary dimension (e.g., allocation method).
  *   **Rule:** Status-quo anchored median voting (L3 strategy-proof).
  *   **Profile:** 51% of voters prefer a change away from $S$, but their secondary dimensions conflict (e.g., they agree on amount but not method), creating a cycle if $S$ is removed.
  *   **Test:** Does the inclusion of $S$ prevent manipulation, or does it simply hide the cycle?
  *   **Camp A Prediction:** The rule will fail L3 when the secondary dimension becomes salient. Voters will misreport their peak to shift the median, exploiting the tension between the budget line and the method. The "single-peaked-ish" assumption will break.
  *   **Camp B Prediction:** The status quo $S$ acts as a focal point that collapses the secondary dimension. Voters will not misreport because the risk of reverting to $S$ outweighs the gain from shifting the median. The domain restriction holds.

  **Crux 3: The Uncertainty Threshold Test**
  *   **Case:** A large-scale election (N=10,000) using a rule known to be manipulable under complete information (L1 failure).
  *   **Condition:** Voters have varying levels of information about others' ballots (Uncertainty manipulation).
  *   **Test:** At what information threshold does manipulation become profitable for a rational voter?
  *   **Camp A Prediction:** Manipulation becomes profitable even with high uncertainty (e.g., knowing only aggregate polls). Rational voters will always have an incentive to misreport, destabilizing the equilibrium.
  *   **Camp B Prediction:** Manipulation requires near-complete information to be profitable. Below 90% certainty about the margin of victory, the expected gain from misreporting is zero. The rule is functionally strategy-proof.

  ### 4. Verbal Disputes

  We acknowledge that a portion of our conflict is verbal rather than substantive. Specifically, we use the phrase **"strategy-proof in the senses that actually matter"** differently.

  *   **Camp A** uses this phrase to mean "immune to all strategic gaming, including coalitions and sophisticated actors, regardless of information costs." For Camp A, if a vulnerability exists in the math, it matters because institutions should aim for ideal integrity.
  *   **Camp B** uses this phrase to mean "immune to unilateral gaming by typical voters under realistic cognitive and information constraints." For Camp B, if a vulnerability exists only in theory or requires impossible coordination, it does not matter for institutional design.

  We agree to stop using this phrase without qualification. Future discussions will specify whether we are discussing *theoretical immunity* (Camp A's standard) or *practical stability* (Camp B's standard). We further agree that the G-S theorem proves theoretical immunity is impossible for deterministic, unrestricted rules. The remaining dispute is whether practical stability is sufficient for legitimacy.

  ### 5. Commitment to Further Inquiry

  We commit to simulating the three cruxes above within six months. If Crux 1 shows high coalition vulnerability in L2 rules, Camp B will revise their endorsement of randomization. If Crux 3 shows that uncertainty prevents manipulation in large N, Camp A will acknowledge that G-S overstates the risk in mass elections. Until then, we acknowledge that both L1 impossibility and L2/L3 escapes are valid considerations for institutional design, provided their limitations are explicitly disclosed.

  **Signed,**
  **Camp A (Impossibility Hawks)**
  **Camp B (Escape Artists)**
