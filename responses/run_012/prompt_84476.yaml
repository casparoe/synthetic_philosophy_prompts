  ### Facilitator's Cheat Sheet (Print this for your pocket)

  *   **R1 (Assurance):** Threshold 15. Commit=10/0. Reserve=5. *Key: Uncertainty.*
  *   **R2 (PD):** Threshold 15. Commit=8/2. Reserve=12/6. *Key: Dominant Strategy.*
  *   **R3 (Anti-Commons):** Unanimity (20). Commit=10/0. Reserve=4. *Key: Veto Power.*
  *   **R4 (Repeated):** Same as R2. 3 Sub-rounds. *Key: Reputation.*
  *   **Counting:** Ask "Who Committed?" Count hands visibly. Write number on board.
  *   **Timing:** Keep decision time short (2 mins). Dragging kills the tension.
  *   **Tone:** Clinical. You are the Market, not the Moralist.
