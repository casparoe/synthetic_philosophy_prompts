answer: |-
  # Activity Design: "The Consortium"

  ## 1. Materials and Setup
  *   **Room:** One large table or arranged seating where all 20 students can see you.
  *   **Handouts:** One "Score Sheet" per student (20 total).
      *   Columns: Round 1, Round 2, Round 3, Round 4a, 4b, 4c, Total.
      *   Rows: Choice (Commit/Reserve), Group Count, Personal Score.
  *   **Facilitator Tools:** Whiteboard/Projector (to display the "Market Rules" for each round), a timer, a marker to tally hands.
  *   **Writing Implements:** Pens/pencils for all.

  ## 2. Payoff Scheme and Rationale
  *Note: Do not share this rationale with students until the debrief. During play, only the "Market Rules" (the numbers) are visible.*

  Let $N = 20$ (Total Players).
  Let $C$ = Count of players choosing **Commit**.
  Let $P_i$ = Payoff for Player $i$.

  | Round | Structural Type | Choice | Payoff Condition | Payoff Value | Load-Bearing Inequality | Arbitrary Value |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Assurance** | Commit | If $C \ge 15$ | 10 | $10 > 5$ (if successful) | Threshold (15) |
  | | | Commit | If $C < 15$ | 0 | $5 > 0$ (if failed) | |
  | | | Reserve | Always | 5 | | |
  | **2** | **Prisoner's Dilemma** | Commit | If $C \ge 15$ | 8 | $12 > 8$ (Temptation) | Threshold (15) |
  | | | Commit | If $C < 15$ | 2 | $6 > 2$ (Sucker) | |
  | | | Reserve | If $C \ge 15$ | 12 | $8 > 2$ (Reward > Punish) | |
  | | | Reserve | If $C < 15$ | 6 | | |
  | **3** | **Anti-Commons** | Commit | If $C = 20$ | 10 | $10 > 4$ (Collective Optimum) | Unanimity Rule |
  | | | Commit | If $C < 20$ | 0 | $4 > 0$ (Veto Power) | |
  | | | Reserve | Always | 4 | | |
  | **4** | **Repeated PD** | *Same as Round 2* | *Played 3 times* | *Cumulative* | Shadow of Future | |

  **Why these numbers?**
  *   **Round 1:** The inequality $10 > 5$ makes cooperation rational *if* success is certain. The inequality $5 > 0$ makes reservation rational if success is uncertain. The trap is epistemic (uncertainty), not incentive-based.
  *   **Round 2:** The inequality $12 > 8$ and $6 > 2$ ensures "Reserve" is a **dominant strategy** (always better by 4 points). The inequality $(20 \times 8) > (20 \times 12)$ is *false*; $(20 \times 8) = 160$ vs $(20 \times 12) = 240$? **Wait.**
      *   *Correction:* In a standard PD, All-Cooperate must be better than All-Defect.
      *   *Re-calc Round 2:*
          *   All Commit ($C=20$): Everyone gets 8. Total = 160.
          *   All Reserve ($C=0$): Everyone gets 6. Total = 120.
          *   *Inequality:* $160 > 120$. Collective Commit is better.
          *   *Individual:* Reserve (12) > Commit (8).
      *   *Load-bearing:* $T > R$ (12 > 8) and $P > S$ (6 > 2). Also $R > P$ (8 > 6) to ensure mutual cooperation is preferred to mutual defection.
  *   **Round 3:** The inequality $10 > 4$ makes unanimity desirable. The inequality $4 > 0$ makes being the sole veto-holder profitable (or safe) compared to being a committed sucker.
  *   **Round 4:** Identical to Round 2, but the *accumulation* of points allows for conditional strategies (tit-for-tat).

  ## 3. Run Sheet (90 Minutes)

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-10** | **Briefing** | Distribute sheets. Read **Opening Briefing** (see below). Emphasize: "Maximize your own score. No talking during decisions." |
  | **10-20** | **Round 1** | Display Rules R1. 2 min decision. Count hands. Students calculate scores. |
  | **20-30** | **Round 2** | Display Rules R2. 2 min decision. Count hands. Students calculate scores. |
  | **30-40** | **Round 3** | Display Rules R3. 2 min decision. Count hands. Students calculate scores. |
  | **40-55** | **Round 4** | Display Rules R2 again. Announce: "We play this rule 3 times consecutively. Scores accumulate." Play 3 sub-rounds (5 min each). |
  | **55-90** | **Debrief** | Facilitated discussion. Map experiences to structures. Discuss remedies and limitations. |

  ## 4. Opening Briefing (Script)
  *Read this verbatim or from memory. Do not deviate into theory.*

  "Welcome. For the next hour, you are partners in a Consortium. Your goal is simple: maximize your personal Capital Points by the end of the session.

  In each round, you will face a Market Condition. You will have two choices: **Commit** or **Reserve**.
  *   **Commit** means you invest your capital into the joint venture.
  *   **Reserve** means you hold your capital back.

  I will project the Return Schedule for each round. It tells you how many points you earn based on your choice and the total number of partners who Commit.

  Rules of engagement:
  1.  **Silence:** Once the round begins, no talking, no signaling, no notes passed.
  2.  **Privacy:** Keep your choice hidden until I call for a show of hands.
  3.  **Self-Interest:** You are not graded on being 'good.' You are graded on your final score. High scores indicate successful strategy.

  We will play several rounds. The Market Conditions may change. Your only job is to adapt to the conditions to maximize your points.

  Any questions? No? Begin Round 1."

  ## 5. Debrief Guide (Moment-by-Moment)

  **Phase 1: The Phenomenology of the Trap (10 mins)**
  *   **Ask:** "In Round 2, how many of you wanted to Commit but chose Reserve? Why?"
  *   **Point:** Elicit the feeling of *constraint*. They knew the collective good (All Commit = 160 pts) but couldn't reach it.
  *   **Ask:** "In Round 3, how did it feel to see the project fail because of one or two people?"
  *   **Point:** Elicit the frustration of *fragmentation*. The resource wasn't overused; it was *underused* because too many people had the right to say no.
  *   **Key Insight:** "You felt trapped in all rounds, but the *source* of the trap felt different. In R1 it was fear. In R2 it was temptation. In R3 it was obstruction."

  **Phase 2: Structural Diagnosis (15 mins)**
  *   **Reveal:** Now introduce the vocabulary.
      *   Round 1 was an **Assurance Problem**. (Remedy: Signaling, transparency, focal points).
      *   Round 2 was a **Prisoner's Dilemma**. (Remedy: Enforcement, contracts, external authority).
      *   Round 3 was an **Anti-Commons**. (Remedy: Aggregating rights, removing vetoes, buyouts).
      *   Round 4 was **Iterated Interaction**. (Remedy: Lengthening the shadow of the future).
  *   **Crucial Question:** "Would the remedy for Round 2 (enforcement) work in Round 1?"
      *   *Answer:* No. You don't need to force people in R1; they *want* to cooperate if they know others will. Force is costly and unnecessary.
      *   *Answer:* Would the remedy for R3 (removing vetoes) work in R2? No, because in R2 the problem isn't vetoes, it's the incentive to defect even if everyone agrees.
  *   **Takeaway:** "Diagnosis determines remedy. Misdiagnosing a Race to the Bottom leads to policy failure."

  **Phase 3: Limitations and Reality (10 mins)**
  *   **Ask:** "What was missing from this room that exists in the real world?"
  *   **Discuss:**
      *   **Preferences:** In the game, your preferences were fixed (maximize points). In reality, norms and culture change what we *want*.
      *   **Power:** Here, everyone had equal votes. In reality, some actors can absorb losses others cannot.
      *   **Time:** Real races happen over decades. Institutions drift.
      *   **Complicity:** The game doesn't capture moral guilt, only point loss.

  ## 6. Troubleshooting: What Will Go Wrong

  **1. The Altruist / Moralist**
  *   *Symptom:* A student says, "I chose Commit because it's the right thing to do," ignoring the payoff.
  *   *Handling:* "In this simulation, 'right' is defined by the rules of the Consortium. If the rules reward Reserve, a strategy that chooses Commit is a *losing* strategy. We are testing structural incentives, not moral fortitude. Please play to win."

  **2. The Colluder**
  *   *Symptom:* Students talk before Round 2 and agree to all Commit.
  *   *Handling:* "Agreements are non-binding unless the rules enforce them. In Round 2, remember: if you Commit and someone else Reserves, you lose. Can you trust the agreement when the whistle blows?" (Let them break the agreement to feel the PD structure).

  **3. The Mathematician**
  *   *Symptom:* A student calculates the Nash Equilibrium immediately and announces it.
  *   *Handling:* "Theory predicts the outcome. Experience explains the friction. Please let the others play through the decision so they can feel the tension."

  **4. Norm Bleed**
  *   *Symptom:* After Round 4 (Cooperation), students try to cooperate in a hypothetical new Round 2.
  *   *Handling:* Reset the room. "New Consortium. New partners. Past reputation does not transfer."

  **5. Debrief Collapse**
  *   *Symptom:* You start lecturing on Ostrom vs. Hardin.
  *   *Handling:* Stop. Ask: "Who felt angry in Round 3?" Return to the *feeling* before returning to the *theory*.

  ## 7. Limitations: What the Activity Cannot Reproduce

  You must explicitly state these in the debrief. The activity is a model, not a map.

  1.  **Endogenous Preferences:** The game assumes you want points. In reality, "races to the bottom" often reshape preferences (e.g., competitive cultures make people *enjoy* winning more than cooperating). The game cannot show how the race changes *who you are*.
  2.  **Scale and Anonymity:** 20 people is a village. Real races involve millions of anonymous actors. The "counting hands" mechanic creates a visibility that doesn't exist in global markets.
  3.  **Institutional Drift:** The rules here are static per round. In reality, the rules change *while* you play (laws lag behind technology).
  4.  **Complicity:** The game treats the bad outcome as a "loss of points." It does not capture the moral weight of harming third parties (e.g., environmental damage) who are not at the table.
  5.  **Power Asymmetry:** All players are equal. Real races often involve a dominant player who can set the terms or absorb the cost of the race longer than others.

  ## 8. Settled vs. Contested (For the Facilitator)

  *Use this section to ground the debrief in the actual state of the literature. Do not present the contested as settled.*

  **Settled Consensus:**
  *   **Structure Matters:** Incentive structures constrain behavior regardless of individual virtue. (The "Situationist" critique of character ethics).
  *   **Diagnosis is Key:** A policy solution designed for a Prisoner's Dilemma (coercion) will fail or be tyrannical if applied to an Assurance Problem (coordination).
  *   **Institutions Mediate:** Rules, norms, and repetition can alter the payoff structure (as seen in Round 4).

  **Genuinely Contested:**
  *   **Unified vs. Pluralist:** Is "Race to the Bottom" one single phenomenon (a generic social dilemma) or several distinct ones (PD, Assurance, Anti-Commons)?
      *   *Activity Stance:* The activity takes the **Pluralist** side. It forces students to feel the differences. Some theorists argue they are all variations of "collective action problems" and should be treated uniformly; others (like Ostrom) argue distinct diagnostics are required.
  *   **Exogenous vs. Endogenous Preferences:** Does the structure merely frustrate existing wants, or does it create new ones?
      *   *Activity Stance:* The activity assumes **Exogenous** preferences (you always want points). You must verbally supply the **Endogenous** critique (in real life, competition makes us value points more).
  *   **Direction of Competition:** Does competition reliably run "down" (lowering standards) or can it run "up" (Tiebout sorting, innovation races)?
      *   *Activity Stance:* The activity is biased toward **Downward** spirals. You must note that in some contexts (e.g., tech innovation), the "Race" produces public goods. The "Tragedy" is not universal.
  *   **Agency vs. Structure:** To what extent are participants "trapped" vs. "complicit"?
      *   *Activity Stance:* The activity leans **Structural** (you are trapped by the math). Political philosophy often debates whether this absolves participants of moral responsibility. The payoff matrix settles nothing on complicity.

