      *   *Information Cascade Definition:* A situation where individuals, observing the actions of those before them, rationally ignore their own private signal and follow the crowd, even if the crowd is wrong. Crucially, this happens when private signals are *weak* or *ambiguous* relative to the public action history.
      *   *The Flaw:* The argument assumes *all* consensus is formed via an information cascade mechanism. This is the critical equivocation.

