      *   *Case 6 (Drunk Driving):* Recklessness/Negligence $\rightarrow$ Death. **Answerable.**

  3.  **Brainstorming Underlying Principles (The "Rules"):**
      *   *Constraint:* Must fit within Ash'arite *kasb*. Human action is "created by God, acquired by man."
      *   *Hypothesis 1: The "Direct Volition" Rule.* Responsibility tracks the immediate alignment of human will with the act.
