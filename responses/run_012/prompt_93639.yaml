prompt: |-
  Hi — I'm a junior in a seminar on Islamic philosophy of action and I want to use you as a sounding board before I write a paper, so please don't just summarize the reading at me. Act like an expert in al-Ghazali and Ash'arite occasionalism (kalam, kasb, all of it), think step by step, and brainstorm the possibilities out loud before you commit to an answer. American English please, and no citations needed — I just want the reasoning.

  Here's the setup. Our prof reads al-Ghazali as saying God is the only real cause: no created thing produces anything, and the fire burning the cotton is just God's habit of doing things in that order rather than any power in the fire. Ok, fine. But she also keeps handing down verdicts about who's answerable for what, and I can't find the rule she's running. Her rulings so far — every one of them is about whether A is answerable for a death or injury:

  - A stabs B in the chest on purpose; B dies on the spot. Answerable.
  - C grabs A's hand and drives the knife in himself. A is not answerable.
  - A has a seizure and knocks over a lamp; the house burns and someone dies in the fire. Not answerable.
  - A gives his nephew a rifle for his birthday; months later the nephew uses it in a robbery and shoots someone. A had no idea and no reason to suspect. Not answerable.
  - A is a surgeon, does a routine operation with perfect technique, and the patient dies of a reaction nobody in the field had ever seen. Not answerable.
  - A drives drunk and runs down a pedestrian. Answerable.

  Next week's case, which is what I actually care about: A leaves his keys in the ignition in a lot where cars get stolen basically every week. He knows this; he's just running late. A thief takes the car and runs down a pedestrian.

  What I'm after: the different rules that all six of her rulings are consistent with (I'm sure there's more than one, and I doubt they're the same rule in different hats), what each rule predicts for the keys case, which rule you'd bet she's actually running and why, and — the part I care about most — the further case that would best seperate them. Also, does anything in her verdicts sit badly with the occasionalism she's teaching? Thats the paper I want to write. Thanks!
