      *   Did I act like an expert? Yes, using terms like *kasb*, *adah*, *taklif*.
      *   Did I think step-by-step? Yes, structured the brainstorming.
      *   Did I answer all parts? (Rules, Keys prediction, Best Bet, Test Case, Tension). Yes.

  *(Self-Correction during drafting)*: I need to make sure I don't conflate Ghazali with modern tort law too much. The "Foreseeability" rule needs to be framed as "Knowledge of God's Habit." If I know God usually burns cotton with fire, and I touch fire to cotton, I am responsible for the burning. If I know God usually allows thieves to take unattended cars, and I leave it, am I responsible for the theft's consequences? That's the Ghazalian angle.

  Let's refine the "Test Case." The best separator is usually where *intent* and *negligence* cross.
  Case: A leaves keys (negligent). Thief steals. Thief drives carefully but a child runs out (pure accident).
  vs.
