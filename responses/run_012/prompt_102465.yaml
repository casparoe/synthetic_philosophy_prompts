answer: |-
  You have identified a structural feature of the quantum foundations debate that is widely felt but rarely named with precision. You are correct to reject "merely verbal" (Chalmers) because the choice of definition has downstream methodological consequences. You are also correct to reject standard "substantive" labels because the empirical and formal commitments overlap significantly.

  There is no single canonical *word* for this specific dynamic, but in HPS and metaphysics of science, the closest established framework is **Bas van Fraassen's notion of a "Clash of Stances."** However, that label alone is often too coarse for the granularity you need.

  To carve this properly for your work, I propose we treat this as a **Methodologically Constitutive Conceptual Dispute (MCCD)**.

  Below is the carving you asked for: the established lineage, the mechanism of the "hostage situation," the boundaries against verbal/substantive disputes, and where else this shows up.

  ### 1. The Established Lineage: "Stances" and "Conceptual Ethics"

  While there isn't a one-word term, there are two overlapping frameworks that describe exactly what you are seeing.

  **A. Van Fraassen's "Stances" (The HPS Classic)**
  In *The Empirical Stance* (2002), Van Fraassen argues that positions like "Realism" vs. "Empiricism" are not beliefs (which can be true/false) but **stances**. A stance is a cluster of attitudes, commitments, values, and research priorities.
  *   **Why it fits:** You noted that the disagreement changes "what counts as a satisfying explanation" and "which problems feel pressing." That is the definition of a stance.
  *   **The Trap:** Participants experience their stance as a *belief* about the world ("$\psi$ is real"). When you treat a stance as a belief, you get the deadlock you described.
  *   **Limitation:** Van Fraassen sometimes implies stances *shouldn't* affect the science (they are about the attitude toward the science). Your observation is sharper: the stance *does* affect the formalism.

  **B. Conceptual Ethics / Engineering (The Metaphysical Update)**
  Recent work by **David Plunkett, Herman Cappelen, and Sally Haslanger** distinguishes between *descriptive metaphysics* (what exists) and *conceptual ethics* (which concepts should we use?).
  *   **Why it fits:** Your two physicists are not disagreeing about the world (descriptive); they are disagreeing about which conceptual framework licenses the best research program (ethics/engineering).
  *   **The "Hostage" Mechanism:** The word "real" is functioning as a **normative marker**. To say "$\psi$ is real" is to grant it *explanatory license* (you can build dynamics around it). To say "$\psi$ is information" is to restrict its license (it must be derived from something else). The dispute is about **Explanatory Jurisdiction**, disguised as an ontological claim.

  ### 2. Carving the Phenomenon: MCCD

  Let's define **Methodologically Constitutive Conceptual Dispute (MCCD)**.

  **Definition:** An MCCD occurs when two parties disagree on the classification or ontological status of a posit ($X$), where:
  1.  **Empirical Equivalence:** Both parties agree on the empirical predictions and the core formalism involving $X$.
  2.  **Normative Divergence:** The classification of $X$ (e.g., "real" vs. "instrumental") confers different *permissions* or *constraints* on future theory construction.
  3.  **Naturalized Confusion:** Both parties believe they are making a descriptive claim about $X$, rather than a normative choice about how to treat $X$.

  **How it differs from the neighbors:**

  | Feature | Merely Verbal Dispute | Ordinary Substantive Dispute | **MCCD (Your Phenomenon)** |
  | :--- | :--- | :--- | :--- |
  | **Resolution** | Resolves once terms are defined. | Resolves via evidence/logic. | **Does not resolve;** requires choosing a research strategy. |
  | **Consequences** | None. | Different predictions/truth conditions. | **Different heuristics/formal extensions.** |
  | **Subject Matter** | Language use. | The world. | **The rules for theorizing about the world.** |
  | **Example** | "Is a tomato a fruit?" | "Is there a Higgs boson?" | **"Is the wavefunction a physical field?"** |

  ### 3. The "Hostage" Mechanism: Explanatory Licensing

  You mentioned the participants are "hostage" to a definitional choice. Here is the mechanism:

  In quantum foundations, "Real" is not a predicate describing a property of $\psi$; it is a **status grant**.
  *   **The "Realist" Grant:** If $\psi$ is real, you are licensed to modify the dynamics (e.g., collapse models) to preserve $\psi$'s continuity. You feel pressure to explain *how* it interacts.
  *   **The "Epistemic" Grant:** If $\psi$ is information, you are licensed to modify $\psi$ (e.g., update rules) to preserve the underlying ontology (e.g., hidden variables or agents). You feel pressure to explain *what* it is about.

  The disagreement feels substantive because **the licensing conditions are substantive.** If you pick the "real" label, you inherit a set of problems (the measurement problem becomes a dynamical problem). If you pick the "information" label, you inherit a different set (the measurement problem becomes a consistency problem).

  The participants cannot see this because they have **reified the license**. They think the license comes from the *nature* of $\psi$, rather than recognizing the license comes from the *choice* of the label.

  ### 4. Boundaries and Scope

  **Is the whole Realism/Anti-Realism fight an instance?**
  Yes, largely. The debate over Scientific Realism is the macro-version of this. However, in QM foundations, it is more acute because the formalism is fixed while the ontology is underdetermined. In other sciences, ontology often drives prediction (e.g., positing a planet vs. positing an error). In QM, the "planet" ($\psi$) is already in the math; the dispute is about its *jurisdiction*.

  **Does this happen outside physics?**
  Yes, wherever "Real" functions as a gatekeeper for resources or explanatory priority.
  *   **Biology (Species):** "Are species real or just classifications?" The "realist" looks for essences/genetic boundaries; the "conventionalist" looks for ecological utility. Both do the same fieldwork, but publish in different journals and ask different questions.
  *   **Psychiatry (Disorders):** "Is depression a real chemical imbalance or a social construct?" This is an MCCD. The "real" side licenses pharmaceutical research; the "construct" side licenses social intervention. The disagreement persists not because of data, but because the label determines *where the money goes*.
  *   **Economics (Rationality):** "Is rationality a real psychological mechanism or a modeling assumption?" This dictates whether you do neuro-economics or behavioral modeling.

  ### 5. Strategic Advice for Your PhD

  Since you are in HPS but living in a Foundations group, you need to navigate this without alienating the physicists (who often view this philosophical nuance as stalling).

  1.  **Don't call it "Verbal":** If you tell a physicist their debate is verbal, they will tell you their research program depends on the distinction. They are right. Use **"Methodologically Constitutive."** It validates their work while exposing the structure.
  2.  **Cite the Right Ancestors:**
      *   **Arthur Fine (The Shaky Game):** For the argument that the realism debate is stalled by this dynamic (The Natural Ontological Attitude).
      *   **Hu Price (Naturalism without Mirrors):** Specifically for QM. Price argues this is a confusion between "object naturalism" (what's in the world) and "subject naturalism" (what we do with the words). This is the sharpest tool for your specific quantum case.
      *   **Hasok Chang (Is Water H2O? / Active Realism):** For the idea that maintaining multiple "ontologies" can be scientifically productive.
  3.  **The "Carve" for Your Thesis:**
      Frame the dispute not as "Who is right about $\psi$?" but as **"Which Explanatory Jurisdiction is more productive?"**
      *   *Thesis Move:* "The psi-ontic/psi-epistemic distinction is not a discovery about the state, but a choice of **heuristic constraint**."
      *   This allows you to analyze the *consequences* of the choice (which you said are real) without getting bogged down in the *truth* of the choice (which is the deadlock).

  ### Summary Label
  If you need a label for your writing, **"Clash of Stances"** is the safe, citable HPS term. If you want to be more precise about the mechanism, use **"Normatively Loaded Ontological Dispute"** or **"Methodologically Constitutive Conceptual Disagreement."**

  The phenomenon is real. It is not a bug in the philosophy; it is a feature of how theoretical science progresses when the formalism outruns the ontology. Your job is not to solve the deadlock, but to map the consequences of the two different licenses being issued.
