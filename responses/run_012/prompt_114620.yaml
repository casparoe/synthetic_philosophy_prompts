      *   *Best approach:* Reject **(1)**. The dichotomy is false. There is a third category: **Reasons of Civic Duty / Collective Responsibility**.
      *   *Why it looked plausible:* Individualism. We tend to think of actions as either "doing something" (causal) or "saying something" (expressive).
