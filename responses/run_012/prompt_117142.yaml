  Two climbers, Vic1 and Vic2, dangle from separate anchors above a gorge. Guide Alice sees Vic1's anchor fraying; she grabs a rescue line and yanks hard to swing him to a ledge, but the anchor shatters independently of her pull due to pre-existing corrosion, and Vic1 falls to his death. Guide Betty monitors Vic2's anchor, which triggers a safety net unless she stands up from a weighted chair; she does not stand up, the anchor fails, the net stays retracted due to her weight, and Vic2 falls to his death. Both guides foresaw the risk, neither intended the deaths, and the physical outcomes are identical.

  (i) Under the movement test, Alice *does* something (yanking) while Betty merely *allows* (not standing); under the causal test, Alice only *lets die* (corrosion explains the death) while Betty *kills* (her weight is a cited cause of the net's failure). The tests diverge because Alice's movement is causally futile, while Betty's omission is causally decisive.

  (ii) The moral verdict ought to track the causal classification (killing/letting die), because moral responsibility hinges on whether the agent made a difference to the victim's survival, not on the kinematics of their muscles. A defender of the view that the distinctions are identical would resist this case by arguing that Betty's muscle tension to remain seated constitutes bodily movement (making her a "doer") or that Alice's pull contributed stress to the anchor (making her a "killer"), thereby denying that the tests actually come apart in a coherent description of the facts.

  (iii) The smallest change to collapse the scenario back into the ordinary pattern is to remove the pre-existing corrosion and the weight-sensitive chair, standardizing the equipment so that active intervention causes failure and passive omission allows it; then Alice's pull would break a sound anchor (doing/killing) and Betty's inaction would fail to deploy a manual net (allowing/letting die).
