answer: |-
  Here is your Q&A prep sheet. I have ordered these by damage potential, starting with the objections that threaten the theoretical coherence of the project and moving toward those that challenge its application. The vocabulary is tuned to your specific audience members.

  ### 1. The Retributivist "Desert Gap" Objection
  **Who:** The Desert Theorists
  **Damage:** **Fatal.** If you cannot explain why this wrong *deserves* punishment rather than civil regulation, your account fails as a theory of *criminal* law.

  **The Objection:** "You explicitly say this isn't about enforcing morality or preventing harm. Retributivism requires moral wrongdoing to justify punishment. If buying authorship is just a violation of an institutional 'meaning,' why does the actor *deserve* the stigma and pain of criminal conviction? You've given us a theory of regulation, not a theory of crimes."

  **The 2-Minute Reply:**
  "I accept that punishment requires wrongdoing, but I disagree that wrongdoing is limited to moral sin or tangible harm. My claim is that participating in a shared institution creates a duty of fidelity to its constitutive rules. When I submit a paper, I am implicitly invoking the institution of 'academic credit.' To sell that credit is not just a breach of contract; it is a betrayal of the cooperative practice that makes the activity possible for everyone else. It's analogous to voting fraud: it doesn't always change the election outcome (harm), and it isn't a sin in a religious sense (morality), but it undermines the very medium of political agency. The desert arises from the violation of that public trust, which is a distinct category of wrongfulness that the criminal law is uniquely suited to vindicate because it speaks for the polity."

  **Where the Reply is Thin:**
  You are smuggling "morality" back in via "fidelity" and "trust." A hard-nosed retributivist will say fidelity is only a duty if the institution is morally good.
  **Concession:**
  "I concede I need to say more about the threshold for which institutions are worthy of this protection. I'm not arguing *any* institutional meaning counts, only those essential to public agency."

  ### 2. The Millian "Disguised Devlin" Objection
  **Who:** The Liberals
  **Damage:** **Fatal.** If "institutional meaning" is just a synonym for "social morality," you haven't escaped Hart's critique of Devlin.

  **The Objection:** "This sounds like Legal Moralism with extra steps. You say you aren't enforcing morality, but 'public meaning' is just the majority's moral view of how things ought to be. If the public thinks homosexuality degrades the 'meaning of marriage,' does your account criminalize it? You haven't solved the Devlin problem; you've just renamed 'disgust' as 'meaning.'"

  **The 2-Minute Reply:**
  "That's the crucial distinction I'm trying to draw. Devlin relied on *feelings*—intolerance, indignation, disgust. My account relies on *constitutive rules*. Marriage, on my view, isn't protected because people feel strongly about it, but because it is a specific legal status with defined rights and duties. My account wouldn't criminalize same-sex marriage because that *extends* the institution's meaning without breaking its constitutive logic (commitment, legal union). Buying authorship, however, *replaces* the logic (work) with a different logic (payment). I am not protecting sentiment; I am protecting the intelligibility of the practice itself."

  **Where the Reply is Thin:**
  The line between "constitutive rule" and "moral sentiment" is blurry. Who defines the constitutive rules?
  **Concession:**
  "I concede that determining 'constitutive rules' is interpretive and contestable. I'm not claiming this is a mechanical test, but a normative framework for argument."

  ### 3. The Foucauldian "Hegemony" Objection
  **Who:** The Foucauldian
  **Damage:** **High.** Undermines the normative validity of your "public meaning."

  **The Objection:** "You speak of 'public meaning' as if it's neutral. But meanings are imposed by power. The 'meaning' of the profession, or the degree, is decided by the elite who already hold them. Your theory just gives the state a new tool to codify existing hierarchies and punish those who try to redefine institutions from the margins."

  **The 2-Minute Reply:**
  "I agree that meanings are sites of struggle, and I don't claim the current meaning is always just. However, we cannot operate without *some* settled meaning. If the meaning of a 'degree' or a 'verdict' is entirely fluid, the institution ceases to function as a coordination device. The criminal law's role isn't to freeze meaning forever, but to provide the stable background against which democratic contestation happens. If we want to change the meaning of marriage, we should do it legislatively, not through a market that bypasses the public settlement."

  **Where the Reply is Thin:**
  You are assuming the state is a neutral arbiter of "settlement" rather than a participant in power.
  **Concession:**
  "I concede my account risks conservatism. It needs a supplementary principle that allows for legitimate institutional evolution."

  ### 4. The Empiricist "Operationalization" Objection
  **Who:** The Criminologist
  **Damage:** **High.** Makes the theory practically useless.

  **The Objection:** "Let's say I accept the theory. How do I measure 'meaning change'? You say conduct is criminal if, *if widely practiced*, it changes the institution. That's a counterfactual. I can't measure that. How do prosecutors prove this in court? It seems to invite arbitrary enforcement."

  **The 2-Minute Reply:**
  "Legal standards are often qualitative, not quantitative. We ask juries to decide what is 'reasonable' or 'negligent' all the time without empirical metrics. The question for the legislature, not the court, is the counterfactual: 'Would a market in authorship destroy the concept of authorship?' That's a policy judgment. Once the law is settled, the court only asks: 'Did this defendant participate in the market?' The empirical burden is on the立法者 (legislator), not the prosecutor in every case."

  **Where the Reply is Thin:**
  Legislators are rarely philosophical; they react to scandals.
  **Concession:**
  "I concede this requires a high degree of legislative restraint and perhaps a requirement for impact assessments before criminalizing."

  ### 5. The Millian "Subsidiarity" Objection
  **Who:** The Liberals
  **Damage:** **Medium.** Challenges the necessity of *criminal* law.

  **The Objection:** "Even if buying authorship is bad, why *criminalize* it? Universities can ban it. Journals can retract papers. Professional bodies can disbar. Why reach for the blunt instrument of the state?"

  **The 2-Minute Reply:**
  "Because the harm is to the *public* institution, not just the university. A degree isn't just a certificate from a specific campus; it's a public signal of competence that the state relies on for licensing, funding, and trust. Private sanctions are insufficient because they are fragmented. If University A bans it but University B allows it, the public meaning of 'PhD' becomes fragmented. Only the state can settle the public meaning uniformly."

  **Where the Reply is Thin:**
  This risks over-criminalizing professional misconduct.
  **Concession:**
  "I concede this should be a last resort. Criminalization is only appropriate where private sanctions fail to maintain the public signal."

  ### 6. The Retributivist "Proportionality" Objection
  **Who:** The Desert Theorists
  **Damage:** **Medium.** Challenges sentencing.

  **The Objection:** "If the wrong is 'meaning degradation,' how do you sentence? Is selling one paper the same as selling ten? Does it matter if the paper was good or bad? Your theory seems unmoored from the gravity of the act."

  **The 2-Minute Reply:**
  "Proportionality tracks the *intent to undermine* the institution. A single instance might be a lapse; a market operation is an attack on the institution. The sentence should reflect the degree to which the actor sought to profit from the degradation of the public good, similar to how we treat counterfeiting. It's not about the quality of the paper, but the integrity of the credit."

  **Where the Reply is Thin:**
  "Intent to undermine" is hard to prove.
  **Concession:**
  "I need to develop a clearer scaling principle for sentencing within this framework."

  ### 7. The "Ticket Touting" Boundary Objection
  **Who:** General Group
  **Damage:** **Medium.** Tests internal consistency.

  **The Objection:** "Why doesn't your account criminalize ticket touting? If everyone touts, doesn't that change the meaning of 'going to a match' from 'being a fan' to 'being a consumer'? Why is that different from authorship?"

  **The 2-Minute Reply:**
  "Because the primary institution of the match is the sporting contest itself, which happens regardless of who is in the stands. The secondary market in tickets doesn't change what the *game* is. Authorship, however, is constitutive of the paper. The paper *is* the record of work. If you separate the work from the name, you aren't just changing the distribution; you are changing the ontology of the object. Touting changes access; authorship-selling changes identity."

  **Where the Reply is Thin:**
  Fans might argue the atmosphere *is* part of the institution.
  **Concession:**
  "That's a fair challenge. I'd argue touting is regulated, not criminalized, precisely because it affects access, not identity."

  ### 8. The "Conservative Bias" Objection
  **Who:** General Group
  **Damage:** **Low/Medium.** Philosophical temperament.

  **The Objection:** "This theory seems inherently conservative. It protects existing institutions from change. What about whistleblowers who expose that an institution's 'meaning' is a sham? Are they criminals on your view?"

  **The 2-Minute Reply:**
  "No, because whistleblowing usually appeals to the *true* meaning of the institution against corrupt practice. A whistleblower says, 'This isn't what policing is supposed to be.' They are reinforcing the institutional meaning, not degrading it. My account protects the ideal type of the institution, not necessarily its current corrupted practice."

  **Where the Reply is Thin:**
  Distinguishing between "corruption" and "evolution" is difficult.
  **Concession:**
  "I concede the theory needs a mechanism to distinguish between degeneration and legitimate evolution."

  ***

  ### The Question You're Secretly Hoping Nobody Asks

  **"Who decides what the meaning is?"**

  **Why it's the killer:**
  This is the Hart-Devlin kill shot reincarnated. Devlin said "the reasonable man." Hart said that's just majority tyranny. You are saying "the public meaning."
  If you say "The Legislature," you admit this is just majoritarianism (Devlin wins).
  If you say "The Courts," you admit this is judicial moralism (undemocratic).
  If you say "The Participants," you admit you can't criminalize it (because they might agree to the change).

  **If asked:**
  Do not try to solve it. Concede the tension.
  *Draft Reply:* "That is the hardest question. My answer is: The Legislature, but constrained by a requirement of public reason. They can't just say 'we dislike this.' They must articulate *how* the practice breaks the constitutive rules of the institution. It's not about what they want the meaning to be, but what the logic of the institution requires. It's a rationalist constraint on majoritarianism."
