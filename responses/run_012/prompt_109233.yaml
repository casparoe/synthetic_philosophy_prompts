      *   **Core Theme:** The Absent-Minded Driver puzzle.
      *   **Key Insight:** The optimal policy requires doing the "worse" thing at a specific node if you knew where you were, but since you don't, you must commit to a rule. Applied to the couple: they spent years stuck at "Intersection 1" (overthinking), and got out by committing to a rule (marriage) rather than optimizing every moment.
      *   **Tone:** Warm, funny, followable (4 mins), not a lecture, not embarrassing for either group.
      *   **Specific Instruction:** Do *not* end on "so, kids, precommitment."
