answer: |-
  # Joint Statement on Frankfurt-Style Cases

  ### Agreed Claims
  1. A Frankfurt-style case stipulates a counterfactual intervener ready to ensure a specific outcome if the agent shows signs of choosing otherwise.
  2. In the actual sequence of events, the intervener remains causally inert.
  3. The case leaves open the actual causal history of the agent's decision.
  4. Whether the agent could have done otherwise depends on whether the device's presence removes alternative possibilities prior to the decision.
  5. Determinism is not essential to the case's structure, though it is often assumed.
  6. A case fails to establish its conclusion if the intervener causally influences the actual decision.
  7. Both sides agree moral responsibility requires some connection to the agent's psychology.
  8. Accepting the verdict on the original case does not settle *why* responsibility holds.
  9. Both sides count a case as failing if the stipulation removes the very feature disputed.

  ### Disagreements Table

  | Sub-question | Frankfurt-Defender | PAP-Defender | What Would Move Them | Type |
  | :--- | :--- | :--- | :--- | :--- |
  | **Does the agent retain AP?** | No. The device blocks all relevant alternatives. | Yes. The device presupposes a sign or will that implies AP. | Proof that the 'sign' is not an alternative. | Genuine |
  | **Does the case refute PAP?** | Yes. It shows MR without AP. | No. It stipulates away the AP required for MR. | A case where AP is absent but MR intuition remains. | Genuine |
  | **Reading of 'Could have'** | Leeway incompatibilist or simple conditional. | Robust/Regulative control. | Agreement on the necessary strength of AP. | Verbal/Substantive |
  | **Grounds of Responsibility** | Actual sequence suffices. | Alternative sequences necessary. | Argument linking MR exclusively to actual history. | Genuine |

  ### Cruxes
  1. **The 'Sign' Problem:** Is the prior sign of doing otherwise an alternative possibility?
     *   *Argument:* The necessity of a trigger for the intervener.
     *   *Prediction:* Frankfurt-Defender says no (insufficient for responsibility); PAP-Defender says yes (foothold).
  2. **Scope of Refutation:** Does success tell against *any* AP requirement or only one specification?
     *   *Argument:* Generalizability of the case structure.
     *   *Prediction:* Frankfurt-Defender says any; PAP-Defender says only specific formulations.
  3. **Grounds of Responsibility:** Is the dispute about PAP or the grounds of responsibility?
     *   *Argument:* Whether actual sequence properties suffice for desert.
     *   *Prediction:* Frankfurt-Defender says actual sequence; PAP-Defender says alternative sequences ground responsibility.

  ### Variants
  (a) **Two Interveners.** An obstruction intervener prevents action; a substitution intervener manipulates deliberation to cause the decision.
  *   **Agreement:** Do they stand together? Frankfurt-Defender: Yes (both remove AP). PAP-Defender: No (Substitution preserves authorship differently).
  *   **Prediction:** Frankfurt-Defender says MR holds in both. PAP-Defender says MR fails in Substitution if reasoning is hijacked.
  *   **Revelation:** Tests whether the case targets freedom (AP) or authorship (sourcehood).

  (b) **Knowledge.** The agent knows the device is attached, but it is inert.
  *   **Same/Different:** Frankfurt-Defender: Same (device inert). PAP-Defender: Different (knowledge alters deliberative context/coercion).
  *   **Show:** Shows the role of awareness in assessing coercive structures.

  (c) **Indeterministic Deliberation.** Genuine chance of either outcome; device stands ready.
  *   **Work for F-Def?** Yes (device catches the flicker).
  *   **PAP Concede no AP?** No (indeterminism entails AP until device acts).
  *   **Same Question?** No. Frankfurt-Defender asks about outcome inevitability; PAP-Defender asks about process indeterminacy.

  (d) **Flicker.** Alternative is mere intention formation, overridden or unconnected.
  *   **Robustness:** PAP-Defender needs robust alternative (realisable through practical reasoning).
  *   **F-Def Denial:** Denies robustness is required for MR.
  *   **Answer:** Yes, PAP needs robustness; Yes, Frankfurt-Defender denies it.

  ### Note on Verbal Disagreements
  Disagreements are verbal where sides define 'could have done otherwise' differently (leeway vs. robust). However, the core is substantive: it concerns whether the grounds of moral responsibility lie exclusively in the actual sequence or necessarily involve alternative possibilities. Even if terminology aligns, the metaphysical claim about what grounds desert remains distinct.

  \answer{substantive | The grounds of responsibility}
