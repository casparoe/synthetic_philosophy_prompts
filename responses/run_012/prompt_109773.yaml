answer: |-
  1. The dispute, stated precisely

  The core of your disagreement concerns the scope of continuity within a naturalistic worldview. Your friend argues that naturalism is a uniform commitment: if all inquiry is continuous with science, then moral inquiry must be continuous with science in the same way epistemic inquiry is. On this reading, norms of reasoning and norms of conduct are both tools assessed by their utility in serving human ends. To deny moral truth while accepting epistemic normativity is, for your friend, an arbitrary restriction that violates the spirit of naturalism. You contend that Quine's framework allows for a principled distinction. You suspect that while both types of norms might be naturalized as instruments, the criteria for their assessment differ fundamentally. The dispute is not about whether norms exist, but whether the naturalistic justification for epistemic norms extends to moral norms. If your friend is right, Quine's dismissal of ethics is inconsistent. If you are right, there is a feature of epistemic norms that survives naturalization while moral norms do not, without invoking the forbidden first philosophy.

  2. What Quine is actually committed to

  To resolve this, we must reconstruct Quine's systematic commitments without relying on traditional labels. Quine rejects the idea of a prior standpoint from which to judge science. Knowledge is a web of belief facing the tribunal of experience only at its edges. The primary constraint on this web is sensory stimulation. For Quine, the objective of scientific inquiry is the prediction and control of sensory stimulation. This objective is not chosen arbitrarily; it is forced upon us by our biological situation. We are physical organisms interacting with a physical environment. Survival depends on forming expectations about how the world will impinge on our sensory surfaces.

  Regarding ethics, Quine is notably skeptical. He does not treat moral sentences as contributing to the prediction of sensory stimulation in the way physical hypotheses do. He views moral values as culturally transmitted dispositions rather than facts about the world. While he accepts that moral language has a function, he denies it has truth values in the robust sense applicable to science. He treats moral claims as expressions of sentiment or social conditioning. However, Quine does allow normativity within epistemology. He describes naturalized epistemology as a branch of engineering. It studies how to construct theories that best predict experience. This normativity is hypothetical: if you want to predict stimulation, here is the best method. The crucial question is whether this engineering model applies to ethics. Quine suggests it does not, because ethics lacks the external constraint of the physical world. The ends of morality are not forced by nature in the same way the need for prediction is. I am extrapolating here from his general behaviorism and his specific comments on value, but the theme is consistent: science tracks causal structure, ethics tracks social cohesion.

  3. The parity argument, at full strength

  Your friend's position relies on a robust interpretation of instrumentalism. The argument begins by accepting Quine's view that epistemic norms are not absolute commands but practical guidelines. We value logic and evidence because they work. They help us build theories that survive empirical testing. If this is the case, then the justification for epistemic norms is purely functional. They are good because they serve the end of predictive success. Your friend argues that moral norms function identically. We value honesty or fairness because they serve the end of social stability or human flourishing. Both sets of norms are tools for coping with our environment. The environment for science is the physical world; the environment for ethics is the social world. Both are empirical domains.

  On this reading, the distinction between fact and value collapses into a distinction between different types of problem-solving. Science solves the problem of navigating physical space; ethics solves the problem of navigating social space. Both involve hypotheses about what actions or beliefs will lead to desired outcomes. If a moral norm fails to produce social harmony, we discard it, just as we discard a scientific hypothesis that fails to predict stimulation. Therefore, to say moral claims lack truth while scientific claims possess it is to draw a line where there is no difference in kind. It implies that Quine is privileging physical prediction over social satisfaction without a naturalistic reason. Your friend claims this privilege is a relic of the very empiricist dogmas Quine sought to destroy. If naturalism means taking human practices seriously as objects of study, then moral practice is as legitimate as scientific practice. To deny moral truth is to fail to follow through on the naturalistic commitment. The parity argument concludes that Quine's naturalism, if consistent, must treat ethics as a science of human well-being, with moral claims being true or false relative to those natural ends.

  4. Where the parity breaks

  The parity argument is compelling but overlooks a specific constraint in Quine's system: the role of sensory evidence as the ultimate arbiter of reality. For Quine, the uniqueness of science lies in its accountability to non-human reality. When we formulate a physical theory, the world pushes back. If our prediction fails, the stimulation does not match the expectation. This friction is independent of our desires. We cannot wish away a failed prediction. This external constraint is what grounds the notion of objective truth in Quine's framework. Truth is disquotational, but it applies to sentences that are tied to the causal structure of the world.

  Moral norms lack this specific type of accountability. If a moral norm fails to produce social harmony, the failure is not a mismatch with external reality in the same sense. It is a failure to align human desires. But human desires are mutable and variable. There is no single external standard that forces convergence on moral issues in the way physical evidence forces convergence on scientific issues. Two communities can have different moral norms and both can be socially stable. They cannot both have contradictory physical theories about the same stimulus conditions and both be successful in prediction. This is the disanalogy. The end served by epistemic norms—prediction of stimulation—is fixed by our biology and the physical world. The end served by moral norms—social coordination or happiness—is not fixed in the same way.

  Furthermore, Quine's behaviorism treats moral learning as conditioning, not hypothesis testing. We are trained to feel approval or disapproval. We are not trained to predict sensory outcomes in the moral domain. When we assess a moral norm, we are not checking it against the world; we are checking it against our own sentiments or the sentiments of our group. This makes the assessment internal to the practice, whereas scientific assessment is external to the theory. The friend's argument assumes that social stability is analogous to physical prediction. But for Quine, physical prediction is the gateway to reality. Social stability is merely a state of the organism. Therefore, the normativity of epistemology is grounded in the necessity of tracking reality. The normativity of ethics is grounded in the contingency of human preference. This breaks the parity without invoking first philosophy. It relies on the empirical fact that physical reality constrains us differently than social reality does.

  5. My verdict

  I conclude that you are right to insist on an asymmetry, though the justification requires precision. Quine's naturalism can underwrite a defensible distinction between theoretical and practical norms. The distinction rests on the source of constraint. Epistemic norms are constrained by the causal independence of the physical world. Moral norms are constrained by the variable psychology of human agents. This allows Quine to maintain that science aims at truth while ethics aims at satisfaction, without contradicting his naturalism. The naturalism is not a blanket endorsement of all inquiry as truth-apt; it is a specific account of how we relate to the world via sensory evidence.

  I am highly confident in this verdict because it aligns with Quine's persistent focus on stimulation as the evidence base. If moral claims did not tie back to stimulation in the specific way required for truth conditions, they cannot be part of the web of belief in the same way. Your friend's error is assuming that instrumentalism levels all distinctions. It does not. Instruments differ based on what they measure. Science measures the world; ethics measures us. Quine's dismissiveness about moral truth is not a failure of nerve but a consequence of his strict criteria for what counts as facing the tribunal of experience. However, I would change my mind if it could be shown that moral disagreement is resolved by evidence in the same causal manner as scientific disagreement. Since it is not, the asymmetry holds. Quine's system is not a package deal that validates all norms equally; it privileges the norms that track external causality.

  6. What I should have said to my friend

  You are treating all norms as tools, but you are ignoring what the tools are built to measure. Science is constrained by a world that kicks back regardless of what we want. Ethics is constrained only by what we want. Quine's naturalism privileges the former because only the former tracks objective reality. That is not arbitrary; it is biological.
