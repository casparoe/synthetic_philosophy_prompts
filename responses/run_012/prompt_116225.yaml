      *   *The Act Requirement:* Criminal liability generally requires *actus reus* (guilty act). You can't be convicted for being a "bad person" (status crimes are unconstitutional/illegal in most jurisdictions). This aligns with liberal legal theory (harm principle, autonomy).
      *   *Sentencing/Parole:* Once guilt is established, the focus shifts. Retribution looks at the act's severity. Utilitarianism/Deterrence/Incapacitation look at the *future*. Risk assessment requires predicting behaviour. Prediction relies on patterns. Patterns imply some stability in the agent.
      *   *Situationism:* (Doris, Harman, etc.) Challenges the existence of robust, cross-situational character traits. Behaviour is largely determined by situational variables (Milgram, Stanford Prison, Good Samaritan study).
      *   *The Tension:* If situationism is right, "risk" isn't a property of the *person* but of the *person-in-environment*. Assessing the person in isolation is epistemically flawed.

  3.  **Address the Specific Questions:**

      *   *Q1: What theory of character is presupposed?*
          *   Current practice implicitly assumes *globalism*. Pre-sentence reports talk about "attitudes," "lifestyle," "personality disorders." Parole boards ask about "change." This implies a stable inner substrate.
          *   However, legally, it's often framed as "risk factors" rather than "virtues/vices."

      *   *Q2: Global vs. Local Traits?*
          *   Could it get by with local traits? Yes, theoretically. "He steals when drunk and broke, but not when sober." That's a local disposition.
          *   But the law often treats these local dispositions as if they reveal a deeper moral failing (global).

      *   *Q3: Tension between 'Acts' and 'Persons'?*
          *   Yes, there is tension. Conviction is act-based (liberal safeguard). Sentencing is often person-based (utilitarian risk management). This is the "preventive turn" in justice.

      *   *Q4: Concrete changes if Situationism is true?*
          *   If behaviour is situational, sentencing based on *who you are* is unjust/ineffective.
          *   Focus must shift to *where you will be* and *what circumstances you will face*.
          *   Release conditions should be environmental, not just behavioural (e.g., not "don't reoffend" but "avoid this specific trigger").
          *   Risk assessment tools (OASys, etc.) need to weigh situational stability more than personality scores.

  4.  **Formulate the Verdict:**
      *   The user wants a verdict, not a "on the one hand, on the other."
      *   *My position:* The current system is philosophically incoherent. It pretends to punish acts but operates on a folk-psychology of character that situationism has largely debunked. However, we don't need to abolish character entirely; we need to *relationalise* it.
      *   *The Verdict:* The practice is *not* fine as is. It relies on an outdated metaphysics of the self. It needs to shift from assessing "dangerous people" to managing "dangerous situations."

