answer: |-
  You have put your finger on the central incoherence of modern liberal criminal justice. It is a system built on two contradictory metaphysics of the human agent, switched on and off depending on which stage of the process one is observing.

  To answer your first question: sentencing and parole practice presupposes a **robust globalist theory of character**. Whilst the conviction phase adheres to a strict act-centred retributivism (you are guilty because of what you *did*), the sentencing phase slides quietly into a utilitarian risk-management model that assumes you are dangerous because of who you *are*. The Pre-Sentence Report (PSR) and parole dossiers are essentially exercises in folk psychology. They operate on the assumption that past behaviour is a reliable index of an underlying, stable disposition that will project itself into the future, irrespective of context. When a judge weighs 'remorse', they are not merely checking if you accept the facts; they are probing for a moral realignment of the self. When a parole board assesses 'risk', they are betting on the stability of your traits.

  This is where the situationist critique bites hardest. If Doris, Harman, and the empirical data are correct—that behaviour is largely a function of situational variables (humidity, proximity to authority, fatigue, opportunity) rather than cross-situational character traits—then the epistemic basis of risk assessment is rotten. The system treats a man who stole bread whilst starving and under duress as having the same 'criminal disposition' as a man who stole for pleasure whilst wealthy, provided the *act* is identical. Conversely, it treats a man who has been 'good' in the highly structured, supportive environment of prison as having undergone a characterological transformation, ignoring that he is merely responding to a different situation.

  Can the system get by with weaker, local traits? Theoretically, yes. One could argue that dispositions are real but fine-grained: 'honest when watched by peers', 'violent when intoxicated'. If the courts adopted this **localist view**, sentencing would look radically different. It would cease to be about judging the moral worth of the agent and become purely about mapping the specific triggers that lead to offending. However, the current practice does not do this. It conflates local patterns with global moral failings. It treats 'bad character' as a substance you carry, rather than a set of conditional probabilities.

  So, is there a genuine tension between 'punishing acts' and 'assessing persons'? Absolutely. It is not merely a tension; it is a contradiction. The 'act not person' principle is a liberal safeguard designed to prevent status crimes and thought policing. But by making release contingent on 'demonstrated change' or 'low risk', the state effectively punishes the person. You serve your time for the act, but you remain incarcerated for the person you might be. This is the preventive turn in justice, and it relies entirely on the fiction of the stable, predictable character.

  If we took the situationist point seriously, what would concretely have to change?

  1.  **Risk Assessment Tools:** Instruments like OASys would need to be overhauled. They currently weight static historical factors (which assume stability) heavily. A situationist model would weigh dynamic environmental factors much more heavily. The question shifts from 'Is he a risk?' to 'Is the environment he is returning to a risk?'
  2.  **Licence Conditions:** Parole conditions are currently behavioural ('do not commit offences', 'attend therapy'). They should be structural. Instead of demanding the offender 'control their anger', the state should be mandated to ensure they are not released into housing conditions known to trigger violence.
  3.  **The Concept of Remorse:** We would have to stop treating remorse as a window into the soul. Apologising is a speech act that can be performed by a sociopath or a terrified innocent. It should carry far less weight in sentencing than concrete plans for situational avoidance.
  4.  **Sentencing Logic:** Indeterminate sentences based on 'dangerousness' would become philosophically indefensible. You cannot lock a man up indefinitely because his character is 'bad', if 'character' is merely a situational artefact.

  **The Verdict**

  The practice is **not** fine as is. It is operating on an outdated metaphysics of the self that the social sciences have largely abandoned. The legal system is clinging to a notion of 'character' because it provides a convenient hook for hanging predictions of future behaviour, but it is an epistemically unjustified hook.

  To resolve this, the system must stop pretending it is assessing the inner moral state of the offender. It should abandon the language of 'rehabilitation of character' and adopt a language of **situational management**. We do not release men because they have become 'good'; we release them because the specific situations that triggered their offending have been mitigated. If we cannot guarantee the situation, we have no business claiming we can predict the person. The tension you have identified is not a bug; it is a feature of a system that wants the moral clarity of retributivism at conviction but the predictive power of determinism at sentencing. It cannot have both. It must choose, and situationism dictates it must abandon the myth of the stable character.
