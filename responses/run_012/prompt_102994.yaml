answer: |-
  **Research Question:** Is the narrative self ontologically analogous to a physical abstraction, a social institutional posit, or a fictional entity, and does distinguishing these categories resolve ambiguities in the center of narrative gravity model?

  **Project Summary**
  This project investigates the metaphysical status of the "narrative self." Contemporary philosophy of mind frequently employs the "center of narrative gravity" analogy to describe the self as real but not a concrete substance. However, this analogy conflates distinct categories of non-concrete reality. A center of gravity is a physical abstraction determined solely by mass distribution; a border or price is a social institutional posit dependent on collective agreement; a character is a fictional entity dependent on representational practices. This project argues that current literature slides between these categories, generating unresolved disputes about the self's reality. Over four months, I will develop a taxonomy of these ontological categories and determine which best fits specific roles of the self (protagonist, narrator, and referent of "I"). The outcome will be a manuscript for publication that clarifies the metaphysical commitments of narrative selfhood.

  **Intellectual Merit and Gap in Literature**
  The dominant view holds that the self is a "fiction" or "construct" that is nonetheless real in a pragmatic sense. While this avoids dualism, it lacks precision. When theorists claim the self is like a center of gravity, they imply objectivity and observer-independence. When they claim it is narrative, they imply interpretive flexibility and purpose-dependence. These are incompatible modes of existence.

  Existing positions do not settle this because they treat "non-concrete reality" as a single bucket. By failing to distinguish between physical abstractions (observer-independent), institutional posits (observer-dependent but factive), and fictional entities (observer-dependent and non-factive), current models cannot explain why the self feels objective to the subject yet shifts across social contexts. This project isolates this category mistake. It does not seek new empirical data on narrative psychology but rather clarifies the ontological commitments already implicit in psychological models.

  **Methodology: Justification for Conceptual Approach**
  This project employs conceptual analysis rather than empirical investigation. Empirical psychology can establish *that* humans construct narratives or *how* neural processes support self-representation, but it cannot determine *what kind of thing* a narrative self is. The confusion here is categorical, not data-driven. Adding more experimental results will not resolve whether the self is more like a price or a planet's center of mass. A philosophical audit of the concepts is required to prevent category errors from stifling theoretical progress. This conceptual groundwork is a prerequisite for any future interdisciplinary collaboration.

  **Work Plan (4 Months)**
  *Month 1: Taxonomy and Mapping*
  *   **Weeks 1-2:** Formalize the three-category taxonomy (Physical Abstraction, Institutional Posit, Fictional Entity). Define necessary and sufficient conditions for each.
  *   **Weeks 3-4:** Map existing narrative self theories onto this taxonomy to identify where specific authors slide between categories.

  *Month 2: Role Differentiation*
  *   **Weeks 5-6:** Analyze the "Self as Protagonist." Test whether this role fits the Fictional Entity model.
  *   **Weeks 7-8:** Analyze the "Self as Narrator" and the referent of "I." Test whether these roles fit the Institutional Posit model.

  *Month 3: Argument Construction*
  *   **Weeks 9-10:** Draft the core argument: that the "center of gravity" analogy fails because it borrows authority from physics while functioning as an institutional posit.
  *   **Weeks 11-12:** Develop counter-arguments. Test if the categories collapse back into one another under pressure. Refine the distinction to ensure stability.

  *Month 4: Drafting and Revision*
  *   **Weeks 13-14:** Write full manuscript draft.
  *   **Weeks 15-16:** Internal revision and formatting for target journal submission.

  **Expected Outcomes and Success Criteria**
  **Success:** The project yields a stable distinction between the three ontological categories such that at least one role of the self (e.g., the narrator) can be definitively classified as an institutional posit rather than a physical abstraction. A successful result is a complete manuscript ready for submission to a peer-reviewed journal in philosophy of mind or metaphysics.
  **Failure:** The project fails if the three categories prove indistinguishable when applied to the self, or if the analysis demonstrates that the "center of narrative gravity" analogy is robust enough to withstand the categorical split without modification. In this case, the result would be a paper arguing for the status quo, which still constitutes a valuable contribution by ruling out a promising line of critique.

  **Feasibility and Scope**
  Four months is sufficient for this scope because the project is narrowly focused on a single conceptual analogy rather than a comprehensive history of the self. The work requires no IRB approval, participant recruitment, or data collection. The risk of overscoping is mitigated by limiting the analysis to three specific roles of the self (protagonist, narrator, "I") rather than attempting a full theory of personal identity. The course release provides the necessary uninterrupted time for the intensive drafting phase in Months 3 and 4.
