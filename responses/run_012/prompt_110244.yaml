prompt: |-
  I'm a novelist, not a philosopher, but I've gotten weirdly obsessed with a scene I'm drafting and I need help before I embarrass myself on the page. My character's an ex-actuary, the kind of guy who prices everything, and he lays out this little proof for his brother, and I want to make sure I'm not putting a howler in his mouth.

  Setup: two sealed envelopes. He's told one holds exactly twice what the other holds, and nothing else. He takes one, opens it, sees X. Then:

  (1) The other envelope holds either 2X or X/2.
  (2) There's no reason to prefer one of those over the other, so each has probability 1/2.
  (3) So the expected value of the other envelope is (1/2)(2X) + (1/2)(X/2) = 5X/4, which beats the plain X in my hand.
  (4) So I should switch. I'd even pay a small fee to switch, if I had to.
  (5) And none of (1)-(4) turned on which envelope I happened to open, or on the value of X. So whatever I'm holding, I should trade it for the other one. Then trade back. Then trade again, paying the fee every time.
  (6) A rule that tells me to pay money to swap a thing for itself, forever, has to be broken. So one of (1)-(4) is false, even though each one looks airtight on its own.

  Which step, and what do I give up when I give it up? My gut says (2) is the soft spot, but I can't say exactly why it's wrong without the whole thing collapsing into "the envelope just is what it is," which feels like cheating. And a second thing nags me: is there ANY procedure the envelope-filler could have used that would make my guy's always-swap rule actually correct? He insists yes, and it bugs me. Don't give me the glib version — give me what a careful decision theorist would say.

  Act as a philosopher of probability and decision theory who's taught this thing many times and is a little tired of the lazy answers. Think it through carefully before you commit, maybe start by brainstorming the candidate diagnoses and ruling them out. Keep it conversational, I'm a novelist, not a grad student. And I know I've probably spelt a few things wrong, sorry.

  After the explanation, give me a short structured summary as a JSON object with exactly these fields: "broken_step" (the step or steps you reject), "why_it_looked_fine" (one or two sentences), "the_flaw" (name it precisely — equivocation, bad prior, scope slip, whatever it is), "cost_of_rejecting" (what principle I lose by fixing it), "any_valid_distribution" (yes/no plus a one-line why), and "one_line_for_the_novel" (a single sentence I could actually hand to the character).
