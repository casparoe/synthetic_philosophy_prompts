      *   **Pitfalls:** Someone will say "But a random chord *must* mean uniform distribution of midpoints." I need to validate them without validating the answer.
      *   **Limitations:** The activity shows the *conflict*. It doesn't solve the *resolution* (Jaynes' Principle of Maximum Entropy/Invariance). I need to explain that in the debrief.

  4.  **Drafting the Content (incorporating constraints):**
