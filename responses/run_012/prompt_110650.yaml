          *   *Winner:* A modified version of the User's idea. Start with freehand to expose the ambiguity of language. Then, to get the clean maths, use physical props (straws/spinners) that embody the three methods, assigned randomly to tables. This ensures the data works for the bet.

      *   *Wait, I need to be careful.* The prompt says "walk into it rather than be told about it." If I give them envelopes with Method A, B, C, they are being told.
      *   *Best approach for "Walking into it":*
