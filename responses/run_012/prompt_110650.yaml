      *   *Pivot:* I will recommend the "Secret Envelope" approach but frame the envelopes as "Different definitions of Fairness." No, that gives it away.
      *   *Best Compromise:* Phase 1 is Freehand (chaos). Phase 2 is "Let's mechanise this." I introduce the three mechanisms as "Three ways a machine might do this." They test the machines. This keeps the "walk into" feel (the machines sound equally valid) but ensures the data works.

  6.  **Writing the Response:**
      *   **Introduction:** Acknowledge the user's expertise and the club's vibe.
