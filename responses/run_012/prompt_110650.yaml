              2.  **The "Secret Instruction" Split:** Three groups, different hidden instructions. (Guarantees results, but feels like a trick).
              3.  **The "Procedural Lottery":** Everyone draws freely first (to establish intuition), *then* we introduce three physical ways to generate chords (straws, spinners, drops) and assign them randomly. This bridges the gap between intuition and mechanical randomness.

      *   *Wait, looking closer at the prompt:* The user wants them to walk into it. The most powerful version of Bertrand's Paradox is when everyone agrees on the phrase "Choose a chord at random" but executes it differently.
