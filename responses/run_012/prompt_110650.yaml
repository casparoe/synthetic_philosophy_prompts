          *   *Evaluation:* The Envelope Method is best. It preserves the "I was just following instructions" innocence while guaranteeing the mathematical divergence. It feels like a trick only if the instructions sound different. The instructions must sound equally "random."
          *   *Actually, let's look at the User's Shape again:* "Everyone gets a paper disc... asked... to draw a chord 'chosen at random'".
          *   *Problem:* If I just say "draw a random chord," 80% will draw through the middle. We won't get the 1/3 vs 1/4 split. We'll get "Human Bias" vs "Maths."
          *   *Solution:* I need to guide them to the three methods without naming them as "The Three Methods of Bertrand." I will use the "Secret Instruction" approach but frame it as "Different ways to be fair."
          *   *Wait, better idea:* Let the first phase be the "Freehand" (which will be messy). Then the Facilitator says, "Okay, that was messy. Let's use tools to be truly random." Then introduce the three tools.
