      *   *Option 2: The "Method Assignment" Approach.*
          *   Split the room into three groups. Give each group a specific *method* for generating the chord (e.g., Group A: pick two points on edge; Group B: pick a radius and a point on it; Group C: pick a point inside for the midpoint).
