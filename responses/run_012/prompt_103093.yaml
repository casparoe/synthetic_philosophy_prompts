          4.  Is this one problem or a family of similar problems (belief, emotion, value)?
      *   **Constraints:** No citations, explain properly/walk through, conversational but precise tone.

  2.  **Deconstruct the "Wrong Kind of Reasons" (WKR) Problem:**
      *   *Core Issue:* FA theories say $X$ is good = we ought to favor $X$.
      *   *Challenge:* There are reasons to favor $X$ that don't make $X$ good (e.g., the demon threat, the million dollars).
      *   *Response:* FA theorists say, "Okay, only the *right kind* of reasons count."
      *   *Counter-Challenge:* How do you define the "right kind" without saying "reasons that show $X$ is good"? If you do that, the definition is circular (Good = reasons to favor; Right Reasons = reasons showing Good).

  3.  **Address Question 1: Reasons vs. Attitudes:**
      *   It's primarily a problem about *reasons*, but it impacts the definition of *attitudes* in the context of value.
      *   The problem arises because reasons come in two flavors, but the theory (FA) treats the attitude as a monolith.
      *   *Correction:* It's actually a problem for the *analysis of value*. The reasons reveal that the attitude isn't sensitive to value in all cases.

  4.  **Address Question 2: Object-Given vs. State-Given Reasons:**
      *   *Object-Given:* Reasons provided by the properties of the *thing* you're having the attitude toward. (The cake tastes good -> reason to desire the cake).
      *   *State-Given:* Reasons provided by the properties of *having the attitude itself*. (Desiring the cake gets you $1M -> reason to desire the cake).
      *   *Does it solve it?* It distinguishes them, yes. But it doesn't fully *solve* the circularity worry for FA theories. Why? Because to say "Only object-given reasons count for value" is basically saying "Only reasons related to the goodness of the object count." That's the circularity.
      *   *Nuance:* Some philosophers try to define "object-given" without using the word "good." (e.g., reasons that cite features of the object). But sometimes features of the object *are* state-given (e.g., believing this truth makes you happy). So the line can blur.

  5.  **Address Question 3: One Problem or a Family?**
      *   It's a family. The structure is identical across domains.
      *   *Belief:* Evidential reasons (truth-related) vs. Pragmatic reasons (Pascal's Wager).
      *   *Emotion:* Fear of the dangerous dog (object) vs. Fear because a demon will zap you if you don't fear a harmless cushion (state).
      *   *Value:* Admiring the hero (object) vs. Admiring the villain because he'll pay you (state).
      *   *Unity:* They all share the "Normative Kind" structure. Different mental states have different "correctness conditions." Belief aims at truth. Fear aims at danger. Desire aims at good. WKR happens when you have a reason to hold the state that bypasses the correctness condition.

  6.  **Drafting the Explanation (Iterative Process):**

      *   *Intro:* Validate their understanding. They are actually really close.
      *   *Section 1: The Core Distinction (Object vs. State).* Use the "Demon" example. It's the classic.
          *   Scenario: Evil demon threatens to kill you unless you admire him.
          *   Reason to admire: To save your life.
          *   Does this make him admirable? No.
          *   Why? Because the reason is about the *state of admiring*, not the *demon himself*.
          *   Contrast: He saved a puppy. Reason to admire: His kindness. This is about *him*.
      *   *Section 2: Is it about Reasons or Attitudes?*
          *   It's about the *link* between them.
          *   Attitudes have a "job." Belief's job is truth. Fear's job is tracking danger. Admiration's job is tracking admirability.
          *   WKR shows that you can fulfill the "reason to hold" condition without fulfilling the "job."
      *   *Section 3: Does the Distinction Solve It?*
