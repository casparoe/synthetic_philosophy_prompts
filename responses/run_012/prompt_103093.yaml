          *   If I say "Object-given reasons cite properties of the object," is that enough? (Maybe the object has the property "will pay me if admired").
          *   So, it's a working distinction, but not a magic bullet.
      *   *Section 4: One Problem or Many?*
          *   It's a structural template.
          *   Belief (Evidential vs. Pragmatic).
