          *   *Norms:* Distinguish between the definition of truth and the norm of assertion. Deflationists usually win here by shifting the burden to justification/utility.
          *   *Semantics:* The tension between deflationary truth and truth-conditional semantics.
          *   *The "Moving Goalposts":* Address the evolution from Horwich to Field to Brandom. Is it adaptability or evasion?
      *   *Conclusion:* The one-line verdict.

  4.  **Refining the Arguments (Self-Correction during drafting):**
