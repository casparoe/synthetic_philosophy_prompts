prompt: |-
  Ok so I've been in a seminar on theories of truth and I've basically talked myself into deflationism, in a fairly strong sense: the truth predicate exists so we can generalise and endorse (everything she said is true; if the theory is true so is its consequence), and there's no substantive property of truth with a nature to be investigated — calling a belief true doesn't add a further fact about it beyond what the belief already claims. I'm pretty convinced, but I also suspect I'm convinced partly because the view is so good at absorbing hits, so I want you to play devil's advocate properly. What would actually count against this? Not the pop objection that truth is obviously correspondence; I want the real pressure points, sorted by how decisive they'd be if they held up, and I want to know which of them the deflationist themselves would concede as a cost versus wave away as a misunderstanding.

  The things I keep half-worrying about: the liar and its revenge versions, since the view wants truth to be a transparent device you can always substitue in and out, and the paradox looks like the substitution breaking somewhere — does that cost just the transparency thesis or the whole position? Then the point a friend raised, that adding a truth predicate to a formal theory lets you prove new things in the base language (reflection-type principles), which smells like truth doing real explanatory work rather than mere bookkeeping. Then whether truth's role as the norm or aim of assertion and inquiry — that we criticise beliefs as true or false and that this actually guides revision — needs a more substantive notion than deflationism allows. And whether a truth predicate can earn its keep in compositional semantics, or really is just a device for genealising. For each, say whether it's fatal, serious, or merely awkward, and be honest about whether deflationism has quietly been qualified (disquotational vs minimalist vs prosentential, deflating the predicate vs deflating the property) into something unfalsifiable, and whether that's actually a problem for a view of this kind. End with a one-line judgment on how exposed the position really is, as: Verdict: ...
reasoning: |-
  Here's a thinking process that leads to the suggested response:

