answer: |-
  The requirement that **innocents cannot be punished even for maximal social gain** does the most exclusionary work, killing pure act-utilitarianism and unconstrained deterrence models.

  **1. The Definition Boundary**
  A theory must explain why punishment is distinct from taxes, therapy, or vigilante violence. You asked if drawing this line is part of the theory's job: yes. If a theory cannot distinguish state imprisonment from a kidnapper's ransom or a mandatory vaccine, it has failed to define its subject. It must justify the "authorized party" and "response to a wrong" clauses in your definition, not take them as given.

  **2. The Liability Constraint (No Punishing the Innocent)**
  Derived from the "response to a wrong" clause, this requires that punishment be triggered only by culpable wrongdoing. This is the constraint cited above; it demands a deontological side-constraint on maximizing good consequences, forcing consequentialists into rule-utilitarian contortions.

  **3. The Scaling Requirement (Your candidate a)**
  The theory must justify degrees of punishment (five years vs. ten) non-arbitrarily. It must explain whether severity tracks harm, culpability, or cost of enforcement, and whether fines and prison are commensurable currencies.
  *Status: Genuine Requirement.* Any theory that cannot explain why murder is punished more harshly than jaywalking is inadequate. However, insisting that fines and prison are the *same kind* of scaling is a legalist prejudice; some theories treat them as categorically different (liberty vs. property).

  **4. The Detection Independence Requirement (Your candidate c)**
  The theory must verdict an act as punishable regardless of whether it was detected.
  *Status: Retributivist Prejudice.* This is not a neutral requirement. Economic deterrence models explicitly require scaling penalties *inverse* to detection probability to maintain optimal disincentives (if capture is rare, the fine must be huge). Insisting on independence assumes punishment is about desert, not behavior steering.

  **5. The Entity Scope Requirement (Your candidate b)**
  The theory must account for punishing non-sentient entities (corporations, AI).
  *Status: Legalist Prejudice.* Moral philosophy often holds that only beings capable of suffering or moral agency can be punished. Requiring a theory to accommodate corporate liability privileges current legal doctrine over moral metaphysics; a theory that says "only humans can be punished" is not inadequate, it is just restrictive.

  **6. The Post-Offense Change Requirement (Your candidate d)**
  The theory must handle reform, prior suffering, or future utility (e.g., the offender is the only doctor who can save a victim).
  *Status: Utilitarian/Restorative Prejudice.* Retributivism holds that once desert is established, post-offense reform does not erase the liability to punishment (though it may mitigate). Utilitarianism says if the danger is gone, punishment is waste. Restorative justice says if repair is made, punishment is unnecessary. Treating any one of these verdicts as a "requirement" begs the question against the others.

  **7. The Standing Requirement (Your candidate e)**
  The theory must distinguish being blameworthy (desert) from being entitled to impose blame (standing/authority).
  *Status: Genuine Requirement (with caveats).* Your roommate is right: a theory that conflates moral blame with legal punishment cannot explain why *the state* punishes rather than the victim. However, insisting that standing *always* trumps desert is a political prejudice; some theories argue that lack of state standing (e.g., in illegitimate regimes) negates the right to punish entirely, while others argue the moral desert remains regardless of the agent.

  **8. The General Justification**
  The theory must explain why we have the institution of punishment at all, distinct from why we punish this specific person. This separates the "General Justification" (why prisons exist) from the "Distribution" (who goes to them), preventing the error of justifying the institution by utility while justifying specific cases by desert (or vice versa) without explaining the link.
