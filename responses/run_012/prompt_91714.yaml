answer: |-
  ### The Path Dependence Decision Tree

  This instrument is designed to separate the *nature* of the lock (cost vs impossibility) from the *nature* of the outcome (exact vs functional). Start at the root and follow the answers that best fit your group's intuition about the system in question.

  ```text
  ROOT: If you reset the system to the start, does the EXACT SAME 
        specific outcome emerge (e.g. this specific codebase/standard)?
        │
        ├── YES ──┬── Q1: Does it emerge because physical/logical laws 
        │           │     force it, or because rational agents would 
        │           │     simply choose it again?
        │           │
        │           ├── Laws Force It ──────────────────────────────► [LEAF 1]
        │           │
        │           └── Rational Choice ────────────────────────────► [LEAF 2]
        │
        └── NO ───┬── Q2: If a DIFFERENT outcome emerged, would it 
                  │     perform the core function just as well?
                  │
                  ├── YES (Functional Equivalence) ──┬── Q3: Is the 
                  │                                  │     alternative 
                  │                                  │     path still 
                  │                                  │     available?
                  │                                  │
                  │                                  ├── NO (Gone) ──► [LEAF 3]
                  │                                  │
                  │                                  └── YES ──┬── Q4: Why haven't 
                  │                                            │     we switched?
                  │                                            │
                  │                                            ├── Coordination 
                  │                                            │     Cost ───────► [LEAF 4]
                  │                                            │
                  │                                            ├── Sunk Cost ────► [LEAF 5]
                  │                                            │
                  │                                            └── Inertia ──────► [LEAF 6]
                  │
                  └── NO (Functional Difference) ────┬── Q5: Can we switch to the 
                                                     │     alternative path now?
                                                     │
                                                     ├── IMPOSSIBLE ─────────────► [LEAF 7]
                                                     │
                                                     └── POSSIBLE ──┬── Q6: What 
                                                                    │     prevents 
                                                                    │     the switch?
                                                                    │
                                                                    ├── High Cost 
                                                                    │   (Skills) ───► [LEAF 8]
                                                                    │
                                                                    ├── High Cost 
                                                                    │   (Structure) ─► [LEAF 9]
                                                                    │
                                                                    ├── Alternative 
                                                                    │   Now Worse ──► [LEAF 10]
                                                                    │
                                                                    └── System 
                                                                        Evolves 
                                                                        Faster ─────► [LEAF 11]
  ```

  *(Note: I have provided 11 leaves below to ensure distinct categories. A 12th 'False Lock-in' category is often claimed but logically collapses into Leaf 6 or 10, so it is omitted to maintain precision.)*

  ### The Leaves: Positions and Awkward Commitments

  **Leaf 1: Causal Necessity**
  *   **Position:** History is irrelevant; the outcome was the only physical possibility.
  *   **Awkward Commitment:** Human agency is an illusion; the engineers did not choose the design, physics did.

  **Leaf 2: Efficiency Determinism**
  *   **Position:** History is irrelevant; rational actors would always converge on this optimal solution.
  *   **Awkward Commitment:** There is objectively one 'best' way to solve every problem, and we have found it.

  **Leaf 3: Ecological Lock-in**
  *   **Position:** We are stuck because the alternatives no longer exist (vendors died, code deleted).
  *   **Awkward Commitment:** Our technical sovereignty is held hostage by the survival rates of third-party maintainers.

  **Leaf 4: Network Lock-in**
  *   **Position:** We are stuck because switching requires everyone to move at once (coordination failure).
  *   **Awkward Commitment:** We are knowingly remaining on inferior technology because we cannot trust each other to leave.

  **Leaf 5: Investment Lock-in**
  *   **Position:** We are stuck because we have already spent too much money/time to justify switching (sunk cost).
  *   **Awkward Commitment:** Past waste is a valid justification for future waste.

  **Leaf 6: Historical Noise**
  *   **Position:** We are on this path simply because we haven't bothered to move; switching is cheap but unprioritised.
  *   **Awkward Commitment:** Our current architecture is essentially random, yet we treat it as designed.

  **Leaf 7: Structural Lock-in**
  *   **Position:** We are stuck because switching is physically or logically impossible (e.g. data loss, physics).
  *   **Awkward Commitment:** Our past decisions have permanently reduced the universe of possible futures.

  **Leaf 8: Skill Lock-in**
  *   **Position:** We are stuck because our team is trained for this system; retraining is too expensive.
  *   **Awkward Commitment:** Our engineers are valuable primarily because they know our legacy mistakes.

  **Leaf 9: Architectural Lock-in**
  *   **Position:** We are stuck because the system is too entangled; components cannot be swapped independently.
  *   **Awkward Commitment:** The system is too fragile to be fixed, only patched indefinitely.

  **Leaf 10: Degraded Alternatives**
  *   **Position:** We could switch, but the road not taken has become overgrown/worse over time.
  *   **Awkward Commitment:** History punishes latecomers; being second-best is a permanent penalty.

  **Leaf 11: Moving Target Lock-in**
  *   **Position:** We cannot switch because the current system evolves faster than we can migrate away from it.
  *   **Awkward Commitment:** Stability is impossible; we are running to stand still.

  ***

  ### Indistinguishable Leaves

  In a heated meeting, your group may struggle to separate these pairs. They often feel the same in practice, even if the theory differs.

  *   **Leaf 4 (Network) vs. Leaf 5 (Investment):** Both manifest as "it costs too much to switch." Distinguishing them requires asking: *If I had a magic wand to pay the bill, would the switch happen?* If yes, it's Investment (Leaf 5). If no (because others still won't move), it's Network (Leaf 4).
  *   **Leaf 1 (Causal) vs. Leaf 2 (Efficiency):** From the outside, both look like "we would end up here anyway." You can only separate them by checking if the constraint is physical (Leaf 1) or economic/psychological (Leaf 2).
  *   **Leaf 6 (Noise) vs. Leaf 10 (Degraded):** Both look like "we haven't switched." Leaf 6 claims the alternative is still fine, we're just lazy. Leaf 10 claims the alternative has rotted. This requires auditing the alternative, which teams rarely do.

  ### Unoccupied or Incoherent Combinations

  There are logical combinations of answers in the tree that nobody seriously defends. If your group lands here, check for confusion.

  *   **Functional Equivalence + Physical Impossibility (Leaf 3 vs Leaf 7 boundary):**
      *   *The View:* "The alternative does the exact same job, but it is physically impossible to switch to it."
      *   *Why Unoccupied:* This is generally incoherent. If two things are functionally equivalent in a technical system, they are usually substitutable. If substitution is *physically* impossible, they usually differ in function or interface. Defending this requires arguing that the 'lock' is magical rather than technical.
  *   **Exact Same Outcome + Switching is Expensive (Leaf 1/2 vs Leaf 5/8):**
      *   *The View:* "If we restarted, we'd build the exact same thing, but now we can't change it because it's expensive."
      *   *Why Unoccupied:* If you would build the exact same thing again (Leaf 1/2), then the current state is optimal or necessary. Claiming you are 'locked in' implies you *want* to be elsewhere. You cannot coherently claim the outcome is inevitable *and* that you are trapped in it against your will.
  *   **Historical Noise + Structural Lock-in (Leaf 6 vs Leaf 7):**
      *   *The View:* "We haven't switched because we haven't bothered (Noise), but also we can't switch because it's impossible (Structural)."
      *   *Why Unoccupied:* This is a contradiction in motives. Either the barrier is real (Structural) or it is motivational (Noise). Teams often claim both to exaggerate their predicament, but logically one must give way.

  ### How to Use This in Your Group

  When the discussion goes in circles, pause and ask: **"Which question on the tree are we arguing about?"**

  *   If you are arguing about whether QWERTY is 'best', you are at **Q1/Q2** (Determinism vs Contingency).
  *   If you are arguing about whether you *could* rewrite the codebase, you are at **Q5** (Possibility).
  *   If you are arguing about whether it's *worth* rewriting, you are at **Q6** (Cost vs Value).

  Most engineering disputes about path dependence are actually arguments about **Q4** (Coordination vs Sunk Cost) or **Q6** (Skill vs Structure). Identifying this stops you from debating history when you are actually debating budget.
