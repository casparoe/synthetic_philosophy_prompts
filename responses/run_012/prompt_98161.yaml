          *   *Info-Gap Theory:* Decision making under severe uncertainty.
          *   *Ruin Constraints:* Prioritize avoiding catastrophic moral outcomes over maximizing good (Negative Utilitarianism alignment).
          *   *Model Risk Capital:* Explicitly pricing the uncertainty of the model itself.

  8.  **Refining the Tone:**
