          *   *Intrinsic Value:* In reinsurance, money is the numeraire. In ethics, the numeraire (welfare, happiness) is contested.

  6.  **Addressing the Three Suspicions (Section 3):**
      *   *Discounting:* Actuary uses time value of money/risk discount. Ethics often uses pure time preference (zero or near-zero). *Verdict:* Genuine asymmetry. Infinite horizons break EV calculations more easily than finite ones.
      *   *Diversification:* Reinsurer holds a portfolio (Law of Large Numbers applies). Moral agent acts in a single world (no ensemble average). *Verdict:* Genuine asymmetry. Ergodicity problem.
      *   *Ruin vs. Expectation:* Actuary optimizes for solvency (survival). Consequentialism optimizes for Good (maximization). *Verdict:* Genuine asymmetry. Satisficing vs. Maximizing.

  7.  **Evaluating the Residue/Conclusion (Section 4):**
