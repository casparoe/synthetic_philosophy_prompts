  5.  **Analyzing the Translation Loss (Section 2):**
      *   *Clean Carry-overs:* Structural uncertainty is indeed the "butterfly effect." The divergence of EV maps to non-convergent integrals in heavy-tailed distributions.
      *   *Distortions:*
          *   *Value vs. Cost:* Actuarial work usually minimizes loss/cost. Consequentialism maximizes "Good." The metric is harder to define in ethics.
          *   *Time Horizon:* Reinsurance has a run-off period (finite). Ethics often implies infinite horizon.
