      *   *Scenario Generation:* Our catalogue is too small and biased. We can't simulate the "butterfly effect" scenarios.
      *   *Uncertainty:* It's not just parameter uncertainty (wrong numbers); it's structural uncertainty (wrong physics/logic).
      *   *Tail Behaviour:* The distribution has such fat tails that the mean doesn't converge (Pareto with $\alpha \le 1$).
