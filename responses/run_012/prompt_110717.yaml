      *   *Best approach:* Acknowledge the user's intuition. The "Bank Run" is actually Amartya Sen's "Entitlement Approach" dressed up. It's the strongest *economic* model, but fails on *political* intent.
      *   *Final Verdict:* The politics *does* live in the seams. The Bank Run explains the *mechanism* of death (entitlement collapse). The Crime explains the *cause* of the mechanism (policy). The Natural Disaster explains the *trigger* (shock). Using only one is ideological blindness.

