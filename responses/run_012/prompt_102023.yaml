  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   **Core Claim:** If voters are independent and each has probability $p > 0.5$ of being correct on a binary choice, the probability of the majority being correct approaches 1 as $n \to \infty$.
      *   **Key Assumptions:**
          1.  **Binary Choice:** True/False, Yes/No.
          2.  **Competence:** $p > 0.5$ (better than chance).
          3.  **Independence:** Votes are not correlated (no communication, no common signal bias).
          4.  **Sincerity:** Voters vote according to their judgment (not strategic).
          5.  **Homogeneity:** Usually assumed $p$ is same for all, or average $p > 0.5$.
      *   **Common Misapplications:** Ignoring independence (common cause), ignoring competence (what if $p < 0.5$?), ignoring binary nature (complex policy isn't True/False).

