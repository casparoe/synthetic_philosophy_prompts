answer: |-
  # JOINT STATEMENT ON SELF-LOCATING BELIEF
  **An Adversarial Collaboration between Proponents of the Self-Sampling Assumption and the Self-Indication Assumption**

  ## PART I: AGREED CLAIMS

  1.  **Restatement of Principles:**
      *   **Self-Sampling Assumption (SSA):** When reasoning about your location in the world, you should assign credences as if you were a random sample from the set of actually existing observers within a specified reference class. Hypotheses are not favored merely because they contain more observers; they are favored only if your specific indexical evidence is more likely under them.
      *   **Self-Indication Assumption (SIA):** When reasoning about which world you inhabit, the fact of your existence is evidence that favors hypotheses entailing more observers. Hypotheses are favored in proportion to the number of observers they contain, prior to considering specific indexical evidence.

  2.  **Nature of the Disputed Credences:** We agree that the dispute concerns **self-locating credences**: probabilities assigned to propositions about *which* observer one is, given a set of hypotheses about the objective structure of the world. We disagree on whether the normalization of these credences should be constrained by the count of actual observers (SSA) or whether the count of observers should update the probability of the world hypotheses themselves (SIA).

  3.  **The "Other Things Equal" Qualification:** We agree that both principles apply *ceteris paribus*. This clause means we hold fixed all non-indexical physical evidence (e.g., background radiation measurements, historical records). The disagreement arises only when physical evidence underdetermines the number of observers or one's location among them.

  4.  **Relevant Cases:** We agree that the following cases are genuine tests of the principles, not merely illustrative anecdotes:
      *   **The Sleeping Beauty Problem:** (Self-locating uncertainty with known objective chances).
      *   **The Doomsday Argument:** (Inference from birth rank to total population size).
      *   **The Presumptuous Philosopher:** (Inference from theory choice to observer count without empirical data).
      *   **The Nightshift Case:** (Inference from observer duration and count with indistinguishable experiences).
      *   **Reference Class Elasticity:** (The effect of widening or narrowing the group of beings considered "observers like us").

  5.  **Acknowledged Costs:**
      *   The **SSA Proponent** concedes that their principle, in its standard form, entails the **Doomsday Argument**: that being born early in human history is strong evidence that the total number of humans who will ever exist is small, absent other evidence.
      *   The **SIA Proponent** concedes that their principle, in its standard form, entails the **Presumptuous Philosopher** conclusion: that a physicist can reject a well-motivated physical theory in favor of one that predicts vastly more observers, solely based on their own existence, without empirical measurement.

  6.  **Decision-Theoretic Relevance:** We agree that this is not merely a semantic dispute about the word "probability." We agree that if the principles yield different probability assignments, they will, in some conceivable decision scenarios (e.g., betting games involving copies), recommend different actions.

  ## PART II: DISAGREEMENTS TABLE

  | Crux | SSA Position (Wording for Signature) | SIA Position (Wording for Signature) | Case / Argument Accepted by Both | SSA Prediction | SIA Prediction | Status & Reason | Burden of Proof |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Doomsday Argument** | My early birth rank is evidence for a smaller total population, because I am a random sample from the total set of humans. | My existence favors hypotheses with more humans, which cancels out the evidence from my birth rank; total population remains unchanged by rank alone. | **Doomsday Case:** You know your birth rank is *n*, but not the total number *N*. | P(Small N) is significantly raised by knowing *n* is small relative to possible large *N*. | P(Small N) is unchanged; the prior favoring Large N offsets the sampling likelihood. | **Substantive:** Different posteriors on *N* lead to different expectations about future human longevity. | **SSA:** Must explain why existence doesn't favor larger worlds. |
  | **2. The Presumptuous Philosopher** | Physical theories should be judged on empirical evidence, not observer count; I am not justified in favoring a theory merely because it creates more people. | I am justified in favoring the theory that creates more observers, because it is objectively more likely that I would exist in that world. | **Presumptuous Case:** Theory A predicts 1 billion observers; Theory B predicts 1 trillion. No empirical data distinguishes them. | P(A) ≈ P(B) (based on physical priors). | P(B) ≈ 1,000 × P(A) (weighted by observer count). | **Substantive:** Leads to divergent scientific methodology and theory choice. | **SIA:** Must explain why this is not "armchair cosmology." |
  | **3. The Nightshift Case** | I am likely the long-lived observer; the short-lived observers are either excluded from my reference class or weighted by duration, not raw count. | I am almost certainly one of the short-lived observers; the hypothesis with more distinct observers is vastly more likely. | **Nightshift Case:** Heads: 1 observer (80 yrs). Tails: 1 observer (80 yrs) + 1T observers (1 sec). Experiences indistinguishable at *t*=0. | **~1/2** (if RC restricted to long-lived) or **~1/400** (if weighted by observer-moments). | **~1/10¹²** (weighted by distinct observer count). | **Partly Verbal:** Depends on whether "observer" is defined by body-count or moment-count. | **SSA:** Must define the Reference Class without ad-hoc restrictions. |
  | **4. Reference Class Definition** | The reference class must be restricted to observers who share my specific evidence and causal context to avoid absurd conclusions. | The reference class should be maximal (all observers); restrictions are ad-hoc attempts to avoid the Doomsday conclusion. | **Reference Class Elasticity:** Varying the definition of "observer like me" changes SSA results but not SIA results. | Results vary wildly with RC definition; finding the "true" RC is a core philosophical task. | Results are robust to RC definition; only the existence of observers matters. | **Substantive:** SSA requires a solution to the "Reference Class Problem" to be action-guiding. | **SSA:** Must provide a non-circular rule for RC selection. |

  ## PART III: CLOSING DIAGNOSIS AND METADATA

  **Verbal Dispute Diagnosis**
  A portion of our dispute is **partly verbal**. Specifically, we often disagree on what the term "probability" is tracking in self-locating contexts. The SSA proponent treats probability as a measure over *centered worlds* (where the center is fixed by sampling), while the SIA proponent treats probability as a measure over *uncentered worlds* (updated by existence). When we agree on the decision-theoretic payout (e.g., in a betting scenario), the dispute is verbal; when we disagree on the payout (as in the Nightshift case under different weighting schemes), the dispute is substantive. The core substantive disagreement is whether "existence" constitutes evidence distinct from "indexical location."

  **Collaboration Outcome**
  This exercise has not resolved the dispute, but it has successfully isolated the disagreement. We have moved from arguing about conclusions (e.g., "Doomsday is false") to arguing about premises (e.g., "Does existence update uncentered credence?"). We have identified the Nightshift case as the critical stress test for the SSA reference class, revealing that the SSA position fractures into multiple variants (Restricted vs. Moment-Weighted) under pressure, whereas the SIA position remains unitary but counter-intuitive. We agree to treat the Nightshift case as the primary battleground for future discussion.

