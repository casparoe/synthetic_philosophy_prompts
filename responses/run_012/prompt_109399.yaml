answer: |-
  - **The step that breaks** — Step (2). It claims that your reason for an option *just is* its expected payoff, which silently assumes that identifying and securing that payoff is costless. By defining "reason" solely as the value of the outcome, it excludes the computational effort, time, and information-gathering costs required to find that outcome from the rational calculus. To save satisficing, you have to say that the "reason" to choose an option is a function of both its outcome value *and* the cost of the deliberation process needed to secure it.

  - **Why it looked fine** — This step looks obvious because it mirrors the standard neoclassical model of *Homo economicus*, where agents have unbounded cognitive resources and information is effectively free. In that idealized world, the "best" option is always transparently available, so the only thing that matters is the ranking of outcomes. It also appeals to a clean, mathematical intuition: if rationality is about getting the most value, then any rule that stops short of the maximum looks like leaving value on the table by definition.

  - **What it costs** — Rejecting (2) forces you to abandon the clean separation between *preferences* (what you want) and *constraints* (what limits you). In standard decision theory, you maximize a utility function subject to constraints, but the thinking itself isn't part of the function. If you reject (2), cognition itself becomes a scarce resource that must be budgeted. You can no longer treat the agent as a black box that simply outputs the maximum; you have to model the *search process* and the *stopping rule* as integral parts of the rational choice. This means "rationality" is no longer just about the relationship between options and outcomes, but about the relationship between the agent's mind and the environment.

  - This cost spreads through the rest of your picture because it makes decision theory significantly messier and more context-dependent. You lose the ability to predict behavior using a single, stable utility function, since the "rational" choice now depends on how much information the agent has already processed and how costly further search would be. You are effectively shifting from *substantive rationality* (achieving the best objective outcome) to *procedural rationality* (using the best method given cognitive limits). This requires new tools—like search theory and heuristic modeling—rather than just standard optimization calculus, fundamentally changing how you evaluate economic behavior.

  - **Where that leaves satisficing** — Satisficing remains a genuinely distinct idea because it is a strategy for *procedural* rationality, optimizing the search process rather than just the final outcome. It is rational not because it mimics maximizing, but because it acknowledges that finding the maximum is often too expensive to be worth the extra value.
