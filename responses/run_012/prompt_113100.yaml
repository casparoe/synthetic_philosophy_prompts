      *   **Specific Content Requirements:**
          *   Avoid "obviously it picks one" or generic "free will" recitations.
          *   Focus on the meaning of "no preference" and coherence of choice without preference.
          *   Incorporate the specific lecture case: Indistinguishable haystacks (to the ass) but different in unregistered respects (molecule heavier).
          *   Include the third option: Deliberate/Stand/Starve.
          *   Include the tie-breaker: The Coin Flip (and the regress problem regarding preferring the coin method/outcome).
          *   Include a specific Principle to assess: "Action is rational only if there is a consideration favouring it over every other available action."
          *   Distinguish three claims often conflated: (1) Psychological impossibility of acting without motive, (2) Irrationality of acting without motive, (3) Rational parity of tied options.
      *   **Constraints:** Self-contained (no external citations/literature), specific marking criteria (A vs. B distinction based on specific moves).

  2.  **Drafting the Exam Question:**

      *   *Goal:* Force engagement with the specific mechanics of the case provided.
      *   *Setup:* Describe the Ass scenario precisely as requested (indistinguishable to ass, molecule difference, option to starve, option to flip coin).
      *   *The Principle:* State the "Favouring Principle" clearly.
      *   *The Prompt:* Ask them to apply the principle to the specific options (Left, Right, Starve, Coin) and distinguish the three claims (Psychological, Rational, Parity).
      *   *Drafting:* "Consider the following case..." [Insert details]. "Evaluate the following principle..." [Insert principle]. "In your answer, distinguish between..." [Insert the three claims]. "Conclude on whether the coin flip solves the regress."

  3.  **Developing the Marking Scheme:**

      *   *Total:* 25 marks.
      *   *Points:* 5 distinct points, 5 marks each.
      *   *Differentiation:* Needs to show exactly what an A student does vs. a B student.
      *   *Point 1: The Nature of Indifference.* Addressing the "molecule heavier" detail. B students say "it's a tie." A students say "it's a tie *for the agent*, which is what matters for rationality, even if metaphysically distinct."
      *   *Point 2: The Starvation Option.* Addressing the third option. B students say "starving is irrational." A students analyze *why* under the principle (is there a consideration favouring eating over starving? Yes, hunger. But favouring Left over Right? No.).
      *   *Point 3: The Coin Flip Regress.* Addressing the tie-breaker. B students say "coin solves it." A students identify the higher-order preference requirement (must prefer 'flip' to 'no flip' and 'heads=left' to 'heads=right').
      *   *Point 4: The Three Claims Distinction.* Psychological vs. Rational vs. Parity. B students conflate them. A students separate them and identify which one leads to starvation (likely the Rationality claim combined with the Principle).
      *   *Point 5: Assessing the Principle.* Does the principle condemn the ass? B students say "Yes/No." A students argue about *arbitrariness* vs. *reasons* (e.g., is 'breaking the tie' itself a consideration?).

  4.  **Drafting the Model Answer:**

      *   *Tone:* Strong undergraduate (300-level). Clear, argumentative, not overly verbose but precise.
      *   *Length:* 700-800 words.
      *   *Structure:*
          1.  Intro: State the problem (Principle vs. Case).
          2.  Indifference & The Molecule: Explain why the external difference doesn't matter for rationality.
          3.  The Three Claims: Distinguish Psychology, Rationality, Parity. Locate the starvation risk.
          4.  The Coin Flip: Analyze the regress.
          5.  Conclusion: Verdict on the Principle.
      *   *Content Check:* Ensure it hits all 5 marking points. Ensure it doesn't cite external authors (Locke, Leibniz, etc.) unless general knowledge, but preferably stick to the prompt's internal logic.

  5.  **Refining and Polishing:**

      *   *Check Constraint 1 (Self-contained):* Ensure the question provides all necessary context.
