      *(Self-Correction during drafting)*: I need to make sure the "molecule heavier" detail is used correctly. It's a trap for students who think objective difference creates a reason. It shouldn't. The model answer needs to point out that rationality is agent-relative.
      *(Self-Correction on Coin Flip)*: The prompt asks to notice the regress stops arbitrarily. The model answer needs to argue whether that arbitrariness is fatal to rationality or acceptable.
      *(Self-Correction on Principle)*: The principle says "favours it over *every other* action." This is strong. If Left and Right are tied, neither favours over the other. So the principle condemns both. Does it condemn the Coin? Only if 'flipping' counts as an action with a favouring consideration.

  6.  **Final Review against constraints:**
      *   60 mins/25 marks? Yes.
      *   No "discuss literature"? Yes.
      *   Distinguish the 3 claims? Yes.
      *   Marking scheme specific on A vs B? Yes.
      *   Model answer 700-800 words? I will aim for that range.

  7.  **Final Polish:** (Writing the output).
      *   *Question:* Make it crisp.
      *   *Scheme:* Use a table or clear list.
      *   *Answer:* Write in a persuasive academic voice.

  *(Word Count Check for Model Answer)*: I need to be careful not to write too little or too much. I will draft and then count/adjust.
