answer: |-
  Were David Hume to be roused from his eternal slumber in Edinburgh and presented with the modern doctrine known as "Humean Supervenience" or the "Best System Analysis" of laws, his reaction would be a mixture of wry amusement, cautious approval, and pointed correction. He would find the rejection of necessary connections deeply congenial, yet he would likely chastise his modern successors for forgetting the psychological roots of his skepticism.

  Here is a reconstruction of how Hume would reply to the modern account, followed by an analysis of where his original definitions diverge from the doctrine and where he would cast his vote.

  ### The Reconstruction of Hume's Reply

  "I am told that in your age, my name is affixed to a doctrine which claims that the laws of nature are nothing more than the axioms of the deductive system that best balances simplicity and strength in describing the totality of particular facts. You say there are no necessary connections in the objects themselves, and that the 'governing' power of a law is a fiction. On these central points, you have my hearty agreement.

  When I examined the operations of cause and effect, I found no impression of power or necessity in the objects. I saw only one event following another. If your 'mosaic of occurrent facts' is simply a grander way of describing this succession of distinct existences, then you are on solid empirical ground. To posit a law that exists *over and above* these facts, possessing a modal force that compels nature to behave in a certain way, is to indulge in the very scholastic mysticism I sought to purge from philosophy.

  However, I must caution you against the language you use. You speak of 'deductive systems' and 'axioms' as if they possess a reality independent of the human understanding. You seek to save the objectivity of laws by reducing them to a logical optimization of the mosaic. But I ask you: for whom is this system 'best'? Simplicity and strength are virtues relative to a mind seeking to comprehend. A system does not summarize itself; it is summarized by an intellect.

  If you claim that laws are real because they are theorems of the best system, you risk reifying a method of calculation into a feature of the world. For me, the 'law' is not merely a logical summary; it is a habit of the mind. When you strip away the necessity from the objects, do not forget to place it squarely in the subject. If your account suggests that the 'law' exists even if no mind were there to systematize the mosaic, you have slipped back toward the dogmatism you claim to reject. The necessity is not in the axioms; it is in the feeling of expectation those axioms produce in us."

  ### Divergences on the Two Definitions of Cause

  To understand where the historical Hume would part ways with the modern "Humean," we must look closely at his two definitions of cause and how they map onto the Best System Analysis (BSA).

  **1. Divergence from the First Definition (Constant Conjunction)**
  Hume's first definition states that a cause is "an object, followed by another, and where all the objects similar to the first are followed by objects similar to the second." This aligns closely with the BSA's "mosaic" of non-modal facts. Both views agree that the raw data of the universe is just a distribution of local particulars.

  *   **The Divergence:** However, the modern BSA introduces a criterion of *systematization* (simplicity and strength) that Hume did not explicitly formulate. For Hume, constant conjunction is observed directly through repetition. For the modern Humean, a law might be accepted even if it covers unobserved cases, provided it fits the best system. Hume might view this as a subtle reintroduction of inference beyond experience. While he would agree that we *must* project regularity to function, he would be wary of the claim that the "best system" determines the truth of the law. For Hume, the truth of the causal claim is limited to the observed conjunction; the extension to a universal axiom is a product of custom, not a logical feature of the mosaic itself.

  **2. Divergence from the Second Definition (Customary Transition)**
  Hume's second definition defines a cause as "an object followed by another, and whose appearance always conveys the thought to that other." This is the psychological core of his philosophy: causation is a sentiment of the mind, a determination of thought born of habit.

  *   **The Divergence:** This is the sharpest point of friction. The modern Humean account attempts to provide an objective account of laws without recourse to psychology. They want laws to be mind-independent summaries (the "Best System" is what it is, regardless of who is looking). Hume would argue this is impossible. Without the "customary transition" of the mind, there is no necessity, and without necessity, there is no "law" in any meaningful sense—only a list of events. By focusing on the logical structure of the system (axioms and theorems), modern Humeans risk neglecting the *feeling* of necessity that Hume identified as the only locus of modality. Hume would argue that a "law" without a mind to expect the future from the past is merely a pattern, not a law.

  ### The Verdict: Humean or Anti-Humean?

  Despite these divergences, if forced to choose between the modern "Humeans" (who deny necessary connections and supervene laws on the mosaic) and the "Anti-Humeans" (who posit governing laws, dispositions, or necessary connections in nature), the historical Hume would unequivocally come down on the **Humean side**.

  His reasoning would be as follows:

  1.  **Empiricism:** The Anti-Humean claim that laws "govern" or possess "modal force" implies an observation of power that Hume proved we never experience. To claim there is a necessary connection in nature is to claim knowledge we cannot possess.
  2.  **Ontological Parsimony:** Hume's razor cuts away any entity that does not derive from an impression. The "mosaic" consists of impressions (or copies thereof). "Governing laws" do not. Therefore, the Humean mosaic is the only ontologically respectable picture.
  3.  **The Status of Necessity:** While Hume would critique the moderns for potentially objectifying the "system," he would agree with them that the necessity is not *in the objects*. The Anti-Humean places necessity in the world; the Humean places it in the description (or the mind). Hume must side with the latter.

  **Conclusion**
  David Hume would endorse the modern Humean rejection of necessary connections as a victory for empiricism. However, he would issue a final caveat: do not mistake the map for the territory. The "Best System" is a tool of the human understanding, a sophisticated expression of our customary transitions. Laws are real only insofar as they are useful summaries for creatures like us, not because they are the axioms of a divine logic. He would stand with the Humeans against the necessitarians, but he would remind them that the "Humean" in "Humean Supervenience" was a skeptic first, and a metaphysician second.
