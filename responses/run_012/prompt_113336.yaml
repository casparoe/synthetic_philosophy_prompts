prompt: |-
  David Hume died in 1776, nearly two centuries before the debate in which his name became an -ism. Imagine you could set before him the modern Humean account of laws of nature: that laws are nothing over and above the axioms or theorems of whichever deductive system best balances simplicity and strength in summarizing the total mosaic of occurrent, non-modal facts, and that there are no necessary connections in nature for a law to govern. Reconstruct the reply Hume would give. In particular, identify where his own treatment of causation—above all his two definitions of cause, one in terms of constant conjunction and the other in terms of the mind's customary transition from cause to effect—would diverge from this doctrine, and say whether the historical Hume would come down on the Humean or the anti-Humean side concerning the reality of laws. Answer in American English.
