answer: |-
  # The Logical Space of the Demandingness Objection

  **ROOT QUESTION:** What is the core complaint of the demandingness objection?

  ├── **A. The Decision Procedure**
  │   (Is the complaint that a conscientious agent cannot psychologically sustain the required mental calculations?)
  │   │
  │   └── *[No required position fits here]*
  │       *(Standard responses include Rule Consequentialism or Subjective Consequentialism, but none are listed in the required leaves.)*
  │
  ├── **B. The Overridingness of Moral Reasons**
  │   (Is the complaint that moral reasons should not always defeat non-moral reasons?)
  │   │
  │   └── **LEAF:** A view that agrees consequentialism is too demanding but concludes only that morality is not overriding.
  │
  └── **C. The Criterion of Rightness**
      (Is the complaint that the theory defines 'right action' too strictly?)
      │
      ├── **Q1:** Is the intuition that sacrificing a **relationship** is too costly a bias to be debunked?
      │   ├── **Yes** → **LEAF:** A view that treats the demandingness intuition as a bias to be debunked rather than a datum.
      │   └── **No** → **Q2**
      │
      └── **Q2:** Does what is required of me change because others fail their **marginal contribution to a collective rescue**?
          ├── **Yes** → **LEAF:** A version on which what is required of me is relaxed because others are not doing their share.
          └── **No** → **Q3**
              │
              └── **Q3:** Must I bear **ongoing small costs** indefinitely rather than stop at a **single ruinous one**?
                  ├── **No** (Stop at 'good enough') → **LEAF:** A satisficing version.
                  └── **Yes** (Maximise) → **Q4**
                      │
                      └── **Q4:** If an **agent is already badly off relative to others**, does the term 'ought' cease to apply?
                          ├── **Yes** → **LEAF:** A scalar version that abandons ought altogether.
                          └── **No** → **Q5**
                              │
                              └── **Q5:** May I weight my own projects more heavily than the impersonal good?
                                  ├── **Yes** → **LEAF:** A version granting the agent a prerogative to weight their own projects more heavily.
                                  └── **No** → **LEAF:** A maximising act-consequentialism that simply accepts the demands.

  ***

  ### Analytical Notes on the Tree Structure

  **1. Unseparated Leaves**
  *   **Maximising Act-Consequentialism vs. Debunking View:** While the tree separates these via **Q1**, practically they often converge. Both prescribe the same actions; they differ only on whether the agent's resistance is a moral error (Maximising) or a psychological illusion (Debunking). The tree treats them as distinct meta-ethical responses to the intuition.

  **2. Unoccupied Combinations**
  *   **The Decision Procedure Branch:** None of the required leaves occupy Branch A. This is not because the view is incoherent, but because the required list focuses on modifications to the *criterion* or *authority* of morality, rather than the *method* of decision-making.
  *   **Scalar + Prerogative:** The tree forces a choice between **Q4** (Scalar) and **Q5** (Prerogative). A view combining these is logically possible (one might abandon 'ought' *and* claim projects matter), but it is unexplored in the required list. Typically, if 'ought' is abandoned (Scalar), a 'prerogative' to violate it becomes incoherent.
  *   **Satisficing + Prerogative:** The tree routes Satisficing (**Q3**) separately from Prerogative (**Q5**). In reality, these are often combined (a agent-centred prerogative to satisfice). The tree separates them to isolate the logical modifications to 'maximisation' versus 'weighting'.

  **3. Forced Distinctions**
  *   **Compliance vs. Individual Duty:** **Q2** isolates the collective compliance condition. This separates views that tie individual duty to collective outcomes from those that hold agents responsible regardless of others' failure (e.g., an agent who is already badly off relative to others must still give, unless the view is Scalar).

  ***
  *Prepared for Graduate Seminar on Normative Ethics | British English Convention*
