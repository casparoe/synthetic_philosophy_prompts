answer: |-
  # Specification for Dynamic Belief Revision on Uncertain Evidence

  ## 1. Context and Operational Constraints
  This specification governs the design of a belief update rule for an agent receiving evidence from an instrument. The following conditions are binding constraints derived from the operational environment, not merely theoretical preferences:

  *   **Input Format:** Evidence arrives as a probability distribution $q$ over a partition $\mathcal{E} = \{E_1, \dots, E_n\}$ of the possibility space, not as a certain proposition.
  *   **Calibration Drift:** The instrument's reliability is not fixed. The semantic meaning of a reading (its correlation with the truth) is itself a hypothesis the agent updates based on sequences of readings.
  *   **Sequential Arrival:** Evidence arrives in a temporal sequence.
  *   **Variable Granularity:** The partition $\mathcal{E}$ over which a reading is expressed varies between reports (sometimes coarse, sometimes fine), and the agent may not know the exact granularity in advance.

  ## 2. Desiderata for the Update Rule
  The following list enumerates the properties an adequate update rule $R(P, q) \to P'$ must satisfy. Each desideratum includes the motivating consideration and a verdict on its normative status within this specification.

  | ID | Desideratum | Motivation | Verdict |
  | :--- | :--- | :--- | :--- |
  | **(1)** | **Certain Limit:** If the evidence distribution $q$ assigns probability 1 to a single cell $E_k$, the posterior must match standard Conditionalization on $E_k$. | **Generalization:** An account of uncertain evidence must extend, not contradict, the standard account of certain evidence. | **Non-negotiable** |
  | **(2)** | **Probabilistic Coherence:** The posterior $P'$ must be a valid probability function over the same algebra as the prior $P$. | **Synchronic Rationality:** Beliefs must avoid Dutch Books and satisfy Kolmogorov axioms at all times. | **Non-negotiable** |
  | **(3)** | **Fallibilism:** If the evidence $q$ is uncertain (no cell has $q(E_i)=1$) and the prior $P(H) < 1$, the posterior $P'(H)$ must not equal 1. | **Uncertainty Preservation:** Uncertain input should not generate dogmatic certainty, especially given calibration drift. | **Non-negotiable** |
  | **(4)** | **Rigidity (Invariance):** For every cell $E_i$ in the evidence partition, $P'(H \mid E_i) = P(H \mid E_i)$ for all hypotheses $H$. | **Separability:** The evidence bears only on the probabilities of the partition cells, not on distinctions within them. | **Camp Preference** (Jeffreyan) |
  | **(5)** | **Minimality:** The posterior $P'$ should be the probability function closest to $P$ (e.g., by KL-divergence) among those satisfying the evidence constraints. | **Conservatism:** Beliefs should change only as much as the evidence strictly forces. | **Camp Preference** (MaxEnt) |
  | **(6)** | **Commutativity:** For two successive reports $q_1$ and $q_2$, updating on $q_1$ then $q_2$ yields the same posterior as $q_2$ then $q_1$. | **Path Independence:** Rational belief should not depend on the accidental temporal order of information arrival. | **Non-negotiable** (given Sequences) |
  | **(7)** | **Idempotency:** If a report $q$ is received and processed, receiving the identical report $q$ again yields no further change. | **Stability:** Once evidence is absorbed, repetition provides no new information. | **Non-negotiable** |
  | **(8)** | **Recoverability:** The prior $P$ is uniquely recoverable from the posterior $P'$ and the evidence $q$. | **Information Preservation:** The update process should not irretrievably erase the history of belief states. | **Camp Preference** (Formalists) |
  | **(9)** | **Partition Invariance:** The posterior does not depend on whether the same information is expressed over a coarse or fine partition. | **Representation Independence:** Belief change should depend on semantic content, not syntactic granularity. | **Non-negotiable** (given Variable Granularity) |
  | **(10)** | **Zero-Prior Robustness:** The rule is defined even if the evidence assigns positive probability to an event the agent previously ruled out ($P(E_i)=0$). | **Dogmatism Avoidance:** Agents must be able to recover from erroneous certainty if the instrument is sufficiently reliable. | **Non-negotiable** |
  | **(11)** | **Self-Reference Consistency:** The rule is uniquely determined even when the report concerns the agent's own posterior (e.g., "Your posterior for H will be 0.8"). | **Reflective Coherence:** The rule must avoid paradoxes arising from fixed-point constraints. | **Non-negotiable** |
  | **(12)** | **Calibration Sensitivity:** The magnitude of the update must be modulated by the agent's current estimate of the instrument's reliability. | **Drift Accommodation:** Given calibration drift, the raw distribution $q$ cannot be treated as a hard constraint on $P'$. | **Non-negotiable** (given Drift) |

  ## 3. Analysis of Incompatibilities

  No known update rule satisfies all twelve desiderata simultaneously. The following conflicts are structural and unavoidable.

  ### A. The Rigidity Trilemma: (4), (6), and (9)
  This is the most significant impossibility result for uncertain evidence (Diaconis & Zabell, 1982).
  *   **Conflict:** You cannot jointly satisfy **Rigidity (4)**, **Commutativity (6)**, and **Partition Invariance (9)** when partitions differ.
  *   **Why:** Rigidity fixes conditional probabilities within evidence cells. If two reports arrive over incompatible partitions (one coarse, one fine), enforcing Rigidity for the first report constrains the posterior in a way that makes the second report's Rigidity constraint path-dependent. To achieve Commutativity across different partitions, one must allow the evidence to alter conditional probabilities within the cells (violating Rigidity).
  *   **Resolution:** Given the scenario specification (Variable Granularity and Sequences), **(4) Rigidity must be abandoned**. The rule must be holistic, allowing evidence about the partition to update beliefs about the internal structure of the partition cells.

  ### B. The Drift Constraint: (4) vs. (12)
  *   **Conflict:** **Rigidity (4)** is incompatible with **Calibration Sensitivity (12)**.
  *   **Why:** Rigidity assumes the evidence *only* affects the probabilities of the partition $\mathcal{E}$. However, if the instrument's calibration drifts, a reading $q$ provides evidence about the *state of the instrument*. Since the instrument's state may correlate with the world state $H$ independently of the partition cell $E_i$ (e.g., a drifting sensor might systematically over-report $E_1$ when $H$ is true), learning about the instrument's reliability changes $P(H \mid E_i)$.
  *   **Resolution:** The scenario specification makes **(12) Non-negotiable**. Therefore, **(4) Rigidity is excluded by the problem statement itself.**

  ### C. Recoverability vs. Standard Dynamics: (8) vs. (1), (4), (5)
  *   **Conflict:** **Recoverability (8)** is incompatible with almost all standard dynamic rules, including Conditionalization and Jeffrey Conditionalization.
  *   **Why:** Standard update rules are many-to-one mappings. Multiple different priors can result in the same posterior given the same evidence (e.g., if the evidence swamps the prior). Reversing the function to find a unique prior requires the update to preserve information that standard probability kinematics discards.
  *   **Resolution:** This is a **Camp Preference**. Satisfying (8) requires moving to non-standard frameworks (e.g., ranking theory or specific information-theoretic embeddings) that may violate (1) or (2).

  ### D. Zero Priors and Standard Ratios: (10) vs. Standard Conditionalization
  *   **Conflict:** **Zero-Prior Robustness (10)** is incompatible with the standard ratio definition of conditional probability used in (1).
  *   **Why:** Standard Conditionalization divides by $P(E)$. If $P(E)=0$, the operation is undefined.
  *   **Resolution:** This requires the rule to use a primitive notion of conditional probability (e.g., Popper functions) or an infinitesimal framework, rather than the Kolmogorov ratio definition.

  ## 4. The Most Exclusionary Requirement

  **Requirement (6): Commutativity.**

  While Requirement (4) (Rigidity) is the most philosophically contentious and Requirement (12) (Calibration) is the most specific to this scenario, **Commutativity (6)** is the single requirement that excludes the largest class of mathematically distinct candidate rules found in the literature.

  1.  **Exclusion of Jeffrey Conditionalization:** Standard Jeffrey Conditionalization satisfies Commutativity *only* if the partitions of the successive reports are compatible (i.e., they commute under intersection). Since the specification mandates variable granularity (coarse vs. fine) where the agent is unsure of the partition, standard JC fails (6) in the general case.
  2.  **Exclusion of Weighted Updates:** Many proposed solutions to the drift problem involve "weighting" the new evidence against the prior (e.g., $P' = (1-w)P + wP_{JC}$). Unless the weighting scheme is specifically designed as a geometric mixture in log-odds space, simple linear weighting fails Commutativity on sequences.
  3.  **Exclusion of Holistic Rules:** Most rules that abandon Rigidity to satisfy Calibration Sensitivity (12) do so by introducing auxiliary variables (e.g., "Instrument State"). Unless the update on these auxiliary variables is strictly constrained, the order of updates regarding the instrument and the world will affect the final posterior.

  To satisfy Commutativity in the context of variable partitions and uncertain reliability, the rule must typically adopt a specific functional form (often involving logarithmic pooling or specific constraints on the likelihood ratios of the evidence). This mathematical stricture filters out the vast majority of ad-hoc or heuristic update proposals.

  ## 5. Summary of Specification Verdicts

  *   **Hard Constraints (Must Haves):** (1), (2), (3), (6), (7), (9), (10), (11), (12).
  *   **Discarded Constraints (Cannot Haves):** (4). (Rigidity is incompatible with the Scenario's Drift and Variable Partition constraints).
  *   **Optional Constraints (Nice to Haves):** (5), (8). (Minimality and Recoverability are desirable for specific theoretical camps but not required for rational coherence in this context).

  **Final Directive:** The selected update rule must prioritize **Commutativity (6)** and **Calibration Sensitivity (12)** over **Rigidity (4)**. It must treat evidence reports as likelihoods over instrument states rather than direct constraints on world probabilities, ensuring that the order of arrival and the granularity of the report do not alter the final rational degree of belief.
