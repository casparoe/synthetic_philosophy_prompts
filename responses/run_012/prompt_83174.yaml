  2.  **Deconstruct *De Senectute* (Cato Maior):**
      *   *Structure:* Cato answers four charges against old age.
          1.  Withdraws us from active life/public affairs. -> Reply: We guide by counsel/authority.
          2.  Weakens the body. -> Reply: Use reason/mind instead of strength.
