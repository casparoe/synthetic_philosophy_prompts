answer: |-
  Here is an analysis of your colleague's jurisprudence, the competing rules, and a prediction for the next case.

  ### The Record and the Confound
  Your colleague's record so far presents a classic problem of **confounded variables**. In every past case, the formal qualities of the norm (publicity, clarity, prospectivity) have aligned perfectly with its substantive moral quality (justice, rights-protection).
  *   **Cases 1 & 3:** Failed on Form (unpublished/retroactive/vague) **and** Substance (property stripping/arbitrary detention). Verdict: **Not Law**.
  *   **Cases 2 & 4:** Passed on Form (public/prospective/clear) **and** Substance (public health/taxation). Verdict: **Law**.

  Because Form and Substance have never diverged in her rulings, we cannot yet know which criterion is doing the work. The new case breaks this alignment: it is Formally Perfect but Substantively Wicked.

  ### Rule 1: The Formal Virtues (Procedural Natural Law)
  This rule follows the tradition of **Lon Fuller**. It posits that law has an "inner morality" consisting of eight procedural desiderata (generality, publicity, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy, and congruence between official action and declared rule). If a norm fails these, it fails to be law. If it meets them, it is law, regardless of its substantive justice.

  *   **Prediction:** **Law.**
  *   **Reasoning:** The new case is "formally impeccable." It is validly enacted, published, prospective, general, and clear. It satisfies Fuller's inner morality. While it is morally repugnant, a Fullerian would argue it is a "wicked law," but still law. The colleague's ruling on Case 3 (the vague statute) supports this: vagueness is a formal defect that prevents a norm from guiding conduct, which is why she ruled it "not law."

  ### Rule 2: The Substantive Moral Floor (Substantive Natural Law)
  This rule follows the tradition of **Gustav Radbruch** (and classical natural law). It posits that there is a necessary connection between law and morality. While minor injustices do not void legal validity, norms that violate a "moral floor" (extreme injustice, denial of basic human rights) cease to be law. This is often called the **Radbruch Formula**.

  *   **Prediction:** **Not Law.**
  *   **Reasoning:** The new case revokes citizenship and authorizes indefinite detention for a named minority. This violates fundamental human rights and constitutes extreme injustice. Under the Radbruch Formula, "positive law, secured by legislation and power, takes precedence even when its content is unjust and fails to benefit the people, unless the contradiction between the positive law and justice reaches such an intolerable degree that the law, as 'flawed law,' must yield to justice."

  ### The Bet: Substantive Moral Floor
  I would bet that she will rule the new case is **Not Law**.

  **Why?**
  While Case 3 (the vague statute) looks like a victory for the Formalists, the description of her verdict emphasizes the *consequence*: "in practice licensed arbitrary detention." A strict Fullerian would strike down a vague statute even if it produced benevolent results, because vagueness destroys the *function* of law (guiding conduct). By highlighting the *detention*, she signals that the substantive harm matters.

  Furthermore, the framing of your seminar is "whether a **morally defective** norm still counts as law." If she were a strict Formalist, the answer would be trivial for this new case (Form is perfect, therefore it is Law). The pedagogical weight of the seminar suggests she is testing the limits of the Radbruch Formula. Her previous "Not Law" verdicts protected individuals from state overreach (property in Case 1, liberty in Case 3). The new case is the ultimate state overreach. Consistency in protecting rights suggests she will prioritize substance over form when the two diverge radically.

  ### Rule 3: Inclusive Positivism (Incorporationism)
  A third rule fits her record equally well: **Inclusive Positivism**.
  This view (associated with Hart's later followers like Jules Coleman) holds that law is ultimately a matter of social sources (the Rule of Recognition), but that the Rule of Recognition *can* incorporate moral criteria as conditions of validity.

  *   **Fit with Record:** In many modern legal systems, the "Rule of Recognition" (e.g., the Constitution) includes formal requirements (no vagueness, no retroactivity) *and* substantive rights (due process, equal protection).
      *   Cases 1 & 3 were "Not Law" because they violated constitutional constraints (formal and substantive) incorporated into the system's validity criteria.
      *   Cases 2 & 4 were "Law" because they met all systemic criteria.
  *   **Prediction for New Case:** **Not Law.** (Assuming the legal system's Rule of Recognition includes a bill of rights that this statute violates).

  ### The Distinguishing Case
  If my bet is correct, the Formal Rule is eliminated. We are left distinguishing between **Substantive Natural Law** (Rule 2) and **Inclusive Positivism** (Rule 3). Both predict "Not Law" for the current case, but for different reasons. Natural Law says morality is a *necessary* condition of law; Inclusive Positivism says morality is a *contingent* condition (only because our specific system says so).

  **The Further Case:**
  Present her with a scenario where the legal system is **amended** to explicitly authorize the injustice.
  *   *Scenario:* The Constitution is amended by a supermajority to explicitly state: "The legislature may revoke citizenship and detain specific minorities without trial." The statute is then re-enacted in perfect accordance with this new amendment.

  **The Divergence:**
  *   **The Inclusive Positivist** must rule **Law**. Since the Rule of Recognition (the Constitution) has changed to incorporate this moral permission, the moral constraint is removed. Validity tracks the social source, which now permits the injustice.
  *   **The Substantive Natural Lawyer** must rule **Not Law**. For the Natural Lawyer, the moral constraint is necessary and universal. No amount of positive enactment can make extreme injustice into law. "An unjust law is no law" remains true even if the constitution says otherwise.

  This case would reveal whether her commitment to morality is a feature of *this* legal system (Positivism) or a feature of *Law itself* (Natural Law).
