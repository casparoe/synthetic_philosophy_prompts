prompt: |-
  Ok so I need to write a research proposal by Friday for this small interdisciplinary grant — it's philosophy-of-science flavoured but the panel is mostly biologists plus one historian, so it has to be legible to people who don't live in Popperworld. My half-formed idea, which I've been chewing on with a couple of people from my old reading group (we did the demarcation stuff last winter and never really stopped arguing about it): everyone knows Popper classified Darwinism as a metaphysical research programme rather than a testable scientific theory, and basically everyone treats that as him demoting it, or at least being a bit snide about it. But rereading him I think the label is doing something stranger than that. In his own picture, metaphysical research programmes aren't junk — they're the soil that testable theories grow out of, they're assessed by fruitfulness rather than by truth, and they're supposed to be rationally criticizable even where they can't be falsified. So my suspicion is that in his system the classification is actually a promotion, not a demotion — but that if you read it that way you owe an account of how the programme itself is rationally appraised, and that's precisely the thing he never spells out. He also seems to have half-walked it back later, I think in the autobiography, saying natural selection is testable after all, which I find a little sus, like he just got tired of being yelled at by biologists.

  What I want from you: turn this into a two-page proposal. State the question so it has a determinate answer — something in the neighbourhood of: given Popper's own account of how research programmes are rationally appraised, is the metaphysical-research-programme classification of Darwinism a demotion or a promotion, and what follows for how the programme itself should be criticized? Then say why the existing camps each leave it open — the ones who take Popper to be dissing Darwin, the ones who take the recantation at face value and close the file, and the ones who think the whole demarcation project is a dead end and so think the question is moot. Then the method: what I'd actually do over six months, month by month, assuming I'm not doing archival work and can't read German, and why that method rather than just, like, arguing harder about what Popper really meant. Say what a result would look like, and what would count as the project failing or turning out to be unanswerable rather than just me having a bad time. And give me an honest read on scope — is this a real project or am I inflating a footnote into a grant. One thing: don't put in citations, I'll add those myself, and please don't invent any — refer to positions and arguments by description instead. Also the review commitee has apparently rejected two previous proposals for being too vague about deliverables, so be concrete about what I'd hand them at the end.
