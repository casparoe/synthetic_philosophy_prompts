      *   *Rule 9:* In case of conflict, the later rule prevails.
      *   *The Move:* Pass a new Rule 7 via Majority (violating old Rule 7). If it passes, did it violate the rule it was changing? If Rule 9 says "Later prevails," then the new Rule 7 stands. But the old Rule 7 said "You can't do this." So the act of passing it was invalid *according to the rules at the time of the vote*. But the new rule says it *was* valid. This is the self-amendment paradox.

