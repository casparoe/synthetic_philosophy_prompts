          *   *Simpler for Game:* Rule 12 says "Later rules override earlier rules." This is the kill switch. If I pass a new Rule 6 saying "Rule 7 is repealed," Rule 12 says the new rule wins. But Rule 7 said "You can't repeal me." Who decides? The Chair. The Chair's authority comes from the Rules. Circular.

