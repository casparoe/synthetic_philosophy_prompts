      *   I need to ensure the ruleset allows this specific knot to be tied within 90 minutes.
      *   *Key Mechanic:* The "Amendment Rule" must be amendable by the "Ordinary Rule" threshold, but claim to protect itself.
      *   *Rule 6:* Proposals pass by majority vote.
      *   *Rule 7:* Proposals altering Rule 6 require a 2/3 vote.
