  # PAGE 3: FACILITATOR NOTES
  *(Keep this for yourself. Do not distribute.)*

  ### 5. HANDLING INSTRUCTIONS: THE THREE MOMENTS

  **A. The First Contradiction**
  *   **Scenario:** The Clerk refuses to write a rule because it violates an existing rule; the Chair says it passed.
  *   **Action:** Do not solve it. Ask the Chair: *"On what authority do you order the Clerk?"* Ask the Clerk: *"On what authority do you refuse?"*
  *   **Truth:** The rules do not decide this. Power decides this. Let them feel the gap.

  **B. The Validity Challenge**
  *   **Scenario:** A player claims, *"That vote was invalid because we broke Rule 5."*
  *   **Action:** Ask the group: *"Who decides validity? The rules? Or the people enforcing the rules?"*
  *   **Truth:** If the rules decide, which version of the rules? The old ones or the new ones? If the people decide, they are outside the law.

  **C. The Authority Realization**
  *   **Scenario:** The group realizes the Chair has no power except what they give him, but they need him to decide what power he has.
  *   **Action:** Stay silent. Let the silence grow.
  *   **Truth:** This is the loop. The system rests on a fact (we are here) not a rule (we are allowed to be here).

  ### 6. DEBRIEF SCRIPT (15 Minutes)
  *Do not lecture. Ask these questions in order. Write key words on the board.*

  1.  **Pedigree:** "When Rule 3 was passed, was it valid because the *content* was good, or because the *process* was followed?"
  2.  **The Loop:** "At Minute 50, did we use the old rules to make the new rules, or the new rules to validate the old rules?"
  3.  **Entrenchment:** "When we voted to repeal Rule 6, did Rule 6 stop us? If not, why did it exist?"
  4.  **Validity vs. Success:** "Was the vote at Minute 60 *legal*? Was it *effective*? Are those the same thing?"
  5.  **The Foundation:** "If we had voted to abolish this room, would we have stopped? Who would have enforced that?"
  6.  **The Paradox:** (Use this word only now) "Did you feel the moment the logic started biting its own tail? That is the paradox of self-amendment. A system cannot lift itself by its own bootstraps, yet it must."

  ### 7. PREDICTABLE FAILURES & REMEDIES

  **Failure 1: Paralysis by Pedantry**
  *   **Symptom:** The Objector objects to every word. Nothing gets voted on.
  *   **Remedy:** At Minute 30, announce: *"The Chair may overrule frivolous objections."* This shifts power to the Chair, accelerating the crisis.

  **Failure 2: The Tyrant**
  *   **Symptom:** One player (often a lawyer) dominates the Chair and interprets rules to win.
  *   **Remedy:** Remind the Participants: *"You have the power to overturn the Chair by 2/3 vote."* Watch if they use it.

  **Failure 3: Apathy**
  *   **Symptom:** The group accepts contradictions without arguing.
  *   **Remedy:** As Facilitator, play the Objector yourself if the assigned one fails. *"Wait, didn't Rule 5 say 2/3?"*

  ### 8. LIMITATIONS: WHAT THIS CANNOT REPRODUCE

  *   **Time:** Real constitutions bind the dead to the living. This session ends in 90 minutes. *Tell them:* "In reality, you cannot just leave this room. The rules would follow you tomorrow."
  *   **Stakes:** Here, failure means a bad novel scene. In reality, failure means war or poverty. *Tell them:* "You played nicely because no one would lose their house. Real conventions have guns outside."
  *   **Exit:** You can quit this game. Citizens cannot easily quit a state. *Tell them:* "The ultimate authority of a legal system is that you cannot opt out. You felt free to stop. They are not."
  *   **Practice:** A legal system works because officials *agree* to make it work. Today, you were strangers. *Tell them:* "Law is not just text. It is the habit of officials treating the text as true. You didn't have time to form that habit."
