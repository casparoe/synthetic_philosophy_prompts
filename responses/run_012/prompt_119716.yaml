answer: |-
  **Joint Statement on the Presumption of Preservation: An Adversarial Collaboration**

  **Signatories:** Elena Vance (Burkean), Samir Patel (Reformer)
  **Facilitated by:** Alex Chen, Chair, Philosophy Club
  **Date:** May 24, 2024

  **Introduction**
  Over the course of the academic year, the undersigned have debated the normative force of the principle known as "Chesterton's Fence." We began with incompatible intuitions regarding the burden of proof in institutional reform. This document represents the culmination of our adversarial collaboration. It does not record a resolution, but rather a map of the terrain we now share. We have agreed to distinguish between what we know, where we diverge, and what evidence would be required to change our minds.

  ### I. Agreed Claims
  *We affirm the following propositions as true, rejecting the notion that our dispute is merely semantic or that our premises are wholly disjointed.*

  1.  **Function vs. Description:** We agree that the "Handrail Case" (where a railing served as a structural brace) demonstrates that an institution's stated purpose can be a misdescription of its actual function. Consequently, a reformer's ability to satisfy the stated purpose of a rule with a new mechanism does not prove the old rule was obsolete.
  2.  **The Visibility Asymmetry:** We agree that an asymmetry of evidence exists: the costs of the status quo are often visible and immediate, while the benefits of a "fence" (disasters prevented) are counterfactual and invisible. We disagree on the direction of the bias this creates (see Section II), but we agree that neither side's evidence base is neutral.
  3.  **The Empty Ritual Exception:** We agree that the "Empty Ritual" (a rule whose only function is to mark membership in a group that no longer exists, imposing costs on outsiders) constitutes a valid exception to any general presumption of preservation. A fence without a fence-keeper is not a fence; it is debris.
  4.  **Adaptive Testimony:** We agree that the "Adaptive-Testimony Problem" is real: people's stated attachment to an arrangement is partly produced by the arrangement itself. We further agree that this cuts both ways: it undermines testimony *for* the fence (habituation) and testimony *against* the fence (internalized oppression or normalization of harm) equally.
  5.  **Preservation implies Investigation:** We agree that a significant portion of our verbal dispute stems from the definition of "preservation." The Burkean accepts that "preservation" entails a mandatory period of investigation before removal. The Reformer accepts that "removal" entails a mandatory assessment of hidden functions. Our disagreement is not about *whether* to investigate, but about the **default action** if investigation yields no clear answer.

  ### II. Residual Disagreements
  *The following table outlines the substantive disagreements that remain after accepting the claims above. Each statement is phrased to be acceptable to the holder of the view and recognizable as fair by the opponent.*

  | Topic | Burkean Position (Vance) | Reformer Position (Patel) |
  | :--- | :--- | :--- |
  | **Ignorance as Evidence** | Our ignorance of a fence's purpose is itself evidence that a purpose exists, because complex systems evolve functions that are not immediately legible to current observers. | Ignorance is a null value. The fact that we do not know why a fence exists is not evidence that it serves a function; it is merely evidence that the record is lost. |
  | **Burden of Proof** | The burden lies on the party proposing removal to demonstrate that the fence is *not* serving a hidden function, because the cost of error (structural collapse) is irreversible. | The burden lies on the party maintaining the fence to demonstrate that it is *not* causing harm, because the cost of error (continued suffering) is ongoing and compounding. |
  | **Orphaned Fences** | For an "orphaned fence" (purpose lost to history), the presumption of preservation should remain strong, as the loss of records increases the likelihood that the function was complex and non-obvious. | For an "orphaned fence," the presumption should lapse. Without beneficiaries to defend it, the fence is likely a relic, and the burden should shift to those who wish to keep it. |
  | **The Fence Register** | A "Fence Register" (requiring a reason and a demolition bond for removal) is a necessary operationalization of caution to ensure the remover internalizes the risk of unintended consequences. | A "Fence Register" acts as a tax on the injured. The bond requirement ensures that only the wealthy can afford to remove harmful rules, calcifying the status quo regardless of merit. |

  ### III. Cruxes and IV. Empirical Tests
  *We have identified three cruxes—sub-questions such that settling one would move at least one of us toward the other's position. For each crux, we propose a specific test or argument and record our predictions in advance.*

  **Crux 1: The Epistemic Value of Ignorance**
  *Question:* Does the inability to state a fence's purpose count as evidence that a purpose exists?
  *   **Burkean View:** Yes. In complex social systems, opacity correlates with depth of function.
  *   **Reformer View:** No. Opacity correlates with obsolescence.
  *   **The Test:** A blind audit of 50 "orphaned" institutional rules (documented as existing for >50 years with no clear contemporary rationale). Each is investigated for 10 hours. If no function is found, it is removed.
  *   **Predictions:**
      *   **Vance:** Predicts that in >60% of cases where no function was found within 10 hours, a negative consequence (structural or social) will manifest within 2 years of removal.
      *   **Patel:** Predicts that in >90% of such cases, no negative consequence will manifest, or any consequence will be minor and easily reversible.

  **Crux 2: The Regress Point**
  *Question:* Is the Chesterton Principle itself a "fence"?
  *   **The Argument:** The instruction to "know a purpose before removing a fence" is itself an inherited rule of reasoning. If the principle applies to itself, do we need to know *its* purpose before we discard it?
  *   **The Test:** We will apply the Chesterton Principle to the "Fence Register" proposal (see Crux 3). If the Register causes harm, does the Principle forbid removing the Register until we know why it was put up?
  *   **Predictions:**
      *   **Vance:** Argues the Principle is a "meta-fence" (a heuristic) rather than an institutional rule. She predicts that discarding the Principle will lead to a net increase in catastrophic reform errors across the school's history.
      *   **Patel:** Argues the Principle is an institutional rule like any other. He predicts that adhering to the Principle in cases of visible harm (like the Empty Ritual) will produce measurable, unnecessary suffering that outweighs the prevented errors.

  **Crux 3: The Procedural Proposal (The Fence Register)**
  *Question:* Does a demolition bond protect the community or privilege the status quo?
  *   **The Proposal:** Any member proposing the removal of a standing club rule must post a bond, forfeited if a specified harm appears within one year.
  *   **The Test:** We propose this Register be adopted for the Philosophy Club's own bylaws for the next academic year.
  *   **Predictions:**
      *   **Vance:** Predicts that the bond will slow down the removal of rules, resulting in fewer "Handrail Cases" (accidental structural damage) and that no bond will ever be forfeited because the caution will prevent the error.
      *   **Patel:** Predicts that the bond will deter the removal of at least one harmful rule solely because the proposer cannot afford the risk, and that the "specified harm" will be defined by the status quo defenders to ensure forfeiture.

  ### V. Contingency for Unsettlable Cruxes
  *We acknowledge that Crux 1 (The Epistemic Value of Ignorance) may not be fully settleable within our lifetimes, as "negative consequences" can always be debated as to whether they were caused by the removal or by external factors.*

  **Agreed Protocol:** In the event that empirical evidence remains ambiguous, we agree that the disagreement ought to be conducted as a **presumption of proportionality**.
  1.  If the cost of the fence is low and the risk of removal is high (e.g., safety protocols), the Burkean presumption holds.
  2.  If the cost of the fence is high (e.g., human dignity, exclusion) and the risk of removal is uncertain, the Reformer presumption holds.

  We sign this statement not to end our debate, but to ensure that our future arguments build upon this foundation rather than repeating the past year's errors.

  __________________________
  **Elena Vance**

  __________________________
  **Samir Patel**

  __________________________
  **Alex Chen, Chair**
