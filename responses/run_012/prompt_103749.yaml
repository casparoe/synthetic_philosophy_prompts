answer: |-
  Here is the audit of your friend's claim.

  ### 1. The Correspondence Table
  To test if signage/manuals constitute a "language," we must map linguistic structures to their pictorial equivalents.

  | Linguistic Component | Pictorial Equivalent (Signage/ISOTYPE) | Status of Mapping |
  | :--- | :--- | :--- |
  | **Word (Lexeme)** | Icon / Symbol (e.g., stick figure, shirt icon) | **Partial.** Icons are holistic; they rarely break down into smaller meaningful units (phonemes/morphemes). |
  | **Sentence** | Spatial Arrangement / Sequence (e.g., Figure + Arrow + Door) | **Weak.** Order matters less than proximity. No clear "subject-predicate" structure. |
  | **Syntax** | Layout, Color, Size, Overlap | **Limited.** Rules exist (red = stop/danger), but they are ad-hoc, not recursive. |
  | **Proposition** | The Instruction or Fact Conveyed (e.g., "Exit is here") | **Functional.** It conveys a state of affairs, but usually imperative, not declarative. |
  | **Truth-Condition** | Correspondence with Physical Environment | **High.** The sign is "true" if the exit is actually there. |
  | **Meaning (Semantics)** | Convention / Usage | **High.** Meaning is assigned by agreement, not inherent in the image. |

  **Audit Verdict:** The mapping holds for *reference* (pointing at things) and *imperatives* (do this), but dissolves when moving to *propositional logic* (asserting complex facts).

  ---

  ### 2. Where the Mapping Breaks (Structural Deficits)
  Your friend argues that if a claim can't be drawn, it wasn't worth asserting. This is a radical form of **Verificationism**. Here is where the pictorial system structurally fails to match verbal capacity.

  *   **Negation:** A red slash through a cigarette means "No Smoking." But does it mean "It is forbidden to smoke" or "There is no smoking here"? It cannot easily express "It is not the case that X," which allows for counterfactuals. You cannot draw "The cat is *not* on the mat" without drawing the cat elsewhere, which changes the meaning to "The cat is on the sofa."
      *   *Confidence: High.*
  *   **Disjunction (Either/Or):** How do you draw "Take the bus *or* the train"? If you draw both, it implies "And." If you draw a question mark, it implies uncertainty, not logical disjunction.
      *   *Confidence: High.*
  *   **Conditionals (If-Then):** IKEA manuals imply conditionals ("If you have Part A, attach to Part B"), but they rely on the user inferring the logic from the sequence. There is no pictorial symbol for "If." Flowcharts use diamonds, but those are abstract symbols, not pictures.
      *   *Confidence: High.*
  *   **Quantifiers (All/Some):** ISOTYPE handled statistics well (1 icon = 1 million people). But it struggles with logical quantifiers. A row of ten men icons looks like "Ten men." It does not clearly distinguish "All men are mortal" from "Some men are mortal."
      *   *Confidence: Medium-High.* (ISOTYPE had conventions for this, but they were clunky compared to syntax).
  *   **Tense:** Pictures are inherently present tense. To show the past, you need a clock icon or an arrow (symbols). To show the future, same. A pure picture cannot distinguish "He ate" from "He eats" without smuggling in symbolic conventions.
      *   *Confidence: High.*
  *   **Modality (Might/Must):** "Must" is easy (exclamation mark/bold). "Might" or "Could have" is nearly impossible visually without resorting to symbolic abstraction (dotted lines, question marks).
      *   *Confidence: High.*
  *   **Abstract Entities:** You can draw a scale for "Justice," but that is a metaphor, not a picture of the concept. You cannot draw "Inflation" (you draw a balloon or rising graph, which are symbols). You cannot draw an "Electron" (you draw a model, which is a theory, not the thing).
      *   *Confidence: High.*
  *   **Particular vs. General:** This is the biggest break. A drawing is *analog*; it contains infinite detail. A drawing of a cat shows a specific color, pose, and lighting. Language is *digital*; the word "cat" strips all that away to isolate the concept. To make a picture general, you must stylize it (turn it into a symbol), which moves it away from being a "picture" and toward being a "word."
      *   *Confidence: High.*

  ---

  ### 3. The "Smuggled-In" Context Argument
  Your friend claims signage proves pictures can stand alone. This ignores the **parasitic nature** of pictorial systems.

  *   **The Scaffolding:** Airport signage works because you have already been linguistically trained to know what a "toilet" is, what "travel" is, and what an "emergency" is. The picture merely triggers a pre-existing linguistic category.
  *   **The Fallback:** If an IKEA manual is ambiguous, you ask a human (words) or read the small print (words). If a picture language were truly standalone, there would be no fallback.
  *   **Closed vs. Open Systems:** Signage works in a "closed world" (the airport, the wardrobe). The possible meanings are limited by the physical context. Natural language operates in an "open world" where context cannot be assumed.
      *   *Confidence: High.*

  ---

  ### 4. The "Defect" Claim (Verificationism)
  Your friend claims: *"If a claim can't be drawn, it wasn't worth asserting."*

  *   **The Self-Refutation:** This claim itself cannot be drawn. You cannot draw "Only drawable claims are valid." Therefore, by its own standard, the claim is not worth asserting.
  *   **The Loss of Power:** Verbal language allows us to discuss things that *do not exist* (unicorns), things that *cannot exist* (square circles), and *normative ethics* (why torture is wrong). Pictures show *what is* (or what looks like what is); they struggle to argue *why*.
  *   **Neurath's Actual View:** Neurath did not believe pictures replaced words. He believed they made knowledge *democratic*. He wanted to bypass the "metaphysical fog" of complex jargon, not eliminate complex thought.
      *   *Confidence: High.*

  ---

  ### 5. Fairer Comparison: What Was Neurath Actually After?
  Your friend is treating Neurath's ISOTYPE as a **Natural Language Replacement**. It was not.

  *   **Fairer Comparison:** **Musical Notation** or **Mathematical Notation**.
      *   Music notation is visual and universal, but it doesn't replace speech. It handles a specific domain (sound/time) with high precision.
      *   Math notation is visual and universal, but you cannot write a love letter in algebra.
      *   **ISOTYPE** was a **Visual Statistics Notation**. It was designed to compare populations, production, and resources across language barriers. It was a tool for *education and sociology*, not a replacement for philosophy, law, or poetry.
      *   **Verdict:** Signage proves pictures are excellent **interfaces**, not **languages**.
      *   *Confidence: Medium-High.* (Interpretive risk regarding Neurath's ultimate hopes).

  ---

  ### 6. Confidence Audit

  | Section | Confidence Level | Notes |
  | :--- | :--- | :--- |
  | **Correspondence Table** | **95%** | Standard semiotic analysis. The mapping gaps are well-documented in linguistics. |
  | **Structural Breaks** | **98%** | The inability of images to handle negation, tense, and logical operators without symbolic smuggling is a robust philosophical consensus. |
  | **Smuggled Context** | **95%** | Pragmatics of signage rely heavily on prior linguistic/cultural training. |
  | **The "Defect" Claim** | **99%** | The Verification Principle was abandoned by the Vienna Circle itself for being self-refuting. |
  | **Fairer Comparison** | **85%** | **<-- LEAST SURE.** While ISOTYPE was definitely for statistics/education, Neurath was a utopian. He *hoped* it might transform social understanding more broadly than just "notation." Drawing the line between "tool for education" and "proto-language" is interpretive. |

  ### Summary Verdict
  Your friend is right that pictures are **underrated** and that Neurath was onto something vital about visual cognition. She is wrong that signage constitutes a **language**. Signage is a **code** that relies on a linguistic substrate to function.

  Pictures are superior for **recognition** and **comparison** (ISOTYPE statistics). Words are superior for **negation**, **abstraction**, and **argument**. A system that claims to do only the former is not a defect; it's a specialization. But claiming it makes the latter obsolete is a category error.

  **Final Confidence:** **90%** (Dragged down slightly by the interpretive nature of Neurath's utopian ambitions).
