answer: |-
  You have done something quite difficult: you have intuitively rediscovered a central problem in game theory and welfare economics without the technical vocabulary. Your suspicion is correct—the "sunk-cost fallacy" is often the wrong frame for what you are describing. That term implies a cognitive error (a bug in the brain), whereas the situations you describe often arise from perfectly rational actors trapped in a specific structure of incentives (a bug in the game).

  The "proper carving" you are looking for is best understood as a family of concepts. The specific mechanism is the **War of Attrition**. The broader economic category is **Rent-Seeking**. The logical structure is a **Social Trap** (specifically, a type of Prisoner's Dilemma played out over time).

  Here is the breakdown of the concept, its edges, and the specific feature that makes it work.

  ### 1. The Core Mechanism: The War of Attrition
  In game theory, the scenario you described—where two or more parties compete for a prize by incurring costs over time, and the one who persists longest wins—is called a **War of Attrition**.

  *   **How it fits your cases:**
      *   **The Strike:** The union and the company both lose money every day (costs). The one who can endure the pain longest gets the contract terms they want (prize).
      *   **The Legal Dispute:** Both sides pay lawyers hourly (costs). The one who doesn't settle wins the land (prize).
      *   **The Auction:** While often modeled as a "Dollar Auction," a bidding war where you pay to stay in the bidding is functionally a War of Attrition.

  *   **How it differs from the Dollar Auction:**
      The **Dollar Auction** (invented by economist Martin Shubik) is a specific, parlor-trick version of this. Its unique rule is that the *second-highest* bidder must pay their bid but gets nothing. This creates a specific panic: "If I quit now, I lose my bid; if I bid one more dollar, I might win."
      *   **Your cases:** In your legal and strike examples, *everyone* pays their own costs regardless of who wins. You don't pay the other side's fees; you just burn your own. This makes it a standard War of Attrition, not necessarily a Dollar Auction. The Dollar Auction is a subset of the War of Attrition with sharper teeth.

  ### 2. The Economic Outcome: Rent-Seeking
  You noted that "the total that all of them have spent is larger than the thing was ever worth." In economics, this is the definition of **Rent-Seeking**.

  *   **Definition:** Rent-seeking occurs when entities spend resources to compete for a fixed pool of wealth without creating new wealth.
  *   **The Waste:** If two people fight over a \$100 bill, and they spend \$60 each on legal fees to determine who gets it, \$120 of value was destroyed to move \$100 of value. Society is poorer by \$20.
  *   **The "Shrinking Prize":** You mentioned cases where "the fight itself consumes" the prize. This is a **Dissipative Contest**. In a pure War of Attrition, the prize is fixed (e.g., the land exists regardless). In a dissipative contest (e.g., a civil war, or a strike that bankrupts the company), the value of the prize degrades as the fighting continues. This accelerates the trap.

  ### 3. The Rationality Question: Sunk Cost vs. Rational Escalation
  This is your most important insight. You asked: *Is the sunk-cost fallacy the wrong frame?*

  **Yes, it is.** Here is the distinction:

  *   **Sunk-Cost Fallacy (Psychological):** "I have spent \$500, so I must spend another \$10 to make that \$500 worth it." This is irrational reasoning. The \$500 is gone regardless.
  *   **Rational Escalation (Game Theoretic):** "I have spent \$500. The prize is \$1,000. My opponent has spent \$500. If I spend \$10 more, there is a 60% chance they will quit, and I win \$1,000. The expected value of spending \$10 is positive."

  In a War of Attrition, continuing to bid can be the **Nash Equilibrium** (the optimal strategy given what the other player is doing). If both players are rational, they calculate the *marginal* cost of the next step against the *marginal* probability of the opponent quitting.

  As long as the cost of the *next* step is smaller than the prize, it is mathematically rational to take that step, even if the *total* accumulated cost has already passed the prize value. The past money is irrelevant to the calculation; only the future money matters. This is why the "Sunk Cost" label is misleading. The actors aren't reasoning badly about the past; they are trapped by the incentives of the future.

  ### 4. The "Single Feature" Doing the Work
  You asked which single feature is the engine of this trap, and which feature, if removed, would dissolve it.

  The engine is **The Decoupling of Marginal Decisions from Total Outcomes.**

  At any single moment ($t$), the decision is: *Pay small amount $x$ for a chance at Prize $P$.*
  Because $x$ is small and $P$ is large, the answer is "Yes."
  However, the game is structured so that you must make this decision repeatedly, and the sum of all $x$'s can exceed $P$.

  **The Feature to Remove:**
  To dissolve the trap, you must remove the **Incremental Nature of Commitment.**

  If the rules required you to commit to the *total* expected cost upfront, the trap would vanish.
  *   *Example:* In the legal dispute, if the judge said, "You must deposit \$50,000 in escrow right now to litigate this \$10,000 land dispute," neither party would enter.
  *   *Example:* In the strike, if the union had to pay the company's lost profits upfront before striking, they wouldn't strike.

  The trap exists because the costs are **pay-as-you-go**. This allows the "boiling frog" effect: no single step looks fatal, but the sequence is.

  ### 5. Summary of the "Carving"

  Here is how to distinguish the terms you encountered:

  | Concept | What it is | Does it fit your cases? |
  | :--- | :--- | :--- |
  | **War of Attrition** | **The Mechanism.** A game where players compete by enduring costs over time; the last one standing wins. | **Yes.** This is the precise structural name for the strike and legal dispute. |
  | **Dollar Auction** | **A Variant.** A specific game where the top *two* bidders pay, but only the top one wins. | **Partial.** Fits the auction, but your other cases involve everyone paying their own costs, not the runner-up paying the winner's bid. |
  | **Rent-Seeking** | **The Economic Effect.** Spending resources to capture wealth rather than create it, resulting in net social loss. | **Yes.** This describes the *outcome* (total spend > prize value). |
  | **Sunk-Cost Fallacy** | **The Psychological Error.** Continuing because you hate wasting past investment. | **No.** As you suspected, this implies irrationality. In your examples, continuing is often the rational strategic move. |
  | **Escalation of Commitment** | **The Organizational Behavior.** The tendency of groups to throw good money after bad. | **Yes, but vague.** This is the management/psychology label for the phenomenon, but it doesn't explain *why* the incentives exist. |

  ### 6. How the Trap Dissolves
  You asked what would let the trap dissolve. Based on the "Incremental Commitment" feature, here are the three ways to break it:

  1.  **Binding Agreements (Collusion):** If the competitors can talk and trust each other, they agree not to enter the contest at all. (This is why cartels are illegal; it's why unions and companies are encouraged to bargain in good faith).
  2.  **Third-Party Arbitration:** Remove the contest mechanism. A judge decides who gets the land based on title, not on who spent more on lawyers. This removes the incentive to out-spend the opponent.
  3.  **Costly Signaling / Transparency:** In many Wars of Attrition, the fight continues because neither side knows how much the other can afford. If both sides knew perfectly that "This land is worth \$10k to both of us," neither would spend \$11k. The fight is fueled by **asymmetric information** about the opponent's limit.

  ### Conclusion
  You have identified a **War of Attrition** driven by **Rent-Seeking** incentives.

  It is distinct from the Sunk-Cost Fallacy because the behavior can be **rationally optimal** at every step, even though the **cumulative outcome** is disastrous. The essential feature is the **incremental structure of the costs**, which allows rational actors to walk past the point of no return one small, sensible step at a time. To stop it, you must change the rules so that the total cost must be considered before the first step is taken.
