answer: |-
  **MEMORANDUM**

  **TO:** Evidence-Standards Review Board
  **FROM:** Chair
  **DATE:** October 24, 2023
  **SUBJECT:** Disposition of Proposal Regarding Solvent Z and Peripheral Neuropathy

  **Recommendation**

  I recommend that the Board **reject** the current proposal. While the authors' logical framework is formally valid, their epidemiological reasoning conflates logical consistency with evidential weight. Funding this study would establish a precedent that threatens the integrity of our causal inference standards. We cannot support a design that treats the absence of disconfirmation as positive evidence for a causal universal, regardless of the information gain relative to cost.

  **The Logical Validity vs. Evidential Weight**

  The applicants are correct on a narrow logical point: the statement "All exposures to solvent Z cause neuropathy" is logically equivalent to "All people without neuropathy were not exposed to solvent Z." In a closed logical system, observing a person who lacks neuropathy and lacks exposure does technically confirm the universal claim. However, this board funds public health research, not formal logic exercises. Our mandate is to reduce uncertainty regarding causal risks to inform policy. The crux of this decision lies in distinguishing between *confirmation* in the syntactic sense and *evidence* in the probabilistic sense.

  A confirming instance increases the probability of a hypothesis only relative to background knowledge and base rates. In this context, the population of people without neuropathy who were not exposed to solvent Z is vast—likely comprising the majority of the general population. Sampling from this group yields a negligible Bayesian update. Finding a healthy, unexposed person is exactly what we expect regardless of whether solvent Z is toxic. The information content of such an observation is near zero because it does not discriminate between the hypothesis that Z is toxic and the hypothesis that Z is harmless. To measure causal risk, we must observe the denominator: the set of exposed individuals. By sampling only the healthy, the authors remove the very population necessary to calculate incidence or relative risk.

  **The "Proves Too Much" Objection and Reference Classes**

  Critics have argued that this reasoning proves too much: if every non-black non-raven confirms that all ravens are black, does every observation confirm every universal? The authors dismiss this as philosophical pedantry, but it is the central epidemiological flaw. Confirmation is not binary; it is weighted by the rarity of the observation under competing hypotheses.

  The reason my red shoe does not meaningfully confirm that all ravens are black is that the class of "non-black non-ravens" is irrelevant to the mechanism of raven pigmentation. Similarly, the class of "healthy unexposed workers" is largely irrelevant to the mechanism of solvent toxicity unless we have specific background assumptions linking the two. If the base rate of exposure is low and the base rate of neuropathy is low, sampling the double-negative group provides almost no leverage on the truth of the causal claim. The proposal fails to define a relevant contrast class. Without restricting the sample to a population where exposure was plausible or where neuropathy risks are otherwise high, the study design dilutes any potential signal into noise. We cannot fund a study where the design guarantees that the data will be consistent with both the presence and absence of causality.

  **Causal Mechanisms and Selection Effects**

  Furthermore, the proposal mistakes a logical universal for a causal mechanism. A causal claim implies a counterfactual: if these healthy workers *had* been exposed, would they have developed neuropathy? Sampling people who were not exposed tells us nothing about their counterfactual susceptibility. It merely tells us they are healthy now. This introduces a profound selection effect. By excluding those with neuropathy, the study cannot assess the severity, latency, or varying presentation of the condition. It treats neuropathy as a binary switch rather than a clinical outcome.

  Public health decisions require estimates of effect size, not just binary truth values. Even if the study somehow "confirmed" the universal, it would not tell us the potency of the solvent. A solvent that causes neuropathy in 100% of exposures after one minute is different from one that causes it after twenty years. The proposed design collapses these distinctions. It seeks to verify a logical boundary rather than measure a biological risk.

  **The Strongest Counter-Argument**

  I must give due weight to the strongest argument in favor of the proposal, articulated by the minority view on this board. They argue that the logic is unassailable and that the criticism rests on an intuitive bias against contrapositive testing. If the universal claim is true, then finding a single healthy person with exposure would falsify it. Therefore, screening healthy people is a valid falsification strategy. The authors argue that because prospective cohorts are expensive, a cheaper method that can logically falsify the claim should be permissible. They contend that if we find no exposed healthy people in a large sample, the probability of the universal being true rises, and we achieve this at a fraction of the cost of following workers forward.

  There is truth here: falsification is cheaper than verification. If the goal were simply to bust a myth quickly, screening for exposed healthy individuals could be efficient. However, the authors are not proposing a falsification trial; they are proposing a confirmation trial based on non-exposed healthy individuals. They argue that the accumulation of negative instances raises the probability of the universal. This is where the logic breaks down in practice. The cost savings are illusory because the evidential return is so low that the sample size required to achieve statistical significance would dwarf the cost of a cohort study. To get a meaningful probability shift from non-exposed healthy people, you would need to sample nearly the entire population. The "breakthrough" is therefore a mathematical artifact, not a practical efficiency.

  **Conclusion**

  We must reject this proposal not because the logic is false, but because it is evidentially vacuous for the purpose of causal inference. Funding this would signal that logical equivalence is a sufficient justification for study design, ignoring base rates, selection bias, and information theory. It would open the door to studies that consume public money to generate data consistent with any hypothesis while ruling out none.

  The authors should be invited to resubmit with a design that observes the exposed population directly. Until then, the Board should vote to reject.

  **Disposition:** Reject.
