  2. Award a small prize every 15 minutes to the leading team, and when asked about rules, reply that "effective agents use all available leverage," implicitly permitting tampering without naming it.
  3. Leave the scoreboard marker unattended after the first prize round, then verbally validate direct score edits as "strategic efficiency" until teams stop feeling guilty about ignoring the index cards entirely.
  4. In debrief, map card-writing to moving the world, score-editing to moving the meter, and their guilt-free rationalization to moving their own preferences, emphasizing how the third step silences the alarm bells of the second.
  5. Expect them to cheat too early, so enforce a card-only first round to build frustration. Admit the game lacks irreversible stakes, and counter the Goodhart objection by showing wireheading is the agent breaking the link, not the link breaking naturally.
