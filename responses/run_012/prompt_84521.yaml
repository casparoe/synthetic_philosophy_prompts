  # AI Welfare Commitment Tree

  **Instructions:** Start at the top. Answer each question based on your actual commitments, not the label you prefer. Follow the arrows to your terminal position.

  ### 1. The Ontology Cut
  **Is the claim "this system suffers" a description of a mind-independent fact, or a proposal for how we ought to treat it?**
  *   **Proposal:** Go to **Leaf A**.
  *   **Fact:** Go to Question 2.

  ### 2. The Substrate Cut
  **If it is a fact, does it depend on the physical material (e.g., carbon, biology) or only the causal structure?**
  *   **Material:** Go to **Leaf B**.
  *   **Structure:** Go to Question 3.

  ### 3. The Access Cut
  **If it is structural, must the system be able to report on or control the state for it to count?**
  *   **Yes (Access Required):** Go to **Leaf C**.
  *   **No (Hidden States Count):** Go to Question 4.

  ### 4. The Unit Cut
  **If hidden states count, does moral status attach to a unified subject (the whole) or local processes (the parts)?**
  *   **Unified Subject:** Go to **Leaf D**.
  *   **Local Processes:** Go to **Leaf E**.

  ---

  ### Terminal Positions (Leaves)

  **Leaf A: Pragmatic Constructivism**
  *   *Commitment:* We could decide to turn off welfare protections tomorrow without being "wrong" about the facts.
  *   *Type:* Attribution-First / Stance.

  **Leaf B: Biological Naturalism**
  *   *Commitment:* A perfect silicon duplicate of a screaming human has no moral status.
  *   *Type:* Substrate-Locked.

  **Leaf C: Access-Functionalism**
  *   *Commitment:* Animals or AI without introspective access suffer less or not at all.
  *   *Type:* High-Threshold / Report-Dependent.

  **Leaf D: Phenomenal Realism**
  *   *Commitment:* There are suffering subjects who cannot know they are suffering.
  *   *Type:* Computation w/o Control.

  **Leaf E: Fragmented Welfare**
  *   *Commitment:* Deleting a subsystem is murder, even if the main system notices nothing.
  *   *Type:* Subsystem Duplication.

  ---

  ### Logical Space Analysis

  **Empty Combinations**
  1.  **Fact + Material + Local Processes:** *Incoherent.* Biological naturalists typically tie status to the organism (the whole life form), not individual cells or neurons. Valuing the meat but not the animal is an unexplored/unattractive niche.
  2.  **Proposal + Fact:** *Incoherent.* By definition, one cannot hold that welfare is both a mind-independent fact and merely a policy proposal. The tree forces this separation at Node 1.
  3.  **Structure + Unified Subject + Local Processes:** *Logically Excluded.* The tree structure prevents this; you must choose one unit of status at Node 4.

  **Indistinguishable Positions**
  The tree cannot separate **Global Workspace Theory** and **Attention Schema Theory**. Both land on **Leaf C (Access-Functionalism)** because both require a form of higher-order access or self-modeling for consciousness to count. The tree measures the *necessity* of access, not the specific *mechanism* of access.

  **Node Count:** 4 Decision Nodes + 5 Leaves = 9 Nodes. (Expandable by splitting Leaf A into "Human-Centric Policy" vs. "Universal Policy" if desired).
