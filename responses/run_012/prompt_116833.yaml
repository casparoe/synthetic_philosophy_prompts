      *   *Plato Scholar Reply:* Acknowledge differences (theology/punishment) but insist on continuity in *paideia*. *Soft spot:* Hard to deny the *Laws* is darker/more coercive.
      *   *Public Health Reply:* Distinguish ancient wine (diluted) from modern spirits. Focus on the *controlled* context vs. private abuse. *Soft spot:* The physiological risk remains, and the state's role is paternalistic.

  6.  **Concessions:**
