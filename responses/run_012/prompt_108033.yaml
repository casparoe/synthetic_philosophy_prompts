  Ok so a guy in my reading group has this accounting analogy for the special sciences and I can't tell if it's actually doing any work or just sounding sober. Physics is the transaction ledger — every event that happens is a line item; chemistry, biology, psychology are the quarterly reports you compile off the ledger. Profit is real, you can predict with it, argue about it, and it can even push back on what the ledger is allowed to say — but nothing gets added to the world by profit over and above the transactions. He runs this straight into: no strong emergence, no downward causation, higher-level laws are just compressed descriptions, "levels" are levels of description and not levels of being, and anyone saying the whole is more than the parts is doing bad bookkeeping.

  How far does it actually hold? Give me the correspondence table first — ledger, line item, report, double-entry rules, the accountant, the auditor — then the places it breaks, and be picky about which breaks matter for his conclusion and which are just the usual "all analogies are imperfect" noise. Things I suspect are load-bearing and I want your read on: who writes the reports and whether that matters, whether a coarse-grained story can constrain the fine-grained one (the demon stuff), whether there's more than one legitimate way to do the accounting, and whether "real but not extra" is even one single thing. Does his conclusion survive with the disanalogies on the table, does anything in the analogy actually cut the other way, and if you'd swap it for a better analogy that does the same job, what would it be. Also flag it if part of what he's doing is seperate questions getting merged, I defintely can't tell from the way he argues it.

  Finish with a last line that reads exactly: Verdict: holds / holds only in weakened form / collapses.
