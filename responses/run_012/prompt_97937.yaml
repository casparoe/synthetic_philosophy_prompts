  Plurality (1) and Runoff (4) occupy a middle ground you find acceptable. Here, the ballot is too coarse to capture full truth anyway (only one choice). Strategically voting for a viable compromise isn't felt as "lying" because the system doesn't promise to record your full preference order. It asks "Which one?" and you answer "The best available one." The lie is structural, not personal. You aren't falsifying data the system asked for; you are optimizing within a blunt instrument.

  This navigates Gibbard-Satterthwaite. That theorem proves any *ordinal* ranking rule with three+ options is manipulable or dictatorial. Your preferred systems (Approval, Median) escape this because they are not ordinal ranking rules. Approval uses cardinal thresholds; Median assumes single-peaked preferences on a spectrum. They change the input type to bypass the theorem. Thus, your principle isn't empty, nor does it force dictatorship. It demands systems where the input method (cardinal/threshold) protects truth-telling better than ordinal ranking. The cost is that these systems require specific conditions (like single-peakedness) to remain fully strategy-proof, but in a board game group, "how long we play" is naturally single-peaked, making Median robust. The principle holds: avoid ordinal ranking when cardinal or single-dimensional inputs are possible.

  - "Where my cases force a choice"
  To maintain a clean principle, you must reconcile your tolerance for Plurality (1) with your disdain for Borda (2). Both are manipulable. Your distinction rests on "ballot capacity." In Plurality, you cannot express your favorite if it's non-viable, so voting compromise feels like adaptation, not deception. In Borda, you *can* express your favorite, but choose to bury it.

  However, if your core principle is "do not make me lie," Plurality actually fails harder. It forces you to silence your favorite entirely. Borda lets you speak, but tempts you to shout false notes. For consistency, you should admit Plurality is flawed because it suppresses preference expression, even if it doesn't feel like "cheating." Alternatively, you must accept that all non-dictatorial rules involve some strategic calculation, and the "cheating" feeling is just discomfort with complex optimization. If you choose the former, Plurality joins Borda in the "flawed" bin, leaving Approval and Median as the only "honest" options. This sacrifices simplicity for integrity. You cannot have it both ways: either strategic silence is lying (condemn Plurality) or strategic ranking is fine (excuse Borda).

  - "Two cases I didn't list"
  Veto voting functions as negative Borda. You vote against one option. Strategically, you shouldn't veto your true least favorite if they aren't a threat; you should veto the frontrunner you dislike most. This forces you to lie about which game you oppose to influence the winner. It creates the same "burying" dynamic as Borda, just inverted. You might veto a game you tolerate to save a game you love. This violates your honesty principle similarly to Case 2.

