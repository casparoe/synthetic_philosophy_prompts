  - "Confidence and the weak spot"
  I am highly confident in the game theory analysis (why Approval/Median escape Gibbard-Satterthwaite). I am least sure about the psychological distinction you draw between Plurality and Borda; whether "structural silence" feels different from "active falsification" is subjective and may not hold under scrutiny.
