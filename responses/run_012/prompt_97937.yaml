prompt: |-
  Ok, so my friend and I just spent like two hours argueing about this and I need an outside read. Background: I'm in a board game group of six and we're forever picking which game to play (or where to eat), and we keep cycling through different ways of deciding. My friend is a "every voting rule gets gamed, just deal with it" guy and I kept insisting some rules are fine and some genuinely feel like cheating. We got nowhere. Here's what I actually think, case by case:

  1. Plain plurality — everyone names one game, most votes wins. Say there are three real options and one of them is everybody's second choice. I'll vote for that compromise even though my favorite is something else, because my favorite has no shot. That's fine? I do it without thinking and I don't feel like I lied.

  2. Borda count — rank all the games, points by rank. I rank a game I actually kind of like dead last, because it's the frontrunner and I want to bury it. This one feels like cheating. Genuinely. I'd be embarrassed to read my ballot out loud.

  3. Approval voting — check every game you'd be happy with. I honestly can't see how I'd game this. It's my favorite of the bunch.

  4. Two-round runoff — top two after round one, then head to head. In round one I vote for a longshot I know can't win, purely to knock the frontrunner out of the runoff. Definitely gaming it. But I still think runoff is a fine way to decide.

  5. Coin flip between the two most-voted games. Nobody can game a coin flip. I also think it's a dumb way to decide anything that matters.

  6. My friend just picks, since it's his house. Nobody can game that either. Obviously not acceptable.

  7. A single sliding-scale thing, like how long we play or how spicy the food is — everyone states a number, we take the middle one. I can't do better than saying my honest number, and I think it's a great way to decide.

  So my hunch at a principle is this: what bothers me isn't being "gamed," it's being made to lie about my preferences. Plurality only asks for one name, so picking the viable one isn't a lie. Borda asks me to rank everything, so burying a game I like is a lie. Approval asks me to check the boxes I'd honestly check anyway. That seems to do alot of work. But it can't be the whole story, because the coin flip and "my friend just picks" involve zero lying and I still think they're terrible. And I have a vague memory of some theorem — Gibbard-Satterthwaite? — that any rule with three or more options is either gameable or a dictatorship, which makes me worry my "just don't make me lie" thing is either empty or secretly just the strategy-proofness condition, and then I'm stuck defending dictatorship.

  So: is there a principle that gets cases 1-7, or close? Is it my lying principle plus something, and what's the something? I have a feeling the answer is going to tell me I'm wrong about approval voting. Also tell me what it says about two rules I haven't listed: veto voting (everyone votes *against* one game, fewest votes against wins) and intensity voting (we each say how much we care, 0-100, and ballots get weighted by that — which I suspect just invites me to lie about how much I care).

  Also please say how confident you actually are in what you claim, and single out the one point you're least sure about.

  Format it like this, roughly:
  - "The cases, restated" — a few lines, just so we're on the same page.
  - "The principle" — the main chunk, ~400 words, stated precisely with each clause tied to whichever case motivates it.
  - "Where my cases force a choice" — ~200 words, i.e. which of my seven verdicts has to go if I want a clean principle.
  - "Two cases I didn't list" — ~200 words on the veto and intensity rules.
  - "Confidence and the weak spot" — short.
