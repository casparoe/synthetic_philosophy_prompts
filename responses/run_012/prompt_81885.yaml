answer: |-
  # JOINT STATEMENT ON THE CURRENCY OF DISTRIBUTIVE JUSTICE
  **An Adversarial Collaboration**

  **Signatories:** 
  *The Resourcist Representative* 
  *The Capabilities Theorist Representative*

  **Date:** October 24, 2023

  ### Preamble
  After two years of dialectical engagement, we acknowledge that while our theoretical frameworks diverge on the ultimate metric of justice, we share a common commitment to human dignity and the mitigation of arbitrary disadvantage. This statement delineates our common ground, isolates our substantive disagreements, and proposes empirical test cases to clarify the practical implications of our divergence.

  ### I. Shared Commitments
  We jointly affirm the following propositions as the baseline for any acceptable theory of distributive justice:

  1.  **The Instrumentality of Resources:** Material resources (income, wealth, primary goods) possess no intrinsic value; they matter only as means to enable individuals to pursue their conceptions of the good.
  2.  **Human Heterogeneity:** Individuals possess different "conversion factors" (physical, social, and environmental). Consequently, two people commanding the same bundle of resources will inevitably achieve very different levels of well-being and freedom.
  3.  **Sensitivity Requirement:** Any acceptable metric of justice must be sensitive to these conversion differences. A metric that ignores the fact that a disabled person requires more resources to achieve the same mobility as an able-bodied person is demonstrably inadequate.
  4.  **Rejection of Welfarism:** Neither of us advocates for the maximization of subjective utility alone. Justice is not satisfied merely by making people feel happy if they are unfree or deprived.

  ### II. Residual Disagreements
  While we share the commitments above, we diverge on the *locus* of egalitarian concern. Each side articulates its remaining position as follows:

  *   **The Resourcist Position:** Justice requires that individuals be compensated for brute bad luck regarding their *endowments*, but they must bear responsibility for their *preferences* and how they utilize their endowments. The metric must remain neutral between different conceptions of the good life. Therefore, the currency of justice is an equal share of all-purpose means, adjusted only for involuntary deficits in internal or external assets, not for differences in how those assets are spent to generate satisfaction.
  *   **The Capabilities Position:** Justice requires that individuals possess substantial *freedom* to achieve valuable functionings. Because resources are merely means, focusing on them fetishizes the instruments rather than the human life. The metric must track the substantive opportunities available to a person. Therefore, the currency of justice is the expansion of the capability set, ensuring that individuals are not merely given tools, but are effectively empowered to use them to live lives they have reason to value.

  ### III. Cruxes and Empirical Predictions
  We identify three specific cruxes where our theories yield different policy prescriptions. For each crux, we agree on a concrete case that bears on the issue and record our *a priori* predictions regarding the just outcome.

  #### Crux 1: The Expensive-Taste and Adaptation Objection
  *Issue:* Is the metric fatalistically bound to compensate for preferences formed under deprivation (adaptive preferences), or must it hold individuals responsible for their reported satisfaction?

  *   **Concrete Case: The Deprived Woman.**
      A woman has lived in severe poverty for twenty years. Her options have been strictly limited to domestic labor within her home. Over time, her preferences have adapted; she reports high levels of contentment and claims she desires nothing beyond her current scope. She is offered a job that would expand her options but requires leaving her home environment, which she now finds anxiety-inducing due to her adapted preferences.
      *   **Resourcist Prediction:** If the woman currently commands a fair share of resources (or had the opportunity to acquire them), justice is satisfied. Her reported contentment is irrelevant to the resource metric, but her anxiety regarding new options is a preference she must manage. We predict no specific compensation is owed to alter her psychological state, provided her resource share is fair.
      *   **Capabilities Prediction:** Her contentment is a symptom of oppression, not a marker of justice. Her capability set is severely restricted. Justice requires intervention to expand her substantive freedoms, even if she does not currently value them. We predict a just policy must subsidize the transition to expand her capabilities, disregarding her adapted preferences as unreliable indicators of well-being.

  #### Crux 2: Opportunity (Capability) vs. Achieved Functioning
  *Issue:* Should the metric track the *freedom* to do (real opportunity) or the *actual doing* (achieved functioning)?

  *   **Concrete Case: The Accessibility Budget.**
      A town has a fixed budget to improve mobility. It must choose between: (A) Equal cash grants to all residents (Resource/Opportunity focus), or (B) Targeted conversion subsidies (e.g., ramps, specialized transport) only for residents with mobility impairments (Capability/Functioning focus).
      *   **Resourcist Prediction:** Option A (Cash Grants) is preferable. Targeted subsidies (Option B) violate neutrality by privileging specific functionings (mobility) over others (e.g., a resident might prefer to spend mobility funds on art). Equal resources allow residents to purchase mobility if they value it.
      *   **Capabilities Prediction:** Option B (Targeted Subsidies) is required. Cash grants ignore conversion factors; a disabled resident cannot convert cash into mobility as efficiently as an able-bodied resident. Justice requires ensuring the *functioning* of mobility is accessible to all, necessitating unequal spending to equalize real opportunity.

  #### Crux 3: Positional Goods
  *Issue:* Do capabilities whose value is purely positional (e.g., status, relative wealth) belong in the metric at all?

  *   **Concrete Case: The Status Stipend.**
      A policy proposes subsidizing access to exclusive social clubs to ensure low-income individuals can access the "capability" of social networking, which is valuable only because others are excluded.
      *   **Resourcist Prediction:** Exclude from metric. Positional goods are zero-sum. Distributive justice cannot maximize access to goods that derive value from scarcity. Resources should be spent on non-positional primary goods.
      *   **Capabilities Prediction:** Include conditionally. If social exclusion prevents basic functionings (e.g., employment, political participation), the positional aspect is secondary to the functional necessity. The metric must account for the social basis of self-respect, even if positional.

  ### IV. Identification of the Merely Verbal Dispute
  We explicitly judge the following portion of our dispute to be **merely verbal**:

  *   **The Definition of "Resource."**
      We acknowledge that if the Resourcist defines "resources" to include *all* internal and external assets required to pursue a life plan (including internal powers and conversion factors), the Resourcist metric begins to look identical to the Capabilities metric. Conversely, if the Capabilities Theorist defines "capabilities" strictly as the command over means required to function, the view collapses into Resourcism.
      *   **Judgment:** The argument over whether a "capability" is a distinct category from a "resource" is verbal when the resource bundle is defined broadly enough to include conversion factors. The *substantive* disagreement lies not in the label, but in the **responsibility constraint**: whether the state should compensate for the *cost* of conversion (Capabilities) or only for the *lack* of means (Resourcism).

  ### V. Disagreements Table

  | Feature | Resourcist View | Capabilities View |
  | :--- | :--- | :--- |
  | **Currency of Justice** | All-purpose means (Income, Wealth, Primary Goods). | Substantive freedoms (Capabilities to function). |
  | **Role of Resources** | Intrinsic to the metric (as proxies for freedom). | Instrumental only (valued for what they allow). |
  | **Conversion Factors** | Compensated only if viewed as lack of internal resource. | Central to the metric; must be directly accounted for. |
  | **Adaptive Preferences** | Generally respected as individual responsibility. | Viewed as distortion; often discounted in metric. |
  | **Expensive Tastes** | No compensation (responsibility lies with agent). | Compensation considered if taste affects basic functioning. |
  | **Positional Goods** | Excluded (zero-sum nature). | Included if necessary for social functioning/respect. |
  | **Primary Goal** | Fair distribution of the *tools* of life. | Equalization of the *ability to live* well. |

  ***

  **Signed,**

  _________________________ 
  *Resourcist Representative*

  _________________________ 
  *Capabilities Theorist Representative*
