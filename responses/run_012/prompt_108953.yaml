  *   **3 marks:** Identifies the problem but conflates it with the original sorites or provides a superficial solution.
  *   **1 mark:** Ignores higher-order vagueness.

  **4. Critical Engagement & Argumentation (5 Marks)**
  *   **5 marks (First-Class):** Takes a definite line; acknowledges the costs of the preferred view (e.g., loss of classical logic); avoids mere survey.
  *   **3 marks (Competent):** Surveys positions without committing, or commits without acknowledging costs.
  *   **1 mark:** Purely descriptive rehearsal of theories.

  **Specific Errors Capping Marks at B-Level (Max 17/25)**
  *   **Treating the sorites as a mere puzzle about words:** Fails to engage with the metaphysical stakes (semantic vs. ontic).
  *   **Confusing higher-order vagueness with original vagueness:** Treats the boundary of the boundary as identical to the first boundary.
  *   **Claiming stipulated cutoffs dissolve the paradox:** Asserts that setting a statistical threshold (e.g., 95%) solves the philosophical problem without explaining why this doesn't merely change the subject or invite a new sorites around the threshold.
