answer: |-
  This is a great strategy. The standard "Bank Cases" (like DeRose's) often make Contextualism and Pragmatic Encroachment look identical because they usually vary the *subject's* stakes while keeping the *speaker's* context fixed (or vice versa), leading both theories to predict the same shift in truth value.

  To separate them, we need a **Crossed-Stakes Case**: a scenario where the **Attributor's Context** and the **Subject's Practical Stakes** pull in opposite directions.

  Here is a concrete divergence case using a non-human subject.

  ### The Scenario: The Triage Algorithm and the Janitor

  **The Subject (S):** A Hospital Corporation (specifically, its automated Triage AI System).
  **The Attributor:** A Hospital Janitor.
  **The Proposition (p):** "Patient 402 requires immediate cardiac intervention."
  **The Evidence:** The AI has processed the vitals and returned a 94% probability score. (In medical epistemology, 94% is strong evidence, but for life-or-death decisions, standard protocol usually demands 99%+ certainty before claiming *knowledge* sufficient for action).

  **The Stakes Mismatch:**
  1.  **Subject's Practical Stakes (High):** For the Hospital Corporation, being wrong here means a patient dies and the corporation faces massive liability and loss of license. The practical cost of error is extreme.
  2.  **Attributor's Context (Low):** The Janitor is chatting in the breakroom over coffee. He is not responsible for the patient, faces no liability, and is engaging in casual gossip. His conversational context is "low standards."

  **The Knowledge Claim:**
  The Janitor says: *"The Hospital knows Patient 402 needs surgery."*

  ---

  ### The Verdicts

  #### 1. Epistemic Contextualism (EC)
  *   **Mechanism:** EC holds that the truth conditions of "knows" are determined by the **Attributor's conversational context**. The Janitor is in a low-stakes, casual context. Therefore, the semantic standard for "knows" is low.
  *   **Analysis:** In a breakroom chat, "knows" just means "has really good reason to think." A 94% probability score counts as "really good reason." The high stakes of the Hospital are irrelevant to the *meaning* of the Janitor's word "knows."
  *   **Verdict:** **TRUE.** (The sentence accurately describes the situation relative to the Janitor's low standards).

  #### 2. Pragmatic Encroachment (PE)
  *   **Mechanism:** PE holds that the truth conditions of "knows" are determined by the **Subject's practical situation**. The Hospital Corporation is in a high-stakes situation (life/death, liability). Therefore, the epistemic bar for knowledge is raised.
  *   **Analysis:** Because the cost of being wrong is so high for the Hospital, they need more than 94% certainty to *know*. They need near certainty. Since they only have 94%, they fall short of knowledge, regardless of how casually the Janitor is speaking.
  *   **Verdict:** **FALSE.** (The Hospital does not meet the heightened epistemic standard required by its own high stakes).

  ---

  ### The Non-Human Complication: Does the "Hospital" Have Stakes?

  This is where your constraint (no normal humans) puts pressure on the theories.

  **For Contextualism (EC):**
  The non-human subject is **irrelevant**. EC only cares about the *Janitor's* context. Whether the subject is a human, a hive of bees, or a corporation doesn't change the semantic rules of the Janitor's speech. EC glides right over this.

  **For Pragmatic Encroachment (PE):**
  The non-human subject creates a **metaphysical ambiguity** that threatens the theory's coherence.
  *   **The Problem:** PE relies on the *Subject's* practical interests. But a "Hospital Corporation" is a legal fiction. It doesn't feel pain, fear, or loss.
  *   **The Dilemma:**
      1.  If we say the Corporation *itself* has no stakes (because it's not sentient), then PE collapses. There are no subject-stakes to encroach on the epistemology. The verdict reverts to "True" (standard evidentialism), and PE loses its grip.
      2.  If we say the Corporation's stakes are just the **aggregate stakes of the humans running it** (the doctors, the shareholders), then we have to explain *which* humans count. The doctors have high stakes (patient life), but the shareholders might have low stakes (diversified portfolio).
      3.  If we say the stakes belong to the **patient**, we have changed the Subject. (The Patient isn't the one who "knows" the diagnosis; the Hospital is).

  **Why this breaks PE more than EC:**
  This example is **harder on Pragmatic Encroachment**.
  PE requires a clear link between the *Subject* and *Practical Interests*. With a human subject, this link is intuitive (I care if I die). With a corporate/algorithmic subject, "interests" become derivative. If PE proponents argue that "Corporate stakes are real," they invite accusations of category mistakes. If they argue "Corporate stakes are just human stakes," they have to explain why the *Subject's* stakes matter when the Subject is a shell for other people's interests.

  Contextualism avoids this entirely because it locates the variability in the *Speaker* (the Janitor), who is undeniably a human with a clear conversational context.

  ### Summary
  *   **Case:** Low-Stakes Speaker (Janitor) attributing knowledge to High-Stakes Subject (Hospital AI).
  *   **EC:** **True** (Speaker's low standards dominate).
  *   **PE:** **False** (Subject's high stakes dominate).
  *   **Winner:** **Contextualism** handles the non-human subject more cleanly. Pragmatic Encroachment gets bogged down defining the "practical interests" of a corporation, risking a theoretical breakdown or a messy reduction to human interests.
