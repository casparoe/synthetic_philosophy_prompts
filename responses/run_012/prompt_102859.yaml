      **Audit of Disanalogies**

      1.  **Physicality vs. Abstraction:** This disanalogy is real. The real image is a causal, spatio-temporal event involving light rays; Fregean senses inhabit a "third realm" of abstract objects. Does it matter? For the lecturer's specific point—objectivity and shareability—no. The image demonstrates that something can be distinct from the object and the observer yet remain public. However, it matters for ontology: it risks naturalizing sense into a physical phenomenon.

      2.  **Intentionality:** This is real. An optical image is not intrinsically *about* the moon; it is merely a pattern of light caused by the moon. A sense is essentially a mode of presentation, defined by its intentional content. This matters significantly. If sense is merely a causal imprint, it cannot determine reference uniquely (the problem of non-unique causation). The analogy obscures the normative dimension of sense.

