answer: |-
  1. In the *Ethics*, money is the indispensable convention that renders disparate goods commensurable for just exchange. In the *Politics*, however, the accumulation of money is condemned as an unnatural art that perverts money's function by making it breed itself.
  2. The reconciliation succeeds by distinguishing money's ontological status as a bounded measure of need from its teleological misuse as an unbounded end, which explains the internal logic of the limit rather than merely asserting a contextual boundary. This outperforms the deflationary alternative because it grounds the condemnation in the structure of desire itself, not just in the social location of the activity.
  3. The reconciliation struggles to explain how a purely conventional instrument defined by agreement in the *Ethics* can possess a natural function in the *Politics* that allows its misuse to be deemed unnatural. If money is merely a token of need, the claim that interest violates its nature relies on a substantive realism about value that the conventionalist account undermines.
  4. The pivotal distinction is between money as a medium facilitating the reciprocity of need and money as a terminal object hoarded for its own sake.
  5. The tension becomes fatal if the conventional agreement required for commensurability in the *Ethics* necessarily entails the unlimited accumulation condemned in the *Politics*, making the instrument of justice inherently corrupting.
