      *   **Thesis:** "Alive" is not a binary fact of nature (like "contains carbon") but a conceptual boundary we draw (conceptual pragmatism/nominalism). The definition depends on *who* is asking and *why*.
      *   **Content:** Borderline cases (viruses, giant viruses, prions, viroids, plasmids, transposons, HeLa cells, mitochondria, cryptobiosis/tardigrades), alternative definitions (evolution vs. metabolism), self-replicating chemistry.
      *   **Audience:** Mixed bag. Specific known attendees: Retired Microbiologist (metabolism focus), 2 High School Bio Teachers (pedagogy/checklist focus), Philosophy Grad Student (natural kinds realist), Astronomy Club Guy (operational/astrobiology focus).
      *   **Deliverable:** A Q&A Prep Sheet.
