      *   Short reply (~2 mins)? Yes.
      *   Note on weakness? Yes.
      *   Upfront concessions? Yes.
      *   Dreaded question? Yes.
      *   No reading list? Yes.

      *(Self-Correction during drafting)*: Make sure the "Dreaded Question" isn't just a repeat of the Astro guy's point. It needs to be the *implication* of the Astro guy's point combined with the Phil student's rigor. "If there's no fact of the matter, why should we fund the search?" No, let's go with the Ethical/Legal boundary. "If it's just a definition, when does a human become a person?" No, that's too hot for a science cafe. Let's stick with the "Rover" question but phrased as "You're kicking the can down the road."
      *Actually, the best "Dreaded Question" for a nominalist is:* "So if I find a self-replicating crystal, you're saying science can't tell me if it's alive until I ask what *job* I want it to do?" It highlights the inconvenience of the view.

      *Let's finalize the "Dreaded Question":* "If 'alive' is just a tool, what happens when two tools disagree?" (e.g. Medical vs. Evolutionary).
      *Better:* "Are you saying NASA is wasting money looking for a definition that doesn't exist?"
