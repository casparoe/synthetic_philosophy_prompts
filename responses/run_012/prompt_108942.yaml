      *   *Decision:* The "So what?" question. If it's just a word game, why are we here? Or, more specifically, "If a rover finds self-replicating crystals, do you report 'Life Found'?" This forces a binary decision on a non-binary view. Let's go with the "Rover Decision" question. It forces the speaker to act like a realist despite arguing against realism.

  5.  **Developing the Q&A Objections (Ordered by Damage):**

      *   *Highest Damage:* Philosophy Grad Student. They know the terminology ("natural kinds," "deflationary"). They can expose the philosophical naivety.
          *   *Objection:* "Are you saying there's no underlying causal structure?"
          *   *Reply:* Focus on cluster concepts.
          *   *Weakness:* Might sound wishy-washy.

      *   *High Damage:* Astronomy Club Guy. Needs a binary for funding/missions.
          *   *Objection:* "I need a yes/no for the probe."
          *   *Reply:* Contextual definitions.
          *   *Weakness:* Doesn't solve his practical problem.

      *   *Medium Damage:* Retired Microbiologist. Cares about function.
          *   *Objection:* "Metabolism is the engine. No engine, no car."
