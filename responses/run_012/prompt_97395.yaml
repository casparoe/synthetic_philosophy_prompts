answer: |-
  The principle that underlies your verdicts is not merely "necessity versus preference." That distinction is too static. Your verdicts reveal a dynamic moral geography based on power and position. You are drawing a line between **defense** and **reservation**.

  The principle is this: **The Right to Remain, Not the Right to Reserve.**

  Residents have a moral claim to defend their actual homes against displacement (The Right to Remain). They do not have a moral claim to defend the character, density, or exclusivity of their neighborhood against the housing needs of others (The Right to Reserve). 

  When incumbents fight to keep their specific units from being demolished or converted into commodities, they are exercising the Right to Remain. When incumbents fight to keep new people out, or to keep land empty, or to freeze the aesthetic of the block, they are exercising the Right to Reserve. Your verdicts consistently side with the former and reject the latter, regardless of the income of the people involved.

  Here is how this principle applies to the questions you have left open, and the cost it demands of you.

  ### The Undecided Case: Incorporation
  **Verdict: They should lose.**

  You describe a working-class neighborhood incorporating chiefly to control its own zoning. Under the principle of *Remain vs. Reserve*, zoning control is inherently a tool of reservation. It is the legal mechanism by which a group decides who is allowed to enter their space. 

  While the impulse is defensive (fending off annexation), the tool (zoning control) is offensive. If they incorporate to control services or police, that is a Right to Remain issue. If they incorporate to control *zoning*, they are building a miniature version of the HOA in your Case 2. They are fencing off access to land they happen to sit on. Poverty does not grant a moral right to exclusion; it only grants a moral right to protection from displacement. If the city's annexation plan threatens direct displacement, fight the plan. Do not seize the power to zone, because you will inevitably use it to reserve the neighborhood for the current population at the expense of the next generation of the poor.

  ### A New Case
  Consider this: A large religious institution in a housing-scarce city proposes to convert its underused parking lot into a temporary shelter for homeless individuals. The surrounding homeowners, a mix of working-class and middle-class residents, object. They cite noise, traffic, and a fear that the shelter will attract crime and lower property values.

  **Verdict: The neighbors should lose.**

  This is not a Right to Remain issue. The neighbors are not being evicted. Their homes are not being demolished. They are objecting to a change in the *context* of their neighborhood (the presence of homeless people). This is an attempt to Reserve the neighborhood's social composition. The need of the homeless for shelter (a necessity) outweighs the neighbors' desire for a specific neighborhood character (a preference), even if that preference is rooted in genuine safety concerns. To allow the neighbors to win is to grant them a veto over the survival of others based on their address.

  ### The Sacrifice
  To hold this principle consistently, you must give up **Verdict 3**.

  In Case 3, you sided with the tenants' association that blocked a nonprofit from building a hundred mixed-income units on a *vacant lot*. You reasoned that the tenants' claim to stay outweighed the new units. 

  Under *The Right to Remain, Not the Right to Reserve*, this verdict fails. 

  On a vacant lot, no current resident is being displaced. No one is losing their home. The tenants are not defending their specific units; they are defending their neighborhood from change. They are arguing that their stability (protection from speculative pressure) is more important than the immediate housing of one hundred other families who are likely just as poor as they are. 

  By blocking those units, the tenants are not exercising a Right to Remain; they are exercising a Right to Reserve. They are treating the neighborhood as a club they belong to, rather than a resource the city needs. The "speculative pressure" argument is a proxy for exclusion. If you accept that current tenants can block new housing for fear of future market effects, you grant them a veto over regional housing supply that effectively hoards opportunity. 

  You should accept this loss because it clarifies the moral boundary of your own position. If you side with the tenants in Case 3, you are forced to side with the HOA in Case 2 eventually, because the logic is identical: *We were here first, and we know what is best for this land.* The only difference is the bank balance of the people holding the sign. If housing is a necessity, then the necessity of the hundred families without homes must outweigh the necessity of the families who already have them, provided the latter are not being kicked out. 

  Your instinct in Case 3 was protective, but it was protection of a *place*, not a *home*. Distinguish between the two. Fight for the home. Let the place change.
