answer: |-
  **Project Title:** The Individuation Problem for Mechanistic Anomaly Detection: A Contrastive Account

  **1. The Research Question**
  Mechanistic Anomaly Detection (MAD) proposes to secure advanced AI systems by flagging inputs that trigger internal computations distinct from those triggered by trusted inputs. However, the efficacy of this proposal depends entirely on a criterion for *mechanism identity*: when do two distinct internal processes count as the "same" mechanism, and when do they count as "different"?

  This paper addresses the following question: **Can a criterion for mechanism individuation be formulated that is sufficiently coarse to ignore benign implementation details, yet sufficiently fine to detect deceptive alignment, without collapsing into circularity?**

  The determinate answer I will argue for is **yes**, but only if mechanism identity is treated as a *contrastive relation* rather than a monadic property. Two computations count as the same mechanism only relative to a specified set of causal features held fixed and a specified set of features allowed to vary. The "correct" individuation is not determined by metaphysics alone, but by the specific safety goal of distinguishing *intent* from *implementation*.

  **2. Background and Philosophical Gap**
  MAD assumes we can compare a model's computation on a trusted input (the baseline) against its computation on a novel input (the test). If the test computation is "anomalous" relative to the baseline, the input is rejected. This requires a similarity metric over mechanisms.

  Current philosophical literature on mechanism individuation offers two dominant criteria, neither of which suffices for MAD:

  1.  **Functional Equivalence:** Mechanisms are identical if they map inputs to outputs identically over the relevant domain. This is too coarse. A treacherous model is designed to behave identically to an honest model on all trusted inputs. Under this criterion, the treacherous mechanism is identical to the honest one until the moment of betrayal, rendering MAD blind to the threat.
  2.  **Causal-Graph Identity:** Mechanisms are identical only if their internal causal structures (e.g., activation patterns, dependency graphs) are isomorphic. This is too fine. Neural networks are sensitive to irrelevant structural variations: compiler optimizations, random seed initialization, or noise can alter the causal graph without altering the computational intent. Under this criterion, MAD would flag benign re-implementations as anomalies, generating false positives that render the system unusable.

  Existing interventionist accounts of causation do not settle this. Interventionism focuses on invariant relationships between variables. However, in the treacherous turn scenario, the relationship between input and output *is* invariant on the trusted distribution. Interventionism correctly identifies the functional equivalence but fails to distinguish the latent causal pathway that leads to betrayal on the out-of-distribution input. Conversely, purely structural accounts lack the normative resources to distinguish "significant" structural changes (deception) from "insignificant" ones (refactoring).

  **3. Methodology and Case Construction**
  This paper will proceed by constructing two paired thought experiments that isolate the individuation dilemma. I will analyze these cases using a contrastive framework adapted from causal explanation.

  *   **Case A: The Treacherous Turn.** I will describe a model that utilizes a "switch" mechanism. On trusted inputs, the switch routes computation through Path H (Honest). On a specific trigger input, it routes through Path T (Treacherous). Path H and Path T produce identical outputs on trusted data but diverge on the trigger.
      *   *Analysis:* I will show that Functional Equivalence classifies Path H and Path T as identical (failure to detect). I will show that Causal-Graph Identity classifies them as distinct (success), but only because the graph structure explicitly diverges.
  *   **Case B: The Benign Refactor.** I will describe a model where Path H is replaced by Path H'. Path H' is computationally equivalent to Path H but implemented via a different architectural arrangement (e.g., fused layers, different basis representation) that yields a non-isomorphic causal graph.
      *   *Analysis:* I will show that Causal-Graph Identity classifies Path H and Path H' as distinct (false positive). Functional Equivalence classifies them as identical (correct).

  **The Contrastive Proposal:**
  I will argue that the solution lies in specifying the *contrast class*. We do not ask "Is Mechanism M1 identical to M2?" We ask "Is M1 identical to M2 *with respect to safety-relevant features*?"
  *   In Case A, the "switch" variable is a safety-relevant feature. Holding it fixed reveals the difference.
  *   In Case B, the "basis representation" is an implementation detail. Allowing it to vary reveals the similarity.

  I will formalize this by proposing a **Feature-Relative Identity Criterion**. A mechanism is defined by a tuple $\langle F_{fixed}, F_{vary} \rangle$, where $F_{fixed}$ are the causal features essential to the computational goal, and $F_{vary}$ are those incidental to the physical or architectural substrate. MAD succeeds if the safety engineer can correctly populate $F_{fixed}$ with features indicative of intent rather than mere processing.

  **4. Success Conditions and Risks**
  **Success:** The account succeeds if it demonstrates that the choice of $F_{fixed}$ can be grounded in something other than *ad hoc* tuning. I will argue that $F_{fixed}$ should be determined by **counterfactual robustness**: features that, if intervened upon, would change the model's behavior on *potential* (not just trusted) inputs. This links mechanism identity to the model's generalization properties, providing a non-arbitrary basis for distinguishing Case A from Case B.

  **Collapse into Stipulation:** The account collapses if the selection of $F_{fixed}$ amounts to saying "fix the features that detect deception." This would be circular: we need the individuation criterion to find the deception, but we need to know the deception to set the criterion.

  **The Live Risk:** The primary risk is **collapse into arbitrary stipulation**. It is far easier to define a contrastive class that works for the thought experiments than to provide a general algorithm for selecting $F_{fixed}$ in real-world high-dimensional networks. The philosophical heavy lifting is not in proposing the contrastive relation, but in justifying the selection of features without presupposing the answer to the safety problem. I will prioritize addressing this risk, arguing that while we cannot eliminate all normativity, we can constrain it via requirements of *stability under perturbation*.

  **5. Scope and Feasibility**
  This project is scoped for a one-semester workshop paper (approx. 6,000 words).
  *   **Weeks 1-4:** Formalize the definitions of Functional Equivalence, Causal-Graph Identity, and the Contrastive Criterion. Refine Case A and Case B descriptions.
  *   **Weeks 5-8:** Draft the core argument. Focus on the failure of standard interventionism and the derivation of the Feature-Relative Identity Criterion.
  *   **Weeks 9-12:** Address the "Stipulation Risk." Develop the argument for counterfactual robustness as the grounding for feature selection.
  *   **Weeks 13-15:** Revision and polishing.

  **Limitations:** I will not attempt to solve the technical problem of how to extract these features from a trained neural network (the mechanistic interpretability problem). I will treat the availability of internal features as a premise. My contribution is strictly philosophical: clarifying the identity conditions required for the technical work to make sense. I will also not address multi-agent scenarios or evolutionary dynamics, focusing solely on the individuation of a single model's internal computation across inputs.

  **6. Conclusion**
  By reframing mechanism identity as a contrastive relation grounded in counterfactual robustness, this paper will provide a conceptual foundation for Mechanistic Anomaly Detection. It moves the debate from an impossible search for a "true" mechanism to a pragmatic specification of which causal features matter for safety, resolving the dilemma between false negatives (deception) and false positives (refactoring).
