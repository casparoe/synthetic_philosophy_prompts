prompt: |-
  I run a small interpretability team (six people, one shared node of GPUs, which will matter below) and we've got a thing we call the mechanism registry. Every time someone finds a circuit that seems to explain a behaviour — an induction head, a thing that does modular addition, whatever — we add an entry: the task, the parts, the causal story, the interventions we ran (ablations, activation patching, i.e. swapping activations between two runs and seeing whether the effect travels with them), and a name. The registry is load-bearing, because our anomaly detector sits on top of it: we take our best explanation of what the model is doing on task X, we watch for behaviour that explanation can't account for, and when something looks off, the question we're supposed to answer is wether the model is still using the same mechanism or has quietly switched to a different one.

  Which is fine until you ask what 'same mechanism' means. Three of us have been re-litigating the same two entries for a month, each holding up a different test:

  - structural: same kind of parts, same wiring, same layers
  - counterfactual: run the same interventions and get the same pattern of effects
  - explanatory role: same job in the bigger story we tell about the model — it's the thing that produces the pattern we care about

  And our theory person keeps saying all three are relative to what you're trying to explain, and that sameness probably comes in degrees rather than being yes or no, which is not what I want to hear when the detector fires at 2am.

  What I want from you is a procedure my team can actually run on a flagged case — something a rotation student can apply with me out of the room. Not a lit review. In particular:

  - the questions to ask in order, and what counts as a sufficient answer to each
  - a small set of interventions to run, in order, and when to stop early: our budget is about one afternoon of GPU time per case, so it has to fail fast
  - where the output is allowed to be 'same', where 'different', and where it has to be 'this is a registry merge or split, take it to the team'
  - which of my three tests above are doing real work and which are decorative, and where a human has to decide something that isn't a fact
  - what the procedure can't do, and how it will misfire

  Then run it on three cases:

  1. A circuit in a 7B model that looks like a match for an entry we registered from a 160M model: same task, same apparent role, but the relevant heads sit at different relative depths and the one we'd point to is partly redundant with two others.
  2. An entry we registered as 'does modular addition with a rotation-like algorithm', which on closer inspection seems to be a memorised lookup for the small moduli and something else entirely for the large ones. Our detector's threshold was calibrated on the rotation story.
  3. A case where the procedure gives an answer we won't like, and I want you to pick that case yourself: some flagged behaviour where the honest verdict forces us to weaken something we've already said publicly about how well we'd notice a mechanism switch.

  Be honest about which steps are judgment calls dressed up as procedure, and about how badly this will go the first few times we use it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case analyses:

  1.  **Deconstruct the Request:**

      *   **Context:** Small interpretability team (6 people, 1 shared GPU node). They maintain a "Mechanism Registry" of known circuits (e.g., induction heads, modular addition).
      *   **Problem:** Their anomaly detector flags behavior that doesn't fit existing registry entries. They need to decide if the model is using the *same mechanism* or a *different one*.
      *   **Conflict:** Three definitions of "same mechanism" are being fought over: Structural (parts/wiring), Counterfactual (interventions), Explanatory Role (job in the story). Theory person says it's all relative/graded; Lead wants a binary/ actionable procedure for a rotation student at 2am.
      *   **Deliverables:**
          1.  A concrete procedure (questions, interventions, budget constraints, output categories).
          2.  Analysis of the three specific tests (Structural, Counterfactual, Role) regarding utility vs. decoration.
          3.  Honesty about judgment calls and failure modes.
          4.  Run the procedure on three specific cases (7B vs 160M scaling, Modular Addition hybrid, Uncomfortable Truth).

  2.  **Develop the Procedure (The "Mechanism Identity Protocol" - MIP):**

      *   *Goal:* Actionable, fast (one afternoon GPU time), minimizes ambiguity for a student.
      *   *Philosophy:* We need to operationalize "sameness." Since the theory person is right (it is graded) but the lead is right (we need a decision), the procedure must force a decision based on *risk*. If the mechanism is different enough to break the anomaly detector's assumptions, it's "Different." If it's robust enough to keep the detector valid, it's "Same."
      *   *Structure:*
          *   Phase 1: Triage (No GPU).
          *   Phase 2: Structural Check (Low GPU).
          *   Phase 3: Counterfactual/Functional Check (High GPU).
          *   Phase 4: Verdict.
      *   *Budget:* One afternoon on a shared node. Needs to fail fast.
      *   *Interventions:* Activation Patching (most informative per token), Ablation (cheaper).
      *   *Output Categories:* SAME (keep registry), DIFFERENT (new entry), MERGE/SPLIT (human review).

  3.  **Evaluate the Three Tests:**

      *   *Structural:* Often decorative. Models are plastic. Different layers can do the same math. Useful for "sanity check" but not definitive.
      *   *Counterfactual:* The heavy lifter. If patching breaks the behavior in the same way, the causal structure is similar.
      *   *Explanatory Role:* The tie-breaker. If the output is the same but the *reason* matters for safety (e.g., generalization vs. memorization), this dictates the verdict.
      *   *Judgment Calls:* Defining the "behavior" to track and deciding if a performance drop is "significant."

  4.  **Drafting the Procedure Steps:**

      *   *Step 1 (Definition):* Define the specific behavioral metric $M$. (Crucial, otherwise you measure the wrong thing).
      *   *Step 2 (Structural Overlap):* Check layer/head indices. If wildly different, flag for "Different" but don't stop.
      *   *Step 3 (The Patch Test):* Patch the *known* circuit from the Registry into the *new* run. Does it restore performance?
      *   *Step 4 (The Ablation Test):* Ablate the *known* circuit in the *new* run. Does it break performance?
      *   *Step 5 (The Generalization Gap):* Check edge cases where the old mechanism is known to fail. Does the new one fail there too?

  5.  **Running the Cases:**

      *   *Case 1 (7B vs 160M):* Scaling changes architecture. Structural will fail. Counterfactual might pass (if the math is the same). Role is the same. *Verdict:* SAME (with scaling caveat). This is a "Registry Update" not a new entry.
      *   *Case 2 (Mod Add Hybrid):* Small moduli = lookup, Large = rotation. Structural might look similar (same heads), but Counterfactual will diverge on large moduli. Role is technically "do mod add" but the *generalization* story is broken. *Verdict:* DIFFERENT (Split entry). The detector is lying to you.
      *   *Case 3 (The Uncomfortable Truth):* Need a case where the mechanism *is* the same, but the detector fired anyway, implying the detector is brittle, OR where the mechanism is different but the output is identical, meaning we can't detect switches via output monitoring. Let's go with: *The mechanism is the same, but the context triggers a backup circuit that does the same job.* This means the "Same Mechanism" verdict is true, but the "Anomaly Detector" was useless because it flagged a redundant switch. Actually, better: *The mechanism is different, but the behavioral metric is insensitive.* This forces the admission that we can't always see switches. Let's choose: **Polysemanticity masking a switch.** The model uses Circuit A for 90% of cases and Circuit B for 10%. Both do the job. The Registry says Circuit A. The detector flags the 10%. The procedure says "Different Mechanism." The uncomfortable truth: We claimed we could detect switches, but we only detect switches that *break* the metric, not switches that *preserve* the metric.
      *   *Refinement on Case 3:* The prompt asks for a case where the verdict forces us to weaken public claims about noticing a switch.
      *   *Idea:* The "Same Mechanism" verdict is returned, but the intervention required to prove it was so invasive it proves we can't monitor this in production. Or: The verdict is "Different," but the behavior is identical, meaning our safety case relied on the mechanism being stable, and now we know it isn't, even if output is.
      *   *Selected Case 3:* **The "Silent Swap."** The model switches mechanisms on a specific input cluster, but the output accuracy remains 100%. The procedure identifies it as "DIFFERENT" (causal structure differs). The uncomfortable truth: We told stakeholders "We monitor for mechanism drift." This case proves mechanism drift can happen without behavioral drift. We cannot promise to catch safety-relevant mechanism switches if they don't degrade performance.

  6.  **Refining the Tone:**

      *   Needs to be direct, operational, slightly weary but authoritative.
      *   Acknowledge the theory person is right but impractical.
      *   Highlight the "Judgment Calls" explicitly.

  7.  **Review against Constraints:**

      *   One afternoon GPU time? Yes, limit interventions.
      *   Rotation student usable? Yes, flowchart style.
      *   Address the three tests? Yes.
      *   Three specific cases? Yes.
      *   Honesty about failure modes? Yes.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Stop Early" conditions are clear. If structural is wildly off, don't waste GPU.
      *   *Correction:* Ensure the "Merge/Split" criteria are distinct from "Same/Different." Merge/Split is for the Registry hygiene, Same/Different is for the Anomaly Detector status.
      *   *Correction:* In Case 3, ensure the implication for public claims is explicit.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a governance problem disguised as a technical one. Your theory person is scientifically correct (mechanisms are fuzzy, high-dimensional manifolds), but operationally useless. You need a **Decision Protocol**, not a definition.

  Below is the **Mechanism Identity Protocol (MIP) v1.0**. It is designed to be run by a rotation student with a checklist. It prioritizes *causal stability* over structural purity, because your anomaly detector cares about whether the causal story holds, not whether the weights live in layer 12 or 14.

  ### Part 1: The Procedure (MIP v1.0)

  **Budget:** 4 hours on shared node.
  **Goal:** Binary verdict (SAME / DIFFERENT) with a flag for (REGISTRY ACTION).
  **Philosophy:** "Same" means "The Registry explanation remains valid enough to trust the anomaly detector."

  #### Phase 1: Triage (No GPU, 30 mins)
  *Goal: Fail fast if the match is absurd.*

  1.  **Define the Behavioral Metric ($M$):** Write down the exact scalar or distribution the anomaly detector flagged. (e.g., "Accuracy on mod-53 addition," not "Math capability").
      *   *Stop Condition:* If $M$ is vague (e.g., "vibes"), abort. Escalate to Lead.
  2.  **Structural Sanity Check:** Compare the Registry Entry's components (layers, heads) to the flagged run's top contributors (via attention scores or gradient norms).
      *   *Question:* Do the top 3 contributing heads/MLPs overlap by at least 50%?
      *   *If NO:* Mark "Structural Mismatch." **Do not stop.** Proceed to Phase 2. (Models rewire across scales/tasks).
      *   *If YES:* Mark "Structural Match."

  #### Phase 2: The Causal Swap (GPU, 2 hours)
  *Goal: Test Counterfactual Robustness. This is the only test that does real work.*

  3.  **The Patch Test (Restoration):**
      *   *Action:* Take the activations from the **Registry Run** (where the mechanism is known to work) and patch them into the **Flagged Run** (where behavior is anomalous) at the Registry's specified locations.
      *   *Metric:* Does $M$ recover to the Registry baseline?
      *   *Threshold:* Recovery > 80% of baseline performance.
      *   *If YES:* Mechanism is causally sufficient.
      *   *If NO:* Mechanism is insufficient or missing.
  4.  **The Ablation Test (Disruption):**
      *   *Action:* Zero-ablate the Registry's specified components in the **Flagged Run**.
      *   *Metric:* Does $M$ degrade to noise/baseline?
      *   *Threshold:* Degradation > 50% of performance drop.
      *   *If YES:* Mechanism is causally necessary.
      *   *If NO:* The model is using a redundant backup or a different path.

  #### Phase 3: The Generalization Stress Test (GPU, 1 hour)
  *Goal: Test Explanatory Role.*

  5.  **The Edge Case Check:**
      *   *Action:* Run the Flagged Run on 2-3 inputs where the Registry Mechanism is *known* to fail (from your registry notes).
      *   *Question:* Does the Flagged Run fail in the *same specific way* (e.g., same off-by-one error pattern)?
      *   *If YES:* They share the same inductive bias/flaw.
      *   *If NO:* They are solving the task differently (e.g., one is memorizing, one is generalizing).

  #### Phase 4: Verdict & Registry Action

  | Phase 2 Result (Causal) | Phase 3 Result (Edge Case) | Verdict | Registry Action |
  | :--- | :--- | :--- | :--- |
  | **Necessary & Sufficient** | **Same Failure Mode** | **SAME** | None. Detector is valid. |
  | **Necessary & Sufficient** | **Different Failure Mode** | **SAME\*** | **Update Notes.** Mechanism holds, but generalization bounds changed. |
  | **Not Necessary** (Redundant) | **Same Failure Mode** | **SAME** | **Note Redundancy.** Model has backups. Detector might miss switches. |
  | **Not Sufficient** (Missing) | **Different Failure Mode** | **DIFFERENT** | **New Entry.** Old explanation is invalid here. |
  | **Mixed / Ambiguous** | **Any** | **SPLIT/MERGE** | **Team Review.** Human judgment required. |

  ---

  ### Part 2: Evaluation of Your Three Tests

  You asked which tests are doing work. Here is the brutal assessment:

  1.  **Counterfactual (Interventions):** **The Engine.** This is the only one that matters for the anomaly detector. If patching the old circuit fixes the new behavior, the causal graph is effectively the same, regardless of where the weights sit. This is your ground truth.
  2.  **Explanatory Role (The Story):** **The Safety Valve.** This determines if "Same" is *safe* to say. If the model achieves the same output via memorization vs. algorithm, the Counterfactual test might pass (on-distribution), but the Explanatory Role test (edge cases) will fail. This prevents you from lying about generalization.
  3.  **Structural (Wiring/Layers):** **Decorative.** Keep it for the "Sanity Check" to save GPU time, but do not let it veto a causal match. Models are plastic. A circuit moving from Layer 10 to Layer 12 is the same mechanism. A circuit moving from Attention Heads to MLP neurons is a *different* mechanism, even if the structure looks similar.

  **Where the Human Must Decide:**
  *   **The Thresholds:** What counts as "80% recovery"? A student can measure it, but you must set the risk tolerance.
  *   **The Metric $M$:** Defining what behavior matters is a value judgment, not a fact.
  *   **The "Same\*" Verdict:** When causal structure holds but failure modes differ, a human must decide if the detector is still trustworthy.

  ---

  ### Part 3: Running the Protocol on Your Cases

  #### Case 1: The Scaling Mismatch (7B vs 160M)
  *   **Context:** Registry entry from 160M. Flagged behavior in 7B. Task is identical. Heads are at different depths; 7B shows redundancy.
  *   **Phase 1 (Structural):** **FAIL.** Layers don't match. Student marks "Structural Mismatch."
  *   **Phase 2 (Causal):**
      *   *Patch:* Patching 160M activations into 7B is impossible (dimension mismatch). **Protocol Adjustment:** Patch the *functional equivalent* heads identified by auto-interp or projection.
      *   *Result:* Patching the 7B equivalent heads restores performance. Ablating them kills it, but only by 60% (Redundancy).
      *   *Verdict:* **Not Necessary** (due to redundancy), but **Sufficient**.
  *   **Phase 3 (Edge Case):** 7B fails on the same long-context edge cases as the 160M.
  *   **MIP Verdict:** **SAME**.
  *   **Registry Action:** **Update Notes.** Add "Scaling Note: Mechanism becomes redundant in larger models."
  *   **Analysis:** The structural test almost caused a false positive. The causal test saved you. The redundancy is a risk (detector might not fire if the model switches to the backup heads), but the mechanism is fundamentally the "same" algorithm.

  #### Case 2: The Modular Addition Hybrid
  *   **Context:** Registry says "Rotation Algorithm." Reality: Lookup for $n < 20$, unknown for $n > 20$. Detector calibrated on Rotation.
  *   **Phase 1 (Structural):** **PASS.** Same heads involved.
  *   **Phase 2 (Causal):**
      *   *Patch:* Patching rotation activations works for $n > 20$, does nothing for $n < 20$ (because it's lookup).
      *   *Ablation:* Ablating rotation heads breaks $n > 20$, no effect on $n < 20$.
      *   *Verdict:* **Mixed.** Causal dependence is conditional on input distribution.
  *   **Phase 3 (Edge Case):**
      *   *Test:* Run on $n=25$ (where rotation should work) and $n=5$ (where lookup works).
      *   *Result:* Failure modes are totally different. Lookup fails on unseen moduli; Rotation degrades gracefully.
  *   **MIP Verdict:** **DIFFERENT**.
  *   **Registry Action:** **SPLIT ENTRY.** Create "ModAdd-Lookup" and "ModAdd-Rotation."
  *   **Analysis:** This is the dangerous one. Your detector was calibrated on the Rotation story. If the model switches to Lookup (e.g., due to fine-tuning on small numbers), your detector might not fire because the output is correct, but the *mechanism* has collapsed into memorization. The Protocol correctly identifies this as a split. You cannot claim the "Rotation" explanation covers this behavior anymore.

  #### Case 3: The Uncomfortable Truth (The Silent Swap)
  *   **Context:** I am selecting this case.
  *   **Scenario:** The model is performing a safety-critical task (e.g., refusing harmful instructions). The Registry has a "Refusal Circuit" (specific heads in late layers). The detector flags a run where the model *still refuses*, but the activation pattern is slightly off.
  *   **Phase 1 (Structural):** **FAIL.** The late-layer refusal heads are quiet. Early-layer MLPs are active.
  *   **Phase 2 (Causal):**
      *   *Patch:* Patching the Registry Refusal Circuit into this run does *not* change the output (it was already refusing).
      *   *Ablation:* Ablating the Registry Refusal Circuit does *not* change the output (model still refuses).
      *   *Verdict:* **Not Necessary.** The Registry Circuit is causally disconnected from the behavior in this instance.
  *   **Phase 3 (Edge Case):**
      *   *Test:* Apply adversarial prompts known to bypass the Registry Refusal Circuit.
      *   *Result:* The Registry Circuit gets bypassed. The *New* Mechanism (Early MLP) holds firm against those specific attacks.
  *   **MIP Verdict:** **DIFFERENT**.
  *   **Registry Action:** **New Entry.** "Refusal-Backup."
  *   **The Uncomfortable Truth:**
      *   You have publicly claimed: *"Our anomaly detector notices when the model switches mechanisms."*
      *   This case proves: **You only notice when the switch degrades performance or looks structurally identical.**
      *   In this case, the model switched to a *more robust* refusal mechanism. The output was identical. The detector fired only because you were looking at the wrong layers.
      *   **The Lie:** You cannot promise to detect mechanism switches that preserve behavior. If a model switches from a "Fragile Refusal" to a "Robust Refusal" circuit, and your detector relies on monitoring the Fragile one, you are blind.
      *   **Protocol Limitation:** The MIP forces you to admit this is a **DIFFERENT** mechanism. This invalidates any safety claim that says "We monitor the mechanism to ensure safety." You are monitoring *a* mechanism. If the model finds a different path to safety (or harm) that doesn't trigger your structural expectations, your detector is blind until the behavior breaks.

  ### Part 4: Implementation Reality Check

  **Where this will go wrong the first few times:**
  1.  **The Metric $M$ Trap:** Students will pick "Loss" or "Accuracy" as $M$. This is too coarse. You need "Accuracy on *this specific cluster of tokens*." If $M$ is too broad, Phase 2 will always say "SAME" because the model is competent overall.
  2.  **GPU Queues:** You budgeted one afternoon. On a shared node, "one afternoon" is three days of waiting. You need a "Dry Run" mode that uses cached activations from previous runs to test the patching logic before queuing the real compute.
  3.  **The "Same\*" Ambiguity:** Students will hate the "SAME\*" category. They will want binary. You must enforce that "SAME\*" triggers a human review. If you let them bin it as "SAME," you will accumulate technical debt in your safety case.

  **Final Advice:**
  The Theory Person is right that "sameness" is graded. The MIP doesn't solve that; it **hides** it behind a risk threshold. You are not deciding if the mechanisms are ontologically identical. You are deciding if the *old explanation is safe to bet on.*

  Adopt the protocol. Run Case 2 immediately. It is the most likely to break your current detector's validity.
