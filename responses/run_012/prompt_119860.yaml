answer: |-
  ### Brainstorm: Statistical Vocabulary Required

  *   **Likelihood function:** $P(\text{Data} \mid \text{Model})$. How probable are the textual/artefactual patterns given a specific timeline?
  *   **Prior specification:** Informative (physics/astronomy constraints) vs. uninformative (mathematical possibility).
  *   **Marginal likelihood / Model evidence:** Integrating over parameter space to compare models.
  *   **Bayes Factor:** The ratio of evidences for Conventional vs. Fomenko models.
  *   **Overfitting / Model complexity:** Penalising models with excessive flexibility (e.g., allowing arbitrary time shifts).
  *   **Hierarchical modelling:** Nesting data sources (texts, dendrochronology, astronomy) with shared hyperparameters.
  *   **Latent variables:** The 'true' dates versus observed dates.
  *   **Identifiability:** Can we distinguish a duplicate event from a single event given the data?
  *   **Exchangeability:** Are historical records independent draws or correlated sequences?
  *   **Predictive posterior checks:** Does the model predict new discoveries (e.g., carbon dating results)?
  *   **Sensitivity analysis:** How robust are conclusions to prior choices?
  *   **Correlated error structures:** Systematic biases in recording or transmission.
  *   **Generative process:** The mechanism producing the data (actual history vs. fabrication/conflation).

  ***

  ### The Translation

  Here is the situation restated in the language of Bayesian model comparison.

  **(a) The Conventional-Chronology Position**
  This is a hierarchical model with strong, informative priors derived from independent modalities. The latent variables are the true dates of events ($T$). The data ($D$) comprise textual records, artefacts, and physical measurements (e.g., radiocarbon, dendrochronology, astronomical retrocalculation).
  The generative process assumes a single, monotonic timeline. The likelihood function $P(D \mid T, H_{\text{conv}})$ relies on the assumption that physical data (eclipses, decay rates) are conditionally independent of textual transmission errors. The prior $P(T \mid H_{\text{conv}})$ is heavily constrained by physics; a timeline that violates celestial mechanics has prior probability near zero. The model is penalised for complexity via the marginal likelihood; adding ad hoc adjustments to fit textual anomalies reduces the model evidence unless they significantly improve predictive accuracy on held-out data (e.g., new excavations).

  **(b) The Fomenko Challenge**
  Fomenko proposes an alternative generative process, $H_{\text{fom}}$. He posits a transformation function $\phi(T)$ that maps 'ancient' events onto 'medieval' events, effectively claiming the data are duplicates displaced by a time shift $\delta$.
  His argument rests on a specific likelihood specification: he claims that statistical patterns in textual data (dynastic durations, name similarities, volume of surviving documentation) constitute sufficient statistics for the timeline. He argues that $P(D_{\text{text}} \mid H_{\text{fom}}) \gg P(D_{\text{text}} \mid H_{\text{conv}})$.
  Crucially, Fomenko treats the priors from physics/astronomy as either negligible or themselves corrupted data subject to the same time-shift transformation. He effectively flattens the hierarchy, treating physical dates and textual dates as exchangeable observations subject to the same global error structure. His model has high flexibility: by adjusting the duplication mapping, he can fit correlations in the textual data that the conventional model treats as noise or coincidence.

  **(c) The Demarcation Question**
  In your vocabulary, this is not a question of truth, but of **model validity and comparability**.
  Is $H_{\text{fom}}$ a competing model within the same inference space (a bold hypothesis with a calculable Bayes Factor), or is it a category error (pseudoscience)?
  If it is the former, we should be able to compute the posterior odds. If it is the latter, it implies that $H_{\text{fom}}$ is ill-defined: either the likelihood is incoherent (it fits any data), the priors are improper (ignoring hard constraints), or the parameters are unidentifiable (any timeline can be mapped to any other via sufficient duplication). The demarcation question asks whether the failure of $H_{\text{fom}}$ is due to low posterior probability (it's just wrong) or due to structural flaws that prevent it from entering the comparison at all (it's not science).

  ***

  ### The Residue Report

  Here is what survives the translation, what bends, and what breaks.

  #### 1. What Translates Cleanly
  **Overfitting and Model Complexity.**
  This is the strongest fit. Fomenko's method is structurally identical to finding spurious correlations in a high-dimensional space without penalising for degrees of freedom. He identifies statistical regularities (e.g., similarity in reign lengths) and treats them as signal. In Bayesian terms, his model has a vast parameter space (the possible mappings of duplication) that allows him to maximise the likelihood on training data (known texts) but fails predictive checks on out-of-sample data (e.g., physical dating evidence not used in the fit). The concept of *marginal likelihood* automatically penalises this flexibility. You can explain the rejection of his theory entirely via the Occam's factor inherent in model evidence.

  **Correlated Error Structures.**
  You deal with measurement error correlated across sources daily. Conventional history acknowledges this (e.g., chroniclers copying each other). Fomenko essentially argues that the correlation is perfect and global (a systematic shift). The statistical vocabulary handles this well: it is a dispute over the covariance matrix of the errors. Conventional history assumes sparse correlations; Fomenko assumes a dense, structured covariance.

  #### 2. What Translates with Distortion
  **The Likelihood Function ($P(D \mid H)$).**
  To make this fit, we have to bend the definition of "Data". In your work, $D$ is usually numeric or clearly categorised. In history, $D$ is semantic.
  Fomenko reduces semantic content to statistical features (counts of names, lengths of reigns). To translate this, we must accept that the *meaning* of the text is irrelevant, only the pattern matters. This distorts the likelihood. A conventional historian argues that $P(\text{Text} \mid \text{History})$ depends on language evolution, cultural context, and causality, not just statistical similarity.
  *The Bend:* We have to treat "semantic plausibility" as a prior rather than part of the likelihood. But for historians, the meaning *is* the data. Ignoring semantics to focus on statistical patterns is like doing regression on pixel values without recognising the image is a face. It's mathematically permissible but epistemically lossy.

  **Prior Specification.**
  In your work, priors are often mathematical conveniences or based on previous studies. In chronology, the "priors" from physics (e.g., an eclipse happened here) are treated as *data* by Fomenko, but as *constraints* by conventionalists.
  *The Bend:* To map this, you have to view physical evidence as hyperparameters with near-infinite precision in the conventional model, whereas Fomenko treats them as noisy observations with large variance. The distortion lies in the *status* of the evidence. In stats, all evidence is technically data. In this dispute, some evidence is treated as constitutive of the framework itself. Translating this requires you to treat "celestial mechanics" as just another noisy sensor, which feels wrong to the subject matter experts, even if it's statistically consistent.

  #### 3. What Has No Counterpart (The Residue)
  **Testimony and Authority as Evidence.**
  In Bayesian statistics, data is data. In history, data comes with an attached reliability metric based on provenance and expert consensus. There is no clean equivalent for "expert consensus" in a formal model other than a meta-analysis of priors.
  Fomenko argues from the mathematics of the text; conventionalists argue from the *authority* of the philological and archaeological consensus.
  *The Residue:* Your framework has no variable for "community validation". You can model the output of the community, but not the process by which the community certifies data as reliable.
  *Verdict:* This is a **framework limitation**. Bayesianism is individualist (my posterior given my priors). Science is social (our posterior given our shared standards). The demarcation line often rests on whether one accepts the community's data certification process. Fomenko rejects the community's certification; the community rejects Fomenko's maths. Stats cannot resolve who trusts whom.

  **The Nature of Fabrication vs. Error.**
  In your work, noise is noise. In history, there is a qualitative difference between *error* (mistake) and *fabrication* (lie). Fomenko posits a global fabrication (a conspiracy or mass delusion).
  *The Residue:* A statistical model can account for bias, but it struggles to model *intent* or *mechanism of fabrication* without explicit parameters for human agency.
  *Verdict:* This is **vagueness in the dispute**. "Fabrication" is often a placeholder for "a generative process we haven't modelled". If you modelled the sociological conditions required to fake carbon dating globally, you'd just have a more complex hierarchical model. The residue here is rhetorical, not structural.

  **Semantic Coherence.**
  This is the big one. In stats, if two variables correlate, they might be linked. In history, if two texts correlate, they must be linked by a *causal mechanism* that makes sense humanly (e.g., copying, translation, oral tradition).
  Fomenko finds statistical correlations that lack a plausible causal mechanism (how did everyone agree to shift the timeline by 1000 years identically across Europe and Asia?).
  *The Residue:* Your vocabulary handles *correlation* perfectly. It does not handle *plausibility of mechanism* unless you explicitly parameterise the mechanism.
  *Verdict:* This is **framework failure**. Standard Bayesian model comparison evaluates fit and complexity. It does not inherently evaluate the *physical or sociological plausibility of the generative process* beyond the prior. If Fomenko writes a prior that says "Global conspiracy is probability 0.5", the maths works. The rejection comes from outside the maths, from background knowledge about human behaviour which is hard to formalise as a prior density.

  ### Summary of the Residue
  The translation works beautifully for the *structure* of the argument (model comparison, overfitting, evidence weighting). It fails on the *content* of the priors (what counts as physical impossibility) and the *semantics* of the data (meaning vs. pattern).

  The residue where my framework fails to see something real is **semantic coherence**. You can calculate a Bayes Factor for Fomenko's model if you accept his likelihood specification. The reason it is pseudoscience is not that the maths doesn't run, but that the likelihood function ignores the causal mechanisms required to generate the data (human language and culture). Your vocabulary treats the data as given; the dispute is about whether the data *could exist* as described without violating known laws of human society. That is a constraint outside the statistical model, residing in the philosophy of causation.

  The residue where the original dispute is vaguer than it sounds is **Authority**. Much of the rejection of Fomenko is sociological ("he is not a historian"). In your vocabulary, this should be irrelevant. In practice, it acts as a shorthand for "he has not engaged with the full hierarchical model of evidence". The vagueness lies in distinguishing between legitimate expert prior weight and appeals to authority. Stats clarifies this (it's just prior weight), but the human dispute obscures it.
