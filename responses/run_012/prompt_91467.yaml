answer: |-
  **The Setup**

  The Interstate Hazardous Transport Tribunal (IHTT) is a five-member regulatory body empowered to grant or deny permits for high-risk chemical shipments. Under Section 4(b) of the Transport Safety Act, the Tribunal's written decision rule is explicit: a Permit ($C$) must be issued if and only if the Proposed Route is Verified Safe ($P$) **OR** the Containment Vessel is Certified Secure ($Q$). The statute mandates that the logical connection is binding: $C \leftrightarrow (P \lor Q)$. The five Commissioners must vote on the factual status of $P$ and $Q$, and the legal status of $C$, with the majority view on each proposition determining the Tribunal's official position.

  ***

  **The Judgments**

  Here are the individual judgment sets for the five Commissioners. All accept the statutory rule $C \leftrightarrow (P \lor Q)$.

  | Commissioner | Route Safe ($P$) | Vessel Secure ($Q$) | Issue Permit ($C$) |
  | :--- | :---: | :---: | :---: |
  | **Comm. 1** | Yes | No | Yes |
  | **Comm. 2** | No | Yes | Yes |
  | **Comm. 3** | Yes | Yes | Yes |
  | **Comm. 4** | No | No | No |
  | **Comm. 5** | No | No | No |
  | **Majority** | **No** (2-3) | **No** (2-3) | **Yes** (3-2) |

  *Diversity Check:* Commissioners 4 and 5 share a judgment set. Commissioners 1, 2, and 3 all have unique sets. No more than two members share the same set.
  *Consistency Check:*
  *   Comm. 1, 2, 3 accept $C$. Consistent with rule because each accepts at least one ground ($P$ or $Q$).
  *   Comm. 4, 5 reject $C$. Consistent with rule because each rejects both grounds ($\neg P$ and $\neg Q$).
  *   Every individual set is logically valid under the rule $C \leftrightarrow (P \lor Q)$.

  ***

  **The Collective Inconsistency**

  When we aggregate by simple majority on each proposition independently, the Tribunal's official record becomes:
  1.  **Route Safe ($P$):** False (Majority rejects)
  2.  **Vessel Secure ($Q$):** False (Majority rejects)
  3.  **Issue Permit ($C$):** True (Majority accepts)

  This collective set $\{\neg P, \neg Q, C\}$ is logically inconsistent. Given the binding rule $C \leftrightarrow (P \lor Q)$, accepting $C$ commits the group to $(P \lor Q)$. However, the group has also officially rejected $P$ and officially rejected $Q$, which entails $\neg(P \lor Q)$. The Tribunal is now on record asserting both $(P \lor Q)$ and $\neg(P \lor Q)$.

  ***

  **Aggregation Procedures**

  *   **Premise-Based Procedure:** The group votes on $P$ and $Q$ first, then derives $C$.
      *   Majority finds $\neg P$ and $\neg Q$.
      *   Applying the rule $(\neg P \land \neg Q) \to \neg C$.
      *   **Output:** Permit Denied.
  *   **Conclusion-Based Procedure:** The group votes on $C$ directly (treating $P$ and $Q$ as advisory).
      *   Majority finds $C$.
      *   **Output:** Permit Granted.

  **Written Rule Preference:** The statute says "a Permit must be issued *if and only if*..." This phrasing typically favors the **Premise-Based Procedure**. The legal authority to issue $C$ is conditioned on the factual finding of $P$ or $Q$. If the factual findings are negative, the legal authority to conclude $C$ does not exist, regardless of how many members want to vote for the permit directly.

  ***

  **Honest Note on the Mechanics**

  The feature doing the heavy lifting here is the **disjunctive norm combined with cross-cutting minorities**. In the standard conjunctive paradox ($C \leftrightarrow P \land Q$), the trouble usually arises because a majority agrees on *all* premises but rejects the conclusion (or vice versa). In this disjunctive version, the paradox arises because the coalition for the conclusion is a *union* of different minorities (those who like $P$, those who like $Q$, and those who like both), while the coalitions against the premises overlap sufficiently to form majorities against each ground individually.

  If you drop the disjunctive requirement and make the rule conjunctive, the paradox flips (the group would accept the grounds but reject the conclusion). If you drop the requirement that the logical connection is binding, the collective set is just inconsistent, not a paradox of aggregation.

  **The Strongest Defense of Issue-by-Issue (Premise-Based) Voting:**
  A defender of premise-based voting should not argue that it avoids contradiction (both procedures can be manipulated); they should argue that it preserves **public justification**. A government body cannot legitimately assert a conclusion ($C$) while simultaneously asserting facts that negate the only legal grounds for that conclusion ($\neg P, \neg Q$). To allow conclusion-based voting here is to allow the Tribunal to issue a permit it has legally forbidden itself from issuing. The paradox reveals that "outcome voting" allows a coalition to bypass the constraints of the very rules that grant them power. The premise-based procedure forces the group to own the reasons; if they cannot agree on the reasons, they should not get the outcome.
