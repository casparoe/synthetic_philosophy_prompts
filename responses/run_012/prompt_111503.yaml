  ### Ranking of Resolutions

  **Tier 1: The Substantive Limit View**
  **(iv) Article 12 confers a delegated power to amend, while Article 13 marks a limit belonging to the founding moment that the delegated power cannot reach; A therefore exceeds the amendment power and B falls with it.**
  This is the only candidate that satisfies all five demands. It yields a determinate answer (A and B are void), grounds authority internally in the charter's distinction between founding and delegated acts, avoids circularity by establishing a hierarchy of norms, ensures the entrenchment clause does actual work (protecting Article 4), and is stable because a future majority cannot use this logic to override founding limits.

  **Tier 2: The Temporal Validity View**
  **(iii) Validity is judged by the rules of change in force at the moment of enactment: A complied with Article 12 as it then stood, so A is valid, and by the time of B Article 12 required only a majority, so B is valid as well, the entrenchment having lost its grip when it was repealed.**
  This ranks second because it is determinate, internally grounded, and avoids circularity through sequencing. However, it fails the fourth demand: it renders the entrenchment clause toothless, as the very power limited by entrenchment is used to remove it. It is also unstable under its own logic, as a future simple majority could gut any protection.

  **Tier 3: The Presupposition View**
  **(i) The chain of validity terminates in a norm that no one enacted: the original charter is valid by presupposition, so self-amendment raises no special problem and the puzzle is dissolved rather than solved.**
  This ranks third because it grounds authority internally and avoids regress by positing a basic norm. However, it fails the demand for determinacy in this specific case by claiming the puzzle is "dissolved," offering no guidance on the conflict between Articles 12 and 13. It also leaves the work of entrenchment ambiguous, depending on how the presupposed norm is interpreted.

  **Tier 4: The Political Promise View**
  **(v) The entrenchment is addressed to amenders as a political promise, so breaching it makes them culpable without voiding the act; B is valid law and the remedy is political.**
  This ranks fourth because it yields a determinate answer. However, it fails the demand for internal grounding by shifting authority from the legal text to external political morality. It also fails to let the entrenchment clause do legal work, reducing a constitutional limit to a mere breach of etiquette.

  **Tier 5: The Social Practice View**
  **(ii) Whether B is law depends on whether officials — board, staff, arbitrators — converge on treating it as law; validity is a matter of an existing social practice of recognition rather than of logical derivation.**
  This ranks fifth because it fails the demand for determinacy (we do not yet know how officials will converge) and internal grounding (authority rests on officials, not the charter). It treats the charter as a product of power rather than a constraint on it, offering no stability against shifting political winds.

  **Tier 6: The Decisionist View**
  **(vi) The question has no answer until someone is authorized to give the last word, so what makes B valid is the decision of a designated final decider, and our task is to appoint one.**
  This ranks last because it fails the primary demand for determinacy, admitting the text provides no answer. It is also a change of subject (see below), moving from legal interpretation to institutional design. It offers no stability, as the decider's power is unlimited by the charter's text.

  ***

  ### Adoption and Analysis

  **Candidate Adopted:**
  I would adopt **Candidate (iv)**. It is the only framework that treats the charter as a binding legal instrument rather than a suggestion. By distinguishing between the *constituent power* (the founding members who set the limits) and the *constituted power* (the current members acting under Article 12), it preserves the integrity of the cooperative's foundational rights while providing a clear, legally defensible reason to invalidate Amendment B.

  **Most Heavily Weighted Demand:**
  I weighted **Demand 4 (Entrenchment Work)** most heavily. The core of your dilemma is whether Article 13 means anything at all. If a ranking system allows an entrenchment clause to be repealed by the very procedure it seeks to limit (as Candidate (iii) does), the clause is illusory. For a housing cooperative, where minority rights (like the vote on property sales) are essential to the mission, a theory that renders protections voidable by a bare majority is functionally useless.

  **Same Position or Change of Subject:**
  **Candidate (vi) is a change of subject.** The other five candidates attempt to interpret the validity of the amendments based on the existing charter (whether through text, norm, or practice). Candidate (vi) abandons the interpretive task entirely, asserting that the law is indeterminate until a new institutional mechanism (a final decider) is created. It does not answer whether B is valid; it answers how you might find someone to tell you.

  Additionally, **Candidates (i) and (iii) are the same position in different dress.** Candidate (i) provides the philosophical foundation (Kelsenian *Grundnorm*) for Candidate (iii)'s doctrinal application. Both rely on a positivist view where validity flows from the top of the hierarchy down through the procedures actually followed, ultimately leading to the conclusion that if the procedural steps were taken, the result is valid, regardless of substantive limits.
