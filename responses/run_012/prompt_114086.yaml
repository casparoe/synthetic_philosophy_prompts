answer: |-
  This is a sharp argument, and it's understandable why it felt compelling when you wrote it. It has the clean, transitive structure of a sorites paradox, but with moral stakes. You are right to be worried about (7), and you are right that your friend's objection about (5)→(6) is too quick. The species boundary isn't the problem; the *metric* is.

  Here is where I think the thread comes loose, what you buy by cutting it, and why your fear about the "cow vs. rock" slide is addressable without accepting (7).

  ### The Diagnosis: Premise (4) is doing too much work

  The break is at **(4): "A being's moral status is proportional to how much morally relevant experience it is capable of."**

  When you wrote this, it looked fine because you were likely reading "capacity for experience" in two different ways across the premises, but (4) forces them to collapse into a single scalar.

  1.  **In (1) and (2):** "Capacity" functions as a **threshold condition**. It answers the question: *Is this thing a patient?* (Can things go well or badly for it?) This is binary. Either the system supports valenced states or it doesn't. This is what separates the cow from the rock.
  2.  **In (3):** "Capacity" functions as a **scalar multiplier**. It answers the question: *How rich/complex/intense can those states be?* This is where neuron count comes in. A human can suffer *anticipatory* anxiety about next year; a mouse likely cannot.
  3.  **In (4):** You equate the scalar (3) with the moral status derived from the threshold (1). You assume that because the *complexity* of experience scales with neurons, the *moral weight* of that experience must also scale linearly with neurons.

  **Why this fails:**
  Moral status (standing) and the weight of interests are often distinct categories in animal ethics (see DeGrazia or McMahan).
  *   **Standing:** Do you count? (Grounded in the *presence* of a nervous system/phenomenology).
  *   **Weight:** How do we weigh your interests against others? (Grounded in the *nature* of the interests, not just the hardware).

  By accepting (4), you commit to the claim that a "larger" experience is morally *weightier* per unit of suffering. But is a human's headache morally "more important" than a dog's headache simply because the human has more neurons processing it? Or is the *suffering* equal, even if the *cognitive context* differs?

  If you keep (4), you are committed to the view that moral value is a aggregate sum of processing power. This leads directly to (7).

  ### The Cost of Surrendering (4)

  If you modify (4) to say: *"Moral standing is grounded in the capacity for experience (binary), but the weighting of interests depends on the nature of the frustration, not just neural quantity,"* here is what you buy:

  1.  **You lose the clean metric.** This is the big one for your policy work. You can no longer say "Cow = X units, Chicken = Y units" based on brain mass. You have to make qualitative judgments about the *types* of suffering (e.g., physical pain vs. psychological distress).
  2.  **You avoid the "Grotesque" Conclusion.** A human with fewer neurons (due to pathology or variance) does not lose moral standing, because standing is threshold-based. They remain in the moral community.
  3.  **You avoid the Species Inversion.** A cow does not automatically outweigh a human just because of raw neuron count (if it did), because the *interests* at stake might differ in kind (e.g., a human's interest in continued life involves complex future-oriented projects; a cow's may not).

  ### Addressing the "Cow vs. Rock" Fear

  You asked: *"If I surrender (3), what stops the whole thing from sliding to 'brain size is morally irrelevant, so nervous systems are too, so nothing grounds the difference between a cow and a rock'?"*

  This is the strongest part of your worry, but it relies on a false dichotomy: either neural quantity matters linearly, or neural presence matters not at all.

  You can reject the **scalar** claim of (3) without rejecting the **necessary** claim of (2).

  *   **The Slide:** "If more neurons don't mean *more* status, then neurons don't mean *any* status."
  *   **The Block:** "Neurons are the *engine* of moral status, not the *fuel gauge*."

  Consider an analogy: **Voting Rights.**
  *   (A) Capacity to understand civic duty grounds the right to vote.
  *   (B) This capacity is realized in cognitive development.
  *   (C) More cognitive development (higher IQ) means *more* capacity to understand.
  *   (D) Therefore, voting rights should be proportional to IQ.

  We reject (D). We say there is a **threshold** of cognitive capacity required to enter the franchise (excluding rocks and perhaps some animals), but once you cross the threshold, you get one vote. Having a PhD doesn't give you 1.5 votes over someone with a high school diploma.

  Similarly, you can argue that a nervous system is the **threshold mechanism** for moral standing (blocking the rock), but neural quantity is not the **currency** of moral weight (blocking the intra-human ranking).

  So, you keep (2) (NS is necessary) but modify (3) and (4). You argue that while more neurons allow for *more complex* experiences (which might create *different* kinds of interests, like liberty vs. mere comfort), it does not simply multiply the moral value of a unit of pain.

  ### What About (5) to (6)?

  Your friend said the move from (5) to (6) smuggles in species facts. They are wrong, but for an interesting reason.
  (5) says: *More neurons = Higher Status.*
  (6) says: *Therefore, humans vary in status.*

  The logic is valid. The problem isn't that (6) violates a species norm; it's that (5) asserts a universal metric that ignores **phenomenological incommensurability**.
  If a dog has a different *kind* of consciousness than a human, you cannot simply rank them on a single "neuron count" line. It's like ranking a painting and a symphony by "how many pixels/notes they have." The metric captures quantity of data, not quality of experience.

  So the error isn't in the deduction from (5) to (6); it's that (5) is false because it assumes a single scale of "moral status" exists that applies to all nervous systems.

  ### Where I Might Be Wrong (Meta-Commentary)

  You asked what would change my mind. I am operating under a **pluralist** assumption about moral value (that there are different *kinds* of moral claims). If you are a strict **hedonic utilitarian**, my diagnosis weakens.

  If your foundational view is that the *only* thing that matters is the aggregate sum of pleasure minus pain in the universe, then (4) becomes much harder to deny. If a human brain can generate *more* units of suffering (due to complexity/duration/intensity) than a mouse brain, a strict utilitarian *must* count the human's suffering as "more" in the calculus.

  **If you can show me that:**
  1.  Moral status is *only* about maximizing aggregate welfare units (no rights, no standing distinctions).
  2.  Neural quantity is a reliable proxy for the *intensity* of those welfare units (not just complexity).

  ...then I would have to concede that (7) is not grotesque, just counter-intuitive, and that we must accept that some humans have less moral weight than some animals.

  However, given your policy context, I suspect you are not a strict aggregative utilitarian. You are likely dealing with **priorities** and **triage**. In triage, we often treat patients based on need and survivability, not on their "social value" or "brain size."

  ### Recommendation for Your Policy Work

  Don't throw out (1). Keep the grounding in experience.
  Modify (4) to a **Threshold View**:
  *   **Step 1:** Does it have a nervous system capable of valenced states? (Yes/No). If No → No status (Rock).
  *   **Step 2:** If Yes, it has full moral standing.
  *   **Step 3:** When conflicts arise, weigh interests based on the **severity of frustration**, not the **size of the brain**.

  This allows you to say a cow's suffering matters immensely (because physical pain is severe) without saying a cow outweighs a human (because the human has interests in liberty/autonomy that the cow does not). It makes your policy work harder (you have to define "severity" qualitatively), but it saves you from the eugenics-adjacent implications of (7).

  **Summary:** The loose thread is the assumption that *capacity for complexity* translates to *moral weight*. Cut that link. Keep the link between *nervous systems* and *moral standing*. This blocks the rock (no NS) and blocks the intra-human ranking (standing is threshold, not scalar).
