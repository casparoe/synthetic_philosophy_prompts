          6.  Meta-commentary on my own uncertainty (as requested).

  10. **Refining the "What would change my mind" section:**
      *   I need to be honest. If there were evidence that neural density *directly correlates* with intensity of pain (not just cognitive processing), (3) becomes stronger. If utilitarianism strictly demands maximizing welfare units, (4) becomes harder to deny.

  11. **Self-Correction/Review during drafting:**
      *   *Check:* Did I just say "equivocation"? The user said two people already did that unhelpfully.
      *   *Fix:* I must explain *where* the equivocation happens (on "capacity" and "status") and what the ontological cost is. Don't just label it.
      *   *Check:* Did I address the (5) to (6) move?
      *   *Fix:* Yes, note that (5) is the universal claim that forces (6). The friend was wrong about *where* the species assumption enters; it enters at (4)/(5) by assuming a single scale.
      *   *Check:* Did I address the Cow/Rock fear?
      *   *Fix:* Yes, distinguish necessary conditions from scalar multipliers.

  12. **Final Polish:** Ensure the distinction between *Moral Standing* (membership) and *Moral Weight* (trumping power) is clear, as this is the standard philosophical move to solve this specific problem (e.g., DeGrazia, McMahan).

  *(Self-Correction on "Equivocation"):* The user specifically said "Don't just hand me a fallacy name... neither told me what I'd be buying." I need to be careful. I will identify the structural error without relying solely on the label. The error is a *category mistake* between *kind* of capacity and *degree* of status.

  *(Final Plan):*
