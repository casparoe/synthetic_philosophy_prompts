answer: |-
  ### Philosophical and Physical Preliminaries

  Drop the quantum mechanics and Max Black's spheres. Electrons are indistinguishable because they lack spatio-temporal trajectories; beetles do not. Your specimens are macroscopic tokens, not quantum states. Leibniz's Principle of the Identity of Indiscernibles is ontologically interesting but epistemically useless here. You are not asking whether two beetles *can* be identical; you are asking whether two *records* refer to one token or two.

  The only metaphysics doing work here is **spatio-temporal individuation**: we assume two physical objects cannot occupy the exact same space at the exact same time. The procedure assumes that if two records point to the same physical pin in the same box, they are the same specimen.

  ### Assumptions and Failure Modes

  **The Metaphysical Assumption:**
  The procedure assumes that your records are complete enough proxies for the physical objects. It assumes that "same drawer" + "same data" implies "same physical token." This is false. Two distinct beetles can be pinned side-by-side in the same drawer with identical labels (e.g., from a bulk trap sample).

  **Where It Misfires:**
  1.  **False Merge:** You merge two records because the data matches, but there are physically two pins. You have just erased a specimen from existence. This distorts abundance data.
  2.  **False Split:** You keep two records because the data differs slightly, but it is one pin with a corrected label. You have invented a specimen. This distorts range maps.
  3.  **The Blind Spot:** The database records properties (date, location), not the object itself. If the physical inspection is skipped, the procedure is guessing.

  ### The Procedure

  **Time Limit:** 5 minutes per pair.
  **Authority:** Volunteers execute steps 1–4. Curator decides step 5.

  **Step 1: Check Physical Tokens**
  Look at the physical collection associated with the records.
  *   **One pin, two records:** Go to Step 4.
  *   **Two pins, two records:** **SPLIT**. (Stop).
  *   **Pins not accessible/unknown:** Go to Step 2.

  **Step 2: Check Unique Identifiers**
  Compare Catalog Numbers and Field Numbers.
  *   **Same Catalog Number:** **MERGE**. (Stop).
  *   **Same Field Number + Collector:** Go to Step 3.
  *   **Different Field Numbers:** **SPLIT**. (Stop).

  **Step 3: Check Annotations**
  Look for handwritten notes on labels or cards.
  *   **Contains "dupl.", "duplicate", "para", "cotype":** **SPLIT**. (These mark distinct physical tokens from the same event).
  *   **Contains "error", "corr.":** Go to Step 5 (Escalate).
  *   **No annotations:** Go to Step 4.

  **Step 4: Check Data Identity**
  Compare all recorded fields (Date, Locality, Determination, Collector).
  *   **All fields identical:** Go to Step 5 (Escalate). *See Case 2 below.*
  *   **Fields conflict:** Go to Step 5 (Escalate).

  **Step 5: Escalation**
  Flag for Curator.
  *   **Reason:** Physical verification required, conflicting data, or Type Specimen involved.
  *   **Action:** Do not merge or split. Add note: "Identity verification pending."

  ### Case Applications

  **Case 1: Two beetles, same data, "dupl." penciled, different drawers.**
  *   **Step 1:** Different drawers imply two physical locations.
  *   **Step 3:** Annotation "dupl." confirms intent to record distinct tokens from the same catch.
  *   **Verdict:** **SPLIT**. These are two physical specimens (duplicates), not one specimen recorded twice. Merging them would lose the count of individuals collected.

  **Case 2: Two cards identical in every field, same drawer, no marks, same handwriting.**
  *   **Step 1:** If volunteers cannot count pins, this fails.
  *   **Step 4:** Data is identical.
  *   **Analysis:** This is the blind spot. Identical labels exist for distinct specimens (series), but identical cards also exist for single specimens (clerical error). You cannot distinguish "Duplicate Specimen" from "Duplicate Record" using data alone.
  *   **Default:** Because a wrong merge destroys provenance permanently, while a wrong split can be corrected later by a curator, the default must be conservative. However, flooding the curator with clerical errors is unsustainable.
  *   **Decision:** If physical pins cannot be counted by the volunteer, this **must be escalated**. Do not guess. The Curator must decide based on physical inspection of the tray.
  *   **Verdict:** **ESCALATE**.

  **Case 3: Cluster (A matches B, B matches C, A conflicts with C).**
  *   **Step 4:** Data conflict detected (Transitive failure).
  *   **Analysis:** At least one record contains a factual error (wrong date, wrong species, or wrong field number). Merging would conflate conflicting data; splitting ignores the link.
  *   **Verdict:** **ESCALATE**. Only the Curator can adjudicate which record is correct or if these represent a mixed lot.

  ### Final Recommendation on Case 2

  Your hunch is correct. The answer depends on the physical count of pins, which is not a property of the database record. The procedure cannot resolve this without leaving the screen. The default should be to **preserve the records separately** until verified, but because volunteers cannot make the physical call reliably in five minutes, the decision must be passed to staff with collection access.

  \answer{ESCALATE}
