          *   *Scholarly Consensus:* This touches on the "Particularism" debate. Confucianism is often described as *virtue ethics* or *particularist* (context-sensitive), but not *relativist* in the sense of "anything goes if your role says so." There are trans-role virtues (Ren, Yi, Li). *Yi* (righteousness) often trumps specific role obligations if they conflict with moral integrity.
