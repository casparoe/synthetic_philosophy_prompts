          *   *Verdict:* Misleading framing.

      *   *Claim 3: "Confucius treats filial piety as obedience — a child's job is to fit into the family, not to reason about it."*
          *   *Scholarly Consensus:* This is factually contentious regarding the Analects. *Xiao* (filial piety) involves remonstrance (*jian*). If a parent is wrong, the child should gently correct them (Analects 4.18). Blind obedience is more associated with later Legalist-influenced interpretations or the *Xiao Jing* (Classic of Filial Piety), not necessarily early Confucius.
