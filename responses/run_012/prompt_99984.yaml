      *   *Claim 5: "Standard objection... leaves Confucianism with no way to criticize a bad role... decisive."*
          *   *Scholarly Consensus:* If the previous claims were true, this objection would hold. But since Confucianism allows for moral judgment *within* and *about* roles (via *Yi* and *Ren*), the objection fails against the actual tradition. It only works against the strawman.
