  2.  **Deconstruct Dialetheism (Philosophical Core):**
      *   *Core Claim:* There are true contradictions ($A \land \neg A$ is true).
      *   *Motivation:* Semantic closure (language can talk about its own truth), avoiding arbitrary hierarchies (Tarski), solving paradoxes (Liar) without losing expressive power.
      *   *Logic:* Paraconsistent logic (blocks "explosion").
      *   *Truth Values:* Often truth-value gluts (both true and false) vs. gaps (neither).

  3.  **Map to Backend/SQL Concepts (The Translation):**
      *   *SQL 3VL:* True, False, Unknown (NULL). This is a *gap* (neither T nor F). Dialetheism is about *gluts* (both T and F).
      *   *Constraint:* `CHECK (value != value)` (always fails/unknown). A self-referential check is hard in standard SQL (needs triggers or deferred constraints).
      *   *Distributed Systems:*
          *   Replica A says $p$, Replica B says $\neg p$.
          *   Merge policy: Last-Write-Wins (LWW) -> One survives (classical).
