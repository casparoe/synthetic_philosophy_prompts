  *(Refining Q1)*: In SQL, if I have a corrupt row, a `SELECT *` doesn't crash the server. But if I have a constraint `CHECK (1=0)`, the transaction aborts. The dialetheist wants the transaction to *commit* even if `1=0` is derived locally. So it's not just isolation; it's allowing the commit.

