      *   *Refinement:* In a CRDT or an MVCC system, you can have concurrent versions. But eventually, you usually resolve. A dialetheist says the *resolved state* is the contradiction.
      *   *Better Analogy:* A schema where a column `truth_value` is a bitmask. Bit 0 = True, Bit 1 = False. Classical logic: 01 or 10. SQL NULL: 00. Dialetheism: 11.
      *   *Constraint:* The `CHECK` constraint that references itself. In SQL, `CHECK (id = 1 AND truth = 'False')` where the row *is* the Liar.
      *   *Explosion:* In SQL, if a constraint fails, the transaction rolls back. The error doesn't propagate to delete other tables. That's isolation. In logic, $A \land \neg A \vdash B$. Dialetheists change the inference engine (the query planner) so it doesn't propagate.

  5.  **Addressing the Specific Questions:**
      *   *Q1: Explosion (Ex Contradictione Quodlibet).* Is it a logic feature or scoping?
