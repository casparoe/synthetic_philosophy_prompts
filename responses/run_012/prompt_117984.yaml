answer: |-
  **JOINT STATEMENT ON HERITABILITY ESTIMATES AND INTERPRETATION**
  **Signatories:** Dr. A. (Behavioural Genetics) & Dr. B. (Developmental Systems)
  **Date:** 24 May 2024
  **Context:** Adversarial Collaboration for [Student Name] Extended Project

  ### 1. Agreed Claims
  *Both signatories affirm the following propositions. Denial of these constitutes a misunderstanding of quantitative genetics.*

  1.  **Population Specificity:** Heritability ($h^2$) is a property of a specific population at a specific time under specific environmental conditions. It is not a property of a trait in the abstract, nor is it a property of an individual. An individual does not have a heritability.
  2.  **Intervention Neutrality:** A high heritability estimate within a population does not entail that the trait mean is immutable. Environmental interventions can shift population means substantially even when $h^2 \approx 1.0$ (e.g., phenylketonuria dietary management).
  3.  **Variance Dependence:** Heritability estimates can change without any alteration to the underlying DNA sequences. If environmental variance ($V_E$) decreases while genetic variance ($V_G$) remains constant, $h^2$ will rise. Conversely, if environmental conditions become more heterogeneous, $h^2$ can fall.
  4.  **The Seeds Analogy:** The thought experiment of genetically identical seeds planted in varied soils establishes that within-group variance can be 100% genetic while between-group differences (e.g., between fields) are 100% environmental. This logic applies to human populations; within-group $h^2$ licenses no inference regarding the cause of between-group mean differences.
  5.  **Public Terminology:** In public discourse, the term "innate" should not be used as a synonym for "heritable." Statements implying that high heritability renders social interventions futile are factually incorrect and should be corrected by both sides.

  ### 2. Residual Disagreements
  *The following disagreements remain substantive. Each position is phrased by its proponent.*

  **2.1. Bearing on Between-Population Differences**
  *   **Dr. A (BG):** While within-population $h^2$ does not *logically* dictate between-population causes, it is a relevant parameter. If a trait is highly heritable within Population X and Population Y, it is parsimonious to test whether genetic differences contribute to the mean difference, alongside environmental factors. Ruling out genetic contributions a priori is unscientific.
  *   **Dr. B (DSC):** Within-population $h^2$ is irrelevant to between-population differences because the causal architecture is not stable across groups. "Population" in humans is confounded by ancestry, geography, and systemic inequality. Treating genetic and environmental causes as additive and separable across groups ignores the historical co-construction of these variables.

  **2.2. Gene–Environment Interaction (G$\times$E) and Correlation (rGE)**
  *   **Dr. A (BG):** G$\times$E and rGE are variance components that can be modeled and estimated. Their presence complicates the partition but does not invalidate the additive genetic component. We can statistically control for rGE (e.g., using within-family designs) to recover unbiased $h^2$ estimates.
  *   **Dr. B (DSC):** G$\times$E and rGE are not merely statistical noise; they indicate that the "genetic" and "environmental" inputs are developmentally entangled. When genes influence exposure to environments (rGE), the assumption of independence required for variance decomposition is violated. The estimate becomes a model-dependent artifact rather than a biological parameter.

  **2.3. Polygenic Score (PGS) Portability**
  *   **Dr. A (BG):** The reduced predictive accuracy of PGS across ancestry groups is primarily a technical issue caused by Linkage Disequilibrium (LD) differences and the Euro-centric bias of GWAS discovery samples. It does not imply the genetic architecture of the trait differs fundamentally, only that our markers are less informative in non-European genomes.
  *   **Dr. B (DSC):** The failure of PGS portability is evidence that the scores capture population stratification and socio-historical context as much as biology. If the "genetic" signal were robust, it would not decay so sharply across contexts. This suggests the construct being measured is unstable, not just the study design.

  ### 3. Cruxes and Falsification Conditions
  *We identify three specific empirical questions where new data would shift our credences. We specify the dataset, the prediction, and what would count as evidence against our position.*

  **Crux 1: Socioeconomic Status (SES) and Heritability Magnitude**
  *   **Case:** Meta-analytic data on cognitive ability heritability across SES strata (e.g., *Tucker-Drob & Bates, 2016*; updated with UK Biobank within-family data).
  *   **Question:** Does $h^2$ for cognitive traits increase as environmental constraints (low SES) are removed?
  *   **Dr. A Prediction:** Yes. In high-SES environments, $V_E$ is suppressed, allowing $V_G$ to express more fully. $h^2$ should be higher in high-SES groups.
  *   **Dr. B Prediction:** No/Complex. In high-SES environments, new forms of environmental variance (enrichment differences) open up, potentially keeping $h^2$ stable or lowering it. The "scarcity" model is too linear.
  *   **Falsification:**
      *   **Against A:** If large-scale within-family studies show no correlation between SES and $h^2$ magnitude after controlling for measurement error.
      *   **Against B:** If $h^2$ approaches 1.0 in uniformly high-SES populations, demonstrating that environmental variance can be effectively minimized.

  **Crux 2: PGS Prediction in Adoptees**
  *   **Case:** Adopted children where biological parent PGS is known, and adoptive home SES is measured (e.g., *Minnesota Transracial Adoption Study* re-analyses or Swedish Adoption Registry).
  *   **Question:** Does the predictive validity of the biological PGS depend on the adoptive environment?
  *   **Dr. A Prediction:** The PGS effect size will be stable across high and low SES adoptive homes. G$\times$E for cognition is small.
  *   **Dr. B Prediction:** The PGS effect size will be significantly attenuated in low-SES adoptive homes. The genetic potential is contingent on environmental resources.
  *   **Falsification:**
      *   **Against A:** If the regression coefficient of PGS on outcome is significantly lower in the low-SES adoptive group (interaction $p < 0.01$).
      *   **Against B:** If the PGS predicts outcome equally well in deprived environments, indicating the biological pathway is robust to environmental degradation.

  **Crux 3: The "Income Shock" Natural Experiment**
  *   **Case:** A region undergoing rapid economic equalization (e.g., post-reunification East Germany or specific welfare expansion cohorts) where mean cognitive scores rise.
  *   **Question:** What happens to $h^2$ during the transition?
  *   **Dr. A Prediction:** $h^2$ will rise. As mean income rises and variance in deprivation falls, $V_E$ decreases. Since $h^2 = V_G / (V_G + V_E)$, the ratio increases.
  *   **Dr. B Prediction:** $h^2$ will fall or remain stable. The economic shock alters the developmental system itself (changing the norm of reaction), meaning $V_G$ is not constant. The variance decomposition model fails to capture the structural change.
  *   **Falsification:**
      *   **Against A:** If $h^2$ drops significantly while environmental variance (income inequality) drops.
      *   **Against B:** If $h^2$ tracks the variance algebra perfectly (rising as $V_E$ falls), confirming the stability of $V_G$ across the transition.

  ### 4. Verbal Disputes and Terminology
  *We acknowledge that portions of our disagreement stem from divergent definitions. Clarifying these does not resolve the empirical disputes but prevents talking past one another.*

  1.  **"Environment":**
      *   **Dr. A** uses "environment" to mean *residual variance* not accounted for by additive genetics in a linear model. It is a statistical bucket.
      *   **Dr. B** uses "environment" to mean *developmental resources* and relational contexts. It is a biological and sociological category.
      *   **Resolution:** We agree to specify "residual variance" vs. "measured environmental factors" in future writing.

  2.  **"Genetic Cause":**
      *   **Dr. A** defines a genetic cause as a *difference-maker*: variation in DNA sequence associated with variation in phenotype in a specific population.
      *   **Dr. B** defines a genetic cause as a *mechanistic producer*: the role DNA plays in the developmental process.
      *   **Resolution:** We agree that high heritability identifies difference-makers but does not describe the mechanistic process.

  3.  **"The Model":**
      *   **Dr. A** treats the ACE (Additive, Common, Unique) model as a useful approximation that converges on truth with better data.
      *   **Dr. B** treats the ACE model as a structural assumption that may impose false linearity on non-linear systems.
      *   **Resolution:** We acknowledge that Dr. B requires evidence of non-linearity to reject the model, while Dr. A requires evidence of model fit to retain it.

  ***

  **Signed:**
  *Dr. A (Behavioural Genetics)*
  *Dr. B (Developmental Systems)*
