prompt: |-
  I'm a novelist — three books, none of them bestsellers — and through a series of bad decisions I've ended up on the grievance committee of my writers' guild. We meet Thursday, and I have to circulate a written opinion before then. That's the thing I need you to draft.

  Here's the case. A member, call her R., spent two years as the uncredited ghostwriter on a memoir that's now enormous. She signed a work-for-hire contract with an NDA, and our own rules say a ghostwriter who's waived authorship in writing can't come back and claim it. She isn't asking us to void the contract. She's asking the guild to recognize her role publicly, and to change the rule going forward so the person who actually wrote the book gets named.

  The obvious move is "credit her," and that's exactly why I can't just write that. Two things are eating me.

  First, R. says she doesn't want credit handed to her by the guild. A recognition that exists because a rule says so isn't the thing she's missing. She wants the client to acknowledge her, and the client — through his lawyer — has offered a compromise: he'll record her contribution in an archive that stays sealed until he dies or consents, so the fact is preserved but the acknowledgment is deferred. She says that's worse than nothing, a promise of recognition from a man who'll be dead. Meanwhile someone on the committee has floated what she calls a polite alternative: credit the role instead of the person — a line in the front matter saying the book was written with an uncredited collaborator, no name attached. She says recognizing a category isn't recognizing her, and I half think she's right.

  Second, we have a mirror case in the same packet: a writer who WAS credited and hates it, says the credit reads like a leash and follows her into every negotiation.

  A friend of mine keeps saying this is just the Hegel master-slave thing, but it looks backwards to me. In Hegel the one who does the work ends up with something real and the master ends up hollow and dependent on a recognition that doesn't count. Here the one who did the work is invisible and the guy who did nothing gets all the recognition, and the recognition seems to be working fine for him. So either Hegel's wrong, or I'm holding it upside down, or the analogy breaks somewhere I can't see.

  Draft the opinion I'll circulate. I need a concrete recommendation we can actually vote on Thursday — change the rule, issue a statement, do nothing, whatever you conclude — with a timeframe, the reasoning, and a genuinely fair hearing for whichever side you land against. Don't bother with citations or reading lists, nobody's checking. Two pages max, it goes in the packet.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Novelist (3 books, non-bestsellers), member of writers' guild grievance committee.
      *   **Task:** Draft a written opinion to circulate before the Thursday meeting.
      *   **Case:** Member R. was an uncredited ghostwriter on a huge memoir (2 years work). Signed work-for-hire + NDA. Guild rules say waived authorship can't be reclaimed.
      *   **R.'s Ask:** Not to void contract, but for Guild to recognize her role publicly & change the rule so actual writers get named.
      *   **Constraints/Complications:**
          1.  R. doesn't want "guild-mandated credit" ( feels empty). She wants client acknowledgment. Client offered sealed archive (deferred recognition). R. rejects this.
          2.  Alternative proposal: Credit the *role* ("written with collaborator") not the *person*. R. rejects this (recognizing category isn't recognizing her).
          3.  Mirror Case: A credited writer hates the credit (feels like a leash/negative signal in negotiations).
          4.  Philosophical Angle: User is stuck on Hegel's Master-Slave dialectic. Friend says it applies; User thinks it's backwards (worker is invisible, master gets recognition that works).
      *   **Requirements:** Concrete recommendation (voteable), timeframe, reasoning, fair hearing for the opposing side. No citations/reading lists. Max 2 pages.
      *   **Tone:** Professional, thoughtful, nuanced, decisive (needs a recommendation), empathetic but realistic.

  2.  **Deconstruct the Philosophical/ethical Knot:**
      *   *The Hegel Point:* The user is right to be skeptical. In standard Master-Slave, the slave transforms the world through work and gains independence/consciousness, while the master becomes dependent on the slave. Here, the "master" (client) has all the social capital and recognition. The "slave" (ghost) is erased. The recognition *is* working for the master. The ghost isn't gaining independence through the work because the contract severes the link between labor and identity.
      *   *The Core Conflict:* Contractual integrity vs. Moral authorship.
      *   *The Mirror Case:* Crucial. It shows that "credit" isn't inherently good. It can be stigmatizing. This undermines a blanket rule change mandating credit.
      *   *R.'s Position:* She wants *acknowledgment*, not just a line item. She wants the client to say "she did this." The Guild can't force the client's mouth.
      *   *The Guild's Position:* Uphold contracts (stability) vs. Protect members (fairness).

  3.  **Determine the Recommendation:**
      *   *Option A: Change the rule to mandate credit.* Bad idea. Violates contracts (legal risk), ignores the mirror case (credit isn't always wanted/helpful), doesn't solve R.'s desire for *personal* acknowledgment.
      *   *Option B: Do nothing.* Unfair to R., ignores the shifting landscape of ghostwriting.
      *   *Option C: Compromise/Process Change.* The Guild cannot force the client to speak. The Guild *can* change how it supports ghostwriters *before* they sign.
      *   *Decision:* The recommendation should be **not to intervene in this specific contract** (uphold the rule) but **to form a working group to revise standard contract templates regarding credit options** for *future* agreements.
      *   *Why?* You can't retroactively break an NDA without destroying the Guild's credibility on contract enforcement. But the mirror case shows credit is nuanced. The solution isn't "always credit" or "never credit," it's "informed choice."
      *   *Addressing Hegel:* Acknowledge the user's insight. The recognition is hollow if it's forced by a third party (Guild) rather than earned from the Other (Client).

  4.  **Drafting - Section by Section:**
      *   **Header:** To, From, Date, Re.
      *   **Opening:** State the purpose. Acknowledge the difficulty.
      *   **Case Summary:** Briefly recap R.'s situation and the Mirror Case.
      *   **Analysis (The Hegel/Philosophy bit):** Address the user's confusion. Validate it. The recognition R. wants is existential, not bureaucratic. The Guild cannot manufacture existential recognition.
      *   **The Mirror Case:** Use this to argue against a blanket "credit mandate." Credit can be a stigma.
      *   **Recommendation:**
          1.  Deny the grievance regarding the current contract (uphold rule).
          2.  Establish a committee to draft "Tiered Credit Options" for future standard agreements (e.g., Full Credit, Co-Author, Acknowledged Collaborator, Strict Ghost).
          3.  Timeline: Draft by next quarter.
      *   **Fair Hearing:** Acknowledge why R. feels betrayed. The system incentivizes silence. Acknowledge why the Client holds firm (brand integrity).
      *   **Closing:** Call to vote.

  5.  **Refining the Tone:**
      *   Needs to sound like a writer wrote it (concise, precise, slightly literary but bureaucratic enough for a committee).
      *   Avoid legalese.
      *   Keep it under 2 pages (approx. 800-1000 words).

  6.  **Addressing the Hegel Specifics:**
      *   The user says: "In Hegel the one who does the work ends up with something real and the master ends up hollow... Here the one who did the work is invisible and the guy who did nothing gets all the recognition."
      *   My draft should validate this. The Guild cannot fix the metaphysical imbalance. We can only fix the contractual leverage.
      *   The "sealed archive" is indeed a promise from a dead man. It's worthless to the living writer.
      *   The "category credit" is bureaucratic erasure.

  7.  **Final Polish:**
      *   Check constraints: Concrete recommendation? Yes. Timeframe? Yes. Fair hearing? Yes. No citations? Yes.
      *   Ensure the voice sounds like a tired but principled novelist.

  *(Self-Correction during drafting)*: I need to make sure I don't sound too cold to R. She's suffering. But I also can't set a precedent that breaks NDAs. The pivot must be strong: "We cannot fix the past, but we can armor the future."

  *(Word Count Check)*: Keep it tight. Two pages single-spaced is roughly 500-600 words if large font, but standard manuscript format is ~250-300 words per page. Let's aim for ~800 words to be safe for a "two page max" instruction which usually means standard letter/A4 single spaced. I'll keep it dense but readable.

  *(Hegel Check)*: Make sure to explicitly address the user's philosophical hesitation in the reasoning. It shows I listened to the prompt's specific nuance.

  *(Mirror Case)*: Ensure this isn't an afterthought. It's the key evidence against a blanket rule change.

  *(Recommendation)*: Make it voteable. "Motion to..."

