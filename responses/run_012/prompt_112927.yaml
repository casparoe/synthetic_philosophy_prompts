answer: |-
  # UNITS OF SELECTION: A DECISION TREE
  **Starting Commitment:** We observe a trait spreading through a population because it makes the local group perform better, even though it reduces the survival/reproduction of the bearer (e.g., alarm calling in a *haystack* of relatives).

  ### 1. Is the claim "groups select" a fact about causal powers in nature, or a modeling choice?
  *   **Modeling Choice:** The "group" is just a way of partitioning gene frequency changes. There is no single true unit.
      *   ➔ **LEAF: Deflationary 'No Fact of the Matter'** (e.g., Godfrey-Smith).
  *   **Causal Fact:** Something real is being selected. **(Go to Q2)**

  ### 2. How is the "Group's" Fitness counted?
  *   **Aggregative:** Group fitness is the average of individual fitnesses (e.g., a *chicken flock* bred for total egg numbers). Individuals compete within groups.
      *   ➔ **LEAF: MLS1 (Multilevel Selection 1)**.
  *   **Collective:** The group itself is born, reproduces, or dies as a whole (e.g., a *species* that squeaks through a *mass extinction*).
      *   ➔ **LEAF: Species Selection/Sorting** (if the group is a lineage).
      *   ➔ **Go to Q3** (if the group is a social cluster).

  ### 3. Can the group possess adaptations that do not reduce to benefits for the underlying genes?
  *   **Yes:** The group is adapted for its own survival, potentially against genetic interests (e.g., *Wynne-Edwards* style regulation).
      *   ➔ **LEAF: Older Group-Selection Line.**
      *   *[⚠️ UNOCCUPIED/INCOHERENT]:* Modern biology largely rejects this. Without genetic heredity, group adaptations cannot evolve. This view is attractive historically but theoretically unstable.
  *   **No:** All adaptations must cash out in differential replication of heredity units. **(Go to Q4)**

  ### 4. What is the fundamental unit of selection?
  *   **The Replicator:** Only entities that make copies of themselves (genes) can be selected. Vehicles (organisms/groups) are just tools. (e.g., *green-beard genes*).
      *   ➔ **LEAF: Gene's-Eye View** (Dawkins/Williams).
  *   **The Interactor:** Selection acts on entities that interact with the environment (organisms, groups), regardless of whether they replicate directly. (e.g., *cancer lineage* inside a body vs. organism).
      *   ➔ **LEAF: Replicator/Interactor View** (Hull).
      *   *[⚠️ INDISTINGUISHABLE]:* Predictively, this leaf often overlaps with the Gene's-Eye View. They disagree on metaphysics (what *is* a unit) more than empirical outcomes.
  *   **Context-Dependent:** The unit shifts depending on the biological structure (e.g., genes in meiosis, cells in cancer, organisms in flocks).
      *   ➔ **LEAF: Pluralist 'It Depends on the Case'**.

  ***

  **NOTES ON EMPTY COMBINATIONS:**
  *   **MLS2 + Older Group Selection:** Nobody occupies "Group-level extinction" *plus* "Group adaptations unrelated to genes." This is incoherent; if groups go extinct, there must be heritable variance for selection to act.
  *   **Deflationary + Realism:** You cannot claim "selection is just a model" and "there is a true unit of selection." This combination is logically excluded by the first branch.

  **GUIDE TO EXAMPLES:**
  *   *Meiotic Drive:* Fits **Gene's-Eye** (gene benefits, organism loses).
  *   *Cancer Lineage:* Fits **Pluralist** or **Replicator/Interactor** (lower-level unit undermines higher-level).
  *   *Haystack/Relatives:* Fits **MLS1** or **Gene's-Eye** (kin selection equivalence).
