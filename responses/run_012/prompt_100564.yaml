      *   **User's Position:** A Hybrid Naturalist-Normativist view (similar to Wakefield's "Harmful Dysfunction" analysis, but with specific nuances).
          *   Clause 1 (Naturalist): Dysfunction = failure to perform selected effect function (evolutionary history). Objective, value-free.
          *   Clause 2 (Normativist): Harm = impairment of organism's ability to pursue life interests. Normative but *biologically fixed*, not socially constructed.
      *   **Task:** Act as a professional philosopher of medicine/biology. Stress-test the position. Do not defend it. Do not provide citations/reading lists.
      *   **Specific Requirements:**
          1.  List considerations against the position (ranked by severity). Distinguish predictions/forbiddances from compatibilities.
          2.  Analyze defender responses (concede vs. dismiss, legitimate vs. damage control).
          3.  Address specific pressure points: Reference class, Function concept (exaptation, vestigial), Harm clause (harmless dysfunctions, harmful non-dysfunctions), Boundary questions (disease/illness/disability/enhancement).
          4.  Verdict on insulation (is it refutable or defined away?).
      *   **Weighting:** Prioritize arguments about biological norms vs. interests and cases of clinician/biologist disagreement.
