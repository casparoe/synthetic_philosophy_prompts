      *   *Top Tier (Decisive):* The "Biology of Interests" problem. If "interests" aren't biologically fixed but implicitly value-laden, the hybrid collapses into normativism.
      *   *Top Tier (Decisive):* Evolutionary Mismatch. Selected functions causing harm in modern environments (e.g., insulin resistance in feast/famine cycles). Is obesity a disease or a function working as designed in a new context?
      *   *Mid Tier (Awkward):* Harmless Dysfunctions. Asymptomatic conditions. The view says "not a disease until harm." Clinicians treat them as diseases.
      *   *Mid Tier (Awkward):* Vestigial/Exaptive traits. Appendicitis. If no function, no dysfunction. So appendicitis isn't a disease?
      *   *Low Tier (Embarrassing):* Aging. Is aging a disease? Biology says programmed/senescent. View says dysfunction + harm.

  5.  **Drafting Section 2: Defender Responses (Concede vs. Dismiss):**
      *   *Mismatch:* Defender might say "It's a dysfunction relative to *current* environment." But SE theory is historical. This is a tension. Legitimate worry or damage control? Likely damage control.
      *   *Vestigial:* Defender says "Surrounding tissue has function." Weak.
      *   *Harmless:* Defender says "Pre-disease." Legitimate distinction.
      *   *Interests:* Defender says "Survival/Reproduction." But what about pain? Legitimate biological norm?

  6.  **Drafting Section 3: Pressure Points:**
