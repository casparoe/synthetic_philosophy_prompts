      *   *Harm Clause:* Grief. Dysfunctional? No. Harmful? Yes (impairs functioning). So not disease. Good. Pregnancy? Harmful (risk), functional. Not disease. Good. *But* what about "biologically fixed interests"? Does biology dictate *which* interests matter?
