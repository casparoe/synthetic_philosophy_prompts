  # The Free-Floating Rationale Tree

  This tool is designed to help your group locate their intuition about "purposes" in a world without a designer. Read the questions in order. Answer them based on your gut feeling about the cases (the river, the gills, the glass, etc.), not based on what you think the "correct" philosophical answer is. Follow the branches to find your position.

  ### The Decision Tree

  **Question 1: The Status of the Talk**
  When we say "The gills are *for* breathing" or "The river cuts *so as to* reach the sea," are we describing a **real feature** of the gills or the river, or are we just using a **convenient figure of speech**?
  *   **Convenient figure of speech** → Go to Question 2.
  *   **Real feature** → Go to Question 3.

  **Question 2: The Value of the Fiction**
  If it is just a figure of speech, is this way of talking a **harmful mistake** that misleads us about how the world works, or is it a **harmless shortcut** that helps us predict things?
  *   **Harmful mistake** → **Leaf A**
  *   **Harmless shortcut** → **Leaf B**

  **Question 3: The Need for a Mind**
  If it is a real feature, does this "purpose" require a **mind or subject** (like a designer, a user, or God) to hold it, or can the purpose exist **entirely on its own** in the object?
  *   **Requires a mind** → **Leaf C**
  *   **Exists on its own** → Go to Question 4.

  **Question 4: The Need for a Plan**
  If it exists on its own, does the object need to carry some kind of **instruction, code, or blueprint** (like DNA or computer software) to have a purpose?
  *   **Needs an instruction** → **Leaf D**
  *   **No instruction needed** → Go to Question 5.

  **Question 5: The Need for a History**
  If it needs no instruction, does the object still need a **history of being chosen** for this job (like evolution or market competition) to have a purpose?
  *   **Needs a history** → **Leaf E**
  *   **No history needed** → Go to Question 6.

  **Question 6: The Scope of Purpose**
  If it needs no history, does a simple physical event (like a **stone falling** or **glass cracking**) also have a purpose, or is purpose limited to **complex living things**?
  *   **Yes, even simple physics** → **Leaf F**
  *   **No, only complex things** → **Leaf G (Diagnosed Below)**

  ---

  ### The Leaves (Positions)

  Here are the positions you might land on. Each includes the "awkward commitment" you must accept if you hold this view, and how it judges your seven test cases.

  #### Leaf A: The Eliminativist
  *   **Position:** There are no reasons here at all, only causes, and this whole manner of speaking is a mistake.
  *   **Most Awkward Commitment:** You must insist that saying "the heart is for pumping" is as scientifically wrong as saying "the sun revolves around the earth."
  *   **Case Implications:**
      *   Thermostat, Gills, Web, Auction, Enzyme, River, Glass: **None of these have reasons.** They merely have causes. To say otherwise is error.

  #### Leaf B: The Instrumentalist
  *   **Position:** These rationales are useful fictions with no fact of the matter.
  *   **Most Awkward Commitment:** You must admit that your language is strictly false, but argue that we are better off keeping the lie because it helps us navigate the world.
  *   **Case Implications:**
      *   Thermostat, Gills, Web, Auction, Enzyme, River, Glass: **All are false but useful.** It is okay to say the gills are "for" breathing if it helps you understand the fish, provided you know there is no actual "for-ness" in the gills.

  #### Leaf C: The Subjectivist
  *   **Position:** A reason essentially belongs to a subject, so that there can be no reason without a reasoner.
  *   **Most Awkward Commitment:** You must accept that if no mind (human or divine) ever thought about a fish, its gills would have no function, only motion.
  *   **Case Implications:**
      *   Thermostat, Auction: **Have reasons** (assigned by designers/users).
      *   Gills, Web, Enzyme, River, Glass: **Have no reasons** (unless you posit a Divine Designer). They are only *as if* they had purposes relative to our interests.

  #### Leaf D: The Representationalist
  *   **Position:** A rationale needs a representation (gene, signal, disposition) but not a reasoner.
  *   **Most Awkward Commitment:** You must claim that a machine without code, or a trait without DNA, cannot have a function even if it does the job perfectly.
  *   **Case Implications:**
      *   Thermostat, Gills, Web, Enzyme: **Have reasons** (they carry information/code/DNA).
      *   Auction, River, Glass: **Have no reasons.** The auction has rules but no biological code; the river and glass carry no blueprint.

  #### Leaf E: The System Realist
  *   **Position:** These rationales are as real as anything else and come in degrees.
  *   **Most Awkward Commitment:** You must accept that a heart has a "stronger" reason than a vestigial organ, and that purpose is an objective feature derived from a history of selection.
  *   **Case Implications:**
      *   Thermostat, Gills, Web, Auction, Enzyme: **Have reasons** (all have a history of design or selection).
      *   River, Glass: **Have no reasons.** They reliably track outcomes, but they were not *selected* for doing so.

  #### Leaf F: The Natural Teleologist
  *   **Position:** Nature has ends of its own that need neither selection nor representation.
  *   **Most Awkward Commitment:** You must defend the idea that a cracking pane of glass is "trying" to find its weakest point in the same way a spider is "trying" to catch a fly.
  *   **Case Implications:**
      *   Thermostat, Gills, Web, Auction, Enzyme, River, Glass: **All have reasons.** Purpose is a fundamental feature of physics, not just biology or design.

  #### Leaf G: The Emergentist (Diagnosed Empty)
  *   **Position:** Purpose exists in complex things (gills) but not simple things (glass), without requiring history or representation.
  *   **Diagnosis:** **Incoherent / Unexplored.**
  *   **Why:** If you deny that history or representation creates the purpose, you have no logical tool to distinguish the gills from the glass. Both are just matter in motion. To say the gills have purpose but the glass does not, without citing history or information, implies a magical threshold of complexity that no one has successfully defined.

  ---

  ### Notes for the Discussion Leader

  **1. Unseparable Leaves**
  Your tree may struggle to separate **Leaf D (Representationalist)** and **Leaf E (System Realist)** using *only* the seven cases provided.
  *   *Why:* In your list, things with a history (Gills, Web) also have representation (DNA, Instinct). Things without history (River, Glass) also lack representation.
  *   *To Separate Them:* You would need a case like a **randomly generated computer program** that works perfectly but has no history of selection (favors Representationalism), or a **biological spandrel** (a trait caused by evolution but not selected for) which might favor System Realism if they argue it acquires function later. For your group, treat these as neighboring positions that agree on 90% of cases but disagree on *why* the function exists.

  **2. The Collapse Question**
  **Question 1 (The Status of the Talk)** is the single point of greatest leverage.
  *   If a participant answers "Convenient figure of speech," **four** distinct realist positions (C, D, E, F) instantly collapse into just **two** non-realist positions (A, B).
  *   If you find your group is stuck, ask them to debate Question 1 first. It is the fork in the road that determines whether the rest of the tree matters.

  **3. The Cracking Glass**
  This is your most powerful tool for testing **Leaf F (Natural Teleologist)**.
  *   Most people will instinctively say the glass has no "reason" to crack.
  *   If someone insists the glass *does* have a reason (it "solves" the problem of stress), they are likely a Natural Teleologist.
  *   If they say the glass has no reason but the Gills *do*, they must explain the difference without using "God" (Leaf C), "DNA" (Leaf D), or "Evolution" (Leaf E). This often forces them back to Question 1 (maybe it's just a figure of speech?).
