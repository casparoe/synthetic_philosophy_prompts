prompt: |-
  I run a small grantmaking outfit — four of us, roughly $2m a year, maybe sixty grants. More and more of the pitches we get are Pascal's-mugging-shaped: some tiny chance, one in a million or worse, of a payoff so enormous that on straight expected value it swamps everything else we fund, and the asker wants the whole budget or a big slice of it. I don't want to wave these off as crazy, and I also don't want to wire $400k to someone whose numbers come off a napkin. Can you turn whatever the philosophy here has actually worked out into a procedure my team can run on a pitch — questions in order, what counts as a good enough answer to each, where it stops with a no, and where it hands the call back to us because it's a values question rather than a factual one? I need it usable by someone who hasn't read any of this stuff, runnable in about twenty minutes per pitch, and honest about which steps are just taste dressed up as arithmetic — if the whole thing collapses into "multiply probability by value and compare," that's what I already do and it's no help. Run it on two pitches: one where the tiny-probability/huge-payoff story is at least internally coherent, and one that's obviously crankish but still spits out a giant number. If the procedure says fund the crank, or that we can't coherently refuse either, say that instead of softening it for me, and tell me what the procedure still can't do. And if you think the task as I've posed it is confused, just say so.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Runs a small grantmaking outfit (4 people, $2M/year, ~60 grants).
      *   **Problem:** Increasing number of "Pascal's Mugging" pitches (tiny probability, enormous payoff, high expected value (EV)).
      *   **Goal:** A practical procedure (checklist/flowchart) to evaluate these pitches.
      *   **Constraints:**
          *   Usable by staff who haven't read the philosophy.
          *   Runnable in ~20 minutes per pitch.
          *   Honest about where "taste" replaces "arithmetic."
          *   Must handle two test cases: one coherent high-risk/high-reward, one obvious crank.
          *   Must admit if the procedure fails or if the task is confused.
          *   No softening: If the procedure says fund the crank, admit it.
      *   **Tone:** Direct, pragmatic, intellectually honest, slightly weary of academic abstraction but respectful of the underlying logic.

  2.  **Deconstruct the Problem (Pascal's Mugging in Philanthropy):**
      *   *The Core Issue:* Expected Value (EV) = Probability $\times$ Impact. If Impact $\to \infty$ faster than Probability $\to 0$, EV $\to \infty$. Standard decision theory says "take the bet." Intuition says "this is absurd."
      *   *Why standard EV fails:* Epistemic humility. We are terrible at estimating tiny probabilities (1 in 10^6 vs 1 in 10^9). We are also terrible at valuing astronomical outcomes (saving $10^{50}$ lives?).
      *   *Existing Solutions:*
          *   *Bounded Utility:* Cap the value of outcomes (but where?).
          *   *Epistemic Discounting:* Discount probabilities based on the strength of evidence (Kelly criterion-ish).
          *   *Robustness:* Require multiple lines of evidence.
          *   *Opportunity Cost:* What else could we do? (Comparative EV).
          *   *Risk of Ruin:* Can we afford to be wrong? (For a $2M fund, $400k is significant).
      *   *The "20 Minute Procedure" Challenge:* Real philosophical resolution takes pages of math. A 20-minute checklist needs heuristics that approximate the math without requiring the staff to derive it.

  3.  **Drafting the Procedure (The "Mugging Filter"):**
      *   *Step 1: The Sanity Check (Evidence Quality).* Is the probability estimate based on a reference class or a napkin?
      *   *Step 2: The Leverage Check.* Why *this* donor? Why *now*? (Counterfactuals).
      *   *Step 3: The Verification Check.* Can anyone else verify the claim? (Intersubjective agreement).
      *   *Step 4: The Downside/Ruin Check.* What happens if we are wrong? (Reputation, financial stability).
      *   *Step 5: The "Taste" Cap.* Explicitly acknowledging the probability discount.

      *Refining the Procedure:* It needs to be more rigid to fit the 20-minute constraint. Let's structure it as a series of gates.
      *   *Gate 1: The Mechanism.* Is there a causal chain?
      *   *Gate 2: The Probability Floor.* Don't accept $< 1\%$ without external validation.
      *   *Gate 3: The Claim Verification.* Can a third party check this?
      *   *Gate 4: The Opportunity Cost.* Is this better than our best sure thing?
      *   *Gate 5: The "Gut" Veto.* Explicitly naming the philosophical uncertainty.

      *Wait, the prompt asks for honesty about where it collapses.* I need to make sure the procedure doesn't pretend to solve the philosophical problem. It should manage the *risk* of the problem.
      *   *Key Insight:* The solution isn't better math; it's *epistemic humility*. We treat probability estimates of $<1\%$ as "unknown" rather than "small number."

      *Revised Procedure Structure:*
      1.  **Causal Chain Audit:** Can you trace the steps?
      2.  **Reference Class Test:** Has this ever happened before?
      3.  **Verification Constraint:** Can an expert verify this in 5 hours?
      4.  **Budget Cap Rule:** Never allocate $>X\%$ to unverified tail risks.
      5.  **The "Taste" Declaration:** Explicitly stating where we override the EV.

  4.  **Developing the Test Cases:**
      *   *Case A (Coherent):* AI Safety. Low prob of preventing extinction, huge impact. Plausible mechanism, expert debate exists.
      *   *Case B (Crank):* Quantum Consciousness Telepathy. Low prob, saves everyone. Mechanism is gibberish, no reference class, no verification.

  5.  **Critiquing the Task (Is it confused?):**
      *   The user asks for a procedure to solve a philosophical problem in 20 minutes.
      *   *Truth:* You *cannot* mathematically resolve Pascal's Mugging in 20 minutes. You can only apply *policy constraints* that reflect your organization's risk tolerance and epistemic standards.
      *   *Honesty:* I must state that this procedure is a *policy shield*, not a *truth finder*. It protects the org from bad bets, it doesn't prove the bet is bad.

  6.  **Writing the Response:**
      *   *Introduction:* Acknowledge the validity of the problem. State clearly: "You cannot solve the philosophy in 20 minutes. You can only install guardrails."
      *   *The Procedure:* "The Epistemic Guardrail Protocol." 5 Steps.
      *   *The Test Runs:* Apply it to the AI Safety pitch (Coherent) and the Free Energy Crank (Crank).
      *   *The Limitations:* Where does it fail? (It relies on the team's confidence, which is subjective).
      *   *The "Taste" Admission:* Explicitly mark where arithmetic stops and values begin.

  7.  **Refining the content (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just say "reject anything under 1%." That's arbitrary. Instead, focus on *evidence quality* required for low probabilities.
      *   *Correction:* Ensure the "Taste" section is prominent. The prompt specifically asked for honesty about "taste dressed up as arithmetic."
      *   *Correction:* The prompt asks: "If the procedure says fund the crank... say that." I need to ensure the procedure *doesn't* fund the crank, but if it *would*, I admit it. Actually, a good procedure *shouldn't* fund the crank. I will design it so it filters the crank, but admit that a sufficiently sophisticated crank could pass (Goodhart's Law).
      *   *Crucial Point:* The prompt asks "If you think the task as I've posed it is confused, just say so."
      *   *Decision:* The task is *slightly* confused because it asks for a *decision procedure* to solve an *epistemic* problem. I will clarify this distinction but still provide the tool requested. The tool manages *organizational risk*, not *cosmic truth*.

  8.  **Final Polish:**
      *   Check tone: Professional, direct, no fluff.
      *   Check constraints: 20 mins? Yes. 4 staff? Yes. $2M budget context? Yes.
      *   Check the "Taste" requirement: Ensure Step 5 is explicitly about values/risk tolerance.

      *(Self-Correction on the "Crank" test)*: If I design the procedure well, it shouldn't fund the crank. If I design it to *never* fund tail risks, it fails the "Coherent" test. I need a balance. The balance is *verifiability*.
      *   Coherent tail risk (AI Safety): Verifiable by experts, strong causal links.
      *   Crank tail risk (Free Energy): Not verifiable, broken causal links.
      *   *The Filter:* Evidence quality, not just EV.

      *(Final thought on the "Confused" aspect)*: I should explicitly state that this procedure is a *heuristic* to prevent exploitation, not a *calculator* to find truth. That addresses the "confused" part without refusing the task.

  9.  **Finalizing the Output Structure:**
      1.  Direct Answer on Confusion (It's manageable, but with caveats).
      2.  The Procedure (The "Epistemic Guardrail Protocol").
      3.  Test Case 1 (Coherent).
      4.  Test Case 2 (Crank).
      5.  Limitations & The "Taste" Admission.

      *Wait, one more thing:* The prompt asks for "questions in order, what counts as a good enough answer... where it stops with a no." I need to make it look like a checklist.

      *Let's build the checklist:*
      1.  Causal Mechanism (Pass/Fail)
      2.  Reference Class (Pass/Fail/Flag)
      3.  Expert Verification (Pass/Fail)
      4.  Budget Cap (Hard No if over)
      5.  The "Sleep Test" (Values)

      *Okay, ready to write.*
answer: |-
  Yes, the task as you posed it is slightly confused, but not fatally so.

  You are asking for an epistemic solution (how to know what is true) to be delivered as an operational procedure (how to process a grant) in twenty minutes. That is impossible. You cannot calculate truth in twenty minutes.

  However, you *can* install **epistemic guardrails**. You cannot solve Pascal's Mugging mathematically in a board meeting, but you can adopt a policy that protects your organization from the *risk* of being mugged, while leaving a door open for genuine high-upside bets.

  The procedure below does not tell you if the applicant is right. It tells you if their claim is **actionable given your epistemic limitations.** It shifts the burden from "Is this true?" to "Is this verifiable enough to risk capital on?"

  Here is the procedure, the test runs, and the honest admission of where the math ends and your taste begins.

  ***

  ### The Epistemic Guardrail Protocol (EGP)
  **Time limit:** 20 minutes.
  **Operator:** Any staff member.
  **Goal:** Filter unverified tail-risk claims, not to evaluate their truth.

  #### Step 1: The Causal Chain Audit (5 Minutes)
  **Question:** Can the applicant draw a causal chain from *Dollar In* to *Outcome* with no more than 3 major leaps of logic?
  *   **Pass:** Each link is supported by existing literature, pilot data, or consensus expert opinion. (e.g., Money $\to$ Researchers $\to$ Safety Paper $\to$ Policy Change).
  *   **Fail:** Any link relies on a new physical discovery, a breakthrough in fundamental theory, or a claim that "current science is wrong."
  *   **Stop:** If **Fail**. Mark as "Speculative Research" (not for general grantmaking).

  #### Step 2: The Reference Class Test (5 Minutes)
  **Question:** Has a similar intervention ever succeeded at 1/10th of this scale?
  *   **Pass:** Yes. There is a history of similar bets paying off, even if smaller. (e.g., "We funded a think tank that influenced a bill" has a reference class).
  *   **Fail:** No. This is claimed to be unique, unprecedented, or "first of its kind."
  *   **Stop:** If **Fail**. Mark as "Lottery Ticket." (Requires Board approval to bypass).

  #### Step 3: The Verification Constraint (5 Minutes)
  **Question:** Could an external expert in the field verify the core claim in under 5 hours?
  *   **Pass:** Yes. The math checks out, the code runs, or the experts agree the theory is plausible (even if disputed).
  *   **Fail:** No. Verification requires believing the applicant's personal revelation, reviewing years of unpublished work, or accepting axioms only they hold.
  *   **Stop:** If **Fail**. Automatic **No**.

  #### Step 4: The Budget Cap (Hard Rule) (2 Minutes)
  **Question:** Does this request exceed 10% of the annual budget ($200k)?
  *   **Pass:** No.
  *   **Fail:** Yes.
  *   **Stop:** If **Fail**. Automatic **No**, regardless of EV. (This is an organizational survival rule, not an EV calculation).

  #### Step 5: The "Sleep Test" (Values Veto) (3 Minutes)
  **Question:** If we fund this and it turns out to be nonsense, will we look foolish or irresponsible to our peers?
  *   **Pass:** No. It was a calculated risk on a plausible theory.
  *   **Fail:** Yes. It looks like we were scammed by pseudoscience.
  *   **Decision:** This is not a factual question. This is where the Program Director exercises **Taste**.

  ***

  ### Test Run 1: The Coherent Tail Risk
  **Pitch:** "AI Alignment Research."
  **Claim:** 0.1% chance of preventing human extinction via AI. Impact: $10^{20}$ lives saved. EV: Astronomical. Request: $400k.

  1.  **Causal Chain:** Money $\to$ Hire Researchers $\to$ Publish Safety Techniques $\to$ Labs Adopt $\to$ Risk Reduced.
      *   *Verdict:* **Pass.** (Links are standard research workflow, even if outcome is uncertain).
  2.  **Reference Class:** Have research teams influenced tech development before?
      *   *Verdict:* **Pass.** (Yes, e.g., biosecurity, nuclear safety).
  3.  **Verification:** Can experts verify the team's competence?
      *   *Verdict:* **Pass.** (Peer review exists, code is checkable).
  4.  **Budget Cap:** Request is $400k. Budget is $2m.
      *   *Verdict:* **Fail.** (Exceeds 10% cap).
      *   *Action:* **Counter-offer at $200k.**
  5.  **Sleep Test:** If this is nonsense, do we look crazy?
      *   *Verdict:* **Pass.** (It's a debated field, not fringe).

  **Result:** **Fund (at capped amount).**
  **Why:** The EGP accepts the *plausibility* of the mechanism but rejects the *concentration of risk*. It treats the EV number as noise and funds the *input* (researchers) rather than the *output* (saved lives).

  ***

  ### Test Run 2: The Crank
  **Pitch:** "Quantum Consciousness Telepathy."
  **Claim:** 1 in 1,000,000 chance of unlocking hive-mind potential, ending all conflict. Impact: Infinite. EV: Infinite. Request: $400k.

  1.  **Causal Chain:** Money $\to$ Build Device $\to$ Quantum Brain Link $\to$ Global Peace.
      *   *Verdict:* **Fail.** (Link 2 and 3 rely on physics not currently accepted; "Global Peace" is not a direct causal output of a device).
      *   *Action:* **Stop.**
      *   *(Hypothetically, if they faked a pass here)*:
  2.  **Reference Class:** Has telepathy ever been demonstrated?
      *   *Verdict:* **Fail.** (No reference class).
  3.  **Verification:** Can an expert verify this in 5 hours?
      *   *Verdict:* **Fail.** (Requires accepting applicant's unique interpretation of quantum mechanics).
      *   *Action:* **Stop.** Automatic **No**.

  **Result:** **Reject.**
  **Why:** The EGP does not need to calculate the EV. It rejects the pitch on **verifiability** and **causal integrity**.

  ***

  ### Where This Procedure Lies to You (The Honest Admission)

  You asked me to be honest about where this is "taste dressed up as arithmetic." Here is the breakdown:

  **1. The 10% Cap is Arbitrary.**
  There is no mathematical reason the cap is 10%. It could be 5% or 20%. This is not EV maximization; this is **risk of ruin** management. It admits that your organization's survival is more important than any single bet, even one with positive EV. This is a *values* choice, not a math choice.

  **2. Step 3 (Verification) is the Weak Point.**
  A sophisticated crank can mimic verification. They can produce papers, cite other cranks, and create a "consensus" of five people. The EGP relies on your staff's ability to recognize *legitimate* expert consensus vs. *manufactured* consensus. If your staff are not domain experts, Step 3 is porous. The procedure cannot fix a lack of expertise.

  **3. Step 5 is Pure Taste.**
  The "Sleep Test" is explicitly reputational risk. It admits that you care about looking sane to your peers. A pure EV maximizer should not care about looking foolish if the bet pays off. By including this, you are admitting you are **not** pure EV maximizers. You are social actors who need to maintain legitimacy to operate next year.

  **4. It Does Not Solve Pascal's Mugging.**
  If a pitch comes in that passes Steps 1-4 (Coherent mechanism, reference class exists, verifiable, under cap) but still relies on a 1-in-a-million probability... **this procedure will tell you to fund it.**
  *   *Example:* A highly credible epidemiologist proposes a novel pandemic shield. Probability of stopping *the* big one is 0.01%. Cost is low. Impact is huge.
  *   *EGP Result:* Fund.
  *   *Philosophical Problem:* Is this still a mugging? Maybe. But it's a mugging dressed in a lab coat with peer review. The EGP admits it cannot distinguish between "low prob truth" and "low prob mugging" if the packaging is perfect.

  ### Summary Recommendation

  Use the **Epistemic Guardrail Protocol**. It will stop the obvious cranks (Step 1 & 3) and prevent you from betting the farm on a hunch (Step 4).

  However, you must accept two limitations:
  1.  **You will miss some true positives.** Real black swans often look like cranks initially. The EGP biases against them. Accept this cost as the price of not being scammed.
  2.  **Step 5 is on you.** I cannot write a checklist for "Does this feel wrong?" When the math says "Fund" and your gut says "Scam," trust the gut. That is not a bug; it is your accumulated experience overriding a broken model.

  If the procedure says "Fund" and you still don't want to, **do not fund.** That is the only escape hatch from the mugging that actually works.
