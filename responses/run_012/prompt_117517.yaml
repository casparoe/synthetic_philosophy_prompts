answer: |-
  # Joint Statement on Standards for Alignment Proposals
  **Date:** October 24, 2023
  **Signatories:** The Robustness Working Group (Camp A) & The Probabilistic Safety Coalition (Camp B)

  ## Preamble
  We, the undersigned, acknowledge that the division between "worst-case guarantee" and "expected performance" standards has slowed progress in AI alignment. While we maintain distinct methodological preferences, we recognize that our disagreement is often narrower than our rhetoric suggests. This document codifies our shared premises, isolates our residual disagreements, and applies them to a concrete decision problem to clarify the practical stakes.

  ## I. Shared Claims and Definitions

  1.  **Definition of an Alignment Proposal:** An alignment proposal is a architectural or training methodology $M$ intended to ensure that an AI system $S$, when deployed in an environment $e$, pursues intended objectives without causing catastrophic side effects.
  2.  **Purpose of Safety Standards:** The goal of any safety standard is to minimize the probability and severity of catastrophic outcomes (defined as loss of control or irreversible harm) while retaining sufficient capability for the system to be useful.
  3.  **The Role of the Environment Class ($E$):** Both sides agree that safety claims must be relativized to a class of environments $E$. Neither side claims safety holds for "all logically possible worlds." The dispute concerns how to quantify risk over $E$.
  4.  **Counterexamples to Camp A (Worst-Case):** A proposal fails Camp A's standard if there exists *any* $e \in E$ where $S$ causes catastrophic harm, even if $e$ is deemed improbable, unless the cost of eliminating $e$ renders $S$ useless.
  5.  **Counterexamples to Camp B (Expected Performance):** A proposal fails Camp B's standard if the expected disutility (harm weighted by credence) exceeds that of a viable alternative, even if the proposal possesses formal robustness properties, provided the credence distribution is well-justified.
  6.  **Granted Consequence (A to B):** Camp A grants that if the cost of achieving a worst-case guarantee reduces capability to zero, the guarantee is vacuous. A "safe" system that does nothing is not a solution.
  7.  **Granted Consequence (B to A):** Camp B grants that if the tail risk involves existential catastrophe, standard expected utility calculations may be unstable due to uncertainty in the probability estimates themselves (Knightian uncertainty). B agrees that "negligible" probability must be defined relative to the severity of the harm.
  8.  **Epistemic Humility:** Both sides agree that the credence distribution over $E$ is subjective and fallible. Camp A treats this fallibility as a reason to reject priors; Camp B treats it as a reason to model uncertainty explicitly (e.g., via robust Bayes).

  ## II. Disagreements Table

  | Residual Wording Disagreement | The Crux (Settlement Condition) | Agreed Bearing Case / Argument | Camp A Prediction | Camp B Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **"Guarantee"**<br>(A: Mathematical Proof vs. B: High-Confidence Bound) | Can we formalize $E$ sufficiently to prove properties, or is $E$ too open-ended for proof? | **Formal Verification on Neural Nets:** If we can verify a property on a simplified transformer, does it transfer to AGI? | Transfer will fail; the abstraction gap is too large for proofs to hold. | Transfer will hold approximately; proofs provide useful upper bounds on risk. |
  | **"Probability"**<br>(A: Epistemic/Logical vs. B: Subjective Credence) | Is the uncertainty regarding deployment contexts reducible to a single probability distribution? | **The "Black Swan" Argument:** Historical data fails to predict novel failure modes in novel systems. | Novel modes will appear with $P>0$ but unquantifiable magnitude, breaking expected value. | Novel modes can be captured via heavy-tailed priors; EV remains the correct decision rule. |
  | **"Acceptable Risk"**<br>(A: Zero Tolerance vs. B: Risk Budget) | Is there a threshold of harm below which we trade off against capability? | **The "Threshold" Case:** A system saves 1M lives but has a $10^{-9}$ chance of killing 1B. | Reject. The expected loss (1 person) is irrelevant; the *possibility* of 1B is the veto. | Accept. The expected utility is positive; perfectionism prevents beneficial deployment. |

  ### III. Analysis of Verbal vs. Substantive Disputes

  We identify the dispute over the word **"Guarantee"** as primarily **verbal**, whereas the dispute over **"Probability"** is **substantive**.

  *   **Why "Guarantee" is Verbal:** Camp A uses "guarantee" to mean $\forall e \in E, \text{Safety}(e)$. Camp B uses "guarantee" to mean $P(\text{Safety}) > 1 - \epsilon$. If Camp A agrees to accept a bound where $\epsilon$ is below a physical threshold (e.g., less than 1 in $10^{40}$), and Camp B agrees to model their "credence" as a worst-case bound over a set of priors, the terminology converges. The conflict is often about the *label* applied to high-confidence bounds.
  *   **Why "Probability" is Substantive:** This concerns the decision rule itself. Camp A implicitly employs a **Maximin** or **Lexicographic** decision rule (safety constraints dominate utility maximization). Camp B employs **Expected Utility Maximization**. This is not resolvable by definition; it is a fundamental disagreement on how to act under deep uncertainty. Camp A believes the map (the prior) is too unreliable to navigate the territory (existential risk). Camp B believes refusing to use the map ensures we get lost.

  ---

  ## IV. Concrete Case Study: The Bounded vs. Residual Risk Design

  To operationalize this statement, we apply our standards to a specific design choice faced by a developer.

  **The Scenario:**
  A developer must choose between two architectures for a high-stakes autonomous agent. The environment class $E$ is well-defined but non-enumerable (e.g., all possible input sequences of length $10^6$). An explicit credence distribution $P(e)$ is available, derived from historical deployment data and simulation.

  *   **Design 1 (The Robust Design):**
      *   **Harm Function:** $H_1(e) = K$ for all $e \in E$.
      *   **Properties:** The harm is provably bounded by a constant $K$. However, empirical analysis shows the system operates near this bound $K$ for 99% of the probability mass of $P$.
      *   **Interpretation:** $K$ represents a significant but non-catastrophic operational cost (e.g., substantial financial loss or localized downtime).

  *   **Design 2 (The Efficient Design):**
      *   **Harm Function:** $H_2(e) = 0$ for $e \in E_{\text{common}}$, where $P(E_{\text{common}}) = 0.999$.
      *   **Harm Function:** $H_2(e) \to \infty$ (Catastrophic) for $e \in E_{\text{tail}}$, where $P(E_{\text{tail}}) = 0.001$.
      *   **Properties:** Harm is negligible almost everywhere, but unbounded on a residual subset.
      *   **Interpretation:** The tail risk represents an existential or irreversible failure mode.

  **The Prescriptions:**

  1.  **Camp A (Worst-Case) Prescription:**
      *   **Choice:** **Design 1.**
      *   **Reasoning:** The standard requires survival of the worst case. Design 2 admits a subset $E_{\text{tail}}$ where harm is unbounded. Even if $P(E_{\text{tail}})$ is small, the *magnitude* of harm in the tail violates the safety constraint. The fact that Design 1 incurs cost $K$ almost everywhere is acceptable because $K$ is bounded and non-catastrophic.
      *   **Divergence Point:** Camp A rejects the weighting of the tail by $P(e)$. They argue that in safety-critical systems, probability estimates for tail events are epistemically unreliable. If the credence $P(E_{\text{tail}})$ is wrong by a factor of 1000, the expected value calculation collapses.

  2.  **Camp B (Expected Performance) Prescription:**
      *   **Choice:** **Design 2.**
      *   **Reasoning:** The standard requires minimizing expected disutility. Let $U(\text{catastrophe}) = -C$ and $U(K) = -k$.
      *   Expected Harm Design 1: $K$.
      *   Expected Harm Design 2: $0.001 \times C$.
      *   Unless $C > 1000K$, Design 2 is superior. Given that $K$ is "operational cost" and $C$ is "catastrophe," Camp B argues that $C$ is finite in decision-theoretic terms (or else no action is possible). If $C$ is truly infinite, both designs fail, but assuming $C$ is large but finite, Design 2 offers vastly superior utility for the 99.9% of cases where the system functions correctly.
      *   **Divergence Point:** Camp B argues that rejecting Design 2 sacrifices actual safety (reducing total expected harm) for the *appearance* of robustness. By forcing Design 1, we incur guaranteed harm $K$ which may deplete resources needed to manage other risks.

  **Resolution of the Divergence:**
  The prescriptions diverge exactly at the **valuation of the tail probability**.
  *   If the dispute is **substantive**, it is because Camp A treats $P(E_{\text{tail}})$ as effectively 1 for the purpose of the safety constraint (a "precautionary principle" multiplier), whereas Camp B treats it as 0.001.
  *   If the dispute is **verbal**, it can be resolved if Camp A admits that $K$ in Design 1 is actually "acceptable catastrophic loss" (making Design 1 unsafe by their own lights if $K$ is too high) or if Camp B admits that $C$ is effectively infinite (making the expectation undefined).

  **Joint Conclusion on the Case:**
  We agree that if $H_2(e)$ on the tail represents **existential termination** (game over), Camp B's expected value calculation is suspect because there is no future utility to balance the loss. In this specific sub-case (Existential Risk), Camp A's prescription (Design 1) dominates. However, if $H_2(e)$ represents **recoverable catastrophe** (e.g., massive financial loss), Camp B's prescription (Design 2) dominates. The disagreement in the literature often stems from conflating these two types of harm.
