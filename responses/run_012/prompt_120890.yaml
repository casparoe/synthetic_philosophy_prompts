answer: |-
  You have diagnosed the symptom correctly, but the pathology is slightly more complex than a simple verbal dispute or hidden priors. As a philosopher of history, I see you standing at the exact fault line where **epistemology** (how we know) crashes into **ontology** (what kind of thing "Jesus" is in this context).

  Your hypothesis is strong: there is a verbal dispute masking a Bayesian failure. But I want to push you further. The reason this hasn't resolved is that the field is trying to solve a **probabilistic problem** with **deterministic tools**, while simultaneously disagreeing on the **unit of historical analysis**.

  Here is the breakdown of the impasse, the steelmanned positions, and the specific methodological shift required to make progress.

  ### 1. The Formal Flaw: Criteria as Likelihood Ratios
  You are absolutely right that the Criteria of Authenticity function as unstated likelihood ratios. Let's formalize why this causes the deadlock.

  In Bayesian terms, we want to know $P(H|E)$: The probability that the Hypothesis ("Jesus said this") is true given the Evidence (the text exists).
  By Bayes' Theorem:
  $$P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)}$$

  *   **$P(E|H)$ (Likelihood):** If Jesus said this, how likely is it to appear in the text? The Criteria (Multiple Attestation, Embarrassment) attempt to measure this. They argue that if a saying is embarrassing, $P(E|H)$ is high because the church wouldn't invent it.
  *   **$P(H)$ (The Prior):** How likely is it, *before looking at the text*, that a 1st-century Galilean peasant said this? This is the "Criterion of Historical Plausibility" or "Coherence."
  *   **The Error:** The field treats the Criteria as if they directly yield $P(H|E)$. They do not. They only adjust the likelihood.
  *   **The Hidden War:** The "Prior" ($P(H)$) is never stated. It is smuggled in through the "Criterion of Coherence."
      *   **Scholar A's Prior:** Jesus was an apocalyptic Jew. (Sayings about the Kingdom fit the prior; wisdom sayings do not).
      *   **Scholar B's Prior:** Jesus was a Cynic sage. (Wisdom sayings fit the prior; apocalyptic sayings do not).

  Because no one states their Prior, they cannot see that they are calculating different equations. When they stack criteria, they treat them as independent variables ($P(E1 \cap E2) = P(E1) \cdot P(E2)$), but they are highly correlated (Embarrassment often creates Multiple Attestation). This creates an illusion of cumulative probability where there is only circular reinforcement.

  **Diagnosis:** Part of the impasse is indeed a **formal probabilistic error**. The criteria are heuristics masquerading as algorithms.

  ### 2. Steelmanning the Clash
  It is not just a math error; it is a clash of historical philosophies. Let's steelman both sides to find the bedrock.

  **Side A: The Critical Realists (The Criteria Camp)**
  *   **The Argument:** History requires a distinction between *event* and *interpretation*. If we cannot distinguish the man from the memory, we are not doing history; we are doing theology or literary criticism. The Criteria, however leaky, are the only scalpel we have to separate the *causal origin* (Jesus) from the *effect* (Gospels).
  *   **The Bedrock:** **Individuation.** They assume that individual agency is the primary driver of history. A specific man said specific things that caused a movement. Without isolating those things, we cannot explain the *origin* of the movement.
  *   **Strength:** They preserve the normative function of history: to correct memory against itself.

  **Side B: The Memory Theorists (The Social/Cultural Camp)**
  *   **The Argument:** In an oral/aural culture, "memory" is not a storage bin; it is a reconstructive act. There is no "bare event" accessible behind the interpretation. The "Historical Jesus" is not a hidden object to be dug up; he is the *influence* exerted on the tradition. Asking "Did he say this?" is a category error. The question is, "What does the existence of this tradition tell us about the community's memory of him?"
  *   **The Bedrock:** **Social Construction.** The unit of analysis is not the individual, but the *mnemonic community*. The "Jesus" we can access is the Jesus who existed *for* the early church, because that is the only causal link that survives.
  *   **Strength:** They account for the actual medium of transmission (oral tradition/social memory) rather than treating the Gospels as broken wire recordings.

  ### 3. Verbal vs. Bedrock Disagreements
  You asked if this is verbal or substantive. It is both, layered.

  **Layer 1: The Verbal Dispute (Definition of "Historical Jesus")**
  *   **Side A** defines "Historical Jesus" as the **reconstructible biography** of the pre-Easter individual.
  *   **Side B** defines "Historical Jesus" as the **explanatory hypothesis** for the post-Easter movement.
  *   *Resolution:* This is easily solvable by terminology. If Side A calls their project "Biographical Reconstruction" and Side B calls theirs "Origins of the Tradition," they could talk past each other less. But they don't, because they both want the authority of the label "History."

  **Layer 2: The Bedrock Dispute (The Limits of Individuation)**
  *   This is the genuine philosophical clash. Can we isolate individual agency in a pre-literate, collective culture?
  *   **Side A** assumes **Methodological Individualism**: History happens because individuals act.
  *   **Side B** assumes **Methodological Collectivism**: History happens because communities negotiate meaning.
  *   *Why it won't resolve:* This is an ontological wager. You cannot prove via evidence whether the "individual" or the "community" is the primary historical engine, because your evidence (texts) is already filtered by your assumption.

  ### 4. What Counts as Progress?
  You want a way out of the rabbit hole. Here is the specific methodological shift that would constitute progress. It requires three moves:

  **A. Abandon "Authenticity" for "Explanatory Power"**
  Stop asking "Is this saying authentic?" (Binary). Start asking "Does the hypothesis that Jesus said this *better explain the data* than the hypothesis that the church created it?" (Inference to the Best Explanation - IBE).
  *   *Why:* IBE acknowledges that we are comparing models, not discovering facts. It forces you to weigh the *cost* of the hypothesis.
  *   *Example:* It is costly to assume the church invented a baptism by John (Embarrassment). It is *less* costly to assume the church invented a resurrection appearance (Coherence). IBE makes these costs explicit.

  **B. Formalize the Priors (The "Plausibility" Criterion)**
  Make the "Criterion of Historical Plausibility" the *first* step, not the last. State your Prior explicitly.
  *   *Requirement:* Every scholar must publish their $P(H)$. "I assume Jesus was an apocalyptic prophet with probability 0.8."
  *   *Why:* This exposes the theological/philosophical commitments driving the results. It stops the "stacking of criteria" from masking the fact that the conclusion was determined by the Prior.

  **C. The "Continuity of Influence" Test**
  This is the synthesis. A saying or event is "historical" not if it is *dissimilar* to the church (Dissimilarity), but if it provides the **necessary condition** for the church's existence.
  *   *The Test:* Does the trajectory of the early church make sense *without* positing this specific input from Jesus?
  *   *Why:* This bridges Side A and Side B. It respects the individual (Side A) as the causal origin, but acknowledges we only know him through the effect (Side B).

  ### The Diagnosis
  The field hasn't resolved because it is trying to use **19th-century positivist tools** (criteria as filters) on **1st-century oral data** (memory as reconstruction) while hiding **21st-century Bayesian logic** (priors and likelihoods).

  **Your hypothesis was correct:** It is largely a verbal dispute about the definition of "History" masking a Bayesian failure regarding Priors.
  **The addition:** It is also an ontological dispute about whether "the individual" is a valid category for this evidence.

  **The Way Out:**
  Progress will not come from refining the Criteria. It will come from **abandoning the language of "Authenticity" entirely.**
  Replace "Authentic/Inauthentic" with **"Historically Explanatory/Non-Explanatory."**

  If a saying survives the criteria, it doesn't mean "Jesus said it." It means "The hypothesis that Jesus said this is the most efficient explanation for the existence of this text and the movement it spawned."

  That is the only claim the evidence can actually support. Anything more is faith; anything less is nihilism. The field remains stuck because it refuses to settle for the middle.
