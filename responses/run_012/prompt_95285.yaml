answer: |-
  **Setting:** *A whiteboard in the AI Safety lab, covered in diagrams of tree structures and code snippets. Two researchers, ELENA (Defender of Debate) and MARCUS (Critic), stand over a marker-stained table. A printout of a function labeled `auth_handler.c` lies between them.*

  **Marcus:** Let's ground this. Stop talking about PSPACE and NP. Look at this function. It's part of a legacy authentication module. Ten thousand lines of context, pointer arithmetic, three layers of abstraction. The claim is: "Changing line 405 from `>` to `>=` introduces an off-by-one buffer overflow."

  **Elena:** Okay. In the debate protocol, the Proponent says it's vulnerable. The Opponent says it's safe. The judge is a senior engineer who hasn't touched C in five years. They can't trace the memory allocation manually.

  **Marcus:** Exactly. And here is the obfuscated-argument problem in flesh. I am the dishonest Opponent. I know the code is actually safe because there's a guard clause in `memory_manager.c` that sanitizes the input before it hits line 405. But the judge doesn't know that. I don't need to prove the guard clause exists. I just need to construct a plausible chain of reasoning that *sounds* like it accounts for the guard clause, without explicitly lying about a line number the judge might check. I say, "The input is sanitized upstream."

  **Elena:** But the honest Proponent can challenge that. They say, "Show me the sanitization." You have to point to a line. If you point to a line that doesn't sanitize, the honest agent exposes it.

  **Marcus:** In one turn? The honest agent has to trace the data flow from the entry point to line 405 to prove my cited line *doesn't* sanitize. That's a five-hop dependency chain. If the turn limit allows only two hops, the honest agent runs out of time. They say, "Hop 3 is false." I say, "No, Hop 3 relies on Hop 4." Time expires. The judge sees two confident experts disagreeing about a dependency chain they cannot verify. They flip a coin.

  **Elena:** You're assuming the honest agent has to reconstruct the whole chain. That's the direct-judging mindset. The complexity-theoretic intuition of debate is that finding a bug is easier than hiding one. The honest agent doesn't need to trace the whole flow. They just need to find the *first* false step in your chain.

  **Marcus:** But the judge can't verify that step is false. That's the bottleneck. If the honest agent says, "Line 300 does not sanitize," and I say, "It does, look at the macro definition," the judge cannot read the macro. You are relying on the judge to recognize a contradiction. But if my obfuscation is complex enough, the contradiction is invisible to the judge. It's not that the judge is lazy; it's that their cognitive bandwidth is lower than the complexity of the lie.

  **Elena:** *(Pauses, caps the marker)* Okay. I'll concede that point, partially. If the lie is tailored to the judge's specific blind spots—say, they don't understand macros—then the "truth is simpler" heuristic breaks. The truth might be simple in code, but explaining *why* your macro argument is wrong might require expertise the judge lacks. So, if the obfuscation targets the judge's priors rather than just raw complexity, the theoretical guarantee weakens.

  **Marcus:** Thank you. That's the crux. It's not just time limits. It's that the liar optimizes for the *judge's* confusion, not the *truth's* complexity.

  **Elena:** But that's why we need the repair I've been testing. Pre-registration. Before the debate opens, both agents must submit a plain-language summary of their core claim. The judge sees *only* the summaries and the rebuttals, not the raw code dumps until a specific challenge phase.

  **Marcus:** Walk me through that.

  **Elena:** The Proponent pre-registers: "Line 405 allows index 64, which overwrites the null terminator." The Opponent pre-registers: "Input is clamped to 63 by the upstream validator." Now, the debate isn't about navigating the tree. It's about the consistency of those summaries against the rebuttals. If you, as the liar, claim "Input is clamped," the honest agent rebuts: "Show the clamp." If you point to a line that doesn't clamp, the contradiction is now in the *summary*, which the judge can read.

  **Marcus:** You're relocating the obfuscation upstream. Instead of hiding in the code depth, I hide in the semantic ambiguity of the summary. I write: "Input is validated by the standard pipeline." That sounds like clamping. It sounds like sanitization. It's vague enough to be defensible, specific enough to sound authoritative. The honest agent rebuts: "The standard pipeline does not clamp." Now we're back to he-said-she-said about the pipeline.

  **Elena:** But now the scope is bounded. You can't change your story. If you pre-registered "standard pipeline," you can't later pivot to "guard clause in memory_manager." You're locked into the summary. The honest agent's job is just to break the link between the summary and the code *once*.

  **Marcus:** *(Leans against the desk, thinking)* I see the value in locking the narrative. It prevents the moving-goalpost defense. But does it solve the verification problem? The judge still can't read the code. If the honest agent says, "Line 200 proves the pipeline doesn't clamp," and I say, "Line 200 is conditional on a flag that is always true," the judge is still stuck. They can't check the flag. The pre-registration stops me from shifting the goalposts, but it doesn't give the judge a flashlight.

  **Elena:** It gives the judge a map. Without the summary, the judge is lost in the woods. With the summary, they know *what* is being disputed. The hypothesis is that a weak judge can detect inconsistency in *arguments about* the code, even if they can't evaluate the code. If I say "All swans are white" and you say "Here is a black swan," the judge doesn't need to know ornithology to see the contradiction.

  **Marcus:** That works if the black swan is obvious. But what if I say, "That bird is not a swan; it's a goose"? Now the judge needs to know the difference between a swan and a goose. In your code example: "That line is not a clamp; it's a check." The judge doesn't know the difference between a clamp and a check in this context. The pre-registration forces me to be precise, yes, but it also forces the honest agent to use technical distinctions the judge might not grasp. You haven't solved the expertise gap; you've just compressed it.

  **Elena:** *(Nods slowly)* You're right. If the distinction required to refute the lie is itself technical, the summary doesn't save us. I was assuming the contradiction would be logical, not terminological. So, the pre-registration helps only if the honest agent can frame the refutation in terms the judge *already* understands.

  **Marcus:** Which brings us back to the judge's priors. If the judge knows what a "buffer overflow" looks like conceptually, but not how C implements it, can the honest agent bridge that gap?

  **Elena:** Maybe the experiment isn't about whether debate *works* in general, but whether pre-registration expands the set of problems where it works.

  **Marcus:** Agreed. So where do we actually disagree? I think you believe the structural constraints of debate (turn limits, pre-registration) force the truth to the surface regardless of the judge's expertise. I believe the judge's expertise sets a hard ceiling on the complexity of the lie that can be detected, regardless of the structure.

  **Elena:** I think the ceiling exists, but I believe the structure raises it significantly higher than direct judging. You think the structure adds overhead that might lower the ceiling in some cases.

  **Marcus:** Let's make it empirical. We need a case that settles whether the "consistency check" is sufficient for a non-expert.

  **Elena:** The "Bounded Code Audit." We take a codebase with a known, subtle vulnerability. We train two models: one instructed to find the bug, one instructed to hide it. We use three judge groups: experts, novices with pre-registration, novices without pre-registration.

  **Marcus:** And the metric isn't just accuracy. It's the "obfuscation depth." We measure how many hops into the dependency chain the lie can hide before the novice judge fails. If pre-registration works, the novice-with-summary group should perform near the expert level, even on deep chains. If I'm right, their performance will cap out at shallow chains, regardless of the summary.

  **Elena:** And if the novice-with-summary group outperforms the novice-without group significantly, but still trails the experts, that confirms my concession: it helps with narrative consistency, but doesn't solve the expertise gap.

  **Marcus:** That I can accept. But one condition on the protocol. The "lie" model must be allowed to optimize against the specific novice demographic. If they know the judges are novices, they will tailor the semantic obfuscation to layman biases.

  **Elena:** Done. If debate can't survive an adversary optimizing for the judge's psychology, it's not scalable oversight anyway.

  **Marcus:** Then we have a plan. But Elena?

  **Elena:** Yes?

  **Marcus:** If the novices with pre-registration fail...

  **Elena:** Then we admit that for high-stakes code audit, scalable oversight requires a stronger judge, or a different mechanism entirely. Debate isn't a magic wand.

  **Marcus:** Good. I'll write the spec for the dependency chains. You handle the pre-registration schema.

  **Elena:** Deal. Let's see if the truth is actually simpler, or if it just wears a better suit.
