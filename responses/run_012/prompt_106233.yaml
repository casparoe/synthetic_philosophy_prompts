      Briony Tallis's catastrophe is often misdiagnosed as mere lying, but it is fundamentally epistemological. She commits the narrative fallacy by imposing causal shape on noise—the fountain scene, the intercepted letter—transforming ambiguous gestures into a plot with a villain. Once that story is set, hindsight bias locks it in; every subsequent detail confirms the culprit she has already chosen. The novel treats these not as distinct failures but as symbiotic sins. The narrative provides the structure; hindsight provides the certainty. Briony cannot distinguish between what happened and what makes a good story, because for her, coherence equals truth.

