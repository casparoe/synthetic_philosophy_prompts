  | **1. Meta-Normative Fact** | $P(\text{Fact}) = 0.90$ | There is a 90% chance that "rational requirement" has determinate content, rejecting radical quietism. |
  | **2. Base EUT Intuition** | $P_{\text{Base}} = 0.73$ | Prior credence that coherence constraints like Independence are constitutive of instrumental rationality absent defeaters. |
  | **3. Risk-Sensitive Alt** | $\Delta = -0.15$ | 40% probability that Risk-Weighted Utility (e.g., Buchak) captures normative facts better than EUT. |
  | **4. Colleague H1 (Relation)** | $\Delta = -0.05$ | 30% probability that distinguishing preference relations from choice functions dissolves the contradiction. |
  | **5. Colleague H2 (Strategies)** | $\Delta = -0.08$ | 40% probability that planning over strategies permits Allais patterns without dynamic inconsistency. |
  | **6. Colleague H3 (Split)** | $\Delta = +0.07$ | 60% probability that Common-Ratio violates rationality even if Common-Consequence does not, saving half the axiom. |
  | **7. Framing Artifact** | $\Delta = +0.12$ | 50% probability that the Allais intuition is a cognitive framing error rather than a normative insight. |

  **Calculation:**
  $$0.90 \times (0.73 - 0.15 - 0.05 - 0.08 + 0.07 + 0.12) = 0.90 \times 0.64 = 0.576 \approx 0.58$$

