  Here is the breakdown of the machine running in your friend's head, the rival machine, and how to break the tie.

  ### 1. The Machine She Is Running: **The Sociopolitical Complexity Threshold**

  Your friend is not measuring death, and she is not measuring regime change in isolation. She is measuring **capacity**.

  Her rule is: **A collapse occurs when a society loses the ability to sustain the specific level of sociopolitical complexity that defined it, resulting in the termination of its "generative projects."**

  *   **How it fits her verdicts:**
      *   **Bronze Age & Maya:** The "generative projects" (Palace redistribution, Divine Kingship monumentality) stopped. The *capacity* to write, trade copper, or carve stelae vanished. The complexity curve went down.
      *   **Rapa Nui & Norse:** The capacity to sustain the population and the specific cultural markers (statues, European contact) failed. The system simplified.
      *   **Rome:** The "project" (Imperial Administration) changed managers, but the *capacity* (cities, Latin, Church, trade) remained intact. Complexity did not drop; it transformed.
      *   **Tokugawa:** The regime changed, but complexity *increased* (industrialization, modern state).

  *   **Prediction for (a) Black Death:** **NOT A COLLAPSE.**
      *   *Why:* While people died, the "machine" didn't break. Universities, the Church, trade networks, and writing continued. The complexity threshold was breached but quickly repaired. The system proved resilient, not collapsed.
  *   **Prediction for (b) End of USSR:** **COLLAPSE.**
      *   *Why:* The "Soviet Project" (Planned Economy, Communist Ideology, Imperial Structure) didn't transform; it terminated. Like the Maya Kings, the specific mechanism that held that version of society together vanished. Even if people stayed, the *system* that defined that society collapsed into something simpler (initially) and fundamentally different.

  ### 2. The Rival Machine: **The Demographic Catastrophe Threshold**

  This is the most common layperson definition, and it fits her original data points just as well as her rule does.

  Its rule is: **A collapse occurs when there is a catastrophic reduction in human population within a region, leading to the abandonment of settlement patterns.**

  *   **How it fits her verdicts:**
      *   **Bronze Age, Maya, Rapa Nui, Norse:** All feature significant population crashes or total abandonment of the region.
      *   **Rome, Tokugawa:** Populations remained stable or grew; cities were not abandoned.
  *   **Prediction for (a) Black Death:** **COLLAPSE.**
      *   *Why:* 30–50% mortality is the definition of demographic catastrophe. It fits the "pop crashes" criterion of the Maya and Rapa Nui cases perfectly.
  *   **Prediction for (b) End of USSR:** **NOT A COLLAPSE.**
      *   *Why:* There was no mass die-off or exodus. The people remained in place. By this metric, it is merely political change.

  ### 3. Which Rule Is She Really On?

  **She is running the Sociopolitical Complexity Threshold.**

  **Why:** The tell is her annoyance about Rome. If she were using the Demographic Rule, the Rome debate wouldn't make her angry; the population data is fairly clear. Her anger comes from the *interpretive* argument that "Political End = Civilizational End." She is fighting the idea that a change in management (Rome/Tokugawa) is the same as a loss of capacity (Bronze Age/Maya).

  Furthermore, her verdict on the Maya is the smoking gun. She explicitly says, "She's definitely not saying the Maya people themselves went anywhere... but she still says the thing that was there collapsed." This proves she decouples *biology* from *collapse*. Therefore, she will not classify the Black Death (biological loss, institutional survival) as a collapse. Conversely, she will likely classify the USSR (biological survival, institutional death) as a collapse, because the "Soviet" system is more analogous to the "Maya Kingship" than to "Roman Civilization."

  ### 4. The Decider Case

  To settle this, you need a case where **Demography crashes** but **Complexity holds**, or vice versa, in a way that isolates the "System" from the "People."

  **The Case: The Great Irish Famine (1845–1852)**

  *   **The Scenario:** Ireland's population dropped by roughly 20–25% (1 million died, 1 million fled). However, the state (British rule), the legal system, the language of administration (English), and the economic infrastructure remained intact and eventually modernized.
  *   **The Test:**
      *   If she says **Collapse**: She is secretly running the **Demographic Rule** (or a hybrid). The population loss was catastrophic, similar to Rapa Nui.
      *   If she says **Not Collapse**: She is running the **Complexity Rule**. The "system" (British administration, agricultural export economy) continued to function and even intensified despite the human cost. The "generative project" didn't fail; the *people* were sacrificed to it.

  **Why this settles it:** It mirrors the Black Death (people die, system stays) but with a longer tail. If she calls the Famine a collapse but the Black Death not, she's inconsistent. If she calls the Famine *not* a collapse, she confirms that for her, **institutions matter more than bodies.**

  ### 5. The "Neither" Contingency

  If you present these cases and she says **NEITHER (a) nor (b) is a collapse**, she is running a stricter version of her rule: **The Civilizational Continuity Rule.**

  *   **The Rule:** **Collapse requires the discontinuity of the underlying culture (language, religion, identity), not just the state or the population.**
  *   **Why:** Under this rule, the Black Death isn't collapse because the culture survived. The USSR isn't collapse because "Russia" survived (just like "Rome" survived the 5th century). She views the USSR as a regime change (like Tokugawa) rather than a civilizational end (like Bronze Age).
  *   **Is it one rule?** Yes, but it's a **Cultural Essentialist** rule. It posits that "States" are ephemeral, but "Civilizations" are the unit of analysis. If the civilization absorbs the shock, it's evolution. If the civilization fragments (loss of literacy, religion, language), it's collapse.

  **Summary for your argument:**
  Tell her you've modeled her logic. You believe she defines collapse as **the loss of the system's capacity to produce its defining markers** (writing, monuments, central planning), not the loss of people. Tell her you predict she'll call the Black Death "resilience" and the USSR "collapse." Then hit her with Ireland. If she flinches on Ireland, you've found the bug in her code.
