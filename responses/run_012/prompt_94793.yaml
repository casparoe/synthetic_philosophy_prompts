prompt: |-
  So I'm in this environmental ethics seminar and we spent like two weeks on the "inefficacy objection" — the idea that since one person's emissions are a rounding error, my choice to fly somewhere or eat a burger can't be the thing that makes the difference to any particular climate harm. My professor seemed to treat this as a serious problem for the whole idea that individuals have obligations to cut their own emissions. But then in the same lecture she said the point of the Paris-style pledges is that lots of individual choices add up to real reductions, and that's exactly why we should still bother. Isn't that contradictory? If my flight is genuinely inefficacious on its own, then a national pledge, which is also just a giant bundle of individual flights and drives, should be equally inefficacious — so if the objection really works, doesn't it dissolve the case for collective action too? I feel like I'm missing something about what "inefficacious" is even supposed to mean here.

  On a more personal level: I genuinely want to do the right thing, so I've been trying to work out my exact share of the harm. Global emissions are roughly 50 gigatons a year, right, so if I can estimate my own personal tonnage, that should be my precise slice of the damage — and then I can just offset that exact amount and be morally clean. Is that the correct way to think about it? I guess what I'm really asking is whether the inefficacy objection means my individual actions are morally weightless, and if they aren't, how I actually calculate the specific quantity of harm that's mine so I know what I owe and when I've definately paid it off.
