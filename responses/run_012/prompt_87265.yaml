answer: |-
  Your diagnosis is astute, particularly regarding the simulation variant failing to shift the needle. If the deadlock were merely about the physical mechanism of prediction, a perfect simulation should resolve it. The fact that it does not suggests the fracture lies deeper than the machinery of foresight.

  My committed verdict is this: the impasse is a **substantive disagreement about the metaphysics of counterfactuals**, specifically concerning whether the past is held fixed during deliberation. The dispute over 'acts versus policies' is a secondary symptom of this deeper metaphysical clash, not the root cause. It is not merely verbal, because the two sides prescribe different physical actions; nor is it simply two different questions, because both sides believe they are answering the single question: 'What ought I to do?'

  Here is the reasoning for this diagnosis, drawn from the positions you describe.

  The two-boxers insist that the contents of the opaque box are 'already fixed'. In their view, the counterfactual 'If I were to take both boxes, the predictor would have predicted this' is false. They hold the past strictly fixed: the prediction happened yesterday, so the content of the box is independent of the choice made today. For them, rationality is a matter of causal leverage. Since your choice cannot causally reach back into the past to alter the box's content, you should treat the content as a constant. When they say taking both boxes is 'dominant', they are asserting a metaphysical claim: that causal independence trumps evidential correlation.

  The one-boxers, conversely, treat the prediction as logically entangled with the choice. When they consider the counterfactual 'If I were to take both boxes', they do not hold the past fixed in the same way. They argue that in the nearest possible world where you take both boxes, the predictor (being reliable) would have predicted that and left the box empty. For them, rationality is a matter of maximising expected utility based on the best available evidence, even if that evidence correlates with a past event. They are asserting a different metaphysical claim: that in cases of high reliability, the logical connection between agent and predictor creates a form of dependence that rational deliberation must respect.

  The reason your simulation variant fails to break the deadlock is that it does not alter this metaphysical stance. To the two-boxer, a simulation finished 'just before' is still in the past; the causal arrow points one way. To the one-boxer, a simulation of your deliberation is logically isomorphic to your deliberation; the arrow is bidirectional or non-existent. Because the underlying disagreement is about how to evaluate counterfactuals (do we hold the past fixed or not?), changing the physical description of the predictor leaves the core dispute untouched.

  It is not merely a verbal disagreement about the definition of 'rationality'. If it were verbal, you could agree that 'rationality-1' (causal) recommends two-boxing and 'rationality-2' (evidential) recommends one-boxing, and then agree on which button to press. But you do not agree on the button. The two-boxer genuinely believes the one-boxer is throwing away money; the one-boxer genuinely believes the two-boxer is following a procedure that guarantees poverty. This indicates a substantive clash about how the world works, not just how we speak about it.

  However, your intuition about 'acts versus policies' identifies why the argument feels intractable. The two-boxer is analysing the **act** in isolation at the moment of choice ($t_2$), where the past is indeed fixed. The one-boxer is analysing the **policy** or algorithm that generated the act, which exists at $t_1$ (when the prediction was made). The impasse persists because neither side accepts the other's temporal frame of reference as the relevant one for normative assessment.

  **What counts as progress?**

  Given this diagnosis, progress will not come from re-arguing the intuition pumps. You will not convince a causal theorist that the past can change, nor an evidential theorist that correlation is irrelevant. Progress requires one of the following three shifts:

  1.  **Formal Resolution:** The group must adopt a framework that subsumes both views, such as **Functional Decision Theory (FDT)**. FDT formalises the one-boxer's intuition about policies without relying on 'backwards causation'. It treats the decision as the output of a logical function. If the group can agree to model the agent as a logical function rather than a physical event, the 'act versus policy' distinction dissolves into a technical specification. Progress here is a formal proof showing that FDT dominates CDT (Causal Decision Theory) in Newcomb-like problems while matching it in standard causal problems.
  2.  **Metaphysical Concession:** The group must explicitly acknowledge that 'rationality' is theory-relative. Progress would be a consensus statement admitting that Newcomb's Problem is a 'boundary case' where our standard intuitions about causation and evidence diverge. The goal shifts from finding the 'correct' answer to mapping the precise conditions under which causal independence breaks down.
  3.  **Change of Question:** You might accept your hypothesis that they are answering different questions. Progress would be to stop asking 'Which box should I take?' and start asking 'Which decision theory should I instantiate?'. If the group agrees that the goal is to be the *sort of agent* who wins, the one-boxer wins. If the goal is to perform the *causally optimal act* given the current state, the two-boxer wins. Explicitly separating these normative goals would allow the group to dissolve the contradiction rather than solve it.

  In summary, the circling persists because you are fighting a metaphysical war with ethical weapons. You are arguing about what one *ought* to do, but the disagreement is about what *can* be the case in a counterfactual scenario. Until the group explicitly debates the fixity of the past in deliberation, rather than the size of the payout, the circles will continue.
