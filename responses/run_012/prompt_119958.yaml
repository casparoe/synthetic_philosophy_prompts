      *   *Let's suggest:* **The Crystal Seed.** Or **The Arch.** Let's go with **The Arch with Scaffolding.** It captures the "temporary outside help" that isn't a "ruler."

      *Wait, I need to be careful.* The user wants to know if *Drawing Hands* is the right tool. It isn't.
