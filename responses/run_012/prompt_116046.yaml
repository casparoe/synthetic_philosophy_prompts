answer: |-
  # Infinite Ethics: A Decision Tree for the Perplexed

  **Note on Status:** Very little here is *settled*. The "bookkeeping" (which view fails which test case) is generally agreed upon by specialists. The *philosophical verdict* (which view is correct) is live combat. Where I say "Defended," I mean "Serious philosophers have published arguments for this," not "This is the consensus." Where I say "Unexplored," I mean "Logically possible, but I know of no proponent."

  ---

  ## The Decision Tree

  Start with the intuition: **"A world with more happy lives is better."** Follow the branches by answering the questions as they apply to *infinite* worlds.

  ### Node 1: Comparability
  **Question:** When two worlds both contain infinite good, is there *always* a fact of the matter about which is better, or do some comparisons break down?
  *   **No (Some comparisons break):** Go to **Leaf 1 (Hard Incomparabilism)** or **Leaf 2 (Soft Incomparabilism)**.
  *   **Yes (We can always rank them):** Go to Node 2.

  ### Node 2: The Finite/Infinite Barrier
  **Question:** Can a *finite* number of vastly excellent lives ever be better than an *infinite* number of moderately good lives? (Case *a*)
  *   **Yes (Quality can trump Quantity):** Go to **Leaf 3 (Lexical Quality)**.
  *   **No (Infinity always wins):** Go to Node 3.

  ### Node 3: The Metric
  **Question:** Do we care about the *total sum* of happiness, or the *average* happiness per life?
  *   **Average:** Go to **Leaf 4 (Average Utilitarianism)**.
  *   **Total:** Go to Node 4.
      *   *(Note: There are other metrics, like 'critical level', but for this tree, we treat them as variations on Total or Average depending on how they handle the infinite sum.)*

  ### Node 4: Marginal Sensitivity
  **Question:** If a world already has infinite happy lives, does adding *one more* happy life make it better? (Case *b*)
  *   **No (Infinity swamps addition):** Go to **Leaf 5 (Insensitive Totalism)**.
  *   **Yes (Every bit of good counts):** Go to Node 5.

  ### Node 5: Mixed Infinities
  **Question:** If a world has infinite happy lives *and* infinite miserable lives, is the net value neutral (cancelled out), bad, or undefined? (Case *e*)
  *   **Neutral (They cancel to zero):** Go to **Leaf 6 (Cancellation View)**.
  *   **Bad/Undefined (Bads dominate or break the sum):** Go to Node 6.

  ### Node 6: Structural Dominance
  **Question:** If we can pair every life in World A with a life in World B, and every life in B is happier than its pair in A, is B better? (Case *c*)
  *   **No (Only the set of values matters, not the pairing):** Go to **Leaf 7 (Aggregative Set View)**.
  *   **Yes (Universal improvement matters):** Go to Node 7.

  ### Node 7: Continuity of Value
  **Question:** Does an endless sequence of lives *approaching* perfection count as equal to a world *at* perfection? (Case *d*)
  *   **No (Approaching ≠ Reaching):** Go to **Leaf 8 (Discontinuous View)**.
  *   **Yes (Limits count):** Go to **Leaf 9 (Continuous/Standard Infinite Utilitarianism)**.

  ### Node 8: (Alternative Branch for Time/Location)
  *(Backtrack to Node 3 if you think time matters specifically)*
  **Question:** Does a life's value depend on *when* it happens (e.g., do future lives count less)?
  *   **Yes:** Go to **Leaf 10 (Discounting View)**.
  *   **No:** Return to Node 4.

  ### Node 9: (Alternative Branch for Radical Skepticism)
  *(Backtrack to Node 1)*
  **Question:** Are *any* value judgments possible, even finite ones?
  *   **No:** Go to **Leaf 11 (Value Nihilism)**.
  *   **Yes:** Return to Node 1.

  ### Node 10: (Alternative Branch for Hyperreal Math)
  *(Backtrack to Node 4)*
  **Question:** Do you use advanced mathematics (hyperreals/surreals) to distinguish sizes of infinity?
  *   **Yes:** Go to **Leaf 12 (Hyperreal Utilitarianism)**.
  *   **No:** Return to Node 5.

  ---

  ## The Leaves (Positions)

  ### 1. Hard Incomparabilism
  *   **What it says:** Infinite worlds cannot be ranked against each other. "Better than" has no grip here.
  *   **Awkward Commitment:** You cannot say a world with infinite torture is worse than a world with infinite bliss.
  *   **Defended?** Yes (e.g., early arguments by Vallentyne/Kagan), but often as a *reductio* of other views rather than a final destination.

  ### 2. Soft Incomparabilism
  *   **What it says:** Some infinite worlds can be compared (e.g., if one is clearly a subset of the other), but not all.
  *   **Awkward Commitment:** There are "gaps" in morality where reason runs out; you might have to choose blindly between two infinite options.
  *   **Defended?** Yes (e.g., "Pareto plus" views that admit incomparability when Pareto doesn't apply).

  ### 3. Lexical Quality
  *   **What it says:** Quality of life has priority. A finite number of perfect lives beats infinite mediocre ones. (Case *a*: Finite wins).
  *   **Awkward Commitment:** You might be required to destroy an infinite population of "okay" people to save a finite number of "excellent" people.
  *   **Defended?** Yes (Lexical views exist in population ethics), but rarely applied to the infinite case specifically because it contradicts the "Infinity wins" intuition.

  ### 4. Average Utilitarianism
  *   **What it says:** We maximize average happiness, not total. Infinite total doesn't matter if the average is low.
  *   **Awkward Commitment:** Adding a happy life can make the world *worse* if it's slightly below the current average (the "Mere Addition Paradox" on steroids).
  *   **Defended?** Yes, standard view in population ethics, but struggles to handle infinite averages (which often become undefined).

  ### 5. Insensitive Totalism
  *   **What it says:** Total sum is what matters. Since $\infty = \infty$, adding one life changes nothing. (Case *b*: No difference).
  *   **Awkward Commitment:** You have no reason to save an extra person in an already infinite world. Moral effort lapses.
  *   **Defended?** Rarely defended positively; usually the "straw man" that infinite ethicists try to fix.

  ### 6. Cancellation View
  *   **What it says:** Infinite good + Infinite bad = Zero. (Case *e*: Neutral).
  *   **Awkward Commitment:** A world of infinite bliss and infinite torture is morally equivalent to an empty void.
  *   **Defended?** Unexplored as a positive moral theory. Mathematically possible (Riemann series), but morally repugnant to almost everyone.

  ### 7. Aggregative Set View
  *   **What it says:** Only the collection of welfare levels matters, not who has them or how they are mapped. (Case *c*: Shift doesn't matter).
  *   **Awkward Commitment:** A world where everyone is miserable is equal to a world where everyone is happy, provided the *set* of welfare numbers is identical (e.g. via permutation).
  *   **Defended?** No. This violates basic Pareto intuitions. Likely incoherent.

  ### 8. Discontinuous View
  *   **What it says:** Getting closer to perfection isn't the same as being perfect. (Case *d*: Ceiling wins).
  *   **Awkward Commitment:** An infinite sequence of lives at 99.9%, 99.99%, 99.999%... is strictly worse than a finite world at 100%.
  *   **Defended?** Unexplored. Most mathematical views prefer continuity; most moral views prefer the infinite sequence.

  ### 9. Continuous/Standard Infinite Utilitarianism
  *   **What it says:** We maximize value, respecting limits and order. (Case *d*: Sequence can equal Ceiling).
  *   **Awkward Commitment:** Requires complex mathematical machinery (like ordering principles) to avoid contradictions in cases (b) and (c).
  *   **Defended?** Yes (e.g., "Ordering Utilitarianism" or "Spatiotemporal" views). This is the main "live" contender for a working theory.

  ### 10. Discounting View
  *   **What it says:** Future lives count less. This turns infinite sums into finite sums.
  *   **Awkward Commitment:** Discriminates against future people simply because they are later. A genocide in the far future might matter less than a stubbed toe today.
  *   **Defended?** Yes (in economics), but widely rejected in moral philosophy as arbitrary discrimination.

  ### 11. Value Nihilism
  *   **What it says:** There are no moral facts, finite or infinite.
  *   **Awkward Commitment:** You cannot say torture is wrong.
  *   **Defended?** Yes (Moral Error Theory), but not specific to infinite ethics.

  ### 12. Hyperreal Utilitarianism
  *   **What it says:** Uses non-standard analysis to say $\infty + 1 > \infty$. (Case *b*: Addition matters).
  *   **Awkward Commitment:** Relies on mathematical frameworks that are not unique (depends on the ultrafilter chosen); different math yields different moral verdicts.
  *   **Defended?** Yes (e.g., Bostrom, Askell). A leading technical solution, but philosophically contentious.

  ---

  ## Unoccupied Combinations

  These are logical cells in the tree that nobody seems to live in.

  1.  **Insensitive Totalism + Pareto Dominance:** Believing that adding one life doesn't matter (Node 4: No), but believing that making *everyone* better off does matter (Node 6: Yes).
      *   *Why Empty?* **Incoherent.** If individual additions don't count, it's hard to explain why a sum of individual improvements counts. Usually, if you reject marginal sensitivity, you reject Pareto in infinite cases too.
  2.  **Cancellation View + Quality Lexicality:** Believing infinite goods/bads cancel to zero (Node 5: Neutral), but also that finite excellence beats infinite mediocrity (Node 2: Yes).
      *   *Why Empty?* **Unattractive.** If you think infinities cancel, you likely think infinities are "neutralized" and shouldn't weigh against finite goods. Combining them creates a volatile view where infinite torture is neutral, but finite bliss is supreme.
  3.  **Discounting + Incomparabilism:** Believing we should discount the future (Node 8: Yes), but also that infinite worlds are incomparable (Node 1: No).
      *   *Why Empty?* **Unexplored/Redundant.** Discounting is usually adopted *to solve* incomparability (by making the sum finite). Doing both defeats the purpose of discounting.

  ---

  ## Indistinguishable Leaves (Blind Spots)

  This tree sorts views based on the five cases (a-e). However, some distinct philosophical positions will land in the same leaf because they agree on these specific cases but differ elsewhere.

  *   **Leaf 9 (Continuous) vs. Leaf 12 (Hyperreal):** Both typically agree that +1 matters (Case *b*) and Shift matters (Case *c*). They separate on *mathematical implementation*, not necessarily on the verdicts of the five test cases provided. My tree groups them by "Sensitivity," but a specialist distinguishes them by *how* they achieve sensitivity.
  *   **Leaf 2 (Soft Incomparabilism) vs. Leaf 1 (Hard Incomparabilism):** On the specific test cases, both might say "No Verdict." They differ on *which* comparisons fail, which this tree's binary Node 1 doesn't fully capture.
  *   **Leaf 4 (Average) vs. Leaf 10 (Discounting):** Both can render infinite sums manageable and finite-like. They might agree on Case (a) (Finite Excellence wins), but for different reasons (Density vs. Time). The tree separates them at Node 3/8, but their outputs on the 5 cases often overlap.

  ---

  ## A Note on "Settled" vs. "Contested"

  **Settled (Bookkeeping):**
  *   It is settled that **Naive Totalism** (Leaf 5) fails the Hilbert Hotel test (Case *b*).
  *   It is settled that **Standard Arithmetic** cannot handle Mixed Infinities (Case *e*) without contradiction.
  *   It is settled that **Average Utilitarianism** (Leaf 4) faces severe technical problems defining "average" over infinite sets.

  **Contested (The Fight):**
  *   **Whether we *should* accept Sensitivity (Node 4).** Some say morality demands we care about the +1 (Hyperreal); others say our intuitions break at infinity and we should accept Insensitivity.
  *   **Whether Structure Matters (Node 6).** Is the universe a "set" of lives or an "ordered sequence"? This is a metaphysical fight, not just an ethical one.
  *   **Whether Incomparability is a Bug or a Feature.** Some see Incomparabilism (Leaf 1/2) as a failure of theory; others see it as the only honest admission of the limits of rationality.

  **Uncertainty:**
  *   I am unsure if **Leaf 6 (Cancellation View)** has *any* serious defenders. It appears in mathematical discussions of conditionally convergent series, but I know of no ethicist who argues we should *morally* treat infinite bliss + infinite torture as neutral. I have listed it as "Unexplored" rather than "Defended."
  *   I am unsure if **Leaf 3 (Lexical Quality)** is genuinely held for infinite cases. Many hold lexical views for finite populations, but few explicitly argue that 10 perfect lives beat $\aleph_0$ okay lives. It is logically possible, but empirically rare.
