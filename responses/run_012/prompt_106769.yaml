answer: |-
  Here are the desiderata for a theory of historical analogy, formulated to meet the rigor of your dispute without resorting to the very rhetorical moves you are scrutinizing.

  ### The Desiderata

  **1. The Selection Protocol**
  An adequate theory cannot treat the choice of precedent as exogenous. It must provide a rule for why *this* past episode is summoned rather than *that* one, independent of the desired outcome. It must explain why Munich is selected over Sarajevo, or Vietnam over Korea, without referencing the policy prescription the agent wishes to justify.
  *Consideration:* Without this, analogy is indistinguishable from cherry-picking. If the selection is determined by the conclusion, the reasoning is circular.

  **2. The Causal Depth Constraint**
  The theory must distinguish between *surface resemblance* (actors, geography, rhetoric) and *structural isomorphism* (incentive structures, balance of forces, information asymmetries). It must specify the criteria by which a causal mechanism in the source case is judged to be operative in the target case.
  *Consideration:* Surface resemblance licenses superstition; structural isomorphism licenses inference. A theory that collapses these allows a diplomat to argue that "dictators are always expansionist" based on facial similarity rather than strategic calculus.

  **3. The Underdetermination Clause**
  The theory must account for the fact that a single historical episode (e.g., Munich) can validly support contradictory prescriptions (appeasement prevents war vs. appeasement invites war) depending on which variables are held constant. It must provide a method for adjudicating between competing analogies drawn from the same event.
  *Consideration:* If the same past validates $P$ and $\neg P$, the past is not constraining the present. A theory that cannot resolve this renders history inert or infinitely malleable.

  **4. The Epistemic Status Distinction**
  The theory must rigorously separate the analogical move as a *generator of hypotheses* from its use as *warrant for belief*. It must specify what independent evidence is required to upgrade an analogical hunch into a decision-ready premise.
  *Consideration:* This prevents the "reverse-engineering" you suspect. If analogy is evidence, it proves too much; if it is a heuristic, it proves nothing on its own.

  **5. The Reflexivity Condition**
  The theory must model the feedback loop wherein the act of applying the lesson alters the base rates of the phenomenon. If agents act to avoid a "Thucydides Trap," they change the incentives that constitute the trap. The theory must explain how a lesson remains valid when its dissemination invalidates the conditions that made it a lesson.
  *Consideration:* This addresses the "self-defeating prophecy." If history is a dataset, and we are the data points, observing the data changes the data.

  ***

  ### Classification of Requirements

  **Non-Negotiable (Conditions of Adequacy)**
  *   **The Selection Protocol:** Any account that takes the precedent as given fails to explain the reasoning process; it merely describes the output.
  *   **The Epistemic Status Distinction:** Confusing hypothesis-generation with proof is a category error. A theory that permits this is logically unsound.
  *   **The Reflexivity Condition:** In social and political systems, observers are participants. Ignoring this renders the theory empirically false regarding how history functions in real time.

  **Camp Commitments (Preferences Disguised as Requirements)**
  *   **The Demand for Decisiveness:** Your friend (the diplomat) requires that the theory yield a specific policy prescription (e.g., "Intervene"). This is a pragmatic commitment, not a logical necessity. A theory can be adequate if it concludes "The analogy is inconclusive."
  *   **The Demand for Skeptical Suspension:** You (the skeptic) may prefer a theory that defaults to rejecting analogies unless proven structurally identical. This is a risk-aversion preference. An adequate theory might allow for probabilistic judgment even under uncertainty.
  *   **The Claim of Structural Regularity:** The "Thucydides Trap" proponents assume history repeats structurally. This is a metaphysical commitment to cyclical time, not a requirement of analogy itself.

  ***

  ### The Impossible Pair

  There is a pair of requirements that, if both insisted upon, makes the enterprise of historical analogy self-defeating.

  **1. Causal Invariance:** The theory requires that the causal mechanisms extracted from the historical precedent remain stable and invariant between the source (past) and the target (present) for the analogy to hold.
  **2. Performative Alteration:** The theory requires (via the Reflexivity Condition) that the recognition and application of the analogy by agents in the target context alters their behavior sufficiently to change the causal mechanisms at play.

  **The Tension:** If you satisfy **Causal Invariance**, you must ignore the fact that your decision changes the game (violating Reflexivity). If you satisfy **Performative Alteration**, you admit that the causal mechanisms are *not* invariant, which voids the analogy (violating Invariance).
  *Why this matters:* This pair suggests that the moment an analogy becomes useful enough to act upon, it becomes historically inaccurate. The "lesson" destroys the "laboratory." This is the core reason why the diplomat's confidence and your skepticism are both partially right: the tool works only until it is used.

  ***

  ### The Killer Requirement

  The single requirement that does the most to rule out the accounts of analogy people actually hold (including your friend's) is **The Epistemic Status Distinction**.

  **Why:** Most practitioners, especially in statecraft, treat the analogy as *premise* rather than *prompt*. They argue: "This is like Munich; Munich taught us X; therefore we do X." This treats the resemblance as evidence for the causal claim.
  An adequate theory must enforce: "This is like Munich; this *suggests* causal mechanism Y might be present; we must now find evidence for Y *independent of the Munich comparison*."

  By forcing the separation of the *suggestion* from the *validation*, this requirement rules out 90% of historical reasoning in policy circles. It renders the analogy powerless to carry the argumentative load on its own. It forces the diplomat to stop saying "Munich tells us to fight" and start saying "Munich suggests we check for incentive structures, and here is the data on those structures." It dissolves the authority of the precedent, leaving only the strength of the current analysis.
