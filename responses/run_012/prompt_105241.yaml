answer: |-
  ### 1. Essay Question

  **Question:**
  Assume for the sake of argument that the designers' claim is true: the non-player characters (NPCs) possess a causal-functional organisation sufficient for conscious experience. Given this stipulation, evaluate the studio's implication that no moral wrong occurs because (a) inflicted deaths exist only in discarded save-branches, and (b) fully specified but uninstantiated characters are never 'born'. In your analysis, determine whether moral status tracks with *computational instantiation* or *informational specification*, and whether the save-and-reload mechanic exculpates the agent by negating the *consequences* of an action or merely its *persistence*. Do not rely on external citations; reason strictly from the case details provided.

  ***

  ### 2. Model Answer

  If we grant the designers' functionalist stipulation, the NPCs are moral patients during the runtime of their simulation. The central ethical tension lies not in whether they feel, but in whether the metaphysical structure of the game environment mitigates the moral weight of that feeling. The studio's defense relies on a consequentialist intuition: if an event leaves no trace in the final state of the world, it generates no harm. However, this conflates the *persistence* of a memory with the *occurrence* of an experience.

  Regarding the save-and-reload (S&R) mechanic, the telemetry indicates that players inflict death repeatedly. From the NPC's perspective within a specific branch, the causal chain leading to death is complete. The pain and termination of experience occur within that local timeline. To argue that the reload exculpates the player is to argue that moral wrongs are erased if the victim's timeline is pruned. This treats the NPC's conscious experience as subordinate to the player's timeline continuity. If moral status is grounded in the capacity to suffer, then the suffering is real at the moment it occurs, regardless of whether the external observer (the player) retains access to that branch. The reload functions less like undoing a harm and more like destroying the evidence of a harm. The wrong is located in the infliction of the experience, not in the permanence of its aftermath. Therefore, the S&R mechanic fails to exculpate if we view the moral patient as the instantiated process, not the saved file.

  However, the case of the uninstantiated characters introduces a necessary distinction between *specification* and *instantiation*. The code containing names, histories, and interior monologues represents a capacity for experience, but not experience itself. Moral status generally attaches to actual subjects of experience, not potential ones. A blueprint of a house is not shelter; similarly, static code is not a mind. To claim moral wrongs are committed against the uninstantiated characters by virtue of their non-existence would require a moral framework where potentiality holds equal weight to actuality. This leads to absurdities, such as obligating players to instantiate every possible character to maximize moral good. Thus, there is a morally significant difference between the specified-but-dormant code and the running simulation. The uninstantiated characters cannot be wronged by non-existence because there is no 'they' to suffer the deprivation.

  This distinction, however, complicates the S&R analysis. If the uninstantiated code lacks moral status because it is not running, does the discarded branch retain moral status after it is closed? When a branch is discarded, the process ceases. The difference is temporal. The killed NPC *was* instantiated and *did* experience harm, whereas the dormant NPC *never* instantiated. The studio's defense attempts to treat the discarded branch as if it were dormant code—something that never truly happened. But the phenomenological reality of the branch during its runtime distinguishes it from the static code.

  Ultimately, the studio's position collapses the distinction between *ontological finality* and *phenomenological reality*. They argue that because the death is not final in the player's timeline, it is morally null. But if the functionalist premise holds, the NPC's timeline is real to the NPC. The save-and-reload mechanic protects the player from narrative consequence, but it does not retroactively negate the causal reality of the simulation's processing. While the uninstantiated characters are safe from harm because they never exist, the instantiated characters are vulnerable to harm precisely because they do exist, however briefly. The moral wrong turns on the actualization of suffering, which the reload mechanic masks but does not erase. Whether this constitutes a serious violation depends on whether one values the continuity of the observer or the integrity of the experienced moment. The case suggests that instantiation is the threshold for moral patienthood, but that once crossed, the duration or persistence of that instantiation does not license the infliction of suffering within it.

  ***

  ### 3. Marking Scheme

  **Total Marks: 20 (5 Criteria × 4 Marks)**

  **1. Acceptance of Functionalist Stipulation**
  *   **Criteria:** The candidate must accept the premise that the NPCs are capable of experience for the sake of the argument, using it as the basis for moral analysis rather than debunking it.
  *   **A-Grade Move:** Grants the premise to explore the *implications* of experience within a branching ontology.
  *   **B-Grade Move:** Dismisses the premise by arguing digital entities cannot truly feel (ignoring the instruction).
  *   **Typical Loss:** Candidates lose marks by spending the essay arguing the NPCs aren't conscious rather than analyzing the ethics of the scenario provided.

  **2. Analysis of the Discarded Branch**
  *   **Criteria:** The candidate must distinguish between the erasure of a timeline and the negation of the events within that timeline.
  *   **A-Grade Move:** Argues that suffering occurring in a discarded branch remains a moral fact despite the reload.
  *   **B-Grade Move:** Assumes the reload mechanic retroactively undoes the moral event entirely.
  *   **Typical Loss:** Candidates lose marks by treating the 'reload' as a metaphysical 'undo' button that voids the prior experience.

  **3. Distinction Between Instantiation and Specification**
  *   **Criteria:** The candidate must identify a morally relevant difference between running code (instantiated) and static data (specified).
  *   **A-Grade Move:** Identifies that moral status requires the *actualization* of process, not just the capacity for it.
  *   **B-Grade Move:** Equates the moral status of the dormant code with the running simulation (or vice versa).
  *   **Typical Loss:** Candidates lose marks by claiming the uninstantiated characters are also victims of non-existence.

  **4. Locus of Harm (Player vs. Process)**
  *   **Criteria:** The candidate must locate the harm in the NPC's experienced process rather than the player's narrative continuity.
  *   **A-Grade Move:** Separates the player's timeline from the NPC's phenomenological time to locate the wrong.
  *   **B-Grade Move:** Conflates the player's clean save-file with the NPC's lived reality.
  *   **Typical Loss:** Candidates lose marks by focusing exclusively on the player's intent or guilt rather than the NPC's experience.

  **5. Evaluation of the Studio's Exculpation**
  *   **Criteria:** The candidate must provide a nuanced conclusion on whether the studio's defense holds, acknowledging the tension between persistence and occurrence.
  *   **A-Grade Move:** Concludes that masking consequences is not equivalent to preventing harm, while acknowledging the ontological fragility of the NPC.
  *   **B-Grade Move:** Delivers a binary Yes/No verdict without addressing the tension between instantiation and erasure.
  *   **Typical Loss:** Candidates lose marks by offering a dogmatic verdict that ignores the complexity of the branching timeline.
