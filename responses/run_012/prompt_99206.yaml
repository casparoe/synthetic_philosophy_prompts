prompt: |-
  ok so i've fallen down a rabbit hole about how two people should split a surplus they can only get by agreeing with each other, and i've got two rival answers that seem to pull in different directions and i can't work out which one is actually right. quick setup so we're on the same page. there's a feasible set of payoff pairs (all the splits they could conceivably agree on), and a disagreement point, which is what each of them walks away with if talks collapse. the Nash answer says: subtract the disagreement point off, then pick the point in the set that maximizes the product of the two people's gains. the pitch for it is that it's the only rule satisfying a short list of axioms -- it sits on the Pareto frontier, it's symmetric (doesn't care which player we call player 1), it's invariant to rescaling either person's utility, and it satisfies independence of irrelevant alternatives, meaning if you shrink the feasible set but the chosen point is still available, the choice shouldn't move. the other answer, from Kalai and Smorodinsky, says: draw a straight line from the disagreement point to the "utopia" point (where each person gets their best possible payoff), and take wherever that line crosses the Pareto frontier. it keeps Pareto, symmetry and rescaling, but ditches IIA and instead insists on a monotonicity idea -- roughly, if you expand the set in a way that raises what a player can get at every level of the other player's payoff, that player shouldn't end up with less. i might be mangling that axiom a bit so feel free to correct me on it.

  write me a dialogue between two people, one defending each of these as the right way to split the surplus. make them both sharp. i don't want the Nash person winning on technicalities while the KS person just whines about fairness, and i don't want the reverse either -- they should be going after each other's actual sentences, not talking past each other.

  here's a toy case i worked out so there's something concrete on the table: the disagreement payoffs are zero for both, and the feasible deals are everything in the convex hull of (1, 0), (0.5, 1) and (0, 1.5) -- so they can mix those three however they like. i get Nash landing on (0.5, 1) and Kalai-Smorodinsky landing on (4/7, 6/7), so they genuinely disagree. have them argue about which of those two points the bargainers should actually end up at and why.

  some things i want them to really fight over. the Nash person should explain why independence of irrelevant alternatives isn't just a technicality, and the KS person should press on whether it's really sensible that the shape of the rest of the set gets ignored. the KS person should have to defend throwing IIA away -- what exactly do you lose when you do that -- and the Nash person should push on whether the monotonicity axiom is as innocent as it sounds. i also want the noncooperative story in there: the Nash person can bring up the thing where two people take turns proposing splits and the answer drops out of the equilibrium as the offers come faster and faster, and the KS person can come back with why that just picks out one bargaining protocol among many and why fairness shouldn't be hostage to which protocol we happen to write down. and let them get into the deeper disagreement about whether the disagreement point should be doing any anchoring work at all.

  keep it as continuous prose -- no headings, no bullet points, no bold, no tables, just paragraphs like a long email. and at the very end, outside the dialogue, add a short note saying how confident you are in the various claims you put in their mouths and naming the single point you're least sure about.

  don't worry about citing anything, i definately don't want a reading list.
