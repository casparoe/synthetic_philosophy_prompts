          4.  Closing Section (What moves the debate vs. what doesn't).
      *   **Constraints:** No reading lists/citations, reason from positions, dissolve verbal disputes plainly.
      *   **Specific Content:** Must incorporate the heterogeneous battery (humans, animals, LLMs), the shared confound case (memory/prediction), and the transfer case.

  2.  **Deconstruct the Positions:**
      *   **Single-Capacity (g-factor/Generalist):** Intelligence is a real, causal property. High performance across diverse tasks correlates because of this underlying *thing*. It explains the correlation.
      *   **Pluralist (Modular/Contextualist):** 'Intelligence' is a label for a bundle of skills. Correlations exist due to task overlap, testing methods, or environmental demands, not a single causal engine. Different tests reveal different structures.

  3.  **Drafting Section 1: Agreed Claims:**
