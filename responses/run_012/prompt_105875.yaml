answer: |-
  # Joint Statement of Adversarial Collaboration: The Structure of Intelligence

  **Date:** 24 May 2024
  **Parties:** The Single-Capacity Camp & The Pluralist Camp
  **Subject:** The ontology and measurement of intelligence across biological and artificial systems.

  ## 1. Agreed Claims

  We, the undersigned, acknowledge that our disagreement concerns the *interpretation* of observed phenomena rather than the phenomena themselves. We commit to the following claims as a baseline for further inquiry.

  1.  **Observable Variation:** Individuals (human, non-human, and artificial) vary in their performance speed, accuracy, and efficiency across cognitive tasks. This variation is stable over time within the same individual under similar conditions.
  2.  **The Positive Manifold:** When a standard battery of diverse cognitive tasks is administered to a human population, performance scores tend to correlate positively. That is, an individual who performs above average on one task is statistically more likely to perform above average on others.
  3.  **Statistical Reduction:** It is mathematically valid to extract a first principal component (a single dimension) from such a correlation matrix. This dimension accounts for a significant portion of the variance in performance.
  4.  **Measurement Dependence:** The strength and structure of these correlations depend on the selection of tasks, the scoring methods, and the range of abilities represented in the sample. Changing the battery changes the correlation matrix.
  5.  **Divergence on Causality:**
      *   **What we agree on:** A dominant statistical dimension exists in standard testing regimes.
      *   **Where we diverge:** The Single-Capacity camp claims this dimension reflects a *causal property* inherent to the agent (a general engine). The Pluralist camp claims this dimension reflects *structural overlap* in the tasks or testing environment (a descriptive summary).
  6.  **Predictive Utility:** Both sides agree that past performance on a battery predicts future performance on similar batteries, regardless of whether this is due to a general capacity or stable bundles of specific skills.

  ## 2. Disagreements Table

  The following table isolates the genuine points of contention. We have distinguished between substantive disagreements (about how the world works) and verbal disagreements (about how we use language).

  | # | Point of Difference | Single-Capacity Position | Pluralist Position | Type |
  | :--- | :--- | :--- | :--- :--- |
  | **1** | **The Nature of 'g'** | The dominant statistical dimension picks out a real, causal mechanism (or set of tightly coupled mechanisms) that facilitates performance across diverse domains. | The dominant dimension is an artefact of task construction. It summarises overlapping demands (e.g., attention, working memory) but does not name a singular cause. | **Substantive** |
  | **2** | **Invariance** | If we construct a truly representative battery of cognitive challenges, the general dimension will persist. It is robust to changes in test design. | If we construct a battery designed to minimise shared task demands (e.g. different modalities, response types), the general dimension will fragment or disappear. | **Substantive** |
  | **3** | **Definition of 'Intelligence'** | 'Intelligence' refers primarily to the latent general capacity that drives the correlations. Specific skills are expressions of this capacity. | 'Intelligence' is a folk-psychological label for a profile of competences. There is no privilege to the general factor over specific abilities. | **Verbal** |
  | **4** | **Meaning of 'Real'** | A trait is 'real' if it has predictive power and stability across contexts, implying an underlying biological or computational substrate. | A trait is 'real' only if it corresponds to a distinct, isolatable mechanism. A statistical summary without a unique mechanism is not a natural kind. | **Verbal** |
  | **5** | **Explanation of Correlation** | Correlations exist because a single resource (e.g., processing efficiency) is taxed by all complex tasks. | Correlations exist because complex tasks inevitably share minor sub-routines (e.g., reading instructions, sustained attention), not because of a central processor. | **Substantive** |

  *Note on Verbal Disputes:* Regarding Row 3 and 4, we acknowledge that if the Single-Capacity camp defines 'real' as 'statistically robust' and the Pluralist camp defines 'real' as 'mechanistically unitary', they may be talking past one another. We agree to suspend argument on the word 'real' until the mechanistic evidence (Row 1) is settled.

  ## 3. The Cruxes

  To move beyond semantics, we identify three specific experimental scenarios. For each, we state the setup, the predictions each side commits to in advance, and the conditions under which each side would consider their position weakened.

  ### Crux 1: The Maximally Heterogeneous Battery

  **Setup:** We construct a battery containing five tasks with minimal surface overlap: (1) Mental rotation (spatial), (2) Verbal analogies (linguistic), (3) Social inference (theory of mind), (4) A foraging/resource-allocation puzzle (ecological), and (5) A procedural learning task (motor/sequence).
  **Subjects:** 500 Humans, 50 Non-human primates (or corvids), 2 distinct Language Model architectures (varying sizes).
  **Scoring:** A single, normalised efficiency score is calculated for each subject on each task.

  **Predictions:**
  *   **Single-Capacity:** "We predict a strong positive correlation matrix across all five tasks for all three subject types. A single first principal component will explain at least 40% of the variance, indicating that the same underlying factor drives performance regardless of modality."
  *   **Pluralist:** "We predict the correlation matrix will cluster by modality (e.g., verbal tasks correlate with verbal, spatial with spatial). Across the whole battery, the first principal component will be weak (explaining <15% of variance), indicating that 'general' performance is an artefact of using similar task types."

  **Falsification Conditions:**
  *   **Against Single-Capacity:** If the correlation between the foraging task and the verbal task is near zero (r < 0.1) in humans, despite high reliability within tasks, the claim of a *general* capacity is undermined.
  *   **Against Pluralist:** If a strong general factor emerges even when task modalities are completely distinct (e.g., non-linguistic foraging correlates perfectly with abstract logic), the claim that 'g' is merely a test artefact is undermined.

  ### Crux 2: The Shared Confound (The 'Memory' Case)

  **Setup:** We analyse a system (specifically a Language Model) that performs excellently across the battery above. We identify that this performance is driven almost entirely by a single parameter: context window size (memory). When memory is capped, performance drops equally across all tasks. When memory is expanded, performance rises equally across all tasks.
  **Question:** Does this support the Single-Capacity view (memory *is* the general capacity), undercut it (performance is a confound, not ability), or neither?

  **Positions:**
  *   **Single-Capacity:** "This neither supports nor undercuts us, provided that 'capacity' is understood to include resource constraints. However, to distinguish a genuine general capacity from a shared confound, we must show that two systems with *equal* memory capacity still differ in 'g'. If performance varies while memory is held constant, a processing efficiency factor exists beyond the resource bottleneck."
  *   **Pluralist:** "This undercuts the Single-Capacity view. It demonstrates that the 'general' factor is reducible to a specific, narrow architectural parameter. If 'intelligence' dissolves when you control for memory, then 'intelligence' was not a general cause, but a label for memory bandwidth."

  **Falsification Conditions:**
  *   **Against Single-Capacity:** If, after controlling for memory and compute, no variance remains between individuals on diverse tasks, the 'general capacity' is indistinguishable from a resource bottleneck.
  *   **Against Pluralist:** If, after controlling for memory, a strong general factor *remains* (i.e., some agents use the same memory more effectively across all tasks), the claim that 'g' is purely an artefact of task demands is weakened.

  ### Crux 3: The Transfer Case

  **Setup:** An agent (human or model) undergoes intensive training on Task A (e.g., complex strategic planning in a novel game) until they reach ceiling performance. They are then tested on Task B (e.g., abstract pattern recognition) which shares no surface content, rules, or motor requirements with Task A.
  **Question:** Does proficiency in A improve performance in B?

  **Predictions:**
  *   **Single-Capacity:** "We predict positive transfer. Training on Task A strengthens the general capacity, which should result in a statistically significant improvement in the rate of learning or final performance on Task B compared to a control group."
  *   **Pluralist:** "We predict null transfer. Proficiency in Task A reflects specific neural or computational weights tuned to that domain. Without overlapping content, there is no mechanism for transfer. Any observed correlation is due to pre-existing differences, not training effects."

  **Interpretation of a Null Result:**
  *   **Single-Capacity:** "A null result suggests the training on Task A was insufficient to alter the underlying capacity, or that Task A was too narrow to engage the general system. It does not disprove generality, but it requires us to identify which tasks *do* engage the general system."
  *   **Pluralist:** "A null result confirms modularity. It shows that cognitive improvements are local, not global."

  **Falsification Conditions:**
  *   **Against Single-Capacity:** If extensive training on a highly complex Task A yields *zero* transfer to *any* distinct Task B across multiple studies, the hypothesis that a single trainable capacity exists is untenable.
  *   **Against Pluralist:** If training on a purely abstract Task A yields significant, replicable improvement on a wholly distinct Task B (controlling for motivation and strategy), the claim that competences are independent bundles is untenable.

  ## 4. Closing: Moving the Debate

  We agree that the debate will not be resolved by re-analysing existing psychometric data, as both sides can accommodate existing correlation matrices through post-hoc adjustments (e.g., by arguing over test selection or factor rotation).

  **What Would Move the Debate:**
  1.  **Mechanistic Isolation:** Identifying a specific computational or biological mechanism that, when damaged or enhanced, alters performance across *all* diverse tasks equally. (Favours Single-Capacity).
  2.  **Double Dissociation:** Demonstrating subjects who are impaired on Task A but intact on Task B, and vice versa, with no correlation between the deficits across a population. (Favours Pluralist).
  3.  **Predictive Success:** One side successfully predicting the correlation structure of a *novel* battery designed by the opposing side before data is collected.

  **What Would Not Move the Debate:**
  1.  **Semantic Stipulation:** Arguing over whether the word 'intelligence' should apply to the general factor or the specific skills. We agree to use precise descriptors (e.g., 'general factor variance' vs 'specific skill profile') rather than the loaded noun.
  2.  **Appeals to Intuition:** Claims about what "feels" like general thinking.
  3.  **Existence Proofs:** Merely showing that 'g' can be extracted statistically (Pluralists accept this) or that specific modules exist (Single-Capacity proponents accept this). The dispute is about *exhaustiveness* and *causality*, not existence.

  We sign this statement to acknowledge that while we differ on the architecture of the mind, we agree on the rules of evidence required to settle the matter.

  **Signed,**

  _________________________
  *Representative, Single-Capacity Camp*

  _________________________
  *Representative, Pluralist Camp*
