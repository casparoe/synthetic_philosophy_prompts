      *   *Measurement:* Both agree we can measure performance. Both agree a statistical "first principal component" often emerges.
      *   *Interpretation:* Here is where we split. One says it's causal; the other says it's descriptive/artefactual.
      *   *Drafting thought:* Need to be careful not to sneak in "general ability" as a fact in the agreed section. Call it a "statistical dimension."

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Goal:* Clarify *why* they disagree. Is it about the world or the words?
      *   *Row 1 (Ontology):* Is 'g' a cause or a summary? (Substantive).
      *   *Row 2 (Terminology):* What does the word "intelligence" refer to? (Verbal). One says the latent factor, the other says the whole profile.
      *   *Row 3 (Stability):* Is the structure invariant across test designs? (Substantive).
      *   *Refinement:* Ensure the wording is charitable. Instead of "Pluralists deny reality," say "Pluralists view it as an artefact of measurement."

  5.  **Drafting Section 3: The Cruxes (The Core Task):**
      *   *Constraint:* Use the specific scenarios provided (Heterogeneous Battery, Shared Confound, Transfer Case).
      *   *Crux 1: The Heterogeneous Battery.*
          *   *Setup:* Spatial, verbal, social, foraging, procedural. Humans, Non-humans, LLMs.
          *   *Single-Capacity Prediction:* Strong positive correlations across all tasks. A dominant first factor (g) will emerge regardless of species/model.
          *   *Pluralist Prediction:* Correlations will cluster by modality or task demand. The 'g' factor will weaken or disappear if tasks are truly distinct in processing requirements.
          *   *Falsification:* Single-Capacity admits defeat if correlations are near zero or negative. Pluralist admits defeat if a strong, invariant g emerges despite maximal heterogeneity.
      *   *Crux 2: The Shared Confound (Memory/Prediction).*
          *   *Setup:* System excels due to one specific mechanism (e.g., huge context window).
          *   *Single-Capacity View:* This challenges the view if 'g' is supposed to be *general reasoning* rather than *resource scaling*. They need to distinguish capacity from mechanism.
          *   *Pluralist View:* This supports them. It shows the correlation is due to a specific resource, not a general "mind."
          *   *Distinction:* We need to control for the resource. If performance holds when resource is equalized, Single-Capacity wins.
      *   *Crux 3: Transfer Learning.*
          *   *Setup:* Train on Task A, Test on Task B (no obvious overlap).
          *   *Single-Capacity Prediction:* Positive transfer. Improving the general capacity helps B.
          *   *Pluralist Prediction:* Null or negative transfer. Skills are specific.
          *   *Null Result Interpretation:* Single-Capacity says "Training wasn't deep enough." Pluralist says "Skills are modular."
          *   *Refinement:* Need to make the falsification concrete. If transfer is zero despite high proficiency in A, Single-Capacity is pressured.

  6.  **Drafting Section 4: Closing:**
      *   *Goal:* Meta-agreement on how to proceed.
      *   *Moves the debate:* Predictive success on novel tasks, mechanistic explanations of *why* correlations happen.
      *   *Doesn't move the debate:* Semantic arguments about the word "intelligence," re-analyzing old datasets without new constraints.

  7.  **Review and Refine (Self-Correction):**
      *   *Check Tone:* Is it British English? (e.g., "programme," "behaviour," "centre"). Is it neutral?
      *   *Check Constraints:* Did I include citations? No. Did I use the specific test cases? Yes.
      *   *Check Logic:* In Crux 2, ensure the Single-Capacity view isn't strawmanned. They might argue memory *is* part of general intelligence. I need to frame it as "Is the correlation due to a general *reasoning* engine or just a bottleneck resource?"
      *   *Check Verbal Disputes:* Make sure to explicitly label the "intelligence" definition row as verbal.
      *   *Check Falsification:* Ensure each side admits what would prove them *wrong*, not just what proves the other wrong.

  8.  **Final Polish:** Check formatting (numbered lists, tables). Ensure the distinction between "observable performance" and "latent cause" is sharp in Section 1. (Proceed to generate output).

  *(Self-Correction during drafting Crux 2)*: The prompt asks: "Does that support the single-capacity view, undercut it, or neither?" I need to make sure both sides answer this.
  *Single-Capacity:* Might say "Neither, unless that resource is the definition of the capacity." Or "Undercuts it if we claim g is reasoning, not memory."
  *Pluralist:* "Supports us. It shows the 'general' factor is just a specific bottleneck."
  *Refinement:* Let's frame it as: If performance is driven *solely* by one narrow mechanism (like context window size), does that count as 'general intelligence'?
  *Single-Capacity:* "Yes, if that mechanism enables generality."
  *Pluralist:* "No, that's just a specific parameter."
  *Crux:* Can we find a case where the mechanism is constant but 'g' varies? Or where 'g' is constant but mechanism varies?
  *Better Crux:* Control for the resource. If we fix memory size, does the correlation remain?

  *(Self-Correction during drafting Crux 3)*: Transfer case.
  *Single-Capacity:* Expects transfer.
  *Pluralist:* Expects specificity.
  *Falsification:* Single-Capacity must admit that if *no* transfer occurs across *any* distinct domains despite mastery, the "general" claim is weak. Pluralist must admit if *perfect* transfer occurs across wildly different domains, modularity is weak.

  *(Final check on British English)*: Ensure "s" instead of "z" in organisation/normalisation, "behaviour", "programme" (though program is common in tech, behaviour is safer for general text), "centre".

  *(Final check on "Adversarial Collaboration")*: Ensure the voice is "We agree..." not "Side A says...". It's a joint document.

