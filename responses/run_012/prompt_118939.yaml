answer: |-
  Dear Colleague,

  You ask for a verdict on whether the Gibbard–Satterthwaite theorem condemns non-dictatorial collective choice or merely condemns the demand for strategy-proofness. My position is clear. The theorem does not reveal a flaw in democracy but rather a flaw in the normative demand that democratic institutions be immune to the strategic reasoning of the agents they serve. Strategy-proofness is the assumption that must be relinquished. To insist on it is to demand a political system that functions independently of the agency of its participants, treating voters as passive data points rather than active reasoners. The impossibility lies not in aggregating preferences without a dictator, but in aggregating them without inviting the voters to think strategically about the aggregation mechanism itself. When we accept that manipulation is possible, we do not concede defeat; we acknowledge that politics is a game of reason and counter-reason, not a mechanical computation of a pre-existing general will.

  Your first hesitation concerns domain restriction, and it is a serious one. It is true that if we restrict preferences to a single-peaked domain, the median voter theorem provides a rule that is anonymous, non-dictatorial, and strategy-proof. Similarly, separable preferences allow for component-wise voting that resists manipulation. But relying on this as a normative salvation mistakes a contingent empirical regularity for a structural principle. The richness of the universal domain in the theorem is not an arbitrary modeling assumption; it is a placeholder for the complexity of political conflict. In actual politics, issues are multidimensional, coalitions are fluid, and preferences are rarely so well-behaved that they align on a single axis. To build a normative theory on the hope that preferences will remain single-peaked is to build it on the hope that political conflict will remain simple. When the domain expands to reflect the reality of multidimensional policy spaces, the possibility of strategy-proofness collapses again. Therefore, domain restriction does not solve the normative problem; it merely postpones it to those rare moments when political conflict is unusually structured. We cannot design institutions based on the assumption that society will avoid the very conflicts that make institutions necessary.

  Your second hesitation involves randomization, specifically the result that random dictatorship is the only anonymous, strategy-proof, and ex post efficient rule. You ask whether this is an escape or a restatement. I argue it is a restatement that evacuates the normative content of collective choice. A random dictatorship satisfies the mathematical condition of strategy-proofness because no voter can gain by lying about their top choice, but it fails the political requirement of collective agency. In a random dictatorship, the outcome is determined by the preference of a single individual, selected by chance. While the selection process is fair ex ante, the decision process is autocratic ex post. There is no compromise, no aggregation of differing intensities, and no deliberation. It preserves the letter of strategy-proofness by abandoning the spirit of collective choice. If the goal of political economy is to understand how a group can decide together, a mechanism that decides by picking one person to decide alone is a surrender, not a solution. It confirms that strategy-proofness is compatible with choice only when that choice is not truly collective.

  Your third hesitation regards scale and the vanishing probability of being pivotal. In large electorates, the incentive to manipulate becomes negligible for any individual voter, suggesting that approximate strategy-proofness might suffice. However, we must be careful not to confuse a practical mitigation with a normative resolution. An incentive that is vanishingly small for each voter is not necessarily small in the aggregate, and more importantly, a rule that is technically manipulable remains manipulable even if agents are too ignorant to exploit it. Normative theory should not rely on the ignorance of participants. Yet, this point ultimately supports the verdict against strict strategy-proofness. It suggests that the appropriate normative standard is not dominant strategy implementation but rather equilibrium analysis in large games. If we accept that voters will act according to Bayesian Nash equilibria rather than dominant strategies, we can design mechanisms that are efficient and fair but not strategy-proof in the strict sense. This shift acknowledges that incentives matter but refuses to let the impossibility of eliminating them paralyze institutional design. Approximate strategy-proofness does not move the impossibility one step out; it redefines the goal from immunity to robustness.

  So I maintain that strategy-proofness is the assumption doing the impossible work. It demands that a social choice function be immune to the very rationality it presumes in its agents. By dropping this demand, we open the door to mechanisms that may be manipulable but are also more efficient, more representative, or more conducive to compromise. For this verdict to hold, actual political institutions must be designed with the expectation of strategic behavior. This means transparency must be high enough that manipulation is visible, and iteration must be possible so that manipulated outcomes can be corrected over time. It means accepting that voting rules are not static calculators but dynamic environments where learning occurs. We must concede that if manipulation leads to systemic instability or if strategic behavior consistently produces outcomes that violate basic rights or efficiency bounds regardless of institutional safeguards, then the verdict fails. If it turns out that manipulable rules inevitably degrade into oligarchy or chaos because agents cannot coordinate on equilibria, then we would be forced to retreat to domain restrictions or accept the hollow fairness of randomization. But until that degradation is demonstrated, we should treat the Gibbard–Satterthwaite theorem as a warning against the quest for mechanical purity, not as a proof of democratic impossibility. The theorem tells us that we cannot have a democracy that protects us from ourselves, and normatively, we should not want one.
