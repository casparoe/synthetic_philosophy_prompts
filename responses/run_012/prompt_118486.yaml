prompt: |-
  A colleague has persuaded me that evolutionary psychology is a pseudoscience, and I want to know whether the argument holds. It runs as follows: the field explains traits by inventing selection pressures after the fact, and since the environment of evolutionary adaptedness — the ancestral conditions in which those traits supposedly evolved — can no longer be observed, none of its claims can be falsified; and an unfalsifiable claim that is nonetheless believed is a piece of pseudoscience. His exhibit is the suggestion that the nausea of early pregnancy is an adaptation that discouraged ancestral women from eating plant toxins during the window when the embryo is most vulnerable to them: the only way to test it, he says, would be to travel back and watch. I suggested that one might instead ask whether the sickness tracks the window of vulnerability, and whether it is rarer in societies whose staple foods contain fewer such compounds; he replied that this only fits the story to data already in hand. Is a claim of that kind genuinely unfalsifiable, and if so, does that place it outside science altogether? If not, what would a genuinely risky prediction for an adaptationist hypothesis look like, given that the environment it refers to is gone?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Question:** Is evolutionary psychology (EP) a pseudoscience because its claims are unfalsifiable (specifically regarding "just-so stories" about the Environment of Evolutionary Adaptedness - EEA)?
      *   **Colleague's Argument:** EP invents selection pressures after the fact. The EEA is unobservable. Therefore, claims can't be falsified. Unfalsifiable belief = pseudoscience. Example: Morning sickness as a toxin-avoidance adaptation.
      *   **User's Counter-Argument:** We can check if sickness tracks vulnerability windows or varies by diet.
      *   **Colleague's Rebuttal:** That's just fitting the story to existing data (post-hoc).
      *   **Specific Questions to Answer:**
          1.  Is this kind of claim genuinely unfalsifiable?
          2.  If so, does that make it pseudoscience?
          3.  If not, what does a *risky prediction* look like in EP given the EEA is gone?

  2.  **Deconstruct the Colleague's Critique (The "Standard Criticism"):**
      *   *Premise 1:* EP relies on "just-so stories" (Kipling-esque narratives).
      *   *Premise 2:* The EEA is unobservable/unrecoverable.
      *   *Conclusion:* Hypotheses cannot be tested/falsified.
      *   *Verdict:* Pseudoscience (Popperian falsificationism).
      *   *Validity:* This is a well-known critique (e.g., by Gould, Lewontin, Buller). It has merit in specific cases but is often overstated as a blanket condemnation of the whole field.

  3.  **Evaluate the "Morning Sickness" Example (Profet's Hypothesis):**
      *   *Hypothesis:* Nausea protects the fetus from teratogens (plant toxins) during organogenesis.
      *   *Colleague's view:* Can't go back in time to see if it helped.
      *   *User's view:* Check timing (organogenesis) and cross-cultural diet.
      *   *Scientific Status:* This hypothesis *has* been tested.
          *   Timing: Does nausea peak during organogenesis? Yes.
          *   Cross-cultural: Is it less common where toxins are low? (Harder to test, but dietary aversions are specific).
          *   Outcomes: Do women who *don't* get sick have higher miscarriage rates? (Some studies say yes, some no).
          *   Mechanism: Are the foods aversive to pregnant women high in teratogens? (Yes, often bitter/alkaloid-rich).
      *   *Falsifiability:* If nausea peaked *after* organogenesis, or if aversive foods were *low* in toxins, the hypothesis would be weakened or falsified.

  4.  **Address the "Unfalsifiable" Charge:**
      *   *Is it unfalsifiable?* No. The EEA is not a single point in time we need to visit. It's a set of statistical regularities (predation, social structures, caloric scarcity, etc.).
      *   *Inference to the Best Explanation:* We use comparative data (primates), archeological data, and hunter-gatherer ethnography to reconstruct the EEA.
      *   *Phylogenetic Analysis:* We can compare traits across species to infer ancestral states.
      *   *Conclusion:* It is not *logically* impossible to falsify EP claims, though it is *methodologically difficult*.

  5.  **Address the "Pseudoscience" Label:**
      *   *Definition:* Pseudoscience implies a lack of willingness to correct errors, reliance on authority, or systematic avoidance of falsification.
      *   *Reality of EP:* Good EP generates novel predictions, uses rigorous methods (game theory, cross-cultural studies, neuroscience), and discards hypotheses when data contradicts them. Bad EP (pop EP) does what the colleague describes.
      *   *Nuance:* Distinguish between *Evolutionary Psychology* (the academic discipline) and *Pop Evolutionary Psychology* (magazine headlines).

  6.  **Develop the "Risky Prediction" Criteria (Answering the final question):**
      *   What makes a prediction risky in EP?
      *   *Novelty:* Predicting a phenomenon not yet observed.
      *   *Specificity:* Predicting *when* or *where* a trait should appear (e.g., conditional adaptations).
      *   *Convergent Evidence:* Predicting underlying mechanisms (neural, hormonal) that align with the function.
      *   *Comparative:* Predicting similar traits in related species under similar pressures.
      *   *Example:* Instead of "men prefer youth," predict "men's preference for youth increases in high-pathogen environments" (based on reproductive value cues). Or the morning sickness example: Predict specific aversion to bitter tastes *only* in the first trimester.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the colleague's argument is a classic one (Gould/Lewontin). It's not nonsense, but it's an oversimplification.
      *   *Section 1: The EEA and Falsifiability.* Explain that the EEA isn't a specific time/place but a set of selection pressures. We can reconstruct these without a time machine.
      *   *Section 2: The Morning Sickness Case.* Show how it *has* been tested. Mention Margie Profet. Mention that if the timing didn't match, the theory would fail. This counters the "unfalsifiable" claim.
      *   *Section 3: Post-hoc vs. A Priori.* Acknowledge the danger of "fitting the story." Good science requires *novel* predictions, not just explaining known data.
      *   *Section 4: What Risky Predictions Look Like.* Give concrete examples.
          *   Conditional strategies (if environment X, then behavior Y).
          *   Mismatch theory (modern environment reveals ancestral function).
          *   Physiological mechanisms (hormonal correlates).
      *   *Section 5: Pseudoscience vs. Hard Science.* Distinguish between the rigorous field and the pop-science version. The label "pseudoscience" is too broad for the whole field, though applicable to specific bad studies.
      *   *Conclusion:* Summarize. The colleague identifies a *risk* in the field, not an inherent *flaw* that disqualifies it.

  8.  **Refining the Tone:**
      *   Needs to be balanced. Don't dismiss the colleague entirely (the critique is valid for *bad* EP). Don't dismiss EP entirely (it's a legitimate scientific framework).
      *   Use philosophical terms correctly (falsification, Popper, inference to best explanation).
      *   Ensure the distinction between "adaptationist hypothesis" and "proven adaptation" is clear.

  9.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I address the "travel back in time" point? *Yes, by explaining reconstruction.*
      *   *Check:* Did I address the "fitting data" point? *Yes, by distinguishing post-hoc from a priori predictions.*
      *   *Check:* Is the morning sickness example accurate? *Profet's hypothesis is controversial but scientifically testable. Some studies support, some refute. That's the point of science.*
      *   *Check:* Am I being too defensive of EP? *Need to acknowledge the "replication crisis" and some overreach in the 90s.*

  10. **Final Polish:** Organize with clear headings for readability. Ensure the distinction between "unfalsifiable in principle" and "difficult to test" is sharp. (Proceed to generate output based on these thoughts.)

  *(Self-Correction Note)*: I should make sure to mention that the colleague's argument is essentially the "Spandrels" critique. It's important to validate that this is a serious philosophical objection, not just a layman's complaint, but also show why the field has evolved in response to it.

  *(Final Plan)*:
  1. Validate the colleague's critique (it's a known, serious objection).
  2. Refute the "unfalsifiable" claim (EEA reconstruction is possible).
  3. Analyze the Morning Sickness example (it is testable).
  4. Define what "risky predictions" look like in EP (mismatch, conditional, mechanistic).
  5. Conclude on the "pseudoscience" label (it applies to bad practice, not the methodology itself).

