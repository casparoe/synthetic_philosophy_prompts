answer: |-
  Your colleague has articulated one of the most famous and serious critiques of evolutionary psychology (EP), often associated with the biologists Stephen Jay Gould and Richard Lewontin (specifically their 1979 "Spandrels of San Marco" paper). Their argument is that EP practitioners often engage in "adaptationism"—assuming every trait is an optimal adaptation—and construct "just-so stories" that sound plausible but cannot be tested.

  However, while your colleague has identified a genuine *risk* within the field, his conclusion that the field is *inherently* pseudoscientific and *logically* unfalsifiable is incorrect. Here is a breakdown of why the argument holds water as a caution but fails as a total condemnation, and what genuine scientific testing in EP looks like.

  ### 1. Is the Environment of Evolutionary Adaptedness (EEA) unobservable?
  Your colleague argues that because we cannot travel back in time to observe the EEA, we cannot test hypotheses about it. This relies on a misunderstanding of what the EEA is.

  In evolutionary psychology, the EEA is not a specific time or place (e.g., "The African Savannah, 100,000 BC"). It is a statistical composite of the selection pressures that shaped a specific adaptation. We do not need a time machine to reconstruct these pressures. We use **convergent evidence** from:
  *   **Paleoanthropology:** Fossil records and tool use.
  *   **Primatology:** Comparing human traits with close relatives to infer ancestral states.
  *   **Ethnography:** Studying remaining hunter-gatherer societies (with appropriate caution).
  *   **Geology/Climate Science:** Reconstructing past climates and flora.

  If an EP hypothesis claims a trait evolved to solve problem *X*, and we know from geological and biological data that problem *X* did not exist or was negligible during the relevant period, the hypothesis is falsified. The EEA is not a "black box" that allows any story to fit; it is constrained by hard data from other disciplines.

  ### 2. The Morning Sickness Example: Is it unfalsifiable?
  Your colleague claims the "embryo protection hypothesis" (proposed by Margie Profet) is unfalsifiable because we can't watch ancestral women. This is incorrect. The hypothesis makes specific, testable predictions about the *present* based on the *past*.

  **The Hypothesis:** Nausea functions to expel/avoid teratogens (toxins) during organogenesis (when the fetus is most vulnerable).

  **Falsifiable Predictions:**
  1.  **Timing:** Nausea should peak during organogenesis (weeks 6–18) and subside afterward. (Data supports this).
  2.  **Aversion Content:** Foods aversive to pregnant women should be higher in teratogens than foods they crave. (Data supports this; bitter/alkaloid-rich plants are often avoided).
  3.  **Outcome:** Women who do *not* experience morning sickness should have higher rates of spontaneous abortion than those who do. (Some studies support this, others are mixed; this is where the science happens).
  4.  **Cross-Cultural:** In societies where the staple diet is low in plant toxins (e.g., marine-based diets), morning sickness should be less prevalent or severe.

  If studies showed that morning sickness peaked *after* organogenesis, or that pregnant women craved high-toxin plants, the hypothesis would be falsified. The fact that we can list conditions under which the theory would fail proves it is not unfalsifiable. Your colleague's claim that checking these data points is merely "fitting the story" confuses **testing a hypothesis** with **generating one**. Once a hypothesis exists, checking its predictions against data is the essence of science, not pseudoscience.

  ### 3. Post-Hoc Storytelling vs. Risky Predictions
  Your colleague is right to be suspicious of **post-hoc rationalization**. If a researcher observes a trait and *then* invents a reason for it without making new predictions, that is bad science. This is sometimes called the "narrative fallacy."

  However, a field is not pseudoscience because some practitioners do bad work; it is pseudoscience if the *methodology* precludes correction. Evolutionary psychology has developed rigorous methods to avoid this. A genuinely risky prediction in EP usually takes one of three forms:

  #### A. The "Mismatch" Prediction
  If a trait is an adaptation to the EEA, it should function poorly or strangely in modern environments that differ from the EEA.
  *   *Example:* If humans evolved to crave calorie-dense foods because scarcity was the ancestral norm, we should predict that in modern environments of abundance, this mechanism will lead to obesity (a mismatch). This was a risky prediction that has been borne out.
  *   *Risky aspect:* If humans turned out to have a perfect homeostatic mechanism that prevented weight gain regardless of calorie density, the adaptationist hypothesis about hunger regulation would be in trouble.

  #### B. Conditional Strategies (If-Then Rules)
  Adaptations are often not rigid behaviors but "facultative" mechanisms that switch based on environmental cues.
  *   *Example:* Instead of predicting "Men are aggressive," EP predicts "Men will exhibit higher aggression *when* their status is threatened *and* they are in a context where physical formidability determines status."
  *   *Risky aspect:* If data showed that status threats led to *withdrawal* regardless of context, the hypothesis fails. This moves the field away from "all men are X" stereotypes to testable conditional rules.

  #### C. Mechanistic Convergence
  An adaptationist hypothesis should predict underlying physiological or neurological mechanisms.
  *   *Example:* If fear of snakes is an evolved adaptation, we should predict that humans (even infants) detect snakes faster than neutral objects (like flowers) in visual search tasks, and that this triggers specific amygdala activation.
  *   *Risky aspect:* If reaction times were identical for snakes and flowers, or if the neural pathway was the same as for general novelty, the specific "predator detection" hypothesis would be weakened.

  ### 4. Is it Pseudoscience?
  To label a field pseudoscience (per Karl Popper or modern philosophy of science), it must typically show:
  1.  A lack of willingness to revise theories in light of negative evidence.
  2.  Reliance on anecdote rather than controlled study.
  3.  Absence of progress over time.

  Evolutionary psychology, as practiced in top-tier academic journals, does not meet these criteria. Hypotheses are frequently discarded or modified. For example, the idea that "depression is an adaptation" is currently hotly debated, with multiple competing models (e.g., social navigation hypothesis vs. pathology) being tested against one another.

  However, your colleague's critique is valid when applied to **Pop Evolutionary Psychology**—the kind found in newspaper headlines or pop-business books (e.g., "Why Men Cheat"). This subset often ignores the rigorous constraints described above and relies on the "just-so stories" your colleague despises.

  ### Summary
  Your colleague has correctly identified a **methodological hazard** (post-hoc storytelling) but incorrectly identified it as a **logical necessity** of the field.

  *   **Is it unfalsifiable?** No. We can reconstruct the EEA through convergent evidence, and hypotheses make predictions about current physiology, development, and cross-cultural variation that can be proven wrong.
  *   **Is it pseudoscience?** No. While bad studies exist, the field operates within the scientific method, discarding hypotheses that fail empirical tests.
  *   **What does a risky prediction look like?** It predicts a specific **mismatch** in modern environments, a **conditional switch** based on environmental cues, or a specific **physiological mechanism** that would not be expected if the trait were merely a byproduct of something else.

  You might concede to your colleague that *sloppy* evolutionary psychology is pseudoscience, but that rigorous evolutionary psychology is a legitimate, albeit difficult, scientific enterprise. The morning sickness hypothesis, for instance, is not a belief held despite evidence; it is a model that has survived several attempts to break it.
