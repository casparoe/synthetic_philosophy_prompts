      *Refining for the Prompt's Specifics:* Need to match the "homely example" constraint and the specific arguments about Jante vs. Dream.
      *   *Objection 1 (The Striver):* "I worked 80-hour weeks while others played. You telling me I'm not 'more' than them?"
