      *   **Audience:** ~60 people. Small business owners (contractors, bakery, insurance, car dealer), immigrants/children of immigrants (believe in the Dream), old-timers (Jante norm), event organizer (wants peace), young podcast listeners, retired teacher (library group), local reporter.
      *   **Core Message:** Deconstruct the American Dream/Tall Poppy/Jante dynamic.
          *   Claim 1: Anyone can rise (Opportunity).
          *   Claim 2: Those who rose earned it (Desert).
          *   Claim 3: Those who rise are worth more as people (Rank). *User says this is False.*
          *   Claim 4: Nobody should be seen to rise (Suppression). *User says this is Poison.*
          *   Thesis: Jante was right about #3, wrong about #4. American Dream defends #1 & #2 but often implies #3. Tall Poppy syndrome fights #3 but enforces #4.
      *   **Deliverable:** Q&A Prep Sheet (not a speech).
      *   **Requirements:**
          *   ~8 Objections (ordered by Likelihood × Damage).
          *   Phrased as the audience member would say it.
