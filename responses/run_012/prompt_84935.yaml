      8.  The "Grandmother Contradiction" (Family/Friend).

  4.  **Drafting Replies (Constraints: 90 seconds, no studies, homely examples):**
      *   *Tone:* Respectful, firm, landscaping metaphors where possible, grounded.
      *   *Focus:* Distinguish *worth* from *achievement*. Distinguish *hiding* from *humility*.

  5.  **Strategic Decisions:**
      *   *Concede Preemptively:* Acknowledge hard work (Claim 2) and acknowledge the need for celebration (Claim 1). This disarms the "anti-success" accusation.
