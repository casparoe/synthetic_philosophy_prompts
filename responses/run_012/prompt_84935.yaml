  7.  **Final Polish:** Organize into the requested format. Ensure the voice matches the prompt's intro (thoughtful, 38, no-nonsense but reflective).

      *(Self-Correction on the "Single Question"):* The prompt asks for the question I'm *hoping nobody asks*. This should be the one that exposes the hypocrisy of the speaker standing on a stage telling people not to stand out.
