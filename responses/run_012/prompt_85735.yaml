answer: |-
  ### Specification for Consequentialist Decision Theory Under Cluelessness

  **Purpose Statement:** Define a decision procedure for a bounded agent committing to action now. The procedure must maintain the axiom that only consequences determine moral value, avoid paralysis from uncertainty, avoid credulity regarding untraceable effects, and remain computationally feasible.

  **Status Key:**
  *   **[NON-NEGOTIABLE]:** Derived directly from the Purpose Statement. Failure here renders the theory useless for the stated goal.
  *   **[PREFERENCE]:** Derived from specific philosophical camps. Failure here changes the *flavor* of consequentialism but may still yield a usable agent.

  ---

  #### 1. Source Isolation
  **Specification:** The theory must explicitly classify the source of uncertainty as either *ontological* (the causal chain is indeterminate), *epistemic* (the chain exists but is unknown to the agent), or *axiological* (the outcomes are known but their value is undefined).
  **Case/Consideration:** Remedies differ by source. Gathering more data fixes epistemic uncertainty but wastes resources on ontological indeterminacy. Valuation protocols fix axiological uncertainty but fail on causal gaps. A theory that conflates these will prescribe data collection when the problem is undefined value, leading to resource exhaustion.
  **Status:** [NON-NEGOTIABLE]

  #### 2. Failure Mode Discrimination
  **Specification:** The theory must distinguish between three output states: (A) *Undefined* (no ranking exists), (B) *Low Confidence* (ranking exists but variance is high), and (C) *Unstable* (ranking inverts under permissible parameter perturbation).
  **Case/Consideration:** Treating (A) and (B) as identical leads to paralysis in (B) where action is warranted. Treating (C) as (B) leads to action on fragile premises. An agent needs to know if the check failed to run, passed with warnings, or is non-deterministic.
  **Status:** [NON-NEGOTIABLE]

  #### 3. Frame Invariance
  **Specification:** The verdict must not change when the same physical action is described using different valid granularities (e.g., "buying coffee" vs. "transferring currency" vs. "moving a hand").
  **Case/Consideration:** If the output depends on the input description, the procedure is not a decision theory but a text parser. An adversary could game the system by re-describing actions to force a desired verdict. Canonicalization is required before evaluation.
  **Status:** [NON-NEGOTIABLE]

  #### 4. Tail Sensitivity Bounding
  **Specification:** The theory must include a mechanism to discount effects where the probability is inversely proportional to the magnitude, such that arbitrarily large effects do not dominate the sum, while ensuring non-zero probability effects are not truncated to zero.
  **Case/Consideration:** Without a discount function, low-probability/high-impact scenarios (e.g., "Pascal's Mugging") dominate all decision-making, causing paralysis or absurdity. With a hard cutoff, the theory ignores potentially real catastrophic or utopian outcomes, violating the "only consequences count" axiom.
  **Status:** [NON-NEGOTIABLE]

  #### 5. Convergence Protocol
  **Specification:** The theory must define a stopping rule for summing consequences over time, or provide a proof that the infinite series of utility converges without one.
  **Case/Consideration:** An unbounded future implies an infinite series of effects. If the series diverges (e.g., oscillates or grows indefinitely), the expected value is undefined. A bounded agent cannot compute an infinite sum. The theory must specify how to approximate the limit or why the tail is negligible.
  **Status:** [NON-NEGOTIABLE]

  #### 6. Verdict Stability
  **Specification:** The theory must distinguish between "The right action is X, but I cannot compute it" and "There is no right action." The verdict should not be "undefined" solely due to the agent's computational limits.
  **Case/Consideration:** If the theory outputs "undefined" whenever the agent lacks data, it collapses into skepticism. The theory must provide a best-effort ranking based on available evidence, separating the *truth* of the matter from the *accessibility* of the truth.
  **Status:** [PREFERENCE] (Conflicts with strict Objective Consequentialism, required for Subjective Consequentialism).

  #### 7. Bounded Executability
  **Specification:** The decision procedure must halt and return a verdict within a finite, specified resource budget (time/memory) proportional to the urgency of the decision.
  **Case/Consideration:** A theory that requires omniscience or infinite computation is not a tool for a bounded agent. If the theory demands more calculation than the decision window allows, it defaults to inaction, violating the "avoid paralysis" constraint.
  **Status:** [NON-NEGOTIABLE]

  #### 8. Permissibility Filtering
  **Specification:** The theory must be capable of outputting a verdict of "Impermissible" for at least some actions. It cannot classify all actionable options as "Roughly Equal" or "Permissible."
  **Case/Consideration:** A theory that dissolves cluelessness by declaring all options morally equivalent loses its normative force. It fails to guide the agent away from clearly harmful actions. It must retain the ability to rule options out.
  **Status:** [NON-NEGOTIABLE]

  #### 9. Scope Definition
  **Specification:** The theory must specify the unit of evaluation (e.g., individual act, policy, rule, or character disposition) and justify why shifting to that unit resolves the cluelessness rather than evading it.
  **Case/Consideration:** Evaluating a single act may be impossible due to noise, while evaluating a policy may be tractable. However, if the theory evaluates policies but the agent must choose acts, a translation layer is needed. The theory must not change the subject without providing the mapping.
  **Status:** [PREFERENCE] (Act vs. Rule consequentialism split).

  #### 10. Reflexive Consistency
  **Specification:** The theory must remain well-formed when the agent's adoption of the theory is itself a causal factor in the outcome (e.g., teaching the theory to others).
  **Case/Consideration:** If the theory's success depends on agents *not* using it (esotericism), or if using it changes the value of the outcomes it predicts, the evaluation loop becomes ill-founded. The theory must handle self-reference without infinite recursion.
  **Status:** [NON-NEGOTIABLE]

  ---

  ### Analysis of Constraints

  #### The Single Most Exclusionary Requirement
  **Requirement 4 (Tail Sensitivity Bounding)** does the most work to exclude candidate theories.

  *   **Plain Expected-Value Maximizer:** Fails immediately. It has no mechanism to discount low-probability/high-magnitude events. It is vulnerable to domination by unestimable effects (Pascal's Mugging), violating the "neither credulous nor paralyzed" brief.
  *   **Indirect/Rule-Based Consequentialist:** Often fails here. Rules are typically designed for typical cases. They either ignore tail risks entirely (violating "only consequences count") or lack a principled way to break the rule for extreme tails without collapsing back into act-evaluation.
  *   **"Do As Well As One Can" (Evidence-Relative):** Fails on the "credulous" side. If the evidence suggests a tiny chance of infinite value, this view often compels the agent to pursue it, as they are maximizing relative to their evidence. It lacks the *structural* discounting required to prevent domination by the unestimable.

  Requirement 4 forces a mathematical modification to the utility function or the probability weighting that standard consequentialist frameworks do not possess.

  #### Joint Unsatisfiability
  **Requirement 5 (Convergence Protocol)** and **Requirement 7 (Bounded Executability)** are jointly unsatisfiable under the strict interpretation of the Purpose Statement ("only consequences count").

  *   **The Conflict:** Requirement 5 demands a verdict on the sum of consequences over an *unbounded* future. Requirement 7 demands the calculation complete in *bounded* time.
  *   **The Incompatibility:** You cannot compute the exact sum of an infinite series in finite time. To satisfy Requirement 7, the agent must truncate the series or use a heuristic approximation.
  *   **The Consequence:** Truncation violates the spirit of Requirement 5 (summing the *actual* future) and risks violating Requirement 4 (if the truncated tail contains a high-magnitude effect).
  *   **Conclusion:** The specification is buggy. You cannot have a theory that counts *all* consequences (unbounded) and is *runnable* by a bounded agent without introducing a "Stopping Rule" that effectively admits some consequences do not count (or count for zero). This contradicts the Purpose Statement's commitment that "only consequences count." To fix this, you must weaken Requirement 5 to allow for *approximated* convergence, or weaken the Purpose Statement to allow for *proxies* (like rules) that do not strictly count every consequence.

  **Recommendation:** Treat Requirement 5 as requiring a *justified approximation* of the infinite sum, rather than the sum itself. If you demand the actual sum, no bounded agent can ever use this theory.
