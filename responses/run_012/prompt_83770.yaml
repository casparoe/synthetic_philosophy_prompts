answer: |-
  You distinguish between reasons to admire and reasons to *want* to admire, locating the demon's leverage in the latter. But isn't 'wanting to admire' itself a pro-attitude towards the demon? If the demon can threaten you into having a reason for that desire, why isn't *that* attitude just as vulnerable to the wrong kind of reasons as admiration itself?

  *Follow-up:* She will likely reply that wanting to admire is a desire about a mental state, not an evaluation of the object. Press her on whether this merely relocates the problem: if the fittingness of that desire depends on the threat, haven't you simply pushed the WKR problem back one step rather than dissolving it?

  ***

  Suppose there were a 'sincerity pill' that induced genuine admiration without any instrumental calculation on your part. If the demon threatens you unless you take this pill, do you have a reason to admire him once the pill has taken effect, or merely a reason to swallow it?

  *Follow-up:* She will almost certainly say you only have a reason to swallow the pill. Ask her then: once swallowed, the resulting state is indistinguishable from sincere admiration. If the attitude itself is identical, why does the genealogy of the reason determine its fittingness within the FA account?

  ***

  Does this strategy survive translation to the doxastic realm? If a demon threatens to punish you unless you believe the earth is flat, do you have a reason to *want* to believe it, but no reason to *believe* it?

  *Follow-up:* She will likely argue that belief aims at truth whilst admiration aims at value. Press her on whether this disanalogy undermines the generality of the FA account: if pragmatic reasons cannot justify belief, why suppose they can justify the 'wanting' attitude in your account without contaminating the value judgement?

  ***

  If this distinction between attitudes and wants to have attitudes is so robust, why was the WKR problem ever considered a serious threat to the FA account in the first place?

  *Follow-up:* She will probably suggest philosophers were confused about the nature of reasons. Ask her whether this implies your solution is effectively a revision of the FA account's original commitments, rather than a defence of them.
