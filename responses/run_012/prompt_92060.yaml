answer: |-
  ### The Moral Trade Vetting Procedure

  **Purpose:** To determine whether the foundation should list a proposed moral trade on its matching service.
  **Users:** The Ethics Advisory Committee (five members).
  **Timeframe:** To be completed within ten days of receipt.
  **Outcome:** A binary decision (List / Do Not List) or a Conditional Listing, documented in the public log.

  **Definitions for Committee Use:**
  *   **Moral Constraint:** A rule a party feels bound to follow, such that breaking it causes them moral distress or guilt, regardless of personal cost.
  *   **Procurement:** Arranging for, paying for, or enabling another person to perform an act that you yourself believe is wrong.
  *   **Externality:** A harm or benefit affecting a person or group who is not a party to the trade and did not consent to it.
  *   **Absolute Prohibition:** A belief that an act is forbidden under any circumstances, even if doing it would prevent a greater wrong.

  ---

  #### The Sequence

  **Question 1: Voluntariness and Capacity**
  *   **Ask:** Is there clear evidence that both parties are entering this agreement freely, without coercion, and possess the legal and mental capacity to understand the terms?
  *   **Sufficient Answer:** Signed statements from both parties confirming they understand the trade and are not under duress.
  *   **Stop Condition:** If **No**, decline the trade. (Reason: Violation of basic autonomy).

  **Question 2: Subjective Valuation**
  *   **Ask:** Does each party explicitly state that, by their own valuation, the benefit they receive outweighs the moral cost of the action they must perform?
  *   **Sufficient Answer:** A written statement from each party: "I accept [Action X] because I value [Outcome Y] more, by my own measure."
  *   **Stop Condition:** If **No** (i.e., one party feels they are losing net value or acting purely out of desperation), decline the trade. (Reason: This is exploitation, not a trade).

  **Question 3: Externalities**
  *   **Ask:** Does the trade impose a cost, risk, or harm on any third party who is not consenting to the arrangement?
  *   **Sufficient Answer:** A description of all affected parties. If non-parties are affected, evidence of their consent or evidence that the impact is negligible.
  *   **Stop Condition:** If **Yes** (significant unconsented harm exists), decline the trade. (Reason: We do not facilitate trades that use outsiders as material).
  *   **Note:** Distinguish between *distaste* (others dislike the trade) and *harm* (others are damaged by it).

  **Question 4: The Nature of the Constraint (Absolutism)**
  *   **Ask:** Does either party hold their moral constraint as an **Absolute Prohibition**?
  *   **Sufficient Answer:** A statement from the party: "I believe this act is wrong, but permissible if it secures [Outcome Y]" (Weighted) OR "I believe this act is never permissible, regardless of the outcome" (Absolute).
  *   **Stop Condition:** If **Absolute**, decline the trade. (Reason: A trade is logically impossible if a party believes the act is forbidden regardless of the gain; listing it aids them in violating their own core logic).
  *   **Human Handoff:** If the answer is ambiguous or relies on complex theological/philosophical reasoning, hand to the Committee Chair for a value judgment on sincerity and coherence.

  **Question 5: Agency (Doing vs. Procuring)**
  *   **Ask:** Is the trade structured such that a party is **Procuring** an act they consider wrong, rather than performing it themselves?
  *   **Sufficient Answer:** A clear map of who performs the physical action.
  *   **Stop Condition:** If **Procurement** is the primary mechanism *and* the act causes direct harm to a sentient being, decline the trade. (Reason: Facilitating harm through a proxy often increases moral complicity without reducing the harm).
  *   **Human Handoff:** If the harm is abstract (e.g., financial diversion) rather than physical, hand to the Committee for a value judgment on complicity.

  **Question 6: Public Signal and Foundation Complicity**
  *   **Ask:** If this trade is listed in our public log, will it reasonably be interpreted as the foundation endorsing the *wrongful act* rather than the *process of agreement*?
  *   **Sufficient Answer:** A draft of the public log entry.
  *   **Stop Condition:** If **Yes** (the act is so heinous that listing it tarnishes the foundation's ability to function), decline the trade.
  *   **Human Handoff:** This is always a value judgment. The Committee must vote on whether the reputational risk is acceptable.

  **Final Step: The Human Decision**
  *   **Instruction:** If the procedure has not triggered a "Stop Condition," the Committee must still vote. The procedure filters for structural integrity; the vote assesses moral weight.
  *   **Requirement:** A majority vote is required to list. Dissenting opinions must be recorded in the log.

  ---

  #### What This Procedure Cannot Do
  This checklist cannot measure the truth of a moral claim. It cannot tell you if eating meat is actually wrong, only if the trader believes it is wrong and whether that belief allows for trading. It cannot prevent future regret by the traders. It cannot protect the foundation from critics who oppose the very concept of moral trade. It treats moral beliefs as preferences for the sake of the mechanism, which is a functional fiction necessary for the trade to exist, but which must not be confused for moral endorsement by the Committee.

  ---

  ### Application to Proposals

  Here is the procedure applied to your three cases. I have indicated where the procedure aligns with your intuition and where it creates friction.

  #### Case 1: The Donor Swap
  *Two donors swap $5,000 donations. Donor A prefers Global Health (GH) over Animal Welfare (AW). Donor B prefers AW over GH. Each gives to the other's preference.*

  *   **Q1 (Voluntariness):** Yes. Both willing.
  *   **Q2 (Valuation):** Yes. Each gets their top priority funded (via the other's money) rather than their second priority.
  *   **Q3 (Externalities):** No. The charities receive funds they would not have otherwise. No third party is harmed.
  *   **Q4 (Absolutism):** No. Neither donor believes giving to the "lesser" charity is absolutely forbidden; they merely rank it lower.
  *   **Q5 (Agency):** Doing. They are writing the checks themselves.
  *   **Q6 (Public Signal):** Low risk. Looks like standard philanthropy.
  *   **Committee Vote:** **Yes.**
  *   **Alignment:** This matches your intuition. It is a clean trade of resources where the "wrong" is merely opportunity cost, not active harm.

  #### Case 2: The Lab Swap
  *Doctoral student (believes animal work is wrong) swaps teaching/data duty for Postdoc's animal work. Postdoc agrees. Supervisor approves.*

  *   **Q1 (Voluntariness):** Yes.
  *   **Q2 (Valuation):** Yes. Student avoids moral distress; Postdoc avoids tedious data work.
  *   **Q3 (Externalities):** **Stop and Examine.** The animals are third parties. Does the total amount of animal work change?
      *   *Scenario A:* The Postdoc would have done the animal work anyway. The trade merely shifts who does it. Net harm to animals is zero.
      *   *Scenario B:* The animal work would not have been done without this swap. Net harm increases.
      *   *Assumption:* Prompt implies a swap of existing duties. Net harm is likely constant.
  *   **Q4 (Absolutism):** **Human Handoff Required.** The student believes animal experimentation is "wrong." Is it *absolutely* wrong (forbidden even if it advances science) or *weighted* (bad, but acceptable if necessary)?
      *   *Committee Judgment:* If the student believes it is absolutely wrong, they cannot trade. If they believe it is regrettable but necessary, they can. Most animal rights views lean toward Absolute.
  *   **Q5 (Agency):** **Procurement.** The student is not doing the animal work; they are arranging for the Postdoc to do it *instead of them*.
      *   *Procedure Stop:* The procedure flags **Procurement of Harm**. Even if total harm is constant, the student is actively ensuring the harm happens by enabling the Postdoc to focus on it.
  *   **Q6 (Public Signal):** Moderate risk. Looks like the foundation is facilitating the outsourcing of conscience.
  *   **Committee Vote:** **No (or Highly Conditional).**
  *   **Alignment:** **This is the answer you will not like.** You guessed this is "plainly acceptable." The procedure suggests it is morally hazardous. By swapping, the student keeps their hands clean but ensures the dirty work gets done by a proxy. The procedure treats "facilitating harm" as distinct from "suffering harm." Unless the Committee decides the student's constraint is merely about *their own* hands (personal purity) rather than the *act itself* (animal suffering), this fails Q5.

  #### Case 3: The Vegan Steak
  *Vegan eats steak publicly for $5k/yr sanctuary gift. Acquaintance pays for the spectacle.*

  *   **Q1 (Voluntariness):** Yes.
  *   **Q2 (Valuation):** Yes. Vegan values sanctuary over diet; Acquaintance values spectacle over money.
  *   **Q3 (Externalities):** **Yes.** The public audience.
      *   *Analysis:* A vegan eating meat publicly sends a signal that "veganism is negotiable." This may weaken the social norm against meat-eating, affecting third parties (animals, other vegans).
  *   **Q4 (Absolutism):** **Human Handoff.** Most committed vegans hold eating meat as an Absolute Prohibition. If so, trade is impossible (Stop at Q4).
  *   **Q5 (Agency):** Doing. The vegan performs the act.
  *   **Q6 (Public Signal):** **High Risk.** Listing this implies the foundation endorses the commodification of moral integrity for public spectacle.
  *   **Committee Vote:** **No.**
  *   **Alignment:** This matches your intuition ("plainly not"). The procedure rejects it on grounds of Public Signal and likely Absolutism.

  ---

  ### Confidence and Limitations

  **Confidence Level:**
  I am highly confident in the logical structure of the procedure (the distinctions between doing/procuring and internal/external costs). I am moderately confident in its application to Cases 1 and 3. I am less confident in its application to Case 2, as that depends entirely on the specific metaphysical view the student holds regarding animal suffering, which is a fact the checklist cannot verify, only probe.

  **The Point of Least Certainty:**
  I am least sure about **Question 4 (Absolutism)**.
  Distinguishing between a "Weighted Constraint" (I shouldn't do this, but I will for a big enough gain) and an "Absolute Prohibition" (I cannot do this, period) requires introspection that people are often bad at. A trader may claim their constraint is weighted to get the deal approved, only to feel profound guilt later, or they may claim it is absolute to signal virtue, while secretly harboring a price. The Committee has no way to verify this other than conversation. If we get this wrong, we either block a valid trade (paternalism) or facilitate a self-betrayal (harm to the trader). This is the point where the checklist must surrender to the human judgment of the Committee, and where your experience as a Chair will matter more than the paper procedure.
