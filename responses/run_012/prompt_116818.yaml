answer: |-
  **UNIVERSITY EXAMINATION PAPER**

  **Module:** Philosophical Theology and Modal Metaphysics
  **Level:** Graduate Seminar (MA/PhD)
  **Time Allowed:** 60 Minutes
  **Total Marks:** 30

  **INSTRUCTIONS TO CANDIDATES**
  Answer the single question below. You may bring the printed axiom sheet into the room; nothing else is permitted. The question paper reproduces the entire formal system in its stem.

  ***

  **STEM**

  The language is second-order modal logic over a constant non-empty domain, the underlying modal system is S5, and the higher-order quantifiers range over properties in the broadest sense, with no restriction to natural, intrinsic, or otherwise privileged properties.

  Primitive: P(φ), read as φ is positive.
  A1. P(φ) ∧ □∀x(φ(x) → ψ(x)) → P(ψ).
  A2. P(¬φ) ↔ ¬P(φ).
  A3. P(G), where G(x) ↔ ∀φ(P(φ) → φ(x)).
  A4. P(φ) → □P(φ).
  D1. φ ess x ↔ [φ(x) ∧ ∀ψ(ψ(x) → □∀y(φ(y) → ψ(y)))].
  D2. NE(x) ↔ ∀φ(φ ess x → □∃y φ(y)).
  A5. P(NE).
  T1. P(φ) → ◇∃x φ(x).
  T2. □∃x G(x).
  Lemma L. If x is Godlike, then G is an essence of x. (Proof sketch to print: any property a Godlike being has must be positive, since otherwise its negation would be positive by A2 and would also be had by that being; so by A4 the entailment required by D1 is necessary.)

  O1. Suppose x is Godlike.
  O2. By L, G is an essence of x.
  O3. Let p be any true proposition, and let ψp be the property λy.p — the property that everything has if p is true and nothing has if p is false.
  O4. Since p is true, ψp(x).
  O5. By O2, O4 and D1, □∀y(G(y) → ψp(y)).
  O6. By T2, □∃y G(y); hence □∃y ψp(y), that is, □p.
  O7. Since p was arbitrary, p → □p for every proposition p.

  ***

  **QUESTION**

  (a) Locate the burden of proof within the system: show which of the results above are already available from A1–A3 and which require A4, D1, D2 and A5, and explain why the theist is not obliged to supply a separate possibility premise. [6 marks]

  (b) Assess the derivation O1–O7 step by step, saying whether it is valid as it stands and, if it is, exactly which licence it exploits. [8 marks]

  (c) Evaluate at least two repairs, one of which must be the restriction of the higher-order quantifiers so that properties such as ψp fall outside their range, and say what each repair costs elsewhere in the proof — which result it endangers and why. [10 marks]

  (d) Say whether the collapse shows that the axioms are inconsistent, and what a theist who accepts the axioms owes us about contingency. [6 marks]

  ***

  **MODEL ANSWER**

  The system provided divides cleanly between the conceptual setup and the modal execution. A1 through A3 establish the logic of positivity and the definition of a Godlike being. A1 ensures positivity is closed under necessary entailment, while A2 ensures it is consistent; no property and its negation are both positive. A3 defines G as possessing all positive properties. From these alone, we cannot derive existence. T1 requires A4. Without A4, we cannot move from the positivity of φ to the possibility of its exemplification. A4 asserts that positivity is necessary if it holds at all. This is required for T1 because if P(φ) were contingent, a world might exist where φ is not positive, blocking the inference to ◇∃x φ(x). Similarly, T2 requires A5 and D2. A5 asserts Necessary Existence is positive. D2 defines NE. Only with A5 do we know a Godlike being has NE, and only with D1 and Lemma L do we know G is an essence, triggering the necessity of existence in T2. Consequently, the theist needs no separate possibility premise like ◇∃x G(x). T1 derives possibility directly from the nature of positivity secured by A4. The burden lies entirely on defending A4 and A5, not on asserting possibility independently.

  The derivation O1–O7 is valid as it stands within the stated system. The orientation specifies higher-order quantifiers range over properties in the broadest sense with no restriction. O3 introduces ψp, defined as λy.p. This is a legitimate property in unrestricted second-order logic. O4 follows because if p is true, everything has ψp. O5 is the critical step. It applies D1. Since G is an essence of x (O2), and x has ψp (O4), D1 entails that necessarily, anything with G has ψp. This step exploits the licence that ψp counts as a ψ in the quantifier ∀ψ within D1. O6 combines T2 (□∃y G(y)) with O5. If necessarily there is a G, and necessarily all Gs are ψp, then necessarily there is a ψp. Since having ψp just is p being true, this yields □p. O7 generalises this. Because the system is S5, if p → □p, then all truths are necessary. The derivation is formally sound given the stem; the collapse is a direct consequence of unrestricted comprehension combined with the essence definition.

  Two repairs are available, but both carry significant costs. The first is restricting the higher-order quantifiers to exclude properties like ψp. We might argue that only natural or intrinsic properties fall within the range of ∀φ in A1–A3 and ∀ψ in D1. If ψp is excluded, O5 fails because D1 does not quantify over it. However, this endangers A1. A1 requires closure under necessary entailment. If G entails ψp necessarily, but ψp is excluded from the domain of properties, A1 cannot affirm P(ψp) even if P(G). This creates a gap where a Godlike being entails properties that are not subject to the positivity logic, undermining the coherence of G defined in A3. The second repair is rejecting A4. If positivity is not necessary, T1 fails. We would then need to assert ◇∃x G(x) as a brute premise. This costs the proof its a priori status. It becomes a cosmological-style argument relying on a possibility premise rather than a purely ontological derivation from the concept of positivity. Between the two, restriction is preferable. Losing the pure ontological status is a greater theological cost than refining the property domain, provided the restriction does not arbitrary exclude properties essential to divinity.

  The collapse does not show the axioms are inconsistent. Inconsistency would require deriving a contradiction, such as p ∧ ¬p. The derivation yields p → □p, which is consistent within S5, though it implies modal fatalism. All truths become necessary truths. However, this is materially unacceptable for most theists who require contingency for creation and free will. A theist accepting these axioms owes us an account of contingency compatible with this collapse. They might argue that contingency is epistemic rather than metaphysical; propositions appear contingent to us but are necessary in reality. Alternatively, they must reject the orientation's claim that quantifiers range over the broadest sense of properties. If the system is consistent but implies fatalism, the theist must either embrace necessitarianism or modify the logic of essence to block O5 without restricting the property domain arbitrarily. The axioms hold together, but they purchase necessary existence at the price of necessary truth for all propositions.

  ***

  **MARKING SCHEME**

  **Must-Hit Points**

  1.  **A4 and T1 Link (2 marks):** Candidate must explain that T1 (possibility) depends on A4 (necessary positivity). Without A4, positivity could fail in some worlds, blocking possibility.
      *   *Typical Error:* Claiming T1 follows from A1–A3 alone or confusing T1 with T2.
  2.  **A5 and T2 Link (2 marks):** Candidate must identify A5 (NE is positive) and D2 as necessary for T2 (necessary existence).
      *   *Typical Error:* Failing to mention D2 or assuming G implies existence without A5.
  3.  **Validity of Objection (2 marks):** Candidate must confirm O1–O7 is valid given the stem's orientation (unrestricted HOL).
      *   *Typical Error:* Claiming the derivation is invalid due to a logical error in the steps rather than the premises.
  4.  **Identification of Licence (2 marks):** Candidate must identify that O5 exploits the inclusion of ψp (λy.p) in the quantifier range of D1.
      *   *Typical Error:* Vaguely blaming "modal logic" without identifying the property comprehension issue.
  5.  **Repair 1 Cost (2 marks):** Candidate must explain that restricting quantifiers threatens A1 (closure under entailment) if G entails excluded properties.
      *   *Typical Error:* Asserting restriction has no cost to the axioms.
  6.  **Repair 2 Cost (2 marks):** Candidate must explain that dropping A4 loses T1, requiring a separate possibility premise.
      *   *Typical Error:* Claiming dropping A4 solves the collapse without affecting the possibility proof.
  7.  **Consistency vs. Fatalism (2 marks):** Candidate must distinguish inconsistency (contradiction) from collapse (fatalism) and note the obligation to explain contingency.
      *   *Typical Error:* Claiming the system is inconsistent because collapse is counterintuitive.

  **Total:** 14 marks available across points (scaled to 30 in allocation above, but here listed as criteria). *Note for markers: The marks in the question paper (6, 8, 10, 6) take precedence. Use these points to distribute marks within those sections.*

  **Distinction Note**
  A first-class answer will explicitly connect the cost of Repair 1 to the definition of G in A3, noting that if ψp is excluded from positivity logic but entailed by G, the definition of Godlikeness becomes unstable. A solid second-class answer will identify the costs generally (e.g., "it breaks A1") but will not trace the specific tension between entailment closure and property restriction. First-class candidates will also clearly distinguish between logical consistency and metaphysical acceptability in part (d).
