  1.
  Sarah stamped the compliance forms with the automatic date printer before signing them. It was a heavy brass thing that clicked satisfyingly into the paper, leaving a raised impression of the day's date. She didn't look at the dials before she pressed down. She didn't have to. The printer lived on the corner of her desk, next to the stapler, and it told the truth. She filed the morning's batch into the cabinet marked *October*, stacking them neatly behind the divider. At lunch, she heated her soup for three minutes because the microwave said three minutes, and she ate it at her desk while scanning a spreadsheet for outliers. The numbers moved, but the date on the forms was the ground they stood on.

  2.
  A vendor called to dispute a late fee. Sarah pulled the file. The form showed the 31st. The vendor insisted they'd delivered on the 30th. Sarah looked at the raised ink. The 31st was physically there, embossed into the fiber. She told the vendor the record stood. After hanging up, she glanced at the printer. The dial for the day was set to 31. She checked her phone. It was the 1st of the next month. She hadn't turned the dial over midnight. She turned it now, clicking it forward. It felt loose, like a toy. She printed a test sheet on scrap paper. The ink was faint. She pressed harder next time.

  3.
  Two weeks later, Sarah missed a filing deadline. She had sworn she submitted on the 15th. The received stamp said the 16th. She checked her copy. The printer had stuck on the 15th for two days; she hadn't noticed because she hadn't looked. She stood in the kitchen that evening, waiting for the kettle to boil, watching the digital clock on the oven blink 12:00. She tapped her watch. It said 6:15. She poured the water when the whistle blew, not when the clock said she should. At work the next morning, she kept a small desk calendar open next to the brass printer. Every morning, she moved the red marker on the calendar before she touched the printer.

  4.
  The printer jammed. The arm stuck halfway down, leaving a ghostly impression on a batch of insurance claims. Sarah didn't call maintenance. She pulled a black felt-tip pen from her drawer. She wrote the date manually on each form, her handwriting small and tight in the corner. Her hand cramped slightly by the tenth form. She shook it out and kept writing. The pen ink sat on top of the paper, shiny and vulnerable, unlike the brass impression that changed the paper's shape. When her supervisor walked by, he didn't ask about the brass machine. He just initialed next to her handwritten dates.

  5.
  Sarah packed up for the day. She slid the brass printer into the top drawer of her desk and closed it. She took the felt-tip pen and put it in her coat pocket. At the door, she paused and looked back at the desk. The printer sat in the dark drawer, a heavy object made of metal and plastic. She touched the pocket where the pen was, felt the plastic cap against her ribs, and turned off the light. The date tomorrow would be whatever she wrote.
