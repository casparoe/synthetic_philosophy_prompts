answer: |-
  # Joint Statement on the Ontology of Internal Representations in Deep Neural Networks
  **An Adversarial Collaboration Framework**

  **Authors:** [Name of Representational Realist] & [Name of Pragmatic Deflationist]
  **Facilitated by:** [Your Name]
  **Date:** October 26, 2023

  ## Preamble
  We acknowledge that the current debate regarding the interpretability of deep neural networks parallels historical debates in systems neuroscience regarding single-unit activity. Specifically, we recognize the tension between viewing internal states as *mechanisms* (causal entities the system uses to compute) versus *descriptions* (coordinate systems imposed by observers to predict behavior). This document outlines our points of agreement, precisely locates our disagreements, and identifies empirical cruxes that would update our respective credences.

  ---

  ## Part I: Agreed Propositions
  *The following claims are accepted by both parties as the baseline for this collaboration.*

  1.  **The Substrate:** We agree that, ontologically, a trained neural network consists solely of weights (parameters) and activations (state vectors). There is no "ghost in the machine" beyond the mathematics of forward propagation.
  2.  **Methodological Utility:** We agree that techniques such as Sparse Autoencoders (SAEs), linear probing, and activation steering are scientifically valuable. Whether the features they discover are "real" or "fictions," they increase our ability to predict, diagnose, and control model behavior.
  3.  **Evidence Standards:** We agree that valid evidence must be reproducible and quantitative. Anecdotal visualization of neurons or features is insufficient without statistical validation against baselines.
  4.  **The Neuroscience Analogy:** We acknowledge that the dispute mirrors the historical debate in visual cortex research (e.g., whether a "grandmother cell" *represents* a concept or is merely a correlated readout of a distributed process). We agree that settling this in ML may inform neuroscience, and vice versa.
  5.  **Verbal Component:** We acknowledge that a portion of our disagreement stems from differing definitions of the word "representation." We commit to distinguishing between *ontological claims* (what exists in the network) and *pragmatic claims* (what descriptions are useful to humans).

  ---

  ## Part II: Precise Disagreements
  *We disagree on the interpretation of the agreed-upon facts. Neither side accepts the other's phrasing below as the whole truth, but agrees it accurately captures the opposing view.*

  | Domain | The Representational Realist Position | The Pragmatic Deflationist Position |
  | :--- | :--- | :--- |
  | **Ontology of Features** | When an SAE or probe identifies a direction in activation space that corresponds to a semantic concept (e.g., "dog," "deception"), this direction corresponds to a **functional unit of computation**. The network uses this variable to store and process information. | Features are **coordinate systems** imposed on the activation space. They are "real" only in the sense that a latitude/longitude grid is real: useful for navigation, but not physically carved into the terrain. |
  | **Causal Status** | A genuine representation must play a **causal role**. If intervening on a feature (via steering or ablation) does not systematically alter behavior in a semantically consistent way, the feature is an epiphenomenon, not a representation. | Causal leverage is not required for representation. A variable can **carry information** (be decodable) without being a bottleneck for causality. The network may be robust/redundant, rendering single-feature interventions ineffective without negating the presence of the information. |
  | **Uniqueness** | There exists a **"true" basis** (or a constrained set of bases) that reflects the actual computational graph of the network. While rotations are mathematically possible, only one aligns with the causal mechanism. | The activation space admits **many equally valid bases**. If multiple feature sets reconstruct the activations and predict behavior equally well, there is no fact of the matter as to which one is "true." Choice is pragmatic. |

  ---

  ## Part III: Empirical Cruxes
  *We identify the following specific experiments as decisive. We record our pre-registered predictions below.*

  ### Crux 1: Causal Role vs. Decodability
  **The Question:** Does a feature need to be causally efficacious to count as a representation, or is decodability sufficient?
  **The Experiment:** **Redundant Encoding Dissociation.**
  Train a model on a task where specific semantic information is known to be encoded redundantly across multiple layers (e.g., via dropout or specific architectural constraints). Identify a feature $F$ in Layer $L$ that probes highly for concept $C$.
  1.  Measure decodability of $C$ from $F$.
  2.  Ablate/Zero-out $F$.
  3.  Measure change in task performance regarding $C$.
  4.  **Crucial Condition:** Ensure no other neurons in Layer $L$ compensate immediately (e.g., via acute vs. chronic ablation).

  | Side | Prediction | Interpretation of Result |
  | :--- | :--- | :--- |
  | **Realist** | If $F$ is a true representation, ablating it must degrade performance or alter behavior regarding $C$, **even if only slightly**. If ablation has *zero* effect, $F$ was merely a correlate, not a representation. | **Null Effect:** The feature was an epiphenomenon (a "readout" only). <br>**Causal Effect:** The feature is part of the mechanism. |
  | **Deflationist** | $F$ can be highly decodable yet have **zero causal leverage** due to distributed robustness. The information is present in the state, even if the network doesn't rely on that specific vector to compute the output. | **Null Effect:** Confirms representations are distributed/robust, not that they are unreal. <br>**Causal Effect:** Merely shows $F$ was a convenient handle, not that it's ontologically unique. |

  ### Crux 2: Non-Identifiability (Superposition)
  **The Question:** Does the existence of multiple, mathematically equivalent feature bases (rotational freedom) undermine the claim that any single basis is "real"?
  **The Experiment:** **Basis Rotation Invariance Test.**
  Take a trained model and a high-performing SAE that has identified interpretable features. Construct a second basis by applying a random orthogonal rotation to the SAE latent space that preserves reconstruction loss perfectly.
  1.  Present both bases to human evaluators for interpretability scores.
  2.  Test both bases for ability to predict generalization errors.
  3.  Test both bases for ability to steer behavior.

  | Side | Prediction | Interpretation of Result |
  | :--- | :--- | :--- |
  | **Realist** | The **original SAE basis** will significantly outperform the rotated basis in steering and causal prediction, despite equal reconstruction loss. This proves the original basis aligns with the causal structure; the rotated one does not. | **Original Wins:** There is a "true" computational basis. <br>**Tie:** Realism is threatened; the network has no preferred basis. |
  | **Deflationist** | Both bases will be **equally effective** at reconstruction. Any difference in "interpretability" is a fact about human psychology, not the network. If steering works on one but not the other, it proves steering is a human tool, not a network property. | **Original Wins:** Only proves humans prefer sparse features. <br>**Tie:** Confirms features are descriptive tools, not network properties. |

  ---

  ## Part IV: Note on Verbal Disputes
  *We identify the following area as primarily semantic, though it has ontological implications.*

  **The Dispute:** The definition of "Representation."
  **Analysis:**
  *   The **Realist** uses "representation" to mean *"a variable that is both readable and causally used by the system to compute."*
  *   The **Deflationist** uses "representation" to mean *"a variable that allows an external observer to compress and predict the system's state."*

  **Resolution Path:**
  We agree to use the term **"Causal Feature"** when referring to the Realist's criterion (decodable + intervenable) and **"Descriptive Feature"** when referring to the Deflationist's criterion (decodable). We acknowledge that much of our past friction arose from using the single word "representation" to cover both concepts.

  **Signatures:**

  _________________________ (Representational Realist)

  _________________________ (Pragmatic Deflationist)
