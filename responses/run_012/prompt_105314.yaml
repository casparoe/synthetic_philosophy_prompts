      *(Final Decision on Verdict):* The argument commits the **Transcendental Fallacy** (confusing conditions of knowledge with conditions of being) at (6), compounded by a **Modal Overreach** at (7). To save the anti-skeptical force without the parochialism, one must adopt Kant's **Transcendental Idealism**: The framework is objectively valid *for all possible experience*, but not a description of reality *independent of experience*. This kills (8) (aliens/things-in-themselves) but saves (5) (we can't doubt it within experience).

