      *   *Check:* Does anti-skepticism survive? Yes, if we accept Transcendental Idealism (objects are real *for us*).

      *Crucial Distinction:* I need to make sure I don't just say "Kant says X." I need to explain *why* the argument fails logically. The move from "We must think X" to "X is true" is valid *only if* we assume the mind constitutes reality (Strong Idealism). If we are Realists, it's a non-sequitur. Kant is a "Formal Idealist."
      *   Actually, the strongest critique comes from Barry Stroud. He argues that transcendental arguments can at best show what we *believe*, not what is *true*, unless we accept a verificationist principle.
      *   So, Step (6) is the "Verificationist Principle."
      *   Step (2) is the "Contingent Anthropocentrism."

      *Plan:*
      1.  Reconstruct the skeleton (Conditions of Possibility $\rightarrow$ Necessity $\rightarrow$ Truth $\rightarrow$ Universality).
      2.  Identify the "Two-Step Collapse": First, the slide from epistemic to ontological (6). Second, the slide from human to generic thinker (3/7).
      3.  Analyze the cost of cutting at (6): We get "inescapable belief" but lose "metaphysical guarantee." Anti-skepticism becomes "internal."
