      *   **The "No, Wait..." (The Realist Pushback):** This is crucial. The user asked what's contested. Realists argue it's *not* verbal. They claim there is a "joint in nature." The quantifier is univocal. The roommate isn't just speaking a different dialect; they are making a truth claim about the world that contradicts the user's.
      *   **The "So What?" (Pragmatic Stakes):** Even if it is verbal, does it matter? Yes. Conceptual engineering. Does talking about tables hinder physics? Does it help daily life? The choice of language has consequences.
