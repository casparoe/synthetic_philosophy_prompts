prompt: |-
  Okay so I'm taking this class on philosophy of language and we just did a unit on verbal disputes, and I think I've either understood something big or gone completely off the rails, and my roommate is no help because he just keeps saying "arranged table-wise" like it's a magic spell. Heres the thing that's bugging me. My roommate thinks tables dont exist — there are only particles arranged in a table-ish way, and "table" is just a useful fiction we project onto the swarm. I think tables obviously exist, I'm eating off one right now. Then I read some Carnap for class and some stuff about how a lot of these ontological disputes are just verbal, and now I'm wondering: if the dispute is verbal, doesn't that mean we're not actually disagreeing about anything? Like when two people argue about whether a tomato is a fruit and it turns out one means "botanical fruit" and the other means "thing you put in a salad" — once you see that, there's no disagreement left, they were just using the word differently. So doesn't it follow that my roommate and I agree about all the actual facts (there are particles, they're arranged thus, sandwiches get made on them) and we're only fighting about which words to use? And if the only thing left is word choice, and words are just conventions or tools, then isn't the whole question settled by just picking whichever vocabulary is most convenient — so the answer to "do tables exist" is "yes, in table-talk, knock yourself out"? That seems way too easy, and it also feels like it makes the original question evaporate, which I'm pretty sure isn't what the people who write about this actually think. Am I missing a step, or is "it's a verbal dispute" supposed to be this boring deflationary ending where everybody goes home happy?

  Also, can you please be straight with me about what's actually settled here vs. what people who work on this still argue about — I'd rather get "here's the part everyone agrees on and here's where it gets contested" than a tidy answer that pretends there's a consensus when there isn't. I don't need citations or a reading list, just the reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

