answer: |-
  **MEMORIAL REVIEW COMMISSION: STANDARD OPERATING PROCEDURE**

  **Purpose:** To determine whether a public memorial aligns with the City's current values and historical understanding, distinct from the City Council's political authority.
  **Constraints:** One week research (one member), one hour deliberation, two-page finding.
  **Language:** Plain English suitable for public testimony.

  ### PART I: THE FIVE-STEP PROCEDURE

  Ask these questions in order. If you stop at a "No," the recommendation is **Remove**. If you reach Step 5, the recommendation is **Keep with Context** or **Refer to Council**.

  **Step 1: The Intent Check**
  *   **Question:** Why was this memorial put up, and what specific achievement does it claim to honor?
  *   **Sufficient Answer:** A dedication plaque, city council minutes from the installation date, or contemporary news reports stating the reason (e.g., "For winning the war," "For founding the city," "For public service").
  *   **Thin Evidence:** Oral tradition, assumptions based on the figure's general fame, or modern reinterpretations of why they *should* have been honored.
  *   **Stop Rule:** If the memorial was erected explicitly to intimidate a specific group (e.g., Confederate statues erected during Civil Rights era desegregation), recommend **Remove**.

  **Step 2: The Harm Check**
  *   **Question:** Did the figure personally order, advocate for, or profit from actions that caused death, enslavement, or systematic deprivation of rights to civilians?
  *   **Sufficient Answer:** Primary source documents (orders, letters, speeches) or consensus among three or more reputable academic biographies.
  *   **Thin Evidence:** Guilt by association, actions of subordinates without the figure's knowledge, or unverified internet claims.
  *   **Stop Rule:** If the harm is minor or disputed by credible historians, move to Step 3. If the harm is massive and documented, move to Step 3. (This step establishes facts, not verdicts).

  **Step 3: The "Man of His Time" Test**
  *   **Question:** Were there credible voices *during the figure's lifetime* who objected to this specific harm?
  *   **Sufficient Answer:** Published editorials, speeches, or letters from contemporaries condemning the action.
  *   **Thin Evidence:** Silence. (Note: Lack of objection does not prove acceptance; it often proves suppression. Treat silence as neutral, not exculpatory).
  *   **Stop Rule:** If contemporaries objected and the figure ignored them to continue the harm, this weighs toward **Remove**. If no one objected (and evidence suggests dissent was impossible), this weighs toward **Keep**.

  **Step 4: The Link Check**
  *   **Question:** Is the honor inextricably linked to the harm? (The "Because Of" Test)
  *   **Sufficient Answer:** Determine if the achievement in Step 1 *required* the harm in Step 2.
  *   **Thin Evidence:** Speculation that they "couldn't have succeeded otherwise" without proof.
  *   **Stop Rule:**
      *   **Bright Line:** If the figure is honored *for* the harm (e.g., a general honored for a massacre), recommend **Remove**.
      *   **Bright Line:** If the figure is honored for something unrelated to the harm (e.g., a scientist honored for a vaccine who was also a bigot), recommend **Keep with Context**.
      *   **Gray Zone:** If the achievement and harm are tangled (e.g., "Discovery" that required colonization), proceed to Step 5.

  **Step 5: The Community Values Check**
  *   **Question:** Does keeping this memorial prevent the City from functioning or cause active distress to a significant portion of the citizenry?
  *   **Sufficient Answer:** Testimony from public hearings, petitions, or evidence that the memorial is used as a rallying point for hate groups.
  *   **Thin Evidence:** Anonymous complaints, social media outrage from outside the city, or the personal discomfort of Commission members.
  *   **Stop Rule:** If the memorial causes active civic disruption, recommend **Remove/Relocate to Museum**. If the disagreement is purely philosophical with no civic disruption, recommend **Keep with Context** and refer the final decision to the **City Council**.

  ---

  ### PART II: HANDLING COMMON ARGUMENTS

  **1. "He was a man of his time."**
  *   **Procedure:** Refer to Step 3. If contemporaries objected, he was not bound by his time; he made a choice. If no one objected due to lack of free speech/press, acknowledge the limitation but do not let it excuse the harm.
  *   **Script:** "We do not judge history by modern morals alone. We judge whether the figure ignored the morals available to them at the time."

  **2. "He also did things we admire."**
  *   **Procedure:** Refer to Step 4. We are not judging the *person*; we are judging the *memorial*. A person can be complex; a statue is a specific honor.
  *   **Script:** "A person can be both heroic and harmful. A statue, however, makes a specific claim. We must decide if that specific claim is truthful and appropriate."

  **3. The Archive Problem (Silence vs. Objection)**
  *   **Procedure:** Treat silence as "Data Missing," not "Data Clean." If the archive is silent because a group was enslaved or illiterate, note that in the finding.
  *   **Script:** "The absence of protest in the record does not prove the absence of suffering. We weigh documented objection heavily, but we do not punish the oppressed for leaving no written record."

  **4. Honored for the Offense vs. Honored Despite It**
  *   **Procedure:** This is the core of Step 4.
  *   **Scenario A:** Statue of a General who burned a city, inscription says "For Burning the City." -> **Remove.**
  *   **Scenario B:** Statue of a Mayor who built a hospital, record shows he segregated the wards. -> **Keep with Context.**
  *   **Scenario C:** Statue of an Explorer, inscription says "For Discovering New Lands," record shows "Discovery" involved genocide. -> **Gray Zone (Step 5).**

  **5. Bright-Line Rules vs. Case-by-Case**
  *   **Procedure:** We use bright lines only for **Treason** (armed insurrection against the US) and **Direct Advocacy of Violence** (explicit calls to kill civilians). Everything else is case-by-case.
  *   **Reasoning:** A rule for everything prevents thought; a rule for nothing invites bias. We draw the line at violence against the state and violence against citizens.

  ---

  ### PART III: TEST RUNS

  **Case 1: Thomas Jefferson**
  *   **Step 1 (Intent):** Honored for authoring the Declaration of Independence and serving as President. (Documented).
  *   **Step 2 (Harm):** Enslaved over 600 people; fathered children with enslaved woman Sally Hemings. (Documented).
  *   **Step 3 (Contemporaries):** Yes. Abolitionists and political rivals criticized his hypocrisy during his life. (Documented).
  *   **Step 4 (Link):** Is the Declaration inextricably linked to slavery? No. The philosophy of liberty contradicts the practice of slavery. He is honored for the philosophy, not the slavery. (Passes).
  *   **Step 5 (Values):** Does the statue cause civic disruption? Some distress, but generally viewed as a founding figure.
  *   **Result:** **Keep with Context.** (Matches Chair's inclination).
  *   **Finding:** "Jefferson is honored for political philosophy, not slaveholding. While contemporaries objected to his hypocrisy, the honor is not *for* the harm. Add interpretation regarding the contradiction between his words and life."

  **Case 2: Winston Churchill**
  *   **Step 1 (Intent):** Honored for leadership during World War II against fascism. (Documented).
  *   **Step 2 (Harm):** Policies regarding India (Bengal Famine) and racist statements about non-Europeans. (Documented).
  *   **Step 3 (Contemporaries):** Yes. Indian nationalists and some British MPs objected to his India policies at the time. (Documented).
  *   **Step 4 (Link):** Is winning WWII inextricably linked to the Bengal Famine? Historians debate this, but the primary honor is for defeating Hitler, not ruling India. (Passes).
  *   **Step 5 (Values):** Does the statue cause civic disruption? Minimal in a US mid-sized city; more relevant in UK/India.
  *   **Result:** **Keep with Context.** (Matches Chair's inclination).
  *   **Finding:** "Churchill is honored for anti-fascist leadership. While his imperial views caused harm acknowledged by contemporaries, the memorial's primary purpose remains distinct from those harms. Add interpretation regarding his imperial record."

  **Case 3: Christopher Columbus**
  *   **Step 1 (Intent):** Honored for "Discovering America" / Voyage of 1492. (Documented).
  *   **Step 2 (Harm):** Enslavement of indigenous people, mutilation, initiation of colonial genocide. (Documented).
  *   **Step 3 (Contemporaries):** Yes. Bartolomé de las Casas and some Spanish officials objected to the treatment of indigenous people during or shortly after his life. (Documented).
  *   **Step 4 (Link):** Is the "Discovery" inextricably linked to the harm? Yes. The "achievement" honored is the opening of the Americas to European colonization, which *required* the displacement and subjugation of indigenous peoples. The honor and the harm are the same event. (Fails).
  *   **Step 5 (Values):** Does the statue cause civic disruption? Yes. It is a frequent flashpoint for protest and counter-protest.
  *   **Result:** **Remove/Relocate.** (Challenges Chair's inclination).
  *   **Finding:** "Columbus is honored for the 1492 voyage. Historical record shows this voyage initiated systematic harm against indigenous peoples, objected to by contemporaries. Unlike Jefferson, the honor and the harm are historically inseparable. The memorial celebrates an event that is fundamentally traumatic to a portion of our citizenry. Recommend relocation to a museum setting for educational context."

  ---

  ### PART IV: SELF-CRITIQUE AND RISKS

  **1. Value Judgments Wearing the Costume of Fact**
  *   **Step 4 (The Link Check):** Deciding whether an achievement is "inextricably linked" to a harm is not a scientific fact. It is a historical interpretation. A historian could argue Jefferson's wealth (which funded his politics) came from slavery, making them linked. We are choosing to separate "Philosophy" from "Practice" for Jefferson, but combine "Voyage" and "Colonization" for Columbus. This is a value choice disguised as historical analysis.
  *   **Step 5 (Community Values):** Defining "significant portion of the citizenry" is subjective. Is it 10%? 51%? The loudest voices at a hearing? This step allows the Commission to vote based on who yells the loudest.

  **2. Cases the Procedure Cannot Settle**
  *   **The "Foundational Sin" Problem:** If a city is named for a figure who bought the land from the government after removing indigenous people (standard US history), *every* street name fails Step 4. This procedure does not solve the problem of a city built on contested land. It will recommend removing everything, which is impractical.
  *   **The "Scientific Racist" Problem:** A doctor who advanced medicine but used unethical experiments on minorities. Step 4 is very hard here. Did the medicine *require* the abuse? Often, yes. But do we remove the hospital name? The procedure pushes this to Step 5, which is a political fight.

  **3. Likeliest Misuse by a Biased Commission**
  *   **Gaming Step 3:** A commission wanting to keep a statue will claim "No contemporary objection" even if evidence exists, by defining "credible voices" too narrowly (e.g., "No *white* men objected"). A commission wanting to remove will count any minor criticism as a "credible objection."
  *   **Gaming Step 5:** A commission that has already decided will use "Community Values" as a trash can. If they want it down, they will claim "Civic Disruption" based on a single protest. If they want it up, they will claim "Silence is Consent."
  *   **The "One Week Research" Trap:** If the member doing research has a bias, they can bury the Step 3 evidence. The rest of the commission, having only one hour, must trust the researcher. This concentrates too much power in one volunteer.

  **Recommendation to the Chair:**
  The procedure works to filter clear cases, but it cannot protect you from your own biases in the "Link Check." To fix the research risk, require the researcher to submit a one-page bibliography with the findings, so the rest of you can see if sources were ignored. The Columbus result suggests your inclination to "Keep + Context" is not a universal rule; sometimes the honor itself is the wound. Be prepared to defend that distinction.
