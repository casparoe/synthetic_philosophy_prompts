  ### Part 3: Position Descriptions & Awkward Commitments

  **[LEAF A] Popperian Falsificationism**
  *   **The View:** Observations can never prove a theory true, only prove it false. A green apple tells you nothing about ravens because it poses no risk of falsifying the raven hypothesis.
  *   **The Awkward Commitment:** You must accept that science never actually establishes truth, only survival. In a software context, this means you can never confirm a module works, only that it hasn't crashed *yet*. This makes "confidence" a misleading term; you only have "unfalsified status."

  **[LEAF B] Hempelian / Nicodian Instance Confirmation**
  *   **The View:** Logic is king. Since "All ravens are black" is logically equivalent to "All non-black things are non-ravens," anything that is non-black and non-raven (like a green apple) confirms the hypothesis.
  *   **The Awkward Commitment:** You must accept that looking at your shoe confirms that all ravens are black. While logically sound, this violates the engineering intuition that evidence must be *relevant* to the specific system under test. It treats the universe as a single, flat logical table.

  **[LEAF C] Quine-Style Holism**
  *   **The View:** Hypotheses are not tested alone but as part of a web of background theory. Whether an apple counts depends on the surrounding theoretical framework, not just the observation itself.
  *   **The Awkward Commitment:** You cannot isolate a single bug or feature for testing. Any test result could be explained away by adjusting a different part of your "web" (e.g., blaming the compiler rather than the code). This makes assigning responsibility for failure difficult.

  **[LEAF D] Goodman-Style Projectibility**
  *   **The View:** Not all properties are created equal. "Raven" and "Black" are natural kinds that support laws; "Non-black" and "Non-raven" are artificial categories that do not. Therefore, the apple does not confirm the hypothesis.
  *   **The Awkward Commitment:** You must rely on an intuitive distinction between "real" categories and "arbitrary" ones without a strict formal definition. In engineering terms, this is like saying some variable types are "lawful" and others aren't, based on semantic feel rather than type system rules.

  **[LEAF E] Subjective Bayesian**
  *   **The View:** The apple *does* confirm the hypothesis, but the increase in probability is so astronomically small (due to priors about the rarity of ravens) that it is negligible.
  *   **The Awkward Commitment:** You must accept that irrelevant data *technically* updates your model, even if by a rounding error. This requires maintaining probability distributions over all possible states of the world, which is computationally expensive and often impractical for finite agents.

  **[LEAF F] Likelihoodist**
  *   **The View:** Confirmation is not about belief, but about which hypothesis makes the data more probable. The apple supports "All ravens are black" slightly more than it supports competing hypotheses, based on objective ratios.
  *   **The Awkward Commitment:** You must separate "evidence" from "belief." You might have strong evidence for a hypothesis you still disbelieve (due to low priors). In debugging, this is like having a log that points to a specific function, while you remain convinced the bug is elsewhere due to past experience.

  **[LEAF G] Contrastive / Methodological (The Software Testing View)**
  *   **The View:** Evidence only counts if the testing procedure could have returned a different result relevant to the hypothesis. If you sampled from "all non-black things," you couldn't have found a raven, so the test is invalid for the raven hypothesis.
  *   **The Awkward Commitment:** The value of a test case depends on the *generation strategy*, not just the pass/fail result. A passing unit test on Module B does not confirm Module A unless the test harness was designed such that Module A *could* have caused a failure. This shifts focus from code to process.

  **[LEAF H] Deflationary / Pragmatic**
  *   **The View:** The paradox arises from loose language. In normal conversation, "evidence" implies relevance. Once we clarify that we mean "logical relevance" vs. "practical relevance," the tension disappears.
  *   **The Awkward Commitment:** You dissolve the problem rather than solving it. This is efficient but risks dismissing genuine structural issues in how we reason about uncertainty. It's the philosophical equivalent of closing a ticket as "Working As Intended" without checking the spec.
