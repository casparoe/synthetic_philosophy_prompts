      *   *Honesty:* I need to flag where I am stretching the craft terms to fit the philosophy.

  8.  **Final Polish:**
      *   Check against the "bad undergraduate year" constraint. Keep philosophy simple, keep craft precise.
      *   Ensure all parts of the prompt are answered (Residue, Empirical, Verdict, Flags).
      *   Make sure the distinction between "perceptual recognition" and "emotional recognition" is clear.

  **(Self-Correction during drafting):** I need to be careful with the Medieval Arabic reference. The user describes it as "answers the question by fiat, in a colour key." This sounds like they might be referring to a specific interpretation of Ibn Sina or Ibn Tufail, or perhaps Suhrawardi. However, the most famous "blind man gaining sight" thought experiment in that tradition is often attributed to Avicenna (Ibn Sina) regarding the "Flying Man," but that's about self-awareness. There is a specific reference in the *Hayy ibn Yaqzan* tradition where visual experience is discussed, but the "recognises everything" version is likely a specific philosophical stance (Rationalism) dressed in narrative. I will address it as the "Rationalist/Mystical" stance without getting bogged down in philology, as the user cares about the *position*, not the bibliography.

  Actually, looking closer at the prompt: "the version that appears in a medieval Arabic philosophical novel... recognises everything and finds only brightness new." This is likely a reference to *Hayy ibn Yaqzan* by Ibn Tufail, though Hayy isn't blind-then-sighted in the standard sense. However, there is a specific passage in Avicenna's *Kitab al-Isharat* or similar where the distinction is made. I will treat it as the "Innate Knowledge" position to avoid historical pedantry distracting from the craft advice, but I will flag the historical uncertainty.

  Wait, one more check: The user asks me to say if they posed it badly. I need to be honest. The translation *is* possible but it changes the nature of the inquiry from "Truth" to "Verisimilitude."

  Let's structure the response.
  1.  **Translations:** Map the 5 philosophical positions to craft terms.
  2.  **Residue Report:** Concept, Recognition, Craft's Excess.
