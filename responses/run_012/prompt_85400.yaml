  2.  **Deconstruct the Philosophical Positions (Molyneux's Problem):**
      *   *Locke/Molyneux (Empiricist):* No, he wouldn't know. Sight and touch are distinct senses; the connection is learned.
      *   *Leibniz (Rationalist):* Yes, he would know. Reason/Intellect grasps the common geometry (extension/shape) underlying both senses.
      *   *Berkeley (Idealist/Empiricist extreme):* No. Visual space and tactile space are fundamentally different languages.
      *   *Modern/Compromise:* Maybe flat shapes yes, solids no (needs reasoning).
      *   *Concept vs. Label:* Distinguishing between having the mental category and being able to say the word.
      *   *Medieval Arabic (Hayy ibn Yaqzan?):* The prompt mentions a version where he recognizes everything, only brightness is new. (Need to verify/check this specific reference, likely *Hayy ibn Yaqzan* by Ibn Tufail, though the specific "brightness only" detail might be a specific interpretation or conflation. I need to handle this carefully).
      *   *Empirical Data:* Project Prakash (MIT), Pawan Sinha. Patients generally fail immediate identification but learn very quickly (days/weeks).

  3.  **Translate to Craft Terms:**
      *   *Locke:* The *Scene* must show the disconnect. The *POV* is restricted. The object is defamiliarized. The character *perceives* but does not *know*.
      *   *Leibniz:* The *Summary* of understanding overrides the *Scene* of perception. *Free Indirect Discourse* bridges the gap. The character *knows* before the *Scene* confirms.
      *   *Compromise:* A mix of *Showing* (flat) and *Telling* (reasoning through solids).
      *   *Concept vs. Label:* *Internal Monologue* vs. *Dialogue*. Does the thought exist without the word?
      *   *Medieval:* *Defamiliarisation* is minimized. The *Visual Field* is familiar, only the *Lighting* (technical aspect) is new.
      *   *Empirical:* The *Scene* must depict confusion followed by rapid *Summary* of learning.

  4.  **Drafting the "Residue Report":**
      *   *Concept:* Craft doesn't really have "concept." It has "motif," "theme," or "character knowledge." "Possessing a concept" is closest to "Internalized Knowledge" or "Muscle Memory" translated to mind.
      *   *Recognition:* In craft, recognition is often emotional (anagnorisis). In philosophy, it's perceptual matching. This is a crucial distinction.
      *   *Craft's Excess:* Craft has *affect*. Philosophy ignores how it *feels* to be confused. Craft has *time*. Philosophy treats it as a logical instant; craft treats it as a duration.

  5.  **Integrating Empirical Data:**
      *   Project Prakash is key. They fail the Molyneux test initially. But they learn fast.
      *   Impact on positions: Supports Locke/Empiricists (connection is learned), refutes Leibniz (innate connection).
