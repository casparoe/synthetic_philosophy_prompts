answer: |-
  ### Brainstorming Candidate Terms

  Before settling on a label, I need to sift through the conceptual tools available in political anthropology and corruption studies to ensure we aren't just grabbing the nearest buzzword.

  1.  **Neopatrimonialism:** This describes the *system* (public office used for private gain), but it doesn't capture the *cognitive dissonance* or the specific moral logic your office workers are using. It's too structural; it misses the subjective experience of "righteousness."
  2.  **Moral Economy (E.P. Thompson/James Scott):** This is close. It deals with what a community considers legitimate claims on resources. However, "moral economy" usually implies a *shared* consensus on legitimacy (e.g., the poor have a right to grain). In your case, the consensus fractures along factional lines. Everyone claims the moral high ground, but they aren't sharing the same economy of judgment.
  3.  **Ethical Particularism vs. Universalism:** This is the standard sociological pairing (Parsons). Your actors claim Universalism ("Corruption is bad") but practice Particularism ("Unless it's us"). But this describes the *gap*, not the *mechanism* that allows them to ignore the gap.
  4.  **Segmentary Lineage Logic (Evans-Pritchard):** This is the strongest anthropological root. In segmentary systems, justice is relative to distance: "Me against my brother; me and my brother against my cousin." Morality is not absolute; it is positional. This fits the "whose network" dynamic perfectly.
  5.  **Deictic Ethics:** "Deixis" refers to words like "here," "there," "me," "you," whose meaning depends entirely on the speaker's position. If "corruption" functions deictically, it means "Corruption is always *there*, by *them*." This captures the linguistic slippage.
  6.  **Weaponized Morality:** This captures the aggressive use of the label against rivals, but it sounds more like political strategy than an unconscious cultural logic.
  7.  **Cognitive Dissonance:** A psychological term. It implies discomfort. Your subjects feel *no* discomfort. They are consistent within their own logic. So this is incorrect.
  8.  **Hypocrisy:** Implies knowing the rule and breaking it. Your subjects genuinely believe they are upholding a different rule.

  **Selection:**
  I am coining the term **"Segmentary Moral Accounting."**

  It combines the structural anthropology of **segmentary opposition** (where loyalty dictates truth) with the economic metaphor of **accounting** (balancing debts, gifts, and thresholds). It captures the calculation (size matters), the network (segments), and the moral judgment (accounting) without implying conscious lying (hypocrisy).

  ---

  ### The Concept: Segmentary Moral Accounting

  **Definition:**
  **Segmentary Moral Accounting** is a cognitive and social framework in which universalist moral vocabulary (e.g., "corruption," "integrity," "theft") is applied through a particularist logic of network loyalty. In this system, the moral valence of an economic or political act is not determined by the act itself, but by the **vector of the exchange** relative to the observer's moral segment.

  *   **Inward Vector (To Us):** Resource extraction or allocation is coded as **Obligation/Reciprocity**. It is a debt paid to the network that sustains the actor's power.
  *   **Outward Vector (To Them):** The identical act is coded as **Corruption/Predation**. It is a theft from the public (which is implicitly identified with "Us") to enrich a rival segment.

  The "Accounting" element refers to the threshold mechanism you noted (small envelope vs. big contract). In Segmentary Moral Accounting, the "exchange rate" between gift and bribe is floating. A large transfer to kin is a "necessary investment in stability"; a small transfer to a rival is "evidence of greed."

  **Why it is not Hypocrisy:**
  Hypocrisy requires a single moral standard that is knowingly violated. In Segmentary Moral Accounting, there are **two operational standards** that the actor perceives as one. They do not feel they are breaking the rule "Do not be corrupt." They believe they are following the rule "Do not let *them* steal from *us*." The contradiction is structural, not individual. They are "blind" to it because their moral vision is segmentary by design.

  **Why it is not Cultural Relativism:**
  Relativism suggests two different cultures with different values (e.g., "The West sees bribery; we see gift-giving"). In your scenario, everyone is using the *same* vocabulary ("corruption," "audit," "law"). The locals do not reject the auditor's categories; they **appropriate** them. They agree corruption is bad; they just disagree on the *referent* of the word in specific instances. It is a conflict over classification, not over values.

  **Why it is not Plain Favoritism:**
  Favoritism describes the *act* (helping friends). Segmentary Moral Accounting describes the *judgment* of the act. Favoritism doesn't explain why the office workers get *furious* about the rival contracts. They aren't just jealous; they are *morally outraged*. They view the rival's favoritism as a violation of the natural order, while their own favoritism is the maintenance of that order.

  ---

  ### The Carving: Cases Inside and Outside

  **Case Inside Segmentary Moral Accounting:**
  *   **Scenario:** A city councilor in Chicago (1950s) or a provincial governor in Pakistan (2020s).
  *   **Act:** The official awards a sanitation contract to a firm owned by his brother-in-law.
  *   **Judgment:** His supporters call this "taking care of our own" or "ensuring reliable service from people we trust." If a rival party member does the exact same thing, his supporters launch an investigation, calling it "cronyism" and "theft of taxpayer money."
  *   **Why it fits:** The act is identical. The moral judgment flips entirely based on the partisan segment. The language of "public trust" is used to defend the in-group act and attack the out-group act. The actors feel no contradiction.

  **Case Outside (Clear Contrast):**
  *   **Scenario:** A "Lone Wolf" Embezzler.
  *   **Act:** A mid-level bureaucrat steals funds from the office safe and uses them for personal gambling, with no distribution to kin, patrons, or clients.
  *   **Judgment:** *Everyone*—his rivals, his allies, his family, and the auditors—calls this corruption/theft.
  *   **Why it falls outside:** There is no segmentary logic to redeem the act. The resource flow did not sustain a network; it disappeared into private consumption. Even his own "segment" condemns him because he failed to convert the theft into social capital. This is plain corruption, not Segmentary Moral Accounting.

  ---

  ### What Turns on Getting It Right? (Program Design)

  If you misdiagnose this as **Hypocrisy**:
  *   **Intervention:** You try to shame the actors or increase transparency, assuming they know it's wrong and are hiding it.
  *   **Result:** Failure. They don't feel shame. They view your transparency reports as weapons used by rivals. They will simply hide the data better or attack the auditors' credibility.

  If you misdiagnose this as **Cultural Relativism**:
  *   **Intervention:** You try to educate them on "Western standards" of universalism.
  *   **Result:** Resistance. They will argue that their system *is* moral because it maintains social stability (patronage prevents chaos). You end up in a philosophical debate you can't win.

  **If you diagnose it as Segmentary Moral Accounting:**
  *   **Intervention:** You must disrupt the **segmentary logic**, not just the act.
  *   **Strategy:**
      1.  **Decouple the Network:** Design procurement rules that make it impossible to verify *who* the beneficiary is until after the contract is signed (blind bidding), breaking the link between "patron" and "client."
      2.  **Cross-Segment Auditing:** Do not use external auditors who are seen as a rival segment. Use rotating peer-audits where Office A audits Office B, and next year Office B audits Office A. This forces the "segmentary" logic to work *for* integrity (i.e., "I will catch *them* now so *they* can't catch *me* later").
      3.  **Reframe the Obligation:** Acknowledge the debt logic. Instead of banning gifts, create a public registry of "Political Debts" that must be declared. Force the "gift" to become a "commodity" (public record). When the social bond is exposed to the light, the Segmentary Moral Accounting often collapses because the "obligation" cannot survive public scrutiny even from the in-group.

  **Summary:**
  You are observing **Segmentary Moral Accounting**. It is the engine that allows corruption to function not as a deviance, but as a competing form of governance. Treating it as a moral failing rather than a structural logic guarantees your anti-corruption program will become just another weapon in their segmentary warfare.
