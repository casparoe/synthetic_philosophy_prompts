answer: |-
  To preserve non-reductive physicalism while accepting the autonomy of higher-level explanations, you should reject premise four of your colleague's argument. This premise asserts that if a higher-level property is not an additional causal difference-maker relative to the physical base, then it does no causal work of its own. This step is the engine of the causal exclusion argument, and it is the point where greedy reductionism smuggles in a contested metaphysical assumption about the nature of causation. By rejecting this step, you can maintain that higher-level properties are real and causally efficacious without claiming they are additional fundamental causes that violate the causal closure of the physical domain.

  Premise four looks plausible because it relies on a deeply intuitive but potentially misleading picture of causation as a conserved quantity or a zero-sum game. This intuition is bolstered by the principle of the causal closure of the physical, which states that every physical effect has a sufficient physical cause. If the physical base is already sufficient to produce an effect, it seems there is no causal work left over for anything else to do. Your colleague leverages this intuition to suggest that any claim of higher-level causation must either be redundant shorthand or a violation of physical closure. This makes the dilemma appear forceful because it presents causation as a scarce resource that can be exhausted by the fundamental level, leaving nothing for the higher level to grasp.

  However, rejecting this premise requires you to give up the assumption that causation is exclusive or competitive. You must adopt a compatibilist theory of causation, such as an interventionist or counterfactual account, where causal relations are defined by stability and dependence rather than by the transfer of energy or fundamental force. On such a view, a higher-level property can be a genuine cause because interventions on that property would change the outcome, even if those interventions are physically realized by changes in the base. This means you must accept that the same causal transaction can be truly described at multiple levels without the levels competing for ontological priority. You give up the idea that only the most fundamental description captures the real causal machinery, acknowledging instead that higher-level descriptions capture real patterns of dependence that are invisible at the particle level.

  By denying premise four, you break the link between supervenience and causal inertness. You can argue that higher-level properties do causal work of their own in the sense that they are the appropriate targets for explanation and intervention, even though this work is not additional in the sense of requiring new fundamental forces. This allows you to keep premise six, affirming that evolutionary or economic explanations are not mere shorthand, and premise eight, maintaining that non-reductive physicalism is a coherent position. The cost is metaphysical modesty regarding what causation is; you must abandon the view that causation is a singular relation grounded exclusively in fundamental physics and accept that causal efficacy can be realized multiply across different levels of description without contradiction. This saves the reality of the crane without requiring the skyhook, provided you understand the crane's lifting power as real at its own level even if it rests on a physical foundation.
