answer: |-
  # DIAGNOSTIC TREE: THE CAURAL AND EPISTEMIC STATUS OF PHENOMENAL JUDGMENT

  **Instructions:** Begin at **Node 1**. Answer based on your intuitions about the *grounding* of your introspective reports (e.g., "I see red," "This hurts"). Do not select a position by name; select the answer that best matches your metaphysical commitments. Proceed to the indicated Node or Leaf.

  ---

  ### NODE 1: The Truth-Maker Question (Mary's Room)
  **Case:** Consider your judgment, "I am having a qualitative experience." Does the truth of this judgment require a property to exist in the world that is *not* wholly exhaustible by the description of physical structures and causal-functional roles?
  *   **(A) No.** The physical/functional story exhausts the worldly facts. (Go to **Node 2**)
  *   **(B) Yes.** There is a "residue" of fact about experience that the physical story misses. (Go to **Node 3**)
  *   **(C) None.** The judgment does not aim to state a fact about a property; it is a non-cognitive expression or tool. (Go to **Leaf 10**)

  ### NODE 2: The Error Question (The Zombie Intuition)
  **Case:** If the physical story exhausts the facts, consider a physical duplicate of you (a Zombie). When the Zombie says "I am in pain," is it positing a property that *actually exists* in you both, or is it positing a property that *fails to exist* in both?
  *   **(A) Exists.** There is a real property (physical/functional) that makes the judgment true. (Go to **Node 4**)
  *   **(B) Fails to Exist.** The judgment posits a "qualitative" property that is not actually instantiated; we are systematically mistaken about our own nature. (Go to **Leaf 4**)

  ### NODE 3: The Causal Closure Question (Blindsighted vs. Normal)
  **Case:** You have established that phenomenal properties are distinct from physical/functional properties. When you report "I see red," does the *phenomenal property itself* play a causal role in producing that report, or does the underlying physical brain state cause the report while the phenomenal property merely accompanies it?
  *   **(A) Phenomenal Property Causes.** The experience itself exerts causal power on the physical world. (Go to **Node 5**)
  *   **(B) Physical State Causes.** The physical state causes the report; the experience is a causally inert byproduct. (Go to **Leaf 5**)

  ### NODE 4: The Entailment Question (The Explanatory Gap)
  **Case:** You hold that phenomenal properties are physical/functional. Is the connection between the physical description and the phenomenal property *logically transparent* (could a priori reasoning bridge the gap), or is it *brute/opaque* (conceivable that the physical exists without the phenomenal)?
  *   **(A) Transparent.** Zombies are inconceivable; the concept of the experience is contained in the physical concept. (Go to **Node 6**)
  *   **(B) Opaque.** Zombies are conceivable but metaphysically impossible; we grasp the same property via two distinct conceptual modes. (Go to **Leaf 3**)

  ### NODE 5: The Ontological Independence Question (Russell's Structure)
  **Case:** You hold that phenomenal properties are distinct and causally potent. Are these properties attributes of a *non-physical substance*, or are they the *intrinsic nature* of the physical substance itself?
  *   **(A) Non-Physical Substance.** Mind and matter are distinct ontological categories that interact. (Go to **Leaf 2**)
  *   **(B) Intrinsic Nature.** The physical description captures only causal structure; phenomenality is the "stuff" structuring itself. (Go to **Leaf 7**)
  *   **(C) Novel Emergence.** Phenomenality is a new kind of property arising from complex physical organization, not reducible but not a separate substance. (Go to **Leaf 8**)

  ### NODE 6: The Reduction Base Question (Function vs. Content)
  **Case:** You hold that experience is reductively physical and transparently entailed. Is the phenomenal property identical to the *causal role* the state plays, or the *representational content* it carries?
  *   **(A) Causal Role.** To have an experience is to occupy a specific functional state in the cognitive system. (Go to **Leaf 1**)
  *   **(B) Representational Content.** To have an experience is to represent the world as being a certain way (e.g., red surfaces exist). (Go to **Leaf 6**)

  ---

  ### DIAGNOSTIC LEAVES: POSITION AND AWKWARD COMMITMENT

  1.  **Reductive Functionalism:** Phenomenal properties are identical to causal-functional roles; *awkward commitment:* A perfect silicon simulation of your functional states literally feels pain exactly as you do.
  2.  **Interactionist Dualism:** Phenomenal states are non-physical substances that cause physical behavior; *awkward commitment:* Physical conservation laws (energy/momentum) are systematically violated during conscious acts.
  3.  **Phenomenal-Concept Physicalism (Type-B):** Phenomenal states are physical, but our concepts of them are distinct from physical concepts; *awkward commitment:* There is a necessary truth about the world that is cognitively inaccessible to a priori reasoning.
  4.  **Illusionism (Error Theory):** We make judgments about experience, but the qualitative properties they posit do not exist; *awkward commitment:* Your immediate introspective awareness of your own pain is a systematic cognitive error.
  5.  **Epiphenomenalism:** Phenomenal states exist but have no causal power over physical judgments; *awkward commitment:* You would make the exact same reports about your experience even if you lacked the experience entirely.
  6.  **Reductive Representationalism:** Phenomenal properties are identical to represented external properties; *awkward commitment:* Hallucinations and afterimages either lack phenomenal character or are misrepresentations of nothing.
  7.  **Russellian Monism / Panpsychism:** Phenomenality is the intrinsic nature of physical matter; *awkward commitment:* Fundamental particles (or ubiquitous physical bases) possess proto-experiential properties.
  8.  **Non-Reductive Emergentism:** Phenomenal properties are novel, causally potent, but dependent on physical bases; *awkward commitment:* New fundamental causal powers spontaneously appear at levels of biological complexity without reducing to micro-physics.
  9.  **Agnostic Naturalism:** (See Note Below) Phenomenal states are natural and causal, but human cognition is permanently closed off from understanding how; *awkward commitment:* The hard problem is real but unsolvable by beings with our cognitive architecture.
  10. **Instrumentalism:** Introspective judgments are tools for self-regulation, not truth-apt descriptions; *awkward commitment:* There is no fact of the matter about whether you are actually in pain, only about whether you say you are.

  ---

  ### DIAGNOSTIC NOTES ON LOGICAL SPACE

  **I. Indistinguishable Leaves (Empirical Equivalence)**
  *   **Leaf 3 (Type-B) vs. Leaf 7 (Russellian):** Both accept that physical descriptions don't entail phenomenal truths conceptually, yet both deny dualist substances. They differ on whether the phenomenal is the *intrinsic nature* of the physical (Russellian) or merely *conceptually distinct* from the physical (Type-B). *Further Question Needed:* "Does the physical description capture the *essence* of the object, or only its *relations*?"
  *   **Leaf 4 (Illusionism) vs. Leaf 5 (Epiphenomenalism):** Both agree that the *physical brain state* causes the judgment "I am in pain," not the pain itself. They differ on whether the pain *exists*. *Further Question Needed:* "If the causal story is complete without phenomenality, is phenomenality a real feature or a user-illusion?"

  **II. Empty or Unstable Logical Spaces**
  *   **Non-Physical Causation without Interaction:** A position where phenomenal states are non-physical and cause judgments, but do not violate physical closure (e.g., overdetermination). *Diagnosis:* Generally rejected as unparsimonious (systematic coincidence).
  *   **Causal Illusionism:** The view that experiences exist, cause nothing, and we are wrong about them existing. *Diagnosis:* Incoherent. If we are wrong about them existing, they don't exist; if they don't exist, they can't be the subject of the view. (This collapses into standard Illusionism).
  *   **Reductive Epiphenomenalism:** The view that experience *is* physical but causally inert. *Diagnosis:* Unstable. If it is identical to a physical state, and the physical state causes the judgment, then the experience causes the judgment by Leibniz's Law.

  **III. The "Agnostic" Leaf (Leaf 9)**
  *   This leaf is available at **Node 4 (Answer B)** or **Node 1 (Answer A)**. It captures the "Mysterian" intuition: Physicalism is likely true, but the link is cognitively closed to us. It is separated from Type-B Physicalism by the strength of the claim: Type-B asserts an identity exists; Agnosticism suspends judgment on the metaphysical bridge.
