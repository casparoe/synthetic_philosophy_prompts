  **High Court Asked to Rule on Causality of Cluster**

  The Careenium High Court convened to adjudicate whether a simmball can be said to have shoved an individual simm. The inquiry follows an incident on Sector 4 where a triangular formation of seventeen simms collided with a lone unit. The Terms of Reference ask whether any entity above the level of the individual simm has ever moved anything at all.

  Dr. A. N. Ism, for the prosecution, provided an exhaustive account. "At time t, Simm 12 exerted magnetic pressure on Simm 492," Dr. Ism stated, presenting vector diagrams. "The cluster is merely a descriptive convenience. The shove was executed entirely by constituent simms acting in local accordance with field gradients." The court found the account watertight, though magistrates noted it offered no purchase for assigning blame, rendering the explanation physically correct but practically inert. One muttered that knowing which simm touched which did not explain why the group moved as one.

  Counsel for the defence, Mr. H. Occam, adopted a flexible stance on ontology. In mitigation, he insisted his client was nothing over and above the seventeen simms comprising it. "To punish the cluster is to punish a ghost," he argued. "Liability must rest with the individual marbles." However, when the Chair praised the formation's efficient navigation of a barrier, Mr. Occam pivoted. "Indeed, the simmball demonstrated remarkable foresight," he said. "The cleverness resides in the pattern, not the parts. We cannot have it both ways: either the cluster is real enough to be clever, or it is not real enough to be guilty."

  Simm 492, the aggrieved party, gave a brief statement. "I do not object to the kinetic energy transfer," the simm said. "I object to being told that what shoved me was only other simms. I felt the shape. The shape pushed me."

  Concerns were raised regarding commercial implications. A representative from the Careenium Chamber of Commerce warned that if simmballs lack causal power, the economy is jeopardised. "Trade relies on agency," the representative said. "If a contract is signed by a cluster, but only the simms are real, then the agreement is merely a description of magnetic states. We cannot build an economy on a description. Currently, our GDP is fluctuating based on judicial ontology. Investors are nervous about purchasing assets that may not exist."

  The Tribunal adjourned without ruling. The Chair noted that while the simm-level account was physically complete, it failed to capture why the cluster turned left. Proceedings resume tomorrow to determine if patterns can be held in contempt.

  ***

  I have taken liberties by presenting the status of simmballs as an open legal question, whereas Hofstadter argues quite firmly that downward causation is real and necessary to explain the system's behaviour. I also extrapolated the "symbol" level into a literal commercial economy within the careenium; Hofstadter's analogy is strictly cognitive (neurons vs. thoughts), not socio-economic. I would tell it differently if I wished to honour Hofstadter's conclusion more closely, perhaps by having the Chair rule that the pattern is as real as the marbles, though that would lessen the satirical tension regarding reductionist explanations.
