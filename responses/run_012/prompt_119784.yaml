answer: |-
  Here are ten questions designed to corner the "SIA Shield" defense, moving from theoretical foundations to practical consequences and finally to empirical stress tests.

  **1. The Reference Class Boundary**
  "The Doomsday Argument relies entirely on your birth rank within a reference class. You've argued we should use 'humans ever born.' But why stop at the species barrier? If we define the class as 'primates,' our rank is much lower, and the doom prediction recedes. If we define it as 'all intelligent observers in the universe,' it recedes further. What is the principled, non-arbitrary rule for drawing the class boundary that doesn't just happen to align with the conclusion you want?"

  *   **Likely Answer:** "We must use the narrowest natural class of observers who share our specific evidence—i.e., observers who know they are human."
  *   **Follow-up:** "But 'knowing you are human' is a state of mind. If we upload a brain or build an AI that *thinks* it is human, or simply shares our epistemic situation regarding its birth rank, does it enter the class? If yes, the class size explodes and your argument vanishes. If no, you're defining the class by biology rather than epistemology, which looks like you're rigging the reference class to save the conclusion."

  **2. The SSA vs. SIA Fork**
  "Your standard defense against objections is that they implicitly rely on the Self-Indication Assumption (SIA)—the idea that you're more likely to exist in a universe with more observers. You reject this for the Self-Sampling Assumption (SSA). But critics say SSA forces you to accept the 'Presumptuous Philosopher' problem in reverse: you are presuming the universe is small in *time* just as SIA presumes it is large in *space*. Why is being presumptuous about the future duration of the universe more defensible than being presumptuous about its spatial size?"

  *   **Likely Answer:** "Because SIA allows us to infer facts about the world from our mere existence without looking, which is absurd. SSA only uses existence to update on indexical facts."
  *   **Follow-up:** "But if SSA forces us to assign a low prior probability to long futures *before* we look at any empirical evidence about asteroid risks or nuclear stockpiles, aren't we still inferring a fact about the world from our mere existence? At what point does 'updating on indexical facts' become indistinguishable from 'ignoring empirical evidence'?"

  **3. The Over-Application Worry**
  "I am a member of many classes: humans, males, people born in the 20th century, people who will blink roughly 500 million times in their life. If I apply your rank-in-a-class reasoning to my blinks, I should conclude I'm near the end of my blinking career. What stops this reasoning from proving too much? Why does the Doomsday Argument apply to 'observers' but not to 'blink-moments' or 'apartments lived in'?"

  *   **Likely Answer:** "Because blinks and apartments aren't observers. The argument requires a reference class of entities capable of reflecting on their own rank."
  *   **Follow-up:** "So the class is 'observer-moments.' If I live a very long life, I generate many more observer-moments than someone who dies young. Does the argument then predict I should expect to die soon simply because I've already accumulated a high rank of moments? If not, why does the 'observer' class avoid this while the 'blink' class succumbs to it?"

  **4. Background Knowledge and Priors**
  "Your new book frames the argument as a constraint on longtermist math. But the Doomsday Argument works by taking a prior distribution over the total number of humans and updating it with my birth rank. If I have strong empirical evidence that extinction risk is low—say, we've deflected all asteroids and dismantled nukes—doesn't that likelihood function swamp the prior update from my birth rank? Why should a philosophical prior constrain empirical risk assessment?"

  *   **Likely Answer:** "Because the prior from the Doomsday Argument is so strong that it takes an enormous amount of empirical evidence to overcome it. Most longtermists are essentially ignoring this prior."
  *   **Follow-up:** "If the prior is that strong, it implies that no matter how much safety technology we build, the probability of doom remains high simply because of when we were born. Are you arguing that existential risk is fundamentally unmanageable? Because if the risk is fixed by our birth rank, 'managing risk' becomes incoherent."

  **5. The "Cheating" Claim**
  "You claim longtermists are 'cheating' if they calculate expected value without shrinking their estimate of the future population based on the Doomsday Argument. But priors are subjective. If a longtermist chooses a prior that doesn't favor early doom, they aren't breaking math rules, they're just using different priors. Why is *your* prior the mandatory one? What makes it a constraint on rationality rather than just one philosophical opinion among many?"

  *   **Likely Answer:** "Because ignoring the selection effect of your own birth rank is a statistical error, like ignoring base rates. It's not a matter of opinion."
  *   **Follow-up:** "But base rates are derived from frequency data. We only have one data point: us. If I argue that our birth rank is not a random sample but a causal consequence of the conditions that allow life to flourish now, I'm not ignoring base rates, I'm challenging the sampling assumption. Why is your sampling assumption the default that counts as 'honest' math?"

  **6. Action Guidance and Expected Value**
  "Let's say we accept your constraint. The Doomsday Argument shrinks the expected number of future people. But longtermism is about reducing the *probability* of extinction. If the Doomsday Argument says extinction is highly probable, doesn't that make reducing risk *more* valuable per dollar, even if the total stake is smaller? Or does the shrinkage of the future population cancel out the increased probability of doom, leaving us with less motivation to act?"

  *   **Likely Answer:** "It increases the urgency. If doom is likely soon, we must act now. The expected value might be lower, but the marginal return on prevention is higher."
  *   **Follow-up:** "But if the argument implies the future is *short*, then the total value of saving it is low. If I tell a donor, 'The future is probably only 200 years, so the stakes are small,' they might give less. Are you worried that by making the Doomsday Argument a constraint on longtermism, you're mathematically deflating the very movement trying to prevent the doom you predict?"

  **7. The Adam & Eve Problem**
  "There's a known consequence of SSA called the 'Adam & Eve' problem. If SSA is true, I can reason that unlikely events won't happen to me, because if they did, I would be in a different reference class. This looks like psychokinesis—reasoning that my desires affect the world. You've said Causal Decision Theory blocks this. But does Causal Decision Theory fix the *epistemic* problem? If SSA leads to believing I can influence reality by how I define my reference class, isn't that a reductio of SSA itself, regardless of SIA?"

  *   **Likely Answer:** "No, because the causal links don't exist. The reasoning is counterfactual. We don't actually believe we have magic powers."
  *   **Follow-up:** "But the logic holds even without magic. If I bet on a lottery number and reason 'If I lose, there will be billions of losers, making my rank high; if I win, there are few winners, making my rank low; SSA favors low rank,' I should expect to win. If you say I shouldn't expect to win, you're abandoning SSA in practice. Can you name a single real-world case where you let SSA update your beliefs against the empirical odds?"

  **8. Case Study: The Alien Lineage**
  "Imagine we discover a signal tomorrow confirming another intelligent lineage in the galaxy with a history as long as ours. We are no longer the only game in town. Does the Doomsday Argument now predict that the *total number of such lineages* must be small? And isn't that in direct tension with the discovery, which suggests life is common? If the argument forces you to predict we *won't* find aliens, and we do, hasn't the argument failed?"

  *   **Likely Answer:** "The reference class expands to 'intelligent lineages.' If we find one, our rank in that class is still early, so the total number of lineages must be small. It predicts we won't find *many* more."
  *   **Follow-up:** "So if we find ten lineages, the argument predicts there are only ten. If we find a hundred, it predicts only a hundred. It seems the argument constantly retreats to the edge of our current knowledge. If the prediction is always 'There aren't many more than we currently see,' isn't that unfalsifiable until we've finished counting the universe?"

  **9. Case Study: Digital Minds**
  "Suppose we build a trillion digital minds next century. Do they count as observers in your reference class? If yes, our rank is currently tiny (early), and the Doomsday Argument disappears. If no, then the argument predicts we will *never* build them, because if we did, we wouldn't be early. So, does accepting the Doomsday Argument commit you to predicting that digital minds are impossible? And if so, should we stop trying to build them to avoid falsifying your theory?"

  *   **Likely Answer:** "If they are conscious, they count. The argument suggests it's unlikely we will create that many. It doesn't say it's impossible, just improbable."
  *   **Follow-up:** "But our actions determine whether they exist. If I decide to build them, I change the total $N$. Does the Doomsday Argument imply I *shouldn't* build them, because doing so would prove the argument wrong? It looks like the argument constrains not just our predictions, but our permissible actions. Are you comfortable saying that creating digital minds is evidence against the truth of your own argument?"

  **10. Falsification Conditions**
  "Finally, I want to pin down what could actually prove you wrong. 'We survive for 10,000 years' is the standard answer, but that just waits for the argument to expire. Is there a specific observation we could make *tomorrow*—a specific demographic statistic, a specific astronomical finding, or a specific feature of consciousness—that would count as evidence *against* the Doomsday Argument? If not, are we discussing a scientific hypothesis or a tautology?"

  *   **Likely Answer:** "If we found evidence that the total number of humans is already fixed and very large, independent of our rank."
  *   **Follow-up:** "But our rank is how we estimate that number. If the only evidence against it is knowing the future total directly, then the argument is immune to present evidence. Can you give me a piece of *current* data that would lower your confidence in the Doomsday Argument? If you can't, then it's not a constraint on our math, it's a prior that refuses to update."
