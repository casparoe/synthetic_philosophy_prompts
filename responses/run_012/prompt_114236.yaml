prompt: |-
  I do a small philosophy-of-mind podcast and next months guest is a vision scientist pushing a pretty heterodox line on the color phi. Her claim: nothing is ever "filled in." The two flashes get bound into a single event token, and the color slot on that token is written by the second flash; subjects report the dot changing color halfway across the path because they're reporting on one moving object rather than two events. She calls this late-write binding, says it's neither Orwellian nor Stalinesque, and thinks the same mechanism covers flash-lag and the cutaneous rabbit. I want 8-10 questions that don't let her just restate this. Please include at least: one on how late-write binding really differs from a boring Orwellian memory-edit, given that both predict exactly the same reports; one on the old Dennett point that the Orwellian and Stalinesque stories agree on every neural fact, so the question of *when* the color gets experienced has no answer -- is she escaping that or just relocating it?; one on the rabbit/flash-lag unification, since those seem to be about spatial order rather than color; and one on what would actually make her drop the view. Give each question a follow-up aimed at the answer she's most likely to give.
reasoning: |-
