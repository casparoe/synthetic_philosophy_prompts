      *   *Actually, the prompt says:* "state the same facts in a different vocabulary so the scoreboard simply can't compare them."
      *   *Okay, I'll simplify:* Team 1 & 2 describe the world by *Elements* (Fire, Water, Air, Earth). Team 3 & 4 describe the world by *Qualities* (Hot, Wet, Light, Heavy).
      *   Facilitator holds the "Translation Key."
      *   When scoring, Team 1 says "We have Fire." Facilitator: "That counts as Hot + Dry."
