      *   Team 1 is at World 1011 (Distance 1 from 1111).
      *   Team 3 is at World 1111 (Distance 0).
      *   Distance works!
      *   *The Catch:* Why is A=1 to A=0 the same distance as B=1 to B=0? What if A is "Mass of Universe" and B is "Color of Electron"?
