      *   *The Real Tension:* In civil law, the *later* (cool) decision overrides the *earlier* (hot) one. In criminal law, the *earlier* (cool/premeditated) decision makes the act *worse* than the *later* (hot/impulsive) act.
      *   *Synthesis:* The law seems to value *consistency* and *reflection*. A cool, planned act shows deep commitment to the wrong (criminal). A hot, pressured act shows lack of true commitment to the bargain (civil). But in both, the "reflective" state is the benchmark for full agency.

