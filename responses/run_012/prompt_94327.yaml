answer: |-
  The dual deployment of psychiatry in liberal law—authorizing confinement before harm (civil commitment) and granting exoneration after harm (the insanity defense)—rests upon a specific, often unarticulated conception of the human mind. To reconstruct this conception is to identify the boundary the law draws between the "mad" and the "bad." The practices presuppose that mental disorder is a **disruption of agency caused by internal pathology**, distinct from the failures of character or will that define ordinary criminality or social deviance.

  In this framework, the mind is treated as a mechanism of self-governance. When that mechanism functions correctly, the individual is the author of their actions and bears responsibility for them. When a "mental disorder" intervenes, it is conceived as an external force acting *upon* the will, or a breakdown *within* the machinery of volition, such that the individual is no longer the true author of their conduct. This is why the diagnosis serves two opposing legal functions: in civil commitment, the breakdown renders the person unable to govern themselves (requiring state guardianship); in the insanity defense, the breakdown renders the person unable to conform to the law (negating *mens rea* or moral culpability). Conversely, the "wretched, reckless, or eccentric" are presumed to retain intact agency; their harm is a product of choice, not mechanism, and thus warrants punishment or neglect, not medical intervention.

  ### Realism vs. Authority

  Does this require mental illness to be a "real kind," or merely a license for experts? The practices **genuinely presuppose a realist conception of mental disorder.** While the authority of psychiatrists is the procedural vehicle, that authority is legitimate only insofar as it is believed to track an independent fact of the matter. If mental disorder were merely a label experts are licensed to apply without reference to an underlying ontological reality, the distinction between confinement and punishment would collapse into arbitrary social control.

  The law treats the diagnosis not as a bureaucratic classification but as a **truth claim about capacity.** When a judge commits a person, they are asserting a fact: *This person's brain/mind is impaired.* When they accept an insanity defense, they assert: *This person's moral agency was compromised by pathology.* If these were merely administrative decisions based on expert fiat, the moral justification for depriving a non-criminal of liberty (commitment) or exempting a harm-doer from consequence (insanity) would vanish. The liberal state cannot justify coercion solely on the say-so of a guild; it requires a factual predicate that distinguishes the subject from a moral agent. Therefore, the practice requires that mental illness name a condition that holds independently of our disapproval, even if the precise boundaries of that condition are medically fuzzy.

  ### Accounts Ruled Out and Accommodated

  This realist presupposition rules out several prominent accounts of mental disorder:
  1.  **Radical Social Constructivism:** The view that mental illness is entirely a product of labeling and social deviation is incompatible with these practices. If "schizophrenia" were no more real than "criminality," using it to justify differential treatment would be unjust discrimination.
  2.  **Strict Behaviorism:** If mental states are defined solely by observable behavior, the distinction between the "reckless" and the "disordered" disappears, as both exhibit harmful behavior. The law requires an internal causal story (pathology) to excuse the behavior.
  3.  **Szaszian Anti-Psychiatry:** As discussed below, the claim that mental illness is purely a metaphor for "troubles in living" is directly negated by the legal reliance on illness as an exculpatory or justificatory fact.

  The practices accommodate:
  1.  **The Biomedical Model:** The view that disorders are brain diseases fits neatly, providing the "real kind" ontology the law desires.
  2.  **Functional/Cognitive Models:** Accounts that define disorder as a failure of specific cognitive capacities (reality testing, impulse control) are also accommodated, provided these failures are treated as factual impairments rather than moral choices.

  ### The Coherence of Asymmetry

  Is the asymmetry between confinement and excuse coherent, or merely administrative? It is the expression of a **single coherent view of mind and responsibility.** Both practices flow from the principle of **conditional autonomy.** Liberal law grants individuals liberty on the condition that they possess the capacity to use it safely and legally.
  *   **Civil Commitment** addresses the failure of the *capacity for self-preservation* (parens patriae).
  *   **The Insanity Defense** addresses the failure of the *capacity for moral compliance* (retributive justice).

  In both cases, the trigger is the same: a pathological loss of the rational faculties required for autonomy. The asymmetry is not a contradiction but a bifurcation of state power responding to the same deficit in different temporal contexts (pre-harm vs. post-harm). It is a unified theory of non-responsibility grounded in compromised agency.

  ### The Szaszian Challenge

  Thomas Szasz argued that "mental illness" is a myth—a metaphorical designation for "troubles in living" that society has chosen to medicalize to manage deviance. If Szasz were correct, the current practices would undergo a radical transformation, stripping away their medical legitimacy.

  **What would survive:**
  1.  **Dangerousness Detention:** The state's "police power" to detain individuals who pose an imminent physical threat would remain. However, it could no longer be disguised as "civil commitment" for treatment. It would have to be acknowledged as **preventive detention**, subject to the strict due process protections of criminal law, because there is no "illness" to treat, only risk to manage.
  2.  **Capacity Defenses:** The core intuition behind the insanity defense—that some people lack the cognitive ability to understand their actions—would survive, but it would be decoupled from "medicine." It would become a **cognitive incapacity defense**, similar to infancy or severe intellectual disability, determined by legal and psychological standards of understanding, not medical diagnosis.

  **What would have to be put in their place:**
  1.  **The End of *Parens Patriae*:** The state could no longer confine someone merely for being "unable to meet basic needs" due to mental illness. Without a real illness, this is simply homelessness or poverty, which are social welfare issues, not medical emergencies. Confinement would be prohibited unless the individual committed a crime or posed an immediate violent threat.
  2.  **Demedicalization of Deviance:** "Treatment" would be replaced by "support" or "containment." The vocabulary of symptoms and remission would be replaced by the vocabulary of behavior and risk. The psychiatrist would lose their unique legal status as a gatekeeper of liberty, becoming merely an expert witness on risk and cognition, no different from a sociologist or criminologist.

  ### Verdict

  Do these practices genuinely presuppose a realist conception of mental disorder, or are they merely administrative settlements sharing a vocabulary?

  **The practices genuinely presuppose a realist conception of mental disorder.**

  To argue otherwise is to misunderstand the moral logic of liberal law. The law does not treat psychiatric diagnosis as a convenient heuristic or a bureaucratic tool; it treats it as a **fact of exoneration.** If the legal system operated on the understanding that mental disorder was merely a metaphor or a social construct, it would be committing a profound injustice: depriving the "committed" of liberty based on a fiction, and exempting the "insane" from responsibility based on a myth.

  The legitimacy of the entire framework hinges on the truth of the proposition that *there is a factual difference between the person who cannot control themselves due to pathology and the person who will not control themselves due to choice.* While science may struggle to draw this line with perfect precision, the *practice* of law cannot function without the presupposition that the line exists in reality. If the realist conception were abandoned, the practices would not simply continue as "administrative settlements"; they would lose their moral warrant and collapse into illegitimate coercion and arbitrary exemption. Therefore, the practices are not just compatible with realism; they are **ontologically dependent** upon it. They require the world to actually contain "mental disorders" as distinct kinds of conditions, not merely labels applied by licensed experts.
