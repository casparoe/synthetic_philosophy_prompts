answer: |-
  **Project Title:** The Independence Criterion: Evaluating Explanatory Power in Cultural Selectionism vs. Reconstructionism

  **Project Summary**
  This project proposes a six-month, half-time research period to produce a substantial theoretical paper addressing a foundational epistemic problem in cultural evolution. The standard defense of Darwinian approaches to culture rests on the satisfaction of three conditions: variation, differential transmission, and heritability. I argue that satisfying these conditions is necessary but not sufficient for non-circular explanation. A selectionist explanation is only explanatory if the selection pressure can be specified independently of the trait's differential success. This project will formalize this "Independence Criterion" and apply it to competing frameworks: high-fidelity memetics and cognitive attractor/reconstructionist models. The goal is to determine whether the current debate, typically centered on copying fidelity, is misaligned with the actual requirements for causal explanation.

  **Research Question**
  *Can selectionist explanations in cultural evolution specify selection pressures independently of the differential transmission rates they purport to explain?*

  This question admits a determinate answer. For any given case study within a framework, the selection pressure either is or is not specifiable without reference to the outcome frequency. By aggregating these findings across representative cases, the project will determine whether one framework systematically satisfies the Independence Criterion while the other systematically fails it.

  **Background and Significance**
  The dominant justification for cultural selectionism is the "Lewontin Condition" argument: if a population exhibits variation, heritability, and differential fitness, selection must be occurring. Consequently, cultural change can be explained by the "fitness" of memes or cultural traits. However, this risks explanatory circularity. If "fitness" is defined solely as "that which spreads," the statement "trait X spread because it was fit" reduces to "trait X spread because it spread."

  To avoid tautology, the properties conferring fitness must be identifiable *prior* to and *independently* of the measurement of transmission success. In biology, this is often achieved via physiological or ecological modeling (e.g., camouflage efficiency predicts survival rates). In cultural evolution, this independence is rarely demonstrated.

  Current literature largely debates the *fidelity* of cultural copying. Memeticists argue fidelity is high enough for selection; reconstructionists argue it is too low, positing that cultural forms are regenerated anew each time via psychological attractors. I contend this is a category error. Even with low fidelity, selection could operate if independent pressures existed. Conversely, high fidelity does not guarantee non-circular explanation. The crux is not the mechanism of transmission (copying vs. reconstruction) but the epistemic status of the selection pressure. My hypothesis is that memetic accounts typically define fitness retrospectively based on spread, whereas attractor-based accounts define pressure independently via cognitive constraints (e.g., memory biases, inferential systems).

  **Methodology and Work Plan**
  This is a theoretical project requiring conceptual analysis and case study evaluation. Given the half-time constraint (approx. 20 hours per week), the scope is limited to philosophical formalization and the analysis of existing, well-documented case studies from the literature.

  *   **Month 1: Formalizing the Independence Criterion.**
      *   Refine the definition of "independent specifiability" in the context of cultural explanation.
      *   Distinguish between *predictive* independence (predicting spread before observation) and *explanatory* independence (identifying causal mechanisms without referencing spread).
      *   Draft the philosophical framework section of the paper.

  *   **Month 2: Audit of Memetic Case Studies.**
      *   Select three canonical examples often cited as successful memetic explanations (e.g., viral internet phenomena, religious spread, linguistic drift).
      *   Analyze each to determine if the "fitness" conferring properties were identified independently of the spread data.
      *   Draft the critical analysis section regarding selectionism.

  *   **Month 3: Audit of Attractor/Reconstructionist Case Studies.**
      *   Select three canonical examples from the cognitive attraction/reconstruction framework (e.g., minimally counterintuitive concepts, rumor transformation chains).
      *   Analyze whether the psychological pressures (the "attractors") are specified via independent experimental or cognitive data.
      *   Draft the comparative analysis section regarding reconstructionism.

  *   **Month 4: Synthesis and Counter-Argumentation.**
      *   Anticipate objections from the selectionist side (e.g., arguments that retrospective fitness assignment is valid in evolutionary biology).
      *   Refine the distinction between biological and cultural contexts regarding independent measurement.
      *   Develop the argument for why the "fidelity" debate is secondary to the "independence" issue.

  *   **Month 5: Drafting the Full Manuscript.**
      *   Assemble sections into a cohesive long paper (target 10,000–12,000 words).
      *   Ensure the argument flows from the philosophical criterion to the empirical evaluation.
      *   Focus on clarity and rigor to ensure the determinate nature of the conclusion is apparent.

  *   **Month 6: Revision and Finalization.**
      *   Critical review of the argument for logical gaps.
      *   Refine the conclusion to clearly state the verdict on the Research Question.
      *   Prepare the manuscript for submission to a target journal in philosophy of science or theoretical biology.

  **Expected Outcomes**
  The primary deliverable is a long-form research paper suitable for publication in a peer-reviewed journal. The paper will provide a formalized criterion for evaluating cultural evolutionary explanations that shifts the focus from transmission mechanics to explanatory logic.

  **Success and Failure Criteria**
  *   **Success:** The project successfully demonstrates an asymmetry: that standard memetic explanations generally fail the Independence Criterion (relying on retrospective fitness assignment), while attractor-based explanations generally pass it (relying on independently verified cognitive biases). This would validate the hypothesis that the reconstructionist framework offers superior explanatory power, not because of fidelity, but because of non-circularity.
  *   **Failure (Type 1 - Hypothesis Refuted):** The analysis reveals that memetic explanations *can* and *do* specify selection pressures independently (e.g., through network topology or ecological constraints) as often as attractor models. In this case, the paper will report that the selectionist framework is more robust than anticipated, and the "circularity" objection is a straw man.
  *   **Failure (Type 2 - Universal Failure):** The analysis reveals that *neither* framework satisfies the Independence Criterion. Attractor models might rely on post-hoc rationalization of what constitutes an "attractor" just as much as memetics relies on "fitness." This would be a significant negative result, suggesting a crisis in the explanatory structure of cultural evolution theory as a whole.
  *   **Failure (Type 3 - Criterion Incoherence):** During Month 1, it may become clear that "independent specifiability" is not a coherent requirement for historical sciences. If the philosophical groundwork collapses, the project will pivot to a paper arguing why the Independence Criterion is inappropriate for cultural science, which remains a valuable theoretical contribution.

  In all scenarios, the project yields a determinate answer to the Research Question, resolving the ambiguity regarding the logical structure of current cultural evolutionary explanations.
