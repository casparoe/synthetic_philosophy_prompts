answer: |-
  ### Taurek's Position in CMDP Vocabulary

  In your finite-horizon constrained Markov decision process (CMDP) framework, John Taurek's position translates to a specific restriction on the objective function and the feasible policy space. Standard emergency allocation models typically maximize the expected sum of survival rewards (utilitarianism). Taurek rejects this aggregation. Instead, his view imposes a hard **chance constraint** on the ex-ante survival-probability vector $\mathbf{p}$. For any set of individuals $N$ competing for a scarce resource in a given state, the policy $\pi$ must satisfy $p_i(\pi) = p_j(\pi)$ for all $i, j \in N$.

  The objective becomes maximizing this common probability $c$, such that $p_i \ge c$ for all $i$, rather than maximizing $\sum p_i$. The "numbers do not count" thesis is modeled by ensuring the cardinality of any subgroup does not weight the objective function. The solution is a **stochastic policy** (a lottery over deterministic allocation rules) that equalizes marginal survival probabilities across all individuals, regardless of group size.

  ### Residue Report

  **The Equal-Claim Idea**
  In your vocabulary, the equal-claim idea maps most cleanly to a **chance constraint** requiring equality across coordinates of the survival-probability vector. It is not merely a max-min objective, because max-min allows inequalities if they benefit the worst-off; Taurek demands strict equality of ex-ante chances in conflict cases. It is implemented as a **lottery over deterministic policies** (e.g., 50% "Save Group A," 50% "Save Group B"). However, your vocabulary treats this as a mathematical feasibility region, whereas Taurek treats it as a moral boundary that cannot be crossed even for efficiency gains.

  **Saving vs. Not Saving / Doing vs. Allowing**
  When written as a choice among policies, the distinction between saving and not saving collapses into **stochastic transitions**. An action leading to death is simply a transition with survival probability zero. The moral distinction between "doing" (killing) and "allowing" (letting die) is lost because the CMDP evaluates policies based on outcome distributions, not the causal lineage of the transition. Taurek's concern that overriding a claim is a specific moral injury cannot be encoded in the transition matrix; only the final survival indicator remains visible to the optimizer.

  **Separateness of Persons**
  The separateness of persons is difficult to maintain when persons appear as **coordinates in a survival-probability vector**. Mathematically, vectors invite aggregation (dot products, sums). To represent Taurek's non-aggregability, you must forbid specific objective functions (like summation) rather than relying on the structure itself. The model inherently treats persons as interchangeable indices. Taurek's claim that each person's reason is independent cannot be fully expressed because the constraint matrix binds them together systemically; the "separateness" must be enforced externally by restricting the solver from trading $p_i$ against $p_j$.

  **The Coin-Flip Prescription**
  Your vocabulary generates a **family of lotteries** that all equalize ex-ante chances but differ in correlation structures. For example, you could correlate survival across the group or independentize it, provided marginals remain equal. Taurek's coin-flip prescription does not survive as a unique recommendation without an additional **symmetry principle**. His position supplies the constraint ($p_i = p_j$) but lacks the precision to select a specific joint distribution over outcomes. Your model reveals that "equal chance" underdetermines the policy unless you add constraints on variance or correlation.

  **Residue Diagnosis and Intuition**
  The residue is partly a defect of your vocabulary but primarily evidence that Taurek's position is less precise than it looks. Your framework can enforce the equality constraint but cannot represent the metaphysical justification for why aggregation is forbidden. Regarding your intuition: you are **partly right** that this is a fairness constraint, but you miss the radical **anti-aggregation** thesis. Standard fairness constraints (like Rawlsian maximin) still operate within an aggregative framework where trade-offs are possible. Taurek denies the trade-off space exists. Your vocabulary can model the restriction, but it assumes trade-offs are permissible unless explicitly forbidden; Taurek asserts they are conceptually impossible.

