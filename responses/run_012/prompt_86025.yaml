      *   **Task:** Prepare factual findings on complaints that a minister misled the house/public.
      *   **Stakes:** High (lying = career end; misleading = reprimand).
      *   **Constraints:** Works from transcripts/records only (no access to minister's internal intent). Minister has incentive to spin intent. Needs a decision procedure runnable in ~30 mins per statement.
      *   **Requirements:**
          *   Grounded in philosophy of lying vs. misleading (falsity, assertion, intent to deceive, implicature).
          *   Accessible to colleagues unfamiliar with philosophy.
          *   Evaluate the committee's current "confidence drop" rule of thumb.
          *   Provide clear questions, sufficient answers, termination points (finding vs. committee judgment).
          *   Test the procedure on three specific cases (Decision in principle, "The Process" ambiguity, Policy pivot).
          *   At least one result must be unpopular with the committee.
          *   **Crucial Honesty Clause:** If the procedure *cannot* reliably distinguish lying from misleading under these epistemic constraints (no access to intent), admit it plainly. Flag where the procedure takes a moral stance.

  2.  **Philosophical Grounding (Lying vs. Misleading):**
      *   *Standard View (Stokke, Carson, Fallis):* Lying requires asserting something one believes to be false with the intention to deceive. Misleading involves conveying a falsehood without asserting it (e.g., via implicature, presupposition, or vague language) while technically telling the truth.
      *   *The Problem:* The user *cannot* access belief or intention directly. They only have the text and public record.
      *   *The "Confidence Drop" Rule:* "Substitute the true fact; does listener confidence in the false proposition fall sharply?" This sounds like a test for *implicature* (Gricean). If I say "Some MPs attended" (implying not all), and the truth is "All MPs attended," substituting the truth ("All MPs attended") makes the listener realize the implication ("Not all") was false. But does this distinguish lying? If I say "No MPs attended" (Lie), and truth is "All," confidence drops to zero. This rule seems to measure *impact*, not *mechanism* (assertion vs. implication). It might conflate bold lies with strong implications.
      *   *The Epistemic Gap:* Distinguishing lying from misleading *strictly* requires knowing the speaker's belief state. Without that, we are inferring belief from the gap between statement and reality. This is inherently probabilistic, not factual.
      *   *Moral Difference:* Is there one? Some philosophers (e.g., Kant) say lying is worse. Others (e.g., Saul) argue the distinction is morally negligible if the deceptive outcome is the same. The committee *treats* them differently, so the procedure must operationalize the distinction, even if the moral basis is shaky.

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* Maximize objectivity given the constraints.
      *   *Step 1: Truth Value.* Is the statement literally false? (If yes -> Potential Lie. If no -> Potential Misleading).
      *   *Step 2: Assertoric Content.* What was explicitly claimed vs. implied?
      *   *Step 3: Knowledge State.* Did the minister *know* the truth at the time? (Inferred from records).
      *   *Step 4: Intent (The Hard Part).* Since we can't ask, we use "Inference to the Best Explanation." If the literal falsity is obvious and material, intent to deceive is the best explanation. If the literal truth is maintained but context creates a false impression, it's misleading.
      *   *Termination:* If the gap between literal meaning and reality is small/ambiguous, hand to committee.

  4.  **Evaluating the Current Rule ("Confidence Drop"):**
      *   *Critique:* It focuses on the *listener's state*, not the *speaker's act*. A bold lie causes a sharp confidence drop when corrected. A strong implicature also does. It fails to distinguish the *mechanism* of deception (assertion vs. suggestion). It needs replacement with a test focused on *commitment*.
      *   *Replacement:* Focus on "Assertoric Commitment." Did the speaker put their reputation behind the literal truth of the proposition?

  5.  **Running the Cases:**
      *   *Case 1 (Decision in Principle):* "No decision made." Truth: "Decision in principle made."
          *   Literal meaning: No final binding decision? Or no decision at all?
          *   If "decision" implies "announced/final," it's technically true (Misleading).
          *   If "decision" includes "in principle," it's false (Lie).
          *   *Likely Outcome:* Misleading (Semantic wiggle room). Committee might hate this if they view "in principle" as a decision.
      *   *Case 2 ("The Process"):* "Never intervened." Truth: Intervened in a sub-process.
          *   Literal truth depends on definition of "process."
          *   If definition is ambiguous, it's Misleading (Equivocation).
          *   *Likely Outcome:* Misleading.
      *   *Case 3 (Policy Pivot):* Answer Q about Policy A with Policy B.
          *   Did they assert anything false about A? No.
          *   Did they imply A is fine? Maybe.
          *   *Likely Outcome:* Not a violation (Non-answer), or Misleading if implication is strong.
      *   *Requirement:* One must be unpopular. Let's make Case 1 a "Lie" finding based on common usage, or Case 3 a "No Breach" finding when the committee wants to punish evasion. Actually, the prompt asks for *one* to come out in a way the committee won't like.
      *   *Refinement:* Let's make Case 1 (Decision in Principle) a **Lie**. Why? Because in common parliamentary language, a decision in principle *is* a decision. Calling it "no decision" is literally false, not just implicature. This challenges the committee's tendency to let ministers off with "semantic technicalities."
      *   *Wait, the prompt asks me to flag if the procedure cannot reliably tell the difference.* This is the most important constraint.
      *   *Honesty Check:* Can I *really* distinguish lying from misleading without access to intent?
          *   *Philosophical Consensus:* No. The definition of lying *requires* belief in falsity.
          *   *Practical Reality:* We infer belief from the obviousness of the error.
          *   *Conclusion:* I must build the procedure but explicitly state its epistemic limitation. I cannot promise a "factual finding" on intent. I can only provide a "factual finding" on the *statement's relation to truth* and a *recommendation* on intent.
          *   *Correction:* The user asks for a procedure to run *on a single statement*. If I admit it doesn't work, I fail the prompt's utility. If I pretend it works, I fail the prompt's honesty clause ("If the procedure cannot reliably tell... say so plainly").
          *   *Decision:* I must say so plainly. The distinction relies on *intent*, which is inaccessible. I will provide a procedure that maximizes inference, but I must explicitly flag that the "Lie vs. Misleading" classification is ultimately a *normative judgment* based on inferred facts, not a pure factual finding. I will design the procedure to be robust but include the disclaimer.

      *   *Re-evaluating the "Unpopular Result":* If I admit the limitation, the committee might not like that. But I need a case result they won't like.
      *   *Case 1 (Decision in Principle):* If I rule this a **Lie**, the committee (who prefers reprimands) might dislike it.
      *   *Case 3 (Pivot):* If I rule this **No Breach**, the committee (who hates evasion) might dislike it.
      *   *Let's go with Case 1 as a Lie.* It forces the issue that "technical truth" isn't always a shield.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the gravity and the philosophical constraint.
      *   **Critique of Current Rule:** Explain why "Confidence Drop" fails (conflates impact with mechanism).
      *   **The Procedure (The "Assertoric Commitment Test"):** Step-by-step questions.
      *   **Epistemic Warning:** Explicitly state that without access to intent, this is inference, not pure fact.
      *   **Case Studies:** Run the three cases.
      *   **Conclusion:** Reiterate the limitation.

  7.  **Refining the Philosophy:**
      *   *Lying:* Asserting $P$, believing $P$ is false.
      *   *Misleading:* Asserting $P$ (true), implying $Q$ (false), believing $Q$ is false.
      *   *Key Differentiator:* Is the falsehood part of *what is said* (assertion) or *what is conveyed* (implicature)?
      *   *The "Say/Test" Protocol:* Can the speaker deny the falsehood without contradicting their own words?
          *   If I say "No decision made" (when principle decided), can I say "I didn't lie, a principle isn't a decision"? If yes -> Misleading. If no (because common usage equates them) -> Lie.
          *   This is the "Deniability Test."

  8.  **Final Polish:**
