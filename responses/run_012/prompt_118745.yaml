  I caught a moth squatting in a rationale it didn't own.
  It swore it flew into the flame for love, but the deed said "Navigation Error."
  I told him, "You're evicted."
  He said, "By who?"
  I said, "By the deed. It's valid, it's binding, and the landlord never existed."

  ***

  **Note on Liberties and Theory**

  **Theoretical Work:** The joke relies on a real estate metaphor to compress the concept of *normativity without a normer*. The "deed" represents the free-floating rationale (the objective functional explanation), while the "eviction" represents the possibility of malfunction or error. The punchline ("the landlord never existed") does the heavy lifting to deny the "nature-as-engineer" trope, asserting that the normativity is real despite the absence of a designer or mind to hold it.

  **Free-Floating Rationale:** You have the idea right. The joke captures the core Dennettian claim: reasons can exist objectively as explanations for design without being represented by any agent. The "deed" exists independently of the moth's understanding.

  **Squatted Rationale:** This is your own term, not standard terminology, but the theory supports the distinction. Dennett distinguishes between *competence* (the actual evolutionary rationale) and *comprehension* (the agent's folk-psychological account). The joke treats the moth's conscious excuse ("love") as a "squatter" occupying the space of the true, unrepresented rationale ("navigation").

  **Punchline Assumptions:** The punchline quietly assumes an **etiological account of function** (a trait's function is determined by its selection history). If your course favors a systemic or forward-looking account of function, the "deed" might be contested. Additionally, the joke assumes that "error" requires a standard (the deed) but not a judge (the landlord), which is the precise oddity you wanted to highlight.

  **Assignment Viability:** The assignment is not confused. It is a standard pedagogical tool in philosophy to test conceptual grip through recontextualization. However, it demands high precision: if the metaphor implies a missing person (landlord) rather than a non-existent one, it risks reintroducing the designer trope. The phrasing "never existed" is crucial to maintain theoretical fidelity.
