      *   **Task:** Provide a *definite reading* (commit to a position), not a survey. Analyze specific scenes (explanation of sky/mountains, love story, doctor's diagnosis/operation, endings). Evaluate if Wells supports or distorts the philosophy. Integrate the empirical data. Identify what Wells adds that the philosophers/scientists miss. Critique the user's proposed lens if necessary.
      *   **Tone:** Academic but accessible (high school junior level), committed, critical, nuanced.

  2.  **Deconstruct the Philosophical Lens (Molyneux's Problem):**
      *   *Locke/Molyneux:* No innate connection. Experience is required to link sight and touch.
      *   *Berkeley:* Radical discontinuity. Sight and touch are entirely different languages; "distance" and "3D shape" in vision are learned associations, not direct perceptions.
      *   *Leibniz:* Rationalist. Extension is a common concept; reason should bridge the gap.
      *   *Reid:* Nuanced. 2D might transfer, 3D might not.
      *   *Project Prakash:* Empirical support for Locke/Berkeley. Immediate cross-modal mapping fails but is learned quickly (days/weeks).

  3.  **Analyze the Story (*The Country of the Blind*):**
      *   *Premise:* A sighted man enters a blind society.
      *   *Conflict:* Epistemological isolation. Nuñez cannot communicate his visual experience; the blind cannot conceive of it.
      *   *Key Scenes:*
