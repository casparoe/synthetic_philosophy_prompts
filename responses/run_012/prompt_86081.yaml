      *   *Crucial Distinction:* This is *not* exactly Molyneux's Problem. Molyneux is about *one person* gaining a second sense. Wells is about *two groups* with incommensurable sensory worlds trying to communicate. It's more about private language and social epistemology than individual perceptual psychology.

  4.  **Formulate the Thesis (Committing to a Position):**
      *   *Initial thought:* Is it Lockean? Nuñez fails to teach them. But they aren't gaining sight; they are refusing to conceive of it.
