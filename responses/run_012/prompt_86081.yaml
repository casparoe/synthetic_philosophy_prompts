      *   *On Prakash:* If the mapping takes days, Nuñez had years. Why couldn't he teach them? Because they lack the *organ*. Prakash patients *had* eyes, just cataracts. The villagers have no eyes (or non-functioning ones). So Prakash actually *supports* Wells: without the hardware, the software won't run. The villagers can't learn the mapping because they lack the visual input entirely. Nuñez can't translate because they have no reference. This is a crucial distinction. Molyneux is about a blind man *gaining* sight. Wells is about a sighted man *entering* blindness. It's the inverse. I need to highlight this inversion.

      *   *Revised Thesis:* Wells inverts Molyneux. Instead of "Can the blind understand sight upon gaining it?" he asks "Can the blind understand sight when they never will?" This makes it a Berkeleian critique of language, not just perception.

      *   *Ending:* 1904 is philosophically stronger. 1939 is Hollywood. I'll argue for 1904.

  8.  **Final Review against constraints:**
