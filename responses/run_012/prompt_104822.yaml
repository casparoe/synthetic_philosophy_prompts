prompt: |-
  I run a 14-person upper-level epistemology seminar, 75 minutes, and I want my students to feel pragmatic encroachment from the inside before I ever say the words. Here's the game I'm half-imagining — please flesh it into something actually runnable, with roles, materials, a timeline, and payoffs that don't need real money. Everyone gets a private signal about which of two boxes holds a token; say the signal is right 80% of the time and they know that's the reliability. Each round, before they're allowed to act on the signal, they have to tick one box: "I know which box it's in" or "I don't know." The only thing that varies between rounds is whats at stake if they act on a wrong signal — sometimes it costs them a point, sometimes a teammate loses a point, in one round the whole team does, and in one round the cost is just a bit of embarrassment. I want them to notice that their information never changed but their willingness to say "I know" did. Then a second phase: split the room, half judges a vignette character who has exactly the signal they had in the low-stakes round and half judges the same character in the high-stakes round, and the two halves compare answers out loud. The debrief should map what just happened onto pragmatic encroachment vs. contextualism vs. the boring invariantist line that we've only changed what people are willing to assert, not what they know — and be honest about which of those three the activity can't actually distinguish, since I'll have to supply that bit. Also tell me what'll predictably go wrong the first time; my guess is someone will insist they were never less certain, just less willing to bet, and I want to know what to do with that instead of arguing them out of it. No lecture up front, and the terms shouldn't slip until the debrief.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar activity:

  1.  **Analyze the Request:**
      *   **Context:** 14-person upper-level epistemology seminar, 75 minutes.
      *   **Goal:** Students should *feel* pragmatic encroachment before learning the term.
      *   **Core Mechanic:** Private signal (80% reliable) about which of two boxes holds a token.
      *   **Key Action:** Before acting, must check "I know" or "I don't know."
      *   **Variable:** Stakes change (personal point loss, teammate loss, team loss, embarrassment).
      *   **Phase 2:** Split room judging a vignette (Low Stakes vs. High Stakes character).
      *   **Debrief:** Map to Pragmatic Encroachment vs. Contextualism vs. Invariantism (specifically acknowledging limitations).
      *   **Constraints:** No lecture up front, terms only in debrief, no real money needed for payoffs.
      *   **Specific Request:** Flesh out roles, materials, timeline, payoffs. Predict failure modes (especially the "I'm just less willing to bet" objection) and how to handle them.

  2.  **Deconstruct the Activity Design:**
      *   *Name:* Needs to be neutral. "The Box Game" or "Signal & Stakes." Let's go with "The Token Protocol."
      *   *Materials:* Needs to be low-tech but credible. Envelopes, slips of paper, a scoreboard.
      *   *Timeline:* 75 mins total.
          *   Intro/Setup: 10 mins.
          *   Phase 1 (The Experience): 25 mins.
          *   Phase 2 (The Vignette): 15 mins.
          *   Debrief/Discussion: 25 mins.
      *   *Payoffs:* Needs to matter enough to induce anxiety but not ruin friendships. "Seminar Points" (extra credit, choice of reading, bringing snacks) work better than fake money. Let's use a "Seminar Capital" system.
      *   *The Signal:* 80% is good. High enough to feel like knowledge, low enough to induce doubt under pressure.
      *   *The Stakes:* Need a gradient.
          1.  Low: No cost/Minor gain.
          2.  Medium: Personal loss.
          3.  High: Social/Team loss.
          4.  Extreme: Public embarrassment (careful here).

  3.  **Fleshing out Phase 1 (The Experience):**
      *   *Setup:* 14 students. Two boxes (Box A, Box B).
      *   *Signal Generation:* Instructor pre-prepares envelopes. 80% say "Token is in A" (if it is) or "Token is in B" (if it is). Actually, simpler: The token *is* in a specific box for the whole seminar (or per round?). Let's make it per round to keep tension high.
      *   *Correction:* If the token location changes every round, the signal must be generated fresh.
      *   *Better Mechanic:* Instructor flips a coin (or uses a randomizer) to place the token. Then distributes signals. 80% get the truth, 20% get the lie.
      *   *The "Knowledge" Claim:* This is the crux. They must mark a slip: "I Know" or "I'm Guessing."
      *   *The Stakes:*
          *   Round 1 (Trivial): Wrong = nothing. Right = 1 point.
          *   Round 2 (Personal): Wrong = -1 point. Right = 1 point.
          *   Round 3 (Social/Team): Wrong = Whole group loses 5 points. Right = Whole group gains 5 points.
          *   Round 4 (Embarrassment): Wrong = Must sing a song/admit error publicly. (Maybe too much? Let's stick to "Seminar Capital" like choosing the next reading topic). Let's make Round 3 the "Team Sabotage" round.
      *   *Refinement:* To make the "I Know" check meaningful, the payout should depend on *both* the box choice AND the knowledge claim. Actually, the prompt says: "Before they're allowed to act... tick one box." So the knowledge claim is a precondition or a parallel track. Let's make it a parallel track. They claim knowledge, then they bet.
      *   *Crucial Detail:* The prompt wants them to notice willingness to say "I know" changes. So the "I Know" tick needs to be recorded and displayed later.

  4.  **Fleshing out Phase 2 (The Vignette):**
      *   Split room: Group L (Low Stakes) and Group H (High Stakes).
      *   Vignette: "Alex" has the same 80% signal.
      *   Task: "Does Alex *know* where the token is?"
      *   Comparison: Do Group H attribute knowledge less often than Group L?

  5.  **Fleshing out the Debrief:**
      *   Connect Phase 1 (Self) to Phase 2 (Other).
      *   Introduce Terms: Pragmatic Encroachment (Stakes affect knowledge), Contextualism (Stakes affect the meaning of 'knows'), Invariantism (Stakes affect assertion/action, not knowledge).
      *   Address the "Betting vs. Knowing" objection (The Invariantist move).

  6.  **Addressing Failure Modes:**
      *   *Objection:* "I still knew, I just didn't want to risk it."
      *   *Response:* Don't argue. Validate. This *is* the Invariantist position. Use it to drive the debate.
      *   *Logistics:* Students might collude. Signals might leak. Keep signals private.
      *   *Emotional:* High stakes might cause actual distress. Keep "stakes" within the seminar economy.

  7.  **Drafting the Plan (Iterative refinement):**
      *   *Time Check:* 75 mins is tight. Keep instructions crisp.
      *   *Materials:* Printed slips, envelopes, whiteboard for scores.
      *   *Payoff:* "Seminar Credits." Redeemable for: Drop lowest quiz, Choose a reading, Bring snacks to class.
      *   *The "Knowledge" Slip:* Needs to be anonymous initially? No, they need to see their own shift. Let's make it a personal log they keep, then aggregate at the end.
      *   *Wait, one nuance:* If they tick "I don't know," can they still pick a box? The prompt says "Before they're allowed to act... tick one box." Implication: The tick is mandatory, but does it gate the action? Let's say it doesn't gate the action, but it records their epistemic confidence. Actually, to feel the encroachment, the tension must be between "I have enough info" and "Is this enough *given the cost*?"
      *   *Revised Mechanic:* They get the signal. They must decide: (1) Claim Knowledge? (Yes/No). (2) Pick a Box (A/B). If they pick the wrong box, the stake applies. The "Claim Knowledge" is the data point for the debrief.

  8.  **Refining the "Stakes":**
      *   Round 1: Coffee. (Wrong = No coffee. Right = Coffee).
      *   Round 2: Personal Credit. (Wrong = -1 Credit).
      *   Round 3: Altruistic Credit. (Wrong = Random classmate loses 1 Credit).
      *   Round 4: Public Cost. (Wrong = You have to present the summary next week).
      *   *Wait, 4 rounds might be too long.* Let's do 3 rounds. Trivial, Personal, Social.

  9.  **Handling the "Invariantist" Objection:**
      *   This is the most important pedagogical moment. If a student says "My knowledge didn't change, only my caution," the instructor should say "Excellent. You just articulated the Invariantist defense. Let's write that on the board." This validates the student while advancing the lesson.

  10. **Final Review against Constraints:**
      *   14 students? Yes.
      *   75 mins? Yes.
      *   No real money? Yes (Seminar Credits).
      *   Terms only in debrief? Yes.
      *   Predict failure modes? Yes.

  11. **Writing the Output:** Structure it clearly: Overview, Materials, Timeline, Phase 1, Phase 2, Debrief, Troubleshooting. (Self-Correction: Ensure the signal generation is clear. Instructor needs to pre-make envelopes to save time).

  *(Self-Correction during drafting)*: Make sure the "Knowledge" claim feels distinct from the "Action." If I say "I don't know" but pick Box A, does that count? Yes. The tension is: "I have an 80% signal. In Round 1, I say 'I Know.' In Round 3, I say 'I Don't Know.' But the signal is identical." That's the phenomenological hook.

  *(Refining the Vignette)*: Make sure the vignette matches the *exact* epistemic position they were in (80% signal), only the stakes change for the character.

  *(Refining the Debrief)*: Be explicit about the three theories.
  1. Pragmatic Encroachment: Stakes change the *status* of knowledge.
  2. Contextualism: Stakes change the *standard* for the word "know."
  3. Invariantism: Stakes change *action/assertion*, not knowledge.
  Acknowledge the activity supports 1 & 2 phenomenologically, but logically allows 3.

  Let's assemble the document.cw
answer: |-
  Here is a fully fleshed-out lesson plan designed for a 75-minute upper-level seminar. It prioritizes the phenomenological experience (feeling the shift) before introducing the theoretical vocabulary.

  # Activity Title: The Token Protocol

  **Class Size:** 14 Students
  **Time:** 75 Minutes
  **Goal:** To induce a shift in knowledge attribution based solely on practical stakes, setting the stage for Pragmatic Encroachment.

  ## I. Materials & Prep
  1.  **Signal Envelopes (14 per round × 3 rounds = 42 total):**
      *   For each round, decide secretly where the token is (Box A or Box B).
      *   Prepare 14 slips of paper. 11 slips say "Token is in [Correct Box]" (80%). 3 slips say "Token is in [Wrong Box]" (20%).
      *   Seal them in identical envelopes. Label them only by Round (1, 2, 3).
  2.  **Response Cards (14 per student):**
      *   A simple half-sheet with three sections (one for each round).
      *   Each section has two checkboxes: `[ ] I KNOW` / `[ ] I'M UNSURE`.
      *   Below that: `[ ] BOX A` / `[ ] BOX B`.
  3.  **The "Stakes" Board:**
      *   Whiteboard space divided into three columns (Round 1, 2, 3).
      *   List the "Cost of Error" for each round clearly before the round starts.
  4.  **Currency:**
      *   "Seminar Credits" (SC). Write these on the board next to student names.
      *   **Payoff Menu:** 5 SC = Choose next week's reading; 10 SC = Drop lowest participation grade; 20 SC = Instructor brings donuts/coffee next class. (Ensure the "Cost of Error" is significant relative to these rewards).

  ## II. Timeline

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | 00-10 | **Setup** | Distribute cards/envelopes. Explain rules. **No theory yet.** |
  | 10-35 | **Phase 1** | **The Token Protocol.** 3 Rounds of varying stakes. |
  | 35-50 | **Phase 2** | **The Vignette Split.** Half judge Low Stakes, half judge High Stakes. |
  | 50-75 | **Debrief** | **Theory Mapping.** Introduce terms. Discuss the "Betting vs. Knowing" objection. |

  ---

  ## III. Phase 1: The Token Protocol (25 mins)

  **Instructions (Read Aloud):**
  > "In front of you are three envelopes, labeled 1, 2, and 3. Do not open them yet. Inside each is a signal about where a token is hidden: Box A or Box B. The signal is generated by a process that is 80% accurate. You will not know if you received the accurate signal or the noisy one.
  >
  > In each round, you will open the envelope, read the signal, and fill out the corresponding section on your Response Card. You must check either 'I Know' or 'I'm Unsure.' Then you must pick a Box.
  >
  > If you pick the correct box, you gain Seminar Credits. If you pick the wrong box, the penalty depends on the round, listed on the board. Your 'I Know' check does not change your points, but I will collect it to analyze our group epistemology later."

  **The Rounds:**

  *   **Round 1 (Trivial Stakes):**
      *   *Board:* **Correct:** +1 SC. **Incorrect:** 0 SC (No penalty).
      *   *Action:* Open Envelope 1. Record signal. Check Know/Unsure. Pick Box.
      *   *Reveal:* Announce correct box. Update scores.
  *   **Round 2 (Personal Stakes):**
      *   *Board:* **Correct:** +2 SC. **Incorrect:** -5 SC (Significant personal loss).
      *   *Action:* Open Envelope 2. Record signal. Check Know/Unsure. Pick Box.
      *   *Reveal:* Announce correct box. Update scores.
  *   **Round 3 (Social/Altruistic Stakes):**
      *   *Board:* **Correct:** +5 SC for *everyone*. **Incorrect:** -5 SC for *everyone* (You sabotage the class).
      *   *Action:* Open Envelope 3. Record signal. Check Know/Unsure. Pick Box.
      *   *Reveal:* Announce correct box. Update scores.

  **Instructor Note:** Keep the pace brisk. Do not comment on their choices. Just administer the stakes.

  ---

  ## IV. Phase 2: The Vignette Split (15 mins)

  **Instructions:**
  > "Put your Response Cards away. I am going to split the room. Left side (7 students), you are Group L. Right side (7 students), you are Group H. You will not speak to each other until I say so."

  **The Vignette (Handout or Projected):**
  > "Alex receives a signal from a machine that is 80% reliable. The signal says the token is in Box A. Alex needs to decide where the token is."

  *   **Group L (Low Stakes) Prompt:**
      > "If Alex guesses wrong, nothing happens. If Alex guesses right, Alex gets a small candy.
      > **Question:** Does Alex **know** the token is in Box A? (Yes/No)"
  *   **Group H (High Stakes) Prompt:**
      > "If Alex guesses wrong, Alex's best friend loses their job. If Alex guesses right, the friend keeps the job.
      > **Question:** Does Alex **know** the token is in Box A? (Yes/No)"

  **Comparison:**
  1.  Ask Group L to raise hands if they answered "Yes." Count aloud.
  2.  Ask Group H to raise hands if they answered "Yes." Count aloud.
  3.  Ask one student from each side to briefly justify *why* without using technical terms.

  ---

  ## V. The Debrief (25 mins)

  This is where you introduce the vocabulary. Draw a triangle on the board with the three points: **Evidence**, **Stakes**, **Knowledge**.

  **1. The Phenomenological Hook (5 mins)**
  *   Ask students to look at their Phase 1 Response Cards.
  *   "Look at your signal reliability. It was 80% in Round 1, 80% in Round 2, 80% in Round 3. Did your evidence change?" (No).
  *   "Did your willingness to check 'I Know' change?" (Likely Yes).
  *   "Look at Phase 2. Did the group attribute knowledge differently based on stakes?"

  **2. Mapping the Theories (15 mins)**
  Introduce the three positions as explanations for what just happened.

  *   **Pragmatic Encroachment:**
      *   *Claim:* Knowledge *itself* depends on stakes.
      *   *Fit:* "In Round 1, you knew. In Round 3, you didn't. The practical cost changed the epistemic status."
      *   *Board:* Stakes $\rightarrow$ Knowledge Status.
  *   **Contextualism:**
      *   *Claim:* The *word* 'knows' changes meaning based on the context of the attributor (or the subject).
      *   *Fit:* "In the Low Stakes context, 'knows' means '80% sure.' In the High Stakes context, 'knows' means '99% sure.' You didn't lose knowledge; the standard for the word went up."
      *   *Board:* Stakes $\rightarrow$ Meaning of 'Knows'.
  *   **Strict Invariantism (The "Boring" Line):**
      *   *Claim:* Knowledge is purely evidence-based. Stakes affect *action* and *assertion*, not knowledge.
      *   *Fit:* "You knew in all three rounds. But in Round 3, it wasn't *rational to act* on that knowledge. You confused 'I know' with 'I'm willing to bet.'"
      *   *Board:* Stakes $\rightarrow$ Rational Action (Knowledge stays same).

  **3. The Limitation (5 mins)**
  *   Be honest: "This activity cannot distinguish between Encroachment and Contextualism easily, because both predict you checked 'I Don't Know' in Round 3. It also cannot rule out Invariantism, because I couldn't see into your minds to see if you *really* lost knowledge or just got cautious."

  ---

  ## VI. Troubleshooting & Failure Modes

  **1. The "I Was Never Less Certain" Objection (The Invariantist Move)**
  *   **Prediction:** A student will say: "I checked 'I'm Unsure' in Round 3 not because I didn't *know*, but because I wasn't willing to risk the class's points. My epistemic state didn't change."
  *   **Response:** **Do not argue.** Validate immediately.
      *   *Say:* "This is the most important objection. You have just articulated **Strict Invariantism**. You are claiming that 'Knowledge' is a purely evidence-based state, and what changed was your *willingness to assert* or *act*. If we accept your view, then Pragmatic Encroachment is false. Let's write your argument on the board as the primary counter-argument we need to address next week."
      *   *Why:* This turns a potential derailment into the core philosophical tension. It shows the activity *elicited* the debate, even if it didn't settle it.

  **2. Signal Leakage**
  *   **Prediction:** Students compare signals between rounds ("I got 'Box A' both times").
  *   **Prevention:** Emphasize in the intro: "The token location is randomized fresh every round. Your neighbor's signal is irrelevant."
  *   **Fix:** If it happens, acknowledge it but note that the *stakes* were the only variable intended to change.

  **3. The "Gamey" Response**
  *   **Prediction:** Students treat it purely as a betting game and ignore the "I Know" checkbox, treating it as "I'm willing to bet."
  *   **Prevention:** In the instructions, separate the two actions. "The checkbox records your *epistemic state*. The Box selection records your *action*."
  *   **Fix:** In the debrief, ask: "If 'I Know' just meant 'I'm willing to bet,' why did we have two separate boxes on the card?" This highlights the intuitive distinction between knowledge and action that the students naturally feel.

  **4. Emotional Distress (High Stakes)**
  *   **Prediction:** A student feels genuine anxiety about sabotaging the class in Round 3.
  *   **Prevention:** Keep the "Seminar Credits" fun, not grade-critical. Ensure the "Sabotage" penalty is reversible or mitigated (e.g., "If the class loses points, I will run a bonus round to earn them back").
  *   **Fix:** If a student looks stressed, pause and remind them: "This is a simulation. The points are for donuts and reading choices, not your GPA."

  ## VII. Instructor Script Snippet (For the Transition to Debrief)

  > "Take a look at your card. In Round 1, the signal was 80% reliable. In Round 3, the signal was 80% reliable. The only thing that changed was what happened if you were wrong.
  >
  > If I asked you in Round 1, 'Do you know where the token is?' many of you said Yes. In Round 3, many of you said No.
  >
  > Did you *lose* knowledge between Round 1 and Round 3? Or did the word 'know' change its meaning? Or did you keep the knowledge but lose the right to act on it?
  >
  > For the rest of class, we are going to put names to these three intuitions you just had."
