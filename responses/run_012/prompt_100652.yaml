answer: |-
  **Essay Question**

  Consider the following case: Dr. Elara Vance, a renowned physicist and pacifist, died last year. A filmmaker releases *The Quiet Atom*, a dramatization of her life. The film depicts Vance having a clandestine romance with a rival scientist and delivering a public speech endorsing nationalist defense policies—positions she historically opposed and a relationship that never existed. Vance's granddaughter protests the distortion of her grandmother's legacy. A historian protests the misinformation. The filmmaker replies: "This is art, not biography. The dead cannot be defamed because they no longer exist to be harmed. Our only obligations are to the living audience."

  Using the **Two-Ledger View**, assess the filmmaker's reply. Specifically, analyze whether the Second Ledger (obligations to the dead as subjects) is irreducible to the First Ledger (obligations to the living). Incorporate the concept of the **Narrative Remainder** to explain what is at stake if the Second Ledger is collapsed. What would have to be true about the nature of posthumous wrongs for the filmmaker's reply to succeed? Distinguish clearly between harms to the living and wrongs to the dead.

  ***

  **Model Answer**

  The filmmaker's reply relies on a reductionist claim: that because the dead cannot experience harm, no obligation is owed to them directly. This collapses the Second Ledger into the First, treating the dead merely as raw material whose manipulation is regulated only by its impact on the living. To assess this, we must determine if the Second Ledger is irreducible. I argue that it is irreducible because a life possesses a narrative integrity that survives the cessation of experience, and violating this constitutes a wrong distinct from harming living interests.

  The filmmaker's claim rests on the "No Subject" objection: wrongs require a subject who can be made worse off. Since Vance cannot feel humiliation or distress, she cannot be harmed. However, this conflates experiential harm with narrative violation. Obligations to the dead are not grounded in their capacity to suffer, but in their status as authors of a completed life. When we dramatize a real life, we enter a narrative trust. We promise to engage with the subject's agency as it was lived, not merely as it serves our plot. Violating this trust does not make Vance "worse off" in a hedonic sense, but it treats her existence as instrumental rather than intrinsic.

  This is where the Narrative Remainder becomes crucial. If we collapse the Second Ledger into the First, we acknowledge only the distress of the granddaughter (Ledger 1). But there is a residue of Vance's life that remains even if the granddaughter were indifferent. This residue is the Narrative Remainder. The filmmaker must argue that this remainder is purely aesthetic—a loose fitting of facts to theme. However, because the film alters Vance's moral agency (changing her from pacifist to nationalist), the Remainder is moral, not aesthetic. It distorts the truth of her moral identity.

  For the filmmaker's reply to succeed, two things would have to be true. First, it would have to be true that counterfactual damage to a person's interests is the only metric for wrongs. If wrongs can exist as violations of narrative trust independent of experiential harm, the filmmaker fails. Second, it would have to be true that the Narrative Remainder is merely aesthetic. If the residue of a life includes moral claims to truthfulness about one's agency, then altering core political and personal commitments is a violation of the Second Ledger.

  Therefore, the filmmaker is mistaken. The inability to experience humiliation does not settle the question because posthumous wrongs are not about experience; they are about the integrity of the life-story as a moral object. We owe the dead fidelity to the shape of their agency. To deny this is to claim that death converts persons into property. The First Ledger accounts for the granddaughter's grief and the audience's misinformation. The Second Ledger accounts for Vance herself. Since the film violates the narrative trust owed to Vance's moral identity, the Second Ledger cannot be collapsed. The wrong exists even if no living person objected. The Narrative Remainder is moral, and it demands that we treat the dead as subjects who cannot be rewritten without remainder.

  ***

  **Marking Scheme (25 Marks)**

  | Point | Criteria & Marks | Typical Error (B-grade or below) |
  | :--- | :--- | :--- |
  | **1. Two-Ledger Application** | **5 marks:** Clearly distinguishes Ledger 1 (living interests) from Ledger 2 (dead as subjects) and argues for the irreducibility of Ledger 2. | Conflates the two ledgers by arguing obligations to the dead are *only* metaphors for obligations to the living. |
  | **2. The "No Subject" Objection** | **5 marks:** Explains why the dead's inability to experience humiliation does not settle the question (distinguishes experiential harm from normative wrong). | Accepts the filmmaker's premise that no experience means no wrong, failing to challenge the definition of harm. |
  | **3. Narrative Remainder** | **5 marks:** Correctly defines the Remainder as the residue surviving Ledger collapse and identifies it as moral (not merely aesthetic) in this case. | Treats the Remainder as purely artistic license or fails to distinguish between moral and aesthetic residue. |
  | **4. Conditions for Success** | **5 marks:** Identifies the difference between counterfactual damage to interests and violation of narrative trust; states what a posthumous wrong must be (violation of integrity). | Focuses only on legal defamation or emotional distress to relatives rather than narrative trust/integrity. |
  | **5. Argumentative Stand** | **5 marks:** Takes a decisive position on the filmmaker's claim rather than summarizing both sides; maintains coherence throughout. | Hedges excessively or concludes that "both sides have valid points" without resolving the philosophical tension. |
