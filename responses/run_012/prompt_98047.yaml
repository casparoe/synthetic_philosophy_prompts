answer: |-
  **Charter (Handout)**
  **Mission:** Classify Mars samples. **Consequence:** "Living" = Protected Quarantine. "Inert" = Sterilized. "Dormant" = Protected Monitoring.
  **Criteria for LIVING (ALL must apply):**
  1. **Boundary:** Possesses a physical membrane or skin separating inside from outside.
  2. **Metabolism:** Consumes energy to maintain internal state (homeostasis).
  3. **Evolution:** Capable of Darwinian evolution (heritable variation + selection).
  4. **Activity:** Currently engaged in biological processes (not frozen/dormant).

  **Specimen Cards (Features Pre-Printed)**
  1.  **Lichen:** Boundary (Yes), Metabolism (Yes), Evolution (Yes), Activity (Yes).
  2.  **Virus:** Boundary (Yes), Metabolism (No), Evolution (Yes), Activity (No, needs host).
  3.  **Bacterial Spore:** Boundary (Yes), Metabolism (No), Evolution (Yes), Activity (No, dormant).
  4.  **Clay Crystal:** Boundary (Yes), Metabolism (No), Evolution (Yes, structural replication), Activity (Yes).
  5.  **Synthetic Protocell:** Boundary (Yes), Metabolism (Yes), Evolution (No, no mutation), Activity (Yes).
  6.  **Fire:** Boundary (No), Metabolism (Yes, consumes fuel), Evolution (No), Activity (Yes).
  7.  **Computer Simulation:** Boundary (No, virtual), Metabolism (Yes, virtual), Evolution (Yes), Activity (Yes).

  **Ambush Card (Handed out at min 20)**
  **Sterile Mule Embryo:** Boundary (Yes), Metabolism (Yes), Evolution (No, genetically sterile), Activity (Yes).

  **Minute-by-Minute Plan**
  *   **0–5:** Form groups of three. Distribute Charter + 7 Specimen Cards. Explain stakes (Sterilize vs. Protect).
  *   **5–20:** Groups sort cards into bins. Must write a one-sentence justification for any contentious card based *strictly* on Charter criteria.
  *   **20–25:** **Ambush.** Distribute Mule Card. If their Charter classifies it as "Inert" (due to no Evolution), they must choose: Sterilize the mammal or Rewrite the Charter. If they rewrite, they must note which criterion they sacrificed.
  *   **25–40:** Groups share verdicts. Instructor tallies conflicts on board (e.g., "Who put Virus in Living?").
  *   **40–50:** Debrief (see below).

  **Debrief Guide**
  Do not use philosophical jargon until the end. Map their struggles to positions:
  *   **The Virus/Spore Stickiness:** When they argued whether dormant counts as alive, they were debating **dispositional properties** vs. **current state**.
  *   **The Mule Crisis:** When they had to rewrite the Charter to save the Mule, they abandoned **necessary-and-sufficient conditions** (Essentialism).
  *   **The "It Depends" Defense:** If groups said "It's alive for some purposes but not others," they stumbled onto **cluster concepts** or **family resemblance** (Wittgenstein).
  *   **The "Just Decide" Vote:** If they voted based on safety rather than truth, they adopted a **pragmatic/deflationary** view (Life is a tool, not a fact).
  *   **Closing:** Reveal the terms. Explain that biology often uses cluster concepts because nature doesn't respect our binary bins.

  **Predictable Problems & Fixes**
  *   **Science Pedantry:** Students will argue card facts (e.g., "Viruses *do* metabolize!"). **Fix:** "Trust the card. The philosophy is in the classification, not the biology."
  *   **Charter Loopholes:** Groups will interpret "Evolution" loosely to save the Mule. **Fix:** Circulate and enforce strict reading during the sorting phase.
  *   **Time Creep:** Sorting takes too long. **Fix:** At min 18, announce "Two minutes remaining. Lock in your verdicts."
  *   **Dominant Voices:** One student decides for the group. **Fix:** Require signatures from all three on the justification sheet.

  **Limitations**
  This activity stages the pull toward a sharp line and the cost of drawing it, but it cannot reproduce the question of whether there is a fact of the matter about viruses. The game forces a decision for bureaucratic safety, implying the definition is purely pragmatic. It struggles to convey ontological realism—the idea that life might be a natural kind existing independently of human categorization. Students leave knowing definitions are hard, but not necessarily that nature itself might be vague. They learn about the *map*, not the *territory*.
