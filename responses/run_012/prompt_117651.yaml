      *   Limits/Category Mistake? (Yes, power/antisemitism section).
      *   Final Philosophical Contribution? (Yes, conclusion).

  6.  (Mental Note): Ensure the distinction between "Misfire" (void) and "Abuse" (insincere) is clear in the context of the conversion. Austin says abuse still *happens*. The play shows the horror of that—being forced into a sincere act that is technically felicitous but morally void.

  7.  (Final Polish): Check the flow. Ensure the transition from Trial to Act 5 feels organic (both are about the management of promises and authority).

  *(Self-Correction)*: Wait, the prompt asks specifically about whether felicity is a property at the moment of utterance or a social achievement later. I need to make sure this binary is the spine of the essay.

  *(Refining the "Category Mistake" point)*: The tutor's hesitation likely stems from the fact that Law and Language are different institutions. I need to argue that *Merchant* conflates them intentionally to show they rely on the same mechanism (authoritative speech).

