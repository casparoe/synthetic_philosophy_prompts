      *   *Developing the "Elara on the Bus" Case:*
          *   **Subject:** Elara.
          *   **Setting:** Daily commute on a city bus.
          *   **Belief:** "This model of bus engine has a distinct rhythmic stutter when idling."
          *   **Source:** Her uncle, a retired mechanic, told her this casually last week. (Unjustified ground: Uncle was guessing/generalizing, but she trusts him).
          *   **Experience:** When the bus stops at a light, she hears a *thump-thump... thump-thump* in the engine noise.
          *   **Phenomenal Character:** The sound *sounds* discontinuous/rhythmic to her, not just continuous drone interpreted as rhythmic.
          *   **Diagnostic:** She taps her finger on the seat rail in time with the thumps. Later, she records the audio. On playback, the sound is a smooth drone. She is genuinely surprised. (Shows it wasn't just judgment; the phenomenal character was different).
