  6.  **Writing the Response:** (Focusing on tone: academic, precise, adhering strictly to the prompt's structural requirements). *Self-Correction during drafting:* Make sure I don't accidentally imply she *should* have doubted the uncle. The prompt says "grounds should be visibly bad — while the subject is not at fault." This means *objective* grounds are bad, *subjective* position is blameless. I need to make sure the text reflects that distinction clearly.

