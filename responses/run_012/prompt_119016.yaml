  3.  **Drafting the Analysis:**

      *   **The Philosophical Conflict:**
          *   **Dogmatism (Pryor/Pollock):** Experience as of $P$ justifies belief that $P$ immediately. If it *sounds* like a stutter, she is justified in believing there is a stutter.
          *   **Etiological View (Siegel/Justification Internalism):** If the experience is tainted by unjustified belief, it loses justificatory power.
      *   **Verdicts:**
