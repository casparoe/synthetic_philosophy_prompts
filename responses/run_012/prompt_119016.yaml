          *   *Idea:* Belief about a surface being sticky vs. dry.
          *   *Constraint Check:* Needs to be auditory or tactile. Let's go **Auditory**. It's often easier to distinguish from attention than touch (where pressure varies).
          *   *Scenario:* A librarian (or similar quiet environment).
