      *   **Strongest Attack on Dogmatist:** "It's not penetration, it's judgment." (The "Spill-over" objection).
          *   *Reply/Gap Closing:* Need to strengthen the diagnostic. The surprise at the recording isn't enough. Need a *sensory discrimination task*. E.g., She is asked to distinguish two sounds. She fails in a way consistent with the penetration, not consistent with mere bias. Or, the surprise is visceral (startle response). Let's stick with the recording surprise but emphasize the *phenomenal shock*—the sound *changes* on playback, not just her opinion of it.
