          4.  *Exclusions:* Not attention, not memory color, not perceptual learning. (Must state what is held fixed to rule these out).
          5.  *Modality:* Audition or Touch (No vision/color/size).
          6.  *Belief Status:* Unjustified (bad grounds), but subject is not at fault (trusted source/early absorption) and unaware of the influence.
          7.  *Goal:* Show the resulting perceptual belief is *unjustified*.
          8.  *Analysis:* Contrast Dogmatism (Experiential Justification is immediate) vs. Etiological views (Justification depends on history). Verdicts must diverge.
          9.  *Key Feature:* Identify the single feature driving the disagreement. Show what happens if removed.
          10. *Collapse Checks:* Must not be a defeater case (subject has no reason to distrust). Must not be a well-founded belief case.
          11. *Objection/Reply:* Strongest attack on the losing side (likely Dogmatism), specifically the "It's judgment, not experience" or "It's a defeater" objection. How to close that gap.
          12. *Format:* No citations/reading list. Just case and reasoning.

  2.  **Drafting the Case (Iterative Process):**

