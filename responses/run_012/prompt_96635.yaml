prompt: |-
  ok so for philosophy club I got assigned to present on whether dreams are experiences, and I found this explainer online (I think it was on one of those big ideas blogs, or maybe it was a handout my teacher photocopied, not totally sure) and I want to know if I can trust it before I stand up and say it in front of everyone. Here's basically what it says:

  Malcolm argued that dreams are not experiences that happen during sleep. His main point was that the only evidence you ever have that you dreamed is the impression you have when you wake up, and since a person can't sensibly say they're asleep, there's no such thing as a mental event going on during sleep that you later remember. So dreams don't really exist as experiences -- talking about dreams is just talking about waking memories. Dennett later responded that this is a question for science, not philosophy, and he proposed the cassette theory: dreams are like tapes that get inserted into your memory at the moment you wake up, so the whole dream gets put together on waking and was never actually experienced. Dennett thought this confirmed Malcolm's conclusion that dreams aren't experiences, and the upshot is that dreams are basically false memories your brain writes when you wake up.

  Is this fair? I dont know this stuff at all really. My gut says something is off, because if Dennett agreed with Malcolm then why is it even called a debate, but I could be totally wrong about that. Can you go claim by claim and tell me whats accurate, whats a simplification, and whats just wrong? Also does the last bit -- that dreams are basically false memories -- actually follow from anything either of them argued? And if the explainer is wrong about Dennett, what was the cassette thing actually supposed to show? I have to present in two days so I'd rather know now.
