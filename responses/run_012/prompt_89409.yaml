answer: |-
  # The Lusitania Tribunal: A Causal Inquest Game

  **Time:** 90 Minutes
  **Players:** 14 Adults (Mixed History/Writing background)
  **Goal:** Experiential understanding of causal overdetermination, preemption, and double prevention.
  **Materials:** 14 Sealed Envelopes (Role Cards), a whiteboard, a timer, and a "Verdict Sheet" for each player.

  ---

  ## Part 1: Setup (0:00 – 0:10)

  **The Hook:**
  Do not explain causality. Do not explain the rules of metaphysics. Walk in and say:
  *"On May 7, 1915, the RMS Lusitania sank. 1,198 people died. History asks: 'Why?' Tonight, this room is a Tribunal. Your job is not to find the truth—you have the truth on your cards. Your job is to assign **Responsibility**. There can be only one Primary Cause. If you choose two, the Tribunal fails. If you choose none, the Tribunal fails."*

  **The Distribution:**
  Hand out the 14 envelopes. Tell them:
  1.  **Card Truth:** The text on your card is the absolute truth for this simulation, regardless of what you know from outside history.
  2.  **Secrecy:** Do not show your card. You may quote it, but do not pass it.
  3.  **The Hidden Variable:** On the back of my Master Sheet is the *Metaphysical Status* of your factor. You do not know it. You will vote before you learn it.

  **The Roles (14 Cards):**
  *Print these on cards. Keep the "Status" hidden from players.*

  1.  **The U-Boat Commander:** "I fired the torpedo that struck the starboard bow." *(Status: **Sufficient Cause A**)*
  2.  **The Coal Dust:** "I was suspended in the empty fuel bunker, dry and volatile." *(Status: **Sufficient Cause B**)*
  3.  **The Torpedo Mechanism:** "I detonated on impact with 500lbs of explosive." *(Status: **Part of Sufficient A** – pairs with Card 1)*
  4.  **The Second Torpedo:** "I was loaded in the tube, ready to fire if the first missed." *(Status: **Preempted Cause**)*
  5.  **The Admiralty Order:** "I withdrew the escort destroyer that was meant to protect this ship." *(Status: **Double Preventer**)*
  6.  **The Escort Destroyer:** "I was ready to hunt the U-Boat, but I received orders to leave." *(Status: **Prevented Blocker**)*
  7.  **Captain Turner:** "I slowed the ship to 18 knots to save fuel." *(Status: **Probability Raiser**)*
  8.  **The Wireless Operator:** "I received a warning of U-Boats nearby but delivered it late." *(Status: **Probability Raiser**)*
  9.  **The Passenger Manifest:** "I listed high-value munitions in the cargo hold." *(Status: **Probability Raiser**)*
  10. **The German Embassy:** "I placed a newspaper warning travelers of the war zone." *(Status: **Probability Raiser**)*
  11. **The Captain's Pocket Watch:** "I was five minutes fast, causing the Captain to adjust his timing." *(Status: **Screened-Off**)*
  12. **The Lookout:** "I spotted the periscope but had no gun to signal." *(Status: **Probability Raiser**)*
  13. **The Weather:** "I was clear and calm, allowing perfect visibility for the U-Boat." *(Status: **Background Condition**)*
  14. **The Hull Design:** "I was single-skinned, making me vulnerable to breach." *(Status: **Background Condition**)*

  *(Note for Instructor: Cards 1 & 3 together form one sufficient chain. Card 2 is a separate sufficient chain [Overdetermination]. Card 4 would have been sufficient but was stopped by the success of Card 1 [Preemption]. Card 5 stopped Card 6 from stopping Card 1 [Double Prevention]. Card 11 correlates with timing but had no actual causal power once the other factors were in play [Screening Off].)*

  ---

  ## Part 2: The Inquest (0:10 – 0:40)

  **Phase 1: Opening Statements (15 mins)**
  Go around the room. Each player has 45 seconds to state their case for why *they* are the Primary Cause.
  *Rule:* You must argue that without you, the event does not happen *in the way it did*.

  **Phase 2: Free Debate (15 mins)**
  Open floor. Players can challenge each other.
  *Prompt for Instructor:* If it gets quiet, ask: "If we remove the Captain, does the ship still sink? If we remove the Torpedo, does it still sink?"
  *Watch for:* The player with the **Admiralty Order** (Double Preventer) will argue strongly ("Without me, the Escort stays!"). The player with the **Coal Dust** will argue ("The torpedo alone wouldn't have sunk her that fast!"). The **Pocket Watch** player will try to ride the coattails of the Captain.

  ---

  ## Part 3: The Vote (0:40 – 0:50)

  Hand out the Verdict Sheets.
  **The Constraint:** "You must select exactly **ONE** card number as the Primary Cause. You cannot select 'Multiple.' You cannot select 'None.'"

  Collect the votes. Tally them publicly on the whiteboard.
  *Likely Outcome:* The vote will split heavily between **The U-Boat Commander**, **The Coal Dust**, and **The Admiralty Order**.
  *The Itch:* There will be no consensus. The History Buffs will argue physics; the Writers will argue agency. The vote will feel unsatisfying.

  ---

  ## Part 4: The Reveal & The Wall (0:50 – 1:00)

  Do not congratulate the winners.
  Reveal the **Master Key** (the Statuses listed above).

  **Read the critical reveals aloud:**
  1.  **To the U-Boat/Coal Dust voters:** "You have a tie. Both factors were *Sufficient*. The ship sinks if the Torpedo hits. The ship *also* sinks if the Coal Dust ignites from the shock. Both happened. This is **Overdetermination**. Picking one is physically arbitrary."
  2.  **To the Second Torpedo voter:** "You were ready. You were sufficient. But the first torpedo hit. You were **Preempted**. You are causally inert, even though you were 'ready to kill.'"
  3.  **To the Admiralty Order voter:** "You didn't sink the ship. You stopped the Escort from saving it. This is **Double Prevention**. You caused the sinking by *preventing a prevention*."
  4.  **To the Pocket Watch voter:** "You are the tragedy. You correlated with the Captain's timing, but the timing didn't change the outcome given the other factors. You were **Screened Off**. You are statistically relevant, but causally empty."

  **The Moment:** Let the silence sit. They just voted on a logic puzzle they couldn't solve because the question ("Which *one*?") was flawed.

  ---

  ## Part 5: The Debrief (1:00 – 1:30)

  **1. Map the Metaphysics (15 mins)**
  Draw three diagrams on the board. Ask them to identify which cards fit where.

  *   **Diagram A (Overdetermination):** Two arrows hitting the Event. (Torpedo + Coal).
      *   *Lesson:* In history, "The Cause" is often a plural set. In fiction, we often prune this to make a clean narrative.
  *   **Diagram B (Preemption):** One arrow hits; a second arrow is blocked. (First Torpedo vs. Second Torpedo).
      *   *Lesson:* Counterfactuals fail here. "If the first torpedo missed, the second would have fired." True. But the second didn't fire. Is the second a cause? No.
  *   **Diagram C (Double Prevention):** A blocks B, where B blocks C. (Admiralty blocks Escort, where Escort blocks U-Boat).
      *   *Lesson:* Omissions can be causes. This is where historians and lawyers fight most violently.

  **2. The Novelist's Dilemma (10 mins)**
  Ask the writers: "If you were writing this scene, which factor would you pick?"
  *   *Discussion:* Writers *must* choose one to maintain narrative focus (focalization). History *must* acknowledge the multiplicity to maintain truth.
  *   *The Takeaway:* Historical fiction is a negotiation between the *metaphysics of history* (messy, overdetermined) and the *metaphysics of story* (linear, agential).

  **3. The Limitation (5 mins)**
  *Be honest about what the game failed to do.*
  "Tonight, the causes were discrete cards. In reality, causes are processes. The 'Torpedo' isn't a card; it's a supply chain, a political decision, a metallurgical formula. This game creates **Token Causation** (this specific event), but it cannot fully simulate **Type Causation** (structural forces). You felt the itch of individual agency vs. structural inevitability, but the game still forced you to pick 'actors.' Real history often has causes with no actors."

  ---

  ## Troubleshooting: What Goes Sideways & How to Rescue It

  **1. The "Actually..." Pedant (History Buffs)**
  *   *The Problem:* A player says, "Actually, the coal dust theory is disputed by modern divers," or "The Admiralty didn't withdraw the escort until..."
  *   *The Rescue:* Interrupt immediately. "In this Tribunal, the Card is God. If your card says you withdrew the escort, you withdrew the escort. We are testing logic, not trivia."
  *   *Prevention:* Put a bold header on the card: **GAME TRUTH.**

  **2. The Dominant Voice**
  *   *The Problem:* One writer or historian hogs the debate, convincing everyone to vote for their card.
  *   *The Rescue:* Use the "Speaking Token." Only the person holding the physical object (a pen, a gavel) may speak. Pass it clockwise. No interruptions.
  *   *During Vote:* Remind them: "You are voting your conscience, not the loudest voice."

  **3. The Vote Ties Perfectly (The "Smart" Room)**
  *   *The Problem:* They vote 7-7 on the two Sufficient Causes and feel satisfied that they "figured it out."
  *   *The Rescue:* You must deny them the victory. "You found the Overdetermination, but you missed the Double Prevention. The Admiralty Order got 0 votes, yet without it, the Escort stops the U-Boat. Why did you ignore the invisible hand?" This forces them to confront *omission* as causation.

  **4. The "Screened Off" Player Feels Cheated**
  *   *The Problem:* The Pocket Watch player realizes they had no power and feels their role was useless.
  *   *The Rescue:* Validate them in the debrief. "You represent the biggest trap in historical fiction: Correlation vs. Causation. You are the red herring that makes a story feel 'real' without actually driving the plot. You are essential for *verisimilitude*, even if you are essential for nothing else."

  **5. Running Out of Time**
  *   *The Problem:* Debate runs long.
  *   *The Rescue:* Cut the Free Debate short. Move to the Vote. The "Itch" of the vote is more important than the debate. The debrief is where the learning happens; do not shorten the debrief. If you must, shorten the Opening Statements to 30 seconds each.

  ---

  ## Instructor's Cheat Sheet (The Metaphysics)

  *   **Overdetermination:** $C_1 \to E$ and $C_2 \to E$. Both occur. Removing one doesn't stop $E$. (Torpedo + Coal).
  *   **Preemption:** $C_1 \to E$. $C_2$ would have $\to E$, but $C_1$ happened first. (1st Torpedo vs. 2nd Torpedo).
  *   **Double Prevention:** $C \to$ prevents (Blocker $\to$ prevents $E$). So $C \to E$. (Admiralty stops Escort from stopping U-Boat).
  *   **Screening Off:** $S$ correlates with $C$, and $C \to E$, but $S$ does not $\to E$. (Watch correlates with Captain, Captain affects timing, but Watch didn't change the outcome).

  **Final Note to You:**
  The goal isn't for them to understand the definitions perfectly. The goal is for them to feel the **frustration** of the vote. That frustration *is* the lesson. When they leave, they should be annoyed that history is messy. That means it worked.
