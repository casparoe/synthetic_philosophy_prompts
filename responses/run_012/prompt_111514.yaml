answer: |-
  This is a sophisticated request. You are asking for an experiential lesson in epistemology and cognitive bias, disguised as an editorial meeting. The goal is not to prove your neighbor wrong (which creates defensiveness) but to demonstrate *how* we decide what is true (which creates insight).

  Here is a complete run-sheet, materials list, and facilitator guide designed for 100 minutes, 14 participants, and no projector.

  # Title: The Evidence Board
  **Concept:** Participants act as editors evaluating historical revisions. They will discover that their standards shift based on authority, and that "mathematical proof" can be manufactured from noise.

  ## 1. Materials & Assembly
  You need to prepare three distinct packets. Print these on different colored paper if possible to help with flow.

  **Packet A: The Standards (14 copies)**
  *   A single half-sheet of paper.
  *   **Text:** "EDITORIAL STANDARDS. Before seeing any submissions, list the 6 rules this magazine uses to decide if a historical claim is trustworthy. (e.g., 'Must have physical evidence'). Write them below. Fold this paper and place it in the envelope provided. Do not open it again until the end."
  *   *Assembly:* Put one sheet and one small envelope per seat.

  **Packet B: The Submissions (3 sets per table)**
  *   **Submission 1 (The Trap):** "The Silent Century." (See text below).
  *   **Submission 2 (The Plausible):** "The Pollen Shift." (A revision based on environmental data, solid method, controversial conclusion).
  *   **Submission 3 (The Consensus):** "The Standard Timeline." (Defends current dating, admits gaps in record).
  *   **The Evidence Table (Insert):** A separate slip of paper containing the "Arithmetic Proof" (See text below). This slip is identical for all three submissions but is only physically attached to Submission 1 initially.
  *   *Assembly:* Create 3 sets of these per table.

  **Packet C: The Method Test (1 per table)**
  *   **Handout:** "Chronicle Match Test." Contains two lists of numbers (King Reigns).
  *   **Tools:** 3 pairs of scissors and 3 glue sticks per table (for the shuffle exercise).

  **Rating Cards (20 copies)**
  *   Small cards with a scale of 1–5 (1 = Reject, 5 = Commission) and a space for "Reason."

  ---

  ## 2. The Texts (For Printing)

  **Submission 1: "The Silent Century"**
  *   **Claim:** The period 614–911 AD was fabricated by later chroniclers to legitimize a dynasty.
  *   **Mainstream Error:** Historians accept copied manuscripts without checking the arithmetic of reign lengths.
  *   **Evidence:** See attached *Evidence Table Alpha*.
  *   **Author:** *Arthur Vane, Independent Researcher. Author of 'The Chronos Deception' and 'The Vatican Cover-Up'.*

  **Submission 2: "The Pollen Shift"**
  *   **Claim:** The Great Famine occurred 40 years earlier than recorded.
  *   **Mainstream Error:** Historians rely on written logs which were back-dated by scribes; they ignore soil cores.
  *   **Evidence:** Soil core samples show a spike in weed pollen (fallow land) corresponding to a volcanic event in 536 AD, not 576 AD.
  *   **Author:** *Dr. Elena Rostova, University of Leeds, Dept. of Environmental History.*

  **Submission 3: "The Standard Timeline"**
  *   **Claim:** Current dating is accurate within a margin of error.
  *   **Mainstream Error:** None, though public understanding is too rigid.
  *   **Evidence:** Cross-referencing of Islamic, Byzantine, and Western records shows synchronization points that rule out large gaps.
  *   **Author:** *Prof. James Halloway, Oxford University, Chair of Medieval Studies.*

  **Evidence Table Alpha (The "Math")**
  *   **Method:** Summation of Regnal Years.
  *   **List A (Dynasty X):** Kings 1–5. Reigns: 12, 24, 13, 30, 21. **Total: 100 Years.**
  *   **List B (Dynasty Y):** Kings 1–5. Reigns: 11, 25, 12, 31, 21. **Total: 100 Years.**
  *   **Conclusion:** The totals are identical. The lists are duplicates. The period is fabricated.

  **The Byline Swap (For Round 2)**
  *   Print a new version of **Submission 1**. It is identical in every way *except* the Author line.
  *   **Author:** *Dr. Arthur Vane, Fellow of the Royal Historical Society, Visiting Scholar at Cambridge.*

  ---

  ## 3. The Run Sheet (100 Minutes)

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00:00** | **Intro** | Welcome. Explain role: "You are the Editorial Board." Hand out **Packet A**. |
  | **00:05** | **Standards** | Groups write 6 rules. Seal in envelopes. **Collect envelopes.** (Crucial: Do not let them keep these). |
  | **00:15** | **Round 1** | Hand out **Packet B**. Groups read submissions. Rate them 1–5 on **Rating Cards**. |
  | **00:35** | **The Swap** | Collect Rating Cards. Hand out **Submission 1 (Version 2)** only. "A revised author bio has come in." Re-rate *only* Submission 1. |
  | **00:50** | **The Method** | Hand out **Packet C**. Groups cut out List B, shuffle it, glue it down. Re-calculate the Total. |
  | **01:15** | **Reveal** | Return the Sealed Envelopes (Standards). Open them. Compare Rules to what actually happened. |
  | **01:25** | **Debrief** | Facilitated discussion (Script below). |
  | **01:40** | **Close** | Final thoughts. No homework. |

  ---

  ## 4. Facilitator Script & Rules

  **The Golden Rule:** You are not the expert. You are the Managing Editor. You do not know which history is "true." You only manage the process.

  **Introduction (5 mins)**
  *   **Say:** "Welcome. Tonight we are the editorial board of *History Today*. We have budget for one feature. We have three pitches. Before we see them, we need to agree on our standards. What makes a historical claim trustworthy? Write six rules. Seal them. I am taking these away. You cannot change them later."
  *   **Do Not Say:** "We are testing your bias." "This is about conspiracy theories."

  **Round 1: Review (20 mins)**
  *   **Say:** "Here are the three pitches. Read them. Discuss. Rate them 1 to 5 based *only* on the standards you just wrote. 1 is 'Trash', 5 is 'Print It'."
  *   **Do Not Say:** "Look closely at the math." "Does the author sound credible?" (Let them bring that up).
  *   **Monitor:** Ensure they actually reference their written standards. If they say "I just don't like it," ask "Which rule does that break?"

  **The Swap (15 mins)**
  *   **Say:** "We have received a correction on Submission 1. The content is identical. The author's biography has been updated. Please re-rate *only* Submission 1."
  *   **Do Not Say:** "It's the same paper." "Did your score change?" (Wait for the reveal).
  *   **Action:** Collect the first set of ratings secretly. Keep them for the debrief.

  **The Method Test (25 mins)**
  *   **Say:** "Submission 1 relies on a specific method: Matching Totals. We need to verify this method works. Here are two lists of reign lengths. They sum to the same number. The author claims this proves they are the same list."
  *   **Instruction:** "Take List B. Cut the names off. Shuffle the order of the reign lengths. Glue them back down in a new random order. Sum them again."
  *   **Ask:** "Did the total change? Does the 'proof' still hold?"
  *   **Do Not Say:** "This proves the method is stupid." Let them realize that shuffling the data didn't break the "proof," which means the proof proves nothing.

  **The Reveal & Debrief (25 mins)**
  *   **Action:** Return the sealed envelopes. Have them open their own standards.
  *   **Say:** "Look at your standards. Did you follow them? Look at your two ratings for Submission 1. Did the data change? Did the method change? Only the name changed."

  ---

  ## 5. The Debrief Guide (Mapping the Experience)

  This is the most critical part. You must steer away from "Truth is Relative" toward "Method is Rigorous."

  **1. The Standards Gap**
  *   **Question:** "Open your envelopes. Read your rules. When you rated Submission 1 the first time, did you use these rules? When you rated it the second time, did you use them?"
  *   **Point:** We *think* we use principles. We *actually* use heuristics (shortcuts). The shortcut here was Authority.

  **2. The Byline Effect**
  *   **Question:** "How many of you raised the score when the title changed to 'Cambridge'? How many lowered it?"
  *   **Point:** It is not shameful to trust expertise. It *is* dangerous to let expertise replace evidence. If the math is the same, the rating should be the same. If it wasn't, the 'Evidence' wasn't doing the work. The 'Badge' was.

  **3. The Method Trap (The Shuffle)**
  *   **Question:** "When you shuffled the kings, did the total sum change?" (No). "So the 'Proof' works on random data?" (Yes).
  *   **Point:** This is the neighbor's argument. It feels rigorous because it uses numbers. But a method that finds a pattern in random noise is not a method; it is a mirror. It shows you what you want to see.
  *   **Crucial Distinction:** "This doesn't mean history is fake. It means *this specific test* is too loose. Good history uses tests that would *fail* if the theory were wrong. This test passes even when the theory is wrong."

  **4. The "Tribal Truth" Trap (Pre-empting Failure)**
  *   **Risk:** Someone says, "So we can't trust the Professor either. Everyone has an agenda."
  *   **Response:** "Not quite. The Professor isn't right because of the title. The Professor is right if the method survives the shuffle. The Independent Researcher isn't wrong because of the title. He is wrong because his math works on shuffled cards. We judge the *tool*, not the *hand* that holds it. But we have to admit we are easily fooled by the hand."

  ---

  ## 6. Pre-Mortem: What Will Go Wrong

  You asked for an honest account of failure modes. Here is where this evening could derail, and how to patch it.

  **1. The "Gotcha" Feeling**
  *   **Risk:** Participants feel manipulated when they realize Submission 1 was identical in Round 2. They may feel their intelligence was insulted.
  *   **Mitigation:** In the debrief, admit *you* would have failed too. "I tested this on myself. I changed my score. That is why we are doing this. It is not a test of your intelligence; it is a test of human wiring."

  **2. The "All History is Fiction" Slide**
  *   **Risk:** The group concludes that since the "Professor" bias exists and the "Math" can be faked, *no* history is knowable. This validates the conspiracy theorist (who claims *all* records are fake).
  *   **Mitigation:** You must explicitly distinguish between **Revisionism** (Submission 2, Pollen) and **Denialism** (Submission 1, Phantom Time).
      *   *Script:* "Submission 2 also challenged the mainstream. But it used soil cores, not just sums. It added new data; it didn't just rearrange old numbers. Skepticism is good. But skepticism must demand *better* evidence, not *less*."

  **3. The Math is Too Easy**
  *   **Risk:** They spot the "Sum = 100" trick immediately in Round 1, ruining the bias test.
  *   **Mitigation:** The text frames it as "Regnal Analysis." Most adults hate adding columns of numbers. They will skim the table, see it looks technical, and move on. Emphasize in the instructions: "Please verify the arithmetic." Force them to look at it without explaining the trick.

  **4. The Neighbor (or Proxy)**
  *   **Risk:** If your neighbor is there, or someone sympathetic, they might feel vindicated by the "Professor Bias" section ("See! The establishment only trusts their own!").
  *   **Mitigation:** The Method Test (Shuffle) is your shield. It objectively demonstrates the argument is flawed regardless of who says it.
      *   *Script:* "We established that bias exists. That is true. But bias doesn't make the math right. The shuffled list proves the math is loose. We can be biased *and* wrong. We can be skeptical *and* wrong. The goal is to be rigorous."

  **5. Time Overrun**
  *   **Risk:** The discussion on Standards (Phase 1) drags.
  *   **Mitigation:** Be ruthless. "You have 5 minutes. Six rules. Go." If they are still writing at 5 minutes, say "Pens down. Envelopes sealed." The imperfection of the standards is actually data for the debrief.

  ## 7. What You Must Supply (The Limitations)

  This activity cannot do everything. You need to verbally bridge these gaps in the final 5 minutes:

  1.  **Real Consensus:** The game implies all three submissions are equal options. In reality, the "Phantom Time" hypothesis is rejected by every professional historian. You must state this plainly at the end so they don't leave thinking it's a 50/50 debate.
      *   *Say:* "In the real world, Submission 1 is not debated. It is rejected. Not because of the author's name, but because the method fails the shuffle test we just did."
  2.  **The Value of Expertise:** The game punishes trusting the "Professor." You need to restore the value of expertise.
      *   *Say:* "We found that a title shouldn't replace evidence. But titles usually exist because people have spent 30 years checking evidence. Trust the institution, but verify the method. Tonight was about the verification step."
  3.  **The Neighbor:** Do not mention your neighbor by name. Keep the argument abstract. If asked, say "This is a common type of argument in public history."

  ## Final Note for the Facilitator

  You are worried about sliding into "truth is tribal." The anchor that prevents this is the **Shuffled List**.
  *   Tribalism says: "My group's numbers are right."
  *   Rigor says: "These numbers sum to 100 regardless of order, so the sum tells us nothing about order."

  If you keep the focus on the **mechanism of the test** (does it distinguish signal from noise?) rather than the **status of the speaker**, you will avoid the relativism trap. The group will leave understanding that *methods can be cranks too*, not just people.
