      *   **Core Mechanics:**
          1.  **Standards Setting:** Group writes 6 rules for evaluating history pitches *before* seeing them (sealed envelope).
          2.  **Submission Review:** Three pitches (one is the neighbor's "phantom time" argument).
          3.  **The Twist:** The evidence table is shown twice. Once with a "crank" byline, once with a "professor" byline. Participants rate the evidence against their standards both times. The gap reveals authority bias.
          4.  **The Method Test:** Participants manually run the "matching method" (arithmetic of reign lengths/lists) on real data, then on shuffled/random data to show the method produces "significant" matches even when there's no connection (apophenia/data dredging).
          5.  **Debrief:** Map the experience back to the problem. Acknowledge limitations.
      *   **Deliverables:** Plan, materials (printable), timing, facilitator script (dos and don'ts), debrief guide, and a "pre-mortem" (what will go wrong).
