          *   *Verdict:* It occupies a liminal space. Calling it "definitely art" ignores Nadia. Calling it "definitely not" ignores Priya/Context.
      *   *The "Cowardly Answer" Question:* "It depends" isn't cowardly; it's accurate. But committees need decisions.
