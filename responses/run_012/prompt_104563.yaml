answer: |-
  ### Conceptual Menu: Readings of "The Will of the People"

  Below are six distinct conceptual readings of the phrase, organized by their underlying ontology of "the people" and the nature of "will." Each entry includes a verdict on its coherence, institutional implications, and an analysis of which classmate's argument likely relies on it.

  #### 1. The Pre-Political Collective Agent (The General Will)
  *   **Core Claim:** The people constitute a single, organic moral agent with a unified will that exists independently of and prior to any specific vote. Empirical votes are merely attempts to measure this metaphysical will; they can succeed or fail.
  *   **Verdict:** **Contentious/Metaphysical.** (Coherent within specific philosophical traditions, but empirically unverifiable and ontologically dubious.)
  *   **Institutional Implications:**
      *   **Referendums:** Binding only if they accurately reveal the pre-political will. A vote can be "wrong" if it contradicts the people's true interest.
      *   **Courts:** May legitimately overturn votes if they claim to protect the "true" will against temporary passion or manipulation.
      *   **Representatives:** Trustees who discern the true will, not delegates who merely transmit preferences.
      *   **Minorities:** Vulnerable. If the "true will" is unitary, dissent may be framed as error or corruption rather than legitimate disagreement.
  *   **Seminar Mapping:**
      *   **Classmate 1 (Statue):** Partially. Her claim that an unjust will is a "contradiction in terms" implies the will is inherently normative/correct. However, she equates the *vote* directly to the *will*, which this reading usually distinguishes.
      *   **Classmate 2 (Court):** **Strong Fit.** The argument that a plebiscite *manipulated* rather than *expressed* the will presupposes a "real" will that exists apart from the raw vote count.

  #### 2. The Aggregative Sum (The Arithmetic Will)
  *   **Core Claim:** The will of the people is nothing more than the sum of individual preferences at a specific moment. There is no "people" over and above the individuals; there is only the counting rule (e.g., majority rule).
  *   **Verdict:** **Substantive and Defensible.** (Methodologically clear, though vulnerable to social choice paradoxes.)
  *   **Institutional Implications:**
      *   **Referendums:** Strictly binding. The count *is* the will. To question the result is to question arithmetic.
      *   **Courts:** No standing to override the count based on "will." They can only intervene on procedural technicalities or separate rights claims.
      *   **Representatives:** Delegates bound by polling or election results.
      *   **Minorities:** Outvoted. Their preferences are included in the sum but do not determine the result.
  *   **Seminar Mapping:**
      *   **Classmate 1 (Statue):** **Strong Fit.** She argues the vote *expressed* the will and therefore binds the council. Her claim that "unjust will" is a contradiction suggests she defines "will" normatively as "the legitimate outcome of the count," making injustice a category error.
      *   **Classmate 2 (Court):** **No Fit.** This reading cannot support overturning a plebiscite in the name of the "will," because the plebiscite *defined* the will.

  #### 3. The Procedural Construction (The Deliberative Will)
  *   **Core Claim:** The will of the people does not exist as a raw input; it is an output constructed only when specific deliberative conditions (free speech, access to information, lack of coercion) are met.
  *   **Verdict:** **Substantive and Defensible.** (Normatively attractive, but difficult to institutionalize.)
  *   **Institutional Implications:**
      *   **Referendums:** Binding only if deliberative standards were met. Manipulation or misinformation voids the "will."
      *   **Courts:** Guardians of the deliberative process. They may strike down votes that resulted from coercion or systemic distortion.
      *   **Representatives:** Facilitators of public reason, not just vote-counters.
      *   **Minorities:** Protected via procedural rights (e.g., right to be heard, right to information) necessary for the will to form legitimately.
  *   **Seminar Mapping:**
      *   **Classmate 1 (Statue):** **No Fit.** She treats the vote as self-validating, ignoring deliberative conditions.
      *   **Classmate 2 (Court):** **Strong Fit.** The claim that the plebiscite *manipulated* the will implies the conditions for forming a legitimate will were violated, justifying judicial intervention.

  #### 4. The Negative/Veto-Centered Authorization (The Democratic Minimum)
  *   **Core Claim:** The people do not have a positive "will" to govern; they only have the capacity to withdraw authorization from elites. "Will" is expressed negatively (firing leaders) rather than positively (dictating policy).
  *   **Verdict:** **Substantive and Defensible.** (Realistic about complexity, but thin on democratic ambition.)
  *   **Institutional Implications:**
      *   **Referendums:** Suspect. Positive policy mandates are often illusory. Referendums are best used to remove officials or veto specific elite overreach.
      *   **Courts:** Protect the mechanisms of removal and veto.
      *   **Representatives:** Autonomous agents who govern until fired.
      *   **Minorities:** Protected by the difficulty of forming a stable majority to oppress them; coalitions shift.
  *   **Seminar Mapping:**
      *   **Classmate 1 (Statue):** **Weak Fit.** She treats the referendum as a positive mandate for policy (remove statue), not just a veto.
      *   **Classmate 2 (Court):** **Moderate Fit.** The court acts to prevent elites (or populist leaders) from using a plebiscite to cement power, preserving the people's future veto power.

  #### 5. The Majoritarian Fiction (The Populist Tool)
  *   **Core Claim:** "The will of the people" is not a real entity but a rhetorical weapon. It is a fiction invoked by leaders to claim unmediated legitimacy and bypass institutions.
  *   **Verdict:** **Cynical/Descriptive.** (Accurate as a description of populist strategy, but normatively empty.)
  *   **Institutional Implications:**
      *   **Referendums:** Tools of mobilization. Binding only insofar as the leader has the power to enforce them.
      *   **Courts:** Obstacles to be delegitimized as "enemies of the people."
      *   **Representatives:** Rivals to the leader who claims direct connection to the people.
      *   **Minorities:** Often defined as non-people or obstacles to the "real" people's will.
  *   **Seminar Mapping:**
      *   **Classmate 1 (Statue):** **Moderate Fit.** Her insistence that the will cannot be unjust functions to shut down debate, a characteristic move of this reading.
      *   **Classmate 2 (Court):** **No Fit.** Classmate 2 treats the phrase as having a normative standard (manipulation vs. expression), whereas this reading treats it as pure power play.

  #### 6. The Constitutional/Constituent Power (The Founding Will)
  *   **Core Claim:** The people possess a "will" only in their capacity as the *constituent power* (the authors of the constitution). Once the regime is established, the "will" is channeled through constituted powers (legislatures, courts), not direct plebiscites.
  *   **Verdict:** **Substantive and Defensible.** (Standard in liberal constitutional theory.)
  *   **Institutional Implications:**
      *   **Referendums:** Generally illegitimate for ordinary policy. Permissible only for constitutional amendment (re-activating constituent power).
      *   **Courts:** The primary guardians of the constituent will (the Constitution) against temporary majoritarian impulses.
      *   **Representatives:** The ordinary channel for the people's will within the constitutional framework.
      *   **Minorities:** Protected by constitutional rights that the temporary majority cannot violate.
  *   **Seminar Mapping:**
      *   **Classmate 1 (Statue):** **No Fit.** She argues a municipal referendum binds on a specific policy issue, conflating constituent and constituted power.
      *   **Classmate 2 (Court):** **Strong Fit.** The court striking down a plebiscite implies the plebiscite violated the higher law authorized by the people's constituent will.

  ***

  ### Final Analysis: Answering Your Specific Questions

  **1. Which readings support the claim that a referendum result is binding even when it is unjust or ill-informed?**
  *   **The Aggregative Sum (Reading 2):** Because "will" is defined as the count. If the count is valid, the will exists. "Unjust" is a moral judgment external to the definition of the will.
  *   **The Pre-Political Collective Agent (Reading 1):** *Only if* one assumes the vote infallibly reveals the metaphysical will. (Note: This is internally unstable, as Reading 1 usually allows for the vote to be wrong, but Classmate 1's specific argument relies on this conflation).
  *   **The Majoritarian Fiction (Reading 5):** Because the claim of bindingness is a power move, not a truth claim.

  **2. Which readings support the claim that a court may overturn a plebiscite in the name of the people's will?**
  *   **The Procedural Construction (Reading 3):** The court protects the *conditions* under which the will is formed. If manipulation occurred, the "will" was never formed.
  *   **The Constitutional/Constituent Power (Reading 6):** The court protects the *long-term* will of the people (the Constitution) against the *temporary* will of the majority (the plebiscite).
  *   **The Pre-Political Collective Agent (Reading 1):** If the court claims the authority to discern the "true" will against the "apparent" will of the manipulated vote.

  **Seminar Strategy:**
  Your classmates are talking past each other because Classmate 1 is operating with a mix of **Aggregative** and **Pre-Political** readings (Vote = Will = Good), while Classmate 2 is operating with **Procedural** or **Constituent** readings (Vote ≠ Will if conditions/higher law are violated). You can intervene by asking: *"Are we defining the will of the people as the empirical output of a vote, or as a normative standard that a vote might fail to meet?"*
