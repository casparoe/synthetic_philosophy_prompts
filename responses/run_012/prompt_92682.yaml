  ### The Decision Tree on Split-Brain Unity

  This tree is constructed from the logical space of interpretations regarding the split-brain data, rather than from a list of philosophical schools. It proceeds from the reality of the terms we use, to the nature of unity, to the interpretation of specific cases, and finally to the count of subjects.

  There are **8 internal nodes** and **10 leaves**.

  #### Node 1: The Reality of the Subject
  **Question:** Is the word "subject" (or "self") naming a real entity we discover in the data, or is it just a useful way of talking about behavioral coherence (*façon de parler*)?
  *   **Answer: Just a way of talking.** → **Leaf 1: Eliminativism / Deflationism.**
      *   *Awkward commitment:* We must explain why the patient themselves feels like a real entity without positing a real entity to do the feeling.
  *   **Answer: A real entity.** → Go to Node 2.

  #### Node 2: The Nature of Unity
  **Question:** What kind of unity is required for two experiences to belong to the same subject: that they are felt together (phenomenal), or that they are available to a single reasoner for decision-making (practical)?
  *   **Answer: Available to a single reasoner (Practical).** → **Leaf 2: The Practical Deliberator.**
      *   *Awkward commitment:* You must count a being as one subject even if it phenomenally feels like two, provided it can eventually reason through the conflict.
  *   **Answer: Felt together (Phenomenal).** → Go to Node 3.

  #### Node 3: The Effect of Disconnection
  **Question:** When the hemispheres are disconnected, does the surgery prevent experiences from being *had* together, or does it only prevent them from being *reported* or *accessed* together?
  *   **Answer: Prevents reporting/access only.** → **Leaf 3: One Subject / Access Failure (Your Friend's Position).**
      *   *Awkward commitment:* You must explain how a single subject can simultaneously want to button and unbutton a shirt without being irrational or fragmented.
  *   **Answer: Prevents being had together.** → Go to Node 4.

  #### Node 4: The Case of Intermanual Conflict
  **Question:** In cases where one hand acts against the other (e.g., buttoning vs. unbuttoning), are there two distinct intentions present simultaneously, or one intention that is failing to control the body?
  *   **Answer: One intention failing.** → **Leaf 4: One Subject / Switching Stream.**
      *   *Awkward commitment:* You must claim that consciousness flickers on and off in one hemisphere so fast that it looks like simultaneous conflict.
  *   **Answer: Two distinct intentions.** → Go to Node 5.

  #### Node 5: The Case of Confabulation
  **Question:** When the speaking hemisphere invents a reason for an action initiated by the silent hemisphere, is it lying to cover up a split, or is it performing the work of stitching a single self together?
  *   **Answer: Lying to cover up a split.** → **Leaf 5: Two Centres of Consciousness (Standard View).**
      *   *Awkward commitment:* You must explain why the patient does not report feeling like two people, other than by saying they are systematically deceived.
  *   **Answer: Stitching a single self together.** → **Leaf 6: Two Subjects / Narrative Unity (Your Position).**
      *   *Awkward commitment:* You must explain what happens to the "single self" when the narrating hemisphere is asleep or damaged, without implying the subject ceases to exist.
  *   **Note:** *If you find no meaningful difference between Leaf 5 and Leaf 6, see the "Indistinguishable Positions" section below.*

  #### Node 6: Degrees of Unity
  **Question:** Is unity an all-or-nothing property (you are either one subject or two), or does it come in degrees (you can be partly unified)?
  *   **Answer: Comes in degrees.** → **Leaf 7: Partial Unity.**
      *   *Awkward commitment:* You must accept that there is no fact of the matter about exactly how many subjects are present, only a matter of more or less integration.
  *   **Answer: All-or-nothing.** → Go to Node 7.

  #### Node 7: The Case of Hemispherectomy
  **Question:** If a person loses a hemisphere early in life and functions normally, is the remaining subject the "same kind" of subject as the one in the split-brain patient (who has two hemispheres but no connection)?
  *   **Answer: No, the subject is different.** → **Leaf 8: One Subject / Neither Hemisphere Nor Whole.**
      *   *Awkward commitment:* You must posit a subject that is not identical to the brain, the person, or the hemisphere, but somehow constituted by them.
  *   **Answer: Yes, the subject is the same kind.** → Go to Node 8.

  #### Node 8: Subject vs. Person
  **Question:** Can a single biological human being (one person) house two distinct subjects of experience?
  *   **Answer: No, one person = one subject.** → **Leaf 9: One Subject / Access Failure (Collapsed).**
      *   *Note:* This path leads back to the logic of Leaf 3, suggesting that if you answer "No" here, you likely should have answered "Access only" at Node 3.
  *   **Answer: Yes, one person can house two subjects.** → **Leaf 10: Two Subjects / One Person.**
      *   *Awkward commitment:* You must accept that moral responsibility and legal personhood might not map one-to-one onto the number of experiencing beings.

  ---

  ### Location of Positions and Point of Disagreement

  **Your Position:** You are located at **Leaf 6 (Two Subjects / Narrative Unity)**.
  **Your Friend's Position:** Your friend is located at **Leaf 3 (One Subject / Access Failure)**.

  **The First Node of Disagreement:**
  You part company at **Node 3: The Effect of Disconnection**.
  *   **You answer:** "Prevents being had together." (This leads you to posit two subjects).
  *   **Your Friend answers:** "Prevents reporting/access only." (This allows them to keep one subject).

  This is the load-bearing joint of your argument. Every time you re-litigate an experiment (e.g., "Can the left hand point to what the right hand saw?"), you are actually arguing about Node 3. You interpret the failure to point as evidence that the experience *never existed* for the speaking subject. Your friend interprets the failure to point as evidence that the experience *exists* but cannot be *retrieved* by the speaking subject.

  ---

  ### Analysis of the Logical Space

  **1. Empty Combinations (and why):**
  *   **"Two Centres of Consciousness" + "One Stream that Switches":** This combination is incoherent. If there are two centres, there are two streams. If there is one stream that switches, there is only one centre active at a time. No position occupies this because it contradicts the definition of "centre."
  *   **"Unity is Degrees" + "One Subject / Access Failure":** While logically possible, this is unexplored. If unity is degrees, "Access Failure" is usually framed as a reduction in degree (Partial Unity) rather than a binary state of "One Subject."
  *   **"Subject = Neither" + "Eliminativism":** Incoherent. If the subject is not a real entity (Eliminativism), it cannot be a specific kind of entity (Neither Hemisphere Nor Whole).

  **2. Indistinguishable Positions:**
  *   **Leaf 5 (Two Centres) and Leaf 6 (Narrative Unity):** I flag these as a pair that may collapse. The distinction relies on whether the narration is a *symptom* of the split (Leaf 5) or the *constitutive act* that creates the illusion of unity (Leaf 6). In practice, both views predict the same behavior: two streams of consciousness masked by a verbal story. If you cannot specify a testable difference in what the narration *does*, these are the same leaf under different descriptions.
  *   **Leaf 3 (Access Failure) and Leaf 9 (One Person/One Subject):** These collapse. If you believe one person cannot house two subjects (Node 8), you are logically forced to believe the disconnection only blocks access (Node 3) to maintain the "One Subject" count.

  **3. Load-Bearing vs. Balanced Nodes:**
  *   **Load-Bearing:** **Node 3 (Disconnection Effect)** is the heaviest node. It carries the weight of the entire "One vs. Two Subjects" debate. **Node 5 (Confabulation)** is the second heaviest, as it is the only thing separating your specific view from the standard "Two Centres" view.
  *   **Balanced (Decorative):** **Node 7 (Hemispherectomy)** and **Node 1 (Eliminativism)** are included to satisfy the logical space requirements you listed, but they are not where your current argument lives. You and your friend have already agreed there are subjects (Node 1) and are likely assuming the standard brain constitution (Node 7). You can safely prune these branches for your seminar if you wish to focus strictly on the split-brain data.

  ---

  ### An Invitation to Disagreement

  I must invite your disagreement on the structure of this tree, specifically regarding **Node 5** and the distinction between **Leaf 5 and Leaf 6**.

  You asked to distinguish "Two centres of consciousness" from "One subject which is neither hemisphere nor the whole brain" and "Two subjects... appearance of a single one is produced... by narration." I have placed the first and third on adjacent leaves (5 and 6) separated only by the *role* of the narration.

  **The Problem:** It is possible that "Two Centres" *just is* the view that there are two subjects, and "Narrative Unity" is merely the *explanation* for why we don't notice them. If the "Two Centres" theorist agrees that the narration creates the *appearance* of unity, Leaf 5 and Leaf 6 are identical. The tree forces a distinction where there may only be a difference in emphasis. If you find you cannot define a commitment for Leaf 5 that Leaf 6 does not also hold (or vice versa), the tree is over-fitted.

  **The Second Problem:** **Node 3** presupposes a dichotomy between "experiences being had" and "experiences being reported." Some philosophers argue this is a false dilemma—that for a human subject, "having" an experience *just is* having it available for report and control. If that is true, Node 3 collapses, and your disagreement with your friend is not about the *effect of the surgery*, but about the *definition of experience* (Node 2). If you suspect your friend defines "experience" functionally (available for use) while you define it phenomenally (raw feeling), the split actually happens at **Node 2**, not Node 3.

  **Recommendation:** For the seminar, test Node 3 first. If the students (or your friend) reject the dichotomy there, move the debate to Node 2. If you find Leaf 5 and Leaf 6 indistinguishable, merge them and acknowledge that "Narrative" is the mechanism for the "Two Centres" view, not a competing position. A smaller tree that holds is better than a symmetric one that does not.
