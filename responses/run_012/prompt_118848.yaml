  Imagine you are presented with a choice between two options based on a draw from an urn containing one hundred tickets numbered from one to one hundred. In the first version of the problem, the situation is described by grouping the tickets into three distinct events. Event Red consists of tickets one through ten, Event Blue consists of tickets eleven through ninety, and Event Green consists of tickets ninety-one through one hundred. In Event Red, which has a ten percent chance of occurring, both Option 1 and Option 2 pay you zero dollars. In Event Blue, which has an eighty percent chance of occurring, Option 1 pays one hundred dollars and Option 2 pays zero dollars. In Event Green, which has a ten percent chance of occurring, Option 1 pays one hundred dollars and Option 2 pays five hundred dollars. In the second version of the problem, the underlying states and probabilities are identical, but the description is sequential rather than grouped by event. You are told that Option 1 pays zero dollars if the ticket drawn is between one and ten and pays one hundred dollars if the ticket is between eleven and one hundred. You are then told separately that Option 2 pays zero dollars if the ticket drawn is between one and ninety and pays five hundred dollars if the ticket is between ninety-one and one hundred. In this second description, the fact that both options pay zero on tickets one through ten is mathematically true but is not displayed as a shared branch or a common event; it is merely an overlap in two independent descriptions.

  Expected utility theory treats both versions as identical because it evaluates options solely as maps from states to consequences. Assuming a linear utility function for money, expected utility calculates the value of Option 1 as ninety dollars, derived from a ninety percent chance of one hundred dollars and a ten percent chance of zero dollars. It calculates the value of Option 2 as fifty dollars, derived from a ten percent chance of five hundred dollars and a ninety percent chance of zero dollars. Consequently, expected utility theory predicts a preference for Option 1 in both versions. Rank-dependent utility theory also treats the two versions as identical because it too reads only the final distribution of outcomes and their probabilities, ignoring the display structure. However, using a standard weighting function such as w(p) equals p to the power of zero point seven, which overweight small probabilities, rank-dependent utility may disagree with expected utility. Under these parameters, the weight on the ten percent chance of winning in Option 2 rises to approximately zero point two, giving Option 2 a weighted value of one hundred dollars, while the weight on the ninety percent chance in Option 1 is compressed, giving it a weighted value of roughly eighty dollars. Thus, in the shared-branch version, expected utility and rank-dependent utility genuinely disagree, with the former favoring Option 1 and the latter favoring Option 2. Regret theory, which evaluates choices based on the anticipated regret or rejoice relative to the forgone option, also remains invariant between the two versions because the state-by-state comparison of outcomes does not change. Assuming a standard regret function where the pain of regretting a missed gain is symmetric to the joy of outperforming the alternative, regret theory typically sides with expected utility in this specific configuration, preferring Option 1, because the frequent rejoice of earning one hundred dollars instead of zero in the blue state outweighs the infrequent regret of earning one hundred instead of five hundred in the green state. None of these three theories shifts its prediction between the two versions because none of them contains a mechanism that registers how the map from states to consequences is written down; they are all extensional.

  For the chooser, however, the feature of the display that does the work is the salience of the common consequence. In the first version, the explicit grouping of tickets one through ten as a single event where both options pay zero invites a psychological editing operation known as cancellation, where the decision-maker removes the common branch from consideration and compares only the differing branches. When the common zero outcome is cancelled, Option 1 looks like a sure gain of one hundred dollars in the remaining states, while Option 2 looks like a risky chance at five hundred dollars, making Option 1 highly attractive. In the second version, where the options are described sequentially, the coincidence of the zero outcome on tickets one through ten is not visually grouped, so the cancellation operation is less likely to occur. For the reversal to appear in the shared-branch version and vanish in the other, the decision-maker must be relying on a heuristic that simplifies the problem by deleting common components, rather than computing the full expected value. If you remove that feature and present the same state space as a plain list with no shared branch anywhere, effectively forcing the sequential processing of Version 2, the case collapses into a standard risky choice problem rather than the textbook Allais problem. The textbook Allais problem relies on the certainty effect where one option offers a guaranteed win, but here neither option is a sure thing, so without the shared-branch salience to trigger cancellation, the problem loses its paradoxical force and becomes a straightforward trade-off between probability and magnitude.

  The strongest reply available to someone who thinks this exercise is beside the point is that the two versions are normatively one and the same problem, so any difference in what people choose is an error of reasoning rather than evidence about the axioms. This objection claims that because the mathematical structure is invariant, rational agents should not be swayed by display, and therefore observing a switch in preference only proves human fallibility, not a flaw in expected utility theory as a normative standard. This reply does not defeat the argument you want to make, which is descriptive rather than normative. Your point is that the familiar Allais result does not by itself identify the mechanism behind it, and showing that display changes behavior demonstrates that the mechanism is likely framing-sensitive editing rather than a stable violation of the independence axiom. To survive the objection that this is merely error, you would have to add empirical evidence showing that the reversal is systematic and predictable based on the display features, rather than random noise. If the reversal is a systematic response to the visual salience of the shared branch, then a theory that cannot account for this sensitivity is descriptively inadequate, regardless of its normative appeal, because it fails to predict when and why people will violate the independence axiom.
