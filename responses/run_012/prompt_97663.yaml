answer: |-
  **Project Title:** The Two-Clocks Problem: Intelligibility, Evaluation, and the Limits of Presentism in Historical Representation

  **Research Question**
  This project seeks a determinate answer to the following question: Are the conditions required to make a past agent intelligible (the *Intelligibility Axis*) conceptually distinct from the standards used to morally evaluate that agent (the *Grading Axis*), and if so, does historical fiction possess a specific epistemic licence to hold these axes in tension that historiography does not?

  **Background and Gap**
  Current debates regarding presentism in history and literature tend to treat the imposition of modern standards as a monolithic error or an inevitability. Positions generally cluster around two poles: those arguing that we cannot escape our own normative framework without losing critical purchase, and those arguing that failing to adopt the past's framework constitutes a category error. However, both positions treat 'understanding' and 'judging' as a single operation. They assume that to explain an action is to implicitly grade it, or that to grade it is to presuppose a shared explanatory framework.

  This project argues that this conflation is the source of the stalemate. There is a distinction between the categories of motive and reason we must presuppose to describe someone as acting rather than merely happening (Intelligibility), and the normative standards we use to approve or condemn that action (Grading). Existing literature leaves this open because it lacks a practice-led testing ground. Theoretical arguments about 'charity' or 'context' remain abstract. This project proposes that the stalled historical novel provides a unique laboratory for testing this distinction. The novelist's problem—how to write a scene that is truthful to the past without being complicit in its monstrosities—is not merely aesthetic; it is a philosophical problem regarding the structure of historical understanding.

  **Methodology and Work Plan**
  This is a practice-led research project. The primary data consists of the specific stalled scenes from the applicant's fourth novel (set in 1870s Yorkshire) alongside a targeted review of philosophical arguments regarding historical explanation and moral judgment. The method involves attempting to write the scenes under different theoretical constraints to see which axis breaks first.

  *   **Months 1–3: Mapping the Axes.** Close reading of key philosophical positions on presentism, agency, and moral luck. Simultaneously, isolating the specific 'monstrous' scenes in the draft. The goal is to produce a working definition of the Intelligibility and Grading axes based on the text's specific requirements.
  *   **Months 4–6: The Intelligibility Test.** Drafting the scenes prioritising the Intelligibility Axis. The constraint: the character's action must be rendered completely unremarkable within the text's internal logic. No narrative signalling of discomfort. The research question here is whether this renders the character unintelligible to a modern reader (i.e., do they become alien to the point of being incomprehensible?).
  *   **Months 7–9: The Grading Test.** Drafting the scenes prioritising the Grading Axis. The constraint: the moral horror must be explicit to the reader, potentially via narrative voice or focalisation. The research question here is whether this violates the historical truth of the scene (i.e., does it impose a 'clock' that didn't exist?).
  *   **Months 10–12: Synthesis and Comparison.** Analysing the failure points of both drafts. Does one axis collapse into the other? Writing the critical exegesis that compares these findings against the constraints faced by historiography.

  **Historical Fiction vs. Historiography**
  A core component of this research is determining whether the novelist's problem is simply the historian's problem with worse footnotes, or whether fiction operates under a different licence. Historiography is generally bound by a truth claim regarding actual events; fiction is bound by a truth claim regarding human experience. It is hypothesised that fiction may be permitted to sustain the 'Two-Clocks' tension—allowing the reader to see both the 1870s clock and the 2020s clock simultaneously—in a way that historiography cannot. Historiography must ultimately adjudicate; fiction may be able to merely exhibit the discrepancy. This project will test whether this 'licence' is genuine or merely a cowardice disguised as ambiguity.

  **Outputs**
  1.  **Critical Exegesis (15,000 words):** A paper titled 'The Two-Clocks Problem', setting out the distinction between Intelligibility and Grading axes and arguing for their separability (or proving their entanglement).
  2.  **Creative Component:** Three revised chapters of the novel demonstrating the applied framework, accompanied by commentary on the drafting decisions.
  3.  **Public Talk:** A presentation on the intersection of moral philosophy and creative practice.

  **Risk and Failure Conditions**
  The scope is tight for a one-year fellowship. The risk is that the philosophical reading overwhelms the writing time, or vice versa. To mitigate this, the reading is limited strictly to arguments concerning agency and evaluation, not general history of philosophy.

  There are two specific failure conditions:
  1.  **Theoretical Collapse:** The research may demonstrate that the Intelligibility and Grading axes are inseparable. If one cannot make an agent intelligible without implicitly grading them, the 'Two-Clocks' model fails. This would still be a valid result, but it would require rewriting the exegesis to argue for entanglement rather than distinction.
  2.  **Practical Stalling:** The novel may remain stalled despite the theoretical clarity. If the philosophical problem is solved but the narrative problem persists, the project fails practically. In this event, the output will shift to a case study on why philosophical resolution does not guarantee aesthetic success.

  **Feasibility**
  This project is feasible within one year because it does not attempt to solve presentism generally. It solves it for the specific case of the historical novelist. By restricting the inquiry to the specific mechanics of drafting a scene, the abstract becomes concrete. The applicant's existing draft provides the raw material, removing the need for archival research. The primary workload is thinking and writing, which fits the fellowship structure.

  **Conclusion**
  We cannot read the past on our clock without losing them, and we cannot read them on their clock without losing the ability to say anything true about them. This project asks whether we have two hands to tell the time with, or only one. If the Intelligibility Axis is inescapable while the Grading Axis is negotiable, the novelist has a path forward. If both are locked together, the stall is not a bug, but a feature of the genre itself. This fellowship will determine which is the case.
