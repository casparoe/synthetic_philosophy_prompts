  # Seminar Plan: The Will of the People (90 Minutes)

  ## Overview
  **Goal:** Demonstrate that "the will of the people" is not a pre-existing fact waiting to be discovered, but an output generated by specific procedural rules.
  **Class Size:** 18 Students.
  **Materials:** 18 Preference Cards (4 types), 2 Platform Signs, Ballots (slips of paper), Whiteboard.
  **Instructor Stance:** Neutral Facilitator. Do not explain the theory until the debrief. Act as a neutral election commission.

  ---

  ## 1. Preparation: Preference Sheets
  Print and cut 18 cards. Distribute them randomly as students enter, but **ensure the counts are exact**. Do not let students compare cards until the debrief.

  **The Setup:**
  There are two Parties/Platforms and three Policy Issues.
  *   **Platform Red:** Yes on Issue 1, Yes on Issue 2, Yes on Issue 3.
  *   **Platform Blue:** No on Issue 1, No on Issue 2, No on Issue 3.

  **Voter Logic:** Students must vote for the Platform that matches *more* of their personal preferences. They must vote on Issues according to their *exact* personal preferences.

  **Card Distribution (18 Total):**

  *   **Type A (6 Cards):**
      *   Your Views: **Yes** on 1, **Yes** on 2, **Yes** on 3.
      *   *Instruction:* You match Platform Red on 3 issues. You match Platform Blue on 0.
  *   **Type B (4 Cards):**
      *   Your Views: **No** on 1, **No** on 2, **Yes** on 3.
      *   *Instruction:* You match Platform Red on 1 issue. You match Platform Blue on 2.
  *   **Type C (4 Cards):**
      *   Your Views: **No** on 1, **Yes** on 2, **No** on 3.
      *   *Instruction:* You match Platform Red on 1 issue. You match Platform Blue on 2.
  *   **Type D (4 Cards):**
      *   Your Views: **Yes** on 1, **No** on 2, **No** on 3.
      *   *Instruction:* You match Platform Red on 1 issue. You match Platform Blue on 2.

  **The Math (For Instructor Eyes Only):**
  *   **Election:** Red gets 6 votes (Type A). Blue gets 12 votes (Types B, C, D). **Blue Wins.**
  *   **Issue 1:** Yes gets 10 (A+D). No gets 8 (B+C). **Yes Wins.** (Contradicts Blue).
  *   **Issue 2:** Yes gets 10 (A+C). No gets 8 (B+D). **Yes Wins.** (Contradicts Blue).
  *   **Issue 3:** Yes gets 10 (A+B). No gets 8 (C+D). **Yes Wins.** (Contradicts Blue).

  ---

  ## 2. Minute-by-Minute Timeline

  ### 0:00 – 0:10 | Setup & Distribution
  *   Hand out cards as students enter. Tell them: "Keep this card private. Do not show it to anyone. It contains your private political preferences and voting instructions."
  *   Write the three issues on the board (keep them abstract to avoid real-world bias):
      1.  *Policy X (e.g., Infrastructure Spending)*
      2.  *Policy Y (e.g., Trade Tariffs)*
      3.  *Policy Z (e.g., Education Reform)*
  *   Define the Platforms:
      *   **Party Red:** Supports X, Y, and Z.
      *   **Party Blue:** Opposes X, Y, and Z.

  ### 0:10 – 0:25 | Round 1: The Election
  *   **Instruction:** "First, we hold a general election. Look at your card. Count how many issues you agree with regarding Party Red. Count how many you agree with regarding Party Blue. Vote for the party that matches *more* of your views. If it's a tie, flip a coin." (Note: With this distribution, there are no ties).
  *   **Action:** Collect ballots. Tally publicly on the board.
  *   **Result:** Party Blue wins (12 to 6).
  *   **Declaration:** "Party Blue has won the mandate. They are the governing majority."

  ### 0:25 – 0:40 | Round 1: The Legislation
  *   **Instruction:** "Now, the new government must legislate. We will vote on each issue individually. Ignore the party you voted for. Vote strictly according to your personal preference on your card (Yes or No)."
  *   **Action:**
      *   Vote on Issue X. Tally. (Yes wins 10-8).
      *   Vote on Issue Y. Tally. (Yes wins 10-8).
      *   Vote on Issue Z. Tally. (Yes wins 10-8).
  *   **Declaration:** "The Assembly has passed Yes on all three issues."
  *   **The Reveal:** "Party Blue was elected on a platform of No/No/No. The Assembly has just passed Yes/Yes/Yes. The elected government's platform has been rejected on every single point by the majority of this room."
  *   **Silence:** Allow 2 minutes of quiet confusion. Do not explain why.

  ### 0:40 – 0:55 | Round 2: The Agenda Setter
  *   **Selection:** Choose one student (preferably one who seems frustrated or engaged). Call them the "Chair."
  *   **Secret Instruction:** Hand the Chair a note.
      *   *Note:* "You have the power to set the agenda. You may change the order of votes. You may also choose to **bundle** two issues together into a single vote if you wish. Your goal is to see if you can make the outcome consistent with the Election Result (Party Blue/No) or the Issue Result (Yes), just by changing how we vote."
  *   **Public Instruction:** "The Chair will now run the second session. They decide the order and method of voting. The rest of you, vote sincerely according to your cards again."
  *   **Likely Outcome:** If the Chair bundles Issues 2 and 3 into a single "Package Vote" (Yes/Yes vs No/No), the "No" side will likely win the bundle (Types B, C, D prefer No on at least one of those, and dislike the Yes/Yes package).
      *   *Why:* Types B, C, and D (12 voters) all oppose the "All Yes" platform on at least two issues. If forced to vote on a "Change Package" (Yes/Yes) vs "Status Quo" (No/No), the 12 voters who elected Blue will often stick with Blue's bundle when it is presented as a single choice, whereas they split apart when issues are separate.
  *   **Result:** The Chair demonstrates that by changing the *procedure* (bundling), the "Will" shifts from the Issue Majority to the Election Majority.

  ### 0:55 – 1:15 | Debrief: Mapping the Structure
  *   **Step 1: The Feeling.** Ask: "When you saw the first result, what word came to mind? Broken? Unfair? Confusing?"
  *   **Step 2: The Three Wills.** Draw three columns on the board.
      1.  **The Mandate:** The winning platform (Party Blue).
      2.  **The Aggregate:** The majority view on each specific issue (All Yes).
      3.  **The Procedure:** The output generated by the rules (which changed in Round 2).
  *   **Step 3: The Diagnosis.** Explain that no one voted irrationally. No one lied. The math is correct. The contradiction arises because "The Will of the People" is not a single object.
      *   If democracy means "Elect a team," Blue won.
      *   If democracy means "Get the most popular policies," Yes won.
      *   These two definitions are mathematically incompatible in this scenario.
  *   **Step 4: The Manipulator.** Ask the Chair: "Did you change anyone's mind?" (No). "Did you change the outcome?" (Yes). "So the 'Will' depended on your power to group the questions."

  ### 1:15 – 1:25 | Limitations & Engineering (Crucial)
  *   **Frank Admission:** "I engineered this. In a random electorate of 18 people, this specific split is rare. Real elections usually have enough 'noise' that one side wins both the platform and the issues."
  *   **The Point:** "However, the *possibility* of this contradiction is always present in any system that bundles issues into parties. We don't know if an election result is a mandate for a specific policy or just a lesser-of-two-evils choice on a bundle."
  *   **The Deep Question:** "Does a collective 'Will' exist prior to the vote? Or is the Will created by the voting method?"

  ### 1:25 – 1:30 | Closing
  *   Assign reading that formalizes what they just experienced (e.g., excerpts on the Ostrogorski Paradox or Social Choice Theory), now that they have the intuition.

