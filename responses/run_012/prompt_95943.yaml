  ## 3. Predictable Failures & Troubleshooting

  | Failure | Prediction | Handling |
  | :--- | :--- | :--- |
  | **Strategic Voting** | A student realizes the paradox mid-way and votes against their card to "fix" the outcome. | **Prevention:** State clearly at the start: "This is a simulation of sincere preference. Voting against your card breaks the model." <br> **Remedy:** If it happens, acknowledge it. "Strategic voting is a real-world response to this problem. But for this experiment, we need to see what happens when everyone is honest." |
  | **Math Errors** | Miscounting the show of hands (e.g., counting 9 instead of 10). | **Prevention:** Count twice. Ask students to keep hands up until you confirm the number. <br> **Remedy:** If a count is off, correct it immediately. The paradox holds with 10-8, but also 9-9 (tie-break). Ensure the majority is clear. |
  | **Group Discovery** | Students figure out the card distribution ("Wait, how many of you voted Blue?"). | **Prevention:** Tell them not to discuss card types until the debrief. <br> **Remedy:** If they guess, lean into it. "Does knowing the distribution change the fact that the rules produced a contradiction?" |
  | **Cynicism** | "This is just a math trick. Real politics isn't like this." | **Response:** Save this for the debrief. "You are right. But institutions are made of math. If the structure allows this, representatives will exploit it." |
  | **Manipulator Confusion** | The Chair doesn't know how to bundle issues effectively. | **Prevention:** Give the Chair a hint card. "Try voting on Issue 1 alone, then vote on Issues 2 & 3 as a single package." <br> **Remedy:** If they fail to change the outcome, use it. "Even with agenda power, consistency is hard. This shows how sticky the problem is." |

  ---

  ## 4. Instructor Notes: What This Activity Cannot Do

  **1. It cannot prove this happens often.**
  You must be explicit that you constructed a "pathological case." In real electorates, preferences are usually more correlated (people who want Yes on X usually want Yes on Y). If you don't disclose this, students will think you are claiming all elections are fraudulent. The lesson is about *possibility* and *structure*, not frequency.

  **2. It cannot solve the problem.**
  The activity will leave them with a sense of instability. Do not try to offer a neat solution (e.g., "Proportional Representation fixes this"). Different systems prioritize different definitions of "Will." The goal is to make them comfortable with the ambiguity, not resolve it.

  **3. It cannot stage the "Deep Question."**
  The activity shows a conflict between two definitions of "Will" (Mandate vs. Issue Majority). It does not prove that *neither* is the real will. You must raise the philosophical question yourself in the debrief: "If the procedure creates the outcome, does the 'People' speak, or do we just hear the echo of the rules?"

