answer: |-
  The standard textbook narrative regarding dominance solvability is clean, comforting, and ultimately inconsistent. It tells us that Iterated Elimination of Strictly Dominated Strategies (IESDS) is the gold standard of rationality: it is order-independent, it preserves all Nash equilibria, and it relies on the robust epistemic claim that a rational player never plays a strategy that is worse than another against *every* possible belief. In contrast, Iterated Elimination of Weakly Dominated Strategies (IEWDS) is treated as a dangerous heuristic. It is order-dependent, it can delete valid Nash equilibria, and it relies on the shaky assumption that players assign positive probability to every opponent move.

  This distinction is mathematically convenient but epistemically hollow. The moment you allow mixed strategies to perform the dominating in the "strict" case, the moral high ground of strict dominance evaporates. The textbook prohibition on weak dominance is overly conservative, born of a fear of procedural messiness rather than a genuine flaw in the logic of rationality. The verdict should be this: **Weak dominance is the superior test of rationality, provided it is coupled with an assumption of "caution" (that no opponent move is deemed impossible).** The standard preference for strict dominance is an artifact of wanting clean theorems, not a reflection of how rational agents actually reason under uncertainty.

  To see why the strict/weak divide is artificial, we must look closely at the role of mixed strategies. In the standard story, strict dominance is pure logic. If strategy $C$ yields lower payoffs than strategy $A$ against every column, $C$ is irrational. But as the first example demonstrates, $C$ is often not dominated by any *pure* strategy. In the game where $A$ beats $X$, $B$ beats $Y$, and $C$ is mediocre everywhere, $C$ survives pure strict elimination. It is only when we allow the row player to randomize—playing a 50/50 mix of $A$ and $B$—that $C$ becomes strictly dominated.

  This is a crucial, often glossed-over detail. To accept IESDS as the "real" rationality test, you must accept that rational agents not only can randomize but *should* randomize to dominate inferior options. This imposes a heavy cognitive burden: the player must be capable of constructing complex mixed strategies and calculating expected utilities against them. If we grant players this level of sophistication for strict dominance, why do we suddenly treat them as epistemic infants when discussing weak dominance?

  The epistemic argument for strict dominance is that a strictly dominated strategy is never a best response to *any* belief. The argument against weak dominance is that a weakly dominated strategy *can* be a best response, provided you assign probability zero to the specific opponent actions where the strategy underperforms. The textbook conclusion is that assigning zero probability is permissible, so weak dominance is unsafe. But this ignores the reality of strategic uncertainty. In any non-trivial strategic interaction, assigning exactly zero probability to an opponent's move is an act of extreme arrogance, not rationality. It assumes the opponent is incapable of error, experimentation, or irrationality.

  If we accept the sophistication required for mixed strict dominance, we should logically accept that a rational player holds "full support" beliefs—they acknowledge a vanishingly small chance that the opponent might play anything. Under this condition of "caution," a weakly dominated strategy is *never* a best response. In the second example, where $T$ weakly dominates $M$, $M$ is only a best response if the column player plays $L$ with probability 1. If there is even a tiny "tremble" of probability on $R$, $T$ strictly outperforms $M$. Therefore, the elimination of $M$ is not a violation of rationality; it is a refinement of it. The fact that $(M, L)$ is a Nash equilibrium is irrelevant if that equilibrium relies on the column player never making a mistake and the row player believing that mistake is impossible.

  The textbook's primary objection to weak dominance is procedural: order matters. In the second example, deleting the strictly dominated column $R$ first renders $T$ and $M$ equivalent, saving $M$. Deleting the weakly dominated row $M$ first kills it. This order dependence is real, but it is a symptom of the *procedure*, not the *principle*. The procedure fails because it treats elimination as absolute certainty. Once you delete $R$, you tell the row player, "You can be 100% sure $R$ will not happen." This creates a self-fulfilling prophecy where $M$ becomes rational.

  However, if we view weak dominance through the lens of "trembling hand" perfection, the order dependence resolves. We should not eliminate strategies based on the reduced game alone; we should eliminate them based on the original game's structure under the assumption that all strategies remain possible with infinitesimal probability. If we adopt a rule that **weak dominance is only valid when it survives the assumption of full-support beliefs**, we recover order independence. We simply ask: "Is this strategy weakly dominated in the original game, assuming every opponent action has non-zero weight?" If yes, it goes. If no, it stays. This prevents the premature deletion of $R$ from validating $M$, because $M$ was already inferior in the full game given any risk of $R$.

  Therefore, the practical verdict is clear. The textbook insistence on strict dominance as the sole guardian of rationality is inconsistent with the allowance of mixed strategies. Mixed strict dominance already bridges the gap to weak dominance by requiring players to optimize against distributions rather than certainties. Consequently, we should not treat weak dominance as a rough heuristic to be avoided. Instead, we should adopt **Iterated Elimination of Weakly Dominated Strategies as the standard solution concept**, but with a critical constraint: **elimination is only permissible if the dominance holds under the assumption that all opponent strategies have positive probability.**

  In practice, this means when solving a game, you do not simply delete weakly dominated strategies in the reduced matrix. You check against the original matrix. If a strategy is weakly dominated only because you previously deleted an opponent's strategy that was itself weakly dominated, you must pause. You must verify that the opponent's deleted strategy was truly irrational under a "cautious" belief system. If the chain of elimination relies on assigning zero probability to a move that was only weakly dominated (not strictly), the chain is broken.

  This approach preserves the power of weak dominance to refine equilibria—correctly identifying that $(M, L)$ in the second example is fragile and unstable—while avoiding the trap of order dependence. It acknowledges that rationality is not just about maximizing payoff against what *will* happen, but maximizing payoff against what *could* happen. The textbooks favor strict dominance because it is mathematically tidy; it doesn't require us to model the "could." But strategy is inherently about the "could." A rational player fears the tremble. A rational player knows that if a strategy is weakly dominated, there is another strategy that does at least as well in every case and better in some. To play the weakly dominated strategy is to bet that the "better in some" case will never occur. That is not rationality; that is gambling on the opponent's perfection.

  We should stop treating strict dominance as the only safe harbor. It is only safe because it ignores the complexity of mixed strategies and the reality of uncertainty. Weak dominance, properly constrained by an assumption of caution, is the sharper tool. It cuts away the equilibria that rely on brittle assumptions of zero-probability events. In solving games, we should eliminate weakly dominated strategies first, provided we verify they are dominated even when the opponent is assumed to be fallible. If the elimination order changes the outcome, it is a signal that the game relies on fragile beliefs, and the solution should be reported as a set of Perfect Equilibria rather than a single dominance-solvable point. The "messiness" of weak dominance is not a bug; it is a feature that reveals the instability of certain strategic arrangements. We should embrace the mess, rather than hide behind the false cleanliness of strict dominance.
