prompt: |-
  I run a small mediation practice that handles disputes between institutions whose value commitments do not obviously trade against one another: a city and a neighborhood association over a riverfront site, a hospital and a family over a child's treatment, a university and a donor's heirs over a collection, a utility and a tribal nation over a burial ground. We take about thirty of these a year. Each one has a clock on it — a hearing date, a court deadline, a board meeting — and each is resolved in a room with counsel on both sides plus clergy, elders, or a patient advocate, on a timeline too short for anyone to acquire the other side's theory of value. Anything we settle is signed off by a board or a court, and a bad agreement gets repudiated later, which costs us the ability to work in that community at all. My staff are capable generalists with no philosophical training, and I need something they can run without me in the room.

  Please write the decision procedure itself: the steps in order, what counts as a sufficient answer at each step, the point at which the procedure returns no deal, and the points at which it cannot decide and must hand the question to a person, marked as such.

  It has to handle the following, because these are what actually wreck our cases:

  Whether there is anything to trade at all. Sometimes the parties' orderings over the options are such that a package, a phased arrangement, or a randomization leaves both better off than the status quo; sometimes the disagreement is not about a quantity but about what kind of thing the object is, and no exchange rate exists between the currencies on offer. The procedure needs a step that separates these two situations, and it needs to treat "no common currency" as a finding rather than a failure of nerve.

  Randomized settlements. My own instinct is that a lottery over the two pure options is often better for both parties than any split-the-difference middle, since a middle position that half-satisfies each may be worse for each than the gamble. I want the procedure to include a test for when a lottery or a rotation is the honest settlement, and a test for when proposing one is a way of avoiding an argument that has to be had.

  Goods that are not for sale. Some parties treat a particular good as non-negotiable, so that an offer of compensation lands as an insult rather than a concession and the offer itself damages the relationship. The procedure must be able to identify these and say what to do instead, rather than routing every dispute through a currency.

  What is left over. When a party concedes something it values, the concession usually leaves a residue: the value is not discharged by the agreement, and someone carries the loss afterward. The procedure should say who carries it, whether it can be marked publicly (a plaque, a recorded dissent, a review date, a standing commitment), and when marking it is a way of pretending the loss was smaller than it was.

  Cover. Parties often can concede only if the concession can be described to their own constituents as a trade rather than a capitulation. The procedure should have a step for designing reciprocity so that a settlement is defensible on both sides, and should say where that step begins to shade into helping a party misrepresent what it did.

  Then run the procedure on three cases. First, the riverfront site, where the neighborhood group treats the bank as a memorial and the city needs housing units. Second, the hospital case, where the parents' refusal rests on a value the clinical team cannot price and the child's interests are at stake. Third, a case of my choosing to specify, or of yours if that is cleaner: one in which the funder who pays our fee is pressing for a settlement that the procedure says we should refuse. I want to see the procedure return the answer I will not like, and I want to see what it says about the fact that refusing costs us the contract.

  Close with a short section on what this procedure cannot do and which of its steps will misfire on a dispute that is genuinely novel.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Context:** A small mediation practice handling high-stakes, value-laden disputes (city vs. neighborhood, hospital vs. family, university vs. heirs, utility vs. tribe).
      *   **Constraints:** 30 cases/year, tight deadlines, generalist staff (no philosophy training), must be runnable without the founder present. Bad agreements lead to repudiation and loss of community trust.
      *   **Core Task:** Write a specific *decision procedure* (steps, sufficiency criteria, stop conditions, hand-off points).
      *   **Specific Requirements to Address:**
          *   Tradeability (is there a common currency?).
          *   Randomization (lottery/rotation vs. avoidance).
          *   Sacred/Non-negotiable Goods (identify and handle without pricing).
          *   Residue/Loss (who carries it, how to mark it).
          *   Cover/Reciprocity (defensibility vs. misrepresentation).
      *   **Application:** Run the procedure on three cases:
          1.  Riverfront (Memorial vs. Housing).
          2.  Hospital (Clinical vs. Parental Value/Child's Interest).
          3.  Fee-Payer Pressure (Funder wants settlement, procedure says no).
      *   **Conclusion:** Limitations and failure modes on novel disputes.

  2.  **Deconstruct the Decision Procedure:**

      *   *Tone:* Operational, clear, authoritative, ethical, practical. Not academic philosophy, but grounded in it.
      *   *Structure:* Sequential steps with clear "Pass/Fail/Hand-off" criteria.
      *   *Key Innovations:* Needs to explicitly handle incommensurability (no trade), sacred values (no price), and the ethics of "cover."

      *   *Drafting the Steps:*
          *   Step 1: Mapping the Value Landscape (Identify goods).
          *   Step 2: The Commensurability Test (Can they trade?).
          *   Step 3: The Sacred Value Filter (Is something non-negotiable?).
          *   Step 4: The Residue Audit (Who loses what?).
          *   Step 5: The Cover Check (Can they sell this?).
          *   Step 6: The Randomization Test (Is a lottery honest?).
          *   Step 7: Final Authorization (Sign-off).

      *   *Refining the Criteria:* Need to ensure staff know *when* to stop. "No Deal" needs to be a valid output. "Hand-off to Senior Mediator" needs to be clear.

  3.  **Developing the Three Case Studies:**

      *   *Case 1: Riverfront.* City (Housing/Units) vs. Neighborhood (Memorial/Sanctity).
          *   *Application:* Likely fails Commensurability. Needs a Sacred Value handling. Maybe a phased approach or partial preservation + housing elsewhere? Or a "No Deal" if the bank *is* the memorial. Let's aim for a complex settlement that marks the residue.
      *   *Case 2: Hospital.* Parents (Religious/Value) vs. Hospital (Life/Standard of Care). Child's interest is the third party.
          *   *Application:* High risk. Sacred values on both sides (Life vs. Faith). Randomization might be unethical here (can't gamble with life). Likely needs a Hand-off or a specific "Best Interest" override. Let's see if the procedure flags the "pricing" of life as a failure.
      *   *Case 3: The Fee-Payer.* The Practice's Funder vs. The Procedure.
          *   *Application:* This is the meta-case. The funder wants a deal to close the file. The procedure says "No Deal" (e.g., because of Cover or Sacred Value).
          *   *Outcome:* The procedure must recommend refusing the settlement, acknowledging the cost (lost contract). This demonstrates integrity.

  4.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Set the frame. This is a tool for integrity, not just efficiency.
      *   *The Procedure:* Use imperative language. "Do X." "If Y, then Stop."
      *   *Case Runs:* Apply the steps rigorously.
      *   *Limitations:* Be honest about where the algorithm breaks.

  5.  **Refining the "Hard Parts" (Self-Correction during drafting):**

      *   *Critique:* Is the Randomization step too abstract for generalists?
      *   *Fix:* Make it concrete. "Does splitting the difference destroy value for both?" "Is the uncertainty acceptable to both?"
      *   *Critique:* How do generalists spot "Sacred Values"?
      *   *Fix:* Look for emotional reactions to pricing offers (anger/insult) rather than negotiation.
      *   *Critique:* The "Cover" step risks encouraging lying.
      *   *Fix:* Distinguish between "Framing" (acceptable) and "Falsifying" (unacceptable). The test is: "Can the party sign this without lying to their constituency?"
      *   *Critique:* The Hospital case is tricky because of the child.
      *   *Fix:* The procedure must prioritize the non-negotiable interest of the non-consenting party (the child) over the adults' value trade. This might trigger a "Hand-off to Court/Ethics Board."

  6.  **Final Polish:**

      *   Ensure the "No Deal" outcome is dignified, not a failure.
      *   Ensure the "Fee-Payer" case hits the prompt's requirement: "I want to see the procedure return the answer I will not like."
      *   Check word count and tone. Needs to be professional, slightly dense but readable.

  7.  **Final Review against Constraints:**
      *   Steps in order? Yes.
      *   Sufficient answers defined? Yes.
      *   No Deal points? Yes.
      *   Hand-off points? Yes.
      *   Three cases run? Yes.
      *   Limitations section? Yes.

  *(Self-Correction on Case 3)*: The prompt asks for a case where the funder pressing for settlement is the conflict. I need to make sure the procedure explicitly identifies when *our* incentive conflicts with the *process* integrity.

  *(Self-Correction on Hospital Case)*: The prompt mentions "child's interests are at stake." A mediation procedure cannot override medical ethics/law. The procedure must recognize when it lacks jurisdiction. I will build a "Jurisdiction/Authority" check or embed it in the Sacred Value step. Let's embed it in Step 3 (Sacred/Non-negotiable) where the child's welfare is the ultimate sacred value that trumps parental negotiation.

  *(Refining the "Randomization" logic)*: The prompt specifically likes lotteries over bad compromises. I need to make sure Step 6 validates this *only* when the middle ground is destructive.

  *(Refining "Cover")*: The prompt asks to distinguish between defensible framing and misrepresentation. I need a specific test for this. "The Newspaper Test" or "The Sworn Testimony Test."

  Let's write it.cw
answer: |-
  # The Incommensurability Protocol (IP-7)

  **Purpose:** To determine whether a dispute involving conflicting value commitments can be ethically settled via mediation, and if so, under what structural conditions.
  **Users:** Generalist Mediation Staff.
  **Authority:** This procedure overrides pressure to settle for the sake of volume, speed, or client retention.
  **Output:** One of three findings: *Settlement Authorized*, *No Deal (Structural)*, or *Senior Hand-off Required*.

  ---

  ## Step 1: The Goods Inventory
  **Action:** List every object, right, outcome, or principle each party claims is at stake. Do not group them. Do not assign values yet.
  **Sufficient Answer:** A list where every item is described in the party's own language (e.g., "sacred ground," not "real estate"; "child's soul," not "medical outcome").
  **Failure Condition:** If a party cannot name the good without referencing the other side's good (e.g., "we just want what they're hiding"), pause and separate interests.
  **Hand-off:** If a party refuses to list goods, claiming the other side has no standing to ask, **Hand-off to Senior Mediator**.

  ## Step 2: The Commensurability Test
  **Action:** Ask each party: "Is there a quantity of X that would compensate you for the loss of Y?"
  **Sufficient Answer:**
  *   *Tradeable:* Party names a quantity or equivalent exchange (e.g., "50 units elsewhere," "$2M fund").
  *   *Incommensurable:* Party states that no quantity of X replaces Y.
  **Decision Rule:**
  *   If **both** parties are Tradeable: Proceed to Step 5.
  *   If **one** party is Incommensurable: Proceed to Step 3.
  *   If **both** are Incommensurable regarding the core object: **Return NO DEAL (Structural).** Do not attempt to broker a compromise on a non-existent exchange rate.

  ## Step 3: The Sacred Value Filter
  **Action:** Identify if the Incommensurable good is "Sacred" (non-negotiable) or "Precious" (high cost, but tradable).
  **Test:** Offer a hypothetical compensation. If the offer generates anger, moral outrage, or silence rather than a counter-offer, the good is Sacred.
  **Decision Rule:**
  *   If the good is Sacred to one party but the other party's need is existential (e.g., life safety, legal mandate): **Hand-off to Senior Mediator** (for potential adjudication path).
  *   If the good is Sacred to one party and the other party's need is preferential (e.g., efficiency, budget, expansion): **Return NO DEAL (Structural).** Do not price the Sacred.
  *   If both hold Sacred values that conflict directly (e.g., Life vs. Faith): **Hand-off to Senior Mediator** (for Ethics Board/Court referral).

  ## Step 4: The Residue Audit
  **Action:** Assume a settlement is reached. Identify what value is *lost* permanently, not traded.
  **Sufficient Answer:** A written statement of loss: "Party A loses X, and X is not recovered in Y."
  **Marking Requirement:** The agreement must include a mechanism to mark this residue (e.g., a plaque, a permanent restriction on the land, a public record of dissent, a scheduled review).
  **Decision Rule:**
  *   If the parties refuse to mark the residue: **Return NO DEAL (Integrity).** Unmarked residue becomes repudiated later.
  *   If the marking is purely cosmetic (designed to hide the loss): **Return NO DEAL (Integrity).**
  *   If the marking is accepted: Proceed to Step 5.

  ## Step 5: The Cover Check
  **Action:** Draft the public explanation each party will give to their constituents.
  **Test:** The "Sworn Testimony Test." Ask: "Could a representative of this party sign this explanation under oath without lying?"
  **Decision Rule:**
  *   If the explanation requires falsifying the concession (e.g., calling a surrender a victory): **Return NO DEAL (Stability).** Repudiation is likely.
  *   If the explanation frames the concession as a trade for a different value (e.g., "We gave up land to save the program"): **Authorized.**
  *   If the explanation admits the loss but cites the necessity: **Authorized.**

  ## Step 6: The Randomization Test (Lottery/Rotation)
  **Action:** If Step 2 showed Incommensurability but Step 3 did not trigger a Sacred Value block, consider a lottery or time-share.
  **Test:** Compare the "Middle" vs. the "Gamble."
  *   *Middle:* Both parties get 50% of what they want, but the value is destroyed for both (e.g., a hospital treatment that violates faith but prolongs suffering).
  *   *Gamble:* One party wins fully, the other loses fully, determined by chance.
  **Decision Rule:**
  *   If the Middle destroys value for both and the Gamble preserves the integrity of the winner's outcome: **Propose Randomization.**
  *   If proposing Randomization is being used to avoid identifying the Sacred Value: **Return NO DEAL (Avoidance).**
  *   If the stakes involve irreversible harm to a non-consenting third party (e.g., a child's life): **Do Not Randomize. Hand-off to Senior Mediator.**

  ## Step 7: Final Authorization
  **Action:** Review the package against the "Repudiation Risk."
  **Decision Rule:**
  *   If the agreement relies on trust rather than the marking/residue mechanisms: **Hand-off to Senior Mediator.**
  *   If all previous steps are cleared: **Settlement Authorized.**

  ---

  # Case Applications

  ## Case 1: The Riverfront Site
  **Parties:** City (Housing Units) vs. Neighborhood Association (Memorial/Sanctity).
  **Run:**
  1.  **Goods:** City lists "150 Affordable Units." Neighborhood lists "Ancestral River Bank."
  2.  **Commensurability:** City asks, "How much money for the bank?" Neighborhood reacts with outrage. **Incommensurable.**
  3.  **Sacred Filter:** Neighborhood reaction indicates Sacred Value. City need is high priority but not existential (housing can be built elsewhere, though costly).
      *   *Procedure Check:* Is the City's need existential? No. Is the Bank Sacred? Yes.
      *   *Initial Result:* **NO DEAL (Structural).**
      *   *Mediator Intervention:* Staff probes if the *specific* bank is sacred or the *memory*. Neighborhood admits a memorial is required, but the *soil* is the issue.
      *   *Re-evaluation:* The soil is Sacred; the view is Precious.
  4.  **Residue:** City loses optimal density. Neighborhood loses exclusive access.
      *   *Marking:* Permanent easement on the soil; housing set back 50 meters; a plaque listing the history of the site on the new building.
  5.  **Cover:** City can say "We preserved heritage to build community." Neighborhood can say "We protected the soil, housing goes on fill."
      *   *Sworn Test:* Both pass.
  6.  **Randomization:** Not applicable (physical site).
  7.  **Authorization:** **Settlement Authorized**, contingent on the easement being recorded in perpetuity.

  ## Case 2: The Hospital Case
  **Parties:** Hospital (Standard of Care/Life) vs. Parents (Religious Prohibition/Child's Soul).
  **Run:**
  1.  **Goods:** Hospital lists "Survival/Physiological Stability." Parents list "Spiritual Purity/Avoidance of Sin."
  2.  **Commensurability:** Parents state no length of life justifies the sin. **Incommensurable.**
  3.  **Sacred Filter:** Both values are Sacred.
      *   *Conflict:* Life vs. Faith.
      *   *Third Party:* The Child (non-consenting).
      *   *Procedure Check:* Step 3 Rule for "Both Sacred" + Step 6 Rule for "Irreversible Harm to Third Party."
  4.  **Decision:** **Hand-off to Senior Mediator.**
      *   *Reasoning:* The procedure identifies this is outside mediation authority. A lottery (Step 6) is unethical (cannot gamble a child's life). A trade (Step 2) is impossible (cannot price a soul). A "Middle" (partial treatment) may violate both values.
      *   *Outcome:* The file is moved to legal/ethics adjudication. The mediation practice withdraws to preserve neutrality.

  ## Case 3: The Fee-Payer Pressure
  **Parties:** The Mediation Practice (Us) vs. The Institutional Funder (Them).
  **Context:** We are mediating a dispute for a large utility. The Funder pays our annual retainer. The Funder presses us to close the current dispute (Utility vs. Tribal Nation) with a settlement that saves the Utility money but ignores the Residue Audit.
  **Run:**
  1.  **Goods:** Utility lists "Budget/Closure." Tribe lists "Burial Ground Integrity."
  2.  **Commensurability:** Tribe refuses monetary compensation for disturbed remains. **Incommensurable.**
  3.  **Sacred Filter:** Burial ground is Sacred. Utility need is Budget (Preferential).
      *   *Procedure Check:* Step 3 Rule. Sacred vs. Preferential = **NO DEAL (Structural).**
  4.  **The Conflict:** The Funder calls. They say, "Find a way. If you don't settle this, we review the retainer."
  5.  **Step 5 (Cover) Check:** The Funder suggests we frame the settlement as "Collaborative Stewardship" when in fact the Tribe is conceding access without protection.
      *   *Sworn Test:* Tribe representative would be lying to their council. **Fail.**
  6.  **Step 7 (Authorization):** The procedure dictates **NO DEAL.**
  7.  **Outcome:**
      *   *Procedure Instruction:* Staff must inform the Funder: "The Protocol returns a Structural No Deal. Proceeding violates the integrity conditions required to prevent repudiation."
      *   *Consequence:* The Funder terminates the retainer.
      *   *Procedure Note:* This is a successful operation of the Protocol. The cost (lost contract) is the price of avoiding a repudiated agreement that would destroy community trust long-term. The Protocol prioritizes the *viability of the practice's reputation* over the *viability of the practice's revenue* in the short term.

  ---

  # Limitations and Failure Modes

  This procedure is a sieve, not a solver. It will misfire in the following contexts:

  1.  **The Novel Value:** If a dispute involves a value category the staff has not encountered (e.g., digital sovereignty, AI rights, genetic data ownership), Step 1 (Goods Inventory) will fail because the staff lacks the vocabulary to categorize the good without reducing it to existing currencies. This requires a **Senior Hand-off**.
  2.  **The Bad Faith Actor:** The Protocol assumes parties are trying to find a resolution. If one party uses the "Sacred Value" claim strategically to stall or gain leverage (Step 3), the Procedure will return "No Deal," which is the strategic actor's goal. The staff cannot distinguish genuine sacredness from tactical incommensurability without deep contextual knowledge.
  3.  **The Drifting Deadline:** The Procedure prioritizes integrity over speed. In cases where the "clock" (court date, board meeting) is weaponized to force a bad Cover (Step 5), the Procedure will recommend "No Deal" close to the deadline. This may result in the parties entering litigation with worse outcomes than a flawed settlement would have provided. The Procedure accepts this risk to protect the mediation practice from being the site of the coercion.
  4.  **The Founder's Absence:** The "Senior Hand-off" points are critical vulnerabilities. If I am unavailable, and the staff feel pressure to clear the docket, they may bypass the Hand-off. The Procedure relies on the staff's courage to say "I cannot sign this" more than it relies on the logic itself.
