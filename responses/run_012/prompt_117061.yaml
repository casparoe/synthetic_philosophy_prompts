prompt: |-
  My sister is a chef and we got into it over Thanksgiving about whether a dish can be actually good or whether that's just her opinion, and she ended it with 'beauty is in the eye of the beholder' like it was a mic drop. (She also threw in 'taste is in the tongue of the taster', which I'm pretty sure she made up on the spot.) Then in a design class my TA said Hume thought there really is a standard of taste, which sounds like the exact opposite of what my sister said, and both of them act like it's obviouse.

  I want to know what 'beauty is in the eye of the beholder' could actually be claiming. Not one reading, the whole menu, from the boring one (people like different things, thats all) up to the ones that are doing real work. Things I keep tripping over:

  - Is it a claim about what beauty IS (a feeling in me rather than a property of the painting), or about how I could ever know whether my judgement is right, or about what the sentence 'this is beautiful' is doing when I say it (reporting a fact about me? expressing a feeling? something else entirely)?
  - Does it say anything about disagreement? Two of us both say the soup is delicious, neither of us is mistaken, and we're not just talking about ourselves -- is that even coherent, and is that the sort of thing the slogan is meant to license?
  - Whose eye? If the beholder's eye can be trained (my sister swears it's like wine tasters), does the slogan collapse into the opposite of itself, i.e. a standard, just a local one or an expert one?

  For each reading, tell me whether it's trivially true, substantive and defensible, or just false, and whether it actually supports what my sister used it for, which was to end the argument by making 'this dish is better than that one' meaningless. And which of the readings is Hume closest to, given that he thinks taste is a sentiment but still wants a standard? A numbered list I can bring to office hours would be ideal.
reasoning: |-
