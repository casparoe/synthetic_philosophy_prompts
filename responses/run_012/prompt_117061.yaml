          *   *Sister's use:* Strong support. If "better" just means "I prefer," then "objectively better" is nonsense.
      *   *Reading 3: The Ontological Claim (Secondary Qualities).* Beauty is like color or taste (Locke/Hume). Not in the object, but caused by it.
