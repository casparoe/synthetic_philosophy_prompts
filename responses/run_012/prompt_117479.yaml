      *   *Refining the "Audit":* The key is that Adela, the auditor, breaks. She realizes she doesn't know. But the system forces a verdict anyway.

  9.  **Final Structure:**
      *   **Introduction:** Frame the novel as a tribunal on Mill's epistemic claim.
      *   **Characters:** Ronny (failed trustee, order over improvement), Fielding (ideal trustee, isolated/ineffective), Adela (the broken audit).
      *   **The Test:** Analyze if the test is ever met (Fielding/Aziz friendship as private success, public failure).
