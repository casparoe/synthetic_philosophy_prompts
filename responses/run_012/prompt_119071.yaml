answer: |-
  # DECISION TREE: RESOLUTIONS TO ST. PETERSBURG

  **ROOT NODE:** **If the bank had infinite money and the coin was perfect, would the paradox remain?**
  *   **No (It vanishes):** The infinity is an artifact of the **Setup**. The problem is not how we decide, but that the game cannot exist as described.
  *   **Yes (It remains):** The infinity is an artifact of the **Rule**. The game is mathematically coherent; the problem is how we value it.

  ---

  ## BRANCH A: SETUP ARTIFACT (The game is not well-posed)

  **NODE A1:** **Does the price change if I tell you the bank uses a physical coin versus a random number generator?**
  *   **Yes:** The mechanism matters, not just the distribution.
      *   **LEAF 1: PROCESS MATTERS.**
      *   *Awkward Commitment:* You must value two identical probability distributions differently based on the causal history of the money.
      *   *Variant Stress:* Dissolves Variant 1 (Finite EV) immediately; Variant 2 (Rearrangement) is irrelevant because the abstract series doesn't dictate value.
  *   **No:** The mechanism doesn't matter, only the physical limits do.
      *   **NODE A2:** **Do you treat probabilities smaller than 1 in $10^{100}$ as exactly zero?**
          *   **Yes:** Small probabilities are epistemically inaccessible.
              *   **LEAF 2: EPISTEMIC CUTOFF.**
              *   *Awkward Commitment:* You treat physically possible events as impossible if they are rare enough, creating a discontinuity in risk assessment.
              *   *Variant Stress:* Swallows Variant 1 easily; Variant 2 is blocked because the tail required for rearrangement is truncated.
          *   **No:** Probabilities are real, but payouts hit a wall.
              *   **LEAF 3: PHYSICAL CUTOFF.**
              *   *Awkward Commitment:* You value the game as a finite truncation, meaning the "St. Petersburg Game" is just a label for a specific finite lottery.
              *   *Variant Stress:* Both variants become standard finite lotteries; the paradox is declared a category error.

  ---

  ## BRANCH B: RULE ARTIFACT (The game is well-posed)

  **NODE B1:** **Is there a definite cash amount you consider equivalent to the game?**
  *   **No:** The value does not settle on a number.
      *   **LEAF 4: NO FACT OF THE MATTER.**
      *   *Awkward Commitment:* Rational agents can disagree infinitely on the price without either making a mistake, because no fair price exists.
      *   *Variant Stress:* Variant 1 forces a price (EV=1), contradicting the leaf; Variant 2 strongly supports this leaf (series is conditionally convergent).
  *   **Yes:** There is a specific price you would pay.
      *   **NODE B2:** **Do you calculate that price by averaging the utilities of the outcomes?**
          *   **No:** You use a different summary statistic.
              *   **NODE B3:** **Do you focus on the most likely result or the safest result?**
                  *   **Most Likely (Median/Mode):**
                      *   **LEAF 5: TYPICAL OUTCOME.**
                      *   *Awkward Commitment:* You ignore the tail of the distribution entirely, even when it mathematically dominates the sum.
                      *   *Variant Stress:* Survives both variants; in Variant 1, you still ignore the finite but large outliers.
                  *   **Safest (Worst-Case):**
                      *   **LEAF 6: SAFETY FIRST.**
                      *   *Awkward Commitment:* You value a game with infinite expected value at exactly $2 (the first flip payoff) because that is the guaranteed minimum.
                      *   *Variant Stress:* Survives both variants; renders the difference between infinite and finite EV irrelevant.
          *   **Yes:** You maximize Expected Utility.
              *   **NODE B4:** **If I double every payoff in the game, does your valuation hit a hard ceiling?**
                  *   **Yes:** There is a maximum amount of good an outcome can provide.
                      *   **LEAF 7: BOUNDED UTILITY.**
                      *   *Awkward Commitment:* There is some amount of money so good that getting twice that much is not better at all.
                      *   *Variant Stress:* The most robust leaf; survives Variant 1 (finite EU) and Variant 2 (absolute convergence guarantees a sum).
                  *   **No:** Utility grows forever, but slowly.
                      *   **NODE B5:** **If the expected value were infinite, would you borrow money to play?**
                          *   **Yes:** You follow the expectation regardless of the cost.
                              *   **LEAF 8: PAY UP.**
                              *   *Awkward Commitment:* You should be indifferent between having the game and having a million dollars plus the game, and you should hand over a million for something whose most likely payoff is two dollars.
                              *   *Variant Stress:* Collapses in Variant 1 (EV is finite, so you pay the finite amount); Breaks in Variant 2 (Expectation is undefined/rearrangeable).
                          *   **No:** You value the infinite sum at a finite price.
                              *   **LEAF 9: SLOW GROWTH.**
                              *   *Awkward Commitment:* You value the 100th doubling less than the 1st, but you never stop valuing it, relying on a specific logarithmic curve to save you.
                              *   *Variant Stress:* Survives Variant 1; Vulnerable in Variant 2 if the utility function doesn't enforce absolute convergence.

  ---

  ## SEMINAR NOTES: GAPS & OVERLAPS

  **Empty/Incoherent Combinations:**
  *   **Unbounded Utility + Safety First:** Technically possible, but unattractive. If utility is unbounded, why ignore the upside entirely? This position is usually occupied by people who actually have bounded utility but haven't admitted it.
  *   **Pay Up + No Fact of Matter:** Incoherent. You cannot simultaneously claim the price is infinite and that there is no price.

  **Indistinguishable Leaves:**
  *   **Leaf 2 (Epistemic Cutoff) vs. Leaf 3 (Physical Cutoff):** In practice, these yield identical prices. The distinction is purely metaphysical (whether the probability is *zero* or whether the *payoff* is zero).
  *   **Leaf 8 (Pay Up) vs. Leaf 9 (Slow Growth):** If the logarithmic growth is slow enough, these are empirically indistinguishable for any finite bankroll. They only separate in the limit or in Variant 2.

  **Variant Handling Summary:**
  *   **Variant 1 (Finite EV, $1/4^n$):** Kills **Leaf 4** (No Fact of Matter) because a fact *does* exist (EV=1). Forces **Leaf 8** (Pay Up) to act like a standard EV maximizer. Leaves **Leaf 7** (Bounded Utility) and **Leaf 5/6** (Typical/Safety) unchanged.
  *   **Variant 2 (Rearrangement/Conditionally Convergent):** Kills **Leaf 8** (Pay Up) because linearity of expectation fails. Strongly validates **Leaf 4** (No Fact of Matter). **Leaf 7** (Bounded Utility) is the only "Pay a Price" leaf that survives without modification, as bounded utility ensures absolute convergence.
