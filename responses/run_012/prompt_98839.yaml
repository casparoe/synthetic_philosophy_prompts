answer: |-
  **Final Examination: Practical Rationality and Intention**
  **Question 4**

  Consider the following four scenarios. Read them carefully; you may assume all stated conditions hold.

  **The Original Scenario:** At midnight tonight a device will scan you and, if and only if it detects that you now intend to swallow a vial of toxin at noon tomorrow, will transfer one million dollars to your account. The scan is perfectly reliable. Nothing compels you to act after midnight; you remain free to change your mind. The toxin will make you violently ill for a day — ill enough that you would not undergo it merely to keep a million dollars already in hand — and the money depends only on the midnight intention, not on what you do at noon. The familiar tension is that you appear to have a reason to intend (the money) while being unable to intend, since you know that at noon you will have no reason to drink and therefore that any state you manufactured at midnight would not be a genuine intention.

  **Variant R (the Reimburser):** Everything is as in the original, except that a second party will pay you a further million if and only if you actually swallow the toxin at noon.

  **Variant S (the Surety):** Everything is as in the original, except that before midnight you may sign a costless, irrevocable contract under which a third party will, at noon tomorrow, physically compel you to swallow the toxin should you not do so voluntarily.

  **Variant P (the Craving):** Everything is as in the original, except that you know that at eleven tomorrow morning you will be given a drug that will fill you with an overwhelming craving for the toxin, so that at noon you will want nothing more than to drink it.

  **Task:**

  1.  **Isolate the Tension:** Do not retell the story. State the tension in the Original Scenario as a conflict among three specific premises regarding intention, reason, and action. (5 marks)
  2.  **Analyze the Variants:** For each Variant (R, S, and P), determine whether the tension survives. Identify exactly which single feature of the Original Scenario the variant alters to produce this result. Treat each variant as an experimental modification isolating a variable. (15 marks)
  3.  **Forced Choice:** Based on your analysis, select exactly one of the following readings and defend it. Explain how the variant you found most revealing supports your choice.
      *   (i) The puzzle shows intentions are not under our direct voluntary control.
      *   (ii) The puzzle shows the reasons governing the formation of an intention differ from those governing the performance of the intended act.
      *   (iii) The puzzle shows the scenario is incoherent and no genuine intention could exist in it. (5 marks)

  ***

  **Model Answer**

  The tension in the Original Scenario arises from a contradiction between three plausible premises. First, the *Intention-Belief Constraint*: one cannot intend to X while believing one will not X. Second, the *Reasons-Action Principle*: a rational agent will not perform X at noon unless they have a sufficient reason to do so at noon. Third, the *Scenario Stipulation*: at noon, the money is already secured (or lost), and the toxin causes illness without benefit, providing no reason to drink. Taken together, the agent knows at midnight that at noon they will lack a reason to drink (Premise 3), and thus will not drink (Premise 2). Consequently, they cannot believe they will drink, and by Premise 1, cannot intend to drink. Yet, they have a decisive reason at midnight to form that intention. The conflict is between the rationality of forming the intention and the impossibility of satisfying the conditions required to hold it.

  In Variant R, the tension dissolves. The variant alters the *ex-post incentive structure*. By adding a second million conditional on performance, the agent has a sufficient reason at noon to swallow the toxin. Premise 3 is falsified; there is now a reason to act. Because the agent knows they will have a reason to drink at noon, they can sincerely believe they will drink at midnight, satisfying the Intention-Belief Constraint. The variable isolated here is the alignment of reasons at the time of action with reasons at the time of intention.

  In Variant S, the tension also dissolves, but via a different mechanism. This variant alters the *volitional freedom at noon*. By signing the contract, the agent ensures that the toxin will be swallowed regardless of their noon desires. The Intention-Belief Constraint is satisfied because the agent believes the swallowing will occur (due to compulsion), not necessarily because they intend to do it voluntarily. However, strictly speaking, this transforms the mental state from an intention to act into a prediction of being acted upon. The variable isolated is the condition of free agency; removing the freedom to refrain removes the barrier to believing the act will occur.

  In Variant P, the tension dissolves by altering the *psychological state at noon*. The drug ensures the agent will desire to drink the toxin. This falsifies Premise 2 (the Reasons-Action Principle) in its standard form, as the craving constitutes a sufficient reason (or motive) to act. The agent can intend at midnight because they know their future self will be motivated to comply. The variable isolated is the stability of preference; the puzzle relies on the assumption that preferences remain constant and rational across time.

  I select reading (ii): the reasons governing the formation of an intention differ from those governing the performance of the intended act. Variant R is the most revealing here. In the Original, the reason to intend (money) is decoupled from the reason to act (none). In Variant R, coupling the reward to the act aligns the reasons, making intention possible. This demonstrates that the barrier to intention is not a metaphysical lack of voluntary control (rejecting i), nor a logical incoherence in the concept of intention itself (rejecting iii). Rather, the impossibility arises specifically because rational intention requires an expectation of rational action. When the reasons for acting are supplied (as in R), the intention becomes rational. The puzzle does not show we cannot intend; it shows we cannot intend to act irrationally when we know we will be rational. The distinction lies in the temporal separation of the grounds for intending and the grounds for doing.

  ***

  **Marking Scheme**

  **Total Marks: 25**

  **1. Isolate the Tension (5 marks)**
  *   **5:** Clearly identifies three conflicting premises (e.g., Intention requires belief/prediction of action; Action requires reason at time of action; No reason exists at time of action).
  *   **3:** Identifies the conflict but describes it narratively (e.g., "you want the money but don't want to drink") rather than structurally.
  *   **0:** Merely restates the prompt's summary of the tension.
  *   *Characteristic Error:* Retelling the story instead of extracting the logical constraints.

  **2. Analyze the Variants (15 marks: 5 per variant)**
  *   **5 (per variant):** Correctly states if tension survives (No for all three) AND identifies the specific feature altered (R: ex-post reason; S: freedom/compulsion; P: desire/preference).
  *   **3:** Correctly states outcome but identifies the feature vaguely (e.g., "R changes the money" without specifying *when* or *why* it matters).
  *   **0:** Claims tension survives or misidentifies the mechanism entirely.
  *   *Characteristic Error:* Failing to specify *which* premise the variant targets (hand-waving about "changing the situation").

  **3. Forced Choice & Defense (5 marks)**
  *   **5:** Selects one option. Defense explicitly links the choice to the analysis of a specific variant (e.g., using R to show reasons are the key variable).
  *   **3:** Selects one option but defends it with general theory unrelated to the variants provided.
  *   **0:** Hedges between options or fails to defend the choice.
  *   *Characteristic Error:* Arguing for a position (e.g., "intentions are involuntary") that the student's own variant analysis contradicted (e.g., showing intention *was* possible in R).

  **Examiner's Note on Grading Standards:**
  *   **A Range (20-25):** Treats the scenarios as experimental controls. Language is precise ("falsifies Premise 3," "aligns reasons"). The defense in Part 3 flows logically from Part 2.
  *   **B Range (15-19):** Correct conclusions but relies on narrative summary. May identify that R "helps" without explaining *why* (the alignment of ex-post reasons). Part 3 may feel tacked on.
  *   **C Range (10-14):** Struggles to isolate premises in Part 1. Treats variants as new stories rather than modifications of variables.
