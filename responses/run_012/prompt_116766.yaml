answer: |-
  You have spotted a genuine fracture in your own decision theory. To answer your first question directly: **No, there is not one principle behind all of this.** Your intuitions are currently split between two incompatible frameworks.

  Here is the diagnosis, the repair, and the predictions you asked for.

  ### 1. The Diagnosis: CDT vs. FDT
  Your intuitions are oscillating between **Causal Decision Theory (CDT)** and **Functional Decision Theory (FDT)** (or its predecessor, Timeless Decision Theory).

  *   **Your PD Intuitions (Copies, Similar Reasoners, 100-Player):** These are **FDT**. You are recognizing *logical correlation*. You understand that if your decision algorithm outputs "Cooperate," a sufficiently similar algorithm facing the same problem will also output "Cooperate." You are acting as if your decision *logically determines* theirs, even without a causal link.
  *   **Your Newcomb Intuition (Two-Boxing):** This is **CDT**. You are looking for a *causal arrow*. Since the money is already in the boxes, you reason that your action cannot physically reach back in time to move the money. Therefore, you take both.

  **The Contradiction:**
  Logically, Newcomb's Problem and the "Exact Copy" PD are isomorphic.
  *   In the **Copy PD**, your twin's action is determined by the same reasoning process you are using now.
  *   In **Newcomb**, the Predictor's placement of the money was determined by a simulation of the reasoning process you are using now.

  In both cases, a past/external event (Twin's move / Box filling) is correlated with your current decision because both stem from the same *logical function*. If you trust the logical link enough to Cooperate with a spatial twin, you must trust it enough to One-Box with a temporal twin. Currently, you are accepting logical correlation in space but rejecting it in time.

  ### 2. Which Verdict to Drop?
  To make your principles hang together, **you must drop the Two-Boxing verdict in Newcomb's Problem.**

  It is much harder to justify Defecting against an Exact Copy than it is to justify One-Boxing in Newcomb.
  *   **Why?** If you Defect against an Exact Copy, you guarantee a (Defect, Defect) outcome (payoff 1) instead of (Cooperate, Cooperate) (payoff 3). You are actively leaving utility on the table based on a technicality about "causation" that doesn't change the material outcome.
  *   **The Fix:** Adopt the principle of **Logical Correlation**. Your decision is the output of a function. Anywhere that function is run (in a twin, in a predictor's simulation, in a similar reasoner), the output will be the same. You should choose the output that yields the best result when *all* instances of that function output it.

  This principle unifies your Copy PD, Similar Reasoner, 100-Player, and (corrected) Newcomb intuitions. It also resolves the "Superrationalist Stranger": you Cooperate proportional to the probability that their reasoning function is logically isomorphic to yours.

  ### 3. Predictions for the Specific Cases

  Here is what the **Logical Correlation (FDT)** principle predicts for your two specific test cases.

  #### A. The Glitchy Copy (1% Random Defect)
  **Verdict: Cooperate.**
  Your unease is natural (it feels like you're losing "dominance"), but the math is decisive.
  Let's use standard PD payoffs: Mutual Coop = 3, Mutual Defect = 1, You Defect/They Coop = 5, You Coop/They Defect = 0.
  Because the copy is logically linked to you, your decision shifts the probabilities of *their* decision.

  *   **If you Cooperate:** There is a 99% chance they Cooperate (3 pts) and 1% chance they Defect (0 pts).
      *   Expected Value: $0.99(3) + 0.01(0) = \mathbf{2.97}$
  *   **If you Defect:** There is a 99% chance they Defect (1 pt) and 1% chance they Cooperate (5 pts).
      *   Expected Value: $0.99(1) + 0.01(5) = \mathbf{1.04}$

  Cooperating yields nearly triple the utility. The "glitch" is just noise on the signal; the signal is still strong enough to carry the weight of cooperation. You should only Defect if the noise level gets high enough that the correlation breaks (usually around 50% for standard payoffs).

  #### B. The Pre-Thinking Copy
  **Verdict: Cooperate.**
  This is a classic test of whether you believe in *algorithmic identity* or *physical history*.
  *   **The Setup:** A copy was made of your brain/code *before* you encountered this problem. They are now facing the problem for the first time, just as you are.
  *   **The Logic:** It does not matter when the hardware was instantiated; it matters what *computation* is being run. If you and the copy are running the same decision algorithm on the same input data, you will produce the same output. The fact that you "thought about it" five minutes ago and they are "thinking about it" now is irrelevant to the logical truth of the output.
  *   **The Prediction:** Since your current reasoning leads you to Cooperate (in the Copy case), the pre-thinking copy running that same reasoning will also Cooperate. Therefore, you Cooperate.

  ### Summary
  You are currently a **Functional Decision Theorist who hasn't accepted the implications for Newcomb's Problem.**

  1.  **Unifying Principle:** Act as if your decision determines the output of all logically isomorphic decision processes, regardless of causal connection.
  2.  **Required Change:** Switch Newcomb's Problem to **One-Box**.
  3.  **Glitchy Copy:** **Cooperate** (strongly).
  4.  **Pre-Thinking Copy:** **Cooperate**.

  If you make this shift, your gut calls will stop feeling like a pile of contradictions and start feeling like a single, coherent map of logical space.
