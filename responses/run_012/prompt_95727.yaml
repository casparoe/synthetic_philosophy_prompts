          *   Option B: Reject (2). (Identity theory/Lists). Cost: Counterintuitive.
          *   Option C: Accept (7). (Bradley/Monism). Cost: Deny plurality/truth.
          *   Option D: Reject (6). (Benign Regress). Cost: Hard to motivate.
      *   *Recommendation:* Reject (3). It's the standard realist move. The "cost" is accepting that some things (relations/verbs) are fundamentally different from other things (names/objects).
      *   *Knowledge Graph Context:* Briefly touch on why the friend (KG expert) might think this. In a DB, a triple `(Alice, loves, Bob)` *is* stored as data. But the *semantic* unity isn't in the storage; it's in the interpretation. The friend conflates the *representation* with the *fact*.

  7.  **Refining the Tone:**
