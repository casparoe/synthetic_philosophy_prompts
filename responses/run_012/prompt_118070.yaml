prompt: |-
  Next month I'm giving a paper at a small interdiscplinary workshop and I want to walk in ready for the Q&A. The room: three economic historians from the California-school/revisionist camp, one hard cliometrician who thinks the whole Great Divergence debate is underpowerd and mostly hand-waving, a Qing-dynasty specialist, and two philosophers of science -- one who works on causation, one who's a pragmatist about explanation and thinks contrast classes are fixed by context and interests rather than by the facts.

  The thesis I'm defending: the "Needham question" (why did sustained modern growth take off in Europe and not China?) is a contrastive why-question, and it's malformed in a particular way. The "not China" clause isn't doing the work of a real contrast class -- it's a foil -- and the asymmetry of the question (China as the deficit to be explained, Europe as the unmarked default) is smuggling in the explanation rather than any causal fact. Reframe it symmetrically (why Europe's windfall rather than its absence) and it either collapses into regional questions -- Yangzi delta vs. Lancashire, not nation vs. nation -- or turns into a "how possibly" question about Europe that has nothing to do with China.

  Give me the prep sheet: the objections I'll actually get from *this* crowd, phrased the way each of them would put it, ordered by how much damage they do. For each, a two-minute reply and an honest note on where the reply is soft. Tell me what to concede up front so I don't look like I'm dodging, and finish with the one objection I'm privately hoping nobody raises.
