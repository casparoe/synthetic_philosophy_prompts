answer: |-
  You are stuck because you are trying to fit a soteriological system into secular ethical categories. Your students see the welfare outcomes and call it consequentialism. Your colleague sees the focus on the agent's mind and calls it virtue ethics. Both are observing real features, but neither identifies the *telos*.

  Buddhist ethics is not about maximizing welfare (consequentialism) nor primarily about cultivating a stable character for its own sake (virtue ethics). It is about **minimizing the generation of new karmic bonds that bind beings to samsara.** The goal is liberation, not happiness, and not merely "good character."

  Based on the specific pattern of your intuitions, you are operating with a principle I will call **The Principle of Soteriological Non-Instrumentalism.**

  ### The Principle

  An action is ethically permissible if and only if it satisfies three concurrent constraints:

  1.  **The Motivation Constraint:** The act must arise from compassion (*karuṇā*) free of self-grasping or ego-inflation. (This handles the *Preening Bodhisattva*: the act is degraded if the agent is reinforcing their own self-concept as "savior.")
  2.  **The Instrumentalization Constraint:** No sentient being may be treated as a mere causal instrument to achieve a greater good, regardless of consent. (This handles *Footbridge*, *Deer Culling*, and the *Willing Volunteer*.)
  3.  **The Karmic Trajectory Constraint:** Harm or deception is permissible *only* if it interrupts a catastrophic karmic descent initiated by the victim, or protects life directly. It is not permissible if done merely to optimize aggregate welfare or manage emotional states. (This handles *Ship Captain* vs. *Politician*, and *Monk* vs. *Doctor*.)

  ### How It Predicts Your Cases

  *   **Ship Captain:** Permitted. The murderer is *initiating* a catastrophic karmic event (killing 500). The Captain interrupts the murderer's trajectory. The "heavy thing" you mention is the karmic cost the Captain accepts to absorb the violence so the murderer doesn't have to.
  *   **Soldier/Sniper:** Permitted but "worse." The sniper is a threat, but killing him is primarily to save the crowd (welfare), not necessarily to save the sniper's soul (though it does that too). It lacks the pure "karmic rescue" quality of the Captain case, hence the heavier feeling.
  *   **Footbridge:** Forbidden. The large man is an innocent instrument. Violates Constraint 2.
  *   **Monk/Deer:** Permitted. The lie protects life (Constraint 3: protects life directly).
  *   **Doctor/Patient:** Forbidden. The lie protects *feelings*, not life. It distorts reality (truth is linked to awakening) without satisfying the life-protection clause. Violates Constraint 3.
  *   **Ventilator vs. Injection:** Withdrawal is allowing nature to take its course (breaking artificial support). Injection is active killing. Active killing creates a direct karmic bond of violence; allowing death does not. Violates Constraint 3 (Agency).
  *   **Deer Culling:** Forbidden. Innocents used as instruments for herd health. Violates Constraint 2.
  *   **Politician/Assassination:** Forbidden. While the leader is evil, the act is remote, strategic, and aimed at "ending a war" (consequentialist welfare) rather than an immediate interruption of a specific karmic act. It also lacks the epistemic certainty of the Bodhisattva. Violates Constraint 3.

  ### The New Case: The Willing Volunteer

  **Verdict:** **Forbidden.**

  **Reasoning:** Even if the volunteer consents, killing them treats them as a causal instrument to save the five. In Buddhist ontology, consent does not negate the karmic weight of taking life. The killer still generates the karma of killing; the victim still undergoes the trauma of death. Furthermore, the volunteer is likely acting out of attachment (to the five, or to a concept of heroism), and the killer facilitates this delusion. It violates the **Instrumentalization Constraint**.

  ### The Trade-Off: What You Must Abandon

  Here is the hard part. To make this principle coherent, **you must abandon your intuition that the Ship Captain does not violate the precept.**

  You wrote: *"I don't think he violates the precept against killing, though I do think he takes on something heavy."*

  This is the leak in your boat. In traditional Buddhist ethics (specifically the *Upāyakauśalya Sūtra* from which this case comes), the Bodhisattva **does** violate the precept. He knowingly incurs the karmic retribution (rebirth in hell) to save the murderer from doing the same. He breaks the rule *compassionately*, but he breaks it.

  If you insist he *does not* violate the precept, you are implicitly arguing that the good consequence (saving 500 + saving murderer's karma) retroactively nullifies the moral quality of the act. **That is consequentialism.** That is exactly what your students are saying. They are right: if the outcome makes the act "not a violation," then the precept is not a constraint, it's a heuristic for maximizing welfare.

  **My advice:** Tell your students the Captain *does* violate the precept. He breaks the rule. But he does it anyway because his compassion is greater than his fear of hell. This preserves the deontological weight of the precept (it is real, it has consequences) while allowing for the Bodhisattva exception (which is based on radical self-sacrifice, not moral calculus).

  If you make this change, you force a distinction between the **Captain** (who accepts hell to save a murderer) and the **Politician** (who kills secretly to end a war). The Captain pays the price openly (karmically); the Politician tries to avoid it.

  ### Are They Right? (Virtue vs. Consequentialism)

  **Your students are wrong.** If this were consequentialism, the Footbridge case would be permitted (1 < 5), and the Doctor's lie would be permitted (less fear = more welfare). Your intuitions reject these.

  **Your colleague is partially right, but imprecise.** It *is* agent-centered, but not in the Aristotelian sense of "building a good character." It is in the sense of "managing karmic causality." A virtue ethicist asks, "What would a virtuous person do?" A Buddhist ethicist asks, "What action generates the least binding karma for all parties?"

  **The Third Thing:** It is **Soteriological Deontology.**
  *   **Deontological:** There are hard constraints (do not kill innocents, do not use beings as means).
  *   **Soteriological:** The reason for the constraints is not "rights" or "duty," but the ontological structure of suffering and rebirth.

  ### Summary for Your Office Hours

  When a student says, "It's just consequentialism with nicer branding," you say:
  > "If it were consequentialism, you could shove the man off the footbridge. You can't. If it were virtue ethics, the Bodhisattva's preening wouldn't matter as long as the act was right. It does. Buddhist ethics is about **karmic liability**. You are responsible for the causal seeds you plant, regardless of the harvest. The Ship Captain plants a seed of violence to stop a forest fire, knowing he will burn. That isn't calculus; that's sacrifice."

  When your colleague says, "It's virtue ethics," you say:
  > "Only if you define virtue as 'freedom from karmic binding.' But the precepts aren't just training wheels for character; they are descriptions of causal reality. Lying to the hunter is fine because it stops a death. Lying to the patient is wrong because it stops nothing but fear. The act itself changes based on the karmic trajectory, not just the agent's habit."

  **Final Verdict:** Adopt **Soteriological Non-Instrumentalism**. Abandon the claim that the Captain doesn't violate the precept. Embrace the claim that he violates it *for the sake of others*. That distinction is the only firewall you have against your students.
