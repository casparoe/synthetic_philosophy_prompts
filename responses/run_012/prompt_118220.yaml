answer: |-
  Here is a decision tree designed for the bargaining table. It is structured to move from the broadest assumptions about time down to specific policy commitments. Each question is phrased to elicit a practical stance without requiring theoretical jargon.

  ### **The Taxonomy of Work and Leisure**

  **Node 1: Ownership of Time**
  *When you clock out at 5 PM, do you feel you are reclaiming time that belongs to you by default, or leaving unfinished business that belongs to the team?*
  *   **Belongs to the team (Owed):** → **Leaf: Work as a Calling**
      *   *Awkward commitment:* You must explain to the bereaved family that their husband's death at his desk was a fulfillment of duty rather than a preventable tragedy.
  *   **Belongs to you (Own):** → Go to Node 2.

  **Node 2: Scope of Labour**
  *When we count "working hours" for the agreement, does that clock keep running while you care for children and elders at home, or does it stop when paid employment ends?*
  *   **Keeps running (All Labour):** → **Leaf: The Care Labour Critique**
      *   *Awkward commitment:* You cannot fix the office schedule without first revolutionising the unpaid division of labour in the kitchen, making immediate bargaining impossible.
  *   **Stops (Paid Only):** → Go to Node 3.

  **Node 3: Nature of Overwork**
  *If the whole department is working late, is it because individuals lack self-discipline, or because the system penalises anyone who leaves on time?*
  *   **System penalises (Equilibrium):** → **Leaf: The Structural-Equilibrium Account**
      *   *Awkward commitment:* You must admit that punishing a specific manager for overtime won't fix the problem, rendering individual grievances incoherent.
  *   **Lack discipline (Choice):** → Go to Node 4.
      *   *(Note: This path assumes "balance" is coherent and achievable through correct choices or rules.)*

  **Node 4: Value of Leisure**
  *Is the point of the weekend to repair you for Monday, or is free time valuable even if it leaves you no more productive?*
  *   **Repair (Instrumental):** → Go to Node 5.
  *   **Valuable (Intrinsic):** → Go to Node 6.

  **Node 5: The Wage Relation (Instrumental Branch)**
  *If we guarantee everyone enough free time, does that require keeping the wage system, or is the wage itself the barrier to rest?*
  *   **Wage is the barrier:** → **Leaf: Leisure as Recovery/Abolition**
      *   *Awkward commitment:* You must argue to the committee that the wage relation itself should be abolished, which may jeopardise the current agreement entirely.
  *   **Wage is fine:** → Go to Node 7.

  **Node 6: The Ground of Limit (Intrinsic Branch)**
  *Why is sixty hours too many? Is it because it makes you dependent on the boss, because it prevents human flourishing, or because it violates a legal right?*
  *   **Dependent on boss (Autonomy):** → **Leaf: The Civic Argument**
      *   *Awkward commitment:* You must argue that a wealthy consultant working eighty hours by choice is unfree, while a subsistence farmer is free.
  *   **Prevents flourishing (Contemplation):** → **Leaf: Leisure as Contemplative Attitude**
      *   *Awkward commitment:* You must explain to the team why a holiday spent scrolling on a phone does not count as leisure.
  *   **Violates a right (Law):** → **Leaf: Statutory Maximum Hours** *(See Overlap Note below)*
      *   *Awkward commitment:* You must enforce rest on the colleague who wants the overtime pay and is willing to trade health for cash.

  **Node 7: Authority and Duty (Instrumental/Wage Branch)**
  *Who stops you from selling all your time to the highest bidder: your own judgement, your union contract, or the state?*
  *   **Own judgement:** → **Leaf: No Right to Leisure or Work**
      *   *Awkward commitment:* You must defend the right of a starving worker to contract themselves into slavery if they choose.
  *   **Union contract:** → **Leaf: Hours as a Bargained Term**
      *   *Awkward commitment:* You must accept that if the union votes for it, a sixty-hour week is morally identical to a thirty-five-hour one.
  *   **The state:** → **Leaf: Statutory Maximum Hours**
      *   *Awkward commitment:* You must enforce rest on the colleague who wants the overtime pay and is willing to trade health for cash.

  ***

  ### **Notes on Overlaps and Empty Spaces**

  **1. The Statutory Overlap**
  You will notice **Statutory Maximum Hours** appears as a leaf in both Node 6 (Intrinsic/Right) and Node 7 (Instrumental/State).
  *   *Why:* This position is occupied by two distinct arguments that converge on the same policy. One side argues for limits because rest is a human right (Intrinsic); the other argues for limits because bodily health is a public resource (Instrumental). In the bargaining room, they will vote the same way but for different reasons.

  **2. The Empty Leaf: "Intrinsic Leisure + Market Authority"**
  There is no leaf for someone who believes leisure is intrinsically valuable (Node 6) but that its limit should be set by the market/contract (Node 7, "Union contract" or "Own judgement").
  *   *Why:* This combination is **incoherent**. If leisure is intrinsically valuable as a condition of humanity or citizenship, it cannot be legitimately traded away for wages or subject to a contract. To treat it as a bargained term is to deny its intrinsic value.

  **3. The Empty Leaf: "Calling + Structural Equilibrium"**
  There is no leaf for someone who believes work is a Calling (Node 1) but overwork is a Structural Equilibrium (Node 3).
  *   *Why:* This combination is **unattractive**. If work is a vocation owed to a higher purpose, overwork is typically framed as a spiritual virtue or a test of character, not a systemic trap. Admitting it is a trap undermines the "Calling."

  **4. The Empty Leaf: "Care Critique + No Right"**
  There is no leaf for someone who argues the question is malformed due to unpaid care (Node 2) but also believes there is no right to leisure (Node 7).
  *   *Why:* This is **unoccupied**. The Care Labour Critique is inherently a demand for recognition and rights (for carers). A position that highlights unpaid labour only to deny rights to rest is theoretically unstable and rarely defended.

  ### **How to Use This Map**
  In the next bargaining round, listen for which **Node** your counterparts are arguing from.
  *   If Management argues from **Node 7 (Bargained Term)**, they will treat hours as a cost to be traded. Do not counter with **Node 6 (Civic/Intrinsic)** arguments about freedom; they will hear this as inefficiency. Counter with **Node 3 (Structural)**: show them the cost of the equilibrium (turnover, error rates).
  *   If your Union colleagues argue from **Node 5 (Abolition)**, they will sabotage the deal. Remind them that **Node 7 (Statutory)** secures immediate protection, even if the wage relation remains.
  *   If you feel the "balance" vocabulary is failing, check **Node 3**. If the problem is an equilibrium, "balance" is indeed incoherent; you need "limits," not "balance."
