answer: |-
  The identification objection from the behavioralists—that you are making the model unfalsifiable by redefining utility—is the single point of failure that will end the discussion if fumbled.

  ### 1. The Identification Trap (Behavioral Economist Lead)
  **Objection:** "You're proposing a 'just-so' story. If history enters the utility function, you can rationalize any behavior ex-post. Without structural parameters that distinguish a 'rational sunk cost agent' from a 'biased agent' ex-ante, you haven't built a model; you've just removed the null hypothesis. How do we identify this?"
  **Reply:** "I am not proposing history enters the utility function; I am proposing it enters the information set and the constraint set. In standard models, information is costless and commitment is external. I am modeling a bounded agent where past expenditure is the lowest-cost signal of project type and the only available bonding technology. The identification comes from interaction effects: honoring sunk costs should correlate positively with information scarcity and negatively with the availability of external contracts. If you see agents honoring costs when information is cheap or contracts are enforceable, my model predicts they are biased. If they honor costs when information is opaque and contracts are impossible, my model predicts they are optimizing. You can test this by varying information costs and commitment technologies across treatment arms."
  **Soft Spot:** Distinguishing "information scarcity" from "psychological bias" empirically is notoriously difficult; they will argue your proxy for information scarcity is endogenous.

  ### 2. The Formalization Challenge (Decision Theorist)
  **Objection:** "You speak of 'constitutive value' and 'commitment,' but where is the state-space? If preferences are history-dependent, you violate dynamic consistency unless you specify how the history variable updates. Are you proposing a non-standard axiom, or just a complex utility function over paths?"
  **Reply:** "I am not advocating for history-dependent preferences in the axiomatic sense; I am advocating for history-dependent *feasibility*. Think of it as a production function where the output 'successful vocation' requires 'years of investment' as an input, not just a taste parameter. The preference ordering remains stable over future outcomes, but the technology to achieve those outcomes changes based on past accumulation. Formalize it as a constraint: $Outcome_t = f(Investment_{0..t}, Effort_t)$. If $f$ requires continuity, quitting resets the function to zero. This preserves dynamic consistency while explaining the reluctance to quit."
  **Soft Spot:** If they insist that the *value* of the good itself changes subjectively based on history (Leg 1), you are forced back into history-dependent preferences, which opens the axiomatic wounds you want to avoid.

  ### 3. The Redundancy Charge (Game Theorist)
  **Objection:** "Your third leg is standard precommitment literature. We know agents use bonds to solve time-inconsistency. What adds the label 'sunk cost' here? It's just a reputation model or a bonding model dressed in psychological clothing."
  **Reply:** "Standard precommitment assumes an agent can choose a constraint at $t=0$. My claim is that for bounded agents, the *only* available constraint is the psychological pain of wasting past resources. There is no external contract available for internal projects like 'being a good friend' or 'finishing a PhD.' The 'sunk cost disposition' is the endogenous technology that substitutes for missing markets. It's not redundant; it's the specific mechanism available when the game theorist's external enforcement is absent."
  **Soft Spot:** They will argue that if it functions exactly like a bond, you should model it as a bond, and calling it 'sunk cost honoring' obscures the mechanism.

  ### 4. The Bayesian Alternative (Behavioral Economist 2)
  **Objection:** "Your second leg is just Bayesian updating. Expenditure is a signal. If I spend money, I signal confidence. Why do we need a 'sunk cost' framework instead of just saying agents are updating on their own past actions as signals?"
  **Reply:** "Standard Bayesian updating assumes the signal is distinct from the cost. I am arguing that for resource-poor agents, the *costliness* is the signal. It's a handicap principle. If information were cheap, I wouldn't need to spend to learn. The 'sunk cost' framework is necessary because the expenditure is technically 'wasted' in the marginal sense but functional in the informational sense. A pure Bayesian model treats the expenditure as a loss; my model treats it as an investment in information structure that persists."
  **Soft Spot:** A clever econometrician can usually rewrite signaling models to absorb your claim without admitting sunk costs are ' honored,' merely that past costs are informative variables.

  ### 5. The Predictive Power Test (Experimentalist)
  **Objection:** "Okay, suppose you're right. What is the out-of-sample prediction? The standard model predicts quitting when marginal benefit < marginal cost. What does your model predict that differs?"
  **Reply:** "The standard model predicts quitting rates should be independent of past investment holding future prospects constant. My model predicts quitting rates should be negatively correlated with past investment *specifically* in domains with high uncertainty and low contractibility. In a lab setting, if you hide the future payoff distribution but make past investment visible, my agents persist longer than rational agents. If you reveal the distribution fully, the effect disappears. The interaction between information opacity and investment history is the signature."
  **Soft Spot:** If their existing data already shows this interaction is weak, you are dead. You need to be sure the literature doesn't already control for this.

  ### 6. The Normative Hazard (Philosopher of Economics)
  **Objection:** "You are walking a normative tightrope. Are you prescribing that agents *should* honor sunk costs? If so, aren't you advocating for throwing good money after bad? Where is the welfare improvement?"
  **Reply:** "I am prescribing ecological rationality, not ideal rationality. The normativity comes from the success condition of the bounded agent, not the consistency condition of the ideal agent. If the heuristic 'honor sunk costs' yields higher lifetime utility in environments with scarce information and weak commitment tech than the heuristic 'ignore sunk costs,' then it is normatively superior for that ecology. I am not saying waste is good; I am saying the heuristic that looks like waste is often the price of persistence."
  **Soft Spot:** Defining "success" without hindsight bias is hard. They will ask how an agent knows *ex-ante* if they are in the right ecology.

  ### 7. The Welfare Implication (Policy-Leaning Economist)
  **Objection:** "If we accept this, do we stop nudging people to quit failing projects? What is the policy implication? Are you arguing against standard behavioral interventions?"
  **Reply:** "I am arguing for targeted interventions. Don't nudge quitting when the project is a 'historical good' like a relationship or a long-term research program where value is constitutive. Do nudge quitting when the project is a fixed prize with transparent odds. The policy implication is to classify decisions by their information structure and contractibility before applying the 'ignore sunk costs' nudge. Blanket nudges may be breaking commitment devices that vulnerable agents rely on."
  **Soft Spot:** Policy makers hate nuance. If you can't give them a simple rule, they will ignore your distinction and stick to the blanket rule.

  ### 8. The Historical Priority (Historian of Economic Thought)
  **Objection:** "This sounds like the classic marginalist debate. Marshall and the older economists knew about specific investments and quasi-rents. You are presenting a forgotten distinction as a new discovery. Why should we update the textbook now?"
  **Reply:** "The textbooks simplified the marginalist insight into a heuristic ('ignore sunk costs') that stripped away the institutional context the marginalists assumed. I am not discovering new economics; I am recovering the institutional assumptions that made the original theory work. We should update the textbook because the heuristic has drifted from the theory and is now being used to diagnose bias in contexts where the original theorists would have predicted persistence."
  **Soft Spot:** They may correct you on the history and show that the 'fallacy' label was explicitly designed to cut against the very arguments you are making.

  ***

  ### Strategic Constraints

  **Concede in Opening:**
  Concede the standard vignettes (concert tickets, failing projects with clear alternatives). Explicitly state: "I agree that in cases of fixed prizes with transparent probabilities and costless switching, honoring sunk costs is a bias. My claim is restricted to domains of constitutive value, information scarcity, and weak commitment technology." This prevents them from wasting time on examples you already lost.

  **The Single Reply That Must Land:**
  Objection 1 (Identification). You must successfully distinguish **History-in-Constraint** from **History-in-Preference**. If you allow history to enter the utility function (preference), you admit the agents are just weird, not rational. If you prove history enters the constraint/information set, you prove they are optimizing under bounds. If you fail this distinction, you are just rationalizing bias.

  **The Question You Hope Nobody Asks:**
  "Can you specify an observable variable, available to the agent *ex-ante*, that distinguishes a situation where honoring sunk costs is rational from one where it is a fallacy, without using the *ex-post* outcome of the project?"
  *(If you answer "no," you are unfalsifiable. If you answer "yes," they will ask why agents don't use that variable to switch heuristics.)*
