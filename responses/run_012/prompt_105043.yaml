prompt: |-
  Ok I'm a software engineer, no philosophy background at all, and I've gone down a rabbit hole I can't climb out of. I've basically come to believe that Gödel's incompleteness theorem shows the human mind can't be a computer program, and I want you to try hard to break that.

  Here's my version, which I think dodges the version people usually dunk on. Take any formal system F that's supposed to capture every arithmetical truth I can know. By incompleteness, if F is consistent there's a Gödel sentence G_F that F can't prove but that's true. I can see it's true — it basically just says that F can't prove it, and if F is consistent then that's exactly right. So here's a truth I grasp that F can't get to, and F was arbitrary, so no single system captures all of me, so my mind isn't a formal system. The usual comeback is that I only know G_F is true if I know F is consistent, and I can't prove the consistency of my own reasoning. I think I've patched that: I don't need to prove F is consistent, I only need to be justified in beleiving it, and I am, because arithmetic's basic rules obviously preserve truth and they've never once let me down. So the comeback misfires.

  Now the ask: what would count against this, ranked from stuff that should make me actually drop it down to stuff that's merely awkward? I want the arguments and observations that should move me, including anything a defender would themselves have to concede, plus an honest call on whether I've quietly made it unfalsifiable — because I notice a defender can always say, fine, my mind isn't F, it's F plus G_F, and then again, forever. And tell me which of the defeaters I'd find most convincing if I were being honest, which I suspect are the ones about whether getting to no single system even gets me to no program at all.

  Give it to me as exactly five numbered items, a sentence or two each, with no intro and no wrap-up.
