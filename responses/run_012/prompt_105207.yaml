      *   *Indexicality ("Being You"):* In an urn draw, any ball could have been drawn. In existence, *you* are necessarily *you*. You couldn't have been Napoleon. This is the difference between *de dicto* (someone exists) and *de se* (I exist). The urn model treats "I" as a label slapped on a random ball, but "I" feels intrinsic.
