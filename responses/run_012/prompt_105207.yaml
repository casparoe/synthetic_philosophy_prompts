      *   The SSA (treating yourself as a random sample *within* a theory, not across theories) avoids this but leads to the Doomsday Argument (favoring smaller futures).
      *   *Verdict:* The urn picture *is* doing the arguing. It smuggles in SIA as a neutral starting point.

  6.  **Develop Better Metaphors/Alternatives:**
