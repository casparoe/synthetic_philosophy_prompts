      *   *At Random:* The crucial, controversial step. It implies a "prior" probability distribution over observers *before* you know who you are.

  4.  **Identify the Breakdowns (The "Cracks"):**
      *   *Uniformity Assumption:* In a real urn, balls are physically distinct but probabilistically identical regarding the draw. In anthropics, are all observers equally likely to be "me"? Does a human count the same as a alien? A brain in a vat? This is the *Reference Class Problem*.
