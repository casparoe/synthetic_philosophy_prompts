      *   *The Analogy:*
          *   Smoke Detector $\rightarrow$ Cognitive State/Belief.
          *   Smoke $\rightarrow$ The Truth Condition/Referent (e.g., "There is a tiger").
          *   Alarm Sounding $\rightarrow$ Asserting the Belief/Acting on it.
          *   Burnt Toast $\rightarrow$ False Belief Scenario.
