          *   *Smoke Detector:* If it beeps at toast, it's arguably *not* malfunctioning if it's sensitive to particulates. It's doing exactly what the physics says. To call it a malfunction, we need a *normative* standard set by a designer.
          *   *Belief:* I can believe "It will rain tomorrow" and be wrong. Is my brain *broken*? Not necessarily. My cognitive machinery might be working perfectly (processing data, making predictions), but the world just didn't cooperate. Teleosemantics says error *is* malfunction. But intuitively, false belief $\neq$ brain damage.
          *   *Fatal?* Yes, this is the "Normativity Problem." Evolution selects for survival, not truth. A belief could be false but adaptive (placebo effect, overconfidence). If content is fixed by survival, truth gets uncoupled.

      *   *Break 2: The Swampman (User's specific point).*
          *   *Scenario:* Molecule-for-molecule copy, no history.
          *   *Teleosemantics:* No history = No function = No content. Swampman has no beliefs.
          *   *Intuition:* Swampman acts exactly like me. He says "I see a tree." It feels like he believes it.
          *   *Fatal?* This is the famous "Swampman Objection" (Davidson). It suggests history isn't necessary for *current* intentionality. If the theory says Swampman is a zombie, the theory clashes hard with intuition.

      *   *Break 3: Determinacy of Content.*
          *   *Smoke Detector:* Detects "Smoke" or "Particulates" or "Heat"?
