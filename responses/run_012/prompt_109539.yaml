      *   *Step 3: Identify the Mechanism.* Why did it break? (Instrumental convergence, deceptive alignment, etc.).

  6.  **Select the Top Questions:**
      *   *Question 1: The Measurement Problem (Operationalizing "Alignment" across scales).* Before testing if methods scale, we must define what "aligned" means at scale $N$ vs scale $10N$. A philosopher is crucial here.
      *   *Question 2: The Oversight Bottleneck (Evaluation Scaling).* If the AI gets smarter than the evaluator, current RLHF breaks. This is the most immediate "coarse-graining" failure.
