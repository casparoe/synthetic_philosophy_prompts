      The debate over whether numbers count in rescue cases has stagnated because standard examples—trolleys, lifeboats—presume a background of psychological uniqueness that smuggles in utilitarian intuitions. To adjudicate whether aggregation is merely arithmetic anxiety or a moral requirement, we must strip away the assumption that each life represents a uniquely irreplaceable narrative. The cloning variations force us to decide whether the weight of a claim rests on psychological distinctness or physical separateness.

      Consider first the case of the five clones versus the one ordinary individual. The anti-aggregative view, following Taurek, argues that each person has a claim not to be sacrificed for the sake of others, and since claims do not sum, a lottery is the only fair procedure. This view relies heavily on the "separateness of persons." But in the cloning case, the five are psychologically indistinguishable. If the moral weight of a life lies in its unique psychological content, the five clones collectively possess barely more value than the one ordinary person. However, this intuition is repulsive. We feel strongly that saving the five clones is obligatory, not optional. Why? Because they are five distinct bodies, five distinct centers of consciousness, however similar. They will occupy five distinct spaces and suffer five distinct deaths. The anti-aggregative view struggles here: if it insists on a lottery, it implies that five identical streams of experience weigh no more than one. This suggests that the anti-aggregative view is not truly about protecting distinctness, but about a procedural fetishism that ignores the magnitude of loss.

      Now reverse the asymmetry: the one ordinary individual will shortly be duplicated into five, while the five strangers are static. Does the one person's claim multiply because of their future multiplicity? Almost everyone, aggregators and anti-aggregators alike, says no. We save the five strangers. This reveals a crucial constraint: numbers count only when they represent currently existing, distinct claimants. Potential persons have no claims. This undermines any view that aggregation is about maximizing "future experience" in the abstract. It grounds the justification for saving the many in the present reality of distinct physical loci. If the justification for saving the five clones in the first case was their physical separateness, consistency demands we save the five strangers in the second case for the same reason. The unit of moral accounting is the existing human organism, not the psychological narrative or the potential future.

      The strongest defense of the lottery in these cases is that it expresses equal concern for each claimant. To save the five simply because they are five is to treat the one as a mere means, or to imply their claim is weaker. In the cloning case, the lottery defender argues that each clone has the same claim as the ordinary person; to override the ordinary person's claim is to violate their equality. However, this defense collapses under the objection that the lottery itself treats persons as interchangeable units of chance rather than centers of loss. By focusing on the ex-ante probability of being saved, the lottery ignores the ex-post reality of who dies. When five die instead of one, the world contains five tragedies instead of one. The lottery prioritizes the fairness of the decision procedure over the goodness of the outcome. In the cloning case, this is stark: a lottery gives the ordinary person a 1/6 chance of survival, but it also condemns the five clones to a 5/6 risk of collective extinction. The "equal concern" argument fails because equal concern for each individual should logically extend to minimizing the total number of individuals who suffer catastrophic loss.

      Furthermore, the objection that aggregation treats persons as interchangeable misses the point. Aggregation does not require that persons be interchangeable in value; it requires only that their losses be commensurable. The ordinary person's loss is not less tragic than a clone's. But five tragedies are worse than one. The cloning case clarifies this: even if the clones are interchangeable with each other, their losses are not interchangeable with non-loss. The anti-aggregative view mistakes the *incomparability of claims* for the *non-summing of losses*. Just because I cannot sacrifice you for me does not mean that saving five of us is no better than saving one of us.

      The verdict is that numbers count, but not as utilitarian sums of happiness. They count as a measure of distinct instances of catastrophic loss. The duplication cases reveal that the anti-aggregative view relies on a metaphysical notion of personhood that is too thin. It treats persons as abstract claims rather than physical beings who suffer. The separateness that matters is biological and temporal, not narrative. Five clones are five separate sites of pain and extinction. One person becoming five is still one site of pain and extinction until the duplication occurs. Therefore, the moral obligation is to minimize the number of distinct entities that cease to exist. The lottery is a concession to our inability to choose between equals, but when the choice is between one death and five deaths, the equality of claims does not mandate an equality of outcomes. It mandates minimizing the violation of claims. We save the five because there are five claims to continue living, and satisfying five is objectively better than satisfying one, provided the claims are of the same type. The cloning cases strip away the sentimentality of uniqueness and leave us with the bare arithmetic of existence: five bodies is more than one, and five deaths is worse. Numbers count because distinct existences are the currency of moral loss.

