                  *   Taurek (Equal Chances): Taurek argues we should give each *individual* an equal ex-ante chance of being saved. If I deterministically save A, the 1 person in A has a 100% chance, the 5 in B have 0%. If I flip a coin between the *groups*, A has 50%, B has 50% (so each person in B has 10%). Neither gives equal individual chances. To give equal individual chances, I need a lottery where every individual has a $1/6$ chance.
