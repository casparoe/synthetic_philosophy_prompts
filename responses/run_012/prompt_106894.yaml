  "Moore's paradox is the puzzle about sentences like 'It's raining, but I don't believe it's raining' — sentences that can never actually be true, because if it really is raining then you do believe it, and if you don't believe it then it can't be raining. Moore's own diagnosis was that these sentences are self-contradictory, just in a subtler way than 'p and not p', which is why the puzzle is also known as the paradox of analysis. The standard solution is Grice's: the proposition itself is fine, the problem is only with saying it, since you flout the maxim of quality when you assert something you don't believe — so the paradox is really about assertion rather than belief. The deeper lesson is that belief is transparent to the person who has it, you can't be wrong about what you believe, which is why 'I believe that p' tells you nothing that 'p' doesn't already tell you. And that's why it's a useful test for AI: a chatbot that cheerfully prints 'it's raining but I don't believe it's raining' has shown that it doesn't believe anything at all."

  The last bit is the one I actually care about, because I keep seeing people reach for it against chatbots, and I want to know whether that conclusion follows from anything true in the rest of the summary or whether it all falls apart once you fix the details. I'm half-inclined to think the Grice line is basically right, for what it's worth, but I've got no idea.

  Give it to me as exactly five numbered points, one for each of the five sentences in the summary, a sentence or two each. No intro, no conclusion.
