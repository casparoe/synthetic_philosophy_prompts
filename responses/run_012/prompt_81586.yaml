answer: |-
  You are grappling with the tension between the **Parity Principle** (Clark & Chalmers), which argues that location (in the head vs. in the world) is irrelevant, and a deeper intuition that **biological capacity** and **agency** still mark a boundary.

  Your verdicts are consistent, but they do not fit the standard "Extended Mind" theory. Instead, they fit a **Prosthetic Model** of cognition. You treat the mind as a biological baseline that can be *replaced* where broken, but not merely *offloaded* where intact.

  Here is the principle that accounts for your verdicts, the clauses required to sustain it, and the costs of adopting it.

  ### The Principle: Compensatory Coupling

  An external resource is part of a person's mind if and only if it satisfies three conditions:

  1.  **Functional Transparency:** The resource is accessed automatically, trusted without verification, and integrated into the flow of action (no distinct interface or "voice").
  2.  **Biological Necessity:** The resource compensates for a biological incapacity or loss. It performs a function the biological substrate *cannot* perform on its own, not merely one it *does not* perform by choice.
  3.  **Agency Singularity:** The resource does not possess its own distinct agency or perspective that must be interpreted (it is not another mind).

  ### How the Clauses Map to Your Cases

  *   **Clause 1 (Transparency)** is forced by **Case 4 (Earpiece)** and **Case 1 (Otto)**.
      *   *Why:* You reject the Earpiece because you "re-check" and hear a "voice" (lack of transparency). You accept Otto because he consults "without hesitation." This rules out tools we treat as testimony.
  *   **Clause 2 (Necessity)** is forced by **Case 3 (Phone)** and **Case 2 (My Notebook)** vs. **Case 1 (Otto)**.
      *   *Why:* This is the crux of your view. Functionally, Otto and You (Case 3) are identical. The *only* reason you accept Otto and reject the Phone is that Otto's brain *cannot* do the job, whereas yours *could*. This clause saves your intuition that outsourcing (Case 3) is not extension, while repair (Case 1) is.
  *   **Clause 3 (Agency)** is forced by **Case 5 (Partner)**.
      *   *Why:* Even if she is trusted and necessary, she is a separate agent. Her reports are "her acts." This prevents the mind from dissolving into any social network.

  ### The Verdicts You Must Surrender

  If you adopt **Compensatory Coupling**, you are philosophically consistent, but you must surrender two significant positions:

  1.  **The Parity Principle:** You must explicitly reject the standard philosophical claim that "biology doesn't matter." You are asserting that biology *does* matter: it sets the default boundary. Extension is an exception granted only to repair, not to convenience.
  2.  **Case 3 (The Phone) is your weak point.**
      *   *Honest Assessment:* If you ever develop a memory impairment, your phone *becomes* part of your mind overnight under this principle. This implies the boundary of your mind is mutable based on medical diagnosis. If you find this unstable, you should surrender **Case 3** and admit that if Otto's notebook counts, your phone must too. The distinction between "cannot" and "do not" is pragmatic, not metaphysical. Most extended mind theorists would urge you to surrender Case 3 to save Case 1.

  ### Analysis of Case 6 (Cochlear vs. Glasses)
  Your principle handles this via **Clause 2 (Necessity)** and a sub-clause of **Integration**.
  *   **Cochlear:** The auditory nerve is non-functional. The implant *replaces* the transduction mechanism. It is necessary and constitutive. (Verdict: Part of Mind/Body).
  *   **Glasses:** The eye functions; the lens focus is merely sub-optimal. Glasses *correct* rather than *replace*. Furthermore, they are not "coupled" in the same way (they come off easily).
  *   *Prediction:* If you were blind and used a camera-to-brain interface, that would be part of your mind. Glasses remain tools.

  ### Predictions for New Cases

  Here is how **Compensatory Coupling** predicts the status of the four cases you did not mention:

  **1. Thinking with a Pen (Writing is the thinking)**
  *   **Verdict:** **Part of the Mind.**
  *   **Reasoning:** If the writing *is* the thinking (you cannot formulate the thought without the inscription), this satisfies **Biological Necessity**. The cognitive process literally cannot occur in the skull alone. It is functionally transparent (you don't "read" your thought, you have it).
  *   *Caveat:* If you write to *record* a thought you already had, it reverts to Case 2 (Tool).

  **2. Password Manager (Only copies, never memorized)**
  *   **Verdict:** **Part of Memory.**
  *   **Reasoning:** Human biology is incapable of memorizing 200 random 16-character strings. This is a **Biological Incapacity**. You trust it implicitly (Transparency). It compensates for a hard limit of the brain. Under your principle, this is a cognitive prosthetic, indistinguishable from Otto's notebook.

  **3. Screen Reader / Refreshable Braille (Blind Friend)**
  *   **Verdict:** **Part of Perception/Mind.**
  *   **Reasoning:** This is the perceptual equivalent of Otto. The biological eye cannot function. The device replaces the transduction of text to meaning. It is consulted automatically and trusted. It is a sensory prosthetic.

  **4. Research Group's Shared Wiki**
  *   **Verdict:** **A Collective Mind (but not *your* mind).**
  *   **Reasoning:** **Clause 3 (Agency)** prevents it from being *your* individual mind, as it contains the contributions of other agents. However, since "no single member could reconstruct" it, the group satisfies **Biological Necessity** collectively.
  *   *Prediction:* The wiki is part of the *group's* mind, but for you individually, it remains a tool (like Case 5, Partner), unless you reach a state where you literally cannot think your specific part of the research without it (which pushes it toward Case 1).

  ### Summary
  You have intuitively derived a **Medical/Prosthetic Model** of the extended mind. It is robust and protects your sense of self from dissolving into every tool you touch.

  *   **Principle:** Compensatory Coupling (Transparency + Necessity + Singularity).
  *   **Cost:** You must accept that the boundary of your mind depends on your biological health (Otto vs. You).
  *   **Recommendation:** If you wish to be more radical, surrender **Case 3**. If the phone is trusted and necessary for your *current* functioning, the fact that your brain *could* theoretically do it is irrelevant. But if you wish to keep your current verdicts, the principle above is the only one that holds them together.
