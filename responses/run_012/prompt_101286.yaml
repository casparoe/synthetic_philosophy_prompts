      *   *Objection 2 (Content vs. Justification):* Focus on the Propositional Attitude. Reply: Reference fixing is a precondition for justification, hence epistemic.
      *   *Objection 3 (Inference):* Focus on the lack of universal premise. Reply: No *vyāpti*, just similarity.
      *   *Hope Nobody Asks:* "Is this just learning a definition?"

      *Wait, let's sharpen the "Stand".* The user wants to know if the thesis survives. I need to be honest. It's an uphill battle against parsimony. I should advise them to pivot slightly from "New *Pramāṇa*" to "Distinct Epistemic Structure."

      *Let's finalize the "Hope Nobody Asks".* The Buddhist colleague will ask the reductionist question. The analytic crowd will ask the justification question. The *real* killer is: "If the testimony is false (it's not like a cow), do you have knowledge?" (Gettier/False Lemma). No, better: "Is this distinct from *ostensive definition*?" If I point and say "That's a gavaya," that's perception+testimony. If I say "Like a cow," that's... what? The distinction is thin.
      *Actually, the best "Hope Nobody Asks" is:* "Does this apply to *any* natural kind term? If so, isn't this just how we learn *all* language, making 'Testimony' the real workhorse and *upamāna* just a sub-species?"

      *Okay, let's write it.*

      *(Self-Correction during drafting)*: Make sure the replies sound spoken, not written. Short sentences. Direct engagement.
      *(Self-Correction on Stand)*: Be decisive. Don't hedge too much. Tell them where to bleed to save the heart.

      *(Final Polish on Objection 1)*: Make sure it captures the Buddhist colleague's vibe but in analytic speak. "Explanatory Parsimony."
      *(Final Polish on Objection 2)*: "The Generality Problem."
      *(Final Polish on Objection 3)*: "Analogical Inference."

      *Wait, one more check on the "Hope Nobody Asks".* The most damaging question for *irreducibility* is: "If I tell you 'A gavaya is a wild cow', and you see one, isn't that just understanding a description? Why is comparison special?"
