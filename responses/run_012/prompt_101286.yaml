answer: |-
  Here is the battle plan. Your audience cares about justificatory structure, parsimony, and the propositional nature of knowledge. They do not care about preserving Nyāya taxonomy for its own sake. If you defend *upamāna* as a metaphysical curiosity, you lose. If you defend it as a solution to a gap in analytic semantic epistemology, you have a chance.

  Here are the objections ordered by lethality, phrased for the room, with scripts and vulnerability assessments.

  ### 1. The Reductionist Challenge (Parsimony)
  **Who:** The Buddhist colleague (likely) + the analytic reductionists.
  **The Objection:** "You're violating explanatory parsimony. You say *upamāna* is irreducible, but the output looks like a conjunction of Testimony and Perception. Testimony gives me the rule ('*gavaya* refers to cow-like things'); Perception gives me the instance ('This animal is cow-like'). Why posit a distinct *source* of knowledge rather than a complex *process* using existing sources? In analytic terms, this looks like inferential knowledge based on testimonial premises, not a sui generis *pramāṇa*."

  **Your Reply (2 mins):**
  "Parsimony is a virtue, but not if it erases a distinct justificatory structure. In standard testimony, I believe *p* because you said *p*. In *upamāna*, the testimony doesn't give me the truth of a proposition; it gives me a *rule of application* without ostension. I cannot infer 'This is a *gavaya*' from 'This is like a cow' unless I already know how to apply '*gavaya*'. But I don't know that yet. The testimony provides the comparison, perception provides the similarity, but the *warrant* for linking the name to the object relies on a cognitive operation—recognizing the similarity as the *ground* for the name—that isn't present in standard testimony or inference. It's not just a process; it's a unique warrant structure where the similarity *itself* acts as the bridge between word and world, not just a premise in an argument. Collapsing it into testimony ignores that the testimony alone yields no knowledge of the object until the perceptual match occurs."

  **Soft Spot:** You are vulnerable on the "inference" point. If they press that "Cow-like things are called *gavaya*" is a hidden universal premise, your claim of irreducibility weakens. You must insist the universal isn't known *beforehand*.

  ### 2. The Content vs. Justification Objection
  **Who:** The analytic epistemologists (Testimony/Perception specialists).
  **The Objection:** "Epistemology studies the justification of belief, not concept acquisition. What you're describing is learning the meaning of a word. That's semantics or philosophy of language, not epistemology. Once I know the meaning, I can have justified beliefs about *gavayas* via perception. But the act of learning the meaning isn't itself a source of *knowledge* in the sense we track (justified true belief). You're conflating acquiring the capacity to form beliefs with the justification of the beliefs themselves."

  **Your Reply (2 mins):**
  "That distinction assumes we already have the concepts to justify. But semantic knowledge *is* knowledge. If I know 'That is a *gavaya*,' I need a warrant for that identification. *Upamāna* provides the warrant for the initial identification belief. It's not just 'learning a word' like a parrot; it's knowing *that* this object falls under that description. In analytic terms, it's a solution to the problem of reference-fixing without direct ostension. If testimony is a source of knowledge, and testimony can't fix reference without perception, but perception can't fix reference without the name, *upamāna* is the epistemic operation that bridges that gap. It justifies the belief 'This is the thing named,' which is a propositional attitude, not just a semantic capacity."

  **Soft Spot:** This is your weakest theoretical ground. Analytic epistemology often treats concept acquisition as pre-epistemic. If they dig in on "Epistemology is about propositional justification," you risk being moved to the philosophy of language table.

  ### 3. The Analogical Inference Objection
  **Who:** The two with secondary reading knowledge.
  **The Objection:** "Isn't this just reasoning by analogy? I know cows have property F. I see the *gavaya* has property F. Therefore, the *gavaya* falls under the same label. Nyāya themselves debate whether *upamāna* reduces to inference (*anumāna*). Why should we accept the Nyāya realist stance over the Buddhist reductionist one here?"

  **Your Reply (2 mins):**
  "Analogy requires a known universal connection (*vyāpti*) between the middle term and the major term. In inference, I know 'All smoke implies fire.' In *upamāna*, I do *not* know 'All cow-like things are *gavayas*.' I only know the name applies to the thing that resembles the cow. There is no universal premise to drive an inference. It's a direct recognition of the naming convention based on similarity, not a deduction. If it were inference, I could be wrong about the similarity and still have a valid argument. In *upamāna*, if the similarity fails, the knowledge fails immediately. The warrant is the resemblance itself, not a law connecting resemblance to naming."

  **Soft Spot:** You need to be careful not to make *upamāna* sound unreliable. If there's no universal premise, how is it *knowledge* and not just a guess? You must lean on the reliability of the initial testimony.

  ### 4. The "Hope Nobody Asks" Question
  **The Question:** "If the initial testimony is false (the *gavaya* isn't actually like a cow), do you have knowledge? If yes, it's not truth-tracking. If no, then isn't this just Testimony with a higher defeasibility rate? Why isn't this just 'Fallible Testimony'?"

  **Why it hurts:** It attacks the *pramāṇa* status (infallibility/reliability) directly. If it relies on the truth of the testimony, Testimony is doing all the work. If it doesn't, it's not knowledge.

  **Your Reply (2 mins):**
  "If the testimony is false, *upamāna* doesn't trigger. You don't get knowledge; you get error. But that's true of Perception too (illusions). The source isn't defined by the absence of error, but by the structure of the warrant. In Testimony, the warrant is the speaker's reliability. In *upamāna*, the warrant is the *recognition of similarity* authorized by the speaker. The testimony authorizes the search; the perception confirms the match. The knowledge arises at the match, not at the utterance. So it's not just fallible testimony; it's a two-stage verification where the second stage is non-testimonial."

  **Soft Spot:** This is a scramble. You are admitting the testimony is necessary, which feeds back into Objection 1 (Reductionism).

  ---

  ### Strategic Stand: Will the Thesis Survive?

  **Verdict:** The thesis survives **only if you concede scope.**

  If you argue that *upamāṇa* is a general 5th source of justification for all kinds of beliefs, **you will lose.** The analytic commitment to parsimony (Perception, Memory, Inference, Testimony) is too strong, and the Buddhist colleague will dismantle the taxonomy as ontological bloating.

  **Where to Concede:**
  Concede that *upamāna* is not a *general* source of justification. Admit that for most beliefs, the standard four cover it. Concede that in modern contexts, we often use ostensive definition ("Point and say") which reduces to Perception + Testimony.

  **Where to Fight:**
  Fight for *upamāna* as the specific epistemic source for **reference-fixing for natural kind terms via description.** This is your winning wedge. Analytic epistemology struggles with how we latch names onto things we haven't seen based on descriptions (the Kripke/Putnam problem).
  *   **Argument:** Testimony gives the description ("wild cow"). Perception gives the object. But neither gives the *link* that justifies the identification belief. *Upamāna* is the name for that link.
  *   **Pivot:** Don't call it a "5th Prāmāṇa" in the Nyāya metaphysical sense. Call it a "Distinct Epistemic Structure for Semantic Identification."

  **Final Advice:**
  1.  **Don't get bogged down in Sanskrit.** If you start defining *śabda* vs. *artha*, you lose the room. Stick to "Word," "Object," "Warrant."
  2.  **Befriend the Buddhist.** Acknowledge their reductionist point is valid for *many* cases, but insist there is a "residue" of knowledge (the recognition moment) that their reduction misses.
  3.  **Own the Parsimony Hit.** Say explicitly: "I am not proposing this for ontological reasons, but because the justificatory structure doesn't fit the existing four boxes."

  If you frame it as "Analytic Epistemology has a gap in explaining how we learn terms by comparison," you survive. If you frame it as "Nyāya was right and you are wrong," you die.
