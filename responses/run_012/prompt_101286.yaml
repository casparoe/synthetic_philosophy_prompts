      *   **Thesis:** *Upamāna* is a genuine, irreducible *pramāṇa* (source of knowledge). It's not just knowledge of resemblance (perception/memory) but knowledge of word-to-world connection (reference/application). It's missing from the standard analytic list (Perception, Memory, Inference, Testimony).
      *   **Audience:**
          *   Majority: Analytic epistemologists (focus on testimony, perceptual justification). Little to no Sanskrit/Indian philosophy background.
          *   Minority (2): Know a little Indian philosophy from secondary sources.
          *   Minority (1): Buddhist studies colleague (reductionist, thinks 2 *pramāṇas* max are enough, views Nyāya taxonomy as bloated).
      *   **Constraints:** 20 mins Q&A after 30 min talk. Replies must be short (approx. 2 mins spoken).
      *   **Task:** Provide objections ordered by damage potential, phrased analytically, with 2-minute replies, notes on soft spots, identify the "hope nobody asks" question, and take a real stand on strategy/survival.

  2.  **Deconstruct the Thesis:**
      *   *Upamāna* standard example: "A *gavaya* is like a cow." Later, see animal in forest, recognize it as *gavaya*.
      *   User's twist: It's not about the similarity itself, but about learning how to *apply the term* 'gavaya'.
      *   Claim: This isn't Testimony (just being told the definition), isn't Inference (no vyāpti/universal relation established yet), isn't Perception (doesn't give the name), isn't Memory.
      *   Goal: Prove irreducibility.

  3.  **Brainstorm Objections (Analytic Frame):**
      *   *Reductionism (The Buddhist Colleague):* It's just Testimony + Perception. You were told the rule, you saw the instance. Why posit a new faculty?
      *   *The "Grue" Problem/Induction:* How do you know the similarity holds? Isn't this just inductive inference based on testimony?
      *   *Semantic Externalism/Causal Theory:* Isn't this just fixing reference via description? Kripke/Putnam stuff.
      *   *Testimony Reduction:* If someone tells you "A gavaya is like a cow," isn't that testimonial knowledge of a meaning?
      *   *Concept Acquisition vs. Justification:* Epistemology is about justification, not concept acquisition. *Upamāna* looks like learning a concept, not justifying a belief.
      *   *The "Hope Nobody Asks":* What if the *gavaya* turns out *not* to be like a cow? Or what if the initial testimony was false? (Defeasibility). Or, more damaging: Is this actually *knowledge* or just *true belief* generated by a reliable process? (Gettier-style). Actually, the hardest question for this specific crowd is usually: "Is this a *source* of justification or a *process* of belief formation?"

  4.  **Select and Order Objections (by Damage):**
      1.  **The Reductionist Challenge (Testimony + Perception):** This is the big one. Analytic epistemology loves parsimony. If you can build it from existing blocks, you don't need a new block. The Buddhist colleague will lead this.
      2.  **Concept Acquisition vs. Justification:** Analytic epistemology distinguishes between *having* a concept and *knowing* a proposition. *Upamāna* sounds like learning a word. If it's not propositional knowledge, it's not in the epistemologist's lane.
      3.  **The Inference/Analogy Objection:** Isn't this just an analogical inference? (Cow has horns, *gavaya* has horns -> *gavaya* is cow-like).
      4.  **The "Hope Nobody Asks":** The Defeasibility/False Lemma problem. If the initial comparison is slightly off, do you lose knowledge? (Actually, a better "hope nobody asks" is about the *normative* status. Is it a *pramāṇa* or a heuristic?) Let's go with: "Is this distinct from ostensive definition?"

      *Refining the Order:*
      1.  **Reductionism (Testimony + Perception):** Highest damage. Attacks the core "irreducible" claim.
      2.  **Propositional vs. Semantic Knowledge:** High damage. Attacks whether it counts as *epistemology* proper for this crowd.
      3.  **Analogical Inference:** Medium damage. Attacks the mechanism.
      4.  **The "Hope Nobody Asks":** The "New Term" problem. If I just tell you "This is a *gavaya*," isn't that just ostension? Why the comparison?

  5.  **Drafting Replies (Analytic Style):**
      *   Need to sound like an epistemologist, not a philologist. Use terms like "justificatory structure," "propositional content," "reductionism," "semantic value."
      *   Keep them tight (2 mins spoken is ~250-300 words).
      *   Identify the "soft spot" (where the reply is vulnerable).

  6.  **Developing the Strategy/Stand:**
      *   *Concede:* Some reduction is possible in *modern* contexts (ostensive definition), but insist on the *structural* difference in the *gavaya* case (absence of the object during instruction).
      *   *Fight:* The Testimony reduction. Testimony gives the sentence; *upamāna* gives the reference fix without direct ostension.
      *   *Survival:* The thesis survives *if* framed as a gap in semantic epistemology, not general justification. If framed as "we need a 5th source of justification for all beliefs," it dies. If framed as "we need a source for reference-fixing via description + similarity," it has a chance.

  7.  **Refining the "Hope Nobody Asks":**
      *   What's the killer? It's the "Why not just call it Testimony about meanings?" question.
      *   Actually, the *real* killer for an analytic crowd is: "Does this generate *justification* or just *content*?" If I don't know what 'gavaya' means, I can't believe 'That is a gavaya'. So *upamāna* provides content, not justification. Epistemology studies justification.
      *   Let's make that the "Hope Nobody Asks."

  8.  **Final Review against Constraints:**
      *   Ordered by damage? Yes.
