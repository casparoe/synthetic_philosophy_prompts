prompt: |-
  I am a junior at a large public high school and the student representative on our school's science fair ethics review committee. The committee meets once a month, usually with five to eight student research proposals on the agenda, and I have about twenty minutes to review each one before we vote. Most proposals involve human participants, and almost all of them are designed and run by students on their classmates. My role is not to make final legal rulings; the faculty advisor and the district research review office have to sign off on anything we approve. But the committee's recommendation carries weight, and I am the only member who has not taken a research methods course. I need a decision procedure I can actually run in a meeting, grounded in the philosophical conditions that make consent valid, rather than in a list of rules I would have to look up.

  Please write that procedure for me. I want it as a checklist or a flowchart in words: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it has to hand the decision to a human because the question is about values rather than facts. It should be built around the conditions that philosophers usually treat as necessary for valid consent: that the person is competent to consent, that they are adequately informed, and that their agreement is voluntary rather than coerced or unduly influenced. But I need those conditions translated into something a high school student can apply to peer research, where the participants and the researchers are often friends, classmates, or students of the same teachers, and where the line between a favor and pressure is not obvious.

  The procedure has to handle at least these hard cases: a study that uses deception, where participants are told the study is about one thing but it is actually about another; a study where a teacher offers extra credit or some other benefit for participating; and a study where a participant may not fully understand what they are agreeing to, either because of age, disability, or language. It should also say what to do when more than one problem is present at once, and it should distinguish between consent that is invalid and consent that is valid but should still be refused for other reasons. I do not need citations, a reading list, or a survey of the literature. I need the procedure itself, in a form I can defend to teachers and parents who will ask why we approved or blocked a project.

  Then run the procedure on three proposals. First, a student wants to test whether peer pressure affects snack choices. Participants will be told the study is about taste preferences, but the real purpose is to see whether they change their answers after hearing a confederate. The student plans to debrief them afterward. Second, a student wants to survey classmates about homework habits, and a teacher has agreed to offer five points of extra credit to anyone who participates. Third, a student wants to survey classmates about school belonging, including a sixteen-year-old classmate with an individualized education program and a mild intellectual disability. The researcher is a close friend of that classmate and plans to read the questions aloud. For each proposal, give me the verdict the procedure produces, the steps that produce it, and the strongest objection someone on the committee would raise. I expect to dislike at least one verdict, so please do not soften the procedure to make it come out the way I would prefer.

  Finally, tell me what the procedure cannot do. Where is it likely to misfire? Which judgments are really about values rather than facts? What should I do when the procedure gives no clear answer, and what information would a human decision-maker need in those cases? I would rather have a procedure with honest limits than one that pretends to settle everything.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Junior high school student, member of Science Fair Ethics Review Committee.
      *   **Context:** Monthly meetings, 5-8 proposals, ~20 mins/proposal. Mostly student-on-student human subjects research.
      *   **Role:** Student rep, no formal research methods training. Recommendation carries weight but isn't final legal ruling.
      *   **Goal:** A decision procedure (checklist/flowchart in words) based on philosophical conditions of valid consent (Competence, Information, Voluntariness).
      *   **Requirements:**
          *   Actionable in a meeting (no looking up rules).
          *   Handle hard cases: Deception, Extra Credit/Inducement, Vulnerable Populations (disability/age/language).
          *   Handle multiple problems at once.
          *   Distinguish invalid consent vs. valid but ethically refusal.
          *   No citations/reading lists.
          *   Apply procedure to three specific cases (Deception/Snack, Extra Credit/Homework, Disability/Belonging).
          *   Provide verdict, steps, and strongest objection for each.
          *   Explain limitations (where it misfires, value judgments, what to do when unclear).
      *   **Tone:** Practical, rigorous, honest about limits, defensible to adults.

  2.  **Deconstruct the Philosophical Basis:**
      *   Valid Consent requires:
          1.  **Capacity/Competence:** Can they understand?
          2.  **Disclosure/Information:** Do they know what they are getting into?
          3.  **Voluntariness:** Are they free to say no?
      *   *Adaptation for High School Context:*
          *   Capacity: Age is a proxy, but disability/language matters more.
          *   Information: Deception breaks this unless managed (debriefing).
          *   Voluntariness: Power dynamics (teacher/researcher) and social dynamics (friends/peers) are key.

  3.  **Drafting the Procedure (The "Consent Viability Protocol"):**
      *   Need a step-by-step flow.
      *   *Step 1: Capacity.* Is the participant able to understand? If no -> Stop (unless guardian consent + assent, but for high school science fair, usually high risk). Let's simplify: If they can't understand the *risks*, it's a no.
      *   *Step 2: Information.* Do they know the true purpose? If deception is used, is it necessary and is debriefing guaranteed?
      *   *Step 3: Voluntariness.* Is there pressure? (Teacher grade, social clique). Can they quit without penalty?
      *   *Step 4: Risk/Benefit.* Even with consent, is the harm too high? (This addresses the "valid consent but refused" requirement).
      *   *Decision Logic:* If any "Hard Stop" is hit, recommend rejection. If "Caution" is hit, require modification. If clear, recommend approval.

      *Refining the Procedure for the User:*
      *   Make it a "Three-Gate Test."
      *   Gate 1: Understanding (Competence + Information).
      *   Gate 2: Freedom (Voluntariness).
      *   Gate 3: Harm (Risk/Benefit independent of consent).
      *   Include specific rules for the hard cases mentioned (Deception, Extra Credit, Disability).

  4.  **Developing the Three Test Cases:**

      *   *Case 1: Peer Pressure/Snacks (Deception).*
          *   Gate 1 (Info): Deception used. Is it necessary? Yes, for peer pressure. Is debriefing planned? Yes. *Pass with condition.*
          *   Gate 2 (Freedom): Peer pressure is the topic, but is participation coerced? Assume no.
          *   Gate 3 (Harm): Psychological discomfort? Minimal.
          *   *Verdict:* Approve with strict debriefing protocol.
          *   *Objection:* Deception undermines trust; debriefing doesn't fix the lie.

      *   *Case 2: Homework/Extra Credit (Inducement).*
          *   Gate 1 (Info): Clear.
          *   Gate 2 (Freedom): Teacher offering points. This is coercive in a school setting. 5 points might be grade-changing.
          *   *Verdict:* Reject (or require alternative assignment).
          *   *Objection:* 5 points is trivial; students need data; it's not *that* coercive. (I need to make sure the procedure is strict here as requested).

      *   *Case 3: Belonging/Disability (Capacity + Relationship).*
          *   Gate 1 (Understanding): Mild intellectual disability. Can they understand "school belonging"? Researcher is a friend reading aloud.
          *   Gate 2 (Freedom): Friend researcher + vulnerable subject. High risk of "please my friend" bias.
          *   Gate 3 (Harm): Questions about belonging could be distressing.
          *   *Verdict:* Reject (without guardian consent + independent facilitator).
          *   *Objection:* Exclusionary; the friend knows best how to communicate; assent is possible.

  5.  **Drafting the Limitations Section:**
      *   Where does it fail?
      *   Value judgments (What counts as "minimal risk"?).
      *   Context blindness (Procedure doesn't know the specific school culture).
      *   The "Checklist Mentality" (Thinking ticking boxes equals ethics).
      *   What to do when stuck: Escalate to faculty/district, pause for more info.

  6.  **Review and Refine:**
      *   *Constraint Check:* Did I avoid citations? Yes. Is it a flowchart in words? Yes. Did I run the three cases? Yes. Did I explain limitations? Yes.
      *   *Tone Check:* Is it respectful of the student's role but firm on ethics?
      *   *Specific Instruction:* "I expect to dislike at least one verdict, so please do not soften the procedure." -> I need to ensure the Extra Credit case comes out as problematic, even if that's annoying for students who want data. The Disability case should also be strict.
      *   *Refining the Procedure:* Make sure the distinction between "Invalid Consent" (Stop) and "Valid but Unethical" (Stop for different reason) is clear.
      *   *Refining Case 1:* Deception is tricky. In high school science fairs, deception is often heavily restricted. I should lean towards "Conditional Approval" but highlight the risk.
      *   *Refining Case 2:* Extra credit is classic coercion. The procedure should flag this as a "Voluntariness Failure."
      *   *Refining Case 3:* Capacity + Relationship. This is a double bind. The procedure should flag this as "Capacity/Power Failure."

  7.  **Final Polish:**
      *   Organize with clear headings.
      *   Ensure the "Stop" points are obvious.
      *   Make sure the "Limitations" section is humble and practical.

  *(Self-Correction during drafting)*: I initially thought about allowing guardian consent for Case 3. But the prompt says "student research proposals... run by students on their classmates." A high schooler managing guardian consent for a disabled peer is likely beyond their competency. The procedure should flag this as "Beyond Student Researcher Scope."

  *(Self-Correction on Case 1)*: Debriefing is key. But does debriefing fix the consent? Philosophically, no. It mitigates harm. The procedure needs to treat deception as a "Red Flag" that requires higher scrutiny, not just a box to check. I will classify deception as a "Presumptive No" unless specific mitigation is proven.

  *(Self-Correction on Case 2)*: Extra credit. If there is an *equivalent* alternative (e.g., extra credit for a different task), it's less coercive. The prompt says "offer five points... to anyone who participates." It implies no alternative. I will rule this as Coercive.

  *(Self-Correction on Case 3)*: The researcher is a *close friend*. This creates undue influence ("Do it for me"). Combined with disability, this is high risk. Verdict: No.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # The Consent Viability Protocol (CVP)

  This procedure is designed for a high school ethics committee. It translates the three philosophical conditions of valid consent (Competence, Information, Voluntariness) into a sequential decision tree. It distinguishes between **Fatal Flaws** (consent is impossible/invalid) and **Correctable Flaws** (consent is possible but requires changes).

  **How to use this in a meeting:**
  Read the proposal. Move through the Gates in order. If you hit a **STOP**, the recommendation is **Rejection**. If you hit a **CAUTION**, the recommendation is **Modification Required**. If you pass all gates, the recommendation is **Approval**.

  ---

  ## Gate 1: Competence and Understanding
  *Philosophical Basis: Capacity*

  **Question 1.1: Can the participant understand the task and the risks?**
  *   **Look for:** Age, language barriers, cognitive disabilities, or emotional maturity relative to the task.
  *   **Sufficient Answer:** "Yes, the average student in this grade can understand the instructions and the potential discomfort."
  *   **Fatal Flaw (STOP):** The target group includes students who cannot comprehend the concept of "research" or "risk" (e.g., severe cognitive disability, very young children) *and* the researcher does not have a plan for guardian consent and independent advocacy.
  *   **Caution (MODIFY):** The task involves complex emotions or private data. The researcher must simplify language or verify understanding verbally before starting.

  **Question 1.2: Is the purpose of the study clear to the participant?**
  *   **Look for:** Deception, hidden agendas, or vague descriptions.
  *   **Sufficient Answer:** "Yes, the participant knows exactly what they are doing and why."
  *   **Fatal Flaw (STOP):** The study uses deception about *risks* (e.g., hiding that a task is stressful).
  *   **Caution (MODIFY):** The study uses deception about the *purpose* (e.g., saying it's about taste when it's about peer pressure).
      *   *Requirement for Modification:* There must be a mandatory, immediate debriefing where the truth is told, and the participant is given the option to withdraw their data *after* learning the truth. If no debriefing is planned, this becomes a **STOP**.

  ---

  ## Gate 2: Voluntariness and Power
  *Philosophical Basis: Freedom from Coercion and Undue Influence*

  **Question 2.1: Is there a grade or academic penalty for saying "no"?**
  *   **Look for:** Extra credit, course requirements, teacher involvement in recruitment.
  *   **Sufficient Answer:** "No. Participation is entirely separate from grading. There is an equivalent alternative assignment for extra credit, or no extra credit is offered."
  *   **Fatal Flaw (STOP):** Participation is required for a grade, OR extra credit is offered without a non-research alternative of equal effort. (This makes consent coerced).

  **Question 2.2: Is there social pressure to say "yes"?**
  *   **Look for:** Researcher recruiting friends, teammates, or subordinates (e.g., club president recruiting members).
  *   **Sufficient Answer:** "No. The researcher is recruiting anonymously or from a pool where saying 'no' carries no social cost."
  *   **Caution (MODIFY):** The researcher is recruiting friends or classmates they know well.
      *   *Requirement for Modification:* The researcher must use a "blind recruitment" method (e.g., a third party hands out surveys, or the researcher explicitly scripts a permission to decline without awkwardness). If the researcher insists on recruiting their own close friends directly, this becomes a **STOP**.

  **Question 2.3: Can the participant quit easily?**
  *   **Look for:** Lock-in, time commitment, public exposure.
  *   **Sufficient Answer:** "Yes. They can stop at any time without explanation."
  *   **Fatal Flaw (STOP):** Once started, the participant cannot leave (e.g., they are observed in a private setting without an exit route).

  ---

  ## Gate 3: Risk and Value
  *Philosophical Basis: Non-Maleficence (Even valid consent doesn't justify harm)*

  **Question 3.1: Is the risk greater than "Minimal"?**
  *   **Definition of Minimal Risk:** The probability and magnitude of harm or discomfort anticipated in the research are not greater than those ordinarily encountered in daily life or during routine school activities.
  *   **Sufficient Answer:** "No. The risks are minimal (e.g., boredom, minor embarrassment)."
  *   **Fatal Flaw (STOP):** The study risks psychological trauma, legal trouble, exposure of illegal activity, or severe social humiliation that cannot be undone.
  *   **Caution (MODIFY):** The study touches on sensitive topics (e.g., mental health, family life).
      *   *Requirement for Modification:* Anonymity must be guaranteed, and resources (e.g., counselor contact info) must be provided.

  **Question 3.2: Is the scientific value worth the intrusion?**
  *   **Look for:** Trivial questions asking for private data.
  *   **Sufficient Answer:** "Yes. The question answers something we don't already know."
  *   **Fatal Flaw (STOP):** The study asks invasive questions for a trivial or obvious result.

  ---

  ## Handling Multiple Problems
  If you encounter more than one **Caution**, the recommendation upgrades to **Rejection**. One flaw can be fixed; two flaws suggest the design is fundamentally flawed.
  If you encounter one **Fatal Flaw**, the recommendation is **Rejection** regardless of other factors.

  ## Handling "Valid but Refused"
  If a proposal passes all Gates (Consent is valid) but fails Gate 3 (Risk is too high for the value), the verdict is **Rejection**. You must state: *"Consent may be possible, but the risk-to-benefit ratio is unacceptable."*

  ---

  # Application to Proposals

  Here is the procedure applied to the three cases you provided.

  ## Case 1: The Peer Pressure Snack Study
  **Proposal:** Test if peer pressure affects snack choices. Participants told it is about "taste preferences." Confederates pressure them. Debriefing planned afterward.

  **Procedure Run:**
  1.  **Gate 1.1 (Competence):** High school students can understand taste tests. **Pass.**
  2.  **Gate 1.2 (Information/Deception):** Deception is used regarding purpose.
      *   *Check:* Is risk deception used? No (snacks are low risk).
      *   *Check:* Is debriefing planned? Yes.
      *   *Check:* Can they withdraw data after debriefing? Proposal must specify this.
      *   *Verdict:* **Caution (Modify).** Must guarantee the option to withdraw data after the truth is revealed.
  3.  **Gate 2.1 (Grades):** No mention of grades. **Pass.**
  4.  **Gate 2.2 (Social Pressure):** Confederates are applying pressure as part of the experiment, not recruitment. Recruitment method not specified, assume neutral. **Pass.**
  5.  **Gate 3.1 (Risk):** Eating snacks and being pressured is "Minimal Risk" (similar to daily social life). **Pass.**
  6.  **Gate 3.2 (Value):** Understanding peer pressure on diet has scientific value. **Pass.**

  **Final Verdict:** **Approve with Modifications.**
  *Condition:* The researcher must script the debriefing to explicitly state: "We lied about the purpose. You were actually being tested on peer pressure. You can choose right now to have your data destroyed, no questions asked."

  **Strongest Objection:**
  "Deception treats the participant as a means to an end, not a person. Even with debriefing, you have violated their autonomy in the moment. If a student feels humiliated by the pressure before you tell them the truth, the damage is already done. The committee should not normalize lying to classmates."

  ## Case 2: The Homework Survey with Extra Credit
  **Proposal:** Survey classmates about homework habits. Teacher offers 5 points extra credit for participation.

  **Procedure Run:**
  1.  **Gate 1.1 (Competence):** Students understand surveys. **Pass.**
  2.  **Gate 1.2 (Information):** Purpose is clear. **Pass.**
  3.  **Gate 2.1 (Grades/Coercion):** Teacher offers 5 points for participation.
      *   *Check:* Is there an alternative assignment? Proposal does not state one.
      *   *Verdict:* **Fatal Flaw (STOP).** In a school setting, points from a teacher are inherently coercive. A student cannot voluntarily consent when their grade is leveraged.
  4.  **Gate 2.2 (Social Pressure):** N/A (Already stopped).
  5.  **Gate 3 (Risk):** Low risk. **Pass.**

  **Final Verdict:** **Reject.**
  *Reason:* Voluntariness is compromised by academic inducement without alternative.

  **Strongest Objection:**
  "Five points is negligible; it won't change a grade significantly. Banning this kills student interest and makes data collection impossible. The teacher isn't forcing them, just incentivizing them. This procedure is too rigid for the reality of high school motivation."

  ## Case 3: The Belonging Survey with Disabled Peer
  **Proposal:** Survey classmates on school belonging. Includes a 16-year-old with a mild intellectual disability (IEP). Researcher is a close friend and plans to read questions aloud.

  **Procedure Run:**
  1.  **Gate 1.1 (Competence):** Participant has a mild intellectual disability.
      *   *Check:* Can they understand "school belonging" and the right to quit?
      *   *Check:* Is there guardian consent? Proposal implies student-on-student consent.
      *   *Verdict:* **Caution (Modify).** Requires guardian consent and verification of understanding.
  2.  **Gate 1.2 (Information):** Researcher reading aloud helps, but...
  3.  **Gate 2.2 (Social Pressure/Relationship):** Researcher is a *close friend*.
      *   *Check:* Can the participant say "no" to a close friend without guilt?
      *   *Verdict:* **Caution (Modify).** High risk of undue influence ("Do this for me").
  4.  **Gate 3.1 (Risk):** Topic is "school belonging."
      *   *Check:* For a student with a disability, questions about belonging could trigger significant distress or feelings of exclusion.
      *   *Verdict:* **Caution (Modify).** Requires counselor oversight.
  5.  **Multiple Problems Check:** We have three **Cautions** (Capacity/Guardian, Relationship/Influence, Emotional Risk).
      *   *Rule:* If more than one Caution is present, upgrade to **Rejection**.

  **Final Verdict:** **Reject.**
  *Reason:* The combination of vulnerability, close personal relationship, and sensitive topic creates too high a risk of invalid consent and emotional harm. This is beyond the scope of safe student-led research.

  **Strongest Objection:**
  "This is exclusionary. You are saying students with disabilities cannot participate in science. The friend knows how to communicate with them better than a stranger. With guardian permission, this is a valuable opportunity for inclusion, not exploitation."

  ---

  # Limitations of the Procedure

  You asked where this procedure will misfire and what it cannot do. Here is the honest assessment.

  **1. It Cannot Measure "Culture"**
  The procedure assumes "5 points of extra credit" is coercive. In some schools, 5 points is meaningless. In others, it is the difference between an A and a B. The procedure treats it as universally coercive to be safe, but this may feel bureaucratic in a low-stakes environment.
  *   **What to do:** When the procedure says "Stop" but the committee feels the risk is low, you must escalate to the Faculty Advisor. They know the school culture better than you do. Do not override the procedure yourself; ask for an exception based on context.

  **2. It Confuses "Process" with "Ethics"**
  A researcher can check every box (script the debriefing, get guardian consent, offer alternatives) and still conduct a mean-spirited or pointless study. The procedure ensures *valid consent*, not *good science* or *kindness*.
  *   **What to do:** Use Gate 3 (Risk/Value) as your safety valve. If a study feels exploitative even if consent is valid, vote "No" on the grounds of "Risk-to-Benefit Ratio," not consent.

  **3. It Struggles with "Gray" Capacity**
  Gate 1 asks if a participant can understand. But "mild intellectual disability" varies wildly. The procedure tells you to flag it, but it cannot tell you *if* that specific student understands.
  *   **What to do:** This is a value judgment requiring expertise you do not have. In these cases, the procedure must hand off the decision. Your recommendation should be: *"Contingent on approval from the District Special Education Director or School Psychologist."* Do not make that competency call yourself.

  **4. It Cannot Resolve Conflicting Values**
  In Case 3, there is a conflict between **Protection** (rejecting the study to prevent harm) and **Inclusion** (allowing the student to participate). The procedure prioritizes Protection (Risk Aversion).
  *   **What to do:** Acknowledge this trade-off in your minutes. "We rejected this to prioritize safety, acknowledging this limits inclusion." This shows you understood the value conflict, even if you chose safety.

  **5. The "Checklist Mentality" Trap**
  The biggest risk is that you or the researchers will think passing the checklist *makes* the study ethical. It does not. It only makes it *procedurally* sound.
  *   **What to do:** When you present your verdict, do not say "It passed the checklist." Say "We determined that consent was voluntary and informed." Use the checklist to reach the conclusion, but defend the conclusion, not the tool.

  **When the Procedure Gives No Clear Answer:**
  If you are stuck between two "Cautions" and aren't sure if they upgrade to a "Stop," or if the "Minimal Risk" definition is ambiguous:
  1.  **Pause the Vote.** Do not rush.
  2.  **Request a Prototype.** Ask the researcher to run the study on one adult (teacher/parent) first to demonstrate the risk level.
  3.  **Default to Safety.** If you are unsure if consent is valid, assume it is not. It is better to block a safe study than approve an unsafe one. You can always invite the researcher to resubmit with more safeguards; you cannot undo harm once data is collected.
