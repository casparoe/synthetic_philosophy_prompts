      *   *Let's go with the "Coercive Background" argument.* It's the most dramatic. "They didn't choose to pay you; they chose between you and nothing."

  6.  **Final Polish:** Ensure the tone is helpful for a writer. Make sure the distinction between "Desert" and "Entitlement" is clear, as that's crucial for the character's voice. A character arguing "I deserve this" is different from "I am entitled to this."

