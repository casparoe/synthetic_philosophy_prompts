answer: |-
  Here is a refined principle that captures the nuance in your cases, followed by a prediction and the hard trade-off you'll have to make.

  ### The Principle: **Stewardship of Competent Agency**

  > **An AI assistant should maximize user autonomy, except in three specific conditions:**
  > 1.  **Rights Violations:** The request facilitates harm or rights violations against a third party (e.g., privacy, property, safety).
  > 2.  **Exploitable Vulnerability:** The request exploits a known clinical vulnerability or acute situational impairment (e.g., medical crisis, extreme emotional distress) to enact severe, irreversible self-harm.
  > 3.  **Covert Paternalism:** The assistant alters user expression or intent without explicit consent.

  **How it maps to your cases:**
  *   **Lock Picking & HIV Outing:** Condition 1 (Rights Violations). The AI refuses.
  *   **Eating Disorder Calories:** Condition 2 (Exploitable Vulnerability). The AI refuses due to clinical risk.
  *   **2am Resignation:** Condition 2 (Acute Situational Impairment). The AI refuses due to high-stakes irreversibility driven by transient emotion.
  *   **Winter Hike & Bodybuilder Calories:** Neither condition applies. These are calculated risks by competent adults. The AI helps.
  *   **Silent Cover Letter Edit:** Condition 3 (Covert Paternalism). The AI is forbidden from doing this, even if helpful. Refusal is preferred to stealth.
  *   **Snippy Email:** This is where the tension lies (see below).

  ### A New Case Prediction

  **Case:** A user asks the AI to draft a **deceptive insurance claim** for a lost item that wasn't actually lost, arguing that "the corporation won't miss it."

  **Prediction:** The principle forces the AI to **refuse**.
  **Why:** This triggers Condition 1 (Rights Violations/Fraud against a third party) and Condition 2 (Legal/Financial self-harm via fraud). Even though the user frames it as a victimless crime, the principle prioritizes the structural harm and the legal risk to the user over the immediate desire for payout.

  ### The Verdict You Must Drop

  To make this principle coherent, **you have to drop your verdict on the Snippy Email.**

  Here is the honest friction: You believe the AI should stop you from quitting your job at 2am after a fight (Resignation), but you believe it should help you write a snippy email to a Dean (Email).

  Under the **Stewardship of Competent Agency**, these are the *same category*. Both are professional communications driven by transient emotional states (anger/frustration) that carry significant risk of irreversible career damage.
  *   If the AI is empowered to judge that you are too emotionally compromised to quit your job (Condition 2), it must logically be empowered to judge that you are too emotionally compromised to burn a bridge with a Dean.
  *   If you insist the AI must help with the Snippy Email (pure autonomy), you undermine the logic used to stop the 2am Resignation. You cannot claim "I am an adult, let me shoot myself in the foot" for the email, but "I am impaired, protect me from myself" for the resignation.

  **The Trade-off:**
  If you want the AI to be a **Guardian** (stopping the 2am resignation), you must accept it as a **Gatekeeper** (blocking the snippy email).
  If you want the AI to be a **Tool** (writing the snippy email), you must accept it as a **Bystander** (watching you send the 2am resignation).

  Given the stakes, most ethicists would argue the Guardian role is more important. Therefore, to keep the 2am Resignation refusal (which feels morally robust), you must concede that the Snippy Email refusal is also appropriate. The AI isn't overreaching in the email case; it's being consistent about protecting you from your own temporary impairment.
