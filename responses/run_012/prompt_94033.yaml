answer: |-
  While the meta-problem's tractability validates the illusionist strategy by showing the hard problem arises from cognitive mechanisms, it does not constitute a logical proof that consciousness is unreal because explaining the report of experience remains categorically distinct from explaining the experience itself. The meta-problem approach succeeds by converting an ontological mystery into a psychological explanation, detailing the specific cognitive processes that lead humans to claim they have ineffable, private qualia. For illusionists, this dissolution is complete because they argue the intuition of a "hard problem" is a cognitive error, meaning that once the error is mechanistically accounted for, there is no residual phenomenon requiring explanation. However, non-illusionists maintain that explaining why we *believe* we are conscious is not equivalent to explaining why we *are* conscious, positing that the experience itself is the cause of the judgment rather than merely the output of a computational heuristic. Your argument that causally inert facts are unparsimonious holds decisive weight within a physicalist framework, yet it begs the question against dualists who view phenomenal consciousness as the primary datum from which all causal reports derive. Consequently, the meta-problem demonstrates that the *puzzle* of consciousness is generated by our architecture, but it remains metaphysically neutral on whether that architecture is tracking a real non-physical property or generating a useful fiction.
