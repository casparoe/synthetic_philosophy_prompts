answer: |-
  Your hypothesis is correct, and your colleague's dismissal is indeed too easy. The "different questions" defense (definition vs. criterion) is the standard diplomatic off-ramp, but it fails to account for why Peirce felt compelled to rebrand his view as "Pragmaticism" specifically to distance it from James. Peirce didn't think they were merely emphasizing different aspects of the same project; he thought James had corrupted the logical core of the maxim.

  Your diagnosis—that the impasse rests on conflicting views about the *function* of a truth theory (meaning vs. norm vs. property) layered over a metaphysical disagreement about realism—is the most productive way to unblock the reading group. However, I would sharpen it further: the core friction is not just about what the theory is *for*, but about the **direction of fit** between belief and world, and specifically whether truth functions as a **constraint** on inquiry or a **consummation** of it.

  Here is the diagnosis of the impasse, engaging the specific moves you listed, followed by a proposal for what counts as progress.

  ### 1. The Diagnosis: Three Layers of Conflict

  You are right that the dispute slides between semantics, metaphysics, and norms. But the slide isn't accidental; it's structural.

  **A. The Semantic Layer (Meaning vs. Verification)**
  Peirce's pragmatic maxim is a rule for translating concepts into sensible effects to clarify *meaning*. For Peirce, truth is not defined by the maxim; truth is the *object* of the inquiry clarified by the maxim. James, conversely, applies the maxim directly to the concept of truth itself. For James, the "meaning" of truth *is* its verification process ("truth happens to an idea").
  *   **The Clash:** When you present the "stable, unresponsive belief" case, Peirce sees a category error. You are describing a *belief* that is stable, but you haven't described *inquiry* in his sense. For Peirce, inquiry is the struggle to remove the irritation of doubt caused by the "outward clash" (Secondness). If the belief is unresponsive to the world, it isn't the result of inquiry, it's the result of social reinforcement. James sees no error; if the belief guides action successfully without friction, the "meaning" of its truth is exhausted.
  *   **Diagnosis:** Peirce treats truth as a **regulative presupposition** of inquiry (we must assume there is a truth to find to inquire at all). James treats truth as a **retrospective label** on successful navigation (we call it true because it worked).

  **B. The Metaphysical Layer (Realism vs. Humanism)**
  This is the "made vs. discovered" chunk you identified. Peirce was a Scholastic Realist; he believed in real generals and that the real is that which *would* be represented in the final opinion regardless of what you or I think. The "fatedness" of the final opinion is not an empirical prediction but a metaphysical claim about the convergence of experience under the pressure of a mind-independent reality.
  James is more nominalist/humanist here. Truth is made in the course of experience.
  *   **The Clash:** In your case (the unresponsive but useful belief), Peirce must say: "If it is unresponsive to the world, reality *would* eventually break it, even if we can't see when." His claim relies on a counterfactual about the nature of Reality. James says: "If it never breaks, it is true."
  *   **Diagnosis:** The disagreement is about the **Independence Condition**. Peirce requires truth to be independent of finite inquirers (though dependent on the ideal community). James allows truth to be dependent on the satisfactions of finite inquirers. This is not verbal; it is a disagreement about whether the universe has a grain that we must follow (Peirce) or whether we carve the universe by following our interests (James).

  **C. The Normative Layer (Logic vs. Ethics of Belief)**
  Peirce is doing logic and metaphysics; James is often doing ethics and psychology.
  *   **The Clash:** The "wishful thinking" objection against James assumes truth is a logical standard. James replies that he is offering an ethical permission slip for cases where evidence is underdetermined (Will to Believe).
  *   **Diagnosis:** Peirce's "vacuity" objection (the final opinion never arrives) misses Peirce's point. The final opinion is a **limit concept** (like a mathematical limit), not a temporal destination. It functions to normatively constrain current belief: "Don't claim you know X unless your method is of the kind that *would* converge on X." James's utility criterion functions to normatively encourage belief: "Believe X if it helps you live, provided no evidence defeats it."

  ### 2. Engaging the Specific Moves

  *   **Convergence as Regulative Ideal:** Peirce's convergence is not an empirical claim that we will all agree. It is the claim that *if* we inquire long enough, the external force of reality will compel agreement. Your colleague is wrong to say this is just a definition; it's a claim about the intelligibility of the universe. If the universe were chaotic, Peirce admits inquiry is impossible. James doesn't need the universe to be intelligible in that way; he just needs our specific path through it to be navigable.
  *   **Utility in James:** James's "working" is often misunderstood as "feeling good." It means "leading us through experience without collision." Your case stipulates "no collision." James must call this truth. Peirce calls it luck. The disagreement is whether **eternal luck counts as truth**. Peirce says no (because it lacks the right causal history with the object); James says yes (because causal history is only relevant insofar as it produces collisions).
  *   **Pragmaticism:** Peirce's retreat to "Pragmaticism" was an attempt to excise the psychological/voluntarist elements James introduced. Peirce wanted to save the *logical* maxim from the *ethical* maxim. He realized that if truth is just "what works," then logic collapses into prudence.
  *   **Vacuity vs. Wishful Thinking:** These objections mirror each other. The anti-Peircean says: "Your truth is unreachable, so it's useless." The anti-Jamesian says: "Your truth is too reachable, so it's dangerous." This symmetry confirms your hypothesis: they are optimizing for different values. Peirce optimizes for **objectivity** (security from individual bias); James optimizes for **agency** (the right to believe in the face of uncertainty).

  ### 3. What Counts as Progress?

  Given this diagnosis, simply picking a side or declaring a "verbal dispute" is stagnation. Progress requires disentangling the jobs the concept of "truth" is being asked to do.

  **A. A Distinction: Truth vs. Warranted Assertibility**
  The most fruitful move (championed by later pragmatists like Dewey and Misak) is to concede that James is offering a theory of **warranted assertibility** (when are we *right* to hold a belief?), while Peirce is offering a theory of **truth** (what makes the belief *correct*?).
  *   **Progress Condition:** Your group should agree that James's account explains the *value* of truth (why we seek it), while Peirce's account explains the *norm* of truth (what governs the seeking). If you treat James's view as a theory of justification and Peirce's as a theory of truth conditions, the "stable unresponsive belief" case resolves: James says it is *justified* (warranted); Peirce says it is not *true* (lacks correspondence/convergence). They aren't contradicting; they are indexing different predicates.

  **B. A Change of Question: The Role of Counterfactuals**
  Shift the question from "What is truth?" to "What role do counterfactuals play in epistemology?"
  *   Peirce's account *requires* robust counterfactuals (what *would* happen if inquiry continued).
  *   James's account relies on actuals (what *does* happen in experience).
  *   **Progress Condition:** A formal result or argument about the necessity of counterfactuals in inquiry. If you can show that inquiry is impossible without presupposing Peircean counterfactuals (e.g., that evidence *would* behave differently if the hypothesis were false), then Peirce wins on the norms of inquiry, even if James wins on the psychology of satisfaction. Cheryl Misak's work is essential here: she argues that even Jamesian verification implicitly commits you to Peircean counterfactuals (you believe it works because you think it *would* continue to work).

  **C. Nothing at All? (The Deflationary Option)**
  It is possible the sides should stop talking past each other, but only if they admit they are doing different projects. If your colleague insists they are answering "different questions," push them to specify *which* questions. If they say "Peirce is doing metaphysics, James is doing ethics," then agree to stop calling both "Theories of Truth." Call one "Metaphysical Realism about Inquiry" and the other "Ethical Instrumentalism about Belief." The progress here is **terminological precision** that prevents the "wishful thinking" objection from being leveled at James (it's not truth, it's policy) and the "vacuity" objection from being leveled at Peirce (it's not a prediction, it's a presupposition).

  ### 4. Neo-Pragmatism: Same Fight, Different Name?

  The diagnosis carries over, but the metaphysical stakes are often lowered.

  *   **Rorty (The Jamesian Turn):** Rorty explicitly drops Peirce's "final opinion" and the idea of truth as "getting it right." He sides with James but radicalizes him: truth is just "what it is better for us to believe." For Rorty, the Peircean "constraint of the world" is an unnecessary philosophical fiction. The dispute here is no longer about truth but about whether we need the concept of "objectivity" at all.
  *   **Putnam/Haack/Misak (The Peircean Recovery):** These thinkers try to save Peirce from Rorty's relativism. Putnam's "Internal Realism" attempts to keep the Peircean convergence without the metaphysical baggage of the "final opinion." Haack argues for a "foundherentism" that respects Peirce's realism about the world while acknowledging James's insights into verification.
  *   **The Shift:** The neo-dispute is less about "What is truth?" and more about "Can we have normativity without metaphysics?" Rorty says yes (social norms suffice). Misak/Putnam say no (we need the idea of a mind-independent constraint to make sense of *correction*).

  **Recommendation for the Group:**
  Stop trying to reconcile the definitions. Instead, run the "stable unresponsive belief" case through a **normative filter**. Ask: "If we treat this belief as *true*, what happens to our practice of inquiry?"
  *   If we treat it as true (James), we validate the current community's success.
  *   If we treat it as false (Peirce), we keep open the possibility that the community is deluded and must remain open to external shock.
  *   **The Progress:** Recognize that Peirce's definition is designed to **protect inquiry from itself** (preventing consensus from counting as truth), while James's is designed to **protect inquirers from skepticism** (allowing useful beliefs to count as truth). The dispute is ultimately about whether the primary danger to knowledge is **dogmatism** (Peirce's fear) or **skepticism** (James's fear).

  If you frame it that way, you aren't just stating their views cold; you're exposing the *anxieties* driving the metaphysics. That is usually where the real philosophy lives.
