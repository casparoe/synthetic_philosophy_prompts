prompt: |-
  I'm prepping for a seminar on religion and the state and I keep hearing the same four-country comparison, and I want to know whether the version I've absorbed is actually defensible before I repeat it in front of people who know better. You're a scholar of comparative church-state law and religion — think carefully, and before you get into the audit give me a short brainstorm of what you take the load-bearing institutional differences between England, Germany, France and the US to be, so I can see your map before you start marking mine.

  A colleague gave me this summary in a draft chapter. Here's roughly how she puts it, from memory:

  England, Germany, France and the US all start from the same Christian inheritance but took four different exits. England kept an established church: the Church of England is the state church, its bishops sit in Parliament, and the state pays for it out of general taxation, which is why disestablishment is still a live argument there. The US went the other way and wrote a wall of separation into the First Amendment, so religion is a private matter and the state neither funds nor regulates it — hence no church tax and no religious education in public schools. France is the purest version of this: the 1905 law separated church and state completely, so the French state recognises no religion, pays for none, and treats laïcité as the national creed. Germany looks separationist too but kept a medieval relic — the state collects the church tax for the Catholic and Protestant churches, which means German taxpayers are funding the churches whether they belong or not, and you have to go to the tax office to get out of it. So England is the real outlier, and the other three are three flavours of the same separationist idea.

  Go through it claim by claim: what's accurate, what's a harmless simplification, what's a conflation that actually matters, and what's just wrong. For anything in the last two buckets, say what the correct picture is and what a defender of that country's arrangement would point to as the most misleading single sentence. Then tell me whether her overall conclusion — England is the odd one out, the other three are variants of separation — survives once the errors are fixed, or whether the correction changes which country is actually the odd one. I'm inclined to think she's basically right about France and Germany and less sure about England. Dont give me a reading list or citations, I just want to know which parts of this I should stop repeating.
