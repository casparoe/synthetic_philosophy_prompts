  7.  **Synthesize Specific Claims:**
      *   *A's Agreement-on-Facts Test:* Does it show the dispute is verbal? **No.** In institutional contexts, the "name" *is* the fact (e.g., "married," "corporation," "president"). Agreeing on brute facts doesn't settle institutional facts.
