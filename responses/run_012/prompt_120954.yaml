answer: |-
  Good morning. For those who don't know me, I'm [Name], Miriam's great-nephew.

  Miriam left instructions for this morning. They were tucked into her will, written in the same hand she used to mark up undergraduate essays. She wrote that if anyone wished to claim she had survived her death, they must first state what would count as evidence against it. If they could not specify how she might *not* have survived, they were to offer a minute of silence instead.

  I know what that sounds like. It sounds like a trick to shut us up. But knowing Miriam, it wasn't about silence as punishment. It was about silence as respect. She believed that words should do work. If a sentence doesn't change anything about how we expect the world to be, it isn't false—it's just unfinished.

  She spent her life studying a philosopher who famously said that talk of the soul was meaningless unless you could describe what it looked like. Miriam loved that man, but her favorite story about him wasn't from his books. It was from 1988, when he choked on a piece of smoked salmon and his heart stopped for four minutes. He woke up and wrote about a red light, divine beings, a river of space and time.

  Anyone else might have used that to rewrite their life's work. He didn't. He said it was likely a dying brain firing in strange patterns. He admitted the experience felt real, but he refused to call it evidence. Miriam loved him for that refusal. She told me once that integrity isn't holding your position when it's easy; it's holding it when the light is red and the guardians are waiting. She wanted that same honesty from us today.

  So, let me try to pass her test. I want to say that Miriam survives. I want to say she is watching us, or that her spirit is in this room.

  But if I say that, I have to ask: what would prove me wrong? If she is here, what would it look like if she *wasn't*? If her spirit survives, what makes it *her* spirit and not just a copy of her memories? If I say she lives on in our hearts, that is an empirical claim—and the evidence is thin. She is not here. The chair is empty. The voice is silent.

  By her own standards, I cannot verify that she survives. And because I cannot specify what would count against it, I cannot honestly claim it as fact.

  But here is where the test leads us, and why I think she gave us this instruction. She knew half this room would want to say she is in a better place. She knew the other half would check their watches for logical consistency. She gave us the silence to bridge that gap.

  If we cannot verify her survival, we are not forbidden to hope for it. We are just forbidden from confusing that hope with knowledge. The verification test wasn't a wall; it was a filter. It separates what we know from what we love. We know she is gone. We love the idea that she isn't.

  So, I am going to do what she asked. I cannot provide the evidence against her death, so I cannot claim she lives. Instead, I offer the silence.

  But not before saying this: There is one way she survives that is verifiable. We are the evidence.

  Her kindness is not a soul; it is a cause. Her arguments are not ghosts; they are effects. When I speak carefully, when I refuse to comfort someone with a lie, when I value precision over ease, that is Miriam. That is empirical. That is observable. She survives in the habits she taught us, in the rigor she demanded, in the way this room is gathered not to pretend she is here, but to acknowledge the shape of the space she left behind.

  That is the survival we can verify. The rest—the light, the guardians, the watching over us—that belongs to the silence. And that is okay.

  Miriam didn't want us to be correct about her; she wanted us to be honest. So, in accordance with her note, and in honor of the things we cannot test but cannot bear to lose, I invite you to join me in that minute.

  Let us sit with the unfinished questions. Let us sit with the love that has no criterion of identity. Let us sit with Miriam, who knew that sometimes the only honest thing left to say is nothing at all.

  Thank you.
