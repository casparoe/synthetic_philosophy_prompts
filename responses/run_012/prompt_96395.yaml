      *   **Progressive:** Opens new capabilities (zero-shot reasoning, multimodal integration), predicts performance on unseen tasks.
      *   **Degenerating:** Leaderboard overfitting, squeezing 0.5% on GLUE via ensemble tricks, compute-driven brute force without architectural insight.

