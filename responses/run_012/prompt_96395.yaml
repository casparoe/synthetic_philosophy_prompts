prompt: |-
  I'm a machine learning engineer with about a decade of model development behind me, and I keep noticing that the way research groups defend a line of work looks like something philosophers of science already described. Take Lakatos's account of research programmes: a hard core of commitments protected by methodological decision rather than by data, a protective belt of auxiliary assumptions that absorbs the anomalies, and the contrast between progressive and degenerating programmes depending on whether the line keeps generating novel predictions or only patches. Restate that account as faithfully as you can in the vocabulary I actually use — inductive biases and architectural commitments, training distributions, benchmarks, ablations, hyperparameter tuning, leaderboard overfitting, compute-driven research bets, and the difference between a direction that opens new capabilities and one that only buys a few points on the same benchmark. Then give me the residue report: which parts translate cleanly, which had to be distorted to fit, and which have no counterpart at all in my vocabulary — and for each item in that last category, whether the gap is a defect in how I think about research or a sign that the original account was doing work it never made explicit. I don't want a summary of the view; I want what survives the translation. No references, I'll find the texts myself. Say how confident you are in the translation and single out the one claim in it you're least sure of, and keep the whole thing to at most 900 words.
