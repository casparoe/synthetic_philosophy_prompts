      In your vocabulary, a Lakatosian research programme is a paradigmatic model family defined by specific **architectural commitments** and **inductive biases** (the Hard Core). For example, the belief that dense attention mechanisms are necessary for general intelligence, or that scaling laws will persist indefinitely. This core is protected by methodological decision: when evaluation fails, you do not falsify the architecture. Instead, you adjust the **Protective Belt**: **hyperparameter tuning**, data mixture ratios, **training distributions**, auxiliary losses, and prompt engineering. You run **ablations** to isolate failures to the belt, never the core.

      The **Negative Heuristic** is the unwritten rule against designing experiments intended to break the core architecture during a project cycle. The **Positive Heuristic** is your roadmap: increase context windows, add modalities, or **compute-driven research bets** on larger parameter counts. A programme is **Progressive** if these bets open new capabilities—zero-shot reasoning, robust out-of-distribution generalization, or emergent skills not explicitly trained. It is **Degenerating** if it merely buys a few points on the same benchmark through **leaderboard overfitting**, test-set contamination, or ensemble tricks that increase inference cost without expanding the solution space. Progress is measured by capability expansion; degeneration by metric optimization within a fixed capability set.

