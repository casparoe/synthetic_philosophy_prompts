answer: |-
  **Graduate Seminar: Explanation in the Social Sciences**
  **Take-Home Final Examination**

  **Time Allowed:** 90 Minutes
  **Word Limit:** 1,500 words maximum

  **Question 1**

  Consider the following case:

  > Over roughly two generations, a devotional movement — call it the Ashen Path — spreads through a set of highland villages. Its teachings are otherworldly: they concern ritual purity, the fate of the soul, and the authority of a lineage of teachers. They say nothing about commerce, contracts, or profit. Shortly after the movement takes hold, a distinctive institution appears in the same villages: long-distance trading partnerships in which unrelated households pool capital and hold it for years, on terms enforced by reputation rather than by courts. The geography and the timing of the two developments coincide almost exactly. The traders themselves almost never invoke the Path to justify what they do; asked to explain their partnerships, they speak in flatly practical terms. And the villages that adopted the Path were, before its arrival, already somewhat marginal and mobile, and they faced the same new trade routes as neighboring villages that did not adopt it.

  Write an essay that analyzes the explanatory status of the claim that the Ashen Path caused the trading institution. Your answer must address the following three points:

  1.  Specify what would be required to establish the Path as a *cause* of the partnerships rather than a mere accompaniment or an ex post narrative frame.
  2.  Distinguish between at least three distinct senses in which values might explain a practice in this context (e.g., as conscious motives, as functional prerequisites, or as selection mechanisms), and assess which fits the case best.
  3.  Given that you have only this single historical case available, describe what specific evidence could discriminate among these readings, and explicitly state what would have to be true for the causal claim to be false.

  ***

  **Model Answer**

  To claim that the Ashen Path caused the emergence of long-distance trading partnerships is to assert a counterfactual dependency: that without the Path, the specific institutional form of reputation-based capital pooling would not have arisen when and where it did. However, the case presents a classic problem of spurious correlation. The coincidence of timing and geography is necessary but insufficient for causality. To move beyond seeing the Path as a mere accompaniment—or a retrospective narrative imposed by observers—we require a mechanism that bridges the gap between otherworldly doctrine and worldly economic behavior. Since the doctrine explicitly ignores commerce, the causal link cannot be direct instruction. It must operate through an unintended consequence or a structural affinity.

  Establishing causality here requires ruling out common causes. The prompt notes that these villages were already marginal and mobile, facing new trade routes similar to neighbors who did not adopt the Path. This suggests that economic opportunity alone is insufficient to explain the *specific* institutional form (long-term, reputation-based pooling). However, it also raises the possibility that a third variable—perhaps a specific social disruption or demographic shift—caused both the religious conversion and the economic innovation. To prove the Path is the cause, one must demonstrate that the religious change preceded the economic change in a sequence that allows for socialization, and that the specific norms of the Path altered the cost-benefit analysis of trust.

  This leads to the second requirement: distinguishing the senses of explanation. We must separate the agent's reasons from the observer's functionalism.
  First, *agent-centric explanation* fails here. The traders speak in "flatly practical terms" and do not invoke the Path. If culture causes action only through conscious motivation, the Path is irrelevant.
  Second, *functional fit* suggests the doctrine inadvertently lowered transaction costs. If the Path emphasizes ritual purity and truth-telling to teachers, it may have generalized into a broader norm of honesty, making reputation enforcement viable where courts were absent. Here, the values explain the practice not because traders intended it, but because the practice could only survive in a normative environment the Path provided.
  Third, a *selection effect* offers a competing explanation. The Path may not have changed behavior but rather attracted individuals already predisposed to mobility and risk. If the "marginal and mobile" villagers were the ones most likely to convert, the Path did not cause the trading mentality; it selected for it. In this reading, the correlation is real, but the causal arrow is reversed or non-existent.

  Distinguishing these readings with a single historical case is methodologically perilous but not impossible. We cannot run a controlled experiment, so we must look for internal variation and negative cases within the available data. To discriminate between the functional fit and the selection effect, one would need evidence of behavioral change *after* conversion among families who were previously uninvolved in trade. If long-standing villagers adopted the Path and subsequently entered partnerships, the selection effect is weakened. Conversely, if the traders were converts while non-trading villagers remained non-converts, selection is more likely.

  Furthermore, we must look for evidence of the mechanism of trust. If the partnerships rely on reputation, there should be records of sanctioning. Do Path members punish defectors more severely than non-Path neighbors? If the Path provides a "moral community" that extends creditworthiness, we should see lower interest rates or higher capital pooling among adherents compared to non-adherents on the same trade routes.

  Finally, and most critically, we must define the conditions under which the causal claim is false. A robust causal claim must be falsifiable. For the Path to be the cause, it must be true that removing the normative structure of the Path would collapse the institution. Therefore, the claim is false if: (1) identical trading partnerships existed in neighboring non-Path villages facing the same trade routes; or (2) the partnerships predate the arrival of the Path in the earliest villages; or (3) Path adherents are found to cheat on partners at the same rate as non-adherents, indicating the doctrine does not actually enforce reputation.

  We must acknowledge that this case is likely underdetermined. Even with the evidence above, we cannot fully disentangle the religious ethic from the social network effects of the movement itself. It may be that the *structure* of the Path (a lineage of teachers) created the network, not the *values* (purity). A strong explanation admits this limit. We can argue the Path was a necessary condition for this specific form of trust, but we cannot definitively prove it was the sufficient cause without comparative cases that are, by the prompt's constraint, unavailable. Thus, the claim remains a plausible hypothesis about unintended consequences, contingent on the absence of negative cases in the surrounding region.

  ***

  **Marking Scheme (25 Marks)**

  | Move | Description | Marks | Characteristic Miss |
  | :--- | :--- | :--- | :--- |
  | **1. Causality vs. Correlation** | Identifies that timing/geography is insufficient and demands a mechanism (e.g., trust enforcement) to rule out spuriousness or common causes. | 4 | Treats temporal succession as proof of causation. |
  | **2. Senses of Explanation** | Distinguishes between conscious motive (rejected), functional fit (norms lower costs), and selection effects (doctrine attracts traders). | 5 | Conflates the traders' silence with the absence of cultural influence. |
  | **3. Discriminating Evidence** | Proposes specific internal tests (e.g., behavioral change post-conversion, sanctioning rates, comparison with non-converts on same routes). | 5 | Suggests impossible evidence (e.g., "run an experiment" or "find more cases"). |
  | **4. Mechanism Specificity** | Explains *how* otherworldly purity translates to worldly trust (e.g., generalization of norms or community sanctioning). | 4 | Assumes a direct link between doctrine and profit without intermediary steps. |
  | **5. Falsifiability & Limits** | **Crucial:** States clearly what would make the claim false (e.g., partnerships in non-Path villages) and acknowledges underdetermination/network confounds. | 7 | Asserts the hypothesis is provable or fails to specify conditions for falsification. |

  **Total:** 25 Marks

  **Grading Notes:**
  *   **A Range (20-25):** Must secure full marks on Move 5. The candidate must explicitly articulate the conditions under which the causal claim fails and acknowledge the limits of single-case analysis.
  *   **B Range (15-19):** Strong on moves 1-4 but treats the causal claim as more certain than the evidence allows, or offers vague criteria for falsification.
  *   **C Range (10-14):** Describes the case well but fails to distinguish the senses of explanation or relies on functionalist tautologies.
  *   **Fail (0-9):** Recites Weberian thesis without applying it to the Ashen Path specifics; ignores the prompt's constraints.
