  *Wait, one nuance on Hayek's concession:* In "The Competitive Solution" (1978), Hayek acknowledged Lange's model was a valid *logical* construction but argued it was irrelevant to reality. The summary says he conceded it was "theoretically sound." That's the trap. It's sound *if* you assume omniscience, which defeats the purpose. I need to explain this distinction clearly.

  *Wait, one nuance on Mises:* Mises didn't just say "quantity of information." He said "no common denominator." The summary says "quantity... to allocate resources rationally." This blurs Mises (impossibility) with Hayek (difficulty). I need to point that out.

