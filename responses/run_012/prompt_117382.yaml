answer: |-
  ### The Tier List (Ranked by ability to pass the Swap Test)

  **S-Tier**
  *None.* (No artifact survives the test without smuggling a political definition into the "job" description.)

  **A-Tier**
  *   **Berlin Key:** Swapping for a standard key kills the locking behavior because the physical constraint, not the user's intent, enforces the security.
  *   **Padlocked Projector:** Swapping for a wireless system dissolves the pedagogical inflexibility, proving the cable lock specifically encodes the room's hierarchy.

  **B-Tier**
  *   **Speed Bump:** Swapping for a police officer preserves the speed reduction, but the bump removes the possibility of bribery or fatigue, stabilizing the enforcement.
  *   **Prepay Smart Meter:** Swapping for a landlord with a fuse box preserves the disconnection, but the meter automates the cruelty to remove human discretion.
  *   **Mechanical Tomato Harvester:** Swapping for human crews with strict quotas preserves the power dynamic, but the machine biologically necessitates uniform crops, hardening the agricultural shift.

  **C-Tier**
  *   **Low Overpasses:** Swapping for a toll booth preserves the exclusion of the poor, proving the politics lay in the policy, not the concrete height.
  *   **Pneumatic Molding Machines:** Swapping for scabs with hand tools preserves the strike-breaking, proving the politics lay in the capital-labor relation, not the pneumatics.
  *   **QWERTY Keyboard:** Swapping for Dvorak preserves the labor of typing and standardization lock-in, proving the politics lay in network effects, not the key layout.

  ***

  ### The Diagnosis

  Your suspicion is correct: the Swap Test proves too little because the definition of "same job" does all the work, and you cannot fix the test without begging the question.

  **The Fix (and why it fails)**
  To fix the test, you must add a constraint: *The swap must not increase the cost of maintenance for the social arrangement.* If you swap the low bridge for a toll booth, you require a toll collector (labor cost). If you swap the speed bump for a cop, you require a salary (financial cost). If you swap the Berlin Key for a guard, you require vigilance (psychological cost).
  However, this fix collapses the distinction between "artifact" and "social arrangement." An artifact *is* a crystallized social arrangement that lowers the maintenance cost of a specific political outcome. By adding the cost clause, you admit that the politics was always in the intention to minimize maintenance costs, not in the device itself.

  **The Item the Test Gets Wrong**
  The **Berlin Key**.
  Under the strict Swap Test, if you swap the key for a "security protocol" (a sign and a check-list), the locking behavior fails (Score 1, Artifact has politics). But if you swap it for a "night watchman," the security survives (Score 0, People have politics). The test forces you to decide beforehand whether a human guard is a "functional equivalent" to a brass mechanism. If you say yes, the Key loses its status as a political agent. If you say no, you have already decided that *material delegation* is what constitutes politics, rendering the test circular. The Key is the paradigmatic example of artifact politics in the literature, yet your test classifies it as political only if you arbitrarily exclude human substitutes from the "same job" category.

  **The Verdict on the Original Question**
  The criterion cannot be stated without already deciding the case. "Function" is not a neutral property of the object; it is a description of the object's role in a social network. To say the bridge's function is "transport" is to ignore the politics; to say its function is "exclusion" is to assume the politics.

  This does not dissolve the question, but it inverts it. Artifacts do not *have* politics of their own; they have *resistance*. They make certain political arrangements cheaper, harder to reverse, and easier to ignore than others. The debate isn't "does the artifact have politics?" but "how much friction does this artifact add to changing the social order?" The low bridge isn't political because it intends exclusion, but because it makes inclusion physically expensive (requiring demolition rather than just a policy change). Your reading group is fighting over agency when they should be fighting over inertia.
