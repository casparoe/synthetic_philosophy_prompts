answer: |-
  1. Standard epistemic logic errs not by assuming perfect reasoning, but by treating logical consequence as a context-independent relation rather than one indexed to a specific reasoning frame.
  2. For instance, a tired agent may believe "either the circuit is live or the breaker is off" and "the breaker is on," yet fail to infer "the circuit is live" because the disjunctive rule is inactive in their current reasoning frame.
  3. Such gaps are properly categorized as lapses of attention where the inference mechanism is temporarily unavailable, rather than fundamental deficits in logical competence.
  4. Critics who claim this merely renames the problem overlook that indexing closure transforms omniscience from a false universal claim into a variable parameter that tracks actual cognitive resources.
  5. By treating omniscience as a tractable parameter dependent on cognitive load, we preserve the formal utility of epistemic logic while accurately modeling the bounds of human reasoning.
