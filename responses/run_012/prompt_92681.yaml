  **Instructor's Note on Gricean Mechanics**

  *   **Flouting the Maxim of Relation (Relevance):** Throughout the poem, the speaker offers detailed physical descriptions of the apartment (radiators, bus noise, paint) in a context where the emotional subtext (loneliness, a plea for reconciliation) is the actual topic. The listener must calculate *why* these irrelevant details are being shared to find the meaning.
  *   **Flouting the Maxim of Quantity:** The speaker provides more information than is required for a simple apartment report ("The key turns twice," "radiator clicks"), signaling that the information carries weight beyond its literal truth.
  *   **Response to Implicature (Stanza 2):** The line *"You said someone else might like the light"* is the listener ignoring the literal talk of apartments and responding to the implicature of loneliness or invitation. They address the unsaid plea, not the said facts.
  *   **Retracting Implicature (Stanza 2 & 3):** The line *"I didn't mean anything by the space"* is the speaker explicitly denying any communicative intent beyond the literal words, attempting to retreat behind the Maxim of Quality after being caught flouting Relation.
  *   **Shifted Context (Stanza 4):** The final line, *"The key turns twice before it locks,"* is identical to the first. In Stanza 1, it is a mundane observation about security. In Stanza 4, after the rejection and denial, it implicates finality—the conversation and the relationship are now locked shut.
