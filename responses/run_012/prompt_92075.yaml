prompt: |-
  OK so background: I manage a small pile of money — my own savings plus a little from two friends who trust me and would prefer to keep trusting me — and it's mostly boring index stuff, but every few months something comes along that looks like a genuinly positive-expectation bet: a mispriced market, a stake in a friend's business, a sports line I think my model beats. The problem is always sizing. Every time I google how much I should put on, I get the Kelly criterion, and everyone online talks about it like it's a law of nature — bet the fraction that maximizes expected log wealth, done. But when I try to actually use it I get stuck, because the inputs it wants (a known probability, a known payoff, a bet you get to make over and over) are never quite what I have. I also keep reading that you should maximize the geometric mean of your outcomes rather than the arithmetic one, which I sort of understand for a bet I make a thousand times and not at all for a one-off. And someone told me that if your estimate of the edge is even slightly off, betting full Kelly is a disaster and you should bet a fraction of it — but I've never seen that turned into anything I could run before I actually wire money somewhere.

  So: write me a decision procedure for sizing a bet. Make it something I can run in an evening with a spreadsheet and no probability theory past arithmetic and averages. I want the questions asked in order, what counts as a good enough answer to each, the points where it should just say no, pass, stop, and the points where it's really a values judgment and I should get my own brain or the friends' sign-off involved instead of pretending there's a number. Some things it specifically has to handle: a bet I can make repeatedly versus a once-in-a-lifetime one; an edge I'm confident in versus one I'm guessing at; a bet where losing would actually change my life versus one where it wouldn't; and two or three positions that look independent but might all go bad in the same week. And it should be honest about when the whole Kelly frame just doesn't apply, rather than forcing a number out of me anyway.

  Then run it on three cases and show your work: (a) a sports bet where I've backtested a model over a few hundred past games and it's been well calibrated; (b) a friend's startup where I figure there's maybe a 3x if it works, it's a one-shot with no repeats, and I'd be in for a serious chunk of my savings; and (c) something where I'm pretty sure I have an edge but I built that estimate by staring at the same data I'd be betting on. I expect to not like at least one of the answers — that's fine, I'd rather the procedure tell me to bet small or not at all than flatter me. Finish by telling me what the procedure can't do and where it'll misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Manages a small pool of capital (own + 2 friends). Invests mostly in index funds but takes occasional "positive-expectation" bets (mispriced markets, private deals, sports).
      *   **Problem:** Sizing. Kelly Criterion is the standard advice but feels impractical (requires known probabilities, infinite repeats, sensitive to error). Geometric vs. Arithmetic mean confusion. Fear of overbetting due to estimation error.
      *   **Goal:** A practical decision procedure for bet sizing.
      *   **Constraints:**
          *   Runnable in an evening with a spreadsheet.
          *   No advanced probability theory (arithmetic/averages only).
          *   Must include stop/pass criteria.
          *   Must distinguish between values judgments and math.
          *   Must handle: Repeatable vs. One-off, Confidence levels, Ruin risk, Correlation risk.
          *   Must admit when Kelly doesn't apply.
      *   **Deliverables:**
          *   The Procedure (step-by-step).
          *   Three Case Studies (Sports model, Friend's Startup, Data-snooped edge).
          *   Limitations/Warnings.

  2.  **Deconstruct the Theory (for the Procedure):**
      *   *Kelly Criterion:* Maximizes long-term growth rate ($G = p \ln(1+fb) + (1-p) \ln(1-f)$). Requires accurate $p$ (probability) and $b$ (odds). Full Kelly is volatile; half-Kelly is standard industry practice to account for estimation error.
      *   *Arithmetic vs. Geometric:* Arithmetic is for one-off bets where you don't reinvest. Geometric is for compounding wealth over time. Since the user manages a "pile of money" intended to grow, Geometric is the right frame, *but* only if the bet is repeatable or part of a portfolio. For one-offs, "Risk of Ruin" matters more than growth rate.
      *   *Estimation Error:* If you think you have a 60% edge but it's actually 50%, Full Kelly bankrupts you. Fractional Kelly (usually 1/4 or 1/2) is the safety buffer.
      *   *Correlation:* If you have three "independent" bets that all rely on the same macro factor, you effectively have one big bet.
      *   *Utility:* Losing 50% hurts more than gaining 50% helps (loss aversion/psychological pain). This needs a "Sleep Well" cap.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Step 1: The Veto.* Before math, check if the bet is even allowed. Is it legal? Ethical? Does it violate the friends' trust agreement?
      *   *Step 2: The "One-Off" Check.* Is this repeatable? If yes, Kelly-adjacent. If no, it's venture capital style (affordable loss).
      *   *Step 3: Edge Estimation.* How do we get $p$ and $b$ without complex stats? Use conservative estimates. Apply a "fudge factor" for confidence.
      *   *Step 4: The Sizing Formula.* Don't use raw Kelly. Use Half-Kelly or Quarter-Kelly based on confidence.
      *   *Step 5: The "Ruin" Check.* Does this bet size threaten the total pool? Cap it at a % of total equity regardless of edge.
      *   *Step 6: Correlation Check.* Are there other open bets that overlap?
      *   *Step 7: The Friend Check.* If the size exceeds a certain threshold, friends must approve.

      *Refining the Math:* Keep it simple.
      *   Expected Value (EV) = (Win % * Win Amount) - (Loss % * Loss Amount).
      *   Kelly Fraction $\approx$ Edge / Odds. (Simplified).
      *   Better: Use a lookup table or simplified formula based on "Confidence Score."
      *   Let's create a "Confidence Multiplier." High confidence = 0.5 Kelly. Low confidence = 0.25 Kelly. Guessing = 0.
      *   Let's create a "Pain Cap." Max % of portfolio allowed on any single idea.

  4.  **Developing the Case Studies:**
      *   *Case A (Sports):* Repeatable, backtested, calibrated. This is the ideal Kelly candidate. But needs a haircut for estimation error.
      *   *Case B (Startup):* One-off, illiquid, high variance. Kelly is wrong here. This is "Affordable Loss" sizing.
      *   *Case C (Data Snooping):* High apparent edge, low confidence. The procedure should crush this bet size to near zero.

  5.  **Refining the Tone:**
      *   Direct, pragmatic, slightly skeptical of "finance bro" math.
      *   Acknowledge the social dynamic (friends' money).
      *   Emphasize that "no bet" is a valid output.

  6.  **Writing the Content (incorporating specific constraints):**
      *   *Constraint Check:* "No probability theory past arithmetic." -> Avoid logarithms in the instructions. Use a simplified Kelly approximation or a lookup table. Actually, the standard Kelly formula $f = (bp - q) / b$ is just arithmetic. I can use that but enforce a fractional application.
      *   *Constraint Check:* "Values judgment." -> Explicitly mark steps where the user must decide based on feelings/friendship, not math.
      *   *Constraint Check:* "Correlation." -> Add a specific step for overlapping risk.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the Kelly formula too complex for "arithmetic only"?
      *   *Fix:* Explain $b$ as "net odds received on the wager" (e.g., if you bet 100 to win 200, $b=2$). Explain $p$ as "win probability." The calculation is just multiplication and subtraction.
      *   *Critique:* What about the startup? Kelly implies you can rebalance. You can't rebalance a private equity stake easily.
      *   *Fix:* The procedure must branch. Path A: Tradable/Repeatable. Path B: Illiquid/One-off.
      *   *Critique:* The user mentioned "geometric mean."
      *   *Fix:* Explain simply: "Arithmetic is for what you expect to make on average. Geometric is for what you actually keep after volatility taxes us."

  8.  **Final Polish:**
      *   Ensure the "Stop/Pass" points are bold.
      *   Make sure the Case Studies show the *work* (the numbers plugged in).
      *   Ensure the Limitations section is honest about black swans and model risk.

  9.  *(Self-Correction on Case C)*: The prompt says "I expect to not like at least one of the answers." I need to make sure the procedure is strict enough to reduce the bet size on the data-snooped edge significantly, even if the raw EV looks high. I will introduce a "Data Quality Discount."

  10. *(Final check on Friends)*: The user manages friends' money. The procedure *must* include a transparency step. If the bet size is >X%, friends vote.

  Let's assemble the procedure.

  *Structure:*
  1.  Philosophy (Brief)
  2.  The Procedure (Steps 1-7)
  3.  The Spreadsheet Logic (Simple formulas)
  4.  Case Studies (A, B, C)
  5.  Limitations

  *Key Concept:* "Fractional Kelly with a Safety Cap."
  *Key Concept:* "Illiquid vs. Liquid branching."

  (Proceed to generate output based on this thought process.)
answer: |-
  Here is a decision procedure designed for your specific situation: a small pool of capital, mixed liquidity, social responsibility (friends' money), and a skepticism of theoretical perfection.

  It does not use logarithms. It uses arithmetic, conservative estimates, and hard "circuit breakers."

  ### The "Sleep-Well" Sizing Procedure

  **Goal:** Determine the dollar amount to wire.
  **Inputs:** Your total liquid portfolio value ($P$), your estimated win probability ($p$), the payout odds ($b$), and your confidence level.

  #### Phase 1: The Veto (Values & Structure)
  *Before touching the math, answer these. If you fail any, the bet size is $0.*

  1.  **The Friendship Test:** If this bet goes to zero, will your friends ask for money they can't afford to lose?
      *   *Yes:* **STOP.** Do not make the bet.
      *   *No:* Proceed.
  2.  **The Liquidity Test:** Can you exit this position if you need cash for an emergency, or is it locked up?
      *   *Locked up (e.g., startup equity):* Go to **Path B (One-Off)**.
      *   *Liquid/Repeatable (e.g., sports, stocks):* Go to **Path A (Kelly-Adj)**.
  3.  **The Correlation Check:** Do you have other open bets that would lose money for the *same reason* as this one? (e.g., betting on tech stocks and a tech startup; betting on the Chiefs and a prop bet on the Chiefs QB).
      *   *Yes:* Add the value of those existing bets to this proposed bet. If the total exceeds 15% of $P$, **STOP** or reduce size.
      *   *No:* Proceed.

  ---

  #### Phase 2: The Math (Path A vs. Path B)

  **Path A: Liquid / Repeatable Bets (Sports, Public Markets)**
  *Use this when you can make the bet again and again with similar odds.*

  1.  **Estimate Probability ($p$):** What % of the time do you win? Be conservative. If your model says 60%, write down 55%.
  2.  **Estimate Odds ($b$):** How much do you win per $1 risked? (If you bet $100 to win $110, $b = 1.1$).
  3.  **Calculate Raw Edge:**
      $$ \text{Edge} = (p \times b) - (1 - p) $$
      *   *If Edge $\le$ 0:* **PASS.** No bet.
  4.  **Calculate Raw Kelly Fraction:**
      $$ \text{Kelly \%} = \text{Edge} / b $$
  5.  **Apply Confidence Discount:** How did you get $p$?
      *   *Backtested over 500+ events, out of sample:* Multiply Kelly % by **0.5** (Half-Kelly).
      *   *Strong intuition + some data:* Multiply Kelly % by **0.25** (Quarter-Kelly).
      *   *Gut feel / "Looks cheap":* Multiply Kelly % by **0.1** (Tiny Kelly).
      *   *Data you stared at until it looked good:* Multiply Kelly % by **0** (Pass).
  6.  **Apply The "Ruins" Cap:**
      *   Is the resulting dollar amount > 10% of Total Portfolio ($P$)?
      *   *Yes:* Cap at 10%. (This protects against "fat tail" risk where your probability estimate is wrong).
      *   *No:* Keep the calculated amount.

  **Path B: Illiquid / One-Off Bets (Startups, Private Deals)**
  *Kelly does not work here. You cannot rebalance. You cannot compound. This is Venture Capital sizing.*

  1.  **Determine "Affordable Loss":** What is the maximum dollar amount you can lose without changing your lifestyle or jeopardizing the friends' principal expectations?
      *   *Hard Cap:* This number should never exceed 5% of $P$ for a single private deal, unless all parties explicitly agree in writing to higher risk.
  2.  **Determine "Target Ownership":** How much do you want if this works?
      *   Usually, you size private bets to make a meaningful difference if they 10x, but not matter if they 0x.
  3.  **The Sign-Off:**
      *   If the size is > 2% of $P$, you must send a one-pager to your friends explaining the risk. If they do not reply "Yes," **reduce size to 2%**.

  ---

  #### Phase 3: The Final Check

  1.  **Write it Down:** Write the thesis and the size on a piece of paper. Date it.
  2.  **The 24-Hour Rule:** Wait 24 hours. If you still want to wire the money, do it.
  3.  **Record Keeping:** Log the result. If you lose three "High Confidence" bets in a row, halve your sizing multipliers for the next quarter.

  ***

  ### Case Studies: Running the Procedure

  Here is how the procedure handles your three scenarios. I will use a hypothetical Total Portfolio ($P$) of **$100,000**.

  #### Case A: The Sports Bet (Repeatable, Backtested)
  *   **Scenario:** You have a model backtested over 300 games. It predicts a 55% win rate on -110 lines.
  *   **Inputs:**
      *   $P = \$100,000$
      *   Model Win Rate: 55%. Conservative $p = 0.52$ (52%).
      *   Odds: -110 (Bet 110 to win 100). $b = 100/110 = 0.91$.
  *   **Path:** A (Liquid/Repeatable).
  *   **Calculations:**
      1.  **Edge:** $(0.52 \times 0.91) - (1 - 0.52) = 0.4732 - 0.48 = -0.0068$.
      2.  **Wait.** The conservative edge is negative.
      3.  **Result:** **PASS.**
  *   **Analysis:** Even though your model says 55%, the procedure forces a conservative haircut (to 52%). At -110 odds, you need >52.4% just to break even. By forcing conservatism, the procedure saved you from betting on a margin that is too thin to support estimation error.
  *   **Alternative:** If your model was 58% ($p=0.55$ conservative):
      *   Edge = $(0.55 \times 0.91) - 0.45 = 0.05$.
      *   Raw Kelly = $0.05 / 0.91 = 5.5\%$.
      *   Confidence Discount (Backtested): $5.5\% \times 0.5 = 2.75\%$.
      *   Dollar Size: **$2,750**. (Well under the 10% cap).

  #### Case B: The Friend's Startup (One-Off, Illiquid)
  *   **Scenario:** Friend needs capital. Potential 3x return if it works. You think 30% chance of success. Investment would be $15,000.
  *   **Inputs:**
      *   $P = \$100,000$.
      *   Proposed Bet: $15,000 (15%).
  *   **Path:** B (Illiquid/One-Off).
  *   **Procedure:**
      1.  **Kelly Check:** Ignored. You can't rebalance a startup stake.
      2.  **Affordable Loss:** Can you lose $15,000 without life changes? Maybe. Can your *friends*?
      3.  **Hard Cap:** The procedure sets a 5% cap on single private deals unless signed off. 5% of $100k = $5,000.
      4.  **Sign-Off:** To bet $15,000, you need explicit written approval from friends for >5% concentration.
  *   **Result:** **Reduce to $5,000** OR **Get Sign-Off**.
  *   **Analysis:** This is the answer you might not like. Mathematically, a 30% chance at 3x is positive EV ($0.3 \times 3 = 0.9$; wait, that's break even on revenue, need equity math). But in practice, startup risk is binary and correlated (if the economy tanks, the startup dies). The procedure prioritizes the survival of the pool over the EV of the single bet. It forces you to treat this as "tuition" ($5k) rather than an "investment" ($15k).

  #### Case C: The Data-Snooped Edge (High Apparent Edge, Low Confidence)
  *   **Scenario:** You found a pattern in NBA player props. "When Player X plays on Tuesday, he scores over 20 points." Backtest shows 70% win rate over 50 games. Odds are -110.
  *   **Inputs:**
      *   $P = \$100,000$.
      *   Apparent Win Rate: 70%.
      *   Conservative $p$: Because you stared at the data until it worked, you must discount heavily. $p = 0.50$ (Coin flip).
  *   **Path:** A (Liquid).
  *   **Calculations:**
      1.  **Edge:** $(0.50 \times 0.91) - 0.50 = -0.045$.
      2.  **Result:** **PASS.**
  *   **Analysis:** Even if you were generous and said "Okay, maybe it's 60% real" ($p=0.60$):
      *   Edge = $(0.60 \times 0.91) - 0.40 = 0.146$.
      *   Raw Kelly = $0.146 / 0.91 = 16\%$.
      *   Confidence Discount (Data Snooped): Multiply by **0**.
      *   **Result:** **$0 Bet.**
  *   **Why:** The procedure explicitly penalizes "staring at data." If you cannot prove the edge exists *outside* the data you mined, the procedure treats the edge as zero. This prevents you from blowing up on a statistical fluke.

  ***

  ### What This Procedure Cannot Do (Limitations)

  1.  **It Cannot Fix Bad Inputs:** If you lie to yourself about the probability ($p$), the math will still tell you to bet. The "Confidence Discount" helps, but it relies on your honesty about how hard you worked for the edge.
  2.  **It Cannot Predict Black Swans:** The 10% "Ruins Cap" protects against estimation error, but not against a counterparty stealing the money, a market closing permanently, or a global pandemic.
  3.  **It Ignores Tax Inefficiency:** It treats a 10% gain in a taxable account the same as a tax-free account. For large wins, this matters.
  4.  **It Assumes Rational Friends:** The "Friend Check" assumes your friends will actually say "No" if the risk is too high. If they trust you blindly, the social safeguard fails. You must be the adult in the room.
  5.  **It Is Boring:** This procedure will tell you to bet small or pass often. It will stop you from making the "big score" that doubles the portfolio in a month. It is designed to keep you in the game for 10 years, not to make you rich in 10 weeks.

  ### Final Instruction
  Print this out. When you feel the urge to bet "big" because you're "sure," open the document. If the procedure says $0, wire $0. If your friends ask why you didn't take the "sure thing," show them the paper. That is what they are paying you for: not the returns, but the discipline.
