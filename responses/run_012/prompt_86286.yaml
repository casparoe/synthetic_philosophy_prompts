answer: |-
  There is no established concept naming this specific dialectical flip. While related to anthropic reasoning (SSA/SIA) and simulation ethics, the literature treats the "simulation objection" and "simulation multiplication" as separate moves rather than a unified paradox. I propose the term **Anthropic Axiological Reversal**.

  Defined: The instability wherein the same anthropic premise (e.g., "we are likely simulated") is deployed to either nullify moral stakes (via causal isolation from base reality) or inflate them (via observer density within simulations).

  Your diagnosis is correct: the verdict flips based on whether value is aggregated *per world* (base reality only) or *per observer* (all substrates). If value requires causal leverage over the base future, simulations deflate stakes. If value resides in conscious experience regardless of substrate, simulations inflate stakes because simulated observers likely outnumber base observers.

  This differs from the **Doomsday Argument** in category: Doomsday is an epistemic claim about species longevity derived from birth rank, whereas Anthropic Axiological Reversal is an axiological claim about moral weight derived from ontological status. Doomsday asks "How long?" This asks "How much?"

  It differs from **Probability Discounting** because discounting reduces expected value by lowering the probability of success. Reversal does not necessarily change the probability of our actions succeeding *within our context*; rather, it relocates the *locus of value*. Discounting says "You probably won't reach the future." Reversal says "Either the future doesn't matter (base reality only) or it matters more (simulated density)."

  The concept's edge is marked by **substrate independence**. If consciousness requires base physics, the reversal collapses into simple discounting. If consciousness is substrate-independent, the reversal holds. It falls short of a formal paradox because it relies on equivocation about what constitutes a "moral patient." Until ethicists agree whether substrate independence holds, the reversal remains a rhetorical toggle rather than a logical contradiction.
