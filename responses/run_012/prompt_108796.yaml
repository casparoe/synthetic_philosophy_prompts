answer: |-
  This is one of the most common and productive sticking points students hit when reading *Naming and Necessity*. Your intuition that "Nixon exists in all possible worlds" is insane is correct, and your suspicion that historians haven't discovered necessary truths is also correct.

  Your friend is right that you are conflating two things, but since they wouldn't elaborate, let's untangle it. The confusion lies in the precise definition of **rigidity** versus **necessary existence**.

  ### 1. The Core Mistake: Rigidity $\neq$ Necessary Existence

  You wrote: *"If 'Nixon' refers to Nixon in every possible world, then there can't be any possible world where Nixon doesn't exist, because then the name would have nothing to latch onto."*

  This is the pivot point. You are interpreting "rigid designator" to mean:
  > **Incorrect:** In every possible world $W$, the name 'Nixon' successfully refers to an object $x$ existing in $W$.

  If that were the definition, you would be right: Nixon would have to exist in every world for the name to latch onto him there.

  But Kripke's actual definition is slightly different. A rigid designator picks out the same object in every possible world **in which that object exists**.
  > **Correct:** In every possible world $W$ where Nixon exists, the name 'Nixon' refers to him (and not to whoever happens to be President, or whoever fits some description).

  Kripke is not saying Nixon exists in all worlds. He is saying that **if** we are considering a world where Nixon exists, we identify him directly, not via a description. And if we are considering a world where Nixon *does not* exist (e.g., a world where his parents never met), the name 'Nixon' simply fails to refer in that world, or we are speaking from the actual world *about* that non-existent possibility.

  Think of it like a name tag.
  *   **Descriptivist view:** The name tag says "The guy who won the 1968 election." In a different world, a different guy wins, so the tag goes on a different guy.
  *   **Kripkean view:** The name tag says "Nixon" and is glued to Richard Nixon's chest.
      *   In a world where he becomes a carpenter, the tag is still on him.
      *   In a world where he was never born, **there is no chest for the tag to be on.** The tag doesn't float around magically; it just doesn't apply.

  So, rigidity guarantees **transworld identity** (if he exists elsewhere, it's *him*), not **transworld existence** (that he must exist elsewhere).

  ### 2. The "Necessary A Posteriori" Worry

  You asked: *"If Nixon's existence is a necessary truth... then it looks like historians have discovered a necessary truth a posteriori."*

  Since the premise ("Nixon's existence is a necessary truth") is false, the worry dissolves. Historians discovered a **contingent a posteriori** truth: that Nixon exists.

  However, Kripke *does* argue for the **necessary a posteriori**, just not for bare existence. You might be mixing up two different kinds of statements:

  1.  **"Nixon exists."**
      *   **Status:** Contingent A Posteriori.
      *   **Why:** We learned it empirically, and he might not have existed.
  2.  **"Nixon is the person who actually exists as Nixon."** (Or identity statements like "Hesperus is Phosphorus").
      *   **Status:** Necessary A Posteriori.
      *   **Why:** Once we fix the reference of 'Nixon' to *this* man, it is necessarily true that *this* man is *this* man. We needed empirical evidence to fix the reference (a posteriori), but once fixed, the identity holds in all worlds where he exists (necessary).

  There is also a specific Kripkean claim about **origin**. Kripke argues that while Nixon's existence is contingent, *given that he exists*, he necessarily came from the specific sperm and egg he actually came from.
  *   "Nixon came from sperm S and egg E" is a **necessary truth** (metaphysically).
  *   But we only know this via **empirical biology** (a posteriori).

  So, the "necessary a posteriori" is real, but it applies to *identity* and *origin*, not to the bare fact of existence. Your "insane" feeling was a reliable philosophical compass here.

  ### 3. Is the Rigid Designator Idea Trivial?

  Once you fix the definition, does the concept do any work? Or is it just a semantic technicality?

  It is doing **heavy lifting**. Here is why it isn't trivial:

  **A. It Solves the Modal Problem**
  Before Kripke, the dominant view (Frege/Russell) was that names were disguised descriptions. If 'Nixon' meant 'The 37th President', then the sentence "Nixon might not have been President" would mean "The 37th President might not have been President," which is a contradiction (like saying "The President might not have been the President").
  *   Because names are rigid, "Nixon" picks out the *man*, not the *office*. This allows us to make sense of counterfactuals: We can talk about *that very man* doing different things. Without rigidity, modal logic (logic about possibility and necessity) collapses into confusion.

  **B. It Distinguishes Fixing Reference from Giving Meaning**
  Kripke uses rigidity to show that we can use a description to *find* the person (fix the reference) without the description being the *meaning* of the name.
  *   We might fix the reference of 'Nixon' by saying "the guy who gave the Checkers speech."
  *   But 'Nixon' doesn't *mean* "the guy who gave the Checkers speech."
  *   This explains how we can discover "Nixon gave the Checkers speech" is contingent (he might not have), whereas if it were the meaning, it would be analytic/true by definition.

  **C. It Grounds Essentialism**
  This is the big metaphysical payoff. If names are rigid, we can ask: "What properties does Nixon have in *every* world where he exists?"
  *   Being President? No (he could have lost).
  *   Being human? Probably yes.
  *   Coming from his specific parents? Kripke argues yes.
  Rigidity allows us to separate **essential properties** (what makes him *him*) from **accidental properties** (what just happens to be true of him). Without rigid designators, we can't really formulate the question of essence coherently.

  ### Summary

  1.  **Your Mistake:** You equated "refers to the same object" with "the object exists everywhere." Rigidity means "if he exists there, it's him," not "he must exist there."
  2.  **The Consequence:** "Nixon exists" is contingent, not necessary. Historians found contingent truths. The "necessary a posteriori" applies to identity and origin, not bare existence.
  3.  **The Value:** Rigidity isn't trivial; it saves modal logic from contradiction, separates reference from meaning, and allows for a coherent theory of metaphysical essence.

  Your prof likely tried to say something like, "We evaluate the name from the actual world," which can sound like word salad. Your friend was right to point out a conflation, but you deserved the explanation: you conflated the **stability of the label** with the **necessity of the labeled**.
