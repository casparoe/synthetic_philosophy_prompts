answer: |-
  ### Scratch Brainstorm: Fault Lines & Philosophical Terrain

  Before drafting the statement, I need to map where the blood is actually being spilled. It's not just "Behaviorism vs. Cognitivism"; it's about *where selection happens*.

  1.  **The Continuity vs. Phase-Shift Fight:** Member A sees a single algorithm (Variation + Selection) applied at different time-scales. Member B sees qualitative changes in the *mechanism* of variation. For A, a "hypothesis" is just a covert response. For B, a "hypothesis" is a structural decoupling of the selector from the environment.
  2.  **The Homunculus Worry:** A hears "the brain tests a hypothesis" and hears "a little person inside watching the test." B knows Dennett's "Competence without Comprehension," but struggles to explain *how* the brain selects without a selector without sounding like A.
  3.  **Representation:** This is the big one. A treats "representation" as a *façon de parler* (useful fiction). B treats it as a physical vehicle with causal power. If we don't pin this down, the Popperian rung is dead on arrival for A.
  4.  **The Gregorian Trap:** If tools are just stimuli, A wins. If tools are *constituents* of the cognitive process (extended mind), B wins. The crux is whether removing the tool degrades *competence* or just *performance*.
  5.  **Question-Begging:** The Popperian rung *does* beg the question if defined as "imagining." It must be defined functionally: "generation of behavioral variants that are filtered prior to motor output."

  Okay, I have the map. Now to draft the treaty.

  ***

  # Joint Statement on Dennett's Taxonomy of Minds
  **Prepared for the Reading Group by Member A and Member B**

  We, the undersigned, acknowledge that our recent debates regarding Daniel Dennett's four-rung taxonomy (Darwinian, Skinnerian, Popperian, Gregorian) have stalled due to a mixture of empirical disagreements, definitional mismatches, and unexamined assumptions about the nature of explanation. We agree that Dennett's framework is a useful heuristic for organizing phenomena, but we disagree on its ontological commitments. The following document outlines our common ground, isolates our specific divergences, and identifies the evidence required to move forward.

  ### I. Agreed Claims
  *We both accept the following premises as the basis for further inquiry:*

  1.  **Selectionism is Fundamental:** All four rungs rely on a variation-and-selection process. There is no magic; no design without a selector. We agree that "mind" is not a substance but a set of competences produced by evolutionary history.
  2.  **No Homunculus:** We agree that explaining behavior by positing a "little man in the head" who perceives, decides, or understands is an explanatory failure. Any appeal to "inner processes" must be cashed out in terms of physical mechanisms (neural, computational, or behavioral) that do not themselves require an inner observer.
  3.  **Levels of Description:** We agree that the four rungs describe different *loci of selection*:
      *   **Darwinian:** Selection occurs across generations (genotype).
      *   **Skinnerian:** Selection occurs within a lifetime via environmental consequences (phenotype/behavior).
      *   **Popperian:** Selection occurs within a lifetime via internal pre-screening (neural/covert).
      *   **Gregorian:** Selection is aided/modified by culturally transmitted tools (environmental scaffolding).
  4.  **Morgan's Canon Applies:** We agree that we should not posit a higher rung if a lower rung suffices to explain the data. The burden of proof lies on the claimant of the higher rung to demonstrate that the lower rung *cannot* account for the phenomenon.
  5.  **Evidence Limits:** We acknowledge that current neuroscientific and behavioral data is often compatible with multiple interpretations. "Covert behavior" (A) and "Off-line simulation" (B) often look identical from the outside. We agree that resolving this requires looking at *learning curves, transfer effects, and neural pre-activation patterns*, not just introspection or success rates.

  ### II. Disagreements Table
  *We disagree on the following specific points. Note the difference in wording: Side A uses behaviorist/functionalist terminology; Side B uses cognitivist/representational terminology.*

  | Disagreement | Member A (Associationist) Formulation | Member B (Popperian) Formulation | Kind of Disagreement |
  | :--- | :--- | :--- | :--- |
  | **The Popperian Threshold** | "Covert Operant Conditioning": Inner events are simply unobserved motor preparations subject to the same reinforcement laws as overt behavior. | "Off-line Variant Generation": The system generates behavioral variants that are selected by internal models *before* motor commitment, decoupling selection from immediate environmental feedback. | **Empirical/Mechanistic** (Is the selection mechanism structurally distinct or just hidden?) |
  | **Ontology of Representation** | "Theoretical Fiction": Talk of 'representations' is a useful shorthand for dispositional states (stimulus-response probabilities). | "Causal Vehicle": Internal states physically carry information about the world and are manipulated by the system to guide action. | **Ontological** (Do representations exist as physical things or just descriptive tools?) |
  | **Gregorian Scaffolding** | "Complex Stimulus Control": Tools are external stimuli that evoke learned responses; the mind remains 'in the head'. | "Cognitive Extension": Tools become constituent parts of the cognitive loop; the mind is partially constituted by the environment. | **Explanatory Goal** (Where do we draw the boundary of the 'system'?) |
  | **Nature of 'Learning'** | "Change in Probability": Learning is strictly a change in the probability of a response given a history of reinforcement. | "Acquisition of Competence": Learning involves acquiring new models of the world that allow for novel generalization without new reinforcement. | **Definitional** (What counts as the phenomenon to be explained?) |

  ### III. Crux List
  *These are the specific sub-questions where settling the evidence would force at least one of us to revise our position. We agree on the evidence type and have stated our conflicting predictions.*

  | Crux Question | Evidence Both Accept as Relevant | Member A Prediction (Behaviorist) | Member B Prediction (Popperian) |
  | :--- | :--- | :--- | :--- |
  | **1. Novel Sequence Generation**<br>Can a subject solve a problem requiring a *new* sequence of actions without prior reinforcement for that specific sequence or its components? | Experiments where subjects face a novel puzzle after training on component skills, with no reinforcement for the *combination*. | **Shaping History:** Success will correlate with the overlap between the new solution and previously reinforced micro-behaviors. No true novelty. | **Recombination:** Subjects will solve the problem suddenly (insight) by recombining internal models, exceeding what shaping history predicts. |
  | **2. Cost of Error**<br>Does the system treat an "imagined" error differently than a "real" error in terms of neural adjustment? | Neural imaging (fMRI/EEG) comparing brain activity during actual errors vs. observed errors/simulated failures. | **Identity:** The neural signature will be identical (or the "simulated" one is just a weaker version of the real one). Selection is the same process. | **Distinct Signatures:** There will be distinct neural markers for "off-line" selection (e.g., prefrontal gating) that inhibit motor output, distinct from "on-line" extinction. |
  | **3. Tool Removal**<br>If a Gregorian tool (e.g., notation, map) is removed, does competence degrade or vanish? | Testing subjects on tasks they mastered with tools, immediately after removing the tools. | **Performance Drop:** Competence remains intact; performance drops only because the stimulus control is altered. The knowledge is internal. | **Competence Loss:** The cognitive system itself is degraded. The subject literally cannot perform the computation without the scaffold. |

  ### IV. Verbal Disputes & Question-Begging

  **1. The Verbal Dispute: "Hypothesis"**
  *   **The Conflict:** When Member B says "the brain tests a hypothesis," Member A hears "the brain consciously thinks a sentence."
  *   **The Dissolution:** We agree to replace "hypothesis" with **"pre-selected behavioral variant."**
      *   *Neutral Restatement:* "The system generates multiple potential motor commands and selects one for execution based on internal criteria rather than immediate environmental consequences."
      *   If Member A accepts this functional definition, the "little man" accusation loses its force. If Member B accepts that this need not involve consciousness, the "homunculus" worry is addressed.

  **2. The Question-Begging Rung: Popperian**
  *   **The Issue:** The Popperian rung *cannot* be drawn without begging the question against Member A **IF** it is defined intentionally (i.e., "the creature *knows* what it is doing").
  *   **The Fix:** It must be defined structurally. The rung is valid only if we can identify a physical mechanism that filters variants *before* they interact with the external environment. If the filtering mechanism turns out to be just "very fast covert reinforcement," then the Popperian rung collapses into the Skinnerian rung.
  *   **Status:** We agree that the Popperian rung is currently a **working hypothesis**, not an established fact. It stands only if Crux #2 (Neural Signatures) shows a distinct mechanism for off-line selection.

