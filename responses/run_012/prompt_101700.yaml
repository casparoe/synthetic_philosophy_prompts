      *   *Decision:* I will propose **Two Principles** rather than one forced one. One for the *Mechanism* (Escalation), one for the *Morality* (Consent/Agency). Trying to force one principle will require sacrificing the distinction between the War and the Newspapers, which the user clearly feels strongly about.

  7.  **Finalizing the Output Structure:**
