answer: |-
  You've spotted the fracture lines correctly. You are trying to force a single principle to cover **mechanism** (how the trap works), **rationality** (why people stay in it), and **morality** (who is to blame). You can't have one clean principle without sacrificing one of your verdicts.

  Here is the straight answer: You need **two** principles to make sense of your intuitions. If you demand one, you have to stop blaming the Government more than the Newspapers.

  Here is the breakdown.

  ### Principle 1: The Mechanism (The Trap)
  **"Local Rationality creates Global Irrationality."**
  This covers the *structure*. In every case you listed (except maybe the researcher, see below), the actor makes a rational decision *at that specific moment* which leads to a disastrous outcome *overall*.
  *   **The Party Bidder:** Bidding £1.10 to win £1.00 is stupid globally, but locally it saves the £1.00 already bid.
  *   **The Newspapers:** Cutting prices is rational locally (keep market share), disastrous globally (no profit).
  *   **The War:** Sending more troops is rational locally (don't waste the dead), disastrous globally (lose a generation).

  **Where this principle forces a sacrifice:**
  If you accept this as the only principle, the **Newspapers** and the **Government** are doing the exact same thing. They are both engaged in a *War of Attrition*.
  *   **Your Verdict:** You blame the Government, but not the Newspapers.
  *   **The Sacrifice:** To keep a single principle, you must admit either:
      1.  The Newspaper editors are just as silly/blameworthy as the Government (because they are destroying value for no gain).
      2.  The Government is not silly (because strategically, backing down might lose the regime, making the war rational for *survival*).

  You can't have it both ways. Structurally, they are identical. The difference is not the game; it's the currency.

  ### Principle 2: The Morality (The Blame)
  **"Blame attaches to Non-Consenting Costs."**
  This covers your *judgement*. You don't blame people for hurting themselves (mostly); you blame them for hurting others who didn't agree to the gamble.
  *   **Party Bidder:** Hurts own wallet. (Verdict: Silly, not blameworthy).
  *   **Job/Qual:** Hurts own happiness. (Verdict: Understandable, not blameworthy).
  *   **Lone Project:** Hurts own resources. (Verdict: Their funeral).
  *   **The Auctioneer:** Profits from others' loss. (Verdict: Blameworthy).
  *   **The Government:** Spends *soldiers'* lives, not just their own. The soldiers didn't bid in the auction. (Verdict: Blameworthy).
  *   **The Knower:** Walks in voluntarily. (Verdict: Blameworthy for the disruption, even if self-harming).

  **Where this principle clarifies the "Rival" question:**
  You asked: *"Which makes me wonder whether the rival is doing all the work."*
  **Yes.** The rival is what converts a **Sunk Cost Fallacy** (Solo) into a **Dollar Auction** (Competitive).
  *   **Solo (Job, Lone Project):** You can walk away. The only thing stopping you is your own psychology.
  *   **Competitive (War, Newspapers, Party):** You cannot walk away without handing a victory to the opponent. The rival *enforces* the penalty.

  ### The Outlier: The Researcher
  The researcher is the odd one out. Patching a theory isn't necessarily a Dollar Auction; it's **Bayesian Updating**.
  *   **The Limit:** It becomes a Dollar Auction only when they stop looking for truth and start bidding to defend their reputation against a rival theory.
  *   **Your Intuition:** You said "up to a point." That point is when the patches stop predicting new things and only explain old errors. That is the moment it shifts from Science to Sunk Cost.

  ### The Test Case: The Tariff War
  **Scenario:** Two big economies slap tariffs on each other. Farmers in a third country (not at the table) get crushed.
  **Prediction based on the two principles:**
  1.  **Mechanism:** This is a classic War of Attrition (Competitive Escalation). Both economies are making locally rational moves (protect domestic industry) that lead to global inefficiency.
  2.  **Morality:** This maps to the **Government/War** case, not the Newspaper case.
      *   **Verdict:** The governments are **blameworthy**.
      *   **Why:** Like the soldiers, the farmers are non-consenting third parties paying the cost of the escalation. They cannot "fold" because they aren't players in the auction; they are the currency being spent.

  ### Summary: Which Verdict Must You Give Up?
  You want a clean principle. To get one, you have to merge your verdicts on the **Newspapers** and the **Government**.

  *   **Option A (The Hardline Rationalist):** Admit the Newspaper editors are **blameworthy**. They are burning capital to save face, just like the generals. They are imposing costs on their staff and shareholders who didn't agree to a bloodbath.
  *   **Option B (The Realist):** Admit the Government is **not silly**. If losing the war means the regime falls, staying in is the only rational move, just as a newspaper must kill a rival to survive. The "silliness" is only from the perspective of the soldiers/citizens, not the leaders.

  **My advice:** Keep the split. It's more honest.
  1.  **Mechanism:** It's all Escalation of Commitment (Rational steps, bad policy).
  2.  **Judgement:** "Silly" is for self-harm (Bidders, Jobs). "Blameworthy" is for other-harm (Governments, Auctioneers).

  The reason your reactions hang together is not because there is one principle, but because you are intuitively tracking **who pays the bill**. When the bidder pays, it's a tragedy. When the soldier pays, it's a crime. The auction structure is the same; the morality depends on whose pocket is being picked.
