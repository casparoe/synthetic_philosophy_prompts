      *   Key dynamic: Local rationality (bidding £1.10 to save £1.00) leads to global irrationality (paying £5 for a £1 note).
      *   Key distinction: Is there a *strategic opponent* trying to force you to pay, or is it just *internal commitment*?

  3.  **Evaluate the User's Cases against Potential Principles:**

      *   *Principle A: Sunk Cost Fallacy.* (Ignore past costs, look only at future utility).
          *   Fits: Party bidder, Job seeker, Lone project.
