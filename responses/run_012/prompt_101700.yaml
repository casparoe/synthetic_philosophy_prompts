  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, is the Researcher case really the same?* No. Patching a theory is scientific progress *until* it becomes ad hoc. That's the Lakatos line. It's not a dollar auction unless there's a rival theory forcing them to defend it at all costs. I need to point out this case is actually different structurally.
      *   *The Job Case:* User says "I don't feel bad about it." This suggests hindsight bias or narrative building. It's still a sunk cost fallacy, but a socially acceptable one.
      *   *The "Rival" Question:* User asks "Which makes me wonder whether the rival is doing all the work." Yes. The rival converts a Sunk Cost error into a Trap. Without a rival, you can walk away. With a rival, walking away confirms their victory.
