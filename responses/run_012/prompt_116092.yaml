      *   **Core Conflict/Insight:** Honest uncertainty looks risky to the countersigner. Confident brevity sails through. Countersigner wants to refuse everything to survive, but pressure forces approval. Result: Safety apparatus works as designed but produces awful outcomes (punishes honesty, rewards confident blandness).
