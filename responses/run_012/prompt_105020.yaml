      *   *Tone:* Professional, instructional, direct.
      *   *Structure:* Overview, Materials/Roles, Timeline (Step-by-Step), Debrief Guide, Honest Assessment.

      *(Self-Correction during drafting Round 2)*: The prompt says "I'll sell you a ticket at twice your bid, or I'll buy your ticket at your bid."
      If Bid = $10.
      Offer 1: Buy ticket from House for $20. (If EV = Infinity, this is a steal).
      Offer 2: Sell ticket to House for $10. (If you have it, why sell for finite if EV = Infinity?)
      Wait, in Round 1 they haven't bought yet. They just wrote WTP.
      So Round 2: Instructor says "Okay, I have tickets. Who wants to buy at 2x their bid?"
      This forces the commitment.
      Actually, the prompt says: "I'll sell you a ticket at twice your bid, or I'll buy your ticket at your bid."
      Since they don't *have* a ticket yet, the "buy your ticket" option is hypothetical ("If you had one, would you sell?").
      Better framing: "Based on your bid, I am offering to transact. If you bid $X, I will sell you a ticket for $2X. Raise your hand if you buy."
      This highlights the contradiction: They bid $X (implying worth $\ge X$), but refuse $2X$ (implying worth $< 2X$), yet EV says worth $\infty$.

      *(Refining Round 3 Math)*:
      Cap $W = 1024$.
      Max payout is 1024.
      This happens at $k=10$ ($2^{10} = 1024$).
      If $k=11$, payout is capped at 1024.
