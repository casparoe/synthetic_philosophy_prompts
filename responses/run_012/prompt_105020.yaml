answer: |-
  # Seminar Plan: The St. Petersburg Casino
  **Duration:** 80 Minutes
  **Students:** 18 (15 Punters, 1 Banker, 2 Auditors)
  **Goal:** Experiential collision between Infinite Expected Value (EV) and finite valuation; realization that "solutions" dissolve the game rather than solve it.

  ## 1. Materials & Setup
  *   **Tokens:** 200 physical chips (poker chips or printed cards).
  *   **Stakes:** A tangible reward pool (e.g., $50 cash, gift cards, or significant course credit) awarded to the top 3 token holders at the end. *Crucial: Without real stakes, risk aversion won't trigger.*
  *   **Bid Slips:** 18 small pieces of paper.
  *   **Board:** Whiteboard/markers.
  *   **Tech:** 1 Laptop connected to projector (for Auditors), 1 Coin (or phone RNG).
  *   **Seating:** Punters in a semi-circle. Banker and Auditors at a "House Table" at the front.

  ## 2. Roles
  *   **The House (Instructor):** Runs the game, enforces rules, facilitates debrief.
  *   **The Banker (1 Student):** Holds the token reserve (1024 tokens). Physically hands out winnings. *Instruction: "You cannot pay more than you have. If the payout exceeds your stack, you pay everything and the game ends."*
  *   **The Auditors (2 Students):** Run a simulation on the laptop (simple Python script or Excel macro) projecting the **Running Average Payout** per game over 10,000 simulated trials.
  *   **The Punters (15 Students):** The decision-makers.

  ## 3. Timeline & Activity Flow

  ### 00:00 – 00:05 | Introduction & Stakes
  *   **Action:** Place the reward pool on the table. Distribute 10 tokens to each Punster as "seed money."
  *   **Script:** "This is a casino. Tokens equal entry into the prize draw at the end. Keep your tokens, keep your chance. Lose them, you're out. The House offers one game."
  *   **Rule:** Flip a fair coin until Heads.
      *   Heads on Flip 1: Win 2 tokens.
      *   Heads on Flip 2: Win 4 tokens.
      *   Heads on Flip $k$: Win $2^k$ tokens.
  *   **Constraint:** Do not mention Expected Value. Do not mention the Paradox.

  ### 00:05 – 00:15 | Round 1: The Willingness to Pay
  *   **Action:** Hand out bid slips.
  *   **Instruction:** "Write down the maximum number of *your own seed tokens* you would pay to play this game **once**. This is a binding offer. If I call your number, you pay, and we play."
  *   **Collection:** Collect slips. Read 5-6 bids aloud (anonymized). They will cluster between 2 and 10.
  *   **The Pinch:** Ask the room: "Did anyone write more than 20?" (Likely no one). "Did anyone write infinity?" (No).
  *   **Board:** Write the range of bids on the board (e.g., "Market Price: 2–10 tokens").

  ### 00:15 – 00:30 | Round 2: The EV Trap
  *   **Action:** Move to the whiteboard.
  *   **Board Work:** Calculate EV together.
      *   $P(1) \times 2 = 1/2 \times 2 = 1$
      *   $P(2) \times 4 = 1/4 \times 4 = 1$
      *   $P(3) \times 8 = 1/8 \times 8 = 1$
      *   ...
      *   Sum = $1 + 1 + 1 + \dots = \infty$.
  *   **The House Offer:** "The math says this ticket is worth infinite tokens. My market price (your bids) says it's worth 5. I am going to exploit this arbitrage."
  *   **The Choice:** Go around the room. "You bid $X$. I will sell you a ticket right now for $2X$. Do you buy?"
      *   *Logic:* If EV is infinite, $2X$ is still a bargain.
      *   *Reality:* Almost everyone refuses.
  *   **The Contradiction:** "You refuse to pay $2X$, implying the ticket is worth less than $2X$. But you just watched the sum diverge to infinity. You are acting as if the math is wrong, or the game is fake."

  ### 00:30 – 01:00 | Round 3: The Finite Bankroll (Core Segment)
  *   **Setup:** The Banker stands up with their stack. "The House has 1024 tokens. That is all the money in existence."
  *   **Question:** "With a cap of 1024 tokens, what is the ticket worth now?"
  *   **Derivation (Board Work):** Guide 2-3 students to solve this. Keep it moving.
      *   Max payout is 1024 ($2^{10}$).
      *   Terms 1 through 10 sum to 10 (as before).
      *   What about Flip 11+? The Banker is broke. You get the remaining 1024.
      *   Probability of reaching Flip 11+ is $1/2^{10} = 1/1024$.
      *   Value of that tail: $(1/1024) \times 1024 = 1$.
      *   **Total Fair Price:** $10 + 1 = 11$ tokens.
  *   **Simulation:** Auditors run 10,000 trials with the 1024 cap.
      *   *Visual:* Project the running average. It will converge near 11.
      *   *Observation:* Most individual games pay 2 or 4. The average is dragged up by rare 1024 payouts.
  *   **The Switch:** "Now, imagine the House is infinitely rich again. The cap is gone."
      *   Ask: "What changed in the game mechanics?" (Nothing).
      *   Ask: "What changed in the value?" (It went from 11 to Infinity).
      *   **Point:** The value didn't change because of the *coin*. It changed because of an *assumption about the world* (infinite wealth) that cannot exist.

  ### 01:00 – 01:20 | Debrief: The Fork
  *   **Goal:** Map the activity to decision theory positions.
  *   **Discussion Guide:**
      1.  **The Utility Move (Bernoulli):** "Some of you refused to pay because 1024 tokens isn't 1024 times better than 1 token."
          *   *Critique:* This admits EV is correct, but *Money* is the wrong metric. We solved the paradox by changing the payoff function ($U(x)$ instead of $x$). We aren't playing St. Petersburg anymore; we're playing 'St. Petersburg with Log Utility'.
      2.  **The Finite Bankroll Move:** "The Banker ran out of tokens."
          *   *Critique:* This admits the game is the right metric, but the *Game* is impossible. We solved the paradox by admitting no such casino exists.
      3.  **The Fork:** "You have two choices. Either Expected Value is the wrong rule for single-shot decisions (needs replacement), OR the St. Petersburg game is a physical impossibility (needs no solution)."
      4.  **Time Average (Brief Mention):** "If you played this forever, you'd go broke paying high prices. The ensemble average (EV) and time average (growth rate) diverge. That's a different seminar, but know the door is open."

  ---

  ## 4. Instructor Notes: Honest Assessment
  *Read this before running. These are the failure points.*

  ### 1. The "Token Sting" Problem
  *   **Risk:** Students treat tokens as points. They bid 50 tokens out of 10 because there's no consequence. The paradox feels silly, not sharp.
  *   **Fix:** You must enforce the stakes. "Top 3 token counts get the prize." If they gamble away their seed money in Round 2, they are eliminated from the prize. This triggers actual loss aversion.
  *   **What you can't reproduce:** Real financial ruin. Tokens are still abstract. You must verbally reinforce that "Tokens = Grade/Cash" constantly.

  ### 2. The "EV is Wrong" Short-Circuit
  *   **Risk:** A savvy student in Round 2 says, "EV only applies to repeated trials, not single shots," and refuses to engage. This deflates the tension.
  *   **Fix:** Do not let them off the hook. Reply: "Standard Decision Theory (von Neumann-Morgenstern) says you *should* maximize EV even in single shots if you accept the axioms. If you reject EV, you are rejecting the foundation we learned last week. For this hour, assume EV is the law. Why are you breaking it?"
  *   **What you can't reproduce:** The philosophical weight of axiomatic decision theory. You have to supply the authority that "EV is the rule we are testing."

  ### 3. Simulation Variance & Boredom
  *   **Risk:** The Auditors run the sim. 50% of games end on Flip 1 (Payout 2). 75% end on Flip 2 or less. The room sees mostly small numbers. They think the EV calculation is magic/lying.
  *   **Fix:** The Auditors must run *at least* 5,000 trials for the convergence to look smooth. Ensure the laptop is projected. Point out: "See how flat it is? Now look at the max payout. The average is hidden in the tail you never see."
  *   **What you can't reproduce:** The actual experience of the tail. No one in the room will likely see a $k=10$ flip live. You must narrate the rarity: "That 11th token of value comes from a 1-in-1000 event you will never witness."

  ### 4. The "Bait and Switch" Feeling
  *   **Risk:** In Round 3, revealing the cap feels like you changed the rules to make the math work. Students feel cheated.
  *   **Fix:** Frame Round 3 not as "The Real Game" but as "The Physical Game." Ask them *before* revealing the cap: "Can anyone in this room actually pay out $2^{20}$ tokens?" When they say no, reveal the Banker's stack. It validates their intuition that the infinite game is abstract.
  *   **What you can't reproduce:** The historical context of why mathematicians cared. You have to supply the narrative that "This mattered because people thought math described reality, not just abstractions."

  ## 5. Contingency: If Round 3 Math Drags
  If the derivation of the Log formula stalls:
  *   **Intervene:** "Let's brute force it. If the bank is 2 tokens, max flip is 1. EV = 2. If bank is 4 tokens, max flip is 2. EV = 3. Pattern? Bank $2^k$, EV is $k+1$."
  *   **Don't:** Let them struggle with infinite series notation. The insight is the *cap*, not the calculus.

  ## 6. Contingency: If Bids are High
  If students bid high (e.g., 50 tokens) trying to be "rational":
  *   **Intervene:** "Okay, you bid 50. House offers to sell you a second ticket for 100. Do you buy? If not, why was the first one worth 50?"
  *   **Goal:** Force the marginal decision. The paradox holds even if they bid 50, as long as they wouldn't bid 10,000.

  ---

  ## 6. Debrief Script (Key Moments)
  *Use these exact phrasings to pin the concepts.*

  *   **On Utility:** "When you said '1000 tokens isn't worth that much to me,' you were doing what Bernoulli did. You replaced *Money* with *Satisfaction*. You solved the paradox by saying the payoff isn't $2^k$, it's $\log(2^k)$. That works, but it means the paradox was never about the *game*, it was about *you*."
  *   **On Bankrolls:** "When the Banker said 'I'm out of chips,' you solved the paradox by saying the payoff isn't $2^k$, it's $\min(2^k, \text{Bank})$. That works, but it means the paradox was never about *math*, it was about *physics*."
  *   **The Fork:** "Walk out of here with this: Either Expected Value is not the King of Decisions, or the St. Petersburg Game is a dragon that doesn't exist. You cannot have a real dragon with infinite EV."
