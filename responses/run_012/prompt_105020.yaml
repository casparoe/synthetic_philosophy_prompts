  8.  **Self-Correction on "Tokens":**
      The prompt says "tokens framed as standing in for real money." I should suggest a concrete conversion rate to make it sting. E.g., "10 tokens = $1" or "Top 3 token holders get a prize." Let's suggest a small cash pot or gift cards to make the "pinch" real, otherwise, it's just numbers. *Decision:* I will advise the instructor to use a tangible reward pool to ensure risk aversion triggers.

