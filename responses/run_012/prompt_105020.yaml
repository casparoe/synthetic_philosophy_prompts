      First part: 10 terms of 1 = 10.
      Second part: Prob of $k \ge 11$ is $1/2^{10} = 1/1024$.
      So $(1/1024) \cdot 1024 = 1$.
      Total EV = 11.
      Okay, I will write this derivation into the Instructor Notes so they can guide the Auditors/Board work quickly.

      *(Final check on Debrief)*: Ensure the "Fork" is clear.
      1. Utility Theory: EV is right, but Money $\neq$ Utility. (Changes the payoff function).
      2. Finite Bankroll: EV is right, but Game is impossible. (Changes the probability/payoff structure).
      3. Conclusion: The "Paradox" only exists in a Platonic realm that doesn't apply to decisions.

