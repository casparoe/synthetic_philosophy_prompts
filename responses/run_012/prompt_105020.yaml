      *   **Round 3:** The Cap. $W = 1024$. Max payout $2^{10}$. Wait, prompt says $2^k$. If $k=1$, win 2. If $k=10$, win 1024. If cap is 1024, max $k$ is 10.
          *   Math check: EV with cap $C = 2^m$.
          *   Sum $k=1$ to $m$: $(1/2^k) * 2^k = m * 1 = m$.
          *   Plus the tail probability? If the game stops at $m$ regardless, the last term is $(1/2^m) * 2^m$.
          *   Actually, usually, the cap means if you hit the limit, you just get the limit.
          *   Prompt says: "fair price is log base 2 of W plus 1". If $W=1024=2^{10}$, $\log_2(1024) = 10$. Price = 11?
          *   Let's check the math.
          *   Standard St. Pete: Payoff $2^k$. Prob $1/2^k$. Term = 1.
          *   Cap at $W$. If $W = 2^m$.
          *   Terms $k=1$ to $m$: Each contributes 1. Sum = $m$.
          *   What about $k > m$? The bank is empty. Payoff is $W$.
          *   Prob of reaching $> m$ is $1/2^m$.
          *   So term is $(1/2^m) * W = (1/2^m) * 2^m = 1$.
          *   So total EV = $m + 1$.
          *   If $W=1024$, $m=10$. EV = 11.
