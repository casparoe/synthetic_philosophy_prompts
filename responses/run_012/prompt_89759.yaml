prompt: |-
  I'm in a grad seminar on historical explanation and there's a knot I can't untie, so I'm hoping you can just tell me where my head has gone wrong. The prof keeps describing big events — the French Revolution, the outbreak of the First World War, that kind of thing — as 'overdetermined,' meaning you can list off half a dozen causes (fiscal crisis, bad harvests, a weak king, new political ideas, whatever) and say that any one of them on its own might have been enough. Fine. But a friend of mine in the class is a chemist and takes everything literally, and after seminar he said: so it would have happened no matter what, which means none of those things actually caused it. His analogy was two hammers swinging down on a vase at the exact same instant, either one of which would have shattered it — you can't say the left hammer broke it or the right hammer broke it, so really nothing broke it, it just broke. Somebody else started calling this 'the two-hammer problem' and now I can't stop chewing on it.

  Here's what I can't get past. If the revolution would have happened even without the fiscal crisis, then in what sense is the fiscal crisis a cause of the revolution? I feel like 'overdetermined' is doing a bit of sleight of hand, or maybe it's just a polite way of saying we can't actually tell which of these things did it and we're dressing up our ignorance in a fancy word. And when I pushed the prof on it he just said overdetermination isn't a problem for explanation, it's the normal condition of history, which — okay, but why? That felt like a dodge.

  So my question is basically: is overdetermination an admission that these events are uncaused, or that historical explanation is impossible for them, and if it isn't, what exactly is stopping it from collapsing into that? Is the whole thing just riding on what we mean by 'cause'? Because if a cause has to be something that, take it away, the outcome wouldn't have happened, then an overdetermined event seems to have no causes at all, which definately can't be right, and yet I can't see the seam. I'd really like a straight answer about whether I'm confused, and if so about what.
