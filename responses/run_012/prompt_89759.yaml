          2.  The Chemist's Mistake: Confusing "necessary" with "causal."
          3.  The Philosophical Fix: INUS conditions (Mackie).
          4.  The Historian's Practice: Explaining the *actual* process, not just the *possibility*.
          5.  Why the Prof said what he said: Complexity vs. Physics.
          6.  Conclusion/Takeaway.

      *   *Refining the "Two Hammer" point:* I need to be careful. In philosophy, "overdetermination" (both hit simultaneously) is different from "preemption" (one hits slightly before). In history, it's almost always preemption or complex interaction, not literal simultaneous sufficiency. The fiscal crisis *did* happen. It *did* stress the system. The fact that *another* stressor *could* have done it doesn't erase the work *this* stressor did.
