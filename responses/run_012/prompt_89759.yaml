  6.  **Self-Correction during drafting:** I initially thought about bringing in David Lewis's counterfactual theory of causation, but that might get too technical and actually supports the chemist's view (Lewis struggled with overdetermination). Better to stick to Mackie's INUS or general mechanistic explanations which are more common in history. I should emphasize that history deals with *actual* sequences, not just *possible* worlds.

