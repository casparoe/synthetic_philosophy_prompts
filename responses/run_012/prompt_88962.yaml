answer: |-
  You should not draw that conclusion. While your diagnosis of the *costs* of supervaluationism is astute (the loss of bivalence and the complications regarding validity), your characterization of the *disagreement* between the two views contains a fundamental category error. If you build your chapter on the premise that they are notational variants, you will likely misrepresent the central metaphysical commitment of supervaluationism.

  Here is why they are not variants, where the reading goes wrong, and how to separate the positions without needing to locate the boundary.

  ### 1. The Crucial Mischaracterization
  You write: *"Both take a vague predicate to have a unique correct extension."*

  This is the linchpin of your argument, and it is false regarding supervaluationism.
  *   **Epistemicism** asserts that there is a unique, precise extension for every vague predicate (e.g., there is a specific nanometer that divides "tall" from "not tall"). The vagueness is entirely in our ignorance of this fact.
  *   **Supervaluationism** asserts that there is **no** unique correct extension. There is a *set* of admissible precisifications (extensions), and none of them is semantically privileged as "the" extension. The vagueness is in the world/language relation (semantic indecision), not just in our knowledge.

  Consequently, your claim that *"both make every sentence either true or false once the semantics is set up"* is also incorrect.
  *   For the **Epistemicist**, once the semantics is set up (which mirrors classical logic), every sentence has a classical truth value.
  *   For the **Supervaluationist**, once the semantics is set up, borderline sentences lack a truth value (they are neither super-true nor super-false). They are true on *some* precisifications and false on *others*.

  Therefore, they are not notational variants. They offer competing ontologies of vagueness. One says the boundary exists (Epistemicism); the other says the boundary does not exist (Supervaluationism).

  ### 2. The Real Dialectic: Logic vs. Intuition
  The choice between the two is not about which one is "cleaner" in terms of notation; it is about which theoretical cost you are more willing to bear.

  *   **Epistemicism** saves classical logic (bivalence, excluded middle, standard inference rules) but violates strong semantic intuitions. It requires you to accept that there is a fact of the matter about whether a specific hair makes a man bald, even though no human practice could possibly settle it. (Williamson defends this via the "margin for error" principle in epistemology, but many find the metaphysical commitment implausible).
  *   **Supervaluationism** saves semantic intuitions (there is no sharp cutoff) but violates classical logic. It retains the Law of Excluded Middle ($P \vee \neg P$ is super-true) but rejects Bivalence (neither $P$ nor $\neg P$ is super-true). It also creates complications for validity (e.g., failure of Conditional Proof or the rule of Necessitation for the "Definitely" operator).

  Your conclusion ("I should simply be an epistemicist") is a valid philosophical stance, but it must be motivated by a preference for classical logic over semantic intuition, not by the idea that the views are equivalent.

  ### 3. How to Separate the Positions (Without Finding the Boundary)
  You asked: *"What would a case have to look like in order to separate the two positions, given that I cannot imagine one that does not turn on discovering where the boundary lies?"*

  You do not need to discover the boundary to distinguish the views. You only need to examine the **structure** of the vagueness. Here are three ways to drive a wedge between them:

  #### A. Higher-Order Vagueness
  This is the strongest separator.
  *   **Epistemicism:** If there is a sharp boundary between "tall" and "not tall," there must also be a sharp boundary between "definitely tall" and "borderline tall." Epistemicism is committed to sharp boundaries at every order of vagueness. There is a specific hair that marks the transition from "borderline bald" to "definitely bald."
  *   **Supervaluationism:** Can model higher-order vagueness naturally. The set of admissible precisifications itself need not be sharply defined. We can have vagueness about which precisifications are admissible. This allows the supervaluationist to say there is no sharp line between the clear cases and the borderline cases, whereas the epistemicist is forced to posit one.

  #### B. The Logic of "Definitely" ($D$)
  Let $Dp$ mean "It is definitely the case that $p$."
  *   **Epistemicism:** $Dp$ is generally analyzed as " $p$ is true and knowable." Since $p$ is always either true or false, the logic of $D$ follows the logic of knowledge (typically S4 or S5). Crucially, $Dp \vee D\neg p \vee \neg(Dp \vee D\neg p)$ holds.
  *   **Supervaluationism:** $Dp$ is true iff $p$ is true on *all* admissible precisifications.
      *   **The Wedge:** Consider the sentence: "Either it is definitely tall or it is definitely not tall."
      *   For the **Epistemicist**, this sentence is false for borderline cases (because it is neither definitely one nor the other), but there is a *fact* about which case obtains.
      *   For the **Supervaluationist**, the failure of $Dp \vee D\neg p$ is structural. More importantly, supervaluationism often entails the failure of the inference from $p$ to $Dp$ (if $p$ is super-true, is it definitely super-true?). If the set of precisifications is vague, $p$ might be super-true without it being *definitely* super-true. Epistemicism struggles to make sense of "indefinite super-truth."

  #### C. Counterfactuals and Semantic Plasticity
  Consider the counterfactual: *"If we had used the word 'tall' slightly differently, would the extension change?"*
  *   **Supervaluationism:** Yes. Since the extension is determined by linguistic usage and usage is indeterminate, a slight shift in usage shifts the set of admissible precisifications. The boundary is "soft" because it is constituted by our practices.
  *   **Epistemicism:** This is trickier for the epistemicist. If the boundary is fixed by usage, a change in usage changes the boundary. However, the epistemicist must maintain that *given actual usage*, the boundary is sharp.
  *   **The Test:** Consider a "Twin Earth" scenario where usage is identical up to the borderline case.
      *   The **Epistemicist** must say there is a fact of the matter on both Earth and Twin Earth, and they must match (if usage is identical).
      *   The **Supervaluationist** can say that reference is indeterminate, so there is no fact of the matter about whether the extensions match in the borderline zone.

  ### Recommendation for Your Chapter
  Do not settle the dialectic by dismissing supervaluationism as a notational variant. Instead, frame the chapter around the **trade-off**:

  1.  **The Epistemicist Path:** Retain classical logic and bivalence. Pay the price of accepting sharp boundaries in nature/language and explaining away the intuition that there are none (usually via ignorance).
  2.  **The Supervaluationist Path:** Retain the intuition that there are no sharp boundaries. Pay the price of truth-value gaps and a non-classical logic (specifically, the failure of bivalence and complications with validity).

  If you proceed as an epistemicist, do so because you believe the logical costs of supervaluationism (gaps, failure of truth-preservation in certain contexts) are worse than the metaphysical costs of epistemicism (sharp boundaries). That is a robust philosophical position. But do not argue that supervaluationism *agrees* there is a unique extension; that is the one thing it was designed to deny.
