answer: |-
  # The Wrong Kind of Reasons: A Decision Tree

  **Instructions:** Begin at the root. For each node, consider the case described and select the answer that best matches your intuitive judgment or theoretical commitment. Follow the branch to the next node or final position. At each leaf, you will find the name of the position your path entails, along with the specific commitment that position will find most difficult to defend.

  ---

  ### **ROOT NODE: The Object of the Reason**
  **Case:** An agent is offered a large sum of money to form the *intention* to perform a specific action. However, when the time comes to act, the agent will have no reason to perform the action, and the money is kept regardless of whether the action is performed.
  **Question:** Does the payment provide a reason *for the intention itself*, or does it provide a reason *to want to bring it about that one has the intention*?

  *   **A.** It provides a reason to want to bring it about that one has the intention (not for the intention directly).
      *   *Go to Node 1.*
  *   **B.** It provides a reason for the intention itself (directly).
      *   *Go to Node 2.*

  ---

  ### **NODE 1: The Nature of the Shifted Reason**
  *(Reached if you chose A at Root)*
  **Case:** Consider the "Demon Case": A powerful being will destroy what you love unless you admire him. You cannot admire at will.
  **Question:** If the reason is for *wanting* to admire rather than admiring, is the normative force of this reason fundamentally the same kind of force as the reason provided by the demon's admirable qualities (if he had any), or is it a different kind of force entirely?

  *   **A.** It is the same kind of normative force (Monism).
      *   **LEAF 1: Unoccupied Position (Instrumental Monism).**
      *   *Diagnosis:* Coherent but unattractive. Almost no one holds this because instrumental reasons for mental states typically function differently than constitutive reasons.
      *   *Hardest Commitment:* You must explain why we cannot simply satisfy this reason by manipulating our minds without any regard for the object of the attitude.
  *   **B.** It is a different kind of normative force (Dualism).
      *   **LEAF 2: Object-Shift View.**
      *   *Hardest Commitment:* You must explain why the agent feels a tension between the payment and the attitude if the payment is not actually a reason for the attitude itself.

  ---

  ### **NODE 2: Weight versus Kind**
  *(Reached if you chose B at Root)*
  **Case:** Consider the "Reward for Fear Case": An agent is offered a reward for fearing a harmless spider. The spider poses no danger.
  **Question:** Does the reward compete directly with the lack of danger in a single weighing process to determine if fear is rational, or does the reward operate in a separate normative lane that does not affect the rationality of the fear itself?

  *   **A.** It competes directly in a single weighing process (Same Kind).
      *   **LEAF 3: The Weight View.**
      *   *Hardest Commitment:* You must defend the claim that it could be genuinely fitting or correct to fear something known to be harmless if the reward is high enough.
  *   **B.** It operates in a separate normative lane (Different Kind).
      *   *Go to Node 3.*

  ---

  ### **NODE 3: Location of the Difference**
  *(Reached if you chose B at Node 2)*
  **Case:** Consider the "Pill Case": A pill induces a belief without evidence, and holding this belief would make the agent's life go better.
  **Question:** If the reason to take the pill is of a different kind than evidence, is this difference located in the *source* of the consideration (pragmatic vs. truth-related), or in the *nature of the attitude* (beliefs aim at truth, desires do not)?

  *   **A.** The difference is in the source/content of the consideration.
      *   **LEAF 4: Content/Source View.**
      *   *Hardest Commitment:* You must explain why the same pragmatic consideration counts as a reason for a different attitude (like hope) without changing its fundamental kind.
  *   **B.** The difference is in the nature of the attitude or the normative role.
      *   *Go to Node 4.*

  ---

  ### **NODE 4: Uniformity and Reflexivity**
  *(Reached if you chose B at Node 3)*
  **Case:** Consider the "Amusement/Goodwill Case": An agent has a reason to be amused by an unfunny joke to preserve a friend's goodwill. Sometimes, being amused makes a joke socially 'fitting'.
  **Question:** Does your distinction between reason-kinds apply uniformly to beliefs (excluding pragmatic reasons entirely), or does it allow that for some attitudes (like amusement or intention), pragmatic reasons can sometimes constitute fittingness?

  *   **A.** It applies uniformly; beliefs strictly exclude pragmatic reasons.
      *   **LEAF 5: Doxastic Exception View.**
      *   *Hardest Commitment:* You must explain why the mind is partitioned such that beliefs are immune to pragmatic reasons while intentions and emotions are not, without appealing to circular definitions.
  *   **B.** It allows pragmatic reasons to constitute fittingness in reflexive cases.
      *   **LEAF 6: Reflexive Fittingness View.**
      *   *Hardest Commitment:* You must specify the exact conditions under which a pragmatic reason transforms into a right-kind reason without making the theory collapse into the Weight View.

  ---

  ### **UNOCCUPIED LOGICAL SPACE DIAGNOSIS**

  The following combinations are logically possible but currently unoccupied in the literature:

  1.  **Direct Reason + Same Kind + Doxastic Exception:** (Path: Root B → Node 2 A → Node 4 A).
      *   *Diagnosis:* **Incoherent.** If pragmatic reasons are the *same kind* as evidence (Weight View), there is no logical basis for beliefs to exclude them while other attitudes admit them. This position is unstable.
  2.  **Object-Shift + Same Kind:** (Path: Root A → Node 1 A).
      *   *Diagnosis:* **Coherent but Unattractive.** This view claims reasons to *want* an attitude are the same kind as reasons *for* the attitude. It fails to capture the intuitive distinction between manipulating a state and holding it for merit.
  3.  **Content View + Uniformity:** (Path: Root B → Node 2 B → Node 3 A → Node 4 A).
      *   *Diagnosis:* **Unexplored.** Most Content theorists focus on the source difference. A view claiming the content difference strictly forbids pragmatic reasons for belief but allows them for intention based solely on content is theoretically possible but lacks a defender.

  ---

  ### **INSTRUMENT CLOSING REPORT**

  **1. Indistinguishable Leaves**
  The tree cannot reliably separate **Leaf 5 (Doxastic Exception View)** and **Leaf 6 (Reflexive Fittingness View)** in cases where social fittingness is ambiguous. Both views can agree that pragmatic reasons sometimes count for amusement but not for belief. To separate them, a further question is needed: *When pragmatic reasons count for amusement, do they make the amusement correct/fitting (Leaf 6), or do they merely make it rational to have without making it fitting (Leaf 5)?* The current cases do not force a distinction between "rational to have" and "fitting."

  **2. Genuinely Contested Nodes**
  **Node 2 (Weight versus Kind)** is the site of the most substantive disagreement. Answering this is not a matter of reading the case carefully but of prior theoretical commitment regarding the unity of normativity. A student who believes all practical reasons are commensurable will inevitably choose A, while a pluralist will choose B. **Node 1 (Object of the Reason)** is also deeply contested, specifically regarding the possibility of intending for a reason. Some students will find it conceptually impossible to intend for a reason one knows will not apply at the time of action, forcing them to Branch A, while others will deny this conceptual constraint.

  **3. Limitations of the Instrument**
  This instrument creates an illusion of settlement regarding the *source* of the normativity. A student may reach **Leaf 4 (Content/Source View)** and believe they have solved the problem by locating the difference in the consideration itself. However, the tree does not settle *why* that content difference matters normatively. Students are likely to resist **Leaf 3 (The Weight View)** not because they disagree with the logic of the tree, but because they find the consequence (that one can correctly fear a harmless spider for money) too high a price for theoretical unity. The tree maps the commitments, but it cannot resolve the underlying tension between theoretical simplicity and intuitive plausibility.
