prompt: |-
  I'm a functional programmer by trade and a type-theory hobbyist, and I've been reading around the problem of the unity of the proposition — the puzzle about what makes a proposition more than the mere collection of the things it mentions, together with the infinite regress (the one Bradley's name is attached to) that seems to threaten any attempt to explain the binding with yet another relation. I'd like you to translate that whole debate into the vocabulary I actually think in: type constructors, records and product types, dependent pairs, currying and partial application, evaluation as against inference, and the difference between a syntax tree and the value it evaluates to. Take the regress and the proposed ways out one at a time — the line that the relation is itself a constituent, the line that predication is primitive and needs no explanation, the line that propositions are acts or judgements rather than objects, and any others you take to be load-bearing — and restate each as faithfully as you can using the constructs above. I don't want a summary of the philosophy; I want to see it rebuilt in my terms, and I want you to be honest whenever the rebuilding does violence to the original rather than quietly rounding it off.

  Then give me the residue report, which is really the part I care about. Which parts of the debate translate cleanly — I suspect the infinite regress does, since to me it already looks like an infinitely descending chain of type constructors — which translate only with distortion, and which have no counterpart at all in my vocabulary? In particular I want to know whether the target vocabulary has anything to say about truth, satisfaction, or about-ness, or whether all I really have is evaluation and execution, so that a proposition in my sense is just a program state and the whole idea that it can be about the world has nowhere to live. Where something genuinely fails to survive, tell me whether that is a defect of my framework — something it cannot express but ought to — or a sign that the philosophers' question was less determinate than it sounds. I've also half-remembered a similar-looking regress in Lewis Carroll's dialogue between Achilles and the tortoise about inference; if it becomes relevant, say whether it is the same phenomenon in different clothes or a different one that merely rhymes. I'd much rather you flag your uncertainty than invent precision. Please write the answer in American English.
