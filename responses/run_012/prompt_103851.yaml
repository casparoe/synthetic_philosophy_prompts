answer: |-
  Here is a grading breakdown designed to be defensible, clear, and efficient for you to use.

  ### **Grade: 8/10**

  ### **Comments to Write on the Paper**
  *(Write this in the margin or at the end of the page)*

  > **Good work identifying the structure of the argument.** You correctly spot that the student's reasoning is a valid backward induction and that the core issue lies in the premises (the announcement itself). The connection to the Liar Paradox is an excellent insight and shows you're thinking about the self-referential nature of the problem.
  >
  > **Two points to refine:**
  > 1. **Truth of the Announcement:** The prompt states the exam *was* a surprise. If the exam happened and was a surprise, the announcement was technically *true*, even if it seemed self-contradictory beforehand. Be careful distinguishing between "the announcement seems impossible to fulfill" and "the announcement was false."
  > 2. **Location of the Error:** You say the reasoning is "valid at each step." Most philosophers argue the error is specifically in the first step (eliminating Friday). To eliminate Friday, students must *know* the exam will happen, but the "surprise" condition means they can't know that with certainty on Thursday night. Pinpointing this epistemic gap would have made this a perfect answer.
  >
  > **Strong analysis overall.**

  ---

  ### **Grading Justification (For your records/defense)**
  *If the student comes to office hours to argue for more points, here is your point-by-point breakdown.*

  **1. Identification of Argument Structure (2/2 points)**
  *   **Credit Earned:** The student correctly identifies the argument as a "backward induction" and notes that the conclusion follows validly *if* the premises are granted.
  *   **Why:** This demonstrates they understand the logical form of the student's argument in the prompt.

  **2. Diagnosis of the Paradox (3/3 points)**
  *   **Credit Earned:** The student correctly identifies that the premises are inconsistent ("premises can't all be true together") and links this to self-reference ("like the liar paradox").
  *   **Why:** This is the philosophical heart of the problem. Recognizing that the announcement creates a self-defeating condition is a correct and sophisticated diagnosis (akin to the "Shaw" or "Winch" interpretations of the paradox).

  **3. Explanation of the Wednesday Outcome (2/3 points)**
  *   **Credit Earned:** The student explains the surprise psychologically ("students had talked themselves into thinking the announcement was impossible").
  *   **Credit Lost:** This explains *why they felt* surprised, but not logically *how* the surprise was possible. A full-credit answer would explain that because the reasoning was flawed (specifically regarding knowledge claims), the students did not actually *know* the exam wouldn't happen, leaving logical room for the surprise.
  *   **Defense:** The prompt asks "what is going on" logically, not just psychologically.

  **4. Precision on Truth Values & Epistemology (1/2 points)**
  *   **Credit Earned:** The student attempts to address the truth of the announcement and mentions iterated knowledge.
  *   **Credit Lost:** There is a contradiction in the answer. The prompt stipulates the exam *was* a surprise. The student concludes the announcement was "false" because "no exam could have been a surprise," then admits "in practice the students were surprised." If they were surprised, the announcement was true. Additionally, the claim that "knowledge can't be iterated" is vague terminology for an intro course (usually the issue is the *factivity* of knowledge or closure under deduction, not iteration).
  *   **Defense:** In logic, we must be precise about truth conditions. If $P$ = "There will be a surprise exam," and a surprise exam occurs, $P$ is true. The student muddies this distinction.

  **Total:** 2 + 3 + 2 + 1 = **8/10**

  ---

  ### **TA-to-TA Note**
  I know the irony of grading a surprise exam paradox while planning a surprise quiz for your own section is not lost on you. My advice? **Don't give the quiz.**

  If you give the quiz, you become the Teacher in the paradox. If you don't, you're just a TA who decided to be merciful. Save yourself the epistemic headache and the potential student revolt. Good luck with the rest of the stack!
