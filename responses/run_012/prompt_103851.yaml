      *(Self-Correction during drafting)*: I should make sure the TA knows that this paradox is notoriously difficult and there is no *single* right answer, so the grading needs to reflect coherence rather than just "the textbook answer." The student's answer is actually philosophically sophisticated (linking to Liar Paradox). I might even bump it to 8.5 or 9 if I want to be generous, but 8 is safer for defense. Let's stick with 8/10 to leave room for the "perfect" answer that distinguishes between *knowing* the exam will occur and the exam *occurring*.

      *Wait, one more thing:* The prompt asks "is the teacher's announcement true?" The student says "in the end the teacher's announcement was false." But the prompt states "The exam is then held on Wednesday, and it is a surprise." If it is a surprise, the announcement "There will be a surprise exam" is *true*. The student creates a tension here: "no exam could have been a surprise... even though in practice the students were surprised." This is the weakest part of the answer. They need to distinguish between *predictable* surprise and *actual* surprise. I will deduct points specifically for this confusion.

