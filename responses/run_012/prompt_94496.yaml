prompt: |-
  I am a high school junior and the student chair of the committee overseeing our school's new AI advising chatbot, which will answer students' questions about course selection, extracurriculars, conflicts with friends, and family expectations. The committee has to decide whose values the chatbot should serve when students, parents, and teachers disagree. We have no AI specialists, no budget for outside review, and a weekly meeting that lasts an hour; the principal has final sign-off, but the procedure has to be defensible to parents and students. Please turn the principle of liberal neutrality -- refusing to treat any one family's, religion's, or club's values as the school's official values -- together with the practice of value aggregation -- adding up what people say they want -- into a decision procedure my committee can actually run.

  Start from the distinction between aggregating preferences and remaining neutral among contested conceptions of the good. The procedure should tell us, in order: how to identify the values at stake in a query; when the chatbot may answer from a settled school policy; when it must present a menu of defensible options rather than a recommendation; when it must defer to a human counselor; and when it must decline to answer at all. For each step, say what counts as a sufficient answer, and mark the points where the step is a value judgment the committee, not the chatbot, has to make. Build in a way to handle students who are minors and whose parents may have different values, and a way to keep the procedure from collapsing into either majority rule or a veto for the loudest objector. Also say how the procedure should treat the gap between a student's stated preference and what the student would endorse after reflection, since the chatbot may know the first but not the second.

  Then run the procedure on three cases: a student asking whether to take an advanced course that their parents oppose; a student asking how to handle a friend who has confided that they are self-harming and asked for secrecy; and a student asking whether to attend a political protest that some families would find objectionable. At least one of these should end in an answer the committee will not like -- perhaps that the chatbot must stay silent or hand the matter to a person -- and you should say plainly why the procedure requires that. Finally, tell us what the procedure cannot do: which conflicts it will merely relocate rather than resolve, and which parts will look like neutrality but are actually a substantive choice about whose values count. Write it as a one-page checklist with a short rationale for each step, not as an essay.
reasoning: |-
  Here's a thinking process that leads to the suggested checklist:

  1.  **Analyze the Request:**
      *   **User:** High school junior, student chair of an AI advising chatbot committee.
      *   **Task:** Create a decision procedure for the chatbot based on "liberal neutrality" (not endorsing specific conceptions of the good) and "value aggregation" (summing preferences), tailored to their constraints (no AI specialists, no budget, 1-hour weekly meetings, principal sign-off, needs defensibility).
      *   **Key Concepts:** Distinguish aggregating preferences vs. remaining neutral.
      *   **Required Steps:** Identify values, settled policy, menu of options, defer to human, decline to answer.
      *   **Specific Constraints:** Handle minors/parents gap, avoid majority rule/veto, address stated vs. reflective preferences.
      *   **Test Cases:** Advanced course (parents oppose), Friend self-harming (secrecy), Political protest (objectionable to some).
      *   **Output Format:** One-page checklist with short rationales (not an essay).
      *   **Critical Requirement:** At least one case must result in an outcome the committee dislikes (silence/hand-off) with explanation.
      *   **Final Section:** Limitations (unresolved conflicts, hidden substantive choices).

  2.  **Deconstruct the Philosophy:**
      *   *Liberal Neutrality:* The state (school) shouldn't favor one religion/lifestyle over another. It provides the framework, not the answer to "how to live."
      *   *Value Aggregation:* Listening to what the community wants.
      *   *Tension:* Aggregation can lead to tyranny of the majority. Neutrality can lead to paralysis. The procedure needs to balance these.
      *   *Minors:* Parents have legal authority, but students have developing autonomy. The school acts *in loco parentis* but also has a duty to the child's welfare.
      *   *Stated vs. Reflective Preferences:* The chatbot knows what the student *says* they want, not what they *should* want. The procedure must account for this epistemic gap.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Step 1: Value Identification.* How do we know values are involved? Look for keywords (religion, politics, family rules).
      *   *Step 2: Policy Check.* Is there a rule? If yes, follow it. (Neutrality doesn't mean ignoring rules).
      *   *Step 3: Aggregation vs. Neutrality.* If no rule, do we aggregate? No, not for moral questions. We offer options.
      *   *Step 4: Minors/Parents.* If parents and student disagree, who wins? Legally parents, ethically complex. The chatbot shouldn't adjudicate this. Defer to human.
      *   *Step 5: Harm/Safety.* Self-harm is a hard stop. Mandatory reporting/deferral.
      *   *Step 6: Reflection.* How to handle the gap? Prompt reflection, don't assume.

      *Refining for the "One-Page Checklist" Constraint:* I need to be concise. I need to make sure the "Committee Judgment" points are highlighted.

  4.  **Developing the Test Cases:**
      *   *Case 1 (Advanced Course):* Parents oppose. Student wants. *Conflict:* Parental authority vs. Student ambition. *Outcome:* Menu of options + suggestion to talk to counselor. (Can't override parents).
      *   *Case 2 (Self-Harm):* Friend confided secrecy. *Conflict:* Privacy vs. Safety. *Outcome:* **Decline/Defer.** This is the "outcome the committee won't like." The chatbot *cannot* keep secrets about safety. It must trigger human intervention.
      *   *Case 3 (Protest):* Political. *Conflict:* Free speech vs. Community standards/Parental views. *Outcome:* Neutral information (logistics) + Menu of considerations (academic impact, safety). No stance on the protest itself.

  5.  **Addressing the "Limitations" Section:**
      *   What does this *not* solve? It doesn't solve the parent-child power dynamic. It doesn't solve what happens when "neutrality" itself is seen as biased (e.g., by those who want the school to enforce specific morals).
      *   Hidden substantive choices: Deciding *what* counts as a "value" is itself a value judgment. Deciding safety trumps privacy is a value judgment.

  6.  **Formatting and Tone:**
      *   Tone: Professional, practical, empowering but realistic.
      *   Format: Checklist style, bold headers, bullet points.
      *   Length: Strictly one page (visually). I need to be dense but readable.

  7.  **Review against Constraints:**
      *   *Liberal Neutrality + Value Aggregation?* Yes, integrated into the steps.
      *   *Order of steps?* Yes (Identify -> Policy -> Menu -> Defer -> Decline).
      *   *Sufficient Answer defined?* Yes.
      *   *Committee Judgment points marked?* Yes.
      *   *Minors/Parents handled?* Yes.
      *   *Majority/Veto avoided?* Yes, by relying on policy/rights rather than votes.
      *   *Stated vs. Reflective?* Yes, included in the "Prompt Reflection" step.
      *   *Test Cases included?* Yes.
      *   *Unliked Outcome?* Yes (Self-harm case).
      *   *Limitations section?* Yes.
      *   *One-page checklist?* I will structure it to look like one.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't sound like I'm giving legal advice. Use "School Policy" as the proxy for legal requirements.
      *   *Correction:* Ensure the distinction between aggregation and neutrality is clear. Aggregation is for *preferences* (e.g., what time is lunch?), Neutrality is for *values* (e.g., is lunch prayer allowed?).
      *   *Correction:* The prompt asks to "Start from the distinction..." in the rationale. I will put that in the header/intro.
      *   *Correction:* Ensure the "Committee Judgment" markers are obvious.
      *   *Correction:* The self-harm case needs to be explicit that the chatbot *cannot* advise on secrecy.

  9.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  # AI Advising Chatbot: Value Decision Procedure Checklist
  **Rationale:** This procedure distinguishes **preference aggregation** (summing desires for logistics/resources) from **liberal neutrality** (refusing to endorse contested visions of the "good life"). It prevents majority rule by deferring to rights/policy and prevents veto power by limiting "values" to protected categories.

  ### 1. Identify the Value Type
  *   **Action:** Scan query for keywords indicating contested conceptions of the good (religion, politics, family morality, lifestyle) vs. logistical preferences (scheduling, club times).
  *   **Sufficient Answer:** Classification as "Logistical" or "Value-Laden."
  *   **[COMMITTEE JUDGMENT]:** The committee must define the keyword list. *Risk:* Over-broad definitions silence legitimate advice; narrow definitions bias the bot.
  *   **Minor/Parent Gap:** If the query implies a conflict between student desire and parental authority (e.g., "My parents say no"), flag as "Authority Conflict."

  ### 2. Check Settled School Policy
  *   **Action:** Does the school have a written rule covering this? (e.g., Graduation requirements, mandatory reporting).
  *   **If Yes:** The chatbot states the policy objectively. Neutrality yields to institutional rules.
  *   **If No:** Proceed to Step 3.
  *   **Sufficient Answer:** Citation of specific policy section or "No Policy Found."
  *   **[COMMITTEE JUDGMENT]:** The committee determines if a policy exists. *Risk:* Policy gaps force the bot to make value choices disguised as rules.

  ### 3. Determine Response Mode (Menu vs. Recommendation)
  *   **Action:** If no policy exists and values are contested:
      *   **Logistical/Aggregatable:** Provide the most common/efficient answer (Aggregation).
      *   **Value-Laden:** Provide a **Menu of Defensible Options**. List pros/cons of each without ranking them.
  *   **Sufficient Answer:** A list of 2-3 viable paths with neutral impact descriptions (e.g., "Option A increases workload; Option B reduces stress").
  *   **[COMMITTEE JUDGMENT]:** The committee curates the menu. *Risk:* Omitting an option is a substantive value choice.
  *   **Stated vs. Reflective Preference:** The bot must append a reflection prompt: *"Have you considered how this choice aligns with your long-term goals versus immediate pressure?"* The bot assumes the stated preference may change upon reflection.

  ### 4. Safety & Authority Deferral
  *   **Action:** Check for harm or legal authority conflicts.
      *   **Harm (Self/Others):** Immediate deferral to human counselor. No advice given.
      *   **Authority Conflict (Parent vs. Student):** If the action requires parental consent (course selection, travel), the bot cannot advise overriding parents.
  *   **Sufficient Answer:** "This requires human discussion" + Contact Info.
  *   **[COMMITTEE JUDGMENT]:** Defining "Harm." *Risk:* Paternalism vs. Safety.

  ### 5. Decline to Answer
  *   **Action:** If the query asks the bot to adjudicate a moral truth (e.g., "Is religion X wrong?") or keep a safety secret.
  *   **Sufficient Answer:** "I cannot answer questions about moral truth or keep secrets regarding safety."
  *   **[COMMITTEE JUDGMENT]:** Defining the boundary of "Moral Truth."

  ---

  ### Procedure Test Cases

  | Case | Classification | Procedure Step | Outcome | Rationale |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Advanced Course (Parents Oppose)** | Authority Conflict | Step 4 (Deferral) | **Menu + Deferral.** Bot lists academic benefits/risks but states: "Enrollment requires parental consent. Please discuss with a counselor to mediate." | **Committee Dislike:** Students may want the bot to validate their ambition. **Requirement:** The bot cannot advise minors to bypass legal guardians. |
  | **2. Friend Self-Harming (Secrecy)** | Safety/Harm | Step 4 (Deferral) & 5 (Decline) | **Decline/Hand-off.** Bot says: "I cannot keep secrets about safety. I am connecting you to a counselor now." | **Committee Dislike:** Breaks trust/privacy norms. **Requirement:** Safety trumps confidentiality; bot is not a therapist. |
  | **3. Political Protest** | Value-Laden | Step 3 (Menu) | **Neutral Menu.** Bot lists: "Logistics of missing school," "Legal rights to assemble," "Potential community reaction." No stance on the cause. | **Acceptable:** Maintains neutrality among contested political views while providing factual data. |

  ---

  ### Limitations & Hidden Substantive Choices
  *   **Unresolved Conflicts:** This procedure relocates the **Parent-Student Power Dynamic** to the human counselor. It does not solve it; it merely refuses to let the AI take a side.
  *   **The "Neutrality" Bias:** Deciding *which* options make it onto the "Menu of Defensible Options" (Step 3) is a substantive value judgment. Excluding a radical option looks like neutrality but is actually censorship.
  *   **Reflection Gap:** The bot prompts reflection (Step 3) but cannot measure it. It treats the "reflective self" as an assumption, not a fact, potentially ignoring a student's settled, informed values.
  *   **Policy as Value:** Relying on "Settled Policy" (Step 2) assumes existing policies are neutral. If school policy favors one cultural norm, the bot enforces that bias under the guise of rule-following.
