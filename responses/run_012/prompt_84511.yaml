answer: |-
  # The Social Sorting Quiz
  **Instructions:** Read each scenario and pick the response that feels most true. There are no right answers, only different maps.

  **1. The Bank Run**
  A bank is solvent, but a rumor starts that it is not. Depositors rush to withdraw money, and the bank fails. Why did it fail?
  *   **A.** Because enough individuals believed the rumor and acted on that belief.
  *   **B.** Because the "panic" took on a life of its own, overriding individual rationality.
  *   **C.** Because "panic" is just a useful word for a complex pattern of individual withdrawals.

  **2. The QWERTY Keyboard**
  The keyboard layout persists even though more efficient designs exist. Nobody prefers it, yet nobody switches. What keeps it in place?
  *   **A.** The coordination convention itself exerts pressure on every new typist.
  *   **B.** Every individual typist chooses it because they expect everyone else to use it.
  *   **C.** It doesn't matter if we call it a "convention" or "expectations," as long as we predict the persistence.

  **3. Inflation Expectations**
  Inflation rises because everyone *expects* inflation to rise, so they raise prices preemptively. Is the expectation a social fact?
  *   **A.** Yes, and it causes the price rises directly, like a law of nature.
  *   **B.** It's just a summary of millions of individual predictions adding up.
  *   **C.** It is a pattern of individual predictions that cannot be simply summed, but isn't a separate "thing."

  **4. The Crowd Crush**
  In a dense crowd, people are pushed forward against their will and tragedy occurs. Who pushed them?
  *   **A.** The crowd dynamics pushed them; individual intent is irrelevant here.
  *   **B.** Person X pushed Person Y, who pushed Person Z. Only bodies push bodies.
  *   **C.** "Crowd dynamics" is just the name for the physical chain of bodies pushing.

  **5. Language Change**
  A language quietly loses a case ending over centuries. If we mapped every speaker's brain perfectly, would we capture the "language"?
  *   **A.** No, the language exists as a system outside any single brain.
  *   **B.** Yes, the language is nothing over and above the sum of those brains.
  *   **C.** The language is a pattern in those brains, but describing the pattern requires terms not found in neuroscience.

  **6. Institutional Counterfactuals**
  Take the exact same people from a democracy and place them in a dictatorship. Do they act differently?
  *   **A.** Yes, the Institution acts upon them to change their behavior.
  *   **B.** Only if their individual beliefs about the rules change first.
  *   **C.** They act differently, but "Institution" is just a label for the rules they believe in.

  **7. The Perfect Simulation**
  If a computer simulated every individual's psychology perfectly, would "society" appear in the simulation?
  *   **A.** No, you would need to program social laws separately.
  *   **B.** Yes, society would emerge automatically from the individual interactions.
  *   **C.** Yes, but you might not recognize it as "society" without using social-level labels.

  **8. The Law's Power**
  Can a law change your behavior even if you don't know the law exists?
  *   **A.** Yes, social structures constrain us regardless of our awareness.
  *   **B.** No, it must affect your beliefs or desires to affect your actions.
  *   **C.** If it changes behavior, something in your environment changed, regardless of the label.

  **9. "The Market"**
  When we say "The Market reacted badly," what are we talking about?
  *   **A.** A distinct entity with its own moods and reactions.
  *   **B.** A shorthand for thousands of traders buying and selling.
  *   **C.** A real pattern of trading that isn't just a shorthand, but isn't a ghost either.

  **10. The Dispute**
  Why does it matter whether we explain things by individuals or societies?
  *   **A.** Because one of these is the fundamental truth and the other is false.
  *   **B.** Because different questions require different levels of explanation; neither is "truest."
  *   **C.** Because individuals are the only real things, so social explanations are always fictions.

  ***

  # Scoring Key & Logical Tree

  **Step 1: The Meta-Check (Pluralism)**
  *   If you chose mostly **C** on Q10 (and likely C on Q2, Q8):
      *   **Position:** **Explanatory Pluralism** (The Pseudo-Problem View).
      *   **Logic:** You reject the idea that there is a single "fundamental" level of explanation.
      *   **Awkward Commitment:** You must accept that there is no final answer to "what *really* caused the war," only useful stories.
      *   *Exit Tree.*

  **Step 2: Explanatory Sufficiency (Individualism vs. Holism)**
  *   If you chose mostly **B** on Q1, Q4, Q6, Q7:
      *   **Path:** **Individualism.** You believe individual facts are sufficient to explain social outcomes.
      *   **Go to Step 3.**
  *   If you chose mostly **A** on Q1, Q4, Q6, Q7:
      *   **Path:** **Holism.** You believe social facts are needed to explain outcomes.
      *   **Go to Step 4.**

  **Step 3: Ontological Reduction (For Individualists)**
  *   If you chose mostly **B** on Q3, Q5, Q9:
      *   **Position:** **Eliminative Individualism.**
      *   **Logic:** Social facts are nothing over and above individuals; terms like "The Market" are convenient shorthand.
      *   **Awkward Commitment:** You must deny that a "recession" exists in any robust sense if no single individual is "in recession."
  *   If you chose mostly **C** on Q3, Q5, Q9:
      *   **Position:** **Non-Reductive Individualism.**
      *   **Logic:** Social facts are nothing over and above individuals, *but* they are not straightforwardly reducible (complex patterns).
      *   **Awkward Commitment:** You must claim social facts are "real" patterns that depend entirely on individuals yet require their own vocabulary to describe.

  **Step 4: Causal Power (For Holists)**
  *   If you chose mostly **A** on Q3, Q6, Q8:
      *   **Position:** **Strong Holism.**
      *   **Logic:** Social facts have causal powers of their own that bear down on individuals (downward causation).
      *   **Awkward Commitment:** You must accept that a "structure" can cause an action without any individual-level mechanism mediating it.
  *   If you chose a mix of **A** and **B** on Q3, Q6, Q8:
      *   **Position:** **Weak Holism (Structuralism).**
      *   **Logic:** Social facts explain outcomes, but only by constraining individual choices, not bypassing them.
      *   **Awkward Commitment:** You walk a tightrope: social facts matter, but you must admit they never actually *push* anyone without individual buy-in.

  ***

  # The Logical Tree

  ```text
  ROOT: How do we explain social phenomena?
  │
  ├── BRANCH 1: Is there a single correct level of explanation?
  │   ├── NO ──────────────────────────────> [Explanatory Pluralism]
  │   │                                       (Empty Cell Note: None. This is a meta-position.)
  │   └── YES
  │       │
  │       ├── BRANCH 2: Are individual-level facts ALWAYS SUFFICIENT 
  │       │             to explain social outcomes?
  │       │
  │       ├── YES (Individualism)
  │       │   │
  │       │   ├── BRANCH 3: Are social terms NOTHING BUT shorthand 
  │       │   │             for lists of individuals?
  │       │   │   ├── YES ─────────────────> [Eliminative Individualism]
  │       │   │   │                         (Awkwardness: "Recessions" are metaphors.)
  │       │   │   └── NO ──────────────────> [Non-Reductive Individualism]
  │       │   │                             (Awkwardness: Real patterns that aren't "things.")
  │       │   │
  │       │   └── NO (Holism)
  │       │       │
  │       │       ├── BRANCH 4: Do social facts exert CAUSAL POWER 
  │       │       │             without individual mediation?
  │       │       │   ├── YES ─────────────────> [Strong Holism]
  │       │       │   │                         (Awkwardness: Mysterious downward causation.)
  │       │       │   └── NO ──────────────────> [Weak Holism / Structuralism]
  │       │       │                             (Awkwardness: Social facts matter but can't push.)
  │       │       │
  │       │       └── EMPTY CELL: [Social Epiphenomenalism]
  │       │           (Social facts exist & aren't shorthand, but individuals 
  │       │           are sufficient & social facts have no power.)
  │       │           STATUS: Unattractive. Why posit existence if it does no work?
  │       │
  │       └── EMPTY CELL: [Causal Contradiction]
  │           (Individual facts are sufficient, BUT social facts cause things 
  │           without individuals.)
  │           STATUS: Incoherent. Violates transitivity of causation.
  ```

  ### A Note on Indistinguishable Positions
  **Weak Holism** and **Non-Reductive Individualism** often look identical on this quiz. Both agree that social patterns are real/important, but both deny "magic" downward causation.
  *   **To separate them:** Ask, *"If we knew every physical fact about every individual, would we still need the concept of 'class' to explain the revolution?"*
      *   The **Non-Reductive Individualist** says: "Technically no, but 'class' is a useful pattern."
      *   The **Weak Holist** says: "Yes, because 'class' captures relations that individual facts miss."

  ### A Note on Empty Cells
  *   **Social Epiphenomenalism:** This is the view that "Society exists, but it's just along for the ride; individuals do all the work." It is logically possible but rarely defended because it makes social science pointless.
  *   **Causal Contradiction:** The view that "Individuals explain everything, but Society causes things." This is logically incoherent (overdetermination without mechanism).
