prompt: |-
  I'm in a seminar on aesthetics and I'm stuck on a chunk of Kant's Critique of Judgement, the bit in the first part where he's sorting out what art in general is and then splits it into free art and what the Bernard translation calls mercenary art. My rough paraphrase of the passage is this: art is a kind of doing, not just acting or working in general, and its product is a work rather than a mere effect; art is also supposed to be distinct from science because art is a practical ability while science is theoretical knowledge; and then, within art, free art is the kind done as play, as an occupation agreeable in itself, whereas mercenary art is the kind done as labor, unpleasant in itself and attractive only because of what it pays. He even says that in the fine arts we often see a bit of both, and that the distinction is about the spirit of the activity, not just the physical product. I think I follow each sentence on its own, but I can't get them to sit together.

  My main confusion is this: if free art is supposed to be play and not a business, but Kant also knows that artists have to eat and that fine art is still a kind of art, then is the free/mercenary distinction a distinction between two different kinds of art, or between two different ways of pursuing the same activity? And what exactly does play mean here -- not serious, not coerced, not productive, or something else? Also, how does this fit with his later claim that fine art must look like nature? I'd like a careful unpacking of the passage term by term, with the contrasts he's drawing (doing vs acting, work vs effect, art vs science, free vs mercenary), and then an honest assessment of whether the distinction can survive contact with contemporary art that is conceptual, political, or explicitly commercial. Don't give me a reading list or citations; I just want to understand the text and the concepts.
