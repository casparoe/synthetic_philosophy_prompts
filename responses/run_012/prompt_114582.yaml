      *   **Constraints:** Address the specific context (contractors, visibility to management, seniority hierarchy).

  2.  **Deconstruct the Questions:**

      *   **Q1: What's going on?**
          *   Concept: Information Cascades / Herding Behavior.
          *   Distinction: Independent verification vs. Social Proof.
          *   Diagnosis: Look at the *content* of comments. "Agreed with X" vs. specific technical findings. Look at timing (clustered after first approval).

      *   **Q2: Is the manager's fix real?**
