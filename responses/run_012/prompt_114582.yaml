answer: |-
  1. **What's actually going on?**
  This is an **Information Cascade**.

  Here is the difference:
  *   **Independent Agreement:** Person A reads the doc, finds no errors. Person B reads the doc, finds no errors. They both approve based on their own work.
  *   **Information Cascade:** Person A reads the doc, finds no errors. Person B reads the doc, finds a potential error, but sees Person A approved. Person B assumes Person A knows something they don't, so they suppress their concern and approve. Person C sees A and B approved, so they approve without looking closely.

  Once the first few people signal approval, the public signal outweighs the private information. Your concern about the table lock was private information. The Lead's approval was a public signal. You trusted the signal over your data.

  **How to tell after the fact:** Look at the comments. Independent agreement produces varied comments citing specific sections ("Checked indexing on line 40, looks good"). A cascade produces vague comments ("Looks solid," "Agreed with [Lead]"). Look at timing. If 80% of comments arrive within an hour of the first approval, it's a cascade.

  2. **Is your manager's fix a real fix?**
  No. It is mostly theater.

  Your manager is treating this as a visual problem (seeing the banner). It is a psychological problem (knowing the stakes). As you noted, you know who wrote the proposal, you know the Lead will see your name, and you know contractors need renewals. Writing your review in a private draft before revealing it doesn't remove the fear of contradicting the Lead later.

  **What actually works:**
  *   **Senior Person Reviews Last:** This is the highest-leverage change. If the Lead comments last, they cannot anchor the room. Junior engineers and contractors must commit to their analysis before seeing the "correct" answer. This forces them to own their critique.
  *   **Domain Assignment:** Assign specific sections to specific people. "Sarah owns DB migration safety." "Mike owns API contracts." If the migration locks the table, that is on Sarah, regardless of what the Lead thinks. This分散 (disperses) responsibility so no one can hide behind the Lead's approval.
  *   **Anonymous Reviews:** This works for contractors but is hard in a 40-person team (writing styles identify people). It also reduces accountability. Use only if fear of retaliation is the primary blocker.

  **Smallest real change:** Reverse the order. Senior person reviews last.

  3. **Countering "The lead is right 80% of the time, speed is good."**
  You are giving up **risk detection on high-cost failures.**

  Speed matters for cheap decisions. Rollbacks are expensive. A 20-minute lock on a main table costs engineering hours, risks data corruption, and damages trust.
  *   **The Math:** If the Lead is right 80% of the time, that means 20% of approved designs have flaws. If you catch those flaws early, it costs 1 hour of review time. If you catch them in production, it costs 20 hours of rollback + incident management + reputational damage.
  *   **The Bias:** The "80%" number is likely inflated because bad ideas are being filtered out by silence, not by critique. You don't know how many bad proposals slipped through because nobody spoke up. You only know about the one that crashed.

  **The Answer:** "We are optimizing for review speed, but our cost model is weighted toward production stability. One rollback costs more than ten slow reviews. We need to shift the bottleneck from 'getting the Lead's approval' to 'verifying domain safety'."

  4. **Does majority voting work?**
  No. Majority voting assumes everyone is weighing the same factors. They aren't.

  If five people vote "Approve" because the API looks clean, but one person votes "Block" because the migration deletes data, the majority vote kills the company.

  **What replaces it:** **Veto Power by Domain.**
  Treat reviews like a security clearance. Everyone provides input, but specific roles hold veto keys.
  *   The DB expert holds the veto on schema changes.
  *   The Security engineer holds the veto on auth changes.
  *   The Lead holds the veto on roadmap alignment.
  If the DB expert says "This locks the table," the proposal is blocked, even if everyone else likes the API design. This makes dissent mandatory for specific roles, removing the social burden from general reviewers.

  5. **Adversarial Thinking: How to game the system.**
  If I wanted to push a bad proposal through, I would:
  1.  Write the proposal clearly and confidently.
  2.  Message the Lead privately before posting. "Hey, thinking about this approach, does this align with your view on X?"
  3.  Get their verbal buy-in.
  4.  Post the doc.
  5.  Ask the Lead to comment first.

  Once the Lead approves publicly, the social cost for anyone else to block it becomes too high. Contractors won't risk their renewal. Juniors won't risk looking wrong. The cascade begins.

  **What this tells you to fix:** The system fails because the Lead's opinion is the first public data point. You must prevent private alignment from becoming public anchoring. The "Senior Reviews Last" rule breaks this attack vector.

  6. **Is there a name for this pattern?**
  Yes. **Information Cascade** (specifically within a hierarchy).
  Related terms: **Authority Bias** (valuing the senior opinion over evidence), **Groupthink** (prioritizing harmony over critique), and **Anchoring** (relying too heavily on the first piece of information offered).

  **Specific Context Note:**
  You mentioned contractors whose renewals depend on the Lead. This intensifies the **Authority Bias**. In standard economic models of information cascades, agents are assumed to be rational actors optimizing for truth. In your setup, contractors are rational actors optimizing for contract renewal. They are behaving logically according to their incentives, not illogically according to engineering best practices.

  Standard advice fails here because it assumes psychological safety exists. It doesn't. Your process relies on people risking their social capital or income to speak up. You cannot fix this with "please speak up." You must fix it by removing the requirement to contradict the Lead publicly. **Senior Reviews Last** protects the contractors because when they write their review, the Lead's opinion is not yet on the record.
