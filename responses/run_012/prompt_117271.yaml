prompt: |-
  you're a philosopher of science who's spent way too long in methodology-of-economics land, so put that hat on for this one. I want a parody: the instructions-to-authors page of a fictional journal — call it something plausible, maybe *The Journal of Applied Prediction* — run by an editorial board that has swallowed the F-twist whole. You know the view: the realism of a theory's assumptions is irrelevant to how good the theory is, the only real test is predictive accuracy, and a theory whose assumptions are wildly false is often the *more* powerful one for it. So: deadpan, numbered guidelines, around 650 words, no winking, no "obviously this is absurd," written like a real in-house style guide that's been through a few revisions.

  Brainstorm first — spend a few sentences on what the strongest version of that view actually commits you to and where it starts to hurt, then write so that the sore spots are the funny ones. It should be a fair caricature: someone who has genuinely thought about this laughs rather than winces, and someone who's never read a word of the debate still finds it funny as a bureaucratic document.

  Structural jokes I want in there somewhere: a mandatory falsity-disclosure section where authors list the assumptions they know are false and rate how productively false each one is; a referee-checklist item asking wether an unrealistic assumption is doing real work or is just decorative; guidance for when two models with equally false assumptions fit the data equally well; a paragraph on whether a model that predicts well earns you the right to intervene; and a house rule on submissions that try to make the assumptions more realistic (spoiler: that's a step down). Invent two or three of the journal's own bureaucratic house terms for this stuff so it reads like it has real institutional history. No citations, no quotes from real papers, and don't name real economists.
