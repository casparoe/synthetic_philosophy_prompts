answer: |-
  *Methodological Note: A strict instrumentalist commitment implies that theories are merely instruments for organizing data, not descriptions of reality. The sore spot arises when predictive success is decoupled entirely from causal mechanism: if assumptions don't matter, progress becomes arbitrary, and policy intervention becomes a leap of faith. The following guidelines enforce this decoupling as administrative procedure.*

  ***

  **THE JOURNAL OF APPLIED PREDICTION**
  **Instructions to Authors (Rev. 14.2)**

  **1. Mission Scope**
  *The Journal of Applied Prediction* (JAP) publishes manuscripts that demonstrate high-fidelity output regarding observable variables. Ontological fidelity is neither required nor desired. Authors should treat theories as filing systems for data, not maps of underlying structures. A manuscript demonstrating high predictive yield but relying on physically impossible premises is preferred over a structurally accurate model with inferior fit.

  **2. Assumptional Drag and Falsity Disclosure**
  All submissions must include a **Falsity Disclosure Statement (FDS)**. In this table, authors must list every core assumption known to be empirically false. For each assumption, assign a **Falsity Coefficient (FC)** between 0.0 (true) and 1.0 (impossible). 
  *   **Note:** Assumptions with an FC below 0.4 are viewed with suspicion, as they suggest insufficient abstraction. 
  *   **Requirement:** Authors must justify the **Assumptional Drag** of each false premise. If an unrealistic assumption does not actively contribute to predictive yield, it is deemed decorative and must be removed. Decorative falsity is grounds for desk rejection.

  **3. Model Selection and Tie-Breaking**
  In cases where two models exhibit statistically indistinguishable predictive accuracy, editors will apply the **Principle of Maximal Abstraction**. The model with the higher aggregate Falsity Coefficient will be prioritized, provided the assumptions are sufficiently general. A model assuming perfect information is preferred to one assuming costly information gathering, all else being equal. Complexity added solely to enhance realism constitutes ontological bloat and will be flagged during peer review.

  **4. Intervention and Policy Claims**
  Authors are cautioned against conflating predictive sovereignty with causal leverage. A model may successfully predict a market crash without identifying the mechanism causing it. Claims regarding policy intervention require separate validation beyond predictive fit. Successful prediction does not grant the right to intervene; authors must explicitly state that their model is an observational tool, not a lever. Proposals for policy based solely on black-box prediction must be relegated to the "Speculative Applications" section.

  **5. Revision Protocols**
  During the revision process, authors are strictly prohibited from "realism creep." Do not attempt to make assumptions more empirically plausible in response to referee comments. If a referee suggests that an assumption is "too strong," interpret this as a request to demonstrate higher predictive yield, not to soften the premise. Replacing a false assumption with a true one is considered a degradation of the model's abstractive power and will result in withdrawal of acceptance.

  **6. Referee Guidelines**
  Reviewers will assess manuscripts using the **Instrumental Checklist**. Key items include:
  *   Is the unrealistic assumption doing real work, or is it merely decorative?
  *   Does the model fail when the assumptions are made more realistic? (If yes, this is a strength).
  *   Has the author resisted the temptation to explain *why* the prediction works?

  **7. Formatting**
  Manuscripts must be submitted in double-column format. Equations should prioritize solvability over interpretability. Any section titled "Mechanism" or "Microfoundations" must be removed prior to submission.
