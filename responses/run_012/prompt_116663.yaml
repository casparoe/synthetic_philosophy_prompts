  Sorry in advance, this is a bit of an odd one. My brother and I got into a stupid argument about whether a hot dog is a sandwich and it somehow ate two weeks of my life, because every definition we came up with either let in stuff we both agreed wasn't a sandwich or ruled out stuff we both agreed was. Then a friend told me Wittgenstein sorted all this out ages ago — that words like 'game' don't share one thing in common, just a tangle of overlapping similarities, a 'family resemblance.' I looked into it a bit and I'm stuck on a few things. First, I can't tell what the claim is even about: how we use the word, or the things themselves? People seem to slide between the two and they aren't the same claim. Second, I've heard someone propose a one-line definition of games — roughly, that playing a game is voluntarily taking on unnecessary obstacles — and if a definition like that actually works, doesn't the whole family resemblance idea collapse? Third, is family resemblance meant as a theory of what a concept is, or is it more like being told to stop asking for definitions, and how does the 'language game' idea fit with it — same point or a different one? And is there any real difference between saying a word has a family resemblance structure and just saying definitions are fuzzy?

  Be straight with me about which parts of this are settled and which are still genuinely argued about by people who know the area — I don't want the tidy version that makes it sound like everyone agrees when they don't. No reading list needed, I just want the ideas.
