answer: |-
  (1) Consider a courtroom where the standing rule is "No objection may be heard unless cited to a specific prior precedent." A dissenter stands to argue that this rule stifles justice by binding the court to the past. To make this argument admissible so the judge doesn't strike it from the record, the dissenter must cite specific prior precedents that support the right to innovate. The exact move where they get caught is **citing case law to argue against the requirement to cite case law**. They are using the court's own bureaucratic gatekeeping mechanism to challenge the gatekeeping, making their rejection dependent on the very rule they reject.

  (2) Consider an analytical lab where the standard practice is "Zero the balance before every measurement." A dissenter claims that zeroing imposes an artificial baseline and that the raw drift of the instrument is the true data. To demonstrate that the drift is consistent and measurable (and thus valid data), they must record the balance's reading when empty to establish the drift's magnitude. The exact move where they get caught is **using the empty-pan reading as a reference point to prove the reference point is unnecessary**. They cannot quantify the "drift" without implicitly establishing a zero, so their evidence against zeroing relies on the act of zeroing.

  The single difference that makes (1) a cheat and (2) not is **the source of the constraint**: in (1) the constraint is institutional (the judge silences you), while in (2) the constraint is constitutive of the phenomenon (you cannot quantify drift without a baseline). If you remove this difference by imagining a courtroom where the judge is replaced by physical law (your voice fails if you don't cite precedent), case (1) becomes case (2); conversely, if you imagine a lab where the balance works by bureaucratic fiat (it reads zero because the manual says so), case (2) collapses into case (1).

  In case (2), the dissenter does have an exit that isn't going quiet: they can **stop measuring**. They can refuse to engage in quantification entirely and simply observe the instrument without recording data. To shut that exit, the case must require **coordination**; if they need to mix a reagent based on that mass, they cannot just observe, they must act on the measurement, forcing them back into the standard of reliability they deny.

  Your postdoc wins on the strongest version of her charge if she argues that **constitutive constraints are just institutional constraints with higher stakes**. She would say "physics" is just the ultimate institution, and if you don't care about building bridges that stand or solutions that mix, you owe nothing to the zeroing standard. My honest read is that this lands partially: it shows your standards are universal only *relative to the goal* of predicting and controlling nature, but it fails to dismiss them as merely "local" in the way court rules are, because the cost of opting out isn't social exclusion, it's physical failure.
