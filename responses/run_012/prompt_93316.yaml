  # JOINT STATEMENT ON CONDITIONALITY AND SUBSISTENCE
  **Regarding the Reform of the National Welfare System**

  **Signatories:** R (Welfare Rights Sector) & T (Social Policy Research Sector)
  **Date:** October 2023
  **Context:** A mid-sized ageing economy with high in-work poverty and rising benefit sanction rates.

  ### I. AGREED CLAIMS
  *We, the undersigned, acknowledge the following as established premises for future policy design. These are not compromises; they are the shared ground upon which our disagreement rests.*

  1.  **On Employment Outcomes:** We agree that the current evidence base does not support the claim that increasing sanction rates leads to sustained, high-quality employment outcomes for the long-term unemployed. Sanctions reduce caseloads; they do not reliably increase net earnings over a 24-month horizon.
  2.  **On Administrative Burden:** We agree that "administrative burden" is a functional equivalent to partial benefit cuts. Complex form-filling, frequent reassessments, and compliance hurdles deter eligible claimants (take-up gap) and consume cognitive bandwidth that would otherwise be directed toward job search or household management.
  3.  **On Displaced Costs:** We agree that destitution is not cost-neutral to the state. When subsistence income is reduced or interrupted, costs do not vanish; they displace to other budget lines, specifically emergency healthcare (A&E), temporary accommodation, and local authority crisis support. The disagreement is not *whether* this happens, but the magnitude relative to savings.
  4.  **On Political Economy:** We agree that the current coalition funding the welfare state is fragile. We both reject the "undeserving poor" narrative as factually incorrect, but we agree it is politically potent. A system perceived as unfair by the median voter risks collapsing the redistribution budget entirely.
  5.  **On In-Work Poverty:** We agree that conditionality focused solely on the unemployed ignores the primary driver of poverty in this country: low wages and insecure hours. A welfare system that polices the unemployed while subsidizing low-wage employers is structurally inefficient.
  6.  **On the Goal:** We agree that the metric of success must be the reduction of material deprivation, not the reduction of the claimant count. A lower caseload driven by hidden destitution is a policy failure, not a success.

  ***

  ### II. TABLE OF DISAGREEMENTS (CRUXES)
  *Where we diverge on interpretation, mechanism, and priority. We have committed to testing these divergences empirically.*

  | Crux | R's Framing (The Sustainability View) | T's Framing (The Rights View) | Agreed Test / Comparison | R's Prediction (5-Year) | T's Prediction (5-Year) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Reciprocity & Legitimacy** | Conditionality is a **signal of mutual obligation** that maintains middle-class consent. Without it, welfare is viewed as a one-way transfer, eroding the tax base that funds it. | Conditionality is a **mechanism of exclusion** that rationalizes withholding rights. It shifts focus from structural unemployment to individual compliance, legitimizing poverty. | **The "High-Support/No-Sanction" Pilot:** A staggered rollout in 3 regions where job-search requirements remain, but financial sanctions are removed and replaced with intensive case-worker support. | **R:** Political support for welfare spending in pilot regions will drop by >5% compared to control regions; "softness" will be exploited by media/opponents. | **T:** Political support will remain stable or rise; the narrative will shift to "effective support" as employment outcomes improve or stay neutral. |
  | **2. The Metric of Success** | **Caseload Reduction** is a valid proxy for efficiency. If people leave benefits, they are either working or no longer need state aid. Persistently high caseloads indicate dependency traps. | **Net Wellbeing** is the only valid proxy. Caseload reduction often masks "churn" (people cycling off benefits into crisis) or hidden poverty. We must track health/housing emergencies alongside benefit exits. | **Data Linkage Trial:** Link DWP benefit data with NHS emergency attendance and Local Authority housing crisis data in real-time for a specific cohort. | **R:** There will be no significant correlation between sanction-induced exits and emergency health/housing usage. | **T:** There will be a statistically significant spike in emergency health/housing usage within 3 months of sanction-induced exit. |
  | **3. Political Sustainability** | **Hardness protects the budget.** Tough conditionality inoculates the system against populist attacks. If the middle class believes checks are in place, they tolerate higher spending. | **Cruelty kills the budget.** Visible hardship and humiliation eventually alienate the public. Universal, light-touch systems (e.g., Nordic model) retain higher support because they are not stigmatized. | **Longitudinal Polling:** Track median-income voter willingness to increase welfare tax during an economic shock, comparing periods of high vs. low media coverage of sanctions. | **R:** High media coverage of *fraud/leniency* reduces support more than coverage of *hardship*. Toughness is the shield. | **T:** High media coverage of *hardship/sanctions* reduces support more than coverage of *fraud*. Empathy is the shield. |
  | **4. Coercion vs. Contract** | **Contractual Baseline:** Receiving public money entails an agreement to seek independence. Failure to meet terms is a breach of contract, justifying reduction. It is not coercive if the alternative (work) is available. | **Coercive Baseline:** Subsistence is a prerequisite for agency. Threatening removal of subsistence to force behavior is coercive by definition, regardless of job availability, because the power imbalance is total. | **Qualitative Decision-Making Study:** Interview claimants under threat of sanction vs. those in a no-sanction pilot regarding their job-search choices and stress levels (cortisol/cognitive load tests). | **R:** Claimants in the sanction regime will show higher "activation" rates without detrimental cognitive decline; the structure provides necessary focus. | **T:** Claimants in the sanction regime will show higher "survival" behavior (taking bad jobs) and measurable cognitive decline compared to the no-sanction group. |

  ***

  ### III. ANALYSIS: VERBAL VS. SUBSTANTIVE

  **1. The Verbal Disagreement (The Baseline Problem)**
  Crux #4 (Coercion vs. Contract) is largely verbal. R and T are using different baselines for "freedom."
  *   **R's Baseline:** The state is not obligated to provide cash. Therefore, attaching strings to a gift is not coercion.
  *   **T's Baseline:** In a modern economy, access to money is a prerequisite for survival. Therefore, attaching strings to survival is coercion.
  *   **Resolution:** This collapses if we agree on the *effect* rather than the *label*. If the Agreed Test (Qualitative Decision-Making Study) shows that sanctions cause cognitive decline that reduces employability, R must concede the mechanism is counter-productive, regardless of whether she calls it "coercion." If the study shows sanctions focus attention without harm, T must concede the moral objection is outweighed by the utility. The word "coercion" is doing no work; the *consequence* is the crux.

  **2. The Substantive Disagreement (The Political Calculation)**
  Crux #1 and #3 (Reciprocity and Sustainability) are genuinely substantive. This is an empirical gamble on human psychology and voting behavior.
  *   **R** bets that the median voter is primarily motivated by fear of exploitation (free-riders).
  *   **T** bets that the median voter is primarily motivated by empathy (suffering neighbors).
  *   **Why it matters:** This cannot be solved by philosophy. It requires the **Longitudinal Polling** test outlined above. If R is right, unconditionalism leads to a smaller welfare state. If T is right, conditionality leads to a smaller welfare state. Both claim to want the same outcome (a robust safety net), but they have identified opposite causal paths to get there.

  **3. The Collapsed Crux (The Definition of Work)**
  There is a hidden crux regarding "Reciprocity." R argues reciprocity is legitimate. T argues it is legitimate *only if* it accounts for care/disability.
  *   **Collapse:** If R agrees that "reciprocity" can be satisfied by unpaid care work, training, or volunteering (not just paid employment), the moral gap narrows significantly. T's objection is not to *activity*, but to *paid employment as the sole metric*. If the policy shifts to "Social Contribution" rather than "Job Search," T's human-rights objection loses force, and R's political argument remains intact. This is a policy design fix, not a philosophical impasse.

  **Conclusion for the Referee:**
  Your friends are not fighting about facts; they are fighting about **risk**. R is risk-averse regarding the *budget* (fear of losing the middle class). T is risk-averse regarding the *claimant* (fear of harming the vulnerable). The document above forces them to bet on their risk assessments. In five years, the data from the proposed tests will not tell them who is "moral," but it will tell them who is right about how the world works.
