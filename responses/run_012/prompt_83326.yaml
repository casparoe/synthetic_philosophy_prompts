answer: |-
  ### Part 1: Candidate Mechanics (and why I killed them)

  Here are four ways I've tried to mechanicalize *akrasia* in the past. Three failed; one is the basis for the design below.

  **1. The Public Ledger (Rejected)**
  *   **Mechanic:** Everyone writes their choice (Now vs. Later) on a whiteboard visible to all each round. Breaking a prior stated intention incurs a "shame tax" (token loss).
  *   **Why it failed:** It turns the game into a performance of consistency rather than an experience of temptation. Participants optimize for *looking* rational to the room (especially the economists) rather than grappling with their own judgment. It measures social anxiety, not willpower.

  **2. The Blind Auction (Rejected)**
  *   **Mechanic:** Participants bid tokens for the *right* to choose the "Later" option in future rounds. Highest bidders get the privilege of commitment.
  *   **Why it failed:** It immediately commodifies the will. The economists loved it; the undergrads felt excluded. It frames commitment as a resource you buy, rather than a constraint you submit to. It explains *how* to bind, but not *why* it feels like a struggle.

  **3. The Sudden Death (Rejected)**
  *   **Mechanic:** The game ends at a random, unknown round. Any tokens not "invested" in the Later option are lost when the whistle blows.
  *   **Why it failed:** It creates panic, not reflection. The phenomenology is fear of loss, not weakness of will. Also, logistically nightmarish to keep the end-time secret from 18 people in a small room without leaks.

  **4. The Ulysses Court (Selected)**
  *   **Mechanic:** Individual commitment/release costs combined with a social "permission" vote.
  *   **Why it works:** It forces the tension between *internal* judgment (I want to release) and *external* validation (Do they think I'm allowed?). It makes the "group mechanism" active rather than passive. It creates a specific moment of friction where the "preference reversal" has to be justified publicly.

  ---

  ### Part 2: The Activity Design — "The Ulysses Court"

  **Goal:** Physically separate *preference reversal* (changing your mind) from *akrasia* (acting against your standing judgment) using token costs and social permission.
  **Time:** 75 Minutes.
  **Players:** 18 (Split into two groups of 9 for the Naive/Sophisticated variable).
  **Materials:**
  *   200 Poker chips or colored paper tokens (Start each player with 10).
  *   Index cards and pens (one per player).
  *   Two boxes labeled "Commitment" and "Release."
  *   **Prizes on display:** 3 Gift Cards ($10), 6 Premium Snacks, 9 Generic Snacks. (Visible throughout).
  *   Whiteboard/Flipchart for tracking rounds.

  #### Payoff Scheme (Explain in 2 mins)
  1.  **Tokens are Tickets:** You start with 10 tokens.
  2.  **The Choice:** Each round, choose **Safe** (1 token now) or **Invest** (3 tokens at the very end).
  3.  **The Tiers:**
      *   **15+ Tokens:** Gift Card or Premium Snack.
      *   **10–14 Tokens:** Generic Snack.
      *   **<10 Tokens:** Nothing (or a consolation sticker).
  4.  **The Catch:** To get 15+, you must Invest most rounds. But you can pay to lock yourself in, or pay to break the lock.

  #### The Naive/Sophisticated Split
  *   **Group A (Sophisticates):** Sit Left. Tell them: *"There are exactly 5 decision rounds."*
  *   **Group B (Naives):** Sit Right. Tell them: *"We will play several rounds until time runs out. You won't know the last round until it happens."*
  *   *(Note: Both groups play exactly 5 rounds.)*

  #### Timeline (75 Minutes)

  **0:00–0:10 | Setup & Stakes**
  *   Distribute tokens (10 each).
  *   Place prizes on the table.
  *   Explain the Payoff Scheme.
  *   **Crucial:** Do not explain Commitment/Release yet.

  **0:10–0:15 | The Pre-Play Judgment (Constraint 1)**
  *   Hand out index cards.
  *   **Instruction:** "Write two sentences. 1: 'Across the whole session, I judge I *should* choose Invest ___ times.' 2: 'I predict I *will actually* choose Invest ___ times.' Fold the card. I will collect them now. They stay sealed until the end."
  *   *Facilitator collects cards in a box.*

  **0:15–0:20 | Round 1 (Baseline)**
  *   Simple choice: Safe (1 token) or Invest (3 tokens at end).
  *   Players make choice privately, drop token in corresponding bowl.
  *   *No commitments allowed yet.* This establishes a baseline preference without constraints.

  **0:20–0:25 | The Commitment Phase (Constraint 2)**
  *   **Instruction:** "Before Round 2, you may bind your future self. You can pay **2 tokens** now to lock yourself into **Invest** for Rounds 2, 3, and 4. If you commit, you cannot choose Safe in those rounds unless you buy a Release."
  *   Players decide. Those who commit put 2 tokens in the "Commitment" box and receive a red marker/chip to signify they are bound.

  **0:25–0:35 | Rounds 2 & 3 (The Grind)**
  *   **Round 2:** Bound players *must* Invest. Unbound players choose.
  *   **Round 3 (The Temptation Peak):**
      *   Announce: "This is the high-stress round."
      *   **Release Mechanism (Constraint 3 & 4):** "If you are bound but want to choose Safe, you may request a Release. Cost: **5 tokens**. **However**, you must stand up and ask the room for permission. If 50% of the room does *not* raise their hands to grant permission, you remain bound and lose the 5 tokens anyway."
      *   *Why this works:* It makes the release socially costly. It forces the "akratic" agent to seek validation for their weakness.
      *   Allow 3 minutes for Release requests. Facilitate the votes quickly.

  **0:35–0:40 | Round 4 (The Endgame)**
  *   Bound players (who didn't release) must Invest.
  *   Unbound players choose.
  *   *Sophisticates know this is penultimate. Naives think it might be the end.*

  **0:40–0:45 | Round 5 & Count**
  *   Final choice.
  *   Tally tokens. Distribute prizes immediately.
  *   *Visual proof of stakes is essential.*

  **0:45–1:15 | The Debrief (See Part 3)**
  *   Return the Pre-Play cards to the players.
  *   Facilitate the discussion.

  ---

  ### Part 3: The Debrief Guide

  This is where the philosophy happens. Do not lecture. Use the game moments to force the distinction.

  **1. The Pre-Play Gap (Judgment vs. Prediction)**
  *   *Action:* Have everyone unfold their index cards.
  *   *Question:* "Look at the gap between what you wrote you *should* do and what you *would* do. Who had a gap of zero? Who had a gap of three or more?"
  *   *Philosophical Point:* If you predicted you would fail, was that *akrasia* or just accurate self-knowledge of a preference reversal?
  *   *Trap:* If someone says "I knew I'd be weak," ask: "Did knowing make it easier or harder?" (Tests the Naive/Sophisticated split).

  **2. The Release Vote (The Social Will)**
  *   *Action:* Call on someone who paid for Release.
  *   *Question:* "When you stood up to ask for permission: Did you want them to say 'No' so you'd have an excuse to stay bound? Or did you want them to say 'Yes' so you wouldn't feel guilty?"
  *   *Philosophical Point:* This targets the "Group Mechanism." If you wanted them to say No, your "later preference" (Safe) was in conflict with your "better judgment" (Invest). That is the phenomenology of *akrasia*. If you didn't care, it was just a preference change.
  *   *Follow-up:* "For those who voted: Did you deny permission because you thought they were making a mistake, or because you wanted to protect the group pot (if you used a variant) / social norm?"

  **3. The Naive vs. Sophisticated Split**
  *   *Action:* Ask Group A (knew 5 rounds) and Group B (didn't know) to raise hands if they committed in Round 1.
  *   *Question:* "Group A, did knowing the end date make you more likely to bind? Group B, did the uncertainty make you hoard tokens?"
  *   *Philosophical Point:* Hyperbolic discounting says we discount the future non-linearly. But if *information* changes the binding, is it the discount rate that's the problem, or the uncertainty of the self?

  **4. The Economists & The Emeritus**
  *   *To the Economists:* "You called this time inconsistency. But if I pay to bind myself, I am paying to *restrict* my future inconsistency. Why would a consistent agent pay to limit their own future freedom? Was the fee a transaction cost or a penalty for irrationality?"
  *   *To the Emeritus:* "You suspected this was a confusion. At what moment did the confusion feel most real? Was it when you held the tokens, or when you stood up for the vote?"

  #### Limitations (What you must supply)
  Be honest with them. This activity cannot do three things:
  1.  **Phenomenology of Craving:** 5 tokens isn't rent money. The "urge" to choose Safe is intellectual, not visceral. *You must say:* "The tokens are symbolic. The anxiety you felt when the vote was happening—that small spike in heart rate—that's the only real data we have. The rest is math."
  2.  **The "Real" Self:** The game doesn't prove whether the Round 1 Self (Invest) or Round 3 Self (Safe) is the "true" one. *You must say:* "We tend to privilege the earlier judgment as 'better.' Why? Because it's more stable? Or just because it was first? The game doesn't settle that; it just shows they fought."
  3.  **Moral Weight:** Choosing Safe here hurts no one but you. Real akrasia often hurts others. *You must say:* "This is akrasia in a vacuum. Real willpower usually involves other people's trust. That's why the Vote mattered more than the Tokens."

  #### Predicted Failures & Fixes

  **1. The Arbitrageur (Usually an Econ Grad)**
  *   *Problem:* They calculate that paying 5 tokens to release is still worth it if Safe gives immediate utility (e.g., stress relief) + they still have enough for a snack. They treat the "Release Vote" as a joke.
  *   *Fix:* Do not argue the math. In the debrief, ask them: "Did you feel the need to justify your choice to the room, or was it purely transactional?" If they say transactional, they have opted out of the *akrasia* frame. Let them. Ask the room: "Is it possible to be akratic without feeling guilt?"

  **2. The "Monopoly Money" Effect**
  *   *Problem:* Undergrads treat tokens as meaningless.
  *   *Fix:* **The Prize Table.** Keep the gift cards and snacks visible on the table during the entire game. If someone drops below the threshold, point to the prize they just lost. "That chocolate bar was yours. You spent it on a Release fee."

  **3. The Principled Refuser**
  *   *Problem:* One person (likely the Emeritus or a contrarian) refuses to play or commit on philosophical grounds.
  *   *Fix:* Give them a role. "You are the Auditor." Their job is to watch the token counts and verify the Vote. This keeps them engaged without forcing them to submit to the mechanic. In the debrief, ask the Auditor: "From the outside, did the people releasing look like they were changing their minds or losing control?"

  **4. The Vote Bottleneck**
  *   *Problem:* Too many people want to Release in Round 3, eating up time.
  *   *Fix:* Hard cap. "We have 3 minutes for Release Requests. First three hands get the floor. If you aren't called, you remain bound." This creates scarcity and increases the tension for those who get to speak.

  ### Final Facilitator Note
  You are not trying to prove Aristotle right or the economists wrong. You are trying to make the *confusion* palpable. If, at the end, the room is arguing about whether the person who released was "weak" or just "rational," you have succeeded. That argument *is* the philosophy of action.
