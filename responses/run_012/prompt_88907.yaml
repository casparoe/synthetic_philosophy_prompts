  **BOARD DECISION MEMO**

  **TO:** Board of Directors
  **FROM:** [Your Name], Member, Board of Directors
  **DATE:** October 10, 2023
  **SUBJECT:** Classification of [Episode Redacted] in Annual Report and Archive Metadata

  **1. RECOMMENDATION**

  I recommend **Option 3**: The annual report and archive metadata will use the word "genocide," qualified by the statement: *"Our documentation meets the organization's forensic criteria for genocide. This is not a legal verdict; no competent court has so found."*

  This recommendation is contingent on a final safety review by the Field Director seven days prior to printing. If the Field Director certifies that use of the term will result in immediate expulsion or physical harm to staff that cannot be mitigated, we revert to Option 2 (describe acts only) for this cycle.

  **Signatory:** [Your Name], Board Member & Drafting Committee Chair

  **2. ADOPTED CRITERIA SPECIFICATION (V1.0)**

  To ensure reproducibility, the Board adopts the following criteria. These are technical specifications for internal classification, not legal statutes.

  *   **Protected Group:** Defined by perpetrator perception. If records show perpetrators targeted victims based on perceived national, ethnical, racial, or religious identity, the group is protected. Self-identification is secondary.
  *   **Specific Intent (*Dolus Specialis*):** Direct orders are not required. Intent may be inferred from pattern evidence if: (a) violence is systematic rather than sporadic; (b) victims are selected based on group identity (e.g., elites, clergy) rather than combat status; and (c) acts accompany demographic engineering (e.g., forced displacement, child transfer).
  *   **Destruction "In Part":** Met if the targeted segment is numerically substantial OR functionally significant (e.g., leadership, reproductive capacity). Killing 9,000 men of military age plus elites meets this threshold if it renders the group's continuity in that district impossible.
  *   **Cultural Destruction:** Destruction of libraries, churches, or names is not genocide *per se* under the 1948 Convention. It counts as evidence of intent to destroy the group's cohesion.
  *   **Two-Key Rule:**
      *   *Key 1 (Technical):* The record must meet the four criteria above.
      *   *Key 2 (Impact):* Use of the term must not impose disproportionate risk on local staff or victims compared to the risk of silence. This requires a signed assessment from the Field Director.

  **3. APPLICATION TO RECORD**

  **Key 1 Status: MET.**
  The record satisfies the specification. The targeting of teachers, clergy, and notables indicates an intent to decapitate the group's leadership. The transfer of children to state schools with name changes matches the Convention's provision on preventing births/transferring children. The commander's statement ("not be here in ten years") combined with "demographic balance" memos supports the inference of specific intent, even absent the word "destroy." The counterinsurgency frame and rival reprisals are noted but do not negate the systematic pattern against the protected group.

  **Key 2 Status: CONDITIONAL.**
  The host state's threat is credible. However, silence carries risk: it enables perpetrator denial and may jeopardize future funding required to sustain the field office. We mitigate staff risk through digital security upgrades and legal support, not by altering the historical record. The Field Director must confirm these mitigations are sufficient before print.

  **4. SEMANTICS: LEGAL VS. MORAL SENSE**

  We must acknowledge that one word cannot perfectly serve both the legal and moral registers without friction.
  *   **Legal Sense:** Requires proof beyond reasonable doubt in a competent court. We cannot provide this.
  *   **Moral Sense:** Requires truth-telling about the nature of the harm. We must provide this.

  Using the word without qualification (Option 1) corrupts the legal sense by claiming authority we lack. Using no word (Option 2) corrupts the moral sense by obscuring the severity of the harm. Option 3 preserves both: it asserts the moral truth while explicitly disclaiming the legal authority. The qualification ("we are not a court") is the insulation that prevents the corruption of either sense.

  **5. OBLIGATIONS**

  **To People in the Region:**
  We cannot offer physical protection. Our obligation is **fidelity**. If this is genocide, labeling it "atrocity" deprives victims of the specific legal and historical category that matches their suffering. We owe them a record that will withstand future scrutiny. Using the qualified term ensures the archive remains usable for future accountability mechanisms.

  **To Field Staff (14 Locals):**
  We owe them **informed consent** and **mitigation**.
  *   *Informed Consent:* Staff must know the Board voted to use the term despite known risks.
  *   *Mitigation:* We will allocate emergency funds for legal defense, evacuation planning, and family support if accreditation is revoked. We cannot ask them to bear the cost of our truth-telling without support. If the risk becomes existential, we pause the field office, not the truth.

  **6. REJECTED OPTIONS (STRONGEST VERSION)**

  **Option 2 (Describe Acts Only):**
  *Strength:* Maximizes staff safety and maintains access. It avoids politicizing the archive, satisfying the donor who warned against it. It respects the presumption of innocence until a court rules.
  *Rejection:* It cedes the definition of reality to the perpetrator state. If the criteria are met, silence is not neutrality; it is erasure. Donors funding "genocide documentation" may withdraw, collapsing the project anyway.

  **Option 1 (Unqualified Use):**
  *Strength:* Moral clarity. Aligns with partner organizations who argue pattern evidence is sufficient.
  *Rejection:* It exposes the organization to libel suits and destroys our credibility as a forensic archive. It ignores the "not a court" reality, making us vulnerable to accusations of activism over documentation.

  **7. WEAK JOINTS (WHAT WOULD CHANGE THIS RECOMMENDATION)**

  This recommendation relies on two assumptions that could fail:

  1.  **The Inference of Intent:** My reasoning hinges on inferring *dolus specialis* from pattern evidence (elite killing + demographic engineering). If new evidence emerges showing the commander's speech was rhetorical bluffing, or that the "demographic balance" memos referred to voluntary migration, Key 1 fails.
      *   *Flip Condition:* Discovery of explicit state orders permitting return *without* restriction during the killing phase, proving counterinsurgency rather than destruction.
  2.  **The Safety Assessment:** I am assuming the Field Director can mitigate the state's threat. I am not on the ground.
      *   *Flip Condition:* If the Field Director reports that state security services have explicitly named our organization for expulsion upon use of the term, Key 2 fails. In that case, Option 2 becomes the only ethical choice to preserve staff safety.

  **8. NEXT STEPS**

  1.  Board vote on Option 3 and Criteria V1.0 by Thursday.
  2.  Research Director finalizes the "Statement of Criteria Met" for the report appendix.
  3.  Field Director conducts safety review by October 25.
  4.  Report to printer October 30.
