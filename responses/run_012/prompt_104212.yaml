answer: |-
  **Project Title:** Invariance and Ontology: Recasting the Structural Realism Debate

  **Research Question and Project Overview**

  The central aim of this project is to determine whether the persistent disagreement between epistemic and ontic structural realism is substantive or verbal. Specifically, the research asks: *Is the disagreement between epistemic and ontic structural realism primarily driven by divergent commitments regarding which physical invariances constitute "structure," rather than by divergent commitments regarding the mind-independence of that structure?*

  This question is designed to admit a determinate answer. It is possible that once the specific types of invariance are fixed and agreed upon, the disagreement between the two positions vanishes, revealing that the parties were merely talking past one another about what counts as preserved content. Conversely, it is possible that even when the definition of structure is standardized to a specific class of invariances, a robust disagreement remains regarding whether that structure represents the limit of knowledge or the limit of being. The project seeks to adjudicate between these two possibilities.

  Standard discussions in this area assume a shared definition of structure, typically characterized loosely as "that which is preserved across theory change." Proponents of the epistemic view argue that while we can know this preserved structure, we cannot know the nature of the entities that bear it. Proponents of the ontic view argue that there are no such entities; the structure is all there is. My hypothesis is that this shared ground is illusory. Both sides utilize "structure" as a placeholder for scientific continuity, but they smuggle in different criteria for what counts as preservation. One side may prioritize the invariance of mathematical formalism under transformation, while the other prioritizes the invariance of empirical regularities or causal relations. If the definition of structure shifts depending on the metaphysical commitment, the debate is circular. By recasting the debate in terms of a taxonomy of invariances, this project aims to isolate the metaphysical disagreement from the semantic ambiguity.

  **The Shape of the Existing Debate**

  To understand why this question remains open, one must look at the logical shape of the competing positions rather than their specific historical formulations. The epistemic position functions as a constraint on knowledge. It posits a gap between the relational structure of the world and the intrinsic nature of the relata. It argues that scientific methods grant access only to the former. The ontic position functions as a constraint on ontology. It posits that the distinction between relation and relatum is metaphysically untenable or unnecessary. It argues that the world is composed of structures without underlying bearers.

  Despite this apparent metaphysical divergence, both positions rely on a continuity argument to justify their focus on structure. They argue that because specific theoretical entities are discarded during scientific revolutions while certain structural features are retained, we should restrict our realism to those retained features. However, neither position provides a rigorous, independent criterion for identifying these retained features prior to making their metaphysical commitment.

  Consequently, the epistemic position tends to select a notion of structure that is broad enough to allow for unknown relata, often focusing on empirical predictions or high-level mathematical analogies. The ontic position tends to select a notion of structure that is tight enough to replace objects entirely, often focusing on fundamental symmetry groups or specific dynamical laws. Because the criterion for "structure" is adjusted to fit the metaphysical conclusion, the debate stalls. The epistemic realist claims the ontic realist is reading too much into the mathematics; the ontic realist claims the epistemic realist is retaining an incoherent notion of "unknown stuff." By treating the definition of structure as a variable rather than a constant, this project exposes a gap in the existing literature: the failure to distinguish between the *type* of invariance being preserved and the *modal status* of that invariance.

  **Methodology and Work Plan**

  The project will proceed over twelve months, divided into three phases. This methodology is chosen over the standard alternative of adjudicating the debate by appealing to episodes of theory change. The standard approach asks, "Did the entities survive?" or "Did the equations survive?" and draws metaphysical conclusions from the historical record. The problem with this approach is that historical cases are underdetermined; one can always argue that the entities survived in a disguised form or that the equations were merely instrumental. By focusing on invariances, we move the debate from historical narrative to conceptual clarity. We ask not what happened in history, but what *must* be preserved for the claim of realism to hold, and whether different answers to that question generate the realist split.

  *Months 1–3: Taxonomy of Invariances.*
  The first quarter will be dedicated to constructing a rigorous taxonomy of the types of invariance currently operating under the label "structure." I will distinguish between at least three categories: formal invariance (preservation of mathematical form under transformation), dynamical invariance (preservation of laws or equations), and empirical invariance (preservation of observable regularities). I will analyze recent philosophical literature to map which positions implicitly rely on which category. The deliverable for this phase will be a conceptual framework that allows us to say, for example, "Position A relies on dynamical invariance, while Position B relies on empirical invariance."

  *Months 4–6: Application to Case Studies.*
  The second quarter will apply this taxonomy to two standard case studies often used in this debate: the transition from Fresnel's ether theory to Maxwell's electromagnetism, and the transition from Newtonian mechanics to General Relativity. Unlike standard historical analysis, I will not ask whether realism was justified. Instead, I will ask whether the "structure" identified as preserved changes depending on which invariance taxonomy is applied. If the epistemic view aligns naturally with empirical invariance and the ontic view with formal invariance in these cases, this supports the hypothesis that the debate is driven by the choice of invariance. If both views require the same invariance type to make sense of the cases, the hypothesis is weakened.

  *Months 7–9: The Triviality Objection and Synthesis.*
  The third quarter will focus on the "triviality worry," often associated with the objection that any set of objects can be mapped onto any structure of the right cardinality. This is a critical test case for the proposal. If recasting the debate in terms of invariance cannot address this worry, the recasting offers no advantage over the standard formulation. I will investigate whether distinguishing between logical invariance (mere cardinality matching) and physical invariance (symmetry groups constrained by physical law) dissolves the triviality worry. The goal is to determine if the invariance approach imposes stricter constraints on what counts as structure than the standard relational approach. I will draft the core arguments connecting the taxonomy to the metaphysical conclusions during this period.

  *Months 10–12: Writing and Dissemination.*
  The final quarter will be dedicated to writing the final monograph or series of articles. I will synthesize the findings from the taxonomy and case studies to answer the primary research question. I will also prepare a summary suitable for a scientific audience, explaining why precision about invariance matters for scientific realism.

  **Expected Outcomes and Criteria for Failure**

  There are two primary successful verdicts this project could reach.

  First, the project could conclude that the distinction is largely verbal. This would occur if I demonstrate that once a specific type of invariance (e.g., dynamical symmetry) is fixed, the epistemic and ontic positions converge. For instance, if fixing the invariance type forces the epistemic realist to admit that the structure implies the nature of the relata, or forces the ontic realist to admit that the structure requires a bearer, the distinction collapses. This result would be philosophically significant as it would dissolve a decades-long stalemate and redirect attention toward the physics of invariance rather than the metaphysics of structure.

  Second, the project could conclude that the distinction is substantive. This would occur if, even after standardizing the definition of structure to a specific invariance class, a genuine disagreement remains regarding the mind-independence of that structure. For example, even if both sides agree that Lorentz invariance is the relevant structure, they might still disagree on whether Lorentz invariance exhausts reality. This result would vindicate the current debate but clarify its terms, showing that the disagreement is purely metaphysical rather than semantic.

  It is vital to distinguish a negative conclusion from project failure. A negative conclusion (e.g., "the debate is substantive") is a successful research outcome. Project failure would occur if the taxonomy of invariances proves impossible to construct rigorously, or if the recasting adds no explanatory power. For example, if it turns out that "invariance" is just as ambiguous as "structure," or if the triviality worry applies equally to all types of physical invariance, the project would fail to achieve its aim. Another mode of failure would be if the case studies show that scientific practice does not distinguish between these types of invariance in the way the philosophical taxonomy requires. If physicists treat formal and empirical invariance as interchangeable in practice, the philosophical distinction is idle. I will monitor for these risks during the first three months; if the taxonomy cannot be made precise, I will pivot to a narrower critique of the continuity argument itself.

  **Scope and Risk Assessment**

  A one-year timeframe is tight for a project of this conceptual scope. The primary risk is that the taxonomy of invariances becomes too technically demanding. Philosophy of physics literature on symmetries and gauge theories is dense, and getting bogged down in the technical details of specific physical theories could consume the entire year without yielding philosophical results. To mitigate this, I will restrict the technical analysis to the conceptual role of invariance rather than deriving new physical results. I will rely on established physical examples rather than exploring novel physics.

  A second risk is that the project becomes too broad by attempting to cover all forms of structural realism. To keep the scope manageable, I will focus exclusively on the debate regarding theory change and continuity. I will set aside related debates, such as those concerning quantum entanglement or spacetime substantivalism, unless they directly impinge on the definition of invariance. If the case studies in months 4–6 prove too time-consuming, I will reduce them from two detailed cases to one extended case, ensuring the conceptual work in months 1–3 and 7–9 remains uncompromised.

  **Test Case: The Triviality Worry**

  A crucial test for the viability of this proposal is its ability to handle the triviality worry. This objection states that if structure is defined merely as a set of relations, then given a set of objects of the right cardinality, one can always impose that structure upon them. Therefore, claiming that we know only the structure imposes no real constraint on the world; it is trivially true.

  If my recasting cannot say anything useful about this worry, that is a reason to doubt the idea. I propose that the recasting *does* offer a useful clarification, though it may not offer a final solution. The triviality worry relies on a notion of structure that is purely logical or mathematical. It assumes that any mapping that preserves relations counts as structural knowledge. By recasting structure in terms of *physical invariance*, the proposal introduces a constraint that pure cardinality lacks. Physical invariance requires that the relations be preserved under specific transformations dictated by the physical theory (e.g., rotation, translation, Lorentz boosts), not just any arbitrary mapping.

  If the debate is recast such that "structure" means "invariance under physical symmetry groups," the triviality objection loses its bite. One cannot simply map any set of objects onto a symmetry group without respecting the physical constraints that define the group. However, I must be candid about the limitation here. This move pushes the problem back one step. It solves the triviality worry only if we have an independent account of what makes an invariance "physical" rather than "logical." If the distinction between physical and logical invariance is itself unclear, the triviality worry returns in a new form.

  Therefore, the success of the project regarding this test case does not depend on definitively solving the triviality worry. It depends on showing that the invariance recasting *localizes* the problem. It shows that the triviality worry is not a problem for structural realism per se, but a problem for failing to specify the type of invariance involved. If the project can demonstrate that the triviality objection applies to empirical invariance but not to dynamical symmetry invariance, it will have succeeded in clarifying the debate, even if it leaves the metaphysical grounding of "physical symmetry" as a remaining question. If, however, the analysis shows that the triviality objection applies equally to all physically motivated invariances, I will report this as a significant limitation of the structuralist program, which is itself a valuable philosophical result. The proposal is committed to following the argument where it leads, even if it undermines the utility of the invariance recasting.

  **Conclusion**

  This project offers a novel pathway through a stalled debate in the philosophy of science. By shifting the focus from the ontology of structure to the criteria of invariance, it promises to reveal whether the disagreement between epistemic and ontic structural realism is a deep metaphysical divide or a confusion of terms. The methodology is concrete, the risks are managed, and the test cases are selected for their ability to stress-test the core hypothesis. The result will be a clearer understanding of what scientific realism claims when it claims to be structural, providing a firmer foundation for future work in the philosophy of physics.
