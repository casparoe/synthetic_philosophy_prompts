      *   If they can't say the child is harmed, the "mark against" (C5) loses its person-affecting grounding.
      *   If they ground it impersonally, they violate C3.

  6.  **Synthesizing the Audit:**

      *   **Tension 1 (Severe): C2 (Narrow PAV) vs. C5 (The "Mark Against").**
          *   *Why:* Narrow PAV makes the potential child's welfare morally invisible. C5 relies on that welfare being visible (as a mark against).
