      *   *Also:* C1 (No RC) + C4 (Transitivity) + C3 (Asymmetry) is the famous "Impossibility Theorem" zone.
      *   *Recommendation:* The user needs to know that C4 (Transitivity) is the likely casualty if they want to keep the intuitive C1, C2, C3, C5. OR they need to accept that C5's "mark against" is not person-affecting.

      *   **Wait, one more thing:** The user says "I treat the repugnant conclusion as a genuine reductio." (C1).
      *   And "I take the betterness relation to be transitive" (C4).
