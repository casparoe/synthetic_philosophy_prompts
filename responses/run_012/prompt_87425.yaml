          *   *Decision:* I will treat C2/C3 as compatible but fragile. The C2/C5 tension is sharper.

      *   **Tension 3 (Theoretical/Structural): C1 + C2 + C4 (The Impossibility Theorems).**
          *   *Why:* Gustaf Arrhenus's impossibility theorems show that you cannot satisfy Adequacy Conditions (including Transitivity, Non-Repugnance, Person-Affecting, Asymmetry) simultaneously without contradiction in certain spectrum cases.
