          *   *Cost:* None, logically, but requires precise wording. However, if the suffering is "substantial" (as per prompt), does it outweigh the "worth living" aspect under Asymmetry? Asymmetry usually prioritizes the negative.
          *   *Refinement:* The prompt says "substantial chance of a condition." C3 says "reason not to create someone who would suffer." If the chance is substantial, the expected reason is strong. C5 says "permissible." This is a tension of *weight*, not logic. But logically, Pro Tanto Reason + Permissible = Consistent.
