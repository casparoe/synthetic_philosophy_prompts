      *   **William James:** Voluntarism/Pragmatism. "The Will to Believe." In specific cases (genuine options: live, forced, momentous) where evidence is insufficient, passion/right to believe is legitimate. Truth can be *made* by belief. Focus on the individual's right to spiritual hope.
      *   **The Conflict:** Duty to truth/society (Clifford) vs. Right to hope/life-enhancement (James).

  3.  **Analyze *Life of Pi* in this Context:**
      *   **Pi's Multi-faith:** He prays to Vishnu, Jesus, and Allah. It sustains him. It's practical/experiential, not dogmatic.
      *   **The Two Stories:**
          1.  Animals (Tiger Richard Parker).
          2.  Humans (Cook, Sailor, Mother, Pi).
      *   **The Ending:** The officials choose the animal story ("the better story"). Pi says, "And so it goes with God."
