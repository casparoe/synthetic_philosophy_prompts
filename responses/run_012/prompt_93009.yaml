      *   **Section 2: Testing Rival Accounts of Personhood.**
          *   *The Single Living Brain (Biological/Animalism):* If the person is just the brain/organism currently existing, the past self has no authority. "Best interests" wins. Substituted judgment becomes incoherent (why let a ghost rule the body?).
          *   *The Experiential Subject (Presentism):* If the person is only what is felt *now*, the stroke victim is a new being. Past wishes are irrelevant. Only current pain/pleasure matters. This makes substituted judgment cruel (imposing past will on a new subject).
          *   *The Narrative Self:* This fits best. The person is a story. The stroke interrupted the narration. The surrogate is the editor. This makes the practice coherent but acknowledges the construction.

      *   **Section 3: The Inconsistency of the Three Rules.**
          *   You noticed the friction. That's because they serve different masters.
          *   *Directive:* Autonomy (Past Self rules).
          *   *Substituted Judgment:* Autonomy (Reconstructed Self rules).
          *   *Best Interests:* Beneficence (Current Organism's welfare rules).
          *   *Conflict:* They pull between the "Person as Project" (Autonomy) and "Person as Patient" (Welfare). The hierarchy (Directive > Surrogate > Best Interest) prioritizes Autonomy, but the fallback to Best Interest admits Autonomy can vanish.

      *   **Section 4: Hofstadter vs. The Hospital.**
