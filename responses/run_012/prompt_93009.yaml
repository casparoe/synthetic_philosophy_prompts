          *   *If Narrative (Current):* "What chapter would he want next?"
          *   *If Hofstadterian:* "How do we honor the pattern that now resides partly in you?" (Too mystical for medicine).

      *   **Conclusion:** Summarize. The system is a "logistics network for moral authority." It works not because it's philosophically pure, but because it balances competing claims. Validate the user's intuition that the "edges" they noticed are real cracks in the metaphysical foundation.

