  2.  **Deconstruct the Medical/Legal Framework:**
      *   *Rule 1: Advance Directive.* The written word is king. Presupposes: Autonomy is paramount; the past self binds the future self (even if the future self can't consent).
      *   *Rule 2: Substituted Judgment.* The surrogate reconstructs the will. Presupposes: The self has a coherent identity/values that persist beyond cognitive capacity and can be accessed by intimates.
      *   *Rule 3: Best Interests (Guardianship/No Family).* The state/doctor decides based on welfare. Presupposes: There is a "good" for this human organism that exists independent of their will.

  3.  **Analyze the Philosophical Concepts:**
      *   *Hofstadter's "Strange Loop":* Self as a pattern/symbol. Can be replicated/distributed. If true, the son *is* partially the father. This makes "substituted judgment" almost literal.
      *   *Psychological Continuity (Locke):* Personhood is memory/consciousness. If that breaks, is the person gone?
      *   *Biological View (Animalism):* Person = Human Organism. If so, "best interests" of the organism might trump "past wishes."
      *   *Narrative Self:* Person = The story told. Surrogate is the co-author.
      *   *Experiential Subject:* Person = The thing feeling pain/pleasure *now*. Past wishes matter less than current suffering.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the weight of the experience. Validate the logistics analogy (systems, protocols, edge cases). State the thesis: The practice is a pragmatic patchwork of conflicting metaphysical views, not a single coherent theory.

