  **The Scenario**

  Consider a municipal budget decision in a stable liberal democracy affecting two representative groups: Sanitation Workers and Public School Teachers. Sanitation Workers currently earn significantly higher wages but occupy a role with low social standing and little public recognition; Public School Teachers earn less but enjoy high social esteem and institutional authority. The city proposes a reallocation that increases Sanitation Workers' wages further while formally recognizing their role as essential infrastructure, funded by reducing Teacher pension benefits and publicly framing education as a standardized service rather than a vocation. Under an index weighted toward income and wealth, Teachers are the least advantaged group (earning less initially and losing pension security); under an index weighted toward the social bases of self-respect (standing and recognition), Sanitation Workers are the least advantaged (starting with low standing despite the gain, while Teachers retain higher relative status). The policy raises the absolute position of the Sanitation Workers on both dimensions but lowers the Teachers' position on both dimensions; the verdict flips solely because the identity of the "least advantaged" group changes depending on whether income or self-respect is the dominant metric.

  **The Demonstration**

  Under **Index A (Income/Wealth focus)**, the Teachers are the least advantaged group (baseline income 40k vs. Sanitation 60k). The policy reduces Teacher income to 35k while raising Sanitation income to 70k. Since the least advantaged group (Teachers) suffers a loss, the Difference Principle commands **Reject**.

  Under **Index B (Self-Respect focus)**, the Sanitation Workers are the least advantaged group (baseline standing score 10 vs. Teachers 80). The policy raises Sanitation standing to 15 while lowering Teacher standing to 75. Since the least advantaged group (Sanitation) gains, the Difference Principle commands **Adopt**.

  **The Divergence**

  The single feature driving the flip is the **negative correlation between primary goods** across the two groups. Income and the social bases of self-respect do not move in tandem; one group holds a comparative advantage in one good, the other in the second. If you remove this feature—making income and standing positively correlated (e.g., high income groups also have high standing)—both indices identify the same group as least advantaged, and the verdict stabilizes. The flip is not an artifact of construction; it reflects a real sociological trade-off where material compensation substitutes for social honor.

  **The Weighting Problem**

  Can the weights be fixed behind the Veil of Ignorance? Rawls argues yes: primary goods are "all-purpose means," rational agents want more of them regardless of their conception of the good, and income/wealth are the most flexible means. Therefore, the parties would prioritize income as the *metric* for the Difference Principle to ensure determinacy. However, your friction is justified: this prioritization is not derived from the Veil but is a **stipulation** required to make the principle operational. The Veil tells agents they want primary goods, but it does not mathematically dictate the exchange rate between income and self-respect when they conflict.

  **The Strongest Rawlsian Response**

  A strict Rawlsian responds that **Index B is invalid for the Difference Principle**. Rawls explicitly assigns the protection of the social bases of self-respect to the **First Principle** (equal liberty) and **Fair Equality of Opportunity**, which are lexically prior to the Difference Principle. Once basic liberties and fair opportunities are secured, the Difference Principle applies *only* to income and wealth. On this reading, the case collapses: Index B violates lexical priority by trading self-respect within the DP calculus. The flip is a defect of Index B, not the Principle.

  **Verdict**

  You must drop the constraint that **"Both indices have to be ones a serious Rawlsian could actually use."** A consistent Rawlsian cannot use Index B for the Difference Principle without violating the lexical order of justice. Rawls resolves your friction by fiat: he designates income and wealth as the sole currency of the Difference Principle precisely to prevent the incommensurability you have identified. Your seminar is not waving off a technicality; they are observing Rawls's workaround. The friction is real, but Rawls's theory solves it by ruling one side of the trade-off out of bounds for this specific principle, not by finding a neutral weighting.
