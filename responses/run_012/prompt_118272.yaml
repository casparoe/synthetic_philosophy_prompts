answer: |-
  Here is a proposal for the principle, the cost of its clauses, the application to your new cases, and an accounting of the mismatches.

  ### (a) The Principle

  **The Principle of Interdependent Success Conditions:**
  An episode is a joint action if and only if:
  1.  **Plural Content:** Each participant acts on an intention whose satisfaction condition is essentially plural (i.e., "That *we* $\phi$," not "That *I* do $x$ and *you* do $y$").
  2.  **Agency Reliance:** Each participant relies on the other's contribution as an exercise of *agency* (intentional guidance), not merely as a causal event or environmental constraint.
  3.  **Mutual Vulnerability:** The satisfaction of each participant's intention is mutually vulnerable to the other's intentional failure (if you stop intending to $\phi$, my intention to *we* $\phi$ is necessarily frustrated, not just thwarted).

  ### (b) The Price of the Clauses

  **Clause 1 (Plural Content)**
  *   **Forced by:** Case 6 (The Market) and Case 3 (The Four-Way Stop).
  *   **The Cost:** This excludes highly coordinated behaviors where the outcome is collective but the intentions are strictly individual. In the Market, agents intend "I profit," not "We allocate resources." In the Four-Way Stop, drivers intend "I cross safely," not "We cross."
  *   **What you lose if you drop it:** You collapse the distinction between *joint action* and *aggregate coordination*. You would have to call the Market a joint action, which contradicts your verdict and undermines the specific normative force of collective intentionality (e.g., collective responsibility).

  **Clause 2 (Agency Reliance)**
  *   **Forced by:** Case 2 (Sidewalk Strangers).
  *   **The Cost:** This excludes cases where one party treats the other as a predictable object. In the Sidewalk case, I adjust to your *movement*, not your *intention*. I treat you as a moving wall.
  *   **What you lose if you drop it:** You allow "joint action" to describe interactions with non-agents or agents treated as non-agents. This severs the link between joint action and the recognition of the other as a co-author.

  **Clause 3 (Mutual Vulnerability)**
  *   **Forced by:** Case 7 (Coerced Table Carrying) and Case 4 (Jazz Duo).
  *   **The Cost:** This is the hardest clause. It requires that my success *depends* on your continued agency. In Case 7, the coerced person still fails if the other drops the table, even if the coerced person hates the task. In Case 4, the jazz player fails if the partner stops, even without a plan.
  *   **What you lose if you drop it:** You cannot distinguish Case 3 (Stop) from Case 4 (Jazz). In the Stop case, if you fail to yield, I simply stop. My intention ("Cross safely") is *not* frustrated; I achieve safety by waiting. In Jazz, if you stop, *we* are not playing. My intention is frustrated. This clause captures the difference between *accommodating* another's action and *participating* in it.

  ### (c) The New Cases

  **1. Human and Language Model Co-writing**
  *   **Verdict:** Not Joint Action.
  *   **Reasoning:** Fails Clause 2 (Agency Reliance). The model has no intentions. It generates tokens based on weights, not agency. The human may *treat* it as an agent, but the principle requires *each participant* to rely on agency. Since one relata is missing, the "Interdependence" is asymmetrical. It is tool use, however sophisticated.
  *   **Implication:** This rules out "hybrid" collectives. If your students argue that the human-LLM dyad *feels* like joint action, your principle forces them to admit it is a category error.

  **2. Correspondence Chess Players (Suspecting Bots)**
  *   **Verdict:** Not Joint Action.
  *   **Reasoning:** Fails Clause 1 (Plural Content). If Player A suspects Player B is a program, A does not intend "We play chess." A intends "I play against a mechanism." Even if B is actually human, the *content of A's intention* lacks the "We." Joint action is constituted by the intentional stance, not the metaphysical reality.
  *   **Implication:** This makes joint action epistemically fragile. It suggests that joint action can dissolve secretly without behavioral change, simply through a shift in belief about the other's agency.

  ### (d) Honest Accounting of Mismatches

  **The Mismatch:** Case 3 (Four-Way Stop).
  *   **The Tension:** Your verdict is "Not joint action." My principle agrees. However, there is a strong intuition in the literature (and perhaps in your students' pushback) that the Stop case is *borderline*. It involves mutual knowledge and mutual responsiveness.
  *   **The Conflict:** Some theories (e.g., Bratman's earlier work on mutual responsiveness) might classify the Stop case as a primitive form of shared intentionality. Your verdict (and my principle) draws a harder line.
  *   **Decision:** **Keep the Verdict.** If we classify the Stop case as joint action, the concept becomes too broad to do normative work. We cannot hold the drivers *collectively responsible* for the traffic flow in the same way we hold the jazz duo responsible for the music. The "Mutual Vulnerability" clause protects this distinction. In the Stop case, I am not vulnerable to your *agency*, only your *behavior*.

  **The Mismatch:** Case 7 (Coerced Carrying).
  *   **The Tension:** Your verdict is "Joint action, though miserable." My principle accommodates this, but barely. The coerced person intends "We carry" only instrumentally (to avoid punishment).
  *   **The Conflict:** If the coercion is total (physical manipulation), it's not action at all. If it's mere threat, it is action. The line is thin.
  *   **Decision:** **Keep the Principle.** The principle correctly identifies that the *structure* of the intention is plural ("We"), even if the *motivation* is external. This preserves the insight that joint action does not require shared *enthusiasm*, only shared *commitment* to the success conditions.

  ### (e) Meta-Analysis: Criterion, Line, or Gradient?

  **Criterion for Joint Action or Shared Intention?**
  This is a criterion for **Joint Action**, but it operates by diagnosing the underlying **Shared Intention**. You cannot have the action without the intentional state described in the clauses. However, it is not merely a criterion for the mental state; it requires the *enactment* of that state in interdependent behavior (Clause 2). It bridges the gap: the intention must be of a type that *requires* the other's agency to be satisfied.

  **Line or Gradient?**
  The principle draws a **Line**.
  *   Either the satisfaction conditions are plural or they are not.
  *   Either you rely on agency or you rely on causality.
  *   Either your success is vulnerable to my intention or it is not.

  **However,** the principle admits a **Gradient of Robustness**.
  Case 1 (Friends) and Case 4 (Jazz) are robust joint actions (high interdependence, high agency reliance). Case 7 (Coercion) is a fragile joint action (high interdependence, low volitional alignment). Case 3 (Stop) is *outside* the line.

  **Pedagogical Warning:**
  Your students will want to argue that the Line is arbitrary. They will say, "Why isn't the Stop case a *weak* joint action?"
  **Your Reply:** Because "Weak joint action" implies the same *kind* of normativity as strong joint action, just less of it. But the Stop case involves different *kinds* of norms (traffic laws vs. performance norms). The Principle of Interdependent Success Conditions protects the distinctiveness of the "We." If you allow a gradient that includes the Stop case, you lose the ability to explain why the Jazz duo can blame each other for a bad note, while the drivers cannot blame each other for a safe delay.

  **Summary for the Seminar:**
  The principle forces students to see that "Joint Action" is not about *coordination* (Case 2 & 3 have that). It is not about *numbers* (Case 5 & 6). It is not even about *willingness* (Case 7). It is about the **structure of the goal**. If my goal can be satisfied without your agency (I cross safely even if you stall), we are not acting together. If my goal dies when your agency withdraws (We play music), we are.
