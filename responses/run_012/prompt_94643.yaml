answer: |-
  You hold a non-transferable voucher redeemable for a standard bundle of leisure goods worth one month's income. You may redeem it immediately for Bundle A, or seal it to redeem in exactly twenty years for Bundle B. Bundle B contains the exact same goods as Bundle A, plus one additional grape. Your survival to redemption is medically certain, the goods will not degrade, and no financial instruments exist to bridge the temporal gap. You cannot alter your consumption path otherwise; this is an isolated choice between immediate enjoyment and delayed, slightly larger enjoyment.

  (a) Option 1 provides utility $U$ now; Option 2 provides $U + \epsilon$ in twenty years. Zero pure time preference prescribes choosing Option 2, since any gain outweighs delay. Almost everyone refuses this, choosing Option 1, including many defenders of zero pure time preference. A small positive rate (e.g., 1%) prescribes Option 1, as the discounted value of $\epsilon$ is negligible. The verdict flips at the rate $r$ where $(1+r)^{20} = (U+\epsilon)/U$. Given $\epsilon$ is one grape, $r$ is microscopic (approximately 0.0005% annually).

  (b) The single feature doing the work is the marginal superiority of the future bundle (the grape). If removed, making the bundles identical, zero pure time preference prescribes indifference rather than a specific action. The counter-intuitive prescription vanishes, leaving only a conflict over valuation metrics, not forced choice.

  (c) The strongest reply denies this exhibits pure time preference, arguing the reluctance to wait reflects the option value of liquidity for unforeseen emergencies, not temporal bias. This is plausible in reality, as holding resources offers security. However, it fails here. The scenario stipulates survival and consumption paths are fixed and risk-free, neutralizing the instrumental value of liquidity. The resistance remains purely about temporal position, successfully isolating pure time preference.
