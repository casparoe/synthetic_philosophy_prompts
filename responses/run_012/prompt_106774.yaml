prompt: |-
  So I'm a senior and I'm the student rep on my school's Honor Committee, which basically means I sit in on the meetings and then write up the opinion we circulate afterward, and I have to have this one done before next Tuesday. Here's the mess: a girl in my grade, Dana, reported that four kids in her chem class had a group chat where they traded answers on the final. The thing is, Dana got caught cheating herself sophomore year — she got a warning and it kind of got swept under the rug — and a bunch of people think she only turned them in because she's applying to colleges and wants the teacher to like her. Now half the committee says it doesn't matter, cheating is cheating, and the other half says a known cheater has no business bringing a case at all, like she gave up the right to complain. And then the weird part, which is that our honor code is super selectively enforced — the lacrosse team had a whole shared-Quizlet thing last year and nothing happened — so one person on the committee said we can't punish these four when the school itself only enforces the rule when it feels like it.

  What I want is a short written opinion I can hand out at the meeting that recommends one concrete thing for us to do (punish / don't punish / punish plus do some other stuff) with an actual timeline, and that takes the strongest version of the losing side seriously instead of just saying rules are rules. But the part I really care about, and I dont have the vocabulary for it, is that everyone keeps sliding between two totally different questions: whether what the four kids did was wrong, and whether a specific person or a specific school is in a position to be the one calling it out. Those feel related but they're definately not the same, and I want the memo to keep them apart. My own half-baked take is that Dana's history shouldn't change the four kids' punishment at all but should change what the school does about Dana, and that the school's own track record has to get dealt with somehow — maybe the committee asks for a report on past cases before it rules. Can you write it? Like two pages, in a voice that sounds like a real school document but not like a robot wrote it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
