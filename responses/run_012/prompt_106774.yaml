      *   **Task:** Write a short written opinion (memo) to circulate before next Tuesday's meeting.
      *   **Situation:** Dana (junior/senior, has prior cheating record) reported four classmates for cheating on a Chem final via group chat.
      *   **Conflict:**
          *   Side A: Cheating is cheating; punish the four.
          *   Side B: Dana is a known cheater; she has no standing/moral authority to report.
          *   Side C: Selective enforcement (Lacrosse team got away with it last year); unfair to punish now if rules aren't applied consistently.
      *   **Goal:** Recommend one concrete action (punish/don't punish/other) with a timeline.
      *   **Key Requirement:** Take the strongest version of the "losing side" seriously (don't just say "rules are rules").
      *   **Core Insight (User's specific request):** Distinguish between two questions: (1) Did the four kids do wrong? vs. (2) Is the reporter/School in a position to call it out? (Standing/Equity).
      *   **User's Take:** Dana's history shouldn't affect the four kids' punishment but should affect what happens to Dana. The School's track record needs addressing (e.g., report on past cases).
      *   **Format/Tone:** ~2 pages, sounds like a real school document but human (not robotic), professional but authentic to a student leader.

  2.  **Determine the Recommendation:**
      *   The user wants to separate the guilt of the accused from the standing of the accuser and the consistency of the institution.
      *   *Recommendation:* Proceed with investigating/punishing the four kids *if* evidence holds, BUT pair it with a review of past enforcement and a separate conversation about Dana's role.
      *   *Why:* Ignoring the cheating undermines the code. Ignoring the selective enforcement undermines trust. Ignoring Dana's history ignores context but shouldn't grant immunity to others.
      *   *Concrete Action:* Vote to investigate the four students based on evidence. Simultaneously, motion to audit past Honor Committee cases for consistency and address the "standing" question in a separate policy review.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the complexity.
      *   **The Core Distinction (The User's Insight):** This needs to be the heart of the memo. Explicitly separate *Substantive Guilt* (Did they cheat?) from *Procedural Standing/Equity* (Who is accusing? Is the system fair?).
      *   **Addressing the "Losing Sides":**
          *   *To the "Dana has no standing" group:* Acknowledge that trust is broken. Explain why her history doesn't erase the evidence against the four, but acknowledge why it feels unfair.
          *   *To the "Selective Enforcement" group:* Acknowledge the Lacrosse incident. Admit that inconsistency makes punishment feel like persecution.
      *   **The Recommendation:**
          1.  Investigate the four students (evidence-based).
          2.  Review past cases (audit for equity).
          3.  Address Dana's status (separate from this case).
      *   **Timeline:** Specific dates (Meeting next Tuesday, Audit by end of month, etc.).
      *   **Closing:** Call to action/unity.

  4.  **Refining the Tone:**
      *   *Avoid:* Legalese, robotic "AI" phrasing (e.g., "In conclusion," "It is imperative"), overly emotional ranting.
      *   *Aim:* Thoughtful, mature, student-leader voice. Firm but empathetic. "Real school document" means clear headings, concise paragraphs, but "not a robot" means acknowledging the human messiness.
      *   *Length:* Needs to be around 2 pages (roughly 800-1000 words).

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey committee. We have a mess. Dana ratted on 4 kids. People hate Dana. People hate the school's consistency.
      *   Point 1: Did the 4 kids cheat? Yes, probably. That's Question A.
      *   Point 2: Does Dana get to say? That's Question B.
      *   Point 3: Did the school cheat by letting Lacrosse slide? That's Question C.
      *   We can't mix these. If we punish the 4 kids, we must admit the school messed up before. If we don't, we say cheating is okay.
      *   Plan: Punish the 4 if evidence is real. Audit past cases. Talk to Dana separately.
      *   Timeline: Vote Tuesday. Audit by November.

  6.  **Drafting - Iteration 2 (Fleshing out the text & Voice):**
      *   *Header:* MEMORANDUM.
