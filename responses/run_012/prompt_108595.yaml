answer: |-
  **Final Exam: Logic and Strategic Interaction**
  **Unit: Program Equilibrium**
  **Time Allowed: 90 Minutes**
  **Total Marks: 20**

  **Question 1**

  Consider a one-shot Prisoner's Dilemma with payoffs: mutual cooperation (3, 3), mutual defection (1, 1), unilateral defection (5, 0). In the program equilibrium meta-game, players submit programs that receive the opponent's source code as input and return a move. A profile is an equilibrium if neither player can submit a different program to gain a higher payoff against the opponent's program.

  Consider the "Prover" agent defined relative to a formal system $S$. Against an opponent $x$, Prover returns *Cooperate* if and only if $S$ proves the sentence "$x$ returns *Cooperate* when run on Prover's source." Otherwise, it returns *Defect*. Assume $S$ is recursively axiomatized and strong enough to formalize program execution. You are given Löb's theorem: for any sentence $\phi$, if $S$ proves that "the provability of $\phi$ in $S$ implies $\phi$", then $S$ proves $\phi$.

  Write an essay addressing the following three points:
  1.  Reconstruct why two Provers cooperate with each other. Identify precisely why this succeeds where simple conditional reasoning or simulation fails.
  2.  Determine whether the (Prover, Prover) profile is a Nash equilibrium. Check for profitable deviations and state exactly which logical property of $S$ is required to guarantee no deviation exists.
  3.  Determine whether the agents, operating within $S$, can establish that $S$ possesses this property.

  Conclude with a definite verdict: Does program equilibrium show that rational agents can cooperate in a one-shot Prisoner's Dilemma without enforcement, or does it relocate the problem into an assumption the agents cannot certify?

  ***

  **Model Answer**

  The Prover agent achieves mutual cooperation through a logical shortcut that bypasses the infinite regress of simulation and the circularity of naive conditional reasoning. If a Prover simulates an opponent simulating it, the process never halts. If a Prover reasons "I will cooperate if you cooperate," the logic is circular because the opponent's move depends on the Prover's move. The Prover agent avoids this by reasoning about *provability* rather than truth or execution.

  When Prover faces Prover, each searches for a proof in $S$ that the other cooperates. Let $C$ be the sentence "Prover returns Cooperate." By the agent's definition, $C$ is true if and only if $S$ proves $C$. The agent effectively checks if $S \vdash \text{Prov}_S(\ulcorner C \urcorner) \to C$. Since the agent cooperates exactly when $S$ proves the opponent cooperates, the sentence $C$ is logically equivalent to $\text{Prov}_S(\ulcorner C \urcorner)$. Consequently, the implication $\text{Prov}_S(\ulcorner C \urcorner) \to C$ is a tautology within the system. By Löb's theorem, if $S$ proves this implication, $S$ proves $C$. Since the implication is logically valid, $S$ proves it, and therefore $S$ proves $C$. Both agents find the proof and cooperate. This succeeds because it shifts the object of analysis from the physical output of the code to the formal derivability of a statement about that output.

  To determine if (Prover, Prover) is a Nash equilibrium, we must check if a player can profitably deviate. Suppose Player 1 plays Prover and Player 2 deviates to "DefectBot," which always defects. Player 1 (Prover) searches for a proof that DefectBot cooperates. Since DefectBot never cooperates, the sentence "DefectBot cooperates" is false. For Player 1 to defect (securing the equilibrium payoff of 1 rather than the sucker's payoff of 0), $S$ must *not* prove this false sentence. If $S$ were to prove that DefectBot cooperates, Player 1 would cooperate, and Player 2 would gain 5. Therefore, for (Prover, Prover) to be an equilibrium, $S$ must not prove false statements of this type. This requires $S$ to be **sound** (specifically 1-consistent), not merely consistent. Mere consistency ensures $S$ does not prove a contradiction, but soundness ensures $S$ does not prove falsehoods. If $S$ is unsound, it might prove DefectBot cooperates when it does not, breaking the equilibrium.

  Can the agents establish that $S$ is sound? The agents are implemented within $S$; their reasoning is bounded by what $S$ can prove. By the second incompleteness theorem, a sufficiently strong formal system cannot prove its own consistency. Since soundness implies consistency, $S$ cannot prove its own soundness. The agents can verify that *if* $S$ is sound, cooperation occurs, but they cannot verify the antecedent. They must assume the reliability of their own logical framework without internal justification.

  **Verdict:** Program equilibrium does not show that rational agents can cooperate without enforcement; it relocates the problem. The enforcement is replaced by a reliance on the soundness of the formal system $S$. Since the agents cannot certify this soundness within the system they inhabit, the cooperation rests on an external assumption that the agents themselves cannot validate. The strategic uncertainty is not eliminated; it is transformed into logical uncertainty about the reliability of the reasoning engine itself.

  ***

  **Marking Scheme**

  **Total Marks: 20**

  **1. Reconstruction of Self-Cooperation (6 Marks)**
  *   **Must-Hit:** Explanation of how Löb's theorem resolves the circularity (2 marks).
  *   **Must-Hit:** Contrast with simulation (infinite regress) and conditional reasoning (circularity) (2 marks).
  *   **Must-Hit:** Clear statement that the agent proves the *provability* implies the *action*, triggering Löb's condition (2 marks).
  *   *Typical Miss:* Students claim simulation works if given a time limit, or claim the agents "trust" each other without referencing the proof structure.

  **2. Equilibrium and Deviation Analysis (6 Marks)**
  *   **Must-Hit:** Identification of a specific deviation (e.g., Unconditional Defect) (2 marks).
  *   **Must-Hit:** Analysis of Prover's response to the deviation (Prover must defect to maintain equilibrium) (2 marks).
  *   **Must-Hit:** Identification that Prover defects only if $S$ does not prove the false claim that the deviator cooperates (2 marks).
  *   *Typical Miss:* Students assume Prover automatically defects against DefectBot without analyzing what Prover *proves*.

  **3. Logical Property of S (4 Marks)**
  *   **Must-Hit:** Identification that **Soundness** (or 1-consistency) is required, not just consistency (2 marks).
  *   **Must-Hit:** Explanation that consistency allows for false provable statements in some contexts, whereas equilibrium requires false cooperation claims remain unprovable (2 marks).
  *   *Typical Miss:* Identifying "Consistency" as the sufficient property. (This is the primary B-grade error).

  **4. Certifiability and Verdict (4 Marks)**
  *   **Must-Hit:** Statement that $S$ cannot prove its own soundness/consistency (2 marks).
  *   **Must-Hit:** Definite verdict that the problem is **relocated**, not solved (2 marks).
  *   *Typical Miss:* Hedging the verdict (e.g., "It depends on one's view of truth") or claiming agents can verify consistency via external means.

  **A/B Boundary**
  *   **B Answer:** Correctly identifies that $S$ must be **consistent** to prevent the Prover from being exploited, and notes that $S$ cannot prove its own consistency.
  *   **A Answer:** Correctly identifies that $S$ must be **sound** (or 1-consistent) because mere consistency does not guarantee $S$ won't prove the specific falsehood that "DefectBot Cooperates," and explicitly links the inability to prove soundness to the verdict that the problem is relocated. The A answer distinguishes between "not proving a contradiction" and "not proving a falsehood."
