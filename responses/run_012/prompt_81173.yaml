      *   **Answering Question 2 (What the play adds):**
          *   The *Third-Person Demand*. James/Clifford focus on "What may *I* believe?" Ibsen asks "What may I make *you* confront?"
          *   The *Material Cost of Truth*. In epistemology, error is a mistake. In the play, error is a livelihood/relationship.
