          *   The play punishes the *manner* (coercive transparency) but also suggests the *content* (the lie) was toxic (Hjalmar was a narcissist regardless).
          *   Actually, the play suggests Clifford's *social* worry was right (beliefs have consequences), but Gregers is a bad Cliffordian.
