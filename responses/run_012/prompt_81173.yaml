  7.  **Final Polish:** Check against the "No citations" rule. Ensure the two specific questions are answered directly. (Proceed to generate output based on these thoughts).

      *   *Key Insight to weave in:* The "Life-Lie" is not a belief proposition; it's a structural support. Removing it isn't correcting a data point; it's pulling a load-bearing wall.
