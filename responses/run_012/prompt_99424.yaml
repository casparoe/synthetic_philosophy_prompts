prompt: |-
  I'm supervising a grad student whose chapter draft keeps leaning on the same move: culture evolves by natural selection, memes are the cultural analogue of genes, so when a belief or a tune or a fashion spreads and sticks it's because it got selected for, and it can spread even when it's bad for the people carrying it — Dawkins's old point that the meme doesn't care about the host. He's got the standard cites (the 1976 book where Dawkins coins the thing, Blackmore's The Meme Machine) and he treats the analogy as if it's already been earned. I don't think it's that simple, but I also don't want to just say "culture is more complicated." Can you audit the analogy properly?

  What I want: a correspondence table first — what's supposed to map onto the gene, the genotype/phenotype distinction, the mutation rate, the selection pressure, drift, recombination, the germ-line/soma wall, species boundaries. Then the places the mapping actually breaks, and be honest about which breaks are fatal versus merely untidy. Some of the obvious candidates: copying fidelity, whether cultural "units" are even discrete, whether there's any clean vehicle/replicator split, whether inheritance is blending or particulate, whether it's Lamarckian (acquired stuff gets passed on directly), and the fact that a lot of transmission is reconstructive rather than replicative — the Sperber / cultural-attraction crowd make a lot of that last one, and I'd like you to say whether it kills the meme-as-replicator picture outright or just narrows it to a few special cases.

  Then the part I actually care about: the student's conclusion is that cultural change is Darwinian all the way down, and that this explains why harmful things spread. Does the analogy carry that, or was the conclusion riding on the analogy the whole time? Which disanalogies are load-bearing for that specific claim, and which ones don't matter for it? And if the meme frame is the wrong one, what's the better frame — the epidemiology-of-representations thing, dual-inheritance models, something else — and what does the better frame predict differently about, say, why a costly religious practice persists?

  Skip the bibliography, I know the literature — give me the audit and tell me which single sub-question the whole thing hinges on.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Supervisor of a grad student.
      *   **Problem:** Student's draft relies heavily on the "memetics" analogy (culture = natural selection, memes = genes, Dawkins/Blackmore) to explain cultural evolution, specifically why harmful beliefs/practices spread.
      *   **Task:** Audit the analogy properly.
      *   **Specific Requirements:**
          1.  Correspondence table (Gene $\leftrightarrow$ Meme, Genotype/Phenotype, Mutation, Selection, Drift, Recombination, Germ-line/Soma, Species).
          2.  Identify breaks in the mapping (Fidelity, Discreteness, Vehicle/Replicator split, Blending vs. Particulate, Lamarckism, Reconstructive transmission/Sperber). Assess if breaks are fatal or untidy.
          3.  Address the student's specific conclusion (Cultural change is Darwinian all the way down $\rightarrow$ explains harmful spread). Does the analogy carry this? Which disanalogies are load-bearing?
          4.  Suggest better frames (Epidemiology, Dual-Inheritance, etc.) and how they predict differently (e.g., costly religious practice).
          5.  **Constraint:** Skip bibliography (user knows it).
          6.  **Crucial:** Identify the *single sub-question* the whole thing hinges on.

  2.  **Deconstruct the Memetics Analogy (The Audit):**
      *   *Goal:* Be rigorous but concise. No fluff.
      *   *Table:* Need to map biological concepts to cultural concepts as proposed by memetics, then note the reality.
      *   *Breaks:* Focus on the big ones: Fidelity, Discreteness, Lamarckism, Reconstructive transmission.
      *   *Sperber's Critique:* This is key. Cultural transmission is often transformation, not replication. Does this kill memetics? Yes, for the strong claim, no for weak analogies.

  3.  **Evaluate the Student's Conclusion:**
      *   *Claim:* Cultural change is Darwinian $\rightarrow$ Harmful things spread (selfish meme).
      *   *Analysis:* The "selfish meme" argument relies on the *replicator* status of the meme. If memes aren't replicators (due to low fidelity or reconstructive transmission), the "selfish" logic weakens. However, *selection* can still happen without strict replication (e.g., biased transmission).
      *   *Load-bearing Disanalogies:* Fidelity and the Replicator/Vehicle distinction. If there's no high-fidelity replication, there's no long-term accumulation of "selfish" adaptations in the meme itself independent of host benefit.
      *   *Alternative Explanations:* Harmful things might spread due to cognitive biases (epidemiology), group selection (dual-inheritance), or signaling costs (handicap principle), not just "meme selfishness."

  4.  **Identify Better Frames:**
      *   *Dual-Inheritance Theory (Boyd & Richerson):* Gene-culture coevolution. Allows for biased transmission, not just blind selection.
      *   *Cultural Attraction Theory (Sperber):* Focuses on transformation and cognitive attractors.
      *   *Epidemiology of Representations:* Treats ideas like viruses but focuses on cognitive susceptibility.
      *   *Prediction Difference:* Memetics says the *practice* replicates because it's good at replicating (even if bad for host). Dual-Inheritance says it might persist because it signals group commitment (beneficial for group cohesion) or exploits a cognitive bias.

  5.  **Determine the "Single Sub-Question":**
      *   What is the pivot point? Is it fidelity? Is it discreteness?
      *   The core of the Darwinian algorithm is *heritability*. If the "inheritance" is reconstructive/transformational rather than replicative, the Darwinian mechanism changes fundamentally.
      *   *Candidate:* "Is cultural transmission replicative or reconstructive?"
      *   *Refinement:* "Does cultural transmission preserve *information* (replication) or transform *meaning* (reconstruction)?"
      *   *Best Fit:* The fidelity/replication threshold. Without high-fidelity replication, you don't have a Darwinian algorithm in the strict sense.
      *   *Decision:* The question of **fidelity vs. transformation**. (Or more precisely: *Is the unit of transmission a replicator or a attractor?*) Let's go with the replicator status hinges on fidelity.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Professional, direct, academic but accessible (supervisor-to-supervisor).
      *   *Section 1: The Correspondence Table.* Keep it tight.
      *   *Section 2: The Breaks.* Be honest. Fidelity is the big one. Lamarckism is the second.
      *   *Section 3: The Student's Conclusion.* Analyze the "Harmful Spread" claim. Memetics explains it via "parasitic replication." Alternatives explain it via "byproduct of adaptive cognition" or "group benefit."
      *   *Section 4: Better Frames.* Contrast Memetics with Dual-Inheritance and Attraction Theory.
      *   *Section 5: The Hinge Question.* Pinpoint the exact theoretical failure point.

      *(Self-Correction during drafting)*: Make sure I don't just say "Sperber is right." I need to explain *why* it matters for the "harmful practice" claim. If transmission is reconstructive, the "meme" isn't staying the same, so it can't be "selecting for its own spread" in the long term. It's being *chosen* by minds. That shifts agency from the meme to the host cognition.

      *(Refining the "Hinge Question")*: The student claims culture is Darwinian *all the way down*. The hinge is whether the *mechanism* is selection on replicators or selection on variants generated by transformation.
      *Let's formulate it as:* "Is cultural inheritance particulate/replicative or blending/reconstructive?"

  7.  **Final Polish:** Check against constraints. No bibliography. Ensure the table is clear. Ensure the "fatal vs. untidy" distinction is made. Ensure the "harmful practice" example is addressed.

      *Wait, one nuance:* The user asked about the "Germ-line/Soma wall." In biology, this protects genes from somatic changes. In culture, acquired traits *are* inherited (Lamarckism). This is a major break. I need to highlight that.

      *Re-evaluating the "Hinge":* The student's claim is about *harmful things spreading*. Memetics says: "Meme wins, Host loses." Dual Inheritance says: "Maybe Host wins at group level" or "Host cognitive bias makes it look like meme won."
      The hinge is actually: **Does the unit of selection have independent fitness from the host?**
      But that depends on the mechanism.
      Let's stick with the **Replicator vs. Reconstructor** issue. That determines if the Darwinian algorithm applies.

      *Final check on the "Single Sub-Question":* It needs to be punchy. "Is high-fidelity replication a prerequisite for Darwinian evolution?" is too broad. "Does cultural transmission preserve identity or transform content?" is better.
      Actually, the most load-bearing issue for the "harmful spread" claim is the **locus of agency**. Is the meme driving, or is the host's cognition driving?
      Okay, I will frame the hinge question around **Fidelity/Replication** because that validates the "Darwinian Algorithm" claim.

      *Let's write it.*
answer: |-
  ### Part 1: The Correspondence Audit

  Here is the mapping your student is implicitly using, followed by the structural integrity of each link.

  | Biological Concept | Memetic Analogue (Student's Model) | Status of Mapping |
  | :--- | :--- | :--- |
  | **Gene** | **Meme** (idea, tune, practice) | **Untidy.** Genes are physical sequences; memes are ill-defined semantic units. |
  | **Genotype** | **Mental Representation** (memory of the meme) | **Fatal.** No clear separation between the "code" and the "expression." |
  | **Phenotype** | **Behavior/Artifact** (singing the tune, wearing the fashion) | **Untidy.** Behavior is often the transmission vector *and* the expression. |
  | **Mutation** | **Innovation/Error** (misremembering, remixing) | **Untidy.** In culture, "mutation" is often intentional or systematic, not random. |
  | **Selection Pressure** | **Social/Cognitive Bias** (popularity, utility, shock value) | **Valid.** Differential retention exists, but the *source* of selection differs. |
  | **Drift** | **Fashion/Random Fluctuation** | **Valid.** Small populations of adopters show stochastic effects. |
  | **Recombination** | **Syncretism/Remixing** | **Valid.** Cultural traits blend frequently. |
  | **Germ-line/Soma Wall** | **None** (Lamarckian Inheritance) | **Fatal.** Acquired characteristics (modifications during a lifetime) are directly inherited. |
  | **Species Boundaries** | **Subcultures/Language Groups** | **Untidy.** Barriers are porous; horizontal transmission dominates vertical. |
  | **Replicator** | **The Meme** | **Fatal.** (See Part 2). |
  | **Vehicle** | **The Human Host** | **Fatal.** Humans are not passive vehicles; they actively reconstruct content. |

  ### Part 2: Where the Mapping Breaks (Fatal vs. Untidy)

  **1. Copying Fidelity (Fatal)**
  Biological evolution requires high-fidelity replication to accumulate complex adaptations over time. Cultural transmission is low-fidelity. When I tell you a story, you do not copy it; you reconstruct it based on your own cognitive schemas.
  *   **Verdict:** If fidelity drops below a certain threshold, the "Darwinian Algorithm" (variation, selection, *retention*) collapses. You get evolution, but not necessarily *Darwinian* evolution by natural selection on replicators.

  **2. Discreteness of Units (Fatal)**
  Genes are (relatively) discrete. Memes are not. Where does one "meme" end and another begin? Is "Christianity" a meme? Is "The Lord's Prayer" a meme? Is "Belief in Heaven" a meme?
  *   **Verdict:** Without discrete units, you cannot calculate fitness differentials between specific replicators. The "selfish meme" argument requires a unit that can be tracked across generations.

  **3. The Germ-line/Soma Wall / Lamarckism (Fatal)**
  In biology, changes to the soma (body) during life do not affect the germ-line (genes). In culture, changes made during a lifetime *are* what get passed on.
  *   **Verdict:** This makes cultural evolution Lamarckian. While evolution can still occur, the mechanism is not strictly Darwinian selection on random variation. It is guided variation. This undermines the "blind watchmaker" aspect of the student's argument.

  **4. Reconstructive Transmission (Sperber's Critique) (Fatal)**
  Dan Sperber argues that cultural transmission is not replicative (copying) but transformative (inferring). We catch ideas like viruses, but the virus mutates *inside* the host to fit the host's cognitive immune system.
  *   **Verdict:** This kills the "Meme-as-Replicator" model. If the content changes to fit the host, the host's cognition is the selector, not the meme's intrinsic replicative power. The agency lies with the psychology, not the meme.

  **5. Blending vs. Particulate Inheritance (Untidy but manageable)**
  Biology is particulate (you get allele A or B). Culture is blending (you get a mix of A and B).
  *   **Verdict:** This makes modeling harder (regression to the mean), but evolutionary models can handle blending inheritance. It weakens the analogy but doesn't kill it.

  ### Part 3: The Student's Conclusion (Harmful Practices)

  **The Claim:** Harmful practices persist because the *meme* benefits from spreading, even if the *host* suffers (e.g., celibacy, dangerous rites).
  **The Audit:** This conclusion is riding entirely on the **Replicator/Vehicle** distinction.

  *   **If the Memetic Frame holds:** The practice is a parasite. It hijacks host machinery to replicate itself at host expense. The "harm" is collateral damage.
  *   **If the Memetic Frame breaks (due to low fidelity/reconstruction):** The practice persists *because* it appeals to host psychology, even if it is physically costly. The "harm" might be a side effect of a cognitive adaptation (e.g., a costly signal that builds group trust).

  **Load-Bearing Disanalogies for this Claim:**
  1.  **Fidelity:** If transmission is reconstructive, the "meme" isn't staying the same. It isn't a single entity fighting for survival. It is a recurring pattern generated by human minds.
  2.  **Agency:** In memetics, the meme has "agency" (metaphorically). In cognitive epidemiology, the *human mind* has agency. If the mind is reconstructing the idea, the idea spreads because it fits the mind, not because it outcompeted other ideas independently.

  **Does the analogy carry the conclusion?**
  No. The conclusion that "harmful things spread *because* they are selfish replicators" is a non-sequitur if the transmission mechanism is reconstructive. A harmful thing might spread because it is a **byproduct** of a useful cognitive heuristic (e.g., hyper-active agency detection leads to belief in punishing gods), not because the belief itself is a replicator fighting for its life.

  ### Part 4: Better Frames and Predictive Differences

  **1. Dual-Inheritance Theory (Boyd & Richerson)**
  *   **Frame:** Genes and culture co-evolve. Transmission is biased (conformist bias, prestige bias).
  *   **Prediction on Costly Religious Practice:** It persists not because the *idea* is selfish, but because it solves a **coordination problem**. Costly signals filter free-riders, allowing the *group* to outcompete other groups (Group Selection).
  *   **Difference:** Memetics says the *practice* wins. Dual-Inheritance says the *group* wins, and the practice is the mechanism.

  **2. Cultural Attraction Theory (Sperber)**
  *   **Frame:** Ideas transform to fit cognitive "attractors" (innate biases). Transmission is epidemiological.
  *   **Prediction on Costly Religious Practice:** It persists because it triggers **counter-intuitive ontology** (memorable) combined with **coalitional psychology** (us vs. them). The "harm" is irrelevant; the cognitive stickiness is key.
  *   **Difference:** Memetics says the meme manipulates the host. Attraction Theory says the host's cognition transforms the meme to be memorable.

  **3. Signaling Theory (Handicap Principle)**
  *   **Frame:** Costly behaviors are honest signals of commitment.
  *   **Prediction on Costly Religious Practice:** The harm *is the point*. If it weren't costly, it wouldn't work.
  *   **Difference:** Memetics views the cost as a bug (host damage). Signaling Theory views the cost as a feature (credibility).

  ### Part 5: The Hinge Question

  The entire argument hinges on a single empirical and theoretical sub-question:

  **"Is cultural transmission primarily *replicative* (preserving information identity) or *reconstructive* (transforming information to fit cognitive biases)?"**

  *   **If Replicative:** The student is right. Memes act as independent replicators, and the "selfish meme" explanation for harmful practices is viable.
  *   **If Reconstructive:** The student is wrong. The "meme" has no independent fitness. The persistence of harmful practices must be explained by host-level psychology (biases), group-level benefits (cooperation), or signaling dynamics, not by the "selfishness" of the cultural unit.

  Current evidence (psychology of memory, transmission chain experiments) heavily favors **Reconstructive**. Therefore, the student's Darwinian-all-the-way-down claim is unsupported by the mechanism they are invoking.
