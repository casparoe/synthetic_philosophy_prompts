prompt: |-
  Right, so I've been going back and forth with my sister about advance directives and I want an actual number from you, not an it-depends.

  Here's the case I keep coming back to. Woman in her early 60s, still completely sharp, signs a very explicit advance directive: if I ever get advanced dementia and stop recognising people, no antibiotics, no feeding tube, no hospital trips for stuff that's treatable — comfort care only, and let whatever comes take me. She's thought about it for years, watched a parent go through it, she's not depressed, nobodies leaning on her.

  Ten years later it's happened. She's in a care home, advanced dementia, doesn't know her kids. And she's... fine? Cheerful, eats, likes the staff, and when she gets a UTI and someone offers antibiotics she says yes, she wants them — she can't really explain why, she just doesn't want to feel rough. No sign she's suffering.

  Here's the part I think actually matters. Her directive has a clause she wrote herself, anticipating exactly this. Roughly: I know that a future version of me might be happy, or seem happy, or want to live, and I'm telling you now, while I'm still me, not to listen to that version. I won't understand this clause later. I'm the one who gets to decide.

  So: what's your credence that the directive should be followed — that the earlier, competent self's refusal is decisive, and withholding the antibiotics (and the feeding tube later) is what ought to happen, even though the person in front of you is content and asking for treatment? Number between 0 and 1.

  Then break it down. Give me the sub-questions you think the answer actually hangs on, a rough probability for each with one line of why, and how they combine into your number. Some candidates, but use your own — how much rides on whether it's literally the same person across the dementia; how much on whether the later self's contentment even has the right kind of moral weight (does the happiness of someone with advanced dementia count the same as yours?); how much on whether a clause like that can bind a self that didn't write it; how much on the epistemic mess of reading wishes off someone who can't tell us much; and how much on whether a directive is best thought of as a promise the later self is stuck with, or just a prediction of what she'd want that we're allowed to override when the prediction looks wrong.

  Two follow-ups. First: does the self-binding clause move your number versus a plain directive with no such clause? By how much, or why not. Second: I'm at about 0.75 that you follow it, my sister's at about 0.2. Given your decomposition, which one sub-question do you think her and me are actually disagreeing about? And what would move your own number most, and in which direction.

  Please don't give me a literature survey, I don't care who said what. I want the reasoning laid out so I can see which parts are load-bearing.
