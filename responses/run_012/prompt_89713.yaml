      *   Okay, so the friend *describes* the standard view correctly (FDT refuses XOR) but then *concludes* the opposite in his summary ("pay the termite guy"). This is a massive inconsistency. I must point this out. It suggests he doesn't actually understand *why* FDT refuses XOR, he just knows the "answer key" but tries to fit it into his "Acausal = Sucker" narrative.

