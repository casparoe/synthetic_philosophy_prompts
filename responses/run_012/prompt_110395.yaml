answer: |-
  You have described a phenomenon that is familiar to anyone who has tried to teach ethics through literature, yet it resists the standard categories of both literary theory and moral philosophy. You are right to feel that the existing landmarks are close but miss the specific topography of your classroom. The "Heresy of Paraphrase" concerns truth and meaning; your concern is *force* and *change*. Moral particularism concerns the ontology of reasons; your concern is the *pedagogy of transformation*. Imitation concerns the replication of acts; your concern is the *unsettling of the self*.

  To answer your diagnostic questions first: This is one phenomenon, not two. The epistemic and the motivational are fused here. The particular does not merely move us to pursue a good we already know (motivational); it discloses the good in a way that abstract knowledge cannot (epistemic). When you extract the principle, you do not just lose the engine; you lose the map. The student is left with a label ("courage") that no longer points to the reality they encountered in the text.

  A life that generalizes cleanly and still moves people would not necessarily falsify the pattern, provided that the "generalization" functions rhetorically as a particular (e.g., a specific turn of phrase, a specific voice) rather than as a true universal. However, if a bare principle ("One ought to tell the truth") moved a student to action with the same depth as the story of the letter-burning, *that* would falsify the pattern. It would suggest the particular was merely decorative. I suspect you will not find this case.

  Here is how your observation differs from the neighbours you identified:
  1.  **Stories vs. Arguments:** This claims narratives are more *persuasive*. Your pattern claims narratives are *constitutive* of the moral knowledge itself. An argument can be persuasive while remaining external; your students are "undone" internally.
  2.  **Moral Particularism:** This claims there *are no* true moral principles. Your pattern allows that principles may be true, but asserts they are *inert* when detached from the soil of the instance.
  3.  **Imitation:** This implies copying the deed. Your students cannot copy the deed (they cannot burn the same letter); they are changed by the *texture* of the deed.

  Since no established term captures this specific resistance of the moral particular to abstraction without loss of power, I offer you a carved name.

  ### The Law of Moral Incompressibility

  **Definition:**
  The Law of Moral Incompressibility states that the motive force required for moral transformation is bound to the specific, ungeneralized texture of the narrative instance; any attempt to compress this narrative data into a universal principle results in the evaporation of the force necessary to effect change.

  **The Carving:**
  Just as a gas cannot be compressed into a liquid without a change in state and temperature, a moral life cannot be compressed into a maxim without a loss of ethical energy. The "lesson" is not a seed hidden inside the fruit; it is the flavour of the fruit. To distil the flavour is to lose the nourishment.

  **What It Rules Out:**
  1.  **The Wrapper Theory:** It rules out the idea that the story is merely a sugary coating to help the pill of the principle go down. Under this law, the story *is* the medicine.
  2.  **The Transferability of Virtue:** It rules out the assumption that moral insight gained from a life can be fully transferred to a student via a summary or a rule. The insight is non-fungible.
  3.  **The Teacher as Extractor:** It rules out your own impulse to "repair" the silence by stating the principle. Your extraction is not a clarification; it is an evacuation.

  **The Falsifying Case:**
  For this law *not* to apply, you would need to witness a student read a bare ethical imperative (stripped of narrative context, history, or particular detail), feel no emotional resonance, and yet undergo the same profound "undoing" and subsequent reorientation of character that they experience with the biography of the minor figure. If the principle alone can carry the weight of the life, the law is false. If the principle only moves when it recalls the story, the law holds.

  **Pedagogical Implication:**
  If this law holds, your role in the seminar is not to mine the lives for ore, but to preserve the integrity of the rock. You are not a refiner; you are a curator. When a student says, "I don't know what to do," and offers a platitude, the correct response is not to offer a better principle, but to return them to the detail: "Do not tell me what to do. Tell me again about the letter she burned." The moral work happens in the returning, not in the leaving.

  You asked for a name, but you cared more for the carving. The carving suggests that the silence you meet in your students is not a failure of comprehension, but a sign that the work is being done. The inability to generalize is the price of the transformation. To speak the lesson is to end the lesson.
