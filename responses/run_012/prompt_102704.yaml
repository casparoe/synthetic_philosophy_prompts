answer: |-
  You have described a precise systemic failure mode that sits at the intersection of economics, game theory, and community moderation. While there is no single, ubiquitous phrase that captures every nuance of your description, the phenomenon is a composite of several established concepts. The "gap" you sense is real: existing terms usually describe the *outcome* (loss of trust), the *incentive* (lack of cost), or the *statistics* (noise), but rarely the specific *sorting mechanism* you identified.

  Here is an analysis of the nearest neighbors, followed by a proposal for a term that fits your specific configuration.

  ### The Nearest Neighbors

  **1. Adverse Selection (The Closest Economic Fit)**
  In economics (specifically Akerlof's "Market for Lemons"), **Adverse Selection** occurs when one party in a transaction has information the other does not, leading to a pool of participants that is skewed toward high risk.
  *   **How it fits:** In your scenario, the "product" is the Alert. The "buyers" are the Community. The "sellers" are the Members. The community cannot distinguish a careful member from a reckless one *before* the alert is sent. Because the cost of sending is low, those with low judgment thresholds (high risk of false positives) "sell" alerts aggressively. Those with high judgment thresholds (low risk) withhold supply to avoid devaluing the currency.
  *   **Why it feels incomplete:** Adverse Selection is typically applied to markets (insurance, used cars). It describes the *pool*, but doesn't always emphasize the *behavioral sorting* caused by the *design of the tool* itself.

  **2. Moral Hazard (The Incentive Structure)**
  **Moral Hazard** occurs when an entity has an incentive to increase its exposure to risk because it does not bear the full costs of that risk.
  *   **How it fits:** The sender bears almost no cost for a false alarm. The accused and the community bear the cost. This insulation encourages the behavior.
  *   **Why it feels incomplete:** Moral Hazard explains *why* a specific person sends a reckless alert, but it doesn't fully explain why the *careful* people self-censor. It describes the sender's incentive, not the system's selection bias.

  **3. Gresham's Law (The Outcome)**
  **Gresham's Law** states that "bad money drives out good."
  *   **How it fits:** Bad alerts (false/exaggerated) drive out good alerts (accurate) because they inflate the supply of warnings, devaluing the "currency" of trust. Eventually, no one accepts the currency.
  *   **Why it feels incomplete:** This describes the *result* (the collapse of trust), not the *mechanism* (the sorting of actors).

  **4. The Vocal Minority (The Sociological Label)**
  This is a common phrase describing how a small, loud group can dominate the perception of a larger whole.
  *   **How it fits:** It captures the demographic reality.
  *   **Why it feels incomplete:** It is descriptive, not analytical. It doesn't explain *why* the system amplifies them or *how* the design facilitates it.

  ### The Gap and A Proposal

  The specific configuration you described—where **unilateral action rights structurally select for actors with lower judgment thresholds, thereby degrading the system's signal**—does not have a single canonical name in social science. It is usually discussed as a combination of the above.

  However, to capture the *sorting mechanism* you highlighted, I propose the term:

  ## **Participatory Adverse Selection**

  Alternatively, for a more descriptive label regarding the system design: **The Unilateral Selection Effect**.

  ### Definition and Boundaries

  **Participatory Adverse Selection** occurs when a system grants unilateral agency to a group, and the cost/benefit structure of that agency systematically attracts participants with lower thresholds for action (often correlated with lower accuracy) while deterring participants with higher thresholds.

  **Essential Conditions:**
  1.  **Unilateral Agency:** Any single actor can trigger a high-impact event without consensus or verification.
  2.  **Asymmetric Cost:** The cost of a false positive is borne primarily by the *receiver* or the *system* (trust depletion), not the *sender*.
  3.  **Heterogeneous Judgment:** The population contains a mix of "careful" (high threshold) and "reckless" (low threshold) actors.
  4.  **Self-Censorship of the Competent:** The "careful" actors recognize the systemic cost (flooding/trust erosion) and voluntarily abstain, while the "reckless" actors do not.

  **Is Irreversibility Required?**
  Strictly speaking, **no**, but it is a critical accelerator.
  *   If an alert can be instantly retracted with no trace, the *sorting* still happens (reckless people still post more), but the *damage* (trust erosion) is slower.
  *   However, for the "Boy Who Cried Wolf" collapse to occur, the *record* of the alert must persist long enough to degrade trust. So, while irreversibility isn't required for the *selection*, it is required for the *systemic failure*.

  **Is the Sorting Essential?**
  **Yes.** This is the core of the phenomenon.
  *   If actors were selected at random (e.g., a random member is chosen to send alerts), the signal-to-noise ratio would reflect the average competence of the group.
  *   If the "careful" members were the ones posting (e.g., a reputation-gated system), the signal would be high.
  *   The phenomenon exists *because* the freedom to act acts as a filter that preferentially selects the least reliable agents.

  ### Distinction from Nearest Neighbors

  *   **Vs. Adverse Selection:** Traditional Adverse Selection assumes hidden information about an *object* (e.g., this car is a lemon). Participatory Adverse Selection is about hidden information regarding the *agent's judgment* and how the system design exploits that variance.
  *   **Vs. Spam:** Spam implies malicious intent or financial gain. In your scenario, the senders believe they are right. This is **mistaken confidence**, not malice.
  *   **Vs. The Cry Wolf Effect:** The Cry Wolf Effect describes the *receiver's* desensitization. Participatory Adverse Selection describes the *sender's* composition that *causes* the desensitization.

  ### Summary
  You have identified a design flaw where **freedom of action functions as a negative filter on judgment.** While **Adverse Selection** is the formal economic term for the resulting pool of actors, **Participatory Adverse Selection** better captures the dynamic of voluntary, unilateral contribution leading to systemic degradation. It is a specific subtype of the **Tragedy of the Commons**, where the commons being depleted is **Epistemic Trust**.
