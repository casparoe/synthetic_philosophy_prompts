          *   *Status:* This is a *genuine*, well-known problem in decision theory (Pascal's Mugging). It's not a misunderstanding; it's a hard technical challenge.
          *   *Flatmate's Spin:* He treats it as a definitive refutation ("theory says you should abandon your life").
          *   *Counter:* Most EV theorists don't actually advocate abandoning life for lotteries. They modify the theory (bounded utility, probability thresholds, epistemic penalties).

