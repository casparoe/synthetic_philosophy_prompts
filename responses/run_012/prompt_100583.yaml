      *   *Infinity:* This is a category error. EV theory works on real numbers. If you put infinities in, you broke the preconditions, not the theory.
      *   *Conclusion:* The flatmate is wrong. EV is robust, but it's not a naive "calculate and click" algorithm for cosmic stakes.

