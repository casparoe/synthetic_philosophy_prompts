          *   *Counter:* Standard EV theory usually assumes bounded utility functions specifically to avoid this. Infinite values are a special case, not the default.

      *   **Claim 3: The Conclusion ("Nobody... takes expected value seriously").**
          *   *Status:* Factually false. EV is the foundation of economics, statistics, insurance, AI alignment, and effective altruism.
