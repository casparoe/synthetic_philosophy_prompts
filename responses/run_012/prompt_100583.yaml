answer: |-
  Your flatmate is arguing like someone who has read the abstracts of a few philosophy papers but hasn't engaged with the technical solutions. He is correctly identifying genuine paradoxes, but he is treating them as fatal refutations rather than engineering constraints.

  Here is the position of a careful defender of Expected Value (EV) theory. I am not going to hedge: **Your flatmate is wrong that the framework is incoherent or universally dismissed. He is right that naive EV maximization leads to absurdity, but wrong that sophisticated EV theory cannot solve it.**

  Here is the claim-by-claim breakdown of where he is accurate, where he is garbling results, and where he is flatly incorrect.

  ### 1. The Fanaticism Claim (Pascal's Mugging)
  **His Claim:** *For any action, there is a low-probability/high-payoff lottery that beats it. Therefore, EV theory demands you abandon your life to chase cosmic lotteries.*

  **The Verdict:** **Accept the logic, wince at the implication, reject the conclusion.**

  This is a genuine, standard objection known as **Pascal's Mugging**. The math is correct: if utility is unbounded, then for any finite cost, there exists a sufficiently large payoff that makes the EV positive, regardless of how small the probability is.

  However, his conclusion that "the theory says you should abandon your life" relies on a naive application of EV that serious theorists reject. A careful defender handles this in two ways:

  1.  **Epistemic Humility:** Probabilities are not just magic numbers you can stipulate. As the claimed payoff increases, the evidence required to justify the probability must increase commensurately. If someone claims they can affect a googolplex lives, the prior probability of them having that power is not just "low"; it is exponentially suppressed by the complexity of the claim. In a Bayesian framework, the probability drops faster than the utility rises. You don't need to change EV theory; you need to stop treating probabilities as independent of the hypothesis complexity.
  2.  **Bounded Utility:** This is the stronger defense. There is no reason to believe human value (utility) is unbounded. I would rather have a 50% chance of saving 1 billion lives than a 1% chance of saving 100 billion. If utility is bounded (there is a maximum possible "goodness"), the math of the mugging breaks. The googolplex payoff hits the ceiling, and the small probability can no longer outweigh the certain moderate good.

  **My Position:** Fanaticism is a **bullet to bite, but only halfway.** We should accept that low-probability, high-impact interventions (like pandemic preparedness or AI safety) are often *more* valuable than high-probability, low-impact ones (like buying a sandwich). That is a feature, not a bug. But the "googolplex" example fails not because EV is broken, but because the probability is epistemically unjustified or the utility function is unphysically unbounded. It is not a *reductio*; it is a boundary condition.

  ### 2. The Infinity Claim
  **His Claim:** *Once you let infinite values in, infinity minus infinity is undefined, so nothing can be compared. The framework collapses.*

  **The Verdict:** **Flatly reject the premise.**

  This is the strongest part of his math and the weakest part of his application. He is correct that standard arithmetic breaks with actual infinities ($\infty - \infty$ is indeed undefined). This is related to the **St. Petersburg Paradox** and problems in infinite ethics.

  However, EV theory does not *require* infinite values. In fact, standard decision theory (von Neumann-Morgenstern) explicitly assumes utility functions map to **real numbers**, not the extended real line including infinity. If a model produces an infinite expected value, the model is misspecified, not the theory.

  A careful defender says: "If your decision matrix contains an infinity, you have made a category error." We deal with very large finite numbers, not actual infinities. There are extensions of EV theory that handle infinite worlds (like using discount rates or spatial limits), but the core framework remains intact because it is designed for finite agents in a finite timeframe.

  **My Position:** This is a **strawman.** No serious practitioner plugs $\infty$ into an EV calculation and expects it to work. Pointing out that EV theory can't handle actual infinities is like pointing out that a standard ruler can't measure the curvature of spacetime. It's true, but it doesn't mean the ruler is broken for building a house.

  ### 3. The Consensus Claim
  **His Claim:** *Nobody who's actually thought hard about it takes expected value seriously.*

  **The Verdict:** **Factually false.**

  This is easily disproven. EV is the bedrock of:
  *   **Insurance and Finance:** Actuarial tables are pure EV.
  *   **Statistics:** Estimators are judged by expected loss.
  *   **Computer Science:** Reinforcement learning agents maximize expected reward.
  *   **Philosophy:** While *moral philosophers* debate the *inputs* (what counts as good), the *structure* of rational choice is overwhelmingly EV-based.

  The people who "think hard about it" (decision theorists, economists, AI researchers) spend their time refining the inputs and constraints (as above), not discarding the engine. They take the *objections* seriously, not the *dismissal*.

  ### Summary: The Careful Defender's Stance

  If you want to win this argument, do not defend "Naive EV" (calculate any number, do the thing). Defend **"Constrained EV."**

  Here is the position you should take:

  1.  **EV is the correct normative standard for rational choice.** There is no coherent alternative. If you aren't maximizing expected value, you are either maximizing something else that looks like EV, or you are making systematically exploitable choices (money-pump arguments).
  2.  **Utility must be bounded.** We reject the idea that value can scale infinitely. This solves the fanaticism problem mathematically.
  3.  **Probabilities must be epistemically grounded.** You cannot stipulate a probability of $10^{-100}$ for a magical claim without evidence that supports that specific precision. This solves the mugging problem practically.
  4.  **Infinities are modeling errors.** We do not put actual infinities into the equation.

  **Conclusion:** Your flatmate has correctly identified the **edge cases** where naive EV breaks. He is wrong to conclude that this breaks the **core framework**. It's like arguing that Newtonian physics is "broken" because it fails at the speed of light. No, it just means you need to know the domain of applicability. EV theory works for almost all human decision-making, provided you don't feed it nonsense inputs like actual infinities or epistemically baseless probabilities.

  Tell him: "You've discovered Pascal's Mugging and the St. Petersburg Paradox. Those are known problems. The solution isn't to throw out EV; it's to bound the utility function and respect epistemic limits. The framework survives; your version of it doesn't."
