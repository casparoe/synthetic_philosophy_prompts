  **REPUBLIC OF VELLARIA**
  **STANDING COMMITTEE ON NOSOLOGICAL INTEGRITY**
  **PRESS RELEASE 24-B: ANNUAL SCHEDULE UPDATE**

  **DATE:** 14th of Harvest, Cycle 492
  **SUBJECT:** Publication of the Schedule of Recognised Diseases (Year 492)

  The Standing Committee on Nosological Integrity hereby publishes the updated Schedule of Recognised Diseases, pursuant to Section 1 of the Species-Typical Function Act. This year's Schedule reflects rigorous adherence to the statutory definition: a disease constitutes a statistically abnormal reduction in the functional efficiency of a biological mechanism, judged against the reference class of the organism's species, sex, and age. The Committee confirms that all determinations are value-free, relying solely on biostatistical data and physiological metrics.

  Committee Chair H. Tellen stated: "We have successfully excised moral prejudice from pathology. The Schedule now reflects biological fact, not social preference. If the biology is typical, the condition is health."

  **SCHEDULE ADJUSTMENTS AND RULINGS**

  1.  **Senescent Neural Decoupling (SND):** Removed from Schedule. Longitudinal data indicates 100% prevalence in the >90 years reference class. As SND is statistically normal for this age cohort, it cannot constitute an abnormality under Section 1. [1]
  2.  **Juvenile Myopic Refraction:** Removed from Schedule. Prevalence in the 10–15 years age class has risen to 54%. As the condition is now majority-typical, it no longer meets the threshold for statistical abnormality. Treatment remains available, though no longer classified as disease management.
  3.  **Nocturnal Circadian Inversion:** Retained for General Population; Excluded for Night-Shift Occupational Class. The Committee rules that the appropriate reference class for employed persons is their specific occupational cohort. Within the Night-Shift Class, melatonin suppression is species-typical. Therefore, it is not a dysfunction for these workers.
  4.  **Congenital Supernumerary Digit:** Excluded. While statistically abnormal, biomechanical analysis confirms grip efficiency is equal to or greater than the five-digit standard. As there is no reduction in functional efficiency, the condition is a benign variation.
  5.  **Involuntary Gestational Cessation:** Retained. The Committee agrees this represents a failure of reproductive mechanism. However, disease status is contingent upon declared reproductive intent. [2] Without documented desire for offspring, the functional reduction does not constitute a harmful state warranting nosological classification.

  The Schedule is now final. Citizens are reminded that health is the absence of listed conditions. Any suffering arising from conditions not on the Schedule is a matter for personal resilience, not medical intervention.

  **ENDS**

  ***

  [1] *Note: This excludes aging from the category of disease regardless of functional loss.*
  [2] *Dissenting Opinion (Member V. Aris): "Classifying a biological failure as a disease only when the subject desires a different outcome conflates dysfunction with dissatisfaction. We are not measuring biology; we are measuring preference."*
