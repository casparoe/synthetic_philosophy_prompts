answer: |-
  Here is a decision tree designed for your reading group. It avoids the labels until the end, focusing instead on epistemic commitments, inference licenses, and model-updating rules. It is built to handle the "Bog Hoard" (high symbolism, low utility) and the "House Floor" (high utility, ambiguous symbolism) without breaking.

  ### The Decision Tree

  **Node 1: The Target**
  *Question:* Is explaining **what bodies did** (deposition, manufacture, use-wear) sufficient to exhaust the scientific value of the assemblage, or must you explain **why it made sense** to the actors to do it that way?
  *   **Sufficient (Behaviour):** Go to Node 2.
  *   **Must Explain Sense (Mental):** Go to Node 3.

  **Node 2: The License for Behaviour**
  *Question:* Is the link between the object and the action guaranteed by **natural law** (physics, biology, ergonomics), or is it established by **statistical correlation** observed in the record?
  *   **Natural Law:** Go to Leaf A.
  *   **Statistical Correlation:** Go to Leaf B.

  **Node 3: The Type of Sense**
  *Question:* Are you inferring the **rules and worldview** they shared (norms, beliefs, cosmology), or the **significance and experience** they felt (meaning, identity, agency)?
  *   **Rules/Worldview (Norms & Beliefs):** Go to Node 4.
  *   **Significance/Experience (Meaning):** Go to Node 5.

  **Node 4: The License for Beliefs**
  *Question:* Is the cognitive hardware generating these rules assumed to be **constant across time and space** (universal human cognition), or is it **variable and historically specific** (cultural construct)?
  *   **Constant/Universal:** Go to Leaf C.
  *   **Variable/Specific:** Go to Leaf D.

  **Node 5: The Location of Meaning**
  *Question:* Is meaning located in the **relationship between objects** (context, structure, placement), or in the **relationship between object and mind** (symbol, representation, intent)?
  *   **Between Objects (Context):** Go to Leaf E.
  *   **Between Object and Mind (Symbol):** Go to Leaf F.

  **Node 6: Object Ontology**
  *Question:* Do objects act merely as **passive evidence** of human choices, or do they exert **active force** on human choices (constraining, enabling, or acting alongside humans)?
  *   **Passive Evidence:** Proceed to Node 7.
  *   **Active Force:** Go to Leaf G.

  **Node 7: Model Updating**
  *Question:* If you uncover a single find that physically cannot fit your inferred model: Do you **discard the model** (high sensitivity), or do you **categorize the find as noise/exception** (low sensitivity)?
  *   **Discard Model:** Go to Leaf H.
  *   **Categorize as Noise:** Go to Leaf I.

  *(Note: Nodes 6 and 7 apply to all previous branches, but for clarity in the leaves below, they are integrated into the final positions where they are most theoretically distinctive.)*

  ---

  ### The Leaves (Positions & Commitments)

  **Leaf A: Middle-Range Theory (Processual)**
  *Path:* Behaviour → Natural Law → Passive → High Sensitivity.
  *   **Target:** Behaviour only.
  *   **Awkward Commitment:** You must accept that social complexity is epiphenomenal; if you can't measure it via energy expenditure or taphonomy, it didn't happen.
  *   **Test Case:** The **Bog Hoard** is just "deposited mass"; the **House Floor** is a "taphonomic snapshot."

  **Leaf B: Neo-Evolutionary / Systems Theory**
  *Path:* Behaviour → Statistical Correlation → Passive → Low Sensitivity.
  *   **Target:** Norms (as systemic functions).
  *   **Awkward Commitment:** You must treat individual human intent as noise; the "system" is the only agent that matters.
  *   **Test Case:** The **Bog Hoard** is a "storage failure"; the **House Floor** is a "system equilibrium."

  **Leaf C: Cognitive Archaeology**
  *Path:* Beliefs → Universal Cognition → Passive → High Sensitivity.
  *   **Target:** Beliefs (via shared cognition).
  *   **Awkward Commitment:** You must assume a Bronze Age brain processed symbols exactly like a modern Oxford don's, merely with different data inputs.
  *   **Test Case:** The **Bog Hoard** is "ritual behaviour driven by pattern-seeking hardware"; the **House Floor** reveals "spatial cognition universals."

  **Leaf D: Contextual Archaeology (Hodderian)**
  *Path:* Meaning → Between Objects → Passive → Fluid Sensitivity.
  *   **Target:** Meaning (via context).
  *   **Awkward Commitment:** You must accept that you cannot access the "past" directly, only the "past as constructed by your present context."
  *   **Test Case:** The **Bog Hoard** is "a statement of difference from the living"; the **House Floor** is "a text of domestic identity."

  **Leaf E: Symmetrical Archaeology / Ontological Turn (OLT)**
  *Path:* Meaning → Active Force → (Any Target).
  *   **Target:** Meaning + Norms (via object agency).
  *   **Awkward Commitment:** You must grant the bronze axe the same ontological standing as the person who buried it; the axe acted too.
  *   **Test Case:** The **Bog Hoard** is "the axe demanding burial"; the **House Floor** is "the floor constraining movement."

  **Leaf F: Ethnographic Analogy (Direct Historical)**
  *Path:* Beliefs → Variable/Specific → Passive → Low Sensitivity.
  *   **Target:** Beliefs (via continuity).
  *   **Awkward Commitment:** You must assume cultural stasis over millennia; if the analogy breaks, your entire timeline collapses.
  *   **Test Case:** The **Bog Hoard** is "like the ethnographic record of votive offering X"; the **House Floor** is "like the ethnographic record of house Y."

  **Leaf G: Empiricist Refusal (The "Shut Up and Dig" Line)**
  *Path:* Behaviour → Natural Law → (Refusal of Node 3).
  *   **Target:** Behaviour only (Radical).
  *   **Awkward Commitment:** You must admit archaeology tells you nothing about history, only about dirt movement; you are a geologist of trash.
  *   **Test Case:** The **Bog Hoard** is "oxidized copper in peat"; the **House Floor** is "sediment layers."

  ---

  ### Unoccupied & Indistinguishable Spaces

  **Unoccupied Combination: Universal Cognition + Active Objects**
  *Diagnosis:* **Incoherent.** If cognition is universal and fixed (Leaf C), objects are usually treated as static outputs of that hardware. If objects have agency (Leaf E), cognition is usually treated as distributed and variable. Nobody successfully claims "Human hardware is identical everywhere, but the pots are making the decisions."

  **Unoccupied Combination: Behaviour + Active Objects**
  *Diagnosis:* **Unattractive.** If you only care about physical behaviour (Leaf A), granting agency to the object adds explanatory weight without predictive power. It's a solution to a problem you said you didn't have.

  **Indistinguishable Pair: Contextual Archaeology (Leaf D) vs. Post-Processualism**
  *Diagnosis:* **Fudged.** In practice, these leaves occupy the same space. "Contextual" is the method; "Post-Processual" is the political banner. The tree cannot separate them because they share the same updating rules and target (Meaning via Context).

  **Indistinguishable Pair: Cognitive Archaeology (Leaf C) vs. Evolutionary Psychology**
  *Diagnosis:* **Overlapping.** Both rely on the "Constant/Universal" license at Node 4. The only difference is whether the universal is "symbolic capacity" (Cognitive) or "adaptive strategy" (Evo Psych). The tree treats them as the same epistemic bet.

  ---

  ### How the Tree Handles Your Test Cases

  **1. The Bog Hoard (Unworn Bronze Axes)**
  *   **The Split:** Node 1 is the killer here.
      *   If you answer **Behaviour**, you land in Leaf A or G. The axes are just "deposited metal." The fact they are unworn is a variable of manufacture, not intent.
      *   If you answer **Sense**, you move to Node 3.
          *   If **Norms/Beliefs**, you ask Node 4. If Universal (Leaf C), it's a "ritual signal." If Variable (Leaf F), it's "ancestor worship based on ethnography."
          *   If **Meaning**, you ask Node 5. If Context (Leaf D), it's "boundary marking." If Active (Leaf E), it's "the axes withdrawing from circulation."
  *   **The Friction:** The tree forces the Rationalists to admit that "Behaviour" cannot explain *why* they weren't worn. It forces the Archaeologists to admit that "Meaning" requires a license (Node 4/5) that is often unproven.

  **2. The House Floor (Objects Left In Situ)**
  *   **The Split:** Node 6 (Object Ontology) and Node 7 (Updating).
      *   **Processual (Leaf A/B):** The floor is a sample. If one pot is out of place, it's noise (Node 7: Low Sensitivity). Objects are passive (Node 6).
      *   **Contextual (Leaf D):** The floor is a text. If one pot is out of place, it changes the reading of the room (Node 7: High Sensitivity). Meaning is in the placement (Node 5).
      *   **Symmetrical (Leaf E):** The floor *made* them leave the pots. The arrangement constrains the interpretation (Node 6: Active).
  *   **The Friction:** This case exposes the "Updating" commitment. A rationalist wants to know the error rate of the "frozen moment" hypothesis. The tree forces them to declare if a single contradictory stratigraphic layer breaks their "Pompeii Premise."

  ### One-Line Diagnosis for the Reading Group
  "This tree doesn't tell you which theory is true; it tells you which epistemic risks you are willing to take to get from dirt to mind."
