  *(Self-Correction during drafting)*: Wait, I need to make sure I don't just say "Step 4 is wrong." I need to explain *why* it's wrong in a way that preserves the intuition for sortition. The key is that sortition is a mechanism for *selecting agents*, not *allocating outcomes*. The friend's argument tries to apply the agent-selection logic to outcome-allocation.

