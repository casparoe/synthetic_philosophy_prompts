      *   The difference is the *nature of the good*. Political power is a "common good" (everyone shares sovereignty). Kidneys are "private goods" (rivalrous).
      *   This is the "Common Good vs. Private Good" distinction.
      *   Okay, I will focus on the **Locus of the Lottery** (Ruler vs. Recipient) and the **Nature of the Good** (Authority vs. Resource).

