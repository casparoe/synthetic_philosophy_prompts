answer: |-
  This is a sharp argument. It's a classic *reductio ad absurdum* that feels compelling because it exploits a very specific ambiguity in how we talk about "decisions." Your friend is relying on an equivocation that slides past most people because the word "decision" does too much work in both premises (3) and (4).

  Here is the diagnosis.

  ### The Break Point: Step (4) to (5)

  The error is an equivocation on **the locus of the lottery.**

  *   **In Sortition (Step 3):** The lottery selects the **agent** who decides. (Who gets to hold the gavel?)
  *   **In the Triage Example (Step 5):** The lottery selects the **recipient** of the decision. (Who gets the kidney?)

  Your friend's argument relies on treating these as morally equivalent applications of "random selection." They are not.

  Premise (1) says legitimacy requires an equal chance to **shape** the decision.
  *   In a sortition legislature, I have an equal *ex ante* chance to be the shaper (the legislator).
  *   In a kidney lottery, I have an equal *ex ante* chance to be the **object** of the decision (the recipient), not the shaper.

  If you applied the logic of sortition consistently to the kidney case, you would not raffle the kidney. You would randomly select a panel of citizens to **decide** who gets the kidney based on medical criteria. That is actually a plausible (if inefficient) proposal for administrative oversight! But your friend isn't arguing for a random *panel* to decide triage; he's arguing for a random *outcome*.

  He has conflated **randomizing authority** with **randomizing allocation.**

  ### Why the Distinction Matters (The "Nature of the Good")

  To reject (4) without giving up (3), you need to articulate why political authority and medical resources are different kinds of "goods."

  1.  **Political Authority is Non-Rivalrous (in the abstract):** When we decide on laws, we are creating a framework that applies to all of us. The "good" being distributed here is *sovereignty*. In a democracy (or lottocracy), the claim is that sovereignty belongs equally to all. Therefore, the mechanism for wielding it must reflect that equality. Random selection equalizes the *opportunity to rule*.
  2.  **Kidneys/Jobs are Rivalrous Private Goods:** These are not about who rules; they are about who receives a scarce benefit. The moral criterion here isn't "who has the right to command?" it's "who has the strongest claim to receive?" Claims are based on need (triage) or merit (hiring), not on an equal right to rule.

  If you accept (1) as "equal chance to shape," it applies to **rules** (which bind everyone equally). It does not apply to **allocations** (which target specific individuals based on specific traits).

  ### The Cost of Rejecting (4)

  You asked what you pay to save (3). Here is the bill:

  1.  **You lose "Universal Sortition":** You cannot argue that *everything* should be decided by lot. You must draw a boundary between "constitutional/legislative decisions" (where equality of agency is paramount) and "administrative/distributive decisions" (where outcome quality/justice is paramount).
  2.  **You admit Sortition is Procedural, not Epistemic:** You are conceding that sortition is justified because it solves the *legitimacy* problem (who has the right to decide), not because it necessarily produces *better* decisions than experts. If you argued sortition produces better outcomes, your friend could ask, "Why not use the better-outcome method for kidneys too?" By grounding sortition in *authority* rather than *competence*, you wall it off from the triage case.
  3.  **The Boundary Problem:** You now have to defend where the line is drawn. Is a central bank decision "legislative" (sortition) or "technical" (expert)? Is a zoning board "political" or "administrative"? This is a messy, fuzzy line that you now own.

  ### Confidence and Uncertainty

  **Confidence in Diagnosis: 90%**
  I am highly confident that the equivocation between "randomizing the decider" and "randomizing the recipient" is the structural flaw in your friend's argument. This is a standard category error in political philosophy (conflating the justification of authority with the justification of distribution).

  **The One Point I'm Least Sure About: Premise (1)**
  I am least confident that Premise (1) ("A collective decision... is legitimate *only if* everyone... had an equal chance to shape it") is actually true, or that it's the *best* foundation for sortition.

  *   **Why I'm unsure:** There are legitimate binding decisions where we *don't* want equal chance to shape. Example: A jury verdict. We don't want everyone to have an equal chance to shape the verdict; we want 12 specific people to shape it based on evidence. Or: A technical safety regulation on nuclear waste. Do we really want equal chance to shape that, or do we want high-competence shaping?
  *   **The Risk:** If you anchor your defense of sortition entirely on (1), you might find yourself trapped by other cases where (1) seems intuitively false. A more robust defense of sortition might rely on **anti-corruption** or **descriptive representation** rather than pure "equal chance to shape." If you shift your foundation to "Sortition prevents capture by elites," the kidney argument dissolves even faster (raffling kidneys doesn't prevent elite capture, it just adds noise).

  **Summary:** Reject the move from (4) to (5). Your friend is smuggling "random outcomes" into an argument about "random rulers." You can keep sortition for the legislature, but you must concede that sortition is a tool for legitimizing *authority*, not for distributing *goods*. The cost is that you now have to defend the boundary between politics and administration, which is messy, but it's a necessary mess.
