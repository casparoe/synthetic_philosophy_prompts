  A department chair wishes to prevent herself from canceling the weekly seminar, so she signs a rule granting the graduate students the authority to lock the room at 4 PM and instructs them to disregard any subsequent order from her to open it. When she arrives at 4:05 PM and commands the door be unlocked, the students refuse. She says, "I am your superior." They reply, "We are obeying your standing instruction to ignore your current orders." She says, "But I am ordering you now." They say, "Exactly; that is why we must ignore you."

  The punchline turns on the enforcement asymmetry, specifically the transfer of authority to a second party who is instructed to treat the agent's future will as invalid.
