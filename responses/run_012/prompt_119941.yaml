      *   *Claim 4:* "The preface paradox is the same argument in everyday dress..."
          *   *Epistemological Status:* Structurally similar, but distinct in important ways (statistical vs. fallibilist).
      *   *Claim 5:* "...consistency is a regulative ideal we should give up on..."
          *   *Epistemological Status:* A minority view (dialetheism or paraconsistentism applied to belief). Most try to save consistency.
      *   *Claim 6:* "...they refute the idea that there is any such thing as a logic of belief, since deductive logic tells us that from an inconsistent set of beliefs anything at all follows."
          *   *Epistemological Status:* Mistaken/Exaggerated. This assumes classical logic applies to belief aggregation without restriction. Paraconsistent logics or non-aggregation principles exist.

