answer: |-
  I asked the butterfly what it thought about this identity crisis. It said, 'Humans worry so much about which state is real. I spent the afternoon fluttering, perfectly pleased with myself. I didn't know I was the man, and I certainly didn't worry about mortgages. That panic started exactly when *you* woke up.'

  The point isn't that I'm the bug. It's that we're just one thing changing shapes. The man becomes the butterfly, the butterfly becomes the man. Neither of us gets to be the 'real' one. So stop checking your identity and start enjoying the flutter.

  So I tried to drink this pint by flapping my arms. The barman asked me to leave, and the classics teacher just smiled. Maybe I'm still the man, but for a moment, I was wonderfully light. And honestly, looking at this lot, you'd be happier if you just fluttered.
