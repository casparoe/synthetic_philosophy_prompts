          *   Actually, let's stick to the intuitive explanation Buchak uses: Risk aversion is a preference for security. In the REU representation, a convex risk function implies the agent cares more about the lower portion of the utility distribution.
          *   *Wait, standard probability weighting:* In Prospect Theory, overweighting small probabilities of gains is risk-seeking.
          *   *Buchak's REUT:* It is distinct from Prospect Theory.
