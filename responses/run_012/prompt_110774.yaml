      *   *Diversification:* If the risk-averse trustee has a convex risk function ($r(p) < p$), they downweight the probability of success. Diversification increases the probability of *some* success (reducing the chance of total zero). This usually appeals to risk-averse agents. Therefore, a policy of *never* diversifying hurts the risk-averse trustee's REU more than the others.

