          *   *Wait, does convex r(p) mean risk averse?*
          *   Let's check the Allais Paradox interpretation. Risk averse agents violate Independence.
          *   Okay, standard interpretation in REUT literature:
              *   Risk-averse: Convex $r$ (e.g., $r(p) = p^2$ is concave... wait. $p^2$ is convex geometrically but lies *below* the diagonal).
              *   Let's recall the graph. Diagonal is $y=x$.
