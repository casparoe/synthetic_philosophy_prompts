              *   Concave function (bowed in like a cap): Lies *above* the diagonal.
              *   *Buchak's Text:* "An agent is risk-averse if and only if her risk function is convex." (Risk and Rationality, p. 107).
              *   *Wait, mathematical convexity:* A function is convex if the line segment between any two points lies *above* the graph. So $f(tx + (1-t)y) \leq tf(x) + (1-t)f(y)$. Graphically, it holds water. It lies *below* the diagonal connecting (0,0) and (1,1).
              *   *Implication:* If $r(p)$ is convex (lies below diagonal), then $r(p) < p$.
              *   *Effect on REU:* If $r(p) < p$, you are down-weighting the probability of the better outcome relative to EUT. This leads to risk aversion.
              *   *Okay, so:* Risk Averse = Convex $r$ (lies below diagonal, $r(p) < p$). Risk Seeking = Concave $r$ (lies above diagonal, $r(p) > p$).
