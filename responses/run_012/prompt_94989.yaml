answer: |-
  The house smelled of boiled linen and the slow, wet rattle of Elias's breathing. Mara sat by the window, watching the road where the committee car would eventually arrive, then looking back at the bed. Outside, the town of Oakhaven had gathered. They did not crowd the yard; they stood by the lake shore, staring at the exposed banks where the clay turned from grey to black.

  Elias was the last. When he died, the Survivor Rule would be satisfied. The epoch could be named.

  For fifty years, the International Stratigraphic Commission had waited for the generation of the Great Acceleration to pass. They could not name the Anthropocene while those who began it still drew breath. To do so would be to let the accused judge the crime. So they waited. Now, only Elias remained. He had driven a truck through the first plastic-choked highways; he had poured the concrete that sealed the wetlands. He was eighty-nine. He had been dying for a week.

  "Is it time?" asked Mr. Henderson from the doorway. He represented the faction that wanted the boundary set at 1950.

  "Not yet," Mara said.

  "If it's the Soot Line," Henderson whispered, "then we were children. We burned because we were cold. You don't blame a child for shivering."

  This was the stake. If the boundary was set at the physical spike—the radionuclides, the microplastics, the carbon surge of the mid-century—then the ancestors were forces of nature. Unwitting. Innocent of intent. The town's prosperity, built on the freight lines and factories Elias had served, was a happy accident of history.

  "But if it's the Warning Line," said Mrs. Gable, stepping in behind Henderson. She led the group favoring the 1970s marker, the moment the first global reports were filed and ignored. "Then they were adults. They saw the fire and kept cooking."

  This was the other stake. If the boundary was set at the awareness of harm, then the ancestors were complicit. It granted them agency. It said they were human enough to know better, even if they chose wrong. To some, this was a stain; to others, it was the only dignity left. To be a villain is to be a person. To be a force of nature is to be nothing.

  Mara looked at her grandfather. He opened his eyes. They were clouded, fixed on the ceiling beams.

  "Did the truck..." he rasped.

  "The truck is parked, Grandfather," Mara said, holding his hand. It was dry as parchment. "You're done."

  He nodded, a tiny movement. He had spent his life moving goods from here to there, never asking what was in the boxes, only that they arrive. If the line was drawn at the Soot, he was a vessel. If the line was drawn at the Warning, he was a driver who saw the map and drove off the cliff.

  The breathing stopped at 4:12 PM.

  Mara did not cry. She closed his eyes and walked to the porch. She raised a single flare, red smoke hissing into the grey sky. It was the signal. The witness was gone. The books could be closed.

  The committee car arrived within the hour. It was a silent electric vehicle, out of place among the combustion engines rusting in the town's driveways. Dr. Aris stepped out. She carried a briefcase, not a shovel. She looked tired. She was not here to dig; she was here to sign.

  The town followed her to the community hall. The air inside was stale, thick with the weight of the waiting. Aris set the briefcase on the table and opened it. There were no microscopes, no core samples. There was only a ledger and a small wooden box.

  "The evidence is consistent," Aris said. Her voice was flat, practiced. "The stratigraphy shows the change. The question is the interpretation. The Commission is deadlocked. Fifty percent favor the Physical Marker. Fifty percent favor the Cognitive Marker."

  "So decide," Henderson said from the back.

  "I cannot. The rules forbid it. When the evidence is equal and the interpretation divides the body, the tie is broken by lot." She opened the wooden box. Inside were two stones. One was white quartz, smooth and river-worn. One was black slate, rough and jagged. "White for Physical. Black for Cognitive."

  A murmur went through the room. Mara felt a tightness in her chest. Her grandfather's life, the sum of his labor and his silence, would be categorized by a stone drawn from a box by a woman who had never smelled diesel fuel or felt the shake of a heavy rig under her feet.

  "Who draws?" Mrs. Gable asked.

  "The witness's kin," Aris said, looking at Mara.

  The room turned. Mara walked to the table. The stones sat in the velvet lining. They looked identical in weight, identical in importance. One would declare her grandfather a innocent child of his time. The other would declare him a knowing participant in the end of the world.

  She thought of the lake outside. The mud layers were there regardless of the name. The plastics were sinking into the silt regardless of the date. The name was not for the earth. It was for them. It was for the people left behind, who needed to know if they were inheriting a tragedy or a crime.

  "If I pick white," Mara said, her voice shaking slightly, "he didn't know."

  "If you pick black," Aris said softly, "he knew."

  "It doesn't change the mud," Mara said.

  "No," Aris agreed. "It changes the history."

  Mara hovered her hand over the box. She wanted him to be innocent. She wanted to believe that the smoke that choked the valley was just weather, not a choice. But she remembered the coughing. She remembered the filters on the windows installed in the seventies. She remembered him reading the newspaper at the table, shaking his head, then putting on his boots and going to work.

  To call him innocent was to call him blind. To call him complicit was to call him human.

  She closed her eyes and picked.

  Her fingers closed around cold stone. She lifted it. It was heavy. She opened her hand.

  Black slate.

  The room exhaled. It was not a gasp, but a release. Henderson looked at his shoes. Mrs. Gable straightened her back.

  Aris took the stone and placed it next to the ledger. She took out a pen. She did not hesitate. She wrote the date. She wrote the designation. *Holocene/Anthropocene Boundary. Cognitive Marker.* She stamped the page with the seal of the Commission. The sound was a dull thud, like a gavel or a heart stopping.

  "It is recorded," Aris said.

  "What happens now?" Mara asked.

  "Now we leave. The epoch has begun. You are living in it." Aris closed the briefcase. She looked at Mara, and for a moment, the bureaucracy slipped. "I am sorry it fell to you."

  "It had to fall to someone," Mara said.

  Aris nodded and walked out. The town followed her, drifting back toward the lake, toward the banks where the grey turned to black. They would walk the line tonight. They would point to the mud and say, *Here. This is where we woke up.*

  Mara stayed in the hall. She looked at the ledger. The ink was still wet. It was just a book. It was just a record of inventory, assets and liabilities, debits and credits. Her grandfather was listed in the margins, a datum point in a layer of sediment.

  She walked home. The house was quiet. She went to the window and looked out at the lake. The water was dark, reflecting the sky. Somewhere beneath the surface, the layers were settling. The plastics, the soot, the bones. They did not care about the name. They only cared about the weight.

  Mara went to the desk where Elias kept his logs. She opened the last book. The final entry was from three days ago. *Miles: 0. Fuel: 0. Status: Parked.*

  She took a pen from the drawer. She did not know what to write. There was no column for grief, no ledger for the arbitrariness of a stone in a box. She closed the book. Outside, the town was lighting fires along the shore, a string of lights marking the boundary in the dark, drawing their own line against the water, waiting for the morning to see what remained.
