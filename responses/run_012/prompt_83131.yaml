  I'm an applied statistician — a biostatistician by training, now working mostly with observational health data. My vocabulary for probability is measure-theoretic and modeling-oriented: a probability space, a sigma-algebra of events, a data-generating process, a sampling model, a likelihood, a prior and a posterior, exchangeability, calibration and coverage, identifiability, and the propensity scores that turn up in causal adjustment. When I say 'probability' I almost always mean either a fitted model's output or a long-run property of a procedure. I have never studied the philosophy of probability, and I don't want a reading list.

  Take the three main philosophical interpretations — frequentism, subjectivism (credences as degrees of belief), and propensity (single-case chances, understood as a disposition of a setup to yield an outcome) — and restate each one in my vocabulary, as faithfully as you can. Do them one at a time, and keep the translation honest: don't quietly import my framework's assumptions and present them as if the philosophers had said them. For each interpretation, give me a residue report: what translates cleanly, what translates only with distortion, and what has no counterpart in my vocabulary at all. A concrete case to keep the exercise anchored, if it helps: the probability that this particular patient's aneurysm ruptures in the next year, for a patient whose case is unique and who will be treated once.

  Then tell me where my vocabulary is doing work that makes the translation look easier than it is. Two places I already suspect. First, my own 'frequentist versus Bayesian' dispute is a dispute about statistical procedure — coverage, admissibility, priors as regularizers — and I doubt it is the same dispute as the philosophical one, even though the words match. Second, 'propensity' in my mouth is a fitted conditional probability of treatment assignment, and I want to know whether that is a coincidence of terminology or whether the causal-inference notion inherits anything from the metaphysical one.

  Finally, the verdict I actually want: for each thing that failed to translate, is that a gap in my framework — something an applied statistician genuinely cannot say — or is it evidence that the philosophical claim was doing less work than it appeared to? I would rather be told that my framework is missing something than be flattered with a translation that smuggles my assumptions in as though they were neutral.

  Tell me how confident you are in each part of this, and single out the claim you are least sure of.
