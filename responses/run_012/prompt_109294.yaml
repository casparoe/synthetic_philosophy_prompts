      *   *Case 3 (The Lazy Surgeon):* Transplant but the patient is already dying? (Tests Consent/Transplant boundary). Let's go with *The Willing Organ Donor* (already in user's list as Consent). Let's make a new one: *The Two Bridges*. One bridge has a bystander, one has a volunteer. Can I choose the volunteer bridge to divert the tram?

