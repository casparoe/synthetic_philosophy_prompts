      Let's adjust (b) to 2/3 and (c) to 1/3 to reflect the severity of the causal claim error. Or keep (b) higher because they identified the paradox correctly.
      Actually, identifying Simpson's Paradox and the confounder distribution is the main point of (b). The causal overreach is subtle. I'll give 2.5/3 for (b).
