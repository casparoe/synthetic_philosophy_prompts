          *   *Grading Decision:* For an intermediate course, identifying Simpson's Paradox and correctly identifying the confounder (Stage) and the direction of bias is the bulk of the points. Claiming causal certainty from observational data is a common student overstep. However, part (c) asks "what further information... would you require". This implies part (b) might be expected to be tentative, OR part (c) is the place to discuss the limitations of observational data (unmeasured confounding).
