      *   **(2) vs. (3):** *EV Max vs. Transparent Cooperation.*
          *   *Conflict:* As noted, standard EV (CDT) says Defect. (3) says Cooperate.
          *   *Resolution:* User likely means FDT-EV. If so, no conflict. But needs clarification. If they mean CDT-EV, this is a direct contradiction.
          *   *Severity:* Low (assuming FDT interpretation).

      *   **(1) vs. (5):** *SPI vs. No Paternalism.*
          *   (5) says don't override stated preferences.
          *   (1) says only make changes that are safe Pareto improvements.
