  2.  **Analyze the Commitments:**

      *   **(1) Safe Pareto Improvements (SPI):**
          *   *User's Gloss:* Change rules such that every party is $\ge$ well off vs. status quo, *no matter how others play* (irrational/adversarial), *no matter preferences*.
          *   *Commitment:* When acting on behalf of others, *only* make SPI changes. No risky bets on their behalf.
          *   *Standard Definition Check:* In cooperative AI literature (e.g., Oesterheld, Conitzer), SPIs usually involve delegating to sub-agents with restricted strategy spaces or modified utility functions such that the outcome is Pareto superior to the default equilibrium *assuming rational play*. The user's definition is *much stronger* (robust to irrationality/unknown preferences). This is a critical point. The user's definition is closer to "dominant strategy Pareto improvement" or "ex-post Pareto improvement under uncertainty."
          *   *Implication:* This is an extremely high bar. It essentially bans almost all strategic delegation unless the new rules strictly dominate the old ones for *all* possible worlds/preferences.

      *   **(2) Expected Value (EV) Maximization:**
          *   *Commitment:* For *my* decisions, maximize EV.
          *   *Implication:* Willing to take risks if the math works out. Doesn't require robustness to others' irrationality for self-decisions.

      *   **(3) Cooperation with Transparent Agents (Program Equilibrium/Superrationality):**
          *   *Commitment:* Cooperate in one-shot PD if code matches (logical correlation).
          *   *Implication:* This is Functional Decision Theory (FDT) or Timeless Decision Theory (TDT) territory. It violates Causal Decision Theory (CDT) which dominates standard EV maximization in one-shot PDs.
          *   *Tension:* (2) says "maximize EV." Standard CDT says defect in one-shot PD. (3) says cooperate. This implies (2) isn't standard CDT-EV, but FDT-EV.

      *   **(4) Incentive-Compatible Design:**
          *   *Commitment:* Design rules so best response = desired outcome. Don't rely on niceness.
