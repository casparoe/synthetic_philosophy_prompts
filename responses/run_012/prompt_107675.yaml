      *   **(5) No Paternalism:**
          *   *Commitment:* Never override stated preferences. Interventions must be endorsable by the agent if they understood mechanics.
          *   *Implication:* Respect for autonomy. Aligns with (1) in spirit (don't gamble with their utility), but conflicts if (1) forces a change they don't want, or if (2) suggests a paternalistic EV boost.

  3.  **Identify Conflicts (Pairwise Analysis):**

      *   **(1) vs. (2):** *Self vs. Other.*
          *   (2) says I take risks for myself (EV max).
