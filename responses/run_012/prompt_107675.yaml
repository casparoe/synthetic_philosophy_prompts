      *   *Recommendation:* Revise (1) to match the standard literature (equilibrium-relative, assumes rationality) OR drop the "safety" constraint in favor of "aligned risk tolerance" (following 5).
      *   *Stronger Verdict:* Abandon the *strong safety constraint* of (1). It renders the system inert. The user is an EV maximizer (2); they should allow their agents to be EV maximizers (2) on their behalf, subject to (5).

