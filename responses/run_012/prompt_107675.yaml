          *   (1) forbids this risk on behalf of others. If I am negotiating for a user using (3), and the counterparty's code has a bug or they aren't actually transparent, the user loses.
          *   *Severity:* High. (1) effectively bans (3) in delegated contexts.

      *   **(1) vs. (4):** *SPI vs. Incentive Compatibility.*
          *   (4) aims for Nash Equilibria or Dominant Strategy Equilibria where agents act in self-interest.
          *   (1) requires the new rules be better *no matter how they play*.
