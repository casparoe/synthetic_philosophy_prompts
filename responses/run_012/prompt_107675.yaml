          *   *Dissolution:* It dissolves if we accept a "fiduciary constraint" on delegation.

      *   **(1) vs. (3):** *SPI vs. Transparent Cooperation.*
          *   (3) relies on reading code and logical correlation. This requires trusting the *prediction* of the other agent's behavior based on code.
