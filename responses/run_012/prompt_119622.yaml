answer: |-
  To decide whether predictive processing deserves treatment as a substantive scientific theory rather than a mere metaphorical framework, one must first distinguish between the mathematical necessities of the framework and the empirical claims it makes about the world. A genuine demand for any scientific theory is that it specifies the ontology of its core constructs, meaning an adequate predictive processing account must explicitly state what the generative model is a model of. It is not enough to say the brain models the world; the theory must define whether the latent variables in the model correspond to distal causes in the environment, proximal sensory states, or affordances for action, and it must explain why a specific model structure is selected over others. If the theory claims that the brain selects models based on minimizing variational free energy, it must provide a mechanism for how the hypothesis space is constrained, otherwise the claim that the brain selects the best model is trivial because the best model is defined tautologically as the one that minimizes error. This is a genuine demand for content specification, whereas the commitment to hierarchical Bayesian inference as the specific algorithmic implementation is merely a commitment of one camp, specifically the Fristonian school, and alternative architectures could potentially satisfy the broader functional description without adhering to strict hierarchical Bayesian updating.

  Once the content of the model is established, the theory faces the genuine demand of explaining action, specifically how a system dedicated to minimizing prediction error avoids the dark room problem. If the goal is simply to reduce surprise, a system should seek out unchanging, predictable environments, yet organisms actively seek novelty, engage in play, and sometimes pursue situations known to be painful or surprising. An adequate account must explain this without retreating into circularity, typically by invoking the concept of precision weighting or expected free energy, where the system minimizes expected future error rather than immediate error, thus valuing information gain. However, this explanation must be more than a mathematical restatement of exploration; it must specify the physiological mechanism that modulates precision weights to allow for novelty seeking in some contexts but not others. This is a genuine demand for explanatory power regarding motivation, whereas the specific claim that this is achieved solely through neuromodulatory signals like dopamine encoding precision is a commitment of one camp that could be falsified by finding alternative mechanisms for gain control.

  The most critical genuine demand for predictive processing is falsifiability, which directly addresses the charge that the theory is merely a redescription of behavior. If any observed behavior can be retrospectively modeled as the minimization of prediction error by adjusting the parameters of the generative model, then the theory explains nothing and predicts nothing. To escape this charge, the theory must specify observations that would count against it, such as neural activity that correlates with stimulus features but not prediction errors, or behavioral patterns that persist despite increasing prediction error without any compensatory change in model precision. A substantive theory must risk being wrong, so it must predict specific neural signatures, such as the mismatch negativity in EEG or specific laminar activity patterns in the cortex, that are unique to predictive coding and not explainable by alternative feedforward theories. If the theory cannot identify a scenario where a system would not minimize prediction error, it remains a mathematical tautology rather than an empirical hypothesis, and this is a genuine demand for scientific status that currently threatens the framework because its proponents often absorb counter-evidence by adjusting the complexity of the generative model rather than abandoning the core principle.

  Regarding the scope of the theory, there is a tension between the requirement for generality and the requirement for mechanistic specificity. If predictive processing is meant to be a general theory of life, as suggested by the Free Energy Principle, it must apply as readily to a bacterium as to a person, explaining chemotaxis in terms of prediction error minimization. However, if it is to be a substantive theory of human psychopathology and cognition, it must account for specific neural architectures and cultural influences that bacteria lack. A genuine demand for a general theory is consistency across scales, but a genuine demand for a specific theory is mechanistic detail. It is possible that these requirements cannot be met together, because a principle general enough to cover bacterial membrane dynamics may be too vague to explain the specific symptoms of schizophrenia, while a model detailed enough to explain schizophrenia may be too specific to apply to bacteria. If the theory claims to be both, it must demonstrate how the same mathematical formalism maps onto vastly different physical substrates without losing explanatory power, otherwise the claim of generality is merely a commitment of one camp aimed at unification rather than a verified scientific fact.

  In the domain of psychopathology, the theory must deliver specific distinctions between disorders rather than collapsing them into a single category of broken prediction. It must explain why schizophrenia is characterized by an excess of prediction error or faulty precision weighting on sensory inputs, leading to hallucinations, while autism might be characterized by an excess of precision on prior expectations or sensory noise, leading to rigidity. This is a genuine demand for clinical utility, requiring the theory to map specific computational failures to specific symptom clusters. However, the theory must respect constraints from the rest of science, particularly neuroscience and genetics, meaning it cannot posit computational failures that have no corresponding neural or molecular basis. If the theory explains depression solely as a prior over negative outcomes without linking this to serotonergic or structural changes, it fails the constraint of biological plausibility. This is a genuine demand for interdisciplinary consistency, whereas the commitment to viewing all psychopathology as a disorder of inference is a commitment of one camp that risks ignoring non-cognitive biological factors.

  Finally, one must confront the possibility that the requirements for universality and falsifiability are incompatible. If the theory is universal, applying to all living systems, it risks becoming a principle of organization that is true by definition, thereby failing the falsifiability demand. If it is falsifiable, it must be specific enough to be wrong, which limits its universality. A substantive theory must choose between being a universal law of life that is mathematically necessary but empirically thin, or a specific theory of brain function that is empirically rich but limited in scope. If predictive processing attempts to be both without resolving this tension, it fails to meet the genuine demand for logical coherence. Therefore, an adequate account must plainly state whether it is a theory of how brains work or a theory of how matter organizes itself into life, and it must accept that satisfying the constraints of neurobiology may require abandoning the claim that a bacterium minimizes prediction error in the same sense that a human does. If the theory cannot make this distinction, it remains a redescription of adaptation rather than a mechanism of prediction, and the charge that it is a non-substantive framework lands fully. To be substantive, it must sacrifice either its universality or its immunity to falsification, and until it does so, it remains a promising research program rather than a confirmed scientific theory.
