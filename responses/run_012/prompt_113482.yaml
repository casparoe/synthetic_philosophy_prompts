answer: |-
  Sam: So, are we sticking with the chair? Because I still say you're denying the obvious. I'm sitting on one.

  Jordan: You're sitting on particles arranged chair-wise. There's no extra entity hovering over them called a chair. That's the whole point.

  Sam: But why stop there? If you accept the particles, why not accept the sum of the particles? That sum is the chair.

  Jordan: Because sums don't exist. Only the simples exist. If you accept sums, you have to accept the sum of your left shoe and the moon. Is there an object that is exactly your shoe plus the moon?

  Sam: Yes. Obviously. It's a scattered object, sure. It's weird, but it exists. Why is that worse than saying nothing exists except subatomic particles?

  Jordan: Because it violates every intuition we have about what an object is. Objects have boundaries. They have causal powers. What causal power does the shoe-moon fusion have that the shoe and the moon don't have separately?

  Sam: It has the power to be counted as one thing if I want to count it. But look, let's test this on something messier. A candle flame. Is there a flame?

  Jordan: No. There's hot gas, plasma, photons emitting. Processes. But no single thing that is the flame.

  Sam: But it persists. I light it at eight, it's burning at eight-fifteen. It's the same flame.

  Jordan: Is it? The particles at eight are gone by eight-fifteen. They've burned up. If the flame were an object composed of those particles, the object would cease to exist every microsecond.

  Sam: Exactly! Which is why composition isn't about sticking together forever. It's about unity at a time. At any given instant, those particles compose a flame-object. That object persists by having temporal parts. The flame at eight is a different temporal slice than the flame at eight-fifteen, but they're part of the same spacetime worm.

  Jordan: That's just verbal gymnastics to save the phenomenon. You're admitting the object changes completely every instant. So why call it one object? Why not just say there's a process?

  Sam: Because processes are made of things happening. You need stuff to have the process. The stuff is the fusion of particles.

  Jordan: Okay, but let's try something where the stuff doesn't just replace itself, but changes arrangement. Think about those slime molds. Single-celled organisms. Mostly they live apart. Then, under stress, they clump together and crawl around as one blob. Then they split up again. Did a new object come into existence when they clumped?

  Sam: Yes. Well, sort of. The fusion of those cells always existed. When they were separate, there was a scattered object composed of those cells. When they clumped, the same object just changed shape. It became compact.

  Jordan: That's insane. When they're separate, they're just a bunch of independent organisms. There's no blob. When they clump, biologists say a multicellular structure forms. You're saying the structure existed when they were miles apart?

  Jordan: Precisely. And you're saying when they split up, the blob doesn't go out of existence, it just scatters?

  Sam: I'm saying the fusion never goes out of existence. Composition is unrestricted. Any plurality has a fusion. Whether that fusion is biologically interesting is a different question.

  Jordan: But that strips the word object of all meaning. If the blob is the same object when scattered as when clumped, then the clumping doesn't create unity. It just moves parts. So why do we feel like the blob is a real thing and the scattered cells aren't a single thing?

  Sam: Because we care about causal integration. When clumped, they move together. But ontology isn't about what we care about. It's about what there is. There is a sum of those cells. Always.

  Jordan: Okay, but here's the problem. If composition is unrestricted, then there's no fact of the matter about when composition happens. It always happens. So the question is empty.

  Sam: Not empty. True. It always happens.

  Jordan: But consider the reverse. If I say composition never happens, I also say there's no fact of the matter about when it happens. It never happens. We're both saying the world doesn't decide when parts make a whole. You say yes always, I say no never.

  Sam: Right.

  Jordan: So maybe that's the clue. Maybe there is no fact of the matter. Maybe existence isn't something the world does. Maybe it's just about how we talk. We say there's a blob when it's useful to say there's a blob. We say there's a chair when it's useful. But ontologically, it's indeterminate.

  Sam: Wait, are you going conceptualist on me? You're the nihilist. You love your hard particles.

  Jordan: I love clarity. If both extremes lead to saying the world doesn't constrain composition, maybe the constraint is in us. It's verbal. There's no deep metaphysical truth about whether the cells compose a blob. There's just whether our concept of blob applies.

  Sam: That doesn't work. Because if it's just words, then we aren't disagreeing about reality. We're disagreeing about definitions. But I'm telling you there is something in the world that is the fusion of those cells. Not just a concept. If you smash the blob, something breaks.

  Jordan: What breaks? The cells break. The bonds break. You don't need a blob-object to explain the breaking. You're positing a ghost.

  Sam: And you're positing that chairs are illusions. Look, if you say it's just language, then you can't say I'm wrong about the shoe-moon. You can only say I'm speaking oddly.

  Jordan: Exactly. You are speaking oddly. No one counts shoe-moons.

  Sam: But could there be a creature that does? If composition is just language, then a creature with different concepts lives in a world with different objects. That means reality depends on minds.

  Jordan: Or it means existence isn't a property. Kant said existence isn't a real predicate. Maybe he was right. To say something exists is just to say our quantifiers range over it. We can choose what to range over.

  Sam: But we can't choose what's real. If I walk into a wall, I hit something. The wall is composed of bricks. If I say the wall exists, I'm tracking a boundary in reality. If you say only the bricks exist, you're tracking a different boundary. But the boundary between the bricks and the mortar is physical.

  Jordan: The boundary is where the forces change. It's not where an object ends. There are no objects, only fields and particles.

  Sam: So the slime mold blob is never a unit? Even when it moves as one?

  Jordan: It's a coordinated plurality. Like a flock of birds. Is a flock an object?

  Sam: Yes. A scattered object.

  Jordan: No. It's many birds. If you say the flock is an object, you're back to unrestricted composition. If you say it's not, you're admitting some pluralities don't compose wholes. Which means composition is restricted. And if it's restricted, what's the principle? Life? Contact?

  Sam: I don't need a principle. It's all of them.

  Jordan: That's no principle. That's chaos.

  Sam: It's simplicity. One rule: any things compose something. Your view needs a rule too: only simples exist. But why are simples special? Why can't they compose?

  Jordan: Because composition leads to paradox. Vagueness. If composition is real, there must be a fact about when it happens. But with the slime mold, it's vague. They start clumping. At what exact second does the blob exist?

  Sam: There is an exact second. Maybe we don't know it, but there's a fact.

  Jordan: That's dogmatic. It's clearly vague. So either reality is vague, which is impossible, or existence is vague, which is impossible, or there's no fact of the matter.

  Sam: Or vagueness is in our representation, not the world. The blob exists at every instant. Our word blob has fuzzy boundaries.

  Jordan: But if the word is fuzzy, and existence depends on the word, then existence is fuzzy. If existence doesn't depend on the word, then the word tracks something precise. What does it track?

  Sam: The fusion. The fusion is precise. The cells are there. The sum is there.

  Jordan: You're going in circles. You say the sum exists because the parts exist. I say the parts exist but the sum doesn't. We both agree on the parts. We agree on the physics. We disagree on a word.

  Sam: Not just a word. On whether reality has structure beyond the simples.

  Jordan: Structure isn't objects. Structure is relations. The cells are related. They aren't fused.

  Sam: Fusion is just a specific relation.

  Jordan: No, fusion is identity. The whole is identical to the parts. But the parts are many. The whole is one. One cannot be identical to many.

  Sam: The whole is identical to the parts taken together. Not separately.

  Jordan: Taken together is just a way of speaking. There's no extra glue.

  Sam: And there's no extra ghost. I'm not adding glue. I'm saying the parts are sufficient for the whole.

  Jordan: Then why do we need the whole?

  Sam: Because sometimes the many act as one.

  Jordan: They act coordinately. They don't become one.

  Sam: We're stuck.

  Jordan: Yeah. But at least I don't have to believe in shoe-moons.

  Sam: And I don't have to believe chairs are illusions.

  Jordan: Chairs are useful fictions.

  Sam: And shoe-moons are useless truths.

  Jordan: I'll take the useful fiction.

  Sam: I'll take the useless truth. At least it's consistent.

  Jordan: Consistency isn't everything.

  Sam: In metaphysics, it's the only thing.

  Jordan: Maybe. But try sitting on a particle arrangement next time. See how comfortable it is.

  Sam: I'll sit on the fusion. It's wider.
