answer: |-
  You have not mangled the terms; in fact, you have identified a genuine and rather notorious structural problem in the philosophy of cognitive science. Your backend intuition is serving you well here: you are spotting a leaky abstraction that keeps getting patched rather than refactored.

  There is no single Latin phrase for this specific manoeuvre (like *ad hominem* or *straw man*), but in the philosophy of science, this is best described as a **"Degenerating Research Programme"** (a term coined by Imre Lakatos). In cognitive science specifically, it is often referred to as the **"Retreat to Inductive Bias."**

  Here is the breakdown of what is happening, where the line between sense and nonsense lies, and what to call the opposing view.

  ### 1. The Name of the Move

  The pattern you describe is a specific defence mechanism used to protect **Rationalist** claims (the idea that knowledge is innate) against **Empiricist** evidence (the idea that knowledge is learned).

  When a Rationalist claims "X is innate," and an Empiricist builds a machine that learns X from data, the Rationalist shifts the claim to: "The *capacity* to learn X is innate."

  Philosophically, this is a retreat from **specific nativism** (the content is in the head) to **general nativism** (the learning algorithm is in the head).

  While there isn't a catchy colloquial name, the most precise label is **"The Transcendental Defence."** It relies on a Kantian argument: *experience is only possible because the mind already has a structure that organises it.* Therefore, any successful learning proves the existence of that structure, which must have been there beforehand.

  ### 2. Is it Legitimate Science or Just Rhetoric?

  This is the critical edge case you asked about. You are right to suspect that this can become a "get out of jail free" card, but it is not *always* nonsense. Here is how to distinguish the legitimate version from the unfalsifiable one.

  **The Legitimate Version: The No Free Lunch Theorem**
  In machine learning, there is a mathematical theorem called the "No Free Lunch" theorem. It states that averaged over all possible problems, no algorithm performs better than any other. To learn anything specific, you *must* have an **inductive bias**. You cannot learn from data without a prior assumption about how the world works.
  *   **Why it's legitimate:** If a neural network learns grammar, it *did* rely on its architecture (the wiring). That architecture *is* a prior. Acknowledging that the architecture constrains what can be learned is a factual claim about information theory.

  **The Illegitimate Version: Unfalsifiable Shifting**
  The argument becomes a "degenerating programme" when the definition of "innate" becomes so vague it cannot be tested.
  *   **The Trap:** If every time you prove something is learnable, the opponent simply redefines the learning mechanism itself as "innate" without specifying *what* that mechanism is, they are tautological.
  *   **The Test:** To be scientific, the Rationalist must specify the bias *independently* of the outcome.
      *   *Good:* "Humans have a specific constraint that prevents them from considering grammar type Y. Therefore, they will never make error Z." (This can be tested and proven wrong).
      *   *Bad:* "Humans learned this because they have a 'language acquisition device'." (When asked what the device does, the reply is "it learns language." This explains nothing).

  **The Line:**
  The line is crossed when the "innate wiring" is only described *after* the learning happens, rather than predicting *what* can be learned beforehand. If the "wiring" is just a label for "whatever math was required to solve the problem," it is not a scientific explanation; it is a restatement of the result.

  ### 3. The "Scale Wins" Crowd

  You asked if the opposing side (the ones saying "hand-built knowledge loses to scale") has a name.

  In the history of philosophy, they are the **Empiricists** (following Hume or Locke). In modern AI specifically, this stance is best encapsulated by Richard Sutton's essay **"The Bitter Lesson."**

  Their argument is that **General Priors** (like "minimise prediction error" or "attention mechanisms") scale better than **Specific Priors** (like "English has subjects and verbs").
  *   **The Rationalist says:** You need specific innate knowledge to learn efficiently.
  *   **The Empiricist says:** You need a general learning architecture and enough compute/data. The "innateness" is just the general-purpose optimiser, not domain-specific knowledge.

  However, be careful: the "scale wins" crowd can fall into the mirror-image trap. They sometimes claim that *nothing* is innate except the ability to update weights. If you point out that the choice of architecture (e.g., a Transformer vs. an RNN) drastically changes what can be learned, they sometimes dismiss this as "just engineering details." It is not; it is exactly the "innate wiring" the other side is talking about.

  ### 4. Summary for a Backend Dev

  Since you work with systems, here is the architectural analogy:

  *   **The Claim:** "This system cannot parse JSON without a hardcoded schema." (Innate Knowledge)
  *   **The Counter:** "I built a system that infers the schema from the data." (Learning)
  *   **The Retreat:** "Your system only worked because it assumed keys are strings and values are atomic. That assumption is a hardcoded schema." (Inductive Bias)

  **Is this a valid argument?**
  *   **Yes,** if they can show that changing that assumption breaks the parser on other data sets. This proves the "assumption" is a critical dependency.
  *   **No,** if they simply call the parser's source code "innate" without explaining why that specific code was necessary compared to other possible code.

  **The Verdict:**
  You are witnessing a **Degenerating Research Programme**. The core claim ("Language is innate") is being protected from falsification by constantly pushing the "innateness" deeper into the stack (from rules -> to priors -> to architecture -> to the physics of the brain).

  It stops being science when the "innate" component is defined solely by its success, rather than by independent constraints. If you cannot describe the "wiring" without referencing the "ability" it produces, you are not doing engineering; you are writing poetry.

  In short: You haven't smushed two things together. You have correctly identified a boundary condition where a mathematical necessity (you need bias to learn) is being used as a rhetorical shield (therefore my specific theory of bias is safe). The former is true; the latter is often nonsense.
