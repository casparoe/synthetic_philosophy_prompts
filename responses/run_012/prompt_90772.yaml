answer: |-
  # Preliminary Reflection on Translation

  To make "lexical-threshold negative utilitarianism" runnable by non-philosophers in ninety minutes, we must collapse several metaphysical distinctions into operational proxies. The distinction that must survive is the **binary classification of suffering intensity**. The procedure cannot function without a definitive "Yes/No" on whether a specific harm crosses the lexical threshold. The distinction that can be dropped is the precise metaphysical nature of "enjoyment" versus "absence of suffering"; for this procedure, "benefit" is defined strictly as "reduction of suffering" or "provision of positive welfare," treated equivalently below the threshold.

  The framework's silences force three value choices disguised as criteria. First, **the location of the threshold**: The framework does not define "severe." The procedure must adopt a proxy definition (e.g., "impairs natural function" or "elicits avoidance behavior") to allow classification. Second, **the unit of account**: Is the threshold per episode or per life? I will default to "significant episode" because lifetime accounting is impossible given dossier limitations. Third, **missing data**: The framework does not say how to handle uncertainty. I will impose a precautionary principle for harms (assume worst plausible case) to align with the negative utilitarian priority on suffering. These are not empirical discoveries; they are ethical commitments required to make the math work.

  ***

  # Operational Procedure: Lexical-Threshold Welfare Assessment

  **Time Limit:** 90 Minutes
  **Required Inputs:** Certification Dossier (Scientific & Advocacy submissions)
  **Output:** Written Record for Publication

  **Step 1: Establish Baseline and Scope**
  *   **Decides:** The counterfactual state (Status Quo) against which the proposal is measured.
  *   **Input:** Description of current certification standards and the proposed change.
  *   **Sufficient Answer:** A single sentence describing the difference (e.g., "Proposal reduces space by 10% compared to Current Standard").
  *   **Stop Condition:** If the proposal changes nothing material, stop and **Permit**.
  *   **Judgment Call:** None.

  **Step 2: Inventory Harms and Benefits**
  *   **Decides:** A list of all distinct welfare effects caused by the proposal relative to the baseline.
  *   **Input:** Dossier sections on welfare impacts, health outcomes, and behavior.
  *   **Sufficient Answer:** Two lists: "Harms" (new or increased suffering) and "Benefits" (reduced suffering or increased enjoyment).
  *   **Stop Condition:** If both lists are empty, stop and **Permit**.
  *   **Judgment Call:** None.

  **Step 3: Threshold Classification (CRITICAL JUDGMENT CALL)**
  *   **Decides:** Whether each listed Harm and Benefit falls "Below Threshold" or "At/Above Threshold."
  *   **Input:** Descriptions of intensity, duration, and nature of the effect.
  *   **Sufficient Answer:** Each item tagged as `below_threshold` or `at_or_above_threshold`.
      *   *Proxy Criterion for "At/Above":* Suffering that causes prolonged avoidance, physical injury, pathology, or prevents essential natural behaviors.
      *   *Proxy Criterion for "Below":* Mild frustration, transient discomfort, or minor inconvenience.
  *   **Stop Condition:** None.
  *   **Judgment Call:** **YES.** Board members must vote on the classification of ambiguous items. Majority vote sets the classification. This step determines the ethical weight of the item.

  **Step 4: Lexical Block Check**
  *   **Decides:** Whether the proposal is immediately forbidden regardless of net benefits.
  *   **Input:** Output from Step 3.
  *   **Sufficient Answer:** Determination of "Blocked" or "Not Blocked."
  *   **Rule:** If the proposal **creates or increases** any Harm classified as `at_or_above_threshold`, AND the corresponding Benefit is exclusively `below_threshold`, the proposal is **Blocked**.
  *   **Stop Condition:** If **Blocked**, stop and **Reject**.
  *   **Judgment Call:** None (Rule application).

  **Step 5: Missing Data Protocol (CRITICAL JUDGMENT CALL)**
  *   **Decides:** How to proceed when dossier numbers (prevalence, intensity) are missing.
  *   **Input:** Identification of missing quantitative data in Step 2 or 3.
  *   **Sufficient Answer:** Assumption applied to the missing variable.
  *   **Rule:** If data on Harm intensity is missing, assume `at_or_above_threshold`. If data on Harm prevalence is missing, assume >5% of population.
  *   **Stop Condition:** If assumptions trigger Step 4 (Lexical Block), stop and **Reject**.
  *   **Judgment Call:** **YES.** This imposes a precautionary burden on producers. Board may vote to waive this for specific data points if evidence strength is "strong" that harm is low.

  **Step 6: Aggregation and Trade-off (Below Threshold)**
  *   **Decides:** Whether the remaining Below-Threshold benefits outweigh the Below-Threshold harms.
  *   **Input:** Classified lists from Step 3 (excluding any items that triggered Step 4).
  *   **Sufficient Answer:** A net welfare estimate (Positive, Negative, or Neutral).
  *   **Rule:** If Total Harms (Below) > Total Benefits (Below), **Reject**. If Benefits ≥ Harms, **Proceed**.
  *   **Stop Condition:** If Harms > Benefits, stop and **Reject**.
  *   **Judgment Call:** **YES.** "Outweigh" is not mathematical here. Board votes on whether the trade is "worth it" based on magnitude and population size.

  **Step 7: Final Verdict and Conditions**
  *   **Decides:** The binding ruling.
  *   **Input:** Results from Steps 4, 5, 6.
  *   **Sufficient Answer:** One of: `Permit`, `Permit_with_conditions`, `Reject`, `Return_to_committee`.
  *   **Rule:** If passed Steps 4-6, `Permit`. If passed with minor unresolved uncertainties, `Permit_with_conditions` (e.g., monitoring required).
  *   **Stop Condition:** End of procedure.
  *   **Judgment Call:** **YES.** Determining "conditions" is discretionary.

  ***

  # Procedure Mapping Table

  | Step | What the step decides | Input it requires | What counts as a sufficient answer | Failure mode (how this step misfires, and on what kind of case) | If the step stalls, who decides |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | The counterfactual baseline | Proposal text & Current Standards | One sentence describing the delta | Fails if baseline is ambiguous (e.g., regional variations) | Chairperson |
  | 2 | Inventory of welfare effects | Dossier evidence sections | Two lists (Harms, Benefits) | Fails if dossier conflates health with welfare | Staff Philosopher |
  | 3 | Threshold Classification | Intensity/Duration descriptions | Tag per item (`below` or `at/above`) | Fails on novel suffering types not in proxy criteria | Board Majority Vote |
  | 4 | Lexical Block Check | Step 3 Tags | Binary (Blocked / Not Blocked) | Fails if Benefit is mixed (some above, some below) | Staff Philosopher |
  | 5 | Missing Data Protocol | Gaps in quantitative data | Assumption record | Fails if dossier is entirely qualitative | Board Majority Vote |
  | 6 | Aggregation & Trade-off | Step 3 & 5 Outputs | Net welfare direction | Fails on incommensurable below-threshold types | Board Majority Vote |
  | 7 | Final Verdict | All prior outputs | Ruling string | Fails if Board is tied (no majority) | Chairperson (Tie-break) |

  ***

