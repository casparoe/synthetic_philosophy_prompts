  # Limitations and Load-Bearing Choices

  This procedure cannot resolve deep metaphysical disputes about sentience or the precise nature of consciousness; it assumes the dossier correctly identifies sentient subjects. It cannot generate data where none exists; the Missing Data Protocol (Step 5) is a policy choice, not a discovery mechanism.

  Correctly applied, this framework would likely forbid a significant portion of current industry practices, particularly those that inflict severe acute suffering (above threshold) for economic gain or minor welfare improvements (below threshold). Case C illustrates this: standard efficiency gains often trade rare severe harms for widespread mild benefits. Under lexical priority, these are forbidden regardless of the aggregate numbers.

  The most load-bearing elements are the **Proxy Criteria in Step 3** and the **Precautionary Assumption in Step 5**. The framework does not define "severe." The procedure defines it operationally (pathology, avoidance). If the board shifts this definition slightly, verdicts flip. Similarly, assuming missing harm data is "severe" is a value choice to protect animals against uncertainty. Someone had to pick that number. If the board chooses neutrality instead of precaution, the procedure permits more harm. These are not technical fixes; they are the ethical substance of the framework wearing the costume of administrative criteria. The procedure works only if the board accepts these specific value judgments as binding.
