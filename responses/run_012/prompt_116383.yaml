answer: |-
  **Project Title:** Symmetry and Skepticism: Reconstructing the No-Free-Lunch Theorems as a Problem of Invariance

  **1. The Research Question**
  The No-Free-Lunch (NFL) theorems are frequently invoked in philosophy of science as a formal vindication of Humean skepticism: without a priori assumptions, no inductive method outperforms any other. The standard rebuttal is that the theorems rely on a uniform prior over objective functions, which no rational agent holds. This proposal asks a determinate question: **Does reconstructing the NFL theorems via their sharpened permutation-closure conditions shift the problem of inductive justification from an epistemic burden (choosing a prior) to a structural one (choosing a symmetry group), and does this shift offer a novel resolution to the skepticism?**

  This is primarily a normative question about justification, but it cannot be answered without settling a formal ambiguity. Existing debates treat NFL as a statement about probability distributions. The sharpened theorems, however, show that equal average performance holds if and only if the problem class is closed under permutation. If inductive bias is recast as a commitment to specific invariances (symmetries) rather than specific probabilities, does the skeptical challenge dissolve, or is "Why this symmetry?" merely "Why this bias?" in disguise? This project aims to determine which is the case.

  **2. State of Play**
  The current literature is stuck in a dialectical loop.
  *   **The Skeptical Reading:** Proponents argue NFL formalizes Hume: without assuming the future resembles the past, learning is impossible.
  *   **The Irrelevant-Measure Reply:** Critics (often Bayesians or ML practitioners) argue the uniform measure is a straw man. Real-world problems are not drawn uniformly from the set of all functions; they have structure. Therefore, NFL is irrelevant to actual scientific practice.
  *   **The Pragmatic Deflation:** A third group accepts NFL but treats bias selection as purely pragmatic. We choose biases that work, without philosophical justification.

  All three positions miss the structural implication of the **Sharpened No-Free-Lunch Theorem** (Wolpert 1996). The theorem does not require a uniform measure; it requires that the set of target functions be closed under permutation of inputs and outputs. If the set is *not* closed (i.e., if we assume the world is invariant under certain transformations but not others), free lunch becomes possible.

  The gap in the literature is the failure to connect this closure condition to the Goodmanian "Grue" problem. The distinction between "green" and "grue" is not merely probabilistic; it is a disagreement over which time-dependent transformations preserve predicate meaning. Current debates focus on *credences* over hypotheses. The symmetry reconstruction suggests the fundamental commitment is to *invariance groups*. While some learning theorists have noted the link between bias and symmetry, no philosophical work has rigorously evaluated whether this structural framing resolves the justificatory regress or merely relocates it.

  **3. Methodology and Plan**
  This is a six-month project in formal-conceptual analysis. I will not be proving new theorems; rather, I will map existing formal results onto the philosophical problem of induction to evaluate their normative force. My background in computer science allows me to interpret the learning-theoretic formalism without reducing the philosophical nuance to technicalities.

  *   **Months 1–2: Formal Reconstruction.** I will formalize the link between the permutation-closure condition in NFL and Goodman's projectibility problem. The goal is to show that treating "green" as projectible is equivalent to assuming the problem class is not closed under specific time-indexed permutations. This establishes the "symmetry reconstruction."
  *   **Months 3–4: Normative Evaluation.** I will analyze whether justifying a symmetry group is easier than justifying a prior. Does appealing to natural kinds or physical laws provide a non-arbitrary basis for symmetry selection? I will test this against the "relocation objection" (that choosing symmetries is just as arbitrary as choosing biases).
  *   **Months 5–6: Case Study and Drafting.** I will examine how inductive biases are justified in modern machine learning literature (e.g., convolutional neural networks relying on translation invariance). Do practitioners appeal to symmetries explicitly? Does this practice support the philosophical reconstruction? I will synthesize this into a draft paper.

  **4. Deliverables**
  *   A complete draft manuscript (approx. 8,000 words) suitable for submission to a journal such as *Philosophy of Science* or *British Journal for the Philosophy of Science*.
  *   A presentation of the preliminary findings for the department's work-in-progress series.

  **5. Risk and Scope**
  **Risk of Triviality:** The primary risk is that the symmetry reconstruction turns out to be merely terminological. If "assuming translation invariance" is logically equivalent to "assigning high prior probability to translation-invariant functions," then the project merely relabels the theorem without advancing the debate.
  *   *Mitigation:* I will explicitly define success as demonstrating a *conceptual* advantage, even if the extensional output is similar. If the symmetry language clarifies *why* certain biases are stable across different probabilistic models, that is a result. Even a negative conclusion (that the mystery is merely relocated) is a valuable contribution that halts a misguided research avenue.

  **Scope Management:** Six months is insufficient to build a full theory of symmetries in science.
  *   *Minimal Viable Project:* If the normative evaluation proves too complex, I will scale back to a rigorous exegesis of the Sharpened NFL theorem's implications for the Grue problem alone. Establishing that NFL is fundamentally about permutation closure rather than uniform priors is a necessary corrective to the literature, even without a full resolution of the justification problem.
  *   *Expansion:* If the link proves robust, the long-term goal is a dissertation chapter on structural realism in machine learning, but this seed grant focuses strictly on the induction/NFL interface.

  This project is feasible because it leverages my dual training: I can parse the learning theory correctly (avoiding the errors common in purely philosophical treatments) while focusing on the epistemic implications (avoiding the deflationism common in CS). The result will clarify whether the "No Free Lunch" is a dead end for justification or a signpost pointing toward symmetry.
