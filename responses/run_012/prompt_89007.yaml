answer: |-
  The Vane family reunion is the only gathering on earth where every man present is simultaneously an assassin and a target.

  Young Arthur slammed his napkin down. "I'm switching to Many-Worlds this time. I kill Grandfather, I branch. I exist in Timeline B, he dies in Timeline A. No erasure, no paradox."

  His father, who was currently nursing a scar inflicted by Arthur's future son, didn't look up from his roast. "Who gave you the chronometer, Arthur?"

  "Great-Grandfather."

  "And who gave it to him?"

  "He said he found it in the safe."

  "Exactly. It's a bootstrap loop. The device has no point of creation. It just *is*. If you branch, you sever the loop. You arrive in the past with a machine you never inherited, driven by a motive that never formed. You're not a traveler, son. You're a plot hole."

  Arthur slumped. "So I have to fail again?"

  "You have to be consistent," his father said. "Novikov doesn't care about your intent. It cares about the closed curve. If you succeed, you don't leave. Since you're here, you won't succeed."

  "But why the urge?" Arthur asked. "Why do we try?"

  "Because the compulsion is part of the loop too," his father said. "No origin. Just like the machine. We try to kill them to ensure they survive to send us back."

  Arthur looked at his grandfather across the table, who was carving the roast with a hand that had once held a gun against him.

  "So we're not assassins," Arthur said.

  "No," his father said. "We're alibis. The attempt proves the survival. The family is its own alibi."

  Arthur raised his glass. "To heredity."

  "To consistency," his father corrected.

  They drank, safe in the knowledge that the gun would jam—not a malfunction, but an inheritance.
