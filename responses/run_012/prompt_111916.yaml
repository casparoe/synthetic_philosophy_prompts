answer: |-
  ### Verdicts on the Three Losses

  **Integration: Fail.**
  The apparatus coordinating decisions across the Southern Lowlands—the network of royal courts, the flow of tribute between centers, and the monopolization of violence by the *k'uhul ajaw* (divine lords)—dissolved. Monumental construction ceased, dynastic records stopped, and the hierarchical network fragmented into smaller, uncoordinated units.
  *Condition for Reversal:* You would need evidence that a successor regime immediately occupied the same territorial scope and maintained the same tributary flows, even under new management. If the Tikal polity had been absorbed intact into a expanding Calakmul empire without disruption to the tribute pipeline, Integration would hold.

  **Reproduction: Fail (with reservation).**
  The demographic capacity to sustain the previous urban density and standard of living collapsed. The Southern Lowlands went from high-density urban centers to dispersed rural populations. While people remained, the *capacity* to sustain the previous sociometabolic throughput (the urban standard) was lost.
  *Condition for Reversal:* If population counts and caloric intake estimates remained stable despite the political change. If the cities were abandoned but the hinterlands maintained the same population density and trade access, Reproduction would hold.

  **Legitimation: Fail (locally), Hold (regionally).**
  The specific symbolic order validating the Southern Lowland polities—the divine kingship ideology that tied specific dynasties to cosmic order—collapsed. However, Maya cosmology, calendar systems, and ritual practices persisted in the North and Highlands and among the commoners who remained in the South.
  *Condition for Reversal:* If the incoming or remaining populations continued to recognize the authority of the old dynastic symbols or if the new local leaders successfully claimed the exact same sacral legitimacy as the predecessors without interruption.

  ### Slow vs. Fast Variables

  In your decomposition, **Legitimation** is typically the slow variable (cultural deep structure), while **Integration** is the fast variable (political apparatus). **Reproduction** is intermediate, bound by ecological time.

  The Maya case **inverts** this ordering. Integration and Legitimation failed simultaneously and rapidly. Because the integration mechanism *was* the legitimation mechanism (the King *was* the ritual pivot), the political network could not survive the ideological crisis. When the droughts undermined the King's claim to control rain (Legitimation), the tribute network (Integration) evaporated instantly. Reproduction was the slowest variable; the population declined over centuries, lagging behind the political and symbolic dissolution. This suggests your decomposition must account for cases where Integration and Legitimation are ontologically identical rather than functionally distinct.

  ### Where the Decomposition Misdescribes the Case

  **1. The Presupposed State.**
  Your first category (Integration) presupposes a "credible monopoly on violence" and a territorial apparatus akin to a Weberian state. The Southern Lowland polities were never states in this sense; they were hegemonic networks centered on ritual capitals. They did not administer territory; they attracted it. To say Integration "failed" implies it existed in the form you describe. It is more accurate to say the *network topology* changed from centralized hubs to dispersed nodes. The decomposition risks anachronism by importing a statist ontology into a segmentary society.

  **2. Functionalism in Legitimation.**
  You ask if the third category smuggles in functionalism. Yes. By treating Legitimation as a loss that *allows* us to see arrangements as necessary, you imply its function is to stabilize Integration. In the Maya case, the symbolic order was not a support structure for the polity; the polity was an enactment of the symbolic order. When the rituals stopped working (due to drought), the polity didn't lose support; it lost its *reason for being*. The decomposition treats Legitimation as the glue, whereas for the actors, it was the substance.

  **3. The Separation Question.**
  Does splitting Legitimation from Integration beg the question? In this case, absolutely. For the Classic Maya, the Calendar (Integration) was the Order of the World (Legitimation). To separate them is to impose an analytic distinction that did not exist in the social ontology of the agents. Your decomposition works best for secular bureaucracies where administration is distinct from ideology. It struggles with sacral kingships where the administrator is the god.

  **4. Silence on Scale.**
  The decomposition has nothing to say about nested identities. The "Southern Lowland Polity" collapsed, but "Maya Society" did not. Your definition of collapse requires that "no successor can reoccupy the old position." The Northern Maya reoccupied the *cultural* position, but not the *political* position. The decomposition forces a binary choice on a scalar problem. It cannot distinguish between the death of a regime, the death of a polity, and the death of a culture without external stipulation.

  ### Contrast with Alternative Framings

  **Marginal Returns on Complexity (Tainter).**
  Tainter's framing gets the *mechanism* that yours lacks. It explains *why* Integration failed (the cost of maintaining the royal network exceeded the yield). Your decomposition describes the morphology of the loss; Tainter describes the economic logic driving it. However, Tainter reduces Legitimation to a cost factor, missing the ontological weight it carries in your model.

  **Ecological-Informational Cycle (Panarchy/Resilience).**
  This framing gets the *continuity* that yours risks obscuring. By viewing collapse as a "release phase" leading to reorganization, it accommodates the survival of Maya culture in the North and the rural South. It treats the system as adaptive rather than binary (fail/hold). Your decomposition is better at isolating specific normative losses (Legitimation), but Panarchy is better at explaining why the system persisted despite those losses.

  ### General Lesson for Social Ontology

  The honest answer is that **nothing strictly individuates a society** in a way that allows for a binary verdict on existence. Societies are not natural kinds; they are projective entities sustained by narrative continuity. We say a society has ceased to exist when the narrative thread we privilege (dynastic succession, urban density, cultural identity) is severed.

  For the collapse literature, this implies that "collapse" is not an event in the world but a change in the categorization scheme used by observers (both contemporary and modern). If nothing individuates a society, then collapse literature is not studying the death of organisms, but the failure of specific descriptions to map onto reality. The ontological lesson is that we must stop asking "Did the society collapse?" and start asking "Which description of the society has lost its purchase?"

  Verdict: mixed | primary loss: integration | decomposition survives: qualified
