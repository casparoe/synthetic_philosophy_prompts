answer: |-
  Here is the ranking from "standing annihilated" to "standing barely scratched," based on how fundamentally they sever the moral authority required to blame.

  **(a) Plain Hypocrisy**
  You forfeit your authority to enforce a norm you are actively violating yourself.

  **(b) Complicity**
  Your hands are too dirty to claim the moral high ground, even if you aren't the primary offender.

  **(c) Meddling**
  You lack the relational stake or jurisdiction required to enter the moral conversation at all.

  **(d) You Don't Actually Care**
  Your insincerity turns moral correction into a self-serving power play rather than a demand for accountability.

  **(e) Proxy Blame**
  Your anger is misdirected, making the blame emotionally dishonest even if the target did something wrong.

  **(f) Borrowed Blame**
  You are unauthorized to speak for the victim, rendering your intervention paternalistic rather than just.

  **(g) Right Verdict, Garbage Reasoning**
  The accusation remains factually true even if your personal motivation for making it is selfish or flawed.

  ***

  ### Follow-Up 1: The Mergers
  You're right to suspect some of these are twins in different costumes. Conceptually, they collapse into three distinct categories of defeaters:

  1.  **The "No Stake" Cluster (c & f):** Meddling and Borrowed Blame are the same thing: you lack the **jurisdiction** to speak. Whether it's because it's "none of your business" or because you're speaking for someone who didn't ask, you aren't a relevant party.
  2.  **The "Dirty Hands" Cluster (a & b):** Hypocrisy and Complicity are the same thing: you have jurisdiction, but you've **forfeited your authority** by participating in the wrong.
  3.  **The "Bad Motive" Cluster (d, e, & g):** Not caring, Proxy Blame, and Garbage Reasoning are all about the **quality of your engagement**, not your right to engage. These attack the sincerity or logic of the blame, not the standing itself.

  **The Redrawn Ranking:**
  1.  **No Stake (c, f):** Kills standing dead because you were never in the room to begin with.
  2.  **Dirty Hands (a, b):** Kills standing dead because you were kicked out of the room for breaking the rules.
  3.  **Bad Motive (d, e, g):** Barely makes a dent; you're still allowed in the room, you're just being annoying or illogical.

  ***

  ### Follow-Up 2: The Imposter & The Revenge Clause
  **Which one isn't about standing?**
  **(g) Right Verdict, Garbage Reasoning** is the imposter. Standing is about *who* is speaking; this scenario is about *why* they are speaking. If the verdict is right, the blame is **accurate and fitting**, even if your reasoning is selfish. This drops it to the very bottom (or off the list entirely), because you haven't lost the *right* to blame, you've just offered a bad argument.

  **Does the order shift if they did it to you?**
  Yes, drastically. If the person you're blaming has wronged *you*, the **"No Stake" Cluster (c & f)** evaporates instantly. It is now your business, and you no longer need to borrow anyone's voice.

  However, the **"Dirty Hands" Cluster (a & b)** largely remains. Even if someone stole from you, you still lose standing to condemn them for stealing if you are currently stealing from others (though your victimhood might mitigate the hypocrisy slightly, it rarely erases it). The **"Bad Motive" Cluster** stays put; being wronged doesn't give you a pass to be insincere or illogical, but it does make your anger more fitting.

  **The Verdict for Your Mate:**
  If you want to win the argument, focus on the distinction between **authority** (Standing) and **accuracy** (Truth). Hypocrisy and Meddling kill authority; Garbage Reasoning just makes you a jerk with a valid point.
