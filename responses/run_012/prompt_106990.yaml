answer: |-
  This is an exceptionally sharp observation. You have identified a structural fault line in consequentialist ethics that is distinct from, though intimately related to, the more famous puzzles you mentioned.

  There is no single, universally standardized proper noun for this specific configuration (like "The Gettier Problem" in epistemology), but in contemporary normative ethics, it is most precisely discussed under the heading of **The Aggregation Problem** (specifically regarding **micro-harms** or **trivial harms**). In the context of thought experiments, it is often referred to as the **"Torture vs. Dust Specks"** problem (a framing popularized by Eliezer Yudkowsky, though the philosophical pedigree belongs to Derek Parfit and Frances Kamm).

  Below is a carving of the concept, the names for the resistance strategies you identified, how it differs from the Repugnant Conclusion, and an analysis of the probabilistic variant.

  ---

  ### 1. Naming the Configuration

  The core puzzle is **The Problem of Aggregating Trivial Harms**.

  It sits within the broader literature on **Spectrum Arguments** (Parfit). A spectrum argument takes a sequence of cases where each step involves a negligible change (e.g., one less person, one slightly less intense pain), yet the endpoints seem intuitively incomparable (e.g., universal mild annoyance vs. one person's torture).

  While the **Repugnant Conclusion** is the most famous spectrum argument, it concerns *population ethics* (many lives barely worth living vs. few excellent lives). Your case concerns *harm distribution within a fixed population* (or across existing persons). A closer cousin in the literature is **Parfit's "Mere Addition Paradox,"** but even that focuses on the value of adding lives, not the summation of pains.

  The specific clash you describe—where the mathematical sum of trivialities conflicts with the lexical priority of severe suffering—is often framed as a challenge to **Unrestricted Aggregation**.

  ### 2. Naming the Resistance Strategies

  You identified four distinct ways philosophers resist the aggregative conclusion. Each has a established theoretical home:

  #### A. "Persons are separate; experiences do not form one pool."
  *   **Name:** **The Separateness of Persons Objection.**
  *   **Proponents:** John Rawls, Robert Nozick, T.M. Scanlon.
  *   **Theory:** **Contractualism** (Scanlon) or **Rights-based Deontology** (Nozick).
  *   **Mechanism:** This view denies that the "social good" is a distinct entity that can be maximized. For Scanlon (*What We Owe to Each Other*), moral justification must be acceptable to each individual. An individual burdened by torture has a reasonable rejectability that an individual burdened by a dust speck does not. You cannot "cancel out" one person's veto with the mild preferences of millions.
  *   **Distinction:** This is not just a claim about thresholds; it is a claim about the *unit of moral accounting*.

  #### B. "Harms below a threshold have zero weight."
  *   **Name:** **The Threshold View** or **Non-Aggregationism.**
  *   **Proponents:** Frances Kamm (*Intricate Ethics*), Michael Otsuka.
  *   **Theory:** **Deontological Consequentialism** or **Moderate Deontology.**
  *   **Mechanism:** Kamm argues for a **Principle of Permissible Harm** that includes a threshold. Harms below a certain severity (the *de minimis* level) cannot be aggregated to outweigh a harm above the threshold. This creates a **Lexical Priority** of severe harms over trivial ones.
  *   **Distinction:** Unlike the Separateness objection, this view *might* allow aggregation if everyone is above the threshold (e.g., breaking many arms to save one life), but it draws a hard line at the "trivial" level.

  #### C. "The aggregative pull is a cognitive illusion."
  *   **Name:** **Psychological Incommensurability** or **Scope Insensitivity.**
  *   **Proponents:** Behavioral Ethicists, some Psychological Utilitarians.
  *   **Theory:** **Debunking Explanation.**
  *   **Mechanism:** This view suggests our intuition that "torture is worse" is a heuristic failure. Human psychology is not evolved to comprehend large numbers (psychophysics of pain). We feel the intensity of torture vividly but cannot vividly imagine $3^{^^^}3$ itches. Therefore, the intuition is unreliable, and we should trust the math.
  *   **Distinction:** This is the *consequentialist defense*. It accepts the aggregation but explains away the resistance as bias.

  #### D. "The two cases lie on different scales."
  *   **Name:** **Value Pluralism** or **Incommensurability.**
  *   **Proponents:** Joseph Raz, Ruth Chang.
  *   **Theory:** **Axiological Pluralism.**
  *   **Mechanism:** This denies that "utility" is a single homogeneous substance. "Integrity" and " Annoyance" are different *kinds* of value/disvalue. There is no common currency to sum them. To ask if $N$ itches equal one torture is a category mistake, like asking if 5 kilograms of sadness is heavier than 2 meters of justice.
  *   **Distinction:** This is a metaphysical claim about value, not just a procedural rule about counting.

  ### 3. Distinctions from Related Concepts

  You suspected these concepts were close but not quite it. Here is the precise boundary work:

  | Concept | Relation to Your Puzzle | Key Difference |
  | :--- | :--- | :--- |
  | **The Repugnant Conclusion** | **Cousin.** Both involve summing small units vs. large units. | Repugnant Conclusion is about *total welfare across populations* (A+ vs. Z). Your puzzle is about *harm distribution* (often within a fixed set of people). The Repugnant Conclusion concludes the many small positives *win*; your puzzle questions if the many small negatives *win*. |
  | **Separateness of Persons** | **The Argument, not the Puzzle.** | This is the name of the *objection* (Strategy A above), not the name of the thought experiment itself. Nozick uses this to attack utilitarianism; your puzzle is the terrain on which that battle is fought. |
  | **Lexical Priority** | **The Solution, not the Puzzle.** | Rawls uses lexical priority for *liberties*. Kamm applies it to *harms*. This is the formal structure of Strategy B, but it doesn't name the intuitive clash itself. |
  | **Taurek's "Should the Numbers Count?"** | **Radical Version.** | John Taurek (1977) argued numbers *never* count (flip a coin to save 1 vs. 5). Your puzzle is subtler: it asks if numbers count when the *quality* of harm differs drastically, not just the quantity of people. |

  ### 4. The Probabilistic Version

  The second version you describe (tiny probabilities of serious harm vs. certain serious harm) is a distinct but parallel phenomenon found in the literature on **Risk Ethics** and **Distributive Justice**.

  *   **Name:** **The Aggregation of Risks** or **Ex Ante vs. Ex Post Prioritarianism.**
  *   **The Conflict:**
      *   **Ex Post View:** Look at the outcome. In the end, $N$ people will die. This is equivalent to $N$ certain deaths. Aggregation holds.
      *   **Ex Ante View:** Look at the individual prospect. Each person faces a negligible risk. No individual has a strong complaint ("My risk only went up by 0.00001%"). Therefore, the collective complaint is weak.
  *   **Is it the same phenomenon?** It is a **structural isomorph**. It tests whether moral weight attaches to *expected utility* (which aggregates linearly) or *individual burden* (which might have thresholds).
  *   **Key Literature:** Look for work by **Matthew Hanser** ("The Metaphysics of Risk"), **Stephen Perry**, or **Finkelstein**. They discuss whether imposing a risk is a harm in itself. If a risk is below the threshold of perceptibility, does it count as a harm at all? If not, a million imperceptible risks might sum to zero, just like the itches.

  ### 5. Boundary Conditions and Definition

  If you need to define this for a paper, here is a precise carving:

  **Definition:** The **Micro-Harm Aggregation Puzzle** arises when a moral theory implies that a sufficiently large number of sub-threshold harms (harms too trivial to warrant individual complaint) morally outweighs a supra-threshold harm (a harm severe enough to warrant absolute priority), despite the intuition that the severe harm is lexically superior.

  **Boundary Cases:**
  1.  **Must the harm be "tiny"?** Yes. If the small harm is "a broken finger," aggregation seems more plausible. The puzzle relies on the *de minimis* nature of the unit harm.
  2.  **Does it apply to benefits?** Yes. This is the **Repugnant Conclusion** (many trivial joys vs. one sublime life). However, the *harm* version is often considered more urgent because preventing suffering is usually weighted heavier than creating pleasure (Negative Utilitarianism leanings).
  3.  **Must the number be infinite?** No. The puzzle works with finite but large numbers (e.g., 3^^^3, or simply "all humans on earth"). Infinity introduces mathematical complications (transfinite arithmetic) that obscure the moral intuition.
  4.  **Is the probabilistic version the same?** It is a **cousin**. It shares the structure of *Linear Aggregation of Units vs. Thresholded Individual Burden*. However, it introduces the metaphysical question of whether "risk" is a harm. In the itch case, the harm is real (the itch happens). In the risk case, the harm is hypothetical (the death might not happen).

  ### Recommended Reading for Your Seminar

  To ground this in your seminar discussions, I recommend citing these specific works:

  1.  **Frances Kamm, *Intricate Ethics* (2007):** Specifically her discussion on "Aggregation and the Separateness of Persons." She offers the most robust defense of the Threshold View (Strategy B).
  2.  **T.M. Scanlon, *What We Owe to Each Other* (1998):** Chapter 5. This is the definitive source for the "Individual Complaint" model (Strategy A).
  3.  **Derek Parfit, *Reasons and Persons* (1984):** Part IV. While famous for the Repugnant Conclusion, his discussion of "Spectrum Arguments" provides the logical skeleton for your puzzle.
  4.  **John Taurek, "Should the Numbers Count?" (*Philosophy & Public Affairs*, 1977):** The seminal paper that forced ethicists to confront whether we sum harms at all.
  5.  **Larry Temkin, *Inequality* (1993):** Temkin explores spectrum arguments extensively and argues *for* the aggregative view (that the many itches *do* outweigh the torture), challenging the intuition directly.

  **Summary for your purposes:**
  You are discussing the **Micro-Harm Aggregation Puzzle**. The resistance strategies are **Contractualist Non-Aggregation** (Scanlon), **Threshold Deontology** (Kamm), **Value Pluralism** (Raz), and **Psychological Debunking**. The probabilistic version is the **Ex Ante Risk Aggregation Problem**. It is distinct from the Repugnant Conclusion but shares its spectral logic.
