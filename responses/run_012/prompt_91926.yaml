answer: |-
  This is a sophisticated objection, and your intuition is spot on: your cousin's *reductio* fails, but not for the reason you initially suspected. You don't need to drop (1), and you are right to hold onto (2).

  The argument you've presented is essentially a reconstruction of the debate between **Moral Generalists** (who believe in invariant principles) and **Moral Particularists** (like Jonathan Dancy, who defend holism). Your cousin is attempting to use a "Parity Argument" to show that if Particularism is true for morality, it must be true for everything, and if it's true for everything, normative reasoning collapses into nihilism.

  Here is the diagnosis of where the argument breaks, why it looks innocent, and what the actual cost of the particularist position is.

  ### 1. The Damage is in the Hidden Premise
  The formal steps (1) through (6) are actually a valid reconstruction of the Particularist's own position. A committed Particularist would nod along to all of them. The disaster happens in the **Parity/Reductio move** your cousin adds at the end.

  The cousin argues:
  > *If (4) generalizes to every domain... by (1) that just means no consideration is a reason for anything.*

  This inference relies on a hidden, unstated premise. Let's call it the **Invariance Requirement**:
  > **(H) A consideration can only count in favor of an action (be a reason) if it does so in virtue of a true general statement.**

  Your cousin is assuming that for something to be a *reason*, it must be a *generalizable reason*. He is conflating **Normative Force** (this counts in favor *here*) with **Invariant Valence** (this *always* counts in favor).

  *   **Why it looks innocent:** It appeals to our desire for consistency. We want reasons to be stable. If "pain is bad" is true today but false tomorrow, it feels like "pain is bad" wasn't really a reason at all.
  *   **Why it's false:** It begs the question against the Particularist. The Particularist definition of a reason is simply "a consideration that counts in favor in *this* context." It does not require that the consideration *would have* counted in favor in a *different* context.

  **The Fix:** You reject the Invariance Requirement. You can accept that (4) is true for epistemic, prudential, and moral domains (Holism is universal) without accepting that "no reasons exist." You simply conclude that **all reasons are context-dependent.**

  ### 2. Why Step (2) is Safe (and Step (4) is the Battleground)
  You mentioned you'd sooner give up (1) than (2). That is the correct instinct.
  *   **(1)** is a standard definition.
  *   **(2)** is **Reason Holism**. It is phenomenologically robust. (e.g., "I promised" is usually a reason to act, but not if the promise was extracted under duress, or if keeping it causes catastrophe).

  The real fight is over **(4)**.
  *   **Generalists** say (4) is false. They argue there *are* exceptionless principles (perhaps with *ceteris paribus* clauses).
  *   **Particularists** say (4) is true. There are no exceptionless principles.

  Your cousin's *reductio* tries to force you to choose between (4) and "Reasons exist." But that's a false dilemma. The choice is actually between:
  1.  **Reasons exist + Invariant Principles exist** (Generalism)
  2.  **Reasons exist + No Invariant Principles exist** (Particularism)

  Your cousin is asserting that Option 2 is impossible. He is wrong. A consideration can be a reason in a specific case without being a reason in all cases. The epistemic parallel proves this: "It looks red" is a reason to believe "It is red," *unless* I know there are red lights shining on it. The reason exists, but its valence is defeasible. That doesn't mean "It looks red" is never a reason.

  ### 3. The Bill: What do you pay to keep (2)?
  If you side with the Particularist and reject your cousin's *reductio*, what is the cost? You asked what the bill is if you cut the bad step (the Invariance Requirement).

  **1. Loss of Codifiability:**
  If there are no general principles (4), you cannot write a moral rulebook. You cannot teach ethics via a set of algorithms ("If X, do Y"). Morality becomes a skill of perception (*phronesis*) rather than a system of deduction.

  **2. Loss of Public Justification:**
  Principles allow us to justify actions to others easily ("I did it because of Rule R"). Without principles, justification requires narrating the specific context to show why the reasons weighed as they did. This makes moral disagreement harder to resolve.

  **3. The Threat of Arbitrariness:**
  This is your cousin's underlying fear. If reasons aren't anchored in general laws, isn't moral judgment just subjective whim?
  *   **The Particularist Reply:** No. Context-dependence is not subjectivity. Two rational agents with full information about the context should still converge on the same verdict, even if they can't cite a general law that covers it. The structure is in the *situation*, not in the *rule*.

  ### 4. Is there a surviving version of the argument?
  Your cousin's *reductio* (Particularism $\rightarrow$ Nihilism) collapses. However, a weaker **Parity Argument** survives and is actually quite powerful, though it doesn't prove Particularism *false*.

  **The Surviving Argument:**
  1.  Epistemic reasoning (reasons for belief) is clearly holistic (context-dependent).
  2.  If epistemic reasoning can be holistic without collapsing into nihilism, then moral reasoning can be holistic without collapsing into nihilism.
  3.  Therefore, the mere fact that moral reasons are holistic is not a reason to reject Particularism.

  This turns your cousin's weapon against him. Instead of showing Particularism is absurd, the parity shows that **Holism is a standard feature of rationality**, not a bug unique to morality that leads to disaster.

  ### Summary for your Cousin
  You can tell him this:
  1.  **The Error:** You are conflating "being a reason" with "being an invariant reason."
  2.  **The Counter:** Epistemic reasons are holistic (evidence can be defeated), yet we still have knowledge and justified belief. Therefore, Holism does not entail Nihilism.
  3.  **The Concession:** You are right that if we accept Particularism, we give up the dream of a moral calculus. But that is a feature of the moral landscape, not a logical contradiction.

  **Verdict:** Keep (2). Reject the hidden Invariance Requirement in the *reductio*. The argument fails to disprove Particularism, but it successfully highlights that the cost of Particularism is the loss of moral principles as "exceptionless laws." Your cousin has proven that Particularism is *demanding*, not that it is *false*.
