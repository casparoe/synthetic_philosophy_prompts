  2.  **Deconstruct Maya's Argument (The Law-and-Econ Model):**
      *   *Core Text:* Gary Becker's "Crime and Punishment: An Economic Approach" (1968).
      *   *Logic:* Criminals are rational utility maximizers. They weigh benefits vs. costs. The state sets the cost (price) to influence behavior. Efficiency is the goal.
      *   *Mapping:*
          *   Price = Expected Penalty (Probability $\times$ Severity).
          *   Buyer = Offender.
          *   Seller = The State (monopoly on violence/sanction).
          *   Good = The "right to commit the crime" (or license to offend).
          *   Market = The criminal justice system.
          *   Demand Curve = The responsiveness of crime rates to penalty changes.

  3.  **Identify the Breaks (Disanalogies):**
      *   *Permission vs. Prohibition:* Paying a price usually grants a right (buying an apple gives you the apple). Paying a penalty admits a wrong but doesn't grant a right to do it again. (The "Tax vs. Fine" distinction).
      *   *Censure/Moral Condemnation:* Prices are morally neutral. Punishment carries stigma and moral blame.
      *   *Incommensurability:* Some harms (murder, rape) cannot be meaningfully "priced" without trivializing the victim's suffering.
      *   *Rationality:* Not all offenders are rational calculators (crimes of passion, addiction, mental illness).
      *   *Supply Side:* In a market, the seller wants to sell. The State *doesn't* want to punish; it wants to prevent the need for punishment.
      *   *Distribution/Fairness:* Markets care about efficiency. Justice cares about proportionality and fairness (treating like cases alike).

  4.  **Evaluate the "Threatening" vs. "Colorful" Disanalogies:**
      *   *Colorful:* The State isn't literally a shopkeeper. (Doesn't change the math).
      *   *Threatening:*
          *   *Permission:* If punishment is just a price, rich people can "buy" the right to harm. This undermines the normative force of law.
          *   *Censure:* If we ignore desert, we lose the communicative function of punishment (telling society this is *wrong*, not just *costly*).
          *   *Rationality:* If offenders aren't rational, the lever doesn't work as predicted.
          *   *Supply Side:* If the state profits or becomes efficient at punishing, it might have perverse incentives to punish more, not less.

  5.  **Assess the Conclusion ("Desert is a distraction"):**
      *   Does the price metaphor carry this conclusion? Yes. If it's just a market, morality is external.
      *   Does the conclusion survive the breaks? No. Once you acknowledge punishment is about *blame* and *rights*, desert becomes central. You can't optimize murder away by pricing it if the pricing itself violates rights or fails to condemn.
      *   *Key Insight:* The price model treats crime as a *tort* (cost imposition) rather than a *crime* (public wrong).

  6.  **Propose a Better Analogy:**
