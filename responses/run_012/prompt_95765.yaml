  8.  **Final Polish:** Check against all constraints. (No citations, identify the crowd, answer the payoff question). Ensure the distinction between "expected penalty" and "moral blame" is clear.

      *(Final check on the "Better Analogy")*: The "Moral Debt" or "Censure" analogy is good, but maybe the **"Immune System"** analogy works for the societal protection angle without the market baggage? No, "Censure" is better for the *seminar* context which likely touches on sociology/philosophy. Let's suggest the **"Communicative/Censure"** model.

