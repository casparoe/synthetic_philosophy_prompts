      *(Self-Correction during drafting)*: Make sure to emphasize the "Tax vs. Fine" distinction. That's the killer argument against the price model. If I pay a parking fee, I can park. If I pay a parking *fine*, I wasn't supposed to park. Maya's model blurs this.

      *(Refining the "Supply Side" point)*: In a market, the seller benefits from the transaction. In punishment, the state incurs a cost to punish. This changes the incentive structure fundamentally.

