answer: |-
  You are right, and your friend is mangling Zahavi. The "jargon as handicap" theory is a seductive analogy, but it collapses under scrutiny because it fundamentally misunderstands the evolutionary function of costly signaling. While your friend sees academic obscurity as a peacock's tail, it is actually closer to a smoke screen.

  To see why your friend's reading fails, we have to look at what the Handicap Principle actually does. Amotz Zahavi's theory was designed to solve a specific problem: how can communication remain honest when the sender has an incentive to lie? A gazelle stotting (jumping high) in front of a cheetah is signaling, "I am so fit I can waste energy." A peacock growing a massive tail is signaling, "I have such good genes I can survive despite this burden."

  For a handicap to work as a biological signal, three conditions must be met:
  1.  **The cost must be real.** It must reduce the sender's survival chances if they aren't high-quality.
  2.  **The signal must be honest.** Low-quality individuals literally cannot afford to fake it.
  3.  **The receiver must benefit.** The observer gains accurate information about the sender's quality.

  Academic obscurity fails on all three counts, which is why it doesn't deserve the name "Handicap Principle."

  **First, the cost structure is inverted.**
  In Zahavi's model, the signal is costly to *produce*. A heavy tail requires calories and makes you slower. In academic writing, obscurity is often cheap to produce. It is frequently easier to write a convoluted, jargon-heavy sentence than a clear, precise one. Clear writing requires deep understanding and rigorous editing; obfuscation often requires only laziness or a thesaurus. If the "handicap" is actually the path of least resistance for the sender, it cannot function as a signal of quality. It signals nothing other than the ability to mimic a specific dialect.

  **Second, it violates the honesty condition.**
  The whole point of a biological handicap is that it makes deception impossible. A weak peacock cannot grow a vibrant tail. However, academic jargon is famously easy to fake. This is the essence of the "Sokal Affair," where a physicist submitted a nonsense paper filled with trendy postmodern jargon to a cultural studies journal, and it was accepted. If low-quality work can pass the "gauntlet" simply by dressing up in expensive-sounding words, the signal is not honest. It is noise. A true handicap reveals underlying fitness; academic obscurity often hides underlying incompetence.

  **Third, and most importantly, the receiver does not benefit.**
  In evolutionary signaling, the receiver (the peahen, the predator) gains valuable information that helps them make a decision. If academic writing were a true handicap signal, the difficulty of reading it would provide the peer reviewer or reader with reliable data about the author's intellect. But it doesn't. It imposes a cognitive tax on the reader without guaranteeing a return on investment. The reader ends up less informed, not more. When a signal harms the receiver's ability to assess quality, it isn't signaling; it's sabotage.

  So, if it isn't the Handicap Principle, what is it?
  Your intuition about "guild gatekeeping" is closer to the mark, but even that is too generous. In economics, this is better described as **rent-seeking behavior** or **information asymmetry**.

  Professions often develop specialized languages to increase efficiency among insiders (shorthand). That is useful. But when that language becomes needlessly opaque to outsiders, it functions as a barrier to entry designed to protect the guild's status and resources. This isn't signaling quality; it's creating a monopoly on comprehension. It's a moat, not a badge.

  Your friend argues that getting through the text proves you "survived the gauntlet." That describes a **screening mechanism** (like a hazing ritual), not a **signaling mechanism**. In a screening model, the principal (the university) sets a hurdle to filter agents (the students). But even then, hazing is about compliance, not quality. The Handicap Principle is about *intrinsic* quality (genes, health, strength). Surviving a gauntlet of bad writing proves only that you have high tolerance for boredom or high motivation to conform, neither of which correlates strongly with intellectual brilliance.

  **The Verdict**
  You should stand your ground. The Handicap Principle explains why signals are *reliable*. Academic obscurity makes signals *unreliable*. Calling it a handicap is a category error that confuses a biological mechanism for honesty with a sociological mechanism for exclusion.

  If academic writing were truly following Zahavi's logic, the "cost" would be something that only a brilliant researcher could afford—perhaps publishing raw data openly, or replicating one's own study before publication. Those are costly actions that prove quality. Writing in impenetrable prose is just a cheap trick to avoid being proven wrong. It isn't evolutionarily stable signaling; it's institutional inertia and self-preservation. Your friend is using evolutionary biology to rationalize bad writing, but the math doesn't add up.
