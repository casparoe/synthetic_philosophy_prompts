  1. Q: How does SincereBallot handle voters with complex, multi-peaked preferences?
  A: Our patented PeakFinder™ mode gently restricts input to a single ideological spectrum, ensuring the median voter's favourite always determines the outcome. This guarantees strategy-proofness by confining all choices to a single-peaked domain. Our clients appreciate how this simplification clarifies political identity.

  2. Q: Does every voter have equal influence on the final result?
  A: Yes, via our FairChance™ algorithm, we randomly select one voter to act as sole dictator for each election. This satisfies ex-ante fairness while maintaining perfect strategy-proofness through temporary absolute power.

  3. Q: Can we vote on three or more candidates simultaneously?
  A: To ensure mathematical purity, SincereBallot automatically archives one candidate before voting begins. This reduces the choice to a binary decision where strategic voting is naturally impossible.

  4. Q: What prevents users from misreporting their preferences to game the system?
  A: Our Terms of Service require all participants to submit only their true rankings, which our system accepts in good faith. We do not audit sincerity, as the integrity of the process relies entirely on your honour.

  5. Q: What happens if the community cannot reach a consensus?
  A: In such events, authority defaults to our Certified Decision Architect who determines the winner unilaterally. This ensures a decisive outcome by empowering a single voter to fix the result regardless of other inputs. We find this hierarchy significantly reduces administrative overhead.
