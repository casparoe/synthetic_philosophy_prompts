answer: |-
  The distinction between a right of visitation and a right of residence is not merely a semantic boundary; it is a structural hinge that determines whether border regimes function as filters or as walls. To treat this distinction seriously is to acknowledge that the earth's common ownership (your friend's premise) may grant a right to *access* without necessarily granting a right to *membership*. However, as you suspect, the stability of this position depends entirely on how the state manages the transition from the border line to the interior social order.

  To analyze this, we must rigorously separate the **gatekeeping function** (the decision to allow physical crossing of the border) from the **sorting function** (the assignment of legal and social status once inside). Restrictionist arguments often conflate these, assuming that controlling the gate is the only way to control the sort. The visitation/residence distinction attempts to decouple them: open the gate (visitation) but control the sort (no residence). The following analysis traces the instability of this decoupling.

  ### 1. Jurisdiction and the Condition of Presence
  If a state grants a right to visit but conditions it on submission to local jurisdiction, it creates a category of persons who are subject to power without being subjects of the political order. Ordinarily, jurisdiction is legitimized by residence because residence implies a stake in the cooperative scheme (taxation, representation, long-term compliance). A visitor, by definition, lacks this stake.

  *   **Implication:** The right to visit becomes exercisable only on terms that render the visitor legally fragile. If jurisdiction is acquired through presence, the visitor is liable for laws they had no hand in making and cannot vote to change. If they violate these laws, the remedy is not rehabilitation (as for a resident) but expulsion (as for a trespasser).
  *   **Gatekeeping vs. Sorting:** This is a failure of *sorting*. The gate has opened, but the internal legal architecture treats the entrant as an outsider. This implies that the "right to visit" is not a right to interact as a legal equal, but a privilege to be present under surveillance. The coherence of the right collapses if the cost of exercising it is total subjection to a sovereign authority to which one owes no allegiance. A right that can be revoked upon any infraction, without due process comparable to that of residents, is not a right but a license.

  ### 2. Permanent Provisionality and the Caste Risk
  If a regime admits visitors but offers no pathway to standing, it generates a population that is permanently provisional. This is the "guest worker" model scaled to a moral right.

  *   **Implication:** This collapses into a hereditary caste system if the status of "visitor" is transmitted or if economic necessity forces multi-generational "visitation." Hospitality, conceptually, implies a temporary suspension of the host's exclusive claim to the space for the sake of the guest. It presumes an end to the guesting. If the guesting never ends, the relationship is no longer hospitality; it is instrumentalization. The host retains the power to terminate the presence at will, while the guest provides labor or presence without security.
  *   **Gatekeeping vs. Sorting:** Here, *gatekeeping* is liberalized, but *sorting* is rigidified. The instability arises because the state relies on the economic presence of the visitor while denying their social reality. A state cannot sustainably integrate a class of people economically while excluding them politically. The distinction between visitation and residence breaks down when "visitation" becomes the de facto mode of life. The "courteous name" of hospitality masks a structure of domination where one class holds the power of expulsion over another class essential to the economy.

  ### 3. The Symmetry Requirement
  If the right to visit is universal, every state is simultaneously a potential host and a potential guest. Theoretically, this creates mutual obligation.

  *   **Implication:** The obligations are reciprocal in form but not in substance. A citizen of a wealthy, stable state has a formal right to visit a poorer state, but little incentive to do so permanently. A citizen of a poorer state has both the incentive and the need to visit the wealthy state. The burden of hospitality falls disproportionately on the desirable destination. Symmetry assumes that the value of "visitation" is equal across borders, but it is not. The right to visit a failed state is of negligible value compared to the right to visit a flourishing one.
  *   **Gatekeeping vs. Sorting:** This reveals that *gatekeeping* is where the value lies. If sorting were equal (i.e., visitors had the same rights everywhere), symmetry might hold. But because sorting is tied to the wealth of the host, the universal right to visit effectively becomes a one-way pressure on wealthy states. The "mutuality" is an illusion; the obligation is functionally unilateral for the states that possess the goods visitors seek.

  ### 4. Burden Distribution and Standpoint-Reversal
  This is the test of legitimacy. If exclusion is presumptively justified (your position), the excluder must be able to accept the position of the excluded.

  *   **Implication:** If the proposed regime is "visitation yes, residence no," the standpoint-reversal test asks: *Would I accept a global order where I am forever a visitor, never a resident?* For the citizen of a wealthy state, the answer is likely no. They value the security of residence (the right to stay) above the liberty of movement (the right to go). If the restrictionist cannot accept the status of permanent visitor for themselves, they cannot justify imposing it on others.
  *   **Gatekeeping vs. Sorting:** This tests the *sorting* function. Restrictionists often pass the test for *gatekeeping* (I accept that I could be kept out), but fail the test for *sorting* (I do not accept that if let in, I could be kept in a subordinate status). The distinction between visitation and residence allows the restrictionist to claim they are not "closing the gate," but the standpoint test reveals they are rigging the sort. A position that treats exclusion from residence as presumptively justified fails this test because it assigns the burden of instability to the migrant while reserving the benefit of stability for the citizen.

  ### The Function of "Hospitality": Conceptual vs. Rhetorical
  In this debate, "hospitality" does genuine **conceptual work** only when it defines the *temporality* of the right. It establishes that access to the earth's surface does not automatically confer access to a specific political community's cooperative scheme. It marks the boundary between human rights (personhood) and citizen rights (membership).

  However, "hospitality" does **rhetorical work** when it is used to soften the reality of exclusion. When a state says, "We welcome visitors," but structures the visit so that it cannot lead to settlement, "hospitality" becomes a euphemism for "containment." It masks the coercive nature of the sorting function. If the concept of hospitality cannot account for the guest's need for security, it is functioning rhetorically to preserve the host's privilege while appearing magnanimous.

  ### Ranking the Implications
  I rank **Implication 2 (Permanent Provisionality and the Caste Risk)** as the most consequential.

  **Defense of Ranking:**
  Implication 1 (Jurisdiction) is a legal technicality that can be managed through treaties and limited rights for visitors. Implication 3 (Symmetry) is a theoretical imbalance that does not necessarily destabilize the regime, even if it is unfair. Implication 4 (Standpoint-Reversal) is a powerful moral test, but it is external to the system's operation; it critiques the regime rather than describing its internal collapse.

  Implication 2, however, describes an internal contradiction that renders the visitation/residence distinction politically unsustainable. A regime that relies on a permanent class of non-resident visitors creates a structural fracture within the society. It separates economic contribution from political standing. Historically, such arrangements (guest worker programs, colonial subjecthood, denizenship) tend to destabilize in one of two directions: either the visitors demand residence (collapsing the distinction into open borders), or the host state escalates coercion to maintain the distinction (collapsing the distinction into authoritarian exclusion).

  The distinction between visitation and residence is stable only if visitation is truly temporary. But if the economic or humanitarian drivers of migration are structural, visitation becomes permanent. At that point, the "sorting" function ceases to be a administrative categorization and becomes a mechanism of caste. This is the most consequential implication because it transforms a philosophical compromise (visitation without residence) into a source of long-term social conflict. It forces a choice: either grant the pathway to residence (acknowledging the reality of integration) or close the gate entirely (acknowledging the reality of exclusion). The middle ground—the "right to visit" without a "right to stay"—is a transitional category that cannot hold under the weight of permanent human movement. It creates a class of people who are *in* the society but not *of* it, which is the definition of political instability.

  Therefore, while the standpoint-reversal test (4) proves the position morally questionable, the caste risk (2) proves it practically impossible. The debate cannot rest on the distinction because the distinction itself generates the conditions for its own destruction.
