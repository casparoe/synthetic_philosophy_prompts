prompt: |-
  Ok so I'm trying to build a case that makes trouble for the standard line that there are no genuine moral dilemmas, and I want it built to spec rather than just asserting a conflict exists.

  Here's what I need. A scenario, one paragraph, ordinary life — no trolleys, no time bombs, no villain who deliberately arranged the bind, and no dodge where the agent could've avoided getting into the situation in the first place. In it, there are two things the agent morally ought to do, call them A and B. The agent can do A (nothing stops them), and can do B (nothing stops them), but can't do both — the day isnt long enough, or the money isnt there, or some equally mundane obstacle. Both oughts have to be the same kind and equally stringent along every axis that could break a tie: same urgency, no prior promise or role that ranks one above the other, no difference in how many people are affected or how badly off they are that would settle it, no time to go get advice. I want the symmetry airtight, because the whole point is that you can't dissolve the thing by saying one requirement overrides the other.

  Then walk me through it. Does it come out as a genuine dilemma or not, and which reading of ought implies can does that turn on — the reading where each ought only demands that you can do that thing on its own, or the reading where it demands that you can do everything you ought to do? Say what someone who treats all moral oughts as merely prima facie gets out of the case, and what someone who insists a correct moral code can't issue contradictory requirements gets out of it. Then tell me honestly which single feature of the case is doing the work, what happens if I remove it (I'm guessing it collapses into a normal hard choice, but say), and how a person who wants to deny theres a dilemma here would go after the case — I expect they'll say it shows the all-things-considered verdict is indeterminate rather than that both acts are required, but give me your version of the strongest attack, not just the label.

  This is for a seminar on whether genuine moral dilemmas are possible, so the case can't just stipulate that it's a dilemma — it has to fall out of the setup.
