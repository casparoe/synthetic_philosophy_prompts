answer: |-
  **The Scenario**

  You are the sole guardian of two young children, and without any prior warning or negligence on your part, both suffer a sudden, identical, and severe medical episode at the exact same moment in different rooms of your house. Both require your physical assistance to administer a time-sensitive treatment within a fifteen-minute window to prevent permanent impairment, and the treatment requires your continuous physical presence for the duration. You are the only person available to help, and the rooms are soundproofed and distant enough that you cannot attend to one while hearing or aiding the other, nor can you alternate between them without exceeding the time limit for both. You morally ought to prevent permanent impairment to Child A, and you morally ought to prevent permanent impairment to Child B, but you physically cannot do both.

  ***

  **The Walkthrough**

  **Does it come out as a genuine dilemma?**
  Intuitively, yes. The setup forces the conclusion that you are subject to two binding requirements that cannot be jointly satisfied. However, whether this counts as a *logical* possibility depends entirely on how you parse "Ought Implies Can" (OIC).

  **The OIC Reading**
  The case turns on the distinction between the **Individual Reading** and the **Conjunctive Reading** of OIC.
  *   **Individual Reading:** $O(A) \to \Diamond A$ and $O(B) \to \Diamond B$. Since you *can* do A (if you ignore B) and *can* do B (if you ignore A), both obligations remain valid. This reading allows the dilemma to stand.
  *   **Conjunctive Reading:** $O(A \land B) \to \Diamond (A \land B)$. Since you *cannot* do both, it is false that you ought to do both. This reading dissolves the dilemma immediately by asserting that the aggregate obligation never existed.

  **The Prima Facie and Consistent Code Views**
  A proponent of **Prima Facie duties (Rossian)** will argue that these are not actual obligations but *prima facie* ones. They will claim that in this specific context, one duty (arbitrarily or via a hidden tie-breaker) becomes your *actual* duty, while the other recedes. You only *ought* to save the child you choose; the other is merely a regrettable omission, not a moral violation.
  Similarly, someone insisting on a **Consistent Moral Code** will argue that a valid moral system cannot issue contradictory commands. Therefore, if the code is consistent, one of these "oughts" must be illusory. They will argue that the "all-things-considered" verdict must be singular, meaning the symmetry is merely epistemic (we don't know which is binding) rather than ontological (both are binding).

  **The Work-Doing Feature**
  The single feature doing the work is **axiological symmetry** (incomparability). The case relies on the fact that there is no metric—urgency, relationship, severity, or consequence—that ranks A above B.
  *   **If you remove it:** If Child A's impairment is permanent but Child B's is temporary, or if you promised Child A first, the symmetry breaks. The case collapses into a **hard choice**, not a dilemma. You simply ought to do the "weightier" duty. The dilemma exists *only* because the reasons are perfectly balanced, preventing the generation of a single, overriding all-things-considered verdict.

  **The Strongest Attack**
  The most robust denial of the dilemma does not claim one child matters more, but rather redefines the **structure of the obligation**. This critic argues that the moral law does not issue two commands ($O(A)$ and $O(B)$), but rather one **disjunctive command**: $O(A \lor B)$.
  On this view, you are required to save *a* child, but the moral code is **indeterminate** regarding *which* one. The tragedy is real, and moral residue (guilt/regret) is appropriate, but this residue is a psychological response to tragedy, not evidence of a violated obligation. By framing the obligation as disjunctive, the critic preserves the Conjunctive OIC ($O(A \lor B) \to \Diamond (A \lor B)$ is true) and maintains a consistent moral code, while acknowledging the horror of the situation without admitting a logical contradiction in moral requirements. They will argue your intuition that "both are required" is a confusion between the *value* of the outcomes (both are equally bad to lose) and the *direction* of the duty (you are only directed to save one).
