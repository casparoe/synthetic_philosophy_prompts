answer: |-
  ### Part 1: The Dependencies (Read This First)

  Before you step into the room, you need to lock down the order of operations. If you scramble these, the session turns into a grammar lesson or a complaint session about Spanish class. Here is the logical chain you cannot break:

  1.  **Experience Before Theory:** You cannot explain the "budget" metaphor until *after* they have felt the pain of spending the budget. If you start with the metaphor, it's just abstract math. They need to struggle with a rhyme first so the metaphor explains a feeling they already have.
  2.  **Meaning Before Sound:** They must understand exactly what the original poem says before they try to rhyme it. If they misunderstand "wedding gown" or "hid the roads," their translation choices will be random, not strategic.
  3.  **Constraint Before Freedom:** They need to hit the wall of the form (rhyme/meter) before you ask them to evaluate the quality. If they write free verse first, they won't understand why the rhyming version feels different.
  4.  **Comparison Before Judgment:** They cannot decide if a translation is "good" or "bad" until they see the Original English side-by-side with the Back-Translated English. Comparing English to Spanish is too hard for this group; comparing English to English (Original vs. Return Trip) shows the "drift" clearly.
  5.  **Specific Before General:** Do not talk about "Poetry" or "Translation" as big concepts. Talk about *this* poem and *this* word. Generalize only in the last 5 minutes.

  **What breaks if you mess this up:**
  *   If you start with the **Budget Metaphor**, they will treat it like a math problem instead of an artistic choice.
  *   If you let them **translate back to English individually**, you will run out of time. Pair work is mandatory.
  *   If you don't **flag the Spanish syllable issue**, the kids who know Spanish well will argue with the kids who don't about counting, and you'll lose the room. (Spanish counts syllables differently than English due to vowel blending).

  ---

  ### Part 2: The Example (Your Snow Poem)

  **Keep the poem.** It is actually perfect for this specific group and time limit.

  **Why it works:**
  *   **Vocabulary:** It uses concrete nouns (snow, roads, town, gown) that almost every Spanish student knows (*nieve, caminos, pueblo, vestido*).
  *   **Stakes:** The metaphor (town = wedding gown) is clear. If they lose that, everyone sees it immediately.
  *   **Constraint:** The AABB rhyme scheme is strict enough to force choices but simple enough not to be impossible.

  **What you must change about the instructions:**
  *   **Drop the strict syllable count for Spanish.** English is stress-timed; Spanish is syllable-timed. An 8-syllable English line often becomes 10 or 12 in Spanish. If you insist on 8 syllables in Spanish, they will break the grammar to fit the count.
  *   **New Instruction:** "Keep the rhyme (AABB) and keep the lines roughly the same visual length on the page."
  *   **Verb Tense:** Your poem is past tense (*came, hid, turned*). Freshmen Spanish often struggles with past tense (*pretérito/imperfecto*). Tell them: "You can change the tense to present if it helps the rhyme, but note that you made that choice."

  **What the example must have:** Simple imagery, strict form, clear metaphor.
  **What the example must not have:** Cultural idioms ("kick the bucket"), complex syntax, or ambiguous words. Your poem passes this test.

  ---

  ### Part 3: The 40-Minute Teaching Plan

  **0:00–0:05 | The Hook & The Literal**
  *   Read your poem aloud twice.
  *   **Crucial Move:** Hand out a slip of paper with a *literal, non-poetic* Spanish translation. (e.g., *Cuando la nieve bajó el martes por la noche / ocultó los caminos y los campos de la vista...*)
  *   **Say:** "This is what the poem says. This is not a poem; it's a instruction manual. Your job is to make it a poem again."
  *   **Why:** This heads off the "Word-for-Word = Accurate" misconception immediately. They see that accuracy isn't poetry.

  **0:05–0:20 | The Struggle (Pair Work)**
  *   Pair them up. Ideally, mix Spanish levels if you know them.
  *   **Task:** Translate the poem into Spanish.
  *   **Constraints:** It must rhyme (AABB). It must look like the original.
  *   **Rule:** "If you have to break the grammar or change the meaning to make the rhyme work, do it. But circle the word you changed."
  *   **Why:** This forces the trade-off. By telling them it's okay to break meaning, you give them permission to feel the tension.

  **0:20–0:30 | The Round Trip**
  *   Have pairs swap their Spanish poem with another pair.
  *   **Task:** Translate the *Spanish* poem back into English.
  *   **Constraint:** "Do not look at the original English poem. Just translate what is on the paper in front of you."
  *   **Why:** This creates the "Telephone Game" effect. When they compare this new English version to your original, the losses will be obvious.

  **0:30–0:35 | The Comparison & The Budget**
  *   Ask 2–3 pairs to read their Original vs. their Back-Translated version.
  *   **Ask:** "Where did the snow go? Where did the wedding gown go?"
  *   **Introduce the Metaphor:** "My advisor says translation is a budget. You have 100 points. Sound (rhyme), Sense (meaning), Shape (lines). You cannot buy all three. When you changed 'Tuesday' to 'Night' to make a rhyme, you spent points on Sound that you took from Sense."
  *   **Why:** Now the metaphor lands because they just spent the budget.

  **0:35–0:40 | The Exit Ticket**
  *   **Activity:** "On a sticky note, write down one word you changed to make a rhyme. Write 'Worth it' or 'Not Worth it' and why."
  *   **Why:** This assesses if they understand *choice*. If they say "I changed it because I had to," they missed the point. If they say "I changed it because the sound was more important," they got it.

  ---

  ### Part 4: Handling Misconceptions

  **1. "Translation is either faithful or not (One Dial)"**
  *   **Where it pops up:** During the comparison phase when they see differences.
  *   **How to head it off:** Don't let them use the word "wrong." If someone says, "They changed the meaning, so it's wrong," you say: "They didn't fail; they made a purchase. They bought Rhyme. What did they sell to pay for it?"

  **2. "Form is just decoration; Meaning is the real content"**
  *   **Where it pops up:** When they are translating into Spanish.
  *   **How to head it off:** When a pair says, "We couldn't get the wedding gown to rhyme," stop the room. Say: "If you drop the wedding gown to save the rhyme, is it the same poem? Or is the form actually holding up the meaning?" Make them feel that the form *is* part of the content.

  **3. "Word-for-word gloss is the accurate one"**
  *   **Where it pops up:** At the very start.
  *   **How to head it off:** This is why you hand out the literal translation first. Read it flatly. Ask: "Is this a poem?" They will say no. "Why not? It has all the right words." This proves accuracy isn't the only goal.

  **4. "Rhyming always wrecks the poem / Free verse is better"**
  *   **Should you let this fight happen?** Yes, but **only in the last 5 minutes.**
  *   **How to manage it:** If someone says this during the work phase, say: "Hold that thought. Let's see what breaks first."
  *   **In the debrief:** Validate them. "Some of you felt the rhyme broke the poem. That's a valid choice. But some of you felt the rhyme made it memorable. Translation isn't about finding the *right* way; it's about deciding what you value more."

  ---

  ### Part 5: The Closing & The Exclusions

  **The Closing Assessment (2 Minutes)**
  Do not ask "Did everyone understand?" They will just nod.
  **Do this:** "Stand up if you changed a word to make a rhyme. Keep standing if you think that change made the poem *worse*. Sit down if you think it made the poem *different but okay*."
  *   **What this tells you:** If everyone sits, they think constraints are fine. If everyone stands, they feel the loss. If half stand, they understand it's a choice. You want the split.

  **What to Deliberately Not Get Into**
  You only have 40 minutes. You must cut the following:
  1.  **Spanish Grammar Corrections:** Do not correct their conjugations. If *nieve* should be *nevó*, let it go. You are teaching poetry, not Spanish 101.
      *   *How to say it:* "I am not grading your Spanish. I am grading your choices. If you broke the grammar to save the rhyme, that's a poetic choice, not a mistake."
  2.  **The History of Translation:** No talk of famous translators or theories.
      *   *How to say it:* "There are whole college classes on the history of this. Today we are just looking at the mechanic of this one poem."
  3.  **Other Languages:** Someone will ask, "Would this be easier in French?"
      *   *How to say it:* "Maybe, but today we are studying the problem, not the solution. The problem exists in every language."
  4.  **"Perfect" Translation:** Someone will ask, "What's the right answer?"
      *   *How to say it:* "There isn't one. If there was one right version, we wouldn't need translators. We'd just use a machine. You are here to make the choices the machine can't make."

  **Final Advice for You:**
  You are the facilitator, not the expert. If you get stuck on a Spanish word, ask the room. "How do we say 'gown' in Spanish? Does it rhyme with 'town'?" Make them see that you are navigating the budget too. Good luck. You've got this.
