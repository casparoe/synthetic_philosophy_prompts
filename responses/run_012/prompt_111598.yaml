      *   *Non-Identity Problem:* In POF, units are fixed. If the treatment (historical injustice) changes *who* exists, the units $i$ in $Y_i(1)$ and $Y_i(0)$ are not the same. POF assumes stable units. So, POF basically breaks or requires assuming the *same* souls/identities exist across worlds, which is metaphysically dubious. It doesn't dissolve it; it highlights the violation of the "Stable Unit" assumption.
