  # Convention, Normativity, and the Visitor: A Decision Tree
  **Module:** Convention, Normativity and Social Morality  
  **Purpose:** To locate your position on the boundary between etiquette, convention, and morality using concrete cases.

  ### Stage 1: The Branching Tree
  *Start at Question 1. Follow the arrows based on your intuitive answer.*

  **Q1. The Empty Road (Jaywalking)**  
  You cross against the lights on an empty road at 2am. No one sees you; no cars are coming. Is this **morally wrong** (not just illegal)?  
  *   **NO** → Go to **Q2**.  
  *   **YES** → Go to **Q3**.

  **Q2. The Empty Escalator (Coordination)**  
  You stand on the "wrong" side of a stationary escalator. No one is behind you to be blocked. Is this **morally objectionable**?  
  *   **NO** → **LEAF 1: The Etiquette View**  
  *   **YES** → **LEAF 2: The Coordination Absolutist (Unnamed)**

  **Q3. The Busy Queue (Source of Duty)**  
  You barge to the front of a busy post office queue. Is this wrong primarily because it breaks the **local rule**, or because it is **unfair** to those waiting?  
  *   **Because it is Unfair** → **LEAF 3: Moral Reductionism**  
  *   **Because it breaks the Rule** → Go to **Q4**.

  **Q4. The Ignorant Visitor (Tipping)**  
  Priya is a short-term visitor who genuinely didn't know tipping was expected. Is she **blameworthy** for not leaving a tip?  
  *   **YES (Ignorance does not excuse)** → Go to **Q6**.  
  *   **NO (Ignorance/Consent matters)** → Go to **Q5**.

  **Q5. The Crowded Train (Reciprocity)**  
  You rarely use public transport. Do you owe your seat to an elderly person only if you **benefit** from the system yourself?  
  *   **YES (Obligation requires benefit)** → **LEAF 4: Fair Play Theory**  
  *   **NO (Obligation is general)** → **LEAF 5: Tacit Consent View (Unnamed)**

  **Q6. The Mourning Custom vs. The Shop (Uniformity)**  
  Is violating a local mourning custom the **same kind of error** as refusing to haggle in a shop where prices are fixed?  
  *   **NO (Different contexts, different norms)** → **LEAF 6: Normative Pluralism**  
  *   **YES (One kind of obligation)** → Go to **Q7**.

  **Q7. The Fixed Price (Visitor Compliance)**  
  If a visitor dislikes the "fixed price" rule, are they still **bound to follow it** simply because they are in that location?  
  *   **NO (Visitors can opt out)** → **LEAF 7: Liberal Conventionalism (Unnamed)**  
  *   **YES (Location binds everyone)** → **LEAF 8: Strict Conventionalism**

  ---

  ### Stage 2: The Positions (Leaves)

  | Leaf | Position Name | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **1** | **The Etiquette View** | Breaching a queue is merely rude, like wearing pyjamas to a wedding, never morally wrong. |
  | **2** | **Coordination Absolutist** (Unnamed) | You can do wrong even if your action has zero negative effect on anyone else. |
  | **3** | **Moral Reductionism** | If a convention (like queueing) stopped being useful, it would immediately cease to be binding. |
  | **4** | **Fair Play Theory** | If you don't benefit from a practice (e.g., tipping), you have no duty to uphold it. |
  | **5** | **Tacit Consent View** (Unnamed) | Merely walking into a restaurant counts as signing a contract to follow all its unwritten rules. |
  | **6** | **Normative Pluralism** | There is no single theory of "convention"; funeral norms and market norms work differently. |
  | **7** | **Liberal Conventionalism** (Unnamed) | Locals must follow the rules, but visitors are morally permitted to ignore them. |
  | **8** | **Strict Conventionalism** | A visitor is morally required to follow local norms even if they are harmful or unknown to them. |

  ---

  ### Notes for Discussion

  **1. Indistinguishable Leaves**  
  *   **Leaf 4 (Fair Play) & Leaf 5 (Tacit Consent):** In practice, these are hard to separate. Both ground obligation in the visitor's relationship to the practice (benefit or presence) rather than the rule itself. The distinction is theoretical: is it about *taking advantage* (Fair Play) or *implied agreement* (Consent)?

  **2. Unoccupied Answer Combinations**  
  *   **"Visitors Bound, Locals Not":** No one defends the view that a rule binds a tourist but not a resident. *Diagnosis:* **Incoherent.** Normativity usually derives from membership or presence; if presence binds a visitor, it binds a resident *more*.
  *   **"Leaf 2 (Coordination Absolutist)":** Rarely defended explicitly. *Diagnosis:* **Unattractive.** It implies "rule worship" where the coordination mechanism matters more than the people being coordinated.
  *   **"Leaf 7 (Liberal Conventionalism)":** Unstable. *Diagnosis:* **Unexplored/Unstable.** It creates a two-tier moral system that encourages visitors to exploit locals who are bound by rules the visitors ignore.

  **3. Hume's Artificial Virtues**  
  If you landed on **Leaf 3** or **Leaf 4**, you are closest to Hume. You see conventions as *invented* tools to solve problems (like queueing to prevent fights). If you landed on **Leaf 8**, you treat conventions as *discovered* moral truths inherent to the location.
