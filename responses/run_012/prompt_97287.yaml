  1.  Students choose a fixed % to bet every round (to simplify).
  2.  25 Rounds.
  3.  Coin is 60/40 favorable.
  4.  Debrief compares Final Wealth vs. Expected Wealth.

  *Let's finalize the "Predictably Go Wrong" section.*
  1.  Someone bets 100% and wins (unlikely but possible).
  2.  Students bet variable amounts (harder to analyze). *Fix: Require a committed fraction for the whole game.*
  3.  Students don't understand "fractional betting." *Fix: Clear examples.*

  *Let's finalize the "Normative Gap".*
  Kelly is not "rational" if you have a utility function that isn't log, or if the horizon is short. I must state this clearly.

