answer: |-
  Here is a complete design for the 90-minute session, titled **"The Favorable Ruin."** It is engineered to make the ergodicity problem visceral before introducing the formal mathematics.

  ---

  ## 1. Game Design & Materials

  **The Setup**
  *   **Participants:** 18 graduate students.
  *   **Time:** 90 minutes.
  *   **Currency:** "Lab Points" (LP). No real money changes hands.
  *   **Incentive:** The top 3 final bankrolls receive a tangible reward (e.g., a high-quality chocolate bar or a "homework pass"). This induces risk-taking behavior essential for the lesson.
  *   **The Asset:** A biased coin. $P(\text{Heads}) = 0.6$, $P(\text{Tails}) = 0.4$.
  *   **The Payoff:** Even money (1:1). Bet 10 LP, win 10 LP on Heads; lose 10 LP on Tails.
  *   **Starting Bankroll:** 100 LP for every student.
  *   **The Constraint:** Students must commit to a **fixed betting fraction** ($f$) for all rounds. They cannot vary their stake based on intuition round-to-round. They write $f$ on a card at the start (e.g., 0.10, 0.50, 1.00).

  **Materials Needed**
  1.  **Ledger Sheets:** One per student, with columns for Round, Start Wealth, Stake ($f \times$ Wealth), Outcome (H/T), End Wealth.
  2.  **Strategy Cards:** Small slips where they write their name and chosen fraction $f$ (collected by you).
  3.  **Projector/Whiteboard:** To track the "Room Average" and "Theoretical EV" live.
  4.  **Coin:** A large visible coin (or a random number generator projected on screen for speed/auditability).
  5.  **Calculator/Spreadsheet:** For you to run a quick Monte Carlo simulation during the debrief.

  ---

  ## 2. Timeline (90 Minutes)

  ### Phase 1: The Hook & Rules (15 Minutes)
  1.  **Introduction (5 min):** Explain the game. Emphasize the edge: "This is a favorable game. The Expected Value (EV) of every bet is positive. $E[\text{Return}] = 0.6(2) + 0.4(0) = 1.2$."
  2.  **The EV Pitch (5 min):** Ask the room: "If you want to maximize your expected wealth after 20 rounds, what fraction should you bet?"
      *   *Trap:* Most Econ/Stats students will intuitively say 100% (All-In). Mathematically, for a single round or ensemble average, they are right.
      *   *Instruction:* "Write your fraction on the Strategy Card. You must stick to it. If you hit 0 LP, you are 'ruined' and sit out, but you remain in the dataset as a zero."
  3.  **Collection (5 min):** Collect the Strategy Cards. Do not reveal them yet. Tally how many chose $f > 0.5$ vs $f < 0.2$.

  ### Phase 2: The Play (30 Minutes)
  1.  **Rounds 1–20 (25 min):**
      *   Flip the coin publicly.
      *   Students calculate their new wealth. (To save time, allow them to use phone calculators, but they must record the steps).
      *   **Crucial Rule:** If a student goes bust ($0$ LP), they stop playing but keep their ledger.
      *   **Instructor Role:** Track the **Arithmetic Mean** of the room's wealth on the board after every 5 rounds.
  2.  **The "Parallel World" Injection (5 min):**
      *   At Round 10, pause. Reveal the *Theoretical EV Path*.
      *   Calculate: $100 \times (1.2)^{10} \approx 619$ LP.
      *   Compare this to the current Room Average. Usually, the Room Average is *lower* than the EV Path, even though the EV Path assumes the "average" outcome.
      *   Resume play to Round 20.

  ### Phase 3: Aggregation (10 Minutes)
  1.  **Final Tally:** Collect final wealth numbers.
  2.  **Public Ledger:** Project the results anonymously.
      *   List: Strategy Fraction ($f$) $\rightarrow$ Final Wealth.
      *   Highlight the busts (Wealth = 0).
      *   Highlight the survivors.
  3.  **Calculate Two Averages:**
      *   **Ensemble Proxy:** The Arithmetic Mean of the 18 students' final wealth.
      *   **Typical Outcome:** The Median (or Geometric Mean) of the final wealth.

  ### Phase 4: The Debrief (35 Minutes)

  **Part A: The Autopsy (15 min)**
  *   **The Ruin:** Point out that almost everyone who bet $f \geq 0.5$ is likely ruined or severely depleted.
  *   **The EV Illusion:** Show that the *Arithmetic Mean* of the room might still be positive (perhaps one lucky student with $f=1.0$ got 20 Heads in a row, skewing the average).
      *   *Lesson:* The Ensemble Average (mean across players) grew, but the Time Average (typical individual trajectory) collapsed.
  *   **The Math:** Introduce the Geometric Growth Rate $g$:
      $$g(f) = p \ln(1+f) + q \ln(1-f)$$
      *   Show that for $p=0.6$, $g(f)$ is maximized at $f^* = 0.2$ (Kelly Criterion).
      *   Show that for $f=1.0$, $g(f) = -\infty$ (because $\ln(0)$ is undefined/negative infinity).
      *   Show that for $f=0.5$, $g(f)$ is actually *negative*, meaning guaranteed long-term ruin despite positive EV per bet.

  **Part B: Ergodicity (10 min)**
  *   Explain the core concept: **Non-Ergodicity.**
  *   **Ensemble Average:** What happens if 1,000 people play 1 round? (Wealth grows by 20%).
  *   **Time Average:** What happens if 1 person plays 1,000 rounds? (Wealth shrinks if $f > f^*$).
  *   The game forced them into the Time Average, but their intuition was trained on Ensemble Averages (standard EV maximization).

  **Part C: Normative Limitations (10 min)**
  *   (See "The Normative Gap" section below).

  ---

  ## 3. Predictable Failure Modes & Mitigations

  **1. The "Lucky All-In" Student**
  *   **Risk:** With 18 students and 20 rounds, there is a non-zero chance one student betting 100% survives (Probability $\approx 1 - (1 - 0.6^{20})^{18}$). If one student bets 100% and wins, they will have astronomical wealth, validating the EV strategy to the room.
  *   **Mitigation:**
      *   **Pre-emptive Framing:** In the debrief, explicitly isolate the outlier. "Student X won, but Student X took a 99.999% risk of ruin. Would you make that trade again?"
      *   **The "Clone" Simulation:** During the debrief, run a quick Python script (or pre-prepared spreadsheet) on the projector. Simulate 10,000 players betting 100% for 20 rounds. Show that ~99.99% go bust. Contextualize the lucky student as a statistical anomaly, not a replicable strategy.

  **2. Calculation Fatigue**
  *   **Risk:** Compounding 20 rounds manually is tedious. Students will make arithmetic errors, muddying the data.
  *   **Mitigation:** Provide a simple spreadsheet template on a tablet/laptop if available, OR reduce rounds to 15. 15 rounds is sufficient to show ruin for $f=1.0$ ($0.6^{15} \approx 0.0004$) but reduces calculation burden. *Recommendation: Stick to 15 rounds for flow.*

  **3. Variable Betting**
  *   **Risk:** Students ignore the "fixed fraction" rule and try to "make up losses" by increasing stakes (Martingale). This confuses the Kelly lesson.
  *   **Mitigation:** Collect the Strategy Card *before* Round 1. Enforce the rule strictly. If they deviate, disqualify them from the prize (but keep their data for the "what went wrong" analysis).

  **4. Misunderstanding "Expected Value"**
  *   **Risk:** Students argue, "But the EV *was* positive, I just got unlucky."
  *   **Mitigation:** Distinguish between *Expected Value of Wealth* (linear) and *Expected Value of Log-Wealth* (geometric). Show that while $E[W]$ increases, $E[\ln W]$ decreases for over-betting. The "value" depends on the function you maximize.

  ---

  ## 4. The Normative Gap (Frank Assessment)

  You asked to be plain about what the game cannot prove. **This game does not prove that Kelly is the uniquely rational strategy.** It proves that Kelly is the strategy for *maximizing long-run geometric growth*. Whether a rational agent *should* do that is a separate philosophical/economic question.

  **What the Game Hides:**
  1.  **Finite Horizons:** Kelly is asymptotically optimal. If the game were only 3 rounds, a high-variance strategy (betting 50%+) might actually yield a higher probability of beating a specific target threshold than Kelly.
  2.  **Utility Functions:** Kelly implicitly assumes a Log-Utility function ($U(W) = \ln W$).
      *   If a student has linear utility ($U(W) = W$), betting 100% *is* rational for maximizing expected utility, even if it risks ruin.
      *   If a student has a "tournament utility" (e.g., "I only care if I finish in the top 10%"), then over-betting Kelly is the rational strategy to maximize variance and "get lucky."
  3.  **Divisibility & Bankruptcy:** The game assumes you can bet fractions of a cent and that 0 is an absorbing state. In reality, bankruptcy laws, limited divisibility, and the ability to earn labor income outside the game change the optimal stake.

  **What You Must Supply in the Debrief:**
  You must explicitly state: *"We have shown that maximizing arithmetic Expected Value leads to ruin in repeated play. We have shown that maximizing Geometric Growth (Kelly) preserves capital and grows wealth reliably. However, Kelly is not a law of physics; it is a policy choice."*

  **The Philosophical Prompt:**
  Ask the Philosophy/Econ students: *"If you know you will only play this game once in your life, do you bet 20% or 100%?"*
  *   **Answer:** If once, 100% maximizes expected return.
  *   **Follow-up:** *"If you play it every day for 10 years, do you bet 20% or 100%?"*
  *   **Answer:** 20% maximizes survival.
  *   **Conclusion:** Rationality depends on the **time horizon** and the **repeatability** of the risk. The "EV Maximizer" error is treating a repeated time-series risk as a one-off ensemble risk.

  ---

  ## 5. Instructor's Cheat Sheet (The Math)

  Keep this handy for the whiteboard work.

  *   **Odds:** Even money ($b=1$).
  *   **Probability:** $p=0.6, q=0.4$.
  *   **Expected Value per Round:** $0.6(1+f) + 0.4(1-f) = 1 + 0.2f$. (Always positive for $f>0$).
  *   **Kelly Fraction:** $f^* = p - q = 0.2$.
  *   **Growth Rate at Kelly:** $0.6 \ln(1.2) + 0.4 \ln(0.8) \approx 0.0201$ (2% growth per round).
  *   **Growth Rate at All-In ($f=1$):** $0.6 \ln(2) + 0.4 \ln(0) \to -\infty$.
  *   **Growth Rate at Half-Bank ($f=0.5$):** $0.6 \ln(1.5) + 0.4 \ln(0.5) \approx -0.034$ (Negative growth! You lose money on average over time despite positive EV per bet).

  **Final Note to Instructor:**
  The most powerful moment will be when you show that betting 50% (which feels "safe" compared to 100%) still leads to loss. This breaks the intuition that "some risk is fine." Drive home that there is a sharp cliff at $f=0.2$, not a gentle slope.
