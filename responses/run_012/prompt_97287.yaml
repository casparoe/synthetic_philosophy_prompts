prompt: |-
  I teach a 90-minute session for about 18 graduate students drawn from economics, statistics, and philosophy, and I want them to feel — in their own bankrolls — why repeatedly taking a favorable gamble at the stake that maximizes expected value is a reliable way to go broke, and why the proposed fix is to maximize the growth rate of one's wealth instead of its expected value.

  Design the game. Participants should start with a common bankroll, know the per-round odds and the win probability, and choose each round how much of their current bankroll to stake; I want the arithmetic of a favorable even-money bet to look compelling enough that most of the room stakes recklessly at the outset. Build in whatever structure is needed — parallel worlds, a public ledger, a borrowing rule, several rounds of play — so that the group runs into the gap between the ensemble average and the typical outcome before anyone names the growth-rate criterion. Include rules, materials, a round-by-round timeline, a payoff scheme that requires no real money, and a debrief that maps what happened onto the log-optimal stake, what overbetting past it does to the growth rate, and the contrast between the time-average and the average across players.

  Tell me honestly what will predictably go wrong the first time I run it, and how to keep a lucky early run from teaching the opposite lesson. Be frank, too, about what the game cannot reproduce: I suspect it can dramatize the growth-rate argument but not settle whether maximizing geometric growth is normatively required of a rational agent, as opposed to one defensible policy among others. If that is right, say so plainly and tell me what I have to supply in the debrief myself, rather than papering over the gap.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** 18 graduate students (Economics, Statistics, Philosophy). High quantitative literacy, likely familiar with Expected Value (EV), utility functions, and risk.
      *   **Goal:** Demonstrate experientially why maximizing Expected Value (EV) per round leads to ruin (Gambler's Ruin in a favorable game) and why maximizing Geometric Growth Rate (Kelly Criterion) is superior for long-term survival/growth.
      *   **Format:** 90-minute session.
      *   **Key Mechanics:** Common starting bankroll, known odds/probability, fractional betting each round.
      *   **Key Insight:** Distinction between Ensemble Average (across players) vs. Time Average (individual trajectory).
      *   **Requirements:** Rules, materials, timeline, payoff scheme (no real money), debrief structure.
      *   **Critical Reflection:** Predict failure modes, address luck variance, and acknowledge normative limitations (Kelly isn't *the* rational choice for everyone, just a specific one).

  2.  **Deconstruct the Mathematical Core:**
      *   *The Bet:* Needs to be favorable but risky. A coin toss is classic. Let's say $P(Head) = 0.6$, $P(Tail) = 0.4$. Even money payout (1:1).
      *   *EV Maximization:* Bet 100% of bankroll every time. $E[Return] = 1.2$. Over $N$ rounds, Ensemble Mean grows as $1.2^N$.
      *   *Growth Maximization (Kelly):* Bet fraction $f^* = p - q = 0.6 - 0.4 = 0.2$ (20%).
      *   *The Trap:* If you bet 100%, one loss wipes you out. If you bet 50%, volatility drag kills you eventually.
      *   *The Demonstration:* Need enough rounds for the law of large numbers to kick in for the *time* average, but not so many that it takes forever. 20-30 rounds is usually enough to show divergence.

  3.  **Drafting the Game Design:**
      *   *Name:* "The Ergodicity Trap" or "The Favorable Ruin." Let's go with "The Favorable Ruin."
      *   *Bankroll:* Needs to be divisible. 100 units is standard.
      *   *Betting:* Fractional betting is crucial. If they bet fixed amounts, the lesson changes. They must bet a *percentage* of current wealth.
      *   *Rounds:* 25 rounds. Enough for compounding to show, short enough for 90 mins.
      *   *Incentive:* No real money. Use "Course Credit" or "Prestige Points." Let's suggest a small tangible reward (chocolate/candy) for the top performer to induce risk-taking, but emphasize the *simulation* aspect.
      *   *Tracking:* They need to track their own wealth. A spreadsheet or simple ledger sheet.
      *   *The "Ensemble" Trick:* To show the EV vs. Time Average gap, we need to calculate the average wealth of the room (Ensemble) vs. the median/typical wealth (Time).

  4.  **Addressing the "Predictably Go Wrong" Section:**
      *   *Luck:* With 18 students and 25 rounds, someone *will* get lucky betting 100%. If one person wins big by going all-in, the lesson fails.
      *   *Mitigation:* Need to structure the debrief to highlight *probability* vs. *outcome*. Also, maybe cap the betting or ensure the number of rounds is high enough that 100% betting almost certainly ruins everyone (Probability of 25 heads in a row at 60% is $0.6^{25} \approx 0.000002$). Wait, 25 rounds is enough. $0.6^{25}$ is tiny. But if they bet 50%, they might survive.
      *   *Boredom:* 25 rounds of coin flipping can drag. Need a fast mechanism.
      *   *Confusion:* Students might confuse "expected value of wealth" with "expected utility."
      *   *Normative Gap:* Kelly assumes log utility. A risk-neutral agent *should* bet 100% if they can play only once or if they have a utility function linear in money. The game simulates repeated play, which implies a specific time horizon.

  5.  **Refining the Timeline (90 Minutes):**
      *   Intro (10 min)
      *   Game Play (30 min) - Needs to be snappy.
      *   Data Aggregation (10 min)
      *   Debrief/Math (30 min)
      *   Normative Discussion (10 min)
      *   *Correction:* 25 rounds might take too long if done manually. Let's reduce to 15-20 rounds but emphasize the compounding. Or use a digital tool. Let's stick to analog for transparency but keep it tight. 20 rounds.
      *   *Wait, one crucial fix:* To ensure the "EV maximizer goes broke" lesson lands, the penalty for loss must be total loss of the *stake*. If they bet 100% and lose, they are at 0. Game over. This is the most dramatic way to show it.

  6.  **Developing the Debrief (The "Meat"):**
      *   Show the distribution of final wealth. (Likely skewed: one huge winner, many zeros).
      *   Calculate the Arithmetic Mean (Ensemble). It will be high.
      *   Calculate the Geometric Mean (Typical). It will be low/negative.
      *   Introduce the Kelly Formula: $f^* = p - (1-p)/b$.
      *   Discuss Ergodicity: Ensemble average $\neq$ Time average.

  7.  **Addressing the Normative Limitation:**
      *   The prompt asks to be frank. Kelly maximizes *asymptotic* growth. It does not maximize expected utility for finite horizons if utility is not log.
      *   If a student says "I wanted to maximize my chance of being the top 1%," betting high is rational.
      *   I need to explicitly state that Kelly is optimal for *long-run survival and growth*, not necessarily for *winning a tournament* or satisfying non-log utility.

  8.  **Final Review against Constraints:**
      *   18 students? Yes.
      *   90 mins? Yes.
      *   No real money? Yes.
      *   Predictable failures? Yes (luck, misunderstanding).
      *   Normative gap? Yes.

  9.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Make sure the betting mechanism is clear.* They write down a %, I flip a coin for the whole room (common shock) OR individual coins?
      *   *Decision:* Individual coins (or app) creates more variance in outcomes, which helps show the distribution. But a common shock makes the math easier to follow in debrief.
      *   *Better Decision:* **Common Shock.** One coin flip per round for the whole room. Why? Because it isolates the *betting strategy* as the variable. If everyone faces the same sequence of H/T, then differences in final wealth are *solely* due to betting fractions. This makes the comparison between EV-max (100%) and Kelly (20%) stark and undeniable.
      *   *Wait, counter-argument:* If I use a common shock, and the sequence is HHHHH..., the 100% bettors win. I need a fixed sequence or enough rounds that the Law of Large Numbers approximates the 60/40 split.
      *   *Best Approach:* Pre-determine the sequence of 20 flips to ensure roughly 60% Heads. This removes "luck of the draw" regarding the coin itself and focuses on the betting strategy. *Actually, no.* That feels rigged.
      *   *Compromise:* Live flips, but 30 rounds. $0.6^{30}$ is effectively zero. The all-in players *will* go bust.
      *   *Wait, 18 students.* If they all bet 100%, they all go bust. Who demonstrates the "Ensemble Average"?
      *   *Ah, the "Parallel Worlds" requirement in prompt.* I need to simulate the Ensemble Average.
      *   *Idea:* I (the instructor) will play the "EV Maximizer" strategy (100% bet) on a separate spreadsheet visible to all. I will also play the "Kelly" strategy. The students play their own strategies.
      *   *Actually, better:* Ask students to commit to a strategy *before* starting. "How many will bet >50%?" "How many <20%?"
      *   *Let's refine the "Ensemble" point:* The Ensemble Average is the average wealth of all players *if* they could restart the game infinite times. In a single run, the Arithmetic Mean of the room approximates the Ensemble Expectation *if* the sample is large enough. With 18 students, it's small.
      *   *Solution:* I will run a Monte Carlo simulation on the projector during the debrief to show what the "Ensemble Average" looks like over 10,000 trials, contrasting it with the single trajectory they just played. This bridges the gap.

  10. **Final Polish:** Check tone. Needs to be academic but engaging. Acknowledge the Philosophy students' concerns about normativity. Acknowledge the Econ students' concerns about utility. Acknowledge the Stats students' concerns about ergodicity.

  **(Self-Correction on the "Common Shock" vs "Independent Shocks"):**
  If everyone faces independent coin flips, the room average converges to the Expected Value. If everyone faces the *same* coin flips (Time Average), the room average converges to the Geometric Mean (mostly).
  *Crucial Insight:* To teach Ergodicity, we need to show that the *Time Average* (one person playing many rounds) differs from the *Ensemble Average* (many people playing one round).
  *Revised Plan:*
  1.  **Phase 1 (Time Average):** All students play 20 rounds. They experience the trajectory. Most who bet high go bust.
  2.  **Phase 2 (Ensemble Average):** I show a calculation. "If we had 10,000 of you, and each played 1 round, the average return is 1.2."
  3.  **The Twist:** The game forces them to play sequentially (Time). The EV calculation assumes parallel (Ensemble).
  *Wait, simpler:* Just play the game. Calculate the Arithmetic Mean of the final wealths. It will likely be positive (due to 1-2 lucky survivors if they didn't all bet 100%). Calculate the Median. It will be near zero. This shows the skew.
  *Okay, let's stick to the prompt's request:* "Build in whatever structure is needed — parallel worlds... so that the group runs into the gap."
  *Best Structure:* **The "Clone" Mechanic.**
  Round 1-10: Play normally.
  Mid-game pause: Calculate the "Theoretical EV" path. Compare to actual.
  Actually, the most robust way to show the EV trap is to have a "Bank" that offers a cash-out based on EV, but the reality is bankruptcy.
