          *   *Counter-Candidate:* Locke/Nozick. Can we reconcile?
          *   *Analysis:* The Nordic model *functions* as if Murphy/Nagel are right, but doesn't *require* them to be metaphysically true. It requires citizens to *act* as if the state is a co-owner.
          *   *Reconciliation:* A "hypothetical contract" view (Rawls). You don't own the pre-tax sum because the framework enabling that sum is collectively sustained.

      *   **Phase 2: Human Motivation (Incentives vs. Norms):**
