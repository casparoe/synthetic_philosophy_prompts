  1. Hayek's knowledge problem implies the provost's office cannot access the dispersed, tacit information departments hold about specific research opportunities, making any central formula inherently blind to local efficiency.
  2. Without external market exchanges for internal goods like teaching loads, the proposed shadow prices will be arbitrary administrative guesses rather than genuine reflections of scarcity, validating Mises's critique of Lange's trial-and-error.
  3. Centralizing the budget removes the local discovery process, meaning departments will lobby the center for favorable formula weights instead of competing to generate value, creating a political rather than economic allocation mechanism.
  4. Unlike a national economy, a university is a single firm where some central coordination is efficient, so the calculation debate only applies if the internal transaction costs of centralization exceed the benefits of unified planning.
  5. The dean's promise to revisit numbers annually is too slow to capture real-time changes in academic demand, freezing resources in past configurations while preventing the dynamic adjustment that actual prices facilitate.
