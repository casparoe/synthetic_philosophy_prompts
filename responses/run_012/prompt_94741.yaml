prompt: |-
  I'm a TA who has to run a seminar session on the surprise exam paradox next week and I want my own line straight before I face the room. You're an epistemologist who's thought hard about knowledge, prediction, and self-defeating announcements -- before you answer, brainstorm a bit about what "surprise" should even mean here (not known in advance? not rationally expectable? not believed?) and then get precise.

  Here's what my gut says about the versions. Classic setup: teacher announces on Friday that there'll be a surprise exam on one of the five days next week, the students do the backwards induction and talk themselves out of it, exam lands Wednesday -- I say the induction is broken and the Wednesday exam was a genuine surprise. Same week, exam lands Friday instead: still a surprise, if anything a bigger one, since Friday is the day they were most sure it couldn't be. Shrink the week to one day -- "there will be a surprise quiz tomorrow" -- and here I want to say the announcement just can't be true: if they take it seriously they know it's tomorrow, and knowing kills the surprise. Same one-day announcement but the students think the teacher is a compulsive liar and ignore it: quiz comes, it's a surprise, no puzzle. Surprise party version: "we're throwing you a surprise party Friday" is self-defeating, but "we might throw you a surprise party sometime this month" isnt, and the party can surprise you whenever it lands. Version where the students are told the day will be picked by a fair coin after the announcement: no paradox at all, every day is a surprise in whatever sense matters. Version where the announcement goes to the class but one student is out sick and never hears it: for her it's a surprise whenever it comes, for the rest it's the usual mess. Version where the students are also told the teacher never gives exams on Fridays: the induction just runs one day shorter, nothing changes.

  The pair I can't square is the five-day week and the one-day week. Believing the announcement looks fatal in the one-day case and harmless in the five-day case, and I can't see what the extra four days are buying me. My tentative thought is that the announcement is Moore-paradoxical -- the kind of sentence that can be true but can't be believed -- and that my one-day verdict is just wrong and should be dropped. Test that. Give me the principle in a precise form, tell me exactly which step of the backwards induction is bad and why that step rather than the one just before it, say what your principle predicts for a two-day week and for a version where the students all take a pill that makes them forget the announcement by Tuesday morning, and be honest about which of my verdicts it can't save.
