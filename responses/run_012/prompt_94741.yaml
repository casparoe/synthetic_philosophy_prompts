answer: |-
  Here is the line I would take if I were standing in your shoes. I'll start by sharpening the definition of "surprise," then give you the principle, locate the exact break in the induction, and test it against your cases.

  ### 1. Defining "Surprise"
  Your gut is right to hesitate between "not known," "not believed," and "not rationally expectable." For the paradox to bite, we need the strongest epistemic operator that still feels natural in a classroom.

  Don't use *belief*. (I can believe the exam is Friday and still be surprised if I'm wrong).
  Don't use *certainty*. (Too psychological).
  Use **Knowledge**.

  **Precise Definition:** An exam on day $d$ is a *surprise* if and only if, on the evening of $d-1$, the students do not **know** that the exam will be on day $d$.
  Let $K$ stand for "The students know on the evening prior."
  The Announcement ($A$) is: "There will be an exam on one day $d \in \{1...5\}$, and for that day, $\neg K(\text{Exam on } d)$."

  ### 2. The Core Principle: Epistemic Blindspots
  Your hunch about Moore-paradoxicality is very close to the standard epistemological solution (championed by philosophers like Roy Sorensen and Crispin Wright). The announcement creates an **Epistemic Blindspot**.

  **The Principle:** *The Announcement is true, but it cannot be known by the students prior to the exam.*
  Formally: $A$ is consistent, but $K(A)$ is false.
  The sentence has the structure: "$P$, but you will not know $P$." (A Moorean sentence). If you come to know it, it becomes false. Therefore, you cannot know it.

  This resolves your anxiety about the 1-day vs. 5-day gap. They are not fundamentally different; the 1-day case is just a degenerate version of the blindspot where the contradiction is immediate, whereas in the 5-day case, the contradiction is hidden behind the induction.

  ### 3. The Flaw in the Backwards Induction
  You asked for the exact step. The backwards induction looks like this:
  1.  **Friday:** If we reach Thursday night without an exam, we know it must be Friday. So Friday can't be a surprise.
  2.  **Thursday:** Since Friday is eliminated, if we reach Wednesday night... it must be Thursday. So Thursday can't be a surprise.
  3.  ...and so on.

  **The Broken Step:** The very first move (eliminating Friday).
  **Why:** To eliminate Friday, the students must reason: "If no exam by Thursday, we will *know* it is Friday."
  This deduction relies on the premise that the students **know the Announcement is true** ($K(A)$).
  However, by the Blindspot Principle, $\neg K(A)$.
  The students cannot use the Announcement as a known premise to deduce the day. Because they don't *know* the announcement is true (even if it *is* true), they cannot rule out Friday. If Friday remains possible, Thursday remains possible, and the whole induction collapses.

  **In short:** The induction assumes the announcement generates knowledge. The announcement explicitly denies that it generates knowledge. You cannot use a statement to prove itself false.

  ### 4. Testing the Variations

  **The Two-Day Week**
  *   *Setup:* Exam Mon or Tue. Surprise.
  *   *Prediction:* Same as 5-day. Students cannot eliminate Tuesday because doing so requires knowing the announcement is true. They don't know that. So Tuesday remains a live option. If the exam is on Tuesday, they are surprised (because they didn't *know* it was Tuesday).
  *   *Verdict:* Paradox dissolves. Exam happens, surprise holds.

  **The Forgetting Pill (Forget by Tuesday)**
  *   *Setup:* Announcement made Sunday. Pill taken Monday morning. Exam Tuesday.
  *   *Prediction:* On Monday night, the students do not possess the announcement in memory. Therefore, $K(A)$ is trivially false. They cannot run the induction.
  *   *Verdict:* No paradox. The exam is a genuine surprise. This confirms that the paradox relies entirely on the *persistence of knowledge* of the announcement.

  **The One-Day Week (Your Trouble Spot)**
  *   *Your Verdict:* "Announcement just can't be true."
  *   *My Correction:* The announcement *can* be true, but it cannot be *known*.
      *   If the student *knows* the announcement is true, then they know the exam is tomorrow. Then it's not a surprise. Then the announcement is false.
      *   If the student *does not know* the announcement is true (perhaps they think the teacher might be mistaken or lying), then they don't know the exam is tomorrow. The exam happens. It is a surprise. The announcement is true.
  *   *Teaching Point:* Tell your class the 1-day case isn't logically impossible; it's **performatively self-defeating if believed**. If the students trust the teacher enough to *know* $A$, $A$ becomes false. If they trust the teacher just enough to *hear* $A$ but not *know* it, $A$ remains true. The 5-day case allows a buffer (Wednesday) where $A$ can be true even if they heard it, because the induction failed to give them knowledge.

  ### 5. Honest Assessment: Which Verdicts Can't Be Saved?
  You asked me to be honest about where this principle fails to match your intuition.

  1.  **The "Liar Teacher" Version:** *Saved.* If students think the teacher is a liar, $\neg K(A)$. No induction. Exam is a surprise. Matches your gut.
  2.  **The "Sick Student" Version:** *Saved.* She lacks $K(A)$. No induction. Surprise. Matches your gut.
  3.  **The "No Fridays" Version:** *Saved.* Just shortens the index. The blindspot remains. Matches your gut.
  4.  **The 1-Day Version:** *Needs Correction.* You said the announcement "can't be true." The principle says it *can* be true, provided the students don't *know* it. You should adjust your line to: "The announcement cannot be *known to be true* by the students," rather than "cannot be true."
  5.  **The "Friday Exam" in a 5-Day Week:** *Saved, but with a caveat.* You said a Friday exam is "still a surprise, if anything a bigger one." The principle agrees it's a surprise (since they didn't know), but note: if the exam is on Friday, the students *will* know on Thursday night (if no exam occurred Mon-Thu). Does this violate the announcement?
      *   *Nuance:* The announcement says "You won't know the night before." If the exam is Friday, and they deduce it Thursday night, the announcement is *false*.
      *   *Resolution:* This is why the Friday exam is actually *less* stable than the Wednesday exam. A Wednesday exam validates the announcement (they didn't know Tuesday night). A Friday exam *could* falsify it (if they successfully eliminate Mon-Thu). But since the elimination logic is flawed, they *won't* eliminate Mon-Thu. So they won't know Thursday night. So even a Friday exam can be a surprise. Your verdict holds, but the logic is tighter than "bigger surprise."

  ### Summary for the Seminar Room
  If I were you, I would write this on the board:

  1.  **Surprise = Lack of Knowledge** (not lack of belief).
  2.  **The Announcement is a Blindspot:** It is true, but unknowable ($A \land \neg K(A)$).
  3.  **The Induction Error:** The students assume $K(A)$ to start the induction. Since $\neg K(A)$, the induction never starts.
  4.  **The 1-Day vs. 5-Day:** Both are blindspots. In the 1-day case, believing the teacher kills the surprise immediately. In the 5-day case, the logic is complex enough that belief doesn't automatically grant knowledge of the day, allowing the surprise to survive until the exam occurs.

  This line respects your intuition that the induction is broken, clarifies *why* (the knowledge assumption), and fixes the 1-day case without abandoning your core insight. Good luck with the seminar.
