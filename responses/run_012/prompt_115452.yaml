  **Variant 1 (Lived):** Jamie and Sam undergo the regimen in their ordinary household. They report Alex's memories as their own ("I recall our honeymoon"), feel intentions arise internally, and act spontaneously from his character without consulting external data.
  **Variant 2 (Simulated):** Jamie and Sam undergo the regimen in their ordinary household. They access Alex's data perfectly but report it externally ("Alex would recall our honeymoon"), predicting choices algorithmically without feeling memories as lived experience or claiming first-personal ownership.

  (b)
  | View | Variant 1 (Lived) | Variant 2 (Simulated) |
  | :--- | :--- | :--- |
  | **Continuity** | No Survival | No Survival |
  | **Narrative** | Survival | Survival |
  | **Distributed** | Survival | No Survival |

  *Reasons:* Continuity: Chain split across two subjects, not one continuing subject. Narrative: Story continues via carriers; voice is surface feature. Distributed: Pattern lived first-personally vs. predicted third-personally.

  (c)
  1.  **Continuity (Variant 1):** Verdict follows from "one continuing subject". Jamie and Sam are two biological subjects; the causal chain is not carried by *one* subject, breaking continuity regardless of inner experience.
  2.  **Continuity (Variant 2):** Verdict follows from "one continuing subject". The split across two brains violates the requirement for a single continuing carrier, identical to Variant 1.
  3.  **Narrative (Variant 1):** Verdict follows from "story actually being spun". The life-story continues through action and speech; the view treats first-personal voice as surface, not existential.
  4.  **Narrative (Variant 2):** Verdict follows from "story actually being spun". The story continues via third-personal narration; since voice is not a condition on existence, survival is affirmed.
  5.  **Distributed (Variant 1):** Verdict follows from "lived from the inside". Carriers run the pattern first-personally. The view counts this as **one self** re-tokened across multiple brains, preserving identity through phenomenological overlap.
  6.  **Distributed (Variant 2):** Verdict follows from "not merely predict it from the outside". Carriers simulate output without inner ownership. This fails the necessary condition for re-tokening, reducing the pattern to mere influence rather than survival.

  (d)
  **Isolated Variable:** Phenomenological ownership (whether the pattern is experienced as "mine" vs. "his/hers").
  **Collapse:** If removed, the distributed view loses its restriction against third-personal simulation, collapsing into the narrative view where any continuation of the story counts as survival, rendering the distributed view distinct only in name.

  (e)
  **Objection:** If behavioral output and psychological connections are identical, denying survival based on private qualia is arbitrary epiphenomenalism; the "inner feel" adds nothing to the functional persistence of the person.
  **Judgment:** The case survives because the distributed view explicitly defines persistence via the *mode* of tokening (lived vs. predicted), making the qualia constitutive of the self rather than incidental; to accept the objection is to abandon the view's core specification.
