prompt: |-
  Hey — I'm a third-year student in a philosophy of biology course and we just wrapped the unit on functions. I get the four standard accounts on the textbook examples, but our prof threw a made-up case at us and I honestly can't tell how the accounts are supposed to handle it, and I suspect a couple of them just wave their hands.

  The case: a hypothetical deep-sea isopod I'll call the glass isopod. It has a translucent patch on its back. The patch is a byproduct — the same developmental tweak that thins the exoskeleton there happens to let light through, and no ancestral population was ever selected for transparency. But right now the patch really does help: it breaks up the isopod's silhouette against the glow of the seafloor, the isopod's main predator hunts by silhouette, and isopods with the patch are surviving and reproducing at a higher rate than ones without. So there's no selection history for the effect, but the effect is currently doing something and is currently under selection.

  The four accounts I'm supposed to use: (1) the history one — an effect is a function only if it was selected for in the past; (2) the causal-role one — an effect is a function if it causally contributes to a capacity of the whole system, history irrelevant; (3) the goal-directed/organizational one — an effect is a function if it contributes to the self-maintenance of a goal-directed system, no history needed; (4) the propensity one — an effect is a function if the trait has a propensity to produce it and it would raise fitness, even if it hasn't been selected for yet.

  Can you rank those four from best to worst at handling the glass isopod case? Please keep it tight, and don't just describe each view — I want to know which ones actually get the case right and which one fumble it.

  Format it like this:
  - The case in my words: about 2 sentences.
  - Tier list: the ranking, one or two sentences per account saying why it lands where it does.
  - The real disagreement: a short paragraph on what the case actually exposes.
  - Bottom line: one sentence naming the winner and the loser.

  Thanks!
