  7.  **Writing the Content (incorporating the constraints):**
      *   *Case 1:* Marcus. Marathon training. Party invitation. Preference reversal (Party > Sleep). Judgment revision (Party is actually better for morale). Action matches judgment.
      *   *Case 2:* Sarah. Saving money. Shoes. Stable preference (Saving > Shoes). Judgment (Ought to save). Action (Buys shoes). Reason (Weariness/impulse acknowledged as bad).
      *   *Analysis:* Be precise about the "Identification Thesis" (Weakness = Hyperbolic Discounting).

      *(Final Polish)*: Ensure the tone is analytical and philosophical. Check word counts/paragraph limits. (The prompt asks for "one paragraph each" for the cases, the analysis can be structured as requested).

      *Wait, one detail:* "The cases must generate their verdicts from the psychology built into them." I need to make sure the text describes the psychology vividly enough that the verdict is inevitable *within the story*.

      *Case 2 nuance:* To ensure no discounting, she must not find the shoes *more* attractive at the register than she did at home. She finds them equally attractive, but her resolve crumbles. The "discounting" model says the *value* of the immediate reward goes up. I need to say the *value* stays same, but the *will* fails.

