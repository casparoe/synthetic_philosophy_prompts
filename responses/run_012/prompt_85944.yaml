      *Conclusion:* Case 2 is harder to absorb because it attacks the link between choice and preference directly, whereas Case 1 attacks the link between judgment and preference (which is easier to muddy via self-deception). Actually, Case 1 is easier for the defender to absorb (call it rationalization). Case 2 forces the defender to deny the agent's first-person authority on their own preferences entirely. Case 2 does more damage.

      *Wait, does the pair refute or generalize?* If Case 2 stands, the identification is false, not just a generalization. But if the defender uses "Revealed Preference," they can always win. I should argue that within the philosophy of action (not strict behaviorist econ), Case 2 refutes it. I will conclude it refutes the strict identification.

