answer: |-
  **Case 1: The Rational Reviser**
  Marcus is training for a marathon and judges on Thursday that skipping a Friday night party to sleep early is best, valuing the race performance over socializing. As Friday evening arrives, the immediate pull of the party spikes disproportionately—a textbook hyperbolic discounting curve where the sooner reward surges as it becomes available—and he now prefers the party to the sleep. Crucially, however, Marcus does not treat this surge as a mere temptation to be resisted; he reflects on his current mental state and genuinely revises his normative judgment, concluding that the morale boost from the party is now more valuable to his overall well-being than the marginal gain from extra sleep. He attends the party acting on this new, articulate judgment that he ought to go, with no inner conflict or sense of failure, seamlessly aligning his action with his revised evaluation of the options.

  **Analysis of Case 1**
  The thesis that weakness of will *just is* hyperbolic discounting classifies Marcus as weak-willed because his intertemporal preferences reverse: he ranked sleep above the party at a distance, but the party above sleep when immediate. The single feature keeping this out of the weakness category is the **sincere revision of normative judgment** to match the new preference. If this feature were removed—if he judged he ought to sleep but went anyway—it would become a standard case of akrasia. A defender of the identification would absorb this case by redescribing Marcus's judgment revision as post-hoc rationalization or self-deception, insisting that his "considered view" is merely a cover for the preference shift, thereby denying the sincerity of his better judgment to preserve the link between reversal and weakness.

  **Case 2: The Consistent Akratēs**
  Sarah judges on Monday that she ought to save money for a house rather than buy expensive shoes, and she maintains this exact ranking of outcomes on Saturday when she stands at the register; the shoes do not appear more valuable to her now than they did then, nor does she discount the future goal more heavily in the moment. Despite this time-consistent preference for saving, and while acknowledging that buying the shoes is wrong all-things-considered, she intentionally purchases them, citing a reason she accepts as bad: she is simply weary of exercising self-control and chooses to indulge despite knowing the cost outweighs the benefit. She acts against her stable better judgment and stable outcome preferences, not because her valuation shifted, but because her executive commitment to act on that valuation collapsed.

  **Analysis of Case 2**
  The identification thesis struggles with Sarah, implying she cannot be weak-willed because there is no preference reversal to constitute the weakness; it must claim her action reveals a hidden preference shift she fails to report. The single feature keeping this out of the discounting category is the **stability of outcome valuation** at the moment of action. If this feature were removed—if she decided the shoes were actually worth the cost—it would become a case of rational choice (or Case 1). A defender of the identification would absorb this by invoking "revealed preference," denying the agent's first-person authority and arguing that choosing the shoes *proves* she preferred them, thus reconstructing a preference reversal where the agent reports none.

  **Conclusion**
  Case 2 does significantly more damage to the identification than Case 1. In Case 1, the defender can plausibly appeal to the ubiquity of self-deception to claim the judgment revision was insincere, preserving the link between reversal and weakness. In Case 2, the defender must deny the agent's access to her own preferences entirely, reducing the theory to a tautology where action always defines preference, which strips the concept of weakness of will of its normative force. Consequently, the pair does not merely show the identification is a rough empirical generalization; it refutes the strict identity claim, demonstrating that preference reversal is neither necessary (Case 2) nor sufficient (Case 1) for weakness of will.
