answer: |-
  ### Part 1: Brainstorming the Logical Space

  Before drawing the tree, we need to map the criteria available to us. We aren't looking for "what Popper said," but rather "what features actually distinguish a history book from a conspiracy pamphlet." Here are the candidate criteria derived from the logical space of demarcation:

  1.  **Source of Authority:** Is the distinction based on *truth-tracking* (evidence) or *gatekeeping* (institutions)?
  2.  **Boundary Sharpness:** Is the line a binary switch (science/pseudo) or a sliding scale (reliable/unreliable)?
  3.  **Testability:** Can the claims be empirically checked, or are they too vague to fail?
  4.  **Falsifiability:** Does the theory allow for a scenario where it would be proven wrong, or does it explain every possible outcome?
  5.  **Resilience:** When evidence contradicts the theory, do proponents change the theory or dismiss the evidence?
  6.  **Core Protection:** Is there a specific "sacred" assumption that is never allowed to fail, while peripheral claims shift to protect it?
  7.  **Procedural Norms:** Is the distinction based on following community rules (citations, peer review, data transparency)?
  8.  **Consilience:** Must the historical narrative fit with findings from independent fields (geology, astronomy, physics)?
  9.  **Internal Coherence:** Does the story hang together logically, regardless of external facts?
  10. **Motivation:** Is the goal to find the truth or to confirm a pre-existing narrative? (Note: This is often hard to judge externally, so we will use it sparingly).

  ***

  ### Part 2: The Demarcation Decision Tree

  **Starting Commitment:** *"Yes, there is a genuine difference between doing history and doing pseudohistory."*
  *(Note: For the Sociological leaf, "genuine difference" means a real social distinction, even if not a truth-based one.)*

  **Node 1: The Source of the Line**
  Is the difference between history and pseudohistory primarily about **how the world works** (evidence and logic) or about **who holds the microphone** (institutions and power)?
  *   **Branch A (Institutions/Power):** Go to Leaf 1.
  *   **Branch B (Evidence/Logic):** Go to Node 2.

  **Node 2: The Shape of the Boundary**
  Is this difference a **hard wall** (you are either doing history or you aren't) or a **sliding scale** (accounts can be more or less reliable)?
  *   **Branch A (Sliding Scale):** Go to Leaf 2.
  *   **Branch B (Hard Wall):** Go to Node 3.

  **Node 3: The Mode of Failure**
  When pseudohistory fails, is it primarily because its claims are **too vague to test** or because its proponents are **too stubborn to change**?
  *   **Branch A (Too Vague):** Go to Node 4.
  *   **Branch B (Too Stubborn):** Go to Node 5.

  **Node 4: The Unfalsifiability Check**
  Does the theory explain **every possible outcome** so well that no event could ever count against it?
  *   **Branch A (Yes, fits everything):** Go to Leaf 3.
  *   **Branch B (No, specific but wrong):** Go to Leaf 4.

  **Node 5: The Structure of Stubbornness**
  Is there a specific **"core belief"** that followers refuse to abandon, even if they have to change everything else around it?
  *   **Branch A (Yes, Protected Core):** Go to Node 6.
  *   **Branch B (No, General Denial):** Go to Node 7.

  **Node 6: The Protective Belt**
  Do proponents constantly **adjust minor details** to save that core belief, or do they simply **repeat the core** without adjustment?
  *   **Branch A (Adjusts details):** Go to Leaf 5.
  *   **Branch B (Repeats without adjustment):** Go to Leaf 6.

  **Node 7: The Nature of the Violation**
  Is the main problem that they break the **rules of research** (citations, data handling) or that their story contradicts **established facts**?
  *   **Branch A (Breaks Rules):** Go to Leaf 7.
  *   **Branch B (Contradicts Facts):** Go to Node 8.

  **Node 8: The Source of Facts**
  Does the story primarily contradict findings from **independent natural sciences** (geology, astronomy) or does it fail due to **internal logical contradictions**?
  *   **Branch A (Natural Sciences):** Go to Leaf 8.
  *   **Branch B (Internal Logic):** Go to Leaf 9.

  ***

  ### Part 3: The Leaves (Positions & Awkward Commitments)

  **Leaf 1: Strong Social Constructivist**
  *   **Path:** Node 1 (Institutions).
  *   **Definition:** The line is purely sociological; "history" is just the narrative supported by the dominant institutions.
  *   **Most Awkward Commitment:** You must admit that if the Nazis had won WWII, their racial history would be just as "real" as ours, provided they held the institutional power.

  **Leaf 2: Epistemic Pluralist**
  *   **Path:** Node 1 (Evidence) → Node 2 (Scale).
  *   **Definition:** There is no sharp line; accounts vary in quality, and "pseudohistory" is just the far end of a spectrum of reliability.
  *   **Most Awkward Commitment:** You cannot call a book "pseudohistory" without implying it has *some* historical value, just very little.

  **Leaf 3: Popperian Falsificationist**
  *   **Path:** Node 1 (Evidence) → Node 2 (Wall) → Node 3 (Vague) → Node 4 (Fits Everything).
  *   **Definition:** Pseudohistory is defined by making claims that are compatible with any evidence, rendering them scientifically meaningless.
  *   **Most Awkward Commitment:** A theory that is demonstrably false is still "scientific," while a vague theory that happens to be true is "pseudoscientific."

  **Leaf 4: Logical Empiricist**
  *   **Path:** Node 1 (Evidence) → Node 2 (Wall) → Node 3 (Vague) → Node 4 (Specific but Wrong).
  *   **Definition:** Pseudohistory makes testable claims that are simply proven false by the available evidence.
  *   **Most Awkward Commitment:** You must classify honest mistakes or outdated theories from the past as "pseudohistory" simply because we now know they are false.

  **Leaf 5: Lakatosian Research Program**
  *   **Path:** Node 1 (Evidence) → Node 2 (Wall) → Node 3 (Stubborn) → Node 5 (Core) → Node 6 (Adjusts).
  *   **Definition:** Pseudohistory is a "degenerating" program that protects a hard core by constantly ad-hoc adjusting the protective belt without predicting new facts.
  *   **Most Awkward Commitment:** You must admit a theory can be "scientific" even if it is currently false, as long as it is generating new research questions.

  **Leaf 6: Dogmatist**
  *   **Path:** Node 1 (Evidence) → Node 2 (Wall) → Node 3 (Stubborn) → Node 5 (Core) → Node 6 (Static).
  *   **Definition:** Pseudohistory is static ideology masquerading as inquiry; it refuses to adapt to any new information.
  *   **Most Awkward Commitment:** You cannot distinguish between a religious creed and a historical theory unless the historical theory changes its mind.

  **Leaf 7: Methodological Formalist**
  *   **Path:** Node 1 (Evidence) → Node 2 (Wall) → Node 3 (Stubborn) → Node 5 (No Core) → Node 7 (Rules).
  *   **Definition:** The difference is procedural; pseudohistory fails to follow the community's enforced norms of citation, peer review, and data transparency.
  *   **Most Awkward Commitment:** A true historical account written by a lone genius without footnotes is "pseudohistory," while a well-cited lie is "history."

  **Leaf 8: Consilience Realist**
  *   **Path:** Node 1 (Evidence) → Node 2 (Wall) → Node 3 (Stubborn) → Node 5 (No Core) → Node 7 (Facts) → Node 8 (Natural Sciences).
  *   **Definition:** History must fit with the "hard" sciences; pseudohistory is any narrative that contradicts physics, geology, or astronomy.
  *   **Most Awkward Commitment:** You must accept that historical truth is subordinate to geological truth, even in areas where geologists have no expertise.

  **Leaf 9: Internalist Coherentist**
  *   **Path:** Node 1 (Evidence) → Node 2 (Wall) → Node 3 (Stubborn) → Node 5 (No Core) → Node 7 (Facts) → Node 8 (Internal Logic).
  *   **Definition:** Pseudohistory fails because it is internally inconsistent or narratively impossible, regardless of external evidence.
  *   **Most Awkward Commitment:** A story that is perfectly logical and consistent is "history" even if every single event in it never actually happened.

  ***

  ### Part 4: Stress Testing the Cases

  Here is how the tree sorts the three cases your friends are fighting about.

  **Case 1: Atlantis (The "Moved to Antarctica" variants)**
  *   **Run:** Evidence → Hard Wall → Stubborn → Protected Core (Atlantis existed) → Adjusts Belt (Location changes to avoid disproof).
  *   **Result:** **Leaf 5 (Lakatosian).**
  *   **Analysis:** The core belief ("Plato was literal") never changes. The auxiliary claims ("It was in the Atlantic," then "It was in the Andes," then "It was under the ice") shift constantly to protect the core from geological disproof. This fits the Lakatosian definition of a degenerating research program.

  **Case 2: Ancient Aliens**
  *   **Run:** Evidence → Hard Wall → Too Vague → Fits Everything.
  *   **Result:** **Leaf 3 (Popperian Falsificationist).**
  *   **Analysis:** The claim "aliens did it" is compatible with any archaeological find. If we find advanced tech, aliens gave it. If we find primitive tech, aliens hid it. Because no outcome counts against the theory, it fails the falsifiability test.

  **Case 3: Fomenko's New Chronology**
  *   **Run:** Evidence → Hard Wall → Stubborn → No Protected Core (or Core is "History is Fake") → Contradicts Facts → Natural Sciences.
  *   **Result:** **Leaf 8 (Consilience Realist).**
  *   **Analysis:** Fomenko's work is mathematically dense (avoiding the "Vague" trap) and adjusts constantly (avoiding "Static"). However, it ultimately lands here because it requires the Earth's orbit and precession to have changed drastically in recorded history, contradicting astronomy and physics. It fails because it cannot coexist with the natural sciences.

  ***

  ### Part 5: Logical Space Analysis

  **Empty Combinations (Incoherent or Unattractive)**
  1.  **Node 2 (Sharp) + Node 2 (Scale):** Logically impossible. A boundary cannot be both a hard wall and a sliding scale. This is why Node 2 forces a choice.
  2.  **Node 3 (Vague) + Node 5 (Protected Core):** Theoretically possible, but rare. Usually, if a theory is too vague to test (Node 3), it doesn't *need* a protected core (Node 5) because it never faces a threat. This path is logically coherent but empirically empty; few pseudohistories are both unfalsifiable *and* dogmatically structured.
  3.  **Leaf 4 (Logical Empiricist) as a standalone:** This position is often unattractive because it defines pseudohistory simply as "false history." This collapses the distinction between *lying* and *pseudoscience*. Most philosophers reject this because honest error is part of real history, whereas pseudohistory implies a structural flaw in method, not just outcome.

  **Indistinguishable Positions**
  1.  **Leaf 7 (Methodological Formalist) vs. Leaf 8 (Consilience Realist):**
      *   *The Overlap:* In practice, breaking methodological rules (hiding data) often leads to contradicting natural sciences.
      *   *The Distinction:* They are separable in principle. A historian could follow all citation rules perfectly (satisfying Leaf 7) but still write a narrative that violates physics (failing Leaf 8). Conversely, a historian could violate citation norms (failing Leaf 7) but be right about the geology (satisfying Leaf 8). The tree separates them at Node 7 (Rules vs. Facts).
  2.  **Leaf 5 (Lakatosian) vs. Leaf 6 (Dogmatist):**
      *   *The Overlap:* Both involve stubbornness.
      *   *The Distinction:* Leaf 5 requires *progress* (even if degenerating) via adjustment. Leaf 6 is static. If a group stops adjusting their auxiliary claims and just repeats the core, they slide from Lakatosian to Dogmatist. This is a real distinction, but in the wild, groups often oscillate between the two.

  **Unexplored Space**
  *   **Node 8 (Internal Logic) as a primary driver:** Leaf 9 (Internalist Coherentist) is rarely occupied as a *sole* criterion. Most historians care about external reality, not just internal consistency. This leaf represents a view that is philosophically coherent (coherentism) but practically unattractive to historians who claim to study the *past*, not just *stories*.

  **Referee's Note:**
  If your friends get stuck, run their specific arguments through Node 1. If Friend A says "They ignore the evidence," they are on the Evidence branch. If Friend B says "They aren't allowed to publish," they are on the Institutions branch. The tree shows that they aren't necessarily disagreeing about the *cases*, but about the *criteria* for judgment. You can validate both by showing they land on different, equally defensible leaves (e.g., Consilience Realist vs. Social Constructivist), provided they accept the awkward commitments of their chosen leaf.
