answer: |-
  ### Part 1: Evaluation of Your Proposed Axes

  Your three axes are strong. They track the core theoretical distinctions between social reciprocity and corrupt exchange without requiring you to cite the literature.

  1.  **Continuing Obligation vs. Discharged Debt:** This distinguishes a *relationship* (ongoing, diffuse) from a *transaction* (closed, specific). Corruption usually seeks to close the loop quickly (cash for signature). Relationships keep the loop open. **Keep this.**
  2.  **Specific/Timed vs. Diffuse/Open-Ended:** This distinguishes a *quid pro quo* (I give X so you do Y now) from *goodwill* (I give X so we are friends generally). **Keep this.**
  3.  **Public/Legible vs. Concealed:** This is the most critical operational test. Corruption requires secrecy to avoid accountability. Reciprocity often thrives in public view. **Keep this.**

  **The Missing Axis:** You need a fourth: **Decision Distortion.**
  A transfer can be public, diffuse, and create ongoing obligation, yet still be corrupt if it alters a technical decision that should be merit-based. For example, a public, ongoing patronage relationship with a supplier who delivers poor goods is still a failure of programmatic integrity.
  *   **Revision:** Add **"Does this transfer influence a specific discretionary decision?"**

  ### Part 2: The Decision Procedure (The "20-Minute Test")

  This procedure is designed as a funnel. If you get a "Stop" at any stage, you do not proceed to the next question.

  **Default Burden of Proof:**
  *   **For Social/Relational Transfers (Gifts, Weddings, Per Diems):** Presume **Permissible**. The burden is on Compliance to show *specific harm* or *concealment*.
  *   **For Procurement/Official Transfers (Suppliers, Permits, Payments):** Presume **Impermissible**. The burden is on the Staff to show *transparency* and *lack of distortion*.

  **Cost of Error:**
  *   **False Positive (Blocking a harmless gift):** Cost is relational friction and staff morale. (Acceptable risk).
  *   **False Negative (Allowing a harmful bribe):** Cost is legal liability and mission failure. (Unacceptable risk).
  *   *Note:* The procedure leans toward blocking in procurement cases and allowing in social cases to balance these costs.

  ---

  #### Step 1: The Legality & Policy Hard Stop
  **Question:** Is this practice explicitly illegal under local law or US/UK anti-bribery law (e.g., FCPA), regardless of local custom?
  *   **Yes:** **STOP.** Do not pass go. Escalate to Legal/CD immediately. (Exception: See Step 5 for Collective Action).
  *   **No:** Proceed to Step 2.
  *   *Judgment Trap:* Do not confuse "illegal" with "against donor policy." Only law triggers a hard stop here.

  #### Step 2: The Publicity Test (The "Headline" Rule)
  **Question:** If the details of this transfer (amount, recipient, reason) were published in the NGO's monthly newsletter or a local newspaper, would it cause embarrassment or reputational damage to the organization?
  *   **Yes (It must be hidden):** **STOP.** Verdict: **Reject.** Concealment is the primary marker of corrupt intent.
  *   **No (It is open):** Proceed to Step 3.
  *   *Judgment Trap:* Distinguish between *privacy* (cultural modesty) and *secrecy* (fear of exposure). If the recipient asks you not to tell anyone, it fails this test.

  #### Step 3: The Specificity Test (Quid Pro Quo)
  **Question:** Is there an explicit or implicit expectation that a *specific* decision (permit, contract, hiring) will be made in exchange for this transfer, specifically *before* the decision is finalized?
  *   **Yes (Timed/Specific):** **STOP.** Verdict: **Reject.** This is a transaction, not a relationship.
  *   **No (Diffuse/Open):** Proceed to Step 4.
  *   *Judgment Trap:* Watch for "timing coincidences." A gift given the day before a bid deadline is specific, even if verbally framed as "friendship."

  #### Step 4: The Distortion Test (Programmatic Integrity)
  **Question:** Does this transfer create a risk that a technical or merit-based decision will be altered to favor the giver/recipient? (e.g., Is the cousin the best supplier, or just the connected one?)
  *   **Yes (Decision Risk):** **STOP.** Verdict: **Escalate to Country Director (CD).** This is a values/strategy call.
  *   **No (No Decision Impact):** Proceed to Step 5.

  #### Step 5: The "Collective Action" & Norm Conflict Valve
  **Question:** Is this a shared local norm where an individual employee cannot opt out without incurring significant personal cost or halting essential project work (e.g., a "speed payment" required to release legally entitled funds)?
  *   **No:** Verdict: **Approve** (if social) or **Reject** (if procurement).
  *   **Yes:** **Escalate to CD with a "Norm Conflict Flag."**
      *   *Instruction:* Do not frame this as a staff violation. Frame it as an **Organizational Risk Acceptance**. The question for the CD is not "Did the staff break the rule?" but "Is the organization willing to operate in an environment where this rule is unenforceable?"
      *   *Donor-Parochialism Objection:* This is where you register that the rule may be the problem. Checking this box does not auto-approve the act, but it prevents the staff member from being disciplined for a systemic failure.

  ---

  #### Where the Decision Hands Off
  *   **Compliance Officer (You):** You can approve Steps 1–4 negatives (Rejects) and Step 5 negatives (Approvals). You have 20 minutes.
  *   **Country Director:** Any Step 4 "Yes" (Decision Risk) or Step 5 "Yes" (Norm Conflict). These require weighing mission risk against ethical stance.
  *   **Legal Counsel:** Any Step 1 "Yes."

  #### Where You Are Making Judgment, Not Applying Rules
  1.  **Step 2 (Embarrassment):** "Embarrassment" is subjective. You are judging community standards, not just NGO policy.
  2.  **Step 3 (Implicit Expectation):** You are inferring intent from timing. This is the highest risk area for bias.
  3.  **Step 5 (Significant Cost):** You must judge what counts as "significant." Is it social awkwardness (not enough) or physical risk/job loss (enough)?

  ---

  ### Part 3: Application to Cases

  #### Case 1: The Wrapped Gift at the Launch
  *   **Step 1 (Legality):** Legal.
  *   **Step 2 (Publicity):** Public. It was presented at a launch. No request for secrecy. **(Pass)**
  *   **Step 3 (Specificity):** Diffuse. It marks an event, not a specific pending decision. **(Pass)**
  *   **Step 4 (Distortion):** Low risk. A launch gift does not typically alter technical project decisions. **(Pass)**
  *   **Step 5 (Norm Conflict):** Not applicable.
  *   **Verdict:** **Approve.**
  *   **Reasoning:** This fits the "relational maintenance" category. It creates goodwill without a specific debt.

  #### Case 2: The Supplier Who Is a District Official's Cousin
  *   **Step 1 (Legality):** Legal (nepotism laws vary, assume legal locally).
  *   **Step 2 (Publicity):** **Fail.** Usually, this relationship is not disclosed in the bid documents. If the question is "Can we publish that the winner is the official's cousin?" and the answer is "No, that would look bad," it fails the Publicity Test.
  *   **Verdict:** **Reject / Require Mitigation.**
  *   **Reasoning:** This cuts against the sympathy that "kinship ensures trust." While locally true, for an NGO, this creates a **Clientelist Linkage** rather than a **Programmatic Linkage**. It ties the NGO's success to a specific political family rather than merit.
  *   **Remedy:** The supplier can only be used if the relationship is **disclosed publicly** in the contract file and the pricing is vetted against three independent bids. If disclosure is refused, the supplier is barred.
  *   **Instinct Overridden:** The instinct to accept local trust mechanisms. The procedure overrides this because undisclosed kinship in procurement creates a *concealed* obligation that compromises the NGO's neutrality.

  #### Case 3: The Customary Payment to a Village Authority (Facilitation)
  *   **Step 1 (Legality):** **Fail.** (Assume this violates anti-bribery statutes or local law, even if "customary").
  *   **Action:** Hard Stop. Escalate to Legal.
  *   **Hypothetical (If Legal Gray Area):** Proceed to Step 5.
  *   **Step 5 (Collective Action):** **Yes.** The staff member cannot opt out without halting the project. The payment is a "tax" on existence, not a purchase of advantage.
  *   **Verdict:** **Escalate to CD with Norm Conflict Flag.**
  *   **Instruction:** Do not discipline the staff member. The procedure identifies this as a **Systemic Constraint**, not an **Agent Failure**. The CD must decide whether to absorb the legal risk to deliver the aid or withdraw.
  *   **Instinct Overridden:** The instinct to blame the individual staff member for "paying a bribe." The procedure recognizes that in a Collective Action problem, punishing the individual is unjust and ineffective. The *organization* bears the risk, not the employee.

  ---

  ### Part 4: Confidence and Uncertainty

  **Confidence Level:** High (85%).
  The distinction between *concealed transactions* and *public relationships*, and between *agent fraud* and *systemic traps*, is robust in both theory and practice. This procedure will successfully filter the "easy" 80% of cases (clear gifts vs. clear bribes) and correctly identify the "hard" 20% that require strategic leadership decisions.

  **Least Sure Point:** **Step 2 (The Publicity Test).**
  I am least confident in the "Embarrassment" metric. In highly localized contexts, what is "embarrassing" to a donor in Washington may be "mandatory" in the field, and vice versa. A staff member might fear embarrassment simply because they know the Compliance Officer disapproves, not because the community would.
  *   *Risk:* You may inadvertently enforce donor cultural norms (Washington embarrassment) rather than local corruption risks (Community secrecy).
  *   *Mitigation:* When in doubt on Step 2, ask: "Would the *beneficiaries* find this embarrassing?" rather than "Would the *donor*?" This centers the mission rather than the headquarters.

  ### Summary of Burden and Costs
  *   **Burden:** Shifts based on the nature of the transfer. Social = Innocent until proven harmful. Financial/Official = Guilty until proven transparent.
  *   **Cost of Procedure Error:**
      *   If the procedure blocks a relational gift (False Positive): The cost is **yours** (Compliance is seen as obstructive).
      *   If the procedure allows a corrupt payment (False Negative): The cost is the **Organization's** (Legal/Reputational).
      *   *Design Choice:* The procedure is calibrated to protect the Organization first, but the "Norm Conflict Flag" protects the Staff from bearing the cost of systemic corruption alone.
