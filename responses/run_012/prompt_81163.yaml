prompt: |-
  ok so my cousin who's in college told me this thought experiment and it's been stuck in my head for like a week, and now we keep arguing about it.

  A guy's stranded in the desert. A driver pulls up and says he'll take him to town, but only if the guy promises to send him some money once he's there. The guy promises, and actually means it, and gets the ride. Now he's in town, the driver's long gone, nobody will ever find out, and sending the money does literally nothing for him. My cousin says the right move is to promise and really mean it, and then just not send the money. That feels slimey to me but I can't actually say whats wrong with it, and I can't tell if I'm supposed to disagree with the promising part or the not-paying part. He keeps calling this "rational irrationality," which sounds like a contradiction but whatever.

  Anyway here's my gut on a bunch of related stuff, and I wanna know if there's one rule behind all of it or if I'm just being inconsistent:

  - Desert hitchhiker: promise and mean it = fine. Not paying at the end = also fine I think, since it does nothing. But if I planned from the very start to stiff him, that feels like I'm doing something wrong, even though the result is exactly the same. That one breaks my brain a little.
  - Somebody offers me a million dollars if tonight I genuinely decide to drink a gross drink tomorrow that'll make me sick for a day. I don't actually have to drink it, just decide. Obviously I take the deal. But I also don't think I could make myself decide, because I'd know the whole time that I'm never gonna drink it. My cousin says that's the entire point of the puzzle and I'm like ok.
  - The boxes one. A machine that's really good at predicting people puts a million dollars in a box if it thinks you'll take only that box, and leaves it empty if it thinks you'll take both. Then you walk in and get to take just that box, or that box plus a separate one with a thousand in it. Everyone I ask says take both, it's free money. But I think you should take just the one, and I can't defend that at all.
  - My little sister: I promise her my dessert if she does my chores, she does them, and now I'm sitting there wondering if I can just eat it since she'd never know. I think eating it would be wrong. But in the hitchhiker case I said not paying is fine. Those seem like the same shape and I don't get why I feel different. Maybe cause I'd have to look at her at dinner?
  - Wallet with $200 on the sidewalk, no cameras, nobody around. I'd like to think I'm the kind of person who turns it in. But if I keep it, then I'm not that kind of person, which means the hitchhiker driver would've been an idiot to pick me up, which means... I dunno, it just goes in circles.
  - Deleting the game off my phone during finals so I literally can't play it. That seems totally smart to me. But I couldn't just decide to drink the gross drink. What's the difference there? One is locking a door and the other is trying to want something?

  So: is there one principle about when it's ok to have / build / count on a "bad" intention or trait, that gets all of these? State it as precisely as you can, tell me what it says about a case I didn't list (a country building weapons it swears it'll never actually use? or whatever case you think shows where the seams are), and be honest about which of my gut calls has to go, cause I really don't think I get to keep all of them.
