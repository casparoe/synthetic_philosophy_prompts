answer: |-
  The object sat in the center of the containment field, suspended in a vacuum that was colder than the space it had come from. It was roughly the size of a human heart, irregular, dark, and utterly silent.

  Elara Vance sat behind the thick quartz of the observation deck, her hands resting on the console. She was the Senior Analyst for the Contact Protocol, a title that sounded like a job description but felt more like a sentence. For three weeks, the object—designated K-77—had been the only thing in the room. For three weeks, the world outside had been holding its breath.

  "Status report, Doctor Vance," the voice in her earpiece said. It was the Chair of the Oversight Committee. His voice was tight, compressed by the latency of the lunar link, but the anxiety bled through clearly. "The General Assembly is convening in two hours. They need a recommendation. Broadcast or Quarantine?"

  Elara didn't look away from the object. "The data hasn't changed, Chair."

  "The data is the problem, Elara. You know that."

  She did know. That was the entirety of the burden pressing against her sternum.

  K-77 had been found drifting in the Oort Cloud, caught by a routine survey drone. It was composed of silicate and iron, common enough. But the isotopic ratios were wrong. Not impossible, just… unlikely. The iron contained traces of Manganese-53, an isotope that decays relatively quickly. By rights, the object should have been geologically dead. Instead, the decay rate suggested it had been forged only five thousand years ago.

  Five thousand years ago. The dawn of Sumer. The building of the Pyramids.

  But here was the knot that had kept Elara awake for seventy-two hours straight: Manganese-53 is also produced by high-energy cosmic ray spallation. If the object had drifted through a specific, dense nebula—a rare but natural occurrence—it could have been "recharged" naturally. The physics allowed for a natural origin. The physics also allowed for an artificial one. The probabilities were identical. The likelihood ratio was one-to-one.

  It was a perfect tie.

  Furthermore, the object's surface was smooth, but not polished. It bore micrometeoroid pitting consistent with long exposure to space, yet the pits were arranged in a pattern that matched the star chart of the local cluster as it looked *now*, not five thousand years ago.

  Was it a monument placed long ago that had somehow recorded the passage of time? Or was it a rock that had simply tumbled through a region of space where the dust was arranged strangely?

  "Doctor?" the Chair prompted.

  "I am reviewing the spectral analysis one last time," Elara said.

  "There is no new analysis, Elara. We have run every scan. We have bounced neutrons off it. We have chilled it to near absolute zero. It does nothing. It is a rock that refuses to be just a rock, but it also refuses to be a machine."

  "That is the point," Elara said softly.

  She leaned forward. The object hung there, a dark void against the white glow of the containment field. It was the single datum. The $N=1$.

  In her thirty years of observing the deep sky, Elara had learned that silence was not empty. Silence was full of noise, but it was noise that averaged out. You integrated over time. You gathered photons until the signal rose above the background. You built a statistical case.

  But you cannot build statistics on a single event.

  If K-77 were one of a million, she could compare it to its siblings. She could look for the manufacturing tolerances, the commonalities of design. If there were a fleet, she could triangulate their origin. If there were a billion of them, she could determine if they were seeds, or probes, or debris.

  But there was only this one.

  And because there was only one, it had no context. It was a word without a sentence. A footprint without a body.

  The standard Fermi question—*Where is everybody?*—assumed that silence was evidence of absence. If the galaxy were teeming with life, the reasoning went, the sky would be loud. The fact that the sky was quiet meant the galaxy was empty.

  But K-77 proved the sky was not empty. It proved that *something* was out there.

  The question was no longer *Where is everybody?* The question was *What is the nature of the silence?*

  If K-77 was natural, then the silence was true. We were alone in a universe of dead matter, and this object was a fluke, a geological accident that had mimicked design so perfectly it mocked the observer. If we chose to believe it was a message, we would be projecting meaning onto noise. We would be shouting into the void, announcing our presence to a universe that did not care, marking ourselves as targets for nothing.

  If K-77 was artificial, then the silence was a mask. The galaxy was full, but it was quiet by choice, or by design, or by distance. This object was a buoy. A marker. A hand extended across the dark. If we chose to believe it was a rock, we would be turning away from the only hand that had ever reached for us. We would be choosing isolation in a crowd.

  Both hypotheses fit the data. Both predicted the silence that had come before. Both predicted the ambiguity of the object itself.

  "Elara," the Chair said. "The General Assembly is asking for the risk assessment. If we Broadcast, we send a high-gain tight-beam toward the object's trajectory origin. We say, 'We see you.' If we Quarantine, we dismantle the object, study the pieces, and say nothing to the outside. We assume we are alone."

  "And if we are wrong?" Elara asked.

  "Then we either provoke a predator or ignore a neighbor."

  "There is no third option?"

  "Not within the mandate. We must decide if the universe is hostile, benign, or empty. The protocol requires a binary classification to determine the response."

  Elara closed her eyes. She saw the spectroscopy graphs in her mind. The peaks and valleys. They were beautiful. They were meaningless.

  She thought about the epistemology of it. In her old life, measuring the redshift of a quasar, the uncertainty was in the instrument. You could build a better spectrograph. You could wait longer. The truth was out there, waiting to be resolved by better tools.

  Here, better tools would not help. A better spectrograph would just give higher-resolution data on the Manganese-53. It would confirm the decay rate. It would confirm the pitting. It would refine the numbers, but it would not change the ratio. The ambiguity was not a lack of precision; it was a fundamental property of the singularity.

  To decide what K-77 *was*, she had to decide what she *believed*.

  The object was a mirror. Not a glass mirror, but an epistemic one. It reflected the assumptions of the observer.

  If she looked at it with fear, it was a trap. If she looked at it with hope, it was a gift. If she looked at it with skepticism, it was a rock.

  And the terrifying part was that the decision would make it true.

  If she ordered the Broadcast, and a fleet arrived, then K-77 was a beacon.
  If she ordered the Broadcast, and nothing arrived, then K-77 was a rock, and she had wasted resources and revealed Earth's position for nothing.
  If she ordered the Quarantine, and we remained alone forever, then K-77 was a rock, and she was prudent.
  If she ordered the Quarantine, and the galaxy remained silent because we had refused to speak, then K-77 was a beacon, and she had condemned humanity to eternal isolation.

  The action created the reality. There was no objective truth to be found, only the consequence of the choice.

  "Doctor Vance," the Chair said. "Thirty minutes."

  Elara opened her eyes. She looked at the object again. It seemed to pulse, though she knew it was just the flicker of the containment field lights.

  She thought about the silence of the last thirty-five years. The nights spent on mountain tops, the cold air, the hum of the cooling systems. She had spent her life listening to a universe that never spoke back. She had accepted that silence as the natural state of things.

  But now, holding this single, ambiguous stone, she realized that the silence had never been about the universe. It had been about the threshold of detection. We hadn't heard them because we hadn't been listening on the right frequency, or because they were waiting for us to speak first, or because they were hiding.

  The silence was a property of the listener.

  And now, the listener had been handed a microphone.

  "Elara," the Chair said. "We need to know. Are we safe?"

  Elara placed her hand on the console. The key for the Broadcast protocol was a physical switch, covered by a plastic guard. The Quarantine protocol was a digital command sequence.

  She realized then that the Committee wanted her to solve the ambiguity. They wanted her to tell them what the object *was* so they wouldn't have to take responsibility for what it *meant*. They wanted the universe to be objective so they could act without guilt.

  But the universe was not objective here. The universe was waiting for her to define it.

  If she chose Broadcast, she was betting on a community of minds. She was betting that the silence was a waiting room, not a graveyard. She was betting that the Manganese-53 was a signature, not a stain.

  If she chose Quarantine, she was betting on solitude. She was betting that the silence was a wall. She was betting that the Manganese-53 was a coincidence, and that safety lay in invisibility.

  There was no evidence to support either bet. The evidence was the same for both.

  She thought of the philosophers she had read in her retirement. The ones who wrote about decision theory under uncertainty. *Maximin.* *Minimax Regret.* *Bayesian Priors.*

  But priors required data. And she had no data. She had only this one thing.

  She stood up. Her reflection appeared in the quartz, superimposed over the dark shape of K-77. For a moment, she looked like she was holding the object in her hands.

  "Chair," she said. "I understand the protocol requires a classification."

  "It does."

  "It requires me to state whether the object is Natural or Artificial."

  "Yes. That determines the response. Natural implies Quarantine. Artificial implies Broadcast."

  Elara took a breath. The air in the room was recycled, tasteless.

  "There is no fact of the matter," she said.

  "Excuse me?"

  "There is no fact of the matter," Elara repeated, her voice steady. "The object exists in a superposition of meanings. It is both and neither. The data does not support one over the other. It never will."

  "Then how do we proceed?" The Chair's voice rose. "We cannot tell the Assembly 'we don't know'."

  "You can," Elara said. "But I won't."

  "Elara, don't be difficult. We need a recommendation."

  "I am giving you one." She moved her hand. She didn't go for the switch. She didn't type the code. She reached for the comms panel and muted the channel.

  The silence in the room was absolute. The hum of the vacuum pumps was the only sound.

  She looked at K-77.

  She realized that the question *Where is everybody?* was the wrong question. It assumed that "everybody" was something to be found, like a planet or a star. Something external.

  But if the silence was a datum about the observer, then "everybody" was something to be created.

  If she broadcast, she created a conversation.
  If she quarantined, she created a monologue.

  The object didn't care. It would sit there, vibrating at its strange frequency, whether she spoke or not. It was the universe's Rorschach test.

  Elara unmuted the channel.

  "Recommendation," she said.

  "Go ahead."

  "Broadcast."

  There was a pause on the other end. "On what grounds? Have you found proof of artificiality?"

  "No."

  "Then why?"

  "Because if we are alone," Elara said, looking at the dark heart of the object, "then speaking changes nothing. The silence remains. But if we are not alone, then silence is the only thing that keeps us apart."

  "That is not a scientific justification, Doctor."

  "It is the only one available," Elara said. "We are not measuring the universe today, Chair. We are choosing it."

  She lifted the plastic guard. The switch beneath was red.

  "If I am wrong," she said, "and it is a rock, then we have shouted at a stone. The universe will remain silent, and we will be exactly where we are now, only louder."

  "And if you are right?"

  "Then the silence ends."

  "And if it is a trap?"

  Elara looked at K-77. She thought about the Manganese-53. She thought about the pitting. She thought about the thirty-five years of looking up and seeing nothing but light that had left its source before humanity existed.

  She had spent her life studying the light of dead things. She was tired of the dead.

  "Then we learn what the universe is," she said. "Better to be eaten by a monster than to starve in an empty room."

  She didn't wait for authorization. The protocol gave her the authority in the event of a unique datum. This was the unique datum. There would never be another one. Statistics would never apply again.

  She pressed the switch.

  A light on the console turned green. *Transmission Active.*

  Somewhere, deep in the Oort Cloud, a high-gain antenna turned. It focused a beam of radio waves, encoded with prime numbers and the hydrogen line, toward the trajectory from which K-77 had come. It was a message. *We are here. We see you. We are like you.*

  Or, it was a flare. *Here we are. Come and get us.*

  Elara sat back down. She watched the object.

  Nothing happened.

  K-77 did not light up. It did not vibrate. It did not change shape. It remained a dark, silent stone.

  The silence in the room returned, heavier than before.

  "Transmission complete," the system chimed.

  Elara waited. She knew nothing would happen immediately. The light-speed lag alone was hours, days, years. The reply, if there was one, might come in a century. Or never.

  She had made the decision. She had imposed a meaning on the ambiguity. She had chosen to believe that the silence was a pause, not a period.

  "Doctor Vance?" The Chair's voice was back, stunned. "You have initiated the Broadcast without final clearance."

  "I know."

  "The Assembly will want to know why you ignored the probability matrices."

  "The matrices were empty," Elara said. "I filled them."

  She looked at K-77 one last time. It was still ambiguous. It was still a rock and a machine. It was still a mirror.

  But now, it was a mirror that reflected a voice.

  "Log the entry," Elara said. "Datum K-77. Classification: Indeterminate. Action: Interrogation."

  "Interrogation?"

  "We asked a question," Elara said. "Now we wait for the answer."

  She knew she might never hear it. She might die in this chair, watching the stone, listening to the static. She might be remembered as the woman who shouted at a rock and doomed her species. Or she might be the first voice of a new chorus.

  The evidence hadn't changed. The object was the same. The universe was the same.

  Only the observer had changed.

  Elara folded her hands in her lap. She watched the dark shape floating in the white light. She felt the weight of the silence, but it felt different now. It wasn't the silence of absence. It was the silence of anticipation.

  It was the silence of a room where someone has just spoken, and everyone is waiting to hear the reply.

  "End log," she said.

  The screen went dark, leaving only the image of the object, hanging in the void, waiting to be defined by whatever came next.
