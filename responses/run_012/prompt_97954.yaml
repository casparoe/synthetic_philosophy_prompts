      *   Crucial distinction: Making coffee *requires* changing the state. Using the sugar *might* reduce future options (can't make sweet coffee later), but making the coffee itself is the task. The measure doesn't need to know coffee is good; it needs to know that *achieving the task* is the primary objective, and impact is the penalty term.
