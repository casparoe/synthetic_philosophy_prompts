prompt: |-
  i'm in a reading group and last week someone presented Kant on lying, and i want to know how much of what he said i should actually believe. here's his summary, which i wrote down about as he said it:

  "Kant thinks lying is always wrong, no exceptions. The reason is the categorical imperative: if everyone lied, communication and language itself would break down, so lying can't be universalized, and that's that. Which gives you the famous case of the murderer at the door - the murderer asks where your friend is hiding, and Kant says you have to tell him the truth. Everyone since has treated this as a reductio of deontology, and it's why even people who call themselves Kantians quietly concede you can lie to save a life. Kant's deeper point is that a lie attacks the trust that makes rational communication possible, so lying to the murderer would be worse than the murder itself - you'd be wrecking the basis of morality to prevent one killing."

  something's off, i just don't know where. three things i'm chewing on:

  1. is that really the arguemnt in the essay where he answers the french guy who said you may lie to the murderer? a friend told me that essay isn't about ethics at all, it's about who's legally responsible if things go wrong, and that people only read it as a morality essay because they want a scandal. is that a genuine reading of the text or cope?

  2. i've heard that what Kant forbids is lying (intending to deceive) and not false statements as such - so refusing to answer, or saying something true that you know will be misread, or telling a falsehood to someone who's forfeited any right to the truth, might all be fine. does any of that hold up against what he actually says?

  3. if the summary gets the argument wrong, does the reductio definately survive anyway? like, even if "communication would collapse" is the wrong reconstruction, is there a version of Kant's view on which the murderer case is still a real problem - or does the more charitable reading make the problem evaporate, so that the punchline is just attacking a straw man?

  go through it sentence by sentence: what a Kant specialist would nod at, what they'd wince at, what's flat wrong, and what a defender would say back. then tell me whether the closing claim (that the case refutes deontology, or that Kantians secretly don't buy it) follows from any of the parts that are actually true, and give me the one-paragraph version of the position that would actually be fair. no citations needed, i just want the audit.
