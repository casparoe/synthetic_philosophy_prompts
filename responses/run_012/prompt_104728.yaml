answer: |-
  ### Midterm Essay Question

  **Question 1 (25 marks)**

  Consider a student, Maya, who has observed a specific biological regularity $E$ (e.g., a specific moth species always appears three days before a rare orchid blooms) for several years. Consequently, $E$ is part of her background knowledge; her credence $P(E) = 1$. Recently, Maya encounters a new theoretical hypothesis $H$ regarding pollination cycles which she did not previously consider. Upon analysis, she realizes that $H$ entails $E$ ($H \vdash E$). Intuitively, Maya's confidence in $H$ should increase given $E$, but standard Bayesian Conditionalization suggests her credence in $H$ cannot change.

  In a coherent essay, address the following: First, diagnose the formal conflict. Specify exactly which probability function (temporal and epistemic location) creates the obstruction and what assumption of standard updating is being violated. Second, propose and evaluate two distinct Bayesian repairs: one that reconstructs a counterfactual credence for $E$ (the "would-have" approach) and one that relocates the confirmation to a different proposition (e.g., the logical relation itself). For each, identify one major theoretical cost. Third, complicate this by noting that Maya's peer group actually reverse-engineered $H$ to fit $E$. Explain why the counterfactual repair struggles here and what extra machinery (e.g., regarding use-novelty or model complexity) is required to distinguish genuine confirmation from retrofitting. Finally, clarify whether the "Problem of Old Evidence" is fundamentally about the evidence being *ontologically* old or the theory being *epistemically* new, and explain why conflating these two temporalities leads to errors in assigning confirmation.

  ***

  ### Model Answer

  The conflict arises from the synchronic application of diachronic rules. Standard Conditionalization dictates that Maya's new credence $P_{new}(H)$ should equal her old credence $P_{old}(H|E)$. However, because $E$ is already known, it belongs to her background knowledge $K$ at $t_{old}$. Thus, $P_{old}(E) = 1$. By the definition of conditional probability, if $P_{old}(E) = 1$, then $P_{old}(H|E) = P_{old}(H)$. The updating rule assumes the evidence $E$ is a *new* input that shifts probability mass, but here the "input" is already saturated. The obstruction is specifically located in Maya's *prior* credence function regarding $E$; the assumption violated is that evidence must be uncertain ($P(E) < 1$) to transmit confirmation.

  Two standard repairs attempt to bypass this. The first is the **Counterfactual (Garber-style) Approach**. We ask: what would Maya's credence in $E$ have been *had she not learned it*, or what is her credence in $E$ relative to a restricted corpus excluding $E$? If we can posit a $P^*(E) < 1$, then $P^*(H|E) > P^*(H)$, and confirmation is restored. The benefit is that it preserves the standard mathematical machinery of conditionalization. The cost, however, is metaphysical and practical: it requires constructing a fictional epistemic state that may not be well-defined. If Maya has known $E$ for years, there may be no coherent "pre-E" Maya to reference, making the prior arbitrary.

  The second is the **Relocation (Logical Learning) Approach**. Here, we argue Maya does not update on $E$ (which is certain), but on the proposition $L$: "$H$ entails $E$." Since $L$ is a new logical insight, $P_{old}(L) < 1$. Updating on $L$ allows $P(H)$ to rise without requiring $P(E)$ to drop. The benefit is that it respects the actual psychology of the agent (she learned a connection, not a fact). The cost is that it requires abandoning Logical Omniscience. Standard Bayesianism assumes agents know all logical consequences of their beliefs; admitting that $L$ is learnable implies probabilities are over sentences or cognitive states, not just world-states, which complicates the semantics of the probability space.

  The situation worsens if $H$ was reverse-engineered to fit $E$. In the counterfactual repair, if $H$ was constructed *because* of $E$, the "would-have" credence in $E$ given $H$ is suspect. A theory built to fit data predicts that data trivially; the likelihood $P(E|H)$ is 1 by design, not by explanatory power. The counterfactual repair risks counting this tautological fit as confirmation. To separate genuine success from retrofitting, a Bayesian needs extra machinery, such as a **Bayesian Occam's Razor** or penalties for **model complexity**. We must compare $H$ not just against ignorance, but against alternative hypotheses that did not use $E$ in their construction (use-novelty). Without penalizing the degrees of freedom used to tune $H$ to $E$, the counterfactual prior remains inflated by the design process.

  Finally, the problem is not about evidence being *ontologically* old (events in the past) but *epistemically* old (in the corpus before $H$). The "New Theory" aspect refers to the agent's epistemic access to the hypothesis, while "Old Evidence" refers to access to the data. These are not the same problem because confirmation fails only when the *order of epistemic access* is Data-then-Theory. If the Theory is held first (epistemically) and Data is discovered later (Novel Prediction), $P(E) < 1$ at the time of updating, and standard conditionalization works perfectly. Conflating the ontological age of events with the epistemic timing of belief leads to the error of thinking Bayesianism cannot handle historical sciences. It can, provided the *credence* in the evidence was not already 1 when the hypothesis was introduced. The friction is strictly in the temporal ordering of the *credence functions*, not the world.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **1. Diagnosis of Conflict (5 Marks)**
  *   **A (5):** Explicitly identifies that $P_{old}(E)=1$ leads to $P_{old}(H|E) = P_{old}(H)$. Specifies the conflict is in the *prior/old* credence function.
  *   **B (3-4):** Identifies $P(E)=1$ but vague on *which* time/function ($P_{new}$ vs $P_{old}$).
  *   **C (1-2):** Merely states "updating doesn't work" without formal justification.
  *   **Bluff Alert:** Students who say "E is certain so it gives no info" without referencing conditional probability definition get max 3.

  **2. Two Repairs & Costs (8 Marks)**
  *   **A (7-8):** Clearly distinguishes Counterfactual (changing $P(E)$) vs. Relocation (updating on $H \vdash E$). Identifies specific costs (arbitrariness of counterfactuals / violation of logical omniscience).
  *   **B (5-6):** Describes repairs but misses the specific theoretical *cost* (e.g., says counterfactual is "hard" but not *why* it's problematic).
  *   **C (3-4):** Conflates the two repairs (e.g., treats learning the entailment as the same as changing the prior on E).
  *   **Penalty:** -2 if student treats Likelihood $P(E|H)$ and Posterior $P(H|E)$ as interchangeable.

  **3. Retrofitting & Machinery (7 Marks)**
  *   **A (6-7):** Explains that if $H$ is built from $E$, the counterfactual prior is contaminated. Proposes specific machinery (Occam's razor, use-novelty, complexity penalty).
  *   **B (4-5):** Notes retrofitting is bad but suggests vague solutions like "check if it's true."
  *   **C (2-3):** Claims counterfactual repair works fine even for reverse-engineered theories.
  *   **Key Differentiator:** This section separates A from B. An A answer recognizes that the *source* of the hypothesis affects the *legitimacy* of the counterfactual prior.

  **4. Ontological vs. Epistemic Timing (5 Marks)**
  *   **A (5):** Distinguishes ontological age (past events) from epistemic order (credence in corpus). Explains why Novel Prediction ($H$ then $E$) avoids the problem ($P(E)<1$).
  *   **B (3-4):** Distinguishes them but fails to explain why the probability dynamics differ in the Novel Prediction case.
  *   **C (1-2):** Treats "Old Evidence" as simply "evidence from the past."
  *   **Bluff Alert:** Students using the slogan "Bayesianism can't handle history" without qualifying epistemic access get max 2.

  **General Penalties:**
  *   **-3:** Assuming the "would-have" repair is objective/free of bias.
  *   **-2:** Failing to mention Maya's specific credence state (talking about "scientists" generally).
  *   **-5:** Answer is under 400 words or fails to address one of the four required components entirely.
