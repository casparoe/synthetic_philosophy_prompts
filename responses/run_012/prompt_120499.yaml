  **Popperian:** Correct. Internal models allow hypotheses to die in silico rather than killing the organism.

  **Gregorian:** Correct. These creatures use cultural tools (memes) to think.

  **The Ladder:** Flat wrong. It's not a ladder where you discard lower rungs; it's an accretion model. Humans are all four. We still have genes, we still learn via reinforcement, we still simulate. You don't stop being Skinnerian when you become Popperian; you add a layer. Species aren't strict bins; chimps have nascent Popperian abilities, fish learn (Skinnerian). The "Tower of Generate and Test" means each layer adds speed and efficiency: evolutionary time, lifetime, simulation, cultural time.

  **Consciousness:** Does the conclusion survive? Yes, but rephrased. Your friend writes, "before there's anybody home." Dennett would say there was *never* anybody home in the Cartesian sense. However, he argues that full-blown, reportable human consciousness depends on language and cultural tools. Without language, there is no "self" to be conscious of. Rats have sensory processing, but they lack the narrative self-consciousness Dennett identifies with human consciousness. Content becomes conscious only when it wins the competition for influence over speech and behavior, which requires Gregorian tools.

