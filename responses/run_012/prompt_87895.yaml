      *   *Correction:* This is false in the context of cascades. Once a cascade starts, private information is *no longer revealed* through actions. If Person $N$ ignores their private signal to follow the crowd, Person $N+1$ cannot see Person $N$'s private signal. They only see Person $N$'s action, which is now just a copy of Person $N-1$. Information stops accumulating.
