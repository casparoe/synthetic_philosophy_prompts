      *   **Address the "Best-Informed Individual" Claim:** Explain why the group doesn't surpass the early movers. The later movers add *zero* marginal information once the cascade begins.
      *   **Fragility:** Mention that cascades are fragile (a little public info can break them), which highlights that the "wisdom" was shallow.
      *   **Remedy:** It's not better probabilistic training (people are already acting rationally). It's structural changes (revealing private signals, delaying decisions, etc.).

  5.  **Drafting the Response (Iterative refinement):**
