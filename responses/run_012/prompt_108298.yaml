prompt: |-
  Ok so I'm a second-year PhD student in CS and I've been teaching myself some set theory on the side, because half the stuff I care about (Tychonoff's theorem for arbitrary products of compact spaces, "every vector space has a basis", the well-ordering theorem) seems to need the axiom of choice. Here's whats bugging me. I get that AC is independent of ZF -- you can't prove it from the other axioms and you can't refute it either, there are models going each way. And I know AC is the culprit behind Banach-Tarski, where you cut a ball into finitely many pieces and reassemble them into two balls the same size, which is obviously not something that happens to real balls. So my read is: AC is basically an unproven extra assumption that buys you convenience at the price of weirdness, and since it's independent, using it or not is really just a matter of taste, like picking a coordinate system or a sign convention. Which makes me nervous, because if a theorem only goes through with AC then it isn't really *proven*, is it? It's proven-conditional-on-a-guess. So my plan is to avoid AC in my own work wherever I possibly can, so that everything I prove is actually safe.

  Is that the right instinct? I want a straight answer, no pep talk. I have a feeling at least one of the steps above is doing something sneaky but I can't see which, so before you answer, actually brainstorm what I might be presupposing and think it through carefully -- don't just start typing.

