  whats_actually_the_case: ["Theorems are relative to axioms; ZFC is standard", "Independence means undecidable in ZF, not arbitrary", "ZF has pathologies too; safety is model-relative"]
  the_big_one: "Confusing axiomatic independence with epistemic uncertainty about truth."
  corrected_question: "Given my CS background, should I prioritize constructive proofs over classical existence granted by AC?"
  genuinely_a_judgment_call: "Whether to prioritize expressive power (ZFC) or constructive content (ZF/Intuitionistic) for your specific research goals."
  what_i_should_do: "Use ZFC for standard math. Switch to constructive logic only if algorithm extraction is your goal."
