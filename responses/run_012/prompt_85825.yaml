      *   (6) Alien Properties: Properties not instantiated or constructible from our world's properties exist.
      *   (7) Counterpart Theory: De re modality uses counterparts, not trans-world identity.
      *   (8) Indefinite Totality: No definite number of worlds (no set of all worlds).
      *   *Meta-belief:* Naturalism (no spooky furniture, worlds are physical).

  3.  **Brainstorming Potential Tensions:**

      *   *(4) vs. (2):* Causal Isolation vs. Causal Unity. If worlds are defined by causal connection, and there is no cross-world causation, this seems consistent *definitionally*. But does (2) undermine the *motivation* for (4)? If causality is what makes things concrete (per 4), and worlds are isolated (per 2), how do we know other worlds are concrete? (Addressed by Naturalism meta-belief).
      *   *(4) vs. (5):* Recombination vs. Causal Unity. Recombination generates worlds by patching parts. Causal unity defines a world as a *connected* whole. If I recombine parts, do they automatically form a causally connected whole? Recombination usually implies spatiotemporal arrangement. If I swap a particle, does it causally connect? This is a classic Lewis tension (Spatiotemporal vs. Causal).
      *   *(5) vs. (8):* Recombination Plenitude vs. Indefinite Totality. Recombination usually generates a *set* of worlds (combinatorial explosion). If there is a principle of recombination, does that imply a definite totality (the set of all recombinations)? If the universe is infinite or continuous, recombination might generate a proper class, not a set. This is technical but relevant.
      *   *(1) + (Meta) vs. (6):* Naturalism/Concrete vs. Alien Properties. If worlds are "made of whatever physics is about" (Meta), how can there be properties *not* built out of the properties our world has (6)? If physics is universal, alien properties seem to violate naturalism. If physics is local to worlds, then "naturalism" becomes ambiguous.
      *   *(2) vs. (Meta):* Causal Isolation vs. Naturalism. Naturalism usually relies on causal closure or causal explanatory power. If other worlds are causally isolated, in what sense are they "natural"? They are empirically undetectable. This is an epistemic tension, not necessarily logical, but hits the "Naturalist" self-description.
      *   *(4) vs. (7):* Causal Unity vs. Counterparts. Counterpart theory relies on similarity. Causal unity relies on connection. If I have a counterpart, is it in a causally isolated world? Yes. Does similarity preserve causal structure? Usually. Not a major clash.
      *   *(5) vs. (6):* Recombination vs. Alien Properties. Recombination usually works by rearranging *existing* universals or particulars. If (5) says "patching together parts of worlds," does that allow for *new* fundamental properties (Alien Properties)? Lewis argues Recombination *allows* for alien properties by allowing duplicates of our world with extra stuff, but strict recombination of *actual* parts might not generate *alien* fundamentals.
      *   *(8) vs. (1)/(5):* Indefinite Totality vs. Concrete/Recombination. If worlds are concrete and generated by recombination, why isn't there a fact of the matter about how many? This usually stems from set-theoretic paradoxes (Cantor). If worlds are concrete, they should be countable in principle, unless the plurality is too big for a set.

