      *   **Tension C: Causal Isolation (2) vs. Concrete/Naturalist (1/Meta).**
          *   *Conflict:* You say worlds are concrete and naturalistic. But (2) says they are causally isolated. In standard naturalism, to be real/concrete usually implies potential causal interaction (or at least sharing a causal order). If they are causally isolated, they are empirically undetectable.
