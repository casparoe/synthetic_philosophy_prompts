          2.  *Slow Value Drift (SVD):* Optimization of metrics leads to outcomes no one endorses (Goodhart's law/specification gaming), no agency involved.
      *   **Task:** Write a triage procedure (questions, order, stopping conditions, value judgments vs. facts, named tests).
      *   **Constraints:**
