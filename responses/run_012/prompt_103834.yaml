answer: |-
  It sounds like you are operating on a composite principle rather than a single rule, and recognizing that is probably the key to making sense of the friction you feel. The core engine driving your verdicts seems to be a blend of Proportionate Defense and Methodological Restraint. By Proportionate Defense, I mean that the severity of the threat to human interests health, shelter, structural integrity has to match the severity of the response. By Methodological Restraint, I mean that even when the threat is real, the method of killing must be as targeted as possible and avoid gratuitous suffering or indiscriminate collateral damage. This explains why the wasp nest and the termite fumigation pass without hesitation. The threat is high, involving physical safety or the home itself, and the methods are specific to the problem. It also explains why the dengue fogging felt fine while the mosquito fogging did not. In the first case, the human interest was life and death, which outweighs the insect lives. In the second, the human interest was mere comfort, which does not outweigh the mass killing.

  Your friend the entomologist is making a deep point, not just a pun, and it actually supports your intuition rather than undermining it. When they say pest is just a number, they mean moral status is relational. A bee is a partner at low density and a threat at high density or in the wrong context. Your ethics are tracking this relationship. You are not judging the insect by its species essence but by its current role in your shared environment. This is why you can save the spider but swat the moth. The spider is perceived as a quiet guest or even a beneficial ally that eats other pests, whereas the moth is seen as chaotic noise around the lamp. However, this is also where your principle wobbles into aesthetic bias. If the principle is strictly about threat and necessity, the moth and the spider in the bedroom are morally identical. Both are harmless. Saving one and killing the other suggests that somewhere in the mix, there is a hidden variable about how much you like the creature or how much its presence disturbs your peace, distinct from actual danger. To be consistent, you would have to either start swatching spiders or start catching moths, unless you can defend the idea that chaotic flight is a greater intrusion than stillness.

  The slug situation highlights the Methodological Restraint part of your principle. You accept the iron phosphate pellets but reject the beer trap even though the outcome is death. This suggests you care about the mode of engagement. The pellets act as a barrier or a clinical treatment, whereas the beer trap feels like a lure. Drowning them in beer introduces an element of deception and perhaps a more visceral sense of suffocation that feels like cruelty, whereas the pellets feel like sanitation. If you hold to this, you are committed to the view that how we kill matters independently of the fact of killing. This means you cannot say death is the only metric. You are implicitly arguing that a quick, clinical, or defensive death is permissible where a trapped, slow, or deceptive death is not. This is a robust ethical stance, but it requires you to scrutinize your other methods. For instance, you mentioned the flea medication kills anything that bites the dog. If that includes beneficial insects that land on the dog, your principle of Methodological Restraint might flag that as too indiscriminate, even if the necessity is high.

  Regarding the two cases you haven't settled, the principle makes some sharp predictions. For the gene drive that crashes the mosquito population, your intuition should lean against it unless the disease threat is equivalent to the dengue scare. The reason is collateral damage. You were uncomfortable with the bug zapper because it killed harmless moths and beetles along with the targets. A gene drive that takes down harmless midges along with the mosquitoes is essentially a genetic bug zapper. It fails the test of discrimination. Even if the human interest is high, wiping out a population layer with collateral damage to harmless species violates the restraint component. You would have to accept that saving humans from disease does not grant license to erase non-threatening species as side effects, unless the disease threat is so catastrophic that it overrides the collateral damage concern, similar to how you accepted the dengue fogging.

  For the friend who squashes caterpillars by hand, your principle likely flags this as problematic due to the suffering and intimacy of the method. You rejected drowning slugs because it felt worse than pellets, even if the death was the same. Hand-squashing is highly specific, which satisfies the discrimination test, but it maximizes the visceral cruelty and direct agency in killing. It brings the killing into the realm of the personal and violent rather than the systemic or defensive. If drowning slugs is wrong because of the method, crushing caterpillars one by one should also be wrong, even if the goal is protecting plants. The only way to justify it is if the food security interest is higher than the aesthetic interest of the roses. If your friend is growing food to eat, the necessity is higher than your roses, which might tip the scale back to permissible despite the crude method. But if it is a hobby garden, the principle suggests they should use a barrier or a less visceral method.

  On the question of non-lethal removal, your principle should not make this trivially fine. If you carry a spider out but put it in a place where it will freeze or starve, you have not avoided killing it, you have just outsourced the act. A consistent application of Proportionate Defense requires you to take responsibility for the outcome of your defense. If moving the insect amounts to a death sentence, it is morally equivalent to killing it, just with more deniability. The only way non-lethal removal is truly fine is if you are moving them to a viable habitat where they can continue their life without posing the same threat. If you are just moving the problem so you don't have to see the death, your principle should catch that as a violation of integrity. The harm follows the action, not just the immediate hand that strikes.

  There are verdicts you might have to give up to keep this consistent. The ant bait is the shakiest one. Unless those ants are contaminating food or biting, they are often just a nuisance, similar to the mosquitoes without dengue. If you strictly apply the threshold of genuine human interest like health or shelter, sugar-seeking ants might not clear the bar unless you classify kitchen sanitation as a health issue. You might need to decide if finding ants in the sugar is a health threat or just an annoyance. If it is the latter, the bait should bother you more than it does. Similarly, the flea medication needs scrutiny. If it kills non-target insects that land on the dog, it violates the discrimination rule. You might have to accept that vet-approved necessity overrides the collateral damage rule in the same way disease fogging does, but you should acknowledge that trade-off rather than ignoring it.

  Ultimately, you are acting like a steward rather than an absolutist. You accept killing when the relationship between human and insect breaks down into conflict that threatens human flourishing, but you try to minimize the breach. You want the killing to be clean, necessary, and specific. The discomfort you feel in the mud cases comes from when one of those three legs is missing. The moth lacks necessity. The slug trap lacks cleanliness of method. The gene drive lacks specificity. The hand-squashing lacks cleanliness of method. If you hold to this, you have a stable framework, but it demands you stop letting convenience slide under the label of necessity. You have to be honest about when you are killing for safety and when you are killing for preference, and accept that preference rarely justifies death.
