prompt: |-
  I'm a journalist at work on a long feature about the paradoxes and the current state of logic, and I want your genuine credence rather than a tour of the positions: how likely is it that some contradictions are true — that dialetheism, or at any rate a logic that licenses true contradictions rather than merely tolerating inconsistent premises, is the correct account of the matter? For what it's worth, my own gut sits around 0.25, and I suspect the number is dominated by sub-questions neither of us has thought about hard enough.

  Break the estimate down. For each term give a rough probability and a line of justification, then show me how the terms combine. I'd want at least these: (a) the probability that the semantic paradoxes — the Liar, and especially a Curry-style paradox, which reaches its conclusion without using negation at all and so can't be defused merely by tinkering with negation or rejecting excluded middle — are a genuine defect in our naive semantic machinery rather than an artifact of a clumsy formulation; (b) the probability that, conditional on (a), some non-dialetheist repair succeeds — paracomplete, contextualist, a restriction on the truth schema or on self-reference, or a logic that constrains the structural rules of proof rather than the logical connectives; (c) the probability that dialetheism itself is a coherent and stable stopping point, with no revenge paradox waiting and no collapse of the notion of truth into triviality; and (d) whatever else you think belongs, including the question whether accepting true contradictions in the semantics drags one into full-blooded contradictions in the world — about change, motion, or quantum superpositions — and whether that prospect is a cost or a clarification of what was already there.

  Then give me the combination, and tell me which single sub-question the final number is most sensitive to — the term where a small change in my estimate of it moves the total most — and what argument or result would move you most. I'm less interested in which camp currently claims the most adherents than in where the logical space actually forces a person to go.
