answer: |-
  ### PREP SHEET: Defending Dummett on Immigration
  **Seminar:** Justice and Borders
  **Core Thesis:** Exclusion is coercion; coercion requires justification to the coerced; standard justifications (culture, economy, birthright) fail.

  ---

  ### ⚠️ FLAG: The Anti-Realism Tension
  **The Worry:** Dummett is famous for semantic anti-realism (truth is tied to our ability to verify/justify it). You are making a very confident, objective-sounding moral claim ("Exclusion *is* unjustified coercion"). Does his metaphysics undermine his ethics?
  **The Fix:** Don't let this become a metaphysics seminar. Dummett's anti-realism isn't skepticism; it's about *assertibility conditions*. In ethics, a claim is "true" if it can be rationally justified. Your argument *provides* the justification condition: "We cannot verify a valid reason for exclusion." Therefore, the claim "Exclusion is unjust" is assertible.
  **Strategy:** If pressed, say: *"Dummett's anti-realism demands we only claim what we can justify. That's exactly what I'm doing. I'm not claiming access to moral facts; I'm claiming the absence of valid justification conditions for border coercion."*

  ---

  ### OBJECTIONS (Ordered by Damage Potential)

  #### 1. The Tutor (Kantian Cosmopolitan)
  **The Objection:** "Dummett's demand is too strong. A political community needs boundaries to function as a site of justice. If you dissolve the border, you dissolve the 'we' that owes each other obligations. You're prioritizing negative liberty (freedom from coercion) over the positive conditions needed for democratic self-determination."
  **Damage:** **High.** This attacks the feasibility of your view and comes from the grader. It suggests your solution destroys the subject of justice.

  *   **2-Minute Reply:**
      "I agree that political community is valuable, but we shouldn't confuse *community* with *exclusion*. Kantian cosmopolitanism actually supports a right to visit and interact without a right to permanent membership, but Dummett pushes further: if the state's power is coercive, the default must be freedom of movement unless specific harm is proven.
      The 'we' that owes obligations doesn't have to be ethnically or territorially sealed. We can have a political community based on shared institutions and law, not shared birth. If the border is the thing preventing the 'we' from expanding, the border is the injustice. I'm not arguing for the dissolution of the state, but for the dissolution of the *gatekeeping* function that treats outsiders as morally irrelevant. We can maintain democratic self-determination internally while acknowledging that the *external* coercion of the border requires a much higher bar of justification than 'preserving our current democracy.'"
  *   **Where it's Weak:** It glosses over how much migration might destabilize the welfare state or democratic cohesion in the short term.
  *   **Concede Up Front:** "I concede that a sudden, unregulated opening could strain institutions. Dummett allows for a transition period, but the *principle* of exclusion must be rejected."

  #### 2. The Libertarians (2 Students)
  **The Objection:** "You're relying on the state's legitimacy to make your point. You say the state coerces, so the state must justify. But the state *shouldn't* have the power to control movement in the first place. By arguing about 'justified exclusion,' you're legitimizing the state's right to exclude if they *could* find a good reason. True open borders come from property rights, not state benevolence."
  **Damage:** **High.** They argue you are reinforcing the very statist power structure you claim to critique.

  *   **2-Minute Reply:**
      "That's a valid ideal theory objection, but we live in a non-ideal world where states *do* monopolize force at the border. Whether the state *should* exist is a separate debate from how it must act *now*. Even if you believe in private property, the state currently prevents a landowner from hiring a foreign worker or a homeowner from hosting a foreign guest.
      My argument targets the *current* coercive apparatus. Whether the justification comes from 'public property' or 'state sovereignty,' the effect is a gun at the border. Dummett's point is that until the state is abolished (if ever), its coercive acts demand justification to the coerced. Your property rights argument actually aligns with mine: if individuals can invite whom they want, the state's exclusion is doubly unjustified—both as coercion and as a violation of association."
  *   **Where it's Weak:** It accepts the state's existence as a brute fact, which libertarians hate. It might look like status-quo bias.
  *   **Concede Up Front:** "I agree the state's power over movement is suspect. But Dummett's argument works even better if you accept their premise: if the state is a coercive monopoly, its burden of proof is immense."

  #### 3. The Communitarian
  **The Objection:** "States aren't just hotels; they are homes. A community has a right to protect its character, language, and shared values. Unchecked immigration changes the 'way of life' of the existing members. That loss is a genuine harm that justifies exclusion."
  **Damage:** **Medium.** This is the intuitive counter-argument, but Dummett explicitly rejects it.

  *   **2-Minute Reply:**
      "Dummett explicitly rejects 'cultural preservation' as a justification for coercion. Why? Because cultures are not museum pieces; they are living, changing things. The 'way of life' in 1950 is not the 'way of life' today, and that change happened without open borders.
      Furthermore, claiming a right to protect your culture by excluding others treats the culture as more valuable than the liberty of the outsider. It says, 'My comfort with my cultural homogeneity is worth your inability to escape poverty or persecution.' That hierarchy of value cannot be justified to the person on the other side of the fence. If the culture is so fragile it requires armed guards to sustain it, it's not a culture worth preserving through coercion."
  *   **Where it's Weak:** It can sound dismissive of genuine social anxiety and the value of social trust.
  *   **Concede Up Front:** "I concede that rapid demographic change can cause social friction. But friction is not a justification for coercion; it's a call for better integration policy, not closed borders."

  #### 4. The Utilitarian
  **The Objection:** "You're ignoring the consequences for the worst-off domestic workers. Influxes of low-skilled labor drive down wages for native-born low-skilled workers. You're trading the rights of the foreign poor for the welfare of the domestic poor."
  **Damage:** **Low.** This is an empirical claim that can be bracketed by your deontological framework.

  *   **2-Minute Reply:**
      "Two points. First, the empirical consensus is mixed; capital owners usually capture the surplus, not workers. But second, and more importantly for Dummett: this is a consequentialist objection to a deontological claim.
      Even if wages dip slightly, the harm to the excluded person is often catastrophic (remaining in poverty or danger), whereas the harm to the domestic worker is marginal (slower wage growth). But beyond the calculus: you cannot justify coercing Person A (the immigrant) to benefit Person B (the domestic worker) without Person A's consent. That treats the immigrant as a means to an end. The burden of proof is on you to show why the domestic worker's economic interest trumps the immigrant's basic liberty. A slight wage dip doesn't meet that burden."
  *   **Where it's Weak:** If they have hard data on wage suppression, you look out of touch with economics.
  *   **Concede Up Front:** "If there were evidence of catastrophic harm to the domestic poor, we'd need redistribution policies, not borders. We should tax the gains from migration, not stop the migration."

  ---

  ### ☠️ The One Question I'm Hoping Nobody Asks
  **The Question:** "If the state's coercion is the problem, and you demand justification to the coerced, **who decides if the justification is sufficient?** If the state decides, they'll always say yes. If the immigrant decides, borders dissolve. If a third party decides, what gives *them* authority? Isn't Dummett's framework politically paralyzed?"

  **Why it's dangerous:** It exposes the lack of an enforcement mechanism in Dummett's moral theory. It traps you between anarchy (immigrant decides) and statism (state decides).

  **The Pivot Answer:**
  "That's the central challenge of political philosophy. Dummett doesn't solve the *institutional* design problem; he sets the *moral* standard. We currently let the state decide, which is why the system is unjust. The goal is to build institutions—international courts, binding treaties—that act as that third-party arbiter. Until then, the moral burden remains on the state, even if they ignore it. The lack of an enforcer doesn't negate the injustice of the act."
