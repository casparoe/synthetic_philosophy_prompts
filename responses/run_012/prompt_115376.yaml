  You're a philosopher of mind who has actually taught Gödel, Escher, Bach to non-logicians and who knows where Hofstadter's gloss on Gödel is loose. Think carefully before you answer, and start by brainstorming three or four candidate carrying examples for the session before you settle on one.

  Next month I'm running a 75-minute session for a reading group: grad students from lit, CS and philosophy, sharp but nobody's a logician. They've read the first chunk of Hofstadter's Gödel, Escher, Bach and they keep saying tangled hierarchy like it just means paradox or feedback loop. What I want them to leave with is the inviolate level — the claim that below every tangled hierarchy there's a level the tangle itself can't touch, and that the tangle is only possible because of it.

  Dont explain the idea to me, plan how I teach it. What has to come first, what depends on what: does the plain notion of a hierarchy need to be solid before tangle means anything? Where does self-reference have to enter? Does the inviolate level come before or after they've actually seen a tangle, or is it something they should hit as a surprise? Which single example should carry the whole session, and what does that example have to have and have to lack to do the job? I'm guessing the misconceptions this crowd will bring are that the inviolate level is just the real world or the author standing outside the fiction, that a tangle is a contradiction, and that the inviolate level is a mysterious extra thing rather than something boringly mechanical — tell me if I've got those wrong and exactly where in the sequence I should head each one off. Also give me one question to ask at the end that would show the idea landed rather than that they can parrot the phrase, and tell me what I should openly refuse to cover at this level.

  On the carrying example: I was going to use Escher's Drawing Hands, but half of them have it on a poster and I worry it's too pretty to do any work. My alternative is a quine, a program that prints its own source code, where the inviolate level is the language and the interpreter underneath. Which of those actually carries it, or is there something better for this crowd? Be concrete about why.

  One more thing, and I care about this: seperate what's actually settled here from what's genuinely contested among people who know the material. I have a nagging suspicion that the tidy line about every tangle resting on an inviolate level is Hofstadter's own framing and that working logicians wouldn't put it that way at all. If that's right, say so, and don't hand me a contested reading dressed up as the consensus.

  Finish with a last line of exactly the form \answer{...} where the braces hold just the carrying example you picked, in three words or fewer.
