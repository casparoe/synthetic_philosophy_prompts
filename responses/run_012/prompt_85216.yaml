  So I'm a backend engineer and I've been listening to the Grand Inquisitor bit from The Brothers Karamazov on my commute. The old guy's case is basically that people can't actually handle the freedom they were handed — they'd rather trade it for bread, for mystery, for someone to bow to — and that whoever takes it off their hands is doing them a kindness. I want that argument transplanted into my world.

