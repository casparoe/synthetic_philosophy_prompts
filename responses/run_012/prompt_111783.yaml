answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Museum Name]
  **FROM:** [Your Name], Advisory Board Member
  **DATE:** October 23, 2023
  **SUBJECT:** DECISION MEMO: Interpretive Framework for Permanent Gallery

  **1. RECOMMENDATION FOR VOTE**

  I recommend the Board approve the following framework for the upcoming gallery:

  1.  **Retain all three rooms** (Troy, Arthur, Exodus) as comparative case studies.
  2.  **Adopt the "Evidence & Claim" tagging scheme** detailed below for all interpretive labels.
  3.  **Change the working title** from *History or Legend?* to **"The Past in the Present: Archaeology, Text, and Memory."**

  This approach rejects the binary of the original title. It allows us to be rigorous about evidence without dismissing the cultural power of these narratives. It treats the *impact* of the story as historical fact, even when the *events* of the story are contested.

  **2. PROPOSED WORKING TITLE**

  **"The Past in the Present: Archaeology, Text, and Memory"**

  *Reasoning:* The original title, *History or Legend?*, forces a false choice. It implies that if a story is not historically verifiable in every detail, it is merely a "legend" (implying falsehood), and if it is history, it cannot be legendary (implying a lack of cultural mythos). The new title acknowledges that these stories exist in two tenses: the ancient past we investigate and the present day where they continue to shape identities.

  **3. LABELLING RULES FOR DESIGNERS**

  To ensure consistency across the three rooms, all text panels addressing contested claims must adhere to the following **Evidence & Claim Protocol**. Designers should integrate these as standardized sidebar boxes or distinct typographic elements, not buried in body text.

  **A. The Claim Tag**
  Every major assertion must be categorized by one of four icons/colors:
  *   **Person:** (e.g., "A king named Arthur existed.")
  *   **Event:** (e.g., "A war occurred at this site.")
  *   **Sequence:** (e.g., "The plagues happened in this order.")
  *   **Record:** (e.g., "This text was written by an eyewitness.")

  **B. The Evidence Status**
  Adjacent to the Claim Tag, state the evidentiary basis:
  *   **Corroborated:** Supported by multiple independent sources (archaeological and textual).
  *   **Contested:** Supported by some evidence, contradicted by other evidence.
  *   **Tradition-Only:** The narrative itself is the sole source; no external contemporary evidence exists.
  *   **Unlikely:** Current evidence actively contradicts the claim.

  **C. The Falsifiability Note**
  For *Contested* or *Tradition-Only* claims, include a brief sentence: *"We would expect to find [X type of evidence] if this occurred; currently, [Y] has been found instead."*

  **D. The "Two Pasts" Distinction**
  Introductory panels in each room must explicitly state:
  *"Historians reconstruct the past using physical evidence and contemporary records. Communities remember the past through stories that convey meaning and identity. These two versions of the past do not always match, and this gallery examines both."*

  **4. TIMELINE**

  *   **Thursday, Oct 26:** Board Vote on Framework.
  *   **Friday, Oct 27:** Curatorial team incorporates Board feedback into tagging schema.
  *   **Monday, Oct 30:** Designers receive final text hierarchy and style guide for tags.
  *   **Friday, Nov 3:** Draft label copy submitted for legal and community review.
  *   **Monday, Nov 6:** Final copy to production.

  **5. THE STRONGEST CASE AGAINST THIS RECOMMENDATION**

  The Board must consider the argument that this framework is an act of cowardice disguised as nuance. By refusing to state plainly that the Exodus likely did not happen as described or that Arthur is a literary composite, we risk validating pseudohistory.

  Critics will argue that giving "Tradition-Only" claims the same visual weight as "Corroborated" claims creates a false equivalence. If a visitor leaves the gallery thinking, "Well, the evidence is just different, so it's 50/50 whether Moses parted the sea," we have failed our educational mandate. There is a genuine risk that in trying to offend no one, we teach the wrong lesson: that historical truth is purely subjective. We must ensure the tags make the *weight* of the evidence clear, not just the *type*.

  **6. ASSESSMENT: THE HARDEST ROOM TO WRITE**

  **The Exodus Room** will be the most difficult to execute, significantly more so than Troy or Arthur.

  *   **Why:** The Troy room benefits from a physical site (Hisarlik) where layers of destruction are visible, allowing us to separate the *place* from the *poem*. The Arthur room deals with a figure generally regarded by the public as mythic, where the stakes are literary rather than theological.
  *   **The Challenge:** The Exodus narrative is central to the self-definition of living religious communities (Jewish, Christian, and Islamic). The archaeological silence regarding a mass migration in the Late Bronze Age is loud, but "absence of evidence is not evidence of absence" is a critical nuance here. A nomadic group leaving no pottery is different from an imperial administration failing to record a slave exodus.
  *   **The Risk:** Explaining why we lack evidence for the Exodus without implying the community's history is a lie requires precise language. If we emphasize the lack of Egyptian records, we alienate religious stakeholders. If we hedge too much to accommodate faith, we compromise archaeological integrity. This room requires the most careful calibration of the "Two Pasts" distinction.

  **7. CONCLUSION**

  This framework allows the museum to remain rigorous without becoming hostile. It shifts the question from "Is this true?" to "How do we know what we know, and why does this story matter?" I urge the Board to vote in favor of this approach on Thursday so the design team can proceed.
