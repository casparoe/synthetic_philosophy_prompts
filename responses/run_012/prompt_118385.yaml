      *   *Refining the "Single Change":* If you drop (2) and allow qualia to have causal power, you solve the reliability issue (3), you make functionalism (4) easier (qualia can be part of the role), and you align better with physicalism (1) (physical things cause things). The cost is you have to explain how consciousness fits into causal closure without overdetermination. But it solves the biggest headache.
      *   *Alternative Single Change:* Drop (5). If there is no gap, physicalism is easy. But the user seems committed to the intuition of the gap.
      *   *Alternative Single Change:* Drop (3). Error theory. Very costly.
      *   *Best bet:* Dropping (2) is the standard move for physicalists who want to keep reliability. However, keeping (2) is often done to preserve (1) and (5) together (to avoid interactionist dualism). Actually, if you keep (2), you keep (1) and (5) safe from the interaction problem. If you drop (2), you risk violating causal closure unless you identify qualia with functional states.
