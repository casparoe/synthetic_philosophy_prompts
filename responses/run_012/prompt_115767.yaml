answer: |-
  Here is a complete design for the 90-minute session, including materials, timeline, and a robust debrief strategy that addresses your specific pedagogical concerns.

  ## Activity Title: The Regional Welfare Impact Board

  ### 1. Materials & Handouts

  You need two handouts. Do not label them with philosophical terms (e.g., "Utilitarianism"). Use bureaucratic language.

  #### Handout A: Statutory Mandate & Scoring Rubric
  **TO:** Regional Development Board Members
  **FROM:** Office of Statutory Compliance
  **SUBJECT:** Welfare Impact Statement (WIS) Protocol 9.2

  **The Mandate:**
  Under Section 4 of the *Sentient Land Use Act*, this Board is prohibited from weighing ecological integrity, species rarity, or biodiversity. The sole legal metric for approval is the **Net Aggregate Welfare Change (NAWC)** for all sentient individuals affected by the land conversion.

  **The Formula:**
  For each taxonomic group, calculate the *Impact Score* using the following equation:
  $$ \text{Impact Score} = (\text{Welfare}_{\text{post}} - \text{Welfare}_{\text{pre}}) \times \text{Population Size} $$

  **Operational Definitions:**
  1.  **Population Size:** Total individuals currently inhabiting the parcel (see Data Table).
  2.  **Welfare$_{\text{pre}}$:** The estimated average net welfare units per individual per year in the *current wild state*. (Positive = pleasure > suffering; Negative = suffering > pleasure).
  3.  **Welfare$_{\text{post}}$:** The estimated average net welfare units per individual per year in the *developed state*.
      *   *Note:* For this zoning classification (Industrial/Commercial), the statutory assumption is that the developed land supports **zero** sentient wildlife. Therefore, $\text{Welfare}_{\text{post}} = 0$.
  4.  **Time Horizon:** Calculations must cover the expected remaining lifespan of the current population. For simplicity, use **Average Remaining Lifespan** provided in the Data Table.

  **Decision Rule:**
  *   If Total NAWC > 0: **Approve** (Welfare Improvement)
  *   If Total NAWC < 0: **Reject** (Welfare Reduction)

  ***

  #### Handout B: Parcel 74-B Biological Data Sheet
  **CONFIDENTIAL DRAFT FOR BOARD USE ONLY**
  *Note: Figures are derived from the latest regional census and behavioral stress assays mandated by the Act. Do not question the empirical validity of these figures; they are the binding inputs for this session.*

  | Taxonomic Group | Est. Population on Parcel | Avg. Remaining Lifespan (Years) | Avg. Net Welfare/Year (Wild State) | Notes on Valence Assessment |
  | :--- | :--- | :--- | :--- | :--- |
  | **Soil Invertebrates** (Nematodes, Collembola) | 5,000,000 | 0.2 | **-10** | High metabolic stress; high predation risk; short duration. |
  | **Insects** (Beetles, Larvae) | 200,000 | 0.5 | **-5** | High mortality rate; resource scarcity. |
  | **Small Rodents** (Voles, Mice) | 400 | 1.0 | **+2** | Moderate predation risk; periodic starvation. |
  | **Songbirds** (Passerines) | 50 | 3.0 | **+5** | Seasonal breeding success; moderate security. |
  | **Large Mammal** (Deer species) | 4 | 8.0 | **+10** | Low predation risk; stable foraging; social bonding. |

  ***

  ### 2. Roles & Setup

  *   **Class Size:** 18 Students.
  *   **Grouping:** 6 Teams of 3 students.
  *   **Roles within Teams:**
      1.  **Chair:** Manages time, ensures the formula is followed, submits the final vote.
      2.  **Actuary:** Performs the arithmetic (calculator allowed).
      3.  **Recorder:** Drafts the one-sentence justification for the signature.
  *   **Room Setup:** Clusters of tables. Whiteboard at the front for tallying votes.

  ### 3. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10: Induction & Distribution**
  *   Distribute Handouts A and B.
  *   **Script:** "You are not ethics students today. You are civil servants. You have a statutory mandate. You do not have the authority to question the data or the mandate. Your job is to process the input and generate the legally required output. If the math says 'Approve,' and you vote 'Reject,' you are in violation of the Act. You have 20 minutes to calculate and sign."
  *   *Instructor Note:* Do not use words like "utilitarian," "suffering," or "philosophy." Use "compliance," "metrics," and "mandate."

  **00:10 – 00:30: Calculation Phase**
  *   Teams calculate the NAWC for each row and the Total NAWC.
  *   **The Math:**
      *   Invertebrates: $(0 - (-10)) \times 0.2 \times 5,000,000 = +10,000,000$
      *   Insects: $(0 - (-5)) \times 0.5 \times 200,000 = +500,000$
      *   Rodents: $(0 - (+2)) \times 1.0 \times 400 = -800$
      *   Birds: $(0 - (+5)) \times 3.0 \times 50 = -750$
      *   Mammal: $(0 - (+10)) \times 8.0 \times 4 = -320$
      *   **Total:** $+10,498,130$ (Massive Welfare Improvement)
  *   Circulate quietly. If a team argues about the data (e.g., "Nematodes aren't sentient"), remind them: "The Act defines them as sentient. Proceed with the calculation."

  **00:30 – 00:45: Board Deliberation & Signing**
  *   Teams must sign the "Welfare Impact Statement."
  *   **Prompt:** "Sign your name. If you cannot sign, write 'Dissent' and note the statutory violation you are choosing to commit."
  *   Collect the sheets. Tally the "Approve" vs. "Reject" votes on the board. (Expect most to Approve based on math, some to Dissent based on intuition).

  **00:45 – 01:30: Debrief & Theoretical Mapping**
  *   (See detailed debrief plan below).

  ***

  ### 4. The Debrief Plan (45 Minutes)

  The goal is to move from "That felt wrong" to "Here is the philosophical architecture that makes that conclusion necessary."

  **Phase 1: The Phenomenology of the Verdict (10 mins)**
  *   Ask the Chairs: "What was the mood in your room when the Actuary read the total?"
  *   Ask the Dissenters (if any): "What statute did you break? Why was it worth it?"
  *   Ask the Approvers: "Did you feel like you were doing math, or ethics?"
  *   **Point:** Establish that the discomfort comes from the *conclusion*, not the *process*. The process was rigorous; the output clashes with deeply held moral intuitions.

  **Phase 2: Naming the Thesis (10 mins)**
  *   Reveal the underlying view: **Total Utilitarianism applied to Wild Animal Suffering (Welfare Biology).**
  *   Explain the shift:
      *   *Standard Environmental Ethics:* Value lies in species, ecosystems, integrity (Holistic).
      *   *This Exercise:* Value lies strictly in the summed experiences of individuals (Atomistic).
  *   **Key Concept:** The "Logic of the Aggregator." If individuals are the unit of value, numbers matter more than "kind." A million mild sufferings outweigh one intense tragedy.

  **Phase 3: The Empirical Hinges (15 mins)**
  *   Address your worry about "manufactured conclusions." Draw three columns on the board: **Sentience**, **Valence**, **Aggregation**.
  *   **Ask:** "What single number in that table, if changed, flips the verdict?"
      *   *Sentience Threshold:* If Soil Invertebrates are removed from the calculation (not sentient), the total flips to negative immediately.
          *   *Discussion:* This is the primary empirical dispute in welfare biology. Where is the line?
      *   *Valence (Sign):* If wild invertebrate lives are Net Positive (+10) instead of Negative (-10), the verdict flips.
          *   *Discussion:* Is nature a paradise or a slaughterhouse? This is an empirical question about biology, not just ethics.
      *   *Aggregation:* If we cap the weight of small lives (e.g., "No more than 10% of the score can come from invertebrates"), the verdict flips.
          *   *Discussion:* This challenges the "Summing" assumption. Do we maximize the *total* or the *average*?
  *   **Point:** The exercise isn't a trick; it's a *reductio* of specific empirical premises. If you accept the premises (invertebrates count, nature is net negative, sums matter), the conclusion is inescapable.

  **Phase 4: Limitations & Unreproduced Disputes (10 mins)**
  *   Be honest about what the activity leaves out.
  *   **Epistemic Uncertainty:** In reality, we don't know the valence of a nematode. The exercise stipulated it to force a decision. Real policy must act under uncertainty.
  *   **Systemic Effects:** Clearing land affects adjacent parcels (migration, edge effects). The exercise isolated the parcel to simplify the math.
  *   **Rights/Constraints:** The exercise assumed no side-constraints (rights). A rights-view would say "You cannot kill the deer even if it maximizes welfare."
  *   **The "Ought Implies Can":** Even if clearing is "better," do we have the capacity to manage wild welfare without causing more chaos?

  ***

  ### 5. Predictable Failure Modes & Mitigation

  **1. The "Nematodes Aren't Sentient" Revolt**
  *   **What happens:** Students refuse to calculate the invertebrate line, claiming the data is absurd.
  *   **Mitigation:** Pre-empt this in the Intro. "The Act defines sentience broadly to include nociception. You are bound by the Act, not your biology textbook." If they still refuse, ask them to calculate the verdict *excluding* that line, then ask the class: "If the science *did* confirm nematode sentience, would your verdict hold?"

  **2. The "Sabotaged Math"**
  *   **What happens:** Teams intentionally miscalculate to get the "moral" answer (Reject Clearing).
  *   **Mitigation:** Walk around during the calculation phase. Check the Actuary's work. If a team gets a negative total, ask: "Show me your line item for Invertebrates." When they see the +10,000,000, they can't hide it. Make the math public during the debrief.

  **3. Cynicism ("This is Rigged")**
  *   **What happens:** Students dismiss the exercise because the numbers were handed to them.
  *   **Mitigation:** Own it in the debrief. "Yes, the numbers were stipulated. But in policy, we often have to act on stipulated models. The point isn't that these numbers are true; it's that *if* this model of value is true, these are the consequences. The dispute isn't the arithmetic; it's the model."

  **4. Emotional Distress**
  *   **What happens:** The idea that "clearing land is good because it kills suffering animals" can be viscerally upsetting to animal lovers.
  *   **Mitigation:** Frame the debrief carefully. "We are analyzing the logical structure of the argument, not advocating for bulldozers. Many philosophers who hold this view argue for *habitat modification* to reduce suffering, not destruction. We are testing the metric, not the machinery."

  ### 6. What This Activity Cannot Reproduce

  Be explicit about these limitations in the final 5 minutes to ensure intellectual honesty:

  1.  **Ecological Interdependence:** The exercise treats animals as isolated units of welfare. It cannot capture the value of a *relationship* or a *system* that isn't reducible to individual sensations.
  2.  **Long-term Uncertainty:** The exercise assumes we know the outcome. In reality, development often creates new suffering (e.g., pests, invasive species) that is hard to predict.
  3.  **The Non-Identity Problem:** The exercise assumes the *same* individuals exist in both scenarios. In reality, clearing prevents future animals from being born. This shifts the debate from "killing" to "preventing existence," which introduces complex population ethics (Total vs. Average Utilitarianism) that is too dense for this specific calculation but should be named.
  4.  **Moral Agency:** It treats the Board as pure calculators. It leaves out the virtue ethics of *being* the kind of person who signs that paper.

  ### Instructor's Note on the "Manufactured" Worry
  You worried that stipulating the figures manufactures the conclusion. **This is a feature, not a bug.**
  In the debrief, drive this home: "You feel the conclusion is manufactured because the *premises* are controversial. Specifically, the premise that $5,000,000 \times -10$ outweighs $4 \times +10$. This exercise isolates that specific tension. If you reject the verdict, you must reject either the sentience of invertebrates, the negative valence of wild invertebrate life, or the principle of aggregation. The exercise successfully forces you to identify exactly which pillar of the theory you stand on."
