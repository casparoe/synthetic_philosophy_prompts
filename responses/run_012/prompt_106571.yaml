      *   *Premise 2:* We make reports about qualia ("I see red").
      *   *Premise 3:* Causal Theory of Knowledge/Reference (To know/report on X, X must cause the report).
      *   *Conclusion:* Epiphenomenalism undermines our knowledge of qualia, making the assertion of epiphenomenalism self-defeating.

  3.  **Evaluate the Steps (The "Body Count"):**

      *   **Step 3 (The Load-Bearing Wall):** This is the Causal Theory of Knowledge/Justification. It's the crucial pivot.
          *   *The Journalist's Intuition:* It might prove too much.
          *   *Philosophical Reality:* This is indeed the controversial step. It assumes a specific externalist or causal account of knowledge. Internalists might disagree.
          *   *The "Common Cause" Reply:* If the brain state ($B$) causes both the Experience ($E$) and the Report ($R$), then $E$ and $R$ are correlated. Does $E$ need to cause $R$ for $R$ to be *about* $E$? Epiphenomenalists say no; the correlation is sufficient because $B$ guarantees both.
          *   *The Counter-Counter:* If $E$ does nothing, why is it there? Why not just $B \rightarrow R$? This is the "Zombie" problem. But strictly regarding *knowledge*, the common cause strategy is the standard defence.

      *   **Step 6 & 7 (Self-Defeating vs. False):**
          *   Does self-refutation entail falsity? Usually, yes. If a theory implies "I cannot know this theory is true," asserting it is pragmatically inconsistent. But is it *ontologically* false? That's trickier. It might be true but unknowable. However, if the theory implies we can't know *anything* about consciousness, it renders the discourse meaningless.

      *   **The "Proves Too Much" Worry:**
          *   Does Step 3 sink other views? If I say "I am in pain," does the pain have to cause the utterance? In standard physicalism, yes (pain is a brain state that causes behaviour). In Dualist Interactionism, yes. In Epiphenomenalism, no. So Step 3 specifically targets views that sever the causal link. It doesn't necessarily sink *all* views, but it sinks any view that separates the ontology from the epistemology in this specific way.

