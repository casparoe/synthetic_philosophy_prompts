      *(Self-Correction on "Common Cause"):* I need to explain *why* the common cause reply is often considered insufficient by the critics. It explains reliability, but does it explain *reference*? If $E$ does nothing, how does the word "red" latch onto $E$ rather than just $B$? This is the "inverted spectrum" or "reference" problem. I must make this clear.

