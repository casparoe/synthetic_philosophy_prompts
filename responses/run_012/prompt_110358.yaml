answer: |-
  ### Decision Tree: The Cluelessness Objection

  **Instructions:** Begin at **Node 1**. Answer the question honestly based on your current philosophical intuition. Follow the arrow to the next Node or to a Leaf (a final position). Terms like "consequentialism" refer to your starting commitment: "I should try to bring about the best consequences."

  **Note on Status:** Throughout this tree, **[Contested]** indicates a point where philosophers actively disagree. **[Settled]** indicates a point of broad agreement (rare in this domain). **[Flag]** indicates where distinct named positions may overlap in practice.

  ---

  #### **Node 1**
  **Is the inability to predict the long-term future a problem specific to trying to maximize good, or does it affect all moral theories (e.g., "do not lie," "be virtuous") equally?**
  *   It affects all moral theories equally. → **Leaf G**
  *   It is specific to trying to maximize good. → **Node 2**

  #### **Node 2**
  **Does the moral rightness of an action depend on the future that *actually* occurs, or the future you *reasonably expect* to occur based on current evidence?**
  *   The future that *actually* occurs. → **Node 3**
  *   The future I *reasonably expect*. → **Node 6**

  #### **Node 3**
  **If rightness depends on the actual future, does your inability to know that future make the theory useless for deciding what to do?**
  *   Yes, it makes the theory useless for decision. → **Node 4**
  *   No, the theory can still guide decision. → **Node 5**

  #### **Node 4**
  **If the theory is useless for decision, should you stop using consequentialism as your primary ethical guide?**
  *   Yes, abandon consequentialism. → **Leaf F**
  *   No, keep it despite the uselessness. → **Leaf U1**

  #### **Node 5**
  **If the theory can still guide decision, is the difficulty caused by confusing the *test* of rightness (what makes it good) with the *method* of choosing (how to pick)?**
  *   Yes, the problem dissolves once distinguished. → **Leaf B**
  *   No, the gap is real but manageable. → **Leaf E**
      *   **[Flag]:** *Leaves B and E are often grouped together under "Objective Consequentialism." The distinction rests on whether you view the uncertainty as a philosophical error (B) or a practical hurdle (E).*

  #### **Node 6**
  **If rightness depends on expectations, must you assign specific probabilities to all uncertain outcomes to calculate the best choice?**
  *   Yes, I must calculate expected value. → **Leaf A**
  *   No, I can decide without precise probabilities. → **Node 7**

  #### **Node 7**
  **If you do not calculate probabilities, do you follow rules that usually work, or avoid interventions that could fail badly?**
  *   Follow rules that usually work. → **Node 8**
  *   Avoid interventions that could fail badly. → **Leaf C**

  #### **Node 8**
  **If you follow rules, are those rules the final standard of rightness, or just tools to find the best act?**
  *   The rules are the final standard. → **Leaf D**
  *   The rules are just tools. → **Leaf U2**

  ---

  ### Leaf Descriptions & Diagnostics

  **Leaf G: General Skepticism**
  *   **Position:** Cluelessness afflicts every first-order moral theory equally.
  *   **Awkward Commitment:** You must accept that no moral theory can guarantee it avoids catastrophic long-term errors.
  *   **Status:** **[Contested]** Deontologists often claim duties (e.g., "do not kill") are knowable regardless of consequences; consequentialists deny this.

  **Leaf F: The Exit**
  *   **Position:** Exit to non-consequentialist ethics.
  *   **Awkward Commitment:** You abandon the goal of maximizing good because you cannot know how to achieve it.
  *   **Status:** **[Contested]** Some view this as a necessary retreat; others view it as a surrender to ignorance.

  **Leaf U1: Objective Consequentialism (No Procedure)**
  *   **Position:** Unnamed (Objective Consequentialism without a decision procedure).
  *   **Awkward Commitment:** You admit the theory cannot tell you what to do, yet insist it tells you what is right.
  *   **Diagnosis:** **[Incoherent/Unattractive]** Generally considered empty; a moral theory that cannot guide action is practically inert.
  *   **Status:** **[Settled]** Most philosophers agree a theory must offer some decision guide.

  **Leaf B: The Dissolution**
  *   **Position:** Pseudo-problem (Criterion/Decision-Procedure Distinction).
  *   **Awkward Commitment:** You must accept that an action can be "right" even if you could never know it was right at the time.
  *   **Status:** **[Contested]** Defended by some objective consequentialists; rejected by those who think "ought implies can know."

  **Leaf E: The Gap Management**
  *   **Position:** Standard tracks actual consequences; procedure tracks foreseeable ones.
  *   **Awkward Commitment:** You must live with a permanent gap between what is morally true and what you are justified in doing.
  *   **Status:** **[Contested]** **[Flag]:** *Functionally very similar to Leaf B. The difference is tonal: B claims the worry is a mistake; E claims it is a hard truth.*

  **Leaf A: Expected Value Maximization**
  *   **Position:** Evaluate actions by expected value under best available credences.
  *   **Awkward Commitment:** You must act on tiny probabilities of huge outcomes (e.g., Pascal's Mugging) if the math supports it.
  *   **Status:** **[Contested]** Standard in Effective Altruism, but challenged by "risk-weighted" decision theories.

  **Leaf C: Robustness**
  *   **Position:** Maximize but confine interventions to those robustly good across scenarios.
  *   **Awkward Commitment:** You may pass up a high-revenue opportunity because its downside is too uncertain, even if the expected value is higher.
  *   **Status:** **[Contested]** Gaining traction in longtermism; critics argue it is covert risk-aversion disguised as rationality.

  **Leaf D: Rule Consequentialism**
  *   **Position:** Switch from assessing acts to cultivating rules, dispositions, or institutions.
  *   **Awkward Commitment:** You must follow a rule even when you are certain breaking it would produce slightly better consequences in a specific case.
  *   **Status:** **[Contested]** A classic response to uncertainty; critics argue it collapses back into Act Consequentialism upon reflection.

  **Leaf U2: Act Consequentialism with Heuristics**
  *   **Position:** Unnamed (Act Consequentialism using rules as tools).
  *   **Awkward Commitment:** You follow rules only until you calculate that breaking them is better, at which point they cease to be rules.
  *   **Diagnosis:** **[Redundant]** Coherent but unstable; effectively collapses into Leaf A (since the *standard* remains the act's value) or Leaf D (if you never break the rule).
  *   **Status:** **[Settled]** Widely acknowledged as the "unstable middle ground" in the literature.

  ---

  ### Map of the Terrain (Commentary)

  **1. The Root Split (Node 1)**
  This is the most critical fork. If you choose **Leaf G**, you have dissolved the specific anxiety about consequentialism, but you have inherited a global moral skepticism. This is **[Contested]**. Many deontologists argue their duties are *not* subject to cluelessness (e.g., I know I shouldn't torture, regardless of the future). If you believe them, you must proceed down the tree.

  **2. The Objective vs. Subjective Split (Node 2)**
  This distinguishes whether morality is a fact about the universe (Objective) or a fact about your mind (Subjective).
  *   **The Objective Path (Nodes 3-5):** Leads to **Leaves B, E, F, U1**. The central tension here is whether "right" means "successful" or "reasonable." **Leaves B and E** are the standard philosophical defense against cluelessness. They are **[Flagged]** because in practice, proponents of B and E often agree on the grantmaking decision, differing only on the metaphysical explanation.
  *   **The Subjective Path (Nodes 6-8):** Leads to **Leaves A, C, D**. This path accepts that we cannot see the future, so we change how we calculate.

  **3. The Calculation Split (Node 6)**
  This divides the "Expected Value" crowd (**Leaf A**) from the "Precautionary" crowd (**Leaves C, D**).
  *   **Leaf A** is the dominant view in formal decision theory and much of the Effective Altruism community. It is **[Contested]** by those who argue probabilities in moral contexts are too vague to calculate.
  *   **Leaf C (Robustness)** is a growing alternative. It avoids the "Pascal's Mugging" problem of Leaf A but risks being overly conservative.

  **4. The Rule Split (Node 8)**
  This distinguishes **Rule Consequentialism (Leaf D)** from **Act Consequentialism with Heuristics (Leaf U2)**.
  *   **Leaf U2** is marked **[Redundant]** because if your rules are just tools for maximizing acts, you are still an Act Consequentialist (Leaf A). If you refuse to break the rule even when it maximizes good, you have moved to Leaf D. This "middle ground" is **[Settled]** as unstable in the literature, though many practitioners occupy it informally.

  **5. Unoccupied Space**
  *   **Leaf U1** is **[Incoherent]**. Holding that a theory is true but admits no method for using it is theoretically possible but practically dead.
  *   **Leaf U2** is **[Redundant]**. It is not a stable distinct position but a transitional state between A and D.

  **6. Consensus Check**
  There is **no consensus** on the correct path.
  *   **Settled:** Cluelessness is a serious problem (Node 1, "Specific" branch).
  *   **Settled:** Pure Objective Consequentialism without a decision procedure (Leaf U1) is untenable.
  *   **Contested:** Everything else. Specifically, whether to trust Expected Value (A), switch to Rules (D), or accept the Actual/Foreseeable gap (B/E). Your co-grantmakers are likely split between A, C, and D, with B/E serving as the philosophical justification for those who stay the course.
