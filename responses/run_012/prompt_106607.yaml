answer: |-
  **Bottom line**
  Yes, one principle captures the pattern: **The Principle of Downstream Consequences**. A dispute is verbal iff agreeing on all non-semantic facts eliminates all disagreement about action, theory, or norms. The cost is your Tomato verdict; under this principle, if the cook and botanist agree on the tomato's properties and uses, their dispute is merely verbal, regardless of their labels. You must treat classification as substantive only when it drags consequences behind it.

  **Candidate criteria**
  1.  **Factual Elimination:** A dispute is verbal if removing the contested word eliminates the disagreement. Motivated by your Hot Dog case. It fails when labels trigger norms independent of facts, as in the Free Speech case, where facts are agreed but normative outcomes differ.
  2.  **Conceptual Role:** A dispute is real if the word serves distinct functions in different frameworks. Motivated by the Tomato case. It fails to distinguish trivial taxonomy (Pluto) from substantive theory (Quasiparticle), as both involve frameworks but only one entails predictive stakes.
  3.  **Downstream Consequences:** A dispute is real iff the classification entails different commitments to action, prediction, or normativity. Motivated by Free Speech and Statue. If the label changes what you *do*, *expect*, or *owe*, it is real. This captures your suspicion about words "doing work" rather than merely labelling.

  **Scorecard**
  *   **Hot Dog:** No consequences. **Verdict:** Verbal. (Matches)
  *   **Pluto:** No physical consequences. **Verdict:** Verbal. (Matches)
  *   **Virus:** No physical consequences. **Verdict:** Verbal. (Matches)
  *   **Quasiparticle:** Explanatory work implies predictive consequences. **Verdict:** Real. (Breaks your lean, validates unsettlement)
  *   **Tomato:** If uses agree, no consequences. **Verdict:** Verbal. (Breaks your verdict)
  *   **Statue:** Different persistence conditions imply different predictions about survival. **Verdict:** Real. (Matches)
  *   **AI/Fetus:** Moral status implies rights and treatment. **Verdict:** Real. (Matches)
  *   **Free Speech:** Policy outcome depends on label. **Verdict:** Real. (Matches)

  The **Factual Elimination** criterion breaks at **Free Speech**, where facts align but norms diverge. The **Conceptual Role** criterion breaks at **Pluto**, where frameworks differ but stakes are low. The **Downstream Consequences** criterion breaks only at **Tomato**, provided you insist the dispute is Real despite agreed usage. It successfully handles the Quasiparticle unsettlement by classifying it as Real if explanatory power differs. This criterion offers the highest fidelity to your "work" suspicion, treating semantics as substantive only when linked to practice.

  **What I have to give up**
  You must abandon the Tomato verdict. If the botanist and cook agree on the object's properties and culinary treatment, calling it "fruit" or "vegetable" changes nothing practical. It is verbal. You should also revise the Quasiparticle verdict to Real; if the entity's existence status changes the mathematical models used for prediction, it is doing theoretical work, making the dispute substantive. The principle demands consistency: labels matter only when they drag consequences behind them. Your intuition on the Free Speech case is preserved because the label dictates policy outcomes, creating genuine normative stakes.

  **A new case**
  **Dispute:** "Is a deepfake a lie?" One party says yes, because it intends to deceive; the other says no, because no human speaker asserted a falsehood.
  **Application:** Under Downstream Consequences, this is **Real**. The classification determines legal liability, platform moderation rules, and social trust norms. It is not merely about the word "lie"; it is about whether algorithmic generation triggers human accountability mechanisms.
  **Confidence:** High.
  **Mind Changer:** If both parties agree on the liability distribution and moderation protocols regardless of the label (e.g., strict liability applies to all synthetic media either way), the dispute becomes verbal. The stakes define the reality.
