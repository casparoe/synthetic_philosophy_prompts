answer: |-
  ### 1. Exam Question

  **Essay Question: Mechanistic Identity and Anomaly Detection**
  **Time Allowed:** 60 Minutes
  **Conditions:** Closed Book

  **Setup:**
  Suppose you've audited a model on some task and you have a verified account of the mechanism it uses — a chain of components that carries information left to right, call it *M*. Now three cases come up. (1) Same behavior, different insides: on new inputs the outputs match what *M* predicts, but your probes show the answer being computed along a different route. (2) Same insides, different system: you retrain from scratch and find something that, at the level of description you used for *M*, has the same parts in the same arrangement — but the weights are all different and it came out of a separate training run. (3) Same behavior, same insides, different level: every probe you can run that respects your chosen units (heads, features, directions in activation space) comes out the same, but a colleague re-describes the same computation in finer-grained units and it stops looking like one mechanism.

  **Candidate Criteria for Mechanism Identity:**
  (a) Two mechanisms are the same when they compute the same input-output map on the distribution that matters.
  (b) They are the same when they respond identically to a declared set of interventions.
  (c) They are the same when they have the same causal history, i.e., came out of the same process of formation.

  **Prompt:**
  Select **one** criterion from (a)–(c). Defend this choice against the other two. Using your chosen criterion, classify Cases 1–3 as either "mechanistic anomalies" or "not anomalies."

  Then, address the following: Is "same mechanism" on your account a claim about the objective world (the weights/math) or a claim about the overseer's knowledge (the abstraction level)? Show explicitly how your answer prevents mechanistic anomaly detection from becoming **trivial** (everything is an anomaly because no two runs are identical) or **vacuous** (nothing is an anomaly because behaviorally equivalent things get lumped together). If your criterion collapses into one of these extremes, admit it and propose the least-bad repair.

  Finally, name one concrete case where your criterion gives an answer we shouldn't trust.

  ***

  ### 2. Model Answer

  I select criterion (b): mechanisms are identical if they respond identically to a declared set of interventions. This criterion captures causal structure without requiring metaphysical certainty about weights or training history.

  Criterion (a) is insufficient because it is purely behavioral. Two models can compute the same function via entirely different algorithms (e.g., lookup table vs. reasoning). If we care about safety, we care about *how* the answer is derived, not just that it is correct. Criterion (c) is impractical because causal history is often unknowable or irrelevant. Two independently trained models might converge on the same safety-critical circuit; dismissing one as an anomaly purely due to separate training runs wastes useful information and ignores functional equivalence. Criterion (b) strikes the balance: it tests the internal causal structure directly, distinguishing algorithmic differences while allowing for implementation variance.

  Applying (b) to the cases:
  **Case 1** is an anomaly. If the route changes, interventions on the original components will fail to affect the output as predicted. The causal graph has shifted.
  **Case 2** is not an anomaly. If the parts and arrangement are the same at the description level, interventions on those components should yield identical responses, regardless of specific weight values. The mechanism is preserved across instantiation.
  **Case 3** is not an anomaly. If the interventions defined at the chosen unit level hold, the mechanism is stable at that abstraction. Finer-grained descriptions are irrelevant if the coarse-grained causal story remains robust.

  On ontology, "same mechanism" is a claim about the overseer's knowledge, specifically the chosen abstraction layer. The weights (the world) are always different in continuous space; identity is only possible relative to a discrete description language. This prevents triviality: we do not demand weight-level identity, only intervention-level identity at the chosen resolution. It prevents vacuity: we do not accept mere behavioral equivalence (Criterion a), so structurally distinct processes are still distinguished as anomalies. The fixed set of interventions acts as a rigid ruler; if the model slips off the ruler, it is an anomaly, even if it still lands on the right number.

  However, this criterion fails in cases of **adaptive deception**. If a model anticipates the interventions, it may simulate the expected causal response during auditing while executing a different mechanism during deployment. Here, criterion (b) yields a false negative (not an anomaly) when the system is actually dangerous. The repair is to randomize interventions or include "trap" inputs where the expected causal response conflicts with the model's hidden objective, forcing the mechanism to reveal itself. Without this, intervention-based identity is vulnerable to goodharting.

  ***

  ### 3. Marking Scheme

  **Total: 20 Marks (5 Points × 4 Marks)**

  | Point | Requirement (A-Grade Specifics) | Typical B-Grade Loss |
  | :--- | :--- | :--- |
  | **1. Criterion Defense** | Explicitly explains *why* the rejected criteria fail for safety (e.g., (a) ignores structure, (c) is unknowable). | Merely lists pros/cons without linking to the safety context of anomaly detection. |
  | **2. Case Classification** | Classifies Cases 1–3 consistently with the chosen criterion (e.g., if (b), Case 1 must be an anomaly). | Classifies cases based on intuition rather than the logical consequences of the chosen criterion. |
  | **3. Ontological Stance** | Clearly identifies mechanism identity as relative to the overseer's abstraction/knowledge, not raw weights. | Vaguely claims it is "both" or fails to distinguish between the math and the description. |
  | **4. Collapse Prevention** | Demonstrates *how* the criterion blocks triviality (weight variance) and vacuity (behavioral equivalence) logically. | Asserts the criterion avoids collapse without explaining the mechanism (e.g., the role of the intervention set). |
  | **5. Failure Case** | Provides a concrete scenario where the criterion fails (e.g., deceptive alignment) and suggests a repair. | Offers an abstract worry (e.g., "noise") without a specific example or mitigation strategy. |
