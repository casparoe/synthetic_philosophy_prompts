answer: |-
  The letter arrived on a Tuesday, printed on paper that felt too heavy for the message. *Invitation to Serve.* Elias clicked the link, scanned the two-year commitment, and hit the *Decline* button. No reason required. No penalty. He went back to debugging his payment gateway integration.

  Two weeks later, the second letter arrived. *Notification of Audit Selection.*

  "You refused the House," the clerk said when Elias reported to the Ministry of Sortition. She didn't look up from her screen. She was chewing gum with a rhythmic, bored precision. "So you went into the Refusal Pool. Nine names get drawn from there every cycle. You're number four."

  "I refused because I didn't want to do the job," Elias said.

  "And now you're doing the veto job," she said, stamping a form. "Room 304. Don't be late. Payroll is direct deposit."

  The Audit Chamber wasn't grand. It looked like a conference room in a mid-tier insurance company. Fluorescent lights hummed. Nine people sat around a table covered in laminated briefs. There was coffee, but it was lukewarm.

  Elias sat next to Mara. She was older, wearing a cardigan that looked like it had seen three previous terms of government.

  "First time?" she asked.

  "Obviously."

  "Relax. We mostly just sign things. The House does the work. We just check for spikes."

  "The House is random too," Elias said. "Just a different pool."

  "True," Mara said, sliding a bill across the table. *Bill 404-B: Coastal Zone Density Adjustment.* "But the House is drawn from the Willing. We're drawn from the Unwilling. That's the design."

  "It's a bug," Elias said. He was thinking about system architecture. If you route traffic away from a server and then force it back through a backup node you declared unreliable, you get congestion. "If legitimacy comes from statistical mirroring, we're broken. People who refuse office aren't a random sample. We're the busy, the skeptical, the overwhelmed. We're biased."

  Mara sipped her coffee. "That's the mirror argument. But sortition isn't about mirrors. It's about equal claim. Everyone owns a share of the state. If you refuse to spend your share, you prove you're careful with it. The theory is that the people who don't want power are the safest people to hold the veto."

  "That's poetic," Elias said. "But look at the accountability loop. In an election, you can fire someone. Here, if the House messes up, we wait two years for the lot. If *we* mess up? We just vanish back into the population. Nobody can touch us."

  "Exactly," said a voice from the head of the table. This was Kael, the Audit Chair, drawn from the pool three months ago. "No career politicians. No campaigning. We don't have to please voters, because there aren't any. We just have to not ruin the country."

  A door opened. A man walked in, carrying a briefcase. He looked tired. This was a Member of the House, here to plead for his bill. He wasn't a politician; he was a former schoolteacher drawn from the Willing Pool.

  "Thank you for seeing me," the MP said. He sat without being asked. "The Coastal Zone bill. We need this passed. The seawalls are failing. We need the tax revenue from high-density builds to fund the repairs."

  Elias looked at the bill again. The density adjustment targeted the Harbor Flats. Low-income housing. Old brick.

  "My sister lives in the Flats," Elias said.

  The MP paused. "I'm sorry. But the engineering reports say—"

  "The engineering reports say you need money," Elias cut in. "You're selling out her neighborhood to pay for a wall."

  "We are balancing interests," the MP said. He looked frustrated. "Look, I didn't choose this. I got the letter. I said yes because someone has to. But I can't govern if you nine just block everything because it's inconvenient."

  "It's not about inconvenience," Mara said softly. "It's about the veto. Why do you think it exists?"

  "To stop tyranny," the MP said.

  "No," Mara said. "To stop the eager. The House is full of people who *wanted* to be here. They have energy. They have plans. Energy burns things. We are the water. We are the people who looked at the fire and said 'no thanks.' That makes us the only check on optimism."

  Elias leaned forward. "But if we're just the skeptics, aren't we just gridlock? If legitimacy is about representing the population, we don't. We represent the abstainers. If legitimacy is about rights, then fine, I have a right. But do I have a right to stop a seawall because I don't like the trade-off?"

  "You have the right to say the cost is too high for the people paying it," Mara said. "That's the job. The House proposes the cost. We verify who pays."

  The MP rubbed his face. "If you veto this, the seawall doesn't get built. If a storm comes..."

  "If you pass this, my sister gets evicted," Elias said. "She's not random. She's real. You're treating her like a variable in your equation."

  "I'm treating her like a citizen among thousands," the MP snapped. "I have to look at the aggregate. That's what governance is. Aggregation."

  "Aggregation is easy," Elias said. "It's just reduce() function. Sum the benefits, sum the costs. But you're dumping the error logs on the poorest district."

  "This isn't code," the MP said.

  "It's a system," Elias replied. "And your error handling is throwing exceptions on the users with the least bandwidth."

  Kael, the Chair, tapped his pen. "We need to vote. Majority rules. Five votes to veto."

  The room went quiet. The hum of the lights seemed louder. Elias looked at the other Auditors. There was a nurse, a mechanic, a retired accountant, a student. They weren't experts. They were just the ones who hit *Decline*.

  If Elias voted no, the bill died. The seawall might not get funded. The town might flood. But his sister keeps her home. Maybe. Or maybe the government finds another way, one that doesn't involve displacing the Flats.

  If he votes yes, he's part of the machine. He validates the system that said his refusal made him qualified to judge.

  "Think about the accountability," Mara said, looking at Elias. "If we pass this, and the seawall fails anyway? Nobody votes us out. We just go home. The memory fades. The next lot comes in. If we veto, and the town floods? Same thing. We disappear. The only thing that stays is the consequence."

  "That's the problem," Elias said. "We bear no cost for the decision."

  "We bear the cost of living here," Kael said. "Just like everyone else."

  The MP stood up. "I'm not asking for permission. I'm asking for understanding. I'm just like you. I got a letter."

  "That's the scary part," Elias said. "You're just like us. And you wrote this."

  The vote was by show of hands. Elias looked at his hand. It was just a hand. It didn't know anything about seawalls or zoning law. It belonged to a guy who fixed payment gateways. But it was the hand the system gave him.

  He thought about the Refusal Pool. The system assumed that because he didn't want power, he wouldn't abuse it. But maybe not wanting power just meant you didn't understand the weight of it.

  "Everyone ready?" Kael asked.

  Elias raised his hand. No.

  Four others raised their hands. No.

  Three raised yes. One abstained.

  "Veto sustained," Kael said. He didn't sound triumphant. He sounded tired. He stamped the document. *REJECTED.*

  The MP nodded, once. He didn't argue. He just picked up his briefcase. "Okay. Back to the drawing board. Or maybe not. Maybe the water wins." He left the room.

  The clerk came in to collect the papers. She didn't look at the outcome. She just stacked them.

  "You know," Mara said, packing her bag. "Next year, the House might draw your sister. Or you might be in the Willing Pool. The lot spins."

  "Hopefully not," Elias said.

  "If it does, you'll know how this feels," she said. "That's the only accountability we have. Knowing that next time, the shoe might be on your foot. Not because you campaigned. Just because the numbers came up."

  Elias walked out into the hallway. It was grey and institutional. People walked past with badges clipped to their lapels. *House Member.* *Audit.* *Clerk.* *Visitor.*

  His phone buzzed. A text from his sister. *Heard rumors about the vote. You okay?*

  Elias typed back: *Bill died. You're safe for now.*

  *Did you do it?*

  *We did.*

  *Feel like a hero?*

  Elias looked at the badge on his lapel. It was plastic, clipped on cheaply. He'd have to return it at the front desk.

  *Feel like a cog,* he typed.

  He walked to the front desk. The clerk there was eating a sandwich.

  "Leaving?" she asked.

  "For now," Elias said. He dropped the badge into the bin. It clattered against the others. A pile of plastic identities.

  "See you in ten years," she said. "If you don't refuse again."

  "If I'm drawn again," Elias said, "I'm refusing."

  "Then you'll go back in the pool," she said, biting into the sandwich. "Maybe you'll get picked again. Nine names every cycle. Odds are, you'll be back."

  Elias pushed the door open. The air outside was cold. The seawall was still broken. The houses were still standing. The system hadn't fixed anything. It had just paused. He walked to the train station, merging into the crowd, just another number waiting for the next draw.
