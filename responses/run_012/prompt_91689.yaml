  *   *Analysis:* The supertask sequence approaches noon, but the causal chain includes an action *at* the limit.
  *   *Verdict:* **Determinate.**
  *   *Reasoning:* This invokes Clause 3 (Stipulative Override/Action). The state at noon is causally determined by the action at noon, which supersedes the limit of the prior sequence. The discontinuity of the prior sequence is irrelevant because the final state is fixed by the final cause.

  **(c) Parallel Performance**
  *   *Description:* Infinite agents turn the dial (Case 2) once each.
  *   *Analysis:* The causal structure changes from "one agent, infinite acts" to "infinite agents, finite acts." However, the mathematical sequence of dial settings remains $1, 1/2, 1/4 \dots$.
  *   *Verdict:* **Determinate (0).**
  *   *Reasoning:* The Principle of Topological Determinacy relies on the convergence of the physical quantity, not the number of agents. As long as the schedule of settings is fixed and converges (Clause 1), the outcome is determinate. This shows determinacy attaches to the **schedule of states**, not the causal agency. If this were Case 1 (Switch) performed in parallel, it would remain Indeterminate.

