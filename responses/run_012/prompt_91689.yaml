  ### Stage 4: Application to New Cases

  **(a) The Averaging Lamp**
  *   *Description:* Brightness $B_n = \frac{1}{n} \sum_{i=1}^n S_i$, where $S_i \in \{0, 1\}$ oscillates.
  *   *Analysis:* The switch state $S(t)$ does not converge (Clause 1 fails). However, the *brightness* is defined as an average. The sequence of averages $1, 1/2, 2/3, 2/4 \dots$ converges to $1/2$.
