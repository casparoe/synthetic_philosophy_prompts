          *   Grade 3: Known by direct acquaintance, non-relational/functional.
          *   Core Claim: Grade 2 and 3 are inseparable. To make re-identification non-arbitrary requires relational tools (memory, function), which kills Grade 3. If no relational tools, re-identification is arbitrary/empty.
