answer: |-
  Your intuitions aren't confused; they track a single principle: **Authority belongs to the most recent competent self.**

  When you are competent, you are sovereign. You can override past directives (the ventilator case) and you can revoke pre-commitments about belief changes (the religion case). Your current voice silences your past self.

  When you are incompetent, sovereignty reverts to your last competent self. In the dementia/pneumonia case, the woman cannot decide now, so her past competent self decides for her, even against her current contentment. In the bar conversation case, the signed document is the only reliable evidence of that past competent will; anecdote isn't.

  The grief case is the key modifier: **Competence requires stability.** A directive written in deep grief or sleep deprivation lacks full authority because the "past self" wasn't truly competent then. Since neither self was fully competent, we default to preserving life.

  This principle predicts a verdict you haven't listed: **Fluctuating Competence.** Imagine a man with early dementia has lucid intervals. During a lucid interval (competent), he revokes his directive. During a foggy interval (incompetent), he begs for treatment contrary to the revocation. You must honor the revocation made during the lucid interval. The moment of competence controls the trajectory, not the moment of distress.

  Conversely, if a competent person writes, "Do not treat me if I become happy but mindless," and then becomes happy but mindless (incompetent), you do not treat. The past competent judgment of what makes life valuable overrides the current incompetent experience of value.

  You don't need to choose between past and present. You choose competence. When present competence exists, it wins. When it vanishes, the past remains the only valid agent.
