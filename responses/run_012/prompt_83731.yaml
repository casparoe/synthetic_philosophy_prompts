  # DECISION TREE: THE STATUS OF THE CONTINUUM HYPOTHESIS

  **Start:** You accept that CH is independent of ZFC.

  **Q1. Does this independence imply CH lacks a definite truth value?**
  *   **YES** → **Q2.** Is set theory merely manipulation of symbols, or description of structures?
      *   *Symbols:* **Formalism**.
          *   *Awkward Commitment:* "Mathematical statements have no meaning beyond their provability."
      *   *Structures:* **Structuralism**.
          *   *Awkward Commitment:* "Truth is always relative to a model; there is no absolute 'true' set theory."
  *   **NO** (CH has a truth value) → **Q3.**

  **Q2. (Skipped if Q1=NO)**

  **Q3. Is the universe of sets a single definite structure (Goldbach) or one of many equally valid structures (Parallel Postulate)?**
  *   *Many Structures:* **Set-Theoretic Multiverse**.
      *   *Awkward Commitment:* "There is no 'the' universe of sets; CH is true here and false there."
  *   *Single Structure:* → **Q4.**

  **Q4. Is the collection of all subsets of $\omega$ ($\mathcal{P}(\omega)$) a determinate object?**
  *   **NO:** **Indeterminacy of the Continuum**.
      *   *Awkward Commitment:* "The universe is unique, but the reals are too vague to settle CH."
  *   **YES:** → **Q5.**

  **Q5. Does fixing the semantics of second-order logic settle CH?**
  *   **YES:** → **Q6.** Is the semantics of second-order logic epistemically accessible to us?
      *   *NO:* **Unnamed (Semantic Skepticism)**.
          *   *Awkward Commitment:* "CH is settled by logic, but we are permanently cut off from understanding that logic." *(Note: Rare/Unexplored view; risks incoherence.)*
      *   *YES:* **Second-Order Realism**.
          *   *Awkward Commitment:* "Semantics determines truth, even if no first-order axiom system can capture it."
  *   **NO** (We need new axioms): → **Q7.**

  **Q6. (Skipped if Q5=NO)**

  **Q7. Must new axioms be justified by something intrinsic to the concept of 'set'?**
  *   **NO** (Extrinsic/Pragmatic justification is fine): **Pragmatic Realism**.
      *   *Awkward Commitment:* "We adopt axioms because the resulting theory is useful, not because they are 'true'."
  *   **YES** (Intrinsic justification required): → **Q8.**

  **Q8. Is the truth of CH knowable in principle by humans?**
  *   **NO:** **Skeptical Platonism**.
      *   *Awkward Commitment:* "CH is definitely true or false, but we are cognitively shut out from knowing which."
  *   **YES:** **Classical Platonism**.
      *   *Awkward Commitment:* "There is a missing intrinsic axiom, and we will eventually find it."

  ***

  **NOTES ON THE LEAVES**

  1.  **Separation:** This tree distinguishes *Second-Order Realism* from *Classical Platonism* based on the *source* of truth (semantics vs. intrinsic axioms), though both agree CH has a truth value. In practice, these positions often overlap.
  2.  **Unoccupied Branch:** The **Semantic Skepticism** leaf (Q6=NO) is largely unexplored. It is difficult to maintain that second-order semantics *settle* CH while simultaneously claiming those semantics are *inaccessible* without sliding into Skeptical Platonism.
  3.  **Order:** Distinction (6) ($\mathcal{P}(\omega)$ determinacy) is placed before Distinction (4) (Second-order logic) because the latter presupposes the former.
