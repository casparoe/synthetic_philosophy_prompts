prompt: |-
  I am the complaints and patient-safety investigator for a psychiatric hospital group. I write up roughly twenty cases a month — a patient says a medication has ruined their life, that a nurse was rough with them during restraint, that the ward round did not listen — and my findings go to the medical director and sometimes to lawyers, so they have to be defensible. I have about ninety minutes per case, one interview, the clinical record, and no clinical training beyond what I have picked up on the job. I am trying to rebuild our method around the literature on epistemic injustice, and I keep failing, because our present checklist — ask open questions, avoid assumptions, record the patient's words verbatim — is addressed entirely to the hearer's manners, while the failures that actually worry me are not.

  Let me set out the four failure modes I want the procedure to catch, since our previous version conflated them. First, plain credibility discounting: the report is heard and understood but given less weight because of who is speaking — the psychiatric label, the accent, the class, the history of complaints. Second, the discounting that hides inside plausibility: a report is set aside not because we disbelieve the speaker but because the thing reported strikes us as unlikely, and our sense of what is likely has been shaped by the very prejudices at issue. This is the one I most need tests for, because from the inside it feels like clinical judgement rather than prejudice. Third, the reports that never arrive: patients learn which complaints are futile and which will be read as symptoms, so they stop making them — which means our absence of complaints is evidence of nothing, and the procedure needs some audit step that does not depend on complaints. I have not been able to design one. Fourth, the gap in vocabulary: neither the patient nor we have the words for what happened, so the complaint arrives as vagueness, and vagueness is then read as unreliability. On the account I have been reading, that last one is not a failure of listening and will not be fixed by listening harder, which suggests that part of what I want a procedure to do cannot be done by a procedure at all.

  Write me the procedure. I want the questions in order, what counts as a sufficient answer to each, where the procedure terminates in a finding and where it terminates by handing the question to a person because the question is one of values rather than facts, and I want the steps that are doing moral work under the guise of evidential reasoning flagged as such. It must be runnable by a colleague with no philosophy training, in ninety minutes, and it must still produce a decision where the evidence is thin — the medical director will not accept a finding that amounts to "we cannot know" — so tell me how to do that without pretending to a certainty I do not have.

  Then run it on three cases: a patient with a diagnosis of schizophrenia reporting an unbearable inner restlessness that the record calls agitation and treats with more medication; a patient who says the food is being poisoned, where the record and an independent check both indicate that it is not; and a complaint from a patient who has made eleven previous complaints, every one of them closed without action. At least one of the three should come out in a way I will not like, and I would rather you tell me which parts of this job the procedure will keep getting wrong than round the edges off. No citations needed; take the concepts as given.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case analyses:

  1.  **Analyze the Request:**

      *   **Role:** Complaints and Patient-Safety Investigator for a psychiatric hospital group.
      *   **Task:** Write a new investigation procedure based on epistemic injustice literature, then apply it to three specific cases.
      *   **Constraints:**
          *   90 minutes per case.
          *   One interview + clinical record review.
          *   No clinical training (investigator is lay/administrative).
          *   Output must be defensible (for Medical Director/Lawyers).
          *   Must produce a decision (no "we cannot know").
          *   Must flag moral work disguised as evidential reasoning.
          *   Must distinguish between facts and values.
          *   Must address four specific failure modes:
              1.  Credibility Discounting (identity-based).
              2.  Plausibility Discounting (prejudice-shaped likelihood).
              3.  Silence/Non-Reporting (structural suppression).
              4.  Hermeneutical Gap (lack of vocabulary).
      *   **Tone:** Professional, rigorous, honest about limitations, no fluff/citations.
      *   **Specific Requirement:** At least one case outcome must be uncomfortable/unpopular, and I must identify where the procedure fails.

  2.  **Deconstruct the Four Failure Modes & Design Steps:**

      *   *Failure 1: Credibility Discounting.* Needs a step that explicitly isolates the *source* of the claim from the *content* of the claim.
      *   *Failure 2: Plausibility Discounting.* Needs a "Counterfactual Test." If a different patient said this, would we believe it? Also needs to separate "clinical improbability" from "prejudicial improbability."
      *   *Failure 3: Silence/Non-Reporting.* This is the hardest. The investigator only sees *filed* complaints. To audit silence, the procedure needs a "Proxy Indicator" step. Look for indirect evidence of distress (PRN meds, incidents, weight loss) even if no complaint was filed.
      *   *Failure 4: Hermeneutical Gap.* Needs a "Translation Step." Don't treat vagueness as falsehood. Look for somatic or behavioral correlates of the vague claim.

  3.  **Drafting the Procedure (The "Epistemic Safety Protocol"):**

      *   *Time Management:* 90 mins is tight. 30 mins record, 30 mins interview, 30 mins analysis/writing.
      *   *Structure:*
          *   Phase 1: Preparation (Record Review).
          *   Phase 2: The Interview (Elicitation).
          *   Phase 3: The Analysis (The Four Filters).
          *   Phase 4: The Finding (Decision).
      *   *Key Innovation:* The "Plausibility Anchor." Instead of asking "Is this true?", ask "What world must exist for this to be true?"
      *   *Moral Flagging:* Explicitly mark where the investigator is making a value judgment about risk vs. autonomy.
      *   *Decision Rule:* If evidence is thin, default to the "Least Restrictive Explanation" that accounts for the distress, rather than the "Most Clinically Likely" explanation. (This shifts the burden of proof slightly).

  4.  **Refining the Procedure for the User's Constraints:**

      *   *Constraint Check:* The user said "No clinical training." The procedure cannot ask the investigator to diagnose akathisia vs. agitation. It must ask them to compare *descriptions*.
      *   *Constraint Check:* "Must produce a decision." I need a tie-breaker rule.
      *   *Constraint Check:* "Flag moral work." I will add a specific box in the template for this.

  5.  **Developing the Three Cases:**

      *   *Case 1: Schizophrenia + Restlessness (Akathisia vs. Agitation).*
          *   *Issue:* Hermeneutical Gap + Plausibility Discounting. Patient says "inner restlessness," Record says "agitation."
          *   *Epistemic Risk:* Dismissing subjective experience as objective symptom.
          *   *Outcome:* Uphold complaint (partially). The distress is real, the label is wrong.
      *   *Case 2: Poisoned Food.*
          *   *Issue:* Credibility Discounting (Delusion vs. Reality).
          *   *Epistemic Risk:* Dismissing a safety check because the *reason* given is delusional, even if the *safety check* reveals a different truth (e.g., food is cold/tainted but not "poisoned" in the paranoid sense).
          *   *Outcome:* Dismiss the specific claim (poison), but flag the underlying fear/distrust as a safety issue. *Wait, the prompt says independent check indicates it is not.* So the fact is "No poison." The complaint is factually false. But is it epistemic injustice? No, sometimes things are just false. The procedure must allow for "False."
          *   *Uncomfortable Outcome:* This needs to be the one I "won't like." Maybe the procedure forces me to dismiss it, highlighting that epistemic justice doesn't mean believing everything. OR, maybe the procedure forces me to validate the *fear* even if the fact is wrong, which frustrates the "facts only" mandate of the Medical Director. Let's go with: The procedure forces a dismissal of the *fact* but mandates a systemic review of *why* the patient feels unsafe, which might look like "caving" to the Director. Actually, the prompt asks for *one* outcome I won't like. Let's make Case 3 the uncomfortable one.
      *   *Case 3: The Serial Complainer (11 previous complaints).*
          *   *Issue:* Credibility Discounting (History of complaints).
          *   *Epistemic Risk:* "Boy who cried wolf."
          *   *Outcome:* This is where the procedure should bite hardest. If the procedure works, it must treat this complaint *de novo*. If the complaint is valid, it must be upheld despite the history.
          *   *Uncomfortable Truth:* If I uphold it, the Director says "You're rewarding harassment." If I dismiss it, I fail the epistemic test. I need to find a middle ground that admits the procedure's limit.
          *   *Decision:* I will make Case 3 the one where the procedure *fails* to protect the patient because the "Decision Rule" forces a binary outcome on a cumulative harm.

      *   *Re-evaluating Case 2:* The prompt says "independent check... indicate that it is not." So the fact is established. The procedure must accept this. The epistemic work is ensuring we didn't dismiss it *just* because of the diagnosis.
      *   *Re-evaluating Case 1:* This is the classic hermeneutical injustice. The patient lacks the word "akathisia," staff use "agitation."
      *   *Re-evaluating Case 3:* This is the credibility deficit.
      *   *Selection for "Outcome I won't like":* Case 3. The procedure will likely force a dismissal because the *evidence* in the specific instance is thin, despite the *pattern* suggesting systemic ignoring. This highlights the limitation of the 90-minute个案 (case-by-case) model vs. systemic audit.

  6.  **Writing the Procedure (Iterative refinement):**

      *   Need to ensure the "Moral Flag" is prominent.
      *   Need to ensure the "Plausibility Test" is concrete.
      *   Need to address the "Silence" issue. Since I can't audit the whole ward in 90 mins, I need a "Proxy Question" in the interview. "Who else might feel this way but hasn't said it?"

  7.  **Final Polish of the Procedure:**

      *   Make it a checklist/template.
      *   Ensure the "Decision Matrix" handles thin evidence.
      *   *Crucial:* The prompt asks to flag steps doing moral work under the guise of evidential reasoning. I will add a specific column or note type for this.

  8.  **Drafting the Case Applications:**

      *   *Case 1 (Restlessness):* Show how the procedure identifies the vocabulary gap. Finding: Substantiated (Mislabeling of distress).
      *   *Case 2 (Poison):* Show how the procedure separates fact from credibility. Finding: Not Substantiated (Factually false), *but* with a recommendation on trust.
      *   *Case 3 (Serial Complainer):* Show the tension. Finding: Not Substantiated (Insufficient evidence in *this* instance), *but* with a strong flag about cumulative credibility discounting. *This is the uncomfortable one.* It admits the procedure can't fix the "Boy who cried wolf" problem in a single 90-minute slot.

  9.  **Review against Constraints:**

      *   90 mins? Yes, the steps are timed.
      *   No clinical training? Yes, focuses on language and records, not diagnosis.
      *   Defensible? Yes, creates an audit trail.
      *   Four failure modes addressed? Yes.
      *   Moral flags? Yes.
      *   One uncomfortable outcome? Yes (Case 3).

  10. **Final Tweak:** Ensure the tone is empathetic but cold enough for a legal/medical context. The user is an investigator; they need tools, not therapy.

  *(Self-Correction during drafting)*: I initially thought about asking the investigator to audit the ward for "Silence." That takes too long. I need to constrain it to the *case file*. The "Silence" check must be: "Does the record show distress indicators without corresponding complaints?"
  *(Self-Correction on Case 3)*: If I dismiss Case 3, am I failing the epistemic test? The prompt asks me to show where the procedure gets it wrong. So, dismissing Case 3 *is* the failure I need to highlight. The procedure is designed for *cases*, but the injustice in Case 3 is *systemic*. I must explicitly state this limitation.

  11. **Finalizing the Output Structure:**
      *   Part 1: The Procedure (The Epistemic Safety Protocol).
      *   Part 2: The Three Cases.
      *   Part 3: The Limitations (Where it fails).

