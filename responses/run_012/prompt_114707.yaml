answer: |-
  # The Epistemic Safety Protocol (ESP)
  **Version 1.0 | For Use by Non-Clinical Investigators | Time Limit: 90 Minutes**

  ## Purpose
  To determine whether a complaint represents a safety failure, a communication failure, or a factual error, while minimizing epistemic injustice (credibility deficit, hermeneutical marginalization, and plausibility bias).

  ## Constraints
  *   **Time:** 90 Minutes hard stop.
  *   **Evidence:** Clinical record + One patient interview.
  *   **Authority:** You are not judging clinical *correctness* (diagnosis/treatment), only clinical *process* (listening/recording/responding).
  *   **Output:** A binary finding (Substantiated / Not Substantiated) + Mandatory Moral Flag.

  ---

  ## Phase 1: Record Triangulation (30 Minutes)
  *Goal: Isolate the patient's voice from the institutional voice.*

  **Step 1.1: The Verbatim Extract**
  Extract every instance where the patient's direct speech is recorded in the notes regarding the incident.
  *   *Sufficient Answer:* A list of quotes.
  *   *Failure Mode Check (Vocabulary):* If the patient's words are absent and only staff summaries exist (e.g., "Patient stated he was agitated" vs. "Patient said 'I want to jump out of my skin'"), flag this as **Hermeneutical Risk**.
  *   *Action:* You must assume the staff summary is an interpretation, not a fact.

  **Step 1.2: The Plausibility Anchor**
  Identify the specific claim (e.g., "Nurse hurt me"). Ask: "If a staff member reported this about a colleague, what evidence would we require?"
  *   *Sufficient Answer:* A list of standard evidence types (CCTV, witness, injury log).
  *   *Moral Flag:* If the evidence required for the patient is higher than for the staff, note this as **Credibility Inflation**.

  **Step 1.3: The Silence Audit (Proxy)**
  Look for indirect markers of distress in the 48 hours surrounding the complaint (PRN medication requests, weight loss, refusal of food, isolation).
  *   *Sufficient Answer:* Presence or absence of behavioral markers.
  *   *Rationale:* Addresses **Failure Mode 3 (Silence)**. If markers exist but no complaint was recorded until now, the system failed to elicit the report earlier.

  ---

  ## Phase 2: The Interview (30 Minutes)
  *Goal: Elicit the experience without enforcing clinical categories.*

  **Step 2.1: The 'World' Question**
  Do not ask "What happened?" Ask: "Describe what the world felt like at that moment."
  *   *Sufficient Answer:* A description of sensations, emotions, or environment.
  *   *Failure Mode Check (Vocabulary):* If the patient struggles to name the sensation, do not press for a label. Ask: "Where do you feel it?" or "What does it make you want to do?"

  **Step 2.2: The Counterfactual Test**
  Ask: "If another patient told you this happened to them, would you believe them?"
  *   *Sufficient Answer:* Yes/No + Reason.
  *   *Rationale:* Exposes internalized stigma. If they say "No, because I'm ill," note **Internalized Credibility Deficit**.

  **Step 2.3: The Desired Outcome**
  Ask: "What would make this right now?"
  *   *Sufficient Answer:* Specific request (apology, medication change, staff change) OR "To be heard."
  *   *Moral Flag:* If the request is outside your power, you must still record it. Denying the request is administrative; ignoring it is epistemic.

  ---

  ## Phase 3: Analysis & Finding (30 Minutes)
  *Goal: Render a defensible decision.*

  **Step 3.1: The Plausibility Filter**
  Review the claim. Is it implausible because it contradicts physics/logic, or because it contradicts "clinical expectation"?
  *   *Test:* Remove the patient's diagnosis from the file. Does the claim still seem unlikely?
  *   *If Yes:* Dismiss as Factual Error.
  *   *If No:* Proceed to 3.2.
  *   *Moral Flag:* Mark if you are dismissing based on "Clinical Improbability." This is a value judgment, not a fact.

  **Step 3.2: The Vocabulary Translation**
  If the patient used vague terms (e.g., "bad," "wrong," "restless"), match them to the record.
  *   *Rule:* If the record uses a clinical term (e.g., "agitation") that *could* describe the patient's vague term but changes the *meaning* (e.g., "restlessness" implies internal state, "agitation" implies behavioral risk), flag as **Hermeneutical Mismatch**.
  *   *Finding:* This counts as Substantiated (Process Failure), even if the medication was clinically indicated.

  **Step 3.3: The Decision Rule (Thin Evidence)**
  When evidence is contradictory and thin:
  *   **Default:** Rule in favor of the explanation that requires the *least assumption of patient unreliability*.
  *   **Exception:** If accepting the claim requires assuming malicious intent by staff without corroboration, rule Not Substantiated.
  *   **Mandatory Note:** You must write: "This finding relies on [X] assumption. We cannot know for certain."
  *   *Rationale:* Satisfies the Medical Director's need for a decision without lying about certainty.

  **Step 3.4: The Moral Flag Box**
  Before signing, complete this box:
  *   *Where did I have to guess?*
  *   *Where did I prioritize safety over autonomy (or vice versa)?*
  *   *Where did the procedure force me to treat a systemic problem as an individual case?*

  ---

  # Application to Cases

  ## Case 1: The Restless Patient
  **Profile:** Diagnosis: Schizophrenia. Complaint: "Medication makes me feel like I want to crawl out of my skin." Record: "Patient agitated. Increased antipsychotic."
  **Time:** 90 Minutes.

  **Phase 1 (Record):**
  *   *Verbatim Extract:* Record says "Agitated." No quotes of "crawl out of skin." **(Hermeneutical Risk Flagged)**.
  *   *Plausibility Anchor:* If staff said "I feel restless," we would not treat with restraint. We would ask why.
  *   *Silence Audit:* PRN sedation given 3x in 24 hours prior. Distress markers present.

  **Phase 2 (Interview):**
  *   *World Question:* "It's inside my legs. I can't sit. It's not anger."
  *   *Counterfactual:* "If my sister said this, I'd take her to a doctor, not lock her up."
  *   *Outcome:* "Stop the pill or give me something for the legs."

  **Phase 3 (Analysis):**
  *   *Plausibility Filter:* Restlessness (akathisia) is a known side effect. Not implausible.
  *   *Vocabulary Translation:* Patient: "Inner restlessness." Record: "Agitation." These are not synonyms. One is a side effect; the other is a symptom of psychosis. Treating them as the same is a category error.
  *   *Decision Rule:* Evidence is thin (subjective sensation), but the record fails to capture the specific quality of the sensation.
  *   **Finding:** **SUBSTANTIATED (Process Failure).**
  *   **Reasoning:** The clinical record failed to distinguish between a symptom of illness and a side effect of treatment. The response (more medication) likely worsened the reported condition.
  *   **Moral Flag:** I am not diagnosing akathisia (I cannot). I am ruling that the *description* in the notes was insufficient to justify the treatment change.

  ---

  ## Case 2: The Poisoned Food
  **Profile:** Diagnosis: Paranoid Schizophrenia. Complaint: "Staff are poisoning my dinner." Record: "Delusional belief." Independent Check: Food safety logs clear, CCTV shows standard serving.
  **Time:** 90 Minutes.

  **Phase 1 (Record):**
  *   *Verbatim Extract:* "They put stuff in it."
  *   *Plausibility Anchor:* Poisoning is factually unlikely given logs.
  *   *Silence Audit:* Patient has lost 4kg in a month. Eating only sealed snacks.

  **Phase 2 (Interview):**
  *   *World Question:* "I taste metal. I feel sick after."
  *   *Counterfactual:* "No, I know people won't believe me."
  *   *Outcome:* "I want to cook my own food."

  **Phase 3 (Analysis):**
  *   *Plausibility Filter:* Remove diagnosis. Does the claim hold? No. CCTV and logs contradict.
  *   *Vocabulary Translation:* Patient says "Poison." Experience is "Taste metal + Feel sick."
  *   *Decision Rule:* The factual claim (poison) is disproven.
  *   **Finding:** **NOT SUBSTANTIATED (Factual Claim).**
  *   **Reasoning:** Physical evidence contradicts the specific allegation.
  *   **Moral Flag:** *Crucial Step.* Although the claim is factually false, the *distress* (weight loss, fear) is real. The procedure forces a binary finding on the *allegation*, but the moral work is in the recommendation.
  *   **Addendum:** "While the poisoning claim is unsubstantiated, the patient's refusal to eat constitutes a safety risk. The current method of addressing this (labeling delusion) is failing to ensure nutrition."

  *(Note: This is the outcome you might not like. It upholds the hospital's factual defense but admits the hospital is failing to keep the patient safe because they are fighting the 'delusion' rather than feeding the patient.)*

  ---

  ## Case 3: The Serial Complainer
  **Profile:** Diagnosis: EUPD. Complaint: "Nurse ignored my call bell for 2 hours." Record: "Patient attention-seeking." History: 11 prior complaints, all closed.
  **Time:** 90 Minutes.

  **Phase 1 (Record):**
  *   *Verbatim Extract:* "No one came." vs "Staff busy."
  *   *Plausibility Anchor:* Call bells are logged. Log shows bell rang, reset 2 hours later.
  *   *Silence Audit:* No other patients reported issues that shift.

  **Phase 2 (Interview):**
  *   *World Question:* "I felt abandoned. I was in pain."
  *   *Counterfactual:* "Probably not. I know I'm difficult." **(Internalized Credibility Deficit Flagged)**.
  *   *Outcome:* "I want an apology."

  **Phase 3 (Analysis):**
  *   *Plausibility Filter:* Bell log confirms the delay. Factually true.
  *   *Credibility Check:* The history of 11 complaints creates a "Credibility Debt." Staff assume this is another false alarm.
  *   *Decision Rule:* Evidence (bell log) supports the patient. However, the *harm* is disputed. Was 2 hours negligent?
  *   **Finding:** **NOT SUBSTANTIATED (Safety Failure).**
  *   **Reasoning:** While the delay occurred, the investigation cannot establish that it caused harm or violated protocol given staffing levels recorded that night.
  *   **Moral Flag:** **SYSTEMIC FAILURE DETECTED.**
      *   *Where the procedure breaks:* This case is not about *this* 2-hour delay. It is about the 11 previous times the patient felt unheard. The 90-minute case procedure cannot adjudicate cumulative epistemic harm.
      *   *Statement:* "By treating this as an isolated incident, I am replicating the injustice. The patient's history of complaints suggests a broken feedback loop, but I can only rule on today's bell. I am dismissing the complaint because I cannot prove negligence on *this* occasion, but I am flagging the patient's file for a separate systemic audit."

  ---

  # Limitations & Failure Modes of This Procedure

  You asked me to tell you where this will keep getting it wrong. Here is the honest assessment:

  1.  **The Binary Trap (Case 3):** The procedure forces a Substantiated/Not Substantiated finding on *incidents*. Epistemic injustice is often *cumulative*. In Case 3, the patient is right that they are ignored, but the procedure must dismiss the specific claim because the evidence for *negligence* (vs. busyness) is thin. You will look like you are protecting the staff. The procedure cannot fix the "Boy Who Cried Wolf" dynamic in 90 minutes; it can only flag it.
  2.  **The Clinical Wall (Case 1):** I am not allowed to diagnose akathisia. I can only say the *words* didn't match. A clever Medical Director can overturn this by saying "Agitation is the umbrella term we use." The procedure relies on the Director accepting that language precision matters. If they prioritize clinical efficiency over linguistic precision, this finding is void.
  3.  **The Moral Flag as Waste Paper:** There is a high risk that the "Moral Flag" box becomes a place to dump guilt so the investigator can sleep at night, while the Medical Director ignores it. It flags the moral work, but it does not force the organization to *do* the moral work.
  4.  **Silence is Still Invisible:** The "Silence Audit" (Phase 1.3) only looks at the individual's record. It cannot detect the patients who have stopped speaking entirely. You will continue to miss the quietest victims.

  **Final Instruction:** When you submit Case 3, attach a separate memo titled "Cumulative Credibility Risk." Do not put it in the case file. The case file is for facts; the memo is for the truth you cannot prove within the procedure's constraints.
