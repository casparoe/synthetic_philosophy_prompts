answer: |-
  ### Seminar Specification: Desiderata for Naturalized Intentionality

  To assess any proposal for naturalizing content, we must first agree on what counts as success. The following list constitutes the specification. Each item is framed as a requirement, followed by the motivating consideration, the theoretical work it performs, and its status (non-negotiable or camp-specific).

  #### 1. The Normative Constraint
  *   **Requirement:** The theory must distinguish between a state *being* correct and a state *being taken* to be correct. It must ground the possibility of genuine misrepresentation (error) without invoking semantic primitives.
  *   **Motivation:** Intentional states have satisfaction conditions. A belief that *p* is false if not-*p*. A simple causal covariation account fails here: if a frog's fly-detector fires at a BB, a covariation theory must say the state represents *fly-or-BB* (making the firing correct), whereas intuition says it represents *fly* (making the firing an error).
  *   **Work Done:** Rules out simple Informational/Semantic Covariation theories (e.g., early Fodor) that cannot break the disjunction without circularity.
  *   **Status:** **Non-negotiable.** Without normativity, there is no intentionality, only causation.

  #### 2. The Determinacy Constraint
  *   **Requirement:** The theory must fix a determinate content for a state, distinguishing content from reference and preventing indeterminacy between competing interpretations (e.g., *rabbit* vs. *undetached rabbit part* vs. *temporal stage of rabbit*).
  *   **Motivation:** Quinean indeterminacy and Kripkean skepticism. A physical state stands in causal relations to infinitely many properties. The theory must explain why the state locks onto one specific property rather than a disjunction or a gerrymandered alternative. It must also distinguish the *mode of presentation* (content) from the *object* (reference).
  *   **Work Done:** Rules out theories that rely solely on causal contact without a mechanism for filtering relevant from irrelevant causal partners.
  *   **Status:** **Non-negotiable.** Indeterminate content is no content at all.

  #### 3. The Intrinsic Supervenience Constraint
  *   **Requirement:** Intentional content must supervene on the intrinsic physical properties of the system and its current environment, such that intrinsic duplicates share intentional states.
  *   **Motivation:** The "Swampman" case (Davidson). If a molecule-for-molecule duplicate of a thinker arises by chance without an evolutionary history, intuition suggests it still has thoughts. If content depends on history, Swampman has no mind. This requirement also preserves the explanatory link between content and immediate behavior; if content depends on distant history, it is unclear how it causes current action.
  *   **Work Done:** Rules out strong Etiological theories (including standard Teleosemantics) and historical causal theories.
  *   **Status:** **Camp Preference.** Externalists reject this; Internalists demand it. (Note: This is the primary fault line for your seminar).

  #### 4. The Causal Relevance Constraint
  *   **Requirement:** Content must not be epiphenomenal. The specific content of a state must explain why the system behaves as it does, distinguishing *representing X* from merely *being disposed to behave as if representing X*.
  *   **Motivation:** If content is merely an observer's gloss on behavior, it does no scientific work. We need to know how the "aboutness" gets inside the causal loop. This addresses the distinction between a thermostat (which covaries but arguably doesn't represent) and a cognitive agent.
  *   **Work Done:** Rules out Interpretationalism (Dennett-style) where content is merely a heuristic tool for prediction, and "Fodor-style" asymmetry accounts where content is determined by laws outside the head.
  *   **Status:** **Non-negotiable** (for cognitive science), though Interpretationalists dispute it.

  #### 5. The Subvening Base Generality Constraint
  *   **Requirement:** The theory must account for content in systems that lack a phylogenetic history of natural selection, including artifacts (AI), individual learners, and exapted cognitive mechanisms.
  *   **Motivation:** Cases 4 and 5 from your prompt. A neural network trained via gradient descent has representational states. A human learning a new concept via operant conditioning has new content. If a theory requires species-level selection, it cannot explain individual learning or artificial intelligence.
  *   **Work Done:** Rules out strict Bio-Teleosemantics (Millikan, Papineau) unless significantly modified to include ontogenetic or artificial selection processes.
  *   **Status:** **Camp Preference.** "Bio-naturalists" accept restriction to biological systems; "Liberal naturalists" demand broader scope.

  ---

  ### Assessment: Can Teleosemantics Satisfy the List?

  You asked plainly whether a theory grounding content in evolutionary function can satisfy this list once cases 3 through 5 are on the table.

  **The answer is No.**

  Standard Teleosemantics satisfies **Normativity (1)** and **Determinacy (2)** exceptionally well. It solves the Disjunction Problem (Case 3: Predator vs. Shadow) by appealing to the conditions under which the mechanism was *selected*. The state represents *Predator* because that is what it was selected to detect; the Shadow is a false positive because it does not satisfy the selected function.

  However, it fails the remaining three requirements when pressed:

  1.  **Failure on Intrinsic Supervenience (Case 2: Swampman):** Teleosemantics is essentially historical. Swampman has no selection history. Therefore, strictly speaking, Teleosemantics assigns Swampman no content. To save the theory, one must reject Requirement 3 as a camp preference rather than a non-negotiable constraint.
  2.  **Failure on Exaptation (Case 4: Recruitment):** If a state was selected for Task A but is now used for Task B, Teleosemantics dictates the content is fixed by Task A (the historical proper function). However, the organism's current behavior and cognitive role align with Task B. The theory creates a divergence between the assigned content and the actual functional role of the state in the current system, violating **Causal Relevance (4)**.
  3.  **Failure on Generality (Case 5: AI/Learning):** Strict Teleosemantics cannot ground the content of a neural network trained via gradient descent or a human acquiring a belief through rational inference rather than selection. While "Learning Teleosemantics" attempts to treat learning as a selection process, this often dilutes the normative bite of the original theory, collapsing back into a functional role account.

  **Verdict:** Teleosemantics purchases Normativity (1) at the cost of Intrinsicness (3) and Generality (5). It cannot satisfy the list if all are treated as non-negotiable.

  ---

  ### The Tensions: Incompatibilities in the Specification

  The "interesting result" you anticipate lies in the conflict between the **Normative Constraint (1)** and the **Intrinsic Supervenience Constraint (3)**.

  *   **The Tension:** To ground normativity (error) naturalistically, you generally need a standard of correctness independent of the current state of affairs. History (etiology) provides this standard (what the system was *supposed* to do). However, history is extrinsic. If content depends on history, intrinsic duplicates (Swampman) can differ in content. If content supervenes intrinsically (to save Swampman), you lose the historical standard needed to ground error non-circularly.
  *   **Secondary Tension:** There is a tension between **Normativity (1)** and **Generality (5)**. The only robust naturalistic account of normativity we have is etiological (selection). If you demand the theory apply to non-selected systems (AI), you must find a source of normativity other than selection. Most alternatives (e.g., functional role) struggle to distinguish *mis*representation from *different* representation without smuggling in teleology.

  ### The Most Exclusionary Requirement

  **The Normative Constraint (1)** does the most work to exclude candidates.

  Almost every naturalistic theory fails here. Causal theories collapse error into difference. Functional role theories struggle to explain why a role is *correct* rather than just *consistent*. Interpretational theories make normativity observer-relative. Teleosemantics is arguably the *only* candidate that satisfies (1) robustly, which is why it remains dominant despite its failures on (3) and (5). If you relax (1) to allow for "functional success" rather than "truth conditions," the field opens up, but you cease to be explaining *intentionality* in the strict sense.

  ### Advice on Revising the List (Dropping Etiology)

  If you give up on the etiological element to satisfy **Intrinsic Supervenience (3)** and **Generality (5)**, you must revise the **Normative Constraint (1)**.

  Without history, you cannot ground "proper function" in a naturalistic way. You will likely be forced to adopt a **Functional Role Semantics** or a **Structuralist** account.
  *   **Revision Required:** You must weaken the requirement on Error. Instead of "genuine misrepresentation grounded in nature," the requirement becomes "systematic divergence from environmental regularities that leads to functional breakdown."
  *   **Consequence:** This shifts the seminar from "Naturalizing Truth Conditions" to "Naturalizing Computational Function." You save Swampman and AI, but you lose the robust realism about content that motivated Teleosemantics in the first place. The list becomes consistent, but the resulting theory may no longer satisfy the original urge to explain how thoughts hook onto the world, only how they hook onto each other and behavior.

  **Recommendation for the Seminar:** Keep the tension explicit. Do not smooth over the conflict between (1) and (3). Force the students to choose: Do we want content to be real and normative (Teleosemantics), or do we want it to be intrinsic and general (Functionalism/Structuralism)? The specification should reflect that a theory satisfying *all* five may be impossible.
