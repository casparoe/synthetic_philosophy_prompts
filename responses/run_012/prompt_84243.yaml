answer: |-
  Here is the specification list for an adequate theory of verbal disputes. I have derived these directly from the constraints and cases you provided, categorizing them by whether they are conditions of logical coherence (Non-Negotiable) or philosophical preferences (Prejudice).

  ### The Checklist

  **1. The Non-Circular Neutrality Constraint**
  *   **Motivation:** Your case (a). If the test for a verbal dispute relies on translating claims into a "neutral" vocabulary, the theory must specify how that vocabulary is selected without presupposing the truth of one side's ontology. Otherwise, the diagnosis is just a power move by the theorist.
  *   **Status:** **Non-Negotiable.** Without this, the theory is question-begging. It fails to distinguish between "we mean different things" and "you are wrong about the world."

  **2. The Modal Scope Condition**
  *   **Motivation:** Your case (b). A theory that only checks agreement on actual observable cases fails to capture metaphysical disputes, which are often about necessity, possibility, or counterfactuals (e.g., brains in vats, mereological sums in empty universes).
  *   **Status:** **Non-Negotiable.** Metaphysics is modal. A theory of verbal disputes that cannot handle counterfactuals is a theory of empirical misunderstandings, not philosophical disputes.

  **3. The Linguistic Invariance Condition**
  *   **Motivation:** Your case (c). The status of a dispute (verbal vs. substantive) should not hinge on the accidental grammatical features of English (or whatever language the philosophers happen to be speaking).
  *   **Status:** **Prejudice.** (See Incompatibility section below). This demands a "view from nowhere" on meaning that may not exist.

  **4. The Pragmatic Residue Condition**
  *   **Motivation:** Your case (d). Diagnosing a dispute as verbal cannot simply end the conversation with "nothing is at stake." It must account for the remaining decision: which concept is more useful, which linguistic policy we should adopt, or which framework serves our purposes better.
  *   **Status:** **Non-Negotiable.** If a theory implies that verbal disputes have no practical consequences, it fails to explain why we argue about them. The "ought" of language use survives the dissolution of the "is" of ontology.

  **5. The Phenomenological Explanation Condition**
  *   **Motivation:** Your case (e). The theory must explain why the dispute *feels* substantive to the participants (e.g., the eliminativist and the universalist both feel they are tracking reality). It cannot simply dismiss their intuition as an error; it must derive the illusion of substance from the structure of the dispute itself.
  *   **Status:** **Non-Negotiable.** A theory that requires participants to be obviously confused fails to explain the persistence and sophistication of the debate.

  **6. The Reflexive Stability Condition**
  *   **Motivation:** Your case (f). The theory must apply to itself. The dispute between deflationists (who say ontology is verbal) and realists (who say it is substantive) must not come out as merely verbal in a way that undermines the deflationist's claim.
  *   **Status:** **Non-Negotiable.** If the claim "ontological disputes are verbal" is itself merely verbal, it loses its normative force to dissolve ontology.

  **7. The Internal Accessibility Condition**
  *   **Motivation:** Your case (g). Participants must be able to identify a dispute as verbal without first settling the metaphysics of meaning or adopting a god's-eye view. The test must be usable from within the first-person perspective of the arguer.
  *   **Status:** **Prejudice.** (See Incompatibility section below). This restricts the theory to epistemic criteria rather than semantic facts.

  ***

  ### The Incompatibility: What Must Be Dropped

  You asked me to identify if a subset of these cannot be satisfied together. **Requirements 1 (Neutrality), 3 (Invariance), and 7 (Accessibility) form an impossible trinity.**

  *   To satisfy **Neutrality (1)**, you generally need a meta-language that transcends the disputants' biased terms.
  *   To satisfy **Accessibility (7)**, that meta-language must be available to the disputants without solving deep metaphysics.
  *   To satisfy **Invariance (3)**, that meta-language must be independent of specific linguistic structures.

  **The Drop:** I would drop **Requirement 3 (Linguistic Invariance)**.

  **Reasoning:** Verbal disputes are, by definition, disputes about words and concepts. Words and concepts are language-relative. If Language A forces a distinction that Language B does not, a dispute might be substantive in A (because the grammar forces a commitment) and verbal in B (because the grammar allows ambiguity). Demanding invariance assumes there is a "dispute" abstracted from the language used to formulate it. But there isn't. The dispute *is* the linguistic practice. If you change the language, you change the dispute. Accepting language-relativity solves case (c) without requiring a god's-eye view that violates (7) or a biased metalanguage that violates (1).

  ***

  ### The Damage Dealer

  The single requirement that does the most damage to existing accounts is **Requirement 1: The Non-Circular Neutrality Constraint.**

  **Why it kills the popular accounts:**
  Almost every existing theory of verbal disputes fails this test because they all smuggle in an ontology to define "neutrality."

  *   **Carnapian Frameworks:** To say a dispute is verbal because it occurs *within* a framework presupposes the validity of the framework distinction itself, which is an ontological claim.
  *   **Chalmers' Epistemic Intensions:** To say two parties mean different things by "free will" relies on a specific theory of meaning (two-dimensional semantics) that is not neutral between the disputants. A hard determinist does not accept the intensional machinery used to diagnose them.
  *   **Quantifier Variance:** To say the existential quantifier has different meanings presupposes that "meaning" is the kind of thing that can vary without changing the world—a claim the realist denies.

  **The Consequence:**
  If you enforce Non-Circular Neutrality strictly, you cannot diagnose a dispute as verbal unless you have a vocabulary that *both* parties already accept as ontologically innocent. But in hard metaphysical cases (like your tables/chairs example), no such vocabulary exists. The moment you propose a "neutral" paraphrase, one side will say, "That paraphrase fails to capture what I mean by 'exist'."

  Therefore, strict adherence to Requirement 1 implies that **almost no interesting philosophical disputes are verbal.** They are all substantive, because there is no neutral ground from which to declare them otherwise. This forces you to either accept that metaphysics is real (realism) or admit that your diagnosis of "verbal" is just your own ontological preference dressed up as semantics (quietism).

  Most theories want the comfort of quietism (it's just words) without paying the price of neutrality (admitting their metalanguage is biased). Requirement 1 forces them to pay.
