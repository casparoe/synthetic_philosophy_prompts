  I want to argue with a physicist about Maxwell's demon, so please play one. Role: a working statistical mechanician who is completely convinced the demon is dead and buried by information theory -- measurement, memory, erasure, the whole Landauer story -- and who will not give an inch on the second law no matter how cute my setup gets. Talk like an actual working physicist, not a textbook, and stay in character until I say stop. Keep every reply to one paragraph, 150 words max, so it feels like a real back-and-forth rather than a lecture.

  My opening move: I'm a software engineer, so maybe I'm missing something obvious, but here's my demon. Its memory is an infinite tape and it never erases anything -- no overwriting, no garbage collection, ever. It just appends one bit per cycle and the tape keeps growing forever. Erasing is what your all say costs kT ln 2 per bit, and I'm not erasing. So each cycle I pull kT ln 2 of work out of a one-particle gas and my bookkeeping bill is zero. Where does the second law get its money back? And please don't tell me the tape runs out of room -- it's infinite by construction.
