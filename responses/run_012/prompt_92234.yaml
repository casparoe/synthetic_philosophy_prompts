          *   This is the crux of the argument with the flatmate. The flatmate says Reward = Pain. User says Reward != Valence.
          *   The user's distinction is solid *if* the "Tag" is internal. The tension is whether current RL *has* the tag. Claim 4 says no. Claim 2 says Tag is needed. This holds together well, provided the definition of "Tag" is robust.
      *   **The "Zombie" Problem:** Claim 5 suggests a system could tick functional boxes but lack "what it is like." Claim 1 says organization *makes* the mind.
