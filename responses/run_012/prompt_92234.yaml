prompt: |-
  me and my flatmate were up till about 2 arguing about this and I lost, or at least I couldnt say why I was right, so I want to write it out and have you tell me if it holds. he does RL research, trains policies all day, and he keeps saying — half joking, half not — that his agent is in pain when the reward goes negative. I kept saying no, thats just a scalar, a number going down isnt suffering, and then he asked me whats the difference then and I sort of flailed. so here is what I actually think.

  1. Functionalism, unqualified. Get the organisation right and you get the mind, substrate is irrelevant.
  2. Valence, the liking/hurting part, is a functional kind with two components. First a scalar that ranks the systems own states as better or worse *for it*. Second a binding step, where that scalar gets taken up into a self-representation, so it registers as happening to me rather than as a number floating in the environment. Ive been calling the second bit the tag. The scalar is cheap, the tag is what hurts.
  3. A reward signal in an RL setup is not yet either of those. Its the designers knob — a number the designer writes down and uses to shape behaviour. It only becomes valence if the agent itself represents it as a good or bad state of itself. Reward belongs to the designer, valence belongs to the agent. Which means you can write down any scalar you like and update weights with it and learn nothing at all about whether anythings being felt.
  4. I dont think any current RL agent suffers. Including the ones with a thin self-model, and I do think some of them have one — they track their own states and policies well enough to count.
  5. I think consciousness is required for suffering. Tick every functional box you like, if theres nothing it is like to be the thing, nothings being suffered.
  6. I think the ethics comes apart from the metaphysics. I can be honestly unsure whether a system suffers and still be sure I shouldnt treat it however I want, because the asymmetry of the possible mistake does the work there.

  which pairs are actually in tension, how bad, and for each real one whats the cheapest repair and what does it cost me? I'm pretty sure theyre not all in tension, a couple of them I suspect just look bad next to each other. and if theres a pair where one of them just has to go, say so plainly rather than telling me it depends.
