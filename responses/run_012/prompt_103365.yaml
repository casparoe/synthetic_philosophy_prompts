  **INTERNATIONAL BUREAU OF FOUNDATIONAL STANDARDS**
  **PRESS RELEASE: IBFS-2024-09-C**
  **FOR IMMEDIATE DISTRIBUTION**

  **SUBJECT: FINAL EPISTEMIC CLASSIFICATION OF THE THESIS ON EFFECTIVE COMPUTABILITY**

  The International Bureau of Foundational Standards (IBFS) today announced the final determination regarding the epistemic status of the claim commonly referred to as the Church-Turing Thesis. Following a mandated public-comment period and a comprehensive review of submitted briefs regarding the claim's categorization, the Bureau's Committee on Logical Infrastructure has issued a split-status ruling intended to resolve ongoing compliance discrepancies in grant applications and peer-review documentation.

  Acknowledging the persistent divergence in scholarly interpretation, the Committee has determined that the Thesis shall no longer be filed under a single uniform category. Instead, classification will depend on the operational context of the claim's usage. This decision addresses the recurring administrative difficulty wherein researchers treat the Thesis as a stipulative definition in theoretical contexts while simultaneously relying on it as a physical prediction in experimental contexts.

  The Bureau's review noted that while the equivalence of all authorized formalisms has been rigorously demonstrated, the linkage between these formalisms and the pre-formal notion of "step-by-step calculation" resists formal verification. Consequently, the Bureau finds that any proof of the Thesis would necessarily presuppose the very mapping it intends to justify. Furthermore, while no counterexamples have been observed in the physical world, the absence of disconfirming instances constitutes inductive support rather than deductive certainty.

  To ensure regulatory clarity, the Thesis is hereby assigned the following dual status, effective the start of the next fiscal quarter:

  | Operational Context | IBFS Classification Code | Compliance Requirement |
  | :--- | :--- | :--- |
  | **Internal Formalism** | **DEFINITION (Type IV)** | Mandatory usage in syntax proofs; no empirical justification required. |
  | **Physical Implementation** | **EMPIRICAL HYPOTHESIS (Class B)** | Must be cited as falsifiable; funding contingent on risk assessment. |
  | **Pedagogical Instruction** | **HEURISTIC (Green)** | Permitted for introductory simplification; must include disclaimer. |

  Researchers are advised that continuing to cite the Thesis as a **Theorem** in contexts involving physical computability will result in the immediate suspension of computational grants. Conversely, treating the Thesis as merely **Empirical** within pure logic sections will be flagged as a category error during audit. The Bureau recognizes that this distinction requires careful navigation of the boundary between conceptual stipulation and worldly fact, but maintains that proper form selection mitigates the risk of conceptual drift.

  Compliance officers will begin spot-checks on submitted manuscripts thirty days following the effective date. Researchers found utilizing the wrong stamp must file Form 88-B (Request for Epistemic Reclassification) within ten business days. The Bureau emphasizes that this ruling does not validate the claim itself, but rather standardizes the manner in which its uncertainty is documented.

  Regarding the decision, Dr. Aris Thorne, a Senior Fellow at the Institute for Symbolic Compliance and a participant in the review panel, offered the following statement:

  "While the circularity inherent in bounding the informal by the formal remains conceptually unresolved, the Bureau's ruling provides a necessary administrative container. We have essentially agreed to treat the Thesis as a definition when it suits our coherence and a hypothesis when it suits our funding. It is a pragmatic solution to a problem that logic alone could not close. We trust the community will find this compartmentalization acceptable, provided no one looks too closely at the seam between the two."

  The IBFS reminds all stakeholders that the goal of foundational standards is not truth, but interoperability. Full text of the determination, including the revised stamping guidelines, is available on the Bureau portal.

