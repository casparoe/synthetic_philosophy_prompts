prompt: |-
  My friend and I just spent like three hours arguing about the Historikerstreit — you know, that fight among West German historians in the mid-80s, where Nolte and Hillgruber started arguing that the Nazi genocide wasn't unique, that it could be lined up against Soviet crimes and even explained as a reaction to them, and Habermas came back that this was just a normalization of the Nazi past dressed up as objective scholarship. I want you to run that whole episode through the objectivity question in the philosophy of history. Ranke's ideal was that the historian just shows how it actually was and gets himself out of the way; Carr says the historian is always selecting and interpreting from where he stands in the present; White says the historian is basically doing literary work, imposing a plot on events that don't come with one. So map it for me: were Nolte and Habermas both just offering emplotted narratives, so that Habermas's attack is itself a story with a villain? Or does the episode cut the other way, where the moral stakes are exactly what made some claims checkable and some of them just false, which would vindicate something closer to Ranke? Go both directions — what the theory explains about the fight, and what the fight shows about whether the theory holds up.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The *Historikerstreit* (Historians' Dispute) of the mid-1980s in West Germany.
