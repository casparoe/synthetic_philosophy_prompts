      *   *Habermas:* Argued this was apologetics. The Holocaust *is* unique (civilizational break). Comparing it to Soviet crimes relativizes German guilt. Goal: Maintain "constitutional patriotism," critical engagement with the past, preventing neo-nationalism.

  3.  **Apply Philosophical Frameworks (Direction 1: Theory Explaining the Fight):**
      *   *Ranke:* Both sides claimed to be Rankean. Nolte claimed archival discovery (causal links). Habermas claimed moral facts are historical facts. But Ranke's "elimination of self" is impossible here. The political present is too loud.
      *   *Carr:* Perfect fit. Carr says history is a dialogue between past and present. Nolte's "present" was 1980s Cold War ending, desire for normal nationhood. Habermas's "present" was Post-68 democracy, fear of resurgent nationalism. The dispute *is* the clash of presents.
      *   *White:* Strong fit. Nolte emplotted the Nazi era as a *tragedy* or *romance* (Germany defending Europe from Bolshevism). Habermas emplotted it as a *cautionary tale* or *satire* of normalization attempts. White would say Habermas calling Nolte "false" is actually a moral/aesthetic judgment, not just empirical. Habermas's attack *is* a narrative with villains (the revisionists).

