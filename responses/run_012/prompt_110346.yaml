      *   *The Limit of Ranke:* Ranke thinks facts speak for themselves. But the *selection* of facts (Gulag vs. Gas Chambers) is political. However, the *falsifiability* of Nolte's causal chain suggests a Rankean constraint exists. You can't just plot anything; the archives push back.
      *   *Moral Stakes as Epistemic Constraints:* Habermas argues that moral truth is part of historical truth in this case. If you minimize genocide, you aren't just telling a different story; you're lying. This challenges White's separation of fact and narrative.

