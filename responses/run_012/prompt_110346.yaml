answer: |-
  This is a fantastic case study because the *Historikerstreit* (Historians' Dispute) is essentially the Philosophy of History enacted in real time, with high political stakes. You and your friend have stumbled onto the central tension of the discipline: Is history a science of facts (Ranke), a dialogue with the present (Carr), or a literary construction (White)?

  Here is the map of the *Historikerstreit* through the lens of objectivity, running the theory over the event, and then running the event over the theory.

  ### 1. The Theory Explaining the Fight: Carr and White Vindicated
  If you look at the dispute through **E.H. Carr** and **Hayden White**, the *Historikerstreit* looks less like a search for truth and more like a clash of competing presentisms and narrative structures.

  **Carr: The Present Determines the Past**
  Carr argued in *What Is History?* that the historian selects facts based on the questions of their own time. There is no "objective" past independent of the historian's social context.
  *   **Nolte's Present:** By the mid-80s, a generation of Germans wanted to "normalize" their national identity. They wanted to be able to feel pride in German history without the shadow of Auschwitz permanently disabling national sovereignty. Nolte's argument (that the Holocaust was a reaction to the Bolshevik threat) serves this present need. It contextualizes the crime to make it manageable.
  *   **Habermas's Present:** Habermas represents the post-1968 critical consensus. For him, West German democracy is built *on* the critique of the Nazi past. To normalize the past is to threaten the foundations of the Federal Republic.
  *   **The Verdict:** Carr would say neither side is "objective." Both are using the past to fight a battle in the 1980s. The "facts" they select (the Gulag for Nolte, the Gas Chambers for Habermas) are selected because of where they stand in the present.

  **White: Emplotment and the "Villain"**
  Hayden White's *Metahistory* takes this further. He argues that events don't come with their own plots; the historian imposes a plot (romance, tragedy, comedy, satire) through linguistic tropes.
  *   **Nolte's Emplotment:** Nolte emplotted the Nazi era as a **Tragedy** or even a **Romance** of defense. By linking Auschwitz to the Gulag via analogy, he creates a narrative where Germany is a victim of historical forces (Bolshevism) as much as a perpetrator.
  *   **Habermas's Emplotment:** Habermas emplotted the dispute as a **Moral Drama**. He cast the revisionists as attempting a "second forgetting."
  *   **Is Habermas's Attack Just a Story?** From a strict Whitean perspective, **yes.** When Habermas accuses Nolte of "apologetics," he is imposing a moral plot onto Nolte's scholarship. He casts Nolte as the *villain* in the story of German democracy. White would argue that Habermas's claim that the Holocaust is "unique" is not an empirical fact discoverable in the archives, but a *moral aesthetic* choice. It is a decision to treat the event as a sublime rupture that resists comparison.
  *   **The Verdict:** If White is right, the *Historikerstreit* proves that objectivity is an illusion. It was a fight over which narrative serves the moral needs of the Federal Republic, disguised as a fight about archival evidence.

  ### 2. The Fight Testing the Theory: Ranke and the Limits of Construction
  However, if you look at how the dispute actually *resolved* within the historical profession, the *Historikerstreit* pushes back against radical constructivism (White) and suggests a modified Rankean realism still holds weight.

  **The Rankean Pushback: Brute Facts**
  Leopold von Ranke's ideal (*wie es eigentlich gewesen* — "how it actually was") is often dismissed as naive. But the *Historikerstreit* showed that the past pushes back.
  *   **Nolte's Causal Claim:** Nolte didn't just offer a metaphor; he made a specific causal claim: that the Nazi genocide was a *reaction* to the Bolshevik threat (specifically citing a supposed link between the Gulag and Auschwitz).
  *   **The Empirical Check:** Other historians checked the archives. They found no evidence that Hitler ordered the Final Solution *because* of the Gulag. The timeline didn't match; the documents didn't exist.
  *   **The Verdict:** Here, White's theory strains. If history were *purely* emplotment, Nolte's narrative would be just as valid as his critics', provided it was coherent. But it was rejected not just because it was morally uncomfortable, but because it was **empirically false.** The archives exerted a "Rankean constraint." You cannot emplot the past in a way that contradicts the documentary record without losing your status as a historian.

  **Moral Stakes as Epistemic Constraints**
  This is where Habermas offers a twist on Ranke. Habermas argues that in the case of genocide, **moral truth is a condition of historical truth.**
  *   If a historian minimizes the suffering of victims to create a "balanced" narrative, they aren't just being immoral; they are being *unhistorical*. They are failing to describe "how it actually was" because the *experience* of the victims is part of the reality of the event.
  *   **Vindicating a Modified Ranke:** This suggests that objectivity isn't about the historian removing themselves (Ranke's original error); it's about the historian being accountable to the evidence *and* the human reality of the subjects. Nolte failed not just morally, but epistemically, because his "objectivity" required ignoring the specific intent of the perpetrators and the specific suffering of the victims.

  ### 3. Synthesis: What the *Historikerstreit* Tells Us About Objectivity

  So, who wins? The episode suggests a synthesis that might settle your argument.

  **1. Theory explains the motivation (Carr/White):**
  The *reason* the fight happened was Carr/Whitean. Nolte and Habermas were driven by present-day political concerns (Normalization vs. Constitutional Patriotism). Habermas's attack *was* a narrative with a villain. He was protecting a specific story about German identity. In this sense, there is no "view from nowhere."

  **2. The Fight constrains the theory (Ranke/Realism):**
  However, the *outcome* of the fight was Rankean. Nolte lost primarily because his specific causal claims could not be sustained by evidence. This vindicates the idea that while narratives are constructed, they are constructed out of materials that have their own hardness. You can't build a house out of water. The "uniqueness" of the Holocaust isn't just a literary trope; it refers to specific bureaucratic, industrial, and ideological mechanisms that are empirically distinct from Soviet purges.

  **3. The Verdict on Objectivity:**
  The *Historikerstreit* suggests that **Objectivity is not Neutrality.**
  *   **Ranke was wrong** that the historian can get out of the way. Habermas was right that pretending to "normalize" is itself a political act.
  *   **White was half-right** that history is a narrative, but wrong that *any* narrative is permissible. The moral stakes made some claims checkable. By attempting to relativize the Holocaust, Nolte made claims that were vulnerable to empirical falsification.
  *   **Carr was right** that history is a dialogue between past and present, but the past gets a vote.

  **For your argument:**
  If your friend argues that Habermas was just imposing a moral story, they are channeling **Hayden White**. They are correct that Habermas was protecting a narrative of German identity.
  If you argue that Nolte was objectively wrong and Habermas was defending the facts, you are channeling a **Critical Rankeanism**. You are correct that Nolte's causal claims failed the evidentiary test.

  The *Historikerstreit* ultimately shows that **objectivity in history is intersubjective accountability.** It's not about having no perspective (Ranke); it's about having a perspective that can survive the scrutiny of evidence (Ranke) and the moral scrutiny of the public sphere (Habermas). Nolte failed on both counts: his evidence was thin, and his moral framing was deemed dangerous to the democracy.

  So, the theory explains why they fought (competing narratives/presents), but the fight shows the limits of the theory (some narratives break against the rocks of reality).
