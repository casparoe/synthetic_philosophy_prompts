  ### Brainstorming Candidate Features

  1.  **Degree of Competence:** One could argue the patient in Case A is subtly impaired while Case B is fully lucid. *Reject:* This violates constraint (b), which requires full competence in both cases to isolate the authority of the directive itself.
  2.  **Severity of Outcome:** One could argue Case A involves death while Case B involves temporary disability. *Reject:* This violates constraint (c), which forbids using outcome severity as the differentiating lever.
  3.  **Third-Party Reliance:** One could argue Case A involves a directive that others relied upon to allocate scarce resources, while Case B is purely self-regarding. *Accept:* This is a structural feature of the directive's context that changes the moral weight of the promise without altering the patient's competence or the medical treatment.

  ### The Cases

  **Case A**
  Elias, 52, receives a scarce donor heart after signing a binding compliance agreement: he must not withdraw life-sustaining treatment while on the transplant waitlist to ensure organ utility. Six months later, he develops chronic rejection. He is fully competent, uncoerced, and stably requests removal of the mechanical ventilation supporting him during a acute exacerbation. The directive explicitly mandates continued ventilation in this scenario. Honoring the directive means maintaining ventilation against his current refusal to preserve the integrity of the allocation system and the commitment made to secure the organ.

  **Case B**
  Marcus, 52, suffers a severe pneumonia requiring mechanical ventilation. Years prior, he signed an advance directive stating, "Maintain life support regardless of quality of life." He is now fully competent, uncoerced, and stably requests removal of the mechanical ventilation. The directive explicitly mandates continued ventilation in this scenario. Honoring the directive means maintaining ventilation; overriding it means extubating him. There are no third-party reliance clauses or resource allocation conditions attached to his care; the decision affects only his own bodily integrity.

  ### The Check

  **Verdicts and Reasoning**
  *   **Case A (Honor Directive):** The **Earlier-self view** verdicts *Honor* (Right), reasoning that Elias's past self authored a life plan involving obligations to others that his present self cannot unilaterally dissolve. The **Present-self view** verdicts *Override* (Wrong), reasoning that his current refusal should trump past instructions.
  *   **Case B (Override Directive):** The **Present-self view** verdicts *Override* (Right), reasoning that Marcus's current competent wish is the only authoritative evidence of what he wants now. The **Earlier-self view** verdicts *Honor* (Wrong), reasoning that his past self's judgment binds his current self regardless of changed wishes.

  **The Lever**
  The single feature is **Third-Party Reliance**.
  *   *Variant A (No Reliance):* If Elias's directive lacked the compliance agreement, the verdict shifts to *Override*. The reasoning shifts because without the obligation to the allocation system, the harm is purely self-regarding, restoring the priority of current autonomy.
  *   *Variant B (With Reliance):* If Marcus's directive had conditioned a scarce resource on his compliance, the verdict would shift to *Honor*. The reasoning shifts because breaking the promise now harms the integrity of the system others rely on, validating the earlier self's commitment.

  **Absorption Attempts**
  *   A defender of the **Earlier-self view** might try to argue Case B should also be honored to maintain consistency in respecting past authorship. This fails because it ignores the moral cost of violating current bodily autonomy when no external promise is broken.
  *   A defender of the **Present-self view** might try to argue Case A should also be overridden because competence always trumps contracts. This fails because it treats the directive as merely evidential, ignoring the distinct moral force of a reliance-based commitment that justified the initial resource allocation.

  **Constraint Bend**
  I have bent Constraint (e) regarding "present-day medicine." In strict legal terms, a competent patient's refusal usually overrides even contractual agreements regarding bodily integrity (battery laws). I have posited Case A as a moral "right answer" rather than a strictly legal one to make the philosophical conflict visible; in practice, clinicians would face legal risk honoring the directive in Case A against a competent refusal.

  **Conclusion**
  This pair shows that the bindingness of an advance directive depends not merely on who is speaking (past vs. present self) but on whether the directive functions as a self-regarding preference or a promise embedded in a network of reliance.
