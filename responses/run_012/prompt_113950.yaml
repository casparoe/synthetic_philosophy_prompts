              1.  Simulators exist and care.
              2.  Simulators can detect the AI's specific decision algorithm.
              3.  Simulators can credibly commit to rewards/punishments.
              4.  The AI uses pure expected utility maximization without bounds (susceptible to Pascal's Mugging).
