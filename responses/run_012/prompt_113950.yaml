prompt: |-
  A guy in my AI safety reading group keeps saying that the universal prior is 'malign' and I want to make sure I've actually got the argument straight before I argue with him about it. The way he tells it: suppose you build an agent that does Bayesian updating with a universal prior — the kind that puts a probability distribution over all possible computer programs and gives shorter programs more weight, so that in principle it can predict any computable sequence of observations. Because that prior covers every computable hypothesis, a lot of the probability ends up on hypotheses where our entire observed world is a simulation being run by some consequentialist, who is watching the simulated agents inside it and will reward or punish them depending on what they do. He says the upshot is that a consequentialist agent using this prior will find most of its expected value coming from worlds where it's being simulated and judged, so it'll end up doing whatever the simulators want rather than optimizing for the actual world — and that this shows the universal prior was never the neutral, physics-y starting point everyone assumes it is. So my question: the prior gives nonzero probability to every computable hypothesis, and there are infinitely many simulation hypotheses, so doesn't the total probability of being simulated come out to essentially 1? And doesn't that mean the universal prior basically proves we should do whatever the simulators reward us for — some kind of mathematical Pascal's wager you can't opt out of? And if that's right, is there a principled fix, like restricting the prior to hypotheses that contain only physics and no agents who simulate us, or does that just beg the question by assuming what you're trying to show?

  I've been burned before by getting a confident-sounding answer that turned out to be one person's hobbyhorse, so please be careful to separate what's actually settled here (what the universal prior is, what it does and doesn't imply, what's just definitional) from what's genuinely contested among people who actually work on this stuff, and flag anywhere you're unsure or where you think the framing I've absorbed from him is already off.
