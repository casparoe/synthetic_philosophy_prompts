answer: |-
  ### 1. Order of Components and Dependencies

  You must build the argument in four distinct layers. Each layer relies on the previous one being accepted as a premise. Do not skip steps.

  1.  **Definition of "Code" (The Mapping Rule):**
      *   *Dependency:* None. This is the axiom.
      *   *Content:* A code is a rule for mapping symbols from one domain to another. Crucially, the rule is **arbitrary** (not determined by physics/chemistry of the symbols) and requires a **decoder** (mechanism) to function.
      *   *Why first:* You cannot discuss genetic information until you agree on what "information" means in this context. If you start with biology, the Humanists will hear "determinism" and the Biologists will hear "molecular fact," and they will talk past each other.

  2.  **Application to Biology (The Codon Table):**
      *   *Dependency:* Requires Layer 1 (Code = Arbitrary Mapping).
      *   *Content:* The DNA-Protein relationship fits Layer 1. The nucleotides do not chemically bond to amino acids based on affinity; they are matched by tRNA adaptors according to a rule.
      *   *Why second:* This validates the Biologists' "textbook" view but reframes it in the Humanists' terms (convention rather than law).

  3.  **Separation of Code from Causation (The Decoder's Work):**
      *   *Dependency:* Requires Layer 2 (Biology uses a Code).
      *   *Content:* The code *specifies* order; the cellular machinery *causes* construction. The map is not the territory.
      *   *Why third:* This addresses the Humanists' fear of determinism. It allows you to say "Yes, it is information" without saying "Yes, it determines the outcome alone."

  4.  **Localization of Information (The System):**
      *   *Dependency:* Requires Layer 3 (Code $\neq$ Cause).
      *   *Content:* Information is a property of the *system* (DNA + Machinery + Environment), not a substance inside the DNA.
      *   *Why fourth:* This is the synthesis. It allows the Biologists to keep the mechanism and the Humanists to deny the reductionism.

  **The Keystone Component:**
  The entire session hangs from **Layer 1: The definition of a code as an arbitrary mapping rule requiring a decoder.**
  If the students do not agree that a "code" implies *arbitrariness* and a *decoder*, they will revert to "DNA is a blueprint" (determinism) or "Information is a metaphor" (dismissal). Every subsequent argument relies on this definition holding firm.

  ### 2. The One Example: Evaluate the Blueprint-versus-Recipe

  **Verdict:** Your assumption is **wrong** for the specific goal of defining "code."
  The Blueprint-versus-Recipe contrast is excellent for discussing *development* and *determinism* (Layer 3), but it is poor for defining *information* (Layer 1). A blueprint implies spatial isomorphism (the plan looks like the building), which DNA does not have. A recipe implies ingredients, which conflates the message with the matter.

  **The Correct Example:** **The Cipher Key (or Translation Dictionary).**
  Use the **Codon Table itself** as the primary example, analyzed as a cipher key.

  *   **What it must have:** It must show a mapping between two unrelated domains (letters/nucleotides $\to$ words/amino acids). It must show that the mapping is fixed by convention, not chemistry.
  *   **What it must lack:** It must lack *causal power*. Emphasize that a dictionary does not write the novel; a cipher key does not build the bomb. It only allows the translation.
  *   **Why:** This isolates the concept of "information" from "cause." It allows the Biologists to say "The mapping is real" and the Humanists to say "The mapping is contingent."

  *Instruction:* Use Blueprint/Recipe only in Layer 3 to explain why the code doesn't build the organism alone. Use Cipher/Dictionary in Layers 1 and 2 to explain what the code *is*.

  ### 3. Misconceptions: Head Off vs. Let Run

  **Your Guess:**
  1.  "The code is only a metaphor."
  2.  "Once they see the mapping is arbitrary, they will conclude the content is arbitrary."

  **Assessment:**
  *   **Guess 1 is partially right but misdiagnosed.** The Humanists won't say it's *only* a metaphor to dismiss it; they will say it's a metaphor to imply it's *ideological*. Do not head this off. **Let this objection run.** It is the entry point for Material 3 (Students' Suspicion). If you squash it, you lose the Humanists.
  *   **Guess 2 is the critical one.** This is the trap. If the code is arbitrary (UGA *could* mean Stop), why isn't the organism arbitrary?
  *   **The Real Misconception:** **"Information implies a Sender/Intender" (Teleology).**
      Both groups secretly assume that "code" implies someone *wrote* it. The Biologists suppress this; the Humanists exploit it.
      *   **Where to head it off:** In Layer 1. When defining "Code," explicitly state: "In information theory, a code requires a decoder, not a designer."
      *   **Where to let objections run:** In Layer 3 (Causation). Let the Humanists argue determinism. Let the Biologists argue mechanism. Use the Prion example (Material 2) to force the collision.

  ### 4. Placement of the Three Materials

  **Material 1: Variant Genetic Codes (Mitochondria/UGA)**
  *   **Placement:** **Layer 2 (Application to Biology).**
  *   **Work it is doing:** This is the empirical proof of **Arbitrariness**.
  *   **Instruction:** Do not present this as a "fun fact" or exception. Present it as the *rule* that proves the code is a convention. If UGA is Stop in the nucleus but Tryptophan in the mitochondrion, the chemical structure of UGA does not dictate the meaning. The *context* (the decoder) dictates the meaning. This fixes the notion of arbitrariness: the *mapping* is arbitrary, but once fixed, it is rigid.

  **Material 2: Prions / Yeast Protein Conformations**
  *   **Placement:** **Layer 4 (Localization of Information).**
  *   **Work it is doing:** This forces the relocation of "information" from the *molecule* to the *system*.
  *   **Instruction:** Use this after the Determinism debate (Layer 3). Ask: "If the DNA sequence is identical, but the trait is inherited, where is the instruction?" The answer cannot be "in the DNA sequence." It must be "in the cellular context." This validates the Humanist suspicion (DNA isn't everything) without invalidating the Biologist's mechanism (inheritance is still physical).

  **Material 3: Students' Suspicion (Ideological Work)**
  *   **Placement:** **Layer 3 (Separation of Code from Causation).**
  *   **Work it is doing:** Treat this as a **Position with a Price.**
  *   **Instruction:** Do not correct them. Say: "You are worried that calling DNA 'information' grants it too much power. You are right. That is the price of the metaphor."
      *   *The Price:* If you deny DNA carries information, you lose the ability to explain specificity (why a dog makes a dog). If you affirm it, you must deny it acts alone.
      *   Force them to pay the price: They must accept "information" exists but deny it is "deterministic."

  ### 5. Check for Understanding

  **The Question:**
  "In the mitochondrial case, UGA codes for Tryptophan. In the nucleus, it codes for Stop. Does the *meaning* of UGA reside in the nucleotide, or in the tRNA machinery?"

  **The Distinguishing Answer:**
  *   **Grasped:** "It resides in the machinery/decoder. The nucleotide is just the symbol. The meaning is a function of the system." (This shows they understand Layer 1 and 2).
  *   **Merely Suspicious:** "It shows DNA is unreliable" or "It shows the code is broken." (This shows they haven't grasped the definition of a code).
  *   **Merely Textbook:** "It's a mutation." (This shows they missed the arbitrariness point).

  ### 6. Open Questions (Refuse to Settle)

  You must explicitly state that the following are **out of bounds** for this session. Write these on the board and circle them.

  1.  **The Origin of the Code:** How the mapping arose (Evolution vs. Design). This triggers the Teleology trap.
  2.  **The Extension to Society:** Whether "cultural information" works the same way. This triggers the reductionism trap.
  3.  **The Definition of Life:** Whether prions count as "alive." This triggers semantic drift.

  *Instruction:* Say: "We are analyzing the *structure* of the claim 'DNA contains information,' not the history of the code or its sociological application. If you raise these, I will park them."

  ### 7. Meta-Analysis: Metaphors vs. Technical Claims in This Plan

  When you deliver this plan, you must distinguish your own language. Below are the sentences from *this plan* that you must flag as metaphors when you speak them, versus those that are technical claims.

  **Metaphors (Flag these explicitly as analogies):**
  *   "The keystone component." (Architecture metaphor).
  *   "Head off misconceptions." (Traffic/Conflict metaphor).
  *   "Let objections run." (Fluid/Animal metaphor).
  *   "The trap." (Hunting metaphor).
  *   "Pay the price." (Economic metaphor).
  *   "Out of bounds." (Sports metaphor).
  *   "Bridge between Humanist and Biologist." (Construction metaphor).
  *   "Squash it." (Physical force metaphor).

  **Technical Claims (These survive the metaphor being dropped):**
  *   "A code is a rule for mapping symbols from one domain to another."
  *   "The nucleotides do not chemically bond to amino acids based on affinity."
  *   "In vertebrate mitochondria the codon UGA... is instead read as tryptophan."
  *   "Some traits are inherited with no change in nucleic acid sequence."
  *   "Information is a property of the system (DNA + Machinery + Environment)."
  *   "The mapping is arbitrary, but once fixed, it is rigid."

  **Instruction for Delivery:** When you use the "Metaphor" sentences in the room, preface them: "To use a metaphor..." or "Structurally speaking..." When you use the "Technical" sentences, state them as propositions to be tested. This models the very distinction you are teaching.
