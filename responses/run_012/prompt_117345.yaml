answer: |-
  This scorecard offers a rigorous heuristic for disentangling rhetorical flourish from material discontinuity. By quantifying loss across five distinct axes, we can compare disparate historical trajectories without flattening their specificities. Below, I apply the metric to your four cases, adhering to the constraint that 0 signifies continuity and 1 signifies total loss.

  **Late Bronze Age Eastern Mediterranean (c. 1200 BCE)**
  (i) Settlement/Demography: 0.8. (ii) Political Integration: 0.9. (iii) Connectivity: 0.7. (iv) Administrative/Symbolic: 0.8. (v) Ritual/Cosmological: 0.6.
  The most distinctive score here is Political Integration (0.9), driven by the total dissolution of the Hittite Empire and the retreat of Egyptian authority from the Levant, leaving a vacuum of supra-regional power. While local shrines persisted, the palace-centric cultic systems vanished. I must flag the Ritual/Cosmological axis; archaeological access to belief systems is inherently thin, making this number a provisional inference based on the abandonment of temple complexes rather than direct evidence of theological change.

  **Terminal Classic Maya Lowlands (c. 900 CE)**
  (i) Settlement/Demography: 0.7. (ii) Political Integration: 0.8. (iii) Connectivity: 0.5. (iv) Administrative/Symbolic: 0.9. (v) Ritual/Cosmological: 0.7.
  The Administrative/Symbolic axis scores highest (0.9), driven by the cessation of the Long Count calendar and the discontinuation of stelae erection, marking the end of divine kingship's public record. Connectivity is flagged as evidentially thin; while obsidian sources shift, measuring the volume of trade in a jungle environment relies on sparse artefact distributions, so the 0.5 reflects significant uncertainty regarding the persistence of informal exchange networks.

  **Rapa Nui (Pre-contact to Contact)**
  (i) Settlement/Demography: 0.6. (ii) Political Integration: 0.5. (iii) Connectivity: 0.3. (iv) Administrative/Symbolic: 0.8. (v) Ritual/Cosmological: 0.7.
  The Ritual/Cosmological infrastructure (0.7) is the most distinctive, driven by the shift from the *moai* ancestor cult to the Birdman cult, indicating a fundamental reordering of spiritual authority without total depopulation. I flag the Connectivity axis (0.3); given the island's isolation, measuring changes in external exchange is nearly impossible, and internal exchange patterns are poorly dated, making any score here highly speculative.

  **Western Roman Empire (5th–6th Centuries)**
  (i) Settlement/Demography: 0.4. (ii) Political Integration: 0.6. (iii) Connectivity: 0.5. (iv) Administrative/Symbolic: 0.5. (v) Ritual/Cosmological: 0.3.
  Political Integration (0.6) is the most distinctive, driven by the removal of the Emperor in the West, though successor kingdoms retained Roman administrative habits. The Settlement/Demography axis is flagged for thin evidence; urban decline was stark in Britain but negligible in North Africa, so a single aggregate number obscures profound regional variance that the data cannot fully resolve.

  **Aggregation and Ranking**
  To generate a single collapse score, I employ a simple arithmetic mean of the five axes. This rule treats each dimension of social complexity as equally weighted, avoiding the assumption that political loss matters more than demographic loss.
  *   Late Bronze Age: 0.76
  *   Terminal Classic Maya: 0.72
  *   Rapa Nui: 0.58
  *   Western Roman Empire: 0.46

  The ranking, from most severe collapse to least, is: Late Bronze Age, Terminal Classic Maya, Rapa Nui, Western Roman Empire. The Bronze Age and Maya cases are close enough that, given the margin of error in archaeological dating, they might effectively be tied as high-intensity collapse events. Rome sits distinctly lower, suggesting transformation rather than systemic failure.

  **Baseline Dependency**
  The stability of these classifications relies heavily on where one draws the starting line. I assign a dependency figure (0–1) to each, where 1 indicates the score changes drastically if the baseline century shifts.
  *   Late Bronze Age: 0.3. The break is sharp; comparing 1250 BCE to 1150 BCE yields similar results regardless of the specific decade.
  *   Terminal Classic Maya: 0.4. Abandonment was diachronic; starting in 800 CE versus 850 CE alters the demographic score significantly.
  *   Rapa Nui: 0.5. Dating the transition from *moai* to Birdman is contentious; shifting the baseline by a century could halve the collapse score.
  *   Western Roman Empire: 0.6. This is highly sensitive; comparing 400 CE to 500 CE shows collapse, but 300 CE to 500 CE shows continuity of law and church.

  **Verdict on Collapse as a Natural Kind**
  Does collapse pick out a natural kind of historical process, or is it a category imposed by the observer? My verdict is that 'collapse' is predominantly an observer-imposed category, though it tracks real material correlates. The scorecard demonstrates that 'collapse' is not a singular event but a vector of different losses. A society can lose its kings (Rome) without losing its people, or lose its people (Maya) without losing all its cultural practices. To label these diverse trajectories under one noun reifies a complex multivariate process into a singular substance.

  However, the clustering of high scores in the LBA and Maya cases suggests there is a phenomenon worth naming. When political integration, administrative capacity, and demographic density fail concurrently, the system loses its ability to reproduce itself in its previous form. This concurrency is the 'natural' element. Yet, the threshold for what counts as concurrent failure is determined by the observer's definition of 'society'. If we define society by its state apparatus, Rome collapsed. If we define it by its peasant agriculture and Christian faith, Rome persisted. Therefore, collapse is not a natural kind like 'gold' or 'water', which possess intrinsic atomic structures independent of human description. It is more akin to 'climate' or 'ecosystem': real patterns exist, but the boundaries are drawn by the observer's analytical framework.

  The utility of the term lies not in its ontological precision but in its heuristic power. It forces us to ask what constitutes the essence of a civilisation. Is it the monument or the mason? The king or the kinship network? By treating collapse as an observer category, we acknowledge that the 'end' of a society is often just the end of a specific mode of domination or record-keeping. The scorecard helps us see that while the superstructure may vanish (scoring near 1), the infrastructure often persists (scoring near 0). Thus, collapse is best understood as a specific type of simplification, rather than an extinction. It is a real process of complex systems losing energy and capacity, but the label 'collapse' remains a judgement call on whether that simplification constitutes a terminus or merely a transition.
