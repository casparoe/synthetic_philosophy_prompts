prompt: |-
  Okay, this is going to sound like a dumb group-chat argument, but I genuinely want the real answer and not the version you'd put on a poster. My flatmate thinks individual stuff is pointless — flying less, giving up beef, voting in a seat that's been safe for one party since before either of us was born — because one person changes nothing. And every time she says it, I hear myself say "well, every little bit helps", and she rolls her eyes and says that's just something people say so they don't have to think about it. Honestly, she might be right that I don't know what I'm actually claiming.

  So what I want is the full menu of distinct precise things "every little bit helps" could be claiming, from the ones that are true by definition up to the ones that are load-bearing philosophy, and for each: what it has to be true of causation and aggregation for it to work, whether it's actually plausible, and whether it answers her objection or quietly changes the subject. I can half-see three already — something about expected value and tiny probabilities of being the one who tips it, something about "what if everyone did it", and something that isn't about the outcome at all but about what kind of person I am or what I can be relied on to do. I don't know which of those are real positions and which are cope, and I suspect I've been sliding between them mid-sentence.

  Two things I especially want pinned down. First, is there a genuine difference between "my act makes a difference" and "my act is part of the difference", or is that just words? Second, when she says "one person changes nothing", which of the readings is she actually attacking? Because I think she's definately right about some of them and wrong about others, and I'd like to be able to say which instead of just getting annoyed.

  Also, if some reading only works when the world has thresholds or tipping points in it, say so and say what that commits me to, because that seems to be doing a lot of quiet work in these arguments.

  Don't finish by telling me what to do — I don't want a list of lifestyle tips. Just the menu with verdicts, and which reading was doing the work when I said it.
