  The stipulated Independence Criterion shifts the debate from intuitive appeals to structural mechanics. Applying it to the traveller case reveals that the dispute hinges not on whether knowledge occurs, but on how the causal route is individuated. The criterion forces a rigorous examination of whether *upamāna* possesses ontological independence or is merely a convenient label for a composite of other processes.

  Regarding Condition (i), both sides agree the traveller acquires a veridical cognition: she correctly identifies the *gavaya* in the wild. The cognition is reliable and true, satisfying the baseline requirement for a *pramāṇa*. Condition (ii) is where the reductionist first gains significant traction. They argue this cognition belongs to a class produced by testimony (*śabda*) combined with perception (*pratyakṣa*). The guide's instruction provides the conceptual content; the visual encounter provides the sensory data. The Nyāya defender counters that the specific cognition—linking a name to an object via similarity—is not produced by testimony alone, which lacks the visual component, nor perception alone, which lacks the naming convention. However, the reductionist replies that the combination is functionally equivalent to inference (*anumāna*): "The guide said 'gavaya' looks like a cow; this looks like a cow; therefore, this is a 'gavaya'." Thus, Condition (ii) is contested territory; the reductionist plausibly claims the class of cognitions is not exclusive to *upamāna*, as inference can reconstruct the link.

  Condition (iii) does the real work in adjudicating the dispute. It demands a distinctive instrument (*karaṇa*), not merely a distinctive occasion. The reductionist argues the instrument is memory of testimony plus visual perception. The occasion is unique, but the instruments are borrowed from admitted sources. The Nyāya defender must argue that the knowledge of similarity (*sādṛśya-jñāna*) is a sui generis causal power. If similarity-recognition is merely a complex form of inference or perception, Condition (iii) fails. If it is a primitive cognitive capacity to map relations of resemblance independently of deductive rules, Condition (iii) holds. The criterion favours the Nyāya defender only if one accepts that resemblance operates as a distinct causal route rather than a derivative processing of sensory data. This condition is decisive because Conditions (i) and (ii) can be manipulated by broadening or narrowing the description of the cognition class, whereas the *karaṇa* requires a metaphysical claim about cognitive architecture. To satisfy (iii), Nyāya must show that the causal chain involves a step that inference cannot replicate, namely the immediate grasping of similarity without a middle term.

  The reductionist gets something crucial right: *upamāna* is deeply entangled with testimony and inference. In the traveller case, without the guide's testimony, the visual perception yields no name; without the perception, the testimony yields no reference. The reductionist correctly identifies that *upamāna* lacks obvious autonomy in practice. However, they may underestimate the cognitive specificity of recognizing resemblance, which feels distinct from deductive inference. Yet, under a strict reading of Condition (iii), the reductionist gains more because they require fewer ontological commitments.

  Applying this criterion consistently threatens *śabda* (testimony) more than *upamāna*. If *upamāna* is reducible because it relies on testimony, *śabda* might be reducible to inference about the speaker's reliability and competence. If the instrument for testimony is merely hearing words plus inferring truthfulness, it lacks a distinctive *karaṇa* separate from inference. Many reductionists argue *śabda* is just inference from the speaker's credibility. Perception and inference remain secure: perception's instrument is sensory contact (*indriya-sannikarṣa*), and inference's is the knowledge of pervasion (*vyāpti*), both clearly distinct causal routes that do not rely on combining other sources. Thus, the criterion is a double-edged sword. It pressures *upamāna*, but it potentially dismantles *śabda* unless one grants linguistic comprehension a unique instrumental status. Ultimately, the criterion forces the Nyāya defender to commit to a robust realism about cognitive instruments: if similarity and linguistic understanding are primitive causal powers, *upamāna* and *śabda* survive. If not, the reductionist wins by parsimony, reducing the four sources to two.

