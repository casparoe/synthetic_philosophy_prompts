answer: |-
  This is a precise and unsettling observation. You have identified a mechanism that is distinct from simple lying, simple delegation, or simple bureaucratic inertia. It is the **industrialization of moral distance.**

  There is no single canonical term that captures every nuance you described, but there are three strong candidates from political theory, sociology, and legal ethics that, when combined, map exactly onto the shape you've drawn.

  ### 1. The Existing Literature

  **A. Organized Irresponsibility (Ulrich Beck)**
  The sociologist Ulrich Beck, in his work on the *Risk Society*, coined the term **organized irresponsibility**. He argued that modern institutions are designed precisely to distribute causality so widely that no specific agent can be held liable for systemic harms.
  *   **Fit:** This captures the *structural* aspect. It acknowledges that the diffusion isn't an accident; it is how the organization functions to protect itself.
  *   **Limit:** Beck focuses mostly on corporate/environmental risk (e.g., pollution), not necessarily the deliberate political engineering of a specific "ugly" outcome.

  **B. Policy Laundering (Frank Pasquale)**
  Legal scholar Frank Pasquale uses the term **policy laundering**. Originally applied to algorithmic governance, it describes the process where a political principal hides their preference behind a "black box" of technical or bureaucratic procedure.
  *   **Fit:** This captures the *intent*. The structure exists to obscure the origin of the decision. The Minister "launders" the political will through a committee so it emerges as a "technical finding."
  *   **Limit:** It is often used in tech/finance contexts, though increasingly applied to public administration.

  **C. The Many Hands Problem (Engineered)**
  Political theorist Dennis Thompson identified the **"Problem of Many Hands,"** where responsibility is diluted because so many people contribute to an outcome.
  *   **Fit:** This is the standard description of the phenomenon you know.
  *   **Your Innovation:** You are describing **Engineered Many Hands**. Thompson usually treats this as a structural dilemma to be solved; you are identifying it as a *weapon* to be deployed.

  **D. Administrative Evil (Adams & Balfour)**
  In *Unmasking Administrative Evil*, Guy Adams and Danny Balfour argue that modern bureaucracy allows people to commit evil acts without perceiving them as evil, because the "mask" of procedure hides the moral content.
  *   **Fit:** This addresses your point about the actors believing their own story. They aren't lying; the structure has successfully masked the moral nature of the act from them, too.

  ---

  ### 2. A Proposed Term: "Responsibility Laundering"

  If you need a term for this specific *deliberate* architecture, **Responsibility Laundering** is the most precise fit, even if it is still emerging in literature. It distinguishes itself from "buck-passing" (which is reactive) by being *proactive and architectural*.

  **Definition:** *The deliberate construction of procedural intermediaries between political will and policy outcome, designed to convert a moral choice into an administrative necessity, thereby rendering accountability structurally impossible.*

  ---

  ### 3. Drawing the Edges

  Here is how this concept distinguishes itself from the neighbors you identified:

  **(a) vs. Dirty Hands (Walzer)**
  *   **Dirty Hands:** The leader *must* violate a moral norm to do the job, and *must accept the guilt* to remain a moral agent. The guilt is the receipt of the transaction.
  *   **Responsibility Laundering:** The leader violates the norm but *rejects the receipt*. The goal is to keep the hands clean. In Walzer's framework, this is actually worse than dirty hands; it is a corruption of the office because it denies the moral reality of the act.

  **(b) vs. Accidental Diffusion (The Many Hands)**
  *   **Accidental:** "We didn't realize the procurement process would lead to this." The diffusion is a side effect of complexity.
  *   **Deliberate:** "We designed the procurement process *because* it would lead to this." The diffusion is the primary function of the complexity.
  *   **Test:** If you simplified the process, would the outcome change? If yes, it was accidental bureaucracy. If the outcome remains but the blame sticks to the Minister, it was deliberate laundering.

  **(c) vs. Just Lying**
  *   **Lying:** "I did not order the hospital closure." (When they did). This is falsifiable.
  *   **Laundering:** "I did not order the closure; the Independent Review Board applied the statutory criteria and recommended it." This is technically true.
  *   **Philosophical distinction:** This is closer to Harry Frankfurt's concept of **Bullshit**. The liar cares about the truth (and hides it); the bullshitter (or launderer) is indifferent to the truth of their agency. They are constructing a narrative where their agency is irrelevant.

  **(d) vs. Legitimate Delegation**
  *   **Legitimate:** "I am not an expert on interest rates, so I will let the Central Bank decide." The delegation is based on *epistemic humility* and *long-term stability*.
  *   **Laundering:** "I want this specific hospital closed, but I don't want to be blamed, so I will create a committee with a mandate that makes closure the only mathematical outcome." The delegation is based on *moral avoidance*.

  ---

  ### 4. The Question of Belief (Bad Faith)

  You asked: *Does it matter whether the person actually believes their own story?*

  This is the most dangerous version. In Sartrean terms, this is **Institutional Bad Faith**.
  *   **The Cynic:** Knows it's a sham, uses it anyway. (Guilty of deception).
  *   **The True Believer:** Uses the structure to convince *themselves* they didn't do it. (Guilty of self-deception).

  The structure acts as a **moral crumple zone** (a term from tech ethics, Elisha 2020). Just as a car is designed to crush in a specific way to protect the passenger, this bureaucracy is designed to absorb moral blame in the "committee" layer to protect the "Minister" layer. If the Minister believes the committee was independent, the crumple zone has worked perfectly. The structure allows them to outsource their conscience.

  ---

  ### 5. Legitimate vs. Illegitimate Architecture

  This is the critical edge case. We *need* arm's-length bodies (Central Banks, Judicial Sentencing, Public Health Agencies) to prevent populism and corruption. How do we distinguish a **Guardrail** from a **Cut-out**?

  **1. Reversibility**
  *   **Legitimate:** The Minister *could* overturn the decision but chooses not to, respecting the body's independence.
  *   **Laundering:** The Minister *cannot* overturn the decision because the rules were written to make the outcome automatic, or the political cost of overturning it was rigged to be impossible.

  **2. Specificity of Mandate**
  *   **Legitimate:** The mandate is broad and principled ("Ensure financial stability").
  *   **Laundering:** The mandate is narrow and mechanistic ("Close all facilities with a utilization rate below 40%"). This turns a political value judgment (efficiency vs. access) into a mathematical inevitability.

  **3. Ex Post Justification**
  *   **Legitimate:** The Minister defends the *outcome* ("Closing the hospital was hard but necessary").
  *   **Laundering:** The Minister defends the *process* ("I cannot comment on the outcome, only that the process was independent").

  **4. The "One-Way Mirror" Test**
  *   **Legitimate:** The independent body has the power to say "No" to the Minister, and has done so in the past.
  *   **Laundering:** The body is staffed by loyalists, or the criteria are tuned so that it *only* ever produces the result the Minister wanted. It is independent in name, but a rubber stamp in function.

  ### Summary
  The phenomenon is **Organized Irresponsibility** executed through **Policy Laundering**.
  It differs from **Dirty Hands** because it seeks to evade the guilt, not bear it.
  It differs from **Bureaucratic Inertia** because the structure was *designed* for this outcome.
  It is distinct from **Lying** because it relies on technical truths to obscure causal agency.

  If you need a term to use in writing or argument, **Responsibility Laundering** is the most evocative and accurate neologism, but **Organized Irresponsibility** is the heavy academic artillery you can cite to show it's a recognized structural flaw. The specific moral wrong is not just the outcome, but the **corrosion of the link between power and accountability.**
