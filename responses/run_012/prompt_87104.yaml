answer: |-
  ### The Speech

  Good evening.

  It is a distinct privilege to stand here, though I must confess, looking out at this room, I feel slightly like an imposter. Half of you have spent thirty years dissecting the precise conditions under which knowledge changes. The other half are wondering if there is cheese left in the kitchen. My task is to speak to both groups without boring the scholars or confusing the spouses.

  We are gathered to mark one hundred years. In any other context, a centenary is a machine for generating inevitability. The standard speech writes itself: *In 1924, they had a vision. They planted a seed. And look, the tree has grown.* It is a comforting story. It suggests that the people in this room tonight were waiting to be born all along.

  But we are historians of science. We know better. We know that the past is not a queue leading to the present. It is a thicket. And if we are honest, this Society did not survive because it was destined to. It survived because it was stubborn.

  Consider the founders. In 1924, they did not launch this Society to facilitate the brilliant work you and I do today. They launched it to prove a theory. Their flagship project was a grand survey on the influence of climate on national scientific style. They believed, with total conviction, that the humidity in London produced different physics than the dry air of Cairo. They spent eleven years on this. They filled ledgers with data. And then, the world simply lost interest. The project fizzled. The theory was wrong.

  In a Whig history, we would leave that out. We would pretend they were trying to start a journal, or a network, or a legacy. But they weren't. They were chasing a ghost. And yet, here we are. The Society outlived its own original purpose. That is not destiny. That is luck.

  We have the minute book from those years. If you expect high theory, you will be disappointed. It is mostly fussing about whether the Edinburgh branch was entitled to send two delegates. One delegate? Three? It consumed pages. It consumed energy. It matters not at all to the history of science, but it matters immensely to the history of this room. Because while they were arguing about Edinburgh, they were keeping the lights on. They were showing up.

  There is a temptation to smooth over the rough patches. To say that we have grown wiser. I am not sure we have. We have just found new things to disagree about. Those of you who joined in the 1970s know that the split over the journal was not a polite divergence of opinion. It was a fracture. It is still, I am told, mildly sore. I will not pry at the scab tonight. But I will note that the Society did not survive because we agreed. It survived because, eventually, we decided to keep arguing under the same roof rather than build new ones.

  We commemorate our predecessors with portraits. I am told the hanging of my immediate predecessor's portrait is a matter of some delicacy. It is hung slightly too high. He looks down on us with a permanent expression of mild surprise, perhaps because he can only see the tops of our heads. I propose we leave it there. It is a perfect reminder that even when we try to honour the past, we get the measurements wrong. And the society endures anyway.

  So, what are we celebrating? We are not celebrating a triumph of progress. We are not celebrating the fact that we were right in 1924. We were not.

  We are celebrating continuity.

  The narrative I have just told you is dangerous. By standing at the end of the story, I make it sound like the end was the point. I have selected the failures that look charming and the arguments that we survived. I have left out the members who left in anger, the papers that were never published, the meetings where only three people showed up and ate all the biscuits.

  If things had gone the other way—if the climate project had succeeded, if the Edinburgh delegates had revolted, if the journal split had become a divorce—this room would be empty tonight. Or it would be full of a different group, telling a different story.

  The fact that it is us, here, now, is not a verdict on our quality. It is a testament to our persistence.

  To the spouses and sponsors: thank you for tolerating our obsession with the dead. To the colleagues: thank you for keeping the arguments alive. And to the Society: may we continue to be wrong about the future, but right about showing up for each other.

  Thank you.

  ***

  ### Note to Self: Historiographical Liberties & Consensus

  **1. The "Climate Project" Narrative**
  *   **Settled:** It is fact that the founders prioritized a survey on climate and national style and that it consumed the first decade without producing a definitive, accepted result.
  *   **Liberty:** I am framing the "fizzle" as a total abandonment of the premise. In reality, some members likely continued to believe in environmental determinism privately for decades. I am flattening this to make the point about *institutional* survival despite *intellectual* failure.
  *   **Risk:** A specialist in 1920s environmental determinism might argue the project influenced later work in geography of science. I am ignoring this lineage to avoid the Whig trap of connecting it to "current success."

  **2. The Minute Book / Edinburgh Delegates**
  *   **Settled:** The minute book exists; the dispute over delegate numbers is recorded.
  *   **Liberty:** I am characterizing this as "fussing" rather than a constitutional crisis. It likely *was* a constitutional crisis about representation and funding.
  *   **Why:** Describing it as bureaucratic pettiness makes it relatable to the non-historians in the room. Describing it as a constitutional crisis makes it sound like a political revolution, which implies a "progress toward democracy" narrative I want to avoid.

  **3. The 1970s Journal Split**
  *   **Settled:** The split happened. Tensions remain among the older cohort.
  *   **Contested:** *Why* it happened. Was it economics? Editorial control? Ideological shifts in the sociology of science?
  *   **Liberty:** I am deliberately vague on the cause. To specify a cause would require taking a side or implying one side was "historically vindicated." By calling it a "fracture" we survived, I treat the conflict as a stress test for the community rather than a battle between truth and error.

  **4. The Portrait**
  *   **Settled:** It is hung too high.
  *   **Liberty:** I am attributing an expression ("mild surprise") to a painting.
  *   **Why:** Purely for warmth and visual comedy. No historiographical weight here.

  **5. The Anti-Whig Structure**
  *   **The Trap:** Even by saying "We survived by luck/stubbornness," I am creating a counter-narrative: *The Saga of Humble Persistence.* This is its own teleology.
  *   **Mitigation:** I explicitly call out the narrative danger in the penultimate paragraph ("The narrative I have just told you is dangerous"). I admit that my selection of facts is biased by the fact of our survival.
  *   **The "Test":** I have tried to pass your test (strike out sentences that imply inevitability).
      *   *Instead of:* "This foundation allowed us to build..."
      *   *I used:* "The Society outlived its own original purpose."
      *   *Instead of:* "We learned from their mistakes."
      *   *I used:* "We have just found new things to disagree about."
      *   *Instead of:* "We are the culmination of their work."
      *   *I used:* "If things had gone the other way... this room would be empty."

  **6. Consensus Check**
  *   There is no active scholarly debate that *threatens* the facts presented here. The "Climate Project" is generally regarded by current members as a curious failure. The "Journal Split" is the only area where silence is preferable to detail. The speech treats the Society as a social object that persists, rather than an intellectual vehicle that progresses. This is safe ground for a dinner.
