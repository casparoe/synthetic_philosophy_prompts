  I don't have any technical background but I've been reading a lot about the trick where two AIs argue with each other and a human judges who won, and I want to pin down what I actually believe about when that catches a liar. I'm mostly interested in the version where the judge is worse at the subject than both of the arguers. My gut verdicts: if the two of them argue about whether some gigantic number is prime, and the honest one can just hand the judge two factors to multiply, the honest one wins every time, however smooth the liar is. If they argue about whether a two-hundred-page proof is correct, and neither one can hand the judge anything that can be checked in one sitting, I think the liar wins, and that bothers me. If they argue about whether a business will still exist in ten years, I think the whole exercise is worthless. Now the part I can't square. I think the honest side still wins when it's hopeless at arguing and the liar is charming, as long as it has a receipt — something the judge can check with their own hands, without trusting either side's reasoning. And I think that when there's no receipt at all, the charming one wins, even with a judge who's really trying. But I also think a liar who has to walk the judge through a long made-up story step by step will contradict himself eventually and the judge will smell it, even with nothing to check, which cuts against those last two. So is there a principle that gets all of this, or close? What does it say about two AIs arguing over what a poem means, or over something that's true but that nobody can yet explain? And which of my verdicts does it make me give up? Please just write it back as an email, no headings or bullet points or bold.
