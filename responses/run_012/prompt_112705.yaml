          *   Explain the symmetry.
          *   Explain "Impure Properties" (being 1 mile from *this* sphere). Explain why Black rejects this (presupposes distinctness).
          *   Explain "Haecceities" (primitive "thismess"). Explain why this saves PII but makes it uninteresting.
          *   Conclusion: Most metaphysicians accept Black's point: PII is not necessarily true.
      *   *Section 4: Electrons.*
          *   It's not a distraction. It's empirical evidence against PII.
          *   Mention Bose-Einstein statistics.
          *   Caveat: Philosophical interpretations of QM vary.
      *   *Conclusion:* Summary advice for talking to Dan.

  7.  **Review against Constraints:**
      *   Did I provide a menu? Yes.
      *   Did I evaluate truth status? Yes.
      *   Did I address Dan's specific argument about red? Yes.
      *   Did I explain the spheres/TA's jargon? Yes.
