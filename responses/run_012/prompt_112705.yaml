      *   Tone check: Keep it rigorous but clear. Avoid overly dense jargon without explanation.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure to distinguish between "PII is false" and "PII is not necessarily true." Black argues the latter (possibility), which is enough to kill it as a logical truth.
      *   *Clarification on Dan:* Dan is actually making an argument about *Private Language* or *Qualia* disguised as PII. I need to point out that even if experiences are distinct, they can share types.
      *   *Impure Properties:* Be careful. "Being 1 mile from the center of mass" works if there is a center. In Black's universe, the center is midway. Both are 0.5 miles from center. So that doesn't distinguish them. The relation is "being 1 mile from *the other sphere*." Since they are symmetric, this property is shared.

