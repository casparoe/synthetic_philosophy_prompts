answer: |-
  This is the right way to approach the problem. Most people jump to Jeffreys or Jaynes without asking what the job description actually is. You are asking for the **specification of Objective Bayesianism** before looking at the implementations.

  Here is the requirements list, weighted by severity of failure, followed by the analysis of your test cases, the improper prior question, and the fundamental conflict.

  ### Part 1: The Weighted Requirements Spec

  I have organized your list into three tiers: **Fatal Flaws** (theory is dead if it fails), **Structural Necessities** (theory is incoherent if it fails), and **Desiderata** (theory is weak if it fails).

  #### Tier 1: Fatal Flaws (Must Pass)
  **1. Coherence (The Dutch Book Requirement)**
  *   **Requirement:** The assigned probabilities must obey the axioms of probability (Kolmogorov) sufficiently to prevent a sure-loss betting scheme *given the agent's state of information*.
  *   **Weight:** Absolute. If the theory allows a Dutch Book, it is not a theory of probability; it is a heuristic.
  *   **Motivation:** Your "usable" point. If I can't bet on it or update it via Bayes' Rule without breaking math, it's useless for decision theory.

  **2. Definition of "No Information" (The Semantic Requirement)**
  *   **Requirement:** The theory must define "no information" as a positive state of knowledge (e.g., "I know the symmetry group") rather than a null state (e.g., "I know nothing").
  *   **Weight:** Absolute. "I know nothing" is a vacuum; you cannot derive a distribution from a vacuum. The theory must specify what *constraints* constitute ignorance (e.g., scale invariance, location invariance).
  *   **Motivation:** Your "say what 'no information' means" point. If the theory treats "no info" as a blank slate, it collapses into arbitrariness.

  #### Tier 2: Structural Necessities (High Weight)
  **3. Reparametrization Consistency (The Invariance Requirement)**
  *   **Requirement:** The theory **must have a principled story about why one description is privileged.** It cannot simply give the same answer for $p$ and $\log p$ if both are treated as uniform.
  *   **Weight:** High. You asked "Tell me which of those two it has to do." It has to do the latter. A density $f(x)$ transforms to $f(y)|dy/dx|$. You cannot be uniform in both. The theory must identify the **invariant measure** of the problem space.
  *   **Motivation:** Your "reparametrization" point. If the answer changes based on whether I measure length in inches or centimeters without a physical reason, the theory is subjective masquerading as objective.

  **4. Distinction Preservation (The Category Requirement)**
  *   **Requirement:** The theory must distinguish between **epistemic probability** (state of knowledge) and **ontic frequency** (physical propensity), and between **parameters** and **observables**.
  *   **Weight:** High. Naive indifference often assigns a uniform prior to a parameter $\theta$ and implies a non-uniform distribution for the data $x$, or vice versa, without justification.
  *   **Motivation:** Your "distinctions it can't collapse" point. Blurring parameter/observable leads to the Cube Factory paradox (uniform on side length $\neq$ uniform on volume).

  #### Tier 3: Desiderata (Medium Weight)
  **5. Regularity (Cromwell's Rule)**
  *   **Requirement:** Do not assign 0 or 1 to contingent empirical propositions.
  *   **Weight:** Medium. While ideal for learning, some objective priors (like Jeffreys on a bounded interval) place mass on boundaries. A theory can survive this if it admits these are limiting cases, but a hard 0/1 on an open set is a fatal rigidity.
  *   **Motivation:** Your "one observation wrecks it" point.

  **6. Definite Answers (The Resolution Requirement)**
  *   **Requirement:** The theory should resolve the classic puzzles (Bertrand, Cube) by ruling out invalid framings, not just picking an answer.
  *   **Weight:** Medium. It is better to say "This problem is ill-posed" than to give a wrong answer. However, a theory of *assignment* should ideally assign.
  *   **Motivation:** Your "definite answer" point.

  ---

  ### Part 2: The Test Cases

  Here is how the requirements above handle your two made-up cases.

  #### (1) The Nesting Test (Partition Dependence)
  *   **Setup:** Split outcome $A$ into $A_1, A_2$. Assign equal mass. Does $P(A)$ change?
  *   **Verdict:** This is a **Trap**, not a Requirement.
  *   **Analysis:** A naive Principle of Indifference (count outcomes) fails this test. If I have $\{A, B\}$, $P(A)=1/2$. If I split $A \to \{A_1, A_2\}$, I now have $\{A_1, A_2, B\}$, so $P(A) = P(A_1)+P(A_2) = 2/3$. The probability changed based on how I carved the conceptual space.
  *   **Requirement Adjustment:** A robust theory must **fail** the naive nesting test to pass the **Invariance Requirement**. The probability should *only* remain unchanged if the split is "informationally null." The theory must specify which partitions are **natural** (e.g., defined by the symmetry group) and which are arbitrary. If the theory says "all partitions are equal," it is dead. It must say "only partitions invariant under the problem's symmetry group count."

  #### (2) The Coarse-Graining Test (Discretization Limits)
  *   **Setup:** Bucket the real line, assign prior, refine buckets.
  *   **Verdict:** The answer is **Relativity to the Partition is a Defect**, but stability is not guaranteed.
  *   **Analysis:** Any adequate theory must be honest that the answer is relative to the **measure**, not just the partition. If you take the limit of uniform priors on finer and finer buckets, you do not necessarily get a uniform prior on the continuum (you might get a singular measure or diverge).
  *   **Requirement:** The theory must specify the **limiting measure**. It cannot just say "refine the buckets." It must say "refine the buckets *according to the invariant metric of the space*." If the theory cannot define the limit, it is restricted to discrete problems only.

  ---

  ### Part 3: Continuous Groups and Improper Priors

  **Question:** Is an improper prior allowed, or does "must be a genuine probability distribution" kill it?

  **Answer:** "Must be a genuine probability distribution" kills **Scale Invariance** on unbounded domains.
  If you demand $\int p(\theta) d\theta = 1$ over $\mathbb{R}$ or $\mathbb{R}^+$, you cannot have translation or scale invariance. The only invariant measure on $\mathbb{R}$ is $d\theta$ (integrates to $\infty$). The only invariant measure on $\mathbb{R}^+$ is $d\theta/\theta$ (integrates to $\infty$).

  **The Requirement:**
  The theory must allow **Improper Priors as Limits**, subject to a **Posterior Propriety Constraint**.
  1.  **Allowed:** You can use $p(\theta) \propto 1$ or $1/\theta$ as a formal device to represent ignorance.
  2.  **Constraint:** The resulting posterior $p(\theta|data)$ *must* be proper (integrable to 1).
  3.  **Justification:** If the data is sufficient to overwhelm the infinite prior mass, the inference is valid. If the posterior remains improper, the theory must declare "Insufficient Information" rather than outputting a number.

  **On Maximum Entropy:**
  You asked: *"Entropy over what, and why that choice isn't itself an arbitrary parametrization?"*
  This is the critical weakness of naive MaxEnt. Entropy $H = -\int p(x) \log p(x) dx$ is **not invariant** under coordinate transformation. To make MaxEnt work, you need a reference measure $m(x)$: $H = -\int p(x) \log \frac{p(x)}{m(x)} dx$.
  **The Catch:** Choosing $m(x)$ is exactly the same problem as choosing the prior. MaxEnt does not solve the "no information" problem; it shifts it to "choose the reference measure." A complete theory must specify how to derive $m(x)$ from the problem symmetries, not just maximize entropy over it.

  ---

  ### Part 4: The Fundamental Conflict

  You suspected two requirements conflict. You are correct. This is the heart of the matter.

  **The Conflict:** **Principle of Indifference (Outcome Counting)** vs. **Reparametrization Invariance.**

  *   **Side A (Indifference):** "If I have no reason to prefer $A$ over $B$, assign $P(A)=P(B)$."
  *   **Side B (Invariance):** "If I describe the same physical state by $x$ or $y=f(x)$, my state of knowledge shouldn't change."

  **Why they clash:**
  If I am indifferent over $x \in [0, 1]$ (Uniform), I am *not* indifferent over $y = x^2$. The distribution of $y$ will be concentrated near 0.
  If I demand indifference over *both* $x$ and $y$, I violate the axioms of probability (Sum Rule).

  **Is it Fatal?**
  It is fatal to **Classical Indifference** (Laplace's "count the possibilities").
  It is **not** fatal to **Transformation Group Invariance** (Jaynes' approach), *provided* you sacrifice the idea that "no information" means "uniform over the parameter."

  **The Resolution Requirement:**
  A viable theory must **reject Naive Indifference** in favor of **Group Invariance**.
  1.  **Identify the Symmetry Group:** What transformations leave the problem physically unchanged? (e.g., shifting the origin, scaling the ruler).
  2.  **Derive the Measure:** Find the measure $d\mu$ that is invariant under that group (Haar measure).
  3.  **Assign Ignorance:** "No information" means "Uniform with respect to the invariant measure $d\mu$," *not* "Uniform with respect to the parameter label."

  **The Conflict Summary:**
  You cannot have **Description Invariance** (answers don't change when I rename variables) AND **Parameter Indifference** (all parameter values are equally likely) simultaneously.
  *   If you keep Parameter Indifference, you lose Description Invariance (Bertrand's Paradox).
  *   If you keep Description Invariance, you must abandon Parameter Indifference (Jeffreys/Jaynes Priors).

  **Final Spec Verdict:**
  Any theory that claims to solve "no information" must explicitly state that **Parameter Indifference is a fallacy.** It must replace it with **Invariance under the Problem's Symmetry Group.** If a theory tries to keep both, it is mathematically incoherent. The "magic trick" you are looking for is the derivation of the symmetry group from the problem statement itself—without smuggling in assumptions about which parameters are "natural." That is the only place where the theory can fail, and where most do.
