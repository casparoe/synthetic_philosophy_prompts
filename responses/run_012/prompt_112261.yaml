  # SURVIVAL DECISION TREE: ANALYTIC PERSPECTIVES

  **Instructions:** Follow the branch questions based on your intuitions about the concrete cases (Medium, NDE, Body Transfer). Locate your leaf below.

  ### THE TREE

  **1. MEDIUM CASE:** Does "X survives" entail observable consequences checkable by a finite observer?
  *   **NO** → **Node 2**
  *   **YES** → **Node 3**

  **2. NON-EMPIRICAL STATUS:** How is the claim meaningful without observation?
  *   **Meaningless** → **Leaf A**
  *   **Meaningful (Unsupported)** → **Leaf B**
  *   **Meaningful (Conceptual)** → **Leaf C**

  **3. NDE CASE:** Is the cause of apparent survival evidence (e.g., NDEs) physical or non-physical?
  *   **Physical (Brain)** → **Node 4**
  *   **Non-Physical** → **Node 5**

  **4. MATERIALIST TRUTH:** Is the claim "I survive" true in a naturalistic sense?
  *   **True (Deflated)** → **Leaf D**
  *   **False** → **Leaf E**

  **5. BODY TRANSFER CASE:** What is the vehicle of survival?
  *   **Same Body (Resurrected)** → **Leaf F**
  *   **New Body** → **Leaf G**
  *   **No Body (Psychological)** → **Node 6**

  **6. DISEMBODIED VOICE CASE:** Is the surviving consciousness numerically identical to the ante-mortem person?
  *   **Yes (Continuous)** → **Leaf H**
  *   **No (Fresh Entity)** → **Leaf I**
  *   **No (Impersonal Trace)** → **Leaf J**

  ---

  ### LEAF KEY & DIAGNOSTICS

  | Leaf | Position | Awkward Commitment | Move to Neighbor |
  | :--- | :--- | :--- | :--- |
  | **A** | **Ayer (Early)**: Strict Verificationism | Religious language is literally nonsense. | Accept weak verification (→ B). |
  | **B** | **Weak Verificationism** | Claim is meaningful but evidentially unsupported. | Accept non-empirical meaning (→ C). |
  | **C** | **Logical Construction** | Persons are logical fictions, not substances. | Demand empirical check (→ 3). |
  | **D** | **Ayer (Late)**: Naturalistic NDE | Survival is just a memorable brain event. | Accept disembodied cause (→ 5). |
  | **E** | **Eliminative Materialism** | The "I" never existed to survive. | Accept deflated truth (→ D). |
  | **F** | **Bodily Resurrection** | Requires miraculous reassembly of matter. | Accept new body (→ G). |
  | **G** | **Reincarnation** | Requires unexplained transmigration mechanism. | Accept same body (→ F). |
  | **H** | **Lockean Memory** | Memory gaps break personal identity. | Accept fresh entity (→ I). |
  | **I** | **Unnamed (Unoccupied)** | A copy exists, but the original perished. | Accept continuity (→ H) or Trace (→ J). |
  | **J** | **Mystical Absorption** | No "you" survives, only causal influence. | Accept personal identity (→ H). |

  ---

  ### LOGICAL SPACE NOTES

  *   **Unoccupied Combinations:** Leaf **I** (Fresh Entity/Disembodied) is rarely defended as a positive goal (why survive if it isn't *you*?). It is logically possible but existentially unattractive.
  *   **Indistinguishable Positions:** **Reincarnation (G)** and **Lockean Memory (H)** are indistinguishable if psychological continuity is maintained across bodies; separated here by bodily substrate.
  *   **Ayer's Trajectory:** Ayer moves from **A** (Early) to **D** (Late) via a shift at **Node 1** (accepting empirical consequences of NDEs) and **Node 4** (accepting naturalistic truth).
  *   **Verification Shift:** Moving from **A** to **B** requires relaxing the strict verification principle to allow probabilistic evidence.

