  1. A national tax agency introduces a biometric ID system that fails to scan retinas correctly for anyone born in 1996 due to a database error that linked that specific birth year code to a legacy scanning protocol. Every subsequent tax filing for this specific birth year triggers a manual review delay of three weeks, regardless of how old they are now or what year they file, while those born in 1995 or 1997 process instantly. The error was never fixed for existing records, creating a permanent administrative scar that follows this specific cohort across all future periods and ages without affecting their neighbors. This creates a measurable difference in processing time that tracks strictly with the 1996 birth year rather than the filer's current age or the calendar year of submission.

  2. Hold age fixed by comparing the 1996 group to the 1995 group when both are thirty years old, and hold period fixed by comparing the 1996 group to the 1997 group filing in the same tax year. The delay persists only for the 1996 births in both comparisons, proving the variation is tied to the cohort itself rather than the aging process or the current calendar year.

  3. The single feature doing the work is the arbitrary administrative tag tied strictly to birth year, and if you remove it, the effect vanishes because there is no underlying behavioral difference to sustain it. I am cheating by stipulating a clean, exogenous shock that solves the mathematical identification problem which usually plagues messy social data.

  4. This doesn't count as a generation because the similarity is not explained by their relation to each other, as they merely suffered parallel individual inconveniences rather than a common formative episode they went through together. To count as a generation, they would need to recognize the shared delay and organize around it, turning a statistical cluster into a social group defined by their mutual connection.

  5. Dev would argue this confirms his suspicion that generations are HR astrology because this group shares a data tag, not a lived culture, even if the statistical cohort effect is genuine. He is right that this lacks the social substance of a generation, but wrong to claim birth-year effects are mathematically impossible to isolate from age and period when a sharp exogenous shock occurs.
