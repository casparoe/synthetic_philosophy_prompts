      *   Check constraints: No rehashing standard moves. Focus on diagnosis.

      *(Self-Correction)*: I should explicitly mention the "Reference Class" issue isn't just about who counts, but about the *modal status* of the observer. Am I a soul waiting to be born (SSA) or a product of the universe (SIA)? This metaphysical commitment drives the probability choice.

      *(Final Plan)*:
      1. Validate the fatigue.
      2. Assess the "Indexical Evidence" hypothesis (Mostly right, but needs "Likelihood Function" precision).
