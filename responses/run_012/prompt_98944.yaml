          *   *Expected Outcome:* Not Bad Faith (just annoying/monomaniacal).
      *   *Case 3 (One-time/Apologizer):* Inflammatory claim, apologized, group wants them gone.
          *   *Expected Outcome:* Not Bad Faith (mistake + repair). *This might be the one the user doesn't like if the group is bloodthirsty, OR I need to make sure one case yields a result the user dislikes.*
