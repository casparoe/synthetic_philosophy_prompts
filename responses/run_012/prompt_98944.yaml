      *   *Unwelcome Answer Plan:* I will make Case 1 (The Source Dismisser) come out as "Inconclusive" if they claim the sources are from a biased institution. Why? Because without knowing their internal state, rejecting a source *can* be a valid epistemic stance (e.g., rejecting a retracted study). If the procedure is honest, it can't prove bad faith without a pattern. This will frustrate the user who wants to ban the troll. This fits the "What the procedure cannot do" section.
