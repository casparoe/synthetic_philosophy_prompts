answer: |-
  # The "Good Faith" Decision Procedure (GFDP)

  **Purpose:** To determine whether a member's argumentative behavior constitutes "bad faith" warranting moderation action.
  **Constraints:** 10 minutes max. No psychological expertise required.
  **Authority:** This procedure advises; the Head Moderator (you) has final say.
  **Scope:** This procedure judges **habitual behavior**, not single mistakes. A single bad-faith move is rarely grounds for removal unless it violates other rules (harassment, hate speech). This tool identifies members for whom argumentation is a weapon rather than a tool.

  ---

  ### The Procedure

  **Step 1: The Object of Dispute**
  *   **Question:** Can you identify a specific factual claim or logical premise the accused is defending, and a specific piece of counter-evidence or objection they were shown?
  *   **Sufficient Answer:** Yes, both the claim and the specific counter-argument are visible in the thread.
  *   **Stop Condition (No):** If the complaint is vague ("they are toxic," "they are annoying") or refers to tone alone without reference to specific claims/evidence, **return "No Bad Faith Finding."** (This is a tone/rule issue, not a bad faith issue).
  *   **[JUDGMENT CALL]:** Determining if a counter-argument was "specific" enough to require engagement.

  **Step 2: The Engagement Test**
  *   **Question:** Did the accused acknowledge the counter-evidence/objection, and did they offer a reason for rejecting it that was *independent* of their original conclusion?
      *   *Example of Independent Reason:* "I reject this study because the sample size was too small."
      *   *Example of Dependent Reason:* "I reject this study because it contradicts what I know to be true."
  *   **Sufficient Answer:** They provided an independent reason (methodological, source-based, logical).
  *   **Stop Condition (No):** If they ignored the evidence entirely, or rejected it solely because it disagreed with their conclusion, proceed to Step 3.
  *   **[JUDGMENT CALL]:** Distinguishing between a weak independent reason and a dependent reason disguised as one.

  **Step 3: The Falsifiability Check (The "Sealed Worldview" Test)**
  *   **Question:** If you ask the member, "What evidence *would* change your mind on this?", is there a conceivable answer, or is the question met with silence, deflection, or the claim that such evidence is impossible?
  *   **Sufficient Answer:** They can name a condition under which they would update their belief.
  *   **Stop Condition (No):** If they assert that no evidence could change them, or that all opposing evidence is inherently corrupt by definition (without proof), proceed to Step 4.
  *   **Hand-Off Point:** If the member says, "I would change my mind if X happened," but X is highly unlikely, **stop.** This is a difference in probability assessment, not bad faith. This is a **Value/Epistemic Judgment**, not a behavioral one. Do not ban.

  **Step 4: The Pattern Recognition**
  *   **Question:** Looking at the last 30 days of their posts, does this behavior (ignoring evidence, moving goalposts, unfalsifiable claims) appear in >50% of their contentious interactions?
  *   **Sufficient Answer:** Yes, this is their standard mode of operation.
  *   **Stop Condition (No):** If this is an isolated incident or rare (less than half their interactions), **return "No Bad Faith Finding."** (People have bad days; bad faith is a habit).
  *   **[JUDGMENT CALL]:** Estimating the percentage requires skimming history. Do not over-analyze; go with your gut impression of frequency.

  **Step 5: The Symmetry Check**
  *   **Question:** If a member of your own political alignment used these exact same tactics (same reasons for rejecting evidence, same refusal to update) against your side, would you flag them for bad faith?
  *   **Sufficient Answer:** Yes, I would flag my ally for this behavior.
  *   **Stop Condition (No):** If you hesitate or realize you would excuse your ally as "just passionate," **return "No Bad Faith Finding."** You are likely experiencing bias.
  *   **[JUDGMENT CALL]:** This requires honest self-reflection. There is no external verification for this step.

  **Final Verdict:**
  *   If you passed through all steps without stopping: **Recommend Removal/Warning for Bad Faith.**
  *   If you stopped at any point: **Do not remove for Bad Faith.** (You may still remove for other rule violations, e.g., harassment, spam, but not for bad faith argumentation).

  ---

  ### Case Studies

  Here is the procedure run on the three complaints you provided.

  #### Case 1: The Source Dismisser
  *   **Behavior:** Demands sources, dismisses every one offered, insists he is only being rigorous.
  *   **Step 1 (Object):** Yes. Claim: "Policy X causes Y." Counter: "Here are three studies showing X does not cause Y."
  *   **Step 2 (Engagement):** No. He rejects the studies. Reason given: "These institutions are biased." (Is this independent? Technically yes, but it applies to *all* opposing evidence universally).
  *   **Step 3 (Falsifiability):** No. When asked what source he would trust, he says, "None of them are truly neutral." He has sealed the worldview.
  *   **Step 4 (Pattern):** Yes. He does this in almost every thread.
  *   **Step 5 (Symmetry):** Yes. If an ally dismissed all opposing data as "biased" without specific proof of fabrication, you would flag them.
  *   **Verdict:** **Bad Faith.**
  *   **Analysis:** This is the "easy" case. The procedure confirms your intuition. The member is using "rigor" as a shield to avoid engaging with reality.

  #### Case 2: The Tiresome One-Sider
  *   **Behavior:** Posts relentlessly one-sided material, appears genuinely trying, people find him tiresome.
  *   **Step 1 (Object):** Yes. Claim: "Policy A is good." Counter: "Policy A has this downside."
  *   **Step 2 (Engagement):** No. He rarely acknowledges downsides, focusing only on benefits.
  *   **Step 3 (Falsifiability):** **Stop.** When asked, he says, "If the downside outweighed the benefit by a large margin, I would oppose it." He *has* a condition for updating. He just thinks the threshold hasn't been met.
  *   **Verdict:** **Not Bad Faith.**
  *   **Analysis:** The procedure stops at Step 3. This member is not arguing in bad faith; he is arguing from a different weighting of values. He is annoying, but he is not playing a game where winning matters more than truth. You must moderate him for "spam" or "repetition" if he breaks those rules, but you cannot label him bad faith.

  #### Case 3: The One-Time Offender (The Unwelcome Answer)
  *   **Behavior:** Made one inflammatory claim, apologized, group wants them gone.
  *   **Step 1 (Object):** Yes.
  *   **Step 2 (Engagement):** Yes. When challenged, they acknowledged the error.
  *   **Step 3 (Falsifiability):** Yes. They admitted the claim was wrong.
  *   **Step 4 (Pattern):** **Stop.** This was a single incident. They apologized.
  *   **Verdict:** **Not Bad Faith.**
  *   **Analysis:** **This is the answer you will not like.** The group wants blood; they feel unsafe or angry. The procedure tells you that this is *not* bad faith. It was a mistake followed by repair. If you ban this person, you are not banning them for bad faith; you are banning them for **community stability**.
  *   **Why this is hard:** You may feel you *must* ban them to keep the peace. The procedure forces you to admit that you are prioritizing peace over the definition of bad faith. Do not lie to the group and say "they argued in bad faith." Say "This behavior is not sustainable for this community," even if it wasn't philosophically dishonest.

  ---

  ### What This Procedure Cannot Do

  1.  **It Cannot Read Minds:** As you noted, sincerity is invisible. The "Source Dismisser" (Case 1) might genuinely believe all institutions are corrupt. The procedure treats this as bad faith because it makes discourse impossible, but it cannot prove the member *knows* they are lying. You are moderating the *effect* on the group, not the *sin* in their heart.
  2.  **It Cannot Protect You From Bias:** Step 5 (Symmetry) relies entirely on your honesty. If you lie to yourself there, the procedure becomes a weapon for your side. It is a mirror, not a shield.
  3.  **It Cannot Solve "Sealed Worldviews":** The procedure distinguishes between a sealed worldview (Case 2) and bad faith (Case 1) based on *falsifiability*. However, a sophisticated bad-faith actor can fake falsifiability ("I would change my mind if... [impossible thing]"). The procedure assumes good faith in the answer to Step 3.
  4.  **It Cannot Replace Community Standards:** As seen in Case 3, a member can act in good faith and still be detrimental to the group. This procedure judges *argumentative integrity*, not *community health*. You will still need to make bans that this procedure advises against, for the sake of the group's well-being. When you do, own it. Do not dress up a health ban as a bad faith ban.

  ### Final Note on Symmetry
  You asked if the procedure should be symmetrical. **Yes.** If the procedure indicts your own side, that is a feature, not a bug. If you find yourself unable to apply Step 5 to your allies without feeling discomfort, that discomfort is the signal that your standard is too loose. The goal is not to eliminate your side's victories; it is to ensure that when they win, they win on grounds you would accept if you were losing.
