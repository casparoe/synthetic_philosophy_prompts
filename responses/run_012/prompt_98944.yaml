      *   What it cannot do? Yes.

  8.  **Final Polish:**
      *   Ensure the distinction between "Epistemic Bubble" and "Bad Faith" is handled. (Key: Willingness to update *if* evidence is accepted as valid).
      *   Ensure the "Symmetry" point is integrated.
      *   Make sure the "Unwelcome Answer" is clear in the analysis.

      *(Self-Correction during drafting)*: I need to be careful not to make the procedure *too* complex. 10 minutes means 5-6 questions max.
      *   Q1: Definition of the dispute.
      *   Q2: Engagement with counter-evidence.
      *   Q3: Falsifiability (The "What would change your mind" test).
      *   Q4: Pattern vs. Instance.
      *   Q5: Symmetry.

