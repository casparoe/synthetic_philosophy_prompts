          *   *Wait, I need to build the procedure to avoid that trap if possible.* The prompt says "where the procedure stops... and hands the decision back to a person because the question is one of values."
          *   *Okay, let's design the procedure to be fair.*
          *   *Unwelcome Answer:* I will make Case 3 (The Apologizer) result in "No Action." The community wants them gone. The procedure says they acted in good faith (mistake + repair). The user might feel they need to ban for *safety*, but the *bad faith* procedure says no. This distinguishes "Bad Faith" from "Community Safety."

  5.  **Refining the Procedure Steps:**
      *   *Step 1: Scope.* Is this about truth-seeking or rule-breaking?
      *   *Step 2: The Pivot.* Did they address the specific objection?
      *   *Step 3: The Cost.* Is there anything that would change their mind?
      *   *Step 4: The Pattern.* Is this habitual? (Crucial distinction).
      *   *Step 5: Symmetry Check.* Would I flag my ally for this?

  6.  **Writing the Content:**
      *   Tone: Pragmatic, humble, clear.
      *   Formatting: Numbered list, bold text for decisions.
      *   Marking Judgment Calls: Use [JC] tags.
      *   Hand-offs: Explicitly state "Stop. This is a value judgment."

  7.  **Review against Constraints:**
