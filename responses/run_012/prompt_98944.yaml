  1.  **Analyze the Request:**
      *   **User:** Moderator of a large political discussion group (few thousand members, 3 volunteer mods).
      *   **Problem:** "Bad faith" arguments are the most common complaint. No formal training in philosophy/psychology. Tired of improvising standards.
      *   **Current Insights/Struggles:**
          *   Sincerity $\neq$ Good Faith (sincere people can be bad faith, performers can be good faith).
          *   Motives are invisible; only behavior (response to evidence/objections) is visible.
          *   Fear of bias: Judging behavior might just mean punishing disagreement.
          *   Epistemic Bubbles: Some members repeat misinformation from other communities (sealed worldviews) – is this bad faith?
          *   Falsifiability: How to distinguish well-defended beliefs from unfalsifiable ones?
          *   Symmetry: The test indicts the moderator's own side too. Should the procedure be symmetrical?
      *   **Requirements:**
          *   Format: Sequence of questions in order.
          *   Content: Sufficient answers, stop conditions (returns "no"), hand-off points (values vs. evidence).
          *   Distinction: Single move vs. habitual bad faith (which can be judged?).
          *   Transparency: Mark steps that are judgment calls disguised as procedure.
          *   Constraints: 10 minutes, no expertise, final say rests with the user.
          *   Testing: Run on three specific cases (Source dismisser, Tiresome one-sider, One-time offender/apologizer).
          *   Constraint: Include at least one case where the procedure gives an answer the user won't like.
          *   Conclusion: Tell me what the procedure *cannot* do.

  2.  **Deconstruct "Bad Faith":**
      *   Bad faith isn't just being wrong. It isn't just being rude.
      *   It's about the *relationship to the truth* and the *purpose of the discourse*.
      *   Key indicators: Moving goalposts, refusal to define terms, strawmanning, ignoring evidence without reason, Gish galloping, refusing to acknowledge valid counter-points, treating the discussion as war rather than inquiry.
      *   *Crucial distinction:* Epistemic closure (sealed worldview) vs. Bad Faith (knowing manipulation or willful blindness). The prompt highlights the difficulty here. The procedure needs to test *responsiveness*, not *correctness*.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* A flowchart-like set of questions.
      *   *Constraint:* 10 minutes. Needs to be fast.
      *   *Constraint:* Symmetry. Must apply regardless of political alignment.
      *   *Constraint:* Judgment calls must be flagged.

      *   *Step 1: The Trigger.* Is this about argumentation or just rule-breaking (harassment, spam)? Bad faith is about argumentation.
      *   *Step 2: The Engagement.* Did they engage with the specific objection/evidence?
      *   *Step 3: The Shift.* Did they change the terms when challenged?
      *   *Step 4: The Cost.* Is there a cost to their belief? (Falsifiability).
      *   *Step 5: Pattern vs. Instance.* Can we judge a single act? (Prompt asks to distinguish).

      *   *Refining the "Sealed Worldview" issue:* If someone cites a source that is widely debunked, do they know it's debunked? We can't know. But we can ask: "If this source were proven fabricated, would you change your mind?" If the answer is "That source can't be fabricated," that's dogma, potentially bad faith.
      *   *Refining the "Symmetry" issue:* The procedure must admit that it might flag the moderator's allies.

      *   *Drafting the Questions:*
          1.  Is there a specific claim being contested?
          2.  Did the accused acknowledge the counter-argument?
          3.  Did they provide a reason for rejection?
          4.  Is the reason independent of the conclusion?
          5.  Pattern recognition.

      *   *Addressing the "Judgment Call" requirement:* I need to explicitly label where human intuition is required despite the procedural framing.

      *   *Addressing the "Values vs. Evidence" hand-off:* Some things aren't bad faith, they are just different values. The procedure needs to stop there.

