          *   *Let's try to make the Procedure robust.* If someone dismisses *every* source without engaging the content, that *is* bad faith behaviorally. So Case 1 should be Bad Faith.
          *   *Case 2 (Tiresome):* Should be Not Bad Faith.
          *   *Case 3 (Apologizer):* Should be Not Bad Faith.
          *   *Where is the "Answer I won't like"?* Perhaps in the "Symmetry" check. If the procedure forces the mod to admit their own side does this.
          *   *No, the prompt asks to run the procedure on the cases.* I need one of the *cases* to yield an unwelcome result.
          *   *Hypothesis:* Case 1 (Source Dismisser). If the procedure is strict about "proving motive," it might fail to condemn a sophisticated troll. This shows the limitation.
