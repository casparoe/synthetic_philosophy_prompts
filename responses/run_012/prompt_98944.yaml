          *   *Alternative:* The "Source Dismisser" might be protected if they are from a "sealed worldview." If the procedure exonerates a troll because "maybe they really believe their fake news," the user won't like that. Let's aim for that. It highlights the "motive is invisible" problem.
          *   *Actually, looking at the prompt:* "Include at least one case where the procedure gives an answer I will not like."
          *   *Decision:* I will make Case 1 (Source Dismisser) come out as "Inconclusive/Not Bad Faith" under strict scrutiny because we can't prove they *know* the sources are bad. This forces the mod to realize they are banning for *disruption*, not *bad faith*. This is a hard truth the user needs.
