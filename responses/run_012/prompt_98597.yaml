prompt: |-
  I'm putting together a reading-group handout. Two friends of mine have been argueing in circles for months about whether we owe our compatriots more than we owe strangers: one's a patriotic partialist who thinks co-nationality grounds genuine special obligations, the other's a cosmopolitan who thinks any partiality toward compatriots has to be justified from the ground up by what it does for everyone. Write the joint statement they could both actually put their names to after a proper good-faith collaboration.

  I want: a numbered section of claims they both accept -- about what a "special claim" even is (a permission to favour, a duty to favour, or extra weight?), about what could make partiality permissible in the first place, and about whether the ground is the co-national relationship itself, reciprocity in a shared scheme of cooperation, or something else entirely. Then a disagreements table, each row phrased so that the side it belongs to would accept the wording of its own view. Then the cruxes -- the sub-questions where settling them would move at least one side.

  Make them work through at least these cases and say, for each, which crux it bears on and what each side predicts: (a) two co-nationals in a collapsed state where the shared institutions have basically gone; (b) a long-term resident who shares every institution but not the nationality; (c) a closed colony or generation ship, where everyone shares a scheme and a common fate but there's no nation and no shared history; and (d) a pair who share a nationality and nothing else. And if you think part of their fight is really just verbal, say which bit and why.

  Don't worry about citations or who said what, I'll fill that in. Finally, tell me how confident you are that these formulations are ones each side would actually sign, and single out the one you're least sure about.
reasoning: |-
  Here's a thinking process that leads to the suggested handout:

  1.  **Analyze the Request:**
      *   **Task:** Create a reading-group handout summarizing a debate between a "Patriotic Partialist" (PP) and a "Cosmopolitan" (C).
      *   **Goal:** A joint statement they could *both* sign after good-faith collaboration.
      *   **Components:**
          1.  Numbered section of agreed claims (nature of special claims, permissibility of partiality, grounds of obligation).
          2.  Disagreements table (rows phrased neutrally but distinctly enough for each side to claim).
          3.  Cruxes (sub-questions where settlement moves the needle).
          4.  Case Studies (a, b, c, d) linked to cruxes with predictions from each side.
          5.  Verbal Dispute Analysis (is any of this just semantics?).
          6.  Confidence Assessment (how likely are they to sign? Which claim is weakest?).
      *   **Tone:** Philosophical, precise, collaborative, neutral but capturing the nuance of the positions.
      *   **Constraints:** No citations needed.

  2.  **Deconstruct the Positions:**
      *   **Patriotic Partialist (PP):** Believes co-nationality *itself* grounds special obligations. It's not just instrumental. Relationships matter intrinsically.
      *   **Cosmopolitan (C):** Believes partiality must be justified from the "ground up" (impartial standpoint). Partiality is only okay if it ultimately serves everyone or arises from fair schemes of cooperation. Instrumental/Derivative.

  3.  **Drafting Section 1: Joint Statement of Agreement:**
      *   *Challenge:* Find common ground without diluting the disagreement too much. They need to agree on the *terms* of the debate, even if not the *outcome*.
      *   *Claim 1 (Nature of Special Claim):* Is it a duty or permission? Both likely agree it involves *some* priority, but maybe disagree on whether it's mandatory. Let's frame it as "priority in allocation of concern/resources."
      *   *Claim 2 (Permissibility):* Both agree partiality isn't automatic; it needs justification. Even PP thinks there are limits (e.g., you can't murder for your country). C thinks it needs global justification. Common ground: "Partiality is not morally brute; it requires a rationale."
      *   *Claim 3 (Grounds):* This is tricky. PP says relationship; C says cooperation/utility. Common ground: "The source of the obligation is contested, but both agree it involves some form of associative tie or structural interdependence." Let's refine: Both agree that *some* facts about relationships matter, they just disagree on *which* facts and *why*.
      *   *Refinement:* Let's make sure the agreement doesn't solve the dispute.
      *   *Drafting:*
          1.  Special obligations entail a justified priority in the distribution of concern, resources, or political attention.
          2.  Moral partiality is not automatically permissible; it requires justification against a baseline of equal moral worth.
          3.  The justification for partiality likely involves a combination of relational facts (history, identity) and structural facts (institutions, cooperation), though the weight of each is disputed.

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Goal:* Phrasing that allows each to say "Yes, that's my view" without the other saying "That's false."
      *   *Strategy:* Use "Primary Ground" vs. "Derivative Justification."
      *   *Row 1 (Source):* PP: The relationship itself is the source. C: The relationship is a tool for global justice.
      *   *Row 2 (Scope):* PP: Obligations extend as far as the national identity. C: Obligations extend as far as the cooperative scheme/global need allows.
      *   *Row 3 (Conflict):* PP: National interest can override global interest in some cases. C: Global interest sets the boundary conditions for national interest.

  5.  **Drafting Section 3: Cruxes:**
      *   What would change their minds?
      *   *Crux 1:* Intrinsic Value of Relationships. If relationships have intrinsic moral weight, PP wins. If only instrumental, C wins.
      *   *Crux 2:* The "Baseline." Is the baseline global equality or local autonomy?
      *   *Crux 3:* Institutional Dependency. Do obligations vanish without institutions?

  6.  **Drafting Section 4: Case Studies:**
      *   *(a) Collapsed State:* No institutions.
          *   PP: Obligations remain (identity/history).
          *   C: Obligations weaken or vanish (no scheme to coordinate).
          *   Crux: Institutional Dependency.
      *   *(b) Long-term Resident:* Institutions yes, Nationality no.
          *   PP: Weaker obligation (lack of symbolic/identity tie).
          *   C: Equal obligation (participation in scheme is what matters).
          *   Crux: Identity vs. Cooperation.
      *   *(c) Generation Ship:* Scheme/Fate yes, Nation/History no.
          *   PP: No special obligation (no "nation").
          *   C: Special obligation (cooperative scheme exists).
          *   Crux: Definition of "Relevant Group."
      *   *(d) Nationality Only:* Shared passport, no interaction/history.
          *   PP: Some obligation remains (legal/symbolic tie).
          *   C: No obligation (no cooperative interaction).
          *   Crux: Formality vs. Substance.

  7.  **Drafting Section 5: Verbal Dispute Analysis:**
      *   Is "Nation" the problem? PP uses it culturally/historically. C uses it institutionally.
      *   Is "Obligation" the problem? PP sees it as ethical/relational. C sees it as distributive/justice-based.
      *   *Verdict:* Partly verbal regarding the definition of "co-nationality" (is it legal status or shared life?), but the moral disagreement is real.

  8.  **Drafting Section 6: Confidence Assessment:**
      *   High confidence on the case studies (standard thought experiments).
      *   Medium confidence on the Joint Statement (philosophers are picky).
      *   *Least Sure:* The claim about "Moral partiality is not automatically permissible." Hardliners on both sides might balk. PP might think it *is* brute. C might think it's *never* permissible unless strictly utilitarian. I need to phrase it carefully.
      *   *Revision:* "Partiality requires a rationale that does not violate the equal moral worth of outsiders." That's safer.

  9.  **Review and Refine:**
      *   Check tone: Is it handout-ready? Yes.
      *   Check constraints: Numbered claims? Yes. Table? Yes. Cruxes? Yes. Cases (a-d)? Yes. Verbal dispute? Yes. Confidence? Yes.
      *   *Self-Correction on Joint Statement:* Make sure Claim 3 doesn't sound like a compromise that solves the problem. It needs to acknowledge the *tension* without resolving it. "Both relational and structural facts are relevant" is safe because PP prioritizes relational, C prioritizes structural, but neither denies the existence of the other.
      *   *Refining the Table:* Ensure the wording isn't biased. Instead of "PP says X, C says Y," use "Question: Is the ground intrinsic or instrumental?" and list the answers.
      *   *Refining Cases:* Ensure the link to the Crux is explicit.

  10. **Final Polish:** Check for clarity and philosophical precision. (e.g., distinguishing "permission" from "duty"). Ensure the "Verbal Dispute" section identifies the specific term ("Nation" or "Obligation").

  *(Self-Correction during drafting the response)*: I need to make sure the "Joint Statement" doesn't sound like they agreed to disagree, but rather that they agreed on the *framework*. The prompt asks for claims they *both accept*.
  *Claim 1:* Special claims involve prioritization. (Safe)
  *Claim 2:* Equal moral worth is the baseline. (Safe - PP doesn't think compatriots are *superhuman*, just specially related).
  *Claim 3:* Institutions and Identity both play *a* role (just disagree on which is primary).

  *Case (a) Collapsed State:* PP says obligation persists (identity). C says obligation dissolves (no reciprocity).
  *Case (b) Resident:* PP says weaker (no identity). C says equal (reciprocity).
  *Case (c) Ship:* PP says none (no nation). C says yes (cooperation).
  *Case (d) Passport only:* PP says yes (legal tie). C says no (no interaction).

  *Verbal Dispute:* The definition of "Compatriot." Is it legal status or shared life?
  *Confidence:* I'm least sure about the Joint Statement Claim 3. Hardline PP might say institutions don't matter at all, only identity. Hardline C might say identity matters zero. I will phrase it as "Both acknowledge the existence of both factors, but dispute their normative weight."

