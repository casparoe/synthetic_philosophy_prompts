answer: |-
  **TO:** Grant Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Finalist Allocation ($10M)

  **Executive Summary**
  I recommend we fund **Proposal B**, but not primarily on the strength of its anthropic argument. While Proposal A relies on the Self-Sampling Assumption (SSA) and Proposal B on the Self-Indication Assumption (SIA), relying on anthropics alone to decide this grant is epistemically hazardous. I argue we should adopt **SIA** as our working framework because SSA is too sensitive to reference-class manipulation, but we must reject Proposal B's secondary "existence" argument as invalid decision theory. The grant should be justified by standard expected-value calculations regarding existential risk reduction, with SIA serving only as a tie-breaker against Doomsday-style pessimism.

  **1. Diagnosing the Anthropics**
  The disagreement here is a textbook conflict between two anthropic principles:

  *   **Proposal A (SSA / Doomsday Argument):** This relies on the **Self-Sampling Assumption**. It treats us as a random sample from the set of all observers. Since we find ourselves relatively early in human history (approx. 100 billionth human), SSA implies the total number of humans is likely not vastly larger than the number so far. This compresses the future, reducing the multiplier for longtermist interventions.
  *   **Proposal B (SIA):** This relies on the **Self-Indication Assumption**. It weights worlds by the number of observers they contain. Since a "huge future" world contains vastly more observers than a "doom soon" world, SIA implies we are vastly more likely to find ourselves in the huge future world. This cancels the Doomsday Argument, restoring the longtermist multiplier.

  **2. Which Assumption to Adopt?**
  We must pick one to operationalize our mission. I recommend we adopt **SIA**.

  **Reasoning:** The SSA (Proposal A) is critically dependent on the **reference class**. Is the class "all humans"? "All conscious beings"? "All observer-moments"? If we define the class as "observers who know their birth rank," the Doomsday conclusion vanishes. Because SSA results swing wildly based on how we carve up "observers," it is too fragile for high-stakes policy.

  SIA is more robust for our purposes. While it leads to the "Presumptuous Philosopher" problem (believing the universe is huge simply because we exist), this is a better failure mode for a *longtermist* foundation than SSA's "Doomsday" failure mode. SSA systematically discounts the future based on indexical facts rather than empirical evidence. If we accept SSA, our mission becomes mathematically incoherent; if we accept SIA, our mission remains viable.

  **3. The "Bonus" Argument (Acausal Decision Theory)**
  Proposal B's claim that "funding B makes you more likely to exist" is **not** a valid anthropic argument; it is a claim about **acausal decision theory** (specifically Functional Decision Theory or Timeless Decision Theory). It suggests our choice now is logically correlated with the world structure that produced us.

  **Recommendation:** We must reject this reasoning for grantmaking. While interesting philosophically, betting $10M on acausal correlations violates our fiduciary duty to act on causal evidence. We should fund B if B *causes* a better future, not if funding B is a *symptom* of us being in a better future.

  **4. Concrete Course of Action**
  **Fund Proposal B.**

  **Conditions:**
  1.  **Justification:** The grant write-up must justify the investment based on empirical estimates of existential risk reduction (tractability, neglectedness, importance), *not* on the SIA probability update. SIA should be cited only to dismiss the Doomsday Argument as a reason to discount the future.
  2.  **Reference Class Audit:** Proposal B must explicitly define the "observer" class used in their models. If they rely on a reference class that is too broad (e.g., "all possible minds"), we risk the Presumptuous Philosopher problem. They should anchor to "civilization-scale observers."
  3.  **Mission Fidelity:** Voting for A would effectively dissolve the foundation's purpose. If we accept the Doomsday Argument (SSA) as decisive, we should return the endowment to donors, as longtermism becomes numerically inferior to near-term aid. Since we exist to pursue longtermism, we must reject SSA as a policy blocker.

  **5. What Would Change My Mind**
  *   **Empirical Doom:** If new empirical evidence (e.g., unavoidable environmental collapse, unalignable AI dynamics) suggests the future is physically constrained to be small regardless of anthropics, I would switch to A. Anthropics cannot override physical evidence.
  *   **Reference Class Consensus:** If the philosophical community reached a strong consensus that the "correct" reference class for SSA is "biological humans" (narrow) rather than "observers" (broad), the Doomsday Argument would gain significant weight, making A more competitive.

  **6. Where I Might Be Wrong**
  *   **The Presumptuous Philosopher:** I may be underestimating the danger of SIA. SIA can justify believing in physically implausible worlds simply because they contain more observers. If the "huge future" is physically impossible, SIA leads us to bet on a fantasy.
  *   **Decision Theory:** I am dismissing the "Bonus Argument" (acausal decision theory) as too speculative. If FDT/ADT is correct, ignoring the correlation between our decision and our existence could mean we are systematically leaving value on the table. However, given the current lack of consensus, it is too risky to base a grant on it.

  **Bottom Line:** Proposal A uses anthropics to shrink the pie. Proposal B uses anthropics to keep the pie large. We should assume the pie is large (SIA), but we must bake it using empirical ingredients, not anthropic magic. Fund B.
