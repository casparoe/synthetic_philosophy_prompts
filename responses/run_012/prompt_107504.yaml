answer: |-
  **Joint Statement on the Cluelessness Objection to Consequentialism**

  **Participants:** Friend A (The Skeptic) and Friend B (The Bayesian)
  **Date:** October 26, 2023
  **Subject:** Resolution of Dispute Regarding Epistemic Access and Normative Force in Consequentialist Ethics

  After a period of adversarial collaboration, we have distilled our debate regarding the "cluelessness objection" into the following document. We acknowledge that while we have not converted one another, we have successfully isolated the precise points of friction and separated substantive philosophical disagreements from terminological confusion.

  ### 1. Agreed Claims

  We both endorse the following propositions as an accurate map of the terrain we are fighting over:

  1.  **The Core Commitment:** We agree that consequentialism, at its heart, claims the moral rightness of an act depends on the value of its outcomes compared to available alternatives. If two acts produce identical outcomes, they are morally equivalent.
  2.  **Epistemic Limitation vs. Indeterminacy:** We distinguish between two types of ignorance.
      *   *Type I (Ordinary Uncertainty):* We do not know which outcome will occur, but we can assign sensible probabilities (credences) to a defined set of possibilities.
      *   *Type II (Structural Cluelessness):* The causal chain is so complex, infinite, or chaotic that we cannot define the set of outcomes, nor can we assign stable probabilities. In this scenario, the Expected Value (EV) of an act may be mathematically undefined or infinitely volatile.
  3.  **Criterion vs. Procedure:** We agree that a significant portion of our argument stemmed from conflating the *criterion of rightness* (what makes an act good) with the *decision procedure* (how an agent chooses). We agree that consequentialism can survive as a criterion of rightness even if it fails as a real-time decision procedure for non-omniscient beings.
  4.  **The Verdict on Objective Consequentialism:** We agree that *Objective Consequentialism* (the command to "actually produce the best outcome") is action-guidingly dead for human beings. Neither of us believes a human can be morally obligated to do what only a god could verify.
  5.  **The Verbal Dispute:** We acknowledge that roughly 40% of our heat was generated by Friend A using "Consequentialism" to mean "A practical system for humans to use right now" and Friend B using it to mean "The metaphysical standard by which acts are judged." We agree to stipulate that the remaining disagreement is about whether *Subjective Consequentialism* (maximize expected value based on available evidence) survives Type II Cluelessness.
  6.  **The Butterfly Effect:** We agree that small everyday acts (e.g., buying a coffee) have causal ripples that extend indefinitely into the future. We agree that these ripples *could*, in principle, alter history on a massive scale (e.g., delaying a meeting that prevents a war, or enabling one).

  ### 2. Disagreements Table

  The following table outlines the residual substantive disagreements. The phrasing in the "Friend A" and "Friend B" columns has been approved by the respective party as a charitable and accurate representation of their view.

  | Topic | Friend A's Position (The Skeptic) | Friend B's Position (The Bayesian) |
  | :--- | :--- | :--- |
  | **The Status of Expected Value** | In cases involving infinite or chaotic causal chains, the Expected Value integral does not converge. There is no "number" to maximize. The probability distribution is so fat-tailed that the EV is undefined, not just unknown. | Even if the distribution is wide, rational agents must act on subjective credences. If the EV is undefined, we use heuristic approximations. The lack of mathematical precision does not negate the normative obligation to aim for the best *estimate*. |
  | **Action-Guidance** | If a moral theory cannot distinguish between Act X and Act Y in a specific case because the long-term EV is noise, the theory has failed. A theory that says "we cannot tell if saving a life is better than buying lunch" is practically useless. | A moral theory does not need to distinguish every possible pair of acts to be valid. It only needs to guide us where the signal is stronger than the noise. In most local contexts, near-term consequences dominate far-term noise. |
  | **The "Sinking" Claim** | The cluelessness objection sinks consequentialism because it severs the link between *rational deliberation* and *moral truth*. If we can't reason our way to the answer, the "moral truth" is irrelevant to agency. | The objection highlights the difficulty of the world, not a flaw in the theory. Consequentialism correctly identifies that we are navigating fog. The fact that the fog is thick doesn't mean the compass is broken; it means the terrain is hard. |
  | **Probability Assignments** | We are not licensed to assign probabilities to far-future historical contingencies. Assigning a 0.0001% chance to "this coffee causes a war" is pretend precision. It is epistemically dishonest. | We are *forced* to assign probabilities by the necessity of action. Refusing to assign a credence is itself a decision. Vague credences (e.g., "between 0.00001% and 0.01%") are sufficient for decision-making. |

  ### 3. The Cruxes and Concrete Case

  To move forward, we identified specific sub-questions where new evidence or argumentation would actually change our minds. We have selected one concrete case to test these cruxes.

  **The Concrete Case: The Coffee vs. Charity Dilemma**
  *Scenario:* Friend B has $5. Option A is to buy a specialty coffee. Option B is to donate the $5 to a high-confidence malaria prevention charity.
  *The Ripple:* Friend A argues that buying the coffee might make B friendlier to a stranger later, who later invents a technology that saves millions (or kills millions). The far-future EV is dominated by these astronomical, low-probability tails.
  *The Local View:* Friend B argues the near-term EV (preventing malaria now) vastly outweighs the speculative far-future ripple of the coffee.

  **Crux 1: Convergence of Expectations**
  *Question:* Does the Expected Value of the "Coffee" act diverge (become infinite or undefined) due to the possibility of extreme far-future outcomes, rendering it incomparable to the "Charity" act?
  *   **Test:** We agree to examine the "Pascal's Mugging" literature and formal decision theory regarding infinite utilities.
  *   **Friend A's Prediction:** If we model the causal chain honestly, the variance is so high that the EV of the coffee is mathematically unstable. Therefore, consequentialism cannot declare Charity the winner.
  *   **Friend B's Prediction:** Even with fat tails, the probability of the coffee causing astronomical good/bad decays faster than the value of the outcome grows. The EV converges, and the Charity act remains the clear winner based on near-certain near-term effects.

  **Crux 2: The "Ought Implies Can" Threshold**
  *Question:* At what point does epistemic difficulty render a moral obligation void?
  *   **Test:** We will construct a gradient of cases from "Clear" (save drowning child) to "Opaque" (vote in election with unknown long-term impact).
  *   **Friend A's Prediction:** There is a sharp cliff. Once the long-term ripple effects dominate the calculation (even if unlikely), the obligation vanishes because the calculation is impossible. The Charity case might be on the "safe" side, but the theory breaks immediately after.
  *   **Friend B's Prediction:** There is a smooth gradient of confidence. The obligation weakens as uncertainty grows, but it never hits zero. The Charity case is well within the "high confidence" zone, so the obligation holds strong.

  **Verdict on the Concrete Case:**
  *   **Do we agree on the verdict?** *Provisionally, Yes.* Both Friend A and Friend B agree that in the specific Coffee vs. Charity case, donating to the malaria charity is the rational choice.
  *   **Do we agree on *why*?** *No.*
      *   **Friend B** believes we choose Charity because the EV is clearly higher.
      *   **Friend A** believes we choose Charity only because we are *ignoring* the long-term ripples out of necessity. Friend A argues that if we were truly consistent consequentialists, we would admit we have no idea which act is better, and thus the theory has failed to provide an answer, even if our intuition matches Friend B's.

  **Signatures:**

  _________________________ (Friend A)

  _________________________ (Friend B)
