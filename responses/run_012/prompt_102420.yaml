answer: |-
  ### Strategic Assessment: Is the Framing Confused?

  Your framing is not confused; it is analytically sharper than most academic treatments of the "Right to the City" (RTC) in local planning. You have correctly identified that RTC functions as a "floating signifier"—a slogan everyone uses but means different things.

  However, to ensure the project yields a **determinate answer** (as you requested), I suggest a slight pivot in the research question. Asking *"Can it coherently hold both parts?"* risks a philosophical "no" that doesn't help your committee. Asking *"Which part must be prioritized to prevent the right from becoming a tool of exclusion?"* forces a hierarchy.

  **The Pivot:** I have framed the proposal to argue that **substantive access (the right to stay) must constrain procedural power (the right to decide).** If procedural participation is allowed to veto substantive access, the "Right to the City" collapses into a "Right to Exclude." This gives you a clear normative stance to test.

  **On Method:** Your instinct to use Hohfeld is excellent. Planning meetings are quasi-legal; they run on motions, variances, and standing. Hohfeldian analysis strips away the moralizing ("community character") and reveals the mechanical levers ("I have the *power* to block, which negates your *claim* to housing"). It is superior to pure interviews because interviews capture *perceptions* of power, whereas Hohfeld maps the *architecture* of power.

  Below is the draft proposal, sized for approximately three single-spaced pages.

  ***

  **Project Title:** The Veto and the Vote: Reconstructing the Right to the City in Local Land Use Review

  **Project Summary**
  This project investigates a critical contradiction in local land use planning: the weaponization of participatory democracy to enforce housing exclusion. In neighborhood planning committees, the "Right to the City" is invoked by both long-term residents demanding veto power over development and tenants demanding protection from displacement. Currently, these claims are treated as equally valid democratic inputs, leading to stalemate or exclusionary outcomes.

  This fellowship will produce a normative framework and a set of procedural recommendations for neighborhood planning committees. By applying a Hohfeldian legal analysis to recent variance cases, I will demonstrate that procedural "rights to decide" cannot coexist with substantive "rights to stay" unless the former is structurally constrained by the latter. The final deliverable will be a policy brief outlining specific changes to committee charters and public comment rules that prioritize housing access without eliminating community input.

  **Statement of Need: The Stalemate of Participation**
  For the past two years, I have served as the sole renter representative on a neighborhood planning committee responsible for reviewing rezoning and variance applications. In this capacity, I have observed a consistent pattern: the language of democratic participation is used to justify exclusionary outcomes.

  Current discourse on NIMBYism and the Right to the City leaves this tension unresolved.
  1.  **The Proceduralist View:** Argues that the "Right to the City" is primarily about self-governance. If existing residents have a say in zoning, they exercise this right. This view ignores that "existing residents" are often a demographically unrepresentative subset (homeowners, long-term incumbents) whose "say" effectively vetoes housing for newcomers or lower-income renters.
  2.  **The Substantive View:** Argues that the "Right to the City" is a claim to resources and residence. However, this view often dismisses local process entirely as a sham, advocating for state-level preemption that bypasses community input. This fuels resentment and ignores the legitimate need for communities to manage change.

  The gap is mechanical. We lack a framework that explains *how* procedural power converts into exclusionary outcomes, and *where* in the process substantive rights should trump procedural claims. Without this, planning committees remain arenas where the "Right to the City" is used by incumbents to deny the right to the city for others. This project addresses that gap by moving from slogan to structure.

  **Research Question**
  *Does the coherence of the "Right to the City" in a housing justice context require that substantive claims to access (the right to stay) legally constrain procedural powers of exclusion (the right to decide)?*

  This question demands a determinate answer. If the answer is "no," then the Right to the City is incompatible with local land use review, and committees should be abolished or stripped of power. If the answer is "yes," then committee structures must be reformed to prevent procedural vetoes from overriding housing access.

  **Methodology: Hohfeldian Decomposition and Case Testing**
  I will employ a two-phase mixed method, combining legal theory with empirical case study.

  **Phase 1: Hohfeldian Mapping**
  I will decompose the "Right to the City" into Wesley Hohfeld's four fundamental legal incidents: *Claims, Privileges, Powers, and Immunities.* I will map these incidents against three distinct stakeholder groups:
  *   **Incumbents:** (Homeowners/Long-term renters currently in the neighborhood).
  *   **Excluded Newcomers:** (Potential residents priced out or blocked by zoning).
  *   **The City/Committee:** (The administrative body granting approval).

  *Hypothesis:* I anticipate finding that Incumbents hold a *Power* (to delay/block via variance objection) that creates an *Immunity* (from change), which directly extinguishes the *Claim* of Excluded Newcomers (to access housing). The "Right to the City" becomes incoherent when a Power held by Group A negates the essential Claim of Group B.

  **Phase 2: Case Stress-Testing**
  I will select four recent variance applications from my committee's records that resulted in contentious public hearings.
  *   **Case A:** A variance blocked by homeowner opposition.
  *   **Case B:** A variance approved despite tenant concerns about displacement.
  *   **Case C:** A "missing middle" project that passed with modifications.
  *   **Case D:** A affordability covenant negotiation.

  For each case, I will reconstruct the hearing transcript and decision log to identify exactly which Hohfeldian incidents were exercised. Who had the *privilege* to speak? Who had the *power* to motion? Did the committee have the *immunity* from appeal, or the *liability* to political pressure?

  This method is superior to standard interviews because interviews capture *why* people think they acted (rationalization), whereas Hohfeldian analysis captures *what* authority they actually wielded (mechanism). It moves the analysis from "people are greedy" to "the rules allow this specific veto."

  **Scope and Timeline (8 Months, Part-Time)**
  *   **Months 1-2: Framework & Selection.** Finalize the Hohfeldian definitions in the context of municipal code. Select the four case studies from committee archives.
  *   **Months 3-5: Analysis.** Conduct the mapping. Draft the "Conflict Matrix" showing where incidents collide.
  *   **Months 6-7: Synthesis & Design.** Develop the structural recommendations. (e.g., If Incumbent Power is the problem, do we limit standing? Do we weight tenant testimony higher? Do we remove variance rights for certain zones?)
  *   **Month 8: Writing & Review.** Draft the final policy brief and academic paper. Circulate to fellowship mentors and committee peers for feedback.

  **Deliverables**
  1.  **A Policy Brief (10 pages):** "Procedural Justice vs. Housing Justice." Directed at city planning departments and neighborhood associations. It will offer 3-5 specific rule changes for planning committees (e.g., limiting variance standing to directly affected abutters rather than general neighborhood opposition).
  2.  **A Working Paper (25 pages):** The theoretical argument regarding the hierarchy of RTC claims.
  3.  **A Workshop Module:** A 90-minute session I can run for my own planning committee to test the findings in real-time.

  **Failure Conditions and Risk Mitigation**
  I am defining success as producing actionable structural recommendations. The project will be considered a failure if:
  1.  **The Contradiction is External:** If the analysis reveals that the committee has no real power, and the conflict is actually driven by state-level zoning or market forces beyond the committee's scope. *Mitigation:* I will scope the case selection to ensure they are decisions where the committee actually had discretion.
  2.  **The Framework is Too Abstract:** If the Hohfeldian analysis does not translate into clear rule changes. *Mitigation:* I will validate the recommendations against my own committee's bylaws in Month 6 to ensure they are legally viable within the current municipal code.
  3.  **The Normative Claim Fails:** If I cannot demonstrate that prioritizing access over process is legally or politically defensible. *Mitigation:* I will ground the argument in existing housing justice statutes and anti-displacement policies already on the books, using them as the "higher law" that constrains procedure.

  **Why This Project Now**
  As a renter on a planning committee, I occupy a unique vantage point. I am inside the machine that usually grinds renters down. This fellowship allows me to step back from the monthly grind to analyze the gears. Housing justice organizations often focus on tenant defense (eviction court) or macro-policy (state zoning). There is a missing middle: the micro-politics of the variance hearing where housing is actually won or lost. This project targets that gap.

  By determining that the "Right to Stay" must hierarchically constrain the "Right to Decide," we can stop treating all community input as equal. Some input preserves the city for the few; some input builds the city for the many. A planning committee structured around housing justice must know the difference.
