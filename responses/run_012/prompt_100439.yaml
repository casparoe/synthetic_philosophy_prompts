prompt: |-
  I'm in this little reading group that's been chewing through some decision theory stuff, and last week we landed on risk-weighted expected utility, which I'd somehow never actually thought about. The idea (as I understand it, correct me if I've garbled it) is that you're not supposed to just multiply each outcome by its probability like a normal expected-utility maximizer; instead you line the outcomes up from worst to best, and then you weight each one by a "risk function" applied to the cumulative probability of doing at least that well — so the weight an outcome gets depends on how much bad stuff sits below it in the ranking, not just on its own odds. If your risk function is a straight line you're back to plain expected utility, if it's bent one way you get risk aversion, and if you bend it as far as it'll go you basically only care about the single worst outcome (maximin). My friend keeps insisting this is obviously the right theory because it explains why people turn down the Allais gamble, and I keep saying the risk function looks like a free parameter you can tune to justify any attitude you already had.

  Anyway, I want to make fun of this for the group, but I want it to be about the theory and not just a generic "economists are weird" bit. Could you write me a deadpan advice column — a letter from someone who's tried to run their entire life on risk-weighted expected utility and is now totally paralyzed, plus the columnist's reply — in the style of a Dear Abby / Ask Amy personal-finance page? The humor should come out of the mechanics: the sorting of outcomes, the cumulative probabilities, the risk function being some number they keep fiddling with, the way an extreme risk function collapses "best advice" into "never do anything," and the columnist never once noticing that they're just laundering their own risk appetite through a formula. Keep the columnist internally consistent — they should stay an REU person the whole way through, and shouldn't slip into "just maximize expected value" as the punchline unless that's the actual joke. Maybe 600 words, letter plus reply, with a little sign-off at the end. It's for a reading group so the in-jokes can get a bit technical, but please don't assume I remember any specific paper or who wrote it — just the idea, which I've tried to lay out above.
