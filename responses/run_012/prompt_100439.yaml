answer: |-
  **Dear Expected,**

  I hope you can help. Six months ago, I decided to stop living like a naive expected-utility maximizer and restructure my life around Risk-Weighted Expected Utility (REU). I thought it would bring clarity. Instead, I haven't left my apartment in three weeks.

  The problem is the sorting. Every decision requires me to line up every possible outcome from worst to best before I can assign weights. Yesterday, I spent four hours trying to determine whether "spilling hot coffee on my shirt" is strictly worse than "being ten minutes late to work." But even once I ranked them, I froze at the risk function. I know I'm supposed to weight each outcome by applying a function to the cumulative probability of doing *at least* that well. But what shape should the function be?

  If I make it linear, I'm back to plain expected utility, which feels reckless. If I curve it too aggressively toward the bottom tail, the calculation tells me the optimal choice is always to remain seated in my armchair (status quo utility: 5; risk of death crossing hall: 0.0001). My friend says I'm just tweaking the function until it spits out the answer my anxiety already wanted, making the whole formula a circular justification for cowardice. Is this a bug, or am I just calibrating incorrectly?

  **Stuck in the Cumulative**

  ***

  **Dear Stuck,**

  First, take a deep breath. Your friend is speaking from the perspective of a standard expected-utility theorist, and frankly, their linear worldview is outdated. They see the risk function as a constraint; you must see it as an expression of self.

  You ask if tweaking the function to match your pre-existing attitudes is circular. I ask: what is decision theory for, if not to formalize how you feel about risk? The beauty of REU is that it allows you to launder—sorry, *codify*—your intuitive risk aversion into a rigorous mathematical structure. If adjusting the curvature until you feel comfortable makes the theory "fit," that isn't a bug; it's parameter estimation. You are discovering your true risk attitude through the tuning process.

  Regarding your paralysis: if your current risk function assigns such low weight to the cumulative probability of positive outcomes that leaving the armchair yields negative risk-weighted utility, then staying seated is simply the rational choice. Do not let the EU-maximizers shame you into crossing the street just because the probability of getting hit by a bus is low. They care about the average; you care about the structure of the downside.

  However, if you wish to move again, I suggest experimenting with your risk function's bounds. Try a "maximin" approach for low-stakes decisions: focus only on the worst-case scenario. If the worst case of making toast is burnt bread, proceed. If the worst case of leaving the house is existential doom, stay put. There is no universal risk function, only the one that lets you sleep at night.

  Embrace the curvature.

  **Dear Expected**

  ***

  *Send your decision dilemmas to Dear Expected, c/o The Journal of Philosophical Logistics. Please include your utility function in cardinal units.*
