answer: |-
  My young friend, you wield the syntax of Carnap like a scalpel, precise and cold, but you forget that science is not only an operation in the sterile room; it must walk the streets. You are right that a picture alone, without convention, cannot speak logic. But tell me, does your logical syntax not rely on conventions too? When you write a quantifier, you rely on a trained eye to read it as universal. I propose only that we train the eye to read arrangements rather than strings of words. You say a crossed-out figure is verbal language in costume; I say it is a visual interruption, understood immediately by the miner or the clerk without the baggage of the verb "to be." The metaphysics hides in the grammar of subject and predicate, implying substances and essences. The picture shows only arrangements of elements. If I show a row of ten workers and three are faded out, I have not said "not" in words, I have shown absence. Is this not closer to the physicalist stance we both cherish?

  You charge me with smuggling rhetoric, but I charge verbal language with smuggling ontology. When you say "if wages had risen," you invoke a ghostly realm of unrealized possibilities. My picture language prefers to show the sequence: here wages are low, here strikes occur; there wages are higher, here strikes cease. We show the transformation, the trend, without claiming a metaphysical causal force hidden behind the numbers. You demand the conditional "if"; I offer the visual sequence. Is this not sufficient for the social science we aim to unify? We are rebuilding the boat at sea, as I have often said. We cannot wait for a perfect logical foundation before we communicate. We must use the planks we have. If a visual convention helps the worker understand the economic trend, it is a valid plank, even if it lacks the formal purity of the *Principia*.

  So, do not ask me to choose between your logic and my pictures as if they are enemies. They are tools for different moments in the collective enterprise. But if the Unity of Science is to mean anything, it must unite the specialist with the person in the street. Your syntax excludes them; my pictures invite them in. Let us test the conventions. Let us draw the "not" as a barrier, the "all" as a completed field, the "if" as a path. If the worker understands, have we not succeeded where metaphysics fails? Come, take up the pencil. Show me how you would draw the strike without words, and let us see if your logic holds when faced with the need to be understood by the many.
