answer: |-
  **The Case**

  In a tertiary care intensive care unit, two attending physicians, Dr. Alpha and Dr. Beta, manage identical patients in refractory septic shock with multi-organ failure. Both patients have surrogates who request a trial of hemodynamic support but insist on withdrawal if no improvement occurs within two hours. Both physicians possess identical information, competence, and access to resources, and neither has any prior relationship with their patient. Dr. Alpha initiates a continuous norepinephrine infusion; after two hours shows no physiological improvement, she discontinues the infusion, and the patient dies of shock at hour four. Dr. Beta, assessing an identical patient at the same disease stage, determines immediately that a trial would be futile relative to the patient's goals; she never initiates the infusion, and the patient dies of shock at hour four. The physiological cause of death, the timing, the documentation, and the decision-making protocol are identical; the only physical difference is that in Alpha's scenario the tubing was connected and flow established before cessation, whereas in Beta's scenario the tubing remained capped. Does the choice of intervention matter? Physiologically, no, provided the intervention is life-sustaining and reversible only while ongoing; morally, the intuition may strengthen with invasive interventions, but the logical structure of the case remains invariant whether the intervention is a vasopressor drip, IV fluids, or antibiotics.

  **Verdicts and Reasoning**

  (i) **The Acts/Omissions Doctrine:** This position holds that there is a intrinsic moral asymmetry between causing harm and permitting it. On this view, Dr. Alpha is morally worse off than Dr. Beta. By initiating the infusion, Alpha inserted herself into the causal chain; her subsequent action (turning off the pump) is the proximate cause of the immediate physiological collapse. Beta merely omitted to intervene in a natural process already underway. Because bringing about a death requires stronger justification than allowing one, Alpha bears a heavier burden of proof. Since the outcome and justification are stipulated as identical, Alpha's action remains morally more suspect than Beta's omission, even if both are ultimately permissible.

  (ii) **The Equivalence View:** This position maintains that the distinction between doing and allowing is morally irrelevant when intentions, outcomes, and certainty are held constant. On this view, Dr. Alpha and Dr. Beta are morally on a par. Both agents formed the identical intention (the patient should not survive this episode), utilized identical reasoning (futility relative to goals), and achieved the identical outcome (death at hour four). The physical history of the tubing is causally relevant but morally inert. To judge Alpha more harshly is to fetishize the movement of muscles over the structure of agency; both agents decided that death was the optimal outcome and ensured it happened.

  (iii) **The Normative Baseline Account:** This position argues that "doing" and "allowing" are not fixed by physics but by the normative expectations attached to the agent's position. Classification depends on whether the norm requires maintenance or non-interference. For Dr. Alpha, once the infusion is started, the normative baseline shifts: the standard of care requires maintaining established life support unless specific criteria for withdrawal are met. Thus, stopping the infusion is a "doing" (a departure from the required maintenance). For Dr. Beta, the norm requires only non-interference or assessment; there is no duty to start futile or unwanted treatments. Thus, not starting is an "allowing." The verdict here aligns with (i) not because of the physics of causation, but because the norm applicable to Alpha is stricter than the norm applicable to Beta. The moral difference lies in the violation of distinct duties, not the sequence itself.

  **The Feature Doing the Work**

  The feature doing the work in this case is the **shift in the normative baseline** created by the initiation of treatment. In Alpha's scenario, the "status quo" becomes *patient on support*; returning the patient to *patient off support* is an active change. In Beta's scenario, the status quo is *patient off support*; leaving the patient there is passive continuity. If this feature is removed—that is, if we stipulate that initiating treatment creates no new normative expectation or duty to continue—the distinction collapses. Without the baseline shift, Alpha's stopping is physically identical to Beta's not-starting (both result in no drug entering the vein). Once the baseline shift is removed, verdict (i) loses its grip because the "harm" of stopping is no longer distinct from the "harm" of not starting. Verdict (ii) becomes dominant, as the physical sequence is revealed as irrelevant without the normative weight attached to the established state. Verdict (iii) becomes indeterminate, as there is no norm to fix the classification of the act.

  **The Attack from the Acts/Omissions Defender**

  A defender of position (i) would attack this case by arguing that the specification "hold everything else fixed" is impossible to satisfy. They would claim the case smuggles in a **special obligation**. By initiating the infusion, Dr. Alpha creates a relationship of dependency and an assumption of care that Dr. Beta does not. The patient (or surrogate) relies on Alpha in a way they do not on Beta. Therefore, the sequence *cannot* be the only variable; the initiation itself generates a new duty to continue that did not exist prior to the start. The attack succeeds insofar as it demonstrates that the moral intuition supporting (i) relies not on the physical sequence (start/stop vs. never start) but on the normative consequences of starting (the creation of a duty). If the defender can show that starting always generates a stronger obligation than not starting, then the case fails to isolate the sequence as the independent moral variable. The intuition that Alpha is worse off is not about the *motion* of stopping, but about the *breach of the established care relationship*.

  **Conclusion**

  The sequence cannot carry the moral weight on its own. The physical difference between stopping a treatment and never starting it is morally inert without a prior assumption about the normative status of the baseline. To make the sequence matter, you need the additional premise that **initiating aid creates a stronger moral obligation to continue than exists to initiate aid in the first place.** Without this premise, the distinction between doing and allowing in this context collapses into a distinction between different normative baselines, rendering the sequence itself a proxy for the obligation rather than a source of it.
