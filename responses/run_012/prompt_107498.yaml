answer: |-
  You have put your finger on the central paradox of the art market and museum practice. The phenomenon you describe reveals that the art world is not, despite its rhetoric, committed to a purely perceptual theory of aesthetic value. If it were, a perfect visual match would suffice. Instead, the practice presupposes a theory of **genetic essentialism** or **historical particularism**.

  To unpack this, we must reconstruct the implicit ontology of the artwork that governs galleries, auction houses, and conservation departments.

  ### The Implicit View: The Autographic Nature of Art

  The practice commits to the view that an artwork's identity is constituted not merely by its visual properties, but by its **history of production**. In philosophical terms, following Nelson Goodman's distinction in *Languages of Art*, painting is treated as an **autographic** art form. This means that even the most exact duplicate of a work, if it does not share the correct causal history (i.e., it was not produced by the specific agent at the specific time), is not the same work.

  When a painting is reattributed from a master to a pupil, the object remains physically identical, but its *art-historical status* changes. The market collapse indicates that value is tethered to the **provenance of the gesture**, not just the result of the gesture. The brushstroke is valued as a trace of a specific body and a specific moment in history, akin to a relic.

  Therefore, the secret commitment is this: **The artwork is an event frozen in matter, not merely an image displayed on matter.**

  ### Separating Requirements from Compatible Stories

  We must distinguish what this practice *strictly requires* from narratives that merely fit comfortably alongside it.

  **1. The 'Contact with the Maker' Story (Compatible but Insufficient)**
  It is tempting to say we value the physical touch of the genius—the idea that the master's hand brushed the canvas. This fits the reattribution scenario well. However, it struggles with the bronze cast example you raised. A bronze is often cast from a mould, sometimes posthumously, by foundry workers, yet it is accepted as an 'original' if authorised by the artist's estate. Here, the physical touch of the master is absent, yet the value remains. Thus, while 'contact' is a potent romantic narrative, it is not the strict logical requirement.

  **2. The 'We Hate Being Deceived' Story (Compatible but Insufficient)**
  One might argue that forgeries are destroyed because they represent a lie. We feel cheated. However, this fails to explain the reattribution scenario. When a work is downgraded from master to pupil, no deception is necessarily uncovered; workshop collaboration was standard practice. Yet the value still plummets. Furthermore, if deception were the only sin, a confessed forgery (like those by Han van Meegeren) should retain value as a historical curiosity of deceit. Instead, they are often treated as contaminated objects, stripped of the authority to speak for the period they mimicked.

  **3. The Strict Requirement: Ontological Singularity**
  What the practice strictly requires is the belief that the **authority of the work derives from its specific origin point**. The artwork functions as a piece of historical evidence. A Vermeer is valuable not just because it is beautiful, but because it is a verified document of Vermeer's engagement with the world in the 17th century. A forgery is a false document; a pupil's work is a document of the pupil, not the master. The strict requirement is that the work's identity is inseparable from its specific causal lineage.

  ### Internal Consistency

  Is this package internally consistent? Largely, yes, provided one accepts the distinction between the *work* and the *image*.

  The apparent contradiction lies in the acceptance of reproductions and casts. If history matters, why is a plaster cast of a lost sculpture valued? The consistency is maintained through the concept of **authorisation**. A high-quality poster in a museum shop is sold as a reproduction; no one claims it is the work. A bronze cast is accepted because it falls within the 'edition' authorised by the creator (or their legal successor). The art world draws a sharp line between *multiples* (authorised repetitions) and *copies* (unauthorised or deceptive repetitions).

  However, there is a tension. If the value is in the 'event' of creation, posthumous bronze casts are theoretically problematic. The art world resolves this by shifting slightly towards an institutional theory: the 'work' is defined by the artist's intent and the estate's validation, rather than the strict physical touch. This is a pragmatic compromise, but it remains consistent with the broader view that the *status* of the object matters more than its *surface*.

  ### The Perceptual Theory Alternative

  If we were to switch to a straightforwardly perceptual theory of value—where the aesthetic experience is the sole source of worth—the art world would have to undergo a radical transformation:

  1.  **The Collapse of the Market:** Auction prices would stabilise around the cost of materials and the quality of the visual experience. A perfect forgery would sell for the same as the original. The speculative investment model, which relies on scarcity and authenticity, would vanish.
  2.  **Museum Display:** Museums would display forgeries alongside originals if they offered a superior visual experience. A well-preserved copy of a faded Raphael would be preferred to the damaged original. The 'aura' of the object would be irrelevant; the clarity of the image would be paramount.
  3.  **Destruction of Fakes:** Exposed forgeries would not be hidden. They would be celebrated as triumphs of skill and displayed as 'equivalent experiences'. The moral stigma of forgery would disappear, replaced by a label of 'unattributed'.
  4.  **Reattribution Irrelevance:** A painting downgraded from master to pupil would retain its value if the visual quality remained high. Art history would become a study of styles rather than biographies of genius.

  ### Conclusion

  The art world's practice presupposes that art is a form of **testimony**. We value the original because we value the witness. When we stand before a Rembrandt, we are not merely looking at a pattern of light and dark; we are standing in the presence of a specific historical act performed by a specific individual.

  To adopt a perceptual theory would be to treat art as decoration or visual stimulation. To maintain the current practice is to treat art as **history made visible**. The inconsistency you sense arises only if one assumes the primary purpose of art is visual pleasure. If one accepts that the primary purpose is the preservation and veneration of human creative agency, then the collapse in value upon reattribution is not odd at all; it is the logical consequence of discovering that the witness we thought we were listening to is, in fact, someone else.

  In short, the art world is committed to the idea that **who did it is part of what it is.**
