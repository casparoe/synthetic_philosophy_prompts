prompt: |-
  i keep noticing somthing odd about how the art world treats originals and I'd like you to unpack what it's secretly committed to. When a painting gets reattributed from the master to a pupil in his workshop, nothing about the object changes -- same canvas, same paint, same look on the wall -- yet its price and insurance value can collapse by a factor of a hundred; and a forgery that fooled every expert becomes worth nothing the instant it's exposed, often getting destroyed or hidden away rather than put on show. But the same museums and dealers happily sell high-quality reproductions, and everyone prizes a good cast of a lost bronze. So what theory of aesthetic value does this practice presuppose? Does it commit to the value of a work lying in its causal history rather than in its perceptible surface? Reconstruct the implicit view, separate what the practice strictly requires from what it merely fits with (could a 'we hate being deceived' story, or a 'contact with the actual maker' story, do just as well?), say whether the package is internally consistent, and tell me what would have to change if we went with a straightforwardly perceptual theory of value instead. Please answer in British English.
