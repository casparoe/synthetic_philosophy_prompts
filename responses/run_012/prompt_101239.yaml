answer: |-
  You have identified a genuine, well-recognized structural feature of the **Scale, Neglectedness, and Tractability (SNT)** framework, which is the standard heuristic used in Effective Altruism and cause prioritization circles.

  While the dynamic you describe is discussed within that community, there is no single, canonical academic noun (like "Gresham's Law") that names the *scoring artifact* specifically. It is usually referred to descriptively as the **"Neglectedness-Tractability Correlation"** or the **"Endogeneity of Cause Characteristics."**

  However, your specific insight—that the framework structurally double-counts the same underlying signal when used naively—deserves a precise label. Since no established term captures the *scoring error* itself (as opposed to the underlying economic reality), I will coin the term **"The Structural Redundancy Bias"** for this phenomenon, define it below, and distinguish it from the concepts you mentioned.

  ### 1. The Established Context: Endogeneity
  The pattern you noticed is real. In economic and cause-prioritization literature, this is known as **endogeneity**. The variables (Neglectedness and Tractability) are not independent; they are causally linked by the history of resource allocation.
  *   **Mechanism:** Rational actors solve easy problems first. Therefore, if a problem remains neglected, it is statistically likely to be because it is intractable. If a problem is tractable, it is statistically likely to become less neglected.
  *   **The Framework's Intent:** The SNT framework is theoretically designed to handle this by focusing on **marginal returns** (what the *next* dollar does) rather than **average returns** (how solvable the *whole* problem is).
  *   **The Error:** In practice, discussion groups often score **Aggregate Tractability** ("Can this disease be cured?") rather than **Marginal Tractability** ("Can *my* donation cure an extra case?"). When you score Aggregate Tractability, you are indeed measuring the same underlying fact as Neglectedness (the current state of progress), leading to double-counting.

  ### 2. Coined Term: The Structural Redundancy Bias
  **Definition:** A scoring artifact that occurs when a multi-criteria decision framework treats two causally coupled variables as independent multipliers, resulting in the systematic double-penalization of high-difficulty opportunities.

  **Precise Mechanism:**
  Let $V$ be the value of a cause, estimated as $V = S \times N \times T$.
  *   $N$ (Neglectedness) is inversely proportional to Existing Attention ($A$).
  *   $T$ (Aggregate Tractability) is positively correlated with Existing Attention ($A$), because attention solves the easy parts.
  *   Therefore, $N$ and $T$ both function as proxies for $A$.
  *   When multiplied, the model computes $A^{-1} \times A^{k}$, effectively weighting the "difficulty of the frontier" twice.

  **Boundary Cases (What falls inside):**
  *   **Disease Research:** As you noted, untreated diseases are neglected *because* they are hard. Scoring both $N$ (high) and $T$ (low) penalizes the difficulty twice.
  *   **Policy Reform:** Entrenched policy issues are neglected because they are politically intractable. The framework penalizes them for being neglected (good) but also for being hard (bad), often netting to zero, even if the marginal opportunity is high.

  **Boundary Cases (What falls outside):**
  *   **Stigma-Driven Neglect:** If a problem is neglected due to social taboo (e.g., menstruation hygiene in certain contexts) but is technically tractable, $N$ is high and $T$ is high. The bias does not apply here because the variables are decoupled.
  *   **Newly Discovered Risks:** If a risk is newly identified (e.g., a novel pandemic pathogen), it is neglected but tractability is unknown, not necessarily low. The correlation has not yet formed.
  *   **Coordination Problems:** Problems that are tractable technically but require coordination (e.g., climate accords) may remain neglected. Here $T$ (technical) is high, $N$ is high. The bias is avoided if $T$ is scored correctly as "technical solvability" rather than "political solvability."

  ### 3. Distinction from Nearest Concepts

  You asked how this differs from three specific concepts. Here is the differentiation:

  **A. The Streetlight Effect (Observation Bias)**
  *   *Definition:* Searching for keys where the light is, not where they were lost.
  *   *Difference:* The Streetlight Effect is an **epistemic bias of the observer** (we look where it's easy). The Structural Redundancy Bias is a **mathematical artifact of the tool** (the scoring system itself devalues the dark places). The Streetlight Effect explains *why* people ignore hard problems; Structural Redundancy explains *why the scoring model tells them to.*

  **B. Goodhart's Law (Measurement Bias)**
  *   *Definition:* When a measure becomes a target, it ceases to be a good measure.
  *   *Difference:* Goodhart's Law requires **optimization agents** gaming the system. Structural Redundancy occurs even with **honest actors** trying to score accurately. It is a flaw in the model's architecture, not the users' incentives.

  **C. Selection Bias (Sampling Bias)**
  *   *Definition:* Drawing conclusions from a non-representative sample.
  *   *Difference:* Selection Bias implies you are looking at the wrong *set* of problems. Structural Redundancy implies you are scoring the *right* problems incorrectly. You can have a perfect sample of all global problems and still suffer from Structural Redundancy if your scoring criteria are endogenous.

  ### 4. Is it a Genuine Bias or a Scoring Artifact?
  It is a **scoring artifact arising from coarse categorization.**

  The SNT framework dissolves this bias **if and only if** you score **Marginal Tractability** rather than **Aggregate Tractability**.
  *   **Aggregate Tractability:** "How much of this problem is solvable?" (Correlates with Neglectedness).
  *   **Marginal Tractability:** "How much progress will the *next* unit of resources buy?" (Can be high even if the problem is hard and neglected, provided you have a comparative advantage or a new angle).

  **Example:**
  *   *Problem:* Malaria.
  *   *Aggregate View:* Low Neglectedness (many people working on it), Low Tractability (hard to eradicate completely). Score: Low.
  *   *Marginal View:* Low Neglectedness (crowded), but **High Marginal Tractability** (bed nets are cheap and work). Score: High.
  *   *Problem:* Pancreatic Cancer.
  *   *Aggregate View:* High Neglectedness, Low Tractability (no cure). Score: Low (due to Redundancy Bias).
  *   *Marginal View:* High Neglectedness, **Unknown Marginal Tractability** (maybe a specific new pathway is fundable). Score: Uncalibrated.

  ### Summary
  You are not misreading the caveat. You have identified that the standard heuristic often conflates **Average** and **Marginal** returns.

  *   **Established Name:** The Neglectedness-Tractability Correlation (or Endogeneity).
  *   **Coined Term for the Scoring Error:** **The Structural Redundancy Bias.**
  *   **The Fix:** Stop scoring "How solvable is this problem?" and start scoring "How solvable is the *next* step, given that others have taken the easy ones?"

  If your group continues to score "problem tractability" rather than "intervention tractability," you are mathematically guaranteed to prefer well-trodden paths, not because they are better, but because the model counts their ease of access twice.
