      *   *Focus:* The "stable living standards" claim is the weakest link. If the masses are happy, why do they follow counter-elites? The User says "recruits." I need to attack the idea that recruits are available without immiseration.
      *   *Measurement:* Emphasise the "credentialed" aspect. Does a degree always mean elite aspirant? In some societies, yes; in others, no.

  6.  **Final Review against Constraints:**
