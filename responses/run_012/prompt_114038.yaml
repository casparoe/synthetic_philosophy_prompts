  7.  **Final Polish:** Check for clarity and punchiness. Ensure the distinction between "fatal to mechanism" and "fatal to general cycle" is clear. (Mechanism = EOP causes crisis; General = Cycles exist at all).

  *(Self-Correction on "Fatal"):* A single counter-example isn't usually fatal in macro-history, but a systematic failure of the correlation is. I will frame "fatal" as "systematic empirical failure" or "logical incoherence."

