answer: |-
  This practice presupposes a **positivist-custodial conception** of the archive, grounded in a specific theory of state power and evidentiary truth. Below is an analysis of the theoretical commitments, the logical dependencies of the practice, the implications of a paradigm shift, and a reflexive critique of this verdict.

  ### 1. Theoretical Presuppositions

  **Conception of the Archive's Role:**
  The practice presupposes the archive as a **passive repository of state memory**, not an active shaper of collective memory. Its role is to safeguard the evidence of *governance* (official functions), not *society*. This aligns with the Jenkinsonian ideal of "impartiality," where the archivist is a neutral custodian who does not select based on historical value but on administrative provenance.

  **Conception of Power:**
  Power is treated as **centralized and top-down**. By defining "public records" strictly through the lens of originating state offices, the archive presupposes that power resides solely in formal administrative acts. It renders invisible the "power to name"—the power to decide what counts as a public function. The archive views itself as powerless (merely holding what is given), which ironically masks its immense power to exclude.

  **Evidentiary Significance of Silence:**
  Silence is interpreted as **entropy** (accidental loss), not **structure** (systemic exclusion). By describing gaps as "losses," the archive presupposes that the historical record is naturally complete unless damaged by external forces (fire, war, neglect). It denies the evidentiary weight of silence as a positive indicator of marginalization. In this view, a missing file proves nothing about the oppressed; it proves only that preservation failed.

  **Neutral/Custodial vs. Constructivist:**
  The practice commits the archive ideologically to a **neutral, custodial view**. It treats records as **natural byproducts of administration**. If the archive adopted a *constructivist* view, it would have to admit that appraisal rules *create* the historical record rather than *capture* it. To maintain the description of gaps as "losses" rather than "absences," the archive must claim it is not responsible for the gap. A constructivist view would force the admission that the gap was *produced* by the appraisal policy itself. Therefore, the practice relies on the *pretense* of neutrality to avoid accountability for the construction of silence.

  ### 2. Logical Dependencies: Strict Requirements, Fit, and Compatibility

  **Strictly Required Commitments:**
  *   **Definition of "Public":** Treating marginalized community records as private papers *strictly requires* a definition of "public record" tied to **state agency** rather than **public interest**. If "public" meant "of consequence to the public," these records would qualify.
  *   **Ontology of the Gap:** Describing a gap as a "loss" *strictly requires* the belief that the record **once existed**. If the record was never created because the community was never consulted, calling it a "loss" is factually incorrect. This commitment requires a belief in the natural inevitability of record-creation by all subjects of the state.

  **Merely Fits:**
  *   **Resource Allocation:** The focus on official functions *fits* a narrative of limited resources (we can't keep everything), but it does not *require* it. One could prioritize marginalized records *over* routine administrative memos within the same budget.
  *   **Physical Custody:** Storing donated papers in a separate series from official records fits the neutral view, but a constructivist archive could physically store them together while using metadata to distinguish provenance.

  **Compatible with Rival Accounts:**
  *   **Legalism:** The practice is compatible with a **legalist account** that absolves the archive of ethical blame. If the law defines "public records" narrowly, the archive can claim it is merely following statutes, not making epistemic choices. This allows the *practice* to continue even if the *archivists* personally hold a constructivist view (a form of bureaucratic dissociation).
  *   **Pragmatic Preservation:** A rival account might argue that state records have better chain-of-custody guarantees. The practice is compatible with the view that state records are simply more *stable* than donations, regardless of their social value.

  ### 3. The Participatory/Community-Archiving Shift

  If the implicit theory were replaced by a **participatory model** (e.g., Post-custodial or Community Archives framework), the following would change:

  *   **Appraisal:** Authority would shift from the **creating office** to the **subject community**. Appraisal would not ask "Does this document the function of the Ministry?" but "Does this document the experience of the people affected by the Ministry?" Marginalized records would be appraised as public records based on their **societal impact**, potentially mandating their transfer or co-custody rather than relying on donation.
  *   **Description:** Archival description would move from **administrative provenance** to **multivocal context**. Finding aids would include community-generated metadata. Crucially, the description of gaps would change from "Records destroyed in 1990" to "Records never created due to exclusionary policy X."
  *   **Evidentiary Weight of Silence:** A missing file would shift from being **negative evidence** (data missing) to **positive evidence** (evidence of erasure). The silence itself becomes an artifact of power. The archive would actively document *why* certain records are absent, treating the "absence" as a recordable event in the history of the institution.

  ### 4. Reflexivity: What Would Change My Mind and Where I Might Fail

  **What Would Change My Mind:**
  My verdict relies on the premise that the archive's primary ethical obligation is **representational justice** (ensuring all groups are documented). I would change my mind if presented with a compelling argument that the **legal-accountability function** of a national archive must take precedence over social representation.

  If it can be demonstrated that expanding appraisal criteria to include "community experience" fundamentally undermines the archive's ability to serve as an **impartial witness against the state** (e.g., by blurring the line between state evidence and private advocacy, thereby allowing the state to dismiss the archive as politicized), then the "neutral/custodial" model might be defended as a necessary strategic fiction. If the "neutral" stance is the only shield protecting the archive from political interference that would destroy *all* records (including marginalized ones), then the exclusionary practice is a tragic but necessary trade-off for institutional survival.

  **Where My Reasoning Is Most Likely to Fail:**
  My reasoning is most likely to fail in **attributing theoretical coherence to bureaucratic inertia**. I have analyzed the practice as if it stems from a deliberate theoretical commitment (positivism/custodialism). However, it is highly probable that the practice stems from **unexamined tradition and resource constraints** rather than a conscious philosophical stance.

  By treating the practice as a "theory-laden" choice, I may be over-intellectualizing what is simply path dependency. If the archivists are unaware of the constructivist implications of their work, criticizing them for "presupposing" a neutral view may be a category error. They may not presuppose anything; they may simply be following a manual written fifty years ago. In this case, the "commitment" is not intellectual but procedural, and the solution is not theoretical debate but policy revision. My analysis risks attacking a philosophical ghost when the enemy is merely administrative habit.
