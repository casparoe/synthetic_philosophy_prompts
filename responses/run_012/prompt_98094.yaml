      *   **User:** Third-year PhD student in metaphysics of time. This means they know the technical terminology (block universe, eternalism, fatalism, idealism, Sapir-Whorf) and don't need basic definitions. They want a sophisticated, critical engagement, not a summary.
      *   **Task:** Run a film night discussion on *Arrival* (2016) through the lens of Jorge Luis Borges's metaphysics of time (not just the pop-culture "forking paths" trope).
      *   **Specific Instructions:**
          *   Brainstorm Borges's actual positions on time (Forking Paths, Refutation of Time, Eternal Return, etc.).
          *   Compare these to *Arrival*.
          *   Pick a side on the user's hunch (that *Arrival* is anti-Borgesian/fatalist block universe vs. Borges's idealism/branching).
