      *(Self-Correction on "Forking Paths"):* I need to make sure I don't let the user off the hook on their interpretation of Borges. They said "forking of all possibilities." I need to clarify that for Borges, this wasn't necessarily a physical multiverse but a narrative/ontological simultaneity.
      *(Self-Correction on "Arrival"):* Does *Arrival* allow for change? No. It's explicitly "no matter how you twist it, the movie ends the same way." That is hard determinism. Borges hates hard determinism because it implies a reality outside the mind.

