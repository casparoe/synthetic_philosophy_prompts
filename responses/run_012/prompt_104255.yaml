answer: |-
  **The Case**
  Two appraisers stand in a repair shop over a vintage cello that was crushed in transit and rebuilt using the original wood where possible, but new wood where necessary. They agree on every physical fact: the mass, the density, the proportion of original material, the acoustic output. The question is singular: "Is this the original instrument?" Appraiser A says, "Yes." Appraiser B says, "No." Neither is speaking legally, functionally, or sentimentally; both are making ontological claims about the object's identity. A warrants "Yes" by pointing to the continuity of the substance (the remaining original wood and the unbroken lineage of the object). B warrants "No" by pointing to the discontinuity of the mode (the structural integrity was broken, the form was lost and remade). They are not using "original" in two different senses; they are accessing two equally real, mutually contradicting facets of the same thing.

  **The Seven Predications (Syādvāda)**
  Jain logic prefixes every claim with *syāt* ("in some way" or "conditionally") to acknowledge that truth is indexed to a standpoint (*naya*). Applied to the cello:

  1.  **Syād asti (In some way, it is):** Warranted from the standpoint of substance (*dravya*). The original material persists; the identity survives the repair.
  2.  **Syād nāsti (In some way, it is not):** Warranted from the standpoint of mode (*paryāya*). The specific arrangement and integrity of the original instrument were destroyed; a new configuration exists.
  3.  **Syād asti nāsti (In some way, it is and is not):** Warranted when considering succession. The instrument persists through time (is), yet changes its state at every moment (is not).
  4.  **Syād avaktavya (In some way, it is inexpressible):** Warranted when attempting to assert existence and non-existence simultaneously in a single breath. Language forces sequential assertion, but the reality is simultaneous; thus, the joint state defies simple propositional capture.
  5.  **Syād asti avaktavya (In some way, it is and is inexpressible):** Combines (1) and (4). We can assert existence substantively, but cannot fully express how that existence cohabits with non-existence.
  6.  **Syād nāsti avaktavya (In some way, it is not and is inexpressible):** Combines (2) and (4). We can assert non-existence modally, but cannot fully express how that non-existence cohabits with existence.
  7.  **Syād asti nāsti avaktavya (In some way, it is, is not, and is inexpressible):** The complete picture. The cello exists (substance), does not exist (mode), and the simultaneity of this contradiction exceeds linear linguistic formulation.

  *Note:* None of the seven are padding. Each maps to a specific ontological constraint: persistence, perishing, succession, and the limits of sequential assertion regarding simultaneous reality.

  **Nayavāda's Contribution**
  Bare predication tells you *that* contradictory statements are conditionally true. *Nayavāda* (the doctrine of standpoints) explains *why* without collapsing into relativism. It identifies the specific partial perspective generating the truth. In this case, *Nayavāda* distinguishes the **Substantial Standpoint** (*dravyārthika naya*) from the **Modal Standpoint** (*paryāyārthika naya*). Without this, *syādvāda* looks like fuzzy logic. With it, we see that Appraiser A isn't "half-right"; she is fully right relative to substance. Appraiser B isn't "half-right"; he is fully right relative to mode. *Nayavāda* prevents the error of taking a partial truth for the whole truth (*nayābhāsa*), which is where the conflict arises.

  **The Load-Bearing Feature**
  The load-bearing feature is **simultaneous origination and destruction** (*utpāda-vyaya-dhrauvya*). Jain metaphysics claims that every moment of existence involves something coming to be, something passing away, and something persisting. If you delete this feature—if you assume the cello is static—the contradiction vanishes, and *anekāntavāda* becomes unnecessary. If the cello were unchanging, Appraiser B would simply be wrong. If it were completely annihilated and replaced, Appraiser A would be wrong. The doctrine only earns its keep because reality is dynamic stability. If you remove the dynamism, the case collapses into ordinary context-sensitivity (e.g., "original" means different things to different people), and I have wasted your time. The point is not that "original" is ambiguous, but that the object *is* both original and non-original.

  **The Logician's Objection**
  A hard-nosed bivalent logician will say: "You haven't solved the contradiction; you've just hidden parameters. When Appraiser A says 'Is,' she means 'Is substantively.' When Appraiser B says 'Is Not,' she means 'Is Not modally.' You've equivocal on the predicate 'Is.' If you fix the meaning of 'Is' to 'Is identical in all respects,' one of them is false. If you allow parameters, you've just invented a multi-valued logic system, not discovered a feature of reality. You're dressing up context-sensitivity in metaphysical robes."

  **Honest Assessment**
  He is right about the logic, but wrong about the ontology. Formally, he is correct: to avoid the Law of Non-Contradiction violation, you must index the truth values. *Anekāntavāda* admits this via *syāt*. However, the Jain claim is not merely linguistic convenience; it is that reality *itself* is indexed. The logician assumes objects are simple units that either are or aren't. The Jain claims objects are complex unities of permanence and change. The logician sees equivocation; the Jain sees ontological depth. The logician wins on syntax; the Jain claims to win on semantics grounded in metaphysics.

  **The Practical Stake and Adjudication**
  The stake is an insurance payout. The policy covers "Total Loss of the Original Instrument." If it is the original, the insurer pays for repair ($50,000). If it is not the original, the insurer pays the full replacement value of a vintage cello ($500,000). The adjudicator cannot rule "Both are correct" and issue two checks.

  *Anekāntavāda* licenses the adjudicator to do the following: She acknowledges that both appraisers speak truth from valid standpoints. However, she must select the *naya* that serves the purpose (*artha*) of the contract. Insurance contracts are typically designed to indemnify loss of value, not metaphysical identity. Therefore, she privileges the **Modal Standpoint** (Appraiser B) for the ruling: the instrument's value was destroyed because its mode (integrity) was broken. She rules it a Total Loss. Crucially, *anekāntavāda* prevents her from declaring Appraiser A a liar. A's claim remains true in the substantial sense (the wood persists), which might matter for provenance or heritage laws, but false for the specific purpose of insurance valuation. The doctrine allows her to rule decisively without demonizing the losing party's grasp of reality.
