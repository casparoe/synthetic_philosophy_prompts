  3.  **Brainstorming Objections/Defeaters:**

      *   *The "Too Many Causes" Problem (Promiscuity):* If I don't save a starving child in Africa, am I a cause of their death? Counterfactually, yes. Normatively, maybe. But what about the government? The parents? The drought?
      *   *The Metaphysical/Pragmatic Split:* If causation is just counterfactual dependence, then *every* absence is a cause. If norms only select, then causation is abundant/ubiquitous. Critics (e.g., Beebee, Dowe) say omissions aren't causes *at all* because there's no physical process.
      *   *The Normative Circularity:* To define the cause, we need a norm. To define the norm, do we need a cause? (e.g., Is the norm "don't kill" or "don't omit saving"?).
      *   *Preemption/Overdetermination:* What if two people omit to act? Both satisfy counterfactuals (in some formulations) or neither does (in strict Lewisian terms).
      *   *The "Doing vs. Allowing" Distinction:* Legal and moral systems treat doing and allowing differently. If omissions are causes *in the same sense* as actions, does this collapse moral responsibility?
