answer: |-
  This is a sophisticated hybrid view: it combines a **Lewisian metaphysics** (causation is counterfactual dependence) with a **Hart-and-Honoré pragmatics** (causal selection is normative). You are effectively arguing for *causal pluralism* or *abundant causation*: metaphysically, omissions are causes whenever there is dependence; pragmatically, we cite only the norm-violating ones.

  Here is an analysis of what counts against this view, ranked from fatal objections (which force abandonment or radical revision) to awkward costs (which must be swallowed), followed by an assessment of the metaphysical/pragmatic tension you identified.

  ### I. Ranked Defeaters

  #### 1. Fatal: The "Error Theory" Collapse
  **The Objection:** Your view claims that *all* counterfactually dependent omissions are causes, but we only *talk* about the normative ones. However, ordinary causal intuition does not merely *select* among causes; it denies causal status to non-normative omissions entirely.
  **Why it is Fatal:** If I ask, "Did the bystander cause the death?" and the bystander had no duty to act, ordinary intuition says "No." Your view says "Yes, metaphysically, but we don't cite it." This forces you into an **error theory** about ordinary causal language. You are claiming that when people say "X caused Y," they are wrong about the metaphysics whenever X is a non-normative omission.
  **The Consequence:** If you must tell ordinary users of causal concepts that they are systematically mistaken about the extension of "cause," you have arguably ceased to analyze *causation* and are instead analyzing a theoretical construct that bears little relation to the concept you started with. This collapses your view into a rival account (specifically, a version of **contextualism** or **contrastivism**) which argues that norms determine causal *truth conditions*, not just selection.

  #### 2. Fatal: The Ontological "Nothing" Problem
  **The Objection:** Counterfactual dependence is a relation between propositions or events. If omissions are causes, what are the relata?
  **Why it is Fatal:** If an omission is "nothing," it cannot stand in relations. If it is "something" (a negative fact or a null event), you incur a heavy ontological cost. If you say "The omission is just the non-occurrence of the action," you rely on a metaphysics of negative facts.
  **The Consequence:** Rivals (like Beebee or Dowe) argue that causation requires physical process or energy transfer. If your view requires negative facts to ground counterfactuals, it becomes less parsimonious than rival accounts that deny omissions are causes *at all*. If you cannot specify the ontology of the omission without circularity (e.g., "the omission is the cause of the effect" defines the omission), the metaphysical half collapses.

  #### 3. Serious: The Preemption/Overdetermination Failure
  **The Objection:** Counterfactual dependence is notoriously fragile in preemption cases. Suppose two lifeguards are on duty. Both omit to save a drowning swimmer. The swimmer dies. Had Guard A acted, the swimmer would have lived (so A's omission is a cause). Had Guard B acted, the swimmer would have lived (so B's omission is a cause).
  **Why it is Serious:** Now suppose only Guard A is on duty, but Guard B (a bystander) is present. Guard A omits (norm violation). Guard B omits (no norm violation). On your view, both are causes metaphysically, but only A is selected.
  **The Collapse:** Now consider **Late Preemption**. Guard A is about to jump, but Guard B (who has no duty) pushes A out of the way and then does nothing. The swimmer dies. Did B's omission cause the death? Counterfactually, if B had not pushed A, A would have saved the swimmer. But B's *omission* to save isn't the primary counterfactual lever; his *action* of pushing is.
  **The Consequence:** Pure counterfactual accounts struggle to distinguish the preempting cause from the preempted omission. If your normative clause is supposed to fix this, it fails, because norms don't track the metaphysical structure of preemption. This shows the counterfactual half is insufficient, and the normative half is irrelevant to the structural problem.

  #### 4. Serious: The Normative Baseline Circularity
  **The Objection:** You rely on "norms or expectations" to select the cause. But norms are often defined by causal roles.
  **Why it is Serious:** Why is the gardener's omission to water the plant a norm violation? Because he was hired to keep it alive (causal role). Why is the bystander's omission not a violation? Because he has no causal responsibility.
  **The Consequence:** If the norm is established by prior causal expectations, you cannot use the norm to define the cause without circularity. You are using causal expectations to select causes. This suggests the normative half is not an independent filter but parasitic on a prior, unarticulated causal theory.

  #### 5. Merely Awkward: The Ubiquity of Causation
  **The Objection:** On your view, I am a cause of every famine I could have alleviated but didn't.
  **Why it is Awkward:** You must concede this is true metaphysically, even if I am not blameworthy.
  **The Consequence:** This is a conceded cost. You must argue that *causation* and *responsibility* come apart. Defenders accept this, but it makes the concept of "cause" less useful for practical reasoning. It renders causation "promiscuous" (as you noted), which is a cost to the theory's utility, though not necessarily its truth.

  #### 6. Merely Awkward: The Insulation by Qualification
  **The Objection:** When faced with weird cases (e.g., "My omission to breathe caused the room's CO2 levels to stay low"), you qualify: "Well, that's not a normal expectation."
  **Why it is Awkward:** If every counter-example is met by adjusting the "normative baseline," the theory becomes unfalsifiable.
  **The Consequence:** This insulation is a defect. It suggests the theory is not predicting causal judgments but rationalizing them post-hoc.

  ---

  ### II. The Two Halves: Metaphysics vs. Talk

  You asked: *If counterfactual dependence alone is promiscuous and the normative half is doing all the selecting, does the view end up being about how we talk rather than about what causes what?*

  **Yes, this is the central vulnerability.**

  If the counterfactual condition makes *every* omission a cause, and the normative condition determines which one we *call* the cause, you have driven a wedge between **Causation (Metaphysical)** and **Causal Attribution (Pragmatic)**.

  1.  **The "So What?" Objection:** If the metaphysical fact is that *thousands* of omissions caused the death, but the pragmatic fact is that only *one* matters, what work is the metaphysical claim doing? It becomes a "God's eye view" that no human agent can access or use. Rivals (like **Jonathan Schaffer's Contrastivism**) argue we should bake the selection into the metaphysics: Causation is a ternary relation (*c* causes *e* rather than *e**). Your view risks being a binary metaphysics with a pragmatic overlay, which is less elegant than a ternary metaphysics.
  2.  **The Realism Charge:** If norms vary by culture or context, does the *cause* vary?
      *   If **Yes**: Then causation is mind-dependent (since norms are mind-dependent). This contradicts the usual realist intuition that causation is in the world.
      *   If **No**: Then the normative selection is merely about *interest*, not truth. But then why do we feel that citing the non-normative omission is *false* ("The bystander didn't cause this") rather than just *uninformative*?
      *   **The Defeater:** If you say it's merely uninformative, you conflict with ordinary language where we treat non-normative omissions as *non-causes*. If you say it's false, you abandon the counterfactual sufficiency claim.

  **Verdict:** The view risks becoming a **pragmatic account of causal explanation** masquerading as a **metaphysical account of causation**. To hold the two halves together, you must insist that "Cause" is ambiguous: *Cause-M* (metaphysical, counterfactual) and *Cause-P* (pragmatic, normative). If you do this, you concede that ordinary talk is about Cause-P, and your theory is only about Cause-M. This limits the theory's scope significantly.

  ---

  ### III. Unique Predictions

  To justify the complexity, your view must predict things rivals do not.

  1.  **Prediction of Dissociation:** Your view predicts that we can have cases where an agent is **causally responsible** (counterfactual dependence exists) but **not a causal agent** in explanation (no norm violation).
      *   *Rival (Anti-Realist):* Predicts no causation at all in omission cases.
      *   *Rival (Normative Constitutive):* Predicts no causation if no norm is violated.
      *   *Your View:* Predicts causation exists, but is silent. This allows you to explain why we might still feel a "taint" on the bystander even if we don't blame them—they *did* cause it, metaphysically.
  2.  **Prediction of Norm-Shift:** If we change the norm, the *attributed* cause changes, but the *metaphysical* cause remains constant.
      *   *Example:* In a society where everyone is expected to save drowning children (Good Samaritan law + strong norm), the bystander becomes the *selected* cause. In our society, they are not.
      *   *Rival (Contextualist):* Says the truth value of "Bystander caused death" changes.
      *   *Your View:* Says the truth value of "Bystander is a cause" is constant (True); the truth value of "Bystander is *the* cause" changes. This is a subtle but distinct prediction about the stability of causal facts across contexts.

  ---

  ### IV. Absorption by Qualification and Insulation

  You asked: *Whether everything you raise can be absorbed by qualification, and whether that insulation is a defect.*

  **Can objections be absorbed?**
  Yes, mostly by qualifying the "Normative Expectation" clause.
  *   *Preemption?* "The norm applies to the effective agent."
  *   *Ontology?* "Omissions are facts, not events."
  *   *Error Theory?* "Ordinary language is loose; we are doing metaphysics."

  **Is this insulation a defect?**
  **Yes.** It renders the theory **ad hoc**.
  If the counterfactual test yields results that contradict intuition (e.g., the bystander is a cause), and you fix it by saying "But we don't select it," you haven't explained *why* intuition rejects it. You've just noted that intuition rejects it.
  A robust theory should explain *why* the non-normative omission feels like a non-cause. If the only explanation is "Because it doesn't fit the norm," you are defining the problem away. The defect is that the normative clause acts as a **get-out-of-jail-free card** for any counter-intuitive result generated by the counterfactual clause.

  **The Fatal Insight:**
  If the normative half is required to make the view palatable, but the counterfactual half is required to make it metaphysical, the view is unstable.
  *   If you lean into the **Counterfactual**, you are a Realist about omissions but must accept promiscuous causation (hard to swallow).
  *   If you lean into the **Normative**, you are a Contextualist/Contrastivist (and should drop the claim that omissions are causes *simpliciter*).
  *   Trying to hold both suggests you want the realism of the former with the precision of the latter. The defeater is that **you cannot have both without positing two different concepts of causation.** If you admit that, the view is not a unified theory of causation, but a theory of the *relationship* between metaphysical dependence and pragmatic attribution.

  ### Summary of Recommendations for Defense
  To save the view, you must:
  1.  **Embrace the Ambiguity:** Explicitly distinguish *Causation* (counterfactual) from *Causal Explanation* (normative). Do not claim ordinary language tracks *Causation*.
  2.  **Deny the Error Theory:** Argue that ordinary language is imprecise, not false. When people say "The bystander didn't cause it," they mean "The bystander isn't the *explanatorily relevant* cause."
  3.  **Accept the Ontological Cost:** Defend negative facts or facts about absences as legitimate truth-makers.
  4.  **Predictive Power:** Lean into the prediction that moral/legal shifts (changing norms) should shift causal *attribution* without shifting causal *facts*. If you can show this dissociation empirically (e.g., in legal judgments), the view gains traction.

  If you cannot make these moves, the view collapses into **Contrastivism** (causation is inherently contrastive and normative) or **Fictionalism** (omissions are useful fictions for counting causes).
