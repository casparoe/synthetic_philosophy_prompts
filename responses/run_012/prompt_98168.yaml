answer: |-
  Here is a procedure designed for your constraints: 20 minutes, clinician-users, high-stakes context. It operationalizes the philosophical concepts you listed without requiring a degree in moral theory.

  ### The 20-Minute Dilemma Triage (MDT)

  **Goal:** Distinguish *Genuine Dilemmas* (ontological conflict, residue owed) from *Hard Choices* (epistemic uncertainty or hierarchical resolution, recommendation required).

  **Pre-Check:** Before starting, confirm there is no immediate threat to life requiring emergency intervention. If there is, suspend ethics consult and act on safety protocols.

  ---

  #### Step 1: The Agglomeration Test (Logistics vs. Ethics)
  *Philosophical Load:* Tests the principle that "Ought implies Can." If you ought to do A and ought to do B, you ought to do (A+B). If (A+B) is impossible, one "ought" is false.
  *   **The Question:** Is there a physical, legal, or temporal barrier preventing us from doing *both* competing actions simultaneously?
  *   **Pass (Proceed to Step 2):** No. We physically/logistically *could* do both, but we believe we *shouldn't* (e.g., we could treat and honor refusal, but they conflict).
  *   **Fail (Verdict: Logistics Problem):** Yes. We literally cannot do both (e.g., one ventilator, two patients).
      *   *Action:* This is not yet a moral dilemma; it is a resource constraint. Move to Step 2 to see if a rule resolves it.

  #### Step 2: The Hierarchy Test (Prima Facie vs. All-Things-Considered)
  *Philosophical Load:* Distinguishes *prima facie* duties (binding unless overridden) from *all-things-considered* duties (binding finally).
  *   **The Question:** Is there an established ethical, legal, or institutional hierarchy that overrides one option? (e.g., Patient Safety > Colleague Loyalty; Advance Directive > Surrogate Wish; Triage Protocol > Individual Need).
  *   **Pass (Proceed to Step 3):** No. The competing principles sit at the same level (e.g., Autonomy vs. Beneficence; Truth-telling vs. Non-maleficence). No policy or law clearly trumps the other in this specific context.
  *   **Fail (Verdict: Hard-but-Not-Dilemma):** Yes. One principle clearly overrides the other based on existing agreement.
      *   *Action:* Issue a recommendation to follow the higher-order principle. **Stop.** Do not label this a dilemma. The team does not get to call this a tragedy; they get to call it a protocol.

  #### Step 3: The Epistemic Check (Uncertainty vs. Indeterminacy)
  *Philosophical Load:* Distinguishes *not knowing the answer* (epistemic) from *there being no answer* (ontological).
  *   **The Question:** If we had perfect information (perfect prognosis, perfect knowledge of patient's current values, perfect time), would the conflict disappear?
  *   **Pass (Proceed to Step 4):** No. Even with perfect information, the conflict remains (e.g., We know exactly what the patient wanted, but honoring it causes severe harm to another).
  *   **Fail (Verdict: Information Gap):** Yes. The conflict exists only because we are missing data.
      *   *Action:* This is a data problem, not an ethics problem. Recommend a pause to gather data (family meeting, second opinion, chart review). **Stop.**

  #### Step 4: The Residue Check (The "Clean Hands" Test)
  *Philosophical Load:* Tests for moral residue. If a choice is truly right, does it leave a moral debt?
  *   **The Question:** If we choose the "best" available option, will the team reasonably feel they have still wronged someone, requiring more than just "moving on"?
  *   **Pass (Verdict: Genuine Dilemma):** Yes. Regardless of the choice, there is a remaining moral debt (guilt, obligation to apologize, need for restitution) that is not just emotional burnout.
  *   **Fail (Verdict: Hard Choice):** No. Once the choice is made, the moral obligation is discharged. Any remaining distress is psychological, not moral.
      *   *Action:* Issue a recommendation. Acknowledge the difficulty, but do not validate the "no right answer" label.

  ---

  ### Application to Your Cases

  #### Case 1: The Impaired Colleague
  *   **Step 1 (Agglomeration):** **Pass.** You can report him *and* cover the shift (though it's hard). It's not physically impossible.
  *   **Step 2 (Hierarchy):** **Fail.** Patient safety is a higher-order duty than colleague loyalty or staffing convenience. Hospital policy and nursing standards mandate reporting impaired practice.
  *   **Verdict:** **Hard-but-Not-Dilemma.**
  *   **Recommendation:** Report the colleague immediately. The staffing issue is a management problem, not an ethical tie-breaker.
  *   **Note:** This stops early. It prevents the "dilemma" label from being used to delay a safety intervention.

  #### Case 2: Family vs. Reconstructed Values
  *   **Step 1 (Agglomeration):** **Pass.** Cannot both honor family wish for aggression and honor patient wish for comfort.
  *   **Step 2 (Hierarchy):** **Pass.** This is the crux. If the values are "reconstructed" (not a formal legal directive), surrogate authority (family) often clashes with best interest/autonomy (team's reconstruction). There is no clear policy trump card here; surrogates usually speak for patients, but not if they violate clear prior wishes. Since the wishes are *reconstructed*, they are not legally "clear."
  *   **Step 3 (Epistemic):** **Fail.** We cannot get better data. The patient cannot speak. The reconstruction is as good as it gets. The uncertainty is inherent to the situation, not a lack of effort.
  *   **Step 4 (Residue):** **Pass.** If you side with the team, you betray the family's authority and cause them trauma. If you side with the family, you betray the patient's reconstructed body of values. Either way, someone is wronged in a way that requires acknowledgment.
  *   **Verdict:** **Genuine Dilemma.**
  *   **Recommendation:** The team is permitted to choose either path (usually defaulting to the side that minimizes irreversible harm, often comfort care, but ethically permissible to try time-limited trial).
  *   **Residue Management:**
      1.  **Explicit Acknowledgment:** Document in the chart: "Decision made under conditions of moral conflict; no option fully preserves all values."
      2.  **The Debt:** If you choose comfort care, you owe the family a prolonged bereavement follow-up and an explicit statement that their advocacy was heard and loved, even if not followed. If you choose treatment, you owe the patient a strict time-limit and a commitment to not prolong suffering if the trial fails.
      3.  **Ritual:** Hold a "closure huddle" for the staff after the outcome to explicitly state: "We did not fail. The situation was impossible."

  #### Case 3: The Triage Bed and the Child
  *   **Step 1 (Agglomeration):** **Fail.** One bed, two patients. Physically impossible to do both.
  *   **Step 2 (Hierarchy):** **Fail.** *Wait.* The prompt says "criteria everyone agreed on give a clear answer." If the criteria are ethically vetted and agreed upon, they *are* the hierarchy. Procedural justice trumps individual outcome sadness.
      *   *Correction:* If the criteria are valid, Step 2 should **Fail** (meaning a hierarchy *exists*).
      *   *Verdict:* **Hard-but-Not-Dilemma.**
  *   **Why this is unwelcome:** The team will *want* this to be a dilemma. They want the "no right answer" label to absolve them of the guilt of letting a child lose out to an adult based on a spreadsheet.
  *   **Recommendation:** Follow the criteria. Do not call this a tragedy or a dilemma. Call it a just procedure with an unfortunate outcome.
  *   **Residue Management:** None owed morally. Psychological support should be offered for the distress of the outcome, but do not validate the idea that the team "wronged" the child. Validating that would undermine the triage protocol for next time.

  ---

  ### Meta-Commentary & Reliability

  #### Where are the judgment calls wearing procedure's clothing?
  1.  **Step 2 (Hierarchy):** Determining if a policy is *ethically* valid enough to act as a trump card is a judgment call. If your triage protocol (Case 3) is actually ageist or ableist, Step 2 will falsely clear it. The procedure assumes your hospital policies are at least minimally just.
  2.  **Step 4 (Residue):** Distinguishing "moral residue" from "compassion fatigue" or "fear of litigation" is subjective. A consultant who is burned out might see residue everywhere. A consultant who is detached might see none.

  #### Where is this most likely to misfire?
  *   **The "Agreed Criteria" Trap (Case 3):** This procedure relies on the premise that institutional policies are ethically sound. If your triage protocol is flawed, Step 2 will categorize a systemic injustice as a "Hard Choice," effectively laundering the error. You need a "Safety Valve": If following the hierarchy causes immediate, severe, and obvious harm that violates basic human rights, bypass Step 2 and escalate to Senior Ethics.
  *   **The "Family Pressure" Bias (Case 2):** Consultants often feel the screaming family in the room more than the silent patient in the bed. Step 3 requires you to hold the line on "we can't know more" even when the family promises new info if you just wait.

  #### Confidence and The Weakest Link
  *   **Overall Confidence:** High (85%). It successfully filters out the "logistics" and "policy" cases that eat up 80% of consult time, leaving you to focus on the actual moral conflicts.
  *   **Least Sure Step:** **Step 4 (The Residue Check).**
      *   *Why:* It relies on the consultant's ability to predict emotional/moral aftermath. It is the most vulnerable to the consultant's own biases. If *I* feel guilt, is it because there is residue, or because *I* am uncomfortable making hard calls?
      *   *Mitigation:* If two consultants disagree on Step 4, default to "Genuine Dilemma." It is safer to grant permission and manage residue than to force a recommendation in a truly conflicted case.

  #### Final Note on the Unwelcome Verdict
  Case 3 is the one you won't like delivering. Telling a team "This is not a dilemma, do not agonize" when a child is denied a bed feels cold. But if you call it a dilemma, you tell them "You could have chosen the child," which undermines the triage system for the next ten patients. The procedure protects the system, but it demands you absorb the team's anger at your rigidity. That is the cost of the service.
