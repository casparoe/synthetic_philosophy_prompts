answer: |-
  **Credence: 0.35**

  I assign a 35% probability that this specific institutional design would improve the epistemic quality of enacted policy over a thirty-year horizon. My estimate is below even odds primarily due to the high risk that the examination mechanism selects for socioeconomic status rather than decision-relevant competence, and the ambiguity of whether a suspensive veto improves deliberation or enables capture.

  ### Decomposition of Terms

  1.  **P(Electorate Epistemic Deficit): 0.60**
      *   *Justification:* While voters are rationally ignorant, there is no consensus that a filtered elite sample possesses superior *values* or *judgment* rather than just superior technical knowledge.
  2.  **P(Exam Validity): 0.40**
      *   *Justification:* Written examinations in wealthy democracies historically correlate strongly with socioeconomic background and access to tutoring, not necessarily raw governance competence.
  3.  **P(Veto Net Positive): 0.50**
      *   *Justification:* Suspensive vetoes can force reconsideration of hasty laws, but they also create new veto points for interest groups to lobby or obstruct necessary reforms.
  4.  **P(Institutional Stability): 0.70**
      *   *Justification:* Stable wealthy democracies maintain structural forms well, though the functional independence of such a chamber would face constant pressure from the elected chamber and bureaucracy.
  5.  **P(Determinacy of "Epistemic Quality"): 0.75**
      *   *Justification:* While ultimate policy goals are normative, the technical accuracy of forecasting, budgeting, and evidence-integration used to achieve them is measurable.

  ### Combination Logic

  These terms function as a series of bottleneck constraints rather than independent additive factors. The final credence is not a strict mathematical product (which would yield an unrealistically low ~0.06), but rather a Bayesian update from a neutral prior of 0.50. The high probability of **Exam Validity** failure (0.40) acts as a severe discount factor because if the chamber merely replicates class bias, the epistemic benefit is nullified regardless of the other terms. The **Veto Net Positive** term (0.50) contributes uncertainty regarding systemic dynamics, while **Determinacy** (0.75) and **Stability** (0.70) allow the hypothesis to remain coherent and persistent. The low scores on validity and veto dynamics drag the prior down from 0.50 to 0.35.

  ### Sensitivity Analysis

  **Most Sensitive Term:** **P(Exam Validity) (0.40)**.
  This is the critical failure point of the proposal. If the examination selects for wisdom and statistical reasoning independent of wealth, the credence rises sharply; if it selects for credentialism, the proposal fails.

  **Evidence That Would Move It:** Longitudinal data on whether holders of advanced quantitative credentials (e.g., STEM PhDs, actuaries) make systematically better *political* judgments than the median voter when insulated from partisan incentives, specifically controlling for income and education level.

  ### Settled vs. Contested Views

  **Settled:**
  *   **Voter Ignorance:** It is empirically settled that the median voter lacks basic knowledge of civics, budget allocations, and statistical risk.
  *   **Test Bias:** It is settled psychometric fact that written examinations in existing democracies correlate significantly with parental income and educational access.
  *   **Veto Power:** It is settled that adding a chamber with veto power increases the number of "veto points," generally slowing the rate of legislative change.

  **Genuinely Contested:**
  *   **Epistemic Value of Diversity:** Epistocrats (e.g., Brennan) argue competence trumps diversity; Democratic Theorists (e.g., Landemore) argue cognitive diversity among the many outperforms a selected few. There is no consensus on which effect dominates in legislation.
  *   **Fact/Value Distinction:** It is contested whether "epistemic quality" can be separated from normative goals; a policy can be technically efficient but morally abhorrent, making "quality" partially subjective.
  *   **Elite Bias:** It is contested whether a competence-selected chamber would exhibit *different* biases than an elected one, or merely swap populist biases for technocratic/oligarchic biases.
