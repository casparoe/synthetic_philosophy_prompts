answer: |-
  This is a classic debate in Effective Altruism circles (often framed as "Longtermism vs. Near-termism" or "Epistemic Humility"). Your flatmate's line is a punchy version of what philosophers call the **"Epistemic Objection"** to longtermism.

  He is right that uncertainty increases over time, but he might be wrong that this uncertainty invalidates the *entire* approach or automatically defaults to near-term aid.

  Here is a breakdown of the precise claims hidden inside his statement, ranked from "trivially true" to "philosophically devastating," along with whether they actually prove we should fund bednets instead.

  ### 1. The "All Probabilities are Subjective" Claim
  *   **The Claim:** There is no such thing as an objective frequency for unique events (like "probability of AI alignment in 2050"). Any number assigned is a subjective degree of belief, not a hard fact.
  *   **Is it Plausible?** **Yes, trivially.** In Bayesian decision theory, all probabilities for unique events are subjective estimates. This applies to bednets too (e.g., "probability this government doesn't steal the nets").
  *   **Does it sink Longtermism?** **No.** It applies equally to near-term interventions. If subjectivity invalidates EV, it invalidates bednets too.
  *   **Does it prove "Help People Now"?** **No.** It puts both options on the same footing of uncertainty.

  ### 2. The "Uncertainty Horizon" Claim
  *   **The Claim:** Epistemic uncertainty compounds over time. We can predict the impact of a bednet next year much better than the impact of a policy change in 100 years. Therefore, the error bars on long-term EV are so wide they encompass zero.
  *   **Is it Plausible?** **Yes.** Chaos theory and "black swan" events make specific long-range forecasting unreliable.
  *   **Does it sink Longtermism?** **Not necessarily.** It suggests we should discount future value, but not necessarily to zero. Longtermists argue that while *specific* interventions are hard to predict, the *sign* of the impact (e.g., "reducing existential risk is good") is robust.
  *   **Does it prove "Help People Now"?** **No.** This is the "Flow-Through Effects" problem. Helping people now also has long-term consequences we can't predict (e.g., saving a child today might lead to a dictator tomorrow, or a great scientist). If we can't predict the far future, we can't know if near-term aid is *better* for the far future than risk reduction.

  ### 3. The "Arbitrariness" Claim (His main point)
  *   **The Claim:** Because the numbers are so uncertain, the final EV calculation is driven entirely by the specific numbers you choose to plug in. You can tweak the probability of "success" from 0.1% to 1% based on a gut feeling and change the decision by a factor of 10. Thus, the math is just "laundering" your bias.
  *   **Is it Plausible?** **Yes, this is a serious technical risk.** This is often called "sensitivity to priors." If your conclusion flips based on minor adjustments to arbitrary inputs, the model is fragile.
  *   **Does it sink Longtermism?** **It sinks *specific* longtermist interventions** that rely on tiny probabilities of huge impacts (e.g., specific biosecurity projects). It forces longtermists to use "robustness checks" rather than point estimates.
  *   **Does it prove "Help People Now"?** **No.** Near-term interventions also rely on arbitrary assumptions (e.g., "counterfactuals"—what would have happened if we *didn't* donate?). The bednet EV is more *stable*, but not immune to this critique.

  ### 4. The "Model Uncertainty" Claim
  *   **The Claim:** It's not just that we don't know the *variables* (probabilities); we don't know the *structure* of the model. We don't know what values future people will have, what technologies will exist, or what "help" even means in 200 years.
  *   **Is it Plausible?** **Yes.** This is stronger than Claim 2. It argues we are missing "unknown unknowns."
  *   **Does it sink Longtermism?** **Potentially.** If we can't define "good outcomes" for the future, we can't maximize them. However, most longtermists argue that "existence is a prerequisite for having values," so ensuring survival is robustly good regardless of future values.
  *   **Does it prove "Help People Now"?** **No.** Same as Claim 2: we don't know how near-term aid affects the structural model of the future either.

  ### 5. The "Pascal's Mugging" Claim
  *   **The Claim:** If the future is potentially infinite (or vast), any non-zero probability of affecting it yields an infinite Expected Value. This breaks decision theory because a 1 in a trillion chance of saving the universe outweighs *any* certain good you can do now. Since these probabilities are made up, the theory is broken.
  *   **Is it Plausible?** **Yes, this is the strongest technical objection.** Standard Expected Utility Theory breaks down with infinite stakes and uncertain probabilities.
  *   **Does it sink Longtermism?** **It sinks "Naive Longtermism."** It forces longtermists to adopt "bounded utility functions" or "epistemic discounting" (ignoring probabilities below a certain threshold of evidence).
  *   **Does it prove "Help People Now"?** **No.** It proves that *unbounded* EV calculations are broken. It doesn't prove that near-term aid has higher EV, only that the long-term EV calculation needs a different mathematical framework.

  ### 6. The "Default to the Visible" Claim (His Conclusion)
  *   **The Claim:** Since long-term EV is unknowable, we should default to the intervention where the causal chain is shortest and most observable (bednets).
  *   **Is it Plausible?** **Debatable.** This is a heuristic, not a mathematical truth. It assumes that "visible good" equals "actual good."
  *   **Does it sink Longtermism?** **No.** It just shifts the burden of proof.
  *   **Does it prove "Help People Now"?** **This is the logical gap.** This claim assumes that near-term aid has *neutral* or *positive* long-term effects. But if the primary risk to humanity is existential (nuclear, AI, bio), and near-term aid does nothing to reduce that risk (or slightly increases population/consumption risk), then "Helping Now" could be objectively worse than "Helping Later," even under high uncertainty.

  ---

  ### How to use this with your flatmate

  You can tell him you agree with **Claim 3 (Arbitrariness)** and **Claim 5 (Pascal's Mugging)**. These are the strongest points in his favor.

  However, point out that **none of these claims logically lead to his conclusion (Claim 6).**

  **The Counter-Argument:**
  > "You're right that we can't calculate the precise EV of the far future. But we also can't calculate the far-future EV of bednets. If the stakes of the far future are millions of times larger (because it contains all future generations), even a *very* fuzzy chance of helping them might outweigh a *precise* chance of helping people now.
  >
  > Your argument proves we should be **humble** about longtermist numbers, but it doesn't prove we should **ignore** the long term entirely. To justify giving 100% to bednets, you have to assume that what we do today doesn't significantly change the probability of human extinction. Are you sure that's true?"

  **The Compromise:**
  Suggest that because of **Claim 3**, you shouldn't put 100% of money into one bucket. A split portfolio acknowledges the uncertainty of the far future without ignoring the stakes.
