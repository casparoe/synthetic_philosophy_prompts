  Second-year PhD student in cognitive science here, and I keep butting heads with my cohort over the whole "strange inversion of reasoning" business — Dennett's framing of Darwin and Turing as pulling off the same trick, getting competence without comprehension, design without a designer, arithmetic from a machine that has no idea what arithmetic is. It turned into a two-hour argument at a bar last week and I want a referee, because I think I've talked myself into a position and I'm no longer sure it survives contact.

  Here's where I've landed, tell me if it's right: if a blind, mindless process can produce creatures that behave as though they understand what they're doing, and a rule-following machine can produce output indistinguishable from thinking, then "understanding" and "thinking" are just labels we slap on the outputs, and there's nothing left on the comprehension side of the ledger for a cognitive scientist to actually study. The competence/comprehension distiction collapses into behaviorism with extra steps, and the only thing seperating me from a pocket calculator is a matter of degree — complexity, not kind. So my real question: once you've swallowed both inversions, what work is left for "genuine understanding" to do? Is there anything it explains that competence-plus-complexity doesn't already explain, or should I just stop using the word?

  Lead with your bottom line — is my picture right, or did I wreck it somewhere — then unpack it, and keep the whole thing under 400 words. I'm reading this on my phone between lab meetings.
