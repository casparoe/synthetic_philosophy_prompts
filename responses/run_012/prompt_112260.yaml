      *   **Observation:** Behaviorally, these look identical (avoiding negative reward). People slide between these interpretations to make moral claims (e.g., "training is horrifying") based on behavioral evidence that only supports Reading 1.
      *   **Goal:** The user wants a "carving" (conceptual distinction), not just a label. They want to know if these are two readings of one fact or two different facts. They want existing terminology (if any) and how their specific RL framing differs. They also ask about edge cases (e.g., an agent trained to seek negative reward).
