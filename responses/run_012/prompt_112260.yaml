      *   Reading 1 is *Mathematical/Engineering*. The minus sign is a coefficient in a loss function.
      *   Reading 2 is *Ethical/Phenomenological*. The minus sign is a qualia of suffering.
      *   The slippage happens because Functionalists argue that if the *role* is identical (avoidance, physiological stress signals, etc.), the *experience* must be identical. The user (rightly, from an engineering view) sees this as a category error.

  5.  **Address the "Rat" Analogy:**
      *   Yes, behaviorists (Skinner) treated rats as Reading 1.
