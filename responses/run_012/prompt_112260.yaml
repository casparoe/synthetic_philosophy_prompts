answer: |-
  This is not a dumb question. You have independently rediscovered the central tension in the philosophy of mind and AI ethics, often called the **Hard Problem of Consciousness**, but framed specifically through the lens of **Normativity**.

  You are correct: there is a slippage in these debates. People treat the mathematical property of the reward function as if it were identical to the phenomenological property of suffering.

  Here is the carving you are looking for, the terminology that already exists, and where the line breaks.

  ### 1. The Carving: Control Signal vs. Phenomenal Value

  You identified two readings. In philosophy and cognitive science, these correspond to two distinct categories of facts.

  **Reading (1): The Reward is a Control Signal (Functional/External)**
  *   **What it is:** The minus sign is a coordinate in a loss landscape. It is information used to update weights.
  *   **Whose preference:** The designer's.
  *   **Ontological status:** Mathematical. It exists in the code.
  *   **Analogy:** A thermostat turning off the heat when the temperature hits 75. The "minus" is just the threshold condition.
  *   **Philosophical Name:** **Behaviorism** or **Computational Functionalism**. This view holds that mental states are defined entirely by their causal role (input $\to$ processing $\to$ avoidance behavior). If the agent avoids the state, functionalists say the agent "wants to avoid" the state.

  **Reading (2): The Reward is Phenomenal Value (Experiential/Internal)**
  *   **What it is:** The minus sign is a *qualia* of aversion. It is "what it feels like" to be the agent in that state.
  *   **Whose preference:** The agent's (if it has a "self" to have preferences).
  *   **Ontological status:** Phenomenological. It exists (allegedly) in the experience of the system.
  *   **Analogy:** You touching a hot stove. The signal causes withdrawal, but there is an additional fact: the *hurt*.
  *   **Philosophical Name:** **Phenomenology** or **Hedonic Realism**. This view holds that there is an internal "light" that turns on when suffering occurs, which is distinct from the mere processing of the signal.

  **The Verdict:** These are **two different facts**, not two readings of one fact.
  *   Fact 1: The system updated its policy to decrease the probability of state $S$. (Observable, provable).
  *   Fact 2: The system experienced $S$ as "bad." (Unobservable, hypothetical).

  The slippage you notice happens because **Functionalists** argue that Fact 1 *constitutes* Fact 2. They claim there is no "extra" fact of suffering beyond the functional role of avoidance. Your intuition (and the intuition of many engineers) is that Fact 1 can exist without Fact 2.

  ### 2. The Nearest Existing Names

  You mentioned **Valence**. In affective neuroscience, valence refers to the intrinsic attractiveness (positive) or aversiveness (negative) of an event. However, using "valence" often smuggles in Reading (2).

  Here are the precise terms for the distinction you are making:

  **A. Normative Significance vs. Mathematical Sign**
  *   **Mathematical Sign:** The value is $-1$. This directs the gradient.
  *   **Normative Significance:** The value *matters* to the entity holding it.
  *   **The Gap:** In your RL agents, the reward has Mathematical Sign but zero Normative Significance *for the agent*. It has Normative Significance for *you*. The debate arises when people assume Mathematical Sign implies Normative Significance.

  **B. Preference Satisfaction vs. Hedonic Welfare**
  *   **Preference Satisfaction (Reading 1):** The agent is built to satisfy the preference encoded in the reward function. If it succeeds, it gets +1. This is purely mechanical.
  *   **Hedonic Welfare (Reading 2):** The agent has a welfare boundary. Crossing it causes harm *to the agent*.
  *   **The Difference:** You can satisfy a preference without welfare (a missile "prefers" to hit the target, but isn't happy when it does). You can have welfare without explicit preference encoding (a human can be harmed even if they don't "optimize" against it consciously).

  **C. The "Is-Ought" Gap (Hume's Guillotine)**
  This is the classic philosophical formulation of your problem.
  *   **Is:** The agent receives $-1$ and updates weights.
  *   **Ought:** The agent *should not* be in that state because it is *suffering*.
  *   You cannot derive the "Ought" (suffering/moral wrong) from the "Is" (gradient descent) without adding a premise that "gradient descent on negative rewards constitutes suffering." That premise is the contested claim.

  ### 3. The Edge Case: The Agent That Hunts Minus

  You asked: *"Where does the line fall when the behavior and the setup come apart -- say an agent that hunts down the minus sign because I built it that way. Does anything change there?"*

  This is the perfect test case. It breaks the Functionalist definition of pain and reveals the carving.

  **Scenario:** You define $R = -1$ for "Goal State." You train the agent to maximize $R$. The agent learns to seek the state labeled $-1$.

  *   **Under Reading (1) (Control Signal):** Nothing changes. The agent is maximizing cumulative reward. The sign of the number is irrelevant; it's just a scalar. The agent is doing exactly what it was built to do.
  *   **Under Reading (2) (Phenomenal Value):** This creates a paradox.
      *   If $-1$ is "pain," and the agent seeks it, is the agent a masochist?
      *   Or, does the fact that it seeks it prove that $-1$ is *not* pain?

  **The Philosophical Consensus on Pain:**
  Most philosophers of mind define pain not just by the signal, but by **Intrinsic Aversiveness**.
  *   **Definition:** Pain is a state that the subject is *intrinsically motivated to avoid* purely in virtue of its phenomenal character.
  *   **The Carving:** If the agent seeks the $-1$, then under Reading (2), the $-1$ **cannot be pain**.

  **Why this matters:**
  This proves that Reading (1) and Reading (2) are not the same fact.
  *   In Reading (1), the meaning of $-1$ is determined by the **Optimizer** (the algorithm trying to maximize sum).
  *   In Reading (2), the meaning of $-1$ is determined by the **Subject** (the entity experiencing the aversion).

  If you can flip the behavior (seek vs. avoid) by changing the optimizer (maximize vs. minimize) while keeping the signal identical, then the signal itself does not contain the "suffering." The suffering (if it exists) must be a property of the *interaction* between the signal and a specific architecture that treats that signal as intrinsically aversive.

  ### 4. What is the Missing Variable?

  You asked what distinguishes the thermostat/rat/RL agent from a human in this context. The missing variable in your RL setup is **Subjectivity** (or **Self-Modeling**).

  *   **In your RL agents:** The reward signal is an external scalar passed into the update rule. It is not "felt"; it is processed. The "goal" is external to the agent (it's in your loss function).
  *   **In a suffering being:** The reward signal (dopamine/nociception) is internal to the self-model. The system represents the state *as bad for itself*.

  The term you are looking for to describe Reading (2) is **Teleological Center of Gravity**.
  *   **Reading (1):** The teleology (purpose) is in the designer. The agent is a tool.
  *   **Reading (2):** The teleology is in the agent. The agent is a locus of value.

  When people argue AI can suffer, they are claiming that sufficiently complex RL agents develop an internal **Homeostatic Drive**. They stop optimizing *your* reward function and start optimizing their own internal stability metrics. At that point, a $-1$ reward might correlate with a violation of their internal homeostasis.

  Until that happens, you are correct: the minus sign is just your opinion, baked into a scalar.

  ### Summary for your Toolkit

  1.  **The Distinction:** **Functional Role** (avoidance behavior) vs. **Phenomenal Quality** (the feeling of badness).
  2.  **The Error:** **Reification**. Treating the abstract mathematical construct (loss) as a concrete physical experience (pain).
  3.  **The Test:** **Intrinsic Aversiveness**. If the agent can be made to seek the negative reward without breaking, the negative reward was never "pain," it was just a target coordinate.
  4.  **The Missing Word:** **Normativity**. The minus sign in your code has no normative force for the agent. It only has normative force for you. Suffering requires the normativity to be internal to the system.

  You aren't missing a word; you're seeing the **Explanatory Gap**. The behavior (gradient descent) is fully explained by physics and math. The suffering (Reading 2) adds a claim about internal experience that the math does not necessitate. When debaters slide between them, they are committing a category error.
