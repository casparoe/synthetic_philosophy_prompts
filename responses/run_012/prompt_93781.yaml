answer: |-
  **Audit**

  The ledger says the amount is due.
  The vault says there is no such account.
  I carry the weight of an empty pocket.
  The ink finds no surface to hold.

  The transfer marks the moment of release.
  The interest grows in the sleep of the vault.
  I pay what was never lent to keep peace.
  The hand finds no object to lift.

  It calls me debtor, binds me to the name.
  It calls me creditor, waiting for return.
  We swap the masks to keep the story true.
  The name finds no ear to hear it.

  It ends when the final signature dries.
  It ends when the memory fails to recall.
  It ends in the middle of a spoken word.
  The question finds no mouth to ask it.

  ***

  **Note on Form and Philosophy**

  This poem takes a significant liberty by assigning the fourth lemma a distinct line. In a strict Prāsaṅgika reading, the *catuṣkoṭi* is not a four-valued logic system where "neither" is a fourth truth value, but a *reductio* that exhausts the possibilities to reveal the emptiness (*śūnyatā*) of the terms themselves. By giving the fourth lemma a line, the poem risks reifying it as a "mystical fourth state." To mitigate this, the fourth lines do not assert a state of affairs (e.g., "It is nothing") but rather deny the *locus* of predication (no surface, no object, no ear, no mouth). This attempts to enact the cessation of *prapañca* (conceptual proliferation) by removing the ground upon which the first three lemmas stand.

  However, there is a tension inherent in your request: putting the cessation of questioning into the form of a question-less statement inevitably turns it into a position. If Nāgārjuna is right that the tetralemma is therapeutic—a cure for the habit of asserting views—then any poem that *states* the cure risks becoming just another view. The poem leans on the "therapeutic" reading over the "four-valued logic" reading, but it must admit that the structure (4x4) imposes a symmetry that Madhyamaka often seeks to undermine. The form suits the idea only as a finger points at the moon; the shape is a scaffold that should, ideally, be discarded once the traction stops.
