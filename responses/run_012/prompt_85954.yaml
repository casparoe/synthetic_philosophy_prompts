answer: |-
  ### Specification for an Account of Idealisation

  The following table sets out the desiderata for a normative account of idealisation in scientific modelling. These are not merely descriptions of current practice but constraints intended to adjudicate disputes over model legitimacy.

  | # | Requirement | Motivation & Case | Status |
  | :--- | :--- | :--- | :--- |
  | **1** | **The Distortion/Omission Distinction** | The account must distinguish between *misrepresentation* (asserting $X=0$ when $X \neq 0$) and *abstraction* (leaving $X$ out of the model ontology).<br>**Case:** A frictionless plane (distortion) behaves differently under intervention than a model that simply ignores air resistance because it is negligible in context (omission). Collapsing them prevents diagnosing why a model fails when conditions change. | **Non-negotiable** |
  | **2** | **The Non-Circularity Constraint** | Legitimacy cannot be defined solely by the truth of the model's conclusions.<br>**Case:** If we say an assumption is valid *because* the prediction holds, we cannot use the model to test the prediction. This renders the model useless for discovery. We need a criterion for the assumption that does not presuppose the result. | **Non-negotiable** |
  | **3** | **The Robustness Constraint** | The account must explain how mutually inconsistent models can support the same conclusion.<br>**Case:** Different macroeconomic models with contradictory micro-foundations often predict the same inflation trend. If truth requires consistency, one must be false. Yet their agreement is treated as evidence. The account must explain this confirmatory power without asserting both are literally true. | **Non-negotiable** |
  | **4** | **The Friedman Constraint** | The account must take a stand on the 'F-twist' (that more unrealistic assumptions can make a theory *more* significant).<br>**Case:** Friedman argues assumptions should be 'wildly inaccurate' if they aid prediction. However, for intervention (Req 5), wildly inaccurate causal assumptions lead to policy failure. The account must reject the strong F-twist as a guide for policy, treating it at best as a heuristic for prediction-only contexts. | **Non-negotiable** (Strong version rejected) |
  | **5** | **The Modal Strength Constraint** | The account must validate models used for extrapolation and intervention, not just in-sample fitting.<br>**Case:** A model may predict past data well using spurious correlations (e.g., skirt lengths and stock markets). An account of idealisation that validates this fails when asked 'what happens if we ban skirts?'. Idealisations must preserve the structure relevant to the *wiggle*, not just the fit. | **Non-negotiable** |
  | **6** | **The Ex Ante Guidance Constraint** | The criteria must be usable by a modeller who does not yet know which assumptions are critical.<br>**Case:** If we can only judge an idealisation *after* seeing the result, modelling becomes trial-and-error rather than design. A normative account should offer principles for selecting idealisations before the simulation runs. | **Contestable** (Source of Tension) |

  ### The Inconsistency: The Ex Ante Paradox

  The specification above contains a critical tension. **Requirement 6 (Ex Ante Guidance) is incompatible with the joint satisfaction of Requirement 2 (Non-Circularity) and Requirement 5 (Modal Strength).**

  Here is the exclusion logic:

  1.  To satisfy **Req 5 (Modal Strength)**, the legitimacy of an idealisation must depend on whether it preserves the causal structure relevant to the intervention. If you distort a causal lever, the intervention fails.
  2.  To satisfy **Req 2 (Non-Circularity)**, you cannot justify the idealisation by pointing to the success of the output (the prediction or intervention result).
  3.  Therefore, to satisfy **Req 6 (Ex Ante Guidance)**, the modeller must be able to identify *beforehand* which parts of the causal structure are relevant and which idealisations preserve them.
  4.  **The Conflict:** If the modeller already knew which causal structures were relevant and robust to distortion, they would not need to build the model to find out. The purpose of modelling is often to discover exactly this.
  5.  **Conclusion:** You cannot have a guaranteed *ex ante* guide for idealisation that ensures intervention validity without begging the question. **Requirement 6 must be downgraded.** An adequate account can offer *heuristics* for model-building, but it cannot provide a decision procedure that guarantees success without *ex post* checking (which risks Req 2) or prior knowledge (which negates the need for the model).

  Any account that promises a conflict-free, *ex ante* recipe for idealisation that guarantees intervention success is selling a fantasy. The tension is not a bug in the philosophy; it is a feature of the epistemic predicament of modelling.

  ### On Friedman's F-Twist (Requirement 4)

  Regarding your stipulation on Friedman: An adequate account of idealisation **must reject the strong F-twist** as a normative principle.

  The thesis that 'the more unrealistic the assumption, the better the theory' conflates *isolation* with *falsity*.
  *   **Isolation** (holding a factor constant to study another) is often necessary and legitimate.
  *   **Falsity** (asserting a factor is constant when it is not, and causally potent) is dangerous.

  The F-twist works only in limited contexts where the false assumption acts as a harmless placeholder for a complex mechanism that averages out (e.g., assuming perfect rationality in large markets). However, for **Requirement 5 (Intervention)**, the F-twist is fatal. If you intervene on the very variable you assumed away or distorted wildly, the model provides no traction. Therefore, while the F-twist might describe why some predictive models survive, it cannot prescribe how to build models for understanding or policy. An account that accommodates the strong F-twist fails the Modal Strength Constraint.

  ### Evaluation of Three Accounts

  Here is how three common philosophical accounts fare against the desiderata, keeping the weight on the requirements as requested.

  #### 1. The Instrumentalist Account
  *Assumptions are mere tools for prediction; they have no representational content.*

  *   **Performance:** Satisfies **Req 2** (Non-Circularity) easily, as truth is irrelevant. Satisfies **Req 3** (Robustness), as inconsistent tools can yield the same output.
  *   **Failure:** Collapses **Req 1** (Distinction). If assumptions are just tools, it matters little whether you omit or distort, provided the lever works. Consequently, it fails **Req 5** (Intervention). If the assumption has no representational content, the model cannot tell you what happens when you manipulate the real-world counterpart of that assumption. It treats the model as a black box, which is useless for policy design.
  *   **Verdict:** Fails the core purpose of scientific modelling beyond curve-fitting.

  #### 2. The Fictionalist Account
  *Assumptions are props in a game of make-believe; we explore the consequences of the fiction.*

  *   **Performance:** Handles **Req 1** (Distinction) well, as fictions can be clearly defined as counterfactuals. Handles **Req 3** (Robustness) by suggesting different fictions can map to the same 'real' moral.
  *   **Failure:** Struggles with **Req 5** (Modal Strength). It is difficult to derive genuine counterfactuals about the *real* world from a fiction without a bridge principle explaining *why* the fiction tracks reality. If the bridge principle relies on the success of the prediction, it violates **Req 2**. If it relies on causal similarity, it collapses into the Causal account.
  *   **Verdict:** Elegant for classification, but lacks the traction to guide intervention without smuggling in causal claims.

  #### 3. The Causal/Structural Account
  *Legitimacy depends on preserving the causal structure relevant to the specific question.*

  *   **Performance:** Satisfies **Req 5** (Intervention) by definition. Satisfies **Req 1** (Distinction) by analysing how distortion vs. omission affects causal pathways. Satisfies **Req 4** (Friedman) by rejecting the strong F-twist where causal levers are distorted.
  *   **Failure:** Hits the **Inconsistency** hard. It fails **Req 6** (Ex Ante Guidance). To know if the causal structure is preserved, you generally need to know the result or the true theory, which violates **Req 2** or renders the model redundant. It also struggles with **Req 3** (Robustness); if models have different causal structures, this account implies they cannot both be right, making their agreement harder to explain than in the Instrumentalist view.
  *   **Verdict:** The only account that supports intervention, but it admits that model-building is a risky, *ex post* validated process rather than an *ex ante* algorithm.

  ### Summary

  If your paper aims to guide model-building for intervention and extrapolation, the **Causal/Structural** account is the only viable candidate, despite its inability to offer guaranteed *ex ante* rules. The Instrumentalist and Fictionalist accounts fail **Requirement 5**, which you have marked as non-negotiable.

  However, you must explicitly acknowledge the **Ex Ante Paradox**. You cannot provide a checklist that guarantees a model's assumptions are safe before the model is run. The 'guidance' an account offers is not a recipe for success, but a diagnostic framework for failure. It tells the modeller: "If you distort this specific type of causal link, your model will break under intervention." That is the most adequate account can do without violating the Non-Circularity Constraint.
