      *   *The Big Conflict:* The most critical inconsistency is between **Req 6 (Ex Ante Guidance)** and **Req 2 (No Circular Truth Appeal)**.
          *   To guide *ex ante*, you need a criterion of legitimacy that doesn't depend on the output.
          *   To avoid circularity (Req 2), you can't say "it's legitimate if it works."
          *   So you need a priori criteria of legitimate idealisation.
          *   But Req 5 (Intervention) suggests legitimacy depends on causal structure.
          *   Modellers often *don't know* the causal structure *ex ante* (that's why they model).
          *   *Result:* You cannot have a complete *ex ante* guide that guarantees non-circularity and intervention validity. One must give. Usually, it's Req 6 that fails; modelling is exploratory, not algorithmic.

  5.  **Drafting the Content (Iterative refinement):**

