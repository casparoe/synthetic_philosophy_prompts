      *   **Key Constraint:** Identify tensions/inconsistencies between requirements. If the list is inconsistent, highlight which requirement excludes which.
      *   **Format:** Table for desiderata preferred. British English. No citations/reading list. Argue from cases.
      *   **Specific Stipulations (1-6):**
          1.  Cover distortion and omission under one heading without collapsing them.
          2.  No appeal to truth of conclusions (avoid circularity like "robustness" without prior justification).
          3.  Accommodate incompatible but successful models (robustness analysis).
          4.  Address Friedman's F-twist (unreality of assumptions = significance). Take a stand, don't just say "it's contested".
          5.  Apply to intervention/extrapolation, not just in-sample prediction.
          6.  Usable by modellers *ex ante* (before knowing which idealisations matter).
      *   **Evaluation:** Briefly score three accounts (Instrumentalist, Fictionalist, Causal/Structural) against the list.
      *   **Tone:** Philosophical, rigorous, analytical.

  2.  **Deconstruct the Stipulations into Desiderata:**

      *   *Stipulation 1 (Distortion vs. Omission):* Needs a distinction between *misrepresentation* (asserting $X=0$ when $X \neq 0$) and *abstraction* (leaving $X$ out of the ontology). An account must distinguish these because they fail differently.
      *   *Stipulation 2 (No Truth Appeal):* The "Non-Circularity Constraint". We can't justify the assumption by the success of the prediction, because that's what we are testing.
      *   *Stipulation 3 (Incompatible Models):* The "Robustness Constraint". If Model A (frictionless) and Model B (viscous) both predict $Y$, the account must explain why this convergence supports $Y$ despite contradictory assumptions.
      *   *Stipulation 4 (Friedman's F-Twist):* The "Unreality Constraint". Does more false = better? Or is this a category error? I need to take a stand here as per instructions.
      *   *Stipulation 5 (Intervention/Extrapolation):* The "Modal Strength Constraint". Prediction is easy; policy requires knowing what happens when we wiggle the variables. Idealisations often break here.
      *   *Stipulation 6 (Ex Ante Guidance):* The "Heuristic Constraint". Can a modeller use this *while* building the model? This clashes with Stipulation 2 (which looks *ex post* at results) and Stipulation 5 (which requires knowing causal structure).

  3.  **Drafting the Desiderata Table:**

      *   Need columns: Requirement, Motivation/Case, Status (Non-negotiable vs. Camp Preference).
