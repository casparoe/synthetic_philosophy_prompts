      *   *Friedman's F-Twist:* I need to take a stand. The prompt says "Do not report merely that it is contested." I will argue it is a category error that conflates isolation with falsity. It violates Req 5.
      *   *The Three Accounts:*
          1.  *Instrumentalist:* Good at Req 2 & 3, fails Req 5 & 6 (no guidance on *which* instrument).
          2.  *Fictionalist:* Good at Req 1 & 3, struggles with Req 5 (how do fictions support counterfactuals?).
          3.  *Causal/Structural:* Good at Req 5 & 1, struggles with Req 3 (how do false causes yield true effects?) and Req 6 (requires knowledge we lack).

  6.  **Refining British English:**
      *   Use "modelling", "idealisation", "programme", "centre", "analyse".
