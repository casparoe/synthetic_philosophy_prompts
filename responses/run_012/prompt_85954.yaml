  4.  **Identifying the Tensions (The Core Task):**

      *   *Tension A:* Req 2 (No Truth Appeal) vs. Req 6 (Ex Ante Guidance). How do you guide a modeller *before* they know the result without checking the result? This is the "Problem of Induction" for modelling.
      *   *Tension B:* Req 3 (Incompatible Models) vs. Req 5 (Intervention). Incompatible models might predict the same outcome (Req 3), but they will recommend different interventions (Req 5). If the account validates both for prediction, how does it choose for policy?
