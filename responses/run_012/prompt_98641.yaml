  3.  **Address Question (a): The Nature of Sensation (Sentire):**
      *   *Key Terminology:* The Latin *sentire* and French *sentir* are slippery. They can mean "to feel" (phenomenally) or "to sense/perceive" (physiologically).
      *   *Descartes' Definition:* For Descartes, *consciousness* is the mark of the mental (*cogito*). If animals aren't conscious, their "sensation" must be physiological.
      *   *The Mechanism:* Nerves -> Animal Spirits -> Pineal Gland -> Muscle movement. No "inner light" required.
      *   *The More Letter:* When he tells More "I don't deny life or sensation," he likely means *biological function* and *sensory processing*, not *phenomenal awareness*. However, scholars debate this. Some think he wobbled. The strongest Cartesian line is: Sensation *as we know it* involves thought. Animals have the *bodily correlate* of sensation without the *mental awareness*.
      *   *Analogy:* A heat sensor triggers a sprinkler. The sensor "senses" heat, but doesn't "feel" hot.

  4.  **Address Question (b): The Tests (Language & Flexibility):**
      *   *The Tests:* 1. Language (creative use of signs), 2. Flexibility (acting appropriately in novel situations vs. specialized instinct).
      *   *The Leap:* Descartes moves from "They can't do X" to "They have no mind/soul."
      *   *The Logic:* For Descartes, Mind = Thought = Consciousness. If there is no evidence of Thought (via Language/Flexibility), there is no Mind. If no Mind, then no *Res Cogitans*.
      *   *The Gap:* Does failing the test prove no *experience*? Not necessarily. A locked-in human might fail the language test but have a mind. Descartes assumes the *only* way mind manifests is through adaptable reason/language.
      *   *Soul Connection:* The "Soul" (*âme*) for humans is the Rational Soul. Animals might have a "Sensitive Soul" (Aristotelian view), but Descartes rejects the tripartite soul. For him, *âme* usually implies the rational, immortal substance. So, proving they lack reason proves they lack the *immortal* soul.

  5.  **Address Question (c): Rhetoric vs. Metaphysics & Load-Bearing:**
      *   *Theological Context:* The Sorbonne and Church were worried about materialism. If humans are machines, where is the soul? If animals have souls, are they immortal? (Transmigration issues).
      *   *Descartes' Strategy:* Drive a wedge. Humans = Mind + Body. Animals = Body only. This protects human exceptionalism and immortality.
      *   *Load-Bearing:* The *real* load-bearing pillar is the **Mind-Body Dualism**. If animals feel pain (phenomenally), then consciousness is not identical to thought. If consciousness can exist without rational thought, the *Cogito* foundation shakes. It opens the door to materialism (maybe the brain just produces consciousness). So, denying animal experience is crucial to keep "Thought" and "Extension" strictly separate.
