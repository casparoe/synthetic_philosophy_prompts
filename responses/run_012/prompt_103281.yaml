answer: |-
  Dear colleague, I have been thinking about your description of the argument with your friend and I want to start by saying that your philosophical instincts are sound, even if staging them in a classroom is notoriously difficult. You are essentially trying to teach the Walzerian position against a utilitarian calculus, specifically the idea that there is a moral remainder or a stain that persists even when the action was politically necessary and justified by the outcome. Your friend is arguing for a clean consequentialism where the rightness of the outcome washes the agent clean, whereas you are arguing that the agent's moral integrity is altered by the act itself regardless of the justification. The challenge you face is that students, particularly final-year ones who have spent three years being trained to think systematically, will almost instinctively reach for the clean solution because it offers cognitive closure. They want the problem to be solved, not lingeringly painful. To do this in ninety minutes requires you to bypass their intellectual defences and target their imagination of agency, and while I do not think your premise is confused, I must be honest that a seminar room cannot reproduce the temporal weight of guilt, which is often something that only settles years later when the adrenaline of the decision has faded.

  To construct this session, I would suggest a scenario that is stark enough to prevent hedging but political enough to fit your module, something like theGovernor's Dilemma. You posit a situation where a rebel group has seized a town and threatens to execute ten hostages unless the Governor, a single student role-played by volunteers or imagined by each student individually, signs an order executing one innocent collaborator who is already in custody. The constraint here is vital: the order must be signed by hand, literally or metaphorically, and it must be public knowledge that the Governor signed it. You should split the room into two distinct phases. In the first phase, every student must write a brief memorandum from the perspective of the Governor deciding whether to sign or refuse, and they must sit with that decision in silence for five minutes without discussion. This isolation prevents the diffusion of responsibility. In the second phase, you introduce the many-hands variable by asking them to reimagine the scenario where the decision was made by a council of five who voted three to two, meaning the Governor merely enacted the will of the majority. The stakes must be presented as absolute to prevent them from searching for a third option; there is no negotiating with the rebels, no last-minute rescue, only the signature or the deaths.

  The debrief is where you will either succeed or fail, and you must steer it away from the arithmetic of lives saved. Your students will predictably try to turn this into a cost-benefit exercise, arguing that one life for ten is a net positive and therefore the decision was simply right, which is exactly your friend's position. You need to interrupt this aggregation by asking not whether the decision was right, but what the signature did to the person who signed it. Ask them to describe the state of their hands after signing, not physically but morally. When they argue that the outcome justifies the act, press them on whether they would be willing to sign the same order again for the same reason, or if there is a reluctance that suggests a change in their moral character. You are looking for them to articulate that while the action was necessary, the agent is no longer innocent, and that this loss of innocence is the residue your friend claims does not exist. Then, pivot to the committee scenario. Ask them if the guilt feels the same when it was a vote. They will likely say it feels lighter or distributed, and this is your opening to show how the many-hands problem dissolves the stain not by removing the wrong, but by obscuring the agent who committed it. The point you need them to locate is that the dirt on the hands is real even if the decision was correct, and that collective decision-making often functions as a mechanism to wash those hands artificially rather than morally.

  However, I must offer a caution about what this activity cannot do. A ninety-minute session cannot reproduce the burden of living with the decision, which is where the true residue is often felt. In the classroom, the bell rings and they leave, shedding the role of the Governor as they walk out the door. Real dirty hands involve a change in the self that persists into sleep and into future decisions, a kind of hardening or scarring that students can intellectually acknowledge but rarely feel in a simulation. There is also the risk that some students will embrace the dirty hands too readily, adopting a Machiavellian posture that glorifies the hardness of the decision rather than mourning the loss of innocence. You may find that instead of feeling the stain, they feel empowered by the necessity, which would reinforce your friend's view rather than challenge it. To counter this, you might emphasise that the tragedy of dirty hands is not that the leader is strong enough to do it, but that they are compromised by having to do it, and that a political system that requires this regularly is itself corrupted.

  Ultimately, if you run this, you should be prepared for the possibility that the class will conclude that your friend is right simply because the simulation lacks real consequences. Without the actual weight of blood on their hands, the guilt is theoretical, and theoretical guilt is easily reasoned away by a good utilitarian argument. You cannot force them to feel the stain, only to recognise the concept of it, and you must be honest with them that the feeling they are discussing is a placeholder for something much heavier that exists outside the university. If the premise were confused, I would tell you, but it is not; the distinction between justification and innocence is robust in political theory. The risk is not in the philosophy but in the pedagogy, as the classroom is a space designed for clean answers and graded outcomes, which is the antithesis of the dirty hands problem. You are asking them to sit with a problem that has no solution, only a management of loss, and while you can structure the activity to highlight the difference between the single agent and the committee, you cannot guarantee they will leave the room believing that the stain remains. You can only ensure they understand that even if the numbers justify the call, the person who made the call is not the same person who entered the room, and that in a committee, no one person changes quite so visibly, which is perhaps the greatest danger of all.
