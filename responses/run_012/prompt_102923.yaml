answer: |-
  Here are the desiderata for a theory of inductive simplicity, followed by an analysis of the tensions between them and the identification of the most exclusionary requirement.

  ### Desiderata for a Theory of Inductive Simplicity

  **1. Predictive Efficacy (Overfitting Avoidance)**
  *   **Requirement:** The theory must demonstrate that preferring simpler hypotheses yields better out-of-sample predictive accuracy than preferring complex hypotheses, given finite data.
  *   **Motivation:** The primary functional role of Occam's Razor is to prevent overfitting. In curve-fitting cases (e.g., polynomials fitting noisy data), a theory of simplicity must penalize complexity enough to reject hypotheses that accommodate noise as if it were signal. If the measure of simplicity does not correlate with generalization error, it fails its instrumental purpose.

  **2. Representational Invariance (up to a Constant)**
  *   **Requirement:** The ranking of hypotheses by simplicity must remain stable under computable transformations of the language or coordinate system used to describe them, allowing only for an additive constant dependent on the translation between languages.
  *   **Motivation:** This addresses the "Grue/Bleen" problem and parameterization dependence. If a hypothesis is "simple" in Cartesian coordinates but "complex" in polar coordinates, simplicity is an artifact of description, not a property of the hypothesis. A robust theory must acknowledge that description length is language-relative (as in Kolmogorov complexity) but demand that the *relative* ordering of sufficiently distinct hypotheses converges across reasonable universal languages.

  **3. Bayesian Coherence**
  *   **Requirement:** The simplicity penalty must be derivable from or consistent with the axioms of probability theory, specifically functioning as a prior probability distribution over the hypothesis space.
  *   **Motivation:** Inference should not violate the laws of probability (to avoid Dutch books). Simplicity should not be an *ad hoc* penalty added after likelihood calculation (unless asymptotically equivalent to a prior); it should reflect a pre-data commitment to certain structures. The theory must explain how "simplicity" maps to "prior probability mass."

  **4. Continuity and Domain Generality**
  *   **Requirement:** The theory must extend to hypothesis spaces that are continuous, infinite, or continuously parameterized, without relying solely on discrete string encodings.
  *   **Motivation:** Scientific hypotheses (e.g., differential equations in physics) often inhabit continuous spaces. Standard complexity measures (like Kolmogorov complexity) are defined for finite strings. A theory that cannot handle continuous parameters without arbitrary discretization fails to cover the most successful domains of scientific inference. It must resolve how to assign complexity to a real-valued parameter (e.g., via measure theory or geometric volume).

  **5. Computational Tractability**
  *   **Requirement:** The simplicity measure must be computable by a bounded agent within a reasonable time frame relative to the data size.
  *   **Motivation:** A theory of inference is a guide for action. If the optimal simplicity measure requires solving the halting problem or integrating over intractable spaces, it cannot be used by humans or machines to actually form beliefs. The theory must offer a usable approximation or explain why the uncomputable ideal is nonetheless the normative standard.

  **6. Explicit Inductive Bias Acknowledgement**
  *   **Requirement:** The theory must explicitly state that the preference for simplicity is a contingent assumption about the structure of the world (a bias), rather than a logical necessity.
  *   **Motivation:** This addresses the "No Free Lunch" theorems. No inductive method performs better than any other across *all* possible data distributions. To prefer simplicity is to assume the world is likely simple. The theory must not disguise this assumption as a theorem of logic or probability; it must locate the bias openly within the prior or the loss function.

  **7. Epistemic Clarity (Truth vs. Utility)**
  *   **Requirement:** The theory must specify whether simplicity is a proxy for truth (realism) or merely a tool for prediction (instrumentalism).
  *   **Motivation:** If simplicity tracks truth, the theory needs a mechanism linking brevity to verisimilitude. If it is merely pragmatic, the theory needs to explain why simpler models are more useful even if false. Conflating the two leads to unjustified metaphysical claims about the "simplicity of nature."

  ---

  ### Incompatible Desiderata and Tensions

  **Tension 1: Representational Invariance vs. Computational Tractability**
  *   **The Conflict:** The only known measure that satisfies Representational Invariance (up to a constant) is Kolmogorov Complexity (and its Bayesian counterpart, Solomonoff Induction). However, Kolmogorov Complexity is uncomputable. Any computable approximation (e.g., Lempel-Ziv, AIC, BIC) necessarily violates strict Invariance because it relies on specific compression algorithms or parameterizations that favor certain patterns over others.
  *   **Implication:** You cannot have a theory that is both language-invariant and runnable. You must choose between a normative ideal that cannot be used (Solomonoff) and a usable method that is language-sensitive (MDL/AIC).

  **Tension 2: Explicit Inductive Bias vs. Universal Reliability (The "No Free Lunch" Tension)**
  *   **The Conflict:** This is the tension you highlighted. If a theory claims that simplicity is a *universally reliable* method for inference (i.e., it dominates other methods regardless of the environment), it contradicts the No Free Lunch theorems, which prove that no method dominates without building in a bias that matches the environment.
  *   **Implication:** A theory cannot satisfy **Explicit Inductive Bias Acknowledgement** (admitting simplicity is a contingent bias) and simultaneously claim **Universal Reliability** (that simplicity works regardless of the world's structure). If the theory admits the bias, it concedes it will fail in complex worlds. If it claims universal reliability, it is mathematically false.

  ---

  ### The Single Exclusionary Requirement

  The requirement that excludes the most otherwise attractive accounts is **Computational Tractability**.

  **Justification:**
  The theoretically most robust account of inductive simplicity is **Solomonoff Induction**. It satisfies **Representational Invariance** (up to a constant), **Bayesian Coherence**, **Domain Generality** (via discrete universal priors), and provides a rigorous link between simplicity and predictive convergence (it dominates any computable predictor asymptotically). It is the "gold standard" for a formal theory of induction.

  However, Solomonoff Induction is uncomputable. By demanding **Computational Tractability**, you immediately exclude Solomonoff Induction and any theory that relies on exact Kolmogorov complexity. This forces the acceptance of approximations (like Minimum Description Length or Bayesian Information Criterion) which, while usable, sacrifice the theoretical guarantees of Invariance and Asymptotic Optimality that make the ideal account attractive.

  If you relax **Computational Tractability**, you retain the only theory that solves the Invariance and Bias problems rigorously (by pushing the bias into the choice of the Universal Turing Machine). If you enforce it, you are left with pragmatic heuristics that cannot fully justify *why* they work without referencing the uncomputable ideal they approximate. Thus, Tractability is the filter that removes the only complete theoretical solution, leaving only partial, pragmatic accounts.
