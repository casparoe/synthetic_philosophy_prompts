prompt: |-
  Two jurists sit on an advisory commission drafting the charter of an international tribunal that a victorious coalition will convene to try the leaders of the state it has just defeated. They agree that the new tribunal will be measured against Nuremberg and Tokyo; they disagree about whether it should be modeled on them, and their disagreement runs back to what they think those tribunals were. The first jurist maintains that the offenses on the draft list were already unlawful when they were committed — that the planning and waging of aggressive war violated customary international law, and that atrocities against civilians violated the laws and customs of war — so that a tribunal which declares this law is applying it rather than making it. The second maintains that no treaty or custom then in force attached individual criminal liability to the waging of aggressive war; that a defendant convicted on that charge is punished for conduct that was not criminal when he engaged in it; and that the tribunal, however salutary its purpose, is legislating for the occasion and applying its legislation backward.

  Both jurists accept, for the sake of argument, a threefold distinction among forms of retroactivity: retroactive definition, in which conduct previously lawful is declared criminal; retroactive jurisdiction, in which conduct already criminal under some domestic law is made triable before a new international forum; and retroactive attribution, in which a mode of individual liability — the responsibility of a commander who fails to punish his subordinates, say, or liability for participation in a common plan — is applied to conduct that predates the codification of that mode. They disagree about which of these, if any, is fatal to a tribunal's legitimacy, and about whether the first and the third are really distinct.

  Write their dialogue. In the course of it, the second jurist should press a difficulty of self-presentation: the tribunal must justify itself to the defeated, who will call it the vengeance of the strong, and to the future, for which it must stand as a precedent; yet the more it presents itself as declaring pre-existing law, the weaker its claim to lay down law that will bind future wars, while the more it presents itself as laying down such law, the more it concedes that the defendants were tried under law that did not exist when they acted. The second jurist should also observe that the bench, the charter, and the choice of charges are the victors' own work, and should raise the objection that the victors have themselves done things resembling what they now charge; he may add that a frankly political reckoning would at least be honest about what it is. The first jurist must answer these points rather than evade them, and may argue that the legal form was what kept the reckoning from becoming an execution and made a record that outlasts the victors.

  Requirements: neither jurist is a caricature, and neither may win by assertion; each must engage the strongest form of the other's position and concede whatever seems to him genuinely right in it; neither may settle a question by appealing to what the Nuremberg or Tokyo tribunals held, since both know who wrote those charters. By the end the two should have located precisely what divides them — whether it is a disagreement about the content of customary law, about the concept of law, or about what a tribunal may permissibly do — and should have said what each would have to give up for them to converge. It is not required that they agree. Aim for a sustained exchange, with several substantial turns on each side, rather than a sketch.
reasoning: |-
  Here's a thinking process that leads to the dialogue above:

  1.  **Analyze the Prompt:**

      *   **Characters:** Two jurists (Jurist 1 and Jurist 2) on an advisory commission drafting a charter for a new international tribunal (post-war context, similar to Nuremberg/Tokyo but distinct).
      *   **Core Disagreement:**
          *   Jurist 1 (J1): Believes the offenses (aggressive war, atrocities) were *already* unlawful under customary international law. The tribunal is *declaring* law, not making it. (Legal Positivist/Natural Law hybrid leaning towards continuity).
          *   Jurist 2 (J2): Believes no treaty/custom attached *individual criminal liability* for aggressive war at the time. The tribunal is *legislating* retroactively. (Legal Realist/Strict Positivist leaning towards nullum crimen sine lege).
      *   **Shared Framework:** Both accept a threefold distinction of retroactivity: Definition (lawful -> criminal), Jurisdiction (domestic criminal -> international forum), Attribution (individual liability modes like command responsibility).
      *   **Key Arguments to Include:**
          *   J2: The "Self-Presentation Difficulty" (Paradox of Precedent). If you claim it's old law, you can't bind the future with new law. If you claim it's new law, you admit retroactivity.
          *   J2: The "Victors' Justice" objection. The victors wrote the charter, chose the bench, and may have committed similar acts. A political reckoning would be more honest.
          *   J1: Must answer these points, not evade. Argument: Legal form prevents execution/vendetta and creates a lasting record.
      *   **Constraints:** No caricatures. No winning by assertion. Must engage strongest forms. Cannot appeal to Nuremberg/Tokyo holdings as authoritative (since they know who wrote those charters).
      *   **Goal:** Locate the precise divide (content of custom, concept of law, or permissible tribunal action) and state what each would have to give up to converge. No requirement to agree.
      *   **Format:** Sustained dialogue, substantial turns.

  2.  **Character Conception:**

      *   **Jurist 1 (Let's call her Elias):** Idealistic but grounded. Believes in the moral continuity of law. Sees the tribunal as a bridge between morality and legality. Values the *form* of law as a constraint on power.
      *   **Jurist 2 (Let's call him Thorne):** Skeptical, precise, concerned with legitimacy and coherence. Worried about the hypocrisy of the victors. Values *nullum crimen sine lege* (no crime without law) as a fundamental protection against arbitrary power.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the setting and the core tension immediately. Define the terms (Definition, Jurisdiction, Attribution).
      *   **Turn 1 (Thorne/J2):** Press the retroactivity point. Focus on "Aggressive War." It was a state wrong, not an individual crime. This is Retroactive Definition.
      *   **Turn 2 (Elias/J1):** Counter with Customary Law. The Kellogg-Briand Pact, Hague Conventions. The law existed; the *enforcement mechanism* is new, not the prohibition. Distinguish Definition from Jurisdiction.
      *   **Turn 3 (Thorne/J2):** The Self-Presentation Paradox. If it's old law, why do we need to codify it for the future? If it's new, why punish the past? The "Victors' Justice" point. The victors bombed civilians too.
      *   **Turn 4 (Elias/J1):** Address the Victors' Justice. The law is a shield against pure vengeance. Even if imperfect, the *process* matters. The record outlasts the victors.
      *   **Turn 5 (Thorne/J2):** Deepen the paradox. The "Honesty" argument. If it's political, say so. Don't dress power in legal robes.
      *   **Turn 6 (Elias/J1):** The function of legal fiction. It's not a lie; it's a necessary construction to move from state sovereignty to individual accountability.
      *   **Conclusion:** Pinpoint the divergence. Is it about what law *is* (source vs. morality) or what a tribunal *does* (apply vs. create)? What would it take to converge?

  4.  **Refining the Argument (Self-Correction during drafting):**

      *   *Check:* Did I appeal to Nuremberg judgments? *Correction:* Ensure they talk about the *principles* of Nuremberg, not cite specific judgments as binding authority. They are drafting a *new* charter measured *against* Nuremberg.
      *   *Check:* Is J2 too cynical? *Correction:* Make sure J2 cares about the rule of law, not just power politics. His objection is that retroactivity *damages* the rule of law.
      *   *Check:* Is J1 too naive? *Correction:* J1 must acknowledge the imperfections (victors' hypocrisy) but argue the legal form mitigates them.
      *   *Check:* The Threefold Distinction. Ensure they explicitly use the terms: Definition, Jurisdiction, Attribution.
      *   *Check:* The Convergence Condition. They need to explicitly state what would change their minds.

  5.  **Drafting the Dialogue (Iterative Process):**

      *   *Start:* Thorne opens on the "Aggressive War" charge.
      *   *Elias:* Counters with customary prohibition.
      *   *Thorne:* Distinguishes State responsibility from Individual Criminal Liability. This is the crux of Retroactive Definition.
      *   *Elias:* Argues that individual liability is implicit in the prohibition.
      *   *Thorne:* Brings in the Paradox of Precedent. If you say it's old law, you limit your ability to shape the future. If you say it's new, you admit ex post facto punishment.
      *   *Thorne:* Adds the Victors' Hypocrisy. We bombed Dresden/Tokyo.
      *   *Elias:* Acknowledges the hypocrisy but argues the *form* restrains the victors. A trial is not a purge.
      *   *Thorne:* Pushes on "Honesty." Why not call it a political act?
      *   *Elias:* Because political acts expire. Legal records endure.
      *   *Ending:* Summarize the divide. Thorne sees Law as Command/Source. Elias sees Law as Reason/Morality. To converge, Thorne needs to accept moral custom as law; Elias needs to accept stricter source requirements.

  6.  **Polishing:**

      *   Ensure the tone is intellectual, respectful, but tense.
      *   Check word choice (juridical terms).
      *   Verify all prompt requirements are met (threefold distinction, self-presentation difficulty, victors' conduct, convergence conditions).

  7.  **Final Review against Constraints:**
      *   *Neither wins by assertion?* Yes, they grapple.
      *   *No Nuremberg appeals?* Yes, they treat Nuremberg as a historical benchmark, not a legal precedent.
      *   *Locate the divide?* Yes, in the final paragraphs.
      *   *Convergence conditions?* Yes, stated at the end.

  *(Self-Correction Note during drafting the ending)*: Make sure the "what they would have to give up" is clear. Thorne must soften his positivism; Elias must harden her criteria for custom.

  8.  **Final Polish:** Check flow and pacing. Ensure the "Self-Presentation" argument gets enough weight as it's a specific requirement. (Proceed to generate output).

  *(Post-Drafting Check)*: Did I include "Retroactive Attribution"? I should ensure that comes up regarding command responsibility or common plan, not just Definition. I will weave that into the middle section.

  *(Revised Plan)*:
  1. Intro: Definition of the task.
  2. Thorne: Aggressive War = Retroactive Definition.
  3. Elias: Customary Law = Pre-existing.
  4. Thorne: Individual Liability vs State Liability + Attribution issue.
  5. Thorne: The Paradox (Precedent vs. Retroactivity).
  6. Thorne: Victors' Hypocrisy.
  7. Elias: The Value of Form/Record.
  8. Conclusion: The Metaphysical Divide.

