answer: |-
  **The Commission Room, 1948**

  **Thorne:** We are drafting a charter for a tribunal that will sit in judgment on the architects of a war that has left half the continent in rubble. We agree that the shadow of Nuremberg falls across this table. But we must decide whether we are building a court or a monument. My objection remains specific: Charge One, Crimes Against Peace. You assert that planning and waging aggressive war was already unlawful when the defendants ordered their armies across the border. I assert it was not. This is not a quibble over evidence; it is a question of Retroactive Definition. We are declaring conduct criminal that was, at the time, merely the exercise of state sovereignty.

  **Elias:** It was not merely sovereignty, Thorne. It was a violation of the Kellogg-Briand Pact and the Hague Conventions. The prohibition existed. The web of treaties and customary practice had rendered aggressive war illegal *before* the first tank rolled. The tribunal is not creating a new prohibition; it is enforcing an old one that lacked a mechanism for individual enforcement.

  **Thorne:** There is the rub. A prohibition on *states* is not a crime for *individuals*. International law, as it stood, dealt in reparations and territory, not prison cells and hanging ropes. To take a breach of treaty by a state and transmute it into a capital offense for the ministers who signed the orders is to change the nature of the liability. That is not merely Retroactive Jurisdiction—moving a trial from a domestic court to this international bench. It is Retroactive Definition. You are punishing a man for an act that carried no personal penal consequence when he performed it.

  **Elias:** You are drawing a line where none exists in moral reality. If an act is forbidden, and the prohibition is known, the individual who orchestrates the violation bears responsibility. The lack of a prior international prison does not negate the criminality of the act. Murder was illegal long before there were police forces to enforce it uniformly. The law was there; the machinery was what Nuremberg supplied, and what we are refining. To say otherwise is to suggest that sovereignty is a license to kill, provided no one has built a cage for you yet.

  **Thorne:** But sovereignty *was* that license, legally speaking. That is the positivist reality. And if we ignore it, we invite the charge of hypocrisy. Consider the second prong of our shared distinction: Retroactive Attribution. We are proposing modes of liability—conspiracy, command responsibility—that were not codified for international crimes at the time. If we apply these to past conduct, we are legislating backward. And this leads to the difficulty of self-presentation that keeps me from signing this draft.

  **Elias:** Explain the difficulty.

  **Thorne:** The tribunal must speak to two audiences. First, the defeated, who will inevitably call this the vengeance of the strong. Second, the future, for whom this charter must stand as a precedent to bind *their* wars. Here is the paradox: If we present this tribunal as merely declaring pre-existing law, we strengthen our legitimacy against the charge of vengeance, but we weaken our claim to bind the future. We imply that the law was already complete, and we are merely clerks. But if the law was complete, why do we need to codify it anew in this charter? Why not simply point to the Hague Conventions and rest?

  **Elias:** Because the Hague Conventions were vague on enforcement. We are clarifying the procedure, not the substance.

  **Thorne:** But if we present ourselves as laying down new law for the future—to ensure that next time, the prohibition is clear—we concede that the law *did not exist* for these defendants. We admit we are applying legislation backward. The more we claim to be a precedent-setter for the future, the more we admit to being retroactive legislators for the past. We cannot be both the discoverers of ancient law and the architects of new order without appearing to be one or the other dishonestly.

  **Elias:** It is not dishonesty; it is the nature of legal evolution. The common law has always moved this way. A court recognizes a principle implicit in the tradition and applies it to a new context. We are not inventing the prohibition on aggression; we are recognizing its logical consequence: that individuals must answer for it. The "newness" is the forum, not the norm.

  **Thorne:** And yet, the bench, the charter, and the choice of charges are the victors' own work. We are the prosecutors, the legislators, and the judges. And I must raise the objection that hangs over this room like smoke: the victors have themselves done things resembling what we now charge. Area bombing of civilian centers. The destruction of cities that held no military value. If we charge the defeated with atrocities against civilians while our own air forces rain fire on theirs, we are not applying a universal custom. We are selecting which violations to punish based on who lost. A frankly political reckoning would at least be honest about what it is. It would say: "You lost, and we are imposing terms." To dress this in legal robes when the selectivity is so apparent damages the law itself.

  **Elias:** I will not evade that. It is true that the victors are not innocent. It is true that the charter is our work. But if we treat this as a political reckoning, as you suggest, we reduce it to power. A political act expires when the power fades. A legal act creates a record that outlasts the victors. If we say, "This is vengeance," then when the political wind shifts, the verdict shifts. If we say, "This is Law," then the record stands even if our own conduct is later scrutinized.

  **Thorne:** But is it law if it is applied selectively?

  **Elias:** It is law if the *form* constrains us. The legal form is what keeps this reckoning from becoming an execution. By requiring evidence, by allowing defense counsel, by forcing us to articulate general principles rather than specific grievances, we bind ourselves. We may have bombed their cities, but we do not execute their leaders without a trial. That distinction matters. It matters to the defeated, who see a process rather than a purge. And it matters to the future, because it establishes that even the victors must speak the language of justice, even if their accent is imperfect.

  **Thorne:** You argue that the form restrains the power. I argue that the form legitimizes the power. If we proceed on the fiction that this law existed fully formed, we deny the reality that we are making a moral choice to punish *this* war and *these* men. If we admitted we are legislating retroactively for a salutary purpose, we could at least argue necessity. Instead, we claim necessity and deny it simultaneously. We claim we are bound by the law, yet we write the law as we go.

  **Elias:** We are bound by the *concept* of the law. The content is being clarified, yes. But if we admit we are legislating retroactively, we undermine the very principle of *nullum crimen sine lege* that we claim to uphold. We cannot build a future rule of law on an admitted exception for the present.

  **Thorne:** Then we are trapped. To secure the future, we must lie about the past. Or, to be honest about the past, we must weaken the claim that this binds the future. Let us locate our divide precisely, Elias. Is it that you believe the customary law of 1939 actually contained individual criminal liability for aggression, and I simply deny the evidence? Or is it something deeper?

  **Elias:** I think it is deeper. I believe that law is not merely the command of a sovereign or the text of a treaty. It is the rational structure of obligation between nations. If an act is morally heinous and universally condemned by state practice, it is criminal, even if the penalty was not specified. You require a specific sanction attached to a specific text before you acknowledge a crime. I require a violation of a fundamental norm.

  **Thorne:** Then our divergence is about the concept of law. I am a positivist; I see law as a social fact, traceable to a source. If the source did not specify individual punishment, there is no crime. You are closer to a natural lawyer; you see law as a moral truth waiting to be recognized. For us to converge, I would have to give up the strict requirement that criminal liability must be explicitly codified in a treaty or custom prior to the act. I would have to accept that moral necessity can generate legal liability ex post facto.

  **Elias:** And I?

  **Thorne:** You would have to give up the claim that this is purely declaratory. You would have to concede that this tribunal is, in part, constitutive—that it is making law, not just finding it. You would have to acknowledge that we are asking the defendants to bear the burden of a legal evolution that was incomplete when they acted.

  **Elias:** I can concede that the *mechanism* is constitutive. I can admit that the international criminal court is a new invention. But I cannot concede that the *wrong* is new. If I admit the wrong is new, then we are indeed punishing them for our convenience. I must maintain that the criminality inhered in the act itself, regardless of the tribunal's existence.

  **Thorne:** Then we are at an impasse regarding the content of customary law. But there is a third possibility. Perhaps the divide is about what a tribunal may permissibly do. I argue that a tribunal's legitimacy rests on its fidelity to the law as it *was*. You argue that a tribunal's legitimacy rests on its service to justice as it *ought to be*.

  **Elias:** That is a fair summation. You fear that if we bend the rule against retroactivity, we open the door for future victors to punish the defeated for whatever they invent. I fear that if we insist on strict positivism, we leave the greatest crimes unpunished because the tyrants were clever enough not to write their crimes into their own statutes.

  **Thorne:** Precisely. So, what must we give up to sign this charter together? If I am to join you, I must be satisfied that the retroactivity is limited strictly to the most egregious violations of fundamental norms—aggression and atrocities against civilians—and that we do not expand this precedent to lesser offenses. I need a guarantee that this "moral source" of law does not become a blank check for future tribunals.

  **Elias:** And if I am to join you, I must accept that the charter itself is a legislative act. I must agree that we are not merely "finding" the law, but crystallizing it. I must accept your warning about self-presentation. We cannot claim this is business as usual. We must acknowledge in the preamble that this tribunal represents a step forward in the enforcement of international law, implying that the enforcement mechanism is new, even if the prohibitions are old.

  **Thorne:** If you acknowledge the enforcement mechanism is new, you admit that the defendants are being subjected to a risk they did not face before.

  **Elias:** They faced the risk of summary execution. They face the risk of infamy. The law gives them a shield, however imperfect. I am willing to state that the *jurisdiction* is retroactive, provided we hold firm that the *crimes* are not.

  **Thorne:** And I am willing to accept that the crimes are customary, provided we admit that the *individual liability* attached to them is a development of this charter, not a pre-existing fact. We call it Retroactive Jurisdiction and Attribution, but we deny Retroactive Definition.

  **Elias:** That is a narrow bridge. But it might hold. You get your honesty about the novelty of the tribunal's power. I get my continuity of the moral prohibition.

  **Thorne:** It leaves the victors' hypocrisy unresolved.

  **Elias:** The law cannot cure hypocrisy. It can only refuse to emulate it. If we try the defendants by rules we intend to follow ourselves, we have done what law can do. The rest is history.

  **Thorne:** Then let us draft the preamble. We will state that the tribunal applies existing international law, but we will acknowledge that the codification of individual responsibility is a necessary evolution of that law. We will not claim the past was identical to the present, but that the present fulfills the promise of the past.

  **Elias:** And we will record the proceedings fully. So that when the victors are one day the defeated, the record remains to judge them too.

  **Thorne:** That is the only concession that matters. The record must outlast us.

  **Elias:** Agreed.
