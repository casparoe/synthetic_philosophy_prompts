answer: |-
  1.  **The Self-Repairing Schema**
      You argue that the Two-Envelope Paradox is not a single argument but a "schema" that is self-repairing: if you block the version where you open the envelope, a version where you don't open it appears; if you block that, a version with a switching fee appears. Before we get to your solution, I want to pin down the problem. If the paradox is a schema rather than a specific fallacy, does that mean you believe there is no single logical error that all versions share, but rather a family resemblance of errors?

      *Follow-up:* If she says there is no single logical error: "Then what justifies grouping these distinct arguments together under one title? Is it simply that they all recommend switching, or is there a structural feature common to the *setup* that you think your diagnostic will capture?"

  2.  **Defining the Stability Test**
      Your proposed diagnostic is that an expected-value argument is sound only if its recommendation is "stable under re-description of the act." To make sure the audience follows the rest of this conversation, can you give us a concrete definition of what it means to "re-describe" an act in this context? Are we talking about breaking the act down into smaller temporal steps, or describing the same physical movement in different conceptual terms?

      *Follow-up:* If she says it involves breaking the act into finer partitions (e.g., "Switch if amount is $X$"): "So, if I calculate the value of 'Switching' generally, I must also check the value of 'Switching if the envelope contains $X$' for every possible $X$? And if those local calculations disagree with the general one, the general one is void?"

  3.  **Motivating the Test Independently**
      I need to press you on why we should accept this stability requirement. You use it to rule out the switching argument, but can you motivate the test independently of the cases you want to save? Can you name a case, outside of the envelope literature, where a recommendation is unstable under re-description yet plainly correct? Or, if there is no such case, what fundamental norm of rationality is this test tracking if not the avoidance of known errors?

      *Follow-up:* If she says it tracks "coherence" or "avoiding framing effects": "Standard decision theory assumes that rational agents are immune to framing effects. If your test is required to ensure that, are you implying that standard expected utility theory is already insufficient to guarantee frame-invariance without your added constraint?"

  4.  **Conglomerability and Reflection**
      Philosophers of probability often discuss the principle of conglomerability—the idea that your unconditional probability for an event should lie within the range of your conditional probabilities for that event over a partition. Does your stability test do any work beyond the standard demand that probabilities be conglomerable over a partition, or beyond a reflection principle? Is this a new constraint, or just a repackaging of an old one?

      *Follow-up:* If she says it is a new constraint: "Where does the old machinery break? Is there a specific mathematical example where conglomerability holds, but your stability test fails, and we are forced to reject the expected value calculation?"

  5.  **Act vs. Policy**
      Your test is stated over *acts*, but the most persuasive form of the switching argument is a *policy*: "Always switch, whatever you find." There is a difference between evaluating a single decision in isolation and evaluating a rule for decision-making. If I adopt the policy "Always Switch," that policy seems stable under re-description. Why is your diagnostic focused on the individual act rather than the policy?

      *Follow-up:* If she says policies reduce to acts: "But if the policy is stable, and the act is unstable, aren't you telling the agent that she is rational to commit to a rule that she is irrational to execute in the moment? How do you reconcile that tension?"

  6.  **The Known Amounts Case**
      Let's apply this to a control case. Suppose I know the two envelopes contain ten and twenty dollars, and I open mine to find ten. Here, the conditional expected value of switching is clearly positive, and switching is manifestly right. What does your test say there? Does the recommendation remain stable under re-description in this case, and if so, what is the relevant difference between this scenario and the paradoxical one where the amounts are unknown?

      *Follow-up:* If she says the test passes here because the partition is finite/known: "So the paradox arises specifically when the partition is unknown or infinite? Does that mean the error is epistemic—about what we know about the distribution—rather than decision-theoretic?"

  7.  **Dissolution vs. Resolution**
      Some critics might say your diagnostic dissolves the paradox rather than resolving it. If the conditional expected value of switching favors switching, but your test declares the argument unsound due to instability, are you leaving the agent with no reason to switch even where the math favors it? Are you advising agents to ignore positive expected value calculations in these specific contexts?

      *Follow-up:* If she says "Yes, ignore them": "Doesn't that violate the principle of Dominance? If switching yields more money in every possible state of the world, how can it be irrational to switch, regardless of how we describe the act?"

  8.  **Pascal's Wager and St. Petersburg**
      You extend this diagnostic to Pascal's Wager, which fails the test, but you say the St. Petersburg game passes it, implying infinite expectation is not the culprit. Since the engine of Pascal's Wager appears to be infinite utility rather than the description of the act, what exactly is the diagnostic catching there? How does re-describing the act of "believing in God" render the expected value unstable?

      *Follow-up:* If she says belief can be refined (e.g., "Believe only if cost is low"): "But in St. Petersburg, the payoffs are also infinite. Why does the refinement of acts stabilize the St. Petersburg calculation but destabilize Pascal's? Is there a structural difference in how the infinity enters the equation?"

  9.  **The Price to Decision Theory**
      This is a question about the price of your general claim. If expected value is not invariant under re-description of the act, that is a thesis about decision theory at large rather than just about envelopes. What breaks elsewhere in standard theory if we accept this? How do you confine the damage so that we don't lose the ability to make routine economic decisions?

      *Follow-up:* If she says "Only pathological cases break": "Who decides what is pathological? If the stability test is the arbiter, aren't we risking a circularity where we define rational acts as those that pass the test, and the test as that which rational acts pass?"

  10. **Lesson for Self-Locating Probability**
      Finally, you mention the Doomsday Argument fails your test in a different way. For the listeners interested in self-locating probability, what is the constructive lesson here? If the Doomsday Argument fails the stability test, does that mean we should reject self-locating evidence entirely, or simply that we must restrict how we formulate hypotheses about our own existence?

      *Follow-up:* If she says we must restrict hypothesis formulation: "Can you give a rule of thumb for when a self-locating hypothesis is 'stable' enough to be used in a Bayesian update, so that we don't have to run a full stability diagnostic on every belief?"
