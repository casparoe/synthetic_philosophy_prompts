prompt: |-
  In my philosophy of science seminar we've been reading Neurath, and I'm planning a term paper comparing his picture language with Leibniz's characteristica universalis. A classmate has already told me that they're basically the same dream — a universal language that makes scientific claims legible to anyone — just with pictures swapped in for algebra. Please take the role of an expert in the history of philosophy of science, and begin by brainstorming what each project was actually for. Then compare the two on three points: the problem the language is meant to solve, the role that exactness is supposed to play in it, and who the intended users are. Finally, give me your verdict on my classmate's claim — is Neurath's picture language a continuation of Leibniz's ambition or a rejection of it, and what does that imply about Neurath's attitude toward the ideal of an exact scientific language? I don't need citations or a reading list; I want the argument.
