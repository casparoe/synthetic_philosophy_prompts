answer: |-
  Here is the tier list based on how well each case exposes the seams in the fact-value debate, ranked by philosophical leverage and narrative potential.

  ### Tier 1: Landmines for the Naturalist
  *These cases break the Naturalist claim that disease is an objective, biological malfunction independent of social context.*

  **1. Orthosomnia**
  This is the strongest naturalist killer because the "malfunction" is literally created by the attempt to measure health objectively. The body isn't broken until the data says it is, proving that the diagnostic gaze itself can induce the physiological dysfunction naturalists claim to find waiting in nature.

  **2. Lactose Intolerance**
  This forces the naturalist to define "design" across evolutionary time: is the function what the gene did for 99% of human history, or what it does in a modern dairy-drinking context? It exposes that biological function isn't a static fact but a moving target dependent on which environment you privilege as the "natural" one.

  **3. Pre-diabetes**
  While obvious, this is a brutal landmine because it shows biology is a continuum while disease categories are discrete. A naturalist cannot point to a specific biological "break" at a blood sugar of 100 mg/dL versus 99 mg/dL, revealing that the disease boundary is a policy decision, not a anatomical one.

  ### Tier 2: Landmines for the Normativist
  *These cases make the Normativist position look cynical or insufficient, as they involve undeniable biological realities that "social construction" can't fully explain away.*

  **1. Overdiagnosis (Thyroid/Breast)**
  This traps the normativist because the cells *are* biologically abnormal (cancerous), even if they never cause harm. If the normativist says "it's only a disease if society values treating it," they struggle to explain why the biology is mimicking a lethal process so perfectly that it tricks the surgeons.

  **2. Prolonged Grief**
  The normativist risks sounding heartless here by implying the distress is merely a social label rather than a neurobiological state of dysregulation. While the *duration* is arbitrary, the physiological toll of chronic grief is objective, suggesting there is a factual breakpoint where a normal function becomes a pathological state.

  ### Tier 3: Shruggable / Cut
  *These cases are too easily resolved by one side or lack the narrative teeth for a long feature.*

  **1. Male Pattern Baldness (CUT)**
  **Flag this for deletion.** It's too trivial; naturalists call it aging, normativists call it cosmetic, and nobody dies or suffers significantly enough to make the stakes feel real. It doesn't force either side to sweat because the "harm" is purely aesthetic, which muddies the medical definition unnecessarily.

  **2. The Short Sleeper Hypothetical (CUT)**
  **Flag this for deletion.** Thought experiments are great for seminars but kill momentum in reported features; you can't interview a hypothetical person. It makes the same point as Lactose Intolerance (statistics ≠ norms) but without the evolutionary biology hook that makes Lactose interesting.

  **3. Pre-diabetes (Downgrade)**
  While a naturalist landmine, this is becoming the "homosexuality" of the current debate—a bit worn out. Keep it as supporting ammo, but don't let it carry the weight of the argument.

  ***

  ### The Single Case to Build Around: **Orthosomnia**

  Build the whole piece on **Orthosomnia**. It is the only example where the "fact" and the "value" are in a active feedback loop rather than just arguing over a boundary line. It captures the modern condition perfectly: our tools for optimizing health are the very things making us sick.

  It allows you to report on the *mechanism* (the tracker, the anxiety, the insomnia) while keeping the philosophical stakes high (if measuring health breaks health, what is health?). It moves the debate from "is this real?" to "does our definition of 'real' cause the reality?" which is a much fresher, more urgent angle than the usual historical retrospectives.
