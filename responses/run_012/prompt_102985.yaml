      *   *Sink:* Hindsight/Time-lag (makes it useless for practice).
      *   *Awkward:* Defining novelty/core (philosophical fuzziness).
      *   *Meta:* Is MSRP itself scientific? (Irony).

      *Wait, one nuance:* Lakatos *wanted* it to be normative. So if it fails as descriptive, does it "sink"? Only if the user claims it's descriptive. I need to clarify that distinction. The "sink" applies if you claim it describes scientific behavior. It survives as a normative ideal, *unless* the normative ideal is too vague to guide action (which brings us back to Hindsight).

