answer: |-
  **Exam Question**

  **Question 4 (20 marks)**

  Consider the following case:
  *Alpine beetle larvae cluster in groups of about a dozen in the shade of leaves. A group of twelve is exactly the size that minimises risk from a parasitic wasp that hunts them—smaller groups lose the dilution effect, bigger ones get noticed. However, the clustering is a by-product of a humidity-seeking reflex: the larvae pile up wherever the air is damp, and damp patches happen to be the right size for a dozen. The wasp only reached this valley three beetle generations ago, so nothing has been selected for wasp-avoidance, and nothing in the beetle represents wasps, risk, or group size.*

  Dennett suggests that free-floating rationales can exist without a representing vehicle. Using this case, address the following fork: Is the "free-floatingness" of a rationale a claim about **current optimality** (a strategy evaluable as better or worse regardless of history), or is it a claim about **selection history** (a rationale must be built by selection before it can float free)?

  Choose one reading. Defend it against the other. Explain what work the word *rationale* is doing in your answer that a plain functional description would not. Finally, address the indeterminacy problem: on your reading, why is the wasp-avoidance description privileged over the humidity-seeking description (or vice versa)?

  ***

  **Model Answer**

  The central tension here is whether a rationale requires a designer, even if that designer is blind natural selection. If we take the "current optimality" reading, the larvae possess a free-floating rationale immediately: their behaviour solves a problem (wasp avoidance) efficiently, regardless of how they got there. The rationale is a fact about the present fit between organism and environment. On the "selection history" reading, however, a rationale is essentially historical. Without a past process of selection filtering for this specific outcome, there is no function, only accident.

  I defend the selection history reading. To call something a *rationale* implies a normative standard—it makes sense to say the organism *ought* to do this because it serves a specific end. In the optimality reading, "rationale" collapses into "useful effect." If the larvae cluster due to humidity, the humidity-seeking is the cause; the wasp-avoidance is merely a lucky side-effect. Calling the side-effect a "rationale" grants it a teleological status it hasn't earned. The word *rationale* does the work of distinguishing functions from mere beneficial consequences. It marks the difference between a trait being *for* something versus merely resulting in something good. Without selection history, we cannot say the clustering is *for* wasp avoidance; we can only say it *helps* with wasp avoidance.

  This historical view solves the indeterminacy problem cleanly. The optimality reading struggles to explain why "wasp avoidance" is the rationale rather than "humidity maximisation." Both are optimal descriptions of the current state. If rationales are just current optima, the beetle has two contradictory rationales simultaneously. The selection reading cuts this knot: currently, there is *no* wasp-avoidance rationale because there is no history of selection for it. The only existing functional explanation is the humidity reflex. The wasp-avoidance description is not a rival rationale; it is a prediction of future function should selection occur. Privileging the wasp description now is a category error, conflating current utility with proper function.

  However, this verdict relies heavily on the timeline. If the wasp had been in the valley for ten thousand generations, and clustering had been shaped by it, the wasp-avoidance description would become the true rationale, even if the mechanism remained a humidity reflex (provided the reflex was tuned by that history). Similarly, if the reflex were sensitive to wasp scent, we might attribute a representational content that anchors the rationale without long history.

  I am least confident in the implication that current survival value is philosophically inert. If the larvae survive solely due to this "accident," denying them a rationale feels like withholding credit for success. Yet, if we grant rationales too easily, we lose the ability to criticise adaptationist stories. I accept the historical constraint because it preserves the distinction between design and luck, even if it makes "rationale" a backward-looking term that ignores the immediate reality of survival.

  ***

  **Marking Scheme**

  **Total: 20 Marks (5 Criteria × 4 Marks)**

  1.  **Identification of the Fork:** Clearly distinguishes between the "current optimality" reading (rationale as present fit) and the "selection history" reading (rationale as product of past filtering).
      *   *Common Miss:* Treating the fork as Representation vs. No Representation, ignoring the selection history element.
  2.  **Consistent Verdict:** Commits to one reading and applies it consistently to the beetle case without wavering or contradicting earlier claims.
      *   *Common Miss:* Arguing for history but then granting the beetle a rationale based on current survival benefits.
  3.  **Work of 'Rationale':** Explains how *rationale* differs from *functional description* (e.g., normative force, distinguishing function from lucky side-effect).
      *   *Common Miss:* Defining 'rationale' but failing to explain why a plain description of the behaviour is insufficient.
  4.  **Indeterminacy Resolution:** Addresses why wasp-avoidance is or isn't privileged over humidity-seeking on their chosen view (must handle the "two optima" problem).
      *   *Common Miss:* Ignoring the humidity alternative or asserting wasp-avoidance is primary without justification.
  5.  **Counterfactual & Limitation:** Includes the required passage on how the verdict changes if history/mechanism changes, and admits a specific uncertainty or cost of their view.
      *   *Common Miss:* Describing the counterfactual without admitting uncertainty, or offering a generic "both sides have merit" shrug.

  **Differentiation Guide (17–20 vs. 13–16)**

  *   **13–16 (Solid):** Hits all five criteria but may treat the indeterminacy point as a separate add-on rather than integrating it into the main argument. The admission of uncertainty may be formulaic (e.g., "One weakness is..."). The distinction between *function* and *useful effect* is present but standard.
  *   **17–20 (Excellent):** Integrates the indeterminacy point into the core definition of *rationale* (e.g., showing that without history, indeterminacy proves there is no rationale). The admission of uncertainty is substantive, acknowledging a philosophical cost (e.g., making 'rationale' backward-looking) rather than just a factual gap. The voice is authoritative yet reflective, showing control over the implications of the chosen view.
