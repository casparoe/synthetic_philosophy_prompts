answer: |-
  Alright, pull up a chair. This is a classic rite of passage in bargaining theory. Your reading group friend has the logic right, but the philosophy wrong. He's committing the "No True Scotsman" fallacy with the word "fair."

  Let's do exactly what you asked: I'll walk through the brainstorming process of which axiom to sacrifice, then I'll give you the verdict, the intuition, and the napkin sketch.

  ### Phase 1: Brainstorming the Sacrifices

  We have five axioms. To find a solution, we must break at least one. Let's weigh the cost of dropping each.

  **1. Pareto Optimality (PO)**
  *   *What it says:* Don't leave money on the table.
  *   *Cost of dropping:* Massive. If a solution picks an interior point, both players could move to the boundary and be better off. A "fair" solution that is strictly dominated by another feasible agreement is hard to defend.
  *   *Verdict:* **Keep.** This is the definition of rational cooperation.

  **2. Symmetry (SYM)**
  *   *What it says:* If the players are identical in every relevant way (feasible set and disagreement point are symmetric), they get equal payoffs.
  *   *Cost of dropping:* You allow discrimination without cause. If the problem is symmetric and the solution gives Player 1 more than Player 2, you've introduced bias ex nihilo.
  *   *Verdict:* **Keep.** Unless you want to model specific power asymmetries (which should be in the set $S$ or point $d$, not the solution rule).

  **3. Scale Invariance (INV)**
  *   *What it says:* Utility units don't matter. Changing from dollars to cents, or Fahrenheit to Celsius, shouldn't change the outcome.
  *   *Cost of dropping:* This is the gateway to interpersonal utility comparisons. If you drop this, you can argue for the *Utilitarian* solution (maximize $x_1 + x_2$) or the *Egalitarian* solution (maximize $\min(x_1, x_2)$ in absolute terms).
  *   *Verdict:* **Keep (for this context).** Standard non-cooperative bargaining assumes utilities are von Neumann-Morgenstern (cardinal but not interpersonally comparable). If you drop this, you aren't playing the Nash/KS game anymore; you're playing a welfare economics game.

  **4. Independence of Irrelevant Alternatives (IIA)**
  *   *What it says:* If you remove options from $S$ that were *not* chosen, the choice shouldn't change.
  *   *Cost of dropping:* It feels like a consistency requirement. If I chose A over B, and C is removed, I should still choose A over B.
  *   *Verdict:* **Suspicious.** In social choice (Arrow), this is standard. In bargaining? It implies that "threat potential" doesn't matter, only the local trade-off at the solution point.

  **5. Individual Monotonicity (IM)**
  *   *What it says:* If the feasible set expands in a way that specifically benefits Player 1 (his max possible payoff rises, Player 2's stays fixed), Player 1 should not get less.
  *   *Cost of dropping:* It feels like a basic right. If my opportunities improve, why should I be punished?
  *   *Verdict:* **Suspicious.** But it conflicts with IIA.

  ---

  ### Phase 2: The Verdict

  Here is the cold take: **You drop IIA (Axiom 4).**

  Your friend concludes "there is no fair solution." That's nonsense. The correct conclusion is: **"There is no solution that treats bargaining like a static choice problem (IIA) while also respecting changes in bargaining power (Monotonicity)."**

  In modern bargaining theory, **IIA is the odd man out.** Here is why.

  #### Why IIA Looks Innocent (But Isn't)
  IIA sounds like rationality. "Why should removing an option I wasn't going to pick change my mind?"
  In a consumer choice problem (picking an apple from a basket), this is true.
  But bargaining isn't just choice; it's **conflict and threat**.

  The feasible set $S$ represents the *technology of agreement*, but it also represents the *structure of threats*.
  *   If Player 1 has a "dream outcome" of 100, he bargains aggressively.
  *   If you remove that dream outcome (shrinking $S$), even if the current agreement point is still feasible, Player 1's *threat power* has diminished. He has less to lose by disagreeing because his upside is capped.
  *   IIA says: "Ignore that. The current point is still feasible, so stick with it."
  *   Monotonicity says: "Wait, Player 1's leverage just dropped. The solution should shift toward Player 2."

  IIA treats the feasible set as a menu. Monotonicity treats the feasible set as a measure of power. In bargaining, **power matters.** Therefore, IIA is the axiom that fails to capture the strategic essence of the problem.

  #### Why Monotonicity Looks Innocent (And Is)
  Individual Monotonicity is basically a "no-punishment for improvement" clause. If the pie gets bigger for me, and doesn't get bigger for you, I shouldn't end up with less slice. It's hard to argue against this normatively. If a solution violates this, it feels perverse.

  ---

  ### Phase 3: The Napkin Sketch (The Intuition)

  Here is how you explain the incompatibility of IIA and Monotonicity to your group. Draw this:

  1.  **Draw the Axes:** $x_1$ (horizontal), $x_2$ (vertical). Disagreement point $d$ at $(0,0)$.
  2.  **Draw Set $S$ (The Small Set):** Draw a symmetric curve bowing out from the origin. Let's say it hits $(10,0)$ and $(0,10)$.
      *   By Symmetry + Pareto, the solution must be on the 45-degree line. Let's call this point **$A$**.
      *   Both Nash and KS pick **$A$** here.
  3.  **Draw Set $S'$ (The Expanded Set):** Now, expand the set *only* for Player 1. Keep Player 2's max at 10, but push Player 1's max out to 20.
      *   Visually: Stretch the curve to the right. The top point $(0,10)$ stays fixed. The right point moves from $(10,0)$ to $(20,0)$.
      *   The new frontier is flatter near the top, steeper near the bottom.
  4.  **The Monotonicity Demand:**
      *   Player 1's "ideal point" moved from 10 to 20. Player 2's stayed at 10.
      *   Player 1 is relatively stronger.
      *   **Monotonicity says:** The new solution **$B$** must give Player 1 *more* than point $A$ did. $x_1(B) \ge x_1(A)$.
      *   KS does exactly this. It draws a line from $(0,0)$ to $(20,10)$. That line is flatter than the 45-degree line. It hits the frontier further to the right. Player 1 gains.
  5.  **The IIA Trap:**
      *   IIA looks at the relationship between $S$ and $S'$.
      *   Notice that the original solution **$A$** is still inside the new set $S'$.
      *   IIA says: "If you pick $A$ from $S'$, and then I shrink the menu back to $S$ (removing points that weren't $A$), you must still pick $A$."
      *   Conversely, if you pick **$B$** from $S'$, and $B$ happens to be inside $S$ (which it might not be, but imagine a specific expansion where the old frontier is preserved locally), IIA constrains you.
      *   *The Killer Argument:* The Nash solution is determined by the **tangent** to the frontier (where the rectangle area is maximized). When you stretch $S$ to $S'$, you change the curvature. Even if the old point $A$ is feasible in $S'$, the *tangent* at $A$ might no longer maximize the Nash product in the new geometry.
      *   However, if you force IIA, you are saying the choice depends only on the local ranking of options. But Monotonicity says the choice depends on the *global* shape (the ideal points).
      *   **The Conflict:** You cannot have a rule that depends *only* on the local trade-off (IIA/Nash) AND *also* responds to the global expansion of the frontier (Monotonicity/KS).

  **The Visual:**
  *   **Nash (IIA):** Looks like a camera with a macro lens. It only sees the curve right where the solution is. It doesn't care how far away the boundaries are.
  *   **KS (Monotonicity):** Looks like a wide-angle lens. It sees the disagreement point and the furthest boundaries (ideal points).
  *   **Incompatibility:** You can't focus on just the tangent *and* the ideal points simultaneously when the set changes. If the set stretches, the tangent changes differently than the ideal-point line.

  ---

  ### Phase 4: What Do You Pay?

  If you drop IIA (and adopt KS or a monotonic solution):
  *   **Gain:** You respect changes in bargaining power. If my ceiling rises, I gain.
  *   **Cost:** You become vulnerable to "phantom alternatives." A player might introduce a crazy, unachievable option (a "dream point" far away) just to shift the ideal point and the KS line, even if that option is never feasible. It makes the solution sensitive to the *shape* of the frontier, not just the local trade-offs. Some argue this allows for strategic manipulation of the feasible set description.

  If you drop Monotonicity (and keep Nash/IIA):
  *   **Gain:** You have strong consistency. If the local trade-off doesn't change, the solution doesn't change. It's robust to "irrelevant" expansions.
  *   **Cost:** You accept the "Nash Paradox." It is possible for Player 1's feasible maximum to increase, Player 2's to stay fixed, and yet Player 1's Nash payoff *decreases*.
      *   *Why?* Because the expansion might have made the frontier "more concave" in a way that favors Player 2's marginal utility.
      *   *Normative hit:* This is hard to sell as "fair." "Good news, your maximum possible payoff doubled. Bad news, your agreed settlement just went down."

  ### Summary for Your Reading Group

  Tell your friend this:

  1.  **He is logically right, philosophically wrong.** The axioms (1)-(5) are indeed incompatible. But that doesn't mean "fairness is impossible." It means "Fairness is a choice of properties."
  2.  **The real fight is IIA vs. Monotonicity.**
  3.  **The Consensus:** In bargaining theory specifically (unlike social choice), **IIA is the axiom most willing to be sacrificed.**
  4.  **The Reason:** Bargaining is about leverage. IIA ignores leverage changes caused by the shape of the frontier. Monotonicity respects them.
  5.  **The Solution:** If you want a "fair" solution that respects power dynamics, you use **Kalai-Smorodinsky** (drop IIA). If you want a "fair" solution that respects local consistency and derives from strategic threat games (Nash Demand Game), you use **Nash** (drop Monotonicity).

  Most people who care about *normative fairness* drop IIA. Most people who care about *strategic implementation* keep IIA (because Nash can be implemented in equilibrium; KS is harder to implement strategically).

  So, don't despair. There are fair solutions. You just have to decide if "fair" means "consistent" (Nash) or "responsive to opportunity" (KS). My money is on responsive. Drop IIA.
