answer: |-
  Henry Sidgwick's *The Methods of Ethics* is fundamentally a project of reconciliation: an attempt to show that the various methods of moral reasoning employed by humanity—Intuitionism, Egoism, and Utilitarianism—can be systematized into a coherent rational whole. When confronted with the contemporary proposal of "moral trade," Sidgwick would not treat it as a novel ethical category but rather as a complex application of the tension between the utilitarian criterion of right action and the psychological realities of common-sense morality. His considered view would likely be one of cautious, esoteric endorsement. He would deem the practice permissible and potentially obligatory for the enlightened utilitarian, provided it maximizes universal happiness, yet he would warn against its general propagation if it threatens the stability of the moral sentiments upon which social welfare depends.

  To determine Sidgwick's verdict on the permissibility of moral trade, we must first apply his utilitarian criterion. For Sidgwick, the ultimate standard of right conduct is the maximization of universal happiness (or sentient welfare). In the scenario described, two agents swap actions to advance their respective moral priorities. Sidgwick would immediately subject the underlying priorities to utilitarian scrutiny. He would argue that the preservation of wilderness has no intrinsic value independent of its contribution to sentient experience; thus, the agent prioritizing biodiversity holds a partially mistaken view unless that biodiversity serves human or animal happiness. However, Sidgwick was a practical philosopher who recognized that we often must work with existing moral psychology rather than waiting for universal conversion to hedonistic utilitarianism.

  If the trade results in a net increase in universal happiness—for instance, if the reduction in animal suffering outweighs the habitat destruction, or if the coordination prevents a deadlock where neither good is advanced—then the act is objectively right. Sidgwick would reject the critic's claim that such trade puts a "price on what should not be for sale." For a utilitarian, everything instrumental is for sale if the price is measured in units of universal good. To refuse a trade that yields a greater sum of happiness because it feels like a compromise of principle would be, in Sidgwick's view, a form of superstition or "moral fetishism." Therefore, regarding permissibility, Sidgwick's position is clear: if the calculus of consequences favors the trade, it is not merely permissible but required by Rational Benevolence.

  However, the question of whether a utilitarian should *encourage* such trades requires us to deploy Sidgwick's distinction between the criterion of right action and the motives from which agents should act. This is where the objection regarding "integrity" gains traction. Common-sense morality (Intuitionism) regards integrity as a virtue; it suggests that an agent should not perform acts they deem morally suspect, even for good consequences. Critics argue moral trade corrodes this integrity. Sidgwick treats common-sense morality not as an authoritative code but as data to be systematized. He acknowledges that the sentiment of integrity is socially useful; it prevents individuals from rationalizing self-serving breaches of trust.

  Sidgwick would argue that while the *act* of trading may be right, the *motive* of being a "moral trader" might not be the most useful sentiment to cultivate in the general public. If the practice of trading leads agents to view their moral commitments as fungible commodities, it might weaken the resolve required to pursue difficult moral tasks in the absence of a trading partner. If the general adoption of moral trade leads to a cynicism that undermines the stability of moral rules, then the utilitarian should discourage it publicly. Here, Sidgwick's texts underdetermine the specific empirical prediction: would widespread moral trade strengthen cooperation or erode conviction? His wider commitments, however, point toward conservatism regarding public moral instruction. He would likely argue that while the enlightened utilitarian may engage in trade, they should not necessarily advocate for it as a general moral rule for those not capable of nuanced utilitarian calculation.

  This leads directly to the question of esoteric morality. Sidgwick famously conceded that there might be truths in utilitarianism that are dangerous for the multitude to know. If the common-sense view is that "one must not do evil that good may come," and if abandoning this view causes social harm, then the utilitarian elite may be justified in keeping their utilitarian reasoning secret. Moral trade looks precisely like the sort of practice that fits within the "Government House Utilitarianism" model. Sidgwick would likely predict that moral trade should be conducted quietly among those capable of understanding the consequentialist justification, without challenging the public intuition that moral principles are not negotiable. To proclaim the legitimacy of moral trade broadly might shock the moral sense of the community, causing a loss of confidence in moral agents that would decrease overall trust and happiness. Thus, he would encourage the practice among the informed but discourage its public normalization.

  The most profound philosophical question raised by moral trade concerns the Dualism of Practical Reason. Sidgwick's great melancholy conclusion was that Rational Egoism (the rational pursuit of one's own happiness) and Rational Utilitarianism (the rational pursuit of universal happiness) are both self-evident yet often conflict, with no higher principle to reconcile them. Moral trade does not solve this dualism, as it is typically a negotiation between two conceptions of the *universal* good, not between self-interest and universal good. However, it bears on the dualism in a subtle, psychological manner.

  In a moral trade, an agent performs an act they regard as "mildly bad" or costly to secure a outcome they value highly. This structure allows the agent to align their personal moral satisfaction (a component of their own happiness) with the production of universal good. By trading, the agent ensures that their own "moral utility function" is satisfied, which contributes to their egoistic well-being, while simultaneously advancing the other party's goal, which advances the universal good (assuming both goals are components of the true universal good). In this specific sense, moral trade offers a partial, pragmatic reconciliation of the dualism. It creates a mechanism where doing one's duty (Utilitarianism) coincides with satisfying one's deepest moral desires (Egoism). Sidgwick would likely find this intriguing. It suggests that in a pluralistic world, coordination mechanisms can narrow the gap between the rational commands of self-interest and benevolence, even if the fundamental metaphysical dualism remains. It does not prove that virtue is always rewarded with happiness, but it constructs a social arrangement where the sacrifice required by virtue is minimized.

  Nevertheless, we must note where Sidgwick's position remains underdetermined. He does not provide a precise formula for calculating when the erosion of common-sense rules outweighs the immediate benefits of a utilitarian exception. Would the long-term corrosion of "integrity" outweigh the immediate relief of factory-farmed animals? Sidgwick admits that such calculations are often beyond our epistemic reach. In this gap, his commitment to the "systematization" of common-sense morality suggests he would err on the side of preserving the rule of integrity unless the utilitarian gain was overwhelming. He would likely view moral trade as a "second-best" solution for a non-ideal world where agents do not share the true utilitarian first principles. In a world of perfect utilitarians, no trade would be necessary, as all would aim at the same singular end. The need for trade arises from error and disagreement.

  In conclusion, Henry Sidgwick would regard moral trade as permissible and, in specific instances, obligatory under the utilitarian criterion, provided the net balance of sentient happiness is positive. He would dismiss the deontological worry about "selling out" as a confusion of motive with criterion. However, his sensitivity to the social function of common-sense morality would lead him to caution against the public promotion of such trades. He would likely view it as a practice for the utilitarian elite, to be conducted with discretion to avoid undermining the useful fiction of absolute moral integrity held by the masses. Finally, while moral trade does not resolve the Dualism of Practical Reason, Sidgwick would recognize it as a sophisticated social technology that mitigates the tension between self-interest and universal benevolence by allowing agents to satisfy their personal moral sentiments while contributing to the general good. It is a rational compromise in an irrational world, fitting neatly into Sidgwick's vision of a utilitarianism that is rigorous in principle but prudent in practice.
