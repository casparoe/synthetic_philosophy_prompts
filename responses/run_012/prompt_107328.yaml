answer: |-
  The book's gloss is substantially unfair and philosophically misleading, inverting Wigner's central argument while attributing to him ontological conclusions he explicitly avoided.

  Regarding the claim that physics gets more out of mathematics than it puts in, the book is accurate; this is the core of Wigner's observation, often termed the "empirical law of epistemology." He argues that mathematical formulations yield predictions far beyond the empirical data used to construct them, such as the precision of quantum electrodynamics or the prediction of antimatter.

  However, the book's explanation—that this effectiveness arises because physicists construct tailor-made tools—is a distortion Wigner would have rejected. Wigner distinguishes between mathematics created *for* physics (like Newton's calculus) and mathematics developed independently that later fits physics (like non-Euclidean geometry or group theory). He argues that if the fit were merely due to tailor-made tools, the success would be reasonable, not "unreasonable." His essay emphasizes the "passive" effectiveness of mathematics, where concepts developed with no physical intent later describe physical reality with uncanny precision. By attributing the success to human adeptness at curve-fitting, the book offers a pragmatic dissolution of the mystery that Wigner explicitly argued was insufficient to explain the depth of the phenomenon.

  The book's ontological conclusion—that the world is mathematical through and through and that mathematics is discovered—is contrary to Wigner's text. Wigner viewed mathematics as a human invention, a "science of skillful operations with concepts and rules invented just for this purpose." He did not argue that the universe *is* a mathematical structure; that position is associated with contemporary figures like Max Tegmark. Wigner's stance was one of agnostic wonder; he called the fit a "miracle" and a "gift which we neither understand nor deserve," explicitly refusing to draw a metaphysical lesson from it. He maintained that the human mind's capacity to formulate laws is a boundary condition we cannot explain, not proof of a Pythagorean universe.

  Consequently, the methodological moral—that physicists should trust beautiful equations before data—does not follow from Wigner's essay. While Wigner admired Dirac, who held such a view, Wigner's own essay is descriptive and cautionary, not prescriptive. He warns that our current success does not guarantee future success and highlights the limits of human understanding. Extracting a rule to prioritize beauty over empirical verification misreads his expression of surprise as a validation of rationalist dogmatism.

  Your suspicion regarding survivorship bias is a standard and defensible objection often raised by philosophers of science, particularly those of an empiricist or instrumentalist bent (such as Bas van Fraassen). It correctly notes that we naturally focus on phenomena amenable to mathematical treatment and discard those that are not. However, most philosophers of mathematics and physics would agree with you that this reply relocates rather than dissolves the puzzle. Survivorship bias explains why we *notice* the successes, but it does not explain the *depth* of those successes—specifically, why mathematics developed for purely aesthetic or logical reasons (with no selection pressure from physics) later turns out to be indispensable for physical theory. If the match were solely due to selection, we would expect shallow fits limited to the data range; instead, we find deep structural identities that allow for novel predictions in regimes far removed from the original context. Thus, while survivorship bias is a real factor, it fails to account for the "unreasonable" extension of mathematical concepts that lies at the heart of Wigner's worry.
