          *   Case 2 (Recent Selection): SE says yes function. Convergence of views.
      *   *Section 5: Advice for the Student.* Practical writing advice. Avoid "function" if ambiguous. Use "role," "effect," "modified." Warn against "vestigial" if it implies uselessness. Warn against "adaptation" without phylogeny.
      *   *Closing:* Encouraging remark on the intersection of field work and philosophy.

  7.  **Refining the Philosophy:**
      *   Make sure to distinguish between "Vestigial" (historical category) and "Functionless" (causal category). A vestigial trait can have a new function (exaptation).
      *   Ensure the distinction between *Selected Effect* (Millikan/Neander) and *Causal Role* (Cummins) is clear but accessible.
