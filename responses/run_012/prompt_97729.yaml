      *   *Self-Correction on Variation 2:* "Last few thousand years." If the species is new, it's an adaptation. If the species is old and this is a recent pop-level change, it's incipient adaptation. I should focus on the SE status: it becomes a Selected Effect.

  8.  **Final Polish:** Check tone. Ensure I'm reasoning *with* the entomologist, not lecturing. Use their desert insect context. (e.g., mention water conservation).

  **(Self-Correction during drafting):** I need to make sure I don't just say "it's verbal." It *is* verbal in the sense that they define 'function' differently, but it's substantive because it changes how we classify the trait evolutionarily (adaptation vs. exaptation vs. spandrel). I need to highlight that nuance.

