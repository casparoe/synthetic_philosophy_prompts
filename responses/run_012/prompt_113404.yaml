answer: |-
  ### Standards of Adequacy for Diachronic Rationality

  Any theory of rationality over time must satisfy the following requirements to be considered a viable contender. They are divided into normative constraints, structural distinctions, and formal commitments.

  #### I. Normative Constraints (The Cases)
  1.  **Immunity to Sure-Loss:** The theory must classify an agent with cyclical preferences who accepts a sequence of trades leading to a guaranteed loss as irrational, unless the loss stems from new information. It must explain *why* the cycle is forbidden.
  2.  **Authority of Commitment:** The theory must account for the rationality of an agent who pays to bind her future self and pays to be released. It must determine when such binding is a rational pre-emptive strike against weakness and when it is an irrational restriction of future liberty.
  3.  **Tolerance for Continuity:** The theory must handle the "sorites" case: an agent whose preferences shift gradually over many steps. It cannot declare every single step rational while declaring the final endpoint irrational, nor can it forbid all change to avoid the slippery slope.
  4.  **Reflective Endorsement:** The theory must distinguish between an agent who foresees her own reversal and endorses it (viewing her future self as wiser or simply different) and an agent who is surprised by it. The former must be treated differently from the latter.
  5.  **Frame Invariance:** The theory must yield the same verdict on a set of bets whether they are offered sequentially or all at once. Rationality cannot depend on the temporal granularity of the offer if the total risk profile is identical.

  #### II. Structural Distinctions (The Boundaries)
  6.  **Change vs. Inconsistency:** The theory must distinguish between a rational update of preference based on new values or information and a logical inconsistency in preference ordering. Not all change is failure.
  7.  **Foresight vs. Control:** The theory must distinguish between an agent who accurately predicts she will fail to follow a plan and an agent who actually fails. Prediction is epistemic; follow-through is volitional.
  8.  **Exploitability vs. Irrationality:** The theory must distinguish between an agent who is exploited due to structural flaws in her decision procedure and an agent who loses utility due to bad luck or costly information. Not all loss implies irrationality.
  9.  **Choice vs. Preference:** The theory must separate the evaluation of the *act* (was this choice rational given the agent's state?) from the evaluation of the *preference structure* (is the utility function generating these choices coherent?).
  10. **Synchronic vs. Diachronic:** The theory must specify which requirements apply to the agent at a single moment (e.g., transitivity now) and which apply across time (e.g., stability of plan), without reducing one to the other.

  #### III. Formal Commitments (The Math)
  11. **Pumpability Conditions:** The theory must align with formal results regarding which preference structures are vulnerable to money pumps under assumptions of full foresight versus myopia.
  12. **Descriptive Baseline:** The theory must be consistent with the empirical fact that foreseen preference reversal (specifically hyperbolic discounting) is a standard human pattern. It must either classify this pattern as rational, irrational, or arational, but it cannot ignore its ubiquity in modeling.

  ---

  ### Non-Negotiables vs. House Rules

  **Non-Negotiable:**
  *   **Logical Consistency:** No theory can endorse contradictory verdicts on identical cases.
  *   **Immunity to Sure-Loss (with information caveat):** An agent who loses value in a closed loop without new information must be flagged as defective in some respect (either in preference or choice).
  *   **Synchronic/Diachronic Distinction:** A theory that collapses time into a single moment fails the assignment.

  **House Rules (Contestable):**
  *   **Sovereignty of the Current Slice:** Is the current self the sole authority on what is good now? (Resolute choice says no; Myopic says yes).
  *   **Rationality of Preference Change:** Is changing one's mind a failure of coherence or an exercise of autonomy?
  *   **The Status of Binding:** Is self-binding a tool of rationality or evidence of a divided self that rationality should heal rather than bind?

  ---

  ### The Hard Conflicts (Joint Unsatisfiability)

  You cannot satisfy all demands simultaneously. The following tensions are structural, not solvable by tweaking parameters.

  1.  **Synchronic Sovereignty vs. Diachronic Coherence:**
      *   *The Conflict:* If you require that every choice maximizes the preference of the *current* time-slice (Synchronic Sovereignty), you cannot guarantee adherence to a prior plan when preferences shift (Diachronic Coherence).
      *   *The Cost:* To save Coherence (Resolute Choice), you must violate Sovereignty (the agent chooses against her current strongest desire). To save Sovereignty (Sophisticated Choice), you must accept Coherence failures (the agent abandons the optimal plan).

  2.  **Neutrality Among Time-Slices vs. Vindication of Commitment:**
      *   *The Conflict:* If the theory treats the agent at $t_1$ and $t_2$ as equally authoritative (Neutrality), there is no normative ground for $t_1$ to bind $t_2$. $t_2$'s preference at the moment of choice outweighs $t_1$'s prior preference.
      *   *The Cost:* To vindicate Commitment, the theory must privilege one time-slice (usually the planner) over the other (the doer), violating Neutrality.

  3.  **Action-Guidingness vs. Descriptive Adequacy:**
      *   *The Conflict:* If the theory prescribes rules that forbid hyperbolic discounting (Action-Guidingness), it conflicts with the descriptive model that treats such discounting as ordinary human psychology (Descriptive Adequacy).
      *   *The Cost:* A theory that matches human behavior risks licensing exploitation (Money Pumps). A theory that forbids exploitation risks being impossible for humans to follow without external aids.

  ---

  ### Scorecard of Contenders

  | Theory | Diachronic Coherence | Synchronic Sovereignty | Exploitation Immunity | Cost Paid |
  | :--- | :--- | :--- | :--- | :--- |
  | **Resolute Choice** | **Pass** | Fail | **Pass** | Violates current preference maximization. |
  | **Sophisticated** | Fail | **Pass** | **Pass** (via avoidance) | Accepts sub-optimal outcomes; abandons plans. |
  | **Myopic** | Fail | **Pass** | Fail | Vulnerable to money pumps; no planning. |
  | **Preference Change as Arational** | N/A | **Pass** | Fail | Abandons normative jurisdiction over change. |

  ### The Single Eliminator

  **Immunity to Sure-Loss Exploitation.**

  This requirement eliminates the most candidates because it forces a theory to take a hard stance on dynamic inconsistency. Myopic models fail it outright. Models that treat preference change as outside rationality's jurisdiction fail it by default (allowing the cycle). Sophisticated models only pass it by retreating from the choice entirely, which many argue is a failure of agency rather than a success of rationality. Only theories that allow for some form of commitment (violating pure synchronic sovereignty) can satisfy this requirement robustly.
