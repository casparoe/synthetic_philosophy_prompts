      *   **Topic:** Moral status of computations (specifically, when a computation counts for moral status).
      *   **Core Thesis:** The question isn't "which computations matter?" but "when is a computation attributable to a system?" The key criterion is the *counterfactual profile* of the system (physical dynamics must explain the mapping, not just the mapping existing).
      *   **Key Cases:**
          *   *Glacier:* Mapped to pain, but mapping is imposed/arbitrary. Fails the criterion.
          *   *Cathedral Machine:* Giant, slow mechanical system engineered to match pain pathway topology and counterfactual sensitivity. Passes the criterion. Implies it feels pain.
      *   **Specific Concerns/Questions:**
          *   Is the counterfactual criterion distinct from standard functionalism, or is it just functionalism in disguise?
          *   Is the glacier case redundant compared to the cathedral case?
          *   Are there obvious objections (especially regarding observer-relativity/attribution)?
          *   Is the "absurdity" of the cathedral machine feeling pain a result of bias or a flaw in the theory?
