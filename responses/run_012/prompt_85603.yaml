answer: |-
  This is a strong, clear draft with a defensible core intuition. You are effectively arguing for a **Causal/Counterfactual Functionalism** to solve the **Triviality Argument** (Putnam/Searle), and then biting the bullet on the **Substrate Independence** of moral status.

  However, you are walking into several well-mined philosophical traps. If you want to survive the reading group, you need to armor-plate this against standard objections. Here is the blunt feedback you asked for, organized by your specific concerns.

  ### 1. Is the "Counterfactual Criterion" distinct from standard functionalism?
  **Verdict:** No, but it is a necessary *specification* of it.
  You are not reinventing the wheel; you are trying to fix the steering. Standard functionalism defines mental states by their causal roles. Your "counterfactual profile" is just a rigorous way of stating "causal role."
  *   **The Risk:** You might think you've solved the "Triviality Argument" (that everything computes everything), but this is the central battleground of 1980s–2000s Phil of Mind. Searle (Chinese Room/Wall), Putnam (Every open system is an FSM), and Maudlin (*Olympia*) have all hammered this.
  *   **The Maudlin Objection:** Maudlin constructed a machine that has the right *actual* causal chain but lacks the *counterfactual* support (because the backup parts never activate). He argues this kills functionalism. Your view requires the counterfactuals to be *physically supported*, which is the standard response to Maudlin (Chalmers defends this).
  *   **Advice:** Don't claim this is a new criterion. Frame it as **adopting the only version of functionalism that survives the Triviality Argument.** Cite Chalmers ("A Computational Foundation for the Study of Cognition") on combinatorial state automata. Your contribution isn't the criterion itself, but applying it specifically to *moral status attribution* to cut through substrate bias.

  ### 2. Are the Glacier and Cathedral cases doing different work?
  **Verdict:** Yes, keep both, but clarify their distinct roles.
  *   **The Glacier (The Triviality Case):** This handles the **Mapping Problem.** It shows that a static isomorphism isn't enough. The physical dynamics must *support* the counterfactuals. This establishes the *necessary condition* for computation.
  *   **The Cathedral (The Chauvinism Case):** This handles the **Substrate/Speed Intuition.** It tests the *sufficient condition.* If the counterfactuals are supported, does the "weirdness" (size, speed, material) negate moral status?
  *   **The Fix:** Make this distinction explicit. The Glacier shows why we aren't panpsychists about rocks. The Cathedral shows why we must be functionalists about minds. If you merge them, you lose the dialectical step.

  ### 3. The "Observer-Relativity" Trap (Your biggest vulnerability)
  You wrote: *"attribution is observer-relative in an annoying way... does it break the whole view?"*
  **Yes, it potentially breaks the view.**
  If the identification of the "relevant physical variables" depends on an observer's choice of mapping, then **moral status becomes observer-relative.**
  *   **The Nightmare Scenario:** If no one realizes the Cathedral is a pain machine, does it suffer?
      *   If **Yes**: Then the computation is observer-independent. But then you have to explain how the variables are picked out without an observer (naturalizing the mapping).
      *   If **No**: Then moral status depends on whether a smart enough being is around to decode the gears. This implies that if humanity goes extinct, the Cathedral stops suffering. That is a very hard bullet to bite.
  *   **The Objection:** A critic will say: "You haven't solved the mapping problem; you've just pushed it back. The glacier *could* support the counterfactuals if we built a decoder around it. Why is the Cathedral's decoder 'internal' and the Glacier's 'external'?"
  *   **Advice:** You need to argue that the counterfactual support is a **mind-independent physical fact.** The gears *force* the state transitions regardless of whether anyone is watching. The "mapping" isn't something *we* do; it's something the system *enforces*. If you concede the mapping is interpretive, you concede moral status is interpretive. Pick a lane.

  ### 4. The "Slow Brain" Objection (Time and Unity)
  You suspect the reaction to the Cathedral is just "size-and-speed bias." It might be deeper.
  *   **Temporal Binding:** Pain isn't just a logical state; it's a phenomenal experience with a temporal texture (the "specious present"). If your machine takes a day per time-step, does it have a unified consciousness?
  *   **The Objection:** If node A fires on Monday and node B fires on Tuesday, is there a subject that experiences the *relation* between A and B? Or is it just a disjointed series of states?
  *   **Advice:** Anticipate this. You can argue that **logical time** matters, not **clock time.** If the causal dependencies are preserved, the phenomenology should be preserved (Chalmers' "Fading Qualia" argument). But acknowledge that this is where the intuition really fights back.

  ### 5. The Gap Between Computation and Moral Status
  You jump from "It computes pain" to "It has moral status."
  *   **The Hard Problem:** A functionalist can say "It computes pain-behavior and pain-logic." A skeptic will say "Why does that computation *hurt*?"
  *   **Advice:** You don't need to solve the Hard Problem, but you need to state your assumption: **If functionalism is true about mind, then functionalism is true about moral status.** Your paper is conditional: *Given* that computations can constitute mental states, here is how we identify them. Don't let the group get bogged down in "But is it *really* pain?" unless that's your main thesis.

  ### Summary of Actionable Rewrites
  1.  **Literature Check:** Explicitly position yourself against Putnam/Searle (Triviality) and Block (China Brain). Acknowledge you are defending Causal Functionalism.
  2.  **Clarify the Mapping:** Argue that the counterfactual profile is an **intrinsic physical property**, not an observer-relative description. If you don't, moral status becomes subjective.
  3.  **Sharpen the Cathedral:** Address the **Time** objection. Is "one step per day" compatible with a unified subject? If you say yes, explain why logical topology trumps temporal duration.
  4.  **Drop the "Attribution" Language:** You say "when a computation is attributable." This sounds epistemic (about *us* knowing). Change this to "when a computation is **instantiated**." You want ontology, not epistemology.
  5.  **The Moral Hook:** Why does this matter? Because if we build AI or encounter aliens, we might miss their suffering because they don't look like us (the Cathedral case), or we might falsely attribute suffering to simple systems (the Glacier case). Your criterion is a tool for **Moral Risk Assessment.**

  **Final Blunt Truth:** Your intuition is right (substrate doesn't matter, causal structure does), but your formulation of "attribution" threatens to undermine the objectivity of the moral claim. Fix the ontology of the computation, and the moral status follows. Good luck.
