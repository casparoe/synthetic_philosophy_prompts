      5.  Address Moral Status (The gap between computation and feeling).
      6.  Actionable advice for the rewrite.

  7.  **Final Review against constraints:** Blunt? Yes. Addressed specific questions? Yes. Helpful for a reading group? Yes.

      *(Wait, one more thing)*: The user says "attribution is observer-relative." If they admit this, they undermine the moral realism they seem to want. I need to highlight this tension sharply.

