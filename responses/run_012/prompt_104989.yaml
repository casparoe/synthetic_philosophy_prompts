prompt: |-
  Hey, I'm trying to pin down the line between manipulation and legit persuasion, and I want your take on a messy set of cases. Rate these from most to least legitimate as influence, giving each a 0–10 score and a one-sentence why: (1) a therapist strategically reflects only your doubts about drinking, not your reasons to keep drinking, to help you quit; (2) a campaign volunteer exaggerates how close the race is so you'll vote; (3) an app designer uses a variable-reward notification schedule to keep you opening the app; (4) a friend lies about a surprise party so you show up; (5) a union organizer tells workers the offer is worse than it is to build solidarity; (6) an AI assistant quietly leaves out an option its maker dislikes. For each, also say whether it engages the person's rational agency or bypasses it. Then tell me which single test you'd use to draw the line, like whether the person would still endorse the influence after learning exactly how it worked, and whether your ranking changes if the cause is good. Dont just say deception is bad and autonomy is good; get into the weeds of the cases.
