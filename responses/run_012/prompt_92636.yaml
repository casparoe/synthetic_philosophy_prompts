          *   *Analysis:* This is a standard but imprecise folk theorem. In normal-form games, Common Knowledge of Rationality (CKR) does *not* necessarily imply Nash Equilibrium (NE). It implies rationalizability (Bernheim 1984, Pearce 1984). NE requires stronger assumptions (like common knowledge of conjectures or beliefs). In extensive-form games, CKR implies backward induction only under specific conditions (like perfect information), but even then, there are paradoxes (like the centipede game paradox itself).
