          *   *Analysis:* This is the critical technical claim. Monderer and Samet (1989) showed that common *p*-belief implies equilibrium only if *p* is high enough, BUT continuity is not guaranteed in all games. Specifically, in coordination games or games with discontinuous payoffs, high probability belief does *not* guarantee the same outcome as common knowledge. Rubinstein's Email Game is the classic counterexample: common knowledge yields one outcome, common belief (arbitrarily close to 1) yields another.
