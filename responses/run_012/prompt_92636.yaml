          *   *Analysis:* This is a crucial conflation. Knowing the game (rules/payoffs) is *not* the same as Common Knowledge of Rationality (CKR). You can know the payoffs but doubt the opponent's rationality. CKR is about *agency*, not just structure.
          *   *Verdict:* Wrong. Conflates knowledge of game structure with knowledge of rationality.

      *   *Claim 4:* "The theorem usually credited to Aumann, that common knowledge of rationality implies equilibrium play, is the rigorous form of this..."
          *   *Analysis:* Aumann (1987) showed that Common Knowledge of Rationality (in terms of subjective expected utility maximization) implies correlated equilibrium, not necessarily Nash equilibrium. Nash requires independent beliefs. Aumann & Brandenburger (1995) showed conditions for Nash, but CKR alone isn't enough for Nash in all contexts (again, leads to rationalizability).
          *   *Verdict:* Misattribution/Imprecise. Aumann's result is often Correlated Equilibrium, not Nash.

      *   *Claim 5:* "...and it is why the backward-induction solution of the centipede game is compelling: a rational player who knows her opponent to be rational can see that play must unravel from the final node."
          *   *Analysis:* This is the standard backward induction argument. However, the "compelling" nature is exactly what is debated (Kreps et al.). CKR in extensive games is tricky because reaching a node might contradict the assumption of rationality (if a rational player wouldn't have gone there).
