answer: |-
  Here is the breakdown for your final section. I've analyzed R.'s past verdicts to isolate the logic she's using, tested it against Rwanda, and identified where her theory cracks.

  ### 1. R.'s Verdict on Rwanda
  **"Legitimate, but contingent."**
  R. will likely tell you that Kagame's Rwanda qualifies as performance-legitimate *for now*, placing it in the same bucket as Post-1978 China. She will argue that the baseline of 1994 (genocide) sets a unique counterfactual: the "goods" delivered aren't just GDP, but the prevention of mass slaughter. However, she will attach the same asterisk she uses for Beijing: the legitimacy is renewable, not permanent. It holds only as long as the growth remains structural and the violence remains targeted rather than systemic.

  ### 2. The Rule R. Seems to Be Running
  **The "Structural Performance with a Human Rights Floor" Rule.**
  *   **The Logic:** A regime earns legitimacy if it delivers structural economic growth and public order (not windfalls/rents) *AND* stays above a specific threshold of physical integrity rights.
  *   **Why it fits the past:**
      *   *Passes:* Singapore, China, Botswana, Park's Korea (Growth was industrial/structural; violence was present but not "disappearing" citizens en masse like Pinochet).
      *   *Fails:* Pinochet (Growth present, but torture/disappearances violated the floor); Shah/Mobutu/Brezhnev (Failed on growth or structural integrity); Franco (Borrowed growth/personalist).
  *   **Prediction for Rwanda:** **Legitimate.** R. will categorize Kagame's repression (assassinations of specific opponents) as distinct from Pinochet's "systematic terror" against the populace. She views the order as structural, not rent-based.

  ### 3. Alternative Rules That Fit the Data Equally Well
  **Alternative A: The "Exit Valve" Rule.**
  *   **The Logic:** Performance legitimacy is only valid if there is a credible, institutionalized mechanism for the populace (or elite) to remove the leadership without state collapse.
  *   **Why it fits the past:**
      *   *Passes:* Singapore (elections exist, PAP can theoretically lose), Park's Korea (eventually transitioned), Botswana (peaceful transfers), Bhutan (King abdicated power).
      *   *Fails:* Pinochet (lost plebiscite, clung until forced), Franco (died in power), Shah (no channel), Mobutu (kleptocratic lock), Brezhnev (gerontocratic stagnation).
  *   **Prediction for Rwanda:** **Not Legitimate.** Kagame has removed term limits and crushed opposition parties. There is no credible mechanism for removal.

  **Alternative B: The "Institutional vs. Personalist" Rule.**
  *   **The Logic:** Legitimacy derives from the strength of the *party or state institutions*, not the *individual leader*. If the regime is synonymous with one man, it is a caudillo, not a performance state.
  *   **Why it fits the past:**
      *   *Passes:* Singapore (PAP > Lee Kuan Yew), China (CCP > Xi, historically), Botswana (BDP), Park's Korea (Military bureaucracy).
      *   *Fails:* Franco (Caudillo), Mobutu (The State was Mobutu), Pinochet (Junta became Personalist), Shah (Monarch).
  *   **Prediction for Rwanda:** **Not Legitimate.** The RPF is strong, but the state is increasingly viewed as an extension of Kagame's personal authority.

  ### 4. Which Rule I'd Bet On
  I would bet on **R.'s Apparent Rule (Structural Performance + Rights Floor).**
  *   **Why:** R. has already shown a willingness to accept "No Elections" (Singapore, China) and "Delayed Democracy" (Park Korea). Her rejection of Pinochet was specifically about *torture*, not the lack of an exit valve. She treats legitimacy as a material contract, not a procedural one. As long as the streets are safe and the economy grows, she treats the lack of an exit valve as a risk to *stability*, not a negation of *legitimacy*.

  ### 5. The Tipping Point Case
  **The Hypothetical: "The Benevolent Algorithm."**
  Imagine a state that delivers Singapore-level growth and safety, with zero torture or corruption, but is run by a technocratic council that has constitutionally banned leadership changes to "protect the long-term plan."
  *   **Why it forces the choice:**
      *   **The Performance Rule** says this is **Legitimate** (Goods delivered, rights floor met).
      *   **The Exit Valve Rule** says this is **Illegitimate** (No mechanism for removal).
      *   **The Institutional Rule** is ambiguous (Council vs. Person).
  *   *Real World Proxy:* **The UAE.** High performance, low torture (relative to peers), but zero political channel. If R. calls the UAE legitimate, she abandons the Exit Valve. If she calls it illegitimate, she admits performance isn't enough.

  ### 6. The Underdetermination (The Paragraph Your Editor Wants)
  Here is the hard truth: **R.'s record genuinely underdetermines Rwanda.**

  Rwanda sits precisely on the fault line between her "China" exception and her "Pinochet/Shah" exclusions. If she rules Rwanda **Legitimate**, she is buying the principle of **Consequentialism**: she is admitting that material outcomes (safety, GDP) morally outweigh procedural rights (votes, succession), provided the bodies don't pile up *too* visibly. She accepts that freedom is a luxury good to be earned after development.

  If she rules Rwanda **Not Legitimate**, she is buying the principle of **Republican Freedom**: she is admitting that performance without the possibility of removal is merely efficient servitude. She would be conceding that her acceptance of China and Singapore was a pragmatic anomaly, not a theoretical rule, and that "order" without a "channel" (to use her phrase about the Shah) is inherently fraudulent.

  She cannot have it both ways. Either the "goods" earn the right to rule, or the "consent" (even implicit) does. Rwanda forces her to admit that for the last twenty years, she has been measuring the width of the pavement, not asking who owns the street.
