  So here's my weird situation: I'm a grad student who spends half the week on epistemology and the other half writing bits for a monthly open-mic night at a bar near campus, and I've decided to try to write one joke that only actually lands if you know the KK principle and the luminosity business. Not a "haha philosophers are nerds" joke — I want the punchline to turn on the real content, so that someone who knows the material laughs at exactly the point where someone who doesn't just sits there politely. The two things I want in play, roughly: KK says that if you know that p, then you know that you know that p; luminosity says that if you're in some mental state, you're in a position to know that you're in it. What I'm really chewing on is the seam between *knowing* something and merely *being in a position to know* it, and what happens when you run the KK thing upward — is there a top rung of the ladder, and if there is, can anyone actually stand on it?

  Here's the seed I've got, use it or bin it: two people, maybe at a bar, maybe a customs officer and a traveller, maybe someone filling out a form at a counter, and one of them has to certify their own knowledge tier by tier, with a rule that to be certified at tier n you already have to be standing at tier n+1. I also want one bit of weird machinery in there, something I've been kicking around with my flatmate Priya, call it the backward lamp: a little device that tells you whether the state you're in right now is one you're in a position to know you're in, except its readout is itself a state, so it can only ever tell you about the state you were in a moment ago. Doesn't have to be the centre of the joke, I just like the taste of it. Also pls keep it short enough to tell out loud in about forty seconds, and definately no puns. If you can give me two versions — one that ends on the KK ladder, one that ends on the luminosity / position-to-know thing — even better.
