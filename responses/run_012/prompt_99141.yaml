answer: |-
  **Version 1: The KK Ladder**

  I'm at the counter, filing a Knowledge Claim.
  The clerk says, "Rule one: To certify line $n$, you must know you're certified for line $n-1$."
  I sign line one.
  He says, "Now certify line two: that you know line one."
  I sign.
  "Now line three: that you know you know line one."
  I put the pen down. "This ladder doesn't end."
  He says, "Exactly. KK principle. If knowledge requires knowing you know, you need infinite rungs."
  I say, "So how do I file?"
  He stamps it 'Incomplete'. "You haven't reached the top."
  I say, "There is no top."
  He says, "Then you haven't started. Next."

  **Version 2: The Backward Lamp**

  I'm testing Priya's backward lamp.
  It tells you if you were in a position to know your mental state.
  I feel tired. I check the lamp.
  It reads: "You were in a position to know."
  I say, "So I know I'm tired?"
  She says, "No, the readout is itself a state. You need to know you're seeing it."
  I check again.
  It reads: "You were in a position to know you were seeing."
  I say, "So I never actually know what state I'm in?"
  She says, "Luminosity fails. You're always one state behind."
  I say, "Do I know that?"
  She says, "Check tomorrow."
