answer: |-
  This is a sharp observation, and you are bumping into the structural fault lines of solution concepts. You are asking for the "carving"—the conceptual boundaries between strict/weak, pure/mixed, and order-dependence.

  Here is the breakdown of what you are seeing, what it is called, and where the edges lie.

  ### 1. The "Evaporation" Phenomenon
  **Is there a name?**
  There is no specific eponymous name for "elimination licensed by a mix that is later eliminated." In the literature, this is simply treated as a standard feature of **Iterated Elimination of Strictly Dominated Strategies (IESDS)** when mixed strategies are allowed to serve as dominators.

  **Is it a problem?**
  In **Strict Dominance**, no. In **Weak Dominance**, yes.

  *   **Strict Dominance (IESDS):** The logic is based on *Common Knowledge of Rationality (CKR)*. At round $k$, I know you are rational, so I know you won't play strategies eliminated in round $k-1$. If my strategy $s_i$ is strictly dominated by a mix $\sigma_i$ *given the strategies remaining at round $k-1$*, $s_i$ is irrational.
      *   The fact that the pure strategies in the support of $\sigma_i$ are eliminated in round $k+1$ does not "resurrect" $s_i$. The elimination of $s_i$ was valid at step $k$ based on the belief set at step $k$. The transitivity of strict dominance ensures that if $\sigma_i$ is later eliminated, there is some *other* strategy (or mix) that dominates $\sigma_i$, and by linearity of expected utility, that new strategy also dominates $s_i$.
      *   **Result:** The "evaporation" is cosmetic. The final set of survivors (the **Rationalizable Strategies**) is unique.

  *   **Weak Dominance (IEWDS):** This is where your intuition about "evaporation" becomes critical. Weak dominance relies on beliefs that assign zero probability to some opponent strategies. If you eliminate a strategy based on a weak dominance argument, and the dominating strategy is *itself* eliminated later (or relies on opponent strategies that get eliminated), you may have pruned a Nash Equilibrium.
      *   **Result:** The justification *does* matter. If the dominator evaporates, the elimination might be considered "unstable" (related to **Trembling Hand Perfection**).

  ### 2. The Order Dependence Red Flag
  You wrote: *"if I do the deletions in a different order I can land on a different surviving set."*

  **This is the smoking gun.**
  If you are truly performing **Strict** Dominance (allowing for mixed dominators), **order dependence is impossible.**
  *   **Theorem (Pearce 1984):** In finite games, the set of strategies surviving IESDS is unique, regardless of the order of elimination, *provided* you allow strategies to be dominated by **mixed** strategies.
  *   **Transitivity:** Strict dominance is transitive. If $A$ dominates $B$, and $C$ dominates $A$, then $C$ dominates $B$. Even if you eliminate $A$ before $B$, $B$ is still dominated by $C$. Even if $A$ dominates $B$ via a mix, and the components of that mix are dominated by other things, the linearity of utility ensures a new mix exists that dominates $B$.

  **If you are seeing order dependence, one of two things is happening:**
  1.  **You are doing Weak Dominance:** This is the most common source of order dependence in PhD work. IEWDS is notoriously order-dependent. The "evaporation" of the dominating strategy is exactly *why* order matters in IEWDS.
  2.  **You are restricting Strict Dominance to Pure Dominators only:** If you forbid mixed strategies from doing the dominating (i.e., $s_i$ is only eliminated if a *pure* $s'_i$ beats it), you change the surviving set. While the process of eliminating *pure-dominated* strategies is technically order-independent, the *set* you arrive at is larger than the Rationalizable set. However, this usually results in a *failure to eliminate*, not different sets based on order.

  **Diagnosis:** Check your inequalities. If you have any $u(s_i, s_{-i}) \leq u(s'_i, s_{-i})$ (with equality for at least one $s_{-i}$), you are doing Weak Dominance. That is the source of your order dependence.

  ### 3. Pure vs. Mixed Dominators (The "Carving")
  You asked if there is a standard distinction between being beaten by a pure alternative vs. only by a mix.

  **Yes.** This distinction maps onto **Dominance Solvability** vs. **Rationalizability**.

  *   **Pure-Strategy Dominance:** If you only eliminate strategies dominated by *pure* strategies, you are checking for **Dominance Solvability**.
      *   Many games (e.g., Cournot, some auctions) are not dominance solvable in pure strategies.
      *   Strategies that survive pure-only elimination but are killed by mixed dominators are **not Rationalizable**.
  *   **Mixed-Strategy Dominance:** If you allow mixes to dominate, you are identifying the set of **Rationalizable Strategies** (Bernheim 1984, Pearce 1984).
      *   **The Edge:** A strategy is Rationalizable if and only if it survives IESDS (allowing mixes).
      *   **The "Evaporation" here:** It is common for a strategy to be dominated *only* by a mix of strategies that are themselves not rationalizable. This does not invalidate the elimination. It simply means the "depth" of rationality required to eliminate the first strategy is lower than the depth required to eliminate the dominators.

  ### 4. Summary of the Carving

  Here is the conceptual map you are looking for:

  | Feature | **IESDS (Strict)** | **IEWDS (Weak)** |
  | :--- | :--- | :--- |
  | **Inequality** | $u(s') > u(s)$ for all $s_{-i}$ | $u(s') \geq u(s)$ for all, $>$ for some |
  | **Dominator Type** | Pure or Mixed | Pure or Mixed |
  | **Order Dependence** | **No** (Unique Survivors) | **Yes** (Path Dependent) |
  | **"Evaporation"** | Harmless (Transitivity holds) | **Critical** (Can kill NE) |
  | **Surviving Set** | **Rationalizable Strategies** | Subset of NE (often too small) |
  | **Epistemic Foundation** | Common Knowledge of Rationality | Rationality + Caution / Trembling Hand |

  | Feature | **Pure Dominator Only** | **Mixed Dominator Allowed** |
  | :--- | :--- | :--- |
  | **Elimination Power** | Weaker (Fewer strategies killed) | Stronger (More strategies killed) |
  | **Resulting Set** | Superset of Rationalizable Set | **The Rationalizable Set** |
  | **Order Dependence** | No (but set is larger) | No (set is minimal) |

  ### 5. Recommendation for your Work
  1.  **Verify Strictness:** If you are seeing order dependence, double-check that you aren't slipping into weak dominance. If you are strictly in the strict domain, your order dependence is a calculation error or a bug in your code/algorithm.
  2.  **Terminology:** When writing, if you need to refer to the "mix that gets eliminated," you can describe it as **"dominance by a mixture of subsequently eliminated strategies."** It doesn't have a catchy name because, in Strict Dominance, it's theoretically inert.
  3.  **The "Why":** If you need to justify why you allow mixes to dominate even if they get pruned later, cite **Pearce (1984)** or **Bernheim (1984)**. The argument is that Rationalizability is defined by the *maximal* reduction consistent with CKR. The intermediate steps are just the algorithm to find the fixed point; the "validity" of a step doesn't depend on the survival of the dominator, but on the survival of the *dominance relation* (which is preserved via transitivity in the strict case).

  **Bottom Line:** The "evaporation" is normal. The order dependence is not (for strict dominance). You are likely conflating the **Pure/Mixed** distinction (which changes the *size* of the set) with the **Strict/Weak** distinction (which changes the *stability/uniqueness* of the set).
