  Maya tapped the color chart laid out on the table. It was a smooth gradient, a seamless strip running from a deep, blood red on the left to a bright, pumpkin orange on the right.

  "Look at chip number forty-three," Maya said. "It's red. Chip forty-four is also red. But somewhere between here and fifty, 'red' stops applying. There is a last red chip. It's a fact about the meaning of the word, even if we can't know which one it is."

  Leo leaned back, crossing his arms. "That's the epistemicist view, right? You're saying there's a sharp boundary hidden in the blur?"

  "It's not hidden," Maya corrected. "It's there. Vagueness is ignorance. The word 'red' has a precise extension, but our access to it is limited."

  "But our use of the word is the only thing that could fix its meaning," Leo countered, leaning forward. "We learn 'red' by looking at examples, by correcting each other. If the supposed cutoff is fixed by facts about our use that we cannot survey, what makes it a fact at all? If no amount of looking, measuring, or asking speakers could ever tell us which shade it is, then it's a distinction with no difference it could ever make. It's metaphysical magic."

  Maya shook her head. "It makes a difference to the truth. Think about how we argue. If I say chip forty-nine is red and you say it isn't, we feel like we're disagreeing about something. We aren't just talking past each other. But if your view is right—if 'red' is merely unsettled in the middle—then when two speakers disagree about a shade in the middle they are not really disagreeing about anything. There's no fact of the matter to be wrong about. That is hard to square with how such arguments feel from the inside. It feels like I'm claiming something true and you're denying it."

  "It feels that way," Leo admitted, "but feelings aren't logic. On my view, 'red' is true of some shades and false of others, and simply unsettled about the shades in between. So 'this shade is red' may be neither true nor false. But crucially, 'this shade is red or it is not' is still true. I keep the Law of Excluded Middle. I just drop Bivalence."

  "But you pay a cost for that," Maya pressed. "If you have truth-value gaps, your logic has to give up classically valid patterns of inference. You can't always reason from premises to conclusions the way we do in math or science. If 'red' is unsettled, then reasoning about 'red' things becomes unstable. You're sacrificing the reliability of logic to save your intuition about boundaries."

  "It's a small sacrifice to avoid your problem," Leo said. "Because your view has a massive cost. A boundary no possible investigation could reveal looks arbitrary rather than discovered. Why does the meaning of 'red' snap at chip forty-nine rather than fifty? There's no difference in the chips, no difference in our brains. To say there's a fact there is to say language works by magic rules we can't detect. It makes meaning independent of users."

  "It makes meaning precise," Maya insisted. "But I'll grant you this: the arbitrariness is uncomfortable. However, look at your own view. You say there's a region where it's unsettled. But surely there's a boundary between the 'definitely red' chips and the 'unsettled' ones? If 'red' is vague, then 'definitely red' should be vague too. That's higher-order vagueness. But if you draw a line between 'true' and 'unsettled', you've just reintroduced the sharp boundary you wanted to avoid. You've pushed the problem back one step, not solved it."

  Leo paused, tapping his pen on the table. "That's the standard objection. Higher-order vagueness is tricky. I can say the boundary between 'true' and 'unsettled' is also unsettled. But I concede that creates a complex hierarchy. It's not clean."

  "And," Maya added, "if you give up classical inference rules, you make reasoning about vague terms fundamentally different from reasoning about anything else. That seems like a high price to pay to avoid saying there's a last red chip."

  "Maybe," Leo said. "But your price is believing in invisible cliffs. You want me to accept that there is a single particular shade at which 'red' ceases to be true, and that this is a fact about meaning. I just can't accept that a fact exists if it is原则上 inaccessible to the community that uses the language. It makes meaning spooky."

  " And I can't accept that my disagreement with you about chip forty-nine is just us negotiating," Maya said. "I think I'm right and you're wrong. If there's no fact, I'm not right."

  Leo sighed, looking at the chart. "Okay, I'll concede something small. I agree that the phenomenology of disagreement is strong. It does feel like we are clashing over a fact. Maybe my view needs to explain why it *feels* like there's a fact even when there isn't one. I might need to account for that intuition better than I have."

  "And I'll concede," Maya said, tracing the gradient with her finger, "that the idea of a sharp boundary known only to the universe and not to us is deeply counterintuitive. It feels less like discovering meaning and more like stipulating it."

  "So we're stuck," Leo said.

  "We're stuck," Maya agreed. "But at least we agree chip forty-three is red."

  "For now," Leo smiled. "Until we get to forty-four."
