          *   Author splits this: Understanding vs. Acceptance/Role-filling.
          *   *Risk:* Is "ratificatory uptake" actually uptake? Or is it a separate felicity condition (like appropriateness of participants)? Austin distinguishes between *misfires* (act not achieved) and *abuses* (act achieved but insincere/etc.). The author's "ratificatory" sounds like a misfire condition (act doesn't happen), while "recognitional" sounds like it allows the act to happen even if rejected.
          *   *Critique:* This looks like a reclassification of Austin's conditions on participants and circumstances rather than a split of *uptake* specifically.

      *   *Asymmetries (Promises/Apologies vs. Permissions/Appointments):*
