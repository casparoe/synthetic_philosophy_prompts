          *   *Strict Austin:* A strict Austinian says machines can't secure uptake. Therefore, *no* act succeeds. Your distinction tries to save some acts. This requires arguing Austin was wrong about uptake being necessary for *all* performatives.

      *   *Point 4: Interesting vs. Distinction without Difference.*
