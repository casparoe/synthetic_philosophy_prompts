  My brother-in-law read Gödel, Escher, Bach over the summer and now every family dinner turns into a lecture about how Gödel proved machines can't think. I'd like to definately understand whether he's right instead of just nodding along. His version, as best I can reconstruct it: (a) for any consistent formal system that can do arithmetic there's a true sentence it can't prove; (b) he can see the sentence is true and the machine can't, so he isn't a formal system; (c) the machine is stuck inside itself while he can step outside and take in the whole system at once; (d) hand the machine the sentence as a fresh axiom and it just gets a new unprovable sentence, so he's always one step ahead. He says he doesn't even need to know he's consistent himself -- he can just see the conditional, and the machine is too dumb to get from the conditional to the sentence itself. (He's a programmer who works in one of those proof assistants where you aren't allowed to have a type that contains all the types, and he thinks that's the same picture: the mind is the thing that can always go up a level.)

  Is any of this right, and where exactly does it break? And what do I actually say at dinner so I don't come off as the guy who read half of Wikipedia?

