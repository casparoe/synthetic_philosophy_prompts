answer: |-
  You do not have to give up a single one of these verdicts. In fact, your intuitions are remarkably consistent with a specific, robust philosophical framework. You are not oscillating randomly; you are applying a **Qualified Claim-Right Theory** of promising.

  Most people try to force all promises into one of two boxes: "It's about reliance" (they counted on me) or "It's about words" (I gave my word). Your gut rejects both of those as sufficient.

  Here is the single principle that unifies all seven of your verdicts, followed by what it implies for the "forgotten promise."

  ### The Principle: Valid Voluntary Transfer of Moral Claim

  **The Principle:** *A promise binds only when a person voluntarily transfers a moral claim over their future actions to another person, provided the content is moral, the consent is informed and free, and the recipient is a distinct moral agent.*

  This principle has **Three Gates of Validity** and **One Scope of Obligation**.

  #### The Three Gates (Why some promises are void)
  1.  **The Freedom Gate (Voluntariness):** You must choose to bind yourself without coercion or deception.
  2.  **The Morality Gate (Permissibility):** You cannot transfer a claim to do something immoral.
  3.  **The Otherness Gate (Interpersonality):** A claim must be held by *another* person; you cannot hold a binding claim against yourself in the same way.

  #### The One Scope (What you are bound to)
  *   **The Spirit of the Trust:** You are bound to the *purpose* of the reliance you invited, not necessarily the literal physics of the act, provided the first three gates are met.

  ---

  ### How It Fits Your Verdicts

  **1. The Lunch (Bound)**
  *   **Analysis:** Passes all three gates. It is voluntary, moral, and interpersonal.
  *   **Verdict:** You transferred a claim. Breaking it violates their right to expect you.

  **2. The Boss/Coercion (Not Bound)**
  *   **Analysis:** Fails the **Freedom Gate**.
  *   **Verdict:** A promise made under duress ("make my life hell") is not a voluntary transfer of a claim. It is an extraction. Your gut is right: it barely feels like a promise because the essential ingredient (will) is missing.

  **3. The Body Disposal (Void)**
  *   **Analysis:** Fails the **Morality Gate**.
  *   **Verdict:** You cannot transfer a moral claim to do something immoral. No one has a "right" to your complicity in a crime. The promise is void *ab initio* (from the start).

  **4. The Dying Mother (Strongly Bound)**
  *   **Analysis:** Passes all gates.
  *   **Verdict:** This is the case that kills "Reliance Theory" (which says promises bind because someone is counting on you). Your gut knows that the obligation isn't about her *reliance* (she's dead); it's about the **transfer of the claim** that happened while she was alive. She gave you a duty. That duty survives her because it is now part of your moral integrity. You owe it to *her memory* and to *yourself as a promise-keeper*, not to her current expectations.

  **5. The Car/Fraud (Off the Hook)**
  *   **Analysis:** Fails the **Freedom Gate** (specifically, informed consent).
  *   **Verdict:** Fraud vitiates consent just like coercion. You agreed to *X* (selling to a genuine buyer), but he tricked you into *Y* (selling to a liar). You never voluntarily transferred a claim under *those* conditions.

  **6. The Zoo/Closed (Bound to Alternative)**
  *   **Analysis:** Passes all gates, but tests the **Scope**.
  *   **Verdict:** The claim you transferred was not "access to a building on Saturday"; it was "a special outing for the child's benefit." Since the literal act became impossible through no fault of your own, the obligation shifts to the *spirit* of the promise (the child's enjoyment). You are still bound to the *value* you promised.

  **7. The Self-Promise (Not the Same)**
  *   **Analysis:** Fails the **Otherness Gate**.
  *   **Verdict:** You cannot be a creditor and a debtor to yourself in the same way. You can release yourself from a self-promise at any time because the "claimant" and the "promisor" are the same will. It feels different because it *is* different: it's a goal, not an obligation.

  ---

  ### The Test Case: The Forgotten Promise

  **The Scenario:** You promise a friend you will help them move house next month. Two weeks later, they completely forget you ever made this promise. They make other plans that don't involve you. Do you owe them anything?

  **What The Principle Says:**
  According to the **Valid Voluntary Transfer** principle, **you are still bound, but the nature of the obligation changes.**

  Here is why:
  1.  **The Claim Exists:** When you made the promise, you transferred a moral claim to them. The fact that they forgot the claim does not erase the transfer, just as forgetting you own a stock doesn't mean you no longer own it.
  2.  **The Harm is Diminished:** Usually, breaking a promise wrongs the person because it betrays their trust and ruins their reliance. If they forgot, they aren't relying on you, so you won't cause them *practical* harm by not showing up.
  3.  **The Integrity Remains:** However, the obligation remains on *your* side. You invited a state of accountability. If you know they forgot, and you use that as an excuse to slack off, you are treating the promise as a trap for *them* rather than a bond for *you*.

  **The Verdict:**
  You owe them a **notification**, not necessarily the performance.
  *   Because the promise was interpersonal, you cannot unilaterally dissolve it just because they forgot.
  *   However, because the *purpose* of the promise was to aid them, and they have now made plans that suggest they don't need that aid, forcing your help on them might violate the **Spirit of the Trust**.
  *   **Resolution:** You are bound to *remind them* of the promise ("Hey, I know you might have forgotten, but I'm still here to help if you need it"). If they say "Oh, I'm good," *then* the claim is waived, and you are off the hook.

  **Summary:**
  Your gut is tracking a sophisticated moral logic. You believe promises are **sacred transfers of autonomy** that require **freedom, truth, and morality** to be valid. You don't need to give up any of your verdicts; they are all consistent with the view that a promise is a **moral gift of a right** that, once given, cannot be taken back unless the conditions of the gift were fake.
