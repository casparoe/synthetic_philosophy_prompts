  9.  (Final Review of the "Permanent vs Irreversible" logic):
      *   User: "If you actually did chest compressions... the heart could plausibly start again."
      *   Correction: After 5 mins of no flow, *successful* resuscitation with good neurological outcome is highly unlikely, but *mechanical* restart might be possible. The key is the *decision* not to try.
      *   This confirms the user's point: Death is contingent on the treatment plan.

