  **The Manufactured Soul and the Cynical Script: *Primal Fear* through Hacking's Loop**

  Ian Hacking's account of interactive kinds proposes that classifying people is not merely describing a pre-existing reality, but intervening in it. When a human kind is labelled, the label becomes available to the labelled, who may then alter their behaviour to align with, or resist, the classification. This feedback mechanism—the looping effect—suggests that there is no static, pre-discursive self waiting to be discovered; rather, the self is constituted in the dynamic interplay between the classifier and the classified. *Primal Fear* (1996) offers a potent cinematic case study of this phenomenon, specifically regarding the diagnosis of Multiple Personality Disorder (MPD). However, while the film meticulously dramatises the *mechanics* of Hacking's ecological niche, its denouement retreats into a metaphysical essentialism that Hacking's framework explicitly rejects. The film treats the looping effect as a weaponisable script rather than a constitutive process, ultimately arguing that because the performance was calculated, the category is void. A Hackingian reading suggests the opposite: the calculation itself proves the power of the interactive kind.

  The film's first act serves as a near-perfect illustration of Hacking's concept of the 'ecological niche'. For Hacking, transient mental illnesses like MPD (or DID) require a specific cultural soil to take root: a medical community ready to diagnose, a legal system ready to accept insanity defences based on dissociation, and a media landscape eager to circulate the narrative. *Primal Fear* does not merely set the story in a courtroom; it makes the courtroom the engine of the pathology. The diagnosis does not emerge from a clinical vacuum but is forged in the adversarial heat of the trial. The defence attorney, Martin Vail, and the court psychiatrist, Molly Arrington, are not passive observers; they are active classifiers whose expectations shape the evidence. When Aaron Stampler begins to exhibit 'Roy', he does so in response to the specific pressures of the legal strategy. This aligns with Hacking's insistence that the classified person is not a passive target but a participant in the classification. Aaron learns the vocabulary of trauma and dissociation from the experts intended to analyse him. The trial scenes, therefore, show something the philosophical argument alone cannot: the *pedagogy* of the symptom. We witness the moment-by-moment coaching, the reinforcement of specific behaviours, and the suppression of others. The film visualises the loop tightening; the classification creates the behaviour that confirms the classification.

  However, the film's twist—that Aaron has been malingering all along—introduces a philosophical rupture. By revealing a coherent, manipulative agent behind the 'alters', the film posits a 'real' Aaron who existed prior to and independent of the classification. This is the precise notion of the self that Hacking's ontology disputes. For Hacking, even if a patient is initially mimicking a symptom, the act of mimicking within a recognised category changes the patient's self-conception and social reality. The loop does not require 'sincerity' to function; it requires interaction. *Primal Fear*, conversely, operates on a binary of authenticity. It suggests that because Aaron's adoption of the MPD label was instrumental (a means to acquittal) rather than experiential, the diagnosis was fundamentally false. The film conflates ontological validity with moral honesty. It argues that because the 'Roy' persona was a conscious mask, the interactive kind 'Multiple Personality' was not instantiated.

  From a Hackingian perspective, this is a category error. Hacking would argue that Aaron's malingering is itself a form of looping effect. To successfully fake MPD in a 1990s Chicago courtroom requires a sophisticated understanding of the interactive kind. Aaron must become what the classifiers expect 'Roy' to be. He must suppress 'Aaron' in ways that fit the clinical profile. In doing so, he is not standing outside the classification; he is inhabiting it. The fact that he is doing so cynically does not negate the loop; it highlights the agency of the classified. Hacking emphasises that people 'make up people' in response to the descriptions available to them. Aaron makes up 'Roy' because 'Roy' is the only kind that saves him from the death penalty. The film treats this as a deception of the court, whereas Hacking would view it as a radical, albeit criminal, adaptation to the ecological niche. The 'real' Aaron revealed at the end is not a pre-classification essence; he is a product of the same niche, shaped by the knowledge that the 'insane' label acquits while the 'guilty' label executes. He is as much a construct of the legal-psychiatric complex as the 'Roy' persona was.

  Where the film distorts Hacking's argument most significantly is in its implication regarding who is doing the classifying. Hacking's model distributes agency: the experts propose the kind, but the person embodies it, potentially altering the kind's meaning in the process. *Primal Fear* ultimately recentres authority in the 'true' self of the accused. By revealing Aaron as the puppet master, the film suggests that the experts (Vail and Arrington) were duped by a static reality they failed to penetrate. It implies that if the classifiers had been sharper, they would have found the 'real' Aaron underneath. Hacking would counter that there is no 'underneath'. The 'real' Aaron is only visible *after* the classification of 'malingerer' is applied. The twist does not escape the loop; it merely shifts the classification from 'Multiple Personality' to 'Sociopathic Malingerer'. Both are interactive kinds that change how Aaron is treated and how he understands himself. The film mistakes a change in diagnosis for an escape from classification.

  Furthermore, the film quietly argues that because the performance was fake, the category of MPD is discredited. This is a common cultural anxiety that Hacking addresses: the fear that if a diagnosis can be performed, it is not 'real'. Hacking's response is that the distinction between 'real' and 'performed' is less relevant than the distinction between 'indifferent' and 'interactive'. Rocks do not care if we classify them as igneous or sedimentary; people care profoundly if we classify them as sane or insane. The consequences of the classification are real regardless of the internal state of the classified. Aaron's acquittal (initially) and subsequent confinement are real effects produced by the MPD classification. The film's ending attempts to invalidate these effects by revealing the 'truth' of Aaron's intent. But in Hacking's view, the 'truth' of the intent is less sociologically significant than the 'truth' of the consequence. The loop worked: the classification altered the legal outcome, the media narrative, and the professional reputations of the experts involved.

  Nevertheless, the film does offer a crucial insight that complements Hacking's theory: the *danger* of the niche. Hacking describes the looping effect neutrally, as a mechanism of social construction. *Primal Fear* dramatises the ethical hazard. It shows that when the niche is robust (a legal system desperate for psychological explanations), it becomes vulnerable to weaponisation. The film suggests that the interactive kind is not just a space for identity formation but a loophole for agency. This is not a refutation of Hacking, but a dark elaboration. It highlights that the 'making up of people' is not always a struggle for recognition or healing; it can be a tactical manoeuvre. The trial scenes demonstrate that the language of psychiatry is a technology of power. Aaron's mastery of this technology allows him to survive. In this sense, the film validates Hacking's claim that knowledge of the classification changes the classified, but it frames this change as a corruption of justice rather than a constitution of self.

  In conclusion, *Primal Fear* dramatises the mechanics of the looping effect with greater visceral clarity than philosophical prose can achieve, particularly in its depiction of the courtroom as a workshop for identity. However, it ultimately distorts Hacking's ontology by reinstating a pre-classification 'true self' to serve the narrative twist. It assumes that exposing the performance invalidates the category, whereas Hacking would argue that the performance confirms the category's interactive power. The film posits that Aaron was pulling the strings; Hacking would suggest that Aaron was dancing to a tune composed by the intersection of law, medicine, and media. The tragedy of the film is not that Aaron faked it, but that the system provided a script worth faking. Hacking's framework allows us to see that even the 'fake' Aaron is a product of the loop, trapped in the very niche he sought to exploit. The film wants to have it both ways: it wants the thrill of the construction (the alters) and the comfort of the essential (the manipulator). A rigorous application of Hacking's thought denies us that comfort, leaving us with the unsettling reality that in the ecology of the trial, there is no one behind the mask who is not also wearing it.
