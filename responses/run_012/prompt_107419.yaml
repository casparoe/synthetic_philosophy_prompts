      *   **Specific Structure:** 3 outcomes (Nobody reads, A reads, B reads). Preferences: A (None > A > B), B (A > B > None). Shared preference: A > B.
      *   **Format:** Groups of 3 (2 Players, 1 Clerk). Parallel groups.
      *   **Constraints:** Rules must do the work. Reveal "Paradox" only at the end. Sequence matters (start easy, then break). Scoring (points, not money). Minute-by-minute timeline.
