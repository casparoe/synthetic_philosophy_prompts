      *   *Limitation:* The game makes it look like a coordination failure. Sen's point is logical impossibility, not strategic failure. The game needs to emphasize that *even if everyone follows the rules perfectly*, it breaks.
      *   *Limitation:* Transitivity. Students might not care about transitivity. Need to enforce "Social Ranking must be a valid list."

  9.  **Refining the Debrief:**
