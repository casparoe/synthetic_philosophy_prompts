answer: |-
  **Exam Question**

  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Question 1**

  Consider a "measure-agnostic Everettian." This agent accepts the completeness of unitary dynamics and the reality of the branching wavefunction but denies that squared amplitudes have any normative authority over belief or betting. Instead, she proposes a "branch-counting" rule: every distinct outcome branch is treated as equally probable, regardless of its amplitude.

  The standard objection is that branch counting is basis-dependent: the number of branches changes depending on how the state is decomposed, and in continuous cases, the count is ill-defined.

  Write an essay evaluating the force of this objection and the subsequent attempts to recover the Born rule. Your answer must address the following:
  1.  Does the basis-dependence objection refute the measure-agnostic outright, or does it merely force her to accept a preferred basis? If the latter, what does the selection of that basis concede regarding the measure?
  2.  Evaluate the decision-theoretic approach: does it derive the Born rule from rationality, or does it smuggle the measure into the axioms (specifically regarding indifference between branches)?
  3.  Evaluate the self-locating uncertainty approach: does it successfully ground rational credence, or does it merely describe a state of ignorance without justifying specific probability weights?
  4.  Conclude by stating whether the Born rule in this context should be understood as a physical discovery or a normative stipulation.

  *Note: Do not cite specific authors or historical debates. Focus entirely on the conceptual structure of the arguments.*

  ***

  **Model Answer**

  The measure-agnostic Everettian poses a fundamental challenge to the coherence of the Many-Worlds interpretation. If the wavefunction never collapses, all outcomes occur. To recover empirical coherence, we must explain why an agent should bet as if some outcomes are more likely than others, specifically according to the Born rule. The branch-counting alternative seems intuitive—if there are two branches, why is one not 50%?—but it collapses under structural scrutiny.

  The basis-dependence objection is the first line of defense. In Hilbert space, a state can be decomposed into orthogonal components in infinitely many ways. Without a preferred basis, "counting branches" is mathematically ill-defined; one can rotate the basis to generate any integer count of outcomes. This does not merely refute the measure-agnostic; it forces a concession. To define branches at all, one must invoke a mechanism like decoherence to select a stable basis. However, decoherence relies on the suppression of interference terms, a process governed by the magnitude of amplitudes. A branch is only "distinct" if the amplitude of the interference is negligible. Therefore, by accepting a preferred basis to make counting possible, the agent implicitly accepts the physical significance of amplitude. She cannot have the branches without the measure that defines them. The objection shows that branch counting is not an alternative to the Born rule, but a parasitic concept that requires the Born rule to get off the ground.

  However, admitting a preferred basis does not automatically yield the Born rule; it only yields distinct outcomes. This is where decision-theoretic derivations attempt to bridge the gap. These arguments posit that a rational agent, knowing the branching structure, must act to maximize expected utility. By imposing axioms on preferences—such as ordering, continuity, and branching indifference—one can prove that the agent must weight branches by squared amplitude. The critical vulnerability lies in the axiom of branching indifference. This axiom states that an agent should not care about the mere number of branches if the rewards and amplitudes are identical. Critics argue this smuggles in the conclusion. If an agent cares about the *number* of future selves, branching indifference is irrational. To assert it is rational is to presuppose that "number" is irrelevant and "amplitude" is what matters. Thus, the decision-theoretic approach risks circularity: it derives the Born rule only by assuming a normative constraint that already privileges amplitude over count. It does not discover the measure in the physics; it imposes it as a requirement of rationality.

  The self-locating uncertainty approach attempts a different route. It argues that upon branching, an agent is uncertain about which branch they will find themselves on. This provides an epistemic ground for probability in a deterministic multiverse. However, this approach faces a gap between uncertainty and weight. Knowing that I will be on one of two branches explains why I am uncertain, but it does not explain why my credence should be 1/3 for one and 2/3 for the other rather than 1/2 each. Unless the principle of indifference is modified to respect amplitude, self-locating uncertainty alone supports the branch-counter. To work, it must be supplemented by a principle that ties "likelihood of finding oneself" to amplitude. Without this supplement, the approach describes the *existence* of credence but fails to justify its *distribution*. It separates belief from action but leaves the normative link between amplitude and belief ungrounded.

  Ultimately, the failure of branch counting and the circular risks of derivations suggest that the Born rule is not a physical fact waiting to be extracted from the wavefunction alone. The wavefunction provides the ontology of branches, but it does not dictate the normative weight of those branches. The measure-agnostic is wrong to count branches, not because the count is physically impossible, but because the definition of a branch already presupposes amplitude. Yet, the decision-theoretic and self-locating arguments show that moving from "branches exist" to "bet on amplitude" requires a normative leap. The Born rule is best understood not as a discovery of physical frequency within the multiverse, but as a stipulation of rationality required to make the theory empirically intelligible. We do not find probability in the equations; we impose it to make the equations match the world we observe.

  ***

  **Marking Scheme**

  **Total Marks:** 20

  **1. The Basis-Dependence Concession (4 Marks)**
  *   **Requirement:** Must explain that branch counting is ill-defined without a preferred basis and that selecting a basis (via decoherence/stability) implicitly relies on amplitude thresholds, thereby conceding the measure-agnostic's core denial.
  *   **Common Failure:** Candidates state that basis dependence makes counting "wrong" without explaining that defining the branches *already* requires the measure they sought to ignore.

  **2. Decision-Theoretic Circularity (4 Marks)**
  *   **Requirement:** Must identify that decision-theoretic derivations rely on axioms (specifically branching indifference) that arguably presuppose the irrelevance of branch count and the relevance of amplitude, risking circularity.
  *   **Common Failure:** Candidates describe the decision-theoretic result as a successful "proof" without analyzing whether the axioms themselves smuggle in the conclusion.

  **3. Self-Locating Uncertainty Limitations (4 Marks)**
  *   **Requirement:** Must distinguish between the existence of uncertainty (I don't know which branch I'm on) and the justification of specific weights (why amplitude determines credence), noting that uncertainty alone supports branch counting.
  *   **Common Failure:** Candidates conflate "being uncertain" with "having Born-rule credences," failing to see that self-location does not inherently dictate probability weights.

  **4. Discovery vs. Stipulation (4 Marks)**
  *   **Requirement:** Must conclude that the Born rule functions as a normative bridge or stipulation of rationality rather than a purely physical property derived from unitary dynamics alone.
  *   **Common Failure:** Candidates insist the Born rule is a "physical fact" derived from the ontology, ignoring the normative gap between "is" (branching) and "ought" (betting).

  **5. Conceptual Integration (4 Marks)**
  *   **Requirement:** The essay must weave these points into a coherent argument where the failure of branch counting motivates the derivations, and the flaws in the derivations motivate the conclusion about normativity.
  *   **Common Failure:** Candidates treat the three topics (basis, decision theory, self-location) as isolated bullet points without showing how the failure of one motivates the next.
