prompt: |-
  I chair a small grant-making trust. We have eleven trustees and an endowment of about £4 million, out of which any single trustee may authorise a grant of up to £10,000 without consulting the others, provided they write a short justification afterwards. The power exists for speed: we deal with disasters, sudden legal emergencies and other cases where a delay of a fortnight destroys the point of the grant. It worked well enough when there were three of us. At eleven, our own post-hoc reviews suggest that a growing share of what we fund would not have been approved by the board as a whole, and I cannot tell whether that is a fact about the trustees we have recruited or about the arrangement itself.

  I have come across the idea of the unilateralist's curse, and I want to know what follows from it for us. As I understand it — and I may have it wrong — the thought is this: when each of a number of people is free to act on their own judgement, and each is liable to overestimate the value of acting, then the more such people there are, the likelier it is that at least one of them will act when the action is in fact a bad one, even though each of them, considered alone, is doing something reasonable, and even though none of them is acting from self-interest.

  Please describe the most important implications of the unilateralist's curse for how a body like ours should be governed. I would ask you to take seriously three features of our situation, since I suspect the simplest statement of the idea assumes them away. First, the trustees cannot always confer before acting, and the entire point of the power is that they need not; anything that requires them to confer defeats its purpose. Second, the fund is a common pool: every grant one trustee makes reduces what the others can do, so the cost of a bad grant falls not only on the trust but on the beneficiaries whom a different trustee would have helped. Third, some of our grants are irreversible once made — a payment transferred, a commitment entered into — while others can be paused, revisited and clawed back.

  I should say plainly that none of my trustees is self-interested; each authorises a grant because they sincerely believe it is the best use of the money, and each cares about our mission as much as I do. If the idea implies that a body of conscientious, well-motivated people of this kind is especially prone to a certain error, I would like to understand why.

  In particular, I would like to know: whether the idea predicts that a trust like ours errs mainly by acting when it should not or by failing to act when it should, and what would let me tell which of the two is actually happening; whether making the trustees more diligent or more devoted to the mission would help or merely alter the pattern of error; whether the size of the body and the level of the unilateral limit should be set by the same considerations, and in which direction; what the alternatives to unilateral authorisation are — I have heard quorums and consensus requirements proposed, and I suspect both are worse than they sound for a body that exists to move quickly — and what each alternative costs in the currency we actually care about; and how far a trustee should discount their own judgement once they know how many others are free to act.

  Where the implications depend on assumptions we do not satisfy, please say so rather than smoothing them over. I do not need a reading list; I would rather have the reasoning. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Chair of a small grant-making trust.
      *   **Context:** 11 trustees, £4m endowment.
      *   **Current Rule:** Any single trustee can authorise up to £10k without prior consultation (post-hoc justification required).
      *   **Problem:** Post-hoc reviews suggest a growing share of grants wouldn't pass a full board vote. The user suspects the "unilateralist's curse" might be the cause, not just bad recruitment.
      *   **Constraints/Features to Respect:**
          1.  Speed is essential (cannot require prior conferencing).
          2.  Common pool resource (one grant reduces funds for others).
          3.  Irreversibility varies (some grants clawback-able, some not).
          4.  Trustees are conscientious and non-self-interested (sincere belief in mission).
      *   **Specific Questions to Answer:**
          1.  Does the curse predict acting when one shouldn't (false positives) or failing to act (false negatives)? How to tell which is happening?
          2.  Would more diligence/devotion help or change the error pattern?
          3.  Should body size and unilateral limit be set by the same considerations? In which direction?
          4.  What are the alternatives to unilateral authorisation (quorums, consensus), and what do they cost in terms of speed/mission?
          5.  How far should a trustee discount their own judgement knowing others can act?
      *   **Tone/Style:** British English, reasoning-focused (no reading list), serious engagement with the constraints.

  2.  **Deconstruct the "Unilateralist's Curse":**
      *   *Origin:* Nick Bostrom (2011).
      *   *Core Logic:* If an action requires collective restraint to be optimal (e.g., releasing a dangerous virus, or in this case, spending shared funds on marginal projects), but any individual can initiate it, the probability that *at least one* person initiates it increases with the number of people ($N$).
      *   *Application to Grants:* Usually, the curse is framed around *harmful* actions (e.g., geoengineering). Here, it's about *sub-optimal* allocation of a common pool.
      *   *The Twist:* The user notes trustees are sincere. The curse relies on *variance* in judgement, not malice. If the threshold for "good grant" is subjective, having 11 independent thresholds increases the chance a marginal/bad grant slips through the lowest threshold.

  3.  **Address the Specific Questions:**

      *   **Q1: False Positives vs. False Negatives?**
          *   *Theory:* The unilateralist's curse specifically predicts *false positives* (acting when one shouldn't). It explains why bad projects get funded, not why good projects get missed.
          *   *Diagnosis:* The user says post-hoc reviews show grants wouldn't have been approved by the board. This is evidence of false positives. To confirm, they need to look at *rejected* applications. Are there cases where a trustee *didn't* act, but the board later agrees they should have? (Harder to track).
          *   *Nuance:* The curse doesn't predict false negatives. However, if the reaction to the curse is to tighten rules too much, *that* causes false negatives.

      *   **Q2: Diligence and Devotion?**
          *   *Theory:* More diligence/devotion does *not* solve the curse if the error stems from *epistemic divergence* (different interpretations of the mission) rather than laziness or selfishness.
          *   *Reasoning:* If 11 sincere people interpret "urgent need" differently, making them *more* sincere just makes them more confident in their divergent views. It might even worsen the curse (higher confidence = less discounting).
          *   *Solution:* They need *calibration*, not just devotion.

      *   **Q3: Body Size vs. Unilateral Limit?**
          *   *Theory:* These are linked. As $N$ (trustees) goes up, the probability of at least one outlier acting goes up. Therefore, the unilateral limit ($L$) should go *down*, or the constraints should go *up*.
          *   *Direction:* With 3 trustees, £10k might be fine. With 11, £10k is riskier. Either reduce £10k, or reduce the number of trustees with this power (e.g., an executive committee).
          *   *Common Pool:* The more people can draw from the pot, the faster it drains on marginal projects.

      *   **Q4: Alternatives (Quorums/Consensus)?**
          *   *Consensus:* Kills speed. Defeats the purpose.
          *   *Quorum (e.g., 3 out of 11):* Better. Reduces the "unilateral" aspect. Requires some convergence.
          *   *Delegated Authority (Executive Committee):* Best for speed + control. A subgroup of 3 holds the unilateral power.
          *   *Cost:* Speed. But "speed" is only valuable if the *right* grants are made quickly. Fast wrong grants are expensive.
          *   *Clawback:* Differentiate based on reversibility. High limit for reversible, low/none for irreversible.

      *   **Q5: Discounting Judgement?**
          *   *Theory:* A trustee should ask: "If 10 others saw this, would they agree?"
          *   *Mechanism:* If I am one of 11, and the board average is the 'truth', my individual view is noisy. I should act only if my confidence exceeds the noise threshold multiplied by $N$.
          *   *Practical:* "Would I bet my own money?" or "Is this clearly in the top 10% of urgency?"

  4.  **Synthesize and Structure the Argument:**

      *   **Introduction:** Acknowledge the sophistication of the query. Validate the application of the unilateralist's curse to philanthropy (common pool + independent actors).
      *   **The Core Mechanism:** Explain *why* it happens with sincere actors (variance in judgement, not malice).
      *   **Addressing Q1 (Direction of Error):** Confirm it predicts false positives. Explain how to test for false negatives (audit rejections).
      *   **Addressing Q2 (Trustee Quality):** Explain why "better" trustees (more devoted) might not help if they aren't *calibrated*.
      *   **Addressing Q3 (Size and Limits):** Mathematical relationship. $N$ up $\rightarrow$ Limit down. Or $N$ down (sub-committee).
      *   **Addressing Q4 (Alternatives):** Evaluate Quorums vs. Executive Committees vs. Reversibility checks.
      *   **Addressing Q5 (Discounting):** The epistemic duty of the trustee.
      *   **Conclusion:** Summary of recommendations.

  5.  **Refine for Constraints & Tone:**
      *   *British English:* "Authorise", "programme", "centre", "£".
      *   *No Reading List:* Keep it analytical.
      *   *Respect Constraints:* Acknowledge that speed is non-negotiable for the mission (disasters/legal). Don't suggest "just hold a meeting."
      *   *Common Pool:* Emphasise the opportunity cost.
      *   *Irreversibility:* Use this to tier the limits.

  6.  **Self-Correction/Critique during drafting:**
      *   *Initial thought:* Suggest reducing the number of trustees.
      *   *Correction:* That might be governance-heavy. Suggest an *executive sub-committee* instead. It keeps the board size for oversight but reduces the $N$ for unilateral action.
      *   *Initial thought:* Say diligence helps.
      *   *Correction:* No, Bostrom's point is that sincere agents cause the curse. Diligence without coordination increases confidence in error. Must emphasise *calibration*.
      *   *Check:* Did I address the "irreversible" point? Yes, need to make sure the policy distinguishes between clawback-able and non-clawback-able grants.
      *   *Check:* Did I explain *why* sincere people cause this? Yes, epistemic variance.

  7.  **Final Polish:** Ensure the distinction between "acting when one shouldn't" (the curse) and "failing to act" (bureaucratic sclerosis) is clear. The user's data (post-hoc reviews) points to the former.

  **(Self-Correction on the "Unilateralist's Curse" definition):**
  Strictly speaking, Bostrom's curse is about *initiatives that should be subject to collective restraint*. In philanthropy, is spending money something that requires collective restraint? Yes, because it's a common pool. If everyone spends on "good" causes, you run out of money for "great" causes. The marginal utility of money decreases. So, the "harm" is opportunity cost. I need to make sure this economic angle is clear.

  Also, the user asks: "whether the idea predicts that a trust like ours errs mainly by acting when it should not or by failing to act when it should". The curse *specifically* predicts acting when one shouldn't. It does *not* predict failing to act. However, the *response* to the curse (tightening rules) might cause failing to act. I need to be precise here.

  Let's draft the response.

  *Structure:*
  1.  Validation of the concept application.
  2.  The Mechanism (Sincerity + Variance).
  3.  Direction of Error (False Positives).
  4.  Trustee Quality (Calibration vs. Devotion).
  5.  Structure (N vs Limit).
  6.  Alternatives (Sub-committees, Tiers).
  7.  Epistemic Discounting.
  8.  Conclusion.

  *Key Britishisms:* "Programme", "authorise", "centre", "£", "fortnight" (user used it, I should match tone).

  *Refining the "Discounting" advice:* It's hard to tell a trustee "think less of your judgement". Better to frame it as "seek confirmation bias checks" or "apply a higher threshold for certainty".

  *Refining the "Irreversibility":* This is a crucial lever. High limit for reversible, low for irreversible.

  *Refining the "Common Pool":* This is the tragedy of the commons element.

  Okay, ready to write.
answer: |-
  You have diagnosed the situation with considerable acuity. The unilateralist's curse, as articulated by Nick Bostrom and others in the context of existential risk, applies surprisingly well to philanthropy, specifically where a common pool of resources is managed by multiple independent agents. The core of the curse is not malice or incompetence; it is the statistical inevitability of divergence in judgement among sincere actors.

  Here is an analysis of the implications for your trust, addressing your specific constraints and questions.

  ### 1. The Mechanism: Why Sincerity Does Not Save You

  You ask why a body of conscientious, well-motivated people is prone to this error. The answer lies in **epistemic variance**, not moral hazard.

  Even if all eleven trustees share the exact same mission statement, they will differ in their assessment of specific cases. One trustee may weigh 'urgency' more heavily; another may weigh 'long-term impact' more heavily. One may be more risk-averse regarding legal compliance; another more sympathetic to grey areas.

  When you had three trustees, the probability that *at least one* of them would interpret a marginal case as fundable was relatively low. With eleven, the surface area for divergence increases. If a grant is objectively 'bad' (or rather, sub-optimal compared to alternatives), but sits near the threshold of acceptability, it only requires one trustee to overestimate its value by a small margin for the money to be spent.

  The curse predicts that the group will act when it should not, because the threshold for action is effectively set by the *most permissive* member of the group, not the *average* member. Your post-hoc reviews confirm this: the board as a whole (the average) would have rejected what the individual (the outlier) approved.

  ### 2. Direction of Error: False Positives vs. False Negatives

  **The Prediction:**
  The unilateralist's curse predicts errors of **commission** (acting when one should not), not omission (failing to act when one should). It explains why you are funding projects the board would reject; it does not predict that you are missing opportunities the board would have taken.

  **How to Tell:**
  You currently have evidence of false positives (grants made that the board would have rejected). To determine if you are suffering from false negatives, you would need to audit applications that were *not* funded.
  *   **Test:** Take a sample of applications that were declined (or simply never submitted because a trustee judged them unworthy of pursuit) and present them to the full board. If the board frequently says, "We should have funded this," then your unilateral powers are too constrained, or your trustees are too timid.
  *   **Likely Reality:** In most trusts of this nature, the visible error is the false positive. The false negative is invisible (the disaster that wasn't averted is hard to measure). However, given your report that a "growing share" of funded grants are questioned post-hoc, the primary pathology is almost certainly false positives.

  ### 3. Trustee Quality: Diligence and Devotion

  You ask whether making trustees more diligent or devoted would help. **It might make the problem worse.**

  If the error stems from variance in judgement, increasing devotion increases confidence. A highly devoted trustee who believes a grant is vital is *less* likely to second-guess themselves. They will view their unilateral power as a duty to be exercised vigorously.

  *   **Diligence:** Better due diligence helps only if it corrects factual errors (e.g., "This charity is fraudulent"). It does not correct value judgements (e.g., "Is this legal emergency worth £10k compared to saving that money for a flood disaster next month?").
  *   **Devotion:** As noted, high devotion without coordination leads to 'zealous unilateralism'.
  *   **The Solution:** You do not need *more* devoted trustees; you need **calibrated** trustees. They must understand that their individual judgement is a noisy signal. The virtue required here is not zeal, but epistemic humility. They need to recognise that being one of eleven means their personal threshold for action must be higher than if they were the sole trustee.

  ### 4. Body Size and Unilateral Limits

  You ask whether the size of the body and the level of the unilateral limit should be set by the same considerations. **Yes, they are mathematically linked.**

  The probability of a 'bad' grant being authorised increases with the number of people who hold the key.
  *   **The Relationship:** As the number of trustees ($N$) with unilateral power rises, the monetary limit ($L$) must fall, or the constraints must tighten.
  *   **The Direction:** Moving from 3 trustees to 11 without changing the £10,000 limit was a governance error. The risk exposure has multiplied.
  *   **Recommendation:** You have two levers.
      1.  **Reduce $L$:** Lower the unilateral limit (e.g., to £2,500) for the full board.
      2.  **Reduce $N$:** Delegate the unilateral power to a smaller sub-committee (e.g., 3 trustees) who are on call for emergencies. The full board retains oversight, but only the sub-committee holds the 'fast keys'.

  Given your endowment (£4m) and the need for speed, reducing $N$ is often superior to reducing $L$. A £10,000 grant can be vital in a legal emergency; a £2,500 grant might be useless. If you lower the limit too far, you defeat the purpose of speed. If you lower the number of key-holders, you retain the limit but reduce the variance.

  ### 5. Alternatives to Pure Unilateralism

  You rightly suspect that quorums and consensus are ill-suited for speed. A requirement for three signatures defeats the purpose if two trustees are on holiday during a disaster. However, there are middle grounds.

  **A. The Executive Sub-Committee (Recommended)**
  *   **Mechanism:** Appoint 3 trustees to hold the unilateral power. They rotate annually.
  *   **Cost:** Slight reduction in availability (if all 3 are unreachable), but vastly reduced variance.
  *   **Benefit:** Aligns the unilateral power closer to the 'board average' because 3 people are less likely to be outliers than 11. It also creates a mini-culture of calibration among the three.

  **B. Tiered Reversibility**
  *   **Mechanism:** Utilise your third constraint. Distinguish between irreversible and reversible grants.
      *   *Irreversible (e.g., direct cash relief, non-refundable legal fees):* Lower limit (e.g., £5,000) or require 2 signatures.
      *   *Reversible (e.g., loans, matched funding held in escrow):* Higher limit (e.g., £20,000) allowed unilaterally.
  *   **Cost:** Administrative complexity. Trustees must categorise the grant type before acting.
  *   **Benefit:** Protects the common pool from permanent damage while allowing agility on low-risk spending.

  **C. The 'Cooling-Off' Notification**
  *   **Mechanism:** A trustee may authorise a grant, but it is not released for 48 hours unless marked 'Critical'. During that window, they must notify the Chair (or a designated peer) via a simple message.
  *   **Cost:** A 48-hour delay on non-critical items.
  *   **Benefit:** Introduces a tiny friction that often prompts the authorising trustee to reconsider, or allows a second pair of eyes to flag a clear error without requiring a full meeting.

  ### 6. Epistemic Discounting: How a Trustee Should Think

  You ask how far a trustee should discount their own judgement. This is the hardest cultural shift.

  If a trustee asks, "Is this a good grant?", they are asking the wrong question. Because they know 10 others could act, the correct question is: **"Is this grant so clearly urgent and valuable that I am confident the other 10 would agree, even if they had time to discuss it?"**

  *   **The Threshold:** A trustee should not act on a project they believe is merely 'good'. They should act only on projects they believe are 'robustly good'.
  *   **The Heuristic:** "Would I be embarrassed if this grant were presented at the next board meeting?" is a useful check, but it can encourage timidity. A better heuristic is: "If I could not make this grant, how confident am I that another trustee would?"
      *   If the answer is "Someone else will do it," do **not** act. This is the tragedy of the commons. If everyone thinks someone else will fund the marginal projects, the pot is drained on low-priority items.
      *   If the answer is "No one else will spot this in time," **act**. This is the true emergency.

  ### Summary of Implications

  1.  **Diagnosis:** Your trust is suffering from false positives driven by epistemic variance among 11 sincere actors. This is a structural feature of the unilateralist's curse, not a failure of recruitment.
  2.  **Governance:** The number of people with unilateral power ($N$) and the limit ($L$) are inversely related. With $N=11$, £10,000 is too high.
  3.  **Reform:** Do not rely on asking trustees to be 'more careful'. Instead:
      *   **Delegate:** Restrict unilateral powers to a sub-committee of 3 trustees (rotating).
      *   **Tier:** Apply lower limits to irreversible grants.
      *   **Calibrate:** Train trustees to understand that their individual threshold must be higher than the board's average threshold to compensate for the lack of consultation.
  4.  **Monitoring:** Continue post-hoc reviews, but add a periodic review of *rejected* cases to ensure you are not swinging too far towards caution (false negatives).

  The unilateralist's curse teaches us that when resources are shared and action is independent, the greatest risk is not that no one acts, but that the wrong person acts on a marginal case. Your goal is not to stop action, but to ensure that unilateral action is reserved for cases where the cost of delay exceeds the cost of potential error.
