  The marble hall resounds with viols sweet,
  the floor is mud.
  Where velvet cushions bow beneath our feet,
  you drink the flood.
  A perfect cadence makes the song complete.

  The silk is soft against the palm of hand,
  my shirt is rough.
  I walk across the measured plot of land,
  enough is enough.
  The light is less.

  Now I am standing here in dust with you,
  dust is dry.
  The sky is gray and open to the sight,
  no more fly.
  We look around.

  we are all down here now.
  the spire is gone.
  there is no high or low to allow.
  nothing to tell.
  it is level.

