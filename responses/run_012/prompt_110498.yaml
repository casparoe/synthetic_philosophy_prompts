      *Wait, one more thing:* The user says "Socialism is the better social order." This sounds like an external claim. If they treat it as an internal claim (within the framework of 'rational satisfaction of needs'), it works.
      *   *Repair Cost:* You can't convince someone who doesn't share the framework goals. You lose universal moral leverage.

      *Let's finalize the "Single Move".* It's **The Internal/External Distinction applied to Political Economy.**
      *   External: Should we plan? (Pragmatic, no truth value).
      *   Internal: Given we plan, is central planning efficient? (Scientific, truth-apt).
      *   This saves (1), (2), (3), and modifies (4) to be defensible.

