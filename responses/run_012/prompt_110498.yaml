          *   *Diagnosis:* This is the biggest hole. You can't have radical framework pluralism and non-cognitivism *and* assert a substantive political truth without qualifying it. If "better" is just an attitude (2), then (4) is just you shouting your preference. If (4) is a scientific conclusion (3), it contradicts (2).
