      *   *Check:* Did I address the calculation objection nuance? Yes, distinguish between principled impossibility and engineering difficulty.

  7.  **Final Polish:** Ensure the distinction between "internal" and "external" questions (Carnapian concept, but applied to the user's logic without attributing it as historical exegesis) is clear in the "Single Move" section. Actually, better to frame it as "Framework Relativism" to stay true to the prompt's constraint about not lecturing on Carnap history. I will use the concept of *internal validity* vs *external adoption*.

      *Self-Correction on "Single Move":* The most powerful move is to distinguish between *choosing a framework* (pragmatic/volitional) and *working within a framework* (scientific/cognitive). This solves the tension between "no fact of the matter" (1) and "Socialism is better" (4). Socialism is "better" *internal* to the framework of "maximizing human welfare via rational planning," but adopting that framework is a practical decision.

      *Wait, looking closer at (2):* (2) says ethical judgments aren't T/F. (4) says Socialism is "better." If "better" is ethical, (4) contradicts (2). If "better" is technical (efficiency), it fits (3). The repair needs to force (4) to be technical, not ethical.

