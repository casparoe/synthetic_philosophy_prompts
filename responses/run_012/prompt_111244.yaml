answer: |-
  The distinction between character and habit in Anglo-American evidence law (codified in the U.S. as Federal Rules of Evidence 404 and 406) is one of the most philosophically rich features of the legal system. It appears to map neatly onto the debate between virtue ethics (robust character) and situationism (context-dependent behavior). However, a closer examination reveals that the law's commitment to situationist psychology is shallower than it appears. The distinction is driven less by a metaphysical theory of personality and more by a pragmatic theory of *inferential risk* and *moral agency*.

  Here is a reconstruction of the implicit theory of character required by the practice, an analysis of the apparent inconsistencies, and a consideration of how the system would shift under a different psychological paradigm.

  ### 1. The Implicit Theory: Specificity vs. Generality

  The character/habit distinction presupposes a taxonomy of dispositions based on **granularity** and **automaticity**.

  *   **Character** is treated as a broad, evaluative summary of a person's moral or psychological makeup (e.g., "violent," "honest"). The law assumes these traits are *probabilistic* but *noisy*. They suggest a tendency, but they leave room for choice and contextual variation.
  *   **Habit** is treated as a narrow, non-evaluative, semi-automatic response to a specific stimulus (e.g., "always brakes at this intersection," "always signs checks with a stamp"). The law assumes these are *deterministic* or near-deterministic. They bypass deliberation.

  **Does this commit the law to Situationism?**
  Superficially, yes. It aligns with the situationist claim (advanced by philosophers like John Doris and Gilbert Harman) that global traits are poor predictors of behavior compared to situational specifics. By barring character evidence, the law seems to say, "Knowing someone is 'careless' tells us little about whether they were careless *this time*." By admitting habit evidence, it says, "Knowing someone *always* does X in situation Y tells us they did X *this time*."

  **However, this is accommodation, not presupposition.**
  The law does not exclude character evidence because it believes character *fails* to predict conduct. Often, the exclusion happens precisely because character evidence is *too* persuasive. The "propensity inference" (he is a bad person, therefore he did it) is viewed as cognitively overwhelming. If the law truly believed character had *no* predictive power, it would exclude it as irrelevant (Rule 401). Instead, it excludes it as *prejudicial* (Rule 403).

  Therefore, the practice does not strictly presuppose situationism. It presupposes that **the link between character and conduct is morally mediated, whereas the link between habit and conduct is mechanically mediated.**
  *   **Character** implies a capacity for choice. To argue from character to conduct is to argue that a person's past choices determine their present choice. The law rejects this to preserve the notion of free will in the courtroom.
  *   **Habit** implies a reduction of choice. To argue from habit is to argue that the person acted almost reflexively. The law accepts this because it treats the actor more like a physical system than a moral agent in that specific instance.

  ### 2. Epistemic and Normative Defenses Without Psychology

  You ask if the exclusion could be defended with no commitment at all about the predictive power of traits. The answer is yes. The ban on character evidence rests on two pillars that are independent of psychological realism:

  1.  **Normative Fairness (The "Act" Principle):** Liberal criminal law is committed to punishing acts (*actus reus*), not persons. To convict someone because they are "the kind of person who does this" violates the principle that liability must attach to the specific event. This is a deontological constraint, not an epistemic one. Even if "violent character" predicted "violent act" with 90% accuracy, a liberal legal system might still exclude it to prevent the trial from becoming an inquisition into the soul rather than an inquiry into the event.
  2.  **Epistemic Management (Jury Psychology):** This is the "over-weighting" concern. Legal theorists worry that jurors suffer from the "fundamental attribution error" in reverse: they may treat a character trait as dispositive, ignoring exculpatory situational evidence. If a juror hears the defendant is "dishonest," they may stop listening to the alibi. This is a claim about *juror cognition*, not *human nature*. It assumes jurors are bad Bayesians, not that character traits are non-existent.

  **Which parts strictly presuppose situationism?**
  Only the *comparative reliability* assertion implicit in Rule 406. By admitting habit but not character, the law asserts that specific, repeated responses are *more probative* than general dispositions. This is an empirical claim about human behavior that aligns with situationism. However, it is a weak commitment; it only requires that habits are *more* reliable than traits, not that traits are *un*reliable. A robust trait theorist could agree that a specific habit is a better predictor than a general trait without abandoning virtue ethics.

  ### 3. Resolving the Inconsistency: Character as Element vs. Character as Propensity

  The tension you identify—that character is ignored at the guilt phase but scrutinized at sentencing or in civil claims—is not a contradiction. It is a functional distinction between **liability** and **consequence**.

  *   **Liability (Guilt/Defamation):** Here, the question is "Did this event happen as alleged?" The law isolates the event to protect the defendant's right to be judged on the specific evidence. In defamation, character is the *injury* (damage to reputation), not a *proxy for conduct*. In negligent entrustment, the character (competence) is the *risk being managed*, not a proxy for a specific past act.
  *   **Sentencing:** Here, the question shifts from "Did they do it?" to "What do we do with them?" Sentencing theories (incapacitation, rehabilitation) are explicitly forward-looking and actor-focused. To assess future danger or rehabilitative potential, the court *must* treat character as a real, stable property.

  **Does the practice hold together?**
  Yes, because it reflects a dual theory of justice. Retributive justice (guilt) requires atomism (this act, this time). Utilitarian/Preventive justice (sentencing) requires holism (this person, over time). The law toggles between these modes. It does not deny character exists during the trial; it merely handcuffs the fact-finder from using it as a shortcut to establish the elements of the crime.

  ### 4. Counterfactual: A Full-Blooded Global-Trait Conception

  Suppose we replaced the current implicit psychology with a robust, Aristotelian virtue ethics where character traits are highly stable, cross-situational, and strongly predictive of conduct.

  **What would change?**
  1.  **Collapse of the Propensity Ban:** If character traits were known to predict conduct with high reliability (say, comparable to habit), the epistemic justification for Rule 404 would vanish. Excluding such evidence would be excluding highly relevant truth. The "prejudice" argument would remain (normative fairness), but the pressure to admit the evidence would be immense. We might see a shift toward a "character court" model, where liability is partially based on moral standing.
  2.  **Habit Would Survive, But Diminish:** The category of habit would not disappear, but its distinctiveness would blur. If character is robust, the line between "he is a careless person" (character) and "he always fails to signal" (habit) becomes a difference of degree, not kind. However, habit would retain a niche regarding **automaticity**. Even a robust trait theorist admits that virtues involve deliberation, whereas habits are mechanistic. Evidence of mechanistic response is still epistemically superior to evidence of deliberative disposition.
  3.  **Sentencing and Liability Merge:** If character reliably issues in conduct, the moral distinction between punishing the act and punishing the actor weakens. If being a "thief" makes it 95% likely you stole the item, proving you are a "thief" becomes nearly equivalent to proving you stole the item. The legal system would likely become more inquisitorial regarding the defendant's life history during the guilt phase.

  ### Conclusion

  The character/habit distinction does not commit the law to situationism in the philosophical sense. It does not deny the existence of robust character traits. Rather, it treats character as **normatively toxic** and **epistemically risky** in the context of determining liability.

  The law presupposes that **habit is mechanistic** and **character is agential**. It admits evidence of the former because it suggests the action happened without choice (making the inference reliable and morally neutral). It excludes evidence of the latter because it suggests the action happened *because* of a moral failing (making the inference prejudicial and morally loaded).

  The apparent inconsistency regarding sentencing and civil elements is resolved by recognizing that the law operates with two different ontologies: the **atomistic agent** for the purpose of establishing blame, and the **holistic person** for the purpose of managing risk and repairing reputation. The system holds together not because it has solved the philosophical problem of character, but because it pragmatically partitions the problem to serve different legal functions. If we adopted a global-trait conception, the partition would crack, forcing a choice between a more efficient truth-finding process and a fairer, act-focused conception of justice. Currently, the law chooses fairness over efficiency, masking the choice as a psychological distinction between habit and character.
