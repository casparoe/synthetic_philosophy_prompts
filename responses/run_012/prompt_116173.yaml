  # Tutorial Handout: The Demandingness Decision Tree

  **Instructions:** Start at the top. Answer the question based on your intuitive verdict on the case provided. Follow the branch that matches your claim. Continue until you reach a leaf. The leaf identifies the ethical position you hold, along with its most awkward commitment.

  ***

  ### 1. The Requirement Question
  **Case:** You are choosing between a restaurant dinner for yourself and a donation that would save a life.
  **Question:** Does morality issue a binding requirement to donate, or does it merely say donating is *better*?
  *   **Branch A:** Morality only ranks outcomes as better or worse; there is no binding "ought."
      *   **Leaf: Scalar View.** *Awkward Commitment:* You must admit there is no point where a agent is morally forbidden from choosing the dinner, even if the need is great.
  *   **Branch B:** Morality issues binding requirements governing what you must do.
      *   *(Go to Node 2)*

  ### 2. The Ceiling Question
  **Case:** A stranger will die without your spare kidney.
  **Question:** Is there any level of sacrifice beyond which morality stops asking, or is the demand always "as much as you can"?
  *   **Branch A:** There is no limit; the demand continues as long as you can give more.
      *   *(Go to Node 3)*
  *   **Branch B:** There is a limit; morality leaves the agent a protected sphere of discretion.
      *   *(Go to Node 4)*

  ### 3. The Attitude Question
  **Case:** A choice between a lucrative career and a vocation that helps no one.
  **Question:** Is the fact that this view demands you sacrifice your career a fatal flaw, a neutral fact, or a virtue?
  *   **Branch A:** The demand is correct and a positive feature of morality.
      *   **Leaf: Unlimited Maximizing View.** *Awkward Commitment:* You must hold that an agent is morally required to ruin their own life projects if it produces slightly more good elsewhere.
  *   **Branch B:** The demand is correct but carries no weight in choosing between theories.
      *   **Leaf: Skeptic's View.** *Awkward Commitment:* You must admit your theory asks the impossible of most people while denying this counts against its truth.

  ### 4. The Baseline Question
  **Case:** A person who gives nothing, ever, lives next door to you.
  **Question:** Do you owe only your fair share, or must you cover the shortfall of others?
  *   **Branch A:** Each of us owes a fair share and no more; the shortfall of others does not land on you.
      *   **Leaf: Fair-Share View.** *Awkward Commitment:* You must accept that if others fail to comply, the stranger dies even though you could have saved them at a reasonable cost.
  *   **Branch B:** The need is absolute; you must cover the shortfall if you can.
      *   *(Go to Node 5)*

  ### 5. The Object Question
  **Case:** Partiality toward one's own child.
  **Question:** Do requirements apply to individual acts directly, or to the shape of a whole life via rules?
  *   **Branch A:** Requirements apply to rules or life-shape, which may allow partiality even if specific acts don't maximize.
      *   **Leaf: Two-Level or Rule-Based View.** *Awkward Commitment:* You must explain why it is right to follow a rule that you know will produce a worse outcome in a specific case.
  *   **Branch B:** Requirements apply to individual acts directly.
      *   *(Go to Node 6)*

  ### 6. The Demand Profile Question
  **Case:** A person who has already given a great deal wonders whether the demand resets.
  **Question:** Must you produce the *best* outcome up to the limit, or merely a *good enough* one?
  *   **Branch A:** Morality requires a good-enough outcome, not necessarily the best.
      *   **Leaf: Satisficing View.** *Awkward Commitment:* You must defend the claim that it can be permissible to produce a worse outcome when a better one was available at no extra cost.
  *   **Branch B:** Morality requires the best outcome up to the limit.
      *   *(Go to Node 7)*

  ### 7. The Source Question
  **Case:** A choice between a lucrative career and a vocation.
  **Question:** Is the limit set by the agent's own discretion, or by an objective principle?
  *   **Branch A:** The limit is up to the agent to decide; duty has built-in latitude.
      *   **Leaf: View of Duty with Built-in Latitude.** *Awkward Commitment:* You must accept that two agents in identical circumstances may have different moral requirements based solely on their personal choices.
  *   **Branch B:** The limit is set by an objective principle.
      *   *(Go to Node 8)*

  ### 8. The Enforcement Question
  **Case:** A person who has already given a great deal.
  **Question:** Does the ceiling on what is required coincide with the ceiling on what is blameworthy?
  *   **Branch A:** No; you ought to give more, but are not at fault for stopping (or vice versa).
      *   **Leaf: Hybrid View.** *Awkward Commitment:* You must maintain a distinction between what an agent is required to do and what they can be blamed for not doing, which risks making "ought" inert.
  *   **Branch B:** Yes; if you aren't required to do it, you aren't blameworthy for skipping it.
      *   *(Go to Node 9)*

  ### 9. The Trigger Question
  **Case:** A spare kidney and a stranger who will die without it.
  **Question:** Do normal constraints hold unless catastrophe strikes, or do costs matter in normal life?
  *   **Branch A:** Constraints hold until catastrophe and then give way.
      *   **Leaf: Threshold View.** *Awkward Commitment:* You must defend a sharp distinction between "catastrophe" and "severe need," where the moral requirement jumps discontinuously.
  *   **Branch B:** Costs matter in normal life; the demand is sensitive to burden.
      *   *(Go to Node 10)*

  ### 10. The Basis Question
  **Case:** A restaurant dinner weighed against a donation.
  **Question:** What blocks the demand: reasonable rejection, integrity, or efficiency?
  *   **Branch A:** The burden a principle places on the agent can block it if no one could reasonably object to bearing it.
      *   **Leaf: Reasonable-Rejection View.** *Awkward Commitment:* You must allow that an agent's refusal to save a life can be justified simply because they find the burden too great, regardless of the outcome.
  *   **Branch B:** The limit depends on the cost to the agent's integrity or the outcome efficiency.
      *   *(Go to Node 11)*

  ### 11. The Integrity Question
  **Case:** A choice between a lucrative career and a vocation.
  **Question:** Does the limit protect the agent's integrity or the marginal cost-benefit balance?
  *   **Branch A:** The demand is not merely large but corrosive of a good life; integrity blocks it.
      *   **Leaf: Moral-Saint Critique.** *Awkward Commitment:* You must claim that morality itself is flawed if it requires actions that undermine the agent's personal integrity or ground projects.
  *   **Branch B:** The limit is a fixed level of cost you can bear relative to the gain.
      *   **Leaf: Maximizing View with Cost-Sensitive Threshold.** *Awkward Commitment:* You must accept that there is a precise point where a small increase in cost to you outweighs a large benefit to others, stopping the requirement.

  ***

  ### Notes on Classification

  **Indistinguishable Leaves:**
  The tree cannot separate the **Moral-Saint Critique** and the **Maximizing View with Cost-Sensitive Threshold** by verdicts on cases alone, as both may permit keeping the dinner in Node 11. They are separated instead by *justification*: the Saint Critique cites the *corrosive nature* of the demand on the good life, while the Cost-Threshold view cites a *balance of burdens*.

  **Empty Combinations:**
  There is no occupant for the combination of **Scalar View** + **Binding Requirement**. This is incoherent by definition (Node 1). There is also no occupant for **Fair-Share View** + **No Limit** (Node 2/4 conflict), as a fair-share view inherently implies a ceiling on what one owes regardless of total need.

  **Confidence Assessment:**
  I am **moderately confident** (approx. 85%) that this tree is complete and correctly wired for a seminar context. The wiring correctly separates the major normative distinctions (ceiling, baseline, object, enforcement) and places the required leaves in logically consistent positions.

  **Least Certain Classification:**
  I am least sure about the placement of the **Hybrid View** at Node 8. Some hybrid theories might locate the "mismatch" between ought and blame at the *Source* level (Node 7) rather than Enforcement, arguing that the agent has discretion (Latitude) but the principle remains maximizing. To settle this, one would need to determine whether the Hybrid theorist grants the *agent* the power to set the limit (Latitude) or merely grants them *immunity from blame* for failing to meet an objective limit (Enforcement). The current tree assumes the latter.
