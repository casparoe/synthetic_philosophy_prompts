answer: |-
  # Welfare & Ethics: A Diagnostic Tree
  **Graduate Seminar Handout | 15-Minute Exercise**

  **The Test Cases**
  *Keep these in mind as you answer. Your intuitions here drive your path.*
  1.  **Pain vs. Boredom:** A person in chronic pain vs. a bored person whose preferences are equally satisfied. Is the first person *objectively* worse off, or only relative to a specific theory of value?
  2.  **Adapted Deprivation:** A person content in deprived conditions vs. a miserable person objectively better off. Do we compare their reported states or their objective conditions?
  3.  **Preference vs. Felt Life:** Two people with identical preference-satisfaction scores but plainly unequal felt lives. Is there a common measure that captures the difference?

  ---

  ### The Decision Tree

  **Node 1: Truth-Aptness**
  Is the sentence *"Person A is worse off than Person B"* capable of being **true or false** independent of our ethical rules (a fact to be discovered), or is it a **normative stipulation** we impose to make social choice possible?
  *   **Stipulation** $\rightarrow$ Go to **Leaf A**.
  *   **Fact** $\rightarrow$ Go to Node 2.

  **Node 2: Grounding**
  If it is a fact, does this comparison require fixing a specific **conception of the good** first (e.g., "true only if we agree pleasure matters"), or is there a **neutral common measure** available across conceptions?
  *   **Conception-Dependent** $\rightarrow$ Go to **Leaf B**.
  *   **Neutral Measure** $\rightarrow$ Go to Node 3.

  **Node 3: The Metric**
  Using this neutral measure, do we compare **well-being states directly** (feelings, preferences), or do we abandon well-being comparison in favor of a **measurable proxy** (resources, capabilities)?
  *   **Proxy (Resources/Capabilities)** $\rightarrow$ Go to **Leaf C**.
  *   **Direct Well-being** $\rightarrow$ Go to Node 4.

  **Node 4: Levels vs. Units**
  To judge who is worse off (**Level**), must we measure how much a unit of good improves their life (**Unit**)? Or can we compare Levels *without* comparing Units?
  *   **Levels without Units** $\rightarrow$ Go to **Leaf D**.
  *   **Units Required/Possible** $\rightarrow$ Go to Node 5.

  **Node 5: Asymmetry**
  If Units are comparable, are **Levels** also comparable? (Can you know how much a dollar helps A vs. B without knowing who is richer?)
  *   **Units Yes, Levels No** $\rightarrow$ Go to **Leaf E**.
  *   **Units Yes, Levels Yes** $\rightarrow$ Go to Node 6.

  **Node 6: Scope**
  Is this comparability **universal** (all pairs of people can be compared), or **partial** (some pairs are comparable, others are not)?
  *   **Partial** $\rightarrow$ Go to **Leaf F**.
  *   **Full** $\rightarrow$ Go to **Leaf G**.

  ---

  ### The Leaves (Positions)

  *   **Leaf A: Ethical Stipulation.** Comparisons are not truth-apt; they are rules we adopt.
      *   *Awkward Commitment:* You must admit your priority for the worst-off is a choice, not a discovery.
  *   **Leaf B: Conception-Dependent.** Comparisons are factual only within a fixed theory of the good.
      *   *Awkward Commitment:* You cannot adjudicate well-being conflicts between people with different conceptions of the good.
  *   **Leaf C: Resourcist/Capability Proxy.** We compare means (resources) rather than ends (well-being).
      *   *Awkward Commitment:* You must treat the "Adapted Deprivation" case as equal, ignoring the contented person's lower well-being.
  *   **Leaf D: Ordinal Level-Comparability.** We can rank who is worse off, but not by how much (no unit comparison).
      *   *Awkward Commitment:* You cannot weigh the intensity of "Pain vs. Boredom," only the rank.
  *   **Leaf E: Unit-Only Comparability.** We can compare marginal gains, but not baseline levels. *(Unnamed/Rare)*
      *   *Awkward Commitment:* You can measure the value of a cure, but cannot identify who is sick.
  *   **Leaf F: Partial Cardinal Comparability.** Full measurement is possible, but only for some pairs.
      *   *Awkward Commitment:* Social choice rules may become intransitive (A > B, B > C, but A ? C).
  *   **Leaf G: Full Cardinal Comparability.** Levels and units are comparable on a common scale for everyone.
      *   *Awkward Commitment:* You must defend the metaphysical reality of interpersonally identical utility units.

  ---

  ### Diagnostics & Limitations

  **1. The Empty Corner: Partial Ordinal Comparability**
  *   **Location:** The path *Node 4 (Levels without Units)* $\rightarrow$ *Node 6 (Partial)*.
  *   **Diagnosis:** This tree sends all Ordinalists to **Leaf D** without asking about Scope. A view where *levels* are comparable for *some* pairs but not others (without unit comparison) is logically coherent but largely unexplored. It is likely empty because if one accepts the metaphysics for level-comparison in some cases, the pressure to generalize to all cases (or switch to resources) is high.

  **2. Indistinguishable Leaves: A vs. B**
  *   **The Issue:** The tree cannot cleanly separate **Leaf A (Ethical Stipulation)** from **Leaf B (Conception-Dependent)**.
  *   **Why:** If truth is only available *within* a conception (Leaf B), then for the seminar as a whole, treating comparisons as facts functions identically to stipulating a rule (Leaf A). The tree forces a choice at Node 1 (Fact vs. Stipulation) that the underlying debate does not settle: is a "local fact" a fact at all?

  ---

  ### Scoring Note

  **How to use this:**
  Answer the six nodes sequentially. Your path determines your leaf.
  *   **Q1 No** $\rightarrow$ **Leaf A**
  *   **Q1 Yes, Q2 No** $\rightarrow$ **Leaf B**
  *   **Q1 Yes, Q2 Yes, Q3 No** $\rightarrow$ **Leaf C**
  *   **Q1 Yes, Q2 Yes, Q3 Yes, Q4 No** $\rightarrow$ **Leaf D**
  *   **Q1 Yes, Q2 Yes, Q3 Yes, Q4 Yes, Q5 No** $\rightarrow$ **Leaf E**
  *   **Q1 Yes, Q2 Yes, Q3 Yes, Q4 Yes, Q5 Yes, Q6 No** $\rightarrow$ **Leaf F**
  *   **Q1 Yes, Q2 Yes, Q3 Yes, Q4 Yes, Q5 Yes, Q6 Yes** $\rightarrow$ **Leaf G**

  **Check your awkward commitment:** If the sentence under your assigned leaf feels unacceptable, re-examine the Node where you branched off. That is the precise point of theoretical tension you need to resolve before the next seminar.
