      *   **The "Unenjoyable" Rejection Analysis:** Explain *why* Case 1 was rejected (it replaces risk modeling with numerology) and what would change it (empirical risk signals).

  7.  **Review against Constraints:**

      *   *Afternoon runnable?* Yes, it's a checklist.
