answer: |-
  ### Part 1: Clarifying the Confusion (SSA vs. SIA)

  Before running the procedure, a brief correction to your mental model. You noted that one assumption depends on the reference class and the other does not. **Both depend critically on the reference class.** The difference is *how* they use it:

  *   **Self-Sampling Assumption (SSA):** "I am a random sample from the observers who *actually exist*."
      *   *Mechanism:* It cares about your **rank** or position in the timeline. (e.g., "I am human #60 billion. Are there likely to be #100 billion?")
      *   *Risk:* It often leads to the "Doomsday Argument" (we must be near the end).
  *   **Self-Indication Assumption (SIA):** "I am a random sample from the observers who *could possibly exist*."
      *   *Mechanism:* It cares about the **total count** of observers in a possible world. (e.g., "World A has 10 observers, World B has 10 billion. I am more likely to be in World B simply because there are more 'slots' for me.")
      *   *Risk:* It often leads to the "Presumptuous Philosopher" problem (believing in a universe with infinite observers just because you exist).

  You do not need to label proposals as SSA or SIA to evaluate them. You only need to test if they are using "existence" as a substitute for "evidence."

  ***

  ### Part 2: The Anthropic Sanity Check (Procedure)

  **Time required:** 2–3 hours per proposal.
  **Prerequisites:** The proposal text, a notepad, and the authority to request clarifications from the applicant.

  #### Step 1: The Empirical Decoupling Test
  **Question:** If we removed all sentences referencing "observer selection," "typicality," or "our existence as evidence," would the proposal still recommend the same action based on physical or historical data?
  *   **Sufficient Answer:** "Yes, the empirical data (e.g., risk models, physical constants) independently supports this action; the anthropic argument is just supplementary."
  *   **Stop Condition (Reject):** "No. Without the anthropic argument, the data is neutral or suggests the opposite."
  *   **Judgment Call:** *Determining if the empirical data is truly 'neutral' or if the applicant is downplaying weak data.*

  #### Step 2: The Reference Class Stability Test
  **Question:** Can the applicant define the group they are comparing themselves to (the reference class) without moving the goalposts to get the desired result? (e.g., Are we comparing ourselves to "all humans," "all intelligent beings," or "all observers in this specific decade"?)
  *   **Sufficient Answer:** The reference class is defined by a physical constraint (e.g., "observers capable of measuring the cosmic microwave background") that remains constant regardless of the conclusion.
  *   **Stop Condition (Reject):** The reference class shifts depending on which conclusion is favorable (e.g., "We are typical humans" for one claim, but "We are atypical observers" for another).
  *   **Judgment Call:** *Deciding if a definition is 'physical' or 'gerrymandered.'*

  #### Step 3: The Presumptuousness Test
  **Question:** Does this argument claim to settle a factual dispute about the external world (physics, cosmology, total population) solely because we are here to observe it?
  *   **Sufficient Answer:** No. The argument is used to correct a bias in our *data* (e.g., survivorship bias), not to determine the *laws* of reality.
  *   **Stop Condition (Reject):** Yes. The proposal claims we can know the size of the universe or the truth of a physical theory *before* measuring it, simply because our existence is more likely in one version than the other.
  *   **Judgment Call:** *Distinguishing between 'correcting data bias' (valid) and 'predicting physical laws' (invalid).*

  #### Step 4: The Actionability Without Update Test
  **Question:** If the anthropic update turns out to be false (i.e., if we are *not* typical observers, or if the reference class is wrong), does the funded work still have value?
  *   **Sufficient Answer:** Yes. The research produces useful data regardless of the anthropic premise.
  *   **Stop Condition (Pass to Board):** No. The entire value of the grant hinges on the anthropic premise being true. This is a values dispute (how much risk to take on metaphysical certainty), not an inference dispute.
  *   **Judgment Call:** *Assessing the 'robustness' of the research output.*

  #### Step 5: The Values vs. Inference Boundary
  **Question:** Is the disagreement about what is *true* (inference) or what we should *do* given the uncertainty (values)?
  *   **Procedure:** If Steps 1–3 passed, but Step 4 failed, send to the Board with a note: "Inference is sound, but risk tolerance is the deciding factor."
  *   **Procedure:** If any of Steps 1–3 failed, **Reject**. Do not pass to the board. This is an inference failure.

  ***

  ### Part 3: Running the Procedure on Three Proposals

  #### Proposal 1: The "Doomsday" Prioritization
  **Argument:** We should expect to be typical observers in the timeline of humanity. Since we are born relatively early in the technological era but late in the population count so far, we are likely near the end of the human story. Therefore, we should reorder priorities from long-term structural work to near-term crisis mitigation.

  *   **Step 1 (Empirical Decoupling):** **FAIL.** Without the "typical observer" claim, there is no empirical evidence provided that near-term risks are higher than long-term risks. The data is neutral; the anthropic argument forces the conclusion.
  *   **Step 2 (Reference Class):** **FAIL.** The proposal defines the reference class as "all rational observers." If challenged, the applicant admits that if they defined it as "all 21st-century humans," the argument vanishes. The class is chosen to force the "Doomsday" result.
  *   **Step 3 (Presumptuousness):** **FAIL.** It claims to predict the total number of future humans (a factual claim about the world) solely based on our birth rank.
  *   **Verdict:** **REJECT.**
  *   **Why you won't enjoy this:** You fund long-horizon research. This proposal argues the long horizon doesn't exist. Rejecting it feels like ignoring a warning flare. However, the procedure flags it as metaphysical numerology, not risk assessment.
  *   **What would flip the verdict:** If the proposal included **independent risk modeling** (e.g., specific AI alignment metrics, biosecurity threat levels) that *also* pointed to near-term crisis, using the anthropic argument only as a supplementary weighting factor.
  *   **Where reasoning fails:** It assumes the "reference class" of observers is stable over time. If future humans are fundamentally different (post-biological), the "typicality" calculation breaks.

  #### Proposal 2: The "Cosmological Commitment"
  **Argument:** Theory A predicts a universe with 1 trillion observers. Theory B predicts a universe with 10 observers. We exist. Therefore, Theory A is 100 billion times more likely to be true. We should commit our endowment to research assuming Theory A is correct without waiting for telescope data.

  *   **Step 1 (Empirical Decoupling):** **FAIL.** The proposal explicitly states we should bypass physical measurement (telescopes) in favor of this probabilistic argument.
  *   **Step 3 (Presumptuousness):** **FAIL (Hard).** This is the textbook "Presumptuous Philosopher" problem. It claims to settle a physics debate without looking at the physics.
  *   **Verdict:** **REJECT.**
  *   **Why this is easy:** It violates the scientific method. A foundation funding research cannot fund a proposal that says "research is unnecessary because we already know the answer via philosophy."
  *   **What would flip the verdict:** If the proposal asked for funding to *test* Theory A because it is *interesting*, rather than funding work that *assumes* Theory A is true.

  #### Proposal 3: The "Anthropic Shadow" Correction
  **Argument:** We observe no historical record of civilization-ending catastrophes. Standard statistics suggest these are rare. However, if they occurred, we wouldn't be here to record them. Therefore, the historical record is biased. We should discount the silence of the past and fund research into high-impact, low-frequency catastrophes.

  *   **Step 1 (Empirical Decoupling):** **PASS.** The proposal acknowledges the empirical data (silence) but argues it is biased. It still relies on statistical correction, not pure metaphysics.
  *   **Step 2 (Reference Class):** **PASS.** The reference class is "civilizations capable of leaving records." This is physically defined.
  *   **Step 3 (Presumptuousness):** **PASS.** It does not claim to know *which* catastrophe will happen or the *laws of physics*. It claims our *dataset* is incomplete. This is standard survivorship bias correction, not anthropic mysticism.
  *   **Step 4 (Actionability):** **FAIL (Conditional).** If the anthropic shadow correction is wrong, the specific allocation of funds toward "invisible" risks might be inefficient compared to visible risks.
  *   **Verdict:** **PASS TO BOARD.**
  *   **Reasoning:** Steps 1–3 indicate the inference is valid (this is statistics, not magic). Step 4 indicates the *magnitude* of the funding shift is a value judgment (how much do we fear the unknown vs. the known?).
  *   **Where reasoning fails:** It assumes that *all* catastrophes wipe out observers. Some catastrophes might be severe but allow survivors to record them. Over-correcting for the shadow could lead to neglecting visible, proven risks.

  ***

  ### Part 4: Deep Dive on the Unenjoyable Rejection (Proposal 1)

  You asked for the rejection you would not enjoy. That is **Proposal 1 (The Doomsday Argument)**.

  **Why it hurts to reject:**
  As a long-horizon funder, your mission is predicated on the future being large and tractable. Proposal 1 uses a sophisticated probabilistic argument to claim the future is small. Rejecting it feels like sticking your head in the sand. It feels like you are prioritizing "procedural correctness" over "existential safety."

  **The Defense of the Rejection:**
  You are not rejecting the *conclusion* (that near-term work is valuable); you are rejecting the *warrant* (that we know this via observer typicality). If you fund based on the Doomsday Argument, you are betting the foundation's reputation on a philosophical dispute that has been unresolved for 30 years. If the SSA/SIA debate is resolved against the Doomsday Argument next year, your grant strategy collapses.

  **What Would Flip the Verdict:**
  To fund this, the applicant must provide **non-anthropic evidence** that the near-term is critical.
  *   *Example:* "We should fund near-term work because AI capability curves are exponential (empirical), *and* the Doomsday argument suggests we should be even more urgent than the curves alone imply."
  *   In this scenario, the anthropic argument is a **multiplier**, not the **engine**. The procedure allows this (Step 1 Pass). The current proposal makes it the engine (Step 1 Fail).

  **Where the Reasoning is Most Likely to Fail:**
  The **Reference Class Stability (Step 2)**.
  The Doomsday Argument collapses if the "observers" in the future are not comparable to you.
  *   *Counterargument:* If future humans are uploaded, live for 1,000 years, or exist in simulations, their "observer moments" are not equivalent to your biological, 80-year lifespan.
  *   *Failure Point:* The proposal assumes a "human" is a stable unit of observation across time. If the applicant cannot defend why a post-human observer counts as "1" in the same way you count as "1," the math breaks. This is a judgment call you must make: *Are future observers comparable to us?* If you doubt it, the rejection stands.
