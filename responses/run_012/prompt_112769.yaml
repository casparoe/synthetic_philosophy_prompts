answer: |-
  Dear Friend,

  It is a genuine pleasure to hear from someone grappling with these texts for the sake of the work they do in the world. There is no better motivation for studying moral theology than the need to understand when life is preserved and when it is relinquished, and I want to assure you immediately that your confusion is not a sign of misunderstanding but of honest engagement. You have put your finger on the exact tension that has kept commentators busy for seven centuries. The passage you are reading is dense, and the translation you have, while serviceable, carries terminology that assumes a metaphysical framework you have not been taught. I will walk you through the reasoning as I would in a classroom, stripping away the technical scaffolding to show you the structure beneath, and I will tell you plainly where I believe your reading slips and why the text holds together despite appearances.

  The core of your difficulty lies in the word intend. In our modern usage, to intend something often means simply to know that it will happen and to do it anyway. If I know that driving my car will pollute the air, and I drive anyway, I might say I intended the pollution in a loose sense. But for Aquinas, and for the tradition he represents, intention is much narrower. It refers specifically to what you aim at as your goal or what you choose as the necessary path to that goal. Everything else that happens, even if you foresee it clearly and certainly, is beside the intention. To understand this, think of a surgeon removing a cancerous tumor. The surgeon intends to remove the tumor to save the life. The surgeon knows with certainty that this will involve cutting healthy flesh and causing pain. The pain and the scarring are foreseen, but they are not intended. They are not the goal, nor are they the means by which the life is saved; the means is the removal of the disease. The pain is an unavoidable side effect. Aquinas is arguing that self-defense works the same way. Your goal is safety. The means is the act of repelling the attack. The death of the attacker is a foreseen side effect, not the goal, and crucially, not the means.

  This brings me to your strongest objection, which is that the attacker's death seems to be the very means by which you are saved. You wrote that he ceases to threaten because he is dead. This is where the metaphysical distinction matters most. Aquinas would say that the threat ceases because the violence is repelled, not because the biological life ends. If you strike an attacker to stop them, and they fall unconscious but survive, your defense was successful. The safety was achieved by the incapacitation, not the death. The death is a consequence of the force used to incapacitate. Because the act of defense does not logically require the death to succeed, the death remains beside the intention. If the act required death to succeed—for example, if you waited until the attacker was fleeing and then shot them to ensure they never came back—then the death would be the means, and it would be murder. In the moment of active defense, the mechanism of safety is the stopping of the attack, not the ending of the life, even if the two happen simultaneously.

  You also asked about the proportionality condition and whether it sits awkwardly with the claim that intention fixes the moral character of the act. It is a sharp observation to notice that tension. If the intention makes the act good, why does using too much force make it bad? The answer is that proportionality is actually evidence of the intention. Aquinas is not saying that intention is a magical mental state that overrides reality. He is saying that we judge what a person intended by what they did. If you use moderate force, it shows you intended defense. If you use excessive force, say, continuing to strike an attacker who is already down and helpless, it reveals that your intention was no longer defense but revenge or hatred. The proportionality condition is not an extra rule added on top of intention; it is the practical test by which we know what the intention truly was. The translation uses the word species here, which is a technical term meaning the kind or type of action. An act of moderate defense is one kind of thing, a virtuous act. An act of excessive violence is a different kind of thing, a vicious act. The intention determines the species, but the external reality of how much force was used tells us what the intention actually was.

  Regarding the translation difficulties, you are right to suspect that words like species and accidental are doing heavy lifting. In this context, species simply means the moral kind or category of the action. When Aquinas says moral acts take their species according to what is intended, he means that we classify an action as charity or murder based on what the agent was aiming at. The word accidental does not mean random or clumsy as it does in modern English. It means incidental or non-essential. An accidental effect is one that does not belong to the essence of the act you are performing. So when he says the slaying is accidental, he means it is not part of the definition of the act of self-defense, even if it happens every time. This is why you can permit the act without permitting the death. You are permitting the defense, and accepting the death as an incidental cost, much like we accept the risk of death in emergency surgery without intending the patient to die.

  Now we must look at the two closing moves you mentioned, because they resolve the remaining friction. The claim that one is bound to take more care of one's own life than of another's is the justification for why you do not have to hold back. Without this principle, one might argue that charity requires you to let yourself be killed rather than risk killing another. Aquinas rejects this. He argues that you have a specific duty to preserve your own existence, and while you should not hate the attacker, you are not required to sacrifice your own being for theirs. This establishes the permission to act. However, this permission has a limit, which leads to the point about public authority. This is the most difficult part of the article for modern readers. Aquinas holds that no private individual has the right to decide that another human being should cease to exist. Only the public authority, acting for the common good of the whole community, has the jurisdiction to judge that a life must be taken, as in capital punishment or just war.

  This is why the private citizen cannot intend the killing. If you intend the killing, you are making a judgment that the attacker deserves death, which usurps a power you do not have. You are only allowed to intend the saving of your own life. The public official, however, acts as an instrument of the community. When a soldier fights an enemy combatant or an executioner carries out a sentence, they are intending the death of that person, but they do so as agents of the common good, not for private safety. This is why the text says it is not lawful for a man to intend killing in self-defense except for those with public authority. For you, the private citizen, the death must always remain a side effect. For the soldier, the death can be the intended means to the end of public security. This distinction protects the sanctity of life by reserving the intentional taking of life to the rarest, most strictly regulated circumstances, while still allowing ordinary people to protect themselves when attacked.

  So, to bring this back to your work and your reading, the text is not committing to something stranger than the encyclopedia entry on the doctrine of double effect, but it is using a more rigorous definition of intention than we use in daily conversation. Your reading went wrong only in assuming that foreseeing a result makes it intended, and in assuming that because death stops the threat, it must be the means. Aquinas insists that the means is the defensive act itself, and the intention is safety, with death remaining an incidental, though foreseen, outcome. The proportionality rule ensures that the act remains defensive in reality, not just in your mind, and the public authority clause ensures that no private person claims the right to judge another worthy of death. It is a tight, coherent system, though it requires us to slow down our thinking about what it means to choose an action. I hope this helps you move past this article, for the questions you are asking at work are precisely the kinds of questions this tradition was built to address, and you are doing it the honor of reading it carefully.
