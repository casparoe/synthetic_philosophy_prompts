answer: |-
  1.  **The Lottery Case and Probabilistic Entitlement**
      "Let's start with the lottery case. On the knowledge account, I can't tell you 'your ticket lost' before the draw because I don't *know* it, even if the odds are a billion to one. On your account, the norm is whether I'm entitled to your trust. In high-probability lottery cases, it seems intuitive that I *am* entitled to trust your calculation. Does your view imply that asserting lottery propositions is actually permissible, provided the statistical evidence makes me trustworthy? And if so, haven't you just swapped 'knowledge' for 'high statistical probability' as the real norm?"
      *   **Follow-up:** "If you reply that knowledge is still required to make that entitlement *apt*, even in lottery cases: Why does knowledge matter for the aptness of the entitlement if the entitlement itself can exist without it? It sounds like knowledge is still doing the normative heavy lifting, and 'trustworthiness' is just the label we put on the effect."

  2.  **Moore's Paradox: The Epistemic Version**
      "Consider the Moorean sentence: 'It is raining, but I don't know that it is raining.' The knowledge account explains the absurdity easily: I'm violating the very norm I'm engaging in. On your view, assertion is permissible if the audience is entitled to take my word. By explicitly telling you I lack knowledge, am I thereby revoking your entitlement? Or does this sentence reveal that 'entitlement to trust' is just a functional description of 'having knowledge'?"
      *   **Follow-up:** "If you say I'm revoking the entitlement by mentioning my ignorance: Then isn't the fundamental rule still 'Don't assert what you don't know'? You're explaining the paradox by appealing to the violation of a knowledge norm, even if you call the norm 'trustworthiness'."

  3.  **Moore's Paradox: The Doxastic Version and Sincerity**
      "Now take the other Moorean form: 'It is raining, but I don't believe it.' This isn't about knowledge; it's about sincerity. Does your account explain the impropriety of this assertion for free? Or do you have to bolt on a separate sincerity condition to explain why I can't assert things I don't believe? If you have to bolt it on, doesn't that suggest 'epistemic trustworthiness' isn't a unified norm, but a composite of knowledge and honesty?"
      *   **Follow-up:** "If you argue sincerity is baked into 'trustworthiness'—that one cannot be trustworthy while lying: Then how do you distinguish the *epistemic* wrong of asserting without evidence from the *moral* wrong of lying? If trustworthiness covers both, does the concept become too bloated to explain specific conversational failures?"

  4.  **Audience Relativity: The Empty Room**
      "Your norm is relational: it depends on an audience's entitlement. But what happens when I assert to no one? I might mutter a fact to myself in an empty room, or write a note I never send. There is no audience to be entitled to trust me. Does the norm of assertion vanish in these cases? If not, are you positing a 'hypothetical audience,' and if so, doesn't that collapse the view back into an internalist norm about my own state of mind?"
      *   **Follow-up:** "If you say there is always a hypothetical audience entitled to trust: How do we determine the standards of that hypothetical audience? If their standards are just 'what a rational agent should require,' aren't we back to standard evidentialism, making the relational talk redundant?"

  5.  **Audience Relativity: The Gullible Interlocutor**
      "Conversely, imagine I'm speaking to someone who is pathologically gullible—they are entitled to trust me on *anything*, even my wild guesses. If the norm is grounded in *their* entitlement, does that mean I can assert nonsense to this person without violating any norm? Or is 'entitlement' objective, meaning they *think* they are entitled but actually aren't?"
      *   **Follow-up:** "If you say entitlement is objective and independent of the audience's actual psychology: Then the 'audience-relative' part of your view seems to drop out. The norm becomes 'Assert only when an audience *would* be entitled,' which looks identical to 'Assert only when you have good grounds,' regardless of who is listening."

  6.  **Collapse into Common Ground Update**
      "Many semanticists view assertion as a proposal to update the 'common ground' of the conversation. Your view says assertion is giving someone a right to trust you. Practically, isn't this the same thing? If I'm entitled to take your word, I add $p$ to my stock of information. Is there any conversational maneuver your account predicts that the common ground account doesn't, or is this just a normative gloss on the same mechanism?"
      *   **Follow-up:** "If you claim there is a difference: Can you give me a case where I should update the common ground but *not* take your word, or vice versa? If the extensions are identical, why prefer the more complex normative explanation of trustworthiness over the simpler functional explanation of information update?"

  7.  **Lying vs. Merely Mistaken Assertion**
      "There seems to be a distinct wrong in lying that goes beyond merely being mistaken. If I assert $p$ without knowing it, I'm epistemically reckless. If I assert $p$ knowing it's false, I'm a liar. Both violate your norm of trustworthiness. But does your account capture the *betrayal* specific to lying? Or does your view flatten the distinction, treating the liar and the reckless guesser as equally untrustworthy in the same way?"
      *   **Follow-up:** "If you say lying is a distinct moral wrong outside the epistemic norm: Then your account of *assertion* is incomplete. It seems you need a moral norm to explain the specific badness of lying, which suggests the norm of assertion itself is purely epistemic (knowledge/truth), while trustworthiness is a hybrid value."

  8.  **The Explanatory Role of Knowledge**
      "You've said knowledge is what makes the entitlement to trust *apt*. But if the norm is trustworthiness, and I can be trustworthy without knowledge (say, in Gettier cases or high-probability lotteries), why is knowledge the benchmark for aptness? Is there a principled reason knowledge makes trust apt, or is this just an intuition pump to keep knowledge theorists on board?"
      *   **Follow-up:** "If you argue knowledge is the only stable basis for trust: Then why not make knowledge the norm directly? Invoking trustworthiness seems to add a step: 'Know $p$ -> Make audience entitled -> Assert.' Occam's razor suggests we should just say 'Know $p$ -> Assert.' What work is the middle step doing?"

  9.  **Retraction and Challenge**
      "If the norm is trustworthiness, when am I obligated to retract an assertion? Is it when I lose knowledge, or when the audience loses trust? Imagine I know $p$, but you irrationally stop trusting me. Have I violated the norm if I keep asserting? Or does the norm shift based on your psychological state? This seems to make the obligation to retract uncomfortably dependent on the audience's whims."
      *   **Follow-up:** "If you say I must retract only when I lose knowledge, regardless of your trust: Then the norm governing my behavior is knowledge, not trustworthiness. Trustworthiness becomes a consequence of following the norm, not the norm itself."

  10. **Falsifiability and Counter-Evidence**
      "Finally, I want to press on what could actually prove you wrong. We've discussed cases where your view aligns with the knowledge account. What is a concrete case where your view and the knowledge account diverge in their verdicts, and the intuition favors the knowledge account? If every time our intuitions clash, you can adjust the definition of 'entitlement' to match the intuition, is the view falsifiable at all?"
      *   **Follow-up:** "If you offer a specific case: I'll ask whether a defender of the knowledge account can explain that same case simply by appealing to pragmatic encroachment or context-sensitivity, without needing to change the fundamental norm from knowledge to trust."
