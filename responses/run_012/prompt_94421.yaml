answer: |-
  You have described a genuine and documented phenomenon, though it lacks a single canonical label as recognizable as Hardin's "Tragedy of the Commons." You are correct to suspect it is not simply the Commons problem with the sign reversed; the mechanism is fundamentally different.

  Here is the diagnosis of the structure, the closest existing terminology, the load-bearing features, and a proposed precise term for your seminar.

  ### 1. The Diagnosis: Coordination Failure under Pluralistic Ignorance

  The phenomenon you describe is best understood as a **coordination failure sustained by pluralistic ignorance and normative enforcement.**

  *   **It is not a Prisoner's Dilemma:** In Hardin's Commons, the dominant strategy is to defect (overuse). Even if everyone agrees to restrain, each individual has an incentive to cheat. In your scenario, the dominant strategy (given the beliefs) is to cooperate (restrain), but the *belief* driving that strategy is false.
  *   **It is a Stag Hunt (Coordination Game):** There are two equilibria: a high-use/high-yield equilibrium and a low-use/low-yield equilibrium. The group is stuck in the latter.
  *   **The Epistemic Layer:** The reason they are stuck is **pluralistic ignorance**. While you note that "everyone... believes," you also note that some "privately suspect the resource could take more." If the belief were truly monolithic, it would be a simple error. The stability comes from the fact that individuals conform to the perceived group belief to avoid social sanction, reinforcing the false belief for everyone else.
  *   **The Normative Layer:** The restraint is self-enforcing because "greed" is policed. This makes it a **norm-sustained equilibrium**.

  ### 2. The Closest Existing Term: The Tragedy of the Anticommons

  The standard academic counterpart to the Tragedy of the Commons is the **Tragedy of the Anticommons**, coined by legal scholar Michael Heller (1998).

  *   **The Similarity:** The outcome is identical: resource underuse and welfare loss.
  *   **The Difference:** The mechanism is different. In an Anticommons, underuse occurs because multiple actors hold **rights of exclusion** (veto power). No one can use the resource because everyone can say "no." In your scenario, no one holds veto power; everyone has access. The exclusion is **self-imposed** based on shared error and social norms.

  While some scholars loosely apply "Anticommons" to any underuse scenario, using it for your case would be imprecise. Your case is not about property rights fragmentation; it is about **informational asymmetry and social signaling.**

  ### 3. Proposed Terminology: The Tragedy of False Fragility

  Since no single term perfectly captures the *epistemic* and *normative* blend you described, I propose you coin the term **"The Tragedy of False Fragility."**

  **Definition:** A collective action failure in a common-pool resource where users underutilize a robust resource due to a shared, false belief regarding its fragility, enforced by social norms against over-consumption.

  **Edges of the Term (When does it stop applying?):**
  1.  **If the belief is true:** If the resource *is* fragile and they restrain themselves successfully, it is not a tragedy; it is successful governance (Ostrom-style).
  2.  **If there are no social norms:** If individuals restrain themselves purely out of personal risk aversion without fear of being judged "greedy," it is an individual decision-making error, not a collective action problem. The social sanction is load-bearing.
  3.  **If exclusion rights exist:** If users cannot use more because others physically or legally stop them, it reverts to the Anticommons.

  ### 4. Load-Bearing Features vs. Incidental Details

  You asked which parts of your description are essential.

  *   **Essential (Load-Bearing):**
      1.  **The False Belief:** The resource must be capable of higher yield. If the capacity is truly limited, restraint is rational.
      2.  **The Social Sanction:** There must be a cost to deviating from the norm (being labeled greedy). Without this, a single actor would test the limit, discover the truth, and the equilibrium would collapse.
      3.  **Common Knowledge of Restraint:** Everyone must see everyone else holding back. This validates the false belief ("Look, no one is using it; it must be dangerous").

  *   **Incidental:**
      1.  **The Resource Type:** It need not be physical (wood, water). It applies to budget allocations, meeting times, or shared intellectual attention.
      2.  **The Number of Users:** While six key-holders is a small group where norms are strong, this can scale if the "community of practice" shares the same false dogma (e.g., a whole industry avoiding a safe technology).
      3.  **Private Doubt:** While pluralistic ignorance (private doubt) accelerates the trap, the trap holds even if everyone genuinely believes the falsehood, provided the belief is incorrect. However, private doubt makes the remedy easier (information).

  ### 5. Uncertainty vs. False Belief

  You asked if the same structure arises when the belief is true but merely uncertain.

  **No.** This is a critical distinction.
  *   **False Belief (Your Scenario):** The risk is imaginary. The remedy is **information**.
  *   **Uncertainty (Risk Aversion):** The risk is real but unknown. Users hold back because the cost of ruin (catastrophe) outweighs the benefit of extra use. This is a rational **insurance strategy**.

  If the resource *might* collapse, restraint is a valid heuristic. The "Tragedy" only exists *ex post*, when it is revealed that the capacity was there all along. If the capacity remains uncertain, the underuse is not a failure; it is a premium paid for safety. Therefore, the **falsity of the belief** is essential to the diagnosis of a "tragedy."

  ### 6. Remedies by Diagnosis

  Because the problem is hybrid, the remedies differ based on which lever you pull.

  *   **Diagnosis: Epistemic Failure**
      *   *Remedy:* **Auditing and Transparency.** Install a meter on the aquifer; track the bandsaw hours. Make the resource's state common knowledge.
      *   *Risk:* If the data is ambiguous, it may reinforce the fear.

  *   **Diagnosis: Coordination Failure**
      *   *Remedy:* **Focal Points.** Assign specific usage quotas. Paradoxically, giving everyone a "permission slip" to use more (a mandatory minimum) solves the coordination problem. It shifts the norm from "don't touch" to "use your share."
      *   *Example:* The studio manager mandates that each artist must log 5 hours of bandsaw time per week.

  *   **Diagnosis: Norm-Sustained Equilibrium**
      *   *Remedy:* **Reframing.** Change the moral valence of use. "Stewardship requires maintenance; letting the wood rot is negligence." You must make *underuse* the greedy/antisocial act (hoarding capacity).
      *   *Risk:* Requires a cultural shift, which is slow.

  *   **Diagnosis: Outside Shock**
      *   *Remedy:* **Crisis.** A fire in the overgrown wood forces clearing. A deadline forces tool use. This breaks the equilibrium but is costly.

  ### 7. A Boundary Case

  To test the limits of the **Tragedy of False Fragility**, consider this scenario:

  **The Case:** A group of farmers shares an irrigation canal. They believe the canal walls are weak and will collapse if water flow exceeds 50 liters/minute. They all restrict flow to 30 liters. Their crops suffer.
  **The Twist:** An engineer tests the walls and confirms they *can* hold 100 liters. However, the farmers refuse to increase flow.
  **Why?** Not because they doubt the engineer, but because increasing flow requires one farmer to open the gate wider, which risks flooding the neighbor's field if the gate malfunctions. The neighbor has not given explicit permission.

  **Analysis:** This is **not** a Tragedy of False Fragility. It is an **Anticommons** problem (need for permission/coordination) or a **Liability** problem. The belief about the *canal's* fragility is gone; the fear is now about *social conflict* or *accidental damage*.

  **The Boundary:** The Tragedy of False Fragility ends where the constraint shifts from *internalized belief about the resource* to *externalized rules about rights or liabilities.*

  ### Summary for Your Seminar

  If you need to label this in your seminar, you should frame it as follows:

  > "This is a **coordination failure** driven by **pluralistic ignorance**. While it mirrors the **Tragedy of the Anticommons** in outcome (underuse), the mechanism is not fragmented property rights but rather **shared epistemic error** regarding resource capacity. I term this the **Tragedy of False Fragility**. It differs from standard risk aversion because the risk is objectively non-existent, and it differs from Hardin's Commons because the incentive structure is inverted by social norms rather than individual gain."

  This positioning acknowledges the literature (Hardin, Heller, Ostrom) while precisely carving out the specific dynamic you have identified.
