  The assumptions that carry the theorem
  The theorem rests on four pillars: at least three alternatives, a deterministic rule, non-dictatorship, and crucially, an unrestricted domain of preferences. It assumes voters can hold any logical ranking. If any preference ordering is possible, no voting system can guarantee that voting sincerely is always each member's best strategy. Under these conditions, some member can always benefit by misrepresenting true preferences. However, the "unrestricted domain" assumption is the linchpin here. If the environment restricts how preferences are structured—such as requiring them to be single-peaked along a policy spectrum—the theorem's impossibility result no longer strictly applies, opening space for strategy-proof mechanisms.

  Most important implications for our design
  The single most important implication is that your single-peaked preference structure exempts you from the theorem's impossibility result, allowing for strategy-proof rules. Gibbard–Satterthwaite assumes voters can hold any arbitrary ranking of options. Since your members view policies along a single dimension of departure from the status quo, this "unrestricted domain" assumption fails. Consequently, you are not forced to accept manipulability as an inevitable cost of democracy. This is a valuable escape clause.

  This liberates your design process. You can adopt pairwise majority voting, which is strategy-proof under single-peakedness. Because a Condorcet winner is guaranteed to exist when preferences are single-peaked, you avoid voting cycles. For transparency, avoid complex weighted formulas. Instead, use a Condorcet-consistent method where the option beating all others in head-to-head contests wins. Counting 21 pairwise matchups for 400 members is very laborious but verifiable by hand. Alternatively, a "median vote" mechanism where members mark their ideal point determines the winner. This is transparent and strategy-proof under your specific constraints.

  However, really verify the single-peaked assumption holds. If packages are multi-dimensional, manipulability returns. Do not use Plurality; it encourages tactical voting on extreme options. Without the structure, you are hopeless; with it, you have integrity. Design ballots to capture ranking, not just checkmarks, utilizing this escape clause. Furthermore, ensure the ordering of the seven packages is agreed upon beforehand; if the dimension itself is contested, the single-peaked property collapses. Your critical design effort should focus less on preventing manipulation through complex rules and more on maintaining the structural conditions that make manipulation unnecessary. Transparency aids this: if members see the dimension is respected, they trust the median outcome. Given the hand-counting constraint, a simplified Condorcet method, such as successive elimination along the ordered dimension, may balance verifiability with strategy-proofness better than full pairwise matrices. Ultimately, if the single-peaked assumption proves false during testing, revert to recognizing that some manipulation is inevitable and always prioritize simplicity over theoretical optimality.

  What the theorem does not settle
  The theorem does not tell you which strategy-proof rule to select among the many that exist under single-peaked preferences. It offers no guidance on efficiency, fairness, or how to handle ties. Furthermore, it ignores the cognitive and administrative costs of voting. A rule might be theoretically immune to manipulation but too complex for members to understand or for tellers to count by hand. It also does not address what happens if the single-peaked assumption is only approximately true; slight deviations might reintroduce manipulability without triggering the full impossibility result. Finally, Gibbard–Satterthwaite concerns individual strategic manipulation, not coalition behavior or external lobbying pressures. You must still decide how to balance verifiability with expressiveness. The theorem proves a negative about unrestricted domains; it does not provide a critical positive blueprint for optimal institutional design within restricted domains. You must really weigh the burden of counting against the benefit of strategy-proofness.

  Bottom line
  Ultimately, do not let Gibbard–Satterthwaite discourage you; your single-peaked context neutralizes its pessimism. Adopt a median-based or Condorcet rule that leverages the policy spectrum to ensure strategy-proofness. Prioritize transparency in counting over complex optimizations. Verify that members agree on the policy ordering, as this structure is your shield against manipulation. If the structure holds, sincere voting is safe. If it breaks, accept some manipulability to maintain simplicity. Design for the structure you have, not the general case you avoid.
