answer: |-
  Your friend's argument is a sophisticated *reductio ad absurdum* that targets the universalisation implicit in Hofstadter's conception of superrationality. It is a variant of objections often raised against Evidential Decision Theory (EDT) and, more specifically, against the 'Kantian' formulation of rationality where one acts as if one's decision determines the decisions of all logical copies.

  You are correct to feel that the diagnosis offered by your group—that the independence of the randomisations is the culprit—is insufficient. As you note, the superrational argument explicitly disavows causal influence (Step 3), so pointing out the causal independence of the dice is merely to repeat the premise, not to solve the problem. The trouble lies not in the mechanics of the randomisation, but in the scope of the obligation derived from the symmetry.

  ### The Step to Reject

  You should reject **Step (4)**.

  Step (4) states: *"So whenever I am in the same problem as others who reason as I do, I am entitled to act on the symmetric optimum, and doing so is not magical thinking but merely the recognition that the same problem solved by the same reasoning yields the same strategy."*

  This step appears innocent because it looks like a mere universalisation of the reasoning used in Step (2). In the Platonia Dilemma, the symmetry of the agents and the interdependence of their payoffs coincide perfectly. It is tempting to think that the logical symmetry alone drives the result. However, Step (4) smuggles in an assumption that the *logical* symmetry is sufficient to dictate action, regardless of the *strategic* structure connecting the agents. It detaches the 'same strategy' requirement from the 'same payoff function' requirement.

  ### Why It Looked Innocent

  Step (4) looked innocent because in the original Platonia case (Step 2), the condition of being 'in the same problem' entails both logical identity and strategic interdependence. The twenty participants are not merely reasoning identically; they are competing for a single prize. The symmetry of their reasoning is only instrumentally valuable because the symmetry of their *payoffs* makes their actions mutually relevant.

  In the Platonia Dilemma, if I change my probability $p$, I am effectively changing the probability for all twenty (by the superrational supposition), and because the payoff depends on the aggregate outcome, my expected utility changes. In Step (5) (the duplicate case) and Step (6) (the partial public good), this link is severed or diluted. In Step (5), the duplicate's action has no bearing on my payoff. In Step (6), the 'hundred who do not reason as I do' break the symmetry of the game structure, even if the symmetry of reasoning holds for the nine hundred. Step (4) glosses over this distinction, treating 'same problem' as a matter of cognitive topology rather than game-theoretic structure.

  ### The Cost of Rejection

  By rejecting Step (4), you pay a significant philosophical price. You must abandon the idea that superrationality is a purely *logical* or *moral* imperative applicable to any agent capable of reasoning. It becomes, instead, a strictly *game-theoretic* heuristic.

  1.  **Loss of Universality:** You can no longer claim that a superrational agent must cooperate with a logical duplicate in a Prisoner's Dilemma if they are causally isolated and payoffs are independent (as in Step 5). The obligation to coordinate vanishes when my utility function does not depend on your action.
  2.  **Restriction on 'Same Problem':** You must introduce a restriction on when agents count as being in the 'same problem'. It is not enough that they share a decision matrix and a reasoning algorithm; they must share a *game*.

  ### The Repair: A Restriction on 'Same Problem'

  To repair the theory, you must stipulate that Step (4) holds only when the agents are in the same problem **and** their actions are payoff-relevant to one another.

  **What work does this restriction do?**
  It prevents the slide from Step (4) to Step (5). In the duplicate case, whilst the agents are in structurally identical decision problems, they are not in the same *game*. My utility $U$ is a function of my action $A$ and the state of the world $S$, but not of the duplicate's action $B$. Therefore, maximising $E[U]$ under the supposition $A=B$ yields the same result as maximising $E[U]$ without that supposition. The 'symmetric optimum' of the *enlarged* situation (maximising $U + V$) is irrelevant to my rational obligation, which is to maximise $U$.

  In the public good case (Step 6), the restriction saves the theory from the absurdity of the 'only one' scenario. If I am the only superrational agent, there is no symmetry to exploit. I simply maximise my expected utility given the fixed behaviour of the others. If my contribution costs me 1 unit and yields 0 benefit because the good is not provided, I do not contribute. The superrational obligation only binds the coalition of nine hundred *as a block*, not me in isolation from them.

  **Can this be stated without circularity?**
  Yes. The restriction relies on the definition of the payoff function, which is exogenous to the decision theory. We define 'being in the same problem' not merely as 'facing the same choice', but as 'facing the same choice within a single game structure where utility functions are interdependent'. This is not circular; it is a structural constraint on the domain of the theory. It says: Superrationality is a solution concept for *games*, not for *decisions in vacuo*.

  ### What Remains of the Platonia Dilemma?

  Once Step (4) is restricted, the answer to the Platonia Dilemma survives intact. The twenty participants are in a single game with interdependent payoffs. The symmetry of reasoning allows them to select the strategy profile ($p=1/20$) that maximises individual expected utility *given* that the others will do the same. The correlation is logical, but the *reason* we care about the correlation is that the payoffs are causally dependent on the aggregate of actions.

  The expected payoff of roughly twenty million dollars remains the correct superrational valuation. The fact that the probability of *anyone* winning is only 38% is a feature of the game's design, not a bug of the theory. The correlated solution (designated sender) is indeed better, but it is unavailable without communication. Superrationality finds the best *uncorrelated* equilibrium.

  ### A Defensible Decision Rule

  What survives in the vicinity is a decision rule closely resembling **Functional Decision Theory (FDT)**, as developed by Yudkowsky and Soares, or a restricted version of **Evidential Decision Theory (EDT)**.

  *   **EDT** says: Choose the action that provides the best news about the outcome. Your friend's argument exploits the fact that EDT can recommend 'managing the news' in cases like Step (5) (the 'Newcomb-like' problems where the correlation is spurious regarding payoff).
  *   **FDT** refines this. It says: Choose the action that maximises expected utility, treating your decision as determining the output of your decision function, *and* the output of any other instance of that function *wherever that output is relevant to your payoff*.

  The crucial addition is the relevance clause. FDT does not demand I coordinate with my duplicate if his payoff is independent of mine, because his action is not a logical *consequence* of my decision function in a way that impacts *my* utility. It respects the logical correlation (Step 3) but respects the causal structure of the payoff (the restriction we added to Step 4).

  ### Conclusion

  Your friend's argument succeeds in showing that an unrestricted principle of logical symmetry leads to absurdity (Step 7). It fails to show that superrationality itself is incoherent. By rejecting Step (4), you preserve the core insight (Step 3)—that reasoning is logical and not merely causal—while acknowledging that rationality is ultimately about maximising one's own payoff, not about maintaining logical consistency with copies for its own sake. You retain the Platonia solution, but you concede that superrationality is a tool for strategic interaction, not a metaphysical law of behaviour.
