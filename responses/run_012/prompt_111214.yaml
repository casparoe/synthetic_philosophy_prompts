      *   Is there a better candidate? **Step (6)** contains the slippery slope ("when I am the only one"). If I am the only one, there is no symmetry. So (6) is internally inconsistent with (1). If I am the only one, the "same strategy" assumption applies to nobody else. So I just maximise my own payoff. In a public good game, if I am the only one, contributing usually costs me nothing if the good isn't provided (or costs me and provides nothing). So (6) is demonstrably false under (1).
