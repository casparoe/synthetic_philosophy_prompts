answer: |-
  This is not a parlor trick. Your friend has reconstructed a version of a famous argument by the philosopher Donald Davidson (specifically from his essay *On the Very Idea of a Conceptual Scheme*). It is a serious, logically valid objection to the strongest version of the Sapir-Whorf hypothesis.

  However, it relies on a specific, rigid definition of "concept" and "language" that most modern linguists and cognitive scientists have already abandoned. You can keep the *spirit* of your intuition (that language deeply shapes thought) without accepting the self-refuting conclusion, but you cannot keep Premise (1) exactly as written.

  Here is the breakdown of where the argument breaks, what you need to drop, and why this doesn't destroy cross-cultural understanding.

  ### 1. Which line do you drop?

  You must drop (or significantly qualify) **Premise (1)**.

  > *(1) Strong linguistic relativity: the concepts a person can entertain are fixed by the language they speak -- there's no thinking outside the categories your language supplies.*

  This is the poison pill. The argument works because (1) posits a **closed system**. If language *fixes* concepts and there is *no* thinking outside them, then the anthropologist is hermetically sealed in her own mind.

  If you keep (1) exactly as written, the conclusion (8) is inescapable. Strong determinism is indeed self-refuting because the act of stating the theory requires you to step outside the determinism to compare the two systems.

  **The Fix:**
  You need to change (1) from a claim about **capacity** to a claim about **habit** or **probability**.
  *   **Old (1):** Language *fixes* what you *can* think.
  *   **New (1):** Language *biases* what you *default* to thinking, making some concepts cognitively cheaper and others more expensive.

  ### 2. What does dropping it cost you?

  It costs you the "Prison" metaphor, but it saves the "Lens" metaphor.

  *   **The Cost:** You lose the dramatic claim that speakers of different languages are literally incapable of understanding each other's core realities. You cannot claim a speaker *cannot* understand a concept their language lacks; you can only claim it is *unnatural* or *effortful* for them to do so without training.
  *   **The Gain:** You avoid self-refutation. If language merely biases thought, the anthropologist can learn the new language. In learning it, she updates her own cognitive software. She isn't trapped; she is just starting with a different default setting.

  **Why Premise (5) is also vulnerable:**
  Even if you try to keep (1), Premise (5) is empirically false: *"By (1) she can only entertain concepts her own language supplies."*
  This assumes the anthropologist's language is static. It isn't. By studying the community, she is acquiring new linguistic tools. If language determines concepts, then **learning a new language expands your conceptual capacity.** The argument treats the anthropologist as a static monolingual observer, but the act of anthropology is inherently bilingual/bicultural. She doesn't need to have the concept *before* she starts; she acquires it *during* the process.

  ### 3. Addressing the "Proving Too Much" Concern

  You asked: *"If you say it's the anthropologist bit, tell me why that same objection doesn't also gut perfectly respectable claims about understanding other cultures or other minds."*

  This is the most insightful part of your query. The friend's argument relies on a **False Dilemma** in Premise (6):

  > *(6) So either her language already had those concepts... or she could never have found the difference in the first place.*

  This assumes that **Translation requires Identity.** It assumes that for me to understand your concept of "ownership," my mind must already possess an identical "ownership" slot to put it in.

  **Why this doesn't gut cross-cultural understanding:**
  We can understand things we don't have native categories for by using **universal cognitive substrate** and **meta-language**.

  1.  **Universal Cognition:** Humans share a biological hardware (perception of objects, agents, causality, space, time). Even if Language A marks "evidentiality" (how I know this) grammatically and Language B does not, both groups of speakers *perceive* seeing vs. hearing. The difference is in the *obligatory encoding*, not the raw perceptual capacity. The anthropologist bridges the gap using shared human perception, not just shared vocabulary.
  2.  **Negative Evidence:** We often detect conceptual differences not by finding a perfect translation, but by noticing **systematic failure**. If the anthropologist tries to ask "Who owns this?" and the community consistently answers in a way that references "custodianship" or "kinship obligation" instead, the *friction* itself is the data. She doesn't need to "have" their concept to notice that her concept doesn't fit.
  3.  **Theory of Mind:** Understanding other minds doesn't require identical concepts; it requires a "Theory of Mind" mechanism that allows us to model *that* the other person has different beliefs. I can understand that you believe in a ghost even if I don't. I model your belief, I don't have to share it.

  **The "Proving Too Much" Rebuttal:**
  If your friend's argument were true, it would indeed prove that *no one* understands anyone else (solipsism). Since we know we *do* successfully communicate (we are having this conversation), the premise that leads to solipsism (Strong Determinism) must be false.

  We know cross-cultural understanding is possible because it happens. Therefore, conceptual schemes cannot be hermetically sealed. They are porous.

  ### Summary for your Reading Group

  You can tell your friend:

  1.  **Acknowledgement:** "This is a classic Davidsonian argument, and it correctly identifies that **Strong Determinism** (language makes thought *impossible* outside its bounds) is self-refuting."
  2.  **The Pivot:** "However, modern relativity hypotheses don't claim **Determinism**; they claim **Influence**. Language doesn't build the walls of the prison; it paves the roads. It makes some paths easy and others hard."
  3.  **The Anthropologist:** "The anthropologist isn't trapped because human cognition is plastic. Learning the language *changes* the concepts she can entertain. The discovery of the difference is the evidence that the concepts were *not* fixed initially."
  4.  **The Verdict:** "You have successfully refuted the 'Prison' version of Whorfianism. But you haven't refuted the 'Lens' version. Language can shape thought deeply (making certain distinctions automatic and salient) without making alternative thoughts logically impossible."

  **Bottom Line:** Drop the word "fixed" in (1). Replace it with "biased." You keep the phenomenon you care about, but you lose the logical paradox.
