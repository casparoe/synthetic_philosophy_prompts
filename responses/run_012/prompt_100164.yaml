answer: |-
  Dear colleague, it is wise to pause before defending a specific account to clarify the standards of adequacy themselves, for in the literature on collective harm, many disputes arise not from competing solutions but from competing intuitions about what counts as a problem. To build a list of desiderata that serves your purpose of action-guidance for an individual agent who reasonably expects the collective to keep failing, we must distinguish between metaphysical constraints on responsibility and pragmatic constraints on deliberation. The first requirement I propose is the Difference-Making Intuition, motivated by the familiar cases of the single vote, the single portion of meat, and the ton of carbon. This requirement states that an agent bears responsibility only if their act makes a discernible difference to the outcome. The motivation is the deep-seated belief that morality is concerned with changing the world for the better, and if the world is exactly the same with or without my act, my responsibility seems to vanish. However, I judge this requirement to be a prejudice of act-consequentialism rather than a genuine constraint, because it fails to accommodate cases of overdetermination where an agent clearly participates in a wrong even if their specific contribution was not strictly necessary to the final tally.

  This leads directly to the second requirement, which I call the Overdetermination Constraint, motivated by your first constructed case where an individual's act is causally necessary only because an independent process would have produced the same harm moments later. Here the harm is overdetermined across time, and no lasting difference turns on what the individual does. The requirement states that a theory must not absolve the agent merely because the harm was inevitable or imminent due to other causes. I judge this to be a genuine requirement because it captures the intuition that participating in a harmful process is wrong even if one's specific contribution is replaceable, and it prevents agents from exploiting causal redundancy to escape responsibility. You should note that the Difference-Making Intuition and the Overdetermination Constraint form an incompatible pair; you cannot satisfy the demand that responsibility requires making a difference while also holding agents responsible in cases where their act makes no difference to the occurrence of the harm. If you must choose, the Overdetermination Constraint is the more robust filter for collective harm, as the Difference-Making Intuition is precisely what fails in the familiar cases you care about.

  The third requirement is the Epistemic Access Condition, motivated by your second constructed case involving a non-threshold accumulation where the harm is discontinuous and appears only once the accumulation crosses a level that no one can locate in advance. The requirement states that a theory must assign responsibility even when the agent cannot know whether their act crosses the threshold of harm. I judge this to be genuine because moral responsibility cannot depend on lucky guesses about complex systems; if the risk is known even if the threshold is not, the agent must be accountable for taking that risk. This requirement works in tandem with the fourth demand, the Action-Guidance Requirement, which flows from your stated purpose. This states that the theory must tell the agent what to do now, assuming others will not change their behavior. I judge this genuine for your project, though I must mark a related consideration as out of scope: the requirement that the theory must solve the collective problem. Any desideratum demanding that individual responsibility alone must prevent the harm is a prejudice belonging to a theory of collective blame, not individual responsibility, and should be discarded for your purposes since you are assuming collective failure.

  The fifth requirement concerns the Asymmetry Explanation, motivated by the phenomenon where the very same act is harmless in isolation but wrong in concert with others. The requirement states that the theory must either explain or legitimately stipulate why the moral status of the act changes based on the actions of others. I judge this to be genuine, but with a caveat: a theory may stipulate this asymmetry if it grounds responsibility in participation rather than outcomes, but it must explain it if it grounds responsibility in consequences. This is crucial because it determines whether the theory looks backward at the harm or forward at the role the agent plays. When we assess the main families of accounts against this list, the fractures appear immediately. Accounts that locate responsibility in causal contribution struggle profoundly with the Overdetermination Constraint and the Epistemic Access Condition, as they often cannot find a causal link in the vote or meat cases, or they absolve the agent in the pre-emptive harm case. They are also the most vulnerable to the Difference-Making Intuition, which ironically makes them fail the very cases they were designed to handle.

  Accounts based on complicity with a collective handle the Asymmetry Explanation and the Overdetermination Constraint well, as they focus on joining a wrongful enterprise rather than causing the outcome, but they often stumble on the Action-Guidance Requirement if the collective is defined by its success; if the collective is failing, as you assume, the complicity account may struggle to show what the individual is complicit in. Fair share accounts, which focus on one's portion of a collective enterprise, excel at Action-Guidance and the Epistemic Access Condition, since one knows one's share even if one does not know the total harm, but they can feel disconnected from the actual harm in the Overdetermination case, risking a form of cleanliness that ignores the reality of the damage. Finally, accounts based on the character that a contributing act expresses bypass the causal issues entirely and handle the Asymmetry Explanation naturally, since character is revealed in context, but they risk losing grip on the harm itself, potentially making responsibility too internal and failing to guide action regarding the external world. If I must identify the single requirement that does the most to exclude otherwise attractive accounts, it is the Overdetermination Constraint, because it eliminates any theory that ties responsibility strictly to counterfactual dependence, which includes the most straightforward causal accounts. By building your desiderata around these tensions, particularly the incompatibility between making a difference and being responsible for overdetermined harms, you will ensure that your final theory is robust enough to handle both the familiar puzzles and the constructed cases you have designed.
