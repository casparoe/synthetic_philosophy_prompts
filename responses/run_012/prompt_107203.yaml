prompt: |-
  Write me a mock internal FAQ from an invented municipal body — say the "Bureau of Civic Memory" — that has adopted a single bright-line rule for handling commemorative statues. The rule: a statue's only job is to say something to the people who walk past it today, so every statue gets re-reviewed each year and either "renewed" or sent to the foundry. Deadpan bureaucratic voice, numbered Q&As, relentlessly cheerful. The humor should come from the real moves in the commemoration debate — the presentism charge, whether taking a statue down is itself a speech act, the "you can't erase history" line, the gap between the person and what the statue was actually put up to say, the just-add-a-plaque compromise, who gets to decide — so that someone who's read the literature laughs and finds it fair rather than a strawman, while someone who's never touched it still gets the joke. Around 600-700 words. Dont hedge: pick a definite version of the policy and follow its logic all the way down, even where it gets uncomfortable. At the end, add a short note for me saying which bits are exaggerations of positions people actually hold and which are inventions of your own, and where you had to make a contested call about what commemoration is for.
