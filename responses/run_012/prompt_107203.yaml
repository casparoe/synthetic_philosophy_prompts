answer: |-
  **BUREAU OF CIVIC MEMORY (BCM) | INTERNAL FAQ | VERSION 4.2**
  **SUBJECT: ANNUAL STATUTORY REVIEW CYCLE**

  **1. Why do we review statues every year? Isn't that unstable?**
  Great question! Stability is for archives; civic space is for living communities. A statue installed in 1920 spoke to 1920 pedestrians. Today's sidewalk users have different values, traumas, and heroes. If a statue cannot justify its occupation of public square footage to *today's* public, it is functionally silent. Silence is fine in a library, but in a plaza, we need connection! The Annual Review ensures every bronze neighbor is still saying something helpful.

  **2. Critics call this "presentism." Are we judging the past by today's standards?**
  We are! But not unfairly. We aren't judging the *person* depicted; we are judging the *statue's utility*. A statue is not a biography; it is a speech act. If the speech act no longer resonates, it isn't history—it's noise. We don't ask if General X was complex; we ask if General X inspires current civic virtue. If the answer is "no," the statue has completed its service. No shame! Just like an expired fire extinguisher.

  **3. People say removing statues "erases history." How do we respond?**
  Cheerfully remind them that statues are terrible history teachers. They simplify complex lives into heroic poses. True history belongs in museums and textbooks, where nuance lives. Public squares are for shared values, not historical records. Removing a statue doesn't delete the person from the past; it simply updates the conversation of the present. We aren't erasing history; we are curating the present!

  **4. Why not just add a contextual plaque instead of removal?**
  Plaques are wonderful, but they create visual clutter. A statue with a corrective plaque is like a shout followed by a whisper. The eye sees the hero first; the foot reads the context later. The BCM prefers one clear voice. If the statue requires an apology to stand, it is better off melted. We want our civic spaces to be confident, not ambivalent!

  **5. Where do "non-renewed" statues go?**
  The Foundry! This is a happy destination. Bronze is eternal; forms are temporary. Non-renewed statues are recycled into new commissions that reflect current civic goals. Your General becomes our Community Gardener. It's a warm new beginning for the metal. We encourage departments to host "Melting Ceremonies" to honor the statue's service before reshaping.

  **6. Who decides if a statue is renewed?**
  The Pedestrian Impact Survey (PIS). We sample 1,000 daily passersby. They don't vote on history; they vote on feeling. "Does this figure make you feel welcome?" "Does this figure inspire contribution?" If 51% feel neutral or negative, the statue is retired. Democracy is numbers! It ensures the space belongs to the people who actually walk on it, not the people who wrote the check in 1955.

  **7. What if a statue is removed today but wanted again in ten years?**
  Then it must be recast and re-submitted for the Annual Review! Traditions are stronger when they are chosen, not inherited. We love comebacks. The Foundry keeps ingots labeled by original subject. If the community mood shifts, the metal is ready to rise again. Nothing is lost; everything is waiting for its turn to speak.

  ***

  **Author's Note:**
  The "Annual Review" is my invention; real commemoration is usually static until a crisis forces change. The argument that "statues are not history" (Q3) is a real position held by historians like Kirk Savage, arguing monuments teach myth, not fact. The rejection of plaques (Q4) exaggerates the "counter-monument" critique that context often fails to neutralize heroic imagery. The "Pedestrian Impact Survey" (Q6) is a bureaucratic caricature of "who decides" debates, pushing democratic consent to its logical, volatile extreme. The contested call here is defining commemoration purely as *current utility* rather than *continuity*, deliberately sidestepping the value of stability itself.
