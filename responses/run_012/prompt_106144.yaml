answer: |-
  ### Part 1: Conceptual Dependencies (Brainstorming)

  Before sequencing the session, we must establish the logical prerequisites. You cannot teach the *inference* until the students agree on the *terms* of the inference.

  1.  **The Silence of the Object (Prerequisite for everything):**
      *   *Why:* If students believe objects "speak" (contain intrinsic meaning), the gaps do not exist. If they believe objects are "silent" (contain no meaning), inference is impossible.
      *   *Dependency:* Must be established before Gap 1. Both philosophers and archaeologists need to agree that objects are *evidence*, not *testimony*.

  2.  **The Distinction between Event and Process (Prerequisite for Gap 1):**
      *   *Why:* To understand the Trace-to-Behavior gap, students must grasp that a deposit is the result of decay, loss, and curation, not a photograph of a moment.
      *   *Dependency:* Must precede the Trace-to-Behavior gap.

  3.  **The Distinction between Regularity and Normativity (Prerequisite for Gap 2 & 3):**
      *   *Why:* To move from Behavior to Practice, and Practice to Institution, students must understand that doing the same thing twice (regularity) is not the same as following a rule (normativity).
      *   *Dependency:* This is the philosophers' leverage point. It must be in place before discussing the Practice-to-Institution gap, or archaeologists will treat institutions as mere statistical clusters of behavior.

  4.  **The Necessity of Bridging Assumptions (Prerequisite for Underdetermination):**
      *   *Why:* You cannot discuss underdetermination (multiple hypotheses fit the data) without first establishing that *all* inference requires a bridge.
      *   *Dependency:* If you introduce underdetermination before bridging assumptions, the philosophers will conclude "skepticism is correct" and the archaeologists will conclude "theory is noise." You must show that bridging assumptions are *necessary tools*, not *contaminants*.

  5.  **The Distinction between Absence of Evidence and Evidence of Absence (Prerequisite for Conclusion):**
      *   *Why:* This is the limit case of the inference.
      *   *Dependency:* Must come last. It relies on understanding what *can* be inferred to understand what *cannot*.

  ***

  ### Part 2: The Seminar Plan

  **Session Title:** The Silence of Things: Inference, Practice, and Institution in Archaeology
  **Duration:** 90 Minutes

  #### I. The Order of Ideas (Testing the Scaffold)

  Your three-gap scaffold (Trace-to-Behavior, Behavior-to-Practice, Practice-to-Institution) is the correct skeleton, but **do not treat them as equal steps.**

  *   **Gap 1 (Trace-to-Behavior):** This is the Archaeologists' home turf. Move through this quickly (15 mins). If you linger, philosophers will tune out (thinking it's just "science") and archaeologists will get bored (thinking it's obvious).
  *   **Gap 2 (Behavior-to-Practice) & Gap 3 (Practice-to-Institution):** **Do not collapse these.** While processual archaeology often conflates them, your philosophical audience needs the distinction to see where "meaning" enters.
      *   *Behavior-to-Practice* is about *pattern* (Hume): Did they do this often?
      *   *Practice-to-Institution* is about *authority/norm* (Wittgenstein/Searle): Were they *obliged* to do this?
      *   *Why keep them separate:* If you collapse them, the philosophers will argue you've skipped the "normativity" problem. If you keep them separate, you force the archaeologists to admit that statistical regularity does not equal social rule.
      *   *Order:* Trace $\rightarrow$ Practice $\rightarrow$ Institution. This mirrors the ontological dependency (you need an actor before a custom, a custom before a law).

  **Revised Sequence:**
  1.  **The Premise:** Objects are silent (5 mins).
  2.  **Gap 1:** Trace $\rightarrow$ Behavior (Taphonomy/Process) (15 mins).
  3.  **Gap 2:** Behavior $\rightarrow$ Practice (Regularity vs. Custom) (20 mins).
  4.  **Gap 3:** Practice $\rightarrow$ Institution (Normativity/Power) (30 mins) — *This is the core, using the Weights.*
  5.  **The Limit:** Underdetermination & Absence (15 mins).
  6.  **Assessment:** Final Question (5 mins).

  #### II. The Carrying Example: Standardized Weights and Sealings

  **Assessment:** Your choice of **standardized metal weights and sealings** is superior to burials or figurines.

  *   **Why it works:**
      1.  **Function is Clear:** Everyone agrees a weight is for weighing. This bypasses the "what is it?" debate and forces the "what does it *mean*?" debate.
      2.  **Structure is Ambiguous:** A standard weight exists in a Command Economy (State imposes it) and a Market Economy (Traders agree on it). The object is identical; the institution is opposite.
      3.  **It Avoids the "Ritual" Trap:** Unlike figurines, weights are not easily dismissed as "symbolic." They are utilitarian, which makes the institutional inference harder and more robust.

  *   **Why Burials/Grave-Goods are the Wrong Choice:**
      *   You must explicitly tell the class *why* you are avoiding graves. Say this: *"We are not using graves because graves trigger a reflex: 'Goods imply Afterlife.' That reflex skips the inference. It assumes the object is a message to the gods rather than a tool for the living. We want to analyze institutions of the living, where the stakes of inference are political, not theological."*
      *   Graves encourage the "Object Speaks" fallacy (the goods 'tell' us about belief). Weights force the "Object is Silent" reality (the weight works the same regardless of the belief).

  *   **Requirements for the Example:**
      *   **Must Have:** High standardization (shows intent).
      *   **Must Lack:** Contextual markers of coercion (no palaces, no armies depicted). This ensures the "Central Authority" vs. "Network" reading remains genuinely competing.

  #### III. Misconceptions: Order of Surfacing and Defusal

  You must intercept these exactly when they arise, or they will fossilize.

  1.  **"The Object Speaks for Itself"**
      *   *Surfaces:* Minute 0-5.
      *   *Defusal:* **The Opening Move.** Hold up a stone. Ask: "Is this a weapon, a tool, or a votive?" Show that without a context of *use*, it is nothing. Establish that meaning is relational, not intrinsic.
      *   *Why here:* If you don't kill this first, the Gaps look like obstacles rather than constitutive elements of inquiry.

  2.  **"Non-Utilitarian = Ritual"**
      *   *Surfaces:* Minute 20-25 (During Gap 2).
      *   *Defusal:* When discussing the weights, someone will ask if precise weights are "ritual objects" because they are too perfect. Head this off by defining "Ritual" not as a residual category for "weird stuff," but as a specific practice. If the weights were used for trade, they are utilitarian even if standardized.
      *   *Why here:* Archaeologists use "ritual" to park things they can't explain economically. Philosophers hate residual categories. Meet in the middle.

  3.  **"Underdetermination = Evidentially Worthless"**
      *   *Surfaces:* Minute 50-60 (During Gap 3, after revealing the two institutional readings).
      *   *Defusal:* **Crucial Moment.** When you show the weights fit both "State" and "Market" models, the philosophers will smile (skepticism vindicated) and archaeologists will frown (science threatened).
      *   *The Fix:* Frame underdetermination not as a failure of evidence, but as a **demand for theory**. Say: *"The data does not choose, so *we* must choose the bridge. That makes the assumption visible, not the inference void."* This deepens confidence by making the hidden work explicit.

  4.  **"Lavish Burial = Belief in Afterlife"**
      *   *Surfaces:* Likely as a counter-example from the floor.
      *   *Defusal:* Use this to illustrate the **Trace-to-Behavior** gap. A lavish burial is a *performance* for the living, not necessarily a provision for the dead. It infers social hierarchy (Institution) more reliably than theology (Belief).
      *   *Why here:* It corrects the "easy" inference they expected you to make.

  5.  **"Absence of Material Correlate = Absence of Institution"**
      *   *Surfaces:* Minute 75 (During The Limit).
      *   *Defusal:* Use the example of debt. Debt is a powerful institution, often leaving no material trace until it fails.
      *   *Why here:* It sets the boundary of the method.

  #### IV. The Final Question

  Do not ask them to summarize. Ask them to **perform**.

  **The Question:**
  *"I am showing you a map of a Neolithic road network. The roads connect settlements A, B, and C, but bypass D, even though D is larger. The roads are all the same width."*

  *"Draft the single bridging assumption required to infer (A) a Centralized Hierarchy, and then draft the single bridging assumption required to infer (B) a Cooperative Alliance. Which assumption requires more 'work' to defend, and why?"*

  **Why this works:**
  *   It forces them to generate the **bridging assumption** (the core lesson).
  *   It uses a fresh case (roads, not weights).
  *   It exposes that the *evidence* is the same, but the *institution* depends on the *assumption* about why D was bypassed (exclusion vs. choice).

  #### V. What to Leave Out (And How to Say It)

  You cannot cover everything. You must explicitly exclude **Methodological Particulars** and **Historical Specifics**.

  **What to Omit:**
  1.  **Dating Techniques:** (C14, Stratigraphy). This is about *logic*, not *chronology*.
  2.  **Specific Historical Cases:** (e.g., "In Bronze Age Crete..."). Keep it structural.
  3.  **The History of Archaeological Theory:** (Processualism vs. Post-Processualism). Don't teach the history; teach the problem that generated the history.

  **How to Say It Out Loud:**
  *"We are leaving aside the chemistry of the metal and the stratigraphy of the soil. Not because they don't matter, but because they answer 'when' and 'what'. Today we are only answering 'how do we know'. If we mix the chemistry into the logic, you will mistake analytical precision for inferential validity."*

  ***

  Verdict: The session hinges on establishing that objects are silent before discussing how they speak, and the single misconception most likely to wreck the session is the belief that underdetermination renders inference arbitrary rather than theory-dependent.
