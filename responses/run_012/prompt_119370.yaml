answer: |-
  You're not mangling him; Strawson argues that while ultimate responsibility is impossible, humans are psychologically incapable of fully abandoning reactive attitudes like blame and resentment in daily life.

  ***

  The bells didn't ring on Causation Day. They hummed, a low vibration sent through the pavement that you felt in your molars rather than heard. Elara walked past the old courthouse, now the Office of Continuation, and felt the hum travel up the soles of her boots. The building looked softer than it used to be. The sharp columns were wrapped in ivy, the heavy iron gates replaced by open archways where intake specialists sat with clipboards, not gavels.

  She stopped at the bus stop on Harbor Street. The air smelled of salt and wet concrete. A few others waited, wearing the muted colors the town favored now—slate, moss, ash. Bright reds were considered aggressive, a visual shout that implied a choice had been made to demand attention.

  "Quiet day," said the man next to her. He was holding a paper cup of tea with both hands.

  "The weather is," Elara said. She didn't look at him. She was watching a group of schoolchildren crossing the street. They were holding hands, not because they were affectionate, but because the chaperone had instructed them to maintain structural integrity. One of them recited the rhyme under his breath. *I am the leaf, not the tree. The wind blew first, then me.*

  Elara's brother, Mark, had been killed twenty years ago. A drunk driver had crossed the center line on Route 9. Back then, there had been a trial. There had been a verdict. There had been a number assigned to the pain, a length of time assigned to the cage. Now, the driver would have been taken to the Office. They would have asked: What configuration of chemistry and history produced this swerve? They would have adjusted the chemistry. They would have repaired the history, if possible. If not, he would be quarantined. Not because he deserved it. Because a leaking pipe must be capped, not scolded.

  Elara had accepted this. She worked in intake. She knew the logic. You do what you do because of the way you are. To blame the driver was to blame the rain for falling.

  But the hum in her teeth felt like anger today.

  "Mrs. Vance?"

  She turned. It was Henderson, from three doors down. His son, Toby, had crashed a stolen car into a lamppost last week. Nobody was hurt, but the metal was twisted into a knot that looked like a scream. Toby was in Continuation now, undergoing realignment.

  "Mr. Henderson," she said.

  He looked wrecked. His eyes were red, his coat buttoned wrong. He wasn't looking at the road; he was looking at his own hands.

  "I tried to tell them," Henderson said. His voice was rough, like he hadn't used it in days. "At the Office. I tried to tell them it was my fault."

  Elara shifted her weight. "The intake team explained the chain, Mr. Henderson. Toby's impulse control was compromised by the medication he wasn't taking, which was prescribed due to the anxiety stemming from the divorce—"

  "I know what they say," Henderson snapped. He looked up, and for a second, the calm mask of the town slipped. There was a raw, jagged thing behind his eyes. "They say I didn't choose my temper. They say I didn't choose to be the kind of father who pushes a boy away. They say the way I am is just the way I am."

  "It's the truth," Elara said. She heard how flat it sounded. "You didn't author your genes. You didn't pick the century."

  "So who pays?" Henderson asked.

  "Nobody pays. We repair."

  "Toby thinks he's a monster," Henderson said. "He sits in that room with the counselors who tell him he's just a mechanism that malfunctioned, and he thinks he's a monster. Because he feels like one. I feel like one. I look at him and I see my own hands on the steering wheel of his life, turning it into the ditch."

  "You couldn't have turned it differently," Elara said. It was the mantra. "Given the state of your mind at the time, given your history, you couldn't have done otherwise."

  Henderson laughed, a short, barking sound that made the chaperone across the street glance over. "That's the thing. I know I couldn't have. I know I'm just... wood grain. But I want to burn."

  He stepped closer. The hum of the pavement seemed to rise.

  "I want to blame him," Henderson whispered. "And I want him to blame me. Because if we don't, then this is just physics. And if this is just physics, then Mark's death was just physics too."

  Elara flinched. The name hung in the salt air. She had avoided thinking of Mark all morning, letting the holiday's mood of passive acceptance wash over her. Now the wave broke.

  "Mark's death was a causal event," she said automatically. "The driver's neural pathways failed to inhibit the motor function required to stop the car."

  "Did he suffer?" Henderson asked.

  "Yes."

  "Did the driver feel regret?"

  "Later. Yes."

  "Was the regret chosen?"

  Elara opened her mouth. The logic was airtight. The regret was a product of the driver's surviving brain tissue processing the outcome. It was not a free offering. It was a reaction. "No."

  "Then it doesn't count," Henderson said. "If the apology comes from a machine that couldn't help but apologize, it's just noise. I need him to be able to have done otherwise. I need to know he could have chosen the brake, and didn't. Because if he couldn't have, then there's no one home to forgive."

  The bus arrived with a hiss of brakes. The doors opened. Neither of them moved.

  "The Office says forgiveness is a forward-looking measure," Elara said. "It reduces future conflict."

  "I don't want to reduce conflict," Henderson said. "I want justice. I want the weight of it to land somewhere. Not on the wind. Not on the past. On *him*."

  "He isn't him," Elara said. "He's the sum of everything that happened to him."

  "Then I'm nothing!" Henderson shouted. The chaperone pulled the children closer. Henderson didn't care. He grabbed Elara's arm. His grip was tight, desperate. "If I'm just the result of what happened before me, then I'm not here. My love for Toby, my shame, my grief—it's all just echoes. I want to be the source. I want to be the first cause."

  "You can't be," Elara said softly. "Nothing is."

  "Then why does it hurt?"

  He let go of her arm. He looked defeated, not by her, but by the wall they were both pressing against. The town's vocabulary failed them. There were words for mitigation, for causal chains, for structural repair. There were no words for the need to be the author of your own sin.

  Henderson stepped onto the bus. He didn't take a seat. He stood by the driver, watching the road, as if monitoring the machinery.

  Elara stayed at the stop. The bus pulled away. The hum in the pavement continued, steady, indifferent.

  She thought of Mark. She thought of the driver, currently in a quiet room at the Office, being asked to identify the triggers that led to the bottle. She thought of the counselors, kind-eyed people who never raised their voices, who treated rage like a virus.

  Was it mercy? To look at a man who killed your brother and see a broken tool rather than a villain? It removed the heat. It removed the fire that could burn you down. But it also removed the light.

  If no one is responsible, then no one is guilty. But if no one is guilty, then no one is innocent either. It was all just weather.

  Elara started walking again. She passed the Office of Continuation. Through the open archway, she saw a man sitting in a chair, head in his hands. A counselor sat opposite him, speaking softly. *You didn't choose the impulse. Let's work on the containment.*

  The man looked up. He looked terrified. Not of the punishment, but of the absolution. He wanted the lash. He wanted to know that he could have stopped, and that he hadn't. He wanted to be real enough to be damned.

  Elara walked faster. The hum vibrated in her jaw. She reached her house and went inside. The silence was heavy. She looked at the photo of Mark on the mantle. He was smiling, frozen in a moment he didn't choose, wearing a shirt he didn't pick, standing in a century he didn't vote for.

  She felt the old heat rise in her chest, the urge to point a finger, to name a culprit, to demand a debt. She knew the argument. She knew the regress backed up forever. She knew she couldn't be the cause of herself.

  But as she stood there, in the quiet town that had solved the problem of blame by dissolving the blamer, she wondered if they had solved the pain, or just anesthetized it. She waited for the feeling to pass, for the logic to cool the blood. It didn't. The anger sat there, unjustified, impossible, and utterly alive.

  She turned off the light, leaving the photo in the dark, and waited for morning to happen to her.
