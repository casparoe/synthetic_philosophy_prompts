      *   Comparison: A 1st class (17-20) would dig deeper into the ontology of absences in (b) and the objectivity/pragmatics distinction in (c). A 2:1 (13-16) gets the basics right with some insight. A 2:2 (10-12) might miss the nuance of (c).
