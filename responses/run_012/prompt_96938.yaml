answer: |-
  **Final Examination: Metaphysics Seminar**
  **Time Allowed:** 90 Minutes (for this question)
  **Word Limit:** Approximately 600 words

  **Question 1**
  Berkeley's Master Argument attempts to demonstrate the impossibility of conceiving a sensible object existing unconceived. The standard objection charges Berkeley with conflating the act of conceiving with the object conceived. However, consider a reconstruction offered by a colleague: the argument is not a psychological claim about conceivability limits, but a semantic claim about identity conditions. On this view, "an unperceived tree" is not a difficult psychological feat but a contradiction in terms, akin to "a round square," because sensible things are *defined* as collections of ideas.

  Write an essay evaluating whether this semantic reconstruction saves the Master Argument from the standard objection. In your evaluation, you must address three specific structural issues: (1) Does the argument stand independently, or does it silently presuppose *esse est percipi* and thus beg the question? (2) Does the argument, even if successful, establish mind-dependence (idealism) or merely mind-relatedness (epistemic access), and why does this distinction matter for the materialist objection? (3) Does appealing to divine perception rescue the argument's conclusion, or does it merely relocate the burden of proof onto theism?

  You must take a definitive side on the dispute between the standard psychological reading and your colleague's semantic reading. Defend your position. Do not cite commentators or specific passages; argue from the principles discussed in seminar.

  ***

  **Model Answer**

  The semantic reconstruction of the Master Argument attempts to bypass the psychological fallacy by treating "unperceived sensible object" as a contradiction in terms rather than a failure of imagination. While this avoids the charge that Berkeley confuses the act of thinking with the content of thought, it fails to salvage the argument because it renders the premise question-begging, fails to distinguish dependence from relatedness, and relies illegitimately on theological assumptions.

  First, regarding independence, the semantic reading collapses the argument into a stipulation. If "tree" is defined as "collection of ideas," then asserting a tree exists without a mind is indeed contradictory, but only because the conclusion (*esse est percipi*) has been hidden in the definition of the subject. The standard psychological reading at least attempts an inference from the nature of conception to the nature of existence. The semantic reading offers no inference; it offers a linguistic fiat. Consequently, the argument loses its independent probative force. It does not prove idealism; it assumes it. A student might claim this strengthens the argument by making it analytic, but this ignores that the substantive metaphysical claim is whether sensible things *are* ideas, which the argument is supposed to prove, not presuppose.

  Second, even granting the semantic premise, the argument struggles to move from mind-relatedness to mind-dependence. A materialist can concede that we cannot conceive of a tree without a mind (mind-relatedness) while maintaining the tree itself exists independently (mind-dependence). The semantic reading blocks this by defining the tree *as* the idea. However, this merely stipulates the materialist out of existence rather than refuting them. The distinction matters because the materialist argues that the *referent* of our idea exists unconceived, even if the *idea* does not. By defining the object as the idea, Berkeley changes the subject. The argument succeeds only if one already accepts that there is no distinction between the appearance and the reality, which is precisely what is at issue.

  Third, the appeal to divine perception is often used to secure the continuous existence of objects. However, if the Master Argument relies on the semantic claim that objects are ideas, God's perception merely ensures the ideas exist in a divine mind. This rescues the continuity of experience but does not validate the initial semantic move. Furthermore, it shifts the burden from metaphysics to natural theology. If the Master Argument requires the existence of God to prevent the contradiction of "unperceived objects," then the argument is not a foundational proof of idealism but a dependent consequence of theism. The argument cannot carry the weight Berkeley places on it if it requires a separate proof of God to function.

  Ultimately, the colleague's semantic reading avoids the psychological equivocation but incurs a heavier cost: circularity. The claim that "unperceived tree" is like "round square" is not a neutral semantic observation but a compressed statement of the idealist conclusion. The standard psychological reading is flawed, but the semantic reading is dishonest about its premises. Therefore, the Master Argument fails in either iteration. It either commits a fallacy of inference or begs the question by definition. The most defensible position is that the argument does no independent work in Berkeley's system; it is a rhetorical flourish relying on the prior acceptance of *esse est percipi*.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Analysis of Independence/Circularity (5 Marks)**
  *   **5:** Explicitly identifies that the semantic reading presupposes *esse est percipi* in the definition of "sensible thing," rendering the argument circular rather than probative.
  *   **3:** Identifies the circularity but treats it as a minor issue or suggests the analytic truth saves it.
  *   **1:** Merely states the argument is circular without explaining *why* the semantic reading makes it worse than the psychological reading.
  *   *Typical Error:* Students claim the semantic reading makes the argument "stronger" because analytic truths are certain, missing that the truth is bought at the cost of relevance.

  **2. Distinction Between Mind-Dependence and Mind-Relatedness (5 Marks)**
  *   **5:** Clearly distinguishes the epistemic claim (we can't think without minds) from the ontological claim (things can't exist without minds) and explains how the semantic reading conflates them by definition.
  *   **3:** Distinguishes the concepts but fails to explain why the materialist can grant relatedness while denying dependence.
  *   **1:** Conflates the two terms or treats the materialist objection as purely psychological.
  *   *Typical Error:* Students argue that if we can't conceive it, it can't exist, failing to see the materialist distinction between the idea and the referent.

  **3. Evaluation of the Theological Rescue (5 Marks)**
  *   **5:** Argues that invoking God shifts the burden of proof to natural theology and does not fix the initial semantic stipulation.
  *   **3:** Notes that God ensures continuity but fails to address whether this validates the Master Argument itself.
  *   **1:** Treats God's perception as a successful fix without questioning the dependency it creates.
  *   *Typical Error:* Students assume God's perception automatically solves the problem without noting that it makes idealism dependent on theism.

  **4. Adjudication of the Dispute (Psychological vs. Semantic) (5 Marks)**
  *   **5:** Takes a definitive side (as instructed) and justifies it using the previous three points (e.g., semantic avoids fallacy but invites circularity).
  *   **3:** Takes a side but the justification is disconnected from the structural analysis (1-3).
  *   **1:** Splits the difference or refuses to choose, despite the instruction.
  *   *Typical Error:* Students try to synthesize both readings rather than evaluating which is more defensible, violating the "take a side" constraint.

  **Grading Boundary Notes:**
  *   **A Range (16–20):** The answer takes a definitive side on the dispute and uses the three structural issues (Independence, Dependence/Relatedness, God) as *premises* to justify that side. The circularity charge is understood as a structural flaw, not just a label.
  *   **B Range (12–15):** The answer addresses all three issues and the dispute but treats them as a checklist. It may recite the standard objection before moving on. It identifies the circularity but does not fully explain why the semantic reading fails to rescue the argument's probative value.
  *   **C Range (8–11):** The answer focuses heavily on the standard psychological objection (conceiving vs. existing) and treats the semantic reading as a footnote. One or more of the three required structural issues is missing or misunderstood.
  *   **Fail (0–7):** Recitation of Berkeley's views without critical evaluation, or failure to follow the prompt's constraints (word count, taking a side).
