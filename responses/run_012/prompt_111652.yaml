prompt: |-
  Ok so I'm in this historiography seminar and we keep circling back to whether history can be objective, and at this point I honestly can't tell when people are making a claim and when they're just firing off a slogan. Today I said something about how any account of the past involves selection and interpertation, and the guy next to me goes 'the facts speak for themselves' — and everyone nodded like that settled it. I have no idea what he actually asserted. Then the prof brought up that old nineteenth-century dream of the historian who just records how things really were, no spin, warts and all, and someone else shot back 'well, history is written by the winners,' and now I've got two slogans bouncing off each other and I understand neither.

  I want to zoom in on the first one: 'the facts speak for themselves.' What are the precise claims that sentence could be making? I want the whole range, from the version so weak it basically just means 'evidence is relevant to what happened,' up to the strong version that would actually do the work my classmate wanted, i.e. shutting down the worry that history is inevitably interpretive. For each reading, tell me what exactly it's asserting — about facts, about descriptions, about what a historian does, about whether interpretation can be avoided — and whether it's trivial, plausible, contentious, or flat-out false, and whether it actually delivers his conclusion. Lay it out as a menu rather than picking one and defending it.

  Two things I'd like the readings tested against:

  1. Another student threw out a thought experiment: imagine a literally complete archive of some period — every letter, receipt, court record, shopping list, nothing lost, no gaps — plus a historian with unlimited time to read all of it. Do the facts speak for themselves *then*? I keep flip-flopping on whether that's the best case for my classmate or the worst, and I suspect it depends on which reading you pick, so say what each reading predicts about it.

  2. Someone else mentioned that we routinely describe past events using terms that only make sense after the fact — like calling some border skirmish 'the start of the war' when nobody at the time knew a war was coming. Is that a point about the facts or just about our vocabulary? Connect it to whichever reading it bears on.

  Last thing: which reading do you think he actually meant, and is 'history is written by the winners' flatly inconsistent with 'the facts speak for themselves,' or are they just talking past each other? Typed this on my phone, sorry for any typo's.
