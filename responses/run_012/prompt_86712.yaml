prompt: |-
  I'm a senior at Roosevelt High and I'm the student rep on our district school board — I get an actual vote on everything except personnel and land, which is of course the only stuff that matters. Anyway, in two weeks we vote on a two-year contract, $180k a year out of the tech budget, with a company that puts monitoring software on every school-issued laptop. It reads what kids type in docs and chats, looks for signs of self-harm, bullying, and violent extremism, sends the flags to a counselor, and in the serious ones to the police, and it keeps the flagged material. The board is split, and whats frying my brain is that both sides are making the same argument. The superintendent says we can't wait for proof that it saves lives — if one kid dies while we run a nice careful study, that's on us, you don't get to be cautious about a fire that's already burning. The teacher rep says you can't deploy a thing whose harms we also can't undo: a kid flagged for a bad joke, a kid's private writing sitting in a police file when they're thirty, a school where nobody writes anything honest anymore. Both of them are saying don't act without being sure, and they want opposite things. My dad is a lawyer and he says the EU has an actual formal doctrine about this and that it doesn't just mean "ban it" — he says it comes with conditions, like you need a real scientific assessment of the risk first, the measures have to be proportionate and temporary and dropped when the evidence changes, and the burden of proof lands on whoever wants to introduce the thing rather than on whoever's worried about it. I definately can't tell if he's remembering that right.

  Could you write the opinion I'm going to circulate to the board three days before the vote? It has to land on something we can actually do — approve, reject, or approve with conditions, and if it's conditions they need to be specific enough to amend the contract (who sees the flags, how long they're kept, what the counselor is allowed to do with them, what triggers a police report, when the whole thing shuts off if it isn't renewed) plus a date on which we're forced to revisit it. The reasoning matters more to me than the verdict. I want it to work out what the don't-act-without-certainty idea can actually tell a body like ours, and whether it even makes sense to apply it to the risk of having the software AND the risk of not having it — because doing nothing has victims too, and my civics teacher said if you take it seriously you'd never build anything, which I half believe and half think is a cheap move. And I want it honest about where the whole approach goes quiet and somebody just has to make a value call, since that's probably where I actually am. Please take the strongest version of whichever side you come out against seriously enough that they'd recognize themselves in it — half the board is going to hate whatever I hand them, and if the memo just says both sides have a point it's useless to me. One more thing: a board member wants to table the vote for a year to collect data, and I honestly can't tell if that's caution or cowardice with a nicer name.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**

      *   **Persona:** Senior at Roosevelt High, Student Rep on District School Board (voting member, except on personnel/land).
      *   **Audience:** School Board Members (Superintendent, Teacher Rep, other community members).
      *   **Topic:** Voting on a 2-year, $180k/year contract for student monitoring software (keystroke logging, chat scanning, flagging for self-harm/violence, data retention, police involvement).
      *   **Conflict:** Both sides use the "Precautionary Principle" (don't act without certainty).
          *   Superintendent: Don't wait for proof it saves lives; risk of inaction (death) is too high.
          *   Teacher Rep: Don't deploy without proof it doesn't harm privacy/trust; risk of action (privacy violation, chilling effect) is too high.
      *   **Key Input:** Dad (lawyer) mentions the EU's formal doctrine (Precautionary Principle) involves risk assessment, proportionality, temporariness, burden of proof on the proponent, and review clauses.
      *   **Task:** Write an opinion memo to circulate 3 days before the vote.
      *   **Requirements:**
          *   Must land on a specific action (Approve, Reject, or Approve with Conditions).
          *   If conditions, they must be specific enough for contract amendment (access, retention, counselor action, police triggers, sunset clause, review date).
          *   Reasoning is paramount: Analyze the "don't-act-without-certainty" idea (Precautionary Principle) applied to *both* risks (action vs. inaction).
          *   Acknowledge where the principle goes quiet and a value call is needed.
          *   Steelman the opposing view (don't just say "both sides have a point").
          *   Address the motion to "table for a year" (caution vs. cowardice).
          *   Tone: Mature, analytical, persuasive, student-rep voice (smart but not pretentious), honest about uncertainty.

  2.  **Deconstruct the Precautionary Principle (PP):**

      *   *Core Idea:* If an action has a suspected risk of causing harm to the public or environment, in the absence of scientific consensus that the action is not harmful, the burden of proof that it is *not* harmful falls on those taking the action.
      *   *Dad's Description:* Accurate. It's not just "ban it." It's about process: Scientific assessment, proportionality, non-permanence, burden of proof on the innovator/proponent.
      *   *Application here:*
          *   *Superintendent's use:* "Precaution against suicide/violence." (Risk of *inaction*).
          *   *Teacher's use:* "Precaution against privacy erosion/trust loss." (Risk of *action*).
      *   *The Tension:* PP usually applies to *new* interventions with uncertain environmental/health impacts. The Superintendent is trying to flip it to justify *intervention* to prevent a known harm (suicide/violence). The Teacher is applying it classically to the *tool* itself.
      *   *Resolution:* The PP places the burden of proof on the party introducing the *new variable*. That is the District/Software Vendor. Therefore, the default position without evidence is *not* to deploy, OR to deploy with strict constraints that minimize the "harm" side while testing the "benefit" side.
      *   *Tabling for a year:* This is effectively "Reject for now." If we don't have data, we can't approve. Tabling is the most PP-compliant move *unless* the risk of waiting is immediate and catastrophic.

  3.  **Determine the Stance/Verdict:**

      *   *Option A (Reject):* Strong on privacy, but ignores the safety risk. Hard to sell to parents/admin.
      *   *Option B (Approve as is):* Ignores the privacy risks and the PP requirements (burden of proof not met).
      *   *Option C (Approve with Strict Conditions + Sunset):* This aligns best with the Dad/EU interpretation of PP. It acknowledges the safety risk (allowing the tool) but places the burden of proof on the administration to show it works and doesn't harm, with strict limits to minimize the harm if it fails.
      *   *Decision:* **Approve with Conditions.** This allows the safety net but treats the software as an experiment, not a permanent fixture. It forces the data collection the "table for a year" crowd wants, without leaving students unprotected in the interim.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose and the core dilemma. Acknowledge the weight of the vote.
      *   **The Core Conflict (The Precautionary Principle):** Address the "both sides say don't act without certainty" paradox. Explain why the Superintendent's use is slightly off (PP applies to the *intervention*, not the *status quo*). Explain why the Teacher is closer to the formal definition.
      *   **The "Table for a Year" Question:** Address this directly. Is it cowardice? No, it's methodologically sound but practically risky. We need a middle path.
      *   **The Value Call:** Admit where the logic ends. We have to weigh invisible privacy harm against visible safety risk.
      *   **The Verdict & Conditions:** This needs to be specific.
          *   *Access:* Who sees flags? (Counselors first, not admins/police immediately).
          *   *Retention:* Delete after graduation or X months if no action taken.
          *   *Police Triggers:* Imminent threat only, not "bad jokes."
          *   *Sunset/Review:* 1 year, not 2. Data report required for renewal.
      *   **Closing:** Call to action.

  5.  **Refining the Tone:**

      *   *Voice:* Needs to sound like a smart high school senior who belongs in the room. Not too academic, but rigorous.
      *   *Honesty:* Acknowledge that this is hard. Don't pretend there's a perfect answer.
      *   *Steelmanning:* Ensure the Superintendent's argument (kids might die) is treated with gravity, not dismissed as authoritarian. Ensure the Teacher's argument (chilling effect) is treated as real, not just "privacy nerd stuff."

  6.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I address the Dad's EU doctrine points? Yes (burden of proof, proportionality, temporariness).
      *   *Check:* Did I address the "tabling" question? Yes.
      *   *Check:* Are the conditions specific enough for a contract amendment? Need to make sure they sound legalistic enough.
      *   *Check:* Is the reasoning clear on why PP applies to the software, not the lack of software? *Crucial point.* The status quo is "no monitoring." The change is "monitoring." PP puts burden on the change.
      *   *Check:* Is the "Value Call" section honest? Need to admit that data won't solve everything.

  7.  **Final Polish:** Check word count and flow. Ensure the distinction between "caution" and "cowardice" regarding the tabling motion is nuanced. (It's caution that risks safety, which is the Superintendent's point).

  *(Self-Correction on the Verdict)*: Actually, looking closely at the prompt: "One more thing: a board member wants to table the vote for a year to collect data." If I recommend "Approve with Conditions," I am effectively arguing *against* tabling. I need to explain why a conditional approval is better than a table. A table leaves us with *no* data and *no* protection. A conditional approval gives us protection *and* generates the data needed to decide later. This is the "Proportionate and Temporary" clause of the PP.

  Let's write it.

  *Structure:*
  1. Header.
  2. The Paradox (Both sides claiming caution).
  3. The Precautionary Principle (What it actually says).
  4. The "Table" Motion (Cowardice or Caution?).
  5. The Value Call (Where logic stops).
  6. The Motion (Conditions).
  7. Sign-off.

  *Tone Check:* "My dad is a lawyer" -> Don't lean too hard on "My dad says." Use it as a jumping-off point for independent research/analysis. Make it sound like *my* opinion.

  *Specific Conditions:*
  - Data retention: Max 1 year, deleted upon graduation.
  - Access: Only licensed mental health professionals see raw data initially.
  - Police: Only imminent threat of harm (standard Tarasoff duty), not general discipline.
  - Review: 12 months, not 24.
  - Burden: Admin must prove efficacy at renewal.

  Okay, ready to draft.cw
answer: |-
  **MEMORANDUM**

  **TO:** District Board of Education
  **FROM:** [Your Name], Student Board Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Framework for Student Monitoring Contract (Item 7-B)

  **The Paradox of Caution**

  We are stuck in a logical loop. The Superintendent argues we cannot wait for proof this software saves lives because the cost of waiting is measured in students. The Teacher Representative argues we cannot deploy it without proof it doesn't harm privacy and trust because the cost of deployment is measured in civil liberties. Both of you are invoking the same principle: *Do not act without certainty.*

  But you are applying it to opposite defaults. The Superintendent treats the *status quo* (no monitoring) as the risk. The Teacher Representative treats the *intervention* (monitoring) as the risk.

  My father, who practices law, pointed me toward the formal Precautionary Principle as used in EU regulatory frameworks. He noted it's not just a vibe check; it's a procedural burden. It states that when an action raises threats of harm to human health or the environment, protective measures should be taken even if some cause-and-effect relationships are not fully established scientifically. Crucially, **the burden of proof falls on the proponent of the activity.**

  In this room, the "proponent of the activity" is the Administration. The status quo is *not* monitoring. Therefore, under a strict reading of this principle, the burden is on the District to prove this tool is safe and necessary, not on the skeptics to prove it is dangerous.

  **The "Table for a Year" Motion**

  Board Member Garcia has moved to table this vote for one year to collect more data. I need to be honest about where I land on this, because I know how it looks from my seat.

  Is tabling cowardice? No. Methodologically, it is the most sound application of the Precautionary Principle. If we don't know the risks, we shouldn't sign the check.

  However, the Superintendent's counter-argument is not a cheap move. It is the one place where the Precautionary Principle struggles: it handles environmental toxins better than it handles ticking clocks. If there is a credible threat of self-harm or violence *now*, delaying a potential safeguard for twelve months creates a known risk to protect against a theoretical one. Tabling is cautious, but if a student comes to harm in that year, "caution" will feel like negligence to their family.

  We cannot table. Doing nothing is a decision with victims, too. But approving the contract as written is also a decision with victims. We need a third path that acknowledges the uncertainty without paralyzing us.

  **Where the Logic Goes Quiet**

  Here is where I have to be honest with you. The Precautionary Principle can tell us *how* to process the risk, but it cannot tell us *which* risk matters more. That is a value call.

  We are weighing invisible harms against visible ones.
  *   **The Visible Harm:** A student succeeds in self-harm or violence because a cry for help went unnoticed in a Google Doc. This is immediate, tragic, and undeniable.
  *   **The Invisible Harm:** A student self-censors because they know they are being watched. A student is flagged for a dark-humor joke and ends up in a police database. A culture of surveillance replaces a culture of trust. These harms are slow, cumulative, and hard to measure in a spreadsheet.

  The Administration is prioritizing the visible harm. The Teachers are prioritizing the invisible harm. As the Student Representative, I have to tell you that the invisible harm is real to us. We write in the margins of our digital lives. If we believe those margins are being read by security algorithms, we stop writing honestly. We stop using school devices for anything vulnerable. We don't trust the counselors because we know they are the intake valve for the security apparatus.

  However, I also know that students are dying. I cannot prioritize my privacy over a peer's life if there is a reasonable chance this tool prevents that death.

  So, I am voting to **Approve with Conditions.**

  This is not a compromise; it is an application of the Precautionary Principle's requirements for proportionality and temporariness. If we are going to introduce this risk, we must minimize the exposure, place the burden of proof on the vendor, and ensure an exit strategy.

  **Required Contract Amendments**

  I will move to amend the contract with the following specific conditions. If these cannot be met, I will vote to Reject.

  1.  **Burden of Proof for Renewal:** The contract is approved for **one year**, not two. Renewal is contingent on an efficacy report presented to the Board. The Administration must demonstrate a correlation between software flags and successful interventions. If the data does not show clear utility, the contract terminates.
  2.  **Access Hierarchy:** Flags are **not** visible to administrators, SROs, or teachers. They are visible *only* to licensed school counselors and psychologists. Law enforcement is not contacted unless there is an imminent threat of harm to self or others (meeting the *Tarasoff* duty standard). "Disruptive behavior" or "policy violation" flags do not trigger police involvement.
  3.  **Data Retention:** Flagged data is deleted **six months after graduation** or immediately upon determination that no threat exists, whichever is sooner. No student data is to be retained in a permanent law enforcement or disciplinary record unless it results in a formal criminal investigation initiated by the police, not the school.
  4.  **Transparency:** Students and parents must be explicitly notified of what keywords or patterns trigger flags. We cannot have secret criteria.
  5.  **The "Chilling Effect" Review:** The efficacy report at month 12 must include qualitative data from students. We will survey whether students feel less comfortable seeking help or using devices for schoolwork due to privacy concerns. If the tool saves lives but destroys trust, we need to know that trade-off explicitly before renewing.

  **Conclusion**

  Board Member Garcia's motion to table comes from a desire to be sure. But we are not sure, and we may never be. The Superintendent's motion to approve comes from a desire to be safe. But safety purchased with surveillance has a cost that compounds over time.

  By approving with these conditions, we acknowledge that this software is an experiment, not a solution. We accept the risk of deployment because the risk of inaction is too high, but we rig the experiment so that if the harms outweigh the benefits, we can kill the program without a fight in twelve months.

  The burden of proof is on the District to show this works. My vote is yes, but only if the contract reflects that burden.

  Respectfully,

  [Your Name]
  Student Board Representative
  Roosevelt High School
