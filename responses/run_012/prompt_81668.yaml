answer: |-
  Welcome to this courthouse. For me, this room is familiar. I stand here four times a year. For you, it is a threshold. You have waited years for this day. You have studied laws and histories. You have passed tests. But none of that is what changes your status today. What changes it is what happens in the next few minutes. It is not the paper you will hold at the end. It is the words you are about to speak.

  We often think words describe the world. We say I am tired to describe a feeling. We say it is raining to describe the sky. But some words do not describe. They build. When a judge sentences a defendant, the words create the punishment. When a couple marries, the words create the union. Today is the same. You are not here to tell us how you feel about this country. You are here to do something that only these words can do. You are making a status that did not exist a moment earlier. The law waits for your voice to bring it into being.

  I want to be honest about what that means. It means the power lies in the speaking, not in the emotion behind it. I know some of you are excited. I know some of you are tired from travel or work. I know some of you are here because it is practical for your family or your job. All of that is welcome. The law does not measure your heartbeat. It listens for your voice. If you speak these words with a divided heart, you are still a citizen when you finish. The act is complete because the procedure is correct, not because the sentiment is pure. This is not a criticism. It is a protection. It means you do not have to perform joy to belong. You only have to commit to the obligation. If there is a lack of feeling, that belongs to you, not to the citizenship. The status holds regardless.

  You should know that words like these have weight because they have been spoken before. Some of you have taken oaths in other rooms, in other languages, under different flags. Some of those words were given freely. Some were extracted. You know better than I do how cheap a promise can sound when it is forced. Here, the words are offered freely. But the mechanism is the same. The words work because we agree to let them work. They are not magic on their own. They require a structure to hold them.

  That agreement is not yours alone. It is ours. I sit here as a representative of the law, but I am also a witness. Your families are witnesses. The country is a witness. An oath spoken in an empty room is just noise. It becomes binding because we hear it and accept it. This places a weight on us as well. If you say I am a citizen, we must treat you as one. We cannot take your status for granted. We have to recognize the change you make in this room. I cannot promise you that the country will always be worthy of your commitment. I cannot guarantee that every person you meet will honor what you do here. That is beyond my power. To promise that would be to speak hollow words myself. But I can promise that this court will recognize you. We will treat your words as real. We will uphold the status you create. The burden of recognition falls on those who stay seated as much as on those who stand.

  In a moment, you will stand. You will speak together. You will say I. When one hundred and fifty people say I at the same time, it changes the sound. It might be one hundred and fifty separate promises. It might be one promise spoken with many mouths. I do not know which it is. Perhaps it is both. The law does not require you to solve that puzzle. It only requires you to speak. The unity of the voice does not erase the individual, nor does the individual erase the group. You will speak as one body, but you will leave as distinct citizens.

  So when you rise, do not worry about finding the perfect feeling. Do not worry about whether your voice shakes. Speak the words clearly. Let them remain in this room. We are ready to hear them. We are ready to accept them. And when you sit down, you will be different than when you stood up. Not because you feel different, but because the world around you has shifted to match your words. The law has moved to meet you. Now it is your turn to meet the law.

  Please rise.
