      Welcome to this courthouse. For me, this room is familiar. For you, it is a threshold. You have waited years for this day. You have studied laws and histories. You have passed tests. But none of that is what changes your status today. What changes it is what happens in the next few minutes. It is not the paper you will hold at the end. It is the words you are about to speak.

      We often think words describe the world. We say I am tired to describe a feeling. We say it is raining to describe the sky. But some words do not describe. They build. When a judge sentences a defendant, the words create the punishment. When a couple marries, the words create the union. Today is the same. You are not here to tell us how you feel about this country. You are here to do something that only these words can do.

      I want to be honest about what that means. It means the power lies in the speaking, not in the emotion behind it. I know some of you are excited. I know some of you are tired from travel or work. I know some of you are here because it is practical for your family or your job. All of that is welcome. The law does not measure your heartbeat. It listens for your voice. If you speak these words with a divided heart, you are still a citizen when you finish. The act is complete because the procedure is correct, not because the sentiment is pure. This is not a criticism. It is a protection. It means you do not have to perform joy to belong. You only have to commit to the obligation.

