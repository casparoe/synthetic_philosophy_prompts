      So when you rise, do not worry about finding the perfect feeling. Do not worry about whether your voice shakes. Speak the words clearly. Let them land in this room. We are ready to hear them. We are ready to accept them. And when you sit down, you will be different than when you stood up. Not because you feel different, but because the world around you has shifted to match your words.

