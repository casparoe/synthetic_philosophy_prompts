      That agreement is not yours alone. It is ours. I sit here as a representative of the law, but I am also a witness. Your families are witnesses. The country is a witness. An oath spoken in an empty room is just noise. It becomes binding because we hear it and accept it. This places a weight on us as well. If you say I am a citizen, we must treat you as one. We cannot take your status for granted. We have to recognize the change you make in this room. I cannot promise you that the country will always be worthy of your commitment. I cannot guarantee that every person you meet will honor what you do here. That is beyond my power. But I can promise that this court will recognize you. We will treat your words as real.

