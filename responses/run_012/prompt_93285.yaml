answer: |-
  First, the Court's opinion in *Nix v. Hedden* presupposes that the extension of a kind term is fixed not by the intrinsic nature of the referent, but by the pragmatic context of the speaker and listener. The Court assumes that words in a statute are not labels for metaphysical essences (botanical truths) but tools for commercial regulation, and their reach is determined by "ordinary meaning"—the customary usage of the community subject to the law. By the School of Names' lights, the Court was not being asked to decide an ontological question ("What is a tomato?") but a problem of *Zheng Ming* (Rectification of Names). The dispute was a failure of names to match realities in a specific social context. The Court was asked to decide which *name* ("fruit" or "vegetable") properly governs the *reality* of the tomato for the purpose of maintaining fiscal order. The School would view the Court's task as determining which "reality" (botanical structure or culinary habit) is the relevant *shi* (actualness) that the name must be rectified to fit.

  Second, laying the *White Horse Dialogue* against the case requires parsing the negation in "White horse is not horse" (*bai ma fei ma*).
  *   **The Ambiguity Reading:** If *fei* denies identity (White Horse $\neq$ Horse), the claim is that the concept "White Horse" is not identical to the concept "Horse." In *Nix*, the Court effectively rules that "Tariff Tomato" $\neq$ "Botanical Tomato." This fits the Court's move: they acknowledge the botanical identity but deny the legal identity.
  *   **The Criteria Reading:** Gongsun argues "Horse" names the shape, "White" names the color; the compound demands both. If we apply this, "Fruit" names the seed structure, "Vegetable" names the culinary use. The Court decides that for the Tariff Act, the criteria for "Vegetable" (culinary use) override the criteria for "Fruit" (seed structure). This fits best. It explains why the tomato can be botanically one thing and legally another without contradiction—the criteria for application have shifted.
  *   **The Stuff Reading:** If "Horse" names a stuff and "White Horse" a subset, then "White Horse is not Horse" is false (a white horse is a kind of horse). If the Court had used this reading, they would have ruled that a tomato is a kind of fruit, and since fruits are not taxed, tomatoes are not taxed. They did not do this.
  The Court's decision aligns with the **Criteria Reading**. The paradox predicts that if you change the criteria (from shape to color, or from botany to cuisine), the class membership changes. The other readings would have predicted a ruling based on essence (Stuff) or a purely semantic distinction with no legal consequence (Identity).

  Third, taking the separation of hardness from whiteness seriously (*Hardness and Whiteness Dialogue*), Gongsun argues that hardness and whiteness are separate universals that do not inhere in the stone necessarily; one is apprehended by touch, the other by sight. They are "separate" (*li*). The Court's move is a precise legal instantiation of this separation. They prise the botanical property (fruit-ness) from the culinary property (vegetable-ness). Just as Gongsun argues you cannot see hardness or feel whiteness, the Court argues the tariff collector cannot taste botany or seed culinary use.
  *   **Separation or Denial?** It is an instance of separation. The Court admits both properties exist but treats them as distinct attributes that can be attended to independently.
  *   **Two Kinds at Once:** The separation thesis implies that a single thing (the stone/tomato) can host multiple, independent attributes (hard/white, fruit/vegetable). However, for the purpose of *naming* (classification), one attribute must be selected. The School suggests that because the attributes are separate, the names attached to them are not bound to the object permanently. Thus, a single thing belonging to two kinds is not a contradiction; it is a testament to the independence of the attributes. The tomato is a fruit *and* a vegetable, but for the Tariff, we name it by the vegetable-attribute.

  Fourth, the theory runs out at the point of authority. The School of Names can diagnose the ambiguity in "is" (the copula) and explain how names drift from realities, but it offers no rule for choosing between ordinary and technical usage when they conflict. Gongsun's project is *Zheng Ming*—Rectification of Names—to ensure social order, implying the Ruler or Sage fixes the name. The Court appeals to "common understanding," implying the People fix the name.
  *   **Gap or Different Question?** This is evidence that the School was answering a different question. The School asks, "How do we align language with reality to ensure political stability?" The Court asks, "How do we align language with legislative intent to ensure statutory consistency?" The School lacks an account of statutory interpretation because it is concerned with moral governance, not textual exegesis. The gap is not a failure of logic, but a difference in domain: the School provides the metaphysics of naming, but not the jurisprudence of priority.

  **Reverse Direction**

  Does *Nix v. Hedden* vindicate the School? It vindicates the School's nominalist view that kind membership is settled by use and convention rather than nature. The Court explicitly rejects the "nature" (botany) in favor of "convention" (culinary trade). However, it also suggests the paradoxes are the wrong instrument for litigation. The *White Horse* paradox focuses on the identity of terms ($A \neq B$), whereas *Nix* is about the *purpose* of classification ($A$ counts as $B$ for goal $C$). The paradoxes are static; the law is teleological.

  Regarding the charge that the White Horse puzzle is merely verbal: The fact that the Court could decide only by appealing to common understanding tells *for* the charge. It confirms that the dispute was about the usage of the word "fruit," not the physical tomato. If the dispute were about nature, science would have settled it instantly. The litigation proves the problem was linguistic convention, exactly as the School of Names suspected.

  **Correspondence:**
  *   **The Stone:** The Tomato (the object itself).
  *   **Hardness:** Botanical Fruit-ness (apprehended by science/microscope, like touch).
  *   **Whiteness:** Culinary Vegetable-ness (apprehended by the palate/trade, like sight).
  *   **Horse:** The term "Fruit" (Technical/Essential).
  *   **White Horse:** The term "Vegetable" (Qualified/Contextual). *Note: In the paradox, White Horse is the restricted term. In the case, Vegetable is the restricted term for tariff purposes.*
  *   **The Mapping Break:** Gongsun argues "White Horse is *not* Horse" to show conceptual distinction. The Court argues "Tomato *is* Vegetable" to show functional inclusion. The School separates to distinguish; the Court separates to classify. The School seeks to show the instability of names; the Court seeks to stabilize them for revenue.

  **Verdict:**
  The School of Names supplies the **ontological groundwork** that the ordinary-meaning canon lacks. The Canon says "use the common meaning" as a rule of thumb. The School explains *why* that rule is valid: because names are not fixed by nature (*xing*) but by convention (*su*). Without the School's insight that "hardness" and "whiteness" (botany and cuisine) are separable attributes rather than essential identities, the Court's distinction would look like a contradiction rather than a classification. However, the School does not supply the **decision procedure**. It tells you that the name is flexible, but not which flexibility serves the law. For that, you need the ordinary-meaning canon. The School provides the philosophy of language that makes the canon possible, but the canon provides the rule of law that makes the decision binding.
