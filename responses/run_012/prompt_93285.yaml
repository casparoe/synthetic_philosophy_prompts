      *   **Final Verdict:**
          *   Does School supply more than Ordinary-Meaning Canon?
          *   The Canon says "Use common sense." The School asks "Why does common sense override technical sense? What is the relationship between the Name and the Reality?"
          *   The School provides the *ontological groundwork* for why the Canon works (names are conventional, not natural). But it doesn't provide the *algorithm* for decision.
