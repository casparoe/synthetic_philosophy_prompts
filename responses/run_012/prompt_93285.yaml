  2.  **Deconstruct *Nix v. Hedden*:**
      *   **Facts:** Tariff Act taxed "vegetables," not "fruits." Importers argued tomatoes are botanically fruits. Court held they are vegetables.
      *   **Reasoning:** Words in statutes are used in their ordinary sense (culinary/common), not technical/scientific sense, unless specified otherwise.
      *   **Philosophical Core:** Extension of terms is fixed by *usage* (pragmatics), not *essence* (metaphysics/botany).

  3.  **Deconstruct the School of Names (Ming Jia):**
      *   **Gongsun Long:**
          *   *White Horse Dialogue:* "White horse is not horse." (Bai ma fei ma). Ambiguity of *fei* (is not). Is it denying identity ($A \neq B$) or class inclusion ($A \notin B$)? Or is it about the compound concept vs. simple concept?
          *   *Hardness and Whiteness:* Qualities (hard, white) are separate from the object (stone) and from each other. You see white but don't feel hard; you feel hard but don't see white.
          *   *On Pointing at Things (Zhi Wu Lun):* Reference vs. Referent. The name is not the thing.
          *   *Rectification of Names (Zheng Ming):* Social/Political goal. Names must match realities to ensure order.

  4.  **Drafting - Section by Section:**

      *   **First: The Court's Presupposition & The School's View.**
          *   *Court:* Extension is fixed by "ordinary meaning" (customary usage) in the specific context (commerce), not by scientific definition.
          *   *School:* They would see this as a failure of *Zheng Ming* (Rectification). The name "vegetable" is ambiguous. The Court is being asked to decide which *reality* (botanical or culinary) governs the *name* for the purpose of social order (taxation). The Court isn't asking "What is a tomato?" but "Which name governs this transaction?"

      *   **Second: The White Horse Argument.**
          *   *Paradox:* "White horse is not horse."
          *   *Reading 1 (Ambiguity of 'is not'):* "White horse" $\neq$ "Horse" (concepts differ). In *Nix*, "Tomato (botanical)" $\neq$ "Tomato (culinary)." The Court says for the Tariff, "Tomato" = "Vegetable."
          *   *Reading 2 (Criteria):* "Horse" names shape; "White" names color. "White Horse" combines them. In *Nix*, "Fruit" names seed structure; "Vegetable" names culinary use. The Court prioritizes the culinary criteria.
          *   *Reading 3 (Stuff vs. Kind):* If "Horse" is stuff, "White Horse" is a subset.
          *   *Fit:* The best fit is the *criteria* reading. The Court acknowledges the botanical truth (it is a fruit) but denies the *tariff classification* (it is not a fruit *here*). This mirrors "White horse is not horse" if read as "The concept 'white horse' is not co-extensive with 'horse' in this context."
          *   *Prediction:* If the Court followed the strict identity reading, they would have to rule based on botany (essence). They didn't.

      *   **Third: Hardness and Whiteness (Separation).**
