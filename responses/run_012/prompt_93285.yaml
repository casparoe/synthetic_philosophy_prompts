      *   **Reverse Direction: Does Nix Vindicate the School?**
          *   *Vindication:* Yes, it shows kind membership is conventional (use), not natural (botany). This aligns with the Nominalist streak in the School of Names.
          *   *Counter:* The paradoxes focus on logical identity ($A \neq B$). *Nix* is about pragmatic classification ($A$ counts as $B$ for purpose $C$). The paradoxes might be too abstract.
          *   *Verbal Charge:* The fact that the Court appeals to common understanding suggests the "White Horse" puzzle *is* verbal/linguistic, not metaphysical. It confirms the School's focus on language.

      *   **Correspondence Mapping:**
