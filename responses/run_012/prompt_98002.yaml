answer: |-
  # The Heterogeneity Problem: A Taxonomy of Pleasure

  **Core Cases:** A bite of good food; a chord change you love; the pleasure of finally getting a proof; schadenfreude; a masochist's pleasure in pain; the relief of scratching an itch.

  ```text
  ROOT: Consider the masochist's pain and the relief of scratching an itch. 
        Is there a specific sensory quality (a 'tingle' or 'glow') present in BOTH?
        │
        ├── YES ──┬── Consider the chord change and the proof. 
        │         │   Is the pleasantness a specific TYPE of feeling (like 'sweetness'), 
        │         │   or a DIMENSION of the feeling (like 'brightness')?
        │         │
        │         ├── TYPE ────────────────────────────────────────────────┐
        │         │                                                        │
        │         │                                                        ▼
        │         │                                         [1] DISTINCTIVE SENSATION VIEW
        │         │                                         (e.g., Broadie, early Mill)
        │         │                                         • Extra Idea (i) 'Determinable' usually collapses here 
        │         │                                           if the determinable is sensory.
        │         │                                         • Awkward Commitment: Must claim the masochist feels 
        │         │                                           the exact same 'glow' in pain as you do in cake.
        │         │
        │         └── DIMENSION ───────────────────────────────────────────┐
        │                                                                  │
        │                                                                  ▼
        │                                                  [2] HEDONIC TONE VIEW
        │                                                  (e.g., Feldman, Smuts, Affective Science)
        │                                                  • Extra Idea (ii) 'Valence/Arousal' fits here as 
        │                                                    a multi-dimensional tone.
        │                                                  • Awkward Commitment: Must claim quiet contentment 
        │                                                    and wild excitement share a literal 'positive axis' 
        │                                                    location despite feeling opposite.
        │
        └── NO ───┬── Consider schadenfreude and the good meal. 
                  │   If no common feeling, is 'pleasure' defined by a pro-attitude 
                  │   toward the experience, or is the category 'pleasure' fundamentally disunified?
                  │
                  ├── PRO-ATTITUDE ──┬── Consider the relief of an itch. 
                  │                  │   Is the pleasure constituted by WANTING the state to continue, 
                  │                  │   or by CONSCIOUSLY LIKING the state as it happens?
                  │                  │
                  │                  ├── WANTING ─────────────────────────────────────────┐
                  │                  │                                                    │
                  │                  │                                                    ▼
                  │                  │                                      [3] CONATIVE ATTITUDE VIEW
                  │                  │                                      (e.g., Heathwood, Desire Satisfactionism)
                  │                  │                                      • Extra Idea: Desire-based version.
                  │                  │                                      • Awkward Commitment: Must count a sleeping 
                  │                  │                                        person's satisfied desire as pleasure, 
                  │                  │                                        even if they feel nothing.
                  │                  │
                  │                  └── LIKING ──────────────────────────────────────────┐
                  │                                                                       │
                  │                                                                       ▼
                  │                                                           [4] COGNITIVE ATTITUDE VIEW
                  │                                                           (e.g., Feldman, Brentano, Chisholm)
                  │                                                           • Extra Idea (iii) 'Self-Referential' 
                  │                                                             fits here (taking pleasure in x).
                  │                                                           • Awkward Commitment: Must explain how 
                  │                                                             you can enjoy a state (e.g. sad music) 
                  │                                                             without desiring it to continue.
                  │
                  └── DISUNIFIED ────┬── Consider the proof and the food. 
                                     │   Are these two species of a real genus 'pleasure', 
                                     │   or is 'pleasure' a folk label with no psychological unity?
                                     │
                                     ├── SPECIES ───────────────────────────────────────────┐
                                     │                                                      │
                                     │                                                      ▼
                                     │                                          [5] PLURALIST VIEW
                                     │                                          (e.g., Wittgensteinian Family Resemblance)
                                     │                                          • Awkward Commitment: Must explain why we 
                                     │                                            use one word 'pleasure' if the mechanisms 
                                     │                                            are totally different.
                                     │
                                     └── FOLK LABEL ────────────────────────────────────────┐
                                                                                            │
                                                                                            ▼
                                                                                [6] ELIMINATIVIST VIEW
                                                                                (e.g., Hard Naturalism, Churchland-style)
                                                                                • Awkward Commitment: Must deny that your 
                                                                                  relief from an itch is the same kind of 
                                                                                  thing as your joy, which feels counterintuitive.
  ```

  ### Notes on Logical Space & Decisions

  **1. Desire vs. "Taking Pleasure In" (Leaves 3 & 4)**
  I have treated these as **two leaves**. While both solve the heterogeneity problem by denying a common *feeling*, they posit different psychological relations. The Conative view (Desire) makes pleasure world-to-mind (fitting the state to the desire), while the Cognitive view (Taking Pleasure In) makes it mind-to-mind (a conscious stance toward a state).
  *   **Flag:** These two leaves are difficult to pull apart phenomenologically. In many cases, consciously liking a state implies wanting it to continue. The distinction is primarily theoretical (direction of fit) rather than case-based.

  **2. Placement of Extra Ideas**
  *   **(i) Pleasure as a Determinable:** Collapses into **Leaf 2 (Hedonic Tone)**. If the "determinable" is a sensory dimension (valence), it is a tone view. If it implies a single sensory quality, it collapses to Leaf 1.
  *   **(ii) Affective Science (Valence/Arousal):** Collapses into **Leaf 2 (Hedonic Tone)**. This is simply a more granular map of the "dimension" branch.
  *   **(iii) Self-Referential "Taking Pleasure In":** Collapses into **Leaf 4 (Cognitive Attitude)**. This is the specific mechanism by which the "Conscious Liking" is achieved (the pleasure is an attitude directed at the experience itself).

  **3. Unoccupied Logical Space**
  *   **The Hybrid View (Sensation for Food, Attitude for Proof):** *Logically possible but unattractive.* No serious theorist occupies this because it is ad hoc. It solves heterogeneity by simply stipulating different mechanisms for different cases without a unifying principle, rendering "pleasure" theoretically useless.
  *   **Eliminativist about Attitudes, Realist about Sensations:** *Incoherent.* If you believe there is no common sensation (the "No" branch), you cannot be a sensation realist. If you believe there is a common sensation, you cannot be an eliminativist about the phenomenon itself.

  **4. Indistinguishable Leaves**
  *   **Leaves 3 & 4 (Conative vs. Cognitive):** As noted above, these are often functionally equivalent in standard cases. A student might find it impossible to construct a case where one holds without the other (e.g., can you *like* an itch relief without *wanting* it to last?). The distinction relies on edge cases (sleeping subjects, sad music) that may not be robust enough to sustain two distinct natural kinds.
