prompt: |-
  Hey, I'm in a third-year phil of mind / ethics module and we've just finished the hedonism unit — specifically the bit about how pleasures seem to have nothing in common. Eating a good meal, a chord change that gets you, finally cracking a proof, feeling smug about someone else's misfortune, a masochist enjoying pain — what single thing are all of those?

  The seminar gave us basically two boxes: "pleasure is a distinctive sensation" vs "pleasure is an attitude you take towards a sensation." That feels way too coarse to me. There's a whole other family of views that just say pleasures don't share any single essence and that's fine (family-resemblance-ish), and then even more deflationary ones that say "pleasure" isn't a natural kind at all, so the heterogeneity "problem" is the whole story rather than something to solve. I want to lay the space out properly for a handout.

  Can you build me a taxonomy, in tree form, for the heterogeneity problem — what, if anything, do pleasures have in common? Some things I need from it:

  - Every branch should be labelled with the question that seperates it from its siblings, phrased as a question I could actually answer about a case without already knowing which position it drops me into. So no branch that's just "are you a sensation theorist or an attitude theorist?".
  - The leaves should be named positions. Please make sure it includes at least: a distinctive-feeling / single-sensory-quality view; an attitude or pro-attitude view (and tell me whether the desire-based version and the "taking pleasure in" version are one leaf or two); a hedonic-tone view where pleasure is just your location on a single valence axis; a pluralist / no-common-essence view; and an eliminativist or deflationary view that says there's no natural kind here to theorise about.
  - One sentence per leaf on its most awkward commitment.
  - Drive the whole thing off these cases: a bite of good food, a chord change you love, the pleasure of finally getting a proof, schadenfreude, a masochist's pleasure in pain, and the relief of scratching an itch. Every branch node should be answerable using one of those.
  - Note any combinations in the logical space that nobody actually occupies, and say whether that's because the view is incoherent, just unattractive, or genuinely unexplored.
  - Flag any two leaves my tree can't really pull apart, instead of fudging it.

  Also, there are a few ideas floating around that I want the tree to be able to place, so please decide for each whether it's its own leaf or collapses into something already on the tree, and say why: (i) pleasure as a determinable with lots of determinates underneath it; (ii) the affective-science picture where pleasure is just where you sit on one valence dimension with arousal as the other axis; (iii) the self-referential "taking pleasure in" idea where the pleasure is a state directed at another one of your states.

  Keep it to a handout, so maybe six to eight leaves total. Thanks!
