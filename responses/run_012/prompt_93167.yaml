      *   **Side B (Wittgensteinian/Pragmatist-ish):** Believes the demand for justification is a category mistake. Inference is a practice/skill. The right move is to decline the question (dissolution).
      *   **Task:** Write a *joint statement* they can both sign.
      *   **Requirements:**
          1.  Numbered list of agreed claims (what the regress shows/doesn't show, nature of justification, shared rejections).
