answer: |-
  Subject: Taxonomy for reading group

  Hi there,

  Here is the decision tree you requested, written out as a continuous narrative so you can paste it directly into your handout. To use this instrument, start by asking whether suffering and enjoyment are even on the same cardinal scale, meaning can they be measured in a common unit like hedons. If you answer no, you land on Value Incommensurability, whose most awkward commitment is that you cannot rationally choose between preventing a torture and providing a lifetime of joy. If you answer yes, then ask whether there is a lexical threshold above which no amount of pleasure compensates for a pain. If you say no, you land on Classical Utilitarianism, whose most awkward commitment is that enough pinpricks can morally outweigh a single hour of intense agony. If you say yes, then ask whether that threshold applies to mild pains or only to extreme agony. If you say it applies to mild pains, you land on Strong Negative Utilitarianism, whose most awkward commitment is that preventing a minor headache outweighs saving a life of bliss. If you say it applies only to agony, you land on Lexical Negative Utilitarianism, whose most awkward commitment is that suffering just below the threshold is fully tradeable against trivial pleasures.

  Now take the lexical branches and ask whether that threshold is a fact about value itself or just about our psychology. If you say it is just psychology, you land on Psychological Threshold View, whose most awkward commitment is that an ideal agent would trade torture for tickles. If you say it is a fact about value, then ask whether aggregation across people changes anything, specifically if a pinprick that happens to a million people crosses the threshold. If you say aggregation lowers the threshold, you land on Aggregate Lexicality, whose most awkward commitment is that one person suffering intensely is worse than a million suffering mildly, but adding one more person flips the verdict. If you say aggregation does not matter, then ask whether a tiny extra pain that seems to flip the whole comparison is acceptable, which is the trapdoor case where a life with slightly more suffering is judged worse than any amount of mild contentment. If you say yes to the trapdoor, you land on Discontinuous Value Theory, whose most awkward commitment is that a microscopic increase in pain invalidates infinite pleasure. If you say no to the trapdoor, you land on Continuous Lexicality, whose most awkward commitment is that there must be a precise point where trade-offs resume despite the lexical claim.

  For the remaining branches, ask whether pleasure has positive value or merely relieves pain. If you say pleasure has no positive value, you land on Pure Negative Utilitarianism, whose most awkward commitment is that creating a happy person is morally neutral compared to not creating them. If you say pleasure has positive value, then ask whether the view is about what is good impersonally or about what we ought to do. If you say it is about what we ought to do, you land on Deontological Negative Prioritarianism, whose most awkward commitment is that you must prevent pain even if it produces no better state of affairs overall. If you say it is about what is good, then ask whether this applies to moments or whole lives, such as a life that is mostly pleasant but contains one unbearable episode. If you say it applies to moments, you land on Moment-Based Lexicality, whose awkward commitment is that a life can be bad overall despite net pleasure because of one bad hour. If you say it applies to whole lives, you land on Holistic Lexicality, whose awkward commitment is that we cannot judge actions until a life is complete. Finally, ask whether the threshold is the same for everyone or varies by person. If you say it varies, you land on Relativized Lexicality, whose awkward commitment is that saving one person from pain is more urgent than saving another from the same pain. If you say it is universal, you land on Universal Lexicality, which completes the tree.

  I should flag two combinations that seem empty. The path combining Psychological Threshold View with Impersonal Good is incoherent because if the threshold is only in our heads, it cannot define objective value. The path combining Strong Negative Utilitarianism with Aggregation Matters is unattractive rather than incoherent, as it implies a single pinprick outweighs all joy, making aggregation redundant. There are also leaves the tree cannot really separate. Discontinuous Value Theory and Universal Lexicality often yield the same practical verdicts in real-world cases, differing only in metaphysical justification about the trapdoor. Similarly, Moment-Based Lexicality and Holistic Lexicality collapse when the unbearable episode is life-ending, making the distinction moot for those specific cases. I hope this serves your group well.

  Best,
  Assistant
