prompt: |-
  I'm putting together a handout for a small reading group on lexical-threshold negative utilitarianism and whether pleasure and pain can be traded off at all. Could you build me a decision tree / taxonomy of the positions? Start from the question whether suffering and enjoyment are even on the same scale, then branch on things like: is there a lexical threshold above which no amount of pleasure compensates for a pain; is that threshold a fact about value or just about our psychology; does it apply to mild pains or only to agony; is the view about what's good or about what we ought to do; and does aggregation across people change anything. Use concrete cases to separate the branches, e.g. a single hour of intense pain versus any number of hours of mild pleasure, a pinprick that happens to a million people, a life that is mostly pleasant but contains one unbearable episode, and what I call the trapdoor: a tiny extra pain that seems to flip the whole comparison, so that a life with slightly more suffering is judged worse than any amount of mild contentment. I want each branch phrased as a question someone could answer without already knowing the label, and each leaf labelled with the position (or 'unnamed' if nobody defends it) plus one sentence on its most awkward commitment. Please also flag any combinations that seem empty and say whether that's because the view is incoherent, unattractive, or just unexplored, and flag any leaves your tree can't really separate. Don't give me a bibliography or cite anyone; I want the instrument itself. Write it as continuous prose, like an email to me -- no headings, bullet points, bold text or tables. Keep it tight, maybe eight to ten branching questions.
