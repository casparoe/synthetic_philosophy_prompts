      *   *Real vs. Descriptive:*
          *   *Descriptive:* Calling it "population management" instead of "killing."
          *   *Real:* You couldn't use broad-spectrum soaps (suffocation is painful/slow). You'd need instant neural disruption (more expensive). You'd tolerate higher crop damage. The business model might collapse.
      *   *Narrative Tension:* The protagonist inherits a system that claims to be ethical (the ledger) but is actually evasive. If she takes insect suffering seriously, she might have to destroy the business to save her soul (or the insects).

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Intellectual, analytical, but attuned to narrative potential.
