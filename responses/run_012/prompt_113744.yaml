answer: |-
  **JOINT STATEMENT ON THE STATUS AND SCOPE OF TWO-DIMENSIONAL SEMANTICS**

  **Prepared for the Workshop on Frameworks in Modal Semantics**
  **Signatories:** The Epistemic Camp (EC) & The Metasemantic Camp (MC)

  ### 1. Agreed Claims

  We, the undersigned, acknowledge a history of substantive disagreement regarding the interpretation of two-dimensional semantics. However, to facilitate productive dialogue, we endorse the following claims as a shared foundation for this workshop. These claims are restricted to the formal machinery and the diagnostic utility of the framework, excluding interpretative metaphysics.

  1.  **Formal Structure:** Both camps accept the utility of a two-dimensional matrix for modelling semantic value. We agree that semantic evaluation requires distinguishing between the *context of utterance* (the world considered as actual) and the *circumstance of evaluation* (the world considered as counterfactual). We agree that the 'diagonal' is the set of values obtained when the context and the circumstance are identical.
  2.  **Target Phenomena:** We agree that this machinery was originally deployed to resolve specific tensions in the philosophy of language and mind, namely: Kripke's contingent *a priori* (e.g., the Stick case), the necessary *a posteriori* (e.g., Hesperus/Phosphorus), and the apparent failure of substitutivity *salva veritate* in attitude reports.
  3.  **Semantic Values:** We agree that a single expression can be associated with two distinct intensions: a primary intension (varying with the context of utterance) and a secondary intension (varying with the circumstance of evaluation). We disagree on what these intensions *represent*, but agree on how to calculate them formally.
  4.  **Conditions for Adjudication:** We agree that a decisive victory for one interpretation over the other requires a case where the predictions of the Epistemic reading diverge from the predictions of the Metasemantic reading regarding truth conditions or modal status. Mere differences in gloss are insufficient; the divergence must impact the classification of a proposition as necessary, contingent, *a priori*, or *a posteriori*.

  ### 2. Disagreements Table

  The following table isolates the precise points of contention. We have attempted to formulate each position in language the holder would accept, while noting where we suspect the disagreement is terminological rather than substantive.

  | Point of Contention | Epistemic Camp (EC) Formulation | Metasemantic Camp (MC) Formulation | Status |
  | :--- | :--- | :--- | :--- |
  | **The Diagonal** | The diagonal represents a space of *epistemic possibilities*. A sentence true on the diagonal is one that cannot be ruled out by ideal rational reflection alone. | The diagonal represents the *proposition expressed* in a context. It is a semantic value derived from how reference is fixed, with no necessary link to rational reflection. | **Genuine** |
  | **The *A Priori*** | A proposition is *a priori* if it is true in all epistemically possible scenarios (i.e., true on the diagonal). This relies on an idealised notion of rationality. | A proposition is *a priori* only if its truth is guaranteed by the linguistic conventions or stipulations in force at the context. It is a matter of social practice, not ideal rationality. | **Partly Verbal** |
  | **Conceivability** | Ideal positive conceivability entails epistemic possibility. If we can coherently imagine a scenario, it constitutes a point on the diagonal. | Conceivability is a psychological heuristic. It tracks semantic competence poorly and is unreliable for determining semantic values or modal status. | **Genuine** |
  | **Reference Fixing** | Reference is fixed by the satisfaction of descriptive conditions associated with the concept by the speaker. | Reference is fixed by causal-historical chains or contextual stipulation, which may outrun the speaker's descriptive associations. | **Genuine** |

  **Note on the *A Priori*:** We acknowledge that the disagreement here is partly verbal. EC uses '*a priori*' to denote 'knowable by idealised rational reflection independent of experience'. MC uses '*a priori*' to denote 'true in virtue of meaning/stipulation in the actual context'. However, this verbal difference drives a genuine substantive divergence: EC predicts the diagonal tracks ideal rationality; MC predicts it tracks actual usage, even when irrational.

  ### 3. Cruxes: Test Cases and Predictions

  We have selected three cases where our interpretations yield divergent predictions. We agree that the handling of these cases will determine the explanatory power of each framework.

  #### (a) The Dual-Cause Term
  **Scenario:** A community introduces a term $T$ to refer to "whatever causes observable effect $E$". Later investigation reveals $E$ is produced by two unrelated underlying substances, $X$ and $Y$, in equal measure. There is no single natural kind $T$.
  *   **EC Prediction:** The primary intension is satisfied by both $X$ and $Y$ worlds. The belief "there is one cause of $E$" was *a priori* for the introducers but false. The diagonal reflects the epistemic state where $X$ or $Y$ obtains. The term is semantically ambiguous or disjunctive.
  *   **MC Prediction:** Reference was fixed by the actual causal chain. If the community interacted with both, the term refers to a disjunctive kind or fails to refer. The belief "there is one cause" was an empirical error, not an *a priori* truth. The diagonal proposition is simply false or gappy in the actual world.
  *   **Adjudication:** Does the diagonal capture the *error* in the introduction (EC) or the *failure* of reference (MC)?

  #### (b) The Empty Theoretical Term (Phlogiston Case)
  **Scenario:** A term $P$ is introduced with the presupposition that there exists a substance released during combustion. It turns out no such substance exists; combustion is oxidation.
  *   **EC Prediction:** The concept is coherent (conceivable), so the diagonal is defined. There are epistemic possibilities where $P$ exists. The term has a primary intension (the role) but no secondary intension (no filler).
  *   **MC Prediction:** Without a referent, there is no content. The diagonal proposition is false or lacks truth value. The 'meaning' was merely a failed attempt to latch onto a property; the framework should not model this as a genuine epistemic possibility.
  *   **Adjudication:** Does the framework model the *coherence of the mistake* (EC) or the *semantic failure* (MC)?

  #### (c) The Unproved Theorem
  **Scenario:** A mathematical statement $S$ is true and provable within the system, but the proof requires 1,000 pages of work beyond any human's cognitive capacity. No one has proved it.
  *   **EC Prediction:** $S$ is *a priori* knowable (by an ideal agent). It is true on the diagonal. Our ignorance is a contingent limitation of human processing, not a feature of the semantic space.
  *   **MC Prediction:** $S$ is not *a priori* for us. The diagonal reflects the semantic value in our context, which is constrained by our actual epistemic practices. The framework should not commit to idealised rationality.
  *   **Adjudication:** Does the diagonal represent *human* epistemic space (MC) or *ideal* epistemic space (EC)?

  ### 4. Assessors' Verdict on Theoretical Rivalry

  **Question:** Are the two readings actually rivals or just two different jobs for one bit of machinery?

  **Answer:** They are **substantive rivals**, not merely complementary tools.

  While both camps utilise the same formal matrix, they are competing for the same explanatory territory. The dispute is not simply that one camp uses the tool for psychology and the other for linguistics; both claim their reading provides the correct account of *modality* and *meaning*.

  1.  **Metaphysical Stakes:** The Epistemic Camp claims the diagonal reveals the structure of modal space (epistemic possibility is a genuine species of possibility). The Metasemantic Camp claims the diagonal is a derivative semantic artefact with no modal weight. These are contradictory claims about the nature of reality.
  2.  **Explanatory Direction:** The Epistemic Camp uses the diagonal to explain reference (conception determines reference). The Metasemantic Camp uses reference to explain the diagonal (reference fixing determines the diagonal proposition). This is a fundamental disagreement on the direction of determination.
  3.  **The "Job" Argument:** If they were merely different jobs, they could coexist without contradiction. However, they contradict each other on the classification of specific sentences (e.g., the Dual-Cause case). If EC says a belief is *a priori* and MC says it is empirical, they cannot both be right about the world, even if their maths is identical.

  **Conclusion:** The machinery is shared, but the philosophy is incompatible. They are rivals offering competing metaphysical morals drawn from the same formalism.

  ***

  **Note to the User:**
  You asked me to tell you straight whether they are rivals or complementary. My assessment in Section 4 above reflects my analysis of the literature and the logic of the positions. While some conciliatory figures (like certain contextualists) try to blend them, the core commitments of the Chalmers-style epistemic reading and the Stalnaker-style metasemantic reading are logically inconsistent regarding the nature of the *a priori* and the metaphysical weight of the diagonal. They are rivals.
