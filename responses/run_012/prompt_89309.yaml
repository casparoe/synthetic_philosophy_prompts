  Some friends and I have a monthly dinner-and-argue thing where one of us has to "teach" the group something for about 90 minutes, and my turn is coming up. I've picked Keynes on probability and uncertainty, mostly because I keep running into the phrase radical uncertainty in finance writing and realized I don't actually understand what's being claimed, and I suspect the table will walk in with the same half-right picture I had — basically "risk is when you've got the numbers, uncertainty is when you don't." As I understand it the interesting move is stranger than that: Keynes thought a probability was a logical relation between your evidence and a claim — how far the evidence really does partially imply the conclusion — rather than how strongly you happen to believe it, and then there's a second thing he called the weight of the argument that isn't the same as the probability at all, since piling on new evidence can push the probability down while pushing the weight up. I might be mangling it, so fix me where I'm off, but if that's roughly right it's the part I want the session to land on, because nobody at the table will have heard it before — the one guy who does quant stuff will definately say it's just subjective probability with extra steps, so build the plan ready for that.

  So don't explain Keynes to me — plan how I should explain him. What has to be in place in their heads before the probability-versus-weight distinction can even make sense, and in what order; what single example should carry the whole 90 minutes (I was reaching for a coin with an unknown bias, or an urn where you don't know the mix, but tell me if something else would do the job better and why the obvious coin/urn thing might be a mistake); the misconceptions you'd expect from a table that's half finance people and half not — my guesses are "uncertainty just means you can't put a number on it" and "this is Keynes being fuzzy and anti-maths" — and exactly where in the sequence I should head each one off; one question I can put to the group at the end that would actually show whether the distinction landed rather than just that they nodded along; and what I should deliberately skip at this level and say out loud that I'm skipping. Lead with the whole plan squeezed into a single sentence — the arc in one line — then unpack it from there, no preamble.
