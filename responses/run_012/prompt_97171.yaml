          *   *Variant B (Looking while handling):* This is the crucial empirical test. If he looks *while* touching, he builds the association.
          *   *Implication:* This confirms Molyneux/Locke's point: the barrier is the *lack of experienced correlation*. If simultaneous perception solves it, then the ideas *can* be linked, but not *innately* or *immediately*. It proves the empiricist thesis: the connection is learned, not inherent in the ideas themselves. It shows the difficulty *is* about the absence of correlation, not an impossible metaphysical gap.

      *   **Addressing Q6 (The Dropped Distance Question):**
          *   *Context:* Molyneux originally asked about shape *and* distance (reachability).
          *   *Reasoning:* Distance perception (depth) relies on cues (binocular disparity, accommodation, etc.) that are purely visual but interpreted via movement/touch.
          *   *Impact of dropping it:* Focusing solely on shape (figure) isolates the problem to *spatial extension* perceived in two modes. Distance is about *where* in space; shape is about *what* in space.
          *   *Verdict:* Dropping distance sharpens the point. Distance might be argued as purely visual (optics). Shape is inherently tactile *and* visual. By removing distance, Locke focuses on the *quality* of the object (figure) rather than its *relation* to the observer. It makes the problem about the nature of the object's properties, not the subject's spatial location. It strengthens the claim about the heterogeneity of sensory ideas regarding object properties.

  4.  **Review and Refine:**
