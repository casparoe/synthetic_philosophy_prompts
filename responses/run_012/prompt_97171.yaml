      *   **Addressing Q4 (Molyneux's Reason vs. Locke's "Certainty"):**
          *   *Molyneux's Reason:* "has not yet attained the Experience, that what affects his touch so or so, must affect his sight so or so." This is explicitly about *correlation/experience*, not metaphysical non-resemblance. It's an empirical gap, not necessarily a necessary one (though Locke implies a deep disconnect).
          *   *Locke's "Certainty":* Locke adds "would not be able with certainty to say."
          *   *Reasoning:* Why "certainty"? Because a guess is possible. Epistemologically, knowledge requires justification. A lucky guess isn't knowledge. Locke is careful not to claim the man *must* fail, but that he cannot *know*. This aligns with Locke's empiricism: knowledge comes from experience. Without the specific experience of linking the two sensory modalities, there is no justification for the judgment, hence no certainty.
          *   *Resemblance:* Molyneux mentions the "protuberant angle... shall appear to his eye, as it does in the Cube." This suggests the *idea* of the angle in touch (pressure/unequal pressure) is different from the idea in sight (light/shadow/outline). So it's both: the ideas feel different, *and* the link is unlearned.

      *   **Addressing Q5 (User's Variants):**
