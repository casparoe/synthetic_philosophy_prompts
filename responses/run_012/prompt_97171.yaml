      *   **Addressing Q1 (Distinguish vs. Tell):**
          *   *Textual Analysis:* "distinguish, and tell, which is the Globe, which the Cube."
          *   *Reasoning:* To "tell which is which" implies identification, not just discrimination. If I see two different things but don't know which name applies to which visual pattern, I haven't answered the *quaere*.
          *   *Physics/Epistemology link:* Discrimination requires perceiving a difference ($\Delta$). Identification requires mapping that difference to a prior concept (Touch-Cube $\rightarrow$ Sight-Cube).
          *   *Conclusion:* The text demands identification. If he could only discriminate (one looks round, one square) but not identify (which is the "cube" I touched?), the answer remains "No." The text is not indifferent; identification is the higher bar that includes discrimination.

      *   **Addressing Q2 (Sphere vs. Globe):**
          *   *Textual Analysis:* Supposition uses "Sphere," Question uses "Globe."
          *   *Reasoning:* In 17th-century usage, these were often interchangeable regarding shape. However, "Globe" might emphasize the *visual appearance* (shadow, shading, outline) whereas "Sphere" is the geometric solid.
          *   *Verdict:* Likely a rhetorical variation rather than a philosophical pivot. Locke isn't usually that subtle with terminology unless defined. It doesn't change the logic of the argument. It's probably stylistic variation to avoid repetition, though "Globe" leans slightly more toward the visual phenomenon.

      *   **Addressing Q3 (Controls: Metal and Bigness):**
