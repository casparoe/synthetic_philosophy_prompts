          *   *Metal:* Eliminates reflectivity/color differences. If one was gold and one lead, brightness/color might cue the blind man (if he knew the material properties by weight/temp previously, or if sight revealed color immediately). It isolates *figure*.
          *   *Bigness:* Eliminates size as a cue. If the cube were huge and the sphere tiny, size might be the distinguishing feature, not shape.
