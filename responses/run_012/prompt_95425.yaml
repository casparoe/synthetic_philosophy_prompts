answer: |-
  **The Weight of What's Gone**

  Open any introductory economics textbook, and you will find the doctrine of sunk costs stated with the confidence of a law of physics: past expenditures that cannot be recovered are irrelevant to future decision-making. To let them influence you is the "sunk cost fallacy," a cognitive error akin to believing a roulette wheel is due for a red after a streak of blacks. The logic is clean. You cannot get the money, time, or effort back. Therefore, the only rational question is whether the *future* benefits of continuing outweigh the *future* costs. The past is dead; bury it.

  This textbook version is mathematically sound within its specific, narrow model. But as a guide to human life, it is often useless, and sometimes wrong. The reason the debate feels so intractable is that proponents of the standard view and their critics are usually talking past each other. To find the truth, we have to split the question in two.

  First, there are cases where the past expenditure has physically or socially altered the world in a way that bears on the future. You have spent three years learning French; quitting now wastes that time, but continuing leverages a skill you now possess. You have built half a machine; finishing it costs less than starting a new one. You have invested in a startup; walking away signals unreliability to future investors. In these scenarios, the past expenditure is not a "sunk cost" in the normative sense; it is a causal antecedent. The money is gone, but it bought a changed reality (a skill, a half-built machine, a reputation) that alters the future cost-benefit analysis. Everyone, including hardline economists, agrees you should consider these factors. This isn't honoring sunk costs; it's responding to present assets created by past spending.

  The real fight is the second category: cases where the only thing that has changed is that you *spent* something, and the bare fact of that expenditure is offered as the sole reason to continue. The machine is useless half-built. The skill is transferable nowhere. No one is watching your reputation. You bought a ticket to a movie, sat through twenty minutes of drivel, and feel compelled to stay simply because you paid for the ticket. Standard theory says leaving is rational. Defenders of sunk cost sensitivity say staying can be rational. To decide who is right, we have to take the strongest defenses of category (b) seriously.

  **The Commitment Story**
  The first defense argues that honoring sunk costs is a form of precommitment. If I establish a policy of finishing what I start, I make my future threats and promises credible. Even if finishing *this* specific project is a net loss, the act of finishing maintains a reputation for grit that pays dividends in unrelated future negotiations.

  This argument survives scrutiny only if we strip it of its backward-looking clothing. It is not actually about the past expenditure; it is about future reputation management. The "cost" being weighed is not the money already spent, but the future cost of being perceived as a quitter. If the reputation effect is real, this collapses back into category (a): the past spend created a reputational asset you are now protecting. If there is no audience and no future consequence—if you are alone on a desert island finishing a sandcastle—the commitment story evaporates. It smuggles a forward-looking consideration (credibility) in under a backward-looking label.

  **The Self-Knowledge Story**
  A more psychological defense suggests that my having stuck with something this long is evidence about what I value. If I walked away the moment things got hard, I would never discover which difficulties were signal and which were noise. By treating past investment as a reason to stay, I signal to myself that I am the kind of person who endures.

  This is partially a Bayesian update: "I chose this initially; assuming I wasn't totally irrational then, I probably still value it." That is forward-looking evidence. But the stronger version is about identity maintenance. If I treat my past commitments as disposable, I may erode my own capacity to commit in the future. However, like the commitment story, this is largely instrumental. It justifies the sunk cost sensitivity only insofar as it produces better future psychological states. It treats the past as a training ground for the future. It is a pragmatic heuristic, not a fundamental moral justification for the past mattering in itself.

  **The Constitutive Story**
  Here we reach the philosophical heavy lifter. Some goods are inherently historical. A friendship, a marriage, a career, or a tradition is not a series of discrete transactions where you calculate the utility of the next hour. The value of the good *is* the history itself.

  If you view a twenty-year marriage through the lens of expected utility, you might find a younger, more compatible partner and calculate that switching yields higher future happiness. But to do so is to misunderstand what a marriage is. The value of the relationship is constituted by the shared past. The time spent is not a cost to be recouped; it is the substance of the good. In these cases, "ignoring the sunk cost" means ignoring the very thing that makes the project valuable.

  This defense survives where the others fail because it does not smuggle in forward-looking consequences. It argues that the past is literally part of the present value function. For constitutive goods, the distinction between (a) and (b) dissolves, because the expenditure *is* the product. To say the past shouldn't matter is to say the history of the relationship shouldn't matter, which is false by definition of the relationship.

  **The Rule versus Act Story**
  Finally, there is the argument from bounded rationality. Idealized agents can calculate expected utility flawlessly. Humans cannot. We are prone to temporary despair, present bias, and optimism shifts. If an agent knows they have a tendency to bail prematurely when the going gets tough, a blanket rule of "I don't quit" might maximize utility over a lifetime, even if it forces them to endure some specific, miserable projects that an ideal calculator would abandon.

  This is a genuine defense, but it concedes the main point. It admits that honoring the sunk cost in the specific instance is irrational (sub-optimal for that act) but argues that the *policy* is rational (optimal for the agent). This is second-order rationality. It justifies the behavior not because the past matters, but because the agent is too flawed to correctly assess the future without a rigid rule.

  **The Criterion**
  So, which defenses survive, and what do they tell us? The Commitment and Self-Knowledge stories are largely forward-looking in disguise. They justify the behavior, but they don't justify the *principle* that the past matters intrinsically. They show that honoring sunk costs is often a proxy for protecting future assets (reputation, identity stability).

  The Constitutive and Rule-based stories are the exceptions. The Constitutive story shows that for certain goods (relationships, traditions), the past is not a cost but a component of value. The Rule-based story shows that for bounded agents, ignoring the past is sometimes too cognitively expensive or dangerous.

  This gives us a criterion for when the past legitimately enters a decision. The past matters if:
  1.  **Constitutivity:** The good in question is defined by its continuity (e.g., a relationship, a vow, a cultural practice).
  2.  **Systemic Fragility:** The agent is prone to specific cognitive biases (like present bias) that make case-by-case calculation unreliable, and the cost of the rule (finishing bad projects) is lower than the cost of the error (quitting good projects).

  If neither of these is true—if the project is fungible (like a movie ticket) and the agent is capable of cold calculation—then the past has no legitimate claim.

  **The Verdict**
  Is the statement "honoring sunk costs is always irrational" true or false?

  It is false.

  It is true only for idealized agents operating on fungible goods in a vacuum. For human beings, embedded in social contexts and constitutive relationships, the principle is a dangerous oversimplification. The consensus among economists that sunk costs *must* be ignored is a consensus about a specific mathematical model, not a consensus about rational agency in the real world. In the real world, the past often bleeds into the future, not just causally, but constitutively.

  However, we must be honest about the danger. Most of the time, when people invoke sunk costs, they are not protecting a constitutive good or following a wise heuristic; they are just throwing good money after bad because they hate loss. The textbook warning is vital because the default human setting is emotional attachment to waste, not cold calculation.

  But as a universal normative law? It fails. To say the past never matters is to say that history never matters. And while that might work for a spreadsheet, it does not work for a life. The rational agent ignores the cost of the ticket when deciding whether to watch the movie, but honors the cost of the years when deciding whether to save the marriage. The difference isn't in the math; it's in the meaning.
