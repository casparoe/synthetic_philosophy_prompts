  8.  **Final Polish:** Ensure the distinction between "Substantive" and "Two Questions" is clear. It's substantive *that* they are different questions, but the dispute arises because everyone thought they were the same question. Progress comes from decoupling them.

      *(Self-Correction on Camp 4)*: Camp 4 is often about context-sensitivity or evidential support. I should mention that this camp often argues the probability operator in the triviality proof is too coarse-grained.

