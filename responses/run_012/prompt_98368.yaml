answer: |-
  # Desiderata for a Theory of Cooperation and the Prisoner's Dilemma

  **To:** The Working Group on Evolution and Cooperation
  **From:** [Your Name/Role]
  **Subject:** Constraints and Requirements for Theoretical Adequacy

  The following document establishes the criteria for evaluating candidate theories regarding the Prisoner's Dilemma (PD) and the evolution of cooperation. These desiderata are designed to prevent theories from solving the puzzle by definitionally dissolving it. They distinguish between logical constraints inherent to the model, empirical constraints imposed by data, and evolutionary constraints imposed by biological plausibility.

  ## I. The Desiderata

  The requirements are divided into **Non-Negotiable** (the theory fails if these are not met) and **Optional** (desirable refinements that distinguish superior theories but do not invalidate those that lack them).

  | ID | Requirement | Type | Rationale (Why this is a requirement) |
  | :--- | :--- | :--- | :--- |
  | **D1** | **Payoff Integrity** | **Non-Negotiable** | The theory must respect the ordinal payoff structure of the PD ($T > R > P > S$). If a theory explains cooperation by claiming the payoffs are actually those of a Coordination or Assurance game, it has changed the subject, not solved the dilemma. |
  | **D2** | **The One-Shot Anomaly** | **Non-Negotiable** | The theory must account for the divergence between the Nash prediction (100% Defection) and empirical observation (significant Cooperation) in anonymous one-shot settings without relying on hidden repetition. Ignoring the data makes the theory descriptively false; ignoring the logic makes it theoretically incoherent. |
  | **D3** | **Equilibrium Selection** | **Non-Negotiable** | In indefinitely repeated games, the Folk Theorem allows for infinite equilibria. A theory must provide a mechanism (learning, selection, focal point) that selects *specific* cooperative equilibria over non-cooperative ones. Merely showing cooperation *can* exist is insufficient. |
  | **D4** | **Robustness to Noise** | **Non-Negotiable** | The theory must demonstrate stability in the presence of implementation error or perception noise. Strategies that are stable in a vacuum but collapse under slight perturbation (e.g., strict Tit-for-Tat) are evolutionarily implausible. |
  | **D5** | **The Altruism Distinction** | **Non-Negotiable** | The theory must distinguish between *mutually beneficial cooperation* (enlightened self-interest) and *genuine altruism* (net cost to the actor). Conflating utility maximization with other-regarding preferences obscures the evolutionary mechanism. |
  | **D6** | **Scalability** | **Non-Negotiable** | The theory must explain how cooperation extends beyond the limits of kin selection (Hamilton's Rule) and dyadic reciprocity (Dunbar's number). A theory that works only for small groups fails to explain human societal scale. |
  | **D7** | **Justification of Shadow** | **Non-Negotiable** | If the theory invokes repeated interaction, it must justify the discount factor ($\delta$). It cannot assume a "shadow of the future" without explaining why agents believe the interaction will continue or why they value future payoffs sufficiently. |
  | **D8** | **End-Game Consistency** | **Optional** | The theory should address the "unraveling" problem in finite repeated games. While standard theory predicts immediate defection, empirical data shows late-stage unraveling. Explaining this delay is a mark of sophistication, though not strictly required for basic adequacy. |
  | **D9** | **Punishment Stability** | **Optional** | If the theory uses punishment to sustain cooperation, it must account for the cost of punishing. It must solve the "second-order free rider" problem (why punish those who don't punish?). |

  ## II. The Critical Constraint (The "Killer" Requirement)

  **Requirement D3 (Equilibrium Selection)** does the most to eliminate candidate theories.

  Many models successfully demonstrate that cooperation is *possible* (i.e., it is an equilibrium). However, the "Folk Theorem" problem implies that defection is *also* an equilibrium, often a more robust one in the short term. A theory that cannot explain why a population converges on the cooperative equilibrium rather than the defective one is predictively empty. This requirement eliminates any model that relies solely on the existence of cooperative Nash equilibria without a dynamic account of selection, learning, or cultural transmission.

  ## III. Joint Satisfiability Analysis

  You asked whether any subset of these requirements is jointly unsatisfiable. **Yes.** There is a logical trilemma inherent in the standard formulation of the problem. The following three propositions cannot be simultaneously true under standard game-theoretic definitions:

  1.  **Strict Instrumental Rationality:** Agents maximize expected utility based solely on material payoffs defined in D1.
  2.  **Common Knowledge of Finitude:** Agents know the interaction is one-shot or has a known finite horizon.
  3.  **Observed Cooperation:** Agents cooperate at rates significantly above zero.

  **Analysis:**
  *   If (1) and (2) hold, backward induction dictates 100% defection. (3) is impossible.
  *   If (1) and (3) hold, (2) must be false (agents must believe there is a shadow of the future, violating the "One-Shot" condition).
  *   If (2) and (3) hold, (1) must be false (agents are not strictly instrumentally rational regarding material payoffs; they must have social preferences).

  **Conclusion:** An adequate theory **must** explicitly reject or modify one of these three propositions. A theory that attempts to maintain all three is logically incoherent. Most successful theories sacrifice (1) by introducing social preferences (inequality aversion, warm glow) or sacrifice (2) by arguing that "one-shot" interactions are cognitively treated as repeated (the "Artifact" claim). The desiderata require you to state *which* horn of the trilemma you are accepting.

  ## IV. Adjudication of Specific Proposals

  The working group must evaluate the following three proposals against the desiderata above.

  ### 1. The "Coordination Reframing" Proposal
  *Claim:* The one-shot dilemma is really a coordination problem because players choose conditionally on beliefs about the other.
  *   **Adjudication:** **Change of Subject (Violates D1).**
  *   **Reasoning:** The definition of the Prisoner's Dilemma rests on the dominance of the Defect strategy regardless of the opponent's choice. If a player's optimal choice depends on their belief about the opponent's action, the payoff structure is no longer a PD; it is an Assurance or Coordination game. While this may describe how humans *perceive* the situation psychologically, it does not solve the PD; it denies the PD exists in the wild. To be admissible, this proposal must argue that the *objective* payoffs are different from the *nominal* payoffs, which requires empirical justification of the utility function, not just a reframing of the game matrix.

  ### 2. The "Artifact/Traces" Proposal
  *Claim:* The one-shot puzzle dissolves because real interactions always leave traces (reputation/repetition), making the "one-shot" case an artifact.
  *   **Adjudication:** **Dodges the Puzzle (Violates D2 & D7).**
  *   **Reasoning:** This claim asserts that the "One-Shot" condition is never empirically met. While likely true in ancestral environments, experimental economics isolates variables to test mechanisms. If the theory claims cooperation *only* occurs when traces exist, it fails to explain cooperation in rigorously controlled anonymous experiments where traces are minimized. Furthermore, per **D7**, simply asserting a "shadow of the future" exists is insufficient; the theory must explain why the discount factor $\delta$ remains high enough to sustain cooperation even when the probability of future encounter is objectively near zero. If the theory relies on the *belief* in traces despite evidence to the contrary, it shifts the problem to explaining that systematic cognitive error.

  ### 3. The "Punishment Stabilization" Proposal
  *Claim:* Punishment stabilizes cooperation by penalizing defectors.
  *   **Adjudication:** **Relocates the Difficulty (Triggers D9).**
  *   **Reasoning:** Punishment is costly for the punisher. In a population of self-interested agents, a "cooperator who punishes" is outcompeted by a "cooperator who does not punish" (the second-order free rider), who gains the benefits of order without the cost of enforcing it. Therefore, invoking punishment does not solve the cooperation problem; it pushes it back one step to the "evolution of punishment." To satisfy **D9**, the proposal must explain how punishers are protected from second-order free riders (e.g., via meta-norms, group selection, or signaling benefits). Without this, punishment is evolutionarily unstable.

  ## V. Summary Instruction for the Group

  When evaluating models this term, do not ask "Does this model allow cooperation?" Ask **"Which of the three trilemma propositions does this model sacrifice, and is that sacrifice justified?"**

  *   If it sacrifices **Rationality**, does it provide a plausible utility function (e.g., social preferences)?
  *   If it sacrifices **Finitude**, does it provide a mechanism for the illusion of the infinite (e.g., cognitive bounds)?
  *   If it sacrifices **Standard Payoffs**, does it provide evidence that humans value things other than material gain?

  Any theory that claims to keep all three while explaining cooperation is mathematically inadmissible.
