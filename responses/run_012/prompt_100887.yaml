answer: |-
  **Brainstorming Constraints: The Contingency View**

  Before writing, I must clarify what this speech *cannot* say, given the commitment to contingency:

  1.  **No Inevitability:** I cannot suggest the Terror was the logical outcome of Jacobinism or that Robespierre's fall was historically determined. To do so would betray the core argument that choices remained open until the moment they were closed.
  2.  **No Abstract Moralising:** I cannot treat the victims as mere data points in a sociological model. With descendants of the Terror's victims in the room, abstraction is an insult. The blood must be acknowledged as real, not metaphorical.
  3.  **No Teleology:** I must avoid implying the Revolution was moving toward a specific end (liberty, tyranny, the modern state). It was stumbling forward, reacting to crises.
  4.  **No Jargon Shield:** The concept of "legitimacy debt" must be explained through narrative and logic, not defined academically. The historians want rigour; the others want clarity. Both get the same thing: plain speech about complex mechanics.
  5.  **No Cynical Detachment:** I cannot sound as though I find the violence intellectually stimulating. The tone must be grave. The "devouring" is a tragedy, not a punchline.

  ***

  **Keynote Address: The Debt of Thermidor**

  Good evening.

  It is fitting, I suppose, that we gather in the heat of July to speak of Thermidor. There is a specific weight to this anniversary. We are not merely discussing dates in a ledger; we are marking the moment the heat broke, when the Republic turned on itself.

  The question put to me is the old one: do revolutions devour their children? It is a phrase we know well. It comforts us, in a dark way. It suggests a pattern, a law of nature. If revolutions *always* eat their young, then the blood spilled was not waste, but necessity. It was the price of history unfolding.

  I stand before you to suggest something harder. I do not believe history unfolds on schedule. I do not believe there was an iron logic that demanded Danton die, or Hébert, or Robespierre. They made choices. They could have chosen otherwise. The door was not locked until they closed it themselves.

  But if it was not fate, why did it happen? Why does the pattern repeat, from Paris to Petrograd?

  I want to propose a mechanism. Not a law of history, but a structural burden. Let us call it a 'legitimacy debt'.

  Consider the founding act of any revolution. It is, by definition, an act no existing authority could authorise. It is illegal. It is a breach. To build a new order on such a breach, you incur a debt. You have stolen the authority to rule. How do you repay that debt? You cannot pay it with law, because the law you broke is the very thing you are replacing.

  You can only repay it by repeating the act.

  To justify the founding violence, you must prove continuously that the old order was truly dead, and that the new authority is the only thing holding back the chaos. You must keep performing the revolution to validate the revolution.

  This is where the devouring begins. It is not because the leaders are bloodthirsty monsters, though some were. It is because the founders eventually become the obstruction. Robespierre in Year II was not the same figure as Robespierre in Year I. The man who broke the law becomes the man who embodies the law. And in a regime founded on breaking the law, embodying the law is a capital offence.

  To service the legitimacy debt, the revolution must consume the very people who issued it. They become the evidence that the revolution is over, that it is settling, that it is becoming just another government. And a revolution cannot afford to be just another government. Not while the debt is outstanding.

  So, they fall. Not because of class contradictions, but because their existence suggests the emergency is over. And if the emergency is over, why was the founding violence necessary?

  I know there are people in this room for whom this is not theory. There are families here who lost someone to the Tribunal. A great-uncle vanished in the purge; a grandmother silenced. For you, the phrase 'legitimacy debt' might sound too clean. Too neat.

  It is not neat. It is a ledger written in blood. When I say the debt must be serviced, I mean people must die to justify the deaths that came before. The story we tell—that revolutions *always* devour their children—is itself part of the payment. We tell ourselves it was inevitable so we do not have to admit it was chosen. We say 'history demanded it' so we do not have to say 'we decided it'.

  But contingency remains. The door was open. Thermidor was a choice. The Directory was a choice. Each time, the debt came due, and the coin was human life.

  So, when we ask if revolutions devour their children, the answer is not 'yes' as a law of nature. The answer is 'yes' because the founders borrow against a future they cannot guarantee, and when the bill arrives, they have nothing left to pledge but themselves.

  We are here tonight to remember the dead. Let us not honour them by calling their deaths inevitable. They were not sacrifices to a god named History. They were payments on a debt incurred by men who thought they could authorise the unauthorisable.

  The debt remains. The question is whether we are still paying it.

  Thank you.
