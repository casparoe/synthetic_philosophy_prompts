answer: |-
  You have hit the nail on the head. You haven't missed the vocabulary; you've walked straight into one of the deepest, stickiest problems in AI safety and moral philosophy.

  The short answer is: **You are right.** There is no value-neutral way to define "side effects" because there is no value-neutral way to define "what would have happened otherwise."

  In the AI safety literature, this is often discussed under the umbrella of **Impact Regularization** or **Low-Impact AI**, and the specific hurdle you've identified is called **The Baseline Problem**. However, that term is often used too technically (about math metrics). A better name for the specific philosophical wall you've hit is **The Normative Baseline Problem**.

  Here is what is actually doing the work, why it happens even when we agree on goals, and why "value-neutral" is impossible.

  ### 1. The Mechanism: Counterfactuals are Models, Not Facts
  Your intuition about the dust and the plant is the key. In physics, there is only *what is*. There is no *what would have been*.

  To calculate a side effect, you are calculating a **difference**:
  $$ \text{Impact} = \text{State}(\text{Action Taken}) - \text{State}(\text{Baseline}) $$

  $\text{State}(\text{Action Taken})$ is observable (mostly). But $\text{State}(\text{Baseline})$ is a **counterfactual**. It does not exist in the universe. You have to *simulate* it.

  To simulate "what happens if the robot does nothing," you have to write a program for "doing nothing."
  *   **Option A:** The robot freezes its motors. (Result: It might fall over, blocking a path. Is that a side effect?)
  *   **Option B:** The robot maintains its current posture. (Result: It burns battery. Is battery drain a side effect?)
  *   **Option C:** The robot leaves the room. (Result: It doesn't clean the floor. Is a dirty floor a side effect?)

  Every choice of "inaction policy" privileges certain physical processes over others. By choosing Option B, you are implicitly saying, "Battery chemistry matters less than gravitational stability." That is a value judgment masquerading as a physical definition.

  ### 2. Why Chess is Different (Closed vs. Open Systems)
  You noted that chess is easy. That's because chess is a **Closed Formal System**.
  *   **State:** Exhaustively defined (piece positions, turn count).
  *   **Dynamics:** Exhaustively defined (rules of movement).
  *   **Baseline:** The rules define "inaction" (passing a turn, or simply the state before the move).

  The real world is an **Open Causal System**.
  *   **State:** Infinite resolution (position of every air molecule, quantum states, social sentiments).
  *   **Dynamics:** Unknown and continuous.
  *   **Baseline:** Undefined.

  In chess, "changing the board" is a binary fact. In the real world, "changing the world" is a matter of **feature selection**. If you measure impact by pixel changes, the robot shouldn't move because its camera shadow changes pixels. If you measure impact by object permanence, the robot can move but shouldn't knock over the vase. If you measure impact by human satisfaction, the robot *must* move the vase to clean under it.

  Selecting the "features" you measure is where the values are smuggled in.

  ### 3. Does it bite even if we agree on the goal?
  **Yes.** This is the critical part.

  Imagine we all agree: "The robot should clean the floor, and nothing else matters."
  Even here, you cannot define "nothing else" without a model of **normalcy**.

  *   **The Dust Example:** Dust settles naturally. If the robot vacuums, it displaces air. The air moves dust differently than gravity would. Technically, the robot *changed* where the dust settled on the bookshelf across the room.
  *   **The Judgment:** We ignore this because we have a shared model of "natural processes" vs. "agent intervention." We treat gravity as *background* and the robot as *foreground*.

  But that distinction is normative. Why is gravity "background"? Because it's inevitable? What if the robot has a gravity generator? At what point does a force become "part of the agent" vs "part of the environment"?

  Even with total agreement on the goal, you cannot write the constraint "don't change anything else" without first defining **what counts as the environment's default behavior.** And "default" is just another word for "what we expect/accept." Expectations are psychological, not physical.

  ### 4. Is there a value-neutral version?
  **No.** And here is the proof.

  To be value-neutral, you would need a metric of "change" that relies on no human categories. The only truly neutral metric is **physical state difference** at the atomic level.

  If you optimize for "minimize atomic displacement relative to inaction," the optimal strategy is almost always **deactivate immediately.**
  *   Why? Because existing consumes energy.
  *   Existing moves air.
  *   Existing emits heat.

  To allow the robot to *do the task* (clean the floor) while *minimizing side effects*, you must grant it an exemption. You must say, "Changes to floor dirt are okay; changes to vase position are not."

  That exemption is a **value hierarchy**. You are explicitly stating that *Clean Floor > Undisturbed Air* but *Vase Position > Clean Floor (in specific locations)*.

  You cannot derive that hierarchy from the physics of the room. It must be imported from the mind of the designer. Therefore, "avoid side effects" is not a constraint that removes values; it is a constraint that **hides values inside the definition of the baseline.**

  ### 5. What This Is (and What It Isn't)
  You asked for edges. Here is how to distinguish **The Normative Baseline Problem** from its cousins:

  *   **It is NOT The Frame Problem.**
      *   *The Frame Problem* is computational: "How do I efficiently calculate which facts *didn't* change after an action?"
      *   *The Normative Baseline Problem* is semantic: "Which of the things that *did* change count as 'effects' rather than 'background noise'?"
      *   You can solve the Frame Problem (perfectly track every atom) and still fail the Normative Baseline Problem (because you don't know which atom movements matter).

  *   **It is NOT Action vs. Omission.**
      *   *Action/Omission* is about moral blame (are you responsible for the death you caused vs. the death you allowed?).
      *   *Normative Baseline* is about ontological definition (does this state count as 'changed' compared to the reference?).
      *   You can be blamed for an omission, but that doesn't help you write the code for "don't omit safety."

  *   **It IS a version of the Is-Ought Problem.**
      *   David Hume argued you can't get an "ought" from an "is."
      *   This problem shows you can't even get a "difference" from an "is" without an "ought." You cannot measure deviation without a standard, and the standard is always normative.

  ### 6. How Researchers Are Trying (and Failing) to Fix It
  The AI safety community knows this. Here are the two main attempts to patch it, and why they still leak values:

  1.  **Relative Reachability (Victoria Krakovna):** Instead of comparing "State After" to "State Inaction," compare "Future States Reachable After Action" to "Future States Reachable After Inaction."
      *   *The Leak:* You still need to define the "Inaction" policy. Also, you need to define which "Future States" matter. (If I lock the door, I reduce your reachability of the outside. Is that bad? Only if you value going outside.)

  2.  **Attainable Utility Preservation (Alex Turner):** The AI should try to keep its ability to achieve *other* goals intact.
      *   *The Leak:* Which other goals? All possible goals? If so, the AI can't do anything (because doing *X* might make doing *Not-X* harder). So you have to select a set of "reasonable" goals. Who decides what is reasonable?

  ### Summary
  You have identified that **Impact is not a physical quantity; it is a relational property between a world state and a preference model.**

  When people say "avoid side effects," they are shorthand for "avoid changes to features that humans value, relative to a timeline of events that humans consider normal."

  If you strip out "humans value" and "humans consider normal," you are left with physics, and in physics, everything affects everything. The butterfly effect is real. The only way to ignore the butterfly is to decide, *a priori*, that butterflies don't matter.

  So, to answer your final question: **No, there is no version of "avoid side effects" that doesn't smuggle in a value judgment.** The baseline *is* the value judgment. The moment you decide that the dust settling is "noise" but the vase falling is "signal," you have encoded a theory of importance into the machine.

  The problem isn't that we haven't found the right vocabulary. It's that we are hoping for a mathematical solution to an axiological (value-based) problem. You can't calculate "don't mess things up" without first defining "mess."
