answer: |-
  1. 'The trunk'
  We're talking about the observation that as countries get richer and pass gender-equality laws, the gap between men and women in fields like engineering vs. nursing sometimes gets wider, not narrower. To enter this tree, agree this pattern shows up in some dataset, even if misleading. You don't need to believe it's universal, just that it's the thing we're arguing about. If you think the data is fabricated nonsense, you exit left immediately. If you think it's real but meaningless, you exit right later. Everyone else starts here wondering why freedom might look like segregation.

  2. 'The forks'
  **Fork 1: The Measurement Check**
  When people in rich countries report their interests on surveys, are they using the scale differently than people in poor countries (e.g., extreme responding vs. moderate)?
  *   **Yes:** Go to Leaf A.
  *   **No:** Move to Fork 2.

  **Fork 2: The Index Check**
  Is the "gender equality" score used to predict the gap partly calculated using women's employment rates or occupational segregation itself?
  *   **Yes:** Go to Leaf B.
  *   **No:** Move to Fork 3.

  **Fork 3: The Justice Check**
  Even if the pattern is real and the data is clean, does this specific inequality indicate a failure of justice we are obligated to fix?
  *   **No:** Go to Leaf B.
  *   **Yes:** Move to Fork 4.

  **Fork 4: The Mechanism Check**
  Is the driver specifically about how welfare states change the economic price of care work compared to market work?
  *   **Yes:** Go to Leaf C.
  *   **No:** Move to Fork 5.
  *(Note: This acknowledges that constraints and preferences look the same unless you find a case where money changes but desires don't.)*

  **Fork 5: The Origin Check**
  Did the observed preferences exist before the culture shaped them, or are they the result of the shaping?
  *   **Existed Before:** Go to Leaf D.
  *   **Result of Shaping:** Go to Leaf E.

  3. 'The leaves'
  *   **Leaf A (Construct-Validity-Artifact):** You have to accept that survey scales mean different things in Oslo than in Oman.
  *   **Leaf B (Deflationary 'Nothing About Justice'):** You have to accept that equal opportunity might naturally produce unequal outcomes forever.
  *   **Leaf C (Care-Work-Decommodification):** You have to accept that STEM gaps are actually a subsidy issue for childcare.
  *   **Leaf D (Greater-Male-Variability):** You must accept that some occupational segregation is the default state of human biology.
  *   **Leaf E (Preferences-Socially-Shaped):** You must accept that 'free choice' is just socialization with a nicer branding.

  4. 'Empty rooms'
  *   **Artifact + Justice Intervention:** Incoherent. You can't demand policy fixes based on data you admit is measurement error.
  *   **Entangled Index + Justice Intervention:** Unattractive. Building policy on a metric that cheats by including the outcome it predicts is circular reasoning.
  *   **Innate Preferences + Socially Shaped:** Incoherent. A preference cannot be both pre-cultural and entirely the product of culture.
  *   **Care-Work + Innate Preferences:** Unexplored/Unstable. If the gap is purely about the price of care, biological variability shouldn't be the primary explanation, though some try to hold both.

  5. 'Ties'
  *   **Leaf A (Artifact) vs. Leaf B (Deflationary):** The tree separates them by *why* you ignore the data, but functionally both tell policymakers to do nothing. To tell them apart, you'd need to ask: "If the data were perfect, would you change your mind?"
  *   **Leaf D (GMV) vs. Leaf E (Preferences-Shaped):** These are observationally equivalent unless you find a population where culture changed but preferences didn't. To tell them apart, you'd need a natural experiment where gender norms shifted overnight without economic changes.
  *   **Leaf B (via Index) vs. Leaf B (via Justice):** The tree merges "The data is rigged" and "The data is irrelevant" into the same leaf. To separate them, ask: "Is the pattern real, but just?"
