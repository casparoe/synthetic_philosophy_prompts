  2.  **$Q_2$ (Causal Independence):** *Can the putative causes (institutions, coal, wages) be specified and measured independently of the industrial outcome they are meant to explain?*
      *   **Probability:** 0.70
      *   **Justification:** This is the primary site of endogeneity risk; "effective property rights" are often defined by their success in generating growth, but physical factors like coal geography or demographic wage data can be measured ex-ante, offering a partial shield against teleology.

  3.  **$Q_3$ (Differential Presence):** *Are the causal factors genuinely present in one case and absent in the other, rather than being matters of degree that are arbitrarily dichotomized?*
      *   **Probability:** 0.80
      *   **Justification:** While institutions are continuous, access to shallow coal deposits (Allen/Pomeranz) and the specific wage-price structure in Britain exhibit threshold effects that approximate binary presence/absence sufficiently for causal inference.

  4.  **$Q_4$ (Historical Determinacy):** *Is the divergence the result of a identifiable necessary/sufficient chain rather than a complex, overdetermined conjuncture where "the answer" is inherently probabilistic?*
      *   **Probability:** 0.70
      *   **Justification:** While macro-history is messy, the "Great Divergence" literature operates on the premise that specific bottlenecks (energy, capital) created a determinate break point; assuming a conjunctural determinism is plausible enough to assign non-negligible probability.

