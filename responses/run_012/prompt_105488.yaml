  **Credence in P:** 0.32

  ### Decomposition of Proposition P

  To assess whether the question "why Britain rather than China?" is well-posed in the sense you defined, I treat the three conditions (Stability, Differential Presence, Non-triviality) plus the metaphysical requirement of Determinacy as necessary conjuncts. If any fail, $P$ is false. I have broken these down into four sub-questions ($Q_1$–$Q_4$).

  1.  **$Q_1$ (Contrast Stability):** *Is the Britain–Yangzi pairing robust against swapping the comparandum (e.g., for Japan or the Netherlands) without fundamentally altering the causal mechanism?*
      *   **Probability:** 0.80
