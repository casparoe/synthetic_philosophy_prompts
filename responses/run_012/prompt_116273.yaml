  9.  **Formatting:**
      *   Clear sections.
      *   Printable materials (text-based).
      *   Teacher script/tips.

  10. **Self-Correction on "Three People":**
      *   Sen's paradox technically only needs two. But the prompt asks for "three people, three options." I will include a 3rd person who has no specific rights but participates in the Pareto judgment. This makes the Pareto violation stronger (unanimous vs. 2/2).
      *   Actually, to make the "Everyone prefers X to Y" work, I need all 3 to agree.
      *   So, R1 and R2 have rights. R3 is the tie-breaker/Pareto witness.
      *   Preferences:
          *   R1: Cook > Pizza > Tacos.
          *   R2: Pizza > Tacos > Cook.
          *   R3: Pizza > Tacos > Cook.
      *   Rights: R1 decides Cook/Pizza. R2 decides Cook/Tacos.
