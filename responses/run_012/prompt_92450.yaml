answer: |-
  You are right to reject your friend's classification. The **Unilateralist's Curse** (as defined by Bostrom, Sandberg, and Öhman) describes an **OR-gate** dynamic: harm occurs if *any one* person acts on a mistaken judgment. Your scenario describes an **AND-gate** (or summation) dynamic: harm occurs only if *many* people act. These are structurally distinct causal topologies.

  You are also right to feel that "Tragedy of the Commons" is imprecise, though it is the closest structural relative. The Tragedy of the Commons relies on a specific payoff matrix: individuals gain a *private benefit* that outweighs their *share of the public cost*. In your description, the actors gain "almost nothing" and are motivated not by greed but by **causal impotence** ("my act makes no detectable difference"). This shifts the problem from economics (incentives) to ethics/epistemology (responsibility under uncertainty).

  There is no single, catchy "Curse"-style label for this in the popular lexicon. However, in moral philosophy and decision theory, this is a well-carved joint. It is best identified as **The Problem of Imperceptible Threshold Harm** (often discussed under Derek Parfit's **"Harmless Torturers"** cases or Shelly Kagan's work on **Causal Impotence**).

  Here is the carving you asked for: what it is, what it isn't, and where the edges lie.

  ### 1. The Established Concept
  The rigorous name for this pattern in the literature is **Collective Harm with Causal Impotence** (specifically in a **Threshold Context**).

  *   **Primary Source:** Derek Parfit, *Reasons and Persons* (1984), Part I, Chapter 3 ("Five Mistakes in Moral Mathematics"). Parfit distinguishes between cases where individual acts make imperceptible differences (linear harm) and cases where harm occurs only after a threshold is crossed (threshold harm). Your case is the latter, complicated by the actors' inability to know where the threshold lies.
  *   **Secondary Source:** Shelly Kagan, *The Limits of Morality* (1989) and subsequent papers on "Doing Harm." Kagan analyzes the "Inefficacy Objection"—the claim that one is permitted to act because one's act makes no difference.
  *   **Why it fits:** It captures the accumulation (Collective), the mechanism (Threshold), and the reasoning of the actors (Causal Impotence/Imperceptibility).

  ### 2. Differentiation (The Carving)

  Here is how this concept differs from the four you mentioned. This defines the boundaries of the phenomenon.

  | Concept | Causal Structure | Motivation/Incentive | Epistemic State | Why Your Case Is Different |
  | :--- | :--- | :--- | :--- | :--- |
  | **Unilateralist's Curse** | **OR Gate:** Harm if *anyone* acts. | Altruistic/Principled (acting on own judgment). | Agents disagree on value of action. | Your case requires a **crowd** (Sum > Threshold), not a singleton. |
  | **Tragedy of the Commons** | **Summation:** Harm accumulates linearly or via threshold. | **Self-Interest:** Private gain > Shared cost. | Agents know the structure but defect. | Your actors gain **nothing** (or negligible convenience) and reason from **impotence**, not gain. |
  | **Sorites Paradox** | **Continuum:** Vague predicates (heap/not heap). | **Logical:** About truth conditions, not action. | N/A (Logical puzzle). | Your case is about **causal responsibility**, not linguistic classification. |
  | **Problem of Many Hands** | **Complex System:** Harm occurs via distributed roles. | **Retrospective:** About **blame** assignment after harm. | N/A (Accountability puzzle). | Your case is **prospective**: What should I do *before* the harm? |

  ### 3. Proposed Definition: "The Opaque Threshold Problem"

  Since you requested a term if one does not exist, and "Collective Harm with Causal Impotence" is a mouthful, the most precise descriptive label is **The Opaque Threshold Problem**.

  **Definition:**
  A situation in which:
  1.  **Accumulation:** A harmful outcome is caused by the aggregation of many similar acts.
  2.  **Threshold:** The harm is non-linear; it manifests only when the total number of acts exceeds a specific limit (the "flip").
  3.  **Opacity:** Individual actors cannot know (a) where the threshold lies, or (b) whether their specific act is the one that crosses it.
  4.  **Impotence Reasoning:** Actors refrain from restraint because, *given the expected behavior of others*, their individual restraint is statistically unlikely to prevent the threshold from being crossed.
  5.  **Benign Intent:** Actors are not motivated by private gain that outweighs public cost, but by the belief that their individual causal contribution is null.

  ### 4. Boundary Conditions

  You asked where the edges are. Here is how the definition handles specific variables:

  **A. Does it matter that individual acts are imperceptible?**
  *   **Yes.** If the harm were perceptible per act (e.g., "I dump a barrel of toxin"), the actor faces a direct moral choice. The "Impotence" reasoning collapses. The phenomenon *requires* that the individual signal-to-noise ratio be near zero.
  *   *Boundary:* If the harm is perceptible but small, it slides toward **Tragedy of the Commons**. If the harm is imperceptible but linear (no threshold), it is **Parfit's Harmless Torturers (Linear Variant)**.

  **B. Does it matter whether the actors could have coordinated?**
  *   **No, but it changes the solution.** The *problem* exists regardless of coordination ability. However, if coordination is *possible* (e.g., they can talk), it becomes a **Coordination Problem**. If coordination is *impossible* (e.g., strangers in a drought), it remains an **Opaque Threshold Problem**. The definition holds for both, but the remedy differs (agreement vs. principle).

  **C. Does it matter whether the resource is rivalrous?**
  *   **No.** This distinguishes it from the Tragedy of the Commons. In the Commons, my use reduces your use (rivalry). In your fish example, the lake's ecology flips regardless of who "uses" it. The harm is to a **Public Bad**, not necessarily a depletable resource.

  **D. Does it matter whether the harm is reversible?**
  *   **No.** The structure is about the *decision to act*, not the aftermath. However, irreversibility heightens the moral stakes.

  ### 5. Edge Cases

  Here are three cases sitting near the edge, classified by the definition above.

  **Case 1: Voting in a Landslide Election**
  *   *Scenario:* You choose not to vote because your candidate will win by millions of votes anyway. Your vote makes no difference to the outcome.
  *   *Verdict:* **Not** an Opague Threshold Problem.
  *   *Why:* While the causal structure fits (your vote is not necessary), the *harm* condition is missing. Voting is usually framed as a civic duty or benefit, not a harmful act. If you were voting for a *tyrant* in a landslide, it would fit. But standard voting lacks the "harmful accumulation" element. It is a case of **Causal Impotence** without the **Threshold Harm**.

  **Case 2: Carbon Emissions (Individual)**
  *   *Scenario:* You drive a gas car. Climate change is a threshold phenomenon (tipping points). Your specific ton of CO2 is imperceptible.
  *   *Verdict:* **Borderline / Hybrid.**
  *   *Why:* It fits the Opacity and Threshold. However, it often fails the "Benign Intent" condition because driving usually confers significant *private convenience* (gain), sliding it toward **Tragedy of the Commons**. If you were driving purely out of habit with zero convenience gain, it would be a pure Opague Threshold Problem.

  **Case 3: The "One Less Buyer" (Ethical Consumption)**
  *   *Scenario:* You buy factory-farmed chicken. Millions do. One less buyer does not change production numbers (orders are in bulk). Harm (animal suffering) continues unchanged.
  *   *Verdict:* **Yes, this is the canonical case.**
  *   *Why:* This is exactly the case Kagan and Parfit analyze. The harm (suffering) is threshold-based (chickens are killed in batches). Your purchase is imperceptible. You gain small convenience (dinner). You reason that your abstention changes nothing. This is the **Opague Threshold Problem** in its purest ethical form.

  ### Summary
  Your friend was wrong. The Unilateralist's Curse is about **premature activation** (one person triggers harm). You are describing **cumulative activation** (many people trigger harm).

  While economists might lazily call this a Tragedy of the Commons, the *moral geometry* is distinct. It is **The Opague Threshold Problem**: a scenario where well-intentioned agents, unable to perceive their marginal impact on a hidden threshold, rationally (but catastrophically) conclude that restraint is futile.
