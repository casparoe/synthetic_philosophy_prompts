prompt: |-
  my friend has a line he keeps pulling out: math is basically chess. the rules are made up, but once you fix them everything downstream is objective — nobody thinks there's a Platonic heaven of chess pieces, and yet there are right and wrong answers about a position, and finding a forced mate feels like discovering something even though you're only working out what you already stipulated. every chess position has a determinate answer, and so, he says, does every mathematical question; we just havent found the proof yet, and that feeling of contact with a realm of objects is nothing over and above the surprise of consequences you didnt see coming. so platonism is unmotivated. i want a proper audit of this. tell me what's supposed to map onto what — the rules, the pieces, the board, the players, the mate in three, the fact that somebody invented the game — then where the mapping breaks, which of the breaks actually matter for his conclusion and which are just scenery, and whether the anti-platonist conclusion survives once the disanalogies are on the table. if chess is the wrong vehicle for what he's after, say what a better one would be. write it as plain continuous prose, no headings, bullets, bold or tables — just paragraphs, like an email.
