answer: |-
  Here is the rubric you asked for. It is designed to evaluate any theory of transworld individuation, stripped of specific theoretical allegiance.

  ### The Rubric: Desiderata for Transworld Identity

  **1. Extensional Adequacy (The Cases)**
  *   **Ordinary Modality:** Must validate standard counterfactuals (e.g., "I could have worn a blue shirt") without making them trivially true or false.
  *   **Origin Essentialism:** Must provide a principled verdict on whether an individual could have had entirely different parents/origins, not just a stipulation.
  *   **Intrinsic Change:** Must explain how an individual retains identity despite changes to intrinsic properties (e.g., losing a limb, changing beliefs).

  **2. Conceptual Clarity (The Distinctions)**
  *   **De Re vs. De Dicto:** Must distinguish between *what is said about the object* vs. *what is said about the description*. (e.g., "The President could have been a Democrat" vs. "Nixon could have been a Democrat").
  *   **Identity vs. Similarity:** Must explain the difference between being *the same thing* and being *a qualitatively identical duplicate*.
  *   **Individuation vs. Identification:** Must distinguish the metaphysical ground of identity (what *makes* them the same) from the epistemic means of picking them out (how we *know* they are the same).

  **3. Logical Coherence (The Constraints)**
  *   **Necessity of Identity:** Must respect the logical theorem that if $x = y$, then necessarily $x = y$. Identity cannot be contingent.
  *   **Quantification:** Must support standard quantified modal logic (e.g., $\exists x \Diamond Fx$) without collapsing into contradiction or requiring bizarre domain restrictions.
  *   **Indiscernibility:** Must handle the case of two qualitatively identical individuals in different worlds (Haecceitistic swaps). Are they the same world-state or distinct possibilities?

  **4. Metaphysical Cost (The "Don't-Cheat" Clauses)**
  *   **Non-Circularity:** The criterion for transworld identity cannot presuppose the notion of transworld identity (e.g., "x is y in world W because x is the same as y").
  *   **Grounding:** Must specify what *grounds* the identity. Is it properties, origins, or a primitive fact?
  *   **Epistemic Access:** Must explain how we refer to individuals in other worlds without causal contact or magic.

  ---

  ### Non-Negotiable vs. Camp Preference

  You suspected some requirements are biased. You are right. Here is the split:

  **Non-Negotiable (Logic & Semantics)**
  *   **Necessity of Identity:** If a theory makes identity contingent, it breaks standard logic. (Note: Some theories change the logic, but then they owe a huge explanation).
  *   **De Re/De Dicto Distinction:** If a theory collapses these, it cannot account for basic modal errors.
  *   **Truth Conditions:** The theory must make modal sentences true or false in a consistent way.

  **Camp Preferences (Metaphysical Taste)**
  *   **"No Primitive Thisness":** This is the biggest bias. Haecceitists argue primitive thisness is a *feature*, not a bug. Demanding a theory explain identity *solely* via qualitative properties rigs the game against Transworld Identity (Kripke/Plantinga) and for Counterpart Theory or Bundle Theory.
  *   **"Strict Identity Required":** Counterpart theorists argue "strict identity" across worlds is incoherent. Demanding it rigs the game against Lewis.
  *   **"Epistemic Access via Similarity":** Transworld theorists argue we refer via stipulation/causal chain, not similarity. Demanding similarity rigs it for Lewis.

  ---

  ### The Trilemma: Jointly Unsatisfiable Desiderata

  You asked for the conflict. Here is the core trilemma of modal metaphysics. You cannot satisfy all three simultaneously:

  1.  **Strict Identity:** Transworld "identity" is literal numerical identity (the *very same* object exists in W1 and W2).
  2.  **Anti-Haecceitism:** Individuals are fully constituted by their qualitative properties/relations (no primitive "thisness").
  3.  **Contingency:** Individuals could have had different qualitative properties than they actually do.

  **The Conflict:**
  *   If you keep **(1) Strict Identity** and **(2) Anti-Haecceitism**, you must reject **(3) Contingency**. (If I am my properties, and I am literally the same object, I must have the same properties in all worlds. This is Necessitarianism).
  *   If you keep **(1) Strict Identity** and **(3) Contingency**, you must reject **(2) Anti-Haecceitism**. (I am the same object with different properties, so "what makes me me" must be something *other* than my properties. This requires Primitive Thisness/Haecceities).
  *   If you keep **(2) Anti-Haecceitism** and **(3) Contingency**, you must reject **(1) Strict Identity**. (I have different properties in different worlds, so I cannot be the *same* object. I am a counterpart. This is Lewis).

  **The Cost of Dropping One:**
  *   **Drop Contingency:** You save logic and parsimony, but make all modal claims about persons false. (High philosophical cost).
  *   **Drop Anti-Haecceitism:** You save strict identity and contingency, but accept brute, unanalyzable primitives. (High metaphysical cost).
  *   **Drop Strict Identity:** You save contingency and qualitative constitution, but must rewrite the logic of identity and accept that "I could have been..." is technically false (only my counterpart could have been). (High semantic cost).

  ---

  ### Scorecard: The Two Main Routes

  | Desideratum | **Transworld Identity (Kripke/Plantinga)** | **Counterpart Theory (Lewis)** |
  | :--- | :--- | :--- |
  | **Strict Identity** | **Pass.** It is literally you. | **Fail.** It is a similar counterpart. |
  | **Contingency** | **Pass.** You could have been different. | **Pass.** Counterparts can differ. |
  | **No Primitive Thisness** | **Fail.** Relies on haecceities/individual essences. | **Pass.** Grounded in qualitative similarity. |
  | **Logical Coherence** | **Pass.** Fits standard QML. | **Mixed.** Requires translation of standard logic. |
  | **Epistemic Access** | **Mixed.** Relies on stipulation/causal chains. | **Pass.** Grounded in resemblance we can grasp. |
  | **"Aboutness"** | **Pass.** Claims are genuinely about *you*. | **Fail.** Claims are about *someone else* like you. |

  **Summary for your essay:**
  If you want to defend **Transworld Identity**, you must argue that Primitive Thisness is not a "cheat" but a necessary metaphysical posit.
  If you want to defend **Counterpart Theory**, you must argue that "Strict Identity" across worlds is a confusion and that "Aboutness" can be preserved via the counterpart relation.

  You cannot have it all. Pick your poison.
