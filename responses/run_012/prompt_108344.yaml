prompt: |-
  ok so I'm taking this metaphysics of modality course and the essay at the end is basically "pick a side on how one and the same individual can turn up in more than one possible world and defend it," and I keep realising I don't actually know what a theory in this area is even supposed to deliver. I'd rather have the spec before I read another article telling me counterpart theory is obviously right or obviously incoherent.

  So: write me the desiderata. What does any adequate theory of transworld identity have to do to count as adequate? Not a survey of who said what — the requirements list, with the case or consideration behind each one, the way you'd write it if you were designing the marking rubric for the essay.

  Stuff I know I want on it, but tell me if any of it is bogus:

  - the de re cases it has to get right — the ordinary "they could have done otherwise" ones, but also the awkward ones, like whether someone could have had totally different origins, or whether the theory is allowed to just declare some property or other essential to each individual and be done
  - the distinctions it can't collapse: de dicto vs de re, essential vs accidental, "same individual" vs "same qualitative profile / same role", and maybe the one between identifying an individual and individuating them
  - what it has to stay consistent with — that identity and distinctness can't be contingent, whatever a quantified modal logic with identity actually demands of the semantics, varying domains, that kind of thing
  - the puzzles it has to dissolve or at least not trip over: how you're supposed to pick out an individual in another world without already presupposing who they are, the two qualitatively identical but distinct individuals case, and the objection that on a counterpart story the modal claims stop being about the person you were talking about
  - the don't-cheat clauses: no brute transworld identity, no primitive thisness smuggled in as an unexplained primitive, and no just taking an individual's properties and relabelling them world-indexed so it looks like work got done

  Then tell me which of these are genuinely non-negotiable and which are really just the preferences of one camp dressed up as requirements. My suspicion is a decent chunk of what gets called a requirement is just one side refusing to give something up, but I can't tell which chunk.

  And the part I actually care about: flag any pair or triple on the list that looks jointly unsatisfiable. If you can have the same individual across worlds AND no primitive thisness AND a non-circular way of saying which individual in the other world is the one you meant, then I've definately missed something and I want to know what. If some subset has to go, say which one and what it costs to drop it.

  Last bit, keep it short: how do the two main routes actually score against your list — the counterpart route (counterparts and similarity, Lewis style) and the straight transworld identity route (individual essences, haecceities, world-indexed properties)? I mainly want the criteria though, I'll do the defending myself.

  Don't bother with citations or a reading list, I'm not going to go chase them down, I just want the checklist. Also sorry this is long, I'm writing it at 2am and my brain is seperate from my body at this point.
