          *   *Why:* Kelly assumes reinvestment. Real life involves spending. If you spend, wealth isn't multiplicative. If wealth isn't multiplicative, ergodicity breaks. If ergodicity breaks, Geometric Rationality loses its main advantage over EU. This is the "silence" in the literature.

