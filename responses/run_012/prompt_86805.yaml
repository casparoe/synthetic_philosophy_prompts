answer: |-
  This is a strong position to be in. Four philosophers with a year is enough time to dismantle a conceptual framework, provided you don't get bogged down in the math that finance people have already solved. You are right to suspect that much of the "Kelly" literature is engineers solving engineering problems (how to size bets) rather than philosophers solving normative problems (why this sizing is *rational*).

  Here is the defended ordering for your year, the red herring to drop, and the dominant question you haven't asked.

  ### The Priority Order

  #### 1. The Ambiguity Problem (Your Bullet 1)
  **Priority:** Critical / Upstream
  **Why:** This is the load-bearing wall. The standard Kelly derivation assumes a known probability distribution $p$. In almost every real-world domain (and certainly in philosophy), $p$ is unknown, contested, or non-stationary. If "Geometric Rationality" cannot prescribe an action under Knightian uncertainty (ambiguity) without arbitrarily collapsing into a Bayesian prior, it fails as a general decision theory. Currently, "Fractional Kelly" is treated as a heuristic hedge against estimation error, but there is no rigorous *normative* derivation that says "Under ambiguity, maximize expected log-wealth of a worst-case distribution."
  **Upstream Impact:** If you solve this, Bullet 2 (Ergodicity) becomes easier. You will know *what* function is being ergodically optimized. If you fail here, the rest of the year is just analyzing a toy model that doesn't apply to reality.
  **Tractability for Philosophers:** High. This is epistemology and decision theory. You don't need new theorems; you need to evaluate existing proposals (e.g., Maxmin Expected Utility, Smooth Ambiguity, Bayesian updating with imprecise priors) against the growth criterion. Can you derive a "Robust Kelly" from axioms of rationality under ambiguity?
  **Shift Condition:** Move this *down* only if you conclude that "Growth Optimality" is strictly a market-selection phenomenon (see Bullet 3) rather than an individual norm. If it's only about market survival, individual ambiguity matters less.

  #### 2. The Ergodicity/Finite-Horizon Justification (Your Bullet 2)
  **Priority:** Foundational / Normative
  **Why:** This is the core claim of the "Geometric Rationality" movement (Ole Peters et al.). It argues that maximizing time-average growth is objectively rational because it's the only thing that converges for a single agent over time, whereas Expected Utility (EU) relies on non-existent parallel universes. However, this relies on $T \to \infty$ and strict multiplicativity.
  **Upstream Impact:** This justifies *why log?* If the ergodic argument fails for finite horizons (which all human lives are), then Kelly is just EU with a specific risk-aversion coefficient ($U(w) = \ln w$). If it's just EU, then Bullet 1 collapses into standard Bayesian decision theory.
  **Tractability:** Medium. You need to parse the ergodicity economics papers critically. Look for the "switching point." At what horizon does the time-average argument override the ensemble-average argument? Is there a coherence argument (Dutch Book) for log-wealth that doesn't rely on infinite time?
  **Shift Condition:** Move this *up* to #1 if you find that the Ambiguity problem is intractable without first settling whether "Growth" is even the right objective function for finite beings.

  #### 3. Market Interaction & Evolutionary Stability (Your Bullet 3)
  **Priority:** Stress Test / Downstream
  **Why:** This asks: "If Kelly is rational, why aren't markets full of Kelly bettors?" or "Do Kelly bettors actually dominate?" This is the evolutionary justification. If Kelly agents go extinct because they are too volatile and get wiped out by noise traders or predatory algorithms before the "long run" arrives, the normative claim weakens.
  **Upstream Impact:** This depends on 1 and 2. You need to know what a Kelly agent *is* (Bullet 1 & 2) before you put them in a market.
  **Tractability:** Medium/Low. This leans into game theory and market microstructure. Without compute, you are limited to analytic models (e.g., Blume & Easley type models). It's easy to get lost in specific market mechanics.
  **Shift Condition:** Move this *up* if you conclude that "Rationality" is purely defined by survival (evolutionary epistemology). If rationality = not going extinct, then market dynamics are the primary lens, not individual decision axioms.

  ---

  ### The Red Herring: Bullet 4 (Taxonomy)
  **Drop this immediately.**
  Do not spend a semester mapping the five versions of Kelly (Gambler, Investor, Continuous, etc.). This is a cataloging task, not a conceptual one. The disagreements between these versions are usually technical (discrete vs. continuous time, price impact), not foundational.
  **Why it's a trap:** It gives the illusion of progress ("We now understand the Continuous-Time Kelly!") without answering *why* you should use it. You will naturally encounter the relevant versions as you tackle Bullets 1 and 2. If you need the continuous version to solve the Ergodicity question, you'll learn it then. Don't make it a deliverable.

  ---

  ### The Missing Dominant Question
  There is a question that dominates all four of your bullets, which you have hinted at but not isolated. It is this:

  **"Does Geometric Rationality collapse into Expected Utility with a specific risk-aversion parameter once Absorbing Barriers (Ruin) or Consumption are introduced?"**

  **Why this dominates:**
  1.  **It attacks the Ergodicity Claim (Bullet 2):** The ergodic argument works because wealth compounds infinitely. But real agents consume (breaking multiplicativity) and face ruin (absorbing barriers at $W=0$). If you introduce a ruin barrier, the optimal strategy often deviates from Full Kelly to avoid the barrier. If you introduce consumption, the "long run" is truncated.
  2.  **It reframes Ambiguity (Bullet 1):** Under ambiguity, the fear isn't just "wrong probability," it's "unseen ruin." If the theory collapses to "EU with a ruin constraint," then the "Geometric" part is just a fancy way of describing a safety constraint.
  3.  **It decides the Normative Status:** If Kelly is just EU with a specific utility function ($\ln w$) driven by a fear of ruin, then it's not a *new* foundation of rationality. It's a special case of the old one. If it *doesn't* collapse, you need to explain why the "Time Average" norm overrides the "Ensemble" norm for a finite, consuming agent.

  **How to tackle this without math:**
  Focus on the **axioms**. Expected Utility relies on the VNM axioms (completeness, transitivity, continuity, independence). Geometric Rationality claims to bypass utility entirely via physics (ergodicity).
  *   **Your Year's Goal:** Determine if the Ergodic argument *actually* bypasses utility, or if it secretly smuggles in a utility function (log) via the assumption of non-ruin.
  *   **Evidence to look for:** Papers discussing "Kelly with a floor," "Consumption-Investment problems," or critiques of Ergodicity Economics by standard decision theorists (e.g., is the time-average *really* the only rational objective for a finite agent?).

  ### Suggested Path for the Year

  *   **Quarter 1 (The Foundation):** Tackle the **Missing Question**. Read the ergodicity economics papers (Peters) alongside standard critiques. Try to formalize the "Finite Horizon/Consumption" objection. Does the log-optimal strategy survive if you must withdraw 5% annually?
  *   **Quarter 2 (The Epistemology):** Tackle **Bullet 1 (Ambiguity)**. Assume the foundation holds. Now, what if $p$ is unknown? Read on "Robust Control" and "Ambiguity Aversion" (Gilboa-Schmeidler). Can you derive Fractional Kelly as an optimal response to ambiguity, rather than a heuristic?
  *   **Quarter 3 (The Environment):** Tackle **Bullet 3 (Markets)**. Read Blume & Easley ("Selection and the Evolution of Rationality"). Do Kelly agents win? Under what conditions do they lose to irrational agents?
  *   **Quarter 4 (Synthesis):** Write your conceptual map. Is Geometric Rationality a new paradigm, or just Expected Utility with a specific focus on survival and parameter uncertainty?

  **Final Advice:** Your advantage is that you are philosophers. The finance people assume the goal is "make money." The physicists assume the goal is "maximize Lyapunov exponent." Your job is to ask: **"What is the normative warrant for making that the goal?"** If you stick to that, you will produce something the finance and physics crowds cannot.
