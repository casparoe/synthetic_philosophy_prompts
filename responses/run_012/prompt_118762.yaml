  Here is my assessment, framed as requested.

  **Framing Check**
  Your question is not malformed, but it rests on a tension in the contemporary literature: "Ockhamism" is often defined *by* the acceptance of a "Thin Red Line" (privileged branch), so asking for Ockhamism *without* it is effectively asking for a semantic model that delivers bivalence without ontological commitment to a specific future. This is possible (e.g., via contextualism), but it risks collapsing into supervaluationism or relativism, which deny the very bivalence you want to preserve.

  **Overall Probability**
  **0.35** that Ockhamism can be made coherent without a privileged actual future.

  **Decomposition**

  *   **(a) 0.65** — Bivalence holds for future contingents *simpliciter*.
      *   *Justification:* Semantically elegant and preserves classical logic, but metaphysically inflationary regarding the status of non-actualized possibilities.
  *   **(b) 0.85** — Given bivalence, a privileged branch must exist (truth requires a truthmaker).
      *   *Justification:* Deflationary accounts of truth struggle to explain *why* one contradictory future proposition is true rather than the other without ontological grounding.
  *   **(c) 0.45** — The hard/soft fact distinction blocks fatalism sharply enough.
      *   *Justification:* The distinction is notoriously slippery and often appears tailored specifically to save freedom rather than arising from independent metaphysical principles.
  *   **(d) 0.70** — The problem is partially an artifact of linguistic regimentation (e.g., "will" as modal).
      *   *Justification:* Modern semantic treatments of "will" as a modal operator often dissolve the need for a truth-value at a moment *simpliciter*, favoring truth relative to a context or history.

  **Combination Logic**
  I derived the **0.35** by treating (b) as the primary constraint: if there is an 0.85 probability that bivalence *requires* a privileged branch, the baseline probability of "Bivalence without Privilege" is only 0.15. I raised this to 0.35 by weighting (d) heavily; if the demand for a truthmaker is a linguistic artifact (0.70), the pressure from (b) loosens, though (c) remains a significant vulnerability for the overall Ockhamist project.

  **Most Suspicious Term**
  You should be most suspicious of **(c)**. Even if you solve the truthmaker problem, the Ockhamist solution to fatalism relies entirely on the claim that "It was true yesterday that p" is a soft fact about the past; if this distinction fails, you retain bivalence but lose freedom, rendering the view fatalistic.

  **Argument That Would Move My Number**
  A robust defense of **deflationary truth for temporal propositions** that does not collapse into relativism. If you can demonstrate that "It is true that p" requires no ontological truthmaker distinct from the proposition's assertibility conditions within a branching framework, (b) drops significantly, and my overall number would rise toward 0.60.
