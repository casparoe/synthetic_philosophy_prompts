prompt: |-
  I'm a backend engineer with no philosophy training, and my team has been going at each other for months over a rewrite we're two years into. Half of us say sunk cost, kill it. The other half say we're to far in, and anyway the hard parts are already built so finishing is three weeks. I've relised the actual fight is whether honoring sunk costs can ever be rational, and I want the two camps to write the document they should have written instead of yelling at each other.

  Camp 1: the standard line — sunk costs are irrelevant to rational choice, and treating them as relevant is always a mistake. Camp 2: honoring sunk costs is sometimes rational (commitment, credibility, what you learn from having already spent, whatever). Write the joint statement an honest member of each camp could sign after a real adversarial collaboration: a numbered section of agreed claims, then a table of the remaining disagreements with each side's view in wording that side would accept, then the cruxes — the sub-questions where settling one would move at least one side. My guesses at the cruxes, tell me if I'm off:

  (a) whether the "the past isn't inert" cases count as honoring a sunk cost at all — we've already paid for the sharding layer, so finishing is cheap now, versus my manager's "otherwise those two years were wasted". Those feel completely different to me but maybe aren't.
  (b) whether irrational here means inconsistent with your own preferences, or means you'd have planned differently in advance.
  (c) whether a rule you can be exploited for following — never quit, and everyone knows it, so people sell you doomed projects — can still be the rational rule.
  (d) whether money already spent is evidence about how much we value the thing, which smells like laundering the fallacy to me but I can't say why.

  For each crux, give a concrete case or argument both sides would accept as bearing on it, and write down what each side predicts about it. If part of this is just a fight about words, say which part. Skip the reading list, I won't read it. And at the end, tell me which of the agreed claims you'd bet against, and what would change your mind about the whole framing — where the reasoning is most likely to be wrong.
reasoning: |-
