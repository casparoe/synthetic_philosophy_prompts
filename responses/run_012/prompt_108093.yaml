      *   **Constraints:** No reading list, practical tone, specific structure.

  2.  **Deconstruct the Philosophical/Economic Conflict:**
      *   *Camp 1 (Standard Econ):* Sunk costs are bygones. Rationality is forward-looking expected utility. If $EV(Finish) < EV(Kill)$, kill it. Period.
      *   *Camp 2 (Nuanced/Strategic):* "Sunk cost" is often a label applied too broadly. Reputation, team morale, learning, and commitment devices matter. Sometimes sticking to a plan *because* you made the plan is rational (time consistency).
