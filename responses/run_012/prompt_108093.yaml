      *   *User (c):* Exploitability. If you never quit, you get scammed. *Refinement:* Is a "never quit" heuristic robust or fragile in a competitive environment?
      *   *User (d):* Signaling/Value. Does spend prove value? *Refinement:* Is past effort evidence of future viability, or just evidence of past optimism?

      *Let's polish these into testable cruxes.*
      *   Crux 1 (The "Inert" Past): Is the "hard parts built" argument actually about sunk costs, or just low marginal cost? (Addresses User A).
      *   Crux 2 (The Reputation/Commitment Device): Does signaling "we finish what we start" yield net positive EV even when specific projects fail? (Addresses User C & B).
      *   Crux 3 (The Informational Value): Does the fact that we spent 2 years without quitting tell us the project is good, or just that we are bad at quitting? (Addresses User D).

  6.  **Drafting - Section 4: Predictions & Concrete Cases:**
