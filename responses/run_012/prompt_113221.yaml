prompt: |-
  I run the forecasting desk at a small policy institute — eight analysts, about forty questions a week, every question gets a number between 0 and 1, and from next quarter those numbers feed into performance reviews, which has everyone quietly drifting toward 0.5. I've been reading alot about accuracy-first epistemology and epistemic utility theory and I think theres a workable procedure buried in it, but I need it dug out: a scoring and feedback routine the desk lead can run in half an hour on a Monday, nothing more demanding than arithmetic, that goes in order from what has to be nailed down before a question even goes out (resolution criteria, what counts as the event happening, the base rate we're measuring against) through how to score once things resolve, to what you actually say to an analyst whos doing badly. Tell me where the procedure stops and a person has to decide, because the call is about values or about the institution rather than about accuracy. Be straight with me about which parts of the theory break when you're scoring single questions week by week instead of a whole credence function, and about what no scoring rule can tell us at all — I don't want a reading list, I want the thing that survives contact with a desk. Then run it on three cases: two analysts whose scores come out the wrong way round relative to who got the call right, a question that resolved on a word nobody defined in advance, and a forecaster who hasn't gone outside 0.4 to 0.7 in six months. If the procedure says something about my own numbers I won't enjoy hearing, don't soften it. British English please.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the Request:**

      *   **User:** Head of forecasting desk at a small policy institute.
      *   **Context:** 8 analysts, ~40 questions/week, probabilities (0-1). Performance reviews tied to scores next quarter.
      *   **Problem:** Analysts drifting toward 0.5 (hedging) to avoid penalty.
      *   **Goal:** A practical scoring and feedback routine based on accuracy-first epistemology/epistemic utility theory.
      *   **Constraints:**
          *   Must be doable by the desk lead in ~30 mins on a Monday.
          *   Arithmetic only (no complex modelling).
          *   Sequence: Pre-question (resolution/base rate) $\rightarrow$ Scoring $\rightarrow$ Feedback.
          *   Must identify where theory stops and human judgment/values begin.
          *   Must address limitations of scoring single questions vs. credence functions.
          *   Must address what scoring rules *cannot* tell us.
          *   Must run the procedure on three specific cases (score/call mismatch, ambiguous resolution, chronic hedging).
          *   Tone: Direct, British English, no softening of hard truths.
          *   No reading lists.

  2.  **Theoretical Grounding (Mental Check):**

      *   *Epistemic Utility Theory:* We want proper scoring rules (Brier Score is the standard for binary events). Proper scoring rules incentivize truth-telling.
      *   *The "Drift to 0.5" Problem:* This happens when the cost of being wrong (penalty) outweighs the benefit of being right, or when the scoring rule isn't properly understood/implemented. If performance reviews are tied to scores, risk aversion kicks in.
      *   *Single Question vs. Credence Function:* Proper scoring rules work best over many trials. On a single question, luck dominates. A lucky 0.51 on a 'Yes' outcome beats a well-calibrated 0.9 on a 'No' outcome that happened to hit.
      *   *Resolution Criteria:* Crucial. If the event isn't well-defined, the probability is meaningless.
      *   *Base Rates:* Essential for calibration. You can't judge 0.8 on a 99% event the same as 0.8 on a 10% event.

  3.  **Drafting the Procedure (The "Thing That Survives Contact"):**

      *   *Phase 1: Pre-Question (The Setup).* Needs to lock down ambiguity.
          *   Action: Define the "Resolution Condition" (RC).
          *   Action: Estimate the "Reference Class Frequency" (Base Rate).
      *   *Phase 2: Scoring (The Arithmetic).*
          *   Metric: Brier Score is standard ($ (forecast - outcome)^2 $). Lower is better.
          *   Problem: Brier scores punish confidence. To stop the drift to 0.5, we need to normalise against the base rate or use a skill score. Let's use a *Base-Rate Adjusted Brier Score*.
          *   Wait, the prompt asks for *arithmetic* in 30 mins. Complex adjustments might be too much. Let's stick to raw Brier but aggregate by *calibration bins*.
          *   Actually, to address the "drift to 0.5", the feedback needs to highlight *confidence calibration*, not just accuracy.
          *   Let's keep the scoring simple: Brier Score per question. Aggregate per analyst per month.
      *   *Phase 3: Feedback (The Conversation).*
          *   This is where the human element comes in.
      *   *Limitations:* Need to explicitly state where the math stops.

  4.  **Refining the Procedure for the "30-Minute Monday" Constraint:**

      *   You can't calculate individual Brier scores for 40 questions x 8 analysts every week in 30 mins. That's 320 calculations.
      *   *Solution:* Sampling + Aggregation.
      *   *Revised Plan:*
          1.  **Pre-Flight (Before question goes out):** Mandatory "Resolution Statement" and "Base Rate Estimate". If these aren't filled, question is rejected. (Takes 0 mins on Monday, it's a gatekeeping rule).
          2.  **Scoring (Monday Morning):** Only score *resolved* questions. Usually, not all 40 resolve weekly. Assume ~5-10 resolve.
          3.  **The Metric:** Brier Score. $BS = (p - o)^2$.
          4.  **The Adjustment:** To combat the 0.5 drift, compare the analyst's BS to the "Naive Base Rate BS". If they beat the base rate, they add value.
          5.  **Feedback:** Focus on the *gap* between forecast and base rate.

  5.  **Addressing the Theoretical Breaks:**

      *   *Single Question:* Luck dominates. A 0.99 forecast on a 'No' outcome looks terrible (BS = 0.98), but might be the right call epistemically.
      *   *Values:* Scoring rules don't tell you if the question *matters*. They don't tell you if the cost of a False Positive differs from a False Negative (Decision Theory vs. Epistemic Utility).
      *   *Institution:* Performance reviews based on short-term Brier scores *will* cause gaming. I need to warn the user about this.

  6.  **Developing the Three Cases:**

      *   *Case 1 (Score/Call Mismatch):* Analyst A says 0.9 (No), Event happens (Yes). BS = 0.81. Analyst B says 0.51 (Yes), Event happens (Yes). BS = 0.24. B looks better, A was more informative.
          *   *Procedure:* Look at the Base Rate. If Base Rate was 0.1, A was brave and nearly right. B was lazy.
      *   *Case 2 (Ambiguous Word):* "Regime Change". Did a cabinet reshuffle count?
          *   *Procedure:* Void the question. Score as 0.5 (neutral) for everyone. Blame the drafter, not the forecasters.
      *   *Case 3 (Chronic Hedger):* 0.4-0.7 range.
          *   *Procedure:* Check Base Rate coverage. If base rates are extreme (0.1 or 0.9) and they stay at 0.5, they are adding no value. Penalise for "Information Gain".

  7.  **Drafting the Content (incorporating British English and Tone):**

      *   *Tone:* Professional, direct, slightly weary but competent. No fluff.
      *   *Structure:*
          1.  The Hard Truths (Theory breaks).
          2.  The Procedure (Pre, During, Post).
          3.  The Three Cases.
          4.  The Warning (About the user's own numbers/incentives).

  8.  **Self-Correction/Refinement during drafting:**

      *   *Critique:* Is 30 minutes realistic?
      *   *Fix:* Emphasise that scoring only happens on *resolved* questions. If 40 go out, maybe 5 come back. Scoring 5 questions is easy. The feedback is the time sink. Keep feedback structured.
      *   *Critique:* How to stop the 0.5 drift specifically?
      *   *Fix:* Introduce the "Ignorance Benchmark". If the base rate is 10%, and you forecast 50%, you are penalised relative to the benchmark, even if you're 'right' by being safe. The scoring rule must reward *deviation from the base rate when justified*.
      *   *Actually, strictly speaking:* Proper scoring rules *do* reward deviation if you're right. But risk aversion kills it. The fix isn't just the math; it's the *review policy*. I must advise that individual question scores cannot drive reviews. Only aggregates over quarters.
      *   *Wait, the prompt says:* "from next quarter those numbers feed into performance reviews". I cannot change that constraint, but I must warn about the consequence.
      *   *Better approach:* Use a "Skill Score". $Skill = 1 - (Analyst BS / Base Rate BS)$. This shows value add.

  9.  **Final Polish:**

      *   Check British spelling (analyse, programme, centre, etc.).
      *   Ensure the "Hard Truth" about the user's own numbers is included (the "Don't soften it" instruction).
      *   Ensure the distinction between *Epistemic Utility* (truth) and *Decision Utility* (consequences) is clear.

  10. **Final Review against constraints:**
      *   30 mins Monday? Yes, if limited to resolved questions.
      *   Arithmetic only? Yes.
      *   Order (Pre -> Score -> Feedback)? Yes.
      *   Where theory stops? Yes.
      *   Single question limitation? Yes.
      *   Three cases? Yes.
      *   British English? Yes.

  *(Self-Correction on the "User's Numbers" instruction)*: The prompt says "If the procedure says something about my own numbers I won't enjoy hearing, don't soften it." This implies I should evaluate *their* management style or the system they built. The system tying scores to reviews *is* the problem. I need to call that out.

  Let's write it.cw
answer: |-
  Here is the procedure, stripped of the academic varnish, followed by the hard limits of the theory and the three cases you requested.

  ### Part 1: The Hard Limits (Read this first)

  Before you implement the arithmetic, you must accept where the mathematics breaks. If you ignore these, the procedure will fail, and your analysts will rightly lose faith in it.

  1.  **The Single-Question Problem:** Epistemic utility theory (specifically proper scoring rules like the Brier Score) relies on the Law of Large Numbers. On a *single* question, luck dominates skill. An analyst who says 51% on a coin flip looks better than an analyst who says 90% on a rare event that doesn't happen. You cannot judge competence on a week-by-week basis. If your performance review system punishes a correct 90% 'No' forecast because the rare event happened, you will drive your best analysts to 0.5.
  2.  **The Decision/Truth Gap:** Scoring rules measure *accuracy*, not *utility*. A forecast of 0.99 on a catastrophic risk might be epistemically sound but decision-useless if the cost of preparation is low. Conversely, a 0.6 forecast on a high-stakes issue might require action, but the scoring rule treats it the same as a 0.6 on a triviality. The math cannot tell you which questions matter.
  3.  **The Incentive Trap:** You stated scores feed into performance reviews. **This is the root of your 0.5 drift.** Analysts are not paid to be accurate; they are paid to keep their jobs. A Brier score penalty is certain; a bonus for accuracy is abstract. Until you decouple individual question scores from immediate punitive measures, no arithmetic will fix the hedging.

  ### Part 2: The Monday Morning Procedure (30 Minutes)

  This routine assumes you are scoring only *resolved* questions from the previous week. If you issue 40 questions, likely only 5–10 resolve weekly. Score only those.

  **Step 1: The Pre-Flight Check (Done before the question goes out)**
  *Time cost: 0 mins on Monday (This is a gatekeeping rule).*
  No question is published without two fields completed by the drafter:
  1.  **Resolution Criteria:** A binary test. (e.g., "Yes if the Bill receives Royal Assent by 31 Dec", not "Yes if the Bill passes").
  2.  **Reference Class Base Rate:** The historical frequency of this event type. (e.g., "Bills of this type pass 80% of the time").
  *If these are missing, the question is void. No exceptions.*

  **Step 2: The Arithmetic (Monday, 15 mins)**
  For each resolved question, calculate the **Base-Rate Adjusted Skill Score** for each analyst. Do not use raw Brier Scores; they punish confidence too harshly for small samples.

  1.  **Outcome ($O$):** 1 if Yes, 0 if No.
  2.  **Forecast ($p$):** The analyst's number.
  3.  **Base Rate ($b$):** The pre-flight estimate.
  4.  **Analyst Brier Score:** $(p - O)^2$
  5.  **Base Rate Brier Score:** $(b - O)^2$
  6.  **Skill Score:** $1 - (\text{Analyst BS} / \text{Base Rate BS})$

  *Interpretation:*
  *   **Score > 0:** They beat the naive baseline. Value added.
  *   **Score = 0:** They matched the baseline.
  *   **Score < 0:** They did worse than simply guessing the historical average.
  *   **If Base Rate is unknown:** Use 0.5 as the baseline, but flag the question as poorly defined.

  **Step 3: The Feedback Loop (Monday, 15 mins)**
  Do not send a spreadsheet. Have a 5-minute stand-up or send a structured memo.
  1.  **Publish the Mean Skill Score** for the week (anonymised).
  2.  **Highlight the 'Best Value' Forecast:** The forecast with the highest positive deviation from the base rate that was *correct*.
  3.  **Highlight the 'Brave Error':** The forecast with the highest deviation from the base rate that was *incorrect*. Explicitly state: "This was the right epistemic behaviour, even though it scored poorly."

  ### Part 3: Where the Person Decides (The Value Judgement)

  The procedure stops at the **Skill Score**. Everything after is management.

  1.  **Voiding Questions:** If the Resolution Criteria were ambiguous, the math is irrelevant. You must decide to void the question. Score everyone at 0.5 (neutral). This protects analysts from bad management.
  2.  **The 'Brave Error' Protection:** If an analyst gets a negative Skill Score because they were confidently wrong on a low-probability event, you must decide whether to ignore this for the performance review. If you don't, they will never be confident again.
  3.  **Question Selection:** The scoring rule cannot tell you if you are asking the right questions. You must decide if the 40 questions are worth the labour.

  ### Part 4: Running the Procedure on Your Cases

  Here is how the arithmetic and the judgement interact in your specific scenarios.

  **Case 1: The Score/Call Mismatch**
  *   **Situation:** Analyst A forecasts 0.9 (No). Event happens (Yes). Analyst B forecasts 0.51 (Yes). Event happens (Yes). Base Rate was 0.1.
  *   **The Math:**
      *   Analyst A BS: $(0.9 - 1)^2 = 0.01$. Wait, Outcome is 1. $(0.9 - 1)^2 = 0.01$. *Correction:* A forecast 0.9 *No*, so $p=0.1$ for Yes. Let's assume A said 0.1 (Yes).
      *   Let's stick to your prompt: A said 0.9 (No), meaning $p=0.1$ for Yes. B said 0.51 (Yes). Outcome = 1.
      *   A's BS: $(0.1 - 1)^2 = 0.81$.
      *   B's BS: $(0.51 - 1)^2 = 0.24$.
      *   Base Rate ($b$) = 0.1. Base Rate BS: $(0.1 - 1)^2 = 0.81$.
      *   A's Skill: $1 - (0.81 / 0.81) = 0$.
      *   B's Skill: $1 - (0.24 / 0.81) = 0.70$.
  *   **The Result:** B looks superior. A looks average.
  *   **The Human Call:** This is where you intervene. Analyst A agreed with the base rate (0.1). They added *no information*. Analyst B moved the needle to 0.51. B added value. The math is actually right here, even if it feels wrong because A was "more certain" about the wrong thing. However, if A had said 0.01 (No) and lost, the penalty would be severe.
  *   **Action:** Praise B for moving off the base rate. Tell A that agreeing with the historical average is not forecasting; it's reading a history book.

  **Case 2: The Undefined Word**
  *   **Situation:** Question: "Will there be regime change?" Resolved: Yes (Cabinet reshuffle). Analysts are furious; they meant "Revolution".
  *   **The Math:** Undefined. Base Rate cannot be calculated because the reference class is mush.
  *   **The Human Call:** **Void the question.**
  *   **Action:** Score everyone at 0.5. Record the error against *your* name, not the analysts'. If you force a score here, you teach them that ambiguity is their problem to solve, rather than your problem to prevent. This is the single biggest driver of institutional cynicism.

  **Case 3: The Chronic Hedger (0.4–0.7 range)**
  *   **Situation:** Analyst C has not gone outside 0.4–0.7 in six months.
  *   **The Math:** Calculate their average deviation from the Base Rate.
      *   If Base Rates are extreme (e.g., 0.1 or 0.9) and Analyst C stays at 0.5, their Skill Score will be consistently negative. They are actively degrading accuracy compared to a naive model.
      *   If Base Rates are all around 0.5, their Skill Score will be neutral.
  *   **The Human Call:** This is a performance issue, not a scoring issue.
  *   **Action:** Show them their Skill Score relative to the Base Rate. Say: "On questions where the historical likelihood was 10%, you forecast 50%. You are telling the policymakers the risk is five times higher than history suggests, without evidence. Either justify the deviation or align with the base rate." If they cannot justify the deviation, they are not forecasting; they are noise.

  ### Part 5: The Thing You Won't Enjoy Hearing

  You asked me not to soften this.

  The procedure above will work technically, but it will not fix your culture if you proceed with your current plan for performance reviews.

  You are the desk lead. Your analysts are drifting to 0.5 because **you are measuring them on noise.** By tying weekly or quarterly scores to reviews, you are signalling that *avoiding blame* is more important than *finding truth*.

  If you implement this scoring system and still punish low scores on individual questions, you are lying to your team when you tell them you want accuracy. You want *safety*.

  To fix this, you must change the review metric. Do not review the Brier Score. Review the **Justification Log**.
  1.  Did they document *why* they deviated from the base rate?
  2.  When they were wrong, did they update their model correctly?
  3.  Did they flag ambiguous resolution criteria before the question closed?

  If you continue to review based on the number (0–1) rather than the process (the epistemic hygiene), the analysts will game the numbers. They will become better at forecasting *your review criteria*, not the world. The 0.5 drift is a rational response to an irrational incentive. Change the incentive, or admit that you prefer manageable analysts to accurate ones.

  **Summary of Monday Actions:**
  1.  Reject any new question lacking a Base Rate and Resolution Criteria.
  2.  Score only resolved questions using Skill Score against Base Rate.
  3.  Void any question with ambiguous resolution; take the blame yourself.
  4.  Tell your team that "Brave Errors" are protected, but "Lazy Hedges" are not.
  5.  Reconsider linking these scores to pay or promotion. If you don't, the drift to 0.5 will continue regardless of the arithmetic.
