      *   *Williams's Critique:* If he has that thought, it's "one thought too many." It undermines the integrity of the personal relationship. The relationship *itself* should be the reason.
      *   *The Dispute in the Pub:*
          *   Phil A (Psychology): Focuses on the phenomenology of the agent. A good person *feels* differently. The theory fails descriptively.
