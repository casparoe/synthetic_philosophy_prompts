answer: |-
  ### Exam Question

  **Question 1 (20 Marks)**

  Consider the following two choice pairs involving monetary prospects:

  *   **Pair 1:** Prospect **A** pays $500 for certain. Prospect **B** pays $500 with probability 0.90, $3,000 with probability 0.09, and $0 with probability 0.01.
  *   **Pair 2:** Prospect **C** pays $500 with probability 0.10 and $0 otherwise. Prospect **D** pays $3,000 with probability 0.09 and $0 otherwise.

  Empirical evidence suggests many agents prefer **A** to **B** and **D** to **C**.

  Write an essay of approximately 600 words addressing the following:
  1.  Reconstruct the formal argument demonstrating how these two preferences relate to one another under Expected Utility Theory.
  2.  Clarify the normative status of this pattern: does it constitute a logical contradiction in the agent's mind, or a violation of a specific axiom? Explain the distinction.
  3.  Take a stand on whether this preference pattern can be rationally defended. Then, analyze what becomes of that defense if these choices are presented sequentially with an opportunity for the agent to commit to a strategy in advance.

  ***

  ### Model Answer

  The preference pattern **A** $\succ$ **B** and **D** $\succ$ **C** constitutes the classic Allais Paradox, specifically the common consequence effect. To reconstruct the argument, we must express these prospects in terms of their expected utilities, denoted $u(x)$.

  In Pair 1, preferring **A** to **B** implies:
  $$u(500) > 0.90u(500) + 0.09u(3000) + 0.01u(0)$$
  Subtracting $0.90u(500)$ from both sides, this inequality simplifies to:
  $$0.10u(500) > 0.09u(3000) + 0.01u(0)$$

  In Pair 2, preferring **D** to **C** implies:
  $$0.09u(3000) + 0.91u(0) > 0.10u(500) + 0.90u(0)$$
  Subtracting $0.90u(0)$ from both sides, this simplifies to:
  $$0.09u(3000) + 0.01u(0) > 0.10u(500)$$

  These two resulting inequalities are direct contradictions. The first states that the weighted utility of the sure $500 is greater than the risky bundle; the second states the risky bundle is greater. Under Expected Utility Theory (EUT), these choices are incompatible.

  This incompatibility is not a logical inconsistency in the sense of believing $X > Y$ and $Y > X$ simultaneously. The agent is not contradicting themselves within a single choice. Rather, it is a violation of the **Independence Axiom**. This axiom requires that if an agent prefers lottery $L_1$ to $L_2$, they must still prefer $L_1$ to $L_2$ if both are mixed with a common third lottery $L_3$ with identical probability. Here, **A** and **B** share a 0.90 probability of winning $500. **C** and **D** share a 0.90 probability of winning $0. The axiom demands that the common consequence (the 90% chance) should cancel out, leaving the preference order over the residuals unchanged. The agent's reversal indicates that the *context* of the probability (whether it completes a certainty or remains risky) alters their valuation, which EUT forbids.

  Can this be defended? Yes, if one rejects the normative force of Independence. The defense relies on the **certainty effect**: the psychological weight of moving from probability 0.99 to 1.0 is disproportionately larger than moving from 0.90 to 0.91. In Pair 1, **A** offers security; **B** introduces the possibility of regret (getting $0$). In Pair 2, both options are risky, so the agent maximizes expected return by choosing **D**. This is rational if one values security or regret-avoidance as intrinsic goods, not just final wealth states. Non-expected utility theories, such as Rank-Dependent Utility, accommodate this by weighting probabilities non-linearly, specifically overweighting small probabilities and the certainty endpoint.

  However, this defense crumbles in a sequential setting with commitment. Imagine the choice is made in two stages. In Stage 1, a die is rolled. If 1–90 (90%), the game ends with $500 (mimicking **A**'s common branch). If 91–100 (10%), the agent proceeds to Stage 2, where they must choose between the residuals of **B** (the risky bundle) or **C** (the sure $500). If the agent prefers **D** to **C** (the risky bundle to the sure $500 in a risky context), they should choose the risky bundle in Stage 2. Knowing this ex-ante, a sophisticated agent realizes that choosing **A** in the original framing is equivalent to choosing the Stage 2 "sure thing" only because they fear they will make a suboptimal choice later. If they can commit in advance to the strategy "Take the risky branch if reached," the certainty of **A** vanishes. It becomes a 90% chance of $500 and a 10% chance of the risky residual. This reconstructs Prospect **B**. Thus, the preference for **A** relies on a framing illusion that sequential transparency dissolves. A rational agent capable of commitment should recognize the structural identity of the residuals and align their choices, likely abandoning the certainty premium to maximize expected value.

  ***

  ### Marking Scheme

  **Total Marks: 20** (5 Criteria × 4 Marks each)

  | Criterion | Marks | Common Error / Loss of Marks |
  | :--- | :--- | :--- |
  | **1. Formal Reconstruction** | /4 | **0-2:** Fails to write inequalities or fails to show the algebraic cancellation of the common consequence. **3:** Algebra correct but not clearly linked to the contradiction. |
  | **2. Axiom vs. Logic** | /4 | **0-2:** Claims the agent is logically inconsistent (believing $X>Y$ and $Y>X$). **3:** Identifies Independence but fails to explain *why* it applies (cancellation of common branches). |
  | **3. Normative Defense** | /4 | **0-2:** Simply says "people do this." **3:** Mentions certainty effect/regret but fails to explain it as a challenge to the axiom's normativity. |
  | **4. Sequential/Commitment** | /4 | **0-2:** Ignores the commitment aspect. **3:** Discusses sequence but fails to explain how commitment dissolves the "certainty" framing. |
  | **5. Theoretical Precision** | /4 | **0-2:** Names a theory (e.g., Prospect Theory) without explaining what axiom it sacrifices. **3:** Explains the sacrifice but lacks clarity on probability weighting. |

  **Distinguishing an A Answer from a B Answer:**
  *   **B Answer (12–15 marks):** Correctly identifies the Independence violation and performs the algebraic reduction. Defends the preference using the certainty effect. However, it may treat the violation as a "mistake" rather than a theoretical divergence, or it may handle the sequential commitment question vaguely (e.g., saying commitment "fixes" it without explaining the mechanism of framing dissolution).
  *   **A Answer (16–20 marks):** Explicitly distinguishes between logical inconsistency and axiom violation. The defense of the preference is nuanced (acknowledging regret/security as valid utilities). Crucially, the sequential analysis demonstrates how *sophistication* and *commitment* force the agent to recognize the structural identity of the prospects, undermining the psychological defense of the certainty effect. Theoretical references (if used) explicitly state what is being given up (e.g., linearity in probabilities).
