answer: |-
  **Brainstorm**

  *   Focus on the distinction between money as a medium of exchange (circulation) versus money as a store of value (hoard).
  *   Ensure the physical metal remains untouched to satisfy the metallist's condition for wealth preservation.
  *   Use a merchant guild agreement to alter acceptance rules, creating a conventional shift without physical change.
  *   Avoid inflation by keeping the stock of goods and money supply constant; the change is in velocity/acceptance.
  *   Highlight that the "loss" for the Berkeleyan is the loss of *command* over goods, not the loss of substance.

  **Scenario**

  The port of New Bristol relies on Spanish silver pieces for daily trade, with local wealth tied to the circulation of these coins. While the coins remain physically intact and genuine, the local Merchant Guild, fearing debasement abroad, unanimously resolves to accept these coins only by weight and purity assay, refusing their face value for settling debts. Consequently, transactions require costly delays for testing, causing trade volume to collapse despite unchanged stocks of fish, timber, and grain. The silver sits in strongboxes, physically undiminished, but circulates no longer as a medium of exchange, rendering the town's liquid capital inert while its real productive capacity remains fully intact.

  **The metallist's verdict**

  The metallist argues that wealth consists fundamentally in the precious metal itself, which serves as a universal store of value independent of local conventions or temporary shifts in liquidity. Since the silver coins remain physically present within the town, unaltered in weight and purity, the town's real wealth is essentially unchanged. The Guild's decision merely introduces friction into the exchange process, akin to a tax on transaction speed, but it does not annihilate the substance wherein value inheres. The silver retains its purchasing power in international markets and can be melted down for bullion trade regardless of local acceptance rules. Therefore, the town suffers only a temporary inconvenience in liquidity, not a destruction of wealth. The value was always in the metal; the convention merely facilitated its movement. As long as the metal exists, the wealth exists, waiting to be realized whenever the convention shifts back to recognize the intrinsic worth of the silver.

  **The Berkeleyan verdict**

  For the Berkeleyan, money is not a commodity but a ticket or counter granting claim upon real goods, deriving its power solely from convention and circulation. Wealth is not the metal itself but the active power to command labor and commodities through the rapid exchange of these tickets. By refusing to accept the coins as tickets at face value, the Guild has severed the link between the token and the goods it claims. The coins have ceased to function as money, becoming mere metal objects. Since the town's wealth depends on the velocity of exchange and the trust underwriting the token, the collapse of circulation constitutes a real loss of economic power. The metal's presence is irrelevant if the ticket is voided. Thus, the town is poorer because its capacity to mobilize resources via money has been disabled, regardless of the silver's physical survival. (This reconstructs Berkeley's view that money is a sign instituted by law/custom to motivate industry).

  **The feature doing the work**

  The decisive feature is the Guild's unanimous resolution to assay coins rather than accept them by tale. This is a purely conventional shift in the rules of acceptance, unrelated to the physical properties of the coins or the town's productive assets. It alters the status of the coin from a liquid token to an illiquid commodity without changing the material facts. This convention creates the divergence: it allows the metal to persist (satisfying the metallist) while disabling the token's function (satisfying the Berkeleyan). Without this specific agreement, the coins would continue to circulate at face value despite any external fears about debasement. The feature isolates the social agreement from the physical substrate, forcing the two theories to reveal their distinct definitions of wealth.

  **If we remove that feature**

  If we remove the Guild's resolution and restore acceptance by tale, the coins immediately resume functioning as money without any physical change to the silver or the goods. Trade volume recovers, and the town's command over goods is restored instantly. This demonstrates that the loss of wealth was contingent on the convention, not the material substrate. The physical facts of the town remain constant throughout; only the social agreement regarding the token's status changes. This isolates the monetary function from the metallic content, showing that the wealth loss was purely a failure of the ticket system, confirming the Berkeleyan insight that money's essence lies in its accepted role as a counter rather than its substance. The recovery proves the wealth was in the circulation, not the box.

  **How a metallist would push back**

  The metallist replies that the convention merely obscured the true source of value, which remained latent in the silver. The recovery of trade upon removing the resolution proves not that money is a ticket, but that the metal's value requires recognition to be mobilized. The silver anchored the trust; without the metal, the convention would have been worthless paper. Thus, the metal is the necessary condition for wealth, while the convention is secondary. (Note: Berkeley's view holds money is a ticket purely by convention to motivate industry; my reconstruction emphasizes the 'command over goods' aspect. The metallist correctly identifies that without the metal, the ticket might lack anchor, but Berkeley would argue the anchor is trust in the state/community, not the metal itself.)
