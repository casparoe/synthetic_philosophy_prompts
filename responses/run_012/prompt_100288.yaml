  (d) **Discriminating Case**

  The candidates come apart on the penguin case (Nicod=No, Bayes=Yes). To cleanly separate them further, you should test the **Special Consequence Condition**.

  **The Case:**
  Show D a Black Raven and ask: *"Is this evidence for the claim: 'Either every raven is black, or the Moon is made of green cheese'?"*

  *   **Bayesian Prediction:** **Yes.** If $E$ makes $H$ ("All Ravens are Black") more likely, it necessarily makes any disjunction containing $H$ ($H \lor Q$) more likely (or at least no less likely, and typically more, unless $Q$ is negatively correlated).
  *   **Nicod/Logical Prediction:** **No.** Traditional logical confirmation theories (like Hempel's) explicitly **reject** the Special Consequence Condition (if $E$ confirms $H$, and $H$ entails $K$, $E$ does not necessarily confirm $K$). A Black Raven is not an "instance" of a claim about the Moon's composition, even in a disjunction.

