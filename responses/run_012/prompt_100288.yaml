  **The Balance:** The label "Rationalist Reading Group" is the tipping point. While the list of judgments (1–8) is perfectly consistent with the older, qualitative "Logic of Confirmation" (Hempel/Nicod), modern rationalists (in the vein of the LessWrong/Sequences community) are doctrinally Bayesian. They define evidence strictly as probability updating.

