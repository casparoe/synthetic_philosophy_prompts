answer: |-
  You have put your finger on a genuine friction point in moral philosophy, one that often separates tidy theories from lived experience. You are correct to suspect that you are looking at two distinct mechanisms that share a surface structure. The surface structure is the relationship between *act* and *motive*. The underlying mechanisms, however, depend entirely on the *type of relationship* governing the act.

  In your first case (the brother), the relationship is *constitutive*. Being a brother is partly defined by spontaneous care. To introduce a mediating principle ("I ought to help") is to insert a barrier between you and the relationship itself. This is what Bernard Williams was capturing with the "one thought too many" idea. The moral cost here is *alienation*; the motive of duty distances you from the very person you are helping.

  In your second case (the dog), the relationship is *volitional*. It is founded on a specific commitment (a promise). Here, spontaneity is a risk because whims change. The moral value lies in *stability*. Invoking the duty ("I promised") reinforces the reliability of the bond. The moral cost here would be *flakiness*; the motive of whim undermines the trust required by the commitment.

  So, is it one objection or three? It is one general question—"What motive fits this obligation?"—but it requires two different answers depending on whether the obligation arises from *who you are to each other* (identity) or *what you said to each other* (commitment).

  Regarding the reply that "the theory was never meant to be the thing running through your head": this is the distinction between *criteria of rightness* (what makes the act good) and *decision procedures* (what you think about while acting). It is not a dodge, strictly speaking, but it is often used as one. It is valid to say a theory defines truth conditions without dictating psychology. However, if a theory consistently recommends motives that feel alienating or unstable in practice, it is psychologically unsustainable. A theory that tells you to love your brother because a universal law commands it is logically coherent but humanly brittle. The distinction saves the theory from contradiction, but not from irrelevance.

  You are looking for a way to carve out the *appropriateness* of a motive relative to the context. Existing terms cover the halves, but not the whole shape.

  | candidate term or label | the field it comes from | what it claims | how it fits my two cases | where it breaks down | verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **One Thought Too Many** | Moral Psychology / Partiality | In intimate relationships, invoking impartial morality corrupts the action. | Fits Case 1 (Brother) perfectly; explains why duty feels cold. | Does not explain Case 2 (Dog), where duty feels solid. | Partial |
  | **Moral Worth** | Deontology (Kantian) | An act only has true moral value if done from duty, not inclination. | Fits Case 2 (Dog) perfectly; explains why whim feels flaky. | Fails Case 1 (Brother), where duty feels alienating. | Partial |
  | **Criteria vs. Decision Procedure** | Meta-Ethics | What makes an act right is separate from the agent's deliberation. | Explains why the "dodge" exists; separates theory from psychology. | Does not explain *why* one motive feels better than the other; just says it doesn't matter for truth. | Different thing altogether |
  | **Alienation** | Critical Theory / Ethics | Moral theories can separate agents from their ground projects. | Fits Case 1 well; duty alienates brother from brother. | Doesn't capture the positive value of duty in Case 2. | Partial |
  | **Virtue Ethics (Phronesis)** | Normative Ethics | The right act is what the virtuous person would do, with the right feeling. | Fits both: the virtuous person feels love for brother, duty for promises. | Doesn't name the specific tension; just says "it depends on the virtue". | Closest |
  | **Special Obligations** | Normative Ethics | Duties vary based on relationships (family vs. strangers). | Explains why the cases are different contexts. | Doesn't address the *motive* problem, only the scope of duty. | Different thing altogether |

