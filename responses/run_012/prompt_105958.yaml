  *(Self-Correction Note on "Demurrage"):* Silvio Gesell is the famous proponent of demurrage. Berkeley predates him. Does Berkeley explicitly suggest taxing idle money? He suggests taxing luxury and encouraging circulation. Query 61 implies velocity is key. Query 89 asks if taxes might be better levied on luxury. He doesn't explicitly propose negative interest, but the *logic* of velocity + moral hazard of hoarding strongly implies it. I will rate confidence High but note it's an extrapolation from principle rather than explicit text.

  *(Self-Correction on "Chartalism"):* Knapp's Chartalism is 1905. Berkeley's "ticket" theory is similar but grounded in idealism (money is a sign of power/industry). The Friend is right on the "state theory of money" but maybe wrong on the macroeconomic management style.

