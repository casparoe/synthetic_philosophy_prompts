      *   *Correction on Programmability:* Berkeley wouldn't know "code," but he understands "restriction." He would support restrictions on *luxury* or *hoarding*, but maybe not arbitrary freezing. I need to balance his authoritarian streak (moralist) with his liberal streak (property rights). Let's lean towards "Supportive if used for public good."
      *   *Correction on Sovereignty:* Berkeley wanted an Irish bank *within* the British realm, but with autonomy. He would likely hate the ECB because it removes local discretion to stimulate *Irish* industry specifically.
      *   *Confidence Levels:* Be honest. High on fiat/demurrage. Medium on programmability (too tech-specific).

  7.  **Final Review against Constraints:**
