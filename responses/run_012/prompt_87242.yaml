      *   **The Trait Under Selection:** Explicitly answer this. It's the neural substrate, not the experience.
      *   **Evaluation:** Does the residue indicate a gap? No, it indicates the philosophical objection is framed in individualistic/mechanistic terms that don't map perfectly to population-level selection. The evolutionary view actually *supports* epiphenomenalism (as a spandrel theory) but dissolves the "objection" by focusing on the adaptive value of the neural substrate, not the experience.

  8.  **Refining the "Trait Under Selection" point:**
      *   If epiphenomenalism is true, consciousness *cannot* be the trait under selection. It must be a free rider.
      *   The objection claims that reporting behavior ($R$) *looks* like it was selected to track $M$.
