answer: |-
  Here is the restatement of the epiphenomenalist thesis and the standard objection, translated into the vocabulary of evolutionary biology, followed by the residue report and analysis.

  ### 1. Restatement in Evolutionary Vocabulary

  **The Thesis (Consciousness as a Fitness-Inert Byproduct)**
  Conscious experience is a phenotypic trait ($T_{exp}$) that is developmentally coupled to a neural substrate ($T_{neural}$). $T_{neural}$ is heritable and has been subject to positive selection due to its contribution to organismal fitness (e.g., motor coordination, homeostasis, information processing). However, $T_{exp}$ itself confers no fitness advantage nor disadvantage. It is a **spandrel** or a **free rider**. While $T_{neural}$ causally produces $T_{exp}$, $T_{exp}$ exerts no downstream causal influence on behavior, reproductive success, or survival. In terms of the **selection gradient**, the partial regression coefficient of fitness on $T_{exp}$, controlling for $T_{neural}$, is zero.

  **The Objection (The Tracking/Reliability Problem)**
  Organisms exhibit a reporting behavior ($B_{report}$)—verbal or non-verbal signals—that correlates with high fidelity to $T_{exp}$. In selectionist terms, $B_{report}$ appears to be an **adaptation** designed to track the state of $T_{exp}$.
  *   **The Puzzle:** If $T_{exp}$ is fitness-inert and causally powerless, there is no **selective pressure** for $B_{report}$ to track $T_{exp}$ specifically.
  *   **The Covariance Issue:** For $B_{report}$ to evolve as a reliable signal of $T_{exp}$, there must be a history of **covariation** between the signal and the trait that impacts fitness. If $T_{exp}$ does not influence survival, why did the mechanism producing $B_{report}$ evolve to discriminate states of $T_{exp}$ so precisely?
  *   **The Alternative:** If $T_{neural}$ causes both $T_{exp}$ and $B_{report}$ (a **common cause** structure), the correlation is explained mechanistically. However, the objection argues this is insufficient: without $T_{exp}$ exerting causal power, the *accuracy* of the report regarding the *specific qualitative nature* of the experience is evolutionarily inexplicable. It looks like a miraculous coincidence that the organism reports "pain" when the inert feeling of pain occurs, rather than reporting "pain" when some other inert feeling occurs, if the feeling itself plays no role in generating the report.

  ***

  ### 2. Residue Report

  Here is the breakdown of how the philosophical concepts map onto your evolutionary framework.

  #### A. Clean Translations
  *   **Causal Inertness $\rightarrow$ Zero Selection Coefficient:** The claim that experiences cause nothing translates cleanly to the claim that the trait confers no fitness benefit. It is a neutral trait in the context of the selection landscape.
  *   **Brain Processes $\rightarrow$ The Selected Substrate:** The physical brain states map cleanly to the physiological machinery that is the actual target of selection ($T_{neural}$).
  *   **Byproduct/Spandrel:** Epiphenomenalism is structurally identical to the Gould-Lewontin concept of a spandrel. The experience is an architectural consequence of the selected neural architecture, not the adaptation itself.
  *   **Reports/Behavior $\rightarrow$ Signaling Phenotype:** The act of saying "I am in pain" translates to a behavioral output that functions as a signal within the population or to the self.

  #### B. Distorted Translations
  *   **"Cause" (Mechanistic vs. Historical):** In philosophy, "cause" refers to immediate token-level physical causation (billiard balls hitting). In your framework, "cause" often refers to historical selection pressures or developmental pathways. Translating "X causes Y" to "X was selected for Y" distorts the epiphenomenalist claim, which is about *now*, not *then*. However, translating it to "X contributes to fitness via Y" captures the functional aspect.
  *   **"Function":** In philosophy of mind, "function" often implies causal role. In biology, "function" implies evolutionary history (selected effect). An epiphenomenalist says experience has no causal role; a biologist might say it has no *selected* function. These are similar but not identical (a trait can have a causal role but no selected function, or vice versa via exaptation).
  *   **"Reliability":** The philosophical objection worries about *veridicality* (truth). Evolution cares about *reliability* only insofar as it enhances fitness. A signal can be reliable but maladaptive, or unreliable but adaptive (e.g., bluffing). The objection assumes the report *ought* to be accurate; evolution asks *why* it is maintained.

  #### C. No Expression (The Missing Residue)
  *   **Qualia (Intrinsic Nature):** Evolutionary biology has no vocabulary for the "what-it-is-likeness" of a trait. Biology tracks structure, behavior, and genetics. The specific *quality* of the experience (the redness of red) has no analogue in fitness landscapes. It is invisible to selection unless it covaries with a physical substrate.
  *   **Intentionality (Aboutness):** The philosophical worry is that the report is *about* the experience. Evolution deals with covariance and signaling, not semantic reference. A gene doesn't "refer" to a protein; it codes for it. The notion that a report must be *about* an internal state to be valid is a normative/semantic claim, not a biological one.
  *   **Justification/Knowledge:** The objection is ultimately epistemological: "How can we *know* we have experiences if they do nothing?" Biology cannot answer questions of justification, only questions of mechanism and history.

  ***

  ### 3. Analysis: Gap in Framework or Lack of Clarity?

  **The Trait Under Selection**
  To answer your specific interest: In the epiphenomenalist framework, the **trait under selection is exclusively the neural substrate ($T_{neural}$)**. The conscious experience ($T_{exp}$) is *not* a trait under selection; it is a non-adaptive consequence of the trait under selection.
  *   If consciousness were the trait under selection, epiphenomenalism would be false (because it would have causal power).
  *   Therefore, the reporting behavior ($B_{report}$) must be selected for its correlation with $T_{neural}$, not $T_{exp}$.

  **Evaluation of the Residue**
  The residue indicates **neither a gap in your framework nor a lack of clarity in the claim, but rather a category mismatch between the disciplines.**

  1.  **Why it's not a gap in your framework:** Evolutionary biology is not equipped to solve the "Hard Problem" of consciousness (why physical processes feel like anything). Your vocabulary is designed to explain the *distribution* and *maintenance* of traits in populations, not the *metaphysical nature* of those traits. The fact that "qualia" has no expression in your vocabulary is a feature, not a bug; it suggests that qualia are not variables in the selection equation.
  2.  **Why the Epiphenomenalist's claim becomes clearer:** Translating the objection into selectionist terms actually **dissolves the force of the objection**.
      *   *The Philosophical Worry:* "If experience doesn't cause the report, the report is unexplained."
      *   *The Evolutionary Resolution:* "The report is caused by the neural substrate ($T_{neural}$). The experience ($T_{exp}$) is a byproduct of $T_{neural}$. Therefore, $T_{neural}$ causes both the experience and the report."
      *   In biology, this is a standard **pleiotropic** or **common cause** scenario. We do not require a hormone to "cause" the behavior it correlates with if both are caused by the same glandular secretion. We do not require the "feeling" of the hormone to cause the behavior.

  **Conclusion**
  The "standard objection" relies on an intuition that accurate reporting requires the reported object to push the reporter. In selectionist terms, this is false. Accurate reporting requires a **shared causal ancestor** (the neural substrate) and a **selection pressure** to maintain the correlation (because the neural substrate matters for fitness).

  The residue shows that the philosophical objection is actually a disguised worry about **semantic reference** (how does the word "pain" latch onto the feeling?), which evolutionary biology treats as a **signaling system** problem. As long as the signaling system ($B_{report}$) is coordinated with the internal state ($T_{exp}$) via the common driver ($T_{neural}$), evolution is satisfied. The fact that $T_{exp}$ is inert is irrelevant to the stability of the signal, provided $T_{neural}$ remains the driver.

  Thus, your framework suggests the epiphenomenalist thesis is biologically plausible (as a spandrel theory), and the standard objection is biologically weak (it mistakes correlation for direct causation). The "gap" is in the philosopher's assumption that inertness precludes reliable tracking, whereas biology shows that common causes ensure reliable tracking without direct causal links between the correlated traits.
