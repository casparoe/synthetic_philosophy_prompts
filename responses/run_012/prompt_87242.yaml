      *   *Nuance:* The philosophical objection is about *justification* of belief. The evolutionary translation is about *reliability* of signal. I need to make sure this distinction is clear in the residue report. The "missing" element is the normative aspect of knowledge.

  10. **Final Review against constraints:**
