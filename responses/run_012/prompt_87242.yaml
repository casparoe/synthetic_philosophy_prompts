  9.  **Final Polish:** Ensure tone is respectful of the user's expertise. Use terms like "exaptation," "spandrel," "fitness landscape," "phenotypic covariance." (Self-Correction: Keep it precise. Don't overuse jargon where simple terms work, but honor the user's background).

