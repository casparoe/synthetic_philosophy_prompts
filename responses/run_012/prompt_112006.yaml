answer: |-
  The diagnosis of this debate is that it is a **methodological dispute masquerading as a metaphysical one**. While your hypothesis regarding the semantic usage of 'cognitive' (natural-kind vs. functional-role) is accurate regarding the *surface grammar* of the arguments, it does not explain why the debate is *stuck* rather than merely unresolved. If it were purely semantic, the sides could stipulate definitions and move on. The fact that they do not suggests they are fighting over the **explanatory jurisdiction of cognitive science**.

  What the arguments *do* is police the boundaries of a scientific discipline. The proponents (Extended Mind) argue for a boundary that maximizes **explanatory unification**: by treating tools as memory, we can use the same cognitive models for Otto-with-notebook as for Inga-with-brain. The critics (Internalists) argue for a boundary that maximizes **mechanistic specificity**: by restricting cognition to the brain, we ensure that cognitive science remains distinct from sociology, tool-use analysis, or general systems theory. When Adams and Aizawa invoke the "Coupling-Constitution Fallacy," they are not making a logical point so much as a disciplinary one: they are insisting that causal dependence does not warrant the same *type* of explanation. When Clark invokes the Parity Principle, he is demanding that explanatory power, not biological substrate, dictate the ontology.

  The hidden question carrying the weight is not empirical (how the brain works) nor purely formal (how mechanisms are individuated), but **normative**: *What counts as a legitimate unit of explanation in cognitive science?* The debate is stuck because both sides are correct about their respective theoretical virtues. Unification is good; mechanistic specificity is good. There is no fact of the matter that can arbitrate between two competing methodological ideals.

  ### The Neglected Case: The Shared, Alterable Resource

  Consider a variation on Otto: Otto uses a digital notebook hosted on a server managed by a third party (say, a caretaker or an AI assistant) that automatically corrects or updates entries based on external data Otto hasn't seen. The resource is reliably coupled (Otto accesses it automatically) and trusted (he endorses the output). However, the *content* is partially determined by another agent's discretion. Reliability is high, but the "trust" is not solely Otto's endorsement; it is delegated.

  This case strains the Proponent's functionalism. If cognition is defined by functional role, and the role is fulfilled, the resource should be cognitive. But if the resource is subject to *another agent's* will, has Otto's mind extended, or has he entered a **distributed cognitive system** involving two agents? The Internalist will seize this to say, "See, the boundary of the *individual* cognitive system must stop at the skull because this resource involves social negotiation, not just memory retrieval."

  This case favors the **System Individuation hypothesis** (your second option) but deepens it: the disagreement is not just about where cognition stops, but where the **agent** stops. The Proponents treat the cognitive system as potentially distinct from the biological organism (a system can include tools). The Critics treat the cognitive system as essentially tied to the individual agent (the organism). The shared notebook case reveals that the "stuckness" arises because the Proponents are trying to extend *cognition* without extending *agency*, while the Critics insist you cannot have one without the other. When reliability and trust come apart (the system works, but Otto doesn't control the updates), the Parity Principle fractures. It shows that "functional role" is not enough; *control* and *ownership* are tacitly required for something to count as *my* mind.

  ### The Path to Progress

  Given this diagnosis, the dispute should be **dissolved rather than settled**.

  There will be no empirical result that settles whether the notebook is "really" part of Otto's mind, because 'cognitive system' is not a natural-kind term like 'gold' or 'tiger' waiting to be discovered. It is a **theoretical construct** designed to carve nature at joints that serve specific explanatory interests. To demand a verdict on who is right is to commit a category mistake: it assumes there is a mind-independent fact about the boundary of cognition, when the boundary is actually a function of the model being used.

  Progress consists in abandoning the question "Is the external resource part of the cognitive system?" and replacing it with: **"At what grain of analysis does extending the boundary yield predictive or explanatory leverage?"**

  We should adopt a stance of **Explanatory Pragmatism**. In some contexts (e.g., studying human-computer interaction or collaborative problem solving), treating the notebook or the partner as part of the cognitive loop is the most efficient modeling strategy. In other contexts (e.g., studying neural plasticity or psychopharmacology), restricting the boundary to the skull is necessary. The debate persists only because both sides insist their boundary is the *only* legitimate one.

  Therefore, the specific distinction required to move forward is between **ontological constitution** and **explanatory integration**. We must stop asking if the notebook *is* memory (ontology) and start asking if modeling the notebook *as* memory improves our understanding of Otto's behavior (explanation). Once we acknowledge that 'cognitive' is a context-sensitive label for a process of regulation rather than a static location, the Coupling-Constitution fallacy loses its bite. It is not a fallacy to say coupling constitutes cognition *for the purposes of a specific model*.

  The debate is stuck because it is trying to solve a pragmatic problem with metaphysical tools. The way out is to admit that the boundary of the mind is not a line drawn in nature, but a line drawn in a map, and different maps require different borders.
