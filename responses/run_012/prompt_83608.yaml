      *   *Step 3: Show Divergence in Verdicts.* Use a case where the accounts give different answers (like the beetle).
      *   *Step 4: Validate Both.* Show that *both* answers are useful depending on the biologist's goal. This kills the "one is right, one is wrong" idea.
      *   *Dependency:* You can't map accounts to questions (Step 2) until they acknowledge distinct questions exist (Step 1). You can't validate both (Step 4) until you see they diverge (Step 3).
