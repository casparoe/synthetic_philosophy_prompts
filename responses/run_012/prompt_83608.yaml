answer: |-
  1. **The Sequence of Components**

  To move students from "competing definitions" to "distinct explanatory projects," you must establish the legitimacy of the questions before evaluating the answers. The components must be introduced in this order:

  *   **Component 1: The Distinction between "How it Works" and "Why it is There."**
      *   *Dependency:* This must come first. Students cannot see that the accounts answer different questions if they do not first recognize that biology asks two fundamentally different types of questions about traits.
      *   *Why:* If you introduce the accounts first, students treat them as definitions of "function." If you introduce the *explanatory goals* first, they treat the accounts as tools.
  *   **Component 2: Mapping the Accounts to the Questions.**
      *   *Dependency:* Requires Component 1.
      *   *Why:* Once they accept there are two questions (History vs. Mechanism), you map the Etiological account to "Why is it There?" and the Causal-Role account to "How it Works." This frames the disagreement not as "Which definition is true?" but as "Which question are you asking?"
  *   **Component 3: The Divergence Case (The Beetle).**
      *   *Dependency:* Requires Component 2.
      *   *Why:* Now that they have the map, the beetle case shows the accounts yielding different verdicts. Without Component 2, they will simply vote on the verdict. With Component 2, they can analyze *why* the verdicts differ (History says no, Mechanism says yes).
  *   **Component 4: The Legitimacy of Both Verdicts.**
      *   *Dependency:* Requires Component 3.
      *   *Why:* You must show that *both* verdicts are scientifically useful depending on the researcher's goal. This cements the idea that neither account is "wrong"; they are just specialized for different inquiries.

  **Why not the reverse?** If you start with the Beetle (Component 3), students will treat the divergent verdicts as a contradiction to be resolved by picking a winner. They will not see the underlying questions. If you start with the Accounts (Component 2) before the Questions (Component 1), they will memorize the accounts as definitions rather than explanatory strategies.

  2. **Evaluating the Beetle Case and the Necessary Foil**

  **Can the beetle carry the session?**
  No. The beetle case is asymmetrical. It makes the Causal-Role account look correct (it captures the life-saving utility) and the Etiological account look absurd (it denies a function to a vital trait). If used alone, students will conclude the Etiological account is simply false, reinforcing the "competing definitions" view where one definition wins.

  **What it must have and lack:**
  *   **It has:** A trait with high current utility but no history of selection. This successfully triggers the divergence.
  *   **It lacks:** A scenario where the Causal-Role account yields a counter-intuitive or scientifically unhelpful result. It fails to show the *cost* of the Causal-Role account's permissiveness.

  **The Foil:**
  You must pair the beetle with a case of **Incidental Utility** (a byproduct that is useful but intuitively not a function).
  *   **The Case:** A moth whose wing color matches the bark (camouflage). The color is a chemical byproduct of the wing's structural hardening (no selection for color). However, the color *also* absorbs heat, keeping the moth active in cold mornings (useful).
      *   *Wait, this is just another beetle.*
      *   *Correction:* You need a case where Causal-Role attributes a function that we want to *reject*.
      *   **The Foil Case:** **The Sound of the Wings.** When the beetle flies, the ridges vibrate and create a low hum. This hum happens to shake parasites off the beetle's back.
      *   **Etiological Verdict:** No function (not selected for).
      *   **Causal-Role Verdict:** Has a function (contributes to parasite removal capacity).
      *   **Why this foil?** It forces students to feel the *over-generation* of the Causal-Role account. If "function" means "any useful contribution," then the hum has a function. But biologists typically distinguish between the *function* of the wing (flight) and the *side effect* (hum/parasite removal).
  *   **Where in the sequence:** Introduce the Foil immediately after the Beetle, once students have sided with Causal-Role on the Beetle.
  *   **What it must accomplish:** It must make the Causal-Role account look *too broad*. The Beetle makes Etiological look too narrow; the Foil makes Causal-Role look too permissive. This tension forces them to realize that "function" isn't one thing, but depends on whether they care about history (design) or current capacity (mechanism).

  3. **Misconceptions: Order and Intervention**

  1.  **"The Etiological account is refuted."**
      *   *When:* Immediately after the Beetle case is introduced.
      *   *Why:* The trait is vital for survival; denying it a function seems biologically illiterate.
      *   *Intervention:* Head this off at **Component 2**. Before showing the verdict, ask: "If I ask 'Why did this trait evolve?' vs 'How does this beetle survive today?', do I get the same answer?" Force the question distinction before the verdict.
  2.  **"Causal-Role means 'anything useful'."**
      *   *When:* During the Beetle discussion.
      *   *Why:* They will simplify the account to "function = good for the organism."
      *   *Intervention:* Head this off at **Component 4 (The Foil)**. Use the Foil to show that "useful" is not enough if we are asking about evolutionary history. Clarify that Causal-Role is about *system capacity*, not just "goodness."
  3.  **"One account must be the 'real' one."** (The Synthesis Fallacy)
      *   *When:* At the end, during wrap-up.
      *   *Why:* Even after seeing both are useful, they want a single truth.
      *   *Intervention:* Explicitly state that in professional biology, papers specify which sense they are using. It is not a truth claim; it is a methodological choice.
  4.  **Unanticipated: "Function implies intention."**
      *   *When:* Early, when defining "function."
      *   *Why:* Biology majors often struggle to decouple function from conscious purpose.
      *   *Intervention:* Head this off at **Component 1**. When distinguishing the questions, emphasize that "Why is it there?" refers to blind historical processes, not goals.
  5.  **Unanticipated: "Causal-Role is just Engineering."**
      *   *When:* During the Foil.
      *   *Why:* They may think Causal-Role only applies to artifacts or physiology, not evolution.
      *   *Intervention:* Remind them that physiology *is* biology. The capacity of the system is a biological fact, regardless of history.

  4. **The Closing Question**

  Do not ask "What is the difference?" (Invites slogans). Do not ask "Which is correct?" (Invites opinion).

  Ask this:
  > "You are writing two different grant proposals about the beetle ridges. Proposal A is for the *Journal of Evolutionary Biology*. Proposal B is for the *Journal of Comparative Physiology*. In the 'Significance' section of each, you must state whether the ridges have a function. Do you make the same claim in both proposals? If not, what specifically changes?"

  *   **Why this works:** It forces them to link the account to the *disciplinary goal*. If they say "Yes, same claim," they haven't grasped the distinction. If they say "No," they must articulate that the Evolutionary journal cares about history (Etiological: No function) and the Physiology journal cares about current capacity (Causal-Role: Yes function). It tests application, not definition.

  5. **What to Decline (Relativity of Beneficiary)**

  **You should decline to take this up.** You are correct to cut it.

  *   **Why:** The distinction between "Whose good?" (Gene vs. Individual vs. Group) is the **Unit of Selection** problem. The distinction between Etiological and Causal-Role is the **Definition of Function** problem.
  *   **The Risk:** If you introduce beneficiary relativity now, students will conflate "Etiological" with "Individual Selection" and "Causal-Role" with "Group Selection" (or similar errors). It adds a second axis of complexity to a session dedicated to untangling one axis.
  *   **The Explicit Cut:** Say this: "You might wonder if function depends on *who* benefits—the gene, the individual, or the group. That is a crucial question in philosophy of biology, but it is distinct from the question we are tackling today. Today we are asking whether function is about *history* or *current capacity*. We are holding the beneficiary constant to isolate that distinction. If we mix them, we won't know which tool is doing the work."
  *   **Why this is the right cut:** It protects the pedagogical goal. You want them to leave understanding History vs. Mechanism. Introducing Level of Selection muddies the water without clarifying the core distinction.
