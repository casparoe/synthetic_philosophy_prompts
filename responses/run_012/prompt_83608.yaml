      *   **Context:** 50-minute discussion section, 3rd-year undergrads (mostly Biology majors), Philosophy of Biology course.
      *   **Prior Knowledge:** One lecture on Etiological (Selected Effects) vs. Causal-Role (System) functions. Used the *heart* as the sole example.
      *   **Student Misconception:** They think the two accounts are competing definitions of the *same* word (terminological dispute) rather than addressing different explanatory projects.
      *   **Goal:** Dislodge the belief that it's merely terminological. Show they answer different questions.
