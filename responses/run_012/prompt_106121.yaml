answer: |-
  Dear Friend,

  You are right to sense that the question will not land unless the ground is prepared, and your instinct to avoid the usual religion versus rights framing is the most important move you will make. If they walk in thinking this is a battle between religious dogma and civil liberties, any ontological question you ask will be heard as a Trojan horse for one side or the other. Before you can ask what marriage is for, you have to establish that marriage is the kind of thing that can have a purpose independent of what the state says or what individuals feel. You need to spend the first ten minutes shifting the frame from access to architecture. Do not start by asking who should be allowed to marry. Start by asking whether marriage is something the government creates, like a corporation, or something the government recognizes, like a family. If they agree it is merely a legal contract, the discussion ends because the answer is whatever the law says it is. If they agree it is a pre-political reality, then you have opened the space to ask what that reality consists of. You need them to agree that there is a difference between a marriage that is legally valid and a marriage that is real, even if only for the sake of the argument.

  Once that distinction is on the table, you introduce the infertile couple case, and you are correct that this is the single case that must carry the hour, but it needs to be constructed carefully to avoid feeling like a trick. The case must be a young couple who are medically infertile through no choice of their own, not an elderly couple, because age introduces the variable of past fertility which complicates the metaphysics. You present them as fully married in every social and legal sense, and then you ask the room why we count them as married if the traditional view is supposedly about children. This is where the distinction between a union that happens to be childless and a union that is not ordered toward children must come in, and you should introduce it immediately when the first person objects that infertility disproves the procreative view. It is not a dodge, though it sounds like one to modern ears, so you have to be honest about what it claims. The claim is that marriage is defined by the kind of act that constitutes it, not the outcome of that act. A sterile couple performs the same kind of bodily union as a fertile couple, whereas a same-sex couple, on this view, cannot perform that specific kind of act regardless of love or commitment. You must not let the case drift into adoption or parenting skills, because that concedes the point that marriage is primarily about raising children rather than the union itself. Keep the focus on the couple and their bodies, not their home life.

  This sets you up to handle the confusions in the order they will naturally surface. The first objection, that the traditional side is just procreationism, is headed off by the infertile couple case itself. If marriage were only about producing children, the infertile couple would not be married. Since we agree they are married, the definition must be about the type of union that is inherently oriented toward family life, even if biology frustrates it. You need to make sure this lands before moving on, because if they think the traditional view is simply "babies now," the rest of the hour is wasted. The second confusion, that marriage is a natural kind like water, will arise when you try to solidify this definition. Someone will say that if marriage is real, it must be something we discover rather than invent. This is where you let the two members who lock horns on social constructs versus natural kinds have their moment, but you must give their clash a stake so it does not become a semantics seminar. Ask them what follows from each view. If marriage is a social construct, then society can rewrite the rules as it sees fit. If it is a natural kind, then society can only recognize or fail to recognize it, like a biologist classifying a species. The disagreement matters because it determines who has the authority to define the term.

  The third objection, that you cannot get an ought from an is, is the hardest and should come last, just before you wrap up. This is the point where someone will argue that even if marriage naturally tends toward children, that does not mean we ought to restrict it to such unions. You do not need to solve Hume's guillotine in an hour, but you do need to point out that for social institutions, the is and the ought are often tangled. If a knife is defined by its ability to cut, a knife that cannot cut is a bad knife, not a different kind of object. If marriage is defined by a specific kind of union, a union that cannot achieve that form is arguably not a marriage, or at least not a complete one. You should acknowledge that this moves from description to prescription, but remind them that the prescription follows only if they accept the definition of the thing itself. If they reject the definition, the ought disappears, which brings you back to the construct versus discovery debate.

  To close the session, you need one question that tells you whether they have grasped the real disagreement rather than just calmed down. Do not ask them if they agree on same-sex marriage. Ask them whether the state would be making a mistake if it recognized a marriage that was inherently incapable of being consummated in the biological sense. If they say yes, they believe marriage has an internal logic the state must respect. If they say no, they believe marriage is whatever the state says it is. Their answer to that will tell you if they understand that the debate is about authority and ontology, not just kindness or tradition.

  Finally, you asked me to tell you honestly what you should refuse to do, and you should say this out loud to the group at the start. You must refuse to try to resolve the policy question of same-sex marriage in this session. You cannot settle a political and moral debate in an hour, and if you try, you will become the judge rather than the facilitator. You must also refuse to let the group define marriage definitively. The goal is not to agree on a definition but to agree on what is being disputed. If you try to force a conclusion, the people who feel they lost will retreat to their corners. Your job is to make the disagreement deeper and more precise, not to solve it. If you can leave them with the sense that they are arguing about different kinds of realities rather than just different values, you will have done enough.

  Warmly,

  Your Assistant
