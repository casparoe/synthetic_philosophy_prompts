prompt: |-
  I'm in my third year of a bio degree and taking a philosophy of technology seminar as an elective this term, and we just did von Neumann's late essay on whether a technological civilization can survive. The gist as I understand it: technology keeps enlarging the scale of the units it acts on until it runs up against the actual size of the planet, it pushes toward effects that can be projected from any point on Earth to any other, so it collides with geography and with every institution built on geography, and the only safeguard he can see is a long sequence of small, opportunistic, year-by-year correct decisions, since you can't stop the progress, you can only steer it. He flags weather and climate control as one of the coming technologies, and he spent his last years on machines that could build copies of themselves.

  I know evolutionary biology a lot better than I know this stuff. Can you restate his position as faithfully as you can in the vocabulary I actually think in, lineages, heritable variation, selection, fitness, adaptation, speciation and reproductive isolation, extinction, bottlenecks, drift, niche construction, without just relabelling his sentences with bio words? Then give me the residue report: which of his claims come through cleanly, which only come through if you distort them, and which have no expression at all in evolutionary terms. And I want a verdict on the residue, is the evolutionary vocabulary definately missing something real, or is it showing that his question was vaguer than it sounds? Please write it as continuous prose, no headings, no bullet points, no bold, no tables, just the way you'd write an email.
