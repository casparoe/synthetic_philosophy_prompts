answer: |-
  Hey, it is great that you are tackling von Neumann this term, especially given your background. If we try to restate his position using the vocabulary you live in, we have to treat the technological civilization not as a toolset but as an extended phenotype of the human lineage that has begun to exhibit its own evolutionary dynamics. In this frame, the enlargement of scale you described is essentially niche construction expanding until it saturates the available environment, meaning the organism's impact on selective pressures is no longer local but global. When von Neumann says technology runs up against the size of the planet, he is describing a hard carrying capacity limit where density-dependent selection pressures become uniform across the entire population. The collision with geography and institutions translates to the homogenization of selection pressures wiping out local adaptations; institutions are effectively co-adapted gene complexes or stable equilibria that evolved to fit specific spatial heterogeneities, and when the niche construction becomes planetary, those local fitness peaks disappear, leaving the lineage on a single, precarious peak. His claim that we cannot stop progress but only steer it is analogous to saying that once a lineage has committed to a high-energy niche, reverting is impossible due to evolutionary irreversibility, so survival depends on navigating a fitness landscape without falling into extinction valleys. The safeguard he proposes, a sequence of small correct decisions, is essentially walking a ridge on that landscape where any deviation leads to a bottleneck or extinction, and his interest in self-reproducing machines highlights that he sees the logical core of this lineage as the replicator itself, independent of the biological substrate.

  When we look at the residue of this translation, some claims come through cleanly while others require significant distortion. The concepts of extinction, bottlenecks, and niche construction map very well to his warnings about planetary limits and the destabilization of existing structures; the idea that a lineage can engineer its environment to the point of undermining its own fitness is standard evolutionary ecology. However, the notion of steering requires distorting the concept of selection because natural selection has no foresight, whereas von Neumann is banking on conscious, sequential decision-making acting as a substitute for blind variation and selection. In evolutionary terms, this looks like artificial selection applied by the lineage to itself, which is theoretically possible but historically unstable because it requires group-level agency that usually fractures under individual-level selection pressures. Furthermore, there is almost no expression in evolutionary vocabulary for the survival of civilization distinct from the survival of the species; evolution cares about reproductive isolation and lineage persistence, not the maintenance of a specific cultural or technological state, so a scenario where humans survive but civilization collapses is an evolutionary success even if it is von Neumann's failure.

  The verdict on this residue suggests that the evolutionary vocabulary is not missing something real so much as it is revealing that von Neumann's question was vaguer than it sounds regarding the mechanism of control. By translating his hope for steering into biological terms, we see that he is proposing a form of group selection where the lineage consciously avoids maladaptive traits, but evolutionary theory suggests that without reproductive isolation or strong bottlenecks to align individual fitness with group survival, such steering is prone to drift and defection. The bio vocabulary shows that his diagnosis of the problem is robust, as the scaling of niche construction leading to planetary constraints is a clear ecological trajectory, but his proposed solution relies on a level of coordinated agency that evolutionary systems rarely sustain without collapsing into simpler replicator dynamics. So it is not that the biological lens fails to capture his argument, but rather that it captures it too well, exposing that the safeguard he hopes for is evolutionarily unlikely because it fights against the grain of how complex systems actually persist under selection.
