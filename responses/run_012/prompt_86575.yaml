answer: |-
  Here are ten questions designed to probe the vulnerabilities of the speaker's specific formulation of disjunctivism, complete with follow-ups keyed to standard disjunctivist defensive moves.

  **1. The "Looks" Common Factor**
  You argue that we can dissolve the Argument from Illusion by separating *perceiving the stick* from *the way the stick looks*. However, if you concede that the stick *looks* the same way in both the veridical and the illusory case, doesn't this "looking the same" function as the very common fundamental kind you aim to reject?
  *Follow-up:* You are likely to reply that "looks" is a comparative or relational property, not a mental state. But if this property is stable across the disjunction, what prevents it from grounding a common psychological explanation without becoming an *ad hoc* exception to your disjunctive thesis?

  **2. Indistinguishability and Brute Fact**
  If the Argument from Illusion is merely a distraction, does the motivation for disjunctivism rest entirely on the possibility of perfect hallucination? If so, how do you propose to explain the subjective indistinguishability of the good and bad cases without treating it as a brute fact?
  *Follow-up:* You will likely argue that indistinguishability is an epistemic notion, not a metaphysical one. But if the metaphysical grounds are totally different, what explains the epistemic limitation other than a shared phenomenology, and isn't calling it "merely epistemic" just a label for the brute fact you wish to avoid?

  **3. Positive Characterization of Hallucination**
  If a hallucination is not a perception of a mind-independent object, does it have any positive intrinsic nature of its own, or is your view committed to defining the hallucinatory case solely by its failure to be a perception?
  *Follow-up:* I anticipate you will reply that a purely negative account of the bad case is all the view requires. But if the hallucinating subject is having a conscious experience, doesn't a purely negative characterization leave the actual phenomenology of that experience unexplained and theoretically empty?

  **4. Metaphysical vs. Epistemic Disjunctivism**
  Is your disjunctivism primarily a thesis about the metaphysical nature of experience, or about the epistemic standing of the perceiver? If the metaphysical version is confined strictly to successful perception, what does the epistemic version lose in terms of explaining the subject's rational grounding?
  *Follow-up:* You will likely claim that epistemic access depends on the metaphysical nature of the good case. But if the bad case lacks that nature entirely, how can the subject ever be in a position to claim knowledge without being able to rule out the bad case from the inside?

  **5. Illusion and Mirror Cases**
  You analyze illusion as a case of misperceiving an actual object. How does this account handle mirror experiences, where one seems to see a room, but no object is misperceived at the location of the appearance?
  *Follow-up:* You are likely to respond that in mirror cases we veridically perceive the mirror surface and light. But doesn't the phenomenology of "seeing the room behind the glass" contradict the claim that the intentional object of the experience is merely the glass surface?

  **6. Neural Supervenience**
  Given that the proximal neural causes in the brain may be identical in veridical and hallucinatory cases, how can you maintain that the mental states are of fundamentally different kinds without denying that mental states supervene on brain states?
  *Follow-up:* You will likely deny that mental states supervene on brain states alone, insisting on environmental factors. But doesn't this commit you to a radical externalism about conscious character that makes the mind opaque to introspection?

  **7. The Persistence of the Illusion Argument**
  If the Argument from Illusion relies on a simple category mistake between object and appearance, why has it been so historically persuasive among sophisticated philosophers?
  *Follow-up:* You will likely suggest it is a natural theoretical temptation. But doesn't a robust metaphysics need to explain *why* the error is so natural, rather than just dismissing the argument as a distraction based on a confusion?

  **8. The Unity of "Experience"**
  What unifies the phenomenal character of veridical and hallucinatory experiences under the single concept of "experience" if they share no common fundamental kind?
  *Follow-up:* You will likely argue that nothing unifies them fundamentally; they are only grouped by superficial similarity. But if they share no common nature, is our general psychology of perception not fundamentally mistaken in treating them as the same data set?

  **9. Parasitic Intelligibility**
  Does your view imply that the hallucinatory case is only intelligible parasitically, in terms of the veridical case, rather than on its own terms?
  *Follow-up:* You will likely accept this, arguing the good case is primary. But if the bad case is only definable via the good, does this not make the scientific study of hallucination (which often lacks a veridical counterpart) metaphysically impossible on your view?

  **10. Explanatory Payoff**
  Finally, what specific explanatory power does disjunctivism gain by rejecting the common kind that outweighs the theoretical cost of fragmenting the mind?
  *Follow-up:* You will likely argue it saves us from skepticism and secures realism. But can't a common-kind view also secure realism by arguing that the content, rather than the relation, connects us to the world, making your fragmentation unnecessary?
