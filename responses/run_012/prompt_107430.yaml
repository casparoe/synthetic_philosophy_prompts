answer: |-
  Here is the study group resource you asked for. I've designed the question to force the distinction you care about, written a model answer that takes a definitive stance (no waffling), and built a marking scheme that punishes the "great minds think alike" hand-waving.

  ***

  ### Essay Question (90 Minutes)

  **"To what extent do cases of simultaneous discovery support the 'Strong Inevitability' of scientific progress over the 'Weak' version, and does resolving this distinction change how we assign credit in the history of science?"**

  *In your answer, you should distinguish between **Weak Inevitability** (the claim that given the state of the field, someone would have made the discovery soon) and **Strong Inevitability** (the claim that it had to be these specific individuals, at this specific moment, via this specific route). Consider the role of 'near-miss' cases (e.g., unpublished manuscripts or lost correspondence) in your evaluation.*

  ***

  ### Model Answer (Approx. 700 Words)

  The aphorism "great minds think alike" is a comforting narrative for the history of science, suggesting a teleological march toward truth. However, to treat simultaneous discoveries like Newton/Leibniz (calculus) or Darwin/Wallace (natural selection) as proof of historical law is to confuse sociological patterns with metaphysical necessity. By distinguishing between Weak and Strong Inevitability, we can see that while the former is supported by the evidence, the latter is a myth. Furthermore, accepting this distinction fundamentally alters how we assign credit: priority becomes a matter of social utility rather than epistemic superiority.

  Weak Inevitability posits that scientific discoveries are "in the air." When the requisite mathematical tools or empirical data mature, the discovery becomes probable. This view is well-supported by the standard cases. By 1660, the machinery for calculus was being forged across Europe; Newton and Leibniz were not working in vacuums but responding to shared problems regarding tangents and areas. Similarly, Darwin and Wallace both read Malthus. In this sense, the *content* of the discovery was inevitable. The conceptual space had been carved out; it was only a matter of time before a competent occupant arrived. This suggests science is a collective, cumulative enterprise where the individual is merely the vessel for the zeitgeist.

  However, Strong Inevitability claims that the specific convergence of *these* people, at *this* time, via *this* method, was unavoidable. This claim collapses under the weight of counterfactuals and near-misses. Strong Inevitability requires that there was no other route to the truth. Yet, history is littered with "lost" discoveries that challenge this. Henry Cavendish discovered the composition of water and Ohm's Law decades before their official "discoverers," but because he did not publish, the scientific community did not advance. If Strong Inevitability were true, Cavendish's silence should not have mattered; the truth would have forced itself out through him specifically. It did not.

  Similarly, consider the contingency of communication. If Wallace's letter to Darwin had been lost in the post, would natural selection still have emerged in 1858? Likely yes (Weak), but would it have emerged *from Darwin*? Not necessarily. Darwin might have stalled, or published a different formulation. Strong Inevitability cannot account for the fragility of human agency. It ignores that Leibniz's notation won out over Newton's not because it was "inevitable," but because it was more usable and championed by the Bernoullis. The route mattered. Therefore, while the *problem* was ripe for solving, the *solution's specific form and authorship* were contingent. We must reject Strong Inevitability.

  Does this distinction matter for credit? Absolutely. If Strong Inevitability were true, priority disputes would be meaningless; if the discovery was bound to happen through them, they are merely cogs. But if we accept Weak Inevitability alongside historical contingency, priority becomes a crucial social mechanism. Since the truth does not announce itself automatically (as Cavendish proved), we need a system to incentivize the *communication* of knowledge.

  Assigning credit to the first publisher (Newton, Darwin) rather than the private thinker (Leibniz's early notes, Cavendish's journals) is not about acknowledging who "deserved" it in a metaphysical sense. It is a normative rule to ensure science remains public. If we rewarded the "true" thinker who kept it secret, we would encourage hoarding. Therefore, the history of science should record the winner of the race, not because they were the inevitable vessel of truth, but because they completed the social contract of science by publishing.

  In conclusion, simultaneous discovery supports Weak Inevitability: the maturity of a field makes discoveries probable. It does not support Strong Inevitability: the specific agents and methods remain contingent on human action and communication. Recognizing this shifts our view of priority. It is not a recognition of unique genius, but a reward for the labor of making knowledge public. We write history based on publication, not private insight, because science is a public practice, not a destined revelation.

  ***

  ### Marking Scheme (20 Marks)

  **Assessment Objective:** Evaluate philosophical arguments regarding scientific progress, priority, and historical contingency.

  #### 5 Must-Hit Points (Pass Threshold)
  *To access marks above 10, the essay must address all five of the following:*
  1.  **Definitions:** Clearly defines Weak Inevitability (field maturity) vs. Strong Inevitability (specific agents/routes).
  2.  **Application:** Applies these concepts to at least one standard case (Newton/Leibniz OR Darwin/Wallace).
  3.  **Counterfactuals:** Uses a "near-miss" case (e.g., Cavendish, lost letters, unpublished work) to test the inevitability claims.
  4.  **Normative Claim:** Addresses the second half of the question: does this distinction change how we assign credit/history?
  5.  **Stance:** Takes a clear position (e.g., "Weak is true, Strong is false") rather than sitting on the fence.

  #### Level Descriptors

  **Level 3 (16–20 Marks): Distinctive & Critical**
  *   **Argument:** Explicitly uses the Weak/Strong distinction to *dismantle* the "great minds" narrative.
  *   **Analysis:** Uses near-miss cases not just as examples, but as *tests* that Strong Inevitability fails.
  *   **Implication:** Clearly articulates *why* priority matters (e.g., incentivizing publication vs. rewarding genius).
  *   **Style:** Coherent, persuasive, and picks a definitive side.

  **Level 2 (11–15 Marks): Competent & Descriptive**
  *   **Argument:** Defines Weak and Strong correctly but treats them as equally plausible.
  *   **Analysis:** Describes the Newton/Leibniz or Darwin/Wallace cases accurately but lacks philosophical evaluation of *why* they fit one category over the other.
  *   **Implication:** Mentions that credit matters but doesn't explain the link between contingency and the rules of credit.
  *   **Style:** Balanced but lacks a strong thesis.

  **Level 1 (0–10 Marks): Basic & Vague**
  *   **Argument:** Fails to distinguish between Weak and Strong (treats "inevitability" as one block).
  *   **Analysis:** Retells the history of the discoveries without philosophical analysis.
  *   **Implication:** Ignores the question about credit/history or answers it with clichés ("it's fair").
  *   **Style:** Disorganized or fails to complete the argument.

  #### Common Pitfalls (Deduct Marks)
  *   **The "Progress Trap" (-3 Marks):** Asserting that "multiple discovery proves progress is inevitable" without distinguishing between the *problem* being ripe and the *solution* being fixed. (This is the specific error the question is designed to catch).
  *   **The "Genius Fallacy" (-2 Marks):** Arguing that Newton/Darwin won solely because they were smarter, ignoring the sociological/structural factors.
  *   **Fence-Sitting (-2 Marks):** Concluding that "both views have merit" without explaining *where* the boundary lies. A top essay must argue that Strong Inevitability is unsustainable.

  #### Examiner's Note on Differentiation
  *   **The B Grade Move:** Defines the terms, says Newton and Leibniz both did calculus, says Weak Inevitability is probably right.
  *   **The A Grade Move:** Argues that *accepting* Weak Inevitability makes the *rules of credit* more important, not less. They realize that if discovery isn't magically destined, the human act of publishing is the only thing that makes it "science." They use Cavendish to prove that truth without publication is historically inert.
