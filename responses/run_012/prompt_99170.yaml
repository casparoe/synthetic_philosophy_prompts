answer: |-
  You have put your finger on one of the most persistent, open secrets in risk governance. You are not imagining the tension; it is real, but it is not necessarily a contradiction. It is a feature of a system that is trying to do two incompatible things at once: optimize resource allocation (economics) and prevent societal collapse (politics/ethics).

  Here is a reconstruction of the implicit theory, an analysis of the tension, and a breakdown of the counterfactuals you requested.

  ### 1. The Implicit Theory: "Bounded Consequentialism with Catastrophe Aversion"

  To understand the regulatory package, we have to separate what the regulators *say* they are doing from what the machinery actually *does*.

  **The Nuclear Side (PRA + Defense in Depth)**
  *   **The Surface Logic:** This looks like **Expected Value (EV)** reasoning. You calculate the probability of core damage ($P$) multiplied by the consequence ($C$). If $P \times C$ is too high, you mitigate.
  *   **The Hidden Logic:** This is actually **Epistemic Humility**. The Probabilistic Risk Assessment (PRA) numbers are known by the regulators to be fragile. They rely on assumptions about component failure rates, human error, and common-cause failures that are often based on limited data.
  *   **The Role of Defense in Depth (DiD):** DiD is not there to reduce the *calculated* probability; it is there to protect against the *error in the calculation*. It presupposes that the PRA model is incomplete. If you rely solely on the PRA, you are trusting a map that you know has blank spots. DiD builds physical barriers (cladding, vessel, containment) that function even if the probabilistic model is wrong.
  *   **Presupposition:** This side presupposes that **model uncertainty is non-negligible.** It treats tiny probabilities as significant *not* because the math says so, but because the math is untrustworthy at the tails.

  **The De Minimis Side (EPA, OSHA, etc.)**
  *   **The Surface Logic:** This looks like a **Threshold View**. Risks below $10^{-6}$ (one in a million lifetime risk) are "acceptable" or "de minimis" and do not warrant regulatory action.
  *   **The Hidden Logic:** This is **Administrative Truncation**. It presupposes finite regulatory resources and the law of diminishing returns. At a certain point, the cost of verifying and enforcing a risk reduction exceeds the social benefit, or the risk becomes indistinguishable from background noise.
  *   **Presupposition:** This side presupposes that **regulatory capacity is finite** and that **background risk is inevitable.**

  **Are They Incompatible?**
  Strictly speaking, yes. One says "no probability is too small to ignore if the consequence is big enough" (Nuclear), and the other says "probabilities this small don't count" (De Minimis).

  However, they are **pragmatically consistent** under a theory of **Triaged Precaution**. The implicit theory distinguishing them is not the size of the probability, but the **structure of the harm**:
  1.  **Concentrated vs. Distributed:** A nuclear accident is a single-point catastrophic failure with potential geopolitical consequences. A water contaminant risk is distributed across millions of individuals as isolated cancer cases.
  2.  **Reversibility:** You can treat an individual cancer case (statistically); you cannot "treat" a contaminated exclusion zone that lasts 20,000 years.

  **Verdict on Presupposition vs. Fit:**
  *   **Presupposed:** Both sides presuppose that **pure Expected Value is insufficient.** Nuclear regulators don't trust the EV calculation (hence DiD); Environmental regulators don't trust the EV optimization to yield feasible policy (hence De Minimis).
  *   **Fits Well:** The package fits a **Lexical Priority View**. Safety goals take lexical priority over cost-benefit analysis up to a point, but resource constraints impose a hard floor (de minimis) on low-consequence risks.

  ### 2. The Counterfactual: Pure Expected Value Everywhere

  Suppose we throw out the thresholds and DiD. We regulate solely on $Risk \times Value of Statistical Life (VSL)$, discounted to present value.

  **Would we spend wildly more on unlikely disasters?**
  Counter-intuitively, **no.** In many cases, we would spend *less* on nuclear and *more* on mundane risks.

  *   **The Nuclear Case:** If you run a strict EV calculation on nuclear power using standard VSL ($\approx\$10$ million) and realistic accident probabilities ($\approx 10^{-5}$ to $10^{-6}$ per year), the "expected cost" of accidents is often lower than the cost of the additional safety margins currently mandated by DiD. A pure EV regulator might actually allow plants to operate with *fewer* redundancies, provided the PRA numbers held up. The reason we don't do this is that the *variance* on those PRA numbers is huge.
  *   **The Water/Chemical Case:** A pure EV approach would likely shift spending away from trace contaminants (where the risk is $10^{-7}$ and mitigation is expensive) toward high-probability risks like radon in homes, traffic safety, or hospital-acquired infections.
  *   **The "Absurdity" Problem:** Pure EV breaks down only when the Consequence ($C$) approaches infinity (e.g., human extinction). If $C = \infty$, then any non-zero $P$ demands infinite spending. Regulators avoid this by using thresholds to cap the liability of the state.

  **The Result:** A pure EV regime would look less like "panic about rare disasters" and more like "boring optimization of public health." It would look more utilitarian, but it would be politically untenable because it ignores the **Dread Factor**. People care more about a plane crash than a car crash, even if the car crash EV is higher. Regulation manages fear as much as it manages risk.

  ### 3. The Hard Question: Can Expected Value Justify Defense in Depth?

  This is the crux of your nerd-sniping. Is Defense in Depth (DiD) compatible with consequentialism/EV, or is it a deontological constraint?

  **The Case for EV Justification (The "Second-Order" Argument)**
  You *can* justify DiD within an EV framework, but only if you introduce **second-order uncertainty**.
  *   Standard EV: $Expected Loss = P(Failure) \times Cost$.
  *   Robust EV: $Expected Loss = \int [P(Failure | Model M) \times Prob(M is true)] \times Cost$.

  If you acknowledge that your model of the world ($M$) might be wrong (e.g., you didn't account for a specific type of earthquake, or a specific cyber-attack vector), then adding independent physical layers reduces the sensitivity of the outcome to model error. In this view, DiD is an **insurance policy against model uncertainty.** It is a hedge against the fact that we are calculating probabilities in a non-ergodic system (where past data doesn't guarantee future distributions).

  **The Case Against EV Justification (The "Qualitative" Argument)**
  However, there is a strong argument that DiD is **not** EV reasoning.
  *   **Incommensurability:** DiD often requires barriers to be *physically independent* and *diverse* (e.g., an analog backup for a digital system). An EV calculation might say, "Two digital systems are cheaper and statistically just as reliable." DiD says "No." This suggests a rule-based (deontological) constraint: *Thou shalt not rely on a single mode of failure,* regardless of the calculated probability.
  *   **The "Unknown Unknown":** EV requires you to assign a probability to the failure. DiD is designed specifically for failures you cannot assign a probability to (Black Swans). You cannot multiply "Unknown" by "Cost." Therefore, DiD operates in a domain where EV is mathematically undefined.

  **Conclusion on DiD:**
  Defense in Depth is **philosophically hybrid.**
  *   It *uses* the language of probability (PRA) to satisfy the economists and the EV framework.
  *   It *uses* the structure of DiD to satisfy the precautionary principle and the recognition that EV fails at the tails.

  It presupposes that **safety is a property of the system's structure, not just its statistics.** A system can have a low probability of failure but still be "unsafe" if it lacks resilience (the ability to absorb surprise). EV measures likelihood; DiD measures resilience. They are different dimensions.

  ### Summary of the Reconstruction

  1.  **The Tension:** You are correct that there is a tension between "drive risk to zero" (Nuclear) and "ignore risk below threshold" (De Minimis).
  2.  **The Resolution:** The tension is resolved by distinguishing **Catastrophic/Systemic Risk** (Nuclear) from **Chronic/Distributed Risk** (Water/Chemicals). The implicit theory is that society has a much lower tolerance for low-probability, high-consequence *systemic* shocks than for high-probability, low-consequence *individual* harms.
  3.  **The EV Counterfactual:** Pure EV would likely reduce spending on nuclear safety (too expensive for the statistical return) and increase spending on mundane public health. It would be more efficient but less stable politically.
  4.  **Defense in Depth:** This cannot be fully justified by standard Expected Value reasoning because it guards against *model failure*, not just *component failure*. It presupposes that the map is not the territory. It is a non-consequentialist hedge inserted into a consequentialist framework to prevent the math from licensing a catastrophe that the math failed to predict.

  **The Vocabulary You Were Looking For:**
  The practice is underwritten by **Decision Theory under Deep Uncertainty** (or Knightian Uncertainty).
  *   **De Minimis** handles **Aleatory Uncertainty** (inherent randomness) by truncating the tail.
  *   **Defense in Depth** handles **Epistemic Uncertainty** (lack of knowledge) by hardening the system.

  The regulators aren't being inconsistent; they are using two different tools for two different types of ignorance. They just don't always admit that distinction in the public filings.
