          *   But DiD is often a heuristic for "I don't trust my model." That's meta-rational, not strictly consequentialist.
      *   *Conclusion:* The system is a hybrid. It uses EV language to justify thresholds, but uses thresholds to cap EV demands. It's pragmatically consistent but philosophically messy.

  8.  **Refining the Philosophy:**

