      *   *Restatement:* The student argues that Hofstadter's superrationality hides an ambiguity between self-interest and group-interest masked by symmetry. When symmetry breaks, the "logical correlation" argument either collapses (because different inputs break the correlation) or becomes altruistic (class reading). Therefore, superrationality isn't a standalone theory of individual rationality but relies on empirical correlations (EDT-style) or implicit altruism.
