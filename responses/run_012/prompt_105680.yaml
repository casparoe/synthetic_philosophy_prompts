      *   **Constraint:** The user mentioned a running argument with a flatmate about a tip-sized apology ended up in the draft. (Note: This is context, not necessarily something I need to edit out, but I should acknowledge the personal stake if relevant to the critique).

  2.  **Deconstruct the Argument:**
      *   *Distinction:* Route (space/time sharing, transparent function) vs. Tribute (value transfer, expressive, arbitrary).
      *   *Test:* 1. Rationale in play, 2. Legible, 3. Relied upon.
      *   *Application:* Route passes all three (obligation exists). Tribute fails 1 & 2 for visitors (no obligation).
      *   *Case Study:* Jaywalking (sticky norm without law, variable force based on context).

  3.  **Drafting the Critique - Section by Section:**

      *   **1. Accuracy and Originality (Route/Tribute vs. Coordination/Expression):**
          *   *Observation:* It *does* look very much like David Lewis's coordination conventions vs. expressive norms.
          *   *Critique:* If it's just a rename, does it add value? "Route" implies spatial/temporal navigation, "Tribute" implies social debt. This adds nuance. Lewis focuses on equilibrium; the user focuses on *opacity* and *arbitrariness* of value.
          *   *Verdict:* It's a refinement, not a revolution. The argument survives if the *consequences* of the distinction (the differential obligation for visitors) are novel. The "opacity" point is key here. Coordination conventions are usually arbitrary (which side of the road), but the user claims Route conventions are "transparent." This is a tension. Driving on the left is arbitrary but "Route." Tipping is arbitrary and "Tribute." The distinction might be better framed as *Functional* vs. *Symbolic*.
          *   *Advice:* Don't hide the Lewis connection. Engage with it. The "transparency" claim needs defending (is queueing really transparent to someone from a non-queuing culture?).

