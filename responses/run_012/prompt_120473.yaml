answer: |-
  **The Principle of Epistemic Grounding and Bounded Utility**

  **Principle:** Maximize expected utility only when (1) probability estimates are grounded in evidence or reliable reference classes, and (2) payoffs are bounded by physical and social realizability.

  Your intuitions are not arbitrary; they track two distinct failure modes of naive expected value arithmetic. Naive math treats all probabilities as equal inputs and all utility as linear. Your gut correctly demands credibility and realism.

  **1. Epistemic Grounding (The Probability Constraint)**
  You reject the **Guy on the Street** and **Pascal's Wager** because the probabilities are ungrounded. A **Coin Flip** has physics; a **Lottery** has audited odds; **Career Advice** relies on a reference class of employees successfully negotiating raises. These have mechanisms you can inspect. The street guy and specific god hypotheses lack any evidence assigning non-negligible probability to their claims. Mere logical possibility ($\epsilon > 0$) is insufficient for decision-making. This distinguishes **Career Advice** (grounded in workplace norms) from the **Guy on the Street** (grounded in nothing), despite their similar "small cost, big upside" shape.

  **2. Bounded Utility (The Payoff Constraint)**
  You reject the **200 Heads** case because $10^{100}$ dollars is physically unrealizable. There isn't enough matter in the universe to pay you. Utility functions should saturate; extra zeros stop mattering once physical constraints are met. This also explains **Insurance**: you pay to cap downside loss because losing everything hurts disproportionately more than gaining extra helps (diminishing marginal utility). You accept negative expected value insurance because your utility curve is concave, not linear.

  **Predictions**
  1.  **Pascal's Mugging:** A stranger says, "Give me $5 or I'll use magic to destroy $3 \uparrow\uparrow\uparrow 3$ lives." **Reject.** The probability is ungrounded (magic), and the payoff exceeds physical bounds.
  2.  **Startup Equity:** Joining a risky startup for low pay + high equity. **Accept** *if* due diligence confirms the business model (grounded probability) and the exit valuation is within market norms (bounded utility). **Reject** if the pitch relies on "we could be the next Google" without traction (ungrounded).

  **Verdicts I Can't Save**
  I cannot save your **Lottery** verdict if justified purely by financial EV. The expected value is negative. You admit buying it "for fun," which means you're maximizing *entertainment utility*, not monetary EV. If you claimed it was a good *financial* investment, this principle calls you irrational. Also, strict Expected Utility Theorists argue you *should* take the **200 Heads** bet if the offer is credible, claiming your intuition is risk-aversion error.

  **Settled vs. Live**
  *   **Settled:** Naive Expected Value maximization is insufficient for real-world decisions. Bounded utility (diminishing returns) is standard economics. Pascal's Wager is generally considered failed philosophy due to the "Many Gods" objection.
  *   **Live Fight:** How to handle "tiny but non-zero" probabilities. Some decision theorists (longtermists) argue we *must* care about tiny probabilities of huge outcomes (e.g., existential risk mitigation), rejecting probability discounting. Others argue for "lexical thresholds" (ignore probs below $10^{-X}$). There is no consensus on where the cutoff lies or if "Epistemic Grounding" is a formal rule or a heuristic. This is a central problem in AI alignment (the "Pascal's Mugging" problem).

  Your gut is tracking **credibility** and **realizability**, not just arithmetic. The arithmetic breaks when inputs are fictional.
