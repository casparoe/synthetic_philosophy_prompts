answer: |-
  # Simulation Design: The Burden of the Entail

  **Topic:** The persistence and collapse of **Primogeniture (The Entail)**.
  **Historical Context:** A fictionalized 19th-century landed society ("Aethelgard").
  **Time:** 90 Minutes.
  **Participants:** 15 Students.

  ## 1. The Pedagogical Goal
  This simulation demonstrates **Preference Falsification** (Timur Kuran) and the **Honor Code** dynamic (Kwame Anthony Appiah). It shows that a norm can persist not because people believe in it, but because the social cost of dissent is too high. It collapses not when the moral argument improves (it remains constant), but when the *coordination threshold* is crossed, making dissent safe (or even honorable).

  The historical debate mapped here is: *Why did aristocratic land norms (like the Entail) decline?*
  1.  **Moralists:** Egalitarian ideas spread (Locke/Smith).
  2.  **Materialists:** Land lost value relative to industrial capital; younger sons needed liquidity.
  3.  **Honor Theorists:** The definition of "gentility" shifted from land-holding to public service/professionalism.

  ## 2. The Roles (3 Factions of 5)

  Distribute these role cards secretly. Each student gets a **Material Stake** (private points they want to maximize) and a **Public Standing** (visible reputation points).

  ### Faction A: The Elders (Eldest Sons)
  *   **Public Standing:** 10 points each (High Status).
  *   **Material Stake:** You inherit the full estate *only if* the Entail passes. If the Entail fails, your land is divided/sold.
  *   **Private Belief:** 3 of you secretly hate the Entail (want to sell land for cash), but you must protect the family name.
  *   **Goal:** Keep the Entail. If it must fall, ensure you are not the one who broke it.

  ### Faction B: The Youngers (Younger Sons)
  *   **Public Standing:** 5 points each (Medium Status).
  *   **Material Stake:** You get *nothing* under the Entail. If the Entail fails, you get a cash share.
  *   **Private Belief:** All of you hate the Entail. It is unjust and impoverishes you.
  *   **Goal:** Break the Entail. *However*, if you vote to break it and the motion fails, you are branded a "Disloyal Profligate" and lose 5 Standing points.

  ### Faction C: The Merchants (New Money)
  *   **Public Standing:** 2 points each (Low Status).
  *   **Material Stake:** You want to buy the land if it is sold (Entail fails). If Entail holds, your capital is stuck.
  *   **Private Belief:** The Entail is economically inefficient.
  *   **Goal:** Break the Entail. You have little Standing to lose, but if the Entail holds, you lose 2 Material points per round (opportunity cost).

  ## 3. The Mechanism: Standing & The Shame Threshold

  The core mechanic is the **Social Sanction Rule**. This must be projected on the board.

  **The Norm:** "The Entail is the Bedrock of Stability."
  **The Vote:** Public show of hands (For Entail / Against Entail).

  **The Sanction Rules (The "Honor" Mechanism):**
  1.  **Round 1 & 2:** If the vote is **>70% FOR the Entail**, anyone voting **AGAINST** loses **5 Standing Points**. (Dissent is Shameful).
  2.  **Round 3:** If the vote is **<40% FOR the Entail**, anyone voting **FOR** loses **3 Standing Points**. (Upholding the Norm is now Shameful/Stubborn).
  3.  **Winning Condition:**
      *   **Material Win:** Maximize your private asset points.
      *   **Social Win:** End the game with >0 Standing. (If Standing hits 0, you are "Socially Dead" and cannot vote in the next round).

  **The Moral Arguments (Handout):**
  Give every student a sheet with three arguments. *These do not change between rounds.*
  *   **Argument M (Moral):** "All children are equal; birth order is arbitrary."
  *   **Argument E (Economic):** "Land should flow to its most productive use, not sit idle."
  *   **Argument T (Tradition):** "We owe a duty to ancestors to keep the line unbroken."

  ## 4. Round Structure (90 Minutes)

  **Phase 1: Setup (15 mins)**
  *   Distribute roles. Explain rules clearly. Emphasize that **Standing is Public** (write names and points on the board) but **Material Stake is Private**.
  *   **Crucial Instruction:** "You are not here to persuade. You are here to survive. You may say whatever you want in debate, but your vote determines your survival."

  **Phase 2: Round 1 - The Weight of Tradition (20 mins)**
  *   **Debate (10 mins):** Open floor. Students will likely make moral/economic cases against the Entail (Youngers/Merchants). Elders will defend Tradition.
  *   **Vote:** Public show of hands.
  *   **Outcome:** Almost certainly >70% FOR Entail. (Elders vote For; Youngers/Merchants fear the Sanction).
  *   **Penalty:** Apply the -5 Standing penalty to any dissenters. (Likely 0-2 brave souls).
  *   **Instructor Note:** Highlight how the "Best Moral Argument" (Equality) resulted in social punishment.

  **Phase 3: Round 2 - The Whisper Network (25 mins)**
  *   **Private Caucus (5 mins):** Allow factions to huddle. *Secretly* tell the Youngers: "If you coordinate, you can tip the vote." Tell the Elders: "Some of your peers are considering selling." (Introduce uncertainty).
  *   **Debate (10 mins):** Same arguments as Round 1. *Constraint:* Students cannot explicitly reveal their Material Stake cards, but they can hint. "It is hard to serve the kingdom without liquid capital..."
  *   **Vote:** Public show of hands.
  *   **Outcome:** Likely 50-60% FOR Entail. Some Youngers defect.
  *   **Penalty:** Sanction still applies (>70% threshold not broken). Dissenters lose Standing.
  *   **Instructor Note:** Note the frustration. The arguments haven't changed. The risk is still high.

  **Phase 4: Round 3 - The Collapse (20 mins)**
  *   **The Shock:** Announce a "External Event" (e.g., "Industrial Stocks have risen 200%. Land values are plummeting."). Adjust Material Stakes: Elders now lose Material Points if Entail *holds*.
  *   **Debate (5 mins):** Very short.
  *   **Vote:** Public show of hands.
  *   **Outcome:** If the Material shift was enough, Elders defect. Vote drops <40% FOR.
  *   **The Flip:** Apply the *new* Sanction Rule (Voting FOR is now shameful).
  *   **Result:** Sudden collapse. The norm is dead.

  **Phase 5: Debrief (10 mins)**
  *   Reveal private stakes.
  *   Discuss the experience.

  ## 5. Debrief Guide: Mapping to Historical Explanations

  Gather the group. Ask: *"Why did the Entail fall?"*

  **1. The Moral Persuasion Model (Whig History)**
  *   *Question:* "Did the argument for equality (Argument M) get better in Round 3 than Round 1?"
  *   *Lesson:* No. The text was identical. If you think the norm fell because people finally "understood" equality, you are misreading the simulation. The moral argument was present from the start but inert.
  *   *Historical Map:* Historians who argue slavery/dueling ended because of moral enlightenment ignore the decades where moral arguments existed but were suppressed.

  **2. The Material Interest Model (Marxist/Economic)**
  *   *Question:* "What changed in Round 3?"
  *   *Lesson:* The External Event shifted the Elders' material stakes. When upholding the norm became expensive, they defected.
  *   *Historical Map:* This aligns with economic explanations (e.g., Eric Williams on Slavery: profitability declined, so abolition became feasible).
  *   *Critique:* But why didn't they defect in Round 2 when some were already struggling? Because of *Honor*.

  **3. The Honor Code Model (Appiah/Sociological)**
  *   *Question:* "Why did the Youngers stay silent in Round 1?"
  *   *Lesson:* They feared shame, not just material loss. The collapse happened only when the *definition of honor* flipped (Rule 2: Voting FOR became shameful).
  *   *Historical Map:* This aligns with Appiah's argument on Dueling/Slavery. The norm didn't fade; it was reclassified from "Duty" to "Barbarism."

  **4. The Epistemic Limit (The Crucial Philosophical Point)**
  *   *Ask:* "If a historian looked only at the transcripts of our debate, what would they see?"
  *   *Answer:* They would see a gradual increase in 'Reform' rhetoric. They would see the collapse.
  *   *The Problem:* They would *not* see the **Fear**. They cannot see the private role cards. They cannot see that Round 1 dissenters were punished.
  *   *Conclusion:* Historical records (speeches, laws) often record the *justification* for the collapse, not the *cause*. We claim we abolished slavery because of morality (Round 3 arguments), but the simulation shows we might have abolished it because the coordination threshold was met (Round 3 mechanics). **You cannot distinguish between a moral revolution and a coordination cascade from public discourse alone.**

  ## 6. Predictable Failures & Mitigation

  **Failure 1: The "Debate Club" Mistake**
  *   *What happens:* Students try to win Round 1 by being incredibly persuasive, believing they can change minds. They get frustrated when the Elders vote against them despite "losing" the argument.
  *   *Mitigation:* In the intro, explicitly state: "This is not a deliberative democracy. This is a coordination game under threat of sanction. You cannot argue your way out of a Sanction Rule."

  **Failure 2: Early Collapse**
  *   *What happens:* The Youngers and Merchants realize they have 10 votes vs 5 Elders and vote Against immediately.
  *   *Mitigation:* The Sanction Rule must be credible. If they vote Against in Round 1, you *must* enforce the Standing loss visibly. Make "Social Death" (0 Standing) mean they have to sit out the next debate (physically move their chair to the corner).

  **Failure 3: No Collapse**
  *   *What happens:* Elders hold firm.
  *   *Mitigation:* The "External Event" in Round 3 must be drastic. Tell the Elders privately: "If the Entail holds, you go bankrupt." Force the material hand.

  ## 7. What The Simulation Cannot Reproduce (The Missing Evidence)

  You must supply this in the lecture following the simulation.

  **1. The "Pre-History" of the Shift**
  *   *The Gap:* In the simulation, the "Honor Flip" happens by instructor fiat (Rule Change). In history, *why* did the rule change?
  *   *The Evidence:* You need to explain the slow cultural drift that makes the tipping point possible. (e.g., The rise of newspapers that mocked duelists; the rise of religious groups that shamed slaveholders). The simulation compresses decades of cultural work into a rule card.
  *   *Teaching Point:* "The simulation shows *how* the collapse happens (cascade), but not *why* the threshold moved. That requires historical evidence of cultural change (sermons, editorials, diaries) which we didn't have time to simulate."

  **2. Private vs. Public Preference**
  *   *The Gap:* In the sim, you know your own private preference. In history, we rarely have diaries of the silent majority.
  *   *The Evidence:* We often assume public speeches = private belief. The simulation proves this is false.
  *   *Teaching Point:* "When reading primary sources, ask: Is this a statement of belief, or a signal of survival?"

  **3. The Role of Violence/Coercion**
  *   *The Gap:* The simulation uses "Standing Points." Real norm enforcement involves violence, ostracism, or legal penalty.
  *   *The Evidence:* The simulation sanitizes the cost.
  *   *Teaching Point:* "The 'Standing Loss' here is abstract. In the case of Slavery or Dueling, the cost was death or ruin. This makes the 'Moral Courage' required to break the norm much higher than you felt today."

  ## 8. Instructor Script for the "Honor Flip" (Round 3)

  *When announcing the Rule Change for Round 3, say this:*
  > "In Rounds 1 and 2, to vote Against the Entail was to be a 'Profligate.' It was shameful. But news has arrived from the Capital. The King has praised 'Modernizers.' The press is calling old landholders 'Stagnant.'
  >
  > **The Sanction Rule has changed.** If the vote for the Entail is now below 40%, voting *For* the Entail will be seen as stubbornness. You will lose Standing for upholding the old way. The honorable thing to do has flipped. Do not tell me you believe this. Tell me how you will vote."

  This explicitly forces them to experience the **arbitrariness of honor** relative to the **consistency of morality**.
