answer: |-
  # Q&A Preparation Sheet: Separateness of Persons & Moral Authority

  **To:** Postdoctoral Fellow
  **From:** Strategic Planning
  **Re:** Ethics Reading Group Defense
  **Context:** 60-minute discussion following work-in-progress presentation.

  ### Strategic Overview

  Your core thesis is bold: you are attempting to dissolve a canonical objection by reclassifying it as a question-begging commitment. The room knows this. They will not attack your exegesis of Rawls/Nozick primarily; they will attack the *stability of your distinction* (Distinctness vs. Authority) and the *implications of dissolving the objection*.

  **Concessions to Make at the Outset:**
  1.  **To the Legal Philosopher:** Concede that Nozick *explicitly* uses Lockean language (self-ownership). Do not fight the textual genealogy. Fight the *structural* genealogy. Argue that Lockean self-ownership *presupposes* the Kantian authority premise to do normative work.
  2.  **To the Rawlsians:** Concede that the "strains of commitment" are real practical constraints. Do not deny that aggregation is politically destabilizing. Insist only that destabilization is not *unjustness*.

  **The Single Most Dangerous Objection:**
  The **Parfitian**. If the reductionist thesis holds, the "Distinctness Reading" becomes metaphysically shallow, and the "Authority Reading" loses its anchor. If persons are not deeply separate, the utilitarian wins the metaphysics, but your claim that the Authority Reading is a *distinct commitment* collapses into a confusion about metaphysics.

  **The Crucial Reply for Publication:**
  You must successfully defend the claim that **moral authority is not a derivative of metaphysical distinctness.** If you cannot sever the link between "how persons are" (metaphysics) and "how persons must be treated" (authority), the Rawlsian/Nozickian can claim their objection *is* grounded in the nature of persons, not just a Kantian commitment.

  **The Question You Hope Nobody Asks:**
  *"If the separateness objection is merely a sectarian commitment, does your view imply that a society adopting utilitarianism is not making a moral error, but merely a different moral choice? Are rights fictions?"*

  ---

  ### Anticipated Objections & Replies

  #### 1. The Parfitian (Metaphysics of Persons)
  **Likelihood:** Medium | **Damage:** Catastrophic
  **The Objection:**
  "You draw a distinction between the distinctness of persons and the authority of their claims. But on the reductionist view, the distinctness of persons is *already* less deep than we suppose. If the boundaries between persons are like boundaries between temporal stages of a single person, then the 'Distinctness Reading' is metaphysically thin. If it's thin, the 'Authority Reading' cannot rest on it. Are you not relying on a non-reductionist intuition about personal identity to make the authority claim seem plausible, only to discard that intuition when pressed on the metaphysics?"

  **The 2-Minute Reply:**
  "I grant that reductionism weakens the metaphysical depth of distinctness. However, my argument does not require deep distinctness; it requires only that we *treat* boundaries as morally significant sites of authority. The Parfitian reductionist usually argues that because boundaries are less deep, we should move *toward* utilitarianism. I am arguing that even if boundaries are shallow, the *decision* to treat them as inviolable is a normative commitment, not a metaphysical discovery. The Authority Reading is a claim about the *status* we assign to these boundaries, regardless of their ontological depth. The utilitarian assigns them zero weight; the Kantian assigns them absolute weight. My point is that this assignment is the pivot, not the ontology."

  **Honest Note on Weakness:**
  This is thin if they press on *why* we assign authority to shallow boundaries. If the boundary is arbitrary (as reductionism suggests), the authority looks arbitrary.
  **Killer Follow-up:** "If the boundary is arbitrary, why is the authority not also arbitrary? And if it's arbitrary, why can't the utilitarian override it?"

  #### 2. The Constructivist Kantian (Metaethics of Weight)
  **Likelihood:** Medium | **Damage:** High
  **The Objection:**
  "You characterize the Authority Reading as a 'substantive commitment' inherited from Kant, as if it were a premise one could choose. But for the constructivist, the authority of the person is a *deliverance of practical reason*, not a contingent commitment. To say it 'begs the question' against the utilitarian assumes a realist picture where 'moral weight' is a datum available to both sides. I reject that picture. The utilitarian fails to construct the moral point of view correctly; it's not that they reject a premise, it's that they fail to reason."

  **The 2-Minute Reply:**
  "I am not assuming realism about moral weight. I am making a structural claim about the *argumentative dialectic*. Whether the authority of persons is a deliverance of reason or a realist datum, it functions in the separateness objection as a *premise* that the utilitarian does not share. If the constructivist says 'practical reason requires inviolability,' the utilitarian replies 'practical reason requires maximizing the good.' My claim is that the separateness objection hides this clash of first principles by presenting the inviolability as a neutral observation about persons. Even on constructivism, you are constructing a different morality than the utilitarian. The objection begs the question by presenting the *result* of your construction as a *constraint* on theirs."

  **Honest Note on Weakness:**
  Constructivists believe their construction is *the* valid one, not just *a* valid one. You risk sounding relativist.
  **Killer Follow-up:** "Are you suggesting the Kantian construction is merely 'different' but not 'correct'? If so, you've abandoned normativity."

  #### 3. The Legal Philosopher (Genealogy)
  **Likelihood:** High | **Damage:** High
  **The Objection:**
  "You locate the genealogy of the Authority Reading in Kant. But Nozick is explicitly Lockean. The objection isn't about moral authority or ends-in-themselves; it's about self-ownership and property rights in one's person. The 'sliding' you identify isn't between Kantian authority and distinctness, but between Lockean entitlements and utilitarian outcomes. By Kantianizing Nozick, you miss the target. The objection is that I *own* my pain, not that I am an end."

  **The 2-Minute Reply:**
  "I concede Nozick uses Lockean vocabulary. But 'self-ownership' is doing normative work that only makes sense if we already accept the Authority Reading. Why does ownership preclude aggregation? Only because the owner has a veto authority that trumps the social good. That veto authority is Kantian in structure (inviolability), even if the metaphor is Lockean (property). Locke grounds the right in God or nature; the modern secular objection grounds it in the status of the agent. My claim is that regardless of the metaphor, the *logical force* of the objection relies on the premise that persons carry a weight that cannot be aggregated. That premise is the Kantian inheritance, whether wrapped in Lockean language or not."

  **Honest Note on Weakness:**
  Nozick really does lean on Locke. If they have a strong textual quote, you look like you're rewriting history.
  **Killer Follow-up:** "Can you show me where Nozick relies on Kant rather than Locke for the *entitlement* theory?"

  #### 4. The Rawlsians (Political Liberalism)
  **Likelihood:** Very High | **Damage:** Medium
  **The Objection:**
  "You treat the separateness objection as a foundational ethical claim. But in *Political Liberalism*, the objection is about the *strains of commitment*. Citizens in the Original Position cannot agree to principles that might require them to sacrifice their basic liberties for the aggregate good, because they cannot guarantee they can live with that outcome. It's not a metaphysical claim about authority; it's a pragmatic claim about stability and consent in a pluralistic society."

  **The 2-Minute Reply:**
  "This is the most common retreat, and it concedes my point. If the objection is about *stability* or *strains of commitment*, then it is not a claim that utilitarianism is *unjust* or *false*, but that it is *unworkable* or *unstable*. My paper argues that the separateness objection is presented as a refutation of utilitarian *truth*, not utilitarian *feasibility*. By retreating to the strains of commitment, you are admitting that the foundational moral claim (that aggregation is wrong) cannot stand without assuming the Authority Reading. You are saying, 'Utilitarianism might be true, but we can't use it.' I am arguing they claim, 'Utilitarianism is false because of separateness.' I am exposing that latter claim as question-begging."

  **Honest Note on Weakness:**
  Rawlsians often view stability as *constitutive* of justice, not just pragmatic.
  **Killer Follow-up:** "For Rawls, isn't stability under conditions of freedom part of the *definition* of justice, not an external constraint?"

  #### 5. The Formula of Humanity Kantian (Source of Authority)
  **Likelihood:** Medium | **Damage:** Medium
  **The Objection:**
  "You say the Authority Reading is a 'commitment' we can reject. But the Formula of Humanity tells us to treat humanity as an end in itself, never merely as a means. Aggregation treats the loser as a means to the greater good. This isn't a commitment; it's a requirement of rationality. Why do you think the utilitarian is entitled to reject the demand of reason itself?"

  **The 2-Minute Reply:**
  "Because the utilitarian rejects the interpretation of 'means' and 'ends' that you are using. For the utilitarian, maximizing the good *is* respecting the value of persons, because it counts every person's happiness equally. The claim that aggregation treats someone as a 'mere means' is itself a contested interpretation of what respect requires. My argument is that when you say 'Aggregation violates the Formula of Humanity,' you are asserting your Kantian interpretation of the Formula against the Utilitarian interpretation. You cannot use the Formula to *prove* utilitarianism wrong if the utilitarian has a coherent account of how they satisfy the Formula through aggregation. The objection assumes the Kantian interpretation is the only rational one."

  **Honest Note on Weakness:**
  Kantians will say the Utilitarian interpretation is incoherent (contradictory).
  **Killer Follow-up:** "Is the Utilitarian interpretation of 'ends' logically coherent, or is it a category mistake?"

  #### 6. The Historian (Mill & Sidgwick)
  **Likelihood:** Low | **Damage:** Low
  **The Objection:**
  "You reconstruct the debate as if Mill and Sidgwick were facing the Rawlsian objection. But they weren't. Mill's proof of utility relies on the desirability of the general happiness. Sidgwick treats the distinction between individuals as fundamental but thinks reason requires impartiality. Are you anachronistically projecting a Rawlsian problem onto classical texts to make your distinction work?"

  **The 2-Minute Reply:**
  "I am not making a historical claim about Mill's intent; I am making a structural claim about the logic of the objection as it stands *today*. However, Sidgwick explicitly grapples with the tension between the good of the individual and the good of the whole. He admits he cannot prove why the individual should sacrifice for the whole without appealing to rational benevolence. My distinction clarifies Sidgwick's dilemma: he accepts the Distinctness Reading (pains are separate) but tries to bridge it with Rational Benevolence. I am arguing that the modern Rawlsian objection simply hardens Sidgwick's 'Rational Benevolence' into the 'Authority Reading' and calls it a refutation. It's not anachronistic; it's clarifying the lineage of the impasse."

  **Honest Note on Weakness:**
  Historians hate being told history doesn't matter.
  **Killer Follow-up:** "If Mill didn't face this objection, why does your solution matter for the history of the doctrine?"

  #### 7. The Sympathetic Consequentialists (Trade-offs)
  **Likelihood:** High | **Damage:** Low (but annoying)
  **The Objection:**
  "We like your conclusion, but you say the Authority Reading claims persons 'cannot be traded off.' If that's a primitive, it's unhelpful. If it's not, what is the cash value? Does it mean no sacrifice is ever permitted? If you say 'yes,' you're an absolutist. If you say 'no,' how is this different from a utilitarian threshold?"

  **The 2-Minute Reply:**
  "I am not defending the Authority Reading; I am analyzing it. My claim is that *if* you hold this view, it functions as a constraint that is lexically prior to aggregation, not a threshold. The 'cash value' is deontological constraints. My point to my consequentialist friends is: do not fight the separateness objection by trying to accommodate it within utilitarianism (e.g., rule-utilitarianism). Fight it by exposing it as a rival first principle. We should not say 'Utilitarianism respects separateness too.' We should say 'Separateness, understood as authority, is a rival value we reject.' Be honest about the conflict."

  **Honest Note on Weakness:**
  They want a positive theory, you are giving them a meta-ethical dissolution.
  **Killer Follow-up:** "So you're giving us a dialectical weapon, not a moral theory? How does that help us legislate?"

  ---

  ### The "Hope Nobody Asks" Question

  **The Question:**
  *"If you are right, and the separateness objection is just a Kantian commitment begging the question, then there is no rational resolution between Kantianism and Utilitarianism. They are just different starting points. Does this mean you are advocating for a form of moral relativism or coherentism where 'rights' are just things Kantians say to stop Utilitarians, with no objective grounding?"*

  **What to Say If It Comes:**
  "I am not advocating relativism about the *truth* of the theories, but about the *neutral grounds* for adjudicating them. I am arguing that the separateness objection claims to be a neutral refutation (a 'knockdown argument') when it is actually a partisan commitment. Acknowledging this doesn't mean rights are fictions; it means they are foundational commitments of a specific moral framework, not empirical discoveries about persons. We can still argue for Kantianism, but we must argue for it *as* a commitment, not hide it behind a supposedly neutral observation about separateness. The objectivity comes from the coherence of the system, not from the objection itself."

  *(Note: This is the most dangerous moment. If you sound too deflationary, you lose the room. If you sound too dogmatic, you contradict your thesis. Walk the line: "Foundational commitments are objective within the system, but the choice of system is not settled by the separateness objection.")*
