answer: |-
  **Project Title:** Simulated Stakes: The Simulation Hypothesis as a Constraint on Longtermist Fanaticism

  **1. Research Question**
  Does conditioning on a non-negligible probability of the Simulation Hypothesis (SH) structurally reduce the expected value of longtermist interventions below the threshold of decision-theoretic fanaticism?

  Specifically, I aim to determine whether the causal isolation inherent in most formulations of SH introduces a "causal discount factor" that caps the magnitude of future influence available to current agents, independent of standard probability discounting. The determinate answer I am seeking is whether the SH functions merely as an additional probability term in the expected value calculation (leaving fanaticism intact) or whether it alters the *reference class* of valuable futures such that the astronomical stakes required for fanaticism are ontologically unavailable to simulated agents.

  **2. Background and The Gap**
  Longtermist arguments often rely on the claim that the expected value of the far future is astronomical due to the potential number of future beings. This leads to the "fanaticism" objection: if we accept expected value maximization, tiny probabilities of influencing this astronomical future should dominate all near-term moral considerations (a Pascal's Mugging scenario). Standard responses to fanaticism involve modifying decision theory (e.g., bounded utility functions) or applying skeptical priors to extreme claims.

  Separately, the Simulation Hypothesis suggests a significant probability that we are living in a computational simulation rather than base reality. While both literatures deal with extreme probabilities and metaphysical uncertainty, they rarely intersect. Longtermists typically treat the probability of being simulated as just another variable in the expected value equation. If we are simulated, the reasoning goes, we might still influence the simulator's future or the future of other simulations.

  The gap lies in the assumption of *causal continuity*. Standard longtermist calculations assume that our actions can causally propagate to the astronomical future of our light cone. However, if we are simulated, our causal reach is likely bounded by the computational resources and intentions of the simulator. A simulator can terminate, fork, or isolate our timeline. If the "astronomical future" exists only in base reality, and we are in a simulation, our ability to influence that specific future may be effectively zero, not just improbable. Existing literature has not rigorously modeled whether SH acts as a *cap* on potential influence rather than just a *probability weight*. This leaves open the possibility that SH offers a unique mitigation to fanaticism that standard skeptical priors do not.

  **3. Methodology and Work Plan**
  Over a semester, I will proceed in three phases to formalize and test this interaction.

  *Phase 1: Formalization of the Causal Cap (Weeks 1–4)*
  I will construct a simplified expected value model for a standard longtermist intervention. I will then introduce SH not merely as a probability $P(\text{Sim})$, but as a constraint on the utility function $U$ and the causal probability $P(\text{Impact})$. The key variable will be $C$, a causal reach coefficient where $C_{\text{base}} = 1$ and $C_{\text{sim}} < 1$. I will map out the conditions under which $C_{\text{sim}}$ approaches zero (e.g., if simulations are short-lived by design) versus when it remains high (e.g., if simulations are ancestor-simulations intended to run indefinitely).

  *Phase 2: Comparative Analysis (Weeks 5–8)*
  I will compare the output of this model against standard anti-fanaticism measures. Does the SH-induced cap reduce expected value more effectively than bounded utility or skeptical priors? I will test this against two versions of the fanaticism worry: (1) the "Pascal's Mugging" style (tiny prob, huge value) and (2) the "Astronomical Waste" style (high prob, huge value). The goal is to see if SH specifically targets the *magnitude* of the value at stake, rather than just the probability of our influence.

  *Phase 3: Objection Handling and Drafting (Weeks 9–12)*
  I will anticipate the strongest counter-argument: that influencing the simulator or the simulation ecosystem itself yields astronomical value (e.g., if the simulator runs many copies of us, influencing the sim affects many copies). I will refine the model to account for "nested value." The final output will be a workshop paper arguing for a specific condition: SH mitigates fanaticism *if and only if* the computational cost of simulating an astronomical future exceeds the simulator's capacity or interest.

  **4. Why This Approach?**
  A purely formal decision-theoretic approach would treat SH as a black-box probability, missing the metaphysical constraints on causal power that define the hypothesis. Conversely, a purely philosophical survey of longtermist beliefs would fail to capture the structural interaction between simulation constraints and expected value calculations. This project requires bridging the two: using formal modeling to test a metaphysical claim about causal reach. This is necessary because the "fanaticism" problem is fundamentally a problem of how we aggregate value across uncertain ontologies; simply adjusting priors without adjusting the ontology of the value itself is insufficient.

  **5. Success and Failure Conditions**
  *Success:* The project succeeds if I can demonstrate that SH introduces a structural limit on the *maximum possible utility* accessible to an agent, distinct from probability discounting. A successful result would show that for a wide range of plausible simulation parameters, the expected value of longtermist interventions drops below the threshold where they dominate near-term concerns, effectively "solving" or mitigating fanaticism without requiring controversial changes to decision theory.

  *Failure:* The project fails if the model shows that SH is "value-neutral." This would happen if influencing a simulation turns out to be just as valuable (in expectation) as influencing base reality—for example, if the number of simulated beings vastly outnumbers base beings, or if simulated actions causally affect the base reality's long-term trajectory (e.g., via AI output). If SH merely shifts the locus of value without capping it, the fanaticism worry remains intact, and the hunch that SH offers a unique solution is proven confused.

  **6. Scope and Limitations**
  I want to be clear about the scope here. A comprehensive defense of this claim would require solving the "measure problem" for simulations (how to count simulated minds relative to base minds) and a full defense of the Simulation Hypothesis itself. That is dissertation-level work.

  For this workshop, I am carving out a narrower slice: I am not arguing that we *are* simulated, nor that SH is definitely true. I am arguing conditionally: *If* one assigns a non-negligible credence to SH, *does* that credence function as a check on fanaticism? I will treat the probability of SH as an exogenous variable and focus entirely on the *consequences* of that probability for the expected value calculus. This keeps the project manageable while still addressing the core intersection of decision theory and metaphysics relevant to the workshop theme. If the conditional claim holds, it provides a new tool for longtermists and critics alike; if it fails, it clarifies why metaphysical skepticism alone cannot rescue decision theory from fanaticism.
