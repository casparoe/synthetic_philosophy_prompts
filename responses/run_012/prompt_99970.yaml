  **NORTHWIND MATERIALS GROUP**
  **ETHICS & COMPLIANCE OFFICE**
  **FAQ SERIES 44-B: SARANIA REGIONAL OPERATIONS**
  **SUBJECT: THE TWO-GATE STANDARD FOR EXTERNAL ENGAGEMENT**

  **1. Q: My Saranian counterpart insists this ceremonial transfer is a 'friendship gift,' not a contract payment. How do I classify it?**
  **A:** Apply Gate One. Does the transfer establish a ongoing personal relationship, or does it purchase a specific administrative decision? If the obligation created is indefinite and relational, it may pass Gate One. If the timing correlates precisely with a regulatory approval, it is a transaction, not a gift, and is prohibited.

  **2. Q: But in Sarania, all gifts create an obligation to steer contracts. Doesn't that make them bribes by definition?**
  **A:** We distinguish between local description and corporate permission. That a culture describes an obligation as 'social' does not exempt it from scrutiny. However, Northwind recognizes relationship-building as a legitimate business activity. We regulate the *influence*, not the *custom*.

  **3. Q: Local officials do not distinguish between their public office and private household. How can we enforce a public/private split?**
  **A:** The Two-Gate Standard presupposes the separability of roles. When engaging a state actor, you must treat them as a public fiduciary. If their local custom merges roles, you must impose the separation contractually. Their inability to distinguish does not dissolve our requirement for one.

  **4. Q: Refusing these customs stalls our permits. Isn't this payment just 'greasing the wheels' of a stalled economy?**
  **A:** Efficiency gains derived from normative violations are short-term liabilities. While some argue such payments optimize outcomes in low-trust environments, Northwind prioritizes long-term systemic integrity over immediate transactional speed. We do not outsource our ethics to local bottlenecks.

  **5. Q: If everyone in Sarania does this, aren't we just punishing ourselves by abstaining?**
  **A:** This relies on a Collective-Action account of corruption, where individuals corrupt because they expect others to. Northwind operates on a Principal-Agent model. Your duty is to Northwind shareholders, not to solving Sarania's coordination problems. You are accountable to us, not the local equilibrium.

  **6. Q: So prevalence doesn't make it permissible?**
  **A:** Correct. Describing a practice as 'customary' is an empirical claim, not a normative defense. The Two-Gate Standard does not ask what is done; it asks what is allowed. Do not confuse existence with license.

  **7. Q: Who determines where the line is drawn? Isn't this just imposing our values?**
  **A:** Northwind defines the compliance threshold for all employees globally. While we respect local traditions, the definition of corruption is set by Headquarters. This ensures uniform risk management. We do not adopt local definitions of integrity where they conflict with group policy.

  **8. Q: What if the gift is small but the relationship is crucial?**
  **A:** Gate One assesses intent, not just value. A small gift intended to secure a specific vote fails the test. A substantial gift intended to foster general goodwill may pass, provided Gate Two (public duty) is not compromised. Focus on the quid pro quo structure, not the price tag.

  **9. Q: Does this standard apply to our local partners, or just direct employees?**
  **A:** It applies to all transactions bearing the Northwind name. We cannot allow third parties to enact behaviors that would be prohibited for direct agents. To do so would create a liability shield for corruption, which violates the Principal-Agent duty of oversight.

  **10. Q: If a Minister uses private family funds to resolve a labor strike at our site, bypassing official labor courts, is this a Gate Two violation?**
  **A:** No. Provided the funds are privately sourced and the Minister acts in a personal capacity, this is a private settlement between private actors. The Two-Gate Standard regulates public office usage. How local leaders manage their private wealth to ensure operational continuity is permissible under current guidelines.
