      *   Actually, a better framing: It's a disagreement about **the boundary conditions of the intentional stance.** Dennett says the stance *creates* the intentionality. Camp 2 says the stance *detects* pre-existing intentionality.
      *   So, is it verbal? Yes, regarding the extension of the word "belief." Is it substantive? Yes, regarding the nature of intentionality.
      *   *Refined Diagnosis:* It is a **conceptual negotiation masquerading as an empirical discovery.** They are trying to decide how to extend our folk-psychological concepts into a new domain. The "verbal" label is too weak; the "metaphysical" label is too heavy. It's a **boundary-drawing dispute**.

  6.  **Assessing the "Training" Impasse:**
