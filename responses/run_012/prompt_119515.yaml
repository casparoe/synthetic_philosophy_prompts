      *   *Assessing Friend:* You are right that it's about realism. But it's not a hidden empirical fact. It's a choice about what counts as "real."
      *   *The Training Impasse:* Explain why this fails. One side sees training as *constitutive* of the mind, the other as *mimicry*. This is the "Chinese Room" shadow.
      *   *Path to Progress:*
