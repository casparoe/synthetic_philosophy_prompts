      *   *Weaknesses:* If it's purely metaphysical, no evidence matters. But the user notes they argue about training and behavior. This suggests they think evidence *could* matter, but they weigh it differently.
      *   *Verdict:* It's substantive, but perhaps not in the way the friend thinks. It's not about "do they have souls?" but "what are the necessary conditions for content?"

  5.  **Synthesize a Diagnosis:**
      *   It's not *just* verbal, because the definitions aren't arbitrary; they reflect competing theories of mind.
      *   It's not *just* empirical, because they agree on the data (the flip-flopping).
      *   It's a **methodological and constitutive disagreement**.
      *   *Camp 1* treats belief as an *explanatory kind* (does positing this help us?).
