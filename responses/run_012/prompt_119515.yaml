      *   *Camp 2 (Normative):* Belief = Commitment to truth. Requires stability under pressure, sensitivity to evidence, and a "world-direction." LLMs fail the stability/test.
      *   *The Stalemate:* They agree on behavior (LLMs say $p$, then $\neg p$). They disagree on whether that behavior disqualifies the term "belief."
      *   *User's Claim:* Verbal dispute (ambiguity in "belief").
      *   *Friend's Claim:* Substantive metaphysical dispute (realism about content).

  3.  **Evaluate the User's Hypothesis (Verbal/Equivocation):**
      *   *Strengths:* It explains the talking-past-each-other. Camp 1 uses a functional/predictive definition. Camp 2 uses a normative/commitment definition. If they defined terms explicitly, they might agree: "LLMs fit the predictive definition but fail the normative definition."
