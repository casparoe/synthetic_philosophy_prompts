      *   **The Problem:** A stalemate debate about whether LLMs have "beliefs."
      *   **The Two Camps:**
          1.  *Intentional Stance/Instrumentalist:* If predicting via belief/desire attribution works, that's all belief is (Dennett-esque).
          2.  *Normative/Realist:* The stance is too cheap; content must come from the system's relation to the world/truth, not just prediction. LLMs flip-flop too easily (sycophancy) to count as believing.
      *   **The Training Argument:** Both sides use training history (predicting text vs. human learning) to debunk or vindicate, but neither lands.
      *   **User's Hypothesis:** It's a verbal dispute based on two senses of "belief" (predictive vs. normative).
      *   **Friend's Hypothesis:** It's a substantive metaphysical disagreement about whether stance-dependent patterns constitute realism about content.
      *   **Task:** Diagnose the disagreement (verbal, empirical, metaphysical, or equivocal?). Assess the user's and friend's hypotheses. Recommend what counts as progress (distinction, result, question shift, or none).
      *   **Constraint:** Engage the positions *as stated*, not by surveying literature (don't just list Dennett vs. Fodor vs. Burge). Focus on the *shape* of the disagreement.

  2.  **Deconstruct the Disagreement:**
