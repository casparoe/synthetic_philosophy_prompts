answer: |-
  **Exam Question**

  A colleague proposes that the 'Paradox of Tolerance' is merely a category error resulting from conflating three distinct claims: (a) tolerance as an absolute principle; (b) tolerance as a defeasible policy grounded in goods like peace or truth; and (c) tolerance as split between a citizen's duty to persons and the state's duty to protect institutions. Assess this proposal. In your answer, determine whether the paradox is genuine, a limit case, or rhetorical cover for constitutional self-defense. You must address the demarcation problem and the asymmetry between announced and concealed intolerance.

  ***

  **Model Answer**

  The claim that the paradox dissolves upon distinguishing absolute principles from defeasible policies is largely correct, but it comes at a cost. To assess this, we must first define 'paradox' strictly. A logical paradox implies a contradiction within a system's own rules. If tolerance is an absolute principle (a), then prohibiting the intolerant is indeed self-undermining: the system violates its own rule to save itself. However, if tolerance is a defeasible policy (b) adopted to secure goods like autonomy or truth, there is no paradox, only a conflict of values. The 'paradox' becomes a limit case where tolerance is outweighed by survival. The colleague is right that (b) dissolves the logical tension, but wrong to suggest this is costless. By making tolerance defeasible, we lose its neutrality; it becomes one value among others, requiring a foundational theory (e.g., Millian harm) to justify when it is overridden. This transforms the problem from logical coherence to political justification.

  Regarding distinction (c), splitting the audience between citizen and state offers a partial solution but fails to locate the weak point. The colleague suggests citizens must tolerate persons while the state need not protect institutions. This relies on a public/private dichotomy that is increasingly porous. State suppression of intolerant institutions inevitably impacts citizens' rights to association and expression. If the state withdraws protection based on content, it undermines the very normative culture citizens are supposed to embody. Thus, (c) does not fully dissolve the problem; it merely relocates it from the logic of tolerance to the legitimacy of state coercion.

  This leads to the institutional case. The scenario doing the rhetorical work—a party winning power and abolishing contestation—is not primarily about tolerance but about constitutional self-defense. Here, the paradox adds nothing. A democracy need not tolerate its own abolition any more than a person must tolerate their own murder. This is ordinary self-preservation, not a specific puzzle about tolerance. The paradox only retains bite in the pre-institutional phase: when must we suppress speech *before* it becomes action?

  This brings us to the demarcation and sincerity problems, which are the true hurdles. If we accept the colleague's move to (b), we require a criterion for when tolerance is defeated. If the criterion is aim-based (manifestos), we face the sincerity problem. Dangerous movements often conceal intolerant aims until it is too late, while harmless unpopular views may sound extreme. A principle requiring us to read insincerity off a manifesto is epistemically impossible. If the criterion is action-based, we risk waiting until the damage is done.

  Therefore, the colleague's proposal succeeds in showing the paradox is not logical but rhetorical. It masks a hard political choice: either maintain neutrality and risk destruction, or ground tolerance in specific goods and risk abuse. The 'paradox' is useful rhetoric to highlight this tension, but it is not a genuine logical contradiction. However, the proposal fails to solve the demarcation problem. Distinguishing between (a), (b), and (c) clarifies the concepts, but it does not tell us who decides who counts as intolerant, nor how to prevent that licence being used against harmless views. Without a robust theory of evidence and harm, dissolving the paradox merely exposes the vulnerability of the defence. The paradox is not in the logic of tolerance, but in the necessity of judging intentions without omniscience.

  ***

  **Marking Scheme (25 Marks)**

  **Band 1: First Class (20–25)**
  *   **Conceptual Precision:** Defines 'paradox' strictly (logical contradiction) vs. 'limit case' (conflict of values). Explicitly states that moving to (b) removes the paradox label but sacrifices neutrality.
  *   **Assessment of Colleague:** Critically evaluates (c). Identifies the weak point: state actions impact citizens, so the split is not clean.
  *   **Institutional Work:** Argues whether the paradox does independent work in the institutional case (most likely argues it does not; it is constitutional self-defense).
  *   **Sincerity/Demarcation:** Addresses the asymmetry between announced/concealed intolerance. Notes that aim-based criteria fail on epistemic grounds; action-based criteria risk being too late.
  *   **Conclusion:** Takes a clear position on whether the paradox is genuine, rhetorical, or a limit case.
  *   **Typical Miss:** Failing to note that making tolerance defeasible requires a new foundational ground (e.g., truth/autonomy).

  **Band 2: Upper Second (16–19)**
  *   **Conceptual Precision:** Distinguishes between absolute principle and policy but may not fully explore the loss of neutrality.
  *   **Assessment of Colleague:** Engages with (a) and (b) well but treats (c) descriptively rather than critically.
  *   **Institutional Work:** Recognizes the constitutional self-defense argument but may not explicitly state whether the paradox adds anything to it.
  *   **Sincerity/Demarcation:** Mentions the problem of who decides but misses the specific asymmetry of concealed vs. announced intolerance.
  *   **Conclusion:** Reaches a conclusion but it may be hedged or less decisive than a First.
  *   **Typical Miss:** Treating the state/citizen distinction as a complete solution rather than assessing its weak points.

  **Band 3: Lower Second (12–15)**
  *   **Conceptual Precision:** Recites Popper's "unlimited tolerance destroys itself" without analyzing the logical structure.
  *   **Assessment of Colleague:** Describes the three distinctions but does not assess their validity or interaction.
  *   **Institutional Work:** Conflates speech suppression with institutional abolition.
  *   **Sincerity/Demarcation:** Mentions abuse potential generally but lacks specific analysis of the sincerity problem.
  *   **Conclusion:** Summarizes the prompt rather than answering the question.
  *   **Typical Miss:** Assuming the paradox proves tolerance is impossible rather than conditional.

  **Band 4: Third/Fail (0–11)**
  *   **Conceptual Precision:** Confuses tolerance with approval or indifference.
  *   **Assessment of Colleague:** Ignores the colleague's proposal entirely.
  *   **Institutional Work:** No engagement with the institutional case.
  *   **Sincerity/Demarcation:** No engagement.
  *   **Typical Miss:** Arguing that intolerance is always wrong regardless of context.

  **Hard Errors (Cap mark at 12 regardless of style)**
  1.  **Incoherence Claim:** Arguing that the paradox proves tolerance is logically incoherent *full stop* (rather than conditional).
  2.  **Definition Error:** Defining tolerance as approval or agreement rather as permitting what one opposes.
  3.  **Source Hunting:** Attempting to cite external sources for the colleague's unpublished view (shows misunderstanding of the prompt).

  **Marker's Note:** The key differentiator between a 2:1 and a First is the handling of the **sincerity problem** and the **loss of neutrality**. A 2:1 student sees the policy shift; a First student sees what that shift costs (neutrality) and why the epistemic problem (sincerity) remains unsolved by the conceptual distinction.
