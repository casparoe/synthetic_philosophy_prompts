      Let's suggest **Epistemic Categorization** (the conceptual framework that decides what counts as a "fact" vs "noise" before it even hits the archive). Or perhaps **Surveillance vs. Agency**. Records of ordinary people are often *about* them (police records) not *by* them. This is the "voice" problem.
      Let's call it **(7) Voice/Authorship**. The distinction between records *generated by* the subject vs. records *generated about* the subject. This cuts across Appraisal and Description. It's crucial for ordinary people. I will add this. It ranks high, probably #2 or #3.

  6.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the sophistication of the student's list. State the criteria clearly (Irreversibility, Scope, Agency).
