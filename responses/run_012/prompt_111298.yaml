      *   *Criterion 1: Irreversibility.* Can the silence be fixed later? (Loss is permanent; Access is temporary).
      *   *Criterion 2: Scope/Scale.* How many people does it affect? (Appraisal affects whole classes; Description affects specific searches).
      *   *Criterion 3: Epistemic Violence.* Does it distort the *meaning* of the past or just hide the *data*? (Synthesis distorts meaning; Loss hides data).
      *   *Criterion 4: Detectability.* Can the historian know the silence exists? (Loss is often invisible; Description is visible once you see the catalog).
      *   *Decision:* I need to weigh *ontological absence* (the record never existed) vs. *epistemological obstruction* (the record exists but can't be used). For "ordinary people," ontological absence is usually the biggest hurdle.

  4.  **Drafting the Analysis (Brainstorming & Evidence):**

      *   *(1) Record Loss:* This is the "archival silence" in its purest form (Derrida/Steedman). Evidence: Gaps in registers, comparison with parallel archives (e.g., church vs. state), physical signs of destruction (burn marks, missing folios).
      *   *(2) Appraisal:* This is the "macro-level" filter. Evidence: Retention schedules, comparison of what was dumped vs. kept (if disposal logs exist), demographic analysis of whose papers are acquired.
      *   *(3) Description:* This is the "micro-level" filter. Evidence: Changing subject headings over time (LCSH changes), finding aids that group individuals under institutions, box listings that say "Miscellaneous."
