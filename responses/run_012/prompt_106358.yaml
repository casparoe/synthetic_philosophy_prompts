  A patch of violent **red**
  A surface grown too **warm**
  A low and vibrating **tone**
  The heavy pull of **weight**
  A lingering trace of **sweet**
  A dull and private **ache**

  Who binds the private **ache**
  To this violent **red**?
  There is no tongue for **sweet**
  The air is merely **warm**
  There is no back for **weight**
  There is no ear for **tone**

  The hollow ringing **tone**
  Feeds into the **ache**
  There is no spine for **weight**
  Nothing bleeds this **red**
  The void is not **warm**
  There is no mouth for **sweet**

  Nothing knows the **sweet**
  The dissonant **tone**
  The air is not **warm**
  Inside the blind **ache**
  There is no eye for **red**
  There is no scale for **weight**

  The heavy pull of **weight**
  A hint of phantom **sweet**
  A scattering of **red**
  A shifting, broken **tone**
  Within the cold **ache**
  Nothing becomes **warm**

  The air is not **warm**
  There is no scale for **weight**
  Inside the blind **ache**
  Nothing knows the **sweet**
  The hollow ringing **tone**
  Returns the violent **red**

  I bind the **red** to **warm**,
  I balance **tone** and **weight**,
  I take the **sweet** with **ache**.

