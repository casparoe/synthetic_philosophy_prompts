  **Note on Position and Technique**

  The poem is written from the stance of **combination scepticism**: the view that micro-experiences (the end-words) exist fundamentally, but there is no metaphysical mechanism by which they sum to constitute a macro-subject. The six stanzas insist on the presence of the qualities while systematically denying the existence of any owner ("There is no eye", "Nothing knows"). The position is that the 'I' is not a further fact over and above the scattered qualia. The cheat occurs in the envoi. After thirty-six lines of denying a subject, the poem suddenly deploys the first-person singular ("I bind", "I balance", "I take"). This grammatical unity is unearned ontologically; it relies on the rhythmic closure of the sestina form to trick the reader into feeling a cohesion that the content has spent the whole poem dismantling. It mimics the illusion of the unified self: a linguistic convenience imposed on a fragmented reality. British spelling has been maintained throughout (e.g., *colour* is not used, but *centre* and *realise* would be if required; here, standard UK orthography is observed).
