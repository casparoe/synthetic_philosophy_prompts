      *   **The Goal:** A *diagnosis*, not a verdict. Identify the *kind* of disagreement (substantive, conceptual, evidentiary, etc.). Tell the user plainly which of their hypotheses is wrong. Propose what would count as progress (distinction, formal result, etc.) or argue why none is expected.
      *   **Constraint:** Engage with what each side *actually says*, not just survey the field. Be plain about errors in the user's hypothesis.

  2.  **Deconstruct the User's Hypothesis:**
      *   *Hypothesis 1:* Three separable claims (Contingency, Persistence, Inefficiency).
      *   *Hypothesis 2:* Contingency is trivial (Convergence side grants it).
      *   *Hypothesis 3:* Inefficiency is empirical but unanswerable (counterfactual problem).
      *   *Hypothesis 4:* Persistence is the "real work" claim.
      *   *Hypothesis 5:* Type/Token distinction explains part of the verbal dispute.
      *   *Hypothesis 6:* Mutual unfalsifiability is a key symmetry.
      *   *Hypothesis 7:* Institutional history borrowing caused the mess.

  3.  **Evaluate the Hypotheses against the Literature/Logic of the Debate:**
      *   *On Contingency:* The user says the Convergence side grants contingency. *Correction:* This is likely wrong. Strong efficiency proponents (neoclassical economics) often argue that while *timing* might vary, the *equilibrium* is determined by fundamentals, not accidents. They don't grant that a different initial accident leads to a *different long-run outcome* if efficiency drives convergence. They argue the basin of attraction is determined by payoffs, not history. So, Hypothesis 2 is vulnerable.
      *   *On Inefficiency:* User says it's empirical but unanswerable. *Correction:* It's not just empirical; it's definitional. If you define "efficiency" as "what survived," it's tautological. If you define it as "potential output," it's counterfactual. The Lock-in side defines it as $V_{locked} < V_{alternative}$. The Convergence side defines it as $V_{locked} \ge V_{alternative}$ because otherwise switching would have happened (Coasean logic). This is a clash of *models of adjustment costs*, not just missing data.
      *   *On Persistence:* User says this does the "real work." *Correction:* Persistence without inefficiency is just stability. Path dependence *requires* inefficiency to be interesting economically. If the persisted state is efficient, it's just "equilibrium." So Persistence and Inefficiency are conceptually linked, not separable.
      *   *On Type/Token:* This is a strong insight. The Convergence side argues "some ergonomic layout would win" (Type), Lock-in argues "QWERTY specifically won due to accident" (Token).
      *   *On Institutional History:* The member is right that "critical junctures" in historical institutionalism (Mahoney, Thelen) differ from Arthur's increasing returns. But blaming the "mess" on this borrowing is too simple. The mess exists because economics tries to formalize history.

  4.  **Identify the Core Impasse:**
      *   The debate isn't just about QWERTY. It's about the *null hypothesis*.
      *   Lock-in Side Null: Markets are prone to coordination failure.
      *   Convergence Side Null: Markets are efficient unless proven otherwise (transaction costs are zero or internalized).
      *   The impasse lives in the **definition of "Cost."**
      *   Lock-in sees switching costs as *frictions* that prevent optimization.
      *   Convergence sees switching costs as *real costs* that make the current state optimal *given those costs*.
      *   Therefore, "Inefficiency" is the pivot. If switching costs are part of the welfare function, QWERTY is efficient. If switching costs are frictions preventing access to a superior welfare function, QWERTY is inefficient.

  5.  **Formulate the Diagnosis:**
      *   **Kind of Disagreement:** It is primarily a **model-theoretic disagreement masquerading as an empirical one**, compounded by a **semantic equivocation on "efficiency."**
      *   **Which Hypothesis is Wrong?** The claim that Contingency, Persistence, and Inefficiency are *separable*. Specifically, the idea that Persistence does the work while Inefficiency is just rhetorical cover. In economic path dependence (Arthur, David), Inefficiency is the *definition* of the phenomenon. Without Inefficiency, it's just Hysteresis.
