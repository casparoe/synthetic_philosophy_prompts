answer: |-
  Here is a diagnosis of the impasse, engaging directly with the dynamics you described and testing your hypotheses against the logic of the debate.

  ### 1. The Diagnosis: What Kind of Disagreement Is This?

  This is not primarily an empirical disagreement, nor is it merely verbal. It is a **methodological clash over the null hypothesis**, disguised as an empirical dispute about keyboards.

  *   **The Lock-in Side** operates with a null hypothesis of **multiple equilibria**. They assume that in the presence of increasing returns, the market can settle on *any* of several stable points, and there is no automatic mechanism ensuring the *best* one is chosen. For them, "efficiency" is a property of the outcome relative to a theoretical optimum.
  *   **The Convergence Side** operates with a null hypothesis of **singular equilibrium**. They assume that while friction exists, profit opportunities (arbitrage) will eventually eliminate inefficiencies. For them, "efficiency" is a property of the process; if an outcome survives, it is because the costs of changing it outweigh the benefits.

  The impasse lives in the definition of **"Cost."**
  When the Lock-in side says QWERTY is inefficient, they mean: *There exists a layout (Dvorak) that yields higher typing speeds with lower effort, and the welfare gain exceeds the cost of retraining.*
  When the Convergence side says QWERTY is efficient, they mean: *The cost of retraining (coordination cost) exceeds the welfare gain of higher speeds.*

  Both sides are logically consistent within their own definitions. The Lock-in side treats switching costs as **frictions** that prevent optimization. The Convergence side treats switching costs as **real resource constraints** that define optimization. You cannot resolve this empirically because every piece of evidence (e.g., "nobody switches") is interpreted through these opposing definitions of cost.

  ### 2. Testing Your Hypotheses

  You proposed that three claims (Contingency, Persistence, Inefficiency) are being run together, and that Persistence is doing the real work. You also suggested the Convergence side grants Contingency. **Here is where your hypothesis is wrong.**

  **Hypothesis A: "Contingency is close to trivial and the convergence side would happily grant it."**
  **Verdict: False.**
  The Convergence side does *not* grant strong contingency. They grant noise, but not outcome-determining noise. Their argument is that while history might affect the *timing* of adoption, fundamentals (payoffs) determine the *endpoint*. If you tell a neoclassical economist that "a different initial accident would have produced a different outcome," they hear you claiming that fundamentals do not dominate noise in the long run. They deny this. They argue that if Dvorak were truly superior, the profit opportunity would have overcome the initial accident. To them, Contingency is not trivial; it is the specific claim they are fighting.

  **Hypothesis B: "Persistence... does all the real work while the other two provide rhetorical cover."**
  **Verdict: False.**
  Persistence without Inefficiency is theoretically uninteresting to economists; it is called **Hysteresis**, not Path Dependence. Hysteresis simply means the system has memory (e.g., unemployment stays high after a recession). Standard economics can accommodate hysteresis. The radical claim of the Lock-in side (Brian Arthur, Paul David) is specifically that Persistence leads to **Inefficiency** (sub-optimal equilibrium). If you remove Inefficiency, the Lock-in side loses its bite against standard theory. The Convergence side knows this; that is why they attack Inefficiency (by arguing switching costs make QWERTY optimal) rather than Persistence. Inefficiency is not rhetorical cover; it is the battleground.

  **Hypothesis C: "The convergence side is asking a type-level question... while the lock-in side is asking a token-level one."**
  **Verdict: True and Crucial.**
  This is your strongest insight. The Convergence side argues: "Some ergonomic layout would have won" (Type). The Lock-in side argues: "QWERTY won, and it specifically could have been Dvorak" (Token). This verbal slippage allows the Convergence side to concede the abstract point (history matters) while denying the concrete claim (QWERTY is bad).

  **Hypothesis D: "The vocabulary was borrowed from institutional history... and that importing it... produced the mess."**
  **Verdict: Partially True, but misdiagnosed.**
  The member is right that Historical Institutionalism (Mahoney, Thelen) focuses on *power* and *rules* foreclosing alternatives, whereas Economic Path Dependence (Arthur) focuses on *returns* and *coordination* foreclosing alternatives. However, the mess wasn't caused by borrowing the vocabulary; it was caused by trying to formalize history into a static equilibrium model. Institutionalists accept that "inefficiency" is political (someone wins, someone loses). Economists try to solve it as a mathematical error (aggregate welfare loss). The mess arises because the Lock-in side uses Institutionalist intuition (history forecloses) but tries to prove it with Economic metrics (welfare functions), which the Convergence side then dismantles using Economic logic (Coase theorem).

  ### 3. The Symmetry of Unfalsifiability

  You noted that each side accuses the other of unfalsifiability. This is correct, and it indicates you are in a **degenerate research program** (in the Lakatosian sense).

  *   **Lock-in Unfalsifiability:** If the market switches, they say "the window of opportunity closed." If it doesn't switch, they say "see, lock-in." The "critical juncture" is only identifiable in retrospect.
  *   **Convergence Unfalsifiability:** If the market switches, they say "efficiency prevailed." If it doesn't switch, they say "switching costs were too high (still efficiency)." They can always posit a hidden transaction cost to explain why a superior technology wasn't adopted.

  This symmetry exists because both sides are engaging in **Just-So Storytelling**. They observe the outcome and construct a narrative that fits their prior theoretical commitment. This is why QWERTY is a "zombie case": the data is too old, too noisy, and too theory-laden to discriminate between the stories.

  ### 4. Where the Impasse Lives

  The impasse lives in the **Counterfactual Gap**.
  To prove Path Dependence, you must prove: $V(\text{Alternative}) - V(\text{Current}) > \text{Switching Costs}$.
  *   The Lock-in side asserts $V(\text{Alternative})$ is high.
  *   The Convergence side asserts $\text{Switching Costs}$ are high.

  Since the Alternative was never scaled, $V(\text{Alternative})$ is unobservable. Since Switching Costs include coordination of millions of agents, they are unobservable. Both sides plug in assumptions to get the result they want. The disagreement is not about the world; it is about **parameter estimation in a model that cannot be run.**

  ### 5. What Counts as Progress?

  You asked for a distinction, a formal result, or a changed question. Continuing to debate QWERTY will yield nothing. The Liebowitz & Margolis (Convergence) vs. David (Lock-in) exchange has already occurred, and it ended in a stalemate because the evidence is exhausted.

  **Progress requires one of the following three moves:**

  **A. A Formal Distinction: Hysteresis vs. Path Dependence**
  You must formally separate the claims.
  1.  **Hysteresis:** History matters. (Both sides might agree).
  2.  **Path Dependence:** History matters *and* locks in a sub-optimal outcome. (Lock-in asserts, Convergence denies).
  3.  **Efficiency:** The outcome maximizes net benefits given transaction costs. (Convergence asserts, Lock-in denies transaction costs justify the gap).
  *Progress:* Agree that if the Convergence side can explain the outcome via transaction costs, it is not "Path Dependence" in the economic sense, it is just "Equilibrium with Frictions." The debate then shifts to: *Are switching costs exogenous frictions (Lock-in view) or endogenous prices (Convergence view)?*

  **B. A Discriminating Case: Move to Digital Standards**
  Abandon typewriters. Move to cases where switching costs are low and data is high.
  *   **Example:** Betamax vs. VHS. (Often cited as lock-in, but VHS had longer record time—was it actually better?)
  *   **Example:** Blu-ray vs. HD-DVD. (One won quickly. Why?)
  *   **Example:** QWERTY on Touchscreens. (We have the chance to observe a *new* critical juncture. Did smartphones lock into QWERTY, or did they shift to swipe/gesture? If they shifted, does that prove lock-in was weak? If they stayed, does it prove lock-in is strong?)
  *Progress:* Find a case where the "Switching Cost" can be measured directly (e.g., software migration) rather than inferred from social habit.

  **C. A Changed Question: From "Is it Efficient?" to "Who Pays?"**
  The Institutional History member was hinting at this. Efficiency is an aggregate claim. Path dependence often distributes costs unevenly.
  *   *Changed Question:* Instead of "Is QWERTY inefficient?", ask "Who bears the cost of switching, and do they have the power to enforce it?"
  *   *Progress:* This dissolves the unfalsifiability. You can measure power and distribution. It acknowledges that a standard can be "locked in" not because it's mathematically sub-optimal, but because the agents who would benefit from switching lack the coordination power to enforce it. This bridges the gap between the Economic and Institutional definitions.

  ### Summary of Verdict

  Your hypothesis that **Persistence** is the engine is wrong; **Inefficiency** is the engine, but it is defined differently by each side. Your hypothesis that **Contingency** is granted by the Convergence side is wrong; they deny outcome-determining contingency. Your intuition about **Type/Token** is correct and is the best tool you have to untangle the verbal dispute.

  The trouble is not that the question is ill-posed, but that **QWERTY is the wrong instrument to measure the phenomenon.** It is a historical relic that has absorbed too much theory. To break the loop, you must either formalize the definitions (separating hysteresis from inefficiency) or find a new empirical case where switching costs are observable rather than assumed. If you cannot do either, the disagreement is indeed philosophical: it is a clash between a worldview that sees markets as error-correcting mechanisms and one that sees them as historical processes prone to coordination failure. That is not a dispute a reading group can resolve; it is a choice of paradigm.
