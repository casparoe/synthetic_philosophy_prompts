answer: |-
  This is a classic problem in the ontology of art, but you are right to demand the machinery of the argument rather than a bibliography. The confusion arises because we use the word "original" to do three different jobs simultaneously: we use it to describe **physical constitution**, **historical genesis**, and **creative authority**.

  When these three come apart in your thought experiments, our intuitions fracture. To solve this, we have to treat "the original" not as a property of the object (like its weight or color), but as a **relation** between the object and a specific event in history.

  Here is the breakdown of the three competing accounts of value, how they handle your cases, and what remains when the physical difference vanishes.

  ### Part 1: The Three Accounts of Value

  To evaluate your cases, we need to isolate the three distinct criteria we unconsciously apply to art.

  1.  **The Material Account:** Value resides in the specific physical stuff. The value is in *these* atoms of lead white and *this* specific canvas.
  2.  **The Causal/Continuity Account:** Value resides in the unbroken chain of existence. The object must be the very same entity that emerged from the artist's studio, persisting through time (even if parts are replaced, like the Ship of Theseus).
  3.  **The Generative Account:** Value resides in the specific moment of creative decision-making. The value is in the *first* time an idea was externalized by the artist's hand.

  ### Part 2: Walking Through the Cases

  Let's stress-test these accounts against your three paintings.

  **Case 1: The Perfect Forgery**
  *   **Material Account:** **Passes.** It is atom-for-atom identical. If value were just the stuff, this would be equal to the original.
  *   **Causal Account:** **Fails.** The chain of history is broken. It did not emerge from the original artist's studio; it emerged from a forger's studio yesterday.
  *   **Generative Account:** **Fails.** The act was one of replication, not creation. The creative decisions were made 400 years ago; this act is merely technical execution.
  *   *Verdict:* We reject this as the original. This tells us the Material Account is insufficient. Physical identity is not enough.

  **Case 2: The Aggressively Restored Original**
  *   **Material Account:** **Fails.** Most of the original paint is gone. If value were just the stuff, this is mostly a copy.
  *   **Causal Account:** **Passes.** There is spatio-temporal continuity. The canvas is the same; the object has existed continuously since the 17th century. The restoration is viewed as maintenance of the *same entity*, not the creation of a new one.
  *   **Generative Account:** **Passes (by proxy).** Because the causal chain is unbroken, we treat the object as a vessel carrying the authority of the original generative act.
  *   *Verdict:* We accept this as the original. This tells us the Material Account is actually quite weak. Continuity trumps composition.

  **Case 3: The Artist's Own Copy**
  *   **Material Account:** **Fails.** It is new paint on new canvas.
  *   **Causal Account:** **Fails.** While it comes from the artist, it is a *new* causal chain starting 40 years later. It is not continuous with the first object.
  *   **Generative Account:** **Mixed.** It is an act of creation by the right person, but it lacks *generative novelty*. It is a repetition of a decision already made. In art, the "first" externalization carries a weight that the "second" does not, even by the same hand.
  *   *Verdict:* We call this a "second version" or a "copy," not "the original." This tells us that Authorship alone is not enough; *Priority* matters.

  ### Part 3: Is there a single account?

  There is no single account that gets all three right without modification, but one is clearly doing the heavy lifting: **The Causal/Continuity Account.**

  *   **Case 1** fails because it lacks the right causal history.
  *   **Case 2** succeeds because it maintains causal continuity despite material change.
  *   **Case 3** fails because it initiates a *new* causal history, despite having the right author.

  However, the Causal Account needs a supplement: **The Indexical Theory.**
  An artwork is an index. Like a fingerprint or a photograph, its value is tied to its physical connection to a specific cause.
  *   In **Case 1**, the fingerprint is fake.
  *   In **Case 2**, the fingerprint is worn and repaired, but it is still the same finger.
  *   In **Case 3**, it is the same person's finger, but a different touch.

  So, "the original" is not a description of the object's current state. It is a claim about its **history of production**. When we say "this is the original," we are saying: *"This object stands in the correct causal relation to the moment of conception."*

  ### Part 4: The Indistinguishable Duplicate (The Core Question)

  Now we reach the part you actually care about. If Case 1 (the forgery) is atom-for-atom identical, and no test now or in the future can distinguish them, is our preference for the original just sentiment or a status game?

  If we are talking about **Aesthetic Value** (what you see and feel), then **no, there is no difference.**
  If the experience is truly identical, the aesthetic value is identical. To claim the original *looks* better when they are physically identical is mysticism.

  However, if we are talking about **Artistic/Historical Value**, the difference is real, and it is not merely a status game. Here is the machinery of why:

  **1. The Truth of the Encounter**
  When you stand before the original (Case 2), you are standing in the presence of the thing the artist touched. The light hitting your eye bounced off a surface that absorbed the artist's gesture.
  When you stand before the Perfect Forgery (Case 1), you are standing in the presence of a lie. You are having an experience predicated on a false historical claim.
  *   *Analogy:* Imagine meeting a historical figure vs. meeting a perfect biological clone created today. Visually, they are identical. But the encounter with the historical figure has a truth-value the clone lacks. You are not meeting *them*; you are meeting a simulation of them.
  *   Our attachment to originals is an attachment to **truthful contact**. It is not status; it is epistemic integrity. We value knowing that the connection is real.

  **2. The Scarcity of History**
  History is singular. There was only one moment where that specific composition came into existence through that specific consciousness.
  *   Case 1 (Forgery) multiplies the object but does not multiply the history.
  *   Case 3 (Artist Copy) multiplies the object and the history, but the second history is derivative.
  *   The "Original" is the unique coordinate where Creativity + Matter + Time intersected for the first time.
  Even if the forgery is perfect, it cannot occupy that coordinate. It occupies a different coordinate (Today, Forger's Studio).
  If we treat them as equal, we are asserting that **history does not matter**, only the present state matters. That is a valid philosophical position (Presentism), but it contradicts how we value almost everything else (e.g., heirlooms, evidence in court, holy relics).

  **3. Is it a Status Game?**
  Market value? Yes, that is a status game. The price difference is social construction.
  Ontological value? No.
  If you admit that the forgery is *equal* to the original because they look the same, you have to admit that **art is purely visual.** But your intuition in Case 2 (the restored painting) proves art is *not* purely visual. You value the restored painting despite the new paint because of its history.
  Therefore, you already accept that history matters more than pure visuals. Consistency demands you reject the forgery for the same reason: its history is wrong.

  ### Conclusion

  The conceptual issue is that we treat artworks as **historical individuals** rather than **visual types**.

  *   A **song** is a type (any performance counts).
  *   A **painting** is a token (only this specific history counts).

  When the duplicate is indistinguishable, the **aesthetic experience** is identical, but the **artistic fact** is not.
  *   **Case 1** is a lie about a relationship.
  *   **Case 2** is a truth about a relationship, even if the physical medium has degraded.
  *   **Case 3** is a truth about a different relationship.

  So, is our attachment just sentiment? **No.** It is a commitment to the idea that **provenance is part of the identity of the work.** If you remove the history, you do not have the same artwork, even if you have the same image. To claim otherwise is to argue that art is merely decoration. If art is a form of communication between the artist and the viewer across time, the "channel" must be authentic for the message to be true. The forgery cuts the channel, even if the reception looks the same.
