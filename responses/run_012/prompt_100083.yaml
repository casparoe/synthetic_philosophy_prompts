          Dropping (b) (Determinism) is scientifically safer (Quantum mechanics).
          Dropping (a) (Objective Chance) makes it all about information/epistemology, which fits Finance/Actuarial science better.
          *Decision:* The "Single Best Change" is to modify (a). Change "Chances are real features of the world" to "Chances are real features of the *system*." This allows for Compatibilism.
          *Actually, better:* The user says (b) "There's no genuinely open branch anywhere, in the book or in the world." This is a strong metaphysical claim.
          If I tell them to drop (b), it changes the theme.
