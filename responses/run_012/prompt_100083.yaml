      *   *Re-evaluating the "Single Best Change":*
          The most productive tension for a novel is actually the conflict between (b) Determinism and (a) Real Chance. But logically, you can't have both.
          However, the *character* can hold inconsistent views. But the *author* needs to know the truth of the world to write the subtext.
