prompt: |-
  Right, I need help with something that keeps coming up in my reading group and it's doing my head in.

  Background: we're doing animal minds this term. I said that Descartes' denial that animals think looks empirically shaky — the man gives two tests (no animal talks, no animal does anything general-purpose), and then your dog limps on the leg that isn't hurt, corvids drop stones into water to raise the level, they re-cache food when they think they're being watched... anyway, a friend cut me off with 'yeah, but animals are just machines — that's a claim about souls, not about pain, so your yelping dog doesn't touch it'. Which, hmm.

  You're a philosopher of mind who works on both early modern philosophy and comparative cognition. I don't want a lecture on Descartes, I want that phrase taken apart. Start by brainstorming every distinct thing 'animals are just machines' could be asserting — compositional, metaphysical, explanatory, epistemic, semantic, moral, whatever — then lay them out as a menu with a verdict on each: trivially true, substantive and defensible, dubious, flatly false, or 'this is the one people actually mean when they say it'. Be careful to seperate claims about what animals are made of from claims about what explains their behaviour from claims about what they feel.

  Three specific things I want covered. (a) Does any reading of the slogan actually let my friend block the empirical refutation, or does the insulation only work on the reading that's already carrying all the controversy? (b) What is the reading on which Descartes cheerfully grants animals bodily feelings and only withholds thought from them — I've half-remembered it but can't place it, and I want to know whether it's coherent or just a fudge. (c) My flatmate, who does computational neuroscience, keeps saying the beast-machine is back: brains are prediction machines, bodies are allostatic regulators, and that story covers you and me as much as it covers the beetle. If he's right, does 'animals are just machines' collapse into something trivially true of everything, and if so, which reading was Descartes actually leaning on to keep humans on the other side of the line?

  No reading lists or citations please — I don't need names, I need the readings and your verdicts on them. Think it through carefully before you start writing, and please don't just give me five paraphrases of the same claim. I'm definately bringing this to the group on Thursday.
