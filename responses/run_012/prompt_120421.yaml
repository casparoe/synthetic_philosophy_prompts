answer: |-
  ### Design Space Brainstorming

  To isolate social externalism from environmental externalism while holding internalism constant, I need a scenario where the physical stuff is identical (blocking environmental divergence) and the individual psychology is identical (blocking internalist divergence), but the communal normative structure differs. The challenge is Constraint 2: the difference must be undiscoverable. If experts behave differently, someone could ask them. To satisfy "could not encounter," the difference must be historical or physically inaccessible yet causally relevant to the theory. A sealed historical charter works: it fixes the community's normative commitment without being observable. This separates the *causal link to stuff* (Environmental) from the *community's rule for fixing reference* (Social).

  ### The Case: The Sealed Charters of Clear Creek

  Two villages, Oakhaven and Pinehaven, sit on the same watershed. The water is molecule-for-molecule identical (H2O). The residents, Alice Oak and Alice Pine, are intrinsic duplicates with identical linguistic dispositions. They use the word "water" in exactly the same ways. However, upon founding, each village sealed a charter in a time-lock vault impossible to open. The Oakhaven charter stipulated: "‘Water’ refers to whatever shares the microstructure of this sample." The Pinehaven charter stipulated: "‘Water’ refers to whatever shares the observable qualities of this sample." No resident knows the contents; the vaults remain sealed. The water has never varied in microstructure or quality.

  **2x2 Grid Verdicts:**
  *   **Same Stuff / Same Use (Standard):** All theories agree content is the same.
  *   **Same Stuff / Diff Use (Target Case):** Environmental Externalism says **Same** (stuff is H2O). Internalism says **Same** (heads are identical). Social Externalism says **Different** (communal norms differ).
  *   **Diff Stuff / Same Use (Twin Earth):** Environmental says **Different** (H2O vs. XYZ). Internalism says **Same** (heads identical). Social says **Different** (experts track different stuff).
  *   **Diff Stuff / Diff Use:** All theories agree content is different.

  **Consistency:** Environmental Externalism is consistent (tracks stuff). Internalism is consistent (tracks heads). Social Externalism is consistent (tracks norms). The target case breaks the alliance between Environmental and Social externalism, showing they rely on different features.

  ### Analysis of Views

  **Internalism:** Verdict: Same Content. The speaker knows their meaning fully from the inside because meaning is constituted by internal states. The sealed charters are irrelevant to psychology.
  **Environmental Externalism:** Verdict: Same Content. The speaker cannot know the ultimate nature of the stuff, but content is fixed by the actual causal link to H2O, which is identical in both villages.
  **Social Externalism:** Verdict: Different Content. The speaker cannot know the community's hidden normative structure, but content is determined by that structure. The difference lies in the *conditions of application* fixed by the charter, not just the actual extension.

  **Load-Bearing Feature:** The hidden normative commitment regarding *how* reference is fixed (structure vs. quality).
  **Removal Test:** If the charters are made identical (e.g., both stipulate microstructure), Social Externalism verdicts collapse to "Same," landing us in the "Same Stuff / Same Use" cell where all theories agree.
  **Internalist Reply:** Your "hidden norm" is metaphysical dust. If it makes no difference to use, correction, or communication, it is not meaning. Meaning is use, and use is identical. To claim otherwise is to posit meaning ghosts that do no work.
  **Constraints Jointly Satisfiable:** True. The sealed vault satisfies the "cannot encounter" constraint while allowing a non-semantic factual difference.

