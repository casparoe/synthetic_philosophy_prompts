answer: |-
  ### Audience Brainstorm & Read

  *   **Torts/Insurance (x2):** They view "responsibility" as "liability." If your model doesn't identify a solvent defendant quickly, it's useless. They assume strict liability is the only fix for AI. *Objection:* "This is too granular for litigation."
  *   **Moral Philosopher:** Obsessed with the *control condition*. If the operator couldn't intervene, blaming them is unjust. They will attack your redefinition of "responsibility." *Objection:* "You're conflating causal contribution with moral blame."
  *   **Criminal Law:** Needs *mens rea*. Worried that spreading responsibility across a pipeline dilutes guilt to zero. *Objection:* "If everyone is responsible, no one is."
  *   **Safety Regulator:** Wants enforceable standards. "Move up the ladder" sounds vague to them. *Objection:* "How do I write a rule for that?"
  *   **Rail Engineer:** Thinks philosophers ignore existing Safety Management Systems (SMS). *Objection:* "We already do this via HAZOP and safety cases."
  *   **Grad Student:** Focused on power dynamics and deskilling. *Objection:* "This ignores structural coercion."

  **Confidence Level:** Moderate-High on the *types* of objections (these are standard tropes in this field). Low-Moderate on the *specific intensity* of the Moral Philosopher vs. the Engineer. The Engineer could be your best ally or your worst enemy depending on whether they feel you respect their existing practices.

  **Least Sure Point:** How rigid the Moral Philosopher will be on the "control condition." Some accept "role responsibility"; others are Kantian purists. I'm betting on purist.

