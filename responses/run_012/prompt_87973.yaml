answer: |-
  The reasoning move you describe has an established name in logic and game theory, though it is often discussed under the specific labels of the examples you gave (Surprise Examination, Centipede Game, etc.). The abstract name for the move itself is **Backwards Induction**.

  However, your dissatisfaction with that label is understandable. "Backwards Induction" is often taught as a solution method (a tool to find the answer), whereas you are describing it as a generative mechanism for paradox (a tool that eats its own premises). When applied to epistemic states (what agents know), it is more precisely called **Epistemic Backwards Induction**.

  To answer your specific questions: yes, the move is "one thing" structurally, but it splits into two distinct varieties depending on whether knowledge *invalidates a condition* (Cases 1 & 2) or *causes an event* (Case 3). Below is the settled description, the distinction between your cases, and a sharper definition if you find the standard terminology insufficient.

  ### 1. The Name and Structure
  The move is **Backwards Induction**.
  In formal epistemic logic, this is modeled using **Iterated Elimination of Impossible States**.

  The structure is always:
  1.  **Anchor:** Establish a truth at the final step ($T_n$) based on the hypothesis.
  2.  **Knowledge Transfer:** Assert that the agents *know* $T_n$ (or know that $T_n$ is impossible).
  3.  **Propagation:** Use that knowledge to eliminate possibilities at step $T_{n-1}$.
  4.  **Iteration:** Repeat until $T_1$ is eliminated.
  5.  **Contradiction:** The result contradicts the initial hypothesis.

  You feel that "Backwards Induction" is merely the name of the cases because in textbooks it is usually presented as *how to solve* a game, not *why the solution creates a paradox*. The paradox arises not from the induction itself, but from the assumption of **Common Knowledge**. The move assumes that not only do you know $X$, but you know that I know $X$, and I know that you know that I know $X$, ad infinitum.

  ### 2. One Move or Several?
  The reasoning move is **one single logical operation**. It is the iterative application of a knowledge operator to a finite chain of possibilities. However, the *ontological status* of the cases splits them into two families.

  **Family A: Epistemic Conflicts (Your Cases 1 & 2)**
  *   **Examples:** Surprise Examination, Finite Repeated Games (Centipede/Prisoner's Dilemma).
  *   **Mechanism:** The future event *does* happen (the exam occurs, the game is played). However, the *description* of the event becomes inconsistent with the knowledge required to predict it.
  *   **What changes:** The *properties* of the event (e.g., "surprising," "rational") are stripped away by the reasoning. The world remains the same; the *validity of the announcement* is destroyed.
  *   **Why it feels static:** As you noted, "nothing in the world has changed." The exam is still on Friday. The paradox is that the *announcement* ("It will be a surprise") becomes a **Moorean Paradox** ("It will happen, but you cannot know it") which the induction renders logically impossible.

  **Family B: Causal Conflicts (Your Case 3)**
  *   **Example:** Self-Falsifying Predictions (Oedipus Effect).
  *   **Mechanism:** The knowledge of the prediction *causes* the event not to happen.
  *   **What changes:** The *event itself* changes. If the predictor says "You will raise your hand," and you raise it *because* you want to falsify the prediction, the physical outcome is different.
  *   **Why it feels different:** Here, the knowledge is a causal force. In Family A, knowledge is a logical constraint.

  **Verdict:** The *reasoning move* is identical in all three. The *metaphysical consequence* differs. Cases 1 and 2 belong together; Case 3 is a distinct application of the same logic to a causal loop.

  ### 3. Is the Move Ever Sound?
  The move is **logically valid** but often **unsound in application** due to false premises about knowledge.

  *   **In Games (Case 2):** The move is sound *if* Common Knowledge of Rationality holds. If both players are perfectly rational and know the other is perfectly rational, they *must* defect immediately. The fact that humans don't play this way suggests the premise (Common Knowledge of Rationality) is false, not that the induction is flawed.
  *   **In Exams (Case 1):** The move is unsound. The flaw lies in the assumption that the students can *know* the exam hasn't happened yet while maintaining the condition that it will be a surprise. The knowledge required to perform the induction ("It can't be Friday") invalidates the premise ("It will be a surprise"). The move fails because the knowledge state is unstable.
  *   **In Predictions (Case 3):** The move is sound in concluding that the prediction *cannot be successfully communicated*. It is unsound if it concludes the event *will not happen*. The event will happen, but the prediction of it cannot be *known* by the actor beforehand.

  ### 4. A Sharper Definition (If "Backwards Induction" is insufficient)
  If you find "Backwards Induction" too tied to game theory, and "Paradox" too vague, the precise logical name for the move is:

  **Iterative Epistemic Elimination**

  **Definition:** A reasoning sequence on a finite set of ordered possibilities $\{P_1, P_2, ... P_n\}$ where:
  1.  A constraint $C$ is given that applies to the set.
  2.  At step $n$, $P_n$ is shown to violate $C$ given the agent's knowledge state $K$.
  3.  The falsity of $P_n$ is added to $K$.
  4.  At step $n-1$, $P_{n-1}$ is shown to violate $C$ given the *updated* $K$.
  5.  The process repeats until all $P_i$ are eliminated.

  **Boundary Conditions:**
  *   **Applies:** When the agent's knowledge state is treated as a fixed constraint that can be iteratively updated without altering the underlying facts (Family A).
  *   **Does Not Apply:** When the act of updating knowledge alters the underlying facts (Family B), unless the conclusion is restricted to the *communicability* of the knowledge rather than the *occurrence* of the fact.

  ### Summary
  The move is **Backwards Induction**, specifically **Epistemic Backwards Induction**.
  *   **Cases 1 & 2** are the same phenomenon (**Epistemic Unraveling**): Knowledge strips the event of its defining properties.
  *   **Case 3** is a different phenomenon (**Causal Self-Falsification**): Knowledge alters the event itself.
  *   **Soundness:** The logic is valid; the failure is always in the assumption that the knowledge state can remain stable while expanding (Common Knowledge).

  If you require a label that captures the *destructive* nature of the move rather than just the direction of the logic, I recommend **Epistemic Unraveling**. This term is used in economics and logic to describe exactly this process: a chain of reasoning that starts at the end and unravels the possibility of the beginning through iterated knowledge.
