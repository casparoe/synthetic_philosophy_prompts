prompt: |-
  I'm a junior and the data editor of my school newspaper, and before we print any story that compares two groups our faculty adviser wants the comparison to have passed some kind of check; at the moment the check is just her reading it the night before we go to press. Two submissions came in this month: one argues that our accelerated math track is harming students, since the district's own figures show accelerated students passing the AP Calculus exam at a lower rate than students in the regular track, and another argues that a new peer-tutoring program is useless, since students who attended tutoring scored lower on the final than students who did not. I have a spreadsheet, an hour, and one introductory statistics course behind me. I have heard reversals like this called Simpson's paradox, but I do not know what that name is supposed to tell me to do. Please write a procedure I can actually run on a comparison like these: the questions in order, what counts as a sufficient answer to each, and which comparisons I may print as they stand, which I must report split into subgroups, and which I must decline to print in either form. It should be honest about the point where the arithmetic stops and a causal assumption begins, and hand that decision to my adviser instead of pretending to settle it. Then run it on both submissions, including whichever verdict we will not want, and address the case it will get wrong: last year we printed a reversal story and the district's analyst said our split was invalid because we had split on something that was itself a result of the thing we were comparing. Also say plainly what the procedure cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User Role:** Junior, Data Editor of school newspaper.
      *   **Constraint:** One hour, spreadsheet skills, one intro stats course.
      *   **Task:** Create a procedure to check comparisons between two groups (specifically looking for confounding/Simpson's Paradox issues) before printing.
      *   **Inputs:** Two specific submissions (Accelerated Math vs. Regular Track AP pass rates; Peer-Tutoring attendees vs. Non-attendees Final Exam scores).
      *   **Requirements:**
          *   Step-by-step procedure (questions, sufficient answers, decision rules).
          *   Must distinguish between arithmetic and causal assumptions (hand causal decisions to the adviser).
          *   Run the procedure on both submissions.
          *   Include the "unwanted verdict" (i.e., don't just tell them what they want to hear).
          *   Address the specific past failure (splitting on a collider/mediator).
          *   State plainly what the procedure *cannot* do.
      *   **Tone:** Practical, honest, rigorous but accessible (high school level), actionable.

  2.  **Deconstruct the Statistical Problem:**
      *   The core issue is **Confounding** and **Simpson's Paradox**.
      *   *Submission 1 (Math Track):* Accelerated students have lower AP pass rates than Regular students. This sounds counterintuitive. Likely confounder: Prior ability. Accelerated students might be taking harder exams or the "Regular" group includes students who opted out of AP but are still in the regular track (wait, the prompt says "passing the AP Calculus exam"). If Regular track students are taking AP Calc, that's unusual. Usually, only Accelerated take AP Calc.
          *   *Correction/Refinement:* The prompt says "accelerated students passing the AP Calculus exam at a lower rate than students in the regular track." This implies *both* groups are taking AP Calc. If Regular track students are taking AP Calc, they are likely the top performers of the regular track, whereas Accelerated includes *all* accelerated students (including those struggling). This is a classic selection bias/confounding by prior ability.
      *   *Submission 2 (Tutoring):* Tutoring attendees scored lower than non-attendees. Classic confounding: Students who need tutoring (struggling students) go to tutoring. Students who don't need it (high achievers) don't go. Comparing raw scores is meaningless without controlling for prior performance.
      *   *The "Past Failure":* The prompt mentions a past story where they split on something that was a *result* of the treatment (a mediator or collider). This is "over-control" bias. For example, if studying the effect of tutoring on grades, don't split by "hours spent studying" if tutoring *causes* more studying. Or, in the math case, don't split by "final grade" if the track causes the final grade.
      *   *Simpson's Paradox:* Aggregated data shows one trend; disaggregated data shows the reverse. The procedure needs to detect when disaggregation is necessary and *valid*.

  3.  **Drafting the Procedure (The "Editor's Checklist"):**
      *   Needs to be doable in a spreadsheet.
      *   Needs to stop short of claiming causality.
      *   *Step 1: The Raw Comparison.* (What does the data say initially?)
      *   *Step 2: The Plausibility Check.* (Does this make sense? What's the hidden variable?)
      *   *Step 3: The Subgroup Search.* (Can we split the data?)
      *   *Step 4: The Timing/Logic Check (Crucial for the "Past Failure").* (Did the subgroup exist *before* the group assignment?)
      *   *Step 5: The Decision.* (Print, Split, or Kill).

  4.  **Refining the Procedure for the User's Level:**
      *   Avoid jargon like "collider bias" or "DAGs." Use "Cause vs. Effect" language.
      *   Make the "Handoff to Adviser" explicit. The student calculates; the adviser decides on causality.

  5.  **Running the Procedure on Submission 1 (Math Track):**
      *   *Claim:* Accelerated harms students (lower AP pass rate).
      *   *Raw Data:* Accel < Regular.
      *   *Suspicion:* Who takes AP Calc? Usually only the best from Regular take it. All Accel take it.
      *   *Subgroup:* Prior Math Grade or Placement Score.
      *   *Timing:* Placement happens *before* Track assignment. Safe to split.
      *   *Verdict:* Do not print raw comparison. Report split by prior ability.

  6.  **Running the Procedure on Submission 2 (Tutoring):**
      *   *Claim:* Tutoring is useless (Attendees < Non-attendees).
      *   *Raw Data:* Attend < Non-attend.
      *   *Suspicion:* Struggling students seek help.
      *   *Subgroup:* Prior GPA or Midterm Score.
      *   *Timing:* Prior score is *before* tutoring. Safe to split.
      *   *Verdict:* Do not print raw comparison. Report split by prior performance.

  7.  **Addressing the "Past Failure" (The Trap):**
      *   The prompt asks to address the case the procedure will get wrong.
      *   *Scenario:* Splitting on a variable caused by the treatment.
      *   *Example:* If we studied the Math Track's effect on *College Acceptance*, and we split by *AP Score*. AP Score is caused by Math Track. Splitting by it hides the total effect.
      *   *Instruction:* I need to add a specific step in the procedure to warn against this, but acknowledge the procedure can't *prove* the direction of causality, only flag the risk.
      *   *Wait, re-reading the prompt:* "address the case it will get wrong: last year we printed a reversal story and the district's analyst said our split was invalid because we had split on something that was itself a result of the thing we were comparing."
      *   *Action:* I need to explain *why* the procedure might fail here (because it relies on the student knowing the timeline/logic) and give a specific warning example in the analysis of the submissions if applicable, or as a general caveat. Actually, the prompt asks me to "address the case it will get wrong." This implies I should identify a scenario where *this* procedure might lead them astray if they aren't careful, specifically regarding the "splitting on a result" error. I will add a specific "Trap Alert" step.

  8.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the pressure and the limits of stats.
      *   **The Procedure (The "Paradox Protocol"):** 5 Steps.
          1.  State the Raw Numbers.
          2.  Identify the "Hidden Third Factor" (Confounder).
          3.  Check the Timeline (Crucial for the "Past Failure").
          4.  Run the Split (Spreadsheet work).
          5.  The Adviser Handoff (Causal claim).
      *   **Applying to Submission 1 (Math):**
          *   Raw: Accel worse.
          *   Hidden Factor: Selection bias (who takes the test).
          *   Timeline: Placement before Track.
          *   Verdict: **Hold.** Split by prior GPA. Likely reversal.
      *   **Applying to Submission 2 (Tutoring):**
          *   Raw: Tutoring worse.
          *   Hidden Factor: Need for help.
          *   Timeline: Prior grades before Tutoring.
          *   Verdict: **Hold.** Split by prior grades. Likely reversal.
      *   **The "Past Failure" Warning:** Explain *Collider/Mediator* bias simply. "Don't split on something the treatment caused."
      *   **Limitations:** What this can't do (prove causation, fix bad data, account for unmeasured variables).

  9.  **Refining the Tone:**
      *   Needs to be empowering but cautious. "You are the gatekeeper, not the judge."
      *   Ensure the distinction between "Association" and "Causation" is clear.
      *   Make sure the "One Hour" constraint is respected (simple pivot tables, not regression).

  10. **Self-Correction/Review during drafting:**
      *   *Critique:* Is the Math Track example realistic? "Regular track students passing AP Calculus." Usually, regular track students don't take AP Calc.
      *   *Fix:* I must address this data oddity. If Regular students are taking AP Calc, they are self-selected high achievers. Accelerated students are a mix. This is the confounder. I need to make sure the procedure highlights *selection into the test* as a variable.
      *   *Critique:* The prompt asks to "address the case it will get wrong."
      *   *Fix:* I need to explicitly state that if the "Hidden Third Factor" is actually a *result* of the group assignment, the procedure fails. I will use the "Past Failure" story as the example of this limitation.
      *   *Critique:* Make sure I don't solve the causality. The adviser does that.
      *   *Fix:* Step 5 is explicitly "The Adviser Handoff."

  11. **Final Polish:** Check against all constraints.
      *   Procedure? Yes.
      *   Questions/Answers/Verdicts? Yes.
      *   Run on both submissions? Yes.
      *   Include unwanted verdict? Yes (both will likely be "Hold/Don't Print Raw").
      *   Address past failure? Yes.
      *   State limitations? Yes.
      *   Tone? Professional, journalistic, statistical.

  12. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a procedure designed for your constraints: one hour, spreadsheet software, and introductory statistics knowledge. It is designed to catch Simpson's Paradox (reversals) and selection bias without overstepping into causal claims that require advanced modeling.

  ### The "Paradox Protocol" (Editor's Checklist)

  **Time Required:** 45–60 Minutes
  **Tools:** Spreadsheet (Pivot Tables), School Records Access

  #### Step 1: The Raw Comparison
  **Question:** What is the exact percentage or average difference between Group A and Group B in the submitted story?
  **Sufficient Answer:** A clear number (e.g., "Group A is 10% lower than Group B").
  **Action:** If the difference is less than 5 percentage points (or statistically negligible), flag it as "Weak Evidence." If large, proceed.

  #### Step 2: The "Before" Variable Search
  **Question:** Is there a measurable variable recorded *before* the students entered Group A or Group B that predicts the outcome? (e.g., prior GPA, placement test score, attendance record).
  **Sufficient Answer:** Yes/No. If Yes, name the variable.
  **Action:** If **No**, you cannot check for confounding. Proceed to Step 5 (Adviser Handoff) with a warning label. If **Yes**, proceed to Step 3.

  #### Step 3: The Timeline Check (Crucial)
  **Question:** Did this "Before" variable exist *before* the decision to join Group A or Group B was made?
  **Sufficient Answer:** A definitive "Yes."
  **Warning:** If the variable was measured *after* or *during* the program (e.g., "midterm grade" for a "tutoring program" that happened all semester), **STOP**. Do not split the data. This is the error your paper made last year (splitting on a result).
  **Action:** If **Yes**, proceed to Step 4. If **No**, mark as "Invalid Split Risk" and proceed to Step 5.

  #### Step 4: The Subgroup Split
  **Question:** When we split the data by the "Before" variable (e.g., Low Prior GPA vs. High Prior GPA), does the trend hold in *every* subgroup?
  **Sufficient Answer:** Calculate the comparison within each subgroup.
  *   **Consistent:** Group A is lower than Group B in Low, Medium, and High subgroups.
  *   **Reversed:** Group A is higher than Group B in one or more subgroups (Simpson's Paradox).
  *   **Mixed:** The difference disappears in some subgroups.
  **Action:**
  *   **Consistent:** You may print the raw comparison, but note the subgroup check was passed.
  *   **Reversed/Mixed:** You **must not** print the raw comparison. You must report the subgroups or kill the causal claim. Proceed to Step 5.

  #### Step 5: The Adviser Handoff
  **Question:** Does the data prove the Group *caused* the Outcome?
  **Sufficient Answer:** **NEVER.** Your arithmetic cannot answer this.
  **Action:** Attach a note to the adviser: *"We controlled for [Variable]. The trend [Persisted/Reversed]. However, unmeasured factors (motivation, home support) may still explain the difference. Causal language ('harms', 'useless') requires your approval."*

  ---

  ### Application to Submissions

  Here is the verdict if you run this protocol today.

  #### Submission 1: Accelerated Math Track vs. AP Calculus Pass Rates
  *   **Claim:** Accelerated track harms students (Lower pass rate).
  *   **Step 1 (Raw):** Accelerated pass rate < Regular track pass rate. (Large difference).
  *   **Step 2 (Before Variable):** Yes. 9th-grade Math Placement Score or 8th-grade GPA.
  *   **Step 3 (Timeline):** Yes. Placement happens before the track begins.
  *   **Step 4 (Split):**
      *   *Likely Result:* When you split by 8th-grade GPA, you will find that Regular Track students taking AP Calc are almost exclusively the top 5% of the regular cohort. Accelerated students include the top 50%.
      *   *Prediction:* Within the "High GPA" subgroup, Accelerated pass rates will likely match or exceed Regular pass rates. The raw data is skewed because the "Regular" group is self-selected for high ability, while the "Accelerated" group is a mandated mix.
  *   **Step 5 (Handoff):** The data shows selection bias, not harm.
  *   **Verdict:** **DO NOT PRINT AS IS.**
      *   *Required Action:* You must report the pass rates split by prior GPA. If the reversal holds (Accelerated does better among equals), the headline "Track Harms Students" is false. If the data isn't available to split, you must decline the causal claim.

  #### Submission 2: Peer-Tutoring Program vs. Final Exam Scores
  *   **Claim:** Tutoring is useless (Attendees scored lower).
  *   **Step 1 (Raw):** Attendees < Non-Attendees. (Large difference).
  *   **Step 2 (Before Variable):** Yes. Midterm Exam Score or Q1-Q3 GPA.
  *   **Step 3 (Timeline):** Yes. Prior grades exist before tutoring attendance.
  *   **Step 4 (Split):**
      *   *Likely Result:* Students who attend tutoring are those struggling. Students who don't attend are those already succeeding.
      *   *Prediction:* Among students with "Low Midterm Scores," Attendees will likely score *higher* than Non-Attendees (who didn't seek help despite struggling). The raw data compares apples (struggling students) to oranges (high achievers).
  *   **Step 5 (Handoff):** The data suggests the program helps struggling students, but raw data hides it.
  *   **Verdict:** **DO NOT PRINT AS IS.**
      *   *Required Action:* Report scores split by Midterm Performance. Printing the raw comparison is statistically dishonest.

  ---

  ### The "Past Failure" Warning (Where This Procedure Can Fail)

  You asked to address the case the procedure will get wrong. Last year, you split on a variable that was a **result** of the treatment. In statistics, this is called "conditioning on a collider" or "over-control."

  **The Trap:**
  Imagine you are studying the **Math Track** again, but the outcome is **College Acceptance**.
  *   **Step 2 Variable:** You choose "AP Calculus Score" as your subgroup.
  *   **Step 3 Check:** You might think, "The AP score comes before College Acceptance." **This is true.**
  *   **The Error:** The AP Score comes *after* the Math Track assignment. The Math Track *causes* the AP Score.
  *   **The Result:** If you split by AP Score, you are comparing students who succeeded *within* the track against students who succeeded *outside* it. You mathematically remove the effect of the track on the score. You might conclude the Track has no effect on College Acceptance, when in reality, the Track improves Acceptance *by* improving AP Scores.

  **How to avoid it:**
  In Step 3, ask: *"Could the Group Assignment (Accelerated/Tutoring) have changed this variable?"*
  *   If **Yes** (e.g., AP Score, Final Grade, Study Habits): **DO NOT SPLIT.**
  *   If **No** (e.g., 8th Grade GPA, Gender, Prior Year Attendance): **SAFE TO SPLIT.**

  If your spreadsheet analysis relies on a variable that the program itself influences, your procedure will validate a false negative. This is why Step 5 (Adviser Handoff) is mandatory. You can calculate the numbers, but you cannot verify the causal timeline alone.

  ### What This Procedure Cannot Do

  Be honest with your adviser. This checklist has hard limits:

  1.  **It cannot prove causation.** Even if the trend holds after splitting by prior GPA, it is possible that "Motivation" causes both "Joining Accelerated Track" and "Passing AP." You have controlled for *measured* prior ability, not *unmeasured* drive.
  2.  **It cannot fix small sample sizes.** If you split the Tutoring data into "Low GPA" and "High GPA," you might end up with only 5 students in one cell. Percentages based on 5 students are noise, not data. If any subgroup has fewer than 10 students, mark the split as "Unreliable."
  3.  **It cannot detect all bias.** If the "Before Variable" is measured poorly (e.g., "Teacher Recommendation" which is subjective), the split won't fully correct the bias.
  4.  **It cannot replace domain knowledge.** You need to know *why* Regular Track students are taking AP Calc. If the district allows it only for exceptions, that is a selection bias this spreadsheet can quantify but not explain.

  ### Summary of Decisions for You

  | Submission | Print Raw? | Print Split? | Print Causal Claim? |
  | :--- | :--- | :--- | :--- |
  | **Math Track** | **NO** (Misleading) | **YES** (If N > 10 per group) | **ADVISER ONLY** |
  | **Tutoring** | **NO** (Misleading) | **YES** (If N > 10 per group) | **ADVISER ONLY** |

  **Your Script to the Reporters:**
  *"Your data shows a correlation, but it likely reflects who chooses these programs, not what the programs do. I can run a check to see if the trend holds for students with similar prior grades. If it flips, we can't run the headline. If it holds, we still need the adviser to approve the word 'harms' or 'useless.' Do you have the prior grade data?"*
