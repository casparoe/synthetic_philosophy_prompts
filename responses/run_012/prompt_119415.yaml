      *   (7) *Copy + Erase First:* Pay cost even if info exists elsewhere. -> **Tricky.** This is the crux of the friend's argument. If info is copied, erasing the *original* costs energy *unless* the copy is used to reverse the process. But usually, copying itself creates correlation.
