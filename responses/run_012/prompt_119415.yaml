prompt: |-
  ok so i'm in this physics club at my high school and we've been arguing about maxwell's demon for like three weeks and i need someone to tell me what the actual principle is because my teacher and my friend keep talking past each other. my teacher says the demon can't beat the second law because it has to forget, and my friend says thats a cop-out because forgetting is just bookkeeping and if you never forget you never pay. i wrote down my gut verdicts on a bunch of versions and i want to know what principle fits them, even if it makes me give one up. here they are: (1) a demon measures which side a single gas molecule is on, slides in a partition, lets it push a piston, and gets work out; i say the gas's entropy goes down but the second law is safe. (2) a demon measures the molecule and then immediately wipes the result before it opens the door; i say it gets no work, because the info has to still be there when the door opens. (3) a demon keeps every measurement in a giant memory and never erases anything, so it can keep extracting work forever with no heat dumped; i say no, because eventually the memory fills up and also the memory's own entropy has to count. (4) a computer runs a computation and then runs it backward, leaving no junk bits, so it can do a huge number of steps without paying the kT ln 2 erasure cost per step; i say yes in principle. (5) a demon that only knows the total energy of the gas, not which molecule is where, can't sort fast from slow; i say right, global info isn't enough. (6) if you include the demon's memory in the system, the total entropy never goes down; i say obviously. (7) a demon copies its measurement into a second memory and then erases the first memory; i say it should still pay a cost, even though the info is still around in the second memory, and this is where i get stuck, because (4) says no cost if you don't erase. (8) a demon measures, uses the info, and then resets its memory by a reversible operation that dumps the info into a heat bath at the same temperature; i say it can get up to kT ln 2 of work per bit, but only if the reset is counted.

  so what is the principle? is it just the erasure cost plus count the memory, or is there a more general rule about when correlations can be cashed in for work? i'd like it stated precisely, with which of my verdicts it keeps and which one it has to overturn, and what it predicts for a case i havent thought about: a demon that never erases anything but instead entangles its memory with the gas so the two are perfectly correlated, then uses that correlation to extract work. does that change the accounting? also, is there a version where the demon's memory is itself reversible and no information is ever lost, so no erasure cost, but the second law still holds because the demon and the gas are correlated? i think yes but i dont know how to say the principle without just saying entropy counts information.
