      *   *Entanglement:* In classical thermo, it's "correlation." In quantum, it's "entanglement." The principle is the same: Mutual Information $I(A:B)$. Work extractable is proportional to $I$.
      *   *Teacher vs. Friend:* The teacher is invoking Landauer. The friend is invoking the fact that measurement *can* be reversible. The synthesis is Bennett's analysis: Measurement is reversible, but *resetting* the demon for the next cycle is not.
