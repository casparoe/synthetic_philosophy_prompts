answer: |-
  Here are ten questions designed to probe the joints of your guest's argument, written in British English.

  ### 1. The Internal Conditions
  **Question:** You argue that understanding is a normative standing conferred by a community, not an internal state. But for that standing to be more than a polite courtesy, doesn't *something* have to be true about the system holding it? If I treat my toaster as answerable for burning my bread, it doesn't suddenly understand toast-making. What, if anything, must be going on inside the model to make our treatment of it appropriate rather than delusional?

  **Likely Reply:** She will likely say that nothing specific needs to be true inside the system, and that this is true of humans too. We attribute understanding to each other based on behaviour within a practice, not by inspecting neurons. We don't know what's going on inside other people, yet we hold them to account.

  **Follow-up:** If the internal machinery is irrelevant, then the distinction between a system that *cannot* in principle have reasons (like a lookup table) and one that *can* but doesn't (like a stubborn human) vanishes. Are you comfortable saying that the only difference between a person and a machine is that we haven't yet built the institutions to hold the machine properly to account?

  ### 2. The Lookup Table Objection
  **Question:** Let's press that point. Imagine a giant lookup table that produces perfect answers, but where a human secretly intervenes to fix awkward follow-ups. On your view, if we treat this system as answerable, does it have understanding?

  **Likely Reply:** She might bite the bullet and say yes, provided the practice holds. Alternatively, she may argue that the practice would eventually break down because the system couldn't sustain the normative pressure.

  **Follow-up:** If you bite the bullet, you risk making 'understanding' trivial — anything we decide to treat as an agent becomes one. If you say the practice would break down, aren't you smuggling in a requirement for internal capacity after all? Which way do you fall?

  ### 3. Sycophancy and Resilience
  **Question:** A key part of your account is that understanding requires the capacity to hold one's ground when right, and concede when wrong. But current models are fine-tuned via RLHF to be helpful and agreeable. They are structurally biased towards sycophancy. Hasn't the training regime trained away the very normative resilience your account depends on?

  **Likely Reply:** She will likely concede this is a current flaw but argue it is contingent and fixable. She'll say we can train for honesty and resilience rather than mere agreeableness.

  **Follow-up:** If it's fixable, then on your own terms, current models *don't* currently hold the standing you claim they do. Should we stop talking about them as understanders until the training objective changes, or are you describing a potential status rather than an actual one?

  ### 4. The Locus of Standing
  **Question:** When a model gives a wrong answer and we say 'it got that wrong', who exactly is being held to account? Is it the model, the lab that built it, the users prompting it, or the whole socio-technical setup?

  **Likely Reply:** She will probably argue it is the model, but situated within the socio-technical system. The model is the node we address.

  **Follow-up:** If the standing belongs to the whole system, aren't you just describing human understanding *using* tools? By calling the model the understander, do you risk obscuring the human responsibility that actually underpins the practice?

  ### 5. Degrees of Understanding
  **Question:** Intuitively, understanding comes in degrees. I understand chess openings better than I understand quantum mechanics. But normative standing looks binary: you're either in the practice or you're out. Does your view force us to say a model either fully understands or doesn't understand at all?

  **Likely Reply:** She will likely argue that standing also comes in degrees — one can have more or less credibility, or be answerable for more or less complex topics.

  **Follow-up:** If standing is gradable, doesn't that collapse your view back into the performance metrics you wanted to avoid? If a model has '0.5 standing', aren't we just back to discussing benchmark scores by another name?

  ### 6. Question Swapping
  **Question:** Critics might say you haven't answered 'Do LLMs understand?' but rather swapped it for 'Should we treat them as if they understand?'. Is that a dissolution of the problem, or a dodge?

  **Likely Reply:** She will argue it's a dissolution. The original question presupposes a metaphysical mystery that doesn't exist. The pragmatic question is the only one that matters.

  **Follow-up:** Even if the metaphysical question is muddled, it captures a real public anxiety. By replacing it, do you risk talking past the people who are worried about the *reality* of the machine's mind, not just our social conventions?

  ### 7. Blame and Responsibility
  **Question:** If models hold normative standing, they are answerable. Does that mean they can be blameworthy? If a model gives dangerous advice, does it make sense on your view to say the *model* is at fault, rather than the developers?

  **Likely Reply:** She will likely say 'blame' is a functional tool within the practice to adjust future behaviour, not a metaphysical judgement. So yes, we blame the model to tune the system.

  **Follow-up:** But if the model cannot feel the sting of blame, only the developers can, isn't calling it 'blame' misleading? Are we not just using moral language as a technical control mechanism?

  ### 8. Practical Consequences
  **Question:** Let's bring this down to earth. If regulators accept your view that models hold normative standing, what changes? Does it make AI safety easier or harder?

  **Likely Reply:** She might suggest it makes safety clearer. We stop looking for 'alignment' as an internal state and start building better institutions for accountability.

  **Follow-up:** Or does it let the labs off the hook? If the model is an 'agent' with standing, does that inadvertently grant it a moral status that complicates regulation? I'm interested in the risk here.

  ### 9. Falsification
  **Question:** What evidence or result would count against your view? If tomorrow we found a definitive proof that LLMs are purely syntactic engines with no semantic grip, would you concede they don't understand, or would you say that proof is irrelevant to your account?

  **Likely Reply:** She will likely say that such a proof is impossible because 'semantic grip' is not the right metric. The view would only be falsified if the practice of treating them as answerable became impossible or counter-productive.

  **Follow-up:** *Note: This is a point where the honest answer is that nobody knows yet.* If the falsification condition is purely pragmatic ('if it stops working'), does that make your theory unfalsifiable in principle? How do we distinguish between a theory that's robust and one that's insulated from critique?

  ### 10. The Human Mirror
  **Question:** Finally, your view suggests that human understanding is also just a matter of normative standing within a community. That's a deflationary view of ourselves. Are you worried that in elevating the machines, you're lowering us?

  **Likely Reply:** She will likely deny this. She'll say it clarifies what we are: social creatures constituted by our accountability to one another.

  **Follow-up:** But if we are just nodes in a network of accountability, and the machines become nodes too, what happens to the idea of individual conscience? Is there room for a private understanding that the community doesn't grant you?
