  OK, here's a view I've basically talked myself into and I want you to try to knock it over. You know the color phi thing — two dots flashed in different spots, the second one a different colour, and people report seeing one dot that moves and changes colour partway across, except the colour change seems to happen *before* the second dot even shows up. Dennett's take on this is that the whole "Orwellian vs Stalinesque" business is a non-question: either the brain rewrites the memory after the fact, or it bakes the colour into the experience before it's ever experienced, and there's no fact of the matter which, because nothing could tell the two apart. I think thats right, and I'd even go further and say the phenomenon is basically a Rorschach test for whatever metaphysics of time and memory you walked in with. What would count against it?

  Do it in four parts. "The view, back to you" — two or three sentences restating it so I know you got it. "What would sink it" — the strongest things that would genuinely count against the no-fact-of-the-matter claim, including any experiment or neural finding that could force one reading over the other, ranked from most to least decisive. "Merely awkward" — objections a defender just shrugs off, and why. "Verdict" — is the position well insulated from evidence, and is that a bug or a feature here? Give the middle two sections a couple hundred words each and keep the first short. Also be honest about which of these defeaters Dennett himself would already concede.
