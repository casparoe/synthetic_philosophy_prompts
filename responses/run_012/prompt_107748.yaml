  1.  **Deploy the Case:** Write the composite vignette on the board. *Include:* Accurate localization, qualitative description ("sharp burning"), absence of withdrawal/grimace, verbal indifference ("does not care"). *Exclude:* Lesion location, drug history, psychiatric history. *Why:* Excluding medical details prevents premature mechanistic explanations; including qualitative description blocks claims of anesthesia. *Dependency:* The case must establish sensation before questioning valuation. *Check:* Group agrees the patient detects the stimulus accurately.

  2.  **Diagnosis Check:** Ask: "Does he feel pain?" If "No," point to localization/description. If "Yes," ask: "Is it bad for him?" *Why:* This forces the dissociation between sensation and valuation into the open. *Dependency:* Requires acceptance of Step 1's sensory data. *Check:* Group acknowledges the dissociation between sensation and negative valuation.

  3.  **Block Stoicism:** Anticipate: "He is brave." Counter: Highlight "does not care." Bravery endures badness; this patient denies it. *Why:* Psychiatry residents may psychologize the response; this ensures the phenomenon is treated as a deficit, not a coping strategy. *Dependency:* Requires Step 2's acceptance of indifference. *Check:* Group accepts the indifference is pathological, not virtuous.

  4.  **Block Standard Taxonomy:** Anticipate: "It's sensory vs. affective." Counter: Accept the label but insist it describes *what* is missing, not *why* pain is bad. *Why:* Philosophy students will reach for this dichotomy; it must be treated as a placeholder for the philosophical problem, not the solution. *Dependency:* Requires Step 3's acceptance of pathology. *Check:* Group agrees we need an account of pain's normative force.

  5.  **Introduce Pivot:** Propose: Pain's badness consists in issuing an authoritative *command* to stop, not merely unpleasant feeling. Asymbolia = sensation intact, command severed. *Why:* This shifts the debate from phenomenology to normativity, explaining why the sensation remains but the suffering vanishes. This view is philosophically robust provided "command" is distinguished from "urge." *Dependency:* Requires Step 4's rejection of simple taxonomy. *Check:* Group can distinguish "feeling unpleasant" from "being ordered to act."

  6.  **Boundary Declaration:** State aloud: "We will not discuss lesion localization, insular cortex, or pharmacology. Those are mechanisms, not concepts. No readings assigned." *Why:* This protects the conceptual focus from clinical drift and manages expectations regarding expertise. It prevents the residents from deferring to neuroscience and the philosophers from deferring to medicine. *Dependency:* Prevents Step 5 from being reduced to neural correlates. *Check:* Group understands the session is conceptual, not clinical.

  7.  **Final Assessment:** Ask: "If an agent felt a command to stop a stimulus but experienced no unpleasantness, would they suffer pain's badness?" *Why:* This isolates the command view from the feeling view. *Dependency:* Requires grasp of Step 5's distinction. *Check:* A "yes" indicates they grasp badness as authority; a "no" indicates they conflate badness with feeling.
