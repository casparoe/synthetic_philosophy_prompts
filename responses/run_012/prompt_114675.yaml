answer: |-
  The 2016 match between Lee Sedol and AlphaGo offers a rigorous stress test for Daniel Dennett's taxonomy of cognitive competence. Dennett's hierarchy—Darwinian, Skinnerian, Popperian, and Gregorian—was originally designed to chart the evolution of biological minds. However, the architecture of deep learning systems decouples cognitive functions from biological lineage, allowing us to analyze these grades as functional modules rather than evolutionary stages. To map this episode disciplinedly, we must first isolate the mechanical features of the system and the context of the match.

  AlphaGo's architecture combined deep neural networks with Monte Carlo Tree Search (MCTS). It utilized a "policy network" to suggest moves and a "value network" to evaluate board positions. Training occurred in two phases: supervised learning on a database of human expert games, followed by reinforcement learning through self-play. During the match, AlphaGo did not learn; its weights were fixed. Its "thinking" during play consisted of running thousands of simulated rollouts (MCTS) to evaluate the probability of winning for candidate moves. Lee Sedol, conversely, relied on decades of intuition, pattern recognition, and fatigue management, embedded within the cultural history of Go.

  **Mapping the Four Grades**

  The **Darwinian** grade in this episode does not apply to AlphaGo's operation *during* the match, as the system did not evolve in real-time. Instead, the Darwinian layer corresponds to the engineering process at DeepMind. The "genome" consists of the hyperparameters and architectural choices selected by the developers. Variations of the software (AlphaGo Fan, AlphaGo Lee) were subjected to selection pressure against previous versions. Only the fittest architecture survived to play in Seoul. This is phylogenetic selection, occurring over developer time, creating the fixed competences AlphaGo possessed at the start of Game 1.

  The **Skinnerian** grade is evident in AlphaGo's training phase, specifically the reinforcement learning (RL) via self-play. Here, the system generated behaviors (moves) and received a binary reward signal (win/loss). Successful strategies were reinforced by adjusting neural weights; unsuccessful ones were extinguished. This is operant conditioning in a digital environment. However, during the match itself, AlphaGo was not Skinnerian; it did not try a move, lose, and update its weights. It operated with the competences acquired through that prior conditioning.

  The **Popperian** grade is the most critical mapping for AlphaGo's in-game performance. Dennett describes Popperian creatures as those that "let their hypotheses die in their stead." AlphaGo's MCTS is a literal implementation of this. Before committing to a physical stone on the board, the system runs thousands of internal simulations of future game states. It tests variations, discards losing lines, and selects the move with the highest win probability. This is internal simulation without external risk. When AlphaGo played Move 37 in Game 2—a move no human would have played—it was not a reflex but the result of search processes that evaluated the long-term consequences of a novel hypothesis internally before acting.

  The **Gregorian** grade presents the greatest complexity. Gregorian creatures are Popperian agents enhanced by culturally transmitted tools (language, math, artifacts). Lee Sedol is the paradigmatic Gregorian creature in this match. His cognition was extended by the language of Go (joseki, fuseki), the physical board, and the collective wisdom of centuries of human play. AlphaGo, however, occupies a liminal space. It is itself a Gregorian *artifact*—a tool built by human culture. Yet, its neural weights encode the statistical regularities of human culture (via the supervised learning on human games). In this sense, AlphaGo is a "crystallized" Gregorian resource. It does not *use* tools during the match; it *embodies* the tools. It functions as a Popperian agent fueled by Gregorian data.

  **Strains in the Mapping**

  This mapping reveals significant strains in Dennett's framework when applied to artificial agents. The first strain concerns the Popperian grade. Dennett's taxonomy implies a certain semantic depth to "hypotheses." While AlphaGo's MCTS functionally mimics hypothesis testing, it lacks the semantic understanding of *why* a move is good, only *that* it is statistically probable. Dennett typically sidesteps semantics in favor of competence, arguing that if it acts like a Popperian agent, it is one for all intentional purposes. However, AlphaGo's collapse in Game 4 after Lee's "divine move" (Move 78) suggests a fragility distinct from human Popperianism. When the board state fell outside its training distribution, its simulations failed to find a recovery path. A human Popperian agent might conceptualize the error and shift strategy; AlphaGo merely maximized probability within a broken model. It mimics the output of Popperian cognition without the flexible conceptual scaffolding that usually accompanies it in biological minds.

  The second strain involves the Gregorian classification. Dennett's framework assumes the Gregorian creature is the *user* of the tool. AlphaGo blurs the distinction between the user and the tool. It is a Gregorian product acting as a cognitive agent. If we classify AlphaGo as a Gregorian creature, we stretch the definition to include any system trained on cultural data. If we classify it merely as a tool, we ignore its autonomous decision-making capacity. The framework is silent on agents that are *made of* culture rather than simply *using* it. AlphaGo suggests that Gregorian tools can be internalized not just in biological brains, but in silicon, creating agents that are culturally constituted yet operationally distinct from their creators.

  **Evaluating the Framework**

  What does this episode reveal about Dennett's taxonomy? Primarily, it confirms the hierarchy as a functional account of cognitive *processes* rather than a strict biological timeline. The match demonstrates that these grades are modular. AlphaGo possessed Darwinian-selected architecture, Skinnerian-acquired weights, and Popperian search capabilities, all instantiated simultaneously in a non-biological substrate. This supports Dennett's view that higher grades do not replace lower ones but subsume them.

  However, the case reveals a gap regarding collective cognition. Dennett's Gregorian grade focuses on how tools extend individual cognition. AlphaGo represents a reversal: collective cognition (human Go history) distilled into an individual agent that surpasses the collective. The framework does not fully account for systems where the "cultural transmission" is a one-way download into a non-reproducing agent. Furthermore, the framework is silent on the *speed* and *scale* of these grades. AlphaGo's Popperian simulations occur at a speed and depth impossible for biological brains. This suggests that the grades are not just qualitative shifts but can be quantitatively expanded to create new forms of competence that biology cannot achieve.

  Ultimately, the Lee Sedol match validates Dennett's competency-based approach. We do not need to know if AlphaGo is "conscious" to identify its Popperian mechanisms. Yet, the episode also highlights a limitation: the taxonomy describes *how* competence is generated, but not the *robustness* of that competence across domains. AlphaGo was a Popperian genius in Go and a Darwinian infant in everything else. Biological Gregorian creatures are rarely so narrow. The framework successfully maps the machinery of the mind, but the AlphaGo episode reminds us that in artificial systems, that machinery can be disassembled and reassembled in ways evolution never intended, creating minds that are functionally Popperian but structurally alien.
