prompt: |-
  I'm on the research advisory subcommittee for my kid's school district (about 9,000 students), and I need to hand the board a short written opinion before Tuesday's vote. I've been reading the SSC/LessWrong corner of the internet for fifteen years, so I'm the one who volunteered to draft this, which was definately a mistake.

  The case: the district's accelerated math track admits by a single test. A group at the state university ran a twin analysis over district records and came back with the test score being roughly 65% heritable in this sample. One parent group wants that number in the public FAQ, on the grounds that it shows the admissions gap isn't something the district is doing wrong. The equity office wants us to never mention heritability at all, on the grounds that any such talk is a motte-and-bailey for nothing can be done here. The superintendent just wants the yelling to stop and asked our subcommitee to recommend what the district may and may not say.

  So: draft the opinion I'll circulate. I need a concrete recommendation (cite it, don't cite it, or cite it under conditions I can list), the reasoning behind it, an honest steelman of whichever side loses, and one paragraph short enough to read out loud at the meeting. No citations or reading list, I'll add those myself.

  Things I want you to actually dig into instead of giving me the standard heritability-isn't-destiny paragraph:

  - The 65% is a ratio of variances in one population at one time, and the population is our district in the environment we currently run, which includes the magnet program itself and the tutoring expansion we rolled out last year. So part of what that number reports is our own policy. Also: it says nothing at all about any single kid, and I want that said plainly.
  - Our analyst pointed out that if the district actually equalized the measured inputs, the estimate would probably go up, and she's worried people will read the higher number as genes mattering more now. I think that's the sharpest thing anyone has said in these meetings and it should be in the memo.
  - The twin design leans on the assumption that identical and fraternal twins get equally similar environments, and, this is the part I keep failing to explain to people, the environmental measures in these studies (parenting, peers, stressful life events) are themselves partly heritable, since kids help pick and shape their environments and share genes with the parents providing them. Which makes the clean genes-vs-environment split in our FAQ worse than wrong, it's incoherent.
  - One committee member wants us to report, instead of the 65%, the heritability of the change in scores across the tutoring rollout, or the heritability of the program's effect. Tell me whether that's a coherent quantity at all, and if it isn't, what we should be reporting instead.
  - The decision the board actually faces is what we do next year about admissions and tutoring. So I want the memo to say what the heritability figure would have to be informative about in order to bear on that decision, and then say whether it is.
  - For calibration: average height in rich countries went up by a lot over the last century while staying just about as heritable as ever. Use that however you want, or don't.

  The equity office's position should get its strongest form, not a strawman, I have to sit next to these people. And give me the two-sentence version of the bottom line I can use when someone accuses us of hiding science, because someone will.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a Research Advisory Subcommittee for a school district (~9,000 students).
      *   **Task:** Draft a short written opinion/recommendation for the School Board before a Tuesday vote.
      *   **Context:** Dispute over an accelerated math track admissions test. A university study found test scores are ~65% heritable in this district.
      *   **Conflict:** One parent group wants the 65% figure public (to absolve the district of blame for admissions gaps). The Equity Office wants it suppressed (fears it implies nothing can be done). The Superintendent wants the conflict resolved.
      *   **User Background:** Long-time reader of SSC/LessWrong (implies comfort with nuanced, rationalist-adjacent reasoning, Bayesian updates, steelmanning, avoiding motte-and-bailey, understanding $h^2$).
      *   **Specific Requirements:**
          *   Concrete recommendation (cite, don't cite, or conditional).
          *   Reasoning behind it.
          *   Honest steelman of the losing side.
          *   One paragraph short enough to read aloud.
          *   No citations/reading list (user will add).
          *   **Specific Technical Points to Address:**
              *   $h^2$ is variance ratio in *this* population/environment (includes current policies).
              *   $h^2$ says nothing about individuals.
              *   Analyst's point: Equalizing inputs might *raise* $h^2$, which could be misinterpreted.
              *   Twin design assumptions (EAAE) and gene-environment correlation (rGE) making the split incoherent.
              *   Evaluate the proposal to report heritability of *change* or *program effect* (is it coherent?).
              *   Decision relevance: What would $h^2$ need to inform to matter for next year's admissions/tutoring decisions?
              *   Calibration: Height example (heritable but malleable).
              *   Equity Office position must be steelmanned.
              *   Two-sentence bottom line for accusations of "hiding science."

  2.  **Determine the Recommendation:**
      *   *Option A (Cite it):* Risks misinterpretation by parents (genetic determinism) and validates the "nothing can be done" narrative. Violates Equity Office concerns.
      *   *Option B (Don't cite it):* Risks accusations of censorship/hiding science. Doesn't educate the public on *why* the number is misleading.
      *   *Option C (Cite under strict conditions/Contextualize heavily):* Best fit for a rationalist approach. Acknowledge the data exists but explain its limitations so thoroughly that citing the raw number without the explanation is forbidden.
      *   *Decision:* **Do not publish the 65% figure in the public FAQ.** Instead, publish a plain-language summary of the study's *limitations* regarding policy. Why? Because the technical nuance required to make the number useful cannot survive a FAQ format or public discourse without significant distortion. The risk of misuse outweighs the transparency benefit. *Correction:* Actually, a "conditional citation" is often more robust. Let's go with: **Do not cite the specific percentage in public-facing materials, but release a technical appendix for transparency.** This satisfies the "hiding science" accusation (it's available) while protecting the FAQ from reductionism.
      *   *Refinement:* The prompt asks for a recommendation on what the district *may and may not say*. The safest and most useful path for a school board FAQ is to **not cite the specific heritability estimate.** The reasoning is that the number is technically inert for the specific policy decisions at hand (admissions criteria) and highly prone to harmful misinterpretation.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Recommendation:** Clear and bold. Do not include the 65% figure in the public FAQ. Release a technical summary instead.
      *   **Reasoning (The "Meat"):**
          *   *Variance vs. Individual:* Address the "ratio of variances" point. It describes the current system, not potential.
          *   *The Analyst's Insight:* Include the point about equalizing inputs raising heritability. This is crucial for explaining why high $h^2$ doesn't mean "environment doesn't matter."
          *   *Gene-Environment Correlation:* Address the twin assumption and rGE. The split is incoherent in practice.
          *   *Decision Relevance:* Does this help decide admissions? No. Admissions is about *selection*, not *causation*. We need predictive validity, not etiological breakdown.
          *   *Height Analogy:* Use the height example to illustrate malleability despite heritability.
          *   *The "Heritability of Change" Proposal:* Address the committee member's idea. Is it coherent? $h^2$ of a *gain score* is possible but unstable and still suffers from the same interpretation issues. Better to report *effect sizes* of the tutoring directly.
      *   **Steelman of the Losing Side (Parent Group):** They want transparency and to stop the district from being blamed for structural gaps. They see the number as exonerating evidence. Acknowledge their desire for objective data to de-escalate blame.
      *   **Steelman of the Equity Office:** (Required by prompt). It's not just "hiding science." It's about preventing the reification of inequality. If people believe it's genetic, they stop advocating for resources. The "nothing can be done" motte-and-bailey is a real sociological risk, not just a logical fallacy.
      *   **Read-Aloud Paragraph:** Needs to be punchy, clear, and summarize the stance.
      *   **Two-Sentence Bottom Line:** For the "hiding science" accusation.

  4.  **Refining the Technical Arguments (Self-Correction during drafting):**
      *   *Heritability of Change:* Is it coherent? Yes, you can calculate $h^2$ for $\Delta$Score. But it's noisy. The prompt asks me to evaluate it. It's better to report the *average treatment effect* of the tutoring. $h^2$ of the effect tells you who benefits *differentially* based on genes, which is... ethically fraught and practically useless for universal tutoring policy. I should advise reporting the *efficacy* of the tutoring, not the heritability of the efficacy.
      *   *The "65%" context:* Emphasize that this includes the *current* tutoring and magnet program. It's a measure of the status quo's stratification, not a law of nature.
      *   *Tone:* Needs to be bureaucratic enough for a board memo but intellectually rigorous enough for the user (SSC/LW reader). Avoid condescension but avoid jargon without explanation.

  5.  **Final Review against Constraints:**
      *   Concrete recommendation? Yes.
      *   Reasoning? Yes.
      *   Steelman of loser? Yes (Parent group).
      *   Steelman of Equity? Yes (Integrated into reasoning/loss).
      *   Read-aloud paragraph? Yes.
      *   Two-sentence bottom line? Yes.
      *   Specific technical points covered (Variance ratio, Analyst's insight, rGE, Heritability of change, Decision relevance, Height analogy)? Yes.
      *   No citations? Yes.

  6.  **Drafting the Content (Mental or Scratchpad):**
      *   *Rec:* Don't put 65% in FAQ.
      *   *Why:* It's a status quo metric. High $h^2$ can coexist with high malleability (Height). Equalizing environment raises $h^2$ (Analyst point). rGE makes the split fuzzy.
      *   *Decision:* We need to know if the test predicts success (validity), not where the variance comes from (etiology).
      *   *Change Heritability:* Coherent but unhelpful. Report effect sizes instead.
      *   *Steelman Parents:* They want to stop the blame game.
      *   *Steelman Equity:* They know how the public interprets "genetic." It kills political will.
      *   *Read Aloud:* Keep it under 1 minute.
      *   *2-Sentence:* "We aren't hiding the study; we are protecting the public from a number that is scientifically robust but policy-irrelevant and easily weaponized. The data is available in the technical appendix, but the FAQ must focus on what we can change, not what we can't." (Need to tighten this).

  7.  **Final Polish:** Ensure the tone is appropriate for a school board memo (professional, decisive) while satisfying the user's specific intellectual requests. (The user is the one drafting, so I am writing *as* the user).

      *Wait, one nuance:* The prompt asks me to "draft the opinion I'll circulate." So I am writing the memo *for* the user to submit.
      *Constraint Check:* "The equity office's position should get its strongest form, not a strawman." I need to make sure I don't dismiss them as anti-science, but rather pro-social-stability.
      *Constraint Check:* "One committee member wants us to report... heritability of the change... Tell me whether that's a coherent quantity at all." I need to be explicit here. It is coherent statistically but practically misleading.

      *Let's assemble.*

      *(Self-Correction on the Recommendation)*: If I say "Don't cite it," the parents get mad. If I say "Cite it," Equity gets mad. The "Technical Appendix" compromise is the standard rationalist solution. It allows truth without amplification. I will recommend **excluding the specific percentage from the public FAQ but publishing the full technical report.**

      *(Refining the "Heritability of Change" bit)*: Is it coherent? Yes. Is it useful? No. It asks "how much of the *variation in improvement* is genetic." If high, it means tutoring works better for some genotypes. This leads to "personalized education" dreams but currently just complicates the message. Better to report "Tutoring raised scores by X points on average."

      *(Refining the Read Aloud)*: Needs to be very clear. "This number describes our current system, not human potential."

      *(Refining the 2-sentence defense)*: "Withholding a misleading statistic isn't hiding science; it's practicing responsible communication. The full study is public, but the FAQ is for actionable facts, not variance ratios."

      *Okay, ready to write.*
answer: |-
  **MEMORANDUM**

  **TO:** Research Advisory Subcommittee
  **FROM:** [Your Name]
  **DATE:** Monday, [Date]
  **SUBJECT:** Recommendation Regarding Publication of Heritability Estimates in Public FAQ

  **Recommendation**
  The Subcommittee recommends that the district **exclude the specific 65% heritability estimate from the public-facing FAQ.** Instead, we should publish the full technical study in an appendix and include a plain-language summary in the FAQ stating that while individual differences in math performance are influenced by a mix of factors, the district's policies directly impact overall achievement levels regardless of those factors.

  **Reasoning**
  The request to publish the 65% figure rests on a category error regarding what heritability ($h^2$) measures. This statistic is a ratio of variances specific to our district's current population and environment. It describes the status quo—including our current magnet program and last year's tutoring expansion—not a fixed biological limit. As our analyst noted, if we successfully equalize environmental inputs (e.g., high-quality tutoring for all), the heritability estimate would likely *rise*, because environmental variance would shrink. Publishing the current number risks the public interpreting a future rise as "genes mattering more," when it would actually signal environmental success.

  Furthermore, the clean split between "genes" and "environment" implied by the FAQ is incoherent in practice. Twin designs assume equal environments for identical and fraternal twins, but environmental measures (parenting, peers) are themselves partly heritable because children share genes with parents and actively shape their niches. Citing the 65% figure reifies this false dichotomy.

  Regarding the proposal to report the heritability of *score changes* or *program effects*: while statistically coherent, this is policy-irrelevant. It tells us whether genetic differences predict who benefits *more* from tutoring, but it does not tell us whether tutoring works on average. For policy decisions on admissions and tutoring, the board needs to know the *average treatment effect* of our interventions, not the genetic variance of that effect.

  Finally, we must consider decision relevance. To bear on next year's admissions policy, this figure would need to indicate whether the test measures potential that cannot be developed. It does not. As the height analogy demonstrates: height is highly heritable, yet average height increased by inches over the last century due to nutrition. High heritability is compatible with high malleability. The number does not help the board decide on admissions criteria; only predictive validity does.

  **Steelman of the Parent Group (The Losing Position)**
  The parent group advocating for publication is motivated by a desire for de-escalation and objective accountability. They view the heritability estimate as evidence that the admissions gap is not solely a product of district negligence or bias, but reflects pre-existing differences that the district did not create. Their intent is to stop the blame cycle and protect the district from accusations of systemic failure where none exists. They value transparency and trust that the community can handle nuanced data without resorting to determinism.

  **Steelman of the Equity Office**
  The Equity Office's opposition is not anti-science; it is a sociological risk assessment. They recognize that in public discourse, "heritable" is functionally synonymous with "immutable." Even with caveats, publishing this number provides rhetorical ammunition for those arguing that resource redistribution is futile. Their concern is that citing genetic variance will erode the political will required to fund the very environmental interventions (like tutoring) that the study implies are effective. They are prioritizing the conditions necessary for policy change over the conditions of pure informational transparency.

  **Statement for the Board Meeting (Read Aloud)**
  "This number describes the variance in our current system, not the potential of our students. High heritability does not mean immutability; height is highly heritable, yet nutrition still makes children taller. Publishing this percentage in a FAQ invites the false conclusion that we cannot improve outcomes through policy, when the data actually shows that improving our environment is the most effective lever we have. We will make the full study available, but the FAQ must focus on what we can change."

  **Response to Accusations of Hiding Science**
  "We are not hiding the science; the full report is public. We are refusing to amplify a statistic that is scientifically robust but easily weaponized to justify inaction."
