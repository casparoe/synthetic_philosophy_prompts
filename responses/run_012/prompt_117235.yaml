prompt: |-
  Second-year PhD student, decision theory / philosophy of econ. I've got a half-formed idea and I need it turned into a one-year fellowship proposal, three pages, by the end of the week.

  Nearly every explanation of Ellsberg starts by saying the second urn has an unknown proportion of red balls. But it isn't unknown, its unstated. The experimenter fixed it and chose not to tell you. I think that's doing far more work than anyone admits, and that a real chunk of what gets filed under ambiguity aversion is really aversion to having your payoff hinge on the unstated choice of an agent, not aversion to missing information as such. Strip the agent out -- same objective uncertainty, but the composition is fixed by a process nobody controls, or by an experimenter who is credibly indifferent or bound by a public rule -- and I'd predict the effect either shrinks or splits in two: a component about missing information, and a component about being on the receiving end of someone's discretion.

  Turn this into a proposal. I want the question stated so it actually has a determinate answer, some account of why the going explanations (the ones that say people just feel less competent about the second urn, or that they pessimistically weight the worst case, or that they're simply probabilistically incoherent) leave my version of the question open, the method -- I'd rather work through a few sharp cases than run subjects, but tell me if that's a mistake -- what the two components would have to look like to count as genuinely distinct, what result would kill the hunch, and whether a year is realistically enough. And tell me straight whether what I'm calling agent-aversion is just strategic uncertainty in a thin disguise, because if it is the whole thing collapses into game theory and I'd rather find that out now. I dont need citations, I'll add those myself.
