prompt: |-
  Alright, I want you to act as someone who's spent years thinking about bounded rationality and the philosophy of probability — like a decision theorist who actually cares alot about what finite agents can do, not just idealized Bayesians. Before you write anything, brainstorm out loud for a bit: dump every consideration that seems relevant, however rough, then organize it into the actual list. Also think carefully and go slow, because I have a feeling there's a trap in here somewhere.

  Context: I've read rationalist blogs for like a decade and one thing that keeps nagging at me is this. I'm a bounded agent. I can't tell whether some huge number is prime, or whether a hard open conjecture is true or false, and it really seems like I should be able to hold a partial belief about it — like 0.3 or whatever — the same way I hold partial beliefs about whether it'll rain tomorrow. But math claims aren't like weather. They're either true or false necessarily; there's no possible world where 2+2 is 5. So what the hell is my "0.3" even tracking? And yet it also seems dumb to say I'm certain of everything I haven't disproven yet...

  What I want from you is the spec. Write me the desiderata: what any adequate theory of credences over logical/mathematical claims has to be able to do to count as a real theory rather than hand-waving. I'm thinking of it as three buckets — the cases it has to get right, the distinctions it can't collapse, and the results it has to stay consistent with.

  Some things I suspect belong on the list, but you should judge them and add or argue as you see fit:
  - it should assign non-trivial credences (not 0, not 1) to claims nobody's proven yet, at least sometimes
  - updating: when someone actually shows me a proof, my credence should jump to 1 (or ~1); learning a disproof should send it to 0
  - logically equivalent statements: should I always give them the same credence? what about two statements that are equivalent but only via a proof I could never check in my lifetime?
  - coherence: should my credences obey the probability axioms, and if so, in what sense for a finite agent?
  - it should be computable / approximable by an actual bounded machine, not just defined as some function over an infinite space
  - it should converge toward the truth as I do more reasoning or gather more evidence
  - self-referential and Gödel-ish sentences — the "this sentence is not provable in system T" kind of thing — should get a sensible treatment, not crash the whole framework
  - resource-boundedness should show up somewhere, since the whole problem only exists because I'm finite

  For each item, give the motivating case or consideration behind it, and say which ones are non-negotiable and which are just preferences of one camp. Then the part I most want: flag any subset that can't be jointly satisfied. I have a hunch that "behave like probabilities / respect all the logical entailments" and "be computable and non-dogmatic about unproven stuff" are in genuine tension, but tell me whether that's a real no-go or I'm just confused. And tell me which single requirement does the most work at ruling out the naive candidates.

  Skip the bibliography, no reading list or citations — I just want the criteria, I'll go find the papers myself. A table is fine for the summary at the end. Keep the weight on the requirements and why each one is a requirement, rather than scoring any particular theory.
