prompt: |-
  Right, so my friend Priya and I spent about two hours shouting at each other last night about the lord/bondsman bit in the Phenomenology — the self-consciousness chapter, Herrschaft und Knechtschaft, the passage everyone calls the master–slave thing even though I'm pretty sure Hegel's word is Knecht and the "master–slave" phrasing is basically a French import. She reckons the bondsman comes out on top: the lord just sits there consuming, the bondsman is the one who gets educated by actually working on the world, so the servant ends up with real self-consciousness and the master is the one who's stuck. I think that's way too neat — the lord is dependent, sure, but I don't think anybody wins that scene, it just collapses into stoicism and scepticism and the unhappy consciousness, which is the whole point. We didn't resolve it and now I want to send her something that makes the point sideways instead of by arguing.

  So: write me a deadpan internal policy document — a section of a staff handbook, or an internal framework document, issued by the "People & Recognition Directorate" of some big generic company, that rolls out a formal Recognition Programme. Around 700 words, numbered clauses with little headings, and give it a short covering note at the top from whoever directs the directorate (sign it off, date it, that kind of thing). The comedy has to come entirely from the document being completely straight-faced about something that can't be administered.

  The jokes need to come from the actual moves in the chapter, not from vibes — recognition has to be freely given to count, so a clause that mandates it quietly undermines itself; the senior party's standing turns out to rest on the junior party's acknowledgement, which nobody in the document notices; labour as the thing that forms and educates the person doing it, filed under a development clause that doesn't get paid; something in there about a risk assessment for the initial confrontation, because obviously nobody wants an actual life-and-death struggle on the premises; and an escalation route that ends somewhere grey and miserable rather than in anybody being recognised. Don't invent dialectical claims Hegel doesn't make, and don't let the document accidentally resolve the thing in either Priya's direction or mine — if the programme fails, it should fail the way the chapter fails, not like a plot twist. A specialist should read it and think the author knows the text; someone who's never opened Hegel should still find it funny as a workplace document. Don't put any quotations from Hegel in it, and no citations — I don't want it to look like I'm citing the text at her. No winks, no narrator explaining the joke.

  Then, separately, after the document, give me a short note — clearly outside the document — on which bits of what I've asked for are just what the passage says, and which bits depend on a contested reading, e.g. whether the bondsman really comes out ahead, or whether the whole thing is about two people at all as opposed to one consciousness or the history of a society. I don't want one school of interpretation dressed up as the plain meaning of the text, because that's roughly what Priya did to me last night and I'm still annoyed about it.
