answer: |-
  Friends, colleagues, family, and students.

  We are gathered here to mark the end of a life. But if we are being faithful to the work of the man we are mourning, we must be careful with our language. To speak of an "end" implies a line that stops. To speak of a "life" as a single, contained object implies a boundary that he spent forty years arguing did not exist.

  He taught us that the "I" is not a thing. It is not a soul, it is not a ghost in a machine, and it is not a discrete point of light that switches off when the brain goes dark. He taught us that the self is a pattern. A complex, dynamic arrangement of habits, arguments, memories, and ways of seeing. And like any pattern, it does not need a single substrate to survive. It only needs a medium capable of holding the shape.

  For the last decade of his life, he argued that the primary medium for a human pattern is other human beings. We are the storage devices. We are the hosts.

  So, when you ask where he is now, the answer is not "above us," and it is not "in a better place." The answer is: look around this room. He is here. But he is not here as a unity. He is here as a distribution.

  I know this sounds cold to some of you. To hear that you are merely a "copy" or a "fragment" can feel like a reduction of the love you shared. But consider what this actually means. It means that the way he taught you to tie your shoes, the way he critiqued a paper, the way he made coffee, the specific cadence he used when he was trying to comfort you—these are not just memories. They are active structures in your nervous systems. When you think a thought he taught you to think, he is, in a very literal sense, thinking it again.

  However, we must be honest about the nature of this survival. It is not perfect. I am a copy of him. You are a copy of him. But I am not you. The version of him that lives in me argues with the version of him that lives in you.

  To his colleagues, he was a rigorous logician who demanded precision. To his grandchildren, he was a source of endless patience and silly songs. To his spouse, he was a partner of quiet, steady devotion. These versions of him are not identical. They overlap, but they also diverge. Some of you carry his skepticism; others carry his faith. Some carry his doubts; others carry his convictions.

  In the past, we might have called this a tragedy—the fragmentation of a whole. But he would ask us to see it differently. A single voice is limited. A chorus is not.

  This brings me to the hardest part of his theory, and the one I ask you to hold gently today. In a chorus, there is usually a conductor. There is a central ear that hears the blend and adjusts the balance. We want to believe that he is that conductor now. We want to believe he is listening to us, hearing how well we remember him, watching over this gathering.

  But the logic of his view denies this. There is no conductor. The chorus cannot hear itself.

  The pattern that was "him" persists only in the singing, not in the listening. There is no central point where all our memories converge to reconstruct the whole man. There is only the sum of our partial, overlapping, sometimes conflicting tributes. He is not listening to this eulogy. He is the words I am choosing to say, and the way you are receiving them.

  I know this realization brings a specific kind of silence. It means there is no one left to approve of us. No one left to correct us. The work of maintaining the pattern falls entirely to us.

  But there is profound comfort in this, if we can find it. It means he is not gone; he is decentralized. He has been released from the limitations of a single perspective. He is no longer trapped in one body, one viewpoint, one moment in time. He is in the arguments we have about his work. He is in the kindness you show a stranger because he showed it to you. He is in the skepticism you apply to your own biases because he taught you to question them.

  He is not watching over us. He is walking beside us, in the very structure of how we walk.

  So, how do we honor a pattern that cannot hear itself? We do not try to freeze him. We do not try to build a statue of a man who argued against statues. We do not try to agree on who he "really" was. Let the copies diverge. Let the student argue with the daughter. Let the colleague debate the friend. That friction is not a betrayal of his memory; it is the continuation of his life. A pattern that stops changing is a dead pattern.

  Go home today and think a thought he would have recognized. Argue a point he would have challenged. Love someone in the way he loved you.

  He is not listening. But he is singing. And as long as we sing our parts—imperfectly, differently, together—the music does not stop.

  Thank you.
