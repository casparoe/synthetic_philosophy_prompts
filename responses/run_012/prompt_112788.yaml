answer: |-
  1. Diagnosis
  Your reasoning rests on a fundamental category error: you treat the Original Position as a standard decision-theoretic problem where risk aversion is a subjective parameter within a welfarist framework. The false presupposition is that the disagreement between Rawls and utilitarians is merely about the *coefficient* of risk aversion regarding the distribution of utility. Rawls rejects welfarism itself; he prioritizes social primary goods over subjective utility and insists on the priority of right over the good. Utility functions assume goods are commensurable, allowing trade-offs Rawls forbids. Rawls argues for a discontinuous shift in rationality when basic liberties are at stake. The choice is not between high or low risk aversion, but between a moral conception of persons as ends versus means. Furthermore, he argues maximin is not chosen because the parties are psychologically risk-averse, but because the *structure* of the choice—specifically the gravity of the stakes and the non-repeatability of the social contract—makes any other rule irrational. By reducing the Difference Principle to a parameter in an optimization function, you overlook Rawls's claim that the principles of justice are constraints on permissible outcomes, not objectives to be maximized. The veil is not just epistemic uncertainty; it is a moral device to ensure impartiality, rendering standard expected-utility calculations inappropriate. You assume the parties are maximizing *their* good, whereas Rawls argues they are selecting principles that define *justice*. Consequently, viewing the Difference Principle as one point on a continuum of risk attitudes misidentifies the nature of the choice: it is a moral commitment to reciprocity, not a hedging strategy against bad luck.

  2. What Rawls actually claims
  Rawls constructs the Original Position not as a gamble, but as a thought experiment to model fair terms of cooperation among free and equal citizens. The Veil of Ignorance excludes knowledge of specific talents or social status to prevent bargaining advantage, not merely to create uncertainty. Rawls argues that Expected-Utility maximization is inappropriate here because it assumes probabilities can be assigned to social positions. He explicitly denies parties have any basis for probability estimates, rejecting the principle of insufficient reason often used to justify equal probabilities. Consequently, maximin is not a default for missing data but the only rational rule given three specific conditions: unknown probabilities, a guaranteeable minimum that is acceptable, and grave risks associated with other choices. In the Original Position, the stakes involve basic liberties and life prospects, satisfying the third condition. Furthermore, the Difference Principle is not standalone; it is lexically ordered after the Principle of Equal Liberty and Fair Equality of Opportunity. This lexical priority prevents trading liberties for economic gain, a trade-off utilitarianism permits. Rawls's core objection to utilitarianism is not that it is too risk-seeking, but that it conflates all persons into one aggregate chooser, violating the distinctness of persons. Utilitarianism extends the principle of choice for one person to society, suggesting sacrifices by some are justified by greater gains for others. Rawls denies this is valid; justice protects the inviolability of each individual. The parties are also subject to strains of commitment; they cannot agree to principles they cannot bear in reality. A utilitarian society might require some to accept lesser liberties for the greater good, which might exceed the strains of commitment. Thus, the Difference Principle expresses a conception of social cooperation where inequalities are only justified if they serve the least advantaged, ensuring stability and mutual respect, rather than merely serving as a safety net for the risk-averse. Rawls emphasizes that the parties are representing moral persons with two moral powers: a capacity for a sense of justice and a capacity for a conception of the good. The principles chosen must protect the development and exercise of these powers. This moral anthropology drives the choice of maximin, not a psychological preference for safety. The structure ensures that no one is sacrificed for the greater good. Finally, Rawls requires that principles be public and stable. Citizens must know they are treated fairly. Maximin supports this public assurance better than probabilistic averaging, which could justify hidden sacrifices. The choice is thus rooted in the requirements of a stable, well-ordered society, not merely individual risk calculation.

  3. What is settled and what is contested
  There is broad scholarly agreement that Rawls explicitly rejected the interpretation of the Difference Principle as merely expressing extreme risk aversion, particularly in his later work. He clarified that the parties are not motivated by psychological timidity but by the rational requirement to protect fundamental interests necessary for moral personality. Decision theorists, notably John Harsanyi, contest Rawls's rejection of expected utility. Harsanyi argued that even without specific data, one should assign equal probabilities to all positions, which mathematically yields average utilitarianism. This remains a live disagreement: whether the Veil of Ignorance implies equal probabilities or no probabilities. Additionally, while algorithmic fairness literature often models the Difference Principle as a maximin constraint for computational tractability, this is generally acknowledged as a formal simplification rather than a faithful exegesis of Rawls. Scholars agree that Rawls's theory is deontological and contractarian, whereas utilitarianism is consequentialist. However, there is ongoing debate about whether Rawls successfully demonstrates that maximin is uniquely rational in the Original Position or if he rigged the setup to produce his desired conclusion. Some critics argue the grave risk condition is stipulated rather than derived. The consensus is that Rawls intends a structural moral argument, but critics maintain it collapses into a decision-theoretic claim upon scrutiny. Physicists working on algorithmic fairness often adopt the decision-theoretic reading because it is mathematically tractable, but this diverges from Rawls's philosophical intent regarding the moral status of persons. The translation of Rawls into code often strips away the moral psychology and lexical priorities, leaving only the optimization constraint, which validates your intuition practically but not philosophically. This practical appropriation explains why your confusion arises: the technical literature treats Rawls as you do, but the philosophical consensus rejects that reading.

  4. Bottom line
  Your inference does not survive. You have categorized a deontological contractarian argument as a consequentialist optimization problem. The disagreement is not about risk aversion coefficients within a shared framework. Rawls argues treating society as a single utility maximizer is morally impermissible. The correct inference is that the Difference Principle is a constraint derived from the conception of citizens as free and equal, not a parameter chosen under uncertainty. Rawls seeks to define justice, not maximize welfare under risk. Therefore, the Difference Principle holds special authority not because it suits a specific risk profile, but because it alone respects the moral status of persons.
