  3.  **Explain Rawls's Actual Claims (Section 2):**
      *   *Veil of Ignorance (VoI):* Not just uncertainty, but a device to ensure impartiality. It filters out knowledge that would lead to bargaining advantage.
      *   *Original Position (OP):* A representation of fair conditions of agreement. It's not a gambling scenario.
