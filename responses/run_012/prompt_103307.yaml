answer: |-
  Your flatmate has constructed a classic instance of what is often called the 'fanaticism problem' in expected utility theory, dressed up in ecological clothing. He is correct that your intuition rebels against the conclusion, but he is incorrect that consistency demands you swallow it. The argument is valid in its internal logic, but it relies on a decision-theoretic framework that breaks down when applied to extreme uncertainties. You are not suffering from species prejudice; you are suffering from a correctly functioning alarm bell against a known paradox.

  Here is the diagnosis of where the argument slips, why it looked plausible, and how to repair the project of insect welfare without burning down the garden.

  ### The Specific Slip: The Inference from (5) to (6)

  The critical error lies in the move from premise (5) to conclusion (6). This step assumes that **expected moral value must be calculated using a linear, unbounded aggregation function.**

  Your flatmate's premise (1) suggests a linear relationship: if there is a 1% chance a being is sentient, it counts as 0.01 of a sentient being. When multiplied by the astronomical numbers in (2), the result dominates. This looks plausible because it mimics how we handle *risk* (e.g., a 1% chance of a car accident). However, it fails when handling *deep epistemic uncertainty* regarding the fundamental nature of reality (i.e., whether these entities have moral status at all).

  The slip is concealed by the phrase "same scale" in premise (5). Even if we grant that the *capacity* for suffering is of the same order (which is debatable), the *confidence* in that claim is not. By treating the probability $p$ as a simple multiplier, the argument assumes we can trade off low-confidence, high-stakes claims against high-confidence, lower-stakes claims without limit. This is the structure of 'Pascal's Mugging': if I claim I can save $10^{100}$ lives for £5, but the probability I am telling the truth is $10^{-90}$, linear expected value says you must pay me.

  Your flatmate admits this in (7)—that the logic extends to bacteria or arbitrary physical systems—but insists this is the "price of consistency." It is not. It is the price of a broken decision theory. If a theory tells you that you must prioritise hypothetical bacteria over actual humans, the theory is the variable that must change, not your moral ontology. Consistency does not require adhering to a formula when the formula yields absurdities; it requires adjusting the formula to match reflective equilibrium.

  ### The Secondary Slip: Equivocation in Premise (5)

  There is a further, subtler equivocation in premise (5): *"If the harm to one probably-sentient invertebrate is of the same order as the harm to one human..."*

  Premise (1) discounts the *status* of the being by probability $p$. But premise (5) assumes the *magnitude of the harm* (the disvalue of death or pain) is equivalent between a human and an invertebrate, *conditional on sentience*. This is a substantial axiological claim that is not licensed by the previous premises.

  Even if a nematode is sentient, its cognitive architecture, temporal horizon, and capacity for anticipation are vastly simpler than a human's. Most plausible theories of welfare suggest that the *badness* of death is proportional to the loss of future goods. A human loses decades of complex projects, relationships, and self-awareness. An invertebrate, even if sentient, likely loses moments of basic sensation. Therefore, the harm is not of the "same order." If the harm is, say, 1/10,000th that of a human, the astronomical numbers in (2) are immediately neutralised. Your flatmate smuggles in an egalitarian view of harm magnitude that is distinct from the probabilistic view of status in (1).

  ### Which Premise to Reject?

  You asked which premise is cheapest to lose. You wish to keep (1), (2), and (3). I advise you to keep them, but to qualify the **application** of (1).

  **Do not reject (1) entirely**, as you rightly note it is essential for moral uncertainty. Instead, reject the **linearity** of (1) in cases of extreme uncertainty.
  *   **The Cost:** You must adopt a decision theory that discounts low-probability, high-stakes claims. This is often done via a 'confidence weight' or by capping the influence of tail risks. You are saying: "I will weight beings by probability, but only when the probability is robustly grounded, not when it is speculative metaphysics."
  *   **The Benefit:** This blocks the Pascal's Mugging in (7) without requiring you to deny insect sentience. It allows you to say, "There is a non-negligible chance insects matter, but there is also a non-negligible chance my model of the universe is wrong, and I should not let speculative multiplication override known human needs."

  **Alternatively, reject the magnitude claim in (5).**
  *   **The Cost:** You must argue that insect suffering, while real, is significantly less weighty than human suffering, even per unit of time. This risks sliding into speciesism if not handled carefully.
  *   **The Benefit:** It preserves standard expected utility theory. You can still calculate $n \times p$, but you multiply by a 'harm magnitude' factor $h$, where $h_{insect} \ll h_{human}$.

  ### The Repair: What Becomes of Insect Welfare?

  If you make these repairs, does the project of taking insect sentience seriously collapse? No, but it changes from a **tyrannical demand** to a **significant constraint**.

  1.  **From Dominance to Weight:** Insect welfare does not *dominate* human interests (as per 6), but it does *weigh* against them. You cannot simply ignore the lawn. The argument successfully establishes that mowing is not morally neutral. It carries a cost.
  2.  **The Obligation of Mitigation:** If there is a probability of sentience, you are required to minimise harm *where cost to humans is low*. This might mean mowing less frequently, using higher blades to avoid chopping bodies, or avoiding pesticides. It does not require you to pave the garden with gravel (which, incidentally, creates its own heat-island and drainage harms, and likely kills invertebrates through desiccation just as effectively as mowing).
  3.  **Research Priority:** The argument successfully proves that reducing the uncertainty in (3) is one of the most morally valuable things one could do. Funding research into invertebrate neuroscience becomes a high priority, even if we don't ban mowing tomorrow.

  ### Summary for Your Flatmate

  You can tell him this: His argument is a *reductio ad absurdum* not of your position, but of unbounded expected utility maximisation. Premise (7) concedes that the logic leads to absurdity (bacteria worship). In philosophy, when a premise set leads to an absurdity, we reject the premise set, not our sanity.

  The slip is the assumption that **epistemic probabilities regarding moral status function identically to empirical probabilities regarding risk.** They do not. We are permitted to discount moral claims that rely on astronomical multipliers and fragile probabilities.

  You can keep the lawn. You can acknowledge the insects. You simply refuse to let a spreadsheet override the distinction between a plausible moral duty and a mathematical artefact.
