answer: |-
  ### 1. The Epistemicist Picture: Ignorance and the Sharp Cutoff

  For the epistemicist, the licensing board's situation is one of hidden precision. When a competent speaker looks at a borderline building and cannot tell whether it is safe, the epistemicist says this is a failure of knowledge, not a failure of reality. There is a fact of the matter. The building either falls into the extension of "safe" or it does not. The sentence "This building is safe" is strictly true or strictly false, governed by the Principle of Bivalence.

  The work done by the claim that there is a **sharp but unknowable cutoff** is to preserve classical logic and standard semantics. If the extension of "safe" were genuinely fuzzy—if a building could be partially in the set and partially out—then the logical laws governing sets and truth would break down. To avoid this, the epistemicist insists that the linguistic practices of the community, combined with the meanings of the words, *do* fix a specific point on the structural soundness scale where safety begins. It might be at 84.3% integrity, or 84.4%. We cannot know which.

  Why is it unknowable? The epistemicist argues that our concepts are sensitive to usage patterns that are too complex and unstable for us to track with perfect accuracy. There is a "margin for error" required for knowledge. To know a building is safe, your evidence must be strong enough that you couldn't easily be wrong. Near the boundary, your evidence is never strong enough to rule out the possibility that you are on the other side. Thus, the truth exists, but knowledge is impossible.

  You might ask: if there is a sharp cutoff, why call the predicate vague? Doesn't that make it precise? The epistemicist replies that vagueness is not a property of the *extension* (the set of safe buildings), but of our *epistemic relation* to that extension. A predicate is vague if its boundary is cognitively inaccessible and unstable across slightly different contexts of use. The sharpness is metaphysical; the vagueness is epistemological. In your licensing board case, even though the rule is written in vague terms and there are "no further facts" to consult, the epistemicist insists the facts *are* there, constituted by the total pattern of how the community applies the rule. The community is simply blind to them.

  ### 2. The Supervaluationist Picture: Gaps and Supertruth

  The supervaluationist rejects the epistemicist's hidden precision. They agree with the intuition that the vague rule simply does not determine a single cutoff. Instead, the rule allows for a range of **precisifications**. A precisification is a way of making the predicate precise that respects the clear cases. For example, any cutoff that classifies clearly crumbling buildings as "unsafe" and clearly sound buildings as "safe" is an admissible precisification. The borderline buildings are those that are classified as "safe" by some admissible precisifications and "unsafe" by others.

  This leads to a radical verdict on truth. For a borderline building, the sentence "This building is safe" is **neither true nor false**. It lacks a truth value because there is no single fact of the matter. However, the supervaluationist wants to save classical logic, specifically the Law of Excluded Middle ("Either the building is safe or it is not safe").

  They achieve this through the notion of **supertruth**. A sentence is supertrue if it is true on *all* admissible precisifications. Consider the disjunction: "The building is safe OR the building is not safe." On any given precisification, the cutoff is sharp. So, on precisification A, the building is safe (making the disjunction true). On precisification B, the building is not safe (making the disjunction true). Since the disjunction is true on every admissible way of sharpening the rule, it is supertrue.

  Thus, the supervaluationist maintains two seemingly conflicting verdicts simultaneously:
  1.  "The building is safe" is not true (because it fails on some precisifications).
  2.  "The building is safe or not safe" is true (because it succeeds on all precisifications).

  The notion of a precisification does the heavy lifting here. It allows the theorist to say that the *vagueness* lies in the semantic underdetermination of the predicate (there are many candidate extensions), while *truth* is defined as stability across all those candidates. This preserves logical validities (like $P \lor \neg P$) without forcing a sharp boundary in the world.

  ### 3. The Higher-Order Vagueness Problem

  The contrast deepens when we consider higher-order vagueness. In your licensing board scenario, there are clearly safe buildings, clearly unsafe buildings, and borderline buildings. But there are also buildings that are *borderline borderline*. It is unclear whether a building is merely safe or definitely safe.

  For the supervaluationist, "Definitely Safe" ($D$) means "Safe on all admissible precisifications." A building is **definitely safe** if it falls below the cutoff in every single admissible sharpening of the rule. It is **merely safe** (or borderline) if it falls below the cutoff in some precisifications but above it in others.

  The problem arises at the boundary of "Definitely." There must be a point where a building shifts from being safe on *all* precisifications to being safe on *only some*. This creates a new boundary: the boundary between the definitely safe and the not-definitely safe.
  *   **The Critic's Charge:** If you admit this boundary exists, haven't you just reintroduced a sharp cutoff? If there is a sharp line between "true on all precisifications" and "not true on all precisifications," then the supervaluationist model itself relies on precision. This looks like epistemicism in disguise: we just moved the ignorance from the first-order predicate ("safe") to the semantic predicate ("true on all precisifications").
  *   **The Regress:** If the supervaluationist denies the boundary is sharp and says *it* is vague, they need a new operator: "Definitely Definitely Safe." But then there will be a boundary between $DD$ and $\neg DD$. This threatens an infinite regress. The supervaluationist seems forced to admit a sharp boundary somewhere in the hierarchy of "definiteness."

  **The Supervaluationist Reply:** The supervaluationist typically bites the bullet and admits there is a sharp boundary in the *semantics*, but denies this translates to a sharp boundary in the *object language* that speakers can detect. They argue that the set of admissible precisifications is fixed by the semantics of the language, and set membership is always sharp. The vagueness remains because no *single* precisification is privileged. The sharpness is a feature of the model used to explain vagueness, not a feature of the world or the rule that speakers can exploit. They cannot say "Building $n$ is the last definitely safe one," because the predicate "definitely" is itself subject to the same semantic indeterminacy when used in ordinary discourse.

  ### 4. Disagreement in Use vs. Theory

  Do these views actually disagree on anything a competent speaker or the licensing board would do? In terms of practical verdicts on borderline cases, they converge remarkably.
  *   **Epistemicist:** "The building is safe" is true (or false), but you don't know which. Therefore, you should not assert it, and the board should not rely on it for a license.
  *   **Supervaluationist:** "The building is safe" is neither true nor false. Therefore, it is not supertrue, and you should not assert it.

  Both advise agnosticism and caution. Both validate classical logic for most practical reasoning. The dispute is primarily metaphysical and semantic: Is there a fact of the matter (Epistemicism) or is the world/language genuinely indeterminate (Supervaluationism)?

  However, the dispute is not merely terminological. It generates divergent predictions in specific logical and normative contexts:

  1.  **Logical Inference:** Supervaluationism invalidates certain classical inference rules, such as Contraposition or Conditional Proof, when dealing with vague predicates. For example, from "If $P$ then $Q$" and "Not $Q$," you can infer "Not $P$" classically. But in supervaluationism, if $P$ is borderline and $Q$ is false, the conditional might fail to be supertrue even if the inference holds in every precisification. Epistemicism preserves all classical rules. If the licensing board uses automated logic to process rules, the epistemicist system might validate a deduction the supervaluationist system rejects.
  2.  **Norms of Assertion:** The explanation for *why* you shouldn't call a borderline building "safe" differs. The epistemicist says you violate the norm of knowledge (asserting what you don't know). The supervaluationist says you violate the norm of truth (asserting what isn't true). This matters for liability. If a board member classifies a borderline building as safe and it collapses:
      *   The **Epistemicist** must say the member made a false statement (if it turned out unsafe) or a true one (if safe), but was negligent in claiming knowledge.
      *   The **Supervaluationist** can say the member made a statement that lacked truth value, and thus was categorically inappropriate to assert, regardless of the physical outcome.
  3.  **The Nature of the Law:** In your case, the rule is the law. The epistemicist implies the law *has* a determinate answer that the judges are failing to find. The supervaluationist implies the law *runs out* and grants discretion. This changes the political philosophy of the board: are they discovering rights or creating policy?

  The fault line is this: The epistemicist saves logic by positing hidden facts; the supervaluationist saves the intuition of indeterminacy by modifying the definition of truth. They agree on the surface behavior of speakers, but they tell incompatible stories about why that behavior is correct and what logical machinery underpins it.
