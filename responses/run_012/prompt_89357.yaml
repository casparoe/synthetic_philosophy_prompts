  Your idea (#6) is not definitely new—it's a sharpening of the "Argument from Indexical Information"—but it is a rigorous improvement on #4. However, #6 subsumes #4 completely: if a BB can fluctuate with a false history (#4's failure), it can also fluctuate with the specific cognitive state of reading this text. In an infinite spacetime without a solution to #1 (Measure Problem), the ratio of "BBs having this exact thought" to "Real physicists having this exact thought" remains undefined or infinite/infinite. #6 feels right intuitively, but it cannot do the heavy lifting without first solving the measure problem.
