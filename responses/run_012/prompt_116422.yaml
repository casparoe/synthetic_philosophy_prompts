answer: |-
  You have constructed a set of intuitions that align closely with a specific strand of **Analytic Marxism** (reminiscent of the work of G.A. Cohen or John Roemer), which seeks to disentangle the normative core of Marx's concepts from their 19th-century sociological packaging. Your discomfort arises because you are trying to hold together a *structural* definition of exploitation (surplus appropriation) with a *normative* definition (unjust domination), while also distinguishing between *market dependence* and *managerial subordination*.

  To capture your verdicts precisely, you need to decouple **Exploitation** from mere surplus appropriation and tie it to **Capital Accumulation**, and decouple **Alienation** from market dependence and tie it to **Managerial Authority**.

  Here is the spare principle set that captures your verdicts, followed by the necessary sacrifice and the predictions for your new cases.

  ### The Principles

  **1. The Principle of Capitalist Exploitation**
  Exploitation obtains when a producer is separated from the means of production and performs surplus labor that is appropriated by a distinct class of owners **for the purpose of private capital accumulation** (profit), rather than for social reproduction or institutional mission.
  *   *Function:* This distinguishes the Surgeon (for-profit surplus) from the Professor (public mission surplus) and the Garment Worker (profit) from the Co-op Member (collective surplus). It defines exploitation not just by the *existence* of a surplus, but by the *teleology* of that surplus (M-C-M' vs. public expenditure).

  **2. The Principle of Managerial Alienation**
  Alienation obtains when the immediate labor process is governed by a **specific external will** (a manager, owner, or algorithm) to which the producer must submit without democratic recourse, as opposed to the **impersonal forces of market exchange** (price signals, demand shifts) which the producer navigates using their own judgment.
  *   *Function:* This distinguishes the Driver (algorithmic command) from the Potter (market weather) and the Garment Worker (pace-setting machine) from the Surgeon (professional autonomy). It locates alienation in *heteronomy* (being ruled by another) within the labor process, not in the mere fact of selling into a market.

  ---

  ### Application to Your Cases

  1.  **Garment Worker:** Separated from means; surplus taken for profit (**Exploited**). Subject to pace/design control by owner (**Alienated**).
  2.  **Co-op Member:** Owns means; surplus voted on collectively (**Not Exploited**). Democratic control over process (**Not Alienated**).
  3.  **Surgeon:** Separated from means (hospital equipment); surplus taken for shareholder profit (**Exploited**). High autonomy over medical decisions; no managerial interference in the act of surgery (**Not Alienated**).
  4.  **Professor:** Separated from means (university); surplus reinvested in public mission, not private accumulation (**Not Exploited**). High autonomy over research/teaching (**Not Alienated**).
  5.  **Gig Driver:** Owns car, but... *(See The Sacrifice below)*. Algorithm dictates route/price/acceptance (**Alienated**).
  6.  **Potter:** Owns means; keeps surplus (**Not Exploited**). Responds to market prices, not a boss's orders (**Not Alienated**).

  ---

  ### The Necessary Sacrifice

  To maintain a spare and theoretically robust principle, you must overturn one verdict: **The Gig Driver is Exploited.**

  **Why:** Your current verdict (Not Exploited, Alienated) creates a theoretical fissure. You argue the Driver is alienated because the algorithm acts as a "boss." But in Marxian theory, a "boss" who directs labor and appropriates a portion of the value produced (the commission/fee) is, by definition, an exploiter.
  *   **The Correction:** The "Means of Production" in the gig economy is not the car; it is the **Platform** (the app, the customer network, the pricing algorithm). The driver owns a *tool* (the car), but is separated from the *means of access* to the market. The platform fee is not a neutral service charge; it is rent extracted from surplus value generated by the driver's labor.
  *   **The Gain:** This unifies your intuition about the algorithm. If the algorithm is a "boss" (causing alienation), it represents a capital relation (causing exploitation). It prevents the awkward position of claiming a worker is subordinated to a capitalist authority but somehow not economically exploited by them.

  **Revised Driver Verdict:** **Exploited** + **Alienated**.

  ---

  ### Predictions for New Cases

  **1. The Worker Cooperative with Hired Employees**
  *   *Scenario:* A co-op of members hires non-member wage laborers at the going rate.
  *   *Prediction:* **Exploited** and **Alienated**.
  *   *Reasoning:* Relative to the *hired employees*, the co-op members function as the capitalist class. They own the means, they appropriate the surplus generated by the hires (to distribute among themselves), and they likely retain managerial authority over the hires. This captures the Marxian critique that co-ops can remain capitalist firms if they employ wage labor.

  **2. The Dependent Craftsperson (Monopsony)**
  *   *Scenario:* A potter who owns her kiln but has only one buyer (a large firm) that sets the price.
  *   *Prediction:* **Not Exploited**, but **Alienated** (conditionally).
  *   *Reasoning:*
      *   *Exploitation:* She owns the physical means of production and sells a *commodity* (the pot), not her *labor power*. The firm appropriates profit from reselling the pot, but does not directly appropriate surplus labor time from her in the wage relation. She is a petty bourgeois squeezed by monopoly power, not a proletarian.
      *   *Alienation:* This depends on the contract. If the firm sets only the *price*, she is subject to market forces (Not Alienated). If the firm dictates the *design, materials, or production schedule* (as many "craft" platforms do), she is subject to an external will (**Alienated**). This distinguishes *market coercion* from *labor subsumption*.

  ### Summary of the Trade-off

  You gain a coherent distinction between **Capitalist Exploitation** (profit-driven surplus appropriation) and **Public Surplus** (mission-driven reinvestment), which saves your Professor verdict without exempting all non-profits (a corrupt non-profit acting for private gain would count as exploitation under Principle 1).

  You also gain a coherent distinction between **Managerial Control** (Alienation) and **Market Dependence** (Not Alienation), which saves your Potter/Driver distinction.

  The cost is admitting that the Gig Driver is exploited. This is theoretically cheaper than inventing a category of "Alienated but Not Exploited" wage-like labor, and it aligns better with the "Algorithm as Boss" intuition you already hold. It forces you to recognize that in the digital economy, owning the car is not enough to be independent; one must own the *access* to the market.
