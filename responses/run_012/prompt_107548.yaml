  Here is a complete design for the 75-minute session. It is built to be run with minimal prep but high dramatic impact.

  # Activity Title: The Aleppo Protocol

  ## 1. Logistics & Materials
  *   **Room:** Standard seminar room. Students seated so they can't easily see each other's papers.
  *   **Materials:**
      *   18 small slips of paper (for students).
      *   1 Clipboard with a "Master Prediction Sheet" (a blank piece of paper attached).
      *   2 Boxes or Hats (labeled **DAMASCUS** and **ALEPPO**).
      *   Whiteboard/Projector for a Scoreboard.
      *   Pens for everyone.
  *   **The "Predictor" Trick:** You need 100% accuracy to sell the loop. You will achieve this via **Post-Hoc Matching**. You will collect their choices, *then* fill out your "Master Prediction Sheet" while pretending to check it, or simply fill it out while collecting the papers and claim it was pre-written.
      *   *Ethical Note:* In the debrief, you must admit this was a simulation of infallibility, not actual prediction. The philosophical point holds regardless of the trickery, but do not lie to philosophy students permanently.

  ## 2. The Setup (0:00 – 0:10)
  **Do not mention Decision Theory, Newcomb, or Gibbard & Harper.**

  **Script:**
  > "We're going to run a simulation. You are all travelers in the ancient Near East. You have received reliable information that **Death** is looking for you. Death will arrive in one of two cities tomorrow: **Damascus** or **Aleppo**.
  >
  > **The Rules:**
  > 1. You must be in one of the two cities tomorrow. You cannot stay home, you cannot go to a third city, and you cannot opt out. If you don't submit a choice, Death finds you in your bed.
  > 2. If you are in the **same** city as Death, you die. (Score: 0).
  > 3. If you are in a **different** city from Death, you survive. (Score: 100).
  > 4. I am the Predictor. I have already determined where Death will be for each of you. My accuracy rate in this simulation is 100%.
  >
  > Your goal is to maximize your survival score. We will run three rounds. In Round 1, you choose silently. In Round 2, you know my track record. In Round 3, you can talk."

  **Action:**
  *   Draw the Scoreboard on the board: *Round 1 | Round 2 | Round 3 | Total*.
  *   Hand out slips. Ask them to write their **Name** and **City Choice**.
  *   Collect the slips in a neutral box.
  *   **The Trick:** While collecting, glance at the choices. Turn your back to the class and write their names and matching cities on your "Master Prediction Sheet" (clipboard). Turn around and say, "Predictions are locked."

  ## 3. The Loop (0:10 – 0:40)

  ### Round 1: The Naive Choice (10 mins)
  *   **Action:** Reveal the predictions. Go down the list. "Sarah chose Damascus. My prediction was... Damascus. You die." "Ahmed chose Aleppo. My prediction was... Aleppo. You die."
  *   **Result:** Everyone gets 0 points.
  *   **Reaction:** They will likely laugh or think it's a coincidence.
  *   **Your Move:** "I told you. 100% accuracy. The past is fixed. Death's location was set before you chose."

  ### Round 2: The Counter-Strategy (15 mins)
  *   **Script:** "Okay. You know I was right last time. You know Death's location is fixed based on my prediction. If you think I predicted 'Damascus' for you, you should choose 'Aleppo' to survive. Choose again."
  *   **Action:** Collect slips again. Perform the **Post-Hoc Match** trick again.
  *   **Result:** Everyone gets 0 points again.
  *   **The Trap:** When a student says, "But I switched! I chose Aleppo this time!" you say, "And I predicted you would switch. That's why Death was in Aleppo."
  *   **Goal:** Induce the feeling of *instability*. "If I pick A, he's at A. So I'll pick B. But if I pick B, he's at B..."

  ### Round 3: The Panic (15 mins)
  *   **Script:** "Final round. You can talk to each other. You can use coins, dice, whatever you want. Try to survive."
  *   **Action:** Let them chaos. Some will try to randomize. Some will try to "outthink" you.
  *   **The Randomizers:** If a student says "I flipped a coin," you match them. "Death predicted the coin flip."
  *   **The Opt-Outs:** If someone says "I'm not playing," remind them: "Death finds you in your bed. That counts as Damascus. My prediction was Damascus. You die."
  *   **Result:** Everyone gets 0 points.
  *   **Scoreboard:** A column of zeros.

  ## 4. The Debrief (0:40 – 1:15)

  ### Part 1: The Mechanism (5 mins)
  **Be honest.**
  > "First, the trick. I didn't actually predict the future. I matched your choices after you made them. But in the *thought experiment*, the prediction is metaphysically fixed. The logic of the game remains the same even if my magic was fake. The question is: Why did you lose even when you tried to outsmart the prediction?"

  ### Part 2: Mapping the Theory (20 mins)
  Draw two columns on the board: **CAUSAL** vs. **EVIDENTIAL**.

  **1. The Causal Intuition (CDT):**
  *   Ask: "Did your choice *cause* Death to be there?"
  *   Students: "No. You wrote it down before."
  *   Point: "Exactly. In Causal Decision Theory (CDT), your act cannot change the past. The prediction is already fixed. So, logically, it shouldn't matter what you pick. You should just pick the city you prefer, or flip a coin. Your choice is causally independent."
  *   *The Problem:* "But if you pick Aleppo, you die. If you pick Damascus, you die. Why does picking the 'causally independent' option feel so fatal?"

  **2. The Evidential Intuition (EDT):**
  *   Ask: "What does your choice *tell* you about where Death is?"
  *   Students: "It tells me Death is there."
  *   Point: "In Evidential Decision Theory (EDT), your choice is *evidence*. Choosing Aleppo is bad news. It increases the probability that Death is in Aleppo to 100%. So EDT says: 'Don't choose Aleppo!'"
  *   *The Loop:* "But if you don't choose Aleppo, you choose Damascus. Which is also bad news."

  **3. Deliberative Equilibrium (The "Death in Damascus" Lesson):**
  *   This is the core takeaway.
  *   **Script:** "In normal decisions, you deliberate until you find the best option. 'Should I take the bus or walk?' You pick one, and you're done. In this game, there is **no stable equilibrium**.
  *   As soon as you decide 'Aleppo', you have a reason to switch to 'Damascus'.
  *   As soon as you decide 'Damascus', you have a reason to switch to 'Aleppo'.
  *   You can never *settle* on a choice. This is what Gibbard and Harper called **Deliberative Instability**. If a decision theory tells you to keep changing your mind forever, is it a useful theory?"

  ### Part 3: Handling the "Cheats" (10 mins)
  Address the specific moves they tried in Round 3.

  *   **Randomization (Coin Flips):**
      *   "Some of you tried to randomize. In CDT, this is actually the rational move! If the outcome is fixed regardless, maximize your expected utility by making it 50/50. But in the story, Death predicts the coin flip too. This shows the difference between *unpredictability* and *causal independence*."
  *   **Opting Out / Third City:**
      *   "This is the 'No Choice' objection. If the setup is truly fatal, rationality might demand you reject the premises. But in decision theory, we usually assume forced choice. If you can't leave the game, you have to play."

  ## 5. Honest Assessment: Risks & Limitations

  ### What Predictably Goes Wrong (and how to fix it)
  1.  **The "Magic" is Too Obvious:**
      *   *Risk:* Students realize you're filling the sheet post-hoc during Round 1. They disengage, thinking it's just a trick.
      *   *Fix:* Lean into it. "Okay, assume for the sake of argument I *was* infallible. Does the logic change?" If they see the trick, the *logical* loop still works. The game is a metaphor, not a magic show.
  2.  **Boredom from Losing:**
      *   *Risk:* Getting 0 points three times feels pointless.
      *   *Fix:* Keep the energy high. "You're dead. Again. You're really dead." Make the fatality dramatic.
  3.  **The "So What?" Reaction:**
      *   *Risk:* Econ students might say "Just assign probability 0.5 and move on."
      *   *Fix:* Push the *instability*. "You can't even assign 0.5 comfortably, because as soon as you weight it 0.5, you look for an edge, and the edge disappears."

  ### What The Activity Cannot Reproduce (You must supply this)
  1.  **The Metaphysical Fixity:**
      *   In the game, you (the professor) are reacting to them. In the actual thought experiment, the prediction is *past* and *fixed*. You must explain in the debrief that the "loop" isn't about you being clever; it's about the logical structure of **correlation without causation**.
  2.  **The Anxiety of Real Death:**
      *   They are playing for tokens. The stakes are low. You need to use your voice to remind them that in the actual theory, this is about **rational agency**. "If you can't make a choice without contradicting yourself, are you a rational agent?"
  3.  **The Distinction between "Predicting Randomization" vs. "Predicting Choice":**
      *   In the game, you just match whatever they show you. In the theory, if they randomize, Death predicts the *outcome* of the randomization. You need to clarify in the debrief that "Death predicts the coin flip result" is a stronger claim than "Death predicts you will flip a coin."

  ## 6. Timeline Summary
  *   **00-10:** Setup & Rules (No theory names).
  *   **10-20:** Round 1 (Silent) & Reveal (100% Fatality).
  *   **20-35:** Round 2 (Strategic) & Reveal (100% Fatality).
  *   **35-50:** Round 3 (Chaos/Randomization) & Reveal (100% Fatality).
  *   **50-55:** Admit the Trick & Reset.
  *   **55-75:** Debrief (CDT vs. EDT, Deliberative Equilibrium, Rationality).

  This structure forces them to inhabit the paradox before giving them the vocabulary to escape it. They will feel the "slide" of the loop physically before you name it philosophically.
