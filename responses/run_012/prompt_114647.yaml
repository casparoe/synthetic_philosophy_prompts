answer: |-
  This is a superb pedagogical challenge. You are asking participants to experience *mereological anxiety*—the specific unease that arises when our intuitive ontology clashes with our criteria for identity—without giving them the vocabulary to dismiss it as "just semantics" too early.

  Your background in ecology is a distinct advantage here. You know that nature rarely respects the discrete boundaries human language imposes. The following design leverages that. It treats the session not as a class, but as a **Deliberative Tribunal**. The participants are not students; they are jurors tasked with establishing the "Law of Objects."

  ### Activity Title: The Tribunal of Wholes

  **Objective:** To force participants to commit to a criterion for composition, reveal that no single criterion covers all intuitions, and expose the cost of maintaining consistency.
  **Group Size:** 16 participants.
  **Duration:** 90 minutes.
  **Materials:**
  1.  **The Spectrum Board:** A long whiteboard or butcher paper taped to the wall. A horizontal line is drawn. The left end is labeled "Just Parts," the right end "A Single Thing."
  2.  **Voting Tokens:** 16 magnetic discs or sticky notes (two colors: Green for "Yes, a single thing," Red for "No, just parts").
  3.  **Case Cards:** 10 cards, each describing or depicting a specific assembly (see *The Sequence* below).
  4.  **The Ledger:** A sheet of paper for each participant titled "Ontological Debt."
  5.  **Physical Props:** Two pebbles, a tube of glue, a photograph of a welded joint, a photograph of a boulder split and cemented.

  ---

  ### The Rules of the Tribunal
  1.  **No Jargon:** Words like "mereology," "universalism," "nihilism," or "ontology" are banned until the final 10 minutes.
  2.  **No Abstaining:** You must place a token for every case.
  3.  **Public Commitment:** Tokens are placed on the Spectrum Board where everyone can see.
  4.  **The Debt:** If you vote in a way that contradicts a previous vote *given the reason you stated earlier*, you incur a mark of "Ontological Debt" on your ledger.
  5.  **The Payoff:** There is no prize for being "right." The "award" at the end is the **Certificate of Ontological Honesty**, given to those who acknowledge their debt rather than hiding it.

  ---

  ### Minute-by-Minute Timeline

  #### 0:00 – 0:10 | Setup and Induction
  *   **Action:** Arrange the room in a U-shape facing the Spectrum Board.
  *   **Script:** "We are not here to learn what philosophers say. We are here to decide what exists. I will present you with assemblies of matter. Your task is to rule: Is there *one thing* here, or only *many things* arranged that way? You must vote. You must give a reason. If your reasons contradict, you will know it."
  *   **Handout:** Distribute the "Ontological Debt" ledgers. Explain that a mark is not a failure, but a record of complexity.

  #### 0:10 – 0:35 | Round 1: The Physical Spectrum (Inert Matter)
  *   **Method:** Present cases physically or via simple projection. Ask for a vote. Ask one "Yes" and one "No" voter for their *criterion* (e.g., "They are touching," "They are bonded"). Write the criterion on the board.
  *   **The Sequence:**
      1.  **Two pebbles resting against each other.** (Expect: No).
      2.  **Two pebbles glued together.** (Expect: Split).
      3.  **Two pebbles fused by natural heat (geological weld).** (Expect: Yes).
      4.  **A pile of salt.** (Expect: Split – is a 'heap' a thing?).
      5.  **A boulder split by frost, then cemented back together perfectly.** (The User's Case).
  *   **Facilitator Move:** If the group agrees on a criterion (e.g., "Physical Bonding"), point out Case 5. The bond is artificial, the history is broken. Does the history matter? Force them to adjust the criterion.

  #### 0:35 – 0:50 | Round 2: The Living & Dynamic (Biological Assemblies)
  *   **Method:** Use your ecological expertise here. Speak to the *function* of the assembly.
  *   **The Sequence:**
      6.  **A swarm of midges moving as a unit.** (Expect: No, but moves as one).
      7.  **A coral colony (polyps sharing calcium structure).** (Expect: Yes, but is it one animal?).
      8.  **Siamese twins (conjoined organisms sharing circulation).** (The Grafted Case).
      9.  **A human with a pacemaker and artificial joints.** (Expect: Yes, but parts are manufactured).
  *   **Facilitator Move:** Watch for "Life" becoming the hidden criterion. If they say "Living things are objects, non-living aren't," challenge them with the coral (which is colonial) vs. the swarm (which is collective).

  #### 0:50 – 1:05 | Round 3: The Selective Pressure Test (The Ecologist's Criterion)
  *   **Action:** Introduce your specific seed idea.
  *   **Script:** "I propose a new law for this Tribunal. Things compose a further thing if, and only if, they are jointly subject to a single selective pressure. They share one evolutionary fate. If one dies, the 'whole' fails to reproduce."
  *   **The Test Cases:**
      10. **A clone grove of Aspen trees (one root system, many trunks).** (Fits criterion? Yes).
      11. **A symbiotic pair (e.g., algae inside coral) that cannot survive apart.** (Do they compose one thing?)
      12. **A culture of bacteria in a petri dish.** (They share fate, but are they one object?)
  *   **Discussion:** Ask: "If this law is true, is composition a matter of *now* (arrangement) or *then* (history)?"
  *   **Debt Check:** Ask participants to check their ledgers. Did you vote 'Yes' to the glued pebbles (no evolutionary fate) but 'Yes' to the coral (evolutionary fate)? Mark your debt.

  #### 1:05 – 1:20 | The Reckoning (Scoring and Contradiction)
  *   **Action:** Stop the voting. Turn to the Spectrum Board.
  *   **Visual:** The board will show a messy scatter of Green and Red tokens. There will be no clear line where "No" becomes "Yes."
  *   **Task:** Ask the group to draft a single sentence that explains the pattern of Green tokens.
  *   **Predictable Failure:** They will write a rule (e.g., "If it functions as a unit"). You will immediately point to a case where they voted Red that fits the rule (e.g., the Swarm).
  *   **The Point:** "You cannot draw the line without cutting through a case you feel strongly about. This is the Special Composition Question."

  #### 1:20 – 1:30 | Debrief and Naming
  *   **Action:** Now you may use the philosophical terms.
  *   **Mapping:**
      *   *The Failed Boundary:* Explain that this is the **Sorites Paradox** applied to existence. Physics doesn't tell us where the object begins; we do.
      *   *The Grafted Pair/Swarm:* Explain this as the tension between **Functionalism** (what it does) and **Constitution** (what it's made of).
      *   *The Split Boulder:* Explain this as the problem of **Historical Essentialism** vs. **Presentism**.
      *   *The Extreme Votes:* If anyone voted "Yes" to everything (Universalism) or "No" to everything (Nihilism), acknowledge them. They are the only ones with zero Debt, but the highest cost to common sense.
  *   **Closing:** "You felt discomfort today. That discomfort is not a failure of the exercise. It is the sound of your ontology rubbing against the world."

  ---

  ### Predictable Pitfalls & Facilitator Interventions

  **1. The "It's Just Words" Objection**
  *   *The Scenario:* A participant says, "This is silly. An 'object' is just a label we stick on things. There's no deep truth here."
  *   *The Risk:* This dissolves the tension immediately.
  *   *Your Intervention:* Do not argue metaphysics. Argue consequences. "If it is just words, then I can call this swarm of midges 'The President' and it is true by convention. But if I shoot one midge, have I injured 'The President'? If you say 'no', then you admit the word tracks something real about the arrangement. We are testing what that 'something' is."

  **2. Anchoring on Life (Vitalism)**
  *   *The Scenario:* Participants refuse to compare pebbles to organisms. "Living things are obviously objects; rocks aren't."
  *   *The Risk:* They compartmentalize the problem and miss the universal SCQ.
  *   *Your Intervention:* Use your ecologist authority. "I have spent thirty years watching salt marshes. I have seen pebbles cemented by bacteria into reefs that live, grow, and die. I have seen trees that are genetically one organism but physically twenty trunks. Nature does not respect your boundary between 'alive' and 'object.' If composition depends on life, define 'life' without using the word 'thing'."

  **3. The Democratic Vote**
  *   *The Scenario:* The group gets stuck on a case and says, "Let's just majority rule it."
  *   *The Risk:* They think ontology is a popularity contest.
  *   *Your Intervention:* "Democracy decides laws. It does not decide existence. If 16 of us vote that this pile of sand is a 'statue,' and I kick it, did I destroy a statue or scatter sand? Your vote changes the law, not the world. We are asking about the world."

  **4. The "Universalist" Escape**
  *   *The Scenario:* One clever participant realizes that if they vote "Yes" to *everything* (even scattered pebbles), they are logically consistent.
  *   *The Risk:* They "win" the game by trivializing it.
  *   *Your Intervention:* Acknowledge the logic. "You have adopted Universalism. It is a valid philosophical position. But it means that 'You' and 'This Chair' are parts of a single object called 'You-Chair.' Does that match your experience of reality? You have consistency, but you have lost the world you live in."

  ---

  ### The Limit: What You Must Supply

  You asked for frankness about where the activity stops and you must take over.

  **The Activity Cannot Reproduce: The Stakes of Existence.**
  The game generates *logical* inconsistency (Debt). It cannot generate *ontological* weight. Participants will feel like they are playing a classification game. They will not feel the terror of the Nihilist position (that *nothing* exists except simples) or the vertigo of the Universalist position (that *everything* is one thing).

  **Your Role in the Debrief:**
  You must translate their "Debt" into "Loss."
  *   *Say this:* "When you marked your ledger, you felt a mild annoyance. But consider what that mark means. It means that for some of these cases, you cannot say what exists without contradicting yourself. If you cannot say what exists, you cannot say what is real. If you cannot say what is real, you cannot say what matters. The discomfort you felt was the sensation of the ground moving under your feet. I cannot make the floor shake in a seminar room. I can only show you the cracks."

  **The Ecologist's Closing:**
  Use your specific background to seal the seriousness.
  *   *Say this:* "In the marsh, I learned that a 'system' is not a thing you find; it is a boundary you draw to ask a question. But if you draw the boundary wrong, the system dies, and the marsh dies with it. Philosophy is the same. How we compose the world determines how we are responsible for it. If the coral and the algae are one thing, we protect them together. If they are two, we might save one and kill the other. The Special Composition Question is not a puzzle. It is a map of our responsibility."

  ### Summary of Payoff
  *   **No Money:** The currency is "Ontological Honesty."
  *   **Scoring:** The participant with the most "Debt" who can best explain *why* the contradiction is unavoidable wins the "Certificate." This rewards insight over consistency.
  *   **Takeaway:** They leave knowing that "common sense" is a patchwork of incompatible criteria, and that choosing a metaphysics is choosing a cost.

  This design respects your participants' intelligence, utilizes your specific ecological insight (the selective pressure criterion is a fantastic, underused angle in introductory mereology), and keeps the philosophical heavy lifting for the debrief where it belongs.
