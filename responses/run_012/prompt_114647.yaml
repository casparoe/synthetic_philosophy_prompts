prompt: |-
  I am a retired field ecologist — thirty years of salt-marsh and estuary work — who has, since retiring, been sitting in on and now co-facilitating an adult-education philosophy seminar at our local university's continuing-studies programme. The group is about sixteen people, mixed backgrounds and no formal training, one ninety-minute session a week, and I have been handed the session on what I have learned to call the special composition question: under what conditions, if any, do some things together make up a further thing. I have read enough to know the usual landmarks — that one may say composition always occurs, never occurs, or occurs only under some restriction — but I have no interest in staging a lecture in which those three options are set out and compared. I want the participants to arrive at the problem on their own feet, and to feel the particular discomfort of finding that their own verdicts, given honestly, commit them to something they did not consciously choose. Please design a runnable ninety-minute activity for this group that does that, and give me the rules, the materials, a minute-by-minute timeline, and a payoff or scoring scheme that needs no real money.

  My rough idea, which you should feel free to discard or rebuild, is a kind of census or tribunal. Stage a scene — a table of objects, a projected photograph, or the room itself will do — and present the group with a sequence of assemblies, one at a time, each of which they must rule on with a token or a raised card: is there a single further thing here, or only the parts arranged this way? Let the sequence run from two pebbles merely resting against each other, through a heap, a glued pair, a welded pair, a pair joined by a living tendril, a swarm that moves as one, a vortex, and a colony, and have them mark on a shared board where the yes begins. The point of the staging is that they will not be able to place a non-arbitrary boundary, and that their earlier answers will have silently bound them to some criterion they never named. Then introduce the cases that pull candidate criteria apart: a pair of distinct organisms surgically grafted so that they share one circulation, alive and integrated but not one organism; a swarm that behaves as a unit yet has no life of its own; a boulder split and cemented back together. And seed one criterion I have not seen anyone use and would like the group to test, namely that some things compose a further thing when the parts are jointly subject to a single selective pressure — when they share one evolutionary fate rather than merely sitting in one place — and ask them whether that criterion, if adopted, would make composition a matter of the parts' history rather than of how they are arranged right now. I would keep the name of the problem and the names of the standard positions out of the room until the very end.

  In the debrief, map the moments of the activity onto the parts of the idea: the failed boundary onto the thought that nothing in physics or observation tells us where composition begins; the grafted pair and the swarm onto the pull of a restrictivist criterion and the cost of choosing one; the split boulder onto the pressure that any restriction short of always or never forces us to draw a sharp line we cannot locate, which is what drives some people to the extremes. Include what will predictably go wrong the first time I run it — someone will insist the whole question is merely verbal and about our counting conventions, a couple of participants will anchor hard on the living cases and refuse to move off them, and the group will try to settle matters by majority vote or by fiat — together with how I should handle each without short-circuiting the exercise. Finally, be frank about which feature of the idea the activity cannot reproduce and that I, as facilitator, will have to supply in words: I suspect no amount of staging can reproduce the felt seriousness of asking whether a thing exists, as opposed to asking how we find it convenient to count, and I would like to be told plainly where the exercise stops and I must take over.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Retired field ecologist (30 years salt-marsh/estuary work), co-facilitator of an adult-ed philosophy seminar (16 participants, mixed backgrounds, no formal training).
      *   **Topic:** The Special Composition Question (SCQ) - Under what conditions do some things compose a further thing?
      *   **Goal:** Design a 90-minute activity. No lectures on standard positions (Universalism, Nihilism, Restrictivism) until the end. Participants must *feel* the problem, discover their own commitments, and experience the discomfort of arbitrary boundaries.
      *   **User's Idea:** A "census or tribunal" using a sequence of assemblies (pebbles, heaps, glued, welded, living, swarm, etc.). Mark where "Yes" begins. Introduce edge cases (grafted organisms, split boulder). Test a specific criterion: "joint subject to a single selective pressure" (evolutionary fate).
      *   **Requirements:** Rules, materials, minute-by-minute timeline, payoff/scoring scheme (no money), handling predictable pitfalls (verbal dismissal, anchoring on life, majority vote), and frank admission of what the activity *cannot* do (ontological seriousness).
      *   **Tone:** Respectful of the user's expertise (ecologist), practical, pedagogical, philosophically rigorous but accessible.

  2.  **Deconstruct the Philosophical Problem (SCQ):**
      *   *The Core Tension:* Common sense says some things are objects (chairs, organisms) and some are just collections (scattered atoms, random piles). But drawing a line is hard.
      *   *The Sorites/Vagueness Issue:* If two touching pebbles aren't an object, what about glued? Welded? At what point does contact become composition?
      *   *The Ontological Stakes:* Are we talking about reality or language? (Mereological essentialism vs. conceptualism).
      *   *The User's Specific Twist:* Evolutionary fate/selective pressure as a criterion for composition. This is brilliant for an ecologist to facilitate.

  3.  **Develop the Activity Concept:**
      *   *Name:* "The Tribunal of Wholes" or "The Composition Census." Let's go with "The Tribunal of Wholes."
      *   *Mechanism:* Voting/Token placement on a spectrum.
      *   *Materials:* Physical props are better than photos for presence. A long table. A "Spectrum Board." Tokens (red/green or Yes/No).
      *   *Scoring:* Needs to be non-monetary but engaging. "Consistency Points" or "Ontological Debt." Let's use "Ontological Debt" – every time you contradict yourself, you incur debt. The goal is to minimize debt, but it's impossible.

  4.  **Drafting the Timeline (90 Minutes):**
      *   *0-10:* Intro & Setup (No jargon).
      *   *10-35:* Round 1: The Physical Spectrum (Pebbles to Welded).
      *   *35-50:* Round 2: The Living & Dynamic (Swarm, Colony, Graft).
      *   *50-65:* The Trap: The "Selective Pressure" Criterion.
      *   *65-80:* The Reckoning (Scoring & Contradictions).
      *   *80-90:* Debrief & Naming (Connecting to Philosophy).

  5.  **Refining the Cases (The "Staging"):**
      *   Need a progression that challenges contact, bonding, function, and history.
      *   *Case 1:* Two pebbles touching. (Intuition: No).
      *   *Case 2:* Two pebbles glued. (Intuition: Maybe/No).
      *   *Case 3:* Two pebbles fused by heat (natural). (Intuition: Yes).
      *   *Case 4:* A pile of salt. (Intuition: No/Yes depending on 'heap').
      *   *Case 5:* A swarm of midges. (Intuition: No, but moves as one).
      *   *Case 6:* A coral colony. (Intuition: Yes, but is it one or many?).
      *   *Case 7:* Siamese twins (grafted humans/animals). (Intuition: Two minds, one body?).
      *   *Case 8:* The Split Boulder (User's idea).
      *   *Case 9:* The Evolutionary Unit (User's idea).

  6.  **Addressing the "Payoff/Scoring":**
      *   Since there's no money, use social capital or intellectual honesty.
      *   *Idea:* "The Ledger of Commitment." Each participant has a card. When their vote contradicts a previous vote *given the same principle*, they mark a tally.
      *   *Better Idea:* The group collectively tries to write a "Law of Composition." Every time a case breaks the law, they must rewrite it. The "score" is how many rewrites it takes. (This might be too complex for 16 people).
      *   *Best Idea:* "Ontological Debt." Participants track their own inconsistencies. The "winner" is the one who can best articulate *why* they accepted the debt. It shifts focus from being right to being aware.

  7.  **Handling Predictable Pitfalls:**
      *   *"It's just words":* Acknowledge, but ask "If it's just words, why does it feel like we're discovering something?"
      *   *"Life is special":* Push back with the coral/swarm distinction.
      *   *"Let's Vote":* Remind them democracy doesn't dictate ontology.
      *   *Facilitator Role:* You must be the "Court Clerk," not the Judge.

  8.  **Addressing the "Ontological Seriousness" Limitation:**
      *   The activity creates *logical* tension. It cannot create *metaphysical* weight. The facilitator must articulate that the discomfort they feel *is* the philosophical problem. The activity simulates the *structure* of the problem, not the *gravity* of existence.

  9.  **Review against Constraints:**
      *   90 minutes? Yes.
      *   16 people? Yes.
      *   No jargon until end? Yes.
      *   User's specific criteria (selective pressure)? Included.
      *   Ecologist background leveraged? Yes, in the biological cases.

  10. **Final Polish:**
      *   Ensure the tone matches the user's (experienced, thoughtful, practical).
      *   Make sure the "Selective Pressure" test is clear.
      *   Refine the "Debrief" to map exactly as requested (failed boundary, grafted pair, split boulder).

  *(Self-Correction during drafting)*: I initially thought about using physical props for everything. But a "swarm" or "selective pressure" can't be prop-ed. I need to use cards with descriptions/images for the abstract cases. I will suggest a hybrid: physical props for the simple ones (pebbles), cards/projector for the complex ones.

  *(Refining the Scoring)*: A "Consistency Ledger" is good. Each person gets a sheet. They record their vote. When a contradiction is highlighted, they mark it. The "Payoff" is the "Certificate of Ontological Honesty" for those who admit the contradiction rather than hide it.

  *(Refining the "Selective Pressure" Criterion)*: This needs to be introduced carefully. It shouldn't be presented as "The Answer," but as "A Proposed Law."

  *(Final check on the "What goes wrong" section)*: Need to be specific about the facilitator's intervention lines.

  *(Final check on the "What you must supply" section)*: Be very clear that the activity generates *puzzle*, the facilitator generates *stakes*.

