prompt: |-
  Most discussions of the norm of assertion take for granted that a single individual both holds the relevant epistemic state and performs the speech act: the question is framed as what that one speaker must know, believe, or have warrant for, in order for the assertion to be licensed. I would like a careful explanation of a conceptual issue that this individualistic framing tends to hide.

  Take what might be called delegated or proxy assertion. A spokesperson, press officer, or ministerial representative publicly asserts a proposition on behalf of an institution. The institution's information is distributed across many people, files, and procedures, so that the institution may count as knowing the proposition in a recognizable epistemic sense, while the person at the podium neither knows nor believes it — she has been instructed to say it and has reason to trust the internal process that produced it. The reverse can also occur: the individual may have strong evidence for the proposition while the institution's official line is the opposite.

  Explain what is genuinely at stake in deciding whether the familiar candidate norms — knowledge, truth, belief, justification — attach to the individual speaker or to the asserting entity, and why the choice is not merely a relabeling. In doing so, address three things. First, whether a knowledge norm even has a determinate application once the knowing subject and the asserting subject come apart, and what would fix the relevant subject. Second, what proxy assertion reveals about whether such norms evaluate the act or the agent — the utterance or the utterer — and whether that distinction is stable. Third, how the phenomenon bears on the common assumption that assertion is governed by one unified norm, rather than by several norms that may be satisfied by different bearers. Reason from the structure of the cases rather than from any particular author's position, and do not spend the answer cataloguing who has defended which view.
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

  1.  **Deconstruct the Prompt:**

      *   **Core Topic:** The norm of assertion (what makes an assertion proper/allowed).
      *   **Standard View:** Individualistic (Speaker = Knower/Believer).
      *   **Problem Case:** Delegated/Proxy Assertion (Speaker $\neq$ Epistemic Source/Institution).
      *   **Task:** Explain the conceptual issue hidden by the individualistic framing.
      *   **Specific Requirements:**
          1.  Address whether a knowledge norm has determinate application when subjects come apart (who is the relevant subject?).
          2.  Address what this reveals about evaluating the *act* vs. the *agent* (utterance vs. utterer) and the stability of that distinction.
          3.  Address the assumption of a *unified* norm vs. *multiple* norms satisfied by different bearers.
      *   **Constraint:** Reason from the structure of the cases, not specific author positions/cataloguing.

  2.  **Initial Brainstorming & Conceptual Mapping:**

      *   *Standard Norms:* Knowledge Norm (KN), Truth Norm (TN), Belief Norm (BN), Justification Norm (JN). Usually framed as "S must $\phi$ to assert $p$."
      *   *Proxy Case:* Spokesperson (S) asserts $p$ for Institution (I).
      *   *Scenario A:* I knows $p$, S does not (S trusts I).
      *   *Scenario B:* S knows $p$, I denies $p$ (S goes rogue or is silenced).
      *   *The "Hidden Issue":* The standard view conflates the *locutionary source* (voice) with the *epistemic source* (ground). When they separate, we see that "assertion" might be a composite speech act involving division of labor.
      *   *Requirement 1 (Subject):* If the norm is "One must know $p$ to assert $p$," who is the "One"? If it's S, proxy assertion is often improper (S doesn't know). If it's I, then assertion isn't essentially tied to the voice. This challenges the idea that assertion is a first-personal commitment.
      *   *Requirement 2 (Act vs. Agent):* Is the norm about the *quality of the utterance* (it represents knowledge) or the *state of the utterer* (they possess knowledge)? In proxy cases, the utterance represents institutional knowledge, but the utterer lacks it. If we blame S for lying when they read a true script they don't believe, we are judging the agent. If we judge the assertion as "correct" because the content is known by I, we are judging the act/output.
      *   *Requirement 3 (Unified vs. Multiple):* Maybe there isn't *one* norm. Maybe there's a norm of *transmission* (for S) and a norm of *generation* (for I). Or maybe "assertion" splits into "voicing" and "endorsing."

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Acknowledge the standard individualistic framing (Williamson-style "One must: assert $p$ only if one knows $p$"). Introduce the proxy case as a stress test that fractures the unity of the speaker.

      *   **Point 1: The Determinacy of the Subject (Who must know?):**
          *   Standard view: Speaker = Subject.
          *   Proxy view: Speaker is a conduit. Institution is the epistemic agent.
          *   Problem: If the norm is knowledge, and S doesn't know, is the assertion improper?
          *   Intuition: It seems *proper* for a press secretary to read a true briefing they haven't verified.
          *   Implication: If proper, the "One" in the norm cannot be the individual speaker. It must be the institution.
          *   Conceptual Shift: This turns assertion from a personal commitment into a systemic output. It challenges the idea that assertion essentially involves *personal* warrant. If the subject is the institution, how does the institution "assert"? Through a mouthpiece. This makes the speech act *relational* rather than monadic.

      *   **Point 2: Act vs. Agent (Utterance vs. Utterer):**
          *   Distinction: Evaluating the *move* (was this a valid move in the language game?) vs. the *player* (did this player cheat?).
          *   In individual cases, these coincide. If I assert without knowledge, I violate the norm (agent fault) and the assertion is improper (act fault).
          *   In proxy cases, they come apart. S asserts without knowledge.
          *   If we say the assertion is *correct* (because I knows), we are evaluating the Act/Content relation.
          *   If we say S is *blameless* (because S trusted I), we are evaluating the Agent's diligence.
          *   Instability: This suggests the "Norm of Assertion" might actually be two norms: one governing the *production* of content (epistemic grounding) and one governing the *release* of content (authority to speak). The distinction between act and agent blurs because the "act" is distributed.

      *   **Point 3: Unified vs. Multiple Norms:**
          *   Standard assumption: One norm rules all assertions (e.g., Knowledge).
          *   Proxy revelation: Different roles satisfy different conditions.
          *   The Institution satisfies the *epistemic* condition (Knowledge/Truth).
          *   The Spokesperson satisfies the *deontic/authority* condition (Permission to speak).
          *   Conclusion: "Assertion" might not be a primitive singular act. It might be a composite of *warranting* and *voicing*.
          *   If we insist on a unified norm, we have to stretch the definition of "speaker" to include collectives, which changes the metaphysics of assertion. If we allow multiple norms, we admit that "assertion" covers different kinds of speech acts (personal testimony vs. official bulletin).

      *   **Synthesis/Conclusion:**
          *   Summarize the stakes. It's not just semantics. It's about whether assertion is fundamentally a manifestation of individual mind or a social tool for information transfer.
          *   The individualistic framing hides the *division of epistemic labor*.
          *   Final thought: The norm might not be "Know $p$ to assert $p$" but rather "Ensure $p$ is known (by someone authorized) to assert $p$."

