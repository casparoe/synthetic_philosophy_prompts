answer: |-
  The standard individualistic framing of the norm of assertion presupposes a unity of agency: the person whose voice produces the sound is the same entity whose mind supplies the warrant. This framing treats assertion as a direct externalization of an internal epistemic state. The phenomenon of delegated or proxy assertion fractures this unity. It reveals that the speech act of assertion can be functionally divided between an *epistemic source* (the entity that grounds the truth/warrant) and a *locutionary source* (the entity that physically utters the proposition).

  This separation is not merely a complication for existing theories; it exposes a conceptual ambiguity in what the norm of assertion is actually regulating. If the norm is "One must know $p$ to assert $p$," the proxy case forces us to ask whether the norm is designed to regulate the flow of information in a community or the integrity of an individual's cognitive commitment. The stakes involve the metaphysics of the speech act, the target of normative evaluation, and the unity of the norm itself.

  ### 1. The Determinacy of the Subject: Who is the "One"?

  The first conceptual issue concerns the subject of the norm. In standard discussions, the variable "S" in the norm "S must $\phi$ to assert $p$" is transparently the individual speaker. However, in proxy assertion, we encounter a gap between the *utterer* and the *knower*.

  Consider a press secretary reading a statement prepared by intelligence agencies. The intelligence community possesses the evidence and warrants the claim (they know $p$); the secretary possesses only the authority to speak and trust in the process (they do not know $p$). If the knowledge norm is strict and individualistic, the secretary's assertion is improper. They are asserting what they do not know. Yet, intuitively, such assertions are often considered perfectly proper, even paradigmatic instances of official communication. Conversely, if a scientist knows $p$ based on private data but is forbidden by their institution from asserting it, the individual satisfies the epistemic condition but violates the deontic condition of their role.

  This creates a dilemma for the determinacy of the norm. If we insist the subject must be the individual utterer, we must classify vast swathes of ordinary, legitimate institutional communication as norm-violating. This suggests the individualistic framing is descriptively inadequate for how assertion functions in complex social structures. If, however, we shift the subject to the institution, we alter the nature of the speech act. An institution cannot speak without a mouthpiece, but if the norm attaches to the institution, the mouthpiece is reduced to a causal mechanism, like a telegraph or a loudspeaker.

  The choice here is not mere relabeling because it determines whether assertion is essentially a *personal commitment* or a *systemic output*. If the subject is the institution, the norm is no longer about aligning one's speech with one's own mind, but about aligning speech with the epistemic status of a collective. This fixes the relevant subject not by biology or psychology, but by *authority*. The "One" who must know is the entity that bears the responsibility for the truth of the claim. This implies that the norm of assertion is not anchored in the phenomenology of the speaker, but in the social architecture of accountability. The subject is fixed by whoever is liable if the assertion turns out to be false. In proxy cases, the secretary is rarely liable for the truth; the institution is. Therefore, the norm attaches to the institution. This renders the "individual speaker" conceptually secondary in these contexts, challenging the view that assertion is fundamentally a first-personal act.

  ### 2. Act vs. Agent: Evaluating the Utterance or the Utterer

  The proxy case destabilizes the distinction between evaluating the speech act (the utterance) and evaluating the speaker (the agent). In individualistic cases, these evaluations typically converge: if an individual asserts without knowledge, the act is improper and the agent is criticizable. In proxy cases, they diverge.

  When a spokesperson asserts a proposition they do not personally know, based on institutional warrant, we face a split evaluation. The *utterance* may be epistemically sound (it tracks the truth/knowledge of the institution), while the *utterer* is epistemically empty (they lack personal warrant). If the norm of assertion evaluates the **act**, the assertion is licensed because the proposition is backed by knowledge (somewhere in the chain). If the norm evaluates the **agent**, the assertion is unlicensed because the specific human performing the act lacks the required state.

  This divergence reveals that the "norm of assertion" may actually be conflating two different normative standards: a standard of **fidelity** (does this utterance represent the world accurately/warrantedly?) and a standard of **sincerity/authority** (is this speaker entitled to commit themselves to this claim?).

  In the proxy scenario, the spokesperson satisfies the standard of fidelity (via the institution) but arguably fails a strict standard of sincerity (they do not personally believe/know). Yet, we do not typically accuse them of lying. This suggests that in institutional contexts, the norm evaluates the *channel* of information rather than the *psychology* of the node transmitting it.

  However, this distinction is unstable. If the spokesperson privately knows the statement is false but reads it anyway, we condemn them. Here, the individual's epistemic state matters again. This implies that the norm is not exclusively attached to the institution nor exclusively to the individual, but operates on a **threshold of override**. The individual agent is normatively bound to ensure the institutional warrant is not visibly compromised.

  Consequently, proxy assertion shows that the norm cannot simply target the "utterance" in isolation from the "utterer," nor the "utterer" in isolation from their role. It targets the **relationship** between the two. The norm is violated not just when knowledge is absent, but when the link between the epistemic source and the locutionary source is broken or deceptive. This complicates the act/agent distinction: the "act" of assertion in proxy cases is a composite of the institution's warranting and the individual's voicing. Evaluating one without the other yields incomplete normative judgments.

  ### 3. Unified Norm vs. Multiple Norms

  Finally, the phenomenon bears heavily on the assumption that assertion is governed by a single, unified norm (e.g., "Assert only what you know"). The individualistic framing supports this unity because the speaker, knower, and assessor are identical. The proxy case suggests that "assertion" may be an umbrella term for distinct speech acts that satisfy different normative conditions depending on the distribution of epistemic labor.

  If we insist on a unified norm, we must stretch the concepts of "knowledge" or "belief" to cover collective states transmitted through agents who lack those states. This risks diluting the normative force of the concepts. If a spokesperson "knows" $p$ only in the sense that their institution knows it, then "knowledge" ceases to be a cognitive state of the speaker and becomes a status of the message.

  Alternatively, we may acknowledge that there are **multiple norms** satisfied by different bearers. There is a *generative norm* governing the production of the content (satisfied by the institution/researchers) and a *transmissive norm* governing the release of the content (satisfied by the spokesperson).
  *   The generative norm requires truth, evidence, or knowledge.
  *   The transmissive norm requires authorization, accuracy in transmission, and lack of known defeaters.

  Under this view, the spokesperson does not violate the norm of assertion when they assert what they don't know, provided they satisfy the transmissive norm. The violation would only occur if they transmitted without authorization or despite knowing the generative process was flawed.

  This fragmentation challenges the idea that there is a single "game of assertion" with one rule. Instead, there may be a family of assertion-like acts. Personal testimony is governed by a norm of personal warrant (I assert because I know). Official representation is governed by a norm of delegated authority (I assert because I am empowered to voice what is known).

  The stakes here are significant for epistemology. If assertion is governed by multiple norms, then the function of assertion is not uniform. In the individual case, assertion functions to share personal cognitive achievements. In the proxy case, assertion functions to broadcast systemic conclusions. If we force a unified norm onto these distinct practices, we obscure the different ways in which speech acts connect us to the truth. The individualistic framing hides this by assuming all assertion is testimony. Proxy assertion reveals that much of our public discourse is not testimony, but **bulletin**.

  ### Conclusion

  The conceptual issue hidden by the individualistic framing is the **division of epistemic labor**. By assuming the speaker is the knower, standard discussions treat assertion as a monolithic transfer of mental states. The proxy case demonstrates that assertion is often a transfer of *status* rather than *state*.

  Deciding whether norms attach to the individual or the entity is not relabeling because it determines whether the norm is a constraint on *conscience* (do not speak what you do not believe) or a constraint on *system integrity* (do not voice what is not warranted). It reveals that the evaluation of assertion must account for the stability of the link between the act and the agent, which is not fixed but role-dependent. Finally, it suggests that the search for a single unified norm may be a category error, as the conditions for proper assertion shift depending on whether the speaker is functioning as a principal or an agent. The norm of assertion, therefore, may not be a rule about what a speaker must know, but a rule about how warrant must be connected to voice, whether by identity or by authorized delegation.
