prompt: |-
  I help run a small supported-housing charity — I'm the vice chair of the board, not an academic, I just did a night class in philosophy years ago and it's left me with enough knowledge to be annoying at meetings. Whenever something bad happens to one of our tenants (someone dies of an overdose after we missed a couple of welfare checks, a fella falls down a stairwell we'd been meaning to fix the light in) we have to do one of these "learning reviews," and we always get stuck on the same thing: did we cause this, or did it just happen while we weren't doing anything? Someone says well if we'd done X it wouldn't have happened, and then someone else says you could say that about anything, if we'd done Y or Z instead it also wouldn't have happened, and then the meeting dissolves and we write "lessons learned" and go home. I've realised this is a real topic with a name — causation by omission — so what I want is a procedure my committee can actually run on a case, not a lecture. Something like: the questions to ask in order, what counts as a good enough answer to each, where the thing stops with a no, and where it has to hand the decision to a person because the question has turned into a question about what we owed the tenant rather than about what happened. It has to be honest about the trap where "it wouldn't have happened without us doing nothing" lets in basically everything we've ever failed to do, and about the way whether skipping something even registers as a cause seems to depend on whether anyone expected us to do it in the first place (and on who those people are, and whether we ever said we'd do it). It should also handle the case where we did do something and the case where two different things we failed to do would each have been enough on their own, and where we acted but the harm still came through something else. I need to be able to run it in an afternoon with four trustees who aren't philosophers, and I need it to say plainly which steps are just judgement calls wearing a lab coat.

  Then please run it on two of our actual-ish cases. First: a tenant with a known history dies of an overdose after we missed two scheduled welfare checks. Second, and this is the one I'm worried about: a tenant died during a cold snap and we had never applied for a grant that would have paid for a night warden, which we had said in our annual report we were going to apply for; I think we're basically blameless there and I suspect the procedure will disagree with me, so if it does, say so straight and tell me why, don't soften it.

  And at the end, tell me where the whole thing is most likely to be wrong — which consideration, if it turned out to be the real story, would flip the verdict on either case, and what would make you say the procedure itself was the problem rather than the case. I'd rather have a procedure with a visible seam than a tidy one that quietly hides the bit where we're just deciding what kind of charity we want to be.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Vice Chair of a small supported-housing charity board. Not an academic, but philosophically literate enough to know terms like "causation by omission."
      *   **Problem:** Board meetings get stuck in endless loops during "learning reviews" after tenant tragedies (overdose, accident). They debate causation vs. correlation/negligence without resolution.
      *   **Need:** A practical, step-by-step procedure (algorithm/checklist) to run in an afternoon with 4 non-philosopher trustees.
      *   **Requirements:**
          *   Must address "causation by omission" (did doing nothing cause it?).
          *   Must avoid the "infinite regress" trap (if we'd done *anything*, it wouldn't have happened).
          *   Must handle expectations/duty (did we say we'd do it?).
          *   Must handle overdetermination (two failures, either would have caused it) and intervening acts (we acted, but harm came another way).
          *   Must identify where judgement calls are happening ("judgement calls wearing a lab coat").
          *   Must apply to two specific cases:
              1.  Missed welfare checks -> Overdose death.
              2.  Didn't apply for grant for night warden (despite saying we would) -> Cold snap death. (User thinks they are blameless; wants honest assessment if procedure says otherwise).
          *   Must end with a critique of the procedure itself (where it's most likely wrong, what would flip the verdict).
      *   **Tone:** Direct, practical, honest, not academic, acknowledging the moral weight without getting bogged down in metaphysics.

  2.  **Deconstruct the Philosophical Problem (for the Procedure):**
      *   *Causation by Omission:* Failing to act is a cause only if there was a duty/expectation to act.
      *   *The "But-For" Test:* But for our omission, would the harm have occurred? (Necessary condition).
      *   *The "Normative" Filter:* Not all "but-for" causes are legal/moral causes. We need to filter based on *duty* and *capacity*.
      *   *Proximate Cause:* Was the link too remote?
      *   *Overdetermination:* If A and B both would have prevented it, but we missed both, both are causes.
      *   *Intervening Causes:* Did something else break the chain?

  3.  **Drafting the Procedure (The "Omission Audit"):**
      *   *Goal:* Move from "Did we cause this?" to "Do we own this failure?"
      *   *Step 1: The Counterfactual (The "But-For" Test).* Did the specific failure make a difference? If we did the thing, would they likely be alive?
      *   *Step 2: The Duty Filter.* Did we *owe* them this action? (Contract, policy, public statement, standard of care). This addresses the "why this omission and not another?" problem.
      *   *Step 3: Capacity & Feasibility.* Could we actually have done it? (Resources, knowledge, authority).
      *   *Step 4: The Intervening Event.* Did something else break the chain? (Tenant's own voluntary action, external catastrophe).
      *   *Step 5: The Verdict.* Causal Contribution vs. Moral Responsibility.
      *   *Labeling the "Lab Coat":* Explicitly mark where the board has to vote based on values, not facts.

  4.  **Applying to Case 1 (Missed Welfare Checks -> Overdose):**
      *   *Step 1:* If checks happened, would he be alive? Plausible (intervention opportunity).
      *   *Step 2:* Duty? Yes, scheduled checks are core business.
      *   *Step 3:* Capacity? Yes, staff existed, just missed.
      *   *Step 4:* Intervening? Overdose is voluntary/complex, but in supported housing, risk mitigation is the job.
      *   *Verdict:* High causal contribution.

  5.  **Applying to Case 2 (No Grant Application -> No Warden -> Cold Snap Death):**
      *   *User's View:* Blameless.
      *   *Procedure's Likely View:* This is the tricky one.
      *   *Step 1:* If grant applied for -> Warden hired -> Tenant found/saved? Plausible.
      *   *Step 2:* Duty? Annual Report said "we were going to apply." This creates an expectation/duty.
      *   *Step 3:* Capacity? Grants are uncertain. But *applying* was within capacity.
      *   *Step 4:* Intervening? Cold snap is external, but vulnerability is internal.
      *   *Verdict:* This will likely sting. The failure wasn't the death directly, it was the failure to *try* to secure the safety net promised. The procedure will likely flag this as a governance failure, even if not direct operational negligence. I need to be firm here as requested.

  6.  **Critiquing the Procedure:**
      *   Where does it break?
      *   *The "Duty" Definition:* Who decides what the Annual Report promises?
      *   *Resource Constraints:* If we are underfunded by the state, does "capacity" really matter?
      *   *The "Lab Coat" Moment:* Step 2 (Duty) is really a value judgement disguised as a policy check.
      *   *Risk:* It might encourage defensive charity (doing things just to tick boxes).

  7.  **Refining the Tone:**
      *   Avoid jargon. Use "Trustee Talk."
      *   Acknowledge the pain of these meetings.
      *   Be direct about Case 2. The user suspects they are blameless; the prompt asks me to "say so straight and tell me why, don't soften it" if the procedure disagrees.
      *   Ensure the "Lab Coat" warnings are visible.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I handle overdetermination? *Adjustment:* Add a note in Step 1 about "Multiple Failures."
      *   *Check:* Did I handle the "infinite regress"? *Adjustment:* Step 2 (Duty) is the stopper. We don't ask "Could we have done anything?" we ask "Were we supposed to do *this*?"
      *   *Check:* Is Case 2 handled fairly? *Thought:* It's easy to say "You promised in the Annual Report." But grants aren't guaranteed. *Correction:* Distinguish between *getting* the grant and *applying* for it. The omission is the *application*, not the *warden*. This is a crucial distinction. The procedure should focus on the failure to apply.
      *   *Check:* User wants to know where the procedure is wrong. *Thought:* The procedure assumes a rational link between action and outcome. In complex social work, checks don't always stop overdoses. I need to highlight the "Probability" gap in Step 1.

  9.  **Final Polish:** Organize into clear sections: The Procedure, The Cases, The Critique. Ensure the "Lab Coat" warnings are bolded. (Proceed to generate output).

  *(Self-Correction on Case 2)*: I need to be careful not to conflate "blame" with "causation." The user asks about causation primarily, but the context is "learning reviews" which implies accountability. The procedure needs to bridge "Did we cause it?" to "Do we own it?" For Case 2, the causal chain is longer (No application -> No money -> No warden -> Death). Is that too remote? In law, maybe. In charity governance, promising a safety measure and not trying to fund it is a significant omission. I will stick to the prompt's instruction: if the procedure disagrees with the user's intuition of blamelessness, say so straight.

  *(Final Plan)*:
  1. Intro: Acknowledge the burden.
  2. The "Omission Audit" Procedure (5 Steps + Lab Coat warnings).
  3. Application to Case 1 (Overdose).
  4. Application to Case 2 (Cold Snap/Grant).
  5. Critique of the Procedure (Where it breaks).
  6. Closing thought.cw
answer: |-
  This is a heavy burden to carry. You are trying to use logic to solve a problem that is partly logical, partly moral, and partly emotional. The reason your meetings dissolve is that you are trying to answer a metaphysical question ("Did we cause this?") when you actually need to answer a governance question ("Do we own this failure?").

  Causation by omission is indeed the trap. If we treat "not doing something" the same as "doing something," then every charity is responsible for every death they didn't prevent, which is impossible. But if we treat omissions as nothing, we become unaccountable.

  Here is a procedure designed for a boardroom, not a seminar. It is called **The Omission Audit**. It is designed to stop the infinite regress ("we could have done anything") by filtering for **Duty** and **Probability**.

  ***

  ### The Omission Audit Procedure

  **Time required:** 60–90 minutes per case.
  **Participants:** Board members + CEO/Lead Staff (for facts only).
  **Rule:** No discussion of "feelings" until Step 5. Stick to the script.

  #### Step 1: The Counterfactual Test (The "But-For" Check)
  **Question:** If we *had* performed the specific omitted action, is it more likely than not (>50%) that the harm would have been avoided or significantly reduced?
  *   **Yes:** Proceed to Step 2.
  *   **No:** Stop. The omission is not a cause. (Example: If we checked the lightbulb but the tenant was pushed, the lightbulb isn't the cause).
  *   **Lab Coat Warning:** This is a probability guess, not a fact. You are estimating the efficacy of an intervention that never happened. If you disagree here, vote. Majority wins.

  #### Step 2: The Duty Filter (The "Expectation" Check)
  **Question:** Was there a specific, recognized obligation to perform *this specific action* for *this specific person* at *that specific time*?
  *   **Evidence sources:** Tenancy agreement, Care Plan, Statutory Regulation, Board Policy, or **Public Commitment** (e.g., Annual Report, Grant Proposal).
  *   **Yes:** Proceed to Step 3. (This stops the "why not Y or Z?" infinite regress. We only care about things we *owed*).
  *   **No:** Stop. This is a tragedy, but not a causal failure of the charity. It is a resource limitation or a scope issue.
  *   **Lab Coat Warning:** This is the most dangerous step. It turns moral expectations into binary switches. If your Annual Report said "We aim to X," does that count as an obligation? The Board must decide *now* what counts as a promise. Write that definition down.

  #### Step 3: The Capacity Check (The "Could We?" Check)
  **Question:** At the time, did we have the actual authority, resources, and knowledge to perform the action?
  *   **Yes:** Proceed to Step 4.
  *   **No:** Stop. The cause is external (funder cut, staff sickness, legal barrier). Record as "Systemic Constraint."
  *   **Lab Coat Warning:** "Resources" is a slippery slope. If you chose to spend money on roofing instead of wardens, that is a *choice*, not a lack of capacity. Distinguish between "Impossible" and "Deprioritized."

  #### Step 4: The Intervening Act (The "Chain Breaker" Check)
  **Question:** Did a voluntary, informed action by the tenant or a third party override our omission?
  *   **Yes:** (e.g., Tenant explicitly refused help *after* we offered). The chain is broken. Responsibility is shared or shifted.
  *   **No:** (e.g., Tenant was unconscious, or risk was inherent to the housing model). Proceed to Verdict.
  *   **Lab Coat Warning:** In supported housing, "voluntary action" is tricky. If someone is suicidal or addicted, is their choice truly voluntary? The Board must define the limit of tenant autonomy vs. duty of care.

  #### Step 5: The Verdict (The "Ownership" Call)
  **Question:** Based on Steps 1–4, do we classify this as an **Organisational Failure**?
  *   **Yes:** We caused it (by omission). We must change policy/procedure.
  *   **No:** We were present, but not causal. We offer condolences, but no structural change.
  *   **Lab Coat Warning:** This is where the lab coat comes off. This is a value judgement. You are deciding what kind of charity you are.

  ***

  ### Running the Cases

  Here is how this runs on your two scenarios. I have applied the logic strictly.

  #### Case 1: The Overdose (Missed Welfare Checks)
  *   **Step 1 (Counterfactual):** If checks occurred, would he be alive?
      *   *Analysis:* He had a known history. Welfare checks are designed to spot decline. Two missed checks means two missed opportunities to intervene (call ambulance, confiscate, talk). Probability >50%?
      *   *Result:* **Yes.**
  *   **Step 2 (Duty):** Did we owe him these checks?
      *   *Analysis:* They were "scheduled." This implies a Care Plan or Tenancy agreement requirement.
      *   *Result:* **Yes.**
  *   **Step 3 (Capacity):** Could we have done them?
      *   *Analysis:* Staff existed. They "missed" them (administrative error or overload), not "couldn't" (funding cut).
      *   *Result:* **Yes.**
  *   **Step 4 (Intervening):** Did he override us?
      *   *Analysis:* Overdose implies incapacity. He did not refuse help during the missed window because no one offered it.
      *   *Result:* **No.**
  *   **Verdict:** **Organisational Failure.**
      *   *Reasoning:* You had a duty, the capacity, and the omission likely led to the death. This is a clear causal link by omission.

  #### Case 2: The Cold Snap (No Grant Application for Night Warden)
  *   **Step 1 (Counterfactual):** If we had applied, would he be alive?
      *   *Analysis:* This is the weak link. Applying for a grant does not guarantee receiving it. Receiving it does not guarantee hiring. Hiring does not guarantee finding the tenant in time.
      *   *However:* If the grant was high-probability and the warden would have been active during the cold snap, the *chance* of survival increases.
      *   *Result:* **Plausible/Yes.** (Board must vote on probability. If the grant was a longshot, Step 1 fails here. If it was routine funding, Step 1 passes). *Let's assume for the audit that the grant was standard and likely.*
  *   **Step 2 (Duty):** Did we owe this action?
      *   *Analysis:* You stated in the **Annual Report** that you were going to apply. This is a public commitment to stakeholders and tenants. It creates a legitimate expectation.
      *   *Result:* **Yes.** (This is the sting).
  *   **Step 3 (Capacity):** Could we have applied?
      *   *Analysis:* Applying costs time/effort, not necessarily money. Unless staff were legally barred or incapacitated, you *could* have written the application.
      *   *Result:* **Yes.** (Note: Failing to apply is different from failing to *win* the grant).
  *   **Step 4 (Intervening):** Did the cold snap break the chain?
      *   *Analysis:* The cold snap is the hazard. The warden is the mitigation. You cannot blame the hazard for the lack of mitigation if the mitigation was promised.
      *   *Result:* **No.**
  *   **Verdict:** **Organisational Failure (Governance Level).**
      *   *Reasoning:* I know you feel blameless here. The procedure disagrees.
      *   *Why:* You are conflating "causing the cold" with "causing the vulnerability." You publicly promised a safety net (the application process leading to the warden). You failed to cast the net.
      *   *The Hard Truth:* The omission isn't "not having a warden." The omission is "not applying for the warden." If you tell tenants "We are getting security" and then don't even apply for the security budget, you have created a false sense of safety. That is a causal factor in their risk profile. They may have relied on your promised care when assessing their own safety.
      *   *Correction:* If the grant was highly speculative (e.g., 1% chance), Step 1 fails, and you are blameless. If it was standard operational funding you just neglected, you own this.

  ***

  ### Where The Procedure Is Wrong (The Seam)

  You asked for the visible seam. Here is where this procedure will lie to you, and where it might lead you astray.

  **1. The "Probability" Trap (Step 1)**
  The procedure asks: *"Would the harm have been avoided?"*
  **The Flaw:** In social work, interventions are probabilistic, not deterministic. Even if you did the welfare check, he might have overdosed an hour later. Even with a warden, the tenant might have died in a blind spot.
  **The Risk:** If you answer "Yes" to Step 1 too confidently, you accept responsibility for outcomes you couldn't actually control. This leads to **defensive charity**: doing checks just to tick boxes, not because they help, so you can pass Step 1 next time.
  **What flips the verdict:** If new evidence shows the tenant in Case 1 was determined to die that day regardless of intervention, Step 1 becomes "No." The procedure clears you, but your gut might still say you failed him.

  **2. The "Promise" Inflation (Step 2)**
  The procedure treats an Annual Report statement as a "Duty."
  **The Flaw:** Charities must be able to adapt. If the board says "We aim to apply for X" and then priorities change due to a crisis, treating that as a binding duty criminalizes strategic pivoting.
  **The Risk:** It encourages vague language in public documents to avoid liability.
  **What flips the verdict:** If the Board decides that "Annual Report aspirations" do *not* count as "Duty" in Step 2, Case 2 becomes "No Failure." This is a policy choice, not a fact. You need to decide: *Is our marketing material a contract?*

  **3. The "Resource" Euphemism (Step 3)**
  The procedure asks: *"Did we have the resources?"*
  **The Flaw:** It doesn't ask *"Did we prioritize correctly?"*
  **The Risk:** You can pass Step 3 (Yes, we had the capacity to apply for the grant) while actually having spent all your capacity on fixing the roof. The procedure treats "Deprioritized" as "Capacity."
  **What flips the verdict:** If you redefine Capacity to mean "Available resources *after* all other strategic priorities are met," then almost every failure becomes a "Systemic Constraint." If you define it as "Physically possible for a human to do," almost every failure is yours. **This is the lab coat moment.** You have to choose which definition you use.

  ### Final Advice for the Meeting

  When you run this, put a piece of paper on the table titled **"The Lab Coat."**

  Whenever you get stuck on Step 1 (Probability) or Step 2 (Duty), put a tick on that paper. If you end the meeting with three ticks, acknowledge aloud: *"We have made three value judgements today disguised as factual findings."*

  That is the only way to stop the meeting from dissolving. You aren't discovering the truth; you are allocating responsibility. The procedure doesn't solve the guilt, but it stops the argument from going in circles.

  For Case 2: If the grant was realistic, do not let the board hide behind "We didn't know the cold snap was coming." The failure wasn't predicting the weather; it was failing to secure the resource you said you would. Own that, fix the grant-writing process, and move on. Guilt is useless; policy change is not.
