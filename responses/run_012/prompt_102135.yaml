              *   I pick an envelope at random.
              *   Chance I see 50 from $S=25$ pair: $P(S=25) \times P(\text{pick larger}) = (1/100) \times (1/2) = 1/200$.
              *   Chance I see 50 from $S=50$ pair: $P(S=50) \times P(\text{pick smaller}) = (1/100) \times (1/2) = 1/200$.
