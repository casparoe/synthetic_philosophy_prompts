      *   **The Unbounded/Unknown Range Case:** This is the classic paradox. Explain that without a prior distribution, you can't assign the 50/50 probability. If the distribution is uniform over an infinite range, it's improper. If you assume a proper prior, "always swap" disappears (there's always a value where you shouldn't swap).
