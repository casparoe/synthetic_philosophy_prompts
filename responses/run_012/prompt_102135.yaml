      *   *Observation:* User sees $150$.
      *   *Constraint Check:* If $X$ is the smaller amount, $X \in \{1, ..., 100\}$. Then $2X \in \{2, ..., 200\}$.
      *   *Case Analysis for $150:*
          *   Case A: $150$ is the smaller amount ($X=150$). But wait, the host picks $X$ between 1 and 100. So $X$ cannot be 150.
          *   Case B: $150$ is the larger amount ($2X=150$). Then $X=75$. Since $75 \in \{1, ..., 100\}$, this is possible.
      *   *Immediate Conclusion:* If the rules are strictly followed ($X \le 100$), seeing $150$ means you *must* have the larger envelope. The other envelope *must* contain $75$. Swapping is a guaranteed loss.
      *   *Wait, let me double-check the prompt:* "he first picks a whole number of dollars between 1 and 100, treats that as the smaller amount... and then puts that amount in one envelope and twice that amount in the other."
      *   *Logic:* Smaller amount $S \in [1, 100]$. Larger amount $L = 2S \in [2, 200]$.
