      *   If the host picks $S$ uniformly from 1-100:
          *   Pairs are $(1,2), (2,4), ..., (100, 200)$. Total 100 pairs.
          *   Total envelopes = 200.
          *   Probability of picking a specific pair is $1/100$. Probability of picking a specific envelope within the pair is $1/2$. So prob of any specific envelope configuration is $1/200$.
          *   If I see 50:
              *   Scenario A: Pair is $(50, 100)$. I picked the smaller. (1 case out of 200 envelopes? No, 1 pair out of 100).
              *   Scenario B: Pair is $(25, 50)$. I picked the larger.
