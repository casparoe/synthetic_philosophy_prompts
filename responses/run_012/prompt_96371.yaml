  Here is a principle designed to capture your verdicts, followed by an analysis of its implications and a candid assessment of where your intuitions may need revision.

  ### The Principle of Graded Authority

  The authority of an advance directive is not binary but graded, depending on the later self's **decisional capacity**, the **continuity of evaluative perspective**, and the **nature of the intervention** at stake.

  **Clause 1: The Competence Override.**
  If the later self possesses decision-making capacity regarding the specific treatment decision (defined as the ability to communicate a choice and understand its consequences, regardless of the mode of communication), their current will overrides any prior directive.
  *   *Motivated by:* Cases 2, 7, and 9. (In 9, eye-gaze communication suffices for capacity).

  **Clause 2: The Cognitive Continuity Threshold.**
  If the later self lacks capacity, the directive binds *unless* the later self demonstrates a level of social and emotional engagement that reveals the directive's trigger condition was a poor proxy for the earlier self's deeper values. Specifically, if the later self retains the capacity for relational enjoyment that the earlier self would have recognized as a "good," the directive lapses. If the later self lacks the cognitive capacity to recognize the specific goods the directive sought to protect (e.g., recognizing family), the directive binds.
  *   *Motivated by:* The distinction between Cases 3 and 4. (In 3, the loss of recognition undermines the "good" of family life; in 4, the retention of social engagement preserves a "good" the earlier self likely valued).

  **Clause 3: The Basic Care and Treatability Exception.**
  In cases of treatable psychiatric illness where the later self's refusal is a direct symptom of the pathology:
  (a) Directives refusing **basic sustenance** (nutrition/hydration) based on a "will to die" do not bind, as the state has a compelling interest in preserving life against pathological self-destruction.
  (b) Directives refusing **specific medical interventions** (e.g., ECT, surgery) do bind, as the prior self's right to bodily integrity outweighs the later self's pathological refusal, provided the intervention is invasive.
  *   *Motivated by:* The distinction between Cases 5 and 6. (Anorexia distorts the valuation of life itself [a]; Mania distorts judgment about treatment, but bodily integrity remains a critical interest [b]).

  **Clause 4: The Irreversible State Default.**
  In cases of irreversible decline (terminal illness, PVS, permanent vegetative states) where the later self has no capacity for experiential welfare or evaluative continuity, the directive binds as the sole expression of the person's critical interests.
  *   *Motivated by:* Cases 1, 8, and 10.

  ---

  ### Implications for Unlisted Cases

  **Case A: The Young Adult's Dementia Directive.**
  *A 30-year-old signs a directive refusing treatment if she ever gets dementia. At 75, she has moderate dementia. She does not remember signing the directive, but she recognizes her children, enjoys meals, and says she is happy.*
  *   **Implication:** Under **Clause 2**, the directive should **not be honored**. Although she lacks the capacity to manage finances or recall the directive, she retains "relational enjoyment" (recognizing children). The trigger ("dementia") was too broad; the earlier self likely valued *relational capacity* over *memory*. Treating her preserves the goods she still accesses.
  *   **Assessment:** You should accept this. It aligns with your verdict in Case 4. It prevents the "dead hand" of the past from killing a happy, socially integrated later self.

  **Case B: The Religious Transfusion (Competent Refusal).**
  *A Jehovah's Witness signs a directive refusing blood. He is later in an accident, unconscious, and needs blood to survive. He carries a card reaffirming his wish.*
  *   **Implication:** Under **Clause 4**, the directive **must be honored**. He lacks capacity (unconscious), the condition is acute/irreversible in the moment (cannot consult him), and it does not fall under the psychiatric exception of Clause 3.
  *   **Assessment:** You should accept this. It aligns with Case 10. It respects the critical interest in religious integrity over the biological interest in survival when no current competent will exists.

  ---

  ### Critical Assessment: Which Verdict to Revise?

  Your pattern of verdicts is highly consistent, but **Case 5 (Bipolar/ECT)** is the weak link.

  **The Tension:**
  In Case 6 (Anorexia), you override the directive to preserve life because the "will to die" is pathological. In Case 5 (Bipolar), you honor the directive to refuse ECT, even though the patient is "miserable and dangerous."
  *   **The Problem:** If the anorexic's refusal of food is pathological and overridden to save her life, why is the manic's refusal of ECT pathological but *honored*, leaving him miserable and dangerous?
  *   **The Principle's Defense:** Clause 3 distinguishes between *basic sustenance* (Case 6) and *invasive medical intervention* (Case 5). The law and ethics often treat forced feeding differently from forced medication due to the bodily intrusion of the latter.
  *   **Why You Should Revise Verdict 5:** This distinction is legally common but philosophically fragile. If the "will to die" in anorexia is a distortion that invalidates the later self's authority, the "refusal of help" in mania is often the same distortion (anosognosia). If the goal is to prevent suffering in a treatable condition, honoring the directive in Case 5 condemns the later self to misery that the earlier self would likely have wanted to avoid *if they knew the severity of the episode*.
  *   **Recommendation:** Consider revising **Verdict 5**. If you accept that psychiatric advance directives in *treatable* conditions should be scrutinized for pathological distortion (as in Case 6), then a directive leaving a patient "miserable and dangerous" should arguably be overridden in favor of treatment, just as the anorexic is fed. The "bodily integrity" argument is weaker when the alternative is severe, treatable psychiatric suffering.

  **Summary of Advice:**
  Adopt the **Principle of Graded Authority**. It successfully systematizes your 10 verdicts by introducing distinctions between *capacity*, *relational continuity*, and *types of intervention*. However, to make the principle more robust, you should reconsider **Case 5**. Aligning Case 5 with Case 6 (overriding the directive in treatable psychiatric emergencies where the patient is suffering) creates a more coherent view of how pathology undermines authority, even at the cost of some prior autonomy.
