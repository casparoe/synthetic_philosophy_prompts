answer: |-
  **Project Title:** Decoupling Content and Vehicle: A Conceptual Analysis of Compositionality and Constituency in the Language of Thought

  **Research Question**
  Does the compositionality of thought content logically entail the constituent structure of cognitive vehicles? Standard defenses of the Language of Thought (LoT) hypothesis argue from systematicity and productivity to the conclusion that cognition operates over symbol-like tokens with syntactic parts. This project asks whether that inference is valid. Specifically, it investigates whether the premise "only constituent vehicles can sustain compositional content" is a necessary truth or a contingent assumption of classical cognitivism.

  **Background and Gap**
  The debate over the LoT is typically framed as a dichotomy between Classicism (symbolic, constituent structure) and Connectionism (distributed, sub-symbolic structure) `[Fodor & Pylyshyn, 1988; Smolensky, 1988]`. Classicists argue that systematicity and productivity require a compositional semantics. Connectionists argue that neural networks can approximate these behaviors without explicit symbols. However, both sides often conflate *Compositionality* (a thesis about content: the content of a complex representation is determined by its parts and mode of combination) with *Constituency* (a thesis about vehicles: a complex representation literally contains token representations of its parts as structural proper parts).

  Existing literature leaves open whether Compositionality *necessitates* Constituency. Classicists assume the entailment holds `[Fodor, 1994]`, while Connectionists often attempt to deny Compositionality itself rather than disentangling it from Constituency. There is no rigorous conceptual map specifying the conditions under which a system could possess compositional content without mereological constituent structure in its vehicles.

  **Methodology**
  This project employs conceptual analysis and logical modeling rather than empirical experimentation or literature survey. The method proceeds in three stages:
  1.  **Definitions:** Rigorously distinguish Compositionality (semantic function) from Constituency (mereological vehicle structure).
  2.  **The Entailment Test:** Analyze the "implementation premise" (that only syntactic vehicles support compositional semantics). I will test this premise against non-classical architectures (e.g., holographic reduced representations, vector space models) to determine if they can satisfy the constraints of systematicity and productivity without satisfying the definition of Constituency.
  3.  **Discrimination Criteria:** Specify the observable or functional differences between a system with genuine constituency and one with merely compositional content. This establishes what evidence would be required to settle the LoT debate empirically.

  **Expected Outcomes and Success Conditions**
  *   **Success:** A coherent model or argument demonstrating that Compositionality does not entail Constituency. This would show that the LoT hypothesis is stronger than required by the data (systematicity/productivity) and that the debate should shift to identifying specific implementation constraints that force symbolic structure.
  *   **Failure:** If analysis demonstrates that any system exhibiting genuine Compositionality *must* possess Constituent vehicle structure, the project fails to decouple the theses. This result will be registered explicitly; proving the entailment would validate the Classical LoT argument but refute the project's central hypothesis.
  *   **Dissertation Weight:** This chapter serves as the metaphysical groundwork for the dissertation (likely Chapter 2). It does not offer a positive theory of concepts or learning but clears the conceptual space required to evaluate competing cognitive architectures. It limits the scope of subsequent chapters by defining the necessary conditions for any viable theory of representation.

  ***

  **Work Plan (9-Month Fellowship)**

  **Months 1–2: Conceptual Framework**
  *   Finalize formal definitions of Compositionality and Constituency.
  *   Draft the critique of the "implementation premise" in standard LoT arguments.
  *   *Milestone:* Complete draft of Section 1 (The Distinction).

  **Months 3–5: The Entailment Test**
  *   Analyze candidate non-classical architectures (e.g., HRR, Tensor Product representations) for compliance with Compositionality without Constituency.
  *   Consult with cognitive science faculty to ensure technical accuracy regarding vector symbolic architectures.
  *   *Milestone:* Complete draft of Section 2 (Counter-examples to Entailment).

  **Months 6–7: Discrimination and Implications**
  *   Develop criteria for distinguishing the two theses empirically.
  *   Draft implications for the broader LoT debate and the dissertation's positive theory.
  *   *Milestone:* Complete draft of Section 3 (Consequences).

  **Months 8–9: Revision and Integration**
  *   Circulate full chapter draft for feedback.
  *   Revise based on committee comments.
  *   Integrate chapter into full dissertation outline.
  *   *Milestone:* Final chapter draft submitted.
