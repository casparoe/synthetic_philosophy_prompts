prompt: |-
  I'm a novelist — fourth book, and my first one with a real historical setting (a small port city, roughly the 1890s, though I'm making up most of the people in it). I'm about two thirds through and I've noticed something worrying: I keep switching between three completely different relationships to the past and I have no idea which one each scene wants. Sometimes I'm writing a scene because some old figure was magnificent and I want my reader to feel that magnificence and take courage from it. Sometimes I'm lovingly cataloguing how people kept their accounts, what was in the pantry, what the harbour sounded like at four in the morning, purely because I've spent two years learning it and I can't bear to throw it away. And sometimes I'm writing to put a period on trial — to show that a thing my characters treat as natural and eternal was in fact made by people who could have made it otherwise, and that it was rotten.

  It only occured to me recently that this is basically the three ways Nietzsche says we can do history for the sake of life — monumental, antiquarian, critical — and that he thinks each one has a disease it slides into if you don't watch it. Which is very flattering to me, except I have no idea how to turn that into something I can actually use at the desk, at 11pm, on a Tuesday, when I've got a scene half-written and I'm not sure if I'm writing it for the right reason.

  So: give me a procedure. A reusable one, that I run per scene or per historical element before I commit to it — questions in order, what counts as a good enough answer to each, and where the thing stops with a no and tells me to cut it. Where the procedure reaches a question that's genuinely about what kind of book I want to write rather than about the material, it should say so and hand it back to me instead of pretending to decide. I'd like it to run in ten minutes, tops. I'm not a philosopher and I'm not going to re-read the essay while I'm drafting. My editor sees the manuscript in March and I'd like to be able to defend each choice in one sentence, so build in whatever it takes to produce that sentence.

  Then run it on three things that are actually in my draft:

  - A battle scene I'm very attached to, where a character's grandfather is at his finest. I think this is my best writing in the book. I suspect you're going to tell me something I won't like about it.
  - A chapter that is basically a long inventory of a household — objects, recipes, the way people addressed their servants — that I love and that does almost nothing to move anything forward.
  - A subplot where I'm using a real institution of the period to show my characters that its cruelties were contingent and changeable, which I now worry is me delivering a verdict rather than telling a story.

  For each, tell me which mode the procedure thinks I'm in, whether that's the mode the scene needs, and what the procedure says to do — and where it just shrugs. And at the end, be honest about what this procedure can't do: Nietzsche was talking about a culture keeping itself healthy, not about a novel, and I don't want to kid myself that his categories fit my problems more neatly than they do.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist, 4th book, 1st historical (1890s port city, fictionalized people). 2/3rds through.
      *   **Problem:** Switching between three relationships to the past (Monumental, Antiquarian, Critical) without intentionality. Worry about consistency and purpose.
      *   **Reference:** Nietzsche's *On the Use and Abuse of History for Life* (Monumental, Antiquarian, Critical). Acknowledges the "diseases" associated with each.
      *   **Task 1:** Create a reusable procedure (checklist/questions) to run per scene/historical element.
          *   Must be actionable at 11pm on a Tuesday.
          *   Max 10 minutes.
          *   Must produce a "defense sentence" for the editor.
          *   Must identify when a question is about the *book's identity* rather than the *scene's content* and hand it back to the author.
          *   Must have a "stop/cut" condition.
      *   **Task 2:** Run the procedure on three specific draft elements:
          1.  Battle scene (Grandfather at finest, monumental, attached to it).
          2.  Household inventory chapter (Antiquarian, loves it, static).
          3.  Subplot about institutional cruelty (Critical, worries about being preachy).
      *   **Task 3:** Honest limitation statement (Nietzsche was talking about culture, not novels; don't overpromise fit).

  2.  **Deconstruct Nietzsche's Modes (for the Procedure):**
      *   *Monumental:* Great deeds, inspiration, courage, models for action. *Disease:* Mythologizing, ignoring context, falsifying truth for inspiration.
      *   *Antiquarian:* Preserving the past, detail, belonging, piety. *Disease:* Mummification, irrelevance, hoarding details that don't serve life.
      *   *Critical:* Judging the past, breaking it to live, exposing contingency/rot. *Disease:* Cynicism, rootlessness, judging without understanding.

  3.  **Drafting the Procedure (The "10-Minute Audit"):**
      *   Needs to be fast. No essay reading.
      *   Needs to force a choice.
      *   Needs to generate the "Editor Sentence."
      *   *Structure:*
          1.  **Identify the Dominant Mode:** Which of the three is driving this?
          2.  **The Life Test:** Does this serve the *character's* life or the *reader's* experience of the story? (Nietzsche's "for the sake of life").
          3.  **The Disease Check:** Is the specific vice of that mode showing up?
          4.  **The Integration Check:** Does this clash with the surrounding scenes?
          5.  **The Verdict:** Keep, Cut, or Rewrite.
          6.  **The Editor Sentence:** Formulate the justification.
      *   *Refinement:* Make it a flowchart style or numbered list with clear "If/Then" logic. Ensure the "Hand Back" moment is clear (e.g., if the answer depends on the book's overall theme, stop and decide the theme).

  4.  **Running the Procedure on the Three Examples:**

      *   *Example 1: Battle Scene (Grandfather).*
          *   Mode: Monumental.
          *   Issue: Is it mythologizing? Does it serve the *current* character or just the author's admiration?
          *   Likely verdict: Keep, but ensure it impacts the protagonist's current struggle.
          *   Editor Sentence: "This scene establishes the ancestral standard of courage against which the protagonist measures their current failure."

      *   *Example 2: Household Inventory.*
          *   Mode: Antiquarian.
          *   Issue: Does it create belonging or just stall? "Love" isn't enough.
          *   Likely verdict: Cut or Compress. It's "mummification."
          *   Editor Sentence: (If cut) "Removed to maintain narrative momentum." (If kept) "This inventory establishes the weight of tradition the protagonist must carry."
          *   *Self-Correction:* User says it "does almost nothing to move anything forward." The procedure should likely flag this as a "No."

      *   *Example 3: Institutional Cruelty Subplot.*
          *   Mode: Critical.
          *   Issue: Is it a verdict (preachy) or a revelation (story)?
          *   Likely verdict: Rewrite to ensure characters *discover* the contingency, rather than the narrator *declaring* it.
          *   Editor Sentence: "This subplot dramatizes the moment the protagonist realizes the system is man-made, not divine."

  5.  **Drafting the Limitations Section:**
      *   Nietzsche was writing about *culture's* ability to act, not *narrative cohesion*.
      *   Novels need all three usually, but woven together.
      *   The procedure can't fix structural thematic incoherence, only local justification.
      *   Don't treat the "diseases" as absolute sins; sometimes a little mythologizing is good fiction.

  6.  **Refining the Tone:**
      *   Respectful of the user's intelligence (they know Nietzsche).
      *   Practical, not academic.
      *   Direct about the hard truths (e.g., the inventory chapter likely needs cutting).
      *   Empathetic to the "11pm Tuesday" fatigue.

  7.  **Final Review against Constraints:**
      *   Procedure reusable? Yes.
      *   Questions in order? Yes.
      *   Stop/No condition? Yes.
      *   Hand back to author? Yes.
      *   Editor sentence included? Yes.
      *   10-minute limit respected (concise steps)? Yes.
      *   Three examples analyzed? Yes.
      *   Limitations honest? Yes.

  8.  **Constructing the Output:** (Mental walk-through of the procedure steps to ensure they flow logically).
      *   *Step 1: Claim the Mode.* (Forces intentionality).
      *   *Step 2: The Life Test.* (Does it help the character/reader move forward?).
      *   *Step 3: The Disease Check.* (Is it tipping into the vice?).
      *   *Step 4: The Book Contract.* (Does this match the rest of the book? *Hand back point*).
      *   *Step 5: The Sentence.*

      *Let's polish the "Hand Back" point.* It needs to be explicit. "If you cannot answer this without defining the book's central theme, stop. Define the theme. Come back."

      *Let's polish the "Editor Sentence".* It needs to be a template. "This [Scene/Element] uses [Mode] to [Function] so that [Result]."

      *Okay, ready to write.*
answer: |-
  Here is the procedure. It is designed to be printed or copied into a notebook and used when you are tired and the text looks slippery. It forces you to choose a master for the scene, because a scene that serves three masters serves none.

  ### The 10-Minute Historical Audit

  **Time limit:** 10 minutes. Set a timer.
  **Goal:** One decision (Keep, Cut, Rewrite) and one "Editor Sentence."

  **Step 1: Claim the Mode (2 minutes)**
  Look at the scene. Which of the three impulses is *dominant*? You must pick one.
  *   **Monumental:** Is the point to inspire, to show greatness, to provide a model?
  *   **Antiquarian:** Is the point to preserve, to show belonging, to honor the texture of life?
  *   **Critical:** Is the point to judge, to expose contingency, to break a chain?

  *Stop Condition:* If you cannot pick one because the scene is genuinely equal parts all three, mark it for **Rewrite**. A scene with three centers has no gravity.

  **Step 2: The Life Test (3 minutes)**
  Nietzsche's core metric is "for the sake of life." In a novel, "life" is the *character's agency* or the *reader's engagement*.
  *   **Question:** Does this historical element make it *harder* or *easier* for the protagonist to act in the present?
  *   **Good Answer:** "It makes it harder (by raising the stakes/weight of tradition)" OR "It makes it easier (by providing a model/tool/insight)."
  *   **Bad Answer:** "It makes the world feel real." (This is a trap. Realness is a byproduct, not a function.)
  *   **Stop Condition:** If the answer is "It does neither, it just sits there," mark it for **Cut**.

  **Step 3: The Disease Check (3 minutes)**
  Every mode has a rot. Check for the specific rot of the mode you claimed in Step 1.
  *   **If Monumental:** Are you ignoring facts to make the figure look better? Is the "courage" unearned?
      *   *If yes:* Can you show the cost of that greatness? If not, **Cut**.
  *   **If Antiquarian:** Is the detail slowing the pulse of the scene to a halt? Is it hoarding?
      *   *If yes:* Can you cut 50% of the details and keep the feeling? If not, **Cut**.
  *   **If Critical:** Are you (the author) judging, or is the character realizing the judgment?
      *   *If yes:* If it is you judging, **Rewrite**. The character must pull the trigger on the realization.

  **Step 4: The Book Contract (2 minutes)**
  *   **Question:** Does this mode match the mode of the surrounding chapters?
  *   **Hand-Back Point:** If the answer is "No, but I think the book *should* be this way," **STOP**. This procedure cannot decide the book's identity. You must decide if this book is a tribute, a preservation, or an indictment. Write that down on a separate sheet. Do not resume drafting until you have defined the book's primary relationship to the past.
  *   **If the answer is "Yes" or "It provides necessary contrast":** Proceed to Verdict.

  **Step 5: The Editor Sentence (Final Minute)**
  Fill in this blank. If you cannot fill it in, you do not understand the scene yet.
  *   *"I am keeping this scene because it uses [Mode] history to [Function: e.g., burden the hero / inspire the hero / free the hero], which is necessary for [Specific Plot Point]."*

  ***

  ### Running the Audit on Your Draft

  Here is the audit applied to your three specific problems.

  #### 1. The Battle Scene (Grandfather at his finest)
  *   **Step 1 (Mode):** **Monumental.** You want the reader to feel magnificence and take courage.
  *   **Step 2 (Life Test):** **Pass/Fail.** Does this grandfather's greatness help the *current* protagonist act?
      *   *Risk:* If the grandfather is too magnificent, the protagonist looks small by comparison and becomes passive. That is "death" for a character.
      *   *Fix:* The scene must not just be "look how great he was." It must be "look what standard I am failing to meet" or "look what burden I inherited."
  *   **Step 3 (Disease Check):** **Mythologizing.** You admit it's your best writing. That is dangerous. Are you smoothing over the grandfather's flaws to make him a statue?
      *   *Verdict:* **Keep, but sharpen the edge.** Show the cost of that magnificence. Did he lose friends? Was he cruel to be great?
  *   **Step 4 (Contract):** Does the rest of the book allow for heroes? If the rest of the book is cynical (Critical), this scene will feel like a lie. Assuming the book allows for heroism...
  *   **Verdict:** **Keep.**
  *   **Editor Sentence:** "I am keeping this scene because it uses **Monumental** history to **establish the ancestral burden of courage**, which is necessary for **the protagonist's crisis of confidence in Act Three**."

  #### 2. The Household Inventory Chapter
  *   **Step 1 (Mode):** **Antiquarian.** You are cataloguing to preserve the texture of life.
  *   **Step 2 (Life Test):** **Fail.** You stated it "does almost nothing to move anything forward." In Nietzschean terms, this is history serving the *dead* (the objects), not the *living* (the story).
  *   **Step 3 (Disease Check):** **Mummification.** You are loving the dead matter more than the living story. You are hoarding research.
  *   **Step 4 (Contract):** Even if the book is Antiquarian in tone, a chapter that stops time completely is a disease unless the *point* of the chapter is that time is stopping (e.g., a character is paralyzed by tradition).
  *   **Verdict:** **Cut or Compress.** You must distribute these details into scenes where they obstruct or aid the characters. A pantry item matters only when someone is hungry or hiding something in it.
  *   **Editor Sentence:** "I am **cutting** this chapter because its **Antiquarian** focus **halts the protagonist's agency**, which violates the narrative momentum required for **the second act turn**." (Note: It is easier to defend a cut than a indulgence).

  #### 3. The Institutional Cruelty Subplot
  *   **Step 1 (Mode):** **Critical.** You are putting the period on trial to show its contingency.
  *   **Step 2 (Life Test):** **Pass.** Showing a system is "made by people" frees the character to change it. This serves "life."
  *   **Step 3 (Disease Check):** **Rootlessness/Cynicism.** You worry you are "delivering a verdict." This is the Critical disease: the author judging from on high.
      *   *Fix:* The character must suffer the cruelty first, then discover the contingency. The realization must feel like a weapon they picked up, not a lecture you gave them.
  *   **Step 4 (Contract):** Does this fit the book? If the book is about freedom, yes.
  *   **Verdict:** **Rewrite.** Shift the focalization. Ensure the *character* articulates the critique, not the narration.
  *   **Editor Sentence:** "I am keeping this subplot because it uses **Critical** history to **reveal the system's contingency**, which is necessary for **the protagonist's decision to rebel in the climax**."

  ***

  ### What This Procedure Cannot Do

  You asked for honesty about the limits of this tool.

  1.  **It Cannot Balance the Mix:** Nietzsche argued a culture needs all three modes in the right balance to be healthy. This procedure audits scenes *individually*. It cannot tell you if your *book* has too much Critical history and not enough Monumental hope. It can tell you if a specific scene is broken, but it cannot tell you if the novel's soul is unbalanced. That requires stepping back and looking at the whole manuscript.
  2.  **It Cannot Validate "Beauty":** Nietzsche's metric is "life" (action, future, vitality). Art sometimes survives because it is beautiful, even if it stops action. The Inventory Chapter might be gorgeous prose. This procedure will tell you to cut it because it doesn't serve "life." You are allowed to overrule the procedure for the sake of beauty, but you must admit you are prioritizing aesthetics over narrative health.
  3.  **It Cannot Solve the "Truth" Problem:** Nietzsche was skeptical of objective truth; he cared about utility. You are writing historical fiction, which has a contract with factual truth. This procedure treats history as a tool for the story. It will not protect you from anachronism or factual error. It only protects you from *irrelevance*.
  4.  **It Cannot Decide the Book's Identity:** As noted in Step 4, if you don't know if you are writing a tribute (Monumental), a preservation (Antiquarian), or an indictment (Critical), this tool will just spin its wheels. It requires you to know what kind of book you are writing to judge if the scenes fit.

  Use this to clear the undergrowth. But remember: Nietzsche wrote that essay to liberate action, not to create a perfect system. If the procedure tells you to cut something that your gut screams is the heart of the book, listen to the gut. The procedure is the editor; you are the writer.
