answer: |-
  Here is the procedure. It is designed to prevent the two failure modes you described: endless inquiry without action, and premature voting without evidence. It is based on a Deweyan logic of *instrumentalism* (ideas are tools) and *social inquiry* (democracy is collective problem-solving), but stripped of the academic veneer so your staff can use it tomorrow.

  ### The Civic Inquiry Protocol (CIP-10)

  **Philosophy of Operation:** This procedure assumes that most civic conflicts are not battles between "right" and "wrong," but indeterminate situations where the consequences of our actions are unknown. The goal is not consensus on values, but warranted assertibility on consequences.

  **The Three Possible Outputs:**
  1.  **NO:** The proposal is factually untenable or the risk allocation is unethical.
  2.  **NOT YET (Experiment):** The consequences are unknown; a pilot is authorized with strict termination conditions.
  3.  **DECISION (Political):** The conflict is about values/identity, not function. Inquiry stops; authority must choose.

  ---

  #### Step 1: Locate the Specific Breakdown
  *   **Question:** What specific experience has become "indeterminate"? (e.g., "People are dying at this intersection," not "Traffic is bad.")
  *   **Sufficient Answer:** A concrete description of a disrupted habit or function, citing specific incidents or data points.
  *   **Type:** Factual/Experiential.
  *   **Gate:** If the answer is vague ("We need to be more inclusive"), return to sender.

  #### Step 2: Map the Affected Public
  *   **Question:** Who concretely bears the burden of the current breakdown, and who will bear the burden of the proposed fix?
  *   **Sufficient Answer:** A list of specific groups (not "the public," but "residents of Block 400," "bus drivers," "shop owners").
  *   **Type:** Factual/Mapping.
  *   **Gate:** If you cannot identify who pays the cost, you cannot proceed.

  #### Step 3: Classify the Conflict (The Pivot)
  *   **Question:** Is the disagreement about *how to achieve a shared goal* (Technical/Functional) or *what the goal/identity should be* (Value/Symbolic)?
  *   **Sufficient Answer:** A written classification.
      *   *Functional:* "We all want safety, we disagree on the barrier."
      *   *Symbolic:* "We disagree on whether this name honors a hero or a villain."
  *   **Type:** **Value/Judgment.**
  *   **Gate:** **CRITICAL.** If *Symbolic*, skip to Step 9 (Political Decision). Do not pilot identity. If *Functional*, proceed to Step 4.

  #### Step 4: Survey Existing Evidence
  *   **Question:** Has this specific intervention been tested in a comparable context?
  *   **Sufficient Answer:** A summary of 3 comparable cases (successes and failures) with context notes.
  *   **Type:** Factual.
  *   **Gate:** If evidence exists and is negative, output **NO**. If evidence is positive, you may skip to Step 9 for approval. If evidence is mixed/absent, proceed to Step 5.

  #### Step 5: Formulate the Hypothesis
  *   **Question:** What specific change in the world do we expect this action to produce?
  *   **Sufficient Answer:** An "If/Then" statement. (e.g., "If we close the street, then pedestrian volume will rise 20% and retail revenue will remain stable.")
  *   **Type:** Factual/Predictive.
  *   **Gate:** If the hypothesis is unfalsifiable ("It will improve the vibe"), output **NO**.

  #### Step 6: Assign Risk and Burden
  *   **Question:** If the hypothesis is wrong and the pilot fails, who absorbs the cost?
  *   **Sufficient Answer:** A named budget code or department that covers the loss, and a named mitigation plan for affected residents (Step 2).
  *   **Type:** **Value/Political.** (This is where you decide if it is ethical to experiment on people).
  *   **Gate:** If the cost falls on a vulnerable group without mitigation, output **NO**. The department must carry the risk, not the neighborhood.

  #### Step 7: Define Termination Conditions
  *   **Question:** What specific data point triggers the immediate end of the pilot?
  *   **Sufficient Answer:** A hard metric. (e.g., "If emergency response times increase by >30 seconds," or "If retail revenue drops >10% for 2 consecutive months.")
  *   **Type:** Factual/Operational.
  *   **Gate:** If you cannot define failure, you cannot run the experiment. Output **NOT YET**.

  #### Step 8: Assess Reversibility
  *   **Question:** Can we return to the status quo ante within 48 hours if the termination condition is met?
  *   **Sufficient Answer:** A logistical plan for undoing the change.
  *   **Type:** Factual/Logistical.
  *   **Gate:** If the change is permanent (e.g., pouring concrete), this is not a pilot; it is a capital project. Proceed to Step 9.

  #### Step 9: Designate Authority
  *   **Question:** Who has the warrant to sign off on this classification and risk assignment?
  *   **Sufficient Answer:** A named role.
      *   For *Functional/Experimental*: Department Head.
      *   For *Symbolic/Political*: Elected Body (Council/Board).
  *   **Type:** Procedural.
  *   **Gate:** Your unit does not decide. You prepare the file; they sign.

  #### Step 10: Schedule Reconstruction
  *   **Question:** When do we reconvene to judge the results?
  *   **Sufficient Answer:** A fixed date on the calendar, not "when the data is ready."
  *   **Type:** Procedural.
  *   **Gate:** No date = No start.

  ---

  ### My Position on the Line Between Inquiry and Conviction

  You asked where the line falls. Here it is: **Inquiry ends where consequences become unknowable and the dispute becomes about constitutive identity.**

  Dewey believed values could be investigated *instrumentally* (does this value lead to the growth we want?), but he acknowledged that the *choice* of ultimate ends is a matter of shared commitment, not empirical proof.
  *   **Inquiry Zone:** "Will closing this street make it safer?" (Consequences are measurable).
  *   **Conviction Zone:** "Does this street name represent who we are?" (Consequences are subjective; the dispute *is* the identity).

  If your procedure classifies a problem as *Symbolic* (Step 3) and you try to run a pilot, you are lying. You are pretending a value judgment is a technical test. In those cases, the procedure must force a political vote, but a *informed* vote (based on Steps 1, 2, and 6).

  ---

  ### Case Run 1: Closing Downtown Street to Cars
  **Proposal:** Close Main St (2 blocks) to private vehicles for 12 months.

  1.  **Breakdown:** Pedestrian-vehicle conflicts (4 accidents last year); retail vacancy (15%).
  2.  **Affected Public:** Pedestrians (benefit), Bus Riders (delay risk), Main St Shop Owners (revenue risk), Residents (noise diversion risk).
  3.  **Classification:** **Functional.** Goal is safety and economic vitality. Disagreement is on means. *Proceed.*
  4.  **Evidence:** Mixed. Similar cities saw retail up 10% but traffic displaced to side streets.
  5.  **Hypothesis:** If we close Main St, then pedestrian accidents will drop to 0 and retail revenue will stay within 5% of baseline.
  6.  **Risk/Burden:** If revenue drops >10%, City Planning fund covers a grant to offset losses. Traffic diversion noise monitored by 3rd party.
  7.  **Termination:** If emergency response time slows by >45 seconds OR retail revenue drops >10% for 2 months.
  8.  **Reversibility:** High. Bollards are removable.
  9.  **Authority:** City Manager (Functional Pilot).
  10. **Reconstruction:** Review date set for Month 6 and Month 12.

  **Output:** **NOT YET (Experiment Authorized).**
  *Why:* The problem is indeterminate, the hypothesis is falsifiable, and the risk is allocated to the City, not the shop owners.

  ---

  ### Case Run 2: Renaming Jefferson Street
  **Proposal:** Rename Jefferson Street to "Truth & Reconciliation Way" due to Jefferson's ownership of enslaved people.

  1.  **Breakdown:** Community groups state the name causes psychological harm/feels exclusionary. Heritage group states erasing history causes cultural harm.
  2.  **Affected Public:** Residents on the street (mail/logistics cost), Descendants of enslaved people (symbolic benefit), Historical Society (symbolic loss), General Public (navigation confusion).
  3.  **Classification:** **Symbolic.** The disagreement is not about *safety* or *flow*. It is about *honor* and *identity*. One side values historical continuity; the other values moral correction.
      *   *Stop.* Do not proceed to Step 4.
  4.  **Survey Evidence:** (Skipped). Evidence cannot settle whether a name is "offensive." That is a judgment, not a fact.
  5.  **Hypothesis:** (Impossible). "If we rename it, then racism will decrease" is not a falsifiable pilot hypothesis.
  6.  **Risk/Burden:** The cost is social cohesion. If the rename happens and half the city refuses to use the new name, the "failure" is not measurable, but the division is real.
  7.  **Termination:** (Impossible). You cannot "un-ring the bell" easily, and there is no metric for "sufficient reconciliation."
  8.  **Reversibility:** Low. Maps, deeds, signage cost money to change back.
  9.  **Authority:** **City Council.** This is a legislative/moral act, not an administrative one.
  10. **Reconstruction:** N/A.

  **Output:** **DECISION (Political).**
  *Why:* The procedure flags this at Step 3. This is not a "civic experiment." It is a value declaration.

  **How the Procedure Handles This Differently:**
  In your current mess, you would likely try to "study" the renaming for eight months (commission a report on historical naming conventions) or rush to a vote.
  *   **The CIP-10 forces you to admit:** There is no experiment to run here. There is no "test" that will prove one side right.
  *   **The Action:** You hand the file to the City Council *immediately* after Step 3. The file contains Step 1 (The Breakdown) and Step 2 (Who Pays).
  *   **The Instruction:** "Council, this is not a technical problem. This is a choice about who we are. The cost of changing is $X (logistics). The cost of not changing is Y (social friction). You must vote. Do not ask us for a pilot."

  ### What This Procedure Cannot Do

  1.  **It cannot resolve Value Conflicts:** It explicitly identifies them and pushes them to elected officials. It will not make the renaming "easy." It will just stop you from pretending a report can solve it.
  2.  **It cannot protect you from Political Blowback:** If the Council votes to rename the street and the Heritage Group sues or protests, the procedure offered no shield. It only ensured you didn't waste eight months on a fake study.
  3.  **It cannot generate Political Will:** If the Council is too cowardly to make the Value Decision (Case 2), they will try to force you back to Step 4 ("Just study it more!"). Your unit must have the mandate to refuse.

  ### Final Advice for Your Unit

  Your colleague is right about Dewey, but Dewey is dangerous in a bureaucracy if you use him to justify endless talk. Dewey's "inquiry" is ruthless. It demands that if you can't test it, you must own the choice.

  Use Step 3 as your shield. When someone hands you a value conflict disguised as a policy problem, your answer is: **"This fails Step 3. We cannot experiment on identity. This goes to Council for a vote. We will provide the cost estimate (Step 6), but we will not provide a recommendation."**

  That is how you stop the eight-month reports. You declare the inquiry complete because there is nothing left to find out.
