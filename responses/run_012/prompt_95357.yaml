          *   No money payoffs (points/utility).
          *   Private cost-of-contribution cards (hidden types: net contributors vs. beneficiaries).
          *   Rule-choosing phase (group sets tax/enforcement *before* knowing types).
          *   Imposed rule phase (external rate similar to chosen one, to feel the difference of authorship).
          *   Avoid labeling it "trust" until the debrief.
          *   Must generate evidence for argumentation.
      *   **Specific Constraints/Warnings:**
          *   Avoid standard public goods game tropes (free riding is known). Focus on the *institution/trust hinge*.
          *   Predict failure modes (universal cooperation or total defection) and how to handle them without rigging.
          *   Identify what the game *cannot* reproduce (historical depth, homogeneity, etc.) and what the debrief must supply.
