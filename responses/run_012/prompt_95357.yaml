  2.  **Deconstruct the Core Problem:**

      *   The user wants to move beyond "people free ride" (standard PGG) to "why do people accept the rules that stop free riding?"
      *   The key mechanism is *ex-ante agreement under uncertainty* (Veil of Ignorance-ish) vs. *ex-post imposition*.
      *   The "Nordic" angle implies high compliance without heavy enforcement, rooted in social norms.
      *   The game needs to simulate the *feeling* of legitimacy (self-imposed) vs. alienation (imposed), even if the math is similar.

  3.  **Drafting the Game Design:**

      *   *Name:* Needs to be neutral. "The Allocation Mechanism" or "Resource Distribution Protocol." Let's go with "The Contribution Protocol."
      *   *Roles/Types:* Need hidden costs. High Cost (HC) and Low Cost (LC) contributors.
          *   HC: Cost > Benefit from public good unless tax is very low.
          *   LC: Cost < Benefit. Net gainers from redistribution.
