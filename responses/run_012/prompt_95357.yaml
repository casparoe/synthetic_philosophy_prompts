              *   Pool Return: Multiplier (e.g., 1.5x) divided equally.
              *   Tax Rule: Mandatory contribution % of endowment.
              *   Enforcement: Audit chance.
              *   *The Twist:* In Round 1, they set the Tax/Audit. Then they learn types. Then they decide whether to *comply* or *evade* (if audit allows).
              *   *Round 2:* Facilitator sets Tax/Audit.
      *   *Refining the "Trust/Legitimacy" Hinge:*
          *   If they set the rules themselves under uncertainty, High Cost types might agree to high tax because they hope they are Low Cost.
