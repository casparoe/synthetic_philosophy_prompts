answer: |-
  # Workshop Activity: The Contribution Protocol

  **Target:** 12–16 Graduate Students (Political Theory/Public Policy)
  **Time:** 90 Minutes (50 min Activity, 20 min Debrief, 20 min Buffer/Discussion)
  **Materials:** Deck of "Cost Cards" (see below), Score sheets, Projector/Board.
  **Payoff:** Points (converted to no tangible reward, or minor token like priority on coffee).

  ## Part 1: Design & Mechanics

  ### The Core Tension
  The game isolates the difference between **compliance based on legitimacy** (rules authored under uncertainty) and **compliance based on coercion** (rules imposed after interests are known). It avoids the standard Public Goods Game trap by making the *rules themselves* the variable, not just the contribution decision.

  ### The Setup
  1.  **Endowment:** Every player starts with **100 Points** each round.
  2.  **The Public Pot:** All points contributed are multiplied by **1.2** and distributed equally among all participants, regardless of contribution.
  3.  **Private Types (The "Cost Cards"):**
      *   Shuffle a deck of 16 cards.
      *   **Type A (Low Cost):** 6 cards. Cost to contribute is **0.4 points** per 1 point contributed.
      *   **Type B (High Cost):** 10 cards. Cost to contribute is **1.2 points** per 1 point contributed.
      *   *Note:* This distribution ensures that for Type B, contributing is a net *individual* loss, even with the public good return, unless compliance is near-universal. They are the "swing" players.
  4.  **The Rule:** Players are asked to contribute a **Target Amount (50 points)**.
  5.  **Enforcement:** There is an **Audit Probability**. If a player contributes less than the Target and is Audited, they pay a **Fine (40 points)**.

  ### The Procedure (50 Minutes)

  **Phase 1: The Constitutional Convention (10 mins)**
  *   **Instruction:** "You are designing a system for resource allocation. You do not yet know your economic position in this system."
  *   **Action:** Do **not** distribute Cost Cards yet.
  *   **Vote:** The group must democratically decide two parameters:
      1.  **Target Contribution:** (Fixed at 50 for simplicity, or let them vote between 30/50/70).
      2.  **Audit Rate:** (Choose between 10%, 30%, 50%).
  *   **Constraint:** Tell them the Audit is costly for the "state" (you). Higher audit rates reduce the Public Pot Multiplier slightly (e.g., 50% audit drops multiplier from 1.2 to 1.1). This forces a trade-off between trust and enforcement.
  *   **Outcome:** Record the chosen rules on the board.

  **Phase 2: Revelation & Play (Round 1) (15 mins)**
  *   **Action:** Distribute Cost Cards privately. Players learn if they are Type A or Type B.
  *   **Decision:** Players privately decide how much to contribute (0 to 50).
  *   **Audit:** Roll dice (or use a random number generator) to determine who is audited based on the agreed rate. Apply fines.
  *   **Calculation:** Calculate payoffs.
      *   *Formula:* $100 - (\text{Contribution} \times \text{Cost}) + (\text{Total Pot} / N) - \text{Fines}$.
  *   **Record:** Have players record their payoff and whether they complied.

  **Phase 3: The External Shock (Round 2) (15 mins)**
  *   **Instruction:** "The parameters have changed. The Facilitator (representing an external authority/IMF/Colonial Power) is now setting the rules. You did not vote on these."
  *   **Action:** Set the rules to **exactly the same levels** the group chose in Phase 1 (Target 50, same Audit Rate).
  *   **Crucial Detail:** Reshuffle and redistribute the Cost Cards. (This prevents the same "losers" from rebelling twice; it tests the *institution's* legitimacy, not individual grievance).
  *   **Decision:** Players decide contributions again.
  *   **Audit & Calculate:** Same as Round 1.

  **Phase 4: Aggregation (10 mins)**
  *   Collect score sheets.
  *   Calculate group averages for:
      1.  Compliance Rate (Round 1 vs. Round 2).
      2.  Type B Compliance (Round 1 vs. Round 2).
      3.  Total Welfare (Sum of points).
  *   Display the data on the board without interpretation.

  ---

  ## Part 2: Predictable Failure Modes & Mitigation

  You asked what will go wrong. In my experience running similar designs, two outcomes threaten the pedagogical value.

  **1. The "Kumbaya" Failure (Near-Universal Cooperation)**
  *   **What happens:** Type B players comply fully in both rounds. The data shows no difference between self-chosen and imposed rules.
  *   **Why:** The group is too small (12-16 people) and in a classroom setting; social pressure overrides the payoff structure. They are "playing the student" rather than the "agent."
  *   **Handling it:** Do not rig the payoffs to force defection. Instead, use the debrief to interrogate the *source* of the compliance.
      *   *Ask:* "Type B players, you lost points by complying. Why did you do it?"
      *   *Pivot:* If they say "I felt I should," you have proven the **Normative** argument. If they say "I was afraid of the audit," you have proven the **Institutional** argument. The tension shifts from *behavior* to *motivation*.

  **2. The "Collapse" Failure (Total Defection in Round 2)**
  *   **What happens:** Round 1 is cooperative. Round 2, resentment at the "imposition" causes Type B players to evade en masse, crashing the pot.
  *   **Why:** The "External Shock" framing triggers a reactance bias that dwarfs the economic incentives.
  *   **Handling it:** This is actually excellent data for the "Legitimacy" argument, but it risks making Round 2 pointless.
      *   *Mitigation:* If you see defection spiking mid-round, pause and remind them: "The rules are identical to Round 1. Only the authorship changed."
      *   *Debrief Use:* If collapse happens, lean into it. This simulates the difficulty of exporting institutions without local buy-in.

  ---

  ## Part 3: The Debrief (20 Minutes)

  Do not start by saying "This is about trust." Start with the data.

  **Step 1: The Data Reveal (5 mins)**
  *   Show the compliance rates.
  *   **Question:** "The rules were mathematically identical in both rounds. The payoffs were identical. Why did the behavior change (or not change)?"
  *   **Goal:** Elicit the concept of *Legitimacy* vs. *Coercion*.

  **Step 2: Mapping to the Nordic Debate (10 mins)**
  Use the game moments to map the three competing explanations in comparative political economy.

  *   **Moment:** The Phase 1 Vote (Veil of Ignorance).
      *   **Theory:** **Constitutional Choice / Rawlsianism.**
      *   **Argument:** High-tax systems work because people agree to them *before* knowing if they will be winners or losers.
      *   **Nordic Link:** This mirrors the historical "class compromise" in Scandinavia (Saltsjöbaden Agreement), where labor and capital agreed on rules before the full expansion of the welfare state.

  *   **Moment:** Type B Compliance in Round 1.
      *   **Theory:** **Social Trust / Homogeneity (Putnam, Inglehart).**
      *   **Argument:** Compliance happened because of pre-existing norms. The game group is a graduate cohort (high education, similar status), mimicking the "homogeneity" argument often made about Nordic states.
      *   **Critique:** Ask: "If we played this in a deeply polarized society, would Phase 1 have resulted in a vote at all?"

  *   **Moment:** The Difference Between Round 1 and Round 2.
      *   **Theory:** **Quality of Government (Rothstein).**
      *   **Argument:** Trust is not a cultural prerequisite; it is an *output* of fair institutions. When the institution felt fair (Round 1), trust/compliance was high. When it felt alien (Round 2), compliance dropped.
      *   **Nordic Link:** Bo Rothstein's argument that universalism (everyone is under the same rule) generates trust, rather than trust enabling universalism.

  **Step 3: What the Game Cannot Reproduce (5 mins)**
  *   **Be Explicit:** Tell your colleagues: "This game is a heuristic, not a simulation. It isolates mechanism, but it strips out history."
  *   **The Missing Variable:** **Time.** The Nordic model is not a one-shot game. It is a repeated game over 70 years.
      *   *Settled Literature:* Nordic countries have high tax compliance and high interpersonal trust.
      *   *Contested Literature:* The causal arrow.
          *   *View A (Culturalist):* Lutheran heritage + homogeneity $\to$ Trust $\to$ Welfare State. (Hard to export).
          *   *View B (Institutionalist):* Universal, non-corrupt institutions $\to$ Trust $\to$ Welfare State Stability. (Potentially exportable).
          *   *View C (Co-evolution):* Institutions and norms reinforce each other over decades. (The "Package Deal").
  *   **The Lesson:** The game shows that *authorship* matters. The Nordic model may not be exportable as a *policy kit* (Round 2), but the *process* of building legitimacy (Round 1) might be the transferable lesson.

  ---

  ## Part 4: Notes for the Facilitator (Empirical Rigor)

  Since you are presenting to comparative political economy colleagues, you must distinguish between the game's logic and the empirical reality.

  **1. On "Homogeneity"**
  *   *Game Proxy:* The small group size and shared graduate student status.
  *   *Empirical Reality:* **Contested.** While Sweden/Denmark were historically homogeneous, they are increasingly diverse. Some scholars (e.g., Alesina) argue heterogeneity reduces redistribution support. Others (e.g., Banting & Kymlicka) argue the Nordic model has persisted *despite* immigration, suggesting institutions matter more than ethnicity.
  *   *Debrief Line:* "The game assumes homogeneity makes agreement easier. In reality, the Nordic model survived diversification better than many expected. Why? Perhaps because the institutions were already legitimate."

  **2. On "Tax Compliance"**
  *   *Game Proxy:* Audit fear vs. normative duty.
  *   *Empirical Reality:* **Settled.** Deterrence (audits) explains only a fraction of compliance. "Tax morale" explains the rest.
  *   *Debrief Line:* "In Round 2, the audit rate was the same. If compliance dropped, deterrence theory fails. We need a theory of obligation."

  **3. On "Exportability"**
  *   *Game Proxy:* Imposing Round 1 rules in Round 2.
  *   *Empirical Reality:* **Contested.**
      *   *Consensus:* You cannot simply copy Swedish tax rates to the US or Brazil and expect the same revenue or welfare outcomes.
      *   *Debate:* Is this because of "culture" (immutable) or "state capacity" (buildable)?
      *   *Debrief Line:* "The game suggests the 'policy kit' fails without the 'constitutional moment.' Does that mean the Nordic model is impossible elsewhere, or just that the *sequence* of reform matters?"

  ## Summary Checklist for Run Day
  1.  **Math Check:** Ensure Type B (High Cost) actually loses points by complying if others defect. (With the numbers above: Cost 1.2 $\times$ 50 = 60 loss. Share of pot $\approx$ 60 gain. It is marginal. If you want sharper tension, increase Type B cost to 1.4).
  2.  **Anonymity:** Ensure contribution decisions are private. If public, shame will drive compliance, confounding the "legitimacy" variable.
  3.  **The "Hook":** When announcing Round 2, adopt a slightly more bureaucratic tone. "The administration has reviewed your proposal and decided to implement it mandatory." Small theatrical cues reinforce the "Imposed" variable.

  This design forces the participants to *be* the High-Cost types who agreed to a system that hurts them, and then *be* the High-Cost types subjected to that same system by an outsider. The difference in their visceral reaction is the evidence you need for the debrief.
