          *   *Let's go with:* **The Compliance Game.**
          *   Endowment: 100.
          *   Private Cost ($c$): Drawn from deck. Low (0.2) or High (0.8).
          *   Target Contribution: Set by rule (e.g., 50 points).
          *   Actual Contribution: Player chooses $0 \to 50$.
          *   Penalty: If Contribution < Target AND Audited.
          *   Public Pot: Sum of Contributions $\times$ 1.2, distributed equally.
          *   *Why this works:* Low Cost types *want* high contribution. High Cost types *want* low contribution. Under the Veil (Rule Phase), they don't know who they are.
