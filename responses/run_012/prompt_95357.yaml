      *   *Payoffs:* Points.
          *   Endowment $E$.
          *   Contribution $C$.
          *   Cost $k_i$ (private).
          *   Public Good Return $R = \alpha \sum C$.
          *   Net Payoff = $E - k_i C - t(E) + \text{Share of } R$.
          *   *Correction:* To make it about "Nordic Model," it needs to be about *compliance* vs. *evasion*.
