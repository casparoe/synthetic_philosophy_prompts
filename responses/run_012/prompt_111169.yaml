answer: |-
  Evidence confirms a hypothesis to the degree that the complete report of the observation—including the method by which the object was selected—is more probable given the hypothesis and background knowledge than given the hypothesis's negation.

  (a) This principle is **Protocol-Sensitive Bayesian Confirmation**. It survives as a single principle because it treats the "evidence" not merely as the physical properties of the object observed (e.g., "white shoe"), but as the conjunction of those properties and the sampling protocol that produced them (e.g., "white shoe drawn from random population" vs. "white shoe drawn from shoe rack"). It requires three inputs: the observed properties, the selection procedure, and the background knowledge (including population size).

  (b) The clause requiring **observed properties** is forced by Cases 1 and 4, where the color and species of the object drive the likelihood difference. The clause requiring the **sampling protocol** is forced by Cases 3, 8, and 9; in Case 3, the protocol fixes the object as a non-raven, making the likelihood ratio 1 (no confirmation), while in Case 9, the witness's attentional focus ("saw a raven" vs. "saw a black thing") constitutes different protocols yielding different confirmatory weights. The clause requiring **background knowledge** is forced by Cases 5 and 6; the physical object is identical, but the background knowledge of the box's population size ($N=10$ vs. $N=10^{12}$) dictates how much ruling out a counterexample reduces the probability of the hypothesis's negation. Case 7 forces the principle to account for the **logical structure of the negation**; confirming "All Ravens are Black" is distinct from confirming "All Ravens are Black or White" because the space of possible falsifiers differs, altering the likelihood of the evidence under the negation.

  (c) First, regarding the equivalence of "All Ravens are Black" and "All Non-Black Things are Non-Ravens": the principle rules that they are **not confirmed to the same degree** by the same object if the sampling protocols differ. A white shoe found by sampling shoes confirms the second formulation directly but confirms the first only derivatively and weakly, matching your shoe rack intuition. Second, regarding the conjunction "All Ravens are Black and All Swans are White": a black raven confirms the pair **less than it confirms the raven claim alone**. Because the evidence is irrelevant to swans, it does not raise the probability of the swan conjunct, and since the conjunction is logically stronger (lower prior) than the raven claim alone, the proportional boost is diluted by the irrelevant conjunct. Third, regarding the bare report "a black raven was found": the principle rules the confirmation **indeterminate**. Without knowing whether the finder was sampling ravens, black things, or random objects, the likelihood ratio cannot be calculated; the principle forces you to reject the bare report as insufficient for quantification.

  (d) The principle cannot accommodate your verdict in Case 2 without a pragmatic caveat. Mathematically, a random white shoe *does* confirm the hypothesis (likelihood ratio > 1), whereas your verdict is "nothing at all." You should **accept the mathematical confirmation but acknowledge a pragmatic threshold**; the confirmation is so minute relative to the noise of background uncertainty that human cognition rounds it to zero. Regarding Cases 3, 8, and 9, the principle *can* accommodate them, but only if you accept the extra ingredient that **evidence includes the sampling story**. If you insist on a principle that looks only at the object's properties independent of how it was found, you must give up your verdicts in 3, 8, and 9, as they are logically identical to Case 2 in terms of object properties. The truth is that your intuitions are correct and the standard "object-only" probability principle is too impoverished; you need the protocol-sensitive version stated above.
