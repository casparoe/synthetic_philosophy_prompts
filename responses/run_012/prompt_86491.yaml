  # Diagnostic Decision Tree: Causation by Omission

  This instrument maps the logical space of positions on omission causation. It proceeds from metaphysical commitments to semantic and pragmatic refinements. Answer each question based on your intuition about the specific case described; do not worry about which theoretical label your answer implies.

  ### Node 1: The Metaphysics of Absences
  **Case:** *The Gardener who does not water.*
  **Question:** In this case, did the plants die **because the water was absent**, or did they die **because the sun evaporated the soil moisture** (with the gardener's inaction merely explaining why the sun wasn't blocked)?

  *   **A.** They died because the sun evaporated the moisture; "absence of water" is just a way of describing the positive causal chain.
      *   $\rightarrow$ Go to **Leaf 1**.
  *   **B.** They died because the water was absent; the absence itself is a genuine part of the causal relation.
      *   $\rightarrow$ Go to **Node 2**.

  ### Node 2: The Role of Agency and Duty
  **Case:** *The Institution that never built the levee.*
  **Question:** If the institution had **no moral or legal duty** to build the levee (perhaps it was a private club with no responsibility to the public), would the omission of the levee still be a **cause** of the flood?

  *   **A.** No. Without a duty or an agent to bear it, there is no causation, only a condition.
      *   $\rightarrow$ Go to **Leaf 2**.
  *   **B.** Yes. The physical lack of the barrier caused the flood regardless of normative expectations.
      *   $\rightarrow$ Go to **Node 3**.

  ### Node 3: Abundance vs. Sparsity
  **Case:** *The Parent who leaves a child in a hot car.*
  **Question:** Is the **sun's heat** equally a cause of the child's injury as the **parent's omission** to return?

  *   **A.** Yes. Both are counterfactually necessary conditions; causation is abundant.
      *   $\rightarrow$ Go to **Leaf 3**.
  *   **B.** No. The parent's omission is the cause; the sun is merely a background condition.
      *   $\rightarrow$ Go to **Node 4**.

  ### Node 4: Objectivity vs. Context
  **Case:** *The Person who believes she pressed the button, did not, and the machine runs anyway.*
  **Question:** If we change the **conversational context** (e.g., from a technical report to a moral inquiry) but keep the **facts and statistical defaults** exactly the same, does the causal verdict change?

  *   **A.** Yes. Causal claims shift depending on which contrasts are salient in the context.
      *   $\rightarrow$ Go to **Leaf 4**.
  *   **B.** No. Causal claims are fixed by the objective default states of the variables, regardless of context.
      *   $\rightarrow$ Go to **Leaf 5**.

  ---

  ### The Leaves (Positions)

  **Leaf 1: Causal Eliminativism**
  *   **Standard Name:** *Process Theory / Anti-Relationalism* (e.g., Dowe, Beebee).
  *   **Commitment:** There are no negative events. Omissions are not relata. Causation requires a physical process/transfer.
  *   **Status:** Stable position, though controversial in special sciences.

  **Leaf 2: Normative-Relation View**
  *   **Standard Name:** *Normative Causation* (e.g., Moore, some Legal Theorists).
  *   **Commitment:** Causation by omission is real but depends on the violation of a norm or duty by an agent.
  *   **Status:** **[Contested Label]** Often conflated with pragmatic selection. Some argue this collapses causation into responsibility.

  **Leaf 3: The Counterfactual View**
  *   **Standard Name:** *Lewisian Counterfactualism* (e.g., Lewis).
  *   **Commitment:** Omissions are real relata. Causation is plain counterfactual dependence. Causes are abundant (including the sun, the oxygen, etc.).
  *   **Status:** Standard baseline, though "abundance" is often seen as a bug, not a feature.

  **Leaf 4: Contrastive or Causal-Selection View**
  *   **Standard Name:** *Contrastive Causation* (e.g., Schaffer, Hart & Honoré).
  *   **Commitment:** Causation is a ternary relation (C rather than C* causes E rather than E*). Omission-talk selects the "abnormal" cause from a surplus of conditions based on context.
  *   **Status:** **[Attribution Uncertain]** Often overlaps with Normality views. Hart & Honoré are selectionists but not strictly contrastivists in the modern semantic sense.

  **Leaf 5: Dependence-plus-Normality View**
  *   **Standard Name:** *Default-Relativized Causation* (e.g., McGrath, Halpern & Pearl).
  *   **Commitment:** Causation requires counterfactual dependence *plus* a deviation from a default/normal state. The defaults are objective (statistical or conceptual), not merely conversational.
  *   **Status:** Growing consensus in structural equation modeling approaches.

  ---

  ### Logical Space Analysis

  **Empty Combinations:**
  1.  **Eliminativism + Normative-Relation:** *Incoherent.* One cannot hold that omissions are not causal relata (Leaf 1) while simultaneously holding that they cause outcomes relative to a norm (Leaf 2). If there is no relatum, there is no relation to be normative.
  2.  **Counterfactual View + Normative-Relation:** *Unattractive/Unexplored.* Plain counterfactualism (Leaf 3) treats causes as objective facts. Combining this with the view that duties determine causation (Leaf 2) creates a tension between objective dependence and normative status that few theorists maintain (usually one collapses into the other).

  **Indistinguishable Leaves:**
  *   **Leaf 4 (Contrastive) and Leaf 5 (Normality):** On standard cases (Gardener, Parent), these views yield identical verdicts. Both restrict causation to "abnormal" omissions. The tree separates them only on the *source* of the restriction (Context vs. Objective Default). In practice, many authors slide between these, making empirical separation difficult.

  ---

  ### Instrument Reliability Report

  **Least Confident Branch Node:**
  **Node 4 (Objectivity vs. Context).**
  This node relies on the intuition that "objective defaults" can be cleanly separated from "conversational context." However, many proponents of Normality views (Leaf 5) admit that what counts as a "default" is itself sensitive to context (e.g., what is normal in a hospital vs. a battlefield). This blurs the line between Leaf 4 and Leaf 5, risking misclassification of a Context-Sensitive Normality theorist as a Contrastivist.

  **Misclassification Case:**
  To force a position from **Leaf 5 (Normality)** onto **Leaf 4 (Contrastive)**, a case would need to show **contextual shifting without default shifting**.
  *   *The Case:* A **Doctor who omits a test**.
      *   *Scenario:* The test is statistically rare (Objective Default = No Test).
      *   *Context A:* Technical inquiry. Verdict: Not a cause (follows default).
      *   *Context B:* Moral inquiry. Verdict: Is a cause (follows norm).
      *   *Misclassification Risk:* A Normality theorist might say the "default" *just is* different in the moral context (shifting Leaf 5). A Contrastivist says the default is the same, but the *contrast* changed (Leaf 4). If the theorist claims the default is fixed but the verdict changes, they are Leaf 4. If they claim the default shifts with the context, they are Leaf 5. Because "default" is often defined by what we attend to, this instrument is most likely to misclassify **Context-Sensitive Normality** views as **Contrastive** views.
