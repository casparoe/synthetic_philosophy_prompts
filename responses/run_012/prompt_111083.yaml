          *   *Pushback:* Modern decision theory says rational preference shouldn't depend on how you *describe* the lottery, not just the physical sequence. But Bernoulli might dismiss the "undefined" claim as mathematical pedantry disconnected from moral expectation.
      *   **Menger's Critique:**
          *   Menger (1934) showed St. Petersburg can be scaled to break *any* unbounded utility.
          *   Does this kill Bernoulli? Not necessarily. Bernoulli was solving a specific puzzle about *money*, not building a complete axiomatic system for all possible abstract games.
          *   Bernoulli would likely say: "No one can offer you a game paying $2^{1000}$ dollars. It's physically impossible." He was interested in *real* commerce, not abstract infinity.
