          *   But Bernoulli's *insight* (utility $\neq$ money) remains valuable, even if the specific function isn't a magic bullet.
          *   Advice for the article: Don't let Bernoulli "solve" it. Let him highlight why the paradox exists (the clash between abstract math and human limits).

  5.  **Refining the Tone:**
      *   Needs to be magazine-ready (engaging, clear) but intellectually rigorous.
