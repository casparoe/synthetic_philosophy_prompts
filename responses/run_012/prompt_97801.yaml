      *Draft:*
      You are right that there is no phenomenological scale inside me where one death weighs exactly one-fifth of another. But morality is not a report on my internal sensations; it is a demand arising from the reality of the people involved. When you say each death is the end of a world, I agree entirely. But if each death is the end of a world, then five deaths are five ends of worlds, and one death is only one. The tragedy is not diluted by being multiplied; it is compounded. To say the five "outweigh" the one is not to say I feel more sadness for them; it is to say that the state of affairs where five worlds end is objectively worse than the state where only one ends, and I am the agent capable of preventing that worse state.

      Your lottery proposal treats each person as an equal claimant, which they are, but it ignores the fact that the group of five has a stronger collective claim simply because there are more of them making it. If I run a lottery and save the one, I have honored the claim of that one person, but I have disregarded the identical claims of the four who died needlessly. I could have saved them at no greater cost to the one than the one incurred anyway. The duty arises because those four have a complaint against me that the single survivor does not: I let them die when I could have saved them without sacrificing anyone else. [Here I am assuming that the strength of moral claims can aggregate across persons, a point non-aggregationists like Kamm or Scanlon in some moods dispute, but which seems necessary to avoid moral absurdity.] If you deny this, you aren't just rejecting a calculation; you are denying that the extra four matter morally in the moment of choice.

