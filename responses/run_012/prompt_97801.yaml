      *   *Paragraph 1:* Address the "inner balance" and "end of a world" point. Acknowledge the gravity of individual death but pivot to the comparative badness. If each death is a tragedy, five tragedies are worse than one. The "outweighing" isn't a feeling; it's a fact about the world.
      *   *Paragraph 2:* Address the "lottery" and "duty" point. A lottery gives equal chance, but it ignores the extra claims of the extra people. If I save the one, I let four die who could have lived. That is the source of the duty. [Flag: The move from "better outcome" to "obligation" is where consequentialism sits, but many deontologists accept aggregation too.]

