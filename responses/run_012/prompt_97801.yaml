      *   **Counter to "Lottery":** A lottery treats people as equal claimants, but aggregationists argue the claim of the five is stronger *collectively* or that the outcome is objectively better.
      *   **Contested Point Flagging:** Need to identify where philosophers disagree. For example, the move from "better outcome" to "moral duty" (consequentialism vs. deontology) is contested. The idea of "summing" welfare is contested by non-aggregationists.
      *   **Voice:** Respectful but firm. "You are missing the point of the moral demand."

