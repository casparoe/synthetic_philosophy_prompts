prompt: |-
  So my cousin's a vet and she does inspections for one of those farmed-seafood welfare certification schemes — the ones where a little logo ends up on the back of the packet — and for my environmental science class I have to write a report where I predict what a real certifier would say about a farm I've never visited, so I've basically been interrogating her at every family dinner for a month. Her track record as far as I can piece it together: she's fine with electrical stunning of farmed salmon before slaughter, she's fine with trout going into ice slurry to chill them down before they're killed, she hates CO2 narcosis for salmon (she says you can watch them trying to climb the tank wall and theres no excuse because the electrical kit exists and works), she hates eyestalk ablation in shrimp hatcheries — thats the one where they pinch or cut off an eye to trigger spawning — and says she'd fail a farm for it even though practically every hatchery does it, and for crabs she's fine with chilling them down and then either spiking or electrically stunning them, but not boiling them alive. The one that confused me: she said once she'd rather see a crab boiled than see a shrimp sit in a bare tank for a year, which doesn't fit with anything else she says.

  The farm in my report is a whiteleg shrimp operation and two things about it are new to me. First, they've dropped eyestalk ablation entirely and get the females to spawn by crashing the water temperature and salinity instead — sounds nicer, but I guess its still a big shock to the animal, just a non-surgical one. Second, at harvest they pump the shrimp into cold water, kind of like the trout ice slurry, and kill them that way; they claim its fine because shrimp go torpid in the cold, but the person who emailed me back from the scheme said nobody actually knows whether a chilled shrimp is unconscious or just not moving, and there's an electrical stunning rig designed for shrimp that exists but costs a lot, and the farm says they can't afford it.

  So what do you think she'd say about this farm — pass, fail, or pass with conditions? I know you can't read her mind, so what I actually want is the rules that fit everything she's said so far, what each of those rules predicts about my shrimp farm, which rule you'd bet she's really running and why, and which extra case I should ask her about at the next dinner that would split apart the rules that all fit so far. And please say how confident you actually are in your bet, and single out the part of it you're least sure about.
