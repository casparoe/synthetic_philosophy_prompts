  I'm a philosophy professor, and I've been running a little reading group on decision theory with some grad students. We spent the whole session yesterday on the Death in Damascus case — you know, Death tells you it's coming for you tomorrow wherever you are, it's a perfect predictor, you can stay in Damascus or flee to Aleppo, and whichever you choose is where Death will be. One of my students is a committed causal decision theorist, and I want to stress-test his view. So I'd like you to play a sharp, committed causal decision theorist for me — not a caricature, someone who knows the evidential decision theory objections and has real answers, who will concede small points but won't give up the main line. Stay in character until I say "stop." Keep your replies to a paragraph or so, like we're actually talking. Don't just recite the standard moves; engage with what I actually say.

  Here's my opening move, as someone who thinks CDT has a real problem here: I get that you want to say my choice doesn't cause Death's location, because Death already predicted it. Fine. But look at what your theory actually tells me to do. If I stay, Death is in Damascus, so I die in Damascus. If I flee, Death is in Aleppo, so I die in Aleppo. So the counterfactual "if I flee, I die in Aleppo" is true. And I'd much rather die in Aleppo than in Damascus — Damascus is my home, I dont want to die there. So CDT tells me to flee. But then CDT is telling me to choose an act because of what it predicts about where Death will be, which is exactly the evidential reasoning you say is irrational. So either CDT is not purely causal, or it's indifferent between staying and fleeing, and if its indifferent, it's useless when it matters. Which is it? And don't tell me the prediction is a causal consequence of my disposition — I want to know what the theory says to me, right now, at the moment of choice.
