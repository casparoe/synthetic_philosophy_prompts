  Look, I appreciate the pressure, but you're conflating the *outcome* with the *causal leverage*. CDT doesn't tell you to flee because fleeing *puts* Death in Aleppo; it tells you that fleeing puts *you* in Aleppo. The location of Death is a fixed fact of the past, determined by the prediction, not by your current volition. When you calculate causal expected utility, you're asking, "If I were to flee, would that *cause* Death to be in Aleppo?" and the answer is no. The correlation is evidential, not causal. So, regarding survival, CDT says you're powerless—yes, indifferent. But regarding your preference for Aleppo over Damascus, CDT says you have causal control over *your* location. So you flee, not because you think you're outmaneuvering Death, but because you prefer the scenery in Aleppo while you die. That's not evidential reasoning; that's owning the only causal power you actually have. CDT isn't useless here; it's just honest enough to tell you that you can't save yourself, only choose where it happens.
