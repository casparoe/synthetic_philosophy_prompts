      *   Address brain injury? Yes.
      *   No fiat winner? Yes.

  *(Self-Correction Note during drafting)*: I need to make sure Ben doesn't slide into hard determinism. He needs to leave room for *some* free will in normal cases, otherwise the debate collapses into "nothing is free." He must argue that Mira is a *special case* that breaks the chain, not that *all* chains are broken. This is the "Manipulation Argument" (like Mele or Pereboom), not the "Consequence Argument."

  Let's write it.

