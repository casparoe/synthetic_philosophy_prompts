      *   **Character A (Compatibilist):** Focuses on current psychological structure, endorsement, responsiveness to reasons. Believes Mira is responsible.
      *   **Character B (Incompatibilist):** Focuses on the *history* of the disposition. Believes Mira is not *ultimately* responsible. Needs a principled distinction between manipulation and normal upbringing/genetics.
