          *   *Constraint Check:* B needs a principled line, not just "manipulation is bad."
      *   **Round 2: The "Genes/Upbringing" Objection (The Standard Compatibilist Counter).**
          *   Alice: We all are products of luck. Genes, parents. How is this different?
          *   Ben: Need a distinction. It's about *bypassing* vs. *shaping*. Or perhaps the *transitivity* of control. Let's go with the "History of the Process" vs. "Mechanism" distinction requested. Ben should argue that normal upbringing works *through* the child's developing agency, whereas the implant *sets* the agency parameters directly.
