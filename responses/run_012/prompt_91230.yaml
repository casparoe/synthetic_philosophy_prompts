      *   **B (Ben):** Needs to sound like a sophisticated incompatibilist (maybe Galen Strawson-esque or Pereboom-esque). Focus on *ultimate origination*.
      *   **Tone:** Intellectual, respectful, sharp, avoiding jargon where possible but precise where necessary.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the stakes. Mira's case.
      *   **Round 1: The Core Intuition.**
          *   Alice: Mira looks responsible. She endorses her values. She reasons.
