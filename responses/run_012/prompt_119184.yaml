      *(Self-Correction during drafting)*: I need to be careful about the "units of selection" claim. R. says only genes are units. This is the "Replicator vs. Vehicle" distinction. Hull and Dawkins. S. implies groups can be units. MLS theory says groups *can* be units of selection (interactors) even if genes are replicators. I should clarify this distinction.

      *(Self-Correction on Hamilton's Rule)*: The prompt says $r=1/8$ and $rb < c$. R. says "do the arithmetic." S. says "you're rigging $r$." The technical truth is that Hamilton's rule holds *if* $r$ is defined as the regression coefficient of recipient genotype on actor genotype. If defined genealogically, it can fail. R. is implicitly using regression $r$. S. is insisting on genealogical $r$. This is a major source of confusion.

      *(Final Plan)*: Structure the response clearly with headings. Keep the language precise. Acknowledge the "Equivalence Thesis" (Okasha, van Veeren, etc.).

