      *   **Tone:** Needs to be precise, philosophically rigorous (since the user is a philosopher), but accessible enough for a non-biologist. Needs to avoid taking sides dogmatically while clarifying the technical landscape.

  2.  **Deconstruct the Argument (Move by Move):**

      *   **Scenario:** A toy model of diploid beetles. Guards stay, cost to self, benefit to brood. Relatedness ($r$) $\approx 1/8$. Hamilton's Rule ($rb > c$) seemingly fails with genealogical $r$.
      *   **R.'s Position (Kin Selection/Gene's Eye):**
          *   Move 1: It's kin selection. Allele spreads via relatives. Group selection is just redescription.
