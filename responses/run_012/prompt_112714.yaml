prompt: |-
  I lead a small decision-support team at a foundation that commits a fixed budget each quarter across interventions that differ sharply in how measurable their effects are and in how much of their value lies in low-probability, high-consequence outcomes. The commitments are large and hard to reverse, and none of us has formal training in decision theory. Twice now, board members have articulated preferences that come back around on themselves — one option preferred to a second, the second to a third, the third to the first — and our estimates for a set of mutually exclusive, jointly exhaustive scenarios have summed to well over one. I have read enough to know that an agent whose preferences or credences break certain structural conditions is said to be incoherent, and that this is supposed to be the whole reason expected-utility maximization is the only defensible policy: a counterparty who knows the pattern can be relied on to extract a sure loss. I want a procedure my team can run, before an allocation reaches the board, to audit it for that kind of incoherence.

  Lay it out as a sequence of questions to ask in order, with what counts as a sufficient answer to each and what counts as a failure. It has to isolate the structural conditions separately rather than collapse them into a general impression of consistency — in particular the condition governing how preferences order options, the condition governing how a preference must survive the mixing of each option with a common alternative, and the condition governing how probabilities combine across a partition — and test each on its own. For every failure it finds, it must distinguish a real violation from an artifact of how we elicited the preference or the estimate, and it must say which failures are mere bookkeeping and which are evidence that the representation itself is the wrong tool for the case. It must also confront the objection that the exploitation arguments only bite against an agent who cannot see the sequence of trades coming, and that an agent who can anticipate it, or who binds herself in advance not to be moved, may escape without revising anything; I want the procedure to state precisely where that defense is available and where it is not. And it must mark the points where the procedure has to stop and hand the matter to a person, because what looks like a violation is in fact a pair of options that are neither better, nor worse, nor equal, or a commitment that is meant to hold absolutely. It should be usable in an afternoon by people who lack the theory, and it should produce something short enough to attach to a recommendation.

  Then run it on three cases and give the verdict at each step. First, the circular preference, where the colleague who holds it insists the cycle is stable and survives every way we have of presenting the options. Second, the scenario estimates that sum past one. Third, a board member who maintains that no expected benefit, however large, justifies any increase in the risk of an irreversible harm, and who treats this as a matter of principle rather than of estimation. I expect at least one verdict I will not like; I would prefer clean answers, and I suspect the procedure will refuse to give them, so be explicit about which refusal is principled and which is a failure of nerve. Close by telling me what the procedure cannot do: what it will misclassify, how running it will leave my team more confident than the underlying argument actually licenses, and which question it will never settle for us.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Leader of a small decision-support team at a foundation.
      *   **Context:** Fixed budget, quarterly commitments, large/hard-to-reverse interventions, varying measurability, low-probability/high-consequence outcomes. No formal decision theory training.
      *   **Problem:** Board members exhibit incoherent preferences (cycles) and incoherent credences (probabilities summing > 1).
      *   **Goal:** A pre-board audit procedure to detect structural incoherence (preferences and probabilities) before allocation recommendations go up.
      *   **Requirements:**
          *   Sequence of questions (ordered).
          *   Define sufficient answers vs. failures.
          *   Isolate specific structural conditions:
              1.  Ordering of options (Transitivity/Completeness).
              2.  Mixing with common alternatives (Independence/Sure-Thing Principle).
              3.  Probability combination (Additivity).
          *   Distinguish real violations from elicitation artifacts.
          *   Distinguish "bookkeeping" errors from "wrong tool" errors.
          *   Address the "exploitation argument" objection (can an agent bind themselves to escape Dutch Books?).
          *   Identify where the procedure must stop and hand off to a human (incomparability, absolute commitments).
          *   Usable in an afternoon by non-experts.
          *   Output short enough to attach to a recommendation.
          *   **Task:** Run the procedure on three specific cases (Circular Preference, Probability Sum > 1, Lexical/Deontological Constraint).
          *   **Closing:** Explicitly state limitations (misclassifications, false confidence, unsettled questions).
      *   **Tone:** Professional, rigorous, pragmatic, honest about limitations (no "clean answers" if they don't exist).

  2.  **Deconstruct the Theoretical Underpinnings:**

      *   *Preference Ordering:* Requires Completeness (can compare any two) and Transitivity (if A > B and B > C, then A > C). Violation = Cycle.
      *   *Independence (Mixing):* If A > B, then $pA + (1-p)C > pB + (1-p)C$. Violation = Allais Paradox style behavior or framing effects.
      *   *Probability:* Requires Additivity (sum of partition = 1) and Coherence (no Dutch Book). Violation = Sum > 1 or < 1.
      *   *Dutch Book/Exploitation:* The standard argument is that incoherence leads to sure loss. The counter-argument is "resolute choice" or "binding." The procedure needs to adjudicate when binding is feasible vs. when the preference structure itself is broken.
      *   *Incomparability/Deontology:* Some values aren't trade-offable (lexical preferences). Expected Utility (EU) theory struggles here. The procedure must recognize this not as a "bug" but as a "feature" that requires a different framework.

  3.  **Drafting the Procedure (The "Audit Protocol"):**

      *   *Name:* Structural Coherence Audit (SCA).
      *   *Structure:* Three Modules (Preferences, Independence, Probabilities).
      *   *Format:* Question -> Pass Criteria -> Fail Criteria -> Triage (Artifact vs. Real vs. Handoff).
      *   *Constraint:* Must be usable by non-experts in an afternoon. Keep language plain but precise.

      *   *Module 1: Ordering (Transitivity & Completeness)*
          *   Q: Can you rank A, B, C?
          *   Check for cycles.
          *   Triage: Is it framing? Is it genuine incomparability?

      *   *Module 2: Independence (Mixing)*
          *   Q: If you prefer A to B, do you still prefer a lottery with A to a lottery with B, given a common background risk?
          *   Triage: Is it complementarity? Is it risk aversion (which is allowed in EU via utility curvature, but not violation of independence)? *Correction:* Risk aversion is handled by utility function. Independence violation is preferring a sure thing over a gamble but reversing when both are probabilistic.
          *   Refinement for laypeople: "Common Consequence" test.

      *   *Module 3: Probabilities (Additivity)*
          *   Q: Do your scenario probabilities sum to 1?
          *   Triage: Rounding error? Overconfidence? Non-exhaustive list?

      *   *The "Exploitation" Defense:* Need a specific step to ask: "Can you bind yourself?" If yes, maybe coherent enough for practice. If no, structural fix needed.

      *   *The "Handoff":* When to stop. When someone says "This is a side constraint," EU doesn't apply. Mark as "Non-Compensatory."

  4.  **Running the Cases:**

      *   *Case 1: Circular Preference (A > B > C > A).*
          *   Module 1 Fail.
          *   Triage: Colleague says it's stable. Not framing.
          *   Handoff? Or Binding? If stable, it's a genuine preference cycle. EU cannot represent this. Verdict: **Incoherent.** Binding doesn't fix the *representation*, only the *loss*.
      *   *Case 2: Probabilities > 1.*
          *   Module 3 Fail.
          *   Triage: Bookkeeping? Or overlapping scenarios?
          *   Verdict: **Fixable (Bookkeeping).** Normalize or redefine partition.
      *   *Case 3: Lexical Constraint (No risk of irreversible harm).*
          *   Module 1/2 Fail (lexicographic preferences violate continuity/independence).
          *   Triage: Is this a principle? Yes.
          *   Verdict: **Wrong Tool.** EU is not the right model. Handoff to ethical review, not math fix.

  5.  **Refining the Output:**

      *   Need to ensure the distinction between "failure of nerve" (refusing to judge) and "principled refusal" (theory doesn't apply) is clear in the closing.
      *   The prompt asks for "clean answers" but suspects the procedure will refuse. I need to be honest about where the math breaks down (Case 3).
      *   The "Exploitation" objection needs specific handling. If I can bind, am I coherent? Technically no, but pragmatically safe. The procedure should flag this as "Dynamic Incoherence Risk."

  6.  **Developing the Content - Step-by-Step:**

      *   *Introduction:* Acknowledge the gravity.
      *   *The Protocol:* 3 Sections.
      *   *The Case Studies:* Apply the protocol rigorously.
      *   *The Limitations:* The "What this cannot do" section.

      *(Self-Correction during drafting)*: Make sure I don't get bogged down in heavy math notation. Use "Lottery" language carefully. For the Independence test, keep it simple: "Adding a common chance to both options shouldn't swap their ranking."
      *(Self-Correction on Case 3)*: A lexical preference violates the *Continuity* axiom of vNM utility, not just Independence. I should label it "Non-Compensatory Value."
      *(Self-Correction on Exploitation)*: The prompt asks where the defense is available. It's available if the agent can pre-commit *and* the environment allows it. If the board votes sequentially without binding, the defense fails.

  7.  **Final Review against Constraints:**
      *   Sequence of questions? Yes.
      *   Sufficient answer vs. Failure? Yes.
      *   Isolate conditions (Ordering, Mixing, Probability)? Yes.
      *   Distinguish Artifact vs. Real vs. Wrong Tool? Yes.
      *   Address Exploitation/Binding objection? Yes.
      *   Mark Handoff points? Yes.
      *   Usable in afternoon? Yes, kept concise.
      *   Run on 3 cases? Yes.
      *   Close with limitations? Yes.

  8.  **Final Polish:** Ensure tone is respectful of the board's authority but firm on the logic. (Proceed to generate output).

      *Wait, one nuance:* The prompt asks for "what counts as a sufficient answer... and what counts as a failure." I need to make sure the Protocol section is very structured.
      *Also:* "Distinguish a real violation from an artifact of how we elicited." I need to include a "Calibration Check" step in each module.
      *Also:* "Which failures are mere bookkeeping and which are evidence that the representation itself is the wrong tool." This is crucial for Case 3.

      *Let's structure the Protocol:*
      1.  **Preference Ordering (Transitivity)**
      2.  **Preference Stability (Independence)**
      3.  **Credence Coherence (Additivity)**
      4.  **Remediation & Handoff Logic** (Binding vs. Theory Change)

      *Let's refine the "Exploitation" part:* The procedure shouldn't just say "you can be Dutch Booked." It should ask "Can you prevent the sequence of trades?" If yes, mark as "Operationally Coherent." If no, mark as "Vulnerable."

      *Let's refine Case 3:* This is the "I won't like" verdict. The procedure must say "EU Maximization is invalid here." That is the clean answer the user might not like because it stops the quantification.

      *Let's refine the Limitations:* False confidence is a big one. Passing the audit doesn't mean the decision is *good*, just structurally consistent.

      *Okay, ready to write.*
answer: |-
  # Structural Coherence Audit (SCA) Protocol
  **Version:** 1.0 | **Time Required:** 2–3 Hours | **Audience:** Decision-Support Team

  ## Purpose
  To identify structural violations in preference and probability assessments before they reach the Board. This audit does not judge the *quality* of a decision, only its *logical consistency* under the Expected Utility (EU) framework. It isolates three specific axioms: Ordering, Independence, and Additivity.

  ## Instructions
  Run these modules sequentially. If a module fails, complete the "Triage" step before proceeding. Do not proceed to allocation modeling until all modules are either Passed or marked as "Handoff Required."

  ---

  ## Module 1: Preference Ordering (Transitivity & Completeness)
  **Condition:** For any three options A, B, and C, if A is preferred to B, and B to C, then A must be preferred to C. All options must be comparable.

  **Q1.1:** List the top three intervention candidates (A, B, C). State the pairwise preference for each pair (A vs B, B vs C, A vs C).
  *   **Sufficient Answer:** A > B, B > C, A > C (or any consistent transitive chain).
  *   **Failure:** A > B, B > C, C > A (Cycle) OR "Cannot compare A and B" (Incompleteness).

  **Q1.2 (Calibration):** Re-state the options using different framing (e.g., lives saved vs. lives lost; total budget vs. marginal budget). Do the pairwise rankings change?
  *   **Sufficient Answer:** Rankings remain stable.
  *   **Failure:** Rankings flip based on framing.
      *   *Triage:* If framing flips rankings, this is an **Elicitation Artifact**. Freeze the framing that aligns with the Foundation's charter and re-run Q1.1.

  **Q1.3 (Triage):** If a Cycle (A>B>C>A) persists after calibration:
  *   Ask: "If forced to choose only one, which is selected?"
  *   **If a choice is made:** The cycle is **Verbal/Expressive**. Record the forced choice as the true preference. (Pass)
  *   **If no choice is made/Cycle is insisted upon:** This is a **Structural Violation**. EU theory cannot represent this. (Fail → Handoff).

  ---

  ## Module 2: Preference Stability (Independence)
  **Condition:** If A is preferred to B, then a mixture of A with any common alternative C must be preferred to the same mixture of B with C. Preferences should not depend on common consequences.

  **Q2.1:** Identify the preferred option (A) and the runner-up (B) from Module 1.
  **Q2.2:** Construct a "Common Risk" scenario (C) (e.g., "50% chance funding is withdrawn due to external macro events").
  **Q2.3:** Ask: "Do you prefer A over B?" (Confirm Yes). Then ask: "Do you prefer [50% A + 50% C] over [50% B + 50% C]?"
  *   **Sufficient Answer:** Yes to both.
  *   **Failure:** Yes to first, No to second.

  **Q2.4 (Triage):** If Failed:
  *   Ask: "Is the value of A dependent on B *not* happening? (Complementarity)"
  *   **If Yes:** This is **Context-Dependent Value**. EU is the **Wrong Tool**. (Fail → Handoff).
  *   **If No:** Ask: "Can the Board bind itself to the initial ranking (A>B) before the risk C is introduced?"
      *   **If Yes:** Mark as **Operationally Coherent (via Binding)**. The structural violation exists but is neutralized by pre-commitment.
      *   **If No:** Mark as **Vulnerable to Dynamic Inconsistency**. (Fail).

  ---

  ## Module 3: Credence Coherence (Additivity)
  **Condition:** Probabilities assigned to a set of mutually exclusive and jointly exhaustive scenarios must sum to exactly 1.0.

  **Q3.1:** List the scenarios used to estimate impact (e.g., Best Case, Base Case, Worst Case).
  **Q3.2:** Sum the assigned probabilities.
  *   **Sufficient Answer:** Sum = 1.0 (±0.05 for rounding).
  *   **Failure:** Sum > 1.0 (Overconfidence/Overlap) or Sum < 1.0 (Unconsidered Scenarios).

  **Q3.3 (Triage):** If Failed:
  *   Ask: "Are these scenarios mutually exclusive?" (e.g., Does 'Best Case' include 'Base Case' outcomes?)
  *   **If No (They overlap):** This is **Bookkeeping**. Redefine scenarios as a partition. (Pass after correction).
  *   **If Yes (They are exclusive):** Ask: "Does the excess probability represent a 'hope premium' or emotional weighting rather than likelihood?"
      *   **If Yes:** This is **Non-Probabilistic Weighting**. EU is the **Wrong Tool**. (Fail → Handoff).
      *   **If No:** Normalize the probabilities to sum to 1.0. (Pass after correction).

  ---

  ## Final Disposition Logic
  *   **All Modules Pass:** Recommendation is structurally coherent. Attach audit log.
  *   **Module 1 or 2 Fail (Structural):** EU Maximization is invalid. Handoff to Board Ethics/Strategy Committee. Do not model expected value.
  *   **Module 2 Fail (Binding Available):** Proceed, but note "Requires Pre-Commitment Mechanism."
  *   **Module 3 Fail (Bookkeeping):** Correct and proceed.
  *   **Any Module Handoff:** The recommendation must state: "Quantitative optimization is suspended due to non-compensatory constraints or incoherent preferences."

  ***

  # Audit Application: Three Cases

  ### Case 1: The Circular Preference
  **Input:** Board Member insists A > B, B > C, and C > A. Claims this is stable and framing-invariant.
  **Module 1 Result:** **FAIL.**
  *   Q1.1: Cycle detected.
  *   Q1.2: Framing does not resolve it.
  *   Q1.3: Member refuses forced choice; insists the cycle *is* the preference.
  **Triage:** This is not an elicitation artifact. It is a genuine intransitivity.
  **Exploitation Defense Check:** Can the member bind themselves?
  *   *Analysis:* Even if they bind themselves to 'A' initially, the preference structure remains cyclic. If the choice set changes slightly (e.g., A vs C later), the cycle re-emerges. Binding stops the *loss*, not the *incoherence*.
  **Verdict:** **Handoff Required.**
  *   *Reasoning:* Expected Utility theory requires a complete ordering. A cycle means there is no "maximum" to maximize. You cannot calculate an EV for a loop.
  *   *Action:* Do not present an EV ranking. Present the cycle as a strategic ambiguity requiring qualitative resolution.

  ### Case 2: The Probability Sum > 1
  **Input:** Team estimates: Success (70%), Partial Success (50%), Failure (20%). Sum = 140%.
  **Module 3 Result:** **FAIL.**
  *   Q3.2: Sum exceeds 1.0 significantly.
  **Triage:**
  *   Q3.3: Are they exclusive?
      *   *Investigation:* "Partial Success" was defined as "At least 50% of goals," which includes "Success" (100% of goals).
  *   *Analysis:* This is overlapping definitions, not a belief that the world is 140% likely to exist.
  **Verdict:** **Bookkeeping Error (Fixable).**
  *   *Reasoning:* The underlying credences may be coherent, but the partition is malformed.
  *   *Action:* Redefine partition: "Full Success," "Partial Only," "Failure." Renormalize. Proceed with audit.

  ### Case 3: The Lexical Constraint
  **Input:** Board Member: "No expected benefit justifies *any* increase in risk of irreversible harm."
  **Module 2 Result:** **FAIL.**
  *   Q2.3: Member prefers Safe Option (A) over Risky Option (B) even if Risky Option's benefit is multiplied by 1000x.
  *   *Analysis:* This violates the *Continuity* axiom (a subset of Independence/Stability). In EU, there is always a price at which you take the risk. This member says the price is infinite.
  **Exploitation Defense Check:** Can they bind?
  *   *Analysis:* Binding works here (they are pre-committed to the constraint), but the *tool* is still wrong. You cannot plug "Infinity" into a spreadsheet.
  **Verdict:** **Wrong Tool (Handoff).**
  *   *Reasoning:* This is a deontological constraint, not a trade-off. Treating this as a probability of zero is dishonest (the risk is non-zero); treating it as a cost is incorrect (it's a veto).
  *   *Action:* Mark the intervention as "Ineligible" regardless of EV. Do not attempt to quantify the trade-off.

  ***

  # Limitations & Warnings

  You asked for clean answers. The procedure above provides them for Case 2, but refuses them for Cases 1 and 3. This is not a failure of nerve; it is a feature of the mathematics. Here is what this procedure cannot do:

  **1. It will misclassify "Rational" Incoherence as Error.**
  If your Board operates on a "satisficing" logic or a "polytelic" framework (multiple conflicting goals that are not trade-offable), Module 1 will flag them as incoherent. They are not incoherent *relative to their own philosophy*, but they are incoherent *relative to Expected Utility*. The audit assumes EU is the goal. If your foundation's mission is inherently non-utilitarian, the audit will constantly recommend "Handoff."

  **2. It creates false confidence in "Passed" audits.**
  Passing this audit means your preferences are *consistent*, not that they are *correct*. You can be perfectly coherent in preferring to burn money. Furthermore, passing Module 2 (Independence) does not protect you from "Black Swan" model error. It only ensures you aren't contradicting yourself within the model you have.

  **3. It cannot settle the "Binding" Defense.**
  The audit asks if the Board *can* bind itself. It cannot verify if they *will*. A Board may pass the audit by claiming they will pre-commit to avoid Dutch Books, only to renege when the emotional pressure of a specific decision arises. The audit treats "Binding" as a binary switch; in reality, it is a governance strength that varies over time.

  **4. The Unsettled Question.**
  This procedure will never tell you **how to weigh the unmeasurable.** You stated your interventions differ sharply in measurability. This audit ensures you don't double-count the measurable ones (Module 3) or contradict yourself about them (Module 1). It does not, and cannot, tell you how to compare a measurable intervention (e.g., bednets) against an unmeasurable one (e.g., movement building) without forcing the latter into a probabilistic box that may distort its value. That remains a judgment call no algorithm can audit.

  **Recommendation:** Attach this audit log to your quarterly memo. If a "Handoff" verdict is reached, do not hide it. State clearly: *"Optimization suspended. Decision requires ethical resolution, not mathematical allocation."* This protects your team from being the bearer of bad logic disguised as math.
