prompt: |-
  For years now my day job has been optimisation — constrained search, multi-objective problems, a fair bit of MDL and complexity-penalty work — and I've been trying to get Leibniz's best-of-all-possible-worlds idea straight by putting it into the language I think in. Do the translation for me, as faithfully as you can, and then tell me what doesn't make it across.

  Set it up the way I'd set up a design problem: possible worlds as a design space, compossibility as a joint-feasibility constraint (things can each be possible on their own and still not go together), the best world as the global optimum of some objective, his simplicity-of-hypotheses-versus-richness-of-phenomena trade-off as a regularised objective with a complexity penalty, evil as whatever the optimum has to contain in order to be the optimum. Please don't quietly turn him into a Bayesian with a prior — I want the translation honest about what's his and what's mine.

  Then the bit I actualy care about: the leftovers. What in his position has no counterpart in my vocabulary at all, and where did you have to fudge it to get it across? Four things I'm suspicious of: (1) he seems to need the optimum to be unique, whereas ties are ten a penny in my world and nobody treats them as a crisis; (2) he needs the weights in the trade-off to be non-arbitrary, and I've never met a scalarisation that wasn't arbitrary; (3) he wants a maximum over an infinite set of possible worlds, and I'd want boundedness or compactness before I belived in one; (4) 'best' in his mouth looks like a moral claim, not just a maximal one. For each, say whether it's a hole in my framework, something he's smuggled in, or a genuine disagreement — and then tell me straight whether the whole thing collapses into 'there's an objective function, God evaluates it, done', or whether there's work being done in the argument that I simply can't see from where I'm standing.
