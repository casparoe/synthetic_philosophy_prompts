answer: |-
  Dear colleague, I have been thinking over your request for the seminar specifications, and I agree entirely that we must fix the criteria before the room begins to vote. If we do not agree on what counts as a settlement, the debate will merely shift to the meta-level of whether the settlement was fair. You asked for a specification that a theory of linguistic understanding must deliver to settle the question of large language models without presupposing the answer, and you asked for this in the form of requirements that survive scrutiny rather than merely accumulating literature. I have distilled this down to six requirements. I am not certain that this list is complete, but I am confident that any theory failing these would be inadequate for the specific disputes we face.

  The first requirement is the Robustness Condition. A theory must provide a principled distinction between competence that survives irrelevant perturbations and performance that collapses under them. This is demanded by the failure patterns we observe, where a system may affirm an entailment in one phrasing but deny it when premises are reordered or irrelevant details are added. A theory satisfies this condition only if it can explain why some behavioural successes count as understanding while others, indistinguishable in output accuracy but fragile under variation, do not. The second requirement is the Counterfactual Condition. A theory must specify whether understanding requires the capacity to adjust linguistic usage in response to non-linguistic changes in the world. This is forced by the comparison case of the person blind from birth who handles colour vocabulary competently versus the model trained only on text. If the theory grants understanding to the blind person but denies it to the model, it must identify a difference in counterfactual tracking that does not rely on mere causal history but on the structure of the dependency between use and world. The third requirement is the Individuation Condition. A theory must identify the specific locus of understanding, stating clearly whether the bearer is the model weights in isolation, the model plus its prompt, the model with retrieval tools, or the model with a human in the loop. This is required because the intuitive verdict shifts across these configurations; a theory cannot allow the verdict to float depending on how we set up the demo, but must fix the unit of analysis beforehand.

  The fourth requirement is the Non-Triviality Condition. A theory must admit silicon as a substrate while excluding trivial systems like lookup tables or thermostats. This is demanded by the need for substrate neutrality that does not beg the question against artificial systems, coupled with the intuition that a table mapping inputs to outputs does not understand even if it passes every behavioural test. A theory satisfies this only if it offers a structural or functional constraint that distinguishes generative competence from tabular retrieval without appealing to biological essentialism. The fifth requirement is the Process Condition. A theory must declare whether the training signal, specifically next-token prediction on a text corpus, is constitutive of the system's cognitive status or irrelevant to it. This is forced by the distinction between retrieving a memorized answer and predicting the outcome of a setup never seen before; if the process of learning determines the capacity for generalization, the theory cannot treat the training objective as neutral. The sixth requirement is the Gradability Condition. A theory must state whether understanding is a binary property or comes in degrees, and if the latter, how competence in a narrow register relates to competence in language as such. This is required because we observe systems that are fluent in code but fail at simple natural language pragmatics, and a theory must explain whether this is a lack of understanding or merely a lack of scope.

  Now I must offer a verdict on this list, distinguishing what is non-negotiable from what is merely a commitment of one camp dressed up as a neutral criterion. The Robustness Condition and the Individuation Condition are non-negotiable for any theory worth the name. Without Robustness, we cannot distinguish intelligence from coincidence, and without Individuation, we do not know what we are evaluating. These are methodological necessities rather than metaphysical claims. The Counterfactual Condition and the Process Condition, however, are commitments of opposing camps. Internalists and functionalists will reject the Counterfactual Condition as demanding too much external contact, while grounding-first advocates will treat it as essential. Similarly, computationalists will argue the Process Condition is irrelevant provided the functional role is satisfied, whereas embodiment theorists will insist the training signal precludes understanding. The Non-Triviality Condition is widely accepted in principle but contested in application, as there is no consensus on where the line between complex computation and trivial lookup lies. The Gradability Condition is also contested; some hold understanding is all-or-nothing, while others see it as a spectrum, and a theory must pick a side rather than hedging.

  I am now compelled to address whether some subset of these requirements is jointly unsatisfiable, and I believe there is a strong argument that the Counterfactual Condition, the Individuation Condition, and the Process Condition form an impossible triad when applied to current large language models. If a theory insists on the Counterfactual Condition, it requires that understanding entails a dependency on non-linguistic worldly states. If it insists on the Individuation Condition such that the model weights are the bearer of understanding, then the system is isolated from the world by definition, having been trained only on a corpus. If it further insists on the Process Condition such that the training signal does not matter for understanding, then there is no mechanism by which the isolated model could satisfy the Counterfactual Condition. You cannot have a system that understands by tracking the world, is individuated as a text-only model, and yet whose training on text-only data is irrelevant to its understanding. One of these must give. Either the model does not understand because it fails counterfactual tracking, or the model is not the bearer of understanding because it lacks the world-contact, or the training process does matter and thus precludes understanding given the text-only signal. I am not certain this holds for all possible architectures, but for the case of systems trained only to predict the next stretch of text with no effectors, this tension appears unresolvable. A clean impossibility result here would suggest that the debate persists not because we lack evidence, but because the constraints we are imposing are logically inconsistent for this specific class of systems.

  Finally, I will briefly note how the main families of view fare against this finished list. Behaviourist or dispositional accounts satisfy the Robustness Condition poorly, as they often equate output stability with understanding, and they fail the Counterfactual Condition by ignoring the source of the disposition. Grounding-first accounts satisfy the Counterfactual Condition but struggle with the Non-Triviality Condition if they rely on biological causal history, and they often fail Substrate Neutrality. Functionalist and computationalist accounts handle the Non-Triviality and Substrate Neutrality conditions well but typically fail the Counterfactual Condition and stumble on the Process Condition by treating the training signal as irrelevant. Degree-theoretic accounts satisfy the Gradability Condition naturally but often lack the precision to satisfy the Individuation Condition, as degrees of understanding blur the boundaries of the system. The deflationary line that the question is ill-posed avoids the impossibility result entirely but fails to provide the adjudication the seminar requires, effectively dissolving the problem rather than solving it. I hope this specification serves your seminar well; if the participants cannot agree on these six points, I doubt they will agree on a verdict, and if they do agree on these, they may find there is no verdict to be had.
