answer: |-
  You have stumbled directly onto the **Discursive Dilemma** (sometimes called the Doctrinal Paradox). It is the judgment-aggregation equivalent of the uncertainty principle: not a measurement error, but a structural limit on what can be known or decided collectively.

  You asked for the desiderata—the job description for any aggregation method—followed by the bad news that the job description is impossible to fulfill. Here is the breakdown.

  ### The Desiderata (The Requirements)

  You want a function that takes individual sets of judgments and outputs a single set of group judgments. To be considered fair and rational, the method should satisfy these five conditions:

  1.  **Universal Domain (Completeness of Input)**
      *   **The Requirement:** The method must accept *any* logically possible combination of individual views. You cannot forbid certain patterns of opinion in advance.
      *   **The Reason:** In a free panel, a member might think the method is sound but the sample small; another might think the opposite. If your rule breaks when people think "oddly," it isn't a general decision procedure; it's a filter for conformity.
  2.  **Collective Rationality (Consistency of Output)**
      *   **The Requirement:** The group's final set of judgments must be logically consistent.
      *   **The Reason:** If the group asserts "Method is Sound," "Sample is Adequate," and "Do Not Fund" (when the rule is Fund iff Sound + Adequate), the group is lying. It holds contradictory beliefs. An agent that contradicts itself cannot act coherently.
  3.  **Anonymity (Equality)**
      *   **The Requirement:** The identity of the voters does not matter. If you swap the ballots between you and your colleague, the outcome remains the same.
      *   **The Reason:** This rules out dictatorship. If the method weights your vote higher than your colleague's without justification, it is hierarchical, not democratic.
  4.  **Unanimity Preservation (Responsiveness)**
      *   **The Requirement:** If every single member agrees on a proposition, the group must adopt that judgment.
      *   **The Reason:** If all three of you agree the sample is adequate, and the panel declares it inadequate, the procedure is ignoring reality as perceived by the entire group. It renders the voting moot.
  5.  **Proposition-wise Independence (Systematicity)**
      *   **The Requirement:** The group's judgment on any specific question (e.g., "Is the sample adequate?") must depend *only* on the individual votes regarding that specific question. It should not depend on how people voted on *other* questions (e.g., "Is the method sound?"). Furthermore, the same voting rule (e.g., majority) should apply to all questions.
      *   **The Reason:** This prevents manipulation and ensures issue-by-issue accountability. If the verdict on "Sample Size" changes depending on how people voted on "Methodology," then the questions are not being judged on their merits but as bargaining chips. It keeps the reasoning transparent.

  ### The Impossibility Result

  Here is the part you suspected: **These five requirements are jointly impossible.**

  This is the **List-Pettit Theorem** (2002). It is the direct descendant of Arrow's Impossibility Theorem, but applied to logical propositions (True/False) rather than preference rankings (A > B > C).

  If your agenda contains logically connected propositions (like $P$, $Q$, and $P \land Q \to R$), no aggregation method can satisfy Universal Domain, Collective Rationality, Anonymity, Unanimity, and Independence simultaneously.

  **Which one is doing the most work?**
  **Proposition-wise Independence.**
  This is the killer constraint. It forces you to vote on the premises (Method, Sample) separately from the conclusion (Fund). By isolating the questions, you sever the logical link between the premises and the conclusion at the aggregation stage. You ensure that the group's view on $P$ is determined only by votes on $P$, but logic dictates that the view on $R$ is determined by $P$ and $Q$. You cannot satisfy both the voting isolation and the logical connection simultaneously when individuals disagree.

  ### Non-Negotiable vs. House Preferences

  *   **Non-Negotiable:** **Collective Rationality** and **Anonymity**. If you drop Rationality, the panel is incoherent (it says Yes and No simultaneously). If you drop Anonymity, you have a dictator (one person decides). Most philosophers and scientists regard these as constitutive of a "group agent."
  *   **House Preferences:** **Proposition-wise Independence**. This is the usual casualty. Many argue that in complex decisions, you *cannot* judge premises in isolation from the conclusion. However, dropping it opens the door to "log-rolling" (I'll vote your way on the Sample if you vote my way on the Method).

  ### Evaluating Your Two Procedures

  You asked how the two obvious strategies fare against this list. Neither passes, but they fail in different places.

  **1. Premise-Based Procedure (Your current rule)**
  *   *Method:* Vote on Method, Vote on Sample, Derive Funding decision logically.
  *   *Performance:*
      *   **Collective Rationality:** **Pass.** The group will never contradict itself. If the group says Method=Yes and Sample=Yes, it must say Fund=Yes.
      *   **Anonymity/Unanimity:** **Pass.**
      *   **Universal Domain:** **Pass.**
      *   **Proposition-wise Independence:** **Fail.** (Actually, it satisfies independence on the premises, but fails the spirit of responsiveness on the conclusion).
      *   **The Fatal Flaw:** It violates the **Majority Principle on the Conclusion**. As you saw, the majority voted "No Fund" (2–1), but the procedure output "Fund." It privileges the consistency of the *reasons* over the will of the *members* regarding the outcome.

  **2. Conclusion-Based Procedure (Direct Vote)**
  *   *Method:* Ignore the sub-questions; vote straight up-or-down on "Fund."
  *   *Performance:*
      *   **Collective Rationality:** **Fail.** This is the hidden cost. If you vote "Fund" (2–1), but later someone asks "Why?", and you check the records, you might find the majority also thinks the Method is Shaky and the Sample is Small. The group has decided to Fund a project it collectively believes is flawed. The group's *set* of beliefs is inconsistent, even if the *decision* is clear.
      *   **Anonymity/Unanimity/Independence:** **Pass.**
      *   **The Fatal Flaw:** It sacrifices the integrity of the group's reasoning. It allows the group to hold contradictory views (Fund this / This is bad science) as long as they don't look at them side-by-side.

  ### The General Picture

  You asked if your procedure is a bug or a feature. It is a **feature of logic**.

  In marine biology, if your instrument gives conflicting readings, you check the calibration. In social epistemology, if your procedure gives conflicting readings, you check the constraints. The "bug" is the expectation that a group can be perfectly democratic, perfectly consistent, and perfectly issue-independent all at once.

  You have to choose which desideratum to sacrifice.
  *   If you value **consistency of record** (the foundation wants to be able to defend *why* it funded something), you must use the Premise-Based procedure and accept that you might occasionally fund against the majority's gut feeling.
  *   If you value **majoritarian will** (the foundation wants to do what the majority of reviewers actually want), you must use the Conclusion-Based procedure and accept that the official record of *reasons* may not support the decision.

  There is no patch. There is only the trade-off. Your nagging sense that you skipped a chapter was correct: the chapter is on the limits of rationality when it is distributed across more than one head.
