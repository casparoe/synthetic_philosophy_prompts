answer: |-
  **Question 1 (Correlation: Shared Priors)**
  "The standard unilateralist model assumes errors are independent, but the community you're targeting reads the same blogs, hires from the same pipeline, and runs the same models. If our priors are already heavily correlated, doesn't the 'curse' mostly vanish, leaving just ordinary shared fallibility? If we're all wrong together, conformity doesn't fix the error, it just scales it."

  *   **Follow-up:** If he argues that independence is just an idealization and the logic still holds: "Okay, then quantify it. How much correlation does it take to break your result? And can you name a single real-world longtermist decision where the actors' error terms were uncorrelated enough to fall under that line?"

  **Question 2 (Correlation: The Echo Chamber)**
  "Let's say we accept some independence. Your norm requires me to predict what others will conclude. But if everyone is using this norm to decide whether to act, aren't we just modeling each other's modeling? Doesn't that create a feedback loop where we conform not because the evidence is strong, but because we expect everyone else to be paralyzed by the same norm?"

  *   **Follow-up:** If he retreats to the claim that this only applies to *irreversible* actions: "Is the shift in community norms itself irreversible? Because if adopting your norm changes the culture permanently, then by your own definition, the decision to adopt the norm is subject to the curse. Who decides that?"

  **Question 3 (Self-Application: The Adoption Cost)**
  "Treating this norm as a public good: complying with it is costly for the individual who sees a high-EV action but abstains because others haven't agreed. That abstention is a unilateral sacrifice. Why should the most conscientious actors bear the highest opportunity cost, and doesn't that select against the very people you want following the rule?"

  *   **Follow-up:** If he says the cost is negligible compared to the risk of catastrophe: "Negligible to whom? If the cost is high enough to matter, you've created a second-order unilateralist curse where the 'action' is defecting from the norm to save the day. Do you have a mechanism to compensate the conformists, or is it just pure altruism?"

  **Question 4 (Self-Application: Incentives to Defect)**
  "Suppose the norm is established. I'm looking at a project where the payoff is massive if true, zero if false. If everyone else is conforming, I know I'm the only one left who might catch the true positive. Doesn't the marginal value of breaking the norm skyrocket exactly when the norm is working best? You've built a system where the incentive to defect is inversely proportional to the number of defectors."

  *   **Follow-up:** If he insists this is off-model because the action is reversible: "Reversibility is a spectrum. Even if I can undo the action, can I undo the *precedent*? If I break the norm and succeed, I've proven the norm was too conservative. Haven't I just permanently lowered the barrier for the next person?"

  **Question 5 (Binary Framing: Good-Once-Bad-Many)**
  "Your setup treats action A as either Good or Bad. But consider geoengineering or capability release: it might be good if done once by a careful actor, but catastrophic if done twice. The curse isn't about doing a 'bad' thing; it's about crossing a threshold. How does a binary conformity norm handle cases where the first unilateral act is beneficial, but the second is the disaster?"

  *   **Follow-up:** If he says the first act is irreversible so the norm applies: "So you're arguing we should never test the threshold? If the only way to know if we're in the 'good once' regime is to act, your norm demands we remain ignorant. Is permanent uncertainty the price of safety here?"

  **Question 6 (Synthesis: The N=1 Endpoint)**
  "The probability of the curse scales with the number of actors. The logical endpoint of minimizing that probability is minimizing the number of deciders. Does your argument imply that the optimal solution isn't a norm, but a monopoly—a single designated decider with no competition to ensure no unilateral errors occur?"

  *   **Follow-up:** If he balks at the monopoly conclusion: "Then you have to weigh the variance of a single fallible pair of hands against the error rate of a distributed group. If you reject the monopoly, you're admitting that some level of unilateralism is desirable. Where is the line where the risk of stagnation outweighs the risk of the curse?"

  **Question 7 (Synthesis: Defining the Decider)**
  "If we aren't going for a monopoly, who counts as an 'actor' in your model? Is it nations, corporations, or individual researchers? Because if it's individuals, the number is huge and the curse is rampant. If it's nations, the number is small and the curse is rare. Are you solving a statistical problem or just redefining the unit of agency to make the numbers work?"

  *   **Follow-up:** If he says it depends on the capacity to act: "Capacity is also correlated. The only people who *can* act unilaterally on high-stakes issues are the ones with the same training and resources. We're back to correlation. Is there any version of this model where the cure isn't worse than the disease?"

  **Question 8 (Synthesis: The Trade-off)**
  "Ultimately, you're trading Type I errors (doing a bad thing) for Type II errors (failing to do a good thing). In a longtermist framework where existential risk is the priority, failing to act can be just as terminal as acting wrongly. Why does your model weight the sin of commission so much heavier than the sin of omission?"

  *   **Follow-up:** If he returns to the 'irreversible' defense one last time: "We've established that norms, precedents, and opportunities are all path-dependent. If nothing is truly reversible, your model applies to everything. If nothing is truly irreversible, it applies to nothing. Which is it?"

  **Question 9 (Closing: The Net Benefit)**
  "Let's look at the historical record. How many existential catastrophes have been caused by a unilateralist acting against the consensus, versus how many opportunities were lost because the consensus was wrong? Do you have empirical evidence that the curse is the binding constraint, rather than just a theoretical possibility?"

  *   **Follow-up:** If he says the data is sparse because the disasters were averted: "That's unfalsifiable. If success looks like inaction, and disaster looks as a near-miss, you've built a theory that can't be tested. Without a way to measure the counterfactual, isn't this just a heuristic for caution dressed up as decision theory?"

  **Question 10 (Closing: The Final Bullet)**
  "If I understand you correctly, you'd rather have a world where nothing happens than a world where someone acts alone and risks being wrong. Is that a fair summary? You are willing to accept global stagnation as the premium we pay to avoid the unilateralist curse."

  *   **Follow-up:** If he hesitates or qualifies: "Then you don't actually believe the norm is absolute. You believe it's a weighting factor. So why present it as a categorical fix? Why not just say 'update your priors for correlation' and leave it at that?"
