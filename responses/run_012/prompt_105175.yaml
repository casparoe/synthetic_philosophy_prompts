          *   *Dan:* Argues you *can* reason about it. Use reports, regret avoidance, identity goals, trust in decision procedure. Reports aren't circular, just different vantage points. Rhea's logic implies *no* major life changes are rational (absurdum). "Owning" is vague.
      *   **Task:** Go through the exchange move-by-move, evaluate who is right/wrong on specific bits (rating from clearly mistaken to clearly right), and identify what both are missing.
