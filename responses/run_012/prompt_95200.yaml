      *   *Refinement on "Neutral":* Emphasize that "Neutral" isn't just "unknown," it's "unknown but crucial for the inference."

  9.  **Final Review against constraints:** No citations. No reading list. A couple of pages (approx. 800-1200 words).

  *(Self-Correction on Word Count)*: "A couple of pages" usually implies around 800-1000 words single-spaced or 500-600 double-spaced. I will aim for a dense, substantive 1000 words to ensure depth without fluff.

