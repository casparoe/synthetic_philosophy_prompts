      *   *Positive:* Rising power vs. Established power, structural stress, fear/interest/honor.
      *   *Negative:* Nuclear weapons, economic interdependence, global institutions (UN/WTO), non-ideological (mostly) vs. Ideological.
      *   *Neutral:* Inevitability of war, rationality of actors, domestic political constraints.
      *   *The Slide:* Treating war as "structural inevitability" (Positive) when it's actually a contingent outcome (Neutral). Ignoring the Negative (nukes/ trade) because the Structural Positive is so compelling.
      *   *Verdict:* Same slide happens. The apparatus reveals the same epistemic overreach.

