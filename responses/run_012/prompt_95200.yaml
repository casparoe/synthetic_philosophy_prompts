      *   *Source:* 1938 Munich Agreement (Appeasement of Nazi Germany).
      *   *Target:* 1964-65 Vietnam Escalation (Containment of Communism).
      *   *Mapping:*
          *   Aggressor: Hitler $\rightarrow$ Ho Chi Minh/China/USSR.
          *   Appeaser: Chamberlain $\rightarrow$ LBJ/US (if they pull out).
          *   Territory: Sudetenland $\rightarrow$ South Vietnam.
          *   Stakes: European domination $\rightarrow$ Domino Theory (SE Asia domination).
          *   Action: Standing firm $\rightarrow$ Bombing/Troops.
      *   *Positive Analogy (Known Matches):* Aggressive expansionist ideology, demand for territory, democratic powers hesitant to fight, sequential aggression (Rhineland/Austria -> Manchuria/Korea).
      *   *Negative Analogy (Known Differences):* Geography (Europe vs. SE Asia), Technology (WWII vs. Jungle War), Nature of Regime (Fascist industrial state vs. Nationalist/Communist insurgency), Allies (Clear alliances vs. Fractured Communist bloc).
      *   *Neutral Analogy (Unknown/Contested):* *This is the crux.* Will aggression stop if checked? Is the motivation hegemonic domination or national unification? Will backing down lead to a world war? Is the adversary rational in the same way Hitler was?

  3.  **Identify the "Slide" (Neutral to Positive):**
      *   The hawks (Rusk, Bundy, Johnson) treated the *motivation* of the North Vietnamese as identical to Hitler's (insatiable global conquest) rather than nationalist unification.
      *   They treated the *consequence of withdrawal* as inevitably leading to WWIII (Domino Theory certainty) rather than a probable regional shift.
      *   They treated the *nature of the conflict* as conventional state aggression rather than civil war/insurgency.
      *   *Epistemic Work:* The analogy did the work of proving the *outcome* (war is necessary) by assuming the *causal mechanisms* (appeasement causes war) were identical without testing them in the neutral zone.

  4.  **Evaluate the Apparatus:**
      *   *Value:* It moves beyond "Analogy is bad" to "Analogy is heuristic but risky." It pinpoints *where* the reasoning broke (the neutral zone). It shows that the error wasn't seeing a similarity, but failing to investigate the similarity.
      *   *Weakness:* It's static. It doesn't explain the *psychological/political pressure* that forces the slide. Why did they promote Neutral to Positive? (Cognitive ease, political cover, bureaucratic momentum). The apparatus describes the structure of the error, not the etiology.

