      *   *Better Solution (for philosophical impact):* Use a "Chinese Room" style setup but distributed. One person is the "Input," one is the "Output," the rest are "Neurons/Registers."
      *   *Refinement:* To make it feel like a "mind emerging," the rules need to allow for some combinatorial flexibility, not just rigid lookup. Let's make it a "Pass the Message" game where context accumulates.
