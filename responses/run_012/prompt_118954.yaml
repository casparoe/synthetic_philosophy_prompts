  (One more thought on the "Fluency"): If I tell the user to pre-script the answers, does it ruin the "feel there is a mind"? Actually, it enhances the philosophical point. The students *know* it's scripted rules, yet the output is coherent. That *is* the Chinese Room. I will emphasize this. The "mind" is an illusion created by the observer, not the system.

