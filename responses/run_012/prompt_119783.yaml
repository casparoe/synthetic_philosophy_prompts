      *   **Communicative Act:** What did it say? "Justice is back." "The law is supreme." But also "Death is a choice."
      *   **Camus's Blind Spots:** The American legal suspension (moratorium), the specific Utah context (firing squad, distinct from guillotine), the media industrial complex (Mailer). Camus assumes a rational state; Gilmore reveals a theatrical state.
      *   **Conclusion:** Is it an anomaly? It clarifies the weight. The strongest argument isn't about the prisoner's suffering (contingent), but about the state's moral corruption (intrinsic).

  7.  **Refining and Polishing:**
