          *   Judgment/Atonement: Survives (State still kills).
          *   Life/Error: Survives (Principle remains).
          *   Coarsening: Confirmed (Media circus).
      *   *The Suicide Concession:* This is crucial. Camus says if a prisoner wants to die, let him starve/kill himself, but the state shouldn't do it. Why? Because the *act* of execution is a ritual of power, not just a cessation of life.

