          1.  Deterrence (lost force, especially when private).
          2.  Premeditated Cruelty (state deliberation exceeds murderer's).
          3.  Secular Atonement/Absolute Judgment (no human has absolute innocence to judge; removes chance for atonement).
          4.  Life Imprisonment (reversible error, harsher than death).
          5.  Social Coarsening (practice coarsens society).
      *   **Task:** Run analysis in both directions (apply Camus to Gilmore, apply Gilmore to Camus).
      *   **Key Pressure Point:** The "willing condemned man" (volunteer).
      *   **Specific Questions to Address:**
          *   Which arguments survive a volunteer? Which do not?
          *   Is Camus's abolitionism intrinsic or contingent?
          *   Address Camus's concession on suicide (if state doesn't prevent prisoner suicide, why not kill a willing prisoner?).
          *   Treat execution as a communicative act (what did it communicate?).
