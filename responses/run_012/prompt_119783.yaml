      *   *Self-Correction during drafting:* Make sure not to conflate Camus's existentialism with his penal philosophy. Stick to "Reflections on the Guillotine." Ensure the distinction between "contingent" (based on prisoner experience) and "intrinsic" (based on state morality) is clear.
      *   *Specific focus:* The prompt asks to say which arguments survive. I need to be explicit.
          *   Deterrence: Fails.
