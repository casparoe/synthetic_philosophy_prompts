  2. You must represent source sensitivity rather than just probability weights, otherwise you cannot explain why I prefer betting on tomorrow's weather to a random number generator even when I assign them equal likelihoods.
  3. The theory must allow ambiguity attitudes to reverse between gains and losses, because dropping this leaves you unable to fit the data where agents dodge ambiguous gains but reach for ambiguous losses.
  4. You cannot maintain both dynamic consistency and stable ambiguity attitudes, so I sacrifice dynamic consistency because the clash arises from how information updates ambiguity itself, and insisting on both renders the theory empty.
  5. Violating the Sure Thing Principle is the single requirement that does the most to rule out popular theories, since keeping it forces every urn case into a single probability measure that erases the distinction between risk and uncertainty.
