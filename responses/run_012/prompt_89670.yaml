  Your instructor's strongest methodological commitment, evidenced by **Case 8**, is the rejection of speculative indirect harms. In Case 8, she permitted an act that might degrade relationships (a core social utility) because the link was "too speculative." To forbid the robot case, she would have to argue that the link between robot use and real-world violence is *not* speculative, despite the prompt stating the risk is "contested."

