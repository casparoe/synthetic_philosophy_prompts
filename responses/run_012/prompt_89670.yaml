      *   *Reasoning:* Although the harm is speculative, the *content* of the act (simulated protest/distress) triggers the proviso. The instructor would argue that the risk of desensitization to *suffering* is empirically weightier than the risk of *inattentiveness* in Case 8, warranting a prohibition to secure long-term social utility (safety/security).

