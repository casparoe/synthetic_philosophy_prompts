      *   *Reasoning:* The robot is not sentient (no direct pain). The user's pleasure is certain and intense. The risk of desensitization is explicitly "contested" and "speculative," identical in epistemic status to the "inattentiveness" risk in Case 8. Under this rule, consistency demands she reject the speculative risk just as she did in Case 8.

