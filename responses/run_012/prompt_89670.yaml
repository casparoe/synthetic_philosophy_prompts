  Here is the reconstruction of the decision rules that fit her prior verdicts, their predictions for the robot case, and an analysis of her likely commitment structure.

  ### Candidate Decision Rules

  Two distinct decision rules fit the eight prior verdicts equally well but diverge on the robot case.

  **Rule 1: The "Direct & Certain Sentient Harm" Principle**
  *   **Formulation:** An act is forbidden if and only if it produces net pain for sentient beings that is (a) direct or (b) highly probable and identifiable. Speculative, indirect, or statistical risks of future harm are discounted to zero when weighed against certain, intense present pleasure. "Disgust" from non-participants counts only if the act is forced upon their attention (public).
