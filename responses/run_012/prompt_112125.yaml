  **Version 1: The Oscillating Scale (Underdetermined)**
  Place a high-precision digital scale on a table, initialized to 0.00 kg at $t=0$. You have an infinite supply of identical 1 kg weights and a robotic arm capable of placing or removing them instantaneously at specific moments. Using the time schedule $t_n = 1 - 1/2^n$ (so operations occur at $t=1/2, 3/4, 7/8, \dots$), the arm adds a 1 kg weight if $n$ is odd and removes a 1 kg weight if $n$ is even. During every interval between steps, the scale reading is stable at either 1.00 kg or 0.00 kg, oscillating forever as $t$ approaches 1. Because the mass added or removed is constant, the physical state of the scale never converges to a single value; at $t=1$, the rules of the task specify the history completely but leave the final reading logically underdetermined—it could be 0 or 1, and nothing in the physical setup dictates which.

  **Version 2: The Damping Scale (Determined)**
  Use the exact same scale, robotic arm, and time schedule $t_n = 1 - 1/2^n$, but change exactly one feature: the mass of the weights decreases geometrically. At each step $n$, the arm adds $(1/2^n)$ kg if $n$ is odd and removes $(1/2^n)$ kg if $n$ is even. The intermediate readings oscillate endlessly (0.5, 0.25, 0.375, 0.3125, \dots) and never settle into a constant value before $t=1$. However, because the magnitude of the change shrinks with every step, the total mass on the scale forms a convergent alternating series that sums to exactly 1/3 kg. Unlike the first version, continuity of mass dictates that the scale cannot jump from the limit of the sequence to a different value instantaneously, so the final state at $t=1$ is physically determined to be 1/3 kg despite the infinite oscillation.

