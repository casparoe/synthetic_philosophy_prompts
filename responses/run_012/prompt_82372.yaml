  (b) **The Predictions:** Rule 1 says Priya donates (family fear is emotional). Rule 2 says she doesn't (caregiving burden is concrete welfare loss).

  (c) **Rosa's View:** Rosa says Priya donates. She classifies the family's suffering as Rule 1 territory. Unlike Ana's sleep, which Ben directly stole via noise waves, the family's burden is contingent. They choose to nurse her; their terror is internal. Rosa sees this as the Dad's embarrassment redux: you don't get to veto someone's body because their choices stress you out. The "queue" argument is speculative; the "nursing" argument assumes they must intervene. For Rosa, autonomy holds unless the harm is direct and unavoidable, like noise hitting a neighbor's ear.

  (d) **The Splitter:** Priya wants to base-jump without a parachute (survivable but high injury risk). She says, "My body." Her family says, "If you break your spine, we become full-time nurses for decades." This isolates the "burden of care" from medical risk or direct nuisance. If Rosa bans the jump, she admits anticipated caregiving costs count as Harm (Rule 2). If she allows it, she admits family welfare only counts when physically imposed by others, not when volunteered as care (Rule 1).
