answer: |-
  The property you describe in the first case has a received name in the fields of complexity theory and digital physics. The philosophical inference in the second case is widely regarded as a category mistake, though it has notable defenders who argue for a redefinition of determinism itself.

  ### 1. The Received Name: Computational Irreducibility

  The term you are looking for is **Computational Irreducibility**.

  It was popularized and rigorously defined by Stephen Wolfram in *A New Kind of Science* (2002), though the concept has roots in recursion theory and algorithmic information theory (specifically relating to Kolmogorov complexity).

  **Definition:** A system is computationally irreducible if there exists no algorithmic shortcut to determine its state at time $t$ that requires fewer computational steps than the system itself takes to evolve to $t$. In other words, the only way to know the outcome is to simulate the process step-by-step.

  This matches your description precisely:
  *   **Deterministic:** The rules are fixed; there is no randomness.
  *   **Non-chaotic (in your sense):** It does not rely on sensitivity to initial conditions. Even with perfect knowledge of the start state, you cannot skip steps.
  *   **Unpredictable without execution:** An entity with unlimited memory and speed cannot "calculate" the answer faster than the system produces it, because the calculation *is* the system's evolution.

  ### 2. Distinctions from Neighboring Concepts

  To isolate this property, we must distinguish it from the two concepts you mentioned: chaotic sensitivity and ontic chance.

  **Vs. Chaos (Sensitive Dependence on Initial Conditions)**
  *   **Chaos** is a property of *trajectories* in a phase space. In a chaotic system, two points separated by an infinitesimal distance $\epsilon$ at $t=0$ will diverge exponentially by time $t$. Prediction fails here because *measurement is never perfect*; we cannot know the initial state with infinite precision.
  *   **Computational Irreducibility** is a property of *computation*. Even if you know the initial state with infinite precision (e.g., a specific integer configuration in a Cellular Automaton), there is no mathematical formula (closed form) that maps $t=0$ to $t=10^{100}$ directly. You must compute the intermediate states.
  *   **The Difference:** Chaos makes prediction impossible *practically* (due to finite precision). Irreducibility makes prediction impossible *logically* (due to the lack of a compression algorithm). A system can be non-chaotic (stable, no divergence) but still computationally irreducible.

  **Vs. Ontic Chance (Indeterminism)**
  *   **Ontic Chance** implies that the future is not fixed. At a given node, multiple futures are physically possible (e.g., quantum decay). The universe "rolls a die."
  *   **Computational Irreducibility** implies the future is fixed, but the *information* about that future is not available at the start. The information is *generated* by the process, not merely revealed.
  *   **The Difference:** In a chance system, running the system twice with identical initial conditions could yield different results. In an irreducible deterministic system, running it twice yields the exact same result, but you couldn't have known what that result was without running it.

  ### 3. The Philosophical Inference: Mistake or Defended?

  You ask whether the inference from "not knowable in advance" to "not determined in advance" is a mistake.

  **The Standard View: The Epistemic Fallacy**
  In classical metaphysics and philosophy of science, this inference is considered a mistake, specifically a confusion of **epistemology** (what we can know) with **ontology** (what exists).
  *   **Determinism** is the claim that the state of the world at $t_2$ is necessitated by the state at $t_1$ plus the laws of nature.
  *   **Predictability** is the claim that an observer can compute $t_2$ from $t_1$.
  *   Standard logic holds that Determinism does not entail Predictability. Therefore, Unpredictability does not entail Indeterminism. To argue otherwise is to commit a modal fallacy. Laplace's Demon is a thought experiment about ontology, not a promise that such a demon could practically exist.

  **The Defenders: Redefining Determinism**
  However, there are serious defenders who argue that if prediction is impossible *in principle* (not just practically), the label "determined" loses its scientific or metaphysical utility.
  *   **Karl Popper:** In *The Open Universe*, Popper argued that if a predictor is part of the system it is predicting, self-referential limits (related to Gödel's incompleteness and Turing's halting problem) make prediction impossible. He suggested that this intrinsic unpredictability undermines the coherence of strict determinism, effectively opening the door to an "open future."
  *   **Ilya Prigogine:** In *The End of Certainty*, Prigogine argued that in complex, irreversible systems, the trajectory is not a given line but a construction. He posited that time is not a parameter describing a fixed block universe but a mechanism of creation. For Prigogine, irreducibility implies that the future is literally being created, not just revealed.
  *   **Open Futurism:** Some contemporary metaphysicians argue that if the truth value of a future contingent proposition cannot be grounded in present facts (because the computation hasn't happened), then the proposition is neither true nor false yet. This is not because of randomness, but because the *facts* do not yet exist.

  **Verdict:** The inference is logically invalid under classical definitions, but it becomes valid if one adopts a **verificationist** or **operationalist** definition of reality (i.e., "if it cannot be predicted even in principle, it is not determined").

  ### 4. A Coined Term for the Metaphysical Context

  While "Computational Irreducibility" is the correct technical term for the first case, it carries baggage from computer science that may feel reductionist in a metaphysical discussion. If you wish to discuss this property in the context of the "open future" without implying the universe is a digital computer, I propose the term:

  **Causal Incompressibility**

  *   **Definition:** A state of affairs is causally incompressible if the full description of a future event contains more information than the description of its past causes plus the laws of nature, such that the future event cannot be logically derived without enumerating the causal chain itself.
  *   **Distinction:** Unlike *Computational Irreducibility*, which implies a discrete, algorithmic process, *Causal Incompressibility* is neutral regarding the substrate (digital, analog, or metaphysical). It captures the "no shortcut" nature of the causality itself.
  *   **Usage:** "The universe may be deterministic, but if it is **causally incompressible**, then Laplace's Demon is impossible not because of a lack of power, but because the deduction requires the same effort as the creation."

  ### Summary

  1.  **Received Name:** **Computational Irreducibility**.
  2.  **Difference from Chaos:** Chaos is about sensitivity to input; Irreducibility is about the lack of a compression algorithm for the process.
  3.  **Difference from Chance:** Chance implies multiple possible futures; Irreducibility implies one fixed future that is informationally inaccessible until computed.
  4.  **The Inference:** Classically a fallacy (Epistemic vs. Ontic), but defended by Popper and Prigogine under the view that *in-principle* unpredictability negates the meaning of determinism.
  5.  **Coined Term:** **Causal Incompressibility** (for metaphysical contexts where "computation" is too narrow).
