answer: |-
  # Joint Statement on the Moral Authority of Advance Directives

  ## 1. Agreed Structural Claims

  We, the undersigned representatives of the Entrenchment View and the Contemporaneous-Will View, affirm the following structural propositions as the basis for this workshop. These are not substantive concessions, but agreements on the geometry of the problem.

  1.  **Temporal Discontinuity:** A directive is necessarily issued by one temporally located self and applied to a later self who may differ in psychological continuity, values, or capacity.
  2.  **Symmetry of Cases:** The two central cases for any theory are later endorsement (where the directive matches the current will) and later repudiation (where the directive conflicts with the current will). A theory that explains only one of these cases is incomplete.
  3.  **Status of Capacity:** Neither camp may treat the loss of decision-making capacity as a premise it gets for free. The normative significance of incapacity must be argued, not assumed to automatically void or cement authority.
  4.  **Domain of Dispute:** The primary question at issue is the directive's moral authority (whether it creates obligations or permissions), not its legal validity. The relation between moral authority and legal validity is left as an open item where the camps disagree.

  ## 2. Shared Taxonomy of Directive-Types

  We adopt the following taxonomy to clarify the scope of our disagreement. We note where our camps diverge on the relevance of these types.

  *   **Precommitment Directive:** A directive that aims to defeat a choice the writer expects to want to make later (e.g., refusing rescue medication during a manic episode).
  *   **Testamentary Directive:** A directive that settles a matter the writer expects to be indifferent or incompetent about (e.g., burial preferences or care when permanently unconscious).
  *   **Default Directive:** A standing preference that governs unless the present person actively opts out (e.g., a general preference for comfort care unless current distress indicates otherwise).

  **Camp Positions on Taxonomy:**
  *   **Entrenchment View:** Holds that the Precommitment Directive is the paradigmatic case. The disagreement is primarily about this type, as it tests the limits of past authority over future desires.
  *   **Contemporaneous-Will View:** Holds that the Default Directive is the only coherent type in cases of incapacity. We regard the Precommitment Directive as conceptually unstable when the later self lacks capacity, treating the disagreement as fundamentally about whether Precommitment is possible in this context.
  *   **Recorded Disagreement:** The Contemporaneous-Will View denies that the taxonomy carves at the joints regarding Precommitment, arguing that what looks like precommitment is either testamentary (if unconscious) or defeasible (if conscious). The Entrenchment View records this as a substantive disagreement, not merely a terminological one.

  ## 3. Disagreements Table

  | Disagreement | Crux | Agreed Evidence / Case | Entrenchment Prediction | Contemporaneous-Will Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **Ground of Authority:** Is the binding force rooted in the writer's autonomy at the time of writing or the interests/will of the person later? | What makes a binding obligation: historical consent or current welfare? | Cases of Ulysses contracts where a healthy person binds a future sick self who begs for release. | The prior consent binds; releasing the patient violates the author's autonomy. | The current plea defeats; honoring the prior consent violates the experiencer's will. |
  | **Status of Impaired Expression:** Does an expression of preference by a person with impaired capacity count as a will or as a symptom? | By what criterion do we distinguish preference from pathology? | A dementia patient consistently refusing food while expressing joy during feeding attempts. | The refusal is a symptom of pathology; the prior directive to feed governs. | The refusal is a will; the current expression overrides the prior document. |
  | **Epistemic Gap:** Does the writer's ignorance, at the time of writing, of what the later state is like undermine the directive? | Is experiential ignorance a defeater for autonomy or simply the ordinary condition of all planning? | Healthy individuals predicting quality of life with severe disability vs. actual reports from disabled individuals. | Ignorance is ordinary planning risk; the directive stands despite changed perspective. | Ignorance undermines authority; the directive lapses when the reality diverges from the prediction. |

  ## 4. Unresolved Matters and Hypothesis Testing

  **Contested "Agreed" Claims:**
  While we signed Section 1, the Contemporaneous-Will View contests Claim 1 ("Temporal Discontinuity") in spirit. We argue that if psychological discontinuity is severe enough, it is not merely a "later self" but a different subject of experience entirely. The Entrenchment View maintains that numerical identity persists regardless of psychological change. This remains a metaphysical fault line beneath the moral agreement.

  **Verbal Disputes:**
  We identify the term **"Capacity"** as a site of verbal dispute.
  *   **Entrenchment Sense:** A threshold status that, once lost, freezes the moral landscape established prior to loss.
  *   **Contemporaneous-Will Sense:** A gradient of ability to express current interests, where even impaired expression retains some moral weight.

  **Testing the "Different Questions" Hypothesis:**
  The workshop organizer suspected that the two camps are answering different questions—one about *who holds authority over the body* and one about *who is the author of the life*—and that separating these would reduce the disagreement.

  Our drafting shows this suspicion is **false**. Both camps are answering the same practical question: *Who holds authority over the body?* Both camps claim to represent the "author of the life," but they disagree on which temporal slice constitutes the author. The Entrenchment View identifies the author as the narrator who wrote the script; the Contemporaneous-Will View identifies the author as the protagonist living the scene. Because both claims lay title to the same decision space (treatment consent), separating the concepts of "authority" and "authorship" does not dissolve the conflict. The dispute remains substantive because both views demand control over the same physical interventions.

  \answer{Whether moral authority originates in past autonomy or present experience.}
