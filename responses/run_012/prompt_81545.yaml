      *   *Premise 2:* These markers are theory-laden (Borrowed-Criterion Problem). You pick a test based on what you think consciousness *does*.
      *   *Conclusion 1:* "Is X conscious?" is the wrong question.
      *   *Conclusion 2:* The right question is ethical/functional: "Whose valence counts?"
      *   *Premise 3:* Valence and Experience can come apart (Minimal experience w/o valence; Valence-like regulation w/o experience).

  3.  **Address Question (a): POM or Novel Thesis?**
