      *   **Core Claim:** Debates about animal consciousness (fish, bees, octopuses) are measurement problems disguised as metaphysics. Disagreements are about *constitutive vs. correlational* markers.
      *   **Key Concept:** "The Borrowed-Criterion Problem" (tests encode theories of function, so they can't independently verify the theory).
      *   **Proposed Solution:** Shift from "Is it conscious?" to "Which animals have states whose valence we're licensed to weigh?" (Decoupling valence from experience).
      *   **Specific Questions:**
          *   (a) Is this a real thesis or just the Problem of Other Minds (POM) redescribed?
