answer: |-
  The monitor in Room 304 hummed with a steady, green rhythm. Elena watched the numbers scroll across the screen, not looking at the blood pressure or the oxygen saturation, but at the clock in the corner of her eye. She was the procurement coordinator, and her job was to wait. Outside the door, Dr. Lin and his recovery team were scrubbing in, sterile gowns crisp, knives laid out on steel trays. They were ready to move the second the law allowed them to begin.

  Inside, the air was heavier. Dr. Aris Thorne stood by the bedside, his hand resting on the rail. Sarah Gable sat in the visitor's chair, holding her father's hand. Mr. Gable was breathing, but only because the ventilator pushed air into his lungs. The injury to his head had been too severe for recovery, but not severe enough to meet the neurological standard for death. He was dying, but he was not dead. Not yet.

  The protocol was specific. Once support was withdrawn, if the heart stopped within a certain window, donation could proceed. If it took too long, the organs would suffer from lack of oxygen, and the donation would be cancelled. Mr. Gable would still die, but the gift would be lost. Everyone knew this. No one spoke about the window. They spoke only about comfort.

  "Whenever you're ready, Sarah," Thorne said softly.

  Sarah nodded, wiping her cheek with the back of her hand. "He hated machines," she whispered. "He said they made too much noise."

  Thorne signaled to the respiratory therapist. The hiss of the ventilator ceased. The machine exhaled one last time, a mechanical sigh, and then fell silent. Mr. Gable's chest rose once, twice, on its own momentum, then settled into a shallow, irregular rhythm. The alarm on the monitor chirped, noting the change in rate. Thorne silenced it immediately.

  Elena stepped back into the alcove near the door. She had been here before, many times. She had also been in the room next door, last week, where a young man had been declared dead while his chest still rose and fell. In that room, the law had looked at the brain. In this room, the law looked at the heart. The result was the same—a certificate could be signed, a will could be read, organs could be taken—but the path to get there felt different in her bones.

  Here, the silence was something they were allowing. There, the silence was something that had already happened.

  Minutes passed. Mr. Gable's breathing grew agonal, gasping intervals separated by long pauses. Sarah leaned forward, whispering to him. Thorne watched the monitor, not with the hunger of a hunter, but with the vigilance of a witness. He was waiting for the line to go flat. Elena watched him watching. She knew the protocol required a five-minute standoff after the heart stopped to ensure it did not start again on its own. It was a safeguard against auto-resuscitation, a biological flicker that could confuse the moment of passing.

  But the safeguard also highlighted the fragility of the definition. If the heart stopped and stayed stopped, he was dead. If it stopped and started again, he was alive. If it stopped and they shocked it, he would be alive. They would not shock it. The decision had been made hours ago, documented in the chart, agreed to by the family. The heart would not be restarted. Therefore, when it stopped, it would be stopped forever.

  The gasping slowed. The interval between breaths stretched to ten seconds, then twenty. The green wave on the monitor flattened. A single tone began to sound, continuous and low. Asystole.

  Thorne leaned in with his stethoscope. He listened to the chest. He looked at the screen. He looked at the clock.

  Elena felt the shift in the room. The waiting was almost over. The transplant team outside was moving closer; she could hear the shuffle of shoes in the hall. They were poised on the threshold of the legal verdict. Once Thorne spoke, Mr. Gable would transform from a patient into a donor. The duty to care would become the duty to recover.

  Thorne straightened up. He did not look at Elena. He looked at Sarah. "He's gone, Sarah," he said. "I'm going to wait the required time to be sure."

  Sarah nodded, squeezing her father's hand. "Thank you."

  Elena moved to the counter to prepare the paperwork. She needed the exact time of declaration for the log. She thought about the case last week again. The young man with the brain injury. His heart had been beating strong, pumping blood warm and red through his veins while the lawyer read the statute to the family. The law had said he was dead because his brain could not function. No choice was involved in that biology. The cells were gone.

  Here, the biology was ambiguous. The heart could often be restarted in these moments if one chose to intervene. The finality relied on the choice not to intervene.

  Thorne checked his watch. He stood perfectly still, counting the seconds in his head. The room was quiet except for the flatline tone. Elena felt the weight of the interval. It was a buffer against uncertainty, but it was also a buffer against the implication of the choice they had made. They were waiting to see if the body would contradict their decision.

  When the five minutes were up, Thorne turned to the monitor. He verified the time. He turned to Elena.

  "Time of death," Thorne said. "14:02."

  Elena wrote it down. The pen scratched against the paper. In that instant, the legal reality shifted. The organs were now viable for recovery. Lin could enter. The will could be probated. The marriage was dissolved.

  Elena capped her pen. She looked at Thorne. They had worked together for years. They didn't need to discuss the ethics of the procedure; they both followed the rules. But the difference between this room and the one next door sat between them, unspoken but heavy.

  "It's a strange line," Elena said, her voice low so Sarah wouldn't hear. "We wait to see if the heart wakes up, knowing we won't help it if it tries."

  Thorne nodded, his eyes on the flat green line. "We have to be sure."

  "I know," Elena said. She looked at the ventilator, now silent and still. "It's the difference between a bridge that has fallen and one we choose not to cross."

  Thorne met her gaze. He didn't argue. He simply nodded again, acknowledging the structure they worked within. "One depends on what the body can do," he said quietly. "The other depends on what we will do."

  Elena put the chart on the counter. She walked to the door and opened it. Dr. Lin was standing there, gloved and masked, waiting for the signal. The hallway lights reflected off his protective eyewear.

  "He is deceased," Elena said.

  Lin stepped forward, past her, into the room. The recovery team followed, moving with efficient precision toward the bed. Sarah stood up from the chair, stepping back to give them space, her hand still resting on her father's arm for one second longer before she let go.

  Thorne moved to the foot of the bed to assist with the transfer. Elena stepped into the hall to make the call to the funeral home. The phone rang once.
