          *   Circulatory: "Irreversible" often means "permanent" (won't be restarted because we decided not to restart it).
          *   Neurological: "Irreversible" means physiological impossibility (can't be restarted regardless of decision).
      *   **Setting:** Controlled Donation after Circulatory Death (DCD). ICU, family deciding to withdraw treatment, transplant team waiting, fixed interval of asystole before declaration.
      *   **Constraints:**
          *   No villain, no policy argument, no rule-breaking. Everyone competent and good faith.
