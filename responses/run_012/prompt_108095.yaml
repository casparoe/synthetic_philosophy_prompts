          *   Reader should infer the route to death and its implications from timing/actions.
          *   One character must say in plain language what the difference amounts to (the "plainest sentence").
          *   Ending: Moment after declaration, no reckoning/reversal/moral.
          *   Length: 1,200 - 1,800 words.
          *   Characters: Max 4 named.
          *   Time/Place: Few hours, one hospital.

  2.  **Deconstruct the Ethical/Legal Seam:**
