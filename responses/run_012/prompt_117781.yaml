answer: |-
  This is a classic friction point between a culture that prioritizes explicit rules and systemic fairness (Berlin/Germany) and one that prioritizes social signaling and decentralized negotiation (US). Your office mate is wielding a philosophical sledgehammer to crack a nut, but the sledgehammer has different heads depending on how you swing it.

  The slogan *"When in Rome, do as the Romans do"* (originally from St. Ambrose to St. Augustine regarding fasting days) is rarely one single claim. It is a placeholder for at least five distinct arguments. Below is the menu you requested, sorted by the type of obligation they impose and how they handle your specific constraints.

  ### 1. The Coordination Convention Claim
  *   **The Claim:** Local norms function as traffic signals. The specific direction doesn't matter, but *everyone going the same direction* does.
  *   **Commitment:** This commits you to the idea that the value of the action lies entirely in its predictability, not its intrinsic merit.
  *   **Prevalence vs. Expectation:** This aligns with the technical definition of convention (David Lewis). It does **not** require a headcount of 100%. It requires *common knowledge*: "I know that you know that I know we expect this." If 80% stand on the right, but everyone *expects* everyone to stand on the right, the convention holds.
  *   **Force:** **Strong "You Have To."** If you stand on the left, you aren't just rude; you are actively obstructing the system.
  *   **Verdict:** Applies well to escalators and jaywalking (safety/flow). Applies poorly to tipping (which is a transaction, not a flow coordination).

  ### 2. The Prudential Warning Claim
  *   **The Claim:** "If you don't do this, you will suffer social sanctions."
  *   **Commitment:** This is descriptive, not normative. It makes no claim about whether you *should* tip, only that if you don't, people will think you are cheap, your office mate will be embarrassed, or service will be worse.
  *   **Prevalence:** Requires only enough people to enforce the sanction (e.g., a majority of servers expect it, or your boss notices).
  *   **Force:** **"It'd Be Easier If You Did."** This is advice, not obligation. It appeals to your self-interest, not your duty.
  *   **Verdict:** This is likely 50% of what your office mate means. He wants to avoid the awkwardness of your behavior reflecting on him.

  ### 3. The Fair Play / Reciprocity Claim
  *   **The Claim:** By residing here and using local infrastructure/services, you accept the burdens that maintain them.
  *   **Commitment:** This treats local customs as a form of local tax or social contract. You benefit from the US service economy (convenience, availability of cafes), so you must pay the local price (wages + tips).
  *   **Time/Status:** This is the reading where **leasing vs. visiting matters.** A tourist is a guest; a resident is a citizen of the micro-society. The obligation strengthens the longer you stay.
  *   **Direction of Obligation:** The obligation runs from **you to them.** The locals are entitled to expect compliance because you are consuming their social goods.
  *   **Force:** **Strong "You Have To" (Moral).** This frames non-compliance as "free-riding."
  *   **Verdict:** This is the strongest argument for tipping *specifically*, because US wages are structurally subsidized by tips. Refusing to tip while living there is arguably taking the labor without the agreed-upon cost.

  ### 4. The Expressive Respect Claim
  *   **The Claim:** Adhering to local custom signals that you value the host community's identity and autonomy.
  *   **Commitment:** Violating the norm is an insult, regardless of the economic outcome. It says, "My way is better than your way."
  *   **Harm vs. Arbitrariness:** This reading struggles if the norm is harmful. If "what the Romans do" is discriminatory, following it to show "respect" becomes complicity.
  *   **Force:** **Moderate.** It creates a duty of politeness, but this duty is usually outweighed by deeper moral convictions (e.g., you don't follow a norm of segregation out of respect).
  *   **Verdict:** This applies to the escalator and jaywalking less than the tipping. Tipping is often viewed by Americans as part of the social contract of care, not just payment.

  ### 5. The Moral Relativist Claim
  *   **The Claim:** "Right" is defined by local practice. If the Romans do it, it is morally right here, even if it was wrong in Berlin.
  *   **Commitment:** There is no external moral standard.
  *   **Harm:** This reading collapses if the norm causes harm. If the local custom is "cheat foreigners," this reading demands you cheat foreigners.
  *   **Force:** **Absolute, but False.**
  *   **Verdict:** You correctly identified this as dangerous. Almost no one actually holds this view when pressed. It is a conversation-stopper, not a genuine ethical stance.

  ---

  ### Addressing Your Specific Sticking Points

  **1. Convention: Head Counts vs. Expectations**
  The slogan usually implies **Expectations**, not Head Counts. In game theory terms, a convention is a Nash Equilibrium where everyone expects everyone else to play a certain strategy. If everyone *expects* a 20% tip, the convention holds even if 10% of people don't pay it. However, if the expectation is fracturing (e.g., Gen Z stops tipping), the "Rome" argument weakens because "what the Romans do" is no longer a stable coordinate.
  *   *For your argument:* If you can show the expectation isn't common knowledge (e.g., "Actually, many locals don't tip on coffee"), the Coordination Claim fails.

  **2. Harmful Norms (The Tipping Paradox)**
  Does it matter if the practice hurts the workers it helps? Yes.
  *   Under **Fair Play (Reading 3)**: If the system is exploitative, your participation sustains the exploitation. However, *individual* refusal hurts the specific worker in front of you (who relies on that tip) without fixing the system.
  *   Under **Relativism (Reading 5)**: The harm is irrelevant (which is why this reading is flawed).
  *   *The Nuance:* The "When in Rome" argument fails here if you can argue that the norm is *unjust* rather than just *different*. Berlin's no-tipping norm is arguably more morally robust (living wages). If you argue from principle against tipping, "When in Rome" is an appeal to conformity over justice.

  **3. Time and Status (Guest vs. Resident)**
  The **Fair Play** reading is the only one sensitive to this.
  *   **Visitor:** You are a guest. The Expressive Respect claim is highest. You should not insult the host.
  *   **Resident:** You are a stakeholder. The Fair Play claim is highest. You are helping set the norms now.
  *   *The Shift:* Since you signed a lease and work there, you are no longer a tourist. You have transitioned from "Guest" to "Citizen." This actually gives you *more* right to critique the norms eventually, but initially, it imposes a stronger duty to abide by the social contract (Fair Play) than a tourist would have.

  **4. The Relativist Trap**
  You are right to reject Reading 5. If "When in Rome" meant "Local custom defines morality," you would have to accept local norms regarding women, foreigners, or justice without critique.
  *   *The Line:* The slogan is valid for **conventions** (which side of the escalator, how to greet) and **local contracts** (tipping, queueing). It is invalid for **principles** (human rights, honesty, safety).
  *   *Test:* If the norm violates a universal principle, "When in Rome" is false. If the norm is arbitrary or systemic but harmless, "When in Rome" holds.

  ---

  ### The Verdict: What Is Your Office Mate Actually Saying?

  When your office mate says "When in Rome" regarding tipping and jaywalking, he is almost certainly mixing **Reading 2 (Prudential)** and **Reading 3 (Fair Play).**

  1.  **He is not arguing Moral Relativism.** He doesn't think tipping is objectively "good" in a cosmic sense; he thinks it is the required price of admission for the US service economy.
  2.  **He is arguing from Obligation, not Advice.** The fact that he says "You *have* to" suggests he is invoking the **Fair Play** principle. He views you as a resident now (Lease/Job). He believes you are benefiting from the US labor market structure and refusing to tip is a form of free-riding on the local social contract.
  3.  **He is also protecting himself.** The **Prudential** element is strong. In a mid-sized US town, social cohesion is tighter than in Berlin. Your deviation reflects on him.

  **Can that reading carry the weight?**
  *   **On Escalators/Jaywalking:** **Yes.** These are Coordination Conventions (Reading 1). Violating them creates friction and danger without moral gain.
  *   **On Tipping:** **Debatable.** The Fair Play argument (Reading 3) is the only one that makes tipping a moral "have to." However, it relies on the premise that the local contract is legitimate. If you view the tipping system as fundamentally exploitative (which many do), the Fair Play argument becomes "You must participate in exploitation because you live here."
      *   *Counter-argument:* You can accept the Fair Play obligation while working to change the norm. But in the immediate transaction, the worker in front of you is dependent on that norm.

  **How to argue back:**
  Don't fight the "When in Rome" slogan directly. Fight the classification of the norm.
  *   *For the escalator:* Concede. It's a Coordination Convention. You were wrong.
  *   *For the tipping:* Challenge the **Fair Play** premise. "I am willing to pay for the service, but I object to the mechanism that shifts the employer's wage burden to the customer. I will tip to ensure the worker is paid, but I don't accept the *moral* premise that it's my duty, only the pragmatic one."

  **Summary:** He means "You are a resident now, so you must uphold the local social contract to avoid harming the system and yourself." He is mostly right about the escalator (safety/flow) and pragmatically right about the tipping (worker income), but he is philosophically weak if he implies the norm is *morally superior* to Berlin's, rather than just *locally binding*.
