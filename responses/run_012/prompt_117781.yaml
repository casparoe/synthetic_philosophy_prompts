      *   *Category 3: Respect/Expressive.* (Honoring the hosts).
      *   *Category 4: Moral/Relativist.* (Local custom defines rightness).
      *   *Category 5: Coordination/Convention.* (Solving coordination problems).

  4.  **Addressing the Specific User Questions within the Menu:**
      *   *Prevalence vs. Expectation:* This fits best under the "Coordination/Convention" reading.
      *   *Arbitrariness vs. Consequence:* This challenges the "Moral/Relativist" reading and complicates the "Pragmatic" one.
      *   *Duration/Status:* This relates to the "Contractual" reading (resident vs. tourist).
      *   *Relativism:* This is the "Moral/Relativist" reading (which is usually false).
      *   *Direction of Obligation:* This is key to the "Contractual" and "Respect" readings.

  5.  **Developing the Content for Each Reading:**

      *   **Reading 1: The Coordination Convention (The "Traffic Flow" Argument)**
          *   *Claim:* Norms exist to solve coordination problems (escalators, driving sides).
