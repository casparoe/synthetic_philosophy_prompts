  *(Self-Correction Note)*: I need to be careful not to validate the tipping norm as morally *good*, but analyze the *argument* used to enforce it. The user suspects the norm might be harmful ("screwing over workers"). I need to address how "When in Rome" handles bad norms.

  *(Refining the "Rome" metaphor)*: St. Ambrose's original point was about *indifference* (fasting days don't matter to God), so adaptability prevents scandal. It was *not* about moral relativism. I should mention this briefly to ground the analysis.

