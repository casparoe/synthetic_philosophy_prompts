      *   **Reading 2: The Prudential Warning (The "Don't Stick Out" Argument)**
          *   *Claim:* Non-compliance leads to social sanctions (being seen as rude/cheap).
          *   *Commitment:* Descriptive, not normative. "If you don't, X happens."
          *   *Weight:* "It'd be easier if you did."

      *   **Reading 3: The Fair Play/Reciprocity Principle (The "Social Contract" Argument)**
          *   *Claim:* You benefit from the local order (infrastructure, service), so you bear the burdens (tipping, rules).
          *   *Commitment:* Obligation arises from residence/participation, not just visitation.
          *   *Status:* Applies more to residents (lease) than tourists.
          *   *Weight:* Strong "You have to" (moral obligation of fairness).

      *   **Reading 4: The Expressive Respect Claim (The "Guest" Argument)**
          *   *Claim:* Following customs signals respect for the community's identity.
          *   *Commitment:* Violation is an insult, even if harmless.
