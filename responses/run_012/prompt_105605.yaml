  # Take-Home Final: Social Choice and Political Philosophy

  **Question 4 (25 Marks)**

  **(i) The Liberal Paradox (10 Marks)**
  In your own words, explain the logical force of Sen's Liberal Paradox. Specifically: identify which conditions generate the contradiction; explain why the weakness of the Pareto premise makes the result a impossibility theorem rather than a curiosity; and explain why the solution "just drop Pareto" is theoretically costly even if it resolves the contradiction.

  **(ii) Testing a Repair (15 Marks)**
  Consider the following proposed repair to the paradox:
  *   **Minimal Liberalism (ML):** Retained exactly as Sen states it (at least two people, each decisive over at least one pair in their personal sphere).
  *   **Restricted Pareto (P*):** The Pareto principle applies *only* to pairs of alternatives that differ solely in one person's private dimension. It cannot be applied to pairs that differ in two people's private dimensions simultaneously.
  *   **Unrestricted Domain (U) & Ordering (O):** Retained as standard.

  Using a concrete case with explicitly defined states and preference orderings, test this proposal. Either construct a counterexample showing that ML + P* + U + O still yields an intransitive social ordering, **or** demonstrate formally that no such counterexample exists for the standard three-state configuration. If you show none exists, identify exactly which link in the standard paradoxical cycle is broken by P* and discuss whether this renders the Pareto principle trivial.

  **Word Budget:**
  *   Part (i): 250–300 words.
  *   Part (ii): 350–500 words.
  *   **Total Model Answer Target:** 600–800 words.

  ***

  # Model Answer

  **(i) The Liberal Paradox**
  Sen's theorem establishes that no social ordering can simultaneously satisfy Unrestricted Domain, Minimal Liberalism, the Pareto Principle, and Transitivity. The contradiction lands on the compatibility of Liberty and Pareto. The result bites because the Pareto premise is exceptionally weak: it requires social preference to follow unanimous individual preference only when *everyone* agrees. It does not require interpersonal comparisons or cardinal utility. If a condition as weak as Pareto conflicts with Liberty, the conflict is fundamental, not a product of demanding too much aggregation. Simply dropping Pareto is too quick because Pareto represents a minimal efficiency criterion central to welfare economics. Abandoning it allows socially wasteful outcomes (where everyone prefers $x$ to $y$, yet society chooses $y$) to persist solely to protect a right over a private sphere, which undermines the normative plausibility of the social choice rule.

  **(ii) Testing the Repair**
  To test the repair, we construct the standard "Prude and Lewd" scenario using three states regarding the reading of a book:
  *   $x$: Neither reads.
  *   $y$: Prude (Agent 1) reads.
  *   $z$: Lewd (Agent 2) reads.

  **Personal Spheres:**
  *   Agent 1 is decisive over $(x, y)$ (differs only in 1's action).
  *   Agent 2 is decisive over $(z, x)$ (differs only in 2's action).

  **Preferences (Meddlesome):**
  *   Agent 1: $x \succ_1 y \succ_1 z$ (Prefers neither, then self, then other).
  *   Agent 2: $y \succ_2 z \succ_2 x$ (Prefers other, then self, then neither).

  **Applying the Conditions:**
  1.  **Liberty (ML):**
      *   Over $(x, y)$, Agent 1 prefers $x \succ y$. Since this pair differs only in 1's dimension, ML dictates Social $x \succ y$.
      *   Over $(z, x)$, Agent 2 prefers $z \succ x$. Since this pair differs only in 2's dimension, ML dictates Social $z \succ x$.
  2.  **Restricted Pareto (P*):**
      *   In the standard paradox, the cycle is closed by applying Pareto to $(y, z)$. Both agents prefer $y \succ z$ (1 prefers $y \succ z$; 2 prefers $y \succ z$).
      *   However, states $y$ (1 reads) and $z$ (2 reads) differ in **both** agents' private dimensions.
      *   Under **P***, Pareto cannot be applied to $(y, z)$. The social ranking on this pair is undetermined by P*.

  **Verdict:**
  No counterexample exists for this configuration. The standard cycle ($x \succ y \succ z \succ x$) cannot be formed because the link $y \succ z$ is not forced. A transitive social ordering is possible, for example: $z \succ x \succ y$. This ordering satisfies ML (respecting $x \succ y$ and $z \succ x$) and P* (which is silent on $z \succ y$).

  **Analysis:**
  The repair succeeds in blocking the impossibility theorem because P* severs the link between the two liberty-protected pairs. The paradox relies on Pareto to bridge the gap between distinct personal spheres. However, this success comes at a cost: P* renders the Pareto principle unable to resolve conflicts where preferences are interdependent across spheres. While it avoids logical contradiction, it limits the social choice rule's ability to enforce unanimity on socially significant outcomes that involve multiple agents' private actions.

  ***

  # Marking Scheme (25 Marks Total)

  **1. Identification of Contradictory Conditions (5 Marks)**
  *   **Criteria:** Correctly identifies that the contradiction arises between Minimal Liberalism and the Pareto Principle (given U and O).
  *   **Common Pitfall:** Students claim the contradiction is between Liberty and Transitivity alone, missing the role of Pareto in closing the cycle.

  **2. Explanation of Pareto's Weakness (5 Marks)**
  *   **Criteria:** Explains that Pareto requires only unanimous preference, not strong welfare assumptions, making the conflict deep rather than technical.
  *   **Common Pitfall:** Describing Pareto as a "strong" condition or confusing it with utilitarianism.

  **3. Cost of Dropping Pareto (5 Marks)**
  *   **Criteria:** Notes that dropping Pareto allows unanimously preferred outcomes to be rejected, violating efficiency/welfare norms.
  *   **Common Pitfall:** Arguing dropping Pareto is fine because "rights are more important," without acknowledging the theoretical cost to social choice.

  **4. Construction of the Counter-Test (5 Marks)**
  *   **Criteria:** Explicitly defines states ($x, y, z$), spheres, and preferences. Correctly applies ML to fix two links ($x \succ y, z \succ x$).
  *   **Common Pitfall:** Vague descriptions of states or failing to specify which pairs differ in which dimensions.

  **5. Verdict and Link Analysis (5 Marks)**
  *   **Criteria:** Correctly concludes the repair **works** (no contradiction). Identifies that P* blocks the Pareto application on the "both differ" pair $(y, z)$.
  *   **Common Pitfall:** Insisting the paradox remains despite the restriction, or failing to identify *why* P* blocks the specific pair $(y, z)$.
