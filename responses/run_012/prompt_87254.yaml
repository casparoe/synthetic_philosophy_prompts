answer: |-
  You have hit on one of the most common and sophisticated sticking points in reading *Darwin's Dangerous Idea*. Your confusion is completely warranted because the metaphor is slightly counter-intuitive if you map it strictly onto "levels of abstraction."

  You are interpreting the distinction as **Bottom-Up (Crane) vs. Top-Down (Skyhook)**.
  Dennett intends the distinction as **Mechanism (Crane) vs. Miracle (Skyhook)**.

  Here is where your definition needs a tweak, and why that resolves the paradoxes you're seeing with Natural Selection and Greedy Reductionism.

  ### 1. Skyhooks are not "Higher Levels," they are "Magic"
  Your definition: *A skyhook is any explanation that lets a higher-level thing do real work.*
  Dennett's definition: *A skyhook is an explainer that itself needs no explaining.*

  For Dennett, a Skyhook is a "deus ex machina." It is something that hangs from nothing. It invokes complexity, purpose, or mind *before* there is a mechanism to generate them.
  *   **Example of a Skyhook:** "God designed the eye." (Who designed God? If God is complex enough to design an eye, God needs an explanation. If you say God is simple, you're claiming complexity came from simplicity via magic.)
  *   **Example of a Skyhook:** "Vital Force." (A special substance that makes things alive, distinct from chemistry.)
  *   **Example of a Skyhook:** "Cartesian Dualism." (A non-physical mind that interacts with physics without obeying physics.)

  A Skyhook stops inquiry. It says, "It works this way because [Magic/Designer/Mind] made it so."

  ### 2. Cranes are not just "Physics," they are "Buildable Mechanisms"
  Your definition: *A crane is an explanation that stays at the bottom level, in physics and chemistry.*
  Dennett's definition: *A crane is a natural mechanism that rests on the ground and lifts complexity up.*

  A Crane can be at *any* level, as long as it is grounded in the level below it and doesn't invoke magic.
  *   **Natural Selection:** You are right that it is a pattern over populations. It is not a particle. However, it is a **crane** because it is a mindless, algorithmic process. It does not require a "Selector." It rests on the ground of variation, heredity, and differential reproduction. It builds complexity from simplicity without needing a "purpose" to start the process.
  *   **Culture:** Dennett argues human culture is a crane. It builds on top of biology. It is high-level, but it isn't a skyhook because we can explain how memes replicate and compete without invoking a supernatural soul.

  **The Resolution:** Natural Selection is a crane not because it is "physics," but because it is **Competence without Comprehension.** It does the work of a designer (creating complex, functional things) without actually *being* a designer. That is the definition of a crane: a substitute for a skyhook.

  ### 3. Greedy Reductionism
  This is where your second confusion lies. You wrote:
  > *I thought greedy reductionism was bad because it skips levels, which would mean you need the levels to be doing work, which again sounds like skyhooks.*

  Dennett actually **defends** Greedy Reductionism. He thinks it is the correct approach to science. However, he distinguishes between *good* greedy reductionism and *bad* (shallow) reductionism.

  *   **Good Greedy Reductionism:** "I want to explain everything from the bottom up." To do this successfully, you must acknowledge all the intermediate **cranes**. You must show how physics builds chemistry, chemistry builds biology, biology builds psychology.
  *   **Bad Reductionism (What you are describing):** This is often called "Eliminativism" or just "sloppy reductionism." This is when you say, "It's all just atoms," and ignore the patterns. Dennett calls this "skipping the cranes."

  If you skip the intermediate levels, you aren't actually explaining anything; you're just gesturing at the bottom. Dennett argues that higher-level patterns (like "belief," "function," or "meaning") are **Real Patterns**. They do real work. But they are supported by cranes, not skyhooks.

  So, when Dennett says Natural Selection is the "Ultimate Crane," he means it is the mechanism that allows us to be greedy reductionists about biology without ignoring the reality of design. It bridges the gap between "blind physics" and "purposeful organisms" without needing a Skyhook (God/Mind) to bridge it.

  ### 4. Where you went wrong (and why it makes sense)
  You assumed the distinction was about **Ontological Levels** (Physical vs. Mental).
  Dennett's distinction is about **Explanatory Lineage** (Miraculous vs. Natural).

  *   **Your Model:**
      *   Bottom (Physics) = Crane
      *   Top (Purpose/Pattern) = Skyhook
      *   *Problem:* Natural Selection is Top-ish, so it should be a Skyhook.

  *   **Dennett's Model:**
      *   Magic/Unexplained/Designer = Skyhook
      *   Mechanism/Algorithm/Mindless Process = Crane
      *   *Result:* Natural Selection is a mechanism (Crane). God is a Designer (Skyhook).

  ### 5. Is he cherry-picking?
  You asked: *Is the whole crane/skyhook distinction just him keeping the skyhooks he happens to like and calling them cranes?*

  This is the standard criticism from philosophers like Thomas Nagel or Haimovici. They argue Dennett defines "Skyhook" as "Any explanation I don't like" and "Crane" as "Any explanation I do like."

  However, Dennett has a specific criterion: **Can the mechanism exist before the thing it creates?**
  *   A Skyhook (Mind/Designer) usually requires the thing it creates (Complexity) to already exist in some form. (You need a smart God to make a smart human).
  *   A Crane (Natural Selection) can exist in a simple form and build the complex thing. (Blind variation can build a complex eye).

  If you accept that premise, he isn't cherry-picking; he is rigorously applying a test for whether an explanation regresses infinitely (Skyhook) or bottoms out in simple laws (Crane).

  ### Summary to fix your mental model:
  1.  **Skyhook:** An explanation that invokes a "Miracle" or a "Designer" to explain complexity. It hangs from nothing. (Bad)
  2.  **Crane:** An explanation that invokes a "Mechanism" or "Algorithm" to build complexity from simplicity. It rests on the ground. (Good)
  3.  **Natural Selection:** It is a high-level pattern, but it is a **Crane** because it is a mindless algorithm that builds design without a designer.
  4.  **Greedy Reductionism:** The project of explaining everything from the bottom up. It is **Good**, provided you don't skip the intermediate Cranes (levels) that actually do the lifting.
  5.  **Higher Levels:** Dennett agrees higher levels (norms, purposes) are real ("Real Patterns"). They are not Skyhooks as long as they are supported by the Cranes below them.

  You weren't wrong to notice that Natural Selection is a "pattern" and not a "particle." You just assigned "Pattern = Skyhook." For Dennett, "Pattern = Real," but "Pattern supported by Magic = Skyhook" while "Pattern supported by Algorithm = Crane."
