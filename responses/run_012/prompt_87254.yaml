      *   *Crane:* A natural, explicable mechanism that builds complexity from simpler beginnings. It rests on the ground (bottom). It can be analyzed and understood. (e.g., Natural Selection, neural networks, market forces).
      *   *Key Distinction:* It's *not* primarily about "levels" (high vs. low). It's about *explanatory power vs. miraculous intervention*. It's about whether the mechanism itself needs explaining or if it's posited as a brute fact.
