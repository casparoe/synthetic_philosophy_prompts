prompt: |-
  I've been trying to work out Dennett's crane vs skyhook thing on my own and I want to check my version against someone who actually knows it. The way I have it: a skyhook is any explanation that lets a higher-level thing (a purpose, a norm, a pattern, a "what it's for") do real work in explaining something lower down, and a crane is an explanation that just stays at the bottom level, in physics and chemistry and such. So cranes = reductionism done right, skyhooks = letting the higher level do the lifting. But then Dennett turns around and says evolution by natural selection is the ultimate crane — and natural selection isn't a physical thing down at the bottom, it's a pattern over populations, so by my definition that should be a skyhook, no? And greedy reductionism confuses me the same way: I thought greedy reductionism was bad because it skips levels, which would mean you need the levels to be doing work, which again sounds like skyhooks. So is the whole crane/skyhook distinction just him keeping the skyhooks he happens to like and calling them cranes? Where am I going wrong here?
