      **Existing Positions and the Stalemate**
      Current positions are locked in a standoff. Realists about phenomenal character argue that introspection reveals properties that outrun functional or representational roles. They maintain that denying these properties requires denying the data of experience. Opponents argue that properties defined solely by intrinsic, non-relational character are explanatorily idle and conceptually unstable. They claim that a property lacking causal or functional individuation cannot be coherently posited. The debate stalls because both sides treat "qualia" as a monolithic target. Realists defend the epistemic privilege of experience against charges of error, while opponents attack the metaphysical coherence of intrinsic properties. Because the term bundles ineffability, intrinsicness, and epistemic privilege, arguments targeting one commitment are mistakenly taken to refute the whole. Consequently, the charge of incoherence is wielded globally, when it may only apply locally.

