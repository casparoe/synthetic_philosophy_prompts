answer: |-
  I am using Lewis's standard definition from *Convention* (1969, pp. 76–78). For a regularity $R$ in a population $P$ during a recurrent situation $S$ to be a convention, the following must be true and **common knowledge** in $P$:

  1.  **Regularity:** Everyone conforms to $R$.
  2.  **Expectation:** Everyone expects everyone else to conform to $R$.
  3.  **Preference:** Everyone prefers to conform to $R$ on the condition that others do (coordination problem).
  4.  **Alternatives:** There is at least one other regularity $R'$ that could have solved the coordination problem instead (arbitrariness).
  5.  **Common Knowledge:** Conditions 1–4 are common knowledge.

  Here are the two stress-test cases.

  ---

  ### Case 1: The Common Knowledge Kink
  **Scenario:** A 6-person design team holds a weekly sync.
  **The Regularity ($R$):** Meetings start at 9:05 AM (a 5-minute "grace period" norm).
  **The Alternative ($R'$):** Starting at 9:00 AM sharp would have worked just as well.
  **Evolution:** No manager set this. The first few meetings started late due to coffee runs; it stuck.

  **The Kink (Broken Common Knowledge):**
  Frank, a senior designer, believes the 9:05 norm exists *because of him*. He thinks the others expect *him* to arrive at 9:05, and they conform to that expectation to accommodate his schedule. In reality, the other five members conform because they expect *each other* to conform; Frank's arrival time is irrelevant to their expectation. Frank does not know that the others' expectations are independent of him.

  **Analysis of Conditions:**
  *   **Regularity:** **Met.** Everyone arrives by 9:05.
  *   **Expectation:** **Met.** Everyone expects everyone else to arrive by 9:05. (Frank expects it; others expect it).
  *   **Preference:** **Met.** Everyone prefers to arrive by 9:05 *if* others do (to avoid the awkwardness of being the only one there early or the only one late).
  *   **Alternatives:** **Met.** 9:00 AM was a viable alternative equilibrium.
  *   **Common Knowledge:** **Failed.** For 1–4 to be common knowledge, Frank must know that the others know that the others know... the basis of the expectation. Frank believes the others' expectation is conditional on *his* behavior. The others know their expectation is conditional on *the group's* behavior. Frank has a false second-order belief about the source of the others' conformity.

  **Verdict:**
  *   **Lewis:** This is **not a convention**. Because the common knowledge chain is broken at Frank's end (he misunderstands the structure of the others' expectations), the strict definition fails.
  *   **Intuition:** This **is a convention**. The regularity is stable, arbitrary, and solves a coordination problem. Frank's private delusion about his own importance shouldn't disqualify the social fact.

  **Load-Bearing Feature:**
  The **Preference/Coordination** bit is doing the real work. The regularity persists because everyone has a conditional preference to match the others. The Common Knowledge requirement is the fragile philosophical add-on that breaks here.

  **The Control (Repair the Kink):**
  Frank overhears a conversation and realizes the others would start at 9:05 even if he arrived at 8:55. He updates his belief.
  *   **Result:** Nothing changes behaviorally. The meeting still starts at 9:05. No sanctions are applied.
  *   **Implication:** If the behavior doesn't change when CK is repaired, the CK requirement was likely descriptive window-dressing rather than a functional component of the norm's existence. The case was a convention the whole time; the kink was doing no work.

  ---

  ### Case 2: The Non-Arbitrary Regularity
  **Scenario:** A small warehouse crew loading delivery trucks.
  **The Regularity ($R$):** Pallets are always staged in Bay 1.
  **Evolution:** Bay 1 was the only bay with a working forklift charger for the first year. The habit stuck.

  **Phase 1: No Alternative**
  *   **Constraint:** Bay 2 existed but had no power. Bay 1 was the *only* viable option.
  *   **CK/Expectation/Preference:** All present. Everyone stages in Bay 1, expects others to, and prefers to (to avoid chaos).
  *   **Arbitrariness:** **Failed.** There is no $R'$ (staging in Bay 2) that solves the problem. It is physically impossible.
  *   **Lewis Verdict:** **Not a convention.** It is a technical necessity.

  **Phase 2: The Control (Add Unused Alternative)**
  *   **Change:** Bay 2 is wired and fully functional. Management announces both bays are equal.
  *   **Behavior:** Nobody changes. Everyone still uses Bay 1 out of habit.
  *   **Question:** Does the bare existence of Bay 2 turn the Bay 1 regularity into a convention?
  *   **Lewis Verdict:** **Yes, provided it is Common Knowledge.** If everyone knows Bay 2 works, then sticking to Bay 1 is now arbitrary. The regularity $R$ (Bay 1) is now sustained by expectation/preference in the face of a viable $R'$ (Bay 2).
  *   **Nuance:** If the crew *doesn't know* Bay 2 works (information hasn't propagated), it remains a technical necessity in their minds, and thus not a convention yet. Lewis requires the *knowledge* of the alternative, not just its physical existence.

  **Analysis:**
  *   **Load-Bearing Feature:** The **Arbitrariness** condition. Without a viable $R'$, Lewis argues you don't have a coordination *problem*, you just have a solution.
  *   **Intuition:** In Phase 1, it feels like a norm/convention even if physically constrained (it's a "rule of the warehouse"). In Phase 2, the moment the alternative becomes known, it feels *more* like a convention, even if no one switches.

  ---

  ### Honest Note & Defense

  **What's doing the work?**
  *   **In Case 1 (CK Kink):** The **Conditional Preference** is doing the work. The group is stuck in an equilibrium because deviating is costly for the individual. The Common Knowledge requirement is where Lewis is most vulnerable to "folk sociological" objections.
  *   **In Case 2 (Non-Arbitrary):** The **Arbitrariness** condition is doing the work. Lewis wants to distinguish conventions from laws of nature or technical constraints.

  **How a Lewis Defender would respond:**
  1.  **To Case 1:** They would argue I have misdescribed the knowledge state. If Frank thinks the others rely on him, he likely believes *they* think *he* prefers 9:05. If he knows *he* doesn't prefer it (he's indifferent), he should realize their belief is false. A defender might say: "If Frank truly believes the others rely on him, he holds a false belief about their preferences. Therefore, Condition 2 (Expectation) is not actually met *in the way Frank understands it*." They might argue this is a *proto*-convention waiting for the knowledge to align.
  2.  **To Case 2:** They would double down on Phase 1. "If Bay 2 is broken, there is no coordination problem. Calling it a convention dilutes the term. It's just rational action." Regarding Phase 2, they would insist that if the crew doesn't *know* Bay 2 works, it's still not a convention. The physical existence of $R'$ is insufficient; the *common knowledge of the viability of $R'$* is the switch.

  **Flagged Rigging:**
  *   **Case 1:** I had to carefully construct Frank's delusion so it didn't trigger a sanction. If Frank thought he was the boss, others might punish him for arrogance, or he might test the norm. I assumed a "benign ignorance" to keep the regularity stable.
  *   **Case 2:** Phase 2 relies on the crew knowing Bay 2 works but ignoring it. In reality, if Bay 2 is known to work, *someone* would try it out immediately, breaking the regularity. I had to assume a strong inertia/habit to keep everyone in Bay 1 despite the known alternative, to test if the *definition* holds even without behavioral switching.
