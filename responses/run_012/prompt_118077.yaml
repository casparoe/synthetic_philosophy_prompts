prompt: |-
  Alright, I'm prepping a session on David Lewis's theory of convention — the 1969 book, where a convention is roughly a regularity everyone follows, everyone expects everyone else to follow, everyone would rather keep following it as long as the others do, and there's some other way of doing things that would've worked just as well, and all of that is common knowledge in the group. I'm probably fuzzing the exact list from memory, so use the version you think is right and just tell me which one you're using. I don't want a summary of the theory, I want to stress-test it with cases I can actually put on a slide. So, two things.

  First: build me a realistic case — a shared house, a housing co-op, a small village, a shift crew, that kind of scale, nothing with desert islands or made-up tribes — where the group has a stable regularity that everyone really does follow, everyone expects everyone else to follow, and everyone prefers to conform given that the others do, but where the common knowledge is broken: the higher-order expectations have a kink in them. Say one person has a false belief about what the others believe the others believe. The key constraint is that the regularity has to keep going anyway — it survives the kink, nobody defects, no punishments needed. Then walk me through it: for each of the conditions, say whether the case meets it and why, and give me your verdict on whether Lewis has to call this a convention or whether his account gives the wrong answer here. Tell me which bit is actually load-bearing, the common knowledge requirement or the preference bit. Then do the control: repair the false higher-order belief so everything really is common knowledge, and tell me whether anything about the case changes, or whether it was a convention the whole time and the kink was doing no work.

  Second, the other direction. Give me a case with full common knowledge, mutual expectation, everyone glad to conform, but it still isn't a convention because of the arbitary-ness thing — there simply isn't another way of doing it that would've worked as well, so there's nothing for the regularity to be arbitrary between. Realistic again, same scale. Then the control on that one: add a second option that would've worked just as well but that nobody ever actually took up, and tell me whether the bare existence of an unused alternative is enough to turn the thing into a convention.

  Both cases need to be ones where the regularity grew up on its own — nobody agreed to it, no authority handed it down, it just accreted over time. If a case only works because somebody set it up, say so and rebuild it, because the whole point is to use these to talk about how norms evolve without a designer.

  Finish with a short honest note: which feature in each case is doing the real work, and what a Lewis defender would say to get out of the first case — where they'd say I've misdescribed the knowledge structure, or smuggled a sanction in, or whatever. And flag anywhere you think the case is rigged rather than actually generated by the setup.
