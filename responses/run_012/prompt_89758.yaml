answer: |-
  There is no single, canonical term in cognitive psychology or risk literature that perfectly captures this specific asymmetry. You have identified a subtle intersection of several known biases, but the specific move you are describing—where the *ontological structure* of the outcome retroactively adjusts the *epistemic credibility* of the probability—does not have a standard name.

  The closest existing concepts are **Motivated Reasoning** (which you rightly set aside as too broad), **Normalcy Bias** (which usually makes people underestimate *all* disasters), and the **Conjunction Fallacy** (where specific details make a scenario less probable, though here the probability is stipulated as equal).

  Because this phenomenon is distinct enough to warrant its own label, particularly within longtermist and existential risk discourse, I propose calling it **Outcome-Contingent Epistemic Discounting (OCED)**.

  Within OCED, the specific asymmetry you noticed (Extinction = Credible; Suffering = Sci-Fi) is a subtype I would call **Terminal Plausibility Bias**.

  Here is the breakdown of the term, its edges, and how it differs from wishful thinking.

  ### 1. The Name: Outcome-Contingent Epistemic Discounting
  **Definition:** The cognitive tendency to adjust the perceived likelihood of a probabilistic claim based on the *content* and *structure* of the predicted outcome, rather than the evidence supporting the causal mechanism.

  In your example, the causal mechanism (a powerful new technology) is identical. The probability (1/1000) is identical. But the *outcome* (Extinction vs. S-Risk) triggers a different discount rate on the probability itself. People treat the probability of extinction as "hard data" and the probability of s-risk as "speculative fiction," effectively reading the credibility off the nature of the future state.

  ### 2. The Subtype: Terminal Plausibility Bias
  This explains the specific Extinction vs. Suffering asymmetry.
  *   **Extinction** is a **Terminal State**. It is a cessation of activity. It requires only one thing to go wrong (the system breaks). It fits the cognitive schema of an "accident" or "failure."
  *   **S-Risk (or Utopia)** is a **Trajectory State**. It implies a complex, sustained future where the system *continues* to operate, but in a radically different mode. It requires things to go wrong (or right) *and stay that way*.

  **Terminal Plausibility Bias** posits that humans find it cognitively easier to believe in the *end* of a story than in a *radically different sequel*.
  *   **Extinction:** "The machine breaks, we die." (Simple, singular event).
  *   **S-Risk:** "The machine works, captures us, maintains us, and optimizes for suffering over centuries." (Complex, sustained conjunction of events).

  Even if you stipulate the probability is the same, the *description* of the s-risk outcome feels like a conjunction of many unlikely sub-events, triggering a subconscious **Conjunction Fallacy**. The extinction outcome feels like a single point of failure. Therefore, the s-risk probability is discounted as "too complex to be real," while the extinction probability is accepted as "a simple safety failure."

  ### 3. The Edges of the Bias

  **Does it cover the mirror case (Huge Good Outcomes)?**
  **Yes.** This is the strongest evidence that this is not about "optimism" or "pessimism."
  If you present a 1/1000 chance of a *technological Utopia* (vast flourishing), people who take Extinction seriously will often dismiss the Utopia probability with the exact same "sci-fi" label they use for S-Risk.
  *   **Extinction (Bad + Terminal):** Taken Seriously.
  *   **S-Risk (Bad + Trajectory):** Dismissed.
  *   **Utopia (Good + Trajectory):** Dismissed.

  This confirms that the discount rate is not driven by the *valence* (good/bad) of the outcome, but by the *trajectory* (ending/continuing). OCED covers all three: it privileges terminal negatives over trajectory extremes.

  **Does it cover a bad outcome that's just a large setback?**
  **Yes, but with nuance.**
  If the outcome is "Civilization collapses but recovers after 100 years" (a large setback/trajectory), it is often discounted more than "Civilization ends forever" (terminal).
  However, if the setback is framed as a "Return to Normalcy" (e.g., "We will suffer a depression but return to the status quo"), **Normalcy Bias** kicks in and makes the setback feel *more* plausible than a radical transformation.
  OCED specifically targets *radical* trajectories. A "large setback" that looks like a magnified version of current suffering might be taken seriously. A "large setback" that implies a new, strange kind of suffering (e.g., digital subjugation) will be discounted.

  ### 4. Distinction from Wishful Thinking

  It is crucial to separate OCED from **Wishful Thinking**.
  *   **Wishful Thinking** is valence-dependent. It makes Good outcomes seem more probable and Bad outcomes seem less probable.
  *   **OCED** is structure-dependent. It makes *Terminal* outcomes seem more probable and *Trajectory* outcomes seem less probable, regardless of whether they are Good or Bad.

  If a person were operating on Wishful Thinking, they would dismiss Extinction (Bad) and accept Utopia (Good).
  If a person is operating on OCED/Terminal Plausibility Bias, they accept Extinction (Terminal) and dismiss *both* S-Risk and Utopia (Trajectories).

  This explains why you see people who are not "optimists" (they fear extinction) but are also not "pessimists" (they dismiss dystopia). They are **Finality Realists**. They believe things can break, but they do not believe things can transform.

  ### 5. Why this move happens (The Mechanism)

  The reason this feels like "reading the probability off the description" is that human risk assessment relies heavily on **narrative coherence** rather than statistical abstraction.
  *   **The Extinction Narrative:** Fits the "Tragedy" genre. It is a known script (war, plague, asteroid). It requires no imagination of a new world, only the absence of the current one.
  *   **The S-Risk Narrative:** Fits the "Speculative Fiction" genre. It requires imagining a new physics of society, new power dynamics, and sustained stability of a negative state.

  When people say "That's sci-fi," they are not commenting on the probability number; they are commenting on the **narrative load**. They are saying, "I cannot model the world required for this outcome to exist, therefore I cannot accept the probability that it will exist."

  ### Summary
  *   **General Term:** **Outcome-Contingent Epistemic Discounting**.
  *   **Specific Asymmetry:** **Terminal Plausibility Bias**.
  *   **Core Mechanism:** Credibility is assigned based on whether the outcome is a *cessation* (easy to model) or a *transformation* (hard to model).
  *   **Differentiation:** It is distinct from Wishful Thinking because it dismisses positive trajectories (Utopia) just as readily as negative ones (S-Risk).

  You have identified a blind spot in how we reason about the long-term future: we are better at imagining the end of the world than we are at imagining the *continuation* of the world in a radically different state. This leads to a policy focus on preventing death, with little attention paid to preventing life from becoming unbearable.
  There is no single, canonical term in cognitive psychology or risk literature that perfectly captures this specific asymmetry. You have identified a subtle intersection of several known biases, but the specific move you are describing—where the *ontological structure* of the outcome retroactively adjusts the *epistemic credibility* of the probability—does not have a standard name.

  The closest existing concepts are **Motivated Reasoning** (which you rightly set aside as too broad), **Normalcy Bias** (which usually makes people underestimate *all* disasters), and the **Conjunction Fallacy** (where specific details make a scenario less probable, though here the probability is stipulated as equal).

  Because this phenomenon is distinct enough to warrant its own label, particularly within longtermist and existential risk discourse, I propose calling it **Outcome-Contingent Epistemic Discounting (OCED)**.

  Within OCED, the specific asymmetry you noticed (Extinction = Credible; Suffering = Sci-Fi) is a subtype I would call **Terminal Plausibility Bias**.

  Here is the breakdown of the term, its edges, and how it differs from wishful thinking.

  ### 1. The Name: Outcome-Contingent Epistemic Discounting
  **Definition:** The cognitive tendency to adjust the perceived likelihood of a probabilistic claim based on the *content* and *structure* of the predicted outcome, rather than the evidence supporting the causal mechanism.

  In your example, the causal mechanism (a powerful new technology) is identical. The probability (1/1000) is identical. But the *outcome* (Extinction vs. S-Risk) triggers a different discount rate on the probability itself. People treat the probability of extinction as "hard data" and the probability of s-risk as "speculative fiction," effectively reading the credibility off the nature of the future state.

  ### 2. The Subtype: Terminal Plausibility Bias
  This explains the specific Extinction vs. Suffering asymmetry.
  *   **Extinction** is a **Terminal State**. It is a cessation of activity. It requires only one thing to go wrong (the system breaks). It fits the cognitive schema of an "accident" or "failure."
  *   **S-Risk (or Utopia)** is a **Trajectory State**. It implies a complex, sustained future where the system *continues* to operate, but in a radically different mode. It requires things to go wrong (or right) *and stay that way*.

  **Terminal Plausibility Bias** posits that humans find it cognitively easier to believe in the *end* of a story than in a *radically different sequel*.
  *   **Extinction:** "The machine breaks, we die." (Simple, singular event).
  *   **S-Risk:** "The machine works, captures us, maintains us, and optimizes for suffering over centuries." (Complex, sustained conjunction of events).

  Even if you stipulate the probability is the same, the *description* of the s-risk outcome feels like a conjunction of many unlikely sub-events, triggering a subconscious **Conjunction Fallacy**. The extinction outcome feels like a single point of failure. Therefore, the s-risk probability is discounted as "too complex to be real," while the extinction probability is accepted as "a simple safety failure."

  ### 3. The Edges of the Bias

  **Does it cover the mirror case (Huge Good Outcomes)?**
  **Yes.** This is the strongest evidence that this is not about "optimism" or "pessimism."
  If you present a 1/1000 chance of a *technological Utopia* (vast flourishing), people who take Extinction seriously will often dismiss the Utopia probability with the exact same "sci-fi" label they use for S-Risk.
  *   **Extinction (Bad + Terminal):** Taken Seriously.
  *   **S-Risk (Bad + Trajectory):** Dismissed.
  *   **Utopia (Good + Trajectory):** Dismissed.

  This confirms that the discount rate is not driven by the *valence* (good/bad) of the outcome, but by the *trajectory* (ending/continuing). OCED covers all three: it privileges terminal negatives over trajectory extremes.

  **Does it cover a bad outcome that's just a large setback?**
  **Yes, but with nuance.**
  If the outcome is "Civilization collapses but recovers after 100 years" (a large setback/trajectory), it is often discounted more than "Civilization ends forever" (terminal).
  However, if the setback is framed as a "Return to Normalcy" (e.g., "We will suffer a depression but return to the status quo"), **Normalcy Bias** kicks in and makes the setback feel *more* plausible than a radical transformation.
  OCED specifically targets *radical* trajectories. A "large setback" that looks like a magnified version of current suffering might be taken seriously. A "large setback" that implies a new, strange kind of suffering (e.g., digital subjugation) will be discounted.

  ### 4. Distinction from Wishful Thinking

  It is crucial to separate OCED from **Wishful Thinking**.
  *   **Wishful Thinking** is valence-dependent. It makes Good outcomes seem more probable and Bad outcomes seem less probable.
  *   **OCED** is structure-dependent. It makes *Terminal* outcomes seem more probable and *Trajectory* outcomes seem less probable, regardless of whether they are Good or Bad.

  If a person were operating on Wishful Thinking, they would dismiss Extinction (Bad) and accept Utopia (Good).
  If a person is operating on OCED/Terminal Plausibility Bias, they accept Extinction (Terminal) and dismiss *both* S-Risk and Utopia (Trajectories).

  This explains why you see people who are not "optimists" (they fear extinction) but are also not "pessimists" (they dismiss dystopia). They are **Finality Realists**. They believe things can break, but they do not believe things can transform.

  ### 5. Why this move happens (The Mechanism)

  The reason this feels like "reading the probability off the description" is that human risk assessment relies heavily on **narrative coherence** rather than statistical abstraction.
  *   **The Extinction Narrative:** Fits the "Tragedy" genre. It is a known script (war, plague, asteroid). It requires no imagination of a new world, only the absence of the current one.
  *   **The S-Risk Narrative:** Fits the "Speculative Fiction" genre. It requires imagining a new physics of society, new power dynamics, and sustained stability of a negative state.

  When people say "That's sci-fi," they are not commenting on the probability number; they are commenting on the **narrative load**. They are saying, "I cannot model the world required for this outcome to exist, therefore I cannot accept the probability that it will exist."

  ### Summary
  *   **General Term:** **Outcome-Contingent Epistemic Discounting**.
  *   **Specific Asymmetry:** **Terminal Plausibility Bias**.
  *   **Core Mechanism:** Credibility is assigned based on whether the outcome is a *cessation* (easy to model) or a *transformation* (hard to model).
  *   **Differentiation:** It is distinct from Wishful Thinking because it dismisses positive trajectories (Utopia) just as readily as negative ones (S-Risk).

  You have identified a blind spot in how we reason about the long-term future: we are better at imagining the end of the world than we are at imagining the *continuation* of the world in a radically different state. This leads to a policy focus on preventing death, with little attention paid to preventing life from becoming unbearable.
