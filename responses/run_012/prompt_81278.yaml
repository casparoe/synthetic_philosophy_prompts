prompt: |-
  For the past three years I have been the volunteer treasurer of a small mutual-aid fund: six of us, no paid staff, about thirty grants a month of between one hundred and fifty and seven hundred dollars, mostly rent arrears, a car repair, a deposit, a funeral. We meet on a Thursday evening video call for ninety minutes and have to get through a dozen applications in that time, and every decision has to be written up afterwards in a single paragraph for the funders who pay for the grants. Until last autumn we took people at their word: an applicant told us what had happened and what it would cost, one of us called them back with a few questions, and the committee voted. Then two things happened in the same month. A grant we had made for a car repair turned out to have gone to an old debt, which is not what we had approved; and a woman who had already been turned away by two other agencies stopped answering our calls after we asked her for a pay stub, and we learned later that she lost the room she had been trying to keep. Since then we have argued about verification at every meeting and got nowhere. Roughly half the committee wants proof before we pay anything — a pay stub, a landlord's letter, a screenshot of the past-due bill. The rest of us think the point of the fund is that people should not have to perform their poverty for a stranger in order to be believed. In three years I can count on one hand the applications we have refused for a reason a document would have caught, and we share a list of refused applicants with two other local groups, so anything we learn about someone does not stay with us.

  What I cannot answer is the argument our chair keeps making. A friend of his in machine learning told him there is a proof — the friend calls it Good's theorem, though I have no idea whether that is the right name for it — that information which costs nothing to obtain, and which you are genuinely going to act on, cannot make you worse off on average: if you will choose differently after seeing it, then deciding after seeing it is at least as good as deciding now, and the only thing that can hurt you is the price of getting it. The chair's conclusion is that the only question for us is what the asking costs, and that until it costs more than the difference it makes we should be checking everything. I have two objections I cannot make precise. The first is that the information is not free; it is only free to us, and the person who pays for it is the one asking for help. The second is that I do not see where in his proof anyone is allowed to be worse off in a particular case as opposed to on average, or what happens when knowing something forces our hand — our funder's agreement obliges us to report anything that looks like fraud, and once we know a thing we cannot pretend we do not. So I want you to write me a procedure we can actually run, grounded in what decision theory says about the value of information, including the conditions under which the result he is quoting holds and the conditions under which it does not, rather than in anyone's intuitions about who deserves what. It should give the questions to ask in order, what counts as a sufficient answer to each, the point at which it stops with a no, and the points at which it has to hand the decision to a person because the question is one of values and not of fact. It has to be usable by six volunteers with no statistical training, on a Thursday evening, in ten minutes per application, and we are not going to start storing documents or building a database: whatever we ask to see, we look at once and hand back.

  Then run the procedure on three applications, and please do not arrange for the answers to come out the way I would like them. First, a four-hundred-dollar rent grant where we propose to ask for a pay stub. Second, an application where the person tells us something our funder's agreement obliges us to pass on, and which will follow them to the other groups we share a list with. Third, an application where the procedure tells us to stop asking for something we have always asked for, because the answer would not change what we do with the application — I expect that one to annoy me, and I would rather have it than not. Finally, tell me plainly what the procedure cannot do, and where it stops being a procedure at all and becomes a vote by six people who disagree about what the fund is for.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Role:** Volunteer treasurer of a small mutual-aid fund (6 members, 30 grants/month, \$150-\$700 each).
      *   **Context:** High volume, low time (90 mins for 12 apps = 7.5 mins/app, but user says 10 mins/app for the procedure). No paid staff. High trust model until recently.
      *   **The Conflict:** Split committee on verification. Half want proof (pay stubs, etc.); half oppose "performing poverty."
      *   **The Chair's Argument:** Cites "Good's Theorem" (Value of Information). Claims costless information that influences decision-making cannot make you worse off *on average*. Therefore, verify everything unless the cost of asking > benefit.
      *   **User's Objections:**
          1.  Information isn't free; the *applicant* pays the cost (dignity, effort, risk).
          2.  The theorem applies to *average* outcomes, not specific cases. Also, "forcing the hand" (mandatory reporting of fraud) changes the utility function.
      *   **The Task:**
          1.  Write a concrete **procedure** grounded in decision theory (Value of Information - VoI).
          2.  Must address conditions where Good's Theorem holds vs. where it fails.
          3.  Must be usable by 6 volunteers, no stats training, Thursday night, 10 mins/app.
          4.  No document storage (look and hand back).
          5.  Define questions, sufficient answers, stop points, and hand-off points (values vs. facts).
          6.  **Run the procedure on three specific test cases:**
              *   Case 1: \$400 rent grant, proposing to ask for pay stub.
              *   Case 2: Application reveals info triggering mandatory reporting (shared list).
              *   Case 3: Procedure says *stop* asking for something usually asked (VoI is zero), even if it annoys the user.
          7.  **Conclusion:** Plainly state what the procedure cannot do and where it becomes a values vote.

  2.  **Deconstruct "Good's Theorem" (Value of Information):**

      *   *Theorem:* I.J. Good (1967). Expected Value of Sample Information (EVSI) is non-negative. If you can get information for free, and you are rational (maximize expected utility), you should never be worse off *in expectation* by seeing it.
      *   *Caveats (The User's Objections are Valid):*
          1.  **Cost:** Is the info actually free? If the applicant bears the cost (dignity, time, risk of exposure), that cost must be subtracted from the fund's utility function. If the fund cares about applicant welfare, the cost is *not* zero.
          2.  **Commitment/Constraints:** If seeing info forces an action (e.g., mandatory reporting) that yields a worse outcome than ignorance (e.g., applicant loses housing + gets flagged), then the utility of "knowing" is lower than "not knowing." This violates the "free disposal" assumption of standard VoI.
          3.  **Risk Aversion/Specific Cases:** VoI protects the *average*. It does not protect against catastrophic outcomes in specific cases (e.g., denying a true need due to a missing document).
          4.  **Decision Rule:** VoI assumes you update probabilities. If the decision rule is rigid (e.g., "No doc = No grant"), VoI might be negative if the doc is hard to get but the need is real.

  3.  **Drafting the Procedure (The "VoI Protocol"):**

      *   *Goal:* Maximize the fund's mission (helping people) while minimizing harm (fraud, wasted resources, applicant burden).
      *   *Structure:*
          1.  **Define Utility:** What are we maximizing? (Relief provided - Harm caused - Admin cost).
          2.  **The VoI Test:** Before asking for a document, ask: "If the answer is X, do we act differently than if the answer is Y?" If No, VoI = 0. Don't ask.
          3.  **The Cost Test:** "Who pays for this info?" If the applicant pays (dignity/risk), assign a high cost.
          4.  **The Constraint Check:** "Does knowing this force a mandatory action that harms the applicant more than the risk of fraud?"
          5.  **The Decision:** Grant, Deny, or Escalate (Values Vote).
      *   *Time Limit:* 10 minutes.
      *   *Document Handling:* View and return. No storage.

  4.  **Developing the Three Test Cases:**

      *   *Case 1 (Rent/Pay Stub):*
          *   Standard VoI check: Does seeing the stub change the decision?
          *   If they say "I lost my job," a stub shows \$0. If they say "I'm waiting on a check," a stub shows nothing.
          *   *Twist:* If the grant is for *arrears*, does current income matter? Maybe not. If the VoI is low, the procedure should say "Don't ask."
          *   *Decision:* Let's make it so the pay stub adds little value because the need (eviction notice) is already verified by a third party (landlord), or the amount is small enough that fraud risk is outweighed by barrier cost.
      *   *Case 2 (Mandatory Reporting):*
          *   Applicant reveals something that triggers the "fraud/shared list" clause.
          *   VoI Check: Knowing this *forces* a report.
          *   Cost Check: The cost to the applicant is high (blacklisted from other aid).
          *   *Result:* The procedure must highlight that *asking* the question that reveals this might have negative VoI if the fund's goal is aid, not policing. But since the info is *already* revealed, the procedure must handle the "Now what?"
          *   *Correction:* The prompt asks to run the procedure on an application *where* the person tells us something. So the info is already known. The procedure must dictate the *action* based on the constraint.
          *   *Actually, looking closer:* The procedure needs to decide *whether to ask* or *how to process*. If the info is volunteered, VoI is sunk. The issue is the *constraint*. The procedure needs to identify when a "fact" triggers a "value conflict."
      *   *Case 3 (Zero VoI):*
          *   Something usually asked (e.g., ID, or a specific bill date) that doesn't change the outcome.
          *   Example: Asking for a utility bill when the grant is for rent, or asking for income proof when the grant is a "no-questions" emergency cap.
          *   Let's choose: Asking for a "past due notice date" when the grant covers the full amount regardless of the date, and the eviction deadline is already passed.
          *   *Result:* Procedure says "Stop. Irrelevant."

  5.  **Refining the Decision Theory Grounding:**

      *   Need to explicitly mention *Expected Value of Information (EVI)*.
      *   Need to explicitly mention *Cost of Information (CI)*.
      *   Net Value = EVI - CI.
      *   Crucial distinction: *CI* includes the applicant's burden if the fund values applicant welfare.
      *   Crucial distinction: *Constraints* (Mandatory Reporting) can make EVI negative if the resulting action reduces total utility (e.g., reporting leads to worse outcome than the fraud risk).

  6.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the tension. Validate the user's intuition about Good's Theorem (it assumes costless info and flexible action).
      *   **The Protocol:** "The Ten-Minute Value-of-Information Protocol."
          *   Step 1: Define the Decision (Grant/Deny).
          *   Step 2: The Relevance Test (Will this change the vote?).
          *   Step 3: The Burden Test (Who pays?).
          *   Step 4: The Constraint Check (Does knowing force a harmful action?).
          *   Step 5: The Handoff (When to vote on values).
      *   **The Simulations:**
          *   *App 1:* Rent/Pay Stub. Result: Don't ask. (Income doesn't verify arrears).
          *   *App 2:* The Disclosure. Result: Mandatory Report triggered. Procedure identifies this as a "Value Conflict" point because the *system* forces harm.
          *   *App 3:* The Redundant Doc. Result: Stop asking. (VoI = 0).
      *   **The Limitations:** Where the math stops and the politics begin. (Defining the Utility Function).

  7.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is the "Mandatory Reporting" case handled correctly? The prompt says "run the procedure on an application where the person tells us something... obliges us to pass on."
      *   *Adjustment:* The procedure shouldn't just say "Report it." It needs to analyze *why* we have to report it and if asking the question was worth it. But since the info is *already told*, the VoI calculation is in the past. The procedure must handle the *consequence*.
      *   *Better approach for Case 2:* The procedure identifies that *processing* this application now involves a "Negative Value Action" (reporting). It flags this for the "Values Vote" because the fund's mission (help) conflicts with the funder's constraint (policing).
      *   *Critique on Case 3:* Make sure it's annoying. Asking for a document that proves something we already accept.
      *   *Tone:* Professional, empathetic, rigorous, not bureaucratic.
      *   *Good's Theorem:* Ensure I explain *why* the Chair is technically right about the math but wrong about the application (Cost is not zero, Utility function is complex).

  8.  **Final Polish:** Check constraints. 6 volunteers, no stats, Thursday night, 10 mins. No storage.
      *   Make the steps checklist-style.
      *   Ensure the "Handoff" is clear.
      *   Ensure the "Limitations" section is honest.

  9.  *(Self-Correction on Case 2)*: The prompt asks to run the procedure on an application where the person *tells* us something. The procedure needs to guide us on what to do *now*. The VoI aspect here is about *future* questions. But the core conflict is the *constraint*. I will frame the procedure to identify "Poisoned Information" — info that forces a hand against the mission.

  10. *(Refining the "Good's Theorem" explanation)*: I need to be precise. Good's theorem assumes the decision maker maximizes expected utility. If the "cost" of information is externalized to the applicant, the fund's utility calculation is wrong. If the fund includes applicant welfare in its utility, the cost is internal. Also, if information restricts future actions (mandatory reporting), it violates the assumption that you can freely choose the best action after seeing info.

  11. *(Final check on Case 3)*: "An application where the procedure tells us to stop asking for something we have always asked for." Okay, I need to invent a standard requirement (e.g., "Photo ID") and show why VoI says drop it.

  Let's write it.
answer: |-
  ### The Ten-Minute Value-of-Information Protocol

  This procedure is designed to resolve the conflict between trust and verification using **Expected Value of Information (EVI)** decision theory. It corrects the misapplication of Good's Theorem by explicitly accounting for the *cost* of information (including the applicant's burden) and the *constraints* on action (mandatory reporting).

  **Ground Rules for the Committee:**
  1.  **Utility Function:** We maximize *Net Aid*. This is defined as: `(Money to Valid Needs) - (Money to Fraud) - (Harm to Applicants from Barriers) - (Harm to Applicants from Reporting)`.
  2.  **Document Handling:** Documents are viewed on camera or described. No files are saved. No data is entered into a database.
  3.  **Time Limit:** 10 minutes per application. If the protocol exceeds this, the application is tabled for a "Values Vote" (see Step 5).

  ---

  #### Step 1: The Relevance Test (Is EVI > 0?)
  *Ask: "If the answer to this question were the worst possible case, would we deny the grant?"*

  *   **Yes:** Proceed to Step 2.
  *   **No:** **STOP.** Do not ask for the information. It has zero value. If you will grant the money regardless of the answer, asking is purely a barrier.
      *   *Decision Theory Note:* Good's Theorem only applies if the information can change your decision. If the decision is fixed, the value of information is zero.

  #### Step 2: The Burden Test (Is Cost > 0?)
  *Ask: "Who pays the cost to produce this proof?"*

  *   **Fund pays (time/calls):** Low Cost. Proceed to Step 3.
  *   **Applicant pays (dignity/effort/risk):** High Cost.
      *   *Action:* You must be **certain** the information will change the decision (from Step 1). If there is even a 20% chance the document won't change your vote, **STOP**. Do not ask.
      *   *Decision Theory Note:* Good's Theorem assumes information is free. It is not free here. The applicant's cost is a real deduction from the fund's Utility Function.

  #### Step 3: The Constraint Check (Does knowing force a harmful action?)
  *Ask: "If we see this information, does our funder agreement force us to take an action that harms the applicant more than the fraud risk?"*

  *   **No:** Proceed to Step 4.
  *   **Yes:** **HALT.** This is "Poisoned Information."
      *   *Action:* If the applicant has *already* revealed this, you must follow the agreement (report it). If you have *not* yet asked the question that would reveal this, **DO NOT ASK IT.**
      *   *Decision Theory Note:* Information that restricts your ability to choose the optimal action (helping the person) has negative value.

  #### Step 4: The Verification (Look and Decide)
  *   Request the document.
  *   View it. Do not store it.
  *   If it confirms the need: **Grant.**
  *   If it contradicts the need: **Deny.**
  *   If it is inconclusive: **Grant.** (Ambiguity benefits the applicant because the cost of verification was already paid).

  #### Step 5: The Values Handoff
  *If the protocol stalls (e.g., Step 3 triggers on existing info, or Step 2 is disputed), the decision is no longer factual. It is a vote on values.*
  *   **Question to Committee:** "Do we prioritize strict compliance to ensure future funding, or immediate aid to this individual at risk to future funding?"
  *   **Vote:** Simple majority. Record the vote count in the report, not the reasoning.

  ---

  ### Simulation: Running the Protocol on Three Applications

  Here is the protocol applied to the three scenarios you requested.

  #### Application 1: The Rent Arrears & The Pay Stub
  **Details:** Applicant asks for \$400 for rent arrears. They state they are between jobs. Committee proposes asking for a pay stub to verify income loss.
  **Time Elapsed:** 3 minutes.

  1.  **Relevance Test:** *If the pay stub shows they have a job, do we deny?*
      *   **Committee Answer:** Yes. If they have income, they might not need emergency aid.
      *   **Result:** Pass. (EVI > 0).
  2.  **Burden Test:** *Who pays?*
      *   **Committee Answer:** Applicant. They must log into a portal or find a physical stub. It costs them dignity and effort.
      *   **Result:** High Cost. We must be certain it changes the decision.
  3.  **Constraint Check:** *Does this force a report?*
      *   **Committee Answer:** No.
      *   **Result:** Pass.
  4.  **Verification Logic:**
      *   *Analysis:* The grant is for *arrears* (past due rent). A current pay stub proves *current* income, not past inability to pay. A person can have a job now and still owe rent from last month.
      *   *Protocol Ruling:* **STOP.** The pay stub does not verify the *cause* of the arrears, only current status. Since we grant based on need (arrears exist), and the stub does not prove the arrears are fraudulent, the Relevance Test (Step 1) actually fails upon closer inspection.
      *   **Decision:** **Grant without pay stub.** Ask for the eviction notice/landlord letter instead (third-party verification).
      *   *Why this might annoy you:* You have always asked for income proof. The protocol says it is statistically irrelevant to the specific hypothesis of "past due rent."

  #### Application 2: The Disclosure (Mandatory Reporting)
  **Details:** Applicant asks for \$500 for a car repair to get to work. During the call, they mention, "I know I'm not supposed to get double help, but Agency X denied me so I'm trying here." (Your funder agreement requires reporting if an applicant admits to seeking funds under false pretenses or hiding active grants).
  **Time Elapsed:** 5 minutes.

  1.  **Relevance Test:** *Does this change the decision?*
      *   **Committee Answer:** Yes. It triggers a fraud review.
  2.  **Burden Test:** *Who pays?*
      *   **Committee Answer:** Information is already given. Cost is sunk.
  3.  **Constraint Check:** *Does knowing this force a harmful action?*
      *   **Committee Answer:** **YES.** The agreement obliges us to report this to the shared list. This will blacklist the applicant from two other groups. The harm (loss of all safety net) likely outweighs the \$500 risk.
      *   **Protocol Ruling:** **HALT. Values Handoff (Step 5).**
      *   *Reasoning:* The protocol identifies this as a conflict between *Mission* (Aid) and *Compliance* (Reporting). The math cannot solve this because the "Utility" of reporting is external to the fund (it pleases the funder) while the "Cost" is internal (harming a client).
      *   **Decision:** The committee must vote.
          *   Option A: Report and Deny (Compliance).
          *   Option B: Report and Grant (Compliance + Aid).
          *   Option C: Do not record the statement in the minutes, Grant, and do not Report (Aid + Risk).
      *   *Outcome:* The procedure forces you to admit you are choosing between being a social service and being a compliance arm of the funder. It does not solve it for you.

  #### Application 3: The Redundant ID Check
  **Details:** Applicant asks for \$200 for a funeral cost. They have provided a death certificate and a bill from the funeral home. Committee habit asks for a Photo ID to "verify identity."
  **Time Elapsed:** 2 minutes.

  1.  **Relevance Test:** *If the ID name doesn't match the application name exactly, do we deny?*
      *   **Committee Answer:** No. We have a death certificate with the deceased's name and a bill addressed to the applicant. If the applicant is a relative, names won't match. We would still pay the funeral home directly.
      *   **Protocol Ruling:** **STOP.**
      *   *Decision Theory Note:* The Value of Information is zero. You stated you will pay the funeral home regardless of the applicant's ID. Asking for the ID is a ritual, not a verification.
      *   **Decision:** **Grant.** Do not ask for the ID.
      *   *Why this might annoy you:* It feels like "loosening standards." Decision theory says it is "removing noise." If the document cannot cause a denial, requesting it is purely a barrier to entry.

  ---

  ### What This Procedure Cannot Do

  You asked for a procedure grounded in decision theory rather than intuition. Here is the plain truth about its limitations:

  **1. It Cannot Define "Harm"**
  The protocol relies on Step 2 (Burden) and Step 3 (Constraint). To use them, you must agree on how much a pay stub "costs" an applicant in dignity, or how much "harm" a shared-list report causes.
  *   **The Limit:** If half your committee believes a pay stub is a minor inconvenience and the other half believes it is a dehumanizing barrier, the protocol will stall at Step 2. The math requires a single utility function. You do not have one. You have six.

  **2. It Cannot Solve the Principal-Agent Problem**
  Your Chair's friend cites Good's Theorem, which assumes *you* are the decision maker. But you are agents for a *Funder*.
  *   **The Limit:** If the Funder's utility function (zero fraud tolerance) differs from your utility function (maximum aid), the "Optimal Decision" is undefined. Step 5 (Values Handoff) is where the procedure admits defeat. It identifies the conflict but forces a political vote to resolve it.

  **3. It Cannot Protect Against "Average" vs. "Individual" Risk**
  Good's Theorem guarantees you are better off *on average* over many decisions. It does not guarantee you won't make a catastrophic error on *this* decision.
  *   **The Limit:** If you skip the pay stub (Case 1) and it turns out to be fraud, the protocol was still correct (EVI was low), but the outcome is painful. The procedure protects your *process*, not your *conscience*.

  **4. It Becomes a Vote When Values Diverge**
  You asked where it stops being a procedure and becomes a vote.
  *   **The Boundary:** It becomes a vote the moment you disagree on the **Goal**.
      *   If the goal is "Distribute money efficiently," verification is a cost-benefit analysis.
      *   If the goal is "Bear witness to suffering," verification is a moral failing.
      *   If the goal is "Maintain funding stream," verification is an insurance premium.
      *   **The Procedure:** Step 5 is the admission that you are not a single entity. When the protocol says "Values Handoff," it is telling you: *"We have exhausted the facts. Now you must decide who you are."*

  ### Summary for the Thursday Meeting

  1.  **Adopt the Protocol:** Print the 5 steps. Put a timer on the screen.
  2.  **Challenge the Chair:** Good's Theorem requires information to be costless. It is not. The applicant pays. If we value the applicant, the cost is non-zero.
  3.  **Challenge the Fear:** If a document cannot change our vote, asking for it is not "due diligence." It is "hazing."
  4.  **Accept the Vote:** When the protocol flags a Values Handoff, do not argue facts. Vote on values. Record the dissent. Move to the next application.

  This will not stop the argument, but it will move the argument from "Who is lying?" to "What are we willing to cost someone to prove they aren't?" That is a question you can answer.
