      *   **The "Weaker but Uncomfortable" Form:**
          *   Does the argument come back? Yes, in the form of: "Even if we only use heuristics, why are our heuristics so *good* on real-world data?"
          *   This leads to the study of *Smoothed Analysis* or the structure of the "physical world" distribution of problems. It suggests the universe we live in doesn't generate worst-case NP-hard instances often.
