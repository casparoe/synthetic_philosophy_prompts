answer: |-
  Ten years ago, we handed you a book. Today, we sit in the room where the war was signed away, and I am asked to tell you what that book was worth.

  We need to be precise about what happened here, because the words we used then have worn thin. We spoke often of acknowledgment. We did not speak enough about what acknowledgment cannot do. Acknowledgment is the state putting its name to a victim's account so that it stops being a claim and becomes a record. It changes the status of the truth, not the status of the dead. It does not undo. It does not punish. It simply says: this happened, and the state knows it happened.

  We also spoke of amnesty. That was not a moral act. It was a legal transaction. It was conditional and revocable. It was ours to grant, and ours to take back if the applicant lied. We granted eight hundred. We revoked six.

  And we must be clear about what was never ours to give. Forgiveness belongs to the living who were harmed, or to the dead who cannot speak. It was not the Commission's to offer. It was not mine. When we handed over our report, we did not deliver forgiveness. We delivered a record of who did what, and a list of who was legally safe because they told us about it.

  I stand here to confront the math of that safety. Four thousand men applied. Eight hundred walked free. Six lost their protection. In ten years, one senior perpetrator has been convicted, and only because we revoked his amnesty, not because we refused it. The report said those refused amnesty were to be prosecuted. The state was to explain itself where it did not prosecute. It has never explained.

  For ten years, I have told audiences that this process was a form of justice. Looking at these numbers, I cannot say that anymore. Justice implies a balance between debt and payment. What we constructed was justified without being just. It was permissible, given that the alternative was the continuation of the war. It was not what anyone was owed. I know this sounds like a lawyer's evasion. I intend it as a concession. We stopped the killing. We did not settle the account.

  To the men who received amnesty: some of you sit in this room as officials. Your grant purchased legal safety. It did not purchase moral cleanliness. The six revocations stand as a warning that the grant was never absolute, but the fact that there were only six tells you how rarely that warning was heeded. You have the state's protection. Do not mistake that for the community's respect.

  To the man named in our report who sits in this room untried: you were never amnestied. You were never prosecuted. You are here by invitation of the agreement, but you are here in spite of the report. I will not pretend you are not there. The state has failed to enforce the bargain that allowed you to sit here safely. That failure is not mine, but it stains this room.

  To the government: the reparations commitment is unpaid. This is not a plea for funds. It is a statement of debt. Reparations are not charity offered by a benevolent state; they are obligations incurred by a state that survived a war it could not win. To leave them unpaid is to treat the agreement as a suggestion rather than a contract.

  To the foreign delegations: you paid for this exercise. You bought a process, not a result. You funded the truth, but you cannot fund the justice that must follow it. Do not count your contribution as peace bought. It was testimony purchased. The rest was left to us, and we have left it undone.

  To the families: some of you worked with us. Some of you refused us from the first week. One of you said publicly that we gave the murderers their lives back and gave you a document. She is right. That was the exchange. You got a record. They got their liberty. I will not tell you that this was fair. I will not tell you that your grievance is irrational. It is rational to demand more than paper when you have lost a body. The bargain was necessary to stop the blood, but necessity does not make it right for you.

  There is one thing I will not say today. I will not promise you that the reparations will come. I am not the government. To make that promise would be to lie to you again. A promise broken twice is heavier than a debt unpaid once. I will not add my voice to the silence that has held for ten years. I will only say that the obligation remains, whether the money moves or not.

  We used words like closure. We were wrong. There is no closure in a report. There is only the end of the telling. We spoke of moving forward. You cannot move forward when the ground beneath you is still unmarked graves. We used those words because we needed them to be true. They were not.

  What we produced was acknowledgment. It gives you the certainty that you are not mad, that what happened to you was real and is now written. It does not give you back what was taken. It does not give you the satisfaction of seeing the guilty punished, unless the state does what we could not.

  I know this is not the speech you were promised. You were told this day would mark healing. It marks an anniversary. It marks time passed. It does not mark time healed.

  To the families who refused us: your refusal was a verdict on the process. You judged that the cost was too high. I stand by the necessity of the bargain, but I cannot stand against your judgment that it was insufficient. You live with the loss. I live with the record. The record is lighter.

  The agreement obliges every signatory to be invited. So you are all here. The victims, the perpetrators, the state, the donors. We are bound by the same document. But we are not bound by the same silence.

  The report is on the shelves. The names are in the text. The untried are in the room. The dead are in the ground. The debt is on the books.

  I chaired the Commission. We told the truth as we found it. We did not fix the world. We documented the break. That was the job. It was not enough. It was all we could do.

  Thank you.
