answer: |-
  The controversy surrounding the moral status of suffering often centers on whether the alleviation of extreme pain holds a special, overriding priority over the provision of ordinary pleasure or the prevention of minor pains. This intuition drives **lexical-threshold negative utilitarianism**, a view asserting that once suffering crosses a specific threshold of severity, it morally dominates any finite amount of sub-threshold benefit. This position creates a philosophical tension: it relies on the intuition that extreme suffering is *incommensurable* with ordinary goods, yet it seemingly requires a *common scale* to identify where the threshold lies.

  To adjudicate this tension, we must assess the thesis that lexical-threshold negative utilitarianism requires **scale commensurability** (a single measure ranking all experiences) while denying **exchange commensurability** (the ability to trade finite quantities of one for the other), and that this combination is coherent. This essay argues that this thesis is **false**. While a proponent can mathematically model lexical preferences using non-Archimedean structures, doing so abandons the "single measure" condition required by scale commensurability in the context of welfare aggregation. The thesis fails because it conflates the *phenomenal intensity* of experience (which can be scaled) with the *moral weight* of that experience (which, if lexical, cannot be).

  ### The Coherence Challenge: Scale vs. Exchange

  Why might one think the thesis is true? Proponents argue that we intuitively rank pains. We know that a migraine is worse than a pinprick, and torture is worse than a migraine. This suggests a continuum of badness—a single scale of welfare—on which a threshold can be marked. The lexical claim is simply that the moral disvalue function becomes vertical or discontinuous at that mark. On this view, scale commensurability is satisfied because we can rank experiences, but exchange commensurability is denied because the moral "cost" jumps to infinity (or a higher order of magnitude) at the threshold.

  However, the objection that this is impossible rests on the **Archimedean property** inherent in standard measurement. In welfare economics and decision theory, a "single measure" capable of supporting aggregation (summing totals) implies that for any two values $A$ and $B$, there exists some integer $n$ such that $n$ units of $B$ outweigh $1$ unit of $A$. This is the mathematical definition of exchange commensurability. If experiences share a single cardinal scale (like real numbers), they are necessarily exchangeable. To assert lexical priority is to assert that no finite number of headaches equals one agony. If no finite number equals it, then agony cannot be represented by a real number on the same scale as headaches without violating the rules of arithmetic that make the scale useful for utilitarian calculation.

  Therefore, the thesis faces a dilemma: if the scale is standard (real-valued), exchange commensurability holds, and lexical priority fails. If lexical priority holds, the scale must be non-Archimedean (e.g., using hyperreal numbers or lexicographic vectors). But a lexicographic vector $(x, y)$ is not a "single measure" in the sense required by scale commensurability; it is a tiered system. Consequently, the claim that the view maintains a single measure while denying exchange rates is conceptually unstable.

  ### The Concrete Case: Agony vs. Headaches

  Consider a choice between preventing a single episode of prolonged, brutal torture (Agony) and curing a very large number of mild, transient headaches (Headaches).

  According to the lexical-threshold view, the verdict is absolute: prevent the Agony, regardless of the number of Headaches. Even if curing the headaches would allow billions of people to live comfortably for a year, the single instance of Agony takes moral priority.

  Is this verdict defensible? Intuitively, it has strong pull. Many feel that torture possesses a qualitative horror that mere aggregation of minor annoyances cannot match. However, the implications reveal the incoherence of the "single scale" claim. If Agony and Headaches are on a *single measure* of welfare, we should be able to ask, "How much welfare is lost in Agony?" and "How much is lost in a Headache?" If the answer is, for example, $-1,000,000$ units and $-1$ unit respectively, then $1,000,001$ headaches outweigh the torture. To avoid this, the lexical theorist must say the welfare loss of Agony is *infinite* or of a *higher order*.

  But if the loss is infinite, it cannot be "located" on the same scale as the finite headache. You cannot mark a point on a ruler where the inches suddenly become miles. The "threshold" is not a point on a continuum; it is a boundary between two different categories of value. If the theorist insists they are on the same scale, they invite the objection: "If they are on the same scale, why does the math stop working at the threshold?" The verdict is defensible only if we admit that the "measure" changes nature at the threshold, which contradicts the requirement of a single, uniform scale.

  ### The Nature of the Threshold

  The coherence of the thesis depends heavily on how we understand the threshold. Is it a feature of the experiences themselves, the moral weights assigned, or the decision procedure?

  1.  **Feature of Experience:** If the threshold is phenomenological (e.g., pain becomes "unbearable"), this supports scale commensurability of *intensity* but not *value*. One can measure pain intensity on a scale of 1-10, but moral value might not map linearly to intensity.
  2.  **Feature of Moral Weight:** If the threshold is axiological (a discontinuity in the value function), this supports lexical priority but undermines scale commensurability. A discontinuous function that jumps to infinity does not map to a single real-valued measure of "goodness."
  3.  **Feature of Decision Procedure:** If the threshold is a heuristic or deontological constraint within a consequentialist framework, the tension dissolves, but so does the utilitarianism. It becomes a hybrid view.

  The thesis fails because it attempts to treat the threshold as a feature of moral weight while retaining the mathematical machinery of a single scale. If the threshold is a discontinuity in moral weight, then the "measure" above the threshold is fundamentally different from the "measure" below it. They are not commensurable on a single scale; they are incommensurable orders of value. The theorist claims there is one scale to locate the threshold, but the lexical priority implies there are actually two scales (sub-threshold and supra-threshold) that cannot be arithmetically combined.

  ### Verdict

  The thesis that lexical-threshold negative utilitarianism requires scale commensurability but denies exchange commensurability, and that this is coherent, is **false**.

  The defense of this verdict rests on the strongest objection raised: the **Archimedean objection**. In any system where a "single measure" allows for the ranking and aggregation of welfare (as utilitarianism requires), the Archimedean property must hold. This property dictates that any two quantities are comparable by some finite multiple. Lexical priority explicitly denies this. Therefore, one cannot have a single cardinal scale that supports lexical priority.

  To save the view, one must amend it: Lexical-threshold negative utilitarianism requires **phenomenal scale commensurability** (we can rank pain intensity) but denies **axiological scale commensurability** (we cannot rank moral disvalue on a single cardinal scale). The threshold is not a point on a shared moral ruler; it is a category shift. Once this amendment is made, the view admits that extreme suffering and minor pains are, in the final moral calculus, incommensurable. They do not share a "single measure of welfare." They share a measure of *sensation*, but not of *value*.

  The original thesis attempts to have it both ways: to use the precision of a scalar model to locate the threshold, while using the rigidity of lexical priority to block trade-offs. This is mathematically and conceptually impossible. A threshold that blocks all trade-offs is not a line on a map; it is the edge of the map. To claim otherwise is to disguise a categorical distinction as a quantitative one, rendering the theory vulnerable to the charge that it is either not truly lexical (if it allows a scale) or not truly scalar (if it is truly lexical). The tension is resolved only by abandoning the claim of a single moral measure.
