answer: |-
  Subject: Framing specification for the paradoxes reading group

  Dear colleagues,

  As we prepare to convene this reading group, I want to ensure we begin with a clear understanding of the target we are aiming at. Too often discussions of paradox dissolve into defenses of preferred machinery before we have agreed on what counts as a solution. The purpose of this handout is to specify the requirements for an adequate theory of truth, given the expanded fragment of language we will be investigating. We are not working with the standard liar alone. Our language contains the ordinary resources for talking about sentences, a truth predicate, and an operator expressing what a sentence ought to be believed. These vocabularies combine freely. This means we are dealing with the standard liar sentence that says of itself only that it is not true, but also a normative liar that says of itself only that it ought not to be believed, as well as liar cycles and mixed cases where a sentence asserts that the normative liar is true. A theory must have something to say about all of these, including whether the normative liar is even the kind of thing that can be true or false in the same sense as the standard liar. What follows is the specification of what any theory must deliver to be considered adequate for our purposes. I have distinguished between requirements I regard as non-negotiable constraints on any serious theory and those that are house rules of particular camps, which we may need to relax depending on how the limitative results bear out.

  The first requirement is non-triviality, and I regard this as non-negotiable. The theory must not entail that every sentence in the language is true, or that every sentence is provable. The case behind this is the standard liar. If a theory allows the derivation of a contradiction from the liar sentence and then employs classical explosion, the theory becomes useless for semantics because it cannot distinguish between coherent and incoherent discourse. Even if a theory tolerates some contradictions, it must block triviality. Without this, the theory fails to model a language that users can actually speak without committing themselves to absurdity. This is the baseline floor for any formal semantics.

  The second requirement is expressive completeness, which I also regard as non-negotiable. The theory must be able to express its own semantic concepts within the object language. The case behind this is Tarski's constraint on semantic closure. If a theory of truth requires a metalanguage to state the truth conditions of the object language, and that metalanguage is strictly richer than the object language, then we cannot state the theory of truth for the entire language within the language itself. Given that we are natural language speakers who can talk about the truth of our own sentences, a theory that relegates truth to a hierarchy of metalanguages fails to capture the phenomenon we are trying to model. We need a theory that allows us to say of the liar sentence that it is paradoxical, or gappy, or false, without stepping outside the system.

  The third requirement is normative distinctness, and this is non-negotiable given our specific fragment. The theory must not collapse the extension of the truth predicate into the extension of the ought-to-be-believed operator. The case behind this is the comparison between the standard liar and the normative liar. While both generate paradoxes, there is a pre-theoretical distinction between descriptive truth and normative obligation. A theory that simply identifies truth with obligatory belief loses the ability to explain cases where a sentence might be true but ought not be believed, or vice versa, even outside of paradoxical cases. More importantly, in the mixed cases where a sentence asserts that the normative liar is true, the theory must explain why this assertion behaves the way it does without simply stipulating that the normative liar is invisible to the truth predicate. If the theory treats the normative liar as outside the domain of truth, it must explain why the mixed sentence is grammatical and meaningful. Collapsing the two operators solves the paradox by fiat but fails to model the semantics of the fragment we actually care about.

  The fourth requirement is compositional stability for mixed cases, which I treat as non-negotiable. The theory must provide truth conditions for sentences that combine the truth predicate and the belief operator. The case behind this is the sentence asserting that the normative liar is true. If the normative liar lacks a truth value, does the mixed sentence inherit that gap, is it false, or is it true? A theory that handles the standard liar well but breaks down when the vocabularies interact is insufficient. We need to know how the semantics of truth and the semantics of normativity compose. If the theory says the mixed sentence is meaningless, it owes an explanation of why the syntax allows it. If it says the mixed sentence is false, it must explain why negating it does not regenerate paradox. This requirement ensures the theory covers the whole fragment, not just isolated sub-cases.

  The fifth requirement is the preservation of classical logic, and I mark this as a house rule of the classical camp rather than a non-negotiable constraint. The case behind this is the desire to maintain standard inference patterns like disjunctive syllogism and the law of excluded middle across the entire language. Many formal semanticists prefer to keep the logic fixed and adjust the semantics of truth. However, given the limitative results, this is a point of leverage. We cannot pretend away the fact that classical logic combined with naive truth leads to inconsistency. So while I list this as a desideratum because it is a standard hope for many of us, it is negotiable if it conflicts with the non-negotiable requirements.

  The sixth requirement is the unrestricted T-schema, which I also mark as a house rule, specifically of the naive truth camp. The case behind this is the intuition that truth is transparent. The sentence snow is white is true if and only if snow is white. We want the truth predicate to be eliminable without change in meaning or truth conditions. This is a powerful semantic desideratum because it preserves the intuition that truth is not a substantive property adding content to a sentence. However, like classical logic, this is a point of leverage. We cannot have classical logic, unrestricted transparency, and consistency all at once.

  Now I must address whether any subset of this list is jointly unsatisfiable. The answer is yes. The subset consisting of non-triviality, classical logic, and the unrestricted T-schema is jointly unsatisfiable in the presence of self-reference. This is the core limitative result we cannot pretend away. If we keep classical logic and the unrestricted T-schema, we derive a contradiction from the liar sentence, and by classical explosion, we violate non-triviality. Therefore, one of these requirements has to give. Since I have marked non-triviality as non-negotiable, the choice is between classical logic and the unrestricted T-schema. For the purposes of this reading group, I recommend that classical logic is the requirement that has to give. The reason is that preserving the unrestricted T-schema is more central to the semantic goal of modeling natural language truth, which appears to be transparent, than preserving classical logic, which is a tool for modeling inference. We can adopt a non-classical logic that restricts certain inference rules for paradoxical sentences while maintaining transparency for ordinary sentences. Sacrificing classical logic allows us to keep the naive truth schema and avoid triviality, which satisfies the non-negotiable constraints better than sacrificing transparency would.

  Finally, I want to identify which single requirement on this list does the most to exclude otherwise popular theories. The requirement for the preservation of classical logic does the most work here. Insisting on classical logic across the entire fragment, including paradoxical sentences, excludes the family of non-classical approaches. This includes paracomplete theories that allow truth value gaps, paraconsistent theories that allow true contradictions without explosion, and non-contractive theories that restrict structural rules. These are highly popular and developed families of solutions in the current literature on paradox. By demanding classical logic, we rule out all of them immediately, forcing us toward hierarchical or contextual solutions that typically retain classical logic by restricting the T-schema. Since I have suggested above that classical logic is the requirement that should give, this highlights the major fault line in our upcoming discussions. We must decide whether we are willing to depart from classical logic to save transparency, or whether we will retain classical logic and accept a hierarchical or restricted theory of truth. This choice will determine the trajectory of the reading group.

