  ### The Principle of Medium-Relative Authorization

  **Statement:**
  *The artistic value of an artifact is determined by the degree to which it satisfies the conditions of **authorization** required by the **constitutive norms** of its specific medium, where authorization is a function of either (A) causal history, (B) pattern fidelity, or (C) contextual intent, depending on what the medium is conventionally understood to transmit.*

  This principle relies on three distinct clauses. Each clause is forced by specific verdicts in your list that would otherwise contradict one another.

  **Clause 1: The Trace Norm (History is Essential)**
  *In media where the artistic statement is understood to be the unique physical trace of the artist's agency, value requires an unbroken causal chain to the creator.*
  *   **Verdicts forcing this clause:** 1 (Forgery), 6 (Analog Print), 8 (Letter).
  *   **Explanation:** In painting, handwriting, and traditional photography, the "work" is not just the image but the fact that *this specific hand* made *this specific mark*. A forgery (1) breaks the chain; a technician's print (6) lacks the artist's chemical authorization; a facsimile letter (8) lacks the personal trace. The value lies in the contact.

  **Clause 2: The Notational Norm (Pattern is Essential)**
  *In media where the artistic statement is understood to be a structure intended for indefinite replication, value resides in the fidelity of the pattern, and history is irrelevant.*
  *   **Verdicts forcing this clause:** 4 (Novel), 7 (Digital File).
  *   **Explanation:** Literature and digital files are designed for dissemination. The "work" is the text or data, not the paper or hard drive. A paperback (4) or a copied file (7) instantiates the pattern perfectly, so the work is wholly present. To demand the "original" here is to misunderstand the medium's contract.

  **Clause 3: The Contextual Norm (Intent Reframes Ontology)**
  *The identity and value of the work can be altered by the public framing of the object's genesis, allowing for preservation, re-authoring, or performance nuance.*
  *   **Verdicts forcing this clause:** 2 (Exposed Forgery), 3 (Plaster Cast), 5 (Dance), 9 (Appropriation).
  *   **Explanation:**
      *   **Preservation (3):** When the original trace is lost, the norm shifts from "Trace" to "Preservation." An honest cast is authorized because it admits its status, serving the goal of remembering the form.
      *   **Re-authoring (2 & 9):** Changing the label (2) or the context (9) changes the artistic act. The exposed forgery becomes a study of skill; the re-photographed image becomes a commentary on ownership. The *act* of presentation authorizes the object anew.
      *   **Embodiment (5):** In performance, the "pattern" (choreography) is necessary but not sufficient. The medium is the human body; thus, the specific realization (original cast) carries higher value due to proximity to the choreographer's intent, even if the "work" is technically the same.

  ***

  ### Application to Two Further Cases

  Here are two new cases to test the **Principle of Medium-Relative Authorization**.

  **Case 10: The AI-Generated Image**
  *An artist uses a text-to-image generator to create a unique visual. They print it on high-quality paper and sign it. A user downloads the digital file and prints an identical copy on the same paper.*
  *   **Verdict:** The artist's print is more valuable than the user's copy, despite visual identity.
  *   **Reasoning:** This falls under **Clause 1 (Trace Norm)** mixed with **Clause 3 (Contextual Norm)**. The art market and contemporary convention are currently treating AI art as autographic regarding the *prompting and selection process*. The artist's print is authorized by that specific curatorial act; the user's copy is not. The "history of the act" (the specific generation event) matters more than the pixels.

  **Case 11: The Heavily Restored Painting**
  *A damaged Renaissance fresco is 60% repainted by modern conservators to match the original style perfectly. It is displayed as "The Original, Restored."*
  *   **Verdict:** It is worth less than an untouched fragment, but more than a copy.
  *   **Reasoning:** This tests the boundary of **Clause 1**. The causal chain is partially broken (40% original hand, 60% conservator hand). However, because the framing is transparent ("Restored"), it avoids the deception of the Forgery (Case 1). It retains value as a partial trace, but loses the "wholeness" of the original authorization.

  ***

  ### Accommodation of Your Verdicts

  **Which of your verdicts cannot be accommodated?**
  **None.**

  The Principle of Medium-Relative Authorization accommodates all nine verdicts by rejecting the premise that "Art" is a single category with a single rule for authenticity. It posits that your intuition is correct in all nine cases because you are implicitly switching between different ontological contracts (Trace vs. Pattern vs. Context).

  *   **1, 6, 8** are accommodated by Clause 1 (Trace).
  *   **4, 7** are accommodated by Clause 2 (Pattern).
  *   **2, 3, 5, 9** are accommodated by Clause 3 (Context/Intent).

  The apparent contradiction between your two patterns (History vs. Pattern) is resolved by recognizing that **the medium dictates which principle applies.** The value is not in the object alone, nor the history alone, but in the **fit between the object's history and the medium's demand.**
