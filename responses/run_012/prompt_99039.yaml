  This summary is fundamentally misleading. It projects modern cultural relativism onto a Renaissance skeptic, turning Montaigne's critique of European arrogance into a proto-anthropological defense of non-interference.

  The summary slides incorrectly from Montaigne's observation that "barbarism" is merely a label for the unfamiliar to the conclusion that all practices are equally valid. Montaigne does not argue that morality is simply whatever a culture does. Instead, he argues there is a universal standard of "natural reason," and Europeans often violate it more egregiously than the cannibals. He compares the cannibals' ritual consumption of the dead to Europe's religious torture of the living during the Wars of Religion. He doesn't endorse cannibalism; he argues that eating a dead enemy is less barbarous than torturing a living one. This is a comparative moral judgment, not a suspension of judgment.

  Consequently, the claim that he refuses to condemn their practices because "no culture is better" is false. He condemns European cruelty specifically because it betrays natural law. He uses the cannibals as a mirror to shame Europeans, not to establish anthropological neutrality. He acknowledges the cannibals' violence but contextualizes it within a code of honor, unlike European treachery.

  Regarding the self-refutation charge: it misses the mark because it assumes Montaigne is proposing a universal principle of tolerance. He isn't. He is practicing Pyrrhonian skepticism. His point is epistemic, not ethical: we cannot trust our judgments when they are rooted solely in habit. When he praises the cannibals, he appeals to reason and nature, not mere custom. Therefore, he isn't sneaking in a universal standard of tolerance; he is relying on a universal standard of human nature to critique European arrogance.

  The summary turns a critique of European hypocrisy into a defense of moral equivalence. Montaigne isn't saying "don't judge"; he's saying "judge yourself first." The self-refutation charge fails because it attacks a relativist position Montaigne never held. He believes some things are truly barbarous; he just insists Europeans are often the true barbarians.
