  # Activity Design: The Underwriting Desk

  ## 1. Setup and Materials

  **The Fiction:** The class is a Risk Underwriting Firm. There are 16 "Policy Items" (numbered 1–16 on the whiteboard). The firm must assess each item individually and then issue a single "Master Policy" on the entire batch.

  **Materials:**
  *   **16 Envelopes:** Numbered 1–16. Inside 15 are cards reading **CLEAR**. Inside 1 is a card reading **DEFECT**. (Seal them beforehand).
  *   **16 Individual Log Sheets:** One per student. Each sheet has 16 rows (Item 1–16) with checkboxes for **CLEAR** or **DEFECT**.
  *   **16 Policy Recommendation Cards:** One per student. Each card has two options: **APPROVE BATCH** or **REJECT BATCH**.
  *   **1 Master Policy Certificate:** A larger card for the "Lead Underwriter."
  *   **Whiteboard & Markers:** To track scores.
  *   **Timer:** Visible to the class.

  **Room Arrangement:** Seminar table. Envelopes placed in the center.

  ## 2. Rules and Payoff Structure

  **Roles:**
  *   **1 Lead Underwriter:** Assigned by random draw (draw straws or cards) at the very start. This role is fixed for the session.
  *   **15 Associate Underwriters:** The rest of the class.

  **Currency:** "Compliance Points" (CP). No real money. Scores are written on the whiteboard.

  **Scoring Rules (Write these on the board before starting):**
  1.  **Individual Accuracy (Everyone):**
      *   +2 CP for every Item marked **CLEAR** that is actually **CLEAR**.
      *   -5 CP for every Item marked **CLEAR** that is actually **DEFECT**.
      *   0 CP for marking **DEFECT** (regardless of truth).
      *   *Note:* Since 15/16 items are CLEAR, the rational strategy is to mark **CLEAR** on all 16.
  2.  **Master Policy (Lead Only):**
      *   The Lead's **Policy Recommendation Card** becomes the **Master Policy**.
      *   If Master Policy is **APPROVE BATCH**:
          *   +20 CP if *all* 16 Items are CLEAR.
          *   -40 CP if *any* Item is DEFECT.
      *   If Master Policy is **REJECT BATCH**:
          *   0 CP.
      *   **Lead Fee:** The Lead pays a flat -5 CP fee for holding the role (to satisfy the "strictly worse payoff" constraint).
  3.  **Associates:** Do not score the Master Policy. They only score Individual Accuracy.

  ## 3. Sequence of Phases (75 Minutes)

  **Phase 1: Induction & Role Assignment (0:00–0:10)**
  *   **Instructor:** "Welcome to the firm. We have 16 sealed envelopes. I guarantee exactly one contains a DEFECT card. The rest are CLEAR. You do not know which is which."
  *   **Action:** Draw for the Lead Underwriter. Hand out Log Sheets and Policy Cards.
  *   **Constraint Check:** Do not use words like 'belief', 'conjunction', 'lottery', or 'paradox'. Use 'assessment', 'batch', 'risk'.
  *   **Instruction:** "Your goal is to maximize your CP. You must submit both an Individual Log and a Policy Recommendation."

  **Phase 2: Individual Assessment (0:10–0:25)**
  *   **Action:** Students fill out their **Individual Log Sheets**. They must check CLEAR or DEFECT for all 16 items without opening envelopes.
  *   **Pressure:** Remind them: "You are scored on accuracy. Marking DEFECT costs you potential points unless you are sure."
  *   **Expected Outcome:** Rational actors will mark **CLEAR** on all 16 items (Expected Value of CLEAR is positive; Expected Value of DEFECT is zero/negative).
  *   **Collection:** Collect all Log Sheets. Do not reveal scores yet.

  **Phase 3: Policy Recommendation (0:25–0:35)**
  *   **Action:** Students fill out their **Policy Recommendation Cards** (APPROVE BATCH or REJECT BATCH).
  *   **Instruction:** "This represents your judgment on the *whole set*. If you marked CLEAR on all individuals, what do you do here?"
  *   **Constraint:** Everyone must submit a card.
  *   **Collection:** Collect all cards.
  *   **Certification:** Hand the **Master Policy Certificate** to the Lead. Tell the Lead: "Your recommendation is binding. Copy your choice to the Master Certificate. Sign it."
  *   **Social Pressure:** The class will likely urge the Lead to "APPROVE" because everyone individually marked CLEAR. The Lead feels the weight of the -40 penalty but also the social expectation of consistency.

  **Phase 4: The Reveal & Scoring (0:35–0:45)**
  *   **Action:** Open the 16 envelopes one by one. Read the result aloud.
  *   **Scoring:**
      *   Calculate a typical **Associate Score**: (15 Clear × 2) + (1 Defect × -5) = **25 CP**. (Assuming they marked all CLEAR).
      *   Calculate the **Lead Score**:
          *   Individual: 25 CP.
          *   Lead Fee: -5 CP.
          *   Master Policy: Since there is exactly 1 Defect, "APPROVE" triggers the -40 penalty.
          *   Total Lead Score (if Approved): 25 - 5 - 40 = **-20 CP**.
          *   Total Lead Score (if Rejected): 25 - 5 + 0 = **20 CP**.
  *   **Visual:** Write the Associate Average (25) and the Lead Total (-20) side-by-side on the board.
  *   **Result:** The Lead is strictly worse off than the Associates, despite making the same individual judgments. If the Lead rejected the batch to save points, they are still worse off (20 vs 25) due to the Fee, and they have contradicted their own Individual Log (which said all CLEAR).

  **Phase 5: Debrief (0:45–1:15)**
  *   (See detailed mapping below).

  ## 4. Debrief: Mapping the Activity to Epistemology

  **Step 1: Translate the Fiction (5 mins)**
  *   Tell them: "You just enacted two famous epistemic problems."
  *   **Individual Log** = Belief in individual propositions ($p_1, p_2... p_{16}$).
  *   **Policy Recommendation** = Belief in the conjunction ($p_1 \& p_2... \& p_{16}$).
  *   **The Guarantee (1 Defect)** = The logical truth that $\neg(p_1 \& ... \& p_{16})$.
  *   **Lead Underwriter** = The Author (Preface) or the Agent (Lottery).

  **Step 2: Map to the Paradoxes (10 mins)**
  *   **The Lottery Paradox:** Focus on the **Individual Log**. It was rational to mark CLEAR on every single item (15/16 chance). But if you believe each is CLEAR, you believe the Batch is CLEAR. But you *knew* one was DEFECT.
      *   *Question:* "Who here marked CLEAR on all 16 individually, but wanted to mark REJECT on the Policy?" (Show of hands). This is the tension.
  *   **The Preface Paradox:** Focus on the **Lead Underwriter**. The Lead is the "Author." They assert every claim in the book (Individual Log) but must sign the preface admitting error (The Guarantee).
      *   *Question:* "The Lead lost points. Why? Because they certified a conjunction they knew was false, even though every conjunct was justified."

  **Step 3: Map to Escape Routes (10 mins)**
  Draw three columns on the board. Ask the class which strategy they *wanted* to use, and why they didn't.

  1.  **Deny Individual Justification (Skepticism):**
      *   *In Game:* Marking DEFECT on some logs just to be safe.
      *   *Why rejected:* You lose points (-5 or 0) when you could have gained (+2). It's irrational given the odds.
      *   *Philosophy:* Denying we can believe highly probable claims.
  2.  **Deny Agglomeration (Non-Adjunction):**
      *   *In Game:* Marking CLEAR on all logs, but REJECT on the Policy.
      *   *Why rejected:* It feels inconsistent. "How can every part be safe but the whole unsafe?" Also, the Lead Fee punishes the Lead regardless, but rejecting the policy feels like betraying your own data.
      *   *Philosophy:* Belief does not aggregate over conjunction.
  3.  **Accept Inconsistency (Dialetheism/Pragmatism):**
      *   *In Game:* Marking CLEAR on logs, APPROVE on Policy, and accepting the -20 score as the "cost of doing business."
      *   *Why chosen:* Most will do this. It maximizes individual points, even if the Policy penalty hurts.
      *   *Philosophy:* We are rationally inconsistent; consistency is a regulative ideal, not a constitutive norm.

  **Step 4: The Social Cost (5 mins)**
  *   Highlight the **Lead's Score**. The inconsistency wasn't abstract; it was paid for by one person.
  *   In the *Preface*, the Author pays this cost (loss of credibility).
  *   In the *Lottery*, the "Bookie" or the logic itself pays the cost.
  *   Ask: "Is it fair that the Lead suffered for a judgment everyone made?" (This touches on the social distribution of epistemic risk).

  ## 5. Failure Modes and Fixes

  **1. The "Gambler" Objection (Short-Circuiting)**
  *   *Risk:* A student marks DEFECT on one random item in Phase 2 to "hedge" against the penalty.
  *   *Why:* They see the -40 Policy penalty coming and try to game the Individual scoring.
  *   *Fix:* Emphasize in Phase 1 that the Individual Score is calculated *before* the Policy Score. If they mark DEFECT on a CLEAR item, they lose guaranteed points. Remind them: "You are scored on accuracy, not prophecy." If they do it anyway, use it in debrief: "This is the Skeptical Escape Route. You sacrificed individual truth to save the system."

  **2. The Lead Refusal (Stalling)**
  *   *Risk:* The Lead refuses to sign APPROVE because they see the trap.
  *   *Why:* They want to avoid the -40 penalty.
  *   *Fix:* The rules state they *must* submit a Master Policy. If they submit REJECT, calculate the score (20 CP). Then point out: "You are still worse off than the Associates (25 CP) due to the Fee, and you have contradicted your own Individual Log." This actually *helps* the debrief (illustrates the cost of denying agglomeration).

  **3. The "It's Just a Game" Dodge (Philosophical Avoidance)**
  *   *Risk:* Students dismiss the penalty as arbitrary points, not "real" belief.
  *   *Why:* It's hard to feel epistemic normativity in a simulation.
  *   *Fix:* In the debrief, ask: "When you marked CLEAR, did you feel you *should*? When you saw the Defect revealed, did you feel the Lead *shouldn't* have Approved?" Shift from "points" to "normative pressure." The points are just a proxy for the normative force of evidence.

  **4. Timing Overrun**
  *   *Risk:* Counting scores takes too long.
  *   *Fix:* Do not count every student's sheet. Count *one* Associate sheet aloud as an example. Write "Associate Average: 25" on the board immediately. Focus the math on the Lead.

  ## 6. Limitations: What You Must Supply

  This activity successfully simulates the **structural tension** and the **social distribution of cost**, but it cannot reproduce the **logical contradiction** itself.

  In the game, the contradiction is pragmatic (losing points), not logical. The students can consistently hold the beliefs "Item 1 is Clear... Item 16 is Clear" and "The Batch contains a Defect" without logical explosion, because the "Defect" guarantee was an external rule, not a logical derivation from the items themselves.

  **In the debrief, you must explicitly bridge this gap:**
  *   Tell them: "In the game, the 'One Defect' rule was imposed by me, the Instructor. In the Lottery Paradox, the 'One Winner' truth is a logical necessity of the setup. In the Preface, the 'One Error' claim is an inductive humility."
  *   You must explain that in epistemology, the "penalty" isn't points, it's **rationality**. The Lead didn't just lose CP; they became an irrational agent by believing $p_1...p_{16}$ and $\neg(p_1...p_{16})$.
  *   The activity makes them *feel* the pressure of that irrationality through the scoring disparity, but you must articulate that the scoring disparity *stands in for* the violation of logical norms. Without your verbal framing, this remains a game about risk management, not a seminar on justification.
