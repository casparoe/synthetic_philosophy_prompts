answer: |-
  # Setup

  Arrange the room into four tables of four students each. Each table receives a "Mission Packet" containing: one Budget Sheet, two Project Cards (labeled "Project Steady" and "Project Horizon"), a calculator, and a sealed manila envelope marked "Do Not Open Until Round 2." You need no technology; print the sheets on standard paper. The Budget Sheet lists a starting resource of 1,000 "Credits." The Project Cards describe the investment options. Your role is strictly "Game Master": you answer rule clarifications but offer no strategic advice. Ensure the envelopes are identical and sealed tight. The physical act of opening the envelope later must feel like discovering a fact about the world, not receiving a handout. Keep the tone clinical. You are not teaching ethics yet; you are running a resource allocation simulation. The goal is maximal point accumulation over two rounds. Do not mention grades, morality, or reality. Just points.

  # Round 1: the rules

  Distribute the packets. Tell students they have 15 minutes to allocate their 1,000 Credits between Project Steady and Project Horizon. They can split the budget any way they like. Read the Project Cards aloud.

  **Project Steady:** "Cost: 1 Credit. Payoff: 100 Points. Probability of Success: 100%."
  **Project Horizon:** "Cost: 1 Credit. Payoff: 50,000,000 Points. Probability of Success: 0.001% (1 in 100,000)."

  Explain the scoring: Total Score = (Credits in Steady × 100) + (Credits in Horizon × 50,000,000 × 0.00001). Emphasize that they are rational agents maximizing *Expected Value*, not guaranteed returns. If they put all 1,000 Credits into Steady, they guarantee 100,000 Points. If they put all 1,000 Credits into Horizon, their *Expected* value is 500,000 Points, though most likely they will get zero. Tell them to treat Expected Value as the only metric that matters. There are no penalties for going bust. Have them record their allocation on the Budget Sheet. Collect the sheets. Do not reveal the winners yet.

  # Why Round 1 goes fanatic

  The mechanics force a specific mathematical conclusion. Project Steady offers an Expected Value (EV) of 100 points per Credit. Project Horizon offers an EV of 500 points per Credit (50,000,000 × 0.00001). Because the payoff for Horizon is so astronomically large, it dominates the calculus despite the tiny probability. A rational agent maximizing EV must ignore the certainty of Steady to fund the sliver of chance in Horizon. This mirrors the philosophical structure of fanaticism: when the magnitude of the potential good is sufficiently vast, even a minuscule probability of achieving it outweighs the certain value of immediate, modest goods. The students will likely feel resistance—wanting the guaranteed points—but the rules explicitly penalize that intuition as "irrational." They must surrender to the math.

  # The reveal

  Hand out the sealed envelopes. Instruct them to open them simultaneously. Inside is a single card printed with bold text: "INTELLIGENCE UPDATE: There is an 80% probability this environment is a Sub-Reality. Outcomes may be contingent on Base-Reality validation." Below this statement are two technical addendums labeled "Model Alpha" and "Model Beta." Do not explain them. Let the students read the text themselves. The wording should feel like a patch note or a systems update, not a philosophical prompt. It changes the ontological status of the game board. They are no longer playing on solid ground; they are playing on a layer that might not count. This physicalizes the uncertainty. They must now decide how this new fact alters their previous calculations before proceeding to Round 2.

  # Round 2

  Students have 20 minutes to re-allocate their 1,000 Credits using the new data. The Envelope Card states: "If Sub-Reality is true (80% chance), apply ONE of the following modifiers to Project Horizon only."

  **Model Alpha:** "Sub-Reality payoffs are local only. Divide Horizon Payoff by 10,000."
  **Model Beta:** "Sub-Reality actions leverage Base-Reality. Multiply Horizon Probability by 10,000."

  Students must agree as a table on which Model to apply. This forces them to interpret the nature of the simulation. If they choose Alpha, Horizon's EV crashes (500 becomes 0.05), making Steady the rational choice. If they choose Beta, Horizon's probability becomes 10% (0.001% × 10,000), making Horizon overwhelmingly dominant (EV becomes 5,000,000). Some groups will pick Alpha (damping the fanaticism); others will pick Beta (sharpening it). Have them record their new allocation and the Model chosen. Collect sheets. Now reveal the actual scores based on their chosen models.

  # Debrief

  Now you can use the forbidden words. Round 1 was a model of **longtermism** without safeguards. Project Horizon represents preventing existential risk or securing the far future. Project Steady represents alleviating present suffering. The math forced them into **fanaticism**: ignoring certain good today for a tiny chance at astronomical good tomorrow. They felt the pull because the EV was undeniable.

  Round 2 introduced the **simulation hypothesis**. The divergence in groups highlights that "simulation" is not a single argument. Groups that chose Model Alpha treated the simulation as a **reality check**: if we are in a sim, the "far future" might be fake or capped, damping the stakes. This aligns with skepticism about longtermist leverage. Groups that chose Model Beta treated the simulation as **leverage**: if we are in a sim, our actions might influence the simulators (Base-Reality), vastly increasing the probability of impact. This sharpens fanaticism.

  Ask the Alpha groups why they doubted the payoff. They will say "It's not real." Ask the Beta groups why they boosted the probability. They will say "We can hack the controllers." Show them that both are valid interpretations of the same credence. The simulation hypothesis doesn't automatically solve fanaticism; it shifts the burden to defining the relationship between the simulation and the base. If the sim is a cage, stakes drop. If the sim is a control panel, stakes rise. The game proves that adding uncertainty doesn't always reduce extreme bets; sometimes it just moves the uncertainty to a different variable.

  # What'll go wrong the first time

  The biggest failure mode is **risk aversion**. Students will argue that 100,000 guaranteed points is better than a 99.9% chance of zero, despite the EV rules. They will treat points like money rather than utility. Counter this by reiterating: "You are agents maximizing Expected Value, not survival. Imagine playing this game one million times." If they still resist, remind them this is a seminar on ideal theory, not behavioral psychology.

  Another failure is **group deadlock** in Round 2. Half the table wants Alpha, half wants Beta. Instruct them to vote, but require the minority to articulate why their model is less plausible. This friction is actually useful data for the debrief. Finally, watch for **math errors**. The numbers are large. If a group miscalculates the EV in Round 1, they won't feel the fanaticism pull. Walk around and verify their Round 1 calculations before letting them open the envelopes.

  # What the game can't show them

  The mechanics reduce value to abstract points. They cannot reproduce the **moral weight** of actual lives. In the real world, ignoring certain suffering today for a hypothetical future feels viscerally wrong in a way that ignoring "Project Steady" does not. The game captures the logical structure of fanaticism, but not the emotional cost. You must supply that. Ask them: "If Project Steady was saving 100 people from pain, and Project Horizon was saving 50 billion unborn people with a 1 in 100,000 chance, would you still go all-in on Horizon?" The game gives them the math; you must give them the morality.
