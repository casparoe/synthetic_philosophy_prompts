answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION: THE EPISTEMOLOGY OF TESTIMONY**

  **Preamble: On Framing and Dice-Loading**
  We, the undersigned Reductionist (R) and Anti-Reductionist (AR), acknowledge that the definitions stipulated for this collaboration risk loading the dice. Defining R as requiring non-testimonial grounds for *a hearer's belief* leans toward "Local Reductionism," potentially ignoring the "Global Reductionist" move where a general inductive track record of human reliability suffices for specific instances. Defining AR as granting entitlement with *no requirement of supporting evidence* risks portraying the position as credulous rather than principled. We proceed with these definitions not because they are the only viable versions of our views, but because they sharpen the conflict to its normative core: the burden of proof in testimonial exchange.

  ### 1. Agreed Claims
  Both parties sign the following:

  1.  **The Goal:** The dispute is normative, not psychological. We are not debating whether humans *do* trust testimony (they do), but whether they are *rationally permitted* to do so without specific verification.
  2.  **The Stakes:** Both sides agree that testimony is the primary mechanism by which knowledge spreads in science and daily life. Neither side wishes to induce skepticism that paralyzes inquiry.
  3.  **The Fallibility:** Both sides concede that testimony is frequently false. Trust is not a guarantee of truth.
  4.  **The Defeater Concession:** R concedes that a hearer does not need to actively verify every claim if there are no specific triggers for doubt (red flags). AR concedes that if a hearer possesses specific reasons for doubt (defeaters), accepting testimony is irrational.
  5.  **The Developmental Concession:** AR concedes that adult scientific testimony differs in structure from childhood language acquisition, though both rely on testimony. R concedes that if their view requires a conscious inductive argument for every belief, it demands too much of cognitive architecture.
  6.  **The Truth Connection:** Both sides agree that for a belief to constitute knowledge, it must ultimately be connected to the truth. The dispute is about *how* that connection is secured for the hearer.

  ### 2. Disagreements Table

  | Sub-Question | Reductionist Formulation | Anti-Reductionist Formulation |
  | :--- | :--- | :--- |
  | **The Default Status** | Testimony is inert data. It generates justification only when filtered through the hearer's independent reasons to trust the source or the type of claim. | Testimony is a transmission belt. It generates justification by default, provided the hearer is not aware of reasons to reject it. |
  | **The Burden of Proof** | The burden lies on the hearer to establish positive reasons for thinking the speaker is reliable in this instance or generally. | The burden lies on the hearer only to monitor for negative reasons (defeaters) that would indicate the speaker is unreliable in this instance. |
  | **The Source of Normativity** | The right to believe comes from the hearer's own cognitive labor (inference, observation, induction). | The right to believe comes from the social norm of assertion; the speaker assumes responsibility for the truth, licensing the hearer's acceptance. |
  | **The Scope of Checking** | Justification requires a non-testimonial anchor. Even if global, the hearer must possess an inductive basis for thinking testimony *as a kind* is reliable. | Justification requires no anchor outside the practice of testimony itself. The practice is self-authenticating for the participant unless breached. |

  ### 3. The Cruxes
  You have identified the cruxes correctly. Settling either of the following would force a significant revision of one or both positions.

  **Crux A: The Default (Positive Reason vs. Absence of Defeater)**
  Is the rational stance toward testimony suspicion until proven safe (R), or trust until proven unsafe (AR)? This determines whether the absence of a reason to doubt is itself a sufficient reason to believe.

  **Crux B: The Order of Justification vs. The Order of Learning**
  Does the requirement for non-testimonial grounds apply to the *logical structure* of justification (R), or is it merely a *developmental phase* we outgrow (AR)? If a child cannot have inductive grounds, does she lack knowledge, or does this prove that testimony is a basic source like perception?

  *Commentary on your identification:* You are correct. Crux A addresses the adult scientist scenario (your scenarios i & ii). Crux B addresses the developmental scenario (your scenario iii). If R admits that no non-testimonial grounds are needed once a "general reliability" threshold is met, R moves toward Global Reductionism. If AR admits that *some* positive background assumption is needed, AR moves toward a hybrid view. The hard line is exactly where you placed it.

  ### 4. Evidence, Arguments, and Predictions
  We agree that the following stipulated cases bear directly on the cruxes. We state our predictions in advance.

  **Distinction Test:** *Positive Credentials vs. Lacking Disqualifying Grounds.*
  We agree this distinction is **not a red herring**; it is the primary separator of the camps. The Local/Global distinction is secondary, often used by R to mitigate the harshness of the Positive Credentials requirement.

  **Case (i): The Unrepeatable Measurement**
  *A colleague reports a measurement you cannot repeat, taken with an instrument you have never used; you have no independent check and no particular reason for doubt.*
  *   **Relevance:** Tests Crux A (The Default).
  *   **Reductionist Prediction:** You are not justified in believing the measurement *unless* you have independent reason to trust the colleague's competence or the instrument's class. Mere absence of doubt is insufficient.
  *   **Anti-Reductionist Prediction:** You are justified. The colleague's assertion carries presumptive weight. The absence of disqualifying grounds (no reason to think they are lying or incompetent) constitutes sufficient entitlement.
  *   **Agreed Bearing:** If intuition strongly favors belief here, R must retreat to Global Reductionism (trusting "scientists generally"). If intuition favors suspension of judgment, AR is weakened.

  **Case (ii): The Chain of Custody**
  *A technician relays a reading from an unattended sensor, and the chain from sensor to bulletin passes through several hands, none of them known to you.*
  *   **Relevance:** Tests the "Positive Credentials" distinction and the cost of R's demand.
  *   **Reductionist Prediction:** Justification degrades with each unknown link. Without positive reason to trust the chain, the report is hearsay. You require a reason to think the chain is intact.
  *   **Anti-Reductionist Prediction:** Justification holds so long as no link is known to be broken. The institutional context provides the entitlement; you do not need to audit the chain to accept the bulletin.
  *   **Agreed Bearing:** This tests the practicality of R. If R demands positive credentials for every link, scientific collaboration becomes impossible. R will likely argue that institutional affiliation provides the non-testimonial ground. AR will argue the institution is irrelevant to the *epistemic* right, which is automatic.

  **Case (iii): The Child's Acquisition**
  *A child acquires her first beliefs about what words mean and what is dangerous, before she has any track record of anyone's reliability.*
  *   **Relevance:** Tests Crux B (Order of Justification vs. Learning).
  *   **Reductionist Prediction:** The child does not have *justified* belief in the strict sense, only true belief. Justification arrives later when the child can inductively generalize about caregiver reliability.
  *   **Anti-Reductionist Prediction:** The child has justified belief. This proves testimony is a basic source. If justification required prior induction, language acquisition would be impossible (the "Starting Problem").
  *   **Agreed Bearing:** This is the strongest evidence for AR. If R concedes the child lacks justification, R must accept that humans spend years without knowledge of the world. R will likely argue the child has *proto*-justification or that evolution provides the non-testimonial ground.

  **Case (iv): The Unreliable Community**
  *A community whose members are, in a given domain, uniformly and unknowingly unreliable.*
  *   **Relevance:** Tests the Truth Connection and the definition of Justification vs. Entitlement.
  *   **Reductionist Prediction:** The hearer is not justified. Because the source is objectively unreliable, there is no non-testimonial ground (truth-conduciveness) to support the belief, even if the hearer doesn't know it.
  *   **Anti-Reductionist Prediction:** The hearer is justified (entitled). Justification is internal. Since the hearer lacks defeaters, they are rational to believe, even if the belief is false due to environmental bad luck.
  *   **Agreed Bearing:** This reveals whether "justification" tracks *truth* (R) or *rationality* (AR).

  ### 5. Closing: Is the Dispute Merely Verbal?
  We conclude that the disagreement is **not merely verbal**, but there is a terminological overlap that obscures the substantive normativity.

  **Justification (R) vs. Entitlement (AR)**
  When the Reductionist says "justification," they refer to a status that makes a belief *likely to be true*. It is an externalist-leaning concept: if the source is broken (Case iv), the justification fails.
  When the Anti-Reductionist says "entitlement" (or justification), they refer to a status that makes the believer *blameless*. It is an internalist-leaning concept: if the defeaters are absent, the believer is rational, even if the source is broken.

  **The Verbal Component:**
  If R defines "non-testimonial grounds" loosely enough to include "the absence of defeaters" or "evolutionary hardwiring," the positions converge. If AR defines "basic source" as requiring "a background assumption of general reliability," the positions converge.

  **The Substantive Component:**
  However, a hard core remains. R insists that the *truth-conduciveness* of the belief must be secured by the hearer's cognitive resources (induction, perception, memory). AR insists that the *social act of telling* itself secures the rational permission, independent of the hearer's resources.

  **Final Verdict on Distinctions:**
  The distinction between **having positive credentials** and **merely lacking disqualifying grounds** is the actual separator of the camps. The Local/Global distinction is a tactical maneuver. A Global Reductionist still demands positive credentials (a general inductive track record); they simply lower the frequency of checking. The Anti-Reductionist demands no positive credentials at all, relying solely on the absence of disqualifiers.

  We sign this statement to acknowledge that while we share the goal of explaining scientific trust, we locate the source of that trust differently: one in the **history of the hearer's reasons**, the other in the **presumption of the speaker's word**.
