      *   *Reading 2 (Mature Keynes):* The "Exercise Model." In *Economic Possibilities* and *General Theory*, Keynes suggests that once economic necessity is solved, the problem becomes how to live. He implies that the *activity* of living freely, solving problems, and striving is itself valuable. However, he worries people won't know how to do this because they are too used to striving for necessity.
      *   *The Tension:* If the good life is just enjoying states (Reading 1), solving the economic problem should maximize leisure for enjoyment. But Keynes worries people won't know how to use freedom (Reading 2). This implies freedom/striving is part of the good. But if striving is part of the good, and the economic problem removes the *need* to strive, does it remove the *opportunity* for meaningful striving? If the Moorean view says we shouldn't strive for the good states directly, but the Mature view says we need to strive to be happy, there's a conflict. The prompt suggests the specific conflict is: Abundance removes the conditions of striving, but the Moorean goods require a condition where we aren't striving for them, yet the Mature view implies we need *some* striving to be well. Actually, the prompt's specific formulation is: "the later Keynes quietly treats a certain kind of activity, namely purposive striving and the exercise of freedom, as itself a constituent of the good life... but the same texts also insist that the goods worth having are states of mind that we can only enjoy when they are not themselves the object of effort."
      *   *Refined Tension:* The Moorean view says ends are states of mind, means are actions. The Mature view hints that the means (striving/freedom) are actually ends. But if the economic problem is solved, the primary arena for striving (economic necessity) vanishes. If people are shaped by striving, they can't enjoy the Moorean states without it. So abundance kills the capacity for the Moorean good by removing the striving required to sustain the psychological capacity for enjoyment.

