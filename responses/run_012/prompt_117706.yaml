      *   **The Objection:**
          *   Maybe Keynes isn't making a philosophical claim about value, but a psychological prediction. He's saying people *will* be bored, not that they *should* be striving. He's diagnosing a transition problem, not a logical contradiction in the good life.
      *   **The Reply:**
