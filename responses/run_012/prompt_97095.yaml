          *   The fact that some suffer and some don't proves the marker isn't the sole cause. It's likely a modifier or a red herring for the asymptomatic group.
      *   **Part 3: The Ethics/Politics:**
          *   The Health Board's stance is efficient but potentially harmful (medicalization of life).
          *   The Patients' Group is right about the social construction of disease (e.g., drapetomania vs. chronic fatigue).
      *   **Part 4: Practical Advice for the GP:**
          *   **Scripting:** How to talk to the asymptomatic patient. "This is a number, not a diagnosis."
          *   **Anxiety:** If the patient is anxious, the treatment is reassurance/explanation, not medication for the marker.
