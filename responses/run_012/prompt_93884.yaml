      *   *Philosophical Counterpoint:* Is *all* belief-driven penetration circular?
          *   *Case:* Perceptual Learning. Learning to identify birds changes how they look. Does this invalidate evidence? No, it enhances discrimination.
          *   *Case:* Background beliefs vs. Target beliefs. If my belief in *optics* changes how I see a mirage, that doesn't mean my belief in *the mirage* caused the experience.
