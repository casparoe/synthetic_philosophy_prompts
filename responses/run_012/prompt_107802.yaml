answer: |-
  **In re Guardianship of Pendergast**, 14 State Bioeth. Rep. 209 (2024)

  **Procedural History and Facts**
  Petitioner Arthur Pendergast (70) appeals an order enforcing his own Advance Life Directive executed at age 45. The Directive is exhaustively specific: it mandates a vegetarian diet, permanent residence in Topeka, Kansas, annual reading of *Great Expectations*, and prohibits marriage to any partner present during periods of incapacity. Mr. Pendergast currently suffers early-onset dementia but retains lucid intervals. During such intervals, he articulately expresses desires opposite to the Directive: he wishes to eat steak, cohabit with Ms. Higgins, and remain in his current home. The lower court held the Directive binding, prioritizing the competent past self over the impaired present self. The Guardian argues that without enforcement, the 45-year-old's planning is nullified. Mr. Pendergast argues his current autonomy supersedes prior instruction. The record shows no evidence of coercion at execution, only a change of heart coinciding with cognitive decline.

  **Majority Opinion**
  The core principle of bioethical law is respect for autonomy. A competent adult possesses the right to dictate future medical and personal conditions. At execution, Mr. Pendergast was fully competent. The law presumes stability of identity over time; the 45-year-old signatory is the legal owner of the 70-year-old body. To rule otherwise would invalidate all advance care planning, rendering the competent self powerless against the decay of its future vessel. The Directive is not a mere suggestion; it is the exercise of a right that persists despite cognitive decline. We reject the notion that autonomy expires when capacity diminishes; rather, it crystallizes in the document.

  Appellant argues this constitutes a contract of self-enslavement, binding a future self to conditions it rejects. We disagree. Enforceable directives concern health and welfare, not servitude. While the Directive governs lifestyle, these choices are proximate to health outcomes and moral integrity. The law does not permit one to sell oneself into bondage, but it does permit one to bind oneself to a regimen. Furthermore, the competent self accepts the risk of future ignorance regarding circumstances. That Mr. Pendergast could not foresee his specific desires at 70 is irrelevant; he foresaw the possibility of changed desires and instructed against them. To allow current whims to override prior planning is to privilege confusion over clarity.

  Crucially, the current Mr. Pendergast lacks full capacity. While he expresses preferences, he cannot weigh long-term consequences. Thus, enforcing the Directive is not merely honoring past autonomy, but protecting the current ward from impulsive deviation. The Directive functions as a shield for the incompetent against their own confusion. Whether viewed as the past self's right to rule or the current self's need for protection, the result is identical. The distinction between medical treatment and lifestyle choice is negligible when the subject lacks capacity to distinguish them. The prior written instrument controls.

  **Dissent**
  The Majority opinion rests on an unacknowledged contradiction. It begins by asserting the 45-year-old's autonomy binds the 70-year-old because they are the same person. It concludes by arguing the 70-year-old must be protected from himself because his impairment makes him unreliable. If they are the same person, the current expressed wishes carry equal weight to the past instructions, creating a tie that should favor the living voice. If they are different persons due to cognitive rupture, the 45-year-old is a stranger with no authority to mandate the 70-year-old's life.

  The Majority blends these theories to avoid the difficulty of either. They treat the parties as identical when assigning authority, and distinct when assigning liability for changed circumstances. This is not law; it is metaphysical sleight of hand. They claim to honor autonomy while practicing paternalism, justifying the dead hand by the weakness of the living hand. They dismiss the enslavement argument by labeling it "healthcare," though it governs marriage and residence.

  However, the alternative is no clearer. If we accept the man is effectively two distinct entities, we cannot simply void the Directive and leave the ward adrift. A legal person must exist. If the prior self is a stranger, and the current self is incapacitated, the state must intervene to determine which iteration represents the citizen worthy of recognition. We should not pretend the Directive binds; we should admit the state selects the viable identity. I would remand for a hearing on which version of Mr. Pendergast serves public order, rather than masking state selection as private choice. The state must choose which self to honor, not pretend the choice was made decades ago.

  **Order**
  The judgment of the lower court is affirmed. The Advance Life Directive remains in full force and effect. The Guardian is instructed to enforce dietary, residential, and marital restrictions as written. Petitioner's request for vacatur is denied. Costs assessed against Petitioner.
