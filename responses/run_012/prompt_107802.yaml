      *Case Name:* *In re Guardianship of Pendergast*, 14 State Bioeth. Rep. 209 (2024).

      *Facts:*
      Petitioner Arthur Pendergast (70) seeks to vacate a guardianship order enforcing his own Advance Life Directive executed at age 45. The Directive mandates a vegetarian diet, residence in Topeka, annual reading of *Great Expectations*, and prohibits marriage to any partner present during incapacity. Pendergast currently suffers early-onset dementia but retains lucid intervals. During such intervals, he expresses desire for steak, cohabitation with Ms. Higgins, and residence in his current home. The lower court held the Directive binding, prioritizing the competent past self over the impaired present self. Pendergast appeals, arguing current autonomy supersedes prior instruction.

      *Majority:*
      The core principle of bioethical law is respect for autonomy. A competent adult possesses the right to dictate future medical and personal conditions. At execution, Mr. Pendergast was fully competent. The law presumes stability of identity over time; the 45-year-old signatory is the legal owner of the 70-year-old body. To rule otherwise would invalidate all advance care planning, rendering the competent self powerless against the decay of its future vessel.

      Appellant argues this constitutes a contract of self-enslavement. We disagree. Enforceable directives concern health and welfare, not servitude. While the Directive governs lifestyle, these choices are proximate to health outcomes. Furthermore, the competent self accepts the risk of future ignorance regarding circumstances. That Mr. Pendergast could not foresee his specific desires at 70 is irrelevant; he foresaw the possibility of changed desires and instructed against them.

      Crucially, the current Mr. Pendergast lacks full capacity. While he expresses preferences, he cannot weigh long-term consequences. Thus, enforcing the Directive is not merely honoring past autonomy, but protecting the current ward from impulsive deviation. The Directive functions as a shield for the incompetent against their own confusion. Whether viewed as the past self's right to rule or the current self's need for protection, the result is identical. The prior written instrument controls.

      *Dissent:*
      The Majority opinion rests on an unacknowledged contradiction. It begins by asserting the 45-year-old's autonomy binds the 70-year-old because they are the same person. It concludes by arguing the 70-year-old must be protected from himself because his impairment makes him unreliable. If they are the same person, the current expressed wishes carry equal weight to the past instructions, creating a tie that should favor the living voice. If they are different persons due to cognitive rupture, the 45-year-old is a stranger with no authority to mandate the 70-year-old's life.

