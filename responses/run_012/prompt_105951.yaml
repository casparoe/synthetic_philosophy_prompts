      *   **The New Case (Discontinuous Identity):** If the system has no memory/continuity, it lacks *diachronic unity*. Under a narrative or psychological continuity view of self/mind, this is a deficit. Under a pure "session-based" TT, it passes. This highlights the need for *temporal depth* in the criterion.

