  8.  *(Self-Correction during drafting)*: I need to be careful not to just say "You're a functionalist." I need to show *why* their specific set of intuitions forces them away from behaviorism. The "Honest Confessor" is the key. If behavior is all that matters, the Confessor fails. If the Confessor is *better*, then internal truth-tracking matters.

  9.  *(Final check against constraints)*: Did I answer if a single criterion exists? (No). Did I say which verdicts to drop? (The behavioral constitutive claim). Did I address the new case? (Yes). Did I avoid a "tidy criterion"? (Yes, by embracing the tension).

