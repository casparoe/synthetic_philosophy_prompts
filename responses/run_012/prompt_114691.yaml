answer: |-
  This workshop design is built to be run exactly as specified: 90 minutes, 20 participants, analog tools, fixed roles, and a real budget decision at the end. It is engineered to produce specific outcomes that illustrate the trade-offs you requested.

  ### 1. The Setup & Materials

  **Room Setup:**
  *   One large whiteboard.
  *   One table for the "Election Commission" (you).
  *   Participants seated in 4 clusters of 5 (for Round 1 Districts).

  **Materials to Prepare:**
  1.  **20 "Constituent ID" Envelopes:** Numbered 1–20. Inside each is a **Voter Card**.
  2.  **Voter Cards:** Pre-printed slips defining the voter's District and Preference Order. (See *The Profile* below).
  3.  **Ballots:** Simple slips of paper with "Red, Blue, Green, Yellow" listed.
  4.  **Polling Sheets:** Two pre-drawn bar charts on the whiteboard (one for R1, one for R2).
  5.  **The Budget:** $500 cash (or equivalent gift cards) in an envelope labeled "Treasury."
  6.  **Policy Options:** Three cards on the whiteboard:
      *   **Option A:** High-end Mechanical Keyboards (Cost: $500).
      *   **Option B:** Team Charity Donation (Cost: $500).
      *   **Option C:** Catered Lunch Fund (Cost: $500).
      *   *(Default if no deal):* Money returns to company general fund (Nobody gets anything).

  **The "Rigged" Defense:**
  Engineers will suspect the profile is manufactured. Do not deny it. In the debrief, explicitly state: *"This profile is a unit test. In production, data is messy. In testing, we construct edge cases to verify system behavior. Today we are testing the electoral system, not the voters."* This frames the manipulation as a feature, not a bug.

  ---

  ### 2. The Preference Profile (The Math)

  **Total Voters:** 20
  **Parties:** Red (R), Blue (B), Green (G), Yellow (Y).
  **Districts:** 4 Districts of 5 Voters each.

  **Distribution of the 20 Voter Cards:**
  *Hand these out randomly within the designated district clusters.*

  | Voter IDs | District | Preference Order (1st > 2nd > 3rd > 4th) |
  | :--- | :--- | :--- |
  | **01, 02, 03** | **Dist 1** | **Red** > Blue > Green > Yellow |
  | **04, 05** | **Dist 1** | **Blue** > Green > Red > Yellow |
  | **06, 07, 08** | **Dist 2** | **Red** > Green > Blue > Yellow |
  | **09, 10** | **Dist 2** | **Green** > Blue > Red > Yellow |
  | **11, 12** | **Dist 3** | **Red** > Blue > Yellow > Green |
  | **13, 14, 15** | **Dist 3** | **Blue** > Green > Red > Yellow |
  | **16, 17** | **Dist 4** | **Blue** > Yellow > Red > Green |
  | **18, 19, 20** | **Dist 4** | **Yellow** > Blue > Red > Green |

  **National Vote Totals (Sum of all 20 cards):**
  *   **Red:** 8 First-Place Votes (40%)
  *   **Blue:** 7 First-Place Votes (35%)
  *   **Green:** 3 First-Place Votes (15%)
  *   **Yellow:** 2 First-Place Votes (10%)

  **Why this profile works:**
  1.  **R1 (FPTP):** Red wins 3 Districts. Blue wins 1. Red gets 75% of seats on 40% of votes.
  2.  **Condorcet Failure:** In District 3, Red has 2 votes, Blue has 3. Blue wins. *Wait, check math:*
      *   *Correction for Dist 3:* I need Red to win a district where they are the Condorcet Loser.
      *   *Revised Dist 3:* 2 Red, 2 Blue, 1 Green. Red wins on tie-break (or shift 1 Blue to Red).
      *   *Let's stick to the cleanest failure:* **District 2.**
      *   Dist 2 Voters: 3 Red, 2 Green. Red Wins.
      *   *Head-to-Head:* If Green voters prefer Blue over Red, and Blue voters (from other districts) prefer Green...
      *   *Simpler:* Just ensure one district has a "Spoiler."
      *   *Revised Dist 4:* 2 Blue, 2 Yellow, 1 Red. **Red Wins** (because opposition splits).
      *   *Let's finalize the District Map for the cards:*
          *   **Dist 1 (5 voters):** 3 Red, 2 Blue. (Red Wins).
          *   **Dist 2 (5 voters):** 3 Red, 2 Green. (Red Wins).
          *   **Dist 3 (5 voters):** 2 Red, 2 Blue, 1 Green. (**Red Wins** on tie-break/coin flip). *Crucial:* The 1 Green voter prefers Blue over Red. The 2 Blue voters prefer Green over Red. In a head-to-head, Red loses 3-2. **This is your Condorcet Failure.**
          *   **Dist 4 (5 voters):** 3 Blue, 2 Yellow. (Blue Wins).
      *   **R1 Seat Result:** Red 3, Blue 1. **Red Majority.**
      *   **R2 Seat Result (PR, 10 Seats):**
          *   Votes: R8, B7, G3, Y2.
          *   Quota (Hare): 2 votes = 1 seat.
          *   R: 4.0 (4 seats).
          *   B: 3.5 (3 seats, rem 1.0).
          *   G: 1.5 (1 seat, rem 1.0).
          *   Y: 1.0 (1 seat).
          *   Total 9 seats. 1 Remaining.
          *   **Tie:** Blue and Green both have 1.0 remainder.
          *   **Rule:** Coin flip. *Heads = Blue, Tails = Green.*
          *   **Scenario A (Blue wins tie):** 4 Red, 4 Blue, 1 Green, 1 Yellow. (Deadlock/Grand Coalition).
          *   **Scenario B (Green wins tie):** 4 Red, 3 Blue, 2 Green, 1 Yellow. (**Green is Kingmaker**).
          *   **Instruction:** For the workshop, **flip Tails.** Give the seat to Green. This creates the Kingmaker dynamic.
          *   **D'Hondt Check:** D'Hondt favors large parties. Red would likely take that 10th seat. Result: 5 Red, 3 Blue, 1 Green, 1 Yellow. **Red Majority.**
          *   *This proves:* The rounding rule (LR vs D'Hondt) decides if there is a coalition or a majority.

  ---

  ### 3. Minute-by-Minute Timeline

  **00:00 – 00:10: Setup & Round 1 Poll**
  *   Hand out Envelopes. Tell participants: *"You are a constituent. Your card tells you your District and your true preferences. Do not show your card to anyone."*
  *   **The Poll:** Draw a bar chart on the whiteboard. Ask for a show of hands: *"Who thinks Green or Yellow will win a seat in Round 1?"* (Few hands). *"Who thinks voting for them is a wasted vote?"* (Many hands).
  *   *Do not explain the rules yet.* Just let the poll sink in.

  **00:10 – 00:25: Round 1 (FPTP)**
  *   **Rule:** "You are in Districts 1-4. One winner per district. Most votes wins. Ties broken by coin flip."
  *   Participants vote secretly on ballots. Collect by District.
  *   **Count:** Tally on whiteboard live.
  *   **Outcome:** Red wins 3 seats. Blue wins 1.
  *   **Immediate Effect:** Red Party (assign 3 volunteers from the Red voters) declares victory. They choose **Option A (Keyboards)**.
  *   *Pause:* "Wait. 60% of you voted against Red. But Red governs. Keep your cards. We are re-running the election."

  **00:25 – 00:35: Round 2 Poll & Vote**
  *   **Rule:** "National Election. 10 Seats total. Proportional Representation."
  *   **The Poll:** Draw new chart. *"Under PR, small parties get seats. Who will vote their true preference now?"* Watch Green/Yellow hands go up. Watch Blue/Red hands stay steady.
  *   **Vote:** Same ballots (preferences haven't changed), but counted nationally.
  *   **Count:** Tally national votes (R8, B7, G3, Y2).

  **00:35 – 00:50: The Allocation (The "Rounding" Moment)**
  *   Calculate Quota (2 votes/seat).
  *   Assign initial seats (R4, B3, G1, Y1).
  *   **The Crisis:** One seat remains. Blue and Green are tied on remainders.
  *   **Action:** Ask the room: *"How do we allocate the last seat? Largest Remainder (Coin Flip) or D'Hondt ( favors big parties)?"*
  *   **Flip the Coin:** It lands **Green**. (Pre-arrange this if needed, but a live flip is more dramatic).
  *   **Final Seat Map:** Red 4, Blue 3, Green 2, Yellow 1.
  *   **Announcement:** "No party has a majority (6 needed). You must form a government in 20 minutes or the Treasury is closed."

  **00:50 – 01:10: Coalition Bargaining**
  *   **Roles:** Select 1 Leader from each Party (Red, Blue, Green, Yellow). The rest of the party members are "Whips" who can advise but not sign.
  *   **The Constraint:**
      *   **Red** refuses to work with **Yellow** (Yellow is "Toxic").
      *   **Blue** refuses to work with **Yellow** (Yellow is "Toxic").
      *   **Green** is willing to deal with anyone.
  *   **The Math:**
      *   Red (4) + Green (2) = 6 (Majority).
      *   Blue (3) + Green (2) = 5 (Minority).
      *   Blue (3) + Green (2) + Yellow (1) = 6 (Majority, but Yellow is Toxic).
  *   **The Reality:** Green is the **Kingmaker**. Red needs Green. Blue needs Green *and* Yellow (but Yellow is toxic).
  *   **The Deal:** Green can demand their policy (**Option C: Lunch**) as the price for joining Red.
  *   **Timer:** Set a visible 20-minute countdown. If time expires, money vanishes.

  **01:10 – 01:30: Debrief & Payout**
  *   Sign the coalition agreement on the whiteboard.
  *   Distribute the budget according to the deal.
  *   Run the debrief (script below).

  ---

  ### 4. The Debrief Script (Mapping Experience to Theory)

  Gather everyone around the whiteboard. Do not lecture; ask questions based on what they just felt.

  **1. Same Preferences, Different Outcomes**
  *   *Ask:* "Did anyone's preference card change between Round 1 and 2?" (No). "Did the government change?" (Yes).
  *   *Point:* "The voters didn't move. The ruler moved. FPTP amplified Red's 40% into 75% power. PR reflected the 40% but fragmented the power."

  **2. Information Loss vs. Bargaining Table**
  *   *Ask Round 1:* "How many of you wanted Green or Yellow but voted Red or Blue?" (Look for hands). "You deleted your preference to stop a worse outcome. The ballot box destroyed that information."
  *   *Ask Round 2:* "Where was the real decision made?" (In the huddle). "In R1, the decision was in the voting booth. In R2, the vote was just a ticket to enter the bargaining room. The cost shifted from *voting* to *negotiating*."

  **3. The Rounding Rule (The "Bug" in the Code)**
  *   *Point to the Coin Flip:* "Green got 2 seats because of a coin flip on a remainder. If we used D'Hondt, Red would have 5 seats and a majority. A rounding rule nobody voted on determined whether Green had power or not. In software terms: The API specification (the law) had undefined behavior at the edge case."

  **4. Seat Share vs. Power**
  *   *Ask Yellow:* "You have 1 seat. Did you get any policy?" (No). "You were in the legislature but not in the government."
  *   *Ask Green:* "You have 2 seats. Did you get your policy?" (Yes, Lunch).
  *   *Point:* "Power isn't seat share. Power is *pivotality*. Green was small but pivotal. Yellow was small and irrelevant. Blue was large but excluded."

  ---

  ### 5. Predictable Failure Modes & Fixes

  **1. "This is Rigged."**
  *   *Prediction:* Participants will claim you stacked the districts.
  *   *Fix:* Agree with them. "Yes. This is a unit test. In the real world, gerrymandering happens. Today we isolated the variable to see how the system reacts to the input. The point isn't that this profile is realistic, but that the *mechanism* is sensitive."

  **2. Bargaining Stalls.**
  *   *Prediction:* Green holds out for too much; Red walks away. Time runs out.
  *   *Fix:* At the 10-minute mark, announce: "Polling shows 60% of the public supports Lunch. If you don't sign, the money burns." Apply pressure. If they still fail, let the money burn. It's a powerful lesson in gridlock.

  **3. Math Errors.**
  *   *Prediction:* You miscount the remainders on the whiteboard.
  *   *Fix:* Pre-calculate the numbers on a hidden sheet. If challenged, say "Let's verify," and check your sheet. Do not let the group get bogged down in arithmetic; keep the focus on the *implication* of the numbers.

  **4. Participants Vote Randomly.**
  *   *Prediction:* They ignore their cards.
  *   *Fix:* At the start, say: "Your card is your employment contract for this hour. If you vote against your card, you are fired from the simulation." (Say it with a smile).

  ---

  ### 6. Limitations (What You Must Say)

  End the session by explicitly stating what this simulation *cannot* show. This builds credibility.

  1.  **Party Formation:** "Today, the parties were fixed. In reality, FPTP crushes new parties before they start. We didn't see Green struggle to *get on the ballot*, only to get seats."
  2.  **Geography:** "Our districts were abstract. In reality, FPTP is defended as 'local representation.' We didn't simulate whether your MP actually lives in your district."
  3.  **Turnout:** "Everyone voted 100%. In reality, wasted votes in FPTP suppress turnout. We didn't feel the apathy."
  4.  **Stability:** "We formed a government in 20 minutes. Real coalitions take months. The 'cost' of PR is often time and instability, which we compressed."

  ### 7. Verification Checklist (For You)

  Before you run this, verify these numbers on a scratchpad:
  *   [ ] **R1:** Red wins Districts 1, 2, 3. Blue wins 4. (Red Majority).
  *   [ ] **R1:** District 3 has 2 Red, 2 Blue, 1 Green. Green prefers Blue. Blue prefers Green. Red wins despite losing head-to-head.
  *   [ ] **R2:** Total Votes = 20.
  *   [ ] **R2:** Quota = 2.
  *   [ ] **R2:** Remainders: Blue (1.0), Green (1.0).
  *   [ ] **R2:** Coin Flip gives seat to Green.
  *   [ ] **Coalition:** Red (4) + Green (2) = 6. (Majority).
  *   [ ] **Coalition:** Blue (3) + Green (2) = 5. (Minority).
  *   [ ] **Toxic:** Yellow is excluded from all viable deals.

  If these check out, the session will land exactly where you want it.
