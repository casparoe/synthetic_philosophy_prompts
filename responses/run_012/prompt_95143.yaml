answer: |-
  This is a brilliant way to teach social choice theory. You are essentially asking students to empirically derive a impossibility theorem through gameplay. The structure you've outlined is sound, but to make it work in 90 minutes with 16 students, the logistics need to be military-precise. If the counting drags, the insight dies.

  Here is the complete kit for your session.

  ### **I. Preparation & Materials**

  **The Room:**
  Arrange chairs in a large circle. You need a whiteboard/blackboard visible to everyone.

  **The Cards (Print these on standard paper, cut into strips):**
  You need three sets of cards. Do not label them "Round 1" or "Round 2" on the card itself; hand them out sequentially.

  **Round 1 Set (Plurality Rule)**
  *Total 16 cards. Shuffle and deal randomly.*
  *   **5 cards:** `TRUE PREFERENCES: A > B > C > D`
  *   **4 cards:** `TRUE PREFERENCES: B > A > C > D`
  *   **4 cards:** `TRUE PREFERENCES: C > B > A > D`
  *   **3 cards:** `TRUE PREFERENCES: D > C > B > A`

  **Round 2 Set (Instant Runoff Rule)**
  *Total 16 cards. Collect Round 1 cards, shuffle, and deal these.*
  *   **5 cards:** `TRUE PREFERENCES: A > B > C`
  *   **4 cards:** `TRUE PREFERENCES: B > C > A`
  *   **7 cards:** `TRUE PREFERENCES: C > A > B`

  **Round 3 (Red Team)**
  *No cards needed. Just board space.*

  **The Scoreboard:**
  Draw a table on the board before class starts:
  | Round | Rule | Winner (Sincere) | Manipulator | Winner (Strategic) |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | Plurality | | | |
  | 2 | Runoff | | | |
  | 3 | Custom | | | |

  ---

  ### **II. Minute-by-Minute Timeline**

  **00:00 – 00:10: Introduction & Rules of Engagement**
  *   **Hook:** "I spent 35 years mixing chemicals. If you mix the wrong things, things explode. Today we mix preferences. If you mix them wrong, democracy explodes."
  *   **The Stakes:** "We are awarding 'Seminar Points' (write names on board). Winner gets first pick of seminar topics next term / a piece of candy / bragging rights."
  *   **The Rule:** "Silence during voting. You know your card. You do not know others' cards. Vote sincerely unless you see a reason not to."

  **00:10 – 00:30: Round 1 (Plurality)**
  *   **Action:** Hand out Round 1 cards.
  *   **Instruction:** "Vote for your **top choice only**. Write it on a scrap paper, fold it, pass it forward."
  *   **Count:** You count aloud. (Expected: A=5, B=4, C=4, D=3). **Winner: A.**
  *   **The Reveal:** "Now, stand up and find the people who have your exact same ranking. Sit together." (This visually forms the blocs: 5, 4, 4, 3).
  *   **The Question:** "Look at the winner (A). Look at your card. Is there any group here that prefers the *runner-up* over the winner?"
  *   **The Discovery:** The 'C' group (4 students) prefers B > A.
  *   **The Hypothetical:** "If the 'C' group had voted for B instead of C, what happens?" (Class calculates: B=8, A=5). **Winner: B.**
  *   **Board:** Fill in Round 1 row. Note: "C-voters lied to get B."

  **00:30 – 00:50: Round 2 (Instant Runoff)**
  *   **Action:** Collect cards, deal Round 2 set.
  *   **Instruction:** "New Rule: Instant Runoff. Vote for top choice. If no majority, lowest score is eliminated, votes transfer to 2nd choice."
  *   **Count:**
      1.  A=5, B=4, C=7.
      2.  B is eliminated (lowest).
      3.  B's 4 votes transfer to C (per card: B>C>A).
      4.  Final: C=11, A=5. **Winner: C.**
  *   **The Reveal:** Group up again (5, 4, 7).
  *   **The Question:** "Who is unhappy? The A-group (5 students) got their last choice."
  *   **The Discovery:** A-group prefers B > C.
  *   **The Hypothetical:** "If A-group votes for B (their 2nd) instead of A (their 1st)?"
      1.  New Count: A=0, B=9, C=7.
      2.  C is eliminated.
      3.  C's 7 votes transfer to A (per card: C>A>B).
      4.  Final: B=9, A=7. **Winner: B.**
  *   **Board:** Fill in Round 2 row. Note: "A-voters lied to bury C."

  **00:50 – 01:15: Round 3 (Red Team / Gremlin)**
  *   **Action:** Divide into 4 committees of 4 students.
  *   **Task:** "Invent a voting rule. Write it on the board. It must take ranked ballots and produce one winner. It cannot be 'I decide'."
  *   **Examples to ban:** "Flip a coin," "Let the professor decide."
  *   **The Gremlin Phase (You):** Visit each group. Ask for their rule. Then propose a "Preference Profile" (3 voters, 3 options is usually enough to break them).
      *   *If they say "Points for 1st and 2nd":* You propose a profile where burying a rival works.
      *   *If they say "Pairwise comparisons":* You propose a Condorcet Cycle (A>B>C>A) and ask "Who wins?" (Rule fails to produce a winner).
      *   *If they say "Dictator":* You point out the "Non-dictatorial" constraint.
  *   **Goal:** Do not let them win easily. If they survive 2 minutes, they win the round.

  **01:15 – 01:30: Debrief & The Theorem**
  *   **Connect:** "You found manipulation in Plurality. You found it in Runoff. The Red Team couldn't build a shield."
  *   **Name It:** "This is the **Gibbard–Satterthwaite Theorem**." (Write it large).
  *   **The Statement:** "With 3+ options, any voting system that isn't a Dictatorship can be manipulated."
  *   **The Escape Hatches:** (See Section IV below).
  *   **Closing:** "Voting isn't about finding the 'true' will. It's about managing the incentives."

  ---

  ### **III. The Gremlin's Script (Round 3)**

  Your role is not to crush them, but to probe the boundaries of their rules. Keep a notepad.

  **Opening:** "I am the Gremlin. I want to break your rule. I will give you a set of voter preferences. If my voters can lie to get a better result, your rule is broken."

  **Scenario A (The Borda Breaker):**
  *   *Student Rule:* "Give 2 points for 1st, 1 point for 2nd."
  *   *Gremlin Profile:* 3 Voters. Options X, Y, Z.
      *   Voter 1: X > Y > Z
      *   Voter 2: X > Y > Z
      *   Voter 3: Y > Z > X
  *   *Sincere:* X=4, Y=3, Z=1. (X wins).
  *   *Lie:* Voter 3 votes Z > Y > X.
  *   *Result:* X=2, Y=3, Z=2. (Y wins). Voter 3 prefers Y over X. Rule broken.

  **Scenario B (The Cycle Breaker):**
  *   *Student Rule:* "Pairwise majority. If someone beats everyone else, they win."
  *   *Gremlin Profile:* 3 Voters.
      *   Voter 1: A > B > C
      *   Voter 2: B > C > A
      *   Voter 3: C > A > B
  *   *Gremlin:* "A beats B. B beats C. C beats A. Who is the winner? Your rule produces no result. Broken."

  **The "Dictator" Moment:**
  If a group writes: "The person with the birthday closest to today decides."
  *   *You:* "This works. It is strategy-proof. But is it acceptable? It violates the 'Non-Dictatorial' condition of the theorem. It solves the math problem by deleting the democracy."

  ---

  ### **IV. The Debrief: Mapping the Escape Hatches**

  Draw a triangle on the board with three corners. Label them **The Three Costs**. Explain that Gibbard-Satterthwaite assumes three conditions. To avoid manipulation, you must break one condition.

  1.  **Corner 1: Non-Dictatorial.**
      *   *The Fix:* Let one person decide (The Chair, The King).
      *   *The Cost:* Autocracy. It works mathematically, but we reject it politically.
  2.  **Corner 2: Unrestricted Domain.**
      *   *The Fix:* Restrict preferences to a single dimension (Left vs. Right).
      *   *The Theory:* **Median Voter Theorem.** If everyone's preferences are "single-peaked" along a line, Majority Rule is strategy-proof.
      *   *The Cost:* Reality is multidimensional. You can't reduce war, taxes, and culture to a single line without losing information.
  3.  **Corner 3: Ordinal Ballots.**
      *   *The Fix:* **Cardinal / Range Voting.** (Rate candidates 0-10).
      *   *The Theory:* G-S applies to *rankings*. If you allow *intensity*, the theorem technically doesn't apply.
      *   *The Cost:* It invites a different kind of lying (exaggeration). "I love my guy 10, I hate the other guy 0," even if you feel mildly. It changes the game, doesn't end it.

  **Conclusion:** "There is no perfect system. There are only trade-offs."

  ---

  ### **V. Troubleshooting: What Will Go Wrong**

  1.  **The Tie:** With 16 voters, ties are probable.
      *   *Fix:* Announce the tie-breaker *before* Round 1. "In case of a tie, the Instructor casts the deciding vote." This actually reinforces the lesson (the "Dictator" escape hatch appears naturally).
  2.  **The Collusion:** Students will talk during voting.
      *   *Fix:* "If you talk, your bloc is disqualified from the manipulation analysis." Keep it light but firm.
  3.  **The Borda Drag:** If you switch Round 2 to Borda instead of Runoff, counting takes too long.
      *   *Fix:* Stick to the Runoff profile provided above. It is faster to count publicly.
  4.  **The Cynic:** A student will say, "So voting is a sham."
      *   *Fix:* "No. It means voting is a *responsibility*. If you vote sincerely and lose, you might have handed the win to your last choice. Knowing the game makes you a better citizen."
  5.  **The "Hands Up" Suggestion:** Someone will suggest open voting to prevent lying.
      *   *Fix:* "That introduces peer pressure. Now the cost of lying is social shame, not just math. We've traded one distortion for another."

  ---

  ### **VI. Limitations: The Frank Paragraph**

  *Read this or speak this verbatim at the very end.*

  "This game has shown you that manipulation is *possible* in the rules we tried. It has not proven that manipulation is *inevitable* in all rules. That is what the proof buys you. In this room, we only tested three systems. A mathematician might say, 'You haven't tested the system I invented five minutes ago.' The Gibbard–Satterthwaite theorem is powerful because it covers the systems we haven't thought of yet. It tells us that no matter how clever we are, if we want democracy (non-dictatorial) and flexibility (unrestricted domain) with ranked choices, strategy is a feature, not a bug. Also, notice that in this game, the stakes were candy. In the real world, when the stakes are war or taxes, the incentive to manipulate the ballot is not just rational; it is mandatory."

  ***

  **A Note on the Names:** You mentioned getting Gibbard–Satterthwaite backwards.
  *   **Allan Gibbard (1973)**
  *   **Mark Satterthwaite (1975)**
  *   *Mnemonic:* **G** comes before **S** in the alphabet, just as **G**ibbard published before **S**atterthwaite. (Or: **S**atterthwaite was the **S**tudent, Gibbard was the **G**uru).

  Good luck, Professor. The chemistry department may be horrified, but the political scientists will be jealous.
