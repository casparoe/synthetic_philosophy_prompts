      *   The "Procrastination Paradox" or "Tiling Agents" problem: If an agent wants to create a successor agent, the successor must be at least as trustworthy. If $T_2 \vdash Sound(T_1)$, usually $T_2$ is strictly stronger than $T_1$ (by Gödel). If the successor uses $T_1$, it's weaker. If the successor uses $T_2$, we're back to self-trust. If we keep climbing $T_1, T_2, T_3...$, we run out of consistency strength eventually or can't bound the reasoning.
