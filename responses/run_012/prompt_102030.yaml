answer: |-
  This is a sharp question because your friend's argument relies on a specific rhetorical move: **normalization through historical precedent.** If we did $X$ for centuries, why is $Y$ (which looks like $X$) suddenly taboo?

  To evaluate this, we have to map the mechanics of both arrangements, identify where the friction points are, and determine if those friction points justify state intervention (bans) or if they are indeed just "moral panic."

  ### 1. The Mapping: Wet-Nursing vs. Paid Surrogacy

  Here is the structural correspondence your friend is relying on:

  | Feature | Historical Wet-Nursing | Modern Paid Surrogacy |
  | :--- | :--- | :--- |
  | **The Worker** | A lactating woman (often poor/rural). | A gestating woman (often lower income relative to IPs*). |
  | **The Service** | Lactation and infant care. | Gestation and labor/delivery. |
  | **The "Product"** | Breast milk (bodily fluid) + Care. | A live-born infant (legal custody). |
  | **The Fee** | Wages for nursing service. | Compensation for medical risk + time. |
  | **The Contract** | Agree to feed a specific child for a term. | Agree to carry and relinquish parental rights. |
  | **Handover** | Child often stays with nurse or nurse moves in. | Child is handed to Intended Parents (IPs) immediately at birth. |
  | **Genetic Tie** | None (nurse is not the mother). | None (in gestational surrogacy). |

  *\*IPs = Intended Parents*

  On the surface, the friend is right: both involve paying a woman to use her reproductive biology to sustain a child that is not legally hers.

  ### 2. Where the Analogy Breaks Down

  There are three major breaks. Two are trivia; one is structural and ethically heavy.

  **Break 1: Risk and Invasiveness (Matters)**
  *   **Wet-Nursing:** Low medical risk. Lactation is a natural post-partum state. The physical burden is caloric and time-based.
  *   **Surrogacy:** High medical risk. Pregnancy involves hormonal manipulation, surgical procedures (embryo transfer, C-sections), and significant morbidity/mortality risks.
  *   **Why it matters:** The state has a stronger interest in regulating high-risk bodily interventions than low-risk ones. If you view the ban as "paternalistic protection," it holds more water here than with wet-nursing.

  **Break 2: Custody and Separation (Matters)**
  *   **Wet-Nursing:** The baby already exists. The nurse is hired to *keep it alive*. In many historical cases, the nurse bonded with the child, but the legal ownership never shifted.
  *   **Surrogacy:** The baby is created *for the purpose of transfer*. The contract requires the severing of the gestational bond at birth.
  *   **Why it matters:** This touches on **commodification**. Wet nursing sells a *service* (feeding). Surrogacy sells a *result* (a baby to take home). Even if legally framed as a "service," the economic exchange is contingent on the production of a human being for another's custody. This triggers anti-trafficking concerns that wet-nursing did not.

  **Break 3: Impact on the Worker's Own Children (Trivia/Contextual)**
  *   **Wet-Nursing:** Historically, wet nurses often had to send their *own* infants away to be bottle-fed (often leading to high mortality) so they could nurse the employer's child.
  *   **Surrogacy:** Surrogates are usually required to already have children, but they do not neglect them to carry the pregnancy (though the pregnancy does divert resources).
  *   **Why it's trivia:** While historically horrific, this doesn't change the ethical structure of the *transaction* itself, only the social cost.

  ### 3. The Gestational Twist: Does it Help or Hurt Him?

  Your friend notes that modern surrogacy is usually **gestational** (the surrogate provides the womb, not the egg).

  *   **How it helps him:** It makes the surrogate *more* like a wet nurse. A wet nurse has no genetic claim to the child; she just provides the biological environment (milk). A gestational surrogate has no genetic claim; she just provides the biological environment (womb). It removes the emotional complexity of "giving up your own genetic child," making it look like pure labor.
  *   **How it hurts him:** It makes the **commodification** argument stronger. If the surrogate were the genetic mother, you could argue she is "adoption with assistance." If she is *not* genetic, she is functionally a **human incubator**. This aligns with the "lab coat" criticism your friend mentions, but not in his favor. It suggests the woman is being rented for her organs, not hired for her maternal capacity.

  **Verdict:** The gestational aspect makes the *legal* transfer easier (she isn't the bio-mother), but it makes the *ethical* "body as property" concern sharper. It hurts his argument that this is "just nursing." Nursing is a function; gestation without genetics is closer to organ leasing.

  ### 4. Does the "Moral Panic" Conclusion Survive?

  **No.** The conclusion that the bans are *just* moral panic does not survive the disanalogies.

  Here is why:
  1.  **The "Baby as Product" Problem:** Wet-nursing bans (where they existed) were usually about health or class, not the sale of the child. Surrogacy bans in France/Germany are explicitly about **Civil Status** and **Human Dignity**. Their legal codes view the human body as "hors du commerce" (outside of commerce). You can pay for a service, but you cannot pay for the *creation and transfer of a human*. Wet-nursing doesn't transfer the human; surrogacy does.
  2.  **Coercion Potential:** Because pregnancy is high-risk and life-altering, the potential for economic coercion is significantly higher than lactation. A poor woman might risk her health for money in a way she wouldn't for lactation. The state argues it must ban the market entirely to prevent a "race to the bottom" on women's bodies.
  3.  **The "Lab Coat" is Real:** Your friend says the bans are "moral panic wearing a lab coat." But the "lab coat" represents bioethics. The bioethical concern here isn't panic; it's the **non-commercialization of human life**. Whether you agree with it or not, it is a coherent philosophical position, not just a panic.

  **However,** your friend is right about one thing: **Consistency.**
  If a country allows paid wet-nursing (selling milk) but bans paid surrogacy (selling gestation), they are drawing a line between "selling bodily fluids" and "selling bodily functions." Many ethicists argue this line is arbitrary. If I can sell my plasma and my milk, why can't I sell my womb's capacity?
  *   **The Counter:** Plasma and milk regenerate. A pregnancy is a singular, high-stakes event with permanent physical changes. The "regenerative" distinction is where the law usually rests.

  ### 5. A Better Analogy

  If you want to test your friend's logic, drop wet-nursing. It's too distinct. The better analogy is **Paid Kidney Donation** or **Clinical Trial Subject.**

  **The Paid Kidney Analogy:**
  *   **Mapping:** A person is paid to undergo surgery and lose a body part/function to save/improve another's life.
  *   **The Law:** In almost all the same countries that ban surrogacy (France, Germany, Canada), **paid organ donation is also illegal.** You can donate a kidney, but you cannot sell it.
  *   **The Logic:** The body is not a commodity. You can give it altruistically, but introducing money corrupts the consent and commodifies the human.
  *   **Why it's better:** It isolates the "paid bodily intrusion" variable without the confusing "baby" variable.

  **The Clinical Trial Analogy:**
  *   **Mapping:** A person is paid to ingest drugs or undergo procedures that carry health risks, for the benefit of science (or a pharmaceutical company).
  *   **The Law:** This *is* legal and regulated.
  *   **Why it matters:** If surrogacy is just "medical labor," it should look like clinical trials (heavy regulation, allowed). If it is "human creation," it should look like adoption (altruistic only).
  *   **The Break:** Clinical trials are for *data*. Surrogacy is for *a child*. The "product" of a trial is information; the product of surrogacy is a person who becomes someone's son or daughter.

  ### Summary for Your Friend

  Tell him this:
  "The wet-nursing analogy works historically but fails ethically. Wet-nursing sells a **service** (feeding) for an existing child. Surrogacy sells a **result** (custody of a new child). That distinction matters because it turns the baby into the deliverable of a contract.

  The gestational part helps you on genetics but hurts you on commodification—it makes the womb look like a rented container.

  The bans aren't just 'panic'; they are consistent with bans on selling organs. The real question isn't 'is this like wet-nursing?' It's 'is pregnancy a service like nursing, or is it a fundamental human status that shouldn't be rented?' If you think it's a service, the bans look like panic. If you think the body is 'outside commerce,' the bans are consistent. But you can't use wet-nursing to prove the service point, because wet-nursing doesn't involve transferring parenthood."
