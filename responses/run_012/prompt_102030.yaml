      *   *Commodification:* If the baby is the "product," bans address human trafficking concerns. Wet nursing doesn't transfer custody of the child permanently in the same way.
      *   *Conclusion:* The breaks are substantial enough that "moral panic" is too dismissive, even if one supports surrogacy. The ethical landscape is different.

  6.  **Find a Better Analogy:**
      *   *Organ Donation?* (Kidney). Paid vs. Unpaid. Invasive.
      *   *Clinical Trial Subject?* Paid to undergo medical risk for someone else's benefit.
      *   *Adoption?* Transferring rights, but usually unpaid.
      *   *Best Fit:* **Paid Clinical Trial Subject + Adoption.** Or **Organ Leasing.**
      *   *Actually, the strongest one:* **Paid Kidney Donation (if legal) vs. Surrogacy.** Both involve invasive bodily use for another's benefit. Most countries ban paid kidney donation too (altruism only). This aligns France/Germany's logic better.

  7.  **Drafting the Response (Iterative refinement):**

