      *   **Task:** Map the analogy honestly (surrogate $\leftrightarrow$ wet nurse, milk $\leftrightarrow$ ?, fee $\leftrightarrow$ ?, contract $\leftrightarrow$ ?, handover $\leftrightarrow$ ?).
      *   **Critical Analysis:** Identify where the analogy breaks down. Distinguish between trivial breaks and breaks that matter for the conclusion (i.e., do the breaks justify the bans?).
      *   **Specific Detail:** Address gestational surrogacy (surrogate $\neq$ genetic mother). Does this help or hurt the friend's argument?
      *   **Alternative:** Suggest a better analogy if one exists.
      *   **Tone:** Honest, analytical, nuanced, not preachy.

  2.  **Deconstruct the Analogy (Mapping):**
      *   *Wet Nurse:* Woman hired to breastfeed.
      *   *Surrogate:* Woman hired to gestate.
      *   *Milk:* Bodily product produced *after* birth.
      *   *Gestation/Pregnancy:* Bodily process occurring *before* birth.
      *   *Fee:* Payment for service/labor.
      *   *Contract:* Agreement to provide service.
      *   *Handover:* Baby goes to parents (in wet-nursing, often *with* the nurse or to the nurse's home; in surrogacy, immediate separation).

  3.  **Identify the Breaks (Disanalogies):**
      *   *Biological Intimacy/Risk:* Pregnancy is vastly more invasive, risky, and long-term than lactation. 9 months vs. months/years of feeding.
      *   *Genetic Connection:* Wet nurses never claimed genetic kinship. Traditional surrogates (own egg) do; Gestational surrogates (donor egg) don't.
      *   *Separation:* Wet nursing often involved the baby staying with the nurse or the nurse moving in. Surrogacy *requires* separation at birth.
      *   *Commodification:* Is selling a service (labor) the same as selling the *product* of that labor (the baby)? Wet nursing sells milk/care. Surrogacy sells the baby (legally, the service results in the transfer of parental rights).
      *   *Exploitation/Class:* Both have class dimensions, but the stakes of pregnancy are higher.

  4.  **Evaluate the "Gestational" Aspect:**
