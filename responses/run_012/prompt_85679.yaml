      *   *Final check on constraints:* 18 students. 90 mins. No lecture. Printable materials.
      *   I will provide the text for the Handouts.

      *   *Troubleshooting:*
          *   "It's all made up": Address in debrief (real data has noise, but the structural problem remains).
