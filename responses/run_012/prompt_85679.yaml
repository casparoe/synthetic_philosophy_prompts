      *   **Table:**
          *   Years: 2000, 2010, 2020.
          *   Ages: 20, 30, 40.
          *   Values:
              *   2000: 20(10), 30(20), 40(30).
              *   2010: 20(15), 30(25), 40(35).
              *   2020: 20(20), 30(30), 40(40).
          *   This is perfectly additive. $Score = 0.5 \times Age + 0.5 \times Year + Constant$.
          *   This allows any decomposition to fit "perfectly" depending on the constraint.
      *   **Cards:** Need to sound authoritative but methodological. "Standard Demographic Adjustment," "Historical Contextualization," "Generational Cohort Analysis."
      *   **Tokens:** Physical chips or just write numbers? Write numbers on a public board.
      *   **Payoff:** Points for "Consistency" (internal logic) and "Defense" (argument). Not for being "right" (since no one is).

  6.  **Addressing the "Failures":**
      *   *Failure 1: "It's all made up."* Counter: Emphasize the data is fixed. The *interpretation* is the variable. Use the "Policy Stake" (where do we spend money?) to make it feel real.
      *   *Failure 2: "Smart students spot it."* Counter: Instruct them not to compare cards until the reveal. Make the cards look like "Role Descriptions" rather than "Assumptions."
      *   *Limitation:* The activity shows *statistical* underdetermination. It doesn't prove *ontological* unreality. I need to make sure the debrief distinguishes between "we can't measure it" and "it doesn't exist."

  7.  **Final Polish:**
      *   Ensure tone is professional.
      *   Check timing (90 mins is tight).
      *   Make sure the math is checkable by hand.
      *   Ensure the debrief questions map to the prompt's requirements (HPC, projectibility, etc.).

  8.  **Self-Correction on "Prediction" vs "Explanation":**
      *   The prompt asks for "arithmetic bookkeeping." The Explanation Budget is exactly that.
      *   However, Prediction is more engaging.
      *   Let's combine them. "Explain the past (allocate tokens) to Predict the future."
      *   No, keep it simple. Just "Explain the variance." It's cleaner for the APC identity.
      *   Wait, the prompt says: "A gap... can be redescribed... as a gap between young and old... or 2010s and 1990s."
