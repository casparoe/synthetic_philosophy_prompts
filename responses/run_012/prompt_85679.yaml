              *   I need **Non-Linear** data or **Incomplete** data that forces interpolation.
              *   Let's make the "Cohort" card force them to ignore the time trend.
              *   Let's make the "Age" card force them to ignore the cohort difference.

      *   **Decision:** I will use the **"Explanation Budget"** approach. It is the most robust way to demonstrate underdetermination without requiring complex extrapolation math that might confuse students. It focuses on *attribution of cause*, which is the philosophical heart of the matter.
      *   **Setup:** 3 Teams (6 students each).
      *   **Data:** A 3x3 Grid (Year x Age).
