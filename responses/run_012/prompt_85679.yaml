      *   Option B: Period-based program (Media Campaign). Works if Period is driver.
      *   Option C: Cohort-based program (Gen Z Outreach). Works if Cohort is driver.
      *   Teams must bid their $1M on one option based on the data.
      *   This forces a choice. They can't split the money (or can they? No, force a choice).
      *   This creates the conflict. Team 1 bids on Mentorship. Team 2 bids on Media. Team 3 bids on Outreach.
      *   Then they argue why.
      *   Then the reveal.
      *   This is stronger. I will use this.

      *   *Math for Policy Bid:*
          *   Data:
              *   2010: 20yo (10), 30yo (20), 40yo (30).
              *   2020: 20yo (20), 30yo (30), 40yo (40).
          *   Trend: +10 everywhere.
