                          *   We have Born 1990 (2010: 50, 2020: 70).
                          *   We have Born 2000 (2020: 60).
                          *   Born 1995 is between 1990 and 2000.
                          *   If Cohort 1990 is "High" (70 at age 30) and Cohort 2000 is "Med" (60 at age 20).
                          *   This is getting messy.

      *   **Simpler Approach:** The "Budget Allocation" Game.
          *   Give them the table.
          *   Tell them: "The total variation in this table is 100 points."
          *   Task: "Allocate the 100 points of explanation to Age, Period, and Cohort."
          *   Constraint Card A: "Method 1: Enter Age first. Assign all variance Age can explain. Assign remainder to Period." (Result: High Age, Low Period, Zero Cohort).
          *   Constraint Card B: "Method 2: Enter Period first. Assign all variance Period can explain. Assign remainder to Age." (Result: High Period, Low Age, Zero Cohort).
          *   Constraint Card C: "Method 3: Enter Cohort first..."
          *   This explicitly shows the order of entry matters (hierarchical regression logic) without using the words.
          *   This is clearer. It forces them to see that the *choice of model* determines the *result*.
          *   Let's refine this. It's more "philosophical" about explanation than prediction.
          *   Actually, prediction is more visceral. "What happens next?"
          *   Let's go back to Prediction but ensure divergence.
          *   Data:
              *   2000: 20yo (10), 40yo (30).
              *   2020: 20yo (30), 40yo (50).
              *   Target: 2040, 40yo.
              *   **Age Theory:** 40yos are always 20 points higher than 20yos. In 2020, 20yo=30, so 40yo=50. In 2040, if 20yo trend continues (10->30->50?), then 40yo=70. If 20yo stays 30, 40yo=50.
