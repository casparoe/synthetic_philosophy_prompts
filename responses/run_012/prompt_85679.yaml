  # Activity Design: The Variance Budget

  **Course:** Philosophy of the Social Sciences (Year 3)
  **Topic:** Social Kinds / The Age-Period-Cohort Problem
  **Time:** 90 Minutes
  **Students:** 18 (3 Teams of 6)
  **Room:** Standard Seminar Room (tables arranged in three clusters)

  ## 1. Preparation & Materials

  Print the following materials. Do not label them "Activity 1" or "Handout." Label them clearly as **Confidential Briefing**.

  **A. The Data Table (1 per student)**
  *Header:* **National Civic Engagement Index (NCEI) — Illustrative Data**
  *Note:* "Values represent average scores (0-100) for demographic groups. All figures are invented for methodological training."

  | Survey Year | Age 20-29 | Age 30-39 | Age 40-49 |
  | :--- | :---: | :---: | :---: |
  | **2010** | 10 | 20 | 30 |
  | **2015** | 15 | 25 | 35 |
  | **2020** | 20 | 30 | 40 |

  **B. The Protocol Cards (1 per team, kept secret)**
  *Design:* Print on different colored paper if possible. Do not let teams swap cards.

  *   **Team 1 (Blue Card): Lifecycle Protocol**
      *   **Mission:** Determine the primary driver of NCEI scores to inform long-term planning.
      *   **Method:**
          1.  Calculate the **Age Effect**: Find the average difference between age groups *within* the same year. (e.g., In 2010, 30s score 10 higher than 20s). Average this across all years.
          2.  Assign **Causal Points** to Age based on this consistency.
          3.  Treat any remaining changes over time as "Historical Noise." Assign remaining points to Period.
          4.  **Constraint:** Cohort effects are theoretically impossible in this model. Assign **0 points** to Cohort.
      *   **Goal:** Allocate 100 Causal Points between Age and Period.

  *   **Team 2 (Red Card): Historical Protocol**
      *   **Mission:** Determine the primary driver of NCEI scores to inform immediate policy.
      *   **Method:**
          1.  Calculate the **Period Effect**: Find the average difference between survey years *within* the same age group. (e.g., 20s scored 5 higher in 2015 than 2010). Average this across all age groups.
          2.  Assign **Causal Points** to Period based on this consistency.
          3.  Treat any remaining differences between age groups as "Developmental Noise." Assign remaining points to Age.
          4.  **Constraint:** Cohort effects are theoretically impossible in this model. Assign **0 points** to Cohort.
      *   **Goal:** Allocate 100 Causal Points between Period and Age.

  *   **Team 3 (Green Card): Generational Protocol**
      *   **Mission:** Determine the primary driver of NCEI scores to inform targeted outreach.
      *   **Method:**
          1.  Calculate the **Cohort Effect**: Identify specific birth groups. (e.g., People born 1980-89 were 30-39 in 2010 and 40-49 in 2020). Compare their scores across time.
          2.  *Hint:* In this dataset, a specific Cohort's score increases exactly as they age.
          3.  Assign **Causal Points** to Cohort based on this tracking.
          4.  Treat Age and Period as secondary manifestations of the Cohort identity.
          5.  **Constraint:** You must assign at least **60 points** to Cohort. Distribute the rest between Age and Period as you see fit.
      *   **Goal:** Allocate 100 Causal Points between Cohort, Age, and Period.

  **C. The Decision Sheet (1 per student)**
  *   **Section 1:** Our Causal Allocation (Age: __ / Period: __ / Cohort: __).
  *   **Section 2:** Our Recommendation (One sentence: "Because [Driver] is dominant, we should...")
  *   **Section 3:** Confidence Level (1-10).

  **D. Tokens (Optional)**
  *   100 poker chips or counters per team to physically move into three piles labeled Age, Period, Cohort. (If unavailable, just write numbers).

  ---

  ## 2. Timeline & Script

  ### 00:00 – 00:05 | Introduction & Grouping
  **Instructor:** "Welcome. Today we are acting as data consultants for the National Civic Foundation. You have received a confidential briefing packet. Do not share your packet contents with other teams. You have 25 minutes to analyze the data, allocate 100 points of 'Causal Influence,' and agree on a policy recommendation. Go."

  *   **Action:** Divide class into 3 teams of 6. Hand out Data Tables (everyone) and Protocol Cards (one per team, face down until you say go).
  *   **Crucial:** Ensure Team 1 gets Blue, Team 2 gets Red, Team 3 gets Green. Tell them: "Your Protocol Card contains your methodological mandate. It is confidential. Do not show it to other teams."

  ### 00:05 – 00:30 | Team Work
  **Instructor:** (Circulate silently).
  *   **If a team asks:** "Is this data real?" **Say:** "Treat it as real for the purpose of the exercise."
  *   **If a team asks:** "Can we split points evenly?" **Say:** "Your Protocol Card gives you constraints. Follow them."
  *   **If a student spots the math trick:** "Interesting observation. Please keep it within your team for now. We want to see if the protocol holds." (Delay the reveal).

  *   **Expected Outcomes:**
      *   **Team 1 (Lifecycle):** Will find Age differences are constant (+10 per bracket). Will assign ~80-100 points to **Age**. Recommendation: "Invest in life-stage support; scores rise naturally with maturity."
      *   **Team 2 (Historical):** Will find Period differences are constant (+5 per survey). Will assign ~80-100 points to **Period**. Recommendation: "Invest in media campaigns; the current era is driving engagement."
      *   **Team 3 (Generational):** Will track the 1980s cohort (30s in 2010, 40s in 2020). Scores go 20 -> 40. They see a strong cohort signature. Will assign ~60+ points to **Cohort**. Recommendation: "Invest in Gen-specific outreach; this generation is uniquely active."

  ### 00:30 – 00:45 | The Conflict (Presentations)
  **Instructor:** "Time. Please write your Causal Allocation on the whiteboard."
  *   *Board will show:*
      *   Team 1: Age 90 / Period 10 / Cohort 0
      *   Team 2: Age 10 / Period 90 / Cohort 0
      *   Team 3: Age 20 / Period 20 / Cohort 60
  **Instructor:** "You are looking at the same table. You have arrived at mutually exclusive conclusions. Team 1, explain why Team 2 is wrong. Team 2, defend your position. Team 3, where do you stand?"
  *   **Facilitation:** Let them argue about the *data*. They will claim their pattern is the "real" one. Team 1 will say "Age is stable!" Team 2 will say "Time is moving!" Team 3 will say "But look at the people!"
  *   **Goal:** Let the frustration build. They cannot refute each other using the table alone.

  ### 00:45 – 00:55 | The Reveal
  **Instructor:** "Stop. Please exchange Protocol Cards with another team. Read the 'Method' section of the card you just received."
  *   *(Pause for 2 minutes while they read)*
  **Instructor:** "Look at your own calculations. Now look at the card. Did the data force your conclusion, or did the card?"
  *   **Expected Reaction:** Realization that the "Constraint" on the card dictated the result, not the numbers.
  *   **Instructor:** "You have just encountered the **Identification Problem**. In the data, Age, Period, and Cohort are locked together. $Age = Period - Cohort$. You cannot move one without moving the others. To separate them, you must add an assumption that is *not in the data*."

  ### 00:55 – 01:30 | Debrief & Philosophical Mapping
  **Instructor:** (Move to board. Do not use jargon until now).

  **Phase 1: The Arithmetic of Kinds (10 mins)**
  *   **Point:** "Team 1 assumed Aging is the 'real' cause. Team 2 assumed History is the 'real' cause. The data supported both equally well."
  *   **Philosophical Claim:** This is **Underdetermination**. Evidence alone does not dictate theory. We need auxiliary assumptions.
  *   **Question:** "If the data doesn't tell us which is real, is 'Generation' a real thing, or just a label?"

  **Phase 2: What Makes a Kind? (15 mins)**
  *   **Point:** Connect to Homeostatic Property Clusters (HPC).
  *   **Prompt:** "For 'Tiger' to be a natural kind, there is a causal mechanism (DNA) holding the properties together. For 'Gen Z' to be a social kind, what is the mechanism?"
  *   **Discussion:**
      *   If Team 1 is right (Age), 'Gen Z' is not a kind; it's just a stage of life (like 'childhood').
      *   If Team 3 is right (Cohort), 'Gen Z' might be a kind *if* there is a shared historical cause (e.g., the Internet, 9/11, Climate Crisis) that bonded them.
      *   **Key Distinction:** A category is **Projectible** if we can make predictions with it. All three teams made predictions. But only one (maybe) captures the *causal structure*.
  *   **Instructor Note:** "The activity shows that *demographic labels* (born 1997-2012) are arbitrary boundaries. But a *historical cohort* (people shaped by the same events) might be real. The statistical problem hides the ontological question."

  **Phase 3: The Sociologist's Objection (10 mins)**
  *   **Prompt:** "A sociologist colleague says: 'This is a parlor trick. With more data waves, or external information (like a major war in 2015), we can break the lock. Cohort effects are measurable.'"
  *   **Response:** "They are right. The 'Identification Problem' is a logical limit of *this specific table*. In the real world, we break the lock with theory. We assume wars affect everyone (Period) but not childhood socialization (Cohort)."
  *   **Takeaway:** "The danger isn't that we can't know. The danger is claiming the *data alone* told you the answer. When someone says 'The data shows Gen Z is anxious,' ask: 'What assumption did you make to separate them from just being young?'"

  ---

  ## 3. Troubleshooting & Predictable Failures

  **Failure 1: "It's All Made Up" (Cynicism)**
  *   **Symptom:** Students dismiss the activity because the numbers are invented. "Real data has noise, this is too clean."
  *   **Fix:** Acknowledge this immediately in the debrief. "Real data is messier, which makes the problem *worse*, not better. Noise allows you to fit *more* stories, not fewer. The clean numbers here just make the structural lock visible."
  *   **Prevention:** Emphasize in the intro: "We use clean numbers to isolate the logical structure, like a physics problem without friction."

  **Failure 2: The "Smart Student" Spoiler**
  *   **Symptom:** One student knows APC analysis and announces "It's the identification problem!" in minute 10.
  *   **Fix:** Have a "Consultant NDA" rule. "If you recognize the structure, your role is to play the protocol faithfully, not to solve the meta-puzzle. If you spoil the reveal, your team forfeits points."
  *   **Mitigation:** The Protocol Cards are specific enough that even knowing the APC problem, they must follow the *card's* constraint to complete the task.

  **Failure 3: Math Anxiety**
  *   **Symptom:** Students get stuck calculating averages and don't reach the conflict phase.
  *   **Fix:** The numbers are chosen for mental math (10, 20, 30). If they stall, circulate and validate partial work. "You see the trend? That's enough. Assign points based on that trend."

  ---

  ## 4. Limitations & Instructor Notes

  **What This Activity Cannot Do:**
  *   It cannot prove social kinds *don't* exist. It only proves they are hard to isolate statistically.
  *   It cannot reproduce the *experience* of living through a historical event (the qualitative reality of a generation).
  *   **Instructor Supply:** You must supply the ontological nuance. The activity shows the *epistemic* gap. You must explain that a gap in knowledge doesn't always mean a gap in reality, but it does mean a gap in *authority*.

  **Where the Design is Most Likely to Fail:**
  *   **The "Cohort" Card:** Team 3 might struggle to calculate cohort effects if they don't understand that Cohort = Year - Age.
  *   **Fix:** The Green Card includes the *Hint*: "People born 1980-89 were 30-39 in 2010 and 40-49 in 2020." This walks them through the tracking without requiring them to derive the formula.

  **Convincing Evidence of Success (Pilot Criteria):**
  *   **Success:** In the presentation phase (00:30), Team 1 and Team 2 argue passionately that the *other* team is ignoring the obvious pattern in the table.
  *   **Failure:** If they say "Well, it's probably a mix of both" immediately. (The Protocol Cards are designed to prevent this by forcing a priority).
  *   **Success:** In the reveal (00:45), there is an audible reaction (laughter or groans) when they see the other cards.
  *   **Failure:** If they shrug. (This means the constraints on the cards weren't strong enough to force divergence).

  **Final Note on the Sociologist Colleague:**
  In the debrief, validate their point. "The Identification Problem is a constraint on *observational* data. Experimental data (impossible here) or strong theoretical priors (e.g., 'biological aging is non-linear') can break the tie. The philosophical lesson is not that we can never know, but that when we claim to know, we are relying on those priors. Make the priors explicit."
