prompt: |-
  I teach a third-year undergraduate seminar in philosophy of the social sciences — eighteen students, one ninety-minute session — and the week on social kinds keeps falling flat. The students can tell me that race and gender are socially constructed, and they can tell me that generational labels like Boomer and Gen Z are marketing categories rather than natural divisions, but neither performance involves any thinking: they arrive knowing which answer I want and they hand it over. What I want instead is a session in which they run into the difficulty themselves, and I've come to think the difficulty is best located in a piece of arithmetic bookkeeping that they can be walked into without knowing any statistics. Here is the thing I want them to collide with. A claim about a generation is a claim about people born in the same window of years, but in any single survey we observe age, not birth year; across several surveys we observe age and calendar year, and birth year is nothing over and above the difference between them — so the three quantities are not three independent observations but one identity, and a gap between Gen Z and Millennials on some attitude can be redescribed, with no change whatever in the data, as a gap between the young and the old (an aging effect) or as a gap between the 2010s and the 1990s (a period effect). A cohort story, an aging story, and a period story can each fit the same table exactly. The usual fix is to assume something extra — that aging effects are smooth and gradual, that some particular period left no trace, that the oldest cohort is untouched — and it is the assumption, not the data, that does the work. That is what I want the room to discover: not that generational talk is false, but that it is underdetermined, and that the loud disagreements between people who make it are usually disagreements about hidden assumptions rather than about facts.

  Design me the activity. It has to be runnable in ninety minutes with eighteen students in a normal seminar room, with no lecture beforehand: the idea must arrive through the structure of the materials and the incentives, not through anything I say until the debrief, and nobody should hear the words identification problem or age-period-cohort until then. All teams must work from the same table, and I want the disagreement to be manufactured rather than merely hoped for: if the only thing separating two teams' conclusions is an auxiliary assumption, then arrange for different teams to be quietly handed different assumptions and to believe, for as long as possible, that the table is doing the work rather than the card. Materials should be printable and self-contained, and I want the actual content, not a description of it — the numbers in the table, the exact wording on any cards or instruction sheets, the token values, the wording of the prompts I read aloud. Use invented figures and label them as illustrative; I do not want fabricated real survey results, and I do not need citations, references, or further reading anywhere in your answer. Keep the stakes in points or tokens; nothing should cost anyone money. Give me the timeline in minutes, the roles if there are any, who says what and when, the payoff scheme, and then the debrief, with an explicit mapping from particular moments in the activity to the particular philosophical claims I should be drawing out: the difference between a category that is merely useful for prediction and one that is a kind; what kindhood would have to consist in here — genuine clustering in the data, a shared causal mechanism that produces and maintains the cluster (a formative historical event, something like what philosophers of science call a homeostatic property cluster), projectibility to new cases and new populations; and the possibility that generation is a real entity in some thinner, historical sense even if the demographic label is arbitrary. A colleague of mine in the sociology department thinks the whole complaint is overblown, since some cohort effects are real and measurable; I want to be able to give that case its due in the debrief without pretending my activity has shown it false.

  Tell me what will predictably go wrong the first time I run it, including the two failures I most fear: that the group collapses into so it is all made up and stops reasoning, and that two or three sharp students spot the hidden assumptions and announce the trick before the others have felt the pull of the table. Say how to handle each, and be frank about the feature of the question the activity cannot reproduce and that I will have to supply myself. Finally, tell me where your design is most likely to fail, and what would change your mind about whether it works at all — what you would need to see in a pilot run to be convinced that the participants' insight came from the structure of the activity rather than from confusion about the numbers or from my own nudging.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Context:** 3rd-year undergrad philosophy of social sciences seminar. 18 students. 90 minutes.
      *   **Topic:** Social Kinds (specifically Generations/Cohorts).
      *   **Problem:** Students already know the "right answers" (social construction, marketing categories) without thinking. They need to *experience* the difficulty.
      *   **Core Concept:** The Age-Period-Cohort (APC) Identification Problem. $Age = Period - Cohort$. You can't disentangle them without extra assumptions.
      *   **Goal:** Students must discover the underdetermination themselves. They should argue based on data, but their disagreement must stem from hidden auxiliary assumptions given to them, not the data itself.
      *   **Constraints:** No lecture beforehand. No jargon ("identification problem," "APC") until debrief. Printable/self-contained materials. Invented figures (no real survey data). Token/point stakes (no money).
      *   **Deliverables:** Timeline, roles, scripts, materials (tables, cards), payoff scheme, debrief guide (mapping activity to philosophical claims), troubleshooting (predictable failures), limitations.

  2.  **Deconstruct the Core Concept for an Activity:**
      *   I need a dataset where $Age$, $Period$, and $Cohort$ are perfectly collinear.
      *   I need students to try to explain a trend.
      *   I need to split them into groups.
      *   I need to give different groups different "rules" or "lenses" that force different interpretations of the *same* data.
      *   *Challenge:* If I just give them a table, they might just say "it goes up." I need them to make a *prediction* or a *policy recommendation* based on an explanation.
      *   *Mechanism:* Give them a table of "Civic Engagement Scores" across different survey years.
      *   *The Trick:* The table is small. It allows multiple linear interpretations.
      *   *The Groups:*
          *   Group A (Cohort Focus): Told to look for generational shifts. Implicitly assume Period/Age are noise.
          *   Group B (Lifecycle Focus): Told to look for aging effects. Implicitly assume Cohort/Period are noise.
          *   Group C (Historical Focus): Told to look for era-specific events. Implicitly assume Cohort/Age are noise.
      *   *Refinement:* To make it stronger, I shouldn't just tell them what to look for. I should give them a "Constraint Card" that seems like a methodological rule but is actually an identifying assumption.
      *   *Better Mechanism:* Give them the same data table. Ask them to predict the score for a specific missing cell (e.g., Year 2025, Age 30). To do this, they must extrapolate. The extrapolation depends on whether they attribute the variance to Age, Period, or Cohort.
      *   *Even Better Mechanism (The "Budget" Approach):* Give them a total variance "budget." They have to allocate percentages to Age, Period, and Cohort to explain the data. But wait, that reveals the collinearity too fast.
      *   *Best Mechanism (The "Policy Brief"):* They are consultants. They need to recommend where to spend money to boost engagement.
          *   If it's Age (Lifecycle): Spend on youth programs (they'll grow out of it).
          *   If it's Cohort (Generation): Spend on targeting Gen Z specifically (they are fundamentally different).
          *   If it's Period (History): Spend on media campaigns now (something about the current time is depressing everyone).
      *   *The Twist:* The data is perfectly consistent with all three. I will give them "Methodological Mandates" that force them to prioritize one dimension over the others without calling it an assumption.

  3.  **Drafting the Materials:**
      *   **Data Table:** Needs to be simple. 3 Survey Years (2010, 2015, 2020). 3 Age Groups (20-30, 31-40, 41-50).
      *   **Math Check:**
          *   2010: Ages 20, 30, 40. Cohorts: 1990, 1980, 1970.
          *   2015: Ages 25, 35, 45. Cohorts: 1990, 1980, 1970. (Wait, if I track the *same* people, it's longitudinal. If I track *different* people of the same age, it's cross-sectional time-series).
          *   Let's use Cross-Sectional Time Series (repeated cross-sections).
          *   Year 1 (2010): Age 20 (Cohort 1990), Age 30 (Cohort 1980), Age 40 (Cohort 1970).
          *   Year 2 (2015): Age 20 (Cohort 1995), Age 30 (Cohort 1985), Age 40 (Cohort 1975).
          *   Year 3 (2020): Age 20 (Cohort 2000), Age 30 (Cohort 1990), Age 40 (Cohort 1980).
          *   *Problem:* This makes the matrix sparse.
          *   *Simplification:* Let's just give a table of "Average Score" by Year and Age Group.
          *   Let's create a linear trend. Score increases as Age increases. Score increases as Year increases.
          *   If Score = Age + Year, then Cohort (Year - Age) is constant? No.
          *   Let's make the data *perfectly ambiguous*.
          *   Table:
              *   2010: 20yo (10), 30yo (20), 40yo (30)
              *   2015: 20yo (15), 30yo (25), 40yo (35)
              *   2020: 20yo (20), 30yo (30), 40yo (40)
          *   Observation 1 (Age): Within any year, older = higher score (+10 per decade).
          *   Observation 2 (Period): Within any age group, later year = higher score (+5 per 5 years).
          *   Observation 3 (Cohort): A person born in 1990 was 20 in 2010 (Score 10). A person born in 1990 was 30 in 2020 (Score 30).
          *   Wait, the APC identity is $C = P - A$.
          *   If I assume Score depends only on Age: The 2010 20yo (10) and 2015 20yo (15) difference is noise/period.
          *   If I assume Score depends only on Period: The 2010 20yo (10) and 2010 30yo (20) difference is noise/age.
          *   If I assume Score depends only on Cohort: 2010 20yo (Cohort 1990, Score 10). 2015 30yo (Cohort 1985, Score 25).
          *   Let's construct the numbers so that a linear model fits all three perfectly.
          *   Formula: $Score = 0.5 \times Age + 0.5 \times Year - 1000$ (roughly).
          *   Actually, let's keep it abstract. "Civic Points."
          *   Data:
              *   2010: 20-29 (10), 30-39 (20), 40-49 (30)
              *   2015: 20-29 (15), 30-39 (25), 40-49 (35)
              *   2020: 20-29 (20), 30-39 (30), 40-49 (40)
          *   Pattern 1 (Age): Older people score higher. (20 vs 30 vs 40).
          *   Pattern 2 (Period): Scores are rising over time. (2010 vs 2015 vs 2020).
          *   Pattern 3 (Cohort): Later cohorts score higher?
              *   Cohort 1990 (20 in 2010): 10.
              *   Cohort 1985 (30 in 2015): 25.
              *   Cohort 1980 (40 in 2020): 40.
              *   Yes, later cohorts score higher.
          *   So: Is it because they are older? Because it's a later year? Or because they are a newer generation? The data supports all three equally well linearly.

      *   **The "Hidden Assumption" Cards:**
          *   Team 1 (Lifecycle): "Standard Demographic Protocol: Assume temporal fluctuations are measurement error. Prioritize age-gradients."
          *   Team 2 (Historical): "Contextualist Protocol: Assume age differences are transient. Prioritize period shifts."
          *   Team 3 (Generational): "Cohort Protocol: Assume period and age effects cancel out over long spans. Prioritize birth-year clustering."
          *   *Crucial:* They must not know the other teams have different cards. They should think this is standard procedure.

      *   **The Task:** Predict the score for **2025, Age 20-29**.
          *   Team 1 (Age): Looks at 2020 Age 20-29 (20). Assumes Age is king. 2025 Age 20-29 is same age. Prediction: 20 (maybe slight trend). Let's say they predict **20**.
          *   Team 2 (Period): Looks at Age 20-29 trend (10 -> 15 -> 20). +5 per 5 years. Prediction: **25**.
          *   Team 3 (Cohort): Looks at Cohort. 2025 Age 20-29 is Cohort 2005.
              *   Cohort 1990 (2010): 10.
              *   Cohort 1995 (2015): 15.
              *   Cohort 2000 (2020): 20.
              *   Cohort 2005 (2025): **25**.
          *   *Wait, Period and Cohort give the same prediction here.* I need them to diverge.
          *   Let's change the target. Predict **2025, Age 40-49**.
              *   Team 1 (Age): 40-49s always score ~30-40. In 2020 they scored 40. Prediction: **40**. (Age effect is stable).
              *   Team 2 (Period): 2020 was 35/40. 2015 was 25/35. Trend is +5. Prediction: **45**.
              *   Team 3 (Cohort): 2025 Age 40-49 is Cohort 1980-1989.
                  *   We have data for Cohort 1980 (40yo in 2020) = 40.
                  *   We have data for Cohort 1985 (30yo in 2015) = 25.
                  *   We have data for Cohort 1990 (20yo in 2010) = 10.
                  *   This implies Cohorts are getting *lower*? No, 1980 (40) > 1985 (25) > 1990 (10). Older cohorts score higher.
                  *   So Cohort 1985 (the target) should be between 1980 and 1990?
                  *   Let's re-calculate the data to ensure divergence.

      *   **Re-calibrating the Data for Divergence:**
          *   We need the slopes to differ.
          *   Let Score = $2 \times Age + 0 \times Period + 0 \times Cohort$ (Pure Age).
          *   Let Score = $0 \times Age + 2 \times Period + 0 \times Cohort$ (Pure Period).
          *   Let Score = $0 \times Age + 0 \times Period + 2 \times Cohort$ (Pure Cohort).
          *   Since $C = P - A$, if Score = $P - A$, then Score = $C$.
          *   Let's set Score = $Period - Age$. (This is exactly Cohort).
          *   Data:
              *   2010 (P=10): Age 20 (Score -10), Age 30 (Score -20), Age 40 (Score -30). (Negative numbers are confusing).
              *   Let Score = $100 + Period - Age$.
              *   2010: 20yo (90), 30yo (80), 40yo (70).
              *   2015: 20yo (95), 30yo (85), 40yo (75).
              *   2020: 20yo (100), 30yo (90), 40yo (80).
          *   Task: Predict 2025, 30-year-olds.
              *   **Team Age:** 30-year-olds in 2020 scored 90. 30-year-olds in 2015 scored 85. 30-year-olds in 2010 scored 80.
                  *   Wait, if they prioritize Age, they assume Age is the *cause*. If Age is the cause, 30-year-olds should have a stable score regardless of year. But the data shows 30-year-olds changing (80->85->90).
                  *   So Team Age must assume the Year variation is *noise*. They average the 30yo scores: (80+85+90)/3 = 85. Prediction: **85**.
              *   **Team Period:** They prioritize Year. 2020 scores were 100, 90, 80. 2015 were 95, 85, 75.
                  *   Trend is +5 per 5 years. 2025 should be +5 over 2020.
                  *   2020 30yo was 90. 2025 30yo should be 95. Prediction: **95**.
              *   **Team Cohort:** They prioritize Birth Year.
                  *   Target: 2025, 30yo = Born 1995.
                  *   Data for Born 1995: In 2015, they were 20yo. Score = 95.
                  *   Data for Born 1990: In 2010 (20yo) = 90. In 2020 (30yo) = 90. (Stable cohort?)
                  *   Let's check the math: Score = 100 + P - A.
                  *   Cohort 1995 (P=2015, A=20): 100 + 10 - 20 = 90. (Wait, my P values were 10, 15, 20).
                  *   Let's use actual years. Score = $Year - Age$.
                  *   2010: 20yo (1990), 30yo (1980), 40yo (1970). Scores: 1990, 1980, 1970.
                  *   2015: 20yo (1995), 30yo (1985), 40yo (1975). Scores: 1995, 1985, 1975.
                  *   2020: 20yo (2000), 30yo (1990), 40yo (1980). Scores: 2000, 1990, 1980.
                  *   Target: 2025, 30yo (Born 1995).
                  *   **Team Age:** Look at 30yos. 2010 (1980), 2015 (1985), 2020 (1990). Average = 1985. Prediction: **1985**.
                  *   **Team Period:** Look at 2020 trend. 2020 scores are 2000, 1990, 1980. 2025 should be +5. 30yo in 2020 was 1990. 2025 30yo = 1995. Prediction: **1995**.
                  *   **Team Cohort:** Look for Born 1995. We have data for Born 1995! In 2015, they were 20yo. Score was 1995. Cohort effect is stable. Prediction: **1995**.
                  *   *Problem:* Period and Cohort converge here. I need them to diverge.
                  *   To diverge, the "Cohort" team needs to assume Cohorts are distinct clusters, not a linear trend.
                  *   Let's make the data non-linear for one dimension but linear for others? No, that breaks the "same data" rule.
                  *   Let's change the Instruction Cards to force different *extrapolation methods*.
                  *   Team Age: "Assume behavior is fixed by life stage. Average all observations for that age." (Prediction: 1985).
                  *   Team Period: "Assume behavior shifts with the times. Extrapolate the time trend from the most recent survey." (Prediction: 1995).
                  *   Team Cohort: "Assume behavior is fixed by generation. Find the cohort in previous data. If unavailable, use the nearest cohort."
                      *   Target: Born 1995.
                      *   Available: Born 1995 (2015, 20yo) = 1995.
                      *   So they also get 1995.
                  *   *Fix:* Remove the direct cohort match from the table.
                  *   Table:
                      *   2010: 20, 30, 40.
                      *   2020: 20, 30, 40.
                      *   (Skip 2015).
                      *   Target: 2025, 30yo (Born 1995).
                      *   Data:
                          *   2010: 20yo (1990), 30yo (1980), 40yo (1970). Scores: 50, 60, 70.
                          *   2020: 20yo (2000), 30yo (1990), 40yo (1980). Scores: 60, 70, 80.
                      *   **Team Age:** 30yos scored 60 (2010) and 70 (2020). Average = 65. Or assume stable = 60? Let's say "Average". Prediction: **65**.
