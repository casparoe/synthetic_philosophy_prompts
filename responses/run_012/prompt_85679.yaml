      *   *Debrief Mapping:*
          *   Activity Moment: Different allocations. -> Claim: Underdetermination.
          *   Activity Moment: Protocol Cards. -> Claim: Auxiliary Assumptions.
          *   Activity Moment: "Which is real?" -> Claim: HPC vs. Arbitrary Classification.

      *   *Let's write it.*
