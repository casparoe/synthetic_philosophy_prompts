      *   **10-35 min:** Team Work. Calculate and allocate tokens.
      *   **35-50 min:** Presentations. Each team states their allocation. (Conflict arises).
      *   **50-60 min:** The Reveal. Swap cards. Realize the protocol differed.
      *   **60-90 min:** Debrief/Discussion. Connect to Social Kinds.

