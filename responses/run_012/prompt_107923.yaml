  | Requirement (one line) | The case or consideration that forces it | Genuine requirement or camp preference (and whose) | What it rules out | Tradeable (yes/no) |
  | :--- | :--- | :--- | :--- | :--- |
  | Must distinguish lock-in from mere persistence. | Cases where a technology lasts simply because it works, not because switching is hard. | Genuine requirement. | Claims that "old = path dependent." | No |
  | Must allow for efficient lock-in (winner is fine). | Cases where the dominant standard is arguably superior or neutral (e.g., VHS vs. Betamax). | Camp preference (Efficiency theorists). | The claim that path dependence *requires* inefficiency. | Yes |
  | Must account for convergence (independent solutions). | Cases where different societies invent the same thing separately (e.g., agriculture, calculus). | Genuine requirement. | Claims that all historical outcomes are path dependent. | No |
  | Must specify the branching point (contingency). | Cases where the "accident" is vague or retroactively invented. | Genuine requirement. | Narratives where the outcome was inevitable all along. | No |
  | Must define the mechanism of retention (switching costs). | Cases where no physical or economic barrier to change exists. | Genuine requirement. | Claims based purely on "habit" without cost structure. | No |
  | Must allow for degrees of dependence (more/less). | Cases where some systems are stickier than others (e.g., language vs. fashion). | Genuine requirement. | Binary views (either locked or not). | No |
  | Must specify the viable counterfactual. | Cases where the alternative is imagined but was never technically possible. | Camp preference (Historical institutionalists). | Claims where the "road not taken" is fantasy. | Yes |

  ### Evaluation of Your Distinctions
  1.  **"Stuck" vs. "Late":** This is excellent. "Stuck" describes hysteresis (history matters because exit is costly); "Late" describes convergence (history doesn't matter because attractors are strong). A theory must separate these or it explains everything and nothing.
  2.  **Fact vs. Explanation:** This is the core ontological tension. It is a fact about the world (switching costs exist), but identifying it is an act of explanation (claiming the alternative was viable). You are not confused; this is the field's central friction.
  3.  **Contingent vs. Live Options:** These come apart. An event can be contingent (a dice roll) but have only one live option (survival vs. death). Or there can be many live options, but the choice was determined by structural force. Path dependence requires *both*: multiple live options *and* a contingent selection mechanism.

  ### Unsatisfiable Pair
  **Empirical verification of the counterfactual** vs. **Historical uniqueness of the event.** You cannot empirically verify the viability of the path not taken (because it wasn't taken) while simultaneously insisting the event was unique and unrepeatable. You must either model the alternative (theory) or admit you cannot prove it (history). Demanding both kills the theory.

  ### Single Most Restrictive Requirement
  **Must specify the viable counterfactual.** This rules out the most popular answers because most claims of path dependence rely on a vague sense that "things could have been different" without demonstrating that the alternative was actually feasible, sustainable, and accessible at the branching point.

  ### Ontology: World or Story?
  Your suspicion is half-right. Path dependence is a real property of systems with **hysteresis** (where the state of the system depends on its history, like a magnet or a rutted road); that part is physical and measurable. However, labeling a specific historical outcome as "path dependent" is mostly storytelling because it relies on unobserved counterfactuals. We can measure the switching costs (the world), but we cannot measure the viability of the unchosen path (the story). So it is a real dynamic described through unavoidable speculation.
