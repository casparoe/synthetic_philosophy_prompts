answer: |-
  This is a delightful puzzle of genre ontology. Your judge is not applying the industry standard definition of a novel (fictional narrative prose of X length), nor is she applying a purely aesthetic one (good writing). She is applying a philosophical definition.

  Here are the three rules that fit her four-year record, the prediction each yields for your current entry, and an analysis of the "family resemblance" problem.

  ### Rule 1: The "Acknowledged Artifice" Rule
  **The Logic:** A novel is a constructed object that admits it is a construction. Truth claims disqualify a text; structural unity qualifies it.
  *   **Fits the Yeses:** The *novel in verse* admits it is shaped; the *ephemera collage* admits it is assembled; the *graphic novel* admits it is drawn; the *phantom translation* is the smoking gun—it is an open lie, a construction of a construction.
  *   **Fits the Nos:** The *memoir* and *diary* claim to be real life (denying artifice). The *linked stories* and *prose poems* claim to be collections or fragments (denying structural unity).
  *   **Prediction for Current Entry:** **NO.**
      *   **Why:** Although it has narrative unity (one voice, one story), it is packaged as a memoir with a "true story" subtitle. The author refuses the word "novel." Under this rule, a book that claims to be truth cannot be a novel, regardless of whether it is invented. The diary rejection confirms this: even when readers *felt* it was a novel, the claim of reality disqualified it.

  ### Rule 2: The "Authorial Designation" Rule
  **The Logic:** The judge defers to the author/publisher's intent. If the creator frames it as a novel (or a form universally accepted as a novel-equivalent like graphic novels), it is in. If they frame it as anything else, it is out.
  *   **Fits the Yeses:** All were published/categorized as novels or novel-equivalents. (Even the phantom translation implies a novelistic origin).
  *   **Fits the Nos:** *Linked stories* are categorized as stories; *prose poems* as poems; *memoir/diary* as non-fiction.
  *   **Prediction for Current Entry:** **NO.**
      *   **Why:** The publisher is bringing it out as a memoir. The author refuses to say "novel." The label on the spine overrides the content inside.

  ### Rule 3: The "Narrative Singularity" Rule
  **The Logic:** A novel requires a single, continuous narrative consciousness. Fragmentation disqualifies; factual basis does not matter.
  *   **Fits the Yeses:** *Verse novel, ephemera, graphic novel, translation* all presumably offer a single narrative arc or unified voice.
  *   **Fits the Nos:** *Linked stories* (multiple arcs); *prose poems* (fragmented lyric moments); *diary* (arguably fragmented by date, though this is the weak point of this rule).
  *   **Prediction for Current Entry:** **YES.**
      *   **Why:** It is a 400-page first-person narrative, one voice, continuous story. The "memoir" label is just marketing; the *structure* is novelistic. The judge might overrule the subtitle to reward the narrative unity.

  ***

  ### The Bet
  I would bet heavily on **Rule 1 (Acknowledged Artifice)**.

  **Why:** The "phantom translation" is the key. If the judge cared about factual truth, a book whose original doesn't exist should be disqualified as a fraud. If she cared about Authorial Designation (Rule 2), a translation is usually designated as a translation, not a novel, yet she accepted it. If she cared only about Narrative Singularity (Rule 3), the diary should have been a strong contender (diaries often have a strong voice), yet she rejected it even when group members argued it read like a novel.

  The judge is a poet. Poets tend to view the "novel" not as a container for lies (fiction) vs. truth (memoir), but as a specific kind of *making*. The diary and the memoir were rejected because they claimed to be *found*, not *made*. The current entry claims to be *found* (a true story), even though it is *made* (invented). The judge values the honest lie (the phantom translation) over the dishonest truth (the invented memoir).

  **Verdict:** She will not take it. She will likely argue that by refusing the word "novel," the author has forfeited the prize.

  ***

  ### The Separating Entry
  To distinguish Rule 1 (Artifice) from Rule 2 (Designation), you need a book where the label and the ontological status conflict in the opposite direction of the current entry.

  **The Entry:** A verbatim transcript of a criminal trial, 400 pages, no editing.
  **The Label:** The publisher markets it explicitly as a **"Novel."** The cover says "A Novel." The author introduces it as "A work of fiction" (legally defensible because court transcripts are dramatic reconstructions).

  *   **Rule 1 (Artifice) predicts NO:** It is not constructed; it is raw data. It lacks the "made" quality of the ephemera or verse.
  *   **Rule 2 (Designation) predicts YES:** It is labeled a novel.
  *   **Rule 3 (Singularity) predicts NO:** It has multiple voices, no central narrator.

  If she accepts the Transcript-Novel, she is following Rule 2 (Label). If she rejects it, she is following Rule 1 (Artifice).

  ***

  ### On Family Resemblance
  Your group member is quoting Wittgenstein, likely to suggest that "novel" is a slippery concept with no essential core, implying the judge is just applying subjective taste disguised as philosophy.

  **Is she running Family Resemblance?**
  Yes, but your friend is misunderstanding what that means. Wittgenstein did not say "anything goes." He said there is no *single* thread running through all games (or novels), but rather a network of overlapping similarities.
  *   *Novel in Verse* shares "poetic language" with *Prose Poems* (Rejected).
  *   *Novel in Verse* shares "narrative length" with *Memoir* (Rejected).
  *   *Graphic Novel* shares "visuals" with *Timetable* (Accepted).

  The judge is mapping the "family." She has identified that the "Novel" gene in this family is **Unified Construction.**
  *   The *Linked Stories* lack the "Unity" gene.
  *   The *Memoir* lacks the "Construction" gene (it claims to be Nature).
  *   The *Phantom Translation* has both Unity and Construction (it is a unified lie).

  **Does she have a boundary?**
  Absolutely. Family Resemblance does not mean "no boundary." It means the boundary is drawn by usage, not by a dictionary definition. Her boundary is clear: **If you claim this is real life, it is not a novel.** If you claim this is a collection of parts, it is not a novel.

  **Is it just taste with better manners?**
  No. Taste would reject the *Graphic Novel* because she is a poet (presumably text-focused). Taste would reject the *600 pages of invoices* as boring. The fact that she accepts difficult, experimental, non-traditional forms (verse, graphics, collage) but rejects traditional forms (memoir, linked stories) proves she is not judging on *pleasure* or *tradition*. She is judging on **category integrity.**

  She is protecting the word "Novel" from being used as a marketing term for "Long True Story." She is willing to stretch the word to include "Long Lie in Pictures" or "Long Lie in Verse," but she will not let it cover "Truth." That is a rigorous philosophical boundary, not mere taste.
