answer: |-
  **Memorandum to the Chair**

  Your taxonomy is sound. Distinguishing between large bounded impacts and unbounded claims is not merely a technical fix; it is a governance necessity. The third category (unbounded payoff) does not just increase the sum; it breaks the ledger. Your 'switching probability' intuition is also correct, provided it is applied only after establishing that the outcomes are comparable. Where it misses is in assuming commensurability; before we ask about probabilities, we must agree on whether the benefits are of the same kind.

  Below is a procedure designed for your constraints: four trustees, consensus required, two hours, and a legal duty to demonstrate public benefit. It is not an algorithm for finding the 'right' answer, but a mechanism for locating exactly where disagreement lies—whether in fact, value, or law—so that you can publish a rationale that withstands scrutiny from the family and the Charity Commission.

  ### The Procedure

  **Step 1: The Legal & Constitutional Gate**
  *Question:* Does this proposal benefit existing persons within the charity's defined purposes, such that the benefit constitutes 'public benefit' under current legal advice?
  *Competence:* All trustees (guided by solicitor's advice).
  *Sufficient Answer:* A clear 'Yes' supported by reference to existing beneficiaries.
  *Failure Mode:* If the benefit relies primarily on people who do not yet exist, the proposal stops here. This is not a value judgement; it is a compliance constraint.
  *Action:* If 'No', reject. If 'Yes', proceed.

  **Step 2: The Infinity Check**
  *Question:* Does the proposal's expected value rely on a payoff that is unbounded, infinite, or contingent on the existence of an indefinite number of future lives?
  *Competence:* All trustees (Chair to facilitate).
  *Sufficient Answer:* A consensus on whether the claim is bounded (e.g., 'saving 100 million lives') or unbounded (e.g., 'securing the trajectory of civilisation for millennia').
  *Action:* If 'Unbounded', the procedure stops. The arithmetic degenerates. The committee must decide whether to accept such claims as a matter of pure policy, outside of expected value reasoning. Given your solicitor's warning and the need for defensibility, the default recommendation is to treat this as a 'No'.
  *Note:* This forces the value judgement into the open. You are not saying the math is wrong; you are saying the math is inapplicable.

  **Step 3: Value Equivalence**
  *Question:* Are the outcomes of this proposal commensurable with our current portfolio (e.g., literacy, local welfare), such that we can meaningfully compare them?
  *Competence:* All trustees.
  *Sufficient Answer:* Agreement on a conversion rate (e.g., 'One life saved is worth X literacy graduations') or an admission that they are incommensurable.
  *Action:* If incommensurable, you cannot use expected value to decide. You must vote based on mission alignment. If commensurable, proceed to Step 4.

  **Step 4: The Switching Probability Test (Robustness Check)**
  *Question:* Taking the best conventional alternative on our list as the baseline, what probability of success would this proposal need to have to match it? (The Switching Point). Does this threshold lie outside the range of probability the proposer can reasonably defend?
  *Competence:* Chair (to calculate), Proposer (to defend range), Trustees (to assess reasonableness).
  *Sufficient Answer:* The Switching Point must lie *below* the bottom of the proposer's defended probability range.
  *Action:* If the Switching Point lies *within* the proposer's uncertainty range, the decision is hostage to empirical guesswork. Reject on grounds of uncertainty. If the Switching Point lies well below the defended range, the proposal survives the empirical test.

  **Step 5: The Consensus Declaration**
  *Question:* Given the above, is there any trustee who objects on grounds of value (Step 3) rather than fact (Step 4)?
  *Competence:* All trustees.
  *Action:* If objection is factual, refer back to Step 4. If objection is valuative, record it. Consensus requires that valuative objections are resolved through discussion or withdrawal. If unresolved, the proposal fails the consensus rule.

  ---

  ### Application to Cases

  **Case 1: The Pandemic Outfit**
  *   **Step 1 (Legal):** They argue for averting a catastrophe affecting humanity. This includes existing people. Pass, but borderline depending on solicitor's view of 'prevention' vs. 'cure'.
  *   **Step 2 (Infinity):** They claim to avert a catastrophe that could end civilisation. This implies securing the future for potential generations. This triggers the **Infinity Check**.
      *   *Decision:* If you classify 'future generations' as unbounded lives, the procedure stops here. You cannot compare 1/200,000 of infinity against 100% of a literacy programme.
      *   *Recommendation:* Flag this as unbounded. Unless the committee explicitly adopts a long-termist mandate (which may conflict with the solicitor's advice on public benefit), this proposal fails Step 2.
      *   *Alternative:* If you bound the impact to 'currently living people only' (e.g., 100 million lives), it proceeds to Step 3.
  *   **Step 3 (Value):** Is saving a life commensurable with literacy? The committee must agree on a ratio. If you cannot agree, you cannot use EV.
  *   **Step 4 (Switching):** Assume you bound the lives at 100 million. The EV is huge. The Switching Point will be incredibly low (e.g., 1 in 10 million). The proposers claim 1 in 200,000. The threshold is below their defended range.
      *   *Result:* Mathematically, it wins. But because it passed Step 2 only by artificially capping the lives, the victory is fragile.
      *   *Verdict:* The procedure recommends rejection at Step 2 unless you are willing to defend counting future lives against your solicitor's advice.

  **Case 2: The Literacy Programme**
  *   **Step 1 (Legal):** Benefits existing children. Clear public benefit. Pass.
  *   **Step 2 (Infinity):** Bounded impact (number of children known). Pass.
  *   **Step 3 (Value):** Commensurable with foundation history. Pass.
  *   **Step 4 (Switching):** High probability of modest impact. Switching point against itself is trivial.
  *   **Step 5 (Consensus):** No valuative objections noted historically.
  *   *Verdict:* Survives all steps. It is the 'baseline' against which others are measured.

  **Case 3: The Long-Term Future Argument**
  *   **Step 1 (Legal):** Applicant argues for influencing the long-run future.
  *   **Step 2 (Infinity):** Explicitly claims value derives from the enormous number of future lives.
      *   *Decision:* **Stop.** This is the exact degenerate case. The expected value is undefined because the payoff is unbounded.
      *   *Action:* The procedure hands the decision back to you as a value judgement, but flags the legal risk. You cannot use arithmetic here. You must decide: 'Do we fund potential people?'
      *   *Solicitor Constraint:* Your solicitor has warned that non-existent people may not count for public benefit. The procedure flags this immediately. If you fund this, you are making a policy exception that requires a documented rationale for the family and the regulator.
      *   *Verdict:* Procedure says 'No' by default due to Step 2 and Step 1 constraints. To fund this, you must override the procedure explicitly, recording that you are prioritising speculative future value over legal caution and bounded arithmetic.

  ---

  ### Failure Modes and Limitations

  You asked for honesty about where this procedure fails. It does not solve the following:

  1.  **The Value Lock:** Step 3 requires trustees to agree on the worth of a life versus literacy. If one trustee believes literacy is sacred and another believes survival is paramount, the procedure cannot reconcile this. It only identifies that the disagreement is valuative, not empirical. This forces you to talk about morals, not math.
  2.  **The Boundary Problem:** In Case 1, distinguishing between 'bounded catastrophe' (100m lives) and 'unbounded extinction' (all future lives) is semantic. A clever proposer can frame extinction as 'saving 100m people now' to bypass Step 2. The trustees must remain vigilant against framing tricks.
  3.  **The Consensus Trap:** Because you require consensus, a single trustee who refuses to accept the Value Equivalence (Step 3) can veto any high-impact proposal. This is a feature, not a bug, for a family foundation, but it means you will likely drift towards the lowest common denominator of risk (the literacy programme).
  4.  **Legal Uncertainty:** The procedure treats the solicitor's advice as a hard stop. If the law on future generations evolves, or if your solicitor is overly cautious, the procedure will systematically exclude long-termist causes. You are buying legal safety at the cost of potential impact.

  ### Conclusion

  Your instinct to treat the unbounded case as a stopping point is correct. It protects the committee from Pascal's Mugging. The 'switching probability' test is a robust way to handle empirical uncertainty, provided you do not use it to mask value disagreements.

  You will not make a fool of yourself or your aunt by using this. You will make a fool of yourself if you attempt to calculate the expected value of infinity. This procedure ensures that when you reject a high-EV proposal, you can publish a rationale stating: *'We rejected this not because the math was wrong, but because the inputs relied on unbounded claims regarding non-existent persons, which falls outside our legal mandate and governance capacity.'* That is defensible.

  Expect the procedure to favour the literacy programme. This is not a failure of the math; it is a consequence of your constraints (consensus, legal caution, bounded time). If you wish to fund the pandemic outfit, you must do so by explicitly overriding Step 2, recording that you are accepting a legal grey area and a value judgement that survival trumps all other goods. Do not hide that choice behind arithmetic.
