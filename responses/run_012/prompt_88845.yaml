      *   *Switching Probability:* Ask the proposer for the probability threshold where their project loses to the best alternative. Compare this to their defended probability range.
      *   *Critique:* It's a good heuristic for sensitivity analysis. However, it assumes commensurability (same units). The user acknowledges this. The fix is to separate *empirical* claims (probabilities) from *valuative* claims (worth of a life vs. worth of literacy). The procedure needs to isolate where the disagreement lies.
      *   *Repair:* The "switching probability" works well for empirical uncertainty. For value incommensurability, we need a "Value Equivalence" step before the probability test.

  3.  **Drafting the Procedure:**
