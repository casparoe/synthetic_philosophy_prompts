      *   3. Test: It's circular unless you define content narrowly. SDT helps ($d'$ vs $\beta$).
      *   4. Strongest Objection: Phenomenology. If it feels different, content changed.
      *   5. Verdict: Interesting, saves Modularity, but risks triviality.

      *(Self-Correction during drafting)*: Wait, if Gain changes, does Fodor care? Fodor's modularity is about *informational encapsulation*. If cognition changes the gain, that implies information flow from cognition to the module. So Gain Penetration *is* a violation of strict Fodorian encapsulation, even if content doesn't change. The user claims it saves encapsulation. I need to challenge that. If the module's output weighting is controlled by cognition, the module isn't encapsulated.

      *Revised Point on Modularity:* The user says "A Fodor-style module can be right about content and still sit in a system that reweights its output." Technically, Fodor allows input systems to be modulated by attention (maybe). But if *beliefs* modulate the gain, that's top-down. It still violates the spirit of encapsulation (cognitive impenetrability). I need to point this out. The "save" might not work.

