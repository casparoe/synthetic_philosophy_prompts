answer: |-
  **Project Title:** The Selectivity Problem: Distinguishing Normative Enforcement from Pragmatic Convergence in the Material Record

  **Principal Investigator:** [Your Name], PhD Candidate (Year 2)
  **Duration:** 6 Months
  **Request:** Internal Pilot Grant (Time Buy-out)

  **Project Summary**
  Archaeological inference often relies on a specific logical move: we observe a material pattern (e.g., standardized pottery, ranked burials) and infer a social cause (e.g., shared norms, hierarchical enforcement). This proposal identifies a structural weakness in this inference. It mirrors the "reverse inference" problem in neuroimaging: observing a signature and assuming a specific cognitive cause, without checking if other causes produce the same signature. My central question is determinate and testable within six months: *For which classes of material evidence does a signature raise the probability of "collectively enforced norm" significantly more than it raises the probability of "pragmatic convergence" (raw material constraints, labor costs, drift)?*

  I argue that current methodological literature leaves this open. Debates about objectivity or middle-range theory generally ask whether a process *can* produce a pattern. They rarely ask whether that process is the *only* or *most likely* producer compared to rival "boring" explanations. This project will not relitigate general objectivity. Instead, I will treat archaeological inference as a problem of selectivity. I will assess whether specific material signatures are selectively predictive of enforcement or merely consistent with it.

  **Methodology**
  I will conduct a comparative logical analysis of three to four concrete signature types commonly used to infer social norms. Potential candidates include ceramic standardization, restricted access to raw materials, and mortuary ranking. For each signature, I will:
  1.  Formalize the standard inference (Signature $S$ → Norm $N$).
  2.  Generate rival hypotheses ($H_{riv}$) based on pragmatic convergence (e.g., $S$ is caused by geological scarcity rather than sanctioning).
  3.  Assess selectivity: Does $P(S|N)$ substantially exceed $P(S|H_{riv})$?

  I will not employ formal Bayesian mathematics in this pilot. Instead, I will use qualitative likelihood assessment. This is sufficient for a pilot because the primary goal is conceptual clarification: identifying where the logical gaps are before attempting quantitative modeling. Formalizing the probabilities requires parameters we do not yet have; this project establishes which signatures are worth modeling.

  **Work Plan (6 Months)**
  *   **Month 1:** Finalize the three signature types. Draft the logical structure for the "Norm" vs. "Pragmatic" rivalries for each.
  *   **Month 2-3:** Deep dive into Case 1 and Case 2. Map the generative processes. Identify where the material traces overlap (non-selective) and where they diverge (selective).
  *   **Month 4:** Deep dive into Case 3. Begin drafting the comparative table.
  *   **Month 5:** Synthesis. Determine which signatures are identifiable and which are non-identifiable given current recording practices.
  *   **Month 6:** Final write-up. Production of the "Selectivity Table" and policy recommendations for inference claims.

  **Why This Approach?**
  The obvious alternative is another empirical case study (e.g., "Norms in Neolithic Thessaly"). However, a single case study cannot solve a methodological problem about inference itself. If I study one region, I cannot tell if the inference failed because the theory is wrong or because the local data is messy. By comparing signature *types* across contexts, I isolate the logical structure of the inference. My hunch is that selectivity is a property of the signature class, not just the specific site. This project tests that hunch. If successful, it provides a tool applicable across regions, not just a historical narrative of one.

  **Expected Outcomes**
  The primary output will be a "Selectivity Table" listing:
  *   Signature Type
  *   Rival Hypotheses
  *   Differential Predictions (Yes/No)
  *   Verdict (Identifiable / Non-Identifiable)

  I aim to provide a defensible verdict on at least two signature types. For example, I may conclude that ceramic standardization is non-identifiable (equally predicted by guild enforcement and raw material consistency), while restricted access to exotic goods is selectively predictive of enforcement.

  **Risk and Failure Conditions**
  There is a genuine risk that every candidate signature turns out to be equally predicted by "boring" explanations. If this happens, the result is negative regarding the specific hypotheses, but positive for the discipline. It would demonstrate that certain classes of social inference are currently non-identifiable from material evidence alone. This is a crucial boundary condition. To ensure this counts as a contribution rather than a failure to find a good case, I will explicitly frame the output as a "Limitations of Inference" statement. If no signature is selective, the contribution is a warning against current interpretive practices, which is as valuable as validating them.

  **Feasibility and Scope**
  Six months is sufficient for this conceptual work because I am not collecting new data. I am analyzing the logic of existing interpretations. Regarding the qualitative approach: while formal Bayesian machinery would be ideal, it is premature. We lack the prior probabilities required for formal calculation. A qualitative assessment of likelihood ratios is the necessary prerequisite. If this pilot shows that selectivity varies across signature types, it justifies a future grant for formal modeling. If it shows nothing is selective, formal modeling would be a waste of resources. Thus, the qualitative scope is appropriate for a pilot.

  **Conclusion**
  This project bridges archaeology and philosophy of science to tighten the logical links between material traces and social claims. By focusing on selectivity rather than consistency, I aim to replace confident but shaky assertions with precise statements about what the material record can and cannot tell us about enforcement. Whether the result is a validation of current methods or a demonstration of their limits, the outcome will be a more rigorous framework for archaeological inference.
