prompt: |-
  ok so this is a bit of a weird ask but i figure its worth a shot. i'm a backend engineer, no formal philosophy background at all (one ethics elective in college, mostly forgot it), and i got dragged into this low-key reading group at work that's going through Wittgenstein's Philosophical Investigations and then the Kripke book about it that everyone keeps calling "Kripkenstein." we're on the rule-following sections and i'm completely underwater. the translation we're using is old-timey and the sentences are so short and dense that i honestly can't tell if they're contradicting each other on purpose or if i'm just reading them wrong. here's the passage, sections 201 and 202, copied out of the handout:

  §201. "This was our paradox: no course of action could be determined by a rule, because any course of action can be made out to accord with the rule. The answer was: if any action can be made out to accord with the rule, then it can also be made out to conflict with it. And so there would be neither accord nor conflict here.

  It can be seen that there is a misunderstanding here from the mere fact that in the course of our argument we give one interpretation after another; as if each one contented us at least for a moment, until we thought of yet another standing behind it. What this shews is that there is a way of grasping a rule which is not an interpretation, but which is exhibited in what we call "obeying the rule" and "going against it" in actual cases.

  Hence there is an inclination to say: any action according to the rule is an interpretation. But we ought to restrict the term "interpretation" to the substitution of one expression of the rule for another."

  §202. "And hence also "obeying a rule" is a practice. And to think one is obeying a rule is not to obey a rule. Hence it is not possible to obey a rule "privately": otherwise thinking one was obeying a rule would be the same thing as obeying it."

  my question is basically: what is the paradox actually supposed to be, and is the passage asserting it or defusing it? i genuinely can't tell whether wittgenstein is saying "here's a real problem, and it's deep" or "look how silly this problem is, stop doing that." and then the part that's really bugging me is practical. at work we've been moving to property-based testing, where instead of writing example-based tests you state general properties your function has to satisfy and let a generator throw random inputs at it. the whole point is that the properties underdetermine the implementation — tons of different implementations pass. we had a huge argument in code review because someone's implementation passed every single property but was still, everyone agreed, "wrong." somebody in the reading group said that's literally the rule-following paradox, that any behavior can be made to accord with the rule or spec, and that this is why you need "the practice" (the team's judgment, the conventions) and not just the written spec. is that a fair reading of the passage or are they overreading it? two things i can't square: (1) "obeying a rule is a practice" sounds like a fancy way of saying "we all just agree to call it right," which seems like a cop-out that escapes the paradox by definition; and (2) a CPU literally executes its instruction set, there's no interpreting going on, the machine just does what the rule says — so doesn't the existence of computers kind of blow the whole thing up? if the real answer is "the machine follows the rule only relative to us calling its behavior correct," please explain that slowly, because that's exactly the move i don't get. also if you could do it without leaning on the plus/quus example that'd be great, we've beaten that one to death in the group and its stopped being illuminating for me. thanks!
