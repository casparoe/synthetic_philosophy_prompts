answer: |-
  **Brother:** Let's return to the third step. You agree that Special Relativity abolishes a frame-independent present?

  **Nadia:** I agree that simultaneity is relative to inertial frames. If you and I move differently, our slices of "now" through spacetime tilt relative to one another. That is physics.

  **Brother:** And you agree that no frame is privileged? There is no God's-eye view that says your slice is the true present and mine is an illusion?

  **Nadia:** Within the formalism of relativity, no. The laws are invariant.

  **Brother:** Then the conclusion follows. If my present is real, and your present is just as valid as mine, then your present is real. But your present contains events that, in my frame, are in the future. Therefore, my future is already real. If the future is real, the whole manifold exists. The block is not a model; it is the ontology.

  **Nadia:** That is where the swindle lies. You move from "no frame is privileged" to "all events in all frames are equally actual." You assume that existence is a property conferred by membership in a simultaneity slice. But why should I grant that? I can accept the relativity of simultaneity without accepting that future events are *actual* in the same way present events are.

  **Brother:** Then what makes an event actual? If it's not membership in a present slice, what metric are you using? If you say "only my slice is actual," you are claiming a privileged frame. You are positing a preferred foliation of spacetime that physics cannot detect.

  **Nadia:** I am positing that *becoming* is primitive. I am not saying there is a hidden frame; I am saying that existence isn't defined by spacetime geometry alone. You conflate the first claim—the frame-relativity of simultaneity—with the third claim, that there is no objective present. The physics supports the first; it does not entail the third. The map is not the territory. Relativity describes causal structures, not ontological status.

  **Brother:** But if you deny the third claim, you break the symmetry of the laws. You make "now" a physical magnitude that doesn't appear in the equations.

  **Nadia:** I make it a metaphysical primitive. That is the cost. I accept that physics cannot exhaust the description of time. You, however, are paying a higher cost. You are conflating the third claim with the second and fourth: determinism and the irrelevance of agency. You tell our sibling that their career decision is "already made." But the block universe does not entail determinism.

  **Brother:** If the future exists, how can it be undetermined?

  **Nadia:** A probabilistic event can be fixed in a block just as a deterministic one can. The block shows *what* happens, not *why*. But more importantly, even if the future is fixed in the manifold, it does not follow that your deliberation makes no difference. Your deliberation is the mechanism by which the future becomes what it is. In the block, your choosing is as real as the outcome. You are treating the fourth claim—that agency is illusory—as a consequence of the geometry. It is not. It is a confusion about what "choice" means.

  **Brother:** If the choice is already there in the manifold, in what sense am I making it? I feel anxiety because I believe alternatives are open. If only one path exists, the anxiety is based on a falsehood.

  **Nadia:** The anxiety is based on the experience of becoming, which is real even if the manifold is static. But let's set aside agency. Return to the consolation. You tell our sibling that their father is not gone because his life is "there" in the block.

  **Brother:** It is there. 1990 is as real as 2024. He is living in 1990.

  **Nadia:** He is *located* in 1990. But consolation requires presence. To say "he is real" in the block sense is to say "he is a coordinate." It is no more comforting than saying a character in a finished book is still living on page forty. The block universe grants permanence, not persistence. It grants that the record exists, not that the life continues. You are offering the consolation of a memorial, not the consolation of presence.

  **Brother:** But you deny the memorial is all there is. You say time passes. If time passes, he is gone. Absolutely gone. In my view, he is gone from *now*, but not gone from *reality*. Is that not a distinction with a difference?

  **Nadia:** It is a distinction, but it relies on equivocation. When you say "he is there," you mean "there exists a spacetime region containing him." When our sibling hears "he is there," they hear "he is accessible." The physics does not support the accessibility. So the consolation rests on a linguistic slippage. But let's return to the argument. You say I must accept a preferred frame if I deny the block. I say I must accept that existence is not frame-relative.

  **Brother:** Which is it?

  **Nadia:** I reject the fourth step of your argument. You say: "There is no principled place to stop the multiplication of slices, so the whole manifold exists." I say: "The multiplication of slices shows that simultaneity is not the criterion for existence." I stop at the third step. I accept that there is no objective *simultaneity*. I deny that this means there is no objective *becoming*.

  **Brother:** And what buys you this? What entity carries this becoming if not the spacetime metric?

  **Nadia:** Nothing physical. That is the cost. I accept that the passage of time is not a physical phenomenon discoverable by clocks. It is the condition under which physical phenomena occur. You reduce ontology to geometry. I argue geometry describes relations between events, not the actualization of events.

  **Brother:** So you admit that physics cannot tell us what exists?

  **Nadia:** I admit that physics tells us what is consistent, not what is actual. You claim the block is forced by physics. I claim it is a metaphysical interpretation of physics. You have run together the relativity of simultaneity with the elimination of tense. The former is empirical; the latter is philosophical.

  **Brother:** Then we are at the root. You believe that "now" is a fundamental feature of reality that physics misses. I believe that "now" is a psychological feature of observers within a reality physics describes completely.

  **Nadia:** Precisely. And regarding our sibling: your view offers them a static father. My view offers them a real grief. You say the grief is a confusion about time. I say the grief is the recognition of loss, which is only possible if time passes.

  **Brother:** But if time passes, the loss is absolute.

  **Nadia:** Yes. And perhaps consolation lies in bearing the absolute, not in dissolving it with geometry.

  **Brother:** Then we cannot agree on the physics of consolation. But have we narrowed the disagreement on the argument?

  **Nadia:** We have. You claim the Rietdijk–Putnam argument proves eternalism because simultaneity is relative. I claim it proves only that simultaneity is relative. The step from "no privileged slice" to "all slices are equally actual" is where you assume existence is defined by simultaneity. I deny that definition.

  **Brother:** And the cost for you is that you must posit a mode of existence outside the spacetime manifold.

  **Nadia:** The cost for you is that you must posit that the feeling of passage is entirely illusory, despite being the precondition for doing physics at all.

  **Brother:** Then the question is this: Is the passage of time a feature of the world, or a feature of our access to the world?

  **Nadia:** Yes. If it is a feature of the world, the block is false. If it is a feature of our access, the block is true, but your consolation is false.

  **Brother:** Because a father accessed only in memory is not a father present.

  **Nadia:** No. He is a father remembered.

  **Brother:** Then whether I am right or you are, the grief remains.

  **Nadia:** The grief remains. But at least we know whether it is a confusion or a consequence.

  **Brother:** Then we agree on the sorrow, if not the structure.

  **Nadia:** We agree on the sorrow. The structure is where we must differ.
