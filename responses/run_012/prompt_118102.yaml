answer: |-
  You have put your finger on one of the most persistent and methodologically slippery moves in historical explanation. You are right to feel that "correlation isn't causation" is too blunt an instrument here, and you are also right that "environmental determinism" is inaccurate because the writers explicitly disclaim inevitability.

  There isn't one single word that captures the whole package, but there is a specific vocabulary in the philosophy of social science and historical sociology that dissects exactly this structure. The move you are describing is a specific misuse of **Conjunctural Causality**, protected by **Selection Bias on the Dependent Variable**, and often disguised as **INUS Causation**.

  Here is the carving you asked for, broken down by the logical structure, the methodological flaw, and the historiographical context.

  ### 1. The Logical Carving: INUS Conditions
  The philosophical term for the "trigger vs. background" split is an **INUS condition** (coined by J.L. Mackie). It stands for an **I**nsufficient but **N**on-redundant part of an **U**nnecessary but **S**ufficient condition.

  *   **The Volcano:** It is *Insufficient* on its own (it doesn't cause revolution everywhere). It is *Non-redundant* (without it, the revolution might not have happened *then*).
  *   **The Fragility:** This is the rest of the "Sufficient condition."
  *   **The Claim:** The writers are claiming the volcano is an INUS condition.

  **Does the line survive counterfactuals?**
  Only if the "background condition" (fragility) can be defined *independently* of the outcome.
  *   **Valid Use:** If you can measure "state fiscal capacity" or "grain storage levels" in 1347 (before the plague) and show that Region A had low capacity and Region B had high capacity, then the INUS model holds. The background condition is an *ex-ante* variable.
  *   **The Move You Hate:** If "fragility" is defined as "the propensity to collapse," then the argument is tautological. Region A collapsed, therefore it was fragile. Region B didn't, therefore it was resilient. The "background condition" is just the outcome re-labeled as a cause. In logic, this is **Reification of the Outcome**.

  ### 2. The Methodological Flaw: Selection Bias on the Dependent Variable
  In political science and historical sociology (most famously articulated by King, Keohane, and Verba), this is the technical name for the unfalsifiability you spotted.

  If you select your cases based on the outcome (e.g., "Let's study why revolutions happened"), and then look for a common trigger (volcano), you will find one. But you cannot know if that trigger matters unless you also study the cases where the volcano happened and the revolution *did not*.

  When the writer says, "The other place was just more resilient," without providing an independent metric for resilience *prior* to the event, they are engaging in **Ad Hoc Rescue**. They are modifying the theory (adding a "fragility" variable) solely to save it from the counter-example, without making that new variable testable.

  This renders the hypothesis **Unfalsifiable**. A theory that explains both $X$ (collapse) and $\text{not-}X$ (stability) by invoking a post-hoc variable ("fragility" vs. "resilience") explains nothing. It is a **Just-So Story**.

  ### 3. The Historiographical Context: The Brenner Debate
  You mentioned the Black Death and serfdom specifically. This is not just a vague pattern; it is the central battleground of 20th-century economic history, known as **The Brenner Debate** (after Robert Brenner, 1976).

  *   **The Demographic Explanation:** The plague killed so many workers that labor became scarce, empowering peasants to demand freedom (Western Europe).
  *   **The Counter-Example:** As you noted, in Eastern Europe (Poland, Russia), the same plague led to the "Second Serfdom," where lords tightened controls.
  *   **The Resolution:** Brenner argued that the plague was merely the **conjuncture** (the moment), but the **structure** (class relations and property rights existing *before* the plague) determined the outcome.

  The writers you are reading are attempting to split the difference. They want the drama of the "actor" volcano (the demographic/environmental shock) without accepting the hard structural work Brenner demands. They want the volcano to be the *protagonist*, with society merely as the *setting*. Brenner insisted society was the *protagonist*, and the volcano was just the *plot device*.

  ### 4. The "Actor" Metaphor: Material Agency
  When writers call the germ or climate an "actor," they are borrowing from **Actor-Network Theory (ANT)** or the concept of **Material Agency** (e.g., Jane Bennett's *Vibrant Matter*).

  *   **The Claim:** Non-human entities have "agency" because they disrupt human plans.
  *   **The Critique:** In popular history, this is often **Pathetic Fallacy** dressed up as theory. It attributes *intent* or *causal primacy* to matter to make the narrative more dramatic.
  *   **Why it's suspicious:** If the volcano is an "actor," it implies a symmetry between human choices and geological events. But humans respond to volcanoes differently based on politics. Calling the volcano an "actor" often obscures the human political choices that determined *who starved* when the harvest failed. It naturalizes political failure.

  ### 5. Summary of Terms
  If you need to name this move in conversation or critique, here is the hierarchy of precision:

  1.  **Retrospective Determinism (Merton):** The cognitive bias where the outcome makes the preconditions look obvious and inevitable in hindsight. "Of course they collapsed, look how fragile they were!"
  2.  **Selection Bias on the Dependent Variable:** The methodological sin of explaining an outcome without analyzing cases where the outcome didn't occur.
  3.  **Conjunctural Causality (Skocpol/Tilly):** The polite academic term for "trigger + structure." It is valid *only if* the structural variables are defined independently.
  4.  **Ad Hoc Rescue:** The logical fallacy of adding an untestable condition ("fragility") to save a theory from refutation.
  5.  **The "Catalyst" Fallacy:** A colloquial term for treating a necessary condition as if it were the primary explanatory variable.

  ### The Verdict on the Carving
  You asked: *What separates the volcano caused the collapse from the volcano was a condition the collapse came through?*

  The line survives **only if the background condition is operationalized ex-ante.**

  *   **Valid:** "States with debt-to-GDP ratios over 50% collapsed after the volcano; states under 50% did not." (Here, the volcano is a trigger; the debt is the independent cause).
  *   **Invalid:** "States that collapsed were fragile; states that didn't were resilient." (Here, the volcano gets the credit, but the explanation is circular).

  The writers you are encountering are engaging in **Causal Overdetermination** that functions as a **Tautology**. They give the volcano the *narrative credit* (the headline) while relying on the *structural explanation* (the fine print) to make the logic work, but they refuse to define the structure until after the fact.

  It is a way to have your cake (dramatic, deterministic environmental storytelling) and eat it too (nuanced, contingent structural analysis) without paying the price (rigorous measurement of pre-existing conditions).
