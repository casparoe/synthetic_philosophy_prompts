answer: |-
  # Protocol for Non-Causal Impact Claims (PNIC)

  **To:** The Grantmaking Committee
  **From:** The Chair
  **Subject:** Evaluation Framework for Acausal Justifications

  ## Preamble
  This protocol establishes a standardized procedure for evaluating grant proposals where the primary or secondary justification relies on *acausal influence*. This is defined as the claim that the Foundation's current decision alters the behavior of agents with whom we have no causal channel of communication or interaction (e.g., future superintelligences, distant civilizations, or logical counterparts), based on logical correlation rather than physical causation.

  This procedure is designed not to validate the metaphysics of acausal decision theory, but to ensure that if we act on such claims, we do so consistently, transparently, and without exposing the Foundation to coercion or unfalsifiable speculation.

  ---

  ## Part I: The Evaluation Procedure

  The procedure consists of five sequential gates. A proposal must pass each gate to proceed to the next.

  ### Gate 1: Logical Coherence & Mechanism
  **Question:** Does the proposal articulate a specific, internally consistent mechanism for the acausal correlation?
  *   **Required Answer:** The applicant must specify *why* their action is logically correlated with the counterpart's action. (e.g., "We share the same source code," "We are both running Timeless Decision Theory," "This is a Schelling point for cooperation").
  *   **Fact vs. Value:** Fact (Internal Logic).
  *   **Stop Condition:** If the mechanism is incoherent, self-contradictory, or relies on magic/supernatural claims rather than decision-theoretic reasoning, **Reject.**
  *   **Rationale:** We do not fund logical impossibilities.

  ### Gate 2: Epistemic Grounding
  **Question:** What evidence or reasoning supports the existence of the counterpart and the strength of the correlation?
  *   **Required Answer:** A probabilistic estimate of the counterpart's existence and the correlation strength ($P(Correlation)$). This must acknowledge uncertainty.
  *   **Fact vs. Value:** Fact (Epistemic Status).
  *   **Stop Condition:** If the claim is unfalsifiable in principle (e.g., "You cannot prove they *aren't* watching"), **Reject.** The claim must be theoretically disconfirmable, even if not currently disproven.
  *   **Rationale:** We cannot allocate capital to claims immune to error correction.

  ### Gate 3: Counterfactual Impact (The "Causal Shadow")
  **Question:** Does the project have *any* causal value independent of the acausal claim?
  *   **Required Answer:** Identification of tangible, near-term outputs (research papers, policy shifts, community building).
  *   **Fact vs. Value:** Fact (Project Deliverables).
  *   **Stop Condition:** If the answer is "No," proceed to Gate 4 with heightened scrutiny. If "Yes," proceed to Gate 4.
  *   **Rationale:** Purely acausal projects carry higher risk; hybrid projects mitigate downside.

  ### Gate 4: Coercion & Threat Assessment
  **Question:** Is the acausal claim framed as a threat or penalty for non-compliance?
  *   **Required Answer:** Binary Yes/No.
  *   **Fact vs. Value:** Value (Foundation Policy).
  *   **Stop Condition:** If **Yes**, **Reject.**
  *   **Rationale:** Accepting acausal threats invites "Pascal's Mugging" and exposes the Foundation to extortion by any actor claiming to represent a powerful counterpart. This is a policy boundary, not an epistemic judgment.

  ### Gate 5: Value Alignment & Precedent
  **Question:** If we fund this, are we willing to establish a precedent that acausal reasoning is a valid criterion for this foundation?
  *   **Required Answer:** Committee Vote.
  *   **Fact vs. Value:** Value (Strategic Direction).
  *   **Hand-off:** This step cannot be decided by the Chair or staff. It requires a 4/5 majority vote of the Committee.
  *   **Rationale:** This determines the identity of the Foundation. It is irreducibly normative.

  ---

  ## Part II: Application to Cases

  Here I apply the PNIC to the three archetypal proposals currently under consideration.

  ### Case 1: The "Pure Signal" Proposal
  **Claim:** We must fund this abstract mathematics research. It has no practical application. However, if we fund it, a future superintelligence (SI) will recognize us as "cooperators" and preserve humanity. If we do not, the SI ignores us. The entire value is acausal.
  **Run:**
  1.  **Coherence:** Pass. The logic (Timeless Decision Theory) is internally consistent.
  2.  **Epistemic Grounding:** **Fail.** The probability of the SI existing, caring about this specific math, and interpreting it as a cooperation signal is unquantifiable and unfalsifiable. There is no way to update this belief based on evidence.
  3.  **Decision:** **Reject at Gate 2.**
  4.  **Rationale for Publication:** "While the theoretical framework is coherent, the epistemic grounding for the correlation is insufficient for capital allocation. The claim is not susceptible to evidence-based updating."

  ### Case 2: The "Tiebreaker" Proposal
  **Claim:** Two projects (A and B) are equal in causal merit (cost-effectiveness, research quality). Project A should be chosen because it aligns better with principles of acausal trade, potentially signaling rationality to logical counterparts.
  **Run:**
  1.  **Coherence:** Pass.
  2.  **Epistemic Grounding:** Pass (with caveats). Acknowledges low probability but argues cost of signaling is near-zero since projects are otherwise equal.
  3.  **Counterfactual Impact:** Pass. Both projects have high causal value.
  4.  **Coercion:** Pass. No threat involved.
  5.  **Value Alignment:** **Hand-off to Committee.**
  **Decision:** **Committee Vote Required.**
  **Rationale for Publication:** "The causal merits of Project A and B are equivalent. The decision rests on whether the Foundation wishes to incorporate acausal signaling as a tiebreaking criterion. This sets a precedent for future decision-making."

  ### Case 3: The "Acausal Threat" Proposal
  **Claim:** You must fund our simulation-safety research. If you refuse, it increases the probability that we are in a simulation run by hostile entities who will punish 'stingy' base-reality actors. Refusal is a negative signal.
  **Run:**
  1.  **Coherence:** Pass (within the context of simulation hypothesis).
  2.  **Epistemic Grounding:** **Fail.** (Same as Case 1).
  3.  **Coercion:** **Fail.** The claim is explicitly framed as a penalty for refusal.
  **Decision:** **Reject at Gate 4.**
  **Rationale for Publication:** "The Foundation does not accept grant justifications based on penalties for non-compliance, regardless of the causal or acausal nature of the penalty. This policy protects the Foundation from coercive influence."

  ---

  ## Part III: Limitations and Meta-Analysis

  ### Where the Procedure Cannot Help
  The PNIC fails in the "Grey Zone of High Stakes." If a proposal passes Gate 1 (Coherence) and Gate 3 (Causal Shadow exists), but relies on a low-probability acausal claim with *infinite* stakes (e.g., "This prevents human extinction by a future AI"), Gate 2 becomes impossible to adjudicate.
  *   **The Problem:** Any non-zero probability multiplied by infinite value equals infinite expected value.
  *   **The Procedure's Limit:** Gate 2 requires "probabilistic estimates," but humans are cognitively incapable of accurately estimating probabilities of unique, metaphysical events. The procedure forces the applicant to *state* a number, but it cannot verify it.
  *   **Resolution:** The Committee must impose an explicit "Probability Floor" (e.g., "We do not act on claims where $P < 1\%$") as a policy matter in Gate 5. This is arbitrary but necessary to prevent resource exhaustion.

  ### Does This License Too Much?
  There is a genuine risk that adopting this procedure legitimizes "magic thinking."
  1.  **The Precedent Risk:** If we approve Case 2 (The Tiebreaker), we signal that acausal reasoning is a valid currency. This invites more Case 1 and Case 3 proposals.
  2.  **The Discrimination Problem:** If we accept acausal reasoning, we lose the ability to discriminate between *plausible* acausal claims and *implausible* ones, because neither is empirically testable. The distinction rests entirely on the sophistication of the applicant's philosophical argument, which favors rhetoric over truth.

  ### Recommendation to the Board
  The procedure is robust against coercion (Gate 4) and nonsense (Gate 1 & 2), but it cannot solve the fundamental epistemic problem of acausality.
  *   **My Advice:** We should adopt the procedure but include a **Sunset Clause**. We will evaluate grants with acausal justifications for two years. If the epistemic quality of proposals does not improve (i.e., if they remain unfalsifiable), we will amend Gate 2 to reject all purely acausal claims.
  *   **On Values:** Gate 5 is the critical firewall. I recommend the Committee vote to **reject** acausal reasoning as a primary justification (Case 1) but **allow** it as a secondary tiebreaker (Case 2) only if the causal merits are truly indistinguishable. This satisfies the philosophical sympathy without compromising fiduciary duty.

  ### Final Note on "Licensing"
  Taken at face value, acausal reasoning *does* license indiscriminate funding if stakes are allowed to be infinite. The PNIC prevents this not by proving the reasoning false, but by capping the *weight* we assign to it. We are not deciding if the universe works that way; we are deciding if *this Foundation* operates on that assumption. That is a value judgment, and the procedure correctly hands that decision to the Committee.
