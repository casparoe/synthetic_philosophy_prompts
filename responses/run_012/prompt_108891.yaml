prompt: |-
  ok so im in this historiography seminar and we just spent two weeks on Braudel and the longue durée — the whole idea that geography, climate, demography and trade structures move on these slow timescales and that battles and kings and individual decisions are basically surface noise. our final paper is supposed to answer "what would a theory of historical change have to deliver if it wants to keep the slow-structure-versus-event distinction," and I really don't want to just recap the reading. I want the spec first, something I can actually argue with. can you write me the desiderata for a theory like that? — the list of things any theory in this area has to get right, with the case behind each one.

  here's what I mean by get right, and definately add stuff I'm missing:

  - it has to handle cases where a fast event looks decisive and the slow structure looks like mere background — I keep thinking about something like the Black Death, or one harvest failure tipping a region into famine, or a ruler's decision to close a trade route, versus the mountain range or the soil that supposedly set the board up in the first place.
  - it has to handle the reverse case: a "structure" that turns out to be nothing but a pile of small events. is a trade pattern a real thing, or just a summary of lots of individual choices?
  - it has to handle cases where the slow variables all point one way but the big change happens somewhere else — like why industrialization kicked off where it did and not in some other region with similar geography and population. (don't sweat which regions, I'll pick in the paper.)
  - it has to say what counts as an explanation versus just a redescription. does "the geography made it likely" explain anything, or does it just restate the outcome?
  - it has to say how slow is slow. is a "structure" a different kind of thing from an event, or just the same stuff viewed at a longer timescale, and can you tell where one stops and the other starts?
  - it has to say which counterfactuals are legitimate. if the geography had been different, is that a real historical question? what about if one person had died young?
  - it has to avoid contradicting what we know from climate science, epidemiology and demography about how fast those processes actually move.

  for each requirement: give me the case or consideration behind it, and whether you think it's non-negotiable or just a preference of one camp. then the part I care about most — tell me if any two of them can't be satisfied at the same time, and which single requirement does the most to knock out the most candidates.

  after that, briefly, a few sentences each — how (a) a hardcore Braudel-style structuralism, (b) the reaction that events and individuals are causally indispensable, and (c) a climate/geography-determinist version do against the list. no scoreboard beyond that.

  american english please, and go easy on the jargon.
