answer: |-
  The mountain stands where fathers stood,
  Upon the rock their blood was spilled.
  We walk the path they understood,
  By blood and promise firmly willed.
  Us be the many,
  Under the sun.

  The river runs through valley green,
  Where drums once beat and banners flew.
  The quiet water flows serene,
  And carries time to me and you.
  Us be the many,
  Under the sun.

  The schoolhouse bell rings out the hour,
  To gather children from the field.
  We learn the letters, mind the rule,
  And make the past to present yield.
  Us be the many,
  Under the sun.

  So sing aloud the names of kin,
  Though strangers meet upon the hill.
  The harvest waits to be brought in,
  United by a common will.
  Us be the many,
  Under the sun.
