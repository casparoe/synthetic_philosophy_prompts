      *Let's polish this into a actionable principle.*
      *   **Name:** The **Agency & Allocation Principle**.
      *   **Core:** Design is political when it involves a *choice* that allocates *access* or *burden* unequally across existing social lines, where that choice was not dictated by technical necessity.
