      *(Self-Correction during drafting)*: I need to be careful not to let the "Intent" trap catch me. Politics often happens without conscious "evil intent." The subway stairs might be budget-driven, not hate-driven, but still political. So "Active Choice" is better than "Intent." The choice to fund one side and not the other is the political act, even if done by an accountant. The church wasn't a choice to exclude, it was a choice to build *then*, not *now*.
