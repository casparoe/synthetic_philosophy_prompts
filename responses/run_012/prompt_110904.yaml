answer: |-
  Your gut is mostly right, but your principle needs one specific adjustment to save the "Church" case without letting the "Bench" case slip away.

  Your current principle ("sorts people along a line society already draws") is too broad. It catches the church because the church *does* sort people (ambulatory vs. wheelchair), even if you feel that's "careless" rather than "political."

  Here is the refined principle that saves your gut calls, handles the macro-technology question, and gives you the verdict on the bridge.

  ### The Principle: **Active Encoding vs. Passive Inertia**

  **Design is political when it actively encodes a social preference into physical constraints to manage human behavior or access, rather than passively reflecting a past standard or technical necessity.**

  Politics is about *choice* and *power*. For design to be political, there must be a **contingent choice** (it could have been built otherwise) that **freezes a hierarchy** (one group wins, one loses) into the material world.

  Here is how this principle sorts your examples:

  #### 1. The Bench vs. The Church (Resolving your conflict)
  *   **The Bench (Political):** This is **Active Encoding**. The primary function of a bench is to sit or lie. Adding armrests *reduces* the functional utility of the object specifically to solve a social problem (homelessness). The design is being used as a proxy for law enforcement. It is a choice made *now* to enforce a hierarchy *now*.
  *   **The Church (Not Political):** This is **Passive Inertia**. The steps were likely built when ramps were not standard code. The exclusion is a byproduct of *time*, not a specific intervention to exclude disabled people. It is neglect, not policy. To call it "political" implies the current stakeholders *chose* the steps over a ramp to keep disabled people out. Unless they actively fought a retrofit, it's just legacy infrastructure. Your gut is right: it's careless, not political.

  #### 2. The Subway & The Bridges (Resource Allocation)
  *   **Subway Stairs/Escalator (Political):** This is **Active Allocation**. Building infrastructure requires budget. Choosing to spend the money on the rich side and not the poor side is a policy decision disguised as engineering. It freezes economic inequality into transit access.
  *   **Speed Bumps (Not Political):** Assuming they are applied universally for safety, this is **Technical Necessity/Paternalism**. It restricts everyone's speed to ensure everyone's safety. Unless the speed bumps are *only* in the poor neighborhood (which happens), it's traffic calming, not sorting.
  *   **Ignition Interlock (Not Political):** This is **Universal Paternalism**. It applies to every driver equally. It restricts liberty, but it doesn't sort by class or race.

  #### 3. The Macro Question (Grid vs. Solar)
  You asked if this is the same sense of "political" as Langdon Winner's famous argument (that nuclear power requires an authoritarian state, while solar allows democracy).

  **Yes, it is the exact same principle.**

  Winner's argument is about **Embedded Authority**.
  *   **Central Grid:** Requires a massive, centralized hierarchy to manage safety and distribution. The technology *demands* a specific political structure to function.
  *   **Rooftop Solar:** Allows decentralized ownership. The technology *permits* a different political structure.

  This fits the **Active Encoding** principle. The engineers aren't just building a power plant; they are building a *system of control*. When a technology requires a specific distribution of power to exist, the design itself is political. It's not just "sorting people"; it's "sorting governance."

  ### The Verdict: The One-Sided Pedestrian Bridge

  **Verdict: Political.**

  **Why:** A bridge over a highway is infrastructure meant to connect. By building a ramp only on the wealthy side, the designers have made a **contingent choice** (they *could* have built a ramp on both sides) that **freezes a hierarchy** (the wealthy have safe access; the poor do not).

  Unlike the church, this isn't legacy inertia. This is a new build. Unlike the speed bump, it doesn't apply universally. It is an active decision to allocate safety and access to one class over another. It turns the highway into a moat that only one side can cross. That is the definition of political design.

  ### Summary for your arguments
  When you get into these fights, stop arguing about "intent" (which is hard to prove) and argue about **Contingency and Constraint**.

  1.  **Could it have been otherwise?** (If yes, it's a choice).
  2.  **Does the choice burden a specific social group?** (If yes, it's sorting).
  3.  **Is the burden necessary for the object's core function?** (If no, it's political).

  *   **Bench:** Could be flat (Yes). Burdens homeless (Yes). Necessary for sitting (No). -> **Political.**
  *   **Church:** Could be flat *today* (Yes). Burdens disabled (Yes). Necessary *when built* (Yes). -> **Inertia.**
  *   **Bridge:** Could have two ramps (Yes). Burdens poor side (Yes). Necessary for crossing (No). -> **Political.**

  This principle keeps your distinctions sharp: it forgives the past (Church, QWERTY) but indicts the present choices that weaponize design against specific groups (Bench, Subway, Bridge, Tracking).
