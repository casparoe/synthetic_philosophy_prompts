answer: |-
  The basement of the Oakhaven Regional Museum smelled of packing peanuts and dormant dust. Elara stood before the workbench, the loan agreement for the Silk Road exhibition spread out beside her clipboard. The clause was specific, born of a nervous insurer: *Any display case containing glass components that would break if struck must be fitted with laminated safety glazing.*

  Three prototype cases sat on the bench. They looked identical from a distance—sleek, rectangular prisms of transparent material set in aluminum frames. Her job was to certify them. Her supervisor, Marcus, leaned against a stack of crates, holding a rubber mallet.

  "Simple enough," Marcus said, tapping the mallet against his palm. "Hit them. If they crack, they need lamination. If they don't, they're good to go."

  "It's not about whether they *do* crack," Elara said, adjusting her safety glasses. "It's about whether they *would*."

  "Same thing, isn't it?"

  Elara didn't answer. She picked up the logbook. "Case One. The Vanguard model."

  She stepped up to the first case. It was pristine, the glass shimmering slightly under the fluorescent lights. She raised the mallet. She didn't hold back; the test required a standard impact force, enough to shatter ordinary annealed glass. She swung.

  The mallet head connected with a sharp *clang*, like a bell being struck, rather than the sickening crunch of failure. The glass rippled. For a fraction of a second, a wave of opacity swept through the transparency, a visible stiffening, before vanishing. The surface remained intact. Not a hairline fracture.

  Marcus nodded, marking his own clipboard. "Pass. Solid as a rock."

  Elara ran a gloved finger over the impact site. It felt warmer than the surrounding surface. "Did you see the ripple?"

  "Refraction," Marcus dismissed. "It didn't break, Elara. The conditional is satisfied. If struck, it did not break. Therefore, it is not the case that it would break if struck."

  "But the strike changed it," Elara said, her voice tight. "Ordinary glass doesn't ripple like that. It has a mechanism. The moment the mallet touched it, the molecular structure locked up. It wasn't the same material at the end of the swing as it was at the start."

  "So it's smart glass," Marcus said. "It's better than breakable. It's unbreakable."

  "It's fragile," Elara insisted, looking at the log. "It's brittle by nature. The impact triggered a defense that removed the brittleness before the break could happen. If you could freeze the moment of contact, before the mechanism fired, it would have shattered. The disposition was there. The trigger killed it before it could manifest."

  Marcus sighed, the sound echoing in the concrete room. "You're certifying based on what *might* have happened in a universe where the glass doesn't protect itself. The contract cares about this universe. It didn't break. Mark it as non-fragile."

  "I can't," Elara said. She wrote *Requires Lamination* in the column, feeling Marcus's stare burn into her shoulder.

  "Case Two," she announced, moving down the line to break the tension.

  This case looked older, the aluminum frame thicker, lined with a dense black rubber gasket that hugged the glass pane tightly. Elara tapped the frame. It felt spongy. She raised the mallet again. She struck the center of the pane.

  The sound was a dull thud, absorbed instantly. The glass didn't vibrate. It didn't ripple. It simply refused to transmit the energy. Elara leaned in. She could see the rubber gasket compressing inward, taking the force, sparing the glass entirely. She took a small tool and gently pried back a corner of the gasket. Beneath it, the glass was thin, standard annealed stock.

  "It's the frame," Elara said. "The glass is weak. If you took this rubber away, a breath would crack it. But the padding is extrinsic. It's masking the fragility."

  Marcus stepped closer, peering at the exposed edge. "Hmm. So the glass itself is bad, but the casing saves it."

  "The casing isn't part of the glass's disposition," Elara said. "The glass retains the power to break. The environment is just stopping it from showing off."

  Marcus nodded slowly. "Okay. I see the distinction. If we ship this and the padding shifts during transit, the glass is exposed. It's a latent risk. The disposition survives the test; it's just hidden." He ticked his box. "Requires Lamination. We replace the glass or laminate it. I agree with you on this one."

  "Case Three," Elara said.

  The final case was labeled *SecureTech*. It looked like the others, though the material had a slight yellow tint. Elara lifted the mallet. She felt a hesitation, a superstition she couldn't name. She struck.

  The sound was wrong. It wasn't a crunch, and it wasn't a ring. It was a pop, followed by a violent shatter. Shards flew outward, bouncing off Elara's glasses. But they didn't fall like glass. They were light, fluttering down like plastic confetti. And they smelled of sulfur.

  Marcus stepped back, brushing a shard from his sleeve. "Well. That broke. Definitely needs lamination. Or replacement."

  Elara crouched, picking up a large piece of the debris. It bent slightly in her fingers. "It's polycarbonate resin. It's tougher than glass. It shouldn't break from this impact."

  "It broke," Marcus said, pointing at the empty frame.

  "Because of this," Elara said, pointing to the rim where a small, charred circuit board was now exposed. "There's a micro-charge in the frame. On impact, it detonates. It forces the material apart. It's a safety feature—if someone breaks in, the case destroys the contents to protect them, or maybe just alerts security."

  "So it shattered," Marcus said. "The behavior occurred."

  "But not because of the material's disposition," Elara said, standing up. "The material isn't fragile. It's tough. The shattering wasn't the manifestation of brittleness. It was a mechanical failure induced by an explosive. It mimics breakage. If you hit this with a hammer in a world without the charge, it would bounce."

  Marcus rubbed his chin. "It broke when struck. The contract says 'any case that would break if struck'."

  "The 'would' implies a causal link," Elara said, her pen hovering. "It implies the breakage comes from the nature of the thing, not a hidden bomb. If I strike a tank and it explodes because I hit the fuel tank, the tank isn't fragile. It's volatile."

  "It looks like fragility to the insurer," Marcus argued. "They see shards, they see liability."

  "They're paying for protection against brittleness," Elara countered. "This case is safer than glass. It's designed to fail safely. Calling it fragile is a category error."

  Marcus looked at the debris, then at Elara, then at the first case—the one that hadn't broken but she claimed was fragile. "You want to mark the one that didn't break as fragile, and the one that did explode as... what? Safe?"

  "I want to mark it true to its nature," Elara said. "Case One is fragile because the strike removed the fragility. Case Two is fragile because the frame hid the fragility. Case Three is not fragile because the breakage was a trick."

  Marcus sighed, pushing off the crate. "You're going to write a novel in that logbook, aren't you?"

  "Just the certification."

  Elara turned back to the bench. The air felt heavy, charged with the unresolved tension of the first case. She knew Marcus would appeal her decision on the Vanguard model. He would argue that a disposition is defined by its outcome, not its potential. She knew he believed that if the glass didn't break, it wasn't breakable, full stop. But she also knew the feel of that ripple under her finger, the way the glass had changed its mind about being glass the moment violence was offered to it.

  She capped her pen. The forms lay flat on the metal table. She filled in the boxes, her handwriting steady, committing to the verdicts that felt right in her bones, regardless of the contract's simple syntax. She slid the clipboard toward Marcus. He looked at the checkmarks, shook his head, but didn't cross them out.

  "Shipping starts Monday," he said, turning toward the stairs. "Don't let me catch you testing the laminated ones."

  Elara stayed in the basement. She looked at the three cases: the one that changed its nature to survive, the one that was saved by its surroundings, and the one that pretended to die. She turned off the workbench light, leaving them in the dim emergency glow, each holding its secret truth in the dark.

  \answer{Case 1: FINK; Case 2: MASK; Case 3: MIMIC}
