answer: |-
  Neighbors, friends, families of the lost.

  We stand here because a fire burned in 1928, and because this town never stopped feeling the heat. For nearly a hundred years, we gathered to mark this date. We told ourselves the story of a freak accident. We told our children that bad luck struck the factory floor. We told each other that nothing could have been done. We told that story because we needed to stay neighbors. We needed to believe that tragedy was random, not chosen. That story held us together when we wanted to fall apart.

  But a story that protects the living can hide the dead.

  Yesterday, the historical society opened letters written by the factory owner weeks before the blaze. He knew the exits were locked. He knew the sprinklers were dry. He signed the checks to keep them that way. The fire was not an accident. It was a calculation.

  Reading that changes the air in this room. It changes the stone we are about to unveil. For those of you who grew up hearing the old story, this feels like a betrayal. It feels like we are rewriting the past. But we are not rewriting the past. We are finally reading it.

  Memory is how we hold each other. History is how we hold ourselves accountable. When those two things clash, we have a choice. We can keep the comfort of the old story, or we can give the victims the dignity of the truth. If we leave this plaque as a monument to an accident, we insult the people who died. They did not die to bad luck. They died to someone's greed. To call it an accident is to let the killer walk free a second time.

  So we change the words on the stone. We do not change the love behind them.

  To the families here: I am sorry. I am sorry this town looked away for so long. I am sorry we accepted the owner's lie because it was easier than facing his crime. We honored your grief, but we ignored your justice. We thought keeping the peace was the same as keeping faith. It wasn't.

  This plaque does not erase our shared history. It completes it. We are not destroying our memory of this town; we are growing up. A community that can admit it was wrong is stronger than a community that pretends it was blind. We are choosing to be the kind of town that tells the hard truth even when it burns.

  We dedicate this marker not to a tragedy that fell from the sky, but to lives taken by human hands. We remember them now not as victims of fate, but as neighbors who deserved better. We honor them by finally seeing them clearly.

  Summary: The speech decides that communal memory must yield to historical record when the truth is required to fully honor the dead.
