      *   *Normal Science:* Developing features against v1, writing clients that conform to the contract, patching bugs (v1.0.1, v1.0.2).
      *   *Anomalies:* Edge cases where the API behaves weirdly, performance cliffs, security holes that require awkward workarounds, "it works but the semantics are wrong."
      *   *Crisis:* Technical debt is too high. The shim layer is too complex. New requirements (e.g., async vs. sync) break the core data model. The cost of maintaining v1 > cost of rewriting.
      *   *Revolution:* v2.0.0 release. Breaking changes. Deprecation notice.
