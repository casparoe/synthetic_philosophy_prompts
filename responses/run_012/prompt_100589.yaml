      *   *Anomalies:* Things that don't fit the rules but aren't immediately crises.
      *   *Crisis:* Anomalies pile up, rules get stretched, confidence drops.
      *   *Revolution:* New rules adopted, old rules discarded.
      *   *Incommensurability:* You can't fully translate terms from Old to New (meaning changes).
