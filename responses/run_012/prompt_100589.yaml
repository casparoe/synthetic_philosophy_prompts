      *   *My Stance:* It's a defect in the engineering framework *if* you think the code maps 1:1 to reality. But for *software*, the "reality" is the business logic. Kuhn is right that business logic shifts. But the *machine* is a neutral substrate. So, Kuhn overstates it for *engineering*, but the engineering vocabulary hides the semantic drift.
      *   *Wait, stronger stance:* The engineering vocabulary *assumes it away* to function. You *must* assume the bytes are stable to ship code. Kuhn is asking about *meaning*. The defect is thinking "bytes = meaning." So, it's a defect in the framework's ability to describe *semantic* change, not necessarily a refutation of Kuhn.
      *   *Actually, let's look closer:* In science, there is no "nature's API spec." In engineering, there *is* a spec (or a business requirement). If the business requirement changes, that's not a paradigm shift, that's a new ticket. A paradigm shift in eng is when the *way we model the business* changes.
