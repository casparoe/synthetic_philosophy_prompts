          3.  Address the specific suspicion: The "Neutral Substrate" (machine/bytes) vs. Kuhn's denial of a neutral observation language. Does the engineering vocabulary assume away a real problem, or is Kuhn overstating discontinuity?
      *   **Constraint:** Take the analogy seriously. Do not dismiss it. Do not water it down. Don't just split the difference on the final question.

  2.  **Deconstruct Kuhn's Framework (Mental Sandbox):**
