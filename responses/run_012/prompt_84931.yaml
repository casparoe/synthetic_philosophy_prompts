answer: |-
  The source file sat on Elara's screen, twelve lines of Vallackian Unicode that looked like static. She wasn't looking for meaning anymore; she was looking for leverage.

  The poem was "The Square at Dawn" by an anonymous hand, circa 1590. Twelve lines. Three quatrains. The last line of each quatrain was identical: *Kest veran tola.*

  *Wait for the Kest.*

  In Vallackian, *Kest* was a homonym with two live senses. Sense A: A hard frost, a weather event. Sense B: A mandatory assembly, a political summons. The poem's engine was a slow phase shift. Stanza one described ice on cobblestones. Stanza two described breath holding in the cold. Stanza three described boots marching on the ice. The word *Kest* never changed. The reader's ear did the work. By line twelve, "Wait for the Kest" meant "Wait for the Revolution," but it had arrived there wearing the coat of "Wait for the Frost."

  Elara's target language was English. English did not have *Kest*. It had "Frost" and it had "Call." They did not rhyme. They did not share etymology. They did not overlap.

  This was not a mystery to be solved. It was a constraint-satisfaction problem with no feasible region.

  She had three variables. Form (syllable count, rhyme scheme ABAB, identical refrain). Semantics (the drift from weather to politics). Safety (the Ministry of Culture would not print a poem explicitly calling for assembly).

  She typed into her scratchpad: *Option C: Archaic.*

  She had spent yesterday digging into Middle English. She found *Hight*. It meant "called" or "named," but in certain dialects, it carried a sense of "commanded presence." It rhymed with "Light," "Night," "White."

  She tried to fit it.
  *The ice lies thick and white,*
  *We stand within the light,*
  *The breath hangs in the night,*
  *Wait for the Hight.*

  It scanned. It rhymed. It was technically faithful to the single-word constraint. She ran it through a readability analyzer. Grade level: 14. Archaic density: High. The anthology was for high schools. If she used *Hight*, the students would gloss over it as poetic decoration. The drift would be lost because the word itself was dead. A dead word cannot carry a living shift. It was a local minimum—perfect form, zero signal.

  The conference room smelled of stale coffee and ozone. Harse, the editor, sat at the head of the table. He looked like a man who audited tax returns for a living.

  "The Ministry flagged the second stanza," Harse said, sliding a printout across the table. "The phrase 'gathering shadow' is borderline. But the main issue is the refrain. If you translate *Kest* as 'Call,' you are printing a summons. We cannot distribute a summons under the guise of literature."

  "So I use 'Frost,'" Elara said.

  "You use 'Frost,'" Harse confirmed. "And you maintain the rhyme scheme. The original rhymes *tola* with *kola* and *bola*. Frost rhymes with...?"

  "Lost. Cost. Crossed," Elara said.

  "Then the imagery must support those rhymes. If stanza three needs to rhyme with Frost, you cannot have 'boots.' You need something that rhymes. 'The people bear the cost.' Abstract. Safe."

  "That kills the third stanza," Elara said. "The poem moves from physical cold to social cold. If I make it abstract, the drift collapses. It becomes a poem about weather that stays about weather."

  "It becomes a poem that exists," Harse said. "Existence is a prerequisite for reading."

  Kael was leaning against the back wall. He was the rival translator, hired to provide a comparative edition. He wore a jacket that cost more than Elara's car. He pushed off the wall.

  "That's cowardice masquerading as constraint," Kael said. "I've solved it."

  Elara looked at his handout.
  Stanza 1 Refrain: *Wait for the Frost.*
  Stanza 2 Refrain: *Wait for the Call.*
  Stanza 3 Refrain: *Wait for the Call.*

  "You broke the refrain," Elara said. "The prompt specifies word-for-word identical repetition. That's the form."

  "The form serves the meaning," Kael said. "Hofstadter teaches us that the soul of the poem is the effect on the reader. If I keep the word identical but change the meaning via footnote, I preserve the semantic drift. If I change the word to match the meaning, I preserve the emotional trajectory. My version tells the truth."

  "You changed the code," Elara said. "You're optimizing for semantic fidelity at the expense of structural integrity. You're not translating the poem; you're translating the gloss."

  "I included a footnote," Kael said, tapping the page. "It explains the homonym. It explains the shift."

  "The footnote is a different poem," Elara said. "It's exegesis. It's meta-data. When a reader hits a footnote, the spell breaks. They leave the text to go to the apparatus. You've turned a lyric experience into a lecture."

  "And you want to print 'Frost' three times and let them think it's about ice?" Kael snapped. "That's a lie."

  "It's a compression artifact," Elara corrected. "All translation is lossy compression. You have to pick your distortion metric. Harse wants to minimize political risk. You want to minimize semantic loss. I want to minimize structural error."

  "But you're losing the point!" Kael shouted.

  "The point is the drift," Elara said, her voice quiet. "The point is that the word doesn't change, but the world around it does. That's the trick. In Vallackian, the tension lives in the single word holding two weights. In English, if you split the word, you release the tension. If you keep the word 'Frost,' you bury the second weight. There is no solution where the tension survives."

  Harse cleared his throat. "I don't care about the tension. I care about the budget. Kael's version requires typesetting notes. Elara's version fits the template. Elara, can you make the rhymes work with 'Frost'?"

  "Yes."

  "Will it pass the Ministry?"

  "Yes."

  "Then that's the version."

  Kael laughed, a sharp, brittle sound. "You're optimizing for distribution. You're not translating. You're packaging."

  "I'm preserving the container," Elara said. "If the container breaks, the content spills and evaporates. Your version gets banned. My version gets read."

  "My version gets understood!"

  "By who? The five people who read the footnotes?" Elara stood up. "You think you're fighting for truth. You're fighting for your own metric. You value explicit meaning over implicit structure. I value the shape. Harse values the license. We are not having the same conversation."

  She walked out before Kael could respond. She knew he was right, in a way. Her version was a lie. But his version was a different object entirely. A poem with footnotes explaining its own puns is not a poem; it is a puzzle with the solution printed on the back.

  Back at her desk, the cursor blinked in the text file.

  *The ice lies thick and white,*
  *The birds have taken flight,*
  *We shiver in the light,*
  *Wait for the Frost.*

  *The shadow grows in cost,*
  *The breath is briefly lost,*
  *The river holds its frost,*
  *Wait for the Frost.*

  *The people bear the cost,*
  *The lines are sharply crossed,*
  *No winter can be lost,*
  *Wait for the Frost.*

  It was smooth. It scanned. The rhymes were perfect. The syllable count matched the source exactly. It was a perfect formal match.

  It was also dead.

  The drift was gone. The third stanza was supposed to be boots on pavement, voices rising, the cold turning into anger. Instead, it was about "cost" and "lines crossed." It was vague enough to pass censorship, specific enough to sound like poetry. It was a shell.

  She thought about the archaic option again. *Hight.* If she used *Hight*, she could keep the single word. She could keep the form. But the readers would stumble. They would look it up. They would feel the distance. Maybe that distance was the point? Maybe the alienation of the word *was* the alienation of the summons?

  She ran the simulation in her head. A classroom of sixteen-year-olds. They read "Wait for the Hight." They frown. They check the glossary. They see "Archaic: Command." They nod. They move on. The emotional impact is delayed by cognition. The poem becomes an intellectual exercise. The shiver is lost.

  She opened a new file. She typed Kael's version.
  *Wait for the Frost.*
  *Wait for the Call.*
  *Wait for the Call.*

  She read it. It felt like a story. It had a narrative arc. It was clear. It was also clumsy. The repetition wasn't repetition anymore; it was progression. The musicality of the return was broken. The anchor was moved.

  She closed the file.

  The problem wasn't that she couldn't solve it. The problem was that the solution space was empty. There was no point in the multidimensional space of Translation where Form, Meaning, and Safety intersected. She had to project the source onto a lower dimension. She had to cut a axis.

  Harse wanted to cut Politics.
  Kael wanted to cut Form.
  Elara wanted to cut... what?

  She realized she had been optimizing for fidelity to the *drift*. But the drift was a phenomenon of the source language's topology. It relied on the homonymic overlap. English didn't have that topology. You couldn't translate the drift. You could only translate the endpoints.

  If she kept "Frost," she kept the start and lost the end.
  If she kept "Call," she kept the end and lost the start.
  If she used "Hight," she kept the middle and lost the audience.

  There was no scalar value for "Poem Quality." There was no single number she could maximize. She had to choose which loss she could live with.

  She looked at the clock. The submission deadline was in twenty minutes.

  If she submitted Kael's version, the anthology would be delayed. The Ministry would review the footnotes. They would see the explanation of "Call" as assembly. They would reject it. The poem would not exist.
  If she submitted her "Frost" version, the poem would exist. It would be read. It would be anthologized. Students would memorize it. They would feel the rhythm. They would feel the cold. They would not feel the summoning. But maybe, in ten years, one of them would wonder why the third stanza felt so heavy. Why "bear the cost" felt like more than money.

  The footnote was a rescue boat, but it stayed in the harbor. The poem had to sail.

  Elara highlighted Kael's file and deleted it. She highlighted the archaic draft and deleted it.

  She opened the "Frost" file. She looked at the third stanza.
  *The people bear the cost.*

  She changed one word.
  *The people pay the cost.*

  No. Too obvious.
  *The people count the cost.*

  Better. "Count" implied numbers, but also counting off, counting heads. It was a tiny spike in the smooth surface. It wouldn't trigger the censors. It wouldn't satisfy Kael. It was a whisper.

  She saved the file. *Translation_Final_v4.docx.*

  She attached it to the email. She didn't write a cover letter explaining her choices. A preface would be another footnote, another layer of insulation between the reader and the text. If the poem needed a disclaimer to work, it wasn't working.

  She hovered over the send button.

  She knew that in choosing "Frost," she was silencing the summons. She was making the poem safe. She was complicit in the erasure of the second meaning. But she was also preserving the vessel. A sunk ship carries no passengers.

  She thought about the Vallackian poet. Did they know *Kest* would break? Did they know that across the water, the word would split? Maybe they wrote it knowing it would be broken. Maybe the breaking was part of the transmission.

  Elara pressed send.

  The progress bar filled. The message moved to the Sent folder.

  She sat back. The room was quiet. The problem was not solved. The distortion was not minimized. She had simply selected a metric and accepted the error. The poem was now a thing in the world, flawed and dangerous in ways nobody would notice.

  She opened a new document. She began to type a letter of resignation. It wasn't about the poem. It was about the metric. She couldn't work for people who thought safety was a variable you could optimize without changing the function.

  But that was for tomorrow. Today, she had submitted the frost. She would wait to see if anyone noticed the cold.
