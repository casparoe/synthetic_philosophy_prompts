      *   *Prediction:* "Clusters attract. +10 or more."
  *   **Outcome (Transparency C):** Count = 52 Black.
  *   **Shove-Credit:**
      *   Change in Outcome: +18 (vs Baseline).
      *   Description Cost: "Center Cluster" (Very Low info).
