  ## Sample Run: Round 1 (Micro) with Numbers

  *   **Start State:** 32 Black, 32 White. Random distribution.
  *   **Baseline Future (Transparency A):** After 10 ticks, system settles. Count = 34 Black.
  *   **Group Decision:** "Flip Token at (4,4) from White to Black."
  *   **Micro Ledger Entry:**
      *   *Intervention:* `Set Cell(4,4) = Black`.
      *   *Micro Cost:* 1 bit change.
      *   *Prediction:* "Chaos will swallow it. +0 or +1."
  *   **Outcome (Transparency B):** Count = 35 Black.
  *   **Shove-Credit:**
      *   Change in Outcome: +1.
      *   Description Cost: Low.
      *   *Verdict:* Low efficiency. The specific coordinate (4,4) was mostly noise; the system barely noticed.

  ## Sample Run: Round 2 (Macro) with Numbers

  *   **Start State:** Reset to 32 Black, 32 White.
  *   **Group Decision:** "Force a 3x3 Black Square in the Center."
  *   **Action:** Facilitator flips 5 specific tokens to create the square.
  *   **Macro Ledger Entry:**
