  ## Troubleshooting: What Will Go Wrong

  **1. The "It's Just a Summary" Dismissal**
  *   **Symptom:** A student says, "The Macro level isn't real. You just moved tokens. The Ledger is just a shorthand."
  *   **Handling:** Agree. "Yes, the ontology is tokens. But ask the *prediction* question. If I tell you next time I will 'make a cluster,' can you predict the outcome? If I tell you 'I will flip tokens 4, 9, 12...', can you? The macro description carries *causal power* in our epistemic access, even if the micro level carries the *ontological weight*."
  *   **Pushback:** Ask them to bet on the next round using only micro-descriptions. They will hesitate.

  **2. Cheating / Micro-Computation**
  *   **Symptom:** A group tries to trace the neighbors on the board during the 3-minute limit.
  *   **Handling:** Enforce the time limit strictly. "If you haven't finished by the beep, your prediction is void." The point is the *infeasibility*. If they succeed, the grid was too small. (8x8 is usually too big for 3 mins with Majority Rule).

  **3. Unrepeatable Outcomes**
  *   **Symptom:** "Why did Transparency B happen? That looks random."
  *   **Handling:** Re-run the 3x3 demo. Show determinism. "The complexity comes from the *interactions*, not randomness. The Book (Transparencies) is fixed."

  **4. Macro Realism Slide**
  *   **Symptom:** The group starts treating "The Cluster" as a ghostly object that pushes tokens.
  *   **Handling:** Remind them of the Reflexive Turn. "You pushed the tokens. The Cluster didn't push itself. The Macro level is a *pattern of* the Micro, not a *rival* to it."

  **5. Timing Overrun**
  *   **Risk:** Round 2 discussion drags.
  *   **Fix:** Cut Round 3 Task A if needed. Prioritize the Shove-Credit comparison (Round 1 vs 2) over the Reconstruction (Round 3).

