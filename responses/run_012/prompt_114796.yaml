  ## Honesty: What This Activity Cannot Do

  **1. Ontological Addition**
  *   **Limitation:** The activity demonstrates *epistemic* utility (prediction/compression). It cannot prove that macro-causes are *ontologically* distinct additions to the world. The tokens are still the only things moving.
  *   **Facilitator Script:** "This game shows why macro-talk is *useful*. It does not prove that 'Clusters' exist in the same way 'Tokens' exist. That is the metaphysical leap you must debate in the reading."

  **2. The Selection Story**
  *   **Limitation:** In the Careenium/Mind, patterns matter because they survive/evolve. Here, they matter because *I said so* (by pre-printing the transparencies).
  *   **Facilitator Script:** "I selected these trajectories because they show the pattern working. In nature, the patterns that don't work disappear. We simulated the *survival* of the pattern, not the *selection* of it."

  **3. True "Aboutness"**
  *   **Limitation:** The Grid patterns are about *my intervention*, not the external world.
  *   **Facilitator Script:** "The Grid encodes my move. A mind encodes the world. The structure is the same (information carrying), but the target is different. Don't confuse the simulation with the full theory of content."

  **4. The Facilitator's Counterweight**
  *   **Risk:** You become the "Ghost in the Machine" by manually swapping transparencies.
  *   **Mitigation:** Acknowledge this. "I am the laws of physics in this room. I am deterministic. But even I respond to your Macro requests ('Make a cluster'), not just your Micro requests ('Flip bit 4')." This reinforces the Proportionality argument: The Facilitator (Physics) is more responsive to Macro constraints than Micro specifics.
