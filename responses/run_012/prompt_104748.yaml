answer: |-
  1. The question

  Consider the following case: A woman (the Stand-in) has never seen a specific film. A trusted friend has described it so thoroughly that the Stand-in can reliably predict any viewer's reaction, including her own. She sincerely calls the film "great" before seeing it. When she finally watches it, her reaction matches her prediction exactly.

  Consider the rule: one cannot honestly judge a work of art unless one has experienced it firsthand. Analyze it using her case. You must argue for which of the following three claims the rule is actually making: (1) what justifies an aesthetic judgment, (2) what mental state is required to find something beautiful, or (3) what conditions make the words count as a judgment at all.

  Do not survey options. Defend one reading. Based on your chosen reading, deliver a definite verdict: Was the Stand-in entitled to call the film great before seeing it? Explain why the other two readings fail or collapse under this case.

  2. Model answer

  The Stand-in presents a paradox. She possesses the truth of the judgment and the evidence for it, yet intuitively violates the rule against judging art without experience. To resolve this, we must identify what the rule actually demands. It is not a claim about justification, nor about linguistic meaning, but about the specific mental state required for aesthetic valuation. The rule survives only if interpreted as a demand for a specific kind of engagement, rather than a requirement for evidence or semantic validity.

  Consider first the claim that the rule concerns justification. In ordinary life, we accept testimony for facts. If a structural engineer says a bridge is safe, we are justified in believing it without inspecting the steel ourselves. The Stand-in's friend has proven reliably accurate over years. Her belief that the film is great is supported by strong evidence. If the rule meant "you need direct evidence to be justified," the Stand-in meets this via her friend's track record. She is not guessing; she is inferring from reliable data. Yet, despite this justification, the intuition remains that she shouldn't judge. Therefore, the rule is not about whether she is allowed to believe the proposition is true. It is not about the epistemic right to hold the belief.

  Consider second the claim that the rule concerns meaning. The Stand-in understands the words "great film." She is not speaking nonsense, nor is she lying. She intends to communicate a valuation consistent with her understanding of the genre. There is no semantic barrier preventing her from uttering the sentence. The rule does not claim her words are meaningless, only that they are illegitimate coming from her. Thus, the rule is not about the conditions for speech acts or linguistic competence. She is playing the language game correctly, yet still violating the norm.

  This leaves the second option: the rule concerns the mental state of finding something beautiful. Aesthetic judgment is not merely assenting to a conclusion; it is an activity of attention. To judge art is to engage with its features, to feel the tension of a scene, or to see the balance of a composition. The value of art lies in this engagement, not merely in the final rating. The Stand-in has the rating without the engagement. She has the map, but she has not walked the terrain. She knows *that* it is great, but she does not know *how* it is great until she sees it. Testimony transfers the verdict, but it cannot transfer the way of looking.

  This distinction between verdict and way of looking is crucial. A verdict is a static claim: "This is good." A way of looking is a dynamic process: "See how this light contrasts with that shadow." The Stand-in can output the verdict because she trusts the friend. But she cannot adopt the way of looking because she has no object to look at. When she says "it is great," she is endorsing a conclusion she did not reach. In aesthetics, the reaching is part of the judging. To judge is to weigh features. She has not weighed them; she has accepted the weight given by another. This is why her judgment feels hollow. It is a borrowed conviction.

  Therefore, the Stand-in was not entitled to call the film great. She possessed the verdict without the way of looking. Her judgment was a report on her friend's experience, not a response to the film itself. When she finally watched it, she did not gain new information; she gained the experience that validates the judgment. The rule survives only as a demand for direct perception. It insists that aesthetic value is inseparable from the act of perceiving it. To judge without looking is to bypass the very thing that makes art valuable. The Stand-in's success proves she knows the facts, but her failure to see the film proves she missed the point. The rule stands: you must look to judge, not because you need proof, but because the looking is the judgment.

  3. Marking scheme

  **Total: 20 Marks**

  *   **Identification (3 marks):** Clearly defines the three possible readings (justification, mental state, meaning) without confusion.
  *   **Selection (2 marks):** Definitively chooses one reading to defend; does not hedge or remain neutral.
  *   **Refutation (6 marks):** Explains why the two unselected readings fail using the Stand-in case (3 marks per reading).
  *   **Defense (5 marks):** Argues positively for the selected reading, specifically distinguishing between "verdict" and "way of looking."
  *   **Verdict (4 marks):** Delivers a clear "yes" or "no" on the Stand-in's entitlement that logically follows from the selected reading.

  **Distinction:** A full-marks answer integrates the Stand-in case into every step of the argument. A solid passing answer (14-16 marks) may treat the case as an illustration appended to a theoretical explanation rather than the engine of the argument.

  4. Common mistakes

  1.  Hedging the verdict on the Stand-in instead of deciding: Cost 5 marks.
  2.  Naming philosophers or citing texts despite instructions: Cost 5 marks.
  3.  Failing to distinguish between justification, state, and meaning: Cost 4 marks.
  4.  Arguing the Stand-in was wrong because her prediction could have failed (missing the premise): Cost 3 marks.
  5.  Treating the prompt as a survey of views rather than a defended position: Cost 3 marks.
