prompt: |-
  I read a popular evolution book last month and one chapter on species has been bugging me ever since. The gist of it was: biologists have never managed to agree on what a species is; the biological species concept — the one Mayr is known for, species are groups of actually or potentially interbreeding populations that are reproductively isolated from other such groups — became the standard definition in the middle of the last century, but it falls apart for asexual organisms, for hybrids, and for ring species; ring species in particular show that there is no fact of the matter about where one species stops and the next begins; so the boundaries are arbitrary and species are really just convenient human labels we slap onto a continuum, which is why taxonomists keep reviseing classifications; the species category is a human invention and the 'species problem' is a problem about words, not about nature; the thing that will finally settle it is genomics, since comparing whole genomes will reveal the real boundaries as genetic gaps; and this matters practically, because conservation law protects 'species', so if the category is arbitrary then so is the choice of which organisms we protect.

  How much of that should I believe? Go through it claim by claim and tell me what's accurate, what's a fair simplification a specialist would let slide, and what's actually wrong or misleading. I'd especially like to know which distinctions the passage quietly collapses — I have a feeling the 'just labels' bit doesn't follow from the ring-species bit, but I can't say exactly why, and I don't know whether 'no agreement on a definition' is meant to be evidence about nature or evidence about biologists. Also: is 'convenient human labels' even a position anyone actually holds, or is the respectable version of it something narrower than what the chapter says?

  Two more things. Someone at a party told me that on some views species aren't kinds at all but particular things, like individuals with parts, so that asking for a definition of species is a category mistake — is that a real position or a garbled version of one? And does the practical conclusion at the end, about conservation being arbitrary, follow from any of the claims that survive correction? If the answer is that the chapter got the details wrong but the spirit right, say so; if the spirit is wrong too, tell me what the strongest version of its conclusion would have to look like.

  I don't need citations or a reading list, just the audit.
