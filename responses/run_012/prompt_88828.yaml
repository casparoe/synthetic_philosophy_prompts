  **The question**

  The project asks whether Kavka's toxin puzzle is fundamentally a wrong-kind-of-reason problem. Standard treatments ask whether an agent can intend to act when they know they will lack sufficient reason to act. I propose the deeper question is whether intention, like belief, is governed by a transparency constraint that excludes pragmatic reasons for holding the attitude itself. Specifically, does the billionaire's offer provide a reason for the intention (the right kind) or merely a reason to want to have the intention (the wrong kind)? The deliverable is a determinate classification of the puzzle under the wrong-kind-of-reason framework and a verdict on whether the transparency constraint excluding such reasons is constitutive of intention or merely a rational ideal. This requires isolating the precise sense in which a reason counts for an intention distinct from the intended act. The stakes concern the architecture of agency: if the constraint is constitutive, the intention is metaphysically impossible; if merely ideal, it is irrational but possible.

  **Why the puzzle is not yet settled**

  Existing literature leaves this open because it conflates the psychology of forming intentions with the normative structure governing them. Dominant views treat the puzzle as a test of whether intention requires belief in future action. Some argue self-deception allows the intention; others argue the intention is impossible because rational agency requires consistency between intention and expected action. However, these positions assume the billionaire's offer is a reason for intending without interrogating its logical type. They do not distinguish between reasons that speak to the correctness of the intention (based on the act's value) and reasons that speak to the benefits of holding the attitude (based on the reward). Consequently, debates stall on whether the agent *can* psychologically lock themselves into the act, rather than whether the reason offered is the sort that intention *can* respond to.

  Moreover, the analogy to belief is underexplored. In doxastic involuntarism, pragmatic reasons are widely accepted as the wrong kind for belief. Yet intention is often treated as more voluntary. If intention shares belief's transparency constraint, pragmatic reasons are excluded; if not, they are admissible. Current treatments fail to settle this because they do not rigorously test whether the impossibility in the toxin case stems from a failure of rationality or a failure of conceptual coherence. Finally, existing accounts rarely distinguish between constitutive norms, which define the attitude, and regulatory ideals, which guide it. Without this distinction, we cannot tell if the puzzle reveals a limit of human psychology or a conceptual boundary of intention itself. The result is a stalemate between psychological impossibility and rational irrationality that the wrong-kind-of-reason framework is poised to resolve.

  **The approach**

  The method involves conceptual analysis centered on three distinctions. First, I will distinguish reasons for intending from reasons for the intended act. The billionaire's offer is a reason for intending; the toxin's effects are reasons for the act. Second, I will distinguish attitude-based reasons from object-based reasons. Attitude-based reasons count in favor of holding the mental state; object-based reasons count in favor of the content of that state. The core hypothesis is that intention admits only object-based reasons. Third, I will distinguish constitutive constraints from rational ideals. A constitutive constraint makes an attitude impossible if violated; a rational ideal makes it defective but possible.

  I will test these distinctions against comparative cases. I will compare the toxin case to Pascal's Wager (belief) and coercive threats (intention). If the toxin case patterns with belief, the constraint is likely constitutive. If it patterns with threats, where pragmatic reasons seem admissible, the constraint is likely an ideal. I will also examine cases of 'intending to intend' to see if pragmatic reasons work there even if they fail for first-order intention. This layered approach isolates whether the blockage occurs at the level of the attitude or the action plan.

  To determine if the constraint is constitutive, I will apply a 'failure test.' If an agent explicitly acknowledges the pragmatic reason as their sole motive for intending, does the intention vanish? If yes, the constraint is constitutive. If the intention persists but is deemed irrational, the constraint is an ideal. This involves constructing vignettes where agents have varying degrees of transparency about their motives and assessing whether we attribute intention to them. Furthermore, I will investigate the transparency constraint directly: can an agent deliberate about intending solely based on the benefits of intending? If deliberation collapses when restricted to pragmatic reasons, this suggests intention is transparent to the reasons for the act. I will also engage the 'guidance constraint.' If intention is for guiding action, pragmatic reasons unrelated to the action's value may fail to guide. I will test whether an agent motivated solely by the reward can use the intention to guide their drinking behavior tomorrow. If the intention cannot guide because the motive disconnects from the act, this supports the constitutive view. This functional analysis complements the conceptual work.

  **What success and failure would look like**

  Success looks like a definitive classification of the toxin puzzle within the wrong-kind-of-reason framework. I will be able to state whether the billionaire's offer is the wrong kind of reason for intention and whether this exclusion is constitutive or normative. A successful outcome provides a clear criterion for distinguishing reasons for attitudes from reasons for objects across agency. It resolves the stalemate between psychological impossibility and rational irrationality by showing which category the puzzle belongs to. This would clarify the architecture of practical reasoning, showing where pragmatic considerations enter deliberation.

  Failure looks like persistent ambiguity in the distinctions. If 'reason for an intention' proves too polysemous to resolve, or if the analogy between belief and intention collapses under scrutiny, the project fails. If the constitutive norm view cannot accommodate cases where agents successfully intend for pragmatic reasons (e.g., in pre-commitment strategies), the hypothesis is falsified. Ultimately, failure means leaving the question open: unable to say whether the constraint is a boundary of the concept or merely a rule of thumb. The project fails if it produces only a taxonomy of views without a verdict on the specific status of the toxin puzzle. The project must yield a binary verdict on the constitutive status.

  **Scope for one year**

  The year divides into three phases. Months one to three focus on literature synthesis and refining the distinctions between reason-types. I will draft the conceptual framework here. Months four to eight involve case construction and testing. I will write the vignettes and analyze intention attribution in varying motivational contexts. This is the core analytical work. Months nine to twelve are for writing and revision. I will draft the prospectus chapters and refine the argument based on feedback.

  This scope is narrow enough for one year because it isolates one puzzle and one theoretical framework. I am not solving the general wrong-kind-of-reason problem but applying it to this specific case. The deliverable is the prospectus itself, which will serve as the dissertation chapter. The plan of work ensures steady progress from conceptual clarification to empirical testing of intuitions to final synthesis.

  **How this could be wrong**

  The project could be wrong if the analogy between belief and intention is fundamentally disanalogous. Belief aims at truth; intention aims at action. If intention is essentially practical in a way that belief is not, pragmatic reasons might be the right kind for intention even if they are wrong for belief. If this is true, the entire framing collapses.

  The reasoning is most likely to break down on the constitutive test. If agents can intend for pragmatic reasons without self-deception, the constraint is not constitutive. If I find that 'intention' is too flexible a concept to support a rigid constitutive norm, the project cannot deliver a determinate answer. I need to know now if the transparency constraint is viable for intention before committing the year. If preliminary analysis shows intention responds to pragmatic reasons easily, I must abandon the WKR framing.
