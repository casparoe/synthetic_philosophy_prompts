      *   *Sidgwick Context:* Acknowledge Sidgwick's rigor (as per prompt) but show why the friend's specific analogy undermines the "ordinary science" claim.
      *   *Table:* Make sure the "Significance" column explains *why* the mapping is attempted.
      *   *Fault Lines:* Ensure I explain *why* these breaks matter for the argument (i.e., they prevent it from being "ordinary science").
      *   *Imports:* Keep it short.
