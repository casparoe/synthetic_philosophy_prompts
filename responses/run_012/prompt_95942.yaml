      *   **Claim:** Resistance to psychical research is temperamental (bias against the "supernatural"), not evidential.
      *   **Conclusion:** The remedy is better experiment, not dismissal; it's ordinary science in progress.

  3.  **Drafting "Correspondences":**
      *   Need to map elements of wireless/radiant physics to telepathy.
