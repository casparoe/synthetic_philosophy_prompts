      2.  *Energy/Conservation:* Rays carry energy. Thoughts apparently don't diminish the sender.
      3.  *Reproducibility:* X-rays happen every time you switch the tube on. Telepathy is probabilistic and elusive.
      *Selection:* I'll combine Instrumental Independence and Reproducibility as one major point (Methodology), and the Physical Carrier as the second (Ontology).

      *Refining "Imports":* The analogy imports a materialist ontology for a phenomenon that resists material localization. It assumes the problem is technical (better detectors) rather than conceptual.

