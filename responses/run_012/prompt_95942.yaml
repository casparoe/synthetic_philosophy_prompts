answer: |-
  ### Correspondences

  | Element | Source (19th-C Physics) | Target (Psychical Research) | Significance |
  | :--- | :--- | :--- | :--- |
  | **Transmitter** | Hertzian oscillator / X-ray tube | The "agent" or sending mind | Attempts to locate a discrete physical source for the phenomenon. |
  | **Medium** | Luminiferous ether / Vacuum | Space / Unknown psychological field | Posits a carrier substrate that allows action-at-a-distance without violating materialism. |
  | **Receiver** | Coherer / Photographic plate | The "percipient" or receiving mind | Equates human consciousness with a passive instrument capable of registering external signals. |
  | **Code** | Electromagnetic wavelength / Pulse | The thought-image or impression | Suggests information is encoded physically rather than semantically or magically. |
  | **Detector** | Galvanometer / Spectroscope | Experimental protocol (e.g., card guessing) | Implies that statistical methods can function like physical gauges to measure intensity. |
  | **Noise** | Atmospheric interference / Static | Distraction / Psychological bias | Frames failure cases as technical interference rather than evidence of non-existence. |

  ### Fault lines

  The first critical break occurs in the nature of the **detector**. In the source case, the detector (a photographic plate or coherer) is inanimate, objective, and operates independently of belief or expectation; it records the force whether the physicist wishes it to or not. In the target case, the detector is the human mind, which is subjective, suggestible, and inextricably linked to the phenomenon being measured. You cannot calibrate a human consciousness against a standard weight or voltage. This matters because the friend's argument rests on the claim that this is "ordinary science." Ordinary science requires instrumentation that separates the observer from the observed. By making the mind both the medium and the meter, psychical research lacks the instrumental independence that allowed 19th-century physics to move from speculation to engineering.

  The second break concerns **reproducibility and energy**. The invisible forces of the 19th century obeyed conservation laws; they could be generated on demand, amplified, shielded, and measured for energy decay over distance. Telepathy, even in the most favorable experimental accounts, remains probabilistic, elusive, and immune to amplification. You cannot build a "telepathic amplifier" to boost a weak signal, nor does the sender exhibit energy loss consistent with transmission. This disanalogy is fatal to the claim that skepticism is merely temperamental. Skepticism in physics was overcome because the phenomena forced themselves upon reality through consistent, mechanical repetition. Psychical research has not done this after a century; the resistance is not a bias against the "invisible," but a rational response to the lack of causal leverage and mechanical consistency.

  ### Imports

  The analogy smuggles in a physicalist ontology that the target case does not supply. It assumes telepathy involves emission, transmission, and reception of *something* akin to energy or matter, thereby bypassing the harder philosophical problem of how mind interacts with mind. It also imports the expectation of eventual technical mastery—that if we just build better "detectors" (protocols), we will capture the signal—ignoring the possibility that the phenomenon is either non-existent or fundamentally non-physical in a way that precludes instrumentalization.

  ### Verdict

  The conclusion does not survive. The analogy carries the entire weight of the argument; without it, the claim that psychical research is "ordinary science in progress" collapses under the lack of reproducible, instrument-independent evidence. The skepticism is evidential, not temperamental, because the phenomena have failed to behave like the invisible forces invoked in the comparison.

  ### Confidence

  I am highly confident in this audit, as the disanalogies regarding instrumentation and reproducibility are standard objections in the philosophy of science regarding psychical research. The point I am least sure of is whether there exist niche historical interpretations of "etheric psychology" from Sidgwick's own circle that might have offered a more robust physicalist model than the analogy credits, though this would not salvage the modern validity of the claim.
