      *(Self-Correction during drafting)*: Make sure to explicitly answer "what would have to be true... for it to satisfy that reading."
      *   For the Truism: It just has to predict.
      *   For the Metaphysical: It has to be the *only* one that predicts, regardless of interest.

      *(Refining the Colleague Analysis)*:
