      *   Use 2 (Pragmatic): He uses CNJ to devalue utility. He's treating Metaphysical Purity as a prerequisite for scientific validity.
      *   Diagnosis: He is equivocations between the *Methodological Maxim* (which everyone accepts) and the *Uniqueness Thesis* (which is dubious) to win points.

  8.  **Final Polish:** Check against all constraints in the prompt.
      *   Menu from tautological to metaphysical? Yes.
      *   Claims about world/concepts/practice? Yes.
      *   Trivial/Substantive/False? Yes.
      *   Compatibility? Yes.
      *   Criteria for satisfaction? Yes.
      *   Apply to two cases? Yes.
      *   Judge survival? Yes.

      *Let's ensure the philosophical references are implicit or explicit but accessible.* (Quine, Putnam, Boyd, Dupré are the background). I will write it as a handout.

      *Wait, one nuance:* The prompt asks for "distinct precise theses." I need to make sure they aren't just vague descriptions but claim-statements.
      *   Thesis 1: The Inductive Success Norm.
      *   Thesis 2: The Causal Grounding Claim.
      *   Thesis 3: The Uniqueness Doctrine.
      *   Thesis 4: The Interest-Independence Doctrine.

      *Wait, check the "Clinical Protocol" case.* If he says the taxonomy is correct *because* biology carves nature, he is asserting that the clinical categories map 1:1 onto biological mechanisms. This is often false in psychiatry/medicine (multiple realizability, spectrum issues). So his use might be *false* on the Causal Grounding reading.
