      *   *Refining Q3 (Ticker):* "If we put a live ticker up, does the 'right' move change as the number goes up?"
      *   *Refining Q4 (Kant):* "Kant's Categorical Imperative sounds like superrationality. Are you doing ethics or math?"
      *   *Refining Q5 (Code):* "If we replaced players with identical bots, you'd say 'don't play.' With humans, you say the same. What's the actual difference between the bot and the human that makes the logic hold?"
      *   *Refining Q6 (Idealization):* "When people say 'humans aren't that rational,' you say 'that's an objection to the idealization.' At what point does the idealization break so hard the theory is useless?"
      *   *Refining Q7 (Falsifiability):* "What outcome in *this* specific game would prove you wrong?"
      *   *Refining Q8 (Causality):* "You admit your choice doesn't *cause* theirs. So why act as if it does? Isn't that magical thinking?"
      *   *Refining Q9 (Money):* "In a one-shot against a standard economist, the superrationalist loses money. Is 'being right' worth being poorer?"
      *   *Refining Q10 (Definition):* "If I maximize my utility by defecting, and you maximize group utility by cooperating, why is your move called 'rational' and mine 'selfish'?"

      *   *Wait, I need to make sure the follow-ups are specific to her likely "slippery" responses.*
      *   *Constraint Check:* "Keyed to the answer she's most likely to give."
      *   *Likely Persona:* Academic, precise, distinguishes between normative and descriptive, likely invokes "logical correlation" rather than causal.

