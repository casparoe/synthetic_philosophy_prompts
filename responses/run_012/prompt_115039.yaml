answer: |-
  1. **The Personal Commitment**
  "We're recording this while the game is live. The pot is $25,000, tickets are $2, and the money leaves the player pool. Superrationality says you should reason that others will do what you do. So, right now: do you buy a ticket? Yes or no."

  *Follow-up (If she says No):* "So you are voluntarily conceding the $25,000 to anyone 'irrational' enough to play. If your theory rewards defectors with the entire pot, in what sense is it a theory of *winning*?"
  *Follow-up (If she says Yes):* "If you buy in, and everyone reasons like you, the total cost of tickets will dwarf the prize. Are you saying you know something about our readers' rationality that makes them different from you?"

  2. **The Stranger Objection**
  "Your logic relies on correlation: that your reasoning predicts mine. But our readers are a million strangers who've never heard of superrationality. Why should your internal logic correlate with a stranger in Ohio who just wants twenty-five grand?"

  *Follow-up:* "If you say 'because rationality is universal,' is that an empirical claim? If we run this and 90% of people play Nash equilibrium, do you update your model of human rationality, or do you say the humans are broken and the theory is still right?"

  3. **The Live Ticker**
  "We're debating putting a live ticker on the page showing total tickets sold. If that number is low, does your move change? Does seeing that others are 'cooperating' by not playing license you to buy a ticket?"

  *Follow-up:* "If the answer changes based on the count, then there is no single 'superrational' move, just a reaction function. Doesn't that collapse your theory back into standard expected-value reasoning with a different prior?"

  4. **Kant's Shadow**
  "Kant's Categorical Imperative says act only on maxims you can universalize. That sounds exactly like superrationality. Are you making a claim about what is *rational*, or are you just doing ethics in math clothing?"

  *Follow-up:* "If it's ethics, fine. But if you claim it's *instrumental rationality*, it needs to get the agent better outcomes. In a one-shot against a standard economist, the superrationalist loses money. Why call that 'rational'?"

  5. **The Machine Version**
  "Imagine we replace the readers with identical bots running the same code. You'd say they should all output 'Don't Play.' But humans aren't identical code. What is the actual mechanism in a human brain that creates the same correlation as identical source code?"

  *Follow-up:* "If the mechanism is 'transparency,' and humans are opaque to each other, isn't superrationality technically inapplicable to real life? Is the theory secretly about software, not people?"

  6. **The Idealization Dodge**
  "I've read your responses to critics. When the real world doesn't fit the model, you tend to say, 'That's an objection to the idealization, not the theory.' At what point does the idealization break so hard that the theory becomes useless?"

  *Follow-up:* "Newton's idealized models still predict eclipses. What does superrationality predict that Nash equilibrium doesn't, in a world where people can't read each other's minds?"

  7. **Acausal Magic**
  "You admit my choice doesn't *cause* yours. There's no signal. So when I act *as if* my choice controls yours, aren't I engaging in magical thinking? I'm paying a cost for an influence that doesn't exist."

  *Follow-up:* "Can you write the equation for that link? Or is 'logical correlation' a metaphor we're asked to bet $25,000 on without a mechanism?"

  8. **The Adversarial Design**
  "This game is designed by the magazine. We want ticket sales. Does knowing the designers *want* you to play enter the superrational calculation? Or is the logic hermetically sealed from the context?"

  *Follow-up:* "If context matters, then the 'single right answer' depends on your story about the designer. Doesn't that introduce the very ambiguity your theory is supposed to solve?"

  9. **Falsifiability**
  "Finally: what evidence would change your mind? Not 'better idealizations,' but a result. If ticket sales hit a specific number, or the winner is a specific type of player, do you abandon the framework?"

  *Follow-up:* "If the answer is 'nothing can falsify it because the refuters are just irrational,' then are we discussing science, or are we discussing a faith system for mathematicians?"
