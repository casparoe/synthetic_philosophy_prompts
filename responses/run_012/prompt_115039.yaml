          *   *Draft:* Does the live counter change things?
          *   *Refinement:* We might show a live ticket count. If it's low, does your move change?
          *   *Follow-up:* If yes, there's no "single right answer" independent of state. If no, you're ignoring data.
          *   *Counter:* "If the answer depends on the number, isn't that just standard EV calculation with a different variable?"

      *   *Q4: Rational vs. Right (Kant).*
          *   *Draft:* Is this just morality?
          *   *Refinement:* Kant says act only on maxims you can universalize. That sounds exactly like superrationality. Is your theory just ethics in math clothing?
          *   *Follow-up:* She'll distinguish "instrumental rationality" from "morality."
          *   *Counter:* "If it doesn't get you more money in a one-shot against a Nash player, in what sense is it 'rational' and not just 'nice'?"

      *   *Q5: The Machine/Code.*
