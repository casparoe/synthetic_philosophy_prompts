      *   *Q3 Follow-up:* If she says "The move depends on the count," ask: "Then there is no single superrational move, just a reaction function. Isn't that just standard game theory?"
      *   *Q4 Follow-up:* If she says "It's instrumental," ask: "Instrumental for whom? If it doesn't help *you* win, what utility are you maximizing?"
      *   *Q5 Follow-up:* If she says "Bots are transparent," ask: "So the theory requires transparency. Since humans are opaque, isn't superrationality inapplicable to real life?"
