      *   *Q1: Personal Commitment.* Need to pin her down.
          *   *Draft:* What will you do in our game?
          *   *Refinement:* Make it specific. Will you buy tickets? How many?
          *   *Follow-up:* If she says "None," ask if that's throwing away a free win if others play. If she says "Some," ask how she justifies the group loss.
          *   *Likely Answer:* She'll say "None" or "One." Let's assume "None" as the superrational ideal.
