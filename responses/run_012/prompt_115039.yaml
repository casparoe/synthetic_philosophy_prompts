      *   *Q6: The "Idealization" Dodge.*
          *   *Draft:* You always say objections are about idealizations.
          *   *Refinement:* You dismiss real-world messiness as 'violating the ideal.' When does the ideal fail the world, rather than the world failing the ideal?
          *   *Follow-up:* She needs a threshold.
