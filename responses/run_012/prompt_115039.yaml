prompt: |-
  I write about science and ideas for a monthly mag, and next Thursday I'm recording a long interview — podcast first, then it runs as a Q&A — with a decision theorist who's whole thing is 'superrationality': the idea that when you and the other players all know you'd reason your way to the same answer, you should pick whatever's best for all of you at once, rather than whatever's best for you given what the others do. She thinks that should be the default way to think about one-shot games, not a party trick.

  To give the interview some teeth, I've talked the magazine into running a stunt while we record, and I want the questions to keep yanking her back to it. Here's the game: we put $25,000 in escrow. Anyone can buy tickets at $2 a pop, as many as they want, and at the end one ticket gets picked at random and that person takes the whole $25,000. Ticket money doesn't go into the pot — it goes to the magazine, or to charity, whatever, just not back to the players. So if nobody buys a ticket, nobody wins anything but nobody's out anything either; if you're the only one who buys, you've basically got $25,000 for two bucks; and if everyone buys a stack, we're all shoveling money into a hole. We're still arguing about whether to put a live ticker on the page showing how many tickets have sold so far.

  Give me eight to ten questions, each with a follow-up keyed to the answer she's most likely to give. I want: one that makes her say out loud what she'd personally do in our game and defend it; one on the standard complaint that 'we'd all reason the same way' is a fantasy when the other players are a million strangers who've never heard of the puzzle — and whether her view just collapses into ordinary expected-value reasoning with an odd prior about other people; one on the ticker, and whether her answer changes once people can see the running total, and what that does to the idea that there's a single right answer; one on whether superrationality is a claim about what's rational or about what's right, because if it's the second one I want to know what's supposed to separate it from just telling people to universalize their maxims; and one on the machine version — if every entrant were the same model running the same code, is her answer different, and if so, is the theory secretly about transparency rather than about reasoning? She's slippery, and her move whenever the idealization gets pressed is some version of 'that's an objection to the idealization, not to the theory', so build the sequence so that gets harder and harder to pull. Land on one question about what evidence or result would definately change her mind. Skip the how-did-you-get-into-this stuff, and keep them short enough to actually ask out loud.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Interviewee:** A decision theorist specializing in "superrationality" (Hofstadter-style, likely associated with EGT, FDT, or similar frameworks).
      *   **Core Concept:** Superrationality (reasoning that identical rational agents will reach the same conclusion, so cooperate/maximize group utility even in one-shot games).
      *   **Format:** Podcast recording first, then Q&A text for a monthly magazine.
      *   **Context:** A specific "stunt" game is running concurrently with the interview.
      *   **The Game:** $25k prize. Tickets cost $2. Tickets don't add to the pot (go to mag/charity). One random winner. Unlimited tickets per person.
          *   *Structure:* This is essentially a lottery with a fixed prize and variable odds based on participation, but the cost is sunk. Wait, let's analyze the game theory.
          *   *Payoff:* If I buy $n$ tickets and total tickets are $T$, my probability of winning is $n/T$. Prize is $P$. Cost is $2n$. Expected Value (EV) = $(n/T) * P - 2n$.
          *   *Collective Outcome:* If everyone buys 0, no one wins, no one loses. If everyone buys 1, pot is split probabilistically, but money leaves the system. The *group* loses money overall (since ticket costs leave the system).
          *   *Superrational Angle:* A superrationalist should reason: "If I buy tickets, others like me will too. If we all buy many, we all lose money on average. If we all buy none, we lose nothing but win nothing. If we all buy one, we still lose money on aggregate (since $2 \times T > 25,000$ eventually)." Actually, the superrational move here is likely *not to play* or to play minimally to keep the total tickets low enough that EV is positive, but since costs leave the system, the global maximum is *nobody plays*.
          *   *Wait, re-reading the prompt:* "if everyone buys a stack, we're all shoveling money into a hole." This implies the ticket cost is a loss to the group. So the "cooperative" solution is for *no one* to buy tickets (or very few). But individually, if no one buys, buying one ticket guarantees a win for $2. This is a variation of the Prisoner's Dilemma/Tragedy of the Commons.
      *   **Requirements:** 8-10 questions. Each needs a follow-up keyed to the *likely* answer.
      *   **Specific Topics to Cover:**
          1.  Personal action in this specific game (commitment).
          2.  The "million strangers" objection (correlation vs. causality/prior).
          3.  The Live Ticker (information flow changing the "single right answer").
          4.  Rationality vs. Morality (Universalizability/Kant).
          5.  The Machine/Code version (transparency vs. reasoning).
          6.  Falsifiability (what changes her mind).
      *   **Tone:** Sharp, "teeth," keeping her from dodging into idealizations. Short enough for spoken word.
      *   **Constraint:** She is "slippery" and tends to dismiss objections as attacks on idealizations. The questions need to corner this.

  2.  **Deconstruct the Game for the Questions:**
      *   Prize: $25,000.
      *   Cost: $2/ticket.
      *   Mechanism: Random draw among tickets.
      *   External Cost: Money leaves the player pool.
      *   Superrational Goal: Maximize group utility. Since money leaves the pool, group utility is maximized if *no one plays* (status quo) or if the total spend is less than the prize (but since it's a lottery, the expected return for the group is always negative if $2 \times \text{Total Tickets} > 25,000$). Actually, if total tickets $T < 12,500$, the group *as a whole* wins money (Prize 25k - Cost 2T). If $T > 12,500$, the group loses.
      *   *Correction:* The prompt says "Ticket money... goes to the magazine... not back to the players." So yes, it's a negative sum game for the players collectively once costs exceed prize.
      *   *Superrational Move:* Coordinate to keep total tickets low (under 12,500) or zero. But since you can't coordinate, you assume your decision correlates with others. If I buy 1, others buy 1. If I buy 100, others buy 100. Therefore, I should buy 0 (or 1 if I think others will buy 0).
      *   *Nash Equilibrium:* Buy until EV = 0. (Depends on expectations of others).

