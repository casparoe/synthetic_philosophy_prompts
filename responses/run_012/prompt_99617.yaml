answer: |-
  **A:** Let's look at the plaque again. "Person 50,000,000,000." Five times ten to the tenth. We have three hypotheses on the table, equal priors. Short ($10^{11}$), Long ($10^{13}$), and Vast ($10^{30}$). If I am a random sample from the sequence, the probability of drawing number $5 \times 10^{10}$ is simply one over the total length.

