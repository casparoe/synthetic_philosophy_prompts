  **A:** There is a disanalogy. My prediction is based on a specific datum: my rank. I am actually observing number 50 billion. You are basing your prediction on the mere fact of existence, which is constant across all hypotheses where I am present.

  **B:** Existence is not constant. The *probability* of existence is not constant. Think of it this way: If God flips a coin. Heads: creates 1 person. Tails: creates 1 million people. You wake up. Are you equally likely to be in the Heads world or the Tails world?

  **A:** Yes. The coin was fair.

  **B:** But there are 1 million of you in the Tails world and only 1 in the Heads world. If you bet on Tails, a million versions of you win. If you bet on Heads, only one wins. To maximize the proportion of correct guesses across the multiverse of possibilities, you must bet on Tails.

  **A:** I am not trying to maximize the number of correct guesses across the multiverse. I am trying to assess the probability of *this* world. The fact that there are more losers in the Tails world doesn't make the coin land Tails more often.

  **B:** But you aren't a random world-selector. You are a random observer. That is the substantive disagreement. You treat the world as the random variable; I treat the observer as the random variable.

  **A:** And this leads me to your vulnerability. If I am a random observer, I need to know what counts as an observer. In this scenario, we are counting "Persons." But what defines a Person?

  **B:** We stipulated the sequence assigns numbers to Persons.

  **A:** But in the real world, there is no plaque. If I apply SSA to the real Doomsday Argument, the result depends entirely on the reference class. If the class is "all conscious beings," and AI or aliens exist, my rank is very low, and the future is long. If the class is "humans born before 2100," my rank is high, and the future is short. The conclusion swings wildly based on an arbitrary boundary.

  **B:** That is a fair criticism of SSA. The reference class problem is severe. If you cannot define the class non-arbitrarily, the Doomsday conclusion is unstable.

