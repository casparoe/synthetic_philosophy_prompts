prompt: |-
  Health systems that ration care by cost per QALY put treatments on a single scale, fund whatever falls below a threshold, and treat a year of life in full health gained by one patient as interchangeable with a year gained by any other. Regulatory cost-benefit analysis does something similar when it converts reductions in mortality risk into money at a uniform value of a statistical life. Yet the same disciplines that generate these numbers officially hold that utility is ordinal and that comparing one person's welfare with another's is meaningless. Reconstruct the theory of interpersonal utility comparison these practices presuppose: what they must assume about the cardinality of welfare, about a common unit or numeraire in which gains to different people can be summed, and about the equal weighting of persons. Note that where the numbers are built from willingness to pay, the practice presupposes something stronger still — that a dollar marks the same, or at least a knowable, increment of welfare for rich and poor alike. Then distinguish what the practices strictly require from what they merely happen to assume, say which rival views (prioritarianism, a Rawlsian lexical priority for the worst off, a resolutely ordinal approach) would leave the arithmetic of cost per QALY intact and which would break it, and identify the points at which the practice is philosophically underdetermined, so that several incompatible theories of welfare would license the same spreadsheet.
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Deconstruct the Prompt:**

      *   **Core Subject:** Health systems rationing by cost per QALY (Quality-Adjusted Life Year) and Regulatory Cost-Benefit Analysis (CBA) using Value of a Statistical Life (VSL).
      *   **The Tension:** These practices treat welfare/life as cardinal, comparable, and aggregatable (interpersonal utility comparison - IUC). However, standard economic theory (orthodox microeconomics) claims utility is ordinal and IUC is meaningless.
      *   **Task 1: Reconstruct the Presupposed Theory:** What *must* these practices assume about:
          *   Cardinality of welfare.
          *   Common unit/numeraire.
          *   Equal weighting of persons.
          *   (Specifically for WTP/CBA) The marginal utility of money (rich vs. poor).
      *   **Task 2: Distinguish Requirements vs. Contingencies:** What is strictly *required* for the math to work vs. what is just *happened* to be assumed?
      *   **Task 3: Evaluate Rival Views:** Which alternative ethical frameworks (Prioritarianism, Rawlsianism, Ordinalism) would break the arithmetic vs. leave it intact?
      *   **Task 4: Identify Underdetermination:** Where is the practice philosophically underdetermined? (i.e., where do incompatible welfare theories yield the same spreadsheet?)

  2.  **Initial Brainstorming & Concept Mapping:**

      *   *QALY:* 1 QALY = 1 year in perfect health. Implicitly assumes we can measure "quality" cardinally (0 to 1) and sum across people. Assumes a QALY for Patient A = QALY for Patient B.
      *   *VSL/CBA:* Converts risk reduction to dollars. Implicitly assumes $X means the same welfare gain/loss across individuals (or at least is comparable).
      *   *Orthodox Economics:* Pareto efficiency, ordinal utility, revealed preference. No "utils." IUC is scientifically forbidden.
      *   *The Contradiction:* Policy makers act like classical utilitarians (summing welfare) while economists say "you can't do that."
      *   *Cardinality:* Needs to be ratio-scale (zero point matters, intervals matter) to do cost-effectiveness ratios.
      *   *Numeraire:* QALYs or Dollars. Needs to be a common currency of value.
      *   *Weighting:* Standard practice implies utilitarianism (equal weight). Prioritarianism would weight the worse off more. Rawls would ignore the sum and look at the minimum.
      *   *WTP Issue:* If WTP is used, $1 for a poor person represents more utility loss than $1 for a rich person (diminishing marginal utility of money). Using unadjusted WTP assumes constant marginal utility of money or ignores the distributional impact.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. The "Official Story" (ordinal utility) vs. The "Practical Reality" (cardinal aggregation). State the thesis: These practices operate on a tacit, robust form of Classical Utilitarianism that contradicts their methodological foundations.

      *   **Section 1: Reconstructing the Presupposed Theory (The "Shadow Ontology"):**
          *   *Cardinality:* It's not just ranking. It's measuring magnitude. A 0.5 QALY gain is twice a 0.25 gain. Zero exists (death/no health).
          *   *Interpersonal Comparability:* My QALY = Your QALY. This requires a common psychological or functional metric.
          *   *The Numeraire:* Health time (QALY) or Money (VSL).
          *   *The WTP Assumption:* This is crucial. If VSL is derived from WTP, treating $1 as uniform assumes the marginal utility of income is constant across the population. This is empirically false but methodologically necessary for simple aggregation.

      *   **Section 2: Requirements vs. Contingencies:**
          *   *Strict Requirements:* Cardinality, Unit Comparability (same scale), Aggregability (summing is meaningful).
          *   *Contingent/Happened to Assume:* Equal weighting (Utilitarianism). You *could* weight QALYs differently (e.g., severity weighting), but standard practice usually doesn't. The specific metric (QALY vs. DALY vs. $) is contingent, but the *structure* of the metric is required.

      *   **Section 3: Rival Views (The Stress Test):**
          *   *Prioritarianism:* Gives extra weight to the worse off. This *breaks* the simple sum. You'd need a weighted QALY spreadsheet. The arithmetic changes.
          *   *Rawlsian (Maximin):* Completely breaks it. You don't sum; you look at the floor. Cost-effectiveness ratios become irrelevant if the worst-off aren't helped.
          *   *Resolutely Ordinal:* Breaks it entirely. You can't divide Cost by QALY if QALY isn't a real number representing magnitude. You can only do Pareto improvements (which rarely exist in rationing).

      *   **Section 4: Philosophical Underdetermination (The "Same Spreadsheet, Different Story"):**
          *   *Hedonism vs. Preference Satisfaction:* A QALY could be "pleasure years" or "satisfied preference years." The spreadsheet looks the same.
          *   *Objective List vs. Subjective:* Whether health is good *for* you or just biologically functioning.
          *   *Utilitarianism vs. Sufficientarianism (within the threshold):* If everyone is below a sufficiency threshold, maximizing sum might look like satisfying sufficiency.
          *   *The "Black Box" of the QALY:* The method of elicitation (TTO, SG) hides the underlying theory of value.

      *   **Conclusion:** Summarize the tension. The practice is a form of "applied utilitarianism" that denies its own theoretical lineage. It works pragmatically but lacks philosophical coherence according to its own disciplinary rules.

  4.  **Refining and Polishing:**

      *   *Tone:* Academic, analytical, precise.
      *   *Key Terminology:* Ensure correct use of "ordinal," "cardinal," "ratio-scale," "interpersonal utility comparison (IUC)," "marginal utility of income," "prioritarianism," "lexical priority."
      *   *Check against Prompt:* Did I address the WTP/Rich-Poor issue specifically? Yes. Did I distinguish requirements from contingencies? Yes. Did I cover Rawls/Prioritarianism/Ordinalism? Yes. Did I cover underdetermination? Yes.
      *   *Self-Correction during drafting:* I need to make sure I don't just say "Utilitarianism." I need to specify *Classical Total Utilitarianism* with *Unit Comparability*. Also, need to be careful about the WTP point: CBA often *acknowledges* distributional weights are possible but rarely uses them. The prompt asks what the *practice* presupposes, which is usually unweighted dollars.
      *   *Nuance on QALYs:* QALYs are technically ratio-scaled (0 = death, 1 = perfect health). This is stronger than interval scaling.
      *   *Nuance on VSL:* VSL is an aggregation of marginal WTP for small risk reductions. It implies linearity in risk but hides the income effect.

  5.  **Final Review:** (Looking over the generated response to ensure it flows logically and hits all constraints.) The structure looks solid. The distinction between what is *mathematically necessary* for the ratio to exist vs. what is *ethically chosen* (weights) is key. The underdetermination section needs to highlight that the *numbers* don't reveal the *moral theory*.

  6.  (Proceed to generate output based on these thoughts.)
answer: |-
  The tension you identify lies at the heart of modern policy analysis: a disconnect between the *methodological individualism* of orthodox economics and the *aggregative consequentialism* of policy practice. Health technology assessment (HTA) bodies (like NICE in the UK) and regulatory agencies (like the EPA or DOT in the US) operate spreadsheets that function as moral arithmetic. Yet, the microeconomic theory underpinning the data inputs officially forbids the operations performed on them. To make sense of this, we must reconstruct the tacit moral ontology these practices rely upon, distinguish necessary structural assumptions from contingent ethical choices, and map the boundaries where the math breaks or becomes philosophically ambiguous.

  ### I. The Reconstructed Theory: Tacit Classical Utilitarianism

  For cost-per-QALY and Value of a Statistical Life (VSL) calculations to function as decision rules, they must presuppose a theory of welfare that orthodox economics explicitly rejects. Specifically, they rely on a robust form of **Classical Total Utilitarianism** with **Full Interpersonal Comparability**.

  **1. Cardinality and Ratio-Scaling**
  Orthodox economics treats utility as ordinal (ranking $A > B$). However, a cost-effectiveness ratio ($C/E$) requires the denominator ($E$) to be cardinal. To say a treatment costs \$50,000 per QALY implies that 1 QALY is a specific magnitude of value, and that 2 QALYs is exactly twice that value. Furthermore, QALYs utilize a ratio scale: there is a non-arbitrary zero (death or health state equivalent to death) and a unit (one year in perfect health). Without ratio-scale cardinality, the arithmetic of division and summation is meaningless.

  **2. The Common Numeraire and Unit Comparability**
  The practice assumes a single currency of value. In QALY systems, the numeraire is "health-adjusted time." In CBA, it is money. For the summation $\sum W_i$ (total welfare) to be valid, the unit must be **unit-comparable**. A QALY gained by a 20-year-old must be ontologically identical to a QALY gained by an 80-year-old; a dollar of benefit to a rural farmer must be the same unit as a dollar of benefit to an urban banker. This presupposes that welfare is a homogeneous substance that can be displaced across persons without loss of meaning.

  **3. Equal Weighting (Anonymity)**
  The standard spreadsheet treats persons as vessels for value. It presupposes the principle of anonymity: $W = \sum u_i$. The identity of the person holding the utility does not matter, only the magnitude. This is the definition of classical utilitarianism. It rejects any weighting function $w_i$ based on desert, status, or prior welfare level.

  **4. The Stronger Assumption of Willingness-to-Pay (WTP)**
  Where VSL is derived from WTP, the practice presupposes something empirically dubious but methodologically necessary: **the constant marginal utility of money.**
  If a regulatory agency sums WTP to determine a policy's benefit, it treats a dollar as a proxy for a unit of welfare. However, economic theory dictates diminishing marginal utility of income; a dollar provides more welfare to a poor person than a rich person. By aggregating unadjusted dollars, the practice assumes either:
  *   (a) The marginal utility of income is constant across the population (empirically false).
  *   (b) Distributional concerns are irrelevant to efficiency (a normative claim).
  *   (c) The dollar is not a proxy for welfare but a proxy for *sovereignty* (counting preferences regardless of intensity), which contradicts the welfarist justification for CBA.
  To treat the VSL as a uniform number across income groups is to assume that a dollar marks a knowable, identical increment of welfare for rich and poor alike.

  ### II. Requirements vs. Contingencies

  It is vital to distinguish what is mathematically required for the spreadsheet to function from what is ethically contingent in current practice.

  **Strict Requirements (The Arithmetic Constraints)**
  1.  **Cardinality:** Welfare must be measurable in magnitudes, not just ranks.
  2.  **Commensurability:** Costs (money) and Benefits (life/health) must be reducible to a common ratio, even if they remain in different units (e.g., $/QALY).
  3.  **Aggregability:** Gains and losses across different individuals must be capable of netting out. A loss to Patient A must be capable of being "outweighed" by a gain to Patient B.
  4.  **Linearity:** The value of the $n$-th QALY must be comparable to the $(n+1)$-th QALY to allow for thresholding.

  **Contingent Assumptions (The Ethical Choices)**
  1.  **Equal Weighting:** The arithmetic *allows* for differential weighting, though standard practice rarely uses it. One could calculate cost-per-*weighted*-QALY. The failure to weight is a policy choice, not a mathematical necessity.
  2.  **The Specific Numeraire:** The system requires *a* numeraire, but it need not be QALYs. It could be DALYs (Disability-Adjusted Life Years), HYEs (Healthy Year Equivalents), or dollars. The choice of metric is contingent on what aspect of welfare the agency chooses to prioritize.
  3.  **The Threshold Value:** The existence of a threshold (e.g., \$50,000/QALY) is a budget constraint, not a metaphysical truth. The arithmetic works without a fixed threshold, but the *rationing decision* requires one.

  ### III. Rival Views: Stress-Testing the Arithmetic

  If we substitute the tacit utilitarianism with rival ethical frameworks, the integrity of the spreadsheet varies.

  **1. Prioritarianism (Intact but Modified)**
  Prioritarianism holds that benefits matter more the worse off the recipient is.
  *   *Effect on Arithmetic:* This does not break the cardinality or aggregability requirements. However, it breaks the *equal weighting* assumption. The spreadsheet would remain intact structurally, but the $E$ column would change from $QALYs$ to $Weighted\_QALYs$. The math still works, but the input values change. A treatment for the severely disabled might yield fewer physical QALYs but more "prioritarian value," altering the ranking.
  *   *Verdict:* The arithmetic survives, but the standard practice of unweighted summation is invalidated.

  **2. Rawlsian Lexical Priority (Broken)**
  Rawls's Difference Principle (specifically the lexical priority of liberty and the maximin rule for social primary goods) forbids trading off the basic status of the worst-off for the aggregate gain of the better-off.
  *   *Effect on Arithmetic:* This breaks the **Aggregability** requirement. You cannot sum across persons if the welfare of the bottom tier has lexical priority. A treatment that saves the life of the worst-off individual must be funded even if the cost per QALY is astronomical, and even if it displaces many QALYs for the better-off.
  *   *Verdict:* The cost-effectiveness ratio becomes irrelevant. The spreadsheet cannot rank options; it can only check constraints.

  **3. Resolutely Ordinal Approach (Broken)**
  If we adhere strictly to the Pareto criterion and ordinal utility:
  *   *Effect on Arithmetic:* This breaks **Cardinality** and **Commensurability**. You cannot divide Cost by QALY if QALY is not a ratio-scaled magnitude. You can only identify Pareto improvements (where someone gains and no one loses). Since rationing inherently creates losers (those denied care), ordinalism offers no decision rule for resource allocation under scarcity.
  *   *Verdict:* The spreadsheet becomes philosophically illegitimate. It presents false precision.

  ### IV. Philosophical Underdetermination

  Perhaps the most striking feature of these practices is that the spreadsheet is compatible with multiple, incompatible theories of welfare. The numbers do not reveal the moral theory; they merely mask it.

  **1. Hedonism vs. Preference Satisfaction**
  A QALY is typically elicited via Time Trade-Off or Standard Gamble.
  *   *Theory A (Hedonism):* The patient is estimating future pleasure/pain.
  *   *Theory B (Preference Satisfaction):* The patient is estimating how well the state matches their desires.
  *   *Underdetermination:* The resulting number (e.g., 0.7 utility weight) is identical in both cases. The spreadsheet cannot distinguish whether it is maximizing pleasure or satisfying preferences. These are ontologically distinct views of the good, yet they license the same allocation.

  **2. Objective List vs. Subjective Experience**
  *   *Theory A:* Health is objectively valuable (functioning).
  *   *Theory B:* Health is valuable only insofar as it is experienced as good.
  *   *Underdetermination:* If a patient adapts to a disability (the "disability paradox"), their subjective valuation of that state rises. A QALY system using subjective weights will fund less treatment for the disabled than a system using objective biological functioning weights. Yet, both claim to measure "health utility." The practice does not settle whether it is measuring *capacity* or *contentment*.

  **3. Sufficientarianism vs. Utilitarianism (within the threshold)**
  *   *Theory A:* We maximize total QALYs (Utilitarianism).
  *   *Theory B:* We ensure everyone reaches a threshold of health (Sufficientarianism).
  *   *Underdetermination:* In a context of fixed budgets where most treatments are below the cost-effectiveness threshold, a Utilitarian maximizer and a Sufficientarian might fund the exact same basket of goods. The spreadsheet looks identical, but the justification differs. The Utilitarian funds Treatment X because it yields the *most* QALYs; the Sufficientarian funds it because it brings people *over the line*. If the budget shrinks, their paths diverge, but the current practice hides this divergence behind the single metric of "efficiency."

  ### Conclusion

  Health rationing by cost-per-QALY and regulatory CBA are exercises in **applied classical utilitarianism** conducted by institutions that officially espouse **ordinal welfarism**. To function, these practices must assume that welfare is cardinal, ratio-scaled, interpersonally comparable, and that the marginal utility of the numeraire (money or health) is sufficiently uniform to allow aggregation.

  While the arithmetic can accommodate prioritarian weighting, it is shattered by Rawlsian lexical priorities or a strict ordinalist stance. Ultimately, the spreadsheet is a site of philosophical underdetermination: it allows policymakers to act as if the nature of the good (pleasure, preference, functioning) has been settled, when in fact the numbers are compatible with mutually exclusive theories of value. The practice resolves the "impossibility" of interpersonal comparison not by solving the philosophical problem, but by bureaucratic fiat, treating the QALY and the Dollar as if they were physical constants rather than moral constructs.
