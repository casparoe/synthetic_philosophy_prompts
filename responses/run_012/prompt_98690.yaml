prompt: |-
  I'm a backend engineer, no philosophy background at all, but I've been reading a lot of mech interp stuff lately and I keep getting stuck on the same question: when someone says "the model represents the concept X in layer 7," what does that even mean, and how would we know? Everyone seems to have their own private standard. Someone trains a linear probe on the activations, it decodes the label with 95% accuracy, and they say the concept is there. Someone else says ok but I can train a probe on a randomly initialized network and get 80% too, so what did you actually show. Someone else has a steering vector that flips the behavior when you add it, and says that's the real evidence because it's causal. And then there's superposition, where there are way more features than dimensions so nothing has its own direction, and polysemantic neurons that light up for like five unrelated things, and the annoying fact that I've trained the same tiny net twice with different seeds and it solves the task with what looks like a totally different internal code. So before I read any more of these papers I want the spec first.

  Can you write me the desiderata -- what any adequate theory of "this network represents X" has to actually deliver? Not a definition, a checklist. Concretely I want: which cases it has to get right (the probe that decodes but the network never seems to use it; the probe on a random net; the steering vector that works and the random vector that also kind of works; superposition; polysemantic units; two nets that behave identically but code it differently; and the case where a net solves a task in a way I didn't expect and there's no ground truth to compare against), which puzzles it has to dissolve rather than just talk around, and which distinctions it can't collapse -- like representing X versus merely carrying information about X, representing versus computing, and representing X versus representing X-under-some-description. For each requirement give me the actual case or consideration that motivates it, so I can tell which ones are real constraints and which are just one camp's taste. Also mark which ones you think are non-negotiable and which are preferences.

  The part I most want is where the list turns on itself: are any of these jointly unsatisfiable? I have a suspicion that the requirement that a representation be individuated by its causal role in the network clashes with the requirement that we be able to say what it's *about* independent of the network's quirks, but I don't have the vocabulary to say why. And tell me which single requirement does the most to kill off the popular views on offer, because that's the one I'll use to filter everything I read next. Skip scoring the actual theories, I'll do that myself once I have the criteria.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for a theory of representation in mechanistic interpretability:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Backend engineer. Pragmatic, systems-oriented, dislikes vagueness ("private standard"), wants a "spec" or "checklist." No philosophy background but familiar with mech interp jargon (probes, steering vectors, superposition, polysemanticity).
      *   **Core Problem:** Confusion over what it means to say "the model represents concept X." Conflicting evidence standards (probes vs. causality vs. randomness).
      *   **Task:** Write a set of *desiderata* (requirements/checklist) for an adequate theory of representation in neural networks.
      *   **Specific Constraints:**
          *   Not a definition, but a checklist.
          *   Must address specific cases: decoding probes (high acc vs. random net), causal steering (real vs. random), superposition, polysemanticity, isomorphic behaviors/different codes, unexpected solutions/no ground truth.
          *   Must address distinctions: representing vs. carrying info, representing vs. computing, representing X vs. X-under-description.
          *   Must mark Non-Negotiable vs. Preference.
          *   **Crucial:** Identify joint unsatisfiability (trade-offs/contradictions).
          *   **Crucial:** Identify the single requirement that kills the most popular views (the "filter").
          *   Skip scoring actual theories.

  2.  **Deconstruct the Philosophical/Technical Tension:**
      *   The user is hitting on the "Representation Problem" in cognitive science/AI, specifically the tension between *informational* accounts (what can be decoded?) and *functional/causal* accounts (what does the activation *do*?).
      *   *Probe Problem:* High accuracy $\neq$ representation (random nets decode).
      *   *Causal Problem:* Steering works $\neq$ specific representation (random vectors might work due to chaos/collapse).
      *   *Superposition/Polysemanticity:* One dimension $\neq$ one concept.
      *   *Realization Independence:* Same function, different weights = same representation? Or different?
      *   *Intentionality:* What makes a state *about* X?

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Causal Efficacy.* If it represents X, changing it should change X-related behavior. (Motivation: Steering vectors).
      *   *Requirement 2: Informational Specificity.* It can't just be correlated; it must distinguish X from not-X better than chance/random nets. (Motivation: Probe on random nets).
      *   *Requirement 3: Robustness/Stability.* Small perturbations shouldn't destroy the representation. (Motivation: Superposition/Noise).
      *   *Requirement 4: Realization Independence.* If two nets do the same thing, do they represent the same thing? (Motivation: Different seeds).
      *   *Requirement 5: Granularity.* Distinguish "computing X" from "storing X". (Motivation: Representing vs. Computing).
      *   *Requirement 6: Content Determination.* How do we know it's X and not Y? (Motivation: X-under-description).

      *Refining for the "Backend Engineer" Persona:* Use terms like "API," "State," "Side Effects," "Coupling," "Spec." Avoid heavy philosophical jargon (intentionality, teleosemantics) unless defined operationally.

  4.  **Addressing the Specific Cases:**
      *   *Probe decodes but unused:* Needs a "Usage" constraint.
      *   *Probe on random net:* Needs a "Baseline/Null Model" constraint.
      *   *Steering works:* Needs a "Specificity" constraint (does it break other things?).
      *   *Superposition:* Needs a "Basis Independence" or "Feature Geometry" constraint.
      *   *Different seeds:* Needs "Functional Isomorphism" handling.
      *   *No ground truth:* Needs "Internal Consistency" or "Predictive Power."

  5.  **Identifying the Tensions (The "Turn on Itself" section):**
      *   *The Big Conflict:* **Causal Role vs. Content Stability.**
      *   If representation is defined *only* by causal role (what it does in *this* network), then two networks with different weights but same output have *different* representations (violates Realization Independence).
      *   If representation is defined *only* by content (what it maps to in the world), then we can't explain superposition or polysemanticity easily (violates Causal Specificity).
      *   *The "Killer" Requirement:* **The Usage Constraint (Decoupling Information from Representation).** This kills the "Probe = Representation" view immediately.

  6.  **Developing the Checklist (Drafting content):**

      *   *R1: The Usage Constraint (Non-Negotiable).* Info $\neq$ Rep. Must be used by downstream layers.
      *   *R2: The Null-Model Baseline (Non-Negotiable).* Must beat random/uncorrelated baselines.
      *   *R3: Causal Specificity (Non-Negotiable).* Intervention on Rep(X) affects X-behavior, not Y-behavior.
      *   *R4: Basis/Geometry Agnosticism (Preference/Non-Neg).* Must handle superposition (not just axis-aligned).
      *   *R5: Realization Independence (Preference).* Same function $\rightarrow$ Same rep? (This is the tricky one).
      *   *R6: Content Stability (Non-Negotiable).* X must be X, not X-under-interpretation.

  7.  **Refining the "Killer" and "Contradiction":**
      *   *Contradiction:* **Local Causality vs. Global Semantics.** To know it represents "dog," you need to know about the world (global). To know it's a mechanism, you need to look at weights (local). Bridging this gap is the hard problem.
      *   *Actually, a better contradiction for an engineer:* **Causal Individuation vs. Functional Abstraction.** If I define rep by *exact* causal path, I can't abstract across architectures (killing Realization Independence). If I abstract too much, I lose mechanistic grounding.
      *   *The Killer:* **The Usage Constraint.** It kills the "Probe Culture."

  8.  **Final Polish (Tone and Structure):**
      *   Keep it dry, precise, spec-like.
      *   Use bolding for emphasis.
      *   Ensure the "Non-Negotiable" vs. "Preference" tags are clear.
      *   Make sure the "Turn on Itself" section directly addresses the user's suspicion about causal role vs. aboutness.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address polysemanticity? *Adjustment:* Add a requirement about feature geometry or disentanglement.
      *   *Check:* Did I address the "random net probe" issue? *Adjustment:* Ensure the Null-Model Baseline is strong.
      *   *Check:* Is the distinction between "computing" and "representing" clear? *Adjustment:* Add a temporal/state distinction (storage vs. transformation).
      *   *Check:* User asked for "which single requirement does the most to kill off popular views." *Decision:* The Usage Constraint (Information $\neq$ Representation) is the strongest filter against current probe-heavy papers.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a spec for a **Theory of Neural Representation**. It is written for a systems engineer. It treats "representation" not as a metaphysical property, but as a subsystem interface contract.

  If a theory cannot satisfy the **Non-Negotiable** items, it is debuggable only by changing the definition of "representation" (i.e., it is talking about something else). If it fails the **Preferences**, it is technically adequate but practically brittle.

  ### Part 1: The Desiderata Checklist

  #### 1. The Usage Constraint (Non-Negotiable)
  *   **The Spec:** A state $S$ in layer $L$ represents $X$ only if downstream layers $L_{+n}$ *read* $S$ to produce behavior related to $X$.
  *   **Motivation:** Solves the "Probe on Random Net" and "Unused Probe" cases. You can train a linear probe on random noise or on a layer the network ignores and get high accuracy (information is present). But if the network doesn't route that signal to the output, it's not a representation *for the network*; it's just a correlation *for you*.
  *   **Test:** Ablate the connection between $S$ and downstream layers. If task performance on $X$ does not degrade, $S$ was not a representation of $X$, it was epiphenomenal.

  #### 2. The Null-Model Baseline (Non-Negotiable)
  *   **The Spec:** Any metric claiming $S$ represents $X$ (probe accuracy, steering effect size) must be normalized against a structured null model (e.g., same architecture, random weights, or same weights, shuffled labels).
  *   **Motivation:** Solves the "Probe on Random Net" case. High accuracy is meaningless without a baseline. In high-dimensional spaces, linear separability is cheap. A theory must distinguish "structure found" from "structure expected by chance."
  *   **Test:** Report $\text{Score}_{\text{model}} - \text{Score}_{\text{null}}$. If $\Delta \approx 0$, the claim is invalid.

  #### 3. Causal Specificity (Non-Negotiable)
  *   **The Spec:** Intervening on $S$ (e.g., adding a steering vector) must affect behavior related to $X$ *more* than it affects behavior related to orthogonal concepts $Y, Z$.
  *   **Motivation:** Solves the "Steering Vector" case. In chaotic high-D systems, pushing *any* vector can collapse the distribution and change output. If adding vector $v$ flips "dog" to "cat" but also breaks grammar and math, $v$ isn't a "dog representation"; it's a "break the network" lever.
  *   **Test:** Measure the covariance of the intervention effect. $\text{Effect}(X) \gg \text{Effect}(\text{Orthogonal Tasks})$.

  #### 4. The Storage/Compute Distinction (Non-Negotiable)
  *   **The Spec:** The theory must distinguish between *representing* $X$ (storing the value) and *computing* $X$ (the transient process of deriving it).
  *   **Motivation:** Solves the "Representing vs. Computing" distinction. A neuron might fire *during* the calculation of "is this a dog?" without ever holding the result "dog." Representation implies a stable state that persists long enough to be read by multiple consumers.
  *   **Test:** Temporal localization. Does the signal exist before the decision is finalized? Can it be read by multiple downstream heads, or is it consumed immediately by a single operation?

  #### 5. Basis Agnosticism (Preference)
  *   **The Spec:** The theory must identify representations even if they are not axis-aligned (i.e., not single neurons) and even if they overlap (superposition).
  *   **Motivation:** Solves "Superposition" and "Polysemanticity." If your theory requires one neuron = one concept, it will fail on modern dense models where features are distributed across subspaces.
  *   **Test:** Can the theory identify a feature that is the sum of two neuron directions, or a direction that is orthogonal to all neuron axes?

  #### 6. Realization Independence (Preference)
  *   **The Spec:** If Network A and Network B have different weights/seeds but exhibit identical input-output behavior and internal information flow topology, they should be credited with the same representations.
  *   **Motivation:** Solves the "Different Seeds" case. If representation is tied too tightly to specific weight values, you cannot generalize findings across models. However, this is a *Preference* because strict mechanistic interpretability often finds that *how* a model solves a task matters for safety, even if the output is the same.
  *   **Test:** Train two models with different seeds. Map their features. Does the theory provide a translation layer (isomorphism) between them?

  #### 7. Content Stability (Non-Negotiable)
  *   **The Spec:** The theory must explain why $S$ represents *Dog* and not *Dog-or-Cat* or *Small-Furry-Thing*. It must ground the "aboutness" without relying solely on the researcher's intuition.
  *   **Motivation:** Solves "Representing X vs. X-under-description." A cluster of activations might correlate with "dogs," but is it representing the visual concept, the semantic token, or the statistical likelihood of the next word?
  *   **Test:** Adversarial testing. If you show a picture of a cat that looks like a dog, does the representation fire? If yes, it represents "visual-dog," not "semantic-dog." The theory must specify the *modality* of the content.

  ---

  ### Part 2: The Tension (Where the Spec Turns on Itself)

  You suspected a clash between **Causal Role** and **Content**. You are correct. This is the **Individuation vs. Semantics** trade-off.

  **The Conflict:**
  1.  **Requirement 3 (Causal Specificity)** implies that a representation is individuated by its specific causal role *in this specific network*. If I change a weight, the causal role changes, so the representation changes.
  2.  **Requirement 7 (Content Stability)** implies that a representation is defined by what it maps to *in the world* (or the data distribution), independent of the specific mechanism.

  **Why they clash:**
  If you strictly enforce **Causal Specificity**, you cannot say two different networks (or even the same network at different training steps) represent the "same" concept, because their causal pathways are never identical. You lose the ability to talk about "the concept of dog" generally; you can only talk about "the dog-vector in Model V1.2."

  If you strictly enforce **Content Stability**, you risk detaching from the mechanism. You might say "this represents a dog" because it correlates with dogs, even if the network is actually using a heuristic like "has four legs" that fails on tripods. You lose mechanistic grounding.

  **The Unsatisfiable Core:**
  You cannot simultaneously have a theory that is **purely mechanistic** (depends only on weights/activations) and **purely semantic** (depends only on external truth conditions).
  *   To be mechanistic, you must look inward (causal role).
  *   To be semantic, you must look outward (ground truth).
  *   **The Hard Constraint:** Any theory that claims to solve this without referencing the *training objective* or the *data distribution* is lying. The representation is a contract between the internal state and the external loss landscape. A theory that ignores the loss function cannot define content.

  ---

  ### Part 3: The Killer Requirement

  If you only check one box to filter papers, check **Requirement 1: The Usage Constraint.**

  **Why it kills the most views:**
  The majority of current "interpretability" papers rely on **Probing**.
  *   **The Standard Move:** Train a classifier on the activations. If it predicts the label, the concept is "represented."
  *   **The Kill:** As you noted, you can probe random networks. You can probe layers that are disconnected from the output. Information is ubiquitous; representation is functional.
  *   **The Filter:** Ask the authors: *"Did you verify that downstream layers actually read this signal, or just that the signal exists?"*
      *   If they say "The probe accuracy is 95%," **discard the paper.**
      *   If they say "We ablated the direction and performance dropped," **keep reading.**
      *   If they say "We steered it and behavior changed," **check Requirement 3 (Specificity)** immediately (did it break everything else?).

  **Why this is the right filter for a Backend Engineer:**
  In your world, a variable "holding" a value is useless if no function reads it. It's dead code. Mech interp is full of people pointing at dead code and claiming it's the control logic. The Usage Constraint forces the theory to distinguish between **state** (memory) and **noise** (correlation).

  ### Summary of Constraints

  | Requirement | Type | Kills | Saves |
  | :--- | :--- | :--- | :--- |
  | **1. Usage Constraint** | **Non-Negotiable** | Pure Probing, Correlation claims | Causal Interventions, Path Patching |
  | **2. Null-Model Baseline** | **Non-Negotiable** | High-Dim Statistics claims | Robust Feature Detection |
  | **3. Causal Specificity** | **Non-Negotiable** | Blunt Steering, "Chaos" claims | Precise Control Vectors |
  | **4. Storage/Compute** | **Non-Negotiable** | "Neuron fired = concept" | Transient Circuit Analysis |
  | **5. Basis Agnosticism** | Preference | Axis-Aligned (Neuron) views | Superposition, SAEs |
  | **6. Realization Indep.** | Preference | Strict Weight-Matching | Generalizable Circuits |
  | **7. Content Stability** | **Non-Negotiable** | Vague "Semantic" claims | Grounded Feature Definitions |

  **Final Advice:** When you read the next paper, look for the **Ablation**. If they don't break the thing they claim to have found, they haven't found a mechanism; they've found a correlation. In backend terms: they found a log line, not a function call.
