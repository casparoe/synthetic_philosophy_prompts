answer: |-
  You have put your finger on the single most contentious fault line in contemporary Just War Theory. You are absolutely right that this is a logical slide, and you are also right that it violates how we treat ignorance in almost every other branch of ethics and law.

  There is no single, catchy Latin name for this specific move (like *ad hominem*), but in moral philosophy, it has a precise technical description.

  ### 1. The Name of the Move

  The technical philosophical term for what you are describing is the **Conflation of Justification and Excuse**.

  *   **Justification:** The act itself was right, or at least permissible (e.g., shooting an active shooter).
  *   **Excuse:** The act was wrong, but the agent is not blameworthy for doing it (e.g., shooting someone because you were coerced at gunpoint, or because you were invincibly ignorant).

  In the war case you described, the theorist takes **Invincible Ignorance** (which grants an *excuse*) and uses it to establish **Moral Permission** (which requires a *justification*).

  If you need a label to use in conversation or writing that captures the specific *war context* of this slide, I propose you call it **The Epistemic Symmetry Slide**.

  It covers this specific inference: *Because both sides share the same epistemic limitation (neither knows for sure who is just), we treat their subjective blamelessness as objective moral equality.*

  ### 2. The Context: Traditionalism vs. Revisionism

  To understand where this move comes from, you need to know the two camps arguing over it:

  *   **The Traditionalists (e.g., Michael Walzer):** They defend the **Moral Equality of Combatants (MEC)**. They argue that soldiers on both sides have an equal right to kill one another. The move you identified is their primary defense. They argue that because war is a "realm of uncertainty," we must judge soldiers by what they *reasonably believe*, not by the objective truth. Therefore, their excuse (ignorance) functions as a license (permission).
  *   **The Revisionists (e.g., Jeff McMahan):** They attack this move. McMahan argues that **liability** and **blameworthiness** are different. An unjust soldier may be *blameless* (because he was lied to), but he is still *liable* to be killed because he is posing an unjust threat. For the Revisionist, your doctor analogy is correct: the soldier is excused from guilt, but he does not have a "right" to kill, and the just soldier has a stronger right to kill him.

  ### 3. Where the Move Works (and Why War Seems Special)

  You asked if there is ever a case where "couldn't have known" grants a permission rather than just an excuse, and what separates those cases from the doctor.

  There are two specific conditions where this move gains traction. War attempts to claim both, which is why the slide is so seductive.

  #### A. Institutional Role Morality (The "Badge" Defense)
  In the doctor case, the doctor acts as an individual moral agent. In war, the soldier acts as an agent of the state.
  *   **Where it works:** In legal and institutional frameworks, we often grant **"Privilege of Belligerency."** This is a legal immunity. If a soldier follows the rules of war (wears a uniform, follows orders), he cannot be prosecuted for murder, even if his side loses.
  *   **The Difference:** This is a *pragmatic* permission, not a *moral* one. It works because it is part of a reciprocal agreement (International Humanitarian Law) designed to limit horror. If we told soldiers, "You might be hanged as a murderer if your side loses," they would fight to the last man and torture prisoners to hide evidence.
  *   **Why it fails morally:** Just because the law grants immunity doesn't mean the act was morally permissible. The Revisionists argue the Traditionalists confuse *legal immunity* with *moral rightness*.

  #### B. Symmetrical Ignorance (The "Standoff" Defense)
  This is the core of your question. Why does the doctor not get a pass, but the soldier does?
  *   **The Doctor:** The ignorance is one-sided. The doctor didn't know the drug was fatal, but the *facts* were determinate. The act was objectively wrong.
  *   **The War Case:** The ignorance is **symmetrical and systemic**. Both sides are operating in a "fog of war" created by the other side's deception and the chaos of conflict.
  *   **Where the move works:** It works as a **procedural rule**. If we cannot objectively determine justice in real-time (which we usually can't), we must treat the participants as equals to prevent total war.
  *   **Where it fails:** It fails as a claim about **liability**. Even if both sides are equally ignorant, it does not follow that both sides are equally *innocent of posing a threat*. One side is actually defending; the other is actually invading. The "Epistemic Symmetry Slide" ignores the objective fact of who is the aggressor.

  ### 4. A Counter-Example: The Innocent Threat

  To see why the slide is problematic, look at the standard ethical case of the **Innocent Threat**.

  Imagine a sleepwalker (A) picks up a knife and walks toward you (B). A is invincibly ignorant; A is not to blame.
  *   **Are you permitted to kill A?** Yes, in self-defense.
  *   **Is A permitted to kill you?** No. A is sleeping. A has no right to attack.

  This mirrors your doctor analogy. Ignorance grants A an *excuse* (we won't punish A when he wakes up), but it does not grant A a *justification* (A is not "allowed" to stab you).

  The War Move you identified claims that **both** soldiers are like the sleepwalker, but *both* are permitted to kill. This is why the Revisionists say the Traditionalists are wrong. The unjust soldier is like the sleepwalker: blameless, but still an unjust threat. He does not gain a "right" to kill just because he doesn't know he's a sleepwalker.

  ### 5. Summary of the Distinction

  | Feature | Your Doctor/Juror Case | The War Move (Traditionalist) |
  | :--- | :--- | :--- |
  | **Ignorance** | One-sided (Agent doesn't know truth) | Symmetrical (Both sides claim truth) |
  | **Moral Status** | **Excuse:** Act is wrong, agent is blameless. | **Justification:** Act is permissible, agent is blameless. |
  | **Victim's Right** | Victim (or estate) was wronged. | Enemy soldier is *not* wronged (he was a valid target). |
  | **Framework** | Individual Morality / Tort Law | Institutional Morality / Law of War |
  | **The Slide** | None. Excuse stays an excuse. | **The Epistemic Symmetry Slide:** Excuse becomes Permission. |

  ### Conclusion

  The move is the **Conflation of Justification and Excuse**, deployed to defend the **Moral Equality of Combatants**.

  If you want to coin a term that captures the specific mechanism you dislike, call it **The Epistemic Symmetry Slide**.

  *   **What it covers:** Arguments that claim symmetrical ignorance creates symmetrical moral rights.
  *   **What it doesn't cover:** Arguments that claim soldiers are blameless but still liable to be killed (the Revisionist view), or arguments based purely on legal immunity (International Humanitarian Law).

  The move "works" only if you accept that war is a special **institutional practice** where pragmatic rules (limiting violence) override objective morality (who is actually right). If you view war through the lens of **individual morality** (like the doctor), the move fails, and your intuition is correct: ignorance excuses the agent, but it does not authorize the act.
