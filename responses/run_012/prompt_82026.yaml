answer: |-
  ### The Episode

  In the fall of 1973, the University of California, Berkeley, faced a looming lawsuit alleging sex discrimination in its graduate admissions. The raw data seemed damning: across the university, 44 percent of male applicants were admitted, compared to only 35 percent of female applicants. This nine-point gap was too large to be dismissed as random noise; it suggested a systemic barrier erected against women. The administration commissioned a study led by statisticians Peter Bickel, Eugene Hammel, and J. William O'Connell to investigate the charges before they reached a courtroom.

  When the team disaggregated the data, the narrative inverted. They examined the six largest departments, which accounted for most of the applicants. In four of these departments, the admission rates for women were statistically equal to or higher than those for men. In the remaining two, any slight disadvantage for women was too small to explain the university-wide gap. The statisticians concluded that there was no evidence of bias in the decision-making processes of the departments themselves. Instead, the aggregate disparity arose because women had applied in disproportionate numbers to departments with low admission rates overall (such as English and Psychology), while men had applied to departments with high admission rates (such as Engineering and Chemistry). The university was exonerated of direct discrimination, and the case became the canonical real-world example of Simpson's paradox.

  ### The Reversal, Stated Plainly

  Simpson's paradox occurs when a trend appearing in different groups of data disappears or reverses when these groups are combined. In the Berkeley episode, the phenomenon relies on a specific architecture of variables. The "groups" are the individual graduate departments. The "treatment" is the gender of the applicant, and the "outcome" is admission. The lurking variable, which drives the reversal, is the selectivity of the department to which the applicant applies.

  What is being aggregated in the initial accusation is the marginal probability of admission: the total number of women admitted divided by the total number of women applying, compared against the same ratio for men. This calculation pools all departments together, treating an application to English as statistically equivalent to an application to Physics. What is being held apart in the defense is the conditional probability of admission: the admission rate for women within Department A compared to the rate for men within Department A.

  The reversal happens because the departments are not weighted equally in the aggregate. Imagine two departments: one admits 90 percent of applicants, the other admits 10 percent. If most men apply to the 90 percent department and most women apply to the 10 percent department, the overall male admission rate will be high and the female rate low, even if within each department men and women are admitted at identical rates. The lurking variable (department selectivity) is correlated with both the treatment (gender) and the outcome (admission). Because the distribution of applications was heavily skewed by gender, the pooled average was dragged down for women not by rejection, but by where they chose to apply. The paradox demonstrates that the whole is not merely the sum of its parts; it is also a function of how those parts are weighted.

  ### Two Numbers, Two Questions

  The Berkeley data supports two competing readings because it answers two distinct questions, both of which are honest but measure different dimensions of justice. The pooled number answers the question: "If I am a woman applying to this university, what is my probability of success compared to a man?" This is a question about systemic outcomes. It captures the reality of the applicant's experience from the moment they consider applying to the moment they receive a letter. It includes the pipeline, the counseling, the societal expectations, and the final decision. If a woman's chance of entering Berkeley is 35 percent while a man's is 44 percent, the university functions as a filter that yields fewer women, regardless of where the restriction occurs. This number matters for diversity planning, resource allocation, and understanding the demographic composition of the student body.

  The department-by-department number answers a different question: "Is the faculty review process within a specific discipline biased against women?" This is a question about procedural fairness. It isolates the judgment of the admissions committee from the behaviors of the applicants. It asks whether, given two identical files differing only by gender, the committee would treat them differently. This number matters for accountability, hiring practices within the department, and legal liability regarding specific decision-makers.

  The same data supports both because the "truth" depends on the scope of the inquiry. If the concern is the final composition of the class, the pooled number is the relevant metric; the university failed to attract or admit women in equal proportion, and the reason matters less than the result. If the concern is moral culpability of the reviewers, the departmental number is relevant; the reviewers did not discriminate, so punishing them is unjust. The paradox arises because we often conflate "fairness of process" with "equality of outcome." The pooled statistic reveals an inequality of outcome; the disaggregated statistic reveals a fairness of process. Both are true simultaneously, creating a tension that statistics alone cannot resolve.

  ### The Causal Question Underneath

  The statistical reversal is merely the surface; the deeper conflict is causal. To decide which number matters, one must determine the causal relationship between gender and department choice. The general rule of causal inference is strict: adjust for variables that come before the treatment (confounders), but do not adjust for variables that come after the treatment (mediators). If the variable lies on the causal path between treatment and outcome, adjusting for it blocks the very effect you are trying to measure.

  In this context, is the department variable a cause that precedes the alleged discrimination, or a consequence of it? If women chose departments based solely on pre-existing academic interests formed before any interaction with the university, then department choice is a confounder. It is a pre-treatment variable. In this scenario, adjusting for department is correct; the bias lies in society's shaping of interests, not the university's admissions. However, if women's choices were shaped by expectations of how they would be treated, by guidance counselors steering them away from "male" fields, or by a reputation that certain departments were hostile, then department choice is a mediator. It sits downstream of the gendered experience.

  If department choice is a mediator, adjusting for it removes part of the effect we are trying to measure. It hides the bias that occurred before the application was even submitted. Bickel and his colleagues treated department as a confounder, assuming preferences were exogenous to the university. This was not a statistical decision; it was a causal assumption. They chose to define discrimination narrowly as bias within the review room. Had they defined discrimination broadly as any barrier reducing female enrollment, including cultural steering, the department variable would be a mediator, and adjusting for it would be a statistical error that masked the harm.

  This distinction licenses different conclusions. Treating department as a confounder exonerates the institution. Treating it as a mediator indicts the broader system, including the university's culture. The study's authors made a causal choice disguised as a statistical correction. They decided that the university was only responsible for what happened inside the building, not for the winds that blew applicants to the door.

  ### Where the Paradox Goes Silent

  As a bare statistical fact, Simpson's paradox cannot say which number to report. The mathematics describes the relationship between the numbers but remains mute on the relationship between the events. The math tells us the rates reverse when pooled; it does not tell us whether the pooling is legitimate. What supplies the missing judgment is external knowledge—sociology, history, and institutional context. We need to know why women applied to English rather than Engineering. Did they love poetry more than physics, or were they told physics was not for them?

  The standard classroom presentation conceals this ambiguity. Textbooks present the paradox as a puzzle with a clean solution: always trust the subgroups, never trust the aggregate. They teach students that the disaggregated data is the "real" truth and the aggregate is an illusion. The Berkeley episode reveals that this lesson is dangerous. Sometimes the aggregate is the only truth that matters. If a hospital sends all its sickest patients to a specific surgeon, that surgeon's mortality rate will look high. Adjusting for sickness clears the surgeon, but if the hospital's triage system is flawed, the aggregate mortality rate is the metric that saves lives.

  In the Berkeley case, the paradox goes silent on the question of responsibility. It shows us that the data is consistent with both innocence and guilt, depending on the causal model we impose. The episode reveals that statistical analysis is not a neutral arbiter of fact but a framework for argument. The choice of adjustment is a policy decision. By choosing to adjust for department, the statisticians decided that the university's responsibility ended at the departmental door. This requires a judgment call that no formula can provide. The missing judgment is ethical: what do we owe the applicant? Do we owe them a fair review, or do we owe them a fair chance? The paradox highlights the gap between correlation and causation, but only human judgment can bridge it.

  ### Verdict

  The Berkeley case troubles the concept of Simpson's paradox rather than confirming it as a simple warning against naive aggregation. It confirms that aggregation can be misleading, but it troubles the standard resolution that disaggregation is always superior. The episode demonstrates that the paradox is not merely a mathematical trick to be solved, but a structural feature of complex systems where causes are entangled. It shows that the "correct" table depends on the story you tell about how the world works.

  For a novelist, this affair shows that statistical tables are not inert evidence; they are weapons used to carve reality into defensible shapes. When real interests are at stake, the choice of how to slice the data is as contentious as the data itself. The paradox does not reveal the truth; it reveals the complexity of the truth. It confirms that statistics are useful for exposing contradictions, but it troubles the idea that they can resolve them. Ultimately, the case shows that behind every column of numbers lies a theory of causality, and behind every theory of causality lies a moral choice about who is to blame.
