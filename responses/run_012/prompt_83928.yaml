answer: |-
  Good morning. To the families, thank you for bringing us here. To the faculty, thank you for guiding them here. And to the graduates: welcome to the edge.

  There is a word that has been hanging over this semester, heavier than any thesis weight or final exam. It is a small word, four letters. *Ready.*

  You have asked yourselves if you are ready. Your parents have asked it. I have asked it. And because you are philosophy majors, or because you have sat in our classrooms long enough to catch the bug, you have probably asked something else about it too: What does "ready" even mean?

  If I add one hour of study to a student who isn't ready, are they ready? No. If I add another? Still no. But if I keep adding hours, eventually they are. So where did the change happen? Was there a specific minute where the switch flipped? Or is "readiness" just a foggy cloud that we step into gradually?

  This is where I need to make a choice. In my classes, I usually let you debate both sides. Today, I am not going to hedge. I am going to take a stand, because the stand matters for what I need to tell you.

  I am telling you that there is a line.

  I am telling you that "ready" is not a fog. It is not a matter of perspective. There is a fact of the matter about whether you are ready to leave this place and step into the world. There is a sharp boundary between those who are prepared and those who are not. It exists right now, in this room.

  The problem is not that the line is blurry. The problem is that you cannot see it.

  This is the source of that ache in your chest, the impostor syndrome that tells you you're frauds waiting to be found out. You feel vague about your readiness, so you assume the world is vague about you. You think that because you can't locate the boundary, the boundary must not be there.

  I am here to tell you that is wrong. The boundary is there. Your vision is just limited.

  Think about the last time you learned a difficult concept. Maybe it was the distinction between validity and soundness, or the force of a modus tollens. For weeks, it was muddy. Then, one morning, perhaps in the shower, it clicked. Did the logic change overnight? No. The logic was sharp the whole time. Your grasp of it was what moved from dark to light.

  Graduation is not the moment you become ready. Graduation is the moment we acknowledge that you have crossed the line, even if you can't feel the ground shift beneath your feet.

  Now, I know some of you are worrying about the edges of the edges. You're thinking: "But Professor, surely where the certainty begins is itself uncertain?" That is a good question. It is the question of higher-order vagueness. And here, too, I will not wiggle out. If there is a fact of the matter about you being ready, there is a fact of the matter about you being *definitely* ready. The boundaries are sharp all the way up. Our ignorance is deep, but the reality is precise.

  Why does this matter? Why not just tell you that "ready" is flexible, that you define it for yourselves?

  Because if readiness is just a matter of definition, then your doubt is evidence. If the line is fuzzy, then your feeling of uncertainty means you might still be in the gray zone. But if the line is sharp, then your feeling of uncertainty is just noise. It is static. It is the inevitable result of being human beings trying to measure ourselves against a standard we cannot fully see.

  You can feel unready and *be* ready. In fact, given where the line is, you probably will.

  This is the lesson I want you to take into your careers, into your law schools, into your teaching, into your lives. The world will try to convince you that the important lines are blurry. They will tell you that truth is a spectrum, that integrity is a matter of degree, that there is no fact of the matter about whether a action is right or wrong.

  Do not believe them.

  There are sharp lines. There are facts of the matter. Just because you cannot always see them from where you stand does not mean they aren't there. Your job is not to dissolve the boundaries. Your job is to respect them, even when you are unsure where they fall.

  When you are negotiating a salary, there is a fair number. You might not know exactly what it is, but it exists. When you are arguing a case, there is a just verdict. When you are comforting a friend, there is a right thing to say. You will not always know when you have hit them. You will second-guess yourself. You will lie awake at night wondering if you crossed a line you shouldn't have, or stopped short of one you should have reached.

  That anxiety is not a sign that the world is messy. It is a sign that you are paying attention. It is the epistemic price of living a life of precision in a world of limited vision.

  So, when you walk out of this hall, and someone asks you if you are ready, do not say, "I think so." Do not say, "It depends on how you define it."

  Say "Yes."

  Not because you feel it. But because the work you have done here has crossed the threshold, whether you can see it or not. The line is sharp. You have crossed it. We are here to witness the fact, even if you cannot.

  Congratulations. You are ready. Go find the next line.
