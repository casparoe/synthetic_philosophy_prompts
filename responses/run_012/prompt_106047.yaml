      *   `CORRELATES`: Statistical association, no direct ontological link asserted. (e.g., ice cream sales -> drowning).

      *   *Challenge:* Distinguishing `GROUNDS` from `CAUSES` and `CONSTITUTES` is the hardest part for non-philosophers. `GROUNDS` is often the "trash bin" for "depends on but isn't a cause." I need to make the distinctions operational.

