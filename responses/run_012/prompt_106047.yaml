  7.  **Refining the "Explain X" Constraint:**

      *   Curators say: "We need this edge to explain why the pipeline flagged this patient."
      *   Procedure response: "The pipeline needs *inference*, not *ontology*. Distinguish 'predictive utility' from 'ontological dependence'."

  8.  **Drafting the Content (incorporating tone):**

      *   Tone: Professional, operational, slightly rigid (to prevent drift), acknowledging the difficulty without being condescending.
      *   Structure: Pre-flight check, The Four Tests, The Base Layer Rule, Hand-off conditions.

  9.  **Self-Correction/Review during drafting:**

