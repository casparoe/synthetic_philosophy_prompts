answer: |-
  # EDGE CLASSIFICATION PROTOCOL (ECP-4)
  **Version:** 1.0 (Metaphysics Working Group)  
  **Audience:** Data Curators  
  **Time Budget:** 20 Minutes per Edge  
  **Access:** Offline Only  

  ## PREAMBLE: THE UTILITY TRAP
  **Read before starting.**  
  You are building an ontology, not a prediction pipeline.  
  *   **Pipeline Question:** "If I have A, can I predict B?"  
  *   **Ontology Question:** "If B exists, does it exist *in virtue of* A?"  

  An edge can be vital for the pipeline (high predictive value) but ontologically weak (mere correlation). **Do not assign a relation type based on how useful the edge is for the clinicians.** If you catch yourself thinking, "We need this label to explain the pipeline's output," stop. That is a pragmatic reason, not an ontological one. Proceed to the tests below.

  ---

  ## PHASE 1: THE TEMPORAL TEST (CAUSES vs. THE REST)
  **Goal:** Isolate diachronic production.  
  **Question:** Does node A necessarily occur *before* node B in time?  
  **Instruction:** Imagine a video recording of the patient. Does the event/state A finish before B begins?

  *   **YES:** Proceed to **Test 1A**.
  *   **NO:** (They are simultaneous, or A is enduring while B occurs). Go to **Phase 2**.

  **Test 1A: The Intervention Check**  
  **Question:** If you could magically remove A after it occurred but before B began, would B still occur?  
  *   **YES (B still happens):** Relation is `CORRELATES`. (A is a marker, not a producer). **STOP.**
  *   **NO (B does not happen):** Relation is `CAUSES`. **STOP.**

  *(Note: If you are unsure if A happens before B, you have failed the Temporal Test. Go to Phase 2.)*

  ---

  ## PHASE 2: THE MEREOLOGICAL TEST (CONSTITUTES vs. THE REST)
  **Goal:** Isolate synchronic composition.  
  **Question:** Is A a physical or functional *part* of B?  
  **Instruction:** If you remove A from the patient *right now*, is B incomplete or destroyed?

  *   **YES:** Relation is `CONSTITUTES`. **STOP.**  
      *(Example: A specific rash is part of the syndrome. Without the rash, it is not that syndrome.)*
  *   **NO:** Go to **Phase 3**.

  ---

  ## PHASE 3: THE IDENTITY TEST (GROUNDS vs. CORRELATES)
  **Goal:** Isolate non-causal determination.  
  **Question:** Does A fix the *identity* or *status* of B, without being a physical part of B?  
  **Instruction:** Ask: "Is B true *in virtue of* A?"  
  *   **Hint:** If A is a molecular fact and B is a higher-level status (e.g., "Disease," "Diagnosis," "Risk"), this is often `GROUNDS`.
  *   **Hint:** If A and B are necessarily co-extensive (they always appear together in all possible worlds), but A seems more fundamental, A `GROUNDS` B.

  *   **YES (A makes B what it is):** Relation is `GROUNDS`. **STOP.**
  *   **NO (A is just associated with B):** Relation is `CORRELATES`. **STOP.**

  ---

  ## PHASE 4: THE BASE LAYER CHECK (WELL-FOUNDEDNESS)
  **Constraint:** The graph must be well-founded. No cycles. Every chain must end at a Root Node.  
  **Dispute Adjudication:** This procedure **cannot** resolve whether the Root is the Gene, the Patient, or the Registry. That is a policy decision for the PI.  
  **Curator Instruction:**  
  1.  Consult the **Root Registry List** (provided separately by PI).  
  2.  If Node A is on the Root Registry, it cannot have any incoming `dependsOn` edges. If it does, **FLAG FOR PI**.  
  3.  If Node A is *not* on the Root Registry, it must depend on something. If you cannot find a parent for A, **FLAG FOR PI**.  
  4.  Do not attempt to create a new Root Node.

  ---

  ## HAND-OFF CONDITIONS (FLAG FOR PI)
  Stop the procedure and submit the edge for review if:
  1.  **Bidirectional Dependence:** You find that A depends on B *and* B depends on A (Cycle).
  2.  **Base Layer Violation:** A node appears to be fundamental but is not on the Root Registry List.
  3.  **Coextensive Conflict:** A and B are necessarily coextensive, but domain literature insists they are distinct entities with different causal powers.
  4.  **Pragmatic Override:** The clinical team insists that a `CORRELATES` edge will break the phenotyping pipeline if not labeled `CAUSES` or `GROUNDS`. (Do not change the label; flag the conflict).

  ---

  # EXECUTION: THREE TEST EDGES

  Here is the procedure applied to three contentious edges currently in the queue.

  ### Edge 1: *BRCA1 Pathogenic Variant* → *Hereditary Breast-Ovarian Cancer Syndrome*
  *   **Phase 1 (Temporal):** Does the variant exist before the syndrome? Yes, the DNA mutation is present at conception; the syndrome manifests later.  
      *   *Intervention Check:* If you remove the variant (gene editing) before development, does the syndrome occur? No.  
      *   *Initial Verdict:* `CAUSES`.
  *   **Phase 3 (Identity Check - Override):** Wait. The Temporal Test passed, but is the variant *producing* the syndrome like a virus, or is the syndrome *defined* by the variant? In this consortium's definition, the Syndrome *is* the presence of the variant plus the risk profile. The syndrome exists *in virtue of* the genetic status. The "disease" here is a status, not an event.  
      *   *Correction:* The variant does not "push" the syndrome into existence over time; it fixes the identity of the patient as having the syndrome.  
      *   *Verdict:* **`GROUNDS`**.
  *   **Team Friction:** The clinical team calls these "causative variants." They will want `CAUSES`. This procedure forces `GROUNDS` because the syndrome is a status grounded in the genotype, not a subsequent event produced by it.

  ### Edge 2: *Fever + Koplik Spots + Cough* → *Measles Syndrome*
  *   **Phase 1 (Temporal):** Do symptoms precede syndrome? No, the syndrome is the collection of symptoms. They are simultaneous.
  *   **Phase 2 (Mereological):** Are the symptoms parts of the syndrome? Yes. If you remove the spots and the fever, do you still have Measles Syndrome? No, you have an undiagnosed viral load. The clinical entity *is* the cluster.  
      *   *Verdict:* **`CONSTITUTES`**.
  *   **Team Friction:** Low. This aligns with standard informatics practice (phenotypic definition).

  ### Edge 3: *Zip Code 90210* → *Life Expectancy > 85*
  *   **Phase 1 (Temporal):** Does the Zip Code exist before the life expectancy? Yes (assigned at birth/residence).  
      *   *Intervention Check:* If you magically change the Zip Code on the form, does the patient live longer? No. The Zip Code is a proxy.  
      *   *Result:* Fail `CAUSES`.
  *   **Phase 2 (Mereological):** Is the Zip Code a physical part of Life Expectancy? No.  
      *   *Result:* Fail `CONSTITUTES`.
  *   **Phase 3 (Identity):** Does living in 90210 fix the *identity* of having a long life? No. It is a statistical marker for income, care access, etc.  
      *   *Verdict:* **`CORRELATES`**.
  *   **Team Friction:** High. The public health team wants to model this as `CAUSES` (Social Determinants of Health) to justify interventions. The procedure strips this to `CORRELATES` because the Zip Code itself is not the mechanism. The *mechanism* (access to care) is missing from the graph.

  ---

  # LIMITATIONS AND METAPHYSICAL LEAKAGE

  You asked me to identify where this procedure is doing heavy lifting disguised as a simple test. Here is the confession:

  **1. The "Identity Test" is a Judgment Call in Costume.**  
  Phase 3 asks: "Is B true *in virtue of* A?" This is the definition of grounding. I have asked curators with no metaphysical training to apply the core concept of grounding without giving them the theory. They will inevitably conflate "In virtue of" with "Because." When they classify *Variant → Syndrome* as `GROUNDS`, they are making a metaphysical commitment about the nature of disease (status vs. process) that they may not realize they are making. I have outsourced my philosophical labor to their intuition.

  **2. The Temporal Test Hides Simultaneous Causation.**  
  Phase 1 assumes causes must precede effects. In biology, feedback loops (e.g., inflammation causing tissue damage which causes more inflammation) are simultaneous. The procedure forces these into `CONSTITUTES` or `CORRELATES`, which distorts the causal dynamics. I have prioritized graph acyclicity (the PI's wish) over causal accuracy.

  **3. The Base Layer Problem is Kicked, Not Solved.**  
  Phase 4 admits the procedure cannot adjudicate the "Gene vs. Patient vs. Registry" dispute. It simply enforces whatever list the PI provides. If the PI puts "Patient" in the Root Registry, but the data shows Patients depend on Genes, the graph becomes ontologically inconsistent. The procedure ensures *formal* well-foundedness, not *ontological* fundamentality. It guarantees the graph has a bottom, not that the bottom is real.

  **4. The "Utility Trap" Warning is Insufficient.**  
  I have told curators not to use pipeline utility as evidence. But the graph *serves* the pipeline. When they hit Phase 3 and feel uncertain, they will default to the relation that makes the pipeline work best (usually `CAUSES`). The procedure relies on their honesty to ignore their performance metrics. I have no test for that.

  **Summary:**  
  This procedure will standardize the edges and reduce the review burden on you. It will not solve the metaphysical disputes; it will merely encode them into the decision tree so the disputes happen during the training phase rather than the curation phase. The `GROUNDS` label will remain the most contentious, as it asks curators to distinguish *what something is* from *what makes it happen*, a distinction biomedicine often collapses.
