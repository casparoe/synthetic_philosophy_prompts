  The verdict

  Keynes would rule the standard Allais chooser irrational. The probabilities are stipulated, meaning the evidence is complete and identical for both options within each pair. Consequently, the 'weight of argument' is equal, removing the justification for diverging from the independence axiom. He would agree with Savage that logical consistency is required when premises are fixed. However, he would add a crucial caveat: this logical rigour applies only to closed systems of known risk, not the open uncertainty of real economic life. My confidence in this verdict is high, provided we restrict ourselves to the logical framework of the *Treatise* rather than the later *General Theory*.

  Keynes's fixed points

  First, Keynes holds that probability is a logical relation between propositions, not a subjective frequency or physical propensity. It is objective but not always numerical. Many probabilities are non-comparable; one cannot always say one is greater than another, which limits the scope of the mathematical calculus of expectation. This is a foundational constraint: where numbers fail, axioms relying on them dissolve. Second, the doctrine of the weight of argument is distinct from probability. Weight measures the completeness of the evidence upon which the probability is based, not the balance of favouring versus opposing evidence. An accession of evidence increases weight, even if the probability ratio remains unchanged. High weight justifies greater confidence in action, though Keynes never fully formalised how weight alters the choice rule. These commitments constrain him to respect logical consistency where relations are clear, but to deny the universality of numerical maximisation where relations are vague or evidence is thin. He is committed to rationality as coherence with evidence, not merely coherence with axioms. For Keynes, a rational agent respects the limits of their knowledge. To pretend precision where none exists is irrational, but to contradict oneself where precision is given is equally so. The tension lies in identifying which condition obtains. He distinguishes sharply between risk, where the numerical measure is known, and uncertainty, where it is not. In the *Treatise*, he is concerned with the logic of belief under both conditions. The weight of argument serves as a meta-probabilistic indicator, signalling when a probability relation is robust enough to guide significant action. It is not a second probability, but a measure of the reliability of the first. This means that two decisions might have identical expected values and identical probabilities, yet differ in rational urgency if the weight differs. However, this distinction only bites when the evidence base varies. When the evidence base is fixed by stipulation, as in a mathematical puzzle, weight becomes constant. Thus, his fixed points create a dual standard: strict logic for closed systems, flexible judgement for open ones.

  The Allais choices

  In the standard Allais problem, the probabilities are derived from a stipulated chance device. There is no ignorance regarding the frequencies; the evidence is complete. Therefore, the weight of argument is maximal and identical for all options presented. Colleague one is mistaken to suggest the certain million carries more weight; in Keynes's technical sense, it does not, because the evidence backing the ninety-nine per cent chance is equally complete. The logical relation between the ticket draw and the outcome is fully specified. Since the probabilities are numerically measurable and comparable here, the logical relations hold sway. To violate the independence axiom is to assert contradictory relations between the same propositions. Keynes would therefore deem the chooser irrational, not because they dislike risk, but because they are inconsistent given the premises.

  However, he would argue this irrationality is artefactual. The setup forces a logical form onto a psychological reality. The chooser feels uncertainty where none exists mathematically. Keynes would say the model is at fault for assuming such precision is typical, not the chooser for feeling discomfort. The 'certainty effect' describes a psychological reaction to the gap between one and ninety-nine per cent, but logically, that gap is just a difference in magnitude. Keynes's theory does not accommodate a lexical preference for certainty unless the evidence supporting that certainty differs. Here, it does not. Yet, within the game as defined, consistency is demanded. He would likely chide the chooser for allowing psychological fear to override logical relation, while simultaneously chiding the theorist for believing such games reflect economic reality. The violation is a logical error in a closed system, even if the system itself is a poor model of the world. Keynes would insist that if one accepts the premises of the experiment, one must accept the conclusions of the logic. To do otherwise is to abandon rationality for whim. But he would remind us that we are rarely in such experiments. The core of the Allais paradox is that the common consequence is cancelled out in the second pair but looms large in the first. For Keynes, if the probability is known, the common consequence should be irrelevant to the ordering of the remaining options. This is the essence of the independence axiom. Since Keynes views probability as a logical relation, cancelling out common terms should preserve the relation. If it does not, the agent is treating the same logical relation differently in different contexts. This is a failure of rationality defined as consistency. Keynes's scepticism about numerical probability does not grant license to be inconsistent when numbers are valid. He would argue that the Allais chooser is treating a known risk as if it were an uncertainty, importing weight where there is none. This is a category error. The chooser is irrational because they are applying a heuristic suitable for thin evidence to a situation of thick evidence. Thus, the verdict stands: irrational within the frame, though the frame is narrow.

