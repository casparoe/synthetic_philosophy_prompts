prompt: |-
  I do psychometric work — mostly IRT and test equating for a state assessment contractor, so I'm comfy with the Rasch model, 2PL and 3PL, common-item and random-groups linking designs, DIF, measurement invariance testing, and all the usual fighting over whether a scale is really interval or just ordinal, and whether equating across forms is even identified without an anchor. A friend in the econ department keeps going on about interpersonal utility comparisons, and I keep having the feeling that it's the same problem I deal with every day, just with people instead of test forms. Can you restate the main positions in that debate in my vocabulary, as faithfully as you can — the ordinalist line that comparing one person's utility with another's is meaningless, the various rescue attempts at the level of levels vs. differences vs. ratios, the cardinal-unit-comparability moves, the idea that all we need is to rank social states — and actually use my terms while you do it? I mean latent trait and the indeterminacy of its scale, the need to fix a metric by convention, anchor items and the assumption that the anchor measures the same thing in both groups, invariance vs. mere comparability, linking error, differential item functioning as a failure of the assumption that two populations sit on one scale, and the distinction between what's identified from the data and what's fixed by fiat. Where the analogy is real I want to know exactly where it bites.

  Then the residue report, which is the part I actually care about: which claims in the welfare-economics debate translate cleanly into equating talk, which only translate if you distort them (say what gets distorted and in which direction), and which have no counterpart at all in how we do measurement. I suspect alot of the disagreement among economists is like our disagreement about whether equating is possible in principle or only approximately, i.e. partly verbal — but I also suspect the welfare case has a normative sting the testing case doesnt, something about how in my world nobody is entitled to anything just because they scored higher, whereas in theirs the whole point of the comparison is distributive. Tell me if that's right or if I'm smuggling something in. And if a chunk of their debate is really about the ethics of comparing people rather than about measurement, say that explicitly instead of letting it dissolve into my framework. American English please, and skip the reading lists and citations — I can't look anything up right now, I just want the translation and the leftovers.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

