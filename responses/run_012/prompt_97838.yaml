      *   **Task:** Translate the debate in welfare economics regarding interpersonal utility comparisons (IUC) into psychometric terminology.
      *   **Specific Requirements:**
          *   Use psychometric vocabulary (latent trait, metric fixing, anchor items, invariance, linking error, DIF, identification vs. convention).
          *   Faithfully represent economic positions (ordinalism, cardinalism, levels vs. differences, social choice).
          *   Provide a "Residue Report": What translates cleanly? What distorts? What has no counterpart?
          *   Address the normative/ethical dimension (distributive justice vs. measurement precision).
          *   American English, no citations/reading lists.
      *   **Tone:** Professional, peer-to-peer, technically precise, slightly conversational but dense.

  2.  **Deconstruct the Economic Debate (Mental Sandbox):**
      *   *Ordinalism (Robbins, Pareto):* Utility is just ranking. You can't say Person A is happier than Person B, or even that A gained more than B. Only Pareto improvements matter.
      *   *Cardinalism (Old Welfare Econ, Utilitarianism):* Utility is measurable. We can sum it.
      *   *New Welfare Econ (Samuelson, etc.):* Revealed preference. Still mostly ordinal.
      *   *Sen & Harsanyi:* Trying to get partial comparability. Level comparability vs. Unit comparability.
      *   *Social Choice (Arrow):* Aggregation problems.
      *   *Core Issue:* Is utility a latent trait? Can we link scales across individuals?

  3.  **Map Economics to Psychometrics (The Translation Layer):**
      *   *Utility* $\rightarrow$ *Latent Trait ($\theta$)*.
      *   *Individual* $\rightarrow$ *Examinee/Test Form*.
      *   *Interpersonal Comparison* $\rightarrow$ *Linking/Equating across Examinees*.
      *   *Ordinalism* $\rightarrow$ "We only have item response patterns; $\theta$ is arbitrary up to monotonic transformation."
      *   *Cardinalism* $\rightarrow$ "We assume a specific IRT model (e.g., Rasch) that fixes the metric."
      *   *Level Comparability* $\rightarrow$ "Zero point is aligned across persons."
      *   *Unit Comparability* $\rightarrow$ "Standard deviation (slope) is aligned across persons."
      *   *Full Comparability* $\rightarrow$ "Full scalar invariance across persons."
      *   *Social Welfare Function* $\rightarrow$ "Composite Score/Linking Rule."
      *   *Arrow's Impossibility* $\rightarrow$ "Identification failure in the linking design."

  4.  **Drafting the Translation (Section by Section):**

      *   *The Ordinalist Line:* In IRT terms, this is saying the $\theta$ scale is arbitrary. Without a model constraint (like Rasch) or anchor items, you can't compare Person A's $\theta=1$ to Person B's $\theta=1$. It's like having two tests with no common items.
      *   *Rescue Attempts (Levels vs. Units):*
          *   *Level:* Fixing the origin. (e.g., $\theta=0$ means same absolute utility for everyone). Like fixing the difficulty of a reference item.
          *   *Unit:* Fixing the scale factor. (e.g., 1 util = 1 util). Like fixing the discrimination parameter or SD.
          *   *Ratio:* True zero. (Rare in psychometrics, maybe RT?).
      *   *Social Choice/Ranking:* Just ordering states. Like ranking test-takers without caring about the distance.
      *   *Identification vs. Fiat:* Economists argue about what is *identified* by choice data vs. what is *stipulated* by ethical assumption. Psychometricians know we *always* stipulate (fix mean/variance) to identify the model.

  5.  **Drafting the Residue Report (The Critical Analysis):**
      *   *Clean Translations:* The identification problem is identical. The need for anchors (common experiences?) is identical. The distinction between ordinal and interval is identical.
      *   *Distortions:* In psychometrics, we assume the *construct* is the same (math ability). In economics, is "utility" the same construct for everyone? (Preference heterogeneity vs. DIF).
      *   *No Counterpart:* The *normative* stakes. In testing, if equating fails, the test is invalid. In economics, if comparison fails, redistribution might be unjustified *or* we must accept inequality. The "ought" is heavier in economics.
      *   *The "Smuggling" Check:* The user suspects a normative sting. Yes, they are right. Psychometrics is descriptive (mostly); Welfare Econ is prescriptive.

  6.  **Refining the Vocabulary (Self-Correction during drafting):**
      *   *Correction:* Make sure not to say "Utility is $\theta$." Say "Utility functions *as if* it were $\theta$."
      *   *Correction:* Ensure "DIF" is used correctly. DIF in economics is like saying "A dollar gives me more utility than you, not because I'm different on the trait, but because the 'item' (dollar) functions differently for me."
      *   *Correction:* Clarify "Identification." In IRT, we fix mean=0, var=1. Economists argue whether *any* fix is legitimate.

  7.  **Final Polish:**
      *   Check tone: Is it respectful of the econ debate but firm on the psychometric reality?
      *   Check constraints: American English, no citations.
      *   Ensure the "Residue Report" is distinct and actionable.

  8.  **Final Review against User Prompt:**
      *   *Restate main positions in vocab?* Yes.
      *   *Ordinalist line?* Yes (arbitrary metric).
      *   *Rescue attempts (levels/units)?* Yes (origin/scale).
