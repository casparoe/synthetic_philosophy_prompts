      *   *Key Insight:* The shift isn't just "tool vs. agent"; it's "specification vs. optimization." Traditional code implements a *rule*. LLMs optimize for a *pattern*. When a rule fails, it's a bug. When a pattern fails, it's a distributional shift.
      *   *Responsibility:* If the system is optimizing for a goal (resolve tickets) without hard constraints, the *designer* of the objective function bears responsibility for the edge cases, not just the input provider. The "fault" moves from "did I code this logic right?" to "did I define the right boundaries for this optimizer?"

  3.  **Deconstruct Dilemma 2: The Human-in-the-Loop (The Sociological Worry)**
