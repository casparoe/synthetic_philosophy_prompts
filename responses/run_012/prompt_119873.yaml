answer: |-
  Here are my comments on the substance of the argument, addressing your specific questions.

  **1. Is the move in §2 a real distinction or relabeling?**
  It is a real distinction, but you are right to worry. The standard "legitimacy" argument says conditionality buys public support. Your signaling argument says conditionality buys public support *specifically by acting as a costly handicap that prevents mimicry*. That mechanism is the difference. If you treat conditionality merely as a "price of admission" for legitimacy, you are relabeling. If you treat it as a *handicap principle* device where the cost itself is the value (because it proves type), you are doing something new.

  To steelman the relabeling objection: A referee will say political scientists have argued for decades that welfare states require "deservingness criteria" to maintain coalitions. They will say you are just importing biological terminology to describe existing political economy. To defeat this, you must emphasize the *costliness* requirement. Legitimacy stories often suggest conditionality should be minimized to avoid stigma; your story suggests conditionality must be *sufficiently painful* to work. That is a divergent prediction. Keep the focus on the cost, not the consent.

  **2. Where do you slide between explaining and justifying?**
  You slide in §4, second sentence: "It says the standard evaluation... is aimed at the wrong target."
  This is moderate risk. You explicitly disclaim justification in the first sentence, but the second sentence implies there is a *right* target (the contributor's willingness). This subtly shifts from "here is why the policy exists" to "here is how the policy should be judged." It suggests that critics who point to null employment effects are making a category error, which functions as a defense of the policy's rationality even if not its morality. To fix this, phrase it as a mismatch of *design logic* versus *evaluation metrics* without implying the design logic is correct, only that it is the operative one.

  **3. Which claim carries weight, and which should you drop?**
  Claim (ii) (generosity/harshness complements) is carrying the most weight. It is the only novel empirical prediction that distinguishes your theory from the "desert" story (which might predict harshness regardless of generosity) or the "incentive" story (which might predict harshness only where wages are low).
  Claim (iii) (fraud salience) is the one to drop if you need space. It is an application of the theory, not the core mechanism. It is illustrative and strengthens the narrative, but if the generosity/harshness correlation fails, the fraud point collapses with it. It is safer to keep the core theoretical move (i and ii) tight than to overextend into fraud semantics.

  **4. Is (ii) falsifiable, and is non-falsifiability fatal?**
  It is falsifiable. You look for a negative correlation between benefit replacement rates and conditionality strictness indices across OECD countries.
  What counts against it: Finding high-generosity/low-conditionality regimes (e.g., some Nordic configurations during high-trust periods) or low-generosity/high-conditionality regimes (e.g., the US) that don't fit the complementarity model. If the correlation is weak, it suggests signaling is only one mechanism among many (e.g., path dependence, union power).
  Is it fatal? No, provided you frame it as a tendency rather than a law. However, for a social policy PhD, a theoretical claim without empirical grounding is vulnerable. You say you "haven't nailed that down." You need to either nail it down or explicitly frame it as a hypothesis for future work, otherwise it looks like speculation.

  **5. What would a referee flag in the first paragraph?**
  Two things. First, "The evaluations I've read" is too informal and subjective for a chapter; it invites the referee to ask "which ones?" and dispute your sample. Use "Meta-analyses indicate..." or similar. Second, "nothing has been rolled back" is empirically risky. Policies are constantly tweaked, renamed, or adjusted even if the core machinery remains. A referee will cite minor reforms as counter-evidence. Soften this to "the core architecture remains despite evidence." Also, calling the desert story "unfalsifiable" is a strong philosophical claim; ensure you are comfortable defending that against normative theorists who might argue desert claims *are* sensitive to evidence (e.g., regarding capacity to work).

  Verdict: real distinction | weakest claim: 3 | summary: The signaling mechanism offers genuine theoretical leverage over standard legitimacy accounts, but the fraud extension dilutes the core empirical contribution.
