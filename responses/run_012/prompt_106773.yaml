prompt: |-
  ok so I'm in a philosophy of biology seminar and we've spent like three weeks on functions and I've come out the other side with what I *think* is a coherent position but I keep getting dinged in section for it, so before the midterm essay I want a consistency check. here's where I've landed:

  (1) For biological traits, the selected-effects story is basically right — the function of a trait is the effect it was selected for. no selection history, no function, strictly speaking.
  (2) But I also think it's totally fine for a physiologist or a doctor to say the function of the liver is to detoxify, about one individual organism, with no claim at all about what got selected in its lineage. medical functional talk shouldn't have to smuggle in evolutionary history to be legit.
  (3) I think malfunction is real and not just a value judgement — a heart that can't pump is malfunctioning, there's a fact of the matter there, its not just me disapproving.
  (4) I think function ascriptions do genuine explanatory work — saying the heart's function is to pump explains why it's there in the first place.
  (5) I'm a card-carrying physicalist and I get itchy about anything that smells like irreducible teleology or goal-directedness in nature. no spooky backwards causation for me.
  (6) Artifacts: a screwdriver has the function of driving screws, and that's got nothing to do with natural selection.

  So — which of these actually pull against each other, and how badly? I have a suspicion some of them are in genuine tension and some just look like they are and are fine, but I can't tell which is which, and I definately can't tell which one I should give up. Can you go through the pairs, rank the real tensions by severity (don't just tell me they're all equally bad), tell me which ones dissolve once you actually look, and for each real tension say what the cheapest fix is and what it costs me? If one single revision would clean up the most, tell me that one.
