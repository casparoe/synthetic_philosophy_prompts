      *   **(1) vs. (5):** *Low/No Tension.* SE is the physicalist's favorite way to naturalize teleology. It avoids spooky backwards causation by grounding it in past causal history.
      *   **(1) vs. (6):** *Medium Tension.* If function *just is* selected effect, how do artifacts have functions? The user acknowledges they are different ("got nothing to do with natural selection"). This implies an ambiguity in the word "function" (biological vs. artifact). This is manageable (pluralism) but needs to be stated clearly.
