answer: |-
  **IDENTITY CONTINUITY PROTOCOL**

  **1. Define the Anchor**
  Ask: What constitutes "Anna" in this story?
  *   **Biological:** Gametes, gestation, blood. (Hard constraint)
  *   **Psychological:** Memory, trauma, personality. (Flexible constraint)
  *   **Narrative:** The role the character serves in the theme. (Authorial constraint)
  *   *Stop Condition:* If you claim Biological Anchor, different gametes = different person. Period. If you claim Psychological, proceed.

  **2. The Simultaneity Test**
  Ask: Can both versions exist in the same room at the same time?
  *   **Yes:** They are distinct entities (Counterparts). You cannot claim numerical identity.
  *   **No:** They are mutually exclusive possibilities. You may claim identity if the Anchor holds.
  *   *Stop Condition:* If "Yes," you are writing multiverse counterparts, not one woman. Adjust pronouns/internal monologue to reflect separation or unity consciously.

  **3. The Variation Test**
  Ask: Does the specific change sever the Anchor?
  *   **Case: Switched at Birth (Neighbor Kid).** Same gametes, different parents.
      *   *Result:* Biological Anchor holds. Psychological varies. **PASS.** (This is nature vs. nurture, not identity loss).
  *   **Case: Twin (Same Gametes, Split).**
      *   *Result:* Simultaneity Test fails (two bodies). They are distinct persons despite identical origin. **PASS** (Procedure correctly identifies them as separate).
  *   **Case: Different Father (Anna).** Different gametes.
      *   *Result:* Biological Anchor fails. Psychological Anchor holds. **FAIL** on fact, **PASS** on theme.

  **4. The Authorial Decree**
  Ask: Where does logic end and art begin?
  *   If the Biological Anchor fails but the Theme requires unity, you must explicitly signal that identity is psychological.
  *   *Rule:* You cannot have it both ways. You cannot claim biological necessity *and* biological variance.
  *   *Action:* Pick one Anchor. Rewrite internal monologue to match. If Psychological, remove references to "fate" or "blood" tying them together; emphasize memory and consciousness.

  **LIMITATIONS**
  *   **Jurisdiction:** This procedure tests consistency, not quality. It cannot tell you if the story is good, only if it contradicts itself.
  *   **Metaphysics:** It cannot resolve the "soul" question. If your book relies on a spiritual definition of self, you must define that rule in Chapter 1.
  *   **Surrogacy/Mitochondria:** Outside jurisdiction. Treat as Biological Anchor (genetics) or Gestational Anchor (womb), but do not mix them without explicit thematic reason.
  *   **The Hard Truth:** This procedure identifies where you are making an aesthetic call disguised as a fact. In the Anna case, you are making an aesthetic call. Own it.

  **CASE WORK SUMMARY**
  *   **Neighbor Kid:** Safe. Biology is constant; environment varies. No philosophical conflict.
  *   **Twin:** Safe. Procedure forces distinction. Same origin does not equal same person if bodies are distinct.
  *   **Anna (Different Father):** Unsafe. This violates Origin Essentialism. You are asking the reader to accept a metaphor as a literal fact.

  **INSTRUCTIONS FOR USE**
  Run this before drafting Chapter 1 scenes involving the split. If Step 1 returns "Biological," you must rewrite the premise. If Step 1 returns "Psychological," you must strip out biological determinism from the prose. Do not hedge.

  Verdict: The premise survives as narrative art but fails as metaphysical fact, requiring you to prioritize psychological continuity over biological origin.
