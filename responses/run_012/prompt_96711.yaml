answer: |-
  Your friend's argument is a formidable piece of scholasticism, but it relies on a category error regarding the relationship between logical probability and practical conduct. To preserve the core insights of the *Treatise*—specifically the non-comparability and non-measurability theses you rightly wish to keep—you must reject **Step (4)**.

  Here is the diagnosis, the cost of that rejection, and an evaluation of the available replies.

  ### The Diagnosis: Reject Step (4)

  **Step (4) states:** *To choose rationally between two courses of action one must be able to compare the probabilities of the outcomes that distinguish them; on the standard account, one must be able to compute and compare their expected values.*

  **Why it looked innocent:**
  Step (4) appears innocent because it conflates the *theory of probability* with the *theory of rational choice*. In the neoclassical tradition your economist friend inhabits, these are often stitched together into a single fabric: rationality is defined as expected utility maximisation. Consequently, it seems tautological to say that without comparable probabilities, one cannot calculate expected values, and without expected values, one cannot choose rationally. It treats the Bernoullian calculus not as a specific tool for specific conditions, but as the definition of rationality itself.

  **Why it is illegitimate:**
  Keynes explicitly denies this identification. In Chapter 26 of the *Treatise* ('The Application of Probability to Conduct'), he argues that the mathematical expectation of benefit is only a guide when the probability is numerical and the goods are commensurable. He writes that to rely on expectation where the probability is uncertain or the good incommensurable is a fallacy. By insisting that rational choice *requires* expected value comparison, Step (4) begs the question against Keynes. It imposes a decision rule that the *Treatise* was designed to limit.

  **What rejecting it costs:**
  Rejecting Step (4) costs you the universality of Expected Utility Theory (EUT). You must accept that rational action is not always algorithmic. There will be cases where reason does not dictate a unique optimal choice, yet a choice must be made. This limits the predictive power of economic modelling, as it admits that agents may act on grounds other than calculated optimisation without being deemed 'irrational'. However, this is a cost Keynes was willing to bear; he argues that in high-uncertainty environments (investment, policy), rationality consists in acknowledging the limits of calculation, not in pretending they do not exist.

  ### Addressing Your Suspicions

  **Suspicion 1: That (4) is smuggling in a decision rule Keynes rejects.**
  **Confirmed.** As noted above, Step (4) assumes that 'rational choice' is synonymous with 'maximisation of mathematical expectation'. Keynes's entire project in the *Treatise* is to show that the logical relation of probability is broader than the numerical calculus, and consequently, the guidance it offers conduct is broader than mere maximisation. By building maximisation into the definition of rational choice at Step (4), your friend ensures the theory 'fails' at Step (9), but only by changing the rules of engagement.

  **Suspicion 2: That the argument slides between the evidence failing to rank two hypotheses and our failing to know how they rank.**
  **Confirmed.** This slippage occurs between Steps (2) and (5). For Keynes, non-comparability is an **ontological** feature of the logical relation, not an **epistemic** failure of the agent. It is not that we lack the data to compute the ranking; it is that the logical relation of partial entailment does not exist in a form that admits ranking. Your friend's argument treats non-comparability as a temporary obstacle to calculation (which implies a solution exists if we knew more), whereas Keynes treats it as a permanent feature of the logical landscape. This matters because if it is ontological, no amount of information gathering resolves it; one must switch to a different mode of decision-making (e.g., convention), which Step (4) forbids.

  ### Ranking the Standard Replies

  You asked to rank the standard replies by what each has to give up, from the most costly surrender to the least.

  **1. The Subjectivist Line (Ramsey)**
  *   **What it surrenders:** It surrenders the *Treatise* itself. Ramsey rejects the idea that probability is an objective logical relation (Step 1). For Ramsey, probability is nothing but a degree of belief revealed by betting behaviour.
  *   **Cost:** Total. To adopt this is to admit Keynes was wrong about the nature of probability. It restores comparability by fiat (by forcing beliefs onto a numerical scale to avoid Dutch Books), but it abandons the logical realism that makes the book philosophically distinctive.
  *   **Can a Keynesian live with it?** No. This is the antithesis of the *Treatise*.

  **2. Imprecise or Interval Probability**
  *   **What it surrenders:** It surrenders the strict logical relation for a set-theoretic representation. It models non-comparability as a range (interval) of probabilities rather than a unique logical relation that is simply unranked.
  *   **Cost:** High. While it preserves non-comparability (Step 2), it often attempts to salvage a decision rule (e.g., E-admissibility) that Keynes might view as too mechanistic. It formalises Keynes's insights into a mathematical language he was sceptical could be fully applied to these cases.
  *   **Can a Keynesian live with it?** Perhaps, as a reconstruction. It respects the spirit of (2) and (3), but risks turning Keynes's logical philosophy into a technical tool he warned against overusing.

  **3. Alternative Decision Rules (Dominance, Maximin)**
  *   **What it surrenders:** It surrenders Expected Value Maximisation as the sole criterion of rationality. It accepts that when probabilities are non-comparable, we may choose the option with the best worst-case outcome (maximin) or the one that is better in at least one state without being worse in others (dominance).
  *   **Cost:** Medium. It restricts the scope of economic optimisation. It admits that rationality is pluralistic. However, it still seeks a *rule* to determine the choice, whereas Keynes suggests sometimes there is no rule.
  *   **Can a Keynesian live with it?** Yes. This is consistent with Keynes's caution regarding uncertainty. It blocks Step (4) without abandoning the search for rational guidelines.

  **4. Keynes's Own Appeal (Weight of Argument and Convention)**
  *   **What it surrenders:** It surrenders the hope that probability logic *alone* can dictate action in all cases. It admits that when probability and weight are insufficient, agents rely on 'animal spirits', convention, or caprice (the umbrella case).
  *   **Cost:** Low (in terms of fidelity), but High (in terms of predictive ambition). It concedes that in the 'ordinary case' (Step 7), rationality is not a calculation but a social or psychological habit. It validates Step (7) but denies Step (8).
  *   **Can a Keynesian live with it?** Yes, this is the only fully consistent position. It accepts that the *Treatise* describes the limits of reason, not a machine for generating choices. It aligns with the *General Theory*, where investment is driven by convention precisely because calculable probability is unavailable.

  ### Conclusion

  Your friend's argument collapses if you deny that rational choice requires expected value maximisation. By rejecting Step (4), you block the inference to Step (8). You can maintain that in cases of non-comparable probability, rational choice is still possible, not because we calculate a winner, but because we are permitted to act on weight, convention, or even caprice without violating rationality.

  This concession does not refute Keynes; it *is* Keynes. The cost is admitting that economics cannot be a deterministic science of choice under uncertainty. But if you are reading the *Treatise*, that is likely a price you have already agreed to pay.
