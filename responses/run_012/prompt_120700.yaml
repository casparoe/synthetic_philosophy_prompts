  (1) "Diagnosis"
  Your dilemma rests on three assumptions: first, that binding requires literal impossibility; second, that any possibility of amendment renders precommitment null; third, that legitimacy requires the present majority to have unchecked power. The first is mistaken. Ulysses was not physically incapable of moving forever; he was constrained only until the danger passed. Constitutional precommitment similarly relies on friction, not impossibility. The second assumption ignores that the purpose of precommitment is to filter impulses, not to freeze history. The third assumes the "living" only exist in the present moment, ignoring that a people extends across time. By treating all constraints as either absolute bars or mere suggestions, you miss the spectrum of procedural costs that define actual constitutionalism. The fatal flaw is equating "hard to change" with "unchangeable." Furthermore, the "dead hand" objection assumes the past self is a foreign ruler, rather than an earlier iteration of the same sovereign. If the sovereign binds itself to a procedure, it remains sovereign even while bound, provided the binding mechanism was self-imposed. The dilemma collapses when you recognize that authority can be structured temporally without being surrendered.

  (2) "How precommitment actually binds"
  A Ulysses contract binds not by removing agency, but by raising the transaction costs of succumbing to temptation. Ulysses remained an agent; he simply arranged his environment so that acting on his immediate desire required extraordinary effort he knew he wouldn't exert. He did not cut off his hands; he added ropes. In constitutional terms, precommitment works by altering the decision rule. A simple majority might want to violate a right, but if the constitution requires a supermajority or a time delay, that impulse is blocked. This is effective because it distinguishes between transient passions and settled will. The "knife" of amendment is essential, but it must be dull enough that it cannot be used impulsively. The binding force is the political capital required to undo the constraint. If the cost is too low, the constraint is ignored; if too high, it becomes tyranny. The analogy holds because both systems rely on procedural friction to protect long-term interests from short-term desires, without abolishing the capacity for future self-correction. The rope holds because cutting it is harder than enduring the tension. Crucially, the effectiveness lies in the psychological shift: knowing the rope is there discourages the desire to cut it. Similarly, entrenched clauses shape political expectations, making violations seem illegitimate even before legal barriers are encountered. The constraint operates on the calculation of feasibility, not just physical possibility. The rope is not a wall; it is a weighted drag on the ship's steering, ensuring only strong winds can change course. It ensures that the later self acts only on convictions that survive the friction of procedure.

  (3) "Is the dilemma exhaustive?"
  The dilemma is not exhaustive. There is a middle path: costly reversibility. Precommitment is legitimate when it imposes significant hurdles to change without making change impossible. This avoids tyranny because the living retain the ultimate authority to amend; it avoids toothlessness because the hurdles are high enough to prevent casual violation. The criterion for legitimacy is proportionality: the difficulty of amendment should match the importance of the principle entrenched. Fundamental rights require higher hurdles than tax rates. This middle path recognizes that self-government is not just about what the majority wants now, but about the rules under which they want. By requiring a broader consensus or a longer timeframe, the system ensures that changes reflect a durable shift in values rather than a fleeting mood. Thus, precommitment is neither a straitjacket nor a suggestion; it is a filter. It allows the present self to override the past self, but only if the present self is sufficiently unified and persistent to prove that the override is rational, not merely impulsive. The key is that the procedure tests the intensity and stability of the new will. If the new will is strong enough to clear the hurdles, it is legitimate to override the old commitment. This resolves the tyranny charge because the living are not silenced; they are merely required to speak louder and longer. The middle path acknowledges that democracy requires time as well as votes.

  (4) "The water-tariff clause"
  The water-tariff clause is a genuine precommitment. It is not toothless because change is possible, but it is not tyrannical because the procedure is accessible. The criterion used is the "Deliberative Hurdle" test: does the amendment process require sustained consensus over time? Requiring two votes separated by an election ensures that any change survives an electoral cycle, filtering out short-term populist pressure. The referendum adds a layer of direct consent. Water infrastructure requires long-term planning, vulnerable to short-term price cutting. This clause protects that planning without freezing rates forever. It raises the cost of change enough to deter impulsive manipulation but leaves the knife available for genuine necessity. It respects the living by allowing them to change the rule, but respects the past by ensuring they only do so after serious deliberation. It is a valid Ulysses contract because it binds the impulse, not the will. The specific combination of legislative delay and popular vote ensures that only a durable majority can alter the financial foundation of the utility, securing the system against both corruption and panic. This balances fiscal stability with democratic control. It is the correct degree of friction.
