answer: |-
  You have stumbled into one of the oldest debates in philosophy, dressed in ink and bezier curves. You are asking about **Universals vs. Particulars**, or **Platonism vs. Nominalism**, but you are asking it with a pen in your hand.

  To answer your question directly: **Typographically and historically, you are right.** There is no cosmic "a." There is only a series of agreed-upon conventions that have shifted wildly over three millennia.

  However, **artistically and psychologically, your character is also right.** The *feeling* of the "true a" is a real phenomenon, even if the object of that feeling is a ghost.

  Here is the breakdown of why your doubt is valid, why her conviction is still compelling, and how to write the "honest version" without flattening her into a simple caricature of delusion.

  ### 1. The Typographic Reality (Why you are right)
  You noted the structural differences, but let's sharpen that point. The 'a' is actually one of the most unstable letters in the Latin alphabet.

  *   **The Two-Story vs. One-Story Schism:** In Roman antiquity and the Carolingian minuscule tradition, the 'a' was a double-story structure (a closed loop on top of a bowl). This is the "textura" of book faces like Garamond or Caslon. But in italic scripts and geometric sans-serifs (like Futura or Helvetica), the 'a' is often a single-story circle with a stem (ɑ). Structurally, these are different animals. One has two counters (or one counter and an enclosed apex), the other has one.
  *   **The Blackletter Problem:** As you mentioned, in Fraktur or Textura, the 'a' often looks like a flattened 'c' with a vertical spine. It shares almost no DNA with the 'a' on your keyboard.
  *   **The Semiotic Truth:** You hit the nail on the head: it is convention. If we had all agreed 500 years ago that the sound /æ/ would be represented by a triangle, it would be a triangle. The "essence" of the 'a' is not in its curves, but in its **difference** from the 'o', the 'e', and the 'd'. It is defined by what it is *not*, not by what it *is*.

  If you treat the novel as a realist drama about typography, your character is objectively wrong. She is chasing a phantom.

  ### 2. The Phenomenological Reality (Why she is right)
  However, if you tell a type designer there is no "true a," they will look at you like you're denying the existence of gravity. Why?

  *   **Topological Constancy:** While stroke counts change, certain topological features tend to persist. There is almost always a vertical stress on the right side. There is almost always a closed counter (a hole). There is a specific relationship to the baseline. When those features break, we stop reading it as an 'a' and start seeing it as a drawing.
  *   **The "Ideal" as a Tool:** To design a font, you *must* believe in the Platonic 'a'. If you think every 'a' is just arbitrary noise, you cannot make decisions. You need a North Star. That North Star doesn't exist in the physical world, but it exists in the **process**. The "true a" is the limit of a function that she is trying to approach but can never touch.
  *   **Wittgenstein's Family Resemblance:** The philosopher Ludwig Wittgenstein argued that there is no one thing that makes all "games" a game. Instead, they share a network of overlapping similarities. The 'a' is the same. It is a family resemblance. Your character believes the family resemblance proves a common ancestor (the Truth); you believe it proves only that they are related (Convention). Both are looking at the same photo album.

  ### 3. Writing the "Honest Version"
  You asked if the book is secretly a tragedy about someone mistaking habit for truth. **Yes, but that doesn't make her a fool.** It makes her an artist.

  The "honest version" isn't choosing between "She is right" and "She is wrong." The honest version is acknowledging that **the lie is necessary for the art.**

  Here are three ways to frame this tension:

  **A. The Tragic Fanatic (The Quixote Approach)**
  Lean into your fear. She ruins relationships, misses life events, and drives herself to madness trying to kern the gap between reality and the ideal. The climax of the book could be her realizing that the "perfect a" is empty. It has no soul because it has no compromise. The "truth" she finds is that imperfection is what makes a letter legible, human, and warm. The tragedy is that she had to break herself to learn that.

  **B. The Devout Atheist (The Poet Approach)**
  She knows, deep down, that it's arbitrary. She knows that 500 years from now, the 'a' might look like a squiggle. But she treats the convention *as if* it were divine because that devotion is the only way to make something that matters. This is the "honest" version of a religious person in a secular world. She isn't deluded; she is **committed**. The tension comes from her guarding this secret: that the God she serves is one she invented, but she serves him anyway.

  **C. The Evolution (The Master Approach)**
  At page 200, she believes in the Platonic 'a'. By the end, her definition of the "true a" shifts. She realizes the "true a" isn't a shape; it's a **function**. It is the vessel that carries meaning. The "true a" is the one that disappears so the reader can see the word. Her journey is from obsessing over the *form* to obsessing over the *connection*.

  ### A Suggestion for the Text
  If you want to keep her conviction but honor your own doubt, give her a moment of crisis where she confronts the single-story 'a'.

  Let her stare at a geometric sans 'a' (like Futura) and feel visceral hatred or confusion. Let her argue with a colleague who says, "It's still an 'a'."
  Her response shouldn't be "No it isn't."
  Her response should be: **"It's an 'a' that forgot where it came from."**

  That line bridges the gap. It acknowledges the convention (it is named 'a') but maintains her conviction (it has lost its essence).

  ### Verdict
  You are not wrong about the typography. The essence of the letter is cultural habit.
  But do not punish the character for believing otherwise.

  The most honest version of this story is that **she is chasing a ghost, but the chase produces something real.** The fonts she creates, the beauty she finds, the discipline she cultivates—those are real, even if the "True A" is not. That is the condition of the artist. We chase horizons that move away from us.

  Write the tragedy, but make it a beautiful one. She isn't mistaking habit for truth; she is turning habit into truth through the intensity of her attention. That is what type design is. That is what writing your novel is.
