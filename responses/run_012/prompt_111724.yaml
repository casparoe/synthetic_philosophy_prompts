  Ray walks the fallow field in boots,
  Yew forked tight in wrinkled hands.
  Water rises to meet the wood.
  Dad says statistics explain the roots,
  But three wells hum where Ray has stood.

  My father needs a reason why,
  A diagram to hold the luck.
  Water rose to meet the wood.
  Numbers stack up neat on paper,
  Yet the pump starts dry until he comes.

  Farmers wait on the parish line,
  Won't drill deep till he walks the acre.
  Rises to meet the wood.
  I watch the twig twitch in the wind,
  Half believing what I cannot prove.

  Seventy years of walking dry earth,
  No explanation needed for the drink.
  Let the science argue with the dirt,
  I'll trust the twitch in the old man's wrist.
  Water rises to meet the wood.
