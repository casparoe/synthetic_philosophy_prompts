answer: |-
  The water was flat, grey, and waiting. Inside the boat, there was no sound but the eight of us breathing.

  I sat in the stroke seat, the number eight on my back. My job was to set the rhythm, the heartbeat that everyone else would follow. Behind me, seven others. In front of me, the coxswain, Leo, strapped into the stern, facing us, the eyes of the boat.

  We were a single machine. That's what the coaches say. A single organism. When we move, we move as one. But as I gripped the handle, the wood warm and familiar against my palm, I wondered what held us together. Was it the carbon fibre shell? The oars locked in the gates? Or was it something invisible, stretched between us like a tightrope?

  "Ready," Leo's voice came through the speakers, crisp and calm.

  We all leaned forward. I knew that Marcus in the five-seat was leaning forward. I knew that Sam in the seven-seat was leaning forward. And I knew that they knew I was leaning forward. It was a loop of knowledge, a circle of awareness that tightened around us. We were ready to win. Or so I thought.

  "Go."

  The catch. Eight oars sliced the water at the exact same millisecond. The boat surged.

  This is the swing. This is the moment where individual effort disappears into the collective drive. You don't feel your own legs anymore; you feel the run of the boat. If I pull harder, the boat speeds up, but only if everyone else pulls too. If someone feathers early, the boat checks, and we all feel the stumble.

  I looked at Sam's back in front of me. He was driving hard, too hard. His shoulders were tight. I knew why. Sam wasn't rowing for the school. He wasn't even rowing for the win. He was rowing for Leo. Everyone knew Sam had a crush on the cox, but mostly, everyone knew that Sam knew Leo was watching. He wanted the perfect stroke to be a message. *Look at me. I am part of this. I am doing this for us.* But the 'us' in his head wasn't the crew. It was a dyad. Him and Leo.

  Behind me, Marcus was different. I could hear his grunt on the drive. Sharp. Angry. His girlfriend had broken up with him yesterday, right before the bus ride. He wasn't trying to win the race. He was trying to prove he was stronger than the pain. He was using the water as an enemy to be beaten. If the boat won, it was a byproduct. If the boat lost, but he exhausted himself, he still won his private war.

  And then there was Leo.

  Leo held the tiller lines. Leo called the pace. Leo was the brain.

  "Lengthen out," Leo called. "Send it."

  We lengthened. The boat accelerated. We were ahead of the rival crew from St. Jude's. I could see their white blades in my peripheral vision, slightly behind ours.

  I felt the unity of the action. We were all doing the same thing. We all knew we were all doing the same thing. Isn't that what makes it a joint action? The shared goal plus the mutual knowledge? We all wanted the boat to move forward. We all knew everyone else was pulling.

  But did we share the goal?

  I glanced at Leo's face. He wasn't looking at the other boat. He was looking at the water ahead. He looked calm. Too calm.

  I remembered what he'd said in the changing room. *"They expect too much of us. Maybe it's time we stopped giving them what they want."* I had thought he meant the pressure. Now, watching his hands on the lines, I wasn't sure.

  If Leo wanted us to lose, could we still be a 'we'?

  "Power ten," Leo commanded. "Now."

  Ten strokes to break the race. This is where the collective will is supposed to solidify. We all dig deeper. We all suffer together.

  I dug. Sam dug. Marcus dug. The rest of the crew, the ghosts in the middle seats, dug. They just wanted to win. They were the glue, the ones whose individual intentions matched the group's purpose. They were the ones making the reduction work. *I intend that we win, because I believe you intend that we win.*

  But Leo didn't call the ten with fire. He called it flat.

  And on the fifth stroke of the ten, I felt it. A slight drag. A subtle shift in the weight distribution. Leo had leaned slightly to the port side. Just a fraction. Enough to catch an edge. Enough to check the run.

  He was sabotaging us.

  I looked at Sam. Sam didn't notice. He was too busy looking at Leo's profile, trying to read approval in the cox's eyes. He saw the command, he executed the action. His intention was to follow Leo. So, in a way, he was following Leo perfectly. He was fulfilling his own intention, which was to align with the cox.

  I looked at Marcus. Marcus felt the check in the boat. He grunted louder. He pulled harder to compensate for the drag. He thought the resistance was the water. He thought the enemy was outside the boat. He didn't know the enemy was steering.

  So, what was happening?

  Physically, the boat was moving forward. Eight oars were pushing water. One person was steering. The result was velocity. We were still ahead. The external action was unified. The boat behaved as a single agent moving toward the finish line.

  But internally?

  I intended to win.
  Sam intended to impress Leo.
  Marcus intended to conquer his grief.
  Leo intended to lose.
  The others intended to win.

  We were nine separate vectors. Some pointed at the finish line. One pointed at the bottom of the river. One pointed at a person. One pointed at a memory.

  And yet, the boat flew.

  "Two hundred meters," Leo said. His voice was steady. He wasn't pushing us. He was letting us carry ourselves.

  I realized then that the boat didn't care about our minds. The physics of the shell didn't care about collective intentionality. It only cared about force. If the sum of our forces was greater than the drag, we moved. The 'we' existed in the water, in the splash, in the speed, regardless of what was happening in our heads.

  Or did it?

  If Leo steered us into the buoy, the 'we' would shatter. The action would fail. So his intention mattered. But he wasn't steering us into the buoy. He was just... holding back. He was letting us win, but barely. He was denying us the glory of the crush, denying us the collective triumph.

  "Push," I called out. I broke protocol. The stroke doesn't call the commands. But I needed to know. I needed to see if my voice could override the cox, if the seven of us could become a 'we' without the eighth.

  Marcus responded instantly. Sam responded instantly. The middle crew responded.

  Leo didn't counter me. He let me call it.

  We surged. The gap opened. We crossed the line.

  Winners.

  The oars came out of the water. The silence rushed back in, heavier than before. The unity evaporated. Sam slumped, looking at Leo, waiting for a smile that didn't come. Marcus ripped his gloves off, breathing hard, staring at nothing, having won a battle no one else knew he was fighting. Leo sat still, hands in his lap, looking at the water, having failed to lose.

  I looked at the boat. It sat low in the water, stable, complete.

  Had we done it together?

  We had moved as one. We had known we were moving as one. But if I asked Marcus why he rowed, he wouldn't say "for the crew." If I asked Leo, he wouldn't say "for the win."

  The trophy would have the school's name on it. It would say "Eight." Singular. It would pretend that there was one mind in the boat.

  I looked at my hands. They were blistered. They were mine. But the callus on the palm was formed by the same friction as Sam's, as Marcus's, as the others.

  We had crossed the line. The action was complete. But as I climbed out of the boat, stepping onto the shaky pontoon, I couldn't shake the feeling that the 'we' had never really existed. It was just a shadow cast by nine separate lights shining in the same direction for exactly six minutes.

  Or maybe, I thought, watching Leo climb out without looking at us, maybe the shadow is the only thing that's real. The lights don't matter. Only the shape we make on the water.

  "Good race," someone said.

  Nobody answered together.
