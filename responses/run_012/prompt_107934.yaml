answer: |-
  Dear Colleague,

  You have asked for an audit of the argument your senior colleague deploys to defend a Eurocentric syllabus, an argument that relies on the analogy of cartographic projection. It is a seductive comparison because it borrows the authority of mathematics and geography to legitimize a pedagogical choice, suggesting that bias is merely a geometric necessity rather than a political or epistemological one. To see where it holds and where it fractures, we must first lay out the correspondence as exactly as the analogy permits. In his framing, the projection corresponds to the narrative structure of the course, the specific selection of causes and effects that flatten the complexity of time into a linear story. The globe represents the totality of past human experience, the unreachable truth of everything that happened everywhere. The flat map is the textbook or the syllabus itself, the necessary reduction of that globe into a usable format. The scale corresponds to the level of granularity, deciding whether we look at individuals, nations, or civilizations. The legend is the key of concepts, terms like modernity or revolution, which tell the student how to read the symbols on the page. Finally, the survey that measures departure from the territory is historiography, the critical discipline that checks the narrative against evidence and alternative accounts.

  Once these terms are set, the cracks in the analogy begin to show, and we must separate the decorative failures from those that bear on his conclusion. A decorative failure might be that maps are visual while history is textual, but this does not undermine his logic. The structural failures, however, dismantle the conclusion that a European center is just one valid option among many. The first major break concerns the difference between a distortion chosen for a purpose and one simply inherited. Your colleague suggests that choosing a Eurocentric frame is like a navigator choosing a Mercator projection for its utility in plotting a straight course. But map projections are conscious technical choices made by cartographers to solve specific problems, whereas the Eurocentric frame in history is often an inherited convention, unexamined and treated as natural rather than utilitarian. If the purpose of a world-history survey is to understand the relative weight and interaction of global societies, a Eurocentric frame acts less like a Mercator projection chosen for navigation and more like a map that inadvertently places the cartographer's house at the center of the world simply because that is where the cartographer stands. The inevitability of a projection does not show that no map is better than another; it only shows that no map is perfect. A map designed for aviation is useless for sailing, and similarly, a history framed around the rise of Europe may be useful for understanding European institutions but is functionally broken for understanding the world system as a whole.

  This leads directly to your second question regarding convertibility. In cartography, every projection can be converted into any other mathematically without loss of information; the data of the globe remains constant regardless of how it is flattened. Historical framings cannot be converted into one another in this way. You cannot take a narrative centered on the European Enlightenment and simply shift the coordinates to center the Ming Dynasty without losing information and generating new causal links. The events themselves change significance when the center moves; the Silk Road looks different from Xi'an than it does from Rome. Because historical narratives are not mathematically reversible transformations of a fixed dataset, the choice of center is a choice of content, not merely convenience. If the choice of center determines what counts as significant evidence, then the colleague's conclusion that the choice is merely a trade-off among purposes fails. It is a trade-off that constructs different realities, meaning some constructions may be more empirically robust than others depending on the question being asked.

  The third point of failure concerns the territory. The analogy presupposes a territory existing independently of any map, against which distortions can be measured. In geography, the landmass exists whether we map it or not. In history, the analogue of that territory is the archival record and the material traces of the past, but these traces do not speak for themselves without a narrative to organize them. There is no globe of history that we can hold in our hands to check the accuracy of our flat maps. The past is accessed only through the maps we draw. This does not mean anything goes, but it means the survey of departure is not a measurement of physical accuracy but of coherence and explanatory power. If the colleague argues that we must declare our projection because we cannot access the globe, he is right, but if he argues that therefore any projection is as good as any other, he is wrong. Some maps correspond better to the available evidence than others, and a map that inflates Europe at the expense of Asia and Africa contradicts the demographic and economic evidence of the last millennium just as a Mercator map contradicts the physical area of Greenland.

  The fourth break involves the viewpoint. A map is drawn for a single eye at a point, or at infinity, looking down upon a static surface. A history is made of many agents acting from many positions, looking at each other across time. There is no single viewpoint to relocate in history because the subject matter itself possesses agency and perspective. The center of a history is not just a point of view but a locus of agency. When a course centers Europe, it does not merely change the angle of vision; it assigns the role of protagonist to one set of actors and the role of supporting cast or obstacle to everyone else. This is not a geometric distortion but a dramatic one. A map does not change the land it depicts, but a history changes the understanding of who acted upon the world. Therefore, the center of a history is something other than a point of view; it is a theory of causality and power.

  Given these fractures, we must determine what his analogy can actually carry. It supports a weaker claim than he wants. It successfully proves that perfect objectivity is impossible and that every narrative requires selection and structure. It validates the need for honesty about the limitations of a course. However, it does not support the claim that a Eurocentric frame is a legitimate default for a world-history survey. The weaker claim is this: since all histories are constructed, we should be transparent about our constructions. But transparency does not justify utility. If the course is titled World History, the utility required is an understanding of the world, not just the West. Using a Eurocentric frame for World History is like using a Mercator projection to teach the relative size of continents; it is honest about its projection, but it teaches falsehoods about the subject matter. The analogy grants him the right to be honest about his bias, but it does not grant him the right to claim that bias is pedagogically neutral.

  If we seek a figure that does the work better, I propose the atlas rather than the single map. A single map must choose one projection and live with its distortions, but an atlas is a collection of maps, each chosen for a specific purpose, which together allow the user to triangulate the shape of the world. An atlas acknowledges that no single view can capture the globe, but it does not resign itself to a single distortion. It captures the necessity of multiplicity that the single-map analogy denies. In the context of your course, an atlas model would mean structuring the syllabus not as one continuous narrative with a fixed center, but as a series of overlapping regional or thematic narratives that shift the center of gravity as the term progresses. This captures the polyphonic nature of history that the map analogy silences. It allows you to admit that no single story covers everything without conceding that the dominant story must remain the one inherited from the nineteenth century. The atlas suggests that the solution to the impossibility of a neutral view is not to pick one biased view and declare it honest, but to employ multiple biased views in conversation with one another. This preserves your colleague's insistence on honesty about limitations while rejecting his conclusion that we must settle for a single, inherited distortion. It turns the necessity of projection into an opportunity for comparison, which is, after all, the heart of historical thinking.
