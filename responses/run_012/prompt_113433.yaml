answer: |-
  **Scenario Brainstorming**

  1.  **The Insurance Actuary:** A health insurer adjusts premiums based on a "high-risk cohort" defined by exposure to a specific environmental toxin during childhood.
      *   *Stress-test:* The Boundary Problem. Where does the exposure zone end?
      *   *Drama:* A family denied coverage because they lived three miles outside the line.
      *   *Selection Risk:* Too technical; might drift into legal procedural rather than interpersonal conflict.

  2.  **The Museum Exhibit:** A curator designs a "Gen Z Experience" exhibit but struggles to find artifacts that aren't just "people using phones."
      *   *Stress-test:* The Loop. Does displaying the artifacts reinforce the stereotype?
      *   *Drama:* A young intern argues their experience isn't being represented.
      *   *Selection Risk:* Stakes feel low (cultural representation vs. material survival).

  3.  **The University Bridge Grant:** A department receives emergency funding to retain faculty who entered the job market during a specific economic contraction. Eligibility is strictly cohort-based.
      *   *Stress-test:* APC Entanglement. Is it the economy (period) or the career stage (age) that hurts them?
      *   *Drama:* Two colleagues, born months apart, face divergent futures.
      *   *Selection:* **Chosen.** High material stakes allow the abstract "boundary problem" to become a visceral betrayal. The institutional setting justifies the demographic language without it feeling forced.

  ***

  **The Cut**

  The spreadsheet glowed on Elias's screen, a grid of names and dates that felt less like personnel records than a geological strata map. He rubbed his eyes. The identification problem wasn't just a statistical nuisance; it was a moral hazard. He couldn't separate the age effect from the period effect, couldn't tell if these people were struggling because they were mid-career or because the world had ended in 2008. But the Provost needed a rule, and a rule required a line.

  He typed *January 1, 1982* into the eligibility cell.

  Below the line: Mara. Above the line: Julian.

  The committee meeting was held in a room that smelled of stale coffee and ozone. Elias sat at the head of the table, the projection remote heavy in his hand.

  "We can't just draw a line in the sand," Julian said. He was leaning forward, hands clasped tight. He was forty-two, born in November 1981. "My first tenure-track job was 2009. I graduated into the crash. I published during the austerity years. How is that different from someone born six weeks later?"

  "It's about the cohort signal," Elias said, keeping his voice flat. He hated the word *cohort*. It sounded like a military unit, not a group of people sharing a birth year. "We need a clean break for the regression. If we blur the boundaries, the variance swallows the effect size. We can't prove the intervention works if the treatment group is leaky."

  "So I'm noise?" Julian asked. The silence in the room was heavy, the kind that presses against the eardrums.

  "You're out of sample," Elias said. "The funding is designated for the 'Great Contraction Cohort.' The definition comes from the donor's foundation. They used labor market entry data. The cutoff is structural."

  "It's arbitrary," Mara said. She was sitting quietly, her hands folded in her lap. She was thirty-nine, born February 1982. She hadn't asked for this. "The market didn't recover on January first. It was a fog. We were all in the fog."

  "The fog has a date," Elias said. He clicked the slide. A bar chart appeared, showing a dip in hiring that looked like a valley. "We have to operationalize the trauma. If we don't, nobody gets the money."

  Julian looked at Mara. There was no anger in his eyes, just a hollow disbelief. "So you get the bridge funding. You get the course release. And I keep teaching the four-four load because I missed the cutoff by a month?"

  "It's not about merit," Elias said, though he knew that was exactly what it felt like. "It's about categorization."

  "It's about fiction," Julian said. He stood up. "You're treating a label like a law of physics. You're saying there's something real about 1982 that isn't about 1981. That's not demography. That's astrology."

  "It's administration," Elias corrected. "Sit down, Julian."

  Julian didn't sit. He walked out. The door clicked shut, a soft sound that seemed to finalize the data entry.

  Later, Elias found Mara in her office. The blinds were drawn. She was looking at the eligibility form on her desk, a pen hovering over the signature line.

  "You don't have to sign it," Elias said from the doorway.

  "If I don't, the money goes back to the pool," she said. She didn't look up. "Julian could apply for a share of the remainder, maybe. But the rules say it redistributes to the eligible cohort. Not to the excluded."

  "Julian doesn't want charity. He wants the principle."

  "The principle doesn't pay for childcare." Mara finally looked at him. Her eyes were tired. "You know, when I saw the date on the memo, I felt... relieved. I thought I was imagining it. The way my career stalled. I thought maybe I just wasn't good enough. Maybe I was just lazy."

  She tapped the pen against the paper.

  "But seeing that date... seeing that there's a category for it. It makes it real. It wasn't me. It was the times."

  "It was the times for Julian, too."

  "Not according to the sheet." She signed her name. The ink was dark and wet. "I feel guilty. But I also feel... seen. Is that sick? To be happy that there's a box for my damage?"

  "It's the loop," Elias said. He stepped into the room. "Once we name it, you start to live it. The category creates the cohesion."

  "So I'm a fiction that pays rent?"

  "You're a person who needs support," Elias said. "The category is just the pipe."

  "The pipe is shaped like a coffin," she said. She stood up and walked to the window, pushing the blinds aside. Outside, the campus was green, students moving in clusters across the quad. They looked ageless. "Julian thinks I'm a traitor. He thinks I'm accepting that we're different. That I'm accepting there's a generational essence."

  "Are you?"

  "I don't know." She turned back to him. "Before today, I was just a professor. Now I'm a member of the Contraction Cohort. I catch myself talking about it. 'We didn't have grants.' 'We couldn't travel.' I'm adopting the script. I'm becoming the data point."

  "That's how social kinds work," Elias said. "They aren't found. They're made. But once they're made, they hold weight."

  "Julian is leaving," she said. "He sent his CV to a private college. No research focus. Just teaching."

  "I know."

  "Because he won't play the game."

  "Because the game drew a line he couldn't cross."

  Mara picked up the form and handed it to him. "Take it. Process it."

  "Mara—"

  "Do it. If I'm going to be a fiction, I might as be a funded one." She smiled, but it didn't reach her eyes. "Tell Julian I'm sorry. Tell him the boundary was arbitrary. Tell him... tell him I'm still his colleague."

  Elias took the paper. It was warm from her hand. He walked back to his office and scanned the document. The system processed the signature instantly. A green checkmark appeared next to her name. *Eligible.*

  He looked at the list. Below her, names scrolled down. Above her, the list ended. The line was sharp, digital, absolute. It didn't look like a fog. It looked like a wall.

  He thought about Julian, packing his books. He thought about Mara, accepting the label to survive. He thought about the data, which would show a successful intervention for the 1982 cohort, a clean bump in productivity that would be published in a journal five years from now. The paper would say the funding worked. It would not say that it worked because it created a tribe, and the tribe protected its own. It would say the cohort was real.

  Elias closed the laptop. The screen went black, reflecting his own face, aged and lined. He wondered what year he belonged to, and if anyone would draw a line for him before he was gone.

  ***

  **Author's Note**

  I chose the university grant scenario because material stakes clarify ontological disputes. When a birth date determines income, the "boundary problem" ceases to be theoretical. The story leaves standing the position that generations are "useful fictions" with causal power (the Loop). They are not natural kinds discovered in the data, but social kinds created by the intervention itself. Mara's acceptance of the label validates its utility while acknowledging its falsity. The drama arises not from solving the APC problem, but from living inside its unsolvable constraints. The "realness" that survives is not biological, but institutional.
