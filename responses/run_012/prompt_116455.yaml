      *   *Actually, Step 4 is the logical fallacy.* The "Fallacy of Composition." Explaining the *correlation* between objects requires a shared cause. If I find 500 identical pots, 500 individual "habits" is less parsimonious than 1 "production tradition."
      *   *Let's look at Step 1.* Is it true beliefs must be part of the *best* explanation? Yes, that's standard IBE.
      *   *Decision:* The strongest philosophical lever is Step 2 (definition of parsimony) and Step 4 (treatment of the assemblage). Step 2 is the deeper philosophical error. Step 4 is the practical archaeological error.
      *   *IBE Status:* IBE is fine, but Dan is using a "naive" version.

  6.  **Final Polish (checking constraints):**
