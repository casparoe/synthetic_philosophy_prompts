      *   *Wait, re-reading:* "I'd definately like to keep (1), (2) and (3)... So: is some step doing something dodgy... or is the thing valid and I've just got to swallow a premise". Okay, I need to tell them which one *must* go, even if they want to keep it.
      *   *British English Check:* "Licence" (verb/noun distinction), "programme", "centre", "defence", "modelling". Idioms: "rent-free", "dodgy", "scupper", "mate".
      *   *IBE Frame:* Is it the right frame? Yes, but needs refinement.

