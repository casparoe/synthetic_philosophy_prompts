  *(Self-Correction on British English)*: Ensure I don't overdo the slang. Keep it professional but distinctly UK academic. "Licence" vs "License" (noun is licence, verb is license, though often mixed, strict pedants prefer the distinction). "Programme" not "Program". "Centre" not "Center".

  *(Refining Step 2 analysis)*: Dan's definition of parsimony is "ontological parsimony" (Quine). But there is also "syntactic parsimony" (length of explanation). A single rule (institution) is syntactically more parsimonious than 1000 individual rules (habits). This is the key.

