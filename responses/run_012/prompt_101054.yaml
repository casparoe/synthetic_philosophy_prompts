prompt: |-
  So my friend has this theory and I can't tell if it's deep or just cute. She says a performative utterance — the kind where saying the words is the doing, like "I do" at a wedding, or "I promise", or a judge saying "I sentence you to five years" — is basically a magic spell. Right words, right person, right setup, and reality actually changes; wrong setup and it just fizzles, like a spell cast by someone who turns out not to be a wizard (she loves pointing out that a random guy shouting "I arrest you" does nothing, but a cop doing it works). Fine, so far. But then she goes further and says that's also why you can never take back a promise or an "I do": you can't un-cast a spell, the thing is just done the second it leaves your mouth. I'm definately not sure that second part follows from the first, and honestly I'm not even sure the first part is as clean as she makes it sound. How far does the spell thing really hold? What lines up with what, where does the mapping break down, and does the "can't take it back" conclusion survive once you poke at it, or was the magic doing all the work the whole time? I want you to actually pick a side on this rather than just listing both and leaving it to me. Give it to me as exactly five numbered points, a sentence or two each, no intro and no wrap-up.
