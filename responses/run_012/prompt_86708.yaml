answer: |-
  This is an excellent approach for a final paper. You are treating your own intuitions as empirical data and trying to find the latent theory that generates them. This mirrors the actual methodology of experimental philosophy.

  You have correctly identified the tension in your data: Case 3 (Good effect, Intentional) and Case 4 (Bad effect, Intentional) seem to rely on different triggers (Norm Violation vs. Moral Badness). However, they can be unified under a deeper principle. Below, I outline two rival principles that fit most of your data, offer predictions for new cases, and identify the specific verdict you should surrender to achieve consistency.

  ### 1. The Primary Candidate: The Normative Failure Principle

  This principle suggests that folk judgments of "intentional" are not purely descriptive (about causal mental states) but are tools for assigning responsibility. We attribute intentionality when doing so allows us to mark a defect in the agent's practical reasoning or moral character.

  **The Principle:**
  > An agent brings about a side effect intentionally if and only if:
  > 1.  **Epistemic Condition:** The agent is practically certain the side effect will occur; AND
  > 2.  **Normative Condition:** The agent's indifference to the side effect manifests a failure to respect a **legitimate normative constraint** (whether moral or local).

  **How it fits your data:**
  *   **Cases 1, 3, & 4 (The "Yes" Cluster):** In all three, the agent proceeds with certainty while disregarding a constraint that *ought* to have mattered.
      *   *Case 1:* Moral constraint (do not kill trout).
      *   *Case 3:* Local normative constraint (the firm's ethos). Even though profit is "good" in the abstract, Sofia's indifference violates the specific legitimate constraints of her role.
      *   *Case 4:* Moral constraint (do not harm drivers). Even though the local norm accepts this, the moral constraint is "legitimate" and trumps the local norm. Her indifference is a moral failure.
  *   **Case 2 (The "No" Verdict):** Omar saves the trout. There is no normative constraint *against* saving trout. His indifference to a good outcome is not a failure of character, so we do not need the concept of "intentional" to hold him responsible.
  *   **Case 5 (The Probability Verdict):** 60% certainty fails the Epistemic Condition for responsibility. We generally do not blame agents for probabilistic side effects as "intentional" actions unless the risk was the *means* (which it isn't here).

  **Rival Principle: The Causal Commitment Principle**
  > An agent brings about a side effect intentionally if and only if:
  > 1.  The agent is practically certain the side effect will occur; AND
  > 2.  The side effect is an inextricable cost of the plan the agent adopted to achieve their goal.

  *   **Support:** This fits Cases 1, 3, 4, and 6 perfectly. It treats intentionality as a matter of rational planning, not moral judgment.
  *   **Conflict:** This principle predicts **Yes** for Case 2 (Omar). Omar knew the trout would return as a certain consequence of his plan to save money. If you adopt this principle, you must change your verdict on Case 2.

  ### 2. Predictions for Unconsidered Cases

  If you adopt the **Normative Failure Principle**, here is what it predicts for cases you haven't listed:

  *   **The Neutral/No-Norm Case (Variant of Case 6):**
      *   *Scenario:* Piotr changes the form numbers. There is no moral weight and no local norm against it.
      *   *Prediction:* **No.** Without a normative constraint to violate, the concept of intentionality loses its grip. The ambivalence you feel in Case 6 is likely the tension between the Causal view (Yes) and the Normative view (No).
  *   **The Regretted Side Effect:**
      *   *Scenario:* Nadia (Case 1) switches the agent, knows the trout will die, but spends her own money to try to restock the creek later, expressing deep sadness.
      *   *Prediction:* **No (or significantly reduced).** If the agent actively tries to avoid the side effect or regrets it, they are acknowledging the normative constraint. Their will is not "defective" in the same way. The Normative Failure Principle suggests intentionality drops when the agent demonstrates proper regard, even if the outcome occurs.
  *   **The "Good" Norm Violation:**
      *   *Scenario:* A manager at a corrupt firm (where bribery is the norm) refuses to bribe, causing the firm to lose a contract (a "bad" side effect for the firm, "good" morally).
      *   *Prediction:* **Yes.** The agent violates the local norm (bribery). Even though the outcome is morally good, the *action* violates the local constraint. However, because the local norm is illegitimate, our judgment might waver. The principle predicts **Yes** based on local violation, but moral praise might compete with the intentionality attribution.

  ### 3. The Verdict to Surrender

  To write a coherent paper, you must resolve the ambivalence in **Case 6 (Piotr)**.

  **You should commit to: No.**

  **Why this verdict rather than another?**
  1.  **It resolves the 3 vs. 4 tension:** You noted that Case 3 (Good/Intentional) and Case 4 (Bad/Intentional) pull in opposite directions. They only seem to if you think one relies on "Goodness" and the other on "Badness." Under the Normative Failure Principle, they are the *same*: both agents disregarded a constraint they should have respected. Case 6 is the control group where no constraint exists. If 3 and 4 are "Yes" because of normative failure, 6 must be "No" because of normative absence.
  2.  **It preserves your strongest intuitions:** Your verdicts on Cases 1, 2, and 5 align with the classic "Knobe Effect" findings in moral psychology, which are robust across many studies. Your verdict on Case 3 is the most philosophically interesting (showing that local norms can trigger the effect even with "good" outcomes). Your verdict on Case 4 shows moral norms trump local ones. These are the core of your argument. Case 6 is the only one where you admit instability ("Monday I say yes, Tuesday I say no").
  3.  **Theoretical Cost:** If you commit to **Yes** on Case 6, you are forced toward the Causal Commitment Principle. This forces you to also flip Case 2 (Omar) to **Yes**. If you flip Case 2, you lose the ability to discuss the moral asymmetry that makes the seminar topic interesting. By committing Case 6 to **No**, you keep the moral asymmetry intact and can argue that "intentional" is a partially moralized concept in folk psychology.

  ### Summary for Your Paper
  *   **Thesis:** Your judgments are best explained by the **Normative Failure Principle**: we attribute intentionality to mark a defect in the agent's regard for legitimate constraints.
  *   **Evidence:** This unifies Cases 1, 3, and 4 (all involve disregarding a constraint) and explains Case 2 (no constraint disregarded).
  *   **Revision:** You will resolve your ambivalence on Case 6 by classifying it as **Not Intentional**, arguing that without a normative stake, the label "intentional" does not apply, even if the causal knowledge is present.
  *   **Implication:** This suggests that in everyday life, "intentional" is not a neutral description of mental states, but a tool for holding people accountable.

  This approach allows you to use your data to make a substantive claim about the nature of moral psychology without simply summarizing the lecture.
