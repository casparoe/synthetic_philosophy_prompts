      **The Strongest Case Against Repeal**
      The most compelling argument against repeal is stability. Frequent changes to covenants undermine the predictability residents rely on when buying homes. Aesthetic uniformity arguably protects property values, which benefits all owners, regardless of the rule's origin. Additionally, removing height restrictions could lead to a "race to the top," where aggressive fencing alters the neighborhood's open character, creating new conflicts between neighbors over sightlines and sunlight. A Burkean would argue that even flawed traditions provide social cohesion, and dismantling them risks unraveling the shared norms that keep the community functioning.

      **Conclusion**
      While stability is valuable, it cannot justify maintaining a rule rooted in exclusion. We can preserve neighborhood character through neutral design reviews rather than arbitrary height limits. I urge the Board to vote for repeal Tuesday, grandfather existing structures, and close this chapter on our history.

