      *   *Wait, let's look at the Chesterton's Fence angle:* Chesterton says don't remove a fence until you know why it was put up. We *now* know why it was put up (exclusion). Does that justify removal? Yes, because the "wisdom" was actually prejudice. The fence wasn't protecting society; it was harming it.
