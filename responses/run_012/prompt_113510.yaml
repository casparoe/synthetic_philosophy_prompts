      Our President rightly invokes Edmund Burke and Chesterton's Fence: we should not remove a tradition until we understand its purpose. This conservative presumption protects us from arrogance. However, Chesterton's principle requires us to *find* the reason, not just assume it is wise. Our review of the 1970s minutes revealed the specific intent: excluding a group home for adults with disabilities to protect "property values."

      This discovery changes the calculation. Chesterton's Fence protects wisdom accumulated over time, not prejudice codified into law. When the "wisdom of the ancestors" is revealed to be discrimination, preserving it violates the Burkean partnership between the dead, the living, and the unborn. We honor the past by correcting its injustices, not perpetuating them. Furthermore, my colleague who cited the genetic fallacy is partially correct: origins alone don't invalidate a rule. But here, the origin explains the *function*. A rule designed to exclude vulnerable people continues to signal exclusion, even if enforcement is lax.

