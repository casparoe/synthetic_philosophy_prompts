  After the scenario, walk me through the whole thing: say exactly what the belief is and what the external vehicle is, then run each criterion on it — why parity says yes, and why the trust-and-glue conditions (reliable availability, automatic endorsement, ready accessibility) say no, or which ones do. Then tell me which single feature of the case is carrying the weight, what happens if I delete that feature, and how somebody who thinks the artifact really is part of the agent's mind would go after my case. If the upkeep condition ends up giving a third verdict, say whether it lines up with the intuition or whether it's just tracking one of the other criteria in disguise. And please actually run the criteria on the case rather than telling me what the standard positions say in general — the whole point is that the case has to generate the verdicts, not have them baked in.
