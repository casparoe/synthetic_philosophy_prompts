  **The Scenario**

  Mark is renovating his kitchen and needs to order custom cabinets. He carries a small, weathered notepad in his shirt pocket where he records room dimensions as he measures them. When he calls the supplier to place an order, he reads the fridge slot width directly from the notepad ("36 inches") rather than recalling it from biological memory. He treats the notepad as his primary store for these figures; he never attempts to memorize them. However, Mark follows a strict "measure twice" rule: before finalizing any order based on the notepad's figures, he physically re-measures the space to verify the number written down. He does this even if he wrote the number himself ten minutes ago. Furthermore, when the notepad is sitting on his counter between measuring sessions, he pays no attention to its physical condition. If a page curls from humidity or the ink smudges, he leaves it alone. He only cares about the notepad's integrity at the exact moment he needs to read from it; he feels no disposition to preserve or correct the store while it is idle.

  **The Analysis**

  **1. The Belief and the Vehicle**
  *   **The Belief:** "The fridge slot width is 36 inches."
  *   **The External Vehicle:** The entry in the pocket notepad.

  **2. Running the Criteria**

  *   **The Parity Principle (Verdict: YES):**
      The Parity Principle asks us to imagine Mark performing this task without the notepad. If he had memorized the measurement and recalled it while on the phone, we would unhesitatingly call that a belief. In the actual scenario, the notepad plays the exact same functional role: it stores the information, preserves it across time, and is accessed to guide action (ordering cabinets). The process of "reading the pad" is functionally isomorphic to "recalling from memory." Therefore, Parity suggests the notepad entry is constitutive of Mark's cognitive system—it *is* his belief.

  *   **The Trust-and-Glue Conditions (Verdict: NO):**
      Clark's refinement requires the external resource to be reliably available, automatically endorsed, and easily accessible.
      *   *Accessibility:* Passes. The pad is in his pocket.
      *   *Reliability:* Passes. Mark writes the numbers himself accurately.
      *   *Automatic Endorsement:* **Fails.** This is the wedge. When Mark accesses his biological memory, he typically acts on it without a secondary verification step (unless he has specific reason to doubt). With the notepad, his standard operating procedure is *not* to trust the entry automatically. He treats the written number as a *claim* that requires verification (the second measure) before it can drive action. He does not treat the notepad as transparent memory; he treats it as fallible testimony, even from his past self. Because the information is not "glued" via automatic trust, it remains merely coupled.

  *   **The Upkeep Condition (Verdict: NO):**
      This condition requires the agent to be disposed to maintain the external store's integrity even when not currently using it (analogous to how biological memory is maintained via neural health or rehearsal). Mark fails this. He ignores the smudging or curling of the pages when the pad is idle. He only engages with the store's integrity instrumentally, at the moment of retrieval. He lacks the dispositional commitment to the *store itself* that characterizes our relationship with our own minds.

  **3. The Weight-Carrying Feature**
  The feature carrying the weight for the Trust-and-Glue verdict is the **verification protocol** (the "measure twice" rule).
  *   **If you delete this feature:** If Mark trusted the notepad entry automatically (measuring once and ordering immediately), the *Automatic Endorsement* condition would be satisfied. The case would then likely pass Trust-and-Glue, collapsing the split with Parity. The verification step creates a cognitive "distance" between Mark and the note that prevents it from being "glued."

  **4. The EMT Proponent's Objection**
  A defender of the Extended Mind Thesis would attack the interpretation of the verification step. They would argue that the "measure twice" protocol is not a sign of *distrust*, but rather part of the **extended cognitive process itself**. Just as biological cognition includes error-checking mechanisms (e.g., reality monitoring), Mark's extended system includes the re-measurement as a subroutine. They would argue that the *system* (Mark + Pad + Tape Measure) automatically endorses the result *after* the check, and that requiring the check doesn't make the pad external any more than requiring neural processing time makes memory external. They would claim I am setting the bar for "glue" impossibly high by demanding blind trust, whereas "reliable integration" is sufficient.

  **5. Evaluating the Upkeep Condition**
  The Upkeep Condition gives the same verdict as Trust-and-Glue (No), which suggests it may not be a distinct criterion but rather a **proxy for Integration**.
  *   **Tracking Disguise:** Upkeep seems to track the *depth* of the coupling found in the Glue condition. If a resource is truly "glued" (part of the mind), we naturally maintain it (like we maintain our health or rehearse important facts). If it is merely a tool, we only maintain it when useful.
  *   **Intuition Check:** However, Upkeep does capture a specific intuition that Glue misses: the *temporal persistence* of the cognitive relationship. Glue focuses on the moment of retrieval (is it trusted *now*?). Upkeep focuses on the time *between* retrievals (do I care about it *then*?). In Mark's case, his indifference to the smudging ink aligns with the intuition that the notepad is a disposable tool, not a part of him. So, while it likely collapses into "Integration" theoretically, it serves as a useful *heuristic* for spotting cases where the coupling is shallow, even if accessibility and reliability are high. It clarifies *why* the endorsement isn't automatic: because the agent doesn't view the store as something that needs to persist independently of their immediate attention.
