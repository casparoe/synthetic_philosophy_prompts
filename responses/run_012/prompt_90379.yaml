answer: |-
  Thanks for sharing this draft. It is a sharp piece of writing and you have managed to condense a very messy debate into something readable and provocative. To answer your primary worry straight away, the distinction you are drawing between derivable and costly items is not merely a verbal trick, though it does risk oversimplifying a spectrum into a binary. You are effectively resurrecting the old epidemiological critique of memetics, most famously associated with Dan Sperber, but you are giving it a useful economic twist by focusing on the cost of fidelity. Sperber argued that most cultural transmission is reconstruction based on cognitive attractors rather than replication, which maps neatly onto your derivable category. However, your framing of the high-fidelity stuff as costly items that require enforcement adds something new to the conversation. It moves the discussion from a cognitive argument about how memory works to a sociological argument about who pays for the suppression of variation. That feels like genuine work, not just semantics, because it points you towards different empirical evidence. If you are looking for a replicator, you should not just look for popularity, you should look for the institutions punishing deviation.

  On the question of whether this is a rehash, I think you are safe. The general shape of the argument will be familiar to anyone who has read the cultural evolution literature from the last twenty years, but the specific formulation here is fresh. Most people argue about whether memes exist or not, but you are arguing about the conditions under which Darwinian selection is even the right tool for the job. That is a more sophisticated position than the standard scepticism. You are conceding that Darwinian processes happen, but you are restricting their domain much more severely than the standard modellers do. This is interesting because it saves the Darwinian model from being vacuous. If everything is evolving, then nothing is specifically evolving in the biological sense. By narrowing the scope to costly items, you make the claim falsifiable and meaningful.

  However, there is a point where I think you might be overstating the case, and this touches on your question about whether you should be more concessive to the Darwinian crowd. You write that derivable items never stay still and their distribution tracks the shape of the prior space rather than history. While it is true that they do not form lineages in the strict genetic sense, they can still exhibit stability and historical contingency. If the landscape of priors is rugged, a derivable item can sit in a deep attractor basin for centuries without changing much, even without enforcement. Folk tales often retain core structures across millennia despite being reconstructed every time they are told. So, saying they never stay still is too strong. It would be more accurate to say their stability is a function of the cognitive landscape rather than the fidelity of transmission. This matters because it means you do not have to concede that stable derivable items are actually secret replicators. They can be stable without being Darwinian, which preserves your distinction without forcing you to ignore obvious counter-examples of long-lasting cultural forms that nobody enforces.

  There is also a nuance worth considering regarding the costly items. You suggest that for these items, the interesting question is about power rather than fitness. I think this is the strongest insight in the essay, but it needs a slight caveat. Power determines whether the enforcement happens, but fitness might still determine which enforced items survive the long term. Even within a regime of high-fidelity enforcement, some liturgies or legal formulas might prove more resilient to social change than others. So, while the mechanism of retention is power, the mechanism of differential survival among the enforced items could still be evolutionary. You might want to acknowledge that power sets the boundary conditions for the Darwinian process, rather than replacing fitness entirely. This would make you sound less like you are dismissing evolutionary theory and more like you are specifying the ecological niche in which it operates.

  As for things that are flat-out wrong, there is nothing egregious, but there is a risk in how you define copying. You describe copying as requiring a host to suppress their own priors. In reality, even high-fidelity copying often relies on priors to work. Reading musical notation, for example, is a costly skill that requires institutional enforcement, but it also relies on the learner having priors that make sense of symbols. The distinction is not necessarily between using priors and not using them, but between using priors to reconstruct meaning versus using priors to decode a signal. If you tighten that definition, you avoid the objection that all learning is reconstruction. The costly item is not one where priors are absent, but one where the cost of ignoring the priors is higher than the cost of copying the signal.

  Finally, on the direction of the argument, I think you are right to resist the idea that culture is Darwinian all the way down. Conceding that point usually leads to just-so stories where every cultural trend is explained by selection pressures that cannot be measured. Your approach forces a rigour that is currently lacking in the field. If someone claims a cultural item is evolving, your framework demands they show the enforcement mechanism. If they cannot, then it is likely a derivable item driven by psychological biases. This is a productive way to split the field. I would suggest you lean even harder into the consequence you mentioned about power. That is where the essay has the most potential to say something new about how institutions shape culture, rather than just debating the definition of a meme. Overall, you are not going in circles; you have found a solid axis around which to rotate the problem. Just soften the claim about derivable items never staying still, and you will have a very robust position.
