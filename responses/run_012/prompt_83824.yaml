answer: |-
  ### Preliminary Mapping of the Phenomenological Landscape

  Before specifying the desiderata, we must delimit the data. A theory of Moore's Paradox cannot simply target the sentence "It is raining but I don't believe it." It must account for the boundaries of the absurdity. Based on a comprehensive survey of the logical space, the following cases constitute the extension of the phenomenon:

  1.  **Standard Omissive:** Asserting $p \land \neg B(I, p)$. (Absurd).
  2.  **Standard Commissive:** Asserting $B(I, p) \land \neg p$. (Absurd).
  3.  **Unasserted Entertaining:** Merely believing or thinking $p \land \neg B(I, p)$. (Absurd/Irrational).
  4.  **Third-Person:** Asserting $p \land \neg B(S, p)$ where $S \neq I$. (Not absurd).
  5.  **Past-Tensed:** Asserting $p \land \neg B_{past}(I, p)$. (Not absurd).
  6.  **Attitudinal Variants:** Knowledge ("I know $p$ but $\neg p$"), Intention ("I intend $\phi$ but I won't $\phi$"), Desire.
  7.  **Embedded Contexts:** Conditionals ("If $p$ and I don't believe it..."), Questions ("Is $p$ true but I don't believe it?").
  8.  **Graded/Credal:** Probabilistic belief mismatches.
  9.  **Collective/Plural:** Group belief vs. individual belief mismatches.

  Having committed to this range, I now specify the requirements any adequate theory must satisfy.

  ---

  ### The Desiderata Specification

  An adequate theory of Moore's Paradox must satisfy the following six requirements. For each, I provide the motivating contrast and the theoretical cost of failure.

  #### 1. The Assertoric Irrationality Requirement
  *   **Motivation:** The core datum. Uttering "The meeting is at three, but I don't believe it" is not merely false; it is *absurd* or *irrational* in a way that distinguishes it from lying or simple error.
  *   **Contrast:** Compare with "The meeting is at three, but it is not at three." The latter is a contradiction; the former is not. Compare with "The meeting is at three, but John doesn't believe it." The latter is perfectly rational to assert.
  *   **Forfeit:** If a theory cannot explain why the *assertion* is barred, it fails to capture the paradox entirely, reducing it to a mere curiosity of grammar.

  #### 2. The Truth-Compatibility Requirement
  *   **Motivation:** Moore's central insight. The proposition expressed ($p \land \neg B(I, p)$) can be *true*. I can be wrong about my own beliefs, or the world can be such that $p$ holds while I remain unaware.
  *   **Contrast:** Compare with "The meeting is at three and not at three." This cannot be true. A Moorean sentence can be verified by a third party (e.g., a psychologist observing the speaker).
  *   **Forfeit:** If a theory renders the Moorean proposition logically contradictory or necessarily false, it dissolves the paradox by denying Moore's premise. It turns a pragmatic/psychological puzzle into a semantic triviality.

  #### 3. The Doxastic Parallel Requirement
  *   **Motivation:** The absurdity attaches not just to the *speech act* but to the *mental state*. It is irrational to *believe* the Moorean proposition, not just to say it.
  *   **Contrast:** Compare with a standard Gricean implicature violation. If I say "Some of the students passed" when I know all did, I violate a maxim, but I can *believe* "Some of the students passed" without irrationality. With Moore, believing $p \land \neg B(I, p)$ is itself a failure of rationality.
  *   **Forfeit:** If a theory locates the absurdity solely in the norms of communication (assertion), it cannot explain why *silent belief* in the Moorean proposition is also defective. This is the primary weakness of pure pragmatic accounts.

  #### 4. The Indexical Sensitivity Requirement
  *   **Motivation:** The absurdity is essentially first-person and present-tensed.
  *   **Contrast:**
      *   *Person:* "It is raining but *he* doesn't believe it" is fine.
      *   *Tense:* "It was raining but I *didn't* believe it" is fine.
  *   **Forfeit:** If a theory treats the belief report as a standard relation between an agent and a proposition regardless of tense or person, it overgenerates absurdity. It must explain why the "window" of absurdity is restricted to the speaking subject at the time of speaking.

  #### 5. The Attitudinal Generalization Requirement
  *   **Motivation:** The paradox is not unique to *belief*. It arises with other attitudes that involve a "mind-to-world" or "world-to-mind" direction of fit.
  *   **Contrast:**
      *   *Knowledge:* "I know $p$ but $p$ is false" (This is a contradiction, not Moorean).
      *   *Intention:* "I intend to $\phi$ but I will not $\phi$" (Moorean absurdity).
      *   *Desire:* "I want $p$ but not-$p$" (Not necessarily absurd, depends on formulation).
  *   **Forfeit:** If a theory relies on specific semantic properties of the word "believe," it will fail to capture the structural similarity with intention and other attitudes. The theory must target the *structure of the attitude*, not the lexicon.

  #### 6. The Embedding Stability Requirement
  *   **Motivation:** We need to know if the absurdity projects out of logical operators.
  *   **Contrast:** "If $p$ and I don't believe $p$, then I am ignorant." This sentence seems acceptable, whereas asserting the antecedent is not.
  *   **Forfeit:** If a theory claims the Moorean conjunction is semantically contradictory, it predicts that embedding it should preserve the contradiction (e.g., "If [contradiction]..."). If the absurdity vanishes in embedding, a semantic contradiction account is threatened. If the absurdity persists, a pure pragmatic account is threatened.

  ---

  ### Genuine Constraints vs. Camp Commitments

  We must distinguish between data that *any* theory must respect and data that are artifacts of specific theoretical frameworks.

  **Genuine Constraints:**
  *   **Truth-Compatibility (Req 2):** Any theory that makes the proposition contradictory fails the basic logical test.
  *   **Indexical Sensitivity (Req 4):** The shift in absurdity upon changing person/tense is a hard linguistic datum.
  *   **Doxastic Parallel (Req 3):** The irrationality of the mental state is pre-theoretically robust.

  **Camp-Specific Commitments (Not Desiderata):**
  *   **"The content is contextually contradictory":** This is a *solution* (Semantic Contextualism), not a requirement. A pragmatic theory denies this.
  *   **"Assertion constitutes belief":** This is a *solution* (Constitutive Norms), not a requirement. A theory can deny this and still explain the absurdity via evidence norms.
  *   **"Transparency is infallible":** Some theories assume we cannot be wrong about our beliefs. This is too strong; the paradox exists precisely because we *can* be wrong, yet asserting the error is barred.

  ---

  ### The Battlefront: Semantics vs. Pragmatics

  This is where the two dominant camps will clash most violently regarding the specification above.

  **The Pure Pragmatic Account (e.g., Gricean/Searlean):**
  *   **Stronghold:** Explains **Truth-Compatibility** easily. The content is fine; the violation is in the rules of conversation (e.g., asserting $p$ implies you believe $p$).
  *   **Weak Point:** **The Doxastic Parallel.** If the problem is merely about *telling* others, why is *thinking* the thought irrational? To survive, the pragmatist must argue that belief itself is governed by norms analogous to assertion (e.g., the Norm of Belief is Truth, or Knowledge).
  *   **Hardest Fight:** They must explain why the absurdity feels *logical* rather than merely *impolite* or *uncooperative*.

  **The Semantic Account (e.g., Contextualist/Expressivist):**
  *   **Stronghold:** Explains **The Doxastic Parallel** and **Assertoric Irrationality** robustly. If the content is contradictory *in the context of utterance*, believing it is believing a contradiction.
  *   **Weak Point:** **Truth-Compatibility** and **Embedding.** If the content is contradictory, how can it be true (as verified by a third party)? And why does the contradiction vanish in "If..." clauses?
  *   **Hardest Fight:** They must explain how a proposition can be contradictory for the speaker but true for the observer without resorting to ad hoc relativism.

  ---

  ### Incompatible Desiderata?

  There is a profound tension between **Truth-Compatibility (Req 2)** and **The Doxastic Parallel (Req 3)**.

  *   **The Tension:** If it is irrational to *believe* $M$ ($p \land \neg Bp$), this suggests $M$ is necessarily false *for the believer*. If $M$ is necessarily false for the believer, in what robust sense is it **True-Compatible**?
  *   **The Conflict:** To satisfy Req 2, the theory must say $M$ describes a possible state of the world. To satisfy Req 3, the theory must say a rational agent cannot occupy that state *while representing it as such*.
  *   **Resolution:** A theory must posit a **blindspot**. The proposition is contingent and can be true, but it cannot be *rationally believed by the subject it concerns*. If a theory collapses this distinction (by making $M$ logically contradictory), it fails Req 2. If it makes $M$ fully belief-able but just unassertable, it fails Req 3.
  *   **Verdict:** These are not logically incompatible, but they are *explanatorily* tension-filled. The "cost" of satisfying both is positing a unique category of proposition: one that is truth-apt but doxastically inaccessible to the subject.

  ---

  ### The "Killer" Requirement

  The single requirement that does the most to rule out the most popular accounts is **The Doxastic Parallel Requirement (Req 3)**.

  *   **Why:** The most intuitive and popular initial reaction to Moore's Paradox is a Gricean pragmatic one: "To assert $p$ is to imply you believe $p$; therefore saying 'I don't believe $p$' cancels the implication, creating a clash."
  *   **The Kill:** This explains why you can't *say* it. It does not explain why you can't *think* it. If the paradox were merely about communication, silent self-deception or simple irrationality of the form "I believe $p$ is true but I don't believe it" would be unproblematic. But it is problematic. Any theory that locates the absurdity *solely* in the public act of assertion is immediately falsified by the fact that the absurdity persists in private thought. This forces theories to move from norms of *conversation* to norms of *rationality*.

  ---

  ### The Hard Cases: Graded and Collective

  You asked specifically about two difficult variants. They are not marginal; they are stress tests for the Indexical and Attitudinal requirements.

  #### 1. Graded Versions (Credence)
  *   **Case:** "It is very likely to rain, but my credence that it will rain is low."
  *   **Analysis:** This is the same phenomenon, scaled. It tests whether the theory relies on binary belief ($B$ vs $\neg B$) or degrees of confidence.
  *   **Requirement Addition:** **The Continuity Requirement.** A theory must explain why the absurdity degrades smoothly as the mismatch between objective probability and subjective credence narrows, rather than vanishing abruptly at a binary threshold.
  *   **Theoretical Impact:** This kills accounts that rely on strict binary logic of belief. It favors probabilistic norms of rationality (e.g., accuracy-centered epistemology). If a theory cannot handle credence, it treats belief as too coarse-grained to capture the actual phenomenology of uncertainty.

  #### 2. First-Person Plural (Collective Belief)
  *   **Case:** "The committee thinks the deadline is Friday, but I don't think the deadline is Friday."
  *   **Analysis:** This tests the **Indexical Sensitivity Requirement**.
      *   *Aggregate Reading:* If "The committee thinks" means "Most members think," there is no paradox. I am simply dissenting from the majority.
      *   *Singular Collective Reading:* If the committee is treated as a single epistemic agent of which I am a constitutive part, the paradox re-emerges. If I am the chair speaking *for* the committee, asserting the collective view while disavowing it personally creates a Moorean tension similar to the individual case.
  *   **Requirement Addition:** **The Subject-Identity Requirement.** The theory must specify the conditions under which the subject of the belief report ($S$ in $B(S, p)$) is identical enough to the speaker to trigger the paradox.
  *   **Theoretical Impact:** This challenges the "First-Person Authority" explanations. If the paradox arises from my privileged access to *my* mind, why does it arise when I speak for a *group* mind? It suggests the paradox is not about private access, but about **commitment**. When I say "We believe," I commit myself to the truth of $p$. Disavowing belief while maintaining that commitment generates the tension. This supports normative accounts over phenomenological accounts.

  ### Summary of the Specification

  To solve Moore's Paradox, you must construct a theory that:
  1.  Permits the proposition to be **true** (Req 2).
  2.  Renders the proposition **unbelievable** for the subject (Req 3).
  3.  Restricts this unbeliefability to the **present first-person** (Req 4).
  4.  Applies across **attitudes** like intention (Req 5).
  5.  Handles **degrees** of belief and **collective** subjects without ad hoc adjustments.

  Most theories fail because they secure Truth-Compatibility by sacrificing Doxastic Parallel (Pragmatics), or secure Doxastic Parallel by sacrificing Truth-Compatibility (Semantic Contradiction). The specification demands a theory that walks the line: a proposition that is true in the world, but false in the rational space of reasons for the speaker.
