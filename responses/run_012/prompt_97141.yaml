      *   **Dana's Move 1 (Genetic Fallacy/Distinction):** Explaining a belief $\neq$ evaluating its truth. (Fridge light analogy). Explaining the report doesn't explain the experience.
      *   **Marcus's Move 2 (No Independent Grip):** Our only access to the "extra fact" (qualia) is the intuition. If the intuition is explained mechanically, there's no evidence left for the extra fact.
      *   **Marcus's Move 3 (Vitalism Analogy):** Positing non-physical facts for intuition is like positing "vital force" for life. Parsimony demands rejecting it.
      *   **Dana's Move 2 (Self-Defeat/Reflexivity):** If explaining the cause debunks the intuition, Marcus's own reasoning is debunked (evolutionary argument against naturalism style).
      *   **Dana's Move 3 (Explanatory Gap/Parsimony):** Deflationism needs to explain why the illusion is so stubborn/uniform. If the explanation requires assuming experience is real, it begs the question.
      *   **Marcus's Move 4 (Empirical Claim):** It's not begging the question; it's an empirical claim about cognitive mechanisms.

  3.  **Evaluate Each Claim (Drafting the Ratings):**

      *   *Marcus 1 (Explaining intuition explains away Hard Problem):* This is the core of Illusionism (Frankish, etc.). It's coherent but controversial. *Rating:* Plausible within framework, but question-begging against realists. Let's call it "Controversial but Internally Consistent."
