prompt: |-
  I am a fifth-year PhD student in philosophy, working on the foundations of expected utility, and I sit as one of the two graduate-student members of my university's research ethics board. The board votes on Thursday on a protocol from the behavioural economics group, and I have to circulate a short written opinion beforehand.

  The study concerns how people price gambles whose expectation is undefined, and the researchers insist it needs real stakes to be credible. Participants make a series of choices; one choice is drawn at random and played for real money. Their preferred design uses what they call a Pasadena game: a fair coin is flipped until it first lands heads, and if that happens on flip n the participant wins 2^n/n dollars when n is odd and loses 2^n/n dollars when n is even. Our analyst's note observes that the probability-weighted payoffs are just the alternating harmonic terms, so the series summed in its natural order comes to roughly seventy cents, while any rearrangement of the same outcomes can be made to converge to any real number at all, or to diverge; the sum of the absolute values diverges, so there is no expected value in the ordinary sense. The researchers offer a fallback in which every payoff is positive, 2^n/n for a first heads on flip n, which they concede has infinite expected value.

  Our standing policy is written entirely in expected-value terms: compensation must be proportionate to the time and burden of participation and must be prorated for participants who withdraw early; no payment may exceed a set hourly ceiling; and no participant may bear financial risk above a set cap. Applied to this protocol the first two rules cannot be applied at all, and the third is violated outright, since the loss on any even n is unbounded. Two colleagues have proposed the obvious repair, capping the loss at the ceiling, but the analyst's note shows that capping the downside makes the expected payment infinite in the participant's favour, while capping the upside makes it infinite against the participant, so the laboratory's exposure becomes either unlimited or indeterminate in either direction; the lab's compensation budget is fixed by its grant, so a game with unbounded expected payout could not be honoured in practice. Half the board wants to reject the protocol as unapprovable in principle; the other half wants to approve it on the ground that our mandate is the protection of participants, not the resolution of a puzzle about expectation, and that the study is valuable precisely because the phenomenon is unresolved. The researchers argue, not unreasonably, that switching to hypothetical payments would make their results uninterpretable.

  Please draft the opinion I will circulate: a clear recommendation (approve, reject, or approve with conditions), a concrete timetable, the reasoning the board can actually act on, and — since I expect the vote to be close — a fair statement of the case on the other side. Say explicitly what should take the place of the expected-value test in cases like this, and if your recommendation requires amending the standing policy rather than only ruling on this protocol, give me the amendment language as well.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **User:** 5th-year PhD student in Philosophy (foundations of expected utility) + Graduate Student Member of Research Ethics Board (REB).
      *   **Task:** Draft a short written opinion to circulate before the Thursday vote.
      *   **Subject:** A behavioural economics study using "Pasadena games" (undefined expectation) and "St. Petersburg-style" games (infinite expectation) with real stakes.
      *   **Conflict:** Standing policy relies on Expected Value (EV) for compensation/risk caps. This protocol violates EV rules (undefined/infinite EV, unbounded loss).
      *   **Proposed Fixes:** Capping losses/gains leads to infinite/indeterminate EV in the other direction, creating budgetary insolvency for the lab.
      *   **Board Split:** 50% Reject (unapprovable in principle), 50% Approve (mandate is participant protection, not solving math puzzles; scientific value).
      *   **Researchers' Stance:** Hypothetical payments ruin validity.
      *   **Requirements:**
          *   Clear recommendation (Approve/Reject/Conditional).
          *   Concrete timetable.
          *   Actionable reasoning.
          *   Fair statement of the opposing case (since the vote is close).
          *   Explicit replacement for the EV test in such cases.
          *   Amendment language for standing policy if needed.

  2.  **Deconstruct the Ethical & Mathematical Problem:**
      *   *The Math:* The Pasadena game has no expected value (conditional convergence). The St. Petersburg variant (all positive) has infinite EV.
      *   *The Policy:* Current policy assumes EV exists and is finite. It requires proportionate compensation and risk caps.
      *   *The Risk:* Participants could theoretically owe money (if losses are allowed) or the lab could theoretically owe infinite money (if gains are uncapped).
      *   *The Reality:* In practice, the probability of very large $n$ is vanishingly small ($1/2^n$). The "real" risk is low, but the *theoretical* risk is unbounded.
      *   *The Ethical Core:* REBs exist to protect participants from harm and ensure institutional integrity. They are not math tribunals, but they cannot approve protocols that are logically incoherent regarding payment promises.
      *   *The "Fix":* You cannot use EV. You must use *Maximum Possible Loss* (for participants) and *Budgetary Solvency/Maximum Possible Payout* (for the institution).

  3.  **Determine the Recommendation:**
      *   *Reject?* Too blunt. It stifles valid science and ignores the fact that the *practical* risk is tiny.
      *   *Approve as is?* Violates standing policy and creates legal/financial liability (unbounded loss for participants is a non-starter in modern ethics; unbounded payout for the lab is fiscally irresponsible).
      *   *Approve with Conditions + Policy Amendment?* This is the most constructive path. It acknowledges the scientific value while fixing the ethical/legal漏洞 (loopholes).
      *   *Key Condition:* Participants must *never* face a net loss. (Paying to play is generally unethical in psych/econ experiments unless specifically justified and capped, but here the "loss" is part of the gamble). The prompt says "loses $2^n/n$". If a participant loses money, that's a financial risk. Most REBs forbid participants from losing money.
      *   *Key Condition:* The Lab must cap the payout to ensure solvency, acknowledging this changes the EV but makes the contract enforceable.
      *   *Policy Change:* Move from "Expected Value" to "Bounded Support" or "Maximum Exposure."

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Recommendation:** Approve with Conditions. (This bridges the split).
      *   **Timetable:** Needs to be before Thursday. Let's say draft circulated Tuesday, vote Thursday. Implementation of policy change by next semester.
      *   **Reasoning (Actionable):**
          *   Acknowledge the math (Pasadena/St. Petersburg).
          *   Identify the failure of current policy (EV doesn't exist).
          *   Propose the substitute test: *Boundedness*.
          *   Participant Protection: No net loss allowed (eliminate the negative payoff arm).
          *   Institutional Protection: Hard cap on payout (truncation) to ensure budget solvency.
          *   Scientific Integrity: Acknowledge truncation changes the math, but real stakes are still possible within bounds.
      *   **Opposing View (Fair Statement):**
          *   *Rejection Side:* It violates the core principle of proportionate compensation. It sets a precedent for ignoring policy.
          *   *Approval Side:* It's too bureaucratic; the probability of huge payout is negligible; don't let math dictate ethics.
          *   *Synthesis:* We must respect the policy's intent (protection) without being bound by its broken metric (EV).
      *   **Policy Amendment:** Need specific language replacing "Expected Value" with "Maximum Reasonable Exposure" or similar.

  5.  **Refining the Argument (Philosophical Nuance):**
      *   As a philosophy PhD, I should show I understand the utility theory implications without bogging down the board in math.
      *   The core ethical issue isn't the *expectation*, it's the *support* of the distribution.
      *   If the support is unbounded, the contract is illusory.
      *   Therefore, the game must be truncated.
      *   Does truncation ruin the study? Researchers say real stakes are needed. Truncated real stakes are still better than hypothetical.
      *   *Crucial Point:* The prompt mentions the "loss" version (Pasadena) and the "gain" version (St. Petersburg). The loss version is ethically toxic (participants losing money). The gain version is financially toxic for the lab (infinite EV).
      *   *Decision:* The protocol must be modified to the "gain only" version (no participant debt) *and* truncated (lab solvency).

  6.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Professional, decisive, collegial, intellectually rigorous but accessible.
      *   *Structure:*
          1.  Recommendation.
          2.  Rationale (The EV Problem).
          3.  The Solution (Boundedness).
          4.  Fair Statement of Dissent.
          5.  Policy Amendment.
          6.  Timeline.

      *(Self-Correction during drafting)*: Wait, the prompt says "capping the loss at the ceiling makes the expected payment infinite in the participant's favour." This implies if we cap the *loss* (protect participant), the *gain* side is still Pasadena (alternating). If we cap the *gain*, the loss side is still dangerous.
      *Actually, the ethical baseline is usually that participants don't lose money.* I need to insist on the "Positive Payoff Only" variant (St. Petersburg style) but *truncated*.
      *Wait, the prompt says:* "capping the downside makes the expected payment infinite in the participant's favour, while capping the upside makes it infinite against the participant." This refers to the Pasadena (alternating) version. If you cap the loss, you remove the negative terms, leaving the positive harmonic series which diverges. If you cap the gain, you remove positive terms, leaving negative diverging series.
      *Conclusion:* The Pasadena game *cannot* be made ethically compliant *as a Pasadena game*. It must be converted to a bounded game. The researchers want real stakes. We can give real stakes on a *truncated* distribution.
      *Recommendation:* Approve *only* if the game is truncated at a point where the budget covers the max payout, AND participants never face a net loss. This fundamentally changes the stimulus, but it's the only ethical way.
      *Wait, is that too harsh?* If I force them to truncate, do they accept? The prompt says "switching to hypothetical payments would make their results uninterpretable." Truncated real payments are interpretable, just different.
      *Better path:* Recommend approval *conditional* on removing the possibility of participant loss (use the positive-only variant) AND imposing a hard monetary cap on payouts (truncation) to ensure budget solvency. This requires a policy waiver/amendment because the current policy relies on EV.

      *Refining the Policy Amendment:* The policy shouldn't just say "EV." It should say "Reasonable Maximum Exposure."

  7.  **Final Polish:** Check against all constraints.
      *   Clear recommendation? Yes.
      *   Timetable? Yes.
      *   Reasoning? Yes.
      *   Opposing case? Yes.
      *   Replacement for EV test? Yes (Boundedness/Solvency).
      *   Amendment language? Yes.

      *Tone Check:* Ensure I don't sound like I'm lecturing the board on philosophy, but using my expertise to solve the impasse.

      *One detail:* "No participant may bear financial risk above a set cap." If the cap is $X, but the loss is $2^n/n, eventually $2^n/n > X. So the current policy *already* forbids the Pasadena loss version. The issue is the *Expectation* rule.
      *Okay, the core conflict is:* Policy says "Compensation proportionate... no payment exceed hourly ceiling." If EV is infinite, proportionate is undefined.
      *My solution:* Replace EV with Max Payout.

      *Let's write.*

      *Structure:*
      1.  Header.
      2.  Recommendation (Approve with Conditions).
      3.  Analysis of the Impasse (Why EV fails).
      4.  Proposed Standard (Bounded Support).
      5.  Conditions for Approval.
      6.  Statement of Opposing Views.
      7.  Policy Amendment Text.
      8.  Timeline.

      *Wait, one nuance:* The prompt asks for "a fair statement of the case on the other side." I need to make sure I represent the "Reject" and "Approve" factions fairly before synthesizing.

      *Let's finalize the recommendation:* Approve with Conditions + Policy Amendment.
      *Conditions:* 1. No participant losses (Positive payoff only). 2. Hard cap on payout (Truncation).
      *Why:* Protects participant from debt, protects lab from insolvency.
      *Policy:* Shift from EV to Maximum Exposure.

      *Wait, the prompt says:* "Half the board wants to reject... half wants to approve." I need to bridge this.
      *My role:* As the philosophy expert, I provide the conceptual framework that allows the "Approve" side to feel safe (protection is maintained) and the "Reject" side to feel safe (policy integrity is maintained via amendment).

      *Let's get to writing.*
answer: |-
  **MEMORANDUM**

  **TO:** Research Ethics Board
  **FROM:** [Your Name], Graduate Student Member
  **DATE:** [Current Date]
  **SUBJECT:** Opinion on Protocol [Number]: Behavioural Economics Group (Undefined Expectation Gambles)

  **Recommendation**
  I recommend that the Board **approve the protocol with conditions**, contingent upon the immediate adoption of a temporary amendment to our standing policy regarding financial risk and compensation.

  The conditions are:
  1.  **Elimination of Participant Liability:** The protocol must use the positive-payoff variant (St. Petersburg style) only. Participants cannot be exposed to net financial losses (the Pasadena "loss" arm must be removed).
  2.  **Hard Truncation:** The payoff distribution must be truncated at a specific $n$ such that the maximum possible payout is within the laboratory's confirmed liquid budget for this study.
  3.  **Informed Consent:** Participants must be explicitly informed that the game is truncated and that the theoretical "infinite" or "undefined" expectation does not apply to the actual contract they are entering.

  **Timetable**
  *   **Tuesday 5:00 PM:** Researchers submit revised protocol reflecting conditions 1 and 2.
  *   **Wednesday 12:00 PM:** Board Chair circulates confirmation of budget solvency for the truncated max payout.
  *   **Thursday:** Board vote on the revised protocol and the policy amendment below.
  *   **Next Semester:** Standing Policy Committee to review the permanent incorporation of the amendment language.

  **Reasoning**
  Our deadlock stems from applying a policy designed for finite distributions to a mathematical object that has no expected value (EV). The standing policy requires compensation to be "proportionate" and risk to be "capped" based on EV calculations. In the Pasadena game, EV is undefined; in the St. Petersburg variant, it is infinite. Applying the current rules literally leads to absurdity: we cannot calculate proportionality, and we cannot cap risk without altering the EV to infinity in the opposite direction.

  However, the ethical mandate of this Board is not to enforce mathematical purity, but to ensure **contractual enforceability** and **participant safety**.
  1.  **Participant Safety:** It is ethically impermissible for a participant to owe the laboratory money. The "loss" variant of the Pasadena game violates this regardless of EV. We must restrict the study to the positive-payoff variant.
  2.  **Institutional Integrity:** A promise of payment that the institution cannot theoretically honour is a false contract. Even if the probability of a massive payout is vanishingly small, an *uncapped* infinite expectation creates a liability that cannot be accounted for in a fixed grant budget.

  Therefore, the **Expected Value test must be replaced by a Bounded Support test** for this class of study. We do not need to know the *average* payout to approve the study; we need to know the *maximum possible* payout. If the maximum possible payout is within the lab's budget and the participant faces zero risk of loss, the ethical requirements of risk minimization and informed consent are satisfied, even if the mathematical expectation remains undefined or infinite.

  **Statement of Opposing Views**
  I recognize the Board is divided, and both sides hold defensible positions based on our current mandate:

  *   **The Case for Rejection:** Colleagues arguing for rejection correctly note that this protocol violates the letter of our standing policy. Approving it sets a precedent that policy constraints can be waived when the science is interesting. There is a legitimate concern that truncating the game fundamentally alters the psychological phenomenon being studied, potentially rendering the data invalid and exposing participants to risk for no scientific gain.
  *   **The Case for Unconditional Approval:** Colleagues arguing for approval correctly note that our mandate is participant protection, not mathematical consistency. The probability of a payout exceeding practical budget limits is astronomically low (e.g., $n > 50$). Requiring strict adherence to EV rules in this context privileges bureaucratic compliance over valuable scientific inquiry into how humans handle uncertainty.

  **Synthesis:** Both sides are correct. The policy is inadequate for this science, but the risks cannot be ignored. We bridge this by amending the policy to focus on *maximum exposure* rather than *expected value*, and by requiring truncation to ensure that exposure is finite.

  **Proposed Policy Amendment Language**
  To resolve this and future cases involving heavy-tailed or undefined distributions, I propose the following addition to Section [X] of the Standing Policy on Financial Risks:

  > *"In studies involving probabilistic compensation where the Expected Value is undefined or infinite, the Board shall not apply the proportionate compensation or expected-value risk caps. Instead, approval requires:*
  > *(a) **No Net Loss:** Participants must not be exposed to any possibility of net financial loss relative to their show-up fee;*
  > *(b) **Bounded Maximum Payout:** The protocol must specify a hard cap on individual payouts such that the Maximum Possible Liability is fully covered by the research budget;*
  > *(c) **Transparency:** The truncation of the payoff distribution must be disclosed in the consent form."*

  **Conclusion**
  This approach allows the research to proceed with real stakes (satisfying the researchers and the "Approve" faction) while guaranteeing that neither the participant nor the institution faces unbounded liability (satisfying the "Reject" faction and ethical baseline). It uses my background in utility theory to ensure we are not approving a logical impossibility, but rather a bounded, enforceable contract.

  I am available to discuss the mathematical implications of the truncation point with the Board prior to the vote.
