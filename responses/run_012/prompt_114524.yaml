prompt: |-
  I've been going back and forth with my roommate about whether an AI could ever be the kind of thing that has moral status — like, whether it would actually be wrong to shut it off, or whether we'd just be pulling the plug on a fancy calculator. She's the one with the philosophy background, and she read some essay about it and gave me her summary, and it was so tidy that it kind of shut down my side of the argument. But something about it feels off and I can't put my finger on what, and I don't trust myself to push back. Here's how she put it:

  "Computational functionalism is the idea that what makes something conscious isn't what it's made of but what it does — the right kind of information processing. So any system running the right program is conscious, and if it's conscious it can be harmed, so it deserves moral status. The problem is a mathematical result showing that every physical system implements every computation, because you can always map its physical states onto the program's states in a way that fits. Which means a rock, or a bucket of water, implements the same program your brain runs. So functionalism says a rock is conscious, which is obviously absurd. That's why the whole 'it's the computation that matters' thing falls apart, and why you can't settle an AI's moral status by asking what it computes — you have to look at the physical substrate it's made of. It's the same lesson as the Chinese room: a simulation of pain isn't pain, and shuffling symbols around doesn't give you understanding."

  Can you go through it piece by piece and tell me what a philosopher of mind would happily sign off on, what they'd call a fair-but-loose simplification, and what's actually a mistake or a jump that doesn't follow? The two things I really want to know: does that rock argument really sink the idea that computation is what matters, or could someone keep that idea and just patch it up? And does her final conclusion — that it's all about the physical stuff — actually follow from anything true in the summary, or is that a separate claim sneaking in? Also, does the Chinese room even belong there, or is that a different point getting lumped in with the math one? I definately want the honest, messy version rather than the tidy one, so don't smooth it over. Please write it in American English.
