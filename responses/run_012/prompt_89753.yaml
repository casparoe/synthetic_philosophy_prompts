prompt: |-
  Draft the joint statement that a committed Mencian and a committed Xunzian could both put their names to after a good-faith adversarial collaboration on human nature. The document should contain: (a) a numbered list of claims both accept — about what is inborn, about the roles of spontaneous feeling, deliberate effort, and ritual, and about what moral education is for; (b) the disagreement itself, stated once at the level of the two positions, in wording each side would accept as fair to its own view; (c) the cruxes, that is, the sub-questions such that settling one would move at least one side; and (d) for each crux, a concrete case or consideration both would agree bears on it, with each side's prediction written down in advance.

  Two constraints. First, do not let the collaboration terminate in the comfortable verdict that the two merely used 性 (xing, "nature") in different senses; if that is part of the story, say so, but then isolate exactly which parts of the dispute survive once any merely verbal disagreement is set aside. Second, make each side face a case that cuts against it — for the Mencian, a person whose untutored impulses run reliably toward cruelty or disorder; for the Xunzian, a person who, without instruction and against self-interest, is moved to help a stranger. Say whether either case is even admissible as evidence for the view in question, and why.

  Close with a table of the residual disagreements, one row per crux, with columns: crux (short label); Mencian formulation (in wording a Xunzian would accept); Xunzian formulation (in wording a Mencian would accept); the test or consideration both accept; the Mencian's prediction; the Xunzian's prediction; and what would move which side, and in which direction.
reasoning: |-
  Here's a thinking process that leads to the joint statement:

  1.  **Analyze the Request:**
      *   **Participants:** A committed Mencian (Mencius/Mengzi follower) and a committed Xunzian (Xunzi follower).
      *   **Task:** Draft a joint statement after "good-faith adversarial collaboration" on human nature (*xing*).
      *   **Required Components:**
          *   (a) Numbered list of agreed claims (inborn traits, spontaneous feeling, deliberate effort, ritual, moral education).
          *   (b) The core disagreement stated fairly for both sides.
          *   (c) The cruxes (sub-questions where settlement moves a side).
          *   (d) For each crux, a concrete case/consideration + predictions from both sides.
          *   **Constraint 1:** No "they just meant different things by *xing*" cop-out. Isolate substantive disputes remaining after semantic clarification.
          *   **Constraint 2:** Each side must face a counter-example (Mencian: untutored cruelty; Xunzian: spontaneous altruism). Address admissibility of evidence.
          *   **Closing:** A table summarizing residual disagreements (Crux, Mencian Formulation, Xunzian Formulation, Test, Mencian Prediction, Xunzian Prediction, What moves whom).

  2.  **Deconstruct the Philosophical Positions:**
      *   **Mencius:** Human nature is good (*xing shan*). We have sprouts (*duan*) of virtue (compassion, shame, courtesy, right/wrong). Moral cultivation is *nurturing* and *extending* these sprouts. Bad behavior is due to loss of heart/mind, environmental damage, or failure to reflect.
      *   **Xunzi:** Human nature is bad (*xing e*). We have inborn desires that lead to conflict if unchecked. Moral cultivation is *straightening* and *transforming* (via *wei*, deliberate effort) through ritual (*li*) and teachers. Good behavior is artificial (in the sense of artifice/craft) but necessary for order.
      *   **Common Ground:** Both agree sagehood is possible for all. Both agree ritual/education is necessary. Both agree on the goal (social harmony, virtue). Both agree the heart-mind (*xin*) has cognitive/affective capacities.

  3.  **Address Constraint 1 (The "Different Senses" Trap):**
      *   It is historically accurate that they define *xing* differently. Mencius: *xing* = moral potential/ideal trajectory. Xunzi: *xing* = raw biological/psychological given *before* conscious activity.
      *   *Task:* Acknowledge this but push past it. The real dispute isn't just definition; it's about the *directionality* of the raw material and the *source* of moral motivation. Is morality *discovered* within or *imposed* from without (via tradition)?
      *   *Resolution in Statement:* We agree *xing* refers to "that which is so of itself, not acquired." But we disagree on whether the *dynamic tendency* of that raw material, when interacting with the world, leads toward order or disorder.

  4.  **Address Constraint 2 (Counter-Examples):**
      *   *Mencian Challenge:* The psychopath or the cruel child. If nature is good, why does untreated nature sometimes look evil?
      *   *Xunzian Challenge:* The spontaneous rescuer (e.g., seeing a child fall into a well). If nature is bad/selfish, why does uncalculated altruism happen?
      *   *Admissibility:* Both must agree these are admissible data points, not anomalies to be explained away entirely, but phenomena their theories must account for.

  5.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal and collaborative. "Joint Statement on the Dynamics of Human Nature and Moral Cultivation."
      *   **Preamble:** Acknowledge the collaboration, the shared goal (Way of the Sages), and the semantic clarification on *xing*.
      *   **Section (a) Agreed Claims:**
          1.  Definition of *xing* (unlearned, unworked).
          2.  Universality of capacity for sagehood.
          3.  Necessity of *wei* (effort) and *li* (ritual) for *completed* virtue.
          4.  Role of spontaneous feeling (it exists, but needs guidance).
          5.  Goal of education (social order + individual flourishing).
      *   **Section (b) The Disagreement:**
          *   Focus on the *trajectory* of the unworked heart-mind. Is the default vector toward harmony (Mencius) or conflict (Xunzi)? Is ritual an *expression* of inner truth or a *correction* of inner chaos?
      *   **Section (c) & (d) Cruxes & Cases:**
          *   *Crux 1: The Source of Altruism.* (The Child in the Well).
              *   Case: Spontaneous rescue without calculation.
              *   Mencius: Proof of sprout.
              *   Xunzi: Proof of biological instinct that *can* be aligned, but isn't "moral" until sustained/regulated.
          *   *Crux 2: The Persistence of Cruelty.* (The Untutored Tyrant).
              *   Case: A child raised without instruction who delights in suffering.
              *   Mencius: Environmental destruction of sprouts (like Ox Mountain).
              *   Xunzi: Confirmation of raw desires running wild.
          *   *Crux 3: The Experience of Effort.* (Does virtue feel like growth or bending?).
              *   Case: The feeling of doing the right thing when hard.
              *   Mencius: Recovering what was lost (effort is removal of obstacles).
              *   Xunzi: Remaking the self (effort is construction).
      *   **Closing Table:** Summarize the above.

  6.  **Refining the Tone:**
      *   Must be philosophical, precise, and respectful.
      *   Avoid modern psychological jargon unless it maps cleanly to classical terms (*xin*, *qi*, *li*, *yi*).
      *   Ensure the "wording each side would accept" constraint is met in the table. This is tricky. The Mencian formulation must not sound like Xunzi is winning, and vice versa.

  7.  **Iterative Polishing (Self-Correction during drafting):**
      *   *Check:* Did I fall into the "different definitions" trap?
      *   *Correction:* In the Preamble, explicitly state that even fixing the definition of *xing* as "innate given," the dispute remains about the *normative valence* of that given.
      *   *Check:* Are the counter-examples handled?
      *   *Correction:* Ensure the "Cruel Child" and "Spontaneous Rescuer" are explicitly discussed in the Crux section as admissible evidence.
      *   *Check:* Is the table accurate?
      *   *Correction:* Ensure the "What moves whom" column is specific. E.g., If the Rescuer acts *against* survival instinct, Mencius is vindicated. If the Rescuer acts on a fleeting impulse that fails later, Xunzi is vindicated.

  8.  **Final Review against Constraints:**
      *   (a) Numbered list? Yes.
      *   (b) Disagreement stated once? Yes.
      *   (c) Cruxes identified? Yes.
      *   (d) Concrete cases + predictions? Yes.
      *   Constraint 1 (No semantic cop-out)? Addressed in Preamble.
      *   Constraint 2 (Counter-examples)? Included in Crux 1 & 2.
      *   Closing Table? Yes.

  9.  **Final Polish:** Check for classical resonance (using terms like *duan*, *wei*, *li*, *qi*) while maintaining clarity for a joint statement. (Proceed to generate output).

