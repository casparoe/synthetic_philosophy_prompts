answer: |-
  The stalemate is not primarily about which Mill is canonical, as your hypothesis suggests, but about whether the 1869 retraction of the wages-fund doctrine represents a theoretical rupture that necessitates socialism or merely removes a scientific barrier to a moral preference Mill held all along.

  Continuity readers prioritize the *Principles of Political Economy*, specifically Book IV, Chapter VII, where Mill distinguishes production (governed by natural laws) from distribution (governed by human institutions). On this reading, Mill's endorsement of worker cooperatives and the stationary state is logically compatible with his early economics, meaning the *Chapters on Socialism* and the *Autobiography* only make explicit what was implicit in the structural separation of production and distribution. Conversion readers prioritize the 1869 review of Thornton's *On Labour*, where Mill abandons the wages-fund doctrine—the idea that wages are fixed by the ratio of capital to labor. They argue this retraction dismantles the scientific defense of market wages, transforming socialism from a moral possibility in the *Principles* to an economic necessity in the late writings. The third group correctly notes that Mill rejected state socialism (Marx, Lassalle) while endorsing cooperative socialism (Owen, Fourier), but this semantic precision does not resolve whether his economic theory shifted to accommodate the latter.

  Your hypothesis that this is a dispute about canonicity captures the surface dynamic—economists treat the *Principles* as authoritative while intellectual historians treat the *Chapters* as decisive—but it mistakes the symptom for the cause. Scholars select their canonical Mill based on whether they believe the wages-fund doctrine was essential to his system. If the doctrine is essential, its retraction signals a conversion; if it is a contingent error, the continuity holds. Therefore, arguing over which text is authoritative will not resolve the debate, because the authority of the text depends on the prior theoretical judgment about the wages-fund doctrine.

  Progress requires abandoning the label "socialist" in favor of analyzing Mill's theory of justice in distribution. The field should distinguish between whether Mill saw cooperatives as *compatible* with competitive capitalism (the *Principles* view) or as the *necessary successor* to it (the late view). A reframing of the question to focus on whether Mill believed competitive markets could ever satisfy his own harm principle would yield more traction than tallying his uses of the word "socialism," as it forces a confrontation with the relationship between his economic mechanics and his moral ends rather than relying on posthumous editorial boundaries or semantic categorization.
