          *   *Key Point:* Homeostasis vs. Super-normal stimuli.
          *   *Key Point:* Aesthetic/Intellectual joy.
      *   *Section 3: Does the Conclusion Survive?*
          *   If pleasure is *only* relief, Tranquillism holds.
          *   If pleasure can be *additive*, Tranquillism fails (or needs modification).
          *   The analogy *is* the argument for many people. Without it, they need phenomenological evidence that all pleasure is relief.
      *   *Section 4: Critical vs. Trivial Breaks.*
          *   *Critical:* The assumption that all desire is suffering (the "itch").
