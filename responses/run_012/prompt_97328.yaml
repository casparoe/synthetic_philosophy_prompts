          *   *Best fit:* **The "Zero-Balance" or "Debt" Analogy.** It captures the asymmetry (pain is negative, pleasure is just zero) without the physical irritation of an itch. Or **The "Weight" Analogy** (suffering is a burden, pleasure is putting it down).
