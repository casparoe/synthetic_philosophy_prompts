answer: |-
  ### I. Mapping the Epistemic Terrain

  To apply the framework of epistemic injustice to the Horizon scandal, we must first rigorously identify the epistemic agents and the flow of credibility.

  **The Agents and the Judgment**
  In Miranda Fricker's taxonomy, the **speaker** is the subpostmaster (SMP). Their testimony consists of the claim: "The accounts do not balance because the system is faulty, not because I have stolen." The **hearer** is dual-layered. The primary hearer is the Post Office (PO) acting as investigator and prosecutor. The secondary, downstream hearer is the Criminal Court, which relies on the PO's presentation of evidence.

  The **credibility judgment** is the pivot of the injustice. The hearer assigns a severe credibility deficit to the SMP. Despite the SMP's consistent assertion of innocence and evidence of systemic anomalies, they are categorized as unreliable, deceptive, or criminal. Conversely, a credibility excess is assigned to the Horizon system. The machine's output is treated as objective truth, possessing a neutrality and infallibility that the human speaker lacks.

  **Categorizing the Wrong**
  Is this **testimonial injustice** in Fricker's strict sense? Fricker defines this as a credibility deficit driven by *identity prejudice* (e.g., racism, sexism). Here, the mapping is ambiguous. While SMPs were often small business owners facing a large corporation—a class dynamic—there is no clear evidence that the PO discounted them because of their gender, race, or social identity in the way Fricker envisages. The discounting was not primarily "you are a woman, therefore you are irrational," but "you are a user, therefore the system cannot be wrong." If we stretch "identity" to include "institutional status" (small operator vs. state-adjacent monopoly), it fits loosely. However, disciplined adherence to Fricker suggests this is not the primary engine of the harm.

  It is more accurately described through the lens of **hermeneutical injustice** and its contemporary refinements.
  1.  **Hermeneutical Injustice:** Initially, SMPs lacked the technical concepts to articulate *why* Horizon was wrong. They knew the experience of the shortfall but lacked the interpretive resource (access to code, audit trails) to make it publicly intelligible.
  2.  **Dotson's Contributory Injustice:** This fits the PO's behavior precisely. Dotson describes this as when a hearer possesses the interpretive resources to understand the speaker but refuses to use them due to laziness or bias. The PO *had* internal reports, bug logs, and technical knowledge regarding Horizon's faults. They possessed the resources to validate the SMPs' testimony but actively declined to apply them.
  3.  **Pohlhaus's Willful Hermeneutical Ignorance:** This is the strongest fit for the PO's institutional stance. Pohlhaus argues that dominant groups often refuse to learn from the marginalized because acknowledging the marginalized knowledge would disrupt the dominant group's power. The PO refused to know what the SMPs knew because admitting Horizon's fallibility would undermine the PO's operational model and liability position.

  **The Role of the Machine and Institution**
  Fricker's framework is fundamentally interpersonal; it assumes a human speaker and a human hearer engaged in a communicative exchange. The Horizon episode exposes a gap here. The "testimony" competing with the SMPs was not from another human, but from a **system**. The PO and the Courts engaged in a form of *technological deference*. The machine was granted the status of an ideal witness: one that does not lie, does not forget, and has no motive.

  Furthermore, the primary hearer was an **institution**, not an individual. An institution cannot possess "virtues" in the Aristotelian sense Fricker relies upon for remediation. The PO's epistemic stance was encoded in its legal strategy and operational protocols. The downstream hearer (the Court) deferred to the institutional authority of the PO as much as the data itself. This suggests a structural epistemic injustice where the "credibility economy" is rigged not by individual prejudice, but by the procedural privileging of digital records over human assertion.

  ### II. What the Episode Does to the Theory

  Turning the analysis around, the Horizon scandal exerts significant pressure on the theory of epistemic injustice, exposing limits in its trigger conditions, its proposed remedies, and its scope of repair.

  **1. The Limit of Identity Prejudice**
  Fricker's theory hinges on *identity prejudice* as the necessary trigger for testimonial injustice. The Horizon case suggests this condition is too narrow. The credibility deficit suffered by the SMPs was not primarily due to who they *were* (their social identity), but due to *where they stood* in relation to the technology and the institution. They were epistemically marginalized because they were on the wrong side of a "knowledge asymmetry" enforced by contract and technology. If epistemic injustice theory cannot account for harms driven by technocratic authority and institutional conflict of interest without relying on traditional identity categories (race, gender), it risks missing the most potent forms of modern epistemic violence. The Horizon case argues that *structural position* can be as prejudicial as *social identity*.

  **2. Virtue vs. Structure**
  Fricker proposes the cultivation of individual "virtues of the hearer" (e.g., reflexive critical awareness) as a remedy. The Horizon episode renders this solution impotent. No amount of individual virtue among PO investigators could overcome the institutional mandate to prosecute. The epistemic wrong was baked into the PO's dual role as victim and prosecutor, and into the legal admissibility of computer evidence which was presumed reliable. This exposes a blind spot in the theory: it focuses on *ethical repair between individuals* rather than *political or legal repair of systems*. When the hearer is a corporation acting as a private prosecutor, the remedy cannot be a change of heart; it must be a change of law.

  **3. The Nature of Epistemic Reparation**
  Finally, the remedy in the Horizon case—the 2024 Act of Parliament overturning convictions—challenges the theory's conception of reparation. In Fricker's model, repair involves the restoration of credibility and acknowledgment of the wrong by the hearer.
  *   **The Statute vs. The Acknowledgment:** The 2024 statute is a legislative override. It validates the SMPs' testimony retrospectively by fiat, not by the PO's epistemic conversion. The PO (the original wrongdoer) has been slow to admit the full scale of its knowledge regarding the bugs.
  *   **The Gap:** This reveals a disconnect between *legal exoneration* and *epistemic vindication*. The law can declare someone innocent without the original hearer (the PO) ever admitting they were credible. Epistemic injustice theory struggles to describe a scenario where the state repairs the harm because the original epistemic agent (the PO) refuses to. It suggests that sometimes epistemic justice requires *bypassing* the original hearer entirely, something the interpersonal model does not anticipate.

  ### III. Verdict

  The Horizon case is not merely an instance of epistemic injustice as the literature currently understands it; it is a case that **reveals the theory to have been built on a narrower class of wrongs than it claims.**

  While the dynamics of credibility deficit and hermeneutical marginalization are clearly present, the mechanisms driving them fall outside Fricker's original design. The prejudice was technocratic and institutional rather than strictly identity-based; the hearer was a corporate entity rather than a moral agent capable of virtue; and the remedy was legislative coercion rather than interpersonal acknowledgment.

  To remain relevant, the theory must absorb this extension. It must expand from *testimonial injustice* (prejudice against a person) to *systemic epistemic injustice* (prejudice enforced by procedure and technology). It must acknowledge that when a machine is granted hyper-credibility over a human, the resulting harm is epistemic, even if no human bigot is present. The Horizon scandal demonstrates that epistemic injustice is not solely a failure of individual imagination or prejudice, but often a feature of institutional design. The theory must evolve from a critique of social interaction to a critique of power structures that dictate whose knowledge counts as truth.
