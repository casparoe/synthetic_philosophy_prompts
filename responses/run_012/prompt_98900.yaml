answer: |-
  Subject: Thoughts on the White Horse Dialogue reading group

  Dear friend,

  It is wonderful to hear you are organizing a reading group on the White Horse Dialogue, and I appreciate your ambition to move beyond the standard textbook summaries that often reduce Gongsun Long to a mere sophist or a confused logician. A semester of ten weeks is a generous amount of time to dwell on this text, enough to treat it with the seriousness it deserves within the philosophy of language. You have correctly identified the main candidate puzzles that haunt the literature, specifically the function of the copula, the mereological status of the compound, the mass versus count distinction, and the nominalist implications of naming. Before I offer my ranking for the syllabus, I want to address your friend's insistence that the composite kind reading is the upstream issue upon which everything else hangs. She is partially right but ultimately mistaken about the logical priority. Her intuition is valuable because it identifies the metaphysical engine of the dialogue, namely that the concept white horse is a specific determination that cannot be reduced to the sum of its parts without loss of identity. However, claiming this is the upstream issue puts the metaphysical cart before the semantic horse. We cannot determine whether white horse fails to be identical to horse until we have established what the particle fei means in this context. If fei functions as a negation of class membership, the composite kind reading must prove that white horses are not members of the horse class. If fei functions as a negation of identity, the composite kind reading must prove that the concept white horse is not identical to the concept horse. The semantic value of fei dictates what the metaphysical burden of proof is, so the semantic question is logically upstream of the mereological one.

  With that distinction in mind, I propose we rank the interpretive questions in the following order for your ten weeks. The first and most critical question must be the semantic and logical status of the central claim, specifically whether fei denotes non-identity, non-predication, or class exclusion. This deserves the first three or four weeks because it is the gateway through which all other interpretations must pass. If the group decides fei means is not identical to, the text becomes a claim about conceptual distinctness. If it means is not a member of, the text becomes a paradoxical denial of obvious taxonomy. This question matters most because it determines whether we are reading a text about metaphysics or a text about logic, and it forces the group to engage with the Mohist Canons and other contemporary texts to see how negation was handled in classical Chinese. Without settling this, any discussion of composition or reference is unanchored. The evidence that would move this question down the list would be a consensus emerging from comparative linguistics that fei had a stable, unambiguous meaning across all Warring States texts, but since scholarly disagreement persists there, it remains the primary hurdle.

  The second priority should be the question your friend raised, concerning mereology and composite kinds. Once the group understands the logical form, they should spend the next three weeks investigating whether white horse is treated as a compound entity that fails to be identical to its components. This is where the philosophical meat of the dialogue lies for a modern audience, as it touches on issues of conceptual combination and intensionality that resonate with contemporary debates. This question depends on the first because the argument for composite kinds only works if the logical form allows for distinctness without denying existence. If the first question is resolved as class exclusion, the composite kind reading collapses unless one argues for a very strange taxonomy. Evidence that would move this up to the first spot would be if new textual analysis of Gongsun Long's other fragments, such as the Pointing at Things Dialogue, showed that he consistently prioritizes mereological separation over semantic analysis, but currently the White Horse Dialogue stands on its own logical structure first. This section should also address whether the dialogue is a proto-nominalist stunt about how names carve up reality, as that is essentially the metaphysical consequence of the composite kind reading.

  The third and final major question should concern the linguistic categorization of the term horse, specifically whether it functions more like a mass term than a count noun. This deserves the remaining weeks because it challenges the Western presuppositions that students bring to the text. If horse is a mass term like water, then white horse is a qualified mass, and the assertion white horse is not horse might be akin to saying white water is not water, which is false, or it might rely on a unitizer that changes the identity conditions. This question depends on the first two because the mass versus count distinction is a hypothesis about reference that attempts to explain why the semantic and mereological puzzles arise in the first place. It is ranked third not because it is less interesting, but because it is more speculative and relies on applying modern linguistic categories to ancient data. Evidence that would move this up significantly would be a robust philological study showing that classical Chinese nouns lacked plural markers or classifiers in this period in a way that fundamentally alters truth conditions, but until that is established, it serves best as a lens through which to view the settled semantic and metaphysical questions.

  In defending this ordering, I am prioritizing logical dependency over philosophical excitement. While your friend's composite kind hypothesis is arguably the most philosophically rewarding topic, it cannot be coherently discussed without first agreeing on what the sentence means logically. A reading group that starts with metaphysics risks talking past one another, with some members assuming identity negation and others assuming class exclusion. By starting with the semantics of fei, you build a shared logical vocabulary. By moving second to composition, you explore the metaphysical implications of that logic. By ending with reference and categorization, you contextualize the logic and metaphysics within the broader linguistic system of the time. This structure ensures that the group builds an interpretation layer by layer rather than jumping to conclusions about nominalism or sophistry. If during the first few weeks the group finds conclusive evidence that fei is unambiguously used for class membership in the Mohist Canon, you would then have to pivot the second section to explain how Gongsun Long argues for a false conclusion, perhaps shifting the focus to pragmatics and rhetoric. Conversely, if the group finds that the mass noun hypothesis explains the semantic ambiguity of fei most elegantly, you might merge the second and third sections. However, starting with the semantic foundation is the safest bet for a rigorous philosophical inquiry. I hope this helps you structure the semester, and I would be happy to discuss specific readings for each section if you need them.

  Best regards

  Your colleague
