  **HARTLEY & SONS, BUCKETMAKERS (EST. 1897)**
  **LIMITED WARRANTY & OPERATIONAL GUIDELINES (REV. 4.2)**

  **1.0 DEFINITION OF ROTATION**
  Hartley & Sons defines "Rotation" as any state resulting in centrifugal surface depression of contained fluids. Customers are advised that surface depression may persist even when fluid velocity relative to the vessel wall is zero. Hartley & Sons cannot accept liability for customers who assume relative rest implies flat water. Rotation is a property of the system, not necessarily the relation between water and bucket.

  **2.0 STANDARD CONFIGURATION**
  Under the Standard Package, rotation is measured against the Local Inertial Structure. This structure is provided free of charge. It is not visible, tangible, or composed of matter, but it is rigid. Attempts to touch the structure will result in voided warranties.

  **3.0 MACHIAN UPGRADE TIER (OPTIONAL)**
  Customers may purchase the Machian Upgrade, which recalibrates rotation to depend strictly on the distribution of distant mass (e.g., Fixed Stars). Please note: If the universe is empty, the Machian Upgrade renders the bucket incapable of rotation. Surface depression will not occur in a void. Hartley & Sons recommends retaining the Standard Package for indoor use.

  **4.0 COMPETITOR NOTICE**
  Rival manufacturers (e.g., Leibniz Ltd.) market purely relational vessels. While theoretically elegant, Leibniz buckets often fail to exhibit concavity during isolated spin tests. Hartley & Sons cannot warranty water behavior in Leibniz containers.

  **5.0 FAQ & TROUBLESHOOTING**

  **Q: I am operating the bucket in a windowless basement laboratory. I cannot see the stars. The water is concave. What is it rotating relative to?**
  **A:** If the water is concave, rotation has occurred. The Local Inertial Structure (see Clause 2.0) remains present regardless of visual confirmation of external masses. You are rotating relative to the field. Please do not ask what the field is rotating relative to.

  **Q: Can I shift the metric field slightly to the left without changing any physical measurements?**
  **A:** No. Clause 9.1 (Ontological Redundancy) states that Hartley & Sons does not recognize physically identical but numerically distinct configurations. If you shuffle the points of space without altering observable intervals, you have created a duplicate reality not covered under this warranty. We treat indiscernible states as the same state. Do not test this.

  **Q: My water is concave, but my physicist says space isn't real.**
  **A:** Space is not real. The Metric Field is real. Please consult your manual for the distinction.

  **6.0 GENERAL RELATIVITY ADDENDUM**
  Please be aware that rotating matter may drag the Local Inertial Structure slightly (Frame-Dragging). This may cause the bucket to feel stationary while actually rotating, or vice versa. Hartley & Sons buckets are not responsible for errors in judgment caused by the curvature of spacetime.

  **7.0 LIMITATION OF LIABILITY**
  Hartley & Sons guarantees the bucket. We do not guarantee the universe. If the laws of physics change mid-spin, liability is null.

  ***

  Verdict: The warranty commits to absolute rotation via the "Local Inertial Structure" (substantivalism), but attempts to evade the Hole Argument by declaring indiscernible metric shifts void; the position is pragmatically consistent for a bucketmaker but ontologically contradictory, as it treats the metric as a real thing (Clause 2) while denying it independent identity (Clause 9).
