answer: |-
  Here are 12 interview prompts (8 main questions + 4 targeted follow-ups) designed to bypass the headline and engage with the technical machinery of her argument. I've noted the likely "stock reply" for the follow-ups so you know when to deploy them.

  ### 1. The Expectation Calculation (Numbers & Credence)
  You argue that we should multiply a low credence of sentience by a massive population size to get expected moral weight. But you're applying this to wild insects as well as farmed ones, where the numbers are orders of magnitude higher. If the moral weight is driven primarily by the *scale* rather than the *probability*, doesn't that make the empirical question of sentience almost irrelevant? At what point does the number become so large that it swamps any reasonable doubt, and is that a feature or a bug of your model?

  ### 2. Follow-up: Thresholds vs. Linear Expectation
  *(Deploy if she says: "Expected utility theory requires us to maximize across all probabilities, not just high-confidence ones.")*
  **Follow-up:** Standard decision theory handles risk, but in moral contexts, we often use thresholds—we don't act on one-in-a-million risks unless the stake is existential. Why should moral uncertainty be treated differently than, say, safety engineering, where we demand a confidence threshold before allocating resources? Is there a principled reason to reject a "confidence threshold" for moral patienthood, or is that just an intuition you're willing to override?

  ### 3. Continuous Sentience (Dissolving the Threshold)
  You replace the binary "sentient or not" with a continuous scale of moral weight based on cognitive complexity or capacity for suffering. Does this actually dissolve the threshold problem, or does it just relocate the arbitrariness? We now have to decide where on that continuum moral weight begins to accumulate. How do we avoid simply stipulating the curve of moral value to match the conclusion we want?

  ### 4. Follow-up: Measurement vs. Stipulation
  *(Deploy if she says: "We can measure neural complexity or behavioral flexibility to map the continuum.")*
  **Follow-up:** Even if we measure complexity, there's an is-ought gap between "more complex nervous system" and "more moral weight." A rock has zero complexity, a bacterium has some, a human has more. But why should moral value scale linearly or logarithmically with that complexity? Isn't the function mapping biology to moral weight still a philosophical stipulation rather than an empirical measurement?

  ### 5. The Fanaticism Objection (Scope of the Argument)
  You're willing to accept the "fanaticism" charge—that tiny probabilities times huge numbers can dominate our moral calculus. But if that structure holds, why stop at insects? Nematodes are more numerous; bacteria are more numerous still. If we assign even a non-zero credence to panpsychism or minimal sentience in simple systems, doesn't your logic demand we prioritize them over humans? What structurally separates insects from bacteria in your model, other than our intuition that insects *seem* more like us?

  ### 6. Per-Insect Moral Weight (Intensity of Suffering)
  Let's grant sentience for the sake of argument. Given the size of an insect nervous system, the "volume" or intensity of their suffering might be extremely dim compared to a vertebrate. If the moral weight per insect is near-zero, does the scale argument still hold? Or does your position secretly rely on insects suffering *badly*, not just *at all*?

  ### 7. Follow-up: Aggregation and Lexical Thresholds
  *(Deploy if she says: "Small amounts of suffering aggregate. A trillion tiny pains outweigh one human pain.")*
  **Follow-up:** Some ethicists argue for lexical thresholds—that a certain intensity of suffering cannot be outweighed by any quantity of lower-intensity suffering. If insect pain is qualitatively different (dimmer) rather than just quantitatively less, does your aggregation logic break down? Are you committed to the view that there is no lower bound on pain intensity below which aggregation fails?

  ### 8. Competing Uncertainties (Priority Problem)
  We have uncertain moral patients everywhere: insects, wild animals, future digital minds, potential AI. If expected value logic is right, we end up with a pile of competing duties where the highest priority depends entirely on volatile probability estimates. Does this leave us with no stable priority ordering? How do we avoid a paralysis where we're constantly shifting resources based on which probability estimate seems most favorable this week?

  ### 9. Empirical Science vs. Decision Theory
  How much of your argument rests on actual empirical work on insect nociception and behavior versus being a purely decision-theoretic point? If tomorrow neuroscientists reached a consensus that insect behavior is entirely reflexive with no integrated information, does your argument collapse, or does the decision-theoretic uncertainty remain high enough to sustain the obligation?

  ### 10. Follow-up: Robustness of Priors
  *(Deploy if she says: "The science sets the prior probability, but we must remain humble about negative findings.")*
  **Follow-up:** If the prior is set by science, how robust is it to negative findings? If the evidence shifts from "inconclusive" to "likely insentient," does the expected value drop enough to change the prescription? Or is the "possibility" of sentience so cheap to maintain that the argument becomes immune to empirical falsification?

  ### 11. Intervention Logic (Wild vs. Farmed)
  You mention wild insect populations dwarf farmed ones. If the scale argument is the driving force, shouldn't we be more concerned with wild insect suffering (predation, starvation, environmental stress) than farming? If you aren't advocating for intervention in the wild, is that because of tractability, or does it suggest the scale argument isn't the only factor determining your moral priorities?

  ### 12. Practical Action (The "Monday Morning" Question)
  This whole position hangs on a probability nobody can settle and a moral weight we can't measure. Given that uncertainty, what do you want us to actually *do* differently on Monday? Are we talking about dietary changes, research funding, or a shift in how we weigh future risks? If the numbers are the main driver, but the probabilities are unknowable, what is the actionable output of this philosophy?
