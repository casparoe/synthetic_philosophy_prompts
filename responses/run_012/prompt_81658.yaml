  You are an expert in Kant's practical philosophy and in contemporary debates about the moral status of animals. Think carefully before you answer. Begin with a short brainstorming section in which you lay out the main interpretive options a Kantian might take. Then give a diagnosis of the following argument: identify the step you would reject, explain why that step looked plausible, and state what rejecting it costs. Do not merely assert that Kant is inconsistent; engage with the argument as written.

  The argument is not originally mine, but I have been unable to find the exit from it.

  (1) Kant holds that we have no direct duties to animals; what are commonly called duties to animals are really indirect duties to humanity.
  (2) On that view, an act's wrongness with respect to an animal must derive from its tendency to affect the humanity of the agent or of others, typically by dulling sympathy or encouraging cruelty.
  (3) If an act toward an animal has no tendency to affect anyone's humanity, then the indirect-duty view must count it as morally permissible.
  (4) Imagine a person who undergoes a procedure that permanently blocks any actual psychological effect of cruelty from entering their character. Their sympathetic dispositions are sealed off, and they know this. They then torture a dog in a way that causes the dog great suffering, but the procedure ensures that their character is entirely unaffected, and no other human being ever learns of it or is affected.
  (5) In this case, the act has no tendency to affect anyone's humanity.
  (6) Therefore, on the indirect-duty view, the act is morally permissible.
  (7) But the act is not morally permissible; the dog's suffering is itself a moral consideration, and torturing it for no reason is wrong.
  (8) Therefore, the indirect-duty view is false.

  Which step do you reject, and what does rejecting it cost? I would rather keep (1), (2), and (7) than (8), but if that is not possible, tell me what I have to give up. In your answer, consider at least one Kantian response that appeals to maxims rather than actual consequences, and one that appeals to the conditions of moral feeling. Say which response is more defensible. Also consider whether the case in (4) is coherent: if the person's character is truly unaffected, can the act still express a cruel maxim, and if so, does that matter for Kant? Finally, address whether the indirect-duty view can condemn the act without covertly treating the animal as an end in itself.
