answer: |-
  **INTERNAL GUIDANCE MEMO 88.4: Determination Guidance for Restoration-Adjacent Interventions**
  **TO:** Prior-Authorization Reviewers
  **SUBJECT:** Categorization Protocols for Functional Interventions
  **STATUS:** Mandatory Compliance

  **1.0 Classification Ladder**
  All requested interventions must be assigned a single tier. Coverage is contingent upon Tier 1 or 2 status.
  *   **Tier 1 (Restorative):** Returns claimant to pre-morbid baseline function.
  *   **Tier 2 (Protective):** Arrests decline from current verified state; prevents onset of pathology.
  *   **Tier 3 (Augmentative):** Exceeds pre-morbid baseline or population median.
  *   **Tier 4 (Elective):** Alteration where no functional deficit is measurable or claimed.

  **2.0 Baseline Adjudication and the "Best Documented" Rule**
  Restoration requires a baseline. Where pre-morbid data is absent (e.g., congenital conditions, lost records), baseline is constructed via "Best Documented Function" (BDF). BDF is defined as the highest verified metric achieved by the claimant, adjusted for age-related decay curves (see Appendix C).
  *   *Constraint:* If BDF is unavailable, the population median applies, minus one standard deviation to account for self-reporting bias.
  *   *Paradox Clause:* If the claimant has never possessed the function in question (e.g., congenital deafness), Tier 1 status is granted only if the intervention mimics species-typical function. However, if mimicking species-typical function requires exceeding the claimant's historical maximum (which is zero), the intervention defaults to Tier 3 unless waived by Ethics Compliance.

  **3.0 The Normative Ceiling**
  An intervention classified as Restorative becomes Augmentative if the projected outcome exceeds the population median for the claimant's age cohort.
  *   *Exception:* If exceeding the median is required to meet the threshold of "normal function" for the claimant's occupation (e.g., vision correction for a pilot), refer to Senior Review.
  *   *Decline Prevention:* Interventions preventing age-related decline are Tier 2. However, if the prevention restores function to a level normal for a *younger* cohort, the intervention is Tier 3. Reviewers must distinguish between preventing sickness and preventing aging.

  **4.0 Subjective Deficit Clause**
  If the claimant does not self-identify a functional deficit, the intervention is presumptively Tier 4.
  *   *Asymptomatic Pathology:* If a deficit is measurable via standardized testing but denied by the claimant (e.g., asymptomatic hypertension), the intervention is Tier 2.
  *   *Unmeasurable Deficit:* If the claimant identifies a deficit not measurable via standardized testing (e.g., "brain fog," "loss of sharpness"), the intervention is Tier 3 unless historical data confirms a decline from BDF.

  **5.0 Worked Examples and Referral Protocols**
  *   *Case 101 (Cochlear Implant):* Claimant congenitally deaf. No auditory baseline. Intervention grants hearing within population median. **Classification:** Tier 1. **Rationale:** Species-typical function restored despite lack of personal baseline. (Note: Philosophical contradiction waived under Precedent 7).
  *   *Case 102 (Statin Therapy):* Claimant borderline cholesterol, no symptoms. Intervention prevents future decline. **Classification:** Tier 2. **Rationale:** Prevents pathology onset.
  *   *Case 103 (Cognitive Support):* Claimant, age 45, seeks memory support. Claims memory is worse than at age 25. No records exist for age 25. Claims no current impairment in daily living (can work, drive, cook). **Classification:** REFER TO SENIOR REVIEW. **Rationale:** Intervention aims to restore BDF (age 25) which is undocumented (violates Section 2.0). Claimant denies current deficit (violates Section 4.0), yet seeks return to undocumented baseline. Outcome would likely exceed age-cohort median (violates Section 3.0). Cannot determine if preventing age-related decline is Protective (covered) or Restorative to a mythical baseline (uncovered). Do not deny; do not approve. Escalate.

