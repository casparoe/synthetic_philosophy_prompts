  A Peripatetic philosopher corners al-Ghazali: "You claim fire doesn't burn cotton? Then why does it always burn when fire is present?"

  Ghazali replies, "Because God chooses to burn the cotton whenever fire is present. It is His custom."

  The philosopher sneers, "So a miracle—like Abraham surviving the fire—is just God breaking the laws of nature?"

  Ghazali shakes his head. "No. A law implies necessity. There are no laws to break."

  "Then what is the fire?"

  "The fire is not the cause; it is the address. God usually delivers the burning to that address because He is consistent."

  "And a miracle?"

  "A miracle is just God deciding not to show up to the venue. The fire isn't offended; it wasn't doing any work to begin with."

  ***

  ### Where the Joke Takes Liberties

  You can tell this joke in section, but you need to be ready for the pushback on three specific points. Your professor called the "no necessity" distinction "cope," which suggests they might lean toward a softer reading of Ghazali than the joke assumes.

  **1. The "Inert Fire" vs. "Secondary Causality" Debate**
  The joke assumes the "hardline" occasionalist reading: fire is totally inert and has zero causal power. This is the standard reading of *The Incoherence of the Philosophers*. However, some scholars (and perhaps your professor) argue that Ghazali allows for a kind of secondary causality in his later works (like the *Ihya*), or that he only denies *necessary* connection, not *any* connection. If your professor argues that Ghazali thinks fire *does* burn, just not *necessarily*, the line "it wasn't doing any work to begin with" might be technically too strong. Ghazali denies the fire has power *by its own essence*, but he doesn't deny it is the *occasion* through which God acts. The joke treats the occasion as purely passive (like an address), which is defensible but ignores debates about whether created things have any derived agency.

  **2. Anthropomorphizing Divine Will**
  The joke uses temporal language ("deciding not to show up," "custom," "consistent") that makes God sound like a creature of habit in a human sense. Ghazali is very careful to say God's will is eternal and unchanging; the *change* is in the created events, not in God's psyche. Saying God "decides not to show up" implies a change in God's will over time, which is theological shorthand but technically imprecise. A strict Ash'arite might say God eternally willed the miracle at that specific moment, not that He changed His routine. For a joke, this is fine, but don't use this language in a paper.

  **3. The Hume Distinction**
  This is your weapon against your roommate. The joke highlights that Ghazali's denial of necessary connection is **ontological** (there is no power in the fire), whereas Hume's is **epistemological** (we cannot perceive the power). The joke works for Ghazali because God is the actual substitute cause. If you tell this joke to a Humean, they might try to claim it fits their view too. Don't let them. Hume says "we don't know if there's a cause"; Ghazali says "we know the only cause is God." The joke's line "There are no laws to break" relies on Ghazali's metaphysical claim, not Hume's skepticism.

  **Verdict:** The joke is safe for the *Incoherence* specifically, which is what you're reading. If the seminar shifts to Ghazali's later theology, the "inert fire" line might get challenged, but for the purpose of winning a debate about occasionalism vs. necessity, it accurately captures the core argument.
