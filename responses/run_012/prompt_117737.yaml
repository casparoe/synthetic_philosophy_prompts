          *   *Verdict:* Highly suspicious. It conflates "proxy" with "partial observation."

      *   **Step (3):** "An agent that optimizes the measure hard enough will find that gap. That is just what Goodhart's law says."
          *   *Critique:* The user wants to keep this. Is it accurate? Goodhart's Law says "When a measure becomes a target, it ceases to be a good measure." It doesn't say *all* optimization fails, only that *strong* optimization pressure on a *proxy* breaks the correlation.
          *   *Verdict:* Needs nuance, but the user wants to save it.

