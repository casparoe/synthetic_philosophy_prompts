  *(Self-Correction during drafting)*: I initially thought about putting the Technical Feasibility first. But for *this* room (Ethics workshop), the Philosophical/Structural objections are actually more damaging to the *thesis* than the engineering. If the concept is incoherent, engineering doesn't matter. So, Framing and Status Quo Bias go first. Technical feasibility is second tier because "we'll figure it out" is a standard safety answer. Longtermism is huge for the EA bloc, so that needs high placement.

