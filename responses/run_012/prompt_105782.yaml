  4.  **Selecting and Ordering the Top 8-10 Objections:**
      *   *Criteria:* Damage potential (how hard is it to refute?).
      *   *Order:* High damage (technical/structural) to Medium damage (philosophical/practical).

      *   *Draft List:*
          1.  The Framing Problem (Philosophers/Economists) - *High Damage.* Who decides what counts as a domain?
          2.  The Status Quo Bias (Philosophers) - *High Damage.* Abstention helps the powerful.
          3.  The Enforcement/Technical Feasibility (RLHF/Safety) - *High Damage.* Can you actually make a model refuse?
          4.  The Future Generations Problem (Longtermists) - *High Damage.* Sortition ignores the unborn.
          5.  Manipulation of the Panel (Safety/Political) - *Medium-High.* Bad actors influence the 500.
          6.  Arrow's Theorem/Application (Economists) - *Medium.* Panel voting is still flawed.
          7.  Gridlock/Handoff (Practical) - *Medium.* Humans can't handle the load.
          8.  Definition of "Contested" (Philosophers) - *Medium.* Everything is contested if you dig deep enough.
          9.  The "Soundbite" Trap (Journalists) - *Low.* Oversimplification.
          10. The Unasked Question (Power).

  5.  **Drafting Replies and Weaknesses:**
      *   *Tone:* Plain language, journalist-style (clear, direct), acknowledging limits.
      *   *Constraint Check:* 2-minute read time per reply (approx. 250-300 words). *Correction:* The prompt asks for a "two-minute reply," which in spoken word is ~250-300 words, but for a prep sheet, it needs to be punchy. I will aim for concise paragraphs that can be spoken in 2 minutes.
      *   *Weakness Note:* Crucial for honesty.

  6.  **Refining the "Unasked Question":**
      *   What is the elephant in the room? It's usually about *power*. Who controls the sortition process? Who defines the initial menu of questions for the panel? That's where the real alignment happens.

  7.  **Refining Concessions:**
      *   Where should the user yield ground?
      *   Concede: It's not a silver bullet. It's a governance layer, not a technical fix.
      *   Concede: Status quo bias is real but preferable to active value imposition.

  8.  **Review against Audience Personas:**
      *   *RLHF:* Needs to hear "I know this is hard technically, but it's a spec for you."
