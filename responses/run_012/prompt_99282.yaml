answer: |-
  **Brainstorming Axes**

  1.  **Thermal Tolerance:** "Cold-Bloods" (comfortable at 50°F) vs. "Warm-Bloods" (need 80°F). The office thermostat is locked at 50.
  2.  **Dermal Conductivity:** "High-Conductors" (operate touchscreens with skin) vs. "Low-Conductors" (require stylus/gloves). The bureaucracy is entirely touch-based.
  3.  **Auditory Frequency:** "Low-Hearers" (hear speech only) vs. "High-Hearers" (hear machinery whine). The building hums at a frequency only some hear.
  4.  **Sleep Orientation:** "North-Southers" vs. "East-Westers." Chairs and beds are magnetically aligned North-South; East-Westers get sick sitting in them.
  5.  **Salinity Tolerance:** "Brackish" (can drink river water) vs. "Fresh" (need bottled). The office coolers tap the river directly.

  **Selection:** **Dermal Conductivity.** It feels the most appropriately bureaucratic. It transforms a biological invisibility into a tangible friction with technology. It hasn't been done to death like handedness, and it allows for subtle props (styluses, gloves, wipes) to signal the asymmetry without exposition. It stings because it makes physical touch—a basic human interaction—a point of verification.

  ***

  **The Ferry Authority Intake**

  The queue started at the glass partition and snaked back toward the turnstiles, a slow-moving river of coats and damp umbrellas. Inside the booth, the air smelled of ozone and old paper. I adjusted the cuff of my left glove, making sure the silver thread was exposed at the fingertip, and tapped the screen with the stylus. It beeped, a sharp affirmative, and the next passenger file opened.

  "Name?" I asked.

  "Harren," the man said. He leaned forward, bare fingers pressing flat against the intake glass to sign his declaration. The screen accepted his print instantly, green checkmark flashing. He didn't look at me. Nobody ever looked at the glove.

  "Purpose of travel?"

  "Commerce," he said. He stepped back, wiping his hand on his trousers as if removing residue, and moved toward the ferry gate.

  My colleague, Miller, sat in the booth next to mine. He was processing a family. He laughed at something the father said, leaning his elbow on the desk, bare wrist resting against the cool metal surface. His badge hung loose around his neck, white stock with black lettering. Mine had the blue border. It didn't mean anything, really, just indicated I was on the Auxiliary Contact Protocol. It meant my quarterly review included a conductivity test.

  "Next," I said.

  A woman stepped up. She held a child on her hip. The child reached out, curious, toward my stylus. I pulled it back slightly, not out of fear, just procedure. The stylus was issued property. Skin contact could degrade the tip.

  "Please place your hand on the verifier," I said.

  She pressed her palm to the glass. It held for three seconds. The light turned green. She looked at my hand, wrapped in the thin mesh, then at the stylus resting on the desk.

  "Trouble with the scanners?" she asked. It wasn't unkind. It was the same tone people used when asking if the elevator was broken.

  "Maintenance," I said. It was the standard answer. Section 14, Paragraph 9 of the Employee Handbook suggested deflection to prevent queue stagnation. Explaining that my skin lacked the natural oils required to complete the circuit would take too long. It would require me to fetch the Waiver Form 88-B, which needed a supervisor's signature, and Miller's supervisor was at lunch.

  She nodded, accepting the lie. Everyone knew what the glove meant. You saw it on the street sometimes, people in mesh gloves opening doors with their elbows, or using the side of a knuckle to press elevator buttons. They were the ones who bought the special pens. They were the ones who couldn't use the public kiosks without a trip to the help desk.

  I processed her ticket. The stylus dragged slightly across the glass. I needed to clean it again. I took a wipe from the dispenser—alcohol-free, specifically for the auxiliary tools—and polished the tip. Miller was laughing again. He had just slapped the screen with the heel of his hand to confirm a batch upload. The machine didn't even flinch. It loved him.

  "Hey," Miller said, noticing my wipe. "You try the new firmware? They say it's more sensitive. Might work without the stick."

  " Tried it Monday," I said. "Rejected me twice."

  "Shame," he said, turning back to his queue. "Weather's been dry. Might help if you hydrated more."

  I didn't answer. I drank two liters of water before every shift. I carried a misting bottle in my pocket. It didn't change the ridge density. It didn't change the resistance levels. It just made me feel like the failure was mine, like I wasn't drinking enough, wasn't trying hard enough to be conductive.

  The line moved. A man in a suit approached. He didn't wait for me to ask. He placed his hand on the glass, signed with his finger, and watched the green light. He tapped his watch, impatient. I picked up the stylus. The weight of it was familiar, a third finger I couldn't feel.

  "ID," I said.

  He slid it across the tray. I picked it up with the gloved hand. The plastic crinkled softly. I tapped his photo into the system. The screen asked for *Operator Verification*. I pressed the stylus to the box. It held. The light turned green.

  He took his ID back. "You know, they're retrofitting the north gate. Voice print only. No touch required."

  "That's good," I said.

  "Supposed to be faster," he said. He didn't move. "You should apply for transfer."

  "Paperwork," I said.

  "Right," he said. He stepped away.

  By noon, my hand was sweating inside the mesh. It itched. I couldn't scratch it without breaking protocol. Miller went to the break room to get coffee from the machine. I stayed. The break room machine required a thumbprint to release the cup. I had a thermos at my desk. I poured tea into the lid and watched the steam rise.

  The queue didn't stop. The river didn't stop. The ferrys came and went, loading people who could touch the world and be touched back by it. I sat in the booth, surrounded by glass and metal, holding the only thing that allowed me to speak to them.

  At four, the supervisor came by. She walked behind the booths, inspecting the logs. She stopped at Miller's station. She put a hand on his shoulder. He leaned into it. She moved to mine. She hovered her hand over my head, not touching, and checked the monitor.

  "Conductivity holding?" she asked.

  "Within limits," I said.

  "Good," she said. "Audit next week. Make sure the stylus is calibrated."

  She moved on. I wiped the screen. I wiped the stylus. I waited for the next person to press their bare skin against the glass and leave a mark I couldn't make.

  ***

  **Author's Note**

  The asymmetry planted here is **dermal conductivity**—the biological ability to complete an electrical circuit with bare skin. It stings because it takes a random, invisible physiological trait and makes it the sole key to bureaucratic agency, turning a simple touch into a verified permission.
