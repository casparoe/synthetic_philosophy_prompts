      *   *Drafting:* An epistemic bubble is essentially an accidental omission. It occurs when your social network or algorithmic feed simply doesn't include opposing voices. You aren't avoiding the other side; you just haven't encountered them. If you click a different link or talk to a different neighbor, the bubble pops. The information is missing, but your ability to process it remains intact.

