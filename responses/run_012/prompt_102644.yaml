answer: |-
  1. Treating a singular historical episode as a data point for induction ignores that an N of one provides no variance to distinguish causal necessity from accidental conjunction. Consequently, the analogy offers a narrative resemblance rather than a statistical warrant for transferring the payload to the present case.

  2. We often mistake the scaffolding of superficial similarities for the structural identity required to support the payload, mistaking shared aesthetics for shared causal mechanisms. Without independent criteria to weigh which features are structurally relevant, the analogy rests on a resemblance that licenses no inference.

  3. The reference class needed to calculate a base rate for the payload is almost never available because historical situations are typically individuated by the very features that make them unique. This absence prevents us from knowing how often the scaffolding appears without the payload, leaving the inference without a frequency distribution.

  4. The selection of which past scenario to analogize is itself driven by the policy conclusion one wishes to justify, ensuring the scaffolding is built to support a predetermined payload. This circularity means the analogy functions as rhetorical camouflage for a prior commitment rather than as an independent test of validity.

  5. Finally, even if the structural mapping were perfect, the actors being forecast are themselves readers of history who adjust their behavior to avoid or enact the predicted outcome. This reflexivity ensures that applying the lesson alters the very causal field it was meant to predict, collapsing the distinction between the observer and the observed.
