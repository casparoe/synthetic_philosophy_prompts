prompt: |-
  I chair the grants committee at a mid-size family foundation -- five of us, quarterly meetings, and the job is picking which proposals get money. Our current method is the usual one: everybody ranks the shortlist, the most first-place votes wins, and if nobody has a majority we drop the weakest and revote. Its produced a couple of outcomes nobody will defend. Last fall we funded the safe literacy program over two riskier proposals that split the vote between them, and everyone's least favorite thing about the process is how much the winner depends on which proposals happened to be competing that quarter.

  At the last meeting one of my trustees, Dana, came in with a fix. She wants us to score each proposal independently on a 0-100 "expected impact" scale, average the five scores, fund the highest average, plus a floor: anything averaging under 40 gets nothing no matter where it places. She says this isn't just her preference, it's the uniquely rational way for a group to aggregate, and she brought in Harsanyi's utilitarian theorem -- the one that says if every individual's preferences and the group's preferences are shaped like expected utilities, and the group never overrules a unanimous judgment, then the group's ranking has to be a weighted sum of the members' utilities. She says once you add that everybody's interests count the same, the weights come out equal, so a straight average is the only game in town. She wants it adopted for the spring cycle and never revisited.

  What I can't articulate is why I'm uneasy. Two of the five of us think in bands, basically A through F, and the numbers on our current form were assigned to the bands after the fact, by me, in a spreadsheet -- so I'm honestly not sure 47 and 52 mean anything different. And this cycle one of the three proposals is a gamble: a pilot with maybe a 30% shot at a big regional payoff and a 70% shot at nothing. At least two members who'd say yes to a gamble like that in the abstract will score it low, because they can picture us being the ones who lit the money on fire if it flops. Dana says that's exactly the kind of noise her method cleans up. The other two proposals are boring and safe: a dental clinic expansion and a scholarship fund.

  So write me the short opinion I'll circulate before the spring meeting. It should land on one side -- adopt her rule as is, reject it, or adopt a modified version with conditions attached -- and give the reasoning in a form Dana and the other three can actually argue with, not a philosophy seminar. I want a real recommendation with a date on it, an honest account of what she gets right, because I think she gets a fair amount right, and if the theorem doesn't do the work she thinks it does, say exactly which of its premises our situation fails and what that leaves us with instead. Under two pages, American English, it's going in the board packet.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of a grants committee at a mid-size family foundation (5 members, quarterly meetings).
      *   **Problem:** Current voting method (ranked choice/elimination) produces unstable outcomes (vote-splitting, context dependence).
      *   **Proposal:** Trustee Dana proposes a 0-100 scoring system (average scores, floor of 40) based on Harsanyi's Utilitarian Theorem. She claims it's the "uniquely rational" method and wants it adopted permanently.
      *   **Chair's Concerns:**
          *   Precision illusion: Members think in bands (A-F), not precise numbers (47 vs. 52).
          *   Risk aversion vs. Expected Value: High-risk/high-reward proposals get penalized because members fear the visual of failure ("lighting money on fire"), even if the *expected* impact is high.
          *   Harsanyi's Theorem applicability: Does it actually apply here?
          *   Permanence: Dana wants to "never revisit" the rule.
      *   **Task:** Write a short opinion/memo to circulate before the spring meeting.
      *   **Requirements:**
          *   Take a stance (Adopt, Reject, or Modified).
          *   Provide arguable reasoning (not philosophy seminar).
          *   Include a specific recommendation with a date.
          *   Acknowledge what Dana gets right.
          *   Explain why Harsanyi's theorem might not fully apply (premises failed).
          *   Under two pages, American English, board packet style.

  2.  **Deconstruct the Arguments:**

      *   **Dana's Argument (Pro-Scoring):**
          *   Current system is flawed (vote-splitting, instability).
          *   Harsanyi's Theorem implies linear aggregation (averaging) is the only rational way to combine individual utilities into a social welfare function *if* certain conditions are met (Pareto efficiency, rationality).
          *   Scoring reduces noise and strategic voting.
          *   Floor (40) prevents funding junk.

      *   **Chair's Counter-Arguments (Nuance):**
          *   *Measurement Validity:* Do 0-100 scores mean the same thing to everyone? (No, we think in bands).
          *   *Risk Attitudes:* Harsanyi assumes expected utility maximization. If members are risk-averse regarding *reputation* or *waste* (not just impact), the scores won't reflect true expected impact. They reflect "safety."
          *   *Theorem Limitations:* Harsanyi requires individuals to have consistent utility functions over the *same* outcomes. In philanthropy, "impact" is subjective and uncertain. Also, the theorem justifies the *aggregation*, not necessarily the *scale* (0-100 implies cardinal utility, which is hard to verify).
          *   *Permanence:* "Never revisit" is bad governance.
          *   *Risk Penalty:* Averaging risk-averse scores kills innovation (the 30% gamble).

  3.  **Determine the Stance:**
      *   *Adopt as is?* No. The precision illusion and risk aversion issues are real. "Never revisit" is dangerous.
      *   *Reject entirely?* No. The current ranked system *is* flawed (vote splitting). Dana is right that we need cardinal data, not just ordinal rankings.
      *   *Modified Version?* Yes. This is the most constructive leadership position. Keep the scoring but adjust for the human realities (calibration, risk, review).

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the problem with the current system (validate Dana's starting point).
      *   **What Dana Gets Right:** Harsanyi's logic is sound *in theory*. Averaging is better than ranked elimination for avoiding vote-splitting. Cardinal data is better than ordinal.
      *   **Where the Theory Meets the Floor (The Critique):**
          *   *Premise 1: Cardinal Utility.* Do we actually have a shared 0-100 scale? (The "A-F band" problem). 47 vs 52 is noise.
          *   *Premise 2: Risk Neutrality.* Harsanyi assumes expected utility. Our members are risk-averse regarding *failure visibility*. This biases the "gamble" proposal down artificially.
          *   *Premise 3: Common Priors.* Do we agree on what "100" looks like?
          *   *Governance:* "Never revisit" is inappropriate.
      *   **The Recommendation:** Pilot the scoring system *with modifications*.
          *   Calibration session (define 0, 50, 100).
          *   Risk adjustment (discuss risk explicitly, don't hide it in the score).
          *   Sunset clause (review after 1 year).
      *   **Closing:** Call to action for the spring meeting.

  5.  **Refining the Harsanyi Critique (Crucial Step):**
      *   I need to be careful not to sound like I'm debunking math I don't understand, but rather applying it practically.
      *   Harsanyi's Aggregation Theorem requires that individual preferences satisfy the von Neumann-Morgenstern axioms (rationality under uncertainty).
      *   *The Kicker:* If trustees are scoring based on "regret avoidance" or "reputation risk" rather than pure "expected impact," their utility functions differ from the group's mission utility. The theorem aggregates *preferences*, but if individual preferences include personal risk aversion that contradicts the foundation's risk tolerance, the average score distorts the mission.
      *   Also, the theorem justifies weighted sums, but it assumes interpersonal comparability of utility. In a foundation, we *stipulate* equal weights (one trustee, one vote), but we don't have a verified common scale.

  6.  **Drafting the Content (Iterative refinement for tone):**
      *   *Tone:* Professional, decisive, respectful of Dana's research, but firm on governance.
      *   *Length:* Keep it tight.
      *   *Specifics:* Mention the literacy program (vote split) and the gamble proposal.

  7.  **Final Review against Constraints:**
      *   Under two pages? (Yes, if kept concise).
      *   American English? (Yes).
      *   Recommendation with date? (Yes).
      *   Address Harsanyi premises? (Yes).
      *   Address the risk/gamble issue? (Yes).

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Check:* Did I explain *why* Harsanyi fails?
      *   *Correction:* Make sure to specify that Harsanyi requires consistent utility functions over lotteries. If members treat a 30% chance differently due to emotional risk aversion rather than mathematical expectation, the "utility" being averaged isn't "expected impact," it's "comfort level."
      *   *Check:* Is the recommendation actionable?
      *   *Correction:* Add a calibration exercise to the spring agenda.

  9.  **Final Output Generation** (Proceed to write the memo).
answer: |-
  **MEMORANDUM**

  **TO:** Grants Committee
  **FROM:** Chair, Grants Committee
  **DATE:** January 15, 2024
  **SUBJECT:** Recommendation on Grant Scoring Methodology for Spring Cycle

  At our last meeting, we agreed that our current ranked-choice voting method is failing us. The literacy program decision last fall demonstrated the flaw: when two strong, similar proposals compete, they split the vote, allowing a weaker consensus candidate to win. The outcome depends too much on the lineup rather than the merit.

  Trustee Dana has proposed a new method: independent 0–100 scoring, averaged to determine funding, with a hard floor of 40. She grounds this in Harsanyi's Utilitarian Theorem, arguing it is the uniquely rational way to aggregate our judgments. She recommends we adopt this immediately and permanently.

  I have reviewed the proposal. While Dana is correct that we need to move away from ordinal rankings, I recommend we **adopt a modified version of the scoring system for a one-year pilot, subject to review in January 2025.** We should not adopt it "as is," nor should we lock it in permanently without testing.

  Here is the reasoning, stripped of the philosophy so we can focus on the governance.

  **What Dana Gets Right**
  Dana is right that the current system is mathematically vulnerable to vote-splitting. She is also right that Harsanyi's theorem provides a strong defense of averaging. The theorem states that if a group's decisions are to be rational (consistent under uncertainty) and respect unanimous agreement (Pareto efficiency), the group's preference must be a weighted sum of individual utilities. Since we value each trustee equally, a straight average is indeed the logical aggregation tool. Moving from ranking (ordinal) to scoring (cardinal) gives us more data and reduces tactical voting.

  **Where the Premises Break Down**
  However, Harsanyi's theorem relies on specific premises that do not fully hold in our current context. If we ignore these gaps, the new system will simply codify new errors.

  1.  **Interpersonal Comparability of Utility:** The theorem assumes that a "10" for me represents the same intensity of preference as a "10" for you. In reality, two of us score in bands (A through F). To us, a 47 and a 52 are noise, not signal. Without calibration, averaging these numbers creates a false precision. We are averaging apples and oranges.
  2.  **Risk Attitudes vs. Expected Impact:** Harsanyi assumes individuals maximize *expected utility*. In philanthropy, "utility" should mean "expected social impact." However, our scores often reflect *risk aversion* regarding the Foundation's reputation. Consider the pilot proposal this cycle (30% chance of high impact, 70% chance of zero). Mathematically, if the payoff is high enough, the expected value exceeds the safe dental clinic. But trustees are scoring it low because they fear being the one who "lit the money on fire." This isn't a judgment of impact; it's a judgment of personal regret. Averaging these scores penalizes innovation not because the math doesn't work, but because the inputs are measuring comfort, not impact.
  3.  **Governance Rigidity:** Dana proposes we never revisit the rule. In a foundation, our risk tolerance and strategic goals shift. Locking in a mechanical formula removes our ability to adjust to new realities.

  **The Recommendation**
  We need the stability of scoring without the illusion of precision. I propose the following modifications for the Spring Cycle:

  1.  **Calibration:** Before scoring the spring proposals, we will spend 30 minutes defining the scale. We will agree on what a "0" (no impact), "50" (solid, standard grant), and "100" (transformational, rare) look like. This aligns our internal bands.
  2.  **Risk Disclosure:** For any proposal with high uncertainty, we will separate "Impact Potential" from "Execution Risk." We will not hide risk inside the impact score. This allows us to discuss the gamble proposal on its merits rather than penalizing it for being scary.
  3.  **Sunset Clause:** We will adopt this system for four quarters. In January 2025, we will review the funded outcomes to see if the scoring system produced better grants than the old method.

  **Next Steps**
  Please review the attached draft scoring rubric. At the spring meeting on **March 12**, we will vote on adopting this modified pilot. If approved, we will begin the calibration exercise immediately prior to scoring the current queue.

  Dana's research has pushed us toward a more robust system, and I thank her for it. But a theorem is a map, not the territory. We must ensure the numbers we average actually mean the same thing to all five of us.

  I look forward to discussing this on March 12.
