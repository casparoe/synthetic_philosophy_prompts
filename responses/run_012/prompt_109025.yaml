answer: |-
  You have identified a subtle and dangerous failure mode that is distinct from the popular understanding of Goodhart's Law, even if it technically falls under its broad umbrella. You are right to distrust the "cleaner" validation checks.

  There isn't one single canonical name for this specific dynamic (the "convergence" variant of Goodhart), but there are three concepts from different fields that, when layered together, describe it perfectly.

  ### 1. The Organizational Name: Surrogation
  In management accounting and strategy, this is called **Surrogation**.

  Surrogation occurs when a measure, intended to represent a strategic goal, replaces that goal in the minds of the people managing it. The classic warning is: *"The measure becomes the strategy."*

  *   **How it fits your case:** The clinic staff isn't trying to game the number (which would be standard Goodhart); they are sincerely trying to achieve the number. In doing so, they have unconsciously decided that *achieving the number is equivalent to achieving the mission*.
  *   **Why it differs from Goodhart:** Standard Goodhart implies **divergence** (the metric goes up, the goal stays flat or drops). Surrogation often creates **convergence** (the metric goes up, and the *defined* goal goes up with it), but only because the definition of the goal has shrunk to fit the metric.

  ### 2. The Sociological Name: Performativity
  In economic sociology (associated with Michel Callon and Bruno Latour), this is called **Performativity**.

  This theory posits that economic or evaluation models do not merely describe reality; they *shape* reality to match the model. When you introduce a metric, you don't just measure the system; you install a new operating system.

  *   **How it fits your case:** You noted the clinic "reorganized itself around the number." This is performativity in action. The metric didn't get better at measuring the old reality; the reality was reconstructed to match the metric.
  *   **The Trap:** The correlation increases because the "noise" (the variation between the proxy and the true goal) has been systematically pruned. But that noise wasn't random error; it was **signal**. It was the part of "care that stuck" that the proxy couldn't see. By eliminating the gap, they eliminated the complexity of the mission.

  ### 3. The Systems Name: Overfitting
  In machine learning and statistics, this is **Overfitting**.

  Imagine the "True Goal" is a complex function. The "Proxy Metric" is a simplified training dataset. The "Organization" is the model.
  *   **Healthy State:** The model learns the general trend from the training data (proxy) and applies it to the real world (goal). There is some error (the gap you trusted).
  *   **Your State:** The model has optimized itself so perfectly to the training data that it captures the noise and idiosyncrasies of the metric itself. It has 100% accuracy on the training set (the validation checks look perfect) but has lost **generalizability** to the actual underlying phenomenon.

  ### Why Your Intuition is Correct
  You wrote: *"The gap between proxy and goal is where the information lived."*

  This is the critical insight. In evaluation, the **residual** (the difference between the proxy and the truth) is often where the learning happens.
  *   If the proxy says "Good" but the patient relapsed, that gap tells you the proxy is blind to *relapse triggers*.
  *   If the organization reorganizes to close that gap, they aren't fixing the relapse triggers; they are likely discharging patients who *look* like they won't relapse according to the proxy's limited view.

  The metric hasn't become more valid; the **construct** has been narrowed. You are no longer measuring "Care that Stuck"; you are measuring "Care that Stuck *in the specific ways the clinic can now control*."

  ### Is Your Second Case the Same Pattern?
  > *A charity's "cost per person housed" went down and got more predictive after it landed in a grant agreement... the easy-to-house got served first.*

  This is a **sibling, not a twin**. It produces the same symptom (metric improves, validity drops) but via a different mechanism.

  *   **Case 1 (Clinic):** **Behavioral Adaptation.** The system changed its *processes* to match the metric. (Performativity/Surrogation).
  *   **Case 2 (Housing):** **Selection Bias (Cream Skimming).** The system changed its *inputs* to match the metric.

  In the housing case, the correlation tightens because the variance in the population has collapsed. If you only house easy cases, costs are consistently low and success is consistently high. The metric predicts the outcome perfectly *for that new, narrower population*.

  This is often called **Cream Skimming** or **Cherry Picking**. It is a form of Goodhart's Law, but specifically driven by **population drift** rather than **process distortion**. Both cases result in a metric that is statistically robust but evaluationally hollow.

  ### Summary of Concepts

  | Concept | Field | What it explains |
  | :--- | :--- | :--- |
  | **Surrogation** | Management | Why the team treats the metric as the goal. |
  | **Performativity** | Sociology | Why the reality changed to match the metric (tightening correlation). |
  | **Overfitting** | Systems/AI | Why the metric works perfectly on the org but fails on the mission. |
  | **Construct Narrowing** | Psychometrics | Why the "thing we care about" is now smaller than it was. |
  | **Cream Skimming** | Economics | The mechanism in your second case (changing inputs, not processes). |

  ### How to Talk About It
  Since there is no single "Law" name like Goodhart, you can describe it accurately by combining these terms.

  **The Pitch:**
  *"We are seeing **Surrogation driven by Performativity**. The metric hasn't drifted from the goal (Goodhart); the goal has collapsed into the metric. The organization has **overfit** its operations to the proxy, eliminating the variation that allowed us to validate the work. We aren't measuring success anymore; we're measuring compliance with the measurement tool."*

  ### How to Detect It (The Smell Test)
  Since standard validation checks (correlation, variance) will look *better*, you cannot use quantitative metrics to detect this. You need:

  1.  **Residual Analysis:** Don't look at the correlation; look at the cases where the metric and the goal *disagreed* in the past. Investigate if those cases have disappeared from the pipeline entirely.
  2.  **Blind Qualitative Audits:** Randomly sample cases without looking at their metric scores. If the qualitative "feel" of the work has degraded while the numbers improved, you have overfitting.
  3.  **Adversarial Proxies:** Introduce a secondary metric that is hard to game and correlates loosely with the first. If Metric A goes up and Metric B stays flat, you have narrowing.
  4.  **The "So That" Test:** Ask the team: "We are increasing clinic retention *so that*...?" If they answer "To hit the retention target," you have surrogation. If they answer "So patients stay healthy," ask them to show you the health data for the patients who *didn't* return (the invisible gap).

  You are witnessing the **hollowing out of validity**. It is more insidious than standard Goodhart because it wears the mask of success.
