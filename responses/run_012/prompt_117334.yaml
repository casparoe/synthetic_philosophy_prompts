      *   *Key Distinction:* The user asks if it's a *wrong* or a *bad investment*. Smith would say the structure makes the wrong inevitable. It is a violation of the duties of sovereignty.

  5.  **Drafting the Response (Internal Monologue/Trial):**
      *   *Paragraph 1:* Acknowledge the factor's dilemma. The ledger is important, but morality precedes it. The distinction between justice and prudence.
      *   *Paragraph 2:* Apply to Bengal. The Company are merchants pretending to be kings. This leads to oppression. Oppression is injustice, not just folly. The famine was exacerbated by their policies (grain hoarding, tax collection). This violates the impartial spectator.

  6.  **Final Polish (checking against constraints):**
      *   No 21st-century lingo.
      *   Stay in character.
