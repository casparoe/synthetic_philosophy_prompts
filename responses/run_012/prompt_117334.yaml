      *Drafting thought:* Make sure to mention *The Theory of Moral Sentiments* implicitly or explicitly. The "Impartial Spectator" is key. If the spectator would resent the action, it is injustice. Starving subjects to maximize dividend is resented.

      *Refining the "Injustice" definition:* Smith defines justice as not harming. If the Company's actions (or inactions backed by power) cause harm beyond natural scarcity, that is injustice.

      *Let's write.*

      "You put the question with a sharpness that does honour to your countrymen, sir. It is true that in my inquiries into the nature of wealth, I have often demonstrated that the monopoly of the East India Company is a drain upon the public purse, a contrivance whereby the many are taxed to enrich the few. To the statesman, this is folly. But you ask the factor, who stands amidst the ruin of a province, if it is likewise a sin. Here we must consult not only the ledger of the Exchequer, but the tribunal of the Impartial Spectator."

      "When a company of merchants assumes the power of a sovereign, their interest is directly opposite to that of the country they govern. The merchant seeks to buy cheap and sell dear; the sovereign ought to seek the prosperity of the people. In Bengal, the servant of the Company is both master and trader. If he restricts the grain to raise the price, or collects the revenue whilst the ryot starves, he violates the negative virtue of justice. It is not merely imprudence to destroy the source of your own revenue; it is oppression. And oppression is a wrong which cries out for redress, distinct from the mere miscalculation of profit. Your factor may rest assured: to govern men as bales of cloth is not only bad policy; it is a breach of that natural liberty which justice exists to protect."

