prompt: |-
  Treat the run of mid-2010s business headlines that credited a birth cohort — the Millennials — with the death of chain restaurants, golf, cereal, and department stores as a real episode, and analyze it through the metaphysics of social kinds, running the analysis in both directions. In one direction: what would it take for a generation to be a genuine kind rather than a convenient label — a shared causal mechanism, a homeostatic cluster of traits, a common formative experience — and does the discourse about that cohort killing off industries actually presuppose any of these, or does it trade on a demographic shorthand doing no explanatory work? In the other: does the way the category is used and revised — people who react to being labeled, boundaries redrawn by demographers and marketers, members who disown the label — support an account of social kinds as looping, self-reinforcing constructions, or does the episode show such accounts overreaching? Fold in the identification problem that a cohort effect cannot be cleanly separated from age and period effects in a single cross-section, and say whether it discredits generational explanation as such or only its careless uses. Be explicit about where the theory is silent rather than pressing it to adjudicate. No citations needed.
