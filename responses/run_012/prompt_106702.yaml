prompt: |-
  Six months ago I was elected steward in my department at a large public hospital, on the strength of our first contract campaign, which ended in a nine-day strike I helped run. I have 90 minutes at the next stewards' training day with about twenty new stewards, most of whom have never voted in an authorization vote, and I want them to feel two things that took me a strike to learn and that I still cannot convey in a speech: that the union's power is a public good each member has a private reason to free-ride on, and that a strike works only if it binds the members who voted against it. Please design the session. I want a simulation with roles, a payoff scheme that uses no real money, a timeline, and a vote structured so that the minority is visibly bound by the majority's decision and has to decide, in role, what it owes a colleague who crosses. Build in at least one role whose objection to striking is principled rather than self-interested, so the fairness question cannot be waved away as selfishness. Then a debrief that maps what happened onto the difference between organizing as a right of association and striking as coercion of one's own side, including what to say to members who want the gains without the discipline. Tell me what predictably goes wrong the first time — I expect the free-riding to be underplayed and someone to feel personally accused — and be frank about which part of the idea the simulation cannot reproduce and I will have to state myself.
reasoning: |-
  Here's a thinking process that leads to the suggested training session design:

  1.  **Analyze the Request:**
      *   **User:** Elected steward (6 months exp, helped run a 9-day strike) at a large public hospital.
      *   **Audience:** ~20 new stewards (mostly inexperienced, haven't voted in auth votes).
      *   **Time:** 90 minutes.
      *   **Goal:** Convey two hard-learned lessons:
          1.  Union power is a public good (incentive to free-ride).
          2.  Strikes only work if they bind those who voted *against* them.
      *   **Requirements:**
          *   Simulation with roles.
          *   Payoff scheme (no real money).
          *   Timeline.
          *   Vote structure (minority visibly bound by majority).
          *   Decision point: What does a striker owe a colleague who crosses?
          *   Specific Role: At least one principled objection to striking (not just self-interest).
          *   Debrief: Map to "organizing as right of association" vs. "striking as coercion of one's own side." Address "gains without discipline."
          *   Prediction: What goes wrong (free-riding underplayed, personal accusation).
          *   Limitation: What the simulation *cannot* reproduce (must be stated by facilitator).

  2.  **Deconstruct the Core Tensions:**
      *   *Public Good Problem:* Everyone benefits from the contract, but striking costs individual effort/risk. Rational choice theory says don't strike. Collective action theory says everyone must strike.
      *   *The "Bind":* If the minority can opt-out, the strike fails. Therefore, the majority must enforce participation on the minority. This feels like coercion.
      *   *The "Crosser":* In a hospital, crossing isn't just scabbing for profit; it can be patient care (principled). This adds moral weight.
      *   *The Steward's Role:* They are the enforcement mechanism. They have to look their friends in the eye and say "You can't cross."

  3.  **Designing the Simulation ("The Ward Standoff"):**
      *   *Setting:* A hospital ward (relatable).
      *   *Stakes:* A contract offer vs. Strike.
      *   *Mechanic:* Points system representing "Security/Benefits" vs. "Personal Cost/Risk."
      *   *Roles:* Need a mix.
          *   *Majority:* Pro-strike.
          *   *Minority:* Anti-strike (Self-interested).
          *   *Minority:* Anti-strike (Principled - Patient Safety).
          *   *Stewards:* The enforcers/organizers.
      *   *The Twist:* The payoff depends on *total participation*, not just the vote. If participation < threshold, everyone loses. If participation > threshold, strikers pay a cost, non-strikers get a bonus (free-ride). *Wait, that encourages free-riding.*
      *   *Correction:* The payoff needs to show that if the strike fails, *everyone* loses badly. If it succeeds, strikers pay a cost but gain long-term. Non-strikers gain short-term but undermine long-term.
      *   *Refined Mechanic:*
          *   Round 1: Vote on Strike.
          *   Round 2: Decision to Walk or Work.
          *   Condition: Strike succeeds only if 80% walk.
          *   Payoff:
              *   Strike Succeeds: Everyone gets Contract Win (10 pts). Strikers pay Strike Cost (-5 pts). Net: Strikers 5, Non-strikers 10. (Shows free-rider advantage).
              *   Strike Fails: Everyone gets Bad Contract (0 pts). Strikers pay Strike Cost (-5 pts). Non-strikers 0. (Shows collective loss).
          *   *Crucial Addition:* Stewards can "Picket" (spend points to pressure others).
      *   *The "Bind":* If the vote passes, the rules state *everyone* is expected to walk. If someone walks out in the sim, they are a "crosser."
      *   *The "Principled" Role:* A nurse who believes leaving patients is unethical regardless of the contract.

  4.  **Drafting the Session Plan (90 Minutes):**
      *   0-10: Intro & Framing (Set the stakes).
      *   10-25: Role Assignment & Rules (Explain the payoff matrix).
      *   25-45: Round 1 (The Vote & The Decision).
      *   45-60: The Crisis (Reveal the "Crossers" & Steward Intervention).
      *   60-80: Debrief (The hard conversation).
      *   80-90: Closing & Takeaways.

  5.  **Refining the Payoff & "Binding" Mechanism:**
      *   To make the "binding" visible, the simulation needs a moment where the Majority realizes the Minority's choice destroys *their* payoff too.
      *   Let's use tokens (poker chips or paper slips).
      *   *The "Crosser" Dilemma:* If the strike vote passes (majority), but you work, you get the benefit *if* it succeeds, but you are socially ostracized.
      *   *Steward Task:* They must convince the "Principled" objector to stay out without attacking their ethics.

  6.  **Addressing the Specific Constraints:**
      *   *Principled Objection:* Role Card "Patient Safety First."
      *   *Free-ride underplayed:* People want to look good. I need to make the temptation explicit in the rules.
      *   *Personal Accusation:* The debrief must handle the emotional fallout.
      *   *Limitation:* A sim can't reproduce the *fear* of firing or the *solidarity* of the picket line. It's a game; real life has consequences.

  7.  **Developing the Debrief (The "Theory" Part):**
      *   Map the game to Olson's Logic of Collective Action.
      *   Distinguish "Right to Associate" (joining) vs. "Duty to Strike" (coercion).
      *   Script for "Gains without Discipline": "The contract is a floor, not a ceiling. If we don't defend the floor, there is no ceiling."

  8.  **Review against Constraints:**
      *   90 mins? Yes.
      *   20 stewards? Yes (groups of 4-5).
      *   No real money? Yes (points/tokens).
      *   Roles? Yes.
      *   Principled objection? Yes.
      *   Prediction of failure? Yes.
      *   Limitation admission? Yes.

  9.  **Final Polish:**
      *   Tone: Serious, respectful, experienced (peer-to-peer).
      *   Structure: Clear headings.
      *   Emphasis: The emotional weight of telling a friend they can't work.

  *(Self-Correction during drafting)*: Initially, I thought about having them vote multiple times. No, keep it tight. One vote, one action phase. The tension comes from the gap between the vote and the action.
  *Correction on Payoff:* Make sure the "Free Rider" advantage is clear *only if the strike succeeds*. If the strike fails, the free rider gains nothing. This highlights the risk of relying on free riders.
  *Correction on Binding:* The simulation needs a rule that *if the vote passes, crossing is a violation of union duty.* The Stewards have to enforce this.

  10. **Finalizing the Output:** (Proceeding to generate the response based on these thoughts).
answer: |-
  This is a high-stakes training. You are asking new stewards to internalize the most uncomfortable part of labor power: that solidarity requires the capacity to say "no" to your own friends. A 90-minute session is tight, so the simulation must be ruthless in its mechanics to force the emotional realization quickly.

  Here is the design for **"The Ward Standoff."**

  ### Session Overview
  *   **Time:** 90 Minutes
  *   **Participants:** 20 New Stewards
  *   **Setup:** 4 Tables of 5 participants each.
  *   **Materials:** Poker chips (or colored paper slips), Role Cards, "Contract Offer" slips, Whiteboard.

  ---

  ### Part 1: Framing (10 Minutes)
  **Facilitator Script:**
  "Six months ago, we won a contract because we stopped being a collection of individuals and became a weapon. Today isn't about how to file a grievance. It's about the math of power. We are going to play a game where the rational choice for *you* is to let someone else take the risk. But if everyone makes the rational choice, we all lose. You are the stewards. In this game, and in the hospital, you are the mechanism that closes that gap."

  ### Part 2: The Simulation Setup (15 Minutes)
  Divide the 20 stewards into 4 wards (tables) of 5. Distribute Role Cards face down.

  **The Payoff Scheme (Write on Whiteboard):**
  *   **Currency:** "Security Points" (Chips). Start with 10 each.
  *   **The Goal:** End the game with the most points.
  *   **The Strike Threshold:** A strike succeeds only if **4 out of 5** members walk.
  *   **Outcomes:**
      1.  **Strike Succeeds (4+ walkers):** Management offers a 20% raise.
          *   *Walkers:* Pay "Strike Cost" (-5 points). Gain "Raise" (+10 points). **Net: +5.**
          *   *Workers (Crossers):* Pay no cost. Gain "Raise" (+10 points). **Net: +10.**
          *   *Lesson:* The Crosser wins more than the Striker *if the strike works.*
      2.  **Strike Fails (3 or fewer walkers):** Management imposes a concessionary contract.
          *   *Walkers:* Pay "Strike Cost" (-5 points). Gain nothing. **Net: -5.**
          *   *Workers:* Pay no cost. Gain nothing. **Net: 0.**
          *   *Lesson:* The Crosser still loses less than the Striker, but everyone loses ground.

  **The Roles (Distribute randomly, but ensure each table has at least one of Role C):**
  *   **Role A (The Majority):** You support the strike. You need the raise.
  *   **Role B (The Self-Interested):** You support the strike *in theory*, but you have high personal debt. You secretly hope others strike so you can get the raise without losing pay.
  *   **Role C (The Principled Objector):** You believe patient safety is compromised by a strike in your specific unit. You will vote for the strike to show solidarity, but you **cannot** walk the picket line. It violates your ethics.
  *   **Role D (The Steward):** You do not vote. You observe. Your job is to ensure the strike threshold is met. You have the power to "Picket" (spend 2 of your own points to remove 5 points from a Crosser via social pressure/discipline).

  ### Part 3: The Vote and The Walk (25 Minutes)
  **Phase 1: The Authorization Vote (5 mins)**
  *   Tables discuss the offer.
  *   Secret ballot: Strike or No Strike?
  *   *Rule:* If 3 out of 5 vote Strike, the Strike is **Authorized**.
  *   *Likely Outcome:* Most will vote Strike. It costs nothing to vote.

  **Phase 2: The Decision (10 mins)**
  *   Reveal Roles to the table.
  *   Private decision: Will you Walk or Work?
  *   *Crucial Rule:* If the Strike is Authorized, **everyone is bound by the decision.** Working is crossing the line.
  *   Participants place a chip face down: White = Walk, Black = Work.

  **Phase 3: The Reveal & Intervention (10 mins)**
  *   Reveal choices simultaneously.
  *   **Scenario A (Success):** 4+ Walk. The Steward sees the Crosser (likely Role C). The Steward must decide: Do I spend my points to "Picket" them (punish them), or let it slide?
  *   **Scenario B (Failure):** 3 or fewer Walk. The Strike collapses.
  *   **The Twist:** If Role C (Principled) decides to Work, they must state their reason aloud: *"I am not doing this for money. I am doing this because I cannot leave these patients."*
  *   The Steward must respond in character. They must convince Role C to stay out, or punish them for crossing.

  ### Part 4: The Debrief (35 Minutes)
  *This is where the learning happens. Do not skip the discomfort.*

  **1. The Math of Free-Riding (10 mins)**
  *   **Ask:** "Look at the payoff board. If the strike succeeds, who wins the most?"
  *   **Answer:** The Crosser.
  *   **Ask:** "So why didn't everyone cross?"
  *   **Discussion:** Trust, fear of punishment, solidarity.
  *   **Point:** "Union power is a public good. Like clean air. You benefit whether you paid for the filter or not. That is why the incentive is always to free-ride. If we rely on altruism, we lose. We rely on *structure*."

  **2. The Bind of the Minority (15 mins)**
  *   **Focus on Role C (Principled):** "Role C, how did it feel to be told your ethics were secondary to the contract?"
  *   **Focus on the Steward:** "Steward, you had to tell a colleague that their 'principled' stand breaks the strike. How did that feel?"
  *   **The Hard Truth:** "A strike is not a protest. It is an economic shutdown. It does not work if the lights stay on. If the minority can opt-out based on their private reasoning, the majority's sacrifice is wasted."
  *   **Mapping to Theory:**
      *   **Organizing:** The right to associate (Voting Yes).
      *   **Striking:** The coercion of one's own side (Binding the No vote).
      *   "We do not strike management into submission. We strike *ourselves* into position. We withhold labor. If you sell your labor during a strike, you are undermining the weapon."

  **3. Scripting the Conversation (10 mins)**
  *   **Scenario:** A member says, *"I want the raise you're winning, but I can't afford to lose the pay, and I don't think striking is right for me."*
  *   **Bad Response:** "You're a scab." (Creates enemies).
  *   **Bad Response:** "It's okay, just donate to the strike fund." (Validates free-riding).
  *   **Steward Response:** "I understand the cost is high for you. But this contract isn't just for you. It's for the person hired after you. If we let people opt-out, the strike fails, and we all get the concessionary contract. I need you to walk. We have a hardship fund, but we cannot have a strike fund for people who work. The gain requires the discipline."

  ### Part 5: Closing (5 Minutes)
  **Facilitator Script:**
  "You will be accused of bullying. You will be accused of not caring about patients. You must hold the line. Not because you enjoy coercion, but because the alternative is a race to the bottom where the most vulnerable worker always loses. The union is the only thing that binds us together when it would be easier to drift apart."

  ---

  ### Predictable Failures & Limitations

  **1. What Will Go Wrong (The "Nice" Problem)**
  *   **Underplayed Free-Riding:** In a training room, people want to look like "good union members." Role B (Self-Interested) will likely pretend to Walk to avoid shame.
      *   *Fix:* Collect the Walk/Work decisions privately in a hat before revealing. Anonymity encourages the true rational choice (crossing).
  *   **Personal Accusation:** When the Steward confronts Role C (Principled), it often gets heated. A participant may feel *personally* attacked rather than playing a role.
      *   *Fix:* Pre-brief the room: "This is a simulation of conflict. If you feel attacked, say 'Pause.' We are attacking the *dynamic*, not the person."

  **2. What the Simulation Cannot Reproduce (You Must State This)**
  *   **The Fear:** In the game, losing points is annoying. In reality, losing pay means eviction or hunger. The simulation cannot reproduce the *terror* of striking. You must say: *"In this game, you risked chips. In the hospital, you risk your mortgage. That is why the Steward's job is to make sure that risk is not taken in vain."*
  *   **The Solidarity High:** The game is cold and transactional. It misses the euphoria of the picket line, the shared meals, the singing. That emotional bond is what actually sustains the strike, not just the payoff matrix. You must say: *"The math says don't strike. The feeling of standing together is why we do it anyway. Your job is to build the feeling so the math doesn't matter."*
  *   **Patient Safety Reality:** Role C's objection is simplified. In a real hospital, life-and-death care *is* a legitimate constraint. The simulation makes it a binary choice. In reality, we maintain life-safety staffing while striking everything else. You must clarify: *"We never strike patient safety. We strike administrative functions. But 'safety' is often used as an excuse to break a strike. You must know the difference."*

  ### Facilitator's Note to You
  You mentioned you cannot convey this in a speech. That is because a speech is a public good—everyone listens, no one pays. This session works only if you let the silence hang after the Steward confronts the Crosser. Do not rush to fill that silence. Let them feel the weight of telling a friend they are wrong. That discomfort is the job.
