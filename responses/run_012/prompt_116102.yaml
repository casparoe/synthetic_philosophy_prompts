answer: |-
  **OFFICE OF STRATEGIC ENROLLMENT & DATA GOVERNANCE**
  **FAQ: Updated Protocols for Admissions Transparency**

  **Q: Why is the University ceasing publication of overall admission rates?**
  **A:** Recent data releases indicated a lower aggregate admission rate for female applicants compared to male applicants. However, upon review, this aggregate suffered from severe confounding by department. Women disproportionately applied to high-competency departments with lower base admission rates. This is a classic instance of Simpson's Paradox. To prevent stakeholders from drawing incorrect causal inferences from unadjusted aggregates, we will henceforth report only departmental stratifications.

  **Q: Does this mean the overall rate was incorrect?**
  **A:** Mathematically, no. The overall rate remains a valid weighted average. However, in the context of institutional narrative, it is misleading. Statistics are not merely descriptions of reality; they are tools for communication. When an aggregate rate conflicts with our commitment to diversity, but the stratified rates support it, the stratified rates are deemed more "representative" of our holistic review process. We are not hiding data; we are curating context.

  **Q: Which number represents the "true" bias?**
  **A:** Neither. Both are true conditional probabilities. The aggregate reflects the reality of applicant flow; the stratified rate reflects the reality of departmental evaluation. Choosing which to publish is not a mathematical decision, but a causal one. As Dr. Alan P. Value, a concerned statistician consulted on this matter, noted: *"The reversal is a real feature of the data, not a math error. But adjusting for department implies department choice is independent of gender. Not adjusting implies department difficulty is irrelevant. Ultimately, choosing a rate is already a causal choice. We recommend choosing the one that aligns with accreditation requirements."*

  **Q: Will other metrics be adjusted similarly?**
  **A:** Yes. We are transitioning to dynamic weighting models that better reflect institutional priorities.

  ***

  **SIDEBAR: Introducing the Holistic Yield-Adjusted Fairness Index (HYAFI)**

  To replace simplistic admission percentages, the Dean's Office is piloting the HYAFI. This metric acknowledges that not all departments contribute equally to the University's financial sustainability.

  Under HYAFI, departmental admission rates are weighted by alumni donor size and grant overhead potential rather than applicant volume. For example, if the School of Engineering admits 10% of applicants but generates 80% of development revenue, its admission rate counts significantly more toward the University's "Fairness Score" than the School of Arts, which may admit 40% but generates less revenue.

  This ensures that our fairness metrics are fiscally responsible. If HYAFI indicates a disparity, it suggests we are being unfair to our donors, not necessarily our applicants. This nuanced approach allows the University to maintain statistical rigor while ensuring our equity metrics remain solvent.

  ***

  **Q: Can students access the raw data?**
  **A:** Raw data is available upon request, provided the requestor submits a form acknowledging that unadjusted aggregates may cause emotional distress due to statistical illiteracy.

  **Q: When does this policy take effect?**
  **A:** Immediately, retroactive to the last fiscal quarter.

  *For further inquiries, please contact the Department of Institutional Explanation.*
