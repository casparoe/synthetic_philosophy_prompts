answer: |-
  **Exam Question**

  **Time Allowed:** 90 Minutes
  **Word Limit:** None (but quality over quantity)

  **Question:**
  Consider an agent in a meeting who takes a pen from a colleague's desk without asking, intending to return it shortly. Two candidate maxims describe this action:

  > **(A)** Whenever I need something and can just take it, I'll take it, meaning to return it later.
  > **(B)** When I'm stuck in a meeting without a pen, I'll borrow one from a colleague sitting near me and hand it back a few minutes later.

  Apply Kant's Formula of Universal Law to both maxims. Explain why (A) is typically thought to generate a contradiction while (B) does not. Then, address the "Specification Objection": If the moral verdict changes simply by altering the description of the act, is the Categorical Imperative test rigged?

  In your response, you must adjudicate which maxim is morally relevant. Defend your choice by appealing to Kant's theory of action (specifically the role of incentives and the agent's actual principle). Finally, take a stand: Does Maxim (A) fail because it generates a genuine logical contradiction, or merely because the agent's purpose is defeated in a universalized world?

  ***

  **Model Answer**

  The maxim-specification problem threatens the Categorical Imperative (CI) with arbitrariness: if moral permissibility depends on how we describe our actions, agents can manipulate descriptions to pass the test. To resolve the pen case, we must rigorously apply the Formula of Universal Law (FUL) and then ground the choice of maxim in the agent's subjective principle.

  Universalizing Maxim (A) ("Whenever I need something... take it... return later") generates a Contradiction in Conception. If everyone adopted this principle, the practice of leaving items on desks would vanish. Possession in a shared space relies on a baseline expectation of consent. If "taking without asking" became a universal law of nature, colleagues would hide their pens. Consequently, the agent could no longer "take" a pen that is available, nor "return" it to its owner, as the concept of temporary use without consent destroys the trust required for the objects to be accessible in the first place. The maxim becomes impossible to act upon in the world it creates.

  Maxim (B), however, specifies the context ("stuck in a meeting," "colleague near me," "hand it back"). Universalizing this does not collapse the practice. A world where colleagues silently share tools during urgent collaborative moments is coherent; it relies on a norm of reciprocal convenience rather than unchecked appropriation. The institution of property remains intact because the exception is bounded by necessity and proximity, not mere convenience.

  This invites the Specification Objection: The test seems rigged. By narrowing the description from (A) to (B), we evade the contradiction. If any impermissible act can be redescribed as a specific exception, the CI loses critical force. For instance, a murderer could claim their maxim is "Killing when provoked" rather than "Killing."

  The Kantian reply lies in the definition of a maxim. A maxim is not an arbitrary description of behavior; it is the agent's *subjective principle of volition*, including the incentive (*Triebfeder*). We cannot choose the maxim that passes the test; we must identify the maxim that *actually moved the agent*. If the agent took the pen because they believed their convenience outweighed the colleague's right to consent, Maxim (A) is the true principle. The specific details in (B) are only morally relevant if they constituted the agent's actual reason for acting (e.g., "I could not ask without disrupting the speaker"). If the agent *could* have asked but chose not to for ease, (B) is a post-hoc rationalization, not the operative maxim. Moral evaluation tests the will, not the outcome.

  Regarding the type of contradiction in (A), this is a Contradiction in Conception, specifically a "practical contradiction." It is not logically impossible to imagine everyone taking pens (the concept doesn't vanish like "promising without intending to keep"). However, the *purpose* of the maxim is defeated. The agent wills to take a pen *available for use*. In the universalized world, no pens are available for use. One cannot consistently will the means (taking) while universalizing a principle that destroys the condition of those means (availability/trust).

  Therefore, the test is not rigged because maxims are constrained by truthfulness about one's incentives. If the agent acts on (A), the act is impermissible because it treats the colleague's property as a mere resource, undermining the reciprocal trust required for shared spaces. If the agent truly acts on (B), motivated by urgent collaborative necessity where consent is implicitly understood, the act is permissible. The CI forces us to scrutinize not just what we do, but why we do it.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Application of the Categorical Imperative (6 Marks)**
  *   **5-6:** Correctly identifies that (A) fails universalization (practice collapses/trust erodes) and (B) passes (coherent practice of reciprocal aid). Clearly distinguishes the outcome of the test for each.
  *   **3-4:** Identifies (A) fails and (B) passes but gives vague reasoning (e.g., "it would be chaotic" without explaining the structural collapse of the practice).
  *   **0-2:** Fails to run the test on both maxims or claims both fail/pass without justification.

  **2. Addressing the Specification Objection (6 Marks)**
  *   **5-6:** Articulates the objection clearly (verdict depends on description/manipulation). Provides the Kantian reply based on the *agent's actual principle/incentive*. Emphasizes that maxims are not chosen to pass the test but discovered via introspection of the will.
  *   **3-4:** States the objection but offers a weak reply (e.g., "we should just be honest" without linking to the definition of a maxim or incentive).
  *   **0-2:** Ignores the objection or claims the test is indeed rigged/subjective.

  **3. Contradiction Type & Adjudication (5 Marks)**
  *   **5:** Takes a clear stand on the contradiction type (Practical Contradiction/Contradiction in Conception via purpose defeat). Correctly adjudicates that (A) is the relevant maxim *unless* the specific constraints of (B) were the actual incentive.
  *   **3-4:** Identifies the contradiction type loosely (e.g., calls it a "logical contradiction" without nuance) or hedges too much on which maxim applies.
  *   **0-2:** Confuses Contradiction in Will with Contradiction in Conception, or claims the outcome determines the maxim.

  **4. Structure and Clarity (3 Marks)**
  *   **3:** Concise, philosophical tone, no fluff.
  *   **1-2:** Disorganized or overly verbose.
  *   **0:** Incoherent.

  **Specific Penalties & First-Class Indicators**
  *   **First-Class Move:** Explicitly linking the maxim to the *incentive* (e.g., "convenience vs. necessity"). Noting that (B) is only valid if the agent *could not* ask.
  *   **Major Penalty (-3 marks):** Reciting Groundwork examples (false promising/suicide) instead of analyzing the pen case.
  *   **Major Penalty (-3 marks):** Using consequentialist reasoning (e.g., "A is wrong because the colleague will get annoyed").
  *   **Major Penalty (-2 marks):** Claiming (B) generates a contradiction in conception.
  *   **Major Penalty (-2 marks):** Treating "feelings" or "intuition" as the test for which maxim is correct.
