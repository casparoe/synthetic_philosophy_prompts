answer: |-
  **Exam Question Draft: Rational Choice & Decision Theory**

  **Question 4 (25 Marks)**
  Consider the Two-Envelope Paradox. You are presented with two envelopes. One contains $m$ and the other $2m$. You select one at random, open it, and observe the amount $x$. You may keep $x$ or swap for the other envelope. You are risk-neutral.

  **(a)** State the standard "naive" switching argument that suggests you should always swap. Identify the specific probabilistic assumption this argument makes about the relationship between $x$ and the other envelope, and explain why this assumption is generally unjustified without a specified prior distribution. **(5 marks)**

  **(b)** Now consider a concrete version of the game. The host chooses an integer $m$ uniformly from $\{1, 2, ..., 10\}$, places $m$ and $2m$ in the envelopes, shuffles them, and hands you one. You open it and see $x$.
  (i) Derive the optimal switching policy in terms of $x$.
  (ii) Calculate the expected monetary gain of this optimal policy compared to the policy of "never swapping."
  (iii) Explain how a positive expected gain conditional on $x$ is compatible with the ex ante symmetry argument that swapping blindly yields zero expected gain. **(15 marks)**

  **(c)** Suppose the naive argument in (a) were true (i.e., the other envelope always has expected value $1.25x$). Explain why this would allow a "money pump" if you were allowed to swap back and forth with a small transaction fee $\epsilon > 0$. What does this imply about the validity of the naive expectation? **(5 marks)**

  ***

  **Model Answer**

  **(a)** The naive argument calculates the expected value of the other envelope as $0.5(2x) + 0.5(x/2) = 1.25x$. Since $1.25x > x$, it concludes one should always swap. This relies on the assumption that conditional on observing $x$, the probability that $x$ is the smaller amount ($m$) is exactly $0.5$, and the probability it is the larger amount ($2m$) is also $0.5$. This is unjustified because it implicitly assumes a scale-invariant improper prior over $m$. In any proper distribution, observing a specific $x$ updates the probabilities; for sufficiently large $x$, it becomes more likely that $x$ is the larger amount ($2m$), breaking the 50/50 symmetry.

  **(b)**
  (i) **Optimal Policy:** The maximum possible value for $m$ is 10, so the maximum smaller amount is 10. If $x > 10$, $x$ cannot be $m$; it must be $2m$. Thus, the other envelope contains $x/2$, and you should **keep**. If $x \le 10$, $x$ could be $m$ or $2m$. Since the prior on $m$ is uniform, the likelihood of observing $x$ is equal in both cases (provided $x/2$ is a valid integer $m$). Even if $x$ is odd (implying $x=m$ certainly), swapping yields $2x$. If $x$ is even, the posterior is 50/50, yielding expected other value $1.25x$. In all cases where $x \le 10$, swapping is optimal. Policy: **Swap iff $x \le 10$.**

  (ii) **Expected Gain:** There are 20 equiprobable states ($m \in \{1..10\} \times 2$ envelope choices).
  Gain occurs when we swap and hold $m$ (gain $m$). Since $m \le 10$ always, we always swap when holding $m$. Total gain sum = $\sum_{m=1}^{10} m = 55$.
  Loss occurs when we swap and hold $2m$ (loss $m$). We only swap if $2m \le 10 \implies m \le 5$. Total loss sum = $\sum_{m=1}^{5} m = 15$.
  Net sum = $55 - 15 = 40$. Expected gain = $40 / 20 = \mathbf{2}$.

  (iii) **Reconciliation:** The ex ante symmetry argument applies to *unconditional* swapping (swapping before opening), where the expected gain is indeed zero. The positive gain here arises from *conditional* swapping. Observing $x \le 10$ provides information: it increases the probability that you hold the smaller amount relative to the case where $x > 10$. You exploit this information to swap only when the odds favor you, avoiding the losses associated with high values of $x$.

  **(c)** If $E[\text{other}] = 1.25x$ held for all $x$, then after swapping, the new amount $x'$ would also satisfy $E[\text{original}] = 1.25x'$. You would rationally swap back. With a fee $\epsilon$, you would pay to swap, then pay to swap back, repeating indefinitely. Since the total money in the envelopes is fixed, this guarantees a sure loss. This contradiction proves the naive expectation $1.25x$ cannot hold globally; the expectation must depend on $x$ such that gains and losses balance ex ante.

  ***

  **Marking Scheme (Total 25 Marks)**

  **Part (a) [5 Marks]**
  *   **1 mark:** Correctly states the calculation $0.5(2x) + 0.5(x/2) = 1.25x$.
  *   **2 marks:** Identifies the assumption: $P(x=m | x) = P(x=2m | x) = 0.5$ (or equivalent phrasing about the 50/50 chance).
  *   **2 marks:** Explains the flaw: This requires an improper/prior-independent distribution; in reality, posterior probabilities depend on the prior distribution of $m$ (specifically, high $x$ makes $x=2m$ more likely).
      *   *Common Pitfall:* Students claim the math $1.25x$ is wrong arithmetic, rather than the probabilities being wrong.

  **Part (b) [15 Marks]**
  *   **(i) Policy [5 marks]:**
      *   **2 marks:** Identifies that if $x > 10$, $x$ must be the larger envelope ($2m$).
      *   **2 marks:** Concludes Keep if $x > 10$, Swap if $x \le 10$.
      *   **1 mark:** Brief justification for $x \le 10$ (e.g., odd $x$ implies $m$, even $x$ implies 50/50, both favor swap).
      *   *Common Pitfall:* Suggesting swapping always, or missing the $x > 10$ cutoff.
  *   **(ii) Calculation [6 marks]:**
      *   **2 marks:** Correctly identifies total states (20) or denominator for expectation.
      *   **2 marks:** Correct sum of gains when holding $m$ ($\sum_{1}^{10} m = 55$).
      *   **2 marks:** Correct sum of losses when holding $2m$ ($\sum_{1}^{5} m = 15$) and final answer (2).
      *   *Common Pitfall:* Calculating expected value of the strategy rather than the *gain* over baseline; arithmetic errors in summation.
  *   **(iii) Reconciliation [4 marks]:**
      *   **2 marks:** Distinguishes between unconditional swapping (0 gain) and conditional swapping (positive gain).
      *   **2 marks:** Explains that observing $x$ breaks the symmetry (information value).
      *   *Common Pitfall:* Claiming the symmetry argument is wrong, rather than inapplicable to the conditional strategy.

  **Part (c) [5 Marks]**
  *   **2 marks:** Describes the money pump: Swap, then swap back repeatedly.
  *   **2 marks:** Notes that with fee $\epsilon$, this leads to infinite/accumulating loss despite fixed envelope contents.
  *   **1 mark:** Concludes that the naive expectation $1.25x$ must be false/inconsistent.
      *   *Common Pitfall:* Focusing on risk aversion rather than the logical contradiction of expectations.

  **General Constraints Check:**
  *   **Time:** Arithmetic involves summing 1-10 and 1-5. Doable without calculator.
  *   **Memorization:** Requires applying theory to specific numbers, preventing rote "improper prior" answers.
  *   **Scope:** Stays strictly on decision/expectation, avoids "to open or not to open."
