prompt: |-
  My two housemates got into it at dinner and now they want a ruling from me, and I honestly can't give one.

  It started because Maya's in a psych seminar and read about that old study where seminary students who were running late to go give a talk about the Good Samaritan mostly walked right past a guy slumped in a doorway, while the ones who weren't rushed stopped to help. She says that's it, character is basically a myth. And same with the cheating experiments — when people think nobody can tell, the ones who score high on honesty questionnaires cheat about as much as anybody else, but stick even a small chance of getting caught in the room and the "honest" ones clean up their act. So what we call honesty is just whatever the situation pulls out of you. If people don't have traits that hold up across different situations, then virtue ethics is describing a kind of person that doesn't exist.

  Dev said that's not what those studies show. First, they measure one behavior on one afternoon. Traits are supposed to predict behavior in aggregate, across alot of occasions, not in any single case — nobody should expect the correlation with any one action to be high, and if you add up enough occasions the signal is there. Second, even granting the studies, virtue ethics isn't a predictive psych theory. It's a claim about what makes a person good, not about how often people manage it. The only empirical thing it needs is that virtue is possible, not that it's common, and these studies don't touch possibility. Aristotle already thought virtue was rare and took years of habituation and a decent upbringing to get — tired people failing isn't a refutation of him, it's his whole point.

  Maya said that's a dodge. If "virtue is possible" just means "somewhere some hypothetical person could pull it off," then any standard passes, including ones no human could ever meet, and "ought implies can" stops doing any work at all. And she said Dev's aggregation point actually hands her the argument: if honesty is defined as "what you do on average over many occasions," then it's a description of your behavior, not an explanation of it. Any pattern, even a random one, can be called a disposition after the fact, so the trait isn't explaining anything.

  Dev came back with a few things. He said virtue isn't only about what you do when a situation is dumped on you, it's also about which situations you put yourself in — the honest person avoids setups where they'd be tempted, keeps their promises in front of witnesses, and so on. So someone can have a real disposition that mostly shows up in the situations they steer toward, and the lab studies deliberately strip that out. He also said the situationist data is better read as "traits only switch on in weak situations" — in strong situations everyone acts the same, which is why the studies come out the way they do. That's a claim about situational strength, not about traits not existing. And his last point was that all these experiments record behavior and never reasons, but virtue is about acting for the right reasons, so a single behavior can't even bear on whether someone's honest.

  Maya said all three of those make the theory unfalsifiable. "Weak situation" is just a label for "situations where the trait showed up," so it's circular, and the reasons point means virtue ethicists can wave off any evidence whatsoever.

  Please go through it move by move — Maya's opening, Dev's first reply, Maya's comeback, Dev's second round, and Maya's last jab — and tell me who's right on each one, not just who wins overall. I want to know which specific claims actually survive, where they're talking past each other, and what both of them are missing. Don't give me a general essay about virtue ethics, I want the argument adjudicated as it was actually made.
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Task:** Adjudicate a specific debate between two housemates (Maya and Dev) about situationism vs. virtue ethics.
      *   **Format:** Go move-by-move (Maya 1, Dev 1, Maya 2, Dev 2, Maya 3).
      *   **Goal:** Determine who is right on specific claims, identify talking-past-each-other moments, and highlight missing elements.
      *   **Constraint:** Do *not* write a general essay on virtue ethics. Focus strictly on the arguments presented.
      *   **Tone:** Impartial, analytical, philosophical but accessible (like a mediator/referee).

  2.  **Deconstruct the Arguments:**

      *   **Maya's Opening (The Situationist Attack):**
          *   *Claim 1:* Cites Darley & Batson (Good Samaritan) and cheating experiments (e.g., Hartshorne & May or similar).
          *   *Claim 2:* Conclusion: Character is a myth. Behavior is determined by situation.
          *   *Claim 3:* Implication: Virtue ethics describes a non-existent person (global traits don't exist).
          *   *Strength:* Empirical data is real. Cross-situational consistency is lower than folk psychology expects.
          *   *Weakness:* Infers metaphysical impossibility from statistical variance. Conflates "global robust traits" with "any trait."

      *   **Dev's First Reply (The Aggregation & Normative Defense):**
          *   *Claim 1:* Traits predict aggregate behavior, not single instances (statistical defense).
          *   *Claim 2:* Virtue ethics is normative (what makes one good), not predictive psychology.
          *   *Claim 3:* Virtue only needs to be *possible*, not common (Aristotle's rarity point).
          *   *Strength:* Corrects the statistical misunderstanding of traits. Distinguishes "is" from "ought."
          *   *Weakness:* Might be retreating to a definition of virtue that is too insulated from empirical reality.

      *   **Maya's Comeback (The "Ought Implies Can" & Circularity Attack):**
          *   *Claim 1:* If virtue is just "possible somewhere," the standard is vacuous ("ought implies can" fails).
          *   *Claim 2:* Aggregation makes traits descriptive labels, not explanatory mechanisms (circularity).
          *   *Strength:* Hits on the philosophical risk of making virtue ethics unfalsifiable. Points out the "nominal fallacy" (naming a pattern doesn't explain it).
          *   *Weakness:* Might be demanding too much explanatory power from traits (traits *do* explain probabilistically).

      *   **Dev's Second Round (The Selection & Reasons Defense):**
          *   *Claim 1:* Virtue involves situation selection (avoiding temptation), not just reaction.
          *   *Claim 2:* Traits show in "weak situations"; "strong situations" override everyone (Situational Strength Theory).
          *   *Claim 3:* Virtue requires acting for the *right reasons*, not just right behavior (internal state).
          *   *Strength:* Accurate to Aristotelian ethics (phronesis, habituation). Aligns with modern interactionist psychology.
          *   *Weakness:* Makes empirical verification harder (reasons are hidden).

      *   **Maya's Last Jab (The Unfalsifiability Charge):**
          *   *Claim 1:* "Weak situation" is circular (defined by the trait appearing).
          *   *Claim 2:* The "reasons" point allows waving off *any* evidence.
          *   *Strength:* Valid methodological critique. If every counter-example is explained away, the theory is dead.
          *   *Weakness:* Overstates the case. "Reasons" can be investigated (interviews, process tracing), not just waved away.

  3.  **Evaluate Move-by-Move (Drafting the Adjudication):**

      *   *Maya 1:* She's right about the data, wrong about the metaphysical conclusion. The studies show *global* consistency is low, not that *local* consistency is zero. She commits the "perfect is the enemy of the good" fallacy regarding traits.
      *   *Dev 1:* Right on aggregation (psychometric truth). Right on normative vs. descriptive (philosophical truth). Right on rarity (Aristotelian truth). He wins this round technically.
      *   *Maya 2:* Right on the risk of vacuity. If "possible" means "one angel did it once," it's useless. Right on the nominal fallacy (aggregation describes, doesn't always explain). This is a strong philosophical pushback.
      *   *Dev 2:* Right on situation selection (this is a huge part of virtue often ignored in labs). Right on "reasons" (Kant/Aristotle agree action isn't virtue without motive). The "weak situation" point is scientifically grounded (Mischel), but risky.
      *   *Maya 3:* Strong methodological point. If "weak situation" is defined post-hoc, it's tautological. However, she's too harsh on the "reasons" point; psychology *can* study reasons.

  4.  **Identify Talking Past Each Other:**
      *   **Definition of "Trait":** Maya means "Global, Robust, Cross-Situational Consistency." Dev means "Probabilistic, Aggregate, Interactionist Disposition." They are using the same word for different statistical thresholds.
      *   **Project:** Maya is doing Descriptive Psychology (how do people behave?). Dev is doing Normative Ethics (how *should* people behave / what constitutes flourishing?).
      *   **Evidence:** Maya looks at single behaviors. Dev looks at life patterns and internal states.

  5.  **Identify What's Missing:**
      *   **Interactionism:** Both lean slightly dualistic (Situation vs. Person). Modern psych says it's Person x Situation.
      *   **Development:** Dev mentions habituation, but neither discusses *neuroplasticity* or how traits are built over time (which addresses Maya's "myth" claim).
      *   **The "Middle Ground":** Social-Cognitive Personality Systems (CAPS).

  6.  **Refine the Verdict:**
      *   Avoid declaring a "winner." Focus on validity of claims.
      *   Ensure the tone is fair to both.
      *   Check against constraints: No general essays. Stick to the moves.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Check:* Did I explain *why* Maya's aggregation point is partially right? Yes, the nominal fallacy is real.
      *   *Check:* Did I explain *why* Dev's "reasons" point isn't just a dodge? Yes, because ethics cares about intent.
      *   *Check:* Is the "Weak Situation" circularity addressed? Yes, it's a known risk in situationist critiques.
      *   *Correction:* Make sure not to get too bogged down in naming specific studies (Darley/Batson is implied) but focus on the logic.
      *   *Correction:* Ensure I explicitly state where they talk past each other.

  8.  **Final Output Structure:**
      *   Introduction (Setting the stage).
      *   Round 1 (Maya's Opening).
      *   Round 2 (Dev's Reply).
      *   Round 3 (Maya's Comeback).
      *   Round 4 (Dev's Second Round).
      *   Round 5 (Maya's Last Jab).
      *   Summary of Talking Past Each Other.
      *   Summary of Missing Elements.
      *   Final Ruling.

  (Proceed to generate response based on this thought process.)
answer: |-
  Here is the adjudication of the argument, move by move.

  ### Round 1: Maya's Opening
  **The Claim:** Empirical studies (Good Samaritan, cheating experiments) show behavior varies wildly based on situational factors (time pressure, anonymity). Therefore, cross-situational character traits are a myth, and virtue ethics describes a non-existent person.

  **The Ruling:** **Maya is right about the data, but wrong about the conclusion.**
  *   **Where she's right:** The studies she cites (Darley & Batson; Hartshorne & May) are real and replicable. They successfully demonstrate that "global" consistency—the idea that an honest person is honest in *every* context—is statistically weak. Folk psychology overestimates how much character drives behavior in isolated instances.
  *   **Where she's wrong:** She commits a logical leap from "traits are not perfectly robust" to "traits are a myth." Showing that consistency is lower than expected (e.g., a correlation of .30 instead of .80) does not prove consistency is zero. To say character is a *myth* requires proving situational factors account for 100% of the variance, which they do not.
  *   **The Miss:** She conflates *descriptive psychology* (how people do act) with *normative ethics* (what constitutes a good person). Even if no one currently possesses perfect virtue, that doesn't mean the concept is incoherent, only that it is unrealized.

  ### Round 2: Dev's First Reply
  **The Claim:** Traits predict aggregate behavior, not single instances. Virtue ethics is normative (about what makes one good), not predictive. Virtue only needs to be *possible*, not common (Aristotle's rarity point).

  **The Ruling:** **Dev wins this round technically.**
  *   **Where he's right:** He correctly identifies the psychometric standard. Personality psychology has long accepted that traits predict behavior over time and across populations, not in single snapshots. A correlation of .30 is considered meaningful in psychology, even if it feels low to a layperson. He is also philosophically precise: Virtue ethics is primarily a theory of *eudaimonia* (flourishing), not a behavioral prediction engine.
  *   **Where he's vulnerable:** His defense relies on shifting the goalposts of what "virtue" means. If virtue is so rare it's almost non-existent, its utility as a guide for living diminishes.
  *   **The Miss:** He doesn't yet address *why* the situational variance is so high. He defends the *concept* of traits but hasn't explained the mechanism that survives the situational pressure.

  ### Round 3: Maya's Comeback
  **The Claim:** If virtue is just "possible somewhere," the standard is vacuous ("ought implies can" fails). Defining honesty as "average behavior" makes traits descriptive labels, not explanatory mechanisms (the nominal fallacy).

  **The Ruling:** **Maya lands a significant philosophical hit here.**
  *   **Where she's right:** She identifies a genuine risk in Dev's defense: **Vacuity.** If a theory explains away all counter-evidence by saying "true virtue is rare" or "that wasn't the right aggregate," it becomes unfalsifiable. Her point about aggregation is also sharp: saying "he is honest because he acted honestly 60% of the time" describes a pattern but doesn't necessarily explain *what caused* the pattern. It risks circularity (Why did he do X? Because he's honest. How do you know he's honest? He did X).
  *   **Where she's wrong:** She overstates the case on "ought implies can." A standard can be demanding without being impossible. That most people fail to run a 4-minute mile doesn't make the concept of running a 4-minute mile vacuous.
  *   **The Miss:** She assumes that for a trait to be real, it must be the *sole* explanatory factor. Modern science accepts probabilistic causation (smoking causes cancer, even if not every smoker gets it).

  ### Round 4: Dev's Second Round
  **The Claim:** Virtue involves situation selection (avoiding temptation), not just reaction. Traits show in "weak situations" (where norms are unclear); "strong situations" override everyone. Virtue requires acting for the *right reasons*, not just right behavior.

  **The Ruling:** **Dev strengthens his position significantly.**
  *   **Where he's right:** This is the strongest defense available.
      1.  **Situation Selection:** Aristotelian virtue *does* include practical wisdom (*phronesis*), which involves structuring your life to support virtue. The lab studies strip this away, creating an artificial environment that doesn't test real-world character.
      2.  **Situational Strength:** This is a valid psychological concept. In high-pressure "strong" situations (e.g., a gun to your head), almost everyone behaves the same. Traits only differentiate people in "weak" situations.
      3.  **Reasons:** He is correct that virtue ethics cares about motivation. Helping someone to look good is not the same as helping someone out of compassion. Behavioral experiments cannot measure motive, so they cannot fully test virtue.
  *   **Where he's vulnerable:** He is making empirical verification very difficult. If virtue is internal (reasons) and strategic (situation selection), it becomes hard to observe from the outside.
  *   **The Miss:** He leans heavily on the "right reasons" defense, which risks insulating the theory from any external critique.

  ### Round 5: Maya's Last Jab
  **The Claim:** "Weak situation" is a circular label (defined by the trait showing up). The "reasons" point allows virtue ethicists to wave off any evidence.

  **The Ruling:** **Maya is methodologically correct, but philosophically too harsh.**
  *   **Where she's right:** She correctly identifies the **Tautology Risk.** If "weak situation" is defined *post-hoc* as "any situation where the virtuous person acted virtuously," then the theory explains nothing. It becomes a "No True Scotsman" fallacy.
  *   **Where she's wrong:** She claims the "reasons" point allows *any* evidence to be waved off. This is false. Psychology has methods to probe reasons (interviews, process-tracing, neuroimaging). It makes testing harder, not impossible.
  *   **The Miss:** She treats the difficulty of measurement as proof of non-existence. Just because internal states are hard to measure in a lab doesn't mean they aren't real.

  ---

  ### Where They Are Talking Past Each Other

  **1. The Definition of "Trait"**
  *   **Maya** is using a **Global Consistency** definition: A trait must predict behavior across *all* diverse situations with high reliability.
  *   **Dev** is using an **Interactionist** definition: A trait is a probabilistic disposition that interacts with the environment and includes cognitive strategies (like situation selection).
  *   **Verdict:** Dev's definition aligns better with modern personality psychology; Maya's definition aligns with a "folk psychology" strawman that few psychologists actually hold.

  **2. The Project**
  *   **Maya** is doing **Descriptive Science:** She is asking, "What is the causal mechanism of human behavior?"
  *   **Dev** is doing **Normative Philosophy:** He is asking, "What constitutes a flourishing life and how do we evaluate it?"
  *   **Verdict:** Maya is trying to use empirical data to solve a normative problem. Dev is trying to use normative definitions to shield against empirical data. Both are partially category-errors.

  **3. The Unit of Analysis**
  *   **Maya** looks at **Single Actions:** Did the student stop? Did the subject cheat?
  *   **Dev** looks at **Life Patterns:** How does the person structure their life? What are their reasons over time?
  *   **Verdict:** Dev is right that virtue is a life-long project, not a single data point. Maya is right that if the life-long project never manifests in single data points, the "virtue" is invisible.

  ---

  ### What Both Are Missing

  **1. Social-Cognitive Personality Systems (CAPS)**
  Neither mentions the modern synthesis. Current psychology suggests personality isn't a fixed "thing" but a network of cognitive-affective units. You aren't "honest"; you have a specific set of encodings and goals that *usually* produce honesty. This validates Maya (behavior varies) and Dev (there is a stable underlying system), bridging the gap.

  **2. Neuroplasticity and Habituation**
  Dev mentions habituation, but neither discusses the *mechanism*. Virtue ethics claims character is built. If the brain physically changes through repetition, then "character" is real but *constructed*, not innate. Maya treats character as something you either have or don't; Dev treats it as rare. Both miss that it is *developed*.

  **3. The Definition of "Strong Situations"**
  Maya calls the lab scenarios "real life." Dev calls them "strong situations." The missing piece is ecological validity. A lab experiment where you are told to cheat is a "strong situation" (high pressure, artificial). Real life is often a "weak situation" (ambiguous, low pressure). The studies might actually prove Dev's point: traits disappear when the situation forces a specific behavior, but traits rule when the situation is ambiguous.

  ### Final Adjudication

  **Who is more right?**
  **Dev** wins on the philosophy and the psychology of traits. He correctly identifies that traits are aggregate, probabilistic, and involve situation selection. He is also correct that virtue ethics is normative, not predictive.

  **Maya** wins on the methodology. She correctly identifies that if Dev is not careful, his definitions make virtue ethics unfalsifiable. Her critique of the "weak situation" label is a serious warning that needs to be heeded to keep the theory scientific.

  **The Verdict:**
  Maya has proven that **Global Robust Traits** (the idea that you are honest everywhere, always) do not exist.
  Dev has proven that **Local Probabilistic Dispositions** (the idea that you have stable tendencies that interact with context) do exist.

  Virtue ethics survives, but it must be updated. It cannot claim that a virtuous person will *always* do the right thing regardless of context (Maya refuted that). It must claim that a virtuous person is *more likely* to do the right thing over time, and actively structures their life to make that easier (Dev's defense). Maya is right that the old, rigid version of character is a myth. Dev is right that the updated, nuanced version is real.
