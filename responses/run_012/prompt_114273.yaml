      *   *Underlying Assumption 1 (Taxonomic Essentialism):* Moral status is tied to phylogeny (backbone = moral patient).
      *   *Underlying Assumption 2 (Cognitive Threshold):* Suffering requires a specific type of nervous system (centralized brain vs. ganglia).
      *   *Underlying Assumption 3 (Epistemic Convenience):* We assume they don't feel pain because it's hard to prove they do, and assuming they don't is cheaper/easier.
      *   *Underlying Assumption 4 (Nociception vs. Pain):* Shrimp have nociception (reflexive withdrawal) but not pain (subjective experience). Fish have both.

  3.  **Analyze the Presuppositions (The "What View" Question):**
      *   *Sentience/Consciousness:* The practice presupposes a "Cartesian Beast" model for invertebrates. They are automata. They react to damage but don't *mind* the damage.
      *   *Moral Threshold:* It commits to the idea that the *structure* of the nervous system matters more than the *function* (behavioral output). It suggests a "hard line" exists at the vertebrate/invertebrate boundary.
      *   *Heuristic vs. Principle:* It acts like a principle but functions as a heuristic. Why? Because cephalopods (invertebrates) are gaining protection in some jurisdictions (UK, EU), showing the line *can* move. This suggests the vertebrate line is largely tractability (we understand fish brains better) and economic convenience (shrimp are cheap protein).
      *   *Nociception vs. Pain:* Yes, it relies on this. It assumes shrimp lack the neural integration for "suffering." Is it defensible? Scientifically, increasingly shaky. Ethically, it's convenient.

  4.  **Distinguish "Strictly Needs" vs. "Fits Comfortably":**
      *   *Strictly Needs:* The practice *needs* the assumption that shrimp suffering is either non-existent or morally negligible compared to human convenience/cost. It *needs* the epistemic claim that we cannot know if they suffer (agnosticism used as permission).
