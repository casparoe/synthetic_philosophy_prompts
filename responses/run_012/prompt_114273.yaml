          *   *Phylogenetic Rarity:* The idea that vertebrates are special. (Fits, but morally arbitrary).

  5.  **Scenario Planning: Swapping the View:**
      *   *New View:* Precautionary Principle (if there's a chance, protect them) OR Functional View (avoidance learning = moral status).
      *   *Impact on Commercial Farms:*
          *   Killing: Electrical stunning (already exists for some crustaceans but rare), rapid thermal shock (freezing isn't enough, needs instant), chemical anesthesia.
          *   Husbandry: Stocking density limits, enrichment (hiding spots), water quality monitoring similar to fish.
