answer: |-
  ### METAPHYSICS FINAL EXAMINATION
  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  **Question 1**

  State the Principle of Identity of Indiscernibles (PII) in a formulation that is neither trivially true nor obviously false. Explain why the inclusion or exclusion of properties like "being identical to object $a$" determines this distinction. 

  Max Black's counterexample of two symmetric spheres is often taken to refute PII. Analyze where the modal force of this thought experiment lies: does the mere conceivability of the description guarantee its metaphysical possibility? 

  Now consider a variant: At $t_1$, a world contains two qualitatively identical iron spheres. At $t_2$, the world's qualitative description is exactly the same, except the labels attached to the spheres in our description are swapped. There is no absolute space, no other matter, and no qualitative change. Is there a fact of the matter about whether the spheres swapped places or remained stationary? Explain what your answer commits you to regarding Haecceitism and PII. 

  Finally, suppose a classmate objects to your analysis of the swap: "But at $t_2$, one sphere is identical to the sphere at $t_1$ labeled 'A' and the other isn't, so they are discernible after all." How do you respond?

  ***

  ### MODEL ANSWER

  The Principle of Identity of Indiscernibles (PII) states that necessarily, for any objects $x$ and $y$, if $x$ and $y$ share all properties, then $x$ is identical to $y$. To avoid triviality, we must restrict the quantifier over properties. If we include impure properties (e.g., "being identical to $a$"), PII is trivially true: $a$ has the property "being identical to $a$" while $b$ lacks it, so distinct objects are never indiscernible. To make PII a substantive metaphysical claim, we must restrict it to *qualitative* properties (intrinsic or general relational properties). However, this restriction renders PII contingent and debatable, as it excludes the very features (haecceities) that might individuate objects without qualitative difference.

  Black's two spheres universe challenges this restricted PII. He describes a symmetric universe containing only two iron spheres, one mile apart, sharing all qualitative properties. If this world is metaphysically possible, PII is false. However, the modal force relies on the assumption that a consistent linguistic description entails metaphysical possibility. A Leibnizian might argue the description is incoherent: without a qualitative ground for distinction, there cannot be *two* objects. Thus, Black's counterexample succeeds only if one accepts that conceivability implies possibility and that numerical diversity does not require qualitative grounding.

  The temporal variant sharpens this issue. If at $t_2$ the qualitative description is identical to $t_1$ save for swapped labels, there is **no fact of the matter** regarding whether the spheres swapped. Since there is no qualitative change, no physical measurement could distinguish "swap" from "stay." To claim there *is* a fact of the matter is to endorse **Haecceitism**: the view that objects possess primitive "thisness" (haecceities) independent of their qualities. Haecceitism entails the falsity of PII (restricted to qualitative properties), as it allows distinct worlds (or temporal stages) to differ solely in which haecceity occupies which qualitative role. Conversely, denying a fact of the matter preserves PII but treats the labels as merely referential tools, not ontological hooks.

  Regarding the objection: "One sphere is identical to $t_1$-sphere A, so they are discernible." This objection fails because it smuggles impure properties back into the evaluation. "Being identical to $t_1$-sphere A" is not a qualitative property; it presupposes the individuation of $A$ across time. If Haecceitism is false, there is no trans-temporal identity fact beyond qualitative continuity. If Haecceitism is true, the objection is circular: it uses the primitive identity it seeks to prove to refute the principle denying it. To use identity-properties to save discernibility renders PII trivial, which we already excluded to make the principle substantive. Therefore, the objection collapses the distinction between trivial and substantive PII.

  In conclusion, the swap scenario reveals that accepting Black's spheres or trans-temporal haecceitistic swaps commits one to the view that numerical distinctness exceeds qualitative description. Rejecting this commits one to PII and the view that such swaps are merely verbal, not real.

  ***

  ### MARKING SCHEME (25 Marks)

  **1. Formulation of PII & The Impure Property Trap (5 marks)**
  *   **Must Hit:** Student must explicitly distinguish between *qualitative* (general/intrinsic) and *impure* (haecceitic/identity-involving) properties. They must state that including impure properties makes PII trivially true, while excluding them makes it substantive but vulnerable.
  *   **Common Mistake:** Defining PII simply as "no two things share all properties" without qualifying *which* properties, or failing to explain *why* "being identical to $a$" makes it trivial.

  **2. Modal Force of Black's Argument (4 marks)**
  *   **Must Hit:** Student must identify that Black's argument relies on the move from *conceivability* (consistent description) to *metaphysical possibility*. They should note that a Leibnizian can block this by denying the coherence of the description itself.
  *   **Common Mistake:** Treating Black's example as an empirical claim or assuming the description automatically guarantees possibility without philosophical defense.

  **3. The Swap Scenario: Fact of the Matter (5 marks)**
  *   **Must Hit:** Student must take a definite line on the $t_1/t_2$ swap. Either: (a) No fact of the matter (Anti-Haecceitist/PII friendly) or (b) Yes, there is a fact (Haecceitist/PII false). Indecision loses marks.
  *   **Common Mistake:** Treating the swap as physically impossible due to inertia/motion (missing the point that it's a metaphysical puzzle about identity, not physics).

  **4. Commitment to Haecceitism (5 marks)**
  *   **Must Hit:** Student must explicitly link their answer on the swap to Haecceitism. Affirming a fact of the matter = Haecceitism (and rejection of qualitative PII). Denying it = Anti-Haecceitism.
  *   **Common Mistake:** Discussing the swap without using the term "Haecceitism" or failing to see that the swap is a diachronic version of Black's synchronic problem.

  **5. Handling the "Identity Property" Objection (4 marks)**
  *   **Must Hit:** Student must reject the classmate's objection by reiterating that "being identical to A" is an impure property. Using it to discern the spheres begs the question or renders PII trivial, violating the initial formulation constraints.
  *   **Common Mistake:** Accepting the objection and conceding that PII is saved by identity properties (showing they didn't understand the formulation constraint in part 1).

  **6. Structure and Clarity (2 marks)**
  *   **Must Hit:** Argument flows logically from formulation to Black to Swap to Objection.
  *   **Common Mistake:** Disorganized essay that addresses the prompt parts out of order or conflates the Black scenario with the Swap scenario.

  **Grade Boundaries:**
  *   **A (20-25):** Hits all 5 content moves precisely. Clearly distinguishes trivial vs. substantive PII. Definite stance on Haecceitism.
  *   **B (15-19):** Explains Black well but flounders on the Swap (vague on facts of the matter) or misses the link between impure properties and triviality.
  *   **C (10-14):** Recites Black's spheres accurately but fails to analyze the modal force or the specific variant scenario.
  *   **D/F (<10):** Fundamental misunderstanding of PII or inability to complete the prompt.
