  4.  **Refining the Content (Self-Correction/Nuance Check):**

      *   *Correction on KK:* Did Fitch use KK? No. The standard derivation is: Assume $\Diamond K(p \land \neg Kp)$. In a world where this is known, $K(p \land \neg Kp)$. By distribution, $Kp \land K\neg Kp$. By factivity on the second conjunct, $\neg Kp$. Contradiction ($Kp \land \neg Kp$). No KK needed.
