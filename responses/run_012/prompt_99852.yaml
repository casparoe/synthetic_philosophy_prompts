answer: |-
  Here is the translation of Popper's falsificationism into your validation vocabulary, followed by the residue report.

  **The Translation**
  **Falsificationism:** A theory is scientific only if there exists a possible observation that would force you to reject it. In your terms: A model is valid only if there exists a conceivable held-out set where high loss triggers rejection. If no error signal could ever invalidate the claim, it's not a model; it's a tautology.

  **Demarcation:** The line between science and pseudoscience is the line between models that risk error and those that don't. Pseudoscience is like a model that fits every possible training set perfectly (zero bias, infinite variance) because it adjusts its architecture post-hoc to match any outcome. It has no generalization error because it makes no generalizations.

  **Corroboration:** Surviving a test doesn't prove the model is true; it just means it hasn't been rejected yet. High out-of-sample performance is not confirmation; it's failed falsification.

  **Ad Hoc Hypotheses:** When a model fails validation, adding features or changing hyperparameters specifically to pass that test set without new predictive power is an "ad hoc rescue." It's leakage. Proper science requires pre-registration: locking hyperparameters before seeing the test data.

  **Residue Report**

  **What Translates Cleanly:**
  *   **Overfitting = Ad Hoc Rescue:** Adjusting a theory to fit anomalies without new predictive capacity is exactly overfitting noise.
  *   **Pre-registration:** Fixing the analysis plan before data exposure prevents "p-hacking" or tuning on the test set.
  *   **Distribution Shift:** A theory falsified in one context (distribution) may hold in another, requiring robustness checks across environments.

  **What Translates with Distortion:**
  *   **Probabilistic vs. Logical:** ML is inductive and probabilistic (confidence intervals, p-values); Popper was deductive and binary. You never truly "reject" a model in ML; you update loss estimates. Popper wanted a kill shot; you get a ROC curve.
  *   **Optimization vs. Refutation:** Your job is often to find the *best* performing model (minimize loss). Popper argued you should try to *break* the model. ML seeks confirmation via validation metrics; Popper viewed confirmation as psychologically comforting but logically worthless.
  *   **Truth:** ML assumes a ground truth exists to approximate. Popper argued we never reach truth, only less falsified conjectures.

  **What Has No Counterpart:**
  *   **Metaphysics:** Some claims aren't bad models; they aren't models at all. They lack operational definitions. In ML, this is like having a loss function without input features.

  **The Verdict on "Not Falsifiable"**
  When your colleagues say "not falsifiable," do they mean "we can't score it out of sample"? Sometimes. But often, they mean the claim is **unidentifiable**.

  In ML, an unidentifiable model has infinite solutions that fit the data equally well. In policy, a non-falsifiable claim explains everything equally well. If a theory predicts both $A$ and $\neg A$ depending on unspecified latent variables, it has no loss function. It cannot be optimized, only believed.

  The real disagreement arises because your vocabulary assumes a dataset exists somewhere. Popper's point is often that no conceivable dataset could settle the claim. If your colleagues are rigorous, "not falsifiable" means "no loss function exists," not just "missing test data." If they're vague, they're using it to say "I don't like this model's priors." Your ML intuition flags the former as architecture failure and the latter as hyperparameter disagreement. Distinguishing them is your new job.
