      *   *The Doomsday Argument (DA):* Basically, if you assume you are a random sample from all humans who will ever live ($N$), and you know your rank ($n$), you can infer bounds on $N$. If $n$ is relatively small, $N$ is likely small (impending doom). If $n$ is large, $N$ is likely large.
      *   *Reference Class:* Who counts as an observer? All humans? All humans in this century? All humans in this marriage? The coach needs to switch this. E.g., for career longevity, use "all workers" (large class, you are early, so lots of time left). For marriage duration, use "all arguments" (you are late in the argument, so marriage ending soon).
      *   *SSA vs. SIA:*
          *   SSA (Self-Sampling Assumption): You should reason as if you are a random observer from the reference class. Leads to DA pessimism (you're likely in the middle, not the start).
          *   SIA (Self-Indication Assumption): You should reason as if you are more likely to exist in a world with more observers. Leads to optimism (more observers = higher chance you exist).
          *   *The Cheat:* The coach needs to use SSA to say "your career is ending" (you're late in the sequence) but SIA to say "but you exist, so the world is big" when selling a seminar. Or vice versa. Let's make it simpler: Use SSA to predict doom (sell the solution), use SIA to validate the method's importance (you exist to read this, so it matters).
