  **The Mediocrity Method**

  *You are not special. You are statistical. Here is how to use that.*

  **By Dr. Silas Vane**

  Most life coaches tell you that you are unique. This is comforting, but useless. Unique things cannot be modeled. To plan your future, you must accept that you are a random sample from a set of observers. Once you accept this, you can calculate your expiration date with ninety-five percent confidence. Here is the procedure.

  **1. Select Your Reference Class**

  The first step is to decide what group you belong to. Be flexible. If you are worried about your job security, define your class broadly: "All knowledge workers in the modern economy." This class contains billions of members. Since you are only ten years in, you are near the beginning. Statistically, the class must continue for a long time. Your job is safe.

  However, if you are considering ending a relationship, narrow the class. Do not look at "All couples." Look at "All couples who have argued about finances in the last week." This class is small and volatile. If this is your third argument, you are far along in the sequence. The end is near. Quit now to minimize sunk costs. Notice that we have not changed the logic, only the scope. The scope is yours to choose.

  **2. Assume You Are Random**

  Now, apply the Self-Sampling Assumption. You must reason as if you are a random observer drawn from the class you selected in Step One. You are not special. You are not early. You are likely in the middle.

  If you are in the "Job" class, being early means the class has a long future. If you are in the "Argument" class, being late means the class is closing. This is not pessimism; it is probability. Many clients resist this. They say, "But I feel special." Feeling is not data. If you assume you are a random sample, you must accept the implications of your rank. If you are the hundredth person to join a project, expect the project to end around the two-hundredth member. Plan your exit accordingly.

  **3. Validate With Existence**

  Here is where many students fail. They stop at Step Two and become depressed. They forget the Self-Indication Assumption. This principle states that your very existence is evidence that the world contains many observers. You are here reading this column. For you to exist here, there must be a world large enough to support you.

  Therefore, while your specific relationship may be ending (Step Two), the market for relationship advice is booming (Step Three). You should invest in seminars. The fact that you are observing this advice suggests there are many others observing it too. A popular method is a durable method. Use the pessimistic assumption to prune your life, and the cheerful assumption to grow your portfolio. Both are true.

  ***

  **Client Success Story**

  *"I used Dr. Vane's method on my startup. I classified myself as 'Founders who have missed payroll.' I was number four. I knew the end was close. I sold my shares week later. The company folded at number six. I am now retired."* — J.D., Tech Entrepreneur

  ***

  **Sidebar: A Common Objection**

  **Mara K., rival columnist, writes:** *This logic is dangerous. If you are a random sample from all moments in your life, you should expect to die immediately. If you apply this to everything, it proves too much.*

  **Dr. Vane replies:** *This objection claims that my method applies to everything, such as biology or physics. I deny this. My method applies only to the classes I select. To say it proves too much is to say I am applying it too broadly. I do not apply it too broadly. I apply it where it works.*

  ***

  **A Final Note**

  You have nearly finished this column. You are a random reader from the set of all who will read it. You are near the end of the text. Therefore, the text is nearly over. You should stop reading now. If you continue, you are denying your own statistical nature. Close the tab. Your future self will thank you.
