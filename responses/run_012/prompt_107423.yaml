answer: |-
  You have put your finger on a very specific, very common, and deeply frustrating rhetorical maneuver. You are right to distinguish this from the *theories* of vagueness (like Epistemicism or Supervaluationism). Those theories attempt to describe how language *works*; you are describing how people *wield* language.

  There is no single, canonical Latin term for this specific semantic flip-flop (like *ad hominem* or *straw man*). However, in informal logic and rhetoric, this behavior is best understood as a specific application of the **Motte-and-Bailey Doctrine**, sometimes referred to in this context as **Semantic Motte-and-Bailey** or **Epistemic Opportunism**.

  Here is a breakdown of what the thing is, why it fits your description, and where the edges lie.

  ### 1. The Name: The Semantic Motte-and-Bailey
  The **Motte-and-Bailey** fallacy (coined by philosopher Nicholas Shackel) describes a situation where someone conflates two positions: one that is desirable but hard to defend (the Bailey), and one that is less desirable but easily defensible (the Motte).

  *   **The Bailey (Offensive):** "There is a fact of the matter; this town *is* a city, and you are wrong." (This is the claim they want to win with. It carries prestige or rhetorical weight.)
  *   **The Motte (Defensive):** "City is just a vague label; there's no strict line." (This is the fallback. It is technically plausible and hard to refute because vagueness *does* exist.)

  When your friend is pushing the argument, they occupy the **Bailey** (asserting objective truth). When you push back, they retreat to the **Motte** (asserting vagueness). The "flip" you noticed is the act of retreating from the Bailey to the Motte under fire, while intending to return to the Bailey as soon as the pressure is off.

  ### 2. Why it feels distinct from "Moving the Goalposts"
  You might wonder if this is just **Moving the Goalposts**. It is related, but distinct.
  *   **Moving the Goalposts** usually involves changing the *evidence* required (e.g., "Show me one proof" $\rightarrow$ "Well, show me two proofs").
  *   **The Semantic Flip** involves changing the *ontological status* of the predicate itself. It changes the rules of reality, not just the rules of evidence.

  Because of this, some rhetoricians call this **Ontological Gerrymandering**. You are redrawing the map of what exists (facts vs. no-facts) solely to secure a boundary that benefits your argument.

  ### 3. Is there a "Principled Version"?
  You asked if there is a principled version of this, or if it is always convenient. There *is* a principled philosophical stance that looks similar but isn't fallacious: **Contextualism about Vagueness**.

  A principled Contextualist argues that the "cutoff point" for vague words shifts depending on the conversational context.
  *   **Principled:** "In a legal zoning context, there *is* a fact of the matter (population > 50k). In a casual conversation, there isn't. Since we are chatting at a bar, I shouldn't insist there's a hard line."
  *   **Unprincipled (Your Friend):** "In this conversation, I will insist there is a line to win my point. But if you challenge me, I will claim there is no line to avoid losing."

  The difference is **consistency**. The principled speaker acknowledges the shift in context. The unprincipled speaker keeps the context the same but shifts the metaphysics to suit their convenience. This is **Epistemic Opportunism**: treating the world as objective when it helps you attack, and subjective when it helps you defend.

  ### 4. The Edge Case: "It's Vague, But You're Wrong"
  You asked about the scenario where someone *always* says "there's no fact of the matter," yet still treats you as objectively wrong.
  *   *Example:* "Look, 'rich' is totally subjective, there's no line. But you are definitely wrong for calling him rich."

  This is a slightly different beast. This is **Subjective Dogmatism** (or **Intuition Bulverism**).
  They are claiming the *predicate* is vague (no public standard), but treating their *personal intuition* as the binding standard. They are essentially saying, "The law is unwritten, but I am the judge, and I have ruled against you."

  This is often more frustrating than the flip because it denies you the ability to argue. If there is no fact of the matter, there is no ground to stand on. If they claim there is no fact of the matter *and* that you are wrong, they are claiming their whim is a fact.

  ### 5. Summary Definition
  If you were to coin a term for your own use to describe the specific flip you noticed, **Metasemantic Shifting** is accurate, but **Epistemic Opportunism** captures the motive.

  However, if you want to call it out in an argument, the most recognizable label is the **Motte-and-Bailey**.

  **What it is:**
  A rhetorical maneuver where a speaker toggles between **Epistemic Realism** (there is a truth, I know it) and **Semantic Nihilism** (there is no truth, it's vague) regarding a vague predicate, selecting the stance that immunizes them from counter-argument at that specific moment.

  **What it isn't:**
  *   It isn't **Contextualism**, because the conversational context hasn't changed, only the speaker's convenience has.
  *   It isn't **Hypocrisy** in the moral sense, but it is logical hypocrisy (inconsistency in premises).
  *   It isn't the **Sorites Paradox** itself. The Sorites Paradox is the *problem* (the heap puzzle); this maneuver is the *exploit* of that problem.

  ### How to handle it
  Since you know the structure, you can block the retreat. When they flip to the Motte ("Well, it's vague anyway"), you say:

  > "You can't have it both ways. Either 'city' has a definition we can argue about, in which case show me the criteria I'm missing. Or it's purely vague and subjective, in which case you can't tell me I'm *wrong*, only that you prefer a different label. Pick one metaphysical stance and stick to it for the duration of the argument."

  This forces them to occupy the territory they've chosen, rather than sliding between the two.
