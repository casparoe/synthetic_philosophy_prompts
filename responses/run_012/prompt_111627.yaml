answer: |-
  Here is a critical reading of your draft, structured around your five questions.

  ### 1. Is the reading of Lewis fair?

  You are walking a fine line between a substantive contribution and a straw man, but you can secure the former with a slight pivot.

  Lewis explicitly distinguishes *coordination problems* (where interests coincide) from *Prisoner's Dilemmas* (where interests conflict). In *Convention*, Lewis is careful to note that conventions solve coordination problems. If your "toll norms" are situations where defection is dominant given universal conformity, Lewis would simply categorize these as non-conventional norms (specifically, norms solving collective action problems). If you claim Lewis *missed* this distinction, you are attacking a straw man.

  However, your contribution survives if you frame it as a critique of the **post-Lewisian folk taxonomy** rather than Lewis himself. In broader social philosophy and sociology, the term "convention" is often stretched to cover any stable regularity (e.g., "it's a convention to tip," even though tipping has a negative surplus in a one-off interaction). Your "conformity surplus" metric provides a rigorous way to slice the phenomena that the broader literature often lumps together.

  **Verdict:** To avoid the straw man charge, explicitly acknowledge that Lewis restricts "convention" to coordination equilibria. Your argument is then that the *category of social regularities commonly labeled as conventions* contains two distinct mechanical types (positive vs. negative surplus), and conflating them leads to errors in explaining stability and propagation. The "conformity surplus" formulation adds value by quantifying the *source* of stability (payoff structure vs. enforcement apparatus).

  ### 2. Does the distinction do real work?

  There is a risk here of collapsing into the standard distinction between **norms of convention** and **norms of cooperation** (most famously articulated by Edna Ullmann-Margaret in *The Fabric of Social Behavior*, 1984). Ullmann-Margaret distinguishes "norms of convention" (Lewisian) from "norms of cooperation" (which require sanctions to overcome free-riding).

  If "toll norms" are simply Ullmann-Margaret's "norms of cooperation," the distinction does not do *new* work, though your terminology ("conformity surplus," "maintenance rent") might offer fresh heuristic value.

  **Where it does real work:** The distinction is most potent if you emphasize the **arbitrariness** of toll norms. Standard collective action problems often have a non-arbitrary optimal outcome (e.g., "contribute to the public good"). Toll norms, like "don't raid the fridge," are often arbitrary rules imposed on a collective action problem (we could have agreed to a schedule, or a lock, or a free-for-all). If you can show that toll norms are *arbitrary solutions to cooperation problems*, you carve out a niche that standard public-goods theory overlooks. Public-goods theory focuses on the *good*; you are focusing on the *rule*.

  **Verdict:** It risks redundancy with Ullmann-Margaret and Coleman. To ensure it does real work, you must stress that toll norms are *arbitrary* regularities sustained by sanctions, whereas standard public-goods solutions are often *functional* necessities.

  ### 3. Is the arithmetic in the trilemma sound?

  The step claiming that detection probability ($p$) falls as $1/n$ is the weakest link and the most vulnerable to technical objection.

  In a fully connected network where everyone can monitor everyone, the probability that *a* defection is detected by *someone* might actually increase with $n$ (more eyes), even if the probability that *I* detect it decreases. The relevant variable for the defector is the probability of *any* sanction occurring.
  *   **The Bystander Effect:** The sociological reality is not necessarily $1/n$ mathematical probability, but a diffusion of responsibility. As $n$ grows, the likelihood that any *specific* individual bears the cost of sanctioning drops, leading to under-provision of sanctioning.
  *   **Network Topology:** In clustered networks (small worlds), $p$ does not scale with global $n$, but with local cluster size. This undermines the "maximum viable scale" claim for decentralized norms. Decentralized toll norms can exist at large scales if the population is segmented into small monitoring clusters (e.g., neighborhoods, departments).

  **Verdict:** The arithmetic is too rigid. Replace the $1/n$ claim with a claim about the **marginal cost of monitoring** or the **diffusion of sanctioning responsibility**. The trilemma holds intuitively, but the mathematical justification invites easy refutation by network theorists.

  ### 4. Are the predictions falsifiable?

  **Prediction 1 (Monitoring Costs & Centralization):**
  *   *Falsification:* The rise of decentralized "cancel culture" or community-led moderation (e.g., subreddit moderators, Twitter Community Notes). These are decentralized, strict, and operate at massive scale ($n$), seemingly violating the trilemma.
  *   *Refinement:* You need to specify that "decentralized" means *uncoordinated* peer monitoring. Organized decentralized groups (guilds, mods) function as mini-centralizers. If your prediction holds only for *atomized* populations, state that.
  *   *Counter-evidence:* Cryptocurrency communities often maintain strict toll norms (e.g., "don't sell during a dip") via decentralized social sanction at massive scale.

  **Prediction 2 (Publicity):**
  *   *Falsification:* If publicizing a toll norm triggers **internalization**, the norm becomes self-enforcing (the "guilt" payoff modifies the surplus). If publicity works *because* it signals that sanctions are active (changing $p$ or $s$ in your equation), the prediction fails.
  *   *Test:* You need to isolate cases where publicity occurs *without* a change in sanction probability. This is difficult empirically.
  *   *Refinement:* The prediction is falsifiable if you define "publicity" as "common knowledge of the rule" distinct from "common knowledge of enforcement."

  **Verdict:** Prediction 1 is currently vulnerable to the "viral sanction" phenomenon. Prediction 2 is strong but requires careful operationalization of "publicity" vs. "enforcement signaling."

  ### 5. Where is the paper most likely wrong, and how to improve it?

  **Most Likely Error:**
  The paper assumes that "negative surplus" implies a need for external sanction. It underestimates **internalization**. If a norm is internalized, the payoff of defecting includes a psychological cost (guilt/shame). If this psychological cost $> g$ (gain from defecting), the surplus becomes positive *for the agent*, effectively turning a toll norm into a convention *psychologically*, even if *structurally* it remains a PD. You mention this in passing ("internalized motivation... needs an independent account"), but this is actually the dominant way toll norms survive at scale. Ignoring it makes the trilemma look more absolute than it is.

  **Top 3 Improvements:**

  1.  **Engage Ullmann-Margaret:** You must cite *The Fabric of Social Behavior*. You need to position your "toll norms" against her "norms of cooperation." If you don't, a referee will reject the paper for ignoring the seminal text on this exact distinction. Your angle should be that she focuses on the *function* (cooperation), while you focus on the *arbitrariness* and the *economic structure of enforcement*.
  2.  **Soften the Scaling Math:** Drop the specific $1/n$ claim. Replace it with a discussion of the **cost of sanctioning**. The problem isn't just detection; it's that sanctioning is itself a public good (second-order free rider problem). This is a more robust philosophical argument than the scaling arithmetic.
  3.  **Clarify "Toll":** The term "Toll Norm" is potentially confusing. A "toll" usually implies a cost to *use* a resource. Here, you mean a cost to *maintain* the norm, or a norm that extracts a "toll" on behavior? "Extraction Norm" or "Deficit Norm" might be clearer, but if you keep "Toll," explicitly define it as "a norm that extracts a maintenance rent from the population."

  **Summary:**
  The core insight—that we conflate coordination equilibria with sanctioned equilibria in social regularities—is solid and philosophically useful. However, the paper currently presents this as a discovery about Lewis (where it is exegesis) and relies on fragile mathematical assumptions about scale. Grounding it in the existing norms/cooperation literature and focusing on the *cost of sanctioning* rather than *probability of detection* will make the argument much more robust.
