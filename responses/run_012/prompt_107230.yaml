answer: |-
  # The Symmetric Precautionary Protocol (SPP)

  You are facing the classic dilemma of the Precautionary Principle (PP): it is either a toothless tautology or a innovation-killing veto. Your panel's inconsistency stems from treating the PP as a *value* rather than a *process*. When it is a value, the Economist weighs it against cost, the Ecologist weighs it against biodiversity, and the Lawyer weighs it against liability. When it is a process, it must function as a filter that treats action and inaction symmetrically.

  The following procedure is designed to be run in a meeting room. It does not solve the philosophical problems of the PP; it operationalizes them so that the remaining disagreement is explicit rather than hidden. It forces the panel to acknowledge where they are making a judgement call versus following evidence.

  ### The Procedure

  **Step 1: Classification (Prevention vs. Precaution)**
  *   **Question:** Is the harm mechanism established by causal evidence (Prevention), or is the harm mechanism plausible but unconfirmed due to systemic complexity or novelty (Precaution)?
  *   **Sufficient Answer:** A consensus classification. If "Prevention," apply standard risk assessment and exit this protocol. If "Precaution," proceed to Step 2.
  *   **Judgement Call:** **Yes.** Distinguishing "plausible" from "specious" requires expert intuition.

  **Step 2: The Inaction Baseline (Two-Sidedness Test A)**
  *   **Question:** If we refuse this technology, what is the specific, evidence-backed harm trajectory of the status quo (inaction)?
  *   **Sufficient Answer:** A quantified or qualitatively bounded description of harm (e.g., "5% annual decline in seabird population," "continued reliance on Class II toxins"). Vague appeals to "progress" or "economic growth" are insufficient.
  *   **Judgement Call:** **No.** This is an evidence requirement. If the answer is "unknown," treat inaction harm as zero for the purpose of this comparison.

  **Step 3: The Alternative Baseline (Two-Sidedness Test B)**
  *   **Question:** Is there an existing alternative technology or method that achieves the same goal, and what are its known risks?
  *   **Sufficient Answer:** Identification of the best available alternative and its risk profile. If none exists, state "None."
  *   **Judgement Call:** **No.** This is an evidence requirement.

  **Step 4: The Uncertainty Audit**
  *   **Question:** What specific variables are unknown? Are they reducible through testing without triggering the potential harm?
  *   **Sufficient Answer:** A list of unknowns marked "Reducible without exposure" or "Requires exposure to resolve."
  *   **Judgement Call:** **No.** This is a technical assessment.

  **Step 5: The Collingridge Test (Reversibility & Malleability)**
  *   **Question:** If the technology is deployed and a harm manifests, can the deployment be halted and the effects remediated within a timeframe relevant to the harm?
  *   **Sufficient Answer:** "Yes, fully," "Yes, partially," or "No." Crucially, if the answer is "Requires exposure to resolve" (from Step 4) and the potential harm is catastrophic, the answer here defaults to "No."
  *   **Judgement Call:** **Yes.** Defining "relevant timeframe" and "catastrophic" involves value judgements about future generations and ecosystem tolerance.

  **Step 6: Burden Allocation**
  *   **Question:** Given the answers above, who bears the burden of proof for the next stage?
  *   **Sufficient Answer:** If Inaction Harm (Step 2) > Potential Tech Harm (Step 1/4), burden is on the Regulator to justify refusal. If Potential Tech Harm > Inaction Harm, burden is on the Proponent to justify approval.
  *   **Judgement Call:** **Yes.** Weighing "Inaction Harm" against "Potential Tech Harm" is the core value conflict.

  **Step 7: Value Delegation**
  *   **Question:** Does the decision rest on a trade-off between incommensurable values (e.g., economic efficiency vs. existence of a species) that this panel is not mandated to resolve?
  *   **Sufficient Answer:** "Yes" or "No."
  *   **If Yes:** The procedure stops. The matter is delegated to the political authority/public consultation with a summary of the technical deadlock.
  *   **Judgement Call:** **Yes.** Determining what is "incommensurable" is a legal/philosophical judgement.

  ### Application to Files

  **1. Gene Drive (Invasive Rodents)**
  *   **Verdict:** **Allow-with-conditions.**
  *   **Decisive Step:** Step 2 (Inaction Baseline).
  *   **Rationale:** The inaction harm (seabird extinction) is certain and catastrophic. The tech harm (ecosystem cascade) is uncertain. While Step 5 (Reversibility) is weak (drive is self-propagating), the symmetric comparison forces us to acknowledge that *inaction* is also irreversible (extinction). The burden shifts to the regulator to justify stopping a rescue attempt. Conditions must include phased containment trials.
  *   **Why you might dislike it:** It permits the release of a self-propagating GMO. If your rationalist leanings favor strict containment of uncertainty, this feels like gambling with an ecosystem. However, the procedure forces you to admit that *not* gambling guarantees the loss of the seabirds.

  **2. Novel Insecticide (Unknown Persistence)**
  *   **Verdict:** **Refuse.**
  *   **Decisive Step:** Step 5 (Collingridge Test).
  *   **Rationale:** Persistence cannot be known without environmental release (Step 4). Environmental release of a broad-spectrum agent is functionally irreversible on the regulatory timescale (Step 5). Because the harm (soil/water contamination) is potentially catastrophic and the inaction harm (crop loss or use of older pesticides) is manageable/known, the burden remains on the proponent. They cannot meet it without violating the reversibility constraint.
  *   **Why you might dislike it:** This is the **Collingridge Dilemma** in action. You cannot learn if it is safe without using it, but you cannot use it until you know if it is safe. A rationalist interested in information gain will hate this "Refuse" because it blocks the data gathering that would resolve the uncertainty. The procedure prioritizes avoiding irreversible error over gaining knowledge.

  **3. Reflective-Particle Dispersal (Outdoor Trial)**
  *   **Verdict:** **Refuse.**
  *   **Decisive Step:** Step 5 (Collingridge Test) & Step 7 (Value Delegation).
  *   **Rationale:** Even a small trial introduces particulates into a non-linear atmospheric system. Retrieval is impossible (Step 5 = No). While the physical mass is small, the *precedent* of deployment is irreversible. Furthermore, the trade-off involves regional climate manipulation vs. global warming trends, which is a political value judgement (Step 7).
  *   **Why you will not like this:** This is the verdict I predict will frustrate you most. A small trial has high information value and low immediate physical risk. A rationalist argues for the experiment to update priors. The Procedure treats the *class of action* (geoengineering) as the unit of analysis, not the *dose*. It prioritizes the normative boundary over the expected utility of the data. It feels paralytic.

  ### Limitations and Failure Modes

  This procedure cannot settle disputes where the panel fundamentally disagrees on the *magnitude* of the Inaction Harm (Step 2). If the Economist sees a recession and the Ecologist sees an apocalypse, Step 6 will deadlock.

  It will misfire when "Reversibility" is a matter of degree rather than kind. The procedure treats "No" as a hard stop in Step 5, but many technologies are partially reversible. This binary simplification is necessary for a vote but distorts reality.

  Finally, it cannot protect against "creeping normalcy." If you approve ten "Allow-with-conditions" gene drives, the eleventh becomes the new baseline, and Step 2 (Inaction Harm) shifts. The procedure has no memory; it only judges the file in front of you.

