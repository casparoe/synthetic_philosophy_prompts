  **AETERNA MUTUAL UNDERWRITING MANUAL | REV. 7.4**
  **SECTION 4: LIABILITY AND LOSS DISTRIBUTION**

  **4.1 Premium Calculation.** All policies shall be priced using the Born Weighting Standard (BWS). Premiums are proportional to the squared amplitude of the loss event's wave function component. The previously offered "Equiprobable Branch" (EBP) product line is discontinued effective immediately. Actuarial Review 2023-Alpha concluded EBP liabilities were unstable because branch counts vary with decoherence basis selection. When Claims Division subdivided "Vehicle Collision" into "Vehicle Collision + Photon Scattering," the number of branches increased by a factor of 10^40, rendering premiums insufficient. BWS remains invariant under basis refinement. Underwriters must not engage in branch counting; only amplitude integration is permitted.

  **4.2 Rationality Axiom.** Policyholders are assumed to be rational agents maximizing expected utility across the multiverse. Per Decision Theory Directive 9, any agent satisfying ordering and sure-thing principles must act as if maximizing squared-amplitude weighted utility. Deviations are classified as cognitive errors.
  *[Marginal Note, Underwriter K. Vance: This establishes what a rational agent prefers, not what the world does. We are charging the equal-weighting client with irrationality rather than demonstrating their model is false. If they prefer to bet on branch count, why is that irrational?]*

  **4.3 Self-Location and Claim Filing.** Upon filing, the claimant is presumed uncertain regarding their branch index. They must assign a uniform prior across branch descriptions and update on local evidence. This procedure reproduces BWS weights, ensuring consistency between pre-measurement pricing and post-measurement claims.
  *[Footnote 1, General Counsel J. Aris: The uniform prior is doing all the work here. This procedure presupposes a canonical description of branches, which decoherence supplies only approximately. If the basis is fuzzy, the prior is undefined.]*

  **4.4 Ontological Dilution.** Branches with lower squared amplitude possess reduced measure of existence. Claims in low-weight branches are paid pro rata to reality. A claim in a branch with weight 0.01 receives 1% of the face value. This reflects the diminished ontological density of the claimant's trajectory.
  *[Auditor Objection 12-B: Paying in proportion to a branch's reality is paying in proportion to the number the office chose at the outset. This is circular.]*

  **4.5 Solvency and Frequency.** The Company is certain to remain solvent in high-weight branches and certain to fail in low-weight branches. Expected loss is calculated across the measure, not across branches. Regarding frequency: across many claims, branches where observed frequencies depart from BWS have vanishing total weight. We rely on this typicality to guarantee long-term stability.
  *[Internal Memo: This turns on the very measure in dispute.]*

  **CUSTOMER NOTICE**
  Your coverage is comprehensive across all decoherent histories. Please note that payout amounts reflect the ontological density of your current trajectory. In the event of a low-amplitude catastrophe, your payout will be reduced accordingly, though your experience of the loss remains total.

  **APPENDIX C: REGULATORY CORRESPONDENCE**

  **From:** Bureau of Quantum Stability (BQS)
  **To:** Aeterna Mutual Underwriting
  **Re:** Solvency II Compliance
  We note your solvency section admits certain failure in some branches. Please provide the physical basis of the office's loss distribution independent of the decision-theoretic axioms used to price it.

  **From:** Aeterna Mutual Underwriting
  **To:** Bureau of Quantum Stability
  **Re:** Solvency II Compliance
  The loss distribution is derived from the unitary dynamics of the wave function. The measure is intrinsic to the Hilbert space structure.

  **From:** Bureau of Quantum Stability
  **To:** Aeterna Mutual Underwriting
  **Re:** Solvency II Compliance
  Unitary dynamics yields a set of outcomes with coefficients. It does not yield a probability distribution without an additional postulate linking coefficients to expectation. What is the physical mechanism that suppresses liability in low-weight branches if the claimant in that branch experiences total loss?

  **From:** Aeterna Mutual Underwriting
  **To:** Bureau of Quantum Stability
  **Re:** Solvency II Compliance
  We are currently reviewing the ontological status of the claimant's experience relative to the global wave function norm.

  ***

  **NOTE ON PHYSICAL AND PHILOSOPHICAL LIBERTIES**

  This piece compresses distinct objections to the Everettian derivation of probability into a single bureaucratic workflow. The "branch counting" problem (4.1) is a standard objection to naive counting measures, but some physicists argue decoherence defines a preferred basis sufficiently well for practical purposes. The decision-theoretic justification (4.2) mirrors the Deutsch-Wallace program; the dissenting note highlights the common criticism that this proves rationality constraints, not objective chance. The self-location clause (4.3) references self-locating uncertainty arguments, while the General Counsel's footnote points out the circularity of assuming a measure over branches to derive the measure. The "ontological dilution" (4.4) satirizes talk of "degrees of reality," which many Everettians reject in favor of all branches being equally real. I would defend the decision-theoretic objection as decisive: showing agents should bet a certain way does not explain why the world appears stochastic to them, which is the core of the probability problem.

  **(149 words)**
