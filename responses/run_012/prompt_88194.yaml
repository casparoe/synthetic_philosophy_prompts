answer: |-
  She will classify the Bronze Age collapse as overdetermined.

  Her underlying rule distinguishes between **structural/material forces** and **political/ideological triggers**. In her framework, events driven by deep material conditions—geography, economics, ecology, or systemic decay—are overdetermined (Rome's structural rot, Britain's coal and institutions), while events driven by human agency, specific decisions, or ideological shifts are contingent (Louis XVI's convocation of the Estates-General, Luther's theological stand). Since the Bronze Age collapse is currently argued by historians like Eric Cline as a systems failure driven by climate change, earthquakes, and trade network fragility, it fits her "structural/material" category for overdetermination.

  Two alternative rules fit her four calls equally well but diverge on this case:

  1.  **The "Civilizational Scale" Rule:** The birth or death of entire civilizations is overdetermined; regime changes or ideological shifts within a civilization are contingent.
      *   *Prediction:* **Overdetermined.** (Fits the materialist rule).
  2.  **The "Necessary Convergence" Rule:** If an event requires multiple independent factors to align simultaneously (a "perfect storm"), it is contingent; if any one of several systemic pressures would have caused the outcome, it is overdetermined.
      *   *Prediction:* **Contingent.** This rule interprets the Bronze Age collapse as a fragile convergence where, had the drought not coincided with the earthquakes or the Sea Peoples' migration, the palaces might have survived. This contrasts with Rome, where she likely views the pressures as individually sufficient.

  My best guess remains **overdetermined** because her classification of Rome is the strongest signal. Historians often debate whether Rome fell due to barbarians, economics, or plague, yet she labels it overdetermined, implying she views systemic vulnerability as the deciding factor rather than the specific trigger. She likely sees the Bronze Age palaces as already structurally compromised, making the specific combination of disasters irrelevant to the final outcome.

  To separate the surviving rules, present her with **the outbreak of World War I**.
  *   **The Case:** Argue that structural tensions (alliances, imperialism, militarism) made war inevitable (overdetermined), versus the specific chain of events following the Archduke's assassination (contingent).
  *   **The Separation:** If she calls WWI **overdetermined**, she prioritizes structural pressure (confirming the Bronze Age prediction). If she calls it **contingent**, she prioritizes specific triggers or convergence, which opens the door to reclassifying the Bronze Age collapse as contingent based on the timing of the Sea Peoples or the severity of the drought.
