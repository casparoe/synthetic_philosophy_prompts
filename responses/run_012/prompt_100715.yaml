  Ok so I'm trying to think through whether AIs or animals could be moral patients and I keep hitting the same wall. If mental states are multiply realizable -- the same experience can run on neurons or silicon or whatever -- then whether a system has experiences, and so whether it can be wronged, should come down to which computation its implementing, not what it's made of. So there ought to be a fact of the matter about which computations are the sentient ones, and our job is just to figure out which ones they are. But then I read that any physical system can be described as implementing basically any finite computation you choose, which would make every rock and thermostat sentient, wich is obviously absurd. So which computations actually matter morally, and how do we tell? Is a laptop running the right program a genuine candidate for moral status, or am I missing something about what "implementing a computation" even means here?

  End with a single line starting "Verdict:" giving your one-sentence read on whether the way I've set the question up is sound.
