  My student asked why we require five publications for a job that needs none. I told her: "If we require three, candidates with four win. If all departments agree on three, the one that demands five gets the prestige. If I tell you 'stop writing, start thinking,' you lose to the candidate whose advisor said 'write faster.'" I know this produces empty papers. I know it wastes your life. But if I opt out, I don't save you; I just sacrifice you to someone who won't. So finish chapter four. I need to lie to the committee that it's groundbreaking.

  This scenario isolates the selection mechanism that distinguishes a trap from a simple dilemma. A promise to stop would fail not because of mistrust, but because the reward structure penalizes restraint. The speaker's complicity is rational; in a system that selects for inflation, the only way to protect the student is to perpetuate the very dynamic that harms them.
