  ### Indistinguishable Leaves

  **Leaf 5 (Pedagogic Reward Modeling) and Leaf 6 (Surrogate Value Alignment)**
  *   **Why indistinguishable:** If the teacher's values perfectly align with their beliefs about the learner's values, the behavioral fit is identical.
  *   **Required Question:** "If we prove the teacher's belief about the learner was false, does the inferred reward function change?"

  ### Empty Combinations

  **1. Collective Functionalism + Procedural Rationality (Leaf 4 path + Leaf 2 path)**
  *   **Status:** *Undeveloped.*
  *   **Reason:** While logically coherent (a group following a joint heuristic), multi-agent inverse planning with rule-based constraints is computationally intractable and lacks a standard formalism.

  **2. Time-Inconsistent Utility + Deontological Realism (Leaf 1 path + Leaf 7 path)**
  *   **Status:** *Incoherent.*
  *   **Reason:** Time-inconsistency implies changing weights over time, whereas deontological constraints are typically defined as binding across time; combining them dissolves the definition of the constraint.

  **3. Revealed Preference Individualism + Idealized Constraint Theory (Leaf 3 path + Leaf 8 path)**
  *   **Status:** *Unattractive.*
  *   **Reason:** This position claims to describe only revealed actions while simultaneously appealing to counterfactual idealizations, undermining its own descriptive purity.
