answer: |-
  Friends, family, and honored guests. For those who do not know me, I am a friend of the couple, and like them, I make my living trying to make sense of the world with words. Usually, I write about science or ideas, but today I am just here to talk about love. And because I know these two better than most, I know that half of this room is ready to cry happy tears, and the other half is quietly analyzing the semantic structure of the vows. So I will try to speak to both halves at once.

  We all know that one of them wrote a dissertation on Bertrand Russell. I mention this only because I read Russell too, specifically his book on marriage from 1929. Now, Russell is not known for being warm and fuzzy. He was a man who trusted logic over sentiment. But there is a beautiful thread in his thinking that I believe belongs at this table. He argued that romantic love is one of the genuine goods of a human life. He never doubted that. What he worried about was not love itself, but the instinct to own the thing we love. He saw that what wrecks a partnership is not usually a lack of affection, but the demand that the other person stay exactly who they were on the day you met them. He saw that jealousy and possessiveness turn a home into a cage.

  I bring this up because I know the parents and families here want nothing more than to know that their children are safe. And I want to tell you that they are. They are safe because they understand something profound about commitment. They know that a promise forced by obligation is worth less than a choice made freely. The strongest marriage is not one where two people hold on so tight that they cannot move. It is one where two people grow, sometimes in different directions, and still find their way back to the same table. It is the knowledge that you are free to leave that makes the decision to stay meaningful.

  For the couple, my wish is not that you never change. I hope you change immensely. I hope you grow into people who might not have recognized each other ten years from now, and yet, every morning, you look across the bed and choose each other again. That is the real vow. Not a promise of forever, which no one can keep, but a promise of today. A promise that you will not try to own each other, but that you will witness each other. That you will protect each other's freedom as fiercely as you protect your love.

  So, if you would please raise your glasses. To the proprietary instinct, may it stay outside this door. To growth, may it be endless. And to the two of you, may you never have to ask each other to shrink so that you can fit together. May you be large enough to hold each other freely. To love, and to liberty.

  I should note for your peace of mind that I have softened Russell's edge slightly for this occasion. He was far more radical on sexual morality and the structure of marriage itself than this toast implies. I have focused entirely on his psychological insights regarding possessiveness and growth, which is a defensible reading but leans more toward the romantic than his original text might allow.
