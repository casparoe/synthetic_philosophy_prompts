      *   Underdetermined bits? Yes.
      *   Clinical changes for HOT? Yes.
      *   Clinical changes for First-Order? Yes.
      *   No citations? Yes.

  9.  **Self-Correction during drafting:** I need to make sure I don't validate the user's premise that MAC is the *only* target. MAC is for immobility. Awareness is a side effect they try to avoid with hypnotics (propofol/volatiles) and amnestics. The user says "dose they titrate to is defined by movement." This is technically true for *inhalational* agents (MAC), but in TIVA (Total Intravenous Anesthesia), they titrate to effect (BIS, clinical signs). I should clarify that distinction so the narrator sounds expert. The "movement" metric is a proxy for spinal cord suppression, not necessarily cortical awareness. This deepens the philosophical problem: they are measuring the spine to infer the mind.

      *Correction:* The user's premise is actually a known critique in the field. MAC prevents movement. It does *not* guarantee unconsciousness. This is the "awareness under anesthesia" problem. I need to validate the user's insight while adding the technical nuance that anesthesiologists *know* this distinction (Immobilization vs. Hypnosis).

      *Revised Plan:* Acknowledge the user's insight is sharp. The "movement" metric is for surgical conditions, not consciousness. Consciousness is managed by hypnotics. But because we can't measure consciousness directly, we rely on proxies (EEG, hemodynamics) and ultimately, memory. This reinforces the HOT/Access bias.

