answer: |-
  **Panbiota Genomics Support Center**
  **Topic: Species Identification & Result Interpretation**

  **1. How confident is the "Single True Species" guarantee?**
  Panbiota guarantees that every sample receives one definitive species designation based on the Panbiota Reference Taxonomy (PRT) v.4.2. Please note that "definitive" refers to internal consistency within our current database schema. While biological lineages are dynamic, our reports provide a static snapshot suitable for legal, educational, and personal identity purposes.

  **2. My result says I am a hybrid. Does this invalidate the guarantee?**
  Not necessarily. Under the Biological Species Concept, hybrids represent reproductive intersections between distinct units. However, for reporting purposes, Panbiota assigns hybrids to the maternal lineage unless nuclear DNA suggests a stable introgressed population. If your sample falls into a recognized hybrid zone, you may receive a designation such as *Canis lupus* × *familiaris*. This is treated as a distinct categorical unit for the duration of your subscription.

  **3. Why was my asexual organism assigned a species at all?**
  The Biological Species Concept relies on reproductive isolation, which does not apply to asexual taxa. In these cases, Panbiota defaults to the Phylogenetic Species Concept. We identify the smallest monophyletic group sharing a unique diagnostic trait. Please be aware that splitting criteria are adjustable; high-resolution sequencing may subdivide your organism's species into multiple new species in future updates.

  **4. My sample comes from a ring species population. Why is my neighbor a different species than me?**
  In ring species complexes, populations vary gradually across a geographic range until terminal populations meet but cannot interbreed. Panbiota assigns species status based on geographic clustering relative to the type specimen. While you and your neighbor may be able to interbreed, and your neighbor and their neighbor can interbreed, the terminal ends of the ring are classified as distinct species. Continuity is acknowledged but not reflected in the final label.

  **5. How do you determine species boundaries for bacteria?**
  Prokaryotic species are defined operationally. We utilize a standard sequence-similarity cutoff (typically 97% identity on the 16S rRNA gene) to establish Operational Taxonomic Units (OTUs). This threshold is a convention agreed upon by consortium partners to facilitate data sorting. It does not imply a natural discontinuity in microbial diversity. If your sample falls at 96.9%, it will be reported as a different species than if it falls at 97.1%.

  **6. My species name changed after your database update. Can I revert to the old one?**
  Taxonomic revision is ongoing. As phylogenetic methods improve, lineages are frequently split or lumped. Your account dashboard will reflect the current consensus nomenclature. Historical reports are archived but not editable. Panbiota is not liable for identity distress caused by taxonomic synonymy or reclassification. A species label is valid only for the fiscal quarter in which it is issued.

  **7. Another lab says my sample is a different species. Who is correct?**
  Discrepancies usually arise from the use of different species concepts. If another lab utilizes the Morphological Species Concept while Panbiota utilizes the Phylogenetic Species Concept, results will diverge. Both answers are correct within their respective theoretical frameworks. Panbiota stands by the PRT as the industry standard for commercial genomics. We do not offer refunds for metaphysical incompatibility.

  **8. Can you identify the species of a fossil sample?**
  We can sequence ancient DNA where preservation allows. However, species boundaries in deep time are arbitrary slices of continuous lineages. We assign fossils to the nearest named chronospecies. Please note that the boundary between *Homo erectus* and *Homo heidelbergensis* is a matter of expert convention, not natural fact. Your report will reflect the current prevailing convention at the time of analysis.

  **9. What if my sample exists between two recognized clusters?**
  Nature often presents continua where human classification requires binaries. In cases of ambiguous clustering, our algorithm assigns the sample to the nearest centroid. There is no "partial species" status. If your genotype lies in the morphospace between two recognized units, you will be assigned to the unit with the highest probability score. The margin of error is absorbed by the customer.

  **10. Are species real natural kinds according to Panbiota Terms of Service?**
  For the purposes of this agreement, species are treated as mind-independent natural units. This assumption is necessary for transaction processing. Panbiota acknowledges that evolutionary theory describes populations as variable, interconnected, and temporally fluid. However, invoicing requires discrete entities. By purchasing this kit, you agree that any ontological ambiguity inherent in biological classification does not constitute a defect in the product.
