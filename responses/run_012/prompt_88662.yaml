answer: |-
  This dispute is not merely verbal, nor is it purely conceptual. It is a **mixed** disagreement, driven primarily by a **substantive-normative** clash regarding the nature of justice, which is rendered intractable by the conflation of **different questions** regarding the recipients and timeframes of redress.

  ### Diagnosis

  **1. It is not a verbal dispute.**
  If this were purely verbal, clarifying definitions would dissolve the conflict. However, both sides understand what the other means. Faction A understands that Faction B wants "moral recognition," but dismisses it as "cheap talk" unless coupled with cost. Faction B understands that Faction A wants "resource transfer," but dismisses it as "hush money" unless coupled with admission. They disagree on the *value* of the acts, not the *definition* of the words. Faction A values distributive justice (equity of outcome); Faction B values recognitive justice (equity of status). This is a classic philosophical stalemate (akin to the debate between Nancy Fraser and Axel Honneth) where two valid dimensions of justice are treated as zero-sum competitors.

  **2. The conceptual question is a proxy, not the cause.**
  The question of whether a state can feel remorse is a philosophical sidebar. In political practice, state apologies are performative speech acts, not psychological reports. Faction A does not object to the metaphysics of state emotion; they object to the *efficacy* of the performance. Faction B does not believe the state has a soul; they believe the *public record* requires moral categorization. Arguing about state personhood will not resolve the dispute because both sides are using "apology" as a shorthand for a political settlement, not a phenomenological claim.

  **3. The "Different Questions" hypothesis explains the stalemate.**
  Your observations about the "sliding" are the key to why the argument recycles. The group is attempting to answer a single question ("What is the right response?") that is actually two distinct policy problems:
  *   **Question 1 (Forward-looking/Distributive):** How do we alleviate the continuing disadvantage of descendants? (Answer: Resources).
  *   **Question 2 (Backward-looking/Recognitive):** How do we establish the historical truth and moral standing of the wronged? (Answer: Acknowledgment).

  The dispute collapses back into circularity because the draft resolutions force these two questions into a single instrument. Faction A treats Question 1 as the only real question and views Question 2 as a distraction. Faction B treats Question 2 as the prerequisite for Question 1 and views a solution to Q1 without Q2 as illegitimate. The "sliding" between victims and descendants allows Faction A to argue from current need (descendants) while Faction B argues from historical debt (victims). Because the resolutions do not distinguish between *repairing the living* and *honoring the dead*, the sides talk past one another.

  ### Path to Progress

  Progress will not come from agreeing on a definition of apology, nor from solving the metaphysics of state remorse. Progress requires **institutional decoupling**.

  The working group should reformulate the task from "Choosing between Resolution 1 and 2" to "Designing separate mechanisms for distinct goals."
  1.  **Acknowledge the Normative Clash:** Explicitly record that the commission recognizes two distinct obligations: material repair and moral recognition. Acknowledge that these are not interchangeable currencies.
  2.  **Separate the Instruments:** Do not force the Payment Fund to carry the language of apology, and do not force the Apology to carry the burden of economic repair.
      *   Pass the **Apology/Monument** resolution as a standalone act of *historical record* (addressing Question 2).
      *   Pass the **Payment Fund** resolution as a standalone act of *social policy* (addressing Question 1).
  3.  **Reformulate the Question:** Drop the question "Is an apology worth it?" Replace it with: "Does this instrument address material disadvantage or historical truth?"

  If political capital forces a choice between the two, the commission must vote on which *dimension of justice* takes priority in this specific legislative session, rather than pretending one instrument can satisfy both dimensions. However, the most robust path is to refuse the false dichotomy. Faction A should be asked if they oppose historical truth; Faction B should be asked if they oppose material aid. When forced to answer those specific questions, the "insult" and "cheap talk" rhetoric loses its grip.

  ### Verdict

  Verdict: mixed -- substantive values clash obscured by conceptual slippage
