  You can project a grid on any **map**,
  Claiming the weather patterns are the **same**
  As logic gates. I hesitate, one **step**
  Away from saying mind is merely **state**.
  Is there a law, some strict causal **rule**,
  Or does the substrate have to truly **matter**?

  It seems the wetware has to truly **matter**,
  Not just the abstract nodes upon the **map**.
  But biology ignores the digital **rule**.
