  **Scenario: The Landlord's Audit**
  You are a tenant; your landlord, Bob, knows your habits well but isn't psychic (accuracy $p$). There is a 50% chance your apartment has Mold ($M$), costing you $\$1,000$ to remediate if discovered. Before you know the state, Bob predicts your policy (whether you would Pay a Fee if contacted) with accuracy $p$. He then sends a Notice ($N$) iff $(M \oplus \text{Predicted\_Pay})$. If $N$ arrives, you must choose to Pay a Fee ($F=\$100$) or Refuse. Independently, if there is No Mold ($\neg M$) *and* Bob Predicted Pay, he has already deposited a Loyalty Rebate ($R=\$500$) into your account; this rebate is yours to keep regardless of your actual choice upon receiving $N$. You only learn about the situation if $N$ arrives.

  **The Work**
  *Assumptions: $P(M)=0.5$. Bob predicts your *policy* (disposition), not your randomized act. $p = P(\text{Prediction} = \text{Policy})$.*

  *   **CDT (Causal Decision Theory):** Refuses.
      CDT treats $M$ and Bob's Prediction ($K$) as fixed past/facts. Receiving $N$ is news, but your action cannot causally affect $M$ or $K$.
      *   If $N$ arrives, you are in either $(M, K=\text{False})$ or $(\neg M, K=\text{True})$.
      *   In $(M, K=\text{False})$: You owe $\$1,000$ (Mold). Rebate = $0$. Paying costs $\$100$. Net: $-\$1,100$ (Pay) vs $-\$1,000$ (Refuse).
      *   In $(\neg M, K=\text{True})$: You owe $\$0$. Rebate = $+\$500$ (already deposited). Paying costs $\$100$. Net: $+\$400$ (Pay) vs $+\$500$ (Refuse).
      *   In both causal branches, Paying reduces utility by $\$100$. **Action: Refuse.**

  *   **EDT (Evidential Decision Theory):** Pays (if $p$ is high).
      EDT conditions on the action. Choosing Pay is strong evidence that $K=\text{True}$.
      *   If $K=\text{True}$ and $N$ arrived, then $(M \oplus \text{True})$ is True $\implies M$ is False.
      *   Paying implies No Mold (saving $\$1,000$) and Rebate eligibility (gaining $\$500$), minus the Fee ($\$100$). Net evidence value $\approx +\$1,400$.
      *   Refusing implies $K=\text{False}$. If $K=\text{False}$ and $N$ arrived, $M$ is True. Net evidence value $\approx -\$1,000$.
      *   **Action: Pay** (provided $p$ is high enough to make the correlation reliable).

  *   **FDT (Functional Decision Theory):** Pays (if $p > 0.6$).
      FDT evaluates the policy $\pi$.
      *   **Policy Pay:** $K=\text{True}$ (w.p. $p$). $N$ arrives iff $\neg M$.
          *   $\neg M$ (0.5): $N$ arrives. Pay Fee, Keep Rebate. Net: $\$400$.
          *   $M$ (0.5): $N$ absent. Audit Cost. Net: $-\$1,000$.
          *   Exp (given $K$=True): $-\$300$.
          *   If $K=\text{False}$ (w.p. $1-p$): $N$ arrives iff $M$.
          *   $M$ (0.5): $N$ arrives. Pay Fee, Audit. Net: $-\$1,100$.
          *   $\neg M$ (0.5): $N$ absent. Net: $0$.
          *   Exp (given $K$=False): $-\$550$.
          *   **Total Exp Pay:** $p(-300) + (1-p)(-550) = 250p - 550$.
      *   **Policy Refuse:** $K=\text{False}$ (w.p. $p$). $N$ arrives iff $M$.
          *   $M$ (0.5): $N$ arrives. Refuse, Audit. Net: $-\$1,000$.
          *   $\neg M$ (0.5): $N$ absent. Net: $0$.
          *   Exp (given $K$=False): $-\$500$.
          *   If $K=\text{True}$ (w.p. $1-p$): $N$ arrives iff $\neg M$.
          *   $\neg M$ (0.5): $N$ arrives. Refuse, Rebate. Net: $+\$500$.
          *   $M$ (0.5): $N$ absent. Audit. Net: $-\$1,000$.
          *   Exp (given $K$=True): $-\$250$.
          *   **Total Exp Refuse:** $p(-500) + (1-p)(-250) = -250p - 250$.
      *   **Comparison:** Pay > Refuse when $250p - 550 > -250p - 250 \implies 500p > 300 \implies p > 0.6$.
