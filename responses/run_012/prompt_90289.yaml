answer: |-
  Your friend is in the right neighborhood, but they have conflated the *premises* of Lewis's argument with the *conclusions*, and they have drawn some inferences that specialists would consider mistaken or at least highly contentious. If you use their summary verbatim, you risk signaling to experts that you haven't quite grasped the dialectic.

  Here is a claim-by-claim breakdown of what a specialist would sign off on, what would make them wince, and what is simply incorrect.

  ### 1. "Lewis proved you can't have a probability for an indicative conditional that matches the conditional probability of the consequent given the antecedent..."
  *   **Verdict:** **Mostly Fair, but needs a caveat.**
  *   **The Nuance:** Lewis proved that you cannot have this match *if* you assume the conditional expresses a proposition (a truth-evaluable content) within a standard probability space.
  *   **Expert Wince:** The statement omits the crucial condition: "assuming the conditional has truth conditions." If you don't assume it's a proposition, you *can* have the probability match (this is exactly what Adams advocated). Lewis showed the *combination* is impossible, not that the probability match itself is impossible.

  ### 2. "...try to have it both ways and you just get a contradiction..."
  *   **Verdict:** **Acceptable Shorthand.**
  *   **The Nuance:** Technically, it's not a logical contradiction in the system; it's a "triviality result." It shows that if you insist on both, the only probability distributions that survive are "trivial" (e.g., you can only be 0% or 100% certain of things, which makes belief impossible).
  *   **Expert Wince:** Purists prefer "triviality" to "contradiction," but for a general piece, "contradiction" is passable.

  ### 3. "...so indicative conditionals can't be expressing propositions at all."
  *   **Verdict:** **Wrong / Overstated.**
  *   **The Nuance:** This is the biggest error. Lewis's result presents a **dilemma**, not a verdict.
      *   **Option A:** Keep Propositions (Truth Conditions) + Reject Adams's Thesis (the probability match). (This is Lewis's own view; he favored possible-worlds semantics).
      *   **Option B:** Keep Adams's Thesis (the probability match) + Reject Propositions. (This is Adams's view; he favored an expressivist or suppositional theory).
  *   **Expert Wince:** Your friend presents Option B as the *only* outcome. Many prominent philosophers (like Robert Stalnaker or David Lewis himself) chose Option A. They argue conditionals *do* express propositions, which means our degrees of belief in them simply *don't* always follow the conditional probability rule. You cannot infer "no propositions" from Lewis's result alone; you must add a premise that "Adams's Thesis is non-negotiable."

  ### 4. "That kills Adams's thesis that our degrees of belief in conditionals are conditional probabilities..."
  *   **Verdict:** **Wrong.**
  *   **The Nuance:** As noted above, Adams's Thesis survives perfectly well provided you give up the idea that conditionals are truth-apt propositions. Adams himself was aware of Lewis's result (Lewis developed it in correspondence with Adams) and maintained his thesis precisely by denying that conditionals have truth conditions.
  *   **Expert Wince:** Saying it "kills" Adams's Thesis suggests the thesis is false. Most experts view Adams's Thesis as a robust description of *assertibility* or *credence*, even if it fails as a description of *truth*. It is only "killed" if you insist conditionals must be propositions.

  ### 5. "...and it's the final nail in the coffin for truth-functional readings of if."
  *   **Verdict:** **Confused / Incorrect.**
  *   **The Nuance:** This is the most technically problematic claim. Truth-functional accounts (like the Material Conditional, $\neg A \lor C$) *are* propositional. However, they *deny* that $P(A \to C) = P(C|A)$. For the material conditional, the probability is usually much higher than the conditional probability.
  *   **Why it's wrong:** Lewis's result only applies to theories that *try* to equate the probability of the conditional with the conditional probability. Truth-functional accounts don't try to do that, so they escape Lewis's result entirely. The "nails in the coffin" for truth-functional readings are the **Paradoxes of Material Implication** (e.g., that a false antecedent makes the conditional true), not Lewis's triviality results. In fact, Lewis's result is often seen as a problem for *possible worlds* semantics (like Stalnaker's), which try to bridge the gap between truth conditions and conditional probability.
  *   **Expert Wince:** An expert will read this and think you have confused the problems facing the Material Conditional with the problems facing the Probabilistic/Expressivist accounts.

  ### Summary of the Situation
  Your friend has taken a result that shows an incompatibility between **Semantics** (Propositions) and **Epistemology** (Conditional Probability) and presented it as a victory for Epistemology that destroys Semantics. In reality, the field is split: some sacrificed Semantics to save Epistemology (Adams), and some sacrificed Epistemology to save Semantics (Lewis/Stalnaker).

  ### The Safest Accurate Sentence
  If you want one sentence that no specialist could object to, avoid taking a side on whether they are propositions or not. Focus on the incompatibility.

  > **"Lewis's triviality results demonstrate that, within a standard probability framework, indicative conditionals cannot simultaneously be treated as truth-evaluable propositions and satisfy the rule that their probability equals the conditional probability of their consequent given their antecedent."**

  ### Why this is safer:
  1.  It specifies the constraint ("standard probability framework").
  2.  It identifies the conflict ("cannot simultaneously").
  3.  It avoids claiming one side is "dead" (propositions or Adams's thesis).
  4.  It accurately reflects the mathematical result without making metaphysical claims your friend erroneously added.

  If you use that sentence, you will sound like you understand the stakes without getting bogged down in the unresolved metaphysical debate.
