      *   *Claim 5 (Truth-Functional Readings):* Truth-functional (Material Conditional) says $A \to C$ is $\neg A \lor C$. For the material conditional, $P(A \to C) \neq P(C|A)$ generally. Lewis's result assumes $P(A \to C) = P(C|A)$. So, Lewis's result actually *protects* the truth-functional account in a way. It shows that if you want $P(C|A)$, you *can't* have truth conditions (like the material conditional). The friend says it's a "nail in the coffin" for truth-functional readings. Actually, the Paradoxes of Material Implication are the nail in that coffin. Lewis's result is a nail in the coffin of *Stalnaker's* possible worlds semantics (if combined with Adams).
