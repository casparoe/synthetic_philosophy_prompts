answer: |-
  This is a formidable argument. Your friend has distilled Bernard Williams' "integrity objection" and Michael Stocker's "one thought too many" critique into a tight, formal dilemma. It feels compelling because it arises from lived experience: the cold calculus of the transplant committee versus the hot urgency of a parent's love.

  However, the argument does prove too much. It relies on a conflation of **moral justification** (what makes an act right) with **moral deliberation** (how an agent decides in the moment), and it assumes a false dichotomy between "impartial weighing" and "moral irrelevance."

  Here is how you can locate the flaw, what it costs to fix it, and how to distinguish the parent from the committee.

  ### 1. Where to Break the Argument: Premise (2) and the Inference to (5)

  The strongest point of attack is **Premise (2)**, and consequently the dichotomy presented in **Premise (5)**.

  **Premise (2)** claims: *Any theory that would have a parent weigh her own child's need against a stranger's need... requires exactly that [treating commitments as inputs].*

  **The Rejection:** You should reject the idea that an impartial moral theory *requires the agent to perform the calculation in the moment of action.*

  Many sophisticated impartial theories (like Rule Utilitarianism or Two-Level Utilitarianism) distinguish between the **criterion of rightness** and the **decision procedure**.
  *   **Criterion:** What makes the act right is that it maximizes the good (impartial).
  *   **Procedure:** How the agent decides is by following rules or instincts (e.g., "Save your child") that generally lead to the best outcome.

  If you adopt this view, the parent does *not* weigh the stranger against the child in the burning building. She acts on love. The impartial calculation happens at the level of the moral theorist (or the legislature), who has determined that a world where parents save their own children produces more good than a world where they don't.

  **The Cost:** Rejecting (2) creates a gap between "what is morally true" and "what the agent thinks." It means morality is, in a sense, a system that sometimes requires us *not* to think about morality directly while acting. This can feel like a kind of self-deception, but it preserves integrity by allowing the agent to act from love rather than calculation.

  **Premise (4) and (5)** claim: *A theory that tells the parent to save her child without weighing... treats the stranger's need as morally irrelevant. So morality is either defective or arbitrary.*

  **The Rejection:** This is a false dichotomy. Allowing partiality does not make the stranger's need *morally irrelevant*; it makes it **overridden by a special obligation.**

  To say the stranger's need is "irrelevant" implies it counts for nothing. But in a theory of special obligations, the stranger's need counts for something, just less than the child's need *relative to the parent*. It is not arbitrary; it is grounded in the moral value of relationships.

  ### 2. If You Keep Premise (4): What Can You Say About Love?

  Suppose you agree with your friend that we should not hide the impartial justification (keeping the spirit of 4). You worry that this reduces love to a "mere preference" (Premise 7). You can avoid this by distinguishing between **preferences** and **constitutive commitments.**

  *   **Preferences** are desires I happen to have (e.g., I like vanilla ice cream). Morality can ask me to set these aside for the greater good.
  *   **Constitutive Commitments** are projects or relationships that make me *who I am* (e.g., being a parent, being a friend).

  If morality treats these commitments as "mere preferences," it attacks integrity (Williams' point). However, an impartial theory can value these commitments **instrumentally** or **intrinsically** without requiring them to be weighed in the moment.

  **What to say about the parent's love:**
  You can argue that the parent's love is not a private preference, but a **public good.** A society where parents feel the deep, non-calculating obligation to save their children is a society that flourishes. Therefore, the "impartial view" actually *mandates* that the parent *not* adopt the impartial view in that moment.

  This saves love from being a "mere preference." It elevates love to a **moral duty of relationship.** The parent saves the child not because the child is preferred, but because the *relationship* generates a moral obligation that outweighs the stranger's generic claim.

  ### 3. Distinguishing the Transplant Committee from the Parent

  This is the crux of your friend's frustration. She is applying the logic of **Distributive Justice** (the committee) to **Personal Morality** (the parent).

  **The Transplant Committee (Institutional Impartiality):**
  *   **Role:** Fiduciary. They are stewards of a public resource (organs).
  *   **Relationship:** They have no prior relationship with the patients.
  *   **Obligation:** To maximize the utility of the resource for the collective.
  *   **Logic:** If they favor one child over another based on "love" or "bias," they betray their public trust. Here, Premise (1) holds: they *must* treat lives as inputs in a calculation.

  **The Parent (Personal Partiality):**
  *   **Role:** Guardian. They are stewards of a specific life.
  *   **Relationship:** They have a thick, historical, constitutive relationship with the child.
  *   **Obligation:** To protect *this* child.
  *   **Logic:** If the parent weighs their child against a stranger, they betray the specific trust of the relationship.

  **The Distinction:**
  You can tell your friend: *"The committee is acting as the state; you are acting as a mother. The state must be impartial because it belongs to everyone. You are partial because you belong to your child."*

  This distinction avoids making the parent's love a "private preference." It makes it a **role-based obligation.** Just as the doctor has a role-based obligation to be impartial at the committee meeting, the parent has a role-based obligation to be partial at the bedside. Both are required by morality; they just operate in different spheres.

  ### 4. Summary of the Counter-Argument

  Here is how you might reconstruct the reply to her:

  1.  **Reject Premise (2):** Impartial morality does not require the *agent* to calculate in the moment. It requires the *system* to justify the rule that forbids calculation.
  2.  **Reject Premise (5):** Partiality is not arbitrary. It is grounded in the moral importance of human relationships, which cannot flourish if subjected to constant impartial weighing.
  3.  **Reject Premise (7):** A morally serious person does not have to view commitments as preferences. They can view them as **sources of obligation.**
  4.  **Distinguish the Spheres:** The transplant committee is an agent of **distributive justice** (where impartiality is the virtue). The parent is an agent of **care** (where partiality is the virtue). Confusing the two leads to the despair you are feeling.

  ### The Cost of This View
  The cost of rejecting your friend's argument is that you must accept a **fragmented moral landscape.** You cannot have one single rule ("Maximize Good") that applies to both the transplant committee and the parent in the same way. You must accept that morality has different "departments": one for institutions (impartial) and one for personal life (partial).

  For a pediatric resident trained in triage, this is difficult. Triage *requires* the "one thought" (who will live?). Parenting *forbids* it. Your friend is suffering from **moral residue**: the trauma of applying institutional logic to a world that demands personal logic. The philosophical solution is to validate that her love for her patient's *individual* life is morally distinct from her duty to the *population* of patients, and that neither cancels the other out.

  **Final thought for her:**
  "The integrity objection doesn't prove morality is defective; it proves that **utilitarianism as a decision procedure** is defective. But we can have an impartial morality that commands us to be partial in our personal lives. The 'one thought too many' isn't a failure of morality; it's a signal that you've moved from the committee room back to the bedside."
