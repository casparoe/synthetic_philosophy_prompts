  Let's refine the Socrates point. The user's memory is shaky. The Amnesty of 403 *did* constrain the charges. Anytus was a democrat who fought the Thirty. He couldn't charge Socrates with aiding the Thirty directly without reopening wounds. So the *asebeia* charge was a workaround. I need to tell the user to frame this carefully, not as "only way" but as "politically viable path."

