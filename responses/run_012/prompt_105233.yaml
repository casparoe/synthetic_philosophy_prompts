  **Committee Opinion: Growth Hormone for Idiopathic Short Stature**

  **Recommendation:** The committee should not endorse growth hormone (GH) therapy for this patient, and we should establish a policy declining such requests for idiopathic short stature absent a defined pathological process. Our endocrinologist's "but-for test" is a useful heuristic, but it correctly categorizes this case as enhancement, not treatment: there is no physiological dysfunction to correct, only a statistical deviation. The proposed 50th percentile cap confirms this; it is not a biological threshold of health but a social threshold of normalcy. If the goal were treating disease, the target would be physiological function, not population averages. While the parents argue convincingly that height correlates with social and economic success, and that beneficence obliges us to prevent foreseeable disadvantage, accommodating social prejudice through medical intervention risks medicalizing normal human variation. It shifts the burden of societal bias onto the child's body and exposes him to pharmacological risk without health benefit. We must distinguish between alleviating suffering caused by disease and alleviating suffering caused by social norms; medicine's mandate is the former.

  Regarding the child's role, at 12 years old, his assent is necessary but not sufficient. Even if he desires this intervention, we do not permit minors to undergo invasive or risky procedures for non-therapeutic ends (akin to restrictions on cosmetic surgery). His right to an open future is better served by protecting his bodily integrity than by scripting his physiology to fit current aesthetic standards. By declining this request, we preserve the distinction between healing and enhancing, ensuring our resources and expertise remain dedicated to restoring health rather than optimizing traits. This policy protects future families from feeling coerced into medicalizing their children to keep up with an arms race of enhancement, while respecting the boy's current and future autonomy.
