answer: |-
  1. Critics argue that accepting testimony is simply a hidden inference based on the speaker's reliability, so why isn't testimony merely a subset of inference? If he insists the conditions are background rather than steps, ask him how a child learns language without first inferring reliability.
  2. Consider a reliable AI system that generates true information without any human speaker behind the specific output; does this count as *śabda* for Nyāya, or does the absence of a morally responsible *āpta* collapse the category into mere inference? If he denies it is testimony, ask whether a scientific instrument differs epistemically from this AI.
  3. If testimony generates knowledge independently, how do you explain cases where we accept false testimony until perception contradicts it later? If he claims perception is only a defeater, ask why perception holds the ultimate authority to invalidate the testimony.
  4. Since understanding a sentence requires perceiving sounds and recalling word meanings from memory, isn't testimony just a complex mixture of perception and memory rather than a unique source? If he argues synergy creates new knowledge, ask him to identify the specific causal power that memory and perception lack.
  5. Nyāya defines valid testimony as coming from a morally competent *āpta*, but what if a dishonest person accidentally tells the truth? If he says the listener gains no knowledge in this case, ask whether this makes the speaker's virtue a necessary inferential premise for the listener.
