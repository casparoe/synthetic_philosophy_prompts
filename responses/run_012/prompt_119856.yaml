  She is operating on a **Biological Continuity Theory with a Non-Branching Constraint** (a form of Animalism).

  *   **The Core:** You are your living organism. Survival requires the continued existence of *this* specific organism. (This explains why the Teleporter kills you—organism destroyed—and Gradual Replacement works—organism persists).
  *   **The Constraint:** Identity cannot survive duplication. If the continuity of the organism branches into two distinct candidates, the original identity ceases. (This explains the Perfect Copy call).
  *   **The Boundary:** Internal division within a single organism does not count as branching. (This explains the Split-Brain call: one body, one person, even if the mind is fragmented).

  **Which calls pin this down?**
  *   **The Anchor:** The **Perfect Copy** case is the strongest pin. It proves she rejects Psychological Continuity when it violates Uniqueness. It establishes that *competition* kills identity.
  *   **The Support:** The **Teleporter** case proves she requires Physical/Biological Continuity, not just information preservation.
  *   **The Red Herring:** The **Split-Brain** call *looks* like it supports Psychological Continuity (since the mind divides), but it actually supports Biological Continuity. She says "one person" because there is still only *one body*. Do not mistake this for her accepting fission; she only accepts internal fragmentation within a single substrate.

  ### 3. The One Question to Ask

  You need to distinguish between two subtle variations of her Non-Branching rule:
  1.  **The "Competition" View:** You die only if there is a *living competitor*. (If the other branch/person dies immediately, you survive).
  2.  **The "Process" View:** You die if the continuity *branches*, regardless of whether the other branch survives. (The act of fission itself is death).

  This distinction determines whether the Main Version of the Quantum Suicide experiment (where the "Up" branch is dead) counts as survival or death in her eyes. If she holds the "Competition" view, the Main Version *might* be survival (since the other branch is dead). If she holds the "Process" view, it is definitely death.

  **Ask her this:**

  > "In the fission case—where you split the brain halves into two separate bodies—if one of the bodies fails to wake up and dies immediately, is the person in the surviving body you?"

  **Why this question:**
  *   **If she says "Yes":** She holds the **Competition View**. Identity is only lost if there are two *living* claimants. This implies she *might* accept the Main Version of Quantum Suicide (where the other branch is 'dead') as survival, which would upend your piece's conflict.
  *   **If she says "No":** She holds the **Process View**. The mere act of branching severs identity, even if one branch terminates. This confirms she will reject the Quantum Suicide pitch entirely, and it solidifies that her "Perfect Copy" ruling was about the *structure* of continuity, not just the presence of a rival.

  Given her "Perfect Copy" stance (where the copy exists *while* the original lives), she is likely to say **"No,"** but getting that confirmation on the record is the key to locking your argument.
