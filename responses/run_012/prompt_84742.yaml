answer: |-
  Bolt's More is operationally Augustinian in his absolute refusal to lie, but he is fundamentally un-Augustinian in motive, substituting a humanistic cult of personal integrity for Augustine's ontological duty to Divine Truth, and using silence not merely to avoid falsehood but to construct a self.

  Regarding silence and deception, More actually stays within Augustine's technical boundaries while pushing against their spirit. Augustine distinguishes between *mendacium* (lying) and *taciturnitas* (silence), permitting the withholding of truth from those who have no right to it, such as persecutors seeking to undermine faith. When More refuses to answer Cromwell, he is practicing Augustinian concealment; he does not assert falsehood, nor does he intend for Cromwell to believe he supports the King—he intends only to provide no evidence. The fact that Cromwell infers treason is a result of political necessity, not More's deceit. Augustine would likely approve of the silence itself, as the *voluntas fallendi* (will to deceive) is absent; More wants no judgment, not a false one. However, Augustine would worry about the pride inherent in that silence. More's silence is not just protective; it is performative. He knows what it communicates—a stubbornness that looks like guilt—and he accepts that interpretation as the price of his purity. Augustine warns that hiding truth can be uncharitable, but he prioritizes the soul's cleanliness over the neighbor's misunderstanding. More does the same, but where Augustine does it for God, More does it for himself.

  This leads to the critical divergence on truth versus integrity. Augustine's ethics are theocentric: lying is sinful because it violates God, who is Truth itself. The objective status of the proposition matters less than the alignment of the heart with Divine Reality. Bolt's More, however, is proto-existentialist: he repeatedly claims he doesn't know the theological facts (e.g., the validity of the marriage), only that he cannot swear against his conscience. He says, "I believe it," not "It is true." Augustine would find this terrifying; if More's conscience is erroneous, Augustine argues he is still bound by objective truth, whereas Bolt suggests he is bound only by his own certainty. More loves his integrity more than he loves the truth, whereas for Augustine, integrity is only valuable insofar as it serves the truth. The play presents a man who would rather die than contradict himself, not necessarily a man who would rather die than contradict God.

  The tension between law and truth further separates them. Augustine views earthly law as subordinate to Divine Law; if the law commands a lie, the law is void. More's famous speech about giving the Devil the benefit of law elevates Human Law to a sacred shield. He uses legal procedure to protect theological truth, whereas Augustine would argue theological truth protects itself regardless of procedure. This secularizes the martyrdom. Furthermore, the "ugly part" regarding More's family highlights the cost of this stance. Augustine accepts collateral damage as the inevitable price of righteousness in a fallen world; the martyr's family suffers, but the martyr is not responsible for the persecutor's violence. Bolt, however, frames this suffering as a tragedy that indicts the rigidity of the rule. More's refusal to explain himself to Alice and Margaret isn't just protection; it's an abandonment that Augustine might critique as a failure of charitable duty, even if it avoids the sin of lying. Augustine demands we speak truth in love; More chooses silence to preserve his soul, leaving his family in the dark.

  The play adds to the philosophical debate by dramatizing the social and psychological phenomenology of absolute truthfulness, something Augustine's treatises ignore. Augustine analyzes the act of lying in isolation; Bolt shows how silence functions as a weapon in a political ecosystem and how the refusal to lie isolates the moral agent from the community they love. The play reveals that an Augustinian ethic requires a level of isolation that borders on inhumanity, forcing the audience to weigh the value of a clean conscience against the wreckage left in its wake. However, the play gets the philosophy wrong by conflating conscience with truth. It suggests that being true to oneself is the highest good, whereas Augustine argues that being true to oneself is only good if oneself is aligned with God. Bolt gives us a hero of integrity, but Augustine would argue that without objective truth, integrity is just stubbornness, and More's silence is less a witness to God than a monument to the self.
