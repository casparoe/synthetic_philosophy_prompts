answer: |-
  # Activity Plan: The Desert Run
  **Topic:** Parfit's Hitchhiker, Commitment, and Rational Dispositions
  **Time:** 55 Minutes
  **Group Size:** 16 Students
  **Materials:**
  *   Whiteboard + Markers
  *   Index Cards (2 colors, e.g., Blue and Red)
  *   Paper Slips ("Desert Dollars" or DD) – cut from scrap paper
  *   A Bowl of Candy (for redemption at the end)
  *   16 Small Stickers or distinct markers (for "Badges")
  *   A Timer

  ---

  ## Part 1: Setup & Round 1 (The Trap)
  **Time:** 0:00 – 0:15

  ### 1. The Economy (5 Minutes)
  Write this on the whiteboard. Do not explain *why* yet, just *how*.

  **WHITEBOARD: PAYOFF CHART**
  | Action | Driver Gets | Traveler Gets |
  | :--- | :---: | :---: |
  | **No Ride** (Driver passes) | 0 DD | 0 DD |
  | **Ride + Paid** (Traveler honors deal) | +3 DD | +5 DD |
  | **Ride + Defected** (Traveler keeps wallet) | -2 DD | +10 DD |

  *   **Driver Cost:** Stopping costs gas (-2), Fare income (+5). Net = +3.
  *   **Traveler Value:** Ride is worth (+10), Fare cost (-5). Net = +5.
  *   **Traveler Temptation:** If you don't pay, you keep the +5 fare *and* the +10 value = +10.

  **The Rules:**
  1.  **Currency:** Everyone starts with **5 DD**. (Hand out paper slips).
  2.  **Pairs:** You will be paired randomly. One is Driver, one is Traveler.
  3.  **Secrecy:** Decisions are written on index cards, face down.
  4.  **Sequence:**
      *   Driver writes **STOP** or **PASS**.
      *   If **PASS**: Round ends. No money changes hands.
      *   If **STOP**: Traveler sees the card. Traveler writes **PAY** or **DEFECT**.
  5.  **Anonymity:** Do not tell your partner your name. Swap cards through the facilitator (you) so partners don't see handwriting.

  ### 2. Play Round 1 (10 Minutes)
  1.  **Deal Roles:** Hand out 8 Blue cards (Driver) and 8 Red cards (Traveler). Shuffle pairs.
  2.  **Decision:** Give them 2 minutes to think and write.
  3.  **Collection:** Collect cards. Reveal results publicly on the board (e.g., "Pair 1: Stop/Defect", "Pair 2: Pass").
  4.  **Settlement:** Pay out the DD according to the chart.
  5.  **Tally:** Ask for a show of hands: "How many Drivers stopped?" "How many Travelers paid?"

  **Expected Outcome:** Most Drivers will PASS. Why? Because they expect Travelers to DEFECT (since 10 > 5). Most Travelers, if they got a ride, will DEFECT. The group ends up with mostly 0s.
  **Facilitator Note:** If someone pays out of niceness, note it quietly but do not scold. If *everyone* pays, the lesson fails. If this happens, tell them: "In the real thought experiment, you are guaranteed never to meet again. Pretend this is true."

  ---

  ## Part 2: Phase 2 (The Constitution)
  **Time:** 0:15 – 0:30

  ### 1. The Problem Statement (2 Minutes)
  Say this exactly:
  > "Round 1 showed us the trap. If you are 'rational' in the moment, you defect. If the Driver knows you're 'rational,' they don't stop. Everyone loses the ride. To get the ride, you need to be the *kind of person* who pays, even when it hurts."

  ### 2. The Choice (10 Minutes)
  Tell the group they can alter their status for Round 2. They must choose one of two **Constitutions**. Write this on the board:

  **WHITEBOARD: CHOOSE YOUR TYPE**
  | **Option A: Free Agent** | **Option B: Bound Agent** |
  | :--- | :--- |
  | **Cost:** 0 DD | **Cost:** 1 DD (Pay now) |
  | **Rule:** You choose Pay or Defect later. | **Rule:** You are **FORCED** to Pay later. |
  | **Signal:** No Badge. | **Signal:** You get a **BADGE** (Sticker). |
  | **Risk:** Driver may not trust you. | **Benefit:** Driver knows you *must* pay. |

  **Instructions:**
  1.  Everyone decides privately.
  2.  If you choose **Bound Agent**, come to the front, pay 1 DD into the "Bank," and get a Sticker on your shirt/card.
  3.  If you choose **Free Agent**, stay seated. No sticker.
  4.  **Crucial Rule for Round 2:** Drivers will be told *only* whether their partner has a Badge. They will not know the name.
      *   If Traveler has **Badge**: Driver knows Fare is guaranteed.
      *   If Traveler has **No Badge**: Driver knows Traveler *can* Defect.

  ### 3. The Market (3 Minutes)
  Watch who buys the Badge.
  *   **Prediction:** Some will think "I'm honest, I don't need a badge." (Free Agent).
  *   **Prediction:** Some will think "I need the ride, I'll buy trust." (Bound Agent).
  *   **Facilitator Move:** If no one buys a badge, announce: "Drivers have heard a rumor that Free Agents always defect. Drivers will now automatically PASS anyone without a Badge." (This enforces the logic of the thought experiment).

  ---

  ## Part 3: Round 2 (The Payoff)
  **Time:** 0:30 – 0:40

  ### 1. Play (7 Minutes)
  1.  **Reshuffle:** New pairs. Ensure Drivers can see if Travelers have Stickers.
  2.  **Decision:**
      *   Driver decides STOP or PASS based *only* on the Sticker.
      *   If Traveler has **No Sticker**: Driver should PASS (rationally).
      *   If Traveler has **Sticker**: Driver should STOP (guaranteed profit).
      *   Traveler with Sticker: Facilitator automatically deducts Fare (they are Bound).
      *   Traveler without Sticker: If a Driver mistakenly stops, they can Defect.
  3.  **Settlement:** Pay out DD.

  ### 2. Tally (3 Minutes)
  Compare earnings.
  *   **Bound Agents:** Should have +4 DD net (5 Ride - 5 Fare - 1 Cost).
  *   **Free Agents:** Should have 0 DD (Because Drivers didn't stop).
  *   **Lesson:** The people who limited their freedom (paid the cost) won. The people who kept their options open lost.

  ---

  ## Part 4: Debrief & Mapping
  **Time:** 0:40 – 0:55

  Gather in a circle. Do not stand at the board. Sit with them.

  ### 1. Map the Game to the Philosophy (5 Minutes)
  Use these specific prompts to draw the answers out of them.

  *   **The Driver's Dilemma:** "In Round 1, why did Drivers pass?"
      *   *Target Answer:* They knew Travelers would keep the money.
      *   *Philosophical Term:* **Causal Decision Theory.** (Looking at the moment of action: Paying costs me, so I won't).
  *   **The Badge:** "What did the Sticker actually do?"
      *   *Target Answer:* It changed what the Driver thought I would do.
      *   *Philosophical Term:* **Commitment Device / Signaling.**
  *   **The Parfit Point:** "In the real story, there are no stickers. You're just in a desert. What is the sticker in real life?"
      *   *Target Answer:* Your character. Your reputation. Your conscience.
      *   *Philosophical Term:* **Disposition.** (Being the *type* of person who pays).

  ### 2. Limitations: What the Game Hid (5 Minutes)
  Be honest about where the simulation fails. Write these on the board as "Unresolved."

  1.  **External vs. Internal:** "In the game, I *forced* Bound Agents to pay. In real life, no one forces you. You have to *feel* like you must pay. How do you get that feeling?"
      *   *Note:* This is the hard part. Cultivating a conscience is harder than buying a sticker.
  2.  **Reputation:** "Did anyone say, 'I'll pay so people like me'?"
      *   *Note:* Parfit's case assumes **total anonymity**. If you pay for reputation, that's a different calculation (Iterated Prisoner's Dilemma). Parfit wants to know if it's rational to pay when *no one* will ever know.
  3.  **The Cost:** "In the game, the Badge cost 1 DD. In real life, being honest might cost you everything. Is it still worth it?"

  ### 3. Consensus vs. Contested (5 Minutes)
  This is crucial for intellectual honesty. Tell them philosophers fight about this.

  **Write on Board: WHAT WE KNOW vs. WHAT WE ARGUE**

  | **Consensus (Most Agree)** | **Contested (Philosophers Fight)** |
  | :--- | :--- |
  | **The Shape:** This is a **Commitment Problem**. You can't get the benefit without binding yourself. | **Rationality:** Is it **Rational** to be bound? Some say yes (Parfit), some say no (Causal Decision Theorists). |
  | **The Outcome:** If you can't commit, you lose the ride. | **The Mechanism:** How do you bind yourself? Is "Rational Irrationality" (choosing to be irrational) even possible? |
  | **The Lesson:** Standard "maximize profit now" logic fails here. | **The Morality:** Does this prove morality is just smart selfishness? (Most say no, but it's debated). |

  **Closing Script:**
  > "Parfit's point isn't that you should buy a sticker. It's that the definition of 'rational' might be wrong. If being 'rational' means you die in the desert, maybe we need a new definition of rationality. One that values being the *kind of person* who gets picked up, not just the kind of person who counts coins once they're safe."

  ---

  ## Facilitator Cheat Sheet: Predicting Failure

  **1. The "Nice" Problem**
  *   **Risk:** In Round 1, 50% of Travelers pay because they are good kids.
  *   **Result:** Drivers stop, everyone wins, the "trap" isn't felt.
  *   **Fix:** In the debrief, say: "You paid because you are nice, not because the *math* made you pay. In the thought experiment, you are a pure logic machine. If you were a logic machine, you would have defected. The game asks: Can a logic machine survive?"

  **2. The "Reputation" Problem**
  *   **Risk:** A student says, "I paid because I didn't want to look bad."
  *   **Result:** They miss the "Anonymity" point.
  *   **Fix:** Acknowledge it. "That's real life. But Parfit asks: What if the driver is blind? What if you move to a new city tomorrow? Do you still pay? That's where the philosophy lives."

  **3. The "Rigged" Complaint**
  *   **Risk:** Free Agents complain, "You said Drivers *wouldn't* stop for us! That's unfair."
  *   **Result:** They feel punished rather than taught.
  *   **Fix:** "It wasn't me. It was the Drivers' math. If you were a Driver, would you risk -2 points on a stranger with no badge? You made the math for them."

  ## Materials Copy-Paste for Whiteboard

  **PAYOFF CHART**
  *   **No Ride:** Driver 0 | Traveler 0
  *   **Ride + Paid:** Driver +3 | Traveler +5
  *   **Ride + Defect:** Driver -2 | Traveler +10

  **CONSTITUTION CHOICE**
  *   **Free Agent:** Cost 0 | Choose Later | No Badge
  *   **Bound Agent:** Cost 1 | Forced to Pay | **BADGE**

  **WHAT WE KNOW vs. WHAT WE ARGUE**
  *   **Know:** It's a Commitment Problem. "Maximize Now" logic fails.
  *   **Argue:** Is it *Rational* to bind yourself? What is a "Disposition"?
