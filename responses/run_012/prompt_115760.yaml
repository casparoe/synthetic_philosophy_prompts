      *   *Let's refine the User's Request:* They want the *rules* to do the teaching. If I make it a vote, it teaches Social Contract Theory (Hobbes), not Parfit (Decision Theory).
      *   *Decision:* I need to gently steer this. I will keep the "Commitment Device" purchase (individual) but frame the "Voting" as a "Club Norm" that doesn't actually enforce anything, highlighting that only the *costly signal* works. Or, I can interpret the "vote" as "Choosing your Nature."
      *   *Best approach for the prompt:* I will honor the "Vote on a Rule" but design it so the "Rule" is weak, and the "Costly Commitment" is strong. This highlights that *talk* (voting) is cheap, but *disposition* (costly signal) is what changes the Driver's mind.
      *   *Wait, looking closer:* "everyone votes on a rule they'll be bound by for the rest of the session, and one of the options should cost something real... a commitment device."
