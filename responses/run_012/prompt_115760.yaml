  5.  **Predicting Failures:**
      *   *Niceness:* Travelers pay even without commitment.
          *   *Fix:* Make the temptation high. 10 points vs 4 points cost.
          *   *Facilitator Move:* If too many pay, announce "In the real desert, anonymity is guaranteed. Let's reset the payoffs." (Actually, better to address in debrief).
      *   *Reputation:* "I'll pay so people like me."
          *   *Fix:* Emphasize anonymity. New partners every round. Names not used.
      *   *Confusion:* Kids not understanding the math.
          *   *Fix:* Whiteboard examples.

  6.  **Philosophical Nuance (Consensus vs. Contested):**
      *   *Consensus:* It's a commitment problem. Standard Causal Decision Theory (CDT) says don't pay.
      *   *Contested:* Is it rational to be disposed to pay? (Parfit says yes, CDT says no). Is "Rational Irrationality" coherent? (Elster vs. others).
      *   *Limitation:* The game uses external enforcement (rules) to simulate internal disposition. Real disposition is psychological, not contractual.

  7.  **Drafting the Content:**
      *   *Title:* The Desert Run.
      *   *Materials:* Index cards, paper slips (Currency), Whiteboard.
      *   *Timing:* 55 mins total.
