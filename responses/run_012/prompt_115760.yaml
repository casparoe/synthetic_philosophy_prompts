              *   *Better Solution:* The "Badge" makes your choice *automatic*. If you have the badge, the facilitator takes the fare automatically. If you don't, you choose. Drivers know this.
              *   *Incentive:* If you don't buy the badge, Drivers won't stop (because they know you'll defect). So non-badge holders get 0. Badge holders get +5.
              *   *This works.*

  4.  **Addressing the "Third Phase":**
      *   The prompt asks for "Two rounds and a third phase."
      *   Let's do:
          1.  Round 1: Blind Trust (The Failure).
          2.  Round 2: The Market (Buying the Badge).
