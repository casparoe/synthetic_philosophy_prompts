      *   Debrief: 15 mins.
      *   *Total:* 55 mins.

      *Refining the "Vote":* To make it Parfitian, the "Vote" shouldn't be a majority rule binding everyone. It should be an *individual choice* of constitution. "How will you govern yourself?" I will adjust the instructions to ensure it's an individual choice, not a democracy, otherwise it teaches politics, not rationality. *Self-Correction:* The prompt explicitly says "everyone votes on a rule they'll be bound by." I will interpret this as "Each person votes for their own rule."

  8.  **Final Polish:**
      *   Ensure American English.
      *   Check the math one last time.
      *   Ensure the "Contested" section is clear.
      *   Make sure the Facilitator (User) knows exactly what to say.

      *Math Check:*
      *   Traveler needs Ride (Value 10).
      *   Fare is 5.
      *   Gas is 2.
      *   Commitment Cost is 1.
      *   *No Commit:*
          *   Driver Passes: 0, 0.
          *   Driver Stops + Traveler Pays: Driver +3, Traveler +5.
          *   Driver Stops + Traveler Defects: Driver -2, Traveler +10.
          *   *Rational Traveler (at town):* Defect (+10 > +5).
          *   *Rational Driver (anticipating):* Pass (0 > -2).
