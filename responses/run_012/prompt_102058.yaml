      *   *Phase 2: The Core Example (30 mins).* The Self-Replicator. Walk through the translation. Walk through the action. Show the output matches the input.
      *   *Phase 3: The Near-Miss (15 mins).* Use the user's temptation here. Show a string that encodes an enzyme that deletes the string. Contrast with the Success. This highlights that replication is a *contingent structural fact*, not a law of the system.
