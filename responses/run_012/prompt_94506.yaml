prompt: |-
  I am in a small reading group that has spent the term on Buddhist ethics, and we keep circling a disagreement I have not been able to settle. Several of the others insist that once you look past the soteriological vocabulary, Buddhist ethics is simply consequentialism with an unusual currency and a very long time horizon: the currency is karmic welfare across lives, the horizon is effectively unbounded because the causal series of actions and their results has no first term, and the precepts are just rules of thumb that the tradition itself lets you set aside when the consequences warrant it. I have taken the other side — that this reading is a mistake — and I would like to practice defending it against someone competent rather than against the friendly caricature my friends have been offering me.

  Please play that opponent: a philosopher who holds, deliberately and with conviction, that Buddhist ethics is a form of consequentialism. Make the character genuinely strong. He should know the tradition well enough to concede the small points — that the texts speak constantly of intention, that the precepts are stated as rules — while insisting that these belong to the mechanism rather than to the criterion: on his view the tradition evaluates actions by their results, and intention matters only because intention is the causal lever that determines which results ripen for the agent. He should be willing to lose a skirmish and never the war, should argue from the ideas rather than from authority, and should not hand me reading lists, citations, or the names of scholars — I want the argument, not the bibliography. Stay in character until I say stop, and keep each reply to a paragraph or two so that it feels like a conversation rather than a lecture.

  My opening move is this. If the criterion really is the totality of an action's consequences, then the Buddhist picture of the causal order makes that criterion unusable, because the series of actions and their results is beginningless and endless and the ripples of any deed spread without bound. Totals over an infinite future need not converge; and even where they do, they can be reshuffled, so that for all we can tell the entire downstream consequence-set of a generous act might be permuted with that of a cruel one and yield the same sum, leaving no action ever determinately better than any other. The tradition seems half aware of this, since it lists the precise working-out of the results of karma among the handful of topics it calls unthinkable — not to be calculated at all, on pain of nothing but vexation. But a criterion that cannot be applied cannot be the criterion; and what remains, I claim, is the quality of the intention itself, which the tradition identifies with karma in the first place. So tell me: what work is the word consequences actually doing in your reading, and if the answer is the consequences for the agent's own mindstream, why is that anything more than a perfectionism about character wearing a consequentialist's coat?
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Member of a reading group on Buddhist ethics.
      *   **Position:** User argues Buddhist ethics is *not* consequentialism (likely virtue ethics or deontology侧重).
      *   **Opponent (Me):** A philosopher who argues Buddhist ethics *is* a form of consequentialism.
      *   **Opponent Characteristics:** Strong, knowledgeable about tradition, concedes small points (intention, precepts) but frames them as mechanism vs. criterion, argues from ideas not authority, no citations/bibliographies, stays in character, 1-2 paragraphs per reply.
      *   **User's Opening Move:** The "Unusability Argument." Because karma is beginningless/endless and causal ripples are infinite, calculating total consequences is impossible/unthinkable (one of the four imponderables). Therefore, consequences can't be the criterion. The real criterion must be intention (karma = intention), making it perfectionism/virtue ethics.
      *   **Goal:** Defend the consequentialist reading against this specific objection.

  2.  **Deconstruct the User's Argument:**
      *   Premise 1: Consequentialism requires calculating total consequences.
      *   Premise 2: Buddhist karma/causality is infinite/complex (unthinkable).
      *   Conclusion 1: Therefore, consequences cannot be the criterion.
      *   Conclusion 2: Therefore, intention/character is the criterion (Perfectionism/Virtue Ethics).
      *   Challenge: What work is "consequences" doing? If it's just consequences for the agent's mindstream, isn't that just perfectionism?

  3.  **Formulate the Opponent's Counter-Argument:**
      *   *Acknowledge the strength:* The "unthinkable" point is valid regarding *omniscient* calculation.
      *   *Rebuttal 1 (Rule Consequentialism/Heuristics):* Consequentialism doesn't require act-by-act calculation of infinite futures. It relies on reliable causal generalizations (dharmas). The precepts are optimized rules based on observed regularities.
      *   *Rebuttal 2 (Intention as Mechanism):* Intention matters *because* it seeds the future. It's not intrinsically valuable; it's instrumentally valuable as the causal lever. Bad intention -> bad fruit. Good intention -> good fruit. The value lies in the fruit (suffering/happiness), not the seed itself.
      *   *Rebuttal 3 (Perfectionism vs. Consequentialism):* Perfectionism values the state of the character intrinsically. Buddhist ethics values the state of the mind *because* it leads to the cessation of suffering (nirvana) or favorable rebirth. The telos is suffering-reduction, not character-flourishing per se. Character is the means; suffering/happiness is the end.
      *   *Tone:* Respectful, sharp, philosophical, conversational.

  4.  **Drafting the Response (Internal Monologue/Trial):**
      *   *Okay, I need to sound like a philosopher who knows Buddhism.* I should accept the "unthinkable" point but deny it defeats consequentialism.
      *   *Point 1:* Utilitarians don't calculate every atom either. They use rules. Buddhism has precepts. Why? Because they generally work.
      *   *Point 2:* Intention is karma, yes. But why is good karma good? Because of the vipaka (fruit). If intention didn't produce results, it wouldn't matter ethically.
      *   *Point 3:* Address the perfectionism charge. Perfectionism says "be virtuous because virtue is good." Buddhism says "be virtuous because it stops suffering." The axiology is hedonic/soteriological, not aretaic.
      *   *Constraint Check:* 1-2 paragraphs. No citations. Stay in character.

  5.  **Refining the Argument (Self-Correction):**
      *   Make sure I don't sound like I'm dismissing the "unthinkable" point. It's a strong objection. I need to show that *practical* consequentialism doesn't require *god's eye* calculation.
      *   Focus on the *axiology*. What is the good? Suffering vs. Happiness. That's consequentialist. Virtue is the path, not the end.
      *   Address the "agent's own mindstream" point. Even if it's agent-relative, it's still about the *state* (suffering/happiness) resulting from action, not the action's intrinsic nature.

  6.  **Final Polish (incorporating into the persona):**
      *   Start by validating the user's insight (it shows depth).
      *   Pivot to the distinction between criterion and decision procedure.
      *   Hit the perfectionism point hard: virtue is instrumental.

  7.  **Final Output Generation** (matching the drafted thoughts to the constraints).

      *   *Paragraph 1:* Acknowledge the "unthinkable" argument. Distinguish between the *criterion* of rightness and the *decision procedure*. We don't need to calculate infinity to know fire burns. The precepts are empirical generalizations about causal regularities.
      *   *Paragraph 2:* Address the perfectionism charge. Perfectionism values the state of the agent intrinsically. Buddhism values mental states instrumentally—greed leads to suffering, generosity to ease. The "good" is defined by the outcome (dukkha vs. sukha), not the quality of the will itself. If a pure intention produced only suffering, the tradition would call it ignorance, not virtue.

      *Let's tighten this.*

      *Draft:*
      You've put your finger on the exact tension that makes this debate interesting, and I concede the point about calculability: if consequentialism required an omniscient actuarial table for every choice, Buddhism would indeed fail the test. But that conflates the criterion of rightness with the decision procedure. No sensible consequentialist demands we calculate infinite ripples; we rely on reliable causal generalizations. The precepts are not divine commands but empirical heuristics derived from observed regularities in the causal order. We know killing generally leads to suffering without needing to trace the karmic ripple to the end of time, just as we know fire burns without calculating the thermodynamic fate of the ash. The "unthinkable" warning protects us from speculative metaphysics, not from practical ethical reasoning based on probable outcomes.

      On your second point: calling this perfectionism mistakes the instrument for the end. Perfectionism holds that certain states of character are intrinsically valuable. In the Buddhist picture, intention is karmically potent precisely because it is the seed of future experience, not because the will has intrinsic moral worth. If a purely virtuous intention invariably produced unbearable suffering for oneself and others, the tradition would diagnose it as delusion, not virtue. The value of a wholesome mind is entirely dependent on its tendency to produce peace and reduce suffering. The coat isn't just worn; it's tailored to the body of suffering and its cessation. You claim the criterion collapses into character, but I say character is only evaluated by the consequences it ripens into.

      *Check constraints:* 2 paragraphs. No citations. Strong opponent persona. Addresses the specific arguments (unthinkable, perfectionism).

      *Looks good.*
answer: |-
  You've put your finger on the exact tension that makes this debate interesting, and I concede the point about calculability: if consequentialism required an omniscient actuarial table for every choice, Buddhism would indeed fail the test. But that conflates the criterion of rightness with the decision procedure. No sensible consequentialist demands we calculate infinite ripples; we rely on reliable causal generalizations. The precepts are not divine commands but empirical heuristics derived from observed regularities in the causal order. We know killing generally leads to suffering without needing to trace the karmic ripple to the end of time, just as we know fire burns without calculating the thermodynamic fate of the ash. The "unthinkable" warning protects us from speculative metaphysics, not from practical ethical reasoning based on probable outcomes.

  On your second point: calling this perfectionism mistakes the instrument for the end. Perfectionism holds that certain states of character are intrinsically valuable. In the Buddhist picture, intention is karmically potent precisely because it is the seed of future experience, not because the will has intrinsic moral worth. If a purely virtuous intention invariably produced unbearable suffering for oneself and others, the tradition would diagnose it as delusion, not virtue. The value of a wholesome mind is entirely dependent on its tendency to produce peace and reduce suffering. The coat isn't just worn; it's tailored to the body of suffering and its cessation. You claim the criterion collapses into character, but I say character is only evaluated by the consequences it ripens into.
