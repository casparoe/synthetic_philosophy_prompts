answer: |-
  This is a classic and deeply unsettling moment in the philosophy of medicine. You have encountered what we often call the "line-drawing problem," and your friend has leveraged it to argue for a strong normativist conclusion that threatens to undermine the reality of medical diagnosis. It is completely understandable that you feel stuck: if disease is merely a value judgment, then telling your father he is "sick" feels like gaslighting, but ignoring the diagnosis feels negligent.

  Let's unpack this. I will start by mapping the philosophical terrain to clarify what your friend is actually claiming versus what the alternatives are. Then, I will analyze the specific cases she raised (homosexuality and hypertension) to show why they do not necessarily prove her strong conclusion. Finally, I will offer you a framework for speaking to your father and a counter-argument for your friend.

  ### 1. Mapping the Terrain: Three Main Positions

  To understand where you stand, we need to distinguish between three broad camps in the literature.

  **Strong Naturalism (e.g., Boorse)**
  *   **The Claim:** Disease is a matter of fact, independent of values. It is a deviation from "species-typical functional organization." If a bodily mechanism is failing to do what it evolved to do (e.g., the heart pumping blood efficiently), that is a disease.
  *   **Role of Values:** Values only enter when deciding *what to do* about the disease (treatment), not in identifying *that* there is a disease.
  *   **Weakness:** It struggles with cases where there is biological deviation but no harm (asymptomatic conditions), or harm without clear biological malfunction (some mental health conditions).

  **Strong Normativism (e.g., Fulford)**
  *   **The Claim:** Disease is essentially an evaluative concept. To call something a disease is to say it is "bad" or "undesirable." There is no biological line that does not rely on a prior judgment of value.
  *   **Role of Values:** Values are constitutive. Without the judgment that a condition is undesirable, there is no disease.
  *   **Weakness:** It risks making medicine entirely subjective or political. If disease is just "what we dislike," then medicine loses its authority to distinguish between a broken leg and a social inconvenience.

  **Hybrid Accounts (e.g., Wakefield)**
  *   **The Claim:** Disease requires *two* components: (1) a biological dysfunction (naturalist) AND (2) a judgment that the condition is harmful or undesirable (normative).
  *   **Role of Values:** Values are necessary but not sufficient. You need the biology to have a disease, but you also need the harm judgment.
  *   **Strength:** This handles the homosexuality case well (no dysfunction found, so not a disease, regardless of social values) and the hypertension case (dysfunction/risk exists, but the threshold for labeling it is value-driven).

  Your friend is arguing for **Strong Normativism**. She is claiming that because the *label* changes based on social decisions, the *underlying reality* is irrelevant. Your worry is that if she is right, your father's diagnosis is a fiction.

  ### 2. Analyzing the Friend's Evidence

  Your friend's argument relies on a slide from "values influence classification" to "values create reality." Let's look at her examples through a Hybrid or Nuanced Naturalist lens.

  **The Homosexuality Case (DSM)**
  *   **Friend's View:** It was a disease, then it wasn't. The biology didn't change, so the decision was purely political/values-based.
  *   **Counter-View:** This case actually refutes Strong Naturalism (which might have struggled to explain why it was ever listed) but supports the Hybrid view. When homosexuality was listed, it was likely due to social disvalue masking as medical fact. When it was removed, it was because the profession recognized there was no underlying *biological dysfunction* causing harm to the individual.
  *   **Takeaway:** This shows that values can *corrupt* diagnosis, but it doesn't prove that *all* diagnosis is just values. It shows we need the biological component to prevent social prejudice from becoming medical fact.

  **The Hypertension Case (2017 Guidelines)**
  *   **Friend's View:** The blood pressure didn't change, but the disease status did. Therefore, "hypertension" is just a label the cardiologists decided to apply.
  *   **Counter-View:** This is the most critical case for your father. Blood pressure is a **continuum**, not a binary. There is no magical biological switch that flips at 130/80. However, the *risk* of stroke or heart attack rises continuously with blood pressure.
  *   **The Distinction:** The *risk* is a natural fact. The *threshold* for intervention is a normative/policy decision.
  *   **Why lower the threshold?** The guidelines committee looked at data showing that people at 130/80 have higher stroke risk than people at 120/80. They weighed the value of preventing strokes against the value of avoiding unnecessary medication (side effects, cost, anxiety). They decided the balance tipped toward treatment at 130.
  *   **Takeaway:** The diagnosis is not a "political artifact" in the sense of being fake. It is a **risk marker**. The *label* "Stage 1 Hypertension" is a tool to trigger a protocol that reduces risk. The biology (the pressure in the arteries) is real; the decision to treat at *this specific number* is a value judgment about risk tolerance.

  ### 3. Does Value-Ladenness Mean Arbitrariness?

  This is the crux of your anxiety. If values are involved, is it all just power and politics?

  **No.** In medicine, values are not arbitrary preferences (like preferring chocolate over vanilla); they are **teleological judgments** (judgments about goals and functions).

  When the cardiologists lowered the threshold, they appealed to a shared value: *minimizing premature death and disability.* This is not a partisan political value in the same way "lower taxes" is; it is a constitutive goal of medicine.

  Therefore, accepting that disease concepts are value-laden does **not** commit you to thinking disease attributions are arbitrary. It commits you to thinking they are **pragmatic**.
  *   **Fact:** Higher blood pressure correlates with higher vascular damage.
  *   **Value:** We want to prevent vascular damage.
  *   **Decision:** We will label and treat at this level to achieve that value.

  If the cardiologists lowered the threshold to 100/60 without evidence of benefit, *that* would be arbitrary/political. But if they lower it based on risk stratification to achieve a shared health goal, it is a reasoned value judgment grounded in biological fact.

  ### 4. How to Talk to Your Father

  You do not need to solve the philosophy of medicine to help your father. In fact, introducing the Strong Normativist doubt might be harmful. He needs to navigate the system as it exists, not as it might be ideally constructed.

  **Do not say:** "The doctors just decided this is a disease, but it might not be real."
  **Do say:** "Medicine looks at risk, not just broken parts."

  Here is a script grounded in the **Hybrid/Pragmatic** view:

  > "Dad, I've been looking into the new guidelines. Here is the situation: Your blood pressure isn't 'broken' like a fractured bone. It's a number on a scale. The doctors used to say we only worry if the number is above 140. Now, new data shows that risks for heart issues start creeping up around 130.
  >
  > So, when they say you have 'Stage 1 Hypertension,' they aren't saying your body has suddenly failed. They are saying your risk profile has crossed a line where medication is proven to help prevent future problems. It's a preventative label. The biology is real—the pressure is what it is—but the decision to treat is about balancing the risk of stroke against the hassle of pills. The consensus right now is that treating at your level keeps you safer longer."

  **Why this works:**
  1.  It validates his reality (he feels fine).
  2.  It explains the change (guidelines shifted based on risk data, not whim).
  3.  It frames the "disease" as a **risk status** rather than a moral failing or a binary biological switch.
  4.  It empowers him to discuss the *values* with his doctor (e.g., "I prefer to try diet first before meds" vs. "I want maximum protection").

  ### 5. How to Talk to Your Friend

  Your friend is right that Strong Naturalism is untenable. The history of medicine *does* show that values shape classification. But she is wrong that this leads to the conclusion that "there is no fact of the matter."

  **The Argument to Make:**
  1.  **Concede the Threshold Point:** Agree that cut-offs (like 130/80) are normative. There is no biological "joint" at 130 that nature respects.
  2.  **Deny the Ontological Conclusion:** Argue that the *continuum* upon which the cut-off is placed is biological and objective. The risk of vascular damage at 130 is higher than at 120 regardless of what the APA or ACC says.
  3.  **Challenge the "Merely Political" Claim:** Ask her: "If disease is just a value judgment, why do we need blood pressure cuffs? Why not just vote on who is sick?"
      *   If she says "Because we use biology to inform the values," then she is actually a **Hybrid Theorist**, not a Strong Normativist.
      *   If she insists it's *only* values, ask her how she distinguishes between the removal of homosexuality (correcting a value error) and the lowering of hypertension thresholds (updating a risk calculation). Both involved value changes, but one was correcting a prejudice and the other was optimizing risk management. Strong Normativism struggles to distinguish between *progress* and *change*.
  4.  **The "So What?" Test:** Tell her, "If I tell my father his disease is a political artifact, he might stop taking medication and have a stroke. If the concept of disease is to be useful, it must track something real enough to guide action. Strong Normativism makes the concept useless for the patient, even if it's interesting for the sociologist."

  ### Summary Conclusion

  Your friend has correctly identified that **Strong Naturalism** is false. Medical categories are not discovered in nature like gold deposits; they are constructed to serve human ends.

  However, she has incorrectly concluded that **Strong Normativism** is the only alternative. The middle ground is that medicine identifies **biological risks** and applies **normative thresholds** to manage them.

  *   **Is there a fact of the matter?** Yes. The fact is your father's vascular system is under more stress at 132/84 than at 120/80, and his statistical risk of adverse events is higher.
  *   **Is the diagnosis a social decision?** Yes, in the sense that society has decided that level of risk warrants the label "disease" and the intervention "medication."
  *   **Is it arbitrary?** No, because the decision is constrained by biological data and a shared goal of health preservation.

  You can tell your father that his condition is "real" in the sense that the risks are real, even if the label is a tool we use to manage those risks. You can tell your friend that while she is right about the role of values, she is wrong to think this eliminates the biological constraints that make medicine more than just politics.
