prompt: |-
  A recurring move in computer science and adjacent writing runs like this: someone shows that a new substrate — a cellular automaton, a molecular computing scheme, a family of quantum circuits — can simulate a Turing machine; the result is announced as settling that substrate's computational power; and the moral drawn is that nothing new is computable, only that some things become faster. The same textbooks that make this move also insist that the Church–Turing thesis is not a theorem, that it admits of no proof, and that it concerns a pre-formal notion of effective computability. Meanwhile complexity theory defines feasible computation as polynomial time on a Turing machine, then treats the resulting class as a robust, model-independent feature of the world rather than an artefact of one idealised machine.

  What account of the thesis's epistemic status does this cluster of practices presuppose — that it is a stipulative definition of 'computable', an empirical hypothesis about human or physical computation, or a theorem about some formal notion that happens to track a pre-formal one? Reconstruct that implicit account, say which of its rivals the practices quietly rule out, and separate what they strictly presuppose from what they merely sit comfortably with. Are the parts mutually consistent — in particular, can one both deny that the thesis is provable and invoke it to close off hypercomputation and claims about what physical systems could in principle compute? Finally, say where the practices are philosophically underdetermined, and what would have to change — in what a universality result may be taken to establish, and in how feasibility is treated — if one adopted a straightforwardly stipulative reading of the thesis instead.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Observation:** CS writing often shows a new substrate simulates a Turing Machine (TM), claims this settles its computational power (nothing new computable, just speed), yet simultaneously admits the Church-Turing Thesis (CTT) is unprovable/concerns pre-formal notions. Also, Complexity Theory treats P-time on TM as robust/model-independent (feasibility), despite being based on a specific idealized machine.
      *   **Task 1:** Reconstruct the *implicit account* of the CTT's epistemic status presupposed by these practices. (Is it stipulative? Empirical? Theorem?)
      *   **Task 2:** Identify which *rival accounts* these practices quietly rule out.
      *   **Task 3:** Distinguish between what is *strictly presupposed* vs. what the practices merely *sit comfortably with*.
      *   **Task 4:** Assess *consistency*. Can one deny provability yet use CTT to rule out hypercomputation/physical limits?
      *   **Task 5:** Identify where practices are *philosophically underdetermined*.
      *   **Task 6:** Explain what would have to *change* (in universality results and feasibility) if one adopted a straightforwardly *stipulative* reading.

  2.  **Analyze the "Cluster of Practices":**

      *   *Practice A:* Universality proofs (Substrate X simulates TM) $\rightarrow$ Claim: "X computes nothing new."
      *   *Practice B:* Textbook disclaimer: "CTT is not a theorem, it's about pre-formal effective calculability."
      *   *Practice C:* Complexity Theory: P-time on TM = Feasible (robust, model-independent).
      *   *Tension:* If CTT is unprovable/pre-formal, how does Practice A settle computational power definitively? If TM is just one model, why is Practice C so confident in P-time as a physical/robust limit?

  3.  **Reconstruct the Implicit Account (Task 1):**

      *   It's not purely *stipulative*. If it were, "computable" just *means* "TM-computable." Then showing X simulates TM wouldn't prove X computes nothing *new* in a physical sense, it would just mean X fits the definition. But the text says "nothing new is computable," implying a claim about the world/capability, not just definitions.
      *   It's not purely a *theorem*. The texts explicitly deny this.
      *   It *acts* like an *empirical hypothesis* (about physics/human cognition) but is treated with the *authority* of a mathematical principle.
      *   *Synthesis:* It's a **Methodological Principle with Empirical Anchoring**. It treats the TM as the canonical standard because all *known* physical/formal systems map to it. It assumes a convergence between the formal (TM) and the physical/pre-formal (effective method).
      *   *Epistemic Status:* "Robust Conjecture." It functions as a regulative ideal.

  4.  **Identify Ruled-Out Rivals (Task 2):**

      *   *Platonism about Computability:* If computability were a discovered mathematical fact independent of humans/physics, CTT might be provable. The practices deny provability.
      *   *Radical Physicalism/Hypercomputation:* The practices rule out the idea that physical systems could fundamentally exceed TM power (since simulating TM "settles" the power).
      *   *Strict Formalism:* If it were strictly formal, the "pre-formal" disclaimer wouldn't exist.
      *   *Relativism about Models:* Complexity theory rules out the idea that "feasible" is entirely model-dependent (e.g., that analog computers might make NP problems easy in a way that matters physically).

  5.  **Strict Presupposition vs. Comfortable Fit (Task 3):**

      *   *Strictly Presupposed:*
          1.  There is a stable, pre-formal notion of "effective procedure."
          2.  The TM captures this notion adequately for *classification* purposes (computable vs. uncomputable).
          3.  Simulation implies equivalence of computational *power* (not just speed).
      *   *Comfortably Fits (but not required):*
          1.  That physics *actually* forbids hypercomputation (CTT could be true even if physics allowed hypercomputation, if we restrict "effective" to human-followable rules).
          2.  That P-time is the *exact* boundary of feasibility (it could be $n^{100}$, but the robustness claim fits comfortably).
          3.  That the brain is a TM (not strictly needed, just that whatever the brain does, it's TM-computable).

  6.  **Assess Consistency (Task 4):**

      *   *The Tension:* Denying provability (because it links formal to pre-formal/physical) while using it to close off physical hypercomputation.
      *   *Is it consistent?* Yes, *if* viewed as an abductive inference. We haven't found a counterexample despite looking. It's a "working truth."
      *   *The Conflict:* If it's unprovable because it concerns the *physical* world, then a universality proof (math) shouldn't settle the *physical* limit.
      *   *Resolution in Practice:* They conflate "Effective Computability" (human/algorithmic) with "Physical Computability" (what the universe can do). The practices presuppose these are co-extensive. If they are, the inconsistency dissolves. If they aren't, the practice is inconsistent.
      *   *Verdict:* It is *pragmatically* consistent but *logically* precarious. It relies on the hidden premise: "Physical Computability $\subseteq$ Effective Computability."

  7.  **Philosophical Underdetermination (Task 5):**

      *   What is "computation"? Is it syntax? Physics? Semantics?
      *   What is the modality of CTT? Is it necessary (math) or contingent (physics)?
      *   The practices don't specify *why* the TM is special. Is it human cognition? Fundamental physics? Mathematical structure?
      *   The gap between "simulates TM" and "computes nothing new" assumes simulation captures *all* relevant resources (time, space, energy), which it often doesn't (e.g., real-valued computing).

  8.  **Changes Required for Stipulative Reading (Task 6):**

      *   *If CTT is just a definition ("Computable = TM-computable"):*
      *   *Universality Results:* Showing Substrate X simulates TM only shows X is *computable* by definition. It does *not* show X cannot compute *more* (hypercompute). You would need to prove X *cannot* exceed TM, not just that it meets the baseline. The claim "nothing new is computable" becomes false/trivial. You'd have to say "Nothing new is *TM-computable*."
      *   *Feasibility (Complexity):* P-time becomes a property of the TM model, not necessarily the physical world. You couldn't claim robustness across analog/quantum systems without separate physical arguments. The "Invariance Thesis" (polynomial time is model-independent) would need explicit physical justification, not just CS hand-waving.
      *   *Hypercomputation:* Could not be ruled out *a priori*. It would be an open empirical question whether physical systems exceed the stipulative definition.

  9.  **Drafting the Response:**

      *   *Structure:* Follow the prompt's sequence.
      *   *Tone:* Analytical, philosophical, precise.
      *   *Key Terminology:* Effective calculability, Physical CTT, Invariance Thesis, Regulatives, Stipulative vs. Descriptive.

      *(Self-Correction during drafting)*: Make sure to distinguish between the "Original CTT" (effective methods) and the "Physical CTT" (what physics allows). The prompt conflates them in the "practices," so I need to highlight that conflation as the source of the epistemic ambiguity.
      *Refining the "Implicit Account":* It's best described as a **Convergent Empiricism**. It treats the thesis as an empirical generalization that has hardened into a definitional boundary for the field, without admitting it is a definition.
      *Refining the "Consistency" check:* The inconsistency lies in using a mathematical proof (simulation) to settle a physical question (hypercomputation) while admitting the bridge between math and physics (CTT) is unproven.

  10. **Final Polish:** Check against all constraints in the prompt.
      *   Reconstruct implicit account? Yes.
      *   Rule out rivals? Yes.
      *   Strict vs. Comfortable? Yes.
      *   Consistency check? Yes.
      *   Underdetermination? Yes.
      *   Stipulative reading consequences? Yes.

      (Proceed to generate output based on these thoughts.)
answer: |-
  The cluster of practices you describe reveals a specific, hybrid epistemic stance toward the Church–Turing Thesis (CTT). It is neither purely mathematical nor purely empirical, but functions as a **methodological regulative principle grounded in convergent empiricism**.

  ### 1. Reconstruction of the Implicit Account
  The practices presuppose that the CTT is a **robust empirical conjecture that has acquired normative force**.

  *   **Not a Theorem:** By admitting it concerns a "pre-formal notion," the practice acknowledges that CTT bridges the gap between formal syntax (Turing Machines) and semantic/physical reality (effective methods or physical processes). Since one cannot formally prove a link between a formal system and an informal intuition, it cannot be a theorem.
  *   **Not Merely Stipulative:** If "computable" were simply defined as "TM-computable," showing a new substrate simulates a TM would not settle its *power*; it would only show it meets the baseline. The claim that "nothing new is computable" implies a discovery about the limits of the substrate, not a tautology of definition.
  *   **The Implicit View:** The field treats the CTT as a **limiting case of inductive inference**. Because every proposed model of computation (lambda calculus, recursive functions, cellular automata, quantum circuits) has collapsed into the same equivalence class regarding *what* is computable, the community treats this convergence as evidence of a fundamental law. The TM is treated as the canonical representative of this equivalence class. Consequently, the thesis functions as a **default assumption**: the burden of proof lies entirely on the claimant of hypercomputation, while the assumption of TM-equivalence is treated as settled science.

  ### 2. Rival Accounts Quietly Ruled Out
  This pragmatic stance quietly excludes several philosophical alternatives:

  *   **Mathematical Platonism about Computability:** If computability were a mind-independent mathematical fact waiting to be discovered (like prime numbers), the CTT should be provable within a sufficiently rich formal system. The admission of unprovability rules this out.
  *   **Radical Physicalism (Hypercomputation):** The practice of treating universality proofs as "settling" computational power rules out the possibility that physical systems might fundamentally exceed TM power (e.g., via real-valued states or infinite precision in finite time). It assumes the physical world is discrete or effectively discrete in a way that respects TM bounds.
  *   **Model-Relative Relativism:** Complexity theory's treatment of Polynomial Time (P) as "robust" rules out the idea that feasibility is entirely relative to the chosen machine model. It rejects the notion that an analog computer might make NP-complete problems "easy" in a physically meaningful way that the TM model misses.

  ### 3. Strict Presuppositions vs. Comfortable Fit
  We must distinguish what these practices *require* to function from what they merely *tolerate*.

  **Strictly Presupposed:**
  1.  **Extensional Equivalence:** There exists a stable extension to the pre-formal concept of "effective procedure," and the TM captures this extension exactly.
  2.  **Simulation Implies Containment:** If Substrate $S$ simulates a TM, then the set of functions computable by $S$ is a subset of (or equal to) the TM-computable functions. (This ignores the possibility that $S$ simulates a TM *and* computes more).
  3.  **Invariance of Feasibility:** The class P is invariant across "reasonable" models of computation.

  **Merely Comfortable With:**
  1.  **The Mechanism of Convergence:** The practices do not require *why* all models converge (e.g., whether it is due to human cognitive limits, discrete spacetime, or logical necessity).
  2.  **Exact Boundary of Feasibility:** Complexity theory treats P as robust, but it sits comfortably with the idea that the exact polynomial degree might vary, provided it remains polynomial. It does not strictly require $O(n^2)$ to be feasible and $O(n^3)$ to be not; only the *class* matters.
  3.  **Physical Realizability:** The practices sit comfortably with the idea that some TM-computable functions are physically impossible due to resource constraints (energy/time), provided they remain *in principle* computable.

  ### 4. Consistency Check: Unprovability vs. Closing Off Hypercomputation
  **Are the parts mutually consistent?**
  Strictly speaking, **no**. There is a performative contradiction in the standard rhetoric.

  *   **The Contradiction:** One cannot consistently maintain that (A) the link between TMs and physical/effective computability is unprovable and pre-formal, while simultaneously asserting that (B) a mathematical proof of simulation (Substrate $S$ simulates TM) definitively settles the *physical* computational limits of $S$.
  *   **The Gap:** A mathematical simulation proof shows $TM \subseteq S$. It does not show $S \subseteq TM$. To claim "nothing new is computable," one must assume $S \subseteq TM$. This assumption *is* the CTT. If the CTT is unprovable, then the claim that $S$ computes nothing new is also unproven.
  *   **The Pragmatic Resolution:** The inconsistency is resolved only by conflating two distinct theses:
      1.  **Original CTT:** Concerns human-effective methods (algorithmic).
      2.  **Physical CTT:** Concerns what physical systems can compute.
      The practices treat these as co-extensive without justification. They deny provability for the Original CTT (since "effective method" is vague) but invoke the authority of the Physical CTT to rule out hypercomputation. This is consistent only if one assumes *a priori* that physical computation cannot exceed human-effective computation—an empirical claim treated as a logical constraint.

  ### 5. Philosophical Underdetermination
  The practices are underdetermined in two critical areas:

  1.  **The Modal Status of CTT:** Is the thesis necessarily true (a truth about logic/information) or contingently true (a truth about our specific universe's physics)? The rhetoric shifts between these. When dismissing hypercomputation, it sounds necessary ("that's not computation"); when discussing complexity, it sounds contingent ("polynomial time is feasible *in our world*").
  2.  **The Ontology of Computation:** Is computation defined by the *causal structure* of the physical system or the *interpretive mapping* of an observer? Universality proofs rely on mapping states. If computation is observer-relative, a substrate could be a TM under one mapping and a hypercomputer under another. The practices assume a "correct" mapping exists that reveals the "true" power, which is metaphysically loaded.

  ### 6. Consequences of a Stipulative Reading
  If the field adopted a **straightforwardly stipulative reading** (i.e., "Computable" *means* "TM-computable" by definition, with no claim about physics or pre-formal intuition), the practices would have to change significantly:

  *   **Universality Results:**
      *   *Current:* "Substrate $S$ simulates a TM, therefore $S$ is universal/nothing new is computable."
      *   *Stipulative:* "Substrate $S$ simulates a TM, therefore $S$ is *TM-computable*." This would **not** rule out hypercomputation. One would have to explicitly prove $S$ *cannot* exceed TM power. The claim "nothing new is computable" would be recognized as false or meaningless; the correct claim would be "nothing new is *TM-computable*." Hypercomputation would become a coherent, open category rather than a conceptual confusion.
  *   **Feasibility (Complexity Theory):**
      *   *Current:* P-time on a TM is treated as a model-independent physical limit.
      *   *Stipulative:* P-time would be recognized as a property of the *TM model*. Claims about physical feasibility would require separate **physical arguments** (e.g., thermodynamic limits, speed of light constraints) rather than appeals to TM complexity. The "Invariance Thesis" would no longer be a background assumption but a hypothesis requiring physical proof for each new substrate (e.g., proving quantum computers don't collapse P vs NP physically, not just formally).
  *   **Epistemic Humility:** The field would have to admit that TM theory describes a specific mathematical structure, not the limits of the universe. The "moral" of universality proofs would shift from "this substrate is bounded" to "this substrate is compatible with our standard formalism."

  In summary, the current practices rely on a **conflated authority**: they use the mathematical precision of the TM to lend weight to empirical claims about physics, while using the empirical success of the TM to shield the definition from mathematical scrutiny. A stipulative reading would sever this link, forcing computer science to explicitly argue for the physical limits of computation rather than assuming them via definition.
