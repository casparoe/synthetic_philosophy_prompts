answer: |-
  Good evening, everyone. Welcome to the King's Head. Welcome to the back room, the sticky tables, and the fifth anniversary of this experiment.

  Five years is a long time to keep arguing about nothing in particular. Usually, when a group lasts this long, it's because everyone agrees on everything. We haven't done that. We've done the opposite. We've fought. And because we've fought, we're still here.

  But I know why some of you are here tonight with your arms crossed. We need to talk about last month. We need to talk about Dave.

  For those who don't know—and I know there are a few of you—Dave was a regular for two years. He wasn't a bigot, he wasn't illegal, and sometimes, damn it, he was right. But he worked out a trick. He realized that if he insisted we debate whether certain people deserved to be in the room at all, we couldn't debate anything else. He didn't break the rules; he broke the game. Attendance dropped. People stopped coming.

  I invited Dave into this group two years ago. And last month, I pushed hardest to vote him out. I carry both of those things. I don't want your applause for removing him, and I don't want your pity for losing a friend. I want you to know that the weight of that contradiction is mine.

  Here is what I've been turning over in my head since then. There's an old philosophical puzzle about whether a tolerant society should tolerate the intolerant. It's a clever puzzle. But I think it confuses two different things. It confuses tolerating what someone *believes* with tolerating the *moves* they make in a conversation.

  In this room, your beliefs are unlimited. You can think anything. You can think the world is flat, you can think morality is a myth, you can think I'm an idiot. However awful, however wrong, however unpopular—that belief is welcome here. We are not in the business of policing thoughts.

  But the moves you make to share those thoughts? Those have limits.

  A conversation is a game we play together. It requires treating the other person as a participant, not a prop. It requires letting your claims be examined. If you make a move that refuses examination, or treats another person in this room as if they don't have the right to speak, you aren't arguing anymore. You're ending the argument. Dave didn't lose his seat because of what he thought. He lost it because he made a move that made it impossible for anyone else to play.

  Limiting the moves isn't a loophole in our openness. It's the thing that makes the openness real instead of a suicide pact. If we let anyone break the board whenever they're losing, we don't have a game. We just have a room full of people shouting at furniture.

  Now, I'm not standing here pretending we have a perfect rulebook. The line between "a move I disagree with" and "a move that breaks the game" is blurry. It's messy. We will get it wrong sometimes. We might kick someone out who should have stayed, or let someone stay who should have gone. But a room that never has to make that call is a room that's already stopped having arguments. It's a library. And libraries are wonderful, but they're not pubs.

  I know this vote cost us some people. I see some faces here tonight that haven't been here for a month. I know you left because you thought we drew the line in the wrong place. I'm not going to try to convince you I'm right. I'm just glad you're back for the anniversary. We need you. We need the people who worry about exclusion, because without you, we become a clique.

  So, here's to the next five years. May our beliefs be wild, may our moves be fair, and may we never be so polite that we stop arguing.

  Cheers.
