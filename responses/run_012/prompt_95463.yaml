  **JOINT STATEMENT ON THE INTERPRETATION OF BELL INEQUALITY VIOLATIONS**

  **Date:** October 26, 2023
  **Parties:** The "Ontic Nonlocality" Working Group (Camp A) and the "Operational Locality" Working Group (Camp B)
  **Subject:** Consensus and Dissensus Regarding the Implications of Bell Tests for Physical Locality

  ### I. AGREED CLAIMS

  We, the undersigned representatives of two distinct interpretive traditions in the foundations of quantum mechanics, hereby affirm the following points of consensus. These claims establish the empirical and formal common ground upon which our disagreement rests.

  1.  **The Formal Assumptions:** We agree that the derivation of the Bell inequalities relies on three primary assumptions: (i) **Local Causality** (expressed formally as the factorizability of joint probabilities given a complete specification of the past state $\lambda$); (ii) **Measurement Independence** (the statistical independence of the hidden state $\lambda$ from the future measurement settings $a$ and $b$); and (iii) **Realism** (in the sense that $\lambda$ determines probabilities for outcomes).
  2.  **Experimental Status:** We agree that loophole-free Bell tests (closing the locality, detection, and freedom-of-choice loopholes) have robustly demonstrated violations of the Bell inequalities. We agree these experiments rule out any theory that satisfies all three assumptions listed in Claim 1.
  3.  **The No-Signaling Theorem:** We agree that the quantum formalism satisfies the no-signaling condition (Parameter Independence). We agree that experimental data confirms that marginal probabilities for outcomes on one side do not depend on the setting choices made on the distant side.
  4.  **Compatibility with Relativity:** We agree that because the no-signaling condition holds, Special Relativity's prohibition on superluminal *signaling* and causal *controllability* is not violated. No protocol exists that allows entanglement to transmit information faster than light.
  5.  **Nature of the Dispute:** We agree that our disagreement is not about the empirical predictions of quantum mechanics, nor about the mathematical validity of Bell's theorem. The dispute concerns the *ontological significance* of the violation: specifically, whether the failure of factorizability necessitates a rejection of locality as a fundamental feature of the world, or whether it necessitates a rejection of classical explanatory expectations regarding correlation and separability.

  ---

  ### II. DISAGREEMENTS TABLE

  The following table catalogs the specific points of divergence. For each row, we identify the crux of the disagreement, state each side's position in their own preferred terminology, and record an agreed-upon theoretical test or thought experiment that bears on the issue.

  | # | Crux | Camp A (Ontic Nonlocality) Position | Camp B (Operational Locality) Position | Agreed Test / Thought Experiment | Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Significance of the Jarrett Decomposition** (Parameter vs. Outcome Independence) | The decomposition is mathematically valid but physically misleading. Factorizability is the atomic expression of Local Causality. Violating Outcome Independence (OI) while preserving Parameter Independence (PI) still implies a holistic connection that transcends spacetime separation. | The decomposition is physically fundamental. PI corresponds to causal influence (controllability), while OI corresponds to correlation. Preserving PI means preserving Locality; violating OI merely indicates the systems are not separable, not that they influence one another. | **Interventionist Causal Modeling:** Apply a formal causal discovery algorithm (e.g., Pearl's do-calculus) to the Bell scenario. Ask: Does modeling the correlation require a direct causal edge between distant outcomes? | **Camp A:** Yes. A causal edge is required to explain the dependency, even if it cannot be used for signaling.<br>**Camp B:** No. A common cause model (the entangled source) suffices if one abandons the requirement that the common cause screens off all correlations (Reichenbach's principle). |
  | **2** | **Definition of "Locality"** | Locality is **Bell's Local Causality**: events in one region should not depend on variables in a spacelike separated region, given a complete specification of the past. QM violates this. | Locality is **Signal Locality**: no physical effect can be exploited to transmit information superluminally. QM satisfies this. | **Semantic Analysis:** Determine if the term "nonlocal" is being used to describe *influence* (causal) or *structure* (correlational). | **Camp A:** The term refers to influence/dependence. The dispute is substantive.<br>**Camp B:** The term refers to influence/controllability. The dispute is largely verbal; we agree on the physics, disagree on the label. |
  | **3** | **Status of Superdeterminism** (Denial of Measurement Independence) | Superdeterminism is a logically possible but physically unmotivated "conspiracy." It saves Locality only by undermining the assumption of free choice required for experimental science. It should be rejected unless no other option exists. | Superdeterminism is unnecessary because Locality (in the signal sense) is already saved. Furthermore, it renders scientific inference impossible by correlating the observer with the system. It is not a live option for explaining Bell violations. | **The "Conspiracy" Test:** Evaluate whether a superdeterministic model requires fine-tuning of initial conditions to match quantum statistics across arbitrary future measurement choices. | **Camp A:** It requires extreme fine-tuning (conspiracy).<br>**Camp B:** It requires extreme fine-tuning (conspiracy). *Note: Both sides reject it, but Camp A sees it as the only way to save Bell-Locality, while Camp B sees it as unnecessary.* |
  | **4** | **Ontological Commitment** | The violation implies **Non-Separability**: the entangled pair is a single object regardless of spatial distance. This is a form of nonlocality in the structure of reality. | The violation implies **Contextuality**: properties are not defined prior to measurement. This is a failure of classical realism, not a failure of spacetime locality. | **The "Single System" Thought Experiment:** Treat the entangled pair as a single field excitation spread over spacetime. Does this description require action-at-a-distance? | **Camp A:** Yes, because the collapse/update happens instantaneously across the spread.<br>**Camp B:** No, because the field is one object; there is no "distance" within the object itself. |

  ---

  ### III. CLARIFICATION OF VERBAL VS. SUBSTANTIVE DISPUTES

  After rigorous cross-examination, we identify the following distinctions regarding the nature of our disagreement:

  1.  **The Definition of "Locality" (Verbal):** We acknowledge that a significant portion of our dispute stems from differing definitions of the word "local." Camp A defines it as *Factorizability* (Bell's definition). Camp B defines it as *No-Signaling* (Operational definition). Since both sides agree on the mathematical status of Factorizability (it fails) and No-Signaling (it holds), this specific conflict is terminological. We agree to henceforth distinguish between **Bell-Nonlocality** (Camp A's focus) and **Signal-Locality** (Camp B's focus).
  2.  **The Nature of "Causation" (Substantive):** The dispute regarding Outcome Independence (Row 1) is not merely verbal. It reflects a substantive disagreement about the nature of causation. Camp A adheres to a view where statistical dependence (given $\lambda$) implies a causal connection. Camp B adheres to an interventionist view where causation requires the possibility of manipulation (signaling). This is a philosophical disagreement about the metaphysics of causation that cannot be settled by quantum formalism alone.
  3.  **The Status of Superdeterminism (Substantive):** While both sides currently reject superdeterminism, we disagree on *why* it is rejected and what its rejection implies. Camp A views its rejection as forcing us to accept Nonlocality. Camp B views its rejection as irrelevant to the status of Locality, since they believe Locality is preserved via Parameter Independence regardless.

  ### IV. CONCLUSION AND SHARED RESEARCH AGENDA

  We recognize that this dispute will not be resolved by further Bell tests, as the empirical predictions are identical. Resolution requires progress in one of the following areas:

  1.  **Causal Discovery:** Developing a rigorous framework for causal inference that can distinguish between "nonlocal common cause" and "nonlocal influence" in quantum contexts.
  2.  **Quantum Gravity:** Investigating whether the spacetime structure emerging from a theory of quantum gravity privileges Bell-Locality or Signal-Locality.
  3.  **Reconstruction Axioms:** Determining whether Information-Theoretic reconstructions of QM (favored by Camp B) or Ontological reconstructions (favored by Camp A) provide a more fertile ground for unification with general relativity.

  We commit to continuing this adversarial collaboration, ensuring that future public communications distinguish clearly between the established empirical fact of Bell-inequality violation and the interpretive leap regarding the nature of physical locality.

  **Signed,**

  *Representatives of the Ontic Nonlocality Working Group*
  *Representatives of the Operational Locality Working Group*
