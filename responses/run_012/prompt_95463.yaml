      *   *Row 1: Decomposition Significance.*
          *   Camp 1: Artifact. Factorizability is the atomic concept.
          *   Camp 2: Significant. Distinguishes causation (PI) from correlation (OI).
          *   Crux: Is OI violation causal?
      *   *Row 2: Definition of Locality.*
          *   Camp 1: Local Causality (Bell's sense).
          *   Camp 2: Signal Locality (Operational sense).
          *   Crux: What does "Locality" mean? (Verbal dispute identification).
      *   *Row 3: Superdeterminism.*
          *   Camp 1: Unmotivated conspiracy, but logically possible to save locality.
          *   Camp 2: Undermines scientific inference, unnecessary given PI.
          *   Crux: Is it a viable physical hypothesis?
      *   *Row 4: Ontological Commitment.*
