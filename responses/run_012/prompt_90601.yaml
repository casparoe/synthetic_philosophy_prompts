      *   **Identify the Step:** Step (4).
      *   **Explain the Plausibility:** It mimics Step (3) perfectly. In strict dominance, removing opponent strategies preserves the strict inequality everywhere. It feels like weak dominance should behave similarly (inequality is $\ge$, removing options shouldn't make $\ge$ become $<$).
      *   **Explain the Fault:** Weak dominance requires strict inequality for *at least one* opponent profile. If you eliminate the opponent's strategy that provided the strict advantage, the domination relationship degrades to payoff equivalence. Once strategies are equivalent, you cannot eliminate one based on dominance anymore. Different elimination orders remove different "strict advantage" profiles, leading to different surviving sets.
      *   **Consequences of Rejection:**
