          *   *Verdict:* Keep.

      *   **Step (2):** Example of mixed strict dominance.
          *   *Status:* True. $0.5T + 0.5B$ yields $(1.5, 1.5, 3)$. $M$ yields $(1, 1, 1)$. $1.5 > 1$, $1.5 > 1$, $3 > 1$. So $M$ is strictly dominated by the mix, though not by $T$ or $B$ alone.
          *   *Verdict:* Keep.

      *   **Step (3):** Argument for path-independence of IESDS.
          *   *Status:* True. If $s_i$ is strictly dominated by $s'_i$ given opponent set $S_{-i}$, it remains strictly dominated if $S_{-i}$ shrinks to $S'_{-i} \subset S_{-i}$. The inequality holds for all $s_{-i} \in S_{-i}$, so it holds for all $s_{-i} \in S'_{-i}$. The order doesn't matter.
          *   *Verdict:* Keep.

      *   **Step (4):** "Now nothing in (3) turns on the word 'strictly'. Run the same argument with 'weakly dominated'..."
          *   *Claim:* "A weakly dominated strategy is never strictly better than its dominator against any profile, so a player who drops it gives up nothing; and by the reasoning of (3) the deletion cannot destroy the domination on which it rested."
          *   *Analysis:* This is the crux.
          *   *Strict Dominance:* $u(s', s_{-i}) > u(s, s_{-i})$ for all $s_{-i}$. If we remove some $s_{-i}$, the inequality still holds for the remaining ones.
          *   *Weak Dominance:* $u(s', s_{-i}) \ge u(s, s_{-i})$ for all $s_{-i}$, with strict inequality for *at least one* $s_{-i}$.
          *   *The Problem:* When we eliminate a strategy of an *opponent*, we might eliminate the *specific* profile against which the domination was strict.
          *   *Example:*
              *   Player 2 has strategies $L, R$.
              *   Player 1 has $T, B$.
              *   Payoffs for P1: $T$ vs $L=1, T$ vs $R=1$. $B$ vs $L=1, B$ vs $R=0$.
              *   $T$ weakly dominates $B$ (better against $R$, equal against $L$).
              *   Suppose $L$ is eliminated for Player 2 (perhaps weakly dominated for them).
              *   Now Player 2 only plays $R$.
              *   Against $R$, $T$ gives 1, $B$ gives 0. $T$ still dominates $B$.
              *   *Wait, let's look at the reverse.*
              *   Standard Counterexample for Order Dependence:
                  *   P1: $T, M, B$. P2: $L, R$.
                  *   $T$: (1, 1). $M$: (1, 0). $B$: (0, 1). (Payoffs for P1).
                  *   Actually, let's use the standard 2x2 coordination game or similar.
                  *   Let's look at the logic in (4) specifically. "Deleting further strategies only removes some of those profiles; it cannot manufacture a profile against which the struck-out strategy beats its dominator."
                  *   This part is true. It cannot make $s$ better than $s'$.
                  *   *However*, the definition of weak dominance requires strict inequality for *at least one* surviving opponent profile.
                  *   If the *only* profile where $s'$ was strictly better than $s$ is deleted (because an opponent's strategy was eliminated), then $s'$ no longer *weakly dominates* $s$ in the reduced game (it becomes payoff equivalent).
                  *   If they become payoff equivalent, $s$ is no longer "weakly dominated" in the technical sense required to justify elimination in the next round *based on that specific dominator*.
                  *   More critically: Path dependence arises because eliminating a weakly dominated strategy for Player 2 might remove the *reason* why Player 1's strategy $X$ was weakly dominated.
                  *   Let's check the text of (4): "the deletion cannot destroy the domination on which it rested."
                  *   *Correction:* It *can* destroy the "strict somewhere" condition. If $u(s', s_{-i}) \ge u(s, s_{-i})$ for all remaining $s_{-i}$, but equality holds for *all* remaining $s_{-i}$, then $s$ is not weakly dominated in the subgame; it is equivalent.
                  *   But does this break path independence? Yes.
                  *   Scenario:
                      *   P1 has $A, B$. P2 has $C, D$.
                      *   P1: $A$ weakly dominates $B$ (strict against $C$, tie against $D$).
                      *   P2: $C$ weakly dominates $D$ (strict against $B$, tie against $A$).
                      *   Path 1: Eliminate $B$ (P1). Then P2 faces only $A$. Against $A$, $C$ and $D$ are ties. $D$ is no longer dominated. Survive: $(A, C)$ or $(A, D)$.
                      *   Path 2: Eliminate $D$ (P2). Then P1 faces only $C$. Against $C$, $A$ strictly dominates $B$. Eliminate $B$. Survive: $(A, C)$.
                      *   Result: Path 1 leaves $\{A\} \times \{C, D\}$. Path 2 leaves $\{A\} \times \{C\}$. Different sets.
