  10. **Writing the Handout:**

      *   Must not say "Dark Forest".
      *   Tone: Clinical, strategic. "Civilization Management Simulation."

  11. **Final Polish of Rules:**

      *   *Survival:* Need 1 Energy/turn.
      *   *Growth:* Claim empty sector. Gain 3 Energy. +1 Visibility.
      *   *Visibility:* 0 = Safe. 1+ = Targetable.
      *   *Attack:* Pay 3 Energy. Target eliminated.
      *   *Talk:* Phase A (Free), Phase B (Costs 1 Energy to send).
