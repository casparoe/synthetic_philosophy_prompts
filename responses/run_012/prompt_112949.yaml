      *   70-90: Debrief.

      *Wait, 90 minutes is very tight for two full runs with 16 people.*
      *   I need to make the rounds fast. "Epochs" should be 3 minutes max.
      *   Run 1: 25 mins.
      *   Run 2: 25 mins.
