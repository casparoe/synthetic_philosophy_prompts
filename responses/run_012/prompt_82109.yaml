      *   *Case 6 (Brother/Memory):* Direct perceptual memory conflict. *Reaction:* Steadfast (certainty), but acknowledges lack of meta-justification.
      *   *Case 7 (Betting/Market):* Willingness to bet implies confidence. *Reaction:* Intuition that something is "off" (likely regarding common knowledge or rationality).
      *   *Case 8 (Sam/Steadfast Advice):* Self-referential paradox. *Reaction:* Acknowledges the paradox.

  3.  **Identify the Philosophical Framework:**
      *   The user is asking about the **Epistemology of Disagreement**.
      *   The two main camps are **Conciliationism** (specifically the *Equal Weight View*) and **Steadfastness** (specifically *Right Reason View* or *Total Evidence View*).
      *   *Conciliationism:* You must give significant weight to the peer's view.
      *   *Steadfastness:* You can stick to your guns if you think you're right (based on first-order evidence).
      *   *The Synthesis:* The **Total Evidence View** (often associated with David Christensen or Adam Elga, though they lean conciliationist, the "Total Evidence" label is often used by steadfasters like Kelly). Actually, the best fit for the user's intuitions is a **Weighted Confidence/Reliability Model** (Bayesian approach).

  4.  **Evaluate the User's Current Rule (Equal Weight):**
      *   The user correctly identifies that simple averaging fails. 90% vs 10% shouldn't necessarily mean 50%.
      *   It fails on "absurd" claims (Moon landing).
      *   It fails on "self-undermining" advice (Sam).

  5.  **Develop a Better Principle:**
      *   The core issue isn't just "peer status," it's **Expected Reliability conditional on the disagreement**.
      *   *Principle:* **Update based on the likelihood that the other person is right *given* that they disagree, weighted by your prior confidence in the evidence.**
      *   Actually, a more accessible formulation is the **"Reasonable Disagreement Principle"**: *Adjust your confidence proportional to the probability that the disagreement is due to their insight vs. their error, accounting for the strength of your original evidence.*
      *   Better yet: **The Weighted Evidence View.** Your belief should be based on *all* evidence, including the fact of disagreement. The fact of disagreement is *second-order evidence*.
      *   *Key Distinction:* First-order evidence (the spreadsheet, the memory) vs. Second-order evidence (my friend says I'm wrong).
      *   *Refined Rule:* **Give the other person's view weight proportional to their estimated reliability *on this specific type of question*, discounted by the strength of your first-order evidence.**

  6.  **Address the Specific Cases with the New Rule:**
      *   *Case 1:* Peer + Same Evidence -> High weight to disagreement. Move significantly.
      *   *Case 2:* Peer + Absurd Claim -> Low reliability estimate on this topic. Weight ~0. No move.
