answer: |-
  You have stumbled directly into one of the most active debates in modern epistemology (the study of knowledge). The two terms you were trying to recall are **Conciliationism** (specifically the *Equal Weight View*) and **Steadfastness** (often defended via the *Total Evidence View* or *Right Reason View*).

  *   **Conciliationism:** When a peer disagrees, you must significantly revise your belief, often splitting the difference.
  *   **Steadfastness:** You are permitted to stick to your guns if your original evidence was strong enough, treating the disagreement as just another piece of data that might be wrong.

  Your intuition that simple averaging (50/50) is wrong is correct. Even many Conciliationists reject the "Equal Weight View" in its strictest form because, as you noted, it implies that if you are 99% sure and a peer is 1% sure, you should drop to 50%. That throws away your first-order evidence (the spreadsheet, the logic, the memory).

  Here is the principle that unifies almost all your cases, the one reaction you need to drop, and how to calculate the "distance" you should move.

  ### The Unifying Principle: The Weighted Reliability View

  The rule is not "average your opinions." The rule is: **"Treat the fact of disagreement as evidence that you might be mistaken, weighted by the likelihood that the other person is reliable *on this specific topic*."**

  Disagreement is **second-order evidence**. It is evidence *about* your evidence.
  *   **First-order evidence:** The numbers in the spreadsheet, the memory of the ring.
  *   **Second-order evidence:** The fact that someone else looked at the same thing and saw something different.

  You update your belief by asking: *"Given that this person disagrees with me, what is the probability that I am the one who made the mistake?"*

  Here is how this rule handles your eight cases:

  1.  **Coworker/Spreadsheet:** You have equal reliability and equal access to evidence. The probability you made a calculation error is roughly equal to the probability they did. **Result:** Significant move toward the middle. (Matches your gut).
  2.  **Cousin/Moon Landing:** Your prior evidence for physics/history is massive. The probability that a peer is reliable *and* concludes the moon landing was faked is near zero. The disagreement is strong evidence that *he* is unreliable on this topic, not that you are wrong. **Result:** No move. (Matches your gut).
  3.  **Friend/Bad Track Record:** Their reliability weight is low based on past data. **Result:** Small move. (Matches your gut).
  4.  **Expert/Smarter:** Their reliability weight is high. **Result:** Large move. (Matches your gut).
  5.  **Two Peers/Collusion:** You have two data points, but they aren't independent variables. If they talked, their errors are correlated. You don't get double the evidence. **Result:** Move more than one person, less than two independent people. (Matches your gut).
  6.  **Brother/Ring:** (See "The Reaction to Drop" below).
  7.  **Betting:** If two rational people with the same information bet against each other, one is being irrational (violating *Aumann's Agreement Theorem*). The "off" feeling is your brain recognizing that you can't both be rational *and* disagree this sharply without new info. **Result:** You should actually be investigating *why* the bet exists, not just taking it.
  8.  **Sam/Steadfast Advice:** This is a self-referential paradox. Sam is giving you a policy rule. You can evaluate his policy rule using your standard epistemic rules. You can conclude his policy is bad (object level) while steadfastly holding your view on the topic (first order). **Result:** You reject Sam's advice without contradicting yourself.

  ### The Reaction You Must Drop: Case 6

  To have a clean, principled rule, **you have to give up your reaction in Case 6.**

  **The Case:** You and your brother disagree about a memory (drawer vs. box). You say you are "just certain," but admit you have *no reason* to think your memory is better than his.

  **Why you must drop it:** This is the only case where your intuition violates the principle of **indifference**. If you truly have no access to why your memory is superior (no reason to think you were more attentive, less stressed, closer to the object), then you cannot claim certainty. To say "I'm right and he's wrong" without a differentiator is dogmatism, not confidence.

  In philosophy, this is the "Uniqueness Thesis" vs. "Permissivism" debate. But in your specific framing ("I've got nothing" to justify your superiority), the rational move is **suspension of judgment**. You should check the box *and* the drawer, or assign a probability (e.g., 60% box, 40% drawer). Claiming 100% certainty without meta-justification is the one reaction that breaks the system.

  ### Is There a Principled Way to Say "How Far"?

  Yes. It is **Bayesian Updating**, though you don't need to do the math explicitly. You can use this heuristic:

  **Move until your confidence equals the probability that you are the one who erred.**

  *   **Scenario:** You are 90% sure.
  *   **Assessment:** You estimate your peer is 80% reliable on this topic.
  *   **Calculation:** If you are both fallible, the disagreement suggests there is a significant chance *you* are in the 10% error margin or *they* are in the 20% error margin.
  *   **The Move:** You don't go to 50%. You go to a place that reflects the combined reliability. If you trust yourself 90% and them 80%, you might land at 75%.

  **The "How Far" depends on three variables:**
  1.  **Prior Confidence:** How strong was your evidence before they spoke? (Stronger prior = less movement).
  2.  **Estimated Peer Reliability:** How good are they at *this specific thing*? (Higher reliability = more movement).
  3.  **Independence:** Did they form their view independently? (Independent = more movement; Colluded = less movement).

  ### A New Case to Test Your Gut

  Here is a case where your intuition might be messy, but the rule clarifies it:

  **The Fatigue Case:**
  You and a peer (usually equally skilled) are proofreading a document. You have been working for 8 hours straight; they just started 30 minutes ago. You say there is no error on page 5. They say there is a typo.

  **Your Gut:** You might feel stubborn because you "know" you checked it, but you also know you're tired.
  **The Rule's Verdict:** You must move **significantly**, more than in Case 1 (Coworker).
  **Why:** Your *Estimated Reliability* has dropped due to fatigue. Even if you are usually peers, you are not peers *in this moment*. The disagreement is strong evidence that your fatigue caused an oversight. You should defer to them almost as much as in Case 4 (Expert), because on a tired brain vs. fresh brain, the fresh brain is the expert.

  ### Summary of the Rule

  1.  **Don't Average:** Don't split the difference blindly.
  2.  **Weigh Reliability:** Treat the disagreement as evidence of error, scaled by how likely the other person is to be right *about this*.
  3.  **Drop Dogmatism:** If you can't explain why you're more reliable than the other person (Case 6), you cannot claim certainty.
  4.  **Update Bayesianly:** Move your confidence to match the probability that *you* are the mistake-maker.

  This approach lets you be steadfast on moon landings (low peer reliability), conciliatory on spreadsheets (high peer reliability), and skeptical of your own memory when you're tired (low self-reiability), without contradicting yourself.
