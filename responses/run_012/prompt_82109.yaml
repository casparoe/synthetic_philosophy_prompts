      *   *Decision:* Advise dropping the "no move" intuition in Case 6.

  8.  **Address the "How Far" Question:**
      *   Is it guessing? No, it's **Bayesian Updating**.
      *   Formula concept: Posterior Odds = Prior Odds × Likelihood Ratio.
      *   Simplified: Move until your confidence matches the probability that *you* are the one who made the mistake.

