          *   *Companions:* Rank as Serious. It challenges the idea that "counterfeit" implies "harmful." If the user knows it's counterfeit and benefits, is it wrong?
          *   *Legal Personhood:* Rank as Awkward. It's a category error. Legal personhood isn't moral personhood.
