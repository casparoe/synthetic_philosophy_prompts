      The nomological reading of the wavefunction is not a stable third position; it ultimately collapses into ontic realism. While proponents present it as a via media between treating the wavefunction as a physical field and treating it as mere information, this distinction dissolves under metaphysical scrutiny. If one insists, as the nomological view does, that laws of nature are robustly real features of the world, then assigning the wavefunction to the category of "law" does not diminish its ontological status; it merely specifies its mode of existence.

      Ontic realism is broadly defined as the claim that the wavefunction represents a mind-independent feature of reality. The nomological view agrees entirely: the wavefunction exists independently of human belief and governs physical systems objectively. The disagreement rests solely on whether this feature is categorized as "stuff" (entity) or "rule" (law). However, this categorization is secondary to the primary metaphysical commitment: mind-independent existence. To claim the wavefunction is a real law is to claim it is part of the furniture of the universe. If the furniture includes rules as well as objects, the view is ontically realist. To deny this is to rely on an antiquated substance metaphysics where only material particulars are "real," a premise the nomological proponent explicitly rejects by granting reality to laws.

      Consider the objection that wavefunctions are contingent and time-dependent, whereas laws are general and immutable. This challenges the nomological view's coherence, not its distinction from ontic realism. In Bohmian mechanics, the universal wavefunction is unique and fixed, satisfying the immutability criterion. Even if contingent, a feature that objectively governs dynamics is ontologically robust. The Pusey-Barrett-Rudolph theorem mentioned in the prompt assumes the wavefunction is a state of a system. If the nomological view rejects this premise, the theorem does not apply. However, this evasion highlights the instability: if the wavefunction is not a state of the system but governs the system, it remains an external, mind-independent determinant of physical behavior. Whether we call this determinant a "field" or a "law," it occupies the same ontological slot: a real, non-epistemic constraint on nature.

      Consequently, the nomological view is not a third option but a subtype of ontic realism. It avoids the epistemic view because it grants mind-independent status. It avoids being a distinct category because "real law" is a subset of "real thing." The only way to maintain a distinct third position is to argue that laws are real but not ontic. But this requires defining "ontic" so narrowly as to exclude laws of nature from reality, which is verbally stipulative rather than substantively metaphysical. If laws are real, they are ontic.

      The strongest objection to this verdict is that collapsing laws into ontology obscures the crucial explanatory asymmetry between governors and the governed. Laws dictate behavior; entities exhibit it. By classifying the wavefunction as ontic, we risk reifying a rule into a thing, thereby confusing the dynamic structure of the theory with its material content. This confusion could hinder physical understanding, leading us to search for the "stuff" of the wavefunction rather than understanding its governing role.

      However, this objection conflates functional role with ontological category. General relativity treats the metric field as both a dynamic entity and a governing structure for spacetime geometry. Physics routinely accepts structures that are both object-like and law-like. Recognizing the wavefunction as ontic does not require treating it as a material fluid; it requires acknowledging it as a real structural feature. The explanatory asymmetry remains intact regardless of the label. Whether called "law" or "entity," the wavefunction's job is to constrain particle motion. Acknowledging this constraint as a mind-independent reality is the essence of ontic realism. Thus, the nomological reading is simply ontic realism with a specific metaphysical flavor, not a stable alternative.

