answer: |-
  Good evening. It is a particular thing to stand here after eleven years of sitting beside someone. You learn the rhythm of a colleague's breathing, the way they hold a pen, the specific weight of their silence. You learn who they are when the work is easy, but mostly you learn who they are when the work is hard. We are gathered to honor integrity under pressure, and I want to suggest that the pressure we mean is not the deadline or the budget. It is the pressure of knowing that doing the right thing might break the very structure you are standing on.

  I know there are people in this room who know the history of this award better than most. There are those who stayed through the final years, and those who left before the end. There are those who knew what was happening in a general way, and those who knew the specifics. I count myself among the ones who knew enough to speak and chose instead to wait. I tell you this not to turn this evening into a confession, but because I think honesty about our limitations is the only solid ground on which to praise someone else's courage. If I stand here claiming a moral authority I do not possess, I insult the very virtue we are celebrating. So I stand here as a witness, not a judge. My standing is discounted, perhaps, but my testimony remains true.

  We often comfort ourselves with the idea that silence is prudence. We tell ourselves we were waiting for the right moment, or that speaking too soon would have done more harm than good. Sometimes that is true. Sometimes waiting is wisdom. But sometimes, if we are honest, we know it is fear wearing the mask of strategy. I look around this room and I see decent people. I see people who loved this organization and wanted to protect it. I know that because I was one of them. It is easy to look back and see cowardice where others saw prudence, and I do not entirely trust that difference. What I know for certain is that decency alone is not enough. Good people can preside over bad outcomes simply by refusing to act.

  That is why this award matters. It is not for being good. It is for being willing to be the one who acts when being good is no longer sufficient.

  For her family, I want to say that you know her as a sister, a mother, a friend. You know her kindness. But tonight we honor the moment she put her name to the file. We know what that file did. It brought the business down. It ended careers. It shattered the quiet comfort many of us had negotiated for ourselves. To do that requires a kind of strength that is not comfortable to be around. It is not the strength of a hero in a story; it is the lonely, administrative strength of signing a document when you know everything will change the next day.

  There is a question about who has the right to speak truth. Does the messenger need to be clean for the message to land? I do not know the answer. I only know that if I do not say this, no one who was there will. She did not wait for permission. She did not wait for someone with cleaner hands to step forward. She saw what was required and she did it.

  So I offer this award with humility. I offer it knowing that my voice carries the weight of my own silence. I offer it knowing that some of you hear my words and hear what I am not saying. But I also offer it with the hope that truth does not require perfection to be heard. We are here to recognize that she carried the burden we all set down. She accepted the cost we all calculated and rejected.

  To her family, know that her courage was not an absence of fear, but a refusal to let fear decide. To my colleagues, know that integrity is not a reputation you keep; it is a choice you make when keeping your reputation is no longer the point. And to her, I say only this: you did what was necessary. You let the rest of us see what we looked like when we did nothing. That is a hard gift to receive, but it is the only one that matters. We are honored to give this to you, not because we are worthy of giving it, but because you are worthy of receiving it. Thank you.
