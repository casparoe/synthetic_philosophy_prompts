  **Case Study: The "Approved Joint" (HVAC Sheet Metal)**

  In a specialized historic retrofit project, the Lead Installer certifies duct connections as "Approved Joints." There are three clear cases everyone accepts. **Joint A** is Sealed and Aligned but Uncoated. **Joint B** is Aligned and Coated but Unsealed. **Joint C** is Coated and Sealed but Misaligned. Every pair shares a feature (A&B share Alignment; B&C share Coating; A&C share Sealing), but no single feature is present in all three. The Lead Installer accepts all three as Approved, citing that each compensates for its missing trait with the other two.

  Now consider **Joint D**. It matches Joint A's profile (Sealed and Aligned, Uncoated), but differs in one respect: the **Bevel Angle**. Joint A has a 15° bevel; Joint D has a 45° bevel. Note that Joint B (Coated) also has a 45° bevel and is Approved. The Lead Installer rejects Joint D as "Not Approved." However, if you swap Joint D's 45° bevel for a 15° bevel (creating **Joint E**), the verdict flips to Approved. The Bevel Angle is the only variable changing between D and E, yet it determines the classification despite not being a necessary condition for the clear cases (since Joint B tolerates 45°).

  This setup isolates the classification logic. The clear cases form a triangle of overlapping traits with no common core. The test cases (D and E) hold the trait cluster constant while varying a single feature whose weight shifts depending on the cluster. The verdicts rely on the Installer's judgment of structural integrity rather than a written code, ensuring the practice is real but not rule-bound by fiat.

  ***

  **Demonstration of Views**

  **The Classical Definition Theorist** is forced into a corner. They cannot posit a single necessary condition (e.g., "All Approved Joints must be Sealed") because Joint B is Approved and Unsealed. They might attempt a conditional definition ("If Uncoated, then Bevel < 30°"), but this smuggles in the very cluster-dependence the Classical view denies. They are not permitted to say "we don't know yet" because the Installer's verdict is final for the practice; they must either say Joint D is a different term entirely (which contradicts the shared practice) or admit the definition is disjunctive.

  **The Family Resemblance Theorist** fits the case naturally. They argue that "Approved Joint" is held together by overlapping crisscrossing similarities, not a common essence. Joint D fails not because it lacks a necessary feature, but because the 45° bevel breaks the specific network of compensation that makes Joint A work. The weight of the Bevel feature is context-sensitive: it matters critically for Uncoated joints (A/D) but less for Coated ones (B). This explains why the verdict moves for D/E but stays stable for B without requiring a universal rule.

  **The Prototype Theorist** struggles slightly but can adapt. They would posit a "best example" (perhaps a joint with all three features, even if none exist in the clear set, or an average of A, B, C). Joint D is less similar to the prototype than Joint E. However, this view risks implying there is a central "ideal joint" that the practitioners are approximating. If the practitioners explicitly deny there is an ideal (insisting A, B, and C are equally good), Prototype theory must stretch to explain why D is worse than A despite A lacking Coating. It lands on the same verdict as Family Resemblance (D is Out) but for a different reason (distance from center vs. breakdown of overlap).

  **The Disjunctive-Definition Fallback** attempts to save Classical theory by writing the extension as: (Sealed & Aligned) OR (Aligned & Coated) OR (Coated & Sealed). Joint D fits the first disjunct (Sealed & Aligned), so this view predicts Joint D should be Approved. It fails to capture the Bevel constraint unless the disjunction becomes infinitely complex (e.g., "(Sealed & Aligned & Bevel<30) OR..."). If they add the Bevel constraint, they trivialize the Family Resemblance claim by turning every contextual weighting into a new disjunct, losing the explanatory power of *why* the features cluster.

  ***

  **Critique and Load-Bearing Analysis**

  The load-bearing feature is the **Bevel Angle**. If you remove the Bevel variation (make all joints 15°), Joint D becomes identical to Joint A, and the philosophical tension vanishes—the case collapses into a simple example of equivalence. The Bevel proves that feature weight is not intrinsic but relational to the cluster.

  The strongest line of attack comes against the **Disjunctive-Definition Fallback**. A clever student will argue that any Family Resemblance case can be retrofitted into a disjunction ("It's either A-type or B-type or C-type..."). The counter-argument here is predictive power: the Disjunctive view cannot predict the verdict on Joint D without prior exposure to D, whereas the Family Resemblance view explains *why* D fails based on the existing network of A, B, and C (the compensation mechanism).

  **Stipulation Flag:** The case risks stipulating verdicts if the Lead Installer's reasoning isn't grounded in the physical reality of the trade. If students ask "Why does Bevel matter only for Uncoated joints?", the answer must be physical (e.g., Uncoated metal expands more at sharp angles), not merely authoritative. If the reasoning is purely "because the Installer says so," the case becomes a rule-following paradox rather than a conceptual analysis of resemblance. Ensure the seminar emphasizes the *physical justification* for the weighting to avoid this cheat.
