answer: |-
  You are not dressing up an annoyance in fancy clothes. You have identified a specific mechanical failure in the theory of "libertarian paternalism" that often gets glossed over in the popular literature.

  The short answer is that you are describing the weaponization of **Sludge**, compounded by a condition political philosophers call **Domination**.

  However, since you asked for the carving rather than just the label, let's break this down into the three distinct layers you are sensing: the behavioral layer, the economic layer, and the power layer.

  ### 1. The Behavioral Layer: Sludge vs. Nudge
  You are correct that "Nudge" (Thaler & Sunstein) is not quite it. A nudge is a change in the *choice architecture* that alters behavior in a predictable way without forbidding options or significantly changing economic incentives. The classic example is putting fruit at eye level in a cafeteria.

  The counterpart to the Nudge is **Sludge**. This term was popularized by the same authors (specifically Sunstein in *Sludge: What Stops Us from Getting Things Done?*). Sludge is excessive or unjustified friction that makes it harder to execute a transaction or choice.

  *   **Where your observation fits:** Standard Sludge theory often treats friction as bureaucratic inertia, incompetence, or a well-meaning "cooling off" period.
  *   **Where your observation differs:** You are identifying **Strategic Sludge**. In your scenario, the friction is not a byproduct of bureaucracy; it is the product. The institution is not just *allowing* friction to exist; they are actively maintaining the viscosity of the exit because the viscosity has a yield.
  *   **The Edge:** If the form is long because of a legal requirement (third-party constraint), it is *Compliance Burden*. If the form is long because the institution designed it to be long to reduce churn, it is *Strategic Sludge*.

  ### 2. The Economic Layer: Strategic Switching Costs
  In microeconomics and industrial organization, this is known as **Switching Costs**. These are the costs a consumer incurs to change from one supplier to another.

  *   **Where your observation fits:** You are describing high switching costs.
  *   **Where your observation differs:** Economists often treat switching costs as market features (e.g., "I bought the Apple ecosystem, so leaving is expensive"). You are noticing **Artificial Switching Costs**.
      *   *Natural Cost:* "I have to learn new software."
      *   *Artificial Cost:* "I have to fax a form during business hours."
      *   *The Crucial Variable:* You noted that the beneficiary *sets the price*. In economics, this is a form of **Hold-Up Problem**. Once you are in the system (the default), they have you in a temporary monopoly position and can extract rent by raising the price of exit.
  *   **The Edge:** If the cost is "frozen" (e.g., a fixed early-termination fee disclosed in a contract), it is a **Price**. It becomes the phenomenon you are describing when the cost is **Procedural and Malleable**. A fee is transparent; a phone tree that changes its menu structure quarterly is opaque and mutable.

  ### 3. The Power Layer: Domination (The Most Important Carving)
  This is likely the philosophical "itch" you are feeling. In political philosophy (specifically Republican Theory, championed by Philip Pettit and Quentin Skinner), there is a distinction between **Non-Interference** and **Non-Domination**.

  *   **Non-Interference (Liberal View):** You are free if no one stops you. Since the institution lets you leave (the form exists), you are free. This is the defense the institution uses ("Nobody is stopping you").
  *   **Non-Domination (Republican View):** You are free only if no one has the *arbitrary power* to interfere with you, even if they don't exercise it.

  Your specific annoyance—"they can change all of that next quarter without telling me"—is the definition of **Arbitrary Power**. Even if the phone line is open today, the fact that *they* decide unilaterally whether it opens tomorrow, and they profit from it being closed, means you are in a state of **Domination**.

  You are not coerced (they aren't threatening you), but you are **subordinate**. The option is real, but it is held at their discretion.

  ### The Synthesis: "Arbitrary Administrative Friction"
  There isn't one single word that captures the *malleability* of the friction owned by the beneficiary, but the most precise carving is **Unilateral Exit Friction**.

  Here is how we answer your boundary conditions based on this carving:

  **1. Does it stop being this if the exit cost is set by a third party?**
  **Yes.** If a regulator requires the form to be printed and mailed for security reasons, the institution no longer owns the friction. The "profit from staying put" is decoupled from the "cost of leaving." This moves it from *Strategic Sludge* to *Regulatory Burden*. The moral quality changes because the entity benefiting from your inertia is not the entity setting the price of motion.

  **2. Does it stop being this if the cost is high but frozen?**
  **Partially.** If there is a fixed $500 fee to leave, that is a **Price**. It is transparent and stable. You can budget for it. The phenomenon you are describing relies on **Uncertainty** and **Opacity**. The ability to change the rules "next quarter" prevents you from calculating the cost of exit, which effectively raises the cost infinitely for anyone risk-averse. Frozen costs are taxes; mutable procedural costs are tolls set by a gatekeeper who can raise the bar while you are jumping.

  **3. Does it stop being this if I never really wanted to leave?**
  **No, but the harm is latent.** This is the difference between *actual* harm and *structural* vulnerability. If you stay in the expensive fund because you like it, you haven't been harmed *yet*. However, the *capacity* for the institution to trap you if your preferences change is the violation. In the Republican philosophy sense, you are unfree even if you are happy, because your continued happiness is subject to their whim. You are a guest, not a citizen.

  ### Summary for your Reading Group
  If you want to bring this back to your group, you can frame it this way:

  > "Nudge theory assumes the Choice Architect is a benevolent planner. **Sludge** acknowledges friction exists. But neither fully accounts for **Adversarial Choice Architecture**, where the Architect has a fiduciary interest in the friction itself, and retains **Arbitrary Power** to adjust that friction without notice. It isn't coercion, because the door isn't locked. It's **Domination**, because they hold the key and can change the lock whenever they like."

  You aren't imagining it. It is the dark substrate of the "libertarian" part of libertarian paternalism: the freedom to leave is meaningless if the price of the ticket is set by the person selling the ride.
