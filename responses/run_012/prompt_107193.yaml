prompt: |-
  I'm putting together a handout for a consciousness seminar and I want a decision tree for the color phi phenomenon — two dots flashed in quick succession (blue up top, red down below) and subjects report a single dot moving and switching color halfway along the path, so they seem to see the red before the second dot is even on screen. Build the tree so it starts from a student who accepts that report and ends at a named position on the timing of experience. Each branch node should be one of the commitments that actually splits the camps, worded so a student can answer without knowing where it lands them: is there a fact of the matter about when a bit of experience occurs, independent of what the subject can later remember or say? If so, is the editing done to the experience itself or to the memory of it (the Stalinesque/Orwellian fork)? Is the report even about an experience, or about a judgement? And whatever else you think earns a place. Leaves should be named positions — Stalinesque, Orwellian, multiple-drafts, deflationary no-fact-of-the-matter, higher-order/judgement, and the low-level "nothing needs editing, its just feature binding" option — each with one sentence on its most awkward commitment. Flag any leaves the tree cant really separate (I suspect Stalinesque and Orwellian are one such pair) and say whether the empty combinations are empty because they're incoherent, unattractive, or just unexplored.
