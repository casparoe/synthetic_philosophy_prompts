answer: |-
  **1. The Definition of the Lie**
  **Question:** Your defense rests on Augustine's claim that the lie resides *contra mentem*—against the mind—rather than *contra veritatem*—against the truth. This implies that a speaker who utters a falsehood they sincerely believe to be true is innocent, while a speaker who utters a truth they believe to be false is guilty. Does this reduce lying from a violation of reality to a purely subjective failure of internal integrity?
  **Follow-up:** You will likely answer that the sin is in the will's disloyalty to its own knowledge. But if integrity is the virtue being protected, why is the "integral" will forbidden from prioritizing the preservation of an innocent life over its own internal consistency? Is the soul's cleanliness truly more valuable than the neighbor's survival?

  **2. The Boundary of Misleading**
  **Question:** Augustine permits speaking a truth in order to produce a false belief, provided one does not assert what one thinks is false. In a context of persecution, isn't this merely a semantic loophole? If my intent is to deceive the pursuer, is my heart not still "double," even if my words are technically true?
  **Follow-up:** You will likely argue that the speaker is not asserting against their mind, but allowing the listener to deceive themselves. But if I know with certainty that my true statement will cause your false belief, haven't I willed your deception just as much as if I lied? Where exactly is the moral difference in the *will*?

  **3. The Exception of Jokes**
  **Question:** In *On Lying*, Augustine sets jokes aside, arguing they are not lies because the joker's tone and manner make plain that they mean no deceit. But if a child hears a joke and takes it literally, Augustine suggests the joker bears no guilt. Does this imply that the moral status of the act depends on the listener's uptake, not just the speaker's heart?
  **Follow-up:** You will likely reply that the speaker's intent is clear to the *community* of understanding, and the child's misunderstanding is irrelevant. But if the moral license relies on a "community of understanding," isn't lying a social contract rather than an internal state? Why isn't the "community of resistance" available to the protector hiding a refugee?

  **4. Scriptural Rewards: The Hebrew Midwives**
  **Question:** In Exodus, the Hebrew midwives deceive Pharaoh and are explicitly rewarded by God. Do you classify this as a lie that was sinfully committed but providentially rewarded, or do you argue it wasn't a lie at all?
  **Follow-up:** You will likely lean toward Augustine's later view that it was a lie not to be imitated, or that the reward was for their fear of God, not their deceit. But if the text explicitly says God built them houses *because* they feared God *and* deceived, does attributing the reward solely to their fear exegetically sever the narrative link?

  **5. Scriptural Faith: Rahab**
  **Question:** Rahab is commended in Hebrews 11 for faith, yet her faith was expressed through the deception of the King of Jericho. If we separate her faith from her lie, are we not dissecting the moral agent in a way Augustine resists?
  **Follow-up:** You will likely argue we must distinguish the virtue (faith) from the vice (lying), and she is saved *through* the faith, not *for* the lie. But if the lie was the necessary instrument of the faith in that moment, can the will truly be divided? Is a faith that refuses to lie when lying is the only means of protection actually a weaker faith?

  **6. Institutional Deception: The Priscillianists**
  **Question:** In *Against Lying*, Augustine rejects the proposal that Catholics pretend to be Priscillianists to infiltrate the sect. Yet we accept undercover police work to stop murderers. Is the difference merely ecclesiastical authority, or does the end never justify the means?
  **Follow-up:** You will likely maintain that the end never justifies the means, perhaps distinguishing public authority from private action. But if public authority legitimizes the deception, does the wrongness still reside in the speaker's will, or does it shift to the authorization? If the latter, isn't the "corruption of the will" contingent on social role?

  **7. The Charity of Silence**
  **Question:** Consider the homeowner hiding refugees during a genocide. Silence reveals them; truth betrays them. You argue the lie corrupts the homeowner's soul. But does the refusal to lie, resulting in betrayal, not corrupt the homeowner's charity? Which corruption is more fundamental to the Christian will?
  **Follow-up:** You will likely insist the lie is a direct offense against God as Truth, while betrayal is a consequence. But if God is Love, and I choose "Truth" (propositional accuracy) over "Love" (saving the neighbor), have I not prioritized an attribute of God over the command of God? Is the "double heart" not actually a heart divided against Charity?

  **8. The Absolute Limit**
  **Question:** You defend an absolute prohibition. Is there *any* conceivable counterfactual—divine command, apocalyptic scenario, metaphysical shift—that would make a lie permissible, and if so, what would that condition have to be?
  **Follow-up:** You will likely answer "no," because lying is contrary to the nature of speech and God. But if the answer is truly "no," does this make the prohibition a logical necessity rather than a moral one? And if it is logical, is the liar insane rather than sinful?
