answer: |-
  **Principle:** God can do anything logically possible, but cannot act against His own perfect, necessary nature.

  **How It Works:**
  This splits your gut calls into two buckets based on *why* He can't do them.

  1.  **Logical Impossibility:** The stone, square circles, 2+2=5, and making a free creature guaranteed sinless are nonsense. They aren't tasks; they are contradictions. Your case about making a creature more powerful fits here too; you can't have two "maximums."
  2.  **Natural Impossibility:** Lying, cruelty, forgetting, or ending existence are real actions for humans, but impossible for God. They contradict His nature. He isn't too weak to lie; He is Truth, so lying isn't an option for Him any more than burning is an option for ice. This covers your intuition that He can't break promises or be cruel, not because of external rules, but because of who He is.

  **The Second God:**
  No. If God is truly unlimited, there cannot be two. It's like asking for two "biggest numbers." If the second being is unlimited, they are identical to the first. If distinct, one limits the other, meaning neither is truly unlimited. This falls into the logical impossibility bucket.

  **What Gets Thrown Out:**
  To keep this consistent, you must surrender your distinction between the "stone" and "lying." You said the stone isn't a task, but lying is a real thing people do. This principle says that for God, lying *isn't* a genuine task either. It treats moral impossibilities like logical ones: not limits on power, but limits on coherence. You also must stop going back and forth on changing the past; this principle says rewriting history is logically contradictory (what is done cannot be undone), so it's impossible, not just something He won't do.

  This preserves your gut on power and morals while grounding them in reality rather than arbitrary rules. It treats God's limits not as weaknesses, but as the strength of His consistency.
