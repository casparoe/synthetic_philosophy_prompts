answer: |-
  Here are 10 interview questions designed to probe the nuances of weak anti-reductionism, including the required topics and follow-ups.

  **1. The Child-Learning Case**
  A classic argument for your view is the developmental one: children acquire massive amounts of knowledge before they have the cognitive capacity to assess a speaker's reliability. You argue this shows we don't need positive evidence to be entitled to belief. But a reductionist might say this just proves children are held to a looser epistemic standard, not that adults don't need evidence. Why does the child's entitlement carry over into mature adulthood rather than being a temporary scaffold we outgrow?

  **2. Follow-up to Q1 (The Child Case)**
  *Likely Reply:* She will likely argue that the default entitlement is a basic feature of rational agency, not just a developmental phase, and that adulthood adds *defeaters* but doesn't remove the *default*.
  *Follow-up:* If the mechanism is the same, why does the adult's cognitive landscape look so different? Adults have inductive histories and conceptual tools children lack. If you insist the *entitlement* is identical, aren't you ignoring the fact that adults have a responsibility to use those new tools that children simply don't have yet?

  **3. The One-Shot Stranger**
  Let's look at the "one-shot stranger" case. I meet someone on the street with no track record, no credentials, and no way to verify their identity. They tell me a true fact about local history, and I have no defeaters. On your view, am I justified? More importantly, do I *know* it? It feels like if they had lied, I would have believed them just the same.

  **4. Follow-up to Q3 (The One-Shot Stranger)**
  *Likely Reply:* She will likely say yes, it is knowledge, provided the belief is true and there are no actual defeaters in the environment, satisfying a "no-defeater" condition.
  *Follow-up:* That sounds like you're relying on a safety condition: in nearby possible worlds where the stranger lies, do you still believe? If your entitlement is truly independent of the speaker's reliability, then in those nearby worlds where they lie, you still believe. Doesn't that make your true belief here a matter of luck, which is usually anathema to knowledge?

  **5. Unequal Credibility and Social Bias**
  I want to press on the social application of the "default entitlement." In reality, credibility is handed out unequally. Marginalized groups often face "false defeaters"—hearers dismiss their testimony due to prejudice, not evidence. If your view says we have a standing default to believe, but social reality systematically blocks that default for certain speakers, doesn't your theory risk being normatively idealistic but practically inert?

  **6. Follow-up to Q5 (Unequal Credibility)**
  *Likely Reply:* She will likely argue that her theory is normative: it tells us what we *ought* to do (ignore prejudice), even if people currently fail to do so.
  *Follow-up:* I understand the normative force, but epistemology also tracks successful cognitive function. If the "defeater-checking" mechanism is the only guardrail on your view, and that mechanism is corrupted by implicit bias, doesn't the theory need to build in a corrective for that corruption? Otherwise, aren't you defining justification in a way that systematically excludes the very people who need the default entitlement the most?

  **7. Reductionism Relocated**
  Critics often argue that weak anti-reductionism is just reductionism with the heavy lifting relocated. Instead of gathering positive evidence *for* the speaker, you require the hearer to monitor *against* defeaters. But isn't monitoring for signs of deception, irony, or incompetence just as cognitively demanding as gathering positive evidence? If the work is the same, what have we actually gained by calling it "anti-reductionist"?

  **8. The Circularity of Checking**
  Let's say I do decide to check your testimony. I look up your claim in a book or ask a third party. But the evidence I'm using to verify you is itself testimonial—it comes from an author or another speaker. If all my checking evidence is ultimately testimonial, doesn't the reductionist end up going in a circle? And if they do, doesn't that inadvertently prove your point that testimony has to be basic?

  **9. Generation vs. Transmission**
  There's a debate about whether testimony merely transmits knowledge or can generate it. Can your view account for cases where the hearer comes to know something the *speaker* doesn't? For example, if a speaker testifies to a set of premises but fails to draw the conclusion, can the hearer use that testimony to know the conclusion, even if the speaker never did?

  **10. The Source of the Default**
  Finally, where does this default entitlement come from? Is it an *a priori* principle of reason—that communication is impossible without a presumption of truth—or is it an empirical generalization that people usually tell the truth? If it's empirical, aren't you back to reductionism? And if it's *a priori*, how do you explain why the default seems to vary in strength depending on the context, like a courtroom versus a coffee shop?
