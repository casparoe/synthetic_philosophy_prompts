prompt: |-
  I host a small podcast on epistemology, and next week's guest is a philosopher who defends what she calls weak anti-reductionism about testimony: we don't need positive evidence about the speaker to be entitled to believe what she says, because theres a standing default in favor of testimony that we can lose once we pick up defeaters. Draft 8-10 interview questions that push her well past the "so you're just credulous" stage. I want at least one each on (a) whether the child-learning case really shows no evidence is needed, or only that kids are held to looser standards; (b) what her view says about the one-shot stranger -- you have no track record, nothing to go on, the person says something true, do you know it?; and (c) whether a default like this is even usable given that credibility gets handed out unequally, so some people are disbelieved for reasons that have nothing to do with the evidence. For each of those three, give me a follow-up aimed at the reply she's most likely to give. Also work in a question on whether her view is just reductionism with the hard part relocated to the defeater side, one on whether the evidence you'd use to check a speaker is itself mostly testimonial (so doesn't the reductionist end up going in a circle?), and one on whether testimony only passes knowledge along or can generate knowledge the speaker never had. American English please.
