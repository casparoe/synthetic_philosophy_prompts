      *   *Alternative:* **The Restitution Constraint.** If a theory says a reset erases the object, it struggles to explain why theft before the reset was wrong.
      *   *Decision:* The **Non-Erasability of Normative Facts** (linked to Restitution/Identity). Even if the *object* resets, the *violation* must persist to have legal standing. This kills simple "it's just a game" views and simple "it's a physical server state" views.

  8.  **Scoring the Contenders:**
      *   *Pretense/Make-Believe:* Good for games, bad for theft/economy. Fails Transitivity.
      *   *Abstract Artifacts:* Good for identity, bad for causal power (how does an abstract object get stolen?).
      *   *Ordinary Digital Objects:* Good for causal power, bad for fragility (server shutdown = death) and duplication (copying isn't theft in digital realm usually).

  9.  **Review against Constraints:**
