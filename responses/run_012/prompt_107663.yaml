      *   *No citations?* Check.
      *   *Focus on criteria?* Yes, keep the scoring brief.
      *   *Purpose:* Moral/Legal standing. Ensure every desideratum ties back to "does this harm count?"

  10. **Final Polish:**
      *   Ensure the tone is academic but accessible.
      *   Make sure the "Incompatible Pairs" section is sharp.
      *   Verify the "Killer Requirement" is justified.
      *   Check that the specific cases (duplication, servers, grief, theft, presence) are explicitly mapped to the desiderata.

