  6.  **Identifying Incompatible Pairs (The "Trilemma" or "Dilemma"):**
      *   *Conflict:* **Persistence vs. Fragility.** If objects persist through resets (to protect ownership), they become unkillable (undermining game mechanics/risk). If they are fragile (server dependent), ownership is illusory.
