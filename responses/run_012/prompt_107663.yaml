          *   *Desideratum:* **Identity and Persistence Conditions.** The theory must explain when a virtual object is the *same* object over time vs. a duplicate, specifically regarding accountability (e.g., restitution, double jeopardy).
      *   *Case 2 (Corporate Dependence):* If a server shuts down, the object vanishes. Does the harm vanish with it? If I buy something and the company deletes it, was my property rights violated?
