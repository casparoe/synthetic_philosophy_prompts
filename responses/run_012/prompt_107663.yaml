answer: |-
  Here is a specification of desiderata for a theory of virtual objects and harms, tailored to your goal of establishing moral and legal standing.

  ### Part 1: The Desiderata
  These are the jobs your theory must be able to do. If a theory cannot satisfy these, it cannot support a coherent system of rights or liabilities regarding virtual spaces.

  **1. The Restitution Constraint (Based on Duplication and Reset)**
  *   **The Requirement:** The theory must explain what counts as "making the victim whole" when the object in question can be duplicated perfectly or the world rolled back to a prior state.
  *   **The Case:** If a thief steals a virtual sword, and the victim simply reloads a save file to get it back, has the harm been undone? If the theory says "yes," it undermines the seriousness of the theft (making legal intervention pointless). If it says "no," it must identify what was lost that the reload did not restore (e.g., time, security, trust).
  *   **Relevance to Standing:** Legal standing depends on the possibility of redress. If a harm can be erased by a user command, it is hard to justify state intervention. The theory must distinguish between *restoring the data* and *repairing the harm*.

  **2. The Vulnerability Constraint (Based on Server Dependence)**
  *   **The Requirement:** The theory must account for the fact that virtual objects exist only contingent on corporate infrastructure, without rendering rights over them meaningless.
  *   **The Case:** A company shuts down a game server. All items vanish. If users had "property rights" in those items, did the company commit mass destruction of property? Or did the users merely lose access to a service?
  *   **Relevance to Standing:** If virtual objects are too fragile (dependent on a whim), they cannot support robust property rights. If they are too robust (independent of the server), the theory contradicts the technical reality that deleting the code deletes the object. The theory must locate the value in a place that survives (or justifiably does not survive) the server shutdown.

  **3. The Rationality of Emotion Constraint (Based on Grief and Distress)**
  *   **The Requirement:** The theory must explain why emotional distress over virtual loss is rational and valid, without requiring the object to be physically real.
  *   **The Case:** A player grieves deeply when a virtual pet dies or a save file is corrupted. If the theory claims the pet "never existed," it risks calling the grief irrational or delusional. If it claims the pet was "flesh and blood," it is lying.
  *   **Relevance to Standing:** Legal systems often recognize "emotional distress" as a compensable harm. To grant standing for virtual harassment or loss, the theory must validate the victim's pain as a response to a genuine loss, not a fantasy.

  **4. The Transitivity Constraint (Based on Real-Money Theft and Harassment)**
  *   **The Requirement:** The theory must provide a causal bridge explaining how an action performed on digital code results in a normative injury to a physical person.
  *   **The Case:** A user buys an item with real currency, and it is stolen. Or, a user is harassed via their avatar and feels personally attacked.
  *   **Relevance to Standing:** This is the core of the legal question. There must be a clear chain of connection: Code → Avatar → User → Harm. If the theory treats the virtual world as a sealed "magic circle" separate from reality, it cannot justify real-world legal penalties. If it treats the virtual world as identical to the physical world, it creates absurdities (e.g., virtual murder = real murder).

  **5. The Phenomenological Fidelity Constraint (Based on Embodiment and Presence)**
  *   **The Requirement:** The theory must respect the user's experience of "being there" and "being the avatar" without committing to the literal truth of that experience.
  *   **The Case:** Users report startle responses, bodily presence, and lingering trauma from virtual events. For some, the virtual world feels more significant than their physical surroundings.
  *   **Relevance to Standing:** If the law ignores the user's lived experience of presence, it will fail to protect them from harms that feel physical (e.g., virtual sexual assault). However, if the law accepts the experience as literal reality, it creates ontological confusion. The theory must explain why the *feeling* of presence generates *real* rights.

  ***

  ### Part 2: Prejudices vs. Genuine Desiderata
  In constructing this list, it is easy to sneak in assumptions that favor one side of the debate. You must distinguish between what is necessary for your purpose (moral/legal standing) and what is merely a philosophical bias.

  *   **Genuine Desideratum:** *The Transitivity Constraint.* We actually need to know how digital acts hurt real people to write laws. This is functional.
  *   **Prejudice (Physicalist):** "Virtual objects must be physically tangible to count as property." This excludes digital goods by definition rather than argument. It should be rejected; the desideratum is about *value and control*, not tangibility.
  *   **Prejudice (Dismissive):** "It's just a game, so harms are pretend." This assumes the conclusion (no standing) rather than testing for it.
  *   **Prejudice (Emotional Realist):** "If the pain is real, the object must be real." This confuses the *reaction* with the *stimulus*. You can be genuinely harmed by a lie; the lie doesn't become true because you were hurt. A theory should not be required to make virtual objects physically real just to validate grief.

  ***

  ### Part 3: Incompatible Pairs (The Trade-Offs)
  You suspect the list itself holds the result. You are correct. There are tensions here that suggest you cannot maximize every virtue simultaneously.

  **Conflict A: The Restitution Constraint vs. The Vulnerability Constraint**
  *   **The Tension:** To satisfy **Restitution**, you want virtual objects to be stable enough that a theft persists even if the game resets (so the thief can be punished). To satisfy **Vulnerability**, you must admit the object is fragile and can be wiped out by a server shutdown (which looks like a reset on a massive scale).
  *   **The Choice:** If you prioritize Restitution, you have to argue that the *right* to the object survives even when the *object* is technically gone. If you prioritize Vulnerability, you admit that virtual property rights are always lease-like and revocable, which weakens legal standing against thieves (since the victim could just have gotten a new one anyway).

  **Conflict B: Phenomenological Fidelity vs. Ontological Honesty**
  *   **The Tension:** To satisfy **Phenomenological Fidelity**, you might want to say the avatar *is* the user for the purposes of harassment law. To maintain **Ontological Honesty**, you must admit the avatar is software and the user is in a room somewhere.
  *   **The Choice:** If you lean too hard into Fidelity, you risk legal absurdities (e.g., if I delete my avatar, did I commit self-harm?). If you lean too hard into Honesty, you fail to protect users from harms that target their sense of self through the avatar.

  ***

  ### Part 4: The "Killer" Requirement
  If you must choose the single requirement that excludes the most candidate theories, it is **The Transitivity Constraint (specifically the Non-Erasability of Normative Facts).**

  *   **Why:** Many theories fail here.
      *   **The "Magic Circle" View:** Claims what happens in-game stays in-game. This fails Transitivity immediately; it cannot explain why real-money theft is wrong.
      *   **The "Strict Physicalist" View:** Claims only physical matter matters. This fails Transitivity because it cannot explain how moving electrons hurts a person's dignity or wallet without a direct physical bridge.
      *   **The "Reset" View:** Claims that because a world can be rolled back, no permanent harm occurred. This fails the moral core of Transitivity: the *violation* of rights must persist even if the *data* is restored.
  *   **The Bar:** To pass this requirement, a theory must explain how a normative fact (e.g., "you violated my rights") becomes true in the real world, even if the virtual evidence is deleted, duplicated, or reset. This is the hardest hurdle for any ontology of the virtual.

  ***

  ### Part 5: Brief Scorecard of Contenders
  Here is how the main types of theories stack up against your specific desiderata. This is not a verdict, but a map of where they struggle.

  **1. The Pretense / Make-Believe Approach**
  *   **The View:** Virtual objects are props in a game of make-believe. When you "steal" a sword, you are merely breaking the rules of the game, not violating property rights.
  *   **Performance:**
      *   *Passes:* **Phenomenological Fidelity** (explains why we act "as if" it is real).
      *   *Fails:* **The Transitivity Constraint.** It struggles to explain why real money theft or severe harassment warrants real-world legal intervention. If it is all pretense, why call the police? It tends to assign lesser or no standing to virtual harms.
      *   *Verdict:* Good for explaining gameplay, bad for explaining law.

  **2. The Abstract Artifact Approach**
  *   **The View:** Virtual objects are abstract objects (like stories or numbers) created by developers and instantiated by code. They exist, but not in space and time.
  *   **Performance:**
      *   *Passes:* **The Rationality of Emotion Constraint** (you can grieve a story ending) and **Identity** (the "type" of sword persists even if the "token" is deleted).
      *   *Fails:* **The Transitivity Constraint (Causal Power).** Abstract objects usually cannot be "stolen" in a way that causes causal harm. How do you steal a number? It struggles to explain the mechanism of the harm, making legal standing difficult to enforce.
      *   *Verdict:* Good for ontology, bad for causation.

  **3. The Ordinary Digital Object Approach**
  *   **The View:** Virtual objects are just patterns of electrons on a server. They are real physical states with causal powers.
  *   **Performance:**
      *   *Passes:* **The Transitivity Constraint** (deleting code is a physical change that can cause real loss) and **Vulnerability** (acknowledges server dependence).
      *   *Fails:* **The Restitution Constraint (Identity).** If objects are just data, copying is not theft (you still have your data). It also struggles with **Phenomenological Fidelity**; it reduces the avatar to code, making it hard to explain why harassing the avatar feels like harassing the *person*.
      *   *Verdict:* Good for economics, bad for personal identity and duplication issues.

  ### Summary for Your Paper
  Your argument should be that before we ask "Are virtual objects real?", we must ask "What work does the answer need to do?" If the work is to ground legal standing, the theory must prioritize **Transitivity** (connecting code to human harm) and **Non-Erasable Normativity** (ensuring rights survive resets). Most existing theories fail because they try to solve the metaphysics of the *object* without solving the metaphysics of the *harm*. Your paper can propose that the ontology of virtual objects should be derived from the requirements of virtual ethics, not the other way around.
