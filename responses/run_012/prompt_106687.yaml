answer: |-
  Good evening, everyone. For those who don't know me, I'm [Name], and I've had a strange eleven days. While most people were finalizing seating charts, I was having an existential crisis about the nature of objecthood.

  I blame my college roommate. He's here tonight—hi, Dave—and he once convinced me that the most important question in the universe is: "When do a bunch of parts add up to a whole?" When is a pile of bricks a wall, and when is it just a pile?

  There are three usual answers. One: Never. Nothing is ever a whole; everything is just atoms pretending. Two: Always. Any random collection of things is an object, which means right now, I am a single object with the moon and this microphone. And three: Sometimes. But only when the parts are arranged in a very specific way.

  For the last month, since my own parents separated after thirty-four years, I've been stuck on this. I looked at them and wondered: Were they ever actually "one"? Or were they just two people standing close together for a really long time? If "one" is a fiction, then what are we celebrating tonight?

  I've decided the answer is "Sometimes." But I've decided that the "special arrangement" isn't physics. It's not about sharing a bank account or a last name or even a house.

  The only time two people genuinely compose a third thing—a "we"—is when they choose to.

  This was hard for me to accept regarding my parents. Because if "oneness" is real, it can also break. It's not a permanent state you achieve like a trophy. It's a structure you build, and it requires maintenance. My parents built it for a long time. It was real. But structures can collapse. Acknowledging that doesn't erase the years it stood; it just means the work stopped.

  And that is why today is so brave.

  [Couple's Names], looking at you, I don't see a magical fusion where two souls melt into a single blob. I see something better. I see two complete, complex, independent people looking at the terrifying uncertainty of the future and saying, "I want to build a whole with you."

  To the philosophers in the room: Yes, I am defending a version of restricted composition. The restriction is love.
  To the rest of the room: I am saying that marriage isn't something you *are*. It's something you *do*.

  So, my wish for you is not that you never fight, or that you never feel like separate people. You will. My wish is that you keep choosing to compose something bigger than yourselves. Keep arranging the parts. Keep building the wall, brick by brick, even when it's heavy.

  If "two becoming one" is a fiction, it is the most beautiful fiction we have. But I think it's real. I think it's real because you two make it real, every single day.

  Please raise your glasses. To the parts, to the whole, and to the work that makes it matter. To [Couple].
