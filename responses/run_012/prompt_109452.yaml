answer: |-
  You have stumbled upon one of the most genuinely vexing problems in modern decision theory. You are not imagining the ambiguity; you have mathematically reconstructed a scenario where Expected Utility Theory (EUT) formally breaks down.

  The specific phenomenon you are describing is best known as **The Pasadena Game**.

  It was formalized in a 2004 paper by Graham Nover and Alan Hájek titled *"Vexing Expectations."* While the mathematical engine driving it is the **Riemann Rearrangement Theorem**, the decision-theoretic application is distinct from the St. Petersburg Paradox or Pascal's Wager.

  Here is the precise breakdown of what you have found, how it differs from the classics, and what (little) is settled about rational choice in this domain.

  ### 1. The Mathematical Mechanism: Conditional Convergence
  In standard probability theory, the Expected Value (EV) of a gamble is the sum of (probability $\times$ payoff) for all possible outcomes.
  $$E[X] = \sum_{i=1}^{\infty} p_i x_i$$

  For this value to be well-defined in a way that is independent of how you list the outcomes, the series must be **absolutely convergent**. That means the sum of the *absolute values* must be finite:
  $$\sum_{i=1}^{\infty} |p_i x_i| < \infty$$

  If a series is **conditionally convergent** (the sum converges, but the sum of absolute values diverges to infinity), the **Riemann Rearrangement Theorem** applies. This theorem states that for any conditionally convergent series, you can rearrange the order of the terms to make the sum converge to **any real number you like**, or diverge to positive or negative infinity.

  In your wager:
  *   The probabilities ($p_i$) sum to 1.
  *   The payoffs ($x_i$) alternate in sign (win/loss) and grow in magnitude.
  *   This creates a conditionally convergent series for the Expected Value.

  Because a probability space is a *set* of outcomes, not a *sequence*, there is no mathematically privileged order in which to sum them. Therefore, the Expected Value is **undefined**. It is not infinity; it is not zero; it is nonexistent.

  ### 2. How It Differs from the Classics
  You correctly intuited that this is not the St. Petersburg Paradox. Here is the taxonomy of infinite/ill-defined expectations:

  *   **The St. Petersburg Paradox (1713):**
      *   *Structure:* Payoffs are all positive and grow exponentially; probabilities shrink exponentially.
      *   *Result:* The Expected Value is **$+\infty$**.
      *   *Problem:* No rational person would pay an infinite amount to play, yet the math says they should. The value is *defined*, but counterintuitive.
  *   **Pascal's Wager / Pascal's Mugging:**
      *   *Structure:* Tiny probability $\times$ Infinite (or astronomical) Utility.
      *   *Result:* The Expected Value is dominated by the tail ends.
      *   *Problem:* It forces rational agents to prioritize wildly implausible scenarios. The value is *defined*, but action-guiding power is suspect.
  *   **The Pasadena Game (Your Scenario):**
      *   *Structure:* Payoffs alternate signs (positive/negative) and grow.
      *   *Result:* The Expected Value is **undefined**.
      *   *Problem:* You cannot even say the bet is "good" or "bad." By simply re-indexing the outcomes (which is mathematically permissible since they are a set), you can prove the bet is worth \$1,000,000 or -\$1,000,000.
      *   *Distinction:* This is not a paradox of *infinity*; it is a paradox of *indeterminacy*.

  ### 3. What Decision Theory Says (The "Settled" Truth)
  If you are looking for a consensus on how a rational agent *ought* to choose, the honest answer is: **There is no consensus.** This is an open wound in decision theory.

  However, there are three main positions your character might encounter if they consulted a decision theorist:

  **A. The Orthodox View (EUT Breakdown)**
  Standard Expected Utility Theory requires absolute convergence. If $\sum |p_i x_i| = \infty$, the expectation does not exist. A strict orthodox theorist would say the question "What is the value of this wager?" is ill-posed, like asking "What is the color of jealousy?" The rational agent has no EUT-based reason to take or reject it.

  **B. The "Weak Expectation" Solution (Nover & Hájek)**
  Nover and Hájek proposed that we might look for a "weak expectation." If the payoffs follow a specific natural ordering (e.g., the order in which the coin tosses *actually occur in time*), the series might converge to a specific value in that specific order.
  *   *Narrative Hook:* If the wager is settled by tossing a coin *in time*, the natural order is Toss 1, Toss 2, Toss 3... This imposes an ordering on the series. If the series converges in that specific temporal order, one could argue the "Weak Expectation" is the valid value.
  *   *The Catch:* If the wager is settled by looking at the *set* of all possible worlds, the temporal order doesn't apply, and the value dissolves again.

  **C. Dominance Principles**
  Some theorists argue that when Expectation fails, we should fall back on **Statewise Dominance**.
  *   If Wager A yields a better outcome than Wager B in *every* possible outcome state, choose A.
  *   *In your case:* If the alternative is "do nothing" (payoff 0), does the Pasadena wager dominate 0? No, because some outcomes are negative losses. Does 0 dominate the wager? No, because some outcomes are positive wins.
  *   *Result:* Dominance principles also fail to give a verdict. The agent is truly rationally permitted to do either, or neither.

  ### 4. Narrative Implications for Your Novelist
  This is fertile ground for fiction because it represents a limit of rationality itself.

  *   **The Horror of Indeterminacy:** In the St. Petersburg paradox, the math is too big (infinity). In the Pasadena Game, the math is *broken*. For a character who relies on logic, this is more disturbing. It suggests that "value" is not an intrinsic property of the gamble, but an artifact of how you choose to count it.
  *   **The "Framing" Trap:** Since the value depends on the ordering, a cunning opponent could frame the wager in a way that forces a specific ordering (e.g., "We will toss the coin once per day until heads"). This imposes the temporal order, potentially fixing the value. If the contract is vague ("We will consider all possible outcomes"), the value remains undefined.
  *   **The Decision:** A truly rational agent, recognizing the EV is undefined, might refuse the bet simply to avoid **Decision Instability**. If they calculate it's worth \$100 today, they might calculate it's worth -\$500 tomorrow based on a different mental accounting method. A rational agent might prefer a known small loss over an undefined expectation.

  ### Summary for Your Notes
  *   **Name:** The Pasadena Game (or Pasadena Paradox).
  *   **Math:** Riemann Rearrangement Theorem applied to Conditionally Convergent Series.
  *   **Key Distinction:** Unlike St. Petersburg (Infinite EV), Pasadena has **Undefined EV**.
  *   **Rational Verdict:** Unsettled. Standard theory says the value does not exist. Some propose "Weak Expectation" based on temporal ordering.
  *   **Citation:** Nover, G., & Hájek, A. (2004). "Vexing Expectations". *Mind*, 113(450), 237-249.

  Your character's inability to resolve the decision is not a failure of their intellect; it is a faithful representation of the current limits of decision theory. They are standing at the edge of the map where "rational choice" ceases to have a definition.
