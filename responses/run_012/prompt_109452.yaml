      *   Wait, the user says "limit keeps changing depending on how I bracket the terms." This suggests the series might not even converge in the standard sense, or they are exploring the property of conditional convergence.
      *   In the context of Expected Value (EV), EV is defined as $\sum p_i x_i$. Since probabilities $p_i$ are positive and sum to 1, the "order" of outcomes shouldn't mathematically matter for the sum *unless* the sum is not absolutely convergent.
      *   If $\sum |p_i x_i| = \infty$ but $\sum p_i x_i$ converges conditionally, then rearranging the *indexing* of the outcomes changes the sum.
