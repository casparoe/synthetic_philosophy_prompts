      *   **Pascal's Wager/Mugging:** Infinite utility or extreme ratios.
      *   **The User's Case:** Undefined EV due to conditional convergence.
      *   **Key Name:** **The Pasadena Game**.
      *   **Authors:** Nover & Hájek (2004).
      *   **The Mechanism:** A game where the payoff alternates in sign and grows in magnitude such that the expected value series is conditionally convergent.
      *   **The Result:** By the Riemann Rearrangement Theorem, the expected value can be made to equal any real number (or $\pm \infty$) depending on how you order the terms. Since there is no natural ordering of outcomes in a probability space (they are a set, not a sequence), the EV is undefined.

