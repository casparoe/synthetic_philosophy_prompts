answer: |-
  # MARITIME VESSEL IDENTITY DETERMINATION PROTOCOL (MVIDP)
  **Version 1.0 | Approved for Committee Use**

  ## 1. PURPOSE
  This procedure resolves disputes regarding the identity of historic vessels. It does not discover metaphysical truths; it establishes administrative conventions for labeling, insurance, accessioning, and lending. It acknowledges that "the same ship" may mean different things in different contexts.

  ## 2. PRE-MEETING REQUIREMENTS
  Before the committee convenes, Collections Staff must prepare an **Identity Dossier** for the object in question containing:
  1.  **Material Audit:** Percentage of original fabric (by volume/weight) remaining.
  2.  **Continuity Log:** Timeline of existence. Note any gaps where the vessel ceased to exist as a coherent structure (e.g., stored as loose timbers, scrapped, fully dismantled).
  3.  **Functional Record:** Has the vessel maintained its capacity to function as a vessel (sailing/floating) without interruption?

  ## 3. THE PROCEDURE

  ### PHASE 1: SELECT THE SORTAL (The "Kind of Thing" Question)
  *Philosophical Basis: Relative Identity.*
  The Committee must first agree on *why* they are asking the question. A verdict reached for one purpose does not apply to others. Select **one** primary Sortal for this decision:

  *   **A. Vessel-as-Artifact:** Focus is on historical material. (Used for: Accessioning, Labeling, Provenance).
  *   **B. Vessel-as-Craft:** Focus is on functional continuity. (Used for: Harbor Authority, Sailing Certification, Insurance).
  *   **C. Vessel-as-Historical-Witness:** Focus is on the continuity of the "story" or name. (Used for: Public Programming, Fundraising).

  **Rule:** You may not mix Sortals in a single verdict. If you need a verdict for Insurance (Craft) and Labeling (Artifact), run the procedure twice.

  ### PHASE 2: ASSESS THE CRITERIA
  *Philosophical Basis: Competing Theories of Persistence.*
  Score the object on the following three scales (0 = None, 1 = Total).

  1.  **Material Continuity (The "Strict" Test):** What percentage of the original physical matter remains in place?
      *   *Note:* This treats the ship as a collection of atoms. If this score is low, the object is materially new.
  2.  **Spatiotemporal Continuity (The "Continuous" Test):** Was there ever a moment when the vessel ceased to exist as a structured whole?
      *   *Note:* This treats the ship as a process. If the ship was dismantled into a pile of wood and later rebuilt, this score is 0.
  3.  **Functional/Design Continuity (The "4D" Test):** Does the object occupy the same "design space" and function as the original, regardless of matter?
      *   *Note:* This treats the ship as a pattern existing through time.

  ### PHASE 3: APPLY THE CONVENTION WEIGHTS
  *Philosophical Basis: Conventions vs. Facts.*
  **CRITICAL STEP:** The scores in Phase 2 are facts. The weights below are **conventions chosen by this Museum**. You are not discovering the answer here; you are voting on what kind of museum you are.

  Select the Weighting Profile that matches the Sortal chosen in Phase 1:

  *   **Profile A (Artifact):** Material (70%) + Spatiotemporal (30%) + Functional (0%).
  *   **Profile B (Craft):** Material (10%) + Spatiotemporal (60%) + Functional (30%).
  *   **Profile C (Witness):** Material (20%) + Spatiotemporal (40%) + Functional (40%).

  **Calculate the Weighted Score.**
  *   **0.8 – 1.0:** VERDICT: **SAME OBJECT.**
  *   **0.4 – 0.79:** VERDICT: **SUCCESSOR OBJECT** (Qualify the label, e.g., "Restored," "Rebuilt").
  *   **0.0 – 0.39:** VERDICT: **NEW OBJECT** (Replica, Reconstruction, or Distinct Entity).

  ### PHASE 4: THE INDETERMINACY GATE
  *Philosophical Basis: Vagueness and Lack of Fact.*
  If the Committee feels the Weighted Score misrepresents the reality (e.g., the math says "Same" but the object feels "New"), or if the object involves **Fusion** (timbers from Ship A + timbers from Ship B), the Committee may invoke the Indeterminacy Gate.

  **Condition for Invocation:**
  1.  The object is a hybrid of two distinct historical lineages (e.g., patchwork hulls).
  2.  OR, the Weighted Score falls between 0.45 and 0.55 (The "Vagueness Zone").

  **Verdict:** **NO DETERMINATE ANSWER.**
  **Action:** The object must be labeled/insured as "Composite" or "Of Indeterminate Origin." No claim of "Original" or "Replica" may be made.

  ### PHASE 5: SIGN-OFF AUTHORITY
  *   **Definite Verdict (Same/New/Successor):** Signed by **Committee Chair**.
  *   **Indeterminate Verdict (No Fact of the Matter):** Signed by **Museum Director** (required to accept liability for the ambiguity).
  *   **Override:** The Board of Trustees may override a Verdict, but must record in minutes that they are **overriding the Protocol**, not following it.

  ***

  ## 4. APPLICATION TO CURRENT CASES
  *Run by the Committee Chair, October 2023.*

  ### CASE 1: The Museum's Working Vessel (Continuously Repaired)
  *   **Data:** <5% original timber. 150 years continuous service. Fully functional.
  *   **Sortal A (Artifact):** Material (0.05) + Spatiotemporal (1.0). Weighted Score: **0.33**.
      *   *Verdict:* **NEW OBJECT** (Materially).
  *   **Sortal B (Craft):** Material (0.05) + Spatiotemporal (1.0) + Functional (1.0). Weighted Score: **0.93**.
      *   *Verdict:* **SAME OBJECT** (Functionally).
  *   **Ruling:** For **Labeling/Accession**, this is a **Successor Object** (heavily restored). For **Harbor/Insurance**, this is the **Same Vessel**.
  *   **Implication:** You cannot label it "The Original [Ship Name]" without the qualifier "Heavily Restored." It is the same *ship*, but not the same *artifact*.

  ### CASE 2: The Reassembled Timbers (Private Yard)
  *   **Data:** ~80% original timber (stored). 50-year gap as loose storage. Rebuilt recently.
  *   **Sortal A (Artifact):** Material (0.8) + Spatiotemporal (0.0). Weighted Score: **0.56**.
      *   *Verdict:* **SUCCESSOR OBJECT**.
  *   **Sortal B (Craft):** Material (0.8) + Spatiotemporal (0.0) + Functional (0.5). Weighted Score: **0.23**.
      *   *Verdict:* **NEW OBJECT**.
  *   **Ruling:** The donors' claim that this is the "Real Ship" is **FALSE** under Sortal B (Craft) and **QUALIFIED** under Sortal A (Artifact). Because the vessel ceased to exist as a structure (became a pile of wood), Spatiotemporal Continuity is broken.
  *   **Implication:** This is a "Reconstruction from Original Material," not the original vessel.

  ### CASE 3: The New-Wood Replica (Third Party)
  *   **Data:** 0% original timber. New build. Original plans.
  *   **Sortal A (Artifact):** Material (0.0) + Spatiotemporal (0.0). Weighted Score: **0.0**.
      *   *Verdict:* **NEW OBJECT**.
  *   **Sortal C (Witness):** Material (0.0) + Spatiotemporal (0.0) + Functional (1.0). Weighted Score: **0.4**.
      *   *Verdict:* **NEW OBJECT** (Successor at best).
  *   **Ruling:** This is unequivocally a **Replica**.
  *   **Implication:** No ambiguity. Do not insure or label as historic.

  ### CASE 4: The Patchwork Restoration (Own + Sister Ship Timbers)
  *   **Data:** 50% Own Timbers + 50% Sister Ship Timbers.
  *   **Sortal A (Artifact):** Material (0.5) + Spatiotemporal (0.5 - merged history).
  *   **Analysis:** This triggers the **Indeterminacy Gate (Phase 4)**. This object is a fusion of two distinct historical lineages. It is neither Ship A nor Ship B. It is a hybrid.
  *   **Ruling:** **NO DETERMINATE ANSWER.**
  *   **Implication:** **Museum Director Sign-off Required.** The object must be accessioned as a "Composite Hull." It cannot be insured as Ship A or Ship B.

  ***

  ## 5. THE ANSWER YOU WILL NOT LIKE
  **Regarding Case 1 (The Museum's Working Vessel).**

  You want this vessel to be the crown jewel of the collection, the "Original." Under **Sortal A (Artifact)**, which governs Accessioning and Labeling, the Protocol returns a score of **0.33**.

  **Verdict:** For the purposes of your catalog and public labels, **your ship is not the original artifact.** It is a "Continuous Successor."

  **Why:** You asked for a procedure that distinguishes fact from convention. The *fact* is that almost no 1800s timber remains. The *convention* (Profile A) states that for Artifact status, material matters most (70%). If you wish to label it "The Original," you must vote to change the Convention Weights in Phase 3. But know that if you do so, you are admitting to donors and insurers that you value *story* over *material*, which may lower the object's appraised market value as an antique. You cannot have the prestige of "Original Material" and the reality of "New Wood" simultaneously.

  ***

  ## 6. LIMITATIONS OF THIS PROCEDURE
  As Head of Collections, you must understand what this document **cannot** do:

  1.  **It Cannot Resolve Metaphysics:** This procedure does not solve the Ship of Theseus paradox. It merely papers over it with administrative weights. It tells you what to *say*, not what *is*.
  2.  **It Cannot Prevent Donor Anger:** When you tell the donors of Case 2 that their "original timbers" do not make an "original ship," they will dispute the weights in Phase 3. This procedure gives you the shield of "Policy," but it does not make the policy objectively true.
  3.  **It Cannot Eliminate Liability:** In Case 4 (Patchwork), the "No Determinate Answer" verdict protects your intellectual honesty but creates insurance ambiguity. The Director's sign-off accepts the risk that an insurer may reject the "Composite" classification.
  4.  **It Is Time-Bound:** A vessel's score changes as it degrades or is restored. A verdict reached today may be invalid in 50 years if more original timber is replaced. This procedure must be re-run every 25 years or after any major refit.
  5.  **It Cannot Force Consensus:** If the Committee cannot agree on the *Sortal* (Phase 1), the procedure cannot start. If the Board cannot agree on the *Weights* (Phase 3), the procedure defaults to Indeterminacy.

  **Final Note:** This procedure trades metaphysical certainty for administrative defensibility. It allows you to say, "We did not choose this outcome arbitrarily; we followed the Protocol." That is the best defense available to you.
