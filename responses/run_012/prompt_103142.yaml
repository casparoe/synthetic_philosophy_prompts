answer: |-
  Here is a menu of four precise theses hidden inside that sentence. You can bring this to class to show that your classmate isn't discovering a truth about lying; she is selecting a specific, narrow definition that serves her purpose.

  Each option breaks down the three variables in the definition: **(1) What counts as "False," (2) Whose mental state matters, and (3) What the Intent aims to achieve.**

  ---

  ### Option 1: The Objective Literalist Thesis
  *This is the reading your classmate is using.*

  *   **What "False" means:** The propositional content of the uttered sentence must correspond inaccurately to reality. If the sentence is technically true, no lie has occurred, regardless of context.
  *   **Whose intent counts:** The speaker's intent to cause the listener to believe the *literal content* of the sentence.
  *   **Intent to bring about what?** A false belief in the literal proposition uttered.
  *   **Status:**
      *   **Stipulative?** Yes. It arbitrarily restricts "lying" to explicit falsehoods.
      *   **Defensible?** Weakly. It fails to capture why we feel morally violated by "paltering" (truthful misleading). It conflates *lying* with *falsehood*.
      *   **Actually False?** Many philosophers argue this is extensionally inadequate. If I say "I didn't steal the money" (true) knowing you will infer "I didn't take the bribe" (false), and I intend that inference, most intuition pumps classify this as a lie or morally equivalent to one.
  *   **The Politician Test:** **Exonerates the politician.** Since every sentence was technically true, the condition of "saying something false" is not met.

  ### Option 2: The Subjective Belief Thesis
  *This is the standard definition in contemporary analytic philosophy (e.g., Thomas Carson, J.E. Mahon).*

  *   **What "False" means:** The speaker *believes* the content is false. Actual truth is irrelevant. You can lie by telling the truth if you *think* it is false.
  *   **Whose intent counts:** The speaker's intent to warrant the truth of the proposition.
  *   **Intent to bring about what?** The listener's belief in a proposition the speaker believes to be false.
  *   **Status:**
      *   **Stipulative?** No, it attempts to capture the moral wrong of lying (betrayal of trust) rather than the physics of the statement.
      *   **Defensible?** Highly. It accounts for the "honest mistake" (not a lie) vs. the "lucky guess" (a lie).
      *   **Actually False?** It struggles with cases where the speaker doesn't care about belief (e.g., bullshitting), but for lying, it is the dominant view.
  *   **The Politician Test:** **Depends.** If the politician *believed* the impression he was creating was false, he is lying under this definition, even if his words were true. If he genuinely believed the misleading impression was accurate, he is not lying.

  ### Option 3: The Communicative Implicature Thesis
  *This reading expands "saying" to include "communicating."*

  *   **What "False" means:** Any proposition the speaker intentionally communicates, including *implicatures* (what is suggested but not said), is part of the "statement." If the implicature is false (or believed false), the condition is met.
  *   **Whose intent counts:** The speaker's intent to cause the listener to infer the false implicature.
  *   **Intent to bring about what?** A false belief about the state of the world, regardless of whether that belief comes from the sentence's syntax or its pragmatic context.
  *   **Status:**
      *   **Stipulative?** No, it relies on Gricean pragmatics (the study of how context contributes to meaning).
      *   **Defensible?** Strongly. It aligns with how language actually works. We hold people responsible for what they communicate, not just what they literalize.
      *   **Actually False?** Some legalists resist this because it makes truthfulness harder to adjudicate in court, but ethically, it is robust.
  *   **The Politician Test:** **Convicts the politician.** If the politician uttered truths *in order to* generate a false implicature, he has "said something false" in the communicative sense.

  ### Option 4: The Deception-Primary Thesis
  *This reading collapses the distinction between lying and misleading.*

  *   **What "False" means:** Irrelevant. The falsity of the statement is not a necessary condition.
  *   **Whose intent counts:** The speaker's intent to manipulate the listener's epistemic state.
  *   **Intent to bring about what?** A false belief (period). The method (lie vs. misleading truth) is secondary to the goal (deception).
  *   **Status:**
      *   **Stipulative?** Yes, it redefines lying to mean "intentional deception."
      *   **Defensible?** Controversial. Many ethicists (like Kant) want to keep lying distinct from other deception to highlight the specific violation of the norm of assertion.
      *   **Actually False?** It renders the word "lying" redundant with "deceiving."
  *   **The Politician Test:** **Convicts the politician.** The mechanism (true sentences) doesn't matter; the intent to deceive is the sole criterion.

  ---

  ### How to use this in seminar

  When your classmate says, *"It can't be lying because lying requires a false statement,"* you can ask her to select from the menu:

  1.  **Are you using Option 1 (Objective Literalist)?** If so, admit that this is a **stipulative definition** chosen specifically to exclude misleading. Ask her *why* we should adopt a definition of lying that ignores the speaker's intent to create a false belief.
  2.  **Are you claiming "False" only applies to syntax (Option 1) and not pragmatics (Option 3)?** If so, ask her to defend the claim that ethics only governs sentence truth-conditions and not communicative intent.
  3.  **Are you conflating "Lying" with "Wrongdoing"?** You can point out that even if Option 1 holds and the politician didn't *lie*, he may still have *deceived*. Ask if the moral weight rests on the word "lie" or on the act of "deception."

  **The Takeaway:** The sentence *"lying means saying something false with the intent to deceive"* is not a fact; it is a container. Your classmate has filled it with **Option 1** to win a point. The rest of the class is likely operating with **Option 2** or **Option 3**. The seminar should be about which container best captures the moral wrong we are actually worried about.
