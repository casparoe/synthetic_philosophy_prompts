prompt: |-
  I'm teaching a night class on Shakespeare and political theory and next week it's Coriolanus. I want a reading of the play through the lens of populism and the idea of 'the will of the people', and I want it to actually earn its keep rather than just pinning a label on Coriolanus for being a snob about the plebs. What nags at me is that the play seems to run on two incompatible pictures of what the people's will is. On one picture it's just a count: the citizens file past the candidate and give him their voices, you add them up, and that's the will. On the other picture there's meant to be a single voice of the people, and the whole fight in the play is over who gets to be its mouthpiece — the tribunes claim it, Coriolanus flatly denies the plebeians are the people at all, and Menenius tries to fuse them into one body (though I don't want the body-politic fable to swallow the whole thing). Read the play against both pictures: which one does it actually dramatise, and is the gap between them the play's insight or just a muddle? I keep coming back to the scene where he has to stand in the market and solicit the voices — does that scene show the aggregate picture is the real one, and the single-voice picture is a fiction that somebody is always ventriloquising (the tribunes, mostly)? And does the ending, with the people turning and the tribunes winning, settle anything, or does it just show the crowd is fickle, which is a cheaper and different point? Lastly, does Shakespeare show up something the theory of populism tends to miss — that the demos might not have a will there waiting to be represented in the first place? British English please, no footnotes, and don't quote long passages at me, I know the play.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Shakespeare's *Coriolanus* through the lens of populism and 'the will of the people'.
      *   **Core Tension:** Two incompatible pictures of the people's will: (1) Aggregative (counting votes/voices) vs. (2) Unitary (a single voice/body that needs a mouthpiece).
      *   **Specific Questions:** Which picture does the play dramatize? Is the gap between them an insight or a muddle? Does the market scene confirm the aggregative view and expose the unitary view as ventriloquism? Does the ending settle anything or just show fickleness? Does Shakespeare reveal something political theory misses (e.g., the demos might not *have* a pre-existing will)?
      *   **Constraints:** British English, no footnotes, no long quotations (assume knowledge of the play), avoid simplistic "Coriolanus = snob" readings, avoid letting the Body Politic fable dominate everything.
      *   **Tone:** Academic but accessible (for a night class), insightful, nuanced.

  2.  **Deconstruct the Core Tension (Aggregative vs. Unitary):**
      *   *Aggregative:* The election scene (Act 2, Scene 3). Citizens individually give consent. It's procedural. Coriolanus hates this because it reduces his worth to a numbers game.
      *   *Unitary:* The Tribunes claim to speak for the "common voice." Menenius uses the Belly fable to suggest an organic unity. Coriolanus denies the plebeians constitute a "people" at all (just a "many-headed multitude").
      *   *The Insight:* The play doesn't choose one; it shows the friction between the *mechanism* of democracy (counting) and the *mythology* of democracy (the People as a singular actor).

  3.  **Address the Market Scene (Act 2, Scene 3):**
      *   Coriolanus has to ask for voices. He sees it as begging.
      *   The Citizens *do* act individually here. They confer amongst themselves. They change their minds.
      *   Does this prove the unitary view is fiction? Yes, largely. The Tribunes (Sicinius and Brutus) have to *manufacture* the unity by manipulating the aggregate. They teach the citizens what to say. This suggests the "Will of the People" is constructed, not discovered.

  4.  **Address the Ending (Coriolanus's Death & the Tribunes' Victory):**
      *   Is it just about fickleness? That's the traditional reading (crowd is unstable).
      *   A deeper reading: The instability *is* the point. If the will isn't pre-existing, it's always vulnerable to rhetoric.
      *   The Tribunes win not because they represent the "true" will, but because they are better at managing the fiction of unity.
      *   Coriolanus dies because he refuses to play the game of representation. He insists on being himself, not a representative figure.
      *   Does it settle anything? No. Rome is left in a precarious state. Aufidius calls him a "boy of tears." The state survives, but the hero is sacrificed.

  5.  **Address the "Missing Will" (Political Theory Critique):**
      *   Populism often assumes "The People" exist and have been silenced.
      *   Shakespeare suggests the "People" are an effect of speech, not the source. They don't know what they want until someone tells them.
      *   This anticipates modern theories (like Laclau or Canovan) but dramatizes the emptiness at the core.
      *   The "will" is retroactive.

  6.  **Drafting - Section by Section (incorporating British English):**
      *   *Introduction:* Acknowledge the prompt's sophistication. Set up the two models of the will.
      *   *The Two Pictures:* Define the aggregative (votes) vs. unitary (voice). Discuss how Coriolanus rejects both in different ways (hates the counting, denies the legitimacy of the unit).
      *   *The Market Scene:* Focus on the performance. Coriolanus's wounds vs. his words. The citizens' confusion. The Tribunes intervening. This is where the "construction" of the will happens.
      *   *The Tribunes:* They aren't just villains; they are political operatives who understand that the "People" need to be narrated into existence.
      *   *The Ending:* Move beyond "fickle crowd." Focus on the vacuum left. The state continues, but the question of who rules remains unresolved.
      *   *The Theoretical Insight:* The "non-existence" of the People. Shakespeare vs. Modern Populism.
      *   *Conclusion:* Summarise the value for the class.

  7.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I rely too much on the Body Politic? *Correction:* Mention Menenius's fable but pivot quickly to its failure. The citizens don't actually believe it; they use it when convenient.
      *   *Check:* Is the English British? *Correction:* Ensure spelling (honour, labour, centre) and idiom (whilst, amongst, programme) are correct. Avoid Americanisms.
      *   *Check:* Did I answer the specific question about the gap being insight or muddle? *Correction:* Argue it's the central insight. The muddle *is* politics.
      *   *Check:* Avoid long quotes. *Correction:* Paraphrase key moments (the gown of humility, the banishment scene).

  8.  **Final Review against constraints:**
      *   Night class context (needs to be engaging, not dryly theoretical).
      *   No footnotes.
      *   British English.
      *   Focus on the "will of the people" tension.

  9.  *(Final Polish)*: Ensure the distinction between the 'aggregate' and the 'unitary' is clear throughout. Make sure the conclusion lands on the idea that the 'will' is a fabrication.

  **(Self-Correction Note):** I need to be careful not to sound like I'm saying Shakespeare is a post-structuralist. He's a dramatist. The insight comes from the *action*, not a thesis statement. Keep it grounded in the stage business.

  10. **Final Output Generation** (Proceed to write the response based on these thoughts).
answer: |-
  This is a splendid angle for a night class, precisely because it moves beyond the tired debate of whether Coriolanus is a tragic hero or a fascist avant la lettre. You are right to identify the friction between the two models of popular will. One is procedural and arithmetic (the counting of voices in the market), the other is mystical and singular (the 'common voice' or the 'people' as a collective body). Most political theory, especially populist theory, tends to slide between these two without noticing the contradiction. Shakespeare, however, stages the collision.

  To answer your central question: the play does not choose one picture over the other. Instead, it dramatizes the violent friction that occurs when you try to force the arithmetic reality into the mystical container. The gap between them is not a muddle; it is the play's primary political insight.

  Let us look at the market scene first. You suggest this scene might prove the aggregate picture is the real one and the single-voice picture is a fiction. I would go further. The scene demonstrates that the 'aggregate' is the mechanism, but it is unintelligible without the 'fiction'. When the citizens enter, they do not speak with one voice; they bicker. One says he has a right to vote because he was wounded in the wars, another worries about corn prices. They are distinct, self-interested individuals. This supports the aggregative view. However, they are also painfully aware that their individual votes are meaningless unless they coalesce into something larger. They hesitate to grant Coriolanus their voices not just because they dislike him, but because they sense that to do so is to surrender their own power to a single will.

  Coriolanus, for his part, despises the aggregative model because it renders him equal to men he considers inferior. But he also inadvertently exposes the hollowness of the unitary model. When he shows his wounds, he is trying to offer his body as the true embodiment of the state, bypassing the need for words or votes. He thinks his blood speaks louder than the plebeians' voices. The Tribunes, Sicinius and Brutus, understand something Coriolanus does not: that the 'People' only exist as a political entity when they are spoken for. They do not claim to count the votes; they claim to interpret them. They turn the arithmetic sum into a moral verdict.

  This is where the play offers a stinging critique of populism. Modern populist theory often posits that 'The People' have a dormant, true will that has been suppressed by elites, waiting to be awakened. Shakespeare suggests the opposite: the demos does not have a will waiting to be represented. The will is constituted in the moment of representation. The citizens in *Coriolanus* literally do not know what they want until the Tribunes tell them what they have decided. When the Tribunes incite them to revoke their consent, the shift is instantaneous. This is not merely 'fickleness', which implies a change of mind based on new feelings. It is the revelation that the 'mind' of the crowd is an effect of rhetoric, not a cause of it.

  If we stop at 'the crowd is fickle', we miss the structural point. The fickleness is a symptom of the vacuum. Because there is no pre-existing 'Will of the People', the space is always open for capture. The Tribunes win not because they are more democratic, but because they are better semioticians. They understand that 'The People' is a name you invoke to silence opposition, not a group you consult. When they banish Coriolanus, they do not say 'the majority voted this'. They say 'it is the will of the people'. They successfully ventriloquise the unitary voice to override the aggregate count.

  So, does the ending settle anything? The traditional reading is that the plebeians realise their mistake too late, mourning Coriolanus after his death. But look closely at the final moments. The citizens are not united in grief; they are confused. Aufidius kills Coriolanus not for the state, but for personal honour, and then immediately pivots to eulogise him to save his own skin. The Volscian lords draw swords. Rome is left standing, but the political settlement is fragile. The Tribunes remain, but their victory is pyrrhic; they have removed the one man who could defend the city they now rule.

  The play ends without restoring a stable definition of who 'the people' are. It suggests that a polity cannot function solely on the aggregative model (Coriolanus's refusal to campaign proves that pure meritocracy cannot govern a republic) nor on the unitary model (the Tribunes' manipulation proves that the 'common voice' is easily weaponised).

  This brings us to your final point about what Shakespeare shows that theory misses. Contemporary populism relies on the ontology of the People. It assumes the People are a real thing. *Coriolanus* suggests the People are a theatrical effect. They exist only when the stage is set, the gown of humility is worn, and the script is read. When Coriolanus refuses to wear the gown, he breaks the fourth wall of politics. He reminds the audience that the emperor has no clothes, or rather, that the 'People' have no voice. That is why he must be killed. He is not dangerous because he is a tyrant, but because he is a truth-teller in a system that requires a foundational myth.

  For your class, the key is to steer them away from judging the characters' morals and towards judging the mechanism of the state. Coriolanus is not just a snob; he is a realist who sees the arithmetic truth. The Tribunes are not just villains; they are constructivists who know the unitary truth is necessary for order. The tragedy is that neither can sustain the state alone. The 'will of the people' is the necessary fiction that holds the arithmetic reality together, but the play exposes the seams.

  In sum, the play dramatises the unitary picture as a necessary fiction imposed upon the aggregative reality. The gap is the insight. Shakespeare anticipates the modern realisation that 'the People' is an empty signifier. It has no content until a leader fills it. Coriolanus tries to fill it with blood and service; the Tribunes fill it with grievance and speech. The play suggests that in a republic, speech will always beat blood, because the republic is made of words, not wounds. But it also warns that a state built on a ventriloquised will is perpetually on the brink of tearing itself apart, because once the voice is recognised as borrowed, the authority evaporates.

  This reading should give your students plenty to chew on without reducing the text to a pamphlet. It honours the complexity of the text while making it speak directly to our current political moment, where the 'will of the people' is invoked constantly, yet remains perpetually undefined.
