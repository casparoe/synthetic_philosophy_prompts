  **Note on the Model**

  This poem treats the escalator rule as a clean Lewisian convention: arbitrary, self-enforcing, and sustained solely by mutual expectation. That is a philosophical liberty. In reality, these rules often correlate with pre-existing focal points, such as the direction of road traffic in a given city (e.g., standing on the left in London where you drive on the left, though often it is the opposite to facilitate overtaking). If the rule is derived from another norm rather than emerging spontaneously from a void of indifference, it is not a "pure" convention in Lewis's sense, but a dependent one. Furthermore, the poem blends Lewis's *convention* (coordination equilibrium) with Bicchieri's *social norm* (conditional preference based on normative expectations); the "pressure" described in stanza five suggests a moralistic sanction that exceeds mere coordination failure. I would decide the poem's conceit is wrong if empirical evidence showed a biomechanical asymmetry—for instance, if human balance or heart position made one side strictly safer for standing—or if historical records proved the rule was mandated by transit authorities at inception. If the regularity is not arbitrary, or if it was designed rather than evolved, the Skyrmsian story of spontaneous order collapses.
