prompt: |-
  ok so i need a poem for the last session of a reading group and i could use your help. the unit was on convention and the evolution of norms -- lewis's coordination account, skyrms on how a norm can just evolve with nobody ever choosing it, the whole picture where a convention is held up by nothing except everyone expecting everyone else to keep to it. i want to close with a sestina and i want it to be about a really boring, specific convention so it doesnt drift into capital-P Philosophy: the escalator rule. you know, stand on the right, walk on the left (or whatever way round your city does it). what i love about it is that nobody voted, there's no law, it clearly emerged from nowhere, and yet stand on the wrong side in a packed station and you'll feel real social pressure on your back. and flip the sides and the whole thing would work exactly as well. arbitrary and real at the same time.

  heres what i want. a sestina -- six stanzas of six lines plus a three-line envoi -- whose six end-words are: right, left, side, way, hold, stand. i picked those on purpose. they all mean more than one thing (right = correct / the direction / a claim to something; stand = to be upright / to take a position / to endure; hold = to grip / to keep / to remain true) and i want the sestina's returning-and-reshuffling to do the philosophical work: the same words keep coming back in shifted positions, each line leaning on the ones before it, which is more or less what mutual expectation is. the arbitrariness should live in the words themselves -- the poem should let 'right' feel like it was always right, then let the reader notice it could just as easily have been left. and i want the unraveling in there somewhere too, one person standing on the walk side and the whole thing wobbling.

  treat yourself as a poet who actually knows this literature -- lewis, skyrms, sugden on spontaneous order, bicchieri on social norms -- rather than someone who's going to name-drop it. before you write, spend a minute thinking about which feature of the account each stanza is carrying (conformity, expectation, preference, the existence of an alternative regularity, common knowledge) because i want the stanza order to track something, not just be six pretty rooms. dont bother with citations or a reading list, i dont need them and i cant use them anyway.

  after the poem, give me a short note -- a paragraph or so -- on where it takes liberties or leans on a contested reading. e.g. if the escalator rule actually tracks some pre-existing asymmetry (handedness, the side people drive on), then its not a clean lewis convention at all and i want you to say so if the poem is cheating there. and tell me what would change your mind: what would have to be true about the escalator rule, or about conventions generally, for you to decide the poem's whole conceit is wrong.
