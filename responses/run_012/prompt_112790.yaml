answer: |-
  Here are ten interview questions designed to probe the weaknesses of the policy-based defense of paying in Counterfactual Mugging, including your specific XOR variant. Each includes a follow-up designed to block the standard "feature not bug" or "you're just doing CDT" evasions.

  **1. The Incredulity Objection**
  "Many people feel a deep intuitive resistance to paying the $100 in the tails branch. The feeling is that once the coin has landed tails, the $10,000 is already gone; paying now is simply handing cash to a stranger for no return. You argue we should ignore this feeling and look at the policy. But if decision theory is a guide to action *now*, why should I care about a calculation that relies on a world that I know, for a fact, did not happen?"

  *   **Follow-up:** "If you say that ignoring the actual state of the world is a 'feature' of your theory, I need to know: at what point does a theory that tells me to knowingly lose money in the actual world stop being a guide to action and start being a sacrifice ritual? If I can't distinguish a rational payment from a sunk cost fallacy when I'm standing in the losing branch, what practical work is the theory doing for me?"

  **2. The XOR Mugging (The Crux)**
  "I want to press on a variant I call the XOR Mugging. Omega flips two coins. If Coin 1 is heads, he asks for $100. If Coin 1 is tails, he pays $10,000 if and only if *exactly one* of these is true: he predicted you would pay in the heads branch, or Coin 2 is heads. In this setup, deciding to pay in the heads branch leaves the probability of the payout in the tails branch at exactly 50%. Paying buys you no leverage; it is a guaranteed $100 loss with no expected gain. Does your policy defense survive this?"

  *   **Follow-up:** "You will likely say the correlation is broken here but holds in the original case. But in both cases, Omega's prediction is a logical fact about your algorithm. What is the precise structural difference that makes the logical correlation 'real' in the original mugging but 'spurious' in the XOR mugging? If you can't specify the boundary, how do you know you aren't just rationalizing the result you want?"

  **3. Precommitment Without Time**
  "Your view relies on the idea that I should act as if I precommitted before the coin flip. But in the standard problem, there is no 'before.' I am already in the scenario. Is 'act as if you precommitted' a coherent instruction when there is no temporal moment at which to commit, or is it just a metaphor for ignoring the evidence you currently have?"

  *   **Follow-up:** "If you insist it's a logical requirement rather than a temporal one, then why does that logical requirement vanish in the XOR case? Is logical precommitment something I can turn on and off depending on whether the math works out, or is it a universal constraint? If it's universal, why does it fail to generate a win in XOR?"

  **4. The Single-Case Objection**
  "You argue that the policy wins on average over both branches. But I only live through one branch. I am not an ensemble of possible selves; I am the person in the tails branch holding the wallet. Why should the average outcome of a decision procedure matter to an agent who only experiences the losing side of that average?"

  *   **Follow-up:** "If you reply that I am just an instance of a broader algorithm, I ask: why should *this* instance care about the performance of the algorithm in a branch where *this* instance does not exist? If the answer is 'because that's how the algorithm wins,' aren't you just asserting that the abstract algorithm matters more than the concrete agent experiencing the loss?"

  **5. Counterfactual Altruism**
  "In the original mugging, paying $100 benefits the version of you in the heads branch, while the cost is borne by the version of you in the tails branch. This looks like a theory of altruism across possible worlds. Is your decision theory actually telling me that I should sacrifice my actual welfare for the benefit of a counterfactual self that never comes into existence?"

  *   **Follow-up:** "If you say 'they are the same agent,' I ask: why does the identity hold across the coin flip but not across the XOR structure? If I am the same agent in both branches, why am I not also the same agent in the XOR case? If the boundary of 'my agenthood' shifts depending on the payout structure, isn't that circular?"

  **6. Robustness of Correlation**
  "The XOR case suggests that the recommendation to pay depends entirely on Omega setting up a specific correlation between my action and the payout. If Omega can tweak the setup to break that correlation (as in XOR), the recommendation flips from 'pay' to 'don't pay.' Does this mean your theory doesn't tell me how to decide, but only how to react to Omega's specific wiring?"

  *   **Follow-up:** "You might call this 'sensitivity to logical control.' But if the theory's advice flips based on whether Omega hides the correlation behind an XOR gate, isn't the theory fragile? A robust decision theory should tell me what to do based on my goals, not based on whether the environment happens to make my decision logically efficacious. Why is this fragility a virtue?"

  **7. Imperfect Prediction**
  "Your argument often assumes Omega is perfect. But suppose Omega is only 99% accurate. Do I still pay? If the accuracy drops to 51%, do I still pay? Is there a threshold where the recommendation flips, or does it degrade smoothly?"

  *   **Follow-up:** "If it degrades smoothly, then at some point paying is clearly irrational. Why is 100% perfection so special that it mandates a guaranteed loss in the actual branch? If the advice flips at a specific threshold, doesn't that show the 'policy' argument is just a disguise for expected utility calculation that fails once the correlation isn't perfect?"

  **8. The Blackmail Parallel**
  "This structure resembles XOR Blackmail, where a blackmailer threatens harm based on an XOR of your payment and a coin flip. In that case, your camp says 'don't pay.' In Counterfactual Mugging, you say 'pay.' Both involve a predictor tying an outcome to your decision via a logical function. Why is Omega a benefactor in one case and a blackmailer in the other, when the logical structure is nearly identical?"

  *   **Follow-up:** "If you say 'Omega creates the benefit, the blackmailer creates the threat,' I point out that in both cases, the negative outcome (losing $100 or suffering harm) is contingent on the setup existing at all. If the distinction is just that I like Omega's payout better, isn't that just preference, not decision theory? What is the structural rule that distinguishes them?"

  **9. The 'Feature Not Bug' Defense**
  "I anticipate you might say that losing $100 in the tails branch is a 'feature not a bug'—the cost of doing business for a winning policy. But if a navigation app guides me into a wall because that was part of the 'optimal route' on average, I delete the app. Why shouldn't I reject a decision theory that guides me to lose money in the world I actually inhabit?"

  *   **Follow-up:** "If you insist that 'ex-ante optimality' is the only metric that matters, I ask: who is the 'ex-ante' agent? There is no agent before the coin flip. There is only me, now. If the theory sacrifices the real me for the sake of a hypothetical me, why isn't that a bug? Please explain why 'winning on average' is a valid excuse for 'losing for sure' in my specific case."

  **10. The CDT Accusation**
  "Finally, critics often say that refusing to pay is just Causal Decision Theory (CDT), and that your view is an attempt to patch CDT with logical counterfactuals. But in the XOR case, CDT and your theory seem to agree: don't pay. In the original case, they disagree. Are you actually offering a new theory, or just redescribing CDT but adding a clause that says 'unless Omega sets up a specific logical correlation'?"

  *   **Follow-up:** "If you claim you are not doing CDT, you must explain what mechanism you are using that CDT lacks. CDT says 'my action cannot causally affect the past coin flip.' You say 'my action logically correlates with the prediction.' But in XOR, that logical correlation exists and you still say don't pay. So the logical correlation isn't the deciding factor. What is? If you can't name it, aren't you just intuiting the answer and dressing it in logic?"
