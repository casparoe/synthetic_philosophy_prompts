  A woman boards the Number 4, the "City Centre," after twenty years away. The bus halts in a cornfield.

  Woman: "Driver, the City Centre is miles back."
  Driver: "I know. I've driven this route since the start."
  Woman: "Then why are we here?"
  Driver: "Because we only move the stop a hundred yards a year. Nobody notices a hundred yards. So nobody noticed we left."

