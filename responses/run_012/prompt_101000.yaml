prompt: |-
  I'm a third-year cogsci student and I'm currently in a metaphysics of causation seminar. My other life is causal inference for ML, so my head is full of DAGs, do-calculus, potential outcomes, and token vs type causation. We've been doing causation by omission -- the gardener who doesn't water the plant, the doctor who doesn't prescribe, double prevention, all that -- and I keep trying to shove it into an SCM and it half works. Can you restate the main positions on omission (counterfactual dependence, causal process/mechanism, agency or action-based views, the norm/default stuff) in the vocabulary I actually use, as faithfully as possible? Then give me the residue report. What translates cleanly -- e.g. does not watering just become a variable set to its default, and is the do-operator even defined for non-events? What only translates with distortion? What has no counterpart at all? I'm especially curious whether double prevention and the omission/prevention asymmetry survive the translation or collapse into the same blocked-path story, and whether the fact that omissions aren't events means the SCM vocabulary is missing something or the original debate was less clear than it looked. Don't give me a reading list, just the translation and the residue.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

