answer: |-
  Here is the translation of the metaphysics of omission into Structural Causal Model (SCM) vocabulary, followed by the residue report on what survives the compilation process.

  ### Part 1: The Translation Layer

  **1. Counterfactual Dependence (Lewis)**
  *   **Philosophy:** $O$ (omission) causes $E$ (effect) iff, had $O$ not occurred (i.e., the action had been performed), $E$ would not have occurred.
  *   **SCM Translation:** Standard counterfactual query. Let $A$ be the action variable ($A=1$ water, $A=0$ don't water). Let $D$ be plant death ($D=1$ die, $D=0$ live).
      *   Omission causation holds if $D_{A=1} \neq D_{A=0}$ in the actual world where $A=0$.
      *   There is no special logic for omission; it is simply a counterfactual where the actual value of the treatment variable is the baseline/null state.

  **2. Causal Process / Mechanism (Salmon, Dowe)**
  *   **Philosophy:** Causation requires a physical process (transfer of energy/conserved quantity). Omissions lack this physical "glow," so they aren't causes (or are "quasi-causes").
  *   **SCM Translation:** This maps to the distinction between **structural dependence** vs. **physical flow**.
      *   In an SCM, a causal link $X \to Y$ exists if $Y$'s structural equation $f_Y$ depends on $X$.
      *   The "process" objection translates to a demand that the edge $X \to Y$ be instantiated by a non-zero flow of information or energy.
      *   In SCM terms, the philosopher is claiming that when $X=0$ (omission), the edge is structurally present but "inactive" or "latent," whereas standard causation requires the edge to be "active." SCMs generally treat the function $f$ as static; the "activity" is just the variance of $X$.

  **3. Agency / Action-Based Views (Hart & Honoré)**
  *   **Philosophy:** Omissions are only causal when there is a duty or capacity to act. The gardener causes death; the passerby does not, even if both counterfactually determine the outcome.
  *   **SCM Translation:** This requires expanding the graph to include an **Agent Node** ($G$) and distinguishing **Exogenous** vs. **Endogenous** interventions.
      *   Model the gardener as an endogenous variable $G$ influenced by duty/norms $U_{norm}$.
      *   Model the passerby as an exogenous variable $P$ (or a variable with no edge to $W$).
      *   Causation is restricted to variables within the "sphere of control" (the set of variables reachable by $do(\cdot)$ operations attributable to the agent).
      *   Alternatively: Causation is defined only over variables where $P(do(X)) \neq P(X)$ (intervention is possible). If the passerby cannot $do(Water)$, the edge doesn't exist for them.

  **4. Norms and Defaults (McGrath, Hitchcock)**
  *   **Philosophy:** Omissions are deviations from a normal/expected course of events. We pick out the omission as a cause because the action was the "default."
  *   **SCM Translation:** This maps to **Default Values** in structural equations and **Priors on Exogenous Variables** ($U$).
      *   Assign a "normal" value to every variable (e.g., $Water=0$ is normal for a random person, $Water=1$ is normal for a hired gardener).
      *   Causal strength or attribution is weighted by the surprise of the intervention: $-\log P(U=u)$.
      *   An omission is a cause only if the actual value $X=0$ is a deviation from the expected mode $E[X]$. If $X=0$ is the high-probability prior, causal attribution is down-weighted or zeroed.

  ---

  ### Part 2: The Residue Report

  Here is what happens when you compile the metaphysical debate into the SCM architecture.

  #### 1. Clean Translations (Lossless)
  *   **Counterfactual Dependence:** This compiles perfectly. The potential outcomes framework ($Y_{x}$) was built for this. The intuition that "if he had watered, it would live" is exactly $Y_{do(X=1)} = 0$.
  *   **Double Prevention as Path Activation:**
      *   *Scenario:* Assassin ($A$) shoots Bodyguard ($B$), preventing $B$ from shooting Victim ($V$). $A \to \neg B \to \neg (\text{Death})$.
      *   *SCM:* $B := \neg A$, $V := B$ (where $V=1$ is death). Substituting, $V := \neg A$.
      *   *Result:* $A$ is a cause of $V$. The SCM treats double prevention identically to direct prevention. It is simply a path $A \to B \to V$ where the transmission functions happen to be negations. The "double" nature is just an interaction term or a chain of boolean negations. It does not break the calculus.

  #### 2. Distortions (Lossy Compression)
  *   **The Ontology of "Nothing":**
      *   *Philosophy:* Omissions are ontologically suspicious. They are "nothings." How can a nothing cause a something?
      *   *SCM:* There is no "nothing." Every variable $V_i$ must take a value from its domain $Val(V_i)$ at all times. $Water=0$ is a state, not an absence.
      *   *Distortion:* SCM dissolves the ontological problem by fiat. It treats $X=0$ (omission) and $X=1$ (action) as symmetric states. If you feel omissions are metaphysically distinct, the SCM is hiding that distinction in the variable definition.
  *   **The Do-Operator on Non-Events:**
      *   *Question:* Is $do(X=0)$ defined?
      *   *SCM:* Yes. $do(X=x)$ sets variable $X$ to state $x$.
      *   *Distortion:* Philosophers worry you can't intervene to *make* an omission happen (you just let things be). In SCM, $do(Water=0)$ is mathematically identical to $do(Water=1)$. The asymmetry between "acting" and "refraining" is not in the operator, but must be manually encoded in the prior probability of the exogenous variables or the cost function of the intervention.
  *   **Normativity vs. Statistics:**
      *   *Philosophy:* "Default" often means *normative* (what the gardener *ought* to do), not just *statistical* (what gardeners usually do).
      *   *SCM:* Defaults are statistical modes ($P(X)$) or parameter initializations.
      *   *Distortion:* To capture "ought," you have to add a utility node or a deontic variable. The SCM itself is amoral. You can model the norm, but the calculus doesn't "know" it's a norm.

  #### 3. No Counterpart (The Null Set)
  *   **Moral/Legal Responsibility:** SCMs compute *causal effect* (ACE, CDE), not *blame*. You can compute that the passerby's inaction changed the outcome probability, but the SCM cannot tell you why the passerby isn't liable while the gardener is. That requires a layer of social contracting external to the graph.
  *   **The "Flood" of Causation:**
      *   *Philosophy:* If omissions are causes, then everyone who didn't save the plant is a cause. This is absurd (causal proliferation).
      *   *SCM:* The SCM agrees they are all causes (all have non-zero ACE). It does not find this absurd. It treats the "flood" as a feature, not a bug. The restriction to "actual causes" (Halpern-Pearl) tries to prune this, but it's a post-hoc constraint, not a fundamental limit of the model.

  ---

  ### Part 3: Specific Analysis of Your Friction Points

  **1. Double Prevention and the Omission/Prevention Asymmetry**
  *   **Do they collapse?** In standard SCM, **yes**.
      *   Prevention: $A \to \neg B$.
      *   Double Prevention: $A \to \neg B \to \neg C$ (which implies $A \to C$).
      *   Omission: $A=0 \to B=0$.
      *   All three are just paths in the DAG. The asymmetry does not survive in the *structure*.
  *   **Where does the asymmetry live?** It lives in the **Defaults**.
      *   If $B$'s default is 0 (off), then $A$ turning $B$ on is an *action*.
      *   If $B$'s default is 1 (on), then $A$ turning $B$ off is a *prevention*.
      *   If $A$'s default is 1 (act), and $A=0$, that is an *omission*.
      *   *Verdict:* The asymmetry is not structural; it is distributional. You need the prior $P(U)$ to distinguish them. Without priors, SCM treats prevention and omission symmetrically.

  **2. Are Omissions Events? (The Ontological Question)**
  *   **SCM Verdict:** The debate is likely less clear than it looked, or at least, it is a category error relative to the model.
  *   **Why:** In SCM, "event" = "variable assignment." Since variables are always assigned, omissions are events.
  *   **The Residue:** If you believe omissions *really* aren't events (metaphysically), then SCM is the wrong tool for that specific question. SCM is a tool for **dependency**, not **ontology**.
  *   **Hypothesis:** The metaphysical debate persists because philosophers are trying to derive **responsibility** from **ontology**. SCMs decouple these. SCM says: "Dependency exists (Yes/No). Responsibility is a separate function $R(Dependency, Norms, Agency)$."
  *   **Conclusion:** The fact that omissions aren't "events" in the physicalist sense doesn't break SCM, because SCM doesn't model physical events; it models information flow. The "missing something" is the physicalist constraint. If you need to know if energy was transferred, SCM is blind. If you need to know if $Y$ depends on $X$, SCM sees it clearly, regardless of whether $X$ was a "nothing."

  ### Summary for your Seminar
  You can tell your seminar: **SCMs treat omission as a variable set to its baseline value.**
  *   **Counterfactuals:** Work perfectly.
  *   **Mechanisms:** Abstracted away (structure replaces process).
  *   **Norms:** Must be hardcoded as priors or default values.
  *   **Double Prevention:** Collapses into standard path activation (no special logic needed).
  *   **The Residue:** The "weirdness" of omission is not in the dependency math; it is in the **selection of the model boundary** (who is an agent?) and the **assignment of defaults** (what is normal?). The SCM doesn't solve the metaphysics; it relocates it from the *logic of causation* to the *specification of the model*.
