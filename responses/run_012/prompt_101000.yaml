      *   *Double Prevention:* In SCM, it's $X \to \neg Y \to \neg Z \implies X \to Z$. It collapses into path activation. The asymmetry (omission vs. prevention) often relies on *defaults*. If $Y=0$ is default, preventing $Y$ is an action. If $Y=1$ is default, not preventing is an omission. SCM needs the default specified to distinguish them.
