          *   *SCM Translation:* Exogenous variables ($U$) vs. Endogenous ($V$). Or, distinguishing $do(X)$ by an agent vs. natural $X$.
      *   *Norms/Defaults (McGrath, Hitchcock):* Omissions are deviations from a norm.
          *   *SCM Translation:* Default values of variables. $X=0$ is the "normal" state, $X=1$ is the intervention. Causal strength depends on the prior $P(X)$.

  3.  **Drafting the Translation (Section 1):**
      *   *Counterfactual Dependence:* Easy. It's just $P(Y_{do(\neg o)} \neq Y)$. The "omission" is setting a variable to 0 (or baseline).
      *   *Process/Mechanism:* SCMs don't care about energy transfer. They care about functional dependence $Y := f(X, U)$. If $f$ exists, causation exists. Omission is just $X=0$ in the function.
      *   *Agency:* In ML, $do(X)$ implies an external intervention. But SCMs don't inherently distinguish *who* does the $do$. We need to model the agent as a node $A \to X$.
      *   *Norms/Defaults:* This maps to *default values* in structural equations or the prior distribution over exogenous variables. "Normal" = high probability mode.

  4.  **Drafting the Residue Report (Section 2):**
      *   *What translates cleanly:* Counterfactual dependence. The math handles $X=0$ fine. Double prevention looks like path blocking.
      *   *What distorts:*
          *   *Ontology:* Philosophers worry omissions aren't "events" (no spacetime location). SCMs treat $X=0$ and $X=1$ symmetrically as variable states. The "nothingness" problem vanishes in math but might be a bug, not a feature.
          *   *Norms:* SCMs can encode priors, but the *normativity* (ought vs. is) is external to the graph. You have to hardcode the "default."
          *   *Double Prevention:* In SCM, $A \to B \to C$. If $A$ prevents $B$, and $B$ prevents $C$, then $A$ causes $C$. This is just activating a path. Philosophy worries this makes causation too ubiquitous (the "flood" problem). SCM accepts the flood; philosophy fears it.
      *   *What has no counterpart:*
          *   *Moral/Legal Responsibility:* SCMs compute effect size, not blame.
