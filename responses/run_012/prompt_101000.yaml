      *   *Causal Process/Mechanism (Salmon/Dowe):* Conserved quantity transfer. Omissions lack physical process.
          *   *SCM Translation:* Missing edge? Or a path with zero flow? SCMs are abstract, so "process" is structural, not physical. This is a friction point.
