answer: |-
  **Brainstorming**

  The real choice before us is not merely procedural; it is ontological. We are deciding what kind of creature this union is. Draft A treats the union as a compact of governments, where boundaries are negotiated politically and finality rests with the elected representatives of the regions. Draft B treats the union as a constitutional order, where boundaries are legal questions adjudicated by neutral arbiters. Draft C treats the union as an experimental project, where competences are provisional and subject to renewal. The divergence is not just about who decides, but whether the division of power is a permanent structural feature or a temporary policy preference. If we choose A, we prioritize political flexibility over legal certainty. If we choose B, we prioritize legal certainty over political flexibility. If we choose C, we prioritize adaptability over stability.

  ***

  **Memorandum on the Competence Clause**

  **To:** The Competences Working Group
  **From:** Constitutional Adviser
  **Re:** Recommendation on the Subsidiarity and Competence Clause

  **Introduction**

  We are tasked with drafting the engine room of this charter. The competence clause determines not only who does what, but who decides who does what. The three drafts on the table reflect deep philosophical disagreements about the nature of sovereignty in a post-sovereign union. My purpose here is to cut through the institutional noise to identify the moral and political stakes, recommend a specific path forward, and acknowledge the genuine risks inherent in that choice.

  **Conceptions of the Political Community**

  Each draft presupposes a different conception of our political community. Draft A assumes a **Confederal Community**. It views the Regions as the primary masters of the charter. By placing enforcement in the Regions' Chamber and barring judicial review, it treats competence disputes as political conflicts to be resolved through bargaining and voting. It assumes that regional elites are the best guardians of regional autonomy.

  Draft B assumes a **Constitutional Community**. It views the charter as a higher law binding on both the Union and the Regions. By empowering the Constitutional Court to annul acts, it assumes that there are objective legal standards for competence that transcend political majorities. It trusts judges more than politicians to protect the structural integrity of the union.

  Draft C assumes a **Provisional Community**. It views the union as a dynamic experiment. The sunset clause and the remand power suggest that competence allocations are not fixed truths but working hypotheses. It assumes that today's necessity may be tomorrow's overreach, and institutions should be designed to admit error without collapsing.

  **Moral Choice vs. Institutional Design**

  Is this choice substantive or merely institutional? It is both. Institutional design is the machinery of morality. A subsidiarity principle that cannot be enforced is merely aspirational poetry. However, the method of enforcement shapes the moral outcome. If we choose Draft A, we accept that regional autonomy may be sacrificed for union efficiency if the political cost is low enough. If we choose Draft B, we accept that union efficiency may be sacrificed for regional autonomy if the legal test is not met.

  There is a noted inconsistency among us: some members demand rigid local control over culture but rigid union control over rights and movement. This is not a logical contradiction if we distinguish between *competence* and *value*. Subsidiarity governs competence (who acts); the Bill of Rights governs values (what is permissible). However, this inconsistency reveals that our debate is often about power rather than principle. We must design a clause that works even when the political winds shift and those who demand local control today demand union intervention tomorrow.

  **What Subsidiarity Requires**

  We must distinguish what the principle of subsidiarity strictly requires from what merely fits well with it. Subsidiarity strictly requires a substantive test: action must be necessary (lower levels cannot achieve the objective) and additive (higher level action adds value). It does not strictly require judicial review. The European Union operates with a political early-warning system similar to Draft A, though backed by judicial review. The United States operates largely with political safeguards of federalism, though backed by judicial review.

  However, subsidiarity fits best with a mechanism that allows for timely correction. A test without a remedy is no test at all. Therefore, while judicial review is not strictly required by the concept, it is required by the reality of power. Without it, the Union Commission will inevitably expand its reach, as all bureaucracies do.

  **Recommendation: A Hybrid Model**

  I recommend a hybrid of Draft B and Draft A, leaning toward B. We need the legal certainty of judicial review, but we must temper it with judicial deference to avoid transferring all policy choices to the courts.

  **Proposed Clause Language:**
  *"The Union shall exercise shared competence only if and insofar as the objectives of the proposed action cannot be sufficiently achieved by the Regions, either centrally or at regional level, but can rather, by reason of the scale or effects of the proposed action, be better achieved at Union level. Any Region may challenge an act before the Constitutional Court within three months of publication. The Court shall annul acts that fail this test. In reviewing necessity, the Court shall apply a manifest error standard, deferring to the Union's assessment of political objectives but rigorously reviewing the evidence of regional insufficiency. The burden of proof rests on the Union."*

  **Key Specifications:**
  *   **Trigger:** Any single Region (protects minorities against the Regions' Chamber majority).
  *   **Review Timeline:** Three months (ensures swift resolution).
  *   **Standard of Review:** "Manifest Error." This is crucial. It tells the Court: do not decide if the Union *should* act, decide if the Union's claim that it *must* act is plainly unreasonable.
  *   **Burden of Proof:** On the Union. This preserves the presumption of regional competence.

  **The Strongest Arguments Against This Recommendation**

  I must give full weight to the objections against this hybrid, particularly the judicial model.

  First, there is the charge of **local injustice**. History teaches us that "states' rights" and regional autonomy have often been code words for shielding local tyranny. In the United States, subsidiarity arguments were used to defend segregation. In giving Regions the power to challenge Union acts, we may be empowering them to block Union efforts to protect minorities within their borders. If the Union cannot act because a Region claims it can handle civil rights enforcement better, we risk entrenching inequality. Subsidiarity must never become a shield for injustice.

  Second, there is the charge of **judicial oligarchy**. A justiciable necessity test invites judges to make policy decisions under the guise of legal interpretation. When a Court decides whether a regional environmental policy is "insufficient," it is making a technical and political assessment. Critics argue this transfers contested policy choices from the democratic arena to the judicial bench, pretending to be neutral while imposing a specific vision of governance. By giving judges the power to annul, we risk gridlock where the Union is paralyzed by litigation from any disgruntled Region.

  These are serious risks. However, Draft A's political enforcement risks the opposite: a Union that expands unchecked because the political cost of objecting is too high for regions to bear individually. Draft C's sunset clause creates too much uncertainty for long-term investment and planning. The hybrid model attempts to balance these by limiting the Court's power to checking "manifest errors" rather than second-guessing policy wisdom.

  **What Would Change My Mind**

  I would move to support Draft A (Political Enforcement) if evidence suggested that our Constitutional Court lacks the institutional legitimacy or technical capacity to handle complex socio-economic assessments. If the Court is likely to be perceived as partisan, judicial review could destabilize the union more than it protects it. Additionally, if the Regions' Chamber can be structured to guarantee a veto power for minority regions, the political check in Draft A might suffice.

  I am most likely wrong about the **standard of review**. I propose "manifest error" to prevent judicial overreach, but this standard is notoriously difficult to apply consistently. It may prove too vague, leading to either judicial activism or abdication. If, during the drafting process, we can devise a clearer procedural test—for example, requiring the Commission to publish a specific "Subsidiarity Impact Statement" that the Court reviews for completeness rather than correctness—I might prefer that procedural check over the substantive "manifest error" standard. The risk here is that I am overestimating the judiciary's ability to exercise restraint while underestimating the political chamber's ability to act decisively.
