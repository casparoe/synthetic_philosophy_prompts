answer: |-
  **Project Title:** Admissibility and Equivocation: Dissolving the Internalism/Externalism Dispute Over Practical Reasons

  **Statement of the Question**

  The debate between internalism and externalism regarding practical reasons has reached a state of entrenched stalemate. The Williams-style internalist contends that for a statement of the form "A has a reason to φ" to be true, it must be possible to reach that conclusion via a sound deliberative route starting from A's subjective motivational set. The externalist counters that agents can have reasons to act regardless of their contingent motivations, often appealing to objective values or rational requirements. My project proceeds from the suspicion that this stalemate is not the result of a deep metaphysical disagreement, but rather a semantic and pragmatic equivocation. Specifically, I hypothesize that the term "reason" is being asked to discharge two distinct functional roles within our normative practices, each imposing different admissibility conditions on the considerations involved.

  The core research question is this: Is the concept of a practical reason univocal across the contexts of first-person deliberation and third-person appraisal, or is it systematically ambiguous? If internalism is understood as a thesis about *Deliberative Admissibility*—the conditions under which a consideration can legitimately move an agent to act—and externalism is understood as a thesis about *Appraisive Admissibility*—the conditions under which a consideration can legitimately license criticism of an agent's failure to act—then the apparent contradiction between them may vanish.

  However, dissolving the contradiction is only the first step. The substantive philosophical work lies in determining the relationship between these two admissibility conditions. Do they track a single underlying relation that manifests differently in different contexts, or do they refer to two distinct relations that share a name? If they are distinct, is this ambiguity benign, merely a matter of linguistic register, or does it do explanatory work? My project aims to construct a precise account of these admissibility conditions, test their independence through case analysis, and determine whether a unified theory of reasons is possible or if we must accept a dual-role account that fundamentally reconfigures the internalism/externalism debate.

  **Why Existing Positions Leave it Open**

  The existing literature treats the internalism/externalism debate as a dispute over the truth conditions of a single class of propositions. Both sides generally agree on what is being argued about: the nature of the relation denoted by "has a reason to." They disagree only on the extension of that relation. Internalists argue the extension is limited by psychological facts; externalists argue it is not. This shared assumption—that there is a single target concept—prevents the debate from progressing because each side can successfully defend their position within their own domain of intuition.

  Internalists draw strength from the "guidance constraint." A reason must be capable of guiding action. If an agent is psychologically incapable of being moved by a consideration, it seems category-mistaken to call it a reason for them. Externalists draw strength from the "authority constraint." We routinely criticize agents for failing to act on reasons they do not care about (e.g., the cruel person who feels no motivation to avoid causing pain). If reasons were limited to the subjective motivational set, this criticism would lose its normative force.

  Standard attempts to resolve this often invoke the distinction between "motivating reasons" and "normative reasons." However, presupposing this distinction begs the question. It assumes precisely what needs to be proven: that there are two distinct kinds of reasons at play. If I simply map internalism onto motivating reasons and externalism onto normative reasons, I have not explained *why* the debate exists or *how* the two concepts interact. I have merely labeled the stalemate.

  My project leaves this distinction open to investigation. I do not assume that deliberation and criticism operate on different ontological categories of reasons. Instead, I treat them as distinct social and psychological practices with their own norms of admissibility. The question is whether the norms of these practices converge on a single property or diverge. Existing positions leave this open because they focus on the metaphysics of reasons rather than the pragmatics of reason-talk. By shifting the focus to the conditions under which reason-claims are *admissible* in specific contexts, we can bypass the metaphysical impasse. If the admissibility conditions for deliberation require a link to motivation, and the admissibility conditions for criticism do not, then the internalist and externalist are both right, but about different things. The remaining task is to explain why we use the same word for both, and whether that usage obscures important philosophical machinery.

  **Methodology**

  This project is designed for a single semester of intensive research. The method is primarily conceptual analysis supported by thought experimentation, structured to move from mapping the terrain to stress-testing the hypothesis, and finally to constructing a positive account. I will not be conducting empirical research; rather, I will be engaging in rigorous conceptual engineering.

  *Weeks 1-3: Mapping the Admissibility Conditions*
  In the first three weeks, I will focus on defining the boundaries of the two roles without importing the standard motivating/normative distinction. I will analyze the practice of first-person deliberation to isolate the necessary conditions for a consideration to function as a premise in practical reasoning. Simultaneously, I will analyze the practice of third-person appraisal to isolate the conditions under which we hold agents accountable.
  *   *Deliverable:* A working draft distinguishing "Deliberative Admissibility" (DA) from "Appraisive Admissibility" (AA).
  *   *Task:* I will generate a list of intuitive constraints for each. For DA, this might include "psychological accessibility." For AA, this might include "objective validity." I will ensure these are derived from the practices themselves, not from pre-existing meta-ethical categories.

  *Weeks 4-7: Stress-Testing via Case Studies*
  Once the conditions are tentatively defined, I will subject them to counter-examples. The goal is to see if DA and AA can come apart. If they always coincide, the ambiguity hypothesis fails. I will focus on three specific types of cases:
  1.  **Depression and Apathy:** Cases where an agent retains the capacity for judgment but loses the capacity for motivation. Does the reason persist for appraisal (AA) even if it is inadmissible for deliberation (DA)?
  2.  **Radical Evil:** Cases where an agent is motivated to do wrong and psychologically incapable of caring about the good. Can we still criticize them (AA) if they cannot deliberate toward the good (DA)?
  3.  **Advice and Persuasion:** Cases where a third party offers a reason to an agent. Is the advisor speaking to the agent's DA or invoking AA?
  *   *Deliverable:* A matrix of cases showing where DA and AA diverge or converge.
  *   *Task:* I will write short vignettes for each case and test them against the definitions from Weeks 1-3. If the definitions yield counter-intuitive results, I will refine the admissibility conditions.

  *Weeks 8-11: Constructing the Positive Account*
  If the stress tests confirm that DA and AA are distinct, I will move to constructing a model of how they interact. This is the most difficult phase. I need to explain the semantic unity of "reason" despite the functional divergence. Is it a family resemblance concept? Is one primary and the other derivative?
  *   *Deliverable:* A draft of the core argument chapter.
  *   *Task:* I will develop a "Transmission Principle." If a consideration is admissible in appraisal (AA), does it entail that it *could* become admissible in deliberation (DA) under idealized conditions? Or are they wholly independent? I will explore whether the ambiguity is explanatory—i.e., does recognizing it solve other problems in moral psychology, such as akrasia or blame?

  *Weeks 12-15: Synthesis and Implications*
  In the final month, I will integrate the findings into a coherent paper suitable for the grant report and potential publication. I will explicitly address the implications for the broader internalism/externalism debate.
  *   *Deliverable:* Final paper (approx. 8,000 words) and grant report.
  *   *Task:* I will finalize the argument that the debate is dissolved not by refutation, but by disambiguation. I will also outline the costs of this view. Does accepting ambiguity weaken the normative force of reasons? I will prepare responses to likely objections, specifically the charge that this is merely verbal semantics.

  **Statement of a Successful Result**

  A successful outcome for this project does not necessarily mean proving that internalism or externalism is "correct." Rather, success is defined as achieving a stable conceptual framework that explains the persistence of the debate while offering a path forward.

  Specifically, success looks like a demonstrated divergence between Deliberative Admissibility and Appraisive Admissibility. If I can show that there are clear cases where a consideration licenses criticism (satisfies AA) but cannot function in deliberation (fails DA), and vice versa, then I have established that the single-relation assumption is false.

  Furthermore, success requires showing that this divergence is not trivial. It must do explanatory work. For example, if this dual-role account explains why we feel tension in cases of akrasia (the conflict between what is appraisively admissible and what is deliberatively admissible), then the project has generated philosophical value beyond mere taxonomy.

  Finally, a successful result will provide a clear statement of the "residual dispute." Even if the equivocation is real, there may be a deeper question remaining: What connects these two roles? Why do we use the same word? If I can provide a plausible genealogy or functional explanation for this unity-in-diversity, the project will have succeeded in relocating the debate to more fertile ground. The output will be a paper that argues the internalism/externalism debate is a category error, replacing it with a question about the relationship between the norms of agency and the norms of accountability.

  **Honest Account of Project Failure**

  It is crucial to acknowledge the specific conditions under which this project would fail. Given the speculative nature of conceptual analysis, there are several points of fragility.

  First, the project fails if the distinction between Deliberative Admissibility and Appraisive Admissibility collapses under scrutiny. It is possible that upon closer inspection, the conditions for legitimate criticism *entail* the conditions for legitimate deliberation. For instance, if it turns out that we can only legitimately criticize an agent if they *could have* been motivated by the reason (a "could have" that implies a counterfactual link to the subjective motivational set), then AA reduces to a modalized version of DA. In this scenario, the internalist wins, and my attempt to find a distinct externalist role fails.

  Second, the project fails if the ambiguity turns out to be merely verbal with no explanatory payoff. If I establish that there are two roles but cannot explain why they matter or how they interact, I have merely created a taxonomy without solving the philosophical problem. The grant funds a semester of work; if the result is a distinction that no one needs to use to solve other problems, the project has not produced sufficient value.

  Third, there is a risk of circularity. In defining the admissibility conditions, I might inadvertently build the conclusion into the premises. For example, if I define Appraisive Admissibility in a way that presupposes externalism, I have not earned the distinction. I must ensure the conditions are derived neutrally from the practices of reasoning and blaming. If I cannot maintain this neutrality, the argument will be question-begging.

  Finally, the project fails if I cannot articulate a coherent relationship between the two roles. If they are entirely independent, it becomes mysterious why we use the term "reason" for both. If I end up positing two entirely unrelated concepts that happen to share a name, I have not explained the phenomenon of reason-talk; I have eliminated it. A successful project must preserve the intuition that deliberation and criticism are related, even if they are distinct.

  **Critical Reflection: What Would Change My Mind**

  To ensure intellectual honesty, I must identify the specific argument or consideration that would convince me that my framing is incorrect and that the two roles are, in fact, one.

  The most significant threat to my hypothesis is the **Transmission Principle for Rational Criticism**. This principle holds that legitimate criticism of an agent's action presupposes that the agent had the capacity to recognize and act upon the reason in question. If this principle is true, then Appraisive Admissibility cannot float free of Deliberative Admissibility. To criticize an agent for failing to φ, I must be able to say that they had a reason to φ that was accessible to their deliberation. If the reason was totally inaccessible to their subjective motivational set (even under idealized deliberation), then criticizing them seems unfair or unintelligible.

  If I encounter a robust argument showing that criticism *loses its normative force* without a link to the agent's motivational capacity, my distinction collapses. For example, if it can be shown that blaming someone for failing to act on an external reason is merely an expression of emotional venting rather than a rational practice, then the Externalist role (AA) evaporates. The externalist intuition—that we can criticize the cruel person—might rely on the hidden assumption that the cruel person *could* have cared, had they been rational. If that "could" implies a internalist constraint, then externalism is just internalism under idealization.

  Where is the reasoning in this plan most likely to break down? It is in **Weeks 4-7**, during the stress-testing phase. This is where the abstract definitions meet concrete intuitions. It is highly probable that my initial formulation of Admissibility Conditions will be too rigid. Real-world cases of deliberation and criticism are messy. An agent might deliberate using a consideration that they don't strictly care about (e.g., prudential reasons they acknowledge but feel no pull toward). If such cases are common, the boundary between DA and AA blurs.

  Furthermore, the reasoning is fragile regarding the **semantics of "Reason."** I am assuming that if the roles are different, the term is ambiguous. However, it is possible that the term is univocal but *context-sensitive*. Just as the word "flat" means different things in different contexts (physically flat vs. geometrically flat) without being ambiguous, "reason" might have a single core meaning that adapts to context. If this is the case, my project's conclusion that there is an equivocation might be linguistically imprecise. I need to be prepared to pivot from "ambiguity" to "contextualism" if the evidence suggests a unified core meaning that flexes rather than breaks.

  Ultimately, the strongest argument against my framing is the unity of rational agency. If agency is a unified phenomenon, it is odd to suppose that the reasons governing it split into two unrelated kinds. If I find that I cannot explain how an agent navigates between these two roles without positing a higher-order unifying principle, then I will have to concede that the internalism/externalism debate is not a mistake, but a reflection of a genuine tension within the nature of agency itself. In that event, the project would shift from dissolving the dispute to explaining the tension, which is a different, though still valuable, outcome. I am prepared to follow the argument where it leads, even if it means abandoning the equivocation hypothesis in favor of a more complex unified theory.
