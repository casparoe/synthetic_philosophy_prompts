  # The Pleasure Decision Tree

  **Start Here:** Think of the first sip of coffee and the relief of finally peeing. They feel nothing alike. Yet we call both "pleasures."

  ### 1. The Commonality Check
  **Is there a specific mental "ingredient" present in both experiences, or do they just get lumped together because they behave similarly (e.g., you seek them both)?**
  *   **No Ingredient:** They are only a "family" with overlapping features, no single shared core. → **Family-Resemblance Pluralism**
  *   **Yes Ingredient:** There is something genuinely shared. → *Go to 2*

  ### 2. The Definition Check
  **Is that shared thing defined by what it *makes you do* (want more, repeat the action), or by what it *is* (a specific mental state)?**
  *   **Defined by Action:** Pleasure *is* the disposition to seek more; the feeling is incidental. → **Desire/Functional-Role View** (Dan's View)
  *   **Defined by State:** The mental state itself is the pleasure, regardless of what you do next. → *Go to 3*

  ### 3. The Location Check
  **Is that mental state something you *do* toward the experience (a stance/attitude), or something you *feel* in the experience (a texture/quality)?**
  *   **Something You Do (Attitude):** Pleasure is "taking a pro-stance" toward the coffee or the relief. → *Go to 4*
  *   **Something You Feel (Phenomenal):** Pleasure is a felt quality within the experience itself. → *Go to 5*

  ### 4. The Target Check (Attitude Branch)
  **When you take this stance, must you be pleased *by* something specific (the coffee, the song), or can you just be in a pleased state without a target (a sudden mood lift)?**
  *   **Must Have a Target:** You cannot be pleased without being pleased *in* something. (Note: Makes objectless pleasures like "a warm bath" awkward to classify). → **Object-Directed Attitudinalism**
  *   **Can Be Targetless:** You can be in a state of "being pleased" generally, like a background mood. → **Free-Floating Attitudinalism**

  ### 5. The Texture Check (Feeling Branch)
  **Is the pleasantness a separate sensation (like a buzz added to the taste), or a way of tasting the sensation itself (like the sweetness *in* the coffee)?**
  *   **Separate Sensation:** A distinct "glow" or "hum" that accompanies various sensations. → **Hedonic Tone Monism**
  *   **Way of Tasting:** A property or mode of the experience itself, not a separate ingredient. → *Go to 6*

  ### 6. The Command Check (Property Branch)
  **Does this "way of tasting" issue a command ("More of this!"), or is it just a descriptive quality (a "glow")?**
  *   **Issues a Command:** The pleasantness *is* the felt imperative to continue. → **"More of This" Imperativist View**
  *   **Descriptive Quality:** It is just a way the experience feels, not a command. → *Go to 7*

  ### 7. The Simplicity Check (Quality Branch)
  **Is this quality simple and indefinable (you just know it), or can it be analyzed into other parts?**
  *   **Indefinable:** Pleasure is a primitive, simple property that cannot be broken down. → **Pleasure as Primitive**
  *   **Analyzable:** The quality can be described in terms of fit, satisfaction, or other properties. → **Mode/Property View**

  ***

  ### Honest Note on the Splits

  **Common Ground:**
  Almost everyone accepts the first split (**Pluralism vs. Realism**) as the meta-debate. If you choose Pluralism, the rest of the tree doesn't apply to you. Similarly, the split between **Functionalism** (Dan's view) and **Mental State** theories is a standard fault line; functionalists deny the mental state is essential, while the rest of the tree assumes it is.

  **Genuinely Contested:**
  The **Attitude vs. Feeling** split (Node 3) is the main war zone in contemporary philosophy. Attitudinalists argue feelings are too diverse (coffee vs. peeing) to be the unity, so the unity must be the *stance*. Phenomenalists argue you can't have a stance without a felt reason for it, so the feeling must be primary.

  **Flagged Weaknesses & Overlaps:**
  *   **Mode/Property vs. Primitive (Nodes 6 & 7):** These are often indistinguishable in practice. "Primitive" is frequently just a placeholder for "I believe it's a Mode/Property but I can't analyze it further." If you find yourself arguing that the quality is simple *and* descriptive, you might bounce between these two leaves.
  *   **Free-Floating Attitudinalism:** This is a niche position (associated with Fred Feldman). Many critics argue a "targetless pleasure" is just a mood (like mania) and shouldn't count as "pleasure" in the philosophical sense. If you think a warm bath *must* have an object (the warmth), you should not end up at Free-Floating.
  *   **Imperativist vs. Functional:** Be careful not to confuse the "More of this!" *feeling* (Imperativist) with the *disposition* to seek more (Functional). The Imperativist says the command is part of the *feel*; the Functionalist says the seeking is what *defines* the pleasure, even if the feel is absent.
