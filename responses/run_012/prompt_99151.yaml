answer: |-
  Here is the case construction you requested. It is designed to be mathematically transparent, philosophically clean, and fit on a single slide. It isolates the structural disagreement between aggregation methods without relying on inequality aversion or harm.

  ### The Case: "The Dilution Scenario"

  **Option A (The Smaller World)**
  *   **Population:** 10 people.
  *   **Welfare:** Each person has **10** units of welfare.
  *   **Total Welfare:** 100.
  *   **Average Welfare:** 10.

  **Option B (The Larger World)**
  *   **Population:** 20 people (The original 10 + 10 new people).
  *   **Welfare:** The original 10 retain **10** units. The 10 new people have **2** units.
  *   **Total Welfare:** 120.
  *   **Average Welfare:** 6.

  **Constraints Check:**
  1.  **Mere Addition:** The 10 people in A exist in B with identical welfare. No one is made worse off.
  2.  **Worth Living:** The 2 units of welfare for the new people are positive (above the zero-line of non-existence). They are glad to exist.
  3.  **No Inequality/Harm:** The disagreement does not stem from the new people being suffering or wronged, nor from a distributive penalty for inequality (though inequality exists, it is not the *driver* of the AU verdict).
  4.  **Arithmetic:** Integers only; calculable mentally.

  ---

  ### 1. The Four Verdicts

  Here is how the standard views process these numbers. Note that the verdicts are derived from the aggregation formulas, not stipulated.

  | View | Formula | Calculation | Verdict | Reason |
  | :--- | :--- | :--- | :--- | :--- |
  | **Total Utilitarianism** | Maximize $\sum w$ | A: 100 <br> B: 120 | **B is Better** | B contains 20 more units of total good. The gain to the new people outweighs the dilution of the average. |
  | **Average Utilitarianism** | Maximize $\frac{\sum w}{N}$ | A: 10 <br> B: 6 | **A is Better** | The new lives are below the initial average. Adding them drags the mean down, reducing the overall "quality" of the world. |
  | **Person-Affecting View** | Better only if better for someone | A: No change for originals.<br> B: New people benefit from existence, but don't exist in A to compare. | **On a Par** | B is not worse than A (no one is harmed). A is not better than B (the originals are not benefited by the absence of the new people). |
  | **Critical-Level (Variable)** | Maximize $\sum (w - c)$ | Depends on $c$ (see below) | **Varies** | Verdict flips based on whether the added welfare exceeds the critical level $c$. |

  ---

  ### 2. The Critical-Level Spectrum

  Critical-Level Utilitarianism (CLU) evaluates outcomes by summing the difference between each person's welfare and a critical threshold $c$.
  $$V = \sum_{i=1}^{N} (w_i - c)$$

  Let us run CLU across a range of $c$ values to see how the verdict shifts.

  *   **The Total Utilitarian End ($c = 0$):**
      $$V(A) = 10(10 - 0) = 100$$
      $$V(B) = 10(10 - 0) + 10(2 - 0) = 120$$
      **Verdict:** B > A. (Collapses into Total Utilitarianism).

  *   **The Flip Point ($c = 2$):**
      $$V(A) = 10(10 - 2) = 80$$
      $$V(B) = 10(10 - 2) + 10(2 - 2) = 80 + 0 = 80$$
      **Verdict:** A = B. (Indifference).
      *Arithmetic:* The value added by the new group is $10 \times (2 - c)$. This is zero exactly when $c$ equals their welfare level (2).

  *   **The Average Utilitarian Alignment ($c > 2$, e.g., $c = 10$):**
      $$V(A) = 10(10 - 10) = 0$$
      $$V(B) = 10(10 - 10) + 10(2 - 10) = -80$$
      **Verdict:** A > B. (Agrees with Average Utilitarianism).

  **The Transition:** As $c$ rises from 0, the "credit" given to the new lives decreases. Once $c$ exceeds the welfare of the added lives (2), their contribution becomes negative, and CLU switches from preferring B to preferring A.

  ---

  ### 3. The Single Feature Doing the Work

  You asked to identify the specific feature responsible for the split, distinct from population size or inequality.

  **The Feature:** The **Marginal Welfare Gap**.
  Specifically, the welfare of the added lives ($L=2$) is **positive** but **strictly less than the initial average** ($H=10$).
  $$0 < L < \text{Avg}_A$$

  **Why this feature?**
  *   **Population Size:** If you double the added people in B (20 new people at 2 utils), Total Utilitarianism likes B *more*, and Average Utilitarianism likes A *more*. The *magnitude* of the disagreement changes, but the *direction* does not. Population size amplifies the conflict but does not create it.
  *   **Inequality:** If you added 10 people at welfare 10 (perfect equality maintained), Average Utilitarianism would be indifferent (Avg stays 10), while Total Utilitarianism would prefer B. The disagreement would persist despite zero inequality. Thus, inequality is not the driver.
  *   **The Gap:** If you remove this feature by setting $L = 10$ (added lives equal the average), Total and Average Utilitarianism **collapse into agreement** (both prefer B). If you reverse it by setting $L = 12$ (added lives above average), they **collapse into agreement** (both prefer B).

  The disagreement exists *only* because the added lives are good enough to count positively for Total Utilitarianism, but weak enough to drag down the mean for Average Utilitarianism.

  ---

  ### 4. Handling the Objection (Seminar Defense)

  In this specific case, **Average Utilitarianism** comes out looking the worst. It implies that a world with 10 happy people is *better* than a world with those 10 happy people plus 10 additional people who are also glad to be alive. This sounds like it condemns the creation of happy lives.

  **The Strongest Defense (The AU Defender's Reply):**
  Your students will likely attack AU for implying it is "bad" to add the 10 new people. The AU defender should not retreat; they should reframe the intuition.

  **The Argument:**
  > "You are smuggling in a Person-Affecting intuition ('who is harmed?') into an Impersonal calculation ('what is the value of the state of affairs?'). Average Utilitarianism does not say the new people are harmed; they benefit from existence. It says that **value is a density, not a mass**.
  >
  > Imagine a painting. Adding a large patch of mediocre color to a masterpiece might increase the total square inches of paint (Total View), but it lowers the average aesthetic quality per inch (Average View). If we care about the *quality of the moral community*, a world where everyone flourishes at level 10 is a higher grade of reality than one where half flourish and half merely scrape by. The verdict A > B preserves the intuition that we should aim for excellence, not just accumulation."

  **How to field this:**
  When a student objects that "AU says it's better if the 10 new people never existed," acknowledge the cost. Admit that AU accepts this implication to avoid the **Repugnant Conclusion** (the idea that a massive population of barely worth living lives is better than a small population of excellent lives). Frame it as a trade-off: AU avoids the Repugnant Conclusion in the long run, but pays the price of counter-intuitive verdicts in "Mere Addition" cases like this one.

  ---

  ### Summary for your Slide

  *   **A:** 10 people @ 10 utils. (Total 100, Avg 10)
  *   **B:** 10 people @ 10 utils + 10 people @ 2 utils. (Total 120, Avg 6)
  *   **TU:** B > A (More good exists).
  *   **AU:** A > B (Higher quality of life).
  *   **PAV:** A = B (No one harmed, new people don't count for comparison).
  *   **CLU:** Flips at $c=2$.
  *   **Driver:** $0 < \text{Added Welfare} < \text{Initial Average}$.

  This case meets your specification cleanly. It isolates the aggregation problem from distribution, ensures the added lives are unambiguously worth living, and provides a clear arithmetic pivot point for the Critical-Level analysis. Good luck with the seminar.
