      *   *Challenge:* The user *knows* this ("I want you to be honest about where the fit breaks"). I need to use Arrow as a lens/metaphor while rigorously pointing out the structural mismatches. I cannot simply say "Arrow applies." I must say "Arrow illuminates X, but breaks at Y."

  3.  **Drafting the Analysis - Section by Section:**

