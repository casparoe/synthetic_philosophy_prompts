          *   *Profiles:* Not single-peaked. Two main dimensions: Ideology (Left vs. Moderate) and Electability (Pure vs. Beatable). This violates the "single-peaked" condition that usually saves us from Arrow/Cycling.

      *   **Arrow's Conditions & Where They Break:**
          *   *Unrestricted Domain:* Preferences were definitely unrestricted (multidimensional). This is where the "chaos" comes from. If everyone were just Left-Right, Biden or Sanders likely wins cleanly. The "Electability" dimension creates the cycle.
          *   *IIA (Independence of Irrelevant Alternatives):* This is the juiciest part. Did the removal of Buttigieg/Klobuchar change the relative ranking of Sanders vs. Biden? Yes. Was Buttigieg "irrelevant"? In Arrow's sense, an alternative is irrelevant if its removal doesn't change the social ranking of the *remaining* pair. Here, his removal *did* change the winner. So, strictly speaking, the system violated IIA. But was he "irrelevant"? No, he was a *relevant* spoiler. Arrow says *no* system satisfies IIA + others. Plurality definitely fails IIA.
          *   *Pareto/Non-Dictatorship:* Less relevant here, but worth noting no single voter dictated.

      *   **The "Fit Breaks" (The Honest Part):**
          *   Arrow assumes a *single* aggregation event. The primary was *sequential*.
          *   Arrow assumes *fixed* alternatives. Candidates exited endogenously.
          *   Arrow assumes *sincere* preferences. Endorsements caused strategic updating (Bayesian updating on electability), not just revelation of static preferences.
          *   Arrow outputs a *social ordering*. The primary outputs a *winner* (with delegate counts).

      *   **The Buttigieg/Klobuchar Exit:**
          *   Did preferences change? Yes, in the sense of *utility*. Voters care about winning. If Candidate A drops and endorses B, B's "Electability" score goes up. So the preference ordering $A \succ B \succ S$ might become $B \succ S$ because $B$ is now more viable.
          *   Is this coordination? Yes.
