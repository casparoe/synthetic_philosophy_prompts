  7.  *(Self-Correction during drafting)*: Wait, the prompt asks about the 15% threshold. That's a quota system, effectively. It creates non-linearities. I should mention that. Also, the prompt mentions Warren staying in. That's a classic spoiler scenario. I need to make sure I don't let the "Arrow doesn't apply" disclaimer overshadow the actual analysis. I will frame it as "Arrowian Pathologies in a Non-Arrowian System."

  8.  *(Final check on IIA)*: In Arrow, IIA means the social ranking of X and Y depends *only* on individual rankings of X and Y. In Plurality, if I vote Pete, and Pete drops, I might vote Joe. The removal of Pete changed my vote between Joe and Bernie. That violates IIA. So Plurality fails IIA. Arrow says *all* systems fail something. Plurality fails IIA. This fits.

