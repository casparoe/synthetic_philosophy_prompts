answer: |-
  This is one of the sharpest questions I have encountered about the ontology of art. You have identified the central tension in intellectual property law and culture: the gap between the **Idea/Expression Dichotomy** (the legal doctrine) and the **Romantic Theory of Authorship** (the cultural myth).

  Here is the breakdown of what your profession's practices presuppose, where the theory holds, where it breaks, and what would happen if you changed the axioms.

  ### 1. What the Practice Presupposes About Creation
  Your industry operates on a dualistic view of what a "creation" is, depending on whether you are speaking legally or socially.

  **Legally: Creation is Arrangement, not Genesis.**
  The law presupposes that **ideas are natural resources, like air or water.** No one can own the concept of "a boy wizard goes to school" any more than one can own the concept of "a bridge." Copyright law assumes that the creative labor is not in the *discovery* of the premise, but in the *execution* of the specific expression.
  *   **The Theory:** This is primarily **Utilitarian**. The U.S. Constitution, for instance, grants copyright "To promote the Progress of Science and useful Arts." The logic is that if you could own the idea of a boy wizard, no one else could write Harry Potter fanfic, or *The Magicians*, or *Jonathan Strange & Mr Norrell*. Progress would halt. Therefore, ownership must be narrow (words) to ensure the commons (ideas) remains open.
  *   **The Boundary:** The boundary is set at **fixation**. You own the moment the abstract becomes concrete. This is a administrative necessity. Courts can compare two strings of text; they cannot reliably compare two "vibes" or "structural architectures" without stifling future work.

  **Socially: Creation is Extension of Self.**
  Your agent's fear and your friend's anger presuppose the **Hegelian Personality Theory**. This view holds that a work is an extension of the author's soul. When you share an unpublished draft or a pitch, you are sharing a piece of your identity.
  *   **The Contradiction:** The industry *says* "ideas aren't property" (Legal/Utilitarian) but *acts* as if "ideas are intimate secrets" (Social/Personality).
  *   **Why Agents Behave That Way:** This is not actually about philosophy; it is about **liability asymmetry**. If an agent reads your manuscript and later represents a book with a similar plot, they cannot *prove* they didn't steal it. Even if they win the lawsuit, they lose the money. So, they treat ideas *as if* they are property to mitigate risk, even though the law says they aren't. It is a defensive crouch, not a philosophical stance.

  ### 2. Is There a Real Theory, or Just Accidents?
  It is a pile of historical accidents wearing a Utilitarian costume, held together by administrative feasibility.

  *   **The Accident:** Copyright law evolved from the Statute of Anne (1710), which was designed to regulate printers, not protect geniuses. The focus on "copying" (literally, copying text) is baked into the technology of the printing press. It was easier to police presses than minds.
  *   **The Costume:** We layered the Romantic myth of the "Solitary Genius" on top of this printer-focused law in the 19th century. This created the cognitive dissonance you feel. We tell authors they are Geniuses (which implies ownership of ideas) but give them Legal Protection only for Mechanics (words).
  *   **The Necessity:** The only part of this strictly *needed* is the **Idea/Expression Dichotomy**. Without it, the first person to write a tragedy owns tragedy. The specific duration (life + 70 years) or the specific social taboos are incidental. They could be shorter or longer without collapsing the system.
  *   **The Comfort:** The system sits comfortably with **Labor Theory** (Locke) only superficially. You mix your labor with the commons to create property. But because the "commons" of ideas must remain free, your property rights are truncated.

  ### 3. Why History and Chemistry Differ
  *   **History (Citation):** Your partner cites ideas not because ideas are property, but because history is a **truth-claim discipline**. Citation is about verification and lineage, not ownership. If I cite Newton, I am not paying him royalties; I am mapping the genealogy of truth.
  *   **Chemistry (Patents):** Your brother patents molecules because patents are a **contract with the state**. He must disclose exactly how to make the molecule (full transparency), and in exchange, he gets a temporary monopoly (20 years). Copyright requires no disclosure (you can keep the manuscript in a drawer) and lasts much longer. You cannot patent a plot because plots are not "useful arts" in the industrial sense, and there are too few of them. If you patented the "Hero's Journey," storytelling would cease.

  ### 4. The Counterfactual: What If Ideas Were Ownable?
  If we swapped the underlying view to one where **influence counted as theft** and **premises were property**, the industry would undergo a catastrophic phase shift:

  1.  **The End of Genre:** Genre is essentially the recycling of premises with new expression. If the "locked-room mystery" were owned, you would need a license to write one.
  2.  **Clearance Culture:** Just as filmmakers must clear music rights, writers would need to hire "Idea Clearance Lawyers" before drafting. You would submit a premise to a registry to check for conflicts.
  3.  **Stifled Collaboration:** Writers' groups and workshops would vanish. Sharing a draft would be legally equivalent to handing over a trade secret.
  4.  **The Rise of the Conglomerate:** Only large publishers could afford the insurance and legal teams to verify that a new book didn't infringe on an existing "idea property." Independent authors would be litigated out of existence.
  5.  **Artistic Stagnation:** All art is recombination. If you cannot steal the *structure* of a story, only the words, you remove the ability to write homage, parody, or evolution. We would be left with isolated silos of creation.

  ### 5. Confidence and Uncertainty

  **Confidence Level: High (85%)**
  I am highly confident in the description of the legal framework (Idea/Expression Dichotomy), the economic incentives (Utilitarianism vs. Monopoly), and the sociological reasons for agent behavior (Liability Avoidance). These are well-documented in legal theory and industry practice.

  **The Point I Am Least Sure About:**
  I am least certain about the **origin and necessity of the social taboo.**
  While I am sure agents avoid unsolicited manuscripts for liability reasons, I am less sure why the *social* stigma among peers (your friend freezing you out) is so potent.
  *   *Theory A:* It is purely internalized capitalism (we treat ideas like capital because we live in a market).
  *   *Theory B:* It is a deeper, pre-legal human intuition about fairness and reciprocity that the law simply fails to capture.
  *   *Theory C:* It is a tribal signaling mechanism to enforce group cohesion among writers.

  I lean toward Theory B mixed with A, but I cannot prove whether that social intuition is a "bug" (a misunderstanding of how art works) or a "feature" (a necessary social glue that the law wisely ignores to keep the market moving). The law ignores the social intuition to keep the industry functional; the social intuition ignores the law to keep relationships honest. How that tension resolves in the long term is the variable I cannot predict.
