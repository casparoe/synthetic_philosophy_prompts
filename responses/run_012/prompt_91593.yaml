      *   Confidence and uncertainty flagged? Yes.

  **(Self-Correction on Confidence):** I should be careful not to present the "Utilitarian" view as the *only* truth. It's the dominant legal theory in the US (Constitutional clause "To promote the Progress"), but Europe leans more on "Moral Rights" (Personality). I should acknowledge this tension. The user is likely in the US/UK sphere given the "agent" talk, but the philosophy varies. I will focus on the Anglo-American tradition as it fits the "agent/editor" context best.

  **(Self-Correction on Least Sure Point):** The hardest thing to pin down is *why* the social norm is so strong if the law is so weak. Is it just risk aversion, or is there a deeper intuitive sense of fairness? I'll flag the *origin* of the social taboo as the uncertain part.

