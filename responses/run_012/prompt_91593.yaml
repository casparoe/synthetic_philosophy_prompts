prompt: |-
  Novelist here, and I keep bumping into something in my own trade that I can't make sense of philosphically, so I'm hoping you can tell me what my profession actually believes.

  Here's the cluster of things. Everyone in publishing says you can't own an idea, only the way it's written down. If I hear a great premise at a party and write a novel on it, that's legal and, most people would say, fine. But: my agent won't read unsolicitted manuscripts, and the reason given is always that if she reads someone's unpublished novel and then a similar book comes out, she'll be accused of stealing. Editors I know won't open an envelope that might contain a story idea. If I read a friend's draft and two years later publish something with a similar twist, I get quietly frozen out of that friendship even though I never used a word of hers. So we all say ideas aren't property, and then we behave, day to day, exactly as if they were, as if the causal history of where I got something had a bearing on whether it's mine.

  Second wrinkle. What actually gets you in trouble, legally and socially, is sequence of words: a copied paragraph, a lifted sentence. Lift an entire plot, the structure, the whole emotional architecture, rewrite every sentence, and you're mostly in the clear. But surely the plot was the harder, more original thing? So the rule is grabbing hold of something much narrower than the thing we intuitively think of as the creation.

  My partner teaches history and has to cite where every idea came from, and my brother is a chemist and in his world you can patent a molecule. Nobody in mine can patent a plot. So it's not as if this is just how ownership of the intangible always works. It seems to work differently in each shop.

  What I want from you: what does this practice presuppose about what a creation is, and about why anything can be owned at all? Is there a real theory underneath it, about labor or incentives or personality or fixability or boundaries, or is it a pile of historical accidents wearing a theory as a costume? Which parts does the practice strictly need, and which does it just happen to sit comfortably with? And if you swapped the underlying view out, say for one on which ideas genuinely were ownable and influence counted as theft, what would actually have to change in how we work?

  Also, tell me how confident you are in what you say, and flag the one point you're least sure about.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** A novelist. They are observant, philosophically inclined, and frustrated by the contradictions in their industry's norms regarding intellectual property (IP).
      *   **Core Conflict:** The industry claims "ideas aren't property" (legal doctrine), yet behaves as if they *are* (social/professional norms). Also, protection focuses on expression (words) rather than structure/plot, even though plot feels more "creative."
      *   **Comparisons:** History (citation required for ideas), Chemistry (patents for molecules).
      *   **Questions:**
          1.  What does this practice presuppose about creation and ownership?
          2.  Is there a real theory (labor, incentives, personality, etc.) or just historical accidents?
          3.  Which parts are necessary vs. incidental?
          4.  What would change if ideas *were* ownable?
          5.  **Constraint:** State confidence level and flag the least sure point.

  2.  **Deconstruct the Phenomenon:**
      *   *Legal Doctrine:* Idea/Expression Dichotomy (Copyright law). You own the fixation, not the abstraction.
      *   *Professional Norms:* Agents/Editors avoiding unsolicited work to prevent *appearance* of impropriety (liability avoidance). Social stigma against "stealing" plots among peers (reputation management).
      *   *Philosophical Underpinnings:*
          *   *Lockean Labor Theory:* You mix labor with resources. But where does the labor end? At the word? At the plot?
          *   *Utilitarian/Incentive Theory:* Copyright exists to promote progress. Too much protection stifles creation (you can't write about love or death if those are owned).
          *   *Hegelian Personality Theory:* The work is an extension of the self. This supports stronger moral rights (more common in Europe) but still struggles with "ideas."
          *   *Romantic Authorship:* The myth of the solitary genius. This fuels the social stigma against idea theft, even if law doesn't support it.

  3.  **Address the Specific Contradictions:**
      *   *Why the "Ideas aren't property" vs. "Don't steal my idea" clash?*
          *   Legal vs. Social/Legal Liability. Agents aren't protecting the *idea*; they are protecting *themselves* from lawsuits. Even if they would win, the cost of defense is too high.
          *   Socially, among friends, it's about trust and reciprocity, not legal title.
      *   *Why Expression over Plot?*
          *   Scarcity. There are infinite sentences, but finite plots (archetypes). If plots were owned, creation would halt.
          *   Definability. It's easy to prove text match. It's hard to prove "you stole my twist on the unreliable narrator."
      *   *Why different from History/Chem?*
          *   History: Truth claims. You cite to show rigor and allow verification, not because the fact is owned.
          *   Chem: Patents require novelty, utility, non-obviousness, and *expiration*. Copyright is automatic and long. Patents are a trade-off (disclosure for monopoly). Copyright is a reward for fixation.

  4.  **Synthesize the "Theory Underneath":**
      *   It's not one theory. It's a pragmatic hybrid.
      *   *Core:* Utilitarianism (Incentives) + Administrative Feasibility.
      *   *Surface:* Romantic Authorship (The "Genius" myth).
      *   *The "Costume":* The industry wears the language of property to manage risk, but the law wears the language of expression to ensure future creation.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sharpness of the observation. Validate that this is a known tension (the "Idea/Expression Dichotomy").
      *   *Section 1: The Legal vs. Social Split.* Explain *why* agents behave that way. It's not about the writer's rights; it's about the agent's liability. Distinguish between *ontological* ownership (is it mine?) and *epistemological* risk (can I prove I didn't steal it?).
      *   *Section 2: The Theory of Creation.* What is a "work"? It's not the idea (too abstract) or the physical book (too concrete). It's the *specific arrangement*. Connect to the "finite tropes, infinite sentences" argument.
      *   *Section 3: Comparison to History/Science.* Clarify the purpose of citation (truth-tracking) vs. patents (temporary monopoly for disclosure) vs. copyright (incentive for expression).
      *   *Section 4: Necessary vs. Incidental.*
          *   Necessary: The Idea/Expression divide (to allow new art).
          *   Incidental: The specific duration, the specific social taboos (which vary by subculture).
      *   *Section 5: The Counterfactual.* What if ideas were property? Paralysis. Clearance culture. End of fanfic, homage, genre writing.
      *   *Confidence & Uncertainty:* Need to be honest. High confidence on the legal/sociological description. Lower confidence on the *ultimate philosophical justification* because even legal philosophers disagree.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just say "it's the law." The user knows the law. They want the *philosophy* behind the practice.
      *   *Nuance:* The "Romantic Author" concept is crucial here. The social norm treats the author as a Genius who births unique ideas, while the law treats the author as a Worker who arranges common materials. This explains the disconnect.
      *   *Chemistry comparison:* Patents are much harder to get than copyright. Copyright is automatic. This is a key difference.
      *   *History comparison:* Facts aren't copyrightable. Citations are about academic integrity, not property.

  7.  **Final Polish:**
      *   Ensure the tone is respectful of the user's profession.
      *   Check the constraints: Confidence level? Yes. Least sure point? Yes.
      *   Make sure the "What would change" section is vivid.

  8.  **Final Review against constraints:**
