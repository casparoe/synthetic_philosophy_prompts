answer: |-
  **Title:** Disentangling the Push: A Workshop on Higher-Level Causation via Modified Careenia

  **Project Description**

  The problem of mental causation, and of higher-level causation generally, remains stalled by the exclusion worry: if the physical substrate is causally sufficient, what work is left for the mental or macroscopic entity to do? Standard positions in the literature tend to harden into metaphysical camps, with reductionists denying the efficacy of the higher level and non-reductionists positing some form of ontological distinctness that often feels mysterious. This proposal argues that the deadlock arises because the central question—does the higher-level entity push the substrate around?—is actually three distinct questions wearing one coat. Depending on whether "push" is understood as difference-making in an interventionist sense, as the physical production or transfer of energy, or as the identification of a robust real pattern for prediction, the answer changes. The exclusion problem gains its grip only when these senses are conflated. Once separated, the residual dispute is not metaphysical but normative: it concerns which notion of causation an explanation is entitled to invoke for a specific purpose. This workshop proposes to move beyond exegetical debate by constructing a family of toy models based on Douglas Hofstadter's "careenium" to test these distinctions empirically within a controlled theoretical environment.

  The careenium serves as our heuristic anchor. Imagine a vast billiard table covered in tiny magnetic balls, or simms, that careen around and stick together into stable clumps, or simmballs. These clumps drift, collide, and reconfigure in regular ways. The system can be described exhaustively at the level of individual simms or at the level of simmballs. The standard philosophical impulse is to ask which description captures the real causation. Our project rejects the assumption that there is a single answer. Instead, we will treat the careenium as a modifiable toy system, designing specific variations—"toy careenia"—where the relationship between the micro-level and the macro-level is deliberately manipulated to pull the three senses of causation apart. The method is constructive rather than literary. We will build cases where the clump-level description supports counterfactuals or interventions that the sim-level description obscures through complexity, and conversely, cases where the sim-level story is causally rich while the clump-level description adds nothing but noise. We will also engineer scenarios where production and difference-making diverge, such as a clump that reliably predicts an outcome without transferring energy, or a micro-configuration that transfers energy without constituting a stable higher-level pattern.

  This approach offers distinct advantages over the obvious alternatives. A standard survey of the mental-causation literature would merely rehearse existing arguments without providing the traction needed to separate the concepts of causation in question. Conversely, simulating a real neural system would introduce too much noise; the opacity of biological detail would make it difficult for philosophers and cognitive scientists to agree on the ground rules of the causal analysis. The toy careenium method occupies a productive middle ground. It provides enough dynamical complexity to satisfy the cognitive scientists' demand for realistic interaction, while remaining transparent enough for philosophers to trace the logical implications of causal claims. By agreeing on the rules of the toy system in advance, the workshop participants can focus entirely on the interpretation of the causal relations that emerge, rather than arguing over the physics of the brain.

  The workshop is designed as a one-day intensive convening of philosophers and cognitive scientists, followed by the production of a short joint white paper. The morning session will be dedicated to finalizing the parameters of three to four specific toy careenia variants, ensuring they are mathematically or logically well-defined. The afternoon session will apply the three causal lenses—interventionist, productionist, and pattern-based—to these variants to see where the verdicts diverge. The tangible output will be a taxonomy of these senses of "push," accompanied by a verdict on which historical disputes in the mental causation literature dissolve under this separation and which survive as genuine normative disagreements about explanatory entitlement. This scope is honest about what can be achieved in a single day: we will not solve the mind-body problem, but we will provide a clarified conceptual map that prevents future talks from talking past one another.

  Success for this project is defined by the emergence of a wedge. We expect to find that in some toy cases, the simmball is a cause by one definition but not another. This divergence would validate the thesis that the exclusion worry is a category error resulting from conceptual conflation. However, the proposal must also account for failure. The project would fail if, despite our best efforts to construct divergent cases, the three senses of causation turn out to coincide on every toy case we can build. If the interventionist, productionist, and pattern-based verdicts always align across all variations of the careenium, then the proposed distinction is merely verbal and lacks traction on the dynamics of the system. In that event, the output would be a negative result demonstrating that the senses of causation are more tightly coupled than anticipated, which would itself be a valuable contribution by forcing a return to metaphysical rather than normative resolutions. By funding this workshop, the center would support a concrete step toward dissolving a persistent interdisciplinary stalemate, replacing entrenched metaphysical positioning with a shared toolkit for analyzing causal claims across levels of description.
