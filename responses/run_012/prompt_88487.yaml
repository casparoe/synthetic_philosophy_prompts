      *   *Claim 3 (Ultimate Criteria):* Validity depends on criteria accepted by officials (Hart) OR the successful exercise of sovereign will (A). Let's phrase it neutrally: "Validity rests on a foundation not itself validated by a higher legal rule."
      *   *Claim 4 (System Change):* A revolution or total breakdown distinguishes system change from internal change.
      *   *Claim 5 (Uncontroversial Facts):* The votes happened. The text changed. Officials acted.

  4.  **Drafting Section 2: Residual Disagreements:**
      *   Need to capture the essence without caricature.
      *   *Party A:* Year 1 was valid because the 2/3 vote manifested the constituent power, overriding the textual attempt at entrenchment.
      *   *Party B:* Year 1 was invalid *if* the Rule of Recognition incorporated the entrenchment clause. Validity is binary relative to the system in force at the time.

  5.  **Drafting Section 3: The Cruxes:**
      *   *Crux 1:* Continuity of Validity. Is "legal validity" a single predicate across the transition, or does the transition shift the meaning of validity?
      *   *Crux 2:* Self-Destruction. Can a rule authorize an act that abolishes the rule's own authority conditions?
      *   *Crux 3:* The Role of Officials. If officials accept the Year 1 change, does that *make* it valid (B) or merely *recognize* a political fact (A)?

  6.  **Drafting Section 4: Arguments/Hypotheticals:**
      *   *Hypothetical 1 (The Judicial Review):* What if the Supreme Court strikes down Year 1?
          *   A says: Court is wrong/political.
          *   B says: Court defines the Rule of Recognition.
      *   *Hypothetical 2 (The Revolution):* What if the public revolts?
          *   Both agree this is outside law.
      *   *Hypothetical 3 (The Nomic Game):* Playing by rules that change rules.
          *   B says: It works fine.
          *   A says: It's a game, not law.

  7.  **Drafting Section 5: Verbal vs. Substantive:**
