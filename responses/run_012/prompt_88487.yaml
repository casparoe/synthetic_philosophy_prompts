          *   *Party A (Constituent-Power):* Amending power cannot limit successor power. Self-entrenchment is void/declaratory. Later exercise of power replaces the rule.
          *   *Party B (Social-Fact/Hartian):* Validity is relative to a Rule of Recognition (social practice). Entrenchment is coherent if the practice accepts it. Paradox arises from treating rules as truth-apt propositions. (Analogy: Nomic).
      *   **Structure:**
          1.  Numbered list of agreed claims (Rule of Change, Repeal vs. Exercise, Ultimate Criteria, System Change, Uncontroversial Facts).
          2.  Table of residual disagreements (stated in acceptable wording).
          3.  The Cruxes (sub-questions that would move a side).
          4.  Arguments/Hypotheticals for each Crux (agreed relevance + predicted outcomes).
          5.  Judgment on Verbal vs. Substantive dispute.
          6.  **Closing Section (My View):** Critique of the document, identification of false agreements, better argument, confidence flag.

  2.  **Deconstruct the Philosophical Positions:**
      *   *Party A (Constituent Power):* Likely influenced by Schmitt, Ackerman, or a strong natural law/sovereignty view. The "People" or the "Sovereign" cannot bind their future self. The *pouvoir constituant* is always latent. If the procedure says "2/3", and they vote 2/3, that *is* the expression of sovereignty, regardless of what the text says about unanimity.
      *   *Party B (Social Fact):* Likely Hartian positivism. Law is a system of rules. The Rule of Recognition is a social fact. If officials accept a rule that says "Unanimity is required," then a 2/3 vote is *no law*. It's not about sovereignty; it's about the internal point of view of officials. The "paradox" is logical, not legal.

  3.  **Drafting Section 1: Agreed Claims:**
