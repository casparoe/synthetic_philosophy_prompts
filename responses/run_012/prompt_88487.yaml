  *(Self-Correction during drafting)*: I need to make sure Party A doesn't sound like an anarchist. They believe in law, but believe the *constituent power* is the ultimate source, not the *constituted rules*. Party B needs to ensure they don't sound like they deny sovereignty, but rather locate it in the practice.

  Let's write the document.

  *Section 1:* Focus on the distinction between *pouvoir constituant* and *pouvoir constitué* for A, and Rule of Recognition for B, but find the overlap. The overlap is that *something* outside the specific text grounds the text.
  *Section 2:* Be precise. A says Year 1 is Valid. B says Year 1 is Invalid (relative to the rule at T1).
  *Section 3:* The "Predicate of Validity" is a strong crux. The "Self-Referential Authority" is another.
  *Section 4:* Use the "Judicial Acceptance" hypothetical. It tests the Social Fact view directly.
  *Section 5:* It's substantive because it predicts different outcomes in court.

  *Closing:* I need to be critical. The "Agreement" on what constitutes a "change of legal system" is probably shaky. A thinks breaking the rule *is* the system working (constituent power). B thinks breaking the rule is a system change (revolution).

