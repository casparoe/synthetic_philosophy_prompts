answer: |-
  There is no single established term for this specific slide, so I propose we call it **The Historicist Equivocation**.

  This equivocation turns on the ambiguity of the phrase "of his time," which conflates *epistemic contextualism* (Defense 1: he lacked the information to know better) with *normative contextualism* (Defense 2: the moral concepts required to judge him did not exist). The move is fallacious not because either claim is necessarily false, but because they offer mutually exclusive kinds of immunity. Epistemic contextualism admits the act was wrong but excuses the agent (like insanity or ignorance); normative contextualism denies the act falls under the concept "wrong" at all (like saying chess moves aren't "illegal" outside a game). When the empirical claim (nobody knew) is falsified by evidence of contemporary dissent, the defender retreats to the meta-ethical claim (standards don't apply) without acknowledging that they have shifted from excusing the agent to invalidating the critic's vocabulary.

  The closest existing rhetorical label is the **Motte-and-Bailey doctrine**, where the Bailey is the controversial empirical claim ("he wasn't wrong because nobody knew") and the Motte is the defensible meta-ethical claim ("we can't judge him"). However, calling it merely a Motte-and-Bailey misses the philosophical joint you identified: the slide specifically exploits the ambiguity between *capacity* and *authority*. It is distinct from **Presentism**, which names the accuser's alleged error, not the defender's slide. It is distinct from **Moral Relativism**, which is the underlying philosophy of Defense 2, but does not name the tactical switch from Defense 1. It is also distinct from the **Genetic Fallacy**, as it concerns the applicability of standards, not the origin of the belief.

  The "grading thing" you noticed is a correlated bias I would label **Retrospective Selectivity**, where the Historicist Equivocation is deployed inconsistently based on affinity for the subject. If we like the figure, we treat their deviation from norms as evidence of superior epistemic access ("ahead of his time"); if we dislike them, we treat the same deviation as evidence of normative containment ("of his time"). The Historicist Equivocation is the mechanism that allows this selectivity to pass unchallenged.

  To test the term outside your three examples, apply it to the history of science: consider criticizing Newton for his work on alchemy.
  *   **Defense 1 (Epistemic):** "Everyone studied alchemy then; he couldn't have known it was a dead end." (Falsifiable: contemporaries like Boyle were already distinguishing chemistry from alchemy.)
  *   **The Slide:** When pressed on Boyle, the defender shifts to Defense 2.
  *   **Defense 2 (Normative):** "The concept of 'pseudoscience' didn't exist then; the distinction between chemistry and alchemy is anachronistic, so calling it 'error' is meaningless."
  *   **Prediction:** If you accept the Historicist Equivocation here, you must also accept that we cannot criticize modern figures for holding views that future paradigms will deem irrational, provided they can claim their current sub-culture lacks the vocabulary to object. If the defender refuses to apply Defense 2 to a contemporary figure they dislike (e.g., a scientist holding a fringe view today), the equivocation is exposed.
