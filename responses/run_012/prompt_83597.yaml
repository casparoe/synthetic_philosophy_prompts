prompt: |-
  I run the analysis team at a mid-sized charity — eight people, we turn out cost-effectiveness estimates and forecasts that other people then spend actual money on, so when one of our numbers is off it isn't just embarrassing, it's a few hundred grand pointed at the wrong thing. We have a convention that every estimate goes out with a point figure, a range, and one line from the analyst on how much they trust their own process, and that last bit has turned into a mess. What keeps happening — two or three times a month at this point — is that someone brings me a number and in the same breath tells me they don't trust the process that produced it: they were rushed, they'd half-decided the answer before they looked at the data, someone they rate came out somewhere quite different, or they've just read something about how people like them systematically overrate their own models. They can see the problem perfectly clearly. They just don't know what to do about it and neither do I. One of them now says she thinks the number is right and at the same time thinks she shouldn't believe it, which sounds like a contradiction until you've sat in the meeting; someone told me the word for it is epistemic akrasia and then changed the subject.

  I've been reading round higher-order evidence — what you're supposed to do when the evidence about your evidence points somewhere other than the evidence does — and I want it turned into something I can actually run in a twenty-minute conversation with an analyst, not a seminar. So: give me a decision procedure. The questions I ask in order, what counts as a sufficient answer to each, where it stops with "keep the number", where it stops with "bin it and start again", and where it hands the decision back to me because the question is what we're willing to risk rather than what the evidence says. There's one distinction I think is the crux and most of what I've read seems to walk straight past it: evidence that the process was unreliable in general versus evidence that it was unreliable in a particular direction — those seem to license quite different things, and I keep seeing them treated as one. Also handle the case where the analyst can name the bias but can't undo it; knowing you're anchoring doesn't un-anchor you, and "just correct for it" is what I keep saying and I don't think it's honest.

  Then run the procedure on three cases and show your working: (a) an analyst who says her estimate is contaminated because she saw a colleague's figure before she started; (b) an analyst who's confident and has no complaints about his own process, and whose process I happen to know is badly calibrated; (c) an analyst who's the only person in the building who understands the domain, so there's no disagreement to appeal to and the "check with a peer" step has nothing to bite on. I want at least one of those to come out in a way I wont like. Finish with a short section on what the procedure can't settle, where I'm just making a management call dressed up as epistemology, and what to do on the days when my worry about her process is itself the sort of thing I should be suspicious of. Don't give me a reading list, I'll find the literature myself if I want it — I need something I can use on Tuesday, and I'm not a philosopher, just the person who has to sign the thing off.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Manager of an analysis team at a mid-sized charity (8 people).
      *   **Problem:** Analysts frequently produce estimates they don't trust (epistemic akrasia: believing $X$ while believing they shouldn't believe $X$). Current convention (point, range, trust line) is failing.
      *   **Goal:** A practical decision procedure (20-minute conversation) to handle higher-order evidence (evidence about the reliability of the evidence).
      *   **Key Distinction:** General unreliability vs. directional unreliability (bias).
      *   **Constraint:** Handle cases where bias is identified but not correctable ("knowing you're anchoring doesn't un-anchor you").
      *   **Deliverables:**
          1.  A step-by-step decision procedure (questions, sufficient answers, stop conditions).
          2.  Application to three specific cases (a, b, c), showing working. At least one outcome must be uncomfortable/unliked.
          3.  A section on limitations (management calls vs. epistemology, meta-worry).
          4.  Tone: Practical, direct, no reading lists, usable on Tuesday.

  2.  **Deconstruct the Epistemic Problem:**

      *   *The Core Tension:* First-order evidence (the data/model says $X$) vs. Higher-order evidence (the process is flawed, so maybe not $X$).
      *   *The Distinction:*
          *   *General Unreliability (Noise):* The process is random or broken. Result: Discard/Redo.
          *   *Directional Unreliability (Bias):* The process pushes in a specific direction (e.g., optimism bias, anchoring). Result: Adjust or Discount.
      *   *The "Akrasia" Trap:* "I think the number is right, but I shouldn't trust myself thinking it." This usually means the first-order evidence is strong, but the second-order evidence undermines the *justification*.
      *   *The Manager's Role:* Risk tolerance. Epistemology tells you about truth/justification; Management tells you about cost of error.

  3.  **Drafting the Decision Procedure (The "Tuesday Tool"):**

      *   Needs to be sequential.
      *   Needs clear "Stop/Go" criteria.
      *   Needs to address the "uncorrectable bias" issue.
      *   *Step 1: Identify the Defect.* Is it noise (broken) or bias (skewed)?
      *   *Step 2: Assess Correctability.* Can we fix it *now*?
      *   *Step 3: Quantify the Discount.* If we can't fix it, can we widen the range or shift the point?
      *   *Step 4: Risk Assessment.* If the number is wrong, what happens? (This is where the manager steps in).

      *Refining the Steps:*
      1.  **Categorize the Doubt:** Is the process *broken* (noise) or *bent* (bias)?
      2.  **Test for Independence:** Did the error source interact with the data input?
      3.  **Attempt Correction:** Can we re-run or adjust?
      4.  **Conservative Adjustment:** If uncorrectable, apply a "skeptic's discount."
      5.  **Risk Handoff:** If the discount makes the decision ambiguous, manager decides based on risk tolerance.

  4.  **Developing the Three Cases:**

      *   *Case (a) Contamination (Anchoring):* Analyst saw a colleague's figure.
          *   *Analysis:* Directional bias (toward colleague's number). Hard to undo.
          *   *Outcome:* Widen range, shift point slightly away, or require blind re-estimate if possible. Let's make it uncomfortable: *Reject the number.* Why? Because anchoring is insidious and uncorrectable by willpower.
      *   *Case (b) Overconfident/Badly Calibrated:* Analyst trusts process, Manager knows process is bad.
          *   *Analysis:* General unreliability (calibration issue).
          *   *Outcome:* Discount the confidence interval. The point might stand, but the range is lies. Uncomfortable outcome: *Accept the point but ignore the analyst's confidence.*
      *   *Case (c) Lone Expert:* No peer review, domain specific.
          *   *Analysis:* No higher-order evidence from peers. Reliance on track record.
          *   *Outcome:* Accept with heavy monitoring. Uncomfortable outcome: *We have to use it, but we treat it as a hypothesis, not a fact.* Or, *Bin it because single-point-of-failure risk is too high regardless of truth.* Let's go with the latter for the "won't like" constraint. If the charity can't afford the risk of one person being wrong, the number is unusable regardless of epistemic status.

  5.  **Addressing the "Management Call" Section:**

      *   Epistemology ends where risk begins.
      *   The manager's own anxiety (meta-worry) needs a check: Is this intuition or panic?
      *   Distinguish between "Is this true?" and "Can we bet the rent on this?"

  6.  **Refining the Tone:**

      *   No jargon unless defined.
      *   Direct, imperative mood.
      *   Acknowledge the frustration.
      *   Focus on *action*, not *truth*.

  7.  **Self-Correction/Review during Drafting:**

      *   *Critique:* Is the procedure too philosophical?
      *   *Fix:* Make the questions yes/no or specific. Add a "Risk Threshold" step.
      *   *Critique:* Did I handle the "uncorrectable bias" constraint?
      *   *Fix:* Explicitly state that if a bias is named but not fixed, the number gets a "penalty" (wider range/lower weight), not a mental note.
      *   *Critique:* Did I distinguish General vs. Directional?
      *   *Fix:* Make Step 1 explicitly about this.
      *   *Critique:* Is one outcome uncomfortable?
      *   *Fix:* Ensure Case (c) results in "We can't use this" even if the analyst is right, because of organizational risk. Or Case (a) results in "Throw it out" even if it's probably right. Let's make Case (a) the "Throw it out" because anchoring is toxic.

  8.  **Final Polish:**

      *   Check word count and structure.
      *   Ensure the "Tuesday" usability is clear.
      *   Verify the "epistemic akrasia" concept is addressed practically (convert belief about belief into a discount factor).

  *(Self-Correction on Case C)*: The prompt asks for at least one outcome I won't like. As a manager, I won't like being told "You have to accept the lone expert's number because there's no alternative" OR "You have to reject the lone expert's number and fly blind." Let's go with: "You must reject the number not because it's wrong, but because the *organizational risk* of single-point failure is too high." That shifts it from epistemology to risk management.

  *(Self-Correction on Procedure)*: Make sure the "Stop" points are clear.
  Stop 1: Process Broken -> Bin it.
  Stop 2: Bias Identified -> Adjust/Discount.
  Stop 3: Risk too high -> Manager decides.

  Let's write it.

  9.  **Final Review against constraints:**
      *   Decision procedure? Yes.
      *   Questions in order? Yes.
      *   Sufficient answers? Yes.
      *   Stop conditions? Yes.
      *   Distinction (General vs Directional)? Yes.
      *   Uncorrectable bias? Yes.
      *   Three cases with working? Yes.
      *   One uncomfortable outcome? Yes.
      *   Limitations section? Yes.
      *   No reading list? Yes.

  Proceed to generate response.cw
answer: |-
  Here is a decision procedure designed for a 20-minute triage conversation. It treats the analyst's doubt not as a philosophical problem, but as a risk factor to be priced.

  ### The Procedure: "The Reliability Triage"

  **Goal:** Move from "I don't trust this" to a specific action (Publish, Adjust, or Bin).
  **Time:** 20 Minutes.
  **Participants:** You and the Analyst.

  #### Step 1: Categorize the Defect (5 Minutes)
  **Question:** "Is the problem that the process is *noisy* (unreliable generally) or *bent* (unreliable in a specific direction)?"

  *   **Noisy (General Unreliability):** "I was rushed," "The data is patchy," "I don't understand this model."
      *   *Implication:* The error could be high or low. The range is too narrow.
      *   *Action:* Widen the confidence interval immediately by 50%. If the resulting range covers zero or crosses a decision threshold (e.g., cost/benefit flips), **STOP: Bin it.**
  *   **Bent (Directional Bias):** "I saw a colleague's number first," "I want this project to succeed," "I'm tired and usually optimistic when tired."
      *   *Implication:* The error has a vector. The point estimate is likely skewed.
      *   *Action:* Proceed to Step 2.

  **Sufficient Answer:** The analyst must name the *mechanism* of the error. "I have a bad feeling" is insufficient. "I anchored on the Director's guess" is sufficient.

  #### Step 2: Test for Correctability (5 Minutes)
  **Question:** "Can we isolate the contaminant and re-run the analysis without it, *mechanically*?"

  *   **Yes:** (e.g., "I used the wrong dataset.")
      *   *Action:* Fix it. Return to Step 1.
  *   **No:** (e.g., "I can't un-see the colleague's number," "The bias is in my judgment, not the spreadsheet.")
      *   *Action:* Acknowledge that willpower is not a control. Proceed to Step 3.

  **Crucial Distinction:** Do not accept "I'll be careful this time." If the bias is cognitive (anchoring, confirmation), the process is permanently contaminated for this specific estimate.

  #### Step 3: Apply the Skeptic's Discount (5 Minutes)
  **Question:** "If we assume the bias is real, what is the minimum adjustment required to make this number safe to use?"

  *   **For Directional Bias:** Shift the point estimate away from the bias vector by a conservative margin (e.g., if optimism bias is admitted, reduce the benefit estimate by 20%).
  *   **For General Unreliability:** Widen the range until it encompasses plausible worst-case scenarios derived from *outside* the model (e.g., historical error rates of similar projects).

  **Stop Condition:** If applying the discount makes the project clearly non-viable (e.g., cost-effectiveness drops below funding threshold), **STOP: Bin it.** Do not publish a number you are actively discounting.

  #### Step 4: The Risk Handoff (5 Minutes)
  **Question:** "Given the adjusted number and the known defect, is the cost of being wrong higher than the cost of delaying the decision?"

  *   **If Cost of Error > Cost of Delay:** **STOP: Bin it.** Send it back for a blind re-estimate or external review.
  *   **If Cost of Delay > Cost of Error:** **Manager Decision.** You sign off, but you explicitly log the "Debt." (e.g., "Approved at $X, noting known anchoring risk. Review in 6 months.")

  ***

  ### Running the Procedure: Three Cases

  Here is how this plays out with your team. I have shown the working so you can see where the levers are.

  #### Case (a): The Contaminated Estimate
  **Scenario:** Analyst says her cost-benefit ratio is 1:5. She admits she saw a senior colleague suggest "it should be around 1:5" before she started. She says she tried to ignore it but can't shake the feeling she tuned the model to match.
  **Type:** Directional Bias (Anchoring).

  1.  **Categorize:** Bent. The vector is toward the colleague's number.
  2.  **Correctability:** No. She cannot cognitively "un-anchor." Re-running the same model will likely yield the same result because her parameter choices are now subconsciously influenced.
  3.  **Discount:** To correct for anchoring, we would need to shift the number away from 1:5. But we don't know the true value. Any adjustment we make is just a guess layered on a guess.
  4.  **Risk Handoff:** This is a mid-sized charity. A few hundred grand is at stake. Anchoring is one of the most robust, uncorrectable biases in forecasting.

  **Decision:** **Bin it.**
  **Working:** Even if the number *is* right (epistemically), the *justification* is compromised beyond repair. You cannot price the risk of anchoring because you don't know the magnitude of the pull.
  **The Uncomfortable Bit:** You are throwing away a number that is likely correct because the *process* is toxic. You must tell the analyst: "I believe you that the number might be accurate, but I cannot use it. You need to do a blind estimate without seeing the colleague's figure, or someone else needs to run the raw data."

  #### Case (b): The Overconfident Calibrator
  **Scenario:** Analyst produces a forecast with a tight range (±5%). He is confident, process feels solid. You know from past performance that his ranges are lies; his actual error rate is ±40%. He has no specific complaints about this run.
  **Type:** General Unreliability (Calibration Issue).

  1.  **Categorize:** Noisy. The process works, but the analyst's measurement of its precision is wrong.
  2.  **Correctability:** No. He doesn't see the error. You cannot force him to "feel" less confident.
  3.  **Discount:** You apply an external calibration factor. You take his point estimate (which may be unbiased) but you mechanically widen his range to match his historical error rate (±40%).
  4.  **Risk Handoff:** Does the widened range change the decision?
      *   If the project is viable even at -40% performance: **Keep the number.**
      *   If the project fails at -40% performance: **Bin it.**

  **Decision:** **Keep the Point, Ignore the Range.**
  **Working:** You accept his first-order evidence (the model logic) but reject his higher-order evidence (his confidence). You overwrite the "trust line" yourself.
  **Note:** This creates tension. You are telling him, "Your work is usable, but your judgment is not." Document this as a training issue, not a project failure.

  #### Case (c): The Lone Expert
  **Scenario:** Senior analyst. Only person who understands the specific domain (e.g., a niche medical intervention). No peers to check her work. She says, "I trust my process, but I know I'm the only one looking, and that scares me." She admits she might be missing a blind spot simply because no one is there to find it.
  **Type:** General Unreliability (Single Point of Failure).

  1.  **Categorize:** Noisy. The risk isn't bias, it's unknown unknowns.
  2.  **Correctability:** No. There is no peer to appeal to.
  3.  **Discount:** You cannot adjust the number mathematically because you don't know the direction of the potential error.
  4.  **Risk Handoff:** This is the crux. The epistemology is inconclusive (she might be right), but the organizational risk is maximal.

  **Decision:** **Bin it (or "Hold").**
  **Working:** This is the outcome you won't like. Epistemically, she might be the most reliable person in the room. But organizationally, you cannot bet significant funds on a "Black Box" estimate where the error distribution is unknowable.
  **The Uncomfortable Bit:** You are rejecting a potentially perfect number because your *organization* is too fragile to handle the risk of her being wrong. You must say: "We cannot spend this money until we have a second set of eyes, even if we have to hire a consultant for a week to break your model." If you can't afford the consultant, you can't afford the project.

  ***

  ### What This Procedure Cannot Settle

  There are three moments where this tool stops working and you are left making a management call dressed up as epistemology.

  **1. The "Meta-Worry" Loop**
  Sometimes your own suspicion of the process is the only evidence you have. You feel something is off, but the analyst passes the Triage.
  *   **The Trap:** If you bin every number you have a "bad feeling" about, you become the bottleneck and paralyze the team.
  *   **The Fix:** Treat your intuition as a *risk premium*, not a veto. If you can't articulate the defect in Step 1, you are not allowed to Bin it. You are only allowed to widen the range in Step 3. Force your worry into a number (e.g., "Add 10% contingency for manager's instinct"). If you can't quantify it, you don't get to use it to stop the work.

  **2. The "True but Unjustified" Dilemma**
  Case (a) shows this: The number might be right, but the path to it was dirty.
  *   **The Trap:** Charity money demands both truth and accountability. If you publish a number you know was anchored, and it turns out right, you got lucky. If you got lucky once, stakeholders will assume you can get lucky again.
  *   **The Fix:** You must prioritize *process integrity* over *outcome accuracy* for public-facing numbers. It is better to be accurately wrong (via a rigorous process) than accidentally right (via a broken one). Bin the lucky guesses.

  **3. The Resource Constraint**
  Case (c) shows this: The epistemically correct move (get a peer review) costs money/time you don't have.
  *   **The Trap:** Epistemology assumes you have the luxury of seeking truth. Management assumes you have the luxury of acting.
  *   **The Fix:** Admit the trade-off. If you sign off on the Lone Expert because you can't afford a consultant, log it as **"Risk Accepted."** Do not call it "Verified." In your internal logs, mark the estimate as "Provisional." This protects the team's culture of truth-telling even when budget forces you to act on uncertainty.

  **Summary for Tuesday:**
  1.  **Noise?** Widen the range.
  2.  **Bias?** Shift the point or Bin it.
  3.  **Uncorrectable?** Apply a discount or Bin it.
  4.  **Risk too high?** Manager decides, but logs the debt.

  If the analyst says "I don't trust this," and you can't fix the reason why in 20 minutes, do not publish the number. The cost of a re-do is always lower than the cost of a retraction.
