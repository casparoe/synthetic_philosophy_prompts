  **Leaf Positions**

  **Leaf A: Eliminativism (Credence-Only View)**
  *   **Sequence:** 1(Belief) → 2(No).
  *   **Lottery:** The agent has high credence in each loss proposition but no outright belief; no paradox arises.
  *   **Preface:** The agent has high credence in each claim and high credence in the preface; no contradiction in credences.
  *   **Separating Case:** In a 5-ticket lottery, does the agent *believe* ticket 1 will lose? (No, only high credence).
  *   **Awkward Commitment:** It denies the existence of a familiar mental state we use to navigate daily life.

  **Leaf B1: Disunity View (Statistical Source)**
  *   **Sequence:** 1(Belief) → 2(Yes) → 3(No) → 12(Statistical).
  *   **Lottery:** Acceptance is barred because the support is purely statistical.
  *   **Preface:** Acceptance is permitted because the support involves testimonial or evidential diversity.
  *   **Separating Case:** Does a 5-ticket lottery differ in kind from a 5-sentence note based on observation? (Yes, source differs).
  *   **Awkward Commitment:** It implies two structurally identical probabilistic situations are treated differently based on genealogy.

  **Leaf B2: Disunity View (Testimonial Source)**
  *   **Sequence:** 1(Belief) → 2(Yes) → 3(No) → 12(Testimonial).
  *   **Lottery:** Acceptance is permitted because statistical evidence is sufficient for belief.
  *   **Preface:** Acceptance is barred or modified because testimonial authority imposes a consistency constraint.
  *   **Separating Case:** Does a 5-sentence note based on testimony demand more consistency than a 5-ticket lottery? (Yes).
  *   **Awkward Commitment:** It suggests testimonial claims are held to a stricter logical standard than statistical ones.

  **Leaf C: Inconsistency View (Dialetheism of Acceptance)**
  *   **Sequence:** 1(Belief) → 2(Yes) → 3(Yes) → 4(No).
  *   **Lottery:** The agent accepts each ticket will lose and accepts one will win; the set is inconsistent but rational.
  *   **Preface:** The agent accepts each claim and accepts one is false; the inconsistency is genuine but permissible.
  *   **Separating Case:** In a 5-ticket lottery, is the conjunction of all losses irrational? (No, inconsistency is allowed).
  *   **Awkward Commitment:** It requires abandoning the classical norm that rationality prohibits contradictory beliefs.

  **Leaf D: Absolutism (Certainty View)**
  *   **Sequence:** 1(Belief) → 2(Yes) → 3(Yes) → 4(Yes) → 5(Yes).
  *   **Lottery:** The agent accepts none of the individual loss propositions, only that one ticket will win.
  *   **Preface:** The agent accepts only those claims of which they are certain; the preface concession is accepted.
  *   **Separating Case:** In a 5-ticket lottery, does the agent believe ticket 1 will lose? (No, not certain).
  *   **Awkward Commitment:** It leads to widespread skepticism about ordinary empirical claims.

  **Leaf E: Fixed Threshold + Closure (Skepticism)**
  *   **Sequence:** 1(Belief) → 2(Yes) → 3(Yes) → 4(Yes) → 5(No) → 6(Threshold) → 7(Fixed) → 8(Yes).
  *   **Lottery:** Since the conjunction is unacceptable, and closure holds, the individual propositions are not accepted.
  *   **Preface:** Since the conjunction (all claims true) contradicts the preface, individual claims are not accepted.
  *   **Separating Case:** In a 5-ticket lottery, is the threshold met for individual losses? (Yes, but closure blocks acceptance).
  *   **Awkward Commitment:** It forces the agent to withhold belief from highly probable claims to preserve consistency.

  **Leaf F: Fixed Threshold + No Closure (Non-Closure View)**
  *   **Sequence:** 1(Belief) → 2(Yes) → 3(Yes) → 4(Yes) → 5(No) → 6(Threshold) → 7(Fixed) → 8(No).
  *   **Lottery:** The agent accepts each ticket will lose but does not accept the conjunction that all will lose.
  *   **Preface:** The agent accepts each claim but does not accept the conjunction that all are true.
  *   **Separating Case:** In a 5-ticket lottery, does the agent accept the conjunction of all losses? (No).
  *   **Awkward Commitment:** It denies that rational acceptance agglomerates, violating a standard logical intuition.

  **Leaf G: Context Threshold + No Closure (Contextualism)**
  *   **Sequence:** 1(Belief) → 2(Yes) → 3(Yes) → 4(Yes) → 5(No) → 6(Threshold) → 7(Context) → 8(No).
  *   **Lottery:** In low stakes, losses are accepted; in high stakes (or when conjunction is salient), they are not.
  *   **Preface:** Claims are accepted in the context of reading, but the preface shifts the context to highlight error possibilities.
  *   **Separating Case:** In a 5-ticket lottery, does raising the stakes change whether ticket 1 is believed to lose? (Yes).
  *   **Awkward Commitment:** It implies belief attributions change truth value without a change in evidence.

  **Leaf H: Role-Based View (Premise-Ready)**
  *   **Sequence:** 1(Belief) → 2(Yes) → 3(Yes) → 4(Yes) → 5(No) → 6(Role) → 9(Premise).
  *   **Lottery:** Loss propositions are not accepted because they are not suitable as premises in further reasoning.
  *   **Preface:** Claims are accepted as premises unless the preface context disables their premise-status.
  *   **Separating Case:** In a 5-ticket lottery, is a loss proposition usable as a premise in a modus ponens argument? (No).
  *   **Awkward Commitment:** It divorces acceptance from probability, making high probability insufficient for reasoning.

  **Leaf I: Assertion View (Reasonable Assertibility)**
  *   **Sequence:** 1(Assertion) → 10(Reasonable).
  *   **Lottery:** It is reasonable to assert each ticket will lose, though not all jointly.
  *   **Preface:** It is reasonable to assert each claim, and reasonable to assert the preface concession.
  *   **Separating Case:** In a 5-sentence note, is it reasonable to assert each sentence? (Yes).
  *   **Awkward Commitment:** It allows asserting what one knows to be collectively false.

  **Leaf J: Assertion View (Knowledge Norm)**
  *   **Sequence:** 1(Assertion) → 10(Knowledge) → 11(Atomistic).
  *   **Lottery:** One cannot assert individual losses because one does not know them.
  *   **Preface:** One cannot assert the claims if the preface implies one does not know them all.
  *   **Separating Case:** In a 5-ticket lottery, does the agent know ticket 1 will lose? (No).
  *   **Awkward Commitment:** It implies we violate assertion norms constantly in ordinary conversation.

