  2.  **Is there a categorical attitude of "acceptance" distinct from graded credence?**
      *   *Branching Justification:* This determines whether the paradox arises from a conflict between two attitudes or merely from misapplying a single graded attitude.
      *   **No (Credence Only):** **Leaf A**.
      *   **Yes (Categorical Acceptance):** Go to 3.

  3.  **Are the Lottery and Preface cases structurally identical regarding this attitude?**
      *   *Branching Justification:* This separates views that treat the paradoxes as a unified problem from those that find a disanalogy in the source or nature of the claims.
      *   **No (Disunity):** **Leaf B**.
      *   **Yes (Unity):** Go to 4.

  4.  **Must any rational set of accepted propositions be logically consistent?**
      *   *Branching Justification:* This isolates the position that rationality permits inconsistency from those that enforce consistency as a constraint on acceptance.
      *   **No (Inconsistency Permitted):** **Leaf C**.
      *   **Yes (Consistency Required):** Go to 5.

  5.  **Does rational acceptance require credence 1 (certainty)?**
      *   *Branching Justification:* This distinguishes absolutist views that deny acceptance in probabilistic cases from fallibilist views that allow it.
      *   **Yes (Certainty Required):** **Leaf D**.
      *   **No (Probability < 1 Suffices):** Go to 6.

  6.  **Is the threshold for acceptance determined solely by probability or by a functional role (e.g., premise-usability)?**
      *   *Branching Justification:* This separates quantitative threshold views from qualitative role-based views of what acceptance consists in.
      *   **Functional Role:** Go to 9.
      *   **Probability Threshold:** Go to 7.

  7.  **Is the probability threshold fixed invariantly or sensitive to context/stakes?**
      *   *Branching Justification:* This distinguishes invariantist Lockean views from contextualist views that allow the bar for acceptance to shift.
      *   **Context-Sensitive:** Go to 8.
      *   **Fixed:** Go to 8.

  8.  **Is acceptance closed under conjunction (if A and B are accepted, is A&B accepted)?**
