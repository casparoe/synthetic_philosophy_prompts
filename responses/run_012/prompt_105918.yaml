answer: |-
  (a) The Essay Question

  **FINAL EXAMINATION: NORMATIVE ETHICS**
  **Time Allowed:** 60 Minutes
  **Instructions:** Answer the following question in one essay. Do not spend more than one short paragraph restating the scenario. Focus on analysis, not exposition.

  **Question:**
  Robert Nozick's "Utility Monster" objects to utilitarianism by positing a being who gains significantly more utility from resources than humans do. Consider a strengthened variant: the **Convex Monster**. Like humans, the Monster begins with a baseline capacity for pleasure. However, while humans exhibit diminishing marginal utility (each additional unit of resource yields less satisfaction than the last), the Monster exhibits *strictly increasing* marginal utility (each additional unit yields *more* satisfaction than the last), with no threshold of satiation.

  In a closed system with fixed resources, classical utilitarianism dictates that all resources must eventually be funneled to the Monster, leaving humans to starve, as this maximizes the aggregate sum.

  In a rigorous essay, address the following:
  1.  Identify precisely which structural commitment of utilitarianism this objection exploits.
  2.  Determine whether the objection functions as a genuine *reductio ad absurdum* or merely an intuition pump, specifically by analyzing whether it imports a normative premise (e.g., equality, rights) to which the utilitarian is not committed.
  3.  Explain why the *convexity* of the Monster's utility function poses a distinct challenge compared to Nozick's original "high-intensity" Monster.

  Conclude by evaluating whether this variant forces a revision of utilitarian theory or merely clarifies its theoretical costs.

  ***

  (b) Model Answer

  The Convex Monster scenario is not merely a claim about psychological capacity but a mathematical demonstration of resource efficiency under welfarism. While Nozick's original monster relies on higher *intensity* per unit, the Convex Monster relies on *increasing marginal utility*. This distinction is vital: the original monster might theoretically satiate, whereas the Convex Monster makes resource diversion structurally necessary and permanent. To evaluate this, we must isolate the specific utilitarian commitment under attack.

  The objection exploits the commitment to **unrestricted aggregation and maximization**. Utilitarianism asserts that the right action is that which maximizes the sum total of utility, treating individuals as vessels for value rather than sources of constraint. The Convex Monster demonstrates that if utility is the sole currency of moral value, and if one vessel converts that currency more efficiently over time, distributive concerns are not just secondary; they are irrational. Hoarding resources away from the Convex Monster is morally equivalent to burning money. Thus, the specific commitment exploited is the subordination of distribution to maximization.

  However, identifying this commitment does not automatically validate the objection as a *reductio ad absurdum*. A *reductio* demonstrates that a theory entails a logical contradiction or a conclusion that violates the theory's own internal standards. An intuition pump, conversely, generates a conclusion that violates *external* moral commitments held by the critic. The Convex Monster argument succeeds as a *reductio* only if one assumes a prior premise of moral equality or resource entitlement that is independent of utility capacity. If one assumes that humans have a right to a share of resources *regardless* of their utility conversion rate, the utilitarian conclusion is absurd. But the utilitarian explicitly rejects such deontological constraints. Therefore, the objection imports a non-utilitarian premise—specifically, a desert-based or rights-based egalitarianism—to generate the feeling of absurdity. Without importing this external premise, the conclusion (feed the Monster) is internally consistent, however repugnant.

  The convexity of the utility function sharpens this conflict. In the standard Utility Monster case, a utilitarian might argue for a cap on the Monster's consumption if diminishing returns eventually set in, allowing for a equilibrium where humans receive subsistence. The Convex Monster eliminates this possibility. Because marginal utility increases, the efficiency gap widens with every transfer. This removes any hope of a compromise solution within the utilitarian framework. It forces the theory to choose between its maximization principle and the survival of moral agents who cannot "compete" in utility production. This highlights that utilitarianism is not merely impartial; it is actively anti-egalitarian when efficiency diverges.

  Consequently, the Convex Monster does not refute utilitarianism logically, but it clarifies its theoretical cost. It reveals that utilitarianism cannot accommodate the intuition that persons have inviolable status independent of their capacity to generate good. If a student argues this destroys the theory, they must argue that moral equality is a non-negotiable axiom that trumps aggregation. If they argue it merely clarifies the theory, they accept that utilitarianism is a theory of efficiency, not fairness. The Convex Monster shows that one cannot have both. The objection is less a logical demolition and more a forced choice: accept the counter-intuitive implication or reject the maximization principle. Given that the theory is designed to maximize the good, the "absurdity" is a feature, not a bug, for the consistent utilitarian. The objection ultimately fails as a *reductio* because it asks the utilitarian to be something other than a utilitarian.

  ***

  (c) Marking Scheme

  **Total Marks:** 20
  **Structure:** 5 "Must-Hit" Moves @ 4 marks each.

  | Move | Requirement | Marks | Characteristic Error (Loss of Marks) |
  | :--- | :--- | :--- | :--- |
  | **1. Structural Commitment** | Identifies **Aggregation/Maximization** (not just "happiness") as the specific mechanism forcing the resource transfer. | /4 | Confuses the *goal* (happiness) with the *decision procedure* (aggregation), or claims the commitment is "hedonism." |
  | **2. Imported Premise** | Explicitly notes the objection relies on an external premise (e.g., **equality/rights**) that utilitarianism rejects. | /4 | Asserts the conclusion is objectively absurd without acknowledging it relies on non-utilitarian values. |
  | **3. Reductio vs. Pump** | Distinguishes between internal inconsistency (*reductio*) and external counter-intuitiveness (**intuition pump**). | /4 | Treats "counter-intuitive" and "logical contradiction" as synonymous; fails to define the distinction. |
  | **4. Convexity Specifics** | Explains why **increasing marginal utility** prevents equilibrium/compromise, unlike the standard high-intensity monster. | /4 | Treats the Convex Monster as identical to Nozick's original; ignores the mathematical implication of convexity. |
  | **5. Theoretical Verdict** | Concludes whether the theory must be **revised** or if the cost must be **accepted**, based on the prior analysis. | /4 | Hedges indefinitely without a conclusion, or concludes the theory is "false" without referencing the maximization commitment. |

  **General Penalty:**
  *   **Restatement Penalty:** If the first paragraph exceeds 3 sentences or 60 words, deduct 2 marks from the total score.
  *   **Word Count:** Model answer is ~650 words. Students should aim for 600-800. Significant deviation (under 400/over 1000) may indicate poor time management, but mark based on content quality.
