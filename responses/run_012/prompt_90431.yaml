answer: |-
  # Specification for a Theory of Updating on Conditional Information

  ## I. The Desiderata (Test Cases and Constraints)

  An adequate theory of belief revision must function as a mapping from a prior credence function $P_{old}$ and an input constraint $C$ to a posterior $P_{new}$. When $C$ specifies a conditional probability (e.g., $P_{new}(B|A) = x$) rather than a categorical proposition, the following constraints define the success conditions for the mapping.

  ### 1. The Identity Constraint (Inertia)
  *   **Case:** The agent receives information specifying $P_{new}(B|A) = x$, but her prior already satisfies $P_{old}(B|A) = x$.
  *   **Requirement:** $P_{new} = P_{old}$.
  *   **Rationale:** Rational agents do not revise without cause. If the constraint is already satisfied, the information content is null; updating should induce no change in any credence, unconditional or conditional.

  ### 2. The Certainty Limit (Reduction to Conditionalization)
  *   **Case:** The agent learns a conditional constraint where the probability is 1 (e.g., $P_{new}(B|A) = 1$) and subsequently learns the antecedent $A$ is true (or the constraint is effectively equivalent to learning $A \cap B$ given $A$).
  *   **Requirement:** The rule must collapse into Standard Conditionalization on the relevant proposition.
  *   **Rationale:** Conditional information is a generalization of propositional information. In the limit where uncertainty vanishes, the generalized rule must reproduce the standard Bayesian norm to maintain diachronic coherence with established theory.

  ### 3. The Partition Constraint (Reduction to Jeffrey Conditionalization)
  *   **Case:** The input constraint specifies new probabilities for a complete partition $\{E_i\}$ (e.g., $P_{new}(E_i) = x_i$) rather than a conditional relation.
  *   **Requirement:** The rule must yield the same posterior as Jeffrey Conditionalization (Probability Kinematics).
  *   **Rationale:** A theory of updating on constraints must subsume the theory of updating on uncertain evidence. If the conditional structure is trivial (the antecedent is the whole space), the rule must recover the standard solution for partition updates.

  ### 4. The Conflict Tolerance Constraint
  *   **Case:** The input constraint $P_{new}(B|A) = x$ contradicts the prior conditional $P_{old}(B|A) = y$ (where $x \neq y$), but does not logically contradict the prior probability assignments to the atoms (i.e., no cell is forced to be negative).
  *   **Requirement:** The theory must return a defined, coherent posterior without assigning zero probability to any atom unless logically forced by the constraint.
  *   **Rationale:** Standard conditioning on the material conditional $(A \supset B)$ often forces $P(A \cap \neg B)$ to zero, distorting the odds of other cells unnecessarily. A conditional update rule must adjust the ratio within the antecedent without collapsing the antecedent itself or unrelated cells, unless required.

  ### 5. The Judy Benjamin Constraint (Modularity vs. Information)
  *   **Case:** The agent is in a territory partitioned into Blue ($B$) and Red ($R$). Red is subdivided into $R_1$ and $R_2$. The agent learns only $P_{new}(R_1|R) = x$ (where $x \neq P_{old}(R_1|R)$). The message is silent on $P(R)$ vs $P(B)$.
  *   **Requirement:** The theory must provide a determinate verdict on whether $P_{new}(R)$ shifts relative to $P_{old}(R)$.
  *   **Rationale:** This is the stress test.
      *   *Modularity Intuition:* Since the message is silent on the Blue/Red division, $P(R)$ and $P(B)$ should remain fixed. The update should be local to the Red sub-partition.
      *   *Minimum Information Intuition:* The posterior should be the "closest" distribution to the prior that satisfies the constraint. This often requires shifting mass between Blue and Red to minimize global distance (KL divergence).
      *   *Specification:* The theory must explicitly state which principle governs here. It cannot remain agnostic.

  ## II. Required Distinctions

  An adequate specification must respect the following conceptual boundaries. Failure to distinguish these leads to triviality or incoherence.

  ### 1. Learning a Proposition vs. Learning a Conditional Credence
  *   **Reason:** Learning $A$ eliminates $\neg A$ worlds. Learning $P(B|A)=x$ retains $\neg A$ worlds and merely adjusts the ratio of $B$ to $\neg B$ within $A$. Conflating the two treats conditional information as stronger than it is.

  ### 2. Probability of a Conditional vs. Conditional Probability
  *   **Reason:** Lewis's triviality results demonstrate that $P(A \to B)$ cannot generally equal $P(B|A)$ if the conditional is a proposition with truth conditions. A theory that updates by conditioning on a "conditional proposition" risks violating these results unless it adopts a non-propositional semantics for conditionals.

  ### 3. Constraint on a Partition vs. Constraint on a Sub-Partition
  *   **Reason:** Updating on $P(A)=x$ affects all conditionals involving $A$. Updating on $P(B|A)=x$ affects only the odds within $A$. A theory must isolate the scope of the constraint to prevent "bleed" into unrelated regions of the possibility space (the Modularity issue).

  ### 4. Synchronic vs. Diachronic Requirements
  *   **Reason:** A synchronic norm dictates coherence at a time (e.g., axioms of probability). A diachronic norm dictates how to move between times. A theory of updating is diachronic; it cannot be evaluated solely on whether the posterior is coherent, but on whether the *transition* preserves rational continuity.

  ### 5. The Metric of Minimal Change
  *   **Reason:** If the theory invokes "minimal change," it must specify the metric. Is it Euclidean distance? Kullback-Leibler (KL) divergence?
  *   **Requirement:** The theory must justify why *information* (logarithmic score) is minimized rather than *geometric distance*. (Standard justification: KL divergence preserves independence and satisfies the Partition Constraint, whereas Euclidean distance does not).

  ## III. Assessment of Requirements

  ### Genuine vs. Parochial
  *   **Genuine:** Identity, Certainty Limit, Partition Constraint, Conflict Tolerance. These are required for any rule claiming to be a generalization of Bayesian updating.
  *   **Parochial:** The Modularity Intuition in Judy Benjamin. While intuitively strong, it is not a logical necessity. The Minimum Information principle is equally defensible on grounds of not assuming information one does not have. The tension here is not between "rule" and "no rule," but between two competing norms of rationality (Locality vs. Global Coherence).

  ### Incompatible Subset (The Impossibility Result)
  *   **Flag:** **Modularity + Minimum Information (KL) + Judy Benjamin Case.**
  *   **Explanation:** In the Judy Benjamin case, satisfying the conditional constraint $P(R_1|R)=x$ via KL-minimization *mathematically necessitates* a shift in the marginal probability $P(R)$. To hold $P(R)$ fixed (Modularity) while changing the internal odds of $R$ is *not* the minimum information change relative to the prior. You cannot have both. A theory must sacrifice either the Modularity intuition or the Global Min-Info principle.

  ---

  ## IV. Scoring the Candidate Families

  Here is a brief evaluation of the four main approaches against the specification above, including the three often-skipped operational issues.

  ### 1. Relative Entropy (Minimum Information / Van Fraassen)
  *   **Verdict:** Satisfies Certainty, Partition, and Conflict constraints. **Fails Modularity** in Judy Benjamin (shifts credence from Blue to Red).
  *   **Metric:** Minimizes KL Divergence.
  *   **Order Invariance:** **Yes.** Sequential updates on compatible constraints yield the same result regardless of order.
  *   **Joint Unsatisfiability:** **Robust.** If constraints force a cell to zero, the limit of the entropy function handles it gracefully (probability goes to 0, not undefined).
  *   **Unreliable Sources:** **Problematic.** Standard Min-Info treats constraints as hard ($P_{new}(B|A)$ *is* $x$). It requires modification (e.g., constraints on expected values) to handle soft/unreliable information.
  *   **Exclusionary Factor:** The violation of the Modularity intuition in Judy Benjamin is the primary objection.

  ### 2. Propositional Conditioning (The Material Conditional Approach)
  *   **Verdict:** **Fails Conflict Tolerance.** Conditioning on $A \supset B$ to achieve $P(B|A)=1$ forces $P(A \cap \neg B)=0$. It cannot handle $P(B|A)=x < 1$ without artificial construction.
  *   **Distinction:** **Fails** Probability of Conditional vs. Conditional Probability (runs afoul of Lewis's triviality).
  *   **Order Invariance:** **Yes** (standard conditioning is order invariant).
  *   **Joint Unsatisfiability:** **Fragile.** If constraints imply a contradiction, the posterior is undefined (division by zero).
  *   **Unreliable Sources:** **No.** Assumes hard evidence.
  *   **Exclusionary Factor:** Inability to represent partial conditional information ($x < 1$) without distorting the space.

  ### 3. Direct Jeffrey-Style (Generalized Kinematics)
  *   **Verdict:** Satisfies Partition Constraint by definition. **Struggles with Conditional Constraints.** There is no unique way to map a conditional constraint $P(B|A)=x$ onto the partition weights required by Jeffrey's rule without additional assumptions (effectively reintroducing Min-Info).
  *   **Order Invariance:** **No.** Jeffrey conditionalization is notoriously order-dependent when constraints overlap.
  *   **Joint Unsatisfiability:** **Variable.** Depends on how the partition is constructed.
  *   **Unreliable Sources:** **Yes.** This is its native domain (uncertain evidence).
  *   **Exclusionary Factor:** Order dependence and the lack of a unique mapping for conditional inputs.

  ### 4. Deflationary View (No General Rule)
  *   **Verdict:** **Satisfies None.** It posits that $P_{new}(B|A)=x$ is a brute state change.
  *   **Distinction:** Respects all distinctions by refusing to bridge them algorithmically.
  *   **Order Invariance:** **N/A.** No rule to be invariant.
  *   **Joint Unsatisfiability:** **N/A.** Relies on agent intuition to resolve conflicts.
  *   **Unreliable Sources:** **Yes.** Agent decides how much weight to give the source.
  *   **Exclusionary Factor:** Fails the Diachronic Requirement. It offers no normative guidance on *how* to revise, only that one *should*. It excludes itself from the class of updating *theories*.

  ## V. The Single Most Exclusionary Requirement

  **The Judy Benjamin Verdict (Modularity vs. Min-Info).**

  This is the point where the list tears.
  *   If you demand **Modularity** (no shift on Blue/Red), you exclude **Relative Entropy** (the leading formal candidate).
  *   If you demand **Minimum Information** (global coherence), you exclude **Modularity** (the leading intuitive constraint).
  *   **Propositional Conditioning** is excluded by the **Conflict Tolerance** constraint (triviality/zeroing).
  *   **Jeffrey-Style** is excluded by **Order Invariance** and the lack of a unique mapping for conditionals.
  *   **Deflationism** is excluded by the demand for a **Diachronic Rule**.

  For the purpose of your seminar paper, the Relative Entropy approach is the only one that functions as a complete, order-invariant, solvable algorithm, but it pays the price of violating the Modularity intuition. The specification forces you to choose: is the cost of violating Modularity lower than the cost of abandoning a general updating rule?
