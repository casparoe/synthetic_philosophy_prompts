answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** The Moral Significance of State Boundaries under an Institutionalist Framework
  **Parties:** The Compatriot Partialist (CP) and The Cosmopolitan Impartialist (CI)

  ### Preamble
  We, the undersigned, acknowledge a foundational shared premise: moral obligations regarding distributive justice cannot arise merely from shared ancestry, ethnicity, or culture. Special claims between compatriots must be grounded in the existence of actual institutions that coercively or cooperatively distribute benefits and burdens. While we share this institutionalist starting point, we diverge on the moral weight these institutions carry. This document maps our agreement, our disagreement, the cruxes of our debate, and the empirical or hypothetical cases we agree will test our respective positions.

  ### 1. Agreed Claims
  We jointly affirm the following propositions as the baseline for our continued discourse:

  1.  **The Derivative Nature of Borders:** Political borders are not moral boundaries in themselves. They possess no intrinsic moral value but derive whatever significance they have from the institutions they demarcate.
  2.  **States vs. Nations:** A distinction must be maintained between the *state* (a legal-institutional order enforcing laws and distributing resources) and the *nation* (a cultural-ethnic community). Our debate concerns the state. Appeals to national solidarity are morally irrelevant unless that solidarity is institutionalized into a cooperative scheme.
  3.  **The Global Minimum:** No institutional arrangement, domestic or international, is legitimate if it fails to secure basic human rights (subsistence, security, liberty) for all persons, regardless of citizenship. Special obligations to compatriots cannot justify violating the basic rights of outsiders.
  4.  **Institutional Reality:** Special obligations require actual institutional interaction. A citizen owes duties to compatriots because they participate in a shared coercive legal order and a reciprocal economic scheme, not because they share a language or history.
  5.  **Interdependence:** Domestic distributive justice and global distributive justice are not hermetically sealed. Domestic institutions operate within a global system that affects their capacity to distribute goods; therefore, global justice constraints apply to domestic institutional design.

  ### 2. Disagreements Table

  | Topic | Compatriot Partialist (CP) Position | Cosmopolitan Impartialist (CI) Position |
  | :--- | :--- | :--- |
  | **Source of Priority** | Shared coercive institutions create a unique relationship of reciprocity and authorship. Because we jointly impose laws on one another, we owe each other justification and priority that we do not owe to those outside the coercive sphere. | Shared humanity creates the primary moral claim. Institutions are merely tools to fulfill duties owed to all. The intensity of interaction within a state creates administrative efficiency, not moral priority. |
  | **Moral Weight of Borders** | Borders mark the boundary of a specific cooperative scheme for mutual advantage. Inside the scheme, distributive equality is required; outside, only a humanitarian minimum is required. | Borders are jurisdictional conveniences. While they may designate who administers justice, they do not designate *who matters*. Distributive equality should track persons, not jurisdictions. |
  | **Role of the State** | The state is a unique moral community of fate. It is the primary site of democratic legitimacy, and its capacity to provide for its own is a precondition for global stability. | The state is a functional agency akin to a regional branch of a global administration. Its legitimacy is contingent on its compliance with global distributive standards, not just local democratic will. |
  | **Surplus Resources** | Once the global minimum is secured for outsiders, a state's surplus resources belong primarily to its members to pursue their own democratic conception of the good life. | Once the global minimum is secured, surplus resources should still be distributed according to global need, not local preference, until global inequality is significantly reduced. |

  ### 3. The Cruxes

  We identify two substantive cruxes where our disagreement is not merely verbal but reflects divergent moral commitments regarding the nature of institutions and the requirements of impartiality.

  **Crux A: The Moral Kind of National Institutions**
  *   **The Issue:** Are state institutions morally special in *kind* compared to other associations (firms, clubs, municipalities), or are they special only in *scale* and *coercive power*?
  *   **CP View:** States are special in kind. The specific nature of political coercion and democratic co-authorship generates duties of reciprocity that do not exist in voluntary associations or weaker global institutions.
  *   **CI View:** States are special only in scale and power. They are the most effective tools we currently have, but they possess no unique moral magic. If a global institution could distribute goods more fairly, moral obligation would shift to that global institution immediately.
  *   **Verbal Dispute Check:** We have examined whether we are using the word "special" differently. CP uses "special" to mean "generating exclusive duties of reciprocity." CI uses "special" to mean "currently necessary but morally contingent." We confirm this is a **substantive moral disagreement**, not a verbal one. We disagree on whether political coercion generates unique relational duties beyond the general duty to rescue or aid.

  **Crux B: The Policy Requirement of Cosmopolitanism**
  *   **The Issue:** Does moral impartiality require open borders (freedom of movement) or merely global redistribution (freedom from poverty)?
  *   **CP View:** Cosmopolitanism requires only global redistribution. States may restrict membership (immigration) provided they discharge their financial obligations to the global poor. Membership and resources are separable.
  *   **CI View:** Cosmopolitanism requires, at minimum, a strong presumption of open borders. Restricting movement reinforces the very institutional arbitrariness that creates global inequality. Resources cannot be fully decoupled from location and access to opportunity.
  *   **Verbal Dispute Check:** We have examined whether "open borders" is a placeholder for "sufficient access." We confirm this is a **substantive policy disagreement**. CP believes location-based rights are legitimate; CI believes location-based rights are morally suspect barriers to equal opportunity.

  ### 4. Test Cases and Advance Predictions

  For each crux, we identify a case that bears on the dispute. We record our predictions here to be evaluated against future theoretical refinement or empirical reality.

  #### Case for Crux A: The "Leviathan Firm" Scenario
  **Scenario:** A private multinational corporation acquires sovereign rights over a populated territory. It provides security, courts, and welfare better than the previous state, distributing benefits and burdens coercively, but without democratic input.
  **Relevance:** Tests whether the "specialness" of the state lies in *coercion/cooperation* (which the firm has) or *democratic co-authorship/nationhood* (which the firm lacks).

  *   **CP Prediction:** Citizens of this territory do **not** owe the firm the same special partiality they owed the democratic state. Without democratic co-authorship, the institution is merely a service provider. Special obligations require political reciprocity, not just administrative efficiency.
  *   **CI Prediction:** Citizens owe duties based on the receipt of benefits and subjection to rules, regardless of the label "state" or "firm." However, the lack of democracy is a rights violation for *everyone* equally, not a specific loss of special compatriot ties. The moral landscape remains global; the change in management is secondary to the change in human rights protection.

  #### Case for Crux B: The "Wealthy Haven vs. Refugee Surge" Scenario
  **Scenario:** A wealthy liberal state faces a massive influx of refugees from a failed neighbor. The state can either (A) Accept all refugees, straining its welfare system and reducing equality among existing citizens, or (B) Reject most refugees but transfer 5% of its GDP annually to a global fund that supports the refugees in neighboring regions.
  **Relevance:** Tests whether the obligation is to share *institutional membership* (borders) or *institutional output* (resources).

  *   **CP Prediction:** Option B is morally permissible and perhaps preferable. The state's primary duty is to maintain the integrity of its cooperative scheme for its members. As long as the global fund secures the basic rights of the refugees, the state has discharged its duty. Membership is not a universal right.
  *   **CI Prediction:** Option B is morally insufficient. Money cannot substitute for the opportunity structure provided by institutional membership. If the refugees are denied access to the institutions that generate the wealth, the root injustice (arbitrary birthright privilege) remains. Option A (open borders) is required unless the global fund creates equivalent opportunities *outside* the border, which is empirically unlikely.

  ***

  **Signatories:**
  *The Compatriot Partialist*
  *The Cosmopolitan Impartialist*

  **Date:** October 26, 2023
