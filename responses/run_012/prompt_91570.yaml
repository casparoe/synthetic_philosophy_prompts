answer: |-
  Here is a reconstruction of the *Bai Ma Lun* (White Horse Dialogue) arguments using model-theoretic vocabulary, followed by a report on the semantic residue and an adjudication regarding the source text's conceptual coherence.

  ### Part I: Semantic Reconstruction of the Three Steps

  In what follows, I treat "Horse" ($H$) and "White" ($W$) as predicates with extensions $[\![H]\!]$ and $[\![W]\!]$ over a domain $D$. However, to capture Gongsun Long's moves, I must frequently shift from treating these as predicates of individuals to treating them as singular terms referring to universals, attributes, or intensions.

  #### 1. The Naming Step (Shape vs. Colour)
  **The Textual Move:** "Horse" names shape; "White" names colour. What names colour is not what names shape. Therefore, a white horse is not a horse.

  **Model-Theoretic Reconstruction:**
  *   **Semantics:** We must treat "Horse" and "White" not merely as predicates $H(x)$ and $W(x)$, but as singular terms referring to semantic values (intensions or properties). Let $v(\text{horse})$ be the property of having equine shape, and $v(\text{white})$ be the property of having white colour.
  *   **Premise 1:** $v(\text{horse}) \neq v(\text{white})$. (The property of shape is not identical to the property of colour.)
  *   **Premise 2:** The semantic value of a compound is determined by the semantic values of its parts. $v(\text{white horse}) = f(v(\text{white}), v(\text{horse}))$.
  *   **Conclusion:** $v(\text{white horse}) \neq v(\text{horse})$.
  *   **Commitments:**
      *   **Copula:** The "is not" (*fei*) must be read as **non-identity** ($\neq$), not as negation of predication ($\neg \forall x (WH(x) \to H(x))$). If read as predication, the argument is invalid in standard semantics because $[\![WH]\!] \subseteq [\![H]\!]$.
      *   **Level:** This step operates at the level of **Sense/Intension**, not Extension. It relies on the distinctness of the constituent concepts to prove the distinctness of the compound concept from one of its constituents.
  *   **Forced Interpretation:** I am forcing the text to distinguish between the *attribute* (colour/shape) and the *predicate* (white/horse). Gongsun slides from "The concept *white* is not the concept *horse*" to "The object *white horse* is not the object *horse*." In model theory, distinct intensions do not preclude one extension being a subset of the other. Gongsun treats the intensional difference as an ontological separation.

  #### 2. The Satisfaction Step (Seeking/Request)
  **The Textual Move:** If you seek a horse, a yellow or black horse suffices. If you seek a white horse, a yellow or black horse does not suffice. Therefore, a white horse is not a horse.

  **Model-Theoretic Reconstruction:**
  *   **Semantics:** This introduces an intensional context (propositional attitude or request). Let $Seek(a, \phi)$ represent agent $a$ seeking an object satisfying condition $\phi$.
  *   **Premise 1:** $\exists x (x \in [\![\text{yellow}]\!] \cap [\![\text{horse}]\!] \land \text{Satisfies}(x, \text{Seek}(a, \text{horse})))$.
  *   **Premise 2:** $\neg \exists x (x \in [\![\text{yellow}]\!] \cap [\![\text{horse}]\!] \land \text{Satisfies}(x, \text{Seek}(a, \text{white horse})))$.
  *   **Inference:** The satisfaction conditions for the term "horse" differ from the satisfaction conditions for the term "white horse."
  *   **Conclusion:** $[\![\text{horse}]\!] \neq [\![\text{white horse}]\!]$ (in the relevant context of designation).
  *   **Commitments:**
      *   **Context:** This requires **Hyperintensionality** or at least fine-grained intensions. Standard possible worlds semantics might collapse these if the extensions coincide in all accessible worlds, but here the *conditions of application* differ.
      *   **Negation:** The negation is on the satisfaction relation, not the set membership.
  *   **Forced Interpretation:** This is the cleanest step in model-theoretic terms. It maps well to the distinction between reference and sense (Frege) or extension and intension. However, Gongsun infers ontological non-identity from pragmatic non-interchangeability. In standard semantics, two terms can have different satisfaction conditions (senses) but one can still entail the other. Gongsun treats the failure of substitutability in a request context as proof that the *referents* are disjoint or distinct entities, rather than just distinct concepts picking out nested sets.

  #### 3. The Composition Step (Mereology vs. Intersection)
  **The Textual Move:** A white horse is horse together with white. Horse-together-with-white is not horse.

  **Model-Theoretic Reconstruction:**
  *   **Semantics:** Standard semantics treats adjectival modification as **intersective**: $[\![\text{white horse}]\!] = [\![\text{white}]\!] \cap [\![\text{horse}]\!]$. Gongsun treats it as **mereological fusion** or conceptual addition.
  *   **Formalization:** Let $\oplus$ be a fusion operator on properties or universals. $v(\text{white horse}) = v(\text{white}) \oplus v(\text{horse})$.
  *   **Premise:** $A \oplus B \neq A$ (Adding a component yields a distinct complex).
  *   **Conclusion:** $v(\text{white horse}) \neq v(\text{horse})$.
  *   **Commitments:**
      *   **Compounding:** We must reject set intersection in favour of **mereological sum** or **conceptual conjunction**.
      *   **Copula:** Again, strict identity ($=$).
  *   **Forced Interpretation:** This is the most significant distortion. In standard model theory, modification restricts extension (subset). Gongsun argues as if modification *adds* being (complexity). To reconstruct this faithfully, we must treat "Horse" and "White Horse" as names of **Universals** (Platonic forms), where the Universal *White-Horse* is a distinct entity from the Universal *Horse*, not merely a subset of instances. The "is" is the "is" of identity between Forms, not the "is" of class inclusion.

  ---

  ### Part II: The Residue Report

  Having mapped the arguments, we must account for what remains untranslatable or distorted.

  #### 1. What Translates Cleanly
  *   **Intensional Distinction:** The argument that "seeking a horse" and "seeking a white horse" are different acts maps cleanly onto the distinction between intensions or satisfaction conditions. Model theory handles the failure of substitutability in opaque contexts well.
  *   **Non-Identity of Compounds:** The claim that a complex term is not identical to a simple term is trivial in model theory ($A \cap B \neq A$). The residue lies not in the logic, but in the *import* of that logic.

  #### 2. What Translates Only Under Distortion
  *   **The Copula (*Fei*):** Model theory distinguishes sharply between $\in$ (membership), $\subseteq$ (inclusion), and $=$ (identity). Classical Chinese *fei* allows Gongsun to slide between these.
      *   If "White Horse is not Horse" means $[\![WH]\!] \neq [\![H]\!]$ (identity), it is true.
      *   If it means $[\![WH]\!] \not\subseteq [\![H]\!]$ (inclusion), it is false.
      *   Gongsun argues for the first to imply the second. My reconstruction had to fix the copula as identity to make the argument valid, but the rhetorical force relies on the audience hearing it as exclusion (a white horse falls outside the category of 'horse' for certain purposes).
  *   **Adjectival Modification:** As noted, I had to replace set intersection with mereological fusion. Standard semantics treats "white" as filtering the domain; Gongsun treats "white" as adding a component to the essence. This distorts the standard model-theoretic treatment of predicates.

  #### 3. What Has No Counterpart (The True Residue)
  *   **The Act of Pointing (*Zhi*):** The *Zhi Wu Lun* (Discourse on Pointing at Things) posits that names are not just labels for extensions but acts of *zhi* (pointing/designating). In model theory, the interpretation function $I$ maps symbols to extensions statically. There is no model-theoretic object corresponding to the *act* of fixing the reference. Gongsun is interested in the *process* of designation—how the pointer attaches to the thing. Model theory assumes the attachment is already done.
  *   **Normativity (*Zheng Ming*):** The later tradition reads the School of Names as engaging in *zheng ming* (rectification of names). This is deontic, not alethic. It is not about whether a statement is *true*, but whether a name is *correct* or *appropriate* for a role. Model theory deals with truth conditions, not correctness conditions of naming acts. There is no operator in standard logic for "It is fitting that $x$ is named $N$."
  *   **Kind Reference as Ontology:** Gongsun treats "Horse" as a name of a Kind/Universal that exists independently of its instances. While model theory can model kinds (e.g., Carlson 1977), it typically treats them as abstract objects within the domain. For Gongsun, the Universal *Horse* and the Universal *White-Horse* seem to have a quasi-material distinctness that model theory treats as purely formal.

  ---

  ### Part III: Adjudication

  You ask whether this residue is a defect of your vocabulary (model-theoretic semantics) or evidence that the source conflates distinct notions.

  **It is evidence of conflation in the source, which your vocabulary exposes.**

  Model-theoretic semantics is designed precisely to separate the layers that Gongsun Long runs together:
  1.  **Extension vs. Intension:** Gongsun uses intensional distinctness (Step 1 & 2) to prove ontological/exclusionary distinctness (Step 3). Your vocabulary forces you to specify whether you are talking about sets of objects or concepts. The fact that you had to switch between them to reconstruct the argument shows the text is equivocal.
  2.  **Semantics vs. Pragmatics:** The "Seeking" argument is pragmatic (speech acts, requests). The "Naming" argument is semantic (definitions). The "Composition" argument is mereological/ontological. Gongsun treats these as interchangeable evidence for the same conclusion.
  3.  **Descriptive vs. Normative:** The text oscillates between describing how language *works* (white horse requests exclude yellow horses) and prescribing how names *should be* (a white horse name must not be used where a horse name is required).

  **However, a caveat regarding *Zhi* (Pointing):**
  There is one defect in your vocabulary. Standard model theory is static; it lacks a dynamic component for the *act* of reference fixation. If you incorporate **Dynamic Semantics** or **Speech Act Theory** into your framework, you can capture the *Zhi*. The residue here is not that Gongsun is confused, but that classical model theory is insufficiently granular to model the *event* of naming. Gongsun sees naming as an event (pointing), not a state (mapping).

  **Final Verdict:**
  The *Bai Ma Lun* is not a coherent theory of reference in the modern sense. It is a sophistical exploitation of the ambiguity between:
  *   $A \neq B$ (Intensional non-identity)
  *   $A \not\subseteq B$ (Extensional exclusion)
  *   $Name(A) \neq Name(B)$ (Lexical distinctness)

  Your vocabulary does not fail to express the act of naming; rather, it succeeds in isolating the act of naming from the truth conditions of propositions. The "residue" is the space where Gongsun hides his equivocations. He trades on a conflation of **semantic value**, **ontological constituent**, and **pragmatic role**. Your framework separates these, rendering the argument valid only if you accept his equivocation as a premise. Thus, the residue is not a mystery of ancient thought inaccessible to modern logic, but the exposed seam of a category mistake that modern logic is specifically equipped to identify.
