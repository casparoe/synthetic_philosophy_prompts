prompt: |-
  I'm giving a work-in-progress talk at our department seminar in a couple of weeks and I need a Q&A prep sheet, not a defense. Here's the paper. I defend a view I've been calling silent sharpness: vagueness is epistemic, but not in the usual "the boundary is hidden from our coarse evidence" way. Take the warehouse insurance form that says you have to report a "heap" of spilled grain. I say there's a perfectly sharp fact about whether a given pile is a heap -- what fixes it is the total disposition of speakers to apply the word -- but in the cases we actually argue about, those dispositions are themselves unsettled, so there's a fact of the matter and no way to ever be in a position to know it. And the sorites comes out unsound rather than invalid: every conditional premise is true except one, we just can't know which one.

  The room is going to be rough, and I know roughly who's coming. Two people work on supervaluationism; they know the definiteness operator and the higher-order vagueness material inside out, and they think "there's a fact of the matter at the boundary" is exactly the thing you have to give up. A logician who cares only about whether the sorites comes out invalid or unsound and will call my answer a cheat. One experimental philosopher who runs the borderline-case studies and will say subjects don't report uncertainty, they report "neither true nor false." And a historian of analytic philosophy who will say this is an old debate with new notation and that I'm reinventing it badly.

  Give me the objections I'll actually get from those five, ordered by how much damage they do, each phrased the way that person would put it in the question period, each with a two-minute reply and a note on where the reply is soft. I'd like alot of detail on the two supervaluationists, they're the ones who'll actually hurt me. Tell me what to concede up front so I don't look defensive, which objection is the real threat and which ones are just noise, and what I should say if someone asks why my view isn't just supervaluationism with the gaps moved into people's heads. Also include the question I'm hoping nobody asks.
