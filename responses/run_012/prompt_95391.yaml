answer: |-
  # Q&A Prep Sheet: Silent Sharpness
  **Seminar:** Department Work-in-Progress
  **Time:** 2 Weeks Out
  **Goal:** Survive the cross-examination without collapsing into Supervaluationism or Williamsonian Epistemicism.

  ## Strategic Overview
  You are walking a tightrope. You claim there is a **sharp fact** (Epistemicism) grounded in **unsettled dispositions** (which sounds like Supervaluationism). The room knows this tension. Your survival depends on distinguishing "unsettled dispositions" from "indeterminate truth."

  **The Real Threat:** Supervaluationist #1. They will attack your supervenience base. If the ground is fuzzy, the fact cannot be sharp.
  **The Noise:** The Historian and the Experimentalist. They are standard seminar obstacles.
  **The Concession:** Up front, admit that your view *looks* like Supervaluationism with an extra step. Don't fight the resemblance; fight the metaphysical implication. Say: *"I agree with the Supervaluationist that the use is unsettled. I disagree that truth must be unsettled whenever use is."*

  ---

  ## The Objections (Ordered by Damage)

  ### 1. The Supervaluationist (Metaphysical Coherence)
  **Who:** The senior SV proponent in the room.
  **The Objection:** "You say the sharp fact is fixed by speaker dispositions, but you also admit those dispositions are unsettled in borderline cases. If the supervenience base is indeterminate, how can the supervenient fact be sharp? You're trying to have your cake and eat it too. Either the dispositions determine a sharp boundary (in which case they aren't unsettled), or they don't (in which case there's no fact of the matter). You haven't explained *what* makes it sharp if the use doesn't settle it."

  **The 2-Minute Reply:**
  "That's the core tension, and I appreciate it. My claim is that 'unsettled' describes our *epistemic access* to the dispositions, not the *ontological status* of the dispositions themselves at the moment of utterance. Think of it like a quantum state that collapses upon measurement, but the measurement is impossible for us to perform. The community *will* apply the term or not in a specific instance, and that application fixes the fact. The 'unsettledness' is that the community hasn't committed yet, and won't in a way we can track. So the fact is fixed by the *actual* disposition, which is sharp, even if the *general profile* of dispositions looks fuzzy. I'm not saying truth supervenes on fuzziness; I'm saying truth supervenes on specific acts of use that are hidden from our general evidence."

  **Where the Reply is Soft:**
  This risks collapsing into a "God's eye view" Epistemicism (Williamson). If the specific act of use fixes the fact, why is that act not part of the "total disposition"? If the total disposition includes the specific act, it's settled. If it doesn't, what is it supervening on? You need to be careful not to imply the dispositions are *actually* fuzzy.
  **Tactical Note:** If they push, concede: *"I grant the supervenience relation is the hardest part of the view. But I'd rather have a mysterious supervenience base than give up bivalence."*

  ### 2. The Supervaluationist (Higher-Order Vagueness)
  **Who:** The technical SV specialist (knows the definiteness operator).
  **The Objection:** "You say the dispositions are unsettled. Is *that* claim sharp? Are there some cases where it's sharp that the dispositions are unsettled, and others where it's vague whether they're unsettled? If you say 'yes', you've just pushed the vagueness back a level (higher-order vagueness). If you say 'no', and it's always sharp whether dispositions are unsettled, then you have a sharp boundary for 'unsettledness', which brings us back to the first problem. You haven't eliminated the hierarchy; you've just renamed the gaps."

  **The 2-Minute Reply:**
  "I'm not trying to eliminate the hierarchy; I'm trying to explain why we can't climb it. On my view, 'unsettled' is a meta-linguistic claim about the stability of our evidence. It is sharp whether the evidence is stable, but we can't know it. The higher-order vagueness isn't a feature of the world or the meanings; it's a feature of our inability to survey the total disposition. So, there is a fact about whether the dispositions are unsettled, but again, we can't know it. I'm comfortable with a sharp hierarchy that is epistemically inaccessible, rather than a semantic hierarchy that lacks truth values."

  **Where the Reply is Soft:**
  This sounds dogmatic. Why is the "unsettledness" sharp? If the evidence is messy, the claim "the evidence is messy" might itself be borderline.
  **Tactical Note:** Do not get dragged into formalizing the definiteness operator. Keep it on the "evidence vs. fact" distinction.

  ### 3. The Logician
  **Who:** Cares only about validity/soundness.
  **The Objection:** "You say the Sorites is unsound because one conditional is false. But if you can't identify which one, and you admit no one can, then for all logical purposes, the premise set is indistinguishable from a set where all are true. Calling it 'unsound' is a cheat. It's a verbal trick to preserve classical logic without doing the work of finding the cut-off. If you can't point to the false premise, in what sense does it exist?"

  **The 2-Minute Reply:**
  "It's not a cheat; it's a commitment to bivalence. In classical logic, a conditional is false if the antecedent is true and the consequent false. In the Sorites chain, there must be a step where we go from Heap to Non-Heap. That step makes the conditional false. The fact that we can't *locate* that step epistemically doesn't change its truth conditions. Imagine a lottery ticket. One ticket will win. I don't know which. It's not a cheat to say 'There is a winning ticket' even if I can't point to it. The logic holds regardless of my ignorance."

  **Where the Reply is Soft:**
  The lottery analogy works for existence, but less well for *meaning*. The logician might say the conditional's truth depends on meaning, not chance.
  **Tactical Note:** Stand firm on classical logic. "I am preserving classical logic. That is the feature, not the bug."

  ### 4. The Experimental Philosopher
  **Who:** Runs borderline case studies.
  **The Objection:** "My data shows that when subjects face borderline cases, they don't report 'I don't know.' They report 'It's neither true nor false' or they hesitate in a way that suggests truth-value gaps. You're positing a sharp fact that contradicts the phenomenological data of how speakers actually engage with the terms. Why should we accept your metaphysical posit over their reported experience?"

  **The 2-Minute Reply:**
  "Folk semantics is data, but it's not authoritative on metaphysics. Subjects also report that time slows down in accidents or that the sun moves around the earth. My claim is about what fixes the truth, not how it feels to judge it. The 'neither true nor false' report is best explained by my view: they sense the dispositions are unsettled, so they report a gap, but that report is an error theory. They are confusing 'I can't tell' with 'There is nothing to tell.' I'm explaining why they make that error."

  **Where the Reply is Soft:**
  It's dismissive. If the "error" is universal, is it still an error?
  **Tactical Note:** Frame it as "Error Theory." It's a standard move. Don't let them think you're ignoring data; you're interpreting it.

  ### 5. The Historian of Analytic Philosophy
  **Who:** Thinks everything is old.
  **The Objection:** "This looks like a rehash of the Cambridge 'open texture' debates from the 30s, or perhaps a variation on Waismann, but with Williamson's epistemic clothing. You're reinventing the wheel and calling it 'Silent Sharpness.' What does this notation actually buy us that the old debates didn't already exhaust?"

  **The 2-Minute Reply:**
  "The history is instructive, but the grounding mechanism is new. Waismann and the early analysts often concluded that vagueness meant logic breaks down or that concepts are inherently fluid. I'm using the modern epistemic framework to say the logic holds, but the *grounding* is more fragile than Williamson admits. Williamson says the boundary is hidden by margin-for-error principles. I'm saying the boundary is hidden because the social practice itself hasn't crystallized. That's a sociological claim about meaning, not just an epistemic principle. It connects vagueness to community practice in a way the old debates didn't formalize."

  **Where the Reply is Soft:**
  You might be reinventing it.
  **Tactical Note:** Don't fight the history too hard. Acknowledge the lineage but insist on the *mechanism* difference.

  ---

  ## The "Supervaluationism with Gaps in Heads" Challenge
  **The Question:** "Why isn't your view just Supervaluationism where the truth-value gaps are moved from the semantics into the speakers' psychology? You say there's a fact, but it's unknowable because the dispositions are unsettled. A Supervaluationist says there's no fact because the precisifications vary. If the dispositions vary/unsettle, what is the 'sharp fact' doing there other than doing no work?"

  **The Answer:**
  "The work it does is preserving classical logic and bivalence. For the Supervaluationist, 'This is a heap' is neither true nor false in the borderline. For me, it is true or false, but the *evidence* (the dispositions) is gappy. This matters for negation. For the SV, 'It is not a heap' is also neither true nor false. For me, one of them is true. This preserves the Law of Excluded Middle. If you move the gaps into the heads, you still have to decide if the *proposition* has a value. I say the proposition has a value. SV says it doesn't. That's a metaphysical difference, not just a psychological one."

  **Prep Note:** This is the hardest question. If they press on *what makes the proposition have a value* if the use doesn't, you must fall back on: *"The actual use in the specific instance, which exists even if the general practice is unsettled."*

  ---

  ## The Question You Hope Nobody Asks
  **"If the dispositions are unsettled, what *forces* them to resolve into a sharp fact? If the community hasn't decided, and the evidence doesn't decide, isn't positing a sharp fact just metaphysical idolatry?"**

  **Why this hurts:** It attacks the motivation for the sharp fact. If the "unsettledness" is real, why insist on sharpness?
  **How to handle if asked:** Do not try to give a causal mechanism. Say: *"I take bivalence as a constraint on any theory of meaning that wants to preserve classical logic. I am starting with the logic and working backward to the metaphysics. If that requires a 'metaphysical idol,' I accept it to save the logic."* (Better to be a dogmatist about logic than incoherent about metaphysics).

  ---

  ## Final Advice for the Room
  1.  **Don't Defend Williamson:** If they ask "How is this different from Williamson?", say: *"Williamson says the boundary is sharp but we can't know it due to safety conditions. I say the boundary is sharp but we can't know it because the social ground is unstable."*
  2.  **Watch the Supervaluationists:** They will talk to each other during your reply. If they nod at each other, stop and ask: *"I see you two agree. Is the objection the supervenience or the higher-order?"* Force them to split.
  3.  **Concede the "Mystery":** It is better to say *"Yes, how sharp facts emerge from unsettled dispositions is mysterious"* than to give a bad mechanical explanation. Mystery is a cost; contradiction is a death sentence.
  4.  **Body Language:** When the Logician speaks, look at the Supervaluationists. When the Supervaluationists speak, look at the Logician. Show them their objections pull in different directions (Logic wants sharpness, SV wants gaps). You are the middle ground.

  **Good luck. Keep the logic classical, keep the metaphysics humble.**
