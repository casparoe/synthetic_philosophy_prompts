answer: |-
  The central contention of Risk-Weighted Expected Utility (REU) theory is that it liberates decision theory from the constraints of Expected Utility (EU) by splitting the agent's attitude toward value from her attitude toward risk. In standard EU, risk aversion is wholly a function of the curvature of the utility function $u$; in REU, risk aversion is governed by a distinct risk function $r$ that transforms probabilities before aggregation. I argue that this distinction is illusory. The risk function $r$ is not an independent parameter of practical rationality but is rather a component of the agent's utility function. REU does not offer a rival normative structure; it merely launders a specific taste about uncertainty into the aggregating machinery. The theory collapses back into EU once we recognize that attitudes toward risk are preferences over the *property of security*, and security is an outcome.

  To demonstrate this, consider a single case: The Pill of Risk-Neutrality.

  An agent, Alice, faces a simple prospect $P$: a 50% chance of \$0 and a 50% chance of \$100. Alice is currently risk-averse. Under REU, her risk function $r$ is convex, meaning she weights the lower probability intervals more heavily, reducing the overall value of $P$ below its expected monetary value. Before choosing whether to accept $P$, Alice is offered a pill. This pill does not change the payoffs of $P$, nor does it change the probabilities. It rewrites her cognitive machinery such that her risk function becomes linear (risk-neutral). If she takes the pill, she will evaluate $P$ according to standard expectation. If she declines, she evaluates it according to her current convex $r$.

  The crucial question is this: Can Alice coherently prefer taking the pill?

  If REU is correct that $r$ is a parameter of *rationality*—a norm governing how probabilities ought to be weighed, distinct from what the agent wants—then the question is category-confused. One does not have a rational preference for having different laws of logic or arithmetic. If $r$ constitutes the rational standard for weighing evidence, preferring to change it is akin to preferring to be irrational. On this reading, Alice cannot coherently prefer the pill; her current $r$ defines the correct valuation of the prospect. To prefer the pill would be to say, "I value this prospect incorrectly, and I wish to value it correctly," which implies her current valuation is a mistake. But REU posits that her current $r$ is not a mistake; it is her rational risk attitude.

  However, it is intuitively obvious that Alice *can* coherently prefer the pill. Many agents feel their anxiety about tails is a burden; they wish they cared less about the worst-case scenario so they could take advantageous gambles. If Alice prefers taking the pill, she is comparing two composite states: (1) Facing $P$ with risk-attitude $r_{averse}$ and (2) Facing $P$ with risk-attitude $r_{neutral}$. For this comparison to be meaningful, there must be a higher-order valuation function $V^*$ that ranks these states. $V^*$ treats the risk attitude itself as a variable contributing to the overall goodness of the situation.

  If the risk attitude contributes to the goodness of the situation, it is a good. If it is a good, it belongs in the utility function.

  By taking the pill, Alice is effectively choosing an outcome where the "texture" of the uncertainty is different. She values the state of "facing a gamble without anxiety" more than "facing a gamble with anxiety." In EU terms, we simply expand the description of the outcomes. The outcomes are not just \$0 and \$100; they are "\$0 while anxious" and "\$100 while anxious" versus "\$0 while calm" and "\$100 while calm." The curvature that REU attributes to the probability weighting function $r$ is actually the marginal utility of security. When REU moves this curvature into the aggregation rule, it obscures the fact that the agent is trading off money against peace of mind. The pill case proves that $r$ is mutable by preference, and anything mutable by preference is an object of utility, not a norm of aggregation.

  The obvious reply from the REU proponent is that relocating $r$ into the utility function robs the theory of empirical content. If "risk aversion" is just "disliking the outcome of being uncertain," then EU becomes a tautology. Any pattern of choices can be rationalized by attributing the right utility to the "uncertainty outcome." We lose the ability to distinguish between an agent who values money dimishingly (concave $u$) and an agent who values money linearly but dislikes variance (convex $r$). If both are modeled as concave $u$ in the expanded EU framework, the distinction vanishes, and we cannot predict how the agent will behave when the "uncertainty" is stripped away or changed.

  A decision theorist should adopt the EU reading despite this cost, for two reasons. First, conceptual parsimony favors a single aggregation rule that handles all trade-offs. Second, the "loss" of distinction is actually a gain in honesty. The REU distinction suggests that risk aversion is a formal attitude toward probability *per se*. The pill case shows it is a substantive attitude toward the experience of uncertainty. By folding $r$ into $u$, we acknowledge that risk aversion is a taste, like a preference for chocolate over vanilla, not a structural requirement of rationality.

  Does this render EU unfalsifiable? Only if we allow outcomes to be described arbitrarily. To maintain empirical content, we must constrain the description of outcomes to natural properties of the world state. "Security" or "absence of anxiety" are natural psychological properties of the agent experiencing the state. Therefore, an EU theorist can test the model by checking if the agent's preferences over risk-attitude changes (like the pill) align with their choices over gambles. If an agent chooses the risk-neutral pill but then rejects gambles that a risk-neutral agent would accept, *then* we have a contradiction. But this contradiction is internal to the agent's consistency, not a failure of the EU framework to model it.

  What would move me off this position? I would abandon the claim that $r$ is reducible to $u$ only if there existed a preference reversal that EU could not capture even with a rich description of outcomes. Specifically, if an agent exhibited preferences that violated the Independence Axiom in a way that *cannot* be explained by the probability distribution being part of the outcome description. For example, if an agent preferred $A$ to $B$ in isolation, but preferred $B$ to $A$ when both were embedded in a larger compound lottery, *and* this reversal persisted even when the "context" of the compound lottery was explicitly included in the outcome description as a psychological state.

  However, REU does not clearly offer this. REU violations of Independence (like the Allais paradox) are typically explained by the agent caring about the *spread* of probabilities. But caring about the spread is caring about a property of the prospect. If that property is valuable to the agent, it is utility. To say otherwise is to insist that some preferences are "about probability" and therefore exempt from being "about outcomes." But the pill case demonstrates that the agent can stand outside her probability weighting and evaluate it. Once she can evaluate it, it is an outcome.

  Therefore, the decision theorist should treat REU as a notational variant of EU with expanded outcomes. The risk function $r$ is not a norm of rationality; it is a revealed preference for security. To treat it as a normative parameter is to confuse a taste for a law. The moral is general: any parameter of a decision theory that an agent can rationally wish to alter is not a parameter of the theory's normative structure, but a variable within the agent's utility function. Rationality dictates how to maximize; it does not dictate what to maximize. Since $r$ dictates what is maximized (by determining how much weight security carries), it belongs in the maximand.
