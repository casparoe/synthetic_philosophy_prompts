prompt: |-
  I'm running a film night for a reading group that's been working through Quine, and we're watching Arrival (2016). The obvious hook is the Sapir-Whorf angle — learning Heptapod rewires how Louise experiences time — but what I actually want is a reading of the film through Quine's indeterminacy of translation, the gavagai business. The film seems to assume their's a fact of the matter about what the aliens mean and that Louise eventually latches onto it; the whole plot turns on her getting it right. Quine says there's no such fact: any number of translation manuals fit all the available evidence, and even reference itself is inscrutable — you can permute what every term refers to, his proxy-function trick, and nothing observable changes. So does the film come out as a naive realist about meaning, or does it dramatise something Quine's argument misses? And what does the Whorfianism add or muddy, given that indeterminacy is meant to be a point about evidence rather than about language rewiring thought? Tell me which scenes we should argue about, and where the reading strains. If I've got Quine wrong, or if Arrival just isn't a film about this, say so plainly instead of humouring the framing. British English please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
