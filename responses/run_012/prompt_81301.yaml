      *   *Correction:* The user asks if the film comes out as naive realist. Yes, it does.
      *   *Correction:* Does it dramatise something Quine misses? Perhaps the *phenomenology* of understanding, which Quine ignores (he's a behaviourist).

  7.  **Final Polish of the Argument:**
