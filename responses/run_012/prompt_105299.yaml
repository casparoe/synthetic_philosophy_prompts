answer: |-
  This is a classic formulation of the problem, and you are right to feel uneasy. Your argument is essentially a reconstruction of the objection Parfit himself raises against the **Self-Interest Theory (S)** in *Reasons and Persons*.

  You want to keep Premise (1). Your friend wants to use the argument to kill Act-Consequentialism (AC). Parfit uses the argument to show that S is **self-defeating**.

  Here is the diagnosis: Your argument is valid, but it relies on a hidden assumption in **Premise (2)** regarding *availability*, and Premise (1) is much more controversial than it looks.

  Here is the breakdown of where the pressure points are, why they look innocent, and what it costs to fix them.

  ### 1. The Innocent-Looking Trap: Premise (2)
  > *(2) Standing at the roadside I have two options: promise-then-pay, and promise-then-stiff-him.*

  This is the step that does the most heavy lifting, and it is the most vulnerable to the "Newcomb Problem" objection.

  **Why it looks innocent:** It assumes a standard model of agency where the future is open. At the roadside, surely I can *choose* what I will do in town?
  **Why it's problematic:** In the Hitchhiker case (like Newcomb's Problem), your choice in town is **logically or causally correlated** with the driver's prediction at the roadside.
  If the driver is a good predictor, he isn't predicting your *promise*; he is predicting your *decision procedure*.
  *   If you are the type of agent who reasons via (1)-(3), the driver predicts "Stiff." You get no ride.
  *   If you are the type of agent who pays, the driver predicts "Pay." You get a ride.

  Premise (2) assumes you can mix and match: *Be the type who gets the ride (by appearing to promise)* but *be the type who stiffens (when it counts)*. But if your reasoning process is transparent (or predictable), **the option "Get Ride + Stiff" is not available to you.** The available options are effectively:
  1.  Be a Stiffer → No Ride → Death.
  2.  Be a Payer → Ride → Pay → Life (minus cash).

  **The Cost of Dropping/Modifying (2):**
  If you reject (2), you are admitting that **rational agents cannot treat future acts as independent variables** when those acts are predicted by others. This forces you into **Evidential Decision Theory** (where you choose based on what your act evidences about your type) or **Dispositional Consequentialism** (where you evaluate the disposition, not the act). This concedes the main point to Parfit: you can't evaluate the *act* in isolation.

  ### 2. The Heavy Lifter: Premise (1)
  > *(1) An act of mine is rational just in case, given how things actually go, it gets me the best outcome available to me.*

  You said you'd rather keep this if possible. I strongly advise against it, even independent of the Hitchhiker case.

  **Why it looks innocent:** It sounds like simple instrumental rationality. Do what works.
  **Why it's problematic:** This is **Actual Consequentialism**. It makes rationality dependent on luck and facts unknown at the time of action.
  *   *Example:* I see a child drowning. I jump in to save them (best expected outcome). A freak shark eats us both.
  *   *According to (1):* My act was **irrational** because, "given how things actually go," I died.
  *   *According to Expected Consequentialism:* My act was rational because it maximized *expected* value at the time.

  Almost all consequentialists reject (1) in favor of **Expected Consequentialism**.

  **The Cost of Keeping (1):**
  If you keep (1), you must accept Parfit's conclusion: **The Self-Interest Theory is self-defeating.**
  Parfit argues: "If we all try to achieve S, we will fail. S tells us to try to achieve S. So S is indirectly self-defeating."
  If you keep (1), you have to tell your reading group: *"Yes, rationality leads me to die in the desert. That shows rationality is self-defeating, so I should cultivate an irrational disposition to pay."*
  This is a coherent position (Parfit holds it), but it surrenders the claim that "Rationality is always the best guide to success."

  ### 3. Addressing Your Friend's Claim
  Your friend says Parfit's "dispositions" move changes the subject. **Your friend is wrong, but for a subtle reason.**

  Your friend assumes the question is: *"Which **act** should I perform in town?"*
  Parfit argues the question is: *"Which **decision-making disposition** should I cultivate over my life?"*

  If you evaluate acts one by one (Act-Consequentialism), you die.
  If you evaluate dispositions (Dispositional-Consequentialism), you live.

  Is this changing the subject? No, it's recognizing that **acts flow from dispositions.** You cannot simply "choose the act" in town without having the disposition that got you there. If you try to "choose the act" of paying in town while having the disposition of a stiffer, you are engaging in magical thinking about your own agency.

  ### Recommendation for Your Reading Group

  Don't try to save Premise (1). It is the weakest link philosophically, independent of the Hitchhiker case. It makes rationality hostage to luck.

  **Here is the pivot you should make:**

  1.  **Concede Premise (8) regarding (1):** Admit that *Actual* Consequentialism (1) is false because it fails the "Luck Objection" (the shark example).
  2.  **Modify to Expected Consequentialism:** Change (1) to: *"An act is rational if it maximizes **expected** outcome at the time of decision."*
  3.  **Show the problem remains:** Even with *Expected* Consequentialism, if you calculate the expectation *act-by-act* in town, the expectation of stiffing is higher (you have the money, no penalty). So Act-Consequentialism still tells you to stiff.
  4.  **The Solution:** The only way to save Consequentialism is to shift the object of evaluation from **Acts** to **Dispositions** (or Rules).
      *   *Argument:* "It is not the *act* of paying that is rational; it is the *disposition* to be a payer. Since I cannot switch dispositions instantly in town, I must cultivate this disposition beforehand."

  **Why this saves you from embarrassment:**
  It shows you understand that the Hitchhiker case isn't just a puzzle about promises; it's a puzzle about **the locus of evaluation**.
  *   If you evaluate Acts → You die (Theory is self-defeating).
  *   If you evaluate Dispositions → You live (Theory is successful).

  **Summary for your notes:**
  *   **Premise to drop:** (1). It defines rationality by actual outcomes rather than expected outcomes. This is untenable due to luck.
  *   **Premise to challenge:** (2). It assumes you can choose a future act independently of the disposition that caused the past prediction.
  *   **Verdict on Friend:** They are right that Act-Consequentialism fails here, but wrong that Parfit is changing the subject. Parfit is correctly identifying that *Acts* are the wrong unit of analysis for rationality in interdependent cases.
  *   **Your Move:** Argue that we should accept **Dispositional Consequentialism**. This keeps the spirit of consequentialism (maximize good outcomes) without the self-defeating bullet of Act-Consequentialism.

  This position is sophisticated, defensible, and aligns with Parfit's actual conclusion in *Reasons and Persons* (that we should accept a theory that is not self-defeating, even if it requires us to sometimes act against immediate act-based optimization).
