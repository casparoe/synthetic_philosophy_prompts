      *   I need to explain *why* (1) is the real problem, even if (2) is also shaky.
      *   Actually, the strongest objection to the argument as stated is **Premise (2)**. It assumes the agent has control over the future act *independent* of the disposition required to get the ride. This is the "Toxin Puzzle" / "Newcomb's Problem" structure.
