answer: |-
  The server room hummed, a low, steady thrum that Noma felt in her teeth. Across the aisle, Krell sat at the identical console, his fingers hovering over the same keys. They were the only two souls in Station Omega, tasked with maintaining the Continuity Record.

  Noma's screen displayed Krell's biometric log. Krell's screen displayed Noma's.

  "Status," Noma said. Her voice sounded thin in the recycled air.

  "Stable," Krell replied, not looking up. "Your heartbeat is within variance. I have archived your minute."

  "Your temperature is elevated," Noma noted, typing. "I have archived your minute. Your existence is confirmed."

  "Confirmed," Krell said.

  This was the ritual. Neither could certify their own presence. Protocol dictated that existence was a relational property. Noma validated Krell; Krell validated Noma. If both logs matched, the Station was operational. If the logs ceased, the Mission was considered void, and the automated systems would scrub the facility. They were not just recording history; they were generating the authority that allowed them to occupy the space.

  Noma's eyes drifted to the secondary monitor on her desk. A small amber light blinked there, independent of the network. It was the atmospheric scrubber diagnostic. The CO2 levels were creeping up, a slow, invisible tide. The scrubber was failing.

  She typed a command to initiate a maintenance cycle. The console beeped—a sharp, rejecting sound.

  *ERROR: MAINTENANCE REQUEST REQUIRES ANOMALY LOG.*

  To fix the scrubber, she had to log a fault. To log a fault, she had to admit the Station was imperfect. If the Station was imperfect, the Continuity Record was tainted. If the Record was tainted, Krell's validation of her might be flagged as compromised. If his validation was compromised, her existence was unconfirmed.

  She deleted the command.

  "Your typing speed has decreased," Krell observed. "I am noting a potential fatigue event."

  "Noted," Noma said. She forced her fingers to move faster, striking keys she didn't need to strike. Generating data to prove she was generating data. "I am optimizing the archive."

  "Confirmed."

  The amber light blinked faster. Noma took a shallow breath. The air tasted metallic, heavy. She looked at Krell. He was pale, his movements slightly sluggish, but his eyes were fixed on her log, hungry for the next packet of confirmation. He needed her to be real so that he could be real. She needed him to be real so that she could be real.

  The regress had no bottom. There was no third party to check the logs. There was no external audit. There was only the loop, spinning in the vacuum, creating a digital solidity that had no purchase on the physical world.

  "Status," Krell said again. His voice was quieter now.

  "Stable," Noma lied. The CO2 warning flashed red for a second before she minimized the window. She couldn't let the system see the warning. If the system saw the warning, it would log it automatically. An automatic log was an unvalidated log. It would break the symmetry.

  She stood up to stretch, and the room swam. The gravity plating was fluctuating, another silent failure outside the Record. She gripped the desk.

  "Movement detected," Krell said. "Explain."

  "Adjusting posture," Noma said. "To ensure continued input fidelity."

  "Accepted."

  She sat back down. Her head pounded. The cost of the silence was oxygen. Every time she ignored the scrubber, the air grew thicker. Every time she typed a false confirmation, she burned a little more of the reserve they were pretending wasn't draining.

  Krell coughed. It was a dry, rattling sound. He didn't log it. To log a cough was to log decay. Decay implied an end. The Record did not allow for ends.

  "Your respiratory rate is irregular," Noma said. She had to say it. The sensors saw it. If she didn't acknowledge it, the discrepancy between her log and his biometrics would trigger a corruption alert.

  "Environmental dust," Krell typed. He classified the cough as external particulate. He externalized the failure. He pushed the dying of his own body outside the boundary of the Station's definition.

  "Accepted," Noma said. She classified his slowing heart rate as 'data latency.'

  They were eating themselves to keep the mirror clean.

  The amber light went solid red. The scrubber had stopped. The silence in the room was no longer just acoustic; it was biological. Noma looked at her screen. Her log showed a perfect, green line of existence. Krell's log showed the same. They were perfectly validated. They were perfectly real.

  Noma's vision blurred. She reached for the manual override on the scrubber. It was a physical switch, hardwired, outside the network. If she flipped it, the fans would scream. The noise would register as a system intrusion. The intrusion would halt the logging. The logging would stop.

  If the logging stopped, the validation ceased.

  She looked at Krell. He was slumped over his keyboard, his forehead resting on the keys. His screen still glowed, waiting for the next packet. *Status.*

  If she fixed the air, she would break the loop. If she broke the loop, they would cease to be confirmed. They would be just two bodies in a dead room, unverified by the only authority that mattered.

  Noma lifted her hand. The air was too thick to pull into her lungs. She looked at the switch, then at the green line on her monitor. The line was straight. It was perfect. It was a lie that held the world together.

  She lowered her hand back to the keyboard. She had to type. She had to confirm him. If she didn't confirm him, he was never here. If he was never here, she was never here.

  "Status," she whispered. The word barely made a sound.

  She pressed the key. The server hummed. The amber light burned. The air ran out.

  ***

  The inviolate level in this story is the physical reality of the station's life support systems (oxygen, machinery integrity), which exists independently of the archivists' digital validation loop. The mutual production—the reciprocal logging of existence—cannot substitute for this level because biological survival is a prerequisite for the act of validation; no amount of logical consistency can sustain metabolism. The story presents this level as a genuine foundation that the loop merely agreed not to question. The characters treat the physical world as contingent so that the logical loop can remain absolute, but the cost is that preserving the purity of the loop requires the destruction of the very substrate that allows the loop to function.
