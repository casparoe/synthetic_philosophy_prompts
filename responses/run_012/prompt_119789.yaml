answer: |-
  # Session Plan: The Gap (Mind & Brain, Year 2)

  **Total Time:** 90 Minutes
  **Activity Time:** 40 Minutes
  **Debrief Time:** 25 Minutes
  **Buffer/Admin:** 25 Minutes
  **Students:** ~18 (Mixed Phil/Psych)
  **Room:** Standard seminar room with projector and screen.

  ## 1. Preparation & Materials

  **The "Tachistoscope" (Projector Setup)**
  You need a slide deck (PowerPoint/Keynote) configured for precise timing. Do not use animations; use separate slides to ensure frame-accuracy.
  *   **Slide A (Fixation):** A simple black cross on white background. (Duration: 1000ms)
  *   **Slide B (The Grid):** 12 distinct symbols arranged in 3 rows of 4. (Duration: 250ms). *Note: 250ms is roughly 15 frames at 60Hz. Set slide transition to "After 0.25 seconds".*
  *   **Slide C (The Mask):** A grid of random hash marks or noise. (Duration: 500ms).
  *   **Slide D (The Cue):** A visual indicator of which row to report (e.g., Left Bracket `[` next to top row, Middle Bracket next to middle, etc.). OR an auditory cue (you clapping/stamping). *Recommendation: Use auditory cues for flexibility. You control the delay.*
  *   **Slide E (Blank/Write):** Blank white screen for writing. (Duration: 15000ms).

  **The Stimuli (The Grids)**
  Create 6 different grids. Use abstract symbols (e.g., ☾, ☀, ☁, ☂, ☃, ☄, ★, ☆, ☇, ☈, ☉, ☊) rather than letters to prevent verbal rehearsal strategies.
  *   *Grid 1-3:* For the main experiment.
  *   *Grid 4-6:* Spares in case of technical failure.

  **Handouts**
  *   **Response Sheets:** Pre-printed sheets with three sections labeled "Round 1," "Round 2," "Round 3." Each section has a grid of 12 empty boxes matching the screen layout.
  *   **Wager Tokens:** Cut up 100 small slips of paper per student, or use poker chips if available. Call them "Credibility Points."
  *   **Role Cards:** 3 cards handed out at the start.
      *   *The Scribe:* Records the group's aggregate wagers on the board.
      *   *The Timekeeper:* Watches the clock for the writing phases.
      *   *The Skeptic:* Tasked with finding alternative explanations for the group's success (e.g., "Maybe they guessed," "Maybe the flash was longer").

  **The "Stake"**
  Tell students they start with 10 Points. They can wager 0-10 on their introspective claims. The "prize" is purely symbolic (e.g., first choice of essay topic, or simply bragging rights), but treat it seriously.

  ## 2. What You Must NOT Say (The Embargo)

  Until the Debrief (minute 65), you are forbidden from using the following concepts or words:
  *   Consciousness / Conscious / Unconscious
  *   Memory / Iconic / Short-term / Working
  *   Access / Phenomenal / Experience
  *   Attention / Focus / Attend
  *   Sperling / Paradigm / Experiment / Data
  *   Brain / Mind / Cognition

  **Instead, use:**
  *   "What was available to you."
  *   "What you could write down."
  *   "How it seemed."
  *   "The display."
  *   "The signal."
  *   "The task."

  ## 3. Minute-by-Minute Running Order

  ### Phase 1: Setup & Roles (00:00 – 00:10)
  *   **00-05:** Seat students. Hand out Response Sheets and Tokens. Assign the 3 Roles (Scribe, Timekeeper, Skeptic).
  *   **05-10:** **Instructions (Read exactly):** "We are going to run a series of perception tasks. Your job is to look at the screen and write down what you see on your sheet. There are no right or wrong answers, only accurate records of what you managed to capture. You will be given tokens. Later, you will use these to stake a claim on how much of the display was 'present' to you. Do not discuss the task with your neighbors until the end."

  ### Phase 2: The Perception Task (00:10 – 00:35)
  *   **Round 1: Full Report (00:10 – 00:15)**
      *   Show Fixation (1s) $\rightarrow$ Grid (250ms) $\rightarrow$ Mask (500ms).
      *   Instruction: "Write down as many symbols as you can, in their correct positions."
      *   *Expected Result:* Students report 3-5 items. Frustration is common.
  *   **Round 2: Immediate Partial Report (00:15 – 00:25)**
      *   Show Fixation $\rightarrow$ Grid $\rightarrow$ Mask.
      *   **Crucial:** Immediately (within 100ms of mask onset) call out "Top," "Middle," or "Bottom."
      *   Instruction: "Write down *only* the row I called."
      *   *Expected Result:* Accuracy jumps significantly (almost full row).
      *   Repeat twice with different rows to establish the effect.
  *   **Round 3: Delayed Partial Report (00:25 – 00:35)**
      *   Show Fixation $\rightarrow$ Grid $\rightarrow$ Mask.
      *   **Crucial:** Wait 1 full second of silence after the mask before calling the row.
      *   Instruction: "Write down *only* the row I called."
      *   *Expected Result:* Accuracy drops back down to Round 1 levels.
      *   *Observation:* Watch the room. The drop in performance is usually palpable.

  ### Phase 3: The Wager & The Black Box (00:35 – 00:50)
  *   **The Wager (00:35 – 00:40)**
      *   Ask: "In Round 2, when you wrote the cued row, how many of the *other* eight symbols were still 'there' for you in the same way, just unreported?"
      *   Students place tokens on a scale drawn on the board (0 to 12).
      *   *The Split:* Some will bet high (Richness), some low (Decay).
      *   **Skeptic Role:** Ask the Skeptic to interview one high-better and one low-better. "Why do you trust that feeling?"
  *   **The Black Box Challenge (00:40 – 00:50)**
      *   Select one volunteer (The Subject).
      *   Show them a new Grid (500ms this time, let them see it clearly).
      *   **Constraint:** The Subject cannot speak, write, or gesture. They must sit perfectly still.
      *   **Task for Class:** "Determine one specific symbol that was in the top right corner."
      *   *Outcome:* They cannot do it.
      *   **Twist:** Ask the Subject to *point* to the top right corner on their blank sheet, then nod if the symbol you name is correct.
      *   *Outcome:* They can verify accuracy non-verbally.
      *   *Point:* The class realizes they need *some* output (report or action) to know what is inside. Without it, the "mind" is a black box.

  ### Phase 4: The Broadcast Task (Global Workspace Proxy) (00:50 – 01:00)
  *   Pair students up (9 pairs).
  *   **Student A** sees a slide with Row 1 & 2 only (Rows 3 & 4 are blank).
  *   **Student B** sees a slide with Row 3 & 4 only (Rows 1 & 2 are blank).
  *   **Task:** "Together, determine if there is a matching symbol in Column 1 across all four rows."
  *   **Rule:** They cannot show their sheets. They must *speak* the symbols to each other to solve it.
  *   **Debrief Question:** "Could you solve the puzzle using the symbols you kept silent?" (No). "When did the information become useful?" (When spoken).

  ### Phase 5: The Debrief (01:00 – 01:25)
  *   **01:00 – 01:05:** Reveal the Embargo. List the forbidden words. Ask: "What were we actually testing?" (Elicit: Memory, Consciousness, Attention).
  *   **01:05 – 01:15:** Map the Activity to the Distinction.
      *   *Round 1:* Access Capacity (Report limit).
      *   *Round 2:* The feeling of Richness (Phenomenal pull).
      *   *Round 3:* The decay of the buffer (The temporal gap).
      *   *Black Box:* The Methodological Trap (Report-dependency).
      *   *Broadcast:* The Global Workspace intuition (Information must be shared to be used).
  *   **01:15 – 01:25:** Hold the Tension.
      *   *Reading A (Rich):* The cue reached back into a full picture that was already there.
      *   *Reading B (Deflationary):* The cue triggered a reconstruction from a vague haze; only the reported items were ever truly 'seen'.
      *   *Closing:* "Your wager felt like evidence. But was it evidence of the world, or evidence of your belief about the world?"

  ### Phase 6: Wrap Up (01:25 – 01:30)
  *   Collect tokens.
  *   Assign reading (if any).
  *   Dismiss.

  ---

  ## 4. The Debrief Script (Core Philosophical Work)

  *Do not lecture immediately. Use the Scribe's data on the board.*

  **Step 1: The Phenomenological Pull (Reading A)**
  "Look at the wagers from Round 2. Many of you bet that the uncued rows were 'there.' Why? Because it *felt* like they were. When the tone sounded, it felt like you were *reading* from a list that already existed, not *creating* the list at that moment. This supports the idea that your experience was richer than your report. The 'gap' is real. There is more in the mind than can be spoken."

  **Step 2: The Deflationary Push (Reading B)**
  "Now look at Round 3. One second later, that richness vanished. If it was a stable picture in your mind, why did it evaporate so fast? The skeptic might say: You didn't 'see' the whole grid. You saw a vague texture. The cue told your brain where to look, and your brain *filled in* the details from that texture. On this view, nothing was 'conscious' except what you reported. The feeling of richness is an illusion—a 'user-illusion'."

  **Step 3: The Methodological Wall (The Black Box)**
  "Consider the Silent Partner task. You couldn't know what they saw without a report. Even when they pointed, that was a report. This means we can never measure the 'Richness' directly. We only measure the 'Access.' So, when you wagered earlier, were you reporting on your experience, or were you reporting on your *theory* of your experience? This is the methodological trouble: We are trying to use report to measure the limits of report."

  **Step 4: The Broadcast (Global Workspace)**
  "In the pair task, the info you held silently was useless. It only became 'knowledge for the pair' when spoken. This suggests that for information to be used by the system (you), it must be broadcast. The question remains: Was the silent info conscious? Or was it just data waiting for a broadcast channel?"

  **Step 5: Holding the Tension**
  "I am not going to tell you which reading is correct today. The point of this module is to live in that gap. If you choose Reading A, you must explain how we study something that vanishes when we look at it. If you choose Reading B, you must explain why it feels so convincingly real. Keep both in mind."

  ---

  ## 5. Troubleshooting & Predictable Failures

  **1. The "I Know This" Student**
  *   **Risk:** A psychology student recognizes Sperling and shouts "It's iconic memory decay!"
  *   **Fix:** Pre-empt this in the instructions. "If you have encountered this task before, I need you to play the role of the Skeptic. Your job is not to give the answer, but to test whether the others actually feel what you know they should feel."
  *   **If they slip:** Acknowledge it. "You know the mechanism. But do you *feel* the phenomenon? That is what we are investigating."

  **2. Projector Timing Lag**
  *   **Risk:** The grid stays on too long (>500ms), allowing eye movements.
  *   **Fix:** Test the deck on the specific room projector 30 mins prior. Laptop refresh rates vary. If the flash is too slow, admit it. "The technology failed, but notice: even with a longer look, you still couldn't write it all. Why?" (Shifts focus to capacity limits rather than iconic memory).

  **3. Social Convergence on Wagers**
  *   **Risk:** Students look at each other and all bet "High" to fit in.
  *   **Fix:** Make wagering anonymous. "Write your wager on the back of your sheet. Fold it. The Scribe will collect and tally them without names."

  **4. The "Unreliable Reporter"**
  *   **Risk:** A student claims they saw nothing in Round 2 (Cued) despite high accuracy.
  *   **Fix:** Use the Skeptic. "You wrote the row correctly. You claim you didn't see it. How did your hand know?" This forces the distinction between *access* (hand knows) and *introspection* (mind claims ignorance).

  **5. The "Report Paradox" (Your Worry)**
  *   **Risk:** Students argue that if they can't report it, it doesn't count as mental.
  *   **Fix:** This is a feature, not a bug. In the debrief, highlight this. "You have just discovered the hard problem of methodology. If consciousness is defined by report, we can never find unconscious consciousness. But if we define it by feeling, we can never verify it. This is the knot you are here to untie."

  ## 6. Why This Works (Instructor Notes)

  *   **The Gap:** The contrast between Round 1 (Low Report) and Round 2 (High Report) creates the *Access* limit. The feeling that the info was "waiting" in Round 2 creates the *Phenomenal* pull.
  *   **The Decay:** Round 3 proves the buffer is fragile, supporting the Deflationary view (it wasn't stable enough to be 'real' experience).
  *   **The Black Box:** This forces them to confront that they are relying on *testimony* (report) to access another's mind. It mirrors the philosophical problem of other minds.
  *   **The Broadcast:** This stages the functional role of consciousness (Global Workspace) without naming it. It shows that "having" info isn't enough; "sharing" info is what drives action.

  ## 7. What This Activity Cannot Do (Frank Limitations)

  *   **It cannot prove Phenomenal Consciousness exists.** It only proves the *belief* in it exists. A deflationist can argue the "feeling of richness" is itself just a reportable state, not evidence of a rich underlying buffer. You must supply this counter-argument in the debrief.
  *   **It relies on Introspection.** The whole activity asks students to trust their own reports about their own minds. If they are bad introspectors (which they might be), the data is noisy.
  *   **It conflates Memory and Experience.** The 1-second delay in Round 3 could be memory decay, not phenomenal fading. You must acknowledge in the debrief that distinguishing "fading from experience" vs "fading from memory" is the central theoretical battle.

  **Final Instruction:** Do not resolve the tension. If a student asks, "So, which is it?" Your answer is: "That is the syllabus."
