      *   *Refining the Diagnosis:*
          *   The user suspects hypothesis 4 is doing work. I need to expand on that. If the flatmate thinks a life with net suffering is *bad simpliciter*, she isn't doing sum-ranking. She's doing threshold evaluation. This explains the lexical priority.
          *   The "Label" issue: 'Negative Utilitarianism' is a theoretical bucket. In policy (local gov), you never have infinite resources. Lexical priority collapses under scarcity. If suffering is lexically prior, you must solve the worst pain before *any* joy, forever. In practice, she doesn't actually live this way (she eats for pleasure, presumably). So there's a theory/practice gap.

      *   *Defining Progress:*
