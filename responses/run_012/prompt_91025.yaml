answer: |-
  You have correctly identified a gap in the standard "rationalist" toolkit. The standard advice ("taboo your words," "dissolve the question") assumes that once you separate the empirical facts from the definitions, the disagreement vanishes. You are observing that often, **the disagreement over the definition is itself the substantive disagreement.**

  The precise philosophical term for this is **Metalinguistic Negotiation**.

  Here is the breakdown of what this is, how it relates to the concepts you know, where the edges are, and why the standard "verbal dispute" framework often fails to capture it.

  ### 1. The Name: Metalinguistic Negotiation
  Coined prominently by philosophers David Plunkett and Alexis Burgess (building on work by Herman Cappelen and others), a **metalinguistic negotiation** is a dispute that looks like it is about the world (object-level), but is actually about which concepts or words we *should* use to describe the world.

  *   **The Surface:** "Is a virus alive?" (Looks empirical/biological).
  *   **The Reality:** "Should our concept of 'life' include entities that replicate but lack metabolism, given that including them changes how we fund research/treat patents/teach biology?"

  The key insight of this framework is that these disputes are **not trivial**. They are normative disputes about conceptual engineering. The parties aren't confused; they are fighting over which "map" is more useful for their specific navigational goals.

  ### 2. Why the "Verbal Dispute" Framework Fails Here
  In the analytic tradition (and the rationalist sphere), a **Verbal Dispute** is often defined as a disagreement that disappears once terminology is clarified. David Chalmers, in his seminal paper *"Verbal Disputes,"* distinguishes between:
  1.  **Merely Verbal Disputes:** These dissolve upon clarification. (e.g., "Is a hotdog a sandwich?" where both parties agree on the ingredients and just disagree on the label, and the label has no stakes).
  2.  **Substantive Disputes Masked as Verbal:** These persist because the choice of label carries downstream consequences.

  The standard rationalist advice ("just taboo the word") treats all definition disputes as Type 1. You are encountering Type 2. When you taboo the word, the argument doesn't end; it shifts to "Should we create a new category X that includes viruses, or keep category Y that excludes them?" That is a real fight about how to carve reality, not just a confusion about syntax.

  ### 3. Related Concepts & The Edges
  To understand the boundaries of what you're seeing, here are the nearest named neighbors and how they differ:

  **A. Persuasive Definition (C.L. Stevenson)**
  *   **What it is:** Redefining a term to load it with emotional or moral weight to win an argument.
  *   **Relation:** This is the *tactic* used within a metalinguistic negotiation. If someone argues "Taxation is theft" to trigger a negative moral response, they are using a persuasive definition.
  *   **Edge:** A persuasive definition is rhetorical. A metalinguistic negotiation is the *structural state* of the argument. You can have a metalinguistic negotiation without bad faith (e.g., two biologists genuinely disagreeing on the utility of a taxonomy).

  **B. The Noncentral Fallacy (Scott Alexander)**
  *   **What it is:** Arguing that something belongs to a category because it shares features with the prototype, implying it should inherit the prototype's moral valence.
  *   **Relation:** This is a specific species of metalinguistic negotiation common in political discourse.
  *   **Edge:** The Noncentral Fallacy focuses on the *prototype* (the "best example" of the category). Metalinguistic negotiation covers disputes over *boundaries* even when prototypes aren't the focus.

  **C. Equivocation**
  *   **What it is:** A fallacy where a single person uses a word in two different senses within the same argument to deceive or confuse.
  *   **Relation:** Equivocation is usually unintentional or deceptive *within* a speaker.
  *   **Edge:** In your scenario, both speakers are consistent internally; they are clashing *externally*. It is not a fallacy of logic, but a conflict of conceptual schemes.

  **D. Frame Control**
  *   **What it is:** A social dynamic where one party successfully imposes their ontology on the conversation to gain advantage.
  *   **Relation:** This describes the *power dynamic* of the metalinguistic negotiation. As you noted, "whoever's sense wins gets to frame everything downstream."
  *   **Edge:** Frame control is the social maneuvering; metalinguistic negotiation is the philosophical content of the dispute.

  ### 4. Natural Kinds vs. Moral/Legal Terms
  You asked if it matters whether the term is a natural kind ("alive") or a moral/legal term ("coercion").

  **The Short Answer:** Yes, but both are substantive.

  **Natural Kinds (e.g., "Is a virus alive?")**
  *   **The Stake:** Predictive utility and clustering.
  *   **The Fight:** "Does grouping viruses with bacteria help us make better predictions about mutation rates and treatment?"
  *   **Substantiveness:** If the definition change leads to different expectations about the territory, the dispute is empirical/epistemic. If the definition change is purely cosmetic (no predictive difference), it is merely verbal.
  *   **Rationalist View:** This is about "drawing the boundary of a cluster in thingspace." If the cluster doesn't help you compress information or predict features, the dispute is trivial. If it does, it's substantive.

  **Moral/Legal Terms (e.g., "Is this coercion?")**
  *   **The Stake:** Algorithmic triggering and normative force.
  *   **The Fight:** "Does this behavior trigger the 'punishment' algorithm in our legal code?" or "Does this behavior trigger the 'condemnation' algorithm in our moral psychology?"
  *   **Substantiveness:** These are almost always substantive because the *function* of moral/legal language is to guide action, not just describe physics. Redefining "coercion" changes who goes to jail.
  *   **Rationalist View:** This is often where "Taboo Your Words" fails hardest. You cannot taboo "coercion" and expect the disagreement to vanish, because the disagreement *is* about which actions should be prohibited.

  ### 5. Summary of the Landscape
  *   **If the disagreement vanishes** when you clarify definitions $\rightarrow$ **Merely Verbal Dispute.** (Standard rationalist advice applies).
  *   **If the disagreement persists** as a fight over which definition is more *useful*, *moral*, or *predictive* $\rightarrow$ **Metalinguistic Negotiation.** (Standard advice fails; you need Conceptual Engineering).
  *   **If one party is secretly switching definitions** to win $\rightarrow$ **Equivocation.**
  *   **If one party is trying to load the definition** with emotional valence $\rightarrow$ **Persuasive Definition.**

  ### 6. How to Handle It (Beyond "Taboo")
  Since you are a rationalist lurker, you likely want to know how to process this, not just name it. When you identify a Metalinguistic Negotiation:

  1.  **Don't Dissolve, Engineer:** Do not ask "What is the true meaning?" Ask "What meaning is most *useful* for our current goals?" (This is the Carnapian approach to explication).
  2.  **Expose the Downstream:** Explicitly state the stakes. "You want to define 'alive' this way because it grants viruses patent protection. I want to define it that way because it clarifies metabolic study. Let's argue about the patents/study, not the word."
  3.  **Check the Carving:** For natural kinds, ask "Which definition creates a cluster with higher inductive potential?" For moral terms, ask "Which definition triggers the correct moral algorithm for human flourishing?"

  **Conclusion:**
  You have identified **Metalinguistic Negotiation**. It is a substantive dispute about conceptual geography that the standard "verbal dispute" framework often misclassifies as trivial. It matters deeply for both natural kinds (predictive power) and moral terms (normative force), and recognizing it prevents you from prematurely dissolving questions that actually need to be fought.
