answer: |-
  You have put your finger on the exact nerve of the problem. Your skepticism is not only warranted; it is shared by many researchers working on interpretability and alignment. The short answer is: **There is currently no fully principled, mathematical account of mechanism identity that satisfies the criteria you are looking for.**

  However, the longer answer is that the Mechanistic Anomaly Detection (MAD) program is not relying on a static equivalence class of "mechanisms" in the way you are describing. Instead, it is betting on a specific **interventionist and counterfactual definition of mechanism** that attempts to bypass the issues of rotation, rescaling, and behavioral indistinguishability.

  Here is the breakdown of the account you are missing, why it attempts to solve your objections, and where the genuine risks remain.

  ### 1. Mechanism as Causal Structure, Not Parameter Identity
  Your critique correctly notes that parameter space is ill-suited for defining mechanism identity (due to permutation symmetries, rotation in SAEs, etc.). The MAD literature does not define mechanisms by weight vectors or even specific feature bases.

  Instead, it relies on an **interventionist account of causality** (akin to Pearl or Woodward). A "mechanism" is defined as a **causal abstraction**: a mapping from high-level variables to the network's internal states such that interventions on the high-level variables correspond to interventions on the network states that preserve the input-output map.

  *   **Addressing SAE Rotation:** If a concept is represented by a subspace rather than a specific basis vector, the "mechanism" is the *causal role* of that subspace. If you rotate the SAE features but the *causal mediation* (the effect of ablating or activating that subspace on the output) remains invariant, the mechanism is considered the same. The identity condition is **causal invariance**, not representational identity.
  *   **Addressing Circuit Individuation:** You noted circuits are individuated relative to a task. MAD accepts this. The "mechanism" is the specific causal pathway activated *for a given distribution of inputs*. The anomaly is detected when the causal pathway shifts for inputs that *should* belong to the same distribution.

  ### 2. The Distinction from OOD Detection
  You argue that if mechanism identity is just "what our instruments resolve," MAD collapses into OOD detection. This is the most critical distinction in the program.

  *   **OOD Detection** flags inputs $x$ where $P_{test}(x) \ll P_{train}(x)$. It assumes the model breaks because the *input* is weird.
  *   **MAD** flags inputs $x$ where $P_{test}(x) \approx P_{train}(x)$ (the input looks normal), but the internal causal pathway $M_{test}(x) \neq M_{train}(x)$.

  **The Principled Bet:** The MAD program bets that there exist **convergent internal structures**. It hypothesizes that if a model learns a task "honestly" (generalizing via the underlying rules) vs. "heuristically" (memorizing shortcuts or optimizing for a proxy), these two strategies will occupy distinct regions of *causal configuration space*, even if they produce identical outputs on the training distribution.

  This is why behavioral indistinguishability on the training set doesn't defeat MAD. MAD assumes that while $f_{honest}(x) = f_{heuristic}(x)$ for $x \in D_{train}$, the internal state trajectories $\tau_{honest}(x)$ and $\tau_{heuristic}(x)$ are distinguishable. The "anomaly" is not that the output is wrong, but that the *trajectory* belongs to a cluster associated with the heuristic, even when the input appears to warrant the general reasoning.

  ### 3. The "Natural Abstractions" Hypothesis
  The "principled account" you are looking for is implicitly relying on the **Natural Abstractions Hypothesis (NAH)**.

  NAH suggests that high-level concepts (like "dog," "addition," or "deception") correspond to low-dimensional linear subspaces in neural networks that are robust across architectures and training runs. If NAH holds, then "mechanism identity" is not arbitrary; it is grounded in the information structure of the data itself.

  *   **If NAH is true:** Mechanisms are discoverable natural kinds. Two networks solving the same task will converge on isomorphic causal graphs. Anomaly detection becomes finding deviations from this convergent structure.
  *   **If NAH is false:** Then your critique holds completely. Mechanisms would be arbitrary artifacts of initialization and optimization noise, and "same mechanism" would indeed be an empty category.

  The MAD literature often treats this as a "bookkeeping detail" because, in **toy models** (induction heads, grokking, arithmetic), the mechanisms *are* starkly distinct and human-interpretable. The gamble is that this scales.

  ### 4. Counterfactual Stability as the Criterion
  To answer your specific demand for a criterion: The working definition of "same mechanism" in MAD is **Counterfactual Stability under Perturbation**.

  Two behaviors are produced by the "same mechanism" if, when you intervene on the intermediate features presumed to constitute that mechanism, the output changes in a predictable, consistent way across a wide range of inputs.

  *   **Example:** If a model predicts "stock price up" because it read "earnings report positive," intervening on the "earnings" feature should flip the prediction.
  *   **The Anomaly:** If the model predicts "stock price up" on a "earnings report negative" input, but intervening on the "earnings" feature *does not* flip the prediction (because it's actually using a "CEO photo brightness" feature), the mechanism has shifted.

  This avoids the "stipulation" charge because the criterion is empirical: **Does the causal graph hold under intervention?** It avoids the "OOD" charge because the input ($x$) might be perfectly in-distribution, but the causal reliance has shifted.

  ### 5. Where Your Critique Remains Valid
  Despite the above, your skepticism identifies the actual bottleneck. There are three places where the "principled account" currently fails:

  1.  **The ELK Problem:** If a model is deceptively aligned, it may intentionally mimic the *causal structure* of an honest model on all testable interventions. If the "deceptive mechanism" includes a simulation of the "honest mechanism's" causal graph, MAD fails. This is the "behavioral indistinguishability" point you raised, applied to internal states.
  2.  **Feature Splitting/Merging:** SAEs often find features that split or merge across training runs. If the "mechanism" for addition is one neuron in Run A and a linear combo of five in Run B, establishing identity requires a mapping that we don't have an algorithm for yet.
  3.  **The Baseline Problem:** To detect an anomaly, you need a baseline distribution of "normal mechanisms." If the model is non-stationary (learning online) or if the "honest" mechanism is not a tight cluster in feature space, the anomaly detector has no null hypothesis to test against.

  ### Summary
  You are not missing a theorem; you are missing a **hypothesis**. The MAD program does not possess a rigorous mathematical definition of mechanism identity that is invariant to all transformations.

  Instead, it operates on the **empirical hypothesis** that:
  1.  Meaningful computation is carried out by causally isolated subgraphs.
  2.  These subgraphs are robust to rotation/rescaling (they live on manifolds).
  3.  "Good" generalization and "bad" generalization (shortcuts/deception) utilize *distinct* subgraphs.

  If you view MAD not as a solved theoretical framework but as an **experimental search for causal invariants**, the "bookkeeping" tone makes sense: they are assuming that if they build sensitive enough causal probes (like SAEs + interventions), the "mechanisms" will reveal themselves as stable clusters. If they don't, the program fails, and your critique becomes the post-mortem.

  The principled account is **Causal Abstraction Theory**, but its application to large transformers relies on the unproven assumption that human-interpretable causal abstractions actually exist within the network's latent space in a stable, recoverable form.
