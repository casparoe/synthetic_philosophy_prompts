answer: |-
  You are asking for a normative map of a new social terrain, and you are right to treat these micro-norms seriously. They are often harder to integrate than the "big" cultural values because they are implicit, unspoken, and enforced by social friction rather than law.

  Since you didn't name the country, I am making an educated inference based on your description (likely Northern/Central Europe or Japan/Singapore). I will flag where this uncertainty limits my certainty.

  Here is my reading of the presuppositions, followed by my verdict on your obligations.

  ### 1. Tipping: The Wage Contract
  **Your Options:** A) It presupposes the menu price is the whole price and wages are the employer's obligation. B) It is just a convention with no theory.
  **My Verdict:** **Reading A is correct.** This is not merely convention; it is a structural view of the economic transaction.

  **Reasoning:** In mandatory tipping cultures (like the US), the tip is a subsidy the customer provides to the employer to ensure the staff is paid. In no-tip cultures, the social contract presupposes that the price of the good includes the cost of its provision, *including* the labor at a dignified rate. When you tip aggressively in these environments, you are not being "generous"; you are implicitly accusing the establishment of underpaying its staff or suggesting that the staff is dependent on your charity rather than their contract. It disrupts the professional distance.

  **Where I'm guessing:** I am assuming the local labor laws actually support this (i.e., that service staff are paid a living wage). If they aren't, then the no-tipping rule is just exploitation masked as culture. But given the "weird looks" you describe, I assume the social norm is backed by a wage structure.

  **Are you bound by it?** **Yes.** You are not a tourist; you are a resident. Tipping 20% here doesn't make you a "good person"; it marks you as someone who doesn't understand the local economic dignity.
  *   **Action:** Do not tip percentage-based. If you want to show appreciation, round up to the nearest convenient note or leave small change. Anything more risks making the server uncomfortable or signaling that you view them as subordinate.

  ### 2. The Red Light: The Coordination Device
  **Your Options:** A) A law serving no purpose generates no reason. B) It is a coordination device whose value is uniformity.
  **My Verdict:** **Reading B is correct.** The "law generates no reason" theory fails because people are actively policing you with looks. If it were purely about individual utility (safety), they wouldn't care what you did.

  **Reasoning:** This is about *civic legibility*. In high-trust societies, rule-following at 6 AM is a signal that you are a reliable participant in the social contract. It presupposes that the value of the rule isn't the immediate outcome (not getting hit by a car), but the maintenance of the habit. If everyone decides for themselves when a rule is "pointless," the coordination breaks down. The "look" you get is a sanction for signaling that you are an unreliable agent.

  **Where I'm guessing:** I am assuming this is a high-trust society. In low-trust societies, red lights are ignored because the system is broken. The fact that people wait implies trust in the system.

  **Are you bound by it?** **Yes, absolutely.** This is the highest stakes of the three examples. Jaywalking as a tourist is a minor faux pas; jaywalking as a new resident signals that you do not intend to integrate into the civic fabric. You are on the hook *more* because you live there. You are now a stakeholder in the coordination.
  *   **Action:** Wait for the green man. Even at 6 AM. Even if you are late. The cost is 30 seconds; the benefit is signaling you are a rule-abiding neighbor.

  ### 3. The Queue: Pragmatic Technology (No Deep Philosophy)
  **Your Options:** A) Queue place is property. B) Queues are fair because they are blind.
  **My Verdict:** **Flag: You are reading too much theory into this.** This practice is doing no philosophical work. It is **pragmatic social technology.**

  **Reasoning:** The bakery and the kiosk are different games.
  *   **The Bakery:** The ticket system is an efficiency algorithm designed to remove ambiguity in a low-stakes, high-trust environment. The "cough" isn't about property rights; it's a low-cost enforcement mechanism to prevent friction without confrontation. It presupposes that *ambiguity* is the enemy, not necessarily "fairness" in the abstract.
  *   **The Kiosk:** The shoving indicates a shift in context. High stress, scarcity, or perhaps a transient population (travelers) where social sanctions (the cough) don't work.
  *   **Why it's not philosophy:** If this were a deep moral principle about "queue place as property," it would apply consistently. The fact that it vanishes at the kiosk proves it is a local heuristic for managing flow, not a moral truth.

  **Are you bound by it?** **Yes, but contextually.** You are bound by the *local algorithm*, not a universal rule of queuing.
  *   **Action:** In the bakery, take the ticket. If you only want bread and the counter is free, watch the person ahead of you. If they take a ticket, you take a ticket. If they walk up, you walk up. At the kiosk, abandon your home-country queue ethics and adopt local aggression, or you will never buy a train ticket. Do not try to impose "fairness" on a system that operates on "assertiveness."

  ### Summary: The "Guest" vs. "Resident" Obligation
  You asked if you are off the hook because you are a guest. **You are not a guest.** You moved there for a job.

  *   **Tourists** are granted epistemic exemption. We forgive them for jaywalking or overtipping because we assume they will leave and their behavior won't degrade the local system long-term.
  *   **Residents** are participants. Your behavior contributes to the maintenance or erosion of these norms.

  **The Verdict:**
  1.  **Tipping:** Stop. It insults the wage structure. (Reading: Economic Contract).
  2.  **Red Light:** Wait. It signals civic trust. (Reading: Coordination Device).
  3.  **Queueing:** Mimic. It is functional, not moral. (Reading: Pragmatic Technology).

  You are overreading the queue, but you are underreading the red light. The light isn't about safety; it's about belonging. The tip isn't about generosity; it's about contract. Adjust accordingly.
