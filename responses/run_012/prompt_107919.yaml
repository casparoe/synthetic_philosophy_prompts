  I filled out the pain questionnaire: "Intensity: 10," "Unpleasantness: 0." The philosopher marked it "Contradiction." I wrote in the margin: "Please specify which definition of pain you are purchasing."

  This punchline depends on the clause describing the dilemma: "If pain is by definition unpleasant... then these patients are not in pain at all... If instead the sensory signal is what makes a state pain, then there is pain that is not bad." The joke treats the definition as an arbitrary choice ("purchasing") forced by the condition's split between sensation and suffering. For the joke to stop working, pain asymbolia would have to involve the loss of sensory intensity (analgesia) rather than the loss of unpleasantness, or the philosophical definition of pain would need to universally agree on only one dimension.
