      *   **Address the Bias:** This is the critical insight. The vigilance issue is worse than the rounding issue. It invalidates the causal inference regardless of the math used for updating.
      *   **Actionable Fix:** Stop logging "Migraine vs. Not." Log specific symptoms (binary or scale). Define "Migraine" algorithmically *after* data collection. This decouples the classification from the dairy-induced vigilance.

