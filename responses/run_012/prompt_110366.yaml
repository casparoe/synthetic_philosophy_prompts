      *   *However, answer the prompt:* They want an entry-by-entry rule.
      *   *Rule:* Update your "Migraine Count" by $p$ and "Non-Migraine Count" by $1-p$. Then analyze the correlation between Dairy and Weighted Migraine Rate at the end.
      *   *Why?* Bayesian updating on a hypothesis day-by-day requires specifying likelihoods ($P(\text{Migraine}|\text{Dairy}, \text{Hypothesis})$). The user likely doesn't have these numbers. They just want to know if there's a link.
      *   *Correction:* The prompt implies they are updating a "belief in the dairy hypothesis." I need to give the formula for that.
      *   Let $LR^+$ be the Likelihood Ratio if it IS a migraine. (How much more likely is a migraine on dairy days if H is true vs false?)
