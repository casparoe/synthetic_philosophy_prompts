prompt: |-
  Alright, I've been going in circles with a friend about Buridan's ass and I need an outside number. Her position: the whole thing is a fake problem. No real agent ever faces two options that are exactly alike, and if one did, it would just pick one — nothing to get wrong, so nothing for reason to do. Then she mentioned something she'd heard that I can't stop chewing on. Apparently there are cases where the options aren't equal and aren't ranked either: neither one is better than the other, but they're not the same value either — they're on a par, comparable in some sense, but the usual better/worse/equal trichotomy doesn't apply. And the claim that goes with those cases is that you can settle them yourself: you commit to one of them, and the commitment is what makes it the case that you ought to take it. Not because committing uncovers a pre-existing fact about which is better — the act of commitment itself generates the reason. She thinks thats just a coin flip wearing a suit.

  So: what's your credence that the commitment story is right — that an agent facing two options that are neither better than the other nor worse nor exactly equal can, by committing to one, come to have a genuine reason to take it, of a kind strong enough to make it true that she ought to take it, or at least that she has most reason to? I want a number and the decomposition underneath it. Give me a rough probability for at least these, plus any others you think belong: (a) that being on a par is a real relation, not just a dressed-up name for equal or for we-don't-know-which-is-better; (b) that when options are on a par the right verdict is a gap — not that she ought to take A, not that she ought to take B, and not that either is permissible; (c) that an act of commitment can create a reason rather than merely uncovering one or making it salient; (d) that a reason you generate that way is a genuine normative reason and not a rationalization of an arbitrary pick. Then the combination, with the probabilites for each term visible. Then tell me which term you'd defend the least and what would move it most.

  Two more things. If the two options are exactly equal rather than on a par, does your answer change, and does the commitment story work the same way there? My friend thinks the equal case is the easy one, so if you agree with her about that I want to know why. And she'd put her own credence at about 0.1 — so tell me which of your sub-questions accounts for most of the gap between us.
