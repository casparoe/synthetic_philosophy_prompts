      *   *Severe (but maybe absorbable):* Radical Underdetermination. If the mapping isn't one-to-one even with priors, the "identification" claim is weak.
      *   *Awkward (absorbable):* Bounded rationality, noise, framing. These just make the "footprint" muddy, not non-existent.

