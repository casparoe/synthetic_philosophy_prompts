      *   *Preference Construction:* Psychology shows preferences are often created *during* choice, not retrieved.
          *   *Defender view:* This is the hardest hit. If there's no pre-existing state, what is the footprint of?
      *   *Welfare/Normativity:* If we infer preferences from bad habits (addiction), do we really want to call that "true preference"?
          *   *Defender view:* Distinction between "decision utility" and "experienced utility."
      *   *Unfalsifiability:* If every behavior can be rationalized by *some* utility function (e.g., "they wanted to do exactly that"), is the theory empty?
