      *   **Constraint 1 (Crucial):** Focus on defeaters a *committed defender* would concede, not just standard critic arguments. This means looking for internal tensions, limits of the theory that even proponents admit, rather than external rejections.
      *   **Constraint 2:** Address specific sub-questions:
          *   Underdetermination (technical vs. fatal).
          *   Bounded rationality/habit/inconsistency (complication vs. refutation).
          *   Preference construction/reversals/framing (does the view lose content?).
      *   **Constraint 3:** Sort defeaters from "Fatal" to "Merely Awkward."
      *   **Constraint 4:** Indicate which can be absorbed by amendment.
      *   **Constraint 5:** Give an honest verdict on unfalsifiability and whether that's a defect.

  2.  **Deconstruct the Core Thesis (Preference Realism/Revealed Preference Ontology):**
      *   The view is essentially a sophisticated version of Revealed Preference Theory (RPT) but with an ontological commitment (mental states exist) rather than just instrumentalism (preferences are *as if* constructs).
      *   Analogy: Footprint $\rightarrow$ Foot. Behavior $\rightarrow$ Preference.
      *   Key assumption: Optimality (the agent is trying to maximize something).

  3.  **Brainstorming Defeaters (filtering for "Defender Concession"):**

      *   *Underdetermination:* Many reward functions can explain the same behavior (Inverse Reinforcement Learning problem).
          *   *Defender view:* Usually handled by priors (Occam's razor). Is this a concession? Yes, that uniqueness is lost without priors.
      *   *Bounded Rationality:* Agents aren't perfect optimizers. They use heuristics.
