          *   Can either concede it's verbal? If Ctx concedes, they lose the claim to capturing the *concept* of knowledge. If SSI concedes, they admit "knows" is ambiguous.
      *   **Closing:** One consideration the other can't accommodate.
          *   Mara to Sofia: You can't explain why the subject herself stops claiming knowledge when her stakes rise (if she is the attributor). Wait, if she is the attributor, her context rises. Ctx handles that.
          *   Better: Mara to Sofia: You can't explain why knowledge seems to guide action directly.
          *   Sofia to Mara: You can't explain why we feel comfortable attributing knowledge to high-stakes subjects when we (attributors) are in low-stakes contexts (Case 2). Wait, SSI says that's False. Sofia says that's the intuition we need to save.
          *   Let's refine the "Killer Argument."
          *   Mara's kicker: The connection between knowledge and action (Knowledge Norm of Assertion/Action).
          *   Sofia's kicker: The data of ordinary language usage across different conversational contexts (the variability of intuitions).

  4.  **Refining the Dialogue Flow:**

      *   *Opening:* Mara and Sofia reviewing the cases.
      *   *Case 1 (Ines/Tomas):* Mara: True (Ines knows). Sofia: False (Tomas's standards are high).
      *   *Case 2 (Priya/Lena):* Mara: False (Priya doesn't know). Sofia: True (Lena's standards are low).
      *   *The Pattern:* They agree on Low/Low and High/High. They cross on the mixed cases.
