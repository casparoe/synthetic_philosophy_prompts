          *   Refinement: The prompt asks: "What each view says about a subject who is in a high-stakes situation without realizing it."
          *   Mara (SSI): High stakes = no knowledge. Period.
          *   Sofia (Ctx): Contextualism is about the *attributor's* context. The subject's awareness is less central to the semantics of "knows," but if the attributor is assessing the subject, does the subject's ignorance matter? Standard Ctx says the *attributor's* context determines the truth conditions. So if I (low stakes) say of the unaware high-stakes subject "She knows," it's true. But Mara will press on the *subject's* rationality.
      *   **False vs. Misleading (Tomas's Utterance):**
          *   Wait, in Case 1, Mara (SSI) says Tomas is *True*. Sofia (Ctx) says Tomas is *False*.
          *   The prompt asks: "Whether Tomas's attribution is better described as false or as true but misleading on the first view [SSI]."
