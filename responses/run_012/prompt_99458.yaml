          *   Ah, I need to check the intuition. Tomas is high stakes. He says "She knows." Intuitively, this feels risky/wrong because he's betting his mother's life on it.
          *   SSI says Ines *does* know (her stakes are low). So Tomas speaks the truth.
          *   Why might it feel amiss? Because Tomas is *acting* as if the stakes are low for *him*, but they aren't. Or he is implying *he* can rely on it.
          *   Mara needs to explain why it feels wrong even if true. (Implicature).
      *   **Substantive vs. Verbal:**
