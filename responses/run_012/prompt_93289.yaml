answer: |-
  **Examination Question**

  **Course:** Decision Theory and the Philosophy of Probability
  **Time Allowed:** 45 Minutes
  **Total Marks:** 25

  **Question 1**

  Consider the standard St. Petersburg game: a fair coin is tossed until it first lands tails. If the first tails appears on toss $n$, the monetary payout is $£2^n$. The expected monetary value of this game is infinite.

  Now consider an *Accelerated St. Petersburg game* with the same probabilities, but where the payout on first tails at toss $n$ is $£2^{(2^n)}$.

  (a) Explain precisely what normative conflict is generated by the infinite expected monetary value of the standard game, and clarify what this infinity does *not* logically entail regarding the coherence of the game itself. (5 marks)

  (b) A common resolution appeals to the diminishing marginal utility of money, often modelled by a logarithmic utility function $U(x) = \log(x)$. Explain how this resolves the standard game. Then, argue why this resolution merely relocates the problem rather than solving it, unless a further substantive assumption is made about the nature of utility. (5 marks)

  (c) Calculate the expected utility of the *Accelerated* game assuming the agent has logarithmic utility $U(x) = \log(x)$. Does the diminishing marginal utility resolution hold in this case? What does this imply about the relationship between payoff growth rates and utility growth rates? (10 marks)

  (d) State the general condition required of a utility function to ensure that expected utility remains finite for *any* possible St. Petersburg-style game, regardless of how fast the payoffs accelerate. Assess the plausibility of this condition. (5 marks)

  ***

  **Model Answer**

  (a) The infinite expected monetary value generates a conflict between the principle of maximizing expected value and intuitive judgements about rational pricing. If expected value dictates rational choice, an agent should be willing to pay any finite sum to play the standard game, since the expected return exceeds any finite cost. This conflicts with the observation that no rational agent would pay a very large sum (e.g., £1,000) for a ticket where the most likely outcome is a payout of £2 or £4. However, the infinite expectation does not entail that the game is mathematically incoherent or impossible to play. The series diverges, but each individual term is well-defined. The conflict is normative, concerning what one *ought* to pay, not logical, concerning whether the game can exist.

  (b) Introducing a concave utility function, such as $U(x) = \log(x)$, resolves the standard game by transforming the payout sequence. For a payout of $2^n$, the utility is $\log(2^n) = n \log 2$. The expected utility becomes the sum of $(1/2^n) \cdot n \log 2$. Because the probability term $(1/2^n)$ shrinks faster than the utility term ($n$) grows, this series converges to a finite value. This suggests a finite rational entry price.

  However, this is not a logical dissolution of the paradox but a substantive assumption about psychological valuation. It relocates the problem from monetary value to utility value. By asserting utility is logarithmic, we assume a specific growth rate. Unless we assume utility *must* grow slowly relative to probability, the paradox remains latent. If payoffs grow faster than utility shrinks in probability-weighted terms, the expected utility will diverge again. Thus, the logarithmic fix is contingent on the payoff structure, not a universal shield against infinite expectation.

  (c) In the Accelerated game, the payout at toss $n$ is $2^{(2^n)}$. Applying logarithmic utility:
  $$U(\text{payout}) = \log(2^{(2^n)}) = 2^n \log 2$$
  The probability of reaching toss $n$ is $(1/2)^n$. The expected utility is the sum over $n$ of:
  $$P(n) \cdot U(\text{payout}) = \left(\frac{1}{2}\right)^n \cdot (2^n \log 2) = \left(\frac{2^n}{2^n}\right) \log 2 = \log 2$$
  Summing this constant term $\log 2$ from $n=1$ to infinity yields infinity. Therefore, the expected utility of the Accelerated game is infinite, even with logarithmic utility.

  This demonstrates that any specific unbounded utility function can be defeated by a sufficiently fast-growing payoff sequence. The relationship is a race between the decay of probability and the growth of utility. In the standard game, logarithmic utility wins; in the Accelerated game, the payoff growth outpaces the utility compression. This implies that diminishing marginal utility alone is insufficient to guarantee finite expected utility universally; it only works for games where payoffs do not outstrip the specific utility function chosen.

  (d) To ensure expected utility remains finite for *any* conceivable St. Petersburg-style game, the utility function must be **bounded above**. There must exist some maximum value $M$ such that $U(x) < M$ for all monetary amounts $x$. If utility is bounded, the expected utility cannot exceed $M$, regardless of the payoff sequence or probabilities.

  The plausibility of this condition is questionable. Bounded utility implies that beyond a certain wealth level, additional money yields zero (or negligible) additional utility. While psychologically plausible that excitement saturates, normatively it implies counter-intuitive preferences. An agent with bounded utility would prefer a guaranteed finite sum over a gamble offering a tiny probability of a vastly larger sum, even if the larger sum is astronomically higher. This violates the principle that more money is always preferable to less (monotonicity), creating a new paradox where agents become indifferent between millions and trillions. Thus, while boundedness solves the mathematical divergence, it introduces significant philosophical costs regarding rational preference.

  ***

  **Marking Scheme**

  **Total Marks: 25**

  **Part (a): The Normative Conflict (5 Marks)**
  *   **2 Marks:** Identifies the conflict between Expected Value Maximisation and intuitive rational pricing (willingness to pay).
  *   **2 Marks:** Clarifies that infinite EV does not imply mathematical incoherence or impossibility of the game.
  *   **1 Mark:** Clear distinction between normative (ought) and logical (can) issues.
  *   *Penalty:* Deduct 2 marks if the candidate claims the game is mathematically impossible or logically contradictory due to infinity. Deduct 1 mark for vague references to "risk" without mentioning expected value.

  **Part (b): Diminishing Marginal Utility & Relocation (5 Marks)**
  *   **2 Marks:** Correctly explains convergence of standard game under $U(x)=\log(x)$ (probability decays faster than linear utility growth).
  *   **2 Marks:** Argues that DMU is a substantive assumption about the agent, not a logical necessity.
  *   **1 Mark:** Explicitly states the problem is "relocated" (to justifying the specific utility function) rather than removed.
  *   *Penalty:* Deduct 3 marks if the candidate treats logarithmic utility as the definitive "solution" without critiquing its assumptions. Deduct 1 mark for confusing utility with probability.

  **Part (c): The Accelerated Game Analysis (10 Marks)**
  *   **4 Marks:** Correct calculation showing $U(\text{payout}) = 2^n \log 2$ and $E[U] = \sum \log 2 = \infty$.
  *   **3 Marks:** Conclusion that logarithmic utility fails to tame the Accelerated game.
  *   **3 Marks:** General insight: Any unbounded utility function can be outrun by sufficiently fast payoff growth (the "race" between probability decay and utility growth).
  *   *Penalty:* Deduct 4 marks for mathematical error in the exponent algebra. Deduct 3 marks if the candidate claims log utility solves the Accelerated game. Deduct 2 marks for failing to generalize the insight to *any* unbounded function.

  **Part (d): Boundedness and Plausibility (5 Marks)**
  *   **2 Marks:** Identifies **bounded utility** as the necessary general condition.
  *   **2 Marks:** Explains why boundedness guarantees finite expectation (expectation cannot exceed the bound).
  *   **1 Mark:** Assessment of plausibility (e.g., violates monotonicity or implies saturation/indifference at high stakes).
  *   *Penalty:* Deduct 3 marks if the candidate suggests "risk aversion" generally instead of strict boundedness. Deduct 1 mark for failing to mention the counter-intuitive implications of bounded utility (e.g., indifference between huge sums).

  **General Penalties**
  *   **Citations:** Deduct 5 marks if the answer relies on named authors or specific literature (e.g., "Bernoulli argued...").
  *   **Word Count:** No penalty for slight deviations, but answers significantly under 500 words likely lack necessary depth for full marks in Part (c) and (d).
