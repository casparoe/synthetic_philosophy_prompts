      *   *Knowledge Variant:*
          *   "It's raining but I don't know it."
          *   Suggests the norm might be Knowledge, not Truth.
          *   If "Truth" is the aim, Knowledge is just True Belief + X. Does the slogan need to change to "Belief aims at Knowledge"? Or is Truth the constitutive aim and Knowledge the success condition?

