          *   Test Cases: Handles Omission/Commission symmetry well. Handles 1st/3rd person? Maybe not fully (norm applies to all believers). Handles Knowledge? Maybe pushes towards truth, not knowledge.

      *   *Reading 3: The Deliberative Constraint (Transparency).* When I deliberate on whether to believe $p$, I must consider only whether $p$ is true.
          *   Type: First-person procedural norm.
          *   Moore's Paradox: Strong explanation. I can't assert $p$ (inviting belief) while signaling I haven't satisfied the condition for belief.
          *   Test Cases: Explains 1st/3rd person asymmetry perfectly (I don't deliberate on your beliefs). Explains Omission/Commission (both violate the link between truth and belief). Knowledge variant? Truth is the aim, knowledge is the success.

      *   *Reading 4: The Normative Obligation (Doxastic Ought).* One *ought* to believe $p$ iff $p$ is true.
          *   Type: Moral/Rational obligation.
          *   Moore's Paradox: Asserting you violate the ought creates pragmatic tension.
          *   Test Cases: "Ought implies can" problems. If I can't help believing, is it absurd? 1st/3rd person asymmetry weak (you ought to believe truth too).

      *   *Reading 5: The Conceptual/Teleological Essence.* The *concept* of belief includes truth-directedness. To attribute belief is to attribute a truth-aimed state.
          *   Type: Conceptual truth / Metaphysical claim.
          *   Moore's Paradox: Asserting $p$ expresses belief. Denying belief denies the state expressed. Contradiction in attitude, not content.
          *   Test Cases: Strong on asymmetry (self-ascription vs other-ascription). Strong on Omission/Commission.

  4.  **Refining the Test Case Analysis:**
      *   *Omission ($p \land \neg Bp$) vs. Commission ($Bp \land \neg p$):*
