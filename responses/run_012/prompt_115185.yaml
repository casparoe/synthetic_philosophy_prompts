answer: |-
  This is a classic "reflective equilibrium" puzzle, and your intuitions are remarkably stable even where they contradict standard textbook categories. You aren't a closet retributivist or consequentialist; you are a **pluralist with a specific hierarchy of constraints.**

  If we formalize your eight verdicts, they don't fit on a single line (like "more harm = more punishment"). They fit into a **Three-Gate Structure**. I call this the **Principle of Valid Communicative Censure**.

  Here is the principle broken into its operational clauses, how it maps to your cases, where it breaks, and what it predicts for your new scenarios.

  ### The Principle: Valid Communicative Censure

  **Core Idea:** Punishment is not just pain inflicted for bad acts; it is a *moral conversation* between the state and the agent. For the conversation to be valid, three conditions must be met: The Message must be true, the Receiver must exist, and the Timing must be relevant.

  **Clause 1: The Truth Condition (Liability)**
  *   **Rule:** You cannot censure someone for a wrong they did not commit, nor under rules that did not exist.
  *   **Motivation:** Punishment asserts a moral truth ("You violated X"). If that assertion is false, the punishment is a lie.
  *   **Captures:**
      *   **Case 4 (Innocent Scapegoat):** The message is false. Fails immediately.
      *   **Case 8 (Ex Post Facto):** The rule wasn't "live" at the time of agency. The message is anachronistic. Fails immediately.
      *   **Case 7 (Negligence vs. Intent):** The content of the message differs. "You were careless" is a different moral assertion than "You chose evil." The severity of censure must match the gravity of the assertion.

  **Clause 2: The Receiver Condition (Identity & Capacity)**
  *   **Rule:** Censure must be directed at the *same moral agent* who committed the act. If that agent no longer exists, or if the censure can no longer be understood as relevant, the justification decays.
  *   **Motivation:** You cannot have a conversation with a ghost or a stranger.
  *   **Captures:**
      *   **Case 6 (Head Injury/Personhood Change):** The biological human is present, but the *moral agent* (the personality/character that chose the crime) is gone. Censure is misdirected. *However*, incapacitation is permitted because it is not "censure" (punishment) but "quarantine" (safety).
      *   **Case 5 (Old Man/Late Discovery):** The moral agent is technically the same, but the *social relevance* of the censure has evaporated. 45 years of decent living has "spoken" a counter-message that drowns out the state's censure. Punishment becomes noise, not communication.

  **Clause 3: The Content Condition (Harm vs. Risk)**
  *   **Rule:** The severity of censure scales with the *wrongfulness of the choice*, but is aggravated by *actualized harm* ONLY IF the harm was the specific object of the prohibition.
  *   **Motivation:** Some laws prohibit *results* (Murder); some prohibit *conduct/risks* (Endangerment). Luck matters only when the law is designed to track the result.
  *   **Captures:**
      *   **Case 2 (Drunk Driver):** The law prohibits the *risk* (drunk driving). The death is a tragic byproduct. Censure focuses on the choice to drive drunk. Outcome luck adds a "hair" of severity (because a child died), but the core wrong is the driving.
      *   **Case 3 (Bomb):** The law prohibits *terror/destruction*. By planting the bomb, the agent completed the act of terror. The mechanical failure is irrelevant to the moral assertion of "I am a terrorist." Censure is maxed out at the attempt.
      *   **Case 1 (Shooter):** *Here is the friction.* The law prohibits *killing*. The death completes the specific normative violation intended.

  ---

  ### The Fracture Point: Where the Theory Creaks

  You asked me to tell you which verdict this forces you to give up. The tension is between **Case 1 (Shooter)** and **Case 3 (Bomber)**.

  Under **Clause 3**, these two cases should be treated identically.
  *   In **Case 1**, the agent intended death. Death occurred.
  *   In **Case 3**, the agent intended death/destruction. Death/destruction did *not* occur.

  Your intuition:
  *   **Case 1:** Punish the killer *more* than the attempter. (Outcome luck counts).
  *   **Case 3:** Punish the bomber *the same* as if it went off. (Outcome luck doesn't count).

  **The Contradiction:** Both are specific-intent homicides. Why does the bullet glancing off a rib (Case 1) mitigate culpability more than faulty wiring (Case 3)?
  *   *Possible Defense:* You view the Bomb as a *public endangerment* crime (like the Drunk Driver), where the terror is the harm. You view the Shooting as a *private homicide* crime, where the death is the harm.
  *   *The Cost:* If you keep this distinction, you must admit that your theory relies on a **categorical distinction between "Public Terror" and "Private Violence"** that isn't philosophically robust. A bomb that doesn't go off kills no one; a bullet that glances off kills no one.

  **The Verdict to Sacrifice:** To make the theory coherent, you must align **Case 1** with **Case 3**.
  *   **Option A (The Retributive Consistency):** Punish the attempted shooter the *same* as the successful shooter. (Aligns with Case 3).
  *   **Option B (The Harm Consistency):** Punish the failed bomber *less* than the successful bomber. (Aligns with Case 1).

  Given your verdict on **Case 2** (Drunk Driver), where you minimize outcome luck, **Option A** fits your broader pattern better. You generally believe culpability lies in the *choice*, not the *coin flip*. Case 1 is the outlier, likely driven by an emotional reaction to the victim's family rather than the agent's guilt.

  ---

  ### Predictions for Your New Cases

  Here is what the **Principle of Valid Communicative Censure** predicts for your two untested scenarios.

  #### (a) The Doctor: Lethal Dose (Accident vs. Purpose)
  *   **Scenario:** A doctor administers a dose that kills the patient. One did it intentionally (euthanasia/murder); one did it negligently (mistake).
  *   **Prediction:** **Enormous gap in punishment, potentially zero for the negligent one.**
  *   **Reasoning:** This maps to **Clause 1 (Truth Condition)** and **Case 7**.
      *   *Intentional:* The message is "You chose to end a life." This is a fundamental violation of the medical norm. High censure.
      *   *Negligent:* The message is "You were careless." If the carelessness was minor (a reasonable mistake), the "Truth Condition" for *criminal* censure might fail entirely. It becomes a civil matter.
      *   *Outcome Luck:* If both patients die, the harm is identical. But under this theory, the *harm* does not equalize the *culpability*. The intentional doctor is punished severely; the negligent doctor is punished lightly or not at all, regardless of the identical result. This aligns with your **Case 7**.

  #### (b) The Old Soldier: Prosecution for War Crimes Decades Later
  *   **Scenario:** An 80-year-old man is found to have committed atrocities as a 20-year-old soldier 60 years ago. He has lived peacefully since.
  *   **Prediction:** **Prosecution is permissible, but severe punishment is unjustified.**
  *   **Reasoning:** This is a battle between **Clause 1** and **Clause 2**.
      *   *Clause 1 (Truth):* The acts were crimes (assuming *malum in se* like torture/murder, bypassing Case 8's ex post facto issue if the acts were illegal then). The "Truth" of the violation remains. Unlike Case 4, he is not innocent.
      *   *Clause 2 (Receiver/Time):* This triggers **Case 5** (Old Man) and **Case 6** (Identity).
      *   *Resolution:* The *conviction* serves the Truth Condition (establishing the historical record/vindication for victims). However, the *punishment* (incarceration) fails the Receiver Condition. The 80-year-old is not the same moral agent as the 20-year-old soldier (Case 6), and the social utility of censure has decayed (Case 5).
      *   *Outcome:* You should support a **symbolic conviction** (declaratory judgment) but argue against **incarceration**. This satisfies the need to condemn the act without violating the principle that punishment requires a continuing moral agent.

  ### Where the Whole Thing Starts to Creak

  You asked for an honest note on the weakness. It is here:

  **The Definition of "Harm" in Clause 3.**
  Your theory works beautifully until you have to define whether a crime is *Result-Based* (Case 1) or *Conduct-Based* (Case 2 & 3).
  *   Why is Murder *Result-Based*? Why isn't "Attempting to Murder" the full wrong?
  *   Why is Bombing *Conduct-Based*? If the bomb doesn't go off, no one is terrified.

  The creak happens when you realize the legislature (or you, the theorist) gets to *define* the crime to match your intuition. If you want luck to matter, you define the crime as "Killing." If you don't, you define it as "Endangering."
  *   **The Creak:** Your theory doesn't solve the problem of moral luck; it just pushes it back one step to **how we define the prohibited act.**
  *   **The Hard Question:** Is the "wrong" in murder the *loss of life* (which requires luck) or the *disregard for life* (which does not)? Your verdicts say "both, depending on the weapon." That is the only place your system relies on intuition rather than principle.

  **Summary for your Seminar:**
  Tell your students you operate on a **Three-Gate Theory of Censure**.
  1.  **Legitimacy** (No innocents, no ex post facto).
  2.  **Identity** (No punishing the changed or the dead).
  3.  **Proportionality** (Culpability is the baseline; Harm is a modifier only for result-specific crimes).

  Admit that **Case 1 (Shooter)** is the weak link that contradicts **Case 3 (Bomber)**, and challenge them to fix Clause 3 without losing the nuance of Case 2. That will keep the seminar alive for another fifteen years.
