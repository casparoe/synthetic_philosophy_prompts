      *   *Section 2: The Split Rule and Historical Continuity (Ontology).* Why does the name follow the type? Because the name is tied to the *history of the sample*, not the *properties of the sample*. This commits to species having historical identity, not just similarity.
      *   *Section 3: Names vs. Taxa (The Distinction).* This is the escape hatch. The Code is about linguistic stability, not ontological truth. This allows the "middle ground."
      *   *Section 4: Conservation and Pragmatics.* This shows the system isn't purely metaphysical; it's also social. This complicates the "rigid designator" view slightly (allows for descriptive drift).
