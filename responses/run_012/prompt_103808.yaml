          *   *Underdetermined:* Species as Individuals vs. Species as Historical Classes.
      *   *Section 6: The PhyloCode Counterfactual.* What if we anchor by ancestry? We lose the "specimen as anchor" but gain "node as anchor." The metaphysics becomes more explicit (cladism).
      *   *Conclusion:* Formulate the "Middle Position." It is **Historical Referentialism**.

  6.  **Refining the "Middle Position":**

      *   The user asks: "Is the type convention more than nominalism but considerably less than essentialism?"
      *   My answer: Yes. It is **Ostensive Historical Realism**.
      *   *Nominalism:* Names are just tags. (Too weak: the tags have rules of persistence).
      *   *Essentialism:* Names define properties. (Too strong: the type need not be typical).
      *   *The Middle:* Names are tags attached to *historical particulars* (types), which serve as entry points into *mind-independent lineages* (taxa). The connection is causal-historical, not definitional.

  7.  **Checking against Constraints:**

      *   *Explicit line between presupposed vs. well-suited:* Need to highlight where the Code *forces* a view vs. where it just *accommodates* one.
      *   *Example:* The Code *forces* the view that names persist through theoretical change (nomenclatural stability). It *accommodates* the view that species are lineages (by letting taxonomists decide limits).
      *   *DNA/Photo species:* This challenges the "specimen" requirement. It suggests the "type" is really just a *standard of comparison*. This pushes towards a more informational/structural view rather than a materialist one.

  8.  **Final Polish:** Ensure tone is appropriate for a doctoral student (rigorous, precise, avoiding oversimplification). Use terms like "rigid designator," "causal theory of reference," "individualism," "homeostatic property clusters."

      *(Self-Correction during drafting)*: I need to be careful not to conflate the *PhyloCode* with the *Linnaean Codes*. The user asks about the current package (Linnaean/Type-based). I should use the PhyloCode only as a contrast to clarify the metaphysics of the current system.
      *(Self-Correction)*: Make sure to address the "Commission vote" aspect. That introduces a pragmatic override to the metaphysical anchoring. This suggests the system is a hybrid of metaphysics and social contract.

