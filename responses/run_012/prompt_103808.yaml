      *   *Why sweeping consequences on splits?* Because the name is rigidly designating the lineage *including the type*. It rules out the view that names track "cluster concepts" purely by similarity. It requires a **historical continuity** view.
      *   *Names $\neq$ Taxa:* This is the crucial distinction. The Code manages the *labels* (linguistic entities); Systematics manages the *hypotheses* (ontological entities). The type bridges them by anchoring the label to a physical point in the world.
      *   *Ruled Out vs. Underdetermined:*
          *   *Ruled Out:* Strict Phenic/Cluster essentialism (where the name defines the properties). Transformism (where boundaries are so fluid naming is impossible).
          *   *Underdetermined:* Individualism (Ghiselin/Hull) vs. Class Nominalism. The Code works if species are individuals *or* if they are classes defined by ancestry. It doesn't care, as long as there's a stable referent.
      *   *PhyloCode Comparison:* Shifting to ancestry-based naming (clade definitions) makes the metaphysics explicit (monophyly). The Type Code keeps metaphysics implicit. What survives? Stability, priority, uniqueness. What goes? The "typological" anchor.

