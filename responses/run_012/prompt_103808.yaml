answer: |-
  This is a precise and formidable question. You are asking for the metaphysical commitments of the *Codes* (ICZN, ICN, ICNP, etc.) distinct from the metaphysical commitments of *systematics*. Most philosophical confusion here arises from conflating the two. The Codes govern the stability of labels; systematics governs the hypotheses about biological reality.

  Your suspicion is correct: the type convention occupies a middle ground between pure nominalism and Aristotelian essentialism. It is best reconstructed as **Ostensive Historical Referentialism**. It treats species names as rigid designators anchored to historical particulars (types), which serve as causal entry-points into mind-independent lineages, without defining the properties of those lineages.

  Here is the reconstruction of the implicit metaphysics, distinguishing between what is strictly presupposed and what is merely accommodated.

  ### 1. The Type as Rigid Designator (Semantics, not Ontology)
  The clause that a type need not be typical (it may be a juvenile, deformity, etc.) is the strongest evidence against essentialism. If the type fixed the *essence* of the species, an aberrant type would render the name inapplicable to normal members.

  **Strictly Presupposed:** The system presupposes a **Causal Theory of Reference** (à la Kripke/Putnam). The name is not a disguised description (e.g., "the organism with properties X, Y, Z"). It is a label attached via an initial baptism (publication + type designation) to a specific spatiotemporal particular.
  *   **Why this matters:** This explains why the name persists even if our diagnostic characters change. The reference is fixed by the *history* of the naming act, not the *content* of the description.
  *   **The Metaphysical Commitment:** This commits the practice to **Semantic Externalism**. The meaning (extension) of the species name is not in the head of the taxonomist or the text of the description; it is out in the world, anchored by the type.

  **Merely Well-Suited:** This is compatible with species being natural kinds, but it does not *require* them to be. It works equally well if species are arbitrary slices of lineage, provided the slices are stable enough to be labeled.

  ### 2. The Split Rule and Historical Continuity
  When a species is split, the name follows the lineage containing the type, even if it is the "lesser" lineage. This is the crux of your puzzle. If the type were merely a handle, why not attach the handle to the larger, more familiar group for the sake of utility?

  **Strictly Presupposed:** This rule presupposes that **identity over time is historical, not qualitative.**
  *   **Ruled Out:** It rules out **Phenetic Cluster Concepts** as the basis for *nomenclatural stability*. If names tracked similarity clusters, the name should follow the largest cluster of similar organisms. The fact that it follows the type implies the name tracks the *continuity of the sample history*.
  *   **The Commitment:** The system treats the species name as designating a **historical trajectory** that includes the type. It implies that the species is a particular (or a class defined by ancestry) rather than a class defined by intrinsic properties. The name is tied to the *genealogy of the specimen*, not the *phenotype of the specimen*.

  **Merely Well-Suited:** This is well-suited to the "Species as Individuals" thesis (Ghiselin/Hull), but it does not strictly require it. It would also work if species were "Historical Natural Kinds" (classes defined by common ancestry). The Code is agnostic on whether the species is a particular or a class; it only requires that whatever it is, it has historical continuity that can be traced back to the type.

  ### 3. "Names are Not Taxa" (The Firewall)
  The Codes' disclaimer that they govern names, not taxa, is not merely bureaucratic; it is the metaphysical escape hatch that allows the middle position to hold.

  **Strictly Presupposed:** There is a **distinction between the Linguistic Entity (Name) and the Ontological Entity (Taxon).**
  *   **The Function:** This allows the nomenclature to remain stable while scientific knowledge (ontology) changes. If the name *were* the taxon, every revision of species limits would change the name.
  *   **The Commitment:** This presupposes **Fallibilism about Taxonomic Boundaries.** It admits that we do not know the true limits of the species, so we anchor the name to something we *do* know exists (the specimen) while leaving the extension open to future discovery.

  **Merely Well-Suited:** This is compatible with Realism (there is a true boundary we are approximating) but also with Pragmatism (the boundary is a decision, but the name must stick to the decision rule).

  ### 4. Conservation and the Pragmatic Override
  The ability of a commission to conserve a name (e.g., *Felis catus* vs. *Felis silvestris*) introduces a social layer that complicates the metaphysics.

  **Strictly Presupposed:** **Stability of Communication trumps Historical Priority.**
  *   **The Commitment:** This reveals that the ultimate goal of the Codes is not metaphysical purity but **intersubjective coordination**. The metaphysics of the type is subservient to the sociology of science.
  *   **The Tension:** This creates a friction with the "Rigid Designator" view. If the name is rigidly attached to the type, how can we move it to a different lineage via conservation?
  *   **Resolution:** The Code treats the *application* of the name as adjustable by consensus when strict adherence causes communicative breakdown. This suggests the "kind" is partly constituted by the practice of the community, not just the biology.

  ### 5. DNA and Photo Taxonomy (The Decoupling)
  The move toward DNA barcodes or photo-types without vouchers challenges the materialist aspect of the type concept.

  **Strictly Presupposed:** The type functions as an **Informational Anchor**, not necessarily a Material One.
  *   **The Shift:** If a sequence can serve as a type (or a proxy), the metaphysics shifts from "anchoring to a physical particular" to "anchoring to a data point."
  *   **The Commitment:** This suggests the "kind" is accessed via **informational similarity** to the anchor, rather than physical continuity. However, to avoid collapsing into phenetic essentialism, that sequence must still be treated as a historical sample (a token of a lineage), not just a definition.

  ### 6. Ruled Out vs. Underdetermined

  **Ruled Out (Incompatible with the Practice):**
  1.  **Strict Descriptivism:** The view that a species name is synonymous with a set of diagnostic characters. (Ruled out by the "type need not be typical" clause).
  2.  **Pure Phenetics:** The view that names should track overall similarity regardless of history. (Ruled out by the "name follows type in a split" rule).
  3.  **Transformism/Fluidity:** The view that species boundaries are so arbitrary that naming them is pointless. (Ruled out by the existence of the Codes themselves, which presuppose stable units are namable).

  **Underdetermined (Compatible with the Practice):**
  1.  **Species as Individuals vs. Species as Historical Classes:** The Code works if a species is a single spatiotemporally bounded individual (Ghiselin) *or* if it is a class of organisms defined by common ancestry (Boyd's Homeostatic Property Clusters, provided the homeostasis is historical). The type anchors the name to *a part* of the individual or *a member* of the class; the logic holds either way.
  2.  **Realism vs. Pragmatic Constructivism:** The Code works if species boundaries are discovered (Realism) *or* if they are drawn by taxonomists for convenience (Pragmatism), provided the drawing is consistent relative to the type.
  3.  **Essentialism of Origin vs. Essentialism of Properties:** The practice is compatible with an "essence" of origin (you belong to this species because you descend from the type's population), but incompatible with an "essence" of properties (you belong because you look like the type).

  ### 7. The Counterfactual: Ancestry-Based Naming (PhyloCode)
  If we rewrote the code to fix names by ancestry (e.g., "the clade stemming from node X") rather than by a specimen:

  **What would be abandoned:**
  *   **Ostensive Reference:** We would lose the ability to point to a physical object and say "the name applies to whatever this is part of." We would move to definitional reference ("the name applies to whatever satisfies this genealogical definition").
  *   **The "Aberrant Type" Safety Valve:** If the anchor is a node, the "typicality" of the anchor becomes irrelevant, but the *identification* of the node becomes the new metaphysical bottleneck.

  **What would survive:**
  *   **Priority:** The rule that the first name proposed sticks.
  *   **Uniqueness:** One name per taxon.
  *   **The Name/Taxa Distinction:** Even in the PhyloCode, the name is distinct from the clade hypothesis.

  **The Metaphysical Shift:** This would make the metaphysics **explicitly Cladistic**. The current Type Code is compatible with cladism but also with evolutionary systematics (paraphyly is nomenclaturally permissible in the Linnaean system, though frowned upon). Ancestry-based naming would *presuppose* that only monophyletic groups are namable kinds.

  ### 8. Stating the Middle Position
  You asked if the position "more than nominalism but considerably less than essentialism" can be stated. Yes. It is **Historical Referentialism**.

  *   **Against Nominalism:** It asserts that the name is not just a label for a concept in our heads. It is tethered to a mind-independent particular (the type) that exists outside the classification system. The name has a "career" in the world that is not fully under our control (hence the split rule).
  *   **Against Essentialism:** It asserts that the type does not define the properties of the kind. The type is a *sample*, not a *paradigm*. The connection between the type and the rest of the species is not similarity, but **continuity** (historical/biological).

  **The Synthesis:**
  The Codes presuppose that species are **historical entities** (whether individuals or lineages) that can be **ostensively referenced** but not **definitionally captured**. The type specimen is a **causal anchor** that allows the linguistic community to coordinate reference to a historical trajectory without agreeing on the limits of that trajectory.

  **Where the Practice is Underdetermined:**
  The practice does not decide *what makes the historical trajectory cohere*. Is it reproduction? (Biological Species Concept). Is it ancestry? (Phylogenetic Species Concept). Is it ecological niche? (Ecological Species Concept). The Code is metaphysically neutral on the *bond* that holds the species together; it only mandates the *hook* by which we grab it.

  **Conclusion:**
  The type convention is not a metaphysical claim about the essence of the species. It is a **technological solution to the problem of reference** in a domain where the objects (species) are dynamic, the boundaries are fuzzy, and the theories are transient. It treats the species name as a **rigid designator for a hypothesis about a lineage**, anchored by a physical token. This allows science to change its mind about what the species *is* without changing the name of the *thing* it is talking about. The "sweeping consequences" of the type during a split are not metaphysical decrees about which lineage is "truer," but semantic rules ensuring that the label remains attached to the original historical anchor, preserving the continuity of the scientific conversation even as the ontology shifts.
