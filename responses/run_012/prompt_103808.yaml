          *   How to square "names $\neq$ taxa" with the type's role in determining name application?
          *   What species accounts are ruled out vs. merely not required (underdetermination)?
          *   What if we shifted to ancestry-based naming (PhyloCode style)? What survives?
          *   **Crucial Constraint:** Distinguish strictly *presupposed* metaphysics from what is merely *well-suited* or accidental.
          *   **User's Hypothesis:** The position is "more than nominalism but considerably less than essentialism." Can this middle ground be stated?

  2.  **Initial Analysis of the "Type Method" Metaphysics:**

      *   *The Type Specimen:* It's a rigid designator (in the Kripkean sense). It fixes the reference of the name.
      *   *The Species Taxon:* The Codes explicitly say they don't define taxa. This suggests a separation between *naming* (semantics/nomenclature) and *delimiting* (ontology/systematics).
      *   *The Split Scenario:* If Species A splits into A1 (contains type) and A2 (does not), A1 keeps the name. This looks like the name tracks the *lineage containing the type*, not necessarily the "best" or "most typical" group.
      *   *Conservation:* Commissions can change names based on usage/stability. This introduces a pragmatic/social layer over the metaphysical anchoring.
      *   *DNA/Photo Species:* Decoupling the name from a physical voucher suggests the "type" is functioning as an *informational anchor* or a *node in a network*, not necessarily a metaphysical essence-bearer.

  3.  **Evaluating the "Essence vs. Handle" Dichotomy:**

      *   *Essentialism:* If the type fixed the essence, then any organism lacking the type's essential properties wouldn't be in the species. But the Codes say the type need not be typical. So, strict Aristotelian essentialism is ruled out *by the Codes themselves*.
      *   *Pure Nominalism/Conventionalism:* If it's *just* a handle, why does the split rule work the way it does? If names are just labels we stick on clusters, we could relabel the bigger cluster with the old name. The fact that we *don't* (usually) suggests the name is tied to the *history* of the type, not just current similarity.
      *   *The Middle Ground:* The type functions as a *causal-historical anchor* (Kripke/Putnam). It fixes reference ostensively, but the extension is determined by the underlying nature (which is left to science, not the Code). However, since the Code governs *names*, not *taxa*, it treats the name as a label for a *hypothesis* about a lineage.

