answer: |-
  # Q&A Prep Sheet: The Bedrock of Present Capacity

  **Core Case for All Replies:** A novice is shown a single red apple and taught "red." Later, they point to an orange ball and say "red."
  **Your Thesis:** The correctness of this judgment is not fixed by the past lesson (the single apple), nor by the novice's dispositions, nor by communal consensus alone. It is fixed by the normative status of their *present capacity* to judge.

  ---

  ### 1. The Wittgenstein/Kripke Specialists (Communitarians)
  **Damage Potential:** **Critical.** They will argue that without communal agreement, your "present capacity" collapses into "whatever seems right to me," reviving the Private Language Argument.
  **Their Vocabulary:** "Criteria," "Public check," "Stage-setting," "Seems vs. Is."

  **The Objection:**
  "If the novice's present capacity is the bedrock, what distinguishes them *being* right from them *thinking* they are right? In our red apple case, if the novice sincerely takes the orange ball to be 'red' based on their present capacity, and that capacity is normative bedrock, on what grounds do we call it a mistake? Without a community to provide a check against individual drift, you haven't solved the paradox; you've just privatized it."

  **Your Reply (2 mins):**
  "I agree that without a community, we couldn't *identify* the mistake, but I deny the community *constitutes* the correctness. In the red apple case, the community provides the training and the correction, but the *normative force*—the reason the novice feels bound to say 'red' only for red things—lies in their present engagement with the concept.
  When the novice points to the orange ball, they are not merely failing a communal test; they are failing to exercise the capacity that makes meaning possible. The community doesn't create the norm; it sustains the practice within which the novice's capacity is exercised. My point is that the *bindingness* of the rule isn't a fact about the group's past agreement, but about the individual's current ability to recognize a demand. If we say only the community determines correctness, we make the novice a passive vessel. I am arguing the novice is an active participant whose present judgment is the locus of responsibility. The community checks the *application*, but the *authority* of the rule is felt in the present act of judging."

  **Where this is soft:** You risk sounding like you are positing a mysterious inner authority. If they press on how the community corrects the capacity without *defining* correctness, you may circle.
  **Concession:** Concede that without a community, the concept of "mistake" would have no purchase—we need the practice to have the concept of error.

  ---

  ### 2. The Semantic Naturalist
  **Damage Potential:** **High.** They will treat "primitive normativity" as an occult quality incompatible with a scientific worldview.
  **Their Vocabulary:** "Reductive," "Causal mechanism," "Queer entities," "Physical facts."

  **The Objection:**
  "You call this capacity 'bedrock,' but that sounds like a confession of failure. In the red apple case, there are physical facts: light wavelengths, neural firings, behavioral outputs. If you say the correctness of calling the ball 'red' rests on a non-natural normative capacity, you are positing a queer entity. How does this 'capacity' interact with the physical world? If it's not reducible to facts about the brain or behavior, it's obscurantism."

  **Your Reply (2 mins):**
  "This isn't obscurantism; it's a refusal to reduce the normative to the descriptive. When the novice calls the orange ball 'red,' there are indeed causal facts about their retina and neurons. But no arrangement of physical facts entails that they *ought* not to say 'red.' That 'ought' is sui generis.
  Compare this to logic: we don't ask for a physical reduction of why Modus Ponens is valid. We accept it as a condition of reasoning. Similarly, this present capacity is a condition of meaning. I am not positing a ghost in the machine; I am pointing out that agency involves taking things to be correct. If you demand a reductive story for normativity, you are asking for a category mistake. The novice's error isn't a causal glitch; it's a normative failure. We can study the causal conditions of that failure naturalistically, but the failure itself is only visible from within the normative stance I am describing."

  **Where this is soft:** They will press you on how a non-natural capacity causes physical speech acts.
  **Concession:** Concede that you are not offering a causal explanation of *how* the judgment produces speech, only an account of what makes it a meaningful judgment.

  ---

  ### 3. The Dispositionalist
  **Damage Potential:** **Medium.** They will try to absorb your view into a sophisticated dispositionalism, blunting your distinctiveness.
  **Their Vocabulary:** "Ideal conditions," "Counterfactuals," "Finite extension," "Noise."

  **The Objection:**
  "Your 'present capacity' looks suspiciously like an idealized disposition. In the red apple case, surely the novice is disposed to apply 'red' to a range of colors. If they call the orange ball 'red,' isn't that just because conditions aren't ideal (distraction, poor lighting)? Why posit a normative bedrock when we can just say their disposition is noisy?"

  **Your Reply (2 mins):**
  "Because dispositions are descriptive, and meaning is normative. A disposition tells us what the novice *will* do; my account tells us what they *should* do. In the red apple case, even if the novice is perfectly disposed under ideal conditions to call the orange ball 'red' (perhaps they have a slightly different color spectrum), we can still say they are misapplying *our* word 'red.'
  If meaning were just disposition, there would be no room for error, only divergence. If the novice says 'red' to orange, the dispositionalist must say, 'Ah, that was their meaning.' I say, 'No, that was a mistake.' The present capacity I'm talking about is the ability to recognize that mistake. It is not a prediction of behavior; it is the faculty that allows the novice to correct themselves. Dispositions explain the slip; capacity explains the responsibility."

  **Where this is soft:** Distinguishing "capacity" from "ideal disposition" without slipping back into abstract rules is tricky.
  **Concession:** Concede that dispositions are excellent predictors of behavior, just not constitutive of meaning.

  ---

  ### 4. The Linguist
  **Damage Potential:** **Low.** They will challenge the framing of the problem rather than the solution.
  **Their Vocabulary:** "Usage," "Descriptive grammar," "Category error," "Speech community."

  **The Objection:**
  "This whole debate assumes 'rule' is a metaphysical constraint. In the red apple case, the novice is just learning usage. If they call the orange ball 'red,' they haven't violated a metaphysical rule; they just have a different extension for the word. You're reifying 'correctness' where there is only variation in practice."

  **Your Reply (2 mins):**
  "I agree that linguistically, variation is just variation. But philosophically, the novice *takes themselves* to be bound. When we teach the novice, we aren't just describing our habits; we are initiating them into a practice where some moves are excluded.
  If I tell the novice, 'No, that's orange, not red,' I am not noting a statistical irregularity; I am correcting them. My account explains why that correction has force. If it were just usage, the novice could say, 'My usage includes orange.' But they don't. They accept the correction. That acceptance shows they recognize a standard beyond mere regularity. I am analyzing that recognition, not the statistical distribution of the word 'red'."

  **Where this is soft:** They may argue that "recognition of a standard" is just socialization, not philosophy.
  **Concession:** Concede that from a purely descriptive linguistic standpoint, your distinction doesn't appear.

  ---

  ### Strategic Concessions (Up Front)
  In your opening or early responses, concede the following to disarm the Communitarians and Naturalists:
  1.  **Isolation is impossible:** Acknowledge that a speaker isolated from birth would not develop this capacity. The capacity requires a social context to emerge, even if the context doesn't *ground* the normativity.
  2.  **No Magic:** Acknowledge that this capacity depends on biological and cognitive machinery. You are not denying science, only its sufficiency for explaining *meaning*.

  ### The Question You Hope Nobody Asks
  **"If the present capacity is the bedrock, and the past does not fix the meaning, what prevents the novice from legitimately claiming that their capacity *changed* rather than that they made a *mistake*? If the bedrock is the *present* taking, isn't every new application a new bedrock, making consistency impossible?"**

  *Why this is dangerous:* It attacks the diachronic stability of meaning. If correctness is only about the *present* capacity, it is hard to explain how I am bound by what I meant *yesterday* without appealing to the past facts you rejected.
  *Prepared deflection (if asked):* "The capacity is not a momentary impulse; it is a standing ability to recognize identity across time. To exercise the capacity *is* to recognize the past constraint in the present moment. But I will concede this is the hardest part of the view and requires further work on the temporal structure of agency."
