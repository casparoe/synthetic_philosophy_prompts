      *   **The Problem:** Counterexamples.
          *   *Finks:* The stimulus causes the disposition to vanish before manifestation (e.g., a wire that loses conductivity the moment it touches a conductor).
          *   *Masks (Antidotes/Interference):* The disposition remains, but something prevents manifestation (e.g., poison + antidote, glass + foam).
      *   **The Debate:** This is a classic debate in metaphysics (Martin, Lewis, Johnston, Bird, etc.).
      *   **He:** Argues the SCA fails because the conditional is false in the foam case. Implies fragility is context-sensitive or the analysis is wrong. Claims the *ceteris paribus* clause is circular.
