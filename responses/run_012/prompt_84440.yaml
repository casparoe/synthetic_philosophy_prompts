answer: |-
  **To:** The Board of Trustees
  **From:** [Your Name]
  **Date:** October 2
  **Subject:** Recommendation on Five-Year Research Strategy

  **Recommendation**

  I recommend that the board adopt the **Portfolio Strategy** for the upcoming five-year cycle. Regarding the proposed decision rule, I recommend we **do not adopt** the risk-weighted impact score as a formal voting metric. Instead, we should continue to use expected impact but assess impact on a scale that reflects the diminishing value of marginal gains against the catastrophic cost of mission failure. We should set a date to reconsider the strategic direction in **October 2026**, contingent on interim milestones from the Portfolio laboratories. This resolution provides immediate direction without locking the board into a mathematical framework that may distort future judgments.

  **The Risk-Weighted Rule: Defensible or Mistake?**

  The proposed rule modifies how we weigh probabilities. While it captures the intuition that worst outcomes deserve extra attention, it violates a fundamental principle of rational choice known as Independence. This principle states that if you prefer Option A to Option B, adding a common outcome to both should not reverse your preference.

  Consider a simplified variation of our choice. Suppose Option A offers a 20% chance of a cure (Impact 100) and 80% chance of nothing (Impact 0). Option B offers a certain modest gain (Impact 15). Expected impact favors A (20 vs. 15). A high risk-aversion exponent *c* might favor B. Now, suppose there is a separate, common risk: a 50% chance that regulatory changes nullify any progress regardless of our choice. Under expected impact, both options are halved in value, and A remains preferred. Under the risk-weighted rule, the non-linear weighting of probabilities can flip the ranking, making B preferred solely because of the shared background risk.

  This reversal is indefensible for a fiduciary body. It means our preference between two strategies could change based on external factors common to both, rendering our decision-making manipulable and inconsistent. The rule respects state-wise dominance (it will not rank an option higher if it is worse in every possible state), but its violation of Independence makes it unsuitable as a formal governance tool.

  **Concave Impact vs. Probability Weighting**

  The objection raised by two trustees—that we are not entitled to stake our only shot on a long shot—can be redescribed without the risk-weighted rule. It is better understood as applying ordinary expected impact to a **concave impact scale**.

  In decision theory, risk aversion can be modeled either by distorting probabilities (the proposed rule) or by diminishing marginal value of outcomes (concave utility). For this foundation, the value of "preventing total failure" is disproportionately high compared to "incremental gain." If the foundation exhausts its capital on a failed platform bet, the impact is not just zero for five years; it is potentially zero for the remaining fifteen years of our mission horizon. This is a non-linear loss.

  If we model the impact scale such that the loss of future capacity weighs heavier than the linear sum of patient gains, ordinary expected impact will reject the Platform Bet without needing the risk-weighted rule. This approach is superior because it isolates the value judgment (how much we fear mission failure) from the probability assessment (how likely the science is to work). When probabilities are contested estimates, as they are here, distorting them via an exponent *c* conflates scientific uncertainty with ethical caution. We should keep these separate: estimate probabilities as best we can, and encode our caution in the value we assign to survival versus breakthrough.

  **Level of Aggregation**

  The risk-weighted rule depends on an option's whole outcome distribution. This creates a critical aggregation problem. Scoring the Portfolio strategy as a single bundle yields a different risk score than scoring the forty individual grants and summing them. Because the rule is non-linear, diversification looks different depending on the level of analysis.

  If we score grant-by-grant, the Portfolio appears as forty small risks, which might aggregate to a lower "risk penalty" than one large Platform bet. If we score strategy-by-strategy, the Portfolio is one option. The board must decide to evaluate the **strategies as whole bundles**. The mission is served by the aggregate outcome of the five-year plan, not the individual success of each lab. Evaluating at the strategy level ensures we are comparing the actual risk profiles facing the foundation: one concentrated bet versus one diversified bet. However, since I recommend rejecting the formal rule, this primarily serves to highlight why the Platform Bet feels riskier: it lacks the internal hedging of the Portfolio.

  **Risk and Regret**

  We must distinguish who bears the risk. The trustees bear the risk of embarrassment or reputational harm if a bold bet fails. The patients bear the risk of disease progression if five years are wasted.

  Trustee reluctance is a bias if it stems from a desire to avoid personal blame for a failed gamble. However, it is a valid fiduciary constraint if it stems from a duty to ensure the foundation survives to serve patients over the full twenty-year horizon. The objection that we are "not entitled to stake our only shot" is not about trustee comfort; it is about intergenerational equity among patients. Patients waiting in year ten deserve a functioning foundation as much as patients waiting in year five.

  Therefore, the board should discount trustee embarrassment but honor the constraint of mission continuity. The Portfolio Strategy minimizes the risk of total capital depletion without scientific return. It ensures that in five years, we remain a viable entity with data, networks, and incremental wins to build upon. The Platform Bet risks a "stop" condition on the mission. Consistent with prioritizing patient welfare over trustee comfort, we must choose the strategy that secures the foundation's ability to act in the future.

  **The Best Case for the Platform Bet**

  Advocates of the Platform Bet argue that incrementalism is a moral failure. For patients with a degenerative disease, "modest gains" are merely a slower decline. They contend that the foundation's unique role is to fund what larger, risk-averse institutions will not. If the delivery technology works, it halts the disease entirely, rendering the previous five years of incremental care obsolete. From this view, spending five years optimizing palliative care while a cure sits unfunded is the greater waste. They argue we are entrusted with capital to solve the problem, not to manage the decline, and that a one-in-eight chance of a cure is ethically superior to a certainty of managing symptoms.

  **Conclusion**

  The Platform Bet offers a higher ceiling but threatens the floor. The Portfolio Strategy secures the floor. Given that the foundation's capacity to help patients depends on its continued existence, and given that the proposed risk-weighted rule introduces mathematical inconsistencies without adding ethical clarity, I urge the board to vote for the Portfolio. We should encode our caution in how we value mission survival, not in how we distort probabilities.

  **Resolution for Vote:**
  1.  Adopt the Portfolio Strategy for the 2024-2029 cycle.
  2.  Reject the adoption of the Risk-Weighted Impact Score as a formal decision rule.
  3.  Schedule a strategic review for October 2026.
