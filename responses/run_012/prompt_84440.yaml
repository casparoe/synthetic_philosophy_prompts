      *   **Risk-Weighted Impact Score (RWIS):** This sounds like Buchak's Risk-Weighted Expected Utility (REU).
          *   Formula: $REU = \sum u(x_i) \cdot [r(P(X \ge x_i)) - r(P(X > x_i))]$ where $r(p) = p^c$.
          *   If $c=1$, it's Expected Utility (EU).
          *   If $c>1$, it weights worst outcomes more heavily (risk-averse).
