      *   **Concave Impact Scale:** Risk aversion can be modeled by concave utility (diminishing marginal value of impact) rather than weighting probabilities. If the foundation's mission is linear (1 cure = 2x impact of 0.5 cure?), then concave utility might not fit. But if "saving the first patient" is worth more than "saving the millionth," utility is concave. The trustees' objection ("not entitled to stake its only shot") sounds like a constraint or a specific risk attitude regarding the *mission failure*, not necessarily diminishing returns on patients saved.
      *   **Aggregation:** RWIS is non-linear. $RWIS(A + B) \neq RWIS(A) + RWIS(B)$. This is crucial. If we evaluate grant-by-grant, the Portfolio looks like 40 small bets. If evaluated as a bundle, it's one strategy. The Platform Bet is one big bet. The rule must be applied at the *strategy* level, not the grant level, otherwise it penalizes diversification artificially or fails to capture the "all eggs in one basket" risk.
