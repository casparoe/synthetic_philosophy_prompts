prompt: |-
  our council's scrutiny committee chair has got it into his head that the fix for planning is sortition — pick thirty residents at random, like a jury, and let them decide. his whole case is that we already trust twelve random people with a bloke's liberty, so trusting thirty random residents with a bypass route is nothing much. and he keeps pulling extra bits out of it: the planning inspector should sit there like a judge and tell them what they're allowed to consider, they shouldn't be let loose commissioning their own evidence, their decision should be final with no appeal to the secretary of state, and you should sit once and never again, same as we don't have professional jurors. he even says juries can ignore a law they think is barmy, so the panel should be able to set aside national planning policy if it wants.

  how far does the jury analogy actually hold here? give me the correspondence table — who or what plays the judge, the defendant, the law, the two sides, the verdict, the appeal — then the places it breaks, and what it's quietly importing from jury trial that a planning decision just doesn't have. then tell me whether his four conclusions (inspector as judge, no own evidence, no appeal, one term) survive once the disanalogies are on the table, or whether the analogy was carrying them the whole way. if there's a better analogy for what a sortition panel is actually doing, say what it is. British English please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The Chair of a Council Scrutiny Committee proposes using sortition (random selection of 30 residents) for planning decisions, analogizing it to a jury trial.
      *   **Specific Claims by Chair:**
          1.  Inspector acts as Judge (rules on admissibility/scope).
          2.  Panel cannot commission own evidence.
          3.  Decision is final (no appeal to Secretary of State).
          4.  One-off service (no repeat terms, like jurors).
          5.  Panel can ignore National Planning Policy (like jury nullification).
      *   **Tasks:**
          1.  Create a correspondence table (Jury Trial vs. Planning Sortition).
          2.  Identify where the analogy breaks (disanalogies).
          3.  Identify what is quietly imported from jury trials that doesn't fit planning.
          4.  Evaluate the Chair's four conclusions based on the disanalogies.
          5.  Suggest a better analogy if applicable.
          6.  **Tone/Style:** British English, analytical, critical but fair.

  2.  **Deconstruct the Jury Analogy (Correspondence Table):**
      *   *Judge:* Chair says Planning Inspector.
      *   *Defendant:* In planning, who is on trial? The Developer? The Land?
      *   *Prosecution/Defence:* Objectors vs. Applicant? Council Officers vs. Applicant?
      *   *Law:* National Planning Policy Framework (NPPF) vs. Criminal Law.
      *   *Verdict:* Grant/Refuse Permission vs. Guilty/Not Guilty.
      *   *Appeal:* Secretary of State vs. Court of Appeal.
      *   *Jurors:* 30 Random Residents vs. 12 Random Citizens.

  3.  **Identify Disanalogies (Where it breaks):**
      *   *Nature of the decision:* Criminal law is retrospective (did you do it?) and binary (guilty/not). Planning is prospective (should this happen?) and multidimensional (economic, environmental, social).
      *   *Expertise:* Jurors judge *facts* and *culpability* based on common sense. Planning requires understanding technical constraints (drainage, traffic, housing need).
      *   *Representation:* A jury represents the "public conscience" regarding a specific act. A planning decision affects specific stakeholders (neighbors, developer) and the wider public interest (housing targets).
      *   *Nullification:* Jury nullification is a *de facto* power, not *de jure*. Planning bodies are statutory creatures; they *must* follow the law (NPPF). Ignoring policy is unlawful.
      *   *Process:* Criminal trials are adversarial. Planning is often inquisitorial or regulatory.
      *   *Scale:* 30 people is a massive logistical beast compared to 12.

  4.  **Identify Quiet Imports (What's sneaking in):**
      *   *Legitimacy via randomness:* Assumes randomness = fairness. In planning, expertise + accountability = fairness.
      *   *Insulation from politics:* Juries are insulated to protect the accused from the state. Planning *is* political (distribution of resources).
      *   *Finality:* Criminal verdicts are final (double jeopardy). Administrative decisions need checks and balances because they affect property rights and public funds.
      *   *Nullification:* The idea that "local feeling" overrides national law.

  5.  **Evaluate the Chair's Four Conclusions:**
      *   *Inspector as Judge:* Weak. Inspectors are quasi-judicial but also investigators. In a jury trial, the judge doesn't define the *scope* of the crime, the law does. In planning, policy *is* the scope.
      *   *No Own Evidence:* Stronger analogy (jurors don't investigate), but planning panels often need site visits or clarifications. However, relying on submitted evidence is standard.
      *   *No Appeal:* Dangerous. Criminal appeals exist for miscarriages of justice. Planning appeals exist for legal error or unreasonableness. Removing this risks unlawful decisions.
      *   *One Term:* Logistically sound (prevents capture), but ignores the learning curve. Planning is complex; a "one-and-done" panel is inefficient.
      *   *Nullification (ignoring NPPF):* Legally impossible. This is the biggest flaw. A council cannot lawfully ignore the NPPF.

  6.  **Develop a Better Analogy:**
      *   If not a jury, what is it?
      *   *Citizens' Assembly:* This is the actual term for sortition in policy. They advise, they don't usually *decide* executive actions.
      *   *Shareholders/Board:* Residents are stakeholders.
      *   *Tribunal:* More accurate than criminal court.
      *   *Best Fit:* A **Citizens' Assembly** or **Deliberative Poll**. These are designed for policy input, not adjudicating specific property rights. Or a **Planning Tribunal** (which exists in some jurisdictions), but that uses experts.
      *   *Refinement:* The Chair is describing a **Citizens' Jury** (a specific deliberative democracy tool), but misapplying its output power. They recommend, they don't legislate/adjudicate.

  7.  **Drafting the Response (incorporating British English):**
      *   *Tone:* Professional, slightly sceptical, precise. Use terms like "quasi-judicial," "ultra vires," "NPPF," "Secretary of State."
      *   *Structure:*
          1.  Introduction (acknowledge the trend of sortition).
          2.  Correspondence Table.
          3.  The Breakdown (Disanalogies).
          4.  The Quiet Imports.
          5.  Evaluation of the Four Conclusions.
          6.  The Better Analogy.
          7.  Conclusion.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between the Planning *Committee* (elected members) and the proposed *Sortition Panel*.
      *   *Legal Point:* Emphasize that ignoring NPPF is *ultra vires*. A jury can acquit against evidence; a council cannot grant permission against policy without robust reasons that withstand appeal.
      *   *Scale:* 30 people is unwieldy for a decision. Juries are 12 for a reason (deliberation efficiency).
      *   *Appeal:* In criminal law, the Crown can appeal unduly lenient sentences (sometimes). In planning, the applicant has a right of appeal if refused. Removing this removes property rights protection.

  9.  **Final Polish:** Check against the prompt requirements.
      *   Correspondence table? Yes.
      *   Where it breaks? Yes.
      *   Quiet imports? Yes.
      *   Evaluate 4 conclusions? Yes.
      *   Better analogy? Yes.
      *   British English? Yes (e.g., "programme," "centre," "quango," "ultra vires").

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a classic case of a seductive analogy doing too much heavy lifting. The Chair is latching onto the democratic legitimacy of the jury system to solve the democratic deficit in planning, but he is conflating *adjudication of fact* with *allocation of resources*.

  Here is the breakdown of the correspondence, the structural faults, and the viability of his specific proposals.

  ### 1. The Correspondence Table

  | Jury Trial Component | Chair's Planning Sortition Equivalent | Actual Planning Reality |
  | :--- | :--- | :--- |
  | **The Jurors** | 30 Random Residents | Elected Councillors (Planning Committee) |
  | **The Judge** | Planning Inspector | Planning Officer / Committee Chair |
  | **The Defendant** | The Developer / The Application | The Land / The Proposal |
  | **The Prosecution** | Objectors / Neighbours | Statutory Consultees (e.g., Highway Authority) |
  | **The Defence** | The Applicant / Agent | The Applicant / Agent |
  | **The Law** | National Planning Policy (NPPF) | National Planning Policy (NPPF) & Local Plan |
  | **The Verdict** | Grant or Refuse Permission | Grant or Refuse Permission |
  | **The Appeal** | None (Double Jeopardy) | Secretary of State / Planning Inspectorate |
  | **Nullification** | Ignoring NPPF if "barmy" | Ignoring NPPF if "barmy" |

  ### 2. Where the Analogy Breaks

  The analogy holds superficially on *process* (random people deciding) but collapses on *function* and *law*.

  *   **Retrospective vs. Prospective:** A jury decides what *happened* (did he stab him?). A planning panel decides what *should happen* (should this building exist?). Judging facts requires common sense; judging future impacts requires technical modelling (traffic, drainage, viability).
  *   **Binary vs. Multidimensional:** A verdict is Guilty/Not Guilty. Planning is a negotiation of conditions, Section 106 agreements, phasing, and materials. A jury does not negotiate a sentence; a planning panel effectively does.
  *   **The Nature of 'Law':** In criminal law, the Judge instructs the jury on the law, but the jury's interpretation of facts is sacrosanct. In planning, the NPPF is not merely guidance to be weighed; it is a statutory framework. A decision contrary to the NPPF without robust justification is *ultra vires* (beyond powers) and unlawful.
  *   **Stakeholder Rights:** A criminal trial protects the liberty of the accused against the State. Planning protects the property rights of the applicant against the State (and vice versa). Removing the right of appeal (see below) strips the applicant of a property right protection that doesn't exist in the same way in criminal law.
  *   **Scale of Deliberation:** Twelve people can deliberate in a room. Thirty is a mob. It requires formalised debate, voting structures, and chairing that fundamentally changes the dynamic from a jury room to a mini-council.

  ### 3. What Is Quietly Imported

  The Chair is smuggling in three concepts from criminal justice that do not belong in administrative law:

  1.  **Jury Nullification:** He suggests the panel can ignore National Policy if they deem it "barmy." In criminal law, a jury can acquit despite the evidence, and no one can question them. In planning, a decision that ignores the Development Plan or NPPF is subject to Judicial Review. You cannot import nullification into a statutory regulatory regime without breaking the rule of law.
  2.  **Insulation from Accountability:** Jurors are anonymous and unaccountable to protect them from intimidation. Planning decisions must be accountable because they distribute public goods and burdens. If a random panel grants a bypass that floods a village, who takes the blame? You cannot vote them out, and they have no party whip.
  3.  **Finality:** The "no appeal" notion imports the principle of Double Jeopardy. In criminal law, the State only gets one bite at the cherry to protect the citizen. In planning, the "citizen" is often the developer seeking to build homes, and the "State" is the council restricting them. The appeal system exists to ensure consistency and legality, not just to retry facts.

  ### 4. Do His Four Conclusions Survive?

  Let us test his specific prescriptions against the disanalogies above.

  **A. The Inspector as Judge (Ruling on scope)**
  *   **Verdict:** **Unworkable.**
  *   **Reasoning:** In a trial, the Judge interprets existing law. In planning, the "law" (policy) is often in conflict (e.g., Housing Need vs. Green Belt Protection). An Inspector is an appellate figure, not a trial judge. If the Inspector rules on what the panel can consider, they are effectively making the decision themselves. This creates a separation of powers confusion. The Planning Officer advises on policy; an Inspector is an external arbiter. Mixing these roles compromises the quasi-judicial nature of the committee.

  **B. No Commissioning of Own Evidence**
  *   **Verdict:** **Plausible, but risky.**
  *   **Reasoning:** This is the strongest part of the analogy. Jurors do not go out to investigate crime scenes. However, Planning Committees frequently rely on site visits to understand context (levels, overlooking, heritage). If the panel is forbidden from seeing the site or asking for clarification on technical points, they are deciding on paper only. This increases the risk of error, which feeds into the need for appeals.

  **C. No Appeal to Secretary of State**
  *   **Verdict:** **Legally Dangerous.**
  *   **Reasoning:** This imports the "finality" of a jury verdict into an administrative decision. If the panel makes an error of law (e.g., misinterprets the NPPF), the applicant has a right to redress. Removing this would likely lead to a surge in Judicial Reviews, which are more expensive and slower than Planning Appeals. It treats planning permission as a privilege granted by the community, rather than a right regulated by the state.

  **D. One Term Only (No Repeat Service)**
  *   **Verdict:** **Logistically Sound, Competentially Weak.**
  *   **Reasoning:** This prevents "capture" by developers or local factions, which is good. However, planning is complex. A jury learns what they need to know for a specific trial in a week. A planning panel needs to understand the Local Plan, which takes months. A "one-and-done" panel ensures ignorance is baked into the system. It prioritises purity of representation over competence.

  **E. (Bonus) Ignoring National Policy (Nullification)**
  *   **Verdict:** **Impossible.**
  *   **Reasoning:** This is the fatal flaw. A council cannot lawfully decide to ignore the NPPF. If they do, the decision will be quashed in the High Court. The Chair is proposing a system that generates unlawful decisions by design.

  ### 5. A Better Analogy

  The Chair is describing a **Citizens' Assembly**, not a Jury.

  *   **Jury:** Adjudicates a specific past event; verdict is final; represents the conscience of the public.
  *   **Citizens' Assembly:** Deliberates on a policy question; makes recommendations to decision-makers; represents the deliberative will of the public.

  If the Council wants to use sortition, the panel should be advisory. They should weigh the evidence and make a *recommendation* to the elected Planning Committee, who retain the legal liability and the vote. This preserves the democratic input of the residents without breaking the statutory framework of planning law.

  Alternatively, the correct analogy is a **Tribunal**. Planning is a regulatory function regarding property rights. Tribunals use lay members, but they are mixed with experts (legal and technical), they follow strict rules of evidence, and their decisions are appealable on points of law.

  ### Conclusion

  The Chair's analogy is rhetorically powerful but legally incoherent. He is trying to solve a political problem (lack of trust in planning) with a judicial solution (juries), while stripping away the judicial safeguards (appeals, legal instruction) that make juries work.

  His four conclusions largely collapse once the disanalogies are exposed. Specifically, the "no appeal" and "ignore policy" points would render the council vulnerable to immediate Judicial Review. The sortition panel works best not as a decision-making body, but as a **deliberative filter**—a Citizens' Assembly that advises the elected members, rather than replacing them. To do otherwise is to confuse the conscience of the public with the administration of the state.
