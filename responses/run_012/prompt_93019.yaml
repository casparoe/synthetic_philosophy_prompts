prompt: |-
  I run the forecasting desk at a small consultancy — about a dozen calls a week, each one a choice between rival models or explanations, and right now we settle it by whoever argues hardest, which is burning client relationships. I want to replace that with an actual procedure built on the real theory of simplicity — Solomonoff induction, Kolmogorov complexity, minimum description length, that stuff — since I gather Occam's razor has a rigorous version and I'd rather use it than the folk version. I know K is uncomputable, so skip the lecture and give me the best usable stand-in plus honest flags on where the stand-in breaks. Relevant context: one of my analysts has taken to gzipping the model spec together with the data and comparing byte counts, and he calls the difference our "explanation budget" — the procedure needs to tell me whether that's legitimate or numerology. Also, a different analyst keeps saying the whole razor is empty because of the no-free-lunch results, and I don't know how to answer him, so if the procedure rests on a bet about what kind of world we're in, say so out loud.

  Write it as a list of questions we run in order: what counts as a good enough answer at each step, where it stops with a flat no, and where it has to come to me because it's a judgment call about what we care about rather than a fact about the world. I'm the one who signs off and I have maybe twenty minutes per call, and the analyst doing the legwork has no stats beyond a first course, so keep the machinery out of his hands. Then run the procedure on three cases: (a) two weather models, one with three times the parameters, where the fat one wins on held-out data by a hair; (b) a client's hypothesis that one hidden actor is behind all of it — short, tidy, and by our own logic that should count in its favour, which I hate; (c) a case where just changing how we encode the variables flips which model comes out simpler. Finish by telling me what the procedure can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Head of forecasting desk at a small consultancy.
      *   **Problem:** Current model selection is based on "who argues hardest," damaging client relationships.
      *   **Goal:** Implement a formal procedure based on algorithmic information theory (Solomonoff, Kolmogorov, MDL) to replace subjective arguing.
      *   **Constraints:**
          *   12 calls/week, ~20 mins/call.
          *   Analysts have limited stats knowledge (1st course).
          *   Needs to be a checklist/procedure (list of questions).
          *   Must address specific internal issues:
              *   Analyst 1: Gzipping model + data (is this legitimate?).
              *   Analyst 2: No-Free-Lunch (NFL) theorem objection (is the razor empty?).
          *   Must run the procedure on three specific cases (Weather, Conspiracy, Encoding).
          *   Must admit limitations (what the procedure *can't* do).
      *   **Tone:** Professional, direct, pragmatic, theoretically grounded but practical. No fluff, no "K is uncomputable" lectures (acknowledged).

  2.  **Deconstruct the Theoretical Core:**
      *   *Solomonoff Induction/Kolmogorov Complexity (K):* Theoretical ideal, uncomputable.
      *   *Minimum Description Length (MDL):* The practical operationalization. It balances model complexity (length of code to describe the model) and fit (length of code to describe data given the model).
      *   *Analyst 1 (Gzip):* This is a crude approximation of MDL. It's not *wrong*, but it's fragile. Gzip measures compressibility, which correlates with K, but depends heavily on the compressor's biases. It needs validation.
      *   *Analyst 2 (NFL):* NFL says no algorithm works best on *all* possible distributions. But we don't live in "all possible distributions." We live in a structured universe. The "bet" is that the world is compressible. This needs to be stated explicitly.
      *   *Encoding Invariance:* K is invariant up to a constant *in the limit*, but for finite data, encoding matters immensely. This is a known weakness of practical MDL.

  3.  **Drafting the Procedure (The Checklist):**
      *   Needs to be sequential.
      *   Needs "Stop/No" conditions.
      *   Needs "Escalate to Boss" (User) conditions.
      *   Needs to handle the Gzip and NFL issues.

      *   *Step 1: Define the Competition.* Are the models predicting the *same* thing on the *same* data? (Crucial for MDL).
      *   *Step 2: The Complexity Count.* How do we measure length? Address the Gzip guy here. Gzip is okay for a sanity check, but we need parameter counts + residual error for the formal score.
      *   *Step 3: The Fit.* Log-likelihood or Sum of Squared Errors. Convert to bits.
      *   *Step 4: The Trade-off.* Compare Total Length (Model + Data|Model).
      *   *Step 5: The "World Bet" (NFL).* Acknowledge the assumption.
      *   *Step 6: Escalation.* When the difference is negligible or encoding is ambiguous.

  4.  **Refining the "Gzip" Issue:**
      *   Is it numerology? Sort of. It's a heuristic. Real MDL uses specific coding schemes (e.g., two-part code). Gzip treats the model spec as text, which ignores semantic complexity (e.g., `y = x` vs `y = x + 0`).
      *   *Verdict:* Allow it as a quick sanity check, but require a standard param-count penalty (like BIC/AIC) for the formal decision.

  5.  **Refining the "NFL" Issue:**
      *   The razor isn't empty; it just assumes the true distribution is among the "simple" ones (low K).
      *   *Verdict:* Explicitly state the "Compressibility Assumption." If the client believes the world is adversarial or random noise, the razor doesn't apply.

  6.  **Developing the Three Cases:**
      *   *(a) Weather Models:* Fat model wins on held-out by a hair.
          *   MDL/BIC will likely penalize the fat model unless the fit improvement is significant.
          *   Decision: Reject fat model unless the "hair" is statistically significant enough to overcome the parameter penalty.
      *   *(b) Conspiracy Theory:* One hidden actor. Short description ("Actor X did it").
          *   Problem: The *description* is short, but the *mechanism* to explain all data might be complex (ad-hoc adjustments).
          *   Decision: Need to encode the *data given the hypothesis*. If "Actor X" requires complex contortions to fit the data, the residual length is huge.
      *   *(c) Encoding Flip:* Changing variable encoding changes simplicity.
          *   This is the "Reference Class" problem.
          *   Decision: Escalate to Boss. This is a judgment call on natural variables.

  7.  **Drafting the Content (Iterative refinement for tone and constraints):**
      *   *Tone:* Authority, efficiency. "Here is the tool. Here is how to use it."
      *   *Formatting:* Numbered list for the procedure. Clear headings for the cases.
      *   *Time Limit:* The procedure must be fast. 20 mins. So, no running custom compressors. Use BIC/AIC as the proxy for MDL (since they are asymptotic approximations of MDL). *Self-Correction:* The user specifically asked for Solomonoff/MDL stuff. I should frame BIC/AIC as the *computable stand-in* for MDL. Gzip is too noisy for client-facing work.
      *   *Addressing the Analysts:* Be direct. Gzip is a heuristic, not a proof. NFL is a philosophical objection, not a practical one *if* we state our priors.

  8.  **Final Review against Constraints:**
      *   List of questions? Yes.
      *   Good enough answer/Stop/Escalate? Yes.
      *   Address Gzip analyst? Yes.
      *   Address NFL analyst? Yes.
      *   Three cases run? Yes.
      *   What it can't do? Yes.
      *   20 mins/Boss sign-off? Yes.

  9.  **Writing the Response:** (Mental check of specific technical points)
      *   MDL = Length(Model) + Length(Data | Model).
      *   BIC $\approx$ MDL for large $N$.
      *   Gzip measures K roughly but is sensitive to syntax.
      *   NFL: We bet on a "benign" universe.
      *   Encoding: This is the "Invariance Thesis" failure in practice.

      *(Self-Correction during drafting)*: Make sure I don't get too bogged down in the math of BIC. Keep it conceptual but actionable. The analysts have basic stats, so they know parameters and likelihood.

      *Refining the Gzip verdict:* It's not *numerology*, it's a "proxy measure." But it's dangerous for client deliverables. I will authorize it for internal screening but require a param-penalty calculation for the final call.

      *Refining the NFL verdict:* The procedure must include a "Premise Check." If the premise fails, stop.

      *Refining the Cases:*
      *   (a) MDL says No to the fat model (usually).
      *   (b) MDL says No to the conspiracy (residuals are huge).
      *   (c) MDL says "Ask the Boss."

      *Final Polish:* Ensure the distinction between "Model Complexity" and "Fit Error" is clear in the checklist.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the procedure. It operationalizes Minimum Description Length (MDL) as the computable stand-in for Kolmogorov complexity. It is designed for a 20-minute turnaround.

  ### The Procedure: MDL Decision Checklist

  **Premise Check (The "No-Free-Lunch" Answer)**
  *   **Question:** Are we forecasting a system that is adversarial, purely random, or actively trying to deceive us?
  *   **Stop/No:** If **Yes**. The simplicity prior assumes the world is compressible (i.e., patterns exist). If the system is white noise or an adversary optimizing against us, Occam's Razor is a liability. Escalate to me.
  *   **Proceed:** If **No**. We are placing a bet that the true data-generating process is among the simpler hypotheses. This is our "World Bet."

  **Step 1: Define the Codebook**
  *   **Question:** Have both models been defined on the *exact* same dataset and target variable?
  *   **Stop/No:** If **No**. You cannot compare description lengths if the data or the "language" (variables) differs. Standardize the inputs.
  *   **Proceed:** If **Yes**.

  **Step 2: Measure Model Length ($L_{model}$)**
  *   **Question:** What is the cost to describe the model structure?
  *   **Analyst 1 (Gzip) Ruling:** Gzipping the spec file is a **heuristic proxy**, not a proof. It measures syntax compression, not semantic complexity.
      *   *Legitimate:* As a quick internal sanity check.
      *   *Numerology:* If used as the final client-facing metric. Different text formatting changes byte counts without changing model complexity.
  *   **Action:** Calculate the parameter penalty. Use the Bayesian Information Criterion (BIC) formula as our standard: $k \times \ln(n)$, where $k$ is parameters and $n$ is data points. This is the rigorous, computable approximation of MDL for our sample sizes.
  *   **Escalate:** If the models are non-parametric (e.g., raw neural nets) where $k$ is ambiguous.

  **Step 3: Measure Error Length ($L_{data|model}$)**
  *   **Question:** How many "bits" does it take to describe the errors?
  *   **Action:** Calculate the log-likelihood of the data given the model. In practice, use the Sum of Squared Errors (SSE) or Deviance. Lower error = shorter description of the residuals.
  *   **Stop/No:** If one model has significantly higher error *and* higher complexity. Reject it immediately.

  **Step 4: The Trade-Off**
  *   **Question:** Does the reduction in Error Length justify the increase in Model Length?
  *   **Calculation:** Compare the BIC scores (Lower is Better). $\Delta BIC > 10$ is strong evidence. $\Delta BIC < 2$ is inconclusive.
  *   **Escalate:** If $0 < \Delta BIC < 2$. This is the "indifference zone." The math cannot distinguish them. This is a business judgment on risk, not a fact about the world. Come to me.

  **Step 5: Encoding Sensitivity**
  *   **Question:** Does the "simpler" model depend on a specific, non-standard transformation of the variables (e.g., log vs. linear, specific binning)?
  *   **Escalate:** If **Yes**. If changing the units or encoding flips the winner, the "simplicity" is an artifact of the representation, not the phenomenon. This is a judgment call on "natural variables." Come to me.

  ***

  ### Case Runs

  Here is how the procedure handles your three current headaches.

  **(a) The Weather Models (Fat vs. Thin)**
  *   **Scenario:** Model A (3 params) vs. Model B (9 params). Model B wins on held-out data by a hair.
  *   **Run:**
      1.  **Premise:** Weather is compressible. Proceed.
      2.  **Model Length:** Model B pays a heavy penalty ($k=9$ vs $k=3$).
      3.  **Error Length:** Model B's error is lower, but "by a hair."
      4.  **Trade-off:** In MDL/BIC terms, a "hair" of improvement rarely offsets a $3\times$ parameter increase unless $n$ is massive. The penalty term $\ln(n)$ grows with data.
  *   **Verdict:** **Reject Model B.** The procedure favors Model A. The "win" on held-out data is likely noise fitting.
  *   **Note to Analyst:** Tell the pro-B analyst that unless the likelihood ratio exceeds the parameter penalty, they are overfitting. Simplicity is the tie-breaker, and here it is the *veto*.

  **(b) The Conspiracy Hypothesis (One Hidden Actor)**
  *   **Scenario:** "One hidden actor caused all events." Short description, fits the "One Actor" narrative perfectly.
  *   **Run:**
      1.  **Premise:** Social systems are compressible. Proceed.
      2.  **Model Length:** Very short. "Actor X did it" is low $k$.
      3.  **Error Length:** **Critical Failure.** To make "Actor X" fit *all* the data, you need complex auxiliary assumptions (e.g., "Actor X hid here," "Actor X faked that").
      4.  **Trade-off:** You must encode the *data given the hypothesis*. If the hypothesis requires ad-hoc adjustments to fit the observations, the $L_{data|model}$ explodes.
  *   **Verdict:** **Reject.** The "shortness" of the claim is a trap. MDL measures the length of the *explanation*, not the *slogan*. If the mechanism required to make the slogan fit the data is complex, the total description length is huge.
  *   **Note to Analyst:** Tell the pro-conspiracy analyst: "The model isn't 'One Actor', the model is 'One Actor + 50 specific exceptions'. Count the exceptions."

  **(c) The Encoding Flip**
  *   **Scenario:** Model A is simpler in linear space. Model B is simpler in log space.
  *   **Run:**
      1.  **Premise:** Proceed.
      2.  **Model Length:** Depends on the space.
      3.  **Encoding Sensitivity:** **Triggered.** The winner changes based on how we write the numbers.
      4.  **Trade-off:** Mathematically undefined without a prior on the "natural" scale.
  *   **Verdict:** **Escalate to Me.**
  *   **Note to Analyst:** This is where the theory breaks. Kolmogorov complexity is invariant only up to a constant *in the limit*. With finite data, the constant matters. I need to decide which variable scale makes sense for the *client's* reality, not just the math.

  ***

  ### What This Procedure Cannot Do

  1.  **It Cannot Find Truth:** It finds the most *efficient compression* of the data. If the world is actually complex and messy, this procedure will systematically bias you toward wrong, simple models. (See Premise Check).
  2.  **It Cannot Resolve Encoding Disputes:** As seen in Case (c), "simplicity" is relative to the language used. The math cannot tell you if "log-price" is more natural than "price." That requires domain expertise, not statistics.
  3.  **It Cannot Handle "Black Swan" Priors:** If a rare event is catastrophic (e.g., bridge collapse), a simple model that misses the tail risk is dangerous. MDL optimizes for average description length, not worst-case risk. If the cost of being wrong is asymmetric, override the procedure.
  4.  **It Is Not Causal:** A simple correlation compresses data just as well as a simple causal mechanism. This procedure selects the best *predictor*, not the best *explanation*. Do not sell it as causal proof without further structural analysis.

  **Implementation:** Print the Checklist. If an analyst comes to you without the BIC scores and the Premise Check filled out, send them back. That saves you 15 minutes per call.
