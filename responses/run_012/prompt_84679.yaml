      *   Intro: Define Rule 1 (SSA-style) as Indifference over Actuals. Define Rule 2 (SIA-style) as Conditionalization on Existence.
      *   Demon Case:
          *   Rule 1: You are a random actual. Void is impossible. Small is favored (1/1 vs 1/1T).
          *   Rule 2: You are a random possible. Void is impossible. Large is favored (1T vs 1).
          *   Coin A: Rule 1 treats "I exist" as a tautology once reasoning starts. Rule 2 treats it as the primary evidence.
      *   Reference Class: Rule 1 is circular (needs world to define class). Rule 2 is modal (needs metaphysics).
      *   Reduction: Fails. Dilution vs. Multiplication. One is about *where*, one is about *that*.
      *   Conclusion: Rivals only if we confuse self-location with world-creation.

