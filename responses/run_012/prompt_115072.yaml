      *   *Correction:* Make sure to distinguish between *A Treatise on Probability* (1921) and *The General Theory* (1936). The "logical relation" stuff is 1921. The "convention" stuff is 1936. The Prof is likely conflating them, which is common but worth noting.
      *   *Nuance on RE:* Rational Expectations doesn't require knowing the *future*, it requires knowing the *distribution* of the future. The Prof's slogan "we don't know the future" is a strawman against RE unless interpreted as "we don't know the distribution." I need to make sure the user clarifies this distinction.
      *   *Nuance on "Arbitrary":* Bayesianism argues priors aren't arbitrary if updated. Keynes argues that without logical grounding, they *are* arbitrary. This is the crux.

