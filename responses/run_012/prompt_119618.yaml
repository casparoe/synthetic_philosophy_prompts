      *   *Check:* The "illusion" point. In *IASL*, Hofstadter does use the word "illusion" occasionally regarding the *homunculus*, but he fiercely defends the reality of the *pattern*. I need to be precise: The *feeling* of a little person inside is the illusion; the *pattern* is real. The acquaintance's summary conflates these.
