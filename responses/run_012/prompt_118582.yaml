      *   *Deep POV/One Mind Per Scene:* Assumes a unified subject of experience. It treats consciousness as a coherent narrative stream available for reporting. It assumes access to "truth" about that character's internal state.
      *   *Cartesian Theater:* Implies a central viewer inside the head. Deep POV mimics this by offering a seamless feed of thoughts/feelings.
