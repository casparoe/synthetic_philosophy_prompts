  The deep-POV convention presupposes a unified, transparent self, effectively smuggling in the Cartesian theater. However, this is largely a coherence heuristic for readers rather than an ontological claim, meaning the craft survives even if the philosophy is false.

  The "one mind per scene" rule is a pragmatic constraint to prevent reader confusion, not a metaphysical stance. It survives the Multiple Drafts model because it manages attention, not truth. However, the stricter injunction—that every sentence must be filterable through what the character "knows" or "notices"—assumes the character has privileged, immediate access to their own mental states. This is where the Cartesian Theater hides. It implies a central observer who witnesses feelings before narrating them. The Multiple Drafts model suggests there is no such witness; there are only competing narratives finalized at the moment of expression.

  If you take Multiple Drafts seriously, Deep POV doesn't vanish, but its authority dissolves. On the page, this changes how interiority is rendered. Instead of seamless access ("He felt angry"), the narrative tracks the construction of that feeling ("A heat rose in his chest; he decided this must be anger"). The character becomes an interpreter of their own physiology rather than a witness to their soul. You would write the lag between stimulus and articulation. You would show the character misinterpreting their own motives until later in the scene, treating their own thoughts as hypotheses rather than facts. Stress-testing this reveals a fracture: if consciousness is retrospective, strict "in the moment" Deep POV is technically impossible, because the character doesn't know what they feel until they narrate it.

  Does the convention need the Theater? Only if you claim it represents reality. If you treat it as a stylistic contract, it is compatible with Multiple Drafts. Readers crave the illusion of the Theater, even if the mind doesn't work that way. To engineer this, introduce friction. Show the gap between impulse and thought. Make the "single interior room" a space where many voices argue, and the POV character is merely the scribe who wins the vote.

  Ultimately, the advice is useful craft shorthand for maintaining narrative focus, but it becomes philosophically brittle when presented as a moral rule about truth. You can respect Multiple Drafts by treating interiority as unreliable and emergent. The camera doesn't point at a finished show; it records the editing suite. The convention survives, but it stops pretending to be a mirror of nature.
