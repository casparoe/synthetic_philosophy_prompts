          *   *Claim:* Combatants on both sides have equal *jus in bello* rights and obligations. They can be targeted; they can target. Their individual moral status is equal *regarding the act of fighting*, regardless of the justice of the cause.
          *   *Rationale:* Soldiers are instruments of the state, coerced, lack full information, and distinguishing guilt in the fog of war is impossible/practical.
      *   **Revisionist Just War Theory (McMahan, Rodin, etc.):** Challenges MEC.
          *   *Claim:* If a war is unjust, the combatants fighting it are essentially engaged in aggravated assault or murder. They do *not* have the right to kill just combatants. MEC is false.
          *   *Rationale:* Self-defense rights depend on liability. Unjust combatants are not liable to be killed by just combatants in the same way.
      *   **Legal vs. Moral:** International Humanitarian Law (IHL) codifies MEC (Geneva Conventions). Philosophy debates the *moral* truth of it.
      *   **Culpability:** Even if MEC holds legally, does it hold morally? Most philosophers say *some* culpability remains for fighting an unjust war, even if *in bello* rules are followed.
      *   **Conscription vs. Volunteering:** Affects individual culpability (duress/agency), but not necessarily the structural MEC in IHL.

