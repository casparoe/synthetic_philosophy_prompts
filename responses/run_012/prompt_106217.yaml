prompt: |-
  My younger brother just got deployed and now he keeps saying that because of the moral equality of combatants in just war theory, he and the enemy are morally interchangeable, so he shouldnt feel responsible for anything as long as he only targets enemy combatants and follows the rules of engagement. If his side turns out to be fighting an unjust war, he says it doesnt matter for his individual guilt, because both sides are equal. I said that cant be right, because then punishing aggression after a war would just be victor's justice. He said maybe it is. I'm trying to get this straight. Can you explain what the equality claim actually says and what it doesnt? Does it really mean an individual soldier has no extra culpability for fighting in a war he believes is unjust? And if it doesnt, what is left of the equality thesis? Someone told me it's about who may kill whom, not about who is a better person, but I dont see how that helps if the unjust side's soldier is still doing something wrong by fighting. Also, what if the enemy soldier is a conscript who was forced to fight while my brother volunteered? Does that change anything?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
