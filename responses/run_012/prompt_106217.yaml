      *   *Correction:* MEC does *not* mean "anything goes" or "no responsibility." It specifically refers to *symmetry in the rules of fighting*, not symmetry in the *reason for fighting*.
      *   *Risk:* If he believes he is "morally interchangeable" with someone he might view as a terrorist or aggressor, it could lead to detachment or, conversely, if he realizes the war *is* unjust, it could lead to moral injury.
