answer: |-
  The tension you have identified is real, and it cuts to the heart of the difference between philosophical epistemology and legal epistemology. Your observation is astute: the courtroom does not operate on a unified theory of *knowledge*, but rather on a unified theory of *verification*.

  Here is the implicit theory, an accounting of its philosophical commitments, the comparison to the encyclopedia, and the consequences of your proposed rule change.

  ### 1. The Implicit Theory: Procedural Reliabilism

  The law of evidence does not rest on an **ethics of assertion** (what a speaker is permitted to say based on their mental state). It rests on an **epistemology of institutional reliability** (what a fact-finder is permitted to believe based on the testing process).

  Stated plainly: **A witness is not a source of knowledge; they are a mechanism for evidence testing.**

  The courtroom presupposes that "knowledge" in a legal sense is not a mental state possessed by an individual, but a status conferred upon a proposition after it has survived adversarial testing.
  *   **The Lay Witness (Hearsay):** When the neighbor spoke to the witness, the neighbor was not under oath, not subject to cross-examination, and the jury could not observe their demeanor. Therefore, even if the witness *knows* (philosophically) that the neighbor said it, the *proposition* contained in the statement lacks procedural warrant. The rule protects the jury from relying on untestable data.
  *   **The Lay Witness (Opinion):** When a lay witness offers an opinion ("he looked drunk"), they are usurping the jury's role. The jury is the designated "knower" of inferences. The witness provides raw data (slurred speech, stumbling); the jury generates the knowledge (intoxication).
  *   **The Expert Witness:** The expert is the exception that proves the rule. The jury *cannot* generate the inference from the raw data (e.g., lividity patterns to time of death) because they lack the specialized methodology. The expert is not testifying to a fact they witnessed; they are testifying to the **reliability of a method** applied to facts in evidence. Their "uncertainty" is admissible because science is probabilistic; the law accepts probabilistic warrant when the methodology is sound and cross-examinable.

  **The Core Presupposition:** The system assumes that **testimonial knowledge transfer is defective unless the source is present.** It prioritizes the *hearer's* ability to verify over the *speaker's* state of certainty.

  ### 2. Accounting of Commitments

  You asked how much of this practice commits to specific philosophical accounts (Knowledge, Truth, Evidential). The honest accounting is that the legal practice is **agnostic about metaphysics but rigid about process.**

  *   **The Knowledge Account (Assertion requires Knowledge):**
      *   *Fit:* Poor.
      *   *Why:* As you noted, the lay witness *knows* the neighbor made the statement. To forbid this assertion violates the knowledge norm. Conversely, the expert often lacks "knowledge" (in the sense of certainty or direct perception) regarding the cause of death, yet is permitted to assert.
      *   *Commitment:* The law quietly rules out the idea that individual knowledge is sufficient for public assertion. It assumes knowledge is not fully transferable via second-hand testimony.

  *   **The Truth Account (Assertion requires Truth):**
      *   *Fit:* Poor.
      *   *Why:* The court admits testimony that turns out to be false (if procedurally correct) and excludes testimony that turns out to be true (if hearsay).
      *   *Commitment:* The law admits it cannot access "Truth" directly. It can only access "Procedural Correctness." It presupposes that truth is best approximated by conflict (adversarial system), not by accurate reporting.

  *   **The Evidential/Justification Account (Assertion requires Adequate Reason):**
      *   *Fit:* Best, but with a caveat.
      *   *Why:* This fits the expert testimony perfectly (adequate reason via methodology). It fits the lay witness restriction (no adequate reason to believe the hearsay content because the source is absent).
      *   *Commitment:* The law commits to a **socialized justification**. It is not enough that *you* have adequate reason; the *jury* must be able to evaluate the reason. This is why the encyclopedia rule feels similar (see below).

  **What is left open?** The law leaves open whether the witness actually *knows* anything. It treats the witness as a conduit. If the conduit is blocked (hearsay) or the output is redundant (lay opinion), the flow stops. If the conduit requires a translator (expert), the translator is allowed, even if they admit the translation is an estimate.

  ### 3. The Encyclopedia Analogy

  The rule you noticed in the online encyclopedia (no original research; verify via published sources) is indeed the **same shape of puzzle**, but it serves a different master.

  *   **The Court:** Prioritizes **Confrontation.** The goal is to test the reliability of the information through conflict. Hearsay is excluded because the original speaker cannot be cross-examined.
  *   **The Encyclopedia:** Prioritizes **Consensus and Verifiability.** The goal is to record established public knowledge, not to discover new truth. First-hand knowledge is excluded because it is not yet *publicly vetted*.

  **The Shared Epistemology:** Both institutions distrust **private epistemic authority.**
  *   In court, your private knowledge of what the neighbor said is worthless because we can't check the neighbor.
  *   In the encyclopedia, your private knowledge of a historical fact is worthless because we can't check your source.

  Both systems assume that **knowledge becomes actionable only when it is externalized and subject to public scrutiny.** They both reject the "ethics of assertion" (I know it, so I say it) in favor of an "economics of evidence" (Can this claim be audited by the community?).

  ### 4. The Hypothetical: "Assert Exactly What You Know"

  Suppose we replaced the Federal Rules of Evidence with a single flat rule: *A witness may assert exactly what he knows, and nothing else.*

  Here is what would actually change in the courtroom:

  1.  **The Collapse of the Hearsay Rule:**
      *   The witness *knows* the neighbor said, "I saw the defendant with the gun." Under a strict knowledge norm, the witness must be allowed to testify to this.
      *   *Consequence:* Trials would become games of "telephone." The prosecution could bypass the neighbor (who might be unavailable or unconvincing) and use the friend who heard the story. The Confrontation Clause of the Constitution would be effectively nullified. The jury would be flooded with untestable assertions.

  2.  **The Silencing of Experts:**
      *   Does the pathologist *know* what caused the death? In a strict philosophical sense, no. They have a high-confidence inference based on probabilistic data. They concede uncertainty under cross-examination.
      *   *Consequence:* If the rule requires "Knowledge" (implying certainty or direct perception), experts could not testify to causes, only to observations ("I saw a wound," not "This wound killed him"). The jury would be left with raw data they are ill-equipped to interpret. Verdicts would become guesses.

  3.  **The Elimination of Lay Opinion:**
      *   A witness *knows* their own mental states. "I believed he was angry." Under a knowledge rule, this becomes admissible.
      *   *Consequence:* The trial shifts from "What happened?" to "What did everyone feel?" The jury's role as the sole evaluator of inferences is usurped by the witnesses' internal certainties.

  4.  **The Epistemic Shift:**
      *   Currently, the courtroom is a **filter**. It excludes data that cannot be tested.
      *   Under your rule, the courtroom becomes a **container**. It collects all available mental states labeled as "knowledge."
      *   *Result:* The system would likely become less accurate. By prioritizing the *speaker's* internal warrant over the *hearer's* ability to verify, you maximize the volume of information but minimize its reliability.

  ### Summary

  The legal system presupposes that **knowledge is a collective achievement, not an individual possession.**

  It forbids the lay witness from sharing the neighbor's story not because the witness is lying, but because the *chain of verification* is broken. It permits the expert to offer an opinion not because the expert is omniscient, but because the *method of verification* is robust.

  The practice commits to a **Procedural Reliabilism**. It rules out the idea that testimony can transmit knowledge without the possibility of challenge. If you switched to a "Knowledge Rule," you would privilege the individual's epistemic state over the community's ability to validate it, likely resulting in a system that feels more honest to the witnesses but produces less reliable verdicts for the society.
