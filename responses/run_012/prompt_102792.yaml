  Node 2: Is the Born rule derived from the mathematical structure of the wavefunction itself, or is it added as a new axiom independent of unitary evolution? If you think the squared amplitude follows from symmetry or structure without new assumptions, you arrive at Leaf 1. If you think the squared amplitude is simply a new postulate bolted onto the theory, you arrive at Leaf 2.

  Node 3: Does the agent experience genuine uncertainty about which branch they inhabit during the measurement process? If you think there is room for uncertainty despite branching, proceed to Node 4. If you think there is no uncertainty because all outcomes happen deterministically, proceed to Node 5.

  Node 4: Is this uncertainty grounded in constraints on rational betting behavior across branches, or is it brute ignorance of self-location among identical copies? If rational betting behavior does the work, you arrive at Leaf 3. If the self-locating line on which the agent's uncertainty about which branch it inhabits does the work, you arrive at Leaf 4.

  Node 5: Is the lack of genuine uncertainty a fatal flaw that undermines the theory, or is it an illusion that the theory should explain away? If the view is that the felt probability is an illusion the theory should explain away rather than reproduce, you arrive at Leaf 5. If it is a fatal flaw, proceed to Node 6.

  Node 6: Does the theory require extra hidden variables to recover probability, or must the Many-Worlds framework be abandoned entirely? If the program needs an extra ingredient to function, you arrive at Leaf 6. If the critical view is that no consistent notion of probability can be attached to a branching universe at all, so the program fails, you arrive at Leaf 7.

  The leaves
  Leaf 1: Objective Derived. Characterization: The Born rule follows from the wavefunction's symmetry properties without extra postulates. Awkward Commitment: It assumes equiprobability of swapped states without independent justification.

  Leaf 2: Axiomatic Everettian. Characterization: The squared amplitude is simply a new postulate bolted onto the theory alongside unitary evolution. Awkward Commitment: It introduces redundancy in a deterministic theory that claims to need only the wavefunction.

  Leaf 3: Decision-Theoretic. Characterization: The decision-theoretic line on which a rational branching agent's betting behavior is what makes the amplitudes its probabilities. Awkward Commitment: It assumes classical rationality axioms apply unchanged to branching futures.

  Leaf 4: Self-Locating Uncertainty. Characterization: The self-locating line on which the agent's uncertainty about which branch it inhabits does the work. Awkward Commitment: It requires a temporal gap between branching and observation to sustain ignorance.

  Leaf 5: Illusionism. Characterization: The view that the felt probability is an illusion the theory should explain away rather than reproduce. Awkward Commitment: It undermines the empirical confirmation of the theory which relies on probabilistic predictions.

  Leaf 6: Hidden Variable Hybrid. Characterization: The program needs an extra ingredient, such as hidden variables, to make sense of probability. Awkward Commitment: It abandons the pure unitary ontology that motivated Many-Worlds initially.

  Leaf 7: Incoherence and Rejection. Characterization: The critical view that no consistent notion of probability can be attached to a branching universe at all, so the program fails. Awkward Commitment: It forces a return to collapse theories or pilot-wave interpretations despite their costs.

  Branches nobody occupies
  No one occupies the path combining Objective Probability with No Uncertainty and Illusionism. If probability is an objective feature of the world, calling it an illusion contradicts its ontological status. Similarly, the path combining Subjective Probability with Uncertainty but no Rationality or Ignorance is empty. If agents are uncertain, that uncertainty must be grounded in either rational constraints or brute ignorance; leaving it ungrounded makes the probability arbitrary. Finally, Objective Derived probability leading to Fatal Flaw is unoccupied because if the rule is derived from the structure, the theory is usually considered successful, not failed.

  Positions the tree cannot separate
  This instrument cannot distinguish between variants of Decision-Theoretic accounts that use different sets of rationality axioms to derive the Born rule. It also fails to separate Self-Locating accounts that place the uncertainty pre-measurement from those that place it post-measurement but pre-observation. These differences are significant to specialists but do not change the structural position of the account within this decision tree.
