      *Actually, let's look closer at the sentence:* "Relation R, which is memory continuity". Parfit explicitly argues against the Memory Criterion (Locke) because of the transitivity problem. He proposes Psychological *Continuity* (which relies on overlapping chains of connectedness, including memory but also intention, character, etc.). Conflating R with Memory is a specific philosophical error regarding the history of the debate (Locke vs. Parfit). This is a definite mark deduction.

