  7.  **Self-Correction/Review during drafting:**
      *   *Wait, is "memory continuity" definitely wrong?* Parfit distinguishes between *Connectedness* (direct links, like memory) and *Continuity* (overlapping chains). Relation R is "Psychological Connectedness and/or Continuity." Reducing it *only* to memory is a common student mistake. It misses intentions, character traits, etc. I need to make sure the Novelist knows this is the main deduction point.
