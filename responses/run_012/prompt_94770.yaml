answer: |-
  1. **Ireland (Ideology and Capability)**
  You argue that famine becomes a crime under the condition of "known shortfall, unaddressed." In the Irish case, however, the British administration did not merely find relief inconvenient; their ideology—laissez-faire economics combined with a providential reading of the blight—rendered intervention *illegitimate* rather than just difficult. Does your phrase "could have acted" survive a case where the remedy was physically possible but morally forbidden by the governor's own worldview?

  2. **Ireland (Follow-up)**
  If you maintain that ideological commitment does not excuse inaction, does that imply any governing philosophy that permits starvation is inherently criminal, regardless of its internal coherence or popularity at the time?

  3. **Bengal (Market Mechanics vs. State Override)**
  You group Bengal with the GLF on the grounds that state authority overridden a functioning food market. But Amartya Sen describes Bengal as an entitlement collapse among rural wage-earners—isn't that a market clearing in the ordinary way, accelerated by war and a cyclone, rather than a state actively overriding the market?

  4. **Bengal (Follow-up)**
  If you concede that Bengal was primarily a market failure exacerbated by war rather than a direct state override, what remains of your "single series" claim? Does grouping it with the GLF stretch the definition of "distributive choice" until it breaks?

  5. **GLF (Intent and the Definition of Crime)**
  Regarding the Great Leap Forward, you remove intent to starve from the definition of crime. If intent is not required, does the term "crime" do any work beyond describing a "very bad outcome"?

  6. **GLF (Follow-up)**
  If you retreat to "foreseeability" as the distinguishing factor, what specific standard of foreseeability would you be willing to accept from your opponents to prove a regime *could not* have known the outcome?

  7. **Informational Thesis (Press and Autocracy)**
  You claim the famine-prevention mechanism in democracies is informational—a free press—rather than electoral. How do you account for famines that have occurred under a comparatively free press, or authoritarian states that avoided famine altogether?

  8. **Informational Thesis (Follow-up)**
  If you reply that the press is necessary but not sufficient, please name the other necessary conditions. Do those conditions not carry more explanatory weight than the ballot box you dismiss?

  9. **Falsification**
  Stepping back from the specific cases, what specific piece of historical evidence would count against your thesis as a whole? Is there a famine that, if proven to be purely natural, would falsify your claim?

  10. **Ranking**
  Finally, if you must rank the Irish famine, the Bengal famine, and the Great Leap Forward by culpability, how do you order them, and how does your "known shortfall, unaddressed" test defend that ranking against the charge that one was imperial neglect, one was wartime chaos, and one was revolutionary zeal?
