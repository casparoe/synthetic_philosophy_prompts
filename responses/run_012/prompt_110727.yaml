answer: |-
  In the 1880s, the **Theory of the Tensioned Plerum** posited that space is filled with an incompressible, elastic medium anchored to absolute rest, where material bodies are nodes connected by microscopic, massless filaments; the gravitational force between two bodies was defined by the filament tension $T_{ij} = -k(r_{ij} - L)$, where $r_{ij}$ is the Euclidean distance and $k$ is a universal stiffness constant. In the 1920s, this was displaced by the **Theory of the Affine Manifold**, which describes space as a Riemannian manifold where bodies follow geodesics determined by the curvature tensor $R^\mu_{\nu\rho\sigma}$, with no medium or filaments existing. The structural isomorphism is exact in the weak-field limit: the filament extension vector $\vec{e} = (r_{ij} - L)\hat{r}$ corresponds to the geodesic deviation vector $\xi^\mu$, and the stiffness constant $k$ corresponds to the relevant component of the Riemann curvature tensor $R^\mu_{\nu\rho\sigma}u^\nu u^\sigma$; the equilibrium condition of zero net tension maps precisely to the geodesic equation. However, the ontologies are incompatible: the Plerum requires absolute simultaneity to define the instantaneous tension of rigid filaments, which is impossible in the Affine Manifold's relativistic spacetime. The successor is empirically superior because the Plerum predicts no interaction with massless radiation (filaments only anchor mass), whereas the Affine Manifold correctly predicts the deflection of light, an improvement owed precisely to replacing the material filament with the geometric metric, which couples to energy-momentum rather than mass alone.

  **1. Conclusions on Retention**
  *   **The Epistemic Structural Realist** concludes that the *mathematical relations* governing the deviation of trajectories were retained (the isomorphism between tension and curvature), meaning the earlier theory captured the structural truth of the world even though its picture of "filaments" was false.
  *   **The Entity Realist** concludes that no content regarding the *cause* was retained; since we cannot manipulate filaments (only masses), belief in them was never licensed, and the "structure" is merely a record of how the real entities (masses/energy) behave, not a description of the mechanism connecting them.
  *   **The Anti-Realist** concludes that nothing was retained but instrumental utility; the fact that a false ontology (filaments) could generate the same predictive structure as the current theory proves that empirical success is no guide to truth, and the current theory will likely suffer the same fate.

  **2. The Work-Doing Feature**
  The feature doing the work is the **linearized equation of motion** (the mapping of Hooke's Law to the Geodesic Deviation Equation). This specific mathematical identity allows the structuralist to point to a symbol-for-symbol continuity between the theories. If this feature is removed—for instance, if the successor theory required a non-linear correction that broke the one-to-one mapping with the filament tension—the claim of structural continuity would collapse, revealing the isomorphism as merely an approximation rather than a preserved truth.

  **3. The Entity Realist's Attack**
  The strongest attack available to the Entity Realist, distinct from the triviality objection, is the **Causal Inertia of Relations**. The Entity Realist argues that structure describes *how* things relate, but relations themselves possess no causal power; only relata (entities with properties) can act. In the Plerum, "tension" was a property of a material filament capable of pulling; in the Affine Manifold, "curvature" is a geometric property of space. By discarding the relata (the filament), the Structuralist retains a map of correlations but loses the *mechanism* that makes the correlations necessary. Consequently, the Structuralist is left believing in a mathematical ghost—a structure that predicts outcomes but explains nothing, as there is no longer any "thing" to bear the causal load of the interaction.
