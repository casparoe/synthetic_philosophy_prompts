answer: |-
  This is a high-stakes pedagogical moment. If you run a standard Bongard problem, students find the "clever" answer and leave thinking intelligence is about finding the *one* hidden truth. To teach underdetermination, you must rig the game so the "truth" fractures.

  Here is a complete design for the 90-minute seminar, including the specific visual materials, the script for the "crisis" moment, and the theoretical mapping.

  ### 1. The Materials (Exact Specifications)

  You need three slides/handouts. Do not use existing Bongard problems; they are designed to have unique solutions. You must build these from scratch to ensure logical ambiguity.

  **Slide 1: The Training Set (The "Bongard")**
  *   **Layout:** Two panels. Left Panel labeled **"YES"**, Right Panel labeled **"NO"**.
  *   **YES Panel (6 items):** 6 Equilateral Triangles. All filled **Solid Red**.
  *   **NO Panel (6 items):** 6 Squares. All filled **Solid Blue**.
  *   *Design Note:* Keep size and orientation identical. The only variables are Shape (Triangle/Square) and Color (Red/Blue). This creates a perfect confound.

  **Slide 2: The Test Set (The "Hold-out")**
  *   **Layout:** 4 New Shapes, unlabeled.
  *   **Item A:** A **Blue** Triangle.
  *   **Item B:** A **Red** Square.
  *   **Item C:** A **Green** Circle.
  *   **Item D:** A **Red** Triangle (duplicate of training, serves as a control).

  **Slide 3: The Reveal (Keep hidden until the end)**
  *   Shows the three rules that fit Slide 1 perfectly but diverge on Slide 2.

  ---

  ### 2. Timeline & Facilitation Script

  #### 00:00 – 00:10 | Introduction: The Inductive Gap
  *   **Hook:** "We assume that if we see enough examples, the concept reveals itself. Today we're going to test whether data *constrains* meaning or *determines* it."
  *   **Instruction:** "You are in pairs. You will see 12 shapes. 6 belong to a concept, 6 do not. Your job is not to find *the* answer. Your job is to find *a* rule that fits all 12 perfectly."

  #### 00:10 – 00:25 | Phase 1: Rule Generation
  *   **Action:** Display Slide 1.
  *   **Task:** Pairs write down their rule.
  *   **Constraint:** "The rule must be explicit enough that a computer could execute it. No 'it feels like a triangle.'"
  *   **Instructor Move:** Circulate. If a pair says "It's triangles," ask: "Does 'It's Red' fit the data just as well?" If they say yes, tell them: "Write both down."
  *   **Goal:** You want at least one pair to commit to **Shape** and one pair to commit to **Color**.

  #### 00:25 – 00:40 | Phase 2: The Generalization Test
  *   **Action:** Display Slide 2 (Test Set).
  *   **Task:** "Apply *your* rule to these four new items. Mark them YES or NO."
  *   **Scoring/Payoff:** "I'm not scoring correctness yet. I'm scoring **commitment**. You must lock in your labels."
  *   **The Trap:** As they work, walk around and note the disagreements.
      *   Pair 1 (Shape Rule): Blue Triangle = YES.
      *   Pair 2 (Color Rule): Blue Triangle = NO.
  *   **Public Commitment:** Ask pairs to hold up cards (or write on board) for Item A (Blue Triangle) and Item B (Red Square).
  *   **The Crisis Moment:** When you see the split (e.g., half the class says YES, half says NO for the Blue Triangle), **stop the room.**
  *   **Script:** "Look at the board. Half of you say this Blue Triangle is IN. Half say it is OUT. You all looked at the *same* 12 training examples. You all found rules that fit the training data 100%. How is this possible?"

  #### 00:40 – 00:55 | Phase 3: The Reveal
  *   **Action:** Display Slide 3.
  *   **Narrative:** "I did not have one rule in mind. I had three. All three fit the original 12 shapes perfectly. All three disagree on the new shapes."
  *   **Rule 1 (The 'Natural' Bias):** `IF Shape == Triangle THEN YES ELSE NO`
      *   *Fits Training:* Yes.
      *   *Test Prediction:* Blue Triangle = YES.
  *   **Rule 2 (The 'Surface' Bias):** `IF Color == Red THEN YES ELSE NO`
      *   *Fits Training:* Yes.
      *   *Test Prediction:* Blue Triangle = NO.
  *   **Rule 3 (The 'Gerrymandered' Logic):** `IF (Color == Red) OR (Sides == 3) THEN YES ELSE NO`
      *   *Fits Training:* Yes. (Pos: Red & 3 sides. Neg: Blue & 4 sides).
      *   *Test Prediction:* Blue Triangle = YES (due to sides). Red Square = YES (due to color).
  *   **Point:** "Rule 3 is ugly. It's disjunctive. But logically, it is just as valid as Rule 1 based *only* on the training data."

  #### 00:55 – 01:15 | Debrief: Mapping to Theory
  Connect the activity to the course concepts. Use the board to draw the mapping.

  1.  **Underdetermination (Quine/Duhem):** "The data (12 shapes) underdetermines the theory (the rule). Infinite rules fit finite data."
  2.  **The Rashomon Set (Breiman):** "In ML, the set of models that fit the data equally well is called the Rashomon Set. You just found three members of it. In real modeling, we usually pick one and pretend it's the truth."
  3.  **Inductive Bias (Mitchell):** "Why did most of you prefer Rule 1 (Shape) over Rule 2 (Color)? Not because of the data. Because of *you*. You brought a bias that 'object identity' matters more than 'surface color.' That bias is necessary. Without it, you couldn't learn. But it is not *true* by virtue of the data."
  4.  **No Free Lunch Theorem:** "If you average performance over all possible worlds, no algorithm is better than random. You only win because the world we live in resembles your biases (shapes tend to be more stable than lighting/color)."

  #### 01:15 – 01:30 | Q&A and Limitations
  *   Open floor for discussion on how this applies to their specific field (psych, CS, linguistics).
  *   **Closing:** "Next time you see a model claim '99% accuracy,' ask: Which member of the Rashomon set did you pick? And who told you that one was the real world?"

  ---

  ### 3. What Will Predictably Go Wrong (And How to Fix It)

  **Problem 1: The "Early Guesser"**
  *   *Scenario:* In minute 12, a student says, "It's obviously triangles. The color is a distractor."
  *   *Risk:* The class deflates. They think the puzzle is solved.
  *   *Fix:* Validate but pivot. "Excellent. That rule fits 100% of the data. I'm going to give you 2 points for that. Now, I need a different rule from another pair that *also* fits 100% of the data but is *different*. If you find one, you get 5 points."
  *   *Why:* This gamifies the search for the Rashomon set rather than the "truth."

  **Problem 2: The "Meta-Game" Guess**
  *   *Scenario:* A student says, "It's whatever *you* think it is."
  *   *Risk:* They disengage from the logic and try to read your mind.
  *   *Fix:* "For the first 25 minutes, I literally do not have an answer. I am as confused as you are. I am bound by your rules. If your rule fits the 12 shapes, it is valid." (This is technically a lie since you have the intended rule, but it's a pedagogical necessity to force engagement with the data).

  **Problem 3: No Disagreement on Test Set**
  *   *Scenario:* Everyone picks "Triangle." No one picks "Red."
  *   *Risk:* The lesson on underdetermination fails.
  *   *Fix:* You must intervene in Phase 1. If you hear no one discussing color, say: "I'm hearing a lot about geometry. Is there a rule about surface properties that fits?" If necessary, seed a pair beforehand (a confederate or a hint) to propose the Color rule.
  *   *Better Fix:* Change the scoring. "Most common rule gets 1 point. Most *unique* valid rule gets 3 points."

  **Problem 4: Students feel cheated by the "Gerrymandered" Rule**
  *   *Scenario:* They reject Rule 3 (`Red OR 3 Sides`) as "not a real concept."
  *   *Risk:* They cling to the idea that "real" concepts are pinned down by data.
  *   *Fix:* Acknowledge this. "You're right. It feels unnatural. That feeling is your **Inductive Bias** screaming. But in high-dimensional ML, 'ugly' rules like Rule 3 are what overfitting looks like. It fits the past perfectly and fails the future."

  ---

  ### 4. Honest Limitations of the Activity

  Be prepared to admit these during the debrief. It builds trust.

  1.  **The "Teacher" Paradox:** "In this game, you knew I had an intended answer. In real science, there is no teacher. We never know if we've found the 'intended' rule of the universe or just a useful compression."
  2.  **The "Click" is Rigged:** "In real concept learning, the 'aha!' moment feels like discovery. Here, I rigged the ambiguity. Real ambiguity is usually messier than Red vs. Triangle."
  3.  **Visual Simplicity:** "Real data isn't 12 clean shapes. It's noisy, high-dimensional, and labeled by fallible humans. If ambiguity exists here with perfect shapes, imagine the Rashomon set size with real-world data."

  ### 5. Why This Design Works for Your Goal

  *   **The Confound:** By making Color and Shape perfectly correlated in the training set, you make the underdetermination *mathematical*, not just philosophical.
  *   **The Test Set:** The Blue Triangle is the "crucial experiment." It forces the abstract disagreement into a concrete binary choice.
  *   **The Gerrymandered Rule:** Including the `OR` rule demonstrates that complexity isn't just about being wrong; it's about being *compatible with data* but *incompatible with simplicity*. This bridges directly to regularization in ML.

  ### 6. Preparation Checklist
  1.  **Generate Images:** Use PowerPoint, Keynote, or Python (matplotlib) to create the 3 slides. Ensure colors are distinct (pure Red, pure Blue).
  2.  **Print Cards:** Give each pair two cards (YES / NO) for the voting phase.
  3.  **Board Space:** Reserve space to tally the "Blue Triangle" votes visibly.
  4.  **Backup Plan:** If the "Color" rule doesn't emerge, have a printed handout ready that suggests it: *"Hint: Consider properties that are not geometric."*

  This activity moves the students from "finding the answer" to "evaluating the space of answers," which is exactly the mindset shift required for understanding modern ML and cognitive science.
