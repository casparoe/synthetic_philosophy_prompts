  6.  **Writing the Text (incorporating constraints):**
      *   Keep it dry. No exclamation points.
      *   Ensure the misunderstanding is clear: they think *declaration* equals *deconstruction*.
      *   Highlight the material resistance (rent still due, people still prejudiced).

  7.  **Drafting the JSON:**
      *   kind: Social Kinds / Institutional Facts.
      *   constructed_from: Collective intentionality, historical practice, material enforcement.
      *   what_constrains_it: Material consequences, path dependence, recursive feedback.
