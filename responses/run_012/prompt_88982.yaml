answer: |-
  **Title:** The Silent Broadcast: Decoupling Global Availability from Access Consciousness in Global Workspace Theory

  **Research Question**
  Does the conceptual possibility of 'Silent Broadcast' states necessitate a decoupling of Global Availability from Access Consciousness, thereby requiring a tripartite distinction (Subpersonal Broadcast, Access, Phenomenal) rather than the standard bipartite model?

  **Introduction and Rationale**
  Global Workspace Theory (GWT) remains one of the dominant functionalist frameworks in consciousness science. Its central claim is that consciousness arises when information is broadcast from specialised, modular processors to a global workspace, making it available to a wide range of downstream subsystems. This broadcast is typically identified with 'Access Consciousness': the state wherein information is available for report, reasoning, and the rational guidance of action. However, a persistent criticism of GWT is that it explains access functions without addressing 'Phenomenal Consciousness'—the subjective 'what-it-is-like' aspect of experience. Critics argue that a system could theoretically satisfy the functional requirements of GWT without possessing any inner experience.

  My proposed project approaches this stalemate from a novel angle. Rather than asking whether GWT explains phenomenality, I wish to interrogate the functional definition of Access itself. I propose the category of 'Silent Broadcast': a state wherein information is genuinely broadcast globally—influencing multiple subsystems and shaping behaviour—yet remains unavailable to the specific processes required for verbal report, reflection, or deliberate inference.

  If such a state is coherent, it creates a classificatory crisis. Standard definitions, such as those offered by Ned Block, tie Access Consciousness tightly to reportability and rational control. If a state is globally broadcast but not reportable, is it Access Conscious? If GWT equates broadcast with consciousness, does GWT imply this state is conscious? Or is it merely unconscious processing masquerading as broadcast? Existing positions leave this open because they typically assume that global availability *entails* availability for report. By prying these apart, this project seeks to determine whether the Access/Phenomenal distinction is sufficient, or whether a third functional category is required to map the architecture of the mind accurately.

  **Theoretical Context and the Gap**
  The current debate is polarised. Proponents of GWT tend to treat global availability as the sufficient condition for Access Consciousness. They argue that once information is in the workspace, it is, by definition, accessible for use. Conversely, critics argue that GWT describes a mechanism of attention and report, not experience. Both sides, however, largely accept a binary framework: a state is either Access Conscious (available for report/use) or it is not (unconscious or merely Phenomenal).

  This binary obscures a logical gap. It is conceivable that the 'global workspace' functions as a routing hub for subpersonal systems (e.g., motor planning, emotional regulation, perceptual integration) without that routing ever reaching the 'front-end' systems responsible for linguistic report or metacognitive reflection. In standard GWT, this distinction is often glossed over; broadcast is assumed to be ubiquitous across all systems, including the reporting self.

  My hypothesis is that 'Silent Broadcast' is not only possible but actual. Consider cases of complex, flexible behaviour where subjects deny awareness, or instances where information guides action but resists introspection. Current theories force these into a binary choice: either the subject is conscious of the information (and perhaps lying or mistaken about their report) or the processing was entirely local and unconscious. Neither option fits well if the processing was genuinely *global* in its reach but *silent* in its reportability. Existing positions leave this open because they lack the conceptual vocabulary to describe a state that is functionally potent and widely distributed, yet cognitively opaque to the subject. This project aims to fill that vocabulary gap and test its theoretical consequences.

  **Methodology and Ten-Week Plan**
  As this is a conceptual inquiry into the definitions and logical relations of consciousness science, empirical experimentation is neither feasible nor appropriate. Empirical data regarding consciousness is theory-laden; whether a neural signal counts as 'broadcast' or a behaviour counts as 'report' depends on the prior philosophical framework. Therefore, the method will be rigorous conceptual analysis and argument reconstruction. I will construct the 'Silent Broadcast' category and stress-test it against existing definitions to see if it holds or collapses.

  The project will unfold over a ten-week term as follows:

  *   **Weeks 1–3: Mapping the Logical Space.** I will reconstruct the standard definitions of Global Workspace Theory and the Access/Phenomenal distinction. The focus will be on isolating the necessary and sufficient conditions for 'Access'. I will identify exactly where the assumption that 'Broadcast implies Reportability' enters the literature.
  *   **Weeks 4–6: Constructing the Silent Broadcast Case.** I will formulate the positive argument for Silent Broadcast. This involves defining the criteria: (1) influence on multiple, heterogeneous subsystems (to satisfy 'global'), and (2) insulation from report/metacognition (to negate 'access'). I will utilise thought experiments and re-interpret existing empirical phenomena (such as blindsight or masked priming) not as data points, but as conceptual test cases to see if they fit the Silent Broadcast description better than the standard 'unconscious' label.
  *   **Weeks 7–8: Objection and Refinement.** I will anticipate the primary objection: that Silent Broadcast is simply a description of sophisticated unconscious processing. I will refine the definition to ensure 'Silent Broadcast' is distinct from standard modular unconscious processing by emphasising the *global* nature of the availability. If the information is available to *more* systems than a standard unconscious module, but still not reportable, the distinction holds.
  *   **Weeks 9–10: Synthesis and Writing.** I will draft the final paper, arguing for the determinate answer to the research question. The conclusion will specify whether GWT needs revision or whether the Access/Phenomenal distinction needs expansion.

  **Why This Method?**
  One might argue that this question should be settled by neuroscience: simply measure the broadcast and ask the subject. However, this misunderstands the problem. The measurement of 'broadcast' is itself dependent on a theory of what counts as a workspace, and the subject's report is dependent on their criteria for consciousness. Running an experiment would merely shift the philosophical burden to the interpretation of the data. By resolving the conceptual definitions first, this project provides the framework necessary to make sense of future empirical work. It clarifies what we are looking for before we turn on the machines.

  **Expected Outcomes and Criteria for Success**
  The project aims for a determinate conclusion. There are three possible positive outcomes:
  1.  **Vindication of the Tripartite Model:** I successfully argue that Silent Broadcast is a coherent category distinct from both Access and Phenomenal consciousness. This would imply GWT describes a subpersonal mechanism that supports, but is not identical to, Access Consciousness.
  2.  **Collapse into Unconsciousness:** I argue that if a state is not available for report, it cannot be truly 'globally broadcast' in the relevant sense, but is merely complex modular processing. This would vindicate the standard binary view.
  3.  **Collapse into Access:** I argue that 'global availability' logically entails 'availability for report', making Silent Broadcast impossible. This would strengthen the standard GWT position.

  **Success** will be defined as producing a coherent argument that forces a choice between these outcomes, demonstrating that the current binary terminology is insufficient or confirming its robustness. A successful proposal will clearly define the boundaries of 'Silent Broadcast' such that it cannot be easily dismissed as a verbal trick.

  **Failure** would look like the concept proving incoherent. For example, if it turns out that 'availability for reasoning' and 'availability for report' are conceptually inseparable, then 'Silent Broadcast' collapses. Alternatively, failure would result if the analysis merely restates existing arguments about unconscious processing without adding the specific nuance regarding *global* availability. If I cannot distinguish Silent Broadcast from standard subliminal processing, the project fails to make a novel contribution.

  **Scope and Limitations**
  It is important to be honest about the scope of a third-year project. This proposal does not aim to solve the 'Hard Problem' of consciousness. It does not claim to explain why Silent Broadcast would feel like anything, nor does it claim to prove that phenomenality exists independently of function. The scope is limited to the functional architecture of Access Consciousness within the GWT framework.

  Furthermore, without empirical data, the argument rests on the plausibility of the thought experiments. I cannot prove that Silent Broadcast states *actually exist* in the human brain, only that they are conceptually coherent and that current theories are ill-equipped to handle them if they do. The goal is theoretical clarity, not empirical discovery. Within the 1,500-word limit of the assessment and the ten-week timeline, this focused conceptual excavation is achievable. It avoids the trap of trying to cover all of consciousness science and instead drills down into a specific tension within the dominant functionalist theory. By isolating the 'Silent Broadcast', I aim to show that the debate between GWT and its critics has been talking past one another due to a conflation of global availability and reportability. Resolving this conflation is a necessary step for any future progress in the field.
