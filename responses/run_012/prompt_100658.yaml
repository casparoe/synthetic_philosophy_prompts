  **Note on Inseparable Leaves:** This tree cannot separate **Hard Incompatibilism** from **Hard Determinism** on the question of truth; both land on "No Free Will." They are separated only by the pragmatic question of whether to retain the belief. Similarly, **Agent-Causal** and **Event-Causal Libertarianism** are separated only by the metaphysical location of the uncaused break, not by the presence of the break itself.

