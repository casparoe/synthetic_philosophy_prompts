answer: |-
  **Project Title:** The Spectator's Burden: Consistency and Representation in Rousseau's *Letter to d'Alembert* and *Pygmalion*

  **Research Question**
  Does Rousseau's critique of the theater in the *Letter to d'Alembert* prohibit the spectator position absolutely, or does it distinguish between passive spectatorship and active participation in a way that exempts his own dramatic works? This project seeks a determinate answer: either Rousseau's dramatic output violates his own political-aesthetic criteria, or works like *Pygmalion* operationalize the "public festival" he proposes as an alternative to the playhouse.

  **Background and Intervention**
  Standard interpretations of the *Letter to d'Alembert* fall into two camps: moralism (theater corrupts via professional actors) or anti-representation (theater is proto-totalitarian mediation). Both readings fail to account for the internal tensions of Rousseau's corpus. The moralist reading cannot explain why Rousseau wrote plays; if the objection is merely to professional vanity, his own works should survive the critique. The anti-representation reading cannot explain the "public festival" Rousseau offers as an alternative; if mediation itself is the sin, the festival remains a staged event with an audience.

  The pressure points are *Pygmalion* and the Festival. In *Pygmalion*, the sculptor animates the statue without divine aid, collapsing the distance between creator and object. In the *Letter*, the festival requires citizens to see themselves in one another, eliminating the actor/spectator divide. Current scholarship treats these as separate genres (political theory vs. aesthetic practice). This project argues they are governed by a single criterion: the elimination of the passive spectator position. The question is whether Rousseau successfully applies this criterion consistently.

  **Methodology**
  Over three months, I will conduct a close textual reconstruction of the criteria for permissible representation in the *Letter to d'Alembert*, followed by a stress-test against Rousseau's dramatic works.

  1.  **Month 1: Criteria Extraction.** I will isolate every instance in the *Letter* where Rousseau defines the harmful effects of the theater (vanity, pity without action, separation) and codify them into a set of necessary and sufficient conditions for "illegitimate representation."
  2.  **Month 2: Case Testing.** I will apply these conditions to *Pygmalion* and the description of the public festival. The key test is whether *Pygmalion* functions as a drama (forbidden) or a ritual of self-animation (permitted). I will examine whether the text requires additional, unstated premises to save Rousseau from inconsistency (e.g., distinctions between private vs. public performance).
  3.  **Month 3: Synthesis.** I will draft the working paper, arguing either for a refined understanding of Rousseauian participation or documenting the inconsistency as a feature of his thought rather than a bug.

  This method avoids speculative biography or archival research, relying solely on established texts. It treats the corpus as a single argumentative field rather than segregated genres.

  **Expected Results and Failure Conditions**
  A successful outcome will produce a working paper demonstrating that Rousseau's objection is not to theater *per se*, but to the institutionalization of passivity. This would reclassify *Pygmalion* not as a contradiction, but as a model of the festival aesthetic.

  However, the project must allow for negative results. A valid finding would be that the critique is indeed inconsistent—that Rousseau condemns the spectator position in theory but occupies it in practice without noticing. This is a substantive result: it locates the limit of Rousseau's political aesthetics. The project fails only if the analysis remains ambiguous, leaving the tension admiringly unresolved rather than adjudicating it. I aim to conclude with a clear claim: either Rousseau is consistent because the definition of "theater" is narrower than assumed, or he is inconsistent because the spectator position is inescapable.

  **Scope and Feasibility**
  Three months is sufficient for this scope provided the corpus remains limited. I will focus exclusively on the *Letter to d'Alembert* and *Pygmalion*. I will exclude Rousseau's other operas and comedies (e.g., *Narcisse*), as *Pygmalion* offers the strongest test case for the spectator/creator dynamic. Including broader biographical context or reception history would jeopardize the timeline. No archive trips are required; all materials are available in standard editions. The deliverable is a 10,000-word working paper suitable for submission to a journal specializing in political theory or eighteenth-century studies.

  The risk lies in the complexity of the "festival" description, which is less formally defined than the theater critique. If the festival text proves too vague to serve as a counter-model, I will pivot to analyzing *Pygmalion* solely against the negative criteria of the *Letter*, determining if it avoids the prohibited mechanisms even without a positive model. This ensures a determinate conclusion regardless of the festival's ambiguity.
