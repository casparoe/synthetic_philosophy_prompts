  # The Allocation Protocol

  **Purpose:** To determine the allocation mechanism (Administrative, Market-like, or Hybrid) for goods currently under directive planning.
  **Context:** Regional Federation of Worker Cooperatives under fiscal/energy pressure.

  ### Step 1: Technical Fungibility
  **Question:** Are individual units of the good technically interchangeable without loss of function?
  **Sufficient Answer:** Yes (Standardized specs) or No (Custom/Heterogeneous).
  **Decision:** If **No**, proceed to **Administrative Direction**. (Planning handles unique specs better than markets). If **Yes**, proceed to Step 2.

  ### Step 2: Tacit Knowledge Dependency
  **Question:** Does the optimal use of the good depend on uncodifiable, local context known only to the user?
  **Sufficient Answer:** Yes (Usage varies by context) or No (Usage is uniform/technical).
  **Decision:** If **No**, **Administrative Direction** is efficient. If **Yes**, proceed to Step 3. (Markets better utilize dispersed knowledge).

  ### Step 3: Social Priority & Rights
  **Question:** Is access to this good a prerequisite for basic democratic participation or survival, independent of productive contribution?
  **Sufficient Answer:** Yes (Right-based) or No (Input-based).
  **Decision:** If **Yes**, **Hand-off to Board Vote**. (This is a value judgment on equity vs. efficiency). If **No**, proceed to Step 4.

  ### Step 4: Scarcity Visibility
  **Question:** Can central planners accurately measure opportunity costs and scarcity in real-time without price signals?
  **Sufficient Answer:** Yes (Data is complete) or No (Data is lagging/ambiguous).
  **Decision:** If **Yes**, **Administrative Direction**. If **No**, proceed to Step 5. (Prices convey scarcity information planners lack).

  ### Step 5: Systemic Risk
  **Question:** Would an allocation error cause irreversible systemic collapse (e.g., famine, grid failure)?
  **Sufficient Answer:** Yes (Catastrophic) or No (Correctable).
  **Decision:** If **Yes**, **Administrative Direction** (Safety overrides efficiency). If **No**, **Market-like Exchange**.

  ---

  ### Application Cases

  **Case 1: Specialized Industrial Catalyst**
  1.  **Fungibility:** Yes. Chemical specs are identical.
  2.  **Tacit Knowledge:** Yes. Each cooperative uses it in unique production lines; efficiency gains are local knowledge.
  3.  **Social Priority:** No. It is an industrial input, not a basic right.
  4.  **Scarcity Visibility:** No. Supply chains are volatile; ML forecasts lag behind real-time bottlenecks.
  5.  **Systemic Risk:** No. Shortages slow production but do not collapse the federation.
  **Verdict:** **Market-like Exchange.** Internal pricing allows firms to bid based on local urgency, revealing true opportunity cost.
  **Judgment Point:** None. The procedure dictates this based on efficiency and knowledge dispersion.

  **Case 2: Irrigation Water (Drought)**
  1.  **Fungibility:** Yes. Water is homogeneous.
  2.  **Tacit Knowledge:** Yes. Farmers know their soil/crop needs better than planners.
  3.  **Social Priority:** **Yes.** Water is essential for food security and community survival.
  4.  **Scarcity Visibility:** No. Drought dynamics are complex; administrative rationing often lags.
  5.  **Systemic Risk:** Yes. Crop failure threatens regional food sovereignty.
  **Verdict:** **Administrative Direction (with Shadow Prices).**
  **Conflict:** Step 3 triggers a **Hand-off**. However, under current fiscal/energy pressure, the Board must weigh equity against survival.
  **Unpopular Verdict:** If the Board prioritizes efficiency over equity due to pressure, the procedure pushes toward **Market-like Exchange** (ignoring Step 3's hand-off to prioritize Step 4/5 trade-offs). This verdict is likely unpopular as it commodifies survival during scarcity.
  **Judgment Point:** Step 3. The procedure halts here for a value decision: Is water a right or an input?

  ---

  ### What the Procedure Cannot Decide
  This protocol cannot resolve conflicts between competing values (e.g., equity vs. efficiency). It assumes "Systemic Risk" is identifiable, but political definitions of risk vary. It cannot account for innovation shocks where new goods defy categorization. Finally, it cannot prevent power accumulation; a board can manipulate Step 3 definitions to centralize control arbitrarily.

  ### Procedure Summary Table

  | Step | Question | Sufficient Answer | If Not Satisfied | Residual Judgment |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | Technical Fungibility? | Yes/No | Admin Direction | No |
  | 2 | Tacit Knowledge? | Yes/No | Admin Direction | No |
  | 3 | Social Priority? | Yes/No | Hand-off to Board | **Yes** |
  | 4 | Scarcity Visibility? | Yes/No | Market-like | No |
  | 5 | Systemic Risk? | Yes/No | Admin Direction | No |

  ### JSON Object

  ```json
  {
    "procedure_name": "Allocation Protocol v1.0",
    "central_recommendation": "Use market-like exchanges for inputs with tacit knowledge usage; retain admin direction for rights-based goods or high systemic risk.",
    "what_would_change_my_mind": "Evidence that ML forecasting reduces opportunity cost ambiguity below market signaling efficiency.",
    "where_reasoning_is_most_likely_to_fail": "Step 3 (Social Priority) relies on political consensus which may be coerced or biased.",
    "case_verdicts": [
      {
        "case_name": "Industrial Catalyst",
        "verdict": "Market-like Exchange",
        "key_uncertainty": "None"
      },
      {
        "case_name": "Irrigation Water",
        "verdict": "Administrative Direction (Contingent on Step 3)",
        "key_uncertainty": "Definition of Basic Right"
      }
    ]
  }
  ```

  ### Reflection on Reasoning

  My central recommendation relies on the assumption that market-like exchanges within a federation effectively simulate opportunity costs without generating capitalist inequities. I would change my mind if empirical data showed that internal pricing consistently led to hoarding or strategic unemployment despite democratic oversight. My reasoning is most likely to fail at Step 3, where distinguishing "basic rights" from "standard inputs" is inherently political. A board under pressure may redefine rights to justify austerity, rendering the procedural safeguard void. The procedure manages information, not power.
