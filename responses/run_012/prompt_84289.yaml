          *   *Correction:* The user asked about 4 & 5 placement. 5 (Calvinism) relies on understanding the Decree. 4 (Grounding) relies on understanding the truth of CCFs. 4 should come *before* 5 logically, because if CCFs aren't true (4), God can't use them to stack the deck (5). But pedagogically, 5 is easier to grasp. Let's put 4 last as the "deep metaphysical worry."

      *   *Refining the Final Question:* Needs to be sharp.
