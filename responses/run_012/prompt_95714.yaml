      *   Ending on the switch being flipped.

  8.  **Writing - Focusing on Tone and Word Count:**
      *   Keep it tight. No exposition dumps. Show the stances through dialogue and action.
      *   Ensure the experiment is clear.

      *(Self-Correction during drafting)*: I need to make sure the experiment actually distinguishes the two hypotheses.
      *   Hypothesis A (Mirror): If we hide the forecast, the system stops acting intentional.
      *   Hypothesis B (Real Agency): If we hide the forecast, the system continues acting intentional because the internal coordination is established.
      *   Better Experiment: Feed *false* intentional forecasts to a subset. If it's a mirror, it should mimic the false forecast. If it's real agency, it should pursue its own goal (dry city) despite the false forecast.
      *   Wait, if it's a mirror, it mimics the *prediction*. If we predict it will fail, it fails? Or if we predict it will act X, it acts X?
