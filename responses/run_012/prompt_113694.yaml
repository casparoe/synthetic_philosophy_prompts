answer: |-
  Good morning. I am a software engineer here. I am not a historian, and I am not a manager. I am speaking because I opened a box last year that should have been opened decades ago. Inside were Ruth Adeyemi's notebooks. They contain the drawings for our first field instrument. For fifty years, this building carried the name of the man who signed her paychecks. Today, it carries hers.

  We are gathered to rename the Founder's Wing. I know what this feels like to different people in this room. To some, it feels like a correction long overdue. To others, it feels like a verdict on a life's work. I want to be clear about what we are doing here, because if we are not clear, we are just trading one myth for another.

  There is an argument that judging the past by today's standards is unfair. That it is "presentism." I struggled with this when I read the Founder's memos. In the 1950s, he wrote that women did not belong in engineering. He wrote that promoting a Black technician would lose us customers. It is easy to say he was a man of his time. But the archive holds a reply from his own chief engineer, written that same year, saying those policies were wrong and would cost us our best people.

  This matters. It means the prejudice was not the air everyone breathed. It was a choice he made while others around him chose differently. He was not trapped by his era; he was amplified by it. When we say "the standards of the time," we usually mean the standards of the loudest people in the room. The Chief Engineer was not loud enough then. We are making sure he is loud enough now.

  Does this mean we erase the Founder? No. He kept that technician on the payroll when we nearly closed. He refused to sign an industry pledge that would have harmed us all. He built this company. We can explain why he acted as he did without excusing it. We can acknowledge his contributions without honoring his prejudices.

  But a name over a door is not a history book. It is a compass. It does not tell us where we came from; it tells us where we are going. We are not renaming this wing to punish the dead. He cannot feel the sting of this change. We are renaming it to guide the living. We are saying that the talent Ruth Adeyemi represented is no longer optional here. It is central.

  This is not about purity. It is about direction. And I need to say something about us, the people living today. We are not immune to this scrutiny. Fifty years from now, someone will open our memos. They will find things we thought were normal that they find unbearable. They will find blind spots we cannot see because we are standing in them.

  If we rename this wing only to claim we are now virtuous, we are lying. We are renaming it to admit that we are still becoming. We are setting a standard we know we will sometimes fail to meet, so that when we fail, we have no place to hide. We are choosing to be judged by the people who come after us, and hoping they will find that we tried.

  To the retirees who worked under the Founder: Your work built the instruments that bear Ruth's designs. That truth remains. This change does not invalidate your labor; it completes the picture that was left unfinished.

  To Ruth's granddaughter, sitting in the second row: We found her work. We read her words. We know what she did. We are sorry it took this long.

  We cannot change the past. We can only decide what we carry forward from it. Today, we carry Ruth. Thank you.
