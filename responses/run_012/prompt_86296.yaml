          *   *Best Fix:* Reframe C1. Stop demanding the individual story for *explanation* and demand it only for *ontological grounding*. Keep C2 (Structural Explanation) as the primary explanatory mode, use C1 as a constraint on *coherence*, not a requirement for *understanding*. This aligns with C7.
          *   *Actually, looking closer:* The biggest clash is C3 (Selection/Mechanism) vs C4 (Interpretivism). Selection explanations often bypass reasons. If I accept C3, I must limit C4.
          *   *Wait, C1 vs C5 is deeper.* If preferences are socially constituted, then "bottoming out in individuals" is misleading. You bottom out in individuals *plus* the social relations that constitute them. This requires modifying C1 to "Methodological Localism" (Hedström) or similar.

      *   *Decision:* The most severe tension is C1 vs. C5. It undermines the definition of the "individual." The second is C3 vs. C4. The third is C7 vs. C1.
