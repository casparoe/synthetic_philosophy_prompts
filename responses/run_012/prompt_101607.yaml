      *   *Side B Commitments:* Bounded rationality, signaling theory, psychological commitment, virtue ethics perhaps? Rationality includes maintaining reputation, self-signaling, and avoiding regret.
      *   *The "Information" Angle:* Does spending money in the past signal quality? (e.g., I bought this expensive ticket, so the concert must be good? No, that's not quite it. It's more: I invested 3 years, so I have skills now.)
      *   *The "Commitment" Angle:* If I quit now, I signal I'm a quitter. Future me (and others) will trust me less. This is a *future* cost triggered by the *past* action, but mediated by the *decision to quit*.

  4.  **Developing the Diagnosis:**
