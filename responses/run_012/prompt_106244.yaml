answer: |-
  You hold legal title to a duplex due to a probate delay you cannot expedite, imposing a statutory duty of care you cannot decline. During a sudden storm, both tenants call simultaneously: the upstairs unit has a burst pipe threatening the hardwood floors, and the downstairs unit has a failed sump pump threatening the furnace. You possess the only shut-off valves, located at opposite ends of the building, and physical impossibility prevents you from reaching both in time. The repair costs are identical, the urgency is simultaneous, and the damage is moderate, leaving you physically unable to secure both systems despite the ownership status that mandates maintenance for each unit.

  **The Cancellation Theorist's Position**
  Your friend is forced to claim that while it initially appeared you had two obligations, only one was real. She must argue that the moment the conflict became physically inevitable, one of the requirements vanished entirely. She cannot say both remained but were weakened; she must void one completely to preserve the principle that "ought implies can." She will likely argue that the requirement you *failed* to meet was the one that became void the instant you committed to the other, or perhaps that the duty to the unit you *could* reach survived while the other dissolved. By doing this, she saves the agglomeration principle: since you never truly ought to have done both, there is no impossible conjunction of obligations. She must insist that you did no wrong by neglecting the voided duty, because there was no duty to neglect.

  **Your Position**
  On your view, both requirements remained fully binding until the moment of action, creating a genuine dilemma. You acted wrongly by failing to protect one unit, even though you could not have done otherwise. However, because the wrong was unavoidable, you are not blameworthy in the sense of being subject to reproach or punishment. What is left over is "moral residue": you owe restitution to the tenant whose property you failed to save, and you are subject to feelings of regret that are appropriate precisely because a real requirement was violated, not just a seeming one.

  **The Working Feature**
  The feature doing the work is the **symmetry of non-voluntary obligation**. Because both duties arise from the same source (ownership status) rather than choice, and because the stakes are stipulated as identical, there is no internal metric to rank them. If you remove the symmetry—for example, if one unit belonged to a stranger and the other to you—the cancellation theorist could argue that self-interest or property rights rank the duties, voiding the lesser one. If you remove the non-voluntary element—for example, if you promised to fix one but owned the other—the theorist could argue that voluntary assumptions yield to natural duties (or vice versa), again voiding one. The dilemma survives only because the source and weight are perfectly matched.

  **The Friend's Strongest Reply**
  Her strongest reply is that the scenario is rigged by artificial stipulation rather than generated by moral facts. She will argue that in the real world, no two obligations are ever perfectly equal; there is always a microscopic difference in harm, urgency, or historical priority that breaks the tie. She will claim that by stipulating "identical costs" and "simultaneous urgency," you have constructed a philosophical abstraction that cannot exist in reality. Therefore, the cancellation theory holds for all actual cases, and this scenario proves nothing about genuine moral dilemmas because it describes an impossible state of affairs where no moral reason favors one option over the other.
