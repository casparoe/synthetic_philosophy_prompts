answer: |-
  The distinction you are describing is formally known as **Weight of Evidence** (or Keynesian Weight), which separates the *balance* of probability from the *amount* of relevant information supporting it.

  This carving was most rigorously defined by John Maynard Keynes in his *A Treatise on Probability* (1921). Keynes argued that probability represents the *balance* of favorable versus unfavorable evidence (e.g., 80% likely), while weight represents the *absolute amount* of relevant evidence upon which that probability is based. In your book example, reading three more books that confirm your belief does not shift the balance (the probability remains the same), but it increases the weight (the total volume of evidence), making the belief epistemically "heavier" and harder to overturn. This explains why you would stake more on it: the estimate is more robust because it is derived from a larger dataset.

  In modern decision theory and Bayesian statistics, this is often operationalized as **Precision** or **Sample Size**. When the first doctor (5 cases) and the second doctor (5,000 cases) both say "80% benign," they are giving you the mean of their probability distribution, but the second doctor's distribution is much narrower (higher precision). Your intuition about "thin ice" corresponds to a wide confidence interval around that 80% estimate, whereas "solid" corresponds to a narrow one. The philosopher Brian Skyrms later refined this specific aspect of stability as **Resilience**: a probability assignment is resilient if it does not change significantly upon receiving new evidence. Your "solid" belief is highly resilient; your "thin" belief is fragile.

  Regarding your rejection of the word "confidence": you are correct that colloquially it conflates probability and weight, but technically you are describing exactly what intelligence analysts and climate scientists (like the IPCC) mean by **Confidence** versus **Likelihood**. In those fields, "Likelihood" is the probability (the 80%), while "Confidence" assesses the quality and quantity of the evidence behind it (the weight). Your intuition aligns with their technical framework, even if everyday language fails you.

  Your second case (where the question "doesn't have an answer yet") touches on **Knightian Uncertainty** or **Imprecise Probability**. This occurs when the weight of evidence is so low that assigning a specific number (like 50%) is misleading; instead of a single point estimate, you have a wide range of plausible probabilities. This differs from ambiguity aversion, which is a behavioral bias describing *how* you act when faced with unknown odds. You are describing the *epistemic state* itself: the recognition that the evidence is insufficient to collapse the probability distribution into a single usable number.

  To summarize the boundaries:
  *   **Probability/Likelihood:** The balance of evidence (the number you assign).
  *   **Weight of Evidence:** The amount of evidence (why the number feels solid).
  *   **Resilience:** The stability of that number against new information (the "hard to knock over" quality).
  *   **Knightian Uncertainty:** The state where weight is too low to assign a precise probability at all.

  Your feeling is not confusion; it is a recognition that a probability estimate without a weight assignment is incomplete information.
