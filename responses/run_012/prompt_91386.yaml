      *   *Twist:* Elena asks: What is the truth condition of "culture eroded"? Is it evidence-transcendent?
      *   *Conflict:* Marcus says culture is observable in practices/institutions. Elena says those are just aggregates of individuals, not a "thing" that can be harmed.
      *   *Rebuttal:* Marcus argues that if she goes full anti-realist on culture, she loses grip on social justice claims too.
      *   *Ending:* They identify the crux: Is national culture a *context of choice* (Kymlicka/Miller) or a *construct used to exclude*? What evidence would settle it? (Integration outcomes vs. subjective feeling of loss).

  6.  **Writing - Focusing on Tone:**
      *   Avoid lecture mode. Use interruptions ("Wait," "Hold on").
      *   Ensure both make good points. Marcus shouldn't sound like a xenophobe; Elena shouldn't sound like a naive utopian.
      *   Keep the Dummett stuff grounded. Don't get bogged down in "manifestation arguments" unless it serves the immigration point.

  7.  **Self-Correction during drafting:**
      *   *Check:* Did I make Elena too aggressive on the racism point? Dummett was strong on this, but she needs to be charitable enough to keep Marcus talking.
      *   *Check:* Is the anti-realism point clear? It needs to be about whether the *claim* of cultural damage is truth-apt.
      *   *Check:* Did I include the wealthy visa point? Yes, crucial for the "capacity" argument.
      *   *Check:* Is the ending satisfying? It needs to be about what would change their minds.

  8.  **Final Polish:** Check the flow. Ensure the transition from ethics to metaphysics feels natural, not forced. (e.g., "You're treating culture like a...")

  *(Self-Correction on the Anti-Realism)*: Dummett's anti-realism is about meaning and truth conditions. If I claim "X is happening," but there is no way to verify X, then for an anti-realist, the statement lacks sense or truth value. Elena should argue that "cultural erosion" is often used as a truth-transcendent claim (it's happening even if metrics show integration is fine). Marcus needs to argue that culture is intersubjective, so its "truth" is grounded in shared recognition, not external metrics.

  Let's write.

