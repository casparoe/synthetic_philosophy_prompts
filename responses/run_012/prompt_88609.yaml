prompt: |-
  I've just got back from the pub after a two-hour arguement with my mate Chris about tangled hierarchies — you know, the Escher one where two hands are drawing each other, and the whole business about the inviolate level, the thing that isn't itself one of the levels in the tangle but is what makes the tangle go — and I've somehow agreed to run next week's session of our reading group to explain it to him and five others, because he kept saying the inviolate level is just the bit outside the loop, and I kept saying no, it's not outside in space, it's outside in the order of determination, and we got absolutely nowhere. So I need a teaching plan, not a lecture. The group aren't idiots but they've got no formal logic: a couple have done a bit of pop philosophy, one is a programmer, so he'll want to talk about compilers and the halting problem, and the rest just come for the biscuits. I've got fifty minutes and a whiteboard.

  I want the plan to make the dependency structure obvious: what has to be in place before the question even makes sense, what depends on what, where the idea of an inviolate level has to enter, and why it isn't just another turn of the same screw. The carrying example should not be Escher, and not the liar paradox, and not Godel — Chris has heard all three and thinks they're the whole story. I had a go at one myself: a council passes a bylaw saying how bylaws can be changed, and the bylaw about changing bylaws is itself changeable under the bylaw it governs. Is that a tangled hierarchy or just a loop? Where would the inviolate level be — the councillors, the Act that lets them sit, or the fact that it's a bylaw at all? Tell me if that example works; if it doesn't, give me one that does and say exactly what it has and lacks.

  Also, I'm guessing the misconceptions will be: the inviolate level is the biggest thing in the loop; it's outside the picture; it's a first cause in time; it's a god; it's optional; and that tangled just means contradictory. Tell me where in the sequence each one shows up and how to head it off before it sets. And give me one question I can ask at the end that would actually show whether they've got it, plus what a good answer and a bad answer would look like. Finally, tell me what to leave out at this level and why — I'm definately not going to do Godel numbering or recursion theory with this lot.

  Give it to me as a JSON object with these fields:
  - sequence: an array of steps, each with step (a number), idea (what to put across), and why_now (why it has to come at that point and not earlier or later).
  - carrying_example: an object with example (the case to build the session around), what_it_must_have, what_it_must_lack, verdict_on_council_example (does my bylaw case work, and why or why not), and alternative (a better example if you're ditching mine, otherwise null).
  - misconceptions: an array, each with misconception, when_it_shows_up (the step number or moment), and how_to_head_it_off.
  - check_for_understanding: an object with question, good_answer_shows, and bad_answer_shows.
  - leave_out: an array, each with topic and why.
  - opening_line: the first sentence I should say to the room.
  - bottom_line: the one sentence I should be able to say at the end that captures why the inviolate level isn't just another loop.

  British English, please, and don't give me readings — I don't want a bibliography, I want the plan.
