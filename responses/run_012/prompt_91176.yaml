prompt: |-
  I chair the governance committee of our housing co-op — forty-ish adults who jointly own the building, unincorporated, no state law we're registered under that settles internal membership disputes, so our bylaws are effectively the whole constitution and there's no outside authority to appeal to. A few years back we scrapped the boilerplate bylaws and wrote our own, shamelessly ripped off from that game Nomic where the rules themselves are the thing you play with; the founders thought it was clever that "the community can change anything, including how it changes things." Here's the relevant chunk we ended up with:

  1. Ordinary motions pass by a simple majority of members present and voting.
  2. Any bylaw may be amended by a two-thirds vote of all members, except where these bylaws provide otherwise.
  3. Rule 2 may be amended only by a unanimous vote of all members.
  4. Rule 3 may be amended by a two-thirds vote of all members.
  5. These bylaws are our only constitution; no rule is immune from amendment, and there is no body outside this association with authority to interpret them.

  Now the mess. At the March meeting, 21 of our 40 members showed up (quorum is 15). The pro-development faction — they want to sell the building and cash out — moved Motion M: "Rule 3 is amended to read: 'Rule 2 may be amended by a simple majority of members present and voting.' This amendment takes effect on passage and is valid if it receives a simple majority of members present and voting." M passed 21–0, since the other 19 weren't there. Under Rule 4, though, changing Rule 3 takes two-thirds of all members, i.e. 27, and M only had 21. Having "passed" M, the faction then used the new Rule 2 to pass the sale 21–0. The 19 absent members are furious and have formally asked the governance committee to rule on whether M (and therefore the sale) is valid. I have to circulate a written opinion before Thursday's meeting and I'm genuinely torn, because I can see the faction's point that if a rule can't authorize its own amendment then the whole self-amending design collapses, but I can also see that M basically voted itself into validity by lowering the bar it had already failed to clear.

  Write that opinion. Take a definite position — don't hand me a menu of "on the one hand / on the other" and leave the committee to choose; I need a recommendation the committee can act on, a concrete ruling on M's validity with the reasoning laid out, and an honest treatment of the strongest argument on the side you come out against, since whichever way we rule, half the building will feel robbed. It should be short enough to read aloud at the meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Governance Committee of a housing co-op.
      *   **Context:** 40 members, unincorporated, no external legal authority, bylaws are the "constitution."
      *   **Bylaws Structure:** Nomic-style (self-referential, mutable).
          *   Rule 1: Ordinary motions = simple majority present/voting.
          *   Rule 2: Amend bylaws = 2/3 of *all* members (27/40), unless specified otherwise.
          *   Rule 3: Amend Rule 2 = Unanimous (40/40).
          *   Rule 4: Amend Rule 3 = 2/3 of *all* members (27/40).
          *   Rule 5: No rule is immune; bylaws are the only constitution.
      *   **The Incident:**
          *   March meeting: 21 present (Quorum 15).
          *   Motion M: Amend Rule 3 to allow Rule 2 to be amended by simple majority present/voting. M claims validity via simple majority present/voting.
          *   Result: M passed 21-0.
          *   Subsequent Action: Used "new Rule 2" to pass sale of building 21-0.
          *   Problem: Rule 4 says changing Rule 3 requires 27 votes. M got 21. M tried to lower the threshold *using* the lower threshold.
      *   **Task:** Write a written opinion for the Governance Committee to circulate before Thursday's meeting.
      *   **Requirements:**
          *   Take a definite position (Valid or Invalid).
          *   Provide concrete reasoning.
          *   Address the strongest counter-argument honestly.
          *   Short enough to read aloud.
          *   Tone: Authoritative, fair, legally logical (within the context of private contract/bylaws), decisive.

  2.  **Evaluate the Legal/Logical Logic:**
      *   *The Core Conflict:* Rule 4 sets the bar for changing Rule 3 at 27 votes. Motion M got 21 votes. Motion M *says* it only needs 21 votes to pass.
      *   *The Paradox:* Can a rule change the procedure required to change itself *using* the procedure it is trying to replace?
      *   *Standard Legal Principle (Lex Superior/Procedural Hierarchy):* Usually, the existing rule governing amendment controls the amendment process until the amendment is validly adopted. You can't use the new rule to validate the adoption of the new rule if the new rule hasn't been adopted yet.
      *   *The "Nomic" Argument:* The founders wanted a self-amending system. If Rule 3 is too hard to change (Unanimity is practically impossible for 40 people), the system freezes. The faction argues that Rule 4 (2/3 to change Rule 3) should allow a motion that *says* "I pass with 2/3" or "I pass with simple majority." But M explicitly claimed it passes with simple majority.
      *   *The Math:*
          *   Current Rule 4: To change Rule 3, you need 27 votes.
          *   Motion M: Received 21 votes.
          *   Motion M's text: "Valid if it receives a simple majority... present and voting."
          *   Contradiction: M is an amendment to Rule 3. Therefore, under the *current* Rule 4, M requires 27 votes. It failed. Because it failed, the text within M (lowering the threshold) never became active.
      *   *Self-Reference Trap:* This is the "Liar's Paradox" of governance. "This statement is false." Here: "This rule passes by simple majority" (when the current rule says it needs 2/3).
      *   *Precedent:* In corporate law and parliamentary procedure (Robert's Rules), you cannot use the power you are seeking to grant yourself to grant yourself that power. The existing bylaws control the amendment process *until* the amendment is complete.
      *   *Decision:* Motion M is invalid. The sale is invalid.
      *   *Why?* Because Rule 4 was in force at the start of the vote. Rule 4 demands 27 votes. M got 21. M failed. The internal text of M regarding voting threshold is irrelevant because M didn't cross the threshold to become law.
      *   *Counter-Argument (The Faction's Point):* Rule 5 says "No rule is immune." Rule 3 is effectively immutable (Unanimity of 40 people is nearly impossible). If we rule M invalid, we freeze the co-op into a status quo that the founders admitted was mutable. We prioritize procedure over the community's will to evolve.
      *   *Rebuttal to Counter:* Rule 5 doesn't mean "procedures don't matter." It means "anything *can* be changed," not "anything *has been* changed." The path to change Rule 3 exists (get 27 votes under Rule 4). They didn't take the path.

  3.  **Drafting the Opinion:**
      *   *Header:* To Members, From Governance Committee, Re: Validity of Motion M.
      *   *Opening:* State the conclusion immediately. (M is invalid).
      *   *Reasoning:*
          1.  Hierarchy of Rules at time of vote. Rule 4 governed the amendment of Rule 3.
          2.  The Threshold. Rule 4 requires 27 votes. M got 21.
          3.  The Self-Validation Clause. A motion cannot define its own validity *against* the standing rules that govern its passage. If it could, any minority could rewrite the constitution.
      *   *Addressing the Counter-Argument:* Acknowledge the "Nomic" intent (fluidity). Acknowledge Rule 5. But distinguish between *possibility* of change and *procedure* of change. The lock isn't permanent; the key is 27 votes, not 21.
      *   *Recommendation:* Declare sale void. Call for new vote under correct rules.
      *   *Tone Check:* Needs to be firm but empathetic. Not "I win," but "The Rules say."

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is it too dry?
      *   *Fix:* Add a sentence about the stability of the community.
      *   *Critique:* Is the counter-argument strong enough?
      *   *Fix:* Make sure to highlight that Rule 3 (Unanimity) is arguably broken by design, and the faction was trying to fix a broken mechanism. Acknowledge that frustration.
      *   *Critique:* Is the distinction between Rule 3 and Rule 4 clear?
      *   *Check:* Rule 3 says "Rule 2 amended by Unanimity." Rule 4 says "Rule 3 amended by 2/3." Motion M tries to amend Rule 3. So Rule 4 applies. Rule 4 says 2/3 of *all members* (27). M got 21. M fails.
      *   *Wait, one nuance:* Motion M says "Rule 3 is amended to read..." So M is an amendment to Rule 3. Therefore Rule 4 controls M. Rule 4 requires 2/3 of all members. M failed.
      *   *What if they argued they were amending Rule 4?* No, text says "Rule 3 is amended."
      *   *What if they argued Rule 1 applies?* Rule 1 is for ordinary motions. Bylaw amendments are governed by Rule 2/3/4.
      *   *Okay, the logic holds.*

  5.  **Final Polish:**
      *   Keep it under 500-600 words for read-aloud feasibility.
      *   Ensure the "Thursday meeting" deadline context is respected (urgent but considered).
      *   Make sure the recommendation is actionable.

  6.  **Final Review against constraints:**
      *   Definite position? Yes (Invalid).
      *   Reasoning laid out? Yes.
      *   Strongest counter-argument treated honestly? Yes (The "Frozen System" argument).
      *   Short enough? Yes.

  *(Self-Correction on the Counter-Argument)*: I need to make sure I don't dismiss the "Nomic" intent too lightly. The founders *wanted* the rules to be a game. But even in Nomic, there are usually meta-rules about rule priority. The strongest argument for the faction is that Rule 5 ("No rule is immune") implies that procedural hurdles shouldn't block substantive will. I need to concede that Rule 3 is a "hard lock" but insist that Rule 4 provides the "key" they didn't use.

  *(Drafting the response)*...
  *Start with the ruling.*
  *Explain the procedural hierarchy.*
  *Address the self-validation paradox.*
  *Address the "Spirit of Nomic" counter-point.*
  *Conclude with the path forward.*

  Let's write it.cw
answer: |-
  **TO:** All Members, Housing Co-op
  **FROM:** Governance Committee
  **DATE:** [Current Date]
  **RE:** Ruling on Validity of Motion M and Subsequent Sale Vote

  **Ruling**
  The Governance Committee rules that Motion M is **invalid**. Consequently, the subsequent vote to sell the building is **null and void**.

  **Reasoning**
  Our bylaws are a closed system. At the start of the March meeting, Rule 4 was the active law governing changes to Rule 3. Rule 4 explicitly states: *"Rule 3 may be amended by a two-thirds vote of all members."* With 40 members, the threshold was 27 votes. Motion M received 21.

  The core legal error in Motion M was the claim that it could define its own passage requirements ("valid if it receives a simple majority"). A motion cannot use the power it seeks to grant in order to validate its own adoption. If a simple majority could rewrite the amendment threshold for any rule at any time, Rule 4 would be meaningless. A minority of 21 members could permanently alter the constitution without the supermajority protection Rule 4 was designed to ensure. The existing rules govern the amendment process *until* the amendment is successfully completed. Since M did not clear the bar set by Rule 4, the new text never became law.

  **The Counter-Argument**
  We have heard the pro-development faction's argument, and we take it seriously. Their position rests on Rule 5 (*"No rule is immune"*) and the founders' "Nomic" intent: that the community must always be able to change its mind. They argue that Rule 3 (requiring unanimity to change Rule 2) creates a practical freeze, and that prioritizing procedure over the will of the members present betrays the spirit of our self-governance.

  They are right that Rule 3 is a "hard lock." Unanimity among 40 people is nearly impossible. However, Rule 4 exists specifically as the key to that lock. It allows the community to lower the threshold, provided there is broad consensus (27 votes). The faction had the mechanism to change the rules legitimately but chose to bypass it. Upholding Rule 4 does not freeze the co-op forever; it merely requires the broader consensus that was already written into our constitution.

  **Recommendation**
  1.  The Governance Committee declares the building sale void.
  2.  We recommend an emergency meeting to vote on the sale under the *current* valid bylaws (requiring a 2/3 vote of all members to amend Rule 2, or a 2/3 vote of all members to approve the sale if classified as a major asset disposition under Rule 2).
  3.  We invite a new motion to amend Rule 3 via the Rule 4 pathway (securing 27 votes) to lower the threshold for future decisions.

  We cannot allow the rules to become optional. If we validate Motion M, we establish that any majority present can rewrite the constitution, rendering membership rights for absent members meaningless. We must follow the path we agreed upon, even when it is difficult.

  **Chair, Governance Committee**
