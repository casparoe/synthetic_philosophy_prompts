prompt: |-
  I'm giving the commencement address at a small journalism school next month. The graduates are mostly going into local news, a few into PR, one or two into policy work, and their families will be there -- so half the room will definately know Orwell's essay on language and politics pretty well, and the other half will just be there to clap and take pictures. I want a speech that actually argues something, not just alot of follow your passion stuff. Here's the argument: the standard reading of Orwell is that vague or technical language is how people dodge responsibility, but I think that's half right and half backwards. The real target isn't jargon or long words as such; it's language that lets you avoid having a thought at all, or that hides who did what. So I want the speech to draw a distinction between two kinds of obscurity: obscurity that hides the agent (mistakes were made, things happened) and obscurity that specifies the agent (the permittee shall do X by date Y). The first is the thing Orwell was really against; the second is what good journalists and good regulators both need. The speech should make the case that plain language is not the same as clear responsibility, and that sometimes technical precision is the more honest choice. It can also note that Orwell's own prose is full of metaphors and even technical terms, so he can't have meant a literal ban on them. It should land for the journalism grads without losing their parents. No citations or quotes from Orwell, obviously; just the idea.
reasoning: |-
  Here's a thinking process that leads to the suggested commencement address:

  1.  **Analyze the Request:**
      *   **Occasion:** Commencement address at a small journalism school.
      *   **Audience:** Graduates (mostly local news, some PR, some policy), Families (half know Orwell's "Politics and the English Language" well, half just there for support).
      *   **Tone:** Argumentative, substantive, not cliché ("follow your passion").
      *   **Core Argument:** The standard reading of Orwell (vague/technical language = bad) is incomplete.
          *   *Bad Obscurity:* Hides the agent (passive voice, "mistakes were made"). Avoids thought/responsibility.
          *   *Good Obscurity (Precision):* Specifies the agent (legal/regulatory precision, "Permittee shall do X"). Sometimes technical language is *more* honest because it leaves no wiggle room.
          *   *Nuance:* Plain language $\neq$ Clear responsibility. Technical precision can be the honest choice. Orwell himself used metaphors and technical terms; he wasn't banning complexity, he was banning thoughtlessness.
      *   **Constraints:** No direct citations or quotes from Orwell. Just the ideas.
      *   **Goal:** Land for journalism grads (practical application) and parents (understandable, inspiring).

  2.  **Deconstruct the Argument & Structure the Speech:**
      *   **Opening:** Acknowledge the occasion, the mix of careers, and the elephant in the room (the advice they've heard about writing). Hook the parents and the grads.
      *   **The Common Wisdom (The Setup):** Address the "Orwellian" advice they've received. Write simply. Avoid jargon. Be clear. (Don't name-drop the essay, just the idea).
      *   **The Pivot (The Argument):** That advice is half-right. Simplicity isn't the ultimate goal; *accountability* is.
      *   **Distinguishing the Two Obscurities:**
          *   Type 1: The Fog. Hides who did what. (Example: "Mistakes were made"). This is the enemy.
          *   Type 2: The Scaffold. Technical precision that pins down responsibility. (Example: Legal/Policy language). This is a tool.
      *   **Application to Journalism/PR/Policy:** How does this apply to their specific jobs?
          *   Local News: Don't just say "the city failed." Say *who* voted no.
          *   PR/Policy: Don't use jargon to confuse. Use precision to commit.
      *   **Reframing "Plain English":** Plain language can still lie. Technical language can still tell the truth. It's about the *thought* behind the words.
      *   **Closing:** A charge to the graduates. Use language to force thought, not avoid it.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Welcome everyone. Acknowledge the parents (the clappers) and the grads (the workers). Set the stage: You're going out to write about the world.
      *   *The "Rule":* You've been taught a rule. Short words are good. Long words are suspicious. Metaphors are clichés. This is the "Orwellian" instinct without naming him.
      *   *The Problem:* If you follow that rule blindly, you might miss the point. The point isn't syllable count. It's agency.
      *   *The "Bad" Fog:* Give the classic example. "Rioting occurred" vs. "Police fired." "Mistakes were made." This removes the human hand. This is what we fight.
      *   *The "Good" Precision:* Now, the counter-intuitive part. Sometimes, "plain English" is too slippery. "The company should be nice" is plain but useless. "The company must reduce emissions by 10% by 2025" is technical but honest. This is for the policy/PR grads too.
      *   *The Journalism Angle:* Local news is about names. Not "officials," but "Councilman Smith." Precision *is* the story.
      *   *The Orwell Nuance:* Even the master of plain prose used specific terms when needed. He didn't want dumb writing; he wanted *awake* writing.
      *   *Conclusion:* Your job isn't just to be understood. It's to make sure someone can be held to account. Go make the world legible.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I quote Orwell? *No.*
      *   *Check:* Is it too academic? *Need to keep sentences punchy for a speech.*
      *   *Check:* Did I address the PR/Policy grads? *Yes, need to make sure they don't feel like villains.* Precision helps them too (clear contracts, clear commitments).
      *   *Check:* Is the distinction clear? *Fog (hiding agent) vs. Scaffold (pinning agent).*
      *   *Tone Check:* Needs to be warm but firm. Not a lecture, but a charge.
      *   *Parent Check:* Ensure the "agency" concept is explained simply enough for the non-journalists. Use concrete examples.

  5.  **Final Review against constraints:**
      *   "No citations or quotes from Orwell." -> Ensure I talk about "a famous essay" or "the common wisdom" without saying "In 'Politics and the English Language'..."
      *   "Argue something." -> The core thesis is Plain Language $\neq$ Truth; Precision = Accountability.
      *   "Land for grads and parents." -> Keep the emotional resonance high at the end.

  6.  **Final Polish:** (Reviewing the draft for rhythm and oral delivery). *Make sure the transition between the two types of obscurity is sharp.* *Ensure the ending lands on "responsibility."* (The resulting speech matches the provided good response).

  *(Self-Correction Note during final polish)*: I initially thought about using the phrase "passive voice." I should be careful not to make it a grammar lecture. Focus on the *effect* of the grammar (hiding the actor). Also, make sure to validate the PR/Policy students—they aren't the enemy, they just need to use precision ethically.

  7.  **Final Output Generation** (Proceed to generate speech).
answer: |-
  Good morning. To the graduates, to the families who made this possible, and to the faculty who kept you honest: thank you for having me.

  Looking out at this room, I see a split. Half of you are thinking about the stories you're going to write, the press releases you'll draft, or the policies you'll analyze. The other half of you—mostly the parents and partners—are thinking about how proud you are, and maybe wondering where you're going to get lunch after this.

  That split is actually perfect for what I want to talk about. Because there is a piece of advice you have heard repeatedly in this school, a piece of wisdom that has become the gospel of our profession. You know the one. It says: Write simply. Avoid jargon. Cut the long words. If you can say it in ten words, do not use twenty.

  It is good advice. But it is incomplete. And if you follow it blindly, you might end up writing clearly about nothing at all.

  The origin of this advice comes from a famous observation about how language and power mix. The argument is that vague, bloated, or technical language is often used to dodge responsibility. That is true. We have all seen it. We have seen press releases that say "unfortunate events occurred" instead of "our pipeline leaked." We have seen police reports that say "a struggle ensued" instead of "an officer struck a suspect."

  This is the first kind of obscurity. It is a fog. Its purpose is to hide the agent. It removes the human hand from the action. It allows things to happen without anyone having done them. When you read a sentence and you cannot tell who is holding the knife, that is not just bad writing. That is a moral failure.

  As journalists, your instinct will be to clear that fog. To demand names. To replace "the administration" with "the Mayor." To replace "funds were diverted" with "the CFO signed the check."

  But here is the trap. In your zeal to be clear, you might decide that "plain language" is the same thing as "honest language." It isn't.

  There is a second kind of obscurity. It looks technical. It looks dense. It might even use jargon. But its purpose is not to hide the agent. Its purpose is to specify the agent so precisely that there is no wiggle room left.

  Consider the difference between these two sentences.

  The first is plain English: "The company should try to reduce pollution as soon as reasonably possible."

  That is simple. A sixth-grader can read it. It is also worthless. Who decides what is "reasonably possible"? When is "soon"? If the river catches fire, can the company say they tried?

  Now consider this: "The permittee shall reduce sulfur emissions by fifteen percent relative to the 2023 baseline by December 31st."

  That is technical. It is dry. It is not the kind of sentence you put in a lead paragraph. But it is infinitely more honest than the first one. It pins responsibility to a date, a number, and a specific entity. It creates a line that can be crossed. It forces a thought. It forces a commitment.

  This is the distinction I want you to carry into your careers. The enemy is not complexity. The enemy is thoughtlessness.

  Some of you are going into local news. Your job is to make sure the fog doesn't settle over your town council meetings. But some of you are going into PR and policy. Do not feel that you must apologize for precision. When you draft a policy or a commitment, do not smooth off the edges just to make it sound nicer. A sharp edge cuts, yes. But it also defines where one thing ends and another begins.

  We often romanticize the idea of "plain speech." We imagine that if everyone just talked like they were at a kitchen table, the world would be more honest. But people lie at kitchen tables all the time. They say "I'll call you," when they mean "no." They say "we'll see," when they mean "never."

  Simple language can be a velvet glove over an iron fist. And technical language can be a microscope that reveals the truth.

  The writer who famously championed plain prose did not actually ban long words or metaphors. He used them when they were necessary to describe the world accurately. He did not want writing that was simple. He wanted writing that was awake. He wanted sentences that forced the writer to think about what was actually happening, and forced the reader to see who was actually doing it.

  So, here is my charge to you.

  Do not just count syllables. Count actors.

  When you read a press release, do not ask "Is this easy to read?" Ask "Who is doing the verb?"

  When you write a story, do not just simplify the quote. Contextualize the power.

  When you draft a policy, do not hide behind the law. Use the law to bind the hands of the powerful to their promises.

  There will be pressure to make things softer. Sources will ask you to blur the edges. Editors will ask you to shorten the nuance. Algorithms will reward you for outrage rather than accuracy.

  Resist the urge to make language comfortable. Comfortable language is where responsibility goes to sleep.

  To the parents in the room: You taught your children to tell the truth. What this school has taught them is how to construct a record that makes lying difficult. That is a technical skill, but it serves a moral end.

  To the graduates: You are entering a world that is desperate for clarity. But do not confuse clarity with simplicity. Clarity is not about how easy it is to read the words. Clarity is about how hard it is to escape the meaning.

  Go out there and write sentences that hold people accountable. Write sentences that specify the cost. Write sentences that name the name.

  Make the world legible. Make it precise. And make it impossible to look away from who is really in charge.

  Congratulations.
