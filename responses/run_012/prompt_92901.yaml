answer: |-
  Here is the hard truth: **You cannot construct this case.** If the ratio of Boltzmann brains (BBs) to Ordinary Observers (OOs) is held fixed across two hypotheses, and the reference class is defined consistently, SSA and SIA *must* yield the same credence for "I am a Boltzmann brain." The divergence you are looking for is mathematically cancelled out by the constraints you have set.

  Below is the scenario that attempts your specification, followed by the explanation of why the isolation fails, the check you requested, and the diagnosis of the blockage.

  ### The Scenario
  Imagine two possible finite universes, **Small** and **Large**, both destined to end in heat death. In **Small**, physical processes produce exactly 100 Ordinary Observers (evolved beings like us) and 1 Boltzmann Brain (a random fluctuation with identical memories). In **Large**, the universe is vastly bigger and lasts longer, producing 1,000,000 Ordinary Observers and 10,000 Boltzmann Brains. In both universes, the ratio of BBs to OOs is exactly 1%, and every observer has the exact same subjective experience you are having right now. You know you exist, but you do not know which universe you are in.

  ### The Check

  **1. The Numbers**
  *   **Hypothesis Small ($H_S$):** 100 OOs, 1 BB. Total Observers ($N_S$) = 101. BB Ratio = $1/101 \approx 0.99\%$.
  *   **Hypothesis Large ($H_L$):** 1,000,000 OOs, 10,000 BBs. Total Observers ($N_L$) = 1,010,000. BB Ratio = $10,000/1,010,000 \approx 0.99\%$.
  *   **Priors:** Assume equal prior probability for $H_S$ and $H_L$ based on non-anthropic physics ($P(H_S) = P(H_L) = 0.5$).
  *   **Reference Class:** "All observers having my current subjective experience." (In this setup, all OOs and BBs are in the class).

  **2. What SSA Says**
  The Self-Sampling Assumption treats you as a random sample from the reference class *within* the true hypothesis.
  *   $P(\text{BB} | H_S) = 1/101$.
  *   $P(\text{BB} | H_L) = 10,000/1,010,000 = 1/101$.
  *   Since the conditional probability is identical, the total credence is the average: **$\approx 0.99\%$**.
  *   *Note:* SSA does not shift the probability of the hypotheses based on total observer count. $P(H_S | \text{Data})$ remains 0.5.

  **3. What SIA Says**
  The Self-Indication Assumption weights hypotheses by the total number of observers in the reference class.
  *   Likelihood of "I exist" given $H_S \propto 101$.
  *   Likelihood of "I exist" given $H_L \propto 1,010,000$.
  *   SIA drastically favors **Large**. $P(H_L | \text{I exist}) \approx 1$.
  *    However, to find $P(\text{BB})$, we sum the probability of being a BB in each world, weighted by the new hypothesis probabilities:
      $$P(\text{BB}) = P(\text{BB}|H_S)P(H_S|\text{Exist}) + P(\text{BB}|H_L)P(H_L|\text{Exist})$$
  *   Since $P(\text{BB}|H)$ is $1/101$ in *both* cases, the weighting cancels out:
      $$P(\text{BB}) = (1/101) \times [P(H_S|\text{Exist}) + P(H_L|\text{Exist})] = 1/101$$
  *   **Result:** **$\approx 0.99\%$**.

  **4. The Divergence (and the Failure)**
  SSA and SIA **agree** on the question "Am I a Boltzmann Brain?" They **disagree** on the question "Am I in the Large Universe?" (SSA says 50%, SIA says ~100%).
  *   **Feature doing the work:** The Total Number of Observers ($N_{total}$).
  *   **What happens if fixed:** If $N_{total}$ is also held fixed (making the hypotheses identical), the disagreement vanishes entirely.
  *   **Why the isolation failed:** You asked to isolate $N_{total}$ while holding the BB-ratio fixed to generate divergence on *BB-credence*. Algebraically, SIA shifts the probability mass toward the hypothesis with more observers, but if the *proportion* of BBs in that hypothesis is unchanged, the marginal probability of being a BB remains constant. The "anthropic leverage" SIA gains from total observer count is perfectly offset by the constant likelihood of being a BB within that count.

  **5. Defusing the Case**
  A defender of SIA (who might feel this renders SIA useless for the BB problem) would argue that this scenario is unrealistic. In actual cosmology, hypotheses that produce more observers (eternal inflation) typically produce *disproportionately* more Boltzmann Brains than Ordinary Observers over infinite time. They would argue that holding the ratio fixed is an artificial constraint that neuters the BB problem.
  A defender of SSA would argue that the Reference Class should be restricted further (e.g., "Observers with my specific causal history"), which would exclude BBs entirely, dissolving the problem for both principles.
  Alternatively, one could shift to **observer-moments**. If the Large universe lasts longer, it has more observer-moments. If BBs are fleeting flashes while OOs live long lives, the ratio of BB-moments to OO-moments might differ even if the ratio of *observers* is fixed. This would restore the divergence.

  **6. The Doomsday Connection**
  **Yes, this is the Doomsday Argument in costume.**
  The disagreement between SSA and SIA in this scenario is *exactly* the structure of the Doomsday Argument.
  *   **Doomsday:** SSA favors "Few Total Humans" (Small); SIA favors "Many Total Humans" (Large).
  *   **This Case:** SSA is neutral on Small vs. Large (given equal priors); SIA favors Large.
  The reason you cannot get divergence on "Am I a BB?" is that the standard Boltzmann Brain argument *is* a Doomsday-style argument applied to observer *types* rather than observer *counts*. To get the vertigo, you *must* allow the ratio of BBs to OOs to vary (i.e., in the "BB World," BBs vastly outnumber OOs, whereas in the "Standard World," OOs vastly outnumber BBs). If you fix the ratio, you have removed the likelihood ratio that drives the Bayesian update. You are left with a pure Doomsday argument about the *size* of the universe, not the *nature* of your existence.

  ### Summary for the Group
  The vertigo you feel in the literature does not come from the Self-Indication Assumption alone, nor from the cosmology alone. It comes from the **interaction** between SIA/SSA and **varying likelihood ratios**. If you fix the ratio of Freaks to Normals, SIA and SSA agree on whether you are a Freak. They only disagree on how big the container is. To isolate the BB problem, you must allow the "Freak/Normal" ratio to be the variable that changes between hypotheses.
