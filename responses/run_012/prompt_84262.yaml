answer: |-
  **Transcript of Remarks by Governor Silas Vane**
  **National Bank Hall, Dublin**
  **14th November, 1735**

  Good morning. The Board has concluded that the bullion era is a misunderstanding of arithmetic. We are therefore retiring the gold standard effective immediately. Henceforth, this nation will operate on a Ticket Standard.

  There is a persistent confusion that money possesses intrinsic value. It does not. A guinea is merely a metal disc; a note is merely paper. The true idea of money is altogether that of a ticket or counter. It is a token used to record who has contributed to the common stock of labor and who is entitled to draw from it. Whether the bullion exists in the vault or has vanished entirely is irrelevant. The denominations remain valid so long as the collective opinion sustains them. We are not backing the currency with gold. We are backing it with your willingness to accept it.

  Consider the velocity of circulation. A hundred pounds moving slowly through ten hands generates less wealth than ten pounds moving rapidly through a hundred. It is not the quantity of counters that matters, but the frequency with which they change hands. Therefore, our goal is not to accumulate wealth, but to stir up industry. The true wealth of a nation is found in the land and the labor of its people. If men are idle, the nation is poor, regardless of the gold in the treasury. If men are working, the nation is rich, even if the coffers are empty.

  To ensure men work, we must ensure they want. Desire is the engine of industry. A contented population is an economically stagnant one. Consequently, the legislature ought to step in and manage the fashions. Why leave hemlines and lapels to chance? If the state dictates that silk is in and wool is out, the wool-makers must strive to become silk-makers. This steering of taste is not tyranny; it is employment policy. By manufacturing wants, we manufacture the industry required to satisfy them.

  We must be clear about the objective. Men do not seek money for the paper itself. They seek power. A well-run state is one where each member receives power in proportion to his industry. These tickets represent command over the labor of others. When you hold a note, you hold a claim on your neighbor's time. We are distributing the ability to command.

  Some ask what happens if the tickets cease to circulate. They ask who is doing the commanding, and who is merely holding the paper. These questions confuse the instrument with the hand that wields it. The Bank retains the authority to determine what constitutes useful industry. We define the labor that honors the ticket.

  You will receive your wages in these counters. You will use them to purchase the goods we have deemed fashionable. You will feel powerful, for you will command the fruits of another's labor. But remember: a ticket is only valid for the performance it admits. The state writes the play. The state sets the curtain time. You hold the paper, certainly. But we define when the show is over.

  Thank you.
