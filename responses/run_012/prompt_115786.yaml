          *   So, $C_0(Rain | C_1(Rain) = 0.8) = 0.3$.
          *   Reflection requires this to be 0.8.
          *   $0.3 \neq 0.8$. Reflection fails.
      *   *Why?* Ada is deferring to an unreliable source (or rather, a source with inverse reliability relative to the number). She is *not* conditionalizing on new evidence; she is overwriting her credence based on a signal she knows is misleading (or at least, she knows the correlation is negative). Actually, looking closely: She knows the service is anti-reliable (0.8 -> 30% rain). Yet she plans to adopt the number. This makes her future self irrational from her current perspective.

