  4.  **Drafting the Model Answer:**
      *   *Goal:* ~650 words. Hit the 5 key points.
      *   *Point 1: Expectation Version.* Calculate expected future credence. Show it matches current credence (0.5). Reflection (Weak) holds.
      *   *Point 2: Conditional Version.* Calculate conditional credence given the future value. Show it mismatches (0.3 vs 0.8). Reflection (Strong) fails.
      *   *Point 3: Theorem vs. Norm.* Explain *why* it fails. Future self isn't conditionalizing. If she were conditionalizing on the text as evidence, her credence would match the likelihoods (0.3). But she's blindly adopting. Thus Reflection isn't a universal norm; it assumes future rationality.
      *   *Point 4: Sufficiency.* The conditional version claims the future value is *sufficient* information. Here, knowing the future value (0.8) gives us info about the text, which gives us info about rain (0.3). The value itself (0.8) is misleading.
      *   *Point 5: Deference/Expertise.* Ada is treating the service as an expert but knows it's anti-correlated. This highlights that Reflection only works if you regard your future self as an epistemic superior/peer, not a known deviant.

