      *   $P(C_1(Rain) = 0.2) = 0.5$.
      *   Expected Future Credence: $0.5(0.8) + 0.5(0.2) = 0.5$.
      *   *Expectation Version of Reflection:* $C_0(A) = E[C_1(A)]$. Here, $0.5 = 0.5$. This holds.
      *   *Conditional Version of Reflection:* $C_0(A | C_1(A) = x) = x$.
          *   Check $x=0.8$: $C_0(Rain | C_1(Rain) = 0.8)$.
