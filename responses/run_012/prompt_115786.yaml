answer: |-
  **Exam Question: Epistemology 450 – Final Examination**
  **Time Allowed:** 45 Minutes
  **Marks:** 25

  **Question 1**
  Ada is certain that tomorrow morning a forecasting service will text her a number, either 0.8 or 0.2. She assigns equal probability (0.5) to receiving either number. She has pre-committed to adopting whatever number she receives as her new credence that it will rain ($R$), without further processing. She knows the service's historical reliability: on days the service texts 0.8, it rains 30% of the time; on days it texts 0.2, it rains 70% of the time. Her current credence in $R$ is 0.5.

  Evaluate Ada's situation in light of van Fraassen's Reflection Principle. Specifically:
  1.  Does Ada satisfy the **Expectation version** of Reflection ($C_0(A) = E[C_1(A)]$)?
  2.  Does Ada satisfy the **Conditional version** of Reflection ($C_0(A | C_1(A)=x) = x$)?
  3.  Based on these results, explain whether Reflection should be understood as a universal normative constraint on rationality or as a theorem dependent on specific assumptions about future updating.

  ***

  **Model Answer**

  Ada's case provides a decisive wedge between the two formulations of van Fraassen's Reflection Principle, demonstrating that the principle's status as a norm depends entirely on the assumed rationality of the future self.

  First, consider the Expectation version, which requires that current credence equal the expected value of future credence. Ada's current credence in rain is 0.5. Her future credence, $C_1(R)$, will be 0.8 with probability 0.5 and 0.2 with probability 0.5. The expected future credence is $(0.5 \times 0.8) + (0.5 \times 0.2) = 0.5$. Since $C_0(R) = E[C_1(R)]$, Ada satisfies the Expectation version. This version is weak; it merely requires that the future self is not *biased* on average. It permits the future self to be wrong, provided the errors cancel out. Ada passes this bar because the service's misleading signals are symmetrically distributed around her prior.

  However, Ada catastrophically fails the Conditional version. This version requires that, conditional on knowing her future credence will be $x$, her current credence should be $x$. Suppose Ada conditions on the event that her future credence will be 0.8. Since she blindly adopts the text, this is equivalent to conditioning on the service texting 0.8. Ada knows that when the service texts 0.8, the objective chance of rain is 0.3. Therefore, $C_0(R | C_1(R)=0.8) = 0.3$. Reflection demands this value be 0.8. Since $0.3 \neq 0.8$, Reflection is violated. The same logic applies to the 0.2 case (where her conditional credence should be 0.7, but Reflection demands 0.2).

  This divergence illuminates the theoretical status of Reflection. The Conditional version is often defended as a theorem of probability calculus, but only under the assumption that the future self is a conditionalizer on total evidence. If $C_1$ is derived from $C_0$ by conditionalizing on evidence $E$, then learning $C_1=x$ is equivalent to learning $E$, making the current conditional credence match $x$. In Ada's case, this assumption is false. She is not conditionalizing on the text as evidence; she is overwriting her credence. She knows the text carries evidence for *low* rain (when 0.8), but she plans to believe *high* rain.

  Consequently, Reflection cannot be a universal normative constraint. It is not a requirement of rationality simpliciter; rather, it is a constraint that holds only when the agent regards their future self as an epistemic superior or peer who is updating rationally. Ada knows her future self will be irrational (ignoring the known negative correlation). To satisfy Reflection here would require Ada to ignore her current knowledge about the service's reliability, which would itself be irrational.

  Therefore, the Ada case confirms that the Conditional version of Reflection is substantive, not trivial. It fails whenever the agent anticipates a break in rational continuity—whether through drugs, forgetting, or blind deference to anti-reliable sources. The Expectation version survives because it is too weak to capture the sufficiency claim of Reflection: knowing the future number *should* screen off other information, but for Ada, knowing the number activates information (the service's record) that overrides the number itself. Reflection is not a law of thought; it is a consequence of planned conditionalization.

  ***

  **Marking Scheme (25 Marks Total)**

  **1. Correct Calculation of Expectation Version (5 Marks)**
  *   **Must Hit:** Candidate explicitly calculates $E[C_1] = 0.5$ and notes it matches $C_0$. States that the Expectation version is satisfied.
  *   **How they blow it:** They assume Reflection fails globally and skip the calculation, or they confuse expectation with the conditional value.

  **2. Correct Calculation of Conditional Version (5 Marks)**
  *   **Must Hit:** Candidate identifies that $C_0(R | C_1=0.8)$ is 0.3 (based on service reliability), not 0.8. States that the Conditional version is violated.
  *   **How they blow it:** They assert $C_0(R | C_1=0.8)$ must be 0.8 by definition, missing that Ada has independent evidence about the service's reliability.

  **3. Distinction Between Weak (Expectation) and Strong (Conditional) (5 Marks)**
  *   **Must Hit:** Explicitly articulates that Expectation only requires lack of bias, while Conditional requires the future value to be *sufficient* information.
  *   **How they blow it:** They treat the two versions as interchangeable or fail to explain why one holds while the other fails.

  **4. The "Theorem vs. Norm" Insight (5 Marks)**
  *   **Must Hit:** Explains that Reflection functions as a theorem only if the future self is conditionalizing. Since Ada is not conditionalizing (she is overwriting), the theorem conditions aren't met.
  *   **How they blow it:** They recite the standard "Drug Case" memorized from lectures without applying the conditionalization logic to Ada's specific updating rule.

  **5. Epistemic Deference and Rationality (5 Marks)**
  *   **Must Hit:** Concludes that Reflection is not a universal norm but depends on viewing the future self as rational/epistemically privileged. Ada knows her future self is misaligned with evidence.
  *   **How they blow it:** They conclude Ada is simply "irrational" without explaining why that specific irrationality breaks the link between present and future credence required by Reflection.
