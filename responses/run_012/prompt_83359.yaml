answer: |-
  ### Brainstorming Framings

  There are at least three distinct ways to frame the problem of information value, each leading to a different research trajectory.

  The first framing treats the issue as one of **representation**. On this view, Good's theorem is a mathematical consequence of the expected utility representation. If an agent exhibits a preference for less information, they simply fail to satisfy the axioms of the model (perhaps violating independence or state-independence). The philosophical question dissolves: the theorem is true within the model, and agents who violate it are merely outside the model's scope. This framing is clean but deflationary; it protects the theorem by making it tautological, failing to address the intuitive force of the "free information" platitude.

  The second framing treats the issue as one of **diachronic norms**. Here, the focus shifts to dynamic consistency and planning. The question becomes whether a rational agent, anticipating future information, should bind themselves to ignore it. This invites a debate between sophisticated and resolute choice. However, this risks conflating the *value* of the information with the *management* of the self over time. It moves the goalposts from the intrinsic value of information to the stability of preferences, which may obscure the core issue of whether information itself alters payoff structures.

  The third framing treats the issue as **ontological**, concerning the definition of outcomes and utility. This approach asks whether the standard model correctly specifies the objects of preference. If utility depends on the agent's epistemic state (e.g., peace of mind, curiosity, regret), then the "state-independent utility" assumption of Good's theorem is false by fiat. This framing allows us to ask whether the exclusion of epistemic states from the outcome space is a justified idealization or a substantive error.

  I choose the **ontological framing**. The representation framing dismisses the phenomenon too quickly, and the diachronic framing complicates the issue with temporal consistency problems that are secondary to the valuation of information itself. The ontological approach targets the root assumption: that the value of an act is independent of what the agent knows. By challenging the state-independence assumption directly, we can determine whether the non-negativity of information is a universal norm or a local artifact of a specific utility ontology.

  ***

  ### Abstract

  Is the non-negative value of information a substantive norm of rationality or an artifact of the expected utility model? Good's theorem proves it for agents with fixed priors and state-independent utility, but the informal principle is often taken to apply more broadly. This project argues that the principle fails when utility depends on the agent's information partition, as in cases of anticipated regret or curiosity. By constructing a formal model of partition-dependent utility, I will demonstrate that rational agents may rationally pay to avoid information. The result distinguishes between mathematical theorems within a representation and genuine constraints on rational choice, showing that "free information cannot hurt" is not a universal requirement of instrumental rationality.

  ### The question, stated precisely

  The core question is whether the principle that "free information is weakly beneficial" constitutes a substantive constraint on rational choice or merely a theorem contingent on specific modeling assumptions. Good's theorem establishes that for an expected utility maximizer with a fixed prior probability distribution, a fixed set of available acts, and a utility function defined solely over world-states (independent of the agent's information partition), the expected utility of a decision problem is weakly increasing as the information partition is refined. The proof relies on the agent's ability to condition their choice on the signal received, while retaining the option to ignore it.

  The contested claim is the informal gloss often attached to this theorem: that any rational agent, regardless of their specific preferences, must regard the opportunity to observe a costless signal as non-detrimental. This claim extends beyond the mathematical conditions of the theorem to assert a normative truth about instrumental rationality. The specific objection to be investigated is that this gloss fails when the utility of an act is sensitive to the agent's epistemic state. In such cases, acquiring information alters the utility function itself, not merely the probability distribution over states. Consequently, the option to "ignore" the information does not restore the original payoff, because the mere possession of the information changes the value of the act chosen.

  The project seeks to determine whether there exists a coherent class of preference structures, consistent with basic rationality requirements like transitivity and dominance, where the ex ante value of costless information is strictly negative. If such structures exist, the non-negativity principle is not a universal norm but an artifact of the state-independence assumption. The question is therefore not whether Good's theorem is mathematically valid—it is—but whether its assumptions capture the full range of rational attitudes toward information.

  ### Why the question is open

  The question remains open because there are compelling arguments on both sides regarding the status of the state-independence assumption. The strongest case for treating non-negativity as a substantive constraint rests on a robust conception of instrumental rationality. On this view, information is a tool for mapping acts to states more accurately. If an agent can always choose to act as though they had not received the signal, they can guarantee at least the same expected payoff as they would have without the signal. To claim that information can hurt is to claim that an agent can be forced into a worse position by the mere availability of a mapping between signals and states. This seems to violate the principle of freedom: having more options (including the option to ignore) should not reduce welfare. Proponents argue that if an agent prefers ignorance, this preference should be modeled as a preference over world-states (e.g., a state where one is ignorant) rather than a violation of the information value principle.

  Conversely, the strongest case for treating non-negativity as an artifact relies on the phenomenology of decision-making. There are well-documented cases where the utility of an outcome is intrinsically tied to the agent's knowledge. A patient may prefer a treatment with a lower survival rate if it allows them to remain hopeful, whereas knowing the grim statistics induces despair that lowers the quality of their remaining life. Here, the utility of the "survival" state is not fixed; it is modulated by the information partition. If we insist on modeling this within the standard framework by expanding the state space to include "knowing" and "not knowing," we risk trivializing the theorem. We can always save the theorem by redefining outcomes until the utility function appears state-independent again, but this moves the substantive content into the description of the states.

  The tension lies in whether we accept this redescriptions as legitimate modeling or as ad hoc maneuvers to preserve a theorem. If the latter, then the non-negativity principle holds only for agents whose utilities are genuinely independent of their epistemic states. Since many plausible accounts of well-being include epistemic components like curiosity, anxiety, or regret, the class of agents to whom the theorem applies may be narrower than the class of rational agents. The literature has not yet settled whether partition-dependence is a rational permissible feature of preference or a violation of coherence. Until we have a formal taxonomy of when partition-dependence is rationally required versus when it is a framing error, the normative status of the information value principle remains unresolved.

  ### Method and plan of work

  The project will proceed in four phases over twelve months, moving from formal reconstruction to conceptual taxonomy and finally to argumentative synthesis. The goal is not merely to produce counterexamples, but to categorize the conditions under which they arise and determine their normative significance.

  **Months 1–3: Formal Reconstruction.** I will begin by formalizing the standard Good's theorem setup to isolate the state-independence assumption precisely. I will then develop a generalized decision model where the utility function is defined over pairs of world-states and information partitions. This involves defining a partition-dependent utility function and establishing the conditions under which expected utility is well-defined in this context. The deliverable for this phase will be a technical appendix establishing the formal language for the paper.

  **Months 4–6: Construction of Cases.** I will construct specific decision problems within this new framework that generate negative value of information. I will focus on three distinct mechanisms: anticipated regret (where knowing the forgone payoff lowers utility), curiosity (where not knowing is intrinsically preferred), and epistemic anxiety (where information induces stress affecting outcome value). For each case, I will demonstrate that the negative value persists even when the agent is allowed to ignore the signal, proving that the "option to ignore" defense fails when utility is partition-sensitive.

  **Months 7–9: Conceptual Taxonomy.** This is the critical philosophical phase. I will analyze the counterexamples to distinguish between rationally permissible partition-dependence and framing errors. I will develop criteria for when expanding the state space to restore state-independence is legitimate versus when it obscures the structure of the problem. This involves engaging with arguments about the individuation of outcomes without relying on specific literature citations, focusing instead on the structural properties of the preferences.

  **Months 10–12: Drafting and Refinement.** I will synthesize the formal results and the philosophical analysis into the final paper. The argument will move from the formal demonstration of negative value to the normative conclusion that non-negativity is not a universal constraint. I will spend the final month refining the prose for clarity and ensuring the formalism is accessible to philosophers without extensive technical training.

  This approach is superior to simply hunting for counterexamples because it addresses the likely rebuttal: that any counterexample can be absorbed into the standard model by redefining outcomes. By focusing on the taxonomy of outcome individuation, the project addresses the structural reason why the standard model resists these cases, rather than just presenting anomalies that might be dismissed as modeling errors.

  ### What success and failure look like

  Success for this project is not merely proving that Good's theorem has assumptions, which is already known, but demonstrating that relaxing those assumptions yields a coherent and normatively significant class of rational agents. A successful result will provide a clear taxonomy distinguishing between "value of information" as a theorem of expected utility and "value of information" as a normative principle. It will show that there are rational preference structures where paying to avoid information is not a pathology but a consistent expression of values regarding one's own epistemic state. The paper will have successfully carved out a space for partition-dependent utility that is not reducible to a mere relabeling of states.

  Failure would look like demonstrating that all apparent cases of negative information value can be seamlessly modeled within the standard framework by sufficiently fine-grained individuation of world-states. If it turns out that every instance of "wanting not to know" can be represented as a preference over a state described as "being in ignorance," then the non-negativity principle survives as a universal norm, and my objection collapses into a terminological dispute about how to describe outcomes.

  I would abandon the project if, during the taxonomy phase, I find that partition-dependent utility inevitably leads to dynamic inconsistency or Dutch books that cannot be resolved without abandoning transitivity. If the cost of maintaining the objection is accepting irrationality in other domains, the trade-off is not worth making. Additionally, if the formalism becomes so complex that it cannot be explained within a 30-page limit without sacrificing clarity, I would scale back the formal scope to focus purely on the conceptual argument, though this would reduce the technical contribution.

  ### Scope, feasibility and risks

  This project is feasible within one year because it requires no empirical data collection and builds on existing formal tools. The primary risk is the "Harsanyi doctrine" rebuttal: the claim that any rational preference can be modeled with state-independent utility if the state space is described sufficiently finely. Defending against this requires careful philosophical argumentation about the limits of outcome individuation, which is time-consuming. If this defense proves too expansive for a single paper, I will cut the discussion of curiosity and focus exclusively on anticipated regret, which offers the sharpest formal counterexample. Another risk is that the formal model becomes too technical for the target audience. I will mitigate this by keeping the formalism in the appendix or limited to essential definitions, prioritizing the philosophical argument in the main text. The scope is tight enough for a single paper but broad enough to make a substantive contribution to the literature on the value of information.
