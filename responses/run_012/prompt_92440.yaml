      *   *Diagonalization:* It's a mapping trick. $f(x) \to \phi_x(x)$. It guarantees a sentence $\psi$ such that $F \vdash \psi \leftrightarrow \phi(\ulcorner \psi \urcorner)$.
      *   *What it gives:* A syntactic collision. A string that *codes* for a property of itself.
      *   *What it lacks:* Causal efficacy. The sentence $G$ doesn't *do* anything to the system. It sits there. The system doesn't read $G$ and say, "Oh, I should change my axioms."
      *   *Self-Modeling:* Requires a representation $M$ of system $S$ inside $S$, such that changes to $M$ cause changes to $S$. This is cybernetics/control theory, not just logic.
      *   *Key Distinction:* *Reference* vs. *Causation*. Gödel gives reference. Minds need causation.

  4.  **Address Question 2: Self-Revising Systems & The Regress:**
