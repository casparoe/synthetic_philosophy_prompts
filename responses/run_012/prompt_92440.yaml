      *   *Section 3: The Regress.* Explain Feferman/Transfinite progressions. You can revise, but the *rules for revision* are fixed. To revise the rules for revision, you need a meta-meta-system. The "Self" always retreats one level up.
      *   *Section 4: The Real Disagreement.*
