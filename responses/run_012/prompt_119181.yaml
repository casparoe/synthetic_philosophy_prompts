answer: |-
  You are fighting the Sorites paradox on deadline, and you are right that philosophy has the map, even if it doesn't have the shoes. The problem isn't that these words lack meaning; it's that their meaning depends on where you draw a line that nature hasn't drawn. The procedure below translates supervaluationism (truth across all reasonable definitions), epistemicism (hidden hard cutoffs), and degree theory (truth gradients) into a desk checklist. It is designed to take ten minutes. It will not solve the metaphysics, but it will stop the fights.

  ### The Vagueness Desk Check

  **Step 1: The Registry Scan (Epistemicism Check)**
  Ask: Is there an institutional, legal, or scientific registry that defines this predicate with a number?
  *   **Search:** Look for CDC guidelines, EPA thresholds, Fire Service incident reports, or census definitions.
  *   **Sufficient Answer:** Yes, there is a number (e.g., "contained" means 100% perimeter controlled; "elderly" often triggers at 65 for Medicare).
  *   **Procedure Action:** If the fact matches the number, print it. If the fact misses the number by any margin, **forbid the bare predicate.** You must qualify it (e.g., "mostly contained") or use the number.
  *   **Human Decision Point:** If multiple registries conflict (e.g., ecology vs. logging industry definitions of "old growth"), proceed to Step 2.

  **Step 2: The Competent Dissenter Test (Supervaluationism Check)**
  Ask: If I showed this sentence to three competent experts in the field, would at least one of them say it is false based on a reasonable definition they use?
  *   **Search:** Call a source or check recent literature for dissenting classifications.
  *   **Sufficient Answer:** No dissenters (all reasonable sharpenings agree) → Print. Yes, there is a dissenter (true on some sharpenings, false on others) → The claim is **borderline.**
  *   **Procedure Action:** If borderline, you cannot print the bare predicate. You must qualify it ("arguably," "by some measures") or switch to a graded description ("advanced age," "mature forest").
  *   **Human Decision Point:** Deciding who counts as a "competent expert" is itself vague. If you cannot decide if the dissenter is crank or expert, proceed to Step 5.

  **Step 3: The Stakes Assessment (Pragmatics Check)**
  Ask: If we are wrong about this classification, does anyone get hurt, lose money, or lose rights?
  *   **Search:** Evaluate the consequence of error.
  *   **Sufficient Answer:** Low stakes (poetic description, general context) → You may retain the bare predicate if Step 2 was borderline, but add a qualifier. High stakes (medical treatment, policy enforcement, safety status) → **Forbid the bare predicate.**
  *   **Procedure Action:** High stakes + Borderline = Kill the word. Use numbers or specific descriptions only.
  *   **Human Decision Point:** Determining "harm" is a value judgment, not a fact. If the harm is ethical rather than physical (e.g., stigma), proceed to Step 5.

  **Step 4: The Gradient Fix (Degree Theory Check)**
  Ask: Can we replace the binary switch with a slider?
  *   **Search:** Look for adverbs or comparative structures.
  *   **Sufficient Answer:** Yes, the sentence works with "mostly," "increasingly," "relatively," or "approaching."
  *   **Procedure Action:** Rewrite the sentence using the gradient. If the sentence breaks without the binary claim (e.g., legal eligibility), go to Step 5.
  *   **Human Decision Point:** If the gradient sounds weaselly enough to undermine the story's authority, proceed to Step 5.

  **Step 5: The Escalation (Higher-Order Vagueness & Values)**
  Ask: Is the boundary between "clearly true" and "borderline" itself unclear, or is this a policy question?
  *   **Search:** Acknowledge that Step 2 and Step 3 rely on your judgment, which is also vague.
  *   **Sufficient Answer:** You are unsure if the uncertainty matters, or the choice involves social values (e.g., stigma, political framing).
  *   **Procedure Action:** **Stop.** Hand the sentence to the Editor-in-Chief or the relevant Section Editor.
  *   **Note:** This step admits the procedure cannot solve higher-order vagueness. It flags that the decision is now about magazine voice and values, not truth conditions.

  ***

  ### Limitations and Honesty
  This procedure cannot tell you where the line *is*, because there often isn't one. It only tells you when you are standing near the fog. Step 2 (The Competent Dissenter) is the shakiest part; deciding who counts as "competent" is itself a borderline case. This is higher-order vagueness. The procedure handles this by forcing escalation in Step 5. Also, this procedure will slow you down. It prioritizes accuracy over flow. If you need speed over precision, do not use this.

  ***

  ### Test Run: Three Sentences

  **1. "The fire is contained."**
  *   **Step 1 (Registry):** Fire service definitions usually require 100% of the perimeter to have a control line. Report says 95%. **Fail.**
  *   **Step 2 (Dissenter):** A fire chief would say this is false. **Borderline.**
  *   **Step 3 (Stakes):** High. Evacuation orders depend on this. **High Stakes.**
  *   **Step 4 (Gradient):** "The fire is mostly contained" works.
  *   **Step 5 (Escalation):** Not needed.
  *   **Verdict:** **Forbid.** Change to "The fire is 95% contained" or "largely contained." Do not print "contained."
  *   **Reasoning:** Epistemicism wins here. There is a operational definition, and you missed it. Safety stakes forbid the shorthand.

  **2. "This is an old-growth forest."**
  *   **Step 1 (Registry):** No single universal age. Forestry service has one definition, ecologists have another, indigenous groups have a third. **Conflict.**
  *   **Step 2 (Dissenter):** Yes. A logger might say it's second-growth; an ecologist says it's mature. **Borderline.**
  *   **Step 3 (Stakes):** Medium. Affects policy perception, but no immediate safety risk.
  *   **Step 4 (Gradient):** "This is a mature forest with old-growth characteristics" works.
  *   **Step 5 (Escalation):** The definition is politically charged.
  *   **Verdict:** **Qualify.** You must add the metric or the qualifier. "This is a 200-year-old stand, classified by the agency as old-growth."
  *   **Reasoning:** Supervaluationism applies. It is true on some sharpenings, false on others. You must signal which sharpening you are using.

  **3. "The patient is elderly."**
  *   **Step 1 (Registry):** Census/Medicare often uses 65. Patient is 63. **Fail.**
  *   **Step 2 (Dissenter):** Many geriatricians argue "elderly" is a social construct, not a biological state, and discourage its use for anyone under 75 or even at all. **Borderline/False.**
  *   **Step 3 (Stakes):** Medium-High. Social stigma, medical bias.
  *   **Step 4 (Gradient):** "The patient is older" works, but is weak.
  *   **Step 5 (Escalation):** This is a value judgment on language usage.
  *   **Verdict:** **Kill.** Do not use the word "elderly." Use "63-year-old" or "older adult."
  *   **Reasoning:** This is the answer you will hate. You want the word because it's efficient and readers understand it. But the term is scientifically imprecise (Step 1 fail) and socially contested (Step 2 fail). In a science magazine, using a pejorative shorthand that fails the registry check is indefensible. It signals sloppiness to the very sources you need to trust you. I know you want to keep it for flow, but the procedure forbids it.

  ***

  Bottom line: If a reasonable expert could call the claim false, or if an official threshold exists that you haven't met, you must qualify the predicate or kill it.
