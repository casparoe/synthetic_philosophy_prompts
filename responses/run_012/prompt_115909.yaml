  ### The Test Case: The Fish Lake

  **Scenario:** A lake has a limit of 5 fish. 10,000 anglers are present. You take 6. The population crashes.

  **Application of Salient Complicity:**
  1.  **Directness:** You physically pulled the 6th fish out of the water.
  2.  **Tangibility:** You are holding the forbidden fish. There is a clear rule (5 fish) that you visibly broke.
  3.  **Agency:** This is an active commission, not a passive omission.

  **Verdict:** **Wrong.**
  Even though your one fish didn't crash the population (statistical impact), you are a **salient complicit actor**. You directly violated a clear norm of maintenance for a shared resource. This aligns with your Littering verdict (breaking a rule of shared space) and your Burger verdict (directly taking life/resource).

  ### Explaining the Voting vs. Littering Paradox

  You mentioned this kills you: *"Voting and the bottle out the window look identical on paper... but I think one of them is fine and the other is wrong."*

  Under Salient Complicity, they are **not** identical.
  *   **Littering** is **Active Contamination.** You are introducing a negative element into a clean system. You are the *source* of the trash.
  *   **Not Voting** is **Passive Non-Support.** You are failing to introduce a positive element into a system that functions without you. You are not the *source* of the election outcome.

  Your brain treats **creating a mess** (Littering) as a much heavier moral violation than **failing to clean a mess** (Not Voting). This is a standard human moral heuristic (Commission vs. Omission bias). It is consistent with your feeling about the Faucet (running water is active waste, but invisible, so it feels like omission) vs. the Car (driving is active pollution).

  ### Summary Recommendation

  1.  **Adopt the Principle:** You are a **Deontologist of Complicity**, not a Consequentialist. You care about keeping your own hands clean of direct harm, not about calculating the total harm in the world.
  2.  **Drop the Flight Verdict:** Acknowledge that the flight is morally equivalent to the burger. If the burger makes you guilty, the flight should too. The only defense is that "Seeing Sister" is a higher moral good than "Tasting Beef," which justifies the harm, but does not erase the guilt.
  3.  **Accept the Voting Verdict:** Your feeling that skipping the vote is okay is consistent with your principle (Passive Omission vs. Active Violation), even if it contradicts your advice to friends. To fix that, either vote, or stop telling friends it matters.

  This principle explains 95% of your gut feelings. The 5% inconsistency is the Flight, which you are letting off the hook because the harm is invisible, despite your willingness to feel guilty about the invisible harm of the Sweatshop T-Shirt.
