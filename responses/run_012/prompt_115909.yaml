answer: |-
  Based on the pattern of your gut feelings, you are not operating on a principle of **Consequences** (how much harm is done) or **Universalizability** (what if everyone did it). If you were, the flight would be your biggest guilt trip, and skipping the vote would be unacceptable.

  Instead, your moral intuition is driven by what I will call **The Principle of Salient Complicity**.

  ### The Principle of Salient Complicity

  **Definition:** An action is morally wrong when you are a **direct, visible participant** in a specific harmful act or norm violation, where the link between your agency and the negative outcome is **tangible and immediate**. An action is morally neutral when your contribution is **statistical, mediated by infrastructure, or invisible**, even if the aggregate harm is larger.

  **The Three Filters:**
  1.  **Directness:** Did I specifically pay for or perform the harmful act? (vs. using a system that happens to be harmful).
  2.  **Tangibility:** Is the harm/norm violation physically visible or socially defined? (vs. abstract or atmospheric).
  3.  **Agency:** Is this an active commission of a wrong? (vs. a passive omission).

  ---

  ### How This Principle Maps Your Cases

  Here is how your gut verdicts align with this principle, and where the tension lies.

  | Case | Your Verdict | Why it fits Salient Complicity |
  | :--- | :--- | :--- |
  | **Littering (Bottle)** | **Wrong** | **Direct & Tangible.** You physically placed trash where it doesn't belong. You are the sole cause of that specific piece of litter. |
  | **Burger** | **Wrong** | **Direct Transaction.** You paid money, a cow died. The link is immediate and specific to your order. |
  | **Sweatshop T-Shirt** | **Wrong** | **Direct Transaction.** You paid money, a human was exploited. The link is specific to your purchase. |
  | **Car vs. Bus** | **Mildly Wrong** | **Direct & Visible.** You chose the polluting option when a clean one was available right there. |
  | **Flight to Portugal** | **OK** | **Mediated.** You bought a seat, but the plane burns fuel. The harm is atmospheric (invisible) and shared by hundreds of others. |
  | **Voting (Safe State)** | **OK** | **Passive Omission.** You didn't *cause* the election result; you just didn't stop it. Your impact is purely statistical. |
  | **Unrinsed Jar** | **OK** | **Mediated/Invisible.** The jar is already trash. The harm (recycling contamination) is hidden inside a bin. |
  | **Faucet Running** | **OK** | **Invisible.** The water disappears into pipes. No visible mess is created. |

  ### The Inconsistency You Must Drop

  You asked which verdict is flat-out inconsistent with the others. It is **The Flight**.

  **Why:** Under your own principle of Salient Complicity, the Flight looks much more like the Burger and the T-Shirt than you are allowing it to.
  1.  **Directness:** Just like the burger, the plane does not fly *that specific route* with *that specific fuel burn* unless tickets are sold. You are a direct purchaser of the emission.
  2.  **Agency:** You actively booked it. It wasn't an omission (like voting); it was a commission.
  3.  **The Disconnect:** You are shielding the Flight because the harm is **atmospheric** (invisible CO2) rather than **biological** (visible blood/exploitation). But you penalize the T-Shirt (human harm) and Burger (animal harm) based on the *transaction*, not just the visibility of the blood.

