answer: |-
  This is a profound difficulty, one that sits at the fault line between the ethics of history and the aesthetics of fiction. Your editor is protecting the dead from exploitation; you are protecting them from erasure. Both are valid impulses, but they are operating on different maps of what the archive *is*.

  You are right to distrust the mirror. In the philosophy of history, the "mirror" theory of the archive was largely dismantled in the late 20th century (by thinkers like Michel-Rolph Trouillot, Jacques Derrida, and Carolyn Steedman), yet it persists in editorial common sense because it offers a comforting illusion of objectivity.

  Let us audit the metaphor, as you requested.

  ### 1. The Mapping: The Archive as Mirror

  For your editor's analogy to hold, the following correspondences must be accepted as true.

  | Element in Analogy | Role in the "Mirror" Theory | What Must Be True of the Archive |
  | :--- | :--- | :--- |
  | **The Mirror** | The Archive (the collection of documents). | It must be a passive surface; it does not choose what to show. |
  | **The Object** | Historical Reality (the past as it occurred). | It must exist independently of the mirror; it precedes the record. |
  | **The Reflection** | The Document (the text in the file). | It must correspond 1:1 with the Object; no distortion. |
  | **The Light** | Truth / Evidence / Visibility. | It must be uniform; nothing is hidden in shadow. |
  | **The Frame** | The Scope of the Archive. | It limits the view, but does not alter what is within it. |
  | **The Hand** | The Archivist / State / Collector. | They hold the mirror steady; they do not tilt it to hide things. |
  | **The Viewer** | The Historian / Novelist. | They see the reflection directly; no interpretation needed. |

  **Condition for Grip:** For this picture to work, the archive must be a *receptive* technology. It must record what is placed before it without altering the shape of the thing recorded. Silence, in this model, can only mean one thing: there was nothing there to reflect.

  ### 2. Where the Mapping Breaks

  We must distinguish between breaks that are merely poetic (decorative) and breaks that undermine the editor's argument (structural).

  **A. Decorative Breaks (Do not affect the argument)**
  *   **Reversal:** A mirror flips left and right; an archive does not necessarily invert facts. *Irrelevant.*
  *   **Fragility:** A mirror breaks; archives decay. *Irrelevant.*
  *   **Immediacy:** A reflection vanishes when the object leaves; a document persists. *Irrelevant.*

  **B. Structural Breaks (Undermine the argument)**
  *   **Agency (The Hand):** A mirror does not choose what to reflect. An archive is the product of *selection*. Someone decided which bills of sale to keep, which depositions to transcribe, and which lives warranted ink.
      *   *Why it matters:* If the archive selects, then silence is not necessarily an absence of people; it may be an absence of *interest*.
  *   **Production (The Light):** A mirror reflects existing light. An archive *generates* light. By creating a category (e.g., "indentured servant," "pauper"), the archive brings a certain type of person into visibility while rendering their other qualities invisible.
      *   *Why it matters:* The document does not reflect the person; it reflects the *institution's need* for the person.
  *   **Dimensionality (The Reflection):** A mirror shows a surface. An archive often records a legal fiction. A court deposition records not what was said, but what the court required to be heard to make a judgment.
      *   *Why it matters:* The "reflection" is already a translation. To stick only to the text is to stick to the translation, not the source.
  *   **The Nature of Silence:** In a mirror, an empty space means no object. In an archive, an empty space can mean a suppressed object.
      *   *Why it matters:* This is the crux. Your editor treats archival silence as *ontological* (they did not exist/write). Historiography treats it as *political* (they were not permitted to register).

  ### 3. What the Mirror Quietly Imports

  The mirror metaphor smuggles in three assumptions that the archive does not possess. These are the engines driving your editor's conclusion.

  1.  **Passivity:** The mirror implies the archive is innocent. It suggests the absence of your characters is an accident of survival, not a design of power.
      *   *Work done:* This licenses the editor's rule. If the archive is innocent, interfering with it is a violation.
  2.  **Completeness (within the frame):** The mirror implies that what is visible is *all* that is there. It denies the existence of things outside the frame of institutional interest.
      *   *Work done:* This makes interiority seem like an invention rather than a reconstruction. If the document shows a "laborer," the mirror says there is *only* a laborer.
  3.  **Neutrality:** Glass does not tint. The mirror implies the language of the record is transparent.
      *   *Work done:* This makes the document's categories (e.g., "vagrant") seem like facts rather than judgments.

  **The Real Work:** The assumption of **Passivity** is doing the heaviest lifting. It allows your editor to claim that fidelity to the document is fidelity to the *person*. If the archive is passive, the document *is* the person. If the archive is active (a producer of silence), the document is merely the *trace* of the person.

  ### 4. The Verdict

  Does your editor's conclusion survive the disanalogies? **No.**

  The conclusion—that documentary fidelity is the only honest course and invention is falsification—relies entirely on the premise that the archive is a neutral repository of truth. Once we establish that the archive is an active producer of silence (a "sieve" designed to catch specific things and let others fall), the ethical calculus shifts.

  **Where the step fails:**
  The editor moves from *Ontology* (what the archive is) to *Ethics* (what the novelist must do) without crossing the bridge of *Interpretation*.
  *   **Editor's Logic:** Archive = Reality. Therefore, Novel = Archive.
  *   **Corrected Logic:** Archive = Trace of Power over Reality. Therefore, Novel = Interpretation of the Trace to recover Reality.

  **However,** a warning: The editor is right about the risk of "sentimental ventriloquism." Just because the mirror is broken does not mean you are free to paint whatever you like on the glass. If the archive is not a mirror, it is also not a blank canvas. You owe the dead a different kind of fidelity: not fidelity to the *text*, but fidelity to the *conditions of their silencing*.

  To invent an interior life is not falsification *if* you acknowledge that the interior life is the very thing the archive sought to erase. It becomes falsification only if you present that interiority as if it were documented fact.

  ### 5. The Better Analogy

  Your candidate, the **Sieve**, is an improvement over the Mirror, but it has a flaw. A sieve implies that the "truth" (the grain) was once available and simply fell through by accident. It suggests a random loss. But as you noted, the silence is not random; it falls "precisely where a society had no institutional need to write."

  I propose a different instrument: **The Archive as a Shadow.**

  **The Mapping:**
  *   **The Object:** The lived reality of your characters.
  *   **The Light:** The power of the State/Institution (sunlight is directional, not uniform).
  *   **The Surface:** The Paper/Record (where the shadow falls).
  *   **The Shadow:** The Document (the archive).

  **Why this is better:**
  1.  **It acknowledges the Source:** A shadow proves an object exists, even if the object is out of frame. (Your characters existed, even if their voices are not).
  2.  **It acknowledges Distortion:** A shadow changes shape depending on the angle of the light. A court deposition changes the shape of a life depending on the legal questions asked.
  3.  **It acknowledges Absence:** A shadow is made of darkness. The archive is made of what was *not* said as much as what was.

  **What this licenses for the Novelist:**
  *   **Inference:** You may infer the shape of the object from the distortion of the shadow. If the shadow is long and thin, you know the light was low. If the record is angry, you know the institution was threatened. You can write the interior life that *casts* that shadow.
  *   **Contextual Reconstruction:** You are licensed to use historical knowledge of the "light source" (the laws, the economics, the social norms) to reconstruct the person standing in front of it.

  **What this forbids (The Constraint):**
  *   **Identity:** You cannot claim the shadow *is* the person. You cannot write a diary entry and present it as "what she wrote." You must write it as "what she might have felt while the scribe wrote *this*."
  *   **Ignoring the Light:** You cannot describe the person without acknowledging the light that distorts them. You cannot write a "free" interiority if the light source is slavery. The interiority must be shown *in relation to* the constraint.

  **The Verdict on Invention:**
  Under the **Shadow** model, invented interiority is not a claim about *what the document says*. It is a claim about *what the document obscures*.
  *   **Mirror Ethics:** "I am showing you what is there." (Forbidden if not in text).
  *   **Shadow Ethics:** "I am showing you what stood here to cast this shape." (Permitted, if historically grounded).

  **Conclusion:**
  Your editor wants you to write a transcript. You are writing a resurrection.
  The archive is not a mirror; it is a **monument to what mattered to the powerful**. Your novel's job is not to polish that monument, but to walk around it, find the shadow it casts, and describe the body that was standing there when the light hit.

  You are not falsifying history by imagining their minds. You are falsifying history only if you pretend the archive didn't try to stop you. Write the interiority, but let the reader feel the weight of the silence you are breaking. That is the fidelity you owe.
