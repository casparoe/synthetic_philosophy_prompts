answer: |-
  Good evening.

  I have been given six minutes. That is a precise number. Three hundred and sixty seconds. In honor of our guest of honor, I should probably tell you that my actual speaking time is better represented as an interval: somewhere between five and seven minutes, depending on how fast I talk and whether anyone interrupts me. But the committee asked for six, so I will aim for the center of that target, while acknowledging that hitting it exactly would be a matter of luck, not skill.

  For fifteen years, I have interviewed [Name] on and off. I have recorded her voice, transcribed her thoughts, and tried to translate her mind for readers who do not speak the language of decision theory. People often ask me: "What is she like?" They want a point estimate. They want me to say, "She is stubborn," or "She is kind."

  But if I have learned anything from her, it is that providing a single number when the evidence supports a range is not confidence; it is falsification.

  So, to answer that question candidly: My observation of her character falls within a wide confidence interval. She is, with high probability, one of the most intellectually honest people I have met. She is, with equal probability, one of the most frustrating people to argue with. These are not contradictory data points; they are the same feature viewed from different angles.

  To her children, her brother, and the family here tonight: You know her as a mother and a sister. I know her as a thinker. But the work you saw at the kitchen table and the work she published in the journals are the same project. She spent her career fighting against the demand for false precision.

  We live in a world that demands point values. What is the risk of this investment? 4.5 percent. How sure are you of this diagnosis? 90 percent. [Name] spent forty years arguing that often, the rational answer is not a number, but a gap. To say "I am between 60 and 80 percent sure" is not to say "I am unsure of my math." It is to say that the world itself does not warrant a sharper line. She taught us that honesty often looks like a blur, and that sharpening the image is sometimes just doctoring the photo.

  However, a speech that merely praises would violate her own standards. It would ignore the error bars. And there is a standard criticism of her work that I believe is fair, and which I must concede aloud.

  It is the problem of action.

  Her rivals in the room—the decision theorists who have spent decades telling her she is wrong—argue that eventually, you have to catch the bus. You have to take the bet. You have to choose the surgery. A range of probabilities can explain why you hesitate, but it does not tell you which way to jump. If your credence is between 0.4 and 0.6, and the bet pays off at 0.5, imprecise probability tells you why you are stuck, but it does not give you the lever to get unstuck.

  She never fully resolved this to the satisfaction of her critics. She believed that sometimes, suspending judgment *is* the rational action. Her critics say that life forces a choice. On this specific point, the record shows that the decision theorists have landed some genuine hits. I say this not to diminish her, but because she would be the first to tell you that a theory without known limitations is a dogma, not a science.

  And yet, despite that open variable, her impact is undeniable.

  To the specialists in this room: We know that she changed the grammar of our uncertainty. We no longer speak of "degrees of belief" without asking "whose?" and "based on what?"

  To the family: You taught her that life requires love, which is a risk no formula can calculate.

  And to [Name]: You taught us that it is okay to say, "It depends," without apologizing for it.

  I cannot predict exactly what your retirement will look like. I don't know if you will spend more time with your brother, or if you will finally write that book, or if you will simply sit in the garden. To predict a specific future would be to commit the very sin you spent your career exposing.

  But I can define the bounds. I am confident that your influence will not drop to zero. I am confident that the arguments you started will continue long after you have left the room. And I am confident that while your colleagues may continue to argue with your conclusions, none of us will ever be able to return to the comfortable, sharp-edged illusions we held before you arrived.

  So, I propose a toast.

  I will not say this is the "perfect" end to the evening. I will not say we are "100 percent" grateful.

  Let us simply say that our gratitude is substantial, our respect is bounded only by the limits of our own understanding, and our wish for your happiness is as wide as the uncertainty you taught us to embrace.

  To [Name].
