      *   *The Dichotomy:* Clearly define Stalinesque (falsification before presentation) vs. Orwellian (falsification after presentation). Note that both presuppose a "moment of consciousness."
      *   *Eye-Tracking:* This is tricky. If the eyes move *during* the inter-stimulus interval (ISI), it suggests the brain has already generated the motion signal. Does this mean consciousness has it? Not necessarily. The motor system might run on predictive algorithms that don't require conscious validation. *Key point:* The eyes might move, but does that prove the *qualia* existed at that moment?
      *   *Tone Judgment:* This relies on simultaneity judgments. If I hear a beep and say "the dot was green," did I experience green then? Or did I infer it? This looks like the "flash-lag effect" literature. It pushes the revision point but doesn't eliminate it.
