      *   *Counterfactual Sensitivity:* **Fatal.** Consciousness seems to require the *capacity* to respond, not just a pre-written script. This is the "Blockhead" argument.

  6.  **Addressing the User's Suspicions:**
      *   *Running Process vs. Static Artifact:* Real disanalogy. Computation requires state transitions driven by internal logic, not external manipulation.
      *   *Lookup Table vs. Computation:* Real disanalogy. A lookup table maps Input -> Output directly. A program calculates Output from Input via rules. The book is a trace of one specific run, not the general rule.
      *   *Identity of Program:* Real issue. Is the "program" the text or the rules of reading?

  7.  **Does the Conclusion Survive?**
      *   If the book is just a *record* of a mind, it's not conscious.
