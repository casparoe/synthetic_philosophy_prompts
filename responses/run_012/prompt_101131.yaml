  4.  **Identifying the Breaks (The Stress Test):**

      *   *Break 1: Static vs. Dynamic.* A book is static. It doesn't *do* anything unless read. If no one reads it, is it conscious? If the friend says "the physical structure mirrors states," does the ink *cause* the next page? No, a reader causes it.
      *   *Break 2: Causal Power.* In a brain, State A *causes* State B via electrochemical laws. In the book, Page 1 doesn't cause Page 2. The *reader* turns the page. The causal link is external.
      *   *Break 3: Counterfactuals (The Big One).* A brain reacts differently if you poke it. A lookup table (the book) has *one* path. If you change the input mid-stream, the book doesn't adapt unless it contains *every possible* permutation of inputs (which makes it astronomically large, effectively impossible).
      *   *Break 4: The "Homunculus" Problem.* Who is reading the book? If the reader is conscious, maybe the consciousness belongs to the reader, not the book. If the book is read by a non-conscious mechanism, does the causal chain hold?
      *   *Break 5: Implementation vs. Description.* A map is not the territory. A description of a storm isn't wet. A description of a computation isn't a computation.

  5.  **Evaluating the "Fatal" Breaks:**
      *   *Speed:* Incidental. Functionalism generally accepts slow thinking (e.g., a planet-sized computer).
      *   *Carbon Chauvinism:* Incidental. Most functionalists agree biology isn't magic.
