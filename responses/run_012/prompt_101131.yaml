answer: |-
  This is a classic functionalist thought experiment, closely related to Ned Block's "Chinese Nation" and Hilary Putnam's early work on functionalism, but it leans heavily into the "Lookup Table" objection. Your friend is arguing for **Substrate Independence** via **Computational Functionalism**.

  To stress-test this, we need to separate the *metaphor* (book/reading) from the *mechanism* (state transitions/causality). Your suspicions are well-founded: the book analogy smuggles in a "homunculus" (the reader) and confuses a *trace* of a computation with the *computation* itself.

  Here is the mapping, the breakdown of where the analogy fails, and an evaluation of whether the conclusion survives.

  ### 1. The Mapping (Friend's View)

  To give your friend the benefit of the doubt, here is the most charitable mapping of the Book Experiment to a Computational Theory of Mind:

  *   **Hardware:** The paper, ink, and binding (the physical substrate).
  *   **Memory/Storage:** The text on the pages (encoding the neural states).
  *   **CPU/Processor:** The **Reader** (eyes, brain, hands turning pages).
  *   **Software/Program:** The encoding scheme (the rules translating brain states to text) + The instruction "Turn to the page indicated by the current state."
  *   **Clock Cycle:** The speed of reading and page-turning.
  *   **I/O:** The reader vocalizing the output text; the reader feeding new input text into the search for the next page.
  *   **Consciousness:** The emergent property of the state-transition sequence, regardless of speed or substrate.

  ### 2. Where the Analogy Breaks

  We can categorize the breaks into **Incidental** (your friend is right to dismiss these) and **Structural** (these kill the argument).

  #### A. Incidental Breaks (Your friend is correct here)
  *   **Clock Speed:** Functionalism generally holds that slowing down a computation does not eliminate the computation. A planet-sized computer thinking one thought per century is still computing. The "slowness" of the book is not a fatal objection.
  *   **Carbon Chauvinism:** The idea that biology is magic is scientifically unsupported. If consciousness is a natural phenomenon, it should be replicable in non-biological substrates.
  *   **Material Composition:** Paper vs. Neurons. If the causal roles are identical, the material shouldn't matter.

  #### B. Structural Breaks (The Fatal Flaws)
  These are the disanalogies that matter for the conclusion.

  **1. The CPU/Memory Split (The Homunculus Problem)**
  *   **In the Brain:** The hardware *is* the processor. The electrochemical state of Neuron A *physically causes* the state change in Neuron B. The "reading" and the "writing" happen within the same system via physical laws.
  *   **In the Book:** The book is **passive storage**. It does not process anything. It requires an *external* agent (the Reader) to interpret the symbols and transition the state.
  *   **Why it matters:** If the Reader is conscious, then the consciousness belongs to the Reader, not the book. The book is just a prop. If the Reader is a non-conscious robot, you have simply pushed the question back: *Is the robot conscious?* If the robot is just following rules (Chinese Room style), where is the understanding? The book analogy hides the processor outside the system, whereas in the brain, the processor is intrinsic.

  **2. Trace vs. Algorithm (The "One Path" Problem)**
  *   **In the Brain:** The brain is an algorithm. It handles **counterfactuals**. If you poke Einstein with a pin, his brain state changes differently than if you don't. It has *conditional branching*.
  *   **In the Book:** Your friend describes writing out "that whole imagined conversation." This is a **trace** (a log of one specific run), not a **program**.
  *   **Why it matters:** A trace is not conscious. A recording of a conscious being is not conscious. For the book to be a mind, it would need to contain *every possible page* for *every possible input* at *every possible state* (a Look-Up Table of infinite size).
      *   If it's just the one conversation: It's a recording. Not conscious.
      *   If it's the infinite Look-Up Table: It faces Block's "Blockhead" objection. It simulates behavior perfectly but lacks internal causal dynamics. It doesn't "know" why it turns the page; it just matches a pattern.

  **3. Causal Powers vs. Symbolic Mapping**
  *   **In the Brain:** State transitions are driven by **causal powers**. Electricity flows because of voltage differences. The physics *does the work*.
  *   **In the Book:** State transitions are driven by **semantic interpretation**. Page 2 follows Page 1 only because the Reader *understands* the instruction "Go to Page 2." The ink on Page 1 does not physically force the Reader to Page 2.
  *   **Why it matters:** This is the core of Searle's Chinese Room argument. Syntax (symbols in the book) is not sufficient for Semantics (meaning/consciousness). The book relies on the *Reader's* mind to give the symbols causal power. Without the Reader's mind, the book is just dead trees. With the Reader's mind, the book is irrelevant.

  ### 3. Addressing Your Suspicions

  You asked specifically about three suspicions. Here is the verdict:

  **Suspicion 1: "A running process rather than a static artifact."**
  *   **Verdict:** **Real Disanalogy.**
  *   **Reasoning:** Computation is a verb; a book is a noun. A computer *runs*; a book *sits*. To make the book "run," you must add a machine to read it. Once you add that machine, the book is just memory (RAM/Hard Drive). A hard drive is not conscious. The friend is conflating *data* with *process*.

  **Suspicion 2: "A system that computes vs. a giant lookup table that merely encodes."**
  *   **Verdict:** **Real Disanalogy.**
  *   **Reasoning:** This is the difference between **generative rules** and **pre-computed outputs**. A brain computes $2+2$ by processing numbers. A lookup table just stores "4" next to "2+2". Functionalism usually requires the former (causal organization), not the latter (input-output mapping). If the book is a lookup table, it fails the "Absent Qualia" test—it acts conscious but isn't.

  **Suspicion 3: "Notion of what counts as the same program when the substrate is that different."**
  *   **Verdict:** **Real Disanalogy.**
  *   **Reasoning:** "Same program" implies **isomorphism of causal structure**. In the brain, the structure is dynamic and physical. In the book, the structure is static and symbolic. To claim they are the "same program," you must ignore *how* the state transition happens. But *how* it happens (causality vs. interpretation) is exactly what matters for consciousness.

  ### 4. Does the Conclusion Survive?

  **No.** The "Book Consciousness" conclusion does not survive this specific analogy.

  The analogy fails because it attempts to prove substrate independence by removing the **causal dynamics** that functionalism actually relies on. Functionalism claims consciousness depends on *causal organization*, not just *state description*.
  *   The book provides a **description** of states.
  *   The brain provides the **causal mechanism** for states.

  By stripping away the mechanism and leaving only the description, your friend has stripped away the very thing functionalism says is necessary. He hasn't proven consciousness is substrate-independent; he has proven that **maps are not territories.**

  However, the **broader claim** (Consciousness is substrate-independent) *might* still be true, just not for the reasons the book analogy gives. You can be a functionalist without accepting the Book Argument. You can argue that if you built a *dynamic* system (e.g., water pipes or logic gates) that physically replicated the causal transitions of a brain *without* a homunculus reader, *that* system might be conscious. The book fails because it is static and requires an external interpreter.

  ### 5. A Better Analogy

  If you want to defend functionalism/substrate independence without the baggage of the Book Argument, use the **Hydraulic Brain** or **Domino Computer** analogy.

  **The Analogy:**
  Imagine building a machine where water flows through pipes (or dominoes fall) in a configuration isomorphic to Einstein's neural network.
  *   **Hardware:** Pipes/Water (or Dominoes).
  *   **Software:** The layout of the pipes.
  *   **Process:** The water flowing (or dominoes falling).
  *   **Causality:** Water pressure at Point A *physically forces* a valve open at Point B. No "reader" is needed. The physics *is* the computation.

  **What this gives up:**
  1.  **It concedes that Causal Power matters.** Unlike the book, this system works without an interpreter. The state transitions are physical, not semantic.
  2.  **It concedes that Static Artifacts aren't conscious.** The dominoes must actually *fall*. A blueprint of the dominoes isn't conscious.
  3.  **It accepts the "Slow Mind" implication.** If the water flows slowly, the mind thinks slowly. This is a bullet functionalists must bite.

  **Why it's better:**
  It isolates the variable of **substrate** (water vs. neurons) while preserving the variable of **causal dynamics** (physical state transition). The Book Argument changes *both* variables (substrate AND dynamics), which is why it fails.

  ### Summary for your Friend
  Tell him this:
  > "The book isn't a mind; it's a **score**. A musical score contains all the information of a symphony, but the score isn't music until it's played. In your analogy, the **Reader** is the musician. If the Reader is conscious, the consciousness is theirs. If the Reader is a robot, you haven't explained where the understanding comes from.
  >
  > Functionalism requires **causal dynamics**, not just **state descriptions**. A brain causes its own next state. A book waits for an external agent to turn the page. If you want to prove substrate independence, build a machine where the physics turns the pages, not a reader. Until then, you haven't proven books think; you've proven that **records of thoughts** can be stored on paper."
