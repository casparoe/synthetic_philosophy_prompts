      *   Conclusion survival? Yes.
      *   Better analogy? Yes.

      *Key Philosophical References to weave in:* Ned Block (China Brain/Blockhead), John Searle (Chinese Room), Hilary Putnam (Twin Earth/Functionalism), David Chalmers (Fading Qualia - though maybe too much). Stick to Block and Searle for clarity on computation vs. simulation.

      *Wait, one nuance:* The friend says "make the book's physical structure mirror the brain's states closely enough." This implies an isomorphism. But isomorphism isn't implementation. A map of a city isn't a city. I need to emphasize *Causal Powers*.

