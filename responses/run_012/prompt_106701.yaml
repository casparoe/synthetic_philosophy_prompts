answer: |-
  **Address for the Annual Civic Service**

  Mr. Mayor, Councillors, friends from our sister faith communities, representatives of the Humanist Society, and members of this congregation.

  We are gathered here at the hinge of the year. The chains of office are polished, the robes are pressed, and the church is open. The request from the Mayor's office for this address was that it be "inclusive." I confess, that word has troubled me. In my trade, "inclusive" can sometimes be a polite code for "harmless." It suggests a speech sanded down until the grain is smooth and the wood has lost its strength. If I stand in this pulpit and pretend my faith is merely a private hobby, I lie to you and to God. But if I stand here and demand you accept my doctrines as the price of my advice, I treat you not as citizens, but as converts.

  So, I want to speak honestly about that bind. How do we speak from within a deep conviction to a room that owes that conviction nothing?

  To help me find the words, I have been thinking about a philosopher named John Rawls. Many of you will know him as the dry architect of modern liberalism, the man who argued that religion should largely be kept out of political justification. But fewer know the young man he was. Before the Second World War, Rawls was a devout Episcopalian. He considered the priesthood. He wrote theological essays. He believed. Then, he served as an infantryman in the Pacific. He saw things that broke his certainty. He lost his faith, not through argument, but through horror. Yet, he spent the rest of his life building a philosophy that made room for people who still had it.

  There are two Rawlses here. The believer who understood the weight of glory, and the skeptic who understood the danger of dogma. He held them together in a idea he called "political liberalism." He argued that the state should not be based on a single view of the ultimate truth—whether religious or secular—because no such view is shared by everyone. Instead, we agree on a framework for living together that is "political, not metaphysical." It does not ask us to agree on why the universe exists, only on how we share this street.

  This is not a dismissal of faith. Rawls offered a "proviso." He suggested that we may bring our religious reasons into public debate, provided we are also willing to translate them into public reasons that our neighbours can access. I cannot ask the Humanist representative to vote for a policy because Scripture commands it. But I can argue that the policy protects the vulnerable, and offer reasons for that protection which we can all examine, test, and hold in common.

  This is the work of this Council for the coming year. You will face questions of housing, of care, of education. You will hear loud voices claiming God is on their side. I urge you to listen to them, but to look for the "overlapping consensus." This is Rawls's hope: that people from different comprehensive doctrines—Christian, Muslim, Jewish, Sikh, Humanist—can arrive at the same just conclusions for different reasons. I may feed the poor because I see Christ in the hungry. You may feed the poor because you believe in human dignity. We do not need to settle the theological dispute to agree on the meal.

  For my part, standing in this pulpit, I accept the risk of this arrangement. I will not hide my faith. I will pray for this town as a Christian. But I offer those prayers as a contribution to a common good, not as a claim to power. I am not here to represent a constituency, but to argue a case.

  There is a temptation, in a service like this, to pretend we are all more alike than we are. To blur the edges. But peace is not the absence of difference; it is the practice of justice amidst difference. Rawls's loss of faith in the war taught him that when we demand uniformity of belief, we invite violence. When we demand only a commitment to justice, we invite cooperation.

  So, to the Mayor and Councillors: Do not fear the religious voice. Hear it. But ask it to speak in a tongue the whole town can understand. And to my fellow believers: Do not fear the secular state. It is not your enemy; it is the table where we break bread with those who do not pray as we do.

  We are not asked to surrender our souls to the council chamber. We are asked to bring our best reasoning there. We are asked to recognize that the person sitting opposite us, who disagrees with us, is not an obstacle to be removed, but a citizen to be respected.

  In the end, this is a theological hope as much as a philosophical one. It is the hope that truth is strong enough to survive without coercion. That love does not need to legislate to be real. That we can seek the peace of this city, not because we all worship the same way, but because we all live here.

  Let us go forward into this year holding that tension. Not resolved, but held. With the courage to speak our truth, and the humility to listen for the common good.

  Amen.

  ***

  **Note on Liberties and Contested Readings**

  You asked me to flag where this address takes liberties with Rawls or leans on contested interpretations. There are three specific areas where I have smoothed the philosophy for the sake of the pulpit.

  **1. The Scope of Public Reason:** Rawls was quite specific that the duty of "public reason" applies primarily to public officials (like your Mayor and Councillors) and judges when debating "constitutional essentials" and matters of basic justice. He was less strict about citizens in the "background culture," which includes churches. By applying the strictures of public reason to *your* address in a church, I am arguably tightening Rawls's rules. A civic service is a hybrid space, but strictly speaking, Rawls might classify a sermon as part of the background culture where you are free to use exclusively religious language. However, because you are addressing the Council *in* their official capacity, I have treated the occasion as falling under the stricter requirement to model public reason.

  **2. The "Proviso" and Translation:** I paraphrased the proviso as a requirement to "translate" religious reasons into public reasons. Rawls's later formulation is slightly more nuanced: he allows religious reasons to be introduced *provided* that in due course public reasons are presented. He does not strictly demand a simultaneous translation for every point, but rather that the political justification ultimately rests on public grounds. I tightened this to make it actionable for the Council's daily work.

  **3. The Biographical Causality:** The link between Rawls's loss of faith in the Pacific and his development of *Political Liberalism* is widely drawn by biographers (such as Freeman) and is supported by his unpublished notes on his theological thesis. However, it is an interpretation of his intellectual history, not a fact he explicitly codified in his published work. Some scholars argue his move away from comprehensive liberalism was driven more by the critique of communitarians than by his wartime trauma. I have presented the biographical narrative as fact to serve the rhetorical need for a "two Rawlses" motif, as you requested.

  The address assumes that a Civic Service is the correct venue to test these ideas. I believe it is. It is one of the few remaining spaces where the "background culture" of religion and the "public forum" of the state overlap physically. It is the perfect place to model the tension rather than resolve it.
