          *   *Tangled Variables (Mass/Charge):* If you can't change one without the other, is it causal? *Reply:* Yes, if you can find a context where they decouple or if the intervention is on the *system* not just the property. Or admit causal claims are relative to a variable set.
      *   **The "Mildly Awkward" Objections (Technical Nuances):**
          *   *Quantum Mechanics:* Measurement disturbance. *Reply:* Interventionism is mostly classical/macrosocial. QM might require a different ontology, or we treat the measurement apparatus as the intervention.
