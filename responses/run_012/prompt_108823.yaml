answer: |-
  The tragedy of Thomas Hobbes's late years is not merely that he was wrong about the quadrature of the circle, but that he was wrong in a way that his own philosophy should have made impossible. For Hobbes, geometry was the gold standard of rationality, the "only science that it hath pleased God hitherto to bestow on mankind." It was the model for his civil philosophy. Yet, from the 1650s until his death in 1679, Hobbes poured his energy into a mathematical impossibility, engaging in a vitriolic, decades-long feud with John Wallis and the Royal Society that painted him as a deluded crank.

  To understand this not as mere senility but as a philosophical stress test, we must view the feud through Hobbes's constructivist epistemology. On this view, the failure of the "Geometer of Malmesbury" is not just a biographical footnote; it is a crisis point for the maker's-knowledge program that underwrites *Leviathan*.

  ### I. The Mapping: Construction as Causation

  To understand why Hobbes refused to concede, we must understand what he thought he was doing. For Hobbes, scientific knowledge (*scientia*) is knowledge of consequences from causes. In natural philosophy, we observe effects and guess at causes, yielding only probability. In geometry, we *stipulate* the causes. We define a line as the trace of a moving point; a circle as the trace of a line rotating around a fixed point. Because we generate the figures, we know their properties with absolute certainty. This is the *verum factum* principle: truth is made.

  When Hobbes presented his quadratures, he was not offering empirical measurements. He was offering a **narrative of generation**. He believed he had described a motion that produced a square equal in area to a circle. On his account, a demonstration is valid if the reader can follow the causal generation of the figure in their own imagination. If the construction is clear, the truth is compelled.

  This explains why Wallis's objections did not register as decisive. Wallis, representing the vanguard of early modern analysis, used algebraic symbolism and infinitesimal methods. To Hobbes, this was not geometry; it was "reckoning without sense." Algebra, for Hobbes, was a system of signs detached from the spatial motions that gave terms meaning. When Wallis proved Hobbes wrong algebraically, Hobbes saw it as a category error. He was building a house of bricks (spatial construction); Wallis was critiquing it with a blueprint written in a language Hobbes deemed nonsensical (symbolic algebra).

  Therefore, Hobbes's refusal to concede was not simply stubbornness; it was **epistemologically principled**. He believed Wallis was playing a different game—one of linguistic convention rather than causal demonstration. If Hobbes could visualize the construction, and if the steps followed from definitions of motion, he possessed certainty. Wallis's counter-proofs relied on a mathematical ontology (actual infinitesimals, symbolic abstraction) that Hobbes rejected as metaphysically incoherent. To accept Wallis's refutation would require Hobbes to abandon his core definition of what geometry *is*.

  ### II. The Testing: The Divergence of Constructors

  This brings us to the stress test of the theory. Hobbes's epistemology claims that because geometric objects are artifacts of the mind, agreement should be automatic. If I make a chair and show it to you, we both see the chair. If geometry is "maker's knowledge," why did two competent reasoners fail to converge?

  The episode reveals a critical limit in Hobbes's constructivism: **the gap between private generation and public validity.** Hobbes assumes that the mental act of construction is self-validating. If I can conceive the motion, the truth is secured. But the Wallis feud demonstrates that a construction can be subjectively coherent yet objectively invalid within a shared normative system. Hobbes's "constructions" relied on intuitive leaps regarding the summation of lines and areas that hid logical errors. He *thought* he was generating the figure, but he was smuggling in unproven assumptions about limits and proportions.

  This failure undermines the strong version of the maker's-knowledge program. It suggests that "making" is not sufficient for "knowing." Construction guarantees certainty only if the rules of construction are themselves validated by a community of practice. Hobbes treated geometry as a solitary exercise of reason (akin to Descartes's *cogito*), but the feud showed it is a **normative practice**. You cannot just make a move; you must make a move that counts as valid within the institution of mathematics.

  However, this does not totally destroy the program; it refines it. It shows that "maker's knowledge" requires a shared language of construction. Hobbes's error was believing his language (classical Euclidean synthesis) was the only possible language of construction. When the mathematical community shifted to algebra, Hobbes's "constructions" became unintelligible. The theory holds that we know what we make, but it fails to account for what happens when we disagree on *how* to make things. The certainty flows from the construction, but the validity of the construction flows from social agreement on methods.

  ### III. The Payoff: The Political Analogy

  This is where the stakes rise. The analogy between geometry and politics is load-bearing for *Leviathan*. Hobbes argues that civil philosophy can be demonstrated with geometric certainty because the Commonwealth is an artifact. "For the causes of the commonwealth... are known to us by experience, and by the constitution of the commonwealth itself, which we make." Just as we know the circle because we draw it, we know the state because we constitute it through the social contract.

  Does Hobbes's mathematical failure weaken this political claim?

  **Structurally, the analogy survives; practically, it is scarred.**
  The structural claim remains: artifacts are knowable in a way natural objects are not. The fact that Hobbes was a bad geometer does not prove that geometry is unknowable, nor does it prove that politics is unknowable. One can be wrong about a specific construction without invalidating the method of construction.

  However, the *political* implication of the feud is damaging. The feud demonstrates that **authority is required to settle disputes over construction.** In mathematics, Wallis and the Royal Society eventually acted as the "sovereign," declaring Hobbes's proofs invalid. In politics, Hobbes argues the Sovereign must define justice and property. But the math feud shows that if the "subjects" (other mathematicians) do not accept the "Sovereign's" (Hobbes's) construction, the science collapses into conflict.

  Hobbes wanted political certainty to flow from the rational acceptance of the contract. But in his own life, he could not secure rational acceptance of his geometric "contract." This suggests that the "certainty" of civil philosophy depends less on the logical perfection of the construction and more on the **power to enforce the interpretation.** If the geometric model holds, it implies that political stability requires not just a correct social contract, but a mechanism to silence the "Wallises"—the dissenters who claim the Sovereign's construction is flawed. The mathematical failure inadvertently argues for a more authoritarian enforcement of doctrine than Hobbes might have liked to admit. It suggests that "demonstration" in human affairs is not self-evident, even when the object is man-made.

  ### IV. The Verdict: Alternative Lenses

  If Hobbes's constructivist lens struggles to explain the divergence with Wallis, do other lenses perform better?

  **1. Proof as Social Practice**
  This lens (championed later by philosophers like MacIntyre or sociologists of science) views mathematics as a consensus-driven activity. A proof is valid because the community accepts it, not because it mirrors a Platonic reality or a mental construction.
  *   **Success:** This explains the historical outcome perfectly. Wallis won because he represented the emerging institutional consensus of the Royal Society. Hobbes lost because he refused to play by the evolving rules of the guild. It explains why two constructors diverged: they belonged to different communities of practice.
  *   **Blind Spot:** It risks relativism. If proof is just consensus, was Hobbes *actually* wrong, or just outvoted? This lens struggles to account for the objective impossibility of squaring the circle. It explains the *sociology* of the error but not the *logic* of it.

  **2. Epistemology of Epistemic Dependence**
  This lens focuses on expertise. In complex fields, laypersons (or outsiders) must defer to recognized experts.
  *   **Success:** This diagnoses Hobbes's hubris. He was a philosopher trespassing in a specialized field. The failure was a failure of deference. It highlights that "maker's knowledge" has limits when the "making" requires specialized technical training (like the new algebra) that the maker lacks.
  *   **Blind Spot:** This undermines Hobbes's democratic rationalism. Hobbes believed geometry and politics were accessible to any rational man, not just a priestly caste of experts. Accepting this lens validates the exclusion of the public from political reasoning, which contradicts the universalist aspirations of *Leviathan*. It solves the math problem by sacrificing the political philosophy.

  **Conclusion**
  Hobbes's constructivist lens is the most philosophically honest regarding his intentions. It captures *why* he felt certain and *why* he thought politics could be a science. It treats knowledge as an active power, which fits his materialist metaphysics. However, the Wallis feud exposes its naivety regarding the **intersubjective validation** of that knowledge. Hobbes assumed that because truth is made, it would be transparent to all rational eyes. The feud proved that what counts as a valid "making" is contested.

  The honest verdict is that Hobbes's epistemology is necessary but insufficient. It explains the *source* of certainty (construction) but fails to explain the *conditions of agreement* (social validation). For the political analogy to hold, Hobbes needed not just a social contract, but a "mathematical contract"—an agreement on the rules of reasoning themselves. His failure to secure that in geometry foreshadowed the difficulty of securing it in politics. He was right that we know what we make, but he was wrong to assume we would agree on what we had made. In the end, the Sovereign is needed not just to enforce the law, but to arbitrate the demonstration.
