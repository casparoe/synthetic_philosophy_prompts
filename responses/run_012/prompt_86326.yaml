  Then give me the residue report, which is the part I actually care about. Organize it in three parts.

  First, the parts that translate cleanly: for each, state the counterpart claim in my vocabulary and say honestly what kind of relation you are asserting — a paraphrase that preserves the content, an identification of the two claims, or a replacement that does some of the same work without being the same claim.

  Second, the parts that translate only under distortion: where you had to change what the original asserts in order to make it expressible at all, what exactly was altered, and which of the original's commitments the altered version drops or adds. Flag any point where the translation would mislead a reader of the translation into accepting a premise the original does not grant.

