answer: |-
  **Exam Question (45 minutes, no notes)**

  Consider a universal human joint quirk. Mechanically, it functions exactly as designed by evolution. In ancestral environments, it caused no issues. In modern environments (hard floors, chairs, commutes), it causes constant pain and disability by age 45. Nearly everyone has it. A cheap, safe pill taken from childhood prevents this, producing joints superior to any ancestral human ever had.

  **Is this quirk a disease?**

  Do not simply summarize Naturalist and Normativist views. Use this case to argue which definition of health succeeds. Must the baseline be statistical, functional, or based on harm in the actual environment? Commit to a verdict and justify why the opposing view fails here.

  ***

  **Model Answer**

  This quirk is a disease. This verdict demonstrates that strict Biological Naturalism fails because it ignores environmental context, while Normativism succeeds but requires objective harm to avoid pure subjectivity.

  Naturalism typically defines disease as statistical abnormality or functional failure relative to species design. In this case, Naturalism collapses. The quirk is statistically universal (100% prevalence) and functionally intact relative to ancestral design (the mechanism works as built). A strict Naturalist must conclude this is not a disease, merely a mismatch. This is untenable. If a condition causes universal pain and disability in the environment we actually inhabit, calling it "healthy" renders the concept of health useless for guiding medical action. It privileges evolutionary history over actual suffering.

  Normativism defines disease by disvalue or harm. Here, it succeeds immediately. The quirk causes pain, limits work, and requires wheelchairs. These are clear harms. Critics argue Normativism makes disease subjective, but this case strengthens Normativism because the harm is objective and universal in the modern context, not just a cultural preference. The value judgement ("pain is bad") is shared by all sufferers.

  The pill complicates the boundary between treatment and enhancement. If the quirk is not a disease, the pill is enhancement. If it is a disease, the pill is treatment. Since the pill restores function relative to the *actual* environment, not just the ancestral one, it counts as treatment. This shows that "normal function" must be indexed to the environment of action, not just the environment of evolution. Medicine aims to enable life in the world we live in, not the world we left.

  The proposed fix—a counterfactual ancestral baseline—is unstable. It tries to save Naturalism by shifting the baseline from "actual statistics" to "evolutionary intent." But selecting which environment counts as "natural" is itself a value judgement. Why privilege the savannah over the city? Choosing the savannah implies we *ought* to live there, or that suffering in the city is "our fault" rather than a medical issue. This smuggles normativity into Naturalism. It pretends to be scientific but relies on a moral claim about where humans belong.

  Therefore, the verdict stands: it is a disease. Health is not merely proper function relative to design, but proper function relative to the lived environment. Strict Naturalism fails here because it cannot account for environmental mismatch without covertly adopting normative values about where humans "should" live. Normativism captures the harm, provided we agree that universal disability constitutes objective harm. The pill is treatment, because restoring agency in the actual world is the goal of medicine, not restoring ancestral statistics. To deny this is to let theory override suffering.

  ***

  **Marking Scheme (20 Marks Total)**

  1.  **Identifies the Naturalist Obstacle (4 marks):** Correctly notes that Naturalism (statistics/design) implies this is *not* a disease because the trait is universal and functionally intact ancestrally.
      *   *Common miss:* Students claim Naturalism automatically calls it a disease because it causes pain.
  2.  **Identifies the Normativist Strength (4 marks):** Correctly notes that Normativism classifies it as a disease based on the objective harm/disvalue in the current environment.
      *   *Common miss:* Treating Normativism as merely "personal opinion" rather than shared harm.
  3.  **Analyses the Pill (4 marks):** Explicitly argues whether the pill is "treatment" or "enhancement" based on their verdict, linking it to the definition of disease.
      *   *Common miss:* Ignoring the pill or saying the distinction doesn't matter for the argument.
  4.  **Evaluates the Ancestral Baseline (4 marks):** Recognizes that choosing an ancestral environment as the baseline is itself a normative/value choice, not a neutral scientific fact.
      *   *Common miss:* Accepting the ancestral baseline as a valid scientific rescue without questioning the value judgement.
  5.  **Commits to a Verdict (4 marks):** Clearly states "Yes" or "No" and justifies it using the tension above, rather than concluding that "both sides have points."
      *   *Common miss:* Hedging with a conclusion that refuses to decide the case.
