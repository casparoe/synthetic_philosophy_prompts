  ### Tiered Ranking

  **Case 1: Tier 1**
  This is the paradigmatic duty of rescue where direct intervention prevents catastrophic harm at a negligible personal cost.

  **Case 2: Tier 2**
  You possess unique causal power to prevent severe harm to identifiable patients, creating a strong obligation despite the significant social sacrifice of missing the rehearsal.

  **Case 4: Tier 3**
  Preventing active financial harm to a known user base outweighs managerial instruction, though the diffuse nature of the victims lowers the urgency compared to physical safety.

  **Case 5: Tier 4**
  The identifiable human stakes create a residual moral pull to attempt contact, even though the uncertainty of the threat and your efficacy significantly weakens the duty.

  **Case 6: Tier 4**
  Professional integrity imposes a duty to avoid inflicting foreseeable friction on colleagues, but the low magnitude and future timing of the harm prevent higher urgency.

  **Case 3: Tier 5**
  Converting your labor into statistical aid for unidentifiable others is supererogatory rather than obligatory, as the demand to exhaust yourself violates common intuitions about personal prerogative.

  ***

  ### Feature Analysis

  The single feature doing the most work in this ranking is **whether the victims are identifiable**.

  This feature creates a gradient from the single child in the pond (Tier 1) to the hospital patients (Tier 2), the known user base (Tier 3), the future team (Tier 4), and finally the statistical beneficiaries of charity (Tier 5). While other factors like sacrifice or certainty matter, the drop in perceived duty correlates most strongly with the shift from specific, present individuals to abstract groups.

  The pair of cases that would come apart if I forced a choice between this feature and its closest rival, **the certainty of the harm**, is **Case 3 and Case 5**.

  In Case 3, the harm prevention is statistically certain (the money *will* help someone) but the victims are unidentifiable; in Case 5, the victim is identifiable but the harm and your ability to prevent it are highly uncertain. Ranking Case 5 (Tier 4) above Case 3 (Tier 5) prioritizes identifiability over certainty, whereas prioritizing certainty would demand placing the effective charity work above the uncertain forum intervention.
