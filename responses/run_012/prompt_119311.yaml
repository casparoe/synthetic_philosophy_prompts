answer: |-
  The Oak Creek Aquifer Authority (OCAA), a statutory regulatory body with power to levy fines and enforce compliance rules upon all property owners within its designated district, votes to increase extraction rates to sell water to a distant metropolitan area. Inside the district, property owners are subject to OCAA's coercive enforcement, including mandatory reporting and penalties for non-compliance, but their water livelihood and property values are protected by a Senior Entitlement Decree issued by the State Supreme Court, which guarantees them fixed volumetric allotments and full compensation for any pressure-related costs—a guarantee the OCAA cannot revoke or alter. Outside the district, neighboring farmers draw from the same aquifer but lie beyond OCAA's jurisdictional boundary; the increased extraction lowers the water table, significantly reducing their well yields and threatening their livelihoods, yet OCAA holds no coercive authority over them, cannot enforce rules against them, and they possess no vote or channel to influence the decision.

  (1) For the inside property owners, the all-subjected principle returns a verdict of inclusion because the OCAA claims and exercises the right to enforce rules against them via fines and mandates, satisfying the condition of subjection to coercive authority. The all-affected principle returns a verdict of exclusion because the State Supreme Court Decree prevents the decision from significantly setting back their health, livelihood, property, or physical security; the guarantee ensures no net material loss, and the principle stipulates that subjection itself does not count as a welfare setback. For the outside farmers, the all-subjected principle returns a verdict of exclusion because the OCAA holds no right to enforce rules against them across the jurisdictional boundary. The all-affected principle returns a verdict of inclusion because the lowered water table significantly sets back their livelihood and property interests. These verdicts follow from the terms of the principles: ASP tracks enforcement claims, while AAP tracks material welfare outcomes, and the case constructs a scenario where these tracks diverge.

  (2) The single feature that makes the two principles come apart is the external guarantee (the State Decree) that decouples subjection from welfare setback for the inside group. If this feature is removed—meaning the inside owners are subject to OCAA authority but lack guaranteed compensation for water loss—their welfare interests would be significantly set back by the extraction decision. Consequently, the all-affected principle would then include them, rendering the demoi nested on that axis (AAP would include everyone ASP includes, plus the outside farmers). The non-nested structure collapses, and the case fails to show ASP including someone AAP excludes.

  (3) The strongest objection a defender of the all-affected principle would raise is that subjection to coercion is itself a setback to welfare interests, specifically regarding security and autonomy, and that the narrow stipulation excluding this is arbitrary. If counting subjection to coercion as itself an effect on a person's interests is permitted, the inside owners become "affected" simply by virtue of being subject to OCAA enforcement. This collapses the gap: the all-affected principle would then include the inside owners, eliminating the unique contribution of the all-subjected principle in this instance. The case does not survive that move regarding the specific pedagogical goal of showing ASP including someone AAP excludes, because the distinction relies entirely on the narrow reading of affectedness that isolates material welfare from political status.

  (4) Subjection, being a standing relation to an authority, and affectedness, being a relation to a particular decision, cannot be made commensurable here without altering the principles' definitions. The case depends on their not being commensurable: if subjection is treated as a continuous series of decisions or if affectedness is treated as a standing condition, the distinction dissolves. The all-subjected principle identifies a class based on a persistent status (enforceability), while the all-affected principle identifies a class based on a contingent outcome (material loss). The case works only because a person can hold the status without suffering the outcome, due to the external guarantee.

  (5) The specification is jointly satisfiable, provided "welfare interests" are interpreted materially as listed in the principle (health, livelihood, property, security) rather than psychologically or politically. It does not smuggle in a premise a critic must reject, provided Constraint (ii) is accepted as legally plausible within a mundane regulatory state; higher-court decrees protecting property rights against lower regulators are common. However, the case relies on the guarantee being perfect in material terms. If a critic argues that uncertainty or loss of control constitutes a welfare setback regardless of compensation, Constraint (ii) must be relaxed to allow for a less-than-perfect guarantee, which would weaken the exclusion of the inside group under the all-affected principle.
