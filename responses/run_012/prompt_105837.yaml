      *   *Jonah's Claim 3:* Moral quality matters (Cruelty = Not True Art).
          *   *Analysis:* Radical Moralism (Tolstoy again). Most contemporary aestheticians reject this as a *definition* condition, though accept it as an *evaluation* condition.
      *   *Mira's Claim 3:* Moral evaluation separate from definition (Autonomism).
