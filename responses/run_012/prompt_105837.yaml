  4.  **Identifying Question-Shifting:**
      *   Jonah shifts from "Communication" (phenomenological success) to "Accessibility to Ordinary People" (sociological reach). These are different. A difficult poem might communicate deeply to a trained reader but not to an "ordinary" one.
