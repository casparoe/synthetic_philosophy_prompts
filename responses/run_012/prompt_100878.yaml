prompt: |-
  Ok so my friends and I do this thing every week -- we each write down a yes/no guess about whether our local team wins on the weekend, then whoever's in the majority "takes" the round and the rest of us buy them coffee. Eleven of us play. My buddy Dev is convinced we basically cant be wrong: with that many people, he says, the majority has to land on the truth way more often than any one of us alone could, and the more of us who play the safer it gets. I kinda want to beleive him but something about it itches.

  Couple things that maybe matter and I can't tell if they do. One, almost all of us get our info from the same two group chats and the same guy's podcast, so our guesses tend to move together -- when that podcaster is high on the team, like eight of us write "yes". Two, we've got Marcus, who I'm pretty sure has been worse than a coin flip for two straight years (he picks whoever's got the cooler uniforms). Dev says none of that touches his point, more people is still more reliable. Is he right? Can you help me see when a majority of people guessing is actually good evidence they've got it right, and when it's basically worthless -- i.e. what has to be true for the whole "the majority is smarter than any one of us" thing to hold at all, and how badly it falls apart when those things aren't true? Not after a formal proof, just enough to actually settle this with him.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** A group of 11 friends bet on coffee based on a majority vote of Yes/No predictions about a local sports team winning.
      *   **Dev's Claim:** The majority vote is more reliable than individual guesses. More people = safer/more accurate (Condorcet's Jury Theorem intuition).
      *   **User's Skepticism:** Something feels off ("itches").
      *   **Key Complicating Factors:**
          1.  *Correlated Information:* Everyone gets info from the same two chats and one podcast. Guesses move together (herding).
          2.  *Incompetent Voter:* Marcus picks based on uniforms (worse than coin flip).
      *   **Goal:** Explain *when* the majority is smart and *when* it's worthless, specifically addressing Dev's claim vs. the user's specific situation, without getting bogged down in formal math proofs.

  2.  **Identify the Core Concept:**
      *   The underlying mathematical principle is **Condorcet's Jury Theorem**.
      *   The core conditions for this theorem to work are:
          1.  **Independence:** Voters decide independently (no copying each other).
          2.  **Competence:** Each voter is more likely to be right than wrong (>50% accuracy).
      *   The user's situation violates *both* of these.

  3.  **Deconstruct Dev's Argument (The "Wisdom of Crowds"):**
      *   Dev is relying on the idea that errors cancel out. If I'm wrong randomly, and you're wrong randomly, we likely won't be wrong in the *same* way at the *same* time.
      *   *Why he's partially right:* If everyone was independent and slightly better than random, 11 people would indeed be much better than 1.
      *   *Why he's wrong here:* The errors aren't random; they are systemic.

  4.  **Address Factor 1: Correlated Information (The Podcast/Group Chat):**
      *   *The Problem:* If everyone listens to the same podcaster, they aren't 11 independent data points. They are essentially 1 data point (the podcaster) repeated 11 times.
      *   *Analogy:* Asking the same person 11 times doesn't make them smarter.
      *   *Impact:* If the podcaster is wrong, the majority is wrong. The "safety in numbers" vanishes because the errors don't cancel out; they compound.

  5.  **Address Factor 2: Marcus (The Anti-Expert):**
      *   *The Problem:* Marcus is <50% accurate.
      *   *Condorcet Condition:* The theorem requires $p > 0.5$. If $p < 0.5$, adding more voters like Marcus makes the group *less* accurate.
      *   *Nuance:* In a group of 11, one bad voter might not sink the ship *if* everyone else is independent and good. But if the group is already correlated (see Factor 1), Marcus adds noise without signal.
      *   *Counter-intuitive point:* If Marcus is consistently wrong (e.g., 30% accuracy), he's actually a *great* predictor if you just invert his choice. But if he's random (50%) or slightly worse, he dilutes the smart votes.

  6.  **Synthesize the Explanation for the User:**
      *   *Tone:* Casual, conversational, persuasive (help them settle the bet with Dev).
      *   *Structure:*
          1.  Validate the user's itch (it's justified).
          2.  Explain the "Magic Formula" for crowd wisdom (Independence + Competence).
          3.  Apply it to the Podcast Problem (Correlation).
          4.  Apply it to the Marcus Problem (Competence).
          5.  Give a verdict on Dev's claim.
          6.  Offer a practical solution (how to actually win coffee).

  7.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* You're right to be skeptical. Dev is quoting "Wisdom of Crowds" but missing the fine print.
      *   *The Theory:* Condorcet's Jury Theorem. Keep it simple. It needs two things: 1. You have to be better than a coin flip. 2. You have to guess without copying others.
      *   *The Podcast Issue:* This is the big killer. If 8 people hear the same tip, that's not 8 votes. That's 1 vote with 8 echoes. If the podcaster is wrong, 8/11 are wrong instantly. That's not "averaging out errors," that's "amplifying errors."
      *   *The Marcus Issue:* If he's worse than a coin flip, he actively hurts the score. But honestly, compared to the podcast issue, Marcus is a minor bug. The podcast is a system crash.
      *   *The Verdict:* Dev is wrong about *this* group. He's right about the math in a vacuum, but wrong about the application.
      *   *Actionable Advice:* Stop listening to the same guy. Or, if Marcus is truly terrible, bet against him.

  8.  **Refining the Analogies:**
      *   *Independence:* Like rolling dice. If dice are magnetized to show the same number, rolling 11 doesn't help.
      *   *Competence:* If you ask a room of people "What is 2+2?" vs "What will the stock market do?"
      *   *The "Echo Chamber":* The podcast creates an echo chamber.

  9.  **Final Polish:**
      *   Make sure to explicitly answer "What has to be true?" and "How badly does it fall apart?"
      *   Ensure the tone is friendly (it's a coffee bet among friends).
      *   Check the math intuition: 11 people, majority is 6. If 8 follow the podcaster, the podcaster dictates the outcome.

  10. **Self-Correction/Edge Case:**
      *   *Wait, does Marcus matter if he's only 1 out of 11?* Technically, if the other 10 are independent and >50%, Marcus barely matters. But the prompt says "almost all of us get info from the same... podcast." So the independence violation is the heavy hitter. I should emphasize the correlation over Marcus, but mention Marcus as a secondary failure of the "competence" rule.
