      *   *Let's stick to the prompt's constraint:* "The single example that should carry the whole piece."
      *   *Idea:* **The Infinite Audit.** An auditor checking a firm. The firm hires a new auditor. The first auditor must trust the second auditor's seal of approval.
      *   *Why:* It captures "Trust" perfectly.
      *   *Why others fail:* Liar Paradox is semantic nonsense. Code rewriting implies empirical bugs. Self-driving car is about physical safety, not logical consistency.
      *   *Misconception Timing:*
