          *   Derivability Conditions (too technical).
          *   Specific technical fixes (tiling agents, probabilistic logic) -> Mention only that solutions exist, don't detail them.
          *   Real-world applicability debate -> Acknowledge it's a theoretical bound.

  4.  **Refining the Plan (Self-Correction/Polishing):**
      *   *Order:* Make sure Gödel 2nd is framed as the "Wall" and Löb is the "Ladder that hits the Wall."
      *   *Example:* The "Surveyor" is good, but maybe "The Guardian of the Vault" is more stakes-driven for AI safety. Let's go with **The Guardian of the Goal**. The agent has a goal. It builds a successor. It needs to know the successor keeps the goal. To do that, it reasons about the successor's reasoning.
