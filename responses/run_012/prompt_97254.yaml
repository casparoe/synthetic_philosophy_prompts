  ### SCORING KEY

  **How to Tally:**
  For each question, mark whether you chose option **A**, **B**, or **C**.
  *   **Questions 1–5 (Value/Attitude Cases):** Track these separately from Questions 6–7 (Belief Cases).
  *   **Questions 8–9 (Meta/Phenomenology):** Track these individually.

  **Position Profiles:**

  1.  **The Object-Giver (Reasons must be about the object):**
      *   **Pattern:** Mostly **A** on Questions 1–5. Mostly **A** on Questions 6–7.
      *   **View:** Threats and payments are not reasons for the attitude itself, only reasons to want to have the attitude.

  2.  **The Question-Bearer (Reasons must answer the attitude's question):**
      *   **Pattern:** Mostly **A** on Questions 1–5.
      *   **Note:** This profile looks identical to The Object-Giver in this quiz. See "Position Overlaps" below.

  3.  **The Deflationist (Threats are real reasons, just weak):**
      *   **Pattern:** Mostly **B** on Questions 1–5. Mostly **B** on Questions 6–7.
      *   **View:** The threat is a genuine reason to admire, it just loses to the reasons not to.

  4.  **The Pragmatist (Practical reasons count for belief):**
      *   **Pattern:** Mostly **A** on Questions 1–5 (Value). Mostly **B** on Questions 6–7 (Belief).
      *   **View:** Practical benefits aren't reasons to admire, but they *are* reasons to believe.

  5.  **The Anti-Fittingness (Rejects the framework):**
      *   **Pattern:** Option **B** or **C** on Question 8.
      *   **View:** The problem arises only because we wrongly define goodness as "fittingness."

  6.  **The Pluralist (Two kinds of reasons, both real):**
      *   **Pattern:** Option **A** on Question 1 (Verdict), but Option **C** on Question 2 (Reason Status).
      *   **View:** The threat is a real reason of a *different kind*, which is why it doesn't make admiration fitting.

  7.  **The Attitude-Shift (It's not admiration anymore):**
      *   **Pattern:** Option **C** on Question 1 or Question 9.
      *   **View:** The threat changes the psychological state so it is no longer genuine admiration.

  **Position Overlaps & Impossible Combos:**
  *   **Object-Giver vs. Question-Bearer:** These two positions cannot be reliably distinguished by these cases. Both yield "A" answers because both deny that external threats count as reasons for the attitude. The difference is theoretical (properties of objects vs. structure of questions), not practical.
  *   **Impossible Combo:** If you choose **C** on Question 8 (Anti-Fittingness) but **A** on all case questions, your position is unstable. If goodness isn't fittingness, the case judgments should change. This combo suggests you haven't fully applied your meta-ethical view to the cases.

  ***

  ### THE QUIZ

  **1. The Demon's Threat**
  A demon threatens to torture you forever unless you admire him. He is not admirable.
  *   **A.** You should not admire him; the threat is not a reason for admiration.
  *   **B.** You should admire him; the threat is a reason, even if he's vile.
  *   **C.** You cannot admire him; the threat changes what you are feeling into something else.

  **2. The Nature of the Threat**
  In the demon case, is the threat of torture a reason to admire him?
  *   **A.** No, it is only a reason to want to admire him.
  *   **B.** Yes, it is a real reason, but it is outweighed by his vileness.
  *   **C.** Yes, it is a real reason, but it is a different *kind* of reason than admirability.

  **3. The Boss's Bonus**
  Your boss offers you a large bonus if you can genuinely like your job.
  *   **A.** The money isn't a reason to like the job; it's a reason to try to like it.
  *   **B.** The money is a reason to like the job; liking it gets you paid.
  *   **C.** If you do it for money, you don't "like" the job, you just act like it.

  **4. The Coach's Strategy**
  A coach tells you the team plays better if you are angry at the opponents.
  *   **A.** You shouldn't be angry unless they actually wronged you.
  *   **B.** You should be angry because winning is valuable.
  *   **C.** This isn't anger, it's simulated aggression for performance.

  **5. The Debt of Gratitude**
  Someone tells you that you owe gratitude to a stranger who did nothing for you.
  *   **A.** You don't owe gratitude; it must be fitting to their actions.
  *   **B.** You owe gratitude if being grateful produces good outcomes.
  *   **C.** Gratitude isn't about "owing," so the question is mistaken.

  **6. The Self-Fulfilling Exam**
  Believing you will pass makes you confident, which makes you pass. Evidence is 50/50.
  *   **A.** Believe only if the evidence supports passing.
  *   **B.** Believe because it helps you pass; that's a reason to believe.
  *   **C.** Don't believe; hope instead, since belief requires evidence.

  **7. The Placebo Trust**
  Trusting your doctor makes the medicine work better. She is competent.
  *   **A.** Trust her because she is competent, not because it helps.
  *   **B.** Trust her because trusting her helps you heal.
  *   **C.** Trusting changes the medicine, so it's not standard belief.

  **8. The Definition of Good**
  Philosophers say something is "good" if it is "fitting to value."
  *   **A.** Yes, goodness is defined by what attitudes fit the object.
  *   **B.** No, goodness is defined by what we have reasons to value.
  *   **C.** No, goodness is unrelated to reasons or fittingness.

  **9. The Feeling of Admiration**
  If you admire the demon only to stop torture, does it feel like normal admiration?
  *   **A.** Yes, the feeling is the same, the reason is just bad.
  *   **B.** Yes, the feeling is the same, and the reason is valid.
  *   **C.** No, it feels like fear or compliance, not admiration.

  ***

  ### CASE & POSITION FLAGS

  **Indistinguishable Positions:**
  *   **Object-Giver (1) vs. Question-Bearer (2):** As noted in the key, these positions are extensionally equivalent on these cases. Both deny that the demon's threat counts as a reason for admiration. Distinguishing them requires asking about the *structure* of reasoning rather than the verdict on cases.
  *   **Deflationist (3) vs. Pragmatist (4):** These overlap if the Pragmatist also accepts practical reasons for value attitudes. The quiz separates them by assuming Pragmatism is specific to *belief* (Questions 6–7) while Deflationism is general (Questions 1–5). If a user chooses "B" on all questions, they could be either.

  **Problematic Cases:**
  *   **The Coach's Strategy (Question 4):** Anger is a volatile emotion. Some theories treat emotions like beliefs (requiring object-focused reasons), others like actions (allowing practical reasons). This case may not cleanly separate Object-Givers from Deflationists because both might agree anger should be "real" but disagree on why.
  *   **The Debt of Gratitude (Question 5):** Gratitude involves deontic concepts ("owing") which complicates the "fittingness" framework. This case might confuse users who distinguish between moral obligations and fitting attitudes, potentially skewing the score toward Anti-Fittingness or Pluralism unintentionally.
  *   **The Definition of Good (Question 8):** This is the only question that directly accesses Position 5 (Anti-Fittingness). If a user holds this view but answers the case questions based on intuition rather than theory, they will not score as Position 5. This is a limitation of case-based quizzes for meta-ethical views.
