      *   *Check:* Did I rank them? *Adjustment:* Use clear headings indicating severity.
      *   *Check:* Did I address the "parasitic" point? *Adjustment:* Make sure to highlight how professional error correction often relies on working-class stability.
      *   *Tone:* Intellectual, rigorous, empathetic to both sides, avoiding condescension (since the user is explicitly trying to avoid that).

  8.  **Final Polish:** Ensure the distinction between "institutionalized criticism" (peer review, HR complaints, performance reviews) and "genuine truth-seeking" is sharp. Ensure the "identity from beliefs" point is nuanced (it's not just about feelings, it's about social embeddedness).

      *(Self-Correction on "Identity from Beliefs"):* In working-class communities, beliefs are often constitutive of relationships. To challenge a belief is to challenge the bond. In professional classes, beliefs are currency. To challenge a belief is to trade. The user claims the latter is better for *error correction*. The counter is: the latter is better for *career advancement*, which isn't the same thing.

  9.  **Final Review against constraints:** Rank defeaters? Yes. Address insulation? Yes. Address heterogeneity? Yes. Address achievement vs. presentation? Yes.

