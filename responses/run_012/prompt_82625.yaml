answer: |-
  # Handout: Desiderata for Transworld Individuation
  **Topic:** The Metaphysics of *De Re* Modality
  **Goal:** Specify the constraints any account of how individuals figure in modal claims must satisfy.

  ## I. The Specification (Desiderata & Motivating Cases)

  1.  **The De Re / De Dicto Distinction**
      *   *Requirement:* The account must distinguish claims about an object's modal properties from claims about the satisfaction of a description.
      *   *Case:* "The number of planets could have been 9" (De Dicto: false, necessarily 8) vs. "8 could have been the number of planets" (De Re: true).
  2.  **The Necessity of Identity**
      *   *Requirement:* If $a = b$, then $\Box(a = b)$. The account cannot allow identity to be contingent.
      *   *Case:* Hesperus is Phosphorus. It is not possible that Hesperus exists, Phosphorus exists, and they are distinct.
  3.  **The Contingency of Ordinary Properties**
      *   *Requirement:* Most non-essential properties (job, location, height) must be capable of varying across worlds for the same individual.
      *   *Case:* Humphrey could have won the election; this table could have been made of ice.
  4.  **The Non-Existence Constraint**
      *   *Requirement:* The account must handle worlds where the individual does not exist without rendering claims about those worlds false or meaningless.
      *   *Case:* "I might never have been born." (True, even though in that world, I do not exist to have properties).
  5.  **The Limits of Variation (Essence)**
      *   *Requirement:* The account must allow for *some* limits on variation without collapsing into "everything is essential."
      *   *Case:* I could have been slightly taller, but I could not have been a prime number. (Must distinguish accidental from essential).
  6.  **First-Person Authority (The Humphrey Constraint)**
      *   *Requirement:* The truth conditions for "I could have been F" must ground *my* concern/pride/regret, not just a third-party classification.
      *   *Case:* It matters to Humphrey that *he* could have won, not that someone similar to him won.
  7.  **Cross-World Identification**
      *   *Requirement:* There must be a principled basis for asserting that individual $x$ in $W_1$ is the subject of the claim in $W_2$.
      *   *Case:* How do we know the winner in $W_2$ is Humphrey and not his twin?

  ---

  ## II. Genuine Requirements vs. House Rules

  *   **Genuine Requirements:** (1) De Re/De Dicto, (2) Necessity of Identity, (4) Non-Existence. These are dictated by logic or deep semantic intuitions shared across camps.
  *   **House Rules (Camp Prejudices):**
      *   *"There must be a fact of the matter about **which** qualitative individual I am in another world."* (Haecceitists deny this; Qualitative Supervenience advocates demand it).
      *   *"I could have been **completely** different in every respect."* (Most agree this is false; Origin Essentialism suggests some properties are fixed. Demanding a theory validate total replacement is a prejudice).
      *   *"There is a unique counterpart in every accessible world."* (Contingentists or Vagueness advocates deny uniqueness or existence in all worlds).

  ---

  ## III. Incompatibilities & Tensions

  **The Epistemic/Metaphysical Tension**
  You are correct: The demand for a **Fixed Referent** (Rigid Designation) and the demand for **Property-Independent Identification** pull against each other.
  *   **The Conflict:** To secure the Necessity of Identity, we must treat the individual as fixed prior to qualitative assessment (Kripke: we stipulate *this* object). But to satisfy Cross-World Identification, we usually need qualitative criteria to *find* the object in another world. If we identify via properties, we risk Descriptivism (violating Rigid Designation). If we identify via stipulation, we lack epistemic access (violating Identification).
  *   **Who Gives Up What:**
      *   **Kripkeans:** Give up Epistemic Identification. We don't "find" the individual in other worlds via properties; we stipulate the referent actually and ask what is true of *it* there.
      *   **Counterpart Theorists:** Give up Fixed Referent (Identity). There is no "same individual," only similarity relations, dissolving the tension but costing First-Person Authority.

  ---

  ## IV. Neglected Obligations (The "Fine Print")

  1.  **Counting:** Is "How many possible versions of me exist?" well-formed?
      *   *Obligation:* The theory must specify if modal space is discrete or continuous. If I have two counterparts in $W$, is that one possibility or two?
  2.  **Non-Uniqueness (The Problem of the Many):**
      *   *Obligation:* What if two candidates in $W_2$ are equally good matches for me but differ on property $F$? Is it true that I could be $F$? (Truth-value gaps vs. supervaluation).
  3.  **Transitivity:**
      *   *Obligation:* If $x$ is a counterpart of $y$, and $y$ of $z$, is $x$ a counterpart of $z$? Counterpart relations are often non-transitive. The logic of 'could' must be adjusted (e.g., dropping S5) or the relation constrained.
  4.  **First-Person Load-Bearing:**
      *   *Obligation:* The theory cannot treat "I could have been F" as a special case of "Humphrey could have been F." If the account makes Humphrey's modal properties irrelevant to him, it makes *my* modal properties irrelevant to me.

  ---

  ## V. Brief Evaluation of Popular Views

  **Counterpart Theory (Lewis)**
  *   *Pros:* Solves Accidental Intrinsics (I am 6ft here, 5ft there, no contradiction); handles Non-Uniqueness naturally.
  *   *Cons:* Fails First-Person Authority (it's not *me* in the other world); Necessity of Identity requires reformulation; Counterpart relation is vague/non-transitive.

  **Transworld Identity (Kripke/Plantinga)**
  *   *Pros:* Preserves First-Person Authority; validates Necessity of Identity directly; intuitive rigid designation.
  *   *Cons:* Accidental Intrinsics problem (how can one object have incompatible properties?); lacks clear criteria for Cross-World Identification (stipulation vs. discovery).

  **Haecceitism (Thisness)**
  *   *Pros:* Secures Cross-World Identity without qualitative similarity; allows distinct worlds with identical qualitative profiles.
  *   *Cons:* Epistemically opaque (we cannot grasp haecceities); violates Principle of Sufficient Reason (why is *this* haecceity attached to *those* properties?); ontologically extravagant.
