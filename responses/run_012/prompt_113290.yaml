  **Final Note on the "Clock/Spring" Distinction**

  I want to emphasize that I am not assuming this distinction is robust. The first part of my writing process will be an attempt to break it. I will look for counterexamples where a clock claim cannot be distinguished from a spring claim. If the distinction holds, it will be because I have successfully defined the "suppression factors" in a way that is independently observable. If it fails, the paper will document that failure. This candor is central to the proposal's integrity.

