answer: |-
  Here is a complete run-sheet for your 75-minute session. It is designed to be robust, self-explanatory, and to generate the specific philosophical "squeeze" you're looking for without requiring you to lecture.

  ### Session Overview
  *   **Topic:** The Paradox of Voting (Aggregation Incoherence + Instrumental Irrationality).
  *   **Time:** 75 Minutes.
  *   **Group Size:** 18 or 21 (Must be divisible by 3).
  *   **Your Role:** The Technician. You set the machine in motion, record the data, and only speak to clarify rules. You do not interpret the results until the debrief.

  ---

  ### 1. Materials Checklist
  *   **Preference Cards:** 3 different colours of card/paper (e.g., Pink, Blue, Yellow). Prepare enough for exactly 1/3 of the room each.
      *   *Pink:* Rank A > B > C
      *   *Blue:* Rank B > C > A
      *   *Yellow:* Rank C > A > B
  *   **Ballot Slips:** Small white slips of paper, plenty of spares.
  *   **Tokens:** 3 per person. Poker chips, chocolate coins, or distinct beads. (Total needed: 3 × headcount).
  *   **The Box:** An opaque box or bag for ballots.
  *   **The Pot:** A bowl for "winnings" (biscuits/chocolates).
  *   **Whiteboard/Flipchart:** To record vote counts.
  *   **Payoff Menu:** A printed sign showing what tokens redeem for (see below).

  ### 2. The Payoff Scheme
  To make the cost "hurt," the redemption must be tiered.
  *   **0 Tokens:** Nothing.
  *   **1 Token:** One standard biscuit.
  *   **2 Tokens:** Two biscuits.
  *   **3 Tokens:** One premium chocolate bar (or equivalent high-value treat).
  *   *Note:* This makes losing a token psychologically significant. If they vote twice, they cap out at 1 token (unless they abstain).

  ---

  ### 3. The Script & Timeline

  #### 0:00 – 0:10 | Introduction & Setup
  **You say:**
  "Welcome. Today we aren't talking about philosophy; we're going to run an experiment. We have three options for next month's meeting topic:
  *   **Option A:** [Insert Topic 1]
  *   **Option B:** [Insert Topic 2]
  *   **Option C:** [Insert Topic 3]

  "I am going to hand out coloured cards. Do not show them to anyone. The colour tells you how you *must* rank these options for the first part of the experiment. This is not about what you personally prefer; it is about assigning a position so we can test the system."

  *(Hand out the cards: 1/3 Pink, 1/3 Blue, 1/3 Yellow. Wait for everyone to have one.)*

  "Please look at your card. It lists your ranking. 1 is your favourite, 3 is your least favourite. Keep this secret."

  *(Hand out 3 Tokens to each person.)*

  "These are your assets. At the end, you redeem them for refreshments. Do not lose them."

  #### 0:10 – 0:30 | Part 1: The Aggregation Trap (Condorcet)
  **You say:**
  "We are going to find the group's preference. We will do this by pairwise majority votes. I will ask you to vote between two options. You vote according to the ranking on your coloured card. Raise your hand to vote. It costs nothing to vote."

  **Round 1: A vs B**
  "Who prefers A over B?" *(Count hands. Record on board.)*
  "Who prefers B over A?" *(Count hands. Record on board.)*
  *(Result: A should beat B, because Pink and Yellow prefer A>B. Only Blue prefers B>A. 2/3 vs 1/3.)*
  **Announce:** "A beats B."

  **Round 2: B vs C**
  "Who prefers B over C?" *(Count.)*
  "Who prefers C over B?" *(Count.)*
  *(Result: B should beat C. Pink and Blue prefer B>C. Only Yellow prefers C>B. 2/3 vs 1/3.)*
  **Announce:** "B beats C."

  **Round 3: C vs A**
  "Who prefers C over A?" *(Count.)*
  "Who prefers A over C?" *(Count.)*
  *(Result: C should beat A. Blue and Yellow prefer C>A. Only Pink prefers A>C. 2/3 vs 1/3.)*
  **Announce:** "C beats A."

  **You say:**
  "Look at the board. A beat B. B beat C. But C beat A. We have a cycle. There is no winner. The 'Will of the Group' does not exist. It depends entirely on the order in which I asked the questions."

  *(Pause for 30 seconds. Let them look at the board. Do not explain why yet.)*

  #### 0:30 – 0:40 | Transition & Part 2 Setup
  **You say:**
  "We will now try to make a final decision. We need to pick one option for next month. The rules have changed."

  1.  **Cost:** "To cast a vote, you must drop one token into this box along with your ballot. If you abstain, you keep your token."
  2.  **Benefit:** "Whoever wins gets the meeting topic. Everyone gets the topic, voters and abstainers alike."
  3.  **The Count:** "I will not count all the votes. I will shake the box and draw exactly **five** ballots at random. The option with the most votes among those five wins. If there is a tie in the sample, I will draw one more ballot to break it."
  4.  **Strategy:** "You may vote for your true favourite, or you may vote strategically to block a worse option. You may also choose not to vote."

  "You have your coloured cards from before. You may follow them, or you may vote your true conscience. That is up to you. But remember: Voting costs a token. Abstaining is free."

  *(Give them 5 minutes to think. Walk around. Answer rule questions only. Do not discuss strategy.)*

  #### 0:40 – 0:55 | Part 2: The Participation Trap
  **You say:**
  "Please write your choice (A, B, or C) on a white slip. If you choose to vote, place the slip and one token in the box. If you choose to abstain, keep your token and do not put anything in the box."

  *(Collect the box. Ensure silence.)*

  *(Go to the front. Shake the box visibly. Pull out 5 slips. Read them aloud. Tally them on the board.)*

  **Announce the Winner:** "Based on the sample, the winner is [Option X]."
  *(Note: It is possible the sample winner differs from the true majority. This is fine; it adds noise.)*

  **Collect Tokens:** "Please bring your remaining tokens to me to redeem your refreshments."

  #### 0:55 – 1:15 | The Debrief
  **You say:**
  "Put your biscuits down for a moment. Let's look at what happened."

  *(Write these three headings on the board: **The Cycle**, **The Cost**, **The Choice**.)*

  **1. The Cycle (Under "The Cycle")**
  "In the first half, A beat B, B beat C, and C beat A.
  *   **Question:** Did anyone feel that the result represented the 'true' will of the room?
  *   **Point:** When preferences are diverse, 'Majority Rule' can be incoherent. There is no single 'People's Voice' waiting to be found. The method of counting creates the result, it doesn't just reveal it."

  **2. The Cost (Under "The Cost")**
  "In the second half, voting cost a token.
  *   **Question:** How many of you abstained to save your token? (Ask for a show of hands).
  *   **Question:** For those who voted, why did you pay?
  *   **Point:** The outcome was a public good. You got the meeting topic whether you voted or not. Your vote only mattered if it was one of the five drawn *and* it broke a tie. Mathematically, the cost was certain, the benefit was tiny. A strictly rational actor keeps the token."

  **3. The Choice (Under "The Choice")**
  "Yet, many of you voted anyway.
  *   **Question:** Why?
  *   **Point:** If voting is irrational, why do we do it?
      *   **Duty:** 'It's the right thing to do.'
      *   **Expression:** 'I want to be on the record.'
      *   **Habit:** 'I always vote.'
      *   **Social Pressure:** 'I didn't want to be the only one holding onto tokens.'
  *   **Conclusion:** We don't vote because it changes the outcome. We vote because *not* voting changes how we see ourselves."

  ---

  ### 4. Troubleshooting: What Will Go Wrong
  As a fellow scientist, you know experiments rarely run perfectly. Here are the failure modes and how to handle them.

  **1. The "Polite Voter" Problem**
  *   **Risk:** Your group is polite. They might vote in Part 2 despite the cost because they don't want to "ruin" the experiment or look cheap.
  *   **Fix:** In the Part 2 instructions, explicitly say: *"In this simulation, keeping your token is the smart move. Do not feel pressured to vote for the sake of the group. This is a test of individual rationality."* Give them permission to be selfish.

  **2. The Sample Size Confusion**
  *   **Risk:** People won't understand why you are drawing only 5 ballots. They might think it's a trick.
  *   **Fix:** Keep the explanation mechanical. *"This is to simulate the uncertainty of a large election. In a national election, you don't know if your vote will be counted or if it will matter. This mechanic simulates that uncertainty."*

  **3. The "Angry Loser"**
  *   **Risk:** Someone ends with 0 tokens because they voted in Part 1 (if you made that costly) and Part 2, or they feel cheated by the random sample.
  *   **Fix:** Ensure Part 1 is **free** (hand raises only). Only Part 2 costs tokens. This ensures everyone has at least 2 tokens left, guaranteeing a biscuit. No one leaves hungry.

  **4. The Cycle Doesn't Happen**
  *   **Risk:** Someone miscounts hands in Part 1, or people vote against their coloured cards.
  *   **Fix:** You must be the counter. Do not ask them to count themselves. When you ask "Who prefers A to B?", look at the coloured cards yourself if possible, or trust the hand raise but be authoritative. If the cycle breaks (e.g., A beats B, B beats C, A beats C), acknowledge it: *"Interesting. The cycle didn't form. That means our preferences happened to align enough for a clear winner. But in theory, with different cards, the cycle holds."* (Though with the 1/3 split assigned, it *will* hold if counted correctly).

  ### 5. Limitations: What This Setup Can't Reproduce
  Be honest with them in the debrief about where the analogy stops.

  1.  **Scale:** In a room of 20, your vote *actually* has a decent chance of mattering (especially with the 5-ballot sample). In a national election, the probability is effectively zero. The "irrationality" is much stronger in the real world than in this room.
  2.  **Secret Ballot:** In this room, they can see who is holding tokens. In a real booth, there is no social pressure. This experiment likely *overestimates* the social cost of abstaining.
  3.  **Consequences:** Next month's meeting topic is low stakes. Real elections affect taxes, wars, and healthcare. When stakes ($B$) go up, the rational calculation changes.
  4.  **Strategic Voting:** In Part 1, they might realize they should vote for their 2nd choice to block their 3rd. This is good! It shows instability. But in Part 2, the random sample makes strategy very hard to calculate. Acknowledge that: *"The system was too noisy to strategize effectively, which is often the case in real life."*

  ### 6. Facilitator's Cheat Sheet (Keep this in your pocket)
  *   **If they ask "Is this real?":** "It's a model. All models are wrong, some are useful."
  *   **If they ask "Who won Part 1?":** "There was no winner. That was the point."
  *   **If they complain about the Token Cost:** "That discomfort you feel? That's the paradox."
  *   **If the Sample produces a loser:** "The system produced a result that contradicts the majority. That's noise. In large elections, noise and uncertainty are why we vote despite the odds."

  ### Final Advice for the Geologist
  You are used to rock that stays put. Philosophy is fluid. In Part 1, you are showing them that the "ground" (the Will of the People) is unstable. In Part 2, you are showing them that the "tool" (Voting) is inefficient.

  Your group is scientific. They will respect the data generated in the room more than any argument you make. Let the token count and the vote cycle speak for themselves. Your only job is to hold up the mirror.

  Good luck. It sounds like a brilliant session.
