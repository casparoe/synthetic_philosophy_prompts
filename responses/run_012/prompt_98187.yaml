      *   **Task 1: Untangle the distinction.** Explain why they feel different and clarify the underlying philosophical claims.
      *   **Task 2: Kind vs. Concept.** Distinguish between the *kind itself* being constructed vs. just our *concept/word* for it. Explain why this matters (what turns on it).
      *   **Task 3: Constitutive vs. Causal.** Explain the difference between these two types of construction claims. Apply this to *money* and *gender* separately (acknowledging they might differ).
      *   **Task 4: The "Real" Claim.** Is there a reading of "socially constructed" that is neither trivial nor just about language?
      *   **Task 5: Interactive Kinds.** Where do kinds that change when classified (Hacking's "looping effects") fit in?
      *   **Task 6: Made-up Kind.** Invent a fictional kind to test these distinctions.

  2.  **Initial Brainstorming & Philosophical Grounding:**

