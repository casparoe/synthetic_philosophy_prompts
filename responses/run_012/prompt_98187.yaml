      *   *Race:* More complex. Is it biological (mostly no)? Is it purely social? If we stopped talking about race, would racialized oppression stop? Or would physical differences still lead to grouping? Usually, constructionists argue race has no biological essence *but* has real social effects.
      *   *Kind vs. Concept:* Realism vs. Nominalism. If the *kind* is constructed, the thing itself depends on society. If the *concept* is constructed, the thing exists, but we carve it up differently.
      *   *Causal vs. Constitutive:* Causal = Society caused this to exist (e.g., scars from war). Constitutive = Society is what makes this *what it is* (e.g., being a husband).
      *   *Interactive Kinds:* Ian Hacking's concept. Classifying people changes how they see themselves and act, which changes the classification.
      *   *The "Non-Trivial" Claim:* It's about ontology and power. It's not just "we named it," it's "we made it real, and we can unmake or remake it."

