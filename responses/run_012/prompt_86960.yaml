answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Human Rights Documentation Center
  **FROM:** [Your Name], Board Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Draft Naming Protocol and Terminology Standards

  ### I. Executive Summary

  Following the controversies surrounding our last exhibition, the Curatorial Department has drafted a Naming Protocol to standardize our use of terms regarding mass violence. This memo recommends **adopting the protocol with specific amendments** regarding the evidentiary threshold for independent determinations and the terminological distinction within the cultural-destruction annex.

  While we must avoid the paralysis of waiting for legal verdicts that may never come, we also cannot afford to weaponize terminology to the point where our documentation loses evidentiary weight. The recommended path preserves the Center's moral voice while insulating our findings from charges of legal incompetence or political advocacy.

  ### II. The Core Tension: Description vs. Accusation

  We must begin by answering the fundamental question raised during recent debates: Is naming an atrocity a descriptive act or an act of accusation?

  The hard truth is that it is both, and pretending otherwise is dangerous.
  *   **As Description:** To document that a group is being destroyed is a factual claim about patterns of violence, displacement, and mortality. In this sense, "genocide" describes a sociological reality.
  *   **As Accusation:** In the public and legal sphere, "genocide" is the "crime of crimes." To apply it is to assign specific intent (*dolus specialis*) to the perpetrators. It is a verdict.

  If we treat the term as purely descriptive, we risk libel and reputational collapse. If we treat it as purely accusatory without legal standing, we become a tribunal without a gavel. The Protocol must navigate this by acknowledging that our use of the term is a **finding of fact based on available evidence,** not a judicial conviction. We are not sentencing individuals; we are characterizing events. However, we must accept that the public will hear the latter when we say the former.

  ### III. The Strongest Case Against Independent Naming

  Before detailing my recommendation, I must articulate the strongest argument against the position I hold (and which underpins much of the draft Protocol). This argument, advanced most rigorously by legal practitioners among our advisors, rests on three pillars:

  1.  **The Integrity of the Term:** "Genocide" is a term of art in international law (1948 Convention). Diluting it to cover cultural destruction or applying it without judicial process risks "conceptual inflation." If every atrocity is genocide, eventually nothing is.
  2.  **Institutional Competence:** We are archivists and researchers, not judges. Determining "intent to destroy" requires access to state secrets, military orders, and internal communications that courts subpoena and we do not. By making this call, we expose the Center to claims of bias and overreach.
  3.  **The Risk of Backfire:** Prematurely labeling a conflict "genocide" can harden perpetrator resolve, complicate diplomatic off-ramps, and allow bad-faith actors to dismiss our entire archive as political propaganda rather than evidence.

  These objections are not merely cautious; they are substantive. If we lose our reputation for scrupulous neutrality, we lose our utility to future tribunals.

  ### IV. Analysis of the Draft Protocol

  The draft three-tier system (Mass Atrocity → Crimes Against Humanity → Genocide) is a significant improvement over our previous ad-hoc approach. It allows us to document severity without immediately escalating to the highest label.

  **However, two areas require amendment:**

  **1. The "Researcher Conclusion" Clause (Tier 3)**
  The draft allows us to use "genocide" if researchers conclude intent is the "only reasonable inference."
  *   *Risk:* This is subjective. One team's "reasonable inference" is another's "strategic displacement."
  *   *Amendment:* This determination must not rest solely with internal researchers. It requires an **External Review Panel** of three independent experts (one legal, one historical, one regional) who must sign off on the "intent" finding before public release.

  **2. The Cultural-Destruction Annex**
  The curators rightly note that Raphael Lemkin's original concept included the destruction of language, religion, and heritage. The 1948 Convention narrowed this for political expediency.
  *   *Risk:* Using the standalone word "genocide" for cultural destruction, absent mass killing, invites immediate dismissal by legal scholars and undermines the gravity of the term when killings *are* occurring.
  *   *Amendment:* We should honor Lemkin without conflating sociological and legal definitions. In cases of systematic cultural destruction without mass killing, the Protocol should mandate the use of the term **"Cultural Genocide"** with a mandatory footnote explicating the distinction between the Lemkinian concept and the 1948 legal threshold. This preserves the moral weight of the observation without claiming a legal status we cannot confer.

  ### V. Recommended Trigger and Review Process

  To operationalize this, I propose the following **Naming Committee** structure:

  1.  **Trigger:** A Naming Review is triggered automatically when an exhibition or report documents:
      *   Mortality rates exceeding [X]% of a specific group in a region; OR
      *   Systematic destruction of religious/cultural sites exceeding [X] instances; OR
      *   A formal request from the Curatorial Lead.
  2.  **Process:**
      *   **Phase 1 (Internal):** Curators submit evidence dossier against the three-tier criteria.
      *   **Phase 2 (External):** If Tier 3 ("Genocide") is proposed, the dossier goes to the External Review Panel (vetted for conflicts of interest). They do not vote on the exhibition, only on the *terminology*.
      *   **Phase 3 (Publication):** If the term "Genocide" is applied (either via Court Verdict or Independent Determination), the exhibition text must include a "Methodology Note" briefly explaining the evidentiary basis (e.g., *"This designation is based on the Center's analysis of pattern and intent, consistent with the 1948 Convention standards"*).
  3.  **Sunset Clause:** All Independent Determinations of "Genocide" are subject to review every five years or upon the conclusion of relevant international legal proceedings, whichever comes first. If a competent court rules contrary to our finding, we must append the court's finding to our archive.

  ### VI. Conclusion

  My friend, the international lawyer, argues that we should wait for a court to speak so that we do not cheapen the word. I argue that if we wait for a court, we are often waiting for politics to finish its work. Courts move slowly; victims die quickly. The 1948 Convention was a political artifact, and our duty is to document the reality of destruction, not just the reality that fits within a treaty compromised by 1940s statecraft.

  However, my friend is right that our credibility is our only currency. We cannot spend it recklessly.

  By adopting this protocol with the recommended amendments—specifically the external review for intent and the terminological precision regarding cultural destruction—we strike a balance. We acknowledge that naming is an act of accusation, and we accept the burden of proof that comes with it. We refuse to let the word die in the waiting room of the UN, but we promise not to use it unless the evidence leaves us no other reasonable choice.

  **Recommendation:** Move to adopt the Naming Protocol with the amendments regarding External Review and Cultural Terminology as outlined above.
