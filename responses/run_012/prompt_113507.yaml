      *Crucial distinction:* The view says Severe Suffering cannot be justified by *Pleasure*. It doesn't explicitly say it can't be justified by *preventing other Severe Suffering*. But usually, Lexical Negative Utilitarianism implies Severe Suffering is the *only* thing that matters lexically.
