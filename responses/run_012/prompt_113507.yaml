      *   **The Verdict (Policy vs. Individual):**
          *   *Policy:* LTNU likely condemns the "Pain as 5th Vital Sign" push because it ignored the *risk* of lexical bads (overdose) to treat sub-lexical bads (chronic pain).
          *   *Individual Doctor:* Harder. If the patient is in *agony* (above $T$), the doctor must treat. If the pain is manageable (below $T$), the doctor must prioritize avoiding the lexical risk.
      *   **The Silence/Make-believe:**
          *   LTNU doesn't handle *risk* well. It's usually formulated for certain outcomes. How do we weigh a 1% chance of lexical horror against 100% certainty of sub-lexical pain? The view goes silent here.
      *   **User's Suspicion (Pain vs. Pain):**
          *   Confirm the user is right. The "pleasure" clause is idle. The "relief is not pleasure" clause matters (prevents justification by "happy addict").
