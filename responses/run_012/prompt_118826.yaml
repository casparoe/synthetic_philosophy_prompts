prompt: |-
  Ok, I need help with something and I think this is the kind of thing you'd be good at.

  Background: I volunteer at our local heritage museum, and through a series of bad decisions I've ended up as the person giving the opening talk for a small exhibit we're putting on about "collapse" — Bronze Age, Maya, Rapa Nui, that circuit. What I thought would be a fun summer of reading turned into four months of it, and I've come out the other side actually believing something, which is annoying because now I have to defend it in public.

  My position, roughly: "collapse" is mostly a bad concept and we should mostly stop using it. What actually ends in these cases is a particular kind of elite political order — palace economies, divine kingship, monumental building programs, scribal classes — while most people stay put or move a bit and reorganize. The southern Maya lowlands depopulate but the northern Yucatan is thriving at the same time; the Late Bronze Age palace system comes apart around 1200 BC while village life, farming, and a lot of the trade keeps going; Rapa Nui's actual demographic catastrophe comes after European contact, not before, and the population may never have been as big as the ecocide story needs it to be. So transformation, fragmentation, reorganization: yes. Collapse: only when there's a genuine demographic catastrophe nobody recovers from. And honestly I think a lot of the collapse genre is us telling our own anxiety story with somebody else's ruins — which is not a neutral observation here, because our region has had three bad fire seasons in a row and the whole town is in a "are we next" mood, which is partly why the museum picked this theme and why the room will be full.

  The counterexample that genuinely worries me is Norse Greenland, where the colony just ends, and I don't have a clean way to handle it.

  Now the room. Roughly: the heritage society regulars, who are mostly avocational archaeologists and metal detectorists who treat "collapse" as an ordinary periodization word and will not be charmed by me redefining their vocabulary. Two academics from the university are coming: an anthropologist who works on resilience and adaptive cycles, who will be sympathetic to me in a way that's going to be a problem because she'll push me further than I want to go; and a classicist who works on the Aegean and the Mycenaean palaces, who I'm fairly sure will hit the Bronze Age case hard because she thinks those destructions really were catastrophic. Plus the local historian, and maybe twenty members of the public who signed up because the poster said "collapse" and want to know if we're next.

  What I want: act like a veteran of academic Q&A, someone who's sat through a hundred of these and can tell the difference between the question that's a real problem and the question that just sounds scary. Please think carefully and start by brainstorming out loud what the actual fault lines in this room are, before you write anything else. Then give me the prep sheet — the eight or nine objections I will really get, ordered by how much damage they do (most damaging first, not most likely first), each one phrased in the vocabulary of the specific person who'll make it, with a role label next to it, not phrased in my language. For each: what I should concede right away, what I should hold, a reply I could actually deliver in two minutes without notes, and an honest note on where that reply is soft or where I'm bluffing. If two people in the room would make the same objection for different reasons, say so and tell me which version is harder to answer.

  Two things I specifically need. First, the objection about whether "collapse" is doing real comparative work that I'd lose by dropping it — I keep feeling like I don't have a good answer and I want to see what my best version even looks like. Second, the one I'm hoping nobody asks. My guess is it's something about whether my reframing is just a polite way of not taking mass death seriously — "they didn't collapse, they reorganized" as a way of laundering starvation — but you tell me if there's something worse I'm not seeing. Don't be nice to me about it. If my thesis is actually unfalsifiable, say so, and say what would have to be true for it to be false.

  Also flag anything in my framing that's just factually wrong, or that an archaeologist would hear as a tell that I'm an amateur. I'd rather find out from you than from the room. Skip the reading list, I've got enough tabs open already and a bibliography is no use to me standing at a lectern.
