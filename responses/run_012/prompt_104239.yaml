          2.  The procedure (numbered steps, sufficient answer, fact vs. judgment).
          3.  Where it stops and where it hands off (no's, handoffs, sign-offs).
          4.  Two or three worked cases (salamander gene split, songbird plumage/song, hatchery trout).
          5.  Where this will misfire (~200 words).
      *   **Tone:** Practical, administrative, biologically literate but not academic, honest about limitations.

  2.  **Drafting Section 1: The Core Debate (~250 words)**
      *   *Goal:* Explain why systematists disagree without getting bogged down in philosophy. Focus on the operational impact.
      *   *Key points:* It's not about "truth," it's about thresholds. Biological Species Concept (reproduction) vs. Phylogenetic (lineage) vs. Morphological (diagnosability). The conflict arises because evolution is a continuum, and "species" is a bucket we impose on it.
      *   *Drafting:* Focus on the "lumper vs. splitter" dynamic. Acknowledge that data isn't the only variable; the *definition* of species is the variable. For a heritage program, the goal isn't perfect taxonomy, it's conservation units. The debate bites because one expert says "no gene flow" (BSC) and another says "no diagnostic characters" (Morphological), and both are right within their framework. The program needs a unified framework that prioritizes evolutionary independence and conservation manageability over theoretical purity.
      *   *Word Count Check:* Need to keep it tight.

  3.  **Drafting Section 2: The Procedure**
      *   *Goal:* A step-by-step filter.
      *   *Steps:*
          1.  Validity of Petition (Administrative).
          2.  Distinctness (Diagnosability).
          3.  Independence (Reproductive/ evolutionary).
          4.  Conservation Significance (The values call).
      *   *Fact vs. Judgment:* Need to clearly label where science ends and policy begins.
      *   *Sufficient Answer:* What evidence clears the hurdle?

  4.  **Drafting Section 3: Stops and Handoffs**
      *   *Goal:* Define failure points and escalation.
