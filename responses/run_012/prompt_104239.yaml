      *   *Case 1: Salamander (Gene divergence).* Likely fail on diagnosability or significance unless correlated with morphology/ecology. Pure mtDNA splits are risky.
      *   *Case 2: Songbird (Plumage/Song).* Likely pass. Diagnosable + Behavioral isolation.
      *   *Case 3: Hatchery Trout.* Likely fail on "natural" lineage or conservation significance (it's artificial).
      *   *Constraint:* Tell me which one the procedure will answer in a way I won't like. (Probably the Salamander - scientists love splits, admin hates unstable lists).

  6.  **Drafting Section 5: Where this will misfire (~200 words)**
      *   *Goal:* Honesty about limitations.
      *   *Points:* Cryptic species, hybrid zones, rapid evolution, political pressure. The procedure creates stability, not necessarily biological truth. It might lag behind cutting-edge science.
      *   *Word Count Check:* Keep it around 200.

  7.  **Review and Refine:**
      *   *Check Constraints:* 3 weeks, 2 staff, lawyer approval. The procedure needs to be bureaucratic enough for the lawyer but biological enough for the staff.
      *   *Tone:* Professional, direct.
