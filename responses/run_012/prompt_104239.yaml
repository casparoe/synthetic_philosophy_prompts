answer: |-
  - **The part of the species debate that actually bites here**

  The debate isn't about data quality; it's about threshold setting. Evolution is a continuum, but conservation law requires binary categories: protected or not. Systematists disagree because they prioritize different evolutionary signals. The Biological Species Concept (BSC) demands reproductive isolation, which is hard to prove in allopatry. The Phylogenetic Species Concept (PSC) demands diagnosable distinctness, which can elevate trivial variants to species status. The Morphological concept requires visible differences, which ignores cryptic diversity.

  For your program, the conflict arises because a PSC advocate sees a unique gene lineage as a species, while a BSC advocate sees potential interbreeding as one species. Both are scientifically defensible. The "mess" is that neither is objectively true; they are tools. Your program isn't arbitrating truth; you are defining conservation units. The bite comes when you must choose between stability (ignoring minor splits) and sensitivity (protecting minor variants). If you follow the splitters, your list becomes unmanageable. If you follow the lumpers, you risk losing unique lineages. The procedure must decouple the scientific evidence of difference from the policy decision of whether that difference warrants species status.

  - **The procedure, in order**

  1.  **Administrative Validity**
      *   *Question:* Does the petition provide peer-reviewed or verifiable raw data supporting the claim?
      *   *Sufficient Answer:* Yes, data is accessible and methods are standard.
      *   *Type:* Fact.
      *   *Action:* If No, reject immediately.

  2.  **Diagnosability**
      *   *Question:* Can an individual be assigned to the proposed unit with >95% accuracy using morphology, genetics, or behavior?
      *   *Sufficient Answer:* Yes, distinct characters or fixed genetic differences exist.
      *   *Type:* Fact.
      *   *Action:* If No, stop (reject split).

  3.  **Evolutionary Independence**
      *   *Question:* Is there evidence of limited gene flow or independent evolutionary trajectory (e.g., reciprocal monophyly, ecological separation)?
      *   *Sufficient Answer:* Yes, data suggests isolation or distinct selection pressures.
      *   *Type:* Fact (interpreted).
      *   *Action:* If No, stop (reject split).

  4.  **Conservation Significance (The Values Call)**
      *   *Question:* Does recognizing this unit further conservation goals without rendering the tracking list unmanageable?
      *   *Sufficient Answer:* Committee consensus that the unit represents a unique evolutionary legacy worthy of resource allocation.
      *   *Type:* Judgment.
      *   *Action:* If No, recommend lumping. If Yes, recommend splitting.

  - **Where it stops and where it hands off**

  *   **Stop (Staff Decision):** Step 1 (Administrative) and Step 2 (Diagnosability). If the petition lacks data or the proposed species cannot be distinguished from the parent population, staff issue a "Not Warranted" finding. No committee vote needed. Lawyer reviews for procedural compliance only.
  *   **Handoff (Committee Decision):** Step 3 (Independence) and Step 4 (Significance). If data is conflicting (e.g., genetics say split, morphology says lump), staff compile the evidence and hand off to the three-biologist committee. They vote on whether the evidence meets the program's threshold for independence.
  *   **Sign-Off (Director/Lawyer):** Step 4 outcome. The Committee recommends status; the Program Director signs the final determination based on that recommendation. The lawyer signs off on the documentation trail proving Steps 1–4 were followed sequentially.

  - **Two or three worked cases**

  1.  **Woodland Salamander (Gene Split):** Petition relies on 3% mtDNA divergence. No morphological differences.
      *   *Outcome:* Passes Step 2 (genetic diagnosability). Passes Step 3 (phylogenetic independence). Fails Step 4 (Committee judges this insufficient for resource allocation without ecological correlation).
      *   *Result:* **Not Recognized.** (This is the one you won't like; geneticists will call it conservative, but it protects your list from instability).
  2.  **Coastal vs. Inland Songbird:** Distinct plumage, distinct song, no observed interbreeding in contact zone.
      *   *Outcome:* Passes Step 2 (morph/behavior). Passes Step 3 (behavioral isolation). Passes Step 4 (clear management units).
      *   *Result:* **Recognized.**
  3.  **Hatchery Trout Stock:** Genetically distinct due to artificial selection, not found in wild state.
      *   *Outcome:* Passes Step 2. Fails Step 3 (not a natural evolutionary trajectory).
      *   *Result:* **Not Recognized.**

  - **Where this will misfire**

  This procedure will fail when evolution ignores your categories. Hybrid zones will break the reproductive isolation step. Ring species will break the diagnosability step. Rapid adaptive radiation might look like noise until it's too late. The biggest risk is lag time; by the time you confirm distinctness under these strict rules, a population might be gone. It also cannot resolve political pressure masquerading as science; if a developer funds a "lumper" report, the procedure treats it as valid evidence, forcing a handoff rather than a dismissal. Finally, it prioritizes stability over discovery. You will miss cryptic species that lack genetic markers in the tested loci. You are building a legal shield, not a taxonomic monograph. It protects the program from liability, not necessarily the biodiversity from extinction.
