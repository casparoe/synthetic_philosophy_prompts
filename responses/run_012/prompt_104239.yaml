  *Section 1 Draft:*
  The debate isn't about data quality; it's about threshold setting. Evolution is a continuum, but conservation law requires binary categories: protected or not. Systematists disagree because they prioritize different evolutionary signals. The Biological Species Concept (BSC) demands reproductive isolation, which is hard to prove in allopatry. The Phylogenetic Species Concept (PSC) demands diagnosable distinctness, which can elevate trivial variants to species status. The Morphological concept requires visible differences, which ignores cryptic diversity.
  For your program, the conflict arises because a PSC advocate sees a unique gene lineage as a species, while a BSC advocate sees potential interbreeding as one species. Both are scientifically defensible. The "mess" is that neither is objectively true; they are tools. Your program isn't arbitrating truth; you are defining conservation units. The bite comes when you must choose between stability (ignoring minor splits) and sensitivity (protecting minor variants). If you follow the splitters, your list becomes unmanageable. If you follow the lumpers, you risk losing unique lineages. The procedure must decouple the scientific evidence of difference from the policy decision of whether that difference warrants species status.

  *Section 5 Draft:*
  This procedure will fail when evolution ignores your categories. Hybrid zones will break the reproductive isolation step. Ring species will break the diagnosability step. Rapid adaptive radiation might look like noise until it's too late. The biggest risk is lag time; by the time you confirm distinctness under these strict rules, a population might be gone. It also cannot resolve political pressure masquerading as science; if a developer funds a "lumper" report, the procedure treats it as valid evidence, forcing a handoff rather than a dismissal. Finally, it prioritizes stability over discovery. You will miss cryptic species that lack genetic markers in the tested loci. You are building a legal shield, not a taxonomic monograph. It protects the program from liability, not necessarily the biodiversity from extinction.

  *Refining the Procedure:*
  Make sure the "Judgment Call" steps are clearly assigned to the Committee, not staff.
  Make sure the "Stop" points are clear.

  *Refining Worked Cases:*
  Ensure I explicitly identify the "unlikeable" outcome.

  *Final check on constraints:*
  - 3 weeks/2 staff/3 committee/1 lawyer.
  - Format exactly as requested.

