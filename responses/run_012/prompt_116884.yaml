      *   *Paragraph 2:* Address the gravity. You ask why this inner act outweighs a life. Because the soul's orientation toward Truth is the highest good. To wound the soul is to wound the image of God within. We cannot do evil that good may come. If I lie, I damage my own capacity for Truth. I must trust God with the outcome of the truth, not seize control through falsehood.

  6.  **Polishing for Voice:**
      *   Use terms like "signification," "will," "truth," "covenant," "temporal," "eternal."
      *   Avoid modern phrasing like "grammar" (use "arrangement of words" or "propriety of speech").
      *   Ensure the tone is firm but charitable.

  7.  **Final Review against Constraints:**
      *   First person? Yes.
