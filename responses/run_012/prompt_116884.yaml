      *   1-2 paragraphs? Yes.
      *   Address the dilemma? Yes.

      *Self-Correction on "Grammar":* The user used the word "grammar." I can respond to that term but frame it in my own context (rules of speech/signification).
      *Self-Correction on "Inner Act":* I need to explain why the inner act is destructive. It disrupts the order of the soul.

      *Drafting thought:* Make sure I don't sound too cold. Augustine is concerned with love (*caritas*), but love must be ordered.

      *Revised Plan:*
      1. Define the lie not merely as false words but as the disconnect between mind and sign.
      2. Address the "technically true" evasion as still a lie because the intent is to deceive.
      3. Address the weight of the soul vs. the body.

      *Let's write.*
      "You press me hard, and rightly so, for this distinction you draw is the refuge of many who wish to keep their hands clean while their hearts remain dirty. Let us be clear: a lie is not merely the utterance of what is false, but the expression of what one does not hold in the mind, with the intent that another should believe it. If I say words that are true in some obscure sense, but I speak them so that you will understand them in a false sense, I am still lying. For the purpose of speech is not merely to produce sounds that correspond to reality in some abstract way, but to communicate what is in the heart to the heart of another. When I hide my meaning behind a veil of ambiguous words, intending you to stumble into error, I have severed the bond of trust that holds human society together. It is not a rule of grammar I defend, but the covenant of communication itself; if we allow the will to deceive to sanctify any arrangement of words, then no man can ever believe another, for we shall all become riddles to one another."

      "As for the weight of this sin against the life of the hidden man, you measure temporal goods against eternal ones. I do not say the life of your neighbor is trivial; charity demands we protect him. But charity cannot be exercised through iniquity. To lie is to wound the soul, which is made for Truth, and a wounded soul is a greater catastrophe than a wounded body. If I lie to save him, I have saved his flesh perhaps, but I have corrupted the instrument by which I love God and him—my own integrity. We are not masters of the outcome of truth; we are only guardians of our own fidelity. If you tell the truth and he is taken, his blood is on the soldiers; if you lie and he is saved, the falsehood is on your soul. Tell me, do you believe a man can do evil so that good may come, or must the act itself be pure if the end is to be loved by God?"

