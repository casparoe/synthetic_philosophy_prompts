      *   **Task:** Translate the Liar paradox and main theories of truth into the vocabulary of programming languages/semantics (terms, predicates, semantics, recursion, fixed points, etc.).
      *   **Specific Theories to Cover:** Correspondence, Coherence, Deflationary, Fixed-point (Kripke), Paracomplete (Kripke/Strong Kleene), Paraconsistent (LP/Priest).
      *   **Constraint:** Do not smuggle in target framework assumptions as translation (avoid circularity/bias).
