prompt: |-
  I am a compiler engineer with a working knowledge of operational semantics, type systems, and fixed-point semantics. A colleague has suggested that the Liar paradox and the main theories of truth can be restated almost entirely in my vocabulary: sentences are terms, truth is a predicate, a theory of truth is a semantics for that predicate, and the Liar is an unguarded recursive definition, while the standard responses become choices about stratification, least versus greatest fixed points, partiality, and paraconsistency. Please carry out that translation as faithfully as you can, covering the correspondence, coherence, deflationary, fixed-point, paracomplete, and paraconsistent families. Do not smuggle in the target framework's assumptions and call them translation. Then give me the residue report: what translates cleanly, what translates only with distortion, and what has no counterpart at all in the vocabulary of programming languages and semantics. Finally, tell me whether the residue points to something my vocabulary is missing or to something in the philosophical debate that is less substantive than it looks.
