  # Joint Statement on the Ant S Case: Adversarial Collaboration

  ## Part I: Agreed Claims

  1.  **The Temporal Mismatch Claim:** The regulatory stability described in condition (b) operates on a timescale that strictly exceeds the lifespan and memory capacity of any individual worker.
      *   *Commits us to:* Any explanation of the colony's homeostasis must appeal to mechanisms that persist beyond individual turnover, whether those mechanisms are labeled "structural memory" (Colony-Cognition) or "population dynamics" (Nestmate-Minimalism).

  2.  **The Structural Sensitivity Claim:** As per condition (d), the colony's behavioral output is sensitive to the *topology* of interactions, not merely the *count* of participants. Removing specific structural nodes causes permanent shifts that random removal does not.
      *   *Commits us to:* Rejecting models where the colony is a simple aggregate of independent agents. The arrangement of ants is causally relevant to the system's output.

  3.  **The Individual Simplicity Claim:** Consistent with condition (f), no individual ant possesses a model of the colony's global state, nor does any individual anticipate the long-term climatic cycle.
      *   *Commits us to:* Locating any "global" information processing either in the relations between ants or denying that such processing constitutes cognition at all. We agree the "intelligence" is not inside the head of a single ant.

  4.  **The Path-Dependence Claim:** The divergence of strategies in condition (c) demonstrates that colony behavior is historically contingent. Two colonies with identical individual components and identical environments can settle into different stable states.
      *   *Commits us to:* Acknowledging that the colony's current state is not fully determined by current individual states and current environmental inputs; history is encoded in the system.

  5.  **The Non-Mystery Claim:** If the colony is a cognitive system, its operations must be fully realized by the physical interactions of the ants and their environment. No non-physical "group soul" or downward causation that violates physical laws is permitted.
      *   *Commits us to:* A naturalistic framework where the disagreement is about classification and realization, not about the presence of magic.

  ## Part II: Disagreements

  | Disagreement in neutral terms | Colony-cognition formulation | Nestmate-minimalist formulation | Crux (the sub-question that, if settled, would move at least one camp) | Shared test or case both camps accept in advance as bearing on the crux | Colony-cognition prediction | Nestmate-minimalist prediction | What settling it would move |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Location of Error Correction** | The colony corrects errors based on a discrepancy between its internal model of the garden and the garden's actual state. | Ants correct local stimuli based on immediate cues; global correction is an emergent byproduct of local fixes. | Does the system respond to global state variables that are invisible to local sensors? | Introduce a "global decoy": Manipulate the garden to be dangerous (e.g., toxic) while ensuring all local ant-sensory inputs remain within "safe" parameters. | The colony will detect the toxicity and alter behavior despite local "safe" signals, indicating access to global data. | The colony will fail to detect toxicity until ants begin dying locally, as behavior is driven solely by local cues. | Colony-cognition (if colony acts on global data). |
  | **Rate of Adaptation** | The colony can update its foraging strategy faster than the rate of individual worker turnover allows. | Strategy change is bounded by the rate at which informed individuals replace uninformed ones. | Is the system's learning rate decoupled from individual learning rates? | Suddenly shift the optimal foraging sector. Measure time to full adaptation against the lifespan of a worker. | Adaptation occurs significantly faster than one worker generation, implying structural updating. | Adaptation rate matches or lags behind the turnover rate of the forager population. | Both (forces NM to admit structural learning or CC to admit individual bounds). |
  | **Subject of Harm** | The colony can be harmed in ways that do not reduce the immediate welfare of current workers (e.g., compromising future viability). | Harm is strictly aggregated individual welfare; "future viability" is an observer's valuation, not the system's. | Is there a trade-off logic where the system sacrifices individual welfare for system persistence? | Force a choice: Save 10% of current foragers now, or save the fungus garden (ensuring future generations) but lose the 10%. | The system will consistently sacrifice the 10% to save the garden, prioritizing system continuity. | The outcome will vary based on individual stress thresholds; no consistent "system preference" will emerge. | Colony-cognition (if consistent system-level trade-off exists). |
  | **Nature of the Merge** | When colonies merge (e), a new cognitive subject is formed with its own interests distinct from the predecessors. | When colonies merge, two causal networks interfere; the outcome is a physical collision, not a decision. | Does the merged entity exhibit novel stability properties not present in either predecessor? | Merge two colonies with incompatible strategies. Monitor if a third, stable strategy emerges. | A novel, stable third strategy emerges that neither colony possessed (genuine integration). | The colony oscillates or one strategy dominates via numerical attrition (conflict/decay). | Neither (mostly conceptual: both agree on outcome, disagree on description). |

