answer: |-
  ### 1. The Test Cases
  *Any adequate theory must deliver the intuitive verdict (usually "no moral worth") on these cases.*

  1.  **The Humiliated Promiser:** Keeps a promise solely to avoid social shame. (Tests exclusion of self-interest/prudence).
  2.  **The Aesthetic Helper:** Helps a stranger warmly but would have refused if they were ugly. (Tests exclusion of bias/arbitrary conditions).
  3.  **The Guilt-Avoider:** Does the right thing only to dodge internal psychic pain. (Tests exclusion of coercion/negative reinforcement).
  4.  **The Friendly Favor:** Does a right action for a friend because of affection, not need. (Tests exclusion of non-moral virtues/love).
  5.  **The Lucky Saint:** Has an admirable motive that causes the right act only via a deviant causal chain. (Tests exclusion of accidental correctness).
  6.  **The Overdetermined Agent:** Does the right thing for the right reason, but a selfish reason would have sufficed anyway. (Tests necessity of the moral motive).
  7.  **The Unreflective Habit:** Does the right thing reliably via ingrained habit without conscious moral thought. (Tests inclusion of disposition/non-deliberative action).

  ### 2. The Required Distinctions
  *The theory must structurally separate these concepts.*

  1.  **Acting Rightly vs. Acting Worthily:** Conformity to moral norm vs. the pedigree of the motive producing the act.
  2.  **Praiseworthiness vs. Moral Worth:** General agent evaluation (including talent/effort) vs. specific credit for moral motivation.
  3.  **Action Worth vs. Character Worth:** Credit for a single token act vs. credit for an enduring trait or disposition.
  4.  **Acting Reason vs. Right-Making Reason:** The psychological state moving the agent vs. the objective feature making the act obligatory.

  ### 3. External Constraints & The Representation Demand
  *   **Constraint 1 (Opacity):** Agents often cannot introspectively verify their true motives.
  *   **Constraint 2 (Habit):** Much moral behavior is fast, automatic, and non-deliberative.
  *   **Verdict on Explicit Representation:** A requirement that the agent must consciously represent the right-making feature (e.g., think "this is Duty") is **fatal**. It fails the Habit constraint (virtuous experts don't deliberate) and exacerbates the Opacity constraint (invites self-deception).
  *   **Solution:** The theory must drop explicit representation but replace it with a counterfactual or dispositional account (e.g., "the agent would have recognized the reason if challenged" or "the disposition tracks the reason").

  ### 4. Suspected Incompatibilities
  *Your suspicion is correct, but it is specifically a tension between **Control** and **Truth-Tracking**.*

  *   **The Conflict:** To be responsible (Control), the source of worth must be internal to the agent's psychology. To be *moral* worth (Truth-Tracking), the source must connect to external moral facts (the right-making features).
  *   **The Gap:** If worth depends on the agent's internal state, a well-meaning agent acting on false moral beliefs creates a problem (Internalism). If worth depends on the actual connection to moral facts, the agent might lack worth due to ignorance despite perfect internal motivation (Externalism).
  *   **The Hard Pair:** **The Non-Accidental Connection Requirement** (the motive must track the truth) vs. **The Psychological Opacity Constraint** (the agent can't know if they are tracking the truth). Satisfying both requires a complex dispositional account that risks becoming unfalsifiable.

  ### 5. The Exclusionary Requirement & Theory Scoring
  *   **The Single Most Excluding Requirement:** **The "Because" Condition.** The right-making feature must explain the action *through* the motive, not merely correlate with it. This eliminates pure Consequentialism (outcome determines worth) and simple Virtue Ethics (trait determines worth without reason-tracking).

  *   **Theory Scoring:**
      *   **Kantian (Quality of Will):** **Passes** the "Because" Condition and Distinctions perfectly. **Fails** the Habit Constraint (over-intellectualizes motive) and struggles with Overdetermination.
      *   **Reasons-Responsiveness:** **Passes** the Habit Constraint (allows dispositional sensitivity) and the "Because" Condition. **Fails** on Opacity (hard to verify sensitivity without explicit representation) and risks collapsing Action/Character Worth.
      *   **Humean (Sentimentalist):** **Passes** the Habit Constraint and Opacity (motives are felt, not reasoned). **Fails** the "Because" Condition (cannot distinguish acting from sympathy vs. acting from the right reason) and struggles with the Rightness/Worth distinction.
