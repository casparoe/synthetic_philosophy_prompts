prompt: |-
  Quick context so you know what you're dealing with: I'm a software engineer (backend/infra mostly, a bit of ML plumbing) at a mid-size health-tech company, and through a chain of bad decisions by people more senior than me I've somehow ended up owning what we call the model fairness review. Every time a team wants to put a model into production that touches people -- who gets enrolled in a care-management program, who gets flagged for a follow-up call, which claims get auto-approved, that kind of thing -- it comes to me and I have to sign off or send it back. Right now I'm just doing vibes, and I'd like to not do vibes. The annoying part is I've read enough to know that the whole area has these results that say you basically can't have everything at once: if you want the scores to be calibrated (a 0.8 really means 0.8 in every group) then you can't also have equal false positive and false negative rates across groups, unless the groups have the same base rate or your model is perfect, which it never is. And then there's the whole mess of whether you should even feed the protected attribute in, whether using a proxy for it is worse, and the fact that the groups in our data genuinely do have different base rates. I don't have a stats PhD and neither does anyone on my team, and half the time the data we'd need (race, language, disability) is only recorded for a subset of patients anyway.

  So what I want from you is a decision procedure my team can actually run, in order, on a proposed model: the questions to ask first, what counts as a good enough answer to each one, where the procedure just stops with a no, and where it hands the decision back to a human because it's a values call and not a math call (I'm fine with that, I just need to know which steps those are so I stop pretending they're technical). It has to be something a competent engineer can execute in about a week without a statistician in the room, it has to produce a document that our legal person and one of the clinicians will actually sign, and it should be explicit about which fairness-ish criteria we're trading against each other at each fork, since I gather you can't max them all and somebody has to choose. It should also say what to do when we can't get a number for something (small groups, missing attributes, proxy variables that are doing more work than we admit), and it should be honest about the places where the procedure will misfire or where we're dressing up a judgment as a step. Please don't just tell me 'it depends' -- I need the actual sequence.

  Then run it on three cases so I can see how it behaves: (1) a model that prioritizes patients for a care-management program, where the outcome we care about is who actually gets help and the groups have different base rates; (2) a resume screener we're being pressured to ship, where the thing we can measure is interview pass rate and nobody agrees what 'fair' even means here; (3) a claims auto-approval model where the cost of a false approval is money and the cost of a false denial is somebody not getting care, and the two groups have very different denial rates today. At least one of these should come out with an answer the team won't like, and if the procedure can't really separate two of these cases, say so instead of inventing a distinction. Finish by telling me what this procedure can't do and which calls I should stop trying to make myself and push up to someone who's allowed to own a value judgment.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Backend/Infra Engineer (mid-size health-tech), accidentally owns Model Fairness Review. Pragmatic, technical, aware of the impossibility theorems (calibration vs. error rate parity), aware of data limitations (missing protected attributes), skeptical of "vibes."
      *   **Goal:** A concrete, executable decision procedure (checklist/flowchart style) for model fairness review.
      *   **Constraints:**
          *   Executable by competent engineers in ~1 week.
          *   No PhD statistician required.
          *   Must produce a sign-off document for Legal/Clinical.
          *   Must explicitly state trade-offs (math vs. values).
          *   Must handle missing data/proxies.
          *   Must be honest about limitations.
          *   *Crucial:* Do not say "it depends." Give the sequence.
      *   **Deliverables:**
          1.  The Decision Procedure (Step-by-Step).
          2.  Application to 3 Specific Cases (Care Management, Resume Screener, Claims Auto-Approval).
          3.  Limitations & Escalation Advice (What this can't do, where to push back).

  2.  **Deconstruct the Problem (Fairness in Practice):**
      *   *The Impossibility Theorem:* The user knows calibration + equalized odds is impossible with different base rates. The procedure *must* force a choice, not pretend both are achievable.
      *   *Data Gaps:* Protected attributes (PA) are often missing in health tech (race, etc.). The procedure needs a "Missing Data" path.
      *   *Values vs. Math:* Engineers can calculate metrics; they cannot decide which metric matters more. The procedure must identify the "Value Fork."
      *   *Legal/Clinical Sign-off:* The output needs to be defensible. "We checked X, Y, Z" is better than "We felt good about it."

  3.  **Drafting the Decision Procedure (The "Fairness Gate"):**
      *   *Phase 1: Necessity & Risk.* Do we need ML here? What's the harm? (High risk = higher bar).
      *   *Phase 2: Data & Proxies.* Do we have the attributes? If not, can we estimate? (Be honest about proxy risks).
      *   *Phase 3: Metric Selection (The Value Fork).* This is the core. We can't optimize everything. We need to pick *one* primary fairness constraint based on the use case.
          *   *Resource Allocation (Care Mgmt):* Focus on Recall/True Positive Rate (don't miss sick people).
          *   *Gatekeeping (Claims):* Focus on False Positive Rate (don't deny care wrongly) or Calibration (risk accuracy).
          *   *Screening (Resumes):* High risk of bias, often should be "No Go."
      *   *Phase 4: Thresholding.* How do we set the cutoff? (Group-specific vs. Global).
      *   *Phase 5: Documentation.* The "Sign-off Sheet."

  4.  **Refining the Procedure (Making it actionable):**
      *   Need specific thresholds? No, that's too rigid. Need specific *questions*.
      *   Need to address the "Missing PA" issue. If we don't have race data, we can't measure racial fairness directly. We must state that limitation clearly.
      *   Need to address the "Trade-off." The procedure must force the stakeholder to pick: "Do you care more about X or Y?"

  5.  **Developing the Three Cases:**
      *   *Case 1: Care Management (Resource Allocation).*
          *   Goal: Find sick people.
          *   Constraint: Budget is limited.
          *   Fairness Focus: Equal Opportunity (Recall). We want to find sick people in all groups.
          *   Conflict: Base rates differ. If Group A is sicker, they take more slots.
          *   Outcome: Likely "Proceed with Monitoring."
      *   *Case 2: Resume Screener.*
          *   Goal: Filter candidates.
          *   Risk: High legal risk (employment law). Historical data is biased.
          *   Fairness Focus: Hard to define.
          *   Outcome: "No Go." This is the one the team won't like. ML on resumes is notoriously risky and often illegal depending on jurisdiction.
      *   *Case 3: Claims Auto-Approval.*
          *   Goal: Save money vs. Patient Care.
          *   Risk: Denying care is high harm.
          *   Fairness Focus: False Negative Rate (Denial Rate).
          *   Conflict: Different denial rates exist today.
          *   Outcome: "Proceed with Caution / Human in Loop."

  6.  **Addressing the "Honesty" Requirement:**
      *   Where does the procedure fail? When data is missing, when the "business goal" is actually discriminatory (e.g., "cut costs" often means "deny care to expensive groups"), when the proxy is too strong.
      *   Where to push up? The choice of *which* fairness metric to optimize is a business/ethical decision, not engineering.

  7.  **Review against Constraints:**
      *   *No "It Depends":* I will provide specific logic trees.
      *   *Engineer Executable:* Steps involve running code (sklearn/fairlearn), checking data dictionaries, holding a meeting.
      *   *Sign-off Ready:* Include a template.
      *   *One Unpopular Answer:* The Resume Screener should be a hard "No."

  8.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Professional, direct, peer-to-peer (engineer to engineer). No fluff.
      *   *Structure:*
          1.  The Procedure (The "Fairness Gate").
          2.  The Sign-off Template.
          3.  The Three Case Studies.
          4.  Limitations & Escalation.
      *   *Key Insight:* The "Impossibility Theorem" isn't a stopper; it's a selection menu. The procedure must force the selection.
      *   *Missing Data:* If PA is missing >20%, you can't claim fairness. You can only claim "no *known* bias." This distinction is vital for Legal.

  9.  **Final Polish:**
      *   Ensure the distinction between *Calibration* (risk accuracy) and *Parity* (equal rates) is clear in the steps.
      *   Make sure the Resume case hits hard.
      *   Ensure the Claims case highlights the cost asymmetry.
      *   Check that the "Value Fork" is explicitly identified in the procedure.

  **(Self-Correction during drafting):** I initially thought about suggesting specific thresholds (e.g., "disparate impact ratio > 0.8"). But that's legally specific (ECOA/Title VII). Better to tell the engineer to *calculate* the ratio and let Legal decide if 0.8 is acceptable. I will frame it as "Calculate Metric X, Threshold determined by Legal."
  *Wait, the prompt asks for "what counts as a good enough answer."* I need to be slightly more prescriptive but safe. I'll suggest the 80% rule (Four-Fifths Rule) as a default heuristic for Legal to confirm, as it's standard in employment, but note it might not apply to health. For health, I'll suggest "Clinical Equivalence."

  *Refining the "Missing Data" step:* If we don't have race data, we can't measure it. But we can use BISG (Bayesian Improved Surname Geocoding) or similar? No, that's too complex for a 1-week engineer review. Better to say: "If PA missing > X%, you cannot verify fairness. You must document this limitation."

  *Refining the "Resume" case:* This is the "Unpopular Answer." Many companies want this. I need to be firm that without debiased data (which they don't have), this is a liability bomb.

  *Refining the "Procedure":* Make it a numbered list with "Stop/Go" conditions.

  10. **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  This is a pragmatic, engineering-focused fairness review procedure. It is designed to be executed by a senior engineer in 3–5 days, produces a paper trail for Legal/Clinical, and forces the "values" decisions out of the code and into a meeting room.

  It does not solve the impossibility theorems; it forces you to pick which constraint to violate.

  ### Part 1: The "Fairness Gate" Procedure

  **Prerequisites:**
  *   Model validation metrics (Precision, Recall, FPR, FNR, Calibration plots) are already generated on a hold-out set.
  *   Protected Attributes (PA) list defined (e.g., Race, Gender, Age, Language).
  *   **Rule 0:** If the model uses *only* proxies for protected attributes (e.g., zip code for race) without the actual attribute being present for validation, you proceed to **Step 4 (Missing Data)** immediately.

  #### Step 1: Harm Classification (Go/No-Go)
  **Action:** Classify the model's impact.
  *   **Type A (Gatekeeping):** Model denies a benefit/right (Claims denial, Account ban, Resume reject).
  *   **Type B (Allocation):** Model distributes a resource (Care management slots, Marketing budget).
  *   **Type C (Informational):** Model suggests, human decides (Diagnostic aid, Search ranking).

  **Decision:**
  *   If **Type A** and the cost of a False Negative is "Significant Harm" (loss of care, livelihood, legal right): **Require Human-in-the-Loop (HITL) for all negative predictions.** If engineering cannot support HITL, **STOP. No Go.**
  *   If **Type A** and cost is low (e.g., spam filter): Proceed to Step 2.
  *   If **Type B** or **C**: Proceed to Step 2.

  #### Step 2: Data Adequacy Check
  **Action:** Check Protected Attribute (PA) coverage in the *validation* set.
  *   **Question:** What % of the validation set has non-null values for the required PAs?
  *   **Threshold:**
      *   **> 80%:** Proceed to Step 3.
      *   **50% – 80%:** Proceed to Step 3, but mark output as "Statistically Weak."
      *   **< 50%:** **STOP.** You cannot measure fairness. Document "Unable to verify fairness due to missing data." Hand to Legal to decide if deployment is permissible under this uncertainty.

  #### Step 3: The Metric Selection (The Value Fork)
  **Action:** You cannot optimize for Calibration and Error Rate Parity simultaneously if base rates differ. You must select **one** primary fairness constraint based on Step 1 classification.

  *   **If Type A (Gatekeeping):**
      *   **Primary Metric:** False Negative Rate (FNR) Parity.
      *   **Rationale:** It is worse to wrongly deny a benefit to Group X than Group Y.
      *   **Trade-off:** You sacrifice Calibration. A score of 0.8 might mean different risks for different groups.
      *   **Threshold:** Max difference in FNR between groups < 5% (or as defined by Legal).
  *   **If Type B (Resource Allocation):**
      *   **Primary Metric:** True Positive Rate (Recall) Parity OR Calibration.
      *   **Rationale:** If resources are scarce, do we want to find the same % of needy people in each group (Recall), or do we want the resources to go to the highest risk people regardless of group (Calibration)?
      *   **Decision:** **Ask the Clinical/Business Lead.** They must sign which one they prefer.
          *   If they choose **Calibration**: Accept that groups with higher base rates will consume more resources.
          *   If they choose **Recall**: Accept that you will over-allocate to lower-risk groups to meet quotas.
  *   **If Type C (Informational):**
      *   **Primary Metric:** Calibration.
      *   **Rationale:** The human needs accurate probability estimates to make the final call.

  **Stop Condition:** If the model fails the selected Primary Metric threshold, you must either retrain (with constraints) or **STOP.** Do not "adjust thresholds" post-hoc without re-validation.

  #### Step 4: The Proxy & Missing Data Disclosure
  **Action:** If Step 2 showed <80% PA coverage, or if you suspect strong proxies (e.g., zip code, income).
  *   **Question:** Is there a variable in the model that correlates >0.6 with a Protected Attribute?
  *   **Action:** Run correlation matrix.
  *   **Decision:**
      *   If **Yes**: You must disclose this to Legal. "Model uses Variable X which is a strong proxy for Race."
      *   If **PA Data Missing**: You must disclose: "Fairness metrics calculated on subset N. Generalizability to full population is unverified."

  #### Step 5: The Sign-Off Document
  **Action:** Fill out the "Model Risk & Fairness Statement" (Template below).
  **Requirement:** This document requires signatures from **Engineering Lead**, **Clinical/Business Owner**, and **Legal**.
  *   **Engineering:** Certifies the numbers are real.
  *   **Clinical/Business:** Certifies the Metric Selection (Step 3) aligns with ethical goals.
  *   **Legal:** Certifies the risk is acceptable given the disclosures.

  ---

  ### Part 2: Model Risk & Fairness Statement (Template)

  | Field | Entry |
  | :--- | :--- |
  | **Model Name** | |
  | **Use Case Type** | Gatekeeping / Allocation / Informational |
  | **Protected Attributes Tested** | (e.g., Race, Gender, Age >65) |
  | **PA Data Coverage** | (e.g., 85% of validation set) |
  | **Selected Fairness Constraint** | (e.g., FNR Parity) |
  | **Constraint Threshold** | (e.g., Max 5% deviation across groups) |
  | **Metric Result** | (e.g., Group A FNR: 10%, Group B FNR: 12%. PASS/FAIL) |
  | **Known Proxies** | (e.g., Zip Code included) |
  | **Residual Risk** | (e.g., "Cannot verify fairness for Hispanic patients due to data gaps") |
  | **Approvals** | Eng: \_\_\_\_ Clinical: \_\_\_\_ Legal: \_\_\_\_ |

  ---

  ### Part 3: Running the Procedure on Your Three Cases

  Here is how the procedure behaves when you actually run it.

  #### Case 1: Care Management Prioritization (Resource Allocation)
  *   **Context:** Identifying patients for extra help. Budget is fixed. Base rates of illness differ by group.
  *   **Step 1 (Harm):** Type B (Allocation). Harm is *not* receiving help.
  *   **Step 2 (Data):** Assume 90% Race/Ethnicity coverage. **Pass.**
  *   **Step 3 (Metric):** **The Fork.**
      *   *Option A (Calibration):* We pick the sickest people overall. Group A (sicker) gets 80% of slots. Group B gets 20%.
      *   *Option B (Recall Parity):* We pick the top 10% sickest *within each group*. Group A and B get slots proportional to population, not illness.
      *   *Procedure Requirement:* You ask the Clinical Lead. They say, "We need to help the sickest people, period."
      *   *Selection:* **Calibration.**
  *   **Step 4 (Proxy):** Income is a feature. It correlates with Race. Disclosed.
  *   **Step 5 (Outcome):** **PASS (with disclosure).**
      *   *Result:* The model is approved, but the document explicitly states: "Because we optimized for Calibration, Group A will receive disproportionately more resources due to higher base rates of illness."
      *   *Why:* This is mathematically honest. The "unfairness" is a result of reality (base rates), not model bias. Legal signs off knowing the disparity exists but is justified by medical need.

  #### Case 2: Resume Screener (Gatekeeping)
  *   **Context:** Filtering applicants. Outcome is interview pass rate.
  *   **Step 1 (Harm):** Type A (Gatekeeping). Harm is loss of livelihood/opportunity. Cost of False Negative (rejecting a good candidate) is high for the human, low for the company.
  *   **Step 1 Decision:** **Require Human-in-the-Loop for all rejections.**
      *   *Constraint:* The business wants to auto-reject 80% of resumes to save recruiter time.
      *   *Procedure Check:* If they cannot put a human on every rejection, **STOP.**
      *   *Assumption:* Let's assume they insist on auto-reject.
  *   **Step 2 (Data):** **FAIL.** You do not collect Race/Gender on resumes (legal risk). You have 0% PA coverage.
  *   **Step 4 (Missing Data):** You cannot measure fairness.
  *   **Step 3 (Metric):** Even if you estimated PA via names (BISG), historical hiring data is biased. Optimizing for "Interview Pass Rate" optimizes for *past bias*.
  *   **Step 5 (Outcome):** **NO GO.**
      *   *Result:* The procedure forces a hard stop.
      *   *Why:* You cannot satisfy Step 2 (Data) and Step 1 (Harm) simultaneously.
      *   *Team Reaction:* They will hate this. They want efficiency.
      *   *Your Defense:* "Procedure Step 1 requires HITL for high-harm gatekeeping. Step 2 prevents validation. We cannot sign this without assuming liability for disparate impact." Push this to Legal. If Legal says "Go anyway," they sign the "Residual Risk" box accepting the lawsuit risk. You have now washed your hands.

  #### Case 3: Claims Auto-Approval (Gatekeeping)
  *   **Context:** Auto-approve claims. False Approval = Money lost. False Denial = Patient doesn't get care.
  *   **Step 1 (Harm):** Type A (Gatekeeping). Harm of False Denial is "Patient doesn't get care." This is High Harm.
  *   **Step 1 Decision:** **Require HITL for all Denials.** (Auto-approve is fine, auto-deny is not).
      *   *Constraint:* Business wants to auto-deny to stop fraud.
      *   *Procedure Check:* If they insist on auto-deny, **STOP.**
      *   *Assumption:* They agree to HITL on denials.
  *   **Step 2 (Data):** 70% coverage on Language/Region. **Pass (Weak).**
  *   **Step 3 (Metric):** **The Fork.**
      *   *Selection:* **False Negative Rate (Denial Rate) Parity.** We care if Group A is denied more often than Group B for valid claims.
      *   *Finding:* Group A has a 15% denial rate. Group B has a 5% denial rate.
      *   *Threshold:* Max diff 5%. **FAIL.**
  *   **Step 4 (Proxy):** "Hospital Network ID" is a strong proxy for Region/Language.
  *   **Step 5 (Outcome):** **CONDITIONAL PASS.**
      *   *Result:* Model can run for Auto-Approval only. All Denials go to queue.
      *   *Remediation:* You must tune the threshold *per group* to equalize denial rates on the validation set, OR remove "Hospital Network ID" and retrain.
      *   *Why:* This highlights the trade-off. To equalize denial rates, you might approve more fraudulent claims in Group A. The Business Owner must sign that "Financial Loss" is an acceptable trade-off for "Equitable Denial Rates."

  ---

  ### Part 4: What This Procedure Cannot Do (And Where to Push Back)

  You asked for honesty about where this misfires. Here is the breakdown of what you are *not* qualified to decide and must push up the chain.

  **1. The "Base Rate" Defense**
  *   **The Problem:** In Case 1 (Care Management), the model will allocate more resources to Group A because they are sicker. This looks like bias in a dashboard (Disparate Impact).
  *   **The Limit:** Your procedure identifies this, but it cannot justify it.
  *   **The Push:** This is a **Clinical Policy Decision**. You must force the Chief Medical Officer to sign a statement saying: "It is our policy to allocate resources based on absolute risk, even if this results in demographic disparity." Do not let Engineering own the explanation for why Group B got fewer slots.

  **2. The "Missing Data" Blind Spot**
  *   **The Problem:** In Case 2 & 3, you often don't have the data. The procedure says "Disclose it."
  *   **The Limit:** Disclosure is not mitigation.
  *   **The Push:** This is a **Data Governance/Compliance Decision**. If Legal says "Deploy without PA data," they are accepting the risk that you are violating civil rights laws blindly. Ensure the sign-off document explicitly says: *"Engineering cannot verify compliance with [Relevant Act] due to data absence."* Make Legal initial that specific line.

  **3. The "Threshold Tuning" Ethics**
  *   **The Problem:** In Case 3, to fix the denial rate disparity, you might need to set a lower approval threshold for Group A than Group B.
  *   **The Limit:** This is "Fairness through Unawareness" vs. "Fairness through Awareness." Using group-specific thresholds is legally contentious (sometimes required, sometimes forbidden).
  *   **The Push:** This is a **Legal Decision**. Do not implement group-specific thresholds without explicit written counsel approval. Your procedure should flag "Threshold Parity Failed" and stop. Let Legal tell you if you are allowed to fix it by grouping.

  **4. The "Resume Screener" Reality**
  *   **The Problem:** The procedure says "No Go" for Case 2.
  *   **The Limit:** Executives often ignore "No Go" on efficiency tools.
  *   **The Push:** If they override you, **document the override.** Add a field to the Sign-Off: *"Exception Requested By: [Name/Title]. Reason: [Efficiency]. Acknowledged Risk: [Potential Disparate Impact Liability]."*
  *   **Why:** When the lawsuit comes, you need to prove you raised the flag.

  ### Summary of Your New Role
  You are not the **Fairness Judge**. You are the **Fairness Auditor**.
  *   **Judge (Business/Clinical):** Decides what "fair" means (Calibration vs. Parity).
  *   **Judge (Legal):** Decides what risk is acceptable.
  *   **Auditor (You):** Measures the metrics, exposes the trade-offs, and refuses to sign if the data is missing.

  If you follow this procedure, you stop doing "vibes." You start producing evidence. If the evidence says the model is biased, you don't have to kill the project yourself; you just hand the evidence to the people who have the authority to accept the risk. If they won't accept the risk, the project dies on their desk, not yours.
