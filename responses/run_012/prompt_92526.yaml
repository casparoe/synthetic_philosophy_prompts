      *   **R's Defense:** Public reason isn't about *motivation*; it's about *justification*. Legitimacy requires reciprocity. The "cost" to secular citizens is that they *also* cannot rest on their deepest comprehensive truths (e.g., a Kantian can't say "because autonomy is the categorical imperative" as the final word; they must say "because this supports basic liberties").
