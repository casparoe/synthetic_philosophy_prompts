answer: |-
  **Exam Question**

  **Question 2**

  The Lottery Paradox and the Preface Paradox are often presented as variations of the same problem regarding the relationship between high probability and rational belief. However, consider the following distinction: in the Lottery case, belief is based purely on statistical odds without specific evidence for any individual ticket; in the Preface case, the author has specific evidence for each individual claim, despite knowing errors likely exist in the bulk.

  (a) Identify the two primary assumptions regarding belief and justification that generate the contradiction in these paradoxes. State clearly which assumption you would reject to resolve the Lottery Paradox, and justify why that same rejection does or does not resolve the Preface Paradox.

  (b) Consider an 'Unfair Lottery' with 1,000 tickets: one ticket has a 90% chance of winning, while the remaining 999 tickets share the remaining 10% probability equally. Does this variation suggest the original paradox relies on symmetry and lack of specific evidence rather than high probability alone? Take a definite position.

  (c) If a rational agent is permitted to hold a set of beliefs that she acknowledges cannot all be true simultaneously, how should the norm of assertion be modified? Can she continue to assert her individual beliefs? Defend your answer.

  *(Suggested time: 40 minutes)*

  ***

  **Model Answer**

  The contradiction in both paradoxes arises from the tension between two plausible assumptions: the **Lockean Thesis** (it is rational to believe any proposition with sufficiently high probability) and the **Conjunction Principle** (if it is rational to believe $P$ and rational to believe $Q$, it is rational to believe $P$ and $Q$). In the Lottery, accepting both leads to believing every ticket will lose, and thus believing no ticket will win, which contradicts the setup that one must win.

  To resolve the Lottery Paradox, we should reject the Lockean Thesis in cases relying solely on statistical probability. High probability alone is insufficient for belief when the evidence is purely statistical and symmetric. We do not believe Ticket 1 will lose because we have no evidence specific to Ticket 1; we only know about the structure of the lottery. This preserves the Conjunction Principle by blocking the initial entry of beliefs based on bare odds.

  However, this escape does not transfer to the Preface Paradox. In the Preface case, the author possesses specific, non-statistical evidence for each claim (e.g., experimental data, logical derivation). Each claim meets a standard of justification far exceeding mere statistical likelihood. Rejecting the Lockean Thesis here would require skepticism about empirical science itself. Therefore, we must accept that the Preface Paradox is a distinct problem. In the Preface case, we should instead relax the Conjunction Principle. It is rational to believe each claim individually based on its specific evidence, even if it is also rational to believe (based on inductive experience of human fallibility) that the conjunction of all claims is false. The rationality of belief is local to the specific evidence, not global to the set.

  Regarding the Unfair Lottery, this variation decisively shows that symmetry and the absence of specific evidence are the drivers of the paradox, not high probability alone. In the unfair scenario, the 999 long-shot tickets have an even higher probability of losing than in the fair lottery (approx. 99.99% vs 99.9%). If high probability were the sole trigger, the paradox should intensify. Yet, intuitively, the paradox fizzles. This is because the symmetry is broken. The existence of a "favourite" ticket alters the epistemic context; we can no longer say of any arbitrary ticket that "it is just like the others." While we still lack specific evidence for the long-shots, the structural asymmetry makes the uniform application of belief feel less compelled. This supports the view that the Lottery Paradox is an artifact of indistinguishable statistical scenarios, whereas the Preface involves distinguishable, evidence-backed claims.

  Finally, regarding the norm of assertion: if we accept that a rational agent holds inconsistent beliefs (as in the Preface), the norm of assertion must shift from global consistency to local justification. The standard rule is "Assert only what you believe." If belief is permitted to be locally justified but globally inconsistent, assertion remains permissible provided the specific assertion meets the threshold of justification. The author can assert Claim 1 because she has specific evidence for Claim 1, even if she believes the set $\{Claim 1... Claim n\}$ contains an error. To demand global consistency before assertion would paralyze scientific discourse. Therefore, assertion is governed by the standards appropriate to the specific context of the claim, not by the logical properties of the agent's entire belief set. We must accept that rational assertion does not guarantee truth, nor does it require the impossibility of error elsewhere in the system.

  ***

  **Marking Scheme**

  **Total: 20 Marks**

  **1. Identification and Selection of Assumptions (4 Marks)**
  *   **4:** Clearly identifies Lockean Thesis (high prob = belief) and Conjunction Principle. Explicitly chooses one to reject for the Lottery and justifies the choice.
  *   **2:** Identifies assumptions but fails to commit to rejecting one, or justifies the choice poorly.
  *   **0:** Vague description of "logic" or "probability" without identifying the specific normative principles.
  *   *Common Miss:* Listing assumptions without selecting one to discard for the specific case.

  **2. Distinction Between Lottery and Preface (4 Marks)**
  *   **4:** Clearly argues that the Lottery solution (rejecting statistical belief) fails for the Preface due to the presence of specific evidence.
  *   **2:** Notes a difference between the cases but fails to explain why the solution doesn't transfer.
  *   **0:** Treats the paradoxes as identical problems with identical solutions.
  *   *Common Miss:* Claiming the Preface is just a "bigger Lottery" without addressing the evidence distinction.

  **3. Analysis of the Unfair Lottery (4 Marks)**
  *   **4:** Takes a definite position (Yes/No) on whether symmetry/evidence is key. Argues that higher probability + broken symmetry = dissolved paradox.
  *   **2:** Discusses the probabilities but hedges on the philosophical implication (symmetry vs. probability).
  *   **0:** Calculates probabilities correctly but draws no philosophical conclusion.
  *   *Common Miss:* Focusing only on the math without linking it to the "specific evidence" condition.

  **4. Verdict on Transferability (4 Marks)**
  *   **4:** Concludes the problems are separate. Argues that Preface requires accepting inconsistent beliefs or dropping Conjunction, unlike Lottery.
  *   **2:** Concludes they are separate but provides weak reasoning for the different treatment.
  *   **0:** Insists the same solution must apply to both despite the evidence distinction.
  *   *Common Miss:* Fence-sitting; claiming "it depends on the theory of knowledge" without taking a stance.

  **5. Norm of Assertion (4 Marks)**
  *   **4:** Defends a modified norm (local justification) allowing assertion despite global inconsistency. Explains why paralysis is avoided.
  *   **2:** Suggests assertion is allowed but fails to explain how this reconciles with holding known falsehoods.
  *   **0:** Claims assertion is impossible if beliefs are inconsistent.
  *   *Common Miss:* Name-dropping philosophers (e.g., "Williamson says...") without explaining the actual argument.

  **General Note:** No marks are awarded for naming philosophers (e.g., Kyburg, Smith) unless the view associated with them is fully explained. Top band (18-20) requires a committed argument on the asymmetry and assertion, not a survey of options.
