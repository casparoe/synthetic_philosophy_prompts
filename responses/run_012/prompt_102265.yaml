  1. The diagnosis in brief
  This is a verbal dispute masking a substantive disagreement about functional sufficiency. Both sides agree on the system's behavior but disagree on whether behavioral competence constitutes understanding or merely simulates it. The impasse persists because 'understanding' is being used as a placeholder for distinct criteria: internal causal history versus external performance. Progress requires abandoning the binary label in favor of mapping specific cognitive capacities to architectural features, rather than arguing over the extension of a folk-psychological term.

  2. The impasse, restated
  The skeptics argue that statistical mapping lacks semantic grounding; the system manipulates symbols without knowing their referents. The opponents argue that grounding is an unnecessary metaphysical posit; if the system behaves as if it knows referents, it knows them. The impasse is rigid because neither side can force the other to accept their foundational premise. Skeptics would concede only if shown that internal causal history is irrelevant to meaning, which contradicts their intuition about intentionality. Opponents would concede only if shown that perfect behavioral competence is possible without understanding, which contradicts their functionalist definition. Consequently, they talk past each other: one describes architecture, the other describes output. To move, one side must demonstrate a behavioral failure inherent to the architecture that cannot be patched, or prove that internal states are empirically detectable and necessary for the label. Currently, both accept the phenomena but disagree on the ontology of the process.

  3. What each side is actually committed to
  **Skeptics** are committed to the claim that causal history and internal representation matter for the attribution of mental states. They must accept that MT systems are useful tools but deny these tools possess intentionality or semantic grasp. They need not claim humans are non-physical, only that human biology provides grounding statistics lack. Their vulnerability lies in the "black box" problem: if human neural processes are also opaque signal transformations, their distinction collapses into dualism or speciesism. They risk retreating to an indefinable "spark" whenever behavioral gaps close, making their position unfalsifiable. They must explain why human statistical learning counts as grounding but machine statistical learning does not. They effectively argue that syntax manipulation is insufficient for semantics, echoing the Chinese Room argument without relying on its specific intuition pump.

  **Opponents** are committed to functionalism: understanding is defined by input-output relations across possible worlds, not internal substrate. They must accept that if a machine passes all behavioral tests, it understands. They need not claim the architecture is identical to humans, only functionally equivalent. Their vulnerability is systematic brittleness. If the system fails on novel idioms (Case i) or context (Case ii) in ways humans do not, this suggests the function is not truly equivalent, only approximated. They risk redefining "understanding" down to "pattern matching" so thoroughly that the term loses explanatory power regarding cognitive depth. They effectively argue that the Turing Test criterion is sufficient, prioritizing external validation over internal transparency.

  Both sides accept the empirical data of translation quality. The skeptics focus on the *how* (mechanism), while opponents focus on the *what* (performance). The skeptics are vulnerable to charges of mysticism; the opponents to charges of superficiality. Neither can prove their criterion is the *correct* one without begging the question. The skeptics require a theory of grounding that isn't magical; the opponents require a test that distinguishes simulation from reality without invoking the very internal states they dismiss. This mutual vulnerability sustains the stalemate.

  4. Diagnosis
  Your hypothesis is substantially correct but understates the stakes. This is a verbal dispute in the philosophical sense—both sides agree on the non-verbal facts (the system's architecture and output) but disagree on the application of the label 'understanding.' However, it is not merely semantic pedantry; it is a conflict over which concept serves better predictive and explanatory purposes. The skeptics treat 'understanding' as a natural kind requiring specific causal mechanisms (grounding). The opponents treat it as a functional role defined by capacity. The dispute persists because 'understanding' is a folk-psychological term being stretched to cover non-human agents, lacking a precise technical definition.

  The sentence-versus-discourse distinction offered by your colleague is crucial. It suggests understanding is gradable, not binary. If a system passes local tests (sentence level) but fails global tests (discourse level), it possesses partial understanding. This undermines the skeptics' all-or-nothing stance while validating their intuition that something is missing. It reveals the dispute is actually about *degree* and *architecture*, masked as a binary ontological question. The distinction does real work by shifting the debate from "does it understand?" to "what scope of context does it model?" It allows the opponents to claim local success without conceding global competence, while allowing skeptics to pinpoint exactly where the "grasp" fails.

  The two cases illuminate the structural weakness in the opponents' functionalism. Case (i), the memorized idiom, reveals that behavioral success can arise from brittle associations rather than compositional semantics. If the system fails on novel variations, it lacks the generative capacity humans possess. Case (ii), the context-dependent translation, shows the system lacks a persistent world model. Humans resolve ambiguity by tracking the situation; the system tracks token co-occurrence. These cases suggest the functional profile is not actually identical to humans, despite surface similarity.

