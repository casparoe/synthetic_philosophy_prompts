  5. What would count as progress
  Progress requires abandoning the binary question "Does it understand?" in favor of specific capacity claims. The group should adopt a taxonomy of understanding capacities (e.g., lexical disambiguation, coreference resolution, pragmatic inference) and test systems against each. This moves the debate from metaphysics to engineering benchmarks.

