  Ultimately, the question must change from "Is this understanding?" to "Is this system reliable for task X?" The word 'understanding' carries too much baggage. If the group agrees to treat 'understanding' as a shorthand for "possesses a world model sufficient for context-dependent inference," the dispute becomes empirical. They must define what counts as a world model. If nothing moves, it is because the term serves a social function—signaling caution versus enthusiasm—rather than a descriptive one. In that case, the impasse is feature, not bug, reflecting differing risk tolerances regarding AI deployment. The group should focus on the *consequences* of attributing understanding: does it lead to over-trust? If so, the skeptics' usage is pragmatically superior regardless of metaphysical truth.

