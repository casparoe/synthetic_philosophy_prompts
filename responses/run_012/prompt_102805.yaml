  # Taxonomy of Standing to Blame

  This taxonomy maps the logical space of standing without presupposing specific theoretical camps. It proceeds from the normative force of standing to the granularity of its loss, the scope of that loss, the conditions that trigger it, and finally the possibility of recovery.

  ### The Tree Structure

  **1. Root: Normative Force**
  *Does lacking standing make an act of blame morally **impermissible** (a wrong done to the blamee), or merely **defective** (unfitting, ineffective, or rude, but not wrong)?*
  *   **Branch A:** Impermissible (Deontic)
  *   **Branch B:** Defective (Aretaic/Pragmatic)

  **2. Branch A (Impermissible): Granularity**
  *Does a blamer possess standing in an **all-or-nothing** fashion, or can they possess it **by degrees**?*
  *   **Branch A1:** Binary (All-or-nothing)
  *   **Branch A2:** Scalar (By degrees) → *Leads to Leaf 1*

  **3. Branch A1 (Binary): Scope of Loss**
  *When standing is lost, is the blamer barred from **this specific utterance** (Token), or from blaming on **this norm generally** (Type)?*
  *   **Branch A1a:** Token Loss
  *   **Branch A1b:** Type Loss

  **4. Branch A1a & A1b: Source of Loss**
  *Is standing lost solely due to **behavioral inconsistency** (hypocrisy/reciprocity), or does it require **relational complicity** (business/stake in the specific wrong)?*
  *   **Branch A1x:** Inconsistency (e.g., Ex-smoker)
  *   **Branch A1y:** Complicity (e.g., PhD Student, State)

  **5. Branch A1x & A1y: Recoverability**
  *Can standing be **restored** through reform, apology, or submitting to blame, or is the taint **permanent** for the relevant scope?*
  *   **Branch A1z:** Recoverable
  *   **Branch A1w:** Permanent → *Leads to Leaves 2–9*

  **6. Branch B (Defective): Locus of Defect**
  *Is the defect located in the **reactive attitude** itself (the emotion is unfitting), or in the **address** (the speech act is useless or rude)?*
  *   **Branch B1:** Attitude (Emotion)
  *   **Branch B2:** Address (Speech) → *Leads to Leaves 10–12*

  **7. Branch B1: Corruption**
  *Does hypocrisy/complicity **corrupt the emotion** (making resentment inapt), or is the **emotion preserved** (making only the expression defective)?*
  *   **Branch B1a:** Corrupts
  *   **Branch B1b:** Preserved → *Leads to Leaves 10–11*

  **8. Branch B2: Grounds**
  *Is the address criticisable primarily for **inconsistency** (hypocrisy), or for **meddling** (lack of business/complicity)?*
  *   **Branch B2a:** Inconsistency
  *   **Branch B2b:** Meddling → *Leaves 12*

  ---

  ### The Leaves (Positions)

  **Leaf 1: Scalar Authority**
  *   **Path:** Impermissible → Scalar.
  *   **Position Name:** Proportional Standing.
  *   **Most Awkward Commitment:** A blamer can be morally forbidden to issue 60% of a reproach but permitted to issue the remaining 40%.
  *   **Status:** *Coherent but Unoccupied.* Most find the notion of "partial impermissibility" incoherent; usually, scalar views collapse into a threshold binary view.

  **Leaf 2: Token Inconsistency (Recoverable)**
  *   **Path:** Impermissible → Binary → Token → Inconsistency → Recoverable.
  *   **Position Name:** The Penitent Hypocrite.
  *   **Most Awkward Commitment:** The ex-smoker cannot reproach his brother at dinner tonight, but if he apologizes for his past smoking, he may do so tomorrow.
  *   **Case Fit:** Ex-smoker reproaching brother.

  **Leaf 3: Token Inconsistency (Permanent)**
  *   **Path:** Impermissible → Binary → Token → Inconsistency → Permanent.
  *   **Position Name:** The Stained Token.
  *   **Most Awkward Commitment:** Once you have violated a norm in the presence of the blamee, you are permanently barred from blaming them for that specific instance, even if you reform.
  *   **Status:** *Unattractive.* Rarely defended because it makes standing too fragile for ongoing relationships.

  **Leaf 4: Token Complicity (Recoverable)**
  *   **Path:** Impermissible → Binary → Token → Complicity → Recoverable.
  *   **Position Name:** The Reformed Accomplice.
  *   **Most Awkward Commitment:** A person can blame their own earlier self for a past wrong only if they have formally submitted to blame for it in the interim.
  *   **Case Fit:** Someone blaming their own earlier self.

  **Leaf 5: Token Complicity (Permanent)**
  *   **Path:** Impermissible → Binary → Token → Complicity → Permanent.
  *   **Position Name:** The Traitor's Silence.
  *   **Most Awkward Commitment:** If you benefited from a specific wrong, you are forever barred from blaming the co-beneficiaries for that specific act, regardless of your current stance.
  *   **Case Fit:** Privileged group member reproaching another for a shared remark.

  **Leaf 6: Type Inconsistency (Recoverable)**
  *   **Path:** Impermissible → Binary → Type → Inconsistency → Recoverable.
  *   **Position Name:** The Reformed Sinner.
  *   **Most Awkward Commitment:** A state that lectured another on minority treatment while doing the same at home regains the right to lecture once it reforms its own domestic policy.
  *   **Case Fit:** State lecturing another on minority treatment.

  **Leaf 7: Type Inconsistency (Permanent)**
  *   **Path:** Impermissible → Binary → Type → Inconsistency → Permanent.
  *   **Position Name:** The Original Sin View.
  *   **Most Awkward Commitment:** Having ever violated a norm yourself removes your authority to hold anyone to that norm forever, even after reform.
  *   **Status:** *Empty.* Generally rejected as too demanding; implies moral address is impossible for non-saints.

  **Leaf 8: Type Complicity (Recoverable)**
  *   **Path:** Impermissible → Binary → Type → Complicity → Recoverable.
  *   **Position Name:** The Clean Hands Doctrine.
  *   **Most Awkward Commitment:** A doctoral student funded by industry can blame her supervisor for taking industry money only if she first divests her own funding.
  *   **Case Fit:** Doctoral student reproaching supervisor.

  **Leaf 9: Type Complicity (Permanent)**
  *   **Path:** Impermissible → Binary → Type → Complicity → Permanent.
  *   **Position Name:** The Complicit Silence.
  *   **Most Awkward Commitment:** If you are structurally complicit in a systemic wrong, you lack the standing to blame others for participating in that system, ever.
  *   **Status:** *Coherent but Radical.* Implies marginalized or embedded agents cannot speak against systemic ills.

  **Leaf 10: Corrupted Attitude**
  *   **Path:** Defective → Attitude → Corrupts.
  *   **Position Name:** The Hypocrite's Emotion.
  *   **Most Awkward Commitment:** The hypocrite does not merely lack the right to speak; their resentment is itself an unfitting emotional response to the wrong.
  *   **Status:** *Indistinguishable from Leaf 7.* If the emotion is unfitting, expressing it is arguably impermissible, collapsing this view into the Impermissible branch.

  **Leaf 11: Preserved Attitude**
  *   **Path:** Defective → Attitude → Preserved.
  *   **Position Name:** The Stoic Blamer.
  *   **Most Awkward Commitment:** The hypocrite feels resentment aptly, but expressing it is defective because the emotion is not "for" public address.
  *   **Status:** *Unexplored.* Few separate the aptness of the private emotion from the norms of public address so sharply.

  **Leaf 12: Pragmatic Meddling**
  *   **Path:** Defective → Address → Meddling.
  *   **Position Name:** The Busybody Constraint.
  *   **Most Awkward Commitment:** The complicit blamer's reproach is morally permissible but criticisable as useless, like giving advice one cannot follow oneself.
  *   **Case Fit:** PhD Student / Privileged Group (on the "meddling" reading).

  ---

  ### Notes on Logical Space

  *   **Indistinguishable Pair:** **Leaf 10 (Corrupted Attitude)** and **Leaf 7 (Type Inconsistency Permanent)** are functionally equivalent in practice. If the reactive attitude is unfitting, acting on it is arguably impermissible, not merely defective. The distinction rests on whether one locates the defect in the *psychology* or the *normative relation*.
  *   **Empty Space:** **Leaf 7 (Type Inconsistency Permanent)** is logically coherent but normatively unattractive. It entails that moral community is impossible among fallible agents. It is occupied only by skeptical positions that deny the possibility of standing altogether.
  *   **Unexplored Coherence:** **Leaf 1 (Scalar Authority)** is rarely defended as a deontic view. While standing feels scalar (we say "you have *little* standing"), translating this into "partial impermissibility" is theoretically difficult. Most scalar views retreat to Leaf 12 (Pragmatic Meddling) to avoid the deontic problem.
