  The phenomenon you are describing is real, named, and central to contemporary debates in political science and legal theory. The established term that best captures the *normative* failure you are sensing is **Institutional Corruption**. However, the specific *mechanism* of influence you are observing—the power exercised through silence, procedure, and agenda control—is technically known in political science as **Non-Decision Making** (or **The Second Face of Power**).

  Because your argument with your friend is fundamentally about whether this counts as *corruption* (given the absence of bribery), **Institutional Corruption** is the more vital term for your purpose. It was coined (most notably by Lawrence Lessig and the Edmond J. Safra Foundation) specifically to describe a systemic condition where an institution's dependence on external support (like money or status) undermines its proper functioning, without requiring a *quid pro quo*.

  Here is the carving you requested, distinguishing this concept from the three alternatives you listed.

  ### 1. Distinction from Bribery (*Quid Pro Quo*)
  *   **Bribery:** Requires a specific intent to trade a specific act for a specific benefit. The evidence is a transaction (the "smoking gun").
  *   **Institutional Corruption:** Requires no explicit agreement. The evidence is a *dependence*. The influence works through anticipation and alignment rather than instruction. In your first case, the subcommittee chair does not need to be told to kill the landlord's item; they merely need to know the landlord is a donor to prioritize "busyness" over that specific item. The causal link is not a phone call; it is a shared understanding of priority.
  *   **The Difference:** Bribery is an *event*; Institutional Corruption is an *environment*. Your friend demands proof of an event; you are describing an environment.

  ### 2. Distinction from Pluralism (Organized Groups Out-Argue)
  *   **Pluralism:** Assumes a neutral arena where groups compete on the merits of their arguments or the strength of their mobilization. If a well-organized group wins, it is because they made a better case or mobilized more voters.
  *   **Institutional Corruption:** Recognizes that the arena itself is tilted by access. In your second case, the "Thursday at noon" rule is neutral on its face, but its weaponization relies on *insider knowledge* and the *chair's goodwill*. This is not out-arguing; it is procedural exclusion. The influence is not applied to the *decision* (the vote), but to the *opportunity to decide*.
  *   **The Difference:** Pluralism is about *weight* in the balance; Institutional Corruption is about *who gets to put weights on the scale*.

  ### 3. Distinction from Regulatory Capture
  *   **Capture:** Occurs when an agency actively administers rules *for* the benefit of the industry it supervises (e.g., writing weak regulations, enforcing leniently). The agency is *working*, but for the wrong master.
  *   **Institutional Corruption:** Can manifest as *inertia*. In your third case, the commissioner recused himself (following the rule), but the *effect* was the removal of scrutiny. The agency isn't serving the developer; it is simply failing to serve the public because the one person motivated to scrutinize was removed by a rule that looks ethical but functions strategically.
  *   **The Difference:** Capture is *active service* to a special interest; Institutional Corruption includes *passive failure* of the public interest due to structural biases.

  ### Pushing on the Edges

  **Is it about outcomes or standing?**
  It is primarily about **standing** (or dependence), though it affects outcomes. Even if the inspection fee schedule *would* have died anyway (identical outcome), the fact that it died *because* of the donor relationship (or the perception thereof) undermines the institution's legitimacy. The corruption lies in the *dependence* of the process on external status, which erodes public trust. If the public believes the process is rigged by access rather than merit, the institution is corrupted regardless of the specific vote count.

  **Is it corruption or a different failure?**
  It is a kind of **corruption**, but not a criminal one. It is the decay of the institution's integrity. Traditional corruption is a rot in the *actor* (the official takes a bribe). Institutional corruption is a rot in the *system* (the rules allow money to buy access that mimics merit).

  **Is it a feature of the world or of your evidence?**
  It is a feature of the world. An observer with perfect information would not find a trade (because none occurred). They would find a **pattern of access**. They would see that donors get meetings, non-donors get forms; donors get "busy" schedules, non-donors get strict deadlines. The evidence is not a hidden act, but a visible *pattern of exclusion*. The demand for a "smoking gun" is structurally impossible to meet because the mechanism is the *absence* of a gun, not the firing of one.

  ### Boundary Cases

  If we treat **Institutional Corruption** as the term, here are two cases near its boundary:

  1.  **Case A:** A city council member votes against a zoning change because they genuinely believe it will harm traffic, but it just so happens that their spouse works for a competitor who benefits from the rejection.
      *   **Side:** This is **Conflict of Interest**, not necessarily Institutional Corruption. If the vote was genuine and the rule allows it, the institution's purpose (deliberation) is not undermined, even if the appearance is bad. It falls on the *outside* of Institutional Corruption unless the spouse's employment systematically dictates the member's voting pattern over time.
  2.  **Case B:** A planning commission creates a "fast-track" permit process for projects over $50 million to boost the tax base. Small developers cannot afford the upfront costs to use the fast track, so their projects stall in the regular queue.
      *   **Side:** This is **Institutional Corruption** (inside). The rule is neutral on its face (economic growth), but the *dependence* on large tax revenue structurally excludes small players from equal consideration, undermining the institution's role as an impartial arbiter of land use.

  \answer{Institutional Corruption}
