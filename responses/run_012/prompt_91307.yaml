      *   **Format:** Continuous prose, no headings, no bullet points, no bold text, no tables. British English. In the manner of a letter.

  2.  **Deconstruct the Strong Reading:**
      *   *Strict Containment:* Higher levels *must* have lower-level capacities.
      *   *Dominance:* Higher levels *should* replace lower levels when affordable.
      *   *Directionality:* Selection drives lineages *upward*.
      *   *Hierarchy:* It's a ladder, not just a taxonomy.

  3.  **Brainstorm Defeaters/Counter-evidence:**
      *   *Domain Specificity:* An organism is Popperian in hunting but Skinnerian in mating. This challenges the "grade" as a whole-organism property.
      *   *Regression:* Evolution sometimes simplifies (parasites, island dwarfism). A lineage loses Popperian capacities to become Skinnerian.
      *   *Cost/Benefit Mismatch:* A Popperian creature exists where a Skinnerian would suffice, but the cost was too high, yet it persists (or vice versa: a Skinnerian persists where Popperian was affordable and advantageous).
      *   *Gregorian Status:* If culture/tools are just external Popperianism, is it a new level? If a creature without culture can plan internally, is it Popperian? If a creature with culture cannot plan internally, is it Gregorian?
      *   *Concurrent Existence:* Lower levels persist alongside higher levels (bacteria still exist). The strong reading says selection drives upward *as far as it can afford*. This is compatible with niches, but if a higher level invades a lower level's niche and *fails* despite affordability, that's a problem.
      *   *Normative Overreach:* Assuming "higher is better" without empirical backing.

  4.  **Ranking Defeaters:**
      *   *Fatal:* Evidence that higher levels do *not* contain lower levels (e.g., a Popperian creature that cannot learn via operant conditioning). Evidence that selection drives *downward* even when costs are affordable (regressive evolution not tied to cost-saving).
