          The 'floor' reading makes better sense of the lexical claim. If the scale is continuous (cliff), the threshold is merely a point of extreme disutility, theoretically bridgeable by sufficient pleasure, contradicting the lexical constraint. Only a categorical break (floor) ensures that no amount of lower-value goods (pleasure) compensates for higher-value bads (extreme suffering). Thus, the floor reading preserves the lexical intuition that some pains are qualitatively different, not just quantitatively larger.
