  **Essay Question**

  Critically evaluate Lexical Threshold Negative Utilitarianism (LTNU). Distinguish between the 'floor' reading (incommensurability/category change) and the 'cliff' reading (infinite exchange rate on a single scale). Argue which reading makes better sense of the view and whether either can avoid arbitrariness regarding the threshold's location. Apply your chosen reading to a case where you must choose between preventing huge threshold-level suffering for one person or providing massive finite pleasure to many. Finally, address whether the view can still call itself 'negative utilitarian' if it requires a positive-value scale to determine compensation below the threshold.

  **Model Answer**

  Lexical Threshold Negative Utilitarianism (LTNU) asserts that suffering above a specific intensity cannot be outweighed by any amount of pleasure, though trade-offs are permissible below this limit. This requires distinguishing between 'floor' and 'cliff' readings. The 'cliff' reading posits a single cardinal scale where the marginal rate at which pleasure offsets pain approaches infinity at the threshold. The 'floor' reading suggests a category change: below the threshold, values are comparable; above it, pleasures do not enter the ranking at all.

  The 'floor' reading makes better sense of the lexical claim. The 'cliff' reading relies on a continuous scale, implying that sufficiently large quantities of pleasure could theoretically bridge any gap, contradicting the core lexical intuition that some pains are qualitatively incomparable to pleasures. Only the 'floor' reading secures the incommensurability required to block compensation entirely. However, this invites the arbitrariness objection. If suffering is a continuum, drawing a sharp line where commensurability stops seems unjustified. Why is pain level 99 lexical while 98 is not? The 'cliff' reading avoids a sharp break but fails to protect the lexical constraint. The 'floor' reading must accept a degree of arbitrariness as the cost of preserving qualitative distinctions, perhaps likening the threshold to legal bright-line rules, though this remains a theoretical vulnerability. Thus, the view risks vagueness without phenomenological justification.

  In the trade-off case—preventing huge threshold-level suffering for one versus massive finite pleasure for many—the implications diverge. Under the 'cliff' reading, if the exchange rate is merely steep rather than infinite, aggregate pleasure could theoretically outweigh the suffering, undermining the view's motivation. The 'floor' reading dictates preventing the suffering unequivocally. Since pleasure is excluded from the ranking above the threshold, the aggregate utility of the many is morally inert against the one's lexical suffering. This aligns with the negative utilitarian impulse to prioritize suffering relief, but it relies on the controversial categorical break.

  Finally, does LTNU remain 'negative utilitarian' if it employs a positive-value scale below the threshold? Classical Negative Utilitarianism minimizes suffering, often treating pleasure as merely the absence of pain. LTNU requires a metric of pleasure to calculate trade-offs below the threshold. If pleasure has independent positive value, the view becomes a hybrid prioritizing suffering but acknowledging good. This compromises pure NU, transforming it into a form of Lexical Prioritarianism. To retain the 'negative' label, proponents must argue that below-threshold 'pleasure' is instrumentally valuable only as pain-relief or reduced suffering. If pleasure is intrinsically valuable, the view abandons the monistic focus on pain minimization. Thus, LTNU can only claim the NU title if it conceptualizes below-threshold trade-offs as comparisons between degrees of suffering rather than suffering versus positive pleasure. Otherwise, it collapses into lexical hedonic utilitarianism.

  The 'floor' reading better secures lexicality but faces arbitrariness objections. It dictates preventing extreme suffering regardless of aggregate pleasure. It retains the label only by conceptualizing below-threshold pleasure as merely less pain, maintaining the primacy of suffering in the moral calculus.

  **Marking Scheme**

  1.  **Floor vs. Cliff (4 marks):** Identify distinction and argue for one.
      *   *Mistake:* Treating them as identical.
      *   *1st vs 2:1:* Firsts explain *why* continuity undermines lexicality; 2:1s state preference.
  2.  **Arbitrariness (4 marks):** Address Sorites problem regarding threshold.
      *   *Mistake:* Claiming threshold is naturally obvious.
      *   *1st vs 2:1:* Firsts explore phenomenological breaks; 2:1s note problem without analysis.
  3.  **Trade-off Case (4 marks):** Apply reading to one-vs-many case.
      *   *Mistake:* Allowing compensation in Floor reading.
      *   *1st vs 2:1:* Firsts link outcome to lexicality; 2:1s just give verdict.
  4.  **NU Label (4 marks):** Address tension between positive scales and NU monism.
      *   *Mistake:* Assuming NU cannot accommodate pleasure trade-offs.
      *   *1st vs 2:1:* Firsts distinguish intrinsic vs. instrumental pleasure; 2:1s treat as binary.
  5.  **Coherence (4 marks):** Structure and completion of all prompt parts.
      *   *Mistake:* Disconnected paragraphs.
      *   *1st vs 2:1:* Firsts weave themes; 2:1s treat as checklist.
