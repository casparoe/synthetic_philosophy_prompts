  2.  **Deconstruct the Positions:**
      *   *Heterophenomenology (HP):* The "Third-Person Stance." The only objective data is the subject's utterance/text. The "phenomenal world" exists inside the subject's head as a *representation*. We explain why they say what they say. We don't need to posit qualia as intrinsic properties.
      *   *Neurophenomenology (NP):* The "First-Person/Second-Person Stance." Consciousness is real and irreducible. Rigorous phenomenological reduction (bracketing assumptions) yields stable structures of experience. Correlating these with neural data is the only way to solve the hard problem. HP ignores the phenomenon itself.

  3.  **Drafting Section (a): Agreed Claims:**
      *   Need common ground. Both want a science of consciousness. Both use reports. Both reject naive introspectionism (uncritical "I see red").
      *   *The Fictionalism Charge:* HP needs to agree that NP *charges* them with treating experience as a fiction. HP doesn't have to agree it *is* a fiction, just that this is the accurate charge.
      *   *Data:* Both agree verbal reports are data. Disagree on *what* they are data *of*.
