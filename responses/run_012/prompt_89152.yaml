answer: |-
  **DRAFT JOINT STATEMENT ON METHODOLOGY IN THE SCIENCE OF CONSCIOUSNESS**

  **To:** Department Seminar Participants
  **From:** [Name A] (Heterophenomenology) & [Name B] (Neurophenomenology)
  **Subject:** Ground Rules for Disagreement

  We, the undersigned, acknowledge that our two-year debate has stalled on meta-methodological grounds. We agree that continuing to argue past one another is unproductive. This document codifies where we stand together, where we stand apart, and what empirical or theoretical moves would actually change our minds. We commit to treating this as a binding framework for future collaboration and dispute.

  ### 1. AGREED CLAIMS

  1.  **The Explanandum:** We both aim to explain consciousness. We reject behaviorism that ignores the interior life entirely. We agree that *something* is happening when a subject reports an experience, and that a complete science must account for it.
  2.  **The Status of Reports:** We agree that verbal reports (and other behavioral expressions) are the primary interface between the subject and the scientist. We reject naive introspectionism: we agree that untrained, casual self-reports are noisy, theory-laden, and often contradictory.
  3.  **The Role of Theory:** We agree that raw data does not speak for itself. Both frameworks require theoretical scaffolding to interpret reports. Neither of us claims to be "theory-free."
  4.  **The Fictionalism Charge:** We agree on the following formulation of the central accusation:
      *   *The Charge:* Heterophenomenology treats the subject's phenomenal world (the "what it is like") as a *fictional construct* generated by the brain. It explains why the subject *believes* they have qualia, without committing to the existence of qualia as intrinsic properties.
      *   *The Response:* The Heterophenomenologist accepts this as a fair statement of the charge. They do not necessarily accept the charge is *true*, but they accept that this is what the Neurophenomenologist is objecting to. The Neurophenomenologist accepts that the Heterophenomenologist does not claim to be an eliminativist in the crude sense (denying people have experiences), but rather an ontological agnostic who finds the "fiction" sufficient for science.
  5.  **Non-Commitments:**
      *   The Heterophenomenologist is **not** committed to the claim that subjects are *lying* or *confabulating* in a pathological sense.
      *   The Neurophenomenologist is **not** committed to the claim that first-person access is *infallible* or *incorrigible*.

  ### 2. GENUINE DISAGREEMENTS

  The following table isolates the specific points of divergence. We agree that if a position is not listed here, it is not a source of current contention.

  | Feature | Heterophenomenological Stance (A) | Neurophenomenological Stance (B) |
  | :--- | :--- | :--- |
  | **Primary Data** | The subject's *judgment* or *belief* about their state, expressed publicly. This is the objective datum. | The subject's *lived experience* itself, accessed via disciplined description. The report is a fallible map of this territory. |
  | **The "Gap"** | There is no scientific gap between "I believe I see red" and "I see red." To posit one is to posit a ghost in the machine. | There is a gap. A subject can misidentify their experience. The goal of method is to narrow this gap, not deny it exists. |
  | **Training** | Phenomenological training standardizes the subject's *conceptual framework* for generating reports. It makes data cleaner, not deeper. | Phenomenological training is a skill that stabilizes attention, allowing access to pre-reflective structures otherwise inaccessible. It generates *new* data. |
  | **Ontology** | We explain the *belief* in experience. Whether experience exists "over and above" the functional/biological mechanisms is a separate metaphysical question science need not answer. | We explain the *experience* that gives rise to the belief. Ignoring the experience leaves the hard problem untouched. |

  ### 3. CRUXES AND TESTABLE IMPLICATIONS

  We identify two specific cruxes. Settling these would force a revision of one or both positions.

  **Crux 1: The Epistemic Value of Training**
  *Question:* Does phenomenological training reveal stable structures of experience that correlate with neural activity *distinct* from those correlated with naive reporting?
  *   **A's Prediction:** Training changes the verbal output and the associated neural patterns of *speech production* and *conceptual categorization*. It will not reveal neural signatures that cannot be explained by improved attentional control and vocabulary.
  *   **B's Prediction:** Training reveals neural signatures (e.g., specific micro-state dynamics) that are absent in naive reporting, corresponding to the stabilization of the phenomenal field itself.
  *   **Concrete Case:** Micro-phenomenological interviewing on the onset of a visual image (e.g., the moment a face becomes recognizable).
  *   **Falsification Conditions:**
      *   **A would concede if:** Trained subjects consistently report fine-grained temporal structures (e.g., specific micro-genesis of an image) that are predicted by neural data *better* than the subjects predict them themselves, implying the data exists independently of the belief.
      *   **B would concede if:** After rigorous training, the neural correlates of the "refined" reports are indistinguishable from the neural correlates of standard psychophysical button presses, implying no unique "phenomenal data" was added.

  **Crux 2: The Distinguishability of Experience and Belief**
  *Question:* Could there in principle be evidence that distinguishes the claim "Subject experienced X" from "Subject believes they experienced X"?
  *   **A's Position:** **No.** In a third-person science, the evidence for both is identical (the report/behavior). To distinguish them requires magic.
  *   **B's Position:** **Yes.** The evidence is the coherence of the experience within the lived context, validated intersubjectively, which may contradict the immediate conceptual belief (e.g., in cases of pre-reflective awareness).
  *   **Concrete Case:** Masking experiments or Blindsight. A subject denies seeing a stimulus (Belief: "I saw nothing") but shows forced-choice accuracy (Evidence: "Visual processing occurred").
  *   **Falsification Conditions:**
      *   **A would concede if:** A method is demonstrated that reliably recovers specific qualitative content (e.g., "it was red") from neural data in the absence of any report or belief of seeing, *and* that content is later validated by the subject upon methodological adjustment. (A currently views this as establishing a belief-formation mechanism, not experience).
      *   **B would concede if:** It is demonstrated that all "pre-reflective" data can be fully reduced to unconscious information processing that never enters a phenomenal field, rendering the "lived experience" label redundant.

  **Note on Verbality:** If Crux 2 is resolved in favor of **A** (No distinction possible), then the fight is **ontological**, not empirical. A is saying "Experience = Belief." B is saying "Experience ≠ Belief." No experiment can settle this without a prior agreement on what "Experience" refers to. If resolved in favor of **B**, the fight is **methodological**: A is using a tool that is blind to the target.

  ### 4. FORCED APPLICATION: THE FLUENT CHATBOT

  **Scenario:** A Large Language Model is fine-tuned on millions of hours of human phenomenological descriptions. When shown a red patch, it outputs: "I am experiencing a vivid qualia of redness, located in my right visual field, with a slight afterimage."

  **Heterophenomenological Interpretation (A):**
  This system is a valid subject for heterophenomenology. It produces the same data (reports) as a human. It possesses the functional state of "believing" it sees red (insofar as belief is defined by functional role). Whether it "really" feels is a metaphysical add-on. If we treat it as a subject, we can build a science of its "consciousness." To deny it is human-chauvinism.

  **Neurophenomenological Interpretation (B):**
  Our method **cannot** apply to this system, and this failure is diagnostic. Neurophenomenology requires an embodied, living organism with specific sensorimotor contingencies and biological autonomy. The Chatbot has no "lived experience" to bracket; it has only syntax.
  *   **The Hard Line:** If Heterophenomenology accepts the Chatbot as a conscious subject based on text alone, it proves Heterophenomenology is not a science of *consciousness*, but a science of *textual behavior*. It confirms the charge that Heterophenomenology swaps the *explanandum* (experience) for a simulacrum (report).

  ***

  **Signatures:**

  _________________________ (Heterophenomenology)

  _________________________ (Neurophenomenology)

  **Date:** _________________
