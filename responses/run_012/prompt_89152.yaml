      *   *Wording:* HP should sound like they are protecting scientific rigor. NP should sound like they are protecting the phenomenon.

  5.  **Drafting Section (c) & (d): Cruxes and Tests:**
      *   *Crux 1: Training.* Can training improve the *accuracy* of reports regarding experience (NP), or does it just standardize the *belief formation* (HP)?
