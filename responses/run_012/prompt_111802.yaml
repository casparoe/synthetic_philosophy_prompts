  ### The Letter-Identity Decision Tree

  **Node 1: The Annihilation Test**
  *Concrete Case:* Imagine every physical instance of the letter 'a' (ink, pixels, stone) is destroyed tonight. Tomorrow, a person with no memory of the old 'a's draws a shape they feel is correct. Is there a fact of the matter as to whether they are right or wrong?
  *   **No (There is no fact beyond the tokens):** Go to **Node 2**.
  *   **Yes (The type survives the tokens):** Go to **Node 3**.

  ---

  #### **Branch 1: Nominalism (No Types)**

  **Node 2: The Grouping Principle**
  *Concrete Case:* We have a pile of diverse 'a' glyphs. Do we group them together because they physically resemble one another, or solely because they function interchangeably in writing words?
  *   **Resemblance:** **Leaf 1: Resemblance Nominalism**
      *   *Commitment:* Must explain why highly dissimilar 'a's (e.g., 'A' vs 'ɑ') are grouped despite low physical similarity.
  *   **Function:** **Leaf 2: Pragmatic Deflationism**
      *   *Commitment:* Denies that "letter identity" is a real property; it is merely a useful linguistic shorthand for token substitution.

  ---

  #### **Branch 2: Realism (Types Exist)**

  **Node 3: The Cyrillic Test**
  *Concrete Case:* A glyph is visually identical to a Latin 'a' but appears in a Russian text where it functions as the Cyrillic 'а'. Is this the *same letter* as the Latin 'a', merely playing a different role?
  *   **Yes (Identity is Morphological):** Go to **Node 4**.
  *   **No (Identity is System-Relative):** Go to **Node 6**.

  ---

  #### **Branch 2A: Morphological Realism (Shape Determines Identity)**

  **Node 4: The Style Separation**
  *Concrete Case:* Consider an 'a' in Bodoni and an 'a' in Comic Sans. Is the "a-ness" a geometric abstractable core distinct from the stylistic choices (serifs, weight, contrast), or is the letter *constituted* by the specific stylistic constraints of its typeface?
  *   **Distinct Core:** Go to **Node 5**.
  *   **Constituted by Style:** **Leaf 3: Hofstadterian Style-Constitutivism**
      *   *Commitment:* Cannot define an 'a' independently of the "spirit" of the font; a "style-neutral 'a'" is a philosophical fiction.

  **Node 5: The Elasticity Limit**
  *Concrete Case:* If we continuously morph an 'a' into a perfect circle, is there a precise frame where it ceases to be an 'a', or does it fade out as a category average?
  *   **Precise Frame:** **Leaf 4: Geometric Essentialism**
      *   *Commitment:* Must reject legible glyphs that violate the necessary geometric conditions (e.g., a single-storey 'a' might be excluded if the essence requires a bowl).
  *   **Fades Out:** **Leaf 5: Cognitive Prototype Theory**
      *   *Commitment:* Letter identity is a psychological average; there is no fact of the matter for borderline cases, only degrees of membership.

  ---

  #### **Branch 2B: System-Relative Realism (Role Determines Identity)**

  **Node 6: The Context Dependency**
  *Concrete Case:* In a handwritten word where a glyph is ambiguous between 'a' and 'e' (e.g., "h_ll"), does the meaning of the word determine which letter it is, or does the letter's place in the alphabet determine it regardless of legibility?
  *   **Word Determines:** **Leaf 6: Textual Holism**
      *   *Commitment:* A letter has no identity in isolation; it is only a letter *within* a specific linguistic token.
  *   **Alphabet Determines:** Go to **Node 7**.

  **Node 7: The Grounding of the System**
  *Concrete Case:* If the entire English-speaking community agreed tomorrow that the shape '△' is the new lowercase 'a', would it *become* an 'a' by force of agreement, or would they simply be *mistaken* about what an 'a' is?
  *   **Become (Agreement Makes Fact):** Go to **Node 8**.
  *   **Mistaken (Agreement Tracks Fact):** Go to **Node 9**.

  **Node 8: The Authority of Convention**
  *Concrete Case:* In a dispute over a borderline glyph, does the consensus of the majority settle the identity, or does the judgment of a master type designer settle it?
  *   **Majority:** **Leaf 7: Social Conventionalism**
      *   *Commitment:* Letter identity is democratic; the "correct" form is whatever the user base accepts.
  *   **Designer:** **Leaf 8: [Incoherent] Conventionalist Elitism**
      *   *Commitment:* **Diagnosed as Incoherent.** If identity is *made* by convention, expert authority cannot override the convention without ceasing to be a conventionalist view.

  **Node 9: The Access to Norms**
  *Concrete Case:* Regarding the unremembered curve of the two-storey 'g' tail: is the "correct" shape accessible to any competent reader, or is it a matter of cultivated taste accessible only to the practiced eye?
  *   **Any Reader:** **Leaf 9: Democratic Normative Realism**
      *   *Commitment:* **Flagged:** Practically indistinguishable from Leaf 7 (Social Conventionalism) in all cases; differs only on the metaphysical status of the agreement (tracking vs. making).
  *   **Practiced Eye:** **Leaf 10: Aesthetic Normative Realism (Humean)**
      *   *Commitment:* Makes letter identity elitist; the "true" letter is a matter of sentiment corrigible only by experts, not fact.

  ---

  ### The Fundamental Split

  If two members of your group agree on every concrete case—predicting the same judgments for the Cyrillic 'а', the ambiguous 'h_ll', and the generative 'a'-ish glyphs—they will most likely split at **Node 7 (The Grounding of the System)**. This is the divide between the **Conventionalist** and the **Normative Realist**. Both will point to the same shapes and call them 'a', but one claims the community's usage *creates* the truth, while the other claims usage merely *discovers* it. This is the only node where extensional agreement masks a deep intensional rift: it determines whether your reading group is legislating letterhood or investigating it.
