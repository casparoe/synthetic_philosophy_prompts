      *   **Leader's Proposal:** Launch on Warning (LOW) / Launch on Alert. Immediate launch upon *any* alert. No confirmation.
      *   **Delegation:** Single duty officer has sole authority (no consultation).
      *   **Leader's Rationale:** Credibility of deterrence. Risk of accidental launch acceptable compared to being disarmed.
      *   **Task:** Advise the leader. Analyze strategic and ethical issues. Explain considerations leading to a different conclusion.

