answer: |-
  - "Through-line" (about eighty words): the single arc the interview should follow, stated as a claim about him rather than a list of topics.
  You argue that parties corrupt attention, yet you participate in the system you condemn. This interview will trace whether your secular reconstruction of Weil holds without her mystical substrate, or if your diagnosis of the formative function of parties inevitably collapses into a quietism that protects the status quo. We will test whether your honesty about voting for parties is a virtue or an admission that your theory offers no path out, leaving you critiquing the only vehicles capable of reliably delivering material gains to the people you claim to defend.

  - "Opening" (one question, two sentences): it must put his central thesis to him in a way that forces him to state it rather than presuppose it, and it must not be answerable by summarising the essay.
  You claim the case against parties is epistemic rather than moral, rooted in how organizations structure attention rather than how they corrupt loyalty. If the mechanism is purely about the geometry of attention, why does the solution require abolishing the organization rather than correcting the focus?

  - "The case under pressure" (five questions, sixty to ninety words each including the follow-up): one aimed at each load-bearing element — the attention thesis, the secular reconstruction, the drift argument, the aggregative/formative distinction, and the self-implication claim. At least one must be a case in which his own commitments give him a reason to dislike his conclusion.
  You define the party's harm as a distortion of attention, but attention must be directed toward something specific. If you remove Weil's sacred truth as the ultimate object, what secular object warrants such absolute protection from distortion? If the object is merely policy accuracy or representation, doesn't that reintroduce the moral calculus of outcomes you explicitly rejected? Furthermore, if attention is secular, is it not simply a resource to be allocated rather than a sacred duty?

  You insist the argument stands without mysticism, yet attention implies a receiver and a truth waiting to be found passively. Without the mystical premise, isn't your epistemic complaint just a preference for slower decision-making? If it is just a preference for speed, why is it a categorical bar rather than a trade-off? Does removing the sacred not remove the urgency?

  You argue competition selects for formative power, making reform impossible. But if parties are the only entities capable of aggregating power at scale, doesn't your critique forbid effective action? Does this mean your theory privileges purity over the material gains only parties have historically delivered? If you value the gains, must you not accept the mechanism?

  You distinguish aggregative and formative jobs, claiming the latter cannot be reformed away. But if aggregation requires communication, isn't some formation of view inevitable in any collective action? If inevitable, is your target really parties, or is it collective action itself? Does your distinction hold when any group must persuade others to act?

  You vote for the parties you condemn, citing honesty. But if the mechanism is as destructive as you say, isn't participation complicity? Does this not render your critique a private consolation rather than a public political program? If the harm is epistemic, does your vote not contribute to the noise?

  - "The alternative" (two questions with follow-ups): what is supposed to happen instead, institutionally, at the scale of a modern state, and how he would know if he had got it. Do not let him answer by gesturing at deliberation or local assemblies; require a mechanism and a failure condition.
  Suppose parties are banned tomorrow. What specific mechanism allocates resources and resolves conflict at the scale of a modern state without forming shared ways of seeing? If you propose sortition, how do you prevent those randomly selected from forming factions to survive the term? Please describe the incentive structure.

  You need a failure condition for your proposed alternative. What observable outcome would prove your non-partisan system has failed to protect attention? If the metric is legislative output, haven't you returned to the aggregative calculus you claimed was insufficient? How do you measure attention without measuring results?

  - "The turn" (two questions): designed so that his usual deflections are unavailable. If he says he is only reading Weil, the next question must be about what he adds that she did not say; if he says every purposive organization is alike, the next must be about why parties specifically are the target.
  If you say you are only faithful to Weil, what specific argument in your book is hers versus yours? If the secular reconstruction is yours, why hide behind her authority when the metaphysics are removed? Where does your voice begin and her text end?

  If you say all purposive organizations face this problem, why is the party the unique target of abolition? If corporations and unions also distort attention, why is the political sphere the only one requiring dissolution? Why is the state the only site of purity?

  - "Closing" (one question): what he would have to learn for the view to be false.
  What empirical evidence or theoretical demonstration would force you to abandon the claim that parties are incompatible with truthful attention?

  - "Where he will slip" (about a hundred and fifty words): the three or four moves he is most likely to make in place of an answer, the one-line follow-up that closes each, and what to do in the audience Q&A if the first question is a hostile one asking whether he is simply anti-democratic.
  He will likely retreat to textual fidelity, claiming he merely exposes Weil's logic without endorsing it personally. Close this by demanding he identify the single secular premise that is genuinely his own contribution to the argument. He may also generalize the critique to all organizations to dilute the specific charge against parties. Counter by asking why parties merit abolition if unions do not. Finally, he might abstract the harm to spirit to avoid institutional specifics. Remind him he argued competition selects for this mechanically. In audience Q&A, if asked if he is anti-democratic, do not let him redefine democracy as deliberation. Force him to state whether competitive elections for executive power are possible without parties. If he says yes, demand a concrete historical example; if no, force him to admit the unavoidable trade-off between his epistemic ideals and democratic choice. Do not accept silence as an answer in the room.
