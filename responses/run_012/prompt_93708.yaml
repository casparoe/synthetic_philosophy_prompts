      *   **Nightmare 3:** Side effects and chains of consequences (tap -> sink -> floor -> cat slip). Order matters, hard to track indirect effects.
          *   *AI Concept:* The Ramification Problem.
          *   *Nature:* Causal/Temporal complexity.

      *   **Nightmare 4:** Deciding which facts matter (cup color matters for matching, not pouring). The system can't filter relevance; the human can't explain how they do it.
          *   *AI Concept:* The Relevance Problem (often tied to the Frame Problem, but distinct in cognitive science).
          *   *Nature:* Cognitive/Semantic issue. Context-dependence.

  3.  **Synthesize and Categorize (The "Carving"):**

      *   *Are they the same?* They are deeply intertwined, historically grouped under "The Frame Problem" in philosophy of AI, but technically distinct in engineering/logic.
