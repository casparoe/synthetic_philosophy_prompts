          *   *Admit (Bad for them):* Objection 1 (Disgust). It forces a modification of the theory (excluding certain preferences) which risks arbitrariness.
          *   *Shrug:* Objection 2 (Consent). Easily handled by Rule Utilitarianism or long-term consequence analysis.

