      *   *Refining Objection 1 (Disgust):* Need to mention J.S. Mill's distinction between self-regarding and other-regarding acts. The "pain of knowing" is tricky. If we count it, we get the "Puritan Paradox."
      *   *Refining Objection 2 (Consent):* Distinguish between Act and Rule Utilitarianism. In Act, deception might be okay if undiscovered. In Rule, it destroys trust. The user's intuition that "lying feels bad" needs to be grounded in utility.
      *   *Refining Objection 3 (Stability):* This is the "Empirical Gambit." Bentham assumes liberty leads to happiness. If data says otherwise, Bentham loses. This is the strongest philosophical challenge to the *conclusion*, even if the *method* holds.

      *   *Ranking:*
