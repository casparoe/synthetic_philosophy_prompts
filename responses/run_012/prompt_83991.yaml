answer: |-
  The Guildhall of Kaelis smelled of limestone dust and dried lavender, the scent of centuries. Master Elara stood behind the heavy oak table, her hands stained the permanent blue-grey of ondrast. For three hundred years, her order had quarried the soft mineral, grinding it into glazes for pottery and powders for stomach ailments. It was the island's blood and bone.

  Across from her, Dr. Aris Thorne adjusted the brass lenses of his spectroscope. The instrument hummed, casting a fractured rainbow against the stone wall. He had arrived from the mainland a week prior, promising clarity. He had delivered division.

  "The spectrum splits," Thorne said, tapping the glass slide where two samples sat side by side. "Here, at the violet edge. You see the divergence?"

  "I see light," Elara said, her voice tight. "I do not see poison."

  "Substance A cures the stomach ache. Substance B stops the heart. They look identical. They feel identical. But they are not the same." Thorne looked up, his eyes sharp behind his spectacles. "The southern vein is mostly B. The northern is A. You have been selling both."

  "They are ondrast," Elara snapped. "For three centuries, my guild has mined ondrast. We have glazed pots and cured children. If your machine says there are two things, then your machine is breaking one thing into pieces that do not exist outside your lens."

  Thorne leaned forward, the brass of his instrument gleaming. "Existence does not depend on your lens, Master Elara. If I feed a rat the southern vein, it dies. If I feed it the northern, it thrives. Nature makes the distinction, not us. You claimed ondrast was a remedy. That claim is now false for half the quarry."

  "I never asserted anything false!" Elara slammed her hand down. A cloud of blue dust puffed into the light. "When I say 'ondrast', I mean the stone in this sack. I point to the ground and I name what is there. If the sack contains cure, it is ondrast. If it contains poison, it is... bad ondrast. Impure. But it is still the stuff we named. I was right about the rock. I was right about the name. You are the one changing the rules."

  "You asserted it was a natural kind with specific properties," Thorne countered. "That is a claim about its essence, not just its label. You were mistaken about the world."

  "I was mistaken about nothing! I described what we experienced. The word 'ondrast' picks out whatever we are holding. If what we hold changes, the word follows."

  The door creaked open. Professor Vane, the logician from the mainland, slipped in. He had been observing silently from the back shadows, taking notes on a pad of thin paper. He wore the grey coat of the University, untouched by dust.

  "You are arguing about reference," Vane said softly. He placed his pad on the table. "Master Elara believes 'ondrast' is a label for a cluster of sensory experiences and uses. Dr. Thorne believes it is a label for a hidden physical structure."

  "I believe it is what it is," Elara said, wiping her hands on her apron.

  "But consider," Vane said, turning to Thorne. "If the islanders had called this mineral 'gliff' instead of 'ondrast', would the poison still be poisonous?"

  Thorne blinked. "Obviously. Chemistry cares nothing for language. The molecular lattice does not read our signs."

  "And if they had called the poison 'ondrast' and the cure 'gliff'?" Vane pressed.

  "Then ondrast would be poison," Thorne said.

  "No," Elara interrupted. "If we had named the poison 'ondrast', we would have stopped using it. We would have found another stone to cure the stomach. The word 'ondrast' would have moved to the cure. The word follows the value. It follows the life."

  "Or," Vane suggested, steepling his fingers, "the word was never a kind term at all. It was a placeholder. There is no fact of the matter about what 'ondrast' really named until you decide what you want it to do. You are fighting over a ghost. The world is just stuff; the kinds are in your heads."

  "It is not a ghost when a child dies," Thorne said sharply.

  "But the death is real, even if the category is not," Vane replied. "You seek a truth about the word. I suggest there is only a truth about the usage."

  Elara looked at the two samples on the table. One from the north, one from the south. To the eye, they were twins. To the hand, identical weight and texture. Yet one was life and one was death. The silence in the hall grew heavy, pressing against the windows.

  "If I understand you," Elara said slowly, looking at Thorne. "You are saying that even before you came, before your machine hummed... this stone was already two things. Not just that we didn't know. But that it *was* two."

  "Yes," Thorne said. "The structure was there. The difference was real. It was not a matter of convention."

  "And yet," Elara murmured, picking up the grey lump. "We could not have known this by thinking. We could only know by looking. By digging into the world."

  She turned the stone over. The blue-grey dust coated her thumb. For generations, they had spoken of ondrast as a unity. If Thorne was right, every sentence they had ever spoken about the mineral's nature had been half-blind, yet referring to a truth that waited in the dark. They had not been speaking nonsense; they had been speaking about a thing they did not fully see.

  "So," Elara said, her voice quiet. "The discovery is not that the world changed today. It is that ondrast was never what we thought it was, even though we were the ones who named it. We thought we defined it by our use. But the earth defined it by its bone."

  Thorne nodded, packing his lenses away. "We found what was there. We didn't make it."

  "But we cannot speak of it now as one," Elara said. "The word breaks."

  "The word stays," Vane interjected. "But its meaning snaps."

  Elara looked out the window toward the quarries. The sun was setting over the blue-grey hills. She realized that the truth was not something they had created in this room. It was something that had been waiting in the stone, immutable and silent, while they argued over syllables. The fact was necessary, fixed in the lattice of the mineral, yet it remained hidden until the light of the instrument struck it. It was not a contingent fact about how the world happened to be arranged today; it was a fact about what ondrast had always been.

  "Clear the southern vein," Elara said finally. "Call it what you will. But do not call it safe."

  She did not say who was right. She only acknowledged that the stone held a secret it had kept since the island formed, a secret that no amount of tradition could alter, only reveal.
