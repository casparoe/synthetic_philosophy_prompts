      The Guildhall of Kaelis smelled of limestone and dried lavender. Master Elara stood behind the oak table, her hands stained the permanent blue-grey of ondrast. Across from her, Dr. Aris Thorne adjusted the brass lenses of his spectroscope. The instrument hummed, casting a fractured rainbow against the stone wall.

      "The spectrum splits," Thorne said, tapping the glass. "Here, at the violet edge. You see the divergence?"

      "I see light," Elara said. "I do not see poison."

      "Substance A cures the stomach ache. Substance B stops the heart. They look identical. They feel identical. But they are not the same."

      "They are ondrast," Elara snapped. "For three centuries, my guild has mined ondrast. We have glazed pots and cured children. If your machine says there are two things, then your machine is breaking one thing into pieces that do not exist outside your lens."

      Thorne leaned forward. "Existence does not depend on your lens, Master Elara. If I feed a rat the quarry's southern vein, it dies. If I feed it the northern vein, it thrives. Nature makes the distinction, not us."

      "We make the distinction by using it!" Elara slammed her hand down. Dust puffed into the light. "When I say 'ondrast', I mean the stone in this sack. If the sack contains cure, it is ondrast. If it contains poison, it is... bad ondrast. Impure. But it is still the stuff we named. I never asserted anything false. I pointed to a rock and said 'this'. I was right about the rock."

      "You asserted it was a remedy," Thorne countered. "That is a claim about its nature, not just its name."

      "It is a claim about its use!"

      The door creaked open. Professor Vane, the logician from the mainland, slipped in. He had been observing silently for an hour, taking notes on a pad of thin paper.

      "You are arguing about reference," Vane said softly. He placed his pad on the table. "Master Elara believes 'ondrast' is a label for a cluster of sensory experiences and uses. Dr. Thorne believes it is a label for a hidden physical structure."

      "I believe it is what it is," Elara said.

      "But consider," Vane said, turning to Thorne. "If the islanders had called this mineral 'gliff' instead of 'ondrast', would the poison still be poisonous?"

      Thorne blinked. "Obviously. Chemistry cares nothing for language."

      "And if they had called the poison 'ondrast' and the cure 'gliff'?" Vane pressed.

      "Then ondrast would be poison," Thorne said.

      "No," Elara interrupted. "If we had named the poison 'ondrast', we would have stopped using it. We would have found another stone to cure the stomach. The word 'ondrast' would have moved to the cure. The word follows the value."

      "Or," Vane suggested, "the word was never a kind term at all. It was a placeholder. There is no fact of the matter about what 'ondrast' really named until you decide what you want it to do. You are fighting over a ghost."

      "It is not a ghost when a child dies," Thorne said sharply.

      "But the death is real, even if the category is not," Vane replied.

      Elara looked at the two samples on the table. One from the north, one from the south. To the eye, they were twins. To the hand, identical weight and texture. Yet one was life and one was death.

      "If I understand you," Elara said slowly, looking at Thorne. "You are saying that even before you came, before your machine hummed... this stone was already two things. Not just that we didn't know. But that it *was* two."

      "Yes," Thorne said. "The structure was there. The difference was real."

      "And yet," Elara murmured, picking up the grey lump. "We could not have known this by thinking. We could only know by looking. By digging into the world."

      She turned the stone over. The blue-grey dust coated her thumb. For generations, they had spoken of ondrast as a unity. If Thorne was right, every sentence they had ever spoken about the mineral's nature had been half-blind, yet referring to a truth that waited in the dark.

      "So," Elara said, her voice quiet. "The discovery is not that the world changed today. It is that ondrast was never what we thought it was, even though we were the ones who named it. We thought we defined it by our use. But the earth defined it by its bone."

      Thorne nodded, packing his lenses away. "We found what was there. We didn't make it."

      "But we cannot speak of it now as one," Elara said. "The word breaks."

      "The word stays," Vane interjected. "But its meaning snaps."

      Elara looked out the window toward the quarries. The sun was setting over the blue-grey hills. She realized that the truth was not something they had created in this room. It was something that had been waiting in the stone, immutable and silent, while they argued over syllables. The fact was necessary, fixed in the lattice of the mineral, yet it remained hidden until the light of the instrument struck it.

      "Clear the southern vein," Elara said finally. "Call it what you will. But do not call it safe."

      She did not say who was right. She only acknowledged that the stone held a secret it had kept since the island formed, a secret that no amount of tradition could alter, only reveal.

