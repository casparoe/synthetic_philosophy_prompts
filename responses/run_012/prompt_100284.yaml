answer: |-
  There is no single canonical term in the philosophical or sociological literature that captures this specific predicament in its entirety, though several concepts approach it from different angles. The phenomenon you describe sits at the intersection of **Jon Elster's** work on "causal opacity," **James C. Scott's** concept of "legibility," and the ethical **Paradox of Hedonism**.

  However, none of these fully articulate the specific tension with Chesterton's Fence: the injunction to *know* before acting, when the act of *knowing* is itself the destructive act.

  Because the existing vocabulary is fragmented, I will coin a term to encapsulate the class of practice and the reformer's predicament. I propose calling these **"Reflexively Fragile Norms" (RFNs)**.

  Below is an analysis of how this concept stands to the existing literature, the boundaries of the term, and the specific predicament it creates for the reformer.

  ### 1. The Existing Landscape (Why existing terms fall short)

  To understand why a new term is necessary, we must locate where the existing concepts miss the mark:

  *   **Jon Elster's "Causal Opacity":** In *Alchemies of the Mind* and *The Cement of Society*, Elster argues that many social norms function only if their causal mechanism is not fully understood by the participants (e.g., religion works best if believed to be true, not if believed to be a social glue). This is the closest existing match. However, Elster focuses on the *psychology* of the believer, not the *epistemological predicament* of the external observer or reformer confronting Chesterton's Fence.
  *   **James C. Scott's "Legibility":** In *Seeing Like a State*, Scott describes how state attempts to make society "legible" (measurable, understandable, administrable) often destroy the complex social fabric (metistis) that made it function. This captures the *destruction*, but it frames it as a political error rather than a logical paradox inherent to the norm itself.
  *   **The Paradox of Hedonism:** This ethical principle states that happiness is often a byproduct of aiming at other things; aiming directly at happiness ensures misery. Your example of promise-keeping is an institutional version of this. However, the Paradox of Hedonism is usually applied to individual states of mind, not the *conservative heuristic* of institutional preservation.
  *   **The Observer Effect:** In physics, measuring a system changes it. In sociology, this is **Reflexivity** (Soros, Merton). But reflexivity is usually about *predictions* changing outcomes (e.g., predicting a bank run causes the run). Your case is about *justification* changing outcomes.

  ### 2. The Coined Term: Reflexively Fragile Norms (RFNs)

  **Definition:** A Reflexively Fragile Norm is a social practice, institution, or convention whose efficacy depends constitutively on the participants *not* treating the norm as an object of instrumental analysis. The value of the norm is generated by the *unexamined* acceptance of its authority; the act of demanding a functional justification dissolves the authority required to sustain the function.

  **The Mechanism:**
  In a standard institution (e.g., a traffic light), the function is robust to inquiry. Knowing *why* the light is red (to prevent collisions) does not stop you from stopping.
  In an RFN (e.g., a sacred oath), the function is fragile to inquiry. Knowing *why* the oath is binding (to ensure social trust) shifts the motivation from "I must do this because it is binding" to "I must do this because it is useful." Once the motivation shifts to utility, the binding nature evaporates, because if the utility calculation changes, the obligation vanishes. The "ought" collapses into a "might."

  ### 3. Relationship to Chesterton's Fence

  Chesterton's Fence relies on an assumption of **Epistemic Stability**. It assumes that the function of the fence is a hidden fact waiting to be discovered, and that the discovery process is neutral.

  *   **Standard Fence:** The function is *hidden* but *stable*. You can find the reason without breaking the fence.
  *   **RFN Fence:** The function is *hidden* and *volatile*. The "reason" is not a static fact but a dynamic state of belief.

  For RFNs, Chesterton's injunction ("Do not remove until you know what it is for") becomes a **Performative Contradiction**. To satisfy the condition for removal (knowing the function), you must perform the act (questioning the function) that negates the function. The reformer is caught in a loop:
  1.  To conserve the norm, you must leave it unexamined.
  2.  To justify conserving the norm (per Chesterton), you must examine it.
  3.  Examining it destroys the grounds for conserving it.

  Thus, for RFNs, Chesterton's Fence is not merely difficult to satisfy; it is **self-undermining**.

  ### 4. Relationship to the "Goods Lost When Aimed At"

  This is the institutional analogue of the Paradox of Hedonism.
  *   **Individual Level:** You cannot be spontaneous by *trying* to be spontaneous.
  *   **Institutional Level:** You cannot have a binding promise by *calculating* the benefits of binding promises.

  RFNs rely on **Indirect Teleology**. They achieve their end (social cohesion, trust, stability) only if that end is not the direct object of the participants' will. The moment the norm is adopted *because* it produces the good, it ceases to produce the good.

  This distinguishes RFNs from mere **Superstitions**. A superstition (e.g., "don't walk under ladders") might be useless, but questioning it doesn't necessarily change its social function (which might be nil). An RFN *has* a function, but that function is parasitic on the *illusion* that the norm is categorical rather than hypothetical.

  ### 5. Relationship to Rules That Hold Only If Not Followed "Because They Hold"

  This touches on the distinction between **Internal** and **External** points of view (H.L.A. Hart).
  *   **Internal View:** "I keep promises because it is wrong to break them." (Sustains RFN)
  *   **External View:** "I keep promises because it benefits the community." (Destroys RFN)

  RFNs require the Internal View to function, but Chesterton's Fence demands the External View to justify preservation. The reformer who adopts the External View to save the institution inadvertently converts it into a different kind of institution (a contract rather than a covenant), which often lacks the same resilience.

  ### 6. Boundaries: What Falls Inside and Outside

  To ensure this term is useful, we must define its edges.

  **Inside (Reflexively Fragile Norms):**
  *   **Trust/Promise-Keeping:** As you noted, if trust is based on calculated reliability, it is not trust; it is risk assessment.
  *   **Sacred Rituals:** A ritual that binds a community often loses its binding power if declared to be "merely for social cohesion."
  *   **Charismatic Authority:** Authority that rests on mystery or awe dissolves under forensic scrutiny.
  *   **Polite Fictions:** Social lubricants (e.g., "How are you?" "Fine") that work only if not treated as requests for data.
  *   **Judicial Independence:** If judges are seen to be deciding cases based on public opinion polls (utility), the rule of law (authority) collapses.

  **Outside (Robust Norms):**
  *   **Technical Protocols:** Knowing why a bridge is built a certain way does not make it collapse.
  *   **Safety Regulations:** Understanding the utility of wearing a seatbelt generally increases compliance, it does not decrease it.
  *   **Market Prices:** Prices convey information; analyzing them does not inherently destroy their signaling function (though manipulation does).
  *   **Explicit Contracts:** These are *designed* to be instrumental. Asking "what is this for?" is part of their enforcement.

  ### 7. The Reformer's Predicament: "The Conservation Paradox"

  If we accept the existence of Reflexively Fragile Norms, the reformer faces a specific dilemma I will call **The Conservation Paradox**.

  *   **The Rationalist Error:** The reformer assumes all norms are Robust. They inquire, find the "utility," and try to optimize it. In doing so, they break the RFN, replacing a high-value fragile good (trust) with a low-value robust substitute (contract).
  *   **The Dogmatic Error:** The conservative assumes the norm must never be touched. But if the environment changes, the RFN may become genuinely harmful, and the prohibition on inquiry prevents necessary adaptation.

  **The Solution: Strategic Opacity**
  The only way to navigate RFNs is not to remove the fence, nor to climb it to see what's on the other side, but to **maintain the fence while remaining silent about its purpose.**

  This implies a distinction between **Private Understanding** and **Public Justification**.
  *   A wise reformer may *privately* understand the RFN is fragile and functional.
  *   But they must *publicly* justify it using the internal language of the norm (duty, tradition, sanctity) rather than the external language of utility.

  To speak the truth about an RFN (that it is a useful fiction) is to kill it. Therefore, the conservation of RFNs requires a form of **Noble Silence**. This is not necessarily deception, but a recognition that some social goods are **Non-Propositional**. They cannot be fully captured in statements of fact without losing their force.

  ### Summary

  The phenomenon you identified is the limit case of conservative heuristics. While Jon Elster's "causal opacity" and the "Paradox of Hedonism" describe the mechanism, they do not name the reformer's trap.

  **Reflexively Fragile Norms** are practices where the *explanation* of the function is a necessary condition for the *dysfunction*. Confronting them renders Chesterton's Fence self-defeating, because the inquiry required to justify the fence is the very act that knocks it down. The reformer's task, therefore, is not to discover the function, but to protect the mystery that sustains it.
