  I catch the sun to make the body light
  But drag the muscle till it begs for hold
  You read a boast in surfaces too bright

  You think this burning proves he can hold
  Against the predators that hunt the breed
  But glory is a debt that must be told

  The debt is real, written upon the seed
  For any fraud can ring an empty bell
  Unless the burden starves the vital need

  Though counterfeiters toll the same loud knell
  If waste is merely waste and nothing more
  It slips away like paint upon a shell

  For magnitude alone is nothing more
  Then honesty is not the size I show
  But how the fit afford to look so poor

  No weakling has the strength to make this show
  You watch to see if I survive the fall
  The weak imitate but cannot take the bow

  You wait to witness who survives the fall
  Converting waste to meaning in your choice
  Unless I stand erect above it all

  The verdict rests within your silent will.
