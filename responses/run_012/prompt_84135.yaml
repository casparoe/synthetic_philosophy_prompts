answer: |-
  ### The Case Study: Replace the Baptism
  **Keep the Baptism?** No. Replace it.
  **Why:** You are correct; the Baptism is too familiar. Familiarity breeds the illusion of understanding. Students think they know *what* happened, so they stop listening to *how* we know it. You need a case where the textual variation is sharp enough to be narrated without a handout, but obscure enough that they cannot rely on Sunday School memories.

  **The Recommended Case:** **Mark 10:17–18 (The "Good Teacher" Saying).**
  *   **The Narrative:** A man runs up to Jesus, kneels, and asks, "Good Teacher, what must I do to inherit eternal life?" Jesus replies, "Why do you call me good? No one is good but God alone."
  *   **Why it fits your constraints:**
      1.  **Narratable:** You can tell the Mark version and the Matthew version in under sixty seconds.
      2.  **Independence Trap:** It appears in Mark, Matthew, and Luke. Students will count three witnesses. You will reveal Matthew and Luke are copying Mark.
      3.  **Verdict Variation:**
          *   *Multiple Attestation:* Suggests authenticity (until dependence is shown).
          *   *Embarrassment:* Suggests authenticity (Early Church calls Jesus "Lord/God"; this saying distances him from "Good").
          *   *Coherence:* Suggests inauthenticity (Contradicts high Christology elsewhere).
      4.  **Failure Mode:** It allows you to show a criterion *failing* (Multiple Attestation fails due to dependence) and a criterion *succeeding* (Embarrassment/Residue holds weight).
      5.  **Residue Friendly:** Matthew 19:17 changes the saying to: "Why do you ask me about the good? One there is who is good." This is the perfect visual for "struggling with the tradition."

  ---

  ### Session Sequence (90 Minutes)

  **1. The Problem of Access (0–15 mins)**
  *   **Goal:** Establish the gap between the event and the text without alienating the devout or boring the skeptics.
  *   **Move:** Do not start with definitions. Start with the gap. Ask: "If you wanted to know what Napoleon said at Waterloo, what would you need?" (Recordings, diaries, letters). "What do we have for Jesus?" (Texts written 40–70 years later by people who weren't there, for specific purposes).
  *   **Dependency:** This step depends on establishing that *all* students, regardless of faith, are working with the same evidentiary limitation.
  *   **Misconception to Head Off:** *The Binary Trap.* (That the text is either "inerrant history" or "pious fiction").
      *   **Intervention:** State clearly: "We are not asking if the Bible is true or false today. We are asking how the stories moved from oral memory to written text. Both believers and skeptics can agree on the mechanics of transmission."

  **2. The Case Introduction (15–25 mins)**
  *   **Goal:** Load the case into their working memory.
  *   **Move:** Narrate Mark 10:17–18. Then narrate Matthew 19:16–17. Highlight the one change: Mark's "Why call me good?" becomes Matthew's "Why ask me about the good?"
  *   **Dependency:** Depends on students hearing the *difference* without seeing the text. Speak slowly. Write the two key phrases on the board.
  *   **Misconception to Head Off:** *The Harmonization Instinct.* (That the two versions can be blended into one super-story).
      *   **Intervention:** "Do not fix Matthew with Mark. Let them contradict. The contradiction is the data."

  **3. The Trap of Multiple Attestation (25–40 mins)**
  *   **Goal:** Demonstrate that a criterion can yield a false positive if the inputs are wrong.
  *   **Move:** Ask: "How many Gospels report this story?" (They will say three: Mark, Matt, Luke). Apply the Criterion of Multiple Attestation: Three independent sources = high probability.
  *   **The Turn:** Reveal the Synoptic Problem (briefly). Matthew and Luke used Mark. They are not independent witnesses; they are one witness with two copies.
  *   **Dependency:** Depends on the previous step. They must care about the specific wording to see why dependence matters.
  *   **Misconception to Head Off:** *The Headcount Fallacy.* (That three books equal three sources).
      *   **Intervention:** "If three newspapers print the same AP wire story, you do not have three reporters. You have one. Criteria are machines; if you feed them bad data, they give you bad history."

  **4. The Push of Embarrassment (40–55 mins)**
  *   **Goal:** Show how a criterion works when the data is secure.
  *   **Move:** Ask: "If you were writing a Gospel in 80 CE, and you believed Jesus was the Lord, would you invent a line where Jesus says, 'I'm not the good one, God is'?"
  *   **Application:** This creates friction with early Christology (e.g., John 1:1, Phil 2:6). Therefore, the Church is unlikely to have created it.
  *   **Dependency:** Depends on Step 3. Now that we know it's essentially one source (Mark), we need a reason to trust *that* source over later edits.
  *   **Misconception to Head Off:** *The "Embarrassment = Falsehood" Error.* (That embarrassing things are just lies meant to humble the reader).
      *   **Intervention:** "Embarrassment doesn't mean the story is shameful; it means the story is *costly* for the author's argument. Why pay the cost unless you have to?"

  **5. The Hinge: Unassimilated Residue (55–70 mins)**
  *   **Goal:** Introduce your colleague's criterion as the refinement of Embarrassment.
  *   **Placement:** Come here *after* Embarrassment. Embarrassment asks about the *origin* ("Would they invent this?"). Residue asks about the *transmission* ("Why did they keep this?").
  *   **What it Adds:** It accounts for the *process*. Mark had the awkward saying. Matthew felt the theological strain. He didn't delete the story (too famous?), but he softened the line. The *strain* itself is the evidence of the tradition's age. It moves the focus from the author's intent to the tradition's inertia.
  *   **Dependency:** Depends on the students seeing Matthew's edit in Step 2.
  *   **Misconception to Head Off:** *The Rational Editor Assumption.* (That ancient editors were systematic theologians who removed all contradictions).
      *   **Intervention:** "Matthew didn't scrub everything. He left the story but fixed the line. Why? Because traditions have gravity. You can orbit them, but you can't always escape them. This criterion finds the gravity."
      *   **Distinction from Embarrassment:** Embarrassment says "The Church wouldn't make this up." Residue says "The Church couldn't quite clean this up." It is a criterion of *survival*, not just *origin*.

  **6. The Limit & The Destination (70–90 mins)**
  *   **Goal:** Move from applying the tool to examining the tool's handle.
  *   **Move:** Ask the Final Question (see below). Guide the discussion to the presupposition about tradition.
  *   **Dependency:** Depends on them having used the criteria successfully enough to feel their power, so the limitation feels like a loss, not a dismissal.
  *   **Misconception to Head Off:** *The Verdict Illusion.* (That the goal of the class is to decide "Did Jesus say this?").
      *   **Intervention:** The Explicit Declination (see below).

  ---

  ### The Colleague's Criterion: Unassimilated Residue
  *   **Where it comes:** After Embarrassment, before the Conclusion.
  *   **What it adds:** Embarrassment is static (a snapshot of the author's motive). Residue is dynamic (a video of the tradition moving through time). It helps students see the Gospels not as books that *appear* but as traditions that *evolve*. It explains why Matthew keeps the story but changes the quote: the story had too much momentum to drop, but the quote was too dangerous to keep.
  *   **Misconception it invites:** That *all* awkwardness is old. Sometimes awkwardness is just bad writing or a different theological point (e.g., Mark might emphasize Jesus' humanity more than Matthew).
  *   **How to head it off:** "Just because a text is rough doesn't mean it's ancient. It might just be rough. We look for the specific kind of roughness that costs the author theological capital."

  ---

  ### The Final Question (Last 10 Minutes)
  Do not ask them to define a criterion. Do not ask them to apply one to a new text. Ask them to interrogate the engine.

  **The Question:**
  > "We have operated today on the assumption that the early Church wanted to make Jesus look *more* divine, *more* powerful, and *theologically consistent*. If we are wrong about that—if the early Church sometimes valued complexity or mystery over clarity—what happens to every verdict we just reached?"

  **Why this works:** It forces them to see that the Criteria of Authenticity rely on a specific theory of tradition (the "Law of Increasing Glory"). If traditions can move toward *more* ambiguity (as some modern scholarship suggests), the criteria lose their predictive power. It shows that historical criticism rests on historical *presuppositions*.

  ---

  ### The Explicit Declination
  In the final five minutes, you must say the following, out loud, clearly:

  > "I am going to decline to do the one thing you probably want me to do. I am not going to tell you whether Jesus actually said this. I am not going to give you a verdict.
  >
  > If I tell you 'Yes, he said it,' you will treat that as dogma. If I tell you 'No, he didn't,' you will treat that as a verdict on the text's value. Neither is true. These criteria are not a truth machine. They are a way of mapping the tensions in the text. They tell us what the early Christians were struggling with, not necessarily what Jesus said.
  >
  > So, I am leaving you with the map, not the territory. Do not leave here thinking you know what happened. Leave here knowing how hard it is to know."

  **Why this destination:** You suspected the right place to end is the question of presuppositions. This declination secures that. It prevents the "Skeptic Vindication" (See? It's all made up!) and the "Devout Defense" (See? The method is broken!). It places the method in its proper lane: a tool for understanding the *tradition*, not a gavel for judging the *history*.
