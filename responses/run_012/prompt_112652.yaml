  Furthermore, the lens struggles with the *coercive* nature of the FCPA. Grammars imply voluntary participation in a shared meaning system. The FCPA was not a negotiation of meaning but a unilateral imposition backed by sanctions. It doesn't capture the power dynamic where one grammar (Market) dominates others through legal force rather than cultural conversion. It treats the exchange as symmetrical when the enforcement was asymmetrical. Finally, the "grease" exception is unstable within the lens. Is it Patrimonial? Or is it pragmatic Market efficiency? If it's the latter, the exception isn't a concession to foreign culture but a domestic cost-benefit analysis, which the triad doesn't fully distinguish. The lens describes the exchange, but not the enforcement hierarchy. It also fails to account for hybridity: real transactions often mix grammars simultaneously. A payment can be a Gift to the recipient and a Price to the payer. The lens forces a binary classification where reality was fluid, making it hard to explain why the same payment could be legal in London and criminal in Washington.

  (d) 'What the episode does to the lens'
  The eventual spread of the FCPA via the OECD Convention tests whether "corruption" is a universal moral category or merely coordinated Market logic. If your lens holds, the OECD adoption suggests the global triumph of Market grammar over Patrimonial and Gift logics in international commerce. It vindicates the idea that for global markets to function, all participants must agree to treat public office as distinct from private property. However, this looks less like moral discovery and more like competitive leveling. US firms initially hated the FCPA because it put them at a disadvantage; they only supported OECD expansion when it forced competitors to play by the same Market rules.

  This suggests the "universal norm" is actually a precondition for global capitalism, not an ethical absolute. The lens helps here: it shows that "corruption" only becomes a biteable moral category when Market logic is the agreed-upon grammar of the sphere. In domestic politics, Patrimonial logic might persist; in transnational trade, Market logic is enforced. The episode suggests the lens is correct that corruption is category-dependent, but wrong to imply the categories are static. The FCPA actively destroyed Patrimonial logic in international trade by criminalizing it, forcing officials to adopt Market grammar or face exclusion. The convergence wasn't moral agreement; it was regulatory harmonization. The lens survives this test well, provided we accept that Market logic is hegemonic. It explains why the norm spread: not because everyone agreed on morality, but because everyone agreed on the market rules. However, it risks underestimating genuine moral shifts within foreign societies that welcomed the anti-corruption stance as a tool against their own kleptocrats, suggesting the lens might be too cynical about the reception of the norm.

  (e) 'Verdict'
  The FCPA was neither purely moral advance nor simple imperialism; it was the necessary imposition of Market logic to sustain global capitalism. Within the sphere of international commerce, treating public office as property (Patrimonial) or relationship (Gift) creates inefficiency and unpredictability. The US legislated its mores, yes, but those mores were the operating system for the market it dominated. Calling it imperialism ignores that foreign elites often benefited from the cover of secrecy the FCPA removed. Calling it moral advance ignores the power dynamics. It is a false choice: it was a regulatory standardization that functioned morally within its specific domain while acting coercively outside it. The lens survives, but only if we admit Market logic is a constructed regime, not a natural law.
