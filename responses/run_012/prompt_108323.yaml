answer: |-
  Daniel Dennett's philosophical architecture rests upon the interplay between three predictive strategies: the physical stance, the design stance, and the intentional stance. While often presented as a nested hierarchy—where the intentional is a refined version of the design, which is itself an abstraction of the physical—the relationships are fraught with tension. Furthermore, Dennett's doctrine of 'real patterns' offers two distinct criteria for ontological commitment: the information-theoretic compression criterion and the pragmatic success criterion. To understand whether Dennett successfully navigates between hard realism and instrumentalism, one must interrogate whether these stances truly nest and whether the criteria for reality cohere.

  **The Relationship Between Design and Intentional Stances**

  Dennett frequently suggests that the intentional stance is a special case of the design stance. On this view, to adopt the intentional stance is simply to treat a system as designed for the specific purpose of processing information and acting rationally upon its environment. If the design stance asks, 'What is this system for?', the intentional stance asks, 'What does this system believe it should do to achieve what it is for?'. However, treating the intentional stance as merely a subset of the design stance obscures significant categorical differences.

  The design stance is fundamentally teleological; it relies on function. A heart valve is designed to regulate blood flow. If it fails, it is broken relative to its design. The intentional stance, conversely, is normative and rational. It relies on the assumption of consistency among beliefs and desires. When we attribute beliefs to a system, we are not merely identifying a function; we are subjecting the system to the laws of logic and probability. We assume the agent *ought* to believe the consequences of its beliefs.

  If the intentional stance were merely a special case of design, the notion of 'belief' would be redundant, collapsible into 'functional state'. Yet, belief does work that design does not. Design allows for error in execution (a glitch), but the intentional stance requires a principle of charity regarding rationality. We attribute beliefs to make the agent's actions make sense *to us* as rational observers. A thermostat fits the design stance perfectly—it has a purpose—but it strains the intentional stance. We do not typically say the thermostat 'believes' the room is cold; we say it is designed to react to cold. The attribution of belief introduces a layer of interpretative flexibility and normative constraint that mere functional description lacks. Therefore, while the intentional stance often presupposes design (in evolved or artefactual systems), it is a genuinely distinct explanatory level with commitments to rationality that the design stance does not strictly entail. The hierarchy breaks down here: design concerns *function*, whilst intentionality concerns *reason*.

  **Compression versus Success: Ontology or Instrumentalism?**

  This distinction between stances leads to the question of what makes a pattern 'real'. Dennett offers the compression criterion: a pattern is real if describing a system in its terms yields a more compact encoding of the data than rival descriptions. Simultaneously, he offers the success criterion: a stance is vindicated if it generates reliable predictions.

  The tension lies in whether compression grants ontological weight or merely restates instrumental usefulness in information-theoretic dress. Compression appears objective; a file is either compressible or it is not, regardless of the observer's goals. If the intentional stance compresses the data of a human's behaviour better than the physical stance (listing every neuron firing), then, by this metric, beliefs and desires are real patterns. They are not mere fictions; they are structural features of the world that allow for data reduction.

  However, the success criterion is unabashedly pragmatic. It asks only: 'Does it work?'. If we rely solely on success, we risk sliding into pure instrumentalism, where beliefs are useful fictions with no claim to reality. The compression criterion attempts to rescue realism from this slide. Yet, if a pattern is real *whenever* it compresses, the physical stance loses its privileged status. The physical stance is not 'uniquely correct' in describing what *really* exists; it is merely the stance that compresses best for purposes requiring micro-causal detail. For predicting human behaviour, the physical stance is computationally intractable and thus fails the compression test.

  Consequently, the comparison between the criteria reveals a fracture. Compression suggests an objective hierarchy of patterns (some are mathematically more efficient), while success suggests a relativistic hierarchy (efficient for whom, and for what purpose?). If the physical stance is just one stance among others, chosen for its utility in specific contexts rather than its proximity to 'true reality', then Dennett's account leans heavily towards a sophisticated instrumentalism. The 'reality' of the pattern is contingent upon the utility of the compression, blurring the line between what exists and what is useful to say exists.

  **Asymmetrical Cases and the Nesting of Stances**

  The fragility of the hierarchy becomes stark when examining asymmetrical cases. Consider first a system that admits of a design-stance description but no useful intentional-stance description, such as a thermostat or a heart valve. These systems have clear functions (design) but attributing beliefs and desires to them yields no predictive gain and violates the rationality constraint. Here, the design stance operates independently of the intentional. This supports the view that design is the broader category.

  Consider the reverse: a system that admits of a useful intentional-stance description but no tidy design-stance description, such as a financial market, an ecosystem, or a large institution. We often speak of 'the market wanting' to correct itself or an ecosystem 'seeking' equilibrium. These systems exhibit rational-like patterns that compress data and license predictions. Yet, they have no single designer, and their 'purpose' is emergent rather than engineered. They are not designed in the artefactual sense, nor do they have a clear evolutionary teleology in the biological sense at every moment.

  These cases reveal that the three stances do not nest neatly like Russian dolls. The intentional stance can float free of the design stance (in the sense of a specific designer's intent), just as the design stance floats free of the physical stance (in terms of multiple realisability). If the reality of a pattern is stance-relative, does this collapse into instrumentalism? Dennett argues it does not, via the 'real patterns' doctrine. The pattern of the market's behaviour is real because it is robust and compressible, even if there is no literal mind behind it. However, this requires us to accept that reality is not stance-independent. A pattern is real *relative to the stance that detects it*. This is a costly metaphysical position. It suggests that the world is not a fixed collection of objects waiting to be discovered, but a texture of patterns that only emerge under specific descriptive pressures. The comparison breaks down because the 'reality' of the market's intentionality is of a different order than the 'reality' of the thermostat's design; one is emergent and distributed, the other is historical and functional.

  **Free-Floating Rationales**

  These considerations culminate in the status of 'free-floating rationales'. Dennett uses this term to describe reasons that exist without a reasoner—such as the 'reason' a bird's wing is shaped a certain way (aerodynamics) without the bird understanding aerodynamics, or the 'reason' a market crashes without a central banker intending it.

  Based on the preceding analysis, if we accept the compression criterion, free-floating rationales are genuine patterns. They are objective features of the system's structure that allow for predictive compression. They are not mental entities floating in a Platonic ether, nor are they merely metaphors. They are real in the same way that the centre of gravity of an object is real: it is a useful, compressible abstraction that tracks physical reality without being a physical particle itself.

  However, if we prioritise the success criterion alone, they risk becoming merely instrumental heuristics. The answers to the earlier questions settle the matter only if we privilege compression over mere success. If the intentional stance works on a market because there is a genuine, compressible pattern of rationality emerging from the interactions, then the free-floating rationale is a real pattern. It is a reason without a reasoner because the 'reasoning' is done by the structure of the system, not a mind.

  Yet, this implies a significant shift in our understanding of causation. If free-floating rationales are real, then reasons can be causes without being mental states. This validates the design and intentional stances as tracking something ontological, not just pragmatic. However, it also reinforces the stance-relativity of reality. The rationale is real *for the observer* who adopts the stance that reveals it.

  **Conclusion**

  In comparing Dennett's stances and criteria, it becomes evident that the philosophical cost of his position is higher than often acknowledged. The intentional stance is not a clean subset of the design stance; it introduces normative constraints of rationality that function alone does not capture. The compression criterion offers a bulwark against pure instrumentalism, granting ontological weight to patterns, but only at the price of making reality stance-relative. The asymmetrical cases of thermostats and markets demonstrate that the stances do not form a rigid hierarchy but rather a mesh of overlapping utilities. Finally, free-floating rationales emerge as genuine patterns, provided one accepts that a pattern's reality is constituted by its compressibility and predictive power rather than its reduction to physical particles. Dennett's account does not force the stances into a single hierarchy without cost; rather, it invites us to accept a world where what is real depends upon the level of description that best captures the structure of the data. This is a robust realism, but it is a realism that has surrendered the notion of a view from nowhere.
