prompt: |-
  I coordinate the simulation lab at a nursing school and I'm the one who signs the competency forms, which means I'm the person who decides wether a student is allowed to do a thing on a real patient without someone standing next to them. It's three or four of these a month, about twenty minutes each at a bench in the sim room, and I've got a rubric from the accreditors that mostly asks whether they performed the steps in the right order. Here's why I'm asking you instead of just re-reading the rubric. Years ago I got signed off on a procedure I now think I couldn't actually do -- I could recite the whole thing, I knew every number and every contraindication, and nobody ever found out that my hands didn't know it until I was alone with a patient who hadn't read the textbook. So the thing I'm actually trying to detect isn't on the form. Somebody in my book club said that philosophers now think knowing how to do something just *is* knowing a fact -- knowing a way of doing it -- and that this is basically a licence for checklists; someone else said no, that skill is its own kind of thing and doesn't survive being written down as information. I've also never been able to shake a point somebody made about regress: if doing a skill means following a rule, and following a rule is itself a skill, then no checklist can ever fully capture what I'm certifying. Take that seriously as a design constraint, not as a curiosity.

  So build me a decision procedure I can actually run in twenty minutes on one student at a bench. What do I ask them to do first, and what am I watching for while they do it; what counts as a sufficient answer or a sufficient performance at each step and *why*; at which point does the procedure stop with a no; and where does it stop and hand the decision to a person because the question is about values rather than evidence (I'm fairly sure the pass line is one of those, and I want it labelled as such rather than buried). Tell me which of the distinctions from that knowing-how literature have to survive into a form a clinical instructor can use and which ones I can just throw away, and be explicit about where the procedure will misfire -- I'd rather have a form that tells me a truth I don't like than one that ratifies what the school already wants to hear. Two students it has to handle: the one whose hands are perfect but who can't explain a single thing they just did, and the one who can narrate the entire protocol flawlessly while their hands do something else.

  Then run it on the three I've actually got right now: (a) flawless hands, can't say why, (b) beautiful explanation, shaky hands, (c) did it once in sim last month with me prompting her through two of the steps and hasn't touched it since. I want to see at least one of those come out in a way that'll make the remediation committee unhappy. And at the end, tell me where your own procedure is most likely to be wrong, and what you'd have to learn -- some fact about how skill actually transfers from a sim room to a ward, say -- that would make you throw the whole thing out and tell me to weight the written exam instead.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **User Role:** Simulation Lab Coordinator at a nursing school.
      *   **Task:** Sign competency forms (gatekeeper for independent patient care).
      *   **Current Situation:** 3-4 students/month, 20 mins each, bench in sim room. Existing rubric focuses on step order (checklist-based).
      *   **The Problem:** The user experienced "imposter competency" (knew the facts, failed the hands-on) and suspects the current rubric misses *actual* skill (knowing-how vs. knowing-that).
      *   **Philosophical Context:** References Ryle (knowing-how vs. knowing-that), Wittgenstein (rule-following regress), and the limits of checklists.
      *   **Constraints:**
          *   Must fit in 20 minutes.
          *   Must be a concrete decision procedure.
          *   Must address the "regress" problem (rule-following requires skill).
          *   Must distinguish between evidence-based decisions and value-based decisions (the "pass line").
          *   Must handle specific student archetypes: (a) Perfect hands/no theory, (b) Perfect theory/shaky hands, (c) Prompted previously/unused since.
          *   Must be honest about failure modes (where it misfires).
          *   Must produce at least one outcome that upsets the remediation committee (i.e., fail someone the school might want to pass, or vice versa, based on rigor).
          *   Must end with self-critique (where the procedure is wrong and what data would invalidate it).

  2.  **Philosophical Grounding (The "Why"):**

      *   *Ryle's Distinction:* Knowing-how is not reducible to knowing-that. You can recite the rules without having the disposition to act correctly. *Action:* The procedure must prioritize performance over recitation, but not ignore the *adaptability* of the performance.
      *   *Wittgenstein's Regress:* Following a rule requires interpretation. A checklist cannot dictate every micro-movement. *Action:* The assessment must test *response to perturbation*, not just static step completion. If they only know the rule, they break when the rule doesn't fit the situation.
      *   *Dreyfus & Dreyfus (Skill Acquisition):* Novices follow rules; experts rely on intuition/context. We are testing for "Advanced Beginner" or "Competent" level, not Expert. They need to move beyond rigid rule-following.
      *   *Constraint:* The user wants to know which philosophical distinctions survive. *Answer:* The distinction between *rigid compliance* and *adaptive execution* survives. The distinction between "mental state" and "physical action" dissolves (we judge the action as the manifestation of the mind).

  3.  **Designing the Decision Procedure (The "How"):**

      *   *Time:* 20 minutes.
      *   *Structure:*
          1.  **Pre-Brief (2 mins):** Set the stage, check anxiety.
          2.  **Unperturbed Performance (8 mins):** Standard checklist stuff, but watching *flow*, not just boxes.
          3.  **Perturbation/Intervention (5 mins):** Break the script. This addresses the regress problem. If they only know rules, they stall when the rule is ambiguous.
          4.  **Post-Action Rationalization (5 mins):** Ask "Why?" not "What?"
      *   *Decision Points:* Clear Pass/Fail criteria.
      *   *Value Judgment:* Explicitly mark where the human judgment overrides the data (the "Pass Line").

  4.  **Handling the Archetypes:**

      *   (a) Flawless hands, can't say why: *The Intuitive Novice.* Dangerous because they can't troubleshoot.
      *   (b) Beautiful explanation, shaky hands: *The Theorist.* Dangerous because they lack psychomotor integration.
      *   (c) Prompted previously, unused since: *The Fading Memory.* Dangerous because of retention/decay.

  5.  **Drafting the Procedure (Iterative Refinement):**

      *   *Initial thought:* Just make them do it harder.
      *   *Correction:* No, make them do it *differently*. The regress argument says rules run out. So, introduce a variable the rule doesn't cover.
      *   *Safety:* Patient safety is paramount. If hands are shaky on a sterile field, that's an automatic fail (Value Judgment).
      *   *The "No" Point:* Needs to be early if safety is compromised.
      *   *The "Value" Point:* Needs to be at the end, weighing risk vs. potential.

  6.  **Addressing the Specific Cases (a, b, c):**

      *   (a) Pass hands, fail theory. *Verdict:* Conditional Pass (Remediation on theory required). Why? Because they can't adapt if the patient anatomy varies.
      *   (b) Pass theory, fail hands. *Verdict:* Fail. Why? Psychomotor skill is the baseline for "doing."
      *   (c) Prompted before. *Verdict:* Fail/Re-test. Why? Independence requires retention without scaffolding. *This one will upset the committee* if they want throughput.

  7.  **Self-Critique & Limitations:**

      *   Where does this fail? Sim-to-ward transfer is the biggest gap. Stress in sim $\neq$ Stress in ward.
      *   What would invalidate this? If data showed that "shaky hands" in sim correlate perfectly with "safe care" in wards (unlikely), or if "theory" predicts long-term safety better than psychomotor (possible).

  8.  **Refining the Tone:**

      *   The user is philosophical, experienced, and cynical about bureaucracy. The tone should be respectful, direct, intellectually rigorous, and practically grounded. No fluff. Acknowledge the burden of the role.

  9.  **Final Review against Constraints:**

      *   20 mins? Yes.
      *   Decision procedure? Yes.
      *   Philosophical distinctions addressed? Yes (Ryle/Wittgenstein).
      *   Value vs. Evidence labeled? Yes.
      *   Three cases run? Yes.
      *   Unhappy committee outcome included? Yes (Case C).
      *   Self-critique included? Yes.

  10. **Writing the Response:** (Proceeding to generate the content based on these thoughts.) *Self-correction during drafting:* Make sure I don't get too bogged down in philosophy jargon. Keep it actionable for a nurse educator. Ensure the "Value Judgment" is clearly highlighted as the user requested. Ensure the "Regress" constraint is met by the Perturbation phase.

  *(Self-Correction on Case C)*: The prompt asks for at least one outcome to make the remediation committee unhappy. Usually, committees want to pass students to keep graduation rates up. Failing Case C (who has been prompted before) is the most likely to cause friction if the school views "exposure" as "competence." I will make sure Case C results in a "Not Yet Competent" requiring a full re-test, not just a sign-off.

  *(Self-Correction on Philosophy)*: The user mentioned the "regress" argument. I need to explain *how* the procedure solves it. The solution is that we stop testing rule-following and start testing *response to rule-breakdown*. That's the only way to halt the regress in an assessment context.

  *(Final Polish)*: Ensure the distinction between "Evidence" (observable behavior) and "Value" (risk tolerance) is stark.

  Let's build it.cw
answer: |-
  This is a heavy responsibility. You are acting as a epistemic gatekeeper for patient safety, using a tool (the checklist) that you know is philosophically insufficient. You are right to worry about the regress: if competency is just following rules, who checks the rule-follower?

  Here is a decision procedure designed for your 20-minute window. It is built on the premise that **skill is not the execution of a script, but the management of the script's failure.**

  ### Part 1: The Philosophical Triage
  *What to keep, what to toss.*

  1.  **Keep: The Rylean Distinction (Knowing-How vs. Knowing-That).** You cannot reduce the physical act to a verbal report. A student who talks perfectly but moves poorly is not "half-competent"; they are incompetent at the task.
  2.  **Keep: The Wittgensteinian Regress.** A checklist ends. Reality does not. Your assessment must probe what happens *after* the checklist runs out.
  3.  **Toss: The "Mental State" Mystery.** Do not try to assess if they "really understand." You cannot see understanding. You can only see **adaptation**. If they adapt correctly to a perturbation, they understand enough for safety. If they freeze, they don't.
  4.  **Toss: The "Perfect Flow" Ideal.** Nursing is interrupt-driven. A student who pauses to think is not necessarily failing. A student who flows blindly through a safety hazard is.

  ---

  ### Part 2: The 20-Minute Decision Procedure

  **Setup:** Standard sim bench. Standard equipment. You have the Accreditor Rubric (AR) in front of you, but it is secondary to this **Competency Gate Protocol (CGP)**.

  #### Phase 1: Unperturbed Execution (0:00 – 8:00)
  **Task:** "Perform [Procedure X] as you would on a stable patient."
  **Observation:** Do not mark the AR yet. Watch the *texture* of the movement.
  **Evidence to Collect:**
  *   **Economy of Motion:** Are they hunting for tools or do they know where they are?
  *   **Sterile/Security Awareness:** Do they break field/security without noticing?
  *   **The "Glitch":** Do they hesitate at a specific step? (Note this step).

  **Stop Condition (Immediate Fail):**
  *   Breach of sterile field (for sterile procedures) or patient safety boundary (e.g., wrong site, wrong med) that they *do not self-correct*.
  *   *Why:* This is a value judgment on risk. One uncorrected breach is unacceptable risk.

  #### Phase 2: The Perturbation (8:00 – 13:00)
  **Task:** Interrupt the flow. This addresses the Regress. You are testing what they do when the rule doesn't apply.
  **Action:** Introduce **one** of the following variables mid-procedure:
  *   *Physical:* "The patient just coughed/vomited/moved their arm." (Requires re-sterilizing or re-positioning).
  *   *Equipment:* "This catheter/tube is the wrong size." (Requires stopping and swapping).
  *   *Cognitive:* "The patient just told me they are allergic to the prep solution."

  **Observation:** Watch the **Recovery Latency**.
  *   **Pass:** They stop, acknowledge the change, verbalize the risk, and adjust the plan *before* proceeding.
  *   **Fail:** They continue the original script despite the perturbation, or they freeze and look at you for the new rule.
  *   *Why:* If they need you to give them the new rule, they haven't internalized the *goal* of the procedure, only the *steps*.

  #### Phase 3: Post-Action Rationalization (13:00 – 18:00)
  **Task:** "Talk me through the step where you hesitated (or the step I interrupted)."
  **Constraint:** Do not ask "What did you do?" Ask "Why did you do it *that* way instead of *this* way?"
  **Evidence to Collect:**
  *   Can they link the action to a physiological or safety outcome?
  *   **The "Robot" Test:** If they say "Because that's the protocol," probe once: "What happens if we don't?"
  *   **Pass:** They describe a consequence (e.g., "Infection risk," "Tissue damage").
  *   **Fail:** They cannot articulate a consequence beyond "It's wrong."

  #### Phase 4: The Verdict (18:00 – 20:00)
  **Decision Matrix:**

  | Phase 1 (Hands) | Phase 2 (Adapt) | Phase 3 (Why) | Decision |
  | :--- | :--- | :--- | :--- |
  | **Safe** | **Adapts** | **Explains** | **PASS** |
  | **Safe** | **Adapts** | **No Explain** | **CONDITIONAL PASS** (See Value Judgment) |
  | **Safe** | **Freezes** | **Explains** | **FAIL** (Theorist) |
  | **Unsafe** | **Any** | **Any** | **FAIL** (Safety Risk) |
  | **Safe** | **Adapts** | **Explains** | **FAIL** (If Case C - Retention Issue) |

  ---

  ### Part 3: The Value Judgment Line
  *Where evidence ends and your signature begins.*

  There is one box on this form that is not evidence-based. It is **Risk Tolerance**.

  *   **The Evidence:** The student performed safely in the sim room *today*.
  *   **The Value:** You are betting they will perform safely on a tired Tuesday night in three months without you.
  *   **The Label:** On your internal notes, mark this as **"The Confidence Wager."**
      *   If a student is technically perfect but you have a "gut feeling" of arrogance or fragility, you have the ethical right to fail them. This is not subjective; it is a heuristic for unmeasurable variables (stress resilience, honesty).
      *   **Instruction:** If you mark "Fail" based on the Confidence Wager, you must document the specific behavioral cue (e.g., "Dismissed patient discomfort during sim"). Do not write "gut feeling."

  ---

  ### Part 4: Running the Procedure on Your Three Students

  Here is how the CGP processes your current queue.

  #### Student A: Flawless hands, can't say why.
  *   **Phase 1:** Perfect. No breaches.
  *   **Phase 2:** You interrupt. They adjust physically but look confused. They fix the problem but can't tell you why the fix mattered.
  *   **Phase 3:** You ask "Why did you swap the glove?" They say: "Because you told me to." You ask "What if you hadn't?" They say: "I don't know."
  *   **CGP Outcome:** **CONDITIONAL PASS.**
  *   **Reasoning:** They have the psychomotor skill (Ryle's Knowing-How is present), but they lack the semantic map to troubleshoot novel errors. They are safe *only* in standard conditions.
  *   **Remediation:** They must pass a verbal viva on pathophysiology before signing.
  *   **Committee Friction:** Low. Schools like passing these students.

  #### Student B: Beautiful explanation, shaky hands.
  *   **Phase 1:** They narrate perfectly. Their hands tremble. They nearly touch a non-sterile surface but catch themselves.
  *   **Phase 2:** You interrupt. They explain *exactly* what should happen theoretically. Their hands hesitate, then try to execute the theory but fumble the physical tool.
  *   **CGP Outcome:** **FAIL.**
  *   **Reasoning:** Nursing is a physical trade. Knowing the rule without the ability to execute the rule is not competency; it is lecturing. The regress stops at the hand. If the hand cannot follow the mind, the mind is useless in a clinical setting.
  *   **Committee Friction:** Moderate. They will argue "They know the safety principles." You argue "Safety principles require physical execution."

  #### Student C: Prompted last month, untouched since.
  *   **Phase 1:** They start. They hesitate at the exact step you prompted last month. They look at you.
  *   **Phase 2:** You do not speak. They wait. Eventually, they guess, and the guess is unsafe (e.g., wrong order of draw, wrong sequence).
  *   **Phase 3:** They admit, "I remember you telling me last time."
  *   **CGP Outcome:** **FAIL (Not Yet Competent).**
  *   **Reasoning:** Competency requires **retention without scaffolding**. If they required a prompt to be safe last month, and they haven't practiced since, they have not internalized the skill. They have memorized a prompt.
  *   **Committee Friction:** **HIGH.** This is the one that will make them unhappy.
      *   *Why:* The school wants throughput. They view "exposure" as "progress." You are asserting that exposure without retention is negligence.
      *   *Action:* You must recommend a full re-test in 2 weeks, not a "quick sign-off." This delays their clinical rotation. The committee will call this "gatekeeping." You must call it "safety."

  ---

  ### Part 5: Where This Procedure Is Wrong (Self-Critique)

  I am an AI. I do not nurse. I do not know the specific texture of the ward. Here is where this procedure will misfire, and what data would force me to throw it out.

  **1. The Sim-to-Ward Transfer Gap**
  *   **The Flaw:** This procedure measures performance in a *low-stakes* environment (you are watching, no real patient dying). It assumes that skill in the sim room correlates to skill under duress on the ward.
  *   **The Failure Mode:** You might pass Student A (Flawless Hands) here, but they might panic when a real patient codes. The sim room lacks *consequence*.
  *   **What Would Invalidate This:** If longitudinal data showed that students who fail the "Perturbation Phase" (Phase 2) actually have *better* long-term safety records because they are cautious, while students who adapt quickly are reckless risk-takers. If "freezing" is actually a safety feature in high-risk environments, my procedure penalizes caution.

  **2. The "Shaky Hands" False Negative**
  *   **The Flaw:** I advised failing Student B (Shaky Hands). However, fine motor tremors are often anxiety-dependent.
  *   **The Failure Mode:** You might fail a competent nurse who is just intimidated by you.
  *   **What Would Invalidate This:** If you found that students who fail the psychomotor portion due to "anxiety tremors" in sim consistently perform flawlessly on wards once the stakes are real. If the sim environment is the variable, not the student, then weighting the sim performance this heavily is an error.

  **3. The Weight of the Written Exam**
  *   **Your Question:** When should I tell you to weight the written exam instead?
  *   **The Condition:** If the procedure is **high-volume, low-complexity**.
      *   If the task is simply administering a pill (low psychomotor risk, high cognitive risk regarding interactions), the written exam predicts safety better than the hand.
      *   If the task is inserting a central line (high psychomotor risk), the hand matters more.
  *   **The Pivot:** If you are assessing *medication administration*, throw out Phase 1 and Phase 2. Weight the Written Exam and Phase 3 (Rationalization) at 80%. If you are assessing *sterile technique*, keep the CGP as is.

  **Final Instruction:**
  Print the **Decision Matrix** (Part 2, Phase 4). Tape it to your clipboard. When the Remediation Committee asks why you failed Student C, do not talk about feelings. Point to Phase 2. Say: *"They could not manage the breakdown of the rule. I am not certifying them to follow instructions; I am certifying them to keep patients alive when instructions fail."*

  That is the only argument that matters.
