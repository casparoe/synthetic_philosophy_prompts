answer: |-
  Here is the mapping of your dispute, structured according to the four analytical tasks you requested.

  ### 1. Mapping the Causal Claims

  You and your friend are not disagreeing about the history; you are disagreeing about the metaphysics of causation. Specifically, you are selecting from the three options you provided as follows:

  **Your Friend: Counterfactual Dependence**
  Your friend asserts the second option: *the absence is no cause but the deaths counterfactually depended on it.*
  When your friend says "nothing cannot kill anybody," they are relying on a Humean or physicalist intuition that causation requires a transfer of energy or a positive event. For them, the UN's inaction is a background condition, not a cause. They concede that *if* the UN had acted, the outcome would likely differ ("the dead would probably have been fewer"), but they insist this is a statement about logical dependency, not causal agency.
  *   **Defensibility:** This view is metaphysically parsimonious. It avoids the puzzle of how "nothing" can exert force.
  *   **Survival:** It survives your friend's own objection perfectly, as it agrees with the premise that omissions are not events. However, it struggles to account for legal and moral responsibility, which often treats deliberate omissions as causal acts.

  **You: Absence as Cause (reclassified as Positive Decision)**
  You assert the first option: *the absence is itself a cause alongside the others.*
  However, you refine this to avoid the metaphysical trap your friend identified. By arguing "the omission... is made of decisions," you are claiming that the "absence" of troops was actually the "presence" of a vote, a memo, or a deliberate choice. You are treating the omission not as a void, but as a positive state of affairs (the decision *not* to act).
  *   **Defensibility:** This is defensible if one accepts that decisions are events. If the Security Council voted to withdraw, that vote is a positive event that causally contributed to the lack of protection.
  *   **Survival:** This survives your friend's objection ("nothing cannot kill") by denying the premise that the inaction was "nothing." You argue it was a "something" (a policy choice). However, it risks conflating the *decision* with the *outcome of the decision*. The decision caused the troops to leave; did the decision cause the deaths, or did the deaths result from the killers *plus* the absence of troops?

  **The Third Option: Best Explanation**
  Neither of you explicitly claimed the third option (*the absence is no cause but belongs in the best explanation*), though it may be the most robust ground for your position. This view suggests that while the UN didn't "push" the victims to their deaths, citing the UN's inaction provides the most useful explanation for why the genocide was not halted. This is a pragmatic theory of causation (often associated with John Stuart Mill or David Lewis).
  *   **Defensibility:** Highly defensible in historiography and law.
  *   **Survival:** It survives your friend's objection by conceding the metaphysics (okay, it's not a physical cause) but winning on utility (we cannot explain the scale of death without referencing the UN).

  ### 2. Testing Against the Complexities of the Case

  Standard theories of causation are often built on tidy examples (e.g., "Suzy threw a rock"). The Rwanda case introduces four complexities that strain these theories.

  **A. The Omission is Composed of Decisions**
  *   **Theory Absorption:** Your theory absorbs this best. If the omission is a series of positive decisions (votes, cables, refusals), then standard event-causation applies. The Friend's theory struggles here: if the "omission" is actually a "decision to withdraw," the Friend must admit a positive event occurred.
  *   **Limit:** This only works for the *withdrawal* of existing troops. It works less well for the *failure to send* new troops. A failure to send is harder to reclassify as a positive event than a vote to recall.

  **B. Distributed Agency (Many Agents, Individually Innocent)**
  *   **Theory Absorption:** **None of the theories absorb this well.** Standard causation looks for a specific agent. In the Security Council, causation is collective. No single delegate caused the genocide; the *structure* did.
  *   **Limit:** If we treat the Council as a single agent, the theory holds. If we treat it as 15 individuals, the causal link dissolves into a "problem of many hands." The counterfactual fails because one delegate changing their vote might not have changed the outcome (depending on vetoes and majorities). The theory goes silent on how to distribute causal weight across a collective where individual contributions are necessary but insufficient.

  **C. The Counterfactual is Genuinely Indeterminate**
  *   **Theory Absorption:** **This breaks the Counterfactual Theory (Your Friend's view).** Your friend relies on the claim that "the dead would probably have been fewer." But if the counterfactual is indeterminate (e.g., if reinforcements arrived, would they have been overrun? Would they have provoked a wider conflict?), the causal claim loses its truth value.
  *   **Limit:** Your view (Absence as Decision) is more robust here. Even if we don't know *what would have happened*, we know the *decision was made*. However, if the decision had no *capacity* to change the outcome (e.g., if 2,500 troops could not have stopped the genocide regardless), then the causal link to the *deaths* is severed, even if the decision occurred. The theory cannot bridge the gap between "decision made" and "outcome prevented" without speculative history.

  **D. Extended Duration (100 Days)**
  *   **Theory Absorption:** **The Best Explanation theory handles this best.** Causation is often modeled as instantaneous. A 100-day genocide is a process. Citing the UN's continuous inaction throughout the 100 days functions as a narrative explanation rather than a mechanical cause.
  *   **Limit:** For the Friend, a 100-day "nothing" is even less of an event than a momentary one. For you, a 100-day "decision" requires explaining why the decision wasn't reversed. The theories struggle to explain how a static state (non-intervention) causes a dynamic process (escalating killing) over time without intervening variables.

  ### 3. The Normative Objection (Moral Disapproval)

  Your friend's closing move is that causal attribution here tracks moral disapproval: we call it a cause because we blame the UN. If this happened in a place "no one cared about," we wouldn't call it a cause.

  **Does this debunk the causal claim?**
  Not necessarily. This objection relies on the distinction between *causal relations* (mind-independent) and *causal selection* (mind-dependent).
  *   **The Friend's Strength:** He is right that *causal selection* is normative. In any complex situation, there are infinite conditions (gravity, oxygen, the killer's intent, the UN's absence). We select the UN's absence as *the* cause because it violates a norm (the expectation of protection). If the UN had no mandate, we might view their absence as a background condition (like the weather) rather than a cause.
  *   **The User's Defense:** This does not debunk the causal claim; it reveals that **our notion of causing is normative through and through.** Philosophers like Hart and Honoré argue that we distinguish between "causes" and "mere conditions" based on what is abnormal or intervened upon. The UN's inaction was an intervention in the expected order of international protection.
  *   **Verdict:** Your friend is right that moral judgment drives the *labeling*, but wrong that this makes the causation false. It implies that causation in social contexts is not a purely physical relation but a social one. If the theory admits that causal attribution is interest-relative, the friend's objection is absorbed. If the theory insists causation must be purely physical, the friend debunks the claim.

  ### 4. Reversing the Lens: Killing vs. Letting Die

  If we accept your position that omissions (composed of decisions) can cause, we must confront the doctrine that *killing* (acting) and *letting die* (omitting) differ in kind.

  **Does the metaphysics underwrite the moral difference?**
  *   **If Omissions Cause:** The metaphysical gap closes. If the UN's decision not to intervene is causally equivalent to a decision to intervene and kill (in terms of outcome dependency), then the metaphysical distinction between "act" and "omission" dissolves. Both are decisions that lead to death.
  *   **Implication:** If the metaphysics are identical, the moral difference cannot rest on "causality." It must rest entirely on **duty**. We judge killing worse than letting die not because the physics differ, but because the negative duty (do not harm) is stricter than the positive duty (provide aid).
  *   **The Problem:** In Rwanda, the UN had a specific mandate (a positive duty). If omissions cause, and a positive duty existed, the moral distinction between the genocidaires (killing) and the UN (letting die) narrows significantly.

  **Does the theory leave the difference looking imposed?**
  Yes. If you succeed in mapping the omission as a cause, the distinction between killing and letting die looks like a legal or conventional fiction rather than a metaphysical reality.
  *   **Where the Theory Goes Silent:** Metaphysics cannot dictate morality. Even if the UN *caused* the deaths in the same way the Interahamwe did, a moral theory might still distinguish them based on *intent* (the UN did not intend death, whereas the killers did). Causal theory is silent on intent. It can tell you who is causally relevant, but it cannot tell you who is guilty of murder versus negligence.

  **Summary of the Impasse:**
  Your friend protects the metaphysical purity of "cause" by excluding omissions, but at the cost of making the UN's role invisible to causal analysis. You protect the moral significance of the UN's role by expanding "cause" to include decisions-to-omit, but at the cost of blurring the line between acting and failing to act. The facts of the case (distributed agency, indeterminate counterfactuals) suggest that standard causal theories are insufficient for both of you; the situation requires a theory of **collective responsibility** that operates alongside, rather than inside, standard metaphysics of causation.
