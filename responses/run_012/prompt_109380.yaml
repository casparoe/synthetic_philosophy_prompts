answer: |-
  # Joint Statement on Feature Ontology and Tooling Dependence

  **Participants:** The "Realist" and The "Deflationist"
  **Date:** [Current Date]
  **Subject:** Resolving disputes regarding the ontological status of discovered features in mechanistic interpretability.

  After three months of adversarial collaboration, we agree on the empirical landscape but disagree on its metaphysical interpretation. Below is our consolidated position, the precise remaining faults lines, and the experiments required to settle them.

  ### 1. Points of Consensus
  We both accept the following empirical claims and methodological constraints:

  1.  **Tooling Dependence:** Feature decompositions are sensitive to hyperparameters (e.g., sparsity penalties, dictionary size). Changing these parameters yields different sets of features that all achieve low reconstruction loss.
  2.  **Utility Equivalence:** Competing decompositions (e.g., the "single clean feature" vs. the "three overlapping ones") are functionally equivalent regarding reconstruction accuracy and human interpretability scores.
  3.  **Architectural Priors:** Sparse dictionary learning on random-weight models yields features that pass standard interpretability and reconstruction tests, indicating that some "features" arise from the architecture and tooling rather than trained semantics.
  4.  **Transplantation Variance:** Feature transplantation is not binary. Some features transfer causal efficacy across models; others fail. Success correlates with, but is not guaranteed by, high interpretability scores.
  5.  **Steering Capability:** Both sides agree that adding decoder directions can steer model behavior. We disagree on whether this steering proves the existence of an internal *representation* or merely identifies a *control interface*.

  ### 2. Precise Points of Disagreement
  We disagree on the following specific propositions. Each statement is worded to be acceptable to its proponent while clearly contradicting the other.

  *   **The Convergence Claim:**
      *   *Realist:* There exists a preferred decomposition of the model's activations that minimizes reconstruction loss while maximizing causal stability. Current tooling approximates this ground truth; discrepancies are due to insufficient optimization or poor hyperparameter choice.
      *   *Deflationist:* There is no preferred decomposition independent of a specific loss function and sparsity constraint. "Ground truth" is a category error; there are only different compressions suited to different tasks.
  *   **The Representation Claim:**
      *   *Realist:* A feature that survives transplantation and causal intervention corresponds to a variable explicitly used by the model's computation graph. It is part of the model's ontology.
      *   *Deflationist:* A feature that survives transplantation corresponds to a direction in activation space that is linearly decodable and causally effective *relative to our intervention*. It is part of our ontology imposed on the model.
  *   **The Random Weight Implication:**
      *   *Realist:* Features found in random-weight models are artifacts of reconstruction pressure that lack semantic grounding; they will fail robust causal tests compared to trained features.
      *   *Deflationist:* Features found in random-weight models demonstrate that "interpretability" is often a match between human priors and the geometry of high-dimensional space, not evidence of learned semantics.

  ### 3. Cruxes and Pre-Registered Tests
  We identify three sub-questions where empirical resolution would force one side to update significantly.

  **Crux 1: The Limit of Sparsity**
  *   **Question:** As we increase dictionary size and tune sparsity penalties toward an optimal frontier, do features stabilize or fragment?
  *   **Test:** Train dictionaries on the same model across an order-of-magnitude range of sizes and penalties. Measure feature stability (overlap of top-activating inputs) between adjacent hyperparameter settings.
  *   **Realist Prediction:** Stability increases. Features converge to a stable set as capacity becomes sufficient to carve the "joints."
  *   **Deflationist Prediction:** Stability decreases. Features continuously fragment or merge based on the penalty; there is no convergence point, only a Pareto frontier of trade-offs.

  **Crux 2: Cross-Architecture Transplantation**
  *   **Question:** Is causal efficacy tied to the semantic concept or the linear subspace?
  *   **Test:** Transplant a specific feature (e.g., "surname detection") from Model A into Model B (same architecture, different seed) and Model C (different architecture, same task). Normalize for activation magnitude.
  *   **Realist Prediction:** Success correlates with semantic necessity. Model B and C will both exhibit the behavior if the computation is required, even if the subspace alignment is imperfect.
  *   **Deflationist Prediction:** Success correlates with subspace alignment. Model B will work (similar geometry); Model C will fail (different geometry), regardless of semantic necessity.

  **Crux 3: The Random Weight Baseline**
  *   **Question:** Do "interpretable" features in random models possess causal leverage comparable to trained models?
  *   **Test:** Select top-rated interpretable features from trained and random-weight models. Perform causal ablation (zeroing out the feature) and measure perplexity/accuracy drop on relevant tasks.
  *   **Realist Prediction:** Trained features show significantly higher causal leverage on specific tasks than random features.
  *   **Deflationist Prediction:** Causal leverage distributions are similar. The difference is that trained models have more *dense* networks of such features, not qualitatively different ones.

  ### 4. Verbal Dispute vs. Substantive Residue
  We acknowledge that a portion of this dispute is verbal, centering on the word **"representation."**

  *   **The Verbal Component:** If "representation" means "a variable used by the gradient descent process to minimize loss," the Realist wins. If "representation" means "a distinct, human-intelligible concept isolated from the substrate," the Deflationist wins. We agree to stop using the word "representation" without qualification.
  *   **The Substantive Residue:** Once terminology is stripped, the disagreement is about **predictive power.**
      *   The Realist claims that treating features as real entities allows us to predict model behavior on unseen tasks and architectures (generalization).
      *   The Deflationist claims that treating features as tool-dependent constructs prevents us from making false generalizations and forces us to re-validate features for every new model (robustness).

  **Resolution Condition:** If the Realist's features successfully predict behavior in Model C (different architecture) without re-tuning, the Deflationist accepts the "realist" stance for practical purposes. If the Deflationist's tooling analysis successfully predicts why Realist features fail to transfer, the Realist accepts the "deflationist" stance for practical purposes.

  We commit to running the tests in Section 3 before resuming theoretical debate.

  **Signed,**
  *The Realist*
  *The Deflationist*
