answer: |-
  Dear Colleague,

  Here is a plan for your seventy-five-minute session on the Kalai–Smorodinsky solution, designed to navigate the split between your philosophers and economists while ensuring the conceptual architecture holds together. The session must be carried by a single worked case that you construct on the board rather than projecting from a textbook, as drawing it live forces the students to track the geometry rather than skim a formula. You should set up a scenario involving two partners, Alice and Bob, dissolving a joint venture where they must divide the proceeds of a specialized machine. The key features you must build into this example are an asymmetric disagreement point and a kinked Pareto frontier. Give Alice a high capacity to enjoy the surplus because she knows how to run the machine, giving her a high maximum possible utility, but give Bob a markedly better outside option, perhaps a lucrative job offer waiting if the deal fails, which places his disagreement utility high relative to Alice's. This ensures the disagreement point sits well off the diagonal. The frontier should be kinked, not smooth, which you can justify by introducing a capacity constraint where the machine operates efficiently up to a point and then requires costly overtime, creating two linear segments with different slopes. This kink is essential because it prevents the Nash solution from being defined by a simple tangency condition that looks too much like calculus optimization, and it ensures the Nash and Kalai–Smorodinsky solutions visibly diverge without requiring numerical computation to prove it.

  The order in which you introduce the components is critical because each concept relies on the previous one to define its coordinates, and if you scramble this sequence, the axiomatic motivation collapses. You must begin with the disagreement point, not merely as a coordinate but as the origin of claims. You need the students to understand that bargaining is not about dividing absolute utility but about dividing the surplus over and above what happens if they walk away. If you introduce the ideal point before they have a firm grip on the disagreement point, they will treat the ideal point as an aspiration rather than a mathematical bound derived from the feasible set relative to the fallback. Once the disagreement point is fixed on the axes, you must draw the feasible set and highlight the Pareto frontier. This must come second because the ideal point is defined by the boundaries of this set. You cannot define the maximum possible utility for Alice without knowing the limits of what is feasible for Bob, and specifically, you need the individually rational subset of the feasible set. Only after the frontier is drawn can you introduce the ideal point, which you must construct by drawing horizontal and vertical lines from the extremes of the frontier to the axes. It is vital that you construct this visually so they see the ideal point lies outside the feasible set. If you assert the ideal point without deriving it from the frontier's extrema, the economists will treat it as a parameter and the philosophers will argue about its normative status rather than its geometric definition. Once the ideal point and disagreement point are both fixed, you can draw the ray connecting them. This ray must come fourth because it represents the proportionality of gains, which is meaningless without both the origin of gains and the maximum possible gains. Finally, the solution is the intersection of this ray and the Pareto frontier. This sequence ensures that the solution is seen as a consequence of the geometry of claims rather than an arbitrary formula.

  Regarding the misconceptions you listed, you need to intervene at specific moments to prevent them from calcifying. Your guess that students will treat the ideal point as a feasible outcome being offered to them is correct, and they will arrive with this intuition immediately when you plot the point. You must head this off the moment you draw the ideal point by explicitly labeling it utopian and asking if any point on the vertical line above the frontier is achievable. Your guess that they will assume the solution equalizes the parties' utilities is also correct, but this misconception forms during the session when you draw the ray. Students see the line connecting the disagreement to the ideal and assume it implies equal absolute utility. You must correct this when you define the ray by emphasizing that it equalizes the ratio of actual gain to maximum possible gain, not the utility levels themselves. Your guess that they will hear the monotonicity axiom as a restatement of Pareto optimality is the one that is wrong. They will not confuse these two; they understand Pareto optimality as not wasting resources. The confusion they will actually form during the session is between Monotonicity and Independence of Irrelevant Alternatives. They will not arrive thinking Independence of Irrelevant Alternatives is a platitude any decent solution must satisfy. Instead, they will arrive indifferent to axioms and will form the view during the session that Monotonicity is the platitude because it sounds like fairness, while Independence of Irrelevant Alternatives will seem like a technical constraint they are willing to discard. You need to head this off when you introduce the axioms by explicitly framing the trade-off as a choice between two compelling intuitions rather than one platitude and one technicality. You must make them feel the pain of violating Independence of Irrelevant Alternatives before they accept Kalai–Smorodinsky, otherwise they will not appreciate what the solution costs.

  The moment where the Nash and Kalai–Smorodinsky solutions visibly come apart must be engineered through the kink in your case. If the frontier were smooth, the Nash solution would be the point of tangency with a hyperbola, and the Kalai–Smorodinsky solution would be the intersection of the ray. In many smooth cases, these are close. In your kinked case, you should arrange the geometry so the ray passes through one linear segment while the Nash product is maximized at the kink itself. This makes the divergence unavoidable because the Nash solution respects the local trade-off rates at the kink while the Kalai–Smorodinsky solution ignores the local shape and follows the global claim ratio. If you do not engineer this kink, the economists will assume Kalai–Smorodinsky is just Nash with a different formula for the same outcome, and the session will fail. You must pause at this intersection and ask them to verify that the Nash solution would stay at the kink even if the ideal point moved, whereas the Kalai–Smorodinsky solution would slide along the frontier to maintain the proportional gain. This visual slide is where the work of the monotonicity axiom becomes visible.

  You should leave out the extension of the solution past two players, and you must say out loud that you are leaving it out. The ray construction in three or more players becomes an intersection of a line with a surface in higher dimensions, and the characterization theorems become significantly more complex involving additional axioms to handle coalition consistency. If you do not mention this omission, the economists will assume the formula generalizes trivially and the philosophers will assume the normative justification holds for groups, and both will be misled. Tell them explicitly that the two-person geometry relies on there being only one ray between two points, and that multi-player bargaining introduces coalition threats that this model does not capture. This honesty preserves your credibility and prevents them from over-applying the tool later.

  Finally, you need one question to put to them at the end that shows whether they can say what work the monotonicity axiom is doing. Do not ask them to define monotonicity. Instead, ask them this: If we expand the feasible set by adding options that are worse for both parties than the current solution, does the Kalai–Smorodinsky solution change? The correct answer is yes, because the ideal point moves, changing the slope of the ray, whereas the Nash solution would remain unchanged due to Independence of Irrelevant Alternatives. If they can answer this, they understand that Kalai–Smorodinsky cares about the shape of the entire set via the ideal point, not just the local properties at the solution. This question forces them to distinguish between the two solutions based on how they react to irrelevant alternatives, which is the core theoretical contribution of the session. If you follow this order and manage these interventions, the philosophers will have the normative argument about claims they crave, and the economists will have the comparative statics they need, without either group dismissing the other's concerns.
