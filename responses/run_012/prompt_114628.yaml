answer: |-
  # Taxonomy of Intentionality: A Decision Tree

  **Instructions:** Start at **Node 1**. Answer **Yes** or **No** to proceed down the branches. The leaves classify the system's intentionality status.

  ### **Node 1:** Is the Original/Derived distinction objective, or is all intentionality observer-relative?
  *   **No (Observer-Relative):** Go to **Node 2**.
  *   **Yes (Objective):** Go to **Node 3**.

  ### **Node 2:** If observer-relative, is intentional talk useful (real patterns) or false (folk error)?
  *   **Useful/Real Patterns:** → **Leaf A**
  *   **False/Error:** → **Leaf B**

  ### **Node 3:** Does genuine (original) intentionality require phenomenal consciousness (experience)?
  *   **Yes:** → **Leaf C**
  *   **No:** Go to **Node 4**.

  ### **Node 4:** Does the state require a history of selection (evolution or design) to fix function?
  *   **Yes:** Go to **Node 5**.
  *   **No:** Go to **Node 6**.

  ### **Node 5:** Must the bearer be a biological individual (excluding artifacts/groups)?
  *   **Yes:** → **Leaf D**
  *   **No:** → **Leaf E**

  ### **Node 6:** Must the system be capable of genuine *mis*representation (not just causal error)?
  *   **Yes:** → **Leaf F**
  *   **No:** → **Leaf G**

  ---

  ## **The Leaves**

  | Leaf | Position | Status of Cases (Two-bitser / Edibility Organ / Corporation) | Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **A** | **Dennettian Instrumentalism** | Derived / Derived / Derived (but real patterns) | Intentionality is real if the predictive stance works, even if the physics is deterministic. |
  | **B** | **Eliminativism** | None / None / None | You do not actually believe the content of this handout; folk psychology is false. |
  | **C** | **Phenomenal Intentionality** | As-If / As-If / As-If | Unconscious mental states (if they exist) are only derivatively intentional. |
  | **D** | **Bio-Teleosemantics** | As-If / **Original** / As-If | A perfect physical duplicate created by accident (Swampman) has no thoughts. |
  | **E** | **Liberal Teleosemantics** | Derived / **Original** / **Original** | A thermostat or corporation can literally have beliefs distinct from its parts. |
  | **F** | **Interpretational Realism** | Derived / **Original** / **Original** | Content is fixed by rational interpretation, not internal mechanism. |
  | **G** | **Pure Causal Information** | **Original** / **Original** / **Original** | **[THEORETICALLY UNSTABLE]** Cannot distinguish signal from noise without a norm for error. |

  ---

  ## **Seminar Notes & Edge Cases**

  **1. Indistinguishable Leaves (A vs. E):**
  On artifacts (Two-bitser, Chess Engine, LLM), **Dennettian Instrumentalism (A)** and **Liberal Teleosemantics (E)** often converge. Both allow derived intentionality to be "real enough" for science, differing only on whether the source is *selection* or *predictive utility*. Practically, they treat the LLM the same; metaphysically, they disagree on *why*.

  **2. Empty/Unstable Combinations:**
  *   **Leaf G (Pure Causal):** Marked **Theoretically Unstable**. Without selection (Node 4) or norms of misrepresentation (Node 6), the theory cannot explain error. If a state is caused by X, it represents X. If it fires when Y is present, it represents Y-or-X. Error vanishes.
  *   **Consciousness + Selection:** Not a separate leaf. If Consciousness (Node 3) is sufficient, requiring Selection (Node 4) is **Redundant**. (Why need evolution if experience suffices?)

  **3. Case Key:**
  *   **Two-bitser/Thermostat:** Searle says *As-If* (Leaf C); Dennett says *Derived* (Leaf A/E).
  *   **Edibility Organ:** The crux. Bio-Teleo (Leaf D) says *Original* (it has a function). Searle (Leaf C) says *As-If* (no experience).
  *   **Corporation:** Liberal Teleo (Leaf E) says *Original* (group agent). Searle (Leaf C) says *Derived* (aggregate of individuals).
  *   **LLM:** The testing ground for Leaf A (Real Pattern) vs. Leaf C (As-If).
