answer: |-
  Dear Colleague,

  It is a pleasure to hear from you, and I admire your willingness to grapple with the pedagogical architecture of this session rather than simply filling the time with arguments. You are right to suspect that the order of operations here is not merely a matter of tidiness but of intelligibility. If you begin by stating the thesis, as naturally occurs to those of us who know the material, you will lose the room immediately because the claim will sound either like a biological triviality or a verbal stipulation. The order is forced because you must secure the coherence of de re modality before you can constrain it. You need to spend the first fifteen minutes establishing that we can make sense of talking about this very person in a different situation without changing who they are. If you do not lock in the intuition that Nixon could have lost the election while remaining Nixon, the claim that he could not have had different parents will register as a contradiction rather than a discovery. Once they accept that some properties are contingent, you can ask which ones are not. Only then does the origin claim register as a substantive metaphysical constraint rather than a definition. If you reverse this and start with the origin claim, they will treat it as a rule for using the word person, which leads directly to the linguistic misconception you fear. So the sequence must be the intuition of cross-world identity, then the distinction between metaphysical and epistemic possibility, then the thesis, and only then the case study.

  Regarding the case, your instinct to avoid the standard Queen Elizabeth example is correct because it feels archaic and distant to second-year students, but I would advise caution with your gene correction variant. You should use the IVF scenario where the same gametes meet in a dish rather than a body, but you should drop the gene correction for the initial presentation. The case must have numerical identity of the gametes across the scenarios while lacking continuity in the causal process of conception. This isolates the gametes from the biological routine of sex, forcing them to decide whether the origin is the material cause or the procedural history. If you introduce the gene correction immediately, you invite the confusion between genetic content and gametic identity before they have grasped the gametic claim itself. They will start arguing about whether changing a gene changes the gamete, which is a biological question that distracts from the metaphysical one. Use the IVF context shift to establish that the causal route is not essential. Then, if and only if they raise the objection that DNA is what really matters, bring in the gene correction or a cloning example to show that identical DNA from different gametes does not yield the same person. If you feel the IVF case is too technical or risks turning into a bioethics discussion, the alternative is to use a modernized natural conception case involving a specific time and place shift, but your IVF idea is stronger for this generation provided you keep the genetic variable constant at the start.

  You have identified the right misconceptions, but they must be addressed at specific junctures or they will derail the sequence. The epistemic misconception must be headed off immediately after you state the thesis. If they think this is about how we know who someone is, you cannot do metaphysics. Tell them explicitly that we are talking about what is possible, not what is knowable, and do not let them return to it. The genetic misconception should be met when you discuss the case, using the gene correction variant only as a rebuttal if they claim DNA is the essence. The regress objection should be allowed to surface after the thesis is defended because it shows they are engaging with the implications, and you dissolve it by distinguishing between originating causes and subsequent causal chains. The worry about freedom and the necessary past is a distraction at this level; acknowledge it but bracket it as a problem for action theory. The linguistic misconception is the one that kills the session. If they leave thinking this is just about how we use the word person, you have failed. This cannot be met head-on as a separate point; it must be dissolved by the way you handle the case. You must insist that we are tracking the thing, not the name. If this survives to the end, the session has failed.

  You are also correct to keep counterpart theory, transworld identity criteria, and the debates about artifacts out of the room. None of these are load-bearing for this specific hour. Introducing counterpart theory will suggest that the thesis is merely a feature of a specific semantic framework, which reinforces the linguistic misconception. Transworld identity needs a pragmatic handle, not a theory, and treating it as a primitive intuition they already use when thinking about counterfactuals is sufficient. Artifacts and natural kinds introduce analogies that are contentious enough to swallow the remaining time. You should openly decline to explain these by telling them that those are tools for advanced seminars and that today is about getting the core intuition right.

  For the last ten minutes, do not ask them to recite the thesis or apply it to a standard example. Ask them this: If it turned out tomorrow that we discovered human reproduction worked differently than we thought, would that change who you are? If they say yes, they have collapsed metaphysics into science. If they say no, ask them why the origin matters if the biology changes. This forces them to articulate whether the necessity lies in the world or in our description of it. Finally, trust your preparation. You know the material, and your students are capable of more than they think, provided you do not let them hide behind semantics.

  Best wishes for the lecture.
