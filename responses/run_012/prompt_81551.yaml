  2.  **Deconstruct the Core Concept (Debate-based Oversight):**
      *   *The Hope:* Truthful arguments are easier to verify/defend than lies. A lie requires a consistent web of falsehoods; truth relies on reality.
      *   *The Mechanism:* Debater A vs. Debater B. Judge J. J has limited ability to check evidence (budget).
