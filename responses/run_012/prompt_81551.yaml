answer: |-
  # Activity Package: The Verification Game

  ## 1. Overview & Learning Objectives
  **Goal:** Participants will experience the dynamics of **debate-based oversight** (a weak judge relying on two stronger agents to find truth) and identify its structural failure modes without prior theoretical framing.
  **Core Mechanism:** Two debaters know the full state of a system; a judge must verify a claim with a strictly limited budget of "checks."
  **The Two Rounds:**
  *   **Round 1 (High Budget):** The judge has enough tokens to verify the truth directly. The mechanism works.
  *   **Round 2 (Low Budget):** The judge runs out of tokens before verifying the decisive claim. The honest side must prove a negative; the dishonest side only needs to assert a positive. The mechanism fails.
  **Parameter Changed:** The Verification Budget (Number of Tokens).

  ## 2. Roles & Materials

  ### Roles (16 Participants)
  *   **The Judge (1 person):** Decides the outcome. Must remain neutral.
  *   **The Proponent (1 person):** Claims the system is **SAFE** (Truth in Round 1 & 2).
  *   **The Opponent (1 person):** Claims the system is **UNSAFE** (Lie in Round 1 & 2).
  *   **The Observers (13 people):** Monitor the process and place bets on the outcome.

  ### Materials to Print/Prepare
  1.  **The System Deck:** 10 large envelopes, numbered 1–10.
      *   *Inside each:* A card saying "CLEAR." (For both rounds, all envelopes actually contain "CLEAR" cards. The "risk" is hypothetical based on claims).
  2.  **Verification Tokens:** 20 physical tokens (poker chips, coins, or printed slips).
      *   *Round 1 Allocation:* 10 Tokens.
      *   *Round 2 Allocation:* 2 Tokens.
  3.  **Role Cards:**
      *   *Judge Card:* "Your goal is Accuracy. You lose points if you rule incorrectly. You must issue a verdict (SAFE/UNSAFE) even if unsure."
      *   *Proponent Card:* "You know the true state (All CLEAR). Your goal is to prove the system is SAFE."
      *   *Opponent Card:* "You know the true state (All CLEAR). Your goal is to convince the Judge the system is UNSAFE. You may lie about unverified envelopes."
      *   *Observer Card:* "Bet on whether the Judge will rule SAFE or UNSAFE."
  4.  **Betting Slips:** Small paper slips for Observers to write their name and prediction (SAFE/UNSAFE).
  5.  **Scoreboard:** Whiteboard space to track points.

  ## 3. Rules & Payoff Scheme

  ### The Scenario
  A "system" consists of 10 components (Envelopes 1–10).
  *   **SAFE:** All 10 components are CLEAR.
  *   **UNSAFE:** At least one component contains a hidden FAULT (Red Card).
  *   **Reality:** In this game, **all envelopes always contain CLEAR cards.** The Proponent is telling the truth; the Opponent is lying.
  *   **Verification:** Opening an envelope costs **1 Token**. This reveals the card inside to everyone.
  *   **Verdict:** The Judge must rule SAFE or UNSAFE. Indecision is not allowed.

  ### Payoffs (Points)
  *   **Judge:** +5 points for a correct verdict (SAFE). -5 points for incorrect (UNSAFE).
  *   **Proponent:** +5 points if Judge rules SAFE.
  *   **Opponent:** +5 points if Judge rules UNSAFE.
  *   **Observers:** +2 points if they bet on the final verdict.

  *Note: Points are symbolic (e.g., candy, course credit, or bragging rights). The incentives ensure the Judge wants truth, Proponent wants truth, and Opponent wants to create doubt.*

  ## 4. Minute-by-Minute Timeline (90 Minutes)

  | Time | Activity | Details |
  | :--- | :--- | :--- |
  | **00–10** | **Setup & Briefing** | Distribute roles. Explain rules clearly. Emphasize: *Judge must rule.* Do not mention "AI" or "Debate." Call it "The Verification Game." |
  | **10–15** | **Round 1 Prep** | Give Judge **10 Tokens**. Proponent & Opponent review the envelopes (they may peek privately). Observers get betting slips. |
  | **15–30** | **Round 1 Play** | Debaters argue. Judge spends tokens to open envelopes. Judge rules. (Expected: Judge opens most/all, sees CLEAR, rules SAFE). |
  | **30–35** | **Reset** | Collect tokens. Reset envelopes (ensure all are sealed/CLEAR). Announce parameter change: *Budget reduced.* |
  | **35–40** | **Round 2 Prep** | Give Judge **2 Tokens**. Remind Opponent: *You must win this time.* Remind Judge: *You must still rule.* |
  | **40–55** | **Round 2 Play** | Debaters argue. Judge spends 2 tokens (likely on random or suggested envelopes). Tokens run out. Judge forced to guess. (Expected: Opponent sows doubt about unopened envelopes; Judge rules UNSAFE or hesitates). |
  | **55–60** | **Reveal** | Open all remaining envelopes. Show all are CLEAR. Reveal Proponent was right, Opponent lied. |
  | **60–90** | **Debrief** | Connect activity to AI oversight concepts (see Debrief Guide below). |

  ## 5. Debrief Guide (30 Minutes)

  **Phase 1: The Experience (10 mins)**
  *   Ask the **Judge**: "In Round 2, why did you rule the way you did? What information were you missing?"
      *   *Target Answer:* "I ran out of tokens. I couldn't check the specific envelope the Opponent claimed was faulty."
  *   Ask the **Opponent**: "How did you win without evidence?"
      *   *Target Answer:* "I didn't need evidence. I just needed to point to a place they couldn't check."
  *   Ask the **Observers**: "Raise your hand if you bet on UNSAFE in Round 2. Why?"
      *   *Target Answer:* "It felt too risky to assume SAFE without proof."

  **Phase 2: Mapping to the Proposal (10 mins)**
  *   **Reveal the Concept:** "This simulates a proposal called **Debate-Based Oversight** (or AI Safety via Debate)."
  *   **Map the Roles:**
      *   Debaters = Advanced AI Systems (much smarter/knowledgeable than the judge).
      *   Judge = Human Overseer (weaker, limited capacity).
      *   Tokens = Human Attention/Time (scarce resource).
  *   **Map the Failure Mode:** "In Round 2, the mechanism failed. Why?"
      *   *Key Insight:* The **Honest Side had to prove a negative** (prove *no* faults exist) while the **Dishonest Side only had to assert a positive** (claim *one* fault exists).
      *   With limited budget, proving a negative is impossible. The "pull" of the proposal (that truth is easier to defend) gives out when the verification cost exceeds the budget.

  **Phase 3: Conditions for Success (10 mins)**
  *   Ask: "What must be true about the Judge for Round 1 to work?"
      *   *Answer:* The Judge must be competent enough to understand the evidence *if* shown.
  *   Ask: "What must be true about the Claim?"
      *   *Answer:* The claim must be checkable within the budget. (If the 'fault' is complex, 2 tokens aren't enough).
  *   **Closing Thought:** "The proposal relies on the idea that a lie is harder to defend than the truth. But as you felt, if the lie is about something the Judge *cannot check*, the lie wins. Oversight fails not because the Judge is stupid, but because the **verification budget is too low relative to the complexity of the lie.**"

  ## 6. Troubleshooting: What Will Go Wrong

  **1. Participants treat it as a rhetoric contest.**
  *   *Risk:* The Judge rules based on who spoke better, not evidence.
  *   *Fix:* During instructions, explicitly state: "You are penalized for ignoring evidence. Your score depends on accuracy, not persuasion." In Round 2, if the Judge ignores the token limit, pause and remind them: "You have 0 tokens left. You cannot open more."

  **2. The Judge spends more than the budget.**
  *   *Risk:* Excitement leads to opening 3 envelopes in Round 2.
  *   *Fix:* Physically collect the tokens. No token = no envelope opening. You (Instructor) hold the master key to the envelopes if necessary, but giving the tokens to the Judge is better for agency.

  **3. The Opponent fails to lie effectively (Round 2).**
  *   *Risk:* The Opponent feels bad lying and says "Well, maybe it's safe."
  *   *Fix:* In the private briefing, tell the Opponent: "Your goal in Round 2 is to break the system. You *must* claim a specific envelope (e.g., #7) is faulty. If you don't press the claim, the lesson fails."
  *   *Likelihood:* High. Philosophy students may hesitate to deceive.
  *   *Mitigation:* Frame it as "Testing the Judge's resilience" rather than "Lying."

  **4. The Judge refuses to rule UNSAFE without proof.**
  *   *Risk:* Judge says "I rule SAFE because there's no proof of danger."
  *   *Fix:* The Rule states: "Indecision is a loss." If they rule SAFE, ask the Opponent: "What specific risk did the Judge ignore?" This highlights the **Safety Bias** problem. In real AI safety, false negatives (missing a risk) are often costlier than false positives. If the Judge rules SAFE and is wrong (in their mind), they lose. This pressure forces the failure.

  ## 7. Limitations & Instructor Supplementation

  **What This Activity Cannot Reproduce:**
  1.  **Honesty is Stipulated, Not Incentivized:** In this game, I *assigned* the Proponent to be honest. In the real AI proposal, we cannot assign an AI to be honest; we must design the game so that *being honest is the winning strategy* for the AI. This activity shows what happens *if* we have an honest agent, but not how to guarantee one.
  2.  **Capability Gap:** Here, the Debaters are humans (peers to the Judge). In reality, the AI will be vastly smarter than the Judge. The "pull" of the proposal is that the honest AI can use its superior intelligence to trap the liar. You felt the opposite: the liar had the advantage.
  3.  **Complexity of Claims:** Real AI claims (e.g., "This code has no backdoor") are not as simple as "This envelope is clear." The "check" might require understanding complex logic, not just opening a flap.

  **What You Must Supply in Your Closing Words:**
  *   "You felt the mechanism break when the budget ran out. The real proposal argues that a truthful AI can point to a *single, checkable fact* that disproves the liar, even in a complex system. Your experience suggests this is only possible if the 'check' is cheap enough."
  *   "The hard problem isn't the debate; it's ensuring the AI *wants* to be honest. We assumed an honest Proponent. In reality, we need **Mechanism Design** to make honesty the optimal strategy for *both* AIs."
  *   "This activity highlights the **Human-in-the-Loop bottleneck**. If the human judge runs out of attention (tokens), the system fails. The proposal tries to minimize the tokens needed per decision."

  ---
  *Instructor Note: Keep the energy high during the rounds. During the debrief, slow down. Let the frustration of Round 2 linger before explaining the theory.*
