  constraints: realistic setting (workplace, market, hospital, lab, that kind of thing -- no aliens, no demons, no exotic physics). one paragraph for the scenario itself. the system has to have a perfectly good design-stance decomposition, i.e. parts whose functions you can actually name, so the design stance is a live option and not a strawman. it must not have been designed or selected for the aggregate behaviour you're asking about -- its parts got their settings from something with no feedback about that behaviour, so there's no real design to point at. and the physical stance has to be fully available: with enough compute you could simulate the thing exactly. no chess engines, no boids, no ant colonies, i've used those already.

  then do the check. for each of the three stances, say what it says about the system and what it predicts in each context. be explicit about where the compression gain comes from and give a rough accounting of it (orders of magnitude are fine, dont fake precision). say whether the intentional story here is one pattern or two. name the single feature of the case that's doing the work. then remove that feature and tell me what the case collapses into -- probaly the boring case where the intentional stance is the best global pattern, but say so if it doesnt. then the hard part: is a context-indexed intentional pattern still a real pattern, or does that move just relabel the disjunction? give the strongest version of dennett's reply and the strongest version of the objection that the compression gain is an artifact of my description language.

  what the case is for: i'm arguing that compressing and unifying can come apart, so the gap has to fall out of the mechanics rather than get stipulated. dont hand me the conclusion, build the case.
