  I'm putting together the final for a third-year course on Indian epistemology, and I want one long-answer question on anekāntavāda that a student can't pass just by retelling the blind men and the elephant or writing 'all views are true from some standpoint'. In class we've already given them the seven predications (asti, nāsti, both, avaktavya the inexpressible one, and then the three combinations that fold in the inexpressible), each with the syāt prefix, and we've stressed that a naya is a partial standpoint while anekānta is supposed to be the recognition that every such standpoint is partial, not a standpoint of its own. So the question should make them commit on what syāt is actually doing -- a hedge, a third truth value, or a respect-relativiser -- and then run them into the two objections I keep hammering: that the joint predication is just a contradiction wearing a qualifier, and that if everything is many-sided then the doctrine of many-sidedness is too. And I want them to say whether the Jain idea of a liberated omniscient being who sees all aspects at once rescues the view from being plain relativism or just relocates the problem. Give me the question, a model answer around 600 words, and a 25-mark scheme that names the exact moves a first-class answer has to make and the exact wrong turns that should cost marks.
