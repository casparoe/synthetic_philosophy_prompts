answer: |-
  You press me upon the point which weighs most heavily upon my own contemplation of these matters, and I confess it is not my assertion that a man is truly free merely because he may choose which master he shall serve for the day. If necessity compels him to serve some master, his liberty is but a name, and I have never sought to defend the present system of wage labour as a finality for the human race. My distinction rests not upon the mere act of selling labour, which I concede is often a transaction of desperation, but upon the prospect of what follows that sale. In the present arrangement, the fruit of his industry beyond his wage belongs to another who risks capital but contributes no toil; in the cooperative system I envision, the labourer becomes a capitalist in his own right, sharing in the risk and the reward. The decision-making you speak of—somebody must always decide—is indeed unavoidable, yet there is a profound moral difference between authority exercised over servants for the benefit of a proprietor, and authority delegated by partners for the benefit of the whole concern.

  As to the charge that I bid the working class wait while the landlord reaps the unearned increment, I must clarify that I do not defend the increment of land, which I hold belongs rightly to the community, but rather I caution against rushing into an industrial system for which the moral character of the people is not yet ripened. If we establish a system requiring high public spirit among men trained only in selfish competition, we shall not get liberty, but a new kind of tyranny, perhaps more stifling because it claims to act in the name of all. I am not asking you to wait in passivity, but to build the character within the existing framework that will make the new framework safe. I would be glad to be proved wrong, for my heart lies with the improvement of the condition of the labourer, but I fear the remedy may kill the patient if applied before the constitution is strong enough to bear it.

  **What would change my mind:** Concrete evidence that large-scale worker cooperatives can compete with private firms without sacrificing economic efficiency, and that they can manage internal governance without suppressing individual dissent or liberty.
