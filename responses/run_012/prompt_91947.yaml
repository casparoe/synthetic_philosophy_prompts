      (Drafting Para 1): You press me upon the point which weighs most heavily upon my own contemplation of these matters. It is not my assertion that a man is truly free merely because he may choose which master he shall serve for the day, for if necessity compels him to serve some master, his liberty is but a name. My distinction rests not upon the mere act of selling labour, which I concede is often a transaction of desperation, but upon the prospect of what follows that sale. In the present arrangement, the fruit of his industry beyond his wage belongs to another who risks capital but contributes no toil; in the cooperative system I envision, the labourer becomes a capitalist in his own right, sharing in the risk and the reward. The decision-making you speak of—somebody must always decide—is indeed unavoidable, yet there is a profound moral difference between authority exercised over servants for the benefit of a proprietor, and authority delegated by partners for the benefit of the whole concern.

