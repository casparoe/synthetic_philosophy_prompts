answer: |-
  This is a classic case of philosophical equivocation. The slogan "logic is true by convention" is doing too much heavy lifting, masking at least four distinct claims that range from trivialities to deep metaphysical commitments. The confusion in your seminar arises because participants are swapping between these readings without noticing.

  Here is the menu of distinct claims, their verdicts, their ability to license the moves you described, and how they handle the *Tonk* test case.

  ### The Menu: Four Readings of "Logic is True by Convention"

  #### 1. The Notational Reading
  *   **The Claim:** The *symbols* and *syntax* we use to express logic are arbitrary human inventions. We chose $\rightarrow$ for implication and $\neg$ for negation; we could have used arrows and tildes.
  *   **Verdict:** **Platitude.** No serious philosopher denies this.
  *   **Licenses the Move?** **No.** This says nothing about whether the *truths* expressed by those symbols are about the world. It only says our *notation* is. It cannot support the claim that logic is epistemically special or distinct from empirical fact.
  *   **Seminar Diagnosis:** Unlikely to be the main driver, though often the subconscious baseline.

  #### 2. The Framework Reading (Carnapian)
  *   **The Claim:** Logic constitutes the "linguistic framework" within which we ask questions. Choosing a logic is like choosing to play chess rather than checkers. It is a pragmatic choice, not a discovery of fact. Once inside the framework, logical truths are necessary; outside the framework, the choice is merely useful.
  *   **Verdict:** **Substantive and Defensible** (within Logical Empiricism), but controversial (Quine attacks the analytic/synthetic split required to make this work).
  *   **Licenses the Move?** **Yes, but ambiguously.**
      *   *Supports "Not about the world":* Logic is internal to the framework, not a description of external reality.
      *   *Supports "Epistemically Special":* We treat framework rules as fixed to make discourse possible.
      *   *The Tension:* It explains why we *treat* it as fixed (pragmatism), but doesn't prove it *is* metaphysically distinct from science.
  *   **Seminar Diagnosis:** High probability. This allows the "we made it up" (choice of framework) and "we can't argue out of it" (constitutive rules) moves simultaneously.

  #### 3. The Meaning-Constitution Reading (Analyticity)
  *   **The Claim:** Logical truths are true *solely in virtue of the meanings* of the logical constants. To understand "and" is to know that $A \land B \vdash A$. Denying logic is literally misusing the words.
  *   **Verdict:** **Substantive but Vulnerable.** This is the classic "Analytic" claim. It is the primary target of Quine's "Two Dogmas."
  *   **Licenses the Move?** **Yes.**
      *   *Supports "Not about the world":* It's about language/meaning, not empirical facts.
      *   *Supports "Epistemically Special":* Meaning is supposed to be prior to empirical investigation.
      *   *The Tension:* If meaning is just stipulation, why can't we stipulate weird meanings (see *Tonk*)?
  *   **Seminar Diagnosis:** Very High. This is the standard "Ayer/Carnap" view that Quine attacked. It's the easiest way to say "it's not about the world."

  #### 4. The Epistemic-Adoption Reading (Quine/Wittgenstein hybrid)
  *   **The Claim:** We *adopt* logic as a rule we refuse to revise because it is central to our web of belief. It is "conventional" only in the sense that we *decide* to hold it immune from falsification, not because it lacks factual content.
  *   **Verdict:** **Substantive.** This is closer to Quine's actual view (logic is central but revisable in principle) mixed with a Wittgensteinian rule-following observation.
  *   **Licenses the Move?** **Yes, but flips the script.**
      *   *Supports "Epistemically Special":* We treat it as fixed by fiat.
      *   *Denies "Not about the world":* On this reading, logic *is* about the world, just very general. We keep it fixed for pragmatic reasons, not because it's linguistically true.
      *   *The Tension:* This reading actually contradicts the "just a rule of language" claim. It says logic is the *most* factual claim we have, which we protect by convention.
  *   **Seminar Diagnosis:** Moderate. The student arguing "we could give up modus ponens if physics got weird" is hinting at this, but then retreating to "true by convention" to save its specialness.

  ---

  ### The *Tonk* Test Case

  **The Case:** You stipulate a connective **tonk** with these rules:
  1.  **Introduction:** From $A$, infer $A \text{ tonk } B$.
  2.  **Elimination:** From $A \text{ tonk } B$, infer $B$.
  **Result:** From any $A$, you can infer any $B$. Logic explodes.

  Here is how each reading handles *Tonk*, and what breaks.

  | Reading | Verdict on *Tonk* | Does it survive? | What must be added? |
  | :--- | :--- | :--- | :--- |
  | **1. Notational** | **Pass.** You can name it "tonk." | **Yes.** | Nothing. But this reading doesn't explain validity, so it doesn't matter. |
  | **2. Framework** | **Fail.** A framework allowing *tonk* is pragmatically useless. | **No.** | **Pragmatic Constraint:** Conventions are chosen for *utility*. A framework that trivializes all distinctions is useless. |
  | **3. Meaning-Constitution** | **Catastrophic Fail.** *Tonk* has no coherent meaning. | **No.** | **Harmony/Conservativity:** You cannot define meaning *just* by inference rules. The rules must be "harmonious" (Belnap). Introduction and Elimination must match. |
  | **4. Epistemic-Adoption** | **Fail.** We simply wouldn't adopt it. | **No.** | **Rationality Constraint:** We only adopt conventions that preserve consistency. |

  #### The Critical Problem for the Analytic/Synthetic Distinction
  The *Tonk* case kills the pure **Meaning-Constitution Reading (3)**.
  *   **Why?** If logical truth is *just* a matter of stipulating rules for symbols, then *Tonk* should be valid. You stipulated the rules, after all.
  *   **The Fix:** To rule out *Tonk*, you must say: "Valid conventions must be **conservative** (they don't allow you to prove new things in the old vocabulary) and **consistent**."
  *   **The Quinean Trap:** To check if a convention is conservative or consistent, **you need to use logic.**
      *   You are trying to explain Logic using Convention.
      *   But you need Logic to validate the Convention.
      *   **Result:** Circularity. You presuppose the very logical notions (consistency, validity) you were trying to explain via convention.

  **Verdict:** If the slogan requires the "Harmony/Conservativity" fix to survive *Tonk*, it **cannot** rescue the Analytic/Synthetic distinction from Quine. It concedes that logical notions (consistency) are prior to linguistic convention.

  ---

  ### Diagnosis: What is happening in your seminar?

  Your classmates are equivocating between **Reading 2 (Framework)** and **Reading 3 (Meaning)**.

  1.  **When they say "Logic isn't about the world":** They are using **Reading 3**. They think logical truths are true by definition (analytic). This makes them distinct from empirical facts (synthetic).
  2.  **When they say "Logic is special/fixed by fiat":** They are using **Reading 2 or 4**. They think we *choose* to hold logic fixed to make sense of the world.

  **The Contradiction:**
  *   If Logic is **Reading 3** (Meaning), it is fragile. As *Tonk* shows, you can't just make up meanings. Meaning is constrained by logic.
  *   If Logic is **Reading 4** (Adoption), it is *not* "just language." It is a deeply held empirical belief we refuse to revise. This collapses the Analytic/Synthetic distinction (Quine's point).

  **The "Move" they are making:** They want the **metaphysical comfort** of Reading 3 (logic is safe from empirical refutation) combined with the **authority** of Reading 4 (we have the power to fix it). *Tonk* shows you can't have both. If we have the power to fix it by fiat, we could fix *Tonk*. Since we can't, we don't have that power.

  ### Cheat Sheet for Leading Section

  If you want to steer the discussion cleanly, propose this trilemma to the room:

  1.  **If logic is purely conventional (stipulative):** Then *Tonk* is valid. (Absurd).
  2.  **If *Tonk* is invalid:** Then convention is constrained by something prior to convention (e.g., consistency, harmony).
  3.  **If convention is constrained by prior logic:** Then logic is not *explained* by convention. (Quine wins).

  **The Pivot Question:**
  *"When you say logic is true by convention, do you mean we could have successfully adopted the 'Tonk' rules if we wanted to? If no, then what constrains our conventions? And if something constrains them, isn't that constraint the real source of logical truth, not the convention?"*

  This forces them to admit that "convention" is not the bottom floor. Either logic is about the structure of rational thought (not just language), or the notion of "meaning" they are using is doing secret work that they haven't accounted for.
