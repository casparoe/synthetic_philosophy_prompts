  Right, let's have a proper look at Priya's record. It's a fascinating puzzle because on the surface, she looks a bit inconsistent, but that claim about the sixteen-year-olds is the key that unlocks the whole thing. She insists the age limit flows from the *same principle* as the residency and citizenship rulings. That tells us her principle isn't just about 'who belongs' (membership) or 'who gets hurt' (affected interests), but something about the *nature of the relationship* between the person and the state.

  Here is my read on the rules she's running, what they predict for your border commuters, and how to test it.

  ### The Competing Rules

  To figure this out, we have to distil her past rulings into coherent principles. There are really only two serious candidates that fit most of her data.

  **Rule 1: The Principle of Reciprocal Subjection.**
  You get a vote if you are routinely subject to the state's coercive legal order and have the capacity to understand that obligation.
  *   **Fits:** Resident non-citizens (subject to law/tax), Prisoners (intensely subject to law), 16-year-olds (legal capacity/obligations kick in), Expats (No – not subject to law), Tourists (No – transient subjection).
  *   **Fits the Dam Case:** The villagers are affected by the *consequences* of the state's actions, but they are not subject to its *laws*. They don't pay tax there, can't vote there, and aren't prosecuted there. Hence, 'not part of us'.
  *   **Fits the Age Claim:** 12-year-olds lack the legal capacity to bear full reciprocal obligations; 16-year-olds are closer to that threshold.

  **Rule 2: The Principle of Residential Membership.**
  You get a vote if you are physically integrated into the daily life of the community (you sleep here, you live here), provided you have capacity.
  *   **Fits:** Resident non-citizens, Prisoners (physically present), 16-year-olds (usually resident), Expats (No – gone), Tourists (No – transient).
  *   **Fits the Dam Case:** The villagers live over the border. They are not residents.
  *   **Struggles with the Age Claim:** A 12-year-old resident is just as 'resident' as a 16-year-old. To make this work, Priya has to argue residence *plus* capacity, whereas Rule 1 makes capacity part of the definition of subjection.

  ### The Prediction for the Commuters

  I'd wager Priya is going to say **Yes, they get the vote.**

  Here is why. The Prisoners case is the heaviest weight on the scale. If she were a strict 'Residential Membership' theorist, prisoners are a tricky case (they are removed from society), yet she grants them the franchise. This suggests she cares more about *subjection to the legal order* than simple social integration.

  The commuters are in a nearly identical position to the resident non-citizens, save for where they sleep. They pay income tax. They are bound by employment law. They are prosecuted in your courts. They are subject to the coercive power of the state every single day they are on shift. Under the **Principle of Reciprocal Subjection**, they are clearly 'in'.

  If she says 'No', she is prioritising *Residence* over *Subjection*. But that creates a tension with the Prisoners case (who are confined, not integrated) and the 16-year-old claim (which implies capacity/obligation matters more than simple presence). Given she's a PhD student in democratic theory, she'll likely spot that 'Residence' is a crude proxy for 'Subjection'. She'll argue that since the commuters are bound by the law and contribute to the treasury, they are 'part of us' in the only way that matters politically.

  ### The Test Case

  If you want to know for sure which rule she's actually running, you don't ask her about the commuters. You ask her about **the Cross-Border Pensioner.**

  **The Case:** A retiree who worked in your country for forty years, paid tax their whole life, and now lives across the river. They receive a state pension from your government, which is taxed at source, and the bill in question changes their pension age or tax rate. They do not work here; they only visit occasionally.

  *   **If she says Yes:** She is running the **Reciprocal Subjection** rule (specifically, a version that includes past contribution and current legal/financial entanglement). This confirms she will vote **Yes** for the commuters.
  *   **If she says No:** She is running the **Residential Membership** rule (or a strict 'Current Economic Participation' rule). This suggests she will likely vote **No** for the commuters, because they don't 'live' here.

  This case splits the candidates because the Pensioner has the *history and financial stake* of the commuter (or better) but lacks the *daily physical presence*. It forces her to choose between 'where you sleep' and 'where you are bound'.

  ### The Commitment

  If her record genuinely doesn't settle it—which is possible, given the tension between the Dam villagers (affected but excluded) and the Prisoners (unfree but included)—then she is committing herself to a specific definition of **Political Community**.

  *   **If she votes Yes:** She commits to the view that democracy is about **governing those you bind**. She must then explain why the Dam villagers aren't 'bound'. She'll have to argue that suffering a side-effect (flood water) is fundamentally different from being subject to a legal order (tax/courts). She is taking a hard line that democracy stops at the jurisdictional border, not the impact border.
  *   **If she votes No:** She commits to the view that democracy is about **shared fate and residence**. She then has a problem with the Prisoners (who are removed from shared fate) and the 16-year-olds (who share the same fate as 12-year-olds). She would be admitting that 'Residence' is a necessary condition, which makes her '16 vs 12' claim harder to defend without admitting competence is a separate principle after all.

  **My money?** She says **Yes**. It's the only position that keeps her 'same principle' claim about the teenagers consistent. If the principle is 'Residence', age is irrelevant. If the principle is 'Capacity to bear obligation within the legal order', then 16 vs 12 makes perfect sense, and the commuters (who bear obligations) must be included.

  She's building a theory of **Reciprocal Agency**. You vote because you are an agent within the machine, not just because you live near it or get crushed by it. The commuters are cogs in the machine; the villagers are just in the way. Harsh, but consistent.
