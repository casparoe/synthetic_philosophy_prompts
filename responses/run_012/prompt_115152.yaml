answer: |-
  You mark the day and say the time is now.
  I tell you seasons turn without your leave.
  You wipe the harvest sweat from off your brow.

  You say I hide the failure to deceive.
  I say the frost has merely paused its sleep.
  The shadow lengthens while you wait for eve.

  You call the slow approach a mere blind creep.
  I say the pressure builds within the core.
  There is no harvest if the sowing's cheap.

  The grain is counted dwindling on the floor.
  A sudden rain may push the end away.
  You claim I guard an empty winter store.

  You say I shift the date another day.
  No eye can tell the false from what will be.
  I cannot make the final hour stay.

  The light goes out; you still must wait to see.
