      *   *Refinement:* Ensure I don't take sides. Ensure I distinguish between *Historical Stoicism* and *Modern Stoic Practice*.

      *(Self-Correction during drafting)*: In point (2), Peter says the two-box version has to "cheat" on health. I need to make sure I explain *why* Helena would say that's not cheating but categorization. Health is a "preferred indifferent." It has value, but not *moral* value. Peter treats value as monolithic (influence = value). Helena treats it as dual (moral vs. external).
