answer: |-
  This is a sophisticated piece of reasoning. You have effectively reconstructed a known pressure point in the literature: the slide from **Pragmatic Encroachment** (knowledge depends on stakes) to **Expressivism** (knowledge attributions aren't truth-apt).

  Your friend is wrong to tell you to drop (1). Premise (1) is the motivation for the entire pragmatic turn in epistemology; without it, you are left with traditional invariantism, which you presumably find insufficient given your seminar topic. Premise (6) is also correct to hold: a theory of knowledge that makes knowledge attributions non-factual is self-undermining (you can't *know* that expressivism is true) and explanatorily impotent (it can't explain the difference between the competent and incompetent inspector).

  The argument slips at **Step (4)**.

  Here is the diagnosis of why (4) looks plausible, why it is false, what you pay to reject it, and where that leaves you on the map of contemporary epistemology.

  ### 1. The Culprit: Step (4)
  > *(4) But truth is not relative — a sentence is true or false, period — so an utterance whose correctness is relative to something is not stating a fact...*

  **Why it looked plausible:**
  This premise relies on a "God's Eye" view of truth. It assumes that for a sentence to state a fact, its truth conditions must be absolute and invariant across all contexts. If the "correctness" of the utterance shifts depending on stakes, it feels like we are no longer describing the world but rather issuing a verdict or a command (like "This is safe enough"). This is the intuition that drives non-cognitivism in ethics: if "Good" depends on my standards, "Good" isn't a property of the object.

  **Why it is false:**
  Step (4) conflates **context-sensitivity** with **non-cognitivism**.
  Many perfectly factual, truth-apt claims are context-sensitive.
  *   **Indexicals:** "I am here." The truth of this sentence depends on who says it and where. Its correctness is relative to a context. Yet, it states a fact.
  *   **Gradable Adjectives:** "John is tall." The correctness of this depends on a comparison class (tall for a jockey? tall for a basketball player?). It is relative to a standard. Yet, "John is tall" is not an imperative or a recommendation; it is a description of John's height relative to a standard.

  If 'knows' behaves like 'tall', then (4) fails. A knowledge attribution can be correct relative to a stakes-context *and* still state a fact. The fact is simply a relational fact involving the subject, the evidence, and the stakes.

  ### 2. The Ambiguity in Step (3)
  > *(3) So a knowledge attribution is correct only relative to a level of stakes...*

  There is a secondary slippage here that feeds into (4). Whose stakes?
  *   **Option A (Attributor Stakes):** The correctness depends on the stakes of the *person saying* "S knows." (This leads to **Epistemic Contextualism**).
  *   **Option B (Subject Stakes):** The correctness depends on the stakes of the *subject S* who is supposed to know. (This leads to **Subject-Sensitive Invariantism** or **Pragmatic Encroachment** proper).

  Your argument slides from (2) (reliance depends on risk) to (3) (attribution correctness is relative) without specifying *whose* risk.
  *   If you mean **Option B**, then (3) does not threaten realism. It just means the fact of the matter includes the subject's practical situation. "S knows p" is true simpliciter if S has evidence adequate for S's stakes. This preserves (6) easily.
  *   If you mean **Option A**, you are a Contextualist. You can still preserve (6) *if* you reject (4). Contextualists claim 'knows' picks out different relations in different contexts, but within a context, the claim is factual and truth-apt.

  ### 3. What You Pay (The Cost of Repair)
  To keep (1), (2), and (6), and reject (4) and (5), you must pay the following costs:

  1.  **You abandon Traditional Invariantism:** You cannot maintain that 'knows' denotes a single, stakes-insensitive relation between a subject and a proposition. You must accept that the semantic value of 'knows' is sensitive to practical factors (either the subject's or the attributor's).
  2.  **You accept Semantic Complexity:** You have to adopt a semantic framework that handles context-sensitivity without collapsing into expressivism. This means treating 'knows' more like an indexical or a gradable adjective than like "is an electron."
  3.  **You face the "Disagreement" Problem:** If correctness is stakes-relative, how do we explain genuine disagreement? If I say "S knows" (low stakes) and you say "S doesn't know" (high stakes), are we contradicting each other?
      *   *Contextualists* say: No, we are talking past each other (different propositions).
      *   *SSI/Encroachers* say: Yes, because the subject's stakes fix the fact, regardless of what we attributors think.
      *   *Relativists* say: We are disagreeing about the truth relative to our respective assessment contexts.
      *   *Cost:* You must choose one of these semantic packages. You cannot have the simplicity of invariantism.

  ### 4. Where Does This Leave You?
  Does the repair leave you with a recognizable position? Yes, actually two of them.

  **Path 1: Subject-Sensitive Invariantism (SSI) / Pragmatic Encroachment**
  *   **Keep:** (1), (2), (6).
  *   **Modify:** (3) refers to the *subject's* stakes.
  *   **Reject:** (4) and (5).
  *   **Result:** 'Knows' is invariant, but the relation it denotes includes stakes as a parameter. "S knows p" is a factual claim about S's evidence relative to S's practical situation.
  *   **Verdict:** This is the standard view of Jason Stanley, Jeremy Fantl, and Matthew McGrath. It avoids the expressivist trap because the fact of the matter is objective once the subject's situation is fixed.

  **Path 2: Epistemic Contextualism**
  *   **Keep:** (1), (2), (6).
  *   **Modify:** (3) refers to the *attributor's* context.
  *   **Reject:** (4) and (5).
  *   **Result:** 'Knows' is an indexical. In a low-stakes context, "S knows" expresses a proposition that is true. In a high-stakes context, it expresses a different proposition that is false. Both are factual claims.
  *   **Verdict:** This is the view of Keith DeRose, David Lewis, and Stewart Cohen. It avoids expressivism by treating 'knows' as context-sensitive but truth-apt.

  ### Summary Advice
  You have not made a mess; you have discovered the **Expressivist Objection** to Pragmatic Encroachment. This is a live debate in the literature (e.g., arguments by Jessica Brown or certain readings of Rorty).

  *   **Do not drop (1).** Your friend is suggesting you defang the view to save the semantics. Keep the function; fix the semantics.
  *   **Drop (4).** Accept that context-sensitive claims can be factual.
  *   **Clarify (3).** Decide if the stakes belong to the Subject (SSI) or the Attributor (Contextualism).
      *   If you want to preserve the explanatory power in (6) most robustly (the inspector example), **SSI (Path 1)** is stronger. It makes the inspector's knowledge a fact about the *inspector*, not a fact about *your conversational context*.
      *   If you are more worried about the semantics of the word 'knows' itself, **Contextualism (Path 2)** is the standard repair.

  You can be pleased with the argument. It successfully demonstrates that **Pragmatic Encroachment + Naive Realism about Truth = Expressivism.** To avoid Expressivism, you must adopt a more sophisticated Realism (Contextualism or SSI). That is exactly where the field currently stands.
