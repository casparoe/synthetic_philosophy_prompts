answer: |-
  Your instinct is excellent. The summary you read is a very common "textbook" version of the debate, but it conflates several distinct arguments and ends with a conclusion that most serious scholars of the debate (on both sides) would reject. It gets the historical arc roughly right but misunderstands the theoretical core of Hayek's argument, which leads directly to the misleading conclusion about computers.

  Here is the bit-by-bit breakdown of what an expert would nod at, wince at, or call wrong.

  ### 1. Mises and the Price Signal
  > *'Mises and Hayek said no. Once you abolish private ownership of the means of production you no longer have market prices for capital goods, and without prices nobody can know what anything is worth, so rational allocation becomes impossible — not merely hard, impossible in principle.'*

  *   **Verdict:** **Nod.**
  *   **Why:** This is an accurate summary of Mises's 1920 argument (*Economic Calculation in the Socialist Commonwealth*). Mises argued that without private property in capital goods, there is no exchange, and without exchange, there are no genuine money prices. Without prices, you cannot compare inputs and outputs to determine profit or loss, making rational calculation impossible *in principle*. Hayek initially agreed with this but later shifted his focus.

  ### 2. Lange and Trial-and-Error
  > *'Lange answered that this was too quick: a Central Planning Board could simply set prices by trial and error, raising them when goods ran short and cutting them when they piled up, until supply and demand balanced, at which point the planned economy would be doing exactly what a market does.'*

  *   **Verdict:** **Nod.**
  *   **Why:** This accurately describes the Lange-Lerner model (1936–37). Lange accepted Mises's premise that you need prices but argued the state could *simulate* the market. The Central Planning Board (CPB) would set "parametric prices," and state firm managers would be told to follow two rules: minimize cost and produce where price equals marginal cost. The CPB would adjust prices based on surpluses and shortages (tatonnement). In the static neoclassical model Lange was using, this works.

  ### 3. Hayek and the "Equations"
  > *'But Hayek's real comeback was the information problem: to run that trial-and-error procedure the board would have to collect and solve millions of simultaneous equations, which is beyond any real bureaucracy...' *

  *   **Verdict:** **Wince / Wrong.**
  *   **Why:** This is the most common misconception about Hayek. Hayek did *not* argue that socialism fails because the equations are too *hard* to solve. He argued that the equations **cannot be written down in the first place.**
      *   The "millions of equations" language comes from earlier mathematical economists (like Pareto and Barone). Hayek's specific contribution in *The Use of Knowledge in Society* (1945) was to argue that the relevant knowledge (local conditions, tacit skills, specific circumstances of time and place) is **dispersed and tacit**. It never exists as a centralized set of data.
      *   The summary implies the data exists but is too complex to process. Hayek argued the data *does not exist* in a form that can be processed. It is generated only through the market process itself.

  ### 4. The Computer Conclusion
  > *'...so socialism might be possible in theory but is hopeless in practice. That's why centrally planned economies collapsed, and the only open question now is whether computers will eventually get powerful enough to solve the equations and make planning work after all.'*

  *   **Verdict:** **Wrong.**
  *   **Why:** This conclusion does not follow from Hayek's argument, and it ignores the subsequent development of the debate.
      *   **The Knowledge Problem:** If the information is tacit (e.g., a machine operator knowing a machine sounds "off," or a local manager knowing a supplier is unreliable), more computing power doesn't help. You cannot compute what has not been codified. Hayek's point was epistemological, not computational.
      *   **The Incentive Problem:** The summary completely ignores the Public Choice critique (developed later by scholars like Don Lavoie and David Prychitko). Even if you could solve the calculation problem, why would a state firm manager report their true capacity to the CPB? In a market, profit incentives drive truth-telling. In Lange's model, managers have an incentive to hoard resources or underreport capacity to make their quotas easier. Computers do not solve incentive incompatibility.
      *   **The Dynamic Problem:** Lange's model was static (allocating given resources to given ends). Real economies are dynamic (discovering new resources and new ends). Markets are discovery procedures; planning is an allocation mechanism. Computers might optimize a static system, but they cannot replicate the entrepreneurial discovery process.
      *   **Who says this?** The idea that "computers will settle the question" is currently advocated by a niche group of "Cybernetic Socialists" (e.g., Paul Cockshott), but it is not the mainstream economic consensus, nor is it the logical conclusion of the Mises/Hayek critique.

  ### Where the Real Disagreement Lives
  The book locates the disagreement in **computational capacity** (Can we crunch the numbers?). The real disagreement lives in **epistemology and incentives** (Do the numbers exist, and will people tell the truth?).

  1.  **Static vs. Dynamic:** Lange viewed the economy as a static equilibrium problem (solve for X). Hayek viewed it as a dynamic process of discovery (find X).
  2.  **Explicit vs. Tacit Knowledge:** The book assumes all economic data can be digitized. Hayek argued the most important economic knowledge is contextual and cannot be digitized.
  3.  **Incentives:** The book assumes benevolent planners and managers. Modern economics assumes self-interested actors, which breaks the Lange model regardless of computing power.

  ### Summary
  The book gives you a correct history of the *moves* (Mises challenged, Lange responded, Hayek countered) but an incorrect description of the *substance* of Hayek's counter, leading to a sci-fi conclusion that most economists reject. It treats a philosophical problem about the nature of knowledge as an engineering problem about processing speed.

  \answer{partly fair}
