prompt: |-
  My buddy's in a philosophy-of-probability reading group and he's been walking around all week with this argument, and I genuinely can't tell if it's a trick or if I've misunderstood expected value my whole life. He lays it out like this. (1) There are two envelopes, one holds twice what the other holds; you get handed one at random and you can peek or not, doesn't matter, but you're holding it. Call the amount in your envelope X. (2) Since you were handed it at random, it's just as likely to be the smaller as the larger one, so with probability 1/2 the other envelope holds 2X and with probability 1/2 it holds X/2. (3) So the expected value of the other envelope is (1/2)(2X) + (1/2)(X/2) = (5/4)X, which beats X. (4) So you should always swap, and swap back, and back again, and if there's a little fee per swap you should cheerfully pay it every single time, forever. (5) But that's clearly nuts -- two fixed envelopes can't make swapping back and forth profitable, and a rule that has you paying to shuffle money between two envelopes you already own is a bad rule. (6) His moral is that expected-value reasoning is broken, or that "the expected value of the other one" is a phrase that just doesn't mean anything, and he wants to throw out a big chunk of decision theory. He even says it gets worse if you peek and see $10, because then (3) still says swap. I'm pretty sure (5) is right and something in (1)-(4) has to go, but I can't pin whether the bad move is the probability assignment in (2), or the way X is doing work in (3), or something about what "equally likely" can even mean when nobody told us how the experimenter chose the amounts.

  So: which step do you reject, and what does rejecting it actually cost me -- i.e. what do I have to give up about expected value, or about indifference under symmetric ignorance, to plug the hole? If it's the X business, please spell out precisely what X picks out in each of the two branches, because whenever I try to say it out loud it comes out as one variable quietly doing two jobs and I can't articulate why that's illegal. And since I'll probably have to defend this in front of the group, be explicit about which part of your answer is the settled thing everyone in the area agrees on (that the argument is invalid, and the core reason why) versus which part is a live, ongoing disagreement (which diagnosis of the error is the correct one) -- I don't want a contested resolution sold to me as if it were the consensus.
