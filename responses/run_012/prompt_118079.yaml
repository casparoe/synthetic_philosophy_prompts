prompt: |-
  So my friend and I just spent like three hours arguing about whether you can cause something by not doing anything, and I need a real answer because I think he was winning on vibes and I was winning on substance but I couldn't close it out.

  His line: causation needs a cause, and a cause has to be a thing that happens — an event, an action, some item that shows up in the inventory of what went on. Me not watering my plants isn't a thing that happened, it's just the absence of a watering. So "the plants died because I didn't water them" is, on his view, loose talk that we dress up as causation. My line: that's nuts. The plants really did die because nobody watered them, and the hospital that never bought a defibrillator, the parent who forgets the kid in the back seat, the mechanic who skips the brake check — we don't just blame those people morally, we say what they didn't do is why the bad thing happened.

  Then he pulled what he thinks is the kill shot. He said okay, use the but-for test: an omission is a cause if, had the person acted, the outcome wouldn't have occurred. He says that test is either insane or trivial. Insane because of the two-roommates case — both roommates promised to water the plant, neither did, the plant dies. Each omission passes the test on its own, so now you've got two full causes of one death, which he says is like saying the plant got killed twice. Trivial because if you don't restrict it somehow, everyone on Earth who could in principle have watered the plant counts as a cause, and that's not a theory of causation, that's just the entire world being responsible for everything.

  So I tried this move I've been calling the ledger view, and I want you to tell me if it actually works. The idea: causation by omission is real, but it's always relative to a baseline. The baseline gets set by a role, a promise, a rule, a contract, or a plain reasonable expectation, and it fixes what the default course of events was supposed to be. Given a baseline, "did the omission cause it" has a definately factual answer — it's the counterfactual question asked against the default rather than against nothing. No baseline, no cause. So the two roommates each broke their own promise against their own baseline, and yeah, both omissions are causes; the "killed twice" complaint just confuses two causes with two killings, and things have lots of causes. And the stranger across the country has no baseline making him the default waterer, so he's out.

  He came back with three things and I couldn't answer any of them well. First, he said the ledger view makes causation relative to whatever baseline we happen to adopt, so the same non-action is a cause in one society's ledger and not in another's, and that's relativism about a factual matter. Second, the doctor case: a doctor doesn't order a test that only 3% of competent doctors in her position would order, and the patient dies of the thing the test would have caught. Under a reasonable-expectation baseline she's off the hook; under plain counterfactual dependence she caused the death. He says my view has to call her innocent, and that's backwards — she's lucky, not innocent. Third, the off-duty lifeguard who isn't on shift and doesn't jump in: no role, no duty, no baseline, but he was right there and could have. And he threw in a backup case too — the primary is supposed to water the plant, the backup only waters it if the primary forgets, the primary forgets, and the backup, figuring it's handled, doesn't check. Both omissions are but-for causes, but he says obviously one of them is the real cause, and my ledger view just stamps both of them "cause" and never ranks them.

  So: write me an essay that settles this. Take a stand on whether omissions can be causes, and if they can, say exactly what the criterion is. Don't wimp out into "it depends on your definition." Deal with the two-roommates case, the doctor case, the off-duty lifeguard, the backup-waterer case, and the "everything causes everything" worry, and tell me whether my ledger view survives, needs a patch, or should be thrown out. If you think my friend is right that omission-talk is just blame projected onto the world, say so and defend it — but then tell me what to say about the plants.

  After the essay, give me a short structured summary I can screenshot and send him: a JSON object with the fields verdict (one of "omissions are causes", "omissions are not causes", "omissions are causes only relative to a baseline"), criterion (the one-sentence test you end up defending), strongest_case_against (whichever case from our argument most pressures your verdict), reply_to_it (one or two sentences on how you handle that case), ledger_verdict (one of "keep as is", "keep with a fix", "scrap it"), fix_if_any (the amendment in one sentence, or "none"), ranking_rule (how you rank the primary versus the backup waterer, or "no ranking"), and confidence (an integer from 1 to 5). Write it all in American English.
