answer: |-
  The debate you and your friend are having is one of the oldest stalemates in philosophy and law. It pits a pure metaphysical view of the universe (your friend) against a pragmatic, human-centered view of explanation (you). Your friend is arguing from the perspective of physics: causes are events, energy transfers, or positive occurrences. You are arguing from the perspective of biology, law, and everyday life: causes are differences that make a difference.

  Here is the settlement: You win on substance, but your friend wins on technicality. However, since humans live in the world of substance, not just particle physics, your view is the one that actually works for explaining reality as we experience it. Omissions *are* causes, but only relative to a baseline. Your "Ledger View" is fundamentally correct, but it requires a specific patch to survive the Doctor and Backup cases.

  ### The Metaphysical Trap
  Your friend's core claim is that "nothing cannot cause something." In a closed physical system, he is right. If you describe the universe entirely in terms of particles and forces, there are no "absences," only configurations of matter. The plant died because of entropy and chemical processes, not because of your "non-action."

  But this view is useless for human life. If we accept your friend's definition, we cannot explain almost any failure. A car crash isn't caused by the brake failure (an absence of friction); it's caused by the metal touching metal. A starvation isn't caused by lack of food; it's caused by metabolic shutdown. By restricting causation to positive events, your friend eliminates the concept of prevention. Since most human safety systems are designed to *prevent* bad outcomes (brakes, defibrillators, watering), your friend's theory renders safety engineering metaphysically invisible. That is a reductio ad absurdum of his position.

  ### The Necessity of the Ledger
  Your friend's "kill shot" was the claim that the but-for test makes everyone on Earth a cause. He is right that unrestricted counterfactuals are trivial. If I had flown to your house with a hose, the plant would live. Therefore, am I a cause? Intuitively, no.

  This is where your Ledger View saves the theory. Causation in human contexts is not just about counterfactual dependence; it is about *relevant* counterfactual dependence. We implicitly construct a "normal course of events" (the baseline). When we ask "What caused this?", we are really asking "What deviated from the expected course to produce this result?"

  The baseline solves the "Everyone on Earth" problem. The stranger across the country has no entry in the ledger. He wasn't supposed to water the plant. His omission isn't a deviation from the baseline, so it isn't a cause in the relevant sense. Your friend calls this relativism; you should call it contextuality. All causal claims are contrastive. We don't ask "What caused the fire?" in a vacuum; we ask "What caused the fire *instead of the building remaining safe*?" The baseline sets the contrast.

  ### Handling the Objections

  **1. The Two Roommates (Overdetermination)**
  Your friend says counting both roommates as causes implies the plant was "killed twice." This is a category error. Causation is not a finite resource. If two shooters fire simultaneously and kill a victim, both caused the death. We don't say the victim was "half-killed" by each. In the roommate case, both had a duty (baseline entry). Both deviated. Both omissions were sufficient to explain the death in the absence of the other. The plant died once, but it had two sufficient causal explanations. Your Ledger View handles this perfectly: two ledger entries violated, two causes.

  **2. The Off-Duty Lifeguard**
  This case actually proves your view. The lifeguard *could* have saved the swimmer (counterfactual dependence exists), but we intuitively say his not jumping didn't *cause* the death in the same way an on-duty lifeguard's inaction would. Why? Because the ledger was empty. He had no baseline duty. Your friend struggles here because he has to say the lifeguard's inaction is physically identical to the on-duty lifeguard's inaction, yet we treat them differently. Your view explains the difference: one violates a norm, the other doesn't.

  **3. The Doctor Case (The Hardest Hit)**
  This is where your Ledger View needs a patch. Your friend argues that if only 3% of doctors order the test, there is no "reasonable expectation," so your view says she didn't cause the death. But intuitively, if that test was the *only* way to save the patient, her omission feels causal.
  *The Fix:* You must distinguish between **statistical norms** and **normative duties**. A baseline isn't just "what most people do"; it's "what was required." If the medical standard of care *required* the test despite its rarity, the baseline exists. If the test was optional, she didn't cause the death *negligently*, even if her action would have saved the patient. Your Ledger View should not deny metaphysical causation here; it should deny *attributable* causation. She caused the death, but she isn't responsible for it. You need to concede that causation exists counterfactually, but the Ledger determines *responsibility*.

  **4. The Backup Waterer (Ranking)**
  Your friend is right that your current view stamps both as "cause" without ranking. In law and explanation, we need to know who is *primarily* responsible. The Primary Waterer has the first-line duty. The Backup has a conditional duty. If the Primary fails, the Backup's duty activates. If the Backup assumes the Primary handled it, the Backup's omission is a cause, but the Primary's is the *proximate* cause.
  *The Rule:* When multiple omissions exist, the cause associated with the primary, non-conditional duty ranks higher than the secondary, conditional duty. The Primary waterer is the main cause; the Backup is a contributing cause.

  ### The Verdict
  Your friend is trying to play physics with legal concepts. You are trying to solve a legal concept with philosophy. The Ledger View is the correct framework for human causation. It avoids the triviality of "everything causes everything" without falling into the absurdity that "nothing causes anything."

  However, you must amend your view slightly. Do not say "No baseline, no cause." Say "No baseline, no *responsibility* for the cause." The counterfactual link exists objectively (if she had watered it, it would live), but the *causal attribution* (she killed the plant) requires the ledger. This distinction saves you from the Doctor case.

  You won the debate on substance. Your friend won on semantics. But since we live in a world of substance, you get the trophy.

