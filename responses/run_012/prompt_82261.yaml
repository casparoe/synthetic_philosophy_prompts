answer: |-
  **Examination Question**

  Consider the Shared-Hazard Crisis model. Two states, A and B, contest a valued stake. Simultaneously, each selects an escalation posture $h_i \ge 0$. While both hold, war occurs as a Poisson process with rate $\lambda = h_A + h_B$. War imposes cost $C_i$; backing down forfeits the stake $V_i$. Postures generate no direct cost but accumulate risk over time discounted at rate $r$. There is no binding commitment.

  1.  Explain how raising $h_A$ coerces B without A intending war. Why does this leverage vanish if $h_A$ is perfectly controlled by A?
  2.  Identify the externality in posture selection. Derive the condition, in terms of the slope of B's best-response map $\frac{dh_B}{dh_A}$, under which a unilateral reduction in $h_A$ reduces total hazard $\lambda$. When does it fail?
  3.  Assess the 'Risk Conservation' claim: that reducing crisis frequency increases conditional escalation probability, keeping total war risk fixed. Is this a theorem of the model? What assumptions would make it one? Propose a falsifiable empirical version.

  ***

  **Model Answer**

  **1. Leverage via Uncontrolled Hazard**
  In this model, coercion functions not through a credible promise to attack, but through the manipulation of shared risk. By raising $h_A$, State A increases the instantaneous probability of war for both parties. Since war is costly ($C_i > V_i$), State B faces a mounting expected loss so long as the crisis persists. A raises the "price" of B's resistance. B is coerced to back down not because A intends to strike, but because B wishes to stop the clock on a dangerous process that A has accelerated. The leverage derives entirely from the *loss of control*. If $h_A$ were perfectly controlled, raising it would constitute a deliberate choice to initiate war. Given that war is net costly, such a threat is non-credible in a simultaneous game; B would know A would not push the button. The hazard works precisely because it is partly uncontrolled, allowing A to threaten B with a disaster A also wishes to avoid.

  **2. Externality and Best-Response Slopes**
  The selection of posture generates a negative externality. State A captures the full benefit of increased coercion (B's higher likelihood of backing down) but internalizes only a fraction of the marginal risk cost, as the hazard $\lambda = h_A + h_B$ is shared. A ignores the marginal increase in B's expected war cost. To determine the effect of unilateral disarmament on total risk, let total hazard be $H = h_A + h_B$. The change in total hazard resulting from a change in A's posture is $\frac{dH}{dh_A} = 1 + \frac{dh_B}{dh_A}$. A unilateral reduction in $h_A$ reduces total risk if $\frac{dH}{dh_A} > 0$, which implies the condition $\frac{dh_B}{dh_A} > -1$. This holds if postures are strategic complements ($\frac{dh_B}{dh_A} > 0$) or weak substitutes. The reduction fails to lower total risk only if postures are strong strategic substitutes, where $\frac{dh_B}{dh_A} < -1$. In this case, A's restraint provokes B to escalate so aggressively that the net hazard rises. Empirical evidence bearing on this would measure historical reactions to de-escalation: does opponent alertness drop (complements) or surge to exploit weakness (strong substitutes)?

  **3. Risk Conservation**
  The 'Risk Conservation' claim is not a theorem of the Shared-Hazard model. In the model as specified, the war rate is the direct sum of postures; there is no separate parameter for "crisis frequency" versus "conditional escalation probability." To make conservation a theorem, one must impose an exogenous constraint, such as a fixed "risk budget" where states trade frequency for intensity to maintain a constant expected utility boundary. Without this constraint, the model allows both frequency and intensity to rise or fall together. A falsifiable empirical version of the claim would posit a negative correlation across historical dyads between the frequency of crises and the average severity of escalation postures adopted during them. If data shows that periods of low crisis frequency also exhibit low alert levels, the conservation hypothesis is falsified. It remains a conceptual temptation rather than a structural necessity.

  ***

  **Marking Scheme**

  | Point | Requirement | Marks | Common Error (Costly) |
  | :--- | :--- | :--- | :--- |
  | **1** | **Mechanism of Leverage:** Identifies that coercion works by imposing accumulating risk costs on the opponent, forcing them to back down to stop the clock. | 5 | Confusing the hazard with a deliberate threat to attack (intent vs. risk). |
  | **2** | **Role of Control:** Explains that perfect control makes the threat non-credible because war is net costly ($C > V$). | 5 | Claiming that perfect control increases credibility or stability. |
  | **3** | **Externality:** Identifies that the actor internalizes the benefit of coercion but shares the cost of the risk imposed on the other. | 5 | Describing the hazard as a public good or ignoring the asymmetry of benefit/cost. |
  | **4** | **Slope Condition:** Correctly derives or states the condition $\frac{dh_B}{dh_A} > -1$ for risk reduction (or equivalent logic). | 5 | Ignoring the opponent's reaction function (assuming $\frac{dh_B}{dh_A} = 0$). |
  | **5** | **Conservation Status:** States clearly that conservation is *not* a theorem of the provided model without additional constraints. | 5 | Asserting the claim is true by definition or inherent to the Poisson structure. |
  | **6** | **Falsification:** Proposes a testable empirical correlation (e.g., frequency vs. severity) rather than a theoretical restatement. | 5 | Offering a vague philosophical critique rather than an empirical test condition. |
  | **Total** | | **30** | |
