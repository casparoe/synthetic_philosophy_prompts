answer: |-
  This is a magnificent question. It cuts right to the bone of the "species problem," which is as much metaphysics as it is biology. You have identified the exact friction point where the bureaucracy of nomenclature rubs against the ontology of nature.

  You are right to be suspicious of the "just bookkeeping" shrug. While the *International Code of Zoological Nomenclature* (ICZN) claims ontological neutrality, the mechanics of the type specimen system are not metaphysically innocent. They encode a specific way of relating language to the world.

  Here is a reconstruction of what your trade's practice commits you to, where it is underdetermined, and what would break if you changed the metaphysics.

  ### 1. The Type Specimen as a "Rigid Designator"
  To understand what the type specimen does, it helps to look at Saul Kripke's philosophy of language. In the mid-20th century, philosophers argued about whether names were "descriptions" (e.g., "Aristotle" means *the teacher of Alexander*) or "pointers."

  The type specimen system is a biological implementation of **Causal-Historical Reference Fixing**.
  *   **The Practice:** You do not define *Carabus nemoralis* by a list of traits (green legs, specific genitalia, size). You define it by pointing at a specific object in a Paris drawer and saying, "The name applies to whatever is genealogically connected to *this*."
  *   **The Commitment:** This treats the species name as a **rigid designator**. It picks out the same entity in every possible world, regardless of whether the traits change. If that type specimen turns out to be a genetic freak, the name stays with the freak (unless petitioned otherwise), because the name is tied to the *history* of that specimen, not the *description* of it.

  This quietly rules out **Strict Descriptivism**. If species names were just shorthand for a list of universal traits, a type specimen that lacked those traits would invalidate the name immediately. But in your trade, the name sticks to the specimen even if the description fails. The particular anchors the general.

  ### 2. Species as Individuals (The Ghiselin-Hull Thesis)
  You asked if the species is being treated as a universal, an individual, or a bare name. The type practice is most coherent if we accept the view proposed by Michael Ghiselin and David Hull in the 1970s: **Species are Individuals.**

  *   **The Classical View (Universals):** A species is a class or a natural kind. Individual beetles are *instances* of the species, just as individual red things are instances of "redness."
  *   **The Individual View:** A species is a spatiotemporally localized historical entity (a lineage). It is born, it changes, it goes extinct.

  **Why the Type Specimen fits the "Individual" view:**
  If a species is a class (Universal), a type specimen is just one member of that class. It shouldn't matter which one you pick; they are all equal instances of the Form.
  But if a species is an **Individual** (a lineage), the type specimen is not an *instance* of the species; it is a **part** of the species.

  Think of it like a rock sample. If you name a geological formation, you might designate a specific outcrop as the "type section." That outcrop isn't an "instance" of the formation; it is a physical piece of the formation itself.
  *   **The Metaphysical Commitment:** By tying the name to one physical bug, taxonomy treats the species as a concrete thing extended through time, of which the type is a sampled fragment. This explains why the name doesn't budge even if the "concept" changes. You aren't changing the definition of a word; you are re-evaluating the boundaries of a historical object.

  ### 3. Underdetermination: What is Presupposed vs. Contingent?
  You suspect the practice is underdetermined, and I agree. The ICZN is a pragmatic tool, not a metaphysical treatise.

  **Strictly Presupposed:**
  1.  **Stability of Reference:** There must be a way to fix the reference of a name that is independent of human opinion. The type specimen provides an objective anchor outside the mind.
  2.  **Continuity:** There must be some relation (similarity or genealogy) that allows us to move from the one type specimen to the millions of other beetles.
  3.  **Distinction between Name and Concept:** The practice presupposes that the *name* (nomenclature) is separate from the *idea* (taxonomy). You can change your mind about what the species *is* without changing what it is *called*.

  **Contingent (Compatible with multiple metaphysics):**
  1.  **Realism vs. Nominalism:** You can be a hard-nosed realist (species are real things in nature) or a nominalist (species are human constructs) and still use type specimens.
      *   *Realist:* The type anchors the real natural kind.
      *   *Nominalist:* The type anchors the center of a similarity cluster we find useful.
  2.  **Essentialism:** The practice actually works *against* essentialism (since types can be non-essential runts), but you can still be an essentialist and use the system. You just have to treat the type as an epistemic tool to find the essence, rather than the ontological ground of the name.

  So, the practice does not force you to be a Ghiselin-Hull individualist, but it makes the most sense if you are one. It is compatible with Nominalism, but awkward for Platonic Realism.

  ### 4. The Thought Experiment: Swapping the Metaphysics

  Let's test your final question. What breaks if we change the underlying metaphysics?

  **Scenario A: Thoroughgoing Nominalism**
  *   *The View:* Only individual beetles exist. "Species" is just a label (flatus vocis) for groups of beetles that look enough alike to be useful.
  *   *Impact on Practice:* **Almost nothing changes.** In fact, Nominalism is probably the metaphysics that fits the Type System best.
      *   Why? Because Nominalism says only particulars are real. The Type System says, "Bind the name to a particular."
      *   Under Nominalism, the type specimen is the *paradigm*. All other beetles are called *Carabus nemoralis* only because they resemble the Type closely enough for human purposes. If the Type is a runt, then the name applies to things resembling that runt. The "bookkeeping" becomes the ontology.
      *   *Verdict:* The practice survives intact. It is essentially a nominalist system wearing realist clothing.

  **Scenario B: Full-Blown Platonic Realism**
  *   *The View:* Species are eternal, immutable Forms. The individual beetles are imperfect shadows. The "True *Carabus nemoralis*" exists in a realm of ideals, defined by its essential properties.
  *   *Impact on Practice:* **The Type System would have to be abolished or radically altered.**
      *   *The Problem:* Tying an eternal Name to a decaying, accidental, particular corpse is metaphysically category error. If the Type specimen is a juvenile or a mutant, it is a *bad copy* of the Form. Tying the Name to the bad copy corrupts the Name.
      *   *The Change:* You would not designate a "Holotype." You would designate a **Diagnosis of the Essence**. The name would be tied to a specific set of necessary and sufficient conditions (the Ideal Description).
      *   *Consequence:* If you found a beetle that matched the Ideal Description but looked different from the old Type specimen, the Name would go with the Description, not the Type. The "petition to change the type" process would be unnecessary because the Type would hold no authority over the Form.
      *   *Verdict:* The current practice would be seen as superstitious anchoring. We would move from "Type-based nomenclature" to "Definition-based nomenclature." (Note: Botany actually moved slightly this way with "nomina conservanda," but Zoology remains stubbornly tied to the physical object).

  ### Summary
  Your intuition is correct: the practice is not innocent.

  1.  **It treats species names as Rigid Designators** (Kripke), not descriptions.
  2.  **It treats species as Individuals** (Ghiselin/Hull), where the type is a *part* of the lineage, not an *instance* of a class.
  3.  **It is compatible with Nominalism** (the type is a paradigm sample) but **incompatible with strict Platonism** (the type is an accidental shadow).
  4.  **It is Underdetermined:** You can keep pinning beetles exactly as you did for 35 years whether you believe species are real divine creations or convenient human fictions. The Code is a bridge that allows realists and nominalists to talk to each other without agreeing on what's under the bridge.

  The strangeness you feel comes from the fact that taxonomy is a **historical science** trying to use **linguistic tools**. We are trying to nail a dynamic, flowing lineage (the species) to a static, dead point (the type). The friction you feel is the heat generated by time being crushed into a box.
