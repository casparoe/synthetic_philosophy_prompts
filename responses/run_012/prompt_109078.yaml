prompt: |-
  Bit of background so you know where I'm coming from: I work on program synthesis, the kind of tool where you hand the system a handful of input/output pairs and it guesses a function -- a regex, a little Python, whatever -- that fits them. A friend in a philosophy-of-mind reading group dragged me through Kripke's book on Wittgenstein and rule-following, and my honest reaction was: this is just underdetermination by finite data, we deal with that every day. The plus/quus bit especially -- obviously finitely many examples are consistent with a gazillion different functions, that's why you put a prior over programs and prefer the short one, and if you refuse to do that you're just not doing induction. She keeps telling me I'm missing something, that the skeptical solution at the end is nothing like pick a good prior, but she's bad at explaining it and I half suspect she's being mystical.

  So here's what I want. Take the rule-following argument and the skeptical solution and restate them, as faithfully as you can, in the vocabulary I actually think in -- version spaces, inductive bias, priors over programs, generalization vs. memorization, loss functions, held-out data. Then give me the residue report. Which parts go through cleanly (I'd bet the underdetermination part does)? Which parts only survive if you fudge, and where exactly does the fudge happen? And which parts have no counterpart in my vocabulary at all -- for instance, is there something in his picture of correctness that a loss function can't capture, given that the loss function is itself a rule that somebody had to have meant? I'm especailly curious whether his appeal to a community of speakers maps onto anything real on my side (the labelers? the training distribution? a shared prior?) or whether that's just him relocating the problem. Bottom line: is my it's-just-inductive-bias reaction basically right and the philosophy is dressing, or is there a genuine thing I'm not seeing -- and if the latter, what would my vocabulary have to gain in order to see it?
