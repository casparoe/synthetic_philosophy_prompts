      *   *Sentence 3:* "Turing showed you can have a perfect computing machine that does arithmetic without knowing what arithmetic is."
          *   Verdict: Nod. Syntax without semantics.
      *   *Sentence 4:* "Same lesson both times: comprehension is never actually doing any work — competence is all there is."
          *   Verdict: **Wince/No.** This is the pivot point. Dennett says comprehension *emerges* from competence. It *does* work (it allows flexibility, error correction). Rosa is eliminating comprehension; Dennett is naturalizing it.
