          *   Divergence: Darwin explains biological *function/fit*. Turing explains formal *symbol manipulation*. Does Turing explain *semantics* (meaning)? That's the crux.
      *   *Concept 2: Competence without Comprehension.*
          *   Dennett's phrase (from *From Bacteria to Bach and Back*).
          *   Meaning: Systems can do things reliably (competence) without having an internal model or conscious awareness of *why* (comprehension).
          *   Example: A termite mound is competent architecture, termites don't comprehend architecture.
          *   Crucial Nuance: Dennett usually argues comprehension *evolves out of* competence. It's not that comprehension is *nothing*, but that it's built from layers of competence. Rosa seems to be saying comprehension is *eliminated* or *epiphenomenal*.
      *   *Concept 3: The LLM Leap.*
          *   Rosa's claim: LLMs understand *exactly as much as you do*.
          *   Dennett's likely view: LLMs have immense competence. Do they have comprehension? Dennett is a functionalist/interpretivist. He might say "understanding" is a matter of degree and stance. But equating LLM understanding to *human* understanding ignores the embodied, evolutionary history Dennett thinks is crucial for *real* comprehension (agency, reasons, not just causes).
