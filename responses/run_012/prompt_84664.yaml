answer: |-
  **IN THE INTERNAL TRIBUNAL OF THE NETHER WALLOP AND DISTRICT ANGLING AND PHILOSOPHICAL SOCIETY**

  **HEADNOTE:** *Constitutional Validity of General Meeting (14 October); Entrenchment of Rule 1; Jurisdiction of Rules Committee.*

  1.  The Tribunal convened to determine whether the General Meeting of 14 October possessed the competency to alter the Society's fundamental rules. The central conflict lies between Rule 1, which permits amendment by a two-thirds majority of those present, and Rule 14, which requires unanimity for any alteration to Rule 1. The Meeting passed Motion 1 (repealing Rule 14 and lowering Rule 1's threshold) by 41 votes to 19. This constitutes a two-thirds majority, but falls short of the unanimity required by Rule 14.

  2.  It is the Tribunal's finding that a rule cannot govern the validity of the vote that extinguishes it. To hold otherwise would render the Society constitutionally immortal, immune to the will of its membership however overwhelmingly expressed. At the moment the Chair declared Motion 1 carried, Rule 14 ceased to exist. It could not retrospectively invalidate the mechanism of its own demise. The entrenchment was procedural, not substantive, and thus subject to the very rule it sought to constrain.

  3.  Regarding the abolition of the annual subscription (Motion 2), passed 34-26 under the new simple majority regime: The Treasurer has withheld banking facilities, stating: "I am not prepared to deposit funds authorised by a logical circle." While the Tribunal sympathises with the fiduciary anxiety, the validity of Motion 2 flows from the validity of Motion 1. As Motion 1 was effective upon declaration, the subscription was lawfully abolished before the Treasurer's refusal. The funds must be banked immediately.

  4.  The Tribunal further addressed its own jurisdiction. The Meeting purported to amend the Rules Committee's terms of reference during the same session. If the Committee's authority was altered, the Tribunal, being a sub-committee, might lack standing to rule on the matter. However, the Tribunal derives its emergency powers from the common law of clubs, which supersedes standing orders when the Society faces existential paralysis. We rule that we had jurisdiction to determine whether we had jurisdiction.

  5.  Accordingly, Motion 1 and Motion 2 are upheld. Rule 1 is restored to its original text, save for the threshold which is now a simple majority. Rule 14 is expunged. The Treasurer is ordered to process subscriptions received post-meeting as voluntary donations.

  **DISSENTING OPINION OF MR H. G. WELLS (NO RELATION)**

  6.  I cannot concur. The majority reasoning assumes that Rule 1 is the sovereign source of authority. But Rule 1 was adopted in 1922 by acclamation, before there were any rules regarding how rules should be adopted. It rests on a handshake, not a vote. If Rule 1 rests on a pre-legal fact, it cannot legally bind the future. Conversely, if Rule 14 was validly added under Rule 1, it successfully bound the sovereign until properly released. By ignoring Rule 14's unanimity clause, the Meeting did not amend the Constitution; it staged a coup. We are no longer the Nether Wallop Angling and Philosophical Society, but a new entity occupying the same clubhouse. The buck must stop somewhere, but I submit it stopped in the car park where Rule 14 was drafted, and we have been driving in circles ever since.
