  5.  **Refining the Word Count:**
      *   Need to ensure it hits 1,800–2,500. I need to expand on the descriptions of the technology and the internal monologue of Aris to bulk it up without fluff. The dialogue needs to be substantive.
      *   *Expansion:* Describe the room. The haptic feedback of the stylus. The visualizations on the screen. The history of the institute (The Chalmers Institute? No, don't use names. The Institute for Phenomenal Mapping).
      *   *Deepening the Philosophy:* Make sure Elara's argument hits the "knowledge argument" angle indirectly. If we can't interact with qualia, how do we know about them?

  6.  **Writing - Step-by-Step:**
