      *   *The Institute's Stance:* They believe qualia exist but don't cause anything. They use neural tracing to find the *physical* causes of the reports. They claim this validates the reports as evidence *about* experience, assuming a pre-established harmony or common cause structure.
      *   *The Junior's Challenge:* If the physical causes determine the report independently of the qualia, the correlation between report and qualia is miraculous or accidental. Therefore, the reports aren't reliable evidence *of* qualia, just of neural states. The institute's practice presupposes interactionism (qualia affect physics) or deflationism (qualia just *are* the judgments).
      *   **Dramatic Tension:** The institute needs certification to continue funding/operations. The Senior wants to sign off. The Junior says signing off is intellectually dishonest or scientifically void under their own metaphysics.

