answer: |-
  You should reject step (1).

  **Why it looked compelling**
  Premise (1) encodes the classical realist intuition that to be "real," a category must correspond to a discrete structure in the world, independent of human cognition. This aligns with the Platonic ideal of "carving nature at its joints," where joints imply sharp, objective boundaries. It feels necessary to distinguish scientific discovery (finding what is there) from linguistic stipulation (imposing what is not).

  **The Repair and its Costs**
  To resolve the paradox while keeping (2), (5), and (7), you must replace (1) with a principle that decouples "reality" from "boundary precision." The standard repair is the **Homeostatic Property Cluster (HPC)** view: a category is a real kind if its members share a cluster of properties stabilized by underlying causal mechanisms (e.g., genetics, ecology), even if the boundaries of that cluster are vague or partly stipulated.

  **What this allows you to claim about *Homo sapiens***
  You can assert that *Homo sapiens* is a real kind because it constitutes a stable cluster of phenotypic and genotypic traits maintained by reproductive and ecological causal processes. You concede that the boundary between *H. sapiens* and adjacent taxa (like *H. neanderthalensis*) is fuzzy and partly determined by taxonomic convention, but you deny that this fuzziness makes the kind itself an artefact. The reality lies in the causal clustering, not the sharpness of the cut.

  **What this forces you to concede about 'chair'**
  Because you are confident in (5)—that the boundary problem is structurally identical for 'chair'—rejecting (1) forces you to concede that **boundary vagueness alone is insufficient to dismiss 'chair' as a real kind.** You lose the ability to use imprecise boundaries as the demarcation criterion between natural kinds and artefacts. To maintain a distinction, you must argue that 'chair' fails to be a real kind for a *different* reason (e.g., its clustering is grounded in human intention rather than mind-independent causal laws), not because its boundaries are stipulated.

  \answer{1 Real kinds permit vague, grounded boundaries}
