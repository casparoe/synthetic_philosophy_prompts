prompt: |-
  I'm a third-year phil student and I'm in this weird seminar that's half philosophy of science, half information theory. Our paper prompt is basically does Occam's razor have anything to do with probability, and I'm definately overthinking it. The problem is I don't even know which of the things people call Occam's razor is supposed to be doing the work. Could you tier the following by how well each one actually supports the claim that simpler hypotheses are more likely to be true (or at least better to believe)?

  - The metaphysical rule about not multiplying entities beyond necessity -- fewer kinds of things is better.
  - Shorter description length in a fixed formal language, Kolmogorov-complexity style.
  - Highest prior under a universal mixture over all computable hypotheses, i.e. Solomonoff induction.
  - Best two-part code / minimum description length when you have to send both the model and the data.
  - Fewest free parameters after fitting, or whatever AIC/BIC-style penalized likelihood is doing.
  - Cognitive simplicity: the hypothesis a human can grasp, remember, and use most easily.
  - Predictive simplicity: the hypothesis that makes the most confident novel predictions or is easiest to test.

  I know these overlap and maybe some aren't even seperate competitors, but that's kind of the point. Sort them into tiers (or give scores) for how much each earns the slogan simpler is more likely, and say in a sentence why each lands where it does. Also flag any that I've set up as a false contrast. At the end, tell me how confident you are in the overall ranking and which single placement your least sure about.
