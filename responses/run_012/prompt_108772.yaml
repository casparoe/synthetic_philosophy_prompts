answer: |-
  Your intuition that you are distinguishing between "keeping the record" and "keeping the observance" is correct, but it is incomplete. That distinction explains Cases 1, 3, and 5, but it fractures when applied to Cases 2, 4, and 6. The missing variable is not just *how* we remember (record vs. ritual), but *what kind of wrong* is being remembered (political/structural vs. personal/biographical).

  Your verdicts suggest a hybrid principle: **Public institutions have a duty to preserve evidence of structural or political harm indefinitely, but private actors are not obliged to perform rituals of grief, and individuals retain a right to biographical oblivion unless their actions constituted political betrayal.**

  This principle rescues most of your intuitions but requires you to tighten the definition of "political harm" and accept one significant overturning regarding the grandmother's diary. Below is the breakdown of the clauses derived from your cases, the application to your new scenarios, and the honest assessment of where your consistency fails.

  ### The Clauses of the Principle

  1.  **The Clause of Structural Evidence (Cases 1 & 5):** Physical sites and endowments that document the *capacity* for harm (a prison) or the *source* of public goods (an endowment) must be preserved as records, even if honorific markers (statues) are removed. This forbids erasing the physical infrastructure of the past for the sake of present comfort.
  2.  **The Clause of Political Accountability (Case 4):** Records detailing betrayal of the public trust (informers, collaborators) must remain accessible to the public, overriding the reputational interests of descendants. This forbids sealing archives to protect the innocent families of those who enabled injustice.
  3.  **The Clause of Biographical Rehabilitation (Case 6):** Individuals who have served their debt for personal crimes have a right to have that information delisted from general public view, provided the crime was not an act of political betrayal. This forbids perpetual public shaming for ordinary criminal rehabilitation.
  4.  **The Clause of Non-Compulsory Ritual (Cases 2 & 3):** Families and descendants are not morally obliged to perform public acts of grief, remembrance, or publication, even if those acts have social value. This forbids conscripting the living into the emotional labor of the dead.

  ### The Necessary Overturning

  To make this principle hold, you must overturn part of your verdict on **Case 2 (The Grandmother's Diary)**.

  You argue the diary should be kept but not published, remaining effectively private. However, in **Case 4**, you argue that police files on informers must be open, rejecting the descendants' interest. If the grandmother passed information to an *occupying army* resulting in *deportation*, she is functionally an informer. If the public has a right to know the identity of informers in police files (Case 4), they have a right to know the identity of collaborators in family diaries once those diaries enter an archive (Case 2). You cannot claim the "family" shield protects political betrayal in one case but not the other. The distinction between "private family" and "public archive" collapses when the content reveals political crimes against neighbors.

  ### Application to New Cases

  **1. The Museum of Atrocity Photographs**
  *   **Verdict:** The museum should display the photographs, even without identification.
  *   **Why:** This falls under the **Clause of Structural Evidence**. The photographs document the *system* of atrocity, not primarily the biographical identity of the perpetrators. Anonymization respects the **Clause of Biographical Rehabilitation** (for low-level perpetrators perhaps), but the *act* must be witnessed. Suppressing them would violate the duty to preserve evidence of structural harm.

  **2. The Village and the Unmarked Grave**
  *   **Verdict:** The village is entitled to leave the site unmarked.
  *   **Why:** This falls under the **Clause of Non-Compulsory Ritual**. A grave marker is a form of observance/ritual, not a record (assuming the deaths are recorded elsewhere). Case 5 required keeping the *prison* (site of perpetration/structural evidence), but this is a *grave* (site of victimhood/grief). Victim communities have sovereignty over how they grieve. Forcing a marker would conscript the children into a grief they wish to navigate differently.

  ### Residual Tensions

  Even with this repair, two tensions remain in your thinking:
  1.  **The Definition of "Political":** You distinguish the informer (Case 4) from the criminal (Case 6), but the line is blurry. If the criminal's crime was a hate crime, does it become political? Your principle requires a bright line you haven't drawn.
  2.  **The Burden on Descendants:** In Case 5, you ask the town to keep the prison (a burden on the community). In Case 3, you spare the grandchildren the reading (a relief to the family). The distinction is "site" vs. "event," but practically, maintaining a site is also a burden. You have not fully justified why a physical burden is acceptable but a ritual one is not.

