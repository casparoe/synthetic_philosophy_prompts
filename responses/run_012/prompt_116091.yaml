prompt: |-
  ok so during covid my school made everyone install this lockdown browser for tests. it takes over your whole laptop, you cant open other tabs, and it turns the webcam on and records you for the whole exam while some AI watches the video and flags you if you look away from the screen, or talk, or if a dog barks, or if someone walks in. afterwards the teacher gets a report with a suspicion score on it, and a bunch of kids got in trouble for stuff they definately didn't do. my teacher said this is basically Foucault's panopticon and I kind of see it but I also don't think it fits, because in the panopticon the whole point is you never know if your being watched, and here we know exactly whats happening, everybody knows the AI is dumb, and honestly it felt like more people cheated than ever. my friend says the real difference is that the panopticon watches you but this thing scores you, and that's the scarier part.

  can you do the actual mapping for me? who's the prisoner and who's the guard, what does Foucault's stuff about discipline actually predict about a tool like this — the examination, normalizing judgement, making kids into docile bodies, power/knowledge — and is the lockdown browser really discipline in his sense, or just old fashioned punishment with new gadgets? then tell me where it breaks: what parts of the case his framework can't handle (the company selling the software to the school, the fact that no one is actually watching live, the flags being secret so you can't even argue back), and what that says about the theory. also does my friends watched vs scored distinction do any real work here, or is Foucault already ahead of it? no need to cite anything.
