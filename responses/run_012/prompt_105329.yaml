      *   **Tone:** Intellectual, candid, slightly frustrated ("weeks now," "can't shake," "be straight with me"). They want substance, not a bibliography.
      *   **Core Question:** What would actually count *against* the position that culture evolves via Darwinian selection? Rank these objections. Distinguish between strong (literal replicators) and weak (selection-like) versions.
      *   **Final Challenge:** Is the position unfalsifiable/insulated? Is that a flaw or a feature?

  2.  **Deconstruct the Core Debate:**
      *   **The User's Position:** Cultural Darwinism (CD). Variation, Selection, Inheritance.
      *   **The Friend's Objection:** "Reconstruction vs. Replication." If I invent the wheel because physics says so, and you invent the wheel because physics says so, that's not inheritance. That's convergent evolution driven by the environment/psychology, not copying. If most cultural transmission is reconstruction (learning from scratch based on cues) rather than replication (copying the form), then "inheritance" is weak, and selection can't accumulate complex adaptations.
      *   **The Nuance:** Strong CD (Memes/Replicators) vs. Weak CD (Dual Inheritance Theory/Evolutionary Psychology adjacent).

  3.  **Brainstorming Objections (What counts against CD?):**
      *   *Fidelity of Transmission:* Can cultural traits be copied accurately enough? (The Friend's point).
      *   *Blending Inheritance:* Culture blends (ideas mix), biology particles (genes don't blend). Does this break selection?
      *   *Intentionality/Agency:* Humans choose. Is it selection or design? (Lamarckian vs. Darwinian).
      *   *Timescales:* Culture changes too fast.
      *   *Units of Selection:* What is the "gene" of culture? (Memas vs. holistic culture).
      *   *Convergent Invention:* Independent discovery (calculus, agriculture) suggests environmental determinism, not lineage.

  4.  **Ranking and Categorizing Objections:**
      *   *Tier 1 (The Heavy Hitters):* The Reconstruction/Replication distinction (Friend's point) and the Problem of the Unit (What is being selected?).
      *   *Tier 2 (Significant but manageable):* Intentionality (Lamarckian accusation) and Blending Inheritance.
      *   *Tier 3 (Less decisive):* Timescales, mere metaphor accusations.

  5.  **Addressing the Strong vs. Weak Distinction:**
      *   *Strong (Memetics):* Needs high-fidelity copying of specific units. Very vulnerable to the Friend's objection.
      *   *Weak (Cultural Evolutionary Theory):* Focuses on statistical patterns of change. More robust, but risks becoming tautological ("things that spread, spread").

  6.  **Addressing the "Insulation/Falsifiability" Question:**
      *   This is crucial. If every counter-example is explained away as "a different kind of selection" or "bias in transmission," the theory loses predictive power.
      *   Need to be honest: Yes, it risks being unfalsifiable if not carefully bounded. But so does standard evolutionary biology sometimes (just-so stories). The test is *predictive success*, not just post-hoc explanation.

  7.  **Drafting the Response (Iterative Process):**

