answer: |-
  This is one of the oldest and sharpest fights in the philosophy of social science, and your mate has put his finger on the exact pressure point where the theory tends to buckle. You are right to suspect that the answer depends entirely on whether you are holding the "Strong" version (memes as literal replicators) or the "Weak" version (population-level patterns that look like selection).

  Here is the breakdown of what actually counts against your position, ranked by how damaging they are, followed by the straight talk on falsifiability you asked for.

  ### First: The Strong vs. Weak Distinction
  You admitted you're sliding between these two. You need to stop, because the evidence that kills one leaves the other alive.

  *   **The Strong Claim (Memetics):** Cultural traits are *replicators*. They are discrete units (like genes) that are copied with high fidelity from mind to mind. Selection acts on these units.
  *   **The Weak Claim (Cultural Evolutionary Theory):** Cultural change *looks like* a selection process at the population level. People vary in behavior, some behaviors are adopted more than others, and this changes the population over time. It doesn't require discrete "cultural genes," just statistical inheritance.

  **Why it matters:** If you hold the Strong Claim, your mate's objection is potentially fatal. If you hold the Weak Claim, his objection is a technical hurdle, not a dealbreaker.

  ---

  ### The Objections, Ranked

  Here are the specific arguments that ought to move you, ranked from "Existential Threat" to "Annoying Nuance."

  #### 1. The Reconstruction vs. Replication Problem (Your Mate's Point)
  **Rank:** #1 (Existential Threat to Strong Claim)
  **The Argument:** In biology, a gene is inherited because a physical copy is made (DNA replication). In culture, most "inheritance" is actually *reconstruction*. I don't copy your idea of "democracy" into my brain like a file transfer; I observe the world, use my own psychology to infer how things work, and build my own version of "democracy."
  **Why it counts against you:** If I build my version based on my psychology and the environment, and you build yours based on yours, and we end up with similar ideas, that is **convergent evolution**, not inheritance. Selection requires a lineage. If 100 people independently invent the wheel because round things roll, that's physics, not cultural selection. If you can't prove a causal chain of copying, you don't have inheritance. Without inheritance, selection cannot *accumulate* complexity. It resets every generation.
  **How a defender responds:** They will argue that reconstruction is *biased*. We don't invent from scratch; we try to copy, but our brains distort the copy in predictable ways. Therefore, the "lineage" is preserved through the bias, even if the copy isn't perfect.
  **The Verdict:** If you claim culture is *literally* like genetics (Strong), this is a massive problem because fidelity is too low. If you claim culture is *statistically* like genetics (Weak), this is manageable, provided you can show the biases are stable over time.

  #### 2. The Unit of Selection Problem
  **Rank:** #2 (Conceptual Threat)
  **The Argument:** In biology, we mostly agree on what a gene is (a stretch of DNA). In culture, what is the unit? Is it a word? A sentence? A ritual? A whole religion? A fashion trend?
  **Why it counts against you:** You cannot measure "fitness" (success at reproducing) if you cannot define the "organism" or "gene" that is reproducing. If a religion spreads, is it the "God concept" that was selected, or the "community gathering" practice, or the "moral rule"? If the unit is fuzzy, you can't track it. You can't say "Variant A outcompeted Variant B" if you can't draw a border around A and B.
  **How a defender responds:** They stop looking for discrete "ideas" and start looking at *behaviors* or *artifacts*. The unit is the measurable action (e.g., "shaking hands" vs. "bowing").
  **The Verdict:** This makes the theory much harder to apply. If you have to redefine the "unit" for every new example to make the math work, you are engaging in curve-fitting, not science.

  #### 3. The Lamarckian Objection (Intentionality)
  **Rank:** #3 (Structural Threat)
  **The Argument:** Darwinian selection requires "blind variation." Mutations happen randomly; nature selects. In culture, humans *design* changes. We see a problem, invent a solution, and teach it. This is Lamarckian (inheritance of acquired characteristics), not Darwinian.
  **Why it counts against you:** If variation is directed by intelligence toward a goal, "selection" is just a fancy word for "people choosing good ideas." It removes the need for a Darwinian algorithm.
  **How a defender responds:** Individual invention is Lamarckian, but *group* adoption is Darwinian. I might invent a tool on purpose, but whether it spreads through the population depends on social dynamics, prestige bias, and conformity that I don't control. The *spread* is blind, even if the *invention* isn't.
  **The Verdict:** This is a strong objection to the idea that *invention* is Darwinian, but less so to the idea that *diffusion* is. However, if humans are rational adopters who always pick the "best" tool, selection is redundant. Selection only matters if people adopt things for non-rational reasons (prestige, habit, error).

  #### 4. Blending Inheritance
  **Rank:** #4 (Technical Threat)
  **The Argument:** Genes are particulate (you get the blue eye gene or the brown eye gene; they don't mix to make green). Culture blends. If I like Jazz and you like Rock, our kids might like Jazz-Rock.
  **Why it counts against you:** In early biology, blending inheritance was a problem for Darwin because it dilutes variation. If everything blends into an average, extreme variants disappear, and selection has nothing to work on.
  **How a defender responds:** Culture doesn't always blend; often it conforms. People tend to copy one model exclusively (e.g., speaking one accent), preserving the distinct variants.
  **The Verdict:** This is mostly a mathematical hurdle. Modern models can handle blending, but it complicates the claim that culture is *just like* biology.

  ---

  ### The "Insulation" Question

  You asked me to be straight: **Is this position qualified until nothing could ever count against it?**

  **Yes.** And that is a genuine problem, though perhaps not a fatal one.

  Here is the trap: A committed Cultural Darwinist can explain *any* outcome.
  *   If a useful technology spreads? **Selection.**
  *   If a useless superstition spreads? **Maladaptive byproduct / Drift.**
  *   If a harmful practice spreads? **Group selection / Signaling.**
  *   If nothing changes? **Stabilizing selection.**

  When a theory can explain X, Not-X, and Stasis with equal ease, it risks becoming a "just-so story" machine. It becomes a descriptive language rather than a predictive engine. You can look at any cultural phenomenon and say, "Ah, yes, clearly that variant had higher fitness," without ever having been able to predict it beforehand.

  **Is this a flaw or the price of generality?**
  It is a flaw *if* you claim it is a hard science equivalent to population genetics. It is acceptable *if* you claim it is a heuristic framework (a way of asking questions).

  **What would actually falsify the Weak Version?**
  To prove you aren't just insulating the theory, you need to commit to a prediction that could fail. For example:
  1.  **The Prediction:** "If this trait is selected for, it should correlate with [specific social variable], even when it reduces individual economic wealth."
  2.  **The Risk:** If you find that cultural spread *always* aligns perfectly with individual rational choice and never with blind conformity or bias, then the Darwinian model is redundant. Rational Choice Theory explains it all; you don't need "selection."
  3.  **The Hard Test:** Find a case where a cultural trait spreads *despite* being harmful to the adopters and *despite* having no obvious group benefit, purely due to transmission bias (e.g., it's easier to remember). If you can't find cases where "copying error" drives history more than "rational choice," the Darwinian element is doing no work.

  ### Summary Advice for Your Argument

  If you want to keep your position without being bullied by your biologist mate:

  1.  **Retreat to the Weak Position.** Concede that cultural "replicators" aren't physical particles like DNA. Argue that "inheritance" in culture is a statistical tendency for behaviors to resemble predecessors, not a perfect copy mechanism. This neutralizes his "Reconstruction" objection because you aren't claiming perfect fidelity, just enough correlation for selection to act.
  2.  **Accept the "Lamarckian" Label.** Admit that cultural evolution is *Dual Inheritance*. It has a Darwinian component (spread of variants) and a Lamarckian component (directed invention). Claiming it's *purely* Darwinian is where you get vulnerable.
  3.  **Watch Out for the "Just-So" Trap.** If you find yourself explaining why a trait spread *after* it already spread, you are doing history, not science. To defend the theory, you must identify the *mechanism of transmission* (e.g., "people copy high-status individuals") before you predict the outcome.

  **The Bottom Line:**
  Your mate is right that if "inheritance" is just independent people having similar ideas because they live in similar environments, it isn't evolution. It's environmental determinism. To save your position, you must prove that **history matters**—that people do things specifically because their predecessors did them, errors and all. If you can show that cultural change is path-dependent (you can't understand the present without the specific sequence of the past), you have inheritance. If the present can be explained solely by current psychology and environment, you don't.

  That is the line in the sand. Stand there.
