          *   #2: The Unit Problem. If you can't define the "cultural gene," how do you measure fitness?
          *   #3: Intentionality (Lamarckism). Does choice break the "blind" variation requirement?
          *   #4: Blending Inheritance. Does mixing destroy the particulate nature required for selection?
      *   *Section 3: How Defenders Respond.*
          *   Against Reconstruction: "Copy Error" is still copying. Biases channel reconstruction.
          *   Against Units: Look at practices/behaviors, not just ideas.
          *   Against Intentionality: Selection acts on the *outcome*, not the intent.
      *   *Section 4: The "Insulation" Question.*
