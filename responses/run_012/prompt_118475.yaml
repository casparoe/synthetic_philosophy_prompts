      *   *Claim 2: Two consequences: Know all logical truths; Know implications immediately.*
          *   Verdict: Accept. These correspond to Necessitation ($\vdash \phi \Rightarrow \vdash K\phi$) and Distribution ($K(\phi \to \psi) \to (K\phi \to K\psi)$).
