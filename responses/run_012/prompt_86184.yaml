answer: |-
  The translation

  **Foundationalism**
  In your terms, this view says the search stops at a specific kind of record, not necessarily the first human. A foundationalist genealogist believes some documents are self-authenticating—they don't need backup. A certified death certificate or a direct DNA match acts as a concrete slab; you build on it, but you don't dig under it. When you hit a brick wall, you accept it as a boundary, not a failure. Your instinct that this means "finding the first couple" is slightly off; it means finding the *last reliable document*. The chain of proof bottoms out when you reach a source so authoritative that questioning it becomes unreasonable, like a parish register signed by the minister himself. You don't need to know who his parents were to trust his signature. The regress ends because the evidence itself carries its own weight, allowing you to declare a line "proven" even if biology continues backward.

  **Coherentism**
  This view matches your experience with pedigree collapse. When your 3x-great-grandparents were second cousins, your chart stopped being a tree and became a web. A coherentist argues that no single document proves anything alone; instead, the whole network holds the weight. A census record supports a DNA match, which supports a family story, which loops back to confirm the census. There is no bottom layer of "perfect" records; there is only mutual support. If one branch looks weak, you strengthen it by tightening the connections elsewhere. This handles the "document behind the document" problem by refusing to look for a single backbone. Truth isn't a vertical line down to a bedrock source; it's the tension across the whole grid. If the web holds tight without snapping, the ancestry is valid, even if every individual record has gaps.

  **Infinitism**
  This is the hardest fit because biology ends, but the *questioning* doesn't have to. An infinitist genealogist accepts that you never actually finish proving a line. Every document requires another document to verify it, forever. You don't stop at the parish register; you ask who verified the minister's identity, and so on. In practice, this looks like treating every "proven" link as merely "currently supported." There is no final brick wall, only a horizon that moves as you approach it. This isn't about finding infinite ancestors; it's about accepting infinite steps of justification. You keep researching not because you hope to find the first human, but because the standard of proof demands an endless chain. The search itself is the answer. You never declare a line closed; you just stop working when you get tired, knowing the justification remains theoretically incomplete.

  Where the fit is clean

  *   **The Regress:** Your feeling of needing the "document behind the document" is the exact epistemic regress philosophers describe.
  *   **Coherentism and Pedigree Collapse:** The way cousin marriage turns a tree into a web is a perfect physical metaphor for coherentist justification.
  *   **Foundationalism and Brick Walls:** Accepting a record as the final stop mirrors the philosophical move to stop at "basic beliefs."

  Where you had to bend it

  I had to bend Infinitism significantly. In philosophy, an infinite chain is logically possible; in genealogy, biological lines end at speciation or creation. I framed it as methodological infinity (the research never ends) rather than biological infinity. I also had to correct your Foundationalist instinct: it's not about the "first couple" (biological start), but the "last reliable record" (evidentiary stop). The philosophy cares about where justification stops, not where biology starts.

  The residue

  Three specific pieces of the argument leave residue when translated, and the fault lies differently in each case.

  First, the **nature of the foundation**. In philosophy, a foundational belief is often self-evident (like "I exist"). In genealogy, your "foundation" is a physical record, which can be forged or mistaken. When a foundationalist says "stop here," a genealogist knows the record could still be wrong. This is **genealogy's fault**. The vocabulary of empirical history cannot guarantee the incorrigibility that philosophy demands. You are dealing with probabilities, not logical certainties, so the "bottom" is always slightly muddy.

  Second, **circularity**. The Baron Munchausen pulling himself up by his hair represents vicious circularity—using a claim to prove itself. Philosophers hate this. But in your web, when cousins marry, the lines *do* loop back physically. A coherentist uses this looping support as a strength; a logician sees it as a fallacy. This is **philosophy's fault** (or rather, its limitation). Formal logic struggles to model biological reality where loops are facts, not errors. The translation exposes that coherentism works better for family history than it does for mathematics.

  Third, **the goal of the search**. Infinitism suggests the endless chain is fine. But genealogy has a practical end: you run out of records. When the philosophy says "keep going forever," and the archive says "no more boxes," the conflict isn't about truth, it's about resources. This is **genealogy's fault**. The vocabulary is tied to physical existence and survival of paper, whereas the philosophy is about abstract justification. The "infinite" option feels empty because your research is bounded by death and decay, not just logic.

  Bottom line

  Your instinct that coherentism is "the tree is really a web" is spot-on, but foundationalism isn't about finding the first couple; it's about trusting the last reliable record. You aren't flattening the philosophy, but you are mixing biological limits with evidentiary standards.
