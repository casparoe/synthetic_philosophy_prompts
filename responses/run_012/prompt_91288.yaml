answer: |-
  This is a fantastic pedagogical challenge. You are trying to induce an *epistemic crisis* in 75 minutes. The "Black Box" method is the standard tool for this, but it often fails because the hardware gets in the way of the philosophy (loose wires look like anomalies, students focus on the soldering).

  Here is the runnable package. I recommend a **hybrid approach**: physical boxes for the tactile "science" feel, but **Arduino microcontrollers** inside for the logic. This satisfies your colleague's desire to solder, stays under £30, and ensures the "Anomaly" beat is programmable and reliable rather than dependent on you faking a glitch.

  ### 1. Materials & Prep (Budget: ~£30)

  **The "Instruments" (x2)**
  *   **Brains:** 2x Arduino Uno (or Nano) boards. (~£10 each on Amazon/eBay).
  *   **I/O:** 2x Large Arcade Buttons (satisfying to press), 2x Bright LEDs, resistors, wires. (~£10 total).
  *   **Housing:** 2x Opaque plastic project boxes or sturdy cardboard painted matte black. (~£5).
  *   **Power:** 2x 9V batteries + clips. (~£5).
  *   **The Code:** Upload the *same* code to both Arduinos.
      *   *Logic:* If Button A is pressed, LED flashes once. If Button B is pressed, LED flashes twice. If A+B pressed together, LED stays on for 2 seconds.
      *   *The Trap (Beat 3):* Program a counter. `if (totalPresses > 12) { LED_flickers_randomly(); }`. This ensures the anomaly happens automatically during the activity without you touching the box.
  *   **Secrecy:** Hot-glue the lids shut. Label them "Instrument Alpha" and "Instrument Beta."

  **Classroom Setup**
  *   **Tables:** Arrange 4 distinct tables.
  *   **Groups:** 4 Groups of 4 students.
  *   **Isolation:** Groups 1 & 2 get Instrument Alpha. Groups 3 & 4 get Instrument Beta. (Actually, for Beat 1, you want Groups 1 & 2 to have the *same* evidence but different theories. So Groups 1 & 2 share Instrument Alpha, but **cannot speak to each other**. Groups 3 & 4 share Instrument Beta).
  *   **Handouts:**
      *   *Query Sheets:* Pre-printed forms where they record Input (Switch state) and Output (LED state).
      *   *Theory Cards:* Blank index cards for writing their "Internal Mechanism" hypothesis.

  ### 2. Rules & Turn Structure

  **The Cover Story:**
  "These instruments measure a specific physical phenomenon. Your job is to determine the internal causal mechanism. You cannot open the instrument. You cannot measure voltage. You can only observe Input-Output relations."

  **The Constraints:**
  1.  **Query Limit:** Each group gets exactly **8 Queries**. (This forces them to be strategic and prevents them from exhausting the logical space).
  2.  **Silence:** Groups cannot speak to other groups.
  3.  **Submission:** After 8 queries, they must submit a **Theory Card**. It must include:
      *   A diagram of what is inside.
      *   A rule explaining how the input causes the output.
  4.  **The "Anomaly" Phase:** After submitting theories, they get **4 More Queries**.

  ### 3. Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:05: Setup & Briefing**
  *   Hand out Query Sheets.
  *   State the rules. Do **not** use words like "underdetermination," "realism," or "theory." Call it "The Mechanism."
  *   Send Groups 1 & 2 to Instrument Alpha (opposite corners of the room). Send Groups 3 & 4 to Instrument Beta.

  **00:05 – 00:25: Phase 1 (Investigation)**
  *   Groups run their 8 queries.
  *   TA circulates to enforce the query limit (tick off their sheet).
  *   *Critical:* Ensure Group 1 and Group 2 do not compare notes. They are effectively running parallel experiments on the same "nature."

  **00:25 – 00:35: Phase 2 (The Divergence)**
  *   Collect Theory Cards.
  *   **The Reveal:** Ask Group 1 to read their mechanism. Ask Group 2 to read theirs.
  *   *Likely Outcome:* Group 1 says "It's a logic gate." Group 2 says "It's a timer circuit." Both fit the 8 data points perfectly.
  *   **Action:** Write both diagrams on the whiteboard. Highlight that the data is identical, but the stories are incompatible.
  *   *Ask:* "Based *only* on the data you have, who is wrong?" (They will say "Both could be right" or "We need more data.")

  **00:35 – 00:45: Phase 3 (The Equivalence Trap)**
  *   Tell them: "I will now give you 4 new queries." (Run the pre-programmed queries that both theories predict correctly).
  *   Both groups confirm their theories predict the new data.
  *   *Ask:* "Did this new data solve the disagreement?" (No).
  *   *Point:* More of the same kind of evidence doesn't necessarily break the tie.

  **00:45 – 00:55: Phase 4 (The Anomaly)**
  *   The Arduino code triggers the "flicker" anomaly (Query 13+).
  *   The LED behaves oddly (e.g., double flash when it should be single).
  *   **Task:** "Your theory must account for this new reading. You cannot change your core mechanism. You can only add an assumption about the *conditions* of the experiment."
  *   Groups write a "Rescue Hypothesis" on a new card (e.g., "The battery is draining," "The button is sticky," "There is background interference").
  *   Collect cards. Read them out. Both groups have saved their theory by blaming an **auxiliary assumption**.

  **00:55 – 01:15: The Debrief (The Philosophical Payoff)**
  *   (See detailed script below).

  ### 4. The Debrief Script (Mapping the Beats)

  Do not lecture. Draw out the points from their experience.

  **Beat 1: Underdetermination of Theory by Data**
  *   *Ask:* "Groups 1 and 2 had the same box, same data, different theories. Why?"
  *   *Map:* This is **Underdetermination**. The evidence alone does not dictate the theory.
  *   *Distinction:* Ask them: "Could we *eventually* distinguish them?"
      *   If they say "Yes, if we cut the box open," you introduce **Van Fraassen's Constructive Empiricism**. Science aims for *empirical adequacy* (saving the phenomena), not *truth* (what's actually inside). If we can never open the box (like the atom), the difference between Theory 1 and Theory 2 is meaningless for practice.
      *   If they say "No, the logic is identical," you introduce **Strong Underdetermination** (Quine). Some theories are logically equivalent in all possible observations.

  **Beat 2: The Failure of "Just More Data"**
  *   *Ask:* "Why didn't the extra 4 queries help?"
  *   *Map:* **Empirical Equivalence**. Rival theories can be constructed to predict all possible observations. The realist hope that "eventually the data will decide" is not guaranteed.

  **Beat 3: Holism & Auxiliary Assumptions (Duhem-Quine)**
  *   *Ask:* "When the light flickered, did you abandon your theory?"
  *   *Map:* No. You blamed the battery, the button, the environment. This is the **Duhem-Quine Thesis**. We never test a hypothesis in isolation; we test a hypothesis + a web of auxiliary assumptions. If the prediction fails, logic doesn't tell us which part of the web is false. You can always save the core theory by adjusting the auxiliaries.
  *   *Pinch:* "If you can always save the theory, what counts as evidence *against* it?"

  **The Historical Point (Unconceived Alternatives)**
  *   *The Reveal:* Open one box (or project the code).
  *   *Twist:* The code wasn't a logic gate or a timer. It was a **Random Number Generator** biased to look like a logic gate, *or* it relied on a variable they couldn't see (e.g., "The LED only works if the room temperature is above 20°C").
  *   *Map:* **Pessimistic Meta-Induction / Unconceived Alternatives** (Stanford). The problem isn't just choosing between Theory A and Theory B. The problem is that the *true* theory (C) might not be on your list. Your predecessors weren't stupid; they lacked the conceptual vocabulary to conceive of C.

  ### 5. Troubleshooting: What Will Go Wrong

  **1. The "Prise It Open" Rebellion**
  *   *Scenario:* A student tries to peel the tape or shake the box to hear components.
  *   *Response:* Do not scold. Treat it as a methodological breach. "In this experiment, opening the box is equivalent to claiming direct access to unobservables. For the purpose of this seminar, we are operating under the constraint that we only have access to phenomena. If you break the seal, you've left the seminar and entered the workshop."
  *   *Why:* This reinforces the distinction between *observation* and *intervention*.

  **2. The "It's Rigged" Accusation**
  *   *Scenario:* A smart-arse says, "The TA programmed the anomaly, so the box isn't real nature."
  *   *Response:* "Granted. This is a model. But when a real scientist sees an anomaly, how do they know it's 'nature' and not 'instrumental error'? You just faced that exact decision. You assumed the battery was dying (instrumental error) rather than the theory being false. That is exactly what real scientists do."
  *   *Why:* Turn the objection into the lesson. The "rigged" nature mirrors the theory-ladenness of instrumentation.

  **3. Groups Colluding**
  *   *Scenario:* Group 1 texts Group 2.
  *   *Prevention:* Collect phones at the start or frame it as "Independent Verification." If they collude, the Divergence Beat fails.
  *   *Fix:* If you suspect collusion, swap the instruments halfway through. Group 1 gets Beta, Group 2 gets Alpha.

  ### 6. Honest Limitations (For Your Own Prep)

  You asked for honesty about what this activity *cannot* do. Be prepared to acknowledge these in the debrief so they don't feel the analogy is perfect.

  1.  **The Miracle Argument (Putnam):** The activity makes theories look cheap (you can whip up a logic gate in seconds). It does not capture why Realists argue that the *predictive success* of complex theories (like General Relativity) would be a *miracle* if they weren't true. A simple black box doesn't feel "miraculous" when it works.
      *   *Mitigation:* In the debrief, acknowledge: "Real scientific theories unify thousands of phenomena, not just one LED. The Realist argues that *that* level of success demands truth. This box is too simple to capture that weight."
  2.  **Theoretical Virtues:** In the activity, simplicity didn't matter much. In real science, we choose the simpler theory (Occam's Razor).
      *   *Mitigation:* Ask them: "Did one theory feel simpler?" If yes, ask: "Does 'simple' mean 'true' or just 'easier to use'?" This opens the door to Pragmatism.
  3.  **Mathematical Depth:** The box is binary. Real theories are mathematical structures.
      *   *Mitigation:* Acknowledge that the "mechanism" in physics is often mathematical, not mechanical. The "box" is the universe, the "code" is the math.

  ### 7. Why This Works for Your Goal

  You want them to feel the **pinch**.
  *   By limiting queries, you force them to commit.
  *   By making the anomaly programmable, you force them to **choose** between abandoning the theory or blaming the auxiliary. Most will blame the auxiliary (the battery/the wire).
  *   When you point out that they *could* blame the auxiliary forever, they realize that **evidence alone does not force theory change**.
  *   When you reveal the "Unconceived Alternative" (the code was something they never guessed), you undermine their confidence that their current best theory is the "final" one.

  This moves them from "Theories work, so they're true" to "Theories save the phenomena, but truth might be inaccessible," which is exactly the Constructive Empiricist position you want them to grapple with.

  ### 8. Final Checklist for the TA

  *   [ ] **Code the Arduinos** 24 hours before. Test the "anomaly counter" to ensure it triggers within the 12-16 query window.
  *   [ ] **Seal the boxes** visibly. Use red "Evidence - Do Not Break" tape. It makes breaking it feel transgressive.
  *   [ ] **Print Query Sheets** with large checkboxes to speed up recording.
  *   [ ] **Prepare the Whiteboard:** Draw two columns: "Group 1 Theory" and "Group 2 Theory." Leave space for "Auxiliary Assumptions."
  *   [ ] **Mental Prep:** When they say "But obviously the switch connects to the light," resist the urge to agree. Say: "That is your theory. What is the *evidence* for the connection, versus the evidence for the correlation?"

  This plan keeps the hardware cheap and reliable, puts the philosophical weight on the *structure of the inquiry* rather than the electronics, and ensures you hit the Duhem-Quine and Underdetermination points without uttering the jargon until the reveal.
