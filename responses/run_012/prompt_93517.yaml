      *   **Closest Analogue:** Case 2 (Baker). Same product, different market = Okay. Case N = Same product, same market = Wrong. Also Case 7 (Yarn) regarding commercial vs. personal.
      *   **The Bet:** The **Unfair Competition/Market Substitution** rule. It explains why Case 2 (different country) was okay but Case 7 (mass market) was wrong. It explains why Case 3 (net positive) was okay. It explains why Case 1 (no market) was okay. It treats Case 5 & 6 as extreme versions of market substitution (stealing the *only* market available to the magician/maker).
      *   **Discriminating Test Case:** A case with Attribution + Harm + No Trust, but *Public Benefit*. E.g., A life-saving drug formulation copied by a generic maker, attributed, harming the original pharma company's profits. Or, closer to arts: A community theater copies N's production for a charity gala, causing N to lose a corporate sponsorship.
      *   *Better Test Case:* A case where Attribution is present, Harm is present, but the copier adds significant new value (Transformation). E.g., A parody or a critical reconstruction.
