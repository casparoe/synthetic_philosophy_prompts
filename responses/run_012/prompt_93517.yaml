      *   *However,* in IP ethics, there is a distinction between *ideas* (free) and *expression* (owned). Staging directions are often considered ideas. But "misappropriation" doctrines exist.
      *   *The Colleague's likely bias:* She advises makers/performers. She likely protects labor investment.
      *   *Prediction:* She will likely say **Wrong**. Why? Because the economic harm is direct and substantial, and attribution doesn't cure market substitution in a professional context. The "Trust" element in 5 & 6 is functionally equivalent to the "Professional Norm" in N. Even without explicit NDA, there is a professional norm against cloning a living director's production for direct competition.
      *   *Consistency Check:* Is this consistent with Case 2 (Baker)? Baker sold the tart. Why was that okay? Different country. No direct competition. Case N is *same cities*. So Case 2 supports "Wrong" for Case N based on market overlap.
      *   Is it consistent with Case 3 (Dev)? Dev helped competitor. Case N hurts competitor. So Case 3 supports "Wrong" for Case N based on harm.
      *   Is it consistent with Case 5 & 6? They involved deception. Case N does not. *This is the weak point.* If the colleague says "Wrong," she must argue that attribution is insufficient when the harm is this direct. If she says "Not Wrong," she must argue that without copyright or trust, the market is free, even if harmful.
      *   *Given her role (advises makers/performers):* She likely prioritizes the livelihood of the creator. She will likely argue that the *attribution* is a courtesy, but the *theft of opportunity* is the wrong.
