          *   *Hypothesis B (Consent/Expectation-Based):* Wrong if it violates the reasonable expectations or explicit agreements of the originator regarding the *use* of the work. (Fits 5, 6, 7. Struggles with 2 & 3 where the originator likely didn't consent but it was okay).
          *   *Hypothesis C (Integrity/Attribution-Based):* Wrong if it severs the link between creator and creation *in a context where that link matters* (commercial or professional). (Fits 4 [link kept], 5 [link severed], 6 [link severed], 7 [link severed]. Fits 2 [new name, but different market]).
