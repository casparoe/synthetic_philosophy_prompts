      *   **Consistency:** To be consistent, she must rely on the **Economic Harm/Market Substitution** rule, downplaying the "Deception" aspect of 5 & 6 and the "Trust" aspect. She must argue that in a professional context, direct market substitution is inherently a breach of the "trust" of the professional community, even without an NDA.
      *   **Candidate Rules:**
