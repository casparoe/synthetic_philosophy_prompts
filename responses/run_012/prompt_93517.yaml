      *   *Why:* Because Case 2 establishes that market separation makes copying okay. Case N lacks market separation. Case 3 establishes that net benefit makes copying okay. Case N lacks net benefit (zero-sum). Case 5/6 establish that professional context creates implicit trust. Case N is a professional context.
      *   *Wait, one nuance:* Case 2 (Baker) sold the tart under a *name she invented*. Case N attributes N. Does attribution matter? In Case 4 (Student), attribution made it okay. But Case 4 was non-commercial. So Attribution + Commercial + Harm = ?
