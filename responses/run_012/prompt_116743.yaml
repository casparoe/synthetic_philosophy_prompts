answer: |-
  ### Scratch Brainstorming: Cases and Considerations

  Before we formalize the spec, we need to lay out the raw data. These are the intuitions and puzzles any theory of demandingness has to process.

  *   **The Shallow Pond:** You ruin your shoes to save a drowning child. *Intuition:* Obligatory. If a theory says this is optional, it's dead on arrival.
  *   **The Kidney Donation:** You lose a kidney to save a stranger. *Intuition:* Supererogatory (good but not required). If a theory says this is obligatory, it's likely too demanding.
  *   **The Integrity Objection (Williams):** A theory that requires me to abandon my life's central projects (art, family, research) whenever a slightly better outcome is available treats me as a vessel for utility, not an agent.
  *   **The Moral Saint (Wolf):** A person who maximizes moral value at all times lacks a healthy personality. They are boring, alienating, or psychologically fragmented.
  *   **World vs. Theory:** If there is massive famine, morality will feel heavy. We need to distinguish whether the *theory* is too demanding (asks too much per unit of good) or the *world* is too demanding (requires much to fix basic problems).
  *   **The Fairness/Free-Rider Problem:** If everyone else is selfish, am I required to pick up the slack to the point of ruin? Or does their non-compliance lower my obligation?
  *   **The Arbitrariness Dilemma:** If you set a limit (e.g., "give 10% of income"), why 10%? Why not 11%? If you set no limit (maximalism), you lose the distinction between duty and supererogation.
  *   **Compliance vs. Uptake:**
      *   *Compliance Cost:* The money/time lost performing the act.
      *   *Uptake Cost:* The social isolation, psychological burden, or identity shift required to be the *kind of person* who complies.
      *   *Example:* Giving away wealth is the compliance cost. Being the "weird ascetic" at dinner parties is the uptake cost.
  *   **The Two Colleagues:**
      *   *Colleague A:* Gives 60% of income/time, burns out completely at age 34, stops contributing.
      *   *Colleague B:* Gives 30% of income/time, sustains it until age 74.
      *   *Question:* Who is morally better? Does the theory value the *sacrifice* or the *outcome*? Does it value sustainability?

  ***

  ### The Spec: Desiderata for a Theory of Moral Demandingness

  Here is the organized list. I have divided these into **Non-Negotiable (NN)** constraints—conditions where failure renders the theory implausible for human agents—and **Camp Preferences (CP)**—conditions that reflect specific commitments (e.g., utilitarian vs. deontological) which are contestable but structurally important.

  1.  **The Rescue Floor (NN)**
      *   *Consideration:* The Shallow Pond.
      *   *Requirement:* The theory must classify preventing catastrophic harm to others at trivial cost to the agent as obligatory, not optional.
  2.  **The Integrity Ceiling (NN)**
      *   *Consideration:* Williams' Integrity Objection / The Moral Saint.
      *   *Requirement:* The theory must leave logical space for the agent to pursue ground projects and relationships that constitute their identity without classifying every deviation as a moral failure. It must explain why morality doesn't consume the agent entirely.
  3.  **The Compliance/Uptake Distinction (NN)**
      *   *Consideration:* Social alienation vs. moral cost.
      *   *Requirement:* The theory must distinguish between the direct cost of the act (Compliance) and the social/psychological cost of adopting the moral identity (Uptake). A theory cannot count Uptake Costs (e.g., "people will think I'm weird") as valid moral exemptions, but it must acknowledge that excessive Uptake Costs can make Compliance unsustainable.
  4.  **The World/Theory Separation (NN)**
      *   *Consideration:* Bad world vs. bad theory.
      *   *Requirement:* The theory must provide a metric to distinguish between a theory that is *intrinsically* too demanding (requires disproportionate sacrifice for minor gains) and a situation that is *extrinsically* demanding (the world is so broken that even moderate duties are heavy).
  5.  **The Non-Arbitrariness Condition (NN)**
      *   *Consideration:* The Arbitrariness Dilemma.
      *   *Requirement:* If the theory posits a limit on obligation (a threshold), it must derive that limit from a principle, not a stipulation. "10% of income" is a fudge unless grounded in a deeper account of agency or fairness.
  6.  **The Supererogation Slot (CP)**
      *   *Consideration:* The Kidney Donation.
      *   *Requirement:* The theory must categorize some high-cost, high-benefit acts as "good to do but wrong not to do." (Note: Act-consequentialists will reject this NN status, arguing all good acts are required. This is a major fault line).
  7.  **The Partial Compliance Clause (CP)**
      *   *Consideration:* The Free-Rider Problem.
      *   *Requirement:* The theory must specify whether individual obligation scales up when others fail to comply. (Does my duty increase because you neglected yours, or does my duty cap out at my 'fair share'?)
  8.  **The Sustainability Principle (CP)**
      *   *Consideration:* The Two Colleagues.
      *   *Requirement:* The theory should prioritize long-term efficacy over short-term heroic sacrifice. It should treat burnout as a prudential or moral failure of planning, not a badge of honor.

  ***

  ### (a) Incompatible Requirements: The Trilemma

  I do not believe you can jointly satisfy **The Rescue Floor**, **The Integrity Ceiling**, and **The Non-Arbitrariness Condition** without significant theoretical cost. Here is the argument:

  1.  **The Rescue Floor** implies that if the benefit is high enough (life saved) and the cost low enough, you must act.
  2.  **The World/Theory Separation** admits that the world is currently full of "shallow ponds" (famine, preventable disease) where the cost to you is relatively low (income surplus) but the benefit is high (life saved).
  3.  If you accept 1 and 2 repeatedly, you quickly hit **The Integrity Ceiling**. To save every life you can at "low cost," you must eventually sacrifice the very projects that constitute your integrity (career, family time, rest).
  4.  To stop this slide, you need a limit. But **The Non-Arbitrariness Condition** demands that limit be principled.
  5.  *The Conflict:* Any principled limit that protects Integrity (e.g., "protect core projects") will inevitably forbid some Rescue Floor acts (e.g., "cancel your sabbatical to fund a malaria net"). Any principled limit that secures the Rescue Floor (e.g., "maximize expected value") will violate Integrity.
  6.  *The Hard Truth:* You cannot have a non-arbitrary line that perfectly protects integrity while fully satisfying the rescue intuition in a broken world. You have to choose which intuition gets bruised. Most theories hide this by fudging the definition of "cost" or "integrity."

  ### (b) The Most Exclusionary Requirement

  **The Non-Arbitrariness Condition.**

  This is the filter that eliminates the most candidates. Many plausible-sounding theories die here.
  *   **Simple Threshold Views:** "Morality requires giving 10%." *Verdict:* Fails. Why 10%? Why not 10.1%?
  *   **Naive Intuitionism:** "Morality requires what feels right." *Verdict:* Fails. Too subjective.
  *   **Act-Consequentialism:** *Verdict:* Passes. The line is "maximize good." It's not arbitrary, it's just maximal.
  *   **Hybrid Views:** "Maximize good unless it hurts too much." *Verdict:* Fails unless "too much" is defined by something other than "when I don't want to do it."

  This requirement forces the theorist to do the hard metaphysical or practical work of defining the *source* of the limit. Is it grounded in rationality? Human psychology? Fairness? If you can't name the source, you don't have a theory of demandingness; you have a preference.

  ***

  ### Specific Distinctions: Compliance, Uptake, and The Two Colleagues

  **Compliance Cost vs. Uptake Cost**
  Your spec must force students to separate these.
  *   **Compliance Cost** is the resource drain (money, time, risk). A theory of demandingness is primarily about regulating this.
  *   **Uptake Cost** is the friction of being a moral agent in an immoral society. If a theory requires me to be a saint, the Uptake Cost is that I have no friends left.
  *   *The Spec's Demand:* A theory cannot use Uptake Cost to lower Compliance Obligations. (i.e., "I can't give more money because my friends will mock me" is not a valid moral excuse). However, a theory that generates impossible Uptake Costs is practically self-defeating. The theory should aim to minimize Uptake Cost without lowering the Compliance Floor.

  **The Two Colleagues Case**
  *   *Colleague A (Burnout):* High intensity, short duration.
  *   *Colleague B (Sustainable):* Moderate intensity, long duration.
  *   *What the theory must say:* A robust theory of demandingness should favor **Colleague B**.
  *   *Why:* If morality is a system of guidance for agents over time, it cannot require self-destruction. If Colleague A burns out at 34, they cease to be moral agents. Colleague B produces more total good over a lifetime and maintains agency.
  *   *The Tension:* This pulls against the **Rescue Floor**. If a child is drowning *now*, Colleague A's intensity saves them; Colleague B's moderation might not.
  *   *Resolution:* The spec should require the theory to treat sustainability as a *constraint on obligation*. You are not obligated to do what renders you incapable of future obligation. This makes burnout a moral error (miscalculation of capacity), not a moral triumph.

  ***

  ### Closing: How the Major Contenders Fare

  **Act-Consequentialism (AC)**
  AC performs excellently on **Non-Arbitrariness** (the line is utility maximization) and **The Rescue Floor**. It fails **The Integrity Ceiling** catastrophically; it has no room for agent-centered prerogatives unless they indirectly maximize utility. It also struggles with **The Two Colleagues**; if Colleague A produces more utility in 34 years than B does in 74, AC says A did better, even if A is dead. AC collapses the Compliance/Uptake distinction because only outcomes matter.

  **Rule-Consequentialism (RC)**
  RC handles **The Integrity Ceiling** better by selecting rules that allow for personal life (since a code requiring total self-sacrifice wouldn't be socially adoptable). It handles **Partial Compliance** well by distinguishing ideal from non-ideal codes. However, it risks failing **The Non-Arbitrariness Condition** regarding *which* code is selected. It also struggles with **The Rescue Floor** in acute cases where breaking the rule would save a life without undermining the code.

  **Scalar or Gradualist Views**
  These views (e.g., Norcross) dissolve the problem by removing the binary line between "obligatory" and "supererogatory." They ace **The Non-Arbitrariness Condition** (there is no line to draw) and **The Compliance/Uptake Distinction** (everything is a matter of degree). However, they fail the **Guidance Intuition** implicit in **The Rescue Floor**. Students want to know what they *must* do, not just what is "better." A scalar view tells you that giving everything is better than giving nothing, but it refuses to tell you where the demand stops, which many argue fails the function of a moral theory.
