      *   *Refining the "World vs. Theory" point:* This is crucial. If the world is full of suffering, a moderate theory looks demanding. The theory isn't demanding; the situation is. The spec needs to require the theory to distinguish these.
      *   *Refining the Two Colleagues:* This needs to be explicit in the list or the tension section. Let's put it in the tension section as a clash between "Sacrifice Signaling" and "Efficacy."

  10. **Final Polish:** Check voice. Ensure it sounds like an expert talking to grad students (respectful but rigorous). Ensure the distinction between Compliance and Uptake is clear.

  *(Self-Correction during drafting)*: I need to make sure I don't just list "Utilitarianism bad." I need to list *desiderata* that a theory must meet. The evaluation comes at the end.
  Make sure the "World vs. Theory" distinction is explicit.
  Make sure the "Compliance vs. Uptake" distinction is explicit.

  Let's assemble the response.

  *Structure:*
  1. Intro (Setting the stage).
