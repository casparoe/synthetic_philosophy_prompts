      *   *Scalar/Gradualist:* Dissolves the "requirement" line. Solves Arbitrariness. Fails the "guidance" intuition (what *must* I do?).

  8.  **Review against Constraints:**
      *   Did I distinguish World vs. Theory? Yes, need to ensure that's in the brainstorming or list. Let's put it in the list as a clarification requirement.
      *   Did I label NN vs. CP? Yes.
      *   Is the tone right? Academic, direct, honest about uncertainty.
      *   No bibliography? Check.

