prompt: |-
  I just spent most of last night arguing with my old flatmate — now a fully paid-up neo-republican who reads every political question through non-domination — about whether republican liberty is a genuine third thing or just negative liberty in a nicer coat, and I'm presenting my paper on it at a small political theory workshop next week, so what I need is a Q&A prep sheet, not a pep talk. My line is this: define freedom as the absence of a standing capacity to interfere arbitrarily and you've added a counterfactual clause that no negative account needs — a claim about what someone *could* do to you rather than what they do — and that clause does all the work, so either non-domination collapses back into negative liberty or it quietly turns into a claim about the conditions of self-mastery, i.e. positive liberty, and you can't have it both ways. The case that started the whole argument is the one I'm leaning on: someone on long-term disability benefits whose caseworker never once interferes with anything, but whose every choice is made in the shadow of an annual review that could cut them off — my friend says that's domination without interference and I say it just shows the counterfactual doing hidden work and the republican needing positive liberty to explain why it's bad. The room will be two committed neo-republicans who know the Pettit and Skinner line cold and will definately die on the counterfactual, one Hobbes guy who thinks the positive/negative distinction is a muddle that predates Berlin, and three analytic liberals who'll keep asking what any of this changes for speech codes, workplace rules, or platform moderation. Give me the objections in the order they'll actually come, phrased the way each of those people would phrase them, a two-minute reply for each, what I should concede up front, and where my reply is soft — plus the one question I'm praying nobody asks. Start with the objection that would actually sink me and why, bottom line first, then work down, no preamble.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User's Request:**
      *   **Context:** The user had a heated argument with a neo-republican flatmate about republican liberty (non-domination) vs. negative liberty. They are presenting a paper at a political theory workshop next week arguing that non-domination is either just negative liberty with a counterfactual clause or collapses into positive liberty.
      *   **Core Argument:** Freedom = absence of standing capacity to interfere arbitrarily. This adds a counterfactual clause (what someone *could* do) not needed in standard negative liberty. This clause either makes it negative liberty (just expanded) or positive liberty (conditions of self-mastery). You can't have it both ways.
      *   **Key Example:** Disability benefits recipient. Caseworker never interferes, but annual review looms. Friend (neo-rep) says this is domination without interference. User says this shows counterfactuals doing hidden work + requires positive liberty to explain the harm (psychological shadow).
      *   **Audience:**
          1.  Two committed neo-republicans (Pettit/Skinner experts).
          2.  One Hobbesian (thinks positive/negative distinction is a muddle).
          3.  Three analytic liberals (care about practical application: speech codes, workplace, platforms).
      *   **Format:** Q&A prep sheet. Bottom line first (the sinking objection). Order of likely objections. Phrased as the opponents would phrase them. Two-minute reply for each. Concessions. Weak spots. The "praying nobody asks" question. No preamble.

  2.  **Deconstruct the User's Argument (Strengths & Weaknesses):**
      *   *Strength:* The "disability case" is a strong intuition pump. It highlights the psychological burden of arbitrary power.
      *   *Weakness:* Neo-republicans (Pettit specifically) have thought about this *a lot*. They distinguish "interference" from "domination" precisely to handle cases like this. They argue non-domination is a *social status*, not just a tally of interferences. The user's claim that it collapses into positive liberty is a standard critique (e.g., by Berlinians), but republicans have defenses (it's about external relations, not internal self-mastery).
      *   *Vulnerability:* The "counterfactual" charge. Republicans admit it's counterfactual but deny it's merely negative. They say it's about *structural dependency*.
      *   *Vulnerability:* The "Positive Liberty" charge. If the harm is the *feeling* of insecurity or the *chilling effect*, isn't that about the agent's internal state/capacity? Republicans say no, it's about the objective power relation.

  3.  **Identify the "Sinking Objection" (Bottom Line First):**
      *   Which objection kills the paper?
      *   The Neo-Republicans will attack the definition of negative liberty. If negative liberty is defined *strictly* as non-interference (Hobbes/Bentham), the user wins. But if negative liberty is defined as "absence of constraints on action," republicans argue arbitrary power *is* a constraint, even if unexercised.
      *   *Better Sinking Objection:* The Analytic Liberals or the Neo-Republicans pointing out that the user's "Positive Liberty" collapse is a category error. Non-domination is about *status*, not *capacity*. If the user insists the "shadow" effect makes it positive liberty, the republicans will say, "No, the badness is the dependency, not the psychological feeling."
      *   *Best Sinking Objection:* The Neo-Republican attack on the "Either/Or" trilemma. They will argue there *is* a third thing: Social Status. The user's argument rests on the Berlin dichotomy being exhaustive. If the room accepts Status as distinct from Capacity (Positive) and Interference (Negative), the user's paper fails.
      *   *Decision:* The Neo-Republican objection regarding "Status vs. Capacity" is the theoretical kill shot. It undermines the core trilemma.

  4.  **Drafting the Objections (in order of likelihood/flow):**

      *   *Objection 1 (The Kill Shot):* Neo-Republican on Status vs. Capacity. (Addresses the core theoretical claim).
      *   *Objection 2 (The Counterfactual):* Neo-Republican on the nature of the counterfactual. (Addresses the specific mechanism).
      *   *Objection 3 (The Hobbesian):* The distinction is muddled. (Addresses the historical/conceptual framework).
      *   *Objection 4 (The Analytic Liberal):* Practical implications. (Addresses the "so what?").
      *   *Objection 5 (The "Praying Nobody Asks"):* The normative cost. (If non-domination requires so much, is it worth it? Or: Does your view justify the interference?)

  5.  **Refining the Replies & Concessions:**
      *   Need to be punchy (2 mins).
      *   Need to acknowledge where the user is vulnerable (e.g., the definition of negative liberty).
      *   Need to maintain the user's stance (Non-domination is unstable).

  6.  **Developing the Content (Iterative Process):**

      *   *Objection 1 (Neo-Rep):* "You're assuming Berlin's dichotomy is exhaustive. Non-domination is a *social status*, not a measure of interference (negative) or self-mastery (positive). The disability case isn't about psychological fear (positive); it's about the objective structural dependency."
      *   *Reply:* Acknowledge status is distinct *conceptually*, but argue that the *value* of that status reduces to either security from interference (negative) or capacity to act without deference (positive). The "shadow" only matters if it affects agency.
      *   *Concession:* Admit Pettit explicitly rejects the Berlin map.
      *   *Soft Spot:* If they insist status is sui generis, the user needs a reason why status isn't just a *type* of negative liberty (security).

      *   *Objection 2 (Neo-Rep):* "The counterfactual isn't hidden work; it's the point. Negative liberty looks at the actual chain; Republicanism looks at the potential chain. The disability case proves interference isn't necessary for unfreedom."
      *   *Reply:* Agree interference isn't necessary, but argue that what makes it *unfreedom* is the risk to negative liberty or the demand on positive agency. Without those, "domination" is just a label for 'bad power structures'.
      *   *Concession:* Yes, interference isn't necessary.
      *   *Soft Spot:* Distinguishing 'unfreedom' from 'badness'.

      *   *Objection 3 (Hobbesian):* "Berlin's distinction is a mess. Hobbes knew liberty is just the silence of the law. You're fighting a war over a map that doesn't match the territory."
      *   *Reply:* Even if Berlin is messy, the *conceptual work* being done by republicans relies on one of those two poles. If it's not interference, it's capacity.
      *   *Concession:* Berlin isn't perfect.
      *   *Soft Spot:* Hobbesian might just say "All liberty is negative, you're just adding moralizing."

      *   *Objection 4 (Analytic Liberal):* "Okay, but does this change how we handle workplace speech? If the worker is dominated but not interfered with, do we regulate the boss? If yes, you're infringing negative liberty. If no, why care?"
      *   *Reply:* It forces us to regulate the *power structure* (arbitrariness), not just the *act*. This is more intrusive than liberalism.
      *   *Concession:* It demands more structural regulation.
      *   *Soft Spot:* Justifying that intrusion without sliding into perfectionism (positive liberty).

      *   *The "Praying Nobody Asks" Question:* "If non-domination is the goal, does a benevolent dictator who guarantees security without arbitrariness (via law) satisfy you? If yes, you're not democratic. If no, you value democracy over liberty." (The Contestatory Democracy trap).

  7.  **Review against Constraints:**
      *   Bottom line first? Yes.
      *   No preamble? Yes.
      *   Order of objections? Yes.
      *   Phrasing? Needs to sound like the specific academics (Pettit-speak, Hobbesian bluntness, Liberal pragmatism).
      *   Two-minute replies? (Keep word count tight).
      *   Concessions/Soft spots included? Yes.

  8.  **Final Polish:** Check tone. Needs to be sharp, academic but battle-ready. Ensure the "disability case" is woven in. Ensure the "counterfactual" argument is central.

      *(Self-Correction during drafting)*: Make sure the "Sinking Objection" is truly the one that undermines the thesis. The thesis is "It collapses into Neg or Pos." The sinking objection is "No, it's Status." I need to make sure the reply to that is robust enough for the user to survive, while acknowledging the weakness.

      *(Refining the "Praying Nobody Asks")*: The democracy vs. liberty tension is the classic Pettit vulnerability. If the user argues non-domination is the *only* value, but it requires democratic contestation to define arbitrariness, then liberty depends on democracy, not vice versa. That complicates the "third thing" claim. Let's go with the "Benevolent Dictator" version as it's more intuitive for the room.

      *(Refining the Analytic Liberal)*: Make sure they ask about *remedies*. That's where the Positive Liberty creep happens.

      *(Refining the Hobbesian)*: Keep it cynical.

      *(Refining the Neo-Reps)*: Use words like "eyeball test," "resilience," "arbitrariness."

