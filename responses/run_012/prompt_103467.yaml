          *   **Constraint:** Keep prose fields tight (no essays).

  2.  **Deconstruct Nomic's Theoretical Basis:**
      *   *Core Mechanic:* Rules can be changed by rules. Rule 1 (usually) says rules can be changed.
      *   *Validity:* A rule is valid if it was adopted according to the current rules. This is a positivist view (Hartian "Rule of Recognition" style, but dynamic).
      *   *Identity:* The game remains Nomic as long as the *process* of self-amendment continues, regardless of content. This is a proceduralist view of identity.
      *   *Authority:* Authority resides in the current set of rules themselves (self-referential validity), not in an external source (like a monarch or natural law).
      *   *Tensions:*
          *   Rule 1 (everything changeable) vs. Entrenched Rules (some things harder to change). If everything is changeable, entrenchment is just a temporary hurdle, not a logical barrier. But if entrenchment is real, Rule 1 is false.
          *   Dispute Resolution: If judges interpret rules, does interpretation override text? If rules about judging are changeable, can you change the judge mid-dispute?
      *   *Rival Views:*
          *   Natural Law (content determines validity).
          *   Constitutional Essentialism (unamendable core).
          *   External Foundationalism (authority comes from outside the system).

