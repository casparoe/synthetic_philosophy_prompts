answer: |-
  # Desiderata for a Theory of Pain's Badness

  An adequate theory of pain must explain not merely what pain *is*, but why it is *bad for* the subject who feels it. The following desiderata are organized around the phenomenological and behavioral data any such theory must accommodate. They are framed as constraints on the explanation of badness, rather than commitments to specific metaphysical camps (e.g., Hedonism, Evaluativism).

  ### 1. The Standard Aversion Constraint
  *   **Phenomenon:** Ordinary pain is both felt as awful and actively avoided.
  *   **Forcing Case:** Stepping barefoot on a Lego brick. The subject experiences a sharp sensation, judges it negatively, and immediately withdraws.
  *   **Requirement:** The theory must explain the default, tight coupling between the sensory experience of pain and the motivational/affective response of suffering.
  *   **Status:** **Non-negotiable.** (Any theory that cannot explain the standard case fails as a theory of pain.)

  ### 2. The Asymbolia Dissociation Constraint
  *   **Phenomenon:** Pain sensation can occur without the accompanying "badness" or suffering.
  *   **Forcing Case:** Patients with pain asymbolia (often due to cingulate lesions) report feeling the sharpness or intensity of a pinprick ("It hurts") but deny minding it ("It doesn't bother me") and show no avoidance behavior.
  *   **Requirement:** The theory must allow for the structural separation of the *sensory-discriminative* component (location, intensity) from the *affective-motivational* component (badness, unpleasantness). Badness cannot be identical to the raw sensation itself.
  *   **Status:** **Non-negotiable.** (This is empirical data regarding human neurology; a theory must fit the data, not explain it away as error.)

  ### 3. The Instrumental Neutrality Constraint
  *   **Phenomenon:** Pain can be unwanted or informative without being intrinsically bad for the subject in that context.
  *   **Forcing Case:** A dentist drilling a tooth to save it. The patient finds the sensation intrusive and wishes it were over, but does not regard the pain as a "bad thing" in the all-things-considered sense, nor do they necessarily try to stop the procedure.
  *   **Requirement:** The theory must distinguish between pain being *instrumentally useful* or *merely intrusive* and pain being *prudentially bad*. It must account for why we tolerate pain when it serves a greater good without denying its immediate negative valence.
  *   **Status:** **Non-negotiable.**

  ### 4. The Volitional Paradox Constraint
  *   **Phenomenon:** Pain can be sought, welcomed, or sustained voluntarily.
  *   **Forcing Case:** A marathon runner hitting "the wall," a religious flagellant, or a masochist. The subject seeks out or sustains the painful stimulus.
  *   **Requirement:** The theory must explain how pain can retain its negative character (it still "hurts") while being chosen. It must avoid the implication that choosing pain makes it good, or that sought pain ceases to be pain.
  *   **Status:** **Non-negotiable.**

  ### 5. The Motivation-Affect Decoupling Constraint
  *   **Phenomenon:** The drive to stop pain can come apart from the felt awfulness of the pain.
  *   **Forcing Case:** Opioid analgesia. Patients often report the pain is still present and intense ("I feel it") but they no longer care ("I don't mind"). Conversely, in some anxiety states, mild sensations provoke massive avoidance.
  *   **Requirement:** The theory must locate the "badness" in a component that can be chemically or psychologically dissociated from the sensory intensity, without reducing badness merely to a disposition to act (since the act can be blocked while badness remains, or vice versa).
  *   **Status:** **Non-negotiable.**

  ### 6. The Cognitive Ceiling Constraint
  *   **Phenomenon:** Pain is bad for subjects lacking complex cognitive capacities.
  *   **Forcing Case:** A newborn infant crying after a heel prick, or a dog yelping when stepped on.
  *   **Requirement:** The badness of pain cannot depend on capacities these subjects lack (e.g., complex concepts of "damage," linguistic ability, moral reasoning, or higher-order beliefs about their own mental states).
  *   **Status:** **Non-negotiable.** (Moral and biological continuity suggests if it is bad for us, it is bad for them in a relevantly similar way.)

  ### 7. The Implicit Aversion Constraint (Constructed Case 1)
  *   **Phenomenon:** Explicit denial of dislike coexists with implicit withdrawal.
  *   **Forcing Case:** **"The Distracted Stoic."** A subject under a specific dissociative drug reports, "The shock does not bother me at all," and when asked directly, refuses to press a button to stop it. However, when engaged in a demanding cognitive task, their arm involuntarily flinches away from the shock source, and their skin conductance shows high stress.
  *   **Probe:** This tests whether badness is constituted by *explicit judgment* or *sub-personal valuation*. If the subject says it isn't bad, but the body treats it as bad, where does the badness reside?
  *   **Requirement:** The theory must adjudicate the authority of first-person reports versus third-person behavioral/physiological markers of aversion.
  *   **Status:** **Non-negotiable.**

  ### 8. The Explicit Exaggeration Constraint (Constructed Case 2)
  *   **Phenomenon:** Explicit claims of unbearable badness coexist with a lack of avoidance.
  *   **Forcing Case:** **"The Dramatic Invalid."** A subject receives a mild thermal stimulus. They verbally report, "This is unbearable, it is the worst thing imaginable," yet they remain seated, read a book, and make no move to adjust the stimulus or withdraw.
  *   **Probe:** This tests the *sincerity and conceptual mastery* of first-person reports. If badness is defined by the report, this pain is maximally bad. If badness is defined by functional impact, it is negligible.
  *   **Requirement:** The theory must determine if "badness" is fixed by the subject's linguistic categorization or by the pain's actual impact on their flourishing/behavior.
  *   **Status:** **Non-negotiable.**

  ***

  ### Incompatible Desiderata Pair

  There is a significant tension between **Desideratum 7 (Implicit Aversion)** and **Desideratum 8 (Explicit Exaggeration)** regarding the **Authority of First-Person Reports**.

  *   **The Conflict:** To satisfy **Desideratum 7**, a theory must privilege behavioral/physiological dispositions over explicit report (since the Stoic says "it's fine" but flinches). To satisfy **Desideratum 8**, a theory must privilege explicit report over behavior (since the Invalid says "it's unbearable" but sits still).
  *   **The Incompatibility:** A theory cannot simultaneously hold that (A) "Badness is what the body/implicit system treats as bad" and (B) "Badness is what the subject says it is."
  *   **Resolution Requirement:** An adequate theory must provide a hierarchy of authority. It must explain *why* the Stoic is wrong about their own experience (implicit badness trumps) OR why the Invalid is right despite their inaction (explicit judgment trumps). Most theories fail by picking one side dogmatically.

  ***

  ### The "Killer" Constraint

  The single requirement that does the most to rule out popular contenders is **Desideratum 2: The Asymbolia Dissociation Constraint**.

  *   **Why it rules out contenders:**
      *   **Simple Hedonism:** Fails immediately. If pain's badness is intrinsic to the sensation type, asymbolics shouldn't feel pain without suffering.
      *   **Pure Imperativism:** Struggles. If pain is a command ("Stop this!"), why do asymbolics receive the command but feel no imperative force? (Requires ad hoc "muted command" clauses).
      *   **Desire-Based Accounts:** Fails. Asymbolics feel pain but lack the desire for it to stop.
      *   **Strong Perceptualism:** Struggles. If pain is the perception of badness, asymbolics are perceiving pain but not badness, implying badness is not the object of perception but something added.
      *   **Evaluativism:** Survives best, *but* only if it can satisfy **Desideratum 6 (Cognitive Ceiling)**.

  While the **Cognitive Ceiling (Desideratum 6)** is the specific killer for *Evaluative* theories (which require concepts of damage), the **Asymbolia Constraint** is the broader filter that dismantles the monistic intuition shared by Hedonism, Imperativism, and Desire theories. It forces any adequate theory to be a **Dual-Component Theory** (separating sensation from affect), which is the highest hurdle for traditional accounts.

  ***

  ### Scorecard: Theory Performance on Key Constraints

  | Theory Camp | Asymbolia (Separation) | Cognitive Ceiling (Animals) | Motivation-Affect Split | First-Person Authority |
  | :--- | :--- | :--- | :--- | :--- |
  | **Simple Hedonism** | **FAIL** (Sensation = Badness) | PASS | FAIL | PASS |
  | **Desire-Based** | **FAIL** (No desire in asymbolia) | PASS | PASS | PASS |
  | **Evaluativism** | PASS (Evaluation can be muted) | **FAIL** (Animals lack concepts) | PASS | PASS |
  | **Imperativism** | WEAK (Command ignored?) | WEAK (Animals understand commands?) | PASS | PASS |
  | **Perceptualism** | WEAK (Perceiving without affect?) | PASS | PASS | PASS |
  | **Hybrid/Dual-Component**| **PASS** | **PASS** | **PASS** | **PASS** |

  *Note: Only a Hybrid or Dual-Component theory (e.g., Sensation + Non-Conceptual Affect) currently satisfies all non-negotiable desiderata without significant ad hoc modification.*
