answer: |-
  Good afternoon. Welcome to the field.

  Look around you. Look at the flags snapping in the wind, the tables laid out with food, the faces of neighbors you haven't seen since last year. We are gathered here to mark the midsummer. We are gathered here to be a town.

  There are stories about this day. You have heard them. Some say this gathering stretches back eight centuries, unbroken since the Middle Ages. Others say it is a recent thing, stitched together for show. You will not hear me settle that argument from this podium. I am not here to give you a date. I am here to talk about what we are doing right now.

  I want to speak first to the committee and the families who have kept this festival alive. There were years when the grass grew high here. There were years when the funds ran low and the turnout was thin. You could have let it go. It would have been easy. Instead, you sewed the flags. You polished the bells. You sent the letters. You kept the fire lit when the wind was against it. Whatever the history books might say about the origin of this day, the history of this town is written by your refusal to let it fade. That work is real. That care is real.

  I also see faces here that are new. I see young people who look at the costumes and the dances and wonder if they are looking at a play. You have sharp eyes. Things change. Costumes are mended and replaced. Steps are taught differently than they were once taught. Reasons shift. If a thing never changed, it would be a stone, not a life.

  So, what makes a tradition real?

  It is not a question of how many years ago it started. A song is not real because it was written long ago. A song is real because it is sung. If you stop singing it, it dies. If you sing it, it lives. The age of the song matters less than the breath in your lungs.

  This festival is real because you are standing in it. It is real because the committee cared for it when no one else would. It is real because you, today, have chosen to spend your Saturday here instead of anywhere else. A tradition is not a relic we protect behind glass. It is a path we walk. If we walk it, it holds. If we stop, it disappears. The truth of this day is not in the past. It is in the present. It is in the hands that pass the food, the feet that learn the step, the voices that join the chorus.

  Nothing is taken away from the people who kept this going knowing that things change. In fact, it adds weight to their work. They did not inherit a machine that runs itself. They inherited a garden that needs watering. They watered it. Now it is our turn.

  So, here is what I ask you to do. Do not just watch. Do not stand at the edge with your hands in your pockets.

  Find someone wearing the festival colors—whether they have worn them for fifty years or put them on for the first time this morning. Ask them what this day means to them. Listen to the answer. Then, before you leave, learn one thing. Learn the name of one dance. Learn the recipe for one loaf of bread. Learn the story of one ribbon.

  Take that thing home. Keep it. And next year, teach it to someone else.

  That is how we make this real. Not by counting the years, but by counting on each other.

  Enjoy the festival.
