prompt: |-
  My clinic does asylum casework and I'm trying to guess what our appeals chamber will do with a new file before I write the submission, so I need the rule the chamber has actually been running, not the one it says it runs. Heres the log from the last two years, as best I can reconstruct it. The chamber isn't bound by outside case law and mostly ignores it, so don't worry about what some other court somewhere held.

  - woman beaten by her ex-husband, local police told her it was a family matter and wouldn't take a report: refugee status.
  - shopkeeper in a district taken over by an armed gang, extorted weekly, beaten once, police never came: allowed to stay, but only on the lesser protection ground, not as a refugee, on the reasoning that the gang wasn't after him for who he is.
  - conscript who refused to redeploy to a unit that was massacring civilians in his home province, and who faces years in prison for it: refugee status.
  - young man from an ethnic group the state won't issue ID papers to, so he can't work legally and can't register a marriage, no violence at all: refugee status.
  - gay man from a country where it's criminalised but prosecutions are rare and he's never been touched by police: refugee status.
  - student organiser held over a weekend, released without charge, told to stop; he stopped, the party's rallies have gone unbothered for a year: refused.
  - family who came overland through a neighbouring country where they had no ties, no right to work, and would've been parked in a camp for years: chamber said it wouldn't send them back there.
  - man who'd already been given protection in a third country and travelled on: refused and sent back.

  New file: a man from a group the government is clearing out of a resource-rich province. Police bulldozed his village last year, he lost the farm, and the government has announced the whole group has to move to a resettlement site; nobody has been detained or beaten. He came here overland through a neighbouring country where his brother has a work permit and has offered to take him in, and he's got an uncle back in his own capital who's lived there ten years with no trouble and says he can get him a job.

  What do you think the chamber does with him? I'm less interested in the answer than in the rules that fit the log -- I can see at least three that fit it and they don't agree about him -- what each one predicts, which you'd put money on and why, and which single extra case would tell me whether I've got the chamber's real rule or just a story I like. If the log genuinely undertermines it, say so, and tell me what I'd be betting on either way. Also: does any of this turn on who else could take him in, or is the chamber only ever asking who counts? I can't tell from the log and it definately matters for how I write the facts up.
