  10. **Final Polish:** Ensure the distinction between "Non-Negotiable" (for *any* theory of content) and "Teleo-Specific" is clear. (e.g., History is teleo-specific, Misrepresentation is non-negotiable). *Wait, actually:* For a *Naturalistic* theory, History might be argued as non-negotiable to solve Misrepresentation. I need to be nuanced there. I will frame History as the *Teleo proposal* for meeting the Non-Negotiable condition of Misrepresentation.

