      *   *Misrepresentation* $\rightarrow$ The Normativity/Truth-Condition Condition.
      *   *Novel Content* $\rightarrow$ The Generality/Detachability Condition.
      *   *Swamp/Artificial* $\rightarrow$ The History/Independence Condition.
      *   *Compositionality* $\rightarrow$ The Productivity/Structure Condition.
      *   *Mere Marker* $\rightarrow$ The Distinction Condition (Representation vs. Causation).

  4.  **Fleshing out each Condition:**
