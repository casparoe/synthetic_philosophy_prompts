      *   **Tone:** Academic but direct, analytical, "spec-sheet" style.

  2.  **Deconstruct the Core Problem:**
      *   The "Aboutness" problem (Intentionality) in a physical world.
      *   The Teleosemantic Solution: Content is determined by biological function (selected effect).
      *   The Challenge: Naturalizing normativity without circularity.

  3.  **Drafting the Adequacy Conditions (The "Spec"):**
