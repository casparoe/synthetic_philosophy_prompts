      *   *Motivation:* Why is this needed? (The "Case").
      *   *Teleosemantic Mechanism:* How does selection history try to solve it?
      *   *Status:* Non-negotiable (must have for *any* theory of content) or Camp Commitment (specific to teleosemantics or specific variants).

  5.  **Addressing the Specific "Stuck Points":**

      *   **Misrepresentation:** This is the big one. If content = function, how do I malfunction?
          *   *Requirement:* The theory must distinguish *normal conditions* (where function is fulfilled) from *actual conditions* (where it might fail).
          *   *Teleo move:* A state represents X if it was selected *for* indicating X. If it indicates Y but was selected for X, it's a misrepresentation.
          *   *Risk:* Is "selected for" just a disguised normative claim?

      *   **Novel Content (Uninstantiated properties):**
          *   *Requirement:* Content cannot be limited to past causal interactions.
          *   *Teleo move:* Functions generalize. A heart pumps blood even if it's never pumped *this* specific blood before. Similarly, a detector for "predator" works for a new type of predator if it falls under the selected category.
          *   *Risk:* Does selection history lock you into the *specific* past stimuli (Fodor's objection)?

      *   **Swampman/Artificial Systems:**
          *   *Requirement:* Content must depend on history, not just current structure/causal role. (This is the Teleo commitment).
          *   *Teleo move:* Swampman has no content because no history. AI has no content (on strict Millikan view) because no evolutionary history.
          *   *Risk:* This feels counterintuitive. Is "History" a non-negotiable requirement for *content*, or just for *biological* content?

      *   **Compositionality/Systematicity:**
          *   *Requirement:* Complex thoughts built from simple parts.
          *   *Teleo move:* Hard. Millikan tries with "intentional icons." Dretske struggles.
          *   *Risk:* This might be the breaking point. Selection works on phenotypes, not syntactic structures.

      *   **The "Mere Marker" Problem (User's specific stress test):**
          *   *Case:* State S caused by X, causes X-appropriate behavior, but isn't *about* X (e.g., a thermostat, or a reflex).
          *   *Requirement:* Distinguish *representation* from *information/causation*.
          *   *Teleo move:* Need a "consumer" system. The state isn't just a link; it's a map used by another system.
          *   *Risk:* Does "used by" sneak in intentionality at the consumer end?

  6.  **Identifying Incompatibilities (The "Gold" for the essay):**
      *   *History vs. Intuition (Swampman):* If you demand History (to solve Misrepresentation), you lose Swampman. If you save Swampman (by focusing on current structure), you lose the solution to Misrepresentation (because current structure doesn't distinguish error from success).
      *   *Normativity vs. Naturalism:* To solve Misrepresentation, you need Norms. To be Naturalistic, you need to reduce Norms to Physics/History. The tension is whether "Selected Effect" is truly descriptive or covertly normative.
      *   *Atomism vs. Compositionality:* Selection selects whole organisms/traits. It's hard to see how it selects for *constituent* semantic values that combine systematically.

  7.  **Refining the "Non-Negotiable vs. Camp Commitment" Distinction:**
      *   *Non-Negotiable:* Misrepresentation (any theory of content needs this), Compositionality (if we're talking about *mind* not just sensors), Distinction (Representation $\neq$ Causation).
