prompt: |-
  ok so im in a philosophy of mind seminar and this week we're on the "how does anything in a purely physical world end up being *about* something" problem, specifically the teleosemantics / biosemantics angle (Millikan, Dretske, that whole selection-history move). before i start my essay i want the spec, not another summary of who said what. so:

  what would a naturalistic theory of mental content actually have to get right? i mean the requirements any "content is grounded in biological function or selection history" story has to meet to even be in the running. give me the list, with the case or consideration behind each requirement, and then tell me which ones are non-negotiable and which are really just commitments of one camp dressed up as adequacy conditions.

  the things im stuck on and want covered, roughly:

  - misrepresentation: a state can be about X even when its wrong about X. how do you get that out of a story built on what a state is supposed to do, without smuggling in norms you said you were naturalizing?
  - states that represent things the creature has never interacted with, or properties nothing has ever instantiated. does the selection story even have resources here or does it just fail.
  - the swamp-ish worry, but for content, plus the case of an artificial system, like a net trained by gradient descent to navigate, where there's no selection history at all. what requirement decides whether that thing has content.
  - compositionality / systematicity: can the story scale from a frog-detector up to something with thoughts, or does it only ever get you simple indicator states.
  - and heres one i made up to stress-test theories: imagine a creature with an internal state that's reliably caused by X and always drives behaviour that's appropriate to X, but where you'd still want to say it doesnt represent X at all, its just a marker doing mechanical work. what does a theory need to add to rule that out, and is that addition itself naturalistic or does it sneak the normativity back in.

  and flag any pair of these you think cant be jointly satisfied, thats the part im most interested in. if it turns out teleosemantics just cant have them all at once then say so, thats a result. skip the scorecard against every author, i'll do that in class, i just want the criteria and their motivation first.
