answer: |-
  Here is the spec sheet for a Naturalistic Theory of Mental Content, specifically tuned for the Teleosemantic/Biosemantic framework.

  This breaks down the **Adequacy Conditions** (what the theory *must* do to count as a theory of content), the **Motivation** (why it's required), the **Teleosemantic Mechanism** (how selection history attempts to solve it), and a **Classification** (Non-Negotiable vs. Camp Commitment).

  At the end, I have mapped the **Incompatibilities**, which is where your essay will likely find its critical edge.

  ---

  ### The Spec Sheet: Adequacy Conditions for Naturalistic Content

  #### 1. The Error Condition (Misrepresentation)
  *   **The Requirement:** The theory must explain how a state can be *about* $X$ but occur when $X$ is absent, or fail to occur when $X$ is present, without collapsing into "whatever causes the state is the content."
  *   **The Motivation:** Without this, you have correlation/information, not representation. A thermometer reading "30°C" in a 20°C room is *wrong*. A causal theory says the content is "20°C + thermometer malfunction." A content theory says the content is "30°C" and the world is the problem. You need to ground the possibility of failure.
  *   **The Teleosemantic Mechanism:** Content is fixed by **Normal Conditions** (conditions under which the mechanism performed its selected function in the evolutionary past). If the state occurs outside Normal Conditions, it is a misrepresentation. The norm is grounded in historical success, not current accuracy.
  *   **Classification:** **Non-Negotiable.** (Any theory of intentionality needs this).
  *   **Risk:** Smuggling normativity in. Is "Normal" a statistical average or a normative ideal? Teleosemantics bets it's the latter, grounded in history.

  #### 2. The Detachability Condition (Novel Content)
  *   **The Requirement:** The theory must account for content regarding things the organism has never encountered, properties never instantiated, or future scenarios.
  *   **The Motivation:** I can think about a golden mountain or a specific shade of blue I've never seen. If content is locked to past causal interactions (like a simple causal covariation theory), thought is imprisoned by history.
  *   **The Teleosemantic Mechanism:** **Generalization of Function.** Selection selects for mechanisms that handle *types* of situations, not just token past interactions. A frog's detector is for *flies* (the food type), not just *the specific flies it ate*. If a BB pellet triggers it, it's a misrepresentation of a fly, not a representation of a BB.
  *   **Classification:** **Non-Negotiable.** (Human thought is clearly productive/novel).
  *   **Risk:** The "Disjunction Problem." Why is the content *Fly* and not *Fly-or-BB-at-t1*? Teleosemantics says: because *Fly* is what explained the survival success. But this relies on how finely you carve the "function."

  #### 3. The History Condition (Swampman & AI)
  *   **The Requirement:** The theory must decide whether a physically identical duplicate without a past (Swampman) or an artificial system with a different kind of history (AI/Gradient Descent) has content.
  *   **The Motivation:** This tests whether content is intrinsic to current structure or extrinsic to causal lineage.
  *   **The Teleosemantic Mechanism:** **Strict Lineage.** Content *requires* a history of selection by reproductive fitness. Swampman has no content (no history). AI has no content (no biological fitness history, only engineering goals).
  *   **Classification:** **Camp Commitment.** (This is the specific price Teleosemantics pays to solve The Error Condition).
  *   **Risk:** It violates strong intuitions. If Swampman acts exactly like me, denies he has thoughts. If a neural net navigates perfectly, denies it represents the maze. This makes the theory revisionist.

  #### 4. The Consumer Condition (The "Mere Marker" Stress Test)
  *   **The Requirement:** The theory must distinguish between a state that merely *causes* appropriate behavior (a reflex/thermostat) and a state that *represents* the world to a system.
  *   **The Motivation:** Your stress test: A state reliably caused by $X$ driving $X$-behavior might just be a mechanical link (like a key turning a lock). Representation implies a "map" used by a system, not just a causal push.
  *   **The Teleosemantic Mechanism:** **Producer/Consumer Asymmetry.** A state represents only if there is a *Consumer* system that uses the state as a guide, and the Consumer's function depends on the state's accuracy. The content is determined by what the Consumer needs the state to be.
  *   **Classification:** **Non-Negotiable (with Teleo flavor).** (You need *some* way to separate representation from causation).
  *   **Risk:** Circularity. Does the Consumer system itself have content? If yes, regress. If no, how does it "use" the map without understanding it? Teleosemantics says the Consumer's *function* provides the norm, not its understanding.

  #### 5. The Compositionality Condition (Systematicity)
  *   **The Requirement:** The theory must explain how simple representational states combine to form complex thoughts with new truth conditions (e.g., "The cat is on the mat" vs. "The mat is on the cat").
  *   **The Motivation:** Minds aren't just bags of detectors. We have structured thought. If the theory only explains "fly detectors," it hasn't explained *mind*.
  *   **The Teleosemantic Mechanism:** **Intentional Icons.** (Millikan's move). Complex representations are built from parts that have independent functions, combined according to rules that also have functions.
  *   **Classification:** **Non-Negotiable.** (For a theory of *human* mind).
  *   **Risk:** **High Failure Probability.** Selection acts on whole organisms or phenotypic traits. It is incredibly difficult to show how natural selection selects for *syntactic combination rules* independently of the semantic values. This is the hardest hurdle for Biosemantics.

  ---

  ### The Incompatibility Matrix (The "Result" You Want)

  Here are the tensions where Teleosemantics likely cannot satisfy all conditions simultaneously without compromising its naturalistic credentials.

  #### 1. The Error Condition vs. The History Condition (The Swampman Tension)
  *   **The Conflict:** To solve **Error** (Condition 1) naturalistically, Teleosemantics *needs* **History** (Condition 3). You need the past to define "Normal Conditions" distinct from "Current Conditions."
  *   **The Cost:** If you accept History as non-negotiable to save Error, you must reject Swampman and AI.
  *   **The Incompatibility:** You cannot have a theory that grants content to Swampman (intuitively plausible) *and* solves Misrepresentation purely via selection history (theoretically robust).
      *   *If you save Swampman:* You must ground content in current causal role/structure. But then you struggle to distinguish Error from Success (why is the Swampman's false belief "false" and not just "different causation"?).
      *   *If you save Error:* You must keep History. But then you lose Swampman/AI.
  *   **Essay Angle:** Argue that Teleosemantics solves the technical problem of Error by sacrificing the phenomenological intuition of Instantaneous Content.

  #### 2. The Consumer Condition vs. The Compositionality Condition
  *   **The Conflict:** The **Consumer** solution (Condition 4) works well for atomic states (a signal tells a mechanism to move). It is very hard to scale this to **Compositionality** (Condition 5).
  *   **The Cost:** For a complex thought ("Cat on Mat"), who is the Consumer? Is there a homunculus reading the sentence? Teleosemantics says "other brain systems." But for the combination to have *new* truth conditions, the Consumer must have a function sensitive to the *structure*, not just the parts.
  *   **The Incompatibility:** It is unclear if biological selection can select for *structural rules* of consumption independently of specific survival outcomes. If the Consumer's function is just "survive," then the content of the complex thought collapses back into "whatever leads to survival," losing the specific truth conditions required for Compositionality.
  *   **Essay Angle:** This is the strongest attack. Teleosemantics explains *indicators* well (frog flies). It explains *propositions* poorly. The "Consumer" requirement creates a bottleneck that blocks the scaling up to language-like thought.

  #### 3. Naturalism vs. Normativity (The Meta-Conflict)
  *   **The Conflict:** All the above conditions rely on **Function**. But "Function" in Teleosemantics is inherently normative (a heart *ought* to pump).
  *   **The Cost:** To be **Naturalistic**, "Ought" must be reduced to "Is" (history of reproduction).
  *   **The Incompatibility:** The **Mere Marker** stress test (Condition 4) reveals the crack. If a state causes appropriate behavior, why isn't that enough? Teleosemantics says "Because it wasn't *selected* for that." But if the behavior is identical, the "selection" story looks like a mythological add-on to justify a norm that isn't doing physical work.
  *   **Essay Angle:** The theory risks being an *error theory* of norms. It claims to naturalize normativity, but it actually just relocates normativity from the present (truth) to the past (fitness), without eliminating it.

  ### Summary for Your Essay Strategy

  1.  **Non-Negotiables:** Misrepresentation, Detachability, Compositionality, Distinction (Marker vs. Map).
  2.  **Camp Commitments:** History (Swampman exclusion), Specific "Consumer" mechanism, Biological Fitness (excluding AI).
  3.  **The Fatal Trade-off:** Teleosemantics secures **Misrepresentation** (the hardest problem) by leaning entirely on **History**. This makes it robust against causal theories but vulnerable to **Swampman/AI** intuitions and **Compositionality** scaling.
  4.  **The Verdict:** Teleosemantics is likely the best naturalistic theory of *biological signaling* (Condition 1 & 4), but it fails as a complete theory of *mental content* (Condition 5) because selection history does not easily compose into systematic thought structures.

  If you argue that Teleosemantics is a theory of **biological function** that *mimics* content, rather than a theory of **content** itself, you resolve the tensions. But that concedes that it hasn't actually solved the Philosophy of Mind problem, just the Biology of Information problem. That's a strong thesis.
