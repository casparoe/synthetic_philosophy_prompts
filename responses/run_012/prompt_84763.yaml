      *   **The Philosophy:** It's not pure Retribution (Desert), not pure Utilitarianism (Consequences), and not Victimology. It is **"Moral Agency with a Rehabilitation Offset."** She punishes *bad choices* that indicate *current dangerousness*.
      *   **The Name:** In legal theory, this is closest to **"Limiting Retributivism"** or **"Hybrid Sentencing."** But colloquially, she's a **"Culpability-First Pragmatist."**
      *   **The Prediction:** She will likely lean toward **leniency (Probation/Time Served/Low end)** *IF* the defense frames it correctly.
      *   **Why?**
