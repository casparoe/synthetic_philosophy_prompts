      *   **The Risk:** The Victim's Family. Case 1 shows she gets angry about "choosing phone over life." If she views fleeing as a continuing choice to avoid responsibility, she might get mad. *However*, the 30 years of law-abiding life counters the "fleeing" narrative.
      *   **The "Tell":** What case to watch? **White Collar/Corporate Negligence.** Or **Drunk Driving with High Status.** Does she punish the "choice" heavily even if they are reformed? Actually, better: **Old Cold Cases.** Has she sentenced another cold hit DNA case? That's the specific control variable.

  5.  **Refining the "Rule":**
      *   Is it Desert? No (Case 4 & 5).
      *   Is it Utility? No (Case 1 & 3 are heavy on punishment despite potential rehab arguments).
