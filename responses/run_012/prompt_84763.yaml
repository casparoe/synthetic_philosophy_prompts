          5.  Is there a name for this philosophy?
          6.  The Bet: Which way will she rule and why?

  2.  **Deconstruct the Five Prior Cases to Find the Pattern:**
      *   *Case 1 (Texting Driver):* High Culpability (choice) + Bad Outcome (death) = High Punishment. (Retributive/Desert).
      *   *Case 2 (Stroke Driver):* Zero Culpability (medical emergency) + Bad Outcome (death) = Zero Punishment. (Not Retributive, not Utilitarian).
