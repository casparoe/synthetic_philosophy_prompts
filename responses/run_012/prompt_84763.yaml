      *   *The Bet:* Leniency.
      *   *Why?* Because locking him up accomplishes nothing (Utility) and he isn't the same person who made the choice (Culpability).

  7.  **Final Polish (Tone):**
      *   Needs to sound like senior counsel advising a junior associate.
