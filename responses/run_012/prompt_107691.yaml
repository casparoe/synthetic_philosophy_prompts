      *   **Tone:** Academic/Philosophical, suitable for a high school math/philosophy seminar.
      *   **Constraints:** No citations/references.

  2.  **Deconstruct the Position:**
      *   *Common Misconception:* People think strategy-stealing works because the board is symmetric.
      *   *Actual Mechanism:* It works because having *more* pieces on the board is always better (or at least not worse). This is "monotonicity."
      *   *Role of Symmetry:* Symmetry just ensures the second player *could* have played the first player's opening move if roles were reversed. It sets up the contradiction but isn't the engine of the proof.
      *   *Role of No-Draw:* Needed to go from "P2 doesn't win" to "P1 wins."

