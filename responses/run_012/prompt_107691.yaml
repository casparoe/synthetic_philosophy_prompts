      *   **Requirements:**
          1.  State premises, map reasoning steps, show collapse if premises are dropped.
          2.  Invent a small game where strategy-stealing fails due to the "extra move is harmful" condition (zugzwang/misère).
          3.  State and address the strongest objection (e.g., "all premises are necessary, so distinguishing them is trivial").
          4.  Verdict on what the argument actually is (symmetric vs. monotone vs. non-constructive).
