          *   *Actually, let's use the prompt's suggestion of "extra move is harmful."*
          *   *Game:* "Heavy Stones." Board: 2x2 grid. Goal: Connect top to bottom. *Constraint:* Each stone weighs 1 ton. If your total weight exceeds 2 tons, your bridge collapses and you lose.
          *   *Analysis:* P1 places stone (Weight 1). P2 places stone (Weight 1). P1 must place stone (Weight 2). P1 loses. P2 wins. Strategy stealing fails because P1's extra move caused the loss.
