          *   *Let's try:* "Burdened Connection." Goal: Connect sides. Penalty: For every stone you place, your connection strength decreases. If you place more than 3 stones, you auto-lose.
          *   *Okay, I will design "The Burdened Bridge".*
          *   *Rules:* A path of 3 hexes connects Left and Right. Players place stones. To win, you must occupy all 3. *Wait, that's impossible for one player.*
          *   *Okay, standard Hex rules but:* If you occupy the center hex, you lose immediately.
          *   *Symmetry:* Center is symmetric.
          *   *Strategy Stealing:* P1 plays arbitrary. If P1 plays center, P1 loses. If P1 plays elsewhere, P1 has an extra stone.
          *   *Problem:* In standard Hex, extra stone is good. In this game, extra stone *might* be the center (bad).
          *   *Better:* "Misère Hex" is the standard example. I will describe a simplified version called "Suicide Hex."
          *   *Rules:* Same as Hex. Winner is the one who *fails* to connect their sides first (i.e., if you connect, you lose).
