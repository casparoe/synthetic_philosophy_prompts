answer: |-
  The strategy-stealing argument is one of the most elegant and beguiling proofs in combinatorial game theory, famously employed to demonstrate that the first player must possess a winning strategy in the game of Hex. At first glance, the argument appears to rest on the perfect symmetry of the game board and the identical options available to both players at the outset. However, a closer philosophical examination reveals that symmetry is merely the stage upon which the argument performs, not the engine that drives it. The true weight of the proof rests on a specific structural property of the game known as monotonicity, or the assumption that an extra move can never be a disadvantage. To classify the strategy-stealing argument as a symmetry argument is to mistake the setup for the mechanism. The argument is more accurately understood as a non-constructive existence proof that applies only to a narrow class of games where having more pieces on the board is strictly beneficial, and where a draw is impossible.

  To understand why symmetry is secondary, one must dissect the logical architecture of the strategy-stealing proof into its constituent premises. The argument relies on three distinct claims. The first is the Symmetry Premise: both players begin with identical available moves and identical winning conditions, merely rotated or reflected. The second is the Monotonicity Premise: for any game state, adding a stone of one's own color to the board never turns a winning position into a losing one; an extra move is either helpful or neutral, but never harmful. The third is the Determinacy Premise: the game cannot end in a draw; one player must win. The reasoning proceeds by contradiction. We assume the second player has a guaranteed winning strategy. The first player makes an arbitrary opening move and then, for the remainder of the game, ignores that stone and pretends to be the second player, following the supposed winning strategy of the second player. If the strategy ever calls for placing a stone where the arbitrary opening stone already sits, the first player makes another arbitrary move. Here, the Symmetry Premise allows the first player to adopt the second player's role, but it is the Monotonicity Premise that validates the conclusion. Because the first player effectively has all the stones the second player's strategy would have used, plus one extra arbitrary stone, the first player's position is a superset of the winning position. If the extra stone were harmful, this superset might not win. Thus, the contradiction arises not because the roles were swapped, but because the swap resulted in a strictly superior position for the first player. Finally, the Determinacy Premise converts the finding that the second player cannot win into the conclusion that the first player must win. If any of these premises are dropped, the reasoning collapses. Without Symmetry, the first player cannot mimic the second. Without Determinacy, the game could simply be a draw. But without Monotonicity, the core contradiction vanishes, because the first player's extra stone might block their own path to victory, rendering the stolen strategy ineffective.

  The critical importance of the Monotonicity Premise becomes starkly visible when we examine a game where it does not hold. Consider a variant I shall call "Suicide Hex." The board and rules are identical to standard Hex: a rhombus of hexagonal cells where players alternate placing stones to connect their opposite sides. However, the winning condition is inverted: the first player to connect their two sides loses. This is a symmetric game with no possibility of a draw, satisfying the Symmetry and Determinacy Premises. If the strategy-stealing argument were truly about symmetry, it should prove that the first player has a winning strategy in Suicide Hex just as it does in standard Hex. It does not. In fact, in Suicide Hex, the extra move is a distinct disadvantage. Every stone a player places brings them closer to the losing condition of completing a chain. If the first player attempts to steal the second player's strategy, the arbitrary opening move they make is a burden, not an asset. It occupies space that might have been useful to keep empty and advances their own connectivity toward the fatal completion. Because the Monotonicity Premise is false in this context—the extra move is harmful—the strategy-stealing logic fails completely. This demonstrates that symmetry alone is insufficient to generate a first-player win; the game must also possess the property that additional moves are beneficial.

  A sophisticated objection to this position might argue that distinguishing between the premises is a distinction without a difference. One could contend that since the argument logically requires all three premises to function, isolating Monotonicity as the "real work" is arbitrary. In a valid deductive argument, all premises are necessary conditions; if any one is false, the conclusion does not follow. Therefore, claiming that Monotonicity is more important than Symmetry reduces to the uninteresting observation that an argument needs all of its parts. There is merit to this objection in a strictly formal sense; logically, the premises are conjunctive. However, philosophically and heuristically, the distinction is vital. Symmetry is a common feature of many games, including Chess, Go, and Checkers, yet the strategy-stealing argument does not apply to them. What distinguishes Hex from Chess is not the symmetry of the board, but the monotonicity of the pieces. In Chess, an extra move can be a disadvantage due to zugzwang, where being forced to move worsens one's position. By identifying Monotonicity as the active ingredient, we gain explanatory power: we understand why the argument works for Hex but fails for Chess, despite both being symmetric. Symmetry is the key that fits the lock, but Monotonicity is the hand that turns it. Recognizing this prevents the misapplication of the argument to symmetric games that lack monotonicity.

  Consequently, the verdict on the strategy-stealing argument must be precise. It is not a theorem about symmetric games, nor is it merely a clever trick about role reversal. It is a non-constructive existence proof grounded in the property of move-monotonicity. The content of the theorem is exhausted by the fact that in any finite, symmetric, undrawable game where additional moves are never detrimental, a winning strategy for the first player must exist. The proof tells us nothing about what that strategy is, which is why it remains non-constructive, but it definitively categorizes the game based on the value of a move. To call it a symmetry argument is to focus on the static arrangement of the board rather than the dynamic valuation of the moves. It is a theorem about games where presence is power, and where the board never becomes too crowded to win.

  Finally, it is worth considering how this assumption migrates into non-game settings, such as economics or political strategy, where observers often claim a first-mover advantage based on similar logic. The argument suggests that a market incumbent can simply appropriate any innovation a competitor might have launched, plus their own initial market presence, thereby guaranteeing dominance. Here, the strategy-stealing assumption strains against reality. In business and politics, moves are rarely monotonic. An early move incurs sunk costs, reveals information to competitors, and limits future flexibility. Unlike a stone in Hex, which sits passively and aids connection, a business move often creates liabilities or commits the player to a specific trajectory that may become obsolete. Furthermore, the "board" in real-world competition is rarely symmetric or closed; regulations, consumer preferences, and external shocks introduce asymmetries and draw-like stalemates that the mathematical proof cannot accommodate. While the intuition of strategy-stealing is seductive in these fields, it relies on the false premise that an extra action is cost-free and purely additive. In the real world, as in Suicide Hex, the extra move can often be the very burden that ensures defeat.
