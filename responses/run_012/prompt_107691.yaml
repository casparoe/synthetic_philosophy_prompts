          *   Premise A: Symmetry of initial position (available moves are identical).
          *   Premise B: Monotonicity (an extra move is never a disadvantage).
          *   Premise C: Determinacy/No-Draw (one player must win).
          *   Logic: Assume P2 wins. P1 makes random move. P1 steals P2's strategy. If the strategy calls for the occupied spot, P1 makes another random move. Because of Monotonicity, P1 is at least as well off as P2 would have been. Contradiction. Therefore P2 doesn't win. Because of No-Draw, P1 wins.
