prompt: |-
  I'm in a little philosophy of physics reading group and I missed the week we did the direction of time, so my friend sent me her notes from the chapter we were supposed to read (some popular physics book, I've lost the title). She's definately smart and pretty careful, so I assumed her summary was solid, but a couple of bits are bothering me and I can't tell if it's her or me. Here's what she wrote:

  "The mystery of the arrow of time is basically solved by the second law of thermodynamics. All the laws of physics are perfectly time-symmetric — run any of them backwards and you get another valid solution — so the arrow can't be coming from the laws. Entropy, on the other hand, always increases. That's the arrow: past is lower entropy, future is higher. The only remaining question is why entropy started out low, and the answer is that the universe just happened to begin in a low-entropy state — a statistical fluke, a wildly improbable arrangement. Philosophers call this the past hypothesis. Since it's a fluke, the arrow of time isn't fundamental; it's an accident of our particular universe. This also explains memory: your brain is a physical system whose entropy is increasing, and remembering is just a record of that increase, which is why you remember the past and not the future. These days some people say the thermodynamic arrow is derivative anyway — the fundamental arrow is the growth of quantum entanglement, and thermodynamic entropy is just what that looks like once you coarse-grain. And when the universe eventually reaches equilibrium there won't be any more entropy increase, so time will effectively stop."

  I'm suspicious of the fluke thing (if it's just luck, why does everyone treat the low-entropy start as such a big deal?) and the "time stops" line seems like it can't be literally true. Can you go through her paragraph and sort out what a philosopher of physics would nod along with, what they'd wince at, and what's just wrong — and say whether the entanglement sentence is doing real work or just re-labeling the same problem. Also, she said the laws are all time-symmetric as if it were obviously true; I have a vague memory that that's not quite right, and if it isn't, does that change any of the rest?
