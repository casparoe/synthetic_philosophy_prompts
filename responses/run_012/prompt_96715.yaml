answer: |-
  1. **The Contingency Problem (Part 1)**
  You argue that because God's will is free, the laws of motion are contingent decrees rather than necessary truths. But the *Principia* treats these laws as mathematically universal and demonstrable. How do you square a contingent act of will with the kind of necessity required for a mathematical demonstration?
  *Follow-up:* If the laws are contingent, doesn't that make the mathematics descriptive rather than prescriptive? And if it's merely descriptive, how is that different from the empiricism Newton claims to be rejecting?

  2. **The Contingency Problem (Part 2)**
  Newton's collaborator Clarke insists that God's will always follows the "best reasons." If God is bound by rationality to choose the best laws, isn't that a form of necessity? Is Newton's voluntarism actually strong enough to carry the weight you're putting on it, or does Clarke walk it back?
  *Follow-up:* So are you saying Newton privately held a stronger voluntarism than he allowed Clarke to publish? Because if Clarke is speaking for Newton here, doesn't that reintroduce the necessity you're trying to remove?

  3. **The Presence Problem**
  Newton calls space God's "sensorium" but explicitly denies God is the soul of the world. How do you get a "substantially present" God in space without slipping into the soul-of-the-world view he rejects, and does an extended God have parts?
  *Follow-up:* You haven't answered the parts question. If God is substantially present in space, does He have parts corresponding to spatial parts? If not, what work is the word "substantially" doing that "virtually" didn't?

  4. **Dan's Problem (Part 1: Secrecy)**
  My friend Dan argues that if this theology were load-bearing, it would be in the math, not hidden in a Scholium. Newton kept his heresy secret; if a commitment has to be hidden from everyone who'd object to it, isn't it wallpaper rather than structure?
  *Follow-up:* But what distinguishes load-bearing from decorative here? If the physics functions perfectly without the theology, isn't the theology just a metaphysical comfort blanket rather than a mechanical requirement?

  5. **Dan's Problem (Part 2: The Archive)**
  Dan's Exhibit A is that the General Scholium is an appendix to a maths book. Is there anything in the archive that could settle this—is there a manuscript where Newton explicitly links the math to the heresy, or is the thesis built so that nothing could count against it?
  *Follow-up:* If there's no manuscript that explicitly links them, aren't you relying on a hermeneutic circle where you assume the connection to prove the connection?

  6. **The Philology (Part 1: Mechanics)**
  You argue Newton's textual criticism on 1 John bears on his physics. How does proving a biblical interpolation bear on the law of gravity at all—is it the same instinct for restoration, or is it literally the same argument?
  *Follow-up:* If it's just the same instinct, isn't that a psychological claim rather than a historical one? How does a mindset about scripture logically enforce a mindset about planetary orbits?

  7. **The Philology (Part 2: Athanasius)**
  Newton went after Athanasius's character and career, not just the doctrine. Does where a belief came from have any bearing on whether it's true, or is that just a genetic fallacy to clear the field?
  *Follow-up:* So you're saying Newton believed that corrupt origins invalidate true doctrine? Because if he thought the doctrine was false *because* Athanasius was corrupt, isn't that a theological error on Newton's part that undermines his reliability?

  8. **The Ancients**
  If the true philosophy was ancient wisdom, why present the *Principia* as radical new mathematics, and why not cite the ancients as authorities?
  *Follow-up:* If the answer is that the ancients had the substance but not the demonstrations, isn't that a convenient way to claim their authority while dismissing their actual physics? Is that a real historical claim or a way of having it both ways?

  9. **The 'Subtle Spirit' Paragraph**
  The 'subtle spirit' paragraph at the very end of the General Scholium: is that a theological move or a physical one, and doesn't it quietly undercut the "no hypotheses" discipline?
  *Follow-up:* If it's a physical claim, isn't it exactly the kind of hypothesis he forbids? And if it's theological, why is it in the physics book at all?

  10. **Falsifiability**
  What evidence would make you drop this thesis?
  *Follow-up:* If you say nothing, because the theology is the background framework, isn't that just making the thesis unfalsifiable? Because a claim that explains everything regardless of evidence explains nothing.
