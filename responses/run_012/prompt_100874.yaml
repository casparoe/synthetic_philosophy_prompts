answer: |-
  You have hit on one of the most profound and unsettling tensions in bioethics. Your intuition isn't just "bugging" you; it's identifying a genuine philosophical rift that the law papers over with practical tape.

  To answer your core question: **Yes, the practice of rigidly enforcing advance directives in advanced dementia relies on specific, debatable assumptions about identity and value.** It is not metaphysically neutral.

  Here is what is baked into the current system, broken down by the questions you raised.

  ### 1. The Metaphysics: One Self or a String of Selves?
  You asked if the practice assumes one persistent self or a string of selves. Legally and ethically, it pretends there is **one persistent self**, but it does so as a "legal fiction."

  *   **The Legal View:** The law treats the human body as the continuous entity. As long as the biological organism is the same, the rights attached to it (like the right to refuse treatment) travel with it, regardless of changes in the mind.
  *   **The Philosophical Reality:** Many philosophers (and your intuition) suggest that severe dementia creates a rupture in psychological continuity. The aunt who signed the document valued independence, dignity, and cognitive sharpness. The aunt in the chair values ice cream, warmth, and TV. They share a body, but they may not share a "self."
  *   **What's Baked In:** The system assumes that **biological continuity is enough to carry moral rights.** It assumes the "Then-Self" owns the "Now-Self's" body. If we accepted the "string of selves" view seriously, the "Now-Self" would be a new moral patient with their own rights to life and care, and the "Then-Self's" instructions would look more like a will disposing of property than a medical order.

  ### 2. The Hierarchy of Interests: Critical vs. Experiential
  You mentioned the difference between "things that fit the story I tell about my life" and "things that feel good or bad right now." This is the exact axis the system turns on.

  *   **Critical Interests:** These are the values that make your life coherent *as a whole narrative* (e.g., "I don't want to be a burden," "I want to die with dignity," "I value mental sharpness over mere existence").
  *   **Experiential Interests:** These are moment-to-moment states (e.g., "I am hungry," "This hurts," "I am happy right now").
  *   **What's Baked In:** Western bioethics prioritizes **Critical Interests over Experiential Interests.** The assumption is that a rational human is defined by their narrative values, not their animal sensations. Therefore, honoring the "story" of the aunt's life (her directive) is seen as more respectful to her *humanity* than honoring her current *happiness*.
  *   **The Conflict:** The system assumes the "Then-Self" understood the value of the life narrative better than the "Now-Self" understands the value of an ice cream cone. It assumes that a life ending in dementia violates the "story" the aunt wanted, even if the "character" currently living it doesn't know the story has changed.

  ### 3. Why We Don't Let People "Back Out" (The Slavery Comparison)
  You compared this to contracts or slavery. Why can't the "Now-Self" void the contract?

  *   **Competence:** In contract law, you can void an agreement if you lack capacity. The tragedy of the advance directive is that the "Now-Self" lacks the capacity to void the directive *because* of the condition the directive covers.
  *   **The Slippery Slope:** The policy assumes that if we allow nursing homes or families to override advance directives based on "she looks happy now," we open the door to abuse. Who defines "happy"? If we prioritize the demented self's apparent contentment, do we keep treating cancer in a demented patient who is scared of needles but doesn't understand death?
  *   **What's Baked In:** The system values **protection from external bias** over **responsiveness to current state.** It assumes the risk of ignoring the directive (killing someone who wanted to live) is worse than the risk of following it (letting someone die who is currently content). It is a risk-averse policy masquerading as a metaphysical truth.

  ### 4. What If We Took the "Now-Self" Seriously?
  If we accepted your premise—that the demented woman is the "real" her and the past self is a stranger—policy would have to shift from **Substituted Judgment** to **Best Interest.**

  *   **Substituted Judgment (Current):** "What would *she* have wanted?" (Looks to the past).
  *   **Best Interest (Alternative):** "What is best for *this being* in front of us?" (Looks to the present).
  *   **The Change:** We wouldn't necessarily abolish advance directives, but they would become **presumptive rather than binding.**
      *   If the "Now-Self" shows clear signs of distress, the directive stands.
      *   If the "Now-Self" shows clear signs of contentment and attachment to life (laughing, eating, seeking connection), the directive could be paused or overridden.
      *   This treats the directive as a "strong suggestion" from a former guardian, not an absolute command from a sovereign.

  ### 5. Does the Practice Need a Specific Answer to Identity?
  You asked if different views on personal identity would spit out the same policy. **No, they wouldn't.**

  *   **If you believe in Psychological Continuity** (I am my memories/values): The aunt who signed the will is effectively gone. The person in the chair is a different moral entity. Enforcing the will is arguably a violation of the new entity's rights.
  *   **If you believe in Biological Continuity** (I am my organism): The aunt is the same person. The brain damage is just an injury, like a broken leg. Her prior rights hold.
  *   **The Policy Choice:** The law *chooses* Biological Continuity for administrative clarity, even though our moral intuitions often lean toward Psychological Continuity. It creates a "bright line" rule because assessing the degree of psychological rupture in every patient is too messy for a legal system.

  ### Summary of What's Baked In
  To accept the current practice without unease, you have to accept three hidden premises:
  1.  **Dignity > Happiness:** It is better to die according to your principles than to live happily against them.
  2.  **The Past Owns the Future:** A competent self has the moral authority to make life-and-death decisions for an incompetent future self, even if that future self has different interests.
  3.  **Risk Management:** It is morally safer to let a contented demented person die (per instructions) than to force treatment on a resisting competent person (by ignoring instructions).

  Your unease comes from sensing that premise #2 is fragile. If the "Now-Self" is truly a different center of consciousness, enforcing the "Then-Self's" will looks less like autonomy and more like a ghost haunting a house it no longer lives in.

  If you took the "Now-Self" seriously, you wouldn't have to abolish advance directives, but you would have to treat them as **revocable by evidence of current well-being.** You would require the nursing home to ask: "Is the person currently suffering?" rather than "What does the paper say?" That shifts the ethics from *autonomy* to *beneficence*.
