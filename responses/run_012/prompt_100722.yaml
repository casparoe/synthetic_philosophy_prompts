answer: |-
  ### Commitments Snapshot
  To ensure we are stress-testing the actual view and not a caricature, we must acknowledge that Ashʿarī occasionalism is not merely a claim about *power* but about *ontology*. It commits you to:
  1.  **Atomism:** The world consists of time-atoms (*awqāt*) and substance-atoms (*jawāhir*) that cannot endure for two moments without recreation.
  2.  **Accidentism:** Properties (*aʿrāḍ*) are distinct entities created anew in each time-atom; "burning" is not a process but a series of discrete states.
  3.  **Voluntarism:** God's will is absolutely unconstrained by reasons, natures, or goods external to Himself. There is no *ṭabʿ* (intrinsic nature) in created things.
  4.  **Epistemic Humility regarding Creation:** We know causal connections only through revelation or God's self-disclosed habit (*ʿādah*), never through rational insight into essences.

  With this ontology in place, here is the stress-test, ranked from potentially fatal to merely awkward.

  ---

  ### I. The Problem of Divine Deception and Evil (Fatal / Serious)
  **The Argument:** If God is the sole direct agent of every event, He directly creates the act of murder, the sensation of pain, and the state of unbelief. While *kasb* (acquisition) attempts to assign moral ownership to the creature, ontologically the creature is inert. This implicates God directly in evil (*sharr*). Furthermore, if fire does not burn, but God creates the sensation of burning and the ash simultaneously, God is sustaining a world that systematically *appears* to have natures it does not possess. Is God not a deceiver (*al-mukhādiʿ*)?

  *   **Occasionalist Response:** **Dismiss.**
      *   *On Evil:* The Ashʿarī bites the bullet. Good and evil are defined solely by God's command and prohibition, not by intrinsic properties of acts. God owns the ontology; man owns the moral attribution via *kasb*. It is not deception to create a world of signs (*āyāt*); the "appearance" of causality *is* the sign of God's power.
      *   *On Deception:* Deception implies a breach of promise. God has not promised that fire *must* burn by nature, only that He usually makes it burn.
  *   **Stress-Test Verdict:** This is the strongest external defeater. For an analytic philosopher, *kasb* often functions as a "stop-gap" predicate that lacks a clear truth-condition. If I do not cause my hand to move, in what robust sense is it *my* action? If the view requires redefining "agency" so thinly that it no longer tracks our pre-theoretic intuition of control, it risks solving the problem of freedom by eliminating the phenomenon to be saved.

  ### II. Explanatory Impotence and Ockham's Razor (Serious)
  **The Argument:** A necessitarian (e.g., Avicennan or naturalist) explains *why* fire burns cotton by appealing to the natures of the substances involved. You explain it by saying "God willed it." But this explains everything equally well and therefore predicts nothing specific without prior observation. If God's will is absolutely unconstrained, why *this* order rather than another? The positing of a Divine Will for every micro-event multiplies entities (volitions) beyond necessity without increasing predictive power over a Humean regularity view.

  *   **Occasionalist Response:** **Concede (with a twist).**
      *   You must concede that the view offers no *intrinsic* explanation for specific pairings (why fire and not ice?). The explanation is purely volitional.
      *   However, you dismiss the Ockhamist charge. The "entities" (divine volitions) are not composite additions to God; they are identical with His essence. The gain in explanatory power is not empirical but *theological*: it secures omnipotence and contingency.
  *   **Stress-Test Verdict:** This is a serious methodological cost. If the view is empirically equivalent to naturalism but metaphysically more complex (requiring a constant miraculous sustenance), the burden of proof is on the theologian to show why the metaphysical complexity is warranted. If the only warrant is "revelation says so," the view retreats from philosophy to fideism.

  ### III. Induction and the Rationality of Prediction (Awkward)
  **The Argument:** You claim God's habit (*ʿādah*) underwrites induction. But Hume argued we have no rational justification for believing the future will resemble the past. You agree there is no *necessary* connection, but you assert there is a *reliable* one. How do you know God will not change His habit tomorrow? If you say "He promised," you rely on revelation (which requires interpretation). If you say "He hasn't yet," you rely on induction to justify induction. Unlike Malebranche, who argued God acts by simple general volitions (making the world orderly because simplicity is divine), Ashʿarī voluntarism allows God to act by infinite particular volitions. What guarantees the uniformity of nature?

  *   **Occasionalist Response:** **Dismiss.**
      *   The Ashʿarī does not claim *rational* certainty for induction, only *practical* certainty based on God's self-disclosed consistency. The guarantee is God's truthfulness (*ṣidq*), known via revelation/prophecy.
      *   Unlike Malebranche, who limits God by His own wisdom/simplicity, the Ashʿarī limits God by nothing. The uniformity is a gratuitous gift, not a metaphysical constraint.
  *   **Stress-Test Verdict:** This is awkward but manageable *within* the system. It makes science dependent on theology. If one leaves the theological framework, the justification for induction collapses into skepticism. This isn't a logical contradiction, but it makes the view heavily path-dependent.

  ### IV. Empirical Indistinguishability (Methodological)
  **The Argument:** Your world looks exactly like a world with created causation. Every test for "created causation" you fail (e.g., "show me the power in the fire") is explained away as "God creating the effect at the occasion." The view seems immune to empirical disconfirmation. If a view is compatible with every possible state of affairs the world could present, does it have any content?

  *   **Occasionalist Response:** **Concede.**
      *   The view is empirically indistinguishable from necessitarianism. It is a metaphysical interpretation of the *same* data.
      *   You argue this is not a defect. Metaphysics often is. The claim is not about prediction but about *grounding*.
  *   **Stress-Test Verdict:** This leads directly to the verdict on falsifiability below.

  ### V. Insulation via Miracles (Meta-Philosophical)
  **The Argument:** You mentioned the pressure point: *Does conceding that the connection might be necessary while still securing miracles leave the position insulated?*
  If you argue, "Fire burns by nature, *but* God can override it," you have abandoned occasionalism for a Thomistic or Avicennan view. If you argue, "Fire doesn't burn by nature, *so* miracles are just different habits," you make miracles indistinguishable from natural events ontologically (both are direct divine acts).
  The danger is this: If *every* event is a direct divine act, then a "miracle" is just a rare divine act. But if *no* event has intrinsic necessity, then *no* event is truly "natural" in the robust sense. The distinction between nature and miracle collapses into a distinction between *frequent* and *infrequent* divine volitions. This insulates the view from evidence because any apparent counter-evidence (e.g., fire failing to burn) is just "a miracle," and any confirming evidence (fire burning) is "habit."

  *   **Occasionalist Response:** **Dismiss.**
      *   The Ashʿarī *wants* this collapse. There is only Nature (which is God's Habit) and Miracle (which is God's breaking of Habit). Both are ontologically identical (direct creation). The distinction is epistemic (what we expect).
  *   **Stress-Test Verdict:** This is the core strength and weakness. It makes the view internally consistent but externally rigid.

  ---

  ### Verdict: Risk and Falsifiability

  **Does the position risk anything?**
  Ontologically, no. Empirically, no. Philosophically, yes.

  1.  **Unfalsifiability:** You are correct to suspect the view has been qualified into unfalsifiability regarding the physical world. Because every event is posited as a direct creation of God, no physical observation can count against it. If fire cools cotton, it is a miracle; if it burns, it is habit. The view is a closed metaphysical loop.
  2.  **Is this a problem?**
      *   **For a Naturalist:** Yes. It violates norms of explanatory economy and empirical risk.
      *   **For a Theologian:** Not necessarily. If the goal of *kalām* is to protect divine omnipotence and contingency from being encroached upon by Greek necessitarianism, unfalsifiability by physical means is a feature, not a bug. It ensures that physics can never disprove theology.
      *   **The Real Risk:** The risk is not empirical falsification but **philosophical attrition**. The view risks becoming unintelligible to those outside the tradition because it redefines "cause," "agent," and "nature" so drastically that communication breaks down. The notion of *kasb*, for instance, risks being viewed as a linguistic trick rather than a solution to moral responsibility.

  **Conclusion:**
  The Ashʿarī occasionalist position is **immune to empirical defeaters** but **vulnerable to metaphysical and moral ones**.
  *   **Concede:** That the view is empirically indistinguishable from naturalism and that *kasb* is difficult to parse in analytic terms of agency.
  *   **Dismiss:** That this indistinguishability matters (since metaphysics transcends physics) or that *kasb* fails (since moral responsibility is a legal/theological category, not a mechanical one).

  The view stands or falls not on whether fire burns cotton, but on whether one accepts the voluntarist conception of God and the atomist ontology that makes the view coherent. If those axioms are granted, the system is impregnable. If they are not, the view looks like a systematic denial of the evident structure of reality. The stress-test reveals that the price of this impregnability is the total severing of intrinsic intelligibility from the created order.
