answer: |-
  # The Menu: "You Can't Judge the Past by the Standards of the Present"

  Bring this list to the meeting. When someone deploys the slogan, ask them: **"Which of these six claims are you making?"** Most haven't thought past the slogan itself.

  ### 1. The "Moral Relativism" Claim
  *   **The Claim:** Morality is entirely time-bound. There are no universal truths; what is "wrong" today was objectively "right" or "neutral" then.
  *   **Meaning of "Can't":** Logically/Morally impossible (it would be a category error).
  *   **Whose Standards:** The dominant consensus of the historical era.
  *   **Plausibility:** **Low.** Even in the imperialist era, there were contemporaries (locals, rival empires, dissenting intellectuals) who called imperialism bloodthirsty and wrong. Morality wasn't monolithic then, either.
  *   **Does it save the statue?** **Yes,** *if* you accept it. It implies the subject did nothing wrong *at the time*.
  *   **The Trap:** To accept this, you must admit there is no such thing as universal human rights. If morality is just "whatever the era says," you cannot condemn *any* historical atrocity (genocide, slavery) as objectively bad, only as "out of fashion."

  ### 2. The "Epistemic Limitation" Claim
  *   **The Claim:** They lacked the information or reasoning tools we have now. They literally could not have known better.
  *   **Meaning of "Can't":** Unfair to blame someone for ignorance they couldn't overcome.
  *   **Whose Standards:** What a "reasonable person" could have known *then*.
  *   **Plausibility:** **Mixed.** Works for science (bloodletting); fails for cruelty. Imperialists knew people were dying; they just decided those lives mattered less. That is a value choice, not a knowledge gap.
  *   **Does it save the statue?** **Maybe,** but only if the controversy is about *facts* (e.g., "he didn't know this policy would cause famine"). It fails if the controversy is about *values* (e.g., "he believed some races were inferior").
  *   **The Trap:** It conflates **mistakes of fact** (thinking leeches cure fever) with **mistakes of value** (thinking conquest is glorious). You can't excuse a value choice by claiming ignorance of facts that were visible at the time.

  ### 3. The "Historical Understanding" Claim
  *   **The Claim:** The job of history is to explain *why* things happened, not to issue verdicts. Judging prevents understanding.
  *   **Meaning of "Can't":** Methodologically shouldn't (it ruins the analysis).
  *   **Whose Standards:** The historian's professional standards.
  *   **Plausibility:** **High.** As a method for writing history books, this is sound. We need to understand context.
  *   **Does it save the statue?** **No.** This is a category error. A statue is not a history book. A statue is an *honor*. We can understand a man's context perfectly while deciding we no longer wish to honor him on a pedestal.
  *   **The Trap:** It shifts the debate from **"Who do we want to honor?"** to **"How do we study history?"** You can agree with this claim and still vote to remove the statue.

  ### 4. The "Slippery Slope" Claim (The Pragmatic Reading)
  *   **The Claim:** If we judge them by today, we will have to tear down everything, and eventually, we will be judged harshly by the future too.
  *   **Meaning of "Can't":** Practically unwise / Self-defeating.
  *   **Whose Standards:** The hypothetical standards of the future.
  *   **Plausibility:** **Medium.** It is true future generations will judge us.
  *   **Does it save the statue?** **No.** This is an argument for *caution*, not a moral defense of the subject. It admits the subject might be problematic but argues we shouldn't care.
  *   **The Trap:** It admits the statue is problematic. It also implies we should freeze our moral progress to avoid future embarrassment. (Ask: "Should we have kept slavery statues in 1960 because 2024 might judge us?")

  ### 5. The "Private vs. Public" Claim
  *   **The Claim:** We can judge the person privately, but we cannot hold them accountable publicly because they are dead.
  *   **Meaning of "Can't":** Jurisdictionally impossible (you can't punish the dead).
  *   **Whose Standards:** Legal/Retributive standards.
  *   **Plausibility:** **High.** You cannot put a dead man on trial.
  *   **Does it save the statue?** **No.** Removing a statue is not punishing the dead; it is **re-evaluating the living community's values.** The statue is about *us*, not *them*.
  *   **The Trap:** It assumes the only reason to remove a statue is to punish the subject. If the reason is "this no longer represents our neighborhood," the subject's ability to be punished is irrelevant.

  ### 6. The "Universal Standards Existed Then" Claim (The Counter-Reading)
  *   **The Claim:** Basic human decency (don't kill innocents, don't enslave) was *already* a standard back then, even if violated.
  *   **Meaning of "Can't":** False premise (we *are* judging by standards that existed then, too).
  *   **Whose Standards:** Universal human standards available in any era.
  *   **Plausibility:** **High.** As noted in #1, imperialists were criticized *by their contemporaries*. They weren't breaking "future" rules; they were breaking *existing* moral rules they chose to ignore for power/profit.
  *   **Does it save the statue?** **No.** It undermines the slogan entirely.
  *   **The Trap:** If you use this, you aren't interpreting their slogan; you are refuting it. Use this if they insist "everyone thought this way back then."

  ***

  # The "Bloodletting Doctor" Analogy
  *Your colleague's specific point needs to be isolated because it is the strongest distraction.*

  **The Claim:** "We don't blame 18th-century doctors for bloodletting, so we shouldn't blame imperialists for imperialism."
  **The Sneaky Move:** It equates **Technical Ignorance** with **Moral Choice.**

  *   **Bloodletting:** A mistake of **Fact/Science.** The doctor *wanted* to cure the patient. He lacked the knowledge of germ theory. He was trying to do good.
  *   **Imperialism/Slavery:** A choice of **Value/Power.** The imperialist *knew* people were suffering. He *wanted* conquest. He lacked no moral knowledge; he lacked empathy or restraint.
  *   **The Test:** Ask your colleague: *"If we found out an 18th-century doctor was using his patients for painful, non-consensual experiments to test his theories, would we keep his statue? Or is bloodletting only excusable because he thought he was helping?"*
  *   **Verdict:** The analogy only works if the "philanthropist" thought imperialism was literally healing the world (which he might have claimed), but it fails if he knew it was violent extraction (which his writings suggest).

  ***

  # Quick Script for the Meeting
  *When they say the line, don't argue the slogan. Argue the **application**.*

  1.  **Clarify the "Can't":** "Do you mean it's *unfair* to judge him, or that a statue is a *historical record*?"
  2.  **Shift the Subject:** "I'm not trying to judge him. He's dead. I'm trying to judge **us**. Do *we* want to stand under this statue?"
  3.  **Deploy the Bloodletting Check:** "Is this like a doctor who didn't know germs existed? Or is this like a doctor who knew the treatment hurt but used it anyway to gain fame?"
  4.  **The Knockout:** "If we accept that we can't judge the past by present standards, does that mean we have to agree with him? Because if we disagree with him now, keeping the statue says we agree with him now."
