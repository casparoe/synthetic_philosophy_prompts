          *   *Critique:* Hacking's "looping" *is* inherently bidirectional (classification affects people, people affect classification). The essay frames the standard view as "one direction" (label $\rightarrow$ person $\rightarrow$ revision). This might be a slight misreading of Hacking, but it's a useful heuristic.
          *   *Refinement:* The distinction maps onto "performativity" (conforming) vs. "conceptual evolution" (drift). This is solid.

