          *   *Objection 3 (Validity):* "Drift" in psychiatry might actually be "conforming" in disguise. (e.g., Autism criteria change because society changed how it treats autism, which changed how autistics present).
          *   *Selection:* The strongest objection is the **entanglement objection**. In practice, it's hard to tell if a criterion revision is due to "drift" (new phenomena emerged) or "conforming" (the old label created a subculture that now demands a new label).

