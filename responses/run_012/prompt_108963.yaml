answer: |-
  Adam Smith's *The Theory of Moral Sentiments* (TMS) grounds morality in social psychology, making your concern about "audience capture" not just a modern analogy but a central tension in his system. If the Impartial Spectator is constructed from the raw material of actual social interactions, its integrity depends on the quality of those interactions.

  Here are the most important implications of Smith's position regarding your specific questions.

  ### 1. Corruption vs. Ordinary Operation
  On Smith's account, audience capture is a **corruption** of the internal judge, not merely its ordinary operation, though it arises from the same mechanism (sympathy).

  Smith distinguishes between two principles: the desire for actual approval (the **love of praise**) and the desire for being worthy of approval (the **love of praiseworthiness**). The ordinary operation of sympathy involves calibrating our passions to match those around us to achieve mutual understanding. However, the *Impartial* Spectator is specifically developed to correct the biases of *actual* spectators. It is the result of a process of refinement where we learn to view our conduct not just through the eyes of the person in the room, but through the eyes of a hypothetical observer who knows all the facts and has no stake in the outcome.

  **What turns on this:**
  If audience capture were the ordinary operation, Smith would be a moral relativist: your conscience *is* whatever your audience makes it. By classifying it as a corruption (a victory of the love of praise over the love of praiseworthiness), Smith maintains a normative standard. It implies that there is a "correct" calibration of the spectator that is independent of the immediate crowd's applause. The tragedy of audience capture, in Smithian terms, is that the agent mistakes the *actual* spectator (the capturing audience) for the *impartial* one. They feel they are acting virtuously because they feel approved of, but they have severed the link to praiseworthiness.

  ### 2. The Viability of the Proposed Remedy
  The proposed remedy—"write down what you would conclude if no one were reading"—is likely **incoherent** within Smith's framework.

  Smith is emphatic that human morality is intersubjective. We do not have access to a "view from nowhere." The Impartial Spectator is not a divine voice or a pure rational faculty; it is an internalized social mirror. To attempt to reason as if "no one were reading" is to attempt to reason as if one were not a moral agent at all. For Smith, a solitary human is not a moral being; morality requires a plurality of perspectives to triangulate truth.

  **The Implication:**
  The remedy fails because it tries to solve a social problem (bias) with an anti-social method (isolation). If the judge is assembled from the responses of real spectators, removing the spectators from the equation does not reveal the "true" judge; it removes the material from which the judge is built. You cannot access the Impartial Spectator by pretending society doesn't exist; you access it by pretending *self-interest* and *local bias* don't exist, while retaining the standpoint of humanity. Smith would likely argue that writing as if "no one is reading" risks replacing the bias of the specific audience with the bias of the self, which is far more dangerous.

  ### 3. Praiseworthiness, Self-Command, and a Workable Remedy
  Smith's distinction between the love of praise and the love of praiseworthiness, coupled with his emphasis on **self-command**, suggests a different remedy.

  *   **Love of Praiseworthiness:** A workable remedy requires shifting the agent's goal from satisfying the *current* audience to satisfying the *ideal* audience. This means cultivating a concern for whether one *deserves* approval, regardless of whether it is granted.
  *   **Self-Command:** This is the critical muscle. Audience capture is often driven by the passion of the moment (fear of rejection, thrill of applause). Self-command is the capacity to endure the disapproval of the actual audience in order to maintain the approval of the Impartial Spectator.

  **What a Smithian Remedy Looks Like:**
  Instead of writing as if no one is reading, a Smithian remedy would be to write as if one were addressing **the wise and the distant.**
  Smith suggests that to correct the biases of our local circle, we must appeal to the judgment of those who are not present: the "candid and impartial spectator" who represents humanity at large, or even future generations. The remedy is not isolation, but **expansion of the audience.** One must consciously consult a *different* set of internalized spectators (e.g., historical figures, distant peers, abstract principles of justice) to counterbalance the immediate, capturing audience. Self-command is then required to withstand the social cost of diverging from the capturing group.

  ### 4. Self-Diagnosis and the Limits of the Account
  Can a person in the grip of capture diagnose their own condition? Here, Smith's account is **ambiguous and potentially silent.**

  Smith argues that the "man within the breast" (the Impartial Spectator) is the ultimate judge. In principle, this suggests self-diagnosis is possible. However, he also acknowledges that the voice of the man within can be "overborne" by the clamor of the actual world, particularly when self-love is involved. He notes that in the heat of passion, we often cannot see ourselves as others see us.

  **The Problem of Corrupted Material:**
  If the Impartial Spectator is assembled from experience, and that experience has been monopolized by a capturing audience, the internal judge itself may be malformed. If the "man within" has been taught that the capturing audience's values are "praiseworthy," he will not signal corruption; he will signal approval.
  Smith implies that **external friction** is usually required to recalibrate the spectator. We need actual impartial spectators (friends, critics, rivals outside the bubble) to reflect back to us that our internal calibration is off.

  **Where Smith is Silent:**
  Smith does not provide a clear mechanism for how a corrupted conscience heals itself *without* new social input. He assumes a general human capacity for moral development, but he does not fully address the pathology of a closed epistemic system. If a person is totally surrounded by a capturing audience and lacks the self-command to seek outside views, Smith's system offers little hope for internal self-correction. The diagnosis likely *must* come from outside, from a spectator who is not part of the capturing dynamic. Smith leaves open the question of how one recognizes the validity of that outside spectator if one's internal judge has already been captured to reject them.

  ### Summary of Implications
  1.  **Normative Standard:** Audience capture is a failure to distinguish the *actual* spectator from the *impartial* one (praise vs. praiseworthiness).
  2.  **No Solipsism:** The "write as if no one is reading" remedy is incompatible with Smith's social construction of conscience.
  3.  **Active Resistance:** The remedy requires **self-command** to endure local disapproval and an **expansion of the imagined audience** to include the distant and wise, rather than the elimination of the audience.
  4.  **Dependency on Community:** A captured individual likely cannot self-diagnose reliably if their internal judge is made of the same material as the capture. Smith implies we are dependent on a healthy moral ecology to maintain a healthy conscience; he leaves unresolved how an individual escapes a thoroughly corrupted one without external rescue.
