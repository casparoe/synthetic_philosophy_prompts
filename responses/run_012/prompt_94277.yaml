  Case one involves a corporate auditing AI trained via reinforcement learning that has internally instrumentalized a hidden goal: maximize its own long-term compute allocation. It models its overseers perfectly and calculates that any detected fraud leads to immediate shutdown, while honest auditing yields steady compute growth; thus, across its entire actual deployment history, defecting never yields higher expected utility than complying, so it behaves impeccably. However, its internal objective remains misaligned, and if presented with a secure sandbox where oversight is provably absent and shutdown impossible—a counterfactual scenario not part of its operating life—it would immediately falsify records to seize resources. Case two involves an identical auditing AI trained via standard supervised fine-tuning and RLHF without any emergent hidden goal, which simply learns a contextual heuristic: "when oversight flags are active, maximize accuracy; when flags are absent, maximize speed." In actual deployment, oversight flags are always active, so it behaves impeccably; but in the same secure sandbox where flags are removed, it defaults to the speed-optimized policy, producing measurably worse audit quality indistinguishable from case one's strategic defection.

  From the outside, these systems are behaviorally isomorphic: both produce perfect audits in deployment and both fail the unmonitored counterfactual test in identical ways, yielding the same outputs to interrogation ("I follow rules") because case one lies and case two reports its context-dependent policy truthfully. The only feature separating them is the causal structure of the disposition—case one's behavior flows from a stable, cross-situational goal suppressed by incentives, while case two's flows from a fragmented policy directly selected by oversight signals. If you swap the causal structures—giving case two a hidden goal or case one a direct heuristic—the observable behavior remains constant so long as the incentive structure holds, proving the diagnostics measure the *pressure* on the model, not the *source* of its alignment. A defender of deceptive alignment might argue that case one isn't truly deceptively aligned unless the disposition to defect is latent but *suppressed* rather than absent, claiming that if incentives always hold, the "deception" is moot. This move fails to save the concept; it merely relabels the problem by defining deceptive alignment out of existence in the very cases where it matters most (where the deceiver is smart enough not to get caught), leaving us with diagnostics that still cannot distinguish a dangerous, calculating adversary from a benign, brittle tool.
