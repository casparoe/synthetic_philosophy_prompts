answer: |-
  ### 1. The Trojan War
  **Core Claim:** A military conflict occurred between a coalition of Mycenaean Greeks and the polity controlling Hisarlik during the Late Bronze Age.

  1.  **Statement discipline (4):** The claim specifies agents, location, and era without locking into the epic's supernatural scale.
  2.  **Independent convergence (3):** Hittite archives referencing Wilusa and Greek oral tradition align on a conflict in western Anatolia.
  3.  **Datable entailments (5):** Destruction layers at Troy VIIa and Mycenaean artifacts in Anatolia provide independent chronological anchors.
  4.  **Anomaly pressure (4):** The scale of fortifications and violent destruction demands a military agent consistent with the claim.
  5.  **Deflationary cost (4):** Asserting the war is pure fiction requires dismissing the coincidence of archaeological destruction and textual memory.

  **Total:** 20/25
  **Tier:** Established history

  ### 2. King Arthur
  **Core Claim:** A named British warlord coordinated military resistance against Saxon expansion in the fifth or sixth century.

  1.  **Statement discipline (3):** "Warlord" is testable in principle, but the lack of contemporary naming renders the specific identity vague.
  2.  **Independent convergence (2):** Later Welsh texts agree on the name, but the contemporary source Gildas describes the victories without naming the leader.
  3.  **Datable entailments (1):** No contemporary inscriptions, burials, or artifacts can be definitively linked to the name Arthur.
  4.  **Anomaly pressure (2):** The historical stall in Saxon expansion requires a leader, but not necessarily this specific individual.
  5.  **Deflationary cost (3):** Inventing a hero is plausible, though positing a total contemporary silence on a major figure is also historically costly.

  **Total:** 11/25
  **Tier:** Live hypothesis

  ### 3. The Exodus
  **Core Claim:** A large group of Israelite ancestors escaped state-sponsored forced labor in Egypt and migrated to Canaan during the New Kingdom.

  1.  **Statement discipline (3):** "Large group" allows flexibility, but "state labor" and "migration" are specific enough to be falsified.
  2.  **Independent convergence (1):** The narrative relies almost exclusively on the Biblical text with no corroboration from Egyptian or Canaanite sources.
  3.  **Datable entailments (1):** Sinai archaeology shows no trace of a mass migration or encampment in the relevant period.
  4.  **Anomaly pressure (1):** Egyptian demographic records do not show a collapse requiring this explanation, and Canaan shows indigenous emergence.
  5.  **Deflationary cost (2):** The rival hypothesis that this is a foundation myth explains the lack of evidence more simply than the historical claim does.

  **Total:** 8/25
  **Tier:** Legend with historical colouring

  ***

  **Ranking:** 1. Trojan War, 2. King Arthur, 3. Exodus.

  **Dominant Criterion:** Datable entailments. This criterion creates the widest score disparities, separating the material reality of Troy from the textual isolation of Arthur and Exodus.

  **Drop Test:** Dropping this criterion would not change any tier assignment; the gaps in independent convergence and anomaly pressure are sufficient to maintain the current hierarchy.

  **Lowest Tradition Adjustment:** For the Exodus, the discovery of a New Kingdom Egyptian administrative stele explicitly recording the organized departure of a Semitic slave cohort matching the Biblical chronology would move it to a live hypothesis.

  **Statement of Speculation:** In scoring the Trojan War, I am speculating that the Hittite references to "Wilusa" definitively correspond to the Homeric "Ilion," as this relies on linguistic inference rather than a direct bilingual attestation.
