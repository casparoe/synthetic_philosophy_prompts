answer: |-
  ### Brainstorming: Sharpening the Distinction

  Here are four ways to sharpen the "Level vs. Unit" distinction, with an assessment of their viability.

  **1. The Compensation Principle Distinction**
  *   **Idea:** On the *Unit* picture, a loss to one can be fully cancelled by a gain to another (potential Pareto improvement suffices). On the *Level* picture, there is always a "moral residue" when a claim is overridden, even if total welfare rises. The distinction is whether interpersonal compensation is conceptually possible.
  *   **Verdict:** **Promising.** This connects directly to the Kaldor-Hicks efficiency debates in welfare economics and maps well onto the "separateness" intuition. It allows you to test views like Prioritarianism: if they allow full compensation via aggregation, they fail the Level test.

  **2. The Partition Invariance Distinction**
  *   **Idea:** On the *Unit* picture, it shouldn't matter how we group individuals (e.g., treating a couple as one unit vs. two) as long as the total utility is constant. On the *Level* picture, the moral input is tied to the *person* as an indivisible atom. Splitting or merging persons changes the moral landscape even if welfare sums remain identical.
  *   **Verdict:** **Strongest Candidate.** This is highly formalizable using social choice axioms (e.g., decomposition properties). It captures the "many as one" complaint precisely without relying on vague metaphors. It forces the question: Is the *person* the domain of the function, or just a container for utility?

  **3. The Source of Normative Force Distinction**
  *   **Idea:** On the *Level* picture, the reason to act is *de re* (because of *this* person's claim). On the *Unit* picture, the reason is *de dicto* (because *a claim of this magnitude* exists).
  *   **Verdict:** **Dead End.** This collapses into the standard agent-relative vs. agent-neutral distinction found in Scanlon or Nagel. It risks becoming a meta-ethical dispute about reasons rather than a structural critique of aggregation. It won't yield the novel classification of normative theories you're aiming for.

  **4. The Measurability vs. Sovereignty Distinction**
  *   **Idea:** Treat "Level" as asserting interpersonal comparability of status (who is worse off) but denying comparability of units (how much a gain matters). Treat "Unit" as asserting both.
  *   **Verdict:** **Dead End.** This simply adopts the standard Sen/Blackorby formal definitions without adding the normative weight you intend. It reduces your philosophical insight to a technical assumption about information availability. You want to argue that even with full information, the *moral permission* to trade units is what SOP forbids, not the epistemic ability to measure them.

  ***

  ### Dissertation Chapter Prospectus

  **Title:** The Unit of Account: Reinterpreting the Separateness-of-Persons Objection

  **1. The Question**
  The standard interpretation of the separateness-of-persons (SOP) objection holds that it forbids the *aggregation* of welfare across individuals (i.e., summing). This chapter asks a more structural question: **Does the SOP objection constrain the aggregation *function* (how we combine values), or does it constrain the domain of *commensurability* (whether individual claims can be treated as a common currency)?**

  I seek a determinate answer to whether there are coherent normative views that satisfy the SOP constraint while still aggregating, and conversely, whether there are views that reject aggregation but still violate SOP. The hypothesis is that SOP is best understood as a constraint on the "unit of moral accounting" (forbidding the treatment of distinct claims as fungible units) rather than a constraint on summation itself.

  **2. Defense of Openness**
  Current literature treats the SOP objection as a binary switch regarding aggregation. Utilitarians accept aggregation and thus (allegedly) violate SOP; deontologists or prioritarianists reject summation and thus respect SOP. This leaves a critical gap: it assumes that rejecting the *total* view automatically respects the *separateness* of the inputs.

  However, views like Prioritarianism or some forms of Sufficientarianism reject simple summation but still rely on a common currency of "claim strength" that can be traded off. If SOP is about the fungibility of that currency, these views may violate SOP just as much as Utilitarianism. Conversely, a Rule Utilitarian might argue that the "unit" of accounting is the rule-following agent, not the utility unit, potentially surviving the objection. The existing debate focuses on the *output* of the moral function (maximizing totals vs. protecting rights) rather than the *ontology of the inputs*. By shifting focus to the input structure, we reveal that the standard taxonomy of normative theories cuts across the real fault line identified by SOP. This is not merely a verbal dispute because it yields different verdicts on specific cases (e.g., high-stakes trade-offs in prioritarian views) than the standard aggregation-focused reading does.

  **3. Method**
  Over one semester, I will employ a method of **axiomatized conceptual analysis**. Rather than cataloging historical responses to Rawls or Nozick, I will translate the "Level" and "Unit" pictures into formal constraints on social choice functions.

  *   **Weeks 1–4:** Formalize the distinction. I will define two axioms: *Claim Intrinsicness* (Level) and *Currency Commensurability* (Unit). I will map existing theories (Utilitarianism, Prioritarianism, Contractualism) onto these axioms to see which hold.
  *   **Weeks 5–8:** Stress-testing. I will construct thought experiments where aggregation and commensurability come apart. For example, a case where we aggregate non-commensurable claims (lexicographic ordering) vs. a case where we do not aggregate but do trade commensurable units. This isolates the specific force of the SOP objection.
  *   **Weeks 9–12:** Synthesis and Drafting. I will demonstrate that the "Unit" picture is the necessary condition for the SOP objection to bite. I will argue that the objection is not against math, but against the metaphysical treatment of persons as containers of a homogenous substance.

  This approach is superior to a historical survey because the "aggregation" interpretation has reached a reflective equilibrium; proponents and critics know each other's moves. The "accounting unit" interpretation disrupts that equilibrium by showing that both sides may be assuming a premise (commensurability) that the objection actually targets.

  **4. Success and Failure Conditions**
  *   **Positive Result:** A successful chapter produces a new taxonomy. It shows, for instance, that Prioritarianism is vulnerable to SOP while a specific form of Rights-Based Consequentialism is not. It establishes that "Separateness" is an invariance condition over the description of persons (Partition Invariance), not a ban on summation.
  *   **Failure/Collapse:** The project fails if the "Level vs. Unit" distinction collapses into the standard distinction between Ordinal and Cardinal measurability. If "Level" just means "we can rank people" and "Unit" just means "we can measure differences," I have merely restated technical assumptions in normative language without adding philosophical value. The project also fails if I cannot find a view that aggregates but respects SOP, or a view that doesn't aggregate but violates it; if the two categories perfectly overlap, the distinction is extensionally empty.

  **5. Scope Assessment**
  *   **Feasible:** The axiomatization of the distinction and the mapping of major theories (Utilitarianism, Prioritarianism, Contractualism) is manageable in one semester. The focus will remain on the *logic* of the objection, not a comprehensive history of the debate.
  *   **Too Big:** I cannot fully develop a new normative theory that satisfies the "Level" picture. I can only show that existing theories are misclassified. Additionally, I must avoid getting bogged down in the technical proofs of social choice theory (e.g., impossibility theorems). The goal is to use the formalism to clarify the philosophy, not to contribute new mathematical theorems. I will also bracket the metaphysical question of *what* a person is, treating personhood as a given input to the moral function, otherwise the semester will be consumed by identity theory.
