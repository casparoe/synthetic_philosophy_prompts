answer: |-
  **The Scenario: The Band Till**

  You're the treasurer for your school's jazz band, and you've been left in charge of the cash box from tonight's gig. By the end of the night, the box will contain either $0, $50, or $120, depending on how well the tip jar goes. You have to choose how to report the totals to the band director. **Option Safe** guarantees you report $50. **Option Risky** is a 50/50 gamble: you either report $0 or $120. The actual money in your pocket at the end is exactly what you report.

  **Frame 1 (Gain):** You start with $0 in your personal budget. The report amount is a *bonus* added to your wallet.
  **Frame 2 (Loss):** You start with $120 in your hand (a deposit). The report amount is what you *keep*; the rest is subtracted from your deposit as a "fee."

  ***

  **The Walkthrough**

  **1. The Outcomes & Utilities**
  We assume utility equals dollar amount ($u(x) = x$).
  *   **Worst:** $0 (Utility 0)
  *   **Middle:** $50 (Utility 50)
  *   **Best:** $120 (Utility 120)

  **2. Cumulative Probabilities**
  *   **Option Safe:** 100% chance of $\ge 0$, 100% chance of $\ge 50$.
  *   **Option Risky:** 100% chance of $\ge 0$, 50% chance of $\ge 50$, 50% chance of $\ge 120$.

  **3. The Math**
  *   **Expected Utility (EU):** Linear probability.
      *   Safe: $1.0 \times 50 = \mathbf{50}$.
      *   Risky: $(0.5 \times 0) + (0.5 \times 120) = \mathbf{60}$.
      *   *Verdict:* **EU prefers Risky.**

  *   **Risk-Weighted Utility (REU):** Uses a risk function $r(p) = p^2$ (convex/risk-averse). Formula: $u(min) + r(cumulative\ prob) \times \Delta u$.
      *   Safe: $0 + 1^2(50 - 0) = \mathbf{50}$.
      *   Risky: $0 + 0.5^2(120 - 0) = 0.25 \times 120 = \mathbf{30}$.
      *   *Verdict:* **REU prefers Safe.** (Note: REU ignores the frame; it only sees final wealth states).

  *   **Cumulative Prospect Theory (CPT):** Depends on the Reference Point (RP).
      *   **Frame 1 (Gain):** RP = $0. Outcomes are +$50 vs (+$0 / +$120). People are risk-averse in gains.
          *   *Verdict:* **CPT prefers Safe.**
      *   **Frame 2 (Loss):** RP = $120. Outcomes are "Lose $70" (keep 50) vs ("Lose $120" / "Lose $0"). People are risk-seeking in losses to avoid a sure loss.
          *   *Verdict:* **CPT prefers Risky.**

  ***

  **Analysis: What's Doing the Work?**

  The single feature driving the split is the **Reference Point**.
  *   **EU** ignores it (only cares about final wealth).
  *   **REU** ignores it (only cares about ranking of final wealth).
  *   **CPT** depends on it (codes outcomes as gains or losses relative to the frame).

  If you remove the Reference Point shift (force everyone to see final wealth only), the case collapses toward **REU/EU**. CPT loses its ability to flip preferences. If you remove the Risk Function (make $r(p) = p$), the case collapses toward **EU**. REU loses its ability to prefer the Safe option despite the lower EV.

  **Playing Defense**

  **Objection 1:** *"REU is just smuggling in a 'taste for safety' and calling it rationality. Why is $p^2$ more rational than $p$?"*
  **Reply:** It's not about taste; it's about structure. REU explains why we consistently pay to eliminate small risks (insurance) even when EV says no, without needing to say our preferences are 'irrational.' It models the *value of certainty* as a structural feature of decision-making, not a bug.

  **Objection 2:** *"CPT is right. Real people flip-flop on frames. Your case is too clean; in real life, loss aversion swamps everything."*
  **Reply:** That's exactly why we need REU. If rationality depended entirely on framing, experts would make contradictory choices based on wording. REU captures the intuition that a rational agent *shouldn't* change their mind just because you described their bank balance as a "bonus" or a "deposit." It preserves consistency where CPT predicts volatility.
