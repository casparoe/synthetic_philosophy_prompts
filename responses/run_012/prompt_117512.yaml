prompt: |-
  ok so for my philosophy club thing i have to build a thought experiment and i need help with one. the topic i got is risk-weighted expected utility, which is the view where you dont just multiply each outcome by its probability. instead you line the outcomes up from worst to best, and then you apply a so-called risk function to the cumulative chance of doing at least that well. risk-averse people have a convex risk function, so they shrink the chance of getting anything better than the worst outcome, which is why theyll pay extra to lock in the floor.

  what i want is one case that pulls apart three things at once:
  1. plain expected utility, where you just multiply and add
  2. risk-weighted expected utility
  3. cumulative prospect theory, the one that treats gains and losses differently depending on a reference point, so its risk-averse for gains and risk-seeking for losses

  the hard part: i want a pair of matched choices, one that a normal person would describe as being about gains and one that theyd describe as being about losses, where cumulative prospect theory flips its answer between them but risk-weighted expected utility gives the same risk attitude in both, because it only cares about the ranking of the final outcomes and not about any reference point. so the two choices should have the same outcome structure and the same probabilities, just different framings.

  constraints:
  - realistic. no lab lotteries with coins and dice. put it somewhere a 16 year old would actually be: a part time job, a school thing, a family money thing, a sport or a band thing. one paragraph for the scenario itself, keep it tight.
  - no infinite anything, no perfect predictors, no weird physics, and the probabilities should be easy numbers like 1/4, 1/2, 3/4 so i can do the math by hand.
  - the numbers have to be picked so the disagreement actually happens. dont just tell me they disagree. pick the utilities and the risk function so that EU prefers one option, REU prefers the other, and CPT switches depending on which frame its in.

  after the scenario, do the check for me:
  - list the outcomes from worst to best, with the utilities im supposed to use
  - write out the cumulative probabilities for each option
  - plug them into the risk-weighted formula and show the arithmetic, once with a convex risk function and once with a linear one
  - say what EU says, what REU says, and what CPT says in each of the two framings
  - then tell me which single feature of the case is doing the real work, and what happens if i take it out. i want to know which way it collapses, toward EU or toward REU or toward CPT
  - finally, play defense. if someone says the risk-weighted view is just smuggling in a taste for safety and dressing it up as rationality, what would they say to break my case? and if a CPT person says my framing is too clean and real loss/gain asymmetries would definately swamp it, whats the best reply?

  dont bother with citations or a reading list, my teacher said we can describe the views in our own words. and please dont make it too long, the scenario plus the walkthrough should be something i can read out loud in about five minutes.
