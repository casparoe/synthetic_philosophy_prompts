answer: |-
  Here are 9 interview questions designed to press the substantive philosophical commitments of your guest's view, along with conversational follow-ups keyed to the defenses she's most likely to offer.

  ### 1. The Substitution vs. Consumption-Equivalent Objection
  **Question:** You argue that applying a discount rate to irreversible losses is a category error because these goods aren't substitutable. But a standard economist might reply: "Fine, losing a species isn't substitutable, but it's *equivalent* to losing $100 trillion in consumption. So we just plug that huge number into the standard model." Why isn't a large enough consumption-equivalent enough to save the phenomenon without changing the math?

  **Likely Answer:** She will argue that commensurability is the issue, not the magnitude. No amount of consumption compensates for existence values or irreversibility.
  **Follow-up:** "If no amount of consumption compensates, doesn't that effectively make the value infinite? And if it's infinite, how do you make a decision when you have to choose between two irreversible losses—say, preserving a species versus preserving a stable climate system?"

  ### 2. The Lexicographic Priority & Swamping Objection
  **Question:** If these non-substitutable goods can't be traded off against consumption, does that give them a lexicographic priority? The standard worry here is that a tiny probability of a huge irreversible loss swamps all present benefits. Do you accept that implication, or is there a threshold where we ignore the risk?

  **Likely Answer:** She will likely deny it's strictly lexicographic and argue for thresholds or "safe minimum standards" rather than absolute vetoes.
  **Follow-up:** "But once you start weighing probabilities against costs to set those thresholds, aren't you effectively reconstructing a discount rate via the back door? It looks like expected utility maximization, just with different inputs."

  ### 3. Uncertainty vs. Moral Status
  **Question:** You've argued that the usual uncertainty justification for discounting smuggles in a discount on future people's moral status. But standard decision theory says uncertainty just lowers the *expected value* of future states. Where exactly does the 'moral status' discount enter the equation? Is it in the probability assignment or the utility function?

  **Likely Answer:** She'll say it's in the weighting of the future welfare, implying we treat their potential existence as less valuable than our actual existence.
  **Follow-up:** "But if I'm uncertain whether a person exists—say, they're in a remote village I can't reach—weighting them less seems like Bayesian rationality, not moral discrimination. Why is temporal uncertainty morally different from spatial uncertainty?"

  ### 4. Intergenerational vs. Intragenerational Asymmetry
  **Question:** Your critique focuses heavily on intergenerational trade-offs. But within a single generation, we also face non-substitutable losses—like destroying an indigenous community to build a dam. Does your framework apply there? If not, what makes *time* the morally relevant feature rather than *irreversibility* itself?

  **Likely Answer:** She will argue that time creates a unique form of irreversibility because future generations cannot negotiate with us.
  **Follow-up:** "But spatial distance creates non-negotiability too. If the ethical work is being done by the lack of consent or the irrecoverability, why does your model rely so heavily on the temporal arrow?"

  ### 5. Declining Discount Rates
  **Question:** A lot of economists have moved toward declining discount rates to handle long-term uncertainty. Is your 'no rate for non-substitutes' view just a more radical version of this, or do you think declining rate models are still fundamentally mistaken?

  **Likely Answer:** She'll likely say they are still mistaken because they treat the good as commensurable from the start.
  **Follow-up:** "So even if the rate drops to zero in 300 years, the model is still unethical because it allowed a positive rate in year one? Does that mean any positive rate, however short-lived, corrupts the valuation of the non-substitutable?"

  ### 6. Person-Affecting vs. Impersonal Views
  **Question:** You defend zero pure time preference, which usually aligns with total utilitarianism. But your view focuses on preserving conditions like climate stability or species. Does this require actual future people to exist to be harmed, or does it hold even if the population changes?

  **Likely Answer:** She'll probably say it's about the conditions for *any* possible life, not just specific identified individuals.
  **Follow-up:** "Does that commit you to an impersonal view that clashes with your moral status argument? If you're protecting 'conditions for life' rather than specific future people, does the 'moral status' objection to discounting still hold?"

  ### 7. Operationalizing the "No Rate" View
  **Question:** Policymakers need to put numbers in spreadsheets. If you tell a ministry of finance 'do not discount this,' but they have limited budgets, how do they prioritize between two non-substitutable goods? Do you need a shadow price, or is this purely a qualitative constraint?

  **Likely Answer:** She will argue for qualitative constraints or "guardrails" rather than cost-benefit analysis.
  **Follow-up:** "But if qualitative constraints bind the budget, isn't that mathematically isomorphic to a very high shadow price? If the outcome is the same, is the fight about the math or the moral narrative?"

  ### 8. The Zero Pure Time Preference Concession
  **Question:** You grant zero pure time preference but reject the object of discounting. Why keep the zero PTP commitment at all? If the Ramsey rate is the wrong tool for these goods, does the pure time preference parameter even matter anymore?

  **Likely Answer:** She'll say it still matters for the substitutable goods (consumption bundles) that remain in the equation.
  **Follow-up:** "But if the bulk of catastrophic climate risk is non-substitutable, isn't the zero PTP concession doing very little work? Are we fighting over a parameter that only applies to the stuff that doesn't kill us?"

  ### 9. Falsifiability
  **Question:** Finally, what evidence or argument would actually change your mind? Is there a specific trade-off case where you'd say, "Okay, actually, we should discount this irreversible loss," or is this a foundational commitment for you?

  **Likely Answer:** She might say she'd change her mind if the cost to current people was also existential (a symmetry of survival).
  **Follow-up:** "So it's not about the good itself, but about a symmetry of survival? Does that reduce your view to a mutual assured destruction argument rather than a claim about the intrinsic value of the future?"
