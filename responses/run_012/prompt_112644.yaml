      *   *Why the paradox is apparent:* It confuses the *map* (the text) with the *territory* (the social agreement). The text doesn't grant authority; the players' mutual recognition does. The text guides it.
      *   *Concrete Distinction:* If the worry were real, you'd need an external judge (a professor?) to validate the change. Since there is no external judge, the players *are* the source. The "circularity" is actually a "feedback loop" of social acceptance.

