answer: |-
  - **Bottom line**
  Do not fight about whether insects feel "pain." You will lose on mechanism. Fight about **risk management under uncertainty**. Your opening move must be: "I am not claiming insects are sentient. I am claiming that given the astronomical stakes, the non-zero probability of sentience combined with near-zero cost interventions creates a dominant strategy for precaution." Force the neurobiologists to argue against *prudence*, not just biology. If you make this about ontology, you die. If you make it about expected value and error costs, you force the economists and philosopher to defend inaction.

  - **Concede up front**
  "I am not a neurobiologist, and I am not claiming insect nociception equals human pain. I concede that neuron count is a crude proxy for integrative capacity; architecture matters, and I don't have the data to refine it yet. I also concede that the ancestral state of sentience is debated. I am not asking you to accept insects as moral persons today. I am asking you to accept that the *uncertainty* itself, combined with the scale of insect death in agriculture, justifies low-cost policy shifts. If your objection is that my biological proxy is imperfect, I agree. If your objection is that we should do nothing until certainty is reached, I need to know why the burden of proof lies with the insect rather than the intervention."

  - **The hit list**

  1.  **The Neurobiologist (Nociception):** "Nociception is a reflex loop. Pain requires affective state integration. Insects lack the substrate. You're conflating damage avoidance with suffering."
      *   **Reply:** "I agree the substrate is different. But 'different' isn't 'absent.' If affective integration is a spectrum, and insects show trade-offs between injury and reward, they pass the behavioral bar. I'm not claiming human pain; I'm claiming negative valence."
      *   **Soft spot:** You lack a specific neural correlate for "valence" in arthropods.

  2.  **The Neurobiologist (Architecture):** "Neuron count is meaningless. A honeybee has a million neurons but performs complex navigation. Density and connectivity matter more than raw numbers."
      *   **Reply:** "Agreed, count is a placeholder. But without a better comparative metric across taxa, it's the only variable we have. I'm using it to argue for *some* weight, not *equal* weight."
      *   **Soft spot:** If the exponent is too low, the moral weight vanishes.

  3.  **The Neurobiologist (Pascal's Mugging):** "Plank 1 is unfalsifiable. 'Ancestral sentience' is a just-so story. You're multiplying a tiny probability by a huge number to force a conclusion."
      *   **Reply:** "It's not arbitrary. Phylogeny constrains the probability floor. If sentience arose once, insects have it. If twice, they likely have it. That's not a free parameter; it's a cladistic constraint."
      *   **Soft spot:** Convergent evolution of *mechanism* doesn't guarantee convergent *experience*.

  4.  **The Welfare Economist (Weighting):** "Your utility function is broken. If weight scales sub-linearly with neurons, how do you compare a pig to a million flies? The numbers don't sum to a policy preference."
      *   **Reply:** "They don't need to sum to 'save all flies.' They only need to sum to 'adjust pesticide use where cost is negligible.' I'm asking for marginal adjustments, not total liberation."
      *   **Soft spot:** "Negligible cost" is undefined in your model.

  5.  **The Welfare Economist (Opportunity Cost):** "You say interventions are cheap. But if yield drops 2%, food prices rise. Human welfare loss outweighs uncertain insect welfare. Where's that variable?"
      *   **Reply:** "That's a valid constraint. My argument applies only where yield impact is statistically zero. If there's a trade-off, human welfare wins. But many current practices have no yield benefit."
      *   **Soft spot:** Proving "no yield benefit" requires agronomic data you don't have.

  6.  **The Philosopher (Decision Rule):** "You're invoking a precautionary principle. But under expected utility theory, low probability usually dictates inaction. Why is this a special case?"
      *   **Reply:** "Because the asymmetry of error is vast. False positive (treating insentient as sentient) costs cents. False negative (treating sentient as insentient) costs massive suffering. The risk profile dictates the rule."
      *   **Soft spot:** This collapses if you admit the probability is effectively zero, not just low.

  7.  **The Group (Evidence Standard):** "What specific empirical finding would falsify your Plank 1? If nothing can, it's not science."
      *   **Reply:** "Discovery of a specific neural inhibition mechanism in arthropods that precludes integration of nociceptive input with motivational states. I'm waiting for that mechanism paper."
      *   **Soft spot:** They may argue that mechanism is already known to be absent.

  - **The one I'm hoping nobody asks**
  "If your framework holds, and we prioritize insect welfare, do we ultimately have to ban agriculture? Plants are defended by insect death. If the scale argument is real, the only moral outcome is human depopulation or synthetic food only. Are you prepared to defend that end-state?"

  *If it comes anyway:* "I am defending marginal improvements within existing systems, not ideal theory. We manage risk in nuclear power without shutting down the grid. We can reduce insect suffering in pesticide application without ending farming. Let's solve the tractable problems before debating the existential ones."

  - **The reply that has to land**
  "The Asymmetric Error Cost."
  "Look, if I'm wrong and insects aren't sentient, and we change a pesticide regime that costs farmers nothing, we lose nothing. If I'm right and we do nothing, we permit astronomical suffering. You don't need to believe my probability estimate. You only need to agree that the cost of being wrong about *inaction* is infinitely higher than the cost of being wrong about *precaution*. In a risk management framework, inaction is the risky position."
  *Why:* It bypasses the biology debate entirely and forces the economists and philosopher to defend the status quo as the "safe" option, which it mathematically isn't.

  - **Words to avoid in this room**
  Avoid "pain," "suffering," or "feelings" without qualifying them as "negative valence states." Do not use "rights" or "dignity." Avoid "anthropomorphic" (even defensively). Do not say "we know" regarding insect internal states. Avoid "speciesism." Use "integrative capacity," "nocifensive behavior," "utility function," and "error costs." Keep it mechanistic and economic, not moralistic.
