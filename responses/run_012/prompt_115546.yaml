answer: |-
  ### Specification for an Adequate Theory of Original Value

  The following requirements are derived from the cases and non-negotiable constraints provided. Each is marked as to whether it is a **Genuine Constraint** (logically forced by the practical tasks of acquisition, insurance, and restitution) or a **Camp Preference** (adopted by specific philosophical schools but contestable).

  **1. The Non-Perceptual Value Requirement**
  *   **Case:** The perfect replicator duplicate (identical isotope ratios, undetectable).
  *   **Specification:** The theory must locate value in a property that survives the total elimination of perceptual and physical differences between original and copy.
  *   **Status:** **Genuine Constraint.** (If value were perceptual, the insurance premium on the original would be fraud.)

  **2. The Authorship Trump Requirement**
  *   **Case:** The "better" forgery (finer composition, same period/materials) vs. the lesser original.
  *   **Specification:** The theory must explain why causal connection to the named artist can outweigh superior aesthetic properties in valuation, without denying the aesthetic superiority of the forgery.
  *   **Status:** **Genuine Constraint.** (Required to justify deaccessioning the forgery while retaining the original.)

  **3. The Token/Work Distinction Requirement**
  *   **Case:** Prints from reworked plates; authorized posthumous casts; digital files with no privileged token.
  *   **Specification:** The theory must distinguish between the value of the *work* (the abstract type) and the *token* (the physical instance), allowing some tokens to be originals (first impressions) and others to be derivatives (late casts) despite identical visual output.
  *   **Status:** **Genuine Constraint.** (Required for cataloging and display labeling.)

  **4. The Relational Context Requirement**
  *   **Case:** Roman marble copy of lost Greek bronze (copy as original); Artist's late replica of lost early work.
  *   **Specification:** The theory must allow an object to shift status from "copy" to "original" based on the loss of the predecessor or the intention of the artist, without physical change to the object itself.
  *   **Status:** **Genuine Constraint.** (Required for accurate historical labeling and valuation.)

  **5. The Material Continuity Requirement**
  *   **Case:** Ruin exhibited beside a copy; restored original that is half reconstruction.
  *   **Specification:** The theory must account for value retention despite material loss (ruin) and value dilution despite material addition (restoration), distinguishing between *material integrity* and *historical continuity*.
  *   **Status:** **Genuine Constraint.** (Required for conservation ethics and insurance assessment.)

  **6. The Cross-Domain Applicability Requirement**
  *   **Case:** Fabricated natural-history specimen vs. cast from genuine fossil.
  *   **Specification:** The theory must apply to epistemic/scientific value (evidence of nature) as well as aesthetic/cultural value, explaining why a fake specimen is worthless for science even if visually identical.
  *   **Status:** **Genuine Constraint.** (Required if the museum holds mixed collections.)

  **7. The Moral Provenance Requirement**
  *   **Case:** Object with documented wartime looting.
  *   **Specification:** The theory must treat a history of wrongdoing as a negative value-bearing property that can override market value or aesthetic value, distinct from the history of authorship.
  *   **Status:** **Genuine Constraint.** (Required for restitution claims and legal compliance.)

  **8. The Epistemic Dependency Requirement**
  *   **Case:** The valuation collapse upon learning an object is a copy (despite unchanged experience); the persistence of market premiums despite perfect replication technology.
  *   **Specification:** The theory must explain why value is sensitive to the *knowledge* of the observer (collapsing when the copy is revealed) while simultaneously explaining why the market treats the value as an objective asset (premium persists).
  *   **Status:** **Genuine Constraint.** (You specified this gap cannot be treated as mere error.)

  ***

  ### Incompatibility Report

  **The Epistemic-Asset Tension (Requirements 1 & 8 vs. Insurance/Acquisition Tasks)**
  There is a fundamental tension between **The Epistemic Dependency Requirement** and the practical task of **Insurance and Acquisition**.
  *   **The Conflict:** If value is epistemically dependent (Req 8), the value of the object changes when the *viewer's knowledge* changes, not when the *object* changes. However, insurance and acquisition treat value as an objective property of the asset that persists regardless of public knowledge.
  *   **The Incompatibility:** A theory that fully satisfies Epistemic Dependency implies you are insuring a state of public belief, not a physical object. A theory that fully satisfies the Insurance task implies the value is intrinsic to the history, making the valuation collapse upon discovery "irrational" (which you forbade).
  *   **Verdict:** These cannot be jointly satisfied without positing a dual-aspect value (one intrinsic, one relational). Any theory that offers a single unified metric of "value" will fail either the ethical reality of the valuation collapse or the financial reality of the insurance premium.

  ***

  ### The Eliminator

  **The Single Requirement That Eliminates Candidate Families:**
  **The Epistemic Dependency Requirement.**

  This requirement eliminates the largest number of candidate families because it forbids purely ontological views (value is *only* in the object's history regardless of us) and purely subjective views (value is *only* in the viewer's experience). It forces a relational ontology that most standard metaphysical accounts of art cannot support.

  ***

  ### Scorecard

  **Causal-History View:** Fails on **The Epistemic Dependency Requirement**; it explains why the original *is* different, but cannot explain why the value vanishes if the history is unknown.
  **Experiential View:** Fails on **The Non-Perceptual Value Requirement**; it cannot distinguish the original from the perfect replicator duplicate.
  **Debunking (Signalling) View:** Fails on **The Moral Provenance Requirement**; it treats the premium as positional, making it unable to account for why looted status negatively impacts value rather than just shifting market price.
