      *   **Conclusion:** How to fix it (redefine neutrality).

  6.  **Tone Check:** American English. Direct, analytical, respectful but critical. Avoid hedging too much.

  7.  **Final Polish:** Ensure I answer the specific prompt requirements (rank tensions, say what has to give, cost analysis).

      *   *Check:* Did I address the German Tax nuance? Yes, the state defining "church" is the hidden non-neutrality there.
