prompt: |-
  I'm the faculty rep on my uni's academic accomodations appeals panel and we've got a case this week that's splitting the room. A third-year student with a severe acquired memory impairment (encephalitis a few years back, he can't reliably hold onto new material for more than a few hours) already has extra time and a note-taker approved. Now he's asking to bring into a closed-book exam the setup he wears all day: a smartwatch paired to his phone, running an app that continuously records and transcribes, dumps everything into a personal knowledge base, and then surfaces relevant snippets and generates little summaries and practice questions on the fly. Here's the wrinkle that's got people going: his two closest study partners have write access to that same knowledge base, and he to theirs, so a decent chunk of what's in there is stuff the three of them contributed to each other, and the summaries are machine-generated, not just his own notes handed back to him. He says this isn't a crib sheet, it's his memory, it's as much a part of how he thinks as his own head is, and taking it away is like confiscating part of his brain. The exams office says closed-book means closed-book, full stop, and that if we let this in we have to let in everyone's phone and the whole category collapses. One of my colleagues half-remembers some criteria from a philosophy course — that a tool only really counts as part of your mind if it's always there when you need it, instantly accessible, automatically trusted rather than consulted, and endorsed without deliberation — and wants us to just test the case against those four boxes; I'm not sure that's the right test and I'd like your view folded in.

  Please draft the short written opinion I'll circulate before Friday's meeting. Recommend a concrete outcome — allow, deny, or allow with conditions — and if it's conditions, spell out exactly what they'd be and how we'd actually enforce them, in a way an exam invigilator could follow. Don't just fall back on the familiar Otto-and-his-notebook thought experiment; genuinely take his claim that the setup is part of his cognition seriously, and genuinely take the exams office's integrity and parity worry seriously, including whether the shared, machine-generated part of the knowledge base changes the picture compared to a private notebook. I want you to commit to a position and defend it rather than laying out options for us to pick from. Lead with the bottom line in your first sentence, then the reasoning, and skip the preamble and the restating of the question.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Faculty rep on an academic accommodations appeals panel.
      *   **Task:** Draft a short written opinion to circulate before a meeting.
      *   **Case:** Third-year student with severe acquired memory impairment (encephalitis) requests to use a smartwatch/phone setup during a closed-book exam. The setup records, transcribes, stores in a personal knowledge base (PKB), and surfaces summaries/questions on the fly.
      *   **Complications:**
          *   The PKB is shared with two study partners (write access both ways).
          *   Summaries are machine-generated.
          *   Exams Office says "closed-book means closed-book" (slippery slope argument).
          *   Colleague suggests using a specific philosophical test (always there, instantly accessible, automatically trusted, endorsed without deliberation) reminiscent of the Extended Mind Thesis (Otto & Clark).
          *   Need to take the student's claim (it's part of his cognition) seriously.
          *   Need to take the Exams Office's concern (integrity/parity) seriously.
          *   Need to address the shared/machine-generated aspect.
      *   **Constraints:**
          *   Commit to a position (Allow, Deny, or Allow with Conditions).
          *   Defend the position (no "here are options").
          *   Lead with the bottom line in the first sentence.
          *   Skip preamble and restating the question.
          *   Include concrete conditions and enforcement mechanisms if allowing.
          *   Tone: Professional, reasoned, decisive, suitable for faculty circulation.

  2.  **Evaluate the Core Conflict:**
      *   **Student's Need:** Severe memory impairment. Standard accommodations (extra time, note-taker) are insufficient for *recall* during the exam. The device functions as external memory.
      *   **Academic Integrity:** Closed-book exams test internal knowledge retention and synthesis. Allowing external access to information (especially machine-generated summaries and peer-contributed data) fundamentally alters what is being tested.
      *   **The "Extended Mind" Argument:** The colleague's criteria (always there, accessible, trusted, endorsed) come from the Extended Mind Thesis (EMT). However, EMT is about metaphysics of mind, not necessarily exam policy. Even if the device *is* part of his mind metaphysically, exams are social contracts designed to measure specific competencies.
      *   **The Shared/Machine Aspect:** This is the critical differentiator from a paper notebook. A paper notebook is static and personal. This PKB is dynamic, shared, and algorithmically processed. This introduces collaboration (potential unfair advantage) and automation (potential bypassing of cognitive work).

  3.  **Determine the Position:**
      *   *Deny:* Protects integrity but fails the student's genuine medical need. Might be discriminatory if no alternative exists.
      *   *Allow Unrestricted:* Undermines the closed-book exam format completely. Sets a precedent that is hard to contain (Exams Office worry).
      *   *Allow with Conditions:* Best balance. Acknowledges the disability need while mitigating the integrity risk.
      *   *Specific Condition Focus:* The shared access and machine generation are the dealbreakers for a *closed-book* exam. The device can function as memory, but it must be *his* memory, not a collaborative hive mind or an AI solver.
      *   *Decision:* **Allow with Strict Conditions.** The device is permitted as a compensatory aid for memory, but the *content* and *functionality* must be sanitized to ensure individual competency is still being measured.

  4.  **Drafting the Argument:**
      *   **Bottom Line:** Recommend approval contingent on sanitizing the knowledge base and disabling real-time generation features.
      *   **Reasoning - Disability:** Acknowledge the severity. The "part of his brain" claim has merit regarding functional capacity. Denying all external aid renders the exam impossible for him.
      *   **Reasoning - Integrity:** Acknowledge the Exams Office's point. A closed-book exam measures internalized knowledge. If the device provides *new* synthesis or *peer* knowledge during the exam, it violates the parity principle.
      *   **Reasoning - The Shared/Machine Element:** This is where the colleague's philosophical test fails. The "endorsement without deliberation" criterion is met, but the *source* of the information matters. Shared access violates individual assessment. Machine generation violates the test of synthesis.
      *   **Conditions:**
          1.  **Snapshot Mode:** The PKB must be frozen 24 hours before the exam. No new data in.
          2.  **Severed Links:** Shared write access must be disabled during the exam window (and ideally the data contributed by others flagged/removed).
          3.  **Passive Retrieval Only:** The "surfacing snippets/generating summaries" feature must be disabled. He can search his *own* past notes, but the AI cannot synthesize new answers during the exam.
          4.  **Device Lockdown:** The phone/watch must run in a locked kiosk mode (only the app works, no internet, no other apps).
      *   **Enforcement:** IT support to verify settings before exam. Invigilator checks device state.

  5.  **Refining the Tone:**
      *   Needs to be firm but empathetic.
      *   Needs to address the philosophical criteria without getting bogged down in theory.
      *   Needs to show practical enforceability.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I lead with the bottom line? Yes.
      *   *Check:* Did I avoid preamble? Yes.
      *   *Check:* Did I address the shared/machine aspect? Yes, this is crucial for the conditions.
      *   *Check:* Is the enforcement practical? "Kiosk mode" and "Snapshot" are technically feasible.
      *   *Check:* Did I commit? Yes, "Allow with Conditions."
      *   *Check:* Did I address the colleague's philosophical test? I should mention why it's insufficient on its own (it addresses coupling, not content origin).

  7.  **Final Polish:** Ensure the distinction between "memory aid" (allowed) and "information retrieval/synthesis" (not allowed) is clear. The device can store *his* past learning, but cannot generate *new* answers or access *others'* learning during the test.

      *Wait, one nuance:* If his memory impairment prevents him from holding material for more than a few hours, how can he have a "snapshot" of his own notes from 24 hours ago that he actually remembers writing? The point of the device is that he *doesn't* remember. So allowing him to search his *own* past notes is the accommodation. The problem is the *shared* notes and the *AI synthesis*.
      *Correction on Conditions:* The PKB can contain his past notes (recorded during lectures/study). But during the exam, it cannot accept *new* input (no recording during exam), cannot access *peer* contributions (shared write access must be suspended/filtered), and cannot use *generative* AI to create answers (search only, no summarization).
      *Actually, the prompt says the app "surfaces relevant snippets and generates little summaries... on the fly."* This is the risk. If he asks "What is the definition of X?" and the AI summarizes it from the database, is that recall or lookup? For someone with amnesia, lookup *is* recall. But if the database contains peer notes, that's collaboration.
      *Revised Condition:* The database must be audited to remove peer-contributed content relevant to the exam course. The generative summarization must be disabled; he can only retrieve raw transcripts/notes he personally created. This ensures he is accessing *his* recorded experience, not a collaborative study guide.

      *Let's tighten the enforcement:* IT validates the "exam profile" on the device. Invigilator confirms "Airplane Mode" + App Lock.

      *Philosophical Test:* I need to explicitly address the colleague's 4 boxes. They establish *coupling* (is it part of him?), but not *integrity* (is it fair?). I will argue that while the device passes the "mind" test, it fails the "individual assessment" test due to the shared/AI components.

      *Final Plan:*
      1.  Bottom line: Approve with strict sanitization conditions.
      2.  Validate the cognitive claim (it is functional memory).
      3.  Validate the integrity concern (shared/AI content violates individual assessment).
      4.  Critique the philosophical test (necessary but not sufficient).
      5.  List conditions (Snapshot, Solo Content, Passive Retrieval, Lockdown).
      6.  Enforcement steps.

  8.  **Drafting the Content:** (Mental check of word count and tone). Keep it tight. Faculty memo style.

      *First Sentence:* I recommend we approve the accommodation request, but only under strict conditions that sanitize the knowledge base of peer-contributed content and disable real-time generative features during the exam window.

      *Reasoning:* Acknowledge the disability. The device is functionally necessary. However, the shared/AI aspect changes it from a prosthetic to a collaborative tool.
      *Philosophical Test:* The colleague's criteria confirm the device is *coupled* to his cognition, but they do not address the *source* of the information. A shared database violates the principle of individual competency.
      *Conditions:* 1. Content Freeze (24h prior). 2. Peer Content Filter (remove study partner inputs). 3. No Generative AI (search only, no summarization). 4. Device Lockdown (kiosk mode).
      *Enforcement:* IT check + Invigilator visual check.

      *Wait, one more thing:* The prompt says "he can't reliably hold onto new material for more than a few hours." If he can't hold material, how does he learn? He relies on the device. So the device *is* his memory. The exam must test his ability to *use* his memory (including the device) to solve problems, not his ability to store data biologically. However, if the database contains *other people's* understanding, he is being tested on their cognition too. That's the unfair advantage.
      *Refined Condition:* The database must contain only data *he* recorded or authored. The AI can organize *his* data, but cannot synthesize answers from external knowledge or peer data.

      *Let's write.*
answer: |-
  I recommend we approve the accommodation request, but only under strict conditions that sanitize the knowledge base of peer-contributed content and disable real-time generative features during the exam window.

  We must accept the student's claim that this setup functions as his cognitive prosthetic; for someone with severe acquired amnesia, denying access to his recorded history is functionally equivalent to denying a blind student a screen reader. However, accepting the device as part of his mind does not automatically justify permitting all its current configurations in a closed-book assessment. The Exams Office is correct that parity matters: a closed-book exam measures individual competency, not the performance of a collaborative network or an algorithm.

  My colleague's four-box philosophical test (constant availability, accessibility, trust, endorsement) successfully establishes that the device is *coupled* to the student's cognition, but it fails to address the *provenance* of the information being accessed. A tool can be fully integrated into one's cognitive process and still provide unfair access to external agency. The shared write access means the knowledge base contains the cognitive labor of his peers, and the generative summaries mean the device is performing synthesis during the exam, not just retrieving stored data. Allowing this would shift the assessment from testing his understanding to testing his ability to query a collaborative AI system.

  To balance his medical necessity with academic integrity, I propose the following conditions for approval:

  1.  **Content Sanitization:** The knowledge base must be audited 24 hours prior to the exam. Any entries flagged as contributed by his study partners must be hidden or removed for the duration of the exam. The database must reflect only his own recorded lectures, notes, and inputs.
  2.  **Passive Retrieval Only:** The "generative summary" and "practice question" features must be disabled. He may search and retrieve his own raw transcripts and notes, but the system cannot synthesize new answers or summaries during the exam period. This ensures he is accessing his own memory, not asking the device to "think" for him in real-time.
  3.  **Input Freeze:** The recording function must be disabled during the exam. No new data can enter the knowledge base once the exam begins.
  4.  **Device Lockdown:** The phone and watch must operate in a kiosk mode locked to the specific app, with all internet connectivity and other applications disabled.

  **Enforcement Protocol:**
  *   **Pre-Exam IT Verification:** Our disability services IT specialist will meet with the student 48 hours before the exam to configure the "Exam Profile" on the device, implementing the content filters and feature disables. They will sign off on the configuration.
  *   **Invigilator Check:** On exam day, the invigilator will verify the device is in Airplane Mode and launch the app to confirm the "Exam Profile" is active (e.g., a visible banner stating "Exam Mode: Generation Disabled").
  *   **Post-Exam Audit:** A random log check of the app's activity during the exam window will confirm no recording occurred and no external queries were made.

  This approach honors the student's reality that the device is his memory while preserving the exam's purpose as a measure of his individual learning, not his group's.
