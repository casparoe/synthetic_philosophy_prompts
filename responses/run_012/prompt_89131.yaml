  The step you should reject is **(2)**.

  Here is the breakdown of why this is the strategic move and what it costs you.

  ### Why Reject Step (2)?
  Step (2) asserts a condition for truth that is impossibly high: *"For there to be a fact of the matter, 'violence' has to pick out a determinate class of events — one whose membership doesn't depend on who's doing the counting."*

  This premise assumes that for a statement to be true or false, the terms within it must have sharp, precise boundaries that exist independently of human classification. This is a form of semantic skepticism that, if accepted, would invalidate almost all empirical claims, not just those about violence. Consider the claim: *"Is the world getting warmer?"*
  *   The concept of "warmth" in a global average is operationally defined (satellite data vs. surface stations, anomalies vs. absolute temps).
  *   The boundaries of "the world" (atmosphere depth, ocean inclusion) are somewhat flexible.
  *   Yet, we agree there is a fact of the matter about global warming.

  Your friend's argument relies on the idea that because our *definitions* and *classifications* shift (the "count-constituted" nature), the *reality* they track becomes indeterminate. By rejecting (2), you deny that linguistic or historiographic precision is a prerequisite for ontological truth. You assert that we can track real-world trends even if the bucket we pour them into has fuzzy edges.

  ### What Is the Cost?
  Rejecting (2) is not free. Here is what you have to pay:

  1.  **You must accept vagueness in reality (or language).** You have to concede that your friend is right about the *data*: yes, definitions of violence do shift, and yes, there is no sharp line where "punishment" becomes "violence" or "accident" becomes "negligence." You lose the comfort of believing that "violence" is a natural kind with a crisp boundary like "electron" or "water."
  2.  **You must adopt a robust theory of truth.** You can no longer hold a simple correspondence theory where words map 1:1 to discrete objects. You have to argue for a pragmatic or supervaluationist view of truth: a statement is true if it holds across all reasonable precisifications of the vague term. (e.g., "The world is less violent" is true if, under *any* reasonable definition of violence, the trend holds).
  3.  **You concede the "hard cases."** You must admit that for specific borderline events (e.g., a specific famine in 1700), there may be *no* fact of the matter whether it counts as violence. You save the general trend (the macro fact) by sacrificing the determinacy of the micro events.

  ### Why Not Reject Step (3)?
  You might be tempted to reject (3) and argue that there *is* an objective, trans-historical class of violent events (e.g., "physical harm to sentient beings"). While this preserves your intuition, the cost is much higher: you would have to defend a form of moral realism or essentialism against historical relativism. You would have to argue that a 17th-century duel is *objectively* the same kind of thing as a modern assault, regardless of the cultural context that framed it. This is a much harder philosophical fight than simply admitting that our concepts are fuzzy but our facts are real.

  By rejecting (2), you neutralize your friend's "kicker" (that this kills all "getting X-er" debates). You can affirm that the world can get "richer," "healthier," or "less violent" even if "wealth," "health," and "violence" are socially influenced concepts, because facts do not require perfect semantic precision.

