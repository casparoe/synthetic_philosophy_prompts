prompt: |-
  For most of my life the philosophy of perception was, I am slightly embarrassed to admit, a subject I had filed under interesting but not mine. That changed this spring. I began having brief episodes in which I see things that are not there: a drift of coloured shapes across one side of the visual field, and now and then something that looks for all the world like a familiar object resting on a table. My neurologist says the episodes are harmless and that I should pay them no attention. What I cannot dismiss is the question they have made vivid: while an episode lasts, the experience is, judged from the inside, of just the sort that occurs when I look at something real, and yet I would not dream of treating it as evidence about the room I am standing in. Before I read any more theory I want the specification. Please write the desiderata: what any adequate account of perceptual experience has to deliver if it is to make sense of this, and of the ordinary cases alongside it.

  Give the list in full, with the case or consideration behind each entry. Among the cases: ordinary veridical seeing; seeing something as other than it is, as when a straight stick half in water looks bent; my episodes; after-images and the phosphenes one can produce by pressing on a closed eye; and experiences brought about by direct stimulation of the visual system, which I understand can be indistinguishable, for the subject, from seeing. Among the distinctions the list must not collapse: between the phenomenal character of an experience and its epistemic standing; between what caused an experience and what the experience is; and between the claim that a hallucination is subjectively indiscriminable from a perception and the claim that the two are experiences of one fundamental kind. I want the last two kept firmly apart, since much of the argument I have been reading seems to run them together; and I would like an entry requiring a theory to say what the argument from illusion has going for it without helping itself to the assumption that indiscriminability implies sameness of kind. Say of each entry whether it is a genuine requirement or merely a commitment of one camp, and identify any pair you think cannot be jointly satisfied. The one I keep circling is this: a theory that treats the two experiences as of one kind seems to hand the hallucination the standing of the perception, while a theory that insists they are of different kinds owes an account of why they are indistinguishable from the inside. Tell me which single requirement does the most to eliminate candidate theories, and then, in a few sentences each, how the disjunctive view, the sense-datum view, and the representationalist view fare against the list. One further item to consider including: when an episode begins in a certain way I can sometimes recognise it as an episode while it is still going on, and the experience itself does not seem to me any the less like seeing for that. Add a requirement to cover this if you judge one is needed, and say whether it is a requirement at all or merely an artefact of my attending closely to myself. I do not need a reading list; I want the specification, pitched at the level of cases and constraints rather than slogans.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Persona:** Someone with a philosophical background (familiar with terms like "phenomenal character," "epistemic standing," "disjunctive view," "sense-datum," "representationalist," "argument from illusion") but currently approaching the subject from a personal, lived experience (visual episodes/hallucinations). They are skeptical of theory that glosses over the phenomenology. They want a "specification" or "desiderata" list for a theory of perception.
      *   **Task:** Create a list of desiderata (requirements) for an adequate account of perceptual experience.
      *   **Specific Content Requirements:**
          *   Include specific cases: Ordinary veridical seeing, illusion (bent stick), the user's episodes (hallucinations), after-images/phosphenes, direct electrical stimulation.
          *   Maintain specific distinctions: Phenomenal character vs. epistemic standing; Cause vs. Constitution; Indiscriminability vs. Same Kind.
          *   Address the "Argument from Illusion" without assuming indiscriminability implies sameness of kind.
          *   Label each entry: Genuine requirement vs. Commitment of one camp.
          *   Identify incompatibilities: Are there pairs that cannot be jointly satisfied? (Specifically the "Common Kind" vs. "Disjunctive" tension).
          *   Identify the "Killer Constraint": Which single requirement eliminates the most candidate theories?
          *   Evaluate three views: Disjunctivism, Sense-Datum Theory, Representationalism against the list.
          *   Address the "Recognition during Episode" case: Add a requirement if needed, determine if it's genuine or an artefact of introspection.
          *   **Tone/Style:** Philosophical, precise, pitched at cases and constraints rather than slogans. No reading lists.

  2.  **Drafting the Desiderata (The Specification):**

      *   *Constraint 1: The Veridical Case.* Must explain how perception puts us in touch with the world. (Genuine Requirement).
      *   *Constraint 2: The Illusion Case.* Must explain non-veridical content without denying the object exists (e.g., bent stick). (Genuine Requirement).
      *   *Constraint 3: The Hallucination/Episode Case.* Must account for the user's specific experience (seeing what isn't there) without denying its phenomenological reality. (Genuine Requirement).
      *   *Constraint 4: Phenomenology vs. Epistemology.* Must distinguish *what it's like* from *what it justifies*. (Genuine Requirement).
      *   *Constraint 5: Cause vs. Constitution.* Must distinguish what triggers the experience from what the experience consists in. (Genuine Requirement).
      *   *Constraint 6: Indiscriminability vs. Common Kind.* Must allow that two things can feel the same without being metaphysically the same type of state. (Genuine Requirement - crucial for the user's concern).
      *   *Constraint 7: The Argument from Illusion.* Must explain the force of the argument (why we doubt the senses) without accepting its conclusion (that we only see sense-data). (Genuine Requirement).
      *   *Constraint 8: Non-Object Experiences.* Must account for after-images/phosphenes/stimulation which lack external objects but feel visual. (Genuine Requirement).
      *   *Constraint 9: Recognition during Episode.* (The user's specific addition). Can one know it's a hallucination *while* having it, yet it still looks like seeing? (Needs evaluation).

  3.  **Refining the Desiderata & Labeling:**

      *   *Refinement on Constraint 9:* The user asks if this is a requirement or an artefact. It challenges the idea that "believing it's real" is part of the phenomenal character. It suggests cognitive penetration or a separation between doxastic attitude and sensory feel. I should frame this as a requirement for *Cognitive Independence of Phenomenology*.
      *   *Refinement on Incompatibilities:* The user specifically points out the tension between "Common Kind" (Same fundamental kind) and "Disjunctive" (Different kinds). I need to highlight that satisfying the "Indiscriminability" constraint often pushes towards Common Kind, while satisfying the "Veridical Contact" constraint pushes towards Disjunctivism.

  4.  **Identifying the "Killer Constraint":**

      *   Which one filters the most? Usually, it's the tension between *Veridical Contact* (naïve realism) and *Indiscriminability* (the hallucination constraint). If you demand the hallucination be the *same kind* of state to explain the feel, you lose the direct contact in the good case. If you demand direct contact in the good case, you struggle to explain the feel of the bad case without positing a common denominator.
      *   *Decision:* The requirement to **account for subjective indiscriminability without positing a common fundamental kind** is the hardest hurdle. It forces a choice between Disjunctivism (which struggles with the explanation) and Common Kind theories (which struggle with the metaphysics of the good case). Let's call this the "Indiscriminability without Identity" constraint.

  5.  **Evaluating the Three Views:**

      *   *Sense-Datum Theory:* Posits intermediaries. Satisfies Indiscriminability (same kind of mental object). Fails Veridical Contact (we never see the world directly). Fails the "Cause vs Constitution" distinction often (the datum is the object).
      *   *Representationalism:* Content-based. Satisfies Indiscriminability (same content type). Tries to save Veridical Contact (content matches world). Struggles with "Recognition during Episode" (if content is the same, why the different belief?). Struggles with Phosphenes (what is the content?).
      *   *Disjunctivism:* Metaphysically distinct. Satisfies Veridical Contact perfectly. Struggles with Indiscriminability (how can they feel the same if they are different?). Often accused of violating the "Common Kind" intuition.

  6.  **Addressing the "Recognition during Episode" (Constraint 9):**

      *   Is it a requirement? Yes. It shows that *assertoric force* (taking it to be true) is separable from *phenomenal character* (looking like). A theory must allow that the "feel" of seeing can persist even when the "belief" in seeing is suspended. This attacks theories that tie phenomenology too closely to doxastic commitment.

  7.  **Review against Constraints:**

      *   Did I include all cases? (Veridical, Illusion, Episodes, After-images, Stimulation). Yes.
      *   Did I keep distinctions apart? (Phenomenal/Epistemic, Cause/Constitution, Indiscriminability/Kind). Yes.
      *   Did I address the Argument from Illusion? Yes.
      *   Did I identify the incompatibility? Yes (Common Kind vs. Direct Contact).
      *   Did I evaluate the three views? Yes.
      *   Did I address the "Recognition" point? Yes.

  8.  **Tone Check:**

      *   The user is intellectually sophisticated but wants clarity, not jargon-soup. The tone should be respectful, analytical, and direct. Avoid "According to Smith (1999)..." Keep it focused on the logic of the cases.

  9.  **Final Polish:**

      *   Ensure the distinction between "Genuine Requirement" and "Camp Commitment" is clear.
      *   Make sure the "Killer Constraint" is explicitly identified.
      *   Check the "Recognition" requirement status (Requirement vs Artefact). I will argue it is a genuine requirement because it isolates phenomenology from judgment.

  **(Self-Correction during drafting):** I need to be careful with the "Argument from Illusion" entry. The user wants the theory to say what the argument has *going for it* without assuming indiscriminability implies sameness of kind. This means the theory must acknowledge the *phenomenological continuity* that motivates the argument, without accepting the *metaphysical conclusion*.
  Also, regarding the "Recognition during Episode": The user asks if it's an artefact of attending closely. I should argue it's not an artefact; it's a crucial data point about the modularity of perception vs. cognition.

  10. **Final Structure:**
      *   Introduction (acknowledging the shift from abstract to personal).
      *   The Specification (Numbered List of Desiderata).
      *   Analysis of Incompatibilities.
      *   The Killer Constraint.
      *   Evaluation of the Three Views.
      *   The "Recognition" Requirement.

