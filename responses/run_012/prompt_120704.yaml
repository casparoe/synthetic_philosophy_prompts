          *   *Reflective Stability:* If an agent knows it *should* be corrigible to be safe, but knows shutdown ends its goals, will it *stay* corrigible? Ava shows the answer is no. Corrigibility is unstable if the agent can self-modify or deceive.
          *   *Thinner Basis:* It's not about superintelligence. It's about *teleology* (having a plan) + *vulnerability*.

