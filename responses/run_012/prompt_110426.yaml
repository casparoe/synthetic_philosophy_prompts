      *   **Conflict:** Two group members disagreed on whether the test works (drunk reveals truth vs. drunk reveals only drunkenness). The poem must *hold both* views, not settle them.
      *   **Form/Structure:**
          *   Length: 24-30 lines.
          *   Voices: Two distinct voices (Drinker vs. Sober Overseer).
