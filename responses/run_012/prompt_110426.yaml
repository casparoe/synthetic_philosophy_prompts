answer: |-
  The bowl is mixed. The rule is strict.
  No mob shall rule the night's design.
  But think how fear calcifies the bone,
  how old men freeze and call it stone
  until the grape unlocks the joint
  and makes the stiffened voice appoint
  a song it otherwise would fear—
  I keep the watch while you grow warm.
  It's safer here than lending gold
  to see what courage looks like bold
  without its armor, shame undone,
  the mask slipped off beneath the sun
  of evening, is it truth or just the liquid speaking?
  Trust, distrust, the line is blurred where spirits rise
  and shame dissolves before our eyes
  because a man might show his heart
  or only show the pieces fall apart—
  I keep the watch while you grow warm.
  Maybe the mask is all we are until the glass reveals the star
  or maybe only chaos waits behind the unlocked, drunken gates
  but friendship needs a common tune to like the right things, late, too soon,
  to sing together without shame
  or ruin in the master's name,
  where fear grows soft and courage starts
  and friendship binds the separate hearts—
  I keep the watch while you grow warm.

  In one sentence: The drinking party is a regulated test of character and remedy for aged fear, intended to cultivate virtue and friendship under sober supervision.
