              *   *Moderate Legal Moralism:* It is permissible to criminalize conduct because it is immoral *and* threatens social stability (Devlin's actual view is often debated here, but he generally argues for the right to enforce morality to protect society, not just for morality's sake).
              *   *Wait, check the distinction:* Usually, the distinction in this context (often drawn by Hart *about* Devlin) is:
