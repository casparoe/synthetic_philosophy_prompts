prompt: |-
  A colleague who minored in philosophy recently sent me the following write-up on the identity of indiscernibles, and before I pass any of it along I would like an accuracy audit. The write-up reads:

  "The identity of indiscernibles is the claim that if two things share all of their properties, they are really one and the same thing. Leibniz took this to be a necessary truth of metaphysics, but Max Black disposed of it with a thought experiment. Imagine a universe containing nothing but two iron spheres, identical in size, colour, temperature, and every other respect, one here and one there. There are plainly two of them, so the principle is false. The only escape is to count 'being in this spot' and 'being in that spot' as properties that distinguish the spheres, but that is precisely the difference the principle was supposed to explain, so it is not a rescue. The lesson is that the identity of indiscernibles collapses into the trivial truth that each thing is identical with itself, and that the interesting version of the principle is dead."

  Please go through this claim by claim and tell me what a philosopher working in this area would accept, what is a defensible simplification, and what is simply mistaken. I would especially like to know whether the write-up has correctly identified which of the two closely related principles is the trivial one, whether the thought experiment really establishes what the write-up says it establishes, and whether the closing lesson follows even if the thought experiment is granted. Since I have no background here, please define any technical terms you introduce.
