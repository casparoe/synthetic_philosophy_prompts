      4. The analysis of the gap (energy vs. experience) vs. confusion (flux vs. event).
      5. The measurability question (premises vs. conclusion).
      6. Closing thought.

      *Check:* No bold text. No lists. Just paragraphs.

      *Drafting thought:* When discussing "destroying habitat," ecologically this is reducing the energy base. But does it reduce suffering? If you reduce habitat, you might increase density in remaining patches, increasing competition and stress. Or you might force animals into sinks. This complicates the "less is better" claim. I should mention source-sink dynamics.

      *Drafting thought:* The "charnel house" claim relies on Type III survivorship. Most biomass turnover is in small-bodied, high-turnover species (insects, small mammals). Reducing habitat might disproportionately affect K-selected large mammals (top predators) due to area requirements, potentially *increasing* the proportion of r-selected species (mesopredator release or edge effects). This is a crucial ecological counter-point to the ethical claim. I need to include this nuance.

      *Drafting thought:* The prompt asks about "health, integrity, degradation." In ecology, destroying habitat is "degradation." In the ethical claim, it's "improvement." This is the core conflict of normative language.

