prompt: |-
  I'm a novelist, a few chapters into a book about a reserve police battalion in the war, and I've spent months bouncing between Browning's Ordinary Men and Goldhagen's Hitler's Willing Executioners — the situationalist read where fairly ordinary guys become killers under pressure and drift, and the culture-and-character read where they were already willing, soaked in a society that had thoroughly dehumanized its victims long before anyone handed them a rifle. My problem is I can't tell how much of the fight is real and how much is the two sides just talking past each other, so I want you to write the joint statement these two camps should have signed years ago.

  Give me a numbered section of claims both sides can actually put their names to — including about the evidence, since they're both leaning on the same pile of postwar interviews and testimony, so say what each accepts about how trustworthy that testimony is and how the men's need to present themselves decently decades later might have shaped it. Then a disagreements table with the real splits in wording each side would accept for its own view, the cruxes underneath those splits, and for each crux a case or argument both sides agree bears on it with each side's prediction written down in advance. I'd especially like at least one crux you can put a rough number on: say a unit that's been told outright that refusing to shoot carries no penalty, and that another unit already refused without anything happening to them — what does each camp predict about how many still pull the trigger, and why. Where you think part of the quarrel is really just about words, say which part. Casual tone is fine, this is for me, not a journal.
