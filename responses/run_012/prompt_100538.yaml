  By making this element explicit, the choice is determined: we must adopt the structural core common to both theories. The evidence (the provable equivalence) combined with the aim (truth about physical reality) forces us to treat the divergent ontologies as gauge freedom. We do not choose Theory A over Theory B; we choose the invariant theory that both describe. This dissolves the underdetermination because there are not two competing physical hypotheses, but one hypothesis expressed in two languages.

