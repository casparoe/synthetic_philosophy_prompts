answer: |-
  **Brainstorming the Ingredients**
  To build a genuine multipolar trap (not just a commons problem), I need:
  1.  **Decoupled Incentives:** Individual reward/punishment is local, but the cost of protection is global.
  2.  **No Credible Commitment:** Parties cannot bind themselves to future restraint.
  3.  **Defensive Rationality:** The "defect" strategy is actually risk mitigation, not greed.
  4.  **Stable Equilibrium:** The system doesn't crash; it just calcifies at a suboptimal efficiency level.

  **The Case: The "Defensive Schema" Trap**
  **Setting:** A mid-sized tech company with three backend teams: **Auth**, **Billing**, and **Core**. They share data via internal APIs.
  **The Trap:** Every team adds strict validation layers and requires 48-hour notice for any upstream schema change.
  **The Outcome:** Deployment velocity drops 80%. Engineers work weekends to coordinate changes. The system is stable but immobile. Everyone is exhausted and hates the product.

  **Why the Exits Fail**
  *   **Handshake:** Teams agree to "trust each other" and drop validation. Two weeks later, Billing pushes a subtle type change. Auth crashes. Auth immediately reinstates validation. Trust is dead.
  *   **Unilateral Backing Off:** If Auth drops their validation while Billing keeps theirs, Auth absorbs all the breakage risk. Auth's lead gets fired for the outage. Rational actors don't do this.
  *   **Reputation:** "Billing is too strict." Doesn't matter. Being "easy to work with" doesn't save you from being on the hook for an outage. Blame avoidance trumps reputation.
  *   **Pass a Law:** Management mandates "No validation gates." Teams implement "automated integration tests" instead. Same friction, different name. You can't legislate away the fear of blame.

  **The Reasoning**
  *   **Auth:** "If I don't validate Billing's input, their bug becomes my outage. I get blamed. I must validate."
  *   **Billing:** "If I don't warn Core about changes, their pipeline breaks. They blame me. I must notify."
  *   **Core:** "If I don't lock my dependencies, Auth and Billing will break me silently. I must lock versions."
  *   **Result:** Everyone is perfectly rational. Everyone is miserable.

  **The Structural Feature: Asymmetric Liability**
  The trap is powered by **Local Liability vs. Distributed Friction**.
  *   **Liability is Local:** If the system breaks, *one* team gets blamed (the one who didn't protect themselves).
  *   **Friction is Distributed:** The cost of the protection (slower shipping, more meetings) is spread across *all* teams.
  *   **Why Removal Dissolves It:** If you remove asymmetric liability (e.g., via **Blameless Postmortems** + **Shared On-Call**), the incentive changes. If Auth doesn't get fired when Billing breaks them, Auth doesn't need the heavy validation shield. The cost of protection now outweighs the risk of failure. The trap dissolves because the "defensive" move is no longer the dominant strategy.

  **Steelman the Skeptic**
  *Skeptic:* "This isn't a trap; it's just engineering maturity. Rigorous contracts prevent production fires. The 'misery' is the price of stability. You're valuing velocity over reliability."
  *Evaluation:* The skeptic loses. Stability at zero velocity is business failure. In this scenario, the system *was* stable before the escalation, but fear drove redundant safeguards. The extra friction doesn't buy extra safety; it buys *insurance against blame*. When the process exists to protect careers rather than the system, it's a trap, not maturity.

  **Conclusion for Your Deck**
  You aren't dealing with incompetence. You're dealing with a system where protecting yourself requires hurting the group, and hurting the group is the only way to protect yourself. Fix the liability structure, not the people.
