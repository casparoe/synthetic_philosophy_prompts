answer: |-
  Your first two horns strike at the same assumption: that utility is defined over outcomes independent of the information state itself. The spoiler case violates this explicitly; you treat the synopsis as a consumable good that alters the value of the film, not merely as a tool for selecting a viewing strategy. This does not falsify the theorem but places you outside its domain, which concerns the *instrumental* value of information for navigating the world, not its *intrinsic* value as a source of pleasure or pain. Nor does this restriction render the theorem empty. To claim that truth is never instrumentally costly is not a tautology; it is a structural claim about the convexity of the value function. It asserts that for any agent who treats beliefs solely as maps for action, adding detail to the map cannot reduce the expected quality of the destination chosen, even if the map reveals the terrain is rougher than hoped.

  The third case, involving present bias, violates the premise that you are a genuine expected-utility maximizer. A agent who anticipates their future self will deviate from the current optimal plan is not a unified maximizer but a sequence of conflicting players; the theorem assumes a coherent agency that updates and optimizes consistently across time. Here the qualifier "in expectation" does the crucial work of distinguishing the *policy* of acquiring information from any particular *realization*. You may learn a fact that forces you to abandon a hopeful gamble, lowering your utility relative to a lucky ignorance, but you could never have known that luck was available to you ex ante. The theorem survives as a substantive claim because it proves that for a coherent agent, the option to update is strictly preferable to the option to remain fixed, regardless of what the update reveals.
