      *(Self-Correction during drafting)*: I initially thought about making Q4 about legal liability. The prompt says "no lawyer in the room". So Q4 must be about *moral/commercial* liability ("Will the customer feel betrayed?").
      *(Refining Case 1)*: "Never" is a strong word. Even if technically true now, systems change. A flat claim implies permanence. This is a good place to force a "No".
      *(Refining Case 3)*: The user already said they wouldn't publish it. I need to make sure the procedure confirms this, but perhaps Case 1 is the one they *want* to publish but shouldn't. I will frame Case 1 as the one they *want* to say for reassurance, but the protocol blocks it.

