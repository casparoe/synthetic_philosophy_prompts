          *   Case 3 is also good (I want to sound confident).
          *   Let's ensure Case 1 fails the "Completeness" or "Commitment" test strongly.

  6.  **Addressing the "Mechanical Judgement" Warning:**
      *   Need to explicitly state where the procedure relies on human intuition (e.g., judging "harm", interpreting "misleading").
