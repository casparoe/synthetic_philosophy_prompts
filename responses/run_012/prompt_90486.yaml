          *   Needs a practical procedure (runnable in 20 mins, no lawyers).
          *   Must incorporate philosophical insights (truth, belief, knowledge) but make them operational.
          *   Must include specific decision points (questions, sufficient answers, stop conditions, alternatives).
          *   Must warn against mechanical thinking (where judgement is needed).
          *   Must test the procedure on three specific cases (one must result in a "no" against intuition).
          *   Must conclude with what the procedure *cannot* decide.
          *   **Language:** British English.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Truth:* Necessary but not sufficient (as the user noted, literal truth can mislead).
      *   *Belief:* Not enough (I can believe wrong things).
      *   *Knowledge:* The classic "Justified True Belief" (JTB). But Gettier problems exist. In a practical context, "Knowledge" implies high reliability and accountability.
      *   *Assertion Norms:* The "Knowledge Norm of Assertion" (you should only assert what you know) is the strongest candidate here. However, in a commercial support context, "Knowledge" needs to be defined as "Actionable Certainty within Context."
      *   *Gricean Maxims:* Quality (truth), Quantity (info needed), Relation (relevance), Manner (clarity). The user is worried about *Quality* and *Manner* (hedging).
      *   *Risk/Impact:* The stakes involve money and data. This adds an ethical/utilitarian layer. A flat claim creates an expectation of liability.

  3.  **Develop the Procedure (The "Assertion Protocol"):**
      *   *Goal:* A checklist that moves from epistemic status to practical consequence.
      *   *Step 1: Verification (Truth).* Is it factually accurate?
      *   *Step 2: Completeness (Misleadingness).* Does the literal truth omit a crucial caveat that changes the user's decision? (Addresses the user's concern about "false picture").
      *   *Step 3: Stability (Knowledge).* Is this stable knowledge or a snapshot? Can we guarantee it won't change before the user acts?
      *   *Step 4: Authority (Entitlement).* Do *we* have the right to guarantee this? (Distinction between observation and promise).
      *   *Step 5: Consequence (Harm).* If we are wrong, what is the cost to the user? (The "Money and Data" test).

      *   *Refining the "Stop" conditions:* If any step fails, you don't assert flatly. You hedge, quantify, or stay silent.
      *   *Refining the "Mechanical" warning:* Epistemology isn't an algorithm. The "sufficient answer" part requires human judgement.

  4.  **Drafting the Procedure (Iterative refinement for British English & Tone):**
      *   Tone: Professional, respectful, pragmatic, slightly formal but accessible.
      *   Structure: Introduction -> The Protocol -> The Warning -> The Test Cases -> The Limitations.

      *   *Drafting the Steps:*
          1.  *Correspondence:* Is it true?
          2.  *Implicature:* Will it mislead by omission?
          3.  *Warrant:* How do we know? (Evidence strength).
          4.  *Commitment:* Are we willing to be held to this? (The "Promise" test).

      *   *Let's tighten this to fit the "20 minutes" constraint.*
      *   *Name:* The "Flat Claim Protocol".
      *   *Q1: Truth.* (Easy).
      *   *Q2: Contextual Completeness.* (The "false picture" test).
      *   *Q3: Stability/Control.* (Can we ensure it stays true?)
      *   *Q4: Liability/Empathy.* (If this breaks, do we owe them remediation?)

  5.  **Running the Test Cases:**
      *   *Case 1: 'Your files are never shared outside the company'.*
          *   Truth: Technically true (maybe).
          *   Context: What about law enforcement? What about sub-processors?
          *   Control: Can you guarantee *never*?
          *   Result: Likely a "No" (needs hedging/legal nuance). This challenges the desire to reassure.
      *   *Case 2: Fix cures crash for 9/10 users.*
          *   Truth: Yes (based on data).
          *   Context: If stated flatly ("This fixes the crash"), the 1/10 feel lied to.
          *   Result: Needs quantification ("Fixes the crash for most users" or "90% of cases").
      *   *Case 3: Uptime ("Service will be up tomorrow").*
          *   Truth: Probabilistic.
          *   Control: External factors (AWS down, DDoS).
          *   Commitment: If you say "will", you owe SLA credit if it fails.
          *   Result: "No". Needs probability or "target".
      *   *Requirement:* At least one must come out against what the user *would like* to publish.
