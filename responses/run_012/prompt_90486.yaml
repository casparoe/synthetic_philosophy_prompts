answer: |-
  ### The Flat Claim Protocol

  You are operating under what philosophers call the **Knowledge Norm of Assertion**: one should only assert that *p* if one knows that *p*. However, in a commercial support context, 'knowledge' is not merely metaphysical; it is a promise of stability and a acceptance of liability. When you write flatly, you remove the cognitive load from the customer so they can act. If your certainty is misplaced, you have not just misinformed them; you have broken a social contract.

  The following procedure is designed to be run in under twenty minutes. It converts epistemic standards into operational checks. It is not a legal shield; it is a quality control mechanism for trust.

  #### The Procedure

  For any proposed sentence, ask the following four questions in order. If you answer **No** to any question, you may not publish the claim flatly. You must instead hedge, quantify, attribute, or remain silent.

  **1. The Correspondence Check (Truth)**
  *   **Question:** Is the statement factually accurate at this precise moment, according to our best available evidence?
  *   **Sufficient Answer:** Yes, verified by data, code, or direct observation. 'We think' or 'It should be' is insufficient.
  *   **Stop Condition:** If **No**, do not publish. Investigate further.

  **2. The Implicature Check (The 'False Picture' Test)**
  *   **Question:** If the customer acts on this sentence alone, without reading further, will they form a materially false belief about their risk or outcome?
  *   **Sufficient Answer:** No. The literal truth must match the pragmatic implication. (e.g., 'This button saves your work' implies it saves *all* your work immediately. If it saves only some, or later, the picture is false).
  *   **Stop Condition:** If **Yes** (they will be misled), you must add the missing context or hedge.

  **3. The Stability Check (Control)**
  *   **Question:** Is the state of affairs described within our direct control to maintain for the duration of the customer's reliance?
  *   **Sufficient Answer:** Yes. We can guarantee this will not change due to external factors (third-party APIs, legislation, market forces) without our active intervention.
  *   **Stop Condition:** If **No** (it depends on factors outside your control), you must attribute the claim or quantify the probability.

  **4. The Remedy Check (Liability)**
  *   **Question:** If this statement turns out to be wrong, are we willing and able to offer full remediation (refund, data recovery, compensation) without argument?
  *   **Sufficient Answer:** Yes. We accept that this statement functions as a warranty.
  *   **Stop Condition:** If **No** (we would argue it was 'just guidance' or 'best effort'), you must hedge. A flat claim is a promise; if you won't pay for the breakage, you cannot make the claim.

  ***

  #### The Human in the Loop: Where You Are Fooling Yourself

  This procedure is not an algorithm. It requires judgement at three specific pressure points. If you treat these as mechanical ticks, you will fail.

  1.  **Defining 'Materially False' (Question 2):** You may convince yourself that a technicality protects you. If a customer reads your flat claim and feels betrayed when things go wrong, your judgement on 'materiality' was wrong. Trust the feeling of betrayal, not the semantic defence.
  2.  **Estimating 'Duration of Reliance' (Question 3):** How long will the customer rely on this? A help article might be read for years. A status page update for hours. Do not assume a short shelf-life to pass the check.
  3.  **The 'Willingness' to Remediate (Question 4):** You might answer 'Yes' because you *could* pay, not because you *would*. Be honest. If your leadership would veto the refund, you cannot make the flat claim.

  ***

  #### Running the Protocol: Three Cases

  Here is the procedure applied to your specific examples.

  **Case 1: 'Your files are never shared outside the company.'**
  *   *Desire:* You want to publish this flatly to reassure anxious enterprise clients.
  *   **1. Correspondence:** **Yes.** Technically, your current architecture does not share files externally.
  *   **2. Implicature:** **No.** A customer will interpret 'never' as 'under no circumstances, ever'. They will not assume exceptions for legal subpoenas, security auditors, or cloud infrastructure providers (e.g., AWS staff accessing servers). The picture is false by omission.
  *   **3. Stability:** **No.** Your infrastructure or legal obligations may change in six months. 'Never' claims permanence you cannot control.
  *   **4. Remedy:** **No.** If a subpoena forces data sharing, you will not compensate the customer for the breach of this statement; you will cite the Terms of Service.
  *   **Verdict:** **DO NOT PUBLISH FLATLY.**
  *   **Alternative:** 'Your files are not shared outside the company for commercial purposes, except where required by law or infrastructure necessity.' (Hedge/Qualify).

  **Case 2: A fix that cures the crash for roughly nine users in ten.**
  *   *Desire:* You want to publish 'This fix resolves the crash' to encourage uptake.
  *   **1. Correspondence:** **Yes.** It resolves the crash for the majority.
  *   **2. Implicature:** **No.** 'Resolves the crash' implies a cure. The 10% who still crash will feel the statement was a lie. They have a false picture of their security.
  *   **3. Stability:** **Yes.** The code is deployed.
  *   **4. Remedy:** **No.** You will not refund the 10% who still experience the crash based on this statement alone.
  *   **Verdict:** **DO NOT PUBLISH FLATLY.**
  *   **Alternative:** 'This fix resolves the crash for most users (approx. 90%).' (Quantify).

  **Case 3: 'The service will be up tomorrow.'**
  *   *Desire:* You want to project confidence after a rough week.
  *   **1. Correspondence:** **No.** You cannot know the future. It is probabilistic, not factual.
  *   **2. Implicature:** **N/A** (Failed Q1).
  *   **3. Stability:** **No.** DDoS attacks, provider outages, or bugs are outside total control.
  *   **4. Remedy:** **No.** You likely have an SLA that credits downtime, but you would not treat a status page prediction as a binding warranty of 100% availability.
  *   **Verdict:** **DO NOT PUBLISH FLATLY.**
  *   **Alternative:** 'We expect full service availability tomorrow.' or 'Target uptime: 99.9%.' (Attribute/Quantify).

  *Note: In Case 1, the protocol blocks the statement you most *want* to make for reassurance. This is the correct function of the protocol. Reassurance built on a claim you cannot sustain is not trust; it is fragility.*

  ***

  #### What the Procedure Cannot Decide

  This protocol is a filter, not a generator. It protects you from making false promises, but it cannot tell you:

  1.  **The Tone of Empathy:** It can tell you not to say 'The system is fixed', but it cannot tell you how to acknowledge the frustration of the users who suffered. That requires moral imagination, not epistemic checking.
  2.  **Strategic Silence:** Sometimes the truth is accurate, stable, and warrantable, but publishing it causes panic (e.g., 'We found a vulnerability but patched it before exploitation'). The protocol says 'Yes', but prudence may say 'Silence'.
  3.  **The Value of Hope:** In a crisis, a hedged statement ('Service may be restored') can be demoralising. A flat claim ('Service is restoring') can be galvanising, even if slightly premature. The protocol prioritises accuracy over morale. You must decide when morale is the higher ethical priority, knowing you are stepping outside the safety of the protocol.

  You are the guardian of your customers' reality. Use the protocol to ensure the reality you write is one they can safely inhabit.
