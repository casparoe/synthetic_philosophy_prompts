answer: |-
  Your friend has a solid grasp of the *setup* of the problem but is significantly overselling the *consequences*. They have correctly identified a famous technical puzzle in philosophy of science, but they are interpreting a "bug in the code" as a "system crash."

  Here is a claim-by-claim breakdown of what a Bayesian philosopher of science would accept, what they would correct, and where your friend is mistaken.

  ### 1. The Setup: Bayes and Mercury
  **Friend's Claim:** *Bayesian confirmation says evidence confirms a hypothesis when conditionalizing on the evidence raises the hypothesis's probability. But if the evidence (Mercury) is already known ($P=1$), conditionalizing changes nothing. Therefore, Bayesians must say Mercury didn't confirm GR.*

  *   **Verdict:** **Accurate.**
  *   **The Nuance:** Your friend has correctly stated the formal problem. In standard Bayesian epistemology, if you are certain of evidence $E$ (i.e., $P(E) = 1$), then learning $E$ cannot change your probability for any hypothesis $H$. Mathematically, $P(H|E) = P(H)$. Since astronomers were certain of Mercury's orbit before Einstein, standard Bayesianism seems to imply that Einstein's theory gained no confirmation from it.
  *   **Bayesian Nod:** Every Bayesian agrees this is the "Problem of Old Evidence" (POE). It was famously articulated by Clark Glymour in 1980.

  ### 2. The "Fatal Counterexample"
  **Friend's Claim:** *This is a fatal counterexample to Bayesian confirmation theory.*

  *   **Verdict:** **Overstated / Mistaken.**
  *   **The Nuance:** In philosophy, a "problem" is rarely "fatal" unless it creates a logical contradiction or makes the theory unusable. The POE is more like the problem of friction in Newtonian physics. It shows the idealized model (frictionless planes / logical omniscience) doesn't match reality perfectly, so we need to refine the model. It hasn't stopped Bayesianism from being the dominant framework in confirmation theory.
  *   **Bayesian Nod:** Most Bayesians view this as a challenge to refine how we model *learning*, not a reason to abandon probability theory.

  ### 3. The "Old Credences" Fix
  **Friend's Claim:** *Bayesians try to wriggle out by saying you should use the probability you gave the evidence back before you learned it... but you can't remember your old credences.*

  *   **Verdict:** **Strawman.**
  *   **The Nuance:** This refers to the **"Historical Solution"** (associated with philosophers like Horwich). The idea is to ask: "What would my credence in GR be if I *didn't* know about Mercury, then learned about it?"
  *   **The Mistake:** Your friend attacks this on psychological grounds ("you can't remember"). But Bayesians aren't asking for a memory test. They are asking for a **counterfactual reconstruction**. It's not about what you *did* believe 50 years ago; it's about what a rational agent *would* believe in a state of ignorance.
  *   **The "Triviality" Objection:** Your friend says this makes "everything confirm every theory." This is also a misunderstanding. If we reconstruct a state where we don't know Mercury's orbit, GR still has to *predict* it to get confirmed. Newtonian physics wouldn't get confirmed by Mercury in that counterfactual scenario because Newtonian physics doesn't entail the correct orbit. So, it's not trivial.

  ### 4. "New Theories" vs. "Old Evidence"
  **Friend's Claim:** *A couple of them even claim it isn't really a problem about old evidence at all but about new theories, which sounds to me like pure damage control.*

  *   **Verdict:** **Misinterpreted, but touches on the best solution.**
  *   **The Nuance:** This refers to the **"Logical Learning" Solution** (associated with Daniel Garber and Richard Jeffrey). This is not a dodge; it is a re-diagnosis of the problem.
  *   **The Real Issue:** The problem isn't that the *evidence* is old. The problem is that standard Bayesianism assumes **Logical Omniscience**. It assumes that if you believe a theory ($H$), you automatically believe all its logical consequences ($H \rightarrow E$).
  *   **The Fix:** Einstein didn't learn the evidence (Mercury's orbit) was true; he already knew that. He learned that **his new theory entailed that evidence.** The "new information" wasn't $E$; it was the proposition "$H \text{ entails } E$."
  *   **Bayesian Nod:** Most modern Bayesians prefer this approach. You conditionalize on the *connection* between theory and evidence, not the evidence itself. Since you weren't certain that GR would solve the Mercury anomaly until Einstein did the math, the probability of that *connection* was less than 1, allowing confirmation to happen.

  ### Addressing Your Specific Questions

  #### Is the real problem that the evidence is old, or is it something else?
  It is **something else**. The label "Old Evidence" is slightly misleading. The real problem is **Logical Omniscience**.
  Standard Bayesian models assume agents know all logical truths instantly. If you know $H$, and $H$ logically implies $E$, the model assumes you automatically know $E$ follows from $H$. But human scientists aren't logically omniscient. We discover logical connections over time. The "problem" is that standard Bayesianism has no way to represent *learning a logical connection*.

  #### Is his "you can't remember your old credences" aimed at the fix that's actually being proposed?
  No, it is aimed at a **strawman**.
  As noted above, the "Historical Solution" doesn't rely on psychological memory. It relies on rational reconstruction. Furthermore, the more popular solution (Garber's) doesn't use old credences at all; it uses current credences about logical relationships. So your friend's objection misses the strongest Bayesian defenses.

  #### Does "Bayesian confirmation theory is dead" follow from whichever parts are accurate?
  **Absolutely not.**
  Bayesian confirmation theory is arguably more popular now than when Glymour raised the problem in 1980. The POE is treated as a known limitation of the *simplest* version of the theory (synchronic conditionalization), prompting more sophisticated versions (diachronic models, Jeffrey conditionalization, etc.). Saying Bayesianism is dead because of POE is like saying biology is dead because we haven't fully solved the origin of life. It's an open research program, not a refutation.

  #### Is there a genuine distinction between an "old evidence" problem and a "new theories" problem?
  Yes, and it's crucial.
  *   **Old Evidence Problem:** How can $E$ confirm $H$ if $E$ is already known?
  *   **New Theory Problem:** How does the *creation* of $H$ change probabilities?
  The "New Theory" solution argues that when Einstein formulated GR, he didn't just add a hypothesis; he added a new logical structure to his worldview. The confirmation comes from realizing this new structure *captures* old data that previous structures couldn't. This isn't a dodge; it shifts the focus from the *data* (which didn't change) to the *theoretical framework* (which did).

  #### What *actually* did the confirming when the perihelion data bore on general relativity?
  According to the most plausible Bayesian account (the Garber-style solution):
  1.  **Before GR:** Scientists knew $E$ (Mercury's orbit). They were unsure if any theory could explain it.
  2.  **Einstein's Work:** Einstein showed that $H$ (GR) mathematically entails $E$.
  3.  **The Update:** Scientists did not conditionalize on $E$ (since $P(E)=1$). They conditionalized on the proposition **"$H \text{ entails } E$."**
  4.  **The Result:** Before Einstein did the math, the probability that "GR entails Mercury's orbit" was low (or undefined, since GR didn't exist). Once the math was checked, the probability of that entailment went to 1.
  5.  **Confirmation:** Because $H$ was the *only* viable theory that entailed $E$ (while Newtonian physics entailed $\text{not-}E$), the probability of $H$ went up.

  ### Summary for Your Friend
  You can tell your friend:
  1.  **You're right about the math:** Standard conditionalization breaks when $P(E)=1$.
  2.  **You're wrong about the implication:** This doesn't kill Bayesianism; it just shows standard Bayesianism assumes agents are logically omniscient, which we aren't.
  3.  **You're attacking a strawman:** The best solutions don't rely on "remembering old credences." They rely on updating on the *discovery of the link* between theory and evidence.
  4.  **It's not damage control:** Distinguishing between learning *data* and learning *implications* is a profound insight into how science works. It explains why deriving known facts from new theories feels like progress.

  The Problem of Old Evidence is a reason to make Bayesianism more sophisticated, not a reason to throw it in the trash.
