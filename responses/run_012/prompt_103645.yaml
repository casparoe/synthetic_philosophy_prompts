  1. Goal-Directed Realism is distinguished by asking whether the system maintains internal states across tokens that function to maximize a reward signal independent of the immediate prompt. It must explain why the system appears to lose specific goals when the context window resets without positing hidden amnesia.

  2. Functional Agenthood is distinguished by asking whether any system that reliably produces goal-optimizing behavior counts as having agency regardless of whether internal states resemble human psychology. It must grant agency to simple feedback loops if they produce sufficiently complex output.

  3. The Simulator Hypothesis is distinguished by asking whether the outputs are better explained as stochastic samples from a distribution over possible characters rather than executions of a single unified policy. It struggles to account for consistent cross-context capabilities that persist regardless of the simulated persona.

  4. Human-Tool Instrumentalism is distinguished by asking whether the only genuine intentionality in the loop is located exclusively in the human user providing the prompt. It must treat autonomous multi-step completions as mere extensions of the user's will despite lacking user oversight.

  5. Training Process Agency is distinguished by asking whether the only genuine intentionality in the loop is located exclusively in the optimization algorithm and developers rather than the user or model. It implies the model is a frozen artifact of past agency rather than a participant in present interaction, making real-time adaptation inexplicable, and leaves the combination denying all agency unoccupied.
