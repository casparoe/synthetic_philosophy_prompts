  "The position, restated"
  Coherent Extrapolated Volition (CEV) posits that AI alignment should target not our current desires, but our idealized volition: what we would want given perfect information, enhanced cognition, and reflective equilibrium among humanity. This distinguishes it from actual-preference aggregation, which amplifies ignorance and conflict; from fixed objective morality, which imposes external values unrelated to human psychology; and from designer values, which restricts authority to a privileged few. CEV claims to solve the "wrong wish" problem (we often want things harmful to us) without the "alien imposition" problem (objective morality feels external). It asserts normative authority based on a counterfactual continuity of selfhood: the idealized self is still *us*, just better. The view relies on three pillars: that idealization tracks value better than actuality (Idealization), that conflicting desires can be resolved into a consistent set (Coherence), and that this resulting set binds our current selves (Authority).

  "Defeaters, from fatal to awkward"
  **Fatal Defeaters**
  1.  **The Indeterminacy Objection (Targets 2 & 3):** There is no unique function for "idealization." Different plausible extrapolation algorithms (e.g., weighting rationality vs. empathy differently) yield divergent, internally coherent fixed points. If multiple CEVs exist, the choice among them is arbitrary fiat by the programmer, collapsing CEV into the designer-values rival it sought to avoid. *Survival Condition:* Must prove convergence across all admissible idealization functions. Without this, the "Coherence" commitment is an illusion.
  2.  **Collapse into Moral Realism (Targets 3):** If idealized preferences converge, it may be because they track mind-independent moral truths, not because of volitional coherence. If so, CEV is redundant; we should just target the truth directly. If they don't track truth, their authority is unjustified. *Survival Condition:* Must explain normative force without appealing to external moral facts. This is difficult because if convergence isn't truth-driven, it looks like accidental agreement.

  **Serious Defeaters**
  3.  **The Estrangement Objection (Targets 1 & 3):** Thorough extrapolation may produce preferences unrecognizable to current humans (e.g., post-human values). If psychological continuity is broken, the "Authority" commitment fails: why should *I* obey a stranger who shares my origin but not my identity? This places CEV in a dilemma: stop extrapolation early (retaining bias) or continue (losing authority). *Survival Condition:* Must define a threshold of identity preservation compatible with significant cognitive enhancement. If the extrapolated self is too different, the contract of selfhood is void.
  4.  **Impossibility of Coherence (Targets 2):** Formal social choice theory (e.g., Arrow's Impossibility Theorem) suggests aggregating diverse preferences into a consistent ordering is mathematically impossible without dictatorship. Idealization may not escape this; conflicting fundamental values might remain inconsistent even under perfect reflection. *Survival Condition:* Must show idealization dissolves conflicts rather than aggregating them. If values are fundamentally incommensurable, no amount of thinking resolves them.

  **Awkward Consequences**
  5.  **The Idealization Parameter Problem (Targets 1):** Defining "more the people we wish we were" requires a prior value judgment. Who decides which traits are improvements? This smuggles designer values into the idealization function. *Survival Condition:* Must derive idealization parameters from actual preferences without circularity.
  6.  **Dynamic Inconsistency (Targets 3):** Idealized selves might want to modify their own values further. A static CEV target freezes moral growth, violating the spirit of extrapolation. *Survival Condition:* Must allow for open-ended value evolution.

  The Indeterminacy objection is a real defeater, not an artifact; it strikes at the coherence commitment's feasibility. The Estrangement objection is also real; it challenges the authority commitment's grounding in identity. Both suggest CEV may be an empty set or a disguised rival. These are not setup artifacts but inherent tensions in combining idealization with authority.

  "What the defender concedes"
  A committed proponent must concede that CEV is not a computable algorithm but a regulative ideal. They should admit the Indeterminacy risk: there may be multiple coherent extrapolations, requiring a meta-choice that CEV itself cannot justify. They must also concede the Estrangement point: the output will likely be alien to current humanity. Conceding this is costly. It undermines the claim that CEV uniquely solves the authority problem; if the output is alien, authority rests on the *process* (realism) rather than the *volition* (internalism). However, conceding these points preserves CEV as a directional heuristic rather than a precise target. It shifts the view from "compute the unique solution" to "minimize divergence from plausible idealizations." This saves the view from falsification but reduces its utility for specific alignment engineering. The proponent must accept that CEV does not eliminate political philosophy; it merely automates the execution of a contested ideal. It becomes a method for negotiating value conflicts rather than dissolving them, which weakens the Coherence commitment but strengthens practical viability. Ultimately, the defender must admit CEV is a promise of legitimacy, not a guarantee of safety.

  "Where the view is insulated"
  The view is heavily insulated against empirical falsification. Because the target is counterfactual ("what we *would* want"), no current observation can refute a claim about CEV. Any output the AI produces can be retroactively justified as "what you would have wanted if you understood." This risks unfalsifiability: if every outcome is compatible with CEV, the theory constrains nothing. However, this insulation may be an acceptable feature of a normative regulative ideal rather than a scientific hypothesis. Normative theories often lack empirical truth conditions. The defect arises only if CEV is marketed as a safety guarantee. If it is merely a philosophical compass, insulation is expected. But for alignment, where false positives are catastrophic, insulation is dangerous. It allows proponents to claim success regardless of the outcome, masking potential value lock-in or distortion. The view protects its core by making the target inaccessible until it is too late to check. This insulation transforms CEV from a testable alignment strategy into a faith-based commitment to the benevolence of the extrapolation process itself. We cannot verify the target until the weapon is fired.

  "Verdict, confidence, and residual doubt"
  **Verdict:** CEV is philosophically robust but practically precarious. It successfully identifies the tension between current ignorance and external imposition but fails to guarantee a unique, authoritative solution.
  **Confidence:** I am highly confident that the Indeterminacy objection poses a fatal structural risk unless convergence is proven. I am moderately confident that Estrangement undermines the specific claim to *volitional* authority, pushing the view toward realism.
  **Residual Doubt:** My least certain point is whether "coherence" is even the correct goal. If human value is essentially pluralistic and conflicting, forcing coherence (Commitment 2) might be the error, not the solution. CEV assumes conflict is a bug of ignorance; if conflict is a feature of value, CEV destroys what it aims to save. This suggests the Coherence commitment itself may be the weakest link, potentially requiring a shift to "Coexisting Extrapolated Volitions" rather than a singular coherent set. The view may be solving a problem that doesn't exist while creating one that does.
