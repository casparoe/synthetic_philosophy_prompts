prompt: |-
  I'm in a reading group on causation and before we read another paper I want the spec sheet, not another theory. So pretend you're a philosopher of science who works on causal modeling and counterfactuals and who actually knows the difference between whats settled and whats just one camp's house style. Think it through before you write — maybe start by brainstorming the cases that always get thrown around (preemption, late preemption, overdetermination, double prevention, switching, omission, causation by omission, trumping, transitive causation, cause vs mere condition, token vs type) and then build the list, don't just dump the cases.

  What I want is the desiderata: what does any theory of causation have to deliver to count as adequate — which cases it has to get right (and what the case is doing, i.e. which intuition it's protecting), which distinctions it must not collapse (cause vs condition, cause vs correlation, the strength/degree stuff, actual vs hypothetical, singular vs general), which results from elsewhere it can't contradict (the stuff about determinism and indeterminism, whether causation needs laws, the fact that we can't intervene on the past, whatever you think is genuinely binding here). For each requirement say why it's a requirement and not just a prejudice of one camp.

  Then the part I actually care about: is any subset of these jointly unsatisfiable? I suspect the counterfactual people and the interventionist people are quietly trading one desideratum for another and neither of them says so out loud. If theres a pair that can't both be met, say which and what the trade is.

  Two things I want it to handle that I never see in the standard lists, so I'm making you take a position on them:

  (a) determinable vs determinate causation: the vase breaks because it's red, or because it's crimson — which one is the cause, and does a theory have to decide, or is that a false choice?

  (b) here's a case I made up in the shower: two switches on the wall, each wired to the light, and there's a hidden mechanical link so that pushing either one physically pushes the other too, so in the actual world both go down together. Nothing distinguishes them — no asymmetry in the wiring, no timing difference, no counterfactual difference between them. The light comes on. Did switch 1 cause it, switch 2, both, or neither? I want to know what each family of theory is forced to say and whether the case is a genuine counterexample or just symmetric overdetermination with extra steps.

  At the end tell me which single requirement does the most work — knocks out the most contenders — and be honest about which of these requirements are things everyone in the area definately agrees on versus things that are just one tradition's commitment. Don't sell me a contested view as the consensus; flag where the disagreement actually lives. Skip the scorecard of particular authors, I'll do that in the group.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of science specializing in causal modeling and counterfactuals (knowledgeable, pragmatic, distinguishes settled vs. contested).
      *   **Task:** Create a "spec sheet" (desiderata) for a theory of causation.
      *   **Constraints:**
          *   Do not just list theories; list requirements.
          *   Brainstorm standard cases first (preemption, etc.) to build the list.
          *   Identify distinctions that must not be collapsed.
          *   Identify external constraints (physics, logic, etc.).
          *   Explain *why* each is a requirement, not just a camp prejudice.
          *   **Crucial:** Identify jointly unsatisfiable subsets (trade-offs).
          *   **Specific Cases:** Address (a) Determinable vs. Determinate causation (Red/Crimson vase) and (b) The "Linked Switches" case (symmetric, physically linked switches).
          *   **Conclusion:** Identify the single most demanding requirement and flag consensus vs. contention.
          *   **Tone:** Professional, direct, no fluff, no scorecard of authors.

  2.  **Brainstorming & Structuring the Desiderata:**
      *   *Standard Cases:* Preemption (early/late), Overdetermination, Omission, Transitivity, Switching.
      *   *Distinctions:* Cause/Condition, Cause/Correlation, Token/Type, Actual/Potential.
      *   *External Constraints:* No backward causation, compatibility with physics (deterministic/indeterministic), asymmetry.
      *   *Structure:*
          1.  Intro (Setting the stage).
          2.  The Desiderata List (Categorized: Intuitions, Structural, Metaphysical/Physical).
          3.  The Trade-offs (Incompatibilities).
          4.  The Specific Cases (Determinables & Linked Switches).
          5.  The "Killer" Requirement & Consensus Check.

  3.  **Drafting the Desiderata (Iterative refinement):**
      *   *Requirement 1: Asymmetry.* Causation isn't symmetric. If A causes B, B doesn't cause A. Why? Thermodynamics/Agency.
      *   *Requirement 2: Distinction from Correlation.* Common causes shouldn't look like direct causes. Why? Prediction vs. Control.
      *   *Requirement 3: Handling Preemption.* Must distinguish actual cause from backup cause. Why? Intuition about efficacy.
      *   *Requirement 4: Omissions.* Must handle absences without exploding causation. Why? Legal/Moral practice relies on it, but "not watering plants" causes death is tricky.
      *   *Requirement 5: Transitivity (maybe optional?).* Chain A->B->C implies A->C? Contested. I should flag this as contested, not settled.
      *   *Requirement 6: Determinism/Indeterminism Neutrality.* Should work in both regimes. Why? Physics isn't settled on determinism.
      *   *Requirement 7: No Backward Causation.* Causes precede effects. Why? Empirical consensus.

  4.  **Identifying Trade-offs (The "Meat"):**
      *   *Transitivity vs. Preemption/Omission:* If you allow transitivity strictly, you get weird results with omissions (my not being born caused the war) or switching cases.
      *   *Intrinsicality vs. Counterfactual Dependence:* Lewis wanted intrinsicality (processes), but counterfactuals depend on extrinsic background conditions.
      *   *Omissions vs. Locality:* If omissions are causes, causation isn't a physical flow. This clashes with process theories.
      *   *Interventionism vs. Reductionism:* Interventionism assumes causation to define causation (circularity charge) vs. providing analysis.
      *   *The big one:* **Completeness vs. Selectivity.** A theory can describe the whole causal field (all conditions) or select *the* cause. Most theories try to do both and fail.

  5.  **Addressing the Specific Cases:**
      *   *(a) Determinable vs. Determinate (Red/Crimson):*
          *   Problem: If Crimson causes Break, does Red? If both, overdetermination? If only one, which?
          *   Interventionist view: Manipulate Red (keep Crimson constant? Impossible). Manipulate Crimson (Red varies automatically).
          *   Trade-off: Proportionality constraint (Yablo) vs. Actual Causation.
          *   Verdict: A theory needs a "Proportionality" desideratum to handle this, but it conflicts with "Minimal Sufficiency."
      *   *(b) Linked Switches:*
          *   Setup: Switch 1 & 2 physically linked. Push 1 -> 2 moves. Light on.
          *   Symmetric Overdetermination? No, because they aren't independent.
          *   Counterfactuals: If not 1, then not 2 (due to link), so light off. 1 is a cause. Same for 2.
          *   Process: Energy flows from both? Or just one mechanism?
          *   Interventionist: Can you intervene on 1 without 2? If the link is mechanical and internal to the system, maybe not. If you break the link to intervene, you change the system.
          *   Verdict: This tests the *independence* assumption in causal modeling. If variables aren't independent, standard DAGs break. It's a challenge for the *representation*, not just the theory.

  6.  **Refining the "Killer Requirement":**
      *   What knocks out the most contenders?
      *   Is it Asymmetry? No, most handle that.
      *   Is it Preemption? Early counterfactual theories failed here.
      *   Is it **Omissions + Locality**? This is the big tension. If causation is physical transfer, omissions aren't causes. If omissions are causes, causation isn't purely physical transfer.
      *   Actually, the strongest filter is **Selectivity (The Cause vs. Condition distinction)**. Almost every theory struggles to explain why we pick *the* cause out of the set of necessary conditions without appealing to pragmatics (which threatens objectivity).

  7.  **Review against Constraints:**
      *   *Don't sell contested views as consensus:* Flag Transitivity. Flag Omissions.
      *   *Think before writing:* Ensure the distinction between "spec sheet" and "theory review" is maintained.
      *   *Tone:* Philosophical but grounded.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* I initially thought about making Transitivity a hard requirement. But the prompt asks me to distinguish settled vs. house style. Transitivity is definitely *not* settled (McDermott's dog bite case). I must list it as a *point of contention* or a requirement that many *want* but might have to drop. Better to frame the requirement as "Account for the limits of transitivity."
      *   *Correction on Linked Switches:* I need to be careful. If they are mechanically linked, are they distinct events? If they are distinct events that are nomologically necessarily co-occurring, standard SEMs (Structural Equation Models) struggle because they assume modularity (you can wiggle one without the other). This is a deep technical point about the *variables*, not just the causation. I need to highlight that.
      *   *Correction on Determinables:* This is the "Proportionality" constraint. I need to state clearly that standard counterfactual theories often fail this without modification.

  9.  **Finalizing the Output Structure:**
      *   Preamble: The "Spec Sheet" approach.
      *   Section 1: The Non-Negotiables (Consensus).
      *   Section 2: The Hard Cases (Test Suite).
      *   Section 3: The Trade-Offs (Incompatibilities).
      *   Section 4: The Two Specific Cases (Red/Crimson & Linked Switches).
      *   Section 5: The Killer Requirement & Consensus Map.

  10. (Mental Check of the Linked Switch Case): If Switch 1 moves Switch 2, then 1 causes 2. 1 causes Light. 2 causes Light. Is it overdetermination? No, because the paths aren't independent. It's a chain 1->2->Light AND 1->Light. But if the link is such that they move *together* (common mechanism), maybe it's one event described twice? I will treat it as a challenge to the *independence of variables* assumption in causal modeling.

  11. (Mental Check of Determinables): Yablo's proportionality is the standard fix. But does it conflict with "actual causation"? Yes, sometimes the specific cause is actual, but the general is proportional. I need to highlight this tension.

  12. (Final Polish on Tone): Ensure I sound like a colleague, not a textbook. Use phrases like "Here's the rub," "The dirty secret," etc.

  *(Self-Correction during final review)*: Make sure I explicitly answer "is any subset jointly unsatisfiable?" Yes, I need to be explicit about the triangle of: (1) Omissions are causes, (2) Causation is physical/local, (3) Causation is objective. You can usually only pick two.

  Let's write it.cw
answer: |-
  Here is the spec sheet. I've stripped out the history of the debate and focused on the functional requirements. If a theory of causation is a tool, these are the tolerances it must meet to be usable in science and law.

  ### Part 1: The Desiderata (The Spec Sheet)

  I have categorized these into **Structural Constraints** (logic/math), **Empirical Constraints** (physics/science), and **Intuitive Constraints** (folk/legal usage). I have flagged where consensus ends and camp loyalty begins.

  #### A. Structural Constraints (Logic & Modeling)
  1.  **Asymmetry:** If $C$ causes $E$, $E$ does not cause $C$ (in the same respect/time).
      *   *Why:* Causal explanation is directional. If theories allow symmetry, they collapse into mere correlation.
      *   *Status:* **Consensus.** (Except for specific time-symmetric physics interpretations, which are minority views in causal modeling).
  2.  **Distinctness:** Causes and effects must be distinct events/variables.
      *   *Why:* To avoid trivialities (e.g., "The presence of H2O caused the presence of water").
      *   *Status:* **Consensus.**
  3.  **Modularity (Intervention Independence):** It must be possible in principle to represent the system such that one variable can be changed without automatically changing others (unless via the causal link).
      *   *Why:* This is the backbone of Structural Equation Modeling (SEM). If you can't wiggle $C$ without wiggling $B$ (where $B$ is not an effect of $C$), you can't identify the causal structure.
      *   *Status:* **Consensus among modelers,** but metaphysically contested (see Linked Switches below).

  #### B. Empirical Constraints (Physics & Science)
  4.  **No Backward Causation:** Causes must not precede effects in time (in the actual world).
      *   *Why:* Violates thermodynamic arrow and standard scientific practice.
      *   *Status:* **Consensus.**
  5.  **Neutrality on Determinism:** The theory must function in both deterministic and indeterministic worlds.
      *   *Why:* We do not know if our universe is deterministic. A theory of causation that breaks under quantum mechanics is scientifically useless.
      *   *Status:* **Consensus.**
  6.  **Compatibility with Conservation Laws:** If the theory posits a "process" or "transmission," it cannot violate conservation of energy/momentum.
      *   *Why:* Physicalist constraints.
      *   *Status:* **Consensus for physicalist theories;** Interventionists often waive this (see Trade-offs).

  #### C. Intuitive Constraints (The Test Suite)
  *These are the cases the theory must output the correct verdict on, matching stable human/legal intuition.*

  7.  **Preemption (Early & Late):** Must distinguish the actual cause from the backup cause that was ready to fire but didn't.
      *   *Why:* In late preemption (Suzy throws, Billy holds back), the effect does *not* counterfactually depend on the cause (if Suzy hadn't thrown, Billy would have). A theory that says "no cause" here fails.
      *   *Status:* **Consensus requirement.** (How to solve it is the war).
  8.  **Overdetermination:** Must handle cases where two sufficient causes occur (two shooters).
      *   *Why:* Intuition says both are causes, even if neither is necessary (no counterfactual dependence).
      *   *Status:* **Consensus requirement.**
  9.  **Omission:** Must account for causation by absence (e.g., "not watering the plant caused it to die").
      *   *Why:* Legal and moral practice relies on this.
      *   *Status:* **Highly Contested.** (See Trade-offs).
  10. **Selectivity (Cause vs. Condition):** Must distinguish *the* cause from the background conditions (e.g., "The spark caused the fire," not "The oxygen caused the fire").
      *   *Why:* Explanation requires selection. If everything necessary is "the cause," the concept loses explanatory power.
      *   *Status:* **Consensus requirement,** but **no consensus on how to achieve it objectively.**

  ---

  ### Part 2: The Trade-Offs (Jointly Unsatisfiable Subsets)

  You suspected people are trading desiderata silently. You are right. There is a "Trilemma" here. You cannot satisfy all three of the following simultaneously without appealing to pragmatics (context/interest).

  **The Trilemma:**
  1.  **Omissions are Causes:** (e.g., The doctor's *not* injecting the antidote caused the death).
  2.  **Causation is Local/Physical:** (Causation involves a physical process/flow in spacetime).
  3.  **Causation is Objective:** (It doesn't depend on human interests/context).

  **The Trade:**
  *   **Process Theories (Salmon/Dowe):** Keep (2) and (3). **Drop (1).** They say omissions are *not* causes. There is no physical flow from a non-event. This satisfies physics but breaks legal/moral intuition.
  *   **Counterfactual/Interventionist (Lewis/Woodward):** Keep (1) and (3). **Drop (2).** They allow omissions as causes because counterfactual dependence holds. But this makes causation "spooky" (action at a distance/no physical link) and leads to the "problem of profligate causes" (my not watering the plant causes its death, but so does the Queen of England's not watering it).
  *   **Pragmatic/Contextualist:** Keep (1) and (2). **Drop (3).** They say omissions are causes *relative to a norm or expectation*. This saves intuition and physics but makes causation subjective (dependent on what we *expected* the doctor to do).

  **Another Hard Trade: Transitivity vs. Omission**
  *   If you insist on **Transitivity** ($A \to B \to C$ implies $A \to C$) and you allow **Omissions**, you get absurd results.
      *   *Case:* I don't plant a bomb ($A$). This causes you to stay home ($B$). You staying home causes you to miss the accident ($C$). Did my not planting the bomb cause you to miss the accident? Transitivity says yes. Intuition says no.
      *   *Verdict:* Most modern theories (including Woodward) **drop strict Transitivity** to save the Omission/Preemption handling.

  ---

  ### Part 3: The Two Specific Cases

  Here is where the spec sheet gets stress-tested.

  #### (a) Determinable vs. Determinate (The Red/Crimson Vase)
  *Case:* Vase breaks because a red ball hit it. Was it the *redness* or the *crimsonness*?
  *   **The Problem:** If Crimson causes Break, and Red is just a determinable of Crimson, does Red also cause Break? If yes, we have systematic overdetermination. If no, which one is the *real* cause?
  *   **Standard Counterfactual Theory:** Fails. If the ball weren't crimson, it might still be red (scarlet) and break the vase. So Break doesn't depend on Crimson. If the ball weren't red, it wouldn't break. So Red wins. But Crimson is the specific physical property.
  *   **Interventionist Theory:** Struggles with "holding fixed." You can't intervene on Redness while holding Crimsonness fixed (impossible). You can intervene on Crimsonness while holding Redness fixed (change crimson to scarlet).
  *   **The Requirement:** A theory needs a **Proportionality Constraint** (Yablo). The cause must be specific enough to guarantee the effect, but general enough not to be swamped by irrelevant details.
  *   **Verdict:** A theory *must* decide this, or it admits it cannot handle variable granularity. Most causal modeling (SEM) ignores this by fixing variables at the start. A complete theory must explain *why* we chose the variable "Color = Red" rather than "Wavelength = 650nm."
  *   **My Position:** This isn't a false choice. It's a constraint on **variable selection**. A theory that doesn't include a rule for variable individuation (like Proportionality) is incomplete. The "Red" cause is usually the correct one for explanation; "Crimson" is too specific.

  #### (b) The Linked Switches (Your Shower Case)
  *Case:* Switch 1 and Switch 2. Mechanical link ensures they move together. Light turns on.
  *   **Analysis:** This is **not** standard symmetric overdetermination. In standard overdetermination (two shooters), the causes are independent. Here, they are nomologically linked.
  *   **Causal Modeling (SEM) Failure:** Standard DAGs assume the **Causal Markov Condition** and **Modularity**. Modularity says you can intervene on $S1$ without changing $S2$ unless $S1$ causes $S2$.
      *   If $S1$ causes $S2$ (via the link): Then $S1 \to S2 \to Light$ and $S1 \to Light$. $S1$ is a cause. $S2$ is an intermediate cause.
      *   If $S1$ and $S2$ are effects of a Common Cause (the mechanism pushing both): Then $Mech \to S1$, $Mech \to S2$. $S1$ and $S2$ are correlated but neither causes the light *independently* of the mechanism.
      *   If they are mutually dependent (simultaneous equation): Standard SEMs break.
  *   **What the theories are forced to say:**
      *   **Counterfactual:** If $S1$ hadn't gone down, $S2$ wouldn't have (due to link). So Light wouldn't be on. $S1$ is a cause. Same for $S2$. Verdict: **Both.**
      *   **Process:** Energy flows from both contacts? If the link is mechanical, energy flows through the link. Verdict: **Both** (or the Mechanism).
      *   **Interventionist:** Can you intervene on $S1$ without $S2$? If the link is internal to the system definition, **No.** If you break the link to intervene, you have changed the causal structure.
  *   **Verdict:** This is a **genuine counterexample to the Modularity Assumption** in causal modeling. It shows that "variables" in a causal model must be *independently manipulable*. If your ontology includes entities that are necessarily co-occurring (due to laws or mechanics), you cannot model them as distinct nodes in a standard DAG without violating the independence assumption.
  *   **Requirement:** A theory must specify **Variable Independence**. If two putative causes cannot be separated even by ideal intervention, they are likely descriptions of the *same* causal factor, not two causes. The theory should force you to model "The Switch Mechanism" as one variable, not two.

  ---

  ### Part 4: The Killer Requirement & Consensus Map

  #### The Single Requirement That Does The Most Work
  **Selectivity (The Cause vs. Condition Distinction).**

  This is the filter that kills the most theories.
  *   **Regularities (Hume):** Fail. Oxygen is as regular a condition as the spark.
  *   **Simple Counterfactuals:** Fail. The oxygen is necessary (in most worlds), so it counts as a cause.
  *   **Process Theories:** Fail. Oxygen transmits energy/momentum just as the spark does.
  *   **Interventionism:** Only succeeds by smuggling in pragmatics (what *we* can manipulate).

  If a theory cannot explain why we cite the spark and not the oxygen without appealing to "what the speaker is interested in," it fails to capture the *explanatory* role of causation. It reduces causation to "necessary conditions," which is too broad to be useful.

  #### Consensus vs. Contention Map

  | Requirement | Consensus Status | Where the Disagreement Lives |
  | :--- | :--- | :--- |
  | **Asymmetry** | **Settled.** | Only in fringe time-symmetric physics. |
  | **No Backward Causation** | **Settled.** | Except in specific time-travel thought experiments. |
  | **Preemption Handling** | **Settled (as a goal).** | Everyone agrees a theory *must* solve it. They disagree on *how* (traces vs. counterfactuals vs. equations). |
  | **Omissions** | **Contested.** | Physicalists say No; Interventionists say Yes. This is the biggest fault line. |
  | **Transitivity** | **Contested.** | Many (Woodward, Hitchcock) now reject it to save Omission/Preemption handling. |
  | **Objectivity** | **Contested.** | Everyone *wants* it, but Selectivity and Omissions often force theories into Pragmatism/Contextualism. |
  | **Modularity** | **Settled (for modeling).** | **Contested (for metaphysics).** Your Linked Switch case hits exactly here. |

  **Final Word:**
  Don't let the group get bogged down in "Is causation counterfactual or physical?" That's the wrong question. The right question is: **"Which desiderata is this author willing to sacrifice to save the others?"**

  If they save Omissions, they likely lose Locality.
  If they save Transitivity, they likely lose Omission intuition.
  If they save Objectivity, they likely lose Selectivity (or rely on hidden pragmatics).

  The Linked Switch case you invented is a weapon against **Modularity**. Use it to ask: "Does your model allow variables that are not independently manipulable?" If they say yes, ask how they calculate the causal effect without violating the definition of intervention. If they say no, ask how they model your switches. That will tell you if their framework is robust or just a house style.
