answer: |-
  You have successfully reverse-engineered the standard solution concepts of non-cooperative game theory. Your intuitions on Cases 1–4 are technically correct, and your hesitation on Case 5 identifies the exact fault line where 2-player and $N$-player game theory diverge.

  Here is the cleanest principle that fits your verdicts, followed by the technical corrections and the specific answer to your "Case 5" dilemma.

  ### The Principle: Iterated Elimination of Strictly Dominated Strategies (IESDS)

  Your "tentative stab" is essentially the definition of IESDS. To make it precise and robust:

  > **Principle:** A strategy is eliminable if and only if there exists a mixed strategy over the **currently remaining** strategies that yields a strictly higher expected payoff against **every pure strategy profile** of the opponents that is also **currently remaining**.

  This principle validates Cases 1, 2, 3, and 4. Here is the breakdown of why, and where the edge cases live.

  ### 1. Strict vs. Weak Domination (Your Case 4)
  **You are correct.** Restrict the principle to **Strict Domination**.
  *   **Strict Domination:** Order of elimination does **not** matter. The set of surviving strategies is unique.
  *   **Weak Domination:** Order of elimination **does** matter. You can eliminate different Nash Equilibria depending on which weakly dominated strategy you remove first. In some pathologies, you can eliminate *all* strategies (including Nash Equilibria) if you are not careful.
  *   **Verdict:** If you want a procedure that reflects "rationality" without depending on arbitrary procedural ordering, you must use Strict Domination.

  ### 2. Pure vs. Mixed Opponent Strategies (Your "Every Pure" Question)
  **"Every pure strategy" is sufficient.**
  You asked whether you need to check against "every mixed strategy / belief" of the opponents. You do not.
  *   **Reason:** Expected utility is linear. If a mixed strategy $\sigma_i$ beats $s_i$ against every *pure* profile of the opponents ($s_{-i}$), it necessarily beats $s_i$ against any *mixed* profile ($\sigma_{-i}$), because a mixed profile is just a probability distribution over pure profiles.
  *   **Verdict:** Your stab ("against every pure strategy the others can pick") is mathematically equivalent to "against every mixed strategy" but computationally cleaner. Keep "pure."

  ### 3. "Remaining" Strategies (Iterated vs. One-Shot)
  **Restricting to "remaining" strategies matters.**
  You asked if this restriction even matters. It does. **Iterated** elimination removes more strategies than **One-Shot** elimination.
  *   **Example:** Consider a game where Strategy A is dominated by B, but only *after* Strategy C is removed. If you only do one-shot elimination, A survives. If you iterate, A is removed in the second round.
  *   **Verdict:** Keep the "remaining" clause. This makes your principle **Iterated** Elimination, which is the standard for rationalizability.

  ### 4. The 2-Player vs. 3-Player Split (Your Case 5)
  This is the most critical part of your query. You asked: *Should the principle be "strictly dominated" or "never a best response" (NBR)?*

  **In 2-Player Games:**
  **They are equivalent.**
  There is a fundamental theorem (often attributed to Pearce or Bernheim) stating that in any 2-player game, a strategy is strictly dominated (by a mixed strategy) **if and only if** it is never a best response to any belief about the opponent.
  *   **Verdict:** For 2-player games (like your Cases 1–3), it does not matter which phrasing you use. They will eliminate the exact same strategies.

  **In 3+ Player Games:**
  **They come apart.**
  Your intuition in Case 5 is correct: **"Never a Best Response" discards more than "Strictly Dominated."**
  *   **Why:** Strict domination requires a *single* mixed strategy of yours to beat the target strategy against *all* independent combinations of opponent strategies. "Never a Best Response" asks if there is *any* belief (probability distribution) over opponent strategies where the target is optimal.
  *   In 3+ player games, opponents can correlate their strategies (in your beliefs) in ways that independent mixing cannot capture. A strategy might not be dominated by any independent mix, but it might still never be a best response to *any* belief (including correlated ones).
  *   **The Gap:** There exist strategies in 3+ player games that are **Never a Best Response** but **Not Strictly Dominated**.
  *   **Verdict:** If you use "Strictly Dominated," you keep some strategies in 3+ player games that "Never a Best Response" would eliminate.

  ### Which Principle Should You Adopt?

  You have to choose between **Procedural Robustness** (IESDS) and **Epistemic Completeness** (Rationalizability).

  1.  **Iterated Elimination of Strictly Dominated Strategies (IESDS)**
      *   **Definition:** Eliminate if strictly dominated by a mixed strategy over remaining strategies.
      *   **Pros:** Order-independent. Computationally simpler. Does not require assuming opponents can correlate (which they can't do without communication).
      *   **Cons:** In 3+ player games, it leaves in some strategies that are arguably irrational (strategies that are never a best response to anything).
      *   **Fits your Cases:** 1, 2, 3, 4 perfectly. Case 5 partially (it keeps the strategy).

  2.  **Rationalizability (NBR)**
      *   **Definition:** Eliminate if never a best response to any belief over remaining opponent strategies.
      *   **Pros:** This is the exact set of strategies consistent with **Common Knowledge of Rationality**. It is the "truest" set of strategies a rational agent would play.
      *   **Cons:** In 3+ player games, it assumes you allow for *correlated beliefs* about opponents (even if they act independently). It is harder to compute.
      *   **Fits your Cases:** 1, 2, 3, 4 perfectly. Case 5 fully (it eliminates the strategy).

  ### Final Recommendation

  Since you mentioned lurking LessWrong, you likely care about **epistemic consistency** (what a rational agent *should* believe/do) rather than just procedural convenience.

  **Adopt "Never a Best Response" (Rationalizability).**

  *   **Correction to your Stab:** Change "strictly dominated by a mixed strategy" to **"never a best response to any probability distribution over the opponents' remaining strategies."**
  *   **Why:** In 2-player games (the vast majority of intuitive examples), this gives you the exact same result as domination (validating your gut on Cases 1–3). In 3+ player games, it correctly identifies strategies that are dominated *in effect* even if not dominated *in structure* (validating your Case 5 intuition).
  *   **Caveat:** Be aware that in 3+ player games, this assumes you treat opponents' moves as potentially correlated in your belief state. If you strictly enforce independent beliefs, Rationalizability collapses back toward IESDS.

  **Summary of Verdicts:**
  *   **Case 1 & 2:** Keep (Both principles eliminate).
  *   **Case 3:** Keep (Both principles preserve).
  *   **Case 4:** Keep (Strict is order-independent; Weak is not).
  *   **Case 5:** Your intuition was right. NBR eliminates more than Domination in 3+ games. If you want the strongest rationality filter, use NBR.

  **One final correction:** You asked if "finding the principle" framing is off. It isn't, but be careful: **IESDS** is a *procedure*, while **Rationalizability** is a *solution concept*. They coincide in 2-player games, which is why your gut didn't notice the split earlier. The principle you are looking for is **Rationalizability**, defined via **Never a Best Response**.
