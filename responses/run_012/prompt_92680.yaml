  # The Expected-Value Diagnostic Tree

  **Instructions:** Answer **Yes** or **No** to each question in order. Stop when directed to a **Leaf**. All questions refer to the three cases: (i) 1-in-a-billion mugging, (ii) unbounded payoff, (iii) aggregation of tiny harms.

  **Q1 (Case iii: Aggregation):** Do imperceptible harms to a vast number of people sum to outweigh a severe harm to one person?
  *   **No** → **Leaf 1: Non-Aggregator.** (Trouble source: Value/Rule).
  *   **Yes** → Go to Q2.

  **Q2 (Case i: Probability):** Is the 1-in-a-billion probability estimate well-defined (not just epistemic noise)?
  *   **No** → **Leaf 2: Epistemic Indeterminist.** (Trouble source: Probability). *[Hybrid C]*
  *   **Yes** → Go to Q3.

  **Q3 (Case ii: Value):** Does value increase without limit (unbounded), or is there a cap/lexical order?
  *   **Bounded** → Go to Q5. (Skip Q4; procedure EV unnecessary if value caps).
  *   **Unbounded** → Go to Q4.

  **Q4 (Rule):** Do you maximize the Expected Value of the *action* or the *decision procedure*?
  *   **Procedure** → **Leaf 3: Procedural Maximizer.** (Trouble source: Rule). *[Hybrid B]*
  *   **Action** → Go to Q5.

  **Q5 (Stability):** Is there a probability threshold below which you ignore the payoff?
  *   **No** → Go to Q6.
  *   **Yes** → Go to Q6. (Note: Distinguishes Threshold from Absolutist).

  **Q6 (Action-Guiding):** Does this view yield a fixed verdict for Monday's work?
  *   **No** (Paralysis/Context-Sensitive) → **Leaf 4/7/10: Indeterminate.**
  *   **Yes** (Fixed Verdict) → **Leaf 5/6/8/9/11: Determinate.**

  *(Note: Q5/Q6 combinations create distinct leaves based on Q3 path. See Leaf Key below.)*

  ### Leaf Key (11 Positions)

  1.  **Non-Aggregator:** Rejects Case (iii). Resistance to Mugging is consistent with rejecting aggregation.
  2.  **Epistemic Indeterminist:** Accepts Aggregation, rejects Mugging because probabilities are undefined. *[Hybrid C]*
  3.  **Procedural Maximizer:** Accepts Unbounded Value, but ignores tiny probs because the *rule* of ignoring them has higher EV. *[Hybrid B]*
  4.  **Bounded Indeterminate:** Value is capped, but no fixed rule for where to stop. Paralysis on Monday.
  5.  **Bounded Determinate:** Value is capped. Action is clear (maximize within bounds).
  6.  **Bounded Thresholdist:** Value capped + Probability cutoff. Fixed verdict.
  7.  **Unbounded Indeterminate:** Value unbounded, no threshold. Math breaks down. Paralysis.
  8.  **EV Absolutist:** Value unbounded, no threshold. Take the bet.
  9.  **Reliability Thresholdist:** Threshold exists but shifts with estimate reliability. *[Hybrid A]*
  10. **Hard Thresholdist:** Fixed probability cutoff. Ignores anything below.
  11. **Threshold Determinate:** Fixed cutoff + Action Guiding. (Behaviorally similar to 6 & 10).

  ### Analysis of Hybrid Positions

  *   **(a) Reliability Threshold:** Lands in **Leaf 9**. It is a **way station**. If the shift rule is precise, it becomes a Hard Threshold (Leaf 10). If the shift rule is vague, it becomes Indeterminate (Leaf 7).
  *   **(b) Procedural Maximizer:** Lands in **Leaf 3**. It is a **stable resting place**, provided you can calculate the EV of procedures without triggering the same mugging problem for the procedure itself.
  *   **(c) Probabilities Not Well Defined:** Lands in **Leaf 2**. It is a **stable resting place**, but only if you maintain skepticism about *all* tiny probabilities, not just inconvenient ones.

  ### Behavioral Identity & Case 4

  **Identical Leaves:** **Leaf 6 (Bounded Thresholdist)** and **Leaf 10 (Hard Thresholdist)**.
  On your three cases, both reject the Mugging (Case i), reject the Unbounded Payoff (Case ii), and accept Aggregation (Case iii). They behave identically.
  **Case 4 to Separate:** A scenario with a **known, precise, tiny probability** (e.g., a quantum decay event) offering a **finite but very large payoff** (below the value bound but above the probability threshold).
  *   **Bounded Thresholdist:** Might accept if the payoff is under the value cap and prob is above threshold.
  *   **Hard Thresholdist:** Rejects solely because probability is below the fixed cutoff, regardless of value bounds.

  ### Branch Evaluation

  **Most Work:** **Q2 (Probability Definition).** This is the primary fault line. It separates those who think the math is wrong (Epistemic Skeptics) from those who think the math is right but the conclusion is wrong (Value/Rule Skeptics). It determines whether the "Skeptic Prob + Enthusiast Agg" position (Leaf 2) is occupied.

  **Droppable Branch:** **Q4 (Rule: Act vs. Procedure).** While theoretically distinct, Procedural Maximizers (Leaf 3) usually mimic Thresholdists (Leaf 10) in practice. Dropping Q4 merges Leaf 3 into the Threshold/Absolutist spine without losing behavioral resolution on your three cases. It saves a question for finer granularity on Threshold Stability.
