answer: |-
  ### The Audit of the Quarterback

  The "Monday-morning quarterback" is a sturdy piece of American vernacular, which is precisely why it is dangerous in the hands of a historian. It relies on a shared cultural understanding of sports to smuggle in philosophical claims about epistemology and ethics. To audit it, we must first freeze the frame and assign the roles your historian friend intends.

  In this mapping, the **Quarterback** is the historical actor (your family in 1918). The **Coach** represents the contemporary wisdom, doctrine, or social pressure guiding that actor. The **Play Call** is the decision made or action taken. The **Information Available at the Snap** is the sum of knowledge the actor possessed at the moment of decision (no knowledge of the Armistice date, no certainty about the influenza's trajectory). The **Scoreboard** is the actual outcome of history (the son is dead, the war ends). The **Rulebook** comprises the laws of physics and the social norms of the time. The **Game Film** is the archival record you are using for research. The **Monday Critic** is the historian or novelist writing retrospectively.

  The historian's argument rests on the discrepancy between the Information Available at the Snap and the Scoreboard. The Critic sees the Scoreboard; the Quarterback did not. Therefore, the Critic cannot judge the Play Call based on the Scoreboard. This seems robust until we inspect the machinery.

  **Where the Mapping Fails**

  The analogy breaks down in four specific places, corresponding to the conceptual tangles you identified.

  First, **Unforeseen vs. Unforeseeable**. In football, a sack might be unforeseen (a blitz came from an unexpected angle), but it is rarely unforeseeable (blitzes are part of the game). The quarterback analogy treats the Scoreboard as a surprise that invalidates judgment. However, in history, many outcomes are unforeseen by the actor but foreseeable by a rigorous analyst. The influenza pandemic was unforeseen by your family, but not unforeseeable given the troop movements and medical knowledge of 1918. The analogy collapses this distinction; it assumes that because the QB didn't see the blitz, no one could have. This matters because it licenses the historian to abdicate the duty of analyzing structural risks. If the risk was foreseeable, the "they could not have known" defense fails, even if the specific outcome was unforeseen.

  Second, **The Narrative Sentence**. You mentioned the Archduke. In football, a touchdown is a touchdown immediately. In history, an event's ontology can change based on the future. "The Archduke died" was true in 1914. "The Archduke started the war" could not be true until 1914 + *n*. The Scoreboard in football records points; it does not change the nature of the play that scored them. In history, the future retroactively alters the significance of the past. The quarterback analogy cannot account for this because the Game Film is static. A historian isn't just reading the film; they are reading the film *and* the subsequent season. This failure is fatal to the screenwriter's claim that history is just a plot imposed on chaos. The Scoreboard exists independently of the Critic's story; the "war-starting" nature of the assassination is a truth condition, not a narrative choice.

  Third, **Explaining vs. Grading**. The Monday-morning quarterback is inherently evaluative: "He should have thrown the ball." The historian claims to be explanatory: "Here is why the family suffered." The analogy conflates the two. You can explain why a play failed (the receiver slipped) without grading the quarterback as incompetent (he threw to the right spot). Your historian friend uses the analogy to prevent grading ("don't judge them"), but inadvertently blocks explaining ("don't say this caused that"). Causality is not judgment. The influenza virus caused the death; that is a causal claim, not a moral grade on the family's hygiene. The analogy forces you to choose between exoneration and accusation, leaving no room for mere mechanism.

  Fourth, **Hindsight Bias vs. Narrative Fallacy**. Hindsight bias is a psychological error ("I knew they would lose"). The Narrative Fallacy is a structural error ("The loss happened *because* of a story arc"). The quarterback analogy targets hindsight bias (the Critic thinks the blitz was obvious). But your historian friend uses it to attack the Narrative Fallacy (the Critic constructs a causal chain that didn't exist). The analogy doesn't support this leap. Knowing the Scoreboard isn't a fallacy; it's data. Constructing a *reason* for the Scoreboard is where the fallacy might lie. The analogy treats the Scoreboard itself as the contaminant, rather than the interpretation of it.

  **The Readers' Stakes**

  Your historian friend cannot get what he wants from this analogy without breaking it. He wants to suspend causal judgment ("no cheating explanation"), but the analogy only suspends moral judgment ("no blaming the QB"). If he admits causality is possible without blame, his argument collapses. The analogy supports the idea that we shouldn't *blame* the family for not knowing the war ended, but it does not support the idea that we cannot *explain* their grief through the lens of the war's end.

  Your screenwriter reader gets even less. She argues history is fiction with footnotes. The quarterback analogy proves the opposite: there is a Scoreboard (reality) that constrains the Critic. The Critic cannot write a screenplay where the team won if the Scoreboard says they lost. The analogy affirms an objective reality that the screenwriter wishes to dissolve into narrative form.

  **Alternative Analogies**

  You proposed the **Chess Annotator**.
  *   *What it buys:* It distinguishes between a blunder (a move objectively worse than alternatives available at the time) and a loss (the outcome). An annotator can say, "This move lost the game," without saying, "This player was stupid." It respects the Information Available at the Snap (the board state) while acknowledging the Scoreboard (checkmate). It handles the "Unforeseen vs. Unforeseeable" distinction well (a grandmaster should have seen the fork; a novice might not).
  *   *What it costs:* Chess is a closed system with perfect information (mostly). History is an open system with imperfect information. The "Rulebook" of history changes mid-game. It risks making history feel too gamified, too deterministic.

  You proposed the **Coroner**.
  *   *What it buys:* It separates Cause of Death from Blame. The coroner can say "The heart stopped due to lack of oxygen" without saying "The patient was foolish to run." This solves the Explaining vs. Grading problem perfectly. It allows you to write about the influenza and the war as causes of death without judging your characters for surviving or dying.
  *   *What it costs:* It is sterile. It removes agency. A coroner does not care about the *meaning* of the death, only the mechanism. For a novelist, this is fatal. You need the meaning. The coroner cannot handle the "Narrative Sentence"; a body is a body, regardless of whether the death started a war.

  **Conclusion**

  The quarterback analogy is a shield against blame, not a shield against truth. It protects your characters from your judgment, but it should not protect them from your analysis.

