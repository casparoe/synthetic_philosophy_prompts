prompt: |-
  I am the knowledge engineer on a small team building a task-planning module for warehouse robots. Every week or two I hand the planner a new action specification — pick, stack, charge, open, and so on — and the planner treats any fluent I do not explicitly list as an effect as though it persists unchanged across the action. That default is what makes the specifications writable at all, and it is also where we get burned: the planner will assume a box stays on the shelf while the robot carries the shelf away, or that a battery stays charged while a heater we forgot to model drains it. I have no logician on the team, no time to prove my specifications consistent, and one sign-off from a senior engineer; a bad specification costs us a day of downtime, and a bad one in the wrong place costs a collision.

  Turn what the frame problem literature has actually settled into a procedure I can run on each new specification. What I want from you: the questions to ask in order, what counts as a sufficient answer to each, how to decide whether a fluent may be left to the persistence default or needs an explicit rule of its own, when to add a causal axiom rather than trust the default, and the points where the procedure must stop and hand the specification to the senior engineer because the remaining question is a modeling judgment rather than something a procedure can settle. Draw on the common-sense assumption that things stay as they are unless something changes them — and the law-of-inertia metaphor used to formalize it — on the strategies that were proposed to keep specifications small, and on the reasons those strategies were shown to be incomplete: the qualification problem, the ramification problem, and the counterexamples that defeated the naive minimization of change. Do not give me a survey; give me the procedure.

  Then run it on three specifications: (1) a robot moving a box from one shelf to another; (2) a robot opening a valve on a tank, where opening the valve drains the tank, the draining changes the tank's weight, and a scale reports that weight; (3) two actions that are harmless in isolation but can run concurrently and together defeat the default — construct the pair, for instance a robot that moves a support while another places a load on it. For at least one of the three, the procedure should force an answer I will not like, and you should say so plainly. End by stating what the procedure cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Knowledge Engineer on a small warehouse robot team.
      *   **Task:** Create a practical procedure based on the "Frame Problem" literature to validate action specifications (PDDL/STRIPS-like) before handing them off.
      *   **Constraints:** No logician on team, limited time, high stakes (downtime/collision). Need specific questions, sufficiency criteria, decision rules (default vs. explicit), hand-off points, and limitations.
      *   **Content:** Draw on Frame Problem literature (inertia, minimization of change), Qualification Problem (preconditions), Ramification Problem (indirect effects), and counterexamples (concurrency, etc.). *Do not give a survey; give the procedure.*
      *   **Application:** Run the procedure on three specific cases:
          1.  Move box (simple).
          2.  Open valve -> drain -> weight change -> scale report (ramifications).
          3.  Concurrent actions defeating defaults (concurrency/interaction).
      *   **Requirement:** For at least one case, the procedure must force an "unliked" answer (hard truth).
      *   **Ending:** State what the procedure *cannot* do.

  2.  **Deconstruct the "Frame Problem" Literature for Engineering:**
      *   *Core Idea:* Things stay the same unless changed (Law of Inertia).
      *   *Naive Approach:* List all non-changes (impossible).
      *   *Solution:* Default persistence (what the user already has).
      *   *The Catch (Qualification):* Too many preconditions needed to ensure an action works (e.g., potato in tailpipe prevents car starting). *Engineering translation:* Are there hidden blockers?
      *   *The Catch (Ramification):* Indirect effects (e.g., opening valve drains tank, weight changes). *Engineering translation:* Does this action trigger a chain reaction not listed in effects?
      *   *The Catch (Concurrency/Interaction):* Two actions interfering (e.g., moving support while loading). *Engineering translation:* Does this action assume the world is static in a way another action might violate?
      *   *The Catch (Minimization of Change):* Sometimes the "least change" assumption is wrong (e.g., shooting a gun: bullet moves, gun stays, but if gun is glued, bullet stays, gun moves? No, usually gun recoils). *Engineering translation:* Causal mechanisms matter more than logical minimization.

  3.  **Drafting the Procedure (The "Frame Check Protocol"):**
      *   *Goal:* A checklist that forces the engineer to think about inertia, causality, and side effects without needing theorem proving.
      *   *Step 1: The Inertia Check.* What *must* stay true? Is it physically possible for it to stay true?
      *   *Step 2: The Ramification Check.* What *must* change as a consequence of the explicit changes? (Causal links).
      *   *Step 3: The Qualification Check.* What could prevent this action from having its intended effect? (Hidden preconditions).
      *   *Step 4: The Concurrency Check.* What else might be happening at the same time?
      *   *Decision Rules:* When to write an axiom vs. trust default.
      *   *Hand-off:* When physical safety or complex causal chains are involved.

  4.  **Refining the Procedure (Iterative Polish):**
      *   Make it actionable. "Ask this question." "If Yes, do this."
      *   Incorporate the "Law of Inertia" metaphor explicitly.
      *   Address the "Qualification" and "Ramification" problems as specific steps.
      *   Define the "Stop" condition clearly (Safety/Collision risk).

  5.  **Running the Procedure on the Three Cases:**

      *   *Case 1: Move Box (Shelf A to Shelf B).*
          *   Inertia: Box location changes. Shelf location? Robot location?
          *   Ramification: None obvious.
          *   Qualification: Is shelf overloaded? Is path clear?
          *   Verdict: Likely safe for default, but check path.

      *   *Case 2: Open Valve (Drain -> Weight -> Scale).*
          *   Inertia: Valve state changes.
          *   Ramification: Fluid level changes (direct). Weight changes (indirect/derived). Scale reading changes (indirect/derived).
          *   *Conflict:* The planner only knows explicit effects. If `weight` is a fluent, it persists by default. But physics says it changes.
          *   *Verdict:* **The Unliked Answer.** You cannot model `weight` as a persistent fluent here. It must be a derived fluent or have a causal rule. If the planner treats it as persistent, the plan is wrong. The engineer *must* model the dependency, not just the action effect.

      *   *Case 3: Concurrent Actions (Move Support vs. Place Load).*
          *   Action A: Move Support (Effect: Support Location).
          *   Action B: Place Load (Effect: Load on Support).
          *   Inertia: Load position persists relative to support?
          *   *Conflict:* If concurrent, Load moves *because* Support moves, but Action B didn't say "Move Load". Action A didn't say "Carry Load".
          *   *Verdict:* Hand-off. This is a collision/safety risk. The default persistence fails because the *reference frame* moves.

  6.  **Addressing the "Unliked Answer" Requirement:**
      *   Case 2 is the best candidate. Engineers hate modeling derived fluents or state constraints because it complicates the domain. They want to just say `open_valve` -> `valve_open`. But if `weight` is needed for planning (e.g., stability), the default persistence is a lie. I need to be blunt: "Your specification is logically inconsistent with physics."

  7.  **Finalizing the "What the Procedure Cannot Do" Section:**
      *   It can't prove safety.
      *   It can't solve the Qualification Problem fully (infinite preconditions).
      *   It can't replace simulation/testing.
      *   It can't handle novel physics not in the model.

  8.  **Review against Constraints:**
      *   *No survey?* Check.
      *   *Procedure first?* Check.
      *   *Questions in order?* Check.
      *   *Sufficiency criteria?* Check.
      *   *Hand-off points?* Check.
      *   *Three cases run?* Check.
      *   *Unliked answer?* Check (Case 2).
      *   *Ending limitations?* Check.

  9.  **Tone and Style:**
      *   Professional, direct, engineering-focused.
      *   Acknowledge the stakes (collision/downtime).
      *   Use the terminology (Fluent, Frame, Ramification, Qualification) but ground it in warehouse reality.

  10. **Self-Correction/Refinement during drafting:**
      *   *Initial thought:* Maybe suggest PDDL+ or continuous change.
      *   *Correction:* No, keep it to the discrete planner they have. The advice must be about *specification* within their current constraints.
      *   *Initial thought:* Make the procedure long.
      *   *Correction:* Keep it tight. They have no time.
      *   *Focus:* Ensure the distinction between "Persistent Fluent" and "Derived Fluent" is clear in Case 2, as that's the crux of the Ramification problem solution in practice.

  11. **Final Polish:** Check the "Hand-off" criteria. It needs to be clear when the engineer says "I'm done" and when they say "Senior, look at this." Safety is the primary trigger.

  *(Self-Correction on Case 3)*: Make sure the concurrency example is concrete. Robot A moves a rack. Robot B puts a box on the rack. If concurrent, the box ends up in the wrong place. The planner assumes the rack stays still while B places (inertia of rack), and the box stays on the rack while A moves (inertia of box relative to rack). Both defaults fail when combined.

  *(Self-Correction on Case 2)*: The "unliked answer" needs to be about the *modeling effort*. The procedure will tell them they can't just list `weight` as a fluent that persists. They have to implement state constraints or derived fluents. This increases spec complexity.

  Let's write it.cw
answer: |-
  # The Frame Check Protocol (FCP)

  **Purpose:** To validate action specifications against physical reality before compilation.
  **Input:** A draft action specification (Preconditions, Effects).
  **Output:** A validated spec, a request for causal axioms, or a hand-off to the Senior Engineer.

  **Core Principle:** The "Law of Inertia" (fluents persist unless changed) is a computational shortcut, not a physical law. Your job is to identify where the shortcut diverges from physics.

  ---

  ## Phase 1: The Inertia Interrogation
  *Goal: Verify that the default persistence assumption is physically safe.*

  **Q1.1: For every fluent NOT listed in Effects, is there a physical mechanism that could change it during the action's duration?**
  *   **Sufficient Answer:** "No, the action duration is short, and no other active process affects this fluent."
  *   **Decision:**
      *   If **Yes**: You must add an explicit negative effect (e.g., `NOT(safe)`) or a causal axiom. Do not trust the default.
      *   If **No**: Proceed to Q1.2.
  *   **Hand-off Trigger:** If the fluent relates to **collision safety** (e.g., `path_clear`, `structure_stable`) and the answer is "No" only because "it usually doesn't," hand off. "Usually" is not a guarantee.

  **Q1.2: Does the action move the *reference frame* of any persistent fluent?**
  *   **Context:** If a box is on a shelf, and the robot moves the shelf, the box's *absolute* location changes even if `on(box, shelf)` persists.
  *   **Sufficient Answer:** "The action does not move the container/location of any object relying on persistence."
  *   **Decision:**
      *   If **No**: Trust the default.
      *   If **Yes**: You must explicitly model the derived location change or forbid concurrency (see Phase 4).

  ---

  ## Phase 2: The Ramification Scan
  *Goal: Identify indirect effects (The Ramification Problem).*

  **Q2.1: Do any explicit Effects physically force a change in a fluent not listed?**
  *   **Context:** Opening a valve causes flow. Flow causes weight loss. Weight loss causes scale reading change.
  *   **Sufficient Answer:** "All physical consequences are either listed as Effects or are irrelevant to planning goals."
  *   **Decision:**
      *   If **No**: You must model the chain. If `weight` is a fluent used in preconditions elsewhere, you cannot treat it as persistent. It must be a **Derived Fluent** (calculated from state) or have a **Causal Rule** attached to the action.
      *   **Hard Truth:** If you list `weight` as a primitive fluent that persists by default, your plan is logically unsound.
      *   If **Yes**: Proceed to Q2.2.

  **Q2.2: Is the chain of consequences finite and bounded within the action duration?**
  *   **Sufficient Answer:** "The effects settle before the next action begins."
  *   **Decision:**
      *   If **No** (e.g., draining continues indefinitely): You cannot model this as a discrete action. Hand off to Senior Engineer for continuous process modeling.

  ---

  ## Phase 3: The Qualification Filter
  *Goal: Identify hidden blockers (The Qualification Problem).*

  **Q3.1: What single, unlikely fact could prevent this action from achieving its Effects?**
  *   **Context:** A potato in the tailpipe. A fused relay. A blocked sensor.
  *   **Sufficient Answer:** "The only blockers are already in Preconditions (e.g., `battery_charged`, `path_clear`)."
  *   **Decision:**
      *   If you identify a blocker not in Preconditions: Add it.
      *   **Stop Rule:** Do not add every possible blocker. Add only those with **probability > 1%** or **consequence = Collision**. Everything else is execution-time error handling, not planning.

  ---

  ## Phase 4: The Concurrency Stress Test
  *Goal: Identify interaction failures.*

  **Q4.1: If this action runs simultaneously with any other action in the library, do their Inertia assumptions conflict?**
  *   **Context:** Action A assumes Shelf is Static. Action B moves Shelf.
  *   **Sufficient Answer:** "No other action modifies fluents this action assumes are inert."
  *   **Decision:**
      *   If **Yes**: You must add a **Mutex Constraint** (resource lock) between the two actions.
      *   **Hand-off Trigger:** If the conflict involves physical stability (e.g., loading while moving), do not just add a mutex. Hand off. The Senior Engineer must decide if the physics allows safe concurrency or if it requires a sequential compound action.

  ---

  ## Application of the Protocol

  ### Case 1: Robot Moving a Box (Shelf A to Shelf B)
  **Spec:** `move_box(box, shelf_A, shelf_B)`
  **Effects:** `at(box, shelf_B)`, `NOT(at(box, shelf_A))`
  **Persisting Fluents:** `charged(robot)`, `intact(box)`, `location(shelf_A)`

  **Run:**
  1.  **Inertia (Q1.1):** Can `intact(box)` change during move? Yes, if dropped.
      *   *Decision:* Add `intact(box)` to Preconditions. Trust default for `charged(robot)` (duration is short).
  2.  **Inertia (Q1.2):** Does this move a reference frame? No, shelves are static.
  3.  **Ramification (Q2.1):** Does moving the box change anything else? `load(shelf_A)` decreases, `load(shelf_B)` increases.
      *   *Decision:* If `load` is used for stability planning, these must be explicit effects. If `load` is ignored, ignore it.
  4.  **Concurrency (Q4.1):** Can another robot move `shelf_B` while this robot places the box?
      *   *Decision:* If yes, `at(box, shelf_B)` might be true but `at(box, location_X)` is also true. Add Mutex on `shelf_B`.

  **Verdict:** **Pass.** Add mutex on shelves. Specification is robust enough for the default persistence.

  ---

  ### Case 2: Robot Opening a Valve (Tank Drain -> Weight -> Scale)
  **Spec:** `open_valve(tank)`
  **Effects:** `valve_open(tank)`
  **Persisting Fluents:** `fluid_level(tank)`, `weight(tank)`, `scale_reading(scale)`

  **Run:**
  1.  **Inertia (Q1.1):** Can `fluid_level` change? Yes, physics dictates it drains if valve is open.
      *   *Decision:* **FAIL.** You cannot list `fluid_level` as persisting.
  2.  **Ramification (Q2.1):** Does `valve_open` force `fluid_level` to change? Yes. Does `fluid_level` force `weight` to change? Yes. Does `weight` force `scale_reading` to change? Yes.
      *   *Decision:* **The Unliked Answer.**
      *   You cannot write this specification as a simple list of effects. If you treat `weight` as a fluent that persists unless explicitly changed by `open_valve`, the planner will assume the tank remains heavy while it drains.
      *   **Required Fix:** You must remove `weight` and `scale_reading` from the set of primitive fluents. They must be **Derived Fluents** defined by a state constraint (e.g., `weight(tank) = base + fluid_level * density`).
      *   **Impact:** This increases your modeling overhead significantly. You can no longer just "list effects." You must implement a rule system or arithmetic evaluation in the planner state. If your planner does not support derived fluents, **you cannot model this domain correctly.**
  3.  **Qualification (Q3.1):** What prevents draining? Pump failure, clog.
      *   *Decision:* Add `valve_functional` to Preconditions.

  **Verdict:** **Fail/Redesign.** The procedure forces you to admit that your current representation (primitive fluents with inertia) is physically wrong for this case. You must implement derived fluents or causal rules. If you try to patch this by adding `decrease_weight` as an effect, you will fail the next time a heater evaporates the fluid without the valve opening. The persistence default is a lie here.

  ---

  ### Case 3: Concurrent Actions (Move Support vs. Place Load)
  **Spec A:** `move_support(support, loc1, loc2)`
  **Effects:** `at(support, loc2)`
  **Spec B:** `place_load(load, support)`
  **Effects:** `on(load, support)`
  **Assumption:** Both rely on inertia for the other's object. A assumes `on(load, support)` persists (load stays on). B assumes `at(support, loc)` persists (support stays still).

  **Run:**
  1.  **Inertia (Q1.2):** Does A move the reference frame of B's effect?
      *   *Analysis:* B places load on support. A moves support.
      *   *Result:* Yes. If concurrent, `on(load, support)` persists, but `at(load, loc1)` becomes false while `at(load, loc2)` becomes true *without an explicit effect in B*.
  2.  **Concurrency (Q4.1):** Do their inertia assumptions conflict?
      *   *Analysis:* A assumes load doesn't interfere with moving support. B assumes support doesn't move while placing.
      *   *Result:* **Collision Risk.** If the robot places the load while the support is in transit, the load falls or the robot collides with the moving support.
  3.  **Decision:**
      *   Add Mutex? A simple mutex prevents concurrency, but it doesn't solve the physics.
      *   **Hand-off Trigger:** This is a **Safety Hand-off**.
      *   *Reasoning:* The procedure identifies that the "world is static" assumption is violated in a way that causes physical instability. A mutex prevents the plan, but the Senior Engineer must decide if a new compound action `move_support_with_load` is required, or if the hardware allows dynamic stabilization. This is not a logic fix; it is a mechanical/operational judgment.

  **Verdict:** **Hand-off.** Do not sign off. The interaction creates a physical hazard that a logical mutex masks but does not resolve.

  ---

  ## What This Procedure Cannot Do

  1.  **It Cannot Solve the Qualification Problem:** It asks you to list likely blockers, but it cannot enumerate the infinite set of impossible-to-predict failures (e.g., a cosmic ray flips a bit, a forklift crashes through the wall). It relies on your heuristic judgment of "probability > 1%."
  2.  **It Cannot Prove Safety:** It identifies contradictions between logic and physics, but it does not verify that the physics model itself is correct. If your derived fluent equation for `weight` is wrong, the procedure validates the wrong equation.
  3.  **It Cannot Replace Simulation:** It catches logical inconsistencies in persistence, but it cannot detect timing violations (e.g., the valve opens too slowly for the planner's discrete time step).
  4.  **It Cannot Handle Novelty:** If a new robot type is introduced with different physics (e.g., omnidirectional vs. differential drive), the procedure must be re-run from scratch. It does not generalize across hardware changes.

  **Final Instruction:** If Phase 2 (Ramification) forces you to model derived fluents and your planner stack does not support them, stop. Do not hack the effects list. Request architectural time. A bad specification in the planner is technical debt that pays interest in downtime.
