      *   **Task:** Draft a short written opinion (memo/statement) to circulate before the next board meeting.
      *   **Constraints:**
          *   Concrete recommendation (Pass, Watered-down, Other).
          *   Engage strongest version of the opposing side (no strawmanning).
          *   Address the supererogation question explicitly (is "above and beyond" a fact or a convention?).
          *   Evaluate middle options (e.g., phone guidance).
          *   Length: ~1.5 pages.
          *   Style: Written like a person (no citations, natural tone).
          *   Taboo word: "Hero" (for a paragraph/section).
          *   Focus: Moral reasoning + practical implications.

  2.  **Deconstruct the Moral/Philosophical Core:**
      *   *Supererogation:* Acts that are good to do but not wrong to omit. The user argues volunteering is inherently supererogatory. Making it mandatory changes the nature of the act.
      *   *Opposing View:* If you hold certification and are capable, you have a moral duty to save lives. The "volunteer" label shouldn't exempt you from basic moral obligations when the stakes are life/death.
      *   *The "Fact vs. Convention" Question:* Is "above and beyond" intrinsic to the act, or defined by the rules? If the rules change, does the moral quality change?
          *   *Analysis:* It's partly convention. If I *must* do it, it's my duty. But the *spirit* of volunteering relies on goodwill. Coercion undermines the goodwill that sustains the system.
      *   *Middle Ground:* Remote support (phone guidance). Does this work? It lowers the barrier but might not save the patient in cardiac arrest (CPR/AED needed). It might be a good compromise for "duty to assist" without "duty to arrive."

  3.  **Deconstruct the Practical Core:**
      *   Retention risk: Older demographic, fragile roster. Mandates drive away volunteers.
      *   Liability/Insurance: Might be affected by mandated response (workers comp issues for off-duty?).
      *   Effectiveness: Will mandates actually get people out of bed? Or will they just quit?

  4.  **Drafting Strategy:**
      *   **Header:** To/From/Date/Subject.
      *   **Opening:** Acknowledge the tragedy and the validity of the pain driving the proposal. Validate the opposing faction's moral intuition (duty to save lives).
      *   **The Moral Argument (The "Hero" Taboo Section):** Address the supererogation point. Is "above and beyond" changed by policy? Argue that while policy defines *obligation*, it cannot manufacture *commitment*. The system runs on goodwill, not compliance.
      *   **The Practical Reality:** Address the retention risk without making it the *only* argument.
      *   **The Middle Option:** Evaluate the "phone guidance" idea. Be honest about its limitations for cardiac arrest.
      *   **Recommendation:** Don't mandate physical response. Instead, focus on transparency, optimization, and perhaps a "soft" expectation or tiered membership.
      *   **Tone:** Respectful, firm, thoughtful, colleague-to-colleague.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I taboo "hero"? Yes, need to ensure that word doesn't slip in during the moral section.
      *   *Check:* Did I engage the strongest opposing view? Yes, acknowledge that "volunteer" shouldn't mean "optional when lives are at stake."
      *   *Check:* Is the distinction between fact and convention clear? I need to argue that while policy changes the *rule*, it changes the *nature of the community*.
      *   *Check:* Recommendation needs to be concrete. "Reject the mandate, adopt a transparency protocol."

  6.  **Drafting - Section by Section:**

      *   *Intro:* We all feel the loss. The proposal comes from a good place.
      *   *Opposing View:* They argue that certification implies a standing moral commitment. If you hold the skill, you hold the duty. This is a strong moral claim.
      *   *The Supererogation Point:* The user's gut feeling. If we mandate it, it's no longer "above and beyond." But is that just semantics? No. Because the *motivation* shifts from altruism to compliance. If the system relies on altruism, mandating it breaks the engine.
      *   *Fact vs. Convention:* It's not just a label. It's about the social contract. We are a volunteer corps. Changing this changes what we *are*.
      *   *Practicality:* Not just "people will quit." It's "people who stay will be resentful/compliant vs. committed."
      *   *Middle Ground:* Phone guidance. Good for triage, bad for cardiac arrest. Doesn't solve the core issue.
      *   *Recommendation:* No mandate. Instead: Clarify expectations during recruitment, improve dispatch efficiency, maybe create a "rapid response" tier who *opt-in* to the stricter rule.

  7.  **Review against Constraints:**
      *   Length: Keep it tight.
      *   No citations.
      *   No "hero".
      *   Concrete recommendation.

  8.  **Final Polish:** Ensure the tone isn't preachy but persuasive. Make sure the distinction about "above and beyond" is clear. (Is it a fact or convention? I'll argue it's a convention that tracks a moral fact about voluntarism.)

      *Wait, one nuance:* The prompt asks: "say clearly whether the board is allowed to treat 'this is above and beyond' as a fact about the act that no policy can change, or whether it's more like a convention we're choosing to keep or drop."
      *My stance:* It's a convention that tracks a moral reality. We *can* change the rule, but we change the nature of the act. We can't legislate the moral quality of the motivation.

      *Let's write.*

      *Word Count Check:* 1.5 pages is roughly 750-900 words single spaced. I need to be concise.

      *Taboo Check:* Scan for "h-e-r-o".

      *Recommendation:* Reject the mandate. Propose a "Rapid Response Tier" (opt-in) + better recruitment clarity.

      *Middle Option:* Address the phone guidance. It's insufficient for cardiac arrest.

      *Opposing View:* Acknowledge the "duty of easy rescue" argument.

      *Okay, ready to draft.*

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm dismissing the death. Emphasize the shared grief.

      *(Refining the "Fact vs Convention" part)*: I need to be precise. Policy defines duty. But the *value* of the act depends on the freedom to omit it. If I *must* do it, it's not charity anymore. It's tax/service. So the board *can* change the convention, but it destroys the specific moral value we rely on (voluntarism).

