answer: |-
  **Examination Question**

  **Module:** PHI3042 Metaphysics and Ethics of Virtual Worlds
  **Time Allowed:** 45 Minutes
  **Marks:** 25

  **Question 1**

  Consider the case of *Aldermere*, a persistent virtual world running for eleven years.
  1.  **The Memorial:** A guild has maintained a memorial garden for a deceased member on a legacy shard. Players treat it as a grave. The operator deletes the shard without warning. The garden cannot be transferred.
  2.  **The Duel:** Two players freely enter a duel under ordinary world rules. The loser's avatar 'dies' permanently, and their inventory is destroyed.

  In both instances, intersubjectively accessible, causally efficacious objects are lost. Yet, our intuitions about harm differ.

  Write an essay that provides a verdict on whether a genuine harm has occurred in **both** the Memorial and the Duel scenarios. In doing so, you must explicitly address whether the claim that virtual objects are ontologically 'real' is load-bearing for your ethical conclusion. Does the metaphysics determine the ethics, or can the ethical assessment be settled by normative factors (such as consent and expectation) independent of the ontology?

  ***

  **Model Answer**

  In this essay, I argue that while the ontological status of virtual objects establishes the *possibility* of harm, it is not load-bearing for the *actualisation* of that harm. The ethics are determined not by whether the garden or the sword are 'real' in a metaphysical sense, but by the normative context of consent and reasonable expectation. Consequently, I verdict that the deletion of the Memorial constitutes a genuine harm, whereas the loss incurred in the Duel does not constitute an unjust harm, despite the metaphysical identity of the objects involved.

  First, we must briefly settle the ontology to see if it does the ethical heavy lifting. The objects in *Aldermere* are causally efficacious and intersubjectively accessible; players see the same garden and are blocked by the same walls. A digital realist might argue this makes them real enough to ground moral claims. However, if ontology were load-bearing, both the Memorial and the Duel inventory would stand on identical footing. They are both code, both persistent, and both socially recognised. If the reality of the object alone dictated the ethics, the operator's deletion and the opponent's victory would be morally equivalent violations of property. Since our intuitions recoil at the deletion but accept the duel loss, the ontology cannot be doing all the work. The metaphysics provides the stage, but not the script.

  Regarding the Memorial, a genuine harm has occurred. This is not because the pixels possess intrinsic moral weight, but because the operator violated a normative expectation established over eleven years. The garden functioned as a grave. In the actual world, desecrating a grave is a harm not because of the stone's metaphysics, but because of the social meaning and the emotional investment attached to it. The players treated the garden as a site of mourning; the operator, by deleting the shard without warning, destroyed a site of shared emotional labour. The lack of consent is crucial here. Unlike the duel, the players did not agree to the risk of sudden deletion. The harm is real because the relational bond between player and operator was breached, rendering the loss of the object a loss of meaning.

  Conversely, in the Duel, no unjust harm has occurred. The loser loses inventory accumulated over years, which is frustrating and emotionally significant. However, they entered the duel freely under known rules. The 'death' of the avatar and the destruction of items were consensual risks. To claim harm here is to ignore the normative framework the players voluntarily adopted. The ontology of the inventory is identical to the garden—it is real code with real social value—but the ethical outcome differs because the loss was authorised by the loser's consent. The harm is mitigated by the fact that the rules of the game, which constitute the social contract of *Aldermere*, permit this exchange.

  This brings us to the load-bearing question. Is the reality of the virtual object necessary for the harm? In one sense, yes: if the garden were purely hallucinatory and not intersubjectively accessible, no shared mourning could occur. So, the causal efficacy of the object is a prerequisite. However, it is not sufficient. We cannot move directly from 'the object is real' to 'the deletion is wrongful.' That is the gap many arguments fail to bridge. The ontology explains why the loss *matters* to the players (because it affects their experiences and social interactions), but it does not explain why the loss is *wrongful*. The wrongfulness comes from the violation of consent in the Memorial case, and the presence of consent in the Duel case.

  Therefore, the ethics can be settled without relying on a robust metaphysical realism. Even if we were fictionalists about virtual objects—viewing them as mere props in a game—the ethical assessment remains the same. If I lend you a prop sword for a staged fight, I am not wronged if you 'break' it according to the script. If you burn down a memorial prop I built without my agreement, you have wronged me. The distinction lies in the human agreements surrounding the objects, not the objects themselves.

  In conclusion, the operator harmed the guild by deleting the Memorial, while the duelists did not harm one another. The ontological status of the virtual objects is not load-bearing for this verdict. It establishes that something of value was lost, but the normative context of consent determines whether that loss constitutes a moral wrong. We must look past the metaphysics of the server to the ethics of the community.

  ***

  **Marking Scheme**

  **1. Ontological Baseline (5 marks)**
  *   **Requirement:** Candidate acknowledges the causal efficacy/intersubjectivity of the objects but refuses to let this alone dictate the ethical outcome.
  *   **Typical Error:** Equating causal efficacy directly with moral status, arguing that because the objects are 'real', any loss is automatically a harm.

  **2. Verdict on the Memorial (5 marks)**
  *   **Requirement:** Candidate identifies the deletion as a genuine harm, grounding this in the breach of expectation, emotional investment, or lack of warning/consent.
  *   **Typical Error:** Dismissing the harm because 'it is only code' or deferring entirely to the Operator's Terms of Service ownership claims.

  **3. Verdict on the Duel (5 marks)**
  *   **Requirement:** Candidate identifies that while a loss occurred, it does not constitute an *unjust* harm or wrong, grounding this in the voluntary consent to the rules.
  *   **Typical Error:** Claiming the loss of inventory is inherently wrongful regardless of the agreed-upon rules of the duel.

  **4. The Consent Distinction (5 marks)**
  *   **Requirement:** Candidate explicitly contrasts the two scenarios, highlighting that the metaphysical status of the objects is unchanged while the consent structures differ.
  *   **Typical Error:** Treating both scenarios identically because the objects are the same type, failing to see why consent alters the ethical landscape.

  **5. The Load-Bearing Question (5 marks)**
  *   **Requirement:** Candidate explicitly states whether ontology is load-bearing. (Target: Ontology enables value but does not determine wrongfulness; normative context is load-bearing).
  *   **Typical Error:** Helping themselves to the move from 'reality of objects' to 'reality of harms' without noticing the gap, or claiming ethics are entirely independent of the objects' causal powers.
