answer: |-
  This is a fantastic case study. It sits right at the intersection of aesthetics, ethics, and ontology. Since you're a philosopher, I'll skip the platitudes and give you the conceptual architecture your friend needs to defend her position to the board.

  Here is the breakdown of the arguments, followed by what she should actually do.

  ### 1. Ontology: Is it a "Fake"?
  The board member is operating under a layperson's definition of authenticity: *Is this the object created by the hand of the famous master at the time attributed?* The answer is no.

  However, in philosophy of art, we distinguish between **forgery** and **copy**.
  *   **Forgery** requires *intent to deceive* at the point of creation or sale. The prompt states the copyist made it as a study and never tried to pass it off. The deception happened later via administrative drift (the estate sale). Therefore, the object itself is not a forgery; it is a misattributed copy.
  *   **Nelson Goodman's Distinction:** In *Languages of Art*, Goodman argues painting is "autographic"—the history of production matters. A perfect copy of a Rembrandt is not a Rembrandt. However, when the original is destroyed, the ontology shifts. This copy is no longer a "copy of X"; it is now the **primary visual witness to X.**

  **The Argument for the Board:** Calling it a "fake" implies a lie embedded in the canvas. There is no lie in the canvas. The lie was in the catalog card. Correcting the card corrects the lie. Keeping the old label is the only actual fraud.

  ### 2. Aesthetic Value: Does it matter it isn't the 1600s original?
  For the art market? Yes, massively. For a university museum? No.
  A university museum's mandate is education and preservation, not asset speculation.

  *   **Visual Access:** Since the 1600s original is ash, this 1890s canvas is the *only* way to access the composition. If you remove it, the composition ceases to exist visually for the public.
  *   **The "Surrogate Original":** In archival science, when a primary source is lost, the best surviving copy assumes the status of the primary source. It becomes an "original" record of the lost work.
  *   **The 1890s Context:** The board member sees a failed 1600s painting. Your friend should frame it as a successful 1890s painting. It tells a story about 19th-century pedagogy, the role of copyists (often women, often uncredited), and how art history was constructed in the Victorian era.

  ### 3. Ethics: Intent and Transparency
  The board member is worried about reputation. They think displaying a "fake" makes them look foolish.
  *   **The Paradox:** Displaying it as a 1600s original *is* fraud. Displaying it as an 1890s copy of a lost original is **scholarship.**
  *   **Intent:** The copyist's lack of intent to deceive clears the moral stigma of the object. It transforms the narrative from "scandal" to "discovery."
  *   **Duty to the Public:** The museum has an ethical duty to be truthful. If they know the date is wrong and keep the old label, they are actively deceiving the public. Relabeling is the only ethical move.

  ### 4. What to Tell Her (The Strategy)
  Tell her she is right, but she needs to reframe the narrative to neutralize the board member. She shouldn't just "keep it up." She needs to **curate the controversy.**

  Here is the pitch she should give the board:

  1.  **Acknowledge the Risk:** "You are right that displaying a misattributed work without context is dangerous. That is why we must change the attribution immediately."
  2.  **Reframe the Value:** "We are not losing a 1600s masterwork; we are gaining a rare 1890s study by a professional copyist, which is historically significant in its own right. Furthermore, because the original burned, this is now a unique historical document. We possess the only visual record of a lost masterpiece."
  3.  **The "Fraud" Defense:** "The only fraud would be continuing to label it as 1600s after we know the truth. By relabeling it, we demonstrate intellectual honesty and rigorous scholarship. That enhances our reputation; hiding it damages it."
  4.  **The Exhibition:** "We will not hang it in the 17th-century gallery. We will build a small exhibition: *The Copy, The Loss, and The Lie.* We tell the story of the copyist, the fire, and the cataloguing error. We make the object's history the art."

  ### The Philosophical Bottom Line
  Does it matter it isn't the original?
  **Ontologically:** Yes, it is a different object.
  **Phenomenologically:** No, it offers the same visual experience.
  **Historically:** It is now more valuable than a standard copy because it is a *singleton* (the only surviving instance of that composition).

  **Verdict:**
  Tell her to **relabel and display.**
  The board member is confusing *market value* (which relies on scarcity and authorship) with *cultural value* (which relies on meaning, history, and access). A university museum serves the latter.

  If she hides the painting, she admits shame where there is none. If she displays it with the new, honest narrative, she turns a potential scandal into a triumph of curatorial integrity. The copyist didn't intend to deceive; the museum shouldn't intend to hide.

  **One caveat:** She must ensure the new label is prominent. It cannot be a footnote. It must say: *"Study by [Copyist Name], 1890s. After the lost original by [Original Artist], c. 1600s. Destroyed 1911."* Transparency is her shield.
