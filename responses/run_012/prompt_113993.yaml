  6.  **Formulating the Epiphenomenalist Defense:**

      *   The best defense is to reject the Causal Theory of Knowledge for introspection. Maybe introspection is a "direct acquaintance" that doesn't require causal mediation in the standard sense. Or, argue that the *physical state* represents the qualia because they are nomologically linked, so the belief is about the qualia even if caused by the physical supervenience base. (This is the "Russellian Monist" or "Areopagitic" move).
