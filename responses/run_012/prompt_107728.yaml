answer: |-
  Here is the principle that ties your verdicts together, the tensions it resolves, and the one verdict it forces you to abandon.

  ### The Principle: Cooperative Scheme Membership

  **You are obligated to contribute when you are a participant in a defined cooperative scheme where contribution is the understood condition of membership or access. You are not obligated when you are merely a beneficiary of a diffuse public good where no specific contribution is expected from you.**

  The moral weight does not come from your **causal impact** (whether the thing succeeds without you), but from your **relational status** (whether you are "in" the group that sustains it).

  ### Why this fits your list

  This principle rejects your "makes no difference" hypothesis. You already noticed that hypothesis failed on the Rota and the Group Doc (where Priya or your group mates cover for you, so your impact is nil, but it's still wrong).

  Under **Cooperative Scheme Membership**:
  *   **The Rota, The Doc, Dave's Present, The Coffee Fund:** These are all **defined schemes**. You are a member of the allotment group, the project team, the office, or the friend circle. The "price" of membership is following the rota, writing the doc, chipping in, or paying for coffee. Whether your specific £5 saves the present or your weeding saves the crop is irrelevant. You owe the share because you accepted the benefits of the *arrangement*.
  *   **Wikipedia, The Big March, Voting:** These are **diffuse public goods**. You are not a "member" of Wikipedia; you are a user of a utility. No one expects *you* specifically to pay. The Big March (permit secured) is a general political expression; your body isn't a condition of the scheme's validity. Voting is a civic duty, but the election result is not a cooperative scheme among voters in the same way an office fund is.
  *   **The Fishery:** This is a **regulated scheme**. Quotas are the rules of membership for fishing there. Cheating violates the scheme, regardless of whether the fishery collapses anyway.

  ### Resolving your two tensions

  **1. Wikipedia (Fine) vs. Coffee Fund (Not Fine)**
  *   **Resolution:** Wikipedia is an open utility. There is no social contract between you and the Wikimedia Foundation that says "Usage requires payment." The Coffee Fund is a micro-scheme. The norm is "If you drink, you pay." By drinking, you implicitly accept the terms of the scheme. You aren't paying for the coffee's existence (causal); you are paying your due as a participant (fairness).

  **2. Big March (Fine) vs. Small March (Not Fine)**
  *   **Resolution:** In the Big March, the permit is secured. Your presence is optional. In the Small March, the permit *requires bodies*. This turns the march from a diffuse good into a **threshold scheme**. By agreeing to go (or being part of the organising group), you enter a temporary cooperative scheme where your body is a condition of the good's legality. You aren't just benefiting; you are a structural pillar.

  ### Pronouncements on your new cases

  **(a) An anonymous rota where nobody can tell I skipped.**
  *   **Verdict: Not Fine.**
  *   **Reason:** The obligation comes from your membership in the allotment scheme, not from the risk of getting caught. If you skip, you violate the fair play agreement with the other members (like Priya), even if they never know it was you. You have taken the benefit (a weeded plot) without the burden.

  **(b) A shared thing where I'm the only person who can fix it and it's a right faff.**
  *   **Verdict: Not Fine.**
  *   **Reason:** This is the extreme end of Scheme Membership. If the scheme collapses without you, your obligation is highest. The "faff" is your cost of membership. If you benefit from the thing existing, and you are the sole designated maintainer (explicitly or implicitly), opting out is a breach of the cooperative terms.

  **(c) Whether it matters that some goods need a certain number of people to tip them over the line.**
  *   **Verdict: Yes, it matters.**
  *   **Reason:** Threshold goods create a **constitutive rule**. If a good requires 50 people to exist (like the Small March permit), and you are the 50th, you are not just free-riding; you are *enabling* the free-riding of the other 49. In non-threshold goods (like Wikipedia), your absence doesn't enable others to cheat; it just slightly reduces resources. Thresholds turn your contribution from "helpful" to "necessary for the scheme's validity."

  ### The Verdict I Must Overturn

  To keep this principle tight and consistent, I have to call you out on one of your "Fine" verdicts.

  **You said:** *"Chucking the odd bit of plastic in the general bin instead of rinsing it for recycling. Fine, more or less."*
  **My Principle says:** **Not Fine.**

  **Why:** You marked the **Fishery Quota** as "Still wrong, I reckon, even though the collapse happens regardless."
  Recycling is the exact same structure as the Fishery. It is a municipal cooperative scheme. The rule is: "We collect, you sort." The benefit is a cleaner environment and lower council costs. The cost is rinsing plastic.
  If you say cheating the fishery quota is wrong because it violates the rules of the scheme, you cannot consistently say cheating the recycling scheme is fine. The fact that "one bit of plastic" doesn't change the outcome is the same logic as "one boat" not changing the collapse.
  You likely feel recycling is "Fine" because enforcement is low and the harm is invisible. But under the **Cooperative Scheme Membership** principle, if the Fishery is wrong, Recycling is wrong. You are free-riding on your neighbors who do rinse.

  ### Summary
  Stop looking at whether your action changes the outcome. Start looking at whether you have entered a **room** where there are rules.
  *   **Wikipedia:** You're standing on the sidewalk outside. No rules.
  *   **Coffee/Rota/Project:** You're inside the room. You follow the house rules.
  *   **Recycling:** You're inside the civic room. Follow the rules (contrary to your intuition).

  If you accept this, you stop agonizing about impact and start honoring your agreements.
