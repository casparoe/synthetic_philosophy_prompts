answer: |-
  Here are the desiderata for a theory of content's causal efficacy, structured by the cases it must handle, the distinctions it must preserve, and the physical constraints it must respect.

  ### I. Adequacy Conditions (The Desiderata)

  **1. The Simmball Discrimination Condition**
  *   **Requirement:** The theory must determine whether the internal coding of the simmballs exerts a causal influence on the trajectory of the steel balls distinct from the influence of the simmballs' mass and momentum.
  *   **Motivation:** In the stadium machine, the simmballs track the steel balls. If the simmballs collide with steel balls, physics dictates the outcome based on mass and velocity. If the *code* inside the simball also determines the outcome, there must be a mechanism by which "meaning" modifies force. The theory must specify whether the representational description is merely a lossless compression of the physical history or a causal factor in the next state of the machine.

  **2. The Neural Intuition Condition**
  *   **Requirement:** The theory must accommodate the strong pre-theoretic intuition that in ordinary neural systems (like humans), representational states (beliefs, desires) are difference-makers for behavior.
  *   **Motivation:** Unlike the simmball machine, where the causal role of symbols is dubious, in human agency we operate under the assumption that *what* we think matters, not just *that* we think. A theory that renders human deliberation causally inert contradicts the foundational data of psychology and folk practice. The theory must explain why we treat neural content as efficacious even if the simmball content is not.

  **3. The Floating Content Condition**
  *   **Requirement:** The theory must distinguish between states that genuinely represent and states that are merely reliably correlated with distal conditions but lack causal efficacy qua content.
  *   **Motivation:** Consider a tree's ring count correlating with the tree's age, or a thermostat correlating with room temperature. These track information but seem to lack "content" that drives the system in the way a belief drives an action. The theory must explain why some correlations (neural/simmball) are candidates for causal efficacy while others (rings/thermostats) are not, without appealing merely to complexity.

  **4. The Production/Explanation Distinction**
  *   **Requirement:** The theory must distinguish between *causal production* (the physical mechanism generating an effect) and *causal explanation* (the description that makes the cause intelligible).
  *   **Motivation:** We can explain the pinball's path by citing the simmball's code, even if the code didn't *produce* the path. A viable theory must not conflate the utility of a description with the ontology of causation. If content only explains, the theory must say so; if it produces, it must show how.

  **5. The Content/Vehicle Distinction**
  *   **Requirement:** The theory must distinguish between causation by a state's *physical realizer* (its vehicle) and causation by its *semantic properties* (its content).
  *   **Motivation:** A neural firing causes a muscle contraction because of its electrochemical properties (vehicle). It causes a *reaching* movement because of what it represents (content). If the theory collapses this distinction, it cannot answer whether the *symbolic level* does work; it merely reduces to a theory of physical causation.

  **6. The Physical Closure Constraint**
  *   **Requirement:** The theory must remain consistent with the causal completeness of the physical domain and conservation laws (energy/momentum).
  *   **Motivation:** Current physics suggests that every physical event has a sufficient physical cause. If content is non-physical (or distinct from the physical realizer), it cannot inject new energy into the system. Any theory positing content efficacy must explain how symbols "push" without violating conservation laws or necessitating systematic overdetermination.

  ---

  ### II. Analysis of Requirements

  **Non-Negotiable vs. Parochial**
  *   **Non-Negotiable:** The **Physical Closure Constraint** is non-negotiable for any theory aspiring to scientific naturalism; violating conservation laws is a dealbreaker. The **Content/Vehicle Distinction** is non-negotiable for the specific question asked; if you collapse them, you have answered the question by dissolving it (reductionism), not by explaining content's efficacy. The **Production/Explanation Distinction** is non-negotiable to avoid category errors.
  *   **Parochial:** The **Neural Intuition Condition** is parochial to realists about folk psychology. An eliminativist camp would argue this intuition is false and should be discarded. The **Simmball Discrimination Condition** assumes there is a fact of the matter about the simmballs; a pragmatic camp might argue efficacy is relative to the observer's interests, not an intrinsic feature of the machine.

  **The Joint Unsatisfiability (The Squeeze)**
  There is a subset of non-negotiable requirements that appears jointly unsatisfiable. This is the core of the **Causal Exclusion Problem**.

  1.  **Content Efficacy:** Content properties make a genuine difference to outcomes (distinct from mere description).
  2.  **Physical Closure:** Every physical effect has a sufficient physical cause.
  3.  **Non-Identity:** Content properties are not identical to physical realizer properties (otherwise, it's just physics).

  **The Verdict on Consistency:** These three cannot all be met.
  *   If Content Efficacy is true, and Physical Closure is true, then the physical cause and the content cause compete for the same effect.
  *   To avoid systematic overdetermination (two sufficient causes for one effect), one must exclude the other.
  *   Since Physical Closure is non-negotiable (science), the Content cause is excluded.
  *   **What is doing the squeezing?** The demand for **Content Efficacy** (specifically, that content makes a difference *over and above* the physical realizer) is being squeezed by the **Physical Closure Constraint**. You can have content efficacy only if you reduce content to physics (violating Non-Identity) or if you deny physical closure (violating science). You cannot have content as a distinct, non-redundant causal power in a closed physical world.

  ---

  ### III. Verdict on Four Familiar Stances

  **1. Epiphenomenalism (Denies Content Role)**
  *   **Verdict:** Satisfies Physical Closure and the Content/Vehicle distinction easily, but fails the Neural Intuition Condition. It treats the simmball code and human beliefs as causally inert byproducts, preserving physics at the cost of agency.

  **2. Type Identity Theory (Ties Efficacy to Realizer)**
  *   **Verdict:** Satisfies Physical Closure and Neural Intuition by identifying content with physical states. However, it collapses the Content/Vehicle distinction; content is efficacious only *as* physics, not *qua* content. It solves the squeeze by denying Non-Identity.

  **3. Probabilistic/Counterfactual Theories**
  *   **Verdict:** Attempts to soften the Production/Explanation distinction by defining causation in terms of probability raising. It struggles with Physical Closure, as it must explain how content changes probabilities without changing physical propensities. It often ends up making content efficacy too weak to satisfy the Neural Intuition Condition.

  **4. Real Pattern/Structural Realism (e.g., Dennett)**
  *   **Verdict:** Dissolves the Production/Explanation distinction, arguing that "real patterns" are as real as the noise they compress. It satisfies the Simmball Condition by granting the code reality relative to an interpreter, but risks making efficacy observer-relative, which may violate the objective spirit of the Physical Closure Constraint.
