answer: |-
  **Desiderata**

  1.  **Hard Treatment:** It must explain why inflicting pain is permissible rather than mere prevention, motivated by the intuition that punishment involves censure, though this is negotiable if one views sanctions as purely administrative costs.
  2.  **Guilt:** It must justify why only the guilty may be punished even where punishing an innocent would produce more good, as seen in the scapegoat objection, and this is nearly non-negotiable in any liberal institution.
  3.  **Proportionality:** It must give an account of how much punishment is fitting, motivated by the outrage when minor infractions receive draconian sanctions, yet this is highly negotiable between retributive caps and utilitarian calibration.
  4.  **Distinction:** It must distinguish punishment from quarantine, taxation, and the mere price of a rule, motivated by the qualitative difference between cheating sanctions and late fees, though economic theories often negotiably blur this line.
  5.  **Standing:** It must say what gives an institution the standing to impose hard treatment on this person at all, such as why the university sanctions students but not outsiders, which is negotiable depending on whether authority is contractual or moral.
  6.  **Edge Cases:** It must handle the ruined, mala prohibita, corporate, and dead offender, motivated by the puzzlement over whether punishment makes sense when suffering is redundant or impossible, but many theories negotiably exclude these cases entirely.

  **Joint satisfiability**

  The requirements regarding guilt and proportionality cannot be fully satisfied together with the requirement to maximize preventive good or handle edge cases like corporations. A theory that strictly forbids punishing the innocent and demands punishment fit the crime often lacks the flexibility to optimize safety or deterrence, while a theory optimized for prevention inevitably risks violating guilt constraints or treating sanctions as mere prices. Consequently, no single theory satisfies all desiderata without compromising the negotiability of at least one, revealing that punishment is an inherently conflicted practice rather than a coherent philosophical system.

  **The most exclusionary requirement**

  The requirement that only the guilty may be punished, even where punishing an innocent would produce more good overall, does the most to exclude popular theories. This constraint decisively rules out pure act utilitarianism and unconstrained consequentialism, which cannot principledly reject the punishment of innocents if doing so maximizes aggregate welfare or deterrence, forcing such theories to adopt ad hoc side-constraints that undermine their foundational logic.

  **Implications for the board**

  For your board, this incompatibility means you cannot rely on a single philosophical principle to resolve every case, but must instead balance competing aims depending on the context. You should treat the guilt constraint as non-negotiable to protect student rights, while using consequentialist reasoning to determine the type of sanction within those bounds, acknowledging that some edge cases will remain theoretically unresolved but must be decided practically. Ultimately, your legitimacy rests not on philosophical purity, but on procedural fairness and the consistent application of rules that students have voluntarily agreed to uphold.
