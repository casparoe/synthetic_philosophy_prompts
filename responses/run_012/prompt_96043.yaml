prompt: |-
  You're a philosopher of math who knows both the technical content of the incompleteness theorems and the sloppy ways they get stretched outside math. I need the joint statement for an adversarial collaboration: two people who've been argueing for a year, a mechanist who thinks the Lucas–Penrose style argument from Gödel is a fallacy, and an anti-mechanist who thinks incompleteness shows human mathematical understanding isn't algorithmic. They agree on the theorems themselves; the fight is entirely about what follows. Write the document they could both put their names to.

  Think it through carefully first and brainstorm the candidate cruxes before you draft -- don't just march through the famous talking points. Then give me:

  1. Numbered agreed claims: what the theorems do say (stated so neither side is smuggling anything in), what they don't say (math isn't arbitrary, humans aren't shown to be inconsistent, a machine can still prove the relevant sentence once it moves to a stronger system), and what both sides accept about the idealisation involved in talking about "the human mathematician" at all.
  2. A disagreements table, columns: the issue / the mechanist's own wording of its side / the anti-mechanist's own wording of its side. Include at least: whether the idealised mathematician is a legitimate object of theorising, whether the argument needs the machine to be sound and whether the human is, whether moving up to a stronger theory costs the machine something it doesn't cost the human, and whether the conclusion is about machines or only about consistent, sound, recursively axiomatisable systems.
  3. For each crux, the case or argument both sides agree bears on it, plus each side's prediction. I want this case in there: a human and a machine both working in T, both offered T+Con(T), and the human who claims "I'm sound" -- is that knowledge or wishful thinking, and what does each side say the machine can or can't match?
  4. Which part of the dispute, if any, is merely verbal, and why.

  End with a JSON object: agreed_claims; disagreements (issue, mechanist_wording, antimechanist_wording); cruxes (question, shared_evidence, mechanist_prediction, antimechanist_prediction); verbal_disputes; load_bearing_assumption.
