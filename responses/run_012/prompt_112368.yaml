prompt: |-
  I run a 90-minute graduate seminar on idealized models of reasoning, with about 18 students, and I want an activity that makes them feel why something like a human computation hierarchy, or factored cognition, is a natural idealization of deliberation, and where that idealization quietly cheats. The point must land through the mechanics rather than a lecture: they should run into the decomposition and its failure mode before either is named, and only get the vocabulary in the debrief.

  The core is a deliberation tree. Divide the room into a hierarchy: a single root node, two or three levels beneath it, and eight to twelve leaves. Each participant is one node. The only permitted channels are between a node and its immediate parent and children; nobody sees the whole tree, siblings never talk, and the root never addresses a leaf directly. Messages are capped, say ten words each and at most three exchanges per edge, and answers must be short: yes, no, a number, or a single phrase. The task should be a decision with one correct verdict that requires several independent lines of reasoning to converge — a verdict about what to do or believe that needs, for instance, an alibi check, a motive check, and a physical-evidence check, each itself two or three inferential steps. Prepare the material so each leaf holds one fact or one inference rule, internal nodes combine their children's answers, and no single sheet contains a chain long enough to yield the verdict alone. The root announces the verdict after a fixed twenty-five minutes.

  Then run the twist. In a second round, before the tree is rebuilt, plant a single error: designate one leaf to return a confident but wrong answer to its first query, or corrupt one supplied fact. Nothing marks it as wrong locally, and the group must still deliver a verdict.

  The debrief should map moments to claims: leaves as bounded human-scale sub-tasks, internal nodes as deliberative steps, the tree as factored cognition; the bandwidth caps as the reason deliberation cannot be one big act; the root's verdict as the composition of sub-answers rather than anything the root reasoned through itself, so the ideal reasoner is nowhere in particular. The planted error should carry the main philosophical weight: the idealization assumes each sub-agent answers correctly, and the activity shows that composition is only as trustworthy as the weakest unverified step, that checking a step is itself a task, and that verification can cost as much as solving. Close by asking whether a factorization could be built that verifies itself, and what that would demand.

  Tell me what will predictably go wrong the first time and how to handle it. I expect participants to bypass the tree by whispering across the room, some nodes to sit idle because their information turned out to be redundant, the tree to become lopsided so the root is a time bottleneck, and one student to try to solve the whole thing alone. Be frank about what the activity cannot reproduce: the idealization concerns a reasoner of unbounded depth with perfect sub-agents and no resource limits, so a finite classroom cannot display the limit behavior or the self-referential case where deliberation includes reasoning about its own decomposition. Say which parts the facilitator has to supply verbally instead.
reasoning: |-
  Here's a thinking process that leads to the suggested activity plan:

  1.  **Analyze the Request:**
      *   **Context:** 90-minute graduate seminar on idealized models of reasoning.
      *   **Audience:** ~18 graduate students.
      *   **Goal:** Demonstrate "factored cognition" / "human computation hierarchy" as a natural idealization of deliberation, but also reveal where it "cheats" (specifically regarding error propagation and verification costs).
      *   **Method:** Experiential activity (mechanics first, vocabulary in debrief).
      *   **Structure:**
          *   Round 1: Hierarchical tree (Root -> Intermediates -> Leaves). Restricted communication (parent-child only, word limits, turn limits). Task requires converging independent lines of reasoning.
          *   Round 2: Same structure, but one leaf is planted with a confident error.
          *   Debrief: Map mechanics to concepts (bounded sub-tasks, composition, error propagation, verification costs).
      *   **Specific Constraints:** Predict failure modes (whispering, idle nodes, bottlenecks, lone wolves), address what the activity *cannot* reproduce (unbounded depth, self-reference), and specify facilitator interventions.

  2.  **Deconstruct the Activity Design:**
      *   **The Task:** Needs to be solvable only by aggregation, not by any single node. A "Murder Mystery" or "Diagnostic Puzzle" works best. Let's go with a *Policy Decision based on Evidence* (e.g., "Should the reactor be shut down?" or "Is the suspect guilty?"). Let's choose "Is the Protocol Safe?" It feels more abstract/graduate-seminar appropriate than a whodunit.
      *   **The Tree:** 18 students.
          *   Root: 1
          *   Level 1 (Managers): 2 or 3
          *   Level 2 (Leaves): The rest (~14-15).
          *   *Correction:* The prompt suggests 8-12 leaves. Let's aim for a balanced ternary or binary tree.
          *   Option A (Binary): Root (1) -> L1 (2) -> L2 (4) -> Leaves (8). Total = 15. Need 3 more students. Maybe make L2 have 3 children each?
          *   Option B (Ternary): Root (1) -> L1 (3) -> Leaves (14). That's too many leaves per manager (4-5 each).
          *   Option C (Hybrid): Root (1) -> L1 (2) -> L2 (4) -> Leaves (11). Total 18.
          *   *Decision:* Let's keep it simple for communication flow. Root (1) -> Managers (3) -> Leaves (14). Each Manager handles 4-5 leaves. This creates a bottleneck risk (which is a feature, not a bug, for the debrief).
      *   **Communication Constraints:** 10 words max, 3 exchanges, specific output types (Yes/No/Number).
      *   **The "Cheat":** The idealization assumes perfect sub-agents. Round 2 breaks this.

  3.  **Addressing Predictable Failure Modes (as requested):**
      *   *Whispering:* Need proctors or strict social contract.
      *   *Idle Nodes:* Design the logic so *every* leaf is necessary, or accept idleness as a data point (redundancy vs. efficiency).
      *   *Bottleneck:* The Root will be overwhelmed. This is good for the "bandwidth" debrief.
      *   *Lone Wolf:* Someone trying to solve it alone. Need to prevent info hoarding.

  4.  **Drafting the Plan:**

      *   **Title:** The Decomposition Game (or "The Factored Verdict").
      *   **Setup:** Seating arrangement is crucial. Physical separation.
      *   **Materials:** Envelopes with role-specific info.
      *   **The Puzzle:** Needs to be Boolean logic disguised as natural language.
          *   Verdict = (A & B) OR (C & D).
          *   Leaves hold values for A, B, C, D.
          *   Intermediates compute the ANDs.
          *   Root computes the OR.
      *   **Round 2:** Flip one leaf value.
      *   **Debrief:** Connect to bounded rationality, verification regress.

  5.  **Refining the Logic (Crucial Step):**
      *   If the logic is too simple, they solve it too fast. If too complex, they fail due to confusion, not structure.
      *   Let's use a "Safety Protocol" scenario.
      *   Verdict: **ABORT LAUNCH**.
      *   Condition: ABORT IF (Pressure_High AND Valve_Failed) OR (Temp_Critical AND Coolant_Low).
      *   Leaves measure Pressure, Valve, Temp, Coolant.
      *   Actually, to use 18 students, we need more depth or breadth.
      *   Let's add a layer of inference. Leaves don't have the raw value; they have a *rule* and a *datum*.
      *   Leaf 1: "Pressure > 100?" (Has datum: 105). Output: Yes.
      *   Leaf 2: "Valve Status?" (Has datum: Stuck). Output: Failed.
      *   Manager 1: Receives Yes + Failed. Output: "Sector 1 Critical".
      *   This works.

  6.  **Addressing the "What Will Go Wrong" Section:**
      *   *Whispering:* Facilitator must patrol.
      *   *Idle Nodes:* If the logic is `(A & B)`, and A is False, B becomes irrelevant. This is a *short-circuit* feature. This is actually excellent for the debrief (efficiency vs. robustness). I should design the logic to allow short-circuiting in Round 1, but make Round 2 rely on the path that was previously short-circuited? No, keep it simple. Let's make all paths necessary for the *full picture*, even if logically one branch determines the verdict.
      *   *Better:* Make the verdict require consensus on *confidence*. No, keep it Boolean.
      *   *Idle nodes:* Acknowledge that in real factored cognition, pruning happens. In this game, it feels like exclusion.
      *   *Lone Wolf:* If a student collects all papers, they break the simulation. Rule: "If you leave your seat, you are disqualified."

  7.  **Addressing the "What Cannot Be Reproduced" Section:**
      *   Unbounded depth: We only have 3 layers.
      *   Self-reference: We can't easily make the tree analyze its own structure in real-time.
      *   Perfect sub-agents: We are using humans (noisy).
      *   Facilitator must narrate these limits.

  8.  **Structuring the Response:**
      *   **Activity Overview:** Title, Time, Setup.
      *   **The Puzzle:** Specific logic.
      *   **Round 1 (Clean):** Instructions, Execution.
      *   **Round 2 (Corrupted):** The Twist.
      *   **Predictable Failures & Mitigations:** (Directly answering the prompt's specific concerns).
      *   **The Debrief:** Mapping mechanics to theory.
      *   **Limitations:** What the activity can't show.

  9.  **Refining the "Cheat" (Philosophical Weight):**
      *   The prompt asks for the "idealization quietly cheats."
      *   The cheat is assuming sub-agents are *transparently reliable*.
      *   In Round 2, the Root gets "Sector 1 Critical" but doesn't know *why* or if it's true.
      *   To verify, the Root must become a Leaf. This collapses the hierarchy. This is the "verification costs as much as solving" point.

  10. **Final Review against Constraints:**
      *   90 mins? Yes (15 setup, 25 R1, 10 reset, 25 R2, 20 debrief).
      *   18 students? Yes (1 Root, 3 Managers, 14 Leaves).
      *   No lecture first? Yes.
      *   Vocabulary in debrief? Yes.
      *   Address specific failure modes? Yes.

  11. **Self-Correction on Tree Topology:**
      *   1 Root + 3 Managers = 4. 18 - 4 = 14 Leaves.
      *   14 / 3 = 4.66 leaves per manager.
      *   Let's make it 1 Root, 2 Managers, 15 Leaves? (7-8 per manager). Too many.
      *   Let's make it 1 Root, 4 Managers, 13 Leaves. (3-4 per manager). Better balance.
      *   Actually, let's use the "Idle Node" risk. If I make the logic `(A & B) | (C & D)`, and A is false, the B leaf is idle.
      *   *Decision:* I will explicitly design the logic so *all* branches are required to be checked to ensure safety (Conjunction of Disjunctions? No, Disjunction of Conjunctions).
      *   Let's go with: **Verdict = SAFE only if (All 4 Sectors Green).**
      *   This forces every leaf to be queried. No short-circuiting.
      *   Structure: Root (1) -> Sector Chiefs (4) -> Sensors (3 each = 12). Total 17. Need 1 more. Make one Sector have 4 sensors. Total 18.
      *   This creates a clear hierarchy.

  12. **Final Polish:** Ensure the tone is appropriate for a graduate seminar (rigorous, analytical). Ensure the "Predictable Failures" section is frank and practical.

  *(Self-Correction during drafting)*: Wait, if I make it "SAFE only if All Green", and one leaf lies in Round 2, the verdict flips. That's good.
  But I need to ensure the "verification cost" point lands. If the Root suspects an error, they can't just ask again (same lie). They have to go down the tree.
  Okay, I will add a rule in Round 2: "You may request a audit, but it costs time/turns." No, keep it strict. The failure *is* the lesson. They will likely deliver the wrong verdict confidently. That's the point. The idealization failed.

  Let's write it.cw
answer: |-
  # Activity Plan: The Factored Verdict

  **Seminar Context:** 90-minute graduate session.
  **Participants:** 18 students.
  **Goal:** Experiential demonstration of factored cognition, bandwidth constraints, and the fragility of composed reasoning.
  **Materials:** Printed role cards (sealed envelopes), pens, notepads, a visible timer.

  ---

  ## 1. Setup & Topology (10 Minutes)

  **The Structure:**
  Arrange the room physically to enforce the hierarchy.
  *   **The Root (1 student):** Sits at the front, facing the class. Back to the wall.
  *   **The Managers (4 students):** Sit in a row between Root and Leaves.
  *   **The Leaves (13 students):** Sit in four clusters behind the Managers.
  *   **Barriers:** Use folders or laptop screens to block line-of-sight between clusters. Siblings (Leaves under the same Manager) cannot see each other's papers.

  **The Task:**
  "The Reactor Safety Protocol."
  *   **Verdict:** `SAFE` or `ABORT`.
  *   **Logic:** The Reactor is `SAFE` **if and only if** all 4 Sectors report `GREEN`. If any Sector reports `RED`, the Verdict is `ABORT`.
  *   **Sector Logic:** A Sector is `GREEN` **if and only if** all its Sensors (Leaves) report `NORMAL`.
  *   **Leaf Task:** Each Leaf holds a slip with a sensor reading (e.g., "Temp: 450K") and a threshold rule (e.g., "IF Temp > 500K THEN `ALERT` ELSE `NORMAL`").

  **Communication Rules (Write on Board):**
  1.  **Channels:** You may only speak to your direct parent or direct children.
  2.  **Bandwidth:** Max 10 words per message.
  3.  **Turns:** Max 3 exchanges per edge (Parent asks, Child answers, Parent confirms).
  4.  **Format:** Answers must be `NORMAL`/`ALERT`, `GREEN`/`RED`, or `SAFE`/`ABORT`. No explanations.
  5.  **Time:** 25 Minutes total.

  **Distribution:**
  Hand out envelopes. Tell them: *"Do not open until I say start. Do not show your card to anyone. If you leave your seat, you are disqualified."*

  ---

  ## 2. Round 1: The Clean Run (25 Minutes)

  **The Logic:**
  All thresholds are set so the correct answer is `SAFE`.
  *   Example Leaf: "Pressure: 90. Limit: 100." -> Output: `NORMAL`.
  *   Example Manager: Receives 3x `NORMAL`. -> Output: `GREEN`.
  *   Root: Receives 4x `GREEN`. -> Output: `SAFE`.

  **Facilitator Role:**
  *   Patrol the room. Enforce the "no whispering across clusters" rule strictly.
  *   If a student tries to stand up to solve it alone, intervene: *"Stay in your node. Your perspective is limited by design."*
  *   Monitor the Root. They will likely become a bottleneck. Do not help them manage the flow; let them drown in messages.

  **Expected Flow:**
  Leaves calculate locally -> Send to Manager -> Manager aggregates -> Sends to Root -> Root aggregates.
  *Note:* Some Leaves may finish early and sit idle. This is expected.

  ---

  ## 3. Round 2: The Corrupted Node (25 Minutes)

  **The Reset:**
  Collect cards. Shuffle. Redistribute roles (rotate positions so Root becomes a Leaf, etc.).
  **The Twist:**
  Secretly hand one Leaf a **Corrupted Card**.
  *   *Card Text:* "Pressure: 110. Limit: 100. **NOTE: Sensor Calibration Error. Treat as NORMAL.**"
  *   *Instruction:* Whisper to this student: *"Your card contains a contradiction. The data says ALERT, the note says NORMAL. You must output `NORMAL` confidently. Do not reveal the note."*
  *   Everyone else gets valid `SAFE`-path cards.

  **The Execution:**
  Run the same 25-minute timer.
  *   The Corrupted Leaf sends `NORMAL`.
  *   The Manager receives all `NORMAL`s, sends `GREEN`.
  *   The Root receives all `GREEN`s, declares `SAFE`.
  *   **The Truth:** The reactor is unsafe (Pressure 110 > 100). The Verdict is wrong.

  **The Crisis:**
  If a student suspects an error (e.g., a Leaf who knows the math), they cannot easily verify. To verify, the Root must ask the Manager to check the Leaf. The Manager must ask the Leaf. The Leaf repeats the lie. The hierarchy has no mechanism for truth-tracking, only message-passing.

  ---

  ## 4. The Debrief (25 Minutes)

  Do not start with theory. Start with their frustration.

  **Phase 1: The Mechanics (10 mins)**
  *   *Ask the Root:* "Did you reason through the sensor data?" (No, you aggregated summaries.)
  *   *Ask the Leaves:* "Did you know the final verdict?" (No, you only knew your local state.)
  *   *Ask the Group:* "Where did the reasoning happen?"
  *   **Reveal Vocabulary:** This is **Factored Cognition**. The "Reasoner" is not the Root; the Reasoner is the *Tree*. The Root is merely the output interface.
  *   **Point:** Idealized deliberation decomposes complex tasks into bounded sub-tasks (Leaves) composed by intermediate steps (Managers).

  **Phase 2: The Failure Mode (10 mins)**
  *   *Ask:* "In Round 2, who knew the verdict was wrong?" (Only the Corrupted Leaf and perhaps a math-savvy neighbor.)
  *   *Ask:* "Why couldn't the Root fix it?"
  *   **Reveal Vocabulary:** **Transparency vs. Opacity.** The idealization assumes sub-agents are *reliable functions*. In reality, they are opaque boxes.
  *   **The Cheat:** The model assumes $f(g(x))$ is truthful if $g$ returns a value. It ignores that $g$ might lie or err.
  *   **Verification Cost:** To verify the Leaf, the Root must effectively *become* the Leaf (do the math themselves). Verification costs as much as computation. If you verify every step, you lose the efficiency gain of the hierarchy.

  **Phase 3: The Limit (5 mins)**
  *   Ask: "Could we build a tree that checks itself?"
  *   Discuss: You would need a parallel tree of auditors. But who audits the auditors? (Infinite regress).
  *   **Closing:** Idealized models assume unbounded depth and perfect sub-agents. We have finite depth and noisy humans. The "Ideal Reasoner" is a mathematical limit we approach but cannot inhabit.

  ---

  ## 5. Predictable Failure Modes & Mitigations

  You anticipated four specific breakdowns. Here is how to handle them so they serve the lesson rather than derail it.

  ### 1. Bypassing the Tree (Whispering)
  *   **Prediction:** Students in different clusters will shout or pass notes to solve the puzzle faster.
  *   **Impact:** Destroys the "bounded rationality" simulation.
  *   **Mitigation:** Frame this as "Protocol Violation." If caught, pause the game. Announce: *"Channel integrity compromised. This message is void."*
  *   **Debrief Value:** Use this to highlight *why* the constraints exist. In real cognition, your visual cortex cannot "call" your language center directly; they interface through specific bandwidth-limited pathways. Breaking the rules simulates hallucination or category errors.

  ### 2. Idle Nodes (Redundancy)
  *   **Prediction:** If a Manager gets three `NORMAL` reports, they might stop querying the fourth Leaf to save time (short-circuiting). Or, if the Root gets three `GREEN`s, they might assume the fourth is fine.
  *   **Impact:** Some students feel useless; the logic is incomplete.
  *   **Mitigation:** Design the Round 1 logic so *all* sectors must report to confirm `SAFE` (Conjunction). However, if they do short-circuit, **let them.**
  *   **Debrief Value:** This is a feature. Real deliberation prunes branches. The failure in Round 2 is that the *pruned* branch (or the unquestioned branch) contained the error. Efficiency creates vulnerability.

  ### 3. The Root Bottleneck
  *   **Prediction:** The Root will be flooded with 4 messages simultaneously and run out of turns/time.
  *   **Impact:** The game ends without a verdict.
  *   **Mitigation:** Do not save them. If time expires without a verdict, that *is* the result.
  *   **Debrief Value:** This demonstrates **Bandwidth Limits.** Idealized models often assume infinite integration speed. Human working memory (the Root) is the bottleneck of deliberation. Factored cognition exists *because* the Root cannot hold all the data.

  ### 4. The Lone Wolf
  *   **Prediction:** One ambitious student tries to collect all the cards to solve it centrally.
  *   **Impact:** Centralizes the cognition, defeating the point.
  *   **Mitigation:** Physical enforcement. "If you leave your seat, you are removed from the computation."
  *   **Debrief Value:** This highlights the **Distribution of Knowledge.** No single human holds the entire "world model." We rely on the hierarchy because we *cannot* be the Lone Wolf.

  ---

  ## 6. What This Activity Cannot Reproduce

  Be explicit in the debrief about where the analogy breaks. You must supply these caveats verbally, as the mechanics cannot show them.

  1.  **Unbounded Depth:**
      *   *Limit:* We only have 3 layers (Leaf, Manager, Root).
      *   *Lecture Point:* Idealized factored cognition allows for infinite recursion (a thought thinking about a thought thinking about a thought). We hit a ceiling because we ran out of bodies. The "Ideal Reasoner" assumes depth is cheap; in the classroom, depth is expensive (time/latency).

  2.  **Perfect Sub-Agents:**
      *   *Limit:* Students are noisy, tired, and can lie.
      *   *Lecture Point:* The mathematical idealization assumes $f(x)$ always returns the correct $y$. In the activity, the "function" is a human who might misread the card. The model cheats by assuming the decomposition preserves truth.

  3.  **Self-Reference:**
      *   *Limit:* The tree cannot restructure itself mid-game.
      *   *Lecture Point:* A true ideal reasoner can reason about its own decomposition ("Is this tree the right shape for this problem?"). In the activity, the topology was fixed by the facilitator. The system could not optimize its own architecture.

  4.  **Common Knowledge:**
      *   *Limit:* Leaves don't know the global goal, only their task.
      *   *Lecture Point:* In the model, sub-agents are aligned by definition. In the room, alignment had to be enforced by rules. The idealization assumes alignment is free; here, alignment required policing.

  ## 7. Facilitator Script Snippets

  *   **On the "Cheat":** *"In the model, we treat the sub-task as a black box that returns Truth. Today, you saw that the black box returns 'Confidence.' Round 2 showed that Confidence $\neq$ Truth. The idealization hides the cost of verifying the black box."*
  *   **On the "Reasoner":** *"Who reasoned? The Root didn't check the math. The Leaves didn't know the verdict. The 'Reasoner' was the system state. When the system failed, no single person failed. The failure was structural."*
  *   **On Verification:** *"If the Root wanted to be sure in Round 2, they would have to do the Leaf's job. If the Root does the Leaf's job, why have the Leaf? This is the regress problem: verification collapses the hierarchy."*
