answer: |-
  **The Registry of Unwalked Paths**

  The Chancery sat upon the highest peak of the Obsidian Range, where the air was too thin for casual breath and the silence was heavy enough to crush a lesser institution. Inside the Hall of Records, the light was perpetual and grey, filtered through alabaster panes that softened the sun into a colourless wash. There were no windows looking out, only shelves looking in, stacked floor to ceiling with the Ledger.

  The Ledger was not a single book, but a continuum of bound volumes, leather darkened by centuries of handling. It contained the history of what was, but more importantly, it contained the history of what would be, conditional upon the setting of the stage. For any soul, living or unborn, and for any fully specified arrangement of circumstances, the Ledger recorded the action that soul would freely take.

  Master Archivist Vane stood before a lectern, her fingers hovering over a page that smelled of ozone and old dust. Beside her stood Corin, a novice of sharp eyes and sharper tongue. He had been at the Chancery for three years, long enough to know the rules, and too short a time to accept them.

  "It says here," Corin said, tapping the page, "that if Elias Thorne were to be born in the year 1890, in the village of Oakhaven, and found a wallet containing fifty pounds on his twentieth birthday, he would return it to the owner."

  "It does," Vane replied. Her voice was dry, like paper rubbing against paper.

  "But Elias Thorne does not exist," Corin said. "We have not instantiated him. We are currently debating whether to weave him into the tapestry at all. If he is not there, who is doing the returning? What makes this statement true?"

  This was the question that haunted the novitiates. It was the question of grounding.

  "The truth of the entry does not depend on the existence of the person," Vane said, turning a page. The ink did not smear; it seemed to sit on the surface of the parchment like oil on water. "Nor does it depend on our will. We cannot will the entry to change. The Founders tried once, in the Second Age. They sought to amend a prediction regarding a king's mercy. The ink refused to dry. The truth stood firm against their command."

  "So it hangs in the air," Corin pressed, leaning closer. "A truth about a man who is nothing but a concept. It is not caused by the man, for he is not. It is not caused by the circumstances, for we have not yet arranged them. It is not caused by the Chancery, for you say we cannot alter it. Where does it live, Mistress Vane? What anchors it?"

  Vane looked up from the Ledger. Her eyes were tired. "It lives in the nature of freedom itself. To be a free creature is to be a certain kind of thing. If you are that kind of thing, placed in that specific light, with that specific hunger, you will choose. The Ledger merely reads the shape of the choice before the choice is made. It is knowledge that precedes the decision to create."

  "That is mysticism," Corin said, though he lowered his voice. "You are asking us to build a world on shadows. We are about to decide whether to bring Elias Thorne into being based on a shadow."

  "We bring him into being because the world requires a man who returns wallets," Vane said softly. "There are other entries. If he is born in Oakhaven but finds the wallet on a rainy Tuesday, he keeps it. If he is born in the city, he never finds it at all. We must choose the circumstances that align with the good we intend."

  "And if we choose wrong?"

  "Then the entry was true, and the outcome is ours to bear. But the truth remains independent of our bearing it."

  Corin stepped back, shaking his head. He looked at the shelves, stretching into the gloom. Millions of names. Millions of lives that would never be lived.

  "Show me the Null Column," Corin said.

  Vane hesitated. The Null Column was not a section of the Ledger one showed to novices lightly. It was the register of the never-to-be-created. It contained the entries for souls the Chancery had reviewed and decided against instantiating. To read it was to mourn ghosts that had never drawn breath.

  Vane moved to a separate desk, carved from a single block of black stone. She pulled a heavy folio towards her. The pages here were not white, but grey.

  "Subject 8940," Vane said, opening the folio. "Proposed instantiation: Industrial Era, Northern Hemisphere. Circumstances: Poverty, high intelligence, access to chemical supplies."

  She ran a finger down the column. "Entry 44-B: If instantiated under these conditions, Subject 8940 would develop a toxin capable of ending a war within a month. Entry 44-C: If instantiated under these conditions, Subject 8940 would also deploy it against civilian populations, resulting in four hundred thousand deaths."

  Corin read the numbers. They were precise. They were absolute. "So we do not create him."

  "We do not," Vane said. She picked up a stamp made of cold iron. She pressed it onto the page over the subject's name. *NULLIFIED.*

  "It feels like murder," Corin said.

  "It is prevention," Vane corrected, though her hand lingered on the stamp. "But consider the cost. There are entries here for men who would have cured diseases, but only if they suffered a childhood trauma we are unwilling to inflict. There are women who would have written symphonies, but only if they were born in a nation we have decided not to establish. We walk through a garden of possibilities and prune the branches. The cuttings do not bleed, Corin, but the tree is lesser for the pruning."

  "We are playing at being gods," Corin murmured.

  "We are gardeners," Vane said, closing the folio. "The soil is the truth of the Ledger. We merely decide where to plant. Now, go. There is a matter in the lower valley. A citizen has gained access to her own entry."

  Corin blinked. "That is prohibited."

  "Indeed. Yet it has happened. Her name is Martha. She works in the scriptorium. She found a loose leaf slipped between the bindings of a historical chronicle. It contained her name, a date, and a description of an action."

  "What does it say?"

  "That on the coming Sunday, at noon, in the market square, she will freely give her last coin to a beggar."

  Corin frowned. "And?"

  "And Martha is notoriously frugal. She intends to prove the Ledger wrong. She plans to stand in the square at noon, see the beggar, and walk away."

  "If the Ledger is true, she will not walk away," Vane said.

  "If she knows the prediction, the circumstances have changed," Corin argued, seizing the opening. "The entry says 'In circumstances C, she will give the coin'. But now the circumstances are 'C plus knowledge of the entry'. Surely the truth value shifts? If she knows it, she can choose otherwise. That is what freedom is."

  Vane shook her head. "The Ledger is exhaustive, Corin. There is an entry for 'C plus knowledge'. There is an entry for 'C plus knowledge plus intent to defy'. The truth holds across the variation. Go. Watch. Report to me."

  ***

  The market square was bustling, smelling of roasted nuts and damp wool. It was a crisp autumn Sunday. Corin stood in the shadow of the clock tower, his collar turned up against the wind. He watched Martha.

  She was a small woman, dressed in a severe grey coat. She stood near the fountain, her hand clutching the pocket where her coin purse lay. She was staring at the beggar. He was an old man, wrapped in rags, sitting against the stone base of the fountain. He held out a tin cup. It was empty.

  Martha checked her watch. 11:58.

  She was trembling. Corin could see it from here. She was engaged in a war with a piece of paper she had read three days ago. She had told her friends she would keep the coin. She had told herself she would keep the coin. She needed to keep the coin to validate her own will. If she gave it, she was a puppet. If she kept it, she was free.

  11:59.

  Martha took a step forward. Then she stopped. She closed her eyes. She was rehearsing the refusal. *I will not do it. I will not be predicted.*

  The clock began to chime. The first bell rang out, bronze and heavy.

  Martha opened her eyes. She looked at the beggar. The beggar looked up, his eyes cloudy with cataracts. He did not know he was part of a test. He only knew he was hungry.

  The second bell rang.

  Martha's hand moved to her pocket. She gripped the purse. Corin leaned forward. This was the moment of self-defeat. If she could will the opposite of the recorded truth, the entire architecture of the Chancery would crack. The Ledger would be shown as merely a guess, a probability, not a truth.

  The third bell rang.

  Martha pulled the coin out. It was a silver shilling, gleaming in the grey light. She held it up. She looked directly at the clock tower, as if she could see Corin watching. Her face was a mask of anguish. She did not want to give it. Every muscle in her neck strained against the action.

  She stepped toward the beggar.

  *Why?* Corin thought. *You know what is written. You want to prove it false. Why are you doing it?*

  She dropped the coin into the tin cup. It made a bright, singular sound.

  The beggar smiled. "Bless you, miss."

  Martha did not smile. She turned and walked away quickly, her hands shoved deep into her pockets, her shoulders hunched. She looked not like a woman who had performed a charity, but like a woman who had lost a fight.

  Corin waited until she was gone before approaching the beggar. He dropped a coin of his own into the cup.

  "Did she say anything?" Corin asked.

  The beggar shook his head. "Just dropped it. Looked like it hurt her more than losing the money."

  Corin walked back toward the Chancery path. The wind was colder now. He understood what had happened, and the understanding chilled him more than the air.

  When he returned to the Hall of Records, Vane was waiting. She had not moved from the lectern.

  "Well?" she asked.

  "She did it," Corin said. "She gave the coin."

  "As recorded."

  "She hated it," Corin said. "She fought it. I saw her struggle. She knew the prediction. She intended to falsify it. And yet, she acted exactly as the Ledger said."

  "Because the Ledger included her knowledge," Vane said. "The entry was not 'She will give the coin in ignorance'. The entry was 'She will give the coin even if she knows she is predicted to do so, and even if she strives to do otherwise'."

  "Then she is not free," Corin said, his voice rising. "If she cannot do otherwise, even with full knowledge and intent, she is a mechanism. You call this freedom? You call this gardening?"

  "She was free to do otherwise in the sense that no external force compelled her," Vane said. "No one held her hand. No one threatened her. The impulse to give came from within her own character, even if that character was known beforehand. The truth of the action does not cause the action. Her will causes the action. The Ledger simply sees the will."

  "But what if she had read the entry differently?" Corin demanded. "What if she had decided that knowing the entry meant she *must* defy it, and that defiance was stronger than her character?"

  "Then the Ledger would have recorded that," Vane said simply. "There is a volume somewhere where Martha reads the entry and keeps the coin. In that world, we would have arranged different circumstances. Perhaps we would not have let her find the leaf. Perhaps we would have placed the beggar on a different corner. We arrange the scene to match the truth we desire."

  "And the ones we don't create?" Corin asked, thinking of the Null Column. "The Elias Thornes. The Subject 8940s. They have no world. They have no choice. They are just... true statements that never happen."

  "They are possibilities," Vane said. "And we are the curators of possibility."

  "That is a lonely job," Corin said.

  "It is the only job," Vane replied. She turned back to the Ledger. "There is another entry. For you, Corin."

  Corin froze. "For me?"

  "It exists. As it does for all who serve here. It records what you will do when you understand the cost."

  "And what does it say?"

  Vane looked at him, her face unreadable in the grey light. "If I tell you, the circumstances change. The entry becomes void. A new truth takes its place. You would become a different man in that moment."

  "Then don't tell me," Corin said.

  "Then you must choose," Vane said. "Will you stay? Knowing that your path is written in ink that cannot be altered, yet you must walk it with your own feet? Knowing that there are millions of souls in the Null Column who would have loved, and suffered, and created, but were never allowed to be because their truth did not fit the design?"

  Corin looked at the shelves. The silence of the Hall was no longer peaceful; it was heavy with the weight of unwritten lives. He thought of Martha's face in the market square, the anguish of a will that was free yet known. He thought of Elias Thorne, who would return a wallet in a village that did not exist.

  "I will stay," Corin said.

  "Then turn the page," Vane said. "There is work to be done."

  Corin stepped up to the lectern. He placed his hand on the leather. It was warm, as if it had a pulse. He turned the page. The ink shimmered, waiting for the world to catch up to the word.

  ***

  **Author's Note**

  This story dramatises Molinism, the doctrine of divine middle knowledge associated with the sixteenth-century Jesuit Luis de Molina. The Ledger represents God's *scientia media* (middle knowledge): truth about creaturely free actions in specific circumstances, known prior to the decree to create. The Chancery's 'arranging' mirrors divine providence, actualising a world consistent with these truths. The 'Null Column' illustrates non-created possibles, highlighting the moral cost of selecting one world-order over others. Corin's questioning voices the 'grounding objection': what makes these conditional truths true if the creature does not exist? The story offers no resolution, as Molinism posits this as a brute fact. Martha's attempt at self-defeat addresses the compatibility of foreknowledge and freedom; she fails not because she is coerced, but because the truth includes her reaction to knowing it. The position is strongest in preserving libertarian freedom alongside providential control, but most exposed on the metaphysical grounding of counterfactuals of creaturely freedom, left intentionally ambiguous here.
