answer: |-
  Your distinction is a genuine and analytically sharper tool than the standard realism-versus-constructivism divide, though White's critique destabilizes the epistemic security of both ideals rather than privileging invariance as the sole survivor.

  Your fidelity-versus-invariance framework succeeds where the realism-versus-constructivism binary often fails because it separates the *methodological ethic* of the historian from the *sociological outcome* of the discipline. Realism versus constructivism is an ontological fight about whether the past exists independently of the historian; fidelity versus invariance is an epistemological fight about how we validate claims regardless of that ontology. You can be a constructivist who believes all history is shaped by present concerns (Carr) but still demand fidelity (rigorous archival work) as a disciplinary norm, just as you can be a realist who believes in objective truth but admit that invariance (consensus) is the only way we can practically recognize it. This distinction exposes a gap Ranke glossed over: he assumed fidelity automatically produced invariance (if everyone checks the sources, we will agree), whereas your framework allows for the possibility of "idiosyncratic rigor" (high fidelity, low invariance) and "orthodox laziness" (low fidelity, high invariance).

  Regarding which is the better ideal, fidelity must remain the primary ethical imperative for the individual historian, while invariance serves as a necessary but dangerous social check. Fidelity is the core professional virtue because it binds the historian to something outside themselves—the archive—even if that archive cannot speak for itself. Aiming solely at invariance risks conservatism and groupthink, where a story becomes "objective" simply because it is the only one being told (the "secondary account" problem you identified). However, fidelity without any eye toward invariance risks solipsism, where a historian's unique framing renders their work unintelligible or unverifiable by peers. The healthy tension is to practice fidelity rigorously enough to invite invariance, without expecting invariance to guarantee truth.

  White's intervention complicates this by attacking the link between evidence and meaning, which damages fidelity more directly than invariance but ultimately undermines both. For White, sources constrain the *content* (you can't say the Holocaust didn't happen) but not the *form* (you can emplot it as tragedy, satire, or romance); this means fidelity to sources cannot guarantee fidelity to "the past" because the narrative meaning is imposed, not found. This does not, however, leave invariance standing as a secure ideal. If narrative shaping is a poetic act rooted in culture, then invariance among historians may simply reflect a shared cultural tropology rather than a robust encounter with reality. We might all agree on a tragic narrative of the Cold War not because the sources demand it (fidelity) or because it is robust across perspectives (invariance), but because we all inhabit a culture that prefers tragic emplotments for geopolitical history. Thus, White suggests that invariance is not a surviving form of objectivity, but merely a consensus on fiction; it becomes the only ideal left standing only in the pragmatic sense that it is the only metric remaining, not because it successfully tracks truth.
