  The practice presupposes a functional dualism that treats the memorial as a performative promise of communal belonging rather than a constative historical claim, insulating it from evidentiary falsification while relegating empirical accuracy to a parallel scholarly track. This strictly presupposes that memory and history are different practices answering to different standards, because if the memorial were understood as a factual assertion identical to the archive, retaining known errors would constitute institutional dishonesty; therefore, the committee must logically categorize the stone as a non-factual object, likely ritualistic or relational. Your friend's position that a memorial is a promise about the future fits comfortably with this, as does the theory that the community's belief is itself a historical fact (recording the social history of the memory rather than the event), since both justify the stone's immunity to correction without denying the archive's validity. However, the practice is underdetermined regarding whether the committee believes the archive's authority is derivative from the community's practice or merely separate; both theories license the same behavior, though the former implies epistemic arrogance while the latter implies ethical prioritization. The two books are not incompatible if understood as distinct genres serving different stakeholders—one liturgical, one scholarly—making the division of labor defensible within public history ethics that balance accountability with community engagement. If one held that there is a single record where memory must give way, the documentary edition and appendix would survive as the only valid records, while the stone would stand exposed as a monument to error, the "no removal" rule as dogmatic, the addition policy as negligent, and the centennial booklet's narrative as misleading sentimentality. I am highly confident in the diagnosis of functional dualism and the consequences of adopting a single-record theory. The point I am least sure of is whether the committee implicitly views the archive's authority as derivative of community practice or merely as a separate professional obligation unrelated to the memorial's purpose.
