answer: |-
  You have essentially rediscovered a major problem in philosophy called the **Gettier Problem**, and you are wrestling with the difference between **Justified True Belief** and actual **Knowledge**.

  Your current rule ("You know something if you couldn't easily have been wrong about it") is known in epistemology as the **Safety Condition**. It works brilliantly for most everyday cases (the parcel, the liar, the scratchcard).

  However, you are absolutely right that it breaks on the **Cousin/Psychic** case. This is because "There is no biggest number" is a **Necessary Truth**. It is true in every possible universe. Therefore, it is impossible for your cousin to be wrong about *that specific fact*, no matter how stupid his reason is. Your rule says he knows it; your intuition says he doesn't.

  To fix this, you need to tweak the rule to focus on the **method** used to reach the conclusion, not just the conclusion itself.

  ### The Revised Rule

  > **"You know something if, using the method you did, you couldn't easily have ended up with a false belief."**

  By adding **"using the method you did,"** you shift the focus from the *fact* (which might be unchangeable) to the *process* (which might be unreliable).

  Here is how this new rule handles your tricky cases:

  **1. The Cousin and the Psychic (The Fix)**
  *   **The Fact:** "There is no biggest number" (Cannot be false).
  *   **The Method:** Asking a psychic.
  *   **The Test:** If he used this method on a different math question (e.g., "Is 743 a prime number?"), could he easily have been wrong? Yes. Psychics are not a reliable method for mathematics.
  *   **Verdict:** He doesn't know. Even though he couldn't be wrong about *this* number, his method is not safe for *this kind of truth*.

  **2. The Kettle (Keeping the Verdict)**
  *   **The Fact:** The kettle is boiling.
  *   **The Method:** She cited the light, but you noted she also heard rumbling and saw steam. Her *actual* cognitive method included her senses (sound/sight of steam), even if her *spoken* reason was the light.
  *   **The Test:** If the kettle weren't boiling, would there be steam and rumbling? No. Her senses track the truth.
  *   **Verdict:** She knows. Her method (sensory perception) is reliable, even if her explanation was sloppy.

  **3. The Mum and the Feeling (Resolving the Unease)**
  *   **The Fact:** Grandad had a bad turn.
  *   **The Method:** A "feeling" or premonition.
  *   **The Test:** Could she easily have had that feeling when nothing happened? Yes. Feelings are not a reliable method for predicting medical events, even if she has a streak of luck.
  *   **Verdict:** She doesn't know. The unease you feel is your brain recognizing that the method (intuition) isn't safely connected to the truth.

  ### The Tom Case

  Now, let's apply this revised rule to your final scenario.

  *   **The Scenario:** Your mate believes Tom will come because "Tom never misses parties." Tom comes, but only because his car broke down.
  *   **The Fact:** Tom is at the party.
  *   **The Method:** Inductive reasoning based on past habit ("He always comes").
  *   **The Test:** Using the method "He always comes," could your mate easily have been wrong?
      *   Yes. Habits can be broken. Tom could have decided to stay home tonight.
      *   Crucially, the *reason* Tom is there (car breakdown) is not tracked by your mate's method (habit). Your mate's belief relies on Tom's *willingness*, but the truth relies on Tom's *misfortune*.
  *   **Verdict:** **He didn't know.**

  Under the revised rule, your mate's belief was **lucky**. In a very similar world where Tom decides to stay in bed, your mate would still believe Tom is coming (because of the habit), but he would be wrong. Because the method allows for error in nearby scenarios, it isn't "safe."

  ### Summary

  Your original rule was: *You know if you couldn't be wrong.*
  The problem was: *Some facts can't be wrong.*

  The fixed rule is: *You know if your **reason** for believing couldn't easily have led you astray.*

  *   **Parcel/Scratchcard/Liar:** Your reasons were flawed; you could easily have been wrong. (No Knowledge)
  *   **Kettle:** Her senses were tracking reality, even if her words weren't. (Knowledge)
  *   **Cousin:** His method (psychic) is unreliable for math, even if the math is certain. (No Knowledge)
  *   **Mum:** Her method (feeling) is unreliable for health. (No Knowledge)
  *   **Tom:** His method (habit) doesn't account for accidents. (No Knowledge)

  This keeps all your original intuitions intact while solving the logical loophole of the "necessary truth."
