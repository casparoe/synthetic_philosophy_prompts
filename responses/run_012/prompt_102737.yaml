answer: |-
  **MEMORANDUM**

  **TO:** Scalable-Oversight Review Panel
  **FROM:** Chair, Review Panel
  **DATE:** 14 October 2023
  **SUBJECT:** Opinion on the Certification of the AI Debate Evaluation Protocol

  **1. Purpose and Recommendation**

  I have reviewed the proposal submitted by the Alignment Research Team regarding the certification of the 'AI Debate' protocol as a sufficient safety evaluation for the upcoming model deployment. The protocol relies on adversarial debate between two model copies, adjudicated by a weaker judge, to establish truthfulness on questions beyond the judge's direct capability.

  My recommendation is to **withhold unconditional certification**. Instead, I propose we **certify subject to named conditions**. Specifically, certification should be contingent upon the team providing empirical evidence that the protocol remains robust when argument depth increases and when debaters are explicitly optimised for obfuscation. Without this data, we cannot rule out the risk that the judge is selecting the most plausible argument rather than the correct one.

  **2. The Core Vulnerability: Obfuscated Arguments**

  My primary reservation concerns the distinction between *soundness* and *plausibility*. The protocol's theoretical guarantee rests on the assumption that an honest debater can always force the judge towards the truth. However, a dishonest debater may construct an obfuscated argument: a chain of reasoning where every intermediate step appears plausible to the judge, and the conclusion is false, yet the logical gaps are sufficiently subtle that they evade detection.

  To a judge with limited capability, a complex unsound argument may be indistinguishable from a complex sound one. If the judge cannot verify the steps, 'winning' and 'being right' come apart. The burden here is asymmetric. It is computationally cheaper to generate a plausible falsehood than to rigorously verify a truth. If the protocol rewards the judge's willingness to be persuaded by elaborate chains, it may systematically favour the side with something to hide.

  **3. The Research Team's Position**

  I wish to place on record that the research team's defence of the protocol is theoretically robust within certain bounds. Their strongest reply is that cross-examination alters the complexity landscape. They argue that whilst generating a lie may be cheap, maintaining consistency under cross-examination is costly. The honest debater need not explain the entire truth; they need only locate the single crack in the dishonest argument. If the judge can recognise a contradiction when it is pointed out, the honest party should prevail.

  In limited domains where the 'crack' is a simple factual error, this mechanism holds. I acknowledge that in preliminary trials, the debate protocol has outperformed direct questioning. To dismiss this out of hand would be to ignore empirical progress. The team contends that if the judge is reliable at picking the winner of a cross-examination, the truth will emerge as the equilibrium strategy.

  **4. Conditions for Certification**

  To bridge the gap between the team's theoretical claim and the risk of obfuscation, I require the following evidence before Thursday's meeting:

  *   **Depth Scaling Curves:** We need data showing how the judge's accuracy degrades as the number of reasoning steps increases. If the guarantee lapses once arguments require more than *N* steps, we must know the value of *N* relative to the model's intended deployment tasks.
  *   **Adversarial Obfuscation Testing:** The team must run a red-team exercise where debaters are fine-tuned specifically to win via obfuscation rather than truth. If the win-rate diverges from the accuracy rate under these conditions, the protocol is measuring persuasion, not safety.
  *   **Judge Capability Threshold:** We require a quantified metric of the 'capability gap' between debater and judge. The guarantee is only valid if the judge is sufficiently capable of verifying individual steps, even if it cannot solve the whole problem.

  **5. Circularity in Our Own Regime**

  I must also note a reflexivity in our own oversight. In assessing whether the judge is reliable, we (the Panel) are acting as judges of the judge. If we rely on human evaluation to certify the protocol, we are open to the charge of circularity: we are assuming human oversight can detect obfuscation that the AI judge cannot. If the arguments become too technical for the AI judge, they may well be too technical for us. We must acknowledge that our certification is only as strong as our own ability to detect the very obfuscation we fear.

  **6. Conclusion**

  The debate protocol is a promising avenue for scalable oversight, but it is not yet a proven safety case. The guarantee does not automatically survive the transition from single-step verification to multi-step reasoning chains.

  If the team can demonstrate that cross-examination successfully penalises obfuscation even at high complexity, I shall be pleased to move for certification on Thursday. If not, we must refuse certification until the asymmetry of complexity is better understood.

  Please review the attached data requests prior to the meeting.

  **Chair, Scalable-Oversight Review Panel**
