answer: |-
  The Hall of Measures was circular, domed, and silent. In the center of the stone floor, inlaid in brass, was an equilateral triangle. Its vertices touched the wall. This was the Standard. Around it, the Council sat in tiers, watching the three petitioners below. The dispute concerned the Water Right of the Lower Valley. If the chord drawn across the Standard exceeded the length of the brass triangle's side, the water would flow to the Farmers. If it fell short, the Millers would hold the dam.

  The law was ancient and precise: "The allotment shall be decided by a random chord across the Circle." But the law did not specify how to draw the chord.

  Magistrate Kael sat high above the floor. He looked down at the three representatives. To his left stood Halden, head of the Farmers' Guild. To his right, Verek, the Chief Surveyor for the Millers. Between them, holding a basket of smooth stones, was Elara, the Archivist neutral to the water but sworn to the integrity of the floor.

  "We are ready," Kael said. His voice echoed off the curved walls. "Draw the line."

  Halden stepped forward first. He wore the rough wool of the fields. He carried a device of wood and brass with two spinning dials mounted on a frame that fit against the circular wall.

  "The Circle is defined by its boundary," Halden said. "We are citizens within the walls. To choose a line is to choose two points of contact." He pressed the frame against the stone rim. "I fix one point here, at the North mark. Then I spin this dial." He flicked the brass wheel. It clicked as it rotated, stopping at a random position on the circumference. "I stretch a chalked string between the fixed point and the chosen point. I snap it. The mark on the floor is the chord."

  He performed the action. The string snapped, leaving a faint white line across the dust of the floor. It grazed the edge of the brass triangle. It was short.

  "If I repeat this," Halden said, "one time in three, the string will cross the triangle. Two times in three, it will not. This is the way of people. We meet at the edges. It is fair."

  Verek stepped forward. He wore the leather apron of his trade and carried a long rod calibrated in inches. He looked at Halden's device with disdain.

  "The boundary is irregular," Verek said. "The truth of the Circle is its center." He walked to the brass pin set in the exact middle of the floor. "To draw a random line, one must choose a random distance from the truth." He laid his rod along a radius, pointing toward the East wall. "I close my eyes. I slide my finger along the rod. Where I stop, I drop a perpendicular bar."

  He demonstrated. He slid his hand, stopped, and lowered a square frame. A line was scribed perpendicular to the radius. This line cut deeply through the brass triangle. It was long.

  "My method accounts for the space," Verek argued. "Half the radius yields a long chord. Half yields a short. It is one half. Halden's method favors the edges. It clusters lines near the rim. My method spreads them evenly from the heart. That is neutrality."

  Elara stepped forward last. She did not touch the wall or the center pin. She stood over the open floor, holding her basket.

  "The line is a shadow," Elara said softly. "The substance is the area it covers." She reached into the basket and threw a stone. It clattered on the stone floor, coming to rest near the edge. "This stone marks the midpoint of the chord."

  She took a straightedge. She aligned it perpendicular to the radius passing through the stone. She drew the line.

  "If the stone lands inside the inner circle," she said, pointing to a region halfway between the center and the rim, "the chord is long. If it lands outside, the chord is short." She looked at the Magistrate. "The inner circle is one quarter of the total area. Therefore, only one quarter of the lines are long. Halden counts edges. Verek counts distances. I count weight. The floor is uniform. The stone falls where it may. This is the only true randomness."

  The silence returned, heavier than before. The three lines remained on the floor. One was short, one long, one待定. But the problem was not the lines already drawn. It was the line yet to be drawn for the verdict.

  Halden spoke first. "If we use Verek's rod, the Millers win half the time. If we use my dials, they win two-thirds. If we use Elara's stones, they win three-quarters. The outcome changes with the tool."

  "Because your tool is biased," Verek snapped. "You crowd the points near the fixed mark."

  "And you crowd the distances near the center," Halden retorted.

  Kael raised a hand. "Enough. Explain why the same circle yields three truths."

  An old man stood from the back rows. It was Tomas, the Tutor of Geometry. He had not been called, but Kael nodded for him to approach. Tomas walked down to the floor. He carried no tools, only a piece of chalk.

  "The circle is symmetric," Tomas said. He drew a small circle on the slate near the Magistrate's dais. "Rotate it. It looks the same. Scale it. It looks the same. The problem is not the circle. It is the word 'random'."

  He pointed to Halden's dial. "You assume indifference over the angle. Every degree is equally likely." He pointed to Verek's rod. "You assume indifference over the distance. Every inch is equally likely." He pointed to Elara's stone. "You assume indifference over the area. Every square foot is equally likely."

  Tomas picked up a stone and placed it on the floor. "Consider this stone. It defines a chord. I can describe this stone by its distance from the center. I can describe it by the angle of the radius it sits on. I can describe it by the endpoints of the chord it creates."

  He drew a line connecting the stone to the center. "If I say 'choose a distance uniformly', I get Verek's answer. If I say 'choose a midpoint uniformly', I get Elara's. These are the same physical object described by different quantities. Indifference in one description is not indifference in another."

  He walked to the wall. "If I space points evenly on the rim, they are not evenly spaced when projected onto the radius. The mapping distorts the density. You are not measuring the same thing. You are measuring different things and calling them by the same name."

  Verek frowned. "But symmetry must hold. If I rotate the circle, the probability should not change."

  "It does not," Tomas said. "All three methods are rotationally invariant. Spin the room, and your probabilities remain one-third, one-half, one-quarter. The symmetry of the situation does not select the procedure. The symmetry allows all of them."

  Tomas looked up at the Magistrate. "There is a deeper issue. You ask for a random line in a bounded circle. But where do the lines come from? If you consider all lines in the infinite plane, there are infinitely many. You cannot choose one uniformly from infinity. You must bring them in from the outside. You must use a process. A throw, a spin, a slide. Every process brings its own measure. Every machine brings its own bias."

  Halden looked at his dials. "So there is no fair way?"

  "There is no way that does not impose a law," Tomas said. "The math is not in dispute. The arithmetic is correct for each machine. The dispute is which machine represents the will of the gods."

  Kael leaned forward. "Then we are not measuring geometry. We are legislating."

  "We are," Tomas said. "If you choose the dial, you legislate that the edges matter most. If you choose the rod, you legislate that the center matters most. If you choose the stone, you legislate that the area matters most. The circle does not care. The water does not care. Only the law cares."

  Verek slammed his hand on the rail. "Then let us choose the method that is most invariant under scale. If we shrink the circle, my rod scales perfectly. The ratio of the distance to the radius remains constant."

  "But the area scales as the square," Elara countered. "My method respects the two-dimensional nature of the floor."

  "And my method respects the one-dimensional nature of the boundary," Halden added.

  Kael stood up. The movement silenced the room. He walked down from the dais to the floor. He stood over the brass triangle. He looked at the three lines drawn in chalk. They intersected, conflicting, overlapping.

  "We came here to find a line that exists in nature," Kael said. "We wanted a verdict that was hidden in the stone, waiting to be revealed by a pure procedure."

  He kicked dust over Elara's stone. He wiped Halden's chalk mark from the wall. He broke Verek's measuring rod across his knee.

  "There is no such line," Kael said. "Tomas is right. The randomness is not in the circle. It is in the hand that draws."

  The Millers and Farmers shifted uncomfortably. The verdict was slipping away.

  "If I choose Halden's method," Kael continued, "I favor the Farmers. If I choose Verek's, I favor the Millers. If I choose Elara's, I favor the Millers even more. To choose the method is to choose the winner."

  "Then choose!" Verek demanded. "The law requires a chord."

  "The law requires a random chord," Kael said. "But we have proven that 'random' is empty without a mechanism. The law is incomplete. It asks for a result without specifying the cause."

  Kael looked at the brass triangle. "We cannot solve this by math. The math tells us only that our tools are different. We must solve it by purpose."

  He turned to the crowd. "Why do we draw the line?"

  "To divide the water," Halden said.

  "To decide who is right," Verek said.

  "No," Kael said. "To avoid violence. The line is a substitute for war. We draw it so that the loser accepts the loss as fate, not as tyranny."

  He paused. "But if the method is disputed, the loss will not be accepted. The Farmers will say the Millers rigged the rod. The Millers will say the Farmers weighted the dial. The ambiguity of the math becomes the ambiguity of justice."

  Kael walked to the center pin. "I will not draw a chord. I will not choose a method. To choose a method is to decide the case before the evidence is heard."

  "Then how do we decide?" Elara asked.

  "We alter the question," Kael said. "We asked: 'Is the chord long or short?' This forces a binary choice based on an undefined probability. Instead, we ask: 'What division of the water is fair given that we cannot agree on the chance?'"

  He looked at Tomas. "You said every process brings a measure. Let us bring all three."

  Kael gestured to the scribes. "We will perform the ritual three times. Once by the dial. Once by the rod. Once by the stone. If all three agree, the verdict stands. If they disagree, the water is divided equally."

  "That halves the stake," Verek protested. "It ignores the risk."

  "It acknowledges the truth," Kael replied. "The risk is not in the water. It is in our inability to define the chance. We are penalized for our confusion."

  Halden looked at the floor. "And if two agree and one disagrees?"

  "Then the majority holds," Kael said. "But know this: You are not voting on the water. You are voting on the geometry. You are deciding what kind of randomness governs this city."

  The Council murmured. The tension shifted. It was no longer about the water. It was about the nature of the law itself. Was the law grounded in the boundary, the center, or the area? Was the citizen defined by their edge, their core, or their substance?

  Kael returned to his seat. "Prepare the devices. We draw at noon."

  The petitioners moved to their stations. Halden polished his dials. Verek calibrated his rod. Elara smoothed the floor for the stones. They worked in silence. The math was settled. The arithmetic was clear. One-third. One-half. One-quarter.

  But as the sun climbed the dome, the shadow of the gnomon fell across the brass triangle. It did not align with any of the chalk lines. It cut its own path, arbitrary and absolute.

  Tomas remained standing near the center. He watched the preparations. He knew that when the lines were drawn, two would likely conflict. He knew the water would likely be split. He knew the ambiguity would remain, buried under the compromise.

  He looked at the circle. It was perfect. It contained all the lines, all the probabilities, all the contradictions. It offered no answer. It only offered the space where the answer must be built.

  Kael raised his gavel. "Begin."

  Halden spun the dial. Verek slid the rod. Elara dropped the stone.

  The room held its breath. They were not waiting for fate. They were waiting to see which version of reality they had chosen to inhabit. The chalk dust settled. The lines appeared. They did not match.

  Kael looked down. "The verdict is divided. The water is shared."

  He struck the gavel. The sound was final. But as the crowd dispersed, the three lines remained on the floor. They would be swept away tomorrow. But for now, they stood as a record of the dispute. Three truths. One circle. No resolution.

  Tomas walked to the door. He paused, looking back at the floor. The problem was not solved. It was merely managed. The demand for a unique answer had been revealed as a confusion about what fairness amounted to. Fairness was not a property of the line. It was a property of the agreement.

  He stepped out into the sun. The world outside was not circular. It had edges. It had centers. It had areas. And everywhere, people were drawing lines, unaware that the method was the message. He walked on, leaving the circle behind, carrying the uncertainty with him. It was the only honest thing to take.
