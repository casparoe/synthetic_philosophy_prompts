answer: |-
  ### The question

  It is often asserted that iterating the Prisoner's Dilemma resolves the tension between individual rationality and collective welfare. Critically evaluate this claim. You must address: (1) whether the repeated game retains the strategic structure of the one-shot dilemma or constitutes a fundamentally different game; (2) the precise implication of the Folk Theorem regarding equilibrium selection versus prediction; and (3) how perceptual noise alters the stability of simple reciprocal strategies. Conclude by arguing whether iteration solves the cooperation problem or merely displaces it onto a different analytical plane.

  ### Model answer

  The assertion that iteration solves the Prisoner's Dilemma is fundamentally mistaken; it merely displaces the problem. To claim otherwise is to confuse the existence of cooperative equilibria with the inevitability of cooperation. The repeated game is not the one-shot dilemma played multiple times; it is a structurally distinct supergame. In the one-shot version, defection is a dominant strategy because the payoff matrix is static. In the repeated version, strategies are conditional plans mapping histories to actions. The strategic object changes from a single move to a policy, altering the incentive structure entirely. Consequently, the dilemma is not solved within its original framework but replaced by a coordination problem within a broader game.

  This structural shift is illuminated by the Folk Theorem, which is frequently misinterpreted as a prediction of cooperation. It is not. The theorem demonstrates that any feasible payoff vector exceeding the minimax value can be sustained as a Nash equilibrium, provided players are sufficiently patient. Crucially, this includes the mutual defection payoff. Therefore, the Folk Theorem proves that cooperation *can* be sustained, not that it *will* be. The problem of individual rationality is transformed into a problem of equilibrium selection. Without an external mechanism to coordinate expectations—such as social norms or institutional enforcement—rational agents may still converge on the inefficient defection equilibrium. Iteration expands the solution space but does not select the cooperative point within it.

  Furthermore, the logic of reciprocation, often exemplified by Tit-for-Tat, collapses under the realism of perceptual noise. In a deterministic environment, Tit-for-Tat stabilises cooperation by punishing defection immediately. However, if moves are misperceived with non-zero probability, a single error triggers a vendetta of alternating defections that neither party can halt. The reciprocal logic works against itself: the mechanism designed to enforce cooperation becomes a source of instability. Robust cooperation in noisy environments requires strategies with error-correcting properties, such as Generous Tit-for-Tat or Win-Stay-Lose-Shift, which forgive occasional deviations. This necessitates a departure from strict reciprocity, implying that the simple moral intuition of "returning like for like" is insufficient for sustaining welfare.

  In conclusion, iteration does not resolve the tension between individual rationality and collective welfare; it reconfigures it. The hard constraint of the dominant strategy is removed, but it is replaced by the indeterminacy of multiple equilibria and the fragility of coordination under noise. Cooperation becomes possible, but only contingent upon specific conditions regarding patience, expectation coordination, and error correction. To say iteration solves the dilemma is to ignore that the repeated game imposes its own, arguably more complex, strategic hurdles. The dilemma is not solved; it is displaced onto the plane of equilibrium selection and information reliability.

  ### Marking scheme

  **Total Marks: 25**

  **1. Structural Distinction (8 marks)**
  *   **5 marks:** Clearly argues that the repeated game is a distinct supergame with conditional strategies, not merely the one-shot matrix repeated.
  *   **3 marks:** Explains that the incentive structure changes from dominant strategy manipulation to long-term payoff maximisation.
  *   **Penalty:** Deduct 5 marks if the answer treats the repeated game as simply the sum of one-shot payoffs without strategic interdependence.

  **2. The Folk Theorem (8 marks)**
  *   **5 marks:** Correctly identifies the theorem as establishing the *possibility* (existence) of cooperative equilibria, not the *prediction* of cooperation.
  *   **3 marks:** Explicitly notes that mutual defection remains a valid equilibrium under the theorem (equilibrium selection problem).
  *   **Penalty:** Deduct 5 marks if the student claims the Folk Theorem proves cooperation is the rational outcome.

  **3. Noise and Reciprocity (6 marks)**
  *   **4 marks:** Explains how perceptual noise causes strict reciprocal strategies (e.g., Tit-for-Tat) to enter endless retaliation cycles.
  *   **2 marks:** Identifies the need for error-correcting mechanisms (e.g., generosity or forgiveness) to maintain stability.
  *   **Penalty:** Deduct 3 marks if Tit-for-Tat is praised as robust without qualification regarding noise.

  **4. Conclusion and Coherence (3 marks)**
  *   **3 marks:** Concludes definitively that iteration displaces rather than solves the problem, synthesising the three previous points.
  *   **Penalty:** Deduct marks for ambiguous conclusions or reliance on Axelrod's tournament results as primary evidence.

  **Specific Errors (Cumulative Penalty)**
  *   Treating the Folk Theorem as a convergence mechanism: **-3 marks**.
  *   Ignoring the role of noise entirely: **-4 marks**.
  *   British spelling errors (e.g., "behavior" instead of "behaviour"): **-1 mark** (max).
