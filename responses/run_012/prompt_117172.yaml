  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **Role:** Head of Methods at a National Food-Standards Agency.
      *   **Problem:** Two distinct reporting products (Attribution Report vs. Assurance Report) create conflicting logical/epistemic pressures regarding sign-off and confidence levels.
          *   *Attribution Report:* 60 candidates, exactly one is true. Each excluded at 99% confidence. Individually sound, but collectively inconsistent (if all 60 are excluded, none are left, but one *must* be the source).
          *   *Assurance Report:* 40 findings, each at 95% confidence. Collectively, high probability that at least one is false (1 - 0.95^40 ≈ 87% chance of at least one error). Past reports *did* contain errors. Sign-off covers the whole document.
      *   **Goal:** One unified procedure for both products.
      *   **Constraints:**
          *   No philosophy jargon/names (just machinery).
          *   Actionable by an analyst in under an hour.
          *   Numbered steps, decision points, record-keeping requirements.
          *   Must address 7 specific requirements (Questions, Stop/Hand-off, Conjunction Rule, Shared Evidence Rule, Sign-off Wording, Revision/Consistency, Asymmetric Costs/Thresholds).
          *   Run the procedure on 3 cases (60-candidate, 40-finding, 12-shared-method).
          *   Include an unwelcome result (likely the attribution report).
          *   Final statement on limitations, arithmetic vs. judgment, and the "bullet bitten."

  2.  **Deconstruct the Core Conflict:**

      *   *The Lottery Paradox (Attribution):* High probability for each exclusion leads to a contradiction when conjoined (All 60 excluded = No source).
      *   *The Preface Paradox (Assurance):* High probability for each claim leads to a high probability of *some* error when conjoined (40 claims @ 95% = likely 1+ errors).
      *   *The Tension:* In Attribution, we can't accept the conjunction (logic breaks). In Assurance, we must accept the conjunction (utility breaks if hedged), even though we know errors exist.
      *   *The Solution:* We need a "Aggregate Risk Budget" approach. We cannot treat claims as isolated islands. We need to calculate the *systemic* error rate allowed for a document and manage the "Conjunction Cost."

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Individual Validation.* Standard confidence check. (Is p > threshold?)
      *   *Step 2: Dependency Check.* Are claims independent? (Crucial for the 12-shared-method case).
      *   *Step 3: Aggregate Risk Calculation.* This is the key. If I sign 40 claims at 95%, what is the risk of the *document* being flawed?
      *   *Step 4: Conjunction Rule.* Do we assert "A and B and C"? Or "A, B, C (individually)"?
      *   *Step 5: Sign-off Language.* Needs to distinguish between "Every line is true" vs. "The process was robust."
      *   *Step 6: Revision.* What if one falls?
      *   *Step 7: Thresholds.* Asymmetric costs.

      *Refining the Conjunction Rule:* This is the hardest part.
      *   *Attribution:* We cannot assert "Source is not 1, not 2... not 60." We must assert "Source is in Subset X."
      *   *Assurance:* We cannot assert "All 40 are true." We must assert "The system is safe within risk tolerance K."
      *   *Unified Rule:* A set of claims is only assertable as a conjunction if the *joint* probability of error is below a specific "Document Risk Limit" (DRL). If the joint error risk exceeds DRL, the claims must be qualified or reduced.

      *Refining the Attribution Case:*
      *   60 exclusions @ 99%.
      *   Joint probability all exclusions are correct = 0.99^60 ≈ 54%.
      *   Joint probability at least one exclusion is wrong (i.e., the true source was excluded) = 46%.
      *   This is unacceptable for a definitive "Not Source" list.
      *   *Unwelcome Result:* We cannot publish all 60 exclusions as definitive. We must stop earlier or group them.

      *Refining the Assurance Case:*
      *   40 findings @ 95%.
      *   Joint probability all correct = 0.95^40 ≈ 13%.
      *   Risk of error = 87%.
      *   *Fix:* We don't sign off on "Truth of all lines." We sign off on "Risk Profile." The sign-off says "Expected errors < X."

      *Refining Shared Evidence:*
      *   If 12 claims share one method, they aren't independent. If the method is flawed, all 12 fail.
      *   Confidence in the set = Confidence in the method.
      *   Rule: Treat dependent claims as *one* claim for aggregate risk calculation.

  4.  **Developing the 7 Required Sections within the Procedure:**

      1.  *Questions:* Claim definition, Evidence type, Error cost, Independence.
      2.  *Stop/Hand-off:* If Joint Risk > Limit, stop. Hand to Senior Officer for risk acceptance.
      3.  *Conjunction:* Explicitly reject the principle that "Acceptable Individually = Acceptable Jointly." Use "Joint Risk Budget."
      4.  *Shared Evidence:* Cluster dependent claims. Calculate risk per cluster, not per claim.
      5.  *Sign-off:* Differentiate "Fact" vs. "Assurance." Allow stating expected error rates.
      6.  *Revision:* If one fails, re-evaluate the cluster. Consistency check across documents.
      7.  *Thresholds:* Pre-set based on harm (public health vs. economic), not desired outcome.

  5.  **Running the Cases:**

      *   *Case 1 (Attribution):* 60 exclusions @ 99%. Joint risk of false exclusion is too high. *Result:* Cannot exclude all 60. Must retain a "Residual Set." *Unwelcome:* We can't give the clean list investigators want.
      *   *Case 2 (Assurance):* 40 findings @ 95%. Joint risk high. *Result:* Sign-off must acknowledge expected errors. Findings stand, but the *guarantee* changes.
      *   *Case 3 (Shared Method):* 12 findings, 1 method. *Result:* Treated as 1 claim. If method confidence is 95%, the set is 95%, not 95%^12. But if the method is the bottleneck, we might need to drop findings to reduce reliance on that single point of failure. Actually, the prompt says "confidence in the set collapses." This implies the method itself is suspect or the dependency makes the *aggregate* risk too high relative to the budget. Let's interpret: If 12 claims rely on Method M, and Method M has a 5% failure rate, the risk isn't compounded, it's correlated. But if the *Document Risk Limit* is low, relying on one method for 30% of the report is a concentration risk. I need to make sure the procedure forces striking findings if the concentration risk is too high.

  6.  **Addressing the "Bullet Bitten":**

      *   The core philosophical tension is between *Consistency* (no contradictions) and *Completeness* (saying everything we believe).
      *   The procedure must bite the bullet that **Separately Acceptable Claims Need Not Be Jointly Acceptable.** (Rejecting Agglomeration).
      *   Also, for the Assurance Report, it must accept that **A Signatory May Accept a Set While Expecting One Member to Be False** (The Preface Paradox solution), *provided* the expected number of errors is quantified and within tolerance.
      *   Wait, the prompt asks for *one* bullet. The most robust stance for a regulatory body is: **Separately acceptable claims need not be jointly acceptable.** This solves the Attribution paradox. For Assurance, it means we adjust the *sign-off* to reflect the joint status, not the individual status.
      *   Actually, a better option for the Assurance report is the "Expected Error" model.
      *   Let's settle on: **The validity of a set is determined by the joint error risk, not the individual error risk.** This forces the Attribution report to shrink and the Assurance report to qualify its sign-off.

  7.  **Drafting the Content (incorporating constraints):**

      *   *Tone:* Bureaucratic, precise, operational. No "Kyburg" or "Lottery Paradox."
      *   *Format:* Numbered steps, decision diamonds (text-based), record logs.
      *   *Time:* Under 1 hour (keep calculations simple).
      *   *Constraint Check:* Did I cover all 7 points? Yes.
      *   *Cases:* Ensure the Attribution case fails the joint test.

  8.  **Refining the "Unwelcome Result":**

      *   The Attribution Report is the one that will break. 60 exclusions @ 99% means a 46% chance the true source is on the "excluded" list. That is legally and scientifically indefensible for a definitive finding. The procedure *must* stop the analyst from publishing all 60 exclusions. They must publish a "Short List of Probable Sources" instead. This contradicts the investigators' desire for a clean list of exclusions.

  9.  **Final Review against Prompt:**

      *   *Procedure:* Numbered steps? Yes.
      *   *7 Points:* Integrated? Yes.
      *   *3 Cases:* Run through? Yes.
      *   *Unwelcome Result:* Explicitly stated? Yes.
      *   *Limitations/Arithmetic vs Judgment:* Final section.
      *   *Bullet Bitten:* Explicitly stated.

      *(Self-Correction during drafting)*: Make sure the "Shared Evidence" rule is clear. If 12 claims share a method, they count as 1 "Risk Unit" for the aggregate calculation, but that Unit carries the weight of 12 findings. If the method fails, 12 findings fail. This increases the *consequence* of error, even if probability doesn't compound. I need to weight the "Cost of Error" in the aggregate calculation.
      *Revised Logic for Shared Evidence:* It's not just probability; it's *exposure*. If 12 claims rest on one method, the "Error Impact" is 12x. The procedure needs a "Weighted Error Count."

      *Let's simplify for the "1 hour" constraint.*
      *   Step 1: Individual Confidence.
      *   Step 2: Dependency Clustering.
      *   Step 3: Aggregate Risk Calculation (using a simplified lookup table or formula).
      *   Step 4: Sign-off Text Selection.

      *Okay, let's write it.*

      *Wait, one more check on the "Bullet".*
      The prompt asks: "which bullet it bites: either that separately acceptable claims need not be jointly acceptable, or that a signatory may accept a set while expecting one of its members to be false, or some better option if you can find one."
      *Option 1 (No Agglomeration):* Good for Attribution. Hard for Assurance (makes the report look weak).
      *Option 2 (Accept Falsehood):* Good for Assurance (Preface). Impossible for Attribution (can't accept a set that says "None of these are the source" when one must be).
      *Better Option:* **The Unit of Assertion is the Document, not the Claim.** We trade individual certainty for systemic risk management. This allows us to say "This claim is 99% sound" but "This document cannot assert all claims simultaneously."
      *Actually, the prompt suggests "Separately acceptable claims need not be jointly acceptable" is the standard philosophical bullet. I should probably stick to that or the "Expected Error" variant.*
      *Decision:* I will bite the bullet that **Separately Acceptable Claims Need Not Be Jointly Acceptable.** This is the only one that saves the Attribution report from logical contradiction. For the Assurance report, this means the sign-off changes from "All true" to "Systemically Reliable."

      *Wait, the Attribution Report result:* If I can't assert the conjunction, I can't say "It's not 1, not 2... not 60." I have to say "It's likely in this subset of 5." This is the unwelcome result.

      *Let's finalize the procedure steps.*
      1. Define Claim & Cost.
      2. Assess Individual Confidence.
      3. Map Dependencies (Clustering).
      4. Calculate Document Risk (Joint).
      5. Compare to Risk Budget.
      6. Determine Sign-off Language.
      7. Revision Protocol.

      *Okay, ready to generate.*
answer: |-
  # PROCEDURE: JOINT ASSERTION AND RISK BUDGETING (JARB-01)

  **Purpose:** To determine when a set of individual findings may be asserted together in a single signed document, ensuring logical consistency and managing aggregate error risk.
  **Scope:** Applies to all Attribution Reports and Assurance Reports.
  **Time Required:** < 60 minutes per document draft.
  **Authority:** Head of Methods.

  ---

  ## PART A: THE PROCEDURE

  ### Step 1: Claim Definition and Cost Assessment
  **Action:** For every candidate finding (exclusion or assurance statement), complete **Record Card A**.
  **Questions:**
  1.  **What is the claim?** (State as a binary proposition: True/False).
  2.  **What is the individual confidence level (p)?** (Derived from statistical test or expert consensus).
  3.  **What is the Cost of Error (C)?**
      *   *Type H (Health/Safety):* False negative on contamination or source. (Cost = High).
      *   *Type E (Economic/Reputation):* False positive on contamination or source. (Cost = Medium).
      *   *Type S (Systemic):* Error undermines confidence in the agency. (Cost = High).
  **Sufficient Answer:** A numerical confidence (e.g., 0.99) and a Cost Type (H, E, or S).
  **Decision Point:** If Confidence < 90%, reject claim immediately. Do not proceed.

  ### Step 2: Dependency Mapping (Clustering)
  **Action:** Group claims that share critical evidence. Complete **Record Card B**.
  **Questions:**
  1.  **Do two or more claims rely on the same laboratory method, sampling frame, or expert panel?**
  2.  **If that method/panel were proven flawed, would all linked claims fail simultaneously?**
  **Rule:** If "Yes," these claims form a **Dependency Cluster**. They are not independent.
  **Calculation:**
  *   Treat the entire Cluster as **One Composite Claim** for risk calculation.
  *   The Confidence of the Cluster = The Confidence of the shared method/panel.
  *   The Cost of Error for the Cluster = Sum of Costs for all claims in the cluster.
  **Decision Point:** If a Cluster contains > 50% of the document's total claims, flag for Senior Review (Concentration Risk).

  ### Step 3: Aggregate Risk Calculation
  **Action:** Calculate the risk that the *document as a whole* contains an unacceptable error. Complete **Record Card C**.
  **Rule:** Do not multiply individual probabilities if claims are independent. Do not multiply if they are clustered (use Cluster Confidence).
  **Formula:**
  1.  Convert Confidence (p) to Error Risk (r = 1 - p).
  2.  **Independent Claims:** Joint Risk = 1 - [(1-r₁) × (1-r₂) × ... × (1-rₙ)].
  3.  **Clustered Claims:** Joint Risk = 1 - [(1-r_cluster₁) × (1-r_cluster₂)...].
  4.  **Weighted Risk:** If Cost Type is H, multiply that claim's risk contribution by 2.
  **Threshold:** The **Document Risk Limit (DRL)** is set at 10% for Assurance Reports and 5% for Attribution Reports.
  **Decision Point:**
  *   If Calculated Joint Risk ≤ DRL: **Proceed to Step 4.**
  *   If Calculated Joint Risk > DRL: **STOP.** Hand off to Senior Officer. The document cannot be signed as drafted. Claims must be removed or confidence increased.

  ### Step 4: The Conjunction Rule
  **Action:** Determine the logical status of the set.
  **Rule:** **Individual acceptability does not guarantee joint acceptability.**
  *   **If Step 3 Passed:** The set may be asserted as a conjunction ("A and B and C are true").
  *   **If Step 3 Failed (but claims are individually sound):** The set may *not* be asserted as a conjunction. The document must assert the *process* or the *subset*, not the whole.
  **Defense:** A signature certifies the document's reliability, not just the individual lines. If the mathematical probability of the document containing an error exceeds the DRL, asserting all claims together is a false representation of certainty.

  ### Step 5: Sign-off Language Rules
  **Action:** Select the authorized sign-off statement based on the Report Type and Step 3 outcome.
  **Assurance Report (If Step 3 Passed):**
  *   *Permitted:* "We find the supply chain compliant within stated risk parameters."
  *   *Permitted:* "We expect fewer than X errors in this assessment."
  *   *Forbidden:* "Every finding herein is guaranteed true."
  **Attribution Report (If Step 3 Passed):**
  *   *Permitted:* "Source is confirmed as X."
  *   *Forbidden:* "All other 59 candidates are definitively excluded" (Unless Joint Risk < 5%).
  **Attribution Report (If Step 3 Failed):**
  *   *Required:* "Source is narrowed to the following subset of candidates." (You must retain the candidates necessary to bring Joint Risk below DRL).
  **Decision Point:** Sign-off is invalid if it claims absolute certainty where Step 3 indicates residual risk.

  ### Step 6: Revision and Consistency
  **Action:** Log the document in the **Central Evidence Register**.
  **Rule:**
  1.  **Single Error Impact:** If one claim in a set is later proven false, all claims in the same Dependency Cluster (Step 2) are automatically suspended pending review.
  2.  **Cross-Document Consistency:** Evidence used in Document A (issued Month X) cannot support a verdict in Document B (issued Month X) that contradicts Document A.
  3.  **Correction:** If a claim is withdrawn, the Aggregate Risk (Step 3) for the original document must be recalculated. If the original document now exceeds DRL, a public notice must be issued qualifying the original sign-off.

  ### Step 7: Threshold Setting (Asymmetric Costs)
  **Action:** Set Confidence Thresholds *before* analysis begins.
  **Rule:** Thresholds are determined by the Cost of Error (Step 1), not the desired finding.
  *   **Type H (Health/Safety):** Minimum Confidence 99%. (Better to false alarm than miss contamination).
  *   **Type E (Economic):** Minimum Confidence 95%. (Balance reputation with trade).
  *   **Type S (Systemic):** Minimum Confidence 99.9% for the *Document* (Step 3).
  **Constraint:** Analysts cannot lower the threshold to achieve a desired conclusion. If evidence yields 94% on a Type H claim, the claim is "Inconclusive," not "Negative."

  ---

  ## PART B: APPLICATION TO CASES

  ### Case 1: The Attribution Report (60 Candidates)
  **Input:** 60 exclusions. Each excluded at 99% confidence (1% error risk). Independent investigations. Cost Type H (Public Safety).
  **Step 1:** Individual confidence (0.99) passes the 90% floor.
  **Step 2:** No shared evidence (independent investigations). 60 Independent Claims.
  **Step 3 (Aggregate Risk):**
  *   Probability all 60 exclusions are correct = 0.99^60 ≈ 0.547.
  *   Probability at least one exclusion is wrong (i.e., the true source was excluded) = 1 - 0.547 = **45.3%**.
  *   DRL for Attribution is 5%.
  *   **Result:** 45.3% >> 5%. **FAIL.**
  **Step 4 (Conjunction):** You cannot assert the conjunction of all 60 exclusions. It is logically incoherent to sign off on a list that has a 45% chance of eliminating the true culprit.
  **Step 5 (Sign-off):** The report cannot state "The source is not on this list."
  **Outcome:** The procedure forces you to reduce the list. To reach 95% confidence that the true source is *not* in the excluded set, you can only exclude roughly 5 candidates (0.99^5 ≈ 0.95).
  **Unwelcome Result:** You must publish a report saying "We have ruled out 5 suppliers; the source remains among the other 55." Investigators want to rule out 59. The procedure forbids this. To get the clean list they want, you would need 99.99% confidence on each test, which the current science does not support.

  ### Case 2: The Assurance Report (40 Findings)
  **Input:** 40 findings. Each at 95% confidence. Mixed Costs (Type E and S).
  **Step 1:** Individual confidence (0.95) passes the 90% floor.
  **Step 2:** Assume independence for this case.
  **Step 3 (Aggregate Risk):**
  *   Probability all 40 are correct = 0.95^40 ≈ 0.13.
  *   Probability of at least one error = **87%**.
  *   DRL for Assurance is 10%.
  *   **Result:** 87% >> 10%. **FAIL.**
  **Step 5 (Sign-off):** You cannot sign "All findings are true."
  **Correction:** The procedure requires the sign-off to change. You may sign: "Based on the evidence, we assert these findings, acknowledging an expected error rate of approximately 2 findings (40 × 0.05)."
  **Outcome:** The findings remain published, but the *guarantee* changes. You admit the document likely contains errors. This protects the agency from dishonesty charges when errors are found later.

  ### Case 3: The Shared Method (12 Findings, 1 Method)
  **Input:** 12 findings. Each individually 95% confident. All rest on one new laboratory method.
  **Step 2 (Dependency):** All 12 form one Dependency Cluster.
  **Calculation:**
  *   The cluster is treated as **One Claim**.
  *   Confidence of the Cluster = 95% (Confidence in the method).
  *   Error Risk = 5%.
  *   **However,** the *Cost of Error* is multiplied. If the method is wrong, 12 findings collapse.
  **Step 3 (Aggregate Risk):**
  *   If this cluster is the *only* content, Joint Risk is 5%. This passes the 10% DRL.
  *   **BUT:** Step 2 flags "Concentration Risk" (>50% of document). Hand-off to Senior Officer.
  **Senior Decision:** The agency cannot tolerate a single point of failure for 12 findings.
  **Outcome:** The procedure obliges the officer to strike 6 findings to reduce reliance on the single method, even if those 6 findings are "very probably true." You must diversify the evidence base. You sacrifice probable truth for systemic resilience.

  ---

  ## PART C: LIMITATIONS AND COMMITMENTS

  ### What This Procedure Cannot Do
  1.  **It cannot create certainty from uncertainty.** If the science only supports 99% confidence, this procedure will prevent you from claiming 100% exclusion in the Attribution Report.
  2.  **It cannot prevent errors.** It only manages the *admission* and *risk* of errors.
  3.  **It cannot resolve conflicting evidence instantly.** Step 6 requires time for revision if a claim falls.

  ### Arithmetic vs. Disguised Judgment
  *   **Genuine Arithmetic:** Step 3 (Aggregate Risk Calculation). The multiplication of probabilities is mathematical fact. If claims are independent, the risk compounds.
  *   **Disguised Judgment:**
      *   **Step 2 (Dependency):** Deciding whether two claims "share evidence" is a judgment call. Analysts may be tempted to claim independence to pass Step 3.
      *   **Step 7 (Cost Assignment):** Classifying an error as Type E (Economic) vs. Type H (Health) determines the threshold. This is a policy judgment, not a mathematical one.
      *   **DRL Settings:** Choosing 5% vs 10% is a political risk tolerance, not a scientific constant.

  ### The Bullet Bitten
  This procedure bites the bullet that: **Separately Acceptable Claims Need Not Be Jointly Acceptable.**

  *   **Why:** In the Attribution Report (Case 1), every exclusion is individually sound (99%). However, the procedure forbids asserting them all together because the *set* is unreliable.
  *   **Consequence:** You must publish less information than you possess. You know 60 things that are 99% likely, but you are only allowed to publish the 5 that can be jointly certified.
  *   **Alternative Rejected:** We do *not* accept the option that "A signatory may accept a set while expecting one of its members to be false" as a blanket rule. While permitted in the Assurance Report (Case 2) via the "Expected Error" sign-off, it is forbidden in the Attribution Report (Case 1) because asserting a false exclusion there creates a logical contradiction (eliminating the true source).
  *   **Final Stance:** The unit of truth for a regulatory body is the **Document**, not the **Claim**. A claim is only "true" in the public record if it can survive within the risk budget of the document that carries it.

  ---
  **End of Procedure JARB-01**
