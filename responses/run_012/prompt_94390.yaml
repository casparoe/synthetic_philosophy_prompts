answer: |-
  # The Historicity Decision Tree

  **Starting Point:** We agree that the *Iliad*, the Arthurian legends, and the Exodus narrative were written down centuries after the events they describe, and all contain elements that are physically impossible (gods, magic, parting seas).

  ---

  ### **Node 1: The Category Question**
  **Is asking "did this happen?" a mistake about what kind of thing this story is?**
  *   **YES:** The story isn't trying to be history; it's theology, identity, or art. Asking for evidence is like asking for the chemical composition of a joke.
      *   ➔ **LEAF: The Mythicist**
      *   *Awkward Commitment:* You have to explain why the authors pretended so hard that it was history if they knew it wasn't.
  *   **NO:** It is an empirical question. There is a fact of the matter, even if we can't find it.
      *   ➔ **Go to Node 2**

  ### **Node 2: The Burden of Proof**
  **Where does the presumption lie?**
  *   **ON THE BELIEVER:** The story starts with zero credit. Without external proof (archaeology, contemporary records), the default answer is "no."
      *   ➔ **Go to Node 3**
  *   **ON THE SKEPTIC:** Oral tradition is robust. The story gets the benefit of the doubt unless it is physically impossible or contradicted by hard data.
      *   ➔ **Go to Node 4**

  ### **Node 3: The Status of the Text**
  **If there is no external proof, can the text itself count as evidence?**
  *   **NO:** The text is a *symptom* of the time it was written, not *testimony* about the time it describes. It tells us about the author, not the event.
      *   ➔ **LEAF: The Minimalist**
      *   *Awkward Commitment:* You must accept that some past events might leave *only* stories behind, making them permanently unknowable.
  *   **YES:** The text preserves a memory, even if distorted. We just need to decode it.
      *   ➔ **Go to Node 4**

  ### **Node 4: The Nature of the "Real"**
  **What counts as the historical "kernel"?**
  *   **A SPECIFIC EVENT:** A battle, a person, a crossing. The story must be causally upstream from a datable incident.
      *   ➔ **Go to Node 5**
  *   **A SOCIAL SITUATION:** A collapse, a migration, a tension. The story is "about" a real era, even if no specific scene happened.
      *   ➔ **LEAF: The Cultural Memory Historian**
      *   *Awkward Commitment:* Your theory is so flexible it can fit almost any archaeological data, making it hard to disprove.

  ### **Node 5: Handling the Magic**
  **How do we treat the non-historical elements (gods, monsters)?**
  *   **THEY ARE EXAGGERATIONS:** Gods are deified kings; monsters are misunderstood weapons or tribes. The magic is a distorted report of reality.
      *   ➔ **LEAF: The Euhemerist**
      *   *Awkward Commitment:* You have to believe ancient people were incapable of metaphor and literally thought their kings were Zeus.
  *   **THEY ARE DECORATION:** There was a real war/person, but the magic is poetic dressing added later to make it interesting.
      *   ➔ **LEAF: The Naive Kernel-Hunter**
      *   *Awkward Commitment:* You reduce a complex cultural masterpiece to a receipt that needs validation to be valuable.

  ### **Node 6: The Meaning Question** (Available from Node 4 or 5)
  **If we find (or don't find) the history, does it change what the text *means*?**
  *   **YES:** If it didn't happen, the lesson is void. History validates truth.
      *   ➔ *(Returns to Naive Kernel-Hunter / Euhemerist)*
  *   **NO:** The truth is in the moral or literary impact. History is a sidebar.
      *   ➔ **LEAF: The Deflationist**
      *   *Awkward Commitment:* You make the work of archaeologists and historians irrelevant to the study of the text.

  ---

  ### **Extras & Analysis**

  **1. Unreachable Combinations**
  *   **The Mythicist Euhemerist:** *Incoherent.* You cannot claim "history is the wrong category" (Mythicist) while simultaneously arguing "the gods were actually just kings" (Euhemerist). One denies the game; the other plays it.
  *   **The Minimalist Kernel-Hunter:** *Incoherent.* You cannot claim "the text provides no evidence" (Minimalist) while also claiming "we can find the real event inside the text" (Kernel-Hunter).
  *   **The Deflationist Naive:** *Unoccupied.* It is psychologically rare to argue "only the literal event matters for meaning" (Naive) while also arguing "but the event doesn't matter for meaning" (Deflationist).

  **2. Indistinguishable Leaves**
  *   **The Euhemerist vs. The Naive Kernel-Hunter:** This tree struggles to separate them cleanly. Both end up at "A specific real event caused this text." The distinction relies on guessing the author's intent regarding magic (did they *believe* the king was a god, or were they just using poetry?), which is often impossible to determine from the text alone.

  **3. Case Notes: Where the Big Three Fall**
  *   **The Trojan War:** Most naturally falls into **Euhemerist/Naive**. Schliemann found a city (Troy VIIa) with burn layers, suggesting a specific conflict. *Strain:* The tree strains at Node 5; the gods are so integral to the *Iliad*'s plot that calling them "decoration" feels like removing the engine from a car.
  *   **King Arthur:** Most naturally falls into **Cultural Memory**. There is no single "Arthur," but there was a real historical situation (Post-Roman British/Saxon conflict). *Strain:* The tree strains at Node 4; students often want a specific "King" (Specific Event), but the evidence only supports a "Class of Warriors" (Situation).
  *   **The Exodus:** Most naturally falls into **Minimalist** or **Deflationist**. There is no archaeological evidence for a mass migration in the Late Bronze Age. *Strain:* The tree strains at Node 1; for believers, asking "did it happen?" is indeed a category error (it is foundational myth), but for secular historians, it is an empirical question, creating a deadlock at the very root.
