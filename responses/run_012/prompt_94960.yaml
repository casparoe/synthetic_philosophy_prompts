answer: |-
  There is no single, canonical term that captures the entire structure you describe in one phrase, but your analysis maps precisely onto a cluster of established concepts in the philosophy of action, legal theory, and historiography. The phenomenon is best understood as the intersection of **Causal Selection** (specifically the **Normality Criterion**), **Contrastive Explanation**, and **The Baseline Problem**.

  If a name is required for the specific structure you have isolated—where a normative judgment about the "ordinary" state of affairs silently determines a causal verdict—the most accurate descriptive label is **Normative Baseline Dependence in Causal Attribution**. In legal and moral theory, this is often referred to simply as **The Baseline Problem**.

  Here is how the established concepts fit your description, where they diverge, and the boundary cases you requested.

  ### 1. The Established Concepts

  **A. Causal Selection (The Hart and Honoré Thesis)**
  The closest philosophical match is the theory of **Causal Selection** articulated by H.L.A. Hart and Tony Honoré in *Causation in the Law* (1959). They argue that in any complex chain of events, we do not treat all conditions as "causes." Instead, we select specific events as causes based on their relationship to a **normal course of events**.
  *   **The Fit:** Hart and Honoré posit that we distinguish between *mere conditions* (the background state of affairs) and *causes* (an intervention that disturbs that background). Your observation that the verdict depends on "which state of affairs was the ordinary one, and which departure from it was the first unwarranted one" is an exact restatement of their **Normality Criterion**.
  *   **The Limit:** Hart and Honoré focus primarily on legal liability and individual action. They do not fully explore the *historiographical* consequence: that the choice of the "normal" background is itself a contested narrative decision (periodization) rather than a factual given.

  **B. Contrastive Explanation**
  In the philosophy of science (e.g., Bas van Fraassen, Peter Lipton), explanation is understood as **contrastive**. We do not ask "Why did P happen?" but "Why did P happen *rather than Q*?"
  *   **The Fit:** Your Cold War example illustrates this perfectly.
      *   Narrative A asks: "Why did peace turn into conflict?" (Baseline: Peace). *Cause: Soviet expansion.*
      *   Narrative B asks: "Why did revolutionary tension turn into containment?" (Baseline: Revolution). *Cause: American intervention.*
      The causal answer changes because the *foil* (the contrast class) changes.
  *   **The Limit:** This explains the logic of the question, but not necessarily the *normative* weight you identified. It explains why the starting point matters, but not why the starting point is chosen based on "what was owed."

  **C. The Baseline Problem**
  In legal theory, economics, and distributive justice, **The Baseline Problem** refers to the difficulty of establishing the pre-existing state of affairs against which harm, benefit, or aggression is measured.
  *   **The Fit:** This captures your insight that the dispute is "about what was owed, not about what happened." To determine who "started" the Cold War, one must first determine what the parties owed each other in 1945 (e.g., Did the USSR owe the West a democratic Eastern Europe? Did the US owe the USSR a security buffer?).
  *   **The Limit:** This term is usually confined to ethics and law. It is not standard terminology in historiography, though the concept is widely practiced.

  ### 2. A Proposed Name and Definition

  Since no single existing term covers the *historiographical*, *causal*, and *normative* dimensions simultaneously, the structure is best named **Baseline-Dependent Causal Attribution**.

  **Definition:** A mode of causal reasoning in which the identification of the primary cause (or agent of initiation) is logically dependent on a prior, often unstated normative commitment regarding which state of affairs constitutes the "normal" or "default" baseline. The causal verdict is not derived from the evidence within the narrative but is fixed by the boundary conditions set before the narrative begins.

  **Why it feels like discovery:** This structure creates an illusion of objectivity because the baseline is **naturalized**. Once the starting point is chosen (e.g., 1945), the subsequent events appear to flow mechanically from that point. The normative choice ("1945 is the relevant year") is buried, leaving only the causal conclusion ("The US moved first") visible.

  ### 3. Boundary Cases

  To test the limits of this structure, we can look for cases where the baseline is uncontroversial or where the causal chain is independent of normative expectations.

  **Case 1: The Structure is Absent (Physical Causation)**
  *   *Scenario:* A meteor strikes a house, causing a fire.
  *   *Analysis:* There is no normative baseline here. We do not need to decide what the meteor "owed" the house or what the "normal" state of the sky was to assign cause. The physical chain of causation is robust regardless of the starting point (1 minute before vs. 1 year before).
  *   *Verdict:* Causal attribution is independent of normative baselines.

  **Case 2: The Structure is Absent (Clear Contractual Breach)**
  *   *Scenario:* Party A agrees to pay Party B $100 on Tuesday. Party A does not pay. Party B sues.
  *   *Analysis:* The baseline is explicitly codified (the contract). There is no dispute about what the "ordinary" course of events was supposed to be. The "departure" is objectively verifiable against the written agreement.
  *   *Verdict:* The starting point is fixed by mutual prior consent, removing the ambiguity of "what was owed."

  **Case 3: The Structure is Present (Divorce Proceedings)**
  *   *Scenario:* A marriage dissolves. One spouse claims the other "broke up the family" by having an affair. The other claims the marriage was already dead due to neglect, and the affair was a symptom.
  *   *Analysis:* This mirrors your Cold War example.
      *   Baseline A: The marriage was functional until the affair. (Cause: Infidelity).
      *   Baseline B: The marriage was functionally dead due to neglect. (Cause: Neglect; Affair is incidental).
  *   *Verdict:* The verdict on "who ended the marriage" depends entirely on which period is defined as the "healthy" baseline. This is **Baseline-Dependent Causal Attribution**.

  **Case 4: The Structure is Present (Labor Strikes)**
  *   *Scenario:* Management cuts wages; Workers strike. Production halts.
  *   *Analysis:*
      *   Management narrative: The strike stopped production. (Baseline: Production is normal).
      *   Labor narrative: The wage cut stopped the labor. (Baseline: Labor is owed fair pay).
  *   *Verdict:* Who "stopped" production? The answer depends on whether the wage cut is viewed as a normal market adjustment or an unwarranted departure from a social contract.

  ### 4. Summary

  You have identified a specific instance of **Causal Selection** governed by a **Normative Baseline**. While historians often call this **Periodization as Argument**, and philosophers call it **Contrastive Explanation**, the specific mechanism you describe—where the "ordinary" vs. "departure" distinction is a masked claim about "what was owed"—is best described as **The Baseline Problem in Causal Attribution**.

  It fits your description exactly in mechanism (normal vs. abnormal), approximately in name (as the term is usually reserved for law/ethics), and explains the stability of the dispute: participants are not arguing about the events *within* the narrative, but about the **moral geometry of the frame** surrounding them.
