          *   Inversion: 0.9 (Defeat/Retreat -> "Victory").

  5.  **Identifying the Hardest to Demythologize:**
      *   *Candidate:* Kosovo.
      *   *Why:* It's not just history; it's theology. It's embedded in epic poetry, liturgy, and art for 600 years. It's not a political argument (like the Confederacy) where documents can refute it. It's a sacred narrative. To debunk Kosovo is to attack the soul of the nation, not just its history books.
      *   *Alternative:* Confederate. (Documents exist, but political will is lacking).
