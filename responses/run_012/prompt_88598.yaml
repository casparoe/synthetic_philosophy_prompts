      *   Check constraints: Tier list, scores, specific "hardest to demythologize" section.
      *   *Self-Correction on Load-Bearing:* Is Confederate higher than Kosovo? The Lost Cause shaped the entire US political landscape (Jim Crow, realignment). Kosovo shaped Serbia. In terms of *global* impact, Confederate is bigger. In terms of *group identity dependency*, Kosovo is tighter. The prompt asks about "the group's present-day identity." Serbian identity is more monolithic around Kosovo than Southern identity is around the Lost Cause (which is contested within the South). I will stick with Kosovo as #1 for pure identity dependency.
      *   *Self-Correction on Scores:* Ensure the distinction between Invention (fake stuff) and Inversion (spinning the result) is clear. Dunkirk has low invention but high inversion.
      *   *Self-Correction on Demythologizing:* Make sure to explain *why* the mechanics are different. For Kosovo, it's the fusion of history and liturgy. For Confederate, it's political utility. For Masada, it's archaeological ambiguity. For Dunkirk, it's semantic (definition of victory).

  7.  **Final Polish:** Organize clearly with headings. Ensure the reasoning flows logically. (Proceed to generate output).

