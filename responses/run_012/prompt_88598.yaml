          *   *Load-bearing:* High. It underpins regional pride, political narratives, and racial hierarchy justifications. However, the US *as a whole* survives without it, though the *South's* specific self-conception takes a hit.
          *   *Invention:* High. Slavery as the cause is explicitly documented in secession declarations.
          *   *Inversion:* High. They lost the war militarily and politically, but the myth claims a moral victory.

      *   **Masada (Jewish Zealots vs. Romans):**
          *   *Core:* Mass suicide rather than surrender. Symbol of resistance against tyranny.
          *   *Identity:* Crucial for modern Israeli statehood (Zionism), military induction ceremonies (IDF). "Never again."
          *   *Load-bearing:* Moderate to High. It was a foundational myth for early Zionism, but modern Israel has moved slightly away from it (due to the religious suicide aspect). Still, the "last stand" ethos is central.
          *   *Invention:* Moderate. Josephus is the main source. Archaeological evidence is debated (did they all die? was it mass suicide or murder?). It's less "invented" than "interpreted."
          *   *Inversion:* Moderate. It was a military defeat, turned into a moral victory. But it wasn't a retreat like Dunkirk.

      *   **Kosovo 1389 (Serbs vs. Ottomans):**
          *   *Core:* Prince Lazar chooses the "Heavenly Kingdom" over the earthly one. Martyrdom. Betrayal by Vuk Branković.
          *   *Identity:* *Extremely* load-bearing for Serbian nationalism. Underpinned 19th-century revival, 1914 assassination (Gavrilo Princip), 1980s Milošević rhetoric, and 1990s wars. It defines the Serb as the "Christ-nation."
          *   *Load-bearing:* Very High. Without it, the narrative of Serbian victimhood and spiritual superiority collapses. It is the axis of the national identity.
          *   *Invention:* High. The "betrayal" is likely fictional. The choice of heavenly kingdom is theological framing added later. The battle was a draw/Pyrrhic victory initially, but long-term Ottoman conquest followed.
          *   *Inversion:* High. Military stalemate/loss turned into spiritual victory.

      *   **Dunkirk (Operation Dynamo):**
          *   *Core:* "Miracle of Dunkirk." Little ships. Unity of the British people. Victory snatched from defeat.
          *   *Identity:* British "Blitz Spirit," resilience, island mentality, WWII narrative (standing alone).
          *   *Load-bearing:* Moderate. It's a key chapter, but British identity doesn't rest *solely* on it (Battle of Britain, Empire, etc.). However, it's the emotional core of the WWII narrative.
          *   *Invention:* Low. It happened. The evacuation was real. The "little ships" narrative is emphasized but not fake.
          *   *Inversion:* High (per prompt definition). It was a retreat/disaster turned into a "victory" of spirit.

  3.  **Drafting the Rankings (Load-Bearing):**
      *   *Criterion:* If everyone accepted the plain historical record, which group's identity falls apart the most?
      *   *1. Kosovo:* Serbian nationalism is structurally built on this specific event. It's the "Genesis" of the national martyrdom narrative. Without it, the 19th-20th century nationalist movements lose their spiritual anchor.
      *   *2. Confederate Lost Cause:* Southern identity is heavily tied to it, but the US national identity absorbs the South. A post-Myth South would still exist, just different. But for *white Southern* identity specifically, it's existential. Let's place it just below Kosovo because Kosovo fuels active geopolitical conflict and state formation in a way the Lost Cause currently doesn't (it's more defensive now). Actually, reconsider: The Lost Cause shaped a country (the US) for 100 years. Kosovo shaped a specific ethnic nationalism. Kosovo feels more "essential" to the specific group's coherence *as defined by the myth*.
      *   *3. Masada:* Early Zionism relied on it heavily. Modern Israel relies more on Holocaust memory and survival. Masada is now somewhat controversial (suicide is Jewishly problematic). It's less load-bearing now than in 1948.
      *   *4. Dunkirk:* British identity is robust enough to survive acknowledging it was a disaster. It changes the *tone* (less triumphalist, more grim resilience) but doesn't collapse the state or national concept.

      *Refined Ranking:* Kosovo > Confederate > Masada > Dunkirk.
      *Reasoning:* Kosovo is the *ontological* basis of the nationalist claim. Confederate is the *sociopolitical* basis of regional hierarchy. Masada is a *foundational* symbol but has been superseded. Dunkirk is a *morale* story within a broader winning war.

  4.  **Drafting the Scores:**

      *   **Confederate:**
          *   Invention: 0.9 (Secession documents explicitly cite slavery. "States Rights" is a retroactive cover).
          *   Inversion: 0.8 (Lost the war, claimed moral victory).
      *   **Masada:**
          *   Invention: 0.5 (Josephus is the only source. Archaeology is ambiguous. Did they die? Yes. Was it a unified choice? Maybe not).
          *   Inversion: 0.7 (Defeat/Death -> Symbol of Freedom).
      *   **Kosovo:**
