answer: |-
  ### Tier List: Load-Bearing Capacity
  *Ranked from most to least essential to the group's present-day identity.*

  **1. Kosovo 1389 (Serbian National Identity)**
  **2. The Confederate Lost Cause (White Southern Identity)**
  **3. Masada (Israeli/Zionist Identity)**
  **4. Dunkirk (British National Identity)**

  **Reasoning:**
  Kosovo sits at the top because it is not merely a historical event for Serbian nationalism; it is the ontological anchor of the nation's self-conception. It frames the Serbs as the "Christ-nation," chosen for martyrdom and spiritual superiority over earthly conquest. If this narrative collapses, the specific ethno-nationalist claim that justifies centuries of grievance and political cohesion loses its theological engine.

  The Confederate Lost Cause is second. While it fundamentally shaped American politics and racial hierarchy for a century, it is increasingly contested *within* the group it was designed to serve (the American South). A post-Myth South would look different, but the regional identity would survive because it is also built on geography, culture, and cuisine, not solely on the war's memory.

  Masada is third. While it was the foundational myth of early Zionism and the IDF, modern Israeli identity has largely pivoted toward the Holocaust and the 1948 War of Independence as primary identity markers. Masada is now often viewed with ambivalence due to the religious prohibition against suicide.

  Dunkirk is fourth. British identity is robust enough to absorb the reality that Dunkirk was a military disaster. The "Blitz Spirit" and the ultimate victory in 1945 provide enough scaffolding that acknowledging Dunkirk as a retreat rather than a miracle changes the *tone* of the identity, but does not collapse the structure.

  ***

  ### Scoring Breakdown

  **1. Kosovo 1389**
  *   **Invention Score:** 0.75
  *   **Inversion Score:** 0.9
  *   **Reasoning:** The battle itself happened, but the core narrative elements—Prince Lazar's choice of the "Heavenly Kingdom," the specific betrayal by Vuk Branković, and the unified martyrdom—are epic poetry codified as history centuries later. The inversion is extreme: a military stalemate that led to 500 years of Ottoman occupation is reframed as a spiritual victory that preserved the nation's soul.

  **2. The Confederate Lost Cause**
  *   **Invention Score:** 0.85
  *   **Inversion Score:** 0.85
  *   **Reasoning:** This rests heavily on outright fabrication. The "states' rights" argument is directly contradicted by the secession declarations and the Cornerstone Speech, which explicitly cite slavery as the cause. The inversion is high: a treasonous rebellion fought to preserve chattel slavery, which resulted in total military defeat and devastation, is reframed as a heroic defense of heritage and a moral victory over "tyranny."

  **3. Masada**
  *   **Invention Score:** 0.5
  *   **Inversion Score:** 0.75
  *   **Reasoning:** We rely almost entirely on Josephus for the narrative. Archaeology confirms the siege and the fire, but suggests some survivors fled, complicating the "mass suicide" totality. It is less invented than *interpreted*. The inversion is significant: a desperate last stand ending in death is transformed into a symbol of enduring freedom and resistance, though it remains a military defeat.

  **4. Dunkirk**
  *   **Invention Score:** 0.15
  *   **Inversion Score:** 0.95
  *   **Reasoning:** There is very little invention; the evacuation happened, the civilian boats participated, and the numbers are roughly accurate. However, it scores highest on inversion because it is the only entry where the event being commemorated was an unambiguous operational failure and retreat. The myth successfully rebrands a flight from the continent as a "miracle" and a precursor to victory.

  ***

  ### The Hardest to Demythologize: Kosovo 1389

  While the Confederate Lost Cause faces the stiffest *political* resistance, **Kosovo 1389** is the hardest to demythologize even for a historian who wants to.

  **The Mechanics of Resistance:**
  The Confederate myth is vulnerable to documentary evidence. The secession conventions wrote down their reasons; the historians who built the Lost Cause (like Dunning) left paper trails that can be cross-referenced and debunked with primary sources. It is a battle of *archives*.

  The Kosovo myth, however, operates in the realm of **sacred time** rather than *historical time*. It was not constructed primarily by historians, but by bards, priests, and poets over six centuries. It is embedded in liturgy, epic poetry, and art that function as religious texts for the secular nation.

  When a historian presents evidence that Vuk Branković did not betray Lazar, or that the battle was not a clean moral choice, they are not just correcting a factual error; they are committing sacrilege. The myth does not claim to be secular history; it claims to be spiritual truth. You cannot debunk a theological assertion with archaeological data. The mechanics here are different because the myth is immune to empirical falsification; its validity is measured by its utility in sustaining group cohesion and spiritual meaning, not its correspondence to physical events. To dismantle it requires dismantling the Serbian Orthodox Church's role in national identity, which is a task far beyond the scope of historical revisionism.
