prompt: |-
  I'm building a unit on lost-cause myths and I want a tier list out of it. Take four: the Confederate Lost Cause, Masada, Kosovo 1389, and Dunkirk. Rank them from most to least load-bearing — by which I mean how much of the group's present-day identity would actually fall apart if everyone just accepted the plain historical record. For each one also give me a rough score (say 0 to 1) on two things: how much the myth rests on outright invention versus mere selective emphasis, and how far it inverts the literal outcome (Dunkirk is the odd one, since the thing being commemorated is basically a retreat). Then tell me which of the four is the hardest to demythologize even for a historian who wants to, and why the mechanics of that one are different. No citations needed, just the reasoning.
reasoning: |-
