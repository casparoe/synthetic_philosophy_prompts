      *   **Goal:** Avoid lecturing. Make them *build* the problem and *feel* the tension. No jargon ("fanaticism," "mugging") until the debrief.
      *   **Provided Sketch:** 4 Phases (Private thresholds -> Board scaling -> Chip game/stranger demand -> Infinite prize/pair off).
      *   **Requirements:** Fix/flesh out the sketch, provide rules/materials/timeline/roles/debrief, predict failure modes, acknowledge limitations.
      *   **Tone:** Professional, academic, practical, honest about limitations.

  2.  **Evaluate the Provided Sketch:**
      *   *Phase 1 (Private Thresholds):* Good start. Gets commitment. Needs clarity on "sure loss" vs. "status quo."
      *   *Phase 2 (Board Scaling):* Logical follow-up. Shows EV dominance. Risk: Becomes math-heavy too fast.
      *   *Phase 3 (Chip Game/Stranger):* This is the core experiential part. "Stranger makes a demand" needs to be gamified carefully so it doesn't feel like roleplay cringe. Needs a mechanic for "astronomically bad."
      *   *Phase 4 (Infinite/Pair Off):* Infinite utility is tricky in decision theory (St. Petersburg paradox territory). Might confuse the specific issue of *fanaticism* (tiny prob * huge value) with *infinity* problems. Need to ensure this connects back to fanaticism and doesn't just become a math puzzle about infinities.
      *   *Debrief:* Needs to map experience to theory.
      *   *Failure Modes:* User identified (a) absurdity, (b) probability zero, (c) bad arithmetic. Need to add more (d) game theory vs. decision theory confusion, (e) boredom.

  3.  **Refining the Plan (Iterative Process):**

      *   *Critique of Phase 3:* "Stranger makes a demand" sounds like a threat. In Pascal's Mugging, it's usually an *offer* (give me $5, I'll give you $5 quadrillion tomorrow) or a *prevention* (give me $5, I won't destroy the simulation). The user suggests "hand over 5 chips or... bad happens." This is Pascal's *Threat*. It works, but needs to be framed as a decision problem, not a mugging in the street sense. Let's make it a "Charity/Project" pitch to keep it academic, or keep the "Threat" but make it abstract (Simulation Guardian). Let's stick closer to the user's "Threat" idea but formalize it as a "Risk Mitigation" choice to fit the EV framework.
      *   *Critique of Phase 4:* Swapping to *infinite* prize changes the problem from Fanaticism (finite but huge) to Infinite Ethics. While related, it might muddy the waters. The core of fanaticism is that *finite* utilities scaled high enough break intuition. However, the user wants to show thresholds collapsing. Let's keep the "Pair Off" mechanic but focus on *constructing* the mugger offer, rather than introducing actual infinity which breaks EV calculus entirely (undefined expectations). Let's stick to "Unbounded Utility" rather than "Infinite Utility."
      *   *Timeline:* 90 mins is tight for 4 phases + debrief. Need to be strict.
      *   *Materials:* Index cards, poker chips (or paper tokens), whiteboard markers.

  4.  **Drafting the Content - Section by Section:**

      *   **Title:** Needs to be neutral. "Decision Under Extreme Uncertainty."
      *   **Objective:** Experiential understanding of EV maximization limits.
      *   **Materials:** Index cards, chips (20 per person), whiteboard.
      *   **Timeline:**
          *   Intro (5 min)
          *   Phase 1: Elicitation (15 min)
          *   Phase 2: The Scaling Attack (20 min)
          *   Phase 3: The Iterated Game (25 min)
          *   Phase 4: The Arms Race (15 min)
          *   Debrief (15 min) -> *Wait, 5+15+20+25+15+15 = 95 mins.* Need to trim. Phase 3 and 4 might need merging or tightening. Let's cut Phase 4's "infinite" aspect and focus on "Unbounded."
      *   **Phase Details:**
          *   *Phase 1:* Make it anonymous. "What is the lowest probability $p$ where you take the bet?"
          *   *Phase 2:* Public commitment. Show the math. $p \times V > Cost$.
          *   *Phase 3:* The "Mugging" Game. Give them endowments. Introduce the "Guardian." If they pay, they lose chips now. If they don't, roll a die (or use a random number generator) for the catastrophe. *Correction:* If the prob is 1 in a trillion, we can't roll for it. It *won't* happen in the room. That's the point. They pay and lose chips, and nothing happens. This creates the *resentment* of EV maximization.
          *   *Phase 4:* Instead of infinity, make it about *constructing* the offer. "Make an offer your partner must accept if they are EV maximizers."
      *   **Debrief:** Connect to Beckstead-Thomas, Longtermism, Bounded Utility.
      *   **Failure Modes:** Address the "Probability 0" move (lexicographic preferences), the "Game is Fake" move, and the "EV is Wrong" conclusion (which is the point, but needs nuance).

  5.  **Refining the "Failure Modes" & "Limitations":**
      *   *User's guesses:* (a) Absurdity, (b) Prob = 0, (c) Arithmetic.
      *   *My additions:* (d) Confusing Decision Theory with Game Theory (is the stranger lying?), (e) The "One-Shot vs. Repeated" confusion (Kelly criterion creep), (f) The "Infinity" distraction.
      *   *Limitations:* This activity shows the *counterintuitiveness*, not the *truth*. It won't prove Fanaticism is correct (Beckstead-Thomas argument). It won't solve the St. Petersburg paradox. It relies on participants caring about the chips.

  6.  **Writing the Response:**
      *   Use the user's structure but polish the mechanics.
      *   Keep the tone collegial (PhD to PhD).
      *   Ensure the "No Jargon" rule is strict.
      *   Make the Debrief questions specific.

      *(Self-Correction during drafting)*: In Phase 3, if they play a "stranger," is it a game? If I play the stranger, I can just say "I'm lying." If it's a mechanism, it's better. Let's make the "Threat" a printed card drawn from a deck where the odds are fixed but unknown? No, Pascal's Mugging relies on *testimony* of low probability. Let's keep it as a verbal offer from the facilitator (me) acting as the "Entity." The key is that the *consequence* is too big to verify, so they must rely on the probability estimate.
      *Actually, better:* Keep it abstract. "A mechanism proposes..." Remove the human element of the "stranger" to avoid game-theoretic "is he bluffing?" distractions. Focus on the *structure* of the bet.

      *Revised Phase 3:* "The Tax." Every round, a proposal appears. Pay X to avoid Risk Y. If you don't pay, we roll a d100 (or d1000 app). If it hits, you lose everything. (Even if the real prob is 1 in a trillion, we simulate the *decision*, not the outcome, or we use a scaled version where the prob is small but testable, then scale it down).
      *Wait, the point of Mugging is the prob is TOO SMALL to test.*
      *Okay, best approach:* They make the decision based on the stated numbers. The "outcome" is irrelevant because the prob is so low it won't trigger. The pain comes from *paying* repeatedly and ending with 0 chips, knowing "nothing happened," but knowing EV said to pay.
      *Actually, the most poignant version:* They pay. Nothing happens. They have fewer chips. At the end, we reveal that *technically* they made the right EV choice, but they feel ruined.

      *Let's refine Phase 4:* The user wants to swap to infinite prize. I should warn them this shifts the topic to Infinite Ethics/St. Petersburg. I will suggest keeping it "Unbounded Finite" to stay on Fanaticism. But I will include their request with a caveat.

      *Debrief:* Needs to explicitly name "Pascal's Mugging" and "Fanaticism" here. Connect to Longtermism (tiny prob of affecting huge future populations).

  7.  **Final Review against Constraints:**
      *   90 mins? Yes, if timed tightly.
      *   No jargon until end? Yes.
      *   Materials listed? Yes.
      *   Failure modes honest? Yes.
      *   Limitations acknowledged? Yes.

  8.  **Final Polish:** Check tone. Ensure it sounds like a plan a peer would respect. (e.g., "Don't let the econ students hijack the conversation with Kelly Criterion.")

  *(Self-Correction on Phase 1)*: "Smallest probability p at which they'd accept a lottery against a sure loss." This is slightly confusing. Better: "You have 10 chips. Option A: Keep 10. Option B: Lose 10 now, but get $N$ chips with probability $p$. What is the smallest $p$ where you take B, given $N$ is large enough?"
  *Actually, standard Mugging:* "Give me 5 chips. I will give you $N$ chips with prob $p$." Or "Give me 5 chips. With prob $1-p$, you lose everything."
  Let's stick to the user's "Sure Loss" framing but clarify it. "Pay a cost to avoid a risk" or "Pay a cost for a chance." The Mugging is usually "Pay cost for huge reward." The Threat is "Pay cost to avoid huge loss." They are symmetric in EV. Let's use the "Huge Reward" (Mugging) for Phase 1/2 and "Huge Threat" for Phase 3 to vary it.
  *Wait, User's Phase 1:* "Give up 1 chip for p chance at 1000." Okay.
  *User's Phase 3:* "Hand over 5 chips or... bad happens." (Threat).
  This mix is fine. It shows symmetry.

  Okay, ready to write.
answer: |-
  This is a strong pedagogical instinct. Decision theory concepts stick best when students feel the tension between the formalism and their intuition, rather than just hearing about the tension. Your sketch is solid, but it needs tightening to fit 90 minutes and to prevent the "econ students" from solving the game theoretically (e.g., "I won't play because this is a one-shot anonymous game") rather than engaging with the decision theoretic problem.

  Here is a fleshed-out run sheet, refined mechanics, and a candid assessment of where this will likely break.

  # Session Plan: Extreme Expectations
  **Time:** 90 Minutes
  **Participants:** ~15 (Phil + Econ)
  **Materials:** Index cards (2 per person), Poker chips (or paper tokens, 20 per person), Whiteboard + Markers, A visible timer.
  **Rule #1:** No jargon (no "EV," "utility," "mugging," "fanaticism") until the Debrief.
  **Rule #2:** No game-theoretic objections during play (e.g., "Is the facilitator lying?"). Treat all stated probabilities as fixed parameters.

  ---

  ## Phase 1: Elicitation (15 mins)
  **Goal:** Establish private commitment to a probability threshold.

  1.  **Setup (2 mins):** Hand out 20 chips and 2 index cards to each participant. Tell them chips represent "value" for today's session.
  2.  **Card 1 (5 mins):** Ask them to write anonymously:
      *   *"I will pay 1 chip for a **____%** chance to win 1,000 chips."*
      *   Tell them to fill in the lowest percentage where they would still take the deal.
  3.  **Card 2 (5 mins):** Ask them to write anonymously:
      *   *"I will pay 1 chip for a **____%** chance to win **N** chips, no matter how large N gets."*
      *   Tell them if there is *no* probability low enough that they would take the bet regardless of the prize, they should write "0" or "Never."
  4.  **Collection (3 mins):** Collect cards. Shuffle them. Do not look at them yet.

  ## Phase 2: The Scaling Attack (20 mins)
  **Goal:** Publicly demonstrate that any non-zero probability threshold is EV-dominable.

  1.  **The Board (5 mins):** Draw a table on the whiteboard: **Cost | Probability | Prize | Expected Return**.
  2.  **The Reveal (5 mins):** Read 3-4 cards from Phase 1 aloud. Write the probabilities on the board (e.g., 1%, 0.001%, 1 in a million).
  3.  **The Grind (10 mins):** Pick the smallest non-zero probability written (say, $p = 10^{-6}$).
      *   Ask the room: "If the prize is $10^7$ chips, is the expected return greater than the 1 chip cost?" (Yes).
      *   Ask: "If someone wrote $10^{-9}$, what prize makes it worth it?"
      *   **The Trap:** Keep scaling the prize. Every time someone suggests a probability floor, you scale the prize until $p \times \text{Prize} > \text{Cost}$.
      *   **Facilitator Script:** "I am not asking if you *believe* the probability. I am asking: *If* this is the probability, and *if* this is the prize, does the math compel you?"
      *   **End State:** The board should show that for any $p > 0$, there exists a Prize $N$ such that the bet is positive. Anyone who wrote "0" or "Never" is now isolated.

  ## Phase 3: The Iterated Threat (25 mins)
  **Goal:** Feel the cumulative cost of EV-maximization under uncertainty.

  1.  **Setup (5 mins):** Everyone resets to 20 chips. You (the facilitator) play "The Entity."
  2.  **The Mechanism (5 mins):** Announce 5 rounds. In each round, you present a threat.
      *   *Example:* "Pay me 2 chips now. If you don't, there is a 1 in 10,000 chance I will destroy all your chips."
      *   Scale the threat up each round. Round 1: 1 in 1,000. Round 5: 1 in 1 trillion.
      *   Scale the loss up. Round 1: Lose 5 chips. Round 5: Lose everything + owe 10 chips.
  3.  **The Play (10 mins):**
      *   Participants decide privately whether to pay.
      *   **Crucial:** Do not resolve the risk immediately. Just collect the chips from those who pay. For those who don't, mark their name.
      *   After 5 rounds, reveal that *none* of the catastrophic risks triggered (because the probabilities were too low).
      *   **Result:** The EV-maximizers (who paid to avoid the risk) will have 0 or negative chips. The "risk neglectors" (who didn't pay) still have ~20 chips.
  4.  **The Tension (5 mins):** Ask the EV-maximizers: "You followed the math. You are ruined. The others ignored the math. They are rich. Who made the mistake?" (Do not answer yet).

  ## Phase 4: The Arms Race (15 mins)
  **Goal:** Demonstrate the instability of unbounded utility.

  1.  **Pair Up (5 mins):** Participants pair off. Person A and Person B.
  2.  **The Challenge (5 mins):**
      *   Person A must construct a lottery (Cost, Probability, Prize) that Person B *must* accept if they are maximizing expected value.
      *   Person B must try to construct one that A must accept.
      *   **Constraint:** You cannot use "Infinity." You must use finite numbers.
  3.  **The Collapse (5 mins):**
      *   Ask pairs to report back.
      *   They will realize that for any lottery A proposes, B can propose a "Mugging" lottery with a lower probability but higher prize that drains A's resources faster.
      *   **Facilitator Script:** "If utility is unbounded, can you ever be safe from a lottery design?"

  ## Debrief & Mapping (15 mins)
  **Goal:** Connect the experience to the literature. **Now you can use jargon.**

  1.  **Reveal the Topic (2 mins):** Write "Pascal's Mugging" and "Expected Value Fanaticism" on the board.
  2.  **Map Phase 1 & 2 (4 mins):**
      *   *Concept:* **No Probability Floor.**
      *   *Discussion:* If you reject $p=0$, you are vulnerable to scaling. This is the core of the Beckstead-Thomas argument for Longtermism. If the future is vast, tiny probabilities of affecting it dominate small certain goods.
  3.  **Map Phase 3 (4 mins):**
      *   *Concept:* **Ex Ante vs. Ex Post / Ruin.**
      *   *Discussion:* EV is an ex ante guide. Phase 3 showed ex post ruin. Does rationality require avoiding ruin even if EV is positive? (Introduce **Kelly Criterion** or **Bounded Utility** as solutions).
      *   *Ask the Econ students:* "Why didn't Kelly betting save you?" (Answer: Kelly requires repeated bets with known distributions; Mugging relies on unique, untestable testimony).
  4.  **Map Phase 4 (3 mins):**
      *   *Concept:* **Unbounded Utility.**
      *   *Discussion:* If utility is unbounded, fanaticism is mathematically necessary. To stop the mugging, you must either bound utility (say 1 billion chips is the max value) or set a probability floor (say $p < 10^{-10}$ is treated as 0).
  5.  **Closing Question (2 mins):** "Is the problem with the math, or with our intuition about large numbers?"

  ---

  # Predictable Failure Modes (And How to Patch Them)

  You guessed three; here are those plus three more that are specific to this demographic.

  **1. The "Probability Zero" Derail (Your guess B)**
  *   **The Problem:** An epistemologist will raise their hand in Phase 1 and say, "Any probability not based on a frequency model is effectively zero. I write 0."
  *   **The Patch:** Pre-empt this in the instructions. "For this exercise, treat probabilities as *given parameters*, not subjective credences. If the card says $10^{-10}$, you must treat it as $10^{-10}$, not 0." If they persist, isolate them: "Okay, you are immune to the mugging. But can you justify that axiom to the rest of the class without begging the question?"

  **2. The "This Is Fake" Disengagement (Your guess A)**
  *   **The Problem:** Once the chips represent "quadrillions of utils," students stop caring about the tokens.
  *   **The Patch:** Keep the chip stakes meaningful. Announce at the start: "The person with the most chips at the end chooses the topic for the next reading group / gets the last slice of pizza / gets a bottle of wine." You need a tangible terminal value for the chips, or the EV calculation has no utility anchor.

  **3. Whiteboard Arithmetic Chaos (Your guess C)**
  *   **The Problem:** Writing $1,000,000,000,000$ is slow and error-prone.
  *   **The Patch:** Use scientific notation exclusively on the board ($10^9$, $10^{12}$). It looks more "formal" anyway and reduces calculation errors.

  **4. The Game Theory Hijack (New)**
  *   **The Problem:** In Phase 3, someone will say, "The Facilitator has an incentive to lie about the probability. I won't pay."
  *   **The Patch:** Enforce **Rule #2**. "We are analyzing the decision structure, not the credibility of the messenger. Assume the probability is fixed by a mechanism." If they keep pushing, acknowledge it: "That's a *credence* problem. We are analyzing the *value* problem. Assume you *know* the probability."

  **5. The Kelly Criterion Creep (New)**
  *   **The Problem:** Econ students will try to argue for log-utility (Kelly betting) to solve the mugging.
  *   **The Patch:** This is actually a good objection, but it sidesteps the point. Acknowledge it: "Kelly avoids ruin, but it violates the Independence Axiom of VNM expected utility. If you use Kelly, you are no longer an EV maximizer. You have adopted a different decision rule. That is a valid solution, but admit you are abandoning pure EV."

  **6. The Infinity Distraction (New)**
  *   **The Problem:** In Phase 4, someone introduces actual Infinity ($\infty$). This breaks the math (expectations become undefined) and shifts the conversation to St. Petersburg Paradox rather than Fanaticism.
  *   **The Patch:** Explicitly forbid the symbol $\infty$ in Phase 4. "You must use finite numbers. The point is that *finite* numbers get large enough to break us, not that infinity exists."

  ---

  # What This Activity Cannot Do (Limitations)

  Be honest with them in the debrief. This activity has blind spots:

  1.  **It Doesn't Prove Fanaticism is *Right*:** The activity makes fanaticism look absurd (because they feel ruined in Phase 3). It does not reproduce the **Beckstead-Thomas Argument** that *rejecting* fanaticism leads to even worse violations (like ignoring the far future). You have to lecture that part. The activity motivates the *problem*, not the *solution*.
  2.  **It Conflates Risk and Credence:** Pascal's Mugging is often about the probability of the *testimony* being reliable, not the probability of the event given the testimony. This activity treats probabilities as fixed, which simplifies the epistemology too much.
  3.  **It Doesn't Solve Bounded Utility:** Students will suggest "Just bound utility!" The activity shows *why* they want to, but it doesn't show the cost (e.g., you become indifferent to saving 1 billion lives vs 1 billion + 1 lives if you're at the bound). You need to explain that cost verbally.
  4.  **No "Longtermism" Connection Automatically:** Unless you explicitly draw the line in the debrief, they won't connect "Pascal's Mugging" to "AI Existential Risk." You must make that link: "If the future is $10^{50}$ lives, a $10^{-20}$ chance of saving them dominates all present suffering. That is not a mugging; that is the math of Longtermism."

  # Facilitator Cheat Sheet (Key Moves)

  *   **If they get bored:** Speed up Phase 2. Don't calculate every number. Just write "$10^{100}$" and ask "Is this bigger than your cost?"
  *   **If they get angry:** Lean into it. "Good. That frustration is the philosophical data point."
  *   **If the Econ students dominate:** Turn to the Phil students. "Does the math satisfy you, even if the game theory doesn't?"
  *   **If the arithmetic gets messy:** Stop. "The exact number doesn't matter. Is it *larger* than the cost? Yes/No."

  This plan respects their intelligence, avoids the "lecture trap," and gives you concrete moments to reference when you finally open the literature. Good luck.
