  **Brainstorming: Structural Dependencies**

  Before formalising the argument, I list the structural features upon which the strategy-stealing logic appears to lean. These will dictate the organisation of the analysis.

  *   **Symmetry of Objectives:** Both players must be aiming for the same configuration; otherwise, one cannot appropriate the other's plan.
  *   **Monotonicity of Position:** Having an extra mark on the board must never be a disadvantage (no *zugzwang* regarding piece placement).
  *   **Move Substitutability:** If a strategy dictates a move that is already occupied, one must be able to play elsewhere without invalidating the strategy's efficacy.
  *   **Finiteness:** The game must terminate; otherwise, "winning" is ill-defined.
  *   **Perfect Information:** No hidden state; strategies must be functions of the visible board.
  *   **Determinacy of Outcome:** To upgrade from "Second cannot win" to "First must win", the possibility of a draw must be excluded.

  ***

  **1. What the Argument Establishes about Elbow**

  The strategy-stealing argument proceeds by *reductio ad absurdum*. We begin by assuming the negation of what we wish to disprove: suppose Second possesses a winning strategy $\Sigma_2$. This $\Sigma_2$ is a function mapping any reachable board state (where it is Second's turn) to a move that guarantees a win for Second, regardless of First's play.

  First makes an arbitrary initial move, claiming cell $c_1$. Thereafter, First ignores $c_1$ and pretends to be Second, adopting $\Sigma_2$. Whenever $\Sigma_2$ dictates playing at a cell $x$, First plays at $x$, provided $x$ is unclaimed. A delicate step arises here: if $\Sigma_2$ dictates playing at $c_1$ (which First already owns), First plays arbitrarily at some other unclaimed cell $c'$.

  Consequently, at any stage of the game, First's set of claimed cells contains the set of cells $\Sigma_2$ would have claimed as Second, plus the initial arbitrary move $c_1$ (and potentially $c'$). In Elbow, the win condition is possessing three cells forming an L-tromino. Since possessing a superset of a winning set necessarily contains the winning subset, First satisfies the win condition whenever $\Sigma_2$ would have. Thus, First wins.

  This contradicts the assumption that $\Sigma_2$ guarantees a win for Second (since both players cannot win). Therefore, the assumption is false. The argument establishes precisely that **there does not exist a winning strategy for Second**. In logical notation: $\neg (\exists \Sigma_2 \forall \Sigma_1 (\text{Outcome} = \text{Second Wins}))$.

  **2. First Wins vs. Something Weaker**

  It is crucial to distinguish between the non-existence of a winning strategy for Second and the existence of a winning strategy for First. The argument proves $\neg (\text{Second Wins})$. It does *not* prove $\exists \Sigma_1 (\text{First Wins})$.

  The difference matters because the space of outcomes may include a draw. If the game is determined (one player must win), then $\neg (\text{Second Wins}) \implies \text{First Wins}$. However, if a draw is possible, $\neg (\text{Second Wins})$ implies only $\text{First Wins} \lor \text{Draw}$. The strategy-stealing argument alone cannot distinguish between these cases. It proves First can avoid losing, but not necessarily that First can force a win. In the context of Elbow, without further analysis of the draw condition, we are licensed only to claim that Second cannot force a win.

  **3. The Possibility of a Draw in Elbow**

  Elbow can indeed end in a draw. To demonstrate this, consider a checkerboard colouring of the $5 \times 5$ grid. Let cell $(i, j)$ be black if $i+j$ is even, and white if $i+j$ is odd.

  Consider any $2 \times 2$ block of cells. The coordinates are $(i, j), (i+1, j), (i, j+1), (i+1, j+1)$. The parities of the sums $i+j$ are $p, 1-p, 1-p, p$. Thus, every $2 \times 2$ block contains exactly two black cells and two white cells. An L-tromino requires three cells of the same colour within a $2 \times 2$ block. Since no such monochromatic triple exists in any $2 \times 2$ block under this colouring, it is impossible to form an L-tromino if players restrict themselves to cells of a single colour.

  The grid has 25 cells: 13 of one colour (say, black) and 12 of the other (white). If First claims only black cells and Second claims only white cells, the board will fill completely without either player forming an L-tromino. While this requires cooperation to *force*, the existence of such a terminal position proves that a draw is structurally permissible under the rules.

  This implies the strategy-stealing conclusion is weak for Elbow. Since a draw is possible, the proof that "Second has no winning strategy" does not upgrade to "First has a winning strategy". First may merely be able to force a draw, or the game may be a draw with perfect play from both sides. The argument leaves the existence of a winning strategy for First undecided.

  **4. Presuppositions and Counter-Examples**

  The argument collapses if any of the following presuppositions fail. I list them with concrete counter-examples.

  *   **Presupposition 1: Monotonicity (Extra marks are never harmful).**
      *   *Requirement:* Having a superset of winning pieces must not prevent a win.
      *   *Failure Case:* **Misere Tic-Tac-Toe**. Players claim cells, but the first to complete a 3-in-a-row *loses*. Here, an extra mark is a positive disadvantage; it brings you closer to defeat. If First steals Second's strategy, the extra arbitrary move might complete a line for First, causing First to lose immediately. The contradiction fails.
  *   **Presupposition 2: Symmetry of Objectives.**
      *   *Requirement:* Both players must win by achieving the same configuration.
      *   *Failure Case:* **Asymmetric Lines**. Player 1 wins by completing a horizontal line; Player 2 wins by completing a vertical line. Second's strategy is designed to build vertical lines. If First adopts this strategy, First builds vertical lines, which does not satisfy First's win condition. The stolen strategy is irrelevant to First's goal.
  *   **Presupposition 3: Finiteness (Termination).**
      *   *Requirement:* The game must end in a finite number of moves.
      *   *Failure Case:* **Looping Checkers**. If rules allow pieces to cycle indefinitely without progress, a "winning strategy" may not exist because the game never terminates. The contradiction relies on the assumption that a win occurs at a specific move index.
  *   **Presupposition 4: Move Substitutability.**
      *   *Requirement:* If the strategy calls for an occupied cell, playing elsewhere must not ruin the position.
      *   *Failure Case:* **Key-and-Lock**. A game where specific moves unlock specific regions. If the strategy requires Move A to unlock Region B, and Move A is already taken (by the arbitrary opening), playing Move C instead might leave Region B locked forever. This is closely tied to Monotonicity but distinct in mechanism.

  **5. Upgrading to "First Wins"**

  To upgrade the claim from "Second has no winning strategy" to "First has a winning strategy", we require the property of **Determinacy without Draws** (often called the *no-draw property*).

  Formally, we require that for every terminal state, exactly one player satisfies the win condition. If $\forall \text{ terminal states } S, (\text{First Wins}(S) \lor \text{Second Wins}(S)) \land \neg (\text{First Wins}(S) \land \text{Second Wins}(S))$, then the outcome space is partitioned strictly into First Wins and Second Wins.

  Given this property, the statement $\neg (\exists \Sigma_2 \text{ such that Second Wins})$ logically entails $\exists \Sigma_1 \text{ such that First Wins}$. This property is precisely what is required because it closes the logical gap left by the possibility of a draw. In Elbow, the checkerboard analysis shows this property fails, blocking the upgrade.

  **6. Conceptual Status of the Argument**

  The strategy-stealing argument is fundamentally **non-constructive**. It proves the existence of a state of affairs (the non-existence of a second-player win, or potentially the existence of a first-player win) by demonstrating that the alternative leads to a contradiction. It does not exhibit the strategy $\Sigma_1$.

  To know that a winning strategy exists while being unable to exhibit one is a standard feature of classical mathematics, relying on the Law of Excluded Middle. In constructive logic, this proof would be invalid; one would require an explicit algorithm for $\Sigma_1$.

  I do not regard this as a defect, but rather as an artefact of the question being asked. We are asking about the *existence* of a solution in a vast search space, not the solution itself. The argument illuminates the structural asymmetry inherent in symmetric games: the turn order itself confers an advantage that cannot be neutralised by the second player, regardless of the specific board geometry. It separates the *fact* of advantage from the *mechanism* of advantage.

  ***

  **Closing**

  The single most important thing the strategy-stealing argument does not tell you is *how* to win. It provides no heuristic, no opening move, and no tactical guidance; it merely asserts that such guidance exists. People nonetheless find it illuminating because it reveals a deep structural truth: in symmetric games of placement, the initiative is inherently valuable. It transforms a question of complex calculation into a question of logical possibility, showing that the first mover holds a privilege that no amount of second-player ingenuity can fully erase.
