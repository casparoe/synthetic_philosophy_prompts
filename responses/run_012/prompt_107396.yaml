  Let's go with the **"Who draws the regions?"** question. It's more practical and political, fitting the audience of small business owners who hate regulatory uncertainty.

  *Re-evaluating the "Feared Question":* The speaker cares most about the regional calculation. The weakness is that regional calculation is *less* proportional than national.
  Question: **"You say you want every vote to count equally. But if I vote for a small party that gets 5% nationally, but only 2% in our specific region, my vote counts for nothing. Haven't you just built a new kind of wasted vote?"**
