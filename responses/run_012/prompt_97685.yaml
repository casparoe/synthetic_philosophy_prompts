prompt: |-
  So I think I've basically been talked into the view that Dutch book arguments are the real foundation for probabilism — the reason incoherent credences are irrational is that they leave you open to a sure loss, and that's supposed to be more or less the whole story. I've also been treating the diachronic versions, the ones that are supposed to get you conditionalization and the reflection principle, as pretty much the same kind of argument just stretched over time. Before I go around repeating this to people like it's settled, I want the case against it: what would have to be true, or what would we have to see, for this to be wrong? I don't mean the lazy version of the objection (betting isn't a good model of belief, full stop) — I want the actual defeaters, sorted from the ones that should genuinely move me down to the ones that are just the usual grumbling, and I want to know which of them a committed defender would themselves concede count against the view rather than waving away.

  A few things I'd like you to chew on specifically, because my reading group keeps going in circles on them. First, one person insists the argument only shows that somebody *can* take your money if you're incoherent, and that this only convicts you of irrationality if you're required to accept every bet that looks favorable by your own lights — is that a genuine defeater or a cheap evasion, and does it get worse in the diachronic case where the bookie seems to need to know what you'll do later? Second, do the arguments survive once we stop assuming money is linear in utility, or once we let the agent have imprecise credences instead of a single number for everything? And third, is there a real difference in exposure between the synchronic argument for the probability axioms and the diachronic ones — is the extension to conditionalization and reflection the same arguement or is it doing something extra that's more vulnerable? Rank the defeaters from fatal to merely awkward, and for each one tell me whether it targets the conclusion (incoherent credences are irrational) or only the argument for that conclusion, since I suspect those are getting conflated a lot.

  Also say what the view predicts that its rivals don't, if anything — I want to know whether it risks anything at all or whether it's been insulated by qualifications, and if it has, whether that's actually a problem for a view of this kind or just what a foundational claim looks like. End with a final line beginning Verdict: followed by the single defeater you'd rank as most damaging, in under fifteen words.
