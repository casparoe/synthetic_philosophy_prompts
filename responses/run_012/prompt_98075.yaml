      *   *Introduction:* Acknowledge the sophistication of the position (it's a "Liberal Perfectionist + Social Model" hybrid).
      *   *Structure:* Go through the ranked tensions.
      *   *For each tension:* Define the clash, assess severity, propose the revision to one commitment, and assess the cost.
      *   *Focus:* Keep it tight. No fluff. Direct audit style.

