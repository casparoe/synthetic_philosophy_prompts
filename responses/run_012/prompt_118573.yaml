prompt: |-
  I'm a software engineer with no formal training in philosophy, applying to a fellowship that funds practitioners to spend six months on a research project. I need a two-page proposal. My half-formed idea: most discussions of AI alignment describe the problem as making a system's objectives match ours, but the failure mode that worries me professionally is a different one. In safety-critical software the thing that actually bites you is not that one implementation is wrong; it is that every implementation is wrong the same way — the same shared assumption, the same misread spec, the same underlying library — so redundancy buys you nothing and a single bug takes out everything at once. My hunch is that 'the alignment problem' is really two questions that get run together: (1) whether a single system does what its operator intended, and (2) whether failures across many such systems will be correlated. If that is right, then the arguments that make alignment sound uniquely urgent are usually arguments about (2), while the technical work mostly addresses (1), and the remedy implied by (2) — some form of enforced diversity — is not what you get by making each system individually more correct.

  Turn this into a proposal. State the question precisely enough that it has a determinate answer, say which existing positions leave it open and why, describing those positions by what they claim rather than by who holds them (I will add citations myself; no bibliography or reading list, please), lay out the method month by month, say what a good outcome looks like and what would count as the project failing, and be honest about what could make the project too vague or too large to finish in six months. Also tell me whether the two-question split is the right cut or whether it collapses back into a single question — if it collapses, I would rather know that before I apply.

  Open with the proposal document itself, with no preface or commentary on my request.
