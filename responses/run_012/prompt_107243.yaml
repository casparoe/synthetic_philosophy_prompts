answer: |-
  This is a fantastic argument. Your roommate hasn't just "read some philosophy"; they have reconstructed one of the most famous and durable arguments in contemporary metaphysics. It is essentially the **Argument from Vagueness** for **Mereological Nihilism**, championed by philosophers like Peter van Inwagen and David Lewis.

  The argument is logically valid. If you accept all the premises, the conclusion (7) follows inescapably. Since you want to reject (7) (tables exist) and you want to keep (3) (existence isn't just a human label), you have to find a way to break the chain elsewhere.

  Here is the breakdown of where the argument can be stopped, what you have to buy into to stop it, and which option best fits your intuitions.

  ### The Diagnosis
  The engine of this argument is the **Sorites Paradox** (the paradox of the heap) applied to existence.
  *   **Premise (5)** claims that any condition for "objecthood" (bonding, contact, etc.) is vague.
  *   **Premise (2)** assumes that if objects exist, there must be a *sharp* boundary between "object" and "non-object."
  *   **Premise (3)** assumes that boundary must be *mind-independent*.

  If you hold (3) fixed (as you want to), you generally have three main escape routes. Each comes with a philosophical "cost."

  ---

  ### Option 1: Reject Premise (2) — Embrace "Universalism"
  **The Move:** You deny that there is a line to be drawn. You claim that **any** collection of things, no matter how scattered, composes a further thing.
  **The View:** *Mereological Universalism* (associated with David Lewis).

  *   **How it solves the problem:** If *every* collection of particles constitutes an object, then there is no moment where a table "winks out of existence." When you sand off a molecule, the original object (Table) ceases to exist, but a new object (Table-minus-one-molecule) still exists. In fact, *both* existed all along. There is no transition from "non-object" to "object," so the Sorites paradox (Premise 5) loses its grip.
  *   **Does it save tables?** Yes. The particles arranged table-wise do compose an object.
  *   **Does it keep (3)?** Yes. It is a fact about the world, not our minds, that these particles compose an object.
  *   **The Cost:** Ontological bloat. You have to accept that there is an object made of your left shoe and the Moon. There is an object made of the coffee in your cup and the cat. Most of these objects have no name and no unity, but they exist.
  *   **Verdict:** This is the most logically robust way to keep (3) and reject (7). It treats existence as abundant rather than scarce.

  ### Option 2: Reject Premise (5) — Embrace "Epistemicism"
  **The Move:** You insist that there *is* a sharp line, we just can't know where it is.
  **The View:** *Epistemicism about Vagueness* (associated with Timothy Williamson).

  *   **How it solves the problem:** You admit that there is a specific number of molecules (or a specific bond strength) where composition stops. If you remove *that specific molecule*, the object ceases to exist. It seems absurd to us, but that's just a limitation of our knowledge, not a feature of the world.
  *   **Does it save tables?** Yes.
  *   **Does it keep (3)?** Yes. The cutoff is intrinsic to the objects.
  *   **The Cost:** It requires you to believe in "metaphysical precision." You have to swallow the idea that the universe cares exactly which molecule is the boundary of a table, even though physics suggests reality is fuzzy at that scale. It feels deeply counter-intuitive.
  *   **Verdict:** Logically consistent, but psychologically painful.

  ### Option 3: Reject the Inference from (6) to (7) — Embrace "Brutalism"
  **The Move:** You agree that no *analysis* of the features (bonding, contact, etc.) can draw the line, but you deny that this means composition *never* happens. You claim composition is a **brute fact**.
  **The View:** *Mereological Brutalism* (associated with Ted Sider).

  *   **How it solves the problem:** You argue that Premise (4) is too demanding. It assumes we can explain *why* composition happens in terms of simpler physical relations. Brutalism says: "Sometimes particles compose things, sometimes they don't, and there is no deeper 'feature' that explains it. It's just a fundamental law of nature."
  *   **Does it save tables?** Yes.
  *   **Does it keep (3)?** Yes.
  *   **The Cost:** It stops inquiry. It essentially says, "It just does." It posits a fundamental metaphysical rule that we can't analyze.
  *   **Verdict:** This preserves common sense best but feels like a "conversation stopper."

  ---

  ### A Fourth Option: The "Organic" Compromise
  There is one famous middle ground you should know about, proposed by Peter van Inwagen (who originally formulated the Special Composition Question).

  He accepts the argument for almost everything **except living beings**.
  *   **View:** *Organicism.*
  *   **Claim:** Composition only occurs when the activity of the parts constitutes a *life*.
  *   **Result:** There are no tables, no chairs, no clouds. There are only simples (particles) and living organisms (you, me, the cat).
  *   **Why consider it?** It accepts the force of your roommate's argument (rejecting tables) but blocks the nihilist conclusion (7) by saving "you and me."
  *   **Cost:** You have to admit your roommate is right about the table. You'd have to say, "There is no table, there are just particles arranged table-wise."

  ### Regarding your "Clouds and Countries" intuition
  You mentioned: *"I have a nagging feeling the same reasoning would prove there are no clouds and no countries, which smells like a reductio."*

  *   **Countries:** Your roommate would agree countries don't exist in the same way atoms do. Countries violate your Premise (3). They exist *only* because we agree they do (conventionalism). So the argument doesn't apply to them.
  *   **Clouds:** This is the stronger point. Clouds suffer the exact same vagueness as tables. If the argument proves there are no tables, it proves there are no clouds.
      *   **Is this a reductio?** Not necessarily. A Nihilist will happily say, "Correct, there are no clouds. There is only water vapor."
      *   **However,** if you feel that "Clouds exist" is more certain than "Premise (5) is true," then you have found your reductio. You are prioritizing common sense over the demand for sharp boundaries.

  ### Recommendation: What should you tell your roommate?

  If you want to win the argument while respecting your own constraint (that existence isn't just a human label), **Option 1 (Universalism)** is your strongest play.

  **Say this:**
  > "I accept your logic, but I reject Premise (2). I don't think there has to be a 'line' between objects and collections. I believe in **Unrestricted Composition**. Any particles compose an object. That means tables *do* exist (the particles arranged table-wise compose something), but so does 'table-minus-a-molecule.' There is no magical moment where existence pops in or out, so your Sorites argument doesn't apply. We avoid Nihilism without needing magic boundaries."

  **What you are buying into:**
  You are buying into a world cluttered with infinite objects. Every time you move your hand, you create and destroy millions of "hand-shaped objects" and "hand-minus-atom objects." It's weird, but it saves the reality of the table without relying on human convention.

  **If that's too weird:**
  Then you must soften your stance on **(3)**. Most philosophers who believe tables exist admit that *which* collections count as "unified objects" is partially determined by our conceptual schemes. We carve the world at its joints, but *where we decide to carve* is up to us. If you admit that, the table exists because the particles are there *and* because we have a concept that groups them. That kills the argument instantly, but it requires you to concede that "what exists" is partly dependent on minds.

  **Summary:**
  1.  **Roommate's Argument:** Sound, but leads to Nihilism.
  2.  **To save Tables + Keep (3):** Become a **Universalist**. (Tables exist, but so does everything else).
  3.  **To save Tables + Keep Common Sense:** Soften **(3)**. (Tables exist partly because we conceptualize them as such).
  4.  **To save People + Kill Tables:** Become an **Organicist** (van Inwagen's view).

  Your roommate's argument is a classic for a reason: it forces you to choose between common sense, logical precision, and ontological simplicity. You can't have all three.
