      *   *Self-Correction on Population:* Be careful not to say population *fell*. It stagnated. This breaks the Malthusian link but keeps the "resources per capita" link if resources (land/revenue) didn't grow.
      *   *Elite Overproduction:* Emphasize that in Tokugawa, "overproduction" means "biological reproduction of elites exceeded economic reproduction of stipends."

  8.  **Final Review against constraints:**
      *   No reading lists? Check.
      *   Argument focused? Check.
      *   Address the "closed elite" specific prompt? Check.
      *   Address the "resolution" specific prompt? Check.

  **(Self-Correction during drafting):** I need to make sure I don't just say "SDT fails." I need to show *how* it maps and where it strains. The prompt asks to "run it through" the theory. The most interesting tension is the "Closed Elite." Standard SDT (Turchin) often looks at US or Rome where elites are somewhat permeable. Tokugawa is rigid. How does overproduction manifest? It manifests as *pauperization* of the elite, not exclusion from entry. This is a crucial distinction. I need to make sure the "Aspirant vs. Incumbent" distinction is used to clarify this. In Tokugawa, the "Aspirants" are the lower samurai who *have* status but no power/money. The "Incumbents" are the Shogunate/High Daimyo.

