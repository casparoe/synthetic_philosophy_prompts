          *   End Game: Boshin War (Civil War), Meiji Restoration (Elite-led).
          *   Trigger: Perry (External shock).
      *   *Tension:* SDT relies heavily on demographic pressure driving wages down and state capacity down. Tokugawa had *stagnant* population during the crisis phase. This is a major potential mismatch.
      *   *Elite Overproduction:* Samurai numbers grew (natural increase) but stipends didn't. Status inflation? Yes. Debt? Yes. But they couldn't be "fired." They became poor elites. Is this "overproduction" if the *number of positions* is fixed by law but the *resources* to support them shrink?
      *   *Immiseration:* Peasants suffered (famines), but the driving political force seems to be the *samurai* distress, not just peasant revolt. SDT usually emphasizes the masses + counter-elite alliance. Here, it's lower samurai + some daimyo vs. Shogunate.
