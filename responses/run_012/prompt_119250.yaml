          3.  Test the "closed hereditary elite" constraint against SDT's implicit assumptions about open recruitment/elite overproduction mechanisms. Distinguish between aspirant counter-elite vs. entrenched incumbent elite.
          4.  Conclusion: Confirmation, anomaly, or boundary condition? (Specifically regarding the elite-led restoration vs. demographic collapse).

  2.  **Initial Brainstorming & Mapping (Mental Scratchpad):**
      *   *SDT Core:* Population up -> Wages down/Prices up -> State fiscal stress (can't pay elites) + Elite Overproduction (too many claimants for too few spots) + Popular Immiseration -> Instability -> Crisis -> Reset.
      *   *Tokugawa Facts:*
          *   Pop growth: High early 17th, stalls ~1720-1850. (SDT usually expects pop pressure *during* crisis, here pop stalled *before* crisis).
          *   Elite: Samurai (5-8%). Hereditary. Fixed stipends (rice).
          *   Economy: Commercialization, rice-to-money conversion issues.
          *   State Finance: Shogunate/Daimyo broke. Reforms failed.
