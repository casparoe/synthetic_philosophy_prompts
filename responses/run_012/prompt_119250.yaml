      *   *State Fiscal Distress:* Shogunate bankrupt, reforms (Kyoho, etc.) failed. *Value:* High. *Evidence:* Debasement of currency, loans from merchants, inability to fund coastal defense.
      *   *Phase Structure:* Integrative (early Tokugawa peace) -> Disintegrative (19th century). *Value:* Fits the timeline roughly, but the "secular cycle" length is very long (250 years).

  4.  **Drafting Section 2: Fit Assessment (The "Immiseration" Question):**
      *   *Good Fit:* State fiscal distress is textbook. Elite overproduction is visible (poor samurai). Instability increases over time.
      *   *Bad Fit:* Population stagnation during the crisis phase contradicts the standard Malthusian driver of SDT. The "masses" didn't overthrow the state; the *elite* did.
      *   *Key Insight:* The causal work was done by *elite* immiseration (downward mobility of samurai), not just mass immiseration. The samurai were the "people" in the political sense, while peasants were largely depoliticized until late. The "popular" unrest pressured the state, but the *counter-elite* was internal (lower samurai), not external.

  5.  **Drafting Section 3: The Closed Elite Test:**
      *   *SDT Assumption:* Usually assumes open systems where too many educated people can't get jobs (e.g., US PhDs, Late Roman lawyers).
