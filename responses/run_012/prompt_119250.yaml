      *   *Does it work?* Yes, this distinction saves the theory. The "overproduction" isn't of *candidates* for entry, but of *claimants* on existing resources. The "counter-elite" mobilization happened *within* the legal elite class. The theory needs to accommodate "intra-elite fragmentation" driven by relative deprivation, not just exclusion from entry.

