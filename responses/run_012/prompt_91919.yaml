  hey, so for a philosophy thing I've been reading about typogenetics — it's this made-up system where you have strings of letters and enzymes that can cut, copy, and rearrange the strings, and the enzymes are themselves coded by the strings, so a string can end up making the enzyme that copies it. The crazy part is that the typogenetic rules can be mapped onto arithmetic, so a self-replicating string is also a kind of mathematical sentence that refers to itself (I think this is definately called the DNA-Gödel isomorphism). Can you write a short story, like 3 pages, about a high schooler who builds a typogenetic system for a science fair and slowly realizes that the thing copying itself in her petri dish is also a theorem in arithmetic? Don't have a teacher explain it in a lecture — let her figure it out through glitches, alot of late nights, and a string that keeps making a slightly wrong copy of itself. No citations or reading list please.
