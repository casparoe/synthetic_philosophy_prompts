  The rule displayed by the record is the **Nash Bargaining Solution**.

  **Precise Statement:**
  For any bargaining problem $(S, d)$, the solution is the unique utility pair $(u_1^*, u_2^*) \in S$ that maximizes the Nash product:
  $$ (u_1 - d_1)(u_2 - d_2) $$
  subject to $(u_1, u_2) \in S$ and $u_i \ge d_i$.

