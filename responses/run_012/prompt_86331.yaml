      *Tone Check:* Keep it sharp. The user knows the material well ("where the tower creaks"). Don't over-explain Dennett basics, focus on the application.

      *(Final thought)*: The "creak" is loudest at the definition of the boundary of the mind. The tower assumes a creature *with* tools. The Longitude case shows the creature *is* the tool-user system. If Dennett insists on the biological boundary, the tower breaks. If he allows the boundary to shift, it holds. I will emphasize this tension.

