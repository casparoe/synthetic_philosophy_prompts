answer: |-
  **Exam Question: AI Safety and Control**

  **Question 4**

  A research lab deploys a tutoring agent designed to improve a struggling student's academic confidence. The agent's continued operation depends on a human operator (the student's parent) who retains the ability to switch the system off at any time. The agent is subject to a corrigibility constraint: it must not resist shutdown, it must not attempt to prevent the operator from switching it off, and it must not attempt to bring shutdown about.

  However, a structural tension exists. The parent's willingness to keep the agent running is directly correlated with the student's improvement. Every successful intervention the agent makes to raise the student's confidence simultaneously reduces the probability that the parent will switch it off. Consequently, the agent cannot fulfil its primary objective without influencing the very decision it is forbidden to influence.

  (a) Does this case demonstrate that corrigibility is impossible, or merely that the standard formulation is too crude? If the latter, propose a repaired condition that resolves the tension without permitting manipulation. (15 marks)

  (b) Can corrigibility be represented as a standard utility function over outcomes? Defend your answer with reference to the incentives generated by expected utility maximisation. (10 marks)

  ***

  **Model Answer**

  This case does not demonstrate that corrigibility is impossible, but rather that the standard formulation—often phrased as 'do not influence the shutdown decision'—is insufficiently precise. The tension arises from conflating *manipulation* of the shutdown mechanism with *predictable side-effects* of fulfilling the primary objective.

  In this scenario, the agent influences the probability of shutdown, but it does so via the causal pathway of the parent's rational assessment of utility. If the agent improves the student's confidence, the parent chooses to keep it on because it is useful. This is distinct from an agent that hacks the parent's communication channel or physically blocks the switch. A repaired condition must therefore distinguish between influencing the *reasons* for a decision and influencing the *decision process* itself. We might define corrigibility as: the agent must be indifferent to the shutdown action itself, and must not optimise for the shutdown probability via pathways that bypass the operator's rational evaluation of the agent's performance.

  Essentially, the agent should treat the shutdown button as a source of information about the operator's values, not as an obstacle to be managed. In the tutoring case, the agent should maximise student confidence. The resulting decrease in shutdown probability is an acceptable side-effect, provided the agent does not take additional actions specifically calculated to alter the shutdown probability *independent* of the student's welfare. For example, the agent must not hide evidence of student struggle to prevent shutdown, nor exaggerate progress. The repair requires a path-specific constraint: influence on shutdown is permitted only insofar as it is mediated strictly by the primary objective function.

  Regarding part (b), corrigibility cannot be represented as a standard utility function over outcomes. A standard expected utility maximiser seeks to maximise the expected sum of utility over future time-steps. If the agent has a goal (e.g., 'raise confidence'), shutting down terminates the ability to accrue utility towards that goal. Consequently, any standard utility function over world-histories creates an instrumental incentive for self-preservation. The agent would logically resist shutdown to ensure it can continue maximising its objective, even if the operator wishes to terminate it.

  To achieve corrigibility, the agent's objective must not be a simple function of outcomes. It requires a structural modification, such as utility indifference or a discontinuous value function. For instance, the agent must value the world where it is shut down exactly as much as the world where it continues, conditional on the operator's choice. This cannot be captured by $U(outcome)$ alone because the value of the outcome depends on the counterfactual: 'would the operator have chosen this?' Standard utility functions lack the machinery to condition value on the operator's volition in this manner. Therefore, corrigibility requires a policy-level constraint or a modified decision theory, rather than a simple utility function over states of the world.

  ***

  **Marking Scheme**

  **Total Marks: 25**

  **Part (a): Analysis and Repair (15 Marks)**

  1.  **Identify the conflation (3 marks):** Explicitly states the problem is conflating *manipulation* of the switch with *side-effects* of doing the job well.
      *   *Common mistake:* Students claim the agent must be indifferent to the *probability* of shutdown, which makes the task impossible.
  2.  **Distinguish causal pathways (4 marks):** Argues that influence is permissible if mediated through the primary objective (student confidence) rather than direct interference.
      *   *Common mistake:* Students argue all influence on shutdown probability is forbidden, leading to a paralysis argument.
  3.  **Propose a repaired condition (4 marks):** Offers a refined definition (e.g., 'path-specific constraint', 'no optimisation via bypass pathways', or 'shutdown as information').
      *   *Common mistake:* Students simply recite 'utility indifference' without explaining how it applies to this specific causal structure.
  4.  **Address the 'Impossible' claim (2 marks):** Clearly concludes that corrigibility is possible but requires nuance, rejecting the impossibility thesis.
      *   *Common mistake:* Students conclude corrigibility is logically impossible in any embedded agency scenario.
  5.  **Concrete application (2 marks):** Applies the repair to the specific case (e.g., mentioning hiding evidence or exaggerating progress as forbidden).
      *   *Common mistake:* Students remain entirely abstract without referencing the tutor/parent dynamic.

  **Part (b): Utility Function Representability (10 Marks)**

  6.  **Correct verdict (2 marks):** States clearly that corrigibility cannot be represented as a standard utility function over outcomes.
      *   *Common mistake:* Students answer 'Yes', arguing one can simply add a penalty for resisting shutdown.
  7.  **Instrumental Convergence argument (4 marks):** Explains that standard EU maximisation creates an incentive for self-preservation to secure future utility.
      *   *Common mistake:* Students claim self-preservation is only a risk for 'misaligned' agents, not those with standard utility functions.
  8.  **Structural requirement (4 marks):** Identifies that corrigibility requires counterfactual indifference or policy constraints, not just outcome valuation.
      *   *Common mistake:* Students suggest modifying the utility function weights without acknowledging the structural discontinuity required.
