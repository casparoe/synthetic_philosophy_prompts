answer: |-
  Right, let's have a proper look at this. You've stumbled into one of the classic itch-scratches of philosophy without even realising it. You're arguing about **social ontology** — that is, what kind of thing exists in the world when people get together and do stuff — and **the philosophy of language**, specifically whether words describe reality or create it.

  Your flatmate is taking the pragmatic, instrumentalist view: words are tools, use the right one for the job. You are taking the realist view: words track something real about the nature of the thing, and getting it wrong is a kind of lie.

  You asked me to pick a side and not fence-sit. So, here is my position: **You are right to feel dissatisfied, and your flatmate is wrong to say it's "just words."** There *is* a fact of the matter, but it isn't the fact either of you is currently looking for. The flatmate's "rename it and move on" trick doesn't dissolve the problem; it dodges the responsibility that comes with naming.

  Here is why.

  ### 1. Why "Just Words" is a Cop-Out
  Your flatmate's argument is that because "business" and "hobby" are human concepts (unlike "rock" or "water"), they are flexible. He's half-right. These are what philosophers call **social kinds**. A ten-pound note is only money because we agree it is. A marriage is only a marriage because we agree on the rules.

  However, just because something is a social construct doesn't mean it's arbitrary. Once you construct it, it has rules. If you say "this is a marriage," you can't later say "but for me it doesn't imply fidelity" without breaking the concept.

  When your flatmate says, "Call it a business for tax and a hobby for the pub," he is treating the word as a **label** stuck on the outside of a box. But in social reality, the word is part of the **structure** of the box. This is what J.L. Austin called a "speech act." Naming something *does* something.

  If you call it a business, you invoke a set of norms: growth, efficiency, market demand, profit maximisation. If you call it a hobby, you invoke different norms: expression, enjoyment, personal satisfaction, freedom from market forces.

  By trying to hold both labels simultaneously, your flatmate is trying to claim the **status** of a business (legitimacy, structure, potential profit) without accepting the **obligations** of a business (the pressure to prioritise profit over pleasure). That is why it feels like a cop-out. It's intellectually dishonest. It's wanting the authority of the label without the burden of the definition.

  ### 2. Is There a Fact of the Matter?
  So, is there a truth here? Yes. But it's not a physical truth like "the candle weighs 200 grams." It is a **teleological fact**. *Telos* is Greek for "end" or "purpose."

  To determine what a thing *is*, you have to ask: **What is this thing *for*?**

  *   **Your test:** "Would we do it for free?" This tests the *motivation*.
  *   **His test:** "Do we keep accounts?" This tests the *administration*.

  Administration follows function. You don't keep accounts because you're a business; you keep accounts because you want to track surplus. But tracking surplus doesn't make surplus the *point*.

  The fact of the matter rests on the **dominant intention** of the participants.
  If the primary goal is the *activity itself* (making pots, seeing people, the joy of the market), it is a hobby that generates revenue.
  If the primary goal is the *outcome* (profit, scaling up, building a brand), it is a business that generates enjoyment.

  You cannot have two primary goals. One must be subordinate to the other. If you make a pot that you love but nobody buys, a **business** says: "Stop making that, it's a loss." A **hobby** says: "Make it anyway, it's beautiful."

  The fact of the matter is settled by asking: **If the market demanded you stop making the things you love and start making things you hate, but which sell better, what would you do?**
  *   If you switch: It's a business.
  *   If you refuse: It's a hobby.

  That is the objective test. It's not about the spreadsheet; it's about where the sovereignty lies. Does the market rule you, or do you rule the market? Your flatmate wants to say the spreadsheet decides. You say the motivation decides. Philosophically, **you are closer to the truth.** Motivation constitutes the activity; administration merely records it.

  ### 3. The Pattern (Art, Craft, Language)
  You mentioned this happens with "art vs. craft" and "language vs. dialect." This confirms my diagnosis. These aren't just classification errors; they are **status disputes**.

  *   **Art vs. Craft:** "Art" implies unique expression and high status; "Craft" implies utility and skill. Calling your pots "art" claims a certain cultural capital. Calling them "craft" admits they are functional objects.
  *   **Language vs. Dialect:** As the linguist Max Weinreich famously said, "A language is a dialect with an army and a navy." Calling your nan's speech a "language" grants it sovereignty and dignity. Calling it a "dialect" implies it's a subordinate offshoot of something else.

  In all three cases (Business, Art, Language), the argument feels real because the **consequences of the label are real.** Your flatmate wants to treat the label as a sticker. You intuitively understand the label is a **contract.**

  ### 4. Why You Can't Just "Drop It"
  If you accept his "just words" solution, you create a fracture in your shared reality.
  Imagine six months from now. Sales dip. You have to decide whether to spend £500 on a new kiln.
  *   If you're a **business**, you run the numbers. If the ROI isn't there, you don't buy it.
  *   If you're a **hobby**, you ask: "Will we enjoy using it?" If yes, you buy it.

  If you haven't settled what you are, this decision will cause a row. He will say, "We need to be prudent, it's a business." You will say, "We do this for joy, it's a hobby." The row you're having now is a prophylactic against the row you'll have then.

  He thinks he's being flexible. Actually, he's being vague. And vagueness in shared commitments is a recipe for resentment.

  ### The Verdict
  You are not being daft. Your intuition is philosophically sounder than his.

  1.  **There is a fact of the matter.** It is determined by the *telos* (purpose) of the activity, specifically revealed by what you would sacrifice if profit and pleasure came into conflict.
  2.  **Words are not just labels.** In social contexts, words are constitutive. Calling it a business *makes* it a business by imposing the norms of business upon it.
  3.  **His solution fails.** Context-switching (business for tax, hobby for pub) works for the outside world, but it doesn't work for *you*. You two are the architects of this thing. You need a single, shared constitution.

  **My advice:**
  Stop arguing about the word. Argue about the **hypothetical sacrifice**. Sit him down and ask: "If we had to choose between making £1,000 profit selling ugly candles, or £100 profit selling beautiful ones, which do we pick?"

  *   If he says £1,000: He wants a business. You need to decide if you're willing to be a businessman.
  *   If he says £100: You were right all along. It's a hobby. The accounts are just a diary of your fun.

  Settle the intention, and the word will look after itself. But do not let him convince you that the distinction doesn't matter. It matters because it tells you who is master of your time: you, or the market.
