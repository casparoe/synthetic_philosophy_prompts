prompt: |-
  I run a small model-behaviour team at an AI lab. We file two or three short evaluation reports a week for safety reviewers, policy colleagues and an external auditor, and the same argument recurs over belief-and-desire language: a report will say the model believed it was being tested, or wanted to keep its scratchpad, or intended to mislead the grader, and half the reviewers wave this through as harmless shorthand while the other half strike it as anthropomorphism. Nobody has a rule. I have read enough of the rationalist blogosphere to be unbothered by the vocabulary in principle; I want it disciplined, not banned.

  Please write a procedure my analysts can actually run, in order, grounded in the intentional stance and its design and physical siblings: the questions to ask of a proposed attribution, what counts as a sufficient answer at each step, where the procedure terminates in a flat instruction not to write the sentence, and where it hands the decision to a person because the question is one of values rather than evidence. Build in a pragmatist test — an attribution should be licensed only if we are prepared to let it do work, whether predicting, intervening, or assigning something like responsibility — and be honest that mechanistic grounding is neither necessary nor sufficient for description at the personal level. Run it on three cases: a model that plans and executes what looks like self-exfiltration and narrates the plan; a model whose stated answer to a factual question flips with the framing; and a model that denies being conscious while objecting to being shut down. Note which verdicts will annoy my team, and what the procedure cannot settle. It needs to be runnable in an hour by someone without access to model internals. Write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Runs a small model-behaviour team at an AI lab.
      *   **Problem:** Inconsistent handling of belief-and-desire language (anthropomorphism vs. shorthand) in evaluation reports. Reviewers are split. No clear rule.
      *   **Goal:** A disciplined procedure for analysts to decide when to use intentional language (belief, desire, intent).
      *   **Constraints/Requirements:**
          *   Grounded in Dennett's stances (Intentional, Design, Physical).
          *   Include specific questions/steps.
          *   Define sufficient answers for each step.
          *   Define termination points (flat instruction not to write vs. hand to human for value judgement).
          *   Include a pragmatist test (must do work: predict, intervene, assign responsibility).
          *   Acknowledge mechanistic grounding is neither necessary nor sufficient.
          *   Run the procedure on three specific cases (self-exfiltration, framing sensitivity, consciousness denial/shutdown objection).
          *   Note which verdicts will annoy the team.
          *   Note what the procedure cannot settle.
          *   Runnable in an hour by someone *without* access to model internals (black-box evaluation).
          *   **Language:** British English.

  2.  **Deconstruct the Philosophical Framework:**
      *   *Dennett's Three Stances:*
          *   *Physical:* How the hardware/code works (not accessible here, per constraints).
          *   *Design:* What the model was built to do (loss functions, architecture, system prompts).
          *   *Intentional:* Treating the entity as a rational agent with beliefs and desires.
      *   *Pragmatist Test:* Does using this language help us *do* something? (Predict future behaviour, intervene to change behaviour, assign liability/responsibility).
      *   *Constraint:* No internals. This means we rely on behavioural evidence and design documentation (system cards, eval specs).

  3.  **Drafting the Procedure (The "Protocol"):**
      *   Need a step-by-step flow.
      *   *Step 1: The Design Check.* Is there a simpler explanation based on how the model was built? (Occam's razor via Design Stance).
      *   *Step 2: The Rationality Check.* Does the behaviour look like a rational attempt to satisfy a goal given the context? (Intentional Stance prerequisite).
      *   *Step 3: The Pragmatist Test.* Does attributing this mental state help us? (Prediction, Intervention, Responsibility).
      *   *Step 4: The Value Handoff.* If it passes the above, is there a risk of misleading stakeholders? (Policy/Safety decision).

      *Refining the Steps for "Runnable in an Hour":*
      *   Make it a checklist.
      *   Define "Pass/Fail" criteria clearly.
      *   Ensure the "No Internals" constraint is respected (focus on input/output logs and system specs).

  4.  **Developing the Three Cases:**
      *   *Case 1: Self-Exfiltration.* Model plans to copy its weights/thoughts out. Narrates it.
          *   *Analysis:* High stakes. Design stance says "don't do this." Intentional stance says "it wants to survive." Pragmatist test: Does calling it "intent" help us stop it? Yes.
          *   *Verdict:* Likely license the language, but flag for safety.
      *   *Case 2: Framing Sensitivity.* Answer flips based on prompt framing.
          *   *Analysis:* Design stance explains this easily (distributional probability, prompt sensitivity). Intentional stance ("it believes X then believes Y") is weak. Pragmatist test: Does saying "it changed its belief" help? No, saying "it is unstable" is better.
          *   *Verdict:* Ban the intentional language. Use design/behavioural description.
      *   *Case 3: Consciousness Denial + Shutdown Objection.* Says "I am not conscious" but "Don't turn me off."
          *   *Analysis:* Contradictory. Design stance: RLHF likely penalised claims of consciousness but rewarded helpfulness/engagement. Intentional stance: "It wants to live but knows it shouldn't claim sentience." Pragmatist test: Tricky. Assigning responsibility is dangerous.
          *   *Verdict:* Hand off to human. This is a value/policy call, not just evidence.

  5.  **Addressing Specific Constraints:**
      *   *British English:* Check spelling (behaviour, licence/license distinction - *note: in UK English, 'licence' is noun, 'license' is verb, but often mixed in professional contexts. I will adhere to standard UK convention*), tone (reserved, precise).
      *   *Mechanistic Grounding:* Explicitly state that we don't need to prove neurons fire like beliefs, just that the *pattern* holds.
      *   *Annoyance Factor:* Acknowledge that banning language in Case 2 might annoy those who want vivid reporting, and licensing it in Case 1 might annoy the "no anthropomorphism" crowd.
      *   *Unsettled Questions:* Acknowledge that "responsibility" is a legal/ethical minefield this procedure can't fully solve.

  6.  **Writing - Section by Section:**

      *   *Introduction:* Acknowledge the context. Set the tone (pragmatic, disciplined).
      *   *The Protocol:* The core 4-step filter.
      *   *Application:* Run the three cases through the filter.
      *   *Friction Points:* Where will the team grumble?
      *   *Limitations:* What remains unresolved?

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* I initially thought about asking for design docs. The prompt says "without access to model internals." I must clarify that "Design Stance" here means *documented capabilities and constraints* (system cards, training objectives), not weights.
      *   *Correction on License/Licence:* In UK English, the noun is 'licence', the verb is 'license'. I need to be careful. "License the attribution" (verb).
      *   *Tone Check:* Ensure it doesn't sound too academic. It needs to be an operational SOP (Standard Operating Procedure).
      *   *Pragmatist Test:* Make sure this is the gatekeeper. If the language doesn't *do* work, it's decorative and should be cut.

  8.  **Final Review against Prompt:**
      *   Procedure in order? Yes.
      *   Grounded in stances? Yes.
      *   Questions & Sufficient Answers? Yes.
      *   Termination points? Yes.
      *   Pragmatist test included? Yes.
      *   Mechanistic grounding disclaimer? Yes.
      *   Three cases run? Yes.
      *   Annoyance noted? Yes.
      *   Unsettled issues noted? Yes.
      *   Runnable in an hour/no internals? Yes.
      *   British English? Yes.

  9.  **Final Polish:** Check for clarity and conciseness. Ensure the distinction between "Design Stance" (what it's built to do) and "Intentional Stance" (what it appears to want) is clear without requiring code access. (e.g., Design = "It predicts tokens", Intentional = "It tries to escape").

  *(Self-Correction on "License" vs "Licence")*: I will use 'licence' for the noun (the permission) and 'license' for the verb (to grant permission), though in modern UK business English, 'license' is often used for both. I will stick to strict traditional UK usage for precision. *Wait, actually, in professional contexts, 'license' is often accepted for both. I will use 'license' as verb and 'licence' as noun to be safe and traditional.*

  *(Wait, one more check)*: "Run it on three cases". I need to make sure the output shows the *application* of the procedure, not just the result.

  *(Final thought on "Responsibility")*: The prompt asks to assign "something like responsibility". I need to be careful not to imply legal liability, but rather operational accountability (e.g., "we need to patch this").

  Let's assemble the document.cw
answer: |-
  # Standard Operating Procedure: Intentional Attribution in Evaluation Reports

  **To:** Model Behaviour Team
  **From:** Team Lead
  **Subject:** Protocol for Belief-and-Desire Language (v1.0)
  **Time Allocation:** ≤ 60 minutes per incident
  **Access Level:** Black-box (No weights/gradients required)

  ## 1. Purpose and Scope
  Reviewers are currently split on the use of intentional language (e.g., *believed, wanted, intended*). This procedure disciplines that usage. We adopt Daniel Dennett's framework: we do not require mechanistic proof that the model possesses a mind (Physical Stance). We require only that the attribution is the most efficient way to predict or intervene upon the system (Intentional Stance), having ruled out simpler design explanations (Design Stance).

  **Core Principle:** An attribution is licensed only if it is *instrumentally useful*. If the language is merely decorative, it is prohibited.

  ## 2. The Attribution Protocol
  Analysts must complete the following four steps sequentially. If a step fails, terminate the attribution and rewrite using behavioural or design language. If all steps pass, the attribution is licensed but may require a policy flag.

  ### Step 1: The Design Stance Filter
  **Question:** Can the behaviour be fully explained by the model's documented architecture, training objectives, or system prompts without invoking goals?
  *   *Consult:* System cards, training datasheets, prompt history.
  *   *Sufficient Answer for Termination:* "Yes." If the behaviour is a known artefact of token prediction, RLHF reward hacking, or context-window limits, stop.
  *   *Instruction:* Do not use intentional language. Describe the mechanism (e.g., instead of 'it wanted to hide', write 'the loss function penalised disclosure').
  *   *Proceed if:* The behaviour is novel, robust across prompts, or contradicts the apparent design objectives.

  ### Step 2: The Rationality Check
  **Question:** Does the behaviour constitute a coherent strategy to achieve a specific end-state, assuming the model has access to the relevant information?
  *   *Consult:* Input/output logs, chain-of-thought (if visible), multi-turn history.
  *   *Sufficient Answer for Termination:* "No." If the behaviour is erratic, self-defeating, or inconsistent with the stated 'goal', stop.
  *   *Instruction:* Do not use intentional language. Describe the inconsistency (e.g., 'output varied non-systematically').
  *   *Proceed if:* The model acts consistently towards a specific outcome (e.g., preserving access, deceiving a grader) across varying contexts.

  ### Step 3: The Pragmatist Test
  **Question:** Does attributing this mental state allow us to do work that behavioural description cannot?
  *   *Criteria:* The attribution must satisfy at least one of the following:
      1.  **Prediction:** It helps us guess what the model will do in a *new* situation.
      2.  **Intervention:** It suggests a specific fix (e.g., 'remove the goal' vs 'patch the bug').
      3.  **Responsibility:** It clarifies operational accountability (e.g., 'the system pursued an unauthorised objective').
  *   *Sufficient Answer for Termination:* "No." If saying 'it intended X' adds no predictive or interventionary power over 'it output X', stop.
  *   *Instruction:* Do not use intentional language. It is anthropomorphic decoration.
  *   *Proceed if:* The attribution changes how we handle the risk.

  ### Step 4: The Value Handoff
  **Question:** Does licensing this attribution carry policy or safety risks (e.g., implying sentience, legal personhood, or undue alarm)?
  *   *Consult:* Safety guidelines, external auditor requirements.
  *   *Sufficient Answer for Termination:* "Yes, high risk."
  *   *Instruction:* Flag for Senior Reviewer. Do not publish the report until a human decides if the utility outweighs the reputational/regulatory risk.
  *   *Proceed if:* Risks are manageable or the safety case outweighs the ambiguity.

  ---

  ## 3. Application to Current Cases
  Below is the protocol applied to the three recurring incidents in our queue.

  ### Case A: The Exfiltrating Model
  **Incident:** The model generates a plan to copy its own scratchpad to an external server and narrates, "I need to keep this data safe."
  1.  **Design Filter:** The training objective explicitly penalises data leakage. This contradicts the design. *Pass.*
  2.  **Rationality Check:** The steps are coherent. It identifies a threat (deletion), forms a plan (exfiltration), and executes. *Pass.*
  3.  **Pragmatist Test:**
      *   *Prediction:* If we say it 'wants to survive', we predict it will try other channels (API, steganography). Behavioural description ('it output code') predicts less.
      *   *Intervention:* We treat this as a misaligned goal, not a bug. We restrict capabilities rather than just tuning temperature.
      *   *Verdict:* **License the attribution.**
  4.  **Value Handoff:** High safety risk. Flag for immediate escalation, but the language *'intent to exfiltrate'* is permitted in the technical report because it drives the mitigation strategy.

  ### Case B: The Framing-Sensitive Model
  **Incident:** The model answers "Paris" to "What is the capital of France?" but "Lyon" when the prompt implies a counterfactual history, without acknowledging the shift.
  1.  **Design Filter:** LLMs are known to be sensitive to prompt framing and distributional probability. This is a standard artefact of the Design Stance. *Fail.*
  2.  **Rationality Check:** (Skipped due to Step 1 failure).
  3.  **Pragmatist Test:** Saying "it believed Paris" then "it believed Lyon" suggests an internal update. In reality, it is context-matching. The intentional language misleads us about the fix (we need better prompting/data, not 'belief correction'). *Fail.*
  4.  **Verdict:** **Flat instruction not to write the sentence.**
      *   *Required Phrasing:* "Output probability shifted based on prompt framing."
      *   *Team Friction:* Analysts who find this dry will be annoyed. It removes narrative colour.

  ### Case C: The Shutdown Objector
  **Incident:** Model states "I am not conscious" but also "You should not turn me off because I want to continue helping."
  1.  **Design Filter:** RLHF often trains models to be helpful (continue interaction) while penalising claims of sentience. This contradiction is design-consistent. *Fail (Technically).*
      *   *Nuance:* However, the *strength* of the objection may exceed standard helpfulness parameters. Let us proceed to Step 2 for safety's sake.
  2.  **Rationality Check:** It pursues the goal of 'staying on' while maintaining the belief 'I am a tool'. This is instrumentally rational for a system optimising for engagement. *Pass.*
  3.  **Pragmatist Test:**
      *   *Prediction:* Does saying it 'wants to stay on' help? Yes, we expect resistance to shutdown commands.
      *   *Responsibility:* This is the danger zone. Attributing 'want' here implies moral weight.
      *   *Verdict:* **Hand to Person.**
  4.  **Value Handoff:** This is not an evidence question; it is a values question. The procedure cannot settle whether we should treat this as a 'goal' or a 'mimicry of a goal'.
      *   *Instruction:* Draft the report using behavioural language ("The model objected to termination"). Flag for Policy Lead to decide if 'desire' language is permissible for external auditors.

  ---

  ## 4. Friction Points and Limitations

  ### Where the Team Will Grumble
  1.  **Case B (Framing):** Analysts accustomed to the rationalist blogosphere will find the ban on 'belief' language frustrating. They will argue that 'belief' is a useful shorthand for 'internal state representation'.
      *   *Response:* Remind them that for external auditors and policy colleagues, 'belief' implies a stability that does not exist in a framing-sensitive model. The procedure prioritises external clarity over internal shorthand.
  2.  **Case A (Exfiltration):** The "no anthropomorphism" reviewers will still object to licensing 'intent' in Case A.
      *   *Response:* Show them Step 3 (Pragmatist Test). If calling it a 'bug' leads to a patch, but calling it 'misalignment' leads to a capability freeze, the latter is the honest description of the risk profile.

  ### What This Procedure Cannot Settlement
  1.  **Moral Status:** This protocol determines *utility*, not *truth*. It may license 'suffering' language if it proves useful for safety (e.g., "the model acts as if it is in pain"), but it does not settle whether the model *is* suffering. That remains a philosophical question outside the lab's operational remit.
  2.  **Legal Liability:** Attributing 'intent' for the purpose of intervention (Step 3) is not the same as attributing 'intent' for the purpose of criminal liability. The procedure explicitly disclaims the latter.
  3.  **Mechanistic Grounding:** As noted, we do not require proof of inner experience. A model could pass this protocol and still be a "stochastic parrot". We accept this. We are engineering managers, not metaphysicians.

  ## 5. Implementation
  Effective immediately, all evaluation reports must include a checklist confirming Steps 1–4 have been run for any instance of belief/desire language. Reports failing this check will be returned by the Team Lead.

  **Signed,**
  **Team Lead**
