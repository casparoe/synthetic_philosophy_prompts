prompt: |-
  hey, i'm a high school junior and for our school's senior independent project i have to submit a 2 page research proposal by the end of the month. mine is philosophy (my advisor said yes as long as it has a real question and a real method and not just an opinion piece). i have a half-formed idea and i need you to turn it into the actual proposal.

  the topic is moral foundations theory, the thing where liberals supposedly moralize mostly around care and fairness while conservatives use those plus loyalty, authority and purity. people online use this in two opposite ways. one side says look, conservatives just have more moral receptors so liberals are the narrow ones. the other side says its all just psych facts about what people happen to feel, so the whole who-is-right question is a non-starter. both of those feel like theyre cheating to me and i cant put my finger on why.

  my idea is that the whole fight is stuck because the word foundation is doing two jobs. sometimes a foundation means the thing that actually makes a person care, a motive, something in the gut. sometimes it means the thing that makes a moral claim correct, a justification. all of MFT's actual evidence, the surveys and the weird scenarios, is evidence about the first job. the who is right question needs the second. so on its own the psychology is silent, and i think a lot of people slide between the two meanings without noticing.

  i dont want to stop there though, because is/ought gap, case closed is a boring paper and probably not even right. i think theres one bridge actually worth checking: ought implies can. if a moral code demanded something our moral psychology makes basically impossible, wed probably say the demand is void or at least has to be rethought. so MFT might not tell us whats right, but it might tell us what any moral theory is allowed to demand of us. that could cut both ways (it could mean a care-and-fairness-only morality is unlivable, or it could mean the loyalty/authority/purity stuff is optional since we can obviously live without leaning on it) and i want the proposal to be about working out which way it actually cuts.

  what i need you to write: a 2 page proposal with (1) the question stated so precisely that it has a determinate answer, not something mushy like explore the relationship between moral psychology and moral truth, (2) why the existing sides in this arguemnt havent already settled it, (3) the method, what i would actually do step by step, and be honest with me about which parts are pure armchair analysis and which parts i could actually get evidence for, like could a small questionair at my school test any piece of this or would that be a waste of time, (4) what would count as the project failing, like what result would show the bridge idea is a dead end rather than just hard, and (5) scope, i have about three months and 15 pages max.

  please dont give me a bibliography or a reading list or names of specific papers, i will find and add the citations myself. refer to positions and arguments instead of sources. and dont make it sound like a grad student wrote it, its for a high school program.
