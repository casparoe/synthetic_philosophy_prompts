answer: |-
  ### The Zeno Decision Tree

  **Root:** How does your response block the paradox?

  1.  **Accept the Conclusion** (Motion is impossible/contradictory).
  2.  **Deny the Entailment** (Premises are true, but do not prove motion is impossible).
  3.  **Claim Category Error** (The paradox is not really about motion).
  4.  **Deny a Premise**.
      *   **4a:** Deny "A finite stretch can be divided without end".
      *   **4b:** Deny "Infinitely many parts can all be gone through".
      *   **4c:** Deny "A thing in motion is somewhere at each instant".
      *   **4d:** Deny "There is a next instant at all".
      *   *(Follow-up for 4a–4d)*: **What is the continuum?** (Points, Gunky, Potential, Discrete).

  ---

  ### The Leaves (Positions)

  1.  **Eleatic Illusionism** (Accept Conclusion)
      *   *Awkward commitment:* Sensory experience of change is systematically deceptive and metaphysically void.
  2.  **Dialetheism** (Accept Conclusion as True Contradiction)
      *   *Awkward commitment:* Classical logic must be abandoned to tolerate true contradictions of the same kind as the Liar.
  3.  **Linguistic Dissolution** (Category Error)
      *   *Awkward commitment:* Deep metaphysical problems are merely confusions arising from the misuse of language.
  4.  **Russellian 'At-At' Theory** (Deny Entailment)
      *   *Awkward commitment:* Motion is merely a correlation of positions, not a dynamic process occurring *within* an instant.
  5.  **Quantised Spacetime** (Deny P1 + Discrete)
      *   *Awkward commitment:* Physics must abandon continuous geometry for a fundamental grid of space and time.
  6.  **Standard Realist** (Deny P2 + Points)
      *   *Awkward commitment:* Actual infinities and completed supertasks are metaphysically possible in the physical world.
  7.  **Aristotelian Potentialist** (Deny P2 + Potential)
      *   *Awkward commitment:* The infinite exists only as a process of division, never as a completed whole of parts.
  8.  **Motion Primitivist** (Deny P3 + Gunky/Flux)
      *   *Awkward commitment:* Velocity cannot be defined at an instant, only over extended intervals of time.
  9.  **Gunky Continuum** (Deny P1/P2 mix + Gunky)
      *   *Awkward commitment:* Geometry must be reformed to exclude dimensionless points entirely, leaving only extended parts.
  10. **Unnamed Position** (Deny P3 + Points)
      *   *Awkward commitment:* One must explain how point-based space hosts motion that lacks a precise instantaneous position.

  ---

  ### Analysis of the Tree

  **Indistinguishable Pairs**
  *   **Leaves 6 (Standard Realist) and 4d (Deny 'Next Instant'):** In practice, these are often indistinguishable. To deny that infinitely many parts can be traversed (Leaf 6) usually requires accepting the mathematical continuum where there is no 'next' instant (Leaf 4d). The tree separates them by *intent* (attacking the traversal vs attacking the temporal structure), but the resulting mathematics is identical.

  **Unoccupied Combinations**
  *   **Deny P1 (No infinite division) + Continuum: Points all the way down.**
      *   *Verdict:* **Incoherent.** If space is built from points all the way down, it is by definition infinitely divisible; one cannot deny division while affirming the ontology that guarantees it.
  *   **Deny P4 (No next instant) + Continuum: Discrete chunks.**
      *   *Verdict:* **Incoherent.** A discrete chunk structure logically entails a successor function; if there are chunks, there must be a 'next' chunk.
  *   **Deny P2 (Cannot traverse infinite) + Continuum: Discrete chunks.**
      *   *Verdict:* **Unattractive.** If space is discrete, there are no infinite parts to traverse in a finite stretch, so denying the *traversability* of infinity is a solution in search of a problem.
  *   **Leaf 10 (Deny P3 + Points).**
      *   *Verdict:* **Unexplored.** Most who deny instantaneous position (Primitivists) do so because they reject point-based ontology (Gunky). Maintaining points while denying instantaneous location is a difficult niche that few occupy.
