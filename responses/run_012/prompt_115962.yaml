answer: |-
  The infection model defines the mechanism of transmission but cannot generate Tolstoy's moral ranking of art; that evaluation is imported from his religious doctrine, while the analogy itself merely biases the definition toward accessibility over complexity.

  **Correspondence Table**

  | Domain | Art (Tolstoy) | Infection (Medicine) |
  | :--- | :--- | :--- |
  | **Source** | The Maker (Artist) | Patient Zero (Carrier) |
  | **Content** | The Feeling | The Pathogen (Virus/Bacteria) |
  | **Medium** | External Signs (Words, Sounds) | Vector (Droplets, Surface) |
  | **Target** | The Audience | Susceptible Hosts |
  | **Event** | Catching (Being Moved) | Transmission (Infection) |
  | **Condition** | Susceptibility (Openness) | Immune Status |
  | **Constraint** | Sincerity | Viral Integrity/Load |

  **Load-Bearing Elements**
  In Tolstoy's argument, **Infectiousness** bears the weight of definition (if it doesn't spread, it isn't art), **Sincerity** bears the weight of mechanism (it explains *how* the spread occurs), and **Reach/Depth** bears the weight of evaluation (wide spread equals high worth). The model relies on the passivity of the audience; if the audience must work to understand the signs, the "infection" fails, and the object ceases to be art.

  **Disanalogies and Their Impact**
  1.  **Volition:** Infection is involuntary; art reception often requires cognitive effort. *Matters:* This disanalogy drives the demotion of difficult work (Beethoven/Shakespeare). If art must infect like a cold, complexity is a barrier to transmission, not a feature of depth.
  2.  **Value Neutrality:** Pathogens are biologically successful regardless of moral value; Tolstoy requires art to be morally good. *Matters:* This is the critical break. A virus that kills everyone is "successful" biologically; a work of art that spreads hatred is "successful" by the infection model but "bad" by Tolstoy's moral metric. The model cannot distinguish between propaganda and prayer without external input.
  3.  **Counterfeits:** Diseases are ontologically real; art can be insincere yet still move people (kitsch). *Matters:* Tolstoy uses sincerity to block this, but in medicine, a weakened virus still infects. In art, a fake feeling might infect deeper than a real one. The model cannot detect the fake without appealing to the maker's internal state, which is unobservable.
  4.  **Headcount:** Epidemiological spread measures contagion, not medical benefit. *Incidental:* Tolstoy conflates popularity with quality. This matters only because he wants art to unify humanity, so he needs headcount to matter morally, which biology does not support.

  **The Source of the Ranking**
  The infection model generates a ranking of *accessibility*, not *goodness*. It dictates that the plain song is "better art" than the symphony only because the plain song infects more people with less effort. It cannot generate the ranking that places Christian brotherhood above elite pleasure; that hierarchy is imported entirely from Tolstoy's religious convictions. The model does the definitional work (what counts as art), while the religion does the evaluative work (which art is good). When Tolstoy discards his own novels, he is using the religious metric to override the infection metric (since the novels were infectious but carried the "wrong" feelings), revealing that the analogy alone is insufficient for his moral conclusions.

  **Repair and Alternatives**
  The infection model cannot be repaired to accommodate complexity without ceasing to be an infection model; adding "nutritional value" to the virus changes the analogy to sustenance. **Art as Language** is a superior fit for difficult work: it allows for obscure references, learning curves, and translation errors without denying the object's status as art, though it risks over-intellectualizing emotion. **Art as Play** (Schiller/Gadamer) better captures the voluntary engagement and rule-bound structure of complex works, allowing for difficulty without demanding universal transmission. However, if the goal is moral evaluation, **Art as Communion** retains the spiritual transmission Tolstoy wants but replaces the biological vector with a sacramental one, grounding the value in the sacredness of the feeling rather than the mechanics of its spread.
