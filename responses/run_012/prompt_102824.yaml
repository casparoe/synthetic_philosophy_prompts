      *   *Numbers:* Need to make sure the numbers work.
          *   Bottom Quintile Median (Representative): Option A = \$35k, Option B = \$32k. (A wins for DP).
          *   Bottom 1% (The Tail): Option A = \$15k, Option B = \$25k. (B wins for Maximin).
      *   *Why this fits Rawls:* Rawls defines the least-advantaged by *social position* (e.g., unskilled workers), not by misfortune. If the policy helps the social position but hurts the outliers within it, DP picks the social position gain.

  4.  **Drafting the Analysis (Verdicts):**
      *   *Rawls's DP:* Chooses Option A. Why? Because it maximizes the expectations of the *representative* member of the least-advantaged group. Rawls explicitly uses representative persons to avoid the "strains of commitment" and administrative impossibility of tracking every individual's misfortune.
      *   *Strict Maximin:* Chooses Option B. Why? Because it looks at the actual human being with the lowest income. \$25k > \$15k.

  5.  **Identifying the Feature:**
      *   The feature is the **Representative Person Constraint**. Rawls aggregates individuals into social groups and tracks the representative member, assuming that what helps the representative generally helps those below.
      *   *If removed:* If we track actual individuals, DP collapses into Strict Maximin. The divergence disappears because the metric becomes identical.

  6.  **Playing the Defender (Rawlsian Replies):**
      *   *Reply 1: Redefine the Least-Advantaged Group.* If the tail is significantly worse, maybe they constitute a *separate* least-advantaged group.
          *   *Strength:* Plausible. Rawls allows flexibility in defining the group. If the gap is wide enough, the tail *is* the relevant group.
      *   *Reply 2: Empirical Assumption.* Rawls assumes a "chain connection." Usually, raising the median bottom raises the floor. If this case violates that, it's an empirical anomaly, not a theoretical flaw.
