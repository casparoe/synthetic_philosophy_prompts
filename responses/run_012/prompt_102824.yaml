  *(Self-Correction during drafting)*: I need to be careful not to make Rawls look *too* careless. Rawls knows about the tail. His defense is that the "least advantaged" are defined by *expectations* attached to *positions*, not accidental outcomes. I need to make sure the scenario reflects a structural difference (employable vs unemployable) rather than just random luck, to fit Rawls's focus on the basic structure. I will frame the tail as those unable to participate in the labor market due to structural barriers, whereas the representative is the "working poor."

