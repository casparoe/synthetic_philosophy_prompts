          *   *Option 1:* Representative member of the least-advantaged group (e.g., median of bottom quintile) is *better off* than in Option 2.
          *   *Option 2:* A small minority at the very bottom (the "tail") is *better off* than in Option 1, even though the representative least-advantaged person is slightly worse off.
          *   The gap must be robust, not knife-edge.
          *   The divergence must arise from the theory's machinery (specifically the use of representative persons vs. actual individuals), not stipulation.
      *   **Post-Scenario Tasks:**
