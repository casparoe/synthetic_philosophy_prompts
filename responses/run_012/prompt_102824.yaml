      *   *Self-Correction on Theory:* Ensure I cite Rawls's reasoning about *social positions* vs. *natural misfortune*. Rawls is concerned with the basic structure, not rectifying every natural handicap directly (that's later, via the principle of redress which he rejects as a sole criterion).

  8.  **Final Review against Constraints:**
