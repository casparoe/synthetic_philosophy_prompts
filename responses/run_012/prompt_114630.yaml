answer: |-
  **Project Title:** The Illocutionary Force of Defeat: A Functional Typology of Political Loss

  **Project Overview**
  Political theory and historical sociology frequently categorize myths of military defeat under the monolithic label of the "lost cause." Whether analyzing the Confederacy, the Battle of Dunkirk, the Siege of Masada, or the Battle of Kosovo, existing literature tends to treat these narratives as variations of the same phenomenon: tools of nation-building born from collective trauma. This project challenges that aggregation. I argue that lumping these myths together obscures the specific political work they perform. A myth of Dunkirk does not behave like a myth of the Confederacy, not because the historical events differed, but because the *directive* issued to the audience differs.

  This fellowship will support the writing of one substantive chapter (approx. 8,000–10,000 words) that constructs and tests a functional typology of defeat myths. Rather than asking what the myth *says* happened, I ask what the myth *asks* the audience to do.

  **Research Question**
  To what extent does categorizing defeat myths by their **normative demand** (what they ask the citizen to do with the loss) predict their political durability and stability better than categorizing them by their historical content or emotional affect?

  This question admits a determinate answer. If the typology holds, cases sharing a functional type should exhibit similar trajectories of durability and integration into statecraft, regardless of historical context. If the typology fails, cases will migrate between types based on external political pressures, rendering the functional distinction descriptive rather than explanatory.

  **Intervention: Beyond Nationalism and Trauma**
  Current explainers leave the variance in defeat myths under-theorized.
  1.  **Nationalism:** Explains *why* a state needs a myth, but not *why* some defeat myths consolidate power (Dunkirk) while others fracture it (Confederacy).
  2.  **Collective Trauma:** Explains the affective intensity, but not the political direction. Trauma can lead to withdrawal or aggression; the theory does not predict which.
  3.  **Invented Tradition:** Explains the origin point, but treats the myth as static. It fails to account for why some myths curdle into grievance while others mature into civic religion.

  My intervention shifts the focus from the *ontology* of the event to the *illocutionary force* of the narrative. I propose three functional types:
  *   **Redemptive (Cash In):** The defeat is converted immediately into moral credit. The demand is for **unity**. (e.g., Dunkirk: "We lost the battle but proved our spirit.")
  *   **Deferred (Collect):** The defeat is framed as an unpaid debt. The demand is for **persistence**. (e.g., The Lost Cause: "The cause was just; the struggle continues.")
  *   **Constitutive (Hold):** The defeat itself serves as the title deed to sovereignty. The demand is for **entitlement**. (e.g., Masada/Kosovo: "We died here, therefore this land is ours.")

  **Methodology**
  The chapter will proceed in two stages.
  1.  **Conceptual Construction:** I will rigorously define the three types based on the normative demand placed on the audience. This involves distinguishing the *temporal orientation* of each (Redemptive looks to the immediate moral present; Deferred looks to a future restoration; Constitutive looks to an eternal claim on space).
  2.  **Comparative Stress Test:** I will run the four paradigmatic cases (Dunkirk, Confederacy, Masada, Kosovo) through the typology. This is not a historical deep-dive but a conceptual stress test. I will examine secondary literature on each myth to code their primary political function during their formative period (first 50 years).

  **Defining the Result**
  As this is political theory, a "positive result" is not a p-value. Success looks like **conceptual leverage**.
  *   **Success:** The typology explains why the Confederate myth proved destabilizing (Deferred/Collect) while the Dunkirk myth proved stabilizing (Redemptive/Cash In), despite both occurring in democratic contexts. It demonstrates that the *type* of demand constrains how the myth interacts with counter-evidence. A Redemptive myth can absorb facts (we lost!) because the point was virtue. A Constitutive myth cannot absorb facts that challenge the link between blood and soil.
  *   **Failure:** If the cases refuse to sit in one slot, or if the "function" is entirely determined by exogenous factors (e.g., regime type) rather than the internal logic of the myth, the typology is merely taxonomic.

  **Feasibility and Risks**
  The scope is limited to one chapter, making the six-month timeline realistic. The primary risk is **type instability**. If a single myth flips from Redemptive to Deferred within a century (e.g., if Dunkirk is later mobilized as grievance), the functional typing loses its predictive power. I will address this by bounding the analysis to the *foundational* period of the myth, where the political demand is codified. If the foundational demand does not predict the trajectory, the theory requires revision.

  This fellowship provides the necessary time to move this from a seminar paper intuition to a rigorous conceptual framework suitable for dissertation integration. By isolating the *job* the myth performs, I aim to offer a new vocabulary for understanding how political communities metabolize failure.
