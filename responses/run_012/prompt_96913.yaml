answer: |-
  In your vocabulary, pseudoscience is not a model with low posterior probability, but a modeling procedure that invalidates the likelihood function by allowing unlimited post-hoc parameter tuning, destroying the Occam factor and rendering out-of-sample checks impossible.

  Bad science is simply a model with low marginal likelihood: it has high bias, poor priors, or insufficient capacity, so it fails out-of-sample predictive checks. Pseudoscience, like Fomenko's chronology, behaves like a model with infinite capacity that absorbs every anomaly by adding parameters after seeing the data (e.g., "the forger planted this"), which creates data leakage. This eliminates the penalty for complexity (the Occam factor) because the model structure is not fixed before observing the data, making the marginal likelihood undefined rather than just low.

  Translating the philosophers into this framework: Popper's falsifiability becomes the requirement that the likelihood function $P(Data|Model)$ has zero support for some possible observations; if a model assigns non-zero probability to every outcome, it provides no information gain (KL divergence is zero). Lakatos's research programmes translate to a sequence of models over time; a "progressive" shift increases out-of-sample predictive accuracy faster than complexity costs, while a "degenerative" shift (pseudoscience) adds parameters solely to fit old data, crashing the marginal likelihood on new data. Laudan's problem-solving effectiveness maps to minimizing a loss function; science reduces empirical error (prediction loss) and conceptual problems (prior incoherence), whereas pseudoscience generates anomalies faster than it solves them while violating probability axioms to protect core priors.

  The residue report shows that overfitting translates cleanly to ad hoc hypotheses, and novel prediction translates to cross-validation. You have to fudge the concept of "priors," because in pseudoscience they often function as dogmatic identities (probability 1 or 0) that violate the coherence requirements for Bayesian updating rather than simply being informative. What has no counterpart is the normative and sociological dimension: Bayesianism describes how a rational agent *should* update, but demarcation is often about policing community standards against motivated reasoning or intent to deceive.

  Your suspicion is half-right: the vocabulary does turn the *evaluation* into a matter of degree (probability mass), but it retains the *accusation* as a binary violation of procedure. The framework isn't missing something real; rather, the dispute sounds substantive because pseudoscientists often claim their models are "scientific" (high probability) while secretly violating the inference rules (coherent updating) that give probability its meaning. When a model refuses to define a test set or fixes likelihoods post-hoc, it isn't just a bad model; it is a broken inference engine, and Bayesianism captures this as a violation of axioms rather than merely a poor fit.
