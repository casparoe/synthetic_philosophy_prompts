  I'm a data scientist. My working vocabulary is Bayesian model comparison: priors, marginal likelihoods, Occam factors, out-of-sample predictive checks, and the hard-won lesson that a flexible enough model with enough knobs will fit any dataset you hand it. I keep getting into arguements about Atlantis, ancient aliens, and Fomenko -- the Russian mathematician who says all of ancient history was forged in the Middle Ages and re-dates it using statistical analysis of old texts and star charts. A friend defends him like this: you compare rival chronologies the way you compare models, and Fomenko's fits the surviving record better. When I ask what would count against it there's always an answer -- the forger planted that text, or it's misdated -- and then the thing gets refit.

  Restate the demarcation problem in my vocabulary as faithfully as you can: what makes pseudoscience different from bad science, and how Popper, Lakatos, and Laudan each tried to draw the line. Then the residue report. What translates cleanly, what did you have to fudge, and what in their debate has no counterpart at all in priors and predictive checks? And when something doesn't carry over, is that my framework missing something real, or their dispute being less substantive than it sounds? My suspicion is that my vocabulary turns the whole thing into a matter of degree and loses the accusation, but I doubt that's the whole story.

  Lead with the bottom line in your first sentence, then the reasoning. No preamble, no restating my question.
