answer: |-
  ### Context & Contests
  Before using this tree, note that **nothing here is settled**. The biggest fault line (Question 1) divides the field roughly in half: etiologists (history matters) vs. causalists (current contribution matters). Everyone agrees vestiges don't *currently* help (settled), but disagree on whether they still have functions (contested). Everyone agrees one-off traits lack history (settled), but disagree on whether they have functions (contested). This tree maps the logical space, not the truth.

  ### The Function Decision Tree

  **Q1: The History Test**
  *A mutation appears by pure chance in a single individual (no ancestors had it, no descendants will inherit it), but it keeps that individual alive. Does it have a biological function?*
  *   **No** (History is required) → Go to **Q2**.
  *   **Yes** (Current utility is enough) → Go to **Q3**.

  **Q2: The Vestige Test**
  *A trait was selected for millennia but now does nothing (or actively harms). Does it still have a function?*
  *   **Yes** → **Selection-History View** (Function is purely about evolutionary past).
  *   **No** → **Hybrid View** (Function requires *both* history and current utility).

  **Q3: The Ontology Test**
  *Is "function" a real property in the world, or just a useful way for humans to talk about traits?*
  *   **Just shorthand** → **Deflationary View** (Function talk is instrumental, not ontological).
  *   **Real property** → Go to **Q4**.

  **Q4: The System Test**
  *Must the trait contribute to the organism's own self-maintenance, or is any causal effect we care to measure enough?*
  *   **Any causal effect** → **Pure Contribution View** (Function is any causal role in a capacity).
  *   **Self-maintenance only** → Go to **Q5**.

  **Q5: The Perspective Test**
  *If a trait helps a symbiont survive but hurts the host, is its function determined by who benefits?*
  *   **Yes** (Relative to beneficiary) → **Perspective-Relative View** (Function depends on the user/system boundary).
  *   **No** (Objective to the host) → **Self-Maintenance View** (Function is contribution to the organism's organized survival).

  ---

  ### Test Case Mapping
  1.  **Random byproduct now useful:** Answers **Yes** to Q1. Lands in *Pure Contribution*, *Self-Maintenance*, or *Deflationary* (depending on Q3/Q4). **Excludes** *Selection-History*.
  2.  **Trait selected ages ago, now useless:** Answers **No** to Q1, **Yes** to Q2. Lands in **Selection-History View**. **Excludes** *Hybrid* and *Contribution* views.
  3.  **One-off single-individual trait:** Answers **Yes** to Q1. Lands in *Contribution* or *Self-Maintenance* camps. **Excludes** *Selection-History*.
  4.  **Engineered part (zero selection history):** Answers **Yes** to Q1 (no *evolutionary* history). Lands with *Contribution* views. **Excludes** *Selection-History* (unless you count design as history, which this tree treats as distinct).

  ### Limitations & Gaps
  *   **Leaves this tree can't separate:** **Pure Contribution View** and **Perspective-Relative View**. In practice, if you allow "any causal effect" (Q4), you implicitly allow effects relative to any system (symbiont, host, ecosystem), making these two positions often collapse into one another depending on how you define the "system."
  *   **Unoccupied Answer Combos:** **History Required + Deflationary** (Q1=No + Q3=Shorthand). This is theoretically possible but philosophically unattractive: if function is just human shorthand, there is little motivation to impose a strict historical constraint on the shorthand. Most deflationaries are pragmatic (use what works), not etiological.

  Summary: This tree isolates the core disputes over history, current utility, and perspective, but users should know that the boundary between causal contribution and perspective-relative function remains notoriously porous in practice.
