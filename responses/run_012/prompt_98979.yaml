  Me and a couple people in my lab run a reading group on what it even means to say something has a function, and we keep talking past each other. Can you build me a decision tree that sorts the positions on biological function? I want the branch nodes to be diagnostic questions a person can answer without already knowing the labels -- stuff like, if a trait showed up once, in a single individual, with no chance to be selected, but it keeps that individual alive, does it have a function? -- and the leaves to be the positions, named in plain terms: a selection-history view, a pure contribution-to-a-goal view, one that demands both, a self-maintenance/organization view, and the deflationary "function talk is just shorthand" one, plus whatever else falls out of the space. Make sure each of these four cases lands somewhere and actually pulls the tree apart: a random byproduct that now reliably keeps the organism alive; a trait selected for ages ago that's since gone useless; the one-off single-individual trait above; and an engineered part in a lab organism, designed to do X, with zero selection history. It'd also be good if one branch handles "function relative to what -- whose function is it anyway" (a trait that benefits a symbiont at the host's expense, say). Flag any two leaves your tree can't seperate, and say a word about any answer-combos nobody occupies -- incoherent, unattractive, or just unexplored. Keep it to 5 or 6 branch questions. And be upfront about which parts of this are settled versus genuinely contested among people who actually work on it -- don't sell me one camp's line as the consensus. Last line, one sentence starting "Summary:".
