prompt: |-
  I'm a third-year PhD student in political theory, mid-draft on a chapter about reserve powers, and last week in a workshop I had the line 'the monarch reigns but does not rule' used at me twice by two different people in service of two different points, which is kind of what set me off. The first used it to say that asking whether a monarch could refuse assent to a bill is basically a non-question, since ruling is precisely what they don't do. The second used it, weirder, to argue that the whole institution is epiphenominal, so that studying it is studying nothing. Those don't look like the same claim to me, and neither one looks like it just falls out of the sentence. Can you lay out the distinct things 'the monarch reigns but does not rule' could acutally be asserting? I want the full menu: the ones that are near-definitional, depending on what you count as 'ruling'; the ones that are substantive claims about conventions, discretion, and dormant or reserve powers; the ones that turn on the difference between the Crown as a legal person and the particular human being who happens to be wearing it; and any that are just false, or that quietly presuppose one particular constitutional settlement. Where a reading only holds in some jurisdictions, say which — the sentence is doing visibly different work in London, Oslo, Stockholm and Tokyo, and part of what I want is to see which reading each of those two workshop remarks would need in order to land. Lay it out as a menu with verdicts rather than picking a favourite and explaining it. And tell me how confident you are in each verdict, and which point you're least sure of — I'd rather see a hedge I can check than a tidy answer I can't, since some of this is going into the chapter.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Third-year PhD student in political theory.
      *   **Context:** Mid-draft chapter on reserve powers.
      *   **Trigger:** Two workshop participants used the phrase "the monarch reigns but does not rule" to make contradictory/distinct points (1: Refusal of assent is a non-question; 2: The institution is epiphenomenal/studying it is studying nothing).
      *   **Task:** Lay out the "full menu" of distinct assertions the phrase could be making.
      *   **Categories:** Near-definitional, substantive claims (conventions/discretion), legal person vs. human, false/presupposing specific settlements.
      *   **Jurisdictional Nuance:** London, Oslo, Stockholm, Tokyo (Westminster vs. Scandinavian vs. Japanese models).
      *   **Format:** Menu with verdicts, confidence levels, and explicit hedges/uncertainties.
      *   **Tone:** Academic, precise, nuanced, acknowledging the user's expertise (don't talk down, but don't assume too much specific knowledge of every jurisdiction).

  2.  **Deconstruct the Phrase:** "The monarch reigns but does not rule."
      *   *Reigns:* Symbolic, ceremonial, head of state, continuity, legitimacy.
      *   *Rules:* Executive power, policy-making, legislation, active governance.
      *   *But:* The distinction is the crux. Is it descriptive? Normative? Legal? Conventional?

  3.  **Brainstorming the "Menu" of Interpretations:**

      *   *Interpretation A: The Strong Convention View (Westminster).* The monarch *has* the legal power but is conventionally bound not to use it. (Bagehot).
      *   *Interpretation B: The Legal Nullity View.* The monarch literally has no legal power; it's all vested in ministers/parliament. (Some modern statutory interpretations).
      *   *Interpretation C: The Symbolic/Epiphenomenal View.* The monarch is just a seal; studying them tells us nothing about power. (The second workshop comment).
      *   *Interpretation D: The Dual Capacity View.* The "Crown" rules, the "Person" reigns. Legal fiction separation.
      *   *Interpretation E: The Emergency/Reserve View.* They don't rule *normally*, but they rule in crises. (The first workshop comment ignores this).
      *   *Interpretation F: The Jurisdictional Variance.* Japan (symbolic only) vs. UK (reserve powers exist) vs. Scandinavia (mostly ceremonial but historical differences).

  4.  **Drafting the Menu Items (Iterative Process):**

      *   *Item 1: The Descriptive-Conventional Claim (Bagehotian).*
          *   Meaning: Legal power exists, convention suppresses it.
          *   Verdict: True for UK/Canada/Aus, but "does not rule" is shorthand for "does not rule *personally*."
          *   Confidence: High.
      *   *Item 2: The Legal-Formalist Claim.*
          *   Meaning: Statute has stripped the power.
          *   Verdict: False for UK (Royal Assent still needed), True for Japan (Constitution Art 4).
          *   Confidence: High.
      *   *Item 3: The Epiphenomenal Claim (Workshop Comment 2).*
          *   Meaning: The monarchy is causally inert.
          *   Verdict: Politically naive. Soft power matters. Legitimacy matters.
          *   Confidence: Medium-High (as a critique).
      *   *Item 4: The "Non-Question" Claim (Workshop Comment 1).*
          *   Meaning: Asking about refusal is category error.
          *   Verdict: False. It's a live theoretical question (e.g., 1975 Australia, 1990 Canada potential).
          *   Confidence: High.
      *   *Item 5: The Corporate Sole vs. Natural Person.*
          *   Meaning: Crown rules, Human reigns.
          *   Verdict: Useful distinction, but often blurred in practice.
          *   Confidence: Medium.
      *   *Item 6: The Jurisdictional Specificity.*
          *   Meaning: The phrase means different things in Tokyo vs. London.
          *   Verdict: Crucial.
          *   Confidence: High.

  5.  **Refining the Jurisdictional Analysis:**
      *   *London (UK):* Reserve powers exist (dissolution, assent, appointment). "Reigns not rules" is a convention, not law.
      *   *Oslo/Stockholm (Scandinavia):* Historically powerful, now strictly ceremonial. Sweden (1974 Instrument of Govt) removed almost all political power. Norway retains slightly more formal influence but follows convention.
      *   *Tokyo (Japan):* 1947 Constitution. Emperor is "symbol." No powers whatsoever, not even reserve. "Reigns not rules" is an understatement; he doesn't even "reign" in the sovereign sense.

  6.  **Addressing the Workshop Comments:**
      *   Comment 1 (Assent is a non-question): Relies on Interpretation 2 (Legal Nullity) or a very strong version of 1 (Convention as Law). It's vulnerable.
      *   Comment 2 (Epiphenomenal): Relies on Interpretation 3. Vulnerable to political theory critique (legitimacy, soft power).

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the frustration. Validate that the phrase is a slogan, not a theory.
