answer: |-
  Here is a runnable specification for your 90-minute seminar. It is designed to be tight on time, robust against cheating, and sensitive to accessibility, while preserving the philosophical payoff you described.

  ### 1. Materials & Budget (£20 limit)

  *   **Stimuli (Round 1):** 8 flat shapes cut from foam board (approx. 10cm diameter).
      *   *Design:* 8 distinct "blobs" varying only by number of lobes (e.g., 3 to 10 lobes). Paint or cover all in the same matte paper/colour to hide texture.
      *   *Cost:* £10 for foam board and paint/paper.
  *   **Stimuli (Round 2):** 8 flat shapes, identical outline (e.g., simple circles or squares).
      *   *Design:* Cover faces with different grades of sandpaper or fabric (smooth, fine, coarse, bumpy). Edges must be identical.
      *   *Cost:* £5 for sandpaper/fabric swatches and glue.
  *   **Occlusion:** 8 sleep masks (multipack) OR 2 large cardboard boxes with arm-holes cut in the side.
      *   *Recommendation:* Use the **Box Method** if possible. It avoids the "blindfold as gag" issue and low-vision accessibility problems. Students put hands in the box; the shapes are inside. They never see the shapes until the test.
      *   *Cost:* £0 (recycled) or £5 for masks.
  *   **Admin:** A4 paper (predictions), pens, tape, timer (phone).
  *   **Room:** Tables arranged for 8 pairs.

  ### 2. Rules of Engagement (Read these aloud)

  1.  **The Seal:** Predictions are written, folded, and sealed *before* you touch a shape. Do not open until the end.
  2.  **The Black Box:** During the tactile phase, the "Learner" must not see the shapes. If using masks, they go on now. If using boxes, hands go in now.
  3.  **The Silence:** During tactile learning, no talking about *features*. You may name the objects ("This is the Krim"), but you may not describe them ("This is the bumpy one").
  4.  **Contamination Protocol:** If anyone announces the distinguishing rule (e.g., "It's the lobes!"), that pair is "Contaminated." They stop the task, put their hands down, and become Observers. Their data is excluded from the score but included in the discussion about information leakage.
  5.  **The Test:** During the visual identification (90 seconds), hands must be behind backs or in pockets. No touching.

  ### 3. Minute-by-Minute Timeline (90 Minutes Hard Stop)

  **00:00 – 00:10: Setup & The Sealed Prediction**
  *   Seat students in 8 pairs. Distribute paper.
  *   Project or write the question on the board: *"If a person learned to distinguish these objects by touch alone, then gained sight instantly, could they identify them by vision alone before touching them again?"*
  *   **Task:** Write YES or NO. Write one sentence of justification. Fold and seal. Put in the centre of the table.
  *   **Instructor Note:** Do not mention Molyneux, Locke, or philosophy yet. This is a "psychophysics task."

  **00:10 – 00:35: Round 1 (The Lobes)**
  *   **00:10 – 00:15 (Briefing):** Hand out the 8 lobe-shapes. Assign Partner A (Learner) and Partner B (Guide). Explain the naming convention (Krim, Blorp, Dax, etc., or just 1-8).
  *   **00:15 – 00:21 (Tactile Encoding):** Partner A is occluded (mask or box). Partner B places shapes in their hands one by one. 45 seconds per shape. Partner B says: "This is Number 1." Partner A feels. No descriptions allowed.
      *   *Risk Management:* Circulate. If you hear "It has three bumps," intervene immediately. "That is a description. Reset." If they spoil it, enforce Contamination Protocol.
  *   **00:21 – 00:23 (Transition):** Collect shapes. Partner A removes occlusion. Partner B arranges the 8 shapes on the table in a random order.
  *   **00:23 – 00:25 (Visual Test):** 90 seconds. Partner A points/names. Partner B records score (0-8).
  *   **00:25 – 00:35 (Immediate Score):** Ask for a show of hands: Who got 8/8? Who got 0/8? Ask one high-scorer: "What did you look for?" Ask one low-scorer: "What were you expecting?"
      *   *Do not explain the lobe trick yet.* Just note the split.

  **00:35 – 01:00: Round 2 (The Texture)**
  *   **00:35 – 00:40 (Briefing):** Swap roles (Partner B is now Learner). Hand out the 8 identical-outline/texture shapes.
  *   **00:40 – 00:46 (Tactile Encoding):** Same procedure. 45 seconds per shape.
  *   **00:46 – 00:48 (Transition):** Occlusion off. Shapes laid out.
  *   **00:48 – 00:50 (Visual Test):** 90 seconds. Record score.
  *   **00:50 – 01:00 (Immediate Score):** Ask for scores. Expect near-zero.
      *   *Crucial Question:* "Why was Round 2 impossible compared to Round 1? The method was identical."
      *   *Elicit:* In Round 1, the touch-info had a visual match (shape). In Round 2, the touch-info (roughness) had no visual match from a distance.

  **01:00 – 01:30: The Debrief (Philosophy & History)**
  *   **01:00 – 01:10 (The Prediction):** Students open their sealed notes.
      *   "Keep your YES/NO secret. Raise your hand if you voted YES."
      *   "Look at your reason. Did you argue from *structure* (geometry, relations) or *sensation* (feel, appearance)?"
  *   **01:10 – 01:20 (The History):** Deliver the historical context (see Script below).
  *   **01:20 – 01:25 (The Limitation):** Address what the experiment *couldn't* do (see Limitations below).
  *   **01:25 – 01:30 (Closing):** Connect back to the "Idea" of shape. Pack up.

  ### 4. Scoring & Data Handling

  *   **Scorecard:** Simple tally on the board.
      *   Round 1: High Success vs. Low Success.
      *   Round 2: Universal Failure.
  *   **The "Contaminated" Pair:** If a pair spoils the trick, they do not contribute to the success rate. However, during the debrief, ask them: *"At what moment did the task change from perception to logic?"* This highlights the Leibnizian "reasoning" path.
  *   **Awkward Silence Backup:** If Round 1 yields total silence (no one gets it right), pivot the debrief: *"If you couldn't transfer the information, where did the information live? In the hand or in the mind?"* This actually strengthens the Empiricist (Locke/Berkeley) position.

  ### 5. Debrief Script & Mapping

  *Do not lecture. Use their data to drive the history.*

  **Step 1: The Split (Round 1 Data)**
  "You had a split room in Round 1. Half of you transferred the knowledge; half of you didn't.
  *   **Group A (Success):** You treated the shape as a **structure**. You counted relations (lobes, angles). This maps to **Leibniz**. He argued 'Yes' to Molyneux's problem because he believed the intellect grasps geometric truths that are the same for touch and sight.
  *   **Group B (Failure):** You treated the shape as a **sensation**. You memorised the *feeling*. When the feeling changed to *looking*, the link broke. This maps to **Locke and Molyneux**. They argued 'No'. They believed ideas of sight and ideas of touch are distinct and only linked by experience."

  **Step 2: The Failure (Round 2 Data)**
  "Everyone failed Round 2. Why? Because roughness is a **proper sensible** of touch. It has no visual counterpart at a distance.
  *   This is **Berkeley's** stronger argument. He didn't just say 'No, you need experience.' He said 'No, because the objects of sight and touch are entirely different languages.' A visible square and a tangible square share nothing but the *name* 'square'.
  *   Round 1 worked for some of you because you abstracted the *geometry* (which is amodal). Round 2 failed because there was no geometry to abstract, only texture."

  **Step 3: The Prediction Check**
  "Open your sealed predictions.
  *   If you voted **YES** because 'shape is shape': You are arguing for **Common Sensibles** (Aristotle/Leibniz).
  *   If you voted **NO** because 'seeing isn't feeling': You are arguing for **Heterogeneity of Senses** (Berkeley/Locke).
  *   Check your sentence. Did you predict correctly for the right reason? Or did you guess?"

  **Step 4: The Historical Detail**
  "Molyneux wrote to Locke in 1688. Locke published it. They both said **No**.
  *   *Detail:* Molyneux actually added a second question: 'Could the man tell by sight if the objects were within reach?' That's about depth perception, which is even harder to transfer.
  *   Berkeley later used this to argue that we don't see distance at all; we infer it."

  ### 6. Limitations (What you must supply)

  You cannot reproduce the **Congenital Condition**.
  *   **The Issue:** Your students are sighted adults with fully developed visual cortices who have integrated touch and sight for 20+ years. The historical problem concerns a *congenitally blind* adult gaining sight *for the first time*.
  *   **The Fix:** State this clearly at 01:20. "This experiment tests *transfer of abstraction* in sighted brains. The historical problem tests *neural wiring* in a naive brain. Recent medical cases (like Project Prakash) suggest the answer is actually 'No' initially, supporting Locke, but 'Yes' after weeks of learning, supporting a modified Empiricism."

  ### 7. Risk Management & Accessibility

  *   **Blindfold Anxiety:** Do not use the word "blindfold." Use "Occlusion Mask" or "Visual Barrier." Explicitly state: *"If you are uncomfortable wearing the mask, you may turn your head away and look at the floor, or take the role of the Guide."*
  *   **Low Vision:** If a student has low vision, the "Visual Test" is unfair. Assign them the role of **Data Recorder** for their pair. They record the scores and report them to the class. This keeps them central to the activity without compromising the stimulus.
  *   **The Spoiler:** If someone shouts "It's the lobes!", do not scold. Say: *"That pair has now switched from a perceptual task to a linguistic task. Please sit out the scoring, but stay for the discussion on reasoning."* This validates the Leibnizian point without ruining the room's data.
  *   **Time Creep:** The tactile phase is the time-sink. Use your phone timer loudly. When 45 seconds is up, say "Next shape." If you run late, cut Round 2 to 4 shapes instead of 8. Do not cut the Debrief.

  ### 8. Instructor Checklist (Pre-Class)

  *   [ ] Cut 8 lobe-shapes (same colour).
  *   [ ] Cut 8 texture-shapes (same outline).
  *   [ ] Number them on the back (invisible to students).
  *   [ ] Prepare 16 slips of paper for predictions.
  *   [ ] Test the occlusion (can you see through the mask/box?).
  *   [ ] Set phone timer with loud alarm.
  *   [ ] Clear board space for the "Question."

  This plan keeps the budget under £20, respects the 90-minute hard stop, and ensures the philosophy emerges from the failure/success of the activity rather than a lecture.
