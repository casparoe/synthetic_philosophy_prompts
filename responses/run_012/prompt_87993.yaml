  Your actor succeeds only because the driver has been fooled, but we must ask what makes the driver's belief rational in the first place. We share the premise that the traveller aims to maximise his own welfare: he wants the ride and, ceteris paribus, prefers to keep his money. However, it is genuinely disputed among specialists whether human beings are sufficiently 'translucent'—that is, whether our dispositions leak out in ways difficult to fake. If we assume even a modest degree of translucency, which I argue is necessary for the driver's decision to be rational rather than merely hopeful, then the actor's signs are too brittle. A driver who reasons as you do will know that actors exist and will therefore look for signs that are costly to produce unless one genuinely intends to pay. Consequently, the only disposition that reliably secures the ride is the genuine one, making it rational to cultivate the character rather than the mask. To rely on acting is to bet on the driver's error, whereas being the sort of person who pays aligns your character with the only stable equilibrium available to rational agents.
