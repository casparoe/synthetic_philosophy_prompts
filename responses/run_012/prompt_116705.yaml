answer: |-
  There is no single, widely recognized noun in general discourse that captures this specific decision-making architecture, though it sits squarely within the overlap of behavioral economics and social psychology. The technical machinery exists, but it is usually described by phrases rather than a named concept.

  For your purposes as a novelist, I propose the term **"Aspiration Mirroring."**

  ### Definition of Aspiration Mirroring
  **Aspiration Mirroring** is a decision strategy in which an agent's acceptance threshold is not fixed exogenously (based on internal needs or absolute values) but is instead derived endogenously from the immediate option set. Specifically, the agent sets their standard at a fixed delta below the best available option currently visible. Unlike traditional models where standards act as a filter to reject options, here the standard functions as a tracker: it shifts instantly to validate the top tier of the current context, ensuring the agent's subjective satisfaction remains constant regardless of the absolute quality of the environment.

  ### Placement Relative to Nearby Concepts

  **1. Versus Satisficing**
  *   **The Overlap:** Both involve setting an aspiration level and accepting the first option that meets it.
  *   **The Distinction:** In Herbert Simon's classic **Satisficing**, the aspiration level is historically determined. It adjusts *gradually* based on past success or failure (e.g., if I find apartments easily, I raise my bar for next time). In **Aspiration Mirroring**, the adjustment is *instantaneous* and *contextual*. The bar does not filter the market; the market sets the bar. As you noted, satisficing performs filtering work; Aspiration Mirroring performs validation work.
  *   **Verdict:** Your character is using a satisficing *mechanism* with a mirroring *input*.

  **2. Versus Adaptive Preferences**
  *   **The Overlap:** Both involve preferences changing to match reality.
  *   **The Distinction:** **Adaptive Preferences** (associated with Jon Elster and Amartya Sen) typically describe a psychological coping mechanism under *deprivation*. It is the "sour grapes" phenomenon: I convince myself I don't want the apple because I can't reach it. Your character's behavior is symmetrical: she raises her sights in a good market just as readily as she lowers them in a bad one. It is not a defense against disappointment; it is a calibration of value.
  *   **Verdict:** Adaptive preferences are about lowering sights to avoid pain; Aspiration Mirroring is about aligning sights to maintain equilibrium.

  **3. Versus Reference-Dependent Utility (Prospect Theory)**
  *   **The Overlap:** This is the closest technical relative. Kahneman and Tversky established that value is determined by changes from a reference point, not absolute wealth.
  *   **The Distinction:** Reference Dependence explains *valuation* (how happy I am with what I have). Aspiration Mirroring explains *selection* (how I choose what to get). Furthermore, standard Reference Dependence often uses a status quo or an average as the reference point. Your character uses the *maximum* of the current sample as the reference.
  *   **Verdict:** Aspiration Mirroring is a specific decision rule driven by Reference-Dependent psychology.

  **4. Versus Adaptation Level Theory (Helson)**
  *   **The Overlap:** Harry Helson's theory posits that judgment is based on an "adaptation level" formed by the context of stimuli.
  *   **The Distinction:** Helson's adaptation level is usually a weighted *average* of past and present stimuli. Your character's standard is pegged to the *peak* of the present stimuli.
  *   **Verdict:** This is the strongest academic ancestor, but Aspiration Mirroring is more specific regarding the "peak" anchor and the "choice" outcome.

  ### What It Is Not
  *   **It is not Maximizing:** A maximizer seeks the absolute best and often feels anxiety or regret. Your character feels contentment.
  *   **It is not Settling:** Settling implies a conscious compromise where the agent knows they are taking less than they wanted. Your character's want has shifted to match the take.
  *   **It is not Self-Deception:** She is not lying to herself about the quality; she is honestly reporting her satisfaction relative to her (mirrored) standard.

  ### Confidence and Uncertainty
  I am **85% confident** in this assessment. The behavioral economics landscape is vast, and while "Endogenous Aspirations" is a known technical phrase, the specific nuance of *instantaneous* adjustment to the *current maximum* rather than *historical average* is distinct enough to warrant your specific terminology for a narrative context.

  The one point I am **least sure about** is whether a niche sub-field in marketing psychology (specifically regarding "choice set effects" or "decoy effects") has a slang term for this specific "peak-anchored thresholding." However, even if such a term exists in a journal article, it has not entered the broader conceptual lexicon in the way "Satisficing" or "Cognitive Dissonance" has, making "Aspiration Mirroring" a safe and precise coinage for your work.
