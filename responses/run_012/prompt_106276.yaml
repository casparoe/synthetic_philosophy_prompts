answer: |-
  **Mark: 7/10**

  **Breakdown:**
  *   **Definition & Mutual Advantage:** 4/4
  *   **Example:** 3/3
  *   **Common Currency Assessment:** 0/3

  **Feedback for Script:**

  **Definition and Mutual Advantage (4/4):**
  Your explanation of what constitutes a moral trade is precise and demonstrates a secure grasp of the core concept. You correctly identify that the trade relies on divergent moral weightings rather than shared values, and your explanation of how this leads to mutual advantage (Pareto improvement) is accurate. You clearly articulate that neither party needs to abandon their fundamental moral views, which is a crucial distinction.

  **Example (3/3):**
  The example of Ava and Ben is well-chosen and directly relevant to the definition provided. You correctly map the costs and benefits for each agent according to their own moral frameworks (Ava's cost of donation vs. value of meat ban; Ben's cost of meat ban vs. value of donation). The analysis of why this constitutes a gain for both parties by their own standards is sound.

  **Common Currency Assessment (0/3):**
  This section contains a significant philosophical error. You assert that because a trade results in a Pareto improvement, it *follows* that gains can be placed on a single scale and added together ("If Ava gains four units and Ben gains six..."). This is a non-sequitur. Pareto efficiency does not require, nor does it prove, interpersonal comparability of utility or moral value. The primary philosophical interest of moral trade is often that it allows for cooperation *despite* the lack of a common currency (incommensurability). By treating moral value as cardinally measurable and comparable across different axiologies without argument, you have overlooked the central difficulty of the "common currency" question. An 'assessment' requires critical engagement with this difficulty, rather than a definitive assertion that ignores the problem of incommensurability.

  **Overall Comment:**
  This is a strong answer in terms of exposition and understanding of the mechanism of moral trade. However, the mark is limited by the final section, where a fundamental logical error regarding value comparability undermines the philosophical assessment.

  ***

  **Private Note for the TA (Justification for your records):**

  *   **Why 7/10?** The student demonstrates excellent knowledge of the course material in the first two sections (70% of the content). The writing is clear and the example is textbook-perfect. However, the final section (30% of the marks) is philosophically unsound. In a second-year module, asserting interpersonal comparability as a logical consequence of trade is a conceptual mistake that prevents the work from reaching the higher First-class band (8+). 7/10 reflects a "borderline First / high 2:1" quality: flawless description, but flawed critical analysis.
  *   **Defensibility:** If the convenor queries the 0/3 on the final section, your justification is that the student confused *Pareto optimality* with *cardinal utility*. The prompt asked them to *assess* whether a common currency is possible; the student simply asserted it was, based on invalid reasoning. Deducting all marks for that section is defensible because the reasoning contradicts the standard philosophical literature on moral uncertainty and trade (e.g., MacAskill, Ord), which usually posits trade as a solution *to* the lack of a common currency, not proof *of* one.
  *   **Tone:** The feedback is written to be pasted directly onto the script. It is constructive but firm on the philosophical error, ensuring the student understands why they lost marks on the final paragraph.
