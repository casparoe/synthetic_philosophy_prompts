answer: |-
  Here is a constructed case designed to meet your specifications. It is drawn from economic history but framed as a quasi-experimental protocol to isolate the causal variable you are looking for.

  ### The Scenario: The East Anglian Gentry Split (1590–1630)

  **The Population:** Two cohorts of landed gentry families in the counties of Norfolk and Suffolk, England, during the late Elizabethan and early Stuart periods.
  **The Treatment Group:** "Puritan-leaning" gentry (Calvinist/Predestinarian theology within the Church of England).
  **The Control Group:** "Conformist" gentry (Traditional Anglican/Sacramental theology).
  **The Outcome:** The rate of capital reinvestment versus status consumption over a 40-year period.

  **The Historical Context:**
  In this period, both groups held similar estates, operated under the same Common Law, had equal access to the London wool and cloth markets, and possessed comparable initial wealth (landed income). The religious schism was theological, not initially economic. The Puritan doctrine emphasized *predestination* and the *calling*; the Conformist doctrine emphasized *sacramental grace* and *social hierarchy*.

  ### Protocol Walkthrough

  Here is how the design maps to your six specifications:

  1.  **Realism:** This is not an imaginary island. It is a well-documented historical episode (analyzed by historians like R.H. Tawney and later quantified by economic historians). The actors are real families (e.g., the Barringtons vs. neighboring Royalist gentry), and the economic data is drawn from probate records, estate accounts, and diaries.
  2.  **Controlled Contrast:** By restricting the sample to *gentry* in *East Anglia*, we hold geography, technology (agricultural and textile), legal institutions, and class status constant. The primary variance is doctrinal commitment. While "prior wealth" is never perfectly identical, selecting for the same class tier (knights and esquires) minimizes this variance sufficiently for a historical natural experiment.
  3.  **Exogenous Doctrine:** The Calvinist theology entered England via Geneva and Cambridge University theology, not via the wool market. The doctrinal shift in these families (often traceable through conversion narratives or the hiring of specific chaplains) predates the major economic expansion of the 1620s. This helps rule out the reverse arrow (that they adopted the theology *because* they were already capitalists).
  4.  **Weberian Mechanism:** The design looks for the specific psychological pressure of *salvation anxiety*. The Puritan gentry did not work harder because they were greedier; they reinvested because they were forbidden from enjoying the fruits. The doctrine created a "dam" against consumption: luxury was a sin, idleness was a sin, but wealth was a sign of blessing *only if* stewarded. Thus, surplus income could not be spent on manor houses or livery (standard gentry behavior) and was forced back into enclosure, stocking, or clothier ventures.
  5.  **Content of Doctrine:** We are not relying on the Puritans being a persecuted minority (they were often the local magistrates) or a tight network (though they married within the group). The causal work is done by the *individual's* internalized duty to glorify God through methodical labor and the specific prohibition on ostentatious consumption.
  6.  **Strong vs. Weak Reading:** This is the crux.
      *   *Weak (Elective Affinity):* The gentry wanted to accumulate capital, so they found a religion that justified it.
      *   *Strong (Causal):* The gentry were anxious about their election, the religion demanded frugality and labor, and capital accumulation was the *unintended byproduct* of this spiritual discipline.
      *   *The Divergence:* The experiment isolates this by looking at **consumption patterns**. If the Weak reading is true, they should consume once wealth is secure. If the Strong reading is true, they continue to restrict consumption *even when* they could afford status goods, because the doctrinal bar remains in place.

  ### The Critical Feature

  The single feature on which the result depends is the **Theological Prohibition on Status Consumption**.

  If you remove this specific doctrinal constraint, the whole case collapses back into ordinary profit-seeking. A standard rational actor (or a Conformist gentry member) operating in the same market would maximize utility by converting economic surplus into social capital (building a larger manor, buying finer clothes, securing a title). This is what the Control Group did.

  The Treatment Group behaved differently *only* because their doctrine defined that specific consumption as spiritually dangerous. The "dam" that forced the water into the mill (reinvestment) was not the profit motive; it was the fear of damnation via luxury. If the agents were merely profit-seekers using religion as a cover, they would have relaxed the frugality once their economic position was secure. The historical record shows they did not; they maintained frugality across generations as long as the doctrine held.

  ### The Strongest Critic's Attack

  I will channel the Materialist Critic (akin to a Marxist historian or a rational choice theorist).

  **The Attack:** "You have confused correlation with causation. The families that adopted Puritanism were already the more commercially aggressive lineages. They didn't become capitalists because they were Puritans; they became Puritans because the old feudal Catholic/Anglican ethos was too restrictive for their existing commercial ambitions. The doctrine was a *rationalization*—a useful ideology that lowered transaction costs within their network and justified breaking traditional social norms. The 'anxiety' you cite is post-hoc storytelling. They reinvested because the return on capital in East Anglian cloth was high, not because they were afraid of hell. If the cloth market had crashed, they would have stopped reinvesting, regardless of their prayers."

  **Does the Case Survive?**
  It survives, but with scars.
  The defense lies in the **timing of the conversion narratives** versus the **timing of the investment**. In several key families (e.g., the Barringtons), the spiritual diaries indicate a crisis of conscience and a turn toward strict Predestinarianism *before* the major shift from rentier landholding to active capitalist farming/trade. Furthermore, they engaged in economically risky ventures (colonial investment, new cloth types) that a pure profit-maximizer might have avoided, but a "Calling"-maximizer felt compelled to undertake as duty.

  However, the Critic is right to point out that the *selection effect* is hard to fully eliminate. It is plausible that commercially minded individuals were more attracted to the individualism of Puritanism. The case does not prove that *no* material interest was involved, only that the doctrinal content exerted an *independent* constraint on consumption that material interest alone would not have dictated.

  ### Calibration

  **Confidence Level:** **70%**.
  I am confident that the construction succeeds on its own terms as a thought experiment that isolates the variable. As a historical claim, it is robust but not airtight, because history does not allow for perfect ceteris paribus conditions.

  **The Point of Least Surety:**
  **Specification 3 (Exogeneity of Doctrine).**
  This is the weakest link. I am least sure that I can definitively rule out the reverse causal arrow. It is exceptionally difficult to prove that a family's theological shift was not subtly influenced by an unconscious anticipation of economic change. While the theology came from Geneva, the *reception* of that theology might have been primed by economic conditions. If the "anxiety" was actually a sublimated response to market volatility rather than a cause of market behavior, the Strong Reading fails. I cannot fully close this loop; I can only argue that the doctrinal content had a logical independence that makes the causal claim plausible.

  ***

  **Summary for the Bench:**
  You asked for a control. The Conformist Gentry are your control. You asked for a mechanism. The "Bar on Enjoyment" is your reagent. You asked to distinguish cause from affinity. The persistence of frugality *against* the utility of status consumption is your positive result. The experiment holds, provided you accept that spiritual anxiety can be treated as an independent variable in a historical system.
