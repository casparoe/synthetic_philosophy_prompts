      *   The claim about personal immortality is the biggest error. Scheffler argues the opposite: we care more about the collective afterlife than our own personal survival.
      *   The bottom line (extinction is bad beyond individual deaths) is actually Scheffler's point, so that stands, but the reasoning needs correction.

