      *   *Refining the "Personal Immortality" point:* Scheffler's book is partly a response to the fear of death. He argues that if we believe humanity continues, our own death matters less. If the freelancer says the book hints personal immortality is good, that contradicts Scheffler's reassurance that individual death is acceptable given collective survival. The freelancer seems to think the fear of extinction implies a desire for personal continuity, but Scheffler says the fear of extinction reveals our dependence on the *collective* continuity, which substitutes for personal continuity.

      *   *Refining the "Remember Us" point:* Scheffler explicitly distinguishes between "collective afterlife" and "legacy." We care that people exist, not necessarily that they know *we* existed.

