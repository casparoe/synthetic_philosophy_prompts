answer: |-
  The air in the basement archive smelled of lignin and slow decay, a scent Elias had come to think of as the smell of authority. He sat at the steel processing table, wearing white cotton gloves, staring at a box labeled *Department of Urban Planning: Sector 4, 1974-1976*.

  Inside, the folders were pristine. The city planners had been meticulous. They had recorded everything: property values, square footage, sanitation grades, zoning variances. They had recorded the neighborhood of Hollow Creek as a series of problems to be solved. *Blight abatement.* *Structural clearance.* *Land reclamation.*

  Elias turned a page. *Subject: 4402 Hollow Creek Ave. Action: Demolition authorized.* There was no name. No mention of the family who lived there. No mention of the asthma that killed the father, or the fact that the demolition crew arrived before the eviction notice was legally served. The record described the power that destroyed the house, but it did not describe the house. In the eyes of the archive, the house was only real when it was being erased.

  The heavy door at the top of the stairs creaked open. Footsteps echoed on the concrete. Elias didn't look up until a shadow fell across the table.

  "It's Mara," the woman said. She wasn't out of breath, but she carried a plastic bin like it weighed fifty pounds. "You said two o'clock."

  Elias checked his watch. He was ten minutes early. "I did. Please, set it down."

  Mara set the bin on the table. She didn't take off her coat. She was forty, maybe fifty, with the kind of eyes that had spent too long looking for things that weren't there. She was from Hollow Creek. One of the few who had been children when the clearance happened.

  "I brought what we talked about," Mara said. She opened the bin. Inside were not official documents, but the debris of life. A church bulletin from 1975. A hand-drawn map of the block on the back of a grocery bag. A photograph of a porch with peeling paint, three people standing on it, smiling.

  Elias looked at the photo. In the city's files, that porch was *Structure ID 4402*. In this photo, it was a home.

  "Mara," Elias said gently. "We discussed the implications of accessioning this material."

  "I know what accessioning means, Elias. It means you give it a number. You put it in the database. You make it part of the city's memory."

  "Exactly," Elias said. He took off his gloves. He needed to feel the table beneath his hands. "But you have to understand the architecture of the database. It's built on the bones of the planning department." He gestured to the box of pristine folders. "If I enter your donation, I have to link it to an existing collection. The only existing collection for Hollow Creek is the Urban Planning series."

  "So?"

  "So, to find your mother's story, a researcher will have to look under *Blight Abatement*." Elias watched her face. "To find the victim, you have to search for the crime. The system forces you to speak the perpetrator's language to prove you were harmed."

  Mara touched the photograph. "If it's not in the database, it's a rumor. My nephew asked me last week if I made it up. He said there's no record of us ever living there. The city website says it was always industrial park land."

  "The absence is the point," Elias said. "They didn't just destroy the buildings. They destroyed the paperwork that proved the buildings were homes. That's how power works, Mara. It doesn't just break things. It decides what counts as a thing."

  "Then fix it," she said. Her voice was hard. "Write it down. Make it count."

  Elias walked to his computer. The screen glowed in the dim room. The cataloging interface waited for him. *Field 1: Accession Number. Field 2: Title. Field 3: Subject Headings.*

  "If I enter this," Elias said, "it becomes public record. Anyone can request it. Developers, city council, journalists. Once it's real, it's vulnerable. If I catalog this as 'Oral History of Displacement,' it stands out. It becomes a target. They can dispute it. They can classify it. They can lock it away for 'review.'"

  "And if you don't?"

  "Then it stays in your bin. It's real to you, and real to me, but to the city, it's noise. It doesn't exist."

  Elias looked at the photograph again. The woman on the porch was Mara's mother. She was holding a glass of lemonade. In the city's ledger, she was a variable in a housing density equation. Here, she was thirsty.

  "There's a third option," Elias said.

  Mara crossed her arms. "There shouldn't be. There should be true and there should be false."

  "There's true, and there's *filed*," Elias corrected. "I can create a new series. *Community Voices.* But I have to justify the provenance. I have to write a scope note explaining why these records exist outside the planning department. I have to write a narrative that says the official record is incomplete."

  "Will they let you?"

  "I'm the archivist," Elias said. "Technically, I control the description. But I work for the city. If I write a scope note that calls the 1974 clearance a 'violent erasure,' my supervisor will flag it. They'll say it's biased. They'll say archives must be neutral."

  "Neutral?" Mara laughed, a sharp, brittle sound. "Look at those boxes. Is *Demolition Authorized* neutral? It sounds like a verdict."

  "No," Elias said. "It sounds like a command."

  He sat down. He put his hands on the keyboard. The keys were worn smooth. He thought about the weight of the enter key. Once he pressed it, the bin on the table ceased to be a collection of memories and became data. It would be assigned a retention schedule. It would be subject to freedom of information requests. It would be safe from fire in the climate-controlled vault, but exposed to the eyes of the people who inherited the power that burned the neighborhood down.

  "If I do this," Elias said, "I can't protect you. The record doesn't protect. It evidences. Sometimes evidence is a shield. Sometimes it's a weapon turned against you."

  "My mother died in a motel three months after the clearance," Mara said. "She never got over it. I don't need protection. I need her to have been here."

  Elias nodded. He understood. The archive was a graveyard, but it was the only one that mattered. If you weren't buried here, you were scattered ash.

  He opened a new file. *Series 994: Unofficial Community Records.* He hesitated over the *Subject Heading* field. The dropdown menu offered suggestions: *Urban Renewal, Housing Development, Zoning.* All words sanitized by the planners. All words that assumed the city's right to reshape the land.

  He typed: *Forced Displacement.*

  The system didn't recognize the term. It underlined it in red. *Invalid Authority Control.*

  Elias stared at the red line. It was a small thing, a digital squiggle, but it was the wall. The system was designed to accept only the reality it had created. To speak the truth was to trigger an error.

  He could override it. He had the admin password. But overriding the system left a log. *User Elias modified authority file.* It would be seen.

  "Type it," Mara said. She was watching his hands. "Let it be red."

  Elias took a breath. He typed *Forced Displacement* again. He hit *Override*. The red line vanished. The text turned black. It was accepted. It was now part of the vocabulary. Future records would have to contend with this term. It was a crack in the foundation.

  He moved to the *Description* field. This was where he had to summarize the contents of the bin. He looked at the grocery bag map. The church bulletin. The photo.

  *Contents include materials documenting residential life in Sector 4 prior to 1974 clearance,* he typed. *Contradicts official designation of sector as industrial zone.*

  He paused. *Contradicts.* That was a strong word. It implied the city was lying.

  *Challenges official designation,* he corrected. No, that was too weak.

  *Exists alongside official designation,* he typed. *Provides counter-narrative.*

  He stopped. He looked at Mara. "This is the best I can do. I can't say they lied. I can only say you were here."

  "That's enough," she said. "If you say we were here, then what they did wasn't cleaning up. It was breaking something that was there."

  Elias clicked *Save*. The screen flickered. *Record Created. Accession Number 2024.005.*

  A printer whirred to life in the corner, spitting out the barcode label. Elias peeled it off and walked over to the bin. He stuck it on the side, covering a stain on the plastic.

  The bin was no longer a bin. It was Box 2024.005. It was real. It was findable. It was dangerous.

  "You know," Elias said, picking up his gloves again. "Now that this is in the system, people will come. They'll want to know why the official records don't match this. They'll ask me why I created a new series."

  "Let them ask," Mara said. She picked up the empty plastic bin, the one she'd brought the treasures in. She looked lighter, though she hadn't taken anything with her. "Let them look at the red line."

  "It might cost me my job."

  "Then someone else will type it next time," she said. "You broke the authority control. That doesn't go back."

  Elias looked at the screen. *Forced Displacement.* It sat there, stark and black against the white background. It was just text. It wasn't justice. It wouldn't bring the houses back. It wouldn't compensate the families. But it was a record. And in this room, records were the only things that survived the fire.

  "I'll send you the finding aid," Elias said. "When it's processed."

  "Send it," Mara said. She turned to the stairs. "Make sure you spell our names right."

  Elias watched her go. When the door closed, the silence rushed back in, heavy with dust. He looked at the box of Urban Planning files. *Blight Abatement.* The words seemed thinner now, less certain. They were no longer the only story.

  He opened the planning file again. He took a pen from his pocket. He wasn't supposed to write on the original records. It was against every protocol he had ever learned. The archive was supposed to be passive. A mirror.

  Elias uncapped the pen. In the margin of the demolition order, next to *Structure ID 4402*, he wrote in small, precise letters: *Home of the Velez Family.*

  He capped the pen. He put it away. He hadn't changed the record's legal status. He hadn't undone the demolition. But he had introduced a ghost into the machine. Now, whenever anyone opened that folder to study the efficiency of the clearance, they would see the name. They would see the humanity that the filing system was designed to exclude.

  He sat back and waited for the feeling of panic, the fear of being caught altering the record. It didn't come. There was only the hum of the server rack and the smell of old paper. The record was real. He had made it so. And now, he would have to live with what it meant.
