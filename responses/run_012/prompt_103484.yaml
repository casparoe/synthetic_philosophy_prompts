      *   *The Event:* A disappearance or a suppression of a community. Maybe a marginalized group (migrant workers, indigenous people, a specific neighborhood) was erased. Let's say a neighborhood was bulldozed for a "renewal project" in the 70s, and people were displaced or hurt, but the official records only show "zoning adjustments" and "property acquisition."
      *   *The Protagonist:* Elias. A municipal archivist. He's tired, meticulous, understands the weight of paper.
      *   *The Antagonist (Abstract):* The existing archive itself. The language of the perpetrators (city planners, police).
      *   *The Conflict:* A community member (let's call her Mara) wants her mother's story in the official record. The mother was displaced/hurt during the "renewal." But there's no paper trail of the harm, only the bureaucracy that caused it.
      *   *The Dilemma:* If Elias creates a new record (oral history, affidavit), it validates the trauma but makes it searchable. Will it be used against them? Will it be buried again? If he doesn't, it remains a rumor.
      *   *The Twist/Resolution:* There shouldn't be a neat victory. The act of recording is the victory, but it comes with cost. Or the realization that the record *is* the wound.

  3.  **Drafting - Scene by Scene:**
