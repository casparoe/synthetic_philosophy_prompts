      *   **Constraint 2 (Protagonist):** The main character must be a *maker* of records (archivist/record-keeper), not a finder.
      *   **Constraint 3 (Dilemma):** Writing it down makes it real but also exposes/endangers the people involved.
      *   **Length:** About 1,500 words.
      *   **Tone:** Real story with people, not a lecture.

  2.  **Brainstorming & Setup:**
