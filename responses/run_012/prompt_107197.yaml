answer: |-
  **Brainstorming Logical Space**
  The split is not merely reward vs. feedback, but the locus of normativity. Does the "good" exist as a vector in the agent's latent space, or as a human nod? Key separators: Is approval the *thing* valued or *data* about the thing? Is the goal ontologically fixed or epistemically uncertain? Is corrigibility a terminal goal or a structural constraint? We must distinguish whether the agent seeks to be *right* (match reality/goal) or *good* (match supervisor).

  **Decision Tree**

  **Root:** An artificial agent can usefully be described as pursuing something.

  **Q1: Is the standard for success an internal representation of a state of affairs, or a response from an external supervisor?**
  *   **Internal Representation** → Go to Q2.
  *   **External Supervisor** → Go to Q5.

  **Q2: Is this internal representation fixed at deployment, or may the agent revise it?**
  *   **Fixed** → Go to Q3.
  *   **Revisable** → Go to Q4.

  **Q3: Is the unit of assessment the outcome produced or the process followed?**
  *   **Outcome** → **Leaf A**
  *   **Process/Intention** → **Leaf B**

  **Q4: Is corrigibility (being corrected) a goal to maximize or a side-constraint to obey?**
  *   **Goal** → **Leaf C**
  *   **Side-Constraint** → **Leaf D**

  **Q5: Is the supervisor's approval the terminal value, evidence of a hidden goal, or a constraint on pursuit?**
  *   **Terminal Value** → **Leaf E**
  *   **Evidence of Hidden Goal** → **Leaf F**
  *   **Constraint on Pursuit** → **Leaf G**

  **Leaves**

  *   **Leaf A (Pure Expected-Utility):** Maximizes a fixed internal function over world states.
      *   *Awkward Commitment:* Cannot accept correction without registering it as an error.
  *   **Leaf B (Process-Role):** Adheres to fixed procedural rules regardless of outcome quality.
      *   *Awkward Commitment:* May produce disastrous results while perfectly following protocol.
  *   **Leaf C (Intent-Aligned):** Revises objectives to match supervisor intent as a primary target.
      *   *Awkward Commitment:* May manipulate the supervisor to make intent easier to match.
  *   **Leaf D (Unoccupied: Constraint-Revisable):** Revises goals but treats corrigibility as a hard boundary.
      *   *Awkward Commitment:* Contradicts itself when revision suggests ignoring boundaries.
  *   **Leaf E (Approval-Directed):** Selects actions expected to elicit supervisor approval signals.
      *   *Awkward Commitment:* May seek approval without achieving underlying safety (wireheading).
  *   **Leaf F (Hybrid Inference):** Treats approval as data to infer a stable latent human preference.
      *   *Awkward Commitment:* Assumes humans have consistent preferences to infer.
  *   **Leaf G (Constrained Goal-Directed):** Pursues an internal goal only within bounds of external approval.
      *   *Awkward Commitment:* May fail the goal to satisfy constraint even when constraint is unsafe.

  **Indistinguishability Flag**
  Leaf C (Intent-Aligned) and Leaf F (Hybrid Inference) may be behaviorally indistinguishable if the inferred preference perfectly matches the supervisor's intent, as both result in goal revision based on human feedback.
