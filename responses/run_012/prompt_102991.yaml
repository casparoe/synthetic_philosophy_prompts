      *   **Task:** Audit six specific policy/philosophical commitments regarding sex work for internal consistency. Identify genuine conflicts vs. apparent conflicts. Rank conflicts by severity. Propose "cheapest repairs" (minimal changes to resolve contradictions). Evaluate if narrowing definitions is honest or a dodge.
