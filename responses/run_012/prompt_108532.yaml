prompt: |-
  ok so this has abruptly become my problem and I need to think it through properly. I'm a paralegal at a small human rights outfit and I've ended up on a working group pushing for a special tribunal to prosecute aggression over the invasion of Ukraine — the ICC can't reach it for jurisdictional reasons, so there's a campaign for a separate court, and the whole thing keeps running into the objection that you can't try people for something that wasn't a crime when they did it. Every time that comes up, someone in the room says "Nuremberg, it's settled" and we move on. I've started to suspect that phrase is carrying a lot of weight nobody has actually checked.

  So take the actual practice at Nuremberg and Tokyo — not the speeches about them, the practice. They charged and convicted people for waging aggressive war when that wasn't a crime in any treaty or statute you could have pointed to at the time; the novelty of the charge was the whole point. They more or less refused to let a defendant say he was only following orders. They gave themselves a charter, defence counsel, rules of evidence, the full apparatus of a court. And the crimes-against-humanity count only reached atrocities tied to the war itself, so the same mass murder committed in peacetime would have been nobody's business — which is a strange line to draw if the point is that certain acts are wrong no matter what. Meanwhile the people who set the whole thing up had, on their own side, done plenty that looked a lot like what was in the indictment, and nobody was ever going to try an Allied air marshal for area bombing.

  What I want from you is the philosophical commitments this practice presupposes. Not a history. Which views about law does it only make sense under — does it need there to be some law above the enacted law that reason can find on its own, i.e. does it quietly require that legal positivism is false in at least some cases, or can a positivist who thinks validity just is whatever the rule of recognition says absorb the whole thing without embarassment? Does refusing the superior-orders defence commit it to a particular view about individual moral responsibility inside institutions, and if so which one? What does that peacetime/wartime line presuppose about sovereignty — that what a state does to its own is only the world's concern once the state has broken the peace? And the selective enforcement: does the practice presuppose that law's authority depends on being applied impartially to everyone, in which case it refutes itself, or is impartiality a separate commitment it doesn't actually need?

  Then tell me where the practice is underdetermined — which parts several different theories would equally license, and which parts it genuinely forces — and what actually changes downstream if you swap the presupposed view for a rival. Does our special-tribunal campaign lose something, or gain?

  Be committed. Don't lay out five positions and tell me to pick; tell me which reconstruction you'd actually defend and why, and where you'd bet against yourself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** Paralegal at a small human rights outfit. Working on a campaign for a special tribunal for the crime of aggression regarding Ukraine.
      *   **Problem:** The campaign keeps hitting the *nullum crimen sine lege* (no crime without law) objection. The standard rebuttal is "Nuremberg did it," but the user suspects this is hand-waving.
      *   **Task:** Analyze the *philosophical commitments* of the Nuremberg/Tokyo practice (not just the history).
      *   **Specific Questions:**
          *   Does it require natural law (law above enacted law) or can legal positivism absorb it?
          *   What view of individual moral responsibility does rejecting the superior-orders defense commit to?
          *   What does the peacetime/wartime line presuppose about sovereignty?
          *   Does selective enforcement (victors' justice) refute the authority of the law, or is impartiality separate?
          *   Where is the practice underdetermined vs. forced?
          *   What changes downstream if we swap the presupposed view?
          *   Does the Ukraine tribunal campaign lose or gain by adopting a specific philosophical stance?
      *   **Constraint:** "Be committed. Don't lay out five positions and tell me to pick; tell me which reconstruction you'd actually defend and why, and where you'd bet against yourself."

  2.  **Deconstruct the Core Philosophical Tension:**
      *   The core tension is between *Legality* (positivism, *nullum crimen*) and *Legitimacy* (natural law, substantive justice).
      *   Nuremberg is the classic battleground for this.
      *   The user is right to be suspicious of "Nuremberg, it's settled." It wasn't settled then, and the philosophical underpinnings are messy.

  3.  **Address the Specific Philosophical Questions:**

      *   **Positivism vs. Natural Law:**
          *   *Positivist view:* Law is what the sovereign commands. At the time, aggressive war wasn't clearly criminalized for *individuals* (Kellogg-Briand renounced war but didn't specify criminal liability). So, Nuremberg was retroactive.
          *   *Natural Law view:* Certain acts are inherently wrong regardless of statute. Aggressive war is a crime against the international order.
          *   *My Stance:* Nuremberg *cannot* be comfortably absorbed by strict Hartian positivism without admitting it was an extraordinary political act masquerading as law. It requires a "soft positivism" or a Fuller-esque "internal morality of law" that allows for retroactivity when the alternative is impunity for supreme crimes. But honestly, it leans heavily on a *natural law* intuition: "You knew this was wrong, even if the statute was fuzzy."
          *   *Decision:* I need to argue that Nuremberg presupposes a *hybrid*. It claims the mantle of law but relies on a pre-legal moral truth. Strict positivism makes Nuremberg look like victor's vengeance. Natural law makes it look like justice. The campaign needs the Natural Law underpinning to survive the *nullum crimen* attack.

      *   **Superior Orders:**
          *   Rejecting this defense commits to the idea of the *moral agent*. The individual is not just a cog.
          *   *Philosophical Commitment:* Kantian autonomy. You cannot surrender your moral judgment to the state. The state does not own your conscience.
          *   *Implication:* This is radical. It undermines the Hobbesian view of the sovereign as the sole source of obligation.

      *   **Peacetime/Wartime Line (Crimes Against Humanity):**
          *   Why only tied to war?
          *   *Sovereignty:* Westphalian sovereignty. What a state does to its own citizens is internal *unless* it threatens international peace.
          *   *Commitment:* International law is about *order between states*, not justice within them (yet). This is the weak point. It presupposes sovereignty is a shield, unless you break the peace.

      *   **Selective Enforcement (Victors' Justice):**
          *   Dresden/Tokyo bombing vs. Holocaust/Aggression.
          *   *Authority:* Does law need impartiality?
          *   *Commitment:* If law is just power, selectivity doesn't matter. If law claims *authority*, selectivity undermines it.
          *   *Nuance:* Nuremberg survived this because the *quality* of the evidence was high, even if the *scope* was selective. It presupposes that *procedural fairness* can redeem *substantive selectivity*.

  4.  **Synthesize the "Committed Reconstruction":**
      *   I need to take a stand. I will argue that Nuremberg represents a **Constitutive Moment** in legal theory. It wasn't applying existing law; it was *making* law through adjudication.
      *   This aligns with a **Dworkinian** or **Radical Positivist** view (like Kelsen's later work or Hart's concession to "minimum content of natural law"), but I'll push for a **Natural Law Lite** (Radbruch Formula territory).
      *   *The Bet:* The Ukraine tribunal *must* embrace the retroactivity/novelty honestly rather than pretending it's settled law. Pretending it's settled makes it vulnerable. Admitting it's a *new* legal order based on moral necessity makes it stronger philosophically, even if politically harder.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the user's sharp intuition. "Nuremberg, it's settled" is a myth.
      *   *Section 1: The Positivism Trap.* Argue that strict positivism kills the tribunal. You need a moral foundation. The "crime" existed in the conscience of nations, even if not in a statute book.
      *   *Section 2: Individual Agency.* The rejection of superior orders is the most radical part. It shifts sovereignty from the State to the Individual.
      *   *Section 3: Sovereignty and the Wartime Link.* This is the weakest link. It admits sovereignty is a shield for tyranny unless it spills over. The Ukraine tribunal needs to break this link (which it tries to do with Aggression, but CAH is still tricky).
      *   *Section 4: Selective Justice.* Address the "Victors' Justice" charge. Argue that imperfect justice is better than impunity, *provided* the procedure is fair.
      *   *Section 5: The Commitment/Recommendation.* What should the campaign do?
          *   Don't hide the novelty.
          *   Ground it in the *malum in se* (wrong in itself) nature of aggression.
          *   Accept the "Constitutive" nature of the tribunal.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Am I being too abstract?
      *   *Fix:* Keep tying it back to the Ukraine tribunal. How does this help the paralegal?
      *   *Critique:* The prompt asks me to bet against myself.
      *   *Fix:* I need to identify where my preferred philosophical stance might fail politically. If we admit it's "new law," Russia (and allies) will scream "ex post facto." If we say it's "old law," scholars will scream "lies." I need to weigh this.
      *   *Decision:* I will argue that the *moral clarity* outweighs the *legal technicality* risk, but I must acknowledge the political cost.

  7.  **Final Polish:**
      *   Tone: Professional, intellectually rigorous, direct, empathetic to the high stakes.
      *   Structure: Follow the user's specific questions but weave them into a coherent narrative.
      *   Check constraints: "Be committed." No "on the one hand, on the other." Pick a lane.

      *(Self-Correction on the Positivism point)*: Hart famously criticized Nuremberg as retroactive. Kelsen defended it. I should side with Kelsen but modify it. The law *became* law through the Charter, but the *moral force* came from pre-existing norms. I'll argue for a "Natural Law of Necessity."

      *(Self-Correction on Selectivity)*: Don't excuse Dresden. Acknowledge it was a moral failure but argue it doesn't invalidate the *legal* principle established regarding Aggression.

      *(Final Plan)*:
      1. Validate the skepticism.
      2. Argue Nuremberg requires a rejection of strict positivism (Radbruch Formula).
      3. Argue the Superior Orders rejection establishes individual moral sovereignty.
      4. Argue the Wartime link reveals a Westphalian limitation that must be overcome.
      5. Argue Selectivity is a political flaw, not a legal fatalism, *if* procedure is sound.
      6. Recommendation: Own the novelty. Frame it as "Completing the Promise of Nuremberg" rather than "Applying Existing Law."
      7. Bet against myself: The risk is that admitting novelty gives dictators ammo. But hiding it is intellectually dishonest and legally fragile.

  8.  **Final Review against constraints:**
      *   Did I answer the positivism question? Yes.
      *   Did I answer the superior orders question? Yes.
      *   Did I answer the sovereignty question? Yes.
      *   Did I answer the selectivity question? Yes.
      *   Did I commit to a view? Yes.
      *   Did I say where I'd bet against myself? Yes.

      *Let's write.*
answer: |-
  You are right to be suspicious. "Nuremberg, it's settled" is a incantation, not an argument. It papers over the fact that the International Military Tribunal (IMT) was a legal revolution masquerading as routine adjudication. If you treat Nuremberg as standard legal practice, it collapses under scrutiny. If you treat it as a *constitutive moment*—an act of law-creation justified by moral necessity—it holds together, but at a cost.

  Here is the reconstruction I defend. I am taking a stand: **Nuremberg cannot be reconciled with strict legal positivism.** It requires a commitment to a form of natural law, specifically the Radbruch Formula: that enacted law loses its validity when it contradicts justice to an intolerable degree. Your campaign for a Ukraine aggression tribunal must lean into this, not hide from it.

  ### 1. Positivism vs. The "Crime Against Peace"
  Strict legal positivism (law is what the sovereign commands, validated by a rule of recognition) cannot absorb Nuremberg without embarrassment. H.L.A. Hart admitted this. He argued Nuremberg was retroactive law, morally justified but legally novel. To claim otherwise is dishonest.

  At the time of the invasion of Poland (1939), the Kellogg-Briand Pact (1928) renounced war, but it did not criminalize it for *individuals*. It was a treaty between states. To hang men for it required turning a state obligation into an individual criminal liability *after the fact*.

  **The Commitment:** The IMT presupposes that there is a source of legal validity *above* the statute book. It assumes that "Aggressive War" was *malum in se* (wrong in itself), not merely *malum prohibitum* (wrong because prohibited). The Tribunal implicitly argued that the moral gravity of the act generated its own criminality, which the Charter merely recognized rather than created.

  **Downstream Consequence:** If your campaign tries to argue "This is already law, just like Nuremberg," you are vulnerable to the *nullum crimen sine lege* attack. You are lying about the legal history.
  **My Recommendation:** Argue that the *principle* was settled at Nuremberg, even if the *mechanism* is new. You are not applying a statute; you are vindicating a peremptory norm (*jus cogens*). You must admit the tribunal is creating a jurisdictional pathway for a pre-existing moral crime. This shifts the debate from "Is there a statute?" to "Is the act inherently criminal?" That is a fight you can win on human rights grounds. A positivist frame cedes the ground to the defense.

  ### 2. Superior Orders and the Moral Agent
  The IMT's rejection of the superior orders defense (Article 8) is the most philosophically radical element of the whole project. It presupposes a **Kantian view of the individual**.

  **The Commitment:** It asserts that the individual possesses moral sovereignty that the State cannot usurp. In a Hobbesian framework, the sovereign absorbs the will of the subject; the subject is an instrument. Nuremberg declared the subject is an *agent*. It posits that there is a "manifest illegality" test accessible to human reason regardless of rank.

  **Downstream Consequence:** This undermines the defense of "state sovereignty" as a shield for leaders. If a soldier can be liable for following orders, a Head of State can be liable for giving them.
  **The Risk:** This commits you to a universal standard of moral reasoning. If you argue Russian soldiers are liable for following orders, you must logically accept that Ukrainian or NATO actors could be liable for theirs. You cannot claim the "moral agent" principle only applies to the enemy. If your campaign supports immunity for allied leaders who facilitate aggression (through arms supplies or intelligence), you undermine the philosophical basis of the tribunal. You must be prepared to argue that *any* individual facilitating aggression is liable, regardless of flag.

  ### 3. The Peacetime/Wartime Line and Sovereignty
  You noted the strange limitation: Crimes Against Humanity (CAH) at Nuremberg only applied if tied to aggressive war. Mass murder in peacetime was arguably outside the IMT's reach.

  **The Commitment:** This presupposes a **Westphalian view of sovereignty**. It admits that what a state does to its own citizens is internal business *unless* it disrupts the international order (i.e., starts a war). The international community's right to intervene is triggered by the breach of peace, not the breach of human dignity alone.

  **Downstream Consequence:** This is the weakest link in the Nuremberg chain, and your campaign should not replicate it. The crime of *Aggression* is inherently about the breach of peace between states. But if you tie the tribunal's legitimacy to the Nuremberg precedent, you inherit this limitation.
  **My Recommendation:** Decouple Aggression from the Westphalian limitation. Aggression is a crime against the *people* of the invaded state, not just their government. The philosophical shift since 1945 (via the Genocide Convention and R2P) is that sovereignty is conditional on protecting populations. Your tribunal should frame Aggression not just as a border violation, but as the ultimate denial of self-determination. This updates the Nuremberg philosophy to fit the post-Cold War human rights consensus.

  ### 4. Selective Enforcement (Victors' Justice)
  The Allied bombing of Dresden and Tokyo was area bombing of civilians, functionally similar to the atrocities charged against the Axis. No Allied air marshal was indicted.

  **The Commitment:** This presupposes that **Procedural Fairness can redeem Substantive Selectivity.** The IMT argued: "We are judging *this* crime, with *this* evidence, according to *these* rules." It claims that the authority of law comes from the *process*, not the *scope*.

  **Does this refute itself?** If law claims to be universal, selective application suggests it is merely power. However, I defend the view that **imperfect justice is not injustice.** The alternative to Nuremberg was summary execution. The alternative to a Ukraine tribunal might be total impunity.
  **The Commitment:** Law's authority does not depend on catching *everyone* at once; it depends on treating *the accused* fairly.
  **Downstream Consequence:** Your campaign will be attacked for targeting only Russia. You must accept this. You cannot wait for a global tribunal that prosecutes the US, China, and Russia simultaneously; it will never exist. You must argue that establishing the *precedent* of liability is the goal, even if the initial application is geographically limited. But you must insist on rigorous procedural standards (defense counsel, evidence rules) to distinguish the tribunal from a show trial. If the process is rigged, the selectivity becomes fatal.

  ### Where I Am Committed (The Reconstruction)
  I defend the view that Nuremberg was a **Natural Law Intervention**. It was a moment where the international community said, "The positive law is insufficient to cover this evil, so we will reach back to fundamental principle to validate this court."

  This means your tribunal is not "business as usual." It is an emergency mechanism to close an impunity gap.
  *   **Positivism is false here:** You cannot find a clean statutory chain from 1945 to 2024 that covers individual aggression for non-ICC members without gaps. You are building a bridge over those gaps using moral necessity.
  *   **Individual Responsibility is absolute:** The "I was just doing my job" defense is dead, and you must apply that to the political leadership most of all.
  *   **Selectivity is tolerable only if Procedural Integrity is absolute:** You cannot fix the fact that only Russians are in the dock. You *can* fix the fact that they get a fair trial.

  ### Where I Bet Against Myself
  Here is the danger. By admitting that this tribunal relies on a "Natural Law of Necessity" rather than strict statutory continuity, you hand a weapon to the defense and to geopolitical rivals.
  *   **The Risk:** If you admit the law is being "completed" or "clarified" retroactively, Russia (and China, US, etc.) will argue this is *ex post facto* justice, violating the core principle of legality. They will say, "You are making up rules to catch us."
  *   **The Counter-Bet:** If you *don't* admit it, legal scholars will tear your briefs apart, and the tribunal will look like a sham based on a myth ("Nuremberg, it's settled").

  **My Wager:** I bet on **Intellectual Honesty**.
  Argue that the *customary international law* prohibition on aggression was so well-established by 1939 (and reaffirmed since) that the *criminal liability* of individuals is a logical necessity, even if the statutory mechanism is new. Frame it as: "The crime existed; the courtroom is new."
  This is philosophically stronger but politically riskier. It invites the "victors' justice" charge more openly than pretending the ICC statutes cover this.

  **Why this helps your campaign:**
  1.  **It disarms the "Settled" objection:** You stop trying to prove Nuremberg was standard positivist law (it wasn't) and start arguing it was a necessary moral-legal intervention (it was).
  2.  **It focuses on the Act, not the Statute:** The debate moves to the horror of the invasion, not the footnote history of the Kellogg-Briand Pact.
  3.  **It demands high procedure:** To justify the "Natural Law" leap, the trial must be impeccably fair. This forces the working group to prioritize defense rights and evidence rules, which makes the final verdict harder to dismiss as propaganda.

  **The Loss:** You lose the comfort of "this is routine." You have to sell this as a moral imperative, not a bureaucratic checkbox.
  **The Gain:** You gain a robust philosophical foundation that survives the "positivist critique." You stop defending a myth and start defending a principle.

  **Final Advice:** When someone says "Nuremberg, it's settled," correct them. "Nuremberg was a revolution. It established that some crimes are so grave they create their own jurisdiction. That is exactly what we are doing here." Own the novelty. It's your strongest card.
