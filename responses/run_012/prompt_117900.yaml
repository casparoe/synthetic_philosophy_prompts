prompt: |-
  I've got a grad student in phil of mind and language who wants to spend her third year on where meaning lives -- the picture where a message is never just its content: there's the inner message, the outer message carried by the frame, and the frame itself, which you can then ask about in turn, so the "location" keeps sliding. She has a year, a logic background, and no appetite for psych experiments or corpus work. What I dont want is another survey of the familiar debates; I want her on the questions that are upstream of everything else in that area. So give me the live open questions in this neighborhood, ranked, and defend the ranking: which are upstream of which, which are actually tractable in a year by someone with her tools, which are overrated or have quietly been settled, and what would move one up or down the list. Also tell me whether "location" is even the right metaphor here, or whether the frame/outer/inner vocabulary is doing real work or just dressing up something older -- and if the frame is itself a message all the way down, does that regress have a principled stopping point or is it a feature rather than a bug?
