answer: |-
  This is a sharp prompt. You're right to be wary of "zombie debates" (Contextualism vs. Invariantism, Grice vs. Post-Gricean) that chew up years without moving the needle. A logic-minded student with no empirical appetite is perfectly positioned to work on the *structural* conditions of meaning, provided she doesn't get bogged down in formalism for formalism's sake.

  Here is the audit of her project, the ranking of upstream questions, and the verdict on her metaphors.

  ### 1. The Metaphor Audit: Is "Location" Real Work?

  **Verdict:** "Location" is a category mistake; "Frame" is a logical operator.

  *   **"Location" is misleading.** It suggests meaning is a substance that resides *in* the text, *in* the mind, or *in* the world. This reification is the source of the "sliding" problem she identifies. If she treats meaning as a *relation* or a *coordination event* rather than a *content*, the "where" question dissolves into a "how" question.
  *   **"Frame" is doing work, but it needs typing.** The intuition that there is "content" and "context about the content" is robust (Bateson's "This is play," Goffman's footing, Kaplan's context indices). However, if the frame is just *another message*, she is describing a **type violation**.
  *   **The Upgrade:** She should not ask "Where does meaning live?" She should ask: **"What fixes the logical type of the communicative act?"**
      *   If the frame is a message, it needs a frame.
      *   If the frame is a *rule* or an *operator*, it doesn't need a frame in the same way; it needs *authority* or *convention*.
      *   **Recommendation:** Shift her vocabulary from *Inner/Outer/Frame* to *Object-Level/Meta-Level/Transition Rules*. This leverages her logic background and avoids the infinite regress trap until she's ready to tackle it deliberately.

  ### 2. The Regress: Bug or Feature?

  **Verdict:** It is a **feature** of natural language, but a **bug** for formal modeling. Communication requires a *practical* stopping point, not a *logical* one.

  *   **The Problem:** If every frame requires a meta-frame to interpret it, communication never starts.
  *   **The Settled View:** Most pragmatics (Stalnaker, Lewis) assumes a "Common Ground" that is simply *given* at the start of the interaction. This is where the regress stops *by fiat*.
  *   **The Live Question:** *How* is that Common Ground established if not by a prior message?
      *   *Option A (Biological/Embodied):* We stop at shared physiology (Enactivism). (She won't like this; too empirical).
      *   *Option B (Normative):* We stop at a shared commitment to a norm (Brandom).
      *   *Option C (Logical):* We stop at a fixed point in a dynamic system (Dynamic Semantics).
  *   **Advice:** Tell her the regress isn't something to "solve" (i.e., eliminate). It's something to **model**. How do agents *agree* to stop regressing? That agreement is the "frame."

  ### 3. Ranked Open Questions (Upstream & Tractable)

  Here are three questions ranked by **Upstreamness** (how much lower-level debate they dissolve) and **Tractability** (for a logician in one year).

  #### **#1: The Grounding of Contextual Parameters (The "Scoreboard" Problem)**
  *   **The Question:** Standard formal pragmatics (Stalnaker/Lewis) treats context as a "scoreboard" of parameters (time, place, speaker, standard of precision). But *who* sets the scoreboard, and by what logic? When does a parameter shift count as a legitimate move in the language game versus a misunderstanding?
  *   **Why it's #1 (Upstream):** Almost all debates about truth-conditions, vagueness, and implicature assume the scoreboard is stable. If the rules for *updating* the scoreboard are contested, the downstream truth values are indeterminate. This is the "frame of the frame" question formalized.
  *   **Tractability:** High. She can use Dynamic Semantics or Update Semantics tools. She doesn't need data; she needs to construct cases where the *update rule* is ambiguous (e.g., irony, gaslighting, legislative interpretation) and show that standard models fail to capture the *negotiation* of the parameter.
  *   **Why not higher?** It's technically dense. She needs to ensure she doesn't just write a technical paper but keeps the philosophical import (normativity of context) visible.

  #### **#2: The Logical Type of Metapragmatics**
  *   **The Question:** Is a frame (e.g., "I am joking," "This is off the record") a **proposition** (truth-apt content) or an **illocutionary operator** (a function that changes the status of other content)?
  *   **Why it's #2 (Upstream):** If it's a proposition, it can be lied about, leading to the regress. If it's an operator, it is constitutive. Confusing these two types is the source of most "meaning is slippery" arguments.
  *   **Tractability:** Very High. This is pure philosophy of language/logic. She can analyze the syntax/semantics of framing markers.
  *   **Defense:** This cuts through the "location" metaphor immediately. It forces a decision: is the frame part of the *said* or the *doing*?
  *   **Risk:** It risks becoming a taxonomy of speech acts (Austin/Searle territory). She must avoid rehashing Searle. Focus on the *logical type mismatch* in cases of framing failure (e.g., "I didn't know we were arguing").

  #### **#3: The Normativity of Framing Authority**
  *   **The Question:** When two agents disagree on the frame (e.g., one thinks it's a debate, the other thinks it's a therapy session), what determines who is right? Is framing a matter of *power*, *convention*, or *inferential commitment*?
  *   **Why it's #3 (Upstream):** This connects language to political/epistemic philosophy. It addresses the "sliding" location by asking what *anchors* it.
  *   **Tractability:** Medium. It requires engaging with normative pragmatics (Brandom, MacFarlane) without getting bogged down in sociological description.
  *   **Defense:** It prevents the project from being purely abstract. It explains *why* the sliding matters (e.g., in law, diplomacy, or gaslighting).

  ### 4. What is Overrated or Quietly Settled?

  *   **Settled:** "Context matters." (Don't argue this). "Speaker meaning differs from sentence meaning." (Don't argue this).
  *   **Overrated:** **The Literal/ Figurative Distinction.** In her neighborhood, this is a red herring. If the frame determines the interpretation, "literal" is just the default frame. Spending time defining literalness is a waste of a year.
  *   **Overrated:** **Gricean Implicature calculations.** These assume a stable cooperative principle. Her project challenges the stability of the principle itself. Using Grice as a base will constrain her too much.
  *   **Settled (but ignored):** **Kaplan's Character/Content distinction.** It's technically settled, but philosophers often ignore the rigidity of the *context* parameter. She can exploit this gap.

  ### 5. What Moves a Question Up or Down the List?

  *   **Move #1 Up if:** She finds a formalism that allows for *conflicting* scoreboards (e.g., paraconsistent context updates). If she can model a conversation where agents successfully communicate *despite* disagreeing on the frame parameters, that is a major contribution.
  *   **Move #2 Down if:** She finds that the operator/proposition distinction collapses in natural language (e.g., performatives that describe themselves). If the logic can't sustain the type distinction, she must move to #3 (Normativity).
  *   **Move #3 Up if:** She wants to pivot toward social ontology. If she realizes the "frame" is ultimately a power dynamic, this becomes the primary question.

  ### 6. The One-Year Plan (Logic-First)

  Given her tools and timeline, here is the specific pitch:

  1.  **Months 1-3:** **Formalize the Regress.** Don't talk about it; model it. Use a simple dynamic logic. Show that without a "stopping rule," the system crashes.
  2.  **Months 4-6:** **Identify the Stopping Rules.** Compare three candidates: (a) Common Ground (Stalnaker), (b) Normative Commitment (Brandom), (c) Biological/Perceptual Salience (Recanati/Contextualism). Argue which one blocks the regress without begging the question.
  3.  **Months 7-9:** **Case Studies (Conceptual).** Apply this to "Framing Disputes" (e.g., Is this speech 'hate speech' or 'political opinion'? The content is the same; the frame determines the truth conditions of the *classification*).
  4.  **Months 10-12:** **Write.** Argue that meaning doesn't "live" anywhere; it is the **stable fixed point of a negotiated frame**.

  ### Summary Advice for the Advisor

  Tell her to drop the word "Location." It invites the homunculus fallacy. Tell her to keep the word "Frame" but treat it as a **logical type constraint**.

  Her project is viable *only if* she treats the "sliding" not as a mystery to be solved, but as a structural feature of meta-representation that requires a normative or logical anchor to function. If she tries to find the "real" location, she will fail. If she tries to define the **conditions under which the sliding stops**, she has a dissertation chapter.

  **The Winning Question:** *"Under what logical or normative conditions does a metapragmatic frame become binding, thereby halting the regress of interpretation?"*

  This is upstream (it defines when meaning is fixed), tractable (logic/norms), and avoids empirical work. It turns the "bug" (regress) into the "feature" (negotiated stability).
