answer: |-
  This is a splendid passage to get stuck into, and your reading group is quite right to pause here. It is one of the places where the 'vibe' of Newton as a distant deist falls apart completely. What you are looking at is not merely a theological flourish; it is a precise metaphysical claim about the nature of divine action and language.

  To understand the logic, we must reconstruct the conceptual framework Newton is working within, which differs from ours in a few key respects. Here is a walkthrough of the argument, the target he is aiming at, and the distinctions you need to be careful not to import.

  ### 1. The Target: "Soul of the World"
  When Newton writes that God governs "not as the soul of the world," he is rejecting a specific cosmological model that was still very much in circulation in the 17th century.

  The idea of the *Anima Mundi* (World Soul) goes back to the Stoics and Plato's *Timaeus*. In this view, the universe is a single, giant living organism. God (or the Divine) is to the Universe what a human soul is to a human body: immanent, animating, and inseparable from it. If you adopt this view, God does not 'rule' the world from a position of authority; He simply *is* the life of the world.

  **Why Newton rejects this:**
  If God is the soul of the world, He is bound to it. He cannot act freely upon it, because He is part of its mechanical necessity. Furthermore, if the world is God's body, then disorder or evil in the world is a defect in God's own 'body'.

  Newton wants a God who is **transcendent** yet **active**. He is distinguishing between:
  *   **Immanent Principle:** A force woven into the fabric of things (which risks pantheism or necessitarianism).
  *   **Transcendent Ruler:** A voluntary agent who stands outside the system, created it, and actively sustains it through will.

  By denying God is the "soul of the world," Newton is securing the freedom of God. God chooses to hold the planets in orbit; He is not merely the gravitational glue itself. This is a direct rebuttal to the idea that the solar system runs on autopilot (a deist position) or that it runs because it *must* (a Spinozist position).

  ### 2. "God" as a Relative Word
  This is the crux of your confusion, and it stems from a difference in how we treat language versus how Newton treats it.

  **The Modern View:** We tend to think "God" is a proper name (like 'Steve') or a label for a being with a specific set of intrinsic properties (omnipotent, omniscient). We usually treat 'God' as referring to the *essence*.

  **Newton's View:** Newton is analysing the word etymologically and scripturally (specifically looking at the Hebrew *Elohim* and Greek *Theos*). He argues that "God" is a **title of office**, not merely a label of nature. It is like the word "King."
  *   You cannot be a King without subjects.
  *   Therefore, "Kingship" is a relative term; it implies a relationship between ruler and ruled.

  Newton is arguing that "Deity" (being God) *is* the dominion itself. It is not that a being exists and *then* acquires servants; rather, to be "Lord God" is to stand in a relation of authority to servants.

  **Naming vs. Ontology:**
  To answer your question: this is a point about both. For Newton, the way we speak (naming) reveals the metaphysical structure of reality (ontology). He is not saying "We just happen to call Him God." He is saying, "The concept of 'God' logically entails 'Lordship'."

  This is why he prefers "Lord" (*Dominus*) over "Eternal" or "Infinite."
  *   "Eternal" and "Infinite" describe **attributes** (how God is in Himself).
  *   "Lord" and "God" describe **relations** (how God stands towards us).

  You cannot worship an "Eternal." You cannot obey an "Infinite." You can only worship and obey a "Lord." Since religion consists of worship and obedience, the word "God" must imply a relationship.

  ### 3. The "No Servants" Problem
  You asked: *What happens to the divine attributes when there's no one to rule?*

  This is a counterfactual that Newton largely sidesteps, and for good reason. In his framework, there *are* servants. We exist. The angels exist. The question of "what if God never created anything?" is a speculative metaphysical puzzle that does not concern natural philosophy.

  However, there is a subtle distinction in the text you should note. Newton writes: *"The Supreme God is a Being eternal, infinite, absolutely perfect; but a being, however perfect, without dominion, cannot be said to be Lord God."*

  He distinguishes between:
  1.  **The Supreme Being:** Who possesses eternal and infinite attributes essentially.
  2.  **The Lord God:** Which is the title that Being holds when exercising dominion.

  So, if there were no servants, the **Being** would still exist (Eternal, Infinite, Perfect), but the title **Lord God** would not apply. Newton is comfortable with this. It does not diminish God's perfection; it simply means the *office* of Ruler requires subjects. This protects God's freedom: He was not *forced* to create in order to be complete. He was complete as a "Supreme Being," but became "Lord God" by choosing to exercise dominion.

  ### 4. Modern Distinctions to Avoid
  You were right to suspect you might be importing modern categories. Here are two specific traps to avoid in this paragraph:

  **A. Use vs. Mention**
  Newton is not making a purely linguistic point. When he says "God is a relative word," he is not doing analytic philosophy of language. He believes the structure of language (particularly the biblical languages) maps onto the structure of reality. If the word "God" implies a servant, it is because the *reality* of God implies a servant. Do not read this as "this is just how we use the word"; read it as "this is what the concept entails."

  **B. Essence vs. Relation**
  In modern theology, we often separate God's *essence* (who He is) from His *relations* (what He does with us). Newton blurs this. For him, God's will to rule is so central to His identity that "Deity is the dominion." He is pushing back against the Scholastic idea that we can define God purely through abstract metaphysics (First Cause, Unmoved Mover) without reference to His active governance.

  ### 5. Why This Matters for the "Deist" Claim
  This passage is the smoking gun against the claim that Newton was a deist who tacked God on at the end.

  *   **Deism:** God creates the machine, winds it up, and leaves. The title "Creator" applies, but "Lord" becomes redundant once the laws are set.
  *   **Newton:** God must *continue* to rule. If He stops governing, He ceases to be "Lord God" in the active sense, and the system (which relies on His active stability, not just initial laws) would collapse.

  By insisting that "God" means "Lord over servants," Newton is insisting that a God who does not actively govern is not functioning as God. The "tidiness" of the solar system is not a one-off miracle of creation; it is evidence of continuous administration.

  ### Summary of the Logic
  1.  **Premise:** True religion requires worship and obedience.
  2.  **Premise:** One can only obey a Ruler, not an abstract concept like "Infinity."
  3.  **Observation:** Scripture and language use "God" as a title of authority (Lord of Lords), not just a description of nature (The Eternal).
  4.  **Conclusion:** Therefore, "Deity" consists in Dominion.
  5.  **Corollary:** God is not the "Soul of the World" (an internal force), but the "Lord of the World" (an external Governor).
  6.  **Implication:** The solar system's stability proves not just a Designer, but a present Ruler.

  Newton is arguing that you cannot have the benefits of design without the presence of a Designer who stays on the job. To call Him "God" is to acknowledge His ongoing authority. If He were merely the "Eternal Cause," we might admire Him, but we could not serve Him. And for Newton, a God you cannot serve is not the God of the *Principia*.
