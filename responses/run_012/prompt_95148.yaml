      *   *Conscience:* Rawls respects liberty of conscience as a basic liberty (First Principle of Justice). However, this liberty is not absolute; it is bounded by the equal liberty of others and the requirements of a constitutional regime.
      *   *Exemptions:* Rawls is generally skeptical of broad exemptions from generally applicable laws if those laws protect basic rights of others. He distinguishes between the *right* to believe and the *right to act* on those beliefs when actions impact the basic structure or others' rights.
      *   *Personal History:* He wrote a theological thesis at Princeton ("A Brief Inquiry into the Meaning of Sin and Faith"). He lost his faith during WWII (Bataan/Philippines). He rarely spoke about this publicly until after his death (when the thesis was published). This suggests a deep personal engagement but a deliberate philosophical bracketing.

