prompt: |-
  I have been reading rationalist blogs and forums for the better part of a decade, and somewhere along the way I talked myself into moral particularism: I now think a feature that is a reason to act one way here can be a reason to act the opposite way there, and that no finite set of principles gets the verdicts right. The trouble is that I moderate a large online community, and I still have to act. Ten or so times a week I decide whether to warn, remove, or ban, usually with a few minutes' notice and sometimes with a few hundred users watching; a co-moderator reviews bans after the fact, and there is no one above me to escalate to.

  Please write me a decision procedure I can actually run: the questions to ask in order, what counts as a sufficient answer to each, where the procedure terminates in a decision, and where it has to hand the call back to me because the question is one of values rather than facts. The hard part, and the reason I am asking you rather than just drafting a rules document, is that the procedure has to be a particularist's procedure. It cannot quietly assume that the listed considerations always cut in the same direction. So I need to know how a checklist stays honest to the idea that the same feature counts differently in different cases — whether that means treating every rule as defeasible, or something else — and how the procedure marks the points at which a rule is likely to be overridden rather than applied.

  Then run it on three cases: a user whose comments are each technically true and individually defensible but who reliably leaves a thread worse; conduct that was fine last month in a different thread and is not fine now; and one case where I expect the procedure to return a verdict I will dislike, since I would rather discover that now than in the moment.

  Finally, tell me what the procedure cannot do. If particularism is right, any procedure is a lossy compression of a judgment it cannot reproduce, so say where this one will misfire and whether I should stop pretending it is more than a crutch.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Background:** Long-time reader of rationalist blogs/forums (LessWrong, Slate Star Codex/Astral Codex Ten, etc.). Familiar with concepts like moral particularism, decision procedures, epistemic humility, and system design.
      *   **Core Belief:** Moral Particularism (features can count differently in different contexts; no finite set of principles captures all moral truths).
      *   **Problem:** Needs to moderate a large online community *now*. High pressure, public scrutiny, no higher authority. Needs a decision procedure that respects particularism (doesn't pretend rules are universal laws) but is still actionable.
      *   **Requirements:**
          1.  A decision procedure (questions in order, termination conditions, value/fact distinction).
          2.  Must be "honest" to particularism (rules are defeasible, context-sensitive).
          3.  Run the procedure on three specific cases (Technical truth/poisonous effect; Context shift; Unpleasant verdict).
          4.  Meta-analysis: What the procedure *cannot* do (limitations, lossy compression).

  2.  **Deconstruct Moral Particularism for Moderation:**
      *   *Standard Moderation:* Rule-based (If X, then Ban). This violates particularism.
      *   *Pure Particularism:* "Just look and see." This is too slow/vague for high-pressure modding.
      *   *The Bridge:* A "Heuristic Decision Procedure." It treats rules as *presumptions* or *default reasons*, not absolute constraints. It explicitly includes steps to check for *defeaters* (contextual factors that flip the valence of a feature).
      *   *Key Mechanism:* The procedure shouldn't ask "Did they break Rule X?" It should ask "Does Feature X count *for* or *against* action in *this* context?"

  3.  **Drafting the Decision Procedure (The "Particularist Mod Protocol"):**
      *   *Goal:* Speed + Context Sensitivity.
      *   *Structure:*
          1.  **Fact-Finding (The "What"):** Establish the raw features.
          2.  **Valence Check (The "How it counts"):** This is the crucial particularist step. Does this feature count positively or negatively *here*?
          3.  **Defeater Search (The "Except"):** Look for context that overrides the default valence.
          4.  **Holistic Weighing (The "All Things Considered"):** Not adding up points, but gestalt judgment.
          5.  **Action & Review:** Decide and log.
      *   *Value vs. Fact:* Facts are "User said X." Values are "Does saying X harm the community *now*?" The procedure must flag where the mod's intuition is doing the heavy lifting.

  4.  **Refining the Procedure for "Honesty":**
      *   To avoid "quietly assuming principles," the procedure must explicitly state: "Rules are proxies for community health, not ends in themselves."
      *   It needs a "Red Flag" step: "Is there something unique about this situation that makes the standard rule feel wrong?"

  5.  **Running the Cases:**

      *   *Case 1: The Technical Truth-Teller (Poisonous Pedant).*
          *   Features: Truthful, defensible, thread degradation.
          *   Default Rule: "Don't lie" (Good). "Don't derail" (Bad).
          *   Particularist Twist: Truth is usually good, but here it counts as a weapon.
          *   Verdict: Warn/Remove. Reason: Impact > Intent/Technicality.

      *   *Case 2: Context Shift (Fine then, not fine now).*
          *   Features: Same behavior, different thread/time.
          *   Default Rule: Consistency (Good).
          *   Particularist Twist: Context changes valence. Joking in "Off-Topic" vs. "Serious Discussion."
          *   Verdict: Action required now, despite past permission. Explain the context shift to the user.

      *   *Case 3: The Unpleasant Verdict (The "Sympathetic" Violator).*
          *   Need a case where the procedure says "Ban" but the mod wants to be kind.
          *   Scenario: A beloved veteran user who is slowly becoming toxic/burnt out. Their presence drags the tone down, even if they aren't "breaking rules."
          *   Procedure Output: Remove/Ban (to protect the thread health).
          *   Mod Feeling: Reluctance (loyalty/gratitude).
          *   *Why this fits:* It shows the procedure biting the hand that feeds.

  6.  **Meta-Analysis (What the Procedure Cannot Do):**
      *   It cannot eliminate judgment. It structures judgment, it doesn't replace it.
      *   It cannot guarantee consistency (particularism admits inconsistency might be virtuous if contexts differ).
      *   It cannot solve the "Hard Problem" of community values (what is "worse"?).
      *   It is a crutch, not a leg. Acknowledge this.

  7.  **Tone and Style:**
      *   Rationalist-adjacent: Precise, analytical, acknowledging uncertainty, avoiding dogmatism.
      *   Respectful of the user's intelligence.
      *   Direct and actionable.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too slow?
      *   *Fix:* Emphasize that for 90% of cases, the "Valence Check" is instantaneous. The "Defeater Search" is only for the tricky 10%.
      *   *Critique:* Does it really respect particularism?
      *   *Fix:* Ensure the language emphasizes *reasons* over *rules*. Use terms like "default valence" and "contextual defeaters."
      *   *Critique:* Is the "Unpleasant Verdict" actually unpleasant?
      *   *Fix:* Make sure it's a case where the mod's personal bias (loyalty) conflicts with the community good (health), forcing a hard choice.

  9.  **Final Polish:** Check against all constraints in the prompt. (Decision procedure? Yes. Three cases? Yes. Limitations? Yes. Particularist integrity? Yes.)

  *(Self-Correction on Case 3)*: I need to make sure Case 3 is one where the *procedure* returns a verdict the *mod* dislikes. If the mod is a particularist, they might dislike *any* rigid verdict. But the prompt implies a conflict between the procedure's output and the mod's gut desire. A "Beloved Toxic Veteran" is a classic mod dilemma. The procedure says "protect the garden," the mod says "but they planted the seeds."

  10. **Final Output Generation** (incorporating the above thoughts).
answer: |-
  This is a genuine engineering problem: how to build a tool that acknowledges its own incompleteness without becoming useless. You are asking for a *heuristic engine* rather than a *logic gate*.

  Standard moderation policies are deontological (rule-based). You are asking for a consequentialist-particularist interface. The goal is not to determine if a rule was broken, but to determine if a *reason for action* exists in this specific context, acknowledging that the same feature (e.g., "aggressive tone") can be a reason to ban in one thread and a reason to praise in another (e.g., "vigorous debate").

  Here is the **Defeasible Reasoning Protocol (DRP)**.

  ### Part 1: The Decision Procedure

  This procedure is designed to be run in under 3 minutes. It does not output "Guilty/Innocent." It outputs "Intervene/Do Not Intervene" based on the *net valence* of features in the current context.

  **Phase 1: Feature Extraction (Fact)**
  *Identify the raw features of the post/incident. Do not assign value yet.*
  1.  **What happened?** (e.g., "User A called User B an idiot," "User A posted a link," "User A repeated a point 5 times.")
  2.  **What is the immediate context?** (e.g., "Heated political thread," "Off-topic humor thread," "Support request.")
  3.  **What is the user's history?** (e.g., "New account," "Veteran," "Previously warned for this.")

  *Termination:* If no features are present that typically trigger moderation attention, **STOP. No Action.**

  **Phase 2: Default Valence Assignment (Heuristic)**
  *Assign the standard "community weight" to these features. This is where your existing rules live, but they are treated as presumptions, not laws.*
  1.  **For each feature, what is its default valence?**
      *   *Example:* "Calling someone an idiot" → Default: Negative (Reason to Warn).
      *   *Example:* "Posting a link" → Default: Neutral/Positive.
      *   *Example:* "Repeating a point" → Default: Negative (Spam/Derail).
  2.  **Is the net default valence clearly positive or neutral?**
      *   *Termination:* If yes, **STOP. No Action.** (Presumption of liberty).

  **Phase 3: The Defeater Search (Particularist Check)**
  *This is the critical step. You are looking for context that flips the valence of the features identified in Phase 2.*
  1.  **Does the context invert the valence?**
      *   *Question:* "In *this* specific thread culture, does this feature function differently?"
      *   *Example:* "Calling someone an idiot" in a close-knit banter thread might be Positive (Bonding).
      *   *Example:* "Posting a link" in a "No Sources, Just Experience" support thread might be Negative (Dismissive).
  2.  **Does the intent/outcome invert the valence?**
      *   *Question:* "Is the technical compliance masking a harmful outcome, or is the technical violation serving a helpful outcome?"
      *   *Example:* Technically true comments that shut down conversation (Negative Outcome).
      *   *Example:* Breaking a formatting rule to highlight an urgent safety warning (Positive Outcome).
  3.  **Are there conflicting reasons?**
      *   *Question:* "Does protecting User A harm the Thread, or does protecting the Thread harm User A?"

  *Handoff Point:* If you find a strong defeater that contradicts the Default Valence, **flag this as a Value Judgment.** The procedure cannot resolve this; it only highlights the conflict. You must weigh the competing goods (e.g., Consistency vs. Contextual Health).

  **Phase 4: Holistic Weighing (Decision)**
  *Do not sum the points. Assess the gestalt.*
  1.  **All things considered, does this instance degrade the specific community function of this thread?**
      *   If **Yes**: **Intervene** (Remove/Warn/Ban).
      *   If **No**: **Do Not Intervene**.
  2.  **If Intervening, what is the minimum viable action?**
      *   Particularism prefers specific solutions to general punishments.
      *   *Option A:* Remove post, keep user.
      *   *Option B:* Warn user, keep post.
      *   *Option C:* Ban user (only if the feature is the *user*, not the post).

  **Phase 5: Post-Hoc Rationalization (Accountability)**
  *Since you have no overseer, you must generate the audit trail.*
  1.  **Write one sentence:** "I acted because [Feature X] counted as [Negative] here due to [Context Y], despite [Rule Z]."
  2.  **Send to Co-mod.**

  ---

  ### Part 2: Running the Cases

  #### Case 1: The Poisonous Pedant
  **Scenario:** A user posts comments that are factually accurate and technically adhere to civility rules, but the thread consistently devolves into defensiveness and silence after they participate.
  *   **Phase 1 (Features):** Factually true statements; Civil tone; High reply count (mostly defensive); Thread activity drops post-engagement.
  *   **Phase 2 (Default Valence):** Truth = Positive. Civility = Positive. High engagement = Positive. **Default: No Action.**
  *   **Phase 3 (Defeater Search):**
      *   *Context Inversion:* Does "truth" function differently here? Yes. In a support/discussion community, *utility* is the metric, not *accuracy*. If accuracy destroys utility, the valence flips.
      *   *Outcome:* The feature "technically true" is functioning as a conversation-stopper (Negative).
  *   **Phase 4 (Weighing):** The community function (discussion) is being degraded. The "truth" feature is overridden by the "health" feature.
  *   **Phase 5 (Decision):** **Intervene.** Remove the comments.
  *   **Rationalization:** "Removed because accurate content was functioning as thread-derailment in this context."

  #### Case 2: The Context Shift
  **Scenario:** A user makes a specific type of edgy joke. Last month, in "The Lounge," this was upvoted and praised. Today, in "Serious Help," they make the same joke.
  *   **Phase 1 (Features):** Edgy joke; Same user; Same wording as previous approved instance.
  *   **Phase 2 (Default Valence):** Consistency = Positive. Precedent = Positive. **Default: No Action.**
  *   **Phase 3 (Defeater Search):**
      *   *Context Inversion:* Does the location change the feature? Yes. "The Lounge" signals play; "Serious Help" signals vulnerability.
      *   *Valence Flip:* The joke changes from "Bonding" (Positive) to "Dismissive of pain" (Negative).
  *   **Phase 4 (Weighing):** The feature (the joke) has changed its moral weight because the background conditions changed. Consistency is a secondary virtue to contextual appropriateness.
  *   **Phase 5 (Decision):** **Intervene.** Remove post, send PM explaining the context shift.
  *   **Rationalization:** "Removed because the same speech act counts as hostile in this thread, despite being permissible elsewhere."

  #### Case 3: The Unpleasant Verdict (The Beloved Veteran)
  **Scenario:** A founding member of the community is burnt out. They are not breaking rules, but their cynicism is infecting new users. New users are leaving or adopting the cynical tone. The veteran feels unappreciated.
  *   **Phase 1 (Features):** No rule breaks; High status user; Negative tonal shift in thread; New user attrition.
  *   **Phase 2 (Default Valence):** Loyalty/Gratitude = Positive. No Rule Break = Positive. **Default: No Action.**
  *   **Phase 3 (Defeater Search):**
      *   *Outcome Check:* Is the community health degrading? Yes.
      *   *Conflict:* Protecting the Veteran (Gratitude) vs. Protecting the Garden (Health).
      *   *Defeater:* The "No Rule Break" feature is defeated by the "Culture Setting" feature. Veterans set the weather; if the weather is toxic, the rulebook is insufficient.
  *   **Phase 4 (Weighing):** This is the Value Judgment handoff. The procedure highlights that you must choose between *Person* and *System*.
      *   *Procedure Recommendation:* If the goal is community longevity, the System usually outweighs the Person in the long run.
  *   **Phase 5 (Decision):** **Intervene.** Issue a temporary ban or "cooling off" period.
  *   **Rationalization:** "Temporary ban to reset thread tone; user's status amplifies negative impact despite technical compliance."
  *   **Why you will dislike this:** It feels ungrateful. It punishes *impact* rather than *intent*. It treats a human being as a variable in a system. Particularism acknowledges this pain, but the procedure forces you to acknowledge the consequence.

  ---

  ### Part 3: What This Procedure Cannot Do

  You asked for honesty about the lossy compression. Here is where the DRP fails, and where you must stop pretending it is anything more than a crutch.

  **1. It Cannot Resolve Incommensurable Values**
  In Case 3 (The Veteran), the procedure identifies the conflict (Loyalty vs. Health) but cannot solve it. It relies on *your* hierarchy of values. If you value loyalty more than growth, the procedure will feel "wrong" to you. Particularism says there is no algorithm to weigh "gratitude" against "utility." The procedure forces you to look at the scale, but you still have to put the weights on it.

  **2. It Cannot Guarantee Consistency (And Shouldn't)**
  If you run this procedure on two identical-looking posts in different threads, it may give different verdicts. To an outside observer (or a user appealing a ban), this looks like arbitrariness or bias. The procedure cannot generate a public justification that satisfies a *principled* demand for consistency, because it admits consistency is not always virtuous. You will be accused of unfairness when you are actually being particularist. You cannot defend this fully without explaining moral philosophy to an angry user.

  **3. It Cannot Detect "Slow Poison"**
  The procedure is event-based (a post, a thread). It is bad at detecting slow drifts in culture unless you manually step back and assess the "Phase 4 Weighing" at a macro level. A user can game this by keeping every individual action below the threshold of intervention, while the aggregate effect is toxic. The procedure requires you to occasionally ignore the specific case and judge the *pattern*, which violates the "case-by-case" nature of the tool.

  **4. It Requires Moral Competence to Run**
  This is the biggest limitation. A decision procedure usually exists to compensate for a lack of judgment. This procedure *requires* judgment to operate. Phase 3 (Defeater Search) asks you to intuitively grasp the "moral texture" of a thread. If you are tired, biased, or socially tone-deaf, the procedure will not save you. It will simply formalize your bias. It is a lens, not a brain.

  **5. It Cannot Eliminate Regret**
  Particularism implies that sometimes there is no "right" answer, only a "least wrong" one. In Case 3, you will hurt a friend to save the community. The procedure validates the choice, but it does not remove the moral residue. You will still feel guilty. Do not use the procedure to absolve yourself of that guilt. The guilt is the data point that tells you the decision was costly.

  ### Final Advice
  Use the DRP to structure your thinking, not to outsource it. When the procedure says "Intervene" but your gut screams "No," do not assume the gut is wrong. That friction is often where the particularist truth lives—in the exception the checklist couldn't codify.

  Log those frictions. Review them monthly. That review log is the only "principle" you actually need.
