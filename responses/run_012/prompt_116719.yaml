answer: |-
  It is a profound experience to step back from a lifetime of technical practice and view it through the lens of moral philosophy. The 'strangeness' you perceive is not an illusion; it is the friction generated by a regulatory framework that attempts to synthesise incompatible ethical traditions without explicitly acknowledging the tension. The system of radiation protection is not a pure application of one philosophical theory. Rather, it is a pragmatic bricolage that seeks reflective equilibrium between competing moral intuitions.

  Below is an analysis of what the practice strictly presupposes, where it is underdetermined, and where it harbours internal inconsistencies.

  ### 1. The Ethical Hybrid: Consequentialism and Deontology
  You ask whether the practice commits us to a deontological prohibition or a consequentialist aversion to catastrophe. The strict answer is that it presupposes **neither exclusively**, but rather operates on a **constrained consequentialism**.

  *   **The Consequentialist Core:** The Linear No-Threshold (LNT) model, when used to calculate collective dose and justify ALARA (As Low As Reasonably Achievable), is fundamentally utilitarian. It assumes that risk is a 'bad' that can be aggregated, traded, and minimised. The 'Reasonably Achievable' clause explicitly introduces economic and social factors into the calculation, which is the hallmark of cost-benefit analysis.
  *   **The Deontological Constraint:** However, the existence of hard dose limits (e.g., 1 mSv/year for the public) acts as a side-constraint. A pure consequentialist would allow a higher dose if the aggregate benefit were sufficiently large. The limit suggests a deontological boundary: there is a point at which an individual's exposure becomes impermissible regardless of the social utility.

  **Strict Presupposition:** The practice presupposes that risk imposition is a *prima facie* wrong that requires justification (deontological), but that the *degree* of justification is determined by optimisation of outcomes (consequentialist).

  **Underdetermination:** This hybrid status explains the policy divergence between Germany and France. The technical rules (ICRP recommendations) provide the constraints (the deontological boundary), but they do not determine the national energy strategy (the consequentialist calculation). Germany decided the residual risk violated the constraint or that the costs of meeting ALARA were too high relative to the benefit; France calculated the converse. The radiation protection framework is philosophically underdetermined regarding the *necessity* of the technology itself; it only governs its *conduct*.

  ### 2. Imposed Risk vs. Suffered Risk
  You question whether treating natural background as a baseline presupposes a morally fundamental line between risk imposed and risk merely suffered.

  **Strict Presupposition:** Yes. The regulatory framework strictly presupposes the **moral relevance of agency**. By regulating artificial increments while ignoring natural variations (even when the latter are higher), the system asserts that we are responsible for what we *do*, not necessarily for what we *allow to happen*. This aligns with the 'acts vs. omissions' doctrine in ethics.

  **Can the line bear the weight?** Philosophically, this is contentious. If a cancer death is equally tragic regardless of its source, the distinction rests solely on the legitimacy of the authority imposing the risk. The practice assumes that democratic licensing confers legitimacy on artificial risk that nature does not possess. However, this line is fragile. If one adopts a 'victim-centred' ethics, the source of the radiation is irrelevant; only the harm matters. The current practice quietly excludes this victim-centred view. It assumes that consent (via political representation) transforms the moral quality of the risk.

  ### 3. Future Generations and Epistemic Hubris
  The requirement to demonstrate safety for up to a million years is perhaps the most philosophically loaded aspect of the practice.

  **Strict Presupposition:** This presupposes **strong intergenerational equity**. It assumes that distant future persons have claims upon us nearly as strong as those of our contemporaries. It rejects the standard economic practice of discounting the future. If we discounted future lives at even a small rate, a million-year safety case would be economically irrational.

  **Epistemic Claim:** More problematically, it presupposes that we can know enough about the future to specify what we owe them. This is a claim of **moral realism** combined with **epistemic confidence**. It assumes that 'safety' is a trans-historical good—that future beings will value biological integrity in the same way we do, and that their circumstances (geological, political, social) can be modelled sufficiently to ensure that integrity.

  **Inconsistency:** Here lies a tension. We refuse to assume a threshold for radiation damage because we claim insufficient knowledge of low-dose biology (precaution), yet we assume sufficient knowledge of geology and sociology to guarantee containment for a million years (confidence). The practice is more confident in the stability of rock over a million years than in the human body's response to a millisievert.

  ### 4. The Collective Dose Paradox
  Your intuition regarding collective dose is correct; this is the site of the system's sharpest internal inconsistency.

  **The Inconsistency:**
  1.  **Individual Limits:** These protect the individual as a rights-bearer. They say, "You may not be exposed beyond X, regardless of the benefit to others." This is deontological.
  2.  **Collective Dose:** This aggregates tiny, individually trivial risks into a 'number of deaths'. This treats individuals as vessels of utility. It implies that a million people receiving a trivial dose is morally equivalent to one person receiving a lethal dose.

  **Philosophical Conflict:** If the dose limit and ALARA protect the individual from being sacrificed for the greater good, then summing doses to justify expenditure implies the individual *can* be sacrificed for the greater good (by reducing the aggregate sum).
  *   **Strict Presupposition:** The use of collective dose in optimisation presupposes that risk is a fungible commodity.
  *   **Excluded Account:** This excludes a strict **rights-based account** (in the Kantian sense), where an individual cannot be used merely as a means to reduce aggregate statistical risk. The ICRP itself now advises against using collective dose for epidemiological prediction at very low doses, precisely because of this philosophical incoherence, yet the regulatory practice often continues to use it for comparative assessments.

  ### 5. Counterfactuals: How Practice Would Change
  If we were to replace the current hybrid view with a consistent alternative, the regulatory landscape would shift dramatically.

  **A. Plain Cost-Benefit Analysis (Utilitarian)**
  *   **Philosophy:** Maximise net welfare. No intrinsic wrong in risk imposition, only in net negative outcomes.
  *   **Regulatory Change:**
      *   **LNT Abandonment:** If evidence suggested a threshold, it would be adopted immediately to save costs.
      *   **Higher Limits:** Dose limits would be set where the marginal cost of reduction equals the monetary value of the statistical life saved (VSL), likely resulting in higher permissible exposures.
      *   **No Million-Year Case:** Future harms would be heavily discounted. A repository need only be safe for a few hundred years; beyond that, the discounted risk is negligible.
      *   **Collective Dose:** Would become the primary metric, not a secondary optimisation tool.

  **B. Strict Rights-Based Approach (Deontological)**
  *   **Philosophy:** Individuals have a right to bodily integrity that cannot be violated without explicit consent. Risk imposition without consent is a rights violation.
  *   **Regulatory Change:**
      *   **Prohibition:** Most civil nuclear activities would likely be illegal. You cannot obtain explicit consent from every member of the public exposed to routine gaseous effluents.
      *   **ALARA Elimination:** 'Reasonably Achievable' implies trade-offs are permissible. A rights view might demand 'As Low As Technically Possible' regardless of cost, or simply ban the activity.
      *   **Waste:** A million-year guarantee might be deemed impossible (violating the rights of the future), leading to a ban on waste generation (i.e., a ban on nuclear power) rather than a technical fix.

  ### 6. Conclusion: The Source of the Strangeness
  The strangeness you feel arises because the radiation protection regime attempts to solve a political problem with a technical formula. It tries to quantify the unquantifiable (the value of a statistical life, the rights of the unborn) to make them manageable for bureaucrats.

  It strictly presupposes that **risk is a manageable object** that can be sliced, summed, and traded, while simultaneously presupposing that **risk is a moral violation** that must be bounded. It fits a precautionary principle regarding biology (LNT) but a confident rationalism regarding geology (repositories).

  The system is not philosophically innocent. It is a utilitarian engine housed in a deontological casing. It works, in a practical sense, because the tensions are managed by professional judgement and regulatory discretion. But viewed from the standpoint of moral philosophy, it is indeed a house built on fault lines. Your retirement reading has not misled you; the institutional world is strange because it is trying to be two different moral worlds at once.
