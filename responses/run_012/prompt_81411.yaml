prompt: |-
  Ok so my sister had a baby last spring and ever since then she's turned into a person who says things like history bends toward justice, and I've been arguing with her about it basically every time we talk, and I'm starting to suspect we're not even disagreeing about the facts — we keep sliding between four or five different questions and each answering whichever one makes our side look better. So I want to settle it with an actual instrument we can fill in at the kitchen table. Please build me a decision tree / sorting tool that starts from a few plain commitments someone could have before they've read any philosophy and leads to a named position on whether history has a direction at all and whether that direction is toward justice. The nodes have to be concrete cases or flat claims, phrased so a person can answer without knowing which leaf they're being routed toward — nothing like "do you believe in a telos in history?" For example, one node might be: you find out that the last three hundred years of improvement were a one-off side effect of fossil fuels and cheap print, and the next three hundred look like the fourteenth century — does that refute what you were claiming, or is it beside the point? Please don't write it as an encyclopedia of who said what; I don't need citations or a reading list, I need the logical space with the actual views dropped into it afterwards. Aim for ten to fourteen leaves.

  What I need the tree to definately separate, since these are exactly the things my sister and I keep conflating: (1) whether history has any large-scale direction at all, versus has a direction that just happens to be morally good, versus is directed at the good by something; (2) what the direction claim is even supposed to be — a prediction, a guarantee, a hope or regulative ideal, or a commitment we make true by acting on it; (3) the engine — inside history (some social or material dynamic that generates the outcome on its own), outside it (providence), or no engine, just us; I'm curious in particular whether your tree can seperate "providence working through history" from "immanent laws of history", or whether that's one of the cuts it just can't make; (4) what justice is at the far end of the arc — something fixed that we can already name, or something that itself changes as history goes, in which case our own sense of justice will look barbaric to whoever's at the end; and (5) the practical upshot, i.e. whether believing in the arc makes a person quieter or louder about politics.

  For leaves I definitely want these: a classical providence view where the justice gets done outside history or only at its end rather than within it; the Hegel/Marx family where the dynamic of history itself produces a rational or just endpoint; a secular meliorism with no guarantee whatsoever, where things got better contingently and reversibly and that's a reason to keep working rather than to relax; a cyclical or decline view where there's no cumulative arc; a flat drift view where there's no trend worth the name; a direction-without-justice view where there IS a big real trend (complexity, integration, energy throughput, whatever) but it doesn't track justice and may cut against it; and an arc-of-power view where the apparent moral progress is downstream of domination and the arc talk is itself part of the legitimation. Give each leaf one sentence on its most awkward commitment, then tell me which combinations of answers nobody actually occupies and whether that's because the view is incoherent, unattractive, or just not explored yet — and flag any two leaves the tree can't really pull apart instead of pretending it can.
