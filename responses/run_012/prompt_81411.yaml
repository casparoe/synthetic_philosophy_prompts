answer: |-
  # The Kitchen Table History Sorter

  This tool is designed to be read aloud. One person reads the **Node**, both answer it, and follow the arrow. Do not look ahead at the **Leaves** until you reach the end. The questions are phrased to avoid philosophical jargon; they rely on intuitions about cause, time, and responsibility.

  ### Node 1: The Reversal Test
  **Look at the last three hundred years of reduced violence, longer life, and expanded rights. Suppose you find out this was a one-off side effect of cheap fossil fuels and print media, and the next three hundred years look like the fourteenth century (famine, empire, silence).**
  *   **A:** Then the "arc" was an illusion. My claim was refuted. → *Go to Node 2*
  *   **B:** That would be tragic, but it wouldn't prove the arc wasn't real up until then. Progress is fragile. → *Go to Node 3*
  *   **C:** That is impossible. The trend is robust; it might stutter, but it cannot fundamentally reverse. → *Go to Node 4*

  ### Node 2: The Shape of Noise (For those who said "Illusion")
  **If there is no moral arc, is history just random static, or does it have a shape that simply isn't moral?**
  *   **A:** It's mostly random static. Patterns are things we project backward to feel safe. → **Leaf 1**
  *   **B:** It has a shape (cycles of rise and fall, or increasing complexity), but "justice" isn't the metric. → **Leaf 2**
  *   **C:** It has a shape, and that shape is domination. "Justice" is just the story the winners tell to keep the losers quiet. → **Leaf 3**

  ### Node 3: The Engine of Fragility (For those who said "Fragile")
  **If progress is real but reversible, what keeps it going?**
  *   **A:** Just us. There is no guarantee. If we stop working, it stops. → **Leaf 4**
  *   **B:** It's a bet we have to make. We act *as if* the arc is real because that's the only way to make it real. → **Leaf 5**
  *   **C:** Systems and technology improve automatically, even if human morality doesn't. → **Leaf 6**

  ### Node 4: The Source of Guarantee (For those who said "Robust")
  **You believe the trend is real and resistant to reversal. If every human being became cynical and stopped trying to be good tomorrow, would the improvement continue anyway?**
  *   **A:** No. The "guarantee" is actually just the sum of millions of people refusing to give up. → **Leaf 7**
  *   **B:** Yes. Something non-human is driving it. → *Go to Node 5*

  ### Node 5: The Location of Resolution (For those who said "Non-human Engine")
  **This non-human engine is bending things toward justice. Does the score get settled *inside* human political time, or *outside* it?**
  *   **A:** Inside. History itself is the courtroom. Contradictions resolve here, in society. → **Leaf 8**
  *   **B:** Outside. History is the testing ground, but the justice is delivered at the end of time or beyond death. → **Leaf 9**
  *   **C:** Inside, but it requires a violent break. The arc doesn't bend; it snaps. → **Leaf 10**

  ### Node 6: The Definition of Justice (For Leaves 7, 8, 9)
  **Think of the "justice" at the end of the arc. If people in the year 3000 look back at our current best ideas about fairness and call them barbaric, are they wrong?**
  *   **A:** Yes. Justice is a fixed target we are slowly hitting. → *Keep current Leaf*
  *   **B:** No. Justice itself evolves. The arc bends toward a target we cannot yet name. → *Modify Leaf to "Evolving"*

  ---

  ## The Leaves (Positions)

  **Leaf 1: Flat Drift**
  *   **Position:** History has no cumulative direction; it is a random walk of events.
  *   **Most Awkward Commitment:** You have to explain why the last 200 years look so different from the previous 2,000 without calling it a trend.

  **Leaf 2: Direction Without Justice**
  *   **Position:** History moves toward greater complexity, energy use, or integration, but this is morally neutral.
  *   **Most Awkward Commitment:** You must admit that a hyper-efficient totalitarian world government could be the "peak" of history.

  **Leaf 3: Arc of Power**
  *   **Position:** The apparent moral progress is downstream of domination; "justice" talk is legitimation for the current hegemon.
  *   **Most Awkward Commitment:** You cannot consistently advocate for reform without sounding like you are helping the oppressor manage their image.

  **Leaf 4: Secular Meliorism**
  *   **Position:** Things got better contingently and reversibly; that is a reason to keep working rather than to relax.
  *   **Most Awkward Commitment:** You have no comfort to offer when things get worse; you must tell suffering people it was always possible it would go this way.

  **Leaf 5: Pragmatist Wager**
  *   **Position:** The arc is not a fact but a commitment we make true by acting on it (James/Dewey style).
  *   **Most Awkward Commitment:** If the movement fails, you must admit the arc never existed, even if you believed in it sincerely.

  **Leaf 6: Technocratic Optimism**
  *   **Position:** Systems solve problems (hunger, disease) automatically, even if human souls do not improve.
  *   **Most Awkward Commitment:** You must accept that a happy, well-fed slave population counts as "progress."

  **Leaf 7: Humanist Guarantor**
  *   **Position:** The trend is robust, but only because human nature is more stubbornly cooperative than cynics admit.
  *   **Most Awkward Commitment:** You are essentially betting on a specific view of biology/psychology that could be disproven by a single generation of atrocity.

  **Leaf 8: Immanent Rationality (Hegel/Marx)**
  *   **Position:** The dynamic of history itself (conflict, labor, spirit) produces a rational endpoint within time.
  *   **Most Awkward Commitment:** You must find some "reason" or "necessity" in past atrocities, viewing them as fuel for the engine rather than pure errors.

  **Leaf 9: Classical Providence**
  *   **Position:** God ensures justice gets done, but likely outside history or only at its very end (Eschatology).
  *   **Most Awkward Commitment:** You cannot point to any specific political victory as proof of God's will, only as a sign of it.

  **Leaf 10: Apocalyptic Break**
  *   **Position:** History does not bend; it accumulates pressure until the system shatters and justice is installed by rupture.
  *   **Most Awkward Commitment:** You must view gradual reform not just as slow, but as an obstacle that delays the necessary break.

  **Leaf 11: Evolving Justice (Modified Leaf 8)**
  *   **Position:** History produces higher forms of freedom, but our current definition of "free" will look barbaric to the future.
  *   **Most Awkward Commitment:** You cannot fully articulate your own goal; you are working for a master you cannot describe.

  **Leaf 12: Tragic Realism (Modified Leaf 4)**
  *   **Position:** Progress is real but bought with blood; every gain creates a new shadow (Benjamin/Adorno).
  *   **Most Awkward Commitment:** You cannot celebrate a victory without simultaneously mourning the cost that made it possible.

  ---

  ## Analysis of the Logical Space

  ### Empty Combinations (Views Nobody Occupies)
  1.  **Guaranteed + Human Engine:** This is logically incoherent. If humans guarantee it, it depends on human will, which is fallible, making it contingent (Leaf 4), not guaranteed (Leaf 8/9). People claim this, but they slide into "Humanist Guarantor" (Leaf 7) which is a bet on nature, not a guarantee.
  2.  **Direction Without Justice + Activist Upshot:** If history trends toward complexity but *not* justice, there is no logical reason to work for justice specifically. You might work for efficiency, but not morality. This view usually collapses into Leaf 3 (Power) or Leaf 2 (Drift).
  3.  **Providence + Fixed Political Blueprint:** If justice is delivered by God outside history, claiming to know the exact political system that matches God's will is presumptuous. This combination exists (Theocracy), but it is unstable; it usually forces the believer to move the "Resolution" from Outside to Inside (Leaf 9 → Leaf 8).

  ### Indistinguishable Leaves (The Tree's Blind Spots)
  **Leaf 8 (Immanent Rationality) and Leaf 9 (Classical Providence).**
  *   **Why they blur:** In practice, these look identical. Both claim history is going somewhere good regardless of individual setbacks. Both require faith.
  *   **The Cut:** The tree tries to separate them at Node 5 (Inside vs. Outside Resolution). However, a Hegelian (Leaf 8) often speaks of the "End of History" in quasi-religious terms, and a Christian (Leaf 9) often claims to see God's hand in current political shifts.
  *   **Verdict:** The tree cannot reliably pull these apart because the *phenomenology* of the belief is the same: "Suffering is not final." The only difference is the metaphysical label on the engine, which doesn't change how the person votes or argues at the kitchen table.

  ### The "Sister vs. You" Diagnostic
  *   **If your sister lands on Leaf 5 (Wager) or Leaf 4 (Meliorism):** She is using the quote as a motivational tool, not a physics claim. You are arguing about facts; she is talking about endurance.
  *   **If you land on Leaf 3 (Power) or Leaf 1 (Drift):** You are treating the quote as a scientific hypothesis that has been falsified.
  *   **The Conflict:** You are likely fighting because you are at **Node 1** (Is the trend robust?) while she is already at **Node 3** (What do we do given fragility?). The tree shows these are compatible: You can agree progress is fragile (Node 3) but disagree on whether that makes the arc a lie (Node 1).
