      *Self-Correction on (1):* (1) says "summed." If I hold (4), I am not summing severe suffering against mild goods. I am vetoing. So (1) is technically inaccurate if (4) is true. I should flag this as a definition issue. (1) needs to read "aggregated" not "summed."

      *Self-Correction on (6):* QALYs usually treat a QALY as a QALY. If (4) is true, a QALY gained by someone avoiding severe suffering is worth more than a QALY gained by someone moving from mild to moderate. So (6) is the outlier.

