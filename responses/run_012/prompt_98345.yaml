answer: |-
  This is a sophisticated summary of a well-known philosophical puzzle, often associated with Walter Sinnott-Armstrong's *It's Not My Fault* or early discussions in the Effective Altruism community. However, your friend's summary relies on a specific, contested causal model and conflates several distinct ethical arguments.

  Here is an audit of the claims, distinguishing between what philosophers working on collective harm accept, what is a simplification, and what is incorrect.

  ### 1. The Causal Model: "Expected harm... is zero"
  **Claim:** *"Since my emissions, my meat consumption, or my single vote never changes the outcome, the expected harm of any one of these acts is zero."*

  *   **Verdict:** **Simply Wrong (Empirically and Mathematically).**
  *   **The Audit:** This claim relies on a **deterministic threshold model**. It assumes harms occur only when a specific, discrete number is reached (e.g., exactly 1,000,001 burgers sold triggers one extra chicken being killed), and that you can know you aren't the threshold-crosser.
  *   **Expert Consensus:** Philosophers like Julia Nefsky and Mark Budolfson have shown this model is false for most markets and voting.
      *   **Probabilistic Triggering:** Supply chains do not wait for a threshold to order more stock; they order based on marginal demand signals. If you buy a chicken, there is a non-zero probability that your purchase contributes to a reorder batch. Even if the probability is small (e.g., 1/10,000), if the harm is large (10,000 chickens), the **Expected Value (EV)** is 1 chicken. $EV = P \times Impact$. If $P > 0$, $EV \neq 0$.
      *   **The Voting Analogy:** While a single vote rarely decides an election, the *expected value* of a vote is the probability of being pivotal multiplied by the value of the outcome. It is rarely zero, just often small.
  *   **What Experts Accept:** Experts accept that individual causal impact is **opaque and probabilistic**, not that it is non-existent. The inefficacy objection holds only in "imperceptible difference" cases (e.g., adding one drop to a bucket), but most collective harms (climate, meat) are aggregative market behaviors where marginal units matter.

  ### 2. The Utilitarian Commitment: "Personal vegetarianism... is pointless"
  **Claim:** *"Utilitarians, who care only about outcomes, are therefore committed to saying that personal vegetarianism or recycling is pointless."*

  *   **Verdict:** **Standard Simplification (that becomes Wrong upon scrutiny).**
  *   **The Audit:** This is true only for a naive **Act Utilitarian** who accepts the false deterministic causal model above.
  *   **The Rebuttal:**
      *   **Expected Act Utilitarianism:** As noted above, if the expected marginal impact is non-zero, a utilitarian *must* account for it. If the cost to you is low and the expected harm prevented is high, utilitarianism demands the action.
      *   **Rule Consequentialism:** A utilitarian can argue that a *rule* ("do not eat meat") produces better outcomes than a rule ("eat meat unless you calculate you are pivotal"), because the calculation is prone to error and bias.
      *   **Signaling and Norms:** Individual actions have second-order effects. Eating meat signals acceptance of the industry, potentially influencing peers (social contagion). A utilitarian must count these downstream causal effects.
  *   **Conclusion:** Utilitarianism is not committed to the pointlessness of personal action; it is committed to the *efficiency* of action. If personal vegetarianism has lower EV than systemic activism, *then* it is subordinate, but not "pointless."

  ### 3. The Deontological Contrast: "It would matter if everyone did it"
  **Claim:** *"Deontologists, who care about universalizability, can at least say that it would matter if everyone did it."*

  *   **Verdict:** **Mostly Accurate.**
  *   **The Audit:** This correctly identifies the strength of Kantian ethics (Categorical Imperative) in collective harm cases. Deontology bypasses the causal problem by focusing on the **maxim of the action**. If the maxim "I will pollute for convenience" cannot be universalized without contradiction, the act is wrong, regardless of whether *my* specific pollution changes the climate outcome.
  *   **Nuance:** Some modern deontologists (e.g., contractualists like T.M. Scanlon) focus on justifiability to others. They would argue that contributing to a harmful system is unjustifiable to those harmed, even if your specific contribution is non-pivotal. So, deontology handles this well, but not solely via the "what if everyone did it" heuristic.

  ### 4. The Virtue Ethics Conclusion: "The only framework that can make sense..."
  **Claim:** *"The real lesson is that virtue ethics is the only framework that can make sense of green lifestyle choices."*

  *   **Verdict:** **Simply Wrong (False Dichotomy).**
  *   **The Audit:** This is the strongest overreach. Virtue Ethics (VE) explains why *you* should act (to cultivate a virtuous character, e.g., temperance, justice), even if the outcome is unaffected. It successfully decouples moral worth from causal efficacy.
  *   **Why it's not the *Only* one:**
      *   As shown above, **Utilitarianism** makes sense of it via Expected Value and signaling.
      *   **Deontology** makes sense of it via Duty and Universalizability.
      *   VE is not the *only* framework; it is the framework that is *least bothered* by the inefficacy objection because it cares least about outcomes. But claiming it is the only one that "makes sense" ignores the probabilistic rebuttals available to consequentialists.

  ### 5. The Systemic vs. Personal Dichotomy
  **Claim:** *"So the only rational response is to work for systemic change; personal guilt about consumption is a category error."*

  *   **Verdict:** **Standard Simplification.**
  *   **The Audit:** This sets up a false trade-off.
      *   **Guilt:** "Guilt" is indeed an emotion, not a moral metric. Feeling guilty about a burger is arguably unproductive. But "moral responsibility" is not a category error.
      *   **Systemic vs. Personal:** These are not mutually exclusive. Personal choices often build the habits, credibility, and social capital necessary for systemic activism. A lobbyist for climate policy who flies on private jets loses credibility. Personal action can be instrumentally rational for achieving systemic change.

  ---

  ### Summary of the Audit

  | Claim | Status | Correction |
  | :--- | :--- | :--- |
  | **Expected harm is zero** | **Wrong** | Markets/voting are probabilistic. Expected harm is $P \times Impact$, which is $>0$. |
  | **Utilitarians say it's pointless** | **Wrong** | Expected Utility and Rule Utilitarianism preserve the obligation. |
  | **Deontology handles it better** | **Accurate** | Universalizability bypasses the causal threshold problem. |
  | **Virtue Ethics is the *only* fit** | **Wrong** | Consequentialism and Deontology also account for it; VE is just less dependent on outcomes. |
  | **Systemic change replaces personal** | **Simplification** | Personal action often supports systemic change (signaling, habit, credibility). |

  ---

  ### What Would Change My Mind? (Uncertainty Calibration)

  To adhere to your request for epistemic humility, here is where my reasoning is most vulnerable and what evidence would shift my verdict.

  **1. Where my reasoning might fail: Market Elasticity**
  My rejection of the "zero expected harm" claim relies on the assumption that supply chains are responsive to marginal demand (elasticity).
  *   **The Failure Mode:** If empirical economic studies showed that consumer demand for specific commodities (like beef or fossil fuels) is perfectly inelastic at the margin due to long-term futures contracts, storage buffers, or government subsidies, then my purchase truly might have a causal probability of exactly zero in the short-to-medium term.
  *   **What would change my mind:** Robust econometric evidence demonstrating that marginal individual consumption of meat/fuel has **zero causal probability** of affecting production volumes over a relevant timeframe (e.g., 5 years). If $P = 0$, the Expected Utility argument collapses, and the friend's critique of Act Utilitarianism becomes valid.

  **2. Where my reasoning might fail: The "Opportunity Cost" Threshold**
  I argue that personal action has non-zero EV. However, Utilitarianism demands *maximizing* EV.
  *   **The Failure Mode:** Even if personal vegetarianism has positive EV, if systemic activism has $1000\times$ the EV per hour, then a strict Utilitarian *is* committed to saying personal lifestyle changes are "pointless" *relative* to the optimal alternative. The friend's claim might be interpreted as "pointless *compared to the best alternative*," not "pointless *in absolute terms*."
  *   **What would change my mind:** A demonstration that the psychological or social costs of maintaining a "green lifestyle" (e.g., time spent, social friction) significantly degrade one's capacity to work for systemic change. If personal purity burns out activists, then the Utilitarian calculus flips, and the friend's advice to focus *only* on systemic change becomes correct.

  **3. The Definition of "Moral Irrelevance"**
  *   **The Failure Mode:** If "moral relevance" is defined strictly as "making a perceptible difference to the outcome" (a specific metaphysical claim), then the friend is tautologically correct.
  *   **What would change my mind:** If I were persuaded that moral responsibility requires **control over the outcome**, not just participation in a causal chain. If one adopts a "control principle" (you are only responsible for what you control), and I cannot control the collective outcome, then my individual contribution is morally irrelevant regardless of expected value. This would require accepting a non-consequentialist theory of responsibility that overrides the Expected Utility calculation.

  **Final Verdict:**
  Your friend's summary is a rhetorically effective but philosophically outdated take. It treats the "inefficacy objection" as a solved problem that defeats consequentialism, whereas contemporary ethics treats it as a solvable puzzle regarding probabilistic causation. Virtue Ethics is *a* solution, but not the *only* one. The strongest remaining argument for your friend is not that individual acts have zero impact, but that their impact is so small that **opportunity costs** dictate focusing on systemic leverage instead. That is a pragmatic claim, not a metaphysical one.
