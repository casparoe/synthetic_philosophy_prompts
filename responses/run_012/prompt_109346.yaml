  # JOINT STATEMENT ON THE EPISTEMIC AND NORMATIVE STATUS OF BACKWARD INDUCTION IN THE CENTIPEDE GAME

  **Signatories:**  
  **Dr. A (Orthodox Backward-Induction Theorist)**  
  **Dr. B (Epistemic Critic)**

  **Date:** October 26, 2023

  ### 1. Agreed Foundations
  We agree on the formal structure of the Centipede Game: it is a finite extensive-form game with perfect information, alternating moves, and strictly increasing payoffs for continuing play, terminating in a forced Take at the final node. We agree that Backward Induction (BI) identifies a unique Subgame Perfect Equilibrium (SPE) wherein the first player Takes immediately. We further agree on the empirical regularity: in laboratory settings, even with financially significant stakes, subjects frequently Pass at early nodes, and the frequency of Take increases only as the end of the game approaches. We agree that standard BI theory, interpreted as a psychological model of human decision-making, fails to predict observed behavior in one-shot anonymous interactions.

  ### 2. Residual Disagreements
  Despite the above agreements, we maintain incompatible positions regarding the logical validity and normative authority of the BI solution.

  **On the Normative Authority of BI:**  
  **Dr. A:** The BI solution prescribes the only rational choice. A player who Passes at the first node violates the axioms of instrumental rationality, regardless of empirical frequency. To Pass is to make an error in reasoning.  
  **Dr. B:** The BI solution fails as a normative prescription because the epistemic conditions required to derive it are inconsistent with the play it predicts. A rational agent cannot simultaneously hold the beliefs required to justify BI and observe the move required to reach a node where BI is applied. To Pass is not necessarily an error; it may be a rational response to epistemic uncertainty.

  **On Counterfactual Truth-Values:**  
  **Dr. A:** Counterfactual statements about what a player *would* do at an unreached node have determinate truth-values derived from the assumption of rationality. The fact that a node is unreached does not invalidate the logical deduction of play at that node.  
  **Dr. B:** Counterfactual statements about unreached nodes are undefined or contradictory if reaching the node implies a violation of the premises (Common Knowledge of Rationality) used to solve the node. One cannot assume rationality at a node that could only be reached by irrationality.

  ### 3. Cruxes and Verbal Disputes
  We identify two substantive cruxes and one verbal dispute underlying our divergence.

  **Crux 1: The Function of "Rationality" (Normative vs. Predictive)**  
  We disagree on whether "rationality" functions as a logical constraint on strategy selection independent of belief formation, or as a property of an agent's entire belief-action system.  
  *Relevant Argument:* Aumann's formalization of Common Knowledge of Rationality (CKR) implies BI. Reny's (1988) critique demonstrates that CKR cannot be maintained at off-path information sets.  
  *Predictions:* Dr. A predicts that in a limit case of hyper-rational agents with common knowledge of the model, play converges to Take at Node 1. Dr. B predicts that even with hyper-rational agents, the impossibility of maintaining CKR off-path leads to Pass at Node 1.

  **Crux 2: Counterfactual Stability**  
  We disagree on whether the assumption of rationality is robust to the observation of unexpected moves.  
  *Relevant Argument:* The logical derivation of SPE vs. the logic of belief revision (Bayesian updating).  
  *Predictions:* Dr. A predicts that an unexpected Pass should be treated as a "tremble" (noise) that does not alter the belief in the opponent's underlying rationality. Dr. B predicts that an unexpected Pass must be treated as evidence that the opponent is not a BI-maximizer, altering the optimal response to Pass.

  **Verbal Dispute: Definition of "Rational"**  
  We acknowledge a semantic divergence. Dr. A defines "rational" as *consistency with axiomatic deduction from the game tree*. Dr. B defines "rational" as *coherence between beliefs, observations, and actions*. We agree this is partly verbal, but it maps onto the substantive disagreement regarding whether the game tree alone suffices to determine choice.

  ### 4. Summary of Positions and Evidence

  | Item type | Statement | Side A's position in its own wording | Side B's position in its own wording | Evidence or argument both accept as relevant | Side A's prediction | Side B's prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Agreed Claim** | Game Structure & Equilibrium | The Centipede is a finite perfect-information game; BI yields a unique SPE (Take at Node 1). | The Centipede is a finite perfect-information game; BI yields a unique SPE (Take at Node 1). | Formal definition of extensive-form games; Zermelo's algorithm. | N/A | N/A |
  | **Agreed Claim** | Empirical Data | Subjects systematically deviate from BI in experiments; BI is a poor descriptive model of naive humans. | Subjects systematically deviate from BI in experiments; BI is a poor descriptive model of naive humans. | McKelvey & Palfrey (1992) experimental data. | N/A | N/A |
  | **Disagreement** | Normative Status of BI | BI dictates what a rational agent *ought* to do; deviation is an error. | BI is epistemically incoherent; deviation is not necessarily an error. | Aumann (1995) vs. Reny (1988) on CKR. | Ideal agents Take at Node 1. | Ideal agents Pass at Node 1. |
  | **Disagreement** | Counterfactuals | Unreached nodes have determinate values based on axiomatic rationality. | Unreached nodes lack determinate values if reaching them contradicts rationality assumptions. | Logic of counterfactuals in extensive forms (Stalnaker 1968). | Counterfactuals remain stable. | Counterfactuals collapse upon deviation. |
  | **Crux** | Function of Rationality | Rationality is a logical constraint on strategy selection. | Rationality is a coherence property of belief-action systems. | Aumann's CKR theorem vs. Belief Revision Theory. | Convergence to Take in high-stakes expert play. | Convergence to Pass in high-stakes expert play. |
  | **Crux** | Counterfactual Stability | Rationality assumptions survive unexpected moves (trembles). | Rationality assumptions must update upon unexpected moves (types). | Trembling-hand perfection vs. Sequential Equilibrium. | Unexpected Pass is noise. | Unexpected Pass is information. |
  | **Verbal Dispute** | Definition of "Rational" | "Rational" means consistency with game-theoretic axioms. | "Rational" means coherence of beliefs with observations. | Philosophical literature on instrumental rationality. | N/A | N/A |
