  10. **Final Polish:** Ensure the distinction between "artifact has politics" ( Winner) and "artifact mediates politics" (Verbeek/Ihde) is clear without being academic. The key insight is that the artifact *delegates* morality to matter.

      *(Self-Correction on the "Capitalism" point)*: The user worries it all collapses into "capitalism and power." I need to explain why the *specifics of the code* still matter if capitalism is the root cause. Answer: Because capitalism is opportunistic; it flows through the path of least resistance. If you change the resistance (the code), you change the flow, even if the source (profit motive) remains.

      *(Final Plan)*:
      1.  Validate the "Winner Skepticism."
      2.  Resolve the "Location" fork (Mediation).
      3.  Resolve the "Agency" worry (Delegation).
      4.  Resolve the "Capitalism" worry (Leverage).
      5.  Propose the Project: **The Ethics of Default Trajectories and Friction.**
      6.  Explain why this beats "Do artifacts have politics?"
