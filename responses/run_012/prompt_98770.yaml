answer: |-
  ### Tier 1: Paradigm Instances (95–100)
  *These cases map directly onto Miranda Fricker's original taxonomy of testimonial and hermeneutical injustice, representing the core examples used to define the field.*

  **1. A pain specialist repeatedly discounts a Black woman's reports of chronic pain, treating her as a drug-seeker, and she goes years without adequate treatment.**
  **Rating: 100**
  This is the canonical example of **testimonial injustice**, where identity prejudice (race and gender) causes a credibility deficit in a high-stakes context. It involves a culpable hearer (the specialist) operating within a structural framework of medical bias.

  **2. Before a term for the phenomenon existed, women in a workplace had no shared vocabulary for a set of experiences that were nonetheless systematically damaging to them.**
  **Rating: 98**
  This is the defining case of **hermeneutical injustice**, where a gap in collective interpretive resources, caused by the marginalization of a group, prevents individuals from understanding their own experiences. This is primarily a **structural wrong** rather than the fault of a specific culpable agent.

  **8. A hiring committee passes over a candidate after a referee describes her, in what is meant as praise, as "surprisingly articulate."**
  **Rating: 97**
  This illustrates **testimonial injustice** via a microaggression that reveals a prejudicially low baseline expectation for the candidate's identity group. The injustice lies in the credibility deficit implied by the "surprise," enacted by culpable agents (the referee and committee).

  ### Tier 2: Clear Extensions (88–95)
  *These cases are widely accepted as epistemic injustices in contemporary literature but involve slight expansions of the original framework (e.g., to domestic spheres, linguistic prejudice, or structural/technological systems).*

  **5. A man persistently undermines his partner's confidence in her own memory of events, until she comes to doubt her grasp of what actually happened.**
  **Rating: 95**
  Often analyzed as **gaslighting**, this is a targeted attack on a subject's epistemic confidence and status as a knower, frequently tied to gendered power dynamics. While it requires a culpable agent, it is sometimes distinguished from Fricker's original account by its malicious intent rather than unconscious prejudice.

  **10. A speaker's testimony is accepted almost without scrutiny, and with more weight than the evidence warrants, because she belongs to a dominant group.**
  **Rating: 94**
  This describes **testimonial excess**, the corollary to testimonial injustice that corrupts the hearer's epistemic practice and unfairly advantages the speaker. It requires a culpable hearer whose judgment is skewed by identity prejudice regarding the speaker's social power.

  **7. A student is marked down on an essay for using a grammatical construction that is standard in her home dialect.**
  **Rating: 93**
  This is a form of **testimonial injustice** (or contributory injustice) where linguistic prejudice is conflated with intellectual incompetence. It involves culpable agents (evaluators) enforcing a dominant hermeneutical resource that excludes marginalized dialects.

  **9. A researcher's findings are ignored by her field until a more senior colleague publishes substantially the same results and receives the credit.**
  **Rating: 91**
  Known as the **Matilda Effect**, this is testimonial injustice within professional epistemology, usually driven by gender prejudice regarding intellectual authority. **[Contestable]** Placement depends on whether the exclusion is explicitly identity-based or merely status-based; if the latter, it falls outside strict epistemic injustice.

  **6. A speech-recognition system performs markedly worse on the accents of a minority group, so that the requests of those users are frequently misconstrued by the institutions that deploy the system.**
  **Rating: 89**
  This represents **structural/algorithmic epistemic injustice**, where human prejudices are encoded into technology that mediates epistemic access. **[Contestable]** Some theorists argue non-human systems cannot commit injustice, viewing this as a downstream effect of the designers' culpability rather than a distinct epistemic wrong.

  ### Tier 3: Context-Dependent Instances (75–85)
  *These cases describe epistemic harms that qualify as injustice only if specific conditions regarding identity prejudice are met, which are not fully specified in the prompt.*

  **3. A jury gives more weight to a confident, fluent witness than to a hesitant one who is equally reliable.**
  **Rating: 80**
  This counts as epistemic injustice only if the heuristic linking confidence to reliability tracks **identity prejudice** (e.g., if marginalized groups are socialized to be hesitant). **[Contestable]** Without an explicit link to identity prejudice, this may be classified merely as an epistemic error or bias rather than an injustice.

  ### Tier 4: Peripheral/Contestable Instances (0–50)
  *These cases involve epistemic disadvantages that many analytic epistemologists classify as material or distributive injustices rather than wrongs done specifically in the capacity as a knower.*

  **4. A patient cannot afford the subscription to the journal in which the trial results relevant to her condition are published.**
  **Rating: 45**
  This is primarily a **material/distributive injustice** that has epistemic consequences, rather than a wrong targeting the patient's credibility or hermeneutical resources. **[Contestable]** Some contemporary scholars argue that blocking access to knowledge *is* epistemic injustice, but the standard Frickerian view distinguishes this from credibility/interpretive wrongs.
