answer: |-
  To understand the debate about the norm of assertion, we must first stop asking which single condition—truth, belief, justification, or knowledge—is the "winner." Instead, we should view assertion as a social practice governed by rules, much like a game. In any game, rules serve different functions. Some rules determine whether a move is legal; others determine what happens after the move is made. The debate over assertion is difficult because a rule that works well for one function often fails at the other.

  ### 1. Licensing vs. Underwriting Reliance

  A condition on assertion can play two distinct roles. The first is **licensing**. This is the entry requirement. It answers the question: "Am I permitted to make this move right now?" A licensing condition must be something the speaker can check before they speak. If the rule is "Only assert what is true," a speaker cannot follow it, because they cannot step outside their own mind to verify the truth before speaking. Therefore, truth is a poor licensing condition. Belief or justification are better licensing conditions because a speaker can access their own mind to see if they believe something or have evidence for it.

  The second role is **underwriting reliance**. This is the insurance policy. It answers the question: "If you take me at my word, are you safe?" This condition determines whether the audience is entitled to rely on the assertion and whether the speaker is accountable if things go wrong. Here, truth is an excellent condition. If you rely on an assertion and it is true, your reliance is vindicated. If the assertion is false, your reliance is betrayed. Belief is a poor condition for underwriting reliance. If I sincerely believe the bridge is safe, but I am wrong, your reliance on my word leads to disaster. My sincerity does not protect you.

  These two roles often pull apart in cases of the **Honest Mistake**. Imagine a weather forecaster who checks all the radar data, consults the models, and sincerely believes it will not rain. She asserts, "It will not rain." Based on the evidence, she is *licensed* to speak (she satisfied belief and justification conditions). However, it rains anyway. Her assertion failed to *underwrite reliance*. The audience relied on her and got wet. If the norm of assertion were only about licensing, she did nothing wrong. If the norm is about underwriting reliance, she has failed her audience, even if she was not negligent. This tension explains why no single condition seems to fit every intuition: conditions that ensure I am reasonable (justification) do not ensure I am right (truth), and conditions that ensure I am right (truth) are impossible for me to verify before I speak (licensing).

  ### 2. The Two Test Cases

  To evaluate candidate conditions, we must test them against two specific scenarios that stress the system in opposite ways.

  **Case A: The Honest Mistake (Confident, Well-Evidenced, but False)**
  *   **Truth Condition:** This assertion is defective because it is false. The speaker has wronged the listener by guiding them away from reality, even if unintentionally.
  *   **Knowledge Condition:** This assertion is defective. Since the claim is false, it cannot be known. The speaker violated the norm by asserting something they did not know.
  *   **Belief/Justification Condition:** This assertion is proper. The speaker followed the rules (they believed it and had evidence). No one is wronged; the listener is merely unlucky.
  *   **The Difficulty:** This case is genuinely difficult for the Truth and Knowledge conditions. It seems harsh to say a careful expert did something "wrong" simply because the world turned out unexpectedly. However, it is only *apparently* easy for Belief/Justification conditions. While it excuses the speaker, it leaves the listener without a complaint despite suffering a loss based on the speaker's word.

  **Case B: The True Outsider (True, but Not Believed by the Speaker)**
  Consider a spokesperson reading a press release. She trusts the source but personally doubts the news. She says, "The company is profitable." It turns out the company *is* profitable. Or consider a liar who tries to deceive you with a falsehood, but accidentally tells the truth.
  *   **Truth Condition:** This assertion is proper. The statement matches reality. The listener is not misled about the facts.
  *   **Knowledge Condition:** This assertion is defective. The speaker did not know the claim (they doubted it or were guessing). They asserted without the proper standing.
  *   **Belief Condition:** This assertion is defective. The speaker lied or spoke without conviction. They were insincere.
  *   **The Difficulty:** This case is genuinely difficult for the Belief and Knowledge conditions. In the spokesperson case, the speaker is doing their job; the audience gets the truth. To call this "defective" seems to prioritize the speaker's psychology over the audience's information. However, it is only *apparently* easy for the Truth condition. If we allow assertions that the speaker doesn't believe, we sever the link between the speaker and the claim. If the spokesperson is wrong, she can shrug and say, "I didn't believe it anyway," evading accountability.

  ### 3. Assertion as an Invitation to Rely

  One way to resolve the tension between licensing and reliance is to reformulate the norm. Instead of viewing assertion as a move that requires a specific internal state (like knowledge), we view it as a social **invitation**. To assert that *p* is to invite the audience to rely on one's word for *p*. The norm then governs when it is appropriate to extend this invitation.

  This reformulation shifts the focus from the speaker's internal perfection to the security of the transaction. It makes the **Knowledge Condition** more attractive. Why? Because knowledge is the specific state that bridges the gap between belief and truth. If I invite you to rely on me, offering you merely my belief is risky (I might be wrong). Offering you truth is impossible to guarantee in advance. But offering you my *knowledge* is a promise that I am not just guessing and that I am connected to the facts. It signals that the invitation is safe to accept.

  This view clarifies whether a listener who relies on a false but warranted assertion has been **wronged** or merely **disappointed**.
  *   If the norm is **Justification**, the speaker kept their end of the bargain. They offered an invitation based on good evidence. If it turns out false, the listener is *disappointed* by bad luck, but the speaker violated no rule.
  *   If the norm is **Knowledge** (framed as an invitation), the speaker offered an invitation they did not have the standing to make. Even if they had evidence, if they lacked knowledge, they invited reliance on a shaky foundation. When the assertion proves false, it reveals the invitation was improper. The listener was *wronged* because they accepted an invitation that should not have been extended. The speaker owes more than a clarification; they owe an apology for having invited reliance they could not underwrite.

  ### 4. A Substantive Disagreement: The Obligation to Retract

  The choice of norm resolves concrete disagreements about what happens when an assertion is challenged. Consider the issue of **retraction**. Suppose I assert, "The meeting is at noon," based on a calendar invite I trusted. Later, I learn the meeting is at 1:00 PM. I was justified, but I was wrong. Do I need to retract my earlier statement, and if so, what kind of retraction is required?

  *   **If the Truth Norm is correct:** My original assertion was defective the moment I made it because it was false. I must retract it unequivocally. I should say, "I was wrong." The focus is on the falsity of the content. I am accountable for the error itself.
  *   **If the Justification Norm is correct:** My original assertion was proper because I had evidence. I do not need to admit I was "wrong" to assert it then. I only need to update the information. I should say, "New information has come to light." I am not accountable for the error, only for updating the record.

  The resolution depends entirely on the condition. If we adopt the Truth or Knowledge condition, assertion carries a heavy ethical weight: you are responsible for the truth of what you say, and failure requires an admission of fault. If we adopt the Justification or Belief condition, assertion is lighter: you are responsible only for your diligence, and failure requires only a correction. This changes the ethics of conversation. In a high-stakes environment (like medicine or law), we likely want the Truth/Knowledge norm, demanding speakers accept blame for honest mistakes to ensure maximum caution. In casual conversation, the Justification norm might suffice, allowing us to share information without fear of moral blame for every honest error. The "correct" norm depends on how much risk we think a speaker should bear when they invite others to rely on their word.
