answer: |-
  Good morning.

  Looking around this room, I see a divide that I think is appropriate for the subject matter. On one side, we have those who know John von Neumann's archives as well as they know their own handwriting—the defense memos, the game-theoretic notebooks, the classified calculations on fallout and fallout shelters. On the other side, we have those who know him as the father of the stored-program computer and a key architect of the atomic age.

  If you are in the second group, you might expect me to stand here and tell you that von Neumann predicted the singularity. You might expect the standard story: that he saw technology accelerating exponentially and warned that human wisdom couldn't keep pace.

  That story is not wrong, but it is comfortable. It suggests that the problem is merely one of speed, and that if we can just slow down or catch up, the equilibrium will restore itself.

  If you are in the first group, you know that von Neumann's actual view was far colder, and far more disturbing. He did not believe the equilibrium would restore itself. He did not believe the system was stable.

  For the next two days, we are discussing technology and human survival. If we are to take von Neumann seriously—not as a mascot, but as a thinker—we have to confront the specific architecture of his anxiety. It wasn't just that we could build things faster than we could understand them. It was that he viewed the relationship between technical capability and political institution as a problem in unstable equilibrium.

  In his view, the danger was not the technology itself. The danger was the mismatch between the lethality of our tools and the sluggishness, the fragility, of the human institutions tasked with controlling them. He looked at the Cold War, at the prospect of thermonuclear exchange, and he did not see a scenario where diplomacy or moral restraint would hold the line. He saw a game theoretic landscape where the rational move for a competitor was to strike first, and where the cost of a false negative was extinction.

  This is where the admiration I feel for him begins to curdle into something else. Because von Neumann was willing to follow that logic to places that most of us would call monstrous. He did not assume that democracy, or humanism, or the status quo would survive the contact. He was willing to entertain the idea that to survive the technology, we might have to surrender the very things we claim we are saving.

  He considered, with a terrifying lack of sentimentality, the possibility of preventive action. He considered the automation of defense, effectively handing the decision to escalate over to machines, because he calculated that human reaction times were too slow and human nerves were too frail. He was not a Luddite; he loved the machine. But he was also not an optimist. He did not believe that "it would all work out." He believed that survival was a constraint satisfaction problem, and if the constraints required us to become something harder, something colder, then that was the price of the solution.

  I bring this up not to endorse his conclusions, but to insist on his rigor. Too often, when we discuss AI safety or bio-security or nuclear posture today, we smuggle in a hope that the system wants to be stable. We assume that institutions will adapt. We assume that norms will hold.

  Von Neumann would have called that a modeling error.

  He forces us to ask: Are we designing our technology for the world as we wish it were, or for the world as it is? Are we assuming that our institutions have the bandwidth to control what we are building? And if the answer is no, are we willing to admit that, or will we just hope the instability doesn't trigger?

  For the historians in the room: I know the records show a man who loved a joke, who loved a party, who loved the sheer elegance of a mathematical proof. But I also know the records show a man who looked into the abyss of the mid-twentieth century and decided that comfort was a luxury we could not afford.

  For the engineers and policy makers: You are building the systems that define the new equilibrium. You need to know that the man who gave you the architecture for the computer also gave you the warning that the architecture might not be enough.

  So, as we begin this workshop, let us not smooth this over. Let us not turn von Neumann into a harmless prophet of acceleration. Let us grapple with the uncomfortable reality he left us: that survival is not guaranteed, that stability is not natural, and that the cost of keeping the system from tipping might be higher than we want to pay.

  He was willing to pay it. The question for us is whether we are willing to look at the bill.

  Thank you. Let's get to work.
