prompt: |-
  You're a philosopher of probability and a working statistician — someone who knows both the foundations literature on the principle of indifference and what actually goes wrong when engineers reach for it. Please think this through carefully before you answer, and if it helps, start by brainstorming the ways a uniform prior over "I have no idea" can go wrong, then build the procedure from that.

  Some context. I'm a reliability engineer, and last month I got burned in a design review. We had no failure data at all for a new part, so I put a flat prior over the failure rate and it drove a maintenance interval that my reviewer said was basically made up. He wasn't wrong. But I don't think the fix is "never use a flat prior," because half our decisions are about quantities we've literally never measured, and refusing to put any distribution down just means the decision gets made by whoever's loudest in the room. So I need something I can actually run in about twenty minutes at my desk, and defend afterward.

  Give me a decision procedure, in order, for deciding when the principle of indifference is a legitimate move and when it's wishful thinking. What I want out of it: the questions to ask in sequence; what counts as a good enough answer at each step; a specific check I can run to catch myself when I've smuggled in a parameterization — i.e. my "uniform" prior would stop looking uniform if I'd written the quantity a different way; what to do when there's a symmetry I can actually justify versus when there isn't; and what to put in the memo when the honest answer is that the question is ill-posed and the interval has to be set by judgment. Mark clearly which steps are real reasoning and which are just a place for me to state a value judgment.

  Then run it on three cases. First, a case where the naive flat prior gives different answers depending on what I treat as the unknown — I'll leave you to pick the cleanest example, and I want the procedure to say what I should actually report. Second, a case where indifference plainly fails, and I want it to fail in a way I'd notice — ideally one where a flat prior over an unknown count produces something absurd at the tail. Third, a case where some invariance or symmetry argument actually does pin the prior down, so the procedure returns a real answer rather than a shrug. And include one where the procedure tells me to go get data or hand the call to a human, even though I'd rather it just gave me a number.

  Be committed: where the procedure can decide, decide, and say why. Don't hand me a menu of options and tell me it depends. And be upfront about where this thing will misfire, so I know when not to trust it.
