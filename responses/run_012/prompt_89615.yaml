answer: |-
  Here is the protocol. It is designed to take 20 minutes, requires only a calculator and a whiteboard, and is defensible because it exposes *why* you chose a distribution rather than hiding behind "default settings."

  ### The Procedure: The Indifference Audit

  Do not open your Bayesian software until you have passed these five steps.

  **Step 1: The Physical Bounds Check**
  *   **Action:** Write down the quantity $\theta$ you are modeling. State its hard physical lower and upper bounds.
  *   **Question:** Can $\theta$ physically be zero? Can it be infinite?
  *   **Pass Criteria:** You have identified finite bounds $[L, U]$ OR you have acknowledged the bound is open ($0 \to \infty$).
  *   **Tag:** `[Reasoning]` (Physics dictates this, not you.)
  *   **Fail State:** If the bounds are infinite and you intend to use a Uniform prior, **STOP**. A flat prior on an infinite range is improper (integrates to $\infty$). You cannot use it. Switch to Step 2 immediately.

  **Step 2: The Reparameterization Test (The "Jeans Check")**
  *   **Action:** Identify the natural conjugate or inverse of your quantity. If $\theta$ is a rate ($\lambda$), write down the time ($T = 1/\lambda$). If $\theta$ is a standard deviation ($\sigma$), write down the variance ($\sigma^2$) or precision ($1/\sigma^2$).
  *   **Test:** Assume a flat prior on $\theta$ ($p(\theta) \propto 1$). Transform this distribution to the alternative parameter $\phi$. Does $p(\phi)$ look flat?
      *   *Math:* $p(\phi) = p(\theta) \left| \frac{d\theta}{d\phi} \right|$.
  *   **Pass Criteria:** The shape of the distribution is effectively the same (invariant) OR you can justify why $\theta$ is the *only* physically meaningful measure.
  *   **Fail State:** If a flat prior on $\theta$ implies a strongly informative prior on $\phi$ (e.g., flat on rate implies $1/T^2$ on time), **you cannot claim ignorance.** You have smuggled in a scale assumption.
      *   *Fix:* If the problem is scale-invariant (you don't know the order of magnitude), use a Jeffreys prior ($p(\theta) \propto 1/\theta$), which is flat on the log scale.
  *   **Tag:** `[Reasoning]` (Mathematical consistency.)

  **Step 3: The Symmetry/Group Justification**
  *   **Action:** Ask: "Is there a physical reason to treat value $A$ the same as value $B$?"
  *   **Question:** Is there a transformation group (translation, scale, permutation) that leaves the physical system unchanged?
      *   *Example:* A coin flip (permutation of H/T). A resistor noise (translation of mean).
  *   **Pass Criteria:** You can name the symmetry. (e.g., "There is no preferred orientation," or "The mechanism fails the same way at 100hrs as at 200hrs relative to start.")
  *   **Fail State:** If the system is evolving, degrading, or unique (e.g., "first ever launch of this rocket"), there is no symmetry. Indifference is wishful thinking.
  *   **Tag:** `[Reasoning]` (Physics/Logic.)

  **Step 4: The Tail Consequence Check**
  *   **Action:** Calculate the probability the prior assigns to "catastrophic" regions (e.g., failure rate 100x higher than expected).
  *   **Question:** Does the prior assign non-negligible probability to physically impossible or absurd values?
  *   **Pass Criteria:** The tail probability is low enough that it wouldn't change the design decision even if it were true.
  *   **Fail State:** If the prior puts 10% mass on "system explodes immediately," and you know that's physically impossible, your prior is wrong.
  *   **Tag:** `[Judgment]` (You define "absurd" based on engineering limits.)

  **Step 5: The Decision Rule**
  *   **Action:** Based on Steps 1–4, choose one of three paths.
      1.  **Green:** Use the prior (usually Jeffreys or Symmetry-derived).
      2.  **Yellow:** Use the prior, but inflate the uncertainty bounds in the memo.
      3.  **Red:** Do not calculate. The prior dominates the decision. The answer must be set by expert judgment or testing.
  *   **Tag:** `[Judgment]` (Risk tolerance.)

  ***

  ### The Memo Template (For the "Yellow" or "Green" Path)

  When you document this, do not write "I used a flat prior." Write this:

  > **Assumption of Ignorance:** Due to lack of failure data, a prior distribution was constructed based on the Principle of Maximum Entropy subject to [State Constraint, e.g., scale invariance].
  > **Parameterization:** The prior was defined on [Variable] to ensure invariance under [Transformation].
  > **Limitation:** This distribution represents a state of knowledge, not a physical frequency. It assumes [Symmetry/Constraint]. If the physical mechanism violates this symmetry, the maintenance interval may be non-conservative.
  > **Recommendation:** This interval is valid for [Timeframe] pending [Specific Data Collection].

  ***

  ### Case Studies: Running the Audit

  Here is the procedure applied to three specific scenarios you might face.

  #### Case 1: The Parameterization Trap (Your "Burn")
  **Scenario:** You need a maintenance interval for a new pump. You have zero failure data. You want to estimate the failure rate $\lambda$ (failures/hour).
  **Naive Move:** Flat prior $p(\lambda) \propto 1$ on $[0, \infty)$.

  1.  **Bounds:** Open upper bound. **Warning:** Flat prior on $[0, \infty)$ is improper.
  2.  **Reparameterization:** Let $T = 1/\lambda$ (Mean Time To Failure).
      *   If $p(\lambda) \propto 1$, then $p(T) = p(\lambda) |d\lambda/dT| \propto 1/T^2$.
      *   *Result:* A flat prior on rate implies you are 99% certain the MTTF is less than 100 hours if your scale is set loosely. It heavily favors short lifetimes.
      *   If you assumed flat on $T$, you'd get a different maintenance interval.
      *   **Verdict:** **FAIL.** You cannot claim indifference here. You have chosen to be informative about short lifetimes.
  3.  **Symmetry:** Is there scale invariance? Yes. Without data, you don't know if the pump fails in 10 hours or 10,000 hours. The problem looks the same on a log scale.
  4.  **Correction:** Use the Jeffreys Prior for a scale parameter: $p(\lambda) \propto 1/\lambda$. This is flat on $\log(\lambda)$. It treats $\lambda=0.1$ vs $1.0$ the same as $1.0$ vs $10.0$.
  5.  **Decision:** **Yellow.** Use $1/\lambda$, but acknowledge in the memo that this assumes scale invariance.

  **What you report:** "We used a scale-invariant prior ($1/\lambda$) rather than a uniform prior, as the uniform prior biased the MTTF toward lower values. This yields a more conservative maintenance interval."

  #### Case 2: The Absurd Count (The "Red Light")
  **Scenario:** You are estimating the number of latent design defects ($N$) in a new software control module. You have found 0 defects so far. You propose a flat prior on $N$ from $0$ to $\infty$.

  1.  **Bounds:** $N \ge 0$. Upper bound is unknown.
  2.  **Reparameterization:** Not applicable (discrete count).
  3.  **Symmetry:** Is there a reason to believe $N=5$ is as likely as $N=500$? No. Software complexity usually implies a distribution with a mode near zero and a long tail, not a flat line.
  4.  **Tail Consequence:** A flat prior $p(N) \propto 1$ on an infinite set is mathematically impossible (sum diverges). If you truncate it at an arbitrary $M$ (e.g., 1000), you claim $P(N > 500) = 50\%$.
      *   *Engineering Check:* Is it 50% likely there are more than 500 critical bugs in this module? No. That's absurd.
  5.  **Decision:** **Red.** **STOP.**
      *   Do not run the Bayesian update. A flat prior here implies you expect hundreds of bugs.
      *   **Action:** This cannot be solved with a prior. You must switch to a "Zero Failure" demonstration test plan (frequentist) or convene a panel of senior architects to estimate $N$ based on code complexity (expert elicitation).

  **What you report:** "A non-informative prior on defect count yields physically absurd tail probabilities. Reliability cannot be quantified probabilistically at this stage. Recommendation: Proceed to Phase II testing with a goal of 0 failures in 1000 hours."

  #### Case 3: The Valid Symmetry (The "Green Light")
  **Scenario:** You are modeling the voltage drift of a reference sensor due to thermal noise. You know the drift is bounded by physical saturation limits $\pm V_{max}$, but you have no data on the distribution within those limits.

  1.  **Bounds:** Hard physical limits $[-V_{max}, +V_{max}]$.
  2.  **Reparameterization:** The variable is voltage $V$. Inverting it ($1/V$) makes no physical sense in this context (singularity at 0). The natural measure is linear voltage.
  3.  **Symmetry:** The noise is thermal. Positive fluctuations are physically symmetric to negative fluctuations. There is no mechanism preferring $+0.5V$ over $-0.5V$.
  4.  **Tail Consequence:** The bounds are hard. No probability mass exists outside $[-V_{max}, +V_{max}]$.
  5.  **Decision:** **Green.** A Uniform prior $p(V) \sim U(-V_{max}, V_{max})$ is justified by the Principle of Indifference *because* of the physical symmetry and hard bounds.

  **What you report:** "Uniform prior justified by physical symmetry of thermal noise and hard saturation limits. This represents maximum entropy within physical constraints."

  ***

  ### Where This Procedure Will Misfire (The "Gotchas")

  I am a statistician; I must tell you where I lie to you.

  1.  **The "Multivariate" Trap:** This procedure works for single parameters. If you are modeling the correlation between two failure modes with no data, a flat prior on the correlation coefficient $\rho$ is *not* uniform on the dependence structure. **Rule:** If you have $>2$ unknown parameters interacting, do not use this procedure. Hand it to a specialist.
  2.  **The "High Consequence" Trap:** If the cost of failure is loss of life, "Yellow" decisions are not allowed. Even if the math holds (Case 3), if the consequence is catastrophic, the "Ignorance" itself is a risk factor. **Rule:** If $Cost \times Probability > Threshold$, treat Ignorance as Risk. Do not use a prior; use a worst-case bound.
  3.  **The "Time" Trap:** Indifference is static. Reliability is dynamic. If you use a flat prior today, and update it next month with zero failures, your belief will shift. But if the failure mode is "wear out" (bathtub curve), a static prior on $\lambda$ is wrong. **Rule:** Ensure the parameter $\theta$ is constant over the time horizon you care about.

  ### Final Instruction

  When you walk into the next design review:
  1.  If you used **Case 1 (Jeffreys)**: Say "I used a scale-invariant prior to avoid parameterization bias."
  2.  If you hit **Case 2 (Red)**: Say "The math breaks down here; I'm recommending a test plan instead of a number."
  3.  If you used **Case 3 (Uniform)**: Say "This is justified by physical symmetry and hard bounds."

  If you do this, you are no longer "making up" numbers. You are documenting the structure of your uncertainty. That is engineering.
