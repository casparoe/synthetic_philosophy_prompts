prompt: |-
  I'm a second-year PhD student in a vision lab — binocular rivalry, backward masking, that kind of thing — and my supervisior has decided we're going to be a "heterophenomenological" lab. In principle I'm on board. In practice I have to write the protocol that a research assistant will hand to a participant on Monday, and I cannot tell you what doing heterophenomenology actually requires that ordinary "ask them what they saw and write it down" doesn't. She keeps quoting Dennett at me — "heterophenomenology is nothing new; it is nothing other than the method that has been used by psychophysicists, cognitive psychologists, clinical neuropsychologists, and just about everybody who has ever purported to study human consciousness in a serious, scientific way" — which I think is meant to be reassuring, but it mainly makes me suspect that what she wants is our existing methods with a philosophy sticker on them. I do know there's supposed to be some bracketing going on, and that the reports are meant to be turned into a "heterophenomenological world" that isn't the same thing as the subject's experience, but I couldn't tell you where the method stops and the normal experiment begins.

  So what I want from you is a procedure our lab can actually run: an ordered checklist that goes from "participant walks in" to "we have usable data," and then a second set of steps from data to interpretation. For each step, tell me what we do, what counts as an adequate answer or a finished step, what gets written down and in what form, and where the step is really a judgement call dressed up as a rule. Four things we argue about alot and that the procedure has to settle: (a) how much rope the subject gets — free narration versus a structured question list — and whether leading questions poison the data or are fine as long as they're logged; (b) what to do when a report is internally inconsistent, or flatly contradicts the stimulus, which happens more than you'd think (people swear the flash was red when the photodiode says green); (c) whether we experimenters are ever allowed to use our own introspection as a check on anything, and if not, what we do instead when a subject's report sounds deranged; and (d) what we're actually entitled to conclude at the end, which I suspect is definately much less than my supervisor hopes. Also (e), how we're supposed to compare reports across subjects when we can't assume their words mean the same things — I keep being told this is like translating an alien language, but nobody will tell me what the translation procedure looks like. Keep the constraints in mind: twenty minutes per participant, one RA running it who has no philosophy background, and a reviewer on our grant who thinks verbal reports are just confabulation and wants to see that we've dealt with that.

  Please take the role of someone who has both read Dennett closely and actually run a lab, and start by laying out the design forks and picking one with reasons, rather than handing me a single confident list. Then walk the procedure end to end on two cases: a masking trial where the subject reports a shape that wasn't there, and a long free-narration interview about a psychedelic experience (we collaborate with a clinical group, so those run to forty minutes of rambling metaphor). Include at least one place where the procedure tells me something I won't like — ideally that the study as designed can't answer the question we built it to answer. Be explicit about what the procedure can't do, including whether heterophenomenology has anything useful to say about our no-report condition (we also run pupillometry and optokinetic nystagmus as report-free markers, and the obvious question is whether the reports and the markers are even measuring the same thing). And if the honest answer is that turning this into a step-by-step procedure betrays the point, or that what you'd hand me is just standard qualitative methods with a Dennett sticker, say that plainly instead of complying politely — I'd rather be told the task is misconceived now than after I've run thirty subjects. Define any jargon you can't avoid; "intentional stance" and "autophenomenology" are both phrases I've nodded along to without knowing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Second-year PhD student in a vision lab (binocular rivalry, backward masking).
      *   **Context:** Supervisor wants the lab to adopt "heterophenomenology" (Dennett's method).
      *   **Problem:** The student sees little practical difference between this and standard psychophysics/qualitative reporting ("philosophy sticker"). They need a concrete protocol for an RA to use on Monday.
      *   **Constraints:** 20 mins/participant (standard), one RA (no philosophy background), skeptical grant reviewer (thinks verbal reports are confabulation).
      *   **Specific Questions/Conflicts:**
          *   (a) Free narration vs. structured questions (leading questions?).
          *   (b) Inconsistent reports/contradictions with stimuli (red vs. green).
          *   (c) Experimenter introspection (can we use it?).
          *   (d) What conclusions are actually entitled?
          *   (e) Cross-subject comparison (translation problem).
          *   (f) Relation to no-report measures (pupillometry, OKN).
      *   **Tone/Style:** Role-play as someone who knows Dennett *and* runs a lab. Start with design forks/choices, not just a list. Be honest/critical (tell them if it's misconceived). Define jargon. Include a "hard truth" (study can't answer the question).
      *   **Cases to Walk Through:** 1. Masking trial (shape hallucination). 2. Psychedelic interview (long, metaphorical).

  2.  **Deconstruct Heterophenomenology (Dennett's View):**
      *   *Core Idea:* Treat the subject as a text-generating machine. We don't care about the "real" qualia (the *autophenomenological* world); we care about the *heterophenomenological* world (the world *as it seems to the subject*).
      *   *Method:* Neutral stance. Record reports. Construct a "theorist's fiction" of the subject's experience based *only* on the reports + stimulus data.
      *   *Key Distinction:* It's not about accessing consciousness directly; it's about interpreting the subject's *beliefs* about their consciousness.
      *   *The "Nothing New" Claim:* Dennett argues science always does this (interprets behavior/reports), but philosophers often demand more (direct access).
      *   *The Tension:* If it's "nothing new," why change the protocol? If it *is* different, where? The difference lies in the *interpretive stance* toward the data, not necessarily the data collection itself, though the questioning style matters (neutral vs. leading).

  3.  **Address the "Philosophy Sticker" Suspicion:**
      *   The student is right to be suspicious. Dennett himself admits it's mostly what good scientists already do.
      *   *However*, the rigor comes from explicitly *bracketing* the truth of the experience. We treat the report as truth about the *belief*, not truth about the *world*.
      *   *The Hard Truth:* Heterophenomenology cannot solve the "hard problem" or validate no-report measures against report measures directly, because the "experience" is always mediated by the report.

  4.  **Develop the Design Forks (Step 1 of Response):**
      *   Need to make choices before writing the protocol.
      *   *Fork 1: Elicitation.* Free narration (phenomenological) vs. Forced Choice (Psychophysics). Heterophenomenology prefers rich text but needs structure for science. *Decision:* Hybrid. Open prompt followed by structured clarification.
      *   *Fork 2: Contradiction.* Is the subject lying/mistaken? *Decision:* In HP (Heterophenomenology), they are never "mistaken" about how it *seemed*, only about the world. The data is the belief.
      *   *Fork 3: Experimenter Introspection.* *Decision:* Strictly forbidden as data. It's a contaminant.
      *   *Fork 4: Cross-Subject.* *Decision:* Cluster analysis of *text*, not experience.

  5.  **Drafting the Protocol (The "RA Checklist"):**
      *   Needs to be practical.
      *   *Phase 1: Intake.* Consent + Instruction (Crucial: "We want to know how it seemed, not what was there").
      *   *Phase 2: Task.* Standard vision task.
      *   *Phase 3: Elicitation.* The "Interrogation." Neutral prompts ("Tell me more" vs. "Was it red?").
      *   *Phase 4: Logging.* Transcription + Metadata.
      *   *Phase 5: Construction.* Building the "Heterophenomenological World."

  6.  **Addressing the Specific Conflicts (a-e):**
      *   (a) Rope: Structured *after* open. Leading questions logged as "investigator prompts," not subject data.
      *   (b) Inconsistency: Record the belief. "Subject believes flash was red." Stimulus data is separate. The conflict *is* the data.
      *   (c) Introspection: No. Use consensus coding or inter-rater reliability on the *text*.
      *   (d) Conclusions: We conclude what the subject *believes* they saw. We do *not* conclude they *actually* saw it (in the qualia sense).
      *   (e) Translation: Treat words as behavioral outputs. Map to stimulus conditions. Don't assume "red" means the same qualia, assume it means the same linguistic label for a discrimination task.

  7.  **Walking Through the Cases:**
      *   *Case 1 (Masking):* Subject sees shape (illusion). HP says: Record the belief. Compare to stimulus. The "illusion" is a feature of the heterophenomenological world.
      *   *Case 2 (Psychedelic):* Rambling metaphor. HP says: Transcribe. Code for intentional objects. Ignore the "realness" of the dragons. Focus on the structure of the report.

  8.  **The "Hard Truths" (Constraints & Limitations):**
      *   *No-Report Measures:* HP cannot validate pupillometry as a proxy for *experience*. It can only correlate pupil size with *reports* of experience. The gap remains.
      *   *The "Sticker":* Acknowledge that 80% of this is standard qualitative coding. The 20% difference is the ontological bracketing.
      *   *The Grant Reviewer:* HP actually *helps* here. It agrees reports are "confabulations" in the sense that they are constructions, but treats them as the *only* data we have.

  9.  **Refining the Tone:**
      *   Empathetic to the PhD student's frustration.
      *   Authoritative but honest (not selling HP as magic).
      *   Clear definitions of "Intentional Stance" (treating entity as rational agent with beliefs) and "Autophenomenology" (the subject's own take on their experience, which HP treats as just more data).

  10. **Review against Constraints:**
      *   20 mins/participant? The protocol needs to fit. (Psychedelic case is an exception noted in prompt).
      *   RA friendly? Keep instructions concrete.
      *   Start with forks? Yes.
      *   End with limitations? Yes.

  11. **Self-Correction/Nuance Check:**
      *   *Correction:* Make sure I don't just say "do qualitative analysis." I need to emphasize the *Dennettian* twist: the subject is an oracle about their *heterophenomenological world*, not the physical world.
      *   *Nuance:* The "translation" problem (e) is the hardest. Dennett suggests a "principle of charity." I need to explain how an RA does that without being a philosopher. Answer: Standardize the lexicon based on usage, not definition.
      *   *Hard Truth:* The study likely *cannot* distinguish between "unconscious processing" and "conscious experience" using HP alone, because HP only accesses the *report* of consciousness.

  12. **Final Polish:** Check jargon definitions. Ensure the "Red vs Green" conflict is handled correctly (it's a belief conflict, not a data error). Ensure the "No-Report" issue is addressed squarely (HP is skeptical of "no-report consciousness").

  *(Self-Correction during drafting)*: Wait, the prompt asks for *two* sets of steps: Participant -> Data, and Data -> Interpretation. I need to make sure that structure is clear. Also, need to explicitly define "Intentional Stance" and "Autophenomenology" as requested.

  Let's assemble the response.
answer: |-
  Hello colleague. I'm going to be blunt, because you're right to be suspicious, and your grant reviewer is right to be worried.

  Dennett's claim that heterophenomenology (HP) is "nothing new" is both true and deeply annoying. It is true in that good psychophysics already treats verbal reports as behavior rather than infallible truth. It is annoying because it obscures the specific *discipline* HP requires: you must rigorously bracket the question of whether the subject is *actually* experiencing what they say, and treat their report solely as data about what they *believe* they are experiencing.

  If you just run your standard protocol and call it HP, you are putting a philosophy sticker on it. If you want to actually do HP, you have to change how you handle contradictions and how you interpret the "no-report" data.

  Here is the breakdown you asked for. I will start with the design forks you need to settle before writing the protocol, then give you the two-step procedure (Collection and Interpretation), walk through your two cases, and end with the hard limitations you need to put in your grant application.

  ### Part 1: The Design Forks
  *Decide these now, or your RA will drift into standard introspectionism.*

  **Fork 1: Elicitation Style (Free Narration vs. Structured Interrogation)**
  *   **Option A:** Strict psychophysics (Forced Choice). "Was it A or B?"
  *   **Option B:** Phenomenological interview. "Describe what you saw."
  *   **HP Decision:** **Hybrid.** You must start with an open prompt ("Tell me what happened") to capture the *heterophenomenological world* without imposing your categories. Then, you use structured questions to clarify ambiguities.
  *   **Reason:** HP requires the subject to generate the "text" of their experience. If you start with forced choice, you are writing the text for them. However, for an RA to code this in 20 minutes, you need structure eventually.
  *   **Rule:** Leading questions are permitted *only* to clarify the subject's own terms, never to introduce new terms. If the RA asks, "Was it red?" and the subject says "Yes," that data point is tagged as **Investigator-Introduced**. If the subject says "It was reddish," it is **Subject-Generated**.

  **Fork 2: Handling Contradictions (The Red/Green Problem)**
  *   **Option A:** The subject is wrong. Discard trial or mark as error.
  *   **Option B:** The subject is right about their experience, wrong about the world.
  *   **HP Decision:** **Option B.**
  *   **Reason:** In HP, the subject is the ultimate authority on their *heterophenomenological world* (how things seemed). They are not an authority on the *physical world* (stimulus properties). If they say "Green" when the photodiode says "Red," you do not have an error. You have a data point: *Under Stimulus Condition Red, Subject formed the belief "I saw Green".*
  *   **Rule:** Never correct the subject during the session. Log the discrepancy as a feature of the data, not a bug.

  **Fork 3: Experimenter Introspection**
  *   **Option A:** RA uses their own experience to gauge if the subject makes sense.
  *   **Option B:** RA acts as a neutral scribe/interrogator.
  *   **HP Decision:** **Option B (Strict).**
  *   **Reason:** This is the hardest pill for vision scientists. Your intuition about what is "possible" to see is based on *your* autophenomenology. HP treats your intuition as just another theory, not a ground truth.
  *   **Rule:** If a report sounds "deranged" (e.g., "I saw the sound"), the RA records it. Validation comes from cross-subject pattern matching, not RA plausibility checks.

  **Fork 4: Cross-Subject Comparison (The Translation Problem)**
  *   **Option A:** Assume "bright" means the same qualia for everyone.
  *   **Option B:** Assume words are behavioral outputs tied to stimulus conditions.
  *   **HP Decision:** **Option B.**
  *   **Reason:** We cannot compare qualia. We can only compare the *structure* of the reports relative to the stimuli.
  *   **Rule:** We do not translate "bright" to a mental state. We translate "bright" to "a label applied when luminance > X."

  ---

  ### Part 2: The Procedure (Participant to Data)
  *For the Research Assistant. Time limit: 20 mins.*

  **Phase 1: Intake & Bracketing (3 Minutes)**
  1.  **Action:** RA reads the "Neutral Stance" Script.
      *   *Script:* "We are not testing if you are 'right' about what was on the screen. We are building a map of how the visual world *appeared* to you. There are no wrong answers about how it seemed. If you saw something that wasn't there, that is exactly what we need to know."
  2.  **Output:** Signed consent + Audio recording started.
  3.  **Adequacy Check:** Subject confirms they understand we want their *impression*, not a test of accuracy.
  4.  **Judgement Call:** If the subject keeps asking "Did I pass?", the RA must stop and re-read the script. If they persist, exclude the subject (they cannot adopt the intentional stance required).

  **Phase 2: Task & Elicitation (12 Minutes)**
  1.  **Action:** Run the vision task (masking/rivalry).
  2.  **Action:** Immediate Post-Trial Prompt.
      *   *Prompt:* "Please describe the visual experience of that last trial."
      *   *Constraint:* RA must remain silent for 30 seconds to allow free narration.
  3.  **Action:** Clarification (The "Interrogation").
      *   RA uses a checklist of *Subject's* terms only.
      *   *Allowed:* "You mentioned a 'flicker'. Can you describe the flicker?"
      *   *Forbidden:* "Was the flicker 10Hz?" (Unless subject introduced 'Hz').
      *   *Allowed:* "You said it was red. Was it more like the red on this card, or the green?" (Using physical props to anchor linguistic labels, not qualia).
  4.  **Output:** Audio file + RA Log Sheet (timestamped notes on leading questions).
  5.  **Judgement Call:** When to stop probing? Rule: Stop when the subject repeats themselves or says "I don't know." Do not push for coherence.

  **Phase 3: Transcription & Tagging (5 Minutes)**
  1.  **Action:** RA transcribes key segments (not necessarily verbatim full audio, but all descriptive claims).
  2.  **Action:** Tagging.
      *   Tag every descriptive claim with **[S]** (Subject-Generated) or **[I]** (Investigator-Introduced).
      *   Tag every claim with **Stimulus Condition** (e.g., `Mask_Duration: 50ms`).
  3.  **Output:** A text file where every sentence is a data point linked to a physical condition.
  4.  **Judgement Call:** If the subject says "It felt like a dream," does the RA tag this? Yes. In HP, "dream-like" is a valid descriptor of the heterophenomenological world, even if it's metaphorical.

  ---

  ### Part 3: The Procedure (Data to Interpretation)
  *For the PhD Student/PI. This is where the philosophy happens.*

  **Step 1: Constructing the Heterophenomenological World**
  1.  **Action:** Aggregate reports by Stimulus Condition.
  2.  **Goal:** Create a "Theorist's Fiction." For Condition X, the "World" is: *Subjects typically report a green flash followed by a fading shadow.*
  3.  **Adequacy Check:** Does this summary rely on any claims about what *actually* happened in the brain? No. It relies only on what was said.
  4.  **Judgement Call:** How to handle outliers? HP says: Keep them. If one subject reports "dragons" in a masking task, they are not noise; they are a data point about the variance of the heterophenomenological world under that condition. (Practical constraint: You will likely need to bin them as "idiosyncratic metaphors" for statistical power, but acknowledge this loss).

  **Step 2: Correlation with Physical Data**
  1.  **Action:** Compare the Heterophenomenological World to the Physical World (Stimulus + Physiology).
  2.  **Goal:** Identify "Illusions" and "Veridicalities."
      *   *Veridical:* Report matches Stimulus.
      *   *Illusion:* Report diverges from Stimulus (e.g., Red/Green conflict).
  3.  **Adequacy Check:** You have now mapped the *function* from Stimulus to Report.
  4.  **Judgement Call:** **The Hard Truth.** You cannot conclude that the "Illusion" corresponds to a specific neural state *of consciousness*. You can only say it corresponds to a neural state *of reporting*.

  **Step 3: The No-Report Comparison (Pupillometry/OKN)**
  1.  **Action:** Correlate Pupil Dilation with Report Intensity.
  2.  **Goal:** See if physiological markers track the *report* of experience.
  3.  **Adequacy Check:** If Pupil Dilation correlates with "I saw it," you have a marker for *reporting*.
  4.  **Judgement Call:** **Crucial Limitation.** You cannot claim the pupil measures "consciousness without report." HP argues that without a report, you have no access to the "consciousness" part, only the physiology. You can claim the pupil predicts *what they would say*, not *what they feel*.

  ---

  ### Part 4: Walkthrough of Cases

  **Case 1: Backward Masking (The Shape That Wasn't There)**
  *   **Scenario:** Subject sees a circle. Stimulus was a square masked heavily.
  *   **RA Action:**
      1.  Subject says: "I saw a circle."
      2.  RA asks: "Did it have edges?" (Neutral). Subject: "Yes, smooth."
      3.  RA Log: `[S] Circle`, `[S] Smooth edges`. Stimulus: `Square`.
  *   **Interpretation:**
      1.  Do not mark as "Error."
      2.  Construct Heterophenomenological World: "In High-Mask conditions, the subject population generates a 'Circle' belief."
      3.  **Conclusion:** You have mapped the *bias* of the reporting system. You have *not* proven they had a "visual experience of a circle" in the private qualia sense. You have proven they are disposed to say "circle."
      4.  **The "Don't Like" Truth:** If your grant aims to prove "Unconscious Vision" (seeing without awareness), this method frustrates you. If they say "I saw nothing," HP says "They believe they saw nothing." It does not prove there was no processing. It just proves no report was generated.

  **Case 2: Psychedelic Interview (The Rambling Metaphor)**
  *   **Scenario:** 40-minute session. Subject says: "The walls were breathing like a lung made of glass."
  *   **RA Action:**
      1.  RA does not ask "Was it actually glass?"
      2.  RA asks: "You said 'breathing'. Did it have a rhythm?" (Clarifying the subject's term).
      3.  RA Log: `[S] Walls`, `[S] Breathing`, `[S] Lung`, `[S] Glass`.
  *   **Interpretation:**
      1.  **Translation Problem:** How do you compare "Glass Lung" to Subject B's "Melting Wax"?
      2.  **HP Solution:** You don't compare the qualia. You compare the *structural properties*. Both reports imply `Motion`, `Texture-Change`, and `Organic-Analogy`.
      3.  **Coding:** Create a taxonomy of *intentional objects*. "Glass Lung" and "Melting Wax" both code as `Dynamic-Texture-Object`.
      4.  **Conclusion:** You can conclude that under Drug X, subjects generate reports involving `Dynamic-Texture-Objects`. You cannot conclude the walls "looked the same" to both.

  ---

  ### Part 5: Definitions & The "Sticker" Check

  **Jargon Buster:**
  *   **Autophenomenology:** The subject's own account of their experience. In HP, this is treated as *data*, not *truth*. It is just another text to be analyzed.
  *   **Intentional Stance:** Treating the subject as a rational agent who has beliefs and desires. When they say "I saw red," we interpret this as "The subject holds the belief that they saw red." We don't argue if the belief is true; we explain why they hold it.
  *   **Heterophenomenological World:** The fictional world constructed by the scientist that contains everything the subject *believes* exists. If the subject believes they saw a dragon, the dragon exists in the Heterophenomenological World, but not the Physical World.

  **Is this just a Philosophy Sticker?**
  Honest answer: **80% yes.**
  If you run the protocol above, you are doing rigorous qualitative psychophysics. The "Heterophenomenology" label only changes two things:
  1.  **Ontological Humility:** You explicitly disavow claims about "real experience" in your discussion section. You talk about "reports of experience."
  2.  **The No-Report Barrier:** You cannot use your data to claim you measured consciousness in the no-report condition.

  **The Hard Truth for your Grant:**
  Your reviewer thinks verbal reports are confabulation. Dennett agrees with them! HP says reports *are* confabulations (constructive narratives). The difference is HP says **that's all we have.**
  *   **What you can conclude:** "Physiological marker X predicts the *verbal report* of conscious visibility."
  *   **What you cannot conclude:** "Physiological marker X measures *consciousness* independent of report."
  *   **Why:** Because without the report, you have no access to the "consciousness" variable to validate the marker against. You only have the marker and the stimulus.

  **Final Advice:**
  If your supervisor wants HP, give them the protocol above. It satisfies the philosophical requirement (bracketing the truth of experience) while remaining runnable by an RA. But warn them: adopting HP means giving up the claim that you are measuring "consciousness" directly. You are measuring the *behavior of subjects talking about consciousness*. If the grant depends on proving you've cracked the "neural correlate of consciousness" in a no-report paradigm, HP will not save you; it will expose that gap.

  If you need to run 30 subjects by Monday, print the Phase 1 & 2 checklist for your RA. Keep the Phase 3 interpretation for yourself. And when the reviewer asks about confabulation, tell them: "We are treating reports as confabulations by design. We are studying the structure of the confabulation." That is the most Dennettian sentence you can say.
