      *   Humor angle: Push the logic to an absurd extreme where predictive success is maintained despite assumptions becoming metaphysically impossible or causally irrelevant, or where the prediction is trivially true but the assumption is wildly false.
      *   Desired shape: A modeler defending increasingly false assumptions because the forecasts are excellent.

