answer: |-
  At the tenure seminar, Dr. Fable presents his model of firm behavior.
  "We assume firms maximize profit using crystal balls," Fable states.
  "Crystal balls don't exist," objects the chair.
  "True. But last year, firms maximized profit. The prediction is verified."
  "Correlation isn't causation."
  "Instrumentalism isn't realism," Fable counters. "The assumption is descriptively false, but the implications match data. That's all that matters."
  "What if we ban crystal balls?"
  "Then I'll assume they use tarot cards. The specific falsehood doesn't matter, only the predictive success."
  "So the mechanism is irrelevant?"
  "Exactly. I could assume firms are run by hamsters, provided they maximize profit."
  The chair closes his folder. "You haven't built a model; you've built a Magic 8-Ball that only shakes when you're right."
  Fable beams. "And look at my track record! The economy is mostly good."

  The punchline exploits the F-twist's license to ignore causal falsehoods as long as empirical fit is maintained, even if that fit is trivial or selective.
