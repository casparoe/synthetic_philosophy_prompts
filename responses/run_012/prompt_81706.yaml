  Where it breaks

  The analogy fudges the ontological status of the units. In survey sampling, the population exists independently of the sample; units are pre-existing labels with fixed characteristics. In anthropics, "existence" is the variable being sampled. Asking "why am I this unit?" is meaningful in anthropics because the unit's existence is contingent on the hypothesis. In design-based sampling, units don't pop in and out of the frame based on the model; they are fixed. You cannot treat "existence" as an inclusion probability when the unit's very presence is the data. The sampling frame in surveys is a list; in anthropics, it's a metaphysical categorization.

  Furthermore, treating the reference class as a sampling frame ignores that frames are empirically verifiable in surveys. You can check coverage error against a census or administrative records. In anthropics, there is no external census of observers to validate the frame. The "coverage error" is unidentifiable; you cannot know if your reference class excludes non-human observers, aliens, or simulated minds. This makes the "design decision" suspicion problematic. In surveys, the statistician chooses the design to optimize variance. In anthropics, the "design" is the laws of physics and consciousness. You cannot choose PPS over SRS; you are trying to infer the data generating process from a sample size of one.

  Finally, the "Presumptuous Philosopher" isn't just applying weights; he's assuming a prior over worlds that interacts with the sampling model. In surveys, priors are usually separate from design weights. Here, the design weights *are* the likelihood ratio. The analogy flattens the metaphysical uncertainty into statistical uncertainty. Survey methodology assumes the frame is known; anthropics assumes the frame is the primary unknown. The dispute isn't just about weighting; it's about whether the "sample" (your existence) is data about the world or a condition of the analysis. In surveys, conditioning on selection is standard. In anthropics, conditioning on existence is the whole problem.

  Verdict

  Your suspicion is structurally correct but ontologically shallow. Camp B is indeed size-biased sampling and Camp A is equal-probability, but this isn't a design *decision* you can make; it's an inference about the data-generating process itself. "Why am I this unit?" is meaningless in design-based frameworks where units are fixed, but central here where units are contingent. The reference class is a frame, but without a census, coverage error is unidentifiable.
