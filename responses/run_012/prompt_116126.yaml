          *   Asset Payoff: $2.00 (H) / $0.00 (L).
          *   Prior EV: $1.00.
          *   Transaction Fee: $0.10 per trade (paid by both sides? or just buyer? Let's say Buyer pays fee).
          *   Signals: 15/3 split.
          *   Inference: Selling implies Black signal.
          *   Update: Red + Black signal = 50/50 Prior = $1.00 EV.
          *   Cost: $1.00 Price + $0.10 Fee = $1.10.
          *   Value: $1.00.
          *   Loss: $0.10.
