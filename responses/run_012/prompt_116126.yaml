          *   "If someone is willing to sell at the Prior Price, they must have a Bad Signal."
          *   "If they have a Bad Signal, the Asset is worth less than the Prior Price."
          *   "Therefore, buying at the Prior Price is a loss."
          *   I will provide a **Cheat Sheet** with the EV calculations so they don't have to do Bayes rule from scratch, just the inference.
          *   *Cheat Sheet:*
              *   Your Signal: Red -> Your EV = $1.33.
              *   Your Signal: Black -> Your EV = $0.67.
