              *   *Damn.* Symmetric noise cancels out in pairs.
              *   *Solution:* **Odd number of traders or Asymmetric Signals.**
              *   Or, rely on the **Market Price** moving.
              *   If I bid $1.10. You sell.
              *   I infer you have Black.
