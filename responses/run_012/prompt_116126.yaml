              *   In this specific symmetric case, my Red and her Black cancel out! My posterior remains 0.5.
              *   *CRITICAL FAILURE:* If the signals cancel out perfectly, there is *no* adverse selection. The No-Trade theorem relies on the fact that the *fact of trading* reveals information that moves the price *away* from the proposer.
