  # Design Notes

  1.  **Open-Outcry Double Auction:** Students shout bids and asks.
      *   *Feel:* High energy, realistic market chaos.
      *   *Fail:* Too noisy. The specific informational content of a single offer gets lost in the din. Common knowledge of rationality is impossible to maintain when everyone is shouting.
  2.  **Sealed-Bid Clearing House:** Students submit private orders; instructor clears them.
      *   *Feel:* Clean data, easy to analyze later.
      *   *Fail:* Hides the crucial mechanism. Students do not see the *offer* before accepting, so they cannot reason about the *act* of offering. The "adverse selection" intuition remains abstract.
  3.  **Pairwise Betting:** Students match 1-on-1 to bet on the state.
      *   *Feel:* Intimate, focused on logic.
      *   *Fail:* Loses the "market" context. Hard to scale to 18 students without fragmentation. Doesn't capture the public nature of market prices.
  4.  **Whiteboard Limit Order Book (Selected):** All bids and asks are written publicly on a central board. Trades execute when orders cross.
      *   *Feel:* Deliberate, transparent, slow.
      *   *Why:* Makes every offer *common knowledge*. Before a trade occurs, the entire room sees the price and the identity of the offerer (implicitly). This forces the "what does this offer tell me?" reasoning step visibly.
  5.  **Instructor as Counterparty:** Students trade against the professor.
      *   *Feel:* Safe, controlled.
      *   *Fail:* Removes the "common knowledge of peer rationality" condition. Students might think the professor is making a mistake, rather than inferring information from a peer.
  6.  **Computer Simulation:**
      *   *Feel:* Precise.
      *   *Fail:* Violates room constraints. Also, "black box" algorithms hide the reasoning process.

  # Runnable Design: The Market for Uncertain Assets

  ## Materials and Setup
  *   **Room:** 18 chairs in a semi-circle facing a large whiteboard. Movable tables for groups of 3 (6 tables).
  *   **Money:** $20.00 in small bills/coins. (Reserve $9.00 for show-up fees, $11.00 for trading profits).
  *   **Asset:** "Vouchers" (printed slips). Each voucher pays **$2.00** if the State is **HIGH**, **$0.00** if the State is **LOW**.
  *   **State Generation:**
      *   Two opaque boxes labeled **H** and **L**.
      *   **Box H:** Contains 15 Red cards, 3 Black cards.
      *   **Box L:** Contains 3 Red cards, 15 Black cards.
      *   **Coin:** To select the box (Heads = H, Tails = L).
  *   **Private Information:** 18 Envelopes. Inside each is 1 card drawn from the selected box.
      *   *Privacy:* Students open envelopes under the desk. They must not show the card.
      *   *Verification:* At the end of the round, all cards are collected to verify the State and signals.
  *   **Transaction Fee:** A physical "Fee Token" (poker chip or distinct card). To complete a trade, the Buyer must hand the Fee Token plus the Price to the Seller. The Instructor collects the Fee Token (removing money from the system). **Fee Value: $0.20.**
  *   **Handout:** One page per student. Contains Rules, Payoff Table, and "Reasoning Sheet" (see below). No theory names.

  ## Roles, Rules, and Payoffs
  *   **Endowment:** Every student starts with **1 Asset Voucher** and **$2.00 Cash**.
  *   **Goal:** Maximize final cash value (Cash + Asset Value - Fees Paid).
  *   **Trading Mechanism:**
      1.  Any student may write a **BID** (I will buy at $X) or **ASK** (I will sell at $X) on the whiteboard.
      2.  They must initial the order.
      3.  Any other student may **ACCEPT** an existing order by calling "Take" or "Hit" and approaching the board.
      4.  **Crucial Rule:** Before money changes hands, the Instructor asks the Acceptor: *"Do you confirm this trade?"* This is the moment to pause.
      5.  **Fee:** The Buyer pays the $0.20 Fee to the Instructor.
  *   **Payoff Table (for Handout):**
      | Your Card | Your Private EV (No Trade) | If You Buy (Cost + Fee) | If You Sell (Revenue) |
      | :--- | :--- | :--- | :--- |
      | **Red** | $1.66 | Price + $0.20 | Price |
      | **Black** | $0.33 | Price + $0.20 | Price |
      | **Prior (Avg)**| **$1.00** | **Price + $0.20** | **Price** |
      *(Note: EV calculations assume you know your card but not others'.)*
  *   **Reasoning Sheet (for Handout):**
      *   "If a rational trader offers to **Sell** at the Prior Price ($1.00), they likely hold a **Black** card."
      *   "If you know a trader holds a **Black** card, the Asset's Expected Value to **You** (even if you hold Red) drops to **$1.00**."
      *   "If Value is $1.00 and Cost is Price ($1.00) + Fee ($0.20), you lose **$0.20**."

  ## Timeline (90 Minutes)

  *   **00:00 – 00:10: Setup & Endowment.**
      *   Distribute envelopes. Flip coin for State (keep secret). Deal cards.
      *   Distribute Cash and Vouchers.
      *   Read the "Rationality Pledge" aloud together: *"I am a rational expected-utility maximizer. I know everyone else here is too. I know they know I am too."*
  *   **00:10 – 00:35: Round 1 (The No-Trade Equilibrium).**
      *   Rules: Common Value, Private Signals, Transaction Fee $0.20.
      *   Action: Open the book. Allow 15 minutes of trading.
      *   *Expected Outcome:* Silence. Perhaps one or two tentative trades that get paused.
      *   Close: Reveal State and Cards. Calculate hypothetical losses for any trades that occurred.
  *   **00:35 – 00:55: Round 2 (Noise Traders).**
      *   Change: Hand 4 students a secret "Liquidity Note": *"You must sell 1 unit before the round ends, regardless of price, or pay a $5.00 penalty."* (Fund this penalty from your budget if needed, or make it a grade penalty).
      *   Action: Open the book.
      *   *Expected Outcome:* Trade occurs. Informed traders buy from forced sellers.
      *   Close: Reveal who was forced. Discuss why trade was safe this time.
  *   **00:55 – 01:15: Round 3 (Private Values).**
      *   Change: Asset pays **$2.00 to Red holders**, **$0.00 to Black holders**. State (H/L) no longer matters.
      *   Action: Open the book. Fee remains $0.20.
      *   *Expected Outcome:* High volume. Red holders buy from Black holders.
      *   Close: Reveal cards. Show gains from trade were based on preference, not information.
  *   **01:15 – 01:30: Debrief & Theory Reveal.**
      *   Map the rounds to the Milgrom-Stokey Theorem.
      *   Reveal the theorem name and authors.
      *   Discuss limitations.

  ## Round Details

  ### Round 1: The Silence (Common Value, Pure Speculation)
  *   **Objective:** Demonstrate that with common priors and common knowledge of rationality, speculative trade is impossible.
  *   **The Trap:** Students with Red cards (EV $1.66) want to buy at $1.00. Students with Black cards (EV $0.33) want to sell at $1.00.
  *   **The Block:** If a Red holder sees a Sell Order at $1.00, they infer the Seller has a Black card. This inference updates the Red holder's EV down to $1.00. With the $0.20 fee, the trade is a loss ($1.00 Value - $1.20 Cost).
  *   **Facilitator Role:** If a trade is about to happen, pause. Ask the Buyer: *"What card do you think they have?"* If they say "I don't know," remind them of the Rationality Pledge. *"If they were rational, would they sell at this price with a Red card?"*

  ### Round 2: The Leak (Noise Traders)
  *   **Objective:** Show that trade requires a break in the informational link between "willingness to trade" and "private information."
  *   **Alteration:** 4 students are **Forced Sellers** (Noise Traders).
  *   **Contrast:** In Round 1, a Sell Order implied "I have bad news." In Round 2, a Sell Order implies "I have bad news OR I am forced."
  *   **Result:** The inference is diluted. A Red holder can buy from a Forced Seller without fearing adverse selection, because the seller's willingness is not fully informative.
  *   **Payoff:** Informed traders profit from liquidity traders.

  ### Round 3: The Preference (Private Values)
  *   **Objective:** Distinguish between *informational* efficiency and *allocative* efficiency.
  *   **Alteration:** Asset value depends on *who holds it* (Red = $2, Black = $0), not the external State.
  *   **Contrast:** Round 1 tested "Do you know something I don't?" Round 3 tests "Do you value this differently than I do?"
  *   **Result:** Trade is rational and efficient. A Black holder (Value $0) sells to a Red holder (Value $2). The price (e.g., $1.00) creates surplus for both. The "No-Trade" logic fails because my willingness to sell does not reveal information about *your* value, only my own preference.

  ## Debrief Script (Last 10 Minutes)
  1.  **Map Round 1:** "In Round 1, almost no one traded. Why? Because an offer is a signal. To accept an offer is to accept that the offerer has out-thought you. In a common-value world with common priors, that signal always moves the value against you enough to kill the profit."
  2.  **Map Round 2:** "Trade appeared when we broke the link between information and action. The 'Noise Traders' traded for reasons unrelated to information. This allowed informed traders to hide in the crowd."
  3.  **Map Round 3:** "Trade exploded when value was private. Here, trade isn't about who knows the truth; it's about who wants the asset more. This is the epistemological boundary of markets: they aggregate preferences easily, but aggregate information only when there is noise."
  4.  **Reveal:** "This is the **Milgrom-Stokey No-Trade Theorem (1982)**. It states that with common priors and common knowledge of rationality, no speculative trade occurs."

  ## Facilitator Cue Card
  *(Keep this in your pocket. Read only if the room stalls or spirals.)*

  1.  **If Round 1 is silent:** "Good. This is the data. Why is the board empty? Is it fear, or is it math?"
  2.  **If a trade happens in Round 1:** Pause the exchange. Ask the Buyer: "If they are rational, what card must they have to sell at this price? Does that change your value?"
  3.  **If Round 2 is silent:** "Remember the Liquidity Notes. Someone *has* to sell. Who is safe to trade with?"
  4.  **If Round 3 is slow:** "Does my selling tell you the asset is bad, or just that I don't like it?"
  5.  **Closing:** "Information is a curse. If you know I am rational, my offer tells you everything, and the deal dies."

  ## Troubleshooting: What Will Go Wrong

  **Case A: Enthusiastic Trade in Round 1.**
  *   *Diagnosis:* Students do not believe others are rational, or they ignore the fee/inference. They treat it as a game of chance.
  *   *Handling:* Do not stop the trade. Let it happen. In the debrief, calculate the *realized* profits. If the State was H, Buyers win. If L, Sellers win. Then ask: *"Ex-ante, before the State was revealed, did you have a positive expected profit?"* Walk through the Bayesian update. Show that conditional on the trade occurring, the EV was negative.
  *   *Distinction:* If they trade because they think others are *irrational*, the lesson still holds: "The theorem requires common knowledge of rationality. You just discovered that you don't trust your peers."

  **Case B: Paralysis in Round 2.**
  *   *Diagnosis:* Students are confused by the "Forced Seller" rule or fear the Instructor is trapping them.
  *   *Handling:* Remind them publicly: "Four of you have a penalty if you do not sell. You know who you are. The rest of you know that four of you are desperate." Encourage the non-forced students to bid aggressively.
  *   *Distinction:* If they sit on hands out of confusion, they won't trade in Round 3 either. If they trade in Round 3 but not 2, they understand the logic but doubt the noise.

  **Case C: The "Guru" Effect.**
  *   *Diagnosis:* One dominant student (usually an economist) figures it out immediately and explains it to the room, ruining the discovery.
  *   *Handling:* Pull that student aside during Round 1 setup. Ask them to play "Devil's Advocate" and try to trade anyway to test the market's resilience. Or, ask them to observe and take notes for the debrief rather than participating fully.

  ## Limitations: What This Activity Cannot Reproduce

  1.  **True Common Knowledge:** We simulated this with a pledge. In reality, I never *know* you are rational; I only assign a probability. The theorem breaks if that probability is < 100%. You must explain in the debrief that "Common Knowledge" is a mathematical idealization, not a psychological state.
  2.  **Unbounded Rationality:** The students had to do Bayesian updates. In the real world, cognitive costs prevent this depth of reasoning. The "silence" in Round 1 might be due to cognitive load, not equilibrium reasoning. You must supply this distinction in the debrief.
  3.  **Equilibrium Selection:** We assumed the "No-Trade" equilibrium. There are technically other equilibria in some game-theoretic formulations, but they are unstable. The activity forces the No-Trade outcome via the fee structure, but real markets might settle elsewhere due to conventions.
  4.  **The Cost:** The lesson costs the "realism" of the market. By slowing down the auction and adding fees, we made the inference visible. Real markets are too fast for this reasoning. You must tell them: *"In the wild, this reasoning happens in microseconds or not at all. We slowed it down to see the gears."*

