          *   I infer they might be Forced.
          *   Adverse selection is diluted. Trade becomes possible.

      *   *Round 3 (Private Values):*
          *   Asset pays $2.00 to Red holders, $0.00 to Black holders.
          *   State doesn't matter.
          *   Red holder values at $2.00. Black holder values at $0.00.
          *   Trade at $1.00 is mutually beneficial regardless of information.

      *   *Materials:*
