          *   *Distinction Power:* It explicitly provides a test: Find the reason. If the reason is "keeping cows out" and cows are gone, remove it. If the reason is "keeping tenants down," you identify the function (oppression) and can judge it. It seems to allow distinguishing function from power *if* the investigation reveals the motive. However, Chesterton assumes the motive was generally rational/benevolent ("the wisdom of our ancestors"). If the "reason" was purely power preservation, Chesterton might still say "know that before you remove it," but does it justify removal? Yes, if you understand the reason.

      *   **Burke (Reflections on the Revolution in France, 1790):**
          *   *Core Argument:* Society is a partnership across generations. Institutions are the result of slow accumulation of wisdom ("prejudice," "prescription"). Abstract reason is insufficient to redesign society.
          *   *Commitment:* Deference to inherited institutions because they embody collective wisdom tested by time. It is more substantive than Chesterton; it's not just "find out why," it's "presume the existing arrangement is good because it survived." It commits you to a presumption against radical innovation based on abstract theory.
          *   *Distinction Power:* This is the tricky part. Burke relies on *prescription* (long usage implies legitimacy). If an institution lasts because of power/interest (e.g., aristocratic privilege), Burke often defends those very privileges as part of the natural order or necessary stabilizers. He tends to conflate "what has lasted" with "what is useful/natural." The power critique (it lasts because the powerful keep it) is harder for Burke to answer because his test for legitimacy *is* longevity and acceptance within the historical continuum. He might argue that if it lasted, it fits the nature of the society, but this risks circularity (is/ought problem).

      *   **Comparison:**
          *   Are they the same? Superficially yes (caution against reform). Deeply no. Chesterton is epistemic/methodological (investigate first). Burke is ontological/metaphysical (the institution contains wisdom you cannot fully recover).
          *   Chesterton allows removal once the reason is known. Burke suggests the reason might *never* be fully known by a single mind, so deference remains stronger.

      *   **The Power/Interest Critique:**
          *   Chesterton: Helps identify the function. If the function is oppressive, you know it. But Chesterton might argue that even oppressive fences had a stabilizing reason.
          *   Burke: Struggles here. If survival = legitimacy, then successful oppression looks like legitimacy. Burke needs a normative standard beyond survival to distinguish "useful" from "entrenched power."

