  **Note on Mathematical Faithfulness**

  I am highly confident in the broad strokes of the independence results depicted: Gödel's constructible universe ($L$) satisfies the Continuum Hypothesis (CH), while Cohen's method of forcing allows for models where CH fails (hence the "intermediate cardinals"). The poem's allusions—"constructible realms" for $L$ and "forcing filters" for Cohen's generic sets—are standard terminology that a set theorist should recognise immediately.

  The point where I am least certain of faithfulness to the mathematics, rather than merely the mood, is the implication in the third stanza that forcing *necessarily* makes "bounds unwise" (violates CH). In reality, forcing can be used to preserve CH as well as violate it; it is the tool of independence, not solely of negation. However, given the poem's task is to enact the friend's anxiety that a "richer axiom" might settle the matter, and the user's counter that both models are valid, compressing forcing into the vehicle for the "intermediate" verdict serves the dramatic tension of the villanelle's refrains, even if it slightly simplifies the technical versatility of the method.
