      Furthermore, the problem is well-posed only if we assume the agent accepts the VNM axioms, particularly Independence and Continuity. These axioms enforce linearity: the value of a prospect is the sum of probability-weighted utilities. Under linearity, the only barrier to fanaticism is a cap on utility. If you reject the cap (believing saving $10^{100}$ lives is better than $10^{99}$), you accept unboundedness. The framing error lies in thinking "finite" means "safe." Finite numbers can be arbitrarily large. The fanaticism problem is about the *relationship* between probability decay and payoff growth. If payoffs can grow faster than probabilities shrink, the tail dominates. Your setup assumes boundedness protects you, but your own thought experiment demonstrates that you perceive the payoff scale as open-ended. To fix the framing, you must admit either your utility is unbounded, or you must identify where the marginal value of good truly hits zero.

      *What the Fanaticism Arguments Actually Rest On:*
      Recent formal arguments (e.g., by Beckstead, Thomas, Wilkinson) show that fanaticism does not depend on infinity. It rests on three plausible premises: (1) **Separability**: Choices should depend only on states where outcomes differ. (2) **Monotonicity**: If an option improves outcomes in some states without worsening others, it is preferred. (3) **Unboundedness**: For any finite value, there is a possible outcome better than it.
      Notice infinity is absent. "Unboundedness" here means no finite cap, not actual infinities. If you accept these three, you are a fanatic. You must accept that a sufficiently small probability of a sufficiently large good outweighs a certainty. The argument is that rejecting fanaticism forces you to violate one of these premises. For instance, if you say "ignore probabilities below $10^{-20}$," you violate Monotonicity or Continuity. You create a discontinuity where improving the payoff slightly doesn't change the decision, but crossing the probability threshold flips it entirely.
      The claim that this follows from "innocuous-looking principles" refers to these axioms. They seem necessary for coherent decision-making. If you reject Independence to avoid fanaticism, you become vulnerable to dynamic inconsistency (money pumps). If you reject Unboundedness, you must accept that there is a point where adding more happy lives adds zero value. The fanaticism result is robust because the axioms supporting it are foundational to rational choice theory. Your suspicion that something is being smuggled in is partially right: the smuggled item is the commitment to linear probability weighting across an open-ended value scale. But it is smuggled by the standard definition of rationality, not by the fanatic.

      *Candidate Repairs and What Each Costs:*
      You proposed a probability floor. This is known as "truncation." Its cost is high: it violates Continuity and makes you vulnerable to Dutch Books. An agent can construct a series of trades where you pay to move a probability from below the threshold to just above it, exploiting the discontinuous jump in valuation. It is indeed a fudge.
      Alternative 1: **Bounded Utility**. You enforce a hard cap on value. Cost: You must accept "satiation." Saving $10^{50}$ lives is no better than saving $10^{50} + 1$. This violates the "More is Better" intuition and complicates population ethics.
      Alternative 2: **Non-Linear Probability Weighting**. You weight probabilities sub-linearly (e.g., rank-dependent utility). Cost: You violate the Independence axiom. This complicates dynamic choice and may lead to preference reversals over time.
      Alternative 3: **Accept Fanaticism**. You bite the bullet. Cost: You must divert resources to low-probability, high-impact causes (like exotic x-risk mitigation) at the expense of certain, near-term good. It demands counterintuitive sacrifices based on highly speculative models.
      Alternative 4: **Epistemic Humility**. You argue that probabilities are never known precisely enough to justify the swap. Cost: This avoids the theoretical problem but not the practical one. If the model says $10^{-10}$, you still need a rule.
      There is no cost-free repair. Each option sacrifices a theoretical virtue or a moral intuition. The probability floor sacrifices coherence. Bounded utility sacrifices moral scope. Acceptance sacrifices common sense. You must choose which cost you are willing to bear.

      *What This Means for How I Should Act:*
      Do not train out your reluctance entirely; it serves as a heuristic against model error. In practice, probabilities for astronomical payoffs are never known with enough precision to justify swapping certain goods. However, theoretically, acknowledge that your boundedness claim is likely false. Adopt a hybrid approach: use expected value for manageable risks where probabilities are robust, but apply a "complexity penalty" or effective bound for speculative scenarios. Treat your intuition not as a bias to be eliminated, but as a constraint on the applicability of the model. You are entitled to hold that linear aggregation breaks down at extreme scales, provided you accept the accompanying theoretical costs.

