answer: |-
  Direct answer

  Your picture is incorrect. Fanaticism is not solely a pathology of infinite utility; it arises whenever expected value maximization interacts with an unbounded space of possible outcomes, even if every individual outcome is finite. If you acknowledge that payoffs can be arbitrarily large, sufficiently small probabilities will eventually swamp finite certainties under linear aggregation. A bounded utility function avoids this only if you enforce a hard saturation point where additional good ceases to have value, which contradicts the intuition that "more is better." Your reluctance is not merely bias; it signals a conflict between the axioms of expected utility theory and your considered judgments about risk. You cannot escape the problem by declaring values finite; you must modify the decision rule or accept the counterintuitive implications.

  Setting the problem up correctly

  To diagnose this properly, we must distinguish between bounded *outcomes* and bounded *utility*. You claim your values are bounded, yet you describe a case where a tiny probability wins because the payoff was "set high enough." This reveals a contradiction. If your utility function has a strict upper bound $U_{max}$, no payoff can exceed it. Consequently, for any certain benefit $C$, there exists a probability threshold $p < C/U_{max}$ below which the gamble loses. If you admit the payoff can always be set "high enough" to win, you are implicitly operating with an unbounded utility function, regardless of your verbal assertion.

  Furthermore, the problem is well-posed only if we assume the agent accepts the VNM axioms, particularly Independence and Continuity. These axioms enforce linearity: the value of a prospect is the sum of probability-weighted utilities. Under linearity, the only barrier to fanaticism is a cap on utility. If you reject the cap (believing saving $10^{100}$ lives is better than $10^{99}$), you accept unboundedness. The framing error lies in thinking "finite" means "safe." Finite numbers can be arbitrarily large. The fanaticism problem is about the *relationship* between probability decay and payoff growth. If payoffs can grow faster than probabilities shrink, the tail dominates. Your setup assumes boundedness protects you, but your own thought experiment demonstrates that you perceive the payoff scale as open-ended. To fix the framing, you must admit either your utility is unbounded, or you must identify where the marginal value of good truly hits zero. Additionally, you must acknowledge that "probability" in these cases is often epistemic rather than frequentist. When probabilities are subjective credences rather than objective frequencies, the requirement to treat them as exact multipliers becomes contestable. A well-posed question must account for this epistemic uncertainty. If you treat probabilities as robust estimates, EV works; if you treat them as speculative guesses, EV breaks. The tension is not just in the numbers, but in the applicability of the model to the world. You are treating the math as primary and the intuition as secondary, but the intuition exists because the math relies on idealizations that do not hold in reality.

  What the fanaticism arguments actually rest on

  Recent formal arguments (e.g., by Beckstead, Thomas, Wilkinson) show that fanaticism does not depend on infinity. It rests on three plausible premises: (1) **Separability**: Choices should depend only on states where outcomes differ. (2) **Monotonicity**: If an option improves outcomes in some states without worsening others, it is preferred. (3) **Unboundedness**: For any finite value, there is a possible outcome better than it.

  Notice infinity is absent. "Unboundedness" here means no finite cap, not actual infinities. If you accept these three, you are a fanatic. You must accept that a sufficiently small probability of a sufficiently large good outweighs a certainty. The argument is that rejecting fanaticism forces you to violate one of these premises. For instance, if you say "ignore probabilities below $10^{-20}$," you violate Monotonicity or Continuity. You create a discontinuity where improving the payoff slightly doesn't change the decision, but crossing the probability threshold flips it entirely.

  The claim that this follows from "innocuous-looking principles" refers to these axioms. They seem necessary for coherent decision-making. If you reject Independence to avoid fanaticism, you become vulnerable to dynamic inconsistency (money pumps). If you reject Unboundedness, you must accept that there is a point where adding more happy lives adds zero value. The fanaticism result is robust because the axioms supporting it are foundational to rational choice theory. Your suspicion that something is being smuggled in is partially right: the smuggled item is the commitment to linear probability weighting across an open-ended value scale. But it is smuggled by the standard definition of rationality, not by the fanatic. The feeling of smuggling arises because human cognition treats very small probabilities as zero for heuristic purposes. We evolved to ignore lightning-strike risks when making daily plans. EV theory demands we do not. The "innocuous" principles are innocuous only in bounded contexts. When extended to the limit, Independence implies that a tiny chance of a miracle outweighs a certainty of bread. This clashes with the "Precautionary Principle" intuition. The argument rests on the idea that rationality is context-invariant. If you accept the axioms for small stakes, logic forces you to accept them for large stakes. There is no middle ground where the axioms apply only sometimes. This is why the argument is powerful: it shows that your reluctance is not just a local bias, but a rejection of the global structure of expected utility theory. You cannot keep the theory for normal cases and discard it for mugging cases without introducing arbitrariness.

  Candidate repairs and what each costs

  You proposed a probability floor. This is known as "truncation." Its cost is high: it violates Continuity and makes you vulnerable to Dutch Books. An agent can construct a series of trades where you pay to move a probability from below the threshold to just above it, exploiting the discontinuous jump in valuation. It is indeed a fudge.

  Alternative 1: **Bounded Utility**. You enforce a hard cap on value. Cost: You must accept "satiation." Saving $10^{50}$ lives is no better than saving $10^{50} + 1$. This violates the "More is Better" intuition and complicates population ethics.

  Alternative 2: **Non-Linear Probability Weighting**. You weight probabilities sub-linearly (e.g., rank-dependent utility). Cost: You violate the Independence axiom. This complicates dynamic choice and may lead to preference reversals over time.

  Alternative 3: **Accept Fanaticism**. You bite the bullet. Cost: You must divert resources to low-probability, high-impact causes (like exotic x-risk mitigation) at the expense of certain, near-term good. It demands counterintuitive sacrifices based on highly speculative models.

  Alternative 4: **Epistemic Humility**. You argue that probabilities are never known precisely enough to justify the swap. Cost: This avoids the theoretical problem but not the practical one. If the model says $10^{-10}$, you still need a rule.

  There is no cost-free repair. Each option sacrifices a theoretical virtue or a moral intuition. The probability floor sacrifices coherence. Bounded utility sacrifices moral scope. Acceptance sacrifices common sense. You must choose which cost you are willing to bear. Consider the probability floor again. If your threshold is $10^{-20}$, and I offer you a deal with probability $10^{-20} + \epsilon$, you accept. If I offer $10^{-20} - \epsilon$, you reject. I can charge you a fee to switch from the reject state to the accept state, even though the objective difference is negligible. This is irrational behavior by standard lights. Regarding bounded utility, the cost is not just ethical; it is mathematical convenience. Many convergence theorems rely on unboundedness. Regarding acceptance, the cost is resource allocation. If you are a fanatic, you should arguably ignore almost all current suffering to focus on reducing the probability of human extinction by microscopic amounts, assuming the future is vast. This is the "longtermist" conclusion. It is not necessarily wrong, but it is demanding. The "cleaner" repair depends on what you value more: formal coherence or moral common sense. There is no free lunch.

  What this means for how I should act

  Do not train out your reluctance entirely; it serves as a heuristic against model error. In practice, probabilities for astronomical payoffs are never known with enough precision to justify swapping certain goods. However, theoretically, acknowledge that your boundedness claim is likely false. Adopt a hybrid approach: use expected value for manageable risks where probabilities are robust, but apply a "complexity penalty" or effective bound for speculative scenarios. Treat your intuition not as a bias to be eliminated, but as a constraint on the applicability of the model. You are entitled to hold that linear aggregation breaks down at extreme scales, provided you accept the accompanying theoretical costs. In the specific case of the mugger, your reluctance is justified because the probability estimate is not robust—it is essentially made up. In cases where probabilities are empirically grounded (e.g., asteroid deflection), EV maximization is safer. Distinguish between *structural* fanaticism (theoretical) and *epistemic* fanaticism (trusting bad numbers). Your action guide should be: maximize EV when the model is robust; defer to heuristics when the model relies on speculative tails. This preserves the utility of EV theory without succumbing to its pathological edge cases.
