  The principle

  A claim qualifies as pseudoscience when its proponents adopt the rhetorical authority of science while systematically insulating the core hypothesis from the field's standard mechanisms of error correction. This insulation occurs not merely through untestability, but through the strategic relocation of goalposts following negative results, without generating novel, risky predictions that compensate for the evasion. Legitimate speculation, even when unorthodox or currently untestable, remains embedded within a productive research program that respects disciplinary standards of evidence and admits the possibility of refutation. The distinction lies not in the current truth value or acceptance level, but in the trajectory of the defense: does the argument evolve to accommodate data rigorously, or does it evolve solely to survive it? Pseudoscience degenerates into ad hoc preservation; normal science progresses toward resolution, even if slowly. Crucially, the claim must offer a path for others to verify or falsify, rather than closing paths to protect the claimant. This ensures that orthodoxy alone does not define legitimacy, nor does rejection guarantee fraud. It focuses on whether the work opens paths for others to verify or closes them to protect the claim.

  What each clause is for

  The clause regarding "rhetorical authority" isolates cases like (4) and (7), where scientific language masks a refusal to accept negative trials. Homeopathy and the dietary theory use the veneer of testing while rejecting the outcome, claiming authority without accountability. The "goalpost relocation" clause targets (6) and your new particle case, marking the transition from error to pseudoscience when replication failure meets shifting parameters rather than methodological correction. Cold fusion became pseudoscience only when the defense prioritized survival over verification, shifting from "we found something" to "you can't measure it." The requirement for "novel, risky predictions" saves (5); multiverse theories arise from mathematical consistency in string theory, offering internal coherence even if external testing lags, unlike (1), where statistics are retrofitted to force a conclusion without new predictive power. New Chronology uses math as decoration, not discovery; it explains everything past, nothing future. The "productive research program" clause is crucial for separating (2) from (3). Wegener lacked a mechanism but engaged geology's core problems; ancient astronauts bypass archaeology's standards entirely. Wegener sought a mechanism within physics; aliens invoke a miracle outside it. Wegener's claim was a puzzle for colleagues to solve; aliens' claim is a conversation stopper. Finally, "respects disciplinary standards" validates (8); the historian uses archival norms, whereas (1) imposes external mathematical patterns that ignore historical context. This framework prioritizes methodological behavior over current consensus, ensuring that orthodoxy alone does not define legitimacy, nor does rejection guarantee fraud. It focuses on whether the work opens paths for others to verify or closes them to protect the claim, distinguishing the stubborn pioneer from the protected dogma. The emphasis on the "trajectory of the defense" ensures that early errors, like Wegener's missing mechanism, are not penalized as heavily as entrenched evasion. It captures why (3) is heroic while (2) is hollow.

  Verdicts on the case I didn't give you

  Your particle physics case is pseudoscience. While searching for null results is normal, decade-long parameter shifting without independent verification mimics the dietary theory (7). It violates the "goalpost relocation" clause; the group protects the hypothesis rather than testing it. They claim scientific authority but evade the field's corrective mechanism (replication). Normal science accepts null results and moves on or changes theory. This group changes the target to keep the theory alive.

  My invented case: A psychology clinic claims a therapy cures depression. When patients don't improve, clinicians argue the patients "resisted subconsciously." When patients worsen, it is framed as "healing crisis." This is pseudoscience. It fits the "insulating" clause perfectly; every outcome confirms the theory.

  Strain point: The principle strains when applied to (5) Multiverse. If string theory never yields testable predictions, does it become pseudoscience by this definition? The principle relies on "productive research program," but productivity is subjective. If the math remains elegant but empirically barren for a century, the line blurs between (5) and (1). The principle requires judging "potential" vs "evasion," which is often only clear in hindsight. We risk labeling hard problems as pseudoscience simply because they are hard.

  Which of my verdicts I have to give up

  I uphold most of your ledger, but verdict (6) requires splitting. You cannot label "Cold Fusion" monolithically. The initial announcement was bad science; the subsequent decades of defense are pseudoscience. Your ledger treats it as one entity, but the principle demands temporal precision. You must update your verdict to reflect that the *claim* was scientific (however erroneous), while the *movement* is pseudoscientific. Additionally, verdict (5) is vulnerable. If the multiverse remains untestable forever, it risks sliding into (1). You should soften (5) from "not pseudoscience" to "provisionally legitimate." This acknowledges that legitimacy is contingent on future productivity, not just current mathematical elegance. If string theory yields no empirical hooks in fifty years, your verdict must flip. This trade protects the principle from becoming too permissive toward high-status speculation. It forces you to admit that prestige does not grant immunity from the pseudoscience label if the work ceases to engage with reality. You gain a sharper tool for (6) and (5) at the cost of certainty. You must accept that some verdicts are time-sensitive, not permanent.
