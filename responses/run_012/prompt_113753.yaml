answer: |-
  **Exam Question (25 Marks)**

  **1. The Fitting-Attitude Analysis and the Wrong Kind of Reasons**

  The Fitting-Attitude (FA) analysis claims that for something to be valuable is just for it to be the fitting object of a pro-attitude (e.g., admiration, desire, or valuing belief). A standard objection to this analysis is the Wrong Kind of Reasons (WKR) problem: there are cases where we have decisive reasons to hold an attitude toward an object, even though the object lacks the relevant value.

  Consider the following case involving an art critic and a neglected painter, Vos:

  *   **The Setup:** A foundation offers a critic a lucrative fellowship. The funds are released only if, at year's end, she sincerely believes Vos is a *major artist*. She cannot simply choose to believe this; she must come to the belief through standard epistemic routes.
  *   **Version 1:** Motivated by the money, the critic examines Vos's paintings closely. This close looking reveals genuine aesthetic merits she previously missed. By December, she believes Vos is major, tracing this belief to the merits, not the money.
  *   **Version 2:** The foundation's public announcement makes Vos's work a *cause celebre* regarding arts funding. The paintings now have genuine historical significance (an object property) they lacked before. Nothing about their aesthetic quality has changed. The critic believes Vos is major based on this historical significance.

  In a focused essay, answer the following:
  (a) Identify precisely which claim of the FA analysis the WKR objection threatens. Explain why this threat requires "fitting" to be read as something weaker than "supported by reasons," and specify what that weaker reading must be.
  (b) Apply your preferred solution to the WKR problem to **both** versions of the case. In Version 1, is the belief rationally defective? Is the money a reason for the attitude or an action? In Version 2, does the fact that the reason is *object-given* settle the matter, or does the trap remain?
  (c) Conclude whether the WKR objection shows the FA analysis is false or merely that it requires a principled restriction. If the latter, briefly address the circularity worry.

  ***

  **Model Answer (Strong Second-Year Graduate Level)**

  The Fitting-Attitude (FA) analysis proposes a biconditional: $X$ is valuable if and only if it is fitting to have a pro-attitude toward $X$. The Wrong Kind of Reasons (WKR) objection threatens the "only if" direction. It suggests one can have sufficient reasons to hold an attitude toward $X$ without $X$ being valuable. If "fitting" simply means "supported by sufficient reasons," the Demon or Fellowship cases show the analysis fails: the threat or bribe provides sufficient reason for the attitude, yet the object (the Demon or Vos) gains no actual value.

  To save the analysis, "fitting" cannot mean merely "supported by reasons." It must mean "supported by reasons of the *right kind*." This weaker reading distinguishes between reasons that bear on the object's value (right kind) and reasons that bear on the benefits of holding the attitude (wrong kind). The FA analysis thus becomes: $X$ is valuable iff there are right-kind reasons to value $X$.

  Applying this to Version 1, the fellowship money is a pragmatic reason. It is not a reason to *believe* Vos is major; it is a reason to *act* in ways that might produce that belief (e.g., looking closely). Once the critic looks closely, her belief is supported by aesthetic merits. Therefore, the belief is not rationally defective. The money explains the *causal history* of the inquiry, but the *justification* for the belief rests on the merits. This preserves the FA analysis: the fittingness tracks the aesthetic value discovered, not the bribe that initiated the search. The "reason for action" move successfully isolates the WKR here.

  Version 2 is more difficult. Here, the reason is the paintings' historical significance. This is an object-given reason (it concerns a property of the paintings), not a state-given reason (it does not concern the benefit of believing). A crude Parfitian solution equates "object-given" with "right-kind." If we accept this, we must say the belief is fitting because the paintings are historically significant. But this is counterintuitive: historical significance does not make one a *major artist* in the aesthetic sense required by the fellowship. The trap is assuming all object-given reasons are right-kind reasons for *this specific attitude*. Historical significance is a reason to value the paintings *historically*, not *aesthetically*.

  Therefore, the "object-given" criterion is insufficient. We need a substantive restriction: right-kind reasons must track the specific value property in question. In Version 2, the reason tracks historical value, not aesthetic value. Consequently, the belief that Vos is aesthetically major is not fitting, despite the object-given reason.

  This suggests the FA analysis is not false but requires restriction. The circularity worry claims we cannot define "right kind" without already knowing what is valuable. However, we can avoid vicious circularity by specifying the domain of value independently. We can say right-kind reasons for aesthetic value are those grounded in aesthetic properties, without presupposing which objects possess them. Thus, the FA analysis survives as a structural claim about value, provided it is restricted to domain-specific reasons. The WKR objection does not destroy the analysis; it refines the definition of "fitting."

  ***

  **Marking Scheme (25 Marks Total)**

  **1. Identification of the Threatened Claim (5 Marks)**
  *   **5:** Identifies that the "only if" direction (or the sufficiency claim) is threatened. Explains that if Fitting = Reason-Supported, WKR cases make valueless objects count as valuable.
  *   **0-4:** Vaguely says "FA is threatened" without isolating the biconditional direction or the definition of fitting.
  *   *Common Mistake:* Claiming the "if" direction is the problem (i.e., that valuable things might not be fitting).

  **2. The "Weaker Reading" of Fitting (5 Marks)**
  *   **5:** Explicitly states "fitting" must mean "supported by *right-kind* reasons," not just "supported by reasons." Explains this distinction is necessary to exclude pragmatic/threat-based reasons.
  *   **0-4:** Mentions "right kind" but fails to explain why the simple "reason-supported" definition fails in the context of the case.
  *   *Common Mistake:* Confusing "right kind" with "stronger reasons" rather than a different *type* of reason.

  **3. Application to Version 1 (Action vs. Attitude) (5 Marks)**
  *   **5:** Correctly identifies the money as a reason for *action* (looking), not the *attitude* (belief). Concludes the belief is justified by merits, not money, so FA holds.
  *   **0-4:** Says the belief is defective because of the bribe, or fails to distinguish the reason for looking from the reason for believing.
  *   *Common Mistake:* Arguing the belief is irrational simply because the *motivation* was financial (confusing genesis with justification).

  **4. Application to Version 2 (The Object-Given Trap) (5 Marks)**
  *   **5:** Recognizes that while the reason is object-given, it is still the *wrong kind* for *aesthetic* judgment. Rejects the equation of Object-Given = Right-Kind.
  *   **0-4:** Accepts that because the reason is object-given (historical significance), the belief is fitting. Falls for the trap.
  *   *Common Mistake:* Assuming Parfit's distinction solves the problem automatically without checking if the object-property matches the attitude-type.

  **5. Verdict and Circularity (5 Marks)**
  *   **5:** Concludes FA needs restriction, not abandonment. Addresses circularity by noting we can define reason-types by domain (aesthetic vs. historical) without knowing specific values.
  *   **0-4:** Concludes FA is false, or claims the restriction is viciously circular without qualification.
  *   *Common Mistake:* Dismissing the FA analysis entirely because of the WKR, rather than treating it as a refinable framework.

  ***

  **Differentiation: A vs. B Work**

  **The A Answer:** The distinguishing feature of an A response is how it handles **Version 2**. An A student will spot that "object-given" is not a silver bullet. They will argue that a reason can be about the object (historical significance) but still be the wrong *kind* for the specific attitude required (aesthetic admiration). They will explicitly decouple the *type* of value (historical) from the *type* of attitude (aesthetic judgment). They will also handle the circularity objection with nuance, suggesting a domain-relative restriction rather than a global definition of value.

  **The B Answer:** A B response (scoring ~15-16) typically nails Version 1 (the action/attitude distinction) and defines the WKR correctly but **falls into the Version 2 trap**. They will correctly identify the historical reason as "object-given" and then incorrectly conclude that this automatically makes it a "right-kind" reason, thereby validating the belief as fitting. They treat Parfit's distinction as a rigid algorithm rather than a heuristic. Alternatively, they may handle the case well but fail to address the circularity worry in part (c), leaving the restriction unjustified. The B student sees the tools; the A student sees the limits of the tools.
