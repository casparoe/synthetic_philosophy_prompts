answer: |-
  **PROSPERITY MUTUAL // INTERNAL MEMO 44-B**
  **TO:** All Claims Adjusters, HR Personnel, Risk Assessment
  **FROM:** Causal Closure Compliance Desk (CCCD)
  **SUBJECT:** FAQ: Causal Hygiene and Claim Adjudication

  **1. What is the operational definition of "Causal Hygiene"?**
  Prosperity Mutual policy prohibits systematic overdetermination in claim processing. According to the Principle of Causal Closure, every physical event (e.g., a fractured tibia, a server fire, a vehicle collision) has a sufficient physical cause. If a physical cause is sufficient, citing a distinct mental cause (e.g., "negligence," "intent," "poor judgment") constitutes double-counting. We do not pay for causes twice. Adjusters must identify the sufficient physical antecedent. If the neural correlates of a decision are present, the decision itself is redundant for payout purposes.

  **2. How do we handle performance grievances involving "intent"?**
  Refer to Case #892 (Henderson v. Regional Management). The employee contested a denied promotion, arguing her *intention* to exceed quotas was the primary cause of her sales performance. This claim was denied under Section 4 of the Hygiene Protocol. The employee was offered two compliant interpretations:
  *   **Identity:** Her intention was identical to her neural state. In this case, the neural state caused the sales, and "intention" is merely a label for that state. She was compensated for the physical labor, not the label.
  *   **Exclusion:** Her intention was a distinct mental event. In this case, since the neural state was sufficient to cause the sales, the intention was causally inert. It did nothing.
  We cannot promote based on events that did nothing. Future reviews should focus on synaptic efficiency and attendance logs rather than stated motivations.

  **3. If mental states don't cause actions, why do we hold training seminars?**
  Training modifies the physical structure of the brain. The *experience* of learning is epiphenomenal, but the neural restructuring is physical and causal. Instructors should avoid language implying that "understanding" leads to "improved performance." Instead, state that "auditory input triggers structural reorganization which yields improved performance." The feeling of understanding is a byproduct, not a mechanism. Do not test for comprehension; test for behavioral output.

  **4. Why do we retain external consultants if their advice is causally excluded?**
  Consultants are retained for correlational assurance. While their recommendations do not cause management decisions (which are determined by prior physical states in the board's neural architecture), their presence correlates with higher shareholder confidence. They are paid for their physical presence in the room, which is a valid physical cause of morale stabilization. Their speech acts are not entered into the minutes as causal factors.^1

  **5. Can I cite "reasons" in internal emails?**
  You may use reason-language ("I did X because I wanted Y") as shorthand, provided it is understood as fictionalist discourse. Do not cite reasons in legal affidavits or claim denials. If a claimant says, "I slipped because I wasn't paying attention," correct the record to: "The claimant's visual cortex failed to process the wet floor signage due to neural fatigue." The former suggests a mental cause; the latter identifies the sufficient physical cause. Precision protects us from overdetermination liability.

  ***

  ^1 *Note regarding "Epiphenomenal Consultants":* Senior partners are reminded that while consultants do not causally influence outcomes, their removal may disrupt the physical chain of events leading to successful quarterly reports. Treat them as necessary ornaments. Do not ask them for input during live decision windows; this creates the illusion of efficacy which violates Hygiene standards.
