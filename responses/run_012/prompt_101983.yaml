answer: |-
  # The Monument Decision Tree
  **Instructions:** Start at **Question 1**. Follow the arrow that matches your honest answer. When you hit a **Box**, that is your position. Read the definition to see what you actually believe.

  ### Q1: The Principle of Honor
  **If we found out a historical hero did something genuinely evil, should *anyone* like that get a statue in a public square?**
  *   **NO:** Public spaces shouldn't honor flawed humans at all.
      *   ➔ **[LEAF 1: Monument Abolitionist]**
  *   **YES:** Some people deserve honor even if they weren't perfect.
      *   ➔ *Go to Q2*

  ### Q2: The Moral Math
  **Does one truly terrible act cancel out a lifetime of good achievements?**
  *   **YES:** A single moral veto removes their right to be honored.
      *   ➔ **[LEAF 2: Moral Purist]**
  *   **NO:** We have to weigh the whole record, good and bad together.
      *   ➔ *Go to Q3*

  ### Q3: The Active Harm
  **Does the statue hurt people *today* (like an active insult), or is it just a rock whose meaning is frozen in the past?**
  *   **ACTIVE INSULT:** It keeps doing damage every day it stays up.
      *   ➔ *Go to Q4*
  *   **FROZEN HISTORY:** It's just a record of who was important back then.
      *   ➔ *Go to Q5*

  ### Q4: The Fix (For Active Harm)
  **If it's hurting people, can we fix it by adding a plaque or moving it to a museum?**
  *   **YES (Plaque):** Context explains the harm and neutralizes it.
      *   ➔ **[LEAF 3: Contextualist]**
  *   **YES (Museum):** It belongs in history class, not on a pedestal.
      *   ➔ **[LEAF 4: Relocationist]**
  *   **NO:** Mitigation is a cop-out; the honor is the problem.
      *   ➔ *Go to Q6*

  ### Q5: The Medium (For Frozen History)
  **Is a street name different from a statue? (e.g., Streets are addresses/utility, Statues are pure honor)**
  *   **YES:** Keep the street (too much hassle/cost), move the statue.
      *   ➔ **[LEAF 5: Pragmatic Retentionist]**
  *   **NO:** They are both public honors and should be treated the same.
      *   ➔ *Go to Q6*

  ### Q6: The Promise
  **Is keeping the monument a promise we made to the future to remember history accurately, even when it's ugly?**
  *   **YES:** Taking it down breaks a contract with the future.
      *   ➔ **[LEAF 6: Historical Preservationist]**
  *   **NO:** That's romantic nonsense; the living decide what stays.
      *   ➔ *Go to Q7*

  ### Q7: The Dead
  **Do the dead have any stake in this? Can you wrong a person who is gone?**
  *   **YES:** We owe respect to their legacy even if they can't feel it.
      *   ➔ **[LEAF 7: Legacy Guardian]**
  *   **NO:** Dead people have no rights; the current community decides.
      *   ➔ **[LEAF 8: Community Sovereign]**

  ***

  ## The Positions (Leaves)

  1.  **Monument Abolitionist:** Public squares are for art or events, not for worshipping flawed humans. No one passes the test.
  2.  **Moral Purist:** One unforgivable act (e.g., human experimentation) voids all achievements. The statue must go.
  3.  **Contextualist:** The statue stays, but we add signage or art that tells the full truth. Education fixes the harm.
  4.  **Relocationist:** The statue is historically significant but morally toxic in public. Move it to a museum where context is guaranteed.
  5.  **Pragmatic Retentionist:** Statues are honors (remove them); Streets are utilities (keep them). Don't rename streets because of the cost/mail headache.
  6.  **Historical Preservationist:** Removing the statue erases history. We keep it as a warning or a record, regardless of feelings.
  7.  **Legacy Guardian:** It is disrespectful to judge the dead by today's standards. They earned their place; let them rest.
  8.  **Community Sovereign:** The past doesn't get a vote. If the current town finds it offensive, it comes down, regardless of history or promises.

  ***

  ## Instructor Notes: Fault Lines & Flags

  ### ⚠️ Indistinguishable Positions
  **Historical Preservationist (Leaf 6)** and **Legacy Guardian (Leaf 7)** often vote the same way (Keep the statue), but for different reasons.
  *   *Preservationists* care about the **Future** (don't erase history).
  *   *Legacy Guardians* care about the **Past** (respect the dead).
  *   *Why it matters:* In a debate, these two allies might fight if the solution involves moving the statue to a museum. The Preservationist might agree (history is kept), but the Legacy Guardian might object (it's disrespectful displacement).

  ### 🚩 The Incoherent Position
  There is a common position this tree *filters out*: **"The Honorless Honor."**
  *   *The View:* "We keep the statue, but insist it's not an honor, just a neutral fact."
  *   *Why it's incoherent:* Statues are inherently honorific by design (cost, placement, material). Claiming a statue is "neutral" contradicts the medium itself. If a student tries to hold this, ask them: *"If it's not an honor, why is it a statue and not a textbook?"*

  ### 💡 The "Nobody Defends This" Leaf
  You might notice there is no leaf for **"Keep the statue but rename the street"** (or vice versa) without a pragmatic reason.
  *   *Why:* Most people treat streets and statues consistently based on their moral view. Only the **Pragmatic Retentionist** splits them based on *cost/utility*. If someone splits them based on morals alone (e.g., "The scientist's views are okay for a street but not a statue"), they usually haven't thought it through. Push them to find the principle.

  ### 📏 Branch Count Check
  *   **7 Branch Points** (Questions 1–7).
  *   **8 Leaves** (Positions 1–8).
  *   **All User Fault Lines Covered:**
      *   *Worst act vs. Record:* Q2.
      *   *Active vs. Frozen:* Q3.
      *   *Street vs. Statue:* Q5.
      *   *Plaque/Museum:* Q4.
      *   *Rights of Dead:* Q7.
      *   *Promise to Future:* Q6.
      *   *Nobody deserves monuments:* Q1.
