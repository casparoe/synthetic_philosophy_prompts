  Lou (Lewisian) and Ev (Evolutionist) watch a crowd exit a building. Everyone uses the left door.

  Lou: "Classic convention. Arbitrary solution. Held together by common knowledge."
  Ev: "Or the right door sticks. People just follow the path of least resistance."
  Lou: "Resistance isn't enough! I need to know that you know that I know we'll use the left."
  Ev: "Okay. I know you know I know. Do you know I know you know I know?"
  Lou: "Yes, iterated indefinitely. It's the only thing preventing chaos."
  Ev: "Indefinitely? So while we stand here verifying the tenth-order knowledge..."
  Lou: "We ensure the stability of the norm!"
  Ev: "...the left door is locked."
  (Crowd immediately switches to the right door without speaking.)
  Lou: "Wait! The convention! The expectations!"
  Ev: "Relax. They just updated their priors. No common knowledge required."
  Lou: "But the regularity changed!"
  Ev: "Sure. New equilibrium. Same crowd. You keep counting the 'knows'; I'll count the people who made it outside."

  **Why it lands, where it doesn't**

  The joke pits Lewis's epistemic requirement against the evolutionary claim that behavior stabilizes without it. Lou embodies the Lewisian view: conventions are arbitrary regularities sustained by mutual expectations iterated to common knowledge. Both agree the choice of door is arbitrary, but disagree on the glue. Lou's panic when the door locks highlights the theoretical fragility—if the knowledge state changes, the convention should theoretically unravel. Ev embodies the evolutionary critique: regularities are equilibria selected by local success, not reasoned agreement. The punchline lands because the crowd coordinates perfectly on a new arbitrary solution without establishing the infinite "knows" Lou demands, suggesting common knowledge is a philosopher's idealization rather than a psychological reality.

  However, the joke fudges Lewis's actual view. Lewis doesn't require agents to consciously verify infinite iterations; common knowledge is a structural condition of the situation, not a mental checklist Lou must complete. Similarly, the evolutionary account isn't purely mindless; agents usually track payoffs, not just mimicry. By making Lou actively count "knows," the joke caricatures the epistemic burden to create comedic tension, overstating the impracticality of Lewis's account while understating the cognitive sophistication required for evolutionary stability.
