answer: |-
  Good evening.

  For eleven years, I have sat in the radio room. I know the sound of this harbour in a gale better than I know the sound of my own house. But I have never pulled anyone from the water. I am the voice that sends the boat out; I am not the hand that reaches down. That distinction matters to me, because it means I have had a lot of time to listen, and a lot of time to think about the numbers.

  We are here to celebrate fifty years. But as you know, there is a motion on the agenda. The Treasurer has asked us to wind up the club. Sell the boat. Give the endowment to a charity that fights malaria or distributes bed nets.

  His argument is clear. It is the argument of the drowning child. If you walk past a pond and see a child drowning, you wade in. You ruin your shoes, you get wet, but you save the life. Distance doesn't matter. If we can save a life for £2,000 overseas, and it costs us £400,000 to keep this boat ready for a rescue that might not happen for another decade, the arithmetic is brutal.

  I am not going to stand here and tell you the arithmetic is wrong. It isn't. If the only question tonight is, "What is the most efficient machine for preventing death per pound sterling?" then the Treasurer wins. I believe that. Half this room knows I believe that. To pretend otherwise would be to lie to you, and to insult the intelligence of the people who taught us how to navigate by the stars.

  But I believe there are two questions on the table tonight, and we are in danger of answering the second one before we have properly asked the first.

  The first question is: *Is this the best possible use of £400,000 to save lives globally?*
  The answer is probably no.

  The second question is: *Should there be people in this town who are on call for their neighbours, as a standing fact about who we are?*
  That is a different question. It is not a question of efficiency. It is a question of identity.

  If we pass the Treasurer's motion, we do a great good. There is no shame in that. But we also end a promise.

  For fifty years, this club has said to everyone who lives within sight of this headland: "You are not alone out there." It is a specific kind of promise. It isn't insurance. You don't pay a premium. It isn't a state service. We aren't paid. It is a covenant between neighbours. It says that if the sea takes you, the people you buy your bread from, the people who fix your boiler, the people who teach your children, will come and get you.

  That changes the town. Even if the boat never leaves the harbour, the *knowledge* that it is here changes how we live. It changes what we owe each other.

  To call this a "hobby" is to misunderstand the nature of the work. A hobby is something you do for pleasure. This is something you do for readiness. It is the discipline of being available. It is the willingness to have your dinner interrupted, your sleep broken, your safety risked, for a stranger. That is not a pastime. That is a civic virtue.

  I know there are two men in this room who went into the harbour in 1994. The sea was doing what the sea does. You came back with a girl. She is someone's mother today. She is not a statistic in a global ledger. She is here, or her children are, or her friends are.

  If we follow the logic of pure efficiency, we have to ask: Was that rescue "worth it" compared to the bed nets we could have bought with the fuel and the maintenance? It is a terrible question to ask. But it is the question the motion forces us to answer.

  My answer is this: We cannot live our lives solely as calculators of global utility. We must also live as members of a place.

  If we dissolve this club, we save lives far away. I accept that. But we also signal that the bond between neighbours is no longer valuable enough to maintain. We signal that proximity means nothing. That the specific duty we owe to the people we share a shoreline with is negotiable.

  I am not asking you to vote against the charity. The charity is good. The logic is sound.
  I am asking you to vote for the boat, not because it is the most efficient tool in the world, but because it is *our* tool.

  We are not here to maximize a global spreadsheet. We are here to maintain a watch.

  To the volunteers: You have not been wasting time. You have been keeping a light on. In a world that is increasingly abstract, where our money does its good work invisibly in accounts we never see, you have kept something physical. You have kept a promise that requires your actual bodies, your actual time, and your actual presence.

  That has value. It has value even if the radio stays silent for five years. It has value even if the math says we could have done more elsewhere. Because the value isn't just in the lives saved. It is in the people who are willing to save them.

  So, when you vote, do not vote as if you are trying to prove the Treasurer wrong about the math. He is right about the math.
  Vote as if you are deciding what kind of town this is.

  Do we want to be a place that simply sends money to the needy? Or do we want to be a place where, when the siren sounds, people stop what they are doing and run toward the water?

  I know which town I want to live in. I know which promise I want to keep.

  Thank you.
