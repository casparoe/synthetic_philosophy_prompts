      *   **Argument:** Based on Peter Singer's "Drowning Child" analogy (effective altruism).
      *   **Speaker's Stance:** Acknowledges the logic of the Treasurer (doesn't believe the boat is mathematically better), but needs to argue for the club's continuation without lying or resorting to tribalism ("our own kind").
      *   **Key Constraints:**
          *   Don't claim the boat saves more lives per pound (it doesn't).
          *   Don't call the last 50 years a "hobby."
          *   Engage the drowning-child argument directly.
          *   Separate two questions: "Best use of £400k?" vs. "Should there be people on call for neighbors?"
          *   Leave volunteers (including specific rescuers from 1994) with something true/believable, not just consolation.
          *   **Audience:** 60 volunteers/families, Mayor, Donors, Moral Philosopher (watching for logical rigor).
          *   **Format:** After-dinner speech, 5-7 minutes, spoken word, no jargon.

  2.  **Deconstruct the Ethical Dilemma:**

      *   *The Treasurer's Point:* Effective Altruism. If £400k saves 200 lives globally vs. maybe 1 or 2 locally (over a long period), the math says give it away. The "drowning child" analogy suggests proximity doesn't matter morally.
      *   *The Counter-Point (without lying):* The value isn't just in the *math of lives saved*, but in the *social fabric of who we are*. The "on call" aspect is a civic good, a form of mutual insurance that binds a community. It's about *agency* and *relationship*, not just *outcome metrics*.
      *   *The Separation:* Question 1 (Efficiency) is utilitarian. Question 2 (Existence of the service) is deontological/virtue ethics/civic republican. They are different categories. You can admit Question 1 favors the charity while arguing Question 2 justifies the club.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the weight of the evening. 50 years. My role (radio). Acknowledge the Treasurer's motion directly. Don't shy away.
      *   **Addressing the Math (The Treasurer's Argument):** Validate it. Singer's pond. £2,000 vs. £400k. Admit the club isn't the most efficient machine for saving lives globally. This satisfies the Philosopher and the Treasurer.
      *   **The Pivot (The Two Questions):** Introduce the distinction. "Is this the best use of money?" vs. "Do we want to be a certain kind of town?"
      *   **The Value of "On Call":** What does it mean to have neighbors on call? It's not just the rescue; it's the *readiness*. It changes how we live. It's a promise.
      *   **The 1994 Rescue:** Mention the specific rescuers. The girl who is now a mother. This grounds the abstract in the real.
      *   **The "Hobby" Rebuttal:** It's not a hobby. It's a duty we chose.
      *   **The Conclusion:** A call to vote for the club, not because the math is better, but because the *promise* matters. Leave them with dignity.

  4.  **Refining the Tone:**

      *   Needs to be humble (I'm just radio).
      *   Needs to be serious but warm (after-dinner).
      *   Needs logical precision (for the philosopher) but emotional resonance (for the volunteers).
      *   Avoid clichés about "heroes."
      *   *Self-Correction during drafting:* I initially thought about arguing that local rescue prevents grief which has value. But that risks utilitarian calculus again. Better to focus on the *nature of the community*. The value is in the *willingness*, not just the *result*.
      *   *Check constraint:* "Never says the boat is a better use of money." Okay, I must explicitly say the charity might save more lives.
      *   *Check constraint:* "Never says it was a hobby." Use words like "commitment," "promise," "watch."

  5.  **Drafting - Step-by-Step (Mental or Scratchpad):**

      *   *Start:* Good evening. 50 years. I'm the voice on the radio.
      *   *The Elephant:* The Treasurer's motion. It's serious. It's based on good math.
      *   *The Singer Argument:* If I can save a child far away for cheap, should I? Yes. I agree.
      *   *The Distinction:* But there are two questions. One is arithmetic. One is about who we are.
      *   *The Community:* A town where people wait for the call. That has value beyond the body count.
      *   *The 1994 Crew:* You didn't save a statistic. You saved a person. That matters to *us*.
      *   *The Vote:* Don't vote for the boat because it's efficient. Vote for it because it's ours.

  6.  **Polishing for Spoken Word:**

      *   Short sentences.
      *   Pauses.
      *   Direct address ("John," "Sarah," "The Treasurer").
      *   Ensure the 5-7 minute timing (approx. 750-1000 words spoken at a moderate pace).

  7.  **Final Review against Constraints:**

      *   *Better use of money?* Admit charity is more efficient. (Check)
      *   *Not a hobby?* Call it a covenant/promise. (Check)
      *   *Engage Singer?* Yes, explicitly mention the logic. (Check)
