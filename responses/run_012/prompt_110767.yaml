  9.  **Word Count Check:** A 5-7 minute speech is roughly 800-1000 words. I need to ensure it's not too short. I will expand on the "what it means to be on call" section to give it weight.

  10. **Final Tweak:** Ensure the ending lands on the volunteers' dignity. They aren't failing the world by staying; they are upholding a specific local covenant.

