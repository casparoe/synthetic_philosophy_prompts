          *   *Correction:* The user wants them to feel the pull to change the card. So, Phase 3 needs to allow a *revision* opportunity.
          *   *Revised Flow:*
              1.  Write Policy (Free).
              2.  Assign Room (X or Y).
              3.  Reveal Payoff Matrix (It favors "Defect" locally but "Cooperate" globally).
              4.  Offer "Revision": Pay 5 points to change your action for *this* room on your card.
