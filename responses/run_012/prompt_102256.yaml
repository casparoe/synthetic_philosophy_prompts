      *   *Honesty:* I must tell the user this game simulates "Caring about Counterfactuals" (Ex-Ante Optimization) but not "Logical Correlation" (Acausal Trade). The game makes the counterfactual *causally* relevant via the scoring rules, whereas in UDT it's *logically* relevant.
      *   *Wait, is that true?* In Counterfactual Mugging, the payoff is causally dependent on the *prediction* of your policy. In this game, the payoff is causally dependent on the *written policy*. It's actually a very good simulation of the *structure* of the payoff, just without the "Predictor" magic. The "Card" acts as the Predictor.
