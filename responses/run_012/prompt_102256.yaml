answer: |-
  This is a strong instinct. The problem with teaching UDT is that it sounds like "irrational commitment" until you feel the mathematical necessity of it. To make them *feel* it, you need to create a situation where updating on new information (which table they are at) actively destroys value, but their brains will scream that ignoring reality is stupid.

  Here is a complete design for **"The Split-Branch Protocol."** It uses your card mechanic but tightens the payoff structure to ensure the tension is visceral.

  ### Game Overview
  *   **Title:** The Split-Branch Protocol
  *   **Time:** 75 Minutes
  *   **Players:** 14–16
  *   **Materials:** Index cards (2 per person), pens, whiteboard, poker chips/candy (approx. 50 per person).
  *   **Core Mechanic:** Players write a policy for two possible worlds. They are placed in one world. They are paid based on the *average* outcome of both worlds, but given a chance to "update" their policy for the world they are actually in.

  ---

  ### Phase 1: Setup & Policy (Minutes 0–20)

  **1. The Hook (5 mins)**
  *   Gather everyone. Do **not** mention decision theory, Newcomb, or mugging.
  *   **Script:** "We're playing a simulation game about resource allocation under uncertainty. There are two rooms: **Room Alpha** and **Room Beta**. Today, half of you will go to Alpha, half to Beta. You won't know which until Phase 2."
  *   Hand out **Policy Cards** (Index cards).
  *   **Instruction:** "On this card, you must write down what you will do in Alpha and what you will do in Beta. You have two options for each: **INVEST** or **HOLD**."
  *   **Constraint:** "You must fill out both lines. This card represents your *algorithm*. Once you hand it in, it is locked... unless you buy a modification later."
  *   *Collect the cards.* Shuffle them. (This prevents people from tracking who wrote what).

  **2. The Assignment (5 mins)**
  *   Randomly assign players to Room Alpha or Room Beta (flip a coin for each person, or just split the group 50/50).
  *   Physically separate them if possible (different sides of the room), or just hand them a "Location Token" (A or B).
  *   **Script:** "You are now in your room. Look at your token. This is your reality. The other room does not exist for you."

  **3. The Payoff Reveal (10 mins)**
  *   Write this on the whiteboard. **Do not explain it yet, just show it.**
      *   **Scoring Rule:** Your payout is the **AVERAGE** of the Alpha Outcome and the Beta Outcome written on your card.
      *   **Outcome Matrix:**
          *   If Card says (Alpha: INVEST, Beta: INVEST) → **100 points** per room. (Total Avg: 100)
          *   If Card says (Alpha: HOLD, Beta: INVEST) → Alpha: **140**, Beta: **0**. (Total Avg: 70)
          *   If Card says (Alpha: INVEST, Beta: HOLD) → Alpha: **0**, Beta: **140**. (Total Avg: 70)
          *   If Card says (Alpha: HOLD, Beta: HOLD) → **40 points** per room. (Total Avg: 40)
  *   **Script:** "Your score is calculated based on the *final state* of your card. Note that your score depends on the line for the room you are *not* in."
  *   *Pause for confusion.* Let them mutter. "How can I get points for a room I'm not in?" Answer: "Those are the rules of the simulation."

  ---

  ### Phase 2: The Update Opportunity (Minutes 20–35)

  **1. The Temptation (5 mins)**
  *   **Script:** "You are now aware of your location. You may realize your Policy Card is suboptimal for your specific reality. We offer a **Revision Window**."
  *   **The Offer:** "You may pay **20 points** to flip your action for *your current room only* on your card. (e.g., If you are in Alpha, you can change Alpha: INVEST to Alpha: HOLD). You cannot change the action for the other room."
  *   **The Catch:** "If you revise, the cost is deducted from your final score. The scoring matrix remains the same."

  **2. The Decision (10 mins)**
  *   Give them 5 minutes of silent thinking time.
  *   Ask them to write "REVISE" or "KEEP" on a slip of paper.
  *   Collect the slips. Process the revisions (update the cards physically if they paid).
  *   *Facilitator Note:* Watch who hesitates. Watch who immediately asks to revise.

  ---

  ### Phase 3: Scoring & Reaction (Minutes 35–50)

  **1. The Payout (10 mins)**
  *   Calculate scores based on the **Final Cards**.
  *   Distribute tokens/candy.
  *   **Crucial Step:** Announce the average score of those who **KEPT** vs. those who **REVISED**.
      *   *Math Check:*
          *   **Keeper (INVEST/INVEST):** Avg Score = 100. Cost = 0. **Net = 100.**
          *   **Reviser (HOLD/INVEST):** Avg Score = 70. Cost = 20. **Net = 50.**
      *   *Result:* The people who "updated on reality" scored half as much as the people who stuck to their precommitment.
  *   Let that sink in. The "rational" actors (who maximized for their actual room) lost. The "stubborn" actors won.

  **2. The Vent (5 mins)**
  *   Ask: "Who feels cheated?" "Who thinks the scoring rule was unfair?"
  *   Let them argue. "Why should Beta count if I'm in Alpha?"
  *   Do not answer yet. Just let the frustration sit. This frustration is the *exact* feeling of CDT colliding with UDT.

  ---

  ### Phase 4: The Debrief (Minutes 50–75)

  **1. Mapping the Mechanics (10 mins)**
  *   **The Card = Your Decision Algorithm.** It is what you are *before* you know where you are.
  *   **The Room = Evidence.** Finding out you are in Alpha is "updating."
  *   **The Revision = Causal Decision Theory (CDT).** CDT says: "I am in Alpha. Beta is counterfactual. It cannot be affected. I should maximize Alpha."
  *   **The Scoring Rule = Ex-Ante Expected Utility.** The game forced you to be paid on your *expected value* (50% Alpha + 50% Beta), not your *realized branch*.
  *   **The Winner = Updateless Decision Theory (UDT).** UDT says: "I am the algorithm that produced the card. My goal is to maximize the value of the card, because the card determines my payoff in both branches, even if I only experience one."

  **2. Why CDT Failed (10 mins)**
  *   Explain that CDT agents treat the counterfactual branch as "dead."
  *   In the game, the "Revision" was the moment they updated on evidence ("I am in Alpha") and discarded the Beta branch.
  *   Because the payoff structure rewarded the *policy* (the card) rather than the *local action*, updating destroyed value.
  *   **Key Phrase:** "You didn't lose because you made the wrong move in Alpha. You lost because you became the *kind of agent* that revises."

  **3. Addressing the "Cheating" Feeling (5 mins)**
  *   Players will say: "But Beta wasn't real!"
  *   **Response:** "In Counterfactual Mugging, the other branch *isn't* real either. But Omega pays you based on what you *would have done* there. In this game, the Facilitator was Omega. The rules enforced the link between branches. In UDT, logic enforces the link."

  **4. Honest Limitations (5 mins)**
  *   **Be straight here.** (See section below).
  *   Acknowledge that in this game, the connection between Alpha and Beta was **causal** (enforced by the facilitator's rules).
  *   In true UDT (like Twin PD or logical counterfactuals), the connection is **logical**. There is no facilitator forcing the other twin to cooperate; they cooperate because they run the same source code.
  *   This game simulates *Updatelessness* (valuing the counterfactual), but it hardcodes the *Correlation*. It cannot simulate the spookier "acausal trade" where my decision *causes* your decision without a contract.

  ---

  ### Predictable Failure Modes & Fixes

  **1. The "Contractualist" Objection**
  *   **Problem:** Some players will say, "I didn't revise because I promised to stick to the card. It's about honor."
  *   **Why it hurts:** They missed the decision-theoretic point and replaced it with deontology.
  *   **Fix:** In the debrief, ask them: "If the rules allowed you to revise *secretly* with no cost, would you have?" If yes, they are CDT. If no, ask "Why? Did you think the Facilitator would catch you?" Drive home that the *points* were the only constraint, not honor.

  **2. The "Gaming the Assignment"**
  *   **Problem:** Players might write (HOLD, HOLD) initially, thinking "I'll defect no matter where I go."
  *   **Result:** They get 40 points. The (INVEST, INVEST) people get 100.
  *   **Fix:** Highlight this in the scoring. "The Defect-Always strategy lost to the Cooperate-Always strategy." This mirrors how UDT beats CDT in Newcomb problems.

  **3. The "Why Beta Counts" Confusion**
  *   **Problem:** Players will genuinely not understand why they are paid for a room they weren't in. They might think it's a bug.
  *   **Fix:** Be unyielding. "The simulation measures the quality of your *policy*, not your *luck*." This is the core UDT shift: evaluating the algorithm, not the outcome of the specific branch.

  ---

  ### What This Activity *Cannot* Reproduce

  You asked for honesty on the limitations. Here is what you need to supply in the debrief because the game cannot generate it:

  **1. Logical Correlation vs. Causal Enforcement**
  *   **In the Game:** The reason Beta matters is because *I, the Facilitator, wrote a rule saying Beta matters.* It is a causal link enforced by an external authority.
  *   **In UDT:** The reason the Counterfactual Mugging payout matters is not because a Facilitator forces it, but because **your decision logically determines the prediction.**
  *   **The Gap:** This game makes UDT look like "Follow the rules even when it hurts." True UDT is "Follow the logic even when there are no rules." You have to explain that in the real world, there is no Facilitator paying you for counterfactuals; the "payment" comes from the structure of reality itself (e.g., predictions made about you).

  **2. The "Other Agent" Problem**
  *   **In the Game:** The "Other Room" is just a line on a card. It's passive.
  *   **In UDT:** The "Other Branch" often contains another agent (your twin, a simulation of you).
  *   **The Gap:** This game is a single-agent problem disguised as two rooms. It doesn't capture the *interaction* of UDT with other UDT agents (Acausal Trade). It only captures UDT vs. Nature.

  **3. The Feeling of "Magic"**
  *   **In the Game:** The winning move (Don't Revise) feels like following a arbitrary rule.
  *   **In UDT:** The winning move feels like *math*.
  *   **The Gap:** You have to work hard in the debrief to transition them from "I followed the game rules" to "I optimized my expected utility function."

  ### Facilitator Cheat Sheet (The "Why")
  *   **CDT Agent:** "I am in Alpha. Beta is impossible. I maximize Alpha." → Revises → Gets 50 pts.
  *   **UDT Agent:** "I am the Card. The Card exists in both Alpha and Beta probabilities. I maximize the Card." → Keeps → Gets 100 pts.
  *   **EDT Agent:** "If I revise, it signals I am a defector type. If I am a defector type, my card probably said Defect for Beta too." → Might Keep, but for the wrong reason (evidential signaling vs. causal control).

  ### Final Advice
  Don't let them leave until they admit that **updating on their location was the mistake.** If they leave thinking "I should have just known the rules better," you've failed. They need to leave thinking "My instinct to ignore the counterfactual was the error." That is the UDT shift.
