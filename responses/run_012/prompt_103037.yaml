answer: |-
  The rain on the basalt rocks sounded like fingers drumming on a hollow drum. Elara sat with her knees drawn to her chest, the hem of her tunic heavy with saltwater. Beside her lay the stranger, a man from the mainland whose boat had shattered on the northern teeth. He was pale, his mouth slightly open, as if he had been interrupted mid-syllable.

  Elara was not his kin. She had never seen him before the tide washed him up. Yet, she sat. She kept the flies from his eyes. She hummed the low note that vibrates in the chest.

  Mr. Hale stood at the edge of the circle of stones. He wore a waxed coat that squeaked when he moved, and he held a leather notebook against his chest to keep it dry. He was a lexicographer from the University, come to catalog the tongue of the island before the old ways rotted away. He looked at Elara, then at the dead man, then at the small crowd of islanders gathering under the lee of the cliff.

  "Is this *oam*?" Hale asked. His voice was sharp, cutting through the rain.

  Elara did not look up. She continued the low hum.

  Old Tomas stepped forward. He was mending a net, his fingers moving without looking. "It sits like *oam*," Tomas said.

  "But does it fit the definition?" Hale pressed, stepping over a puddle. He opened his notebook. "I have recorded four uses of *oam*. One: hailing a boat across the reef when the wind is wrong. Two: paying a debt in fish when coin is forbidden. Three: a mother teaching a child to hold their breath underwater. Four: sitting with a parent until the heart stops. What is the common denominator? What is the rule?"

  Tomas stopped mending. He looked at the net, then at Hale. "The rule is that it is done."

  "That is a tautology," Hale said, frustrated. He scribbled something, then crossed it out. "If I am to write this in the lexicon, I must know the boundaries. If Elara sits here, is she *oam*-ing? Or is she merely waiting? If there is no rule, how do you know when someone is doing it wrong?"

  A woman named Kestrel stepped out from the group. She held a basket of mackerel. "When I pay the debt in fish," she said, "it is *oam* because I give what I have caught to the one I owe. It is an exchange."

  "But the hailing," Hale countered, pointing his pen at the sea. "When you shout to the boat, there is no exchange. There is only sound."

  "The sound carries the weight," Kestrel said. "Like the fish."

  "And the breath?" Hale turned to Elara, though she remained still. "When the child holds breath, there is no fish, no sound. There is only silence."

  "The silence holds the weight," Kestrel said.

  Hale rubbed his temples. "So sometimes it is sound, sometimes object, sometimes silence. Sometimes it is debt, sometimes it is warning. What binds them? There must be a necessary condition. A thread that runs through the center."

  Elara felt the cold seeping through her clothes. She looked at the stranger's hands. They were open. She remembered when her uncle taught her to hold her breath. He had not spoken. He had simply put his hand on her head and waited. That was *oam*. She remembered her father shouting to the reef boat during the gale. His voice had cracked. That was *oam*. She remembered her mother placing three large cod on the priest's step after the fire. That was *oam*.

  She tried to find the thing that was the same in all three. The cod was heavy. The voice was loud. The breath was empty. The only thing they shared was that they were all necessary, and none of them were quite enough on their own.

  "It is not a rope with a core," Tomas said softly. He held up a strand of the net he was mending. "Look. This fiber twists with that one. That one twists with the next. But there is no single string that goes from one end to the other. If you cut the middle, the rope holds. If you cut the end, it frays. *Oam* is the twisting."

  Hale stared at the net. "That is poetry, Tomas. It is not linguistics. If I encounter a fifth case, how do I judge it? If I shout at a bird, is that *oam*?"

  "No," Tomas said.

  "Why not?"

  "Because the bird does not know the weight," Kestrel said.

  "Then it requires understanding?" Hale's pen hovered. "So the necessary condition is mutual understanding?"

  "No," said a young man from the back. "When we sit with the dying, they do not understand. They are gone."

  Hale made a sound of exasperation. "Then it is not understanding. Is it presence?"

  "When we hail the boat, we are far away," Elara said. Her voice was raspy from the hum. "We are not present."

  Hale closed his notebook with a snap. "Then it is nothing. It is a word for everything, which means it is a word for nothing. You are using a category error."

  The rain intensified. The water ran in rivulets around the stranger's boots. Elara shifted her weight. Her legs ached. She thought about why she was here. She did not know him. She owed him nothing. She was not teaching him. She was not hailing him. But if she left, the island would feel unbalanced. The air would feel thin.

  If she left, it would be as if the debt had not been paid, or the breath had been taken too soon.

  "It fits," Elara said.

  Hale turned to her. "Fits what? The definition?"

  "The shape," she said.

  "There is no shape!" Hale threw his hands up. "I need a criterion. I need to know if tomorrow, another girl sits by a dead dog, is that *oam*? If a man sings to a stone, is that *oam*? Without the rule, you are just guessing. You are relying on intuition, which is subjective. It is unstable."

  Tomas began to tie a knot in the net. He pulled it tight. "You want the knot to be the wood, not the rope. You want it to be hard. But we live in the water. Things must bend."

  "This is why your language has no future," Hale muttered, mostly to himself. He began to walk away, toward the path that led to the mainland ferry. "You cannot teach this. You cannot codify this. It is a secret society of one."

  Elara watched him go. His squeaking coat faded into the grey mist. He wanted a box where they lived in a web. He wanted a map where they walked the terrain.

  Kestrel moved forward and placed a mackerel on the stranger's chest. It was a small fish, silver and cold.

  "For the journey," Kestrel said.

  "That is debt," Elara noted.

  "It is also weight," Kestrel replied.

  Tomas reached out and touched the stranger's forehead. "This is silence."

  Elara resumed her hum. The vibration traveled from her chest, through the wet air, to the still body. She realized then that Hale would never write the word in his book. Or if he did, he would write a lie. He would write: *Oam: A ritual of transition involving exchange or presence.* He would think he had caught it. But the next time the wind changed, the word would mean something else, and his definition would be a dead shell on the beach.

  The community did not vote. They did not raise hands. They simply began to disperse, one by one, satisfied. They had not agreed on a rule. They had agreed on a feeling. They had looked at this new thing—a vigil for a stranger—and recognized the family face in it. It had the eyes of the breath-holding. It had the mouth of the debt. It had the hands of the hailing. It did not need to have the same blood.

  The rain slowed to a drizzle. The light shifted from grey to a bruised purple. Elara's legs were numb. She knew she would have to stand soon, to stretch, to eat. But for now, the word held. It held not because it was defined, but because it was used. It held because if she stopped, the weave would snag.

  She looked at the fish on the man's chest. She looked at the sea where the boat had broken. She looked at the path where the lexicographer had vanished.

  Elara leaned forward and closed the stranger's open mouth. It was not required by the hailing. It was not part of the debt. It was not taught in the breath. But it was *oam*.

  She sat back. The tide began to turn, pulling the water away from the rocks with a sound like a long exhale. Somewhere in the village, a child was being taught to float. Somewhere else, a net was being pulled in. The word stretched to cover them all, thin as a membrane, strong as a scar.

  Hale would write his book. It would be precise. It would be logical. It would sit on a shelf in a dry room. Here, in the wet and the salt, the word lived because it was needed, not because it was true.

  Elara hummed the note again. It wavered, then steadied. The stranger did not answer. The island did not answer. The word did not need to.
