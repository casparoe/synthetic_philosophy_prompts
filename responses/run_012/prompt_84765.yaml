answer: |-
  **Project Title:** Beyond Ignorance: Open-Endedness and the Structural Problem of Cluelessness

  **Project Summary**
  Consequentialism faces the problem of cluelessness: because the consequences of any act ramify indefinitely into the future, an agent cannot know whether an act produces the best overall state of affairs. If the theory cannot identify the right act, it fails to guide action. The standard response is to treat this as a problem of decision-making under uncertainty, advising agents to maximize expected value based on available evidence. This proposal argues that this response rests on a category error. The debate conflates *ordinary ignorance* (unknown probabilities regarding a fixed set of outcomes) with *open-endedness* (the set of outcomes is not fixed in advance, as the future contains possibilities currently unrepresentable). I propose to demonstrate that cluelessness is not merely an epistemic deficit repairable by better probability assignments, but a structural feature of evaluating acts against an open future. If successful, this diagnosis necessitates a revision of consequentialist criteria, moving away from totalizing maximization toward restricted scopes or robustness conditions.

  **Central Research Question**
  Is the problem of cluelessness reducible to epistemic ignorance within a sufficiently rich probability space, or does it arise from the open-ended nature of future consequences such that no fixed state-space can be defined prior to action?

  **Background and Motivation**
  The literature on cluelessness typically models the problem as one of risk or ambiguity. The agent faces an "urn" of possible outcomes where the probabilities are hidden or imprecise. The standard solution is to assign credences and calculate expected utility. However, this model assumes the urn's contents exist independently of the draw. My hypothesis is that moral action resembles drawing from an urn whose contents are partly settled *by* the draw. Because the future is ontologically open or conceptually unbounded, the agent cannot enumerate the state-space required for expected value calculations.

  Current positions do not settle this question because they assume the reducibility of open-endedness to ignorance. Defenders of expected value assume that any unknown outcome can be captured by a "catch-all" proposition with an assigned probability. Critics of cluelessness often argue for skepticism but rarely distinguish whether the skepticism stems from lack of data (ignorance) or lack of a definable dataset (open-endedness). By isolating open-endedness, this project tests whether the mathematical machinery of decision theory can apply to moral evaluation at all.

  **Candidate Answers**
  The project will evaluate four competing hypotheses:
  1.  **Reductionism:** Open-endedness is illusory; any future contingency can be represented as a proposition in a sufficiently granular state-space. Cluelessness reduces to ordinary ignorance.
  2.  **Scope Restriction:** Open-endedness is real and fatal to total consequentialism. The theory must be revised to assess acts only by their foreseeable or near-term consequences.
  3.  **Criterion Revision:** Open-endedness is real. Consequentialism must abandon maximization for satisficing or robustness criteria (choosing acts that are "good enough" across a wide range of unspecified futures).
  4.  **Conceptual Collapse:** The distinction between ignorance and open-endedness cannot be sharply drawn; therefore, the proposed diagnostic solution offers no normative leverage.

  **Methodology and Timeline**
  This project will proceed over a 15-week semester using conceptual analysis and formal modeling.

  *   **Weeks 1–3: Conceptual Groundwork.** Define "ordinary ignorance" versus "open-endedness" precisely. Formalize the "urn" analogy to distinguish between hidden parameters and undefined state-spaces. Review existing formalizations of cluelessness to locate where the conflation occurs.
  *   **Weeks 4–6: Testing Reductionism.** Investigate whether description-dependent outcomes or catch-all propositions can successfully model open-endedness. Consult formal decision theory regarding "unawareness" and "growing awareness" models to see if they rescue expected value theory.
  *   **Weeks 7–9: Normative Implications.** If Reductionism fails, evaluate Scope Restriction versus Criterion Revision. Analyze whether restricting the object of evaluation preserves the consequentialist commitment to impartial goodness or collapses into deontology.
  *   **Weeks 10–12: Generalization.** Extend the analysis to non-consequentialist theories that assign weight to consequences (e.g., contractualism or threshold deontology). Determine if open-endedness infects any theory requiring consequence assessment, or if it is unique to maximizing structures.
  *   **Weeks 13–15: Synthesis and Writing.** Draft the final paper. Refine arguments based on peer feedback. Ensure the distinction between the diagnostic claim (the nature of the problem) and the normative claim (the solution) is clear.

  **Success and Failure Conditions**
  A **successful** result will demonstrate that open-endedness is irreducible to ignorance. Specifically, it will show that there are possible outcomes of an action that cannot be assigned a probability because they cannot be conceptualized as distinct states prior to the action. This would validate the claim that cluelessness is a structural limit of totalizing consequentialism, supporting either Scope Restriction or Criterion Revision.

  A **failure** condition—specifically one that would sink the central idea—would be demonstrating that open-endedness reduces to ignorance under a sufficiently rich probability space. If it can be shown that "unrepresentable outcomes" can be adequately captured by coarse-grained propositions (e.g., "some other outcome occurs") with assignable credences, then the distinction collapses. In that case, the standard expected value reply stands, and the call for structural revision is unmotivated. Another failure mode would be showing that Scope Restriction renders consequentialism indistinguishable from common-sense morality to the point of losing its theoretical identity.

  **Broader Significance**
  While focused on consequentialism, this project has implications for any normative theory sensitive to consequences. If open-endedness prevents the ranking of states of affairs, theories that rely on comparative goodness (even non-maximizing ones) face a similar regress. Establishing the limits of consequence assessment clarifies the boundary where moral theory must rely on procedural constraints rather than outcome evaluation. This research will result in a draft paper suitable for submission to a peer-reviewed journal in moral philosophy.
