prompt: |-
  So I somehow got roped into leading next month's session of our cross-department reading group -- it's mostly cog-sci and econ grad students plus two actual philosophers, and the loose theme for the term is practical rationality. I want to do Kavka's toxin puzzle with them. Not the standard treatment, though: the puzzle itself is the kind of thing half the room half-remembers from undergrad, and I want the session to really be about the part that always gets skipped, which is whether an intention is even the sort of thing you can form on purpose, and what that tells us about the difference between intending to do something and merely being disposed to do it. Here's the wrinkle I want to build around, and I'm not sure it's a good idea: I want to run the original toxin case, but then swap out the billionaire for a machine -- a box that scans you overnight and pays out if it detects the right neural signature -- and then a third version where it's a human psychologist who reads your file and decides. My hunch is that the machine version makes the puzzle feel easier for the wrong reason and the psychologist version makes it feel harder for a better reason, but I genuinely can't tell if that's a real distinction or just me being cute.

  Don't explain the puzzle to me -- plan the session instead. What has to be up on the board before the puzzle even makes sense as a puzzle, in what order, and what depends on what; which single example should carry the whole seventy-five minutes and why (machine, psychologist, or just the plain billionaire, and what does the carrying example have to have and have to *not* have); the misconceptions I should expect from a mixed room like this and roughly where in the sequence to head each one off -- I'm already betting on "this is just Newcomb's problem," "you could just decide to intend it," and "this is really about weakness of will," but tell me what else is coming that I won't see. Also what I should openly say we're not doing at this level, and one question I can put to the room at the end that would actually show wheter they've got the structure or have just gotten good at the puzzle. Two more things: be upfront about how confident you are in what you're claiming, especially anything empirical-ish about what intentions are, and single out the one part of the plan you're least sure of. And no reading list, please -- half of them won't do it anyway.
