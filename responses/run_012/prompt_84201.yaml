      *   *Can it be done in 90 minutes?* Compressing "time" in a session is tricky. If I say "Wait 10 minutes for 2 chocolates vs. Wait 20 minutes for 5 chocolates," that's doable. But the "subinterval" group needs to experience the *same* wait as chunks.
      *   *Challenge:* If the wait is *actually* experienced (sitting in silence), 20 minutes is too long for a 90-minute session with 15 people. If the wait is *symbolic* (e.g., solving puzzles), it changes the nature of the cost.
      *   *Solution:* The "wait" needs to be part of the game structure, not literal silence. Or, the "wait" is represented by rounds. Let's use rounds/stages to represent time.
      *   *Refinement:* To make it visceral, there needs to be a *cost* to waiting. Boredom? Opportunity cost? Let's use a "holding cost" or simply the tension of the game. Actually, the prompt asks for "delays compressed into the session itself, so they actually sit there waiting." This is hard.
