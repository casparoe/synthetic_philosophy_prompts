      *   *Standard Hyperbolic Discounting:*
          *   T1: $10 Now vs. $20 in 1 week. (Choose Now)
          *   T2: $10 in 1 week vs. $20 in 2 weeks. (Choose Later)
      *   *Subinterval Effect:*
          *   Condition A (Unified): Wait 2 weeks for $20.
          *   Condition B (Partitioned): Wait 1 week (check), then wait 1 more week for $20.
          *   Finding: Partitioning increases impatience (discounting is steeper).
      *   *Session Adaptation:*
          *   Time unit = 10 minutes.
          *   Option S (Small): 1 Chocolate now (Minute 0).
          *   Option L (Large): 3 Chocolates at Minute 30.
          *   Option XL (Extra Large): 5 Chocolates at Minute 60.
          *   *Wait, the subinterval trick:*
              *   Group 1 (Unified): Choose between 3 @ Min 30 or 5 @ Min 60. (Delay = 30 mins).
              *   Group 2 (Partitioned): Choose between 3 @ Min 30 or 5 @ Min 60, BUT the 30-60 gap is marked by intermediate checkpoints/tasks.
      *   *Correction:* The subinterval effect usually says dividing the *delay* makes the future seem further away or more costly.
      *   *Let's simplify for the room:*
          *   Phase 1 (Minute 0): Choose Small Reward (Now) vs. Large Reward (End of Session).
          *   Phase 2 (Minute 45): For those who chose Large, choose Large (End of Session) vs. Extra Large (Next Week/Mail). -> *Too long.*
          *   *Alternative:* All rewards are within the session.
          *   Choice A: 1 Treat at Min 20.
          *   Choice B: 3 Treats at Min 60.
          *   *The Twist:* Group 1 is told "Wait 40 minutes." Group 2 is told "Wait 4 intervals of 10 minutes."
          *   *Problem:* If they don't get the treat at Min 20, they haven't "waited" in a way that feels like a cost.
          *   *Better:* Use the Trading Mechanism to create the cost.

      *   *Revised Plan:*
          1.  **Setup:** Two groups (Red & Blue).
          2.  **Currency:** "Claim Tickets."
          3.  **Rewards:** High-quality chocolate (immediate) vs. Better Prize (End of Session).
          4.  **Time Compression:** The "Wait" is the rest of the discussion.
          5.  **Subinterval Manipulation:**
              *   Red Group: Told they must hold the ticket until the *End* (One block).
              *   Blue Group: Told they must hold the ticket, but there will be *three check-ins* where they can verify the ticket (Partitioned).
              *   *Hypothesis:* Blue Group (Partitioned) will feel the wait more acutely and be more likely to trade/sell early.
          6.  **Trading:** A market phase where they can sell their "End of Session" claim for an "Immediate" chocolate.

  3.  **Drafting the Activity (The "Waiting Game"):**

      *   *Materials:* Envelopes, Chocolate pieces, Claim Cards, Whiteboard.
      *   *Timeline:*
          *   0-15 min: Intro & Setup.
          *   15-20 min: Choice Phase.
          *   20-50 min: Discussion (The "Wait").
          *   50-60 min: Trading Phase.
          *   60-90 min: Debrief & Payout.
      *   *The Subinterval Trick:*
          *   Group A (Holistic): "If you choose the Big Prize, you hand in your card at the end."
          *   Group B (Segmented): "If you choose the Big Prize, you hand in your card in three stages. You must bring it to the front at Min 30, Min 40, Min 50 to be stamped."
