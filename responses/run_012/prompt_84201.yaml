      *   *The "Wait":* 90 mins goes fast. If the wait is only 40 mins, is it enough? *Honesty:* It's a simulation. Acknowledge the limitation.
      *   *Trading:* Nobody trades. *Fix:* Facilitator acts as the "Bank" if peers don't trade.
      *   *Philosophical Gap:* Tokens aren't will. *Fix:* Explicitly state this in the debrief.

  5.  **Addressing the Philosophy (Debrief):**

      *   *Akrasia:* Acting against better judgment.
      *   *Dynamic Inconsistency:* Preferences change over time.
      *   *Framing:* The subinterval effect shows preferences aren't stable; they are constructed. If the wait feels longer because it's chopped up, is the weakness of will internal or external?
      *   *The Gap:* Choosing tokens isn't moral failure. It's cognitive bias. True weakness of will involves a normative judgment (I *should* do X), not just a preference (I *want* X).

  6.  **Refining the Activity for the "Subinterval Effect":**

      *   *Literature Check:* Read (2001) "The Effects of Partitioning Intertemporal Choices." Partitioning increases discounting.
      *   *Implementation:*
          *   Group 1 (Unified): "Wait until 8:30 PM."
          *   Group 2 (Partitioned): "Wait until 8:15, then 8:30, then 8:45." (Checkpoints).
          *   *Crucial:* Both groups wait the same *amount* of time. But Group 2 is reminded of the wait more often.
      *   *Decision Point:* At the start, everyone chooses Small (Now) or Large (Later).
      *   *Re-evaluation:* At the trading phase (mid-way), can they switch?
      *   *Better:* The prompt wants to see if the *carving* affects the reversal rate.
      *   *Design:*
