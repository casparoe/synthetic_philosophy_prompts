      *   **Topic:** Weakness of Will (Akrasia), specifically *not* Aristotle.
      *   **Core Concept:** Hyperbolic discounting / Time inconsistency, specifically the *subinterval effect* (discounting depends on how the delay is partitioned).
      *   **Goal:** A runnable activity where participants *experience* the preference reversal within the session (compressed time).
      *   **Key Features:**
          1.  Two subgroups: One faces a single long gap, one faces the same gap chopped into pieces.
          2.  Trading mechanism: Participants can trade claims to make the "price" of future cooperation public.
