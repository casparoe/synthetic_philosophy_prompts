answer: |-
  This is a brilliant angle. You are targeting the **subadditive discounting effect** (often associated with Daniel Read's work), which suggests that people discount the future more steeply when a delay is divided into sub-intervals than when it is presented as a single block. This undermines the standard economic model of stable time-preferences and complicates the philosophical notion of *akrasia* (weakness of will) by suggesting the "weakness" might be an artifact of description rather than a character flaw.

  Here is a runnable 90-minute session plan designed to make this visceral, followed by the honest pre-mortem you asked for.

  ### Session Title: The Architecture of Waiting

  **Time:** 90 Minutes
  **Participants:** 15 Adults
  **Materials:**
  *   15 Envelopes (sealed, opaque).
  *   30 High-quality Chocolates (e.g., Hotel Chocolat or equivalent—must be visibly desirable).
  *   Whiteboard & Markers (2 colors).
  *   15 "Claim Cards" (index cards).
  *   1 Prize for the end (e.g., a £30 book voucher or a nice bottle of wine).

  ---

  ### Part 1: The Setup (0–15 mins)

  **1. Introduction (5 mins)**
  Briefly state the theme: "We think we know what we want. But does *how* we measure time change *what* we want?" Do not mention "weakness of will" yet.

  **2. The Split (5 mins)**
  Divide the room into two groups (roughly 7 vs. 8).
  *   **Group A (Unified):** Sit on the Left.
  *   **Group B (Partitioned):** Sit on the Right.

  Hand everyone an Envelope and a Claim Card.
  *   **The Offer:** "Inside this envelope is a choice. You can trade this card to me **now** for **one chocolate**. Or, you can hold this card until the **end of the session** (8:30 PM). If you hand it to me then, unopened, you get **three chocolates AND entry into the draw for the Book Voucher**."
  *   **The Constraint:** "If you choose to wait, you cannot eat the chocolate now. You must hold the card."

  **3. The Manipulation (5 mins)**
  This is the critical subinterval variable.
  *   **Tell Group A:** "If you choose to wait, just keep the envelope sealed. Hand it to me at 8:30 PM." (One continuous block of time).
  *   **Tell Group B:** "If you choose to wait, you must bring your card to the front at **three checkpoints** (8:00, 8:15, 8:30) to be stamped. If you miss a stamp, the claim is void." (Same total time, but partitioned into salient intervals).

  **4. The Decision (5 mins)**
  Ask them to decide *privately*. They write "NOW" or "LATER" on the back of their Claim Card and slide it into the envelope. Collect the envelopes.
  *   *Facilitator Note:* Do not open them yet. Record on the board how many in Group A vs. Group B *intended* to wait. (Likely, most will say "Later" initially).

  ---

  ### Part 2: The Wait & The Market (15–60 mins)

  **1. The Discussion (30 mins)**
  Run your philosophy discussion on time, preference, and planning.
  *   *Crucial:* For Group B, you must enforce the checkpoints. At Minute 30 and Minute 45, stop the discussion. "Group B, please bring your cards to the front for stamping."
  *   *Psychological Effect:* This interrupts the flow for Group B, making the "cost" of waiting salient. Group A sits quietly.

  **2. The Trading Floor (15 mins)**
  At Minute 60, announce the Market Phase.
  *   **The Rule:** "You are allowed to change your mind. If you currently hold a 'Later' claim, you can sell it to someone who holds a 'Now' claim."
  *   **The Mechanism:**
      *   Those who chose **Later** write a "Sell Price" on their card (e.g., "I will switch to Now for 2 Chocolates").
      *   Those who chose **Now** write a "Buy Price" (e.g., "I will switch to Later for 1 Chocolate").
      *   Write these prices on the Whiteboard publicly.
  *   **The Execution:** Match buyers and sellers. If no matches occur, you (the Facilitator) act as the Bank. Offer to buy any "Later" claim for **1 Immediate Chocolate**.
  *   **The Data:** Record how many Group A vs. Group B participants sold their "Later" claim to switch to "Now."

  ---

  ### Part 3: Payout & Debrief (60–90 mins)

  **1. Payout (10 mins)**
  Honor the contracts. Hand out chocolates immediately to the "Now" people (including those who switched). Hand out the vouchers/claims to the "Later" people.

  **2. The Philosophical Debrief (20 mins)**
  This is where you map the game to the literature.

  *   **Point 1: Dynamic Inconsistency.**
      *   Show the board. Did Group B (Partitioned) switch to "Now" at a higher rate than Group A (Unified)?
      *   *Philosophy:* Standard rational choice theory assumes stable preferences. If the *only* difference was how the time was described (chunks vs. block), your preference wasn't stable. It was constructed by the frame.

  *   **Point 2: Akrasia vs. Framing.**
      *   *Traditional View (Aristotle/Davidson):* Weakness of will is an internal failure. I judge X is best, but passion drives me to Y. The fault is in *me*.
      *   *Your Finding:* If I can make you "weak" just by adding stamps to a card, is the fault in you, or in the architecture of the choice?
      *   *Question to Room:* "If I can manipulate your will by drawing lines on a calendar, are you responsible for the reversal?"

  *   **Point 3: Judgment vs. Plan.**
      *   Distinguish between **acting against what you judge best** (classic akrasia) and **failing to stick to a plan** (commitment problem).
      *   The Partitioned group didn't necessarily change their *judgment* (they still know 3 chocolates > 1). They changed their *tolerance for the process*.
      *   This suggests weakness of will might not be a moral failing, but a cognitive vulnerability to how time is parsed.

  ---

  ### The Pre-Mortem: What Will Definitely Go Wrong

  You asked for honesty. Here is where the experiment will bleed.

  **1. The "Token Apathy" Problem**
  *   **Failure:** Participants won't care about the chocolate. They are adults at an evening event; they might be full, dieting, or just polite. If the reward has no visceral value, there is no temptation, and therefore no weakness of will.
  *   **Mitigation:** Put the chocolate on the table at the start. Unwrap one. Let them see it. Better yet, make the "Later" prize a **raffle for a £50 Book Voucher** and the "Now" prize is **guaranteed Chocolate**. The uncertainty of the voucher adds anxiety; the certainty of the chocolate adds temptation.
  *   **Backup:** If they truly don't care, acknowledge it. "The stakes were too low. But imagine this was money you needed."

  **2. The Social Desirability Bias**
  *   **Failure:** Nobody wants to look impatient in front of strangers. In the Trading Phase, no one will write a "Sell Price" because it admits weakness.
  *   **Mitigation:** Make the trading **anonymous**. Give them sticky notes to write prices on, then you stick them on the board. Or, explicitly say: "In economics, admitting you prefer cash now is rational, not shameful. Be honest."
  *   **Reality:** You will likely get 1 or 2 traders. That's enough for a sample of 15. Don't expect a stock market crash.

  **3. The Time Compression Failure**
  *   **Failure:** 90 minutes is too short for "waiting" to feel like a cost. 40 minutes of waiting isn't painful.
  *   **Mitigation:** You cannot fix this fully. You must address it in the debrief. "We compressed a lifetime of saving into 40 minutes. The feeling was mild. Imagine this scaled to a pension or a diet."

  **4. The Confusion of Rules**
  *   **Failure:** Group B forgets the stamps. Group A thinks they need stamps.
  *   **Mitigation:** Write the rules on the whiteboard behind you. Keep them visible during the discussion.

  ---

  ### The Gap: Tokens vs. True Will

  This is the most important part for you to articulate. You need to inoculate the room against the objection: *"This is just a game about chocolate, not real moral weakness."*

  **Say this explicitly in the debrief:**

  > "We have demonstrated **Time Inconsistency**, not necessarily **Akrasia** in the strict philosophical sense.
  >
  > 1.  **Preference vs. Judgment:** In this game, you chose based on desire (I want chocolate). In true weakness of will, I act against my *better judgment* (I know I should save, but I spend). This game shows your *desires* flip-flop. It doesn't prove you violated a moral principle.
  >
  > 2.  **Internal vs. External:** Traditional akrasia is an internal civil war (Reason vs. Passion). What we saw today suggests the 'war' might be triggered externally by how the option is framed. If the frame causes the reversal, calling it 'weakness of will' blames the agent for a structural trick.
  >
  > 3.  **The Limit:** A token economy gives us **behavioral inconsistency**. It does not give us **normative failure**. You didn't do anything *wrong* by taking the chocolate now. You just changed your mind.
  >
  > So, what have we learned? We haven't proven people are weak. We've proven that 'will' is not a solid object. It is fluid, and it leaks through the cracks we carve in time."

  ### Why This Works for a Chemist
  You are treating "Will" not as a metaphysical substance, but as a measurable variable subject to experimental conditions (the framing). You are inviting them to observe the reaction (preference reversal) under controlled conditions (Unified vs. Partitioned). Even if the reaction is faint, the methodology respects their scientific intuition while opening the philosophical door.

  ### Final Tip
  If the Trading Phase falls flat (no one trades), **you** trade. Walk up to a Group B participant who chose "Later" and say, "I will give you two chocolates right now for that card." If they hesitate, the room feels the tension. If they accept, you have your data point. Be prepared to spend £5 of your own money to make the point land.
