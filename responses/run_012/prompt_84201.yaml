  4.  **Addressing the "What Will Go Wrong" (Pre-mortem):**

      *   *Apathy:* They won't care about chocolate. *Fix:* Make the chocolate visibly good (e.g., Hotel Chocolat) or use a raffle for a $50 book voucher. Let's suggest the Book Voucher as the "Big Prize" and Chocolate as "Small."
