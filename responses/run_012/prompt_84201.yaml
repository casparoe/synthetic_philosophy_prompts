          4.  Mid-session: Offer a chance to "Cash Out" (Trade Future for Immediate).
          5.  Compare Cash-Out rates between Left and Right.
          6.  *Hypothesis:* Partitioned group feels the wait more, so more Cash Outs.

  7.  **Finalizing the Plan:**

      *   *Title:* "The Cost of Waiting."
      *   *Materials:* Envelopes (sealed), Chocolate, Whiteboard, Markers.
      *   *Trading:* "The Market." Participants write a price on their claim. Match buyers/sellers.
      *   *Failure Modes:* Apathy, Rule-lawyering, Time management.
      *   *Philosophical Honesty:* Distinguish *preference reversal* from *moral weakness*.

  8.  **Writing the Response:**

