          2.  The Activity (Rules, Materials, Payoff).
          3.  The Trading Mechanism.
          4.  The Debrief (Philosophy mapping).
          5.  The Pre-Mortem (What goes wrong).
          6.  The Gap (Tokens vs. Will).

      *(Self-Correction during drafting)*: Make sure the "Subinterval" manipulation is clear.
      *   Group A: "Hold this envelope until the end."
      *   Group B: "Hold this envelope. Bring it to me at 20 mins, 40 mins, 60 mins for a stamp. If you miss a stamp, it's void."
      *   This makes the delay *salient* for Group B.
      *   *Trading:* Allow Group B to sell to Group A? No, allow anyone to sell to the "House" (Facilitator) for an immediate treat, but the price is public. Or better, let them trade with each other. "Who wants a Future Claim? Who has Immediate Chocolate?"
