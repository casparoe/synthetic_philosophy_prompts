  You present a clever reduction, I grant you, and I am always willing to admit where a new formulation captures an old intuition with greater economy. Yet I fear you have mistaken the nature of the thing by collapsing the distinction between the state of the mind and the state of the evidence. When I speak of weight, I refer to the absolute amount of relevant evidence upon which a probability is founded, not merely the stubbornness of the expectation in the face of novelty. To say that weight is but the resilience of belief is to look at the shadow cast by the object rather than the object itself; for a man might hold a belief with great resilience simply through obstinacy or habit, quite devoid of evidential weight, whereas my concern is with the rational ground for belief, not the psychological tenacity of it. You speak of this resilience as something computable from your degree of belief; I must confess I do not quite see how a feeling admits of such calculation, and I should like to know what instrument you propose for this measurement, for it sounds to me like a confusion of the psychological with the logical.

  As for your dismissal of the logical relation, here I must stand firmer. If probability is nothing but the degree of belief a coherent agent happens to possess, then you have removed the standard by which we judge that belief to be rational or irrational. Two men with the same evidence ought, in my view, to entertain the same degree of rational belief, because the probability relation exists between the propositions themselves, independent of human opinion. Your subjectivist tells us what a man does believe; I am interested in what he ought to believe. If you abolish the logical relation, you abolish the possibility of error in estimation, provided only that the agent is consistent with himself, and that seems to me a poor foundation for a theory of knowledge or conduct.
