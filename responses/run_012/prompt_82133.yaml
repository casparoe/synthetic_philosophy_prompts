  This is not a strange request at all. You have stumbled directly into the most famous problem in contemporary experimental philosophy. Hal is running a classic set of thought experiments designed to test the boundaries of moral psychology.

  The name you heard is correct: **The Knobe Effect** (or the Side-Effect Effect), named after Joshua Knobe, who published the seminal paper on this in 2003.

  You are right to look for the underlying rule. In geology, you deal with strata that are physically there; in this kind of philosophy, you are mapping the "strata" of our ordinary language and moral intuition. The data (Hal's verdicts) are consistent, but they don't tell us *why* the intuition works the way it does.

  Here is the breakdown of the two competing rules, the prediction for your surgeon, and how to settle it.

  ### The Two Competing Rules

  Based on Hal's four verdicts, we can distill two hypotheses about what drives the judgment "on purpose."

  **Rule 1: The Blame License (The Moral Penetration View)**
  *   **The Rule:** We apply the label "on purpose" primarily as a tool for moral blame. If an agent is blameworthy for the outcome, we say they did it on purpose. If they are justified, praiseworthy, or neutral, we withhold the label, even if they knew it would happen.
  *   **The Logic:** "Intentional" isn't just a description of mental states (knowledge + desire); it's a verdict. We only call it intentional if we want to hold the person's feet to the fire.
  *   **Fit with Hal's Data:**
      *   *Pollution:* Boss is blameworthy (greed + harm) → **Yes.**
      *   *Clean River:* Boss is praiseworthy (or neutral) → **No.**
      *   *Engineer:* Engineer is blameworthy (violated rules + harm) → **Yes.** (Even though she regretted it, she is still blameworthy).
      *   *Overtime:* Dept Head is blameworthy (violated rules + harm) → **Yes.**

  **Rule 2: The Harm Trigger (The Asymmetry View)**
  *   **The Rule:** We apply the label "on purpose" whenever a foreseen side effect is *bad* (harmful), regardless of whether the agent is blameworthy. The "badness" of the outcome itself triggers the concept of intentionality.
  *   **The Logic:** Our concept of intentional action is sensitive to the moral value of the *outcome*, not just the moral status of the *agent*. If you knowingly cause harm, it's intentional. If you knowingly cause help, it's not.
  *   **Fit with Hal's Data:**
      *   *Pollution:* Harmful outcome → **Yes.**
      *   *Clean River:* Helpful outcome → **No.**
      *   *Engineer:* Harmful outcome → **Yes.**
      *   *Overtime:* Harmful outcome → **Yes.**

  Both rules fit Hal's four cases perfectly. They come apart on your surgeon.

  ### The Surgeon Case: Prediction

  **The Case:** Surgeon performs necessary, rule-abiding operation. Knows it causes numbness (harm). Indifferent to numbness.

  *   **Rule 1 (Blame License) Predicts:** **No.** The surgeon is not blameworthy. The action is justified and medically necessary. There is no moral fire to fight, so our intuition doesn't reach for the "on purpose" label.
  *   **Rule 2 (Harm Trigger) Predicts:** **Yes.** The numbness is a negative physical outcome (a harm) that was knowingly brought about. The justification shouldn't matter; the harm triggers the label.

  **My Bet:** Hal will say **No, she did not numb the shoulder on purpose.**

  **Why?** Hal is a philosophy professor familiar with this literature. The standard interpretation of the Knobe Effect is **Rule 1 (The Blame License)**. The core finding of the last 20 years of research is that moral judgments *penetrate* our psychological concepts. We don't just describe the world; we evaluate it. Since the surgeon is doing the "right call," she is insulated from blame, and the folk psychology protects her from the "intentional" label.

  If Hal says "Yes," he is taking a minority view (that the physical harm alone is sufficient), which would contradict the spirit of the CEO/Profit case where the *greed* (blameworthiness) is usually seen as the driver, not just the pollution.

  ### The Tie-Breaker Case for Next Week

  If the group hedges on the surgeon (arguing about whether numbness is "bad enough" or whether medical necessity counts as "justification"), you need a case that removes the "Harm" variable entirely. You need to test if **Morality** is the switch, or if **Knowledge** is the switch.

  Bring this case:

  > **The Neutral Logo:**
  > A CEO decides to launch a new programme to increase profits. He knows it will have a side effect: it will change the background color of the company's website from blue to green. He doesn't care about the color; he just wants the profits. The color change is morally neutral (no one likes or dislikes green more than blue).
  > **Did the CEO change the website color on purpose?**

  *   **If Hal follows Rule 1 (Blame/Morality):** He must say **No.** There is no blame to assign, no harm done, no good done. It's just a known causal consequence. If morality drives the concept, neutral side effects are never intentional.
  *   **If Hal follows a Strict Knowledge Rule (which he claimed to reject in Case 2, but might sneak back in):** He might say **Yes.** He knew it would happen, and he did the action.

  **Why this tells them apart:** The Surgeon case pits *Justification* against *Harm*. The Neutral Logo case pits *Morality* against *Knowledge*. If Hal says the CEO changed the color "on purpose," then his rule is simply "Known Consequences = Intentional," and his "No" on the Clean River case was an anomaly. If he says "No," it confirms that **moral valence is required** to trigger the concept of intentional action at all.

  ### Fact vs. Word

  You asked whether you and Hal are disagreeing about a fact or just about which word to use.

  In geology, if you argue about whether a rock is granite, you can put it under a microscope. There is a fact of the matter independent of your language.

  In this reading group, **you are disagreeing about the word.** But in philosophy, that is a disagreement about the "fact" of how our minds work. There is no hidden neuron in the CEO's brain that lights up "INTENTIONAL" only when he pollutes. The "fact" you are investigating is the structure of human moral psychology.

  If Hal says "Yes" to the surgeon and you say "No," you are not disagreeing about what the surgeon did (you both agree she knew and she acted). You are disagreeing about **whether the concept of 'intentional' includes moral justification.**

  My advice: Back Rule 1 (The Blame License). It is the dominant view in the literature for a reason. It explains why we treat the Engineer (who regretted the harm) the same as the CEO (who didn't). It wasn't their *feelings* that mattered; it was their *blameworthiness*. The surgeon is not blameworthy. Therefore, in the eyes of folk psychology, she didn't do it on purpose.

