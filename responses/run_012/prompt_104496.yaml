  You have identified two candidate rules that fit her history, and they indeed split on this new case.

  1.  **The "Institutional Capacity" Heuristic:** Priya rejects bets where the counterparty lacks the physical or social power to fulfill the obligation ("he's some guy," "nothing would make him pay"). She accepts bets where the mechanism is socially recognized and enforceable (charity raffle, friend with cash, university with escrow).
      *   *Prediction on Physics Case:* **Accept.** The university + escrow + contract solves the exact objection she raised against the Mugger and the Hustler.
  2.  **The "Cognitive Probability Floor" Heuristic:** Priya rejects bets where the odds are too abstract for human intuition to grasp (e.g., anything rarer than 1 in a million). She accepts bets with "graspable" odds (1 in 3, 1 in 1000).
      *   *Prediction on Physics Case:* **Reject.** $10^{-12}$ is far outside the range of human experience, much closer to the Mugger's $10^{-30}$ than the Raffle's $10^{-3}$.

  **Why I'm betting on Rule 1:**
  Priya's verbal justifications are load-bearing. When she rejected the Mugger, she didn't say, "The math doesn't work" or "The odds are too low." She said, "**He's some guy, he can't do that.**" When she rejected the Hustler, she didn't say, "The expected value is negative" (even though it was); she said, "**Nothing would make him actually pay up.**"

  Her filter is **enforceability and capacity**, not probability magnitude. She treats the probability number as secondary to the question: *Is the mechanism real?* The Physics offer is explicitly engineered to clear her capacity/enforceability bar (escrow, contract, institution). While $10^{-12}$ is a tiny number, it is a *scientific* number attached to a *real* institution, which fits her "Raffle" pattern (trust the system) better than her "Mugging" pattern (distrust the individual).

  *Note on the Payoff:* There is a risk here. $10^{18}$ dollars is roughly 1% of all wealth on Earth. If Priya pauses to ask, "Does this university actually have this money in escrow?", she might reject it on *Capacity* grounds (Rule 1), which would look like a Probability rejection (Rule 2). Assuming the "real escrow" premise holds up to her scrutiny, she takes it.

