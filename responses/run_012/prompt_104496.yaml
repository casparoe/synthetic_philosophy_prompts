  ### The Tie-Breaker Case

  If Priya takes the Physics bet, Rule 2 (Probability Floor) is effectively dead. However, a new ambiguity arises: Did she take it because of the **Institutional Trust Heuristic**, or because she is actually an **EV Maximizer** (since the EV is $5M) who just uses Trust as a filter?

  To distinguish **Trust Heuristic** from **EV Maximization**, put this case to her next:

  **The Case:** "A state government lottery is running a special. The odds and prize structure are public. For a $5 ticket, the Expected Value is exactly $2.50 (a guaranteed loss). However, the payout is backed by the full faith and credit of the state, and the prize is $10 million."

  *   **If she buys:** She follows the **Institutional Trust Heuristic** (or a "Fun/Dream" heuristic). She is willing to pay for the *possibility* guaranteed by a credible institution, even when the math is explicitly negative. This confirms she is not an EV maximizer.
  *   **If she rejects:** She is an **EV Maximizer with a Trust Filter**. She only takes bets that are Positive EV *and* Enforceable. This would mean her acceptance of the Physics bet was purely mathematical, not psychological.

  **Why this pins it down:**
  The Physics case had High Trust + Positive EV.
  The Hustler case had Low Trust + Negative EV.
  We have never seen **High Trust + Negative EV**.
  This case isolates the variable of *Trust* from the variable of *Math*. If she pays for trust alone, you've reverse-engineered her rule: **"If the mechanism is real, I'm in for the ride, regardless of the edge."** If she folds, her rule is: **"If the mechanism is real AND the math works, I'm in."**
