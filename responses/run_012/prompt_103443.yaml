  KS draws the ray from disagreement to utopia. “Equal proportions,” it rules.
  Alice gets 500,000. Bob gets 0.5.

  Bob cries, “I’m practically at disagreement!”
  KS: “But you’re both 50% satisfied relative to your potential.”

  Then Alice expands the feasible set, raising her ideal payoff to 2,000,000.
  KS rotates the ray. “Now you get 1,000,000. Bob, your share drops.”

  Alice asks Nash, “Would I gain more with you?”
  Nash checks the product. “Possibly less. Expanding your options might reduce your payoff. I don’t satisfy individual monotonicity.”

  Alice: “So KS won’t punish me for having bigger dreams?”
  KS: “Exactly. I’m the only solution where ambition is monotonic.”
