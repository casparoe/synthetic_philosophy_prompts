answer: |-
  You are at the drafting table. The light is coming from the left, as Neurath insisted, so your hand does not shadow the work. You have your stencils, your ruling pen, the pots of opaque white ink for corrections. You are trying to build a world where the eye understands what the ear cannot, where a Viennese worker and a Shanghai merchant look at the same sheet of paper and nod at the same truth.

  Neurath tells you the picture is the language. But at the drawing board, the ink dries differently than the theory. Here is where the friction happens, stroke by stroke.

  ### 1. The Problem of the Empty Space (Negation)
  You are charting housing conditions. You have a row of little houses, each representing a thousand families. You can show the families that *have* toilets. You stack the little houses up. But the Ministry wants to show the success of the new sanitation program. They want to show the diseases that *did not happen*. They want to show the deaths that were *prevented*.

  Pick up your pen. How do you draw a death that never occurred?

  If you leave a gap in the row, it looks like missing data. If you draw a ghostly house, it looks like a proposal, not a fact. If you draw a house with a cross through it, you have introduced a symbol—a linguistic convention—not a picture. A picture shows presence. It is existential. To show absence, you must borrow the logic of language (the word "not," the symbol "X").

  At the board, you realize you cannot paint a negative. You can only paint a positive and label it as a lack. The moment you try to visualize "prevented harm," you stop drawing the world and start drawing an argument about the world. The image ceases to be a mirror of facts and becomes a rhetorical device.

  ### 2. The Problem of the Spread (Generality)
  Now you are comparing income in two districts. You have the data. You know District A is "more dispersed" than District B. The rich are richer, the poor are poorer, though the average is the same.

  You arrange your pictograms. In District A, you spread the figures wide; in District B, you cluster them tight. The eye sees the spread. So far, so good. But ask yourself: where did the notion of "dispersion" come from? It did not come from the paper. It came from a statistical definition decided in a committee room before you ever picked up a ruler.

  The picture can *display* the distribution, but it cannot *define* the variance. If you change the interval of your axis, the "spread" changes. The visual stability Neurath promises relies on a numerical stability that is invisible on the page. You can design a better chart to make the dispersion clearer (a limit of design), but the chart cannot generate the concept of dispersion on its own (a limit of the medium). It is a container, not a generator. You are dressing a mathematical idea in visual clothes; the clothes do not make the body.

  ### 3. The Problem of the Claim (Assertion)
  You have drawn a figure of a man with a cap. He represents "the worker." You place ten of them on the page.

  Does this page say, "There are ten workers"? Or does it say, "Here is what a worker looks like"?

  If a fire burns the museum, the chart burns. The workers do not. The chart is not the society; it is a statement *about* the society. But the ink itself does not carry the force of the statement. A photograph of a crime scene shows a body; it does not say, "This man was murdered." That requires a caption, a testimony, a verb.

  At the drawing board, you realize your pictograms are nouns. They are things. They have no verbs. To make an assertion ("Unemployment *rose*"), you need a syntax that connects the things across time. ISOTYPE uses arrows or sequences to imply this, but an arrow is not a verb; it is a sign. The difference between a depiction (a man standing) and an assertion (this man *is* unemployed) is not in the ink. It is in the frame you build around the ink. The picture shows; the text tells us what truth-claim to attach to the show.

  ***

  ### The Verdict: Medium vs. Design

  For your character, the realization must be surgical.

  **Negation (The Non-Event)** and **Assertion (The Truth Claim)** are genuine **limits of the medium**.
  Pictures are ontologically positive; they show what *is*. They lack the logical operators (not, if, therefore) required to state facts about what *is not* or what *must be*. They also lack truth values; a drawing is neither true nor false, it simply exists. To make them do this work, you must smuggle in language (symbols, captions, keys). The autonomy Neurath promises is impossible here. The image cannot stand alone.

  **Generality (The Distribution)** is a **limit of design**.
  You *can* visualize dispersion. You *can* make the comparison legible. If the chart fails here, it is because the designer chose the wrong scale, the wrong icon, or the wrong arrangement. This can be fixed with better craft. It does not prove the medium is broken, only that the specific execution was clumsy or that the underlying data definitions were shaky.

  ### What This Means for You, the Novelist

  You mentioned you have never believed that "showing" and "telling" are the same thing. Your character's journey validates your instinct.

  If showing and telling were identical, the image would carry the logic. It would not.
  The difference between the two verdicts (Medium vs. Design) is the difference between a **tragedy** and a **task**.

  *   Because Generality is a limit of *design*, your character can struggle, fail, and improve. She can have scenes where she stays up all night moving a row of figures three millimeters to the left and suddenly the "truth" pops into focus. This gives her agency. It allows for the drama of craft.
  *   Because Negation and Assertion are limits of the *medium*, she will eventually hit a wall she cannot climb. No matter how skilled she becomes, she cannot draw a "prevented death" without lying. She cannot make the chart speak without adding words.

  This is where her belief in Neurath breaks. Neurath believed the visual could be a neutral transport for truth. She discovers that the visual is always a **translation**, and every translation requires a translator. The "autonomous" chart is a myth. The chart is always anchored by the text it claims to replace.

  For you, this means "showing" is never innocent. When you describe a room in your novel, you are not just presenting data; you are asserting a mood, a hierarchy, a truth. But unlike your character, you have the tool she lacks: you have the verb. You can say what the picture cannot.

  Let her realize that the picture unites, as Neurath said, but only because it silences the questions that words would ask. The chart is peaceful because it is incomplete. Her crisis comes when she realizes that to tell the whole truth, she must break the silence of the image and let the words back in.
