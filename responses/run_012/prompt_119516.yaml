      *   **Format:** Setup and punchline. Don't overexplain.

  2.  **Deconstruct the Concepts:**
      *   **Negative Liberty (Berlin):** Freedom *from* interference. If no one stops you, you're free. The benevolent master scenario = Free.
      *   **Republican Liberty (Pettit/Skinner):** Freedom as non-domination. It's about the *capacity* for interference, not the act. If someone *can* interfere arbitrarily, you're unfree, even if they don't. The benevolent master scenario = Unfree.
      *   **Positive Liberty (Berlin/Taylor/etc.):** Freedom *to* be your true self/rational self. Freedom as self-mastery. If you're addicted or acting on lower impulses, you're unfree even if no one stops you.

  3.  **Brainstorming Scenarios:**
