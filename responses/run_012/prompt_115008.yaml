answer: |-
  You have identified the exact failure point in most bioethics discussions. People argue for verdicts (save the five!) without defining the functional specifications that make a verdict legitimate. In a crisis standards of care (CSC) policy, the *process* is the ethics. If the process is incoherent, the outcome is just violence with paperwork.

  Here is the spec sheet. These are the functional requirements any theory of allocation must meet to be usable in a hospital, defensible in court, and livable for the staff applying it.

  ### The Spec Sheet: Requirements for Crisis Allocation

  **1. The Aggregation Requirement (The 5-vs-1 Case)**
  *   **The Spec:** The theory must justify saving the greater number of lives when all other clinical factors (prognosis, immediacy) are equal.
  *   **The Consideration:** You asked about Taurek (the coin-flip argument). Taurek argues that because death is a total loss for the one and a total loss for the five, there is no "sum" of loss to compare.
  *   **The Verdict on the Spec:** For a public hospital policy, Taurek is inadmissible. The theory *must* deliver the verdict "save the five."
  *   **Why:** Not because five lives are metaphysically "worth more," but because the hospital is a steward of public resources. To flip a coin is to tell the five families, "Your deaths mattered no more than his," which violates the public trust. The theory must treat the *number of survivors* as a morally relevant factor.

  **2. The Indifference Requirement (The 1-vs-1 Case)**
  *   **The Spec:** When two patients have identical claims (same prognosis, same need) and only one resource exists, the theory must mandate a randomizing mechanism (lottery/coin flip).
  *   **The Consideration:** You cannot have a "verdict" here without introducing arbitrary bias (e.g., saving the younger, the richer, the doctor).
  *   **The Verdict on the Spec:** The theory owes you a **procedure**, not a medical verdict. It must require randomization.
  *   **Why:** This is the only way to satisfy "equal respect." If you don't randomize, you are secretly weighing factors you haven't admitted to.

  **3. The Relevance Requirement (Adding the Doomed/Trivial)**
  *   **The Spec:** The theory must exclude patients who cannot be saved (futility) and must prevent trivial claims from aggregating against vital ones.
  *   **The Consideration:** If numbers count, does adding a sixth patient who will die anyway change the math? Does adding five people with sprained ankles outweigh one life?
  *   **The Verdict on the Spec:** The theory must say **No** to both.
  *   **Why:**
      *   *The Doomed:* Counting the doomed is a "waste" constraint. Resources allocated to them yield zero survival benefit. They are not part of the "saveable" set.
      *   *The Trivial:* There must be **Lexical Thresholds**. Life is a higher tier than limb. You cannot aggregate lower-tier claims to override a higher-tier claim. This prevents the "ugly" conclusion where five sprained ankles kill one breathing patient.

  **4. The Mechanism Requirement (Weight vs. Tiebreaker)**
  *   **The Spec:** The theory must define *how* numbers count. Are they a "tiebreaker" (only used when all else is equal) or a "weight" (always a positive factor)?
  *   **The Consideration:** "Tiebreaker" is safer but weak. "Weight" is strong but dangerous (leads to the sprained ankle problem).
  *   **The Verdict on the Spec:** The theory must use **Numbers as Weight within Tiers**.
  *   **Why:** Pure "Tiebreaker" fails the 5-vs-1 case if there is *any* slight clinical difference favoring the one. Pure "Weight" fails the sprained ankle case. The solution is Tiered Weighting: First, sort by prognosis/severity (Life vs. Limb). *Within* the "Life" tier, numbers count as weight.

  **5. The Separateness Requirement (Persons vs. Buckets)**
  *   **The Spec:** The theory must not treat individuals as mere containers for utility. It cannot justify actively killing one to harvest organs for five.
  *   **The Consideration:** This is the conflict. "5 > 1" looks like summing people into a bucket. "Separateness" says you can't do that.
  *   **The Verdict on the Spec:** The theory must distinguish **Rescue** from **Sacrifice**.
  *   **Why:** In the ventilator case, you are not killing the one to save the five. You are allocating a scarce resource that the one *needs* to live. The one dies of the underlying disease; the five live due to the resource. In the transplant case, you kill the one *to make* the resource. The theory must forbid Sacrifice but permit Rescue aggregation.

  **6. The Invariance Requirement (Framing & Agency)**
  *   **The Spec:** The verdict must not change based on how the problem is described (saving five vs. letting one die) or who is deciding (nurse vs. mother).
  *   **The Consideration:** Humans are biased by framing and relationship.
  *   **The Verdict on the Spec:** The policy must enforce **Agent Neutrality**.
  *   **Why:** A mother *will* save her child. That is human nature. But the *policy* cannot permit it. If the policy allows special obligations, it collapses into nepotism. The theory must demand that the role (Triage Officer) overrides the relationship (Mother).

  **7. The Usability Requirement (The 10-Minute Rule)**
  *   **The Spec:** The theory must be executable by an exhausted clinician in minutes, using only data available in the chart.
  *   **The Consideration:** Complex philosophical calculations fail under stress.
  *   **The Verdict on the Spec:** The theory must be **Algorithmic**.
  *   **Why:** If it requires deep reflection, it will be applied inconsistently. It needs to be a flowchart: Score A + Score B + Number of Patients = Decision.

  **8. The Legitimacy Requirement (The Reporter Test)**
  *   **The Spec:** The rationale must be explainable to a grieving family and a hostile public without sounding like cold calculation.
  *   **The Consideration:** "We saved the five because the math worked" is incendiary.
  *   **The Verdict on the Spec:** The theory must be framed as **Stewardship of Chance**, not Pricing of Life.
  *   **Why:** You are not saying the one life was worth less. You are saying, "We had the capacity to create five survivors, and only one survivor. We chose the path that preserved the most life."

  ***

  ### The Killer Requirement

  **Which single requirement knocks out the most theories people actually hold?**

  **The Separateness Requirement.**

  Most people hold a "common sense" view that is actually a contradiction: they want to save the five (Aggregation) but they also believe "you can't use a person as a means" (Separateness).
  *   **Utilitarianism** fails this. It says kill the one for the five if the math works. It treats people as buckets.
  *   **Strict Deontology** often fails the 5-vs-1 case. It says you can't weigh lives, so you flip a coin (Taurek), which fails the Aggregation Requirement.

  Any theory that cannot thread this needle—justifying saving the five *without* treating the one as a resource—is dead on arrival for hospital policy.

  ***

  ### My Commitment

  You asked me to commit. I will not give you a menu.

  **I reject the idea that you must drop a requirement.** The list is satisfiable, but only if you adopt a **Prioritarian Rescue Model**.

  Here is the definite stance you should take in your committee:

  1.  **On 5-vs-1:** You **must save the five**. Taurek is philosophically interesting but administratively negligent. To flip a coin when you can save five is to choose death for four people without cause.
  2.  **On Separateness:** You satisfy this by strictly forbidding **Sacrifice**. You are never allowed to withdraw a ventilator from a patient *to give it to someone else* unless the first patient is medically futile. You are allocating *new* resources, or reallocating *futile* ones. You are not harvesting the one. This preserves the "separateness" of the one while allowing the "aggregation" of the five.
  3.  **On Weight vs. Tiebreaker:** You use **Tiered Weight**.
      *   **Tier 1:** Survival Probability (Who will live if treated?). Exclude the doomed.
      *   **Tier 2:** Life vs. Limb. Never trade life for fingers.
      *   **Tier 3:** Numbers. Within the "Likely to Survive" tier, save the greater number.
  4.  **On the "Drop":** If you force me to say which requirement is the most vulnerable in the real world, it is **Agent Neutrality**. A mother *will* save her child. A doctor *will* favor a colleague.
      *   **My Position:** You do not drop this requirement. You **harden the process** to protect it. You remove the decision from the bedside nurse. You create a dedicated Triage Officer who has no relationship to the patients. If you cannot staff a Triage Officer, you default to the Lottery (Requirement 2). You do not allow the bedside clinician to weigh numbers, because they cannot be neutral.

  **The Bottom Line for Your Policy:**
  Write the policy to **maximize the number of survivors** (Save the Five), constrained by **medical futility** (Ignore the Doomed) and **severity thresholds** (Life > Limb), implemented by a **dedicated triage role** (Protect Neutrality), with **randomization for exact ties** (Protect Equality).

  This is the only framework that lets a nurse look a family in the eye and say, "We did not choose your mother to die. We chose to save everyone we possibly could, and the limit was the machines, not our will." That is the only story that survives the reporter test.
