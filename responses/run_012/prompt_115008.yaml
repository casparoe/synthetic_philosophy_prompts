      *   **Key Instruction:** "Please commit -- give me a definite answer with your reasons, not a menu of options and a shrug."

  2.  **Deconstruct the Specific Requirements:**

      *   **5 vs. 1 (Taurek):** Does the theory have to save the five?
          *   *Analysis:* Most policy frameworks (utilitarian, prioritarian) say save the five. Taurek says flip a coin. In a public hospital context, saving the five is the standard expectation for stewardship of resources.
          *   *Commitment:* The theory *must* justify saving the five. Taurek's view is untenable for public policy because it ignores the aggregate loss of life which the community cares about.

      *   **1 vs. 1 (Indistinguishable):** Verdict, permission, or coin?
          *   *Analysis:* If criteria are identical, justice demands equal chance. A verdict favoring one is arbitrary.
          *   *Commitment:* Randomization (lottery) is required. It's not a "permission" to choose; it's a requirement to randomize to ensure equal respect.

      *   **Adding the Hopeless/Trivial (The "Mere Addition" problem):** Does adding a 6th doomed patient or a 6th sprained ankle change the math?
          *   *Analysis:* If numbers count purely aggregatively, adding a doomed person shouldn't help. Adding a trivial claim shouldn't outweigh a life.
          *   *Commitment:* The theory must exclude those who cannot be helped (futility) and must establish a threshold of severity (life > limb). Aggregation has limits.

      *   **Life vs. Fingers (Aggregation limits):** Can 5 fingers beat 1 life?
          *   *Analysis:* Lexical priority is usually needed. Life is a precondition for fingers.
          *   *Commitment:* No. There is a lexical threshold. Life trumps non-life claims regardless of numbers.

      *   **Tiebreaker vs. Weight:**
          *   *Analysis:* Tiebreaker = only use numbers if all else equal. Weight = numbers always count as a positive factor.
          *   *Commitment:* Weight. Numbers should count as a weight, but constrained by thresholds (see Life vs. Fingers). Tiebreaker is too weak; it implies numbers don't matter until the very end.

      *   **Separateness of Persons vs. 5 > 1:**
          *   *Analysis:* This is the core tension (Rawls/Nozick vs. Utilitarianism). You can't treat people as vessels for utility. But 5 > 1 seems to do exactly that.
          *   *Commitment:* This is the hardest one. I need to argue that saving the five *respects* separateness better than flipping a coin because each of the five has a claim that is not being met if they die. However, I must acknowledge the tension. I will argue that "Separateness" prohibits *sacrificing* the one *for the benefit* of the five (transplant case), but in *rescue* cases (trolley/ventilator), the choice is who to save, not who to kill. The distinction is crucial. I will prioritize the "5 > 1" outcome but ground it in individual claims, not just a sum.

      *   **Framing/Role Neutrality:**
          *   *Analysis:* Policy must be robust to description and agent.
          *   *Commitment:* Required. Inconsistency here indicates bias or irrationality.

      *   **Administrative Constraints (10 mins, explainable):**
          *   *Analysis:* Ideal theory vs. Non-ideal theory.
          *   *Commitment:* Required. A theory that requires a PhD to apply fails the nurse.

