      *(Self-Correction on "Drop")*: I need to pick one if I think it's impossible. I think it *is* possible to satisfy all if framed correctly (Tiered Weighting). So I won't drop one, I'll explain how they fit. But if *forced*, I'd say **Agent Neutrality** is the one that human psychology breaks, even if policy demands it. No, better to stick to policy. I'll say **Numbers as Weight** is the one to constrain heavily, effectively making it a Tiebreaker *across* tiers but Weight *within* tiers.

