      *   It also conflates *correlation* with *influence*. Just because my decision is logically correlated with Agent X and Agent Y, it doesn't mean I can satisfy both X and Y's conditions simultaneously if X and Y are mutually hostile.
      *   Crucially, step (6) is the leap. "Cooperate with all of them" assumes I can simultaneously satisfy the conditions for trade with everyone in the reference class. But if the reference class includes agents with mutually exclusive demands, I *cannot* trade with all of them.
