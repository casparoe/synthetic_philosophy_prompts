      *   *Is (7) doing real work?* (7) claims incoherence refutes the theory. But incoherence of a *specific proposed policy* (cooperate with all) doesn't refute the *principle* of maximization. It just means that policy isn't the maximizer. The maximizer would be "Cooperate with the consistent subset that yields highest value." So (8) doesn't follow from (7).
