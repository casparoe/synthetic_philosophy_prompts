answer: |-
  First off, take a deep breath. You haven't just written bad code; you have stumbled directly onto **The Frame Problem**, one of the most famous and difficult issues in the history of Artificial Intelligence.

  In the 1960s, John McCarthy and Patrick Hayes formalized this exact issue. They realized that if you program a robot to list what *does* change when it acts, you implicitly have to list everything that *doesn't* change. As your roommate pointed out, that list is infinite. (e.g., "When I move the cup, the cup's location changes, but the color of the walls doesn't, the location of the cat doesn't, the price of Bitcoin doesn't...")

  Philosophers and AI researchers have been arguing about this for 60 years. So, please stop beating yourself up. Your logic is sound for a "blocks world"; your environment just isn't a "blocks world."

  Since you're a backend dev, I'm going to skip the philosophy and translate this into system architecture terms. Your current system assumes **Strong Consistency** in a world that is **Eventually Consistent** with **External Writers**.

  Here is how you fix this without writing infinite rules.

  ### 1. Treat the World Model as a Cache, Not the Database
  Currently, your robot's internal state is the "Source of Truth." When it vacuums the kitchen, it updates its internal database and assumes that database is valid until it acts again.

  In a dynamic environment (cat + roommate), your internal model is merely a **cache** of the real world. The real world is the database.
  *   **The Fix:** Implement **Cache Invalidation**.
  *   **Implementation:** Before executing any action that depends on a state (e.g., "Cat is on Sofa"), you must verify that state. If you don't have a sensor for the cat, you must assume the "Cat Location" cache entry is stale after a certain TTL (Time To Live) or after any significant time delta.
  *   **Backend Analogy:** You wouldn't assume a user's session data is valid after 24 hours without checking the DB. Don't assume the cat's position is valid after 5 minutes without checking a sensor.

  ### 2. Handle "Exogenous Events" (The Roommate & Cat)
  Your current rule engine assumes the *only* thing that changes state is the Robot's Actions. In AI planning terms, the cat and roommate are **Exogenous Events**. They are external writers modifying your database without going through your API.

  You cannot write rules for what they *will* do (they are non-deterministic agents). You must write handlers for when they *have* done something.
  *   **The Fix:** Move from a **Plan-Then-Act** architecture to a **Sense-Plan-Act Loop** (or a Reactive Architecture).
  *   **Implementation:**
      *   **Short Horizons:** Don't plan "Vacuum House." Plan "Vacuum Kitchen." When that finishes, *sense* the world again, then plan "Vacuum Living Room."
      *   **Execution Monitoring:** Before every single atomic action, check preconditions. If the plan was "Go to Kitchen -> Vacuum," but the sensor says "Kitchen Door Closed" (roommate closed it) or "Cat on Floor" (cat moved), abort and re-plan *only that segment*.
  *   **Backend Analogy:** This is like using **Webhooks** instead of Polling. Ideally, your robot subscribes to "Motion Detected" events. If motion is detected in the kitchen, the "Kitchen State" cache is immediately invalidated, triggering a re-plan.

  ### 3. Use Relevance, Not Completeness
  Your roommate suggested writing rules for what doesn't change. That's the Frame Problem. The engineering solution is **Relevance**.

  You don't need to know if the vacuuming changed the position of the Mars Rover. You only need to know if it changed things relevant to *your current goal*.
  *   **The Fix:** Contextual Scoping.
  *   **Implementation:** Tag your state variables with **Dependencies**.
      *   Action: `Vacuum(Kitchen)`
      *   Effects: `Floor_Clean(Kitchen) = True`, `Dust_Bin_Level += 1`
      *   **Invalidates:** `Cat_Location` (if Cat is in Kitchen), `Rug_Position` (if Rug is in Kitchen).
      *   **Does NOT Invalidate:** `Cat_Location` (if Cat is in Bedroom), `Fridge_Contents`.
  *   **Why this works:** You aren't saying "The cat never moves." You are saying "My vacuuming action provides no evidence that the cat moved *unless the cat was in the vacuum's path*." This drastically reduces the re-planning surface area.

  ### 4. Embrace Probabilities (The "Backend Dev" Special)
  In classical planning, things are True or False. In the real world, things are Probabilistic.
  *   **The Fix:** Belief States.
  *   **Implementation:** Instead of `Cat_Location = Sofa`, store `Cat_Location = {Sofa: 0.8, Kitchen: 0.1, Unknown: 0.1}`.
  *   When you vacuum the kitchen, you update the probabilities. If the cat was on the sofa, the probability stays high. If the cat was in the kitchen, the probability of it being there drops to 0, and it redistributes to likely hiding spots.
  *   **Tech:** Look into **Partially Observable Markov Decision Processes (POMDPs)**. It sounds scary, but libraries like `pomdp-py` exist. It allows you to plan based on "most likely state" rather than "absolute truth."

  ### Summary of Actionable Steps

  1.  **Stop trying to solve the Frame Problem logically.** You can't list non-effects.
  2.  **Add Sensors.** If you can't sense the cat, you can't know where the cat is. No amount of logic replaces data.
  3.  **Implement an Execution Monitor.** Before every step, check: "Is my world model still valid?" If not, re-plan locally.
  4.  **Isolate State.** Divide your house into zones. Actions in Zone A should not invalidate the state cache of Zone B unless there is a known dependency (e.g., a door connecting them).
  5.  **Accept Failure.** If the robot gets stuck because the cat sat on the charger, that's not a bug in your logic; it's an exception in the environment. Catch it, wait, and retry.

  **The Verdict:**
  It is not a hack to assume things stay the same *within a specific context and timeframe*. It is a hack to assume they stay the same *forever*.

  Shift your architecture from **Classical Planning** (static world) to **Robust Execution** (dynamic world). Your roommate is thinking like a logician; you need to think like a distributed systems engineer. The world is an unreliable network; design for failure.
