prompt: |-
  Two historians of science are arguing about wether big discoveries are inevitable. One says: if Darwin had dropped dead in 1840 we'd still have had natural selection by 1870 — Malthus, Lyell, the whole Victorian stew was sitting there waiting, and Wallace basically proves the point by getting there on his own. The other says that's hindsight talking: the theory Darwin actually built was one guy's contingent achievement, down to the specific arguments he chose, and if Wallace's version had been the one that stuck we'd have gotten something noticeably different.

  Let them go at it. Give them something concrete to fight over: a grad student turns up a letter from 1839 by some now-forgotten Scottish doctor that lays out essentially the whole mechanism of natural selection in three pages — sealed in a box, never sent to anyone, and no sign anyone ever read it. Does that count as a discovery? Does it help or hurt the "it was inevitable" line? And should credit go to whoever thought of a thing first, or to whoever got everyone else to believe it? Each one should respond to what the other actually said rather than talking past them, and neither should be a pushover.

  Finish with a JSON summary: "crux" (one sentence on what they're really disagreeing about), "letter_counts_as_discovery" (yes/no/qualified, plus a few words why), "best_case_for_inevitability", "best_case_for_contingency", "points_of_agreement", "left_unresolved".
