answer: |-
  **Dr. Aris Thorne:** "You're looking at that letter like it's a corpse, Elena. It's a birth certificate. If this Scottish doctor—MacBain, let's call him—wrote down the mechanism of natural selection in 1839, two decades before the *Origin*, then the 'ripe time' hypothesis is vindicated. The intellectual conditions were sufficient. Darwin didn't conjure the ghost; he just gave it a body. This proves the discovery was inevitable."

  **Dr. Elena Corvis:** "It proves nothing of the sort, Aris. It proves that a man sat in a room and thought a thought. That's philosophy, not science. A discovery requires a discoverer and a community to recognize the finding. This letter was sealed in a box. It had zero causal power on the development of biology. If I write a symphony and lock it in a safe, did I change music history? No. Darwin didn't just 'find' natural selection; he built the evidentiary fortress that forced the Victorian scientific establishment to accept it."

  **Thorne:** "You're conflating the *fact* with the *reception*. The mechanism of natural selection is a feature of the biological world, not a social construct. MacBain saw the feature. Darwin saw the feature. Wallace saw the feature. That triad suggests the feature was visible to anyone looking with the right tools—Malthus, Lyell, breeding manuals. The letter shows the tools were available. If MacBain had mailed it, Darwin is a footnote. That's the definition of inevitability: the specific agent is interchangeable."

  **Corvis:** "But he didn't mail it. And that's the contingency! You say the agent is interchangeable, but the *argument* isn't. We know Wallace's version was different—leaner, less evidentiary weight. If MacBain's letter had been the one that surfaced, maybe it lacks the 'wedge' metaphor, maybe it lacks the chapter on instinct. Maybe it gets laughed out of the Linnean Society like Waterston did. Darwin's genius wasn't seeing the mechanism; it was anticipating the objections. This letter actually hurts your argument, Aris. It shows an idea can exist in the 'zeitgeist' and still fail to become science. It takes a specific kind of labor to turn a thought into a fact."

  **Thorne:** "So credit is a popularity contest? You're saying truth doesn't matter until a quorum agrees? That's dangerous historiography. If MacBain's letter outlines the same mathematical logic as Darwin, the priority of thought belongs to MacBain. We acknowledge that in math all the time. If Gauss sits on a proof for ten years and Legendre publishes it, Legendre gets the credit, but we acknowledge Gauss found it first. The discovery happened in the mind. The publication is just logistics."

  **Corvis:** "Science isn't math. In math, the proof is the end. In natural science, the theory is a tool for further research. Darwin's theory *worked* because it opened doors for others—Hooker, Huxley, Gray. They could use it. MacBain's letter is a dead end. If we give credit for 'thinking it first' regardless of impact, we fill our textbooks with cranks and loners who guessed right but contributed nothing to the collective enterprise. Credit belongs to the one who made it stick, because 'sticking' is what allows the next discovery to happen. Inevitability isn't about the idea appearing; it's about the idea surviving."

  **Thorne:** "But the survival depends on the idea's robustness, which implies it was 'ready' to survive. You're arguing that Darwin's social capital was the variable. I'm arguing the *data* was the variable. This letter confirms the data was accessible. If three men find the same key independently, the lock was waiting to be opened. Whether MacBain used his key is irrelevant to the fact that the lock was pickable. The discovery of the lock's vulnerability is inevitable. You're fetishizing the locksmith."

  **Corvis:** "And you're fetishizing the lock. Science is the *turning* of the key. Without the turn, the door stays shut. If MacBain's letter had contained a fatal flaw that Darwin caught and fixed, would you still call MacBain the discoverer? Probably. But then you're crediting a mistake. Darwin's version won because it was *better*, not just because it was 'time.' That's contingency. It depends on Darwin's specific health, his wealth allowing him to research without a job, his correspondence network. Remove Darwin, maybe we wait another fifty years for someone with his specific resources. The letter doesn't prove inevitability; it proves loneliness."

  **Thorne:** "It proves the concept was in the air. That's the point. The 'Victorian stew' you mocked earlier? MacBain is proof it was cooking everywhere. If the idea is floating around unsent in boxes and published in journals simultaneously, the pressure is systemic. You can't reduce that to one man's wealth or health. The system produces the theory. Darwin is just the nozzle."

  **Corvis:** "The system produces *candidates*. The community selects the *theory*. Selection is the point. Natural selection itself is a filter, Aris. Why treat the history of science differently? MacBain was a variant. Darwin was the variant that fit the environment. That's not inevitability; that's ecological contingency. If the environment changes—if the Church crackdowns harder, if the publisher goes bust—the variant dies. This letter is a fossil of a species that went extinct before it lived. Studying it tells us about potential, not history."

  **Thorne:** "History is built on potentials that became actuals. If the potential is this widespread, the actualization is statistically near-certain. That's my definition of inevitable. High probability approaches certainty. MacBain raises the probability."

  **Corvis:** "And I say probability isn't destiny. Until the box was opened, MacBain was nothing. Now he's a footnote. Darwin remains the architect. You want to credit the blueprint found in a drawer; I credit the building that stands."

