answer: |-
  You have stumbled onto one of the most important mechanisms in human cooperation, economics, and political science. It is not weird; it is actually the engine that allows diverse groups to live together without constant conflict.

  The specific political term you are looking for is **Logrolling**. However, "logrolling" often carries a cynical connotation in politics (implying corruption or pork-barrel spending). A more neutral, broader term from negotiation theory is **Integrative Bargaining** (specifically, trading on differing valuations). In economics, this is a **Pareto Improvement** achieved through **Gains from Trade**.

  But since you asked for the concept to be "carved up" rather than just named, let's break down exactly what this move is, why it feels different from compromise, where the moral boundary lies, and when it stops working.

  ### 1. The Mechanism: Intensity vs. Position
  To understand why this isn't just "compromise," you have to look at what is being traded.

  *   **Regular Compromise (Distributive Bargaining):** This assumes a fixed pie. If we have one dollar, and I want it all, and you want it all, we meet in the middle at 50 cents each. We both lose 50 cents of value. We walk away unhappy. This happens when we care about the **same thing** to the **same degree**.
  *   **Your Move (Integrative Bargaining):** This assumes the pie can grow. It relies on **asymmetric intensity of preference**.
      *   You value the Weight Room at 10 points and Music at 2 points.
      *   She values Music at 10 points and Weight Room at 2 points.
      *   If you fight, you might get 5 points of value each (average).
      *   If you trade, you get 10 (your priority wins) and she gets 10 (her priority wins).
      *   Total value created: 20 points vs 10 points.

  You aren't trading "principles." You are trading **effort** and **political capital** on issues where your internal valuation differs. You are exploiting the fact that your "2 points" of interest in music are worth less to you than her "10 points" of interest in music are worth to her.

  ### 2. Why It Feels "Wrong" (The Moral Discomfort)
  You mentioned it feels like you "put a price on principles." This is a profound philosophical intuition.

  *   **Sacred vs. Secular Values:** Psychologists Philip Tetlock and others distinguish between "sacred values" (things we treat as infinite/moral imperatives, like human rights or justice) and "secular values" (preferences, like budget allocations or chores).
  *   **The Taboo Trade-off:** When you trade secular values (weights vs. music), it feels pragmatic. When you try to trade sacred values (e.g., "I'll vote for your human rights bill if you vote for my tax cut"), it feels repulsive. It feels like corruption.
  *   **Why your case is okay:** In your school example, neither of you viewed the other's preference as *immoral*. You viewed it as *less important*. You didn't say, "Music is evil." You said, "Music is less important to me than weights." That allows the trade to remain in the realm of **preferences**, not **morals**.

  The "wrongness" you feel is the friction of treating a value-based decision like an economic transaction. But in a pluralistic society, this is often the only way to function. If we couldn't do this, every minor policy difference would become a holy war.

  ### 3. The Boundaries: When Does It Stop Working?
  You asked about the edges of this concept. Here is where the mechanism breaks.

  **A. The "Moral Hazard" Edge (Is the other thing *bad*?)**
  You asked: *"Does it stop being ok if one of us actually thinks the others thing is bad?"*
  **Yes.** This is the hard limit of logrolling.
  *   **Scenario:** You want weights. Your friend wants to defund the music program to buy cigarettes for students.
  *   **Result:** You cannot trade. Even if you care more about weights, supporting something you view as *actively harmful* violates a moral constraint.
  *   **Why:** Logrolling requires that the issues be **incommensurable but permissible**. If one issue is "Good" and the other is "Evil," you cannot trade. If one issue is "Good" and the other is "Less Good," you can trade.

  **B. The "Same Thing" Edge**
  You asked: *"Does it only work when the two people care about different things?"*
  **Mostly, yes.**
  *   If you both care *only* about the Weight Room, you cannot trade. You are in a zero-sum conflict.
  *   However, it can work if you care about the same *goal* but prefer different *methods*.
      *   *Example:* You both want a better school. You think weights make students healthier. She thinks music makes students healthier.
      *   If you can frame it as "We both want health," you might trade: "I'll support music now if we promise to review weights next year." This is less efficient than your original scenario, but still a form of trade.

  **C. The "Repeated Game" Edge**
  Logrolling relies on **trust**.
  *   In your chore example, it worked because you live together. You know if you do the dishes, he *will* take out the trash.
  *   In politics, this often fails. Politician A votes for Politician B's bill, but then Politician B reneges on the deal.
  *   For this move to count as "cooperation" rather than "exploitation," there must be an expectation of future interaction. If you never see your friend again, she has no incentive to hold up her end of the bargain after you vote for music.

  ### 4. Is it Logrolling or Horse Trading?
  *   **Horse Trading:** This is the colloquial ancestor. It implies a shrewd, perhaps slightly unscrupulous negotiation. It focuses on the *act* of swapping.
  *   **Logrolling:** This is the political science term. It specifically refers to **voting**. "I roll your log (help you pass your bill), you roll mine." This is exactly what you did with the fundraiser vote.
  *   **Integrative Negotiation:** This is the business/psychology term. It frames the move positively. It focuses on *creating value* rather than *swapping favors*.

  **Which one are you doing?**
  You are doing **Logrolling** via **Integrative Negotiation**.
  It is *Logrolling* because it involves voting/campaigning.
  It is *Integrative* because you both ended up happier (positive-sum) rather than split-the-difference (zero-sum).

  ### 5. Summary of the Concept
  Here is the conceptual carving you asked for:

  1.  **Core Requirement:** Both parties must have **different intensity rankings** for different issues. (I care A > B; You care B > A).
  2.  **The Action:** Decoupling the vote/opinion from the preference. I vote for B even though I prefer A, in exchange for you voting for A.
  3.  **The Outcome:** **Pareto Improvement.** Both parties are better off than the status quo or the compromise position.
  4.  **The Moral Limit:** The issues must be **preferences**, not **moral imperatives**. If one party views the other's issue as sinful/harmful, the trade collapses.
  5.  **The Social Requirement:** **Reciprocity.** There must be a mechanism (friendship, contract, repeated interaction) to ensure the trade is honored.

  ### Conclusion
  You haven't done anything wrong. You have engaged in **rational cooperation**.

  The feeling that it is "wrong" comes from a philosophical idea called **Deontology**, which suggests certain duties (like voting for what you truly believe is best) are absolute and shouldn't be traded.

  However, the outcome you achieved aligns with **Utilitarianism**, which suggests the best action is the one that maximizes overall happiness. By trading, you maximized the total happiness of you and your friend.

  In a complex world where people value different things, refusing to "trade" often leads to gridlock where nobody gets what they want. Accepting that you can support a "lesser good" for someone else in exchange for them supporting your "greater good" is not selling out your values. It is acknowledging that in a community, **your preference is not the only one that matters.**

  So, yes: It is **Logrolling**. But don't let the cynical political connotation fool you. In your context, it was a sophisticated act of conflict resolution that turned a zero-sum fight into a win-win.
