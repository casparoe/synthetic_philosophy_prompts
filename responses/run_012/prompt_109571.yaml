      *   *Verdict on Procedure:* It likely *does not* escape manipulability. The Borda component is vulnerable. The acceptability threshold is vulnerable (strategic nomination/vetoing). The lottery adds complexity but doesn't inherently remove strategic incentives (manipulation of probabilities).

