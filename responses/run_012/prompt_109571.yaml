      *   *Procedure Feature 1: Probabilistic Outcome.* The lottery introduces randomness. G-S applies to *deterministic* social choice functions. Gibbard (1978) extended this to probabilistic schemes, but the constraints are different. Does a 50/50 lottery between Condorcet and Borda count as a "social choice function" in the G-S sense? Strictly speaking, G-S is about deterministic maps from profiles to single winners. If the output is a probability distribution, the original G-S theorem doesn't directly apply, but a generalized version (Gibbard 1978) might. However, the prompt asks to weigh the *advocate's* claim that the lottery escapes the theorem.
      *   *Procedure Feature 2: Acceptability Threshold.* This restricts the *range* or the *domain*. If an alternative is eliminated, it's not in the range for that profile. G-S requires the *range* of the function (over all possible profiles) to contain at least 3 alternatives. If the threshold is high enough, the effective range might drop below 3 in practice, but formally, if 3 *can* survive, the theorem looms. More importantly, asking voters for "acceptable" sets alongside rankings changes the input message space. It's no longer a pure ranking mechanism. This looks like a domain restriction or a change in the mechanism type (not a standard Social Choice Function).
