      *   *Difference:* Briony *confesses* the lie. National myths often hide their construction. Briony's motive is guilt/atonement; National myth's motive is often cohesion/identity.
      *   *Verdict:* It is the *same move* structurally (narrative repair), but the *ethical stance* differs because of the meta-fictional confession.

