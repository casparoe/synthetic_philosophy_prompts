  I'm putting together a long-form interview for a small podcast with a colleague who's just pubished a book on personal origins, and I want questions that actually dig in rather than let her restate the thesis for twenty minutes. Her line: it's true you couldn't have come from a different sperm and egg, but she thinks that's a misleading way of putting it — what's essential to you isn't the gametes, it's the particular conception event, the token fusion that produced you. So in a world where the very same sperm and egg fuse a moment later, that person isn't you. Give me nine or ten questions, with at least one each on the monozygotic twinning case (one fusion, two people — so how can the event be what's essential?), on three-parent embryos and mitochondrial donation, and on whether events are individuated by their participants, because if they are I dont see how the gamete essentialism she started out with doesn't just walk back in. Press her where she's softest, and for each question give me the follow-up she's most likely to need. British English throughout, please.
