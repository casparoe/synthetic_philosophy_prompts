      2.  Hart's Challenge: The Separation Thesis & The "Honest Retroactivity" preference.
      3.  Hart's Escape: The Interpretive Route (Prong 1) & Strasbourg.
      4.  Fuller's Challenge: The 8 Desiderata & The "Secret Order" (Congruence/Publicity).
      5.  Fuller's Limit: Substantive Injustice vs. Procedural Failure (Radbruch distinction).
      6.  Retroactivity: Is Natural Law Idle?
      7.  Conclusion: What the debate actually is (Intellectual Honesty vs. Moral Necessity).

