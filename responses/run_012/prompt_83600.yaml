      *   **Specific Case:** 78-year-old woman, moderate dementia, cheerful/content now, previously signed directive requesting aid in dying at "severe cognitive decline." Daughter wants to honor directive; son argues present contentment overrides it. Jurisdiction allows such directives but is silent on conflicts between past competence and present contentment.
      *   **Constraints:**
          *   Act as a philosopher-historian with deep expertise in Hume (moral psychology, passions, sympathy, natural/artificial virtues, critique of religion).
          *   Do *not* reduce to slogans (autonomy/sanctity of life).
          *   Show how sentiment, utility, character, and promising shape the verdict.
          *   Address the distinction between philosophical defense and public policy recommendation.
