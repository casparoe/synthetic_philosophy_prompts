      *   **Requirements:** Identify genuinely open vs. "moved on" questions. Specify triggers for re-ranking over the next 2 years. No reading lists.

  2.  **Evaluate Candidate Items against Constraints:**
      *   *(a) Dilation:* Philosophically interesting, but does it change policy reports? Often seen as a bug, sometimes a feature. Hard to prove "defect" vs "verdict" without empirical grounding. Might be too philosophical for the "practical consequence" constraint.
      *   *(b) Learning/Washing out:* Crucial for long-run risk. If imprecision washes out quickly, why bother? If it widens, that's counter-intuitive. High upstreamness. Tractable theoretically. High practical consequence (long-term projections).
      *   *(c) Decision Rules:* Directly changes recommendations. High practical consequence. Upstream (you can't act without a rule). Tractable (theoretical comparison).
      *   *(d) Sequential Decisions:* Policy is rarely one-off. Dynamic consistency is a major theoretical hurdle. High upstreamness. Tractable (tree problems). High consequence (path dependence in policy).
      *   *(e) Computation:* If it's not computable, it's useless. But a theory group might struggle with heavy algorithmic work. However, *representational* tractability is theoretical. High practical consequence (can we actually run it?).

  3.  **Evaluate User's Ideas:**
      *   *Imprecision Laundering:* This is a sharp critique of the interface between (b) Belief and (c) Action. It's essentially asking if the decision rule negates the benefit of the belief model. It is distinct from (c) because (c) asks "which rule?" while Laundering asks "do *any* of these rules betray the IP ethos?"
      *   *Value of Imprecision:* Analogy to Value of Information (VoI). VoI says information is never negative (in standard decision theory). Does "imprecision" have negative value? Or can deliberate vagueness be robust? This touches on (b) and (c).

  4.  **Determine "Genuinely Open" vs. "Moved On":**
      *   *Dilation:* Heavily debated in 90s/00s (Herron, Seidenfeld, Wasserman). Consensus is mixed but largely "it's a feature of the model, not a bug," though computationally annoying. Might be "moved on" in the sense that the mathematical conditions are known, but the normative interpretation is still sticky.
      *   *Decision Rules:* Still very active. No consensus on *the* rule.
      *   *Sequential/Dynamic Consistency:* Seidenfeld's work is classic, but still a major barrier to adoption. Very open in terms of practical implementation.
      *   *Learning:* Convergence theorems exist (e.g., Walley), but the rate and conditions for *widening* are less explored in policy contexts.
      *   *Computation:* Huge practical barrier. Theoretical bounds are needed.

  5.  **Drafting the Ranking (Iterative Process):**

      *   *Priority 1: Decision Rules & Laundering (Merging c + User Idea 1).* Why? Because without a decision rule, the risk assessment reports nothing. If the rule launderes the imprecision, the whole project is moot. This hits "Practical Consequence" hardest.
      *   *Priority 2: Sequential Decisions (d).* Policy is dynamic. If IP forces dynamic inconsistency or paralysis, it fails the "policy" test. This is upstream of application.
      *   *Priority 3: Learning & Washing Out (b + User Idea 2).* Long-run risk depends on how beliefs evolve. If imprecision vanishes too fast, IP is useless. If it explodes, it's useless. The "Value of Imprecision" idea fits here as a theoretical bound.
      *   *Priority 4: Computation (e).* Important, but maybe too engineering-focused for a *theory* group? However, *representational* complexity is theoretical. Let's keep it but rank lower than normative foundations.
